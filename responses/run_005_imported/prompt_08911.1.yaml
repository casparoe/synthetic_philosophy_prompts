answer: |-
  That's a razor-sharp debate you two had – you've nailed the core tension in Davidson's anomalous monism (AM) and Kim's critique. Let's break down both moves properly and see if AM can truly dodge the exclusion problem.

  **1. Your Friend's Move: The Token Identity Dodge**

  *   **Davidson's Core AM Theses:**
      *   **Principle of Causal Interaction (PCI):** Mental events causally interact with physical events.
      *   **Principle of the Nomological Character of Causality (PNCC):** Events related as cause and effect fall under strict deterministic laws.
      *   **Anomalism of the Mental (AM):** There are no strict (exceptionless) psychophysical or psychological laws. Mental concepts are irreducible to physical concepts.
      *   **Token Identity (TI):** Every mental event *is* (identical to) some physical event. (This is derived from PCI + PNCC + AM: the only laws covering causal relations are physical laws, so the cause/effect events must be describable in physical terms, hence physical events).
  *   **Your Friend's Argument:** Kim's exclusion argument starts with the threat of causal overdetermination: a physical effect P* seems to have both a physical cause (P) *and* a distinct mental cause (M). Kim argues one must be excluded as genuinely causal. Your friend points out that AM avoids this *entirely* at the *event level* because M *is* P (token identity). There is only *one* event (M/P) causing P*. Therefore, there's no "second cause" to exclude. Kim's dilemma (overdetermination or epiphenomenalism) never gets off the ground. The causal work is done by the physical event, which *is* the mental event.

  **2. Your Move: The Property-Level Problem**

  *   **Kim's Exclusion Argument (Crux):** Kim shifts the focus from *events* to the *properties* in virtue of which an event causes an effect. Causation isn't just about *that* an event caused something, but *why* it caused it – which properties were efficacious.
  *   **The Property Exclusion Problem for AM:**
      1.  The physical event M/P causes effect E (say, P*).
      2.  M/P has both mental properties (M-properties) and physical properties (P-properties).
      3.  According to PNCC, the causal relation between M/P and E is backed *only* by strict physical laws.
      4.  These physical laws mention, necessitate, and depend on the *physical properties* of M/P (e.g., specific neural firing patterns, neurotransmitter releases).
      5.  The mental properties (M-properties) of M/P *do not* figure in any strict laws (AM). They are anomalous.
      6.  **Question:** What causal work do the M-properties do? If the physical properties are sufficient (given PNCC and the completeness of physics), and the M-properties are distinct (AM) and not covered by the laws backing the causation, then it seems the M-properties are *causally irrelevant* to E.
      7.  **The Dilemma:** Either:
          *   The M-properties *overdetermine* E (alongside the P-properties), which seems implausible and arbitrary for all mental causation, or...
          *   The M-properties are *epiphenomenal* – they are present but play no genuine causal role in bringing about E. The causation is done *solely* by the P-properties.
  *   **Your Argument Summarized:** You agree the *event* M/P causes E. But you argue that Davidson's AM, specifically the combination of PNCC (causation requires physical laws) and AM (no strict psychophysical laws), means that *only the physical properties* of the event M/P are doing the real causal work described by those laws. The mental properties are just a way of *describing* the event that plays no role in the causal mechanism itself. They are causally inert passengers.

  **Can Anomalous Monism Dodge Exclusion? The Verdict**

  Your friend's move is valid *at the event level*, but **Kim's property-level critique, which you articulated perfectly, is widely seen as landing a devastating blow to AM's claim that mental properties are genuinely causally efficacious.** Here's the assessment:

  1.  **Token Identity Doesn't Save Mental Properties:** TI successfully avoids event-level overdetermination. However, it does *not* automatically guarantee that *all* properties of the token event are causally efficacious. Kim forces us to ask: *Which properties of this event were relevant for causing the effect?* AM struggles to show mental properties are relevant.
  2.  **The Problem of Relevance:** PNCC + Completeness of Physics strongly suggests that the causally relevant properties for any physical effect are *physical* properties governed by physical laws. Mental properties, being anomalous and irreducible (AM), seem excluded from this domain of law-governed efficacy.
  3.  **Davidson's (Limited) Resources & Responses:**
      *   **Causation as Primitive?:** Davidson sometimes treats the causal *relation* between events as primitive. If causation is just a relation between concrete events simpliciter, then *all* true descriptions of the cause (physical and mental) pick out the same causally efficacious event. This tries to sidestep the "in virtue of which properties" question. Critics (like Kim) argue this ignores how science *explains* causation via properties and laws.
      *   **Supervenience:** Davidson adds mental supervenience on the physical: no mental difference without a physical difference. He *might* argue this ensures mental properties track the causally efficacious physical properties, giving them a derivative relevance. However, Kim counters that supervenience without reduction still leaves the mental properties *determined by* but not *determining* the physical effects – they are still screened off. Supervenience shows dependence, not efficacy.
      *   **Explanatory Relevance vs. Causal Efficacy:** Davidsonians might argue mental properties are *explanatorily* relevant in the space of reasons, even if not covered by strict laws. Kim would likely dismiss this as conceding causal inefficacy at the physical level.
      *   **Rejecting the Causal Closure/Completeness of Physics?** This is a nuclear option Davidson explicitly rejects. PNCC commits him to physics having causal primacy.

  **Conclusion: Token Identity Plus Quiet Epiphenomenalism?**

  While Davidson's TI avoids the *initial formulation* of overdetermination at the event level, **Kim's property-level exclusion argument strongly suggests that, within AM's own framework (PNCC + AM), mental properties are indeed epiphenomenal with respect to physical effects.** The combination of:

  1.  Causation requiring physical laws (PNCC),
  2.  Physics being causally complete (implied by PNCC),
  3.  Mental properties not figuring in strict laws (AM), and
  4.  The supervenience relation not establishing causal efficacy for mental properties,

  ...creates overwhelming pressure towards the conclusion that only the physical properties of the token event are doing the causal work. The mental properties, while real and supervenient, appear to be causally inert "along for the ride" when it comes to producing physical effects. **Your analysis hits the mark: AM seems to entail token identity plus the epiphenomenalism of mental properties with respect to physical causation.**

  Davidsonians fight valiantly against this conclusion, often appealing to the irreducibility of rational explanation or a deflationary view of causation. However, most contemporary philosophers of mind find Kim's critique persuasive against AM. Your debate captured the core issue perfectly – you correctly identified the fatal weakness at the property level that your friend's event-level defense couldn't resolve. Neither of you should have budged; it's one of philosophy's genuinely tough knots! AM provides a unique, elegant, but ultimately fragile solution to the mind-body problem.
