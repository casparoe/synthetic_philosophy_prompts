answer: |-
  Here's a joke crafted specifically for your Parfit's Hitchhiker presentation, playing on the rational irrationality and the divergence between CDT/EDT and FDT:

  **The Joke:**

  > A CDT agent and an FDT agent are both stranded in the desert. The same quirky Driver pulls up to each in turn.
  >
  > **To the CDT Agent:** "Hop in! I'll get you to town. Just promise you'll pay me $100 once we're safe."
  > *The CDT Agent thinks:* "Once I'm safe, paying won't cause me to *be* safe, and keeping the money is best *then*. But... the Driver probably knows this... hmm. Okay, deal." *(Climbs in)*
  > *(They drive to town. CDT Agent refuses to pay.)*
  > **Driver:** "Knew it! That's why I never pick up EDT agents either. Off you go... enjoy the walk back to the desert!"
  >
  > **Driver pulls up to the FDT Agent:** "Same deal: Ride for a promise of $100 in town."
  > *The FDT Agent thinks:* "What kind of decision-outputting *function* am I? If I'm the type that pays upon arrival *even when it gains me nothing directly*, then Drivers *like this one* will pick me up *now*. That gets me to town. So, I *am* that function. Deal." *(Climbs in)*
  > *(They drive to town. FDT Agent hands over $100.)*
  >
  > **Driver:** "Pleasure doing business! Say... why'd you pay? You're safe now, the money does nothing for you here."
  >
  > **FDT Agent:** *"Because if I didn't, you wouldn't have picked up the version of me that was stranded in the desert!"*
  >
  > **Driver:** "...Get out."
  >
  > **FDT Agent:** "...What? Why?"
  >
  > **Driver:** "That answer makes *way* too much sense for this desert. You're clearly an interdimensional logic smuggler. My cab, my rules. Out!"

  **The One-Line Explanation (for after the laugh):**

  > "Functional Decision Theory (FDT) gets you the ride because it chooses actions based on the *type of decision-maker* you are, ensuring cooperation from agents who can predict your reasoning, unlike CDT and EDT which get stranded by their 'locally rational' refusal to pay."

  **Why this works for your audience:**

  1.  **Targets the Specific Puzzle:** It directly references the core conflict: the "locally rational" (CDT/EDT) refusal to pay *once in town* being the very reason the Driver won't pick you up.
  2.  **Highlights CDT/EDT Agreement & Failure:** The Driver explicitly groups CDT and EDT together ("Knew it! That's why I never pick up EDT agents either") and strands the CDT agent *because* of the refusal that both theories endorse.
  3.  **Shows FDT's Mechanism:** The FDT agent's internal monologue clearly explains the counterfactual reasoning: "If I *were* the type to pay, I *would be* picked up." The punchline ("Because if I didn't, you wouldn't have picked up the version of me that was stranded in the desert!") perfectly encapsulates FDT's focus on the output of the decision *function* across different instances/situations.
  4.  **Requires Puzzle Knowledge:** The humor relies entirely on understanding *why* the Driver strands the CDT agent and *why* the FDT agent's answer is the logically correct one that *should* work. Someone unfamiliar with the puzzle or the decision theories won't get why the Driver's final reaction ("That answer makes *way* too much sense...") is funny – it highlights the absurdity of the *desert scenario* punishing the *correct* (FDT) reasoning, just like it punishes the locally rational (CDT/EDT) reasoning.
  5.  **Provides Clear Explanation:** The one-liner succinctly defines FDT's core differentiator – choosing based on the *type of decision-maker* you are to ensure desirable counterfactuals.

  This joke should land well with your philosophy club, especially after they've been primed on the puzzle, and the explanation ensures everyone grasps the key takeaway about FDT. Good luck with the presentation!
