  ## SCR Port & Principles

  **Setting:** The Senior Common Room of an Oxford college. June 1956. The heavy scent of port and cigar smoke hangs in the air. Wood panelling gleams softly in the lamplight. Half a dozen dons linger after dinner. The conversation, initially desultory, has turned inevitably to the impending Convocation vote on Harry Truman's honorary degree. All eyes are on Elizabeth Anscombe and Gerald Fenwick, seated opposite each other. Anscombe’s expression is fiercely focused; Fenwick wears an air of weary frustration.

  **Characters:**
  *   **Elizabeth Anscombe:** Philosopher, Fellow. Intense, precise, morally uncompromising.
  *   **Gerald Fenwick:** Tutor in Moral Philosophy (Fictional). Mid-50s, pragmatic, believes philosophy must engage with the real world's messy choices.

  **(The scene opens mid-argument, Fenwick gesturing with his port glass.)**

  **Fenwick:** Elizabeth, really, must you persist in this... this theatrical opposition? Truman saved countless lives. The invasion of Japan would have been a bloodbath – hundreds of thousands, perhaps millions, dead. Soldiers, yes, but Japanese civilians too, caught in the fighting. The bombs *ended* it. Swiftly. Brutally, perhaps, but decisively. To deny him this honour now smacks of ingratitude, and frankly, makes us look like we’re indulging in moral posturing from the safety of our common room.

  **Anscombe:** (Leaning forward, her voice low but carrying a steely edge) Gratitude? Gerald, we are speaking of murder. Deliberate, premeditated murder on a scale scarcely imaginable. The incineration of two cities. Of civilians. Men, women, children, infants. *That* is what we are being asked to honour. Not ending the war – though it did that – but the *means*.

  **Fenwick:** (Sighs) Murder implies the killing of the *innocent*. But Elizabeth, in a nation mobilised for *total war*, where does innocence truly lie? The factory worker forging the shell casing, the clerk rationing food for the army, the schoolchild collecting scrap metal... are they not participants? Are they not, in a very real sense, part of the war machine? Hiroshima and Nagasaki were not chosen at random; they were legitimate military-industrial targets.

  **Anscombe:** (Shakes her head sharply) No. You equivocate. ‘Innocent’ here does not mean sinless, Gerald. It means simply: *not currently engaged in harming*. Not bearing arms, not directing the war effort at that moment. The old woman in her home, the infant in its cradle – they were *not* combatants. To vaporise them *as a means* to pressure their government into surrender is to use them as mere instruments. It is the very definition of murder. The intention was to kill non-combatants to achieve a political end. That is always, absolutely, wrong.

  **Fenwick:** Absolute? In the abstract lecture hall, perhaps. But on the ground, in August 1945, with the Pacific War raging? Absolutes shatter. You speak of intention. Was the *primary* intention to kill civilians, or was it to destroy vital war production and shatter the enemy's will to fight by demonstrating overwhelming, inescapable force? The latter, Elizabeth. The means were horrific, granted, but the aim was military capitulation. And it worked. It saved lives – Allied *and* Japanese lives – that would have been lost in a prolonged invasion.

  **Anscombe:** You justify it by the consequence. But the end does *not* sanctify intrinsically evil means. The deliberate killing of the innocent *as a means* is never permissible, regardless of the consequence. That is the core of the prohibition. And the ‘unconditional surrender’ demand – that arrogant, inflexible doctrine – is precisely what created the perverse logic that made such methods seem ‘necessary’. It closed the door to any negotiated peace that might have spared those cities.

  **Fenwick:** Negotiated peace? With the Imperial Japanese government? After Manchuria, Nanking, Bataan? Their fanaticism was beyond reason! Unconditional surrender *was* necessary to dismantle that militarist machine utterly. To suggest otherwise is naive revisionism. And as for ‘intrinsically evil’... War itself is intrinsically evil, Elizabeth! Once unleashed, especially a total war like that one, it forces choices between terrible alternatives. To stand on absolute principle while young men are dying in their thousands on Okinawa, while cities are firebombed nightly... that itself can become a luxury of the detached observer. Truman chose the least horrific path available from a menu of horrors. He bore that burden so others might live.

  **Anscombe:** He chose mass murder. He chose to cross a line that should never be crossed. To honour that choice is to endorse it. To say to the world that Oxford University believes the deliberate massacre of non-combatants can be a legitimate tool of statecraft if the stakes are high enough. That is the real ‘moral posturing’ – pretending necessity erases fundamental moral law.

  **Fenwick:** (Drains his port, sets the glass down heavily) And the real detachment, Elizabeth, is pretending that clear moral laws drawn in peacetime can be applied without nuance to the unimaginable calculus of global, industrialised warfare. To refuse any honour to the man who made that agonising, world-saving decision... it diminishes the sheer, brutal weight of the responsibility he carried.

  **(A heavy silence falls. The other dons watch, uncomfortable. Anscombe and Fenwick lock eyes across the polished table. There is no anger left, only a profound, unbridgeable chasm of understanding. They speak simultaneously, their voices quiet, final, each stating the irreducible flaw they see in the other's position.)**

  **Anscombe:** You begin by accepting that consequences can justify the deliberate killing of the innocent.

  **Fenwick:** You begin by refusing to acknowledge that total war obliterates the neat distinction between combatant and innocent you rely upon.

  **(They hold each other's gaze for a moment longer. Anscombe gives a small, tight nod. Fenwick looks away, towards the dying fire. The argument is over. The impasse is complete. The port sits untouched between them.)**
