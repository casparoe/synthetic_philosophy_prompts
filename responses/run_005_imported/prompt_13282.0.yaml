  The twist comes from a behavioral economics survey. When probabilities were scaled down (Program A becomes 20% chance of 150 lives, Program B becomes 15% chance of 220 lives), many who initially preferred the sure thing switched to the riskier option. This is an Allais paradox reversal. The key issue is whether this preference reversal should be treated as a bias to correct or a legitimate value in cost-benefit analysis.

