  I recall that the literature does address this. Authors like Christensen and Briggs have discussed the circularity issue. The user's worry is valid—restricting Reflection to rational updates might make it dependent on prior norms of rationality. That could make it redundant with conditionalization. But some argue it still has value as a coherence constraint.

