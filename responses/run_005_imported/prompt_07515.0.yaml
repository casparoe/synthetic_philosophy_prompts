  ### Example Demonstrating Order-Sensitivity in Jeffrey Conditionalization

  To resolve the dispute, I will construct a simple toy example with three possible worlds, each representing a possible state of the world. We will define propositions \(E\), \(F\), and \(H\), along with a prior probability distribution over the worlds. Jeffrey conditionalization will be applied to \(E\) and \(F\) in two different orders, and we will observe the final probability of \(H\) in each case. The example uses fractions for clarity and ease of verification.

  #### Setup
  - **Possible worlds**: There are three worlds, \(w_1\), \(w_2\), and \(w_3\).
  - **Propositions**:
    - \(E\): True in \(w_1\) and \(w_2\) (so \(E = \{w_1, w_2\}\)).
    - \(F\): True in \(w_1\) and \(w_3\) (so \(F = \{w_1, w_3\}\)).
    - \(H\): True only in \(w_1\) (so \(H = \{w_1\}\)).
  - **Prior probability distribution**:
    - \(P(w_1) = \frac{2}{5}\)
    - \(P(w_2) = \frac{2}{5}\)
    - \(P(w_3) = \frac{1}{5}\)

  From this, we can compute the prior probabilities of the propositions:
  - \(P(E) = P(w_1) + P(w_2) = \frac{2}{5} + \frac{2}{5} = \frac{4}{5}\)
  - \(P(F) = P(w_1) + P(w_3) = \frac{2}{5} + \frac{1}{5} = \frac{3}{5}\)
  - \(P(H) = P(w_1) = \frac{2}{5}\)

  We will perform Jeffrey conditionalization on \(E\) and \(F\) by setting new credences for each, without becoming certain of them. Specifically:
  - For \(E\), we set the new probability \(P_{\text{new}}(E) = \frac{7}{10}\) (so \(P_{\text{new}}(\neg E) = \frac{3}{10}\)).
  - For \(F\), we set the new probability \(P_{\text{new}}(F) = \frac{1}{2}\) (so \(P_{\text{new}}(\neg F) = \frac{1}{2}\)).

  Jeffrey conditionalization works as follows for a proposition \(X\) (e.g., \(E\) or \(F\)):
  - When updating on \(X\), we set the new probability \(P_{\text{new}}(X)\).
  - The conditional probabilities given \(X\) and given \(\neg X\) are preserved based on the current probabilities at the time of update.
  - For any world \(w\), the new probability is scaled based on whether \(w\) is in \(X\) or \(\neg X\):
    - If \(w \in X\), \(P_{\text{new}}(w) = P(w) \cdot \frac{P_{\text{new}}(X)}{P(X)}\)
    - If \(w \in \neg X\), \(P_{\text{new}}(w) = P(w) \cdot \frac{P_{\text{new}}(\neg X)}{P(\neg X)}\)

  We will update in two orders:
  1. **Order 1**: Update on \(E\) first, then on \(F\).
  2. **Order 2**: Update on \(F\) first, then on \(E\).

  After each sequence of updates, we compute \(P(H)\).

  #### Order 1: Update on \(E\) first, then on \(F\)

  **Step 1: Update on \(E\) to \(P_{\text{new}}(E) = \frac{7}{10}\)**
  - Prior: \(P(E) = \frac{4}{5}\)
  - New probabilities:
    - For \(w \in E\) (i.e., \(w_1\) and \(w_2\)): Scale by \(\frac{P_{\text{new}}(E)}{P(E)} = \frac{7/10}{4/5} = \frac{7}{10} \cdot \frac{5}{4} = \frac{7}{8}\)
      - \(P_{\text{new}}(w_1) = P(w_1) \cdot \frac{7}{8} = \frac{2}{5} \cdot \frac{7}{8} = \frac{14}{40} = \frac{7}{20}\)
      - \(P_{\text{new}}(w_2) = P(w_2) \cdot \frac{7}{8} = \frac{2}{5} \cdot \frac{7}{8} = \frac{14}{40} = \frac{7}{20}\)
    - For \(w \in \neg E\) (i.e., \(w_3\)): Scale by \(\frac{P_{\text{new}}(\neg E)}{P(\neg E)} = \frac{3/10}{1/5} = \frac{3}{10} \cdot \frac{5}{1} = \frac{3}{2}\)
      - \(P_{\text{new}}(w_3) = P(w_3) \cdot \frac{3}{2} = \frac{1}{5} \cdot \frac{3}{2} = \frac{3}{10}\)
  - Check: \(P_{\text{new}}(E) = P_{\text{new}}(w_1) + P_{\text{new}}(w_2) = \frac{7}{20} + \frac{7}{20} = \frac{14}{20} = \frac{7}{10}\), correct.
  - After this update:
    - \(P(w_1) = \frac{7}{20}\), \(P(w_2) = \frac{7}{20}\), \(P(w_3) = \frac{3}{10} = \frac{6}{20}\)
    - \(P(H) = P(w_1) = \frac{7}{20}\)

  **Step 2: Update on \(F\) to \(P_{\text{new}}(F) = \frac{1}{2}\) (using probabilities from Step 1)**
  - Current \(P(F) = P(w_1) + P(w_3) = \frac{7}{20} + \frac{6}{20} = \frac{13}{20}\)
  - Conditional probabilities:
    - \(P(w_1 \mid F) = \frac{P(w_1)}{P(F)} = \frac{7/20}{13/20} = \frac{7}{13}\)
    - \(P(w_3 \mid F) = \frac{P(w_3)}{P(F)} = \frac{6/20}{13/20} = \frac{6}{20} \cdot \frac{20}{13} = \frac{6}{13}\)
    - \(P(w_2 \mid \neg F) = \frac{P(w_2)}{P(\neg F)} = \frac{7/20}{7/20} = 1\) (since \(\neg F = \{w_2\}\))
  - New probabilities after updating \(F\):
    - For \(w \in F\) (i.e., \(w_1\) and \(w_3\)): \(P_{\text{new}}(w) = P(w \mid F) \cdot P_{\text{new}}(F)\)
      - \(P_{\text{new}}(w_1) = P(w_1 \mid F) \cdot P_{\text{new}}(F) = \frac{7}{13} \cdot \frac{1}{2} = \frac{7}{26}\)
      - \(P_{\text{new}}(w_3) = P(w_3 \mid F) \cdot P_{\text{new}}(F) = \frac{6}{13} \cdot \frac{1}{2} = \frac{6}{26} = \frac{3}{13}\)
    - For \(w \in \neg F\) (i.e., \(w_2\)): \(P_{\text{new}}(w) = P(w \mid \neg F) \cdot P_{\text{new}}(\neg F) = 1 \cdot \frac{1}{2} = \frac{1}{2} = \frac{13}{26}\)
  - After this update:
    - \(P(w_1) = \frac{7}{26}\), \(P(w_2) = \frac{13}{26}\), \(P(w_3) = \frac{6}{26} = \frac{3}{13}\)
    - \(P(H) = P(w_1) = \frac{7}{26} \approx 0.2692\)

  #### Order 2: Update on \(F\) first, then on \(E\)

  **Step 1: Update on \(F\) to \(P_{\text{new}}(F) = \frac{1}{2}\)**
  - Prior: \(P(F) = \frac{3}{5}\)
  - New probabilities:
    - For \(w \in F\) (i.e., \(w_1\) and \(w_3\)): Scale by \(\frac{P_{\text{new}}(F)}{P(F)} = \frac{1/2}{3/5} = \frac{1}{2} \cdot \frac{5}{3} = \frac{5}{6}\)
      - \(P_{\text{new}}(w_1) = P(w_1) \cdot \frac{5}{6} = \frac{2}{5} \cdot \frac{5}{6} = \frac{2}{6} = \frac{1}{3}\)
      - \(P_{\text{new}}(w_3) = P(w_3) \cdot \frac{5}{6} = \frac{1}{5} \cdot \frac{5}{6} = \frac{1}{6}\)
    - For \(w \in \neg F\) (i.e., \(w_2\)): Scale by \(\frac{P_{\text{new}}(\neg F)}{P(\neg F)} = \frac{1/2}{2/5} = \frac{1}{2} \cdot \frac{5}{2} = \frac{5}{4}\)
      - \(P_{\text{new}}(w_2) = P(w_2) \cdot \frac{5}{4} = \frac{2}{5} \cdot \frac{5}{4} = \frac{2}{4} = \frac{1}{2}\)
  - Check: \(P_{\text{new}}(F) = P_{\text{new}}(w_1) + P_{\text{new}}(w_3) = \frac{1}{3} + \frac{1}{6} = \frac{2}{6} + \frac{1}{6} = \frac{3}{6} = \frac{1}{2}\), correct.
  - After this update:
    - \(P(w_1) = \frac{1}{3}\), \(P(w_2) = \frac{1}{2}\), \(P(w_3) = \frac{1}{6}\)
    - \(P(H) = P(w_1) = \frac{1}{3}\)

  **Step 2: Update on \(E\) to \(P_{\text{new}}(E) = \frac{7}{10}\) (using probabilities from Step 1)**
  - Current \(P(E) = P(w_1) + P(w_2) = \frac{1}{3} + \frac{1}{2} = \frac{2}{6} + \frac{3}{6} = \frac{5}{6}\)
  - Conditional probabilities:
    - \(P(w_1 \mid E) = \frac{P(w_1)}{P(E)} = \frac{1/3}{5/6} = \frac{1}{3} \cdot \frac{6}{5} = \frac{6}{15} = \frac{2}{5}\)
    - \(P(w_2 \mid E) = \frac{P(w_2)}{P(E)} = \frac{1/2}{5/6} = \frac{1}{2} \cdot \frac{6}{5} = \frac{6}{10} = \frac{3}{5}\)
    - \(P(w_3 \mid \neg E) = \frac{P(w_3)}{P(\neg E)} = \frac{1/6}{1/6} = 1\) (since \(\neg E = \{w_3\}\))
  - New probabilities after updating \(E\):
    - For \(w \in E\) (i.e., \(w_1\) and \(w_2\)): \(P_{\text{new}}(w) = P(w \mid E) \cdot P_{\text{new}}(E)\)
      - \(P_{\text{new}}(w_1) = P(w_1 \mid E) \cdot P_{\text{new}}(E) = \frac{2}{5} \cdot \frac{7}{10} = \frac{14}{50} = \frac{7}{25}\)
      - \(P_{\text{new}}(w_2) = P(w_2 \mid E) \cdot P_{\text{new}}(E) = \frac{3}{5} \cdot \frac{7}{10} = \frac{21}{50}\)
    - For \(w \in \neg E\) (i.e., \(w_3\)): \(P_{\text{new}}(w) = P(w \mid \neg E) \cdot P_{\text{new}}(\neg E) = 1 \cdot \frac{3}{10} = \frac{3}{10}\)
  - After this update:
    - \(P(w_1) = \frac{7}{25}\), \(P(w_2) = \frac{21}{50}\), \(P(w_3) = \frac{3}{10}\)
    - \(P(H) = P(w_1) = \frac{7}{25} = 0.28\)

  #### Comparison of Results
  - After updating on \(E\) then \(F\): \(P(H) = \frac{7}{26} \approx 0.2692\)
  - After updating on \(F\) then \(E\): \(P(H) = \frac{7}{25} = 0.28\)

  These are different: \(0.2692 \neq 0.28\), and \(\frac{7}{26} \neq \frac{7}{25}\). Thus, the order of updating affects the final probability of \(H\).

  ### Why Jeffrey Conditionalization Can Be Order-Sensitive
  Jeffrey conditionalization differs from ordinary Bayesian conditionalization in a crucial way, which allows for order-sensitivity:

  - **Ordinary conditionalization**: When an agent becomes certain of a proposition (e.g., learns \(E\) with certainty), they set \(P(E) = 1\) and update by conditioning. Conditional probabilities given \(E\) are preserved, and the order of updating does not matter because conditioning is associative: \(P(H \mid E, F) = P(H \mid F, E)\) if both \(E\) and \(F\) are learned with certainty. The final posterior depends only on the total evidence, not the order.

  - **Jeffrey conditionalization**: Here, the agent does not become certain of the evidence; instead, they assign a new credence to a proposition (e.g., \(P_{\text{new}}(E)\)) based on uncertain information. The update preserves the conditional probabilities given \(E\) and \(\neg E\) (or other partitions) **at the time of the update**. However, these conditional probabilities depend on the current probability distribution when the update is performed. When multiple updates occur, the order matters because each update changes the underlying distribution, affecting the conditional probabilities used in subsequent updates.

  In this example:
  - When updating on \(E\) first, the conditional probability \(P(H \mid F)\) in the second step depends on the distribution after the \(E\)-update.
  - When updating on \(F\) first, the conditional probability \(P(H \mid E)\) in the second step depends on the distribution after the \(F\)-update.
  - Since \(E\) and \(F\) are correlated (they both depend on \(w_1\), where \(H\) is true), the distributions differ, leading to different conditional probabilities and thus different final \(P(H)\).

  This order-sensitivity arises because Jeffrey conditionalization fixes the conditional probabilities relative to the updated proposition only at the moment of update, and these probabilities are not invariant under changes to the distribution from other updates. In contrast, with certain evidence, the conditional probabilities are fixed by the evidence itself, making order irrelevant.

  This example demonstrates that for uncertain evidence updated via Jeffrey's rule, the order of evidence can indeed affect the final beliefs, unlike in the case of certain evidence.
