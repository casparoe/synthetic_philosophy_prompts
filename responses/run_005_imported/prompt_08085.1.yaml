     - It directly applies to historical cases of quantitative theories (e.g., Newton vs Einstein in the limit of low speeds and weak fields) and gives a clear verdict.

   However, note that the quantitative approach is limited to quantitative theories. But since the original problem was motivated by examples that are quantitative (like Newtonian mechanics), and much of modern science is quantitative, this is a strength.

