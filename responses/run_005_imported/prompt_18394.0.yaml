prompt: |-
  Ok so my school's philosophy club somehow landed a real interview — a grad student who works on comparative ethics is coming to talk to us about Confucian role ethics for our "non-western ethics" unit, and a few of us are recording it as a podcast episode. I've been reading the Ames/Rosemont stuff from the library (the idea that the Confucian self isn't some separate individual who happens to occupy roles, but is basically constituted BY the roles and relationships — son, father, ruler, etc. — so there's no "bare" self underneath them) plus a couple of response papers I found while I was supposed to be doing something else. One thing I noticed: whenever someone brings up the obvious objection — like "doesn't this just justify whatever hierarchy you were born into, wife submits to husband, subject submits to ruler" — defenders seem to have this one move where they say the objection only looks like a problem because you're still smuggling in the autonomous, rights-bearing liberal self that role ethics is trying to reject in the first place, so it doesn't even really land as a criticism. I don't want the whole interview to just be that move getting deployed over and over.

  Can you write me like 7-8 interview questions that make that move progressively harder to use? I want the questions to escalate — start with the hierarchy objection in a normal form, then for the follow-up ask her to restate the same worry (maybe using the wife/husband example, or a modern whistleblower who has to break loyalty to their role) WITHOUT using words like "autonomy" or "rights" at all, so the "you're just importing liberalism" dodge isn't available anymore. I also definately want one question (with a good follow-up) on how role ethics is supposed to settle it when two roles actually conflict — there's that classic case, I think its from the Analects or Mencius, about a father who does something wrong and the son covering for him instead of turning him in, and I want to know if "use practical wisdom" is a real answer or just a way of not answering. And one question on whether there's anything left of a person that can step back and judge that a role itself is a bad one to have (like, what does role ethics even say to someone trying to leave an abusive marriage, if "wife" is partly constitutive of who they are rather than a job they can just quit). For each question please add a short follow-up keyed to the answer she'd most likely give, so we're ready instead of just nodding along.
