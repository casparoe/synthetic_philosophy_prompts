  ### Reconstruction of Berker's "Separateness of Propositions" Objection

  #### Core Argument
  Selim Berker's "separateness of propositions" objection targets the foundational structure of epistemic utility theory (EUT), specifically its aggregation of accuracy across all propositions in a credence function. The analogy with the "separateness of persons" in utilitarianism is apt: just as utilitarianism is criticized for allowing one person's welfare to be sacrificed for the greater aggregate good, EUT is criticized for permitting *trade-offs in accuracy* between distinct propositions. When EUT evaluates a credence function by summing a scoring rule (e.g., Brier score) over all propositions, it may reward a function that sacrifices accuracy on one proposition to gain accuracy on another, even if the propositions are intuitively unrelated. This, Berker argues, violates the epistemic norm that each proposition's accuracy should be evaluated independently, without "borrowing" or "lending" accuracy to others.

  The objection is **not** about causal or diachronic effects (e.g., present beliefs promoting future accuracy), which is Berker's separate critique. It is strictly about *synchronic aggregation within a single credence function*.

  #### Why Aggregation Over Propositions Is Problematic
  EUT treats the entire credence function as the unit of evaluation, with epistemic rationality defined by minimizing *expected inaccuracy* across all propositions. This aggregates inaccuracies in a way that mirrors utilitarianism's aggregation of utilities across persons:
  - **Utilitarianism**: Total welfare is the sum of individual welfares. Sacrificing one person's welfare for greater aggregate welfare is deemed objectionable because persons are "separate."
  - **EUT**: Total inaccuracy is the sum of inaccuracies on each proposition. Sacrificing accuracy on one proposition for greater aggregate accuracy is objectionable because propositions are "separate" in their epistemic standing.

  The core issue is that EUT's aggregation fails to respect the *intrinsic epistemic value* of accuracy on each proposition. Accuracy on a proposition like "It will rain today" should not be fungible with accuracy on a wholly unrelated proposition like "Quantum mechanics is true," as they concern distinct epistemic domains.

  ---

  ### Toy Formal Example
  Consider a simple algebra of propositions:  
  - \(P\): "It will rain in Tokyo on January 1, 2100."  
  - \(Q\): "The first human born in 2100 will be named John."  
  Assume \(P\) and \(Q\) are logically independent (no connections in content or truth conditions). The scoring rule is the **Brier score** (a proper scoring rule), defined for a credence function \(c\) and world \(w\) as:  
  \[
  \mathfrak{B}(c, w) = (c(P) - w(P))^2 + (c(Q) - w(Q))^2,
  \]  
  where \(w(X) = 1\) if \(X\) is true at \(w\), and \(0\) otherwise.  

  Now, compare two credence functions, \(c_1\) and \(c_2\), at a world \(w\) where \(P\) is **true** and \(Q\) is **false** (e.g., Tokyo has rain, but the baby is not named John):  
  - \(c_1(P) = 0.7\), \(c_1(Q) = 0.3\)  
  - \(c_2(P) = 0.5\), \(c_2(Q) = 0.5\)  

  **Brier scores at \(w\)**:  
  - For \(c_1\):  
    \[
    (0.7 - 1)^2 + (0.3 - 0)^2 = (-0.3)^2 + (0.3)^2 = 0.09 + 0.09 = 0.18.
    \]  
  - For \(c_2\):  
    \[
    (0.5 - 1)^2 + (0.5 - 0)^2 = (-0.5)^2 + (0.5)^2 = 0.25 + 0.25 = 0.50.
    \]  

  \(c_1\) has a lower (better) total inaccuracy than \(c_2\) (0.18 vs. 0.50). But decompose the results:  
  - On \(P\) (true proposition):  
    - \(c_1\) has inaccuracy \(0.09\) (distance from truth: \(0.3\)).  
    - \(c_2\) has inaccuracy \(0.25\) (distance: \(0.5\)).  
    → \(c_1\) is **more accurate** on \(P\) than \(c_2\).  
  - On \(Q\) (false proposition):  
    - \(c_1\) has inaccuracy \(0.09\) (distance: \(0.3\)).  
    - \(c_2\) has inaccuracy \(0.25\) (distance: \(0.5\)).  
    → \(c_1\) is **more accurate** on \(Q\) than \(c_2\).  

  In this case, \(c_1\) dominates \(c_2\) on both propositions. But now consider a third credence function:  
  - \(c_3(P) = 0.8\), \(c_3(Q) = 0.4\)  

  **Brier score for \(c_3\) at \(w\)**:  
  \[
  (0.8 - 1)^2 + (0.4 - 0)^2 = (-0.2)^2 + (0.4)^2 = 0.04 + 0.16 = 0.20.
  \]  
  Compare \(c_1\) (score 0.18) and \(c_3\) (score 0.20):  
  - On \(P\):  
    - \(c_1\) inaccuracy: \(0.09\)  
    - \(c_3\) inaccuracy: \(0.04\) (better than \(c_1\))  
  - On \(Q\):  
    - \(c_1\) inaccuracy: \(0.09\)  
    - \(c_3\) inaccuracy: \(0.16\) (worse than \(c_1\))  

  \(c_1\) has a better aggregate score than \(c_3\) (0.18 < 0.20), but this arises from a trade-off:  
  - \(c_1\) is *less accurate* on \(P\) than \(c_3\) (0.09 > 0.04).  
  - \(c_1\) is *more accurate* on \(Q\) than \(c_3\) (0.09 < 0.16).  

  **The trade-off in action**:  
  - \(c_1\) "sacrifices" accuracy on \(P\) (inaccuracy increases by 0.05) to "gain" accuracy on \(Q\) (inaccuracy decreases by 0.07), yielding a net improvement of 0.02 in aggregate accuracy.  
  - If \(P\) and \(Q\) are unrelated, this trade-off is epistemically objectionable: why should inaccuracy on a proposition about Tokyo weather be compensated by inaccuracy on a proposition about baby names?  

  This is the essence of Berker's objection: EUT’s aggregation *requires* or *justifies* such trade-offs to minimize total inaccuracy, violating the normative separateness of propositions.

  ---

  ### Best Replies from Accuracy-First Epistemology

  #### Reply 1: Distinguishing Epistemic Consequentialism from Accuracy-First
  Your colleague's distinction is crucial:  
  - **Epistemic consequentialism**: Beliefs are justified *because* they promote accuracy (a causal or teleological claim).  
  - **Accuracy-first epistemology**: Accuracy is a *formal criterion* for evaluating credence functions (e.g., avoiding dominance), without endorsing consequentialism.  

  **How this addresses the objection**:  
  - The trade-off in the example is a feature of the *scoring rule*, not a normative commitment to consequentialism. Accuracy-first epistemology uses scoring rules (e.g., Brier) as a tool to *characterize* coherence (e.g., via dominance arguments), not to reduce justification to accuracy promotion.  
  - Thus, the objection misfires: it conflates the *axiological role* of accuracy (as a measure) with a *consequentialist justification*. Trade-offs arise from the mathematics of dominance, not from a utilitarian-like calculus.  
  - **Strength**: This reply is potent if accuracy-first is framed as a *constraint-based* theory (e.g., "rationality = avoiding accuracy-domination") rather than a *value-promotion* theory. It severs the analogy with utilitarianism.  
  - **Weakness**: It may not fully resolve the intuition that aggregation itself is problematic, even as a formal tool. If "separateness" is a bedrock norm, aggregation might remain objectionable regardless of justification.

  #### Reply 2: Constraints on Legitimate Scoring Rules
  Appeal to formal constraints on scoring rules:  
  - **Propriety**: A scoring rule is *proper* if it incentivizes agents to report their true credences. For example, the Brier score is strictly proper.  
  - **Coherence-admissibility** (Joyce): Scoring rules should satisfy conditions like *convexity* and *truth-directedness* to ensure coherent credences are not dominated.  

  **How this addresses the objection**:  
  - Proper scoring rules prevent "gaming" the system by making trade-offs irrational *ex ante*: if \(c\) is probabilistic, no other \(c'\) has lower expected inaccuracy. In the example, if \(c_3\) is incoherent, a proper rule ensures it is dominated by a coherent function.  
  - This constrains *which* trade-offs are permissible: only those that align with coherence. Trade-offs like \(c_1\) vs. \(c_3\) are artifacts of the scoring rule, but propriety ensures they don’t justify incoherence.  
  - **Strength**: This grounds the theory in formal virtues, sidestepping "separateness" by showing that aggregation is necessary for coherence.  
  - **Weakness**: It doesn’t directly address why aggregation over *unrelated* propositions is acceptable; it merely ensures aggregation is "well-behaved."

  #### Reply 3: Holism about Epistemic States
  Defend aggregation as reflecting the holistic nature of epistemic rationality:  
  - Credence functions are unified doxastic states; evaluating them piecewise (proposition-by-proposition) misses their interconnected structure.  
  - Just as scientific theories are judged holistically (e.g., a false auxiliary hypothesis may be tolerated for overall explanatory power), credence functions are evaluated as wholes.  

  **How this addresses the objection**:  
  - Trade-offs are not "sacrifices" but reflections of how beliefs cohere. In the example, \(c_1\)’s scores arise from a globally coherent distribution (e.g., respecting probabilistic axioms), not arbitrary swapping.  
  - **Strength**: This aligns with intuitions about the unity of belief systems.  
  - **Weakness**: It may not satisfy those who see "separateness" as a non-negotiable constraint, especially for propositions with no logical/evidential links.

  #### Overall Assessment
  - **Most promising reply**: The **distinction between consequentialism and accuracy-first** (Reply 1) is the most defensible. It reframes EUT as a formal criterion for coherence, neutralizing the utilitarian analogy. Your colleague is right: Berker's objection conflates the *structure* of EUT with a *consequentialist commitment*.  
  - **Supplementary defense**: Pairing Reply 1 with **propriety constraints** (Reply 2) strengthens the case by ensuring aggregation serves coherence.  
  - **Caveat**: If your seminar treats "separateness" as a primitive epistemic norm, Replies 1–2 may feel evasive. In that case, open discussion about whether holism (Reply 3) can override separateness intuitions would be valuable.  

  Ultimately, the objection highlights a tension between atomistic and holistic epistemologies. Accuracy-firsters can argue that their approach is not utilitarian but *structural*—aggregation is the price of coherence, not the engine of justification.
