  ### Dialogue: The Opened Envelope  
  **Setting:** A quiet study, two philosophers—Alice and Bob—sit across a table. Alice has just opened her envelope, revealing a sum of $10,000. She reaches for the other envelope. Bob gently stops her hand.  

  **Alice:** "Bob, I know what you’re thinking—the two-envelope paradox. But this isn’t the unopened case. I’ve *seen* $10,000. Standard replies about no uniform prior over the reals don’t touch this. With a proper prior over the smaller sum having *finite expectation*, switching isn’t always favored. It depends on the prior’s shape. For many reasonable priors, if $10,000 is likely near the distribution’s mode, switching loses. No paradox."  

  **Bob:** "Ah, but why insist on finite expectation? Expected-value reasoning doesn’t demand it. Consider a proper prior for the smaller sum \(S\): \(P(S = 2^k) = \frac{1}{3} \cdot \frac{1}{2^k}\) for \(k = 0, 1, 2, \ldots\) (so \(S\) takes values 1, 2, 4, 8, ...). It’s normalized—probabilities sum to 1—but \(E[S]\) is infinite. Now, *whatever* sum \(x\) you see, switching has higher conditional expectation."  

  **Alice:** "Let me compute. Suppose I see \(x = 4\). Possible cases:  
  - \(S = 4\) (I hold smaller, other has 8): Probability \(P(S=4) \cdot P(\text{pick smaller}) = \frac{1}{3} \cdot \frac{1}{4} \cdot \frac{1}{2} = \frac{1}{24}\).  
  - \(S = 2\) (I hold larger, other has 2): Probability \(P(S=2) \cdot P(\text{pick larger}) = \frac{1}{3} \cdot \frac{1}{2} \cdot \frac{1}{2} = \frac{1}{12}\).  
  Total probability for \(x=4\): \(\frac{1}{24} + \frac{1}{12} = \frac{1}{8}\).  
  Posterior:  
  - \(P(S=4 | x=4) = \frac{1/24}{1/8} = \frac{1}{3}\),  
  - \(P(S=2 | x=4) = \frac{1/12}{1/8} = \frac{2}{3}\).  
  Expected value of switching: \(E[\text{other} | x=4] = 8 \cdot \frac{1}{3} + 2 \cdot \frac{2}{3} = \frac{8}{3} + \frac{4}{3} = 4\). But 4 equals \(x\)! No gain. Your example fails."  

  **Bob:** "A misstep. My prior was ill-chosen. Try this discrete prior: \(P(S = 2^k) = \frac{1}{2^{k+1}}\) for \(k = 0, 1, 2, \ldots\) (so \(S=1,2,4,8,\ldots\)). Now \(E[S] = \infty\). See \(x=4\):  
  - Case 1: \(S=4\) (I hold smaller): Probability \(\frac{1}{2^{2+1}} \cdot \frac{1}{2} = \frac{1}{16}\).  
  - Case 2: \(S=2\) (I hold larger): Probability \(\frac{1}{2^{1+1}} \cdot \frac{1}{2} = \frac{1}{8}\).  
  Total probability: \(\frac{1}{16} + \frac{1}{8} = \frac{3}{16}\).  
  Posterior:  
  - \(P(S=4 | x=4) = \frac{1/16}{3/16} = \frac{1}{3}\),  
  - \(P(S=2 | x=4) = \frac{1/8}{3/16} = \frac{2}{3}\).  
  \(E[\text{other} | x=4] = 8 \cdot \frac{1}{3} + 2 \cdot \frac{2}{3} = 4\) again. Still no gain? I must refine this."  

  **Bob (rethinking):** "Continuous case. Let \(S\) (smaller sum) have density \(f(s) = \frac{1}{s^2}\) for \(s \geq 1\)—proper, with \(\int_1^\infty s^{-2}  ds = 1\), but \(E[S] = \int_1^\infty s \cdot s^{-2}  ds = \infty\). See \(x\). The other envelope is \(\frac{x}{2}\) or \(2x\).  
  - If \(x\) is smaller (prob \(\propto f(x) \cdot \frac{1}{2} = \frac{1}{2x^2}\)), other is \(2x\).  
  - If \(x\) is larger (prob \(\propto f(\frac{x}{2}) \cdot \frac{1}{2} = \frac{1}{2} \cdot \frac{4}{x^2} = \frac{2}{x^2}\)), other is \(\frac{x}{2}\).  
  Normalizing, posterior for \(x \geq 2\):  
  - \(P(\text{smaller} | x) = \frac{1/(2x^2)}{1/(2x^2) + 2/x^2} = \frac{1}{5}\),  
  - \(P(\text{larger} | x) = \frac{4}{5}\).  
  \(E[\text{other} | x] = 2x \cdot \frac{1}{5} + \frac{x}{2} \cdot \frac{4}{5} = \frac{2x}{5} + \frac{2x}{5} = \frac{4x}{5} < x\). Now switching *loses*? I see the error. To favor switching, we need \(f(x/2) > f(x)\), e.g., \(f(s) \propto s^{-1}\), but that’s improper. With proper priors, I can’t get uniform switching advantage. So I concede: for proper priors, switching’s appeal depends on the prior and \(x\). But with *improper* \(f(s) \propto s^{-1}\), we *do* get \(E[\text{other} | x] = 1.25x > x\) for all \(x\). That’s the crux: improper priors expose a failure of conglomerability."  

  **Alice:** "Your improper prior is St. Petersburg in disguise! Unconditionally, both envelopes have infinite expectation: \(E[\text{envelope}] = \int_0^\infty s \cdot s^{-1}  ds = \infty\). Conditionally, you get \(1.25x\), but this is an artifact of infinity—like how in St. Petersburg, any finite fee seems worth paying for infinite expected value. Here, for every \(x\), switching appears better, yet unconditionally, swapping is neutral. That’s not profound—it’s expected-value reasoning misfiring when expectations diverge."  

  **Bob:** "No, it’s deeper. Conglomerability says: if \(E[Y - X | X=x] \geq 0\) for all \(x\), then \(E[Y - X] \geq 0\). But here, \(E[Y - X | X=x] = 0.25x > 0\) for all \(x\), yet \(E[Y - X]\) is undefined (\(\infty - \infty\)). This *failure* is the paradox’s core: conditional dominance doesn’t aggregate to unconditional dominance because the unconditional expectation doesn’t exist. It reveals a fragility in conditionalization when densities are improper or expectations infinite. We can’t assume ‘local’ rationality implies ‘global’—that’s the limit you’re missing."  

  **Alice:** "But in practice, we only ever *have* the conditional case—I see \(x\) and must decide. Your improper prior makes switching seem always rational, yet symmetry demands indifference. This isn’t a failure of conglomerability; it’s a sign that improper priors induce incoherence. They trick us into ignoring symmetry. With proper priors, coherence is restored: switching is favored only when the prior and \(x\) justify it. The ‘deeper limit’ you see is just the danger of unconstrained infinitism."  

  **Bob:** "And that’s precisely where epistemology meets decision theory! When conditional expectations exist but the unconditional doesn’t, we face a rift between local and global reasoning. We must either reject conglomerability (which Bayesian updating assumes) or ban improper priors and infinite expectations. But the latter is dogmatic—some processes *are* best modeled with \(E = \infty\). The paradox warns us: in such worlds, conditionalization alone can’t justify actions. That’s not St. Petersburg; it’s a new lesson in epistemic humility."  

  **Alice (pauses, withdraws her hand):** "Perhaps. But until I see a proper prior where switching always dominates, I’ll trust finite expectations. For now, this \$10,000 stays put."  

  **Bob (smiles):** "And I’ll keep pondering how infinity fractures rationality. Shall we write this up?"  

