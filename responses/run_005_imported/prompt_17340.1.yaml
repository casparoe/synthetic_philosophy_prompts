answer: |-
  What a fascinating question – and kudos for diving into this rich debate after decades of fieldwork. Aristotle would likely be **thrilled** by your question, but he'd almost certainly tell both the historical and systemic camps that they're missing the core of what a *telos* (final cause) truly is. Here's why:

  1.  **Aristotle's Teleology is Immanent and Essentialist, Not Historical:**
      *   For Aristotle, the function of a part isn't *derived* from its history. It's written into the very *essence* or *nature* of the organism and its parts *now*. The heart's function is to pump blood because that's what it *is for* in order for *this specific kind of living being* (e.g., a human, a deer, a bird) to achieve its complete state (*entelecheia*) – to live and flourish *as* that kind of being.
      *   He wouldn't care about ancestral selection pressures as the *source* of the function. The function exists because it's necessary for the organism's current form of life. History might explain *how* the heart came to be, but not *why* it pumps blood *now*. The "why" is inherent in the organism's present being.

  2.  **Aristotle's Teleology is Hierarchical and Organism-Centered, Not Relativistic:**
      *   While Aristotle analyzed parts in relation to wholes, he had a very specific hierarchy:
          *   **Parts (Organs/Traits):** Exist for the sake of the activities/functions they perform.
          *   **Activities/Functions:** Exist for the sake of the well-being/life of the **whole organism**.
          *   **The Whole Organism:** Exists for the sake of realizing its specific form of life (its *eudaimonia* or flourishing *as* that kind of thing).
      *   Crucially, he **would reject Cummins' radical relativism**. The heart's *proper* function (*ergon*) is pumping blood *because that's necessary for the life of the organism it belongs to*. Making thumping noises is an *accidental* property or a *by-product* (*symbebekos*) of its pumping action. It is *not* its function relative to the "system" of auscultation. The stethoscope system is an artificial human construct; the heart's true *telos* is defined by its role in sustaining the organism's life, not by how humans choose to interact with it.

  3.  **The "System" is the Organism Itself:**
      *   For Aristotle, the relevant "system" for assigning the *proper* function of a biological trait is always the **individual living organism as a whole**, striving to maintain itself and actualize its potential. The heart contributes to the *capacity* of the organism to live and move. This aligns *superficially* with Cummins' "causal role" approach, but with a massive caveat: Aristotle's "system" isn't arbitrary or chosen by the investigator. It's fixed – it's the unified, goal-directed entity that is the living being itself. He wouldn't accept that the heart's *true* function changes depending on which arbitrary "system" (like a doctor's diagnostic practice) you pick.

  4.  **He'd See Both Camps as Reductionist:**
      *   **Against the Historical Camp (Wright/Neander):** "You reduce the purpose (*telos*) to a mere historical accident of selection. But the purpose is present *now* in the very being of the creature! A severed limb that never underwent selection still *has* the function of locomotion relative to the organism it came from, even if it can't perform it. History doesn't confer the function; the organism's nature does."
      *   **Against the Systemic Camp (Cummins):** "You make function utterly subjective and relative! You confuse the *proper activity* (*energeia*) of the part – which is fixed by its role in sustaining the life of the whole – with mere *accidental effects* it might have in any random context. A heart's thumping sound is no more its function than the shadow it casts is its function. You've lost sight of the *essence* of the organism."

  **Aristotle's Verdict (Likely):**

  He would say **both camps are mangling final causes**, but in different ways:

  1.  **The historical camp mistakes the *origin* of the trait for its *purpose*.** They confuse efficient/material causes (how it came to be) with the final cause (what it's *for*).
  2.  **The systemic camp mistakes *any causal contribution* for a *proper function*.** They lose the essential, normative, organism-centered hierarchy that defines a true *telos*. They confuse accidental properties with essential functions.

  **Aristotle's Core Position:**

  *   The function of a biological trait is its **essential, current activity** that **contributes necessarily** to the **life, well-being, and flourishing** of the **whole organism** of which it is a part. This function is **inherent** in the organism's nature/form (*eidos*), **not** conferred by history or relative to an arbitrarily chosen external system.
  *   **For the heart:** Its function is pumping blood. Full stop. This is necessary for the organism's life. Thumping is a consequence, not its purpose. Its evolutionary history is interesting, but irrelevant to defining its *current* function within the living being.

  **In short:** Aristotle would stand apart, arguing for an **immanent, essentialist, organism-centered teleology.** He'd see the modern debate as fascinating but ultimately missing the point he spent his life dissecting animals to understand: that life itself is inherently purposeful, and the function of parts is defined by their contribution to that intrinsic purpose of the living whole. Your decades observing organisms in their wholeness in the field would probably give you a deep intuitive grasp of the perspective he championed.
