  ### Category 3: Correctness of the conclusion and of the explanation for why it is a distinctive problem for non-reductive physicalism (5 points)

  The partner states the conclusion: mental properties turn out to be epiphenomenal. Then, they explain why this is a problem specifically for non-reductive physicalism: 
