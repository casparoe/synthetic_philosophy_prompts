answer: |-
  Here are ten interview questions designed to push beyond standard Cummins vs. Wright recaps, targeting the specific issues you requested, with built-in follow-ups anticipating common dodges:

  1.  **Malfunction Nuance:** "Cummins functions are tied to a part's *current* contribution to a *specified* systemic capacity. When a heart stops pumping blood, the causal-role account seems to say it simply *lacks* that function *now*, rather than *malfunctioning*. How does your view capture the normative force of 'malfunction' – the idea that the heart is *failing* at what it *should* do, not just not doing something it once did?"
      *   *Follow-up (if she argues function is context-dependent):* "But in a clinical context, we confidently say a stopped heart *is* malfunctioning, implying a stable norm *independent* of its current contribution. Doesn't this clinical intuition point towards a historical/design norm your view struggles to capture?"

  2.  **Liberality & "Feature, not Bug":** "You've argued the 'liberality' of the causal-role account – that hearts make sounds, produce pressure waves, etc. – is a strength, reflecting the interest-relativity of function ascriptions. But doesn't this raise a *demarcation problem*? How do we, on your view, distinguish a *biologically significant* function (pumping blood) from a trivial, incidental effect (making a lub-dub sound) *without* implicitly appealing to evolutionary consequences or adaptive design?"
      *   *Follow-up (if she emphasizes systemic importance):* "Importance *to whom* or *to what*? Isn't 'importance to the organism's survival/reproduction' precisely smuggling in the etiological normativity you reject? What makes 'maintaining circulatory capacity' inherently more important for function ascription than 'producing audible rhythmic sounds' for a biologist?"

  3.  **Swampman's Novelty: Advantage or Excess Baggage?** "The causal-role account easily assigns functions to novel traits in instantaneously created systems (like Swampman's spontaneously formed 'heart'). Etiological views famously struggle here. But is this ease a *virtue* demonstrating flexibility, or does it expose a *lack of constraint*? Couldn't *any* effect of Swampman's 'heart' (warming nearby tissue, subtly altering local gravity?) be deemed a function simply by choosing an appropriate systemic capacity it contributes to? How does your view prevent functional inflation in novel systems?"
      *   *Follow-up (if she focuses on contribution to Swampman's survival):* "But Swampman has no evolutionary history. Why is 'contributing to survival' the privileged capacity? If his 'heart' incidentally vibrates at a frequency attracting mates (by pure chance), is *that* suddenly its function? Doesn't privileging 'survival' again sneak in etiological norms?"

  4.  **Explanatory Target Selection:** "A core step in Cummins' analysis is selecting the 'capacity to be explained' (C). But what *determines* which capacity C is the relevant one for functional analysis in biology? Is it purely the investigator's whim, or are there biologically grounded constraints? If constraints exist (e.g., relevance to fitness, homeostasis), aren't these constraints rooted in the very evolutionary history your account seeks to avoid?"
      *   *Follow-up (if she says it's pragmatic/investigator-dependent):* "Doesn't this make biological function *radically* subjective? Could two biologists, studying the same trait in the same organism, legitimately ascribe *contradictory* functions (e.g., one says a structure functions in digestion, another in defense) simply by choosing different capacities C, and both be 'correct' on your view?"

  5.  **Malfunction & Systemic Context:** "Can a trait *malfunction* on the causal-role view even if the *overall system capacity* (e.g., organism survival) is *unaffected*? For example, imagine a redundant backup system: if Kidney A fails (stops filtering blood) but Kidney B compensates perfectly, maintaining overall fitness. Is Kidney A malfunctioning? If so, relative to *which* systemic capacity is it failing, given the organism's survival capacity is intact?"
      *   *Follow-up (if she points to a sub-capacity like 'renal filtration'):* "But why privilege the sub-capacity of 'renal filtration by Kidney A' over the higher-level capacity of 'waste removal' or 'organism survival'? Isn't defining the malfunction relative to a *specific sub-capacity* again relying on an implicit notion of *proper* contribution or *design* for that specific part?"

  6.  **"Function" vs. "Merely Functioning":** "Does the causal-role account distinguish between something *having a function* F and something *merely functioning* (i.e., operating) *in way* F? For instance, a rock used as a paperweight *functions* to hold paper, but we don't typically say it *has the function* of being a paperweight. Does your view capture this distinction within biology? If so, how?"
      *   *Follow-up (if she ties it to being a component in a containing system):* "Is *any* effect a component has on *any* containing system sufficient for it to *have a function*? Does a mitochondrion in a cell *have the function* of slightly increasing the local temperature of the cytoplasm, simply because it contributes to that capacity?"

  7.  **Interest-Relativity & Scientific Objectivity:** "You argue functions are interest-relative. However, biological sciences often strive for objective explanations. Doesn't grounding function in subjective interests make functional explanations in biology fundamentally less objective than, say, mechanistic or etiological explanations? How can functional biology be a science if its core explanatory concept is inherently perspectival?"
      *   *Follow-up (if she argues shared interests create objectivity):* "But *which* shared interests? Biologists broadly agree on functions like 'heart pumps blood'. Isn't this agreement *because* they share an implicit understanding of the organism's evolved design and fitness needs, not just arbitrary convention?"

  8.  **The Normativity Smuggle (1 - Clinical Practice):** "In medicine, malfunction diagnoses (e.g., 'heart failure') carry strong normative force, guiding interventions aimed at *restoring* 'proper function'. Can the causal-role account, grounded in current contributions to investigator-chosen capacities, genuinely support this normativity? Or does clinical practice *necessarily* rely on an implicit etiological or design-based norm of how the organ *ought* to work?"
      *   *Follow-up (if she argues norms come from desired outcomes/therapeutic goals):* "But the 'desired outcome' in medicine is typically defined as the *healthy state* – which is understood precisely as the state where parts perform their *evolutionarily selected* functions. Isn't the therapeutic goal itself parasitic on the etiological norm?"

  9.  **The Normativity Smuggle (2 - Comparative Biology):** "When comparative biologists argue a trait in species A *has the same function* as a homologous trait in species B, what grounds this claim on the causal-role view? Is it just similarity in current contribution to some arbitrarily chosen capacity? Or does the inference rely on shared evolutionary history/selection pressures, implying the etiological view is doing the real work in establishing functional homology?"
      *   *Follow-up (if she emphasizes similar causal roles):* "But 'similar causal role' often *means* similar contribution to *fitness* in similar environments – which is fundamentally an etiological concept. How do you define 'similar causal role' without referencing the evolutionary context that shaped the trait's contribution?"

  10. **Liberality as Epistemic Cost?** "While you argue liberality is a strength, could it be an *epistemic weakness*? If the causal-role account allows almost any effect to be a function (depending on C), does it lose its power to *explain* why organisms have the specific, highly organized, and *non-arbitrary* traits they do? Doesn't the etiological view's constraint by actual history provide a more powerful explanation for the observed functional specificity in biology?"
      *   *Follow-up (if she argues different explanatory goals):* "But biologists frequently use functional talk precisely *to explain* why traits exist and persist (e.g., 'the heart exists *in order to* pump blood'). Can the causal-role account, focused on current capacities, genuinely support this type of teleological explanation for trait existence, or is it limited to explaining how current capacities are realized?"

  These questions directly target the vulnerabilities you identified (malfunction, liberality, Swampman, normativity smuggled via interest-relativity), force clarification on key distinctions, and anticipate common defensive maneuvers with pointed follow-ups. They should spark a substantive and revealing discussion beyond the usual debate tropes. Good luck with the colloquium!
