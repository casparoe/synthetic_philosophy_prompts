answer: |-
  For your Dominican friar to sound authentically steeped in Aquinas while radicalizing him towards Salisbury's position, he needs to weave precise Thomistic principles into a framework that *implies* a positive duty, even as Aquinas himself generally stops short of explicitly endorsing private tyrannicide as a *duty*. Here's how to achieve that texture, drawing on key passages:

  **Core Thomistic Texts & Arguments for the Friar to Marshal:**

  1.  **Aquinas's Core Stance on Tyranny & Removal (Primarily from *De Regno* and *Summa Theologiae*):**
      *   **Source:** *De Regno, ad Regem Cypri (On Kingship, to the King of Cyprus)*, Chapters 4-7.
      *   **Argument:** Aquinas meticulously details how a king becomes a tyrant by ruling for his own private good, not the common good. He explicitly states tyranny is the *worst* form of government. Crucially, he argues the *people* (or those acting *for* the people, like nobles or even a foreign power) have the right/responsibility to *depose* a tyrant if other remedies (admonition) fail. He frames this as a *public* act, not private assassination.
      *   **Friar's Twist/Emphasis:** The friar would focus intensely on Aquinas's description of the tyrant's *injustice* and the *duty* of those responsible for the common good to act. He could argue that in the absence of functioning public mechanisms (a common reality in the Wars of Religion), the *responsibility* devolves onto any member of the *communitas* capable of acting. He stresses Aquinas's assertion that tolerating tyranny is a greater evil than deposing the tyrant.

  2.  **The Permissibility of Killing Evildoers (The Foundational Principle):**
      *   **Source:** *Summa Theologiae*, II-II, Question 64, Article 2: "Whether it is lawful to kill sinners?"
      *   **Argument:** Aquinas states it is lawful to kill an evildoer if it is necessary for the welfare of the whole community ("*ad conservationem totius communitatis*"). He roots this in the natural order: just as amputating a diseased limb preserves the body, removing a dangerous person preserves the body politic. Authority is required, but...
      *   **Source:** *Commentary on the Sentences*, Book II, Distinction 44, Question 2, Article 2 (Specifically addressing killing tyrants).
      *   **Argument:** Here, Aquinas is more direct regarding tyrants: "*Non enim est illicitum, immo iustum et laudabile, ut tyrannum occidat quicumque pro liberatione patriae, sicut etiam quicumque occidit latronem pro conservatione sui.*" ("For it is not illicit, indeed it is just and praiseworthy, that *anyone* kill a tyrant for the liberation of the fatherland, just as *anyone* may kill a robber for his own preservation.") **This is your strongest textual hook.**
      *   **Friar's Twist/Emphasis:** The friar seizes on the phrase "*quicumque*" (anyone) and the analogy to self-defense against a robber. He argues this transforms permission into a *duty* when the threat is existential to the *patria* (fatherland/common good) and no one else acts. He links it to II-II, Q64, A7 (on killing in self-defense) which allows individuals to act for their own preservation *and* for the common good ("*pro bono communi*"). The duty arises from the *necessity* and the *gravity* of the threat to the common good – if *you* see the robber attacking the *polis*, and you can stop him, *you must*.

  3.  **The Obligation of Charity and Justice:**
      *   **Source:** *Summa Theologiae*, II-II, Question 58, Article 1: "Whether justice is fittingly defined as being the perpetual and constant will to render to each one his right?"; II-II, Question 26, Article 4: "Whether we ought to love one neighbor more than another?"; II-II, Question 31, Article 3: "Whether almsgiving is a matter of precept?"
      *   **Argument:** Justice requires rendering what is due. Charity (love of God and neighbor) is the highest theological virtue and binds Christians to seek the true good of others, especially the vulnerable. Aquinas argues we have a greater obligation to those more closely connected to the common good or in greater peril. He also states that precepts of charity sometimes *require* positive action to avert grave harm.
      *   **Friar's Twist/Emphasis:** The friar argues that the tyrant *withholds* the people's due (justice, peace, safety) and actively *harms* them. True charity *demands* acting to remove this source of profound harm to one's neighbors and the *res publica*. Toleration becomes complicity in injustice and a failure of charity. He invokes the "robber" analogy again – would charity permit you to stand by while a robber slaughtered your family? How is the tyrant any different? The duty stems from the *precept* of charity in the face of overwhelming evil.

  4.  **Natural Law and the Defense of Order:**
      *   **Source:** *Summa Theologiae*, I-II, Question 94, Article 2: "On the natural law"; I-II, Question 93, Article 3: "Whether there is an eternal law?"; I-II, Question 21, Article 4: "Whether a human action deserves praise or blame, by reason of its being good or evil?"
      *   **Argument:** Natural law inclines us to preserve life, society, and order. The eternal law (God's plan) governs creation. Actions contrary to the natural/eternal law are blameworthy; actions upholding them are praiseworthy.
      *   **Friar's Twist/Emphasis:** Tyranny is a fundamental *disorder*, a violation of natural law and God's plan for human society. Removing the tyrant is therefore an act of *restoring* the natural and divine order. It aligns the actor with the *lex aeterna*. Aquinas states good actions deserve praise; what could be more praiseworthy than restoring God's order? The duty flows from aligning one's will with the fundamental laws of creation.

  **Folding in John of Salisbury (The Scholastic Phrase):**

  The key is to present Salisbury not as a separate authority, but as an earlier, eloquent expositor of principles Aquinas later systematized and grounded more deeply in Aristotelian philosophy and theology. Salisbury provides the vivid *application*, Aquinas the rigorous *foundation*.

  *   **Plausible Scholastic Phrase:** "As the venerable John of Salisbury, drawing upon the mantle of Augustine, teaches in his *Policraticus*, the tyrant, by severing the bond of justice, *ipso facto* places himself *extra legem* and beyond the shield of its protection. His doctrine, though expressed with the force of antiquity, finds its firmest confirmation and deepest root in the principles laid down by the Angelic Doctor concerning the common good, the licitness of removing destroyers of the *communitas*, and the preeminent duty of charity – principles which *compel* action where public remedy fails."

  **Why this works:**

  1.  **Acknowledges Salisbury:** Cites him specifically ("venerable John of Salisbury"), his work (*Policraticus*), and his core argument (tyrant *extra legem*, fair game).
  2.  **Connects to Tradition:** Links him to Augustine (a major authority for both Salisbury and Aquinas), adding weight.
  3.  **Subordinates to Aquinas:** Explicitly states Salisbury's view finds its "firmest confirmation and deepest root" in Aquinas's principles.
  4.  **Uses Thomistic Vocabulary:** "Common good" (*bonum commune*), "*communitas*", "licitness" (*licitum*), "duty of charity" (*officium caritatis*), "Angel
