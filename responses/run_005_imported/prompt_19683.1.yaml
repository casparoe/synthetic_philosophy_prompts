answer: |-
  ## Eulogy for [Teacher's Name]

  Good morning. For those I haven’t met, my name is [Your Name]. I was fortunate to study with [Teacher's Name] for twelve years, in the quiet space of her Sunday group where we wrestled with deep questions. But many of you knew her in other vital ways: as a deeply compassionate physician guiding families through life’s most tender thresholds in hospice care, as a cherished colleague, or as beloved family.

  [Teacher's Name] lived in many worlds. She navigated the precise language of medicine, the profound depths of philosophy, and the simple, messy language of the human heart with equal grace. She was a healer not just of bodies, but of confusion and fear, especially around the subject that defined so much of her work and study: death.

  In her final years, she spoke with quiet clarity about this. She had spent a lifetime contemplating it – clinically, philosophically, and personally. She had a particular view, shaped by a deep and ancient wisdom tradition she studied and taught. It centered on a profound reluctance to pin down the ultimate nature of things – including what happens *after*.

  She asked something specific of us today. She asked that we not say she is now "at peace," floating somewhere serene. Equally, she asked that we not say she is "simply gone," vanished into nothingness. She felt both statements, however comforting they might seem, missed something essential about the profound, ungraspable mystery she spent her life contemplating.

  Now, how do we honor that request? How do we speak about her passing without falling into those descriptions she gently but firmly set aside?

  Perhaps we can start by talking about how she *engaged* with mystery, rather than trying to solve it for her now.

  [Teacher's Name] didn’t see death as a problem demanding a final, comforting answer. She saw it as the ultimate threshold, the most profound expression of life’s inherent fluidity and impermanence. In hospice, she didn’t offer easy platitudes. She offered presence. She offered the courage to sit with the raw, unanswerable question itself. She helped families hold space for the unbearable "not-knowing," finding a kind of strength and even beauty within that very uncertainty.

  Her philosophy wasn't about nihilism or denial. It was about radical openness. It was about recognizing that the most profound realities – like love, like consciousness, like what truly *is* – resist being neatly boxed into "is," "isn't," "both," or "neither." She taught that clinging to any fixed idea, even a comforting one about an afterlife or an end, can limit our ability to truly meet the present moment, especially the moment of letting go.

  So, what *can* we say?

  We can say that [Teacher's Name]’s extraordinary presence – her sharp mind, her wry humor, her boundless compassion that touched patients, students, colleagues, and family alike – that vivid presence is no longer here in the form we knew. The chair in her study group is empty. The hospital rounds miss her steady gaze. The family table misses her voice. There is an undeniable absence where her life force animated the world.

  But we can also say that what she *did*, who she *was*, ripples outwards with immense force. Every family she guided with such tenderness through grief carries her wisdom forward. Every student who grappled with emptiness under her gentle instruction carries a spark of her insight. Every colleague who witnessed her blend clinical rigor with profound humanity carries a model of what medicine can be. Every act of kindness she inspired continues.

  Think of a stone dropped in a pond. The stone itself is no longer visible on the surface. To say it's "gone" ignores the waves still spreading, touching the far shore. To say it's "peacefully resting elsewhere" ignores the undeniable fact that its substance has transformed, becoming part of the larger body of water. The stone is not *in* the waves; it *is* the movement, the effect. And the water itself? It was never *only* the stone, nor is it *less* without it. It simply is… water, holding the potential for infinite forms.

  [Teacher's Name] lived her philosophy. She met the dying not with fixed answers, but with an open heart and a fearless willingness to be present with the mystery. She asked us to offer her the same dignity now.

  So, let us not confine her memory with words that would have made her gently raise an eyebrow. Instead, let us honor her by embracing the space she leaves – not as a void of "gone," nor as a haven of "peace" elsewhere, but as a profound invitation.

  An invitation to feel the full weight of our loss, the ache of her absence.
  An invitation to celebrate the indelible mark she made – the wisdom shared, the compassion given, the lives touched and healed.
  And perhaps most importantly, an invitation to cultivate within ourselves that same courageous openness she embodied: the willingness to meet life's deepest mysteries, especially death, not with certainty, but with presence, with curiosity, and with an unwavering, compassionate heart.

  The stone may be beneath the surface, but the pond is forever changed. The melody may have ended, but the silence it leaves is resonant, full of its echo. [Teacher's Name]’s life was a masterclass in how to hold the question without needing the final answer. In that spirit, let us hold her memory, and the mystery she embraced, with the same profound respect and deep, quiet love she showed to all of us, and to life itself. Thank you.

  ---

  **Key elements used to navigate the constraints:**

  1.  **Focus on Her Approach:** Instead of stating *what* happened to her, the eulogy focuses on *how she approached* death and mystery. This honors her philosophy without violating it.
  2.  **Acknowledge the Obvious Absence:** It directly states the undeniable fact of her physical absence and the impact of that loss, satisfying the need for realism without claiming "simply gone" as an ultimate truth.
  3.  **Emphasize Enduring Impact:** Using metaphors like ripples, waves, and changed water, it highlights the ongoing effects of her life and actions ("dependent arising"), which is central to Madhyamaka and avoids claims about *her* current state.
  4.  **The Stone & Pond Metaphor:** This is crucial. It allows for transformation and enduring effect ("not gone") without implying a separate, peaceful existence ("not at peace"). It implies integration and change without defining the final state. The water analogy directly points to emptiness/shunyata (lack of inherent, independent existence) without using the term.
  5.  **The Silence After Music:** Another metaphor emphasizing the resonance left behind, the space filled with memory and influence, rather than a defined state of the musician.
  6.  **The Invitation:** Framing the response to her death as an *invitation* to practice openness and presence mirrors her life's work and philosophy, offering comfort through action and perspective, not assertion.
  7.  **Avoidance of Forbidden Phrases:** Scrupulously avoids "at peace now," "simply gone," "exists," "doesn't exist," "both," "neither." Uses language of transformation, effect, absence, memory, and ongoing influence.
  8.  **Tone:** Balances deep respect, personal warmth, intellectual honesty, and accessible language. Acknowledges grief while offering a framework for understanding consistent with her wishes.

  This eulogy respects [Teacher's Name]'s explicit wishes and profound philosophical stance while providing genuine comfort through celebrating her life, acknowledging loss, and pointing towards a way of being with mystery that she embodied. It speaks to the heart without contradicting the mind she so cherished.
