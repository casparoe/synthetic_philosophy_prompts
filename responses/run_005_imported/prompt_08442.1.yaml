  For the individualist (Dawkins-Williams type), I'll emphasize Hamilton's rule as the core mechanism. They should argue that group selection is redundant. For the multilevel selectionist (Sober-Wilson), they should insist that group-level covariance explains colony fitness differences. Key points: Price equation's partitions, the necessity of between-group variance in the ant case, and whether group selection adds explanatory power.

