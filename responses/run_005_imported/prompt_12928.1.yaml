  H might respond that the act of waking up without knowing the day provides information. On heads, she's only woken once, on tails twice. So when she wakes up, it's more likely to be tails, but H denies that and says it's 1/2. Wait, the halfer position is that upon waking, before any day info, credence is 1/2. Then when told Monday, it becomes 2/3. T says that's inconsistent with the independence.

  I should structure the dialogue with T pushing the absurdity of Monday affecting the coin, and H explaining the Bayesian update. Then T counters with the independence principle. H argues that the coin and day aren't independent in the sample space of awakenings. T says that's confusing the observer's perspective.

