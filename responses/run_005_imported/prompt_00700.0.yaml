answer: |-
  Here’s a rigorous defense of your position, taking the linguistic convention rejoinder seriously while demonstrating its inadequacy in reconciling Manning’s critique with the continued use of structural/semantic canons:

  ### Core Argument
  **Manning’s public-choice critique of the absurdity doctrine applies equally to canons like *ejusdem generis*, *noscitur a sociis*, and the whole-act rule.** These canons implicitly assume statutory coherence and drafter intentionality that public choice theory rejects. The "linguistic convention" defense fails because statutory interpretation *cannot isolate semantic conventions from institutional context*—public choice realities infect the very linguistic practices these canons rely upon.

  ---

  ### Step 1: Manning’s Absurdity Doctrine Critique (Recast for Generality)
  Manning’s argument rests on two public-choice pillars:
  1.  **Statutes as Political Bargains:** Legislation emerges from factional compromise, not unified purpose. Provisions may reflect logrolling, ambiguous trade-offs, or even deliberate incoherence to secure passage.
  2.  **No Collective Intent:** A legislature has no single "mind." Asking what "the legislature" intended is meaningless—there’s only the enacted text as a product of contingent political forces.

  The absurdity doctrine ("avoid interpretations yielding absurd results Congress *could not have intended*") fails because:
  - It requires attributing a *coherent negative intent* ("Congress could not have wanted X") to a collective body incapable of such intent.
  - It assumes Congress *would have* drafted to avoid absurdity, ignoring that absurd results might be tolerated (or unnoticed) in complex bargains.

  ---

  ### Step 2: Generalizing the Critique to Structural/Semantic Canons
  The targeted canons (*ejusdem generis*, *noscitur a sociis*, whole-act rule, consistent usage presumption) share the absurdity doctrine’s fatal flaw: **they rely on attributing coherence, purpose, or rationality to the statute and its drafters.**

  | **Canon**          | **Coherence Assumption**                                 | **Conflict with Public Choice**                                                                 |
  | :----------------- | :------------------------------------------------------- | :--------------------------------------------------------------------------------------------- |
  | **Ejusdem Generis** | Specific list items form a coherent "genus"; drafters intended the catch-all to share core characteristics. | The specific items may reflect unrelated concessions to different factions, lacking a common genus. |
  | **Noscitur a Sociis** | Surrounding terms share a thematic or contextual unity. | Terms may be inserted by different coalitions with divergent aims; their association is accidental. |
  | **Whole-Act Rule** | The statute is a unified, internally consistent scheme. | Statutes are often omnibus compromises stitching together unrelated provisions with conflicting goals. |
  | **Consistent Usage** | Drafters use the same word consistently throughout the act. | Different subparts may originate from different drafters/committees; consistency is accidental, not deliberate. |

  **The Core Tension:** Each canon asks, "What would a *rational, coherent drafter* have intended?" But public choice posits there *is no* single rational drafter—only a fractured process producing text that may be *deliberately* or *accidentally* incoherent.

  ---

  ### Step 3: Taking the "Linguistic Convention" Rejoinder Seriously
  Your co-clerk’s view represents the strongest textualist defense:
  - **The Claim:** Canons like *ejusdem generis* are *not* about legislative intent. They are **descriptive linguistic rules** reflecting how *competent users of English* (drafters and readers) understand language in context.
  - **Examples:**
      - *Ejusdem generis*: A speaker listing "apples, oranges, bananas, and other fruit" is understood to mean *other edible plant products*, not "other spherical objects." This is convention, not mind-reading.
      - *Noscitur a Sociis*: Hearing "knives, forks, spoons, and other utensils," listeners understand "utensils" as *eating tools*, not "writing utensils." Context clarifies ambiguity via convention.
  - **Textualist Justification:** Courts apply these conventions because they reflect the shared understanding of the *reasonable reader* at the time of enactment. This is objective, not subjective intent.

  ---

  ### Step 4: Why the Linguistic Defense Fails in the Statutory Context
  While compelling for *ordinary language*, the defense collapses when applied to *statutes* under public choice scrutiny:

  1.  **The "Competent Drafter" is a Fiction:**
      - Public choice reveals drafters aren’t a unitary, competent linguistic agent. Statutes are drafted by committees, staffers, lobbyists, and amended haphazardly. The "reasonable drafter" presumed by linguistic conventions *does not exist* institutionally. Assuming linguistic competence imposes coherence where none may exist.

  2.  **Context is Contaminated by Politics:**
      - In ordinary language, context is shared and organic. In statutes, "context" (surrounding words, structure) is itself the product of political bargaining. Using *noscitur a sociis* to define "device" assumes the *other listed terms* form a coherent, purpose-driven group. But if those terms are the result of logrolling (e.g., one term to please Industry A, another to placate Caucus B), there *is no* coherent "sociis" to derive meaning from. The linguistic convention assumes a rational context that public choice denies.

  3.  **Conventions Presume Shared Purpose, Not Just Shared Semantics:**
      - *Ejusdem generis* works in conversation because speaker and listener share a common goal (e.g., discussing fruit). Statutes lack a single shared purpose. Applying the canon *imputes* a common purpose to the listed items and the catch-all, forcing coherence onto what might be a disjointed compromise. This imputation mirrors the absurdity doctrine’s imputation of negative intent.

  4.  **The Whole-Act Rule Presumes Unity of Design:**
      - Presuming consistency of terms or purpose across an entire act assumes a single designer. Public choice shows acts are designed by committee(s), often over time. The "whole act" might be a Frankenstein's monster. Using the rule to interpret Part A based on Part B assumes B is relevant context for A. But if Parts A and B reflect unrelated bargains, this assumption is false—linguistic convention cannot salvage it.

  5.  **Manning’s Insight Applied:** Manning argues the absurdity doctrine fails because it requires courts to say what *the legislature* "must have intended." Similarly, using *ejusdem generis* requires courts to say what *the drafters* "must have meant" by the catch-all given the list—i.e., they must have intended a coherent genus. But if there’s no collective drafter intending coherence, this is just as fictional as attributing an intent to avoid absurdity.

  ---

  ### Step 5: The Inconsistency of the "New Textualist"
  A textualist who accepts Manning’s critique *must* abandon or radically restrict the structural/semantic canons **if** they are applied to resolve ambiguity by assuming statutory coherence or rational drafters. To do otherwise is inconsistent:

  -   **Accepting Manning:** "We cannot infer what Congress *could not have intended* (absurd results) because there’s no collective intent, only political bargaining."
  -   **Using Ejusdem Generis:** "We infer Congress *must have intended* the catch-all to match the genus of the list, implying rational coherence among the list items and purpose."
  -   **Contradiction:** The second statement relies on the very type of collective rational intent the first statement rejects. Public choice undermines the premise that the list *has* a discernible genus or that drafters *intended* one.

  **The Textualist Escape Hatch (and Why it Fails):** Textualists might argue: "We don’t care about intent; we care how a *reasonable reader* understands the *language in context*." But this merely relabels the problem. Public choice shows the *institutional context of statutory drafting* makes the "reasonable reader" assumption of coherence *unreliable*. The reader’s expectation of linguistic regularity is defeated by the legislature’s capacity to produce irregular, politically-driven text.

  ---

  ### Conclusion
  Your intuition is correct. Manning’s critique is a depth charge under the textualist project. If the absurdity doctrine falls because it imputes fictional collective rationality, then canons relying on statutory coherence (*ejusdem generis*, *noscitur a sociis*) or drafter consistency (whole-act rule, consistent usage) must fall for the same reason. The "linguistic convention" defense, while elegant for ordinary language, cannot be insulated from the messy realities of legislative process revealed by public choice theory. A textualist accepting Manning but applying these canons is indeed inconsistent—they are smuggling in assumptions about rational drafters and coherent schemes that their own theoretical foundation demolishes. This leaves textualism in a bind: either retreat towards a hyper-literal, contextless reading of isolated phrases (itself absurd), or acknowledge that some form of imposed coherence—akin to the discredited canons or absurdity doctrine—is pragmatically unavoidable.
