prompt: |-
  Ok this has been rattling around in my head since election night. There's this old result — Good's theorem, from a 1967 I.J. Good paper — showing that a Bayesian expected-utility maximizer should always assign non-negative value to free evidence, basically because worst case you just act exactly like you would've without it. Seems like rock solid math. But last November I made the mistake of glancing at a forecasting model like an hour before polls closed, saw it was already like 97% for the winner, and it just completely deflated the whole night for me even though there was nothing left for me to actually decide or do differently either way — I was gonna sit there and watch the results roll in regardless. Same thing happens with sports scores and book/show spoilers all the time. By the theorems own logic that kind of info should be worth exactly zero to me if it can't change my actions, not negative, but it sure felt negative. Am I just misapplying it, or is this basically the gap that all the "information hazard" talk on here is gesturing at? Curious what you think are the most important implications of Good's theorem, and where it actually stops applying, for how much weight I should put on the very LW-coded intuition that a good bayesian always wants more evidence.
reasoning: |-
  Okay, let me unpack this user's query. They're referencing Good's theorem about the non-negative value of information, but they've experienced situations where information felt negatively valuable—like seeing election forecasts or spoilers that ruined their enjoyment. The core tension is between the mathematical theorem and their lived experience.

  First, I need to recall Good's theorem accurately. It states that for a Bayesian decision-maker, free information has non-negative expected value because you can always ignore it. The user understands this theoretically but questions its real-world applicability when information causes emotional harm without changing actions. 

  The user mentions "information hazard" discussions, likely from LessWrong, which explores scenarios where information can cause harm. Their personal examples—election night deflation, sports spoilers—highlight how information can negatively affect subjective experience even when irrelevant to decisions. 

  I should consider why the theorem might not apply here. Good's theorem assumes a few key things: that the decision-maker is a perfect Bayesian, that utility only depends on actions and outcomes, and that information is free. But in the user's case, the information isn't free—it costs emotional satisfaction. The theorem doesn't account for anticipatory utility or the intrinsic value of surprise. 

  The user's experience suggests that humans derive utility from the process of anticipation and revelation itself. Spoilers or early forecasts can rob them of that experience, creating a net loss. This isn't a flaw in the theorem but a limitation of its scope—it's designed for decision-making, not for holistic human well-being. 

  I should also address the "information hazard" angle. The LessWrong community often discusses edge cases where information causes harm, like in self-fulfilling prophecies or coordination problems. The user's examples are simpler but fit into this broader category of "psychological information hazards." 

  The implications are important. While Good's theorem is technically correct in its domain, rationalists shouldn't blindly seek information. Context matters: if information can't change actions and might spoil experiences, avoiding it could be rational. The user's intuition about sometimes avoiding evidence is valid—it's not irrational; it's pragmatically optimizing for total utility, including emotional factors. 

  The user might also be wrestling with a perceived conflict between Bayesian ideals and human psychology. They need validation that their experience doesn't contradict rationality; it just requires a broader utility function. Emphasizing that rationality includes maximizing all forms of utility—not just decision-theoretic ones—could resolve their tension. 

  Finally, practical advice: it's rational to curate information flows to protect experiential goods. The user shouldn't feel guilty about avoiding spoilers; it's a smart application of utility maximization once you include emotional states. This bridges the gap between theorem and lived experience.
answer: |-
  That election night feeling you described? It's a brilliant real-world paradox that exposes the *boundaries* of Good's theorem, not a refutation. You've nailed a key tension between pure decision theory and human experience. Let's break this down:

  **Good's Theorem: The Rock-Solid Core**
  1.  **The Statement:** For a Bayesian expected-utility maximizer facing a decision, the expected value of acquiring *costless, potentially relevant evidence* before acting is non-negative. Formally: EV(Information | No Info) >= 0.
  2.  **The Logic:** The proof is elegantly simple. Before getting the evidence, you have an optimal action (A_opt_no_info) based on your prior. *After* getting the evidence, you can choose:
      *   **Option A:** Use the evidence to potentially pick a *better* action than A_opt_no_info (yielding higher utility).
      *   **Option B:** Ignore the evidence and stick with A_opt_no_info (yielding the *same* utility as if you never got the info).
      *   Since Option B is always available, the worst-case scenario is breaking even. On average (in expectation), you do at least as well as without the info, and often better.
  3.  **Key Assumptions:** This relies on:
      *   You are a perfect Bayesian updater.
      *   You will *act* optimally based on the new information (or choose to ignore it).
      *   The information is genuinely *free* (no cost to acquire, process, or store).
      *   Utility is defined *solely* over the outcomes of your *actions* and the world state.

  **Why Your Election Night Feeling Doesn't Break the Math (But Highlights Its Limits):**
  *   **The Action Problem:** Good's theorem is fundamentally about **instrumental value** – information's value for *making better decisions leading to better outcomes*. On election night, *you had no actionable decision left*. Your only "action" was to watch the results unfold. The information couldn't change that action. By the strict logic of the theorem, its instrumental value *to your decision-making* was indeed **zero**. The theorem says it *shouldn't be negative*, and technically, it wasn't negative *instrumentally*.
  *   **The Utility Problem:** Where the theorem falls short for humans is its assumption that utility *only* depends on actions and world states. **Your utility function includes your *subjective experience of the process*.** Watching results roll in with suspense, hope, surprise, or communal excitement has inherent positive utility. Getting the "spoiler" (the 97% forecast) *destroyed that experiential utility*. The information didn't change the *outcome*, but it drastically changed your *emotional journey* towards that outcome.
  *   **The "Free" Problem:** The information wasn't truly "free." It cost you the *experience of suspense and surprise*, which you valued. The theorem assumes information acquisition itself doesn't alter utility, only the subsequent actions and states do. For humans, the *act of knowing* can directly alter utility.

  **Information Hazards: Bridging the Gap**
  This is *precisely* the territory of "information hazards" discussed on LessWrong and similar spaces. An information hazard is knowledge that, *by its very nature of being known*, causes harm or reduces expected utility, *even if it doesn't change actions*.

  *   **Psychological Information Hazards:** This is your category. Information that:
      *   **Spoils Surprise:** Ruins the enjoyment of narratives (books, shows, sports), exploration (games), or unfolding events (elections).
      *   **Causes Distress/Anxiety:** Learning about a terrifying but unpreventable risk (e.g., certain astronomical events).
      *   **Triggers Unwanted States:** Recalling traumatic memories, inducing phobias, or causing existential dread.
      *   **Reduces Motivation:** Learning a task is trivial or impossible can kill intrinsic motivation.
  *   **Strategic Information Hazards:** Information that, if known, changes others' behavior in ways that harm you (e.g., revealing your weak position in a negotiation) or creates coordination problems (e.g., knowledge that could cause a bank run).
  *   **"Knowing-Too-Much" Hazards:** Information that makes you incapable of functioning optimally in a system that relies on ignorance (e.g., knowing the exact rules of a social game might make you play unnaturally).

  **Implications of Good's Theorem & Where It Stops Applying:**

  1.  **Core Implication (Decision Contexts):** When facing *complex decisions with high stakes*, actively seeking relevant evidence is almost always rational *if the goal is solely to maximize outcome-based utility*. Avoid letting aversion to bad news prevent you from gathering crucial intel. This is its primary power.
  2.  **Where It Stops Applying (Crucially for You):**
      *   **Non-Instrumental Contexts:** When information *cannot* change your actions (like election night viewing, consuming art/sport for enjoyment, unavoidable outcomes).
      *   **Holistic Utility:** When your utility function includes *subjective experiences* like suspense, surprise, hope, ignorance-as-bliss, or freedom from anxiety *as intrinsic goods*. Protecting these experiences can rationally justify *avoiding* information.
      *   **Costly Processing:** When acquiring or processing information has psychological, emotional, or cognitive costs (dread, anxiety, distraction, mental effort) that outweigh its instrumental value.
      *   **Strategic Interactions:** When the information's value depends critically on who else knows it (common in game theory, where Good's assumptions often break).
      *   **Self-Fulfilling/Defeating Prophecies:** When knowing the information makes the predicted outcome more or less likely *because* you know it (e.g., panic based on a forecast).

  **The LW-Coded Intuition: Nuance Needed**
  The "good Bayesian always wants more evidence" intuition is powerful *within the domain Good defined*: instrumental rationality for improving decisions and outcomes. However, **rationality is about maximizing *expected utility*, not just gathering evidence.** A *truly* rational agent (one with a human-like utility function) recognizes:

  1.  **Evidence has domains:** Is this evidence relevant to an *action* I can take? If not, its instrumental value is zero.
  2.  **Experiences have value:** Suspense, surprise, hope, and even beneficial ignorance are real components of a rich life. Protecting them is rational if you value them.
  3.  **Information isn't free:** There are often psychological and attentional costs.
  4.  **Avoidance can be optimal:** Deliberately avoiding spoilers, distressing but unactionable news, or information that triggers harmful mental states is a perfectly rational strategy for maximizing *total* expected utility when the experiential costs outweigh the (often zero) instrumental benefits.

  **What This Means For You:**
  Your election night experience wasn't irrational. It revealed that your utility function values the *experience of the event* highly. Good's theorem is correct that the information had zero *instrumental* value for your actions. However, it had significant *negative experiential* value. Therefore, **avoiding that information in the future would be the rational choice to maximize your *overall* utility.**

  You shouldn't feel conflicted about valuing surprise or avoiding spoilers. A sophisticated rationalist understands that Good's theorem is a powerful tool *for making better decisions*, not a commandment to hoard all information regardless of its impact on your lived experience. Knowing when *not* to look is often the wisest application of rationality. Your intuition about the gap is spot-on – it's the frontier where decision theory meets the messy reality of human flourishing.
