prompt: |-
  Okay, I need a sanity check on an argument my partner keeps making, because it's turning into a whole thing at home and I can't tell if he's right or if somethings off with it. We have two kids already and are going back and forth on whether to have a third. Money and time aren't infinite for us, so a third kid means everyone, including the two we already have, ends up with a bit less of both than right now, though obviously still enough for good lives. His pitch is basically: a new kid is a whole additional life full of love and happiness added to the world, and even if everyone's individual slice shrinks slightly, the total amount of wellbeing in our house goes up, so we should do it. He even compared it to how economists look at a country's total GDP versus its GDP per capita, and said we're essentially choosing to grow the "total" even though the "per person average" dips a little, which sounded weirdly convincing when he said it out loud.

  Here's where I get stuck. If that argument actually works, it seems like it proves way too much, because you could keep running it forever: a tenth kid, a twentieth, each one just barely happy enough that their life is still worth living, and by his logic thats still an improvement since the total keeps climbing, which feels obviously wrong. When I pushed back with that, he said the "tons of kids" version isn't a real counterexample because none of those hypothetical kids are made worse off by existing instead of not existing at all, so nobody is actually harmed, so what exactly is supposed to be wrong with it? I'm taking a moral philosophy elective this semester and we just finished a unit on utilitarianism, so I feel like this has to be connected somehow, but we never covered anything that resolves this exact puzzle. Could you help me figure out whether his reasoning actually holds up and, if not, exactly where it breaks down? Also kind of curious whether this is a known problem philosophers already argue about, since it feels too tidy for us to have stumbled onto something new.
