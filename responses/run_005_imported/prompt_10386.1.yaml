  Also, the user wants to explain this clearly to his group. He needs a concise distinction: Bell rules out local hidden variables, not all. Bohmian mechanics is non-local, hence survives. I should avoid jargon but not oversimplify. 

  He might also wonder why Bohm isn't more popular if it solves the measurement problem. So mentioning its drawbacks like non-locality and lack of relativity could help. But the main focus is resolving the contradiction he perceives. 

