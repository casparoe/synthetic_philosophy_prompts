answer: |-
  Your puzzle is both insightful and common—it highlights a crucial nuance in how Bell's theorem is often summarized versus what it *actually* proves. **Bell's theorem does *not* rule out *all* hidden-variable theories; it rules out *local* hidden-variable theories.** Bohmian mechanics survives because it explicitly violates *locality*, satisfying Bell's mathematical constraints while evading his physical conclusion. Here's a precise breakdown:

  ---

  ### **1. What Bell's Theorem Actually Proves**
  - **Core Assumption:** Bell assumes that any hidden-variable theory must satisfy:
    - **Realism:** Physical properties exist prior to measurement (hidden variables determine outcomes).
    - **Locality:** No influence can propagate faster than light (outcomes at one location cannot depend on distant settings).
  - **Conclusion:** Any theory satisfying *both* realism and locality must obey **Bell inequalities**.
  - **Experimental Result:** Quantum mechanics (QM) violates Bell inequalities (confirmed by Aspect, Clauser, Zeilinger et al.).  
  → **Therefore: *No local hidden-variable theory can reproduce all QM predictions.***

  **Key Insight:** Bell’s theorem kills *local realism*, not hidden variables *in general*.

  ---

  ### **2. How Bohmian Mechanics Escapes Bell's Trap**
  Bohmian mechanics (BM) is a **non-local hidden-variable theory**. It preserves realism but explicitly rejects locality:
  - **Hidden Variables:** Particles have definite positions at all times, guided by the wave function ψ.
  - **Non-Locality:** The wave function ψ evolves via the Schrödinger equation (which is non-local). Particle velocities depend *instantaneously* on the positions of *all other particles* in the universe.  
    → Measurement outcomes at location A depend *immediately* on settings/outcomes at distant location B.

  **Why Bell Doesn’t Apply:**  
  Bell’s proof assumes locality from the start. BM never claimed locality, so it sidesteps the theorem. In fact:
  - BM reproduces *all* standard QM predictions (by construction).
  - It violates Bell inequalities—*as it must* to match experiment—thanks to its non-locality.

  ---

  ### **3. Bohm's Role in Bell's Thinking**
  - Bell was deeply influenced by Bohm’s 1952 paper, which proved that *a* hidden-variable interpretation *was possible* (contrary to von Neumann’s alleged "impossibility proof").
  - Bell then asked: *"Are there* ***local*** *hidden-variable theories?"* His theorem answered: **No.**

  ---

  ### **4. Tradeoffs: Why BM Remains Controversial**
  While BM is mathematically consistent and empirically equivalent to QM, it has features many find unappealing:
  - **Radical Non-Locality:** Influences are instantaneous (though *signaling* is still impossible due to ψ’s structure).
  - **Empty Wave Function:** ψ is a physical field guiding particles, but has no sources/sinks—it just "is."
  - **Preference for Position:** BM privileges position as the primary observable; other properties (spin, momentum) are contextual.
  - **No Relativistic Extension:** A fully Lorentz-invariant formulation remains elusive (though progress exists).

  ---

  ### **5. What Bell *Did* Rule Out**
  Bell eliminated a specific class of theories:  
  ❌ **Local Hidden Variables** (e.g., Einstein's hoped-for "complete" QM).  
  ✓ **Non-Local Hidden Variables** (Bohmian mechanics)  
  ✓ **Non-Realist Theories** (Copenhagen, QBism, Many-Worlds*)  

  *Many-Worlds avoids Bell by rejecting realism for a single outcome, not via non-locality.

  ---

  ### **How to Explain This to Your Group**
  > *"Bell's theorem shows that quantum correlations cannot be explained by any theory where particles have pre-existing properties (*realism*) and influences are limited by light-speed (*locality*). Experiments confirm this. However, Bohmian mechanics—a hidden-variable theory proposed by de Broglie and revived by Bohm—survives because it explicitly abandons locality. Particles are guided by a wave function that updates instantaneously across space. While philosophically uncomfortable to some, BM is a logically consistent alternative to standard QM, demonstrating that Bell’s theorem only restricts local realism, not hidden variables universally."*

  ---

  **Further Reading:**  
  - Bell’s original 1964 paper (easier than you’d expect!).  
  - Maudlin’s *Quantum Non-Locality and Relativity* (Ch. 4 for BM’s mechanism).  
  - Dürr & Teufel’s *Bohmian Mechanics* (rigorous but clear).  

  This clarifies why Bohmian mechanics isn't just "cheating" Bell—it’s a legitimate counterexample to the idea that all hidden variables must be local. Well spotted!
