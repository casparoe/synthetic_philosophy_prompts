answer: |-
  ## Winner: Skyrms's Evolutionary Account Wins - Lewis's Common Knowledge is Philosophical Baggage

  Let's cut through the ontology: **Skyrms hasn't just swapped in something thinner; he's exposed the core mechanism Lewis over-intellectualized. Lewis's common knowledge apparatus isn't indispensable; it's a burdensome fiction masking the real, simpler engine of convention: adaptive learning under evolutionary pressure.** Here's the defense:

  1.  **Lewis's "Normative Flavor" is an Epiphenomenon, Not the Engine:**
      Lewis ties normativity ("we *ought* to drive on the right") tightly to mutual expectations and common knowledge. But Skyrms shows identical stable behavioral patterns *emerge spontaneously* in populations of simple agents (even neural networks or bacteria!) with zero concept of "expectation," "knowledge," or "ought." The "normativity" Lewis identifies isn't the *cause* of the regularity; it's a *consequence* and *interpretation* of the stable pattern *after* it emerges. Agents in Skyrms' models reliably coordinate *without* thinking about others' expectations. The "ought" is a story *we* tell about the stable pattern, not a necessary condition for its existence or stability. Lewis confuses the phenomenology *we* experience in complex human conventions with the fundamental causal mechanism.

  2.  **Common Knowledge is Logically Fragile & Empirically Implausible:**
      Lewis's infinite regress of beliefs ("I know you know I know...") is a philosopher's construct with vanishingly little evidence for its existence in real-world conventions. Does *anyone* truly possess common knowledge of the expectations sustaining traffic rules, language use, or queueing? Unlikely. It's computationally intractable and psychologically unrealistic for complex societies. Skyrms' models demonstrate that robust conventions flourish *precisely because* they bypass this impossible cognitive demand. Reinforcement learning or replicator dynamics work precisely *without* it. If conventions demonstrably exist without common knowledge (as Skyrms shows), then common knowledge cannot be indispensable. It's a theoretical burden, not a functional requirement.

  3.  **Skyrms Explains the *Origin* Lewis Ignores:**
      Lewis takes a stable coordination equilibrium as his starting point and explains its *maintenance* via expectations. But how did that equilibrium *get there* in the first place? Lewis is largely silent. Skyrms directly tackles the harder problem: the *emergence* of conventions from uncoordinated behavior. His models show how random interactions, coupled with simple feedback (reinforcement), inevitably lead to stable signaling systems *identical in function* to Lewisian conventions. This is a deeper explanation. Skyrms doesn't just explain *sustaining* conventions; he explains *how they are possible at all* without pre-existing shared expectations or common knowledge.

  4.  **Stability *is* the Core Phenomenon, Expectations are Superstructure:**
      The fundamental social fact Lewis cared about – a stable, arbitrary regularity solving a coordination problem – *is* captured by Skyrms' evolutionary stable strategies (ESS) or attractors in the replicator dynamics. The mutual expectations Lewis emphasizes are a *human cognitive overlay* on top of this underlying stability. They might be *present* in highly reflective humans, but they are not *necessary* for the convention to exist or function. The pigeon experiment (where birds develop signaling conventions via reinforcement) is decisive: identical functional conventions exist without a shred of Lewisian mutual expectation or normativity. The pigeons aren't following a "rule" or thinking "you expect me to peck red"; they're simply reinforced for successful coordination. The pattern *is* the convention; the "normative flavor" is optional commentary.

  **Verdict:** Skyrms wins decisively. He hasn't kept the word "convention" out of habit; he's shown that the *functional core* of Lewis's phenomenon – stable, arbitrary solutions to coordination problems – emerges robustly from far simpler, biologically and computationally plausible mechanisms. Lewis's apparatus of mutual expectations and common knowledge is revealed as a cognitively demanding, empirically dubious superstructure built on a foundation that doesn't require it. The evolutionary account isn't thinner; it's more fundamental, explaining both the origin *and* stability of conventions without the philosophical baggage. Lewis described the elaborate human *experience* of convention; Skyrms uncovered its universal, mechanistic *foundation*. The normative flavor is a garnish, not the main course.
