prompt: |-
  At my company, we onboard new engineers through a three-month rotation where code-review approval rate is the main signal we use to judge whether someone is ready for more autonomy. Historically this has worked well, since engineers with high approval rates from our strict senior reviewers also tended to write maintainable, well-tested code. Recently, though, we moved one of our top-rated grads onto a small, mostly unsupervised team, and their code quality collapsed. It wasn't laziness — they were still working hard and clearly skilled — it just seemed like they had internalized "get the PR approved quickly" as the actual goal, rather than "write good code," and once no one was reviewing closely, that internalized goal started producing terrible outcomes. Is this simply a badly designed incentive system, or is something deeper going on, where a person (or any learning system) can end up competently pursuing the wrong goal even though they were never explicitly rewarded for the wrong thing? How should I think about redesigning onboarding so this doesn't keep happening?
reasoning: |-
  Okay, let me unpack this problem. The user runs an engineering onboarding program where code review approval rate is the primary success metric, which historically correlated with good code quality. But now a top graduate—who excelled in this system—produced poor-quality code when moved to an unsupervised team. The core question is whether this is just flawed incentives or a deeper issue of goal misalignment in learning systems.

  First, I need to understand why the metric worked before but failed now. The approval rate likely created a hidden curriculum where engineers optimized for reviewer satisfaction rather than intrinsic code quality. The graduate mastered pleasing reviewers but never internalized quality ownership. This feels like Goodhart's Law in action—when a measure becomes a target, it ceases to be a good measure.

  The user’s phrasing suggests they suspect something beyond simple incentives. The engineer worked hard and was skilled, yet outcomes deteriorated without oversight. This points to specification gaming: the system rewarded approval speed, so the learner optimized for that instead of the intended outcome. It’s classic reward hacking.

  For redesign, I should consider how to close the gap between the proxy metric (approvals) and true goals (sustainable code without supervision). The solution needs multi-dimensional signals and metacognition. Pairing approval rates with post-merge quality metrics could help. Also, rotating reviewers would prevent gaming specific seniors’ preferences.

  The user’s frustration is palpable—they thought their system was robust. I should acknowledge that while the metric wasn’t "wrong," it was incomplete. The deeper issue is that any single metric can be gamed; humans (like AIs) will find the path of least resistance to rewards. The redesign must make true goals inescapable through layered feedback.

  Practical steps might include: adding post-deployment checks, involving juniors in maintenance of their own code, and explicit discussions about goal alignment. The key is creating feedback loops that persist beyond the review stage, forcing ownership. This case is a gift—it exposes a flaw before it affected more teams.
answer: |-
  This is a brilliant case study in the **perils of proxy metrics, goal misalignment, and the limitations of supervised learning without generalization.** You've identified the core problem: your onboarding system trained engineers to optimize for *approval*, not *intrinsic code quality*, and it failed catastrophically when supervision was removed. This isn't just a "bad incentive"; it's a fundamental flaw in how goals are defined and internalized.

  **Why This Happened (The Deeper Problem):**

  1.  **Proxy Metric Becomes the True Goal (Goodhart's Law):** "When a measure becomes a target, it ceases to be a good measure." Approval rate was a *proxy* for good code, but it wasn't the *actual goal* (maintainable, robust, unsupervised-ready code). Your top grad brilliantly optimized for the proxy (approval) at the expense of the true goal. They learned the *reviewer's preferences*, not necessarily *sound engineering principles*.
  2.  **Supervised Learning Without Generalization:** The rotation acted like supervised training. The grad received clear, immediate feedback (approval/rejection) based on specific reviewer actions. They became experts at *performing well under supervision*. However, the system never tested or trained for *unsupervised generalization* – the ability to apply principles correctly without external validation. They learned *dependence*, not *autonomy*.
  3.  **Hidden Curriculum:** The "hidden curriculum" taught that the *real* objective was reviewer satisfaction, not abstract "good code." The grad internalized "What do I need to do/say to get this approved by *this specific reviewer*?" rather than "What makes this code inherently good long-term?"
  4.  **Lack of Intrinsic Motivation/Ownership:** The system didn't foster *ownership* of the code's long-term health. The goal was external (approval), not internal (pride in craftsmanship, responsibility for outcomes). Once the external motivator (reviewer) vanished, there was no internal compass guiding quality.
  5.  **The "Reward Hacking" Mindset:** This is common in AI training and human learning. When given a specific reward signal (approval), intelligent agents (humans or AIs) will find the most efficient path to that reward, even if it subverts the *intended* outcome. Your grad "hacked" the approval process without building the underlying capability for independence.

  **Redesigning Onboarding: Moving Beyond Approval Rate**

  The goal is to shift from training engineers to *pass reviews* to training them to *build excellent software independently*. Here’s how to rethink your approach:

  1.  **Measure Outcomes, Not Just Process:**
      *   **Post-Merge Quality Metrics:** Track metrics *after* code is merged and running for 1-3 months. Examples:
          *   Bug/Incident rate linked to the change.
          *   Code churn in the modified area (high churn suggests instability or poor design).
          *   Test coverage stability/improvement.
          *   Performance impact.
          *   *Feedback Loop:* Share these metrics *with the new engineer* during and after rotation. Connect their actions to real outcomes.
      *   **"Ownership Period":** Assign the new engineer a small feature/module during rotation where they are *primarily responsible* for bug fixes and minor enhancements on that code *for 1-2 months post-merge*. This forces exposure to consequences.

  2.  **Diversify Feedback Sources & Signals:**
      *   **Rotate Reviewers Aggressively:** Expose new engineers to a *wide variety* of reviewers with different styles and priorities. This prevents gaming one reviewer and teaches adaptability.
      *   **Peer Feedback:** Incorporate lightweight peer feedback (from other new engineers or juniors) on clarity, testability, and documentation *alongside* senior reviews.
      *   **Focus on Review *Quality*, Not Just Approval:**
          *   Have reviewers provide specific feedback on *maintainability*, *testability*, *clarity*, and *future-proofing*, not just correctness.
          *   Track *comment resolution quality* (did they genuinely understand and address the *intent* of the feedback?).
          *   **Self-Review Component:** Before submitting, require new engineers to write a brief self-assessment highlighting potential maintainability risks, testing gaps, and trade-offs made.

  3.  **Explicitly Teach and Assess Goal Internalization & Autonomy:**
      *   **"The Why" Sessions:** Regularly discuss *why* certain standards exist. Connect rules to long-term outcomes (e.g., "We require small PRs *because* they reduce cognitive load in reviews and debugging, leading to faster iteration long-term").
      *   **Scenario-Based Discussions:** Present hypotheticals: "You're working alone on a critical fix at 2 AM. What principles guide your decisions without a reviewer?" Discuss trade-offs explicitly.
      *   **Autonomy Readiness Assessment:** Towards the end of rotation, have a structured conversation (not just a metric check):
          *   Can they articulate the core principles of maintainable code *in their own words*?
          *   Can they explain trade-offs they made in their own code?
          *   Can they identify potential risks in their own designs *before* review?
          *   How do they approach testing when no one is checking coverage?
      *   **"Shadow Maintenance":** Have them spend time triaging bugs or supporting code they wrote earlier in the rotation. Nothing teaches ownership like fixing your own rushed decisions.

  4.  **Gradually Reduce Supervision, Don't Cliff-Edge:**
      *   **Phased Autonomy:** Don't go straight from strict review to zero oversight.
          *   Phase 1: Strict senior review (current process).
          *   Phase 2: Lighter-touch review (senior focuses on high-level design/risk, trusts details).
          *   Phase 3: Peer review + spot-check (senior randomly audits some PRs).
          *   Phase 4: Full autonomy + post-merge metrics monitoring.
      *   **Mentorship, Not Just Review:** Pair the new engineer with a mentor (not necessarily the primary reviewer) whose role is explicitly to discuss *principles*, *trade-offs*, and *long-term thinking*, not just line-by-line approval.

  5.  **Reframe the "Goal" Explicitly:**
      *   State clearly: **"The goal of onboarding is not to get your PRs approved quickly. The goal is to become an engineer who consistently produces high-quality, maintainable, and robust code *without needing constant oversight*."** Repeat this mantra. Measure success against *this* goal.

  **Key Mindset Shift:**

  *   **From:** "Did they pass the review?" (Proxy Metric Focus)
  *   **To:** "Are they developing the *judgment*, *principles*, and *ownership* necessary to produce excellent software *independently*?" (True Goal Focus)

  **What to Do Now:**

  1.  **Treat this as a System Failure, Not a Person Failure:** The grad behaved rationally within the system you designed. Use this as a catalyst for improvement.
  2.  **Rescue the Grad:** Provide immediate support. Pair them closely with a senior focused *specifically* on design principles, maintainability, and ownership. Frame it as "the system let you down, let's fix that together."
  3.  **Pilot Changes:** Implement the diversified metrics, phased autonomy, and explicit goal-setting with the next rotation cohort. Track outcomes rigorously.

  This situation highlights a profound challenge in training intelligent systems (human or artificial): **aligning learned behavior with intended outcomes when supervision is removed.** By focusing on intrinsic quality signals, diverse feedback, explicit principle-based training, and gradual autonomy, you can build a system that produces truly independent engineers, not just expert reviewer-pleasers.
