answer: |-
  Your analysis is perceptive and largely correct. Augustine's asymmetry hinges precisely on the **consequences of the specific lie's content**, specifically the **spiritual harm** caused by the false *affirmation of heresy* compared to the false *denial of heresy*. Here's a breakdown of the argument, the asymmetry, the tension with his definition, and the "cunning spy" illustration:

  1.  **The Core Asymmetry:**
      *   **Catholic Spy's Lie:** Falsely *affirms* heretical beliefs (praises Priscillianist dogmas/figures).
      *   **Priscillianist's Lie:** Falsely *denies* heretical beliefs (pretends to be orthodox to avoid detection).

  2.  **The Harm Mechanism:**
      *   **Affirming Heresy (Spy's Lie):** When the spy falsely praises heretical doctrines or revered heretical figures (like Priscillian), this public affirmation has a direct, dangerous consequence:
          *   It can **confirm** a wavering individual in their heresy ("will be confirmed among them").
          *   It can **convert** an orthodox or undecided bystander to heresy ("will be transferred to them").
          *   This "preaching" of heresy, even falsely intended, actively **spreads the poison** and **endangers souls** ("slays the soul... or... doth in the same death sink, and hold it down"). Heretical belief damns.
      *   **Denying Heresy (Heretic's Lie):** While also a lie, the heretic's false denial or pretense of orthodoxy does *not* actively spread heresy. It might allow the heretic to remain undetected, but it doesn't *positively affirm* false and damning doctrines to others. The harm is primarily the deception itself and the avoidance of correction, but it doesn't actively *recruit* or *confirm* others in damnable error in the same direct way.

  3.  **Reconstructing the Principle:**
      Your guess is accurate. Augustine is implicitly relying on a principle beyond the bare intent to deceive: **The moral gravity of a lie is significantly increased when the *content* of the false assertion, if believed by others, directly causes grave spiritual harm (specifically, leading them into or confirming them in damnable heresy).** The lie becomes not just a violation of truthfulness, but an active instrument of spiritual corruption.

  4.  **Tension with the Austere Definition:**
      This *does* create tension with Augustine's otherwise intention-centered definition of lying (asserting what one believes to be false with intent to deceive). Here, the definition captures the *essence* of the sin, but the *seriousness* is dramatically amplified by the *consequences* of the specific false content being propagated.
      *   **Augustine's Resolution (Implied):** While the *malice* of the lie resides in the will to deceive, the *gravity* of the offense is determined by the *nature of the harm* it causes or risks. Affirming heresy risks the eternal damnation of souls – the ultimate harm. Denying heresy, while sinful, primarily risks the liar's own avoidance of correction and hinders the Church's disciplinary work, which, while serious, is arguably less catastrophic than actively damning others.
      *   **Critique:** This introduces a consequentialist element into an otherwise deontological framework centered on the act of lying itself. Augustine is effectively saying the *kind* of lie matters immensely for its moral weight, based on foreseeable harm. Some later thinkers (like Aquinas) would more formally distinguish the *malice of the lie* (intrinsic) from the *circumstances* (like the harm caused, which aggravate the sin).

  5.  **Parsing the "Cunning Spy" Illustration:**
      The illustration vividly demonstrates the *mechanism* of the harm Augustine fears. The key feature doing the moral work is **the spy's false *affirmation* and *praise* of heretical figures/doctrines.**
      *   **Sequence & Moral Weight:**
          *   **Praising Dictinius (a lapsed but corrected Catholic):** Tolerable ("more tolerable thus far") because Dictinius is *not* a condemned heretic. Praising him doesn't actively spread core Priscillianist error. This sets up the contrast.
          *   **Praising Priscillian (the condemned, impious heretic):** This is the critical, morally reprehensible act ("reverend mention... of an impious and detestable person"). By falsely attributing reverence to Priscillian, the spy is *actively propagating the core error* of the sect – the veneration of its heretical founder.
          *   **The Harm:** This false praise is presented as "preaching." If the target was wavering ("had not been a firm Priscillianist"), this endorsement from someone perceived as knowledgeable *confirms* them in error. If they weren't a heretic at all, it could *convert* them. Augustine uses stark language: this act "slays the soul" – it directly causes or deepens the state of spiritual death (damnation).
      *   **What's Merely Color?** The details about Dictinius provide context and contrast. The description of Priscillian as "impious," "detestable," "condemned" emphasizes the *gravity* of falsely praising him. The "net" metaphor highlights the deceitful intent, but the *lethal* aspect comes specifically from the *content* of the lie – the affirmation of heresy.

  **Conclusion:**

  You have correctly reconstructed the argument. Augustine's asymmetry rests on the principle that falsely *affirming heresy* (the spy's tactic) is far worse than falsely *denying heresy* (the heretic's tactic) because the former actively spreads damning falsehood, potentially confirming or converting others to spiritual death. The "cunning spy" illustration powerfully demonstrates this by focusing on the lethal consequences of the spy's false praise of the heretical leader Priscillian.

  This *does* introduce a significant tension with Augustine's austere, intention-centered definition of lying. He implicitly argues that while the *sinfulness* of lying lies in the will to deceive, the *gravity* of that sin is massively amplified when the lie's content, if believed, causes the ultimate harm of leading souls into damnable error. The lie becomes an instrument of spiritual murder. This consequentialist element concerning harm is crucial to understanding why he sees the spy's lie as uniquely "more pernicious" or "more perilous."

  **For your seminar:** This tension is a rich point for discussion. You could frame it as Augustine wrestling with the limits of his own definition when faced with the catastrophic potential consequences of certain lies. Does the content *fundamentally* change the nature of the lie, or does it merely aggravate its sinfulness? How does this square with his absolute prohibition? The "cunning spy" passage is key evidence for his focus on consequences in this specific, high-stakes scenario.

  Would you like suggestions for discussion questions or secondary sources addressing this tension in Augustine's thought?
