prompt: |-
  Hey — I'm the ethics professor who got roped into my state parole board's risk-tool advisory panel (mostly so they can say a philosopher signed off). We ran two competing actuarial tools on the same redacted case file and got 63% vs 21% chance of reoffending in three years for the same guy — not a bias thing, both use defensible, race-blind variables, they just build his comparison group differently (one matches him nationally on offense type and criminal-history score, the other locally on a tighter set including age and neighborhood). Both vendors insist their number is simply the correct probability for this individual. Half the panel wants to mandate whichever tool matches on more variables, since "more specific" sounds more accurate. The other half says theres no principled place to stop narrowing the match — match him on his birthday too and every "probability" collapses to 0 or 1 for a sample of one — so maybe handing commisioners one clean percentage was never coherent in the first place. I owe the panel a short memo by Thursday: give one concrete recommendation (adopt tool A, adopt tool B, drop both for clinical judgment, require a range instead of a point estimate, whatever), real reasons for it, and an honest crack at the best argument for whichever option you don't pick.
reasoning: |-
  Okay, let me unpack this ethics professor's parole board dilemma. The core tension hits right at philosophy of science meets criminal justice: two "objective" risk tools giving wildly different probabilities (63% vs 21%) for the same person, each claiming mathematical truth. 

  First, the professor's framing is telling—they're clearly skeptical of the board using them as ethical cover. The panel's split between "more variables = more precise" and "infinite specificity destroys probability" mirrors classic debates about reference classes. I recall Hájek's work on how single-case probabilities require careful reference class selection, and this case shows why it matters practically.

  Hmm... both approaches have statistical merit but philosophical fragility. The national tool (offense type + criminal history) casts a wide net but ignores local context. The local tool (adding age/neighborhood) risks overfitting while accounting for environmental factors. Neither vendor admitting their number is fundamentally group-based feels ethically concerning—it masks the uncertainty.

  The birthday paradox example is spot-on. If we take matching to extremes, we get absurdity. But the panel isn't wrong to want specificity—neighborhood effects on recidivism are real, as Sampson's research shows. Still, treating any point estimate as "the" probability for an individual is epistemically shaky. 

  What's the least worst path forward? Mandating one tool feels unsupported. Clinical judgment alone has proven biases. A range seems promising—it forces commissioners to confront uncertainty. Maybe present both numbers with explanation? But that could confuse time-pressed officials... 

  Ah! The professor needs a concrete rec. Best compromise: require a risk range (21-63%) with mandatory footnotes on methodology. Forces transparency while preserving utility. Downside: commissioners might just average them. But it's better than pretending one number is "correct." 

  Counterargument: commissioners crave simplicity. Giving a span could lead to arbitrary decisions. Still, oversimplifying risks greater harm. The memo should stress that precision theatre is more dangerous than honest uncertainty.
answer: |-
  Here's a concise memo addressing your dilemma, with a clear recommendation, reasoning, and a fair counterargument:

  ---

  **TO:** Parole Board Risk-Tool Advisory Panel  
  **FROM:** Dr. [Your Name], Ethics & Philosophy  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation on Competing Risk Assessment Tools  

  ### Recommendation
  **Adopt neither tool as a standalone point estimate. Instead, require both tools be run concurrently, presenting commissioners with a risk *range* (e.g., 21–63%) alongside a brief explanation of the methodological divergence.**

  ### Reasons for Recommendation  
  1. **Epistemic Honesty**: Neither 21% nor 63% is "the correct probability" for this individual. Both are defensible *group-based estimates* derived from different reference classes (national offense/history vs. local age/neighborhood). Presenting a range acknowledges the irreducible uncertainty in predicting individual behavior from aggregate data.  
  2. **Avoids False Precision**: A single percentage falsely implies scientific certainty where none exists. Mandating one tool based on "more variables" ignores the statistical paradox that over-specific matching collapses predictability (e.g., matching birthdays yields useless 0%/100% "probabilities").  
  3. **Enhances Deliberative Justice**: A range prompts commissioners to critically engage with *why* the estimates diverge (e.g., "Does neighborhood context outweigh criminal history here?"). This aligns with parole’s normative purpose: individualized judgment under uncertainty.  
  4. **Pragmatic Transparency**: Retaining both tools leverages their complementary insights while exposing limitations. Clinical judgment remains essential but is better informed by transparent data than obscured by a misleading point estimate.  

  ### Best Argument for the Alternative (Mandating the "More Specific" Tool)  
  Proponents of selecting the local-context tool (21%) argue that **granular matching improves relevance**. If reoffense risk is meaningfully shaped by age, neighborhood, and local support systems, a locally tailored cohort provides a better predictor than broad national aggregates. Forcing commissioners to use a single number—despite its flaws—avoids analysis paralysis and ensures consistent, efficient decisions. A narrow range (e.g., matching on 5 variables instead of 2) *can* balance specificity with statistical stability better than extreme over-matching.  

  ### Why This Alternative Fails  
  While granularity *can* improve relevance, it doesn’t resolve the core problem: **no reference class generates a "true" individual probability**. Prioritizing one tool’s methodology arbitrarily privileges certain variables (e.g., neighborhood) over others (e.g., offense severity). Efficiency gained through false precision risks unjust outcomes by masking uncertainty.  

  ### Implementation  
  - **Format**: "Risk Range: 21–63%. Divergence reflects differing cohort models: Tool A (national offense/history) vs. Tool B (local age/neighborhood)."  
  - **Training**: Commissioners require briefings on interpreting ranges (e.g., wider spans indicate higher uncertainty).  
  - **Review**: Audit cases where ranges exceed 30% divergence to refine future tool selection.  

  ---  
  This approach honors statistical rigor, ethical transparency, and the parole board’s duty to exercise humane judgment amid uncertainty. I welcome further discussion before Thursday’s deadline.  

  Respectfully,  
  Dr. [Your Name]
