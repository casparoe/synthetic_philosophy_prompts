prompt: |-
  Me and my friend Priya got into it pretty badly last night over Galileo's "Letter to the Grand Duchess Christina" -- she's finishing a history of science PhD and is definately smarter than me about this period, but I still think she's wrong. Her position is that the whole letter is basically a legal brief dressed up as theology, written by a guy who already knows the Inquisition is coming and is building himself deniability out of the Church Fathers. My position was that some of the exegesis in there is actually careful, not just convenient -- but I couldn't really hold that position once she made me reread the bit near the end about Joshua making the sun stand still, which she says gives the whole game away.

  Context in case it matters: a page or so earlier Galileo points out that under the old Ptolemaic astronomy, literally stopping the sun would actually make the day shorter, not longer, since the sun's own motion runs opposite to the daily rotation of the "primum mobile" -- so even a strict geocentrist can't take Joshua totally literally either. Then he gets to this part (quoting Stillman Drake's translation, trimmed down a bit):

  "something of which we are to take no small account is that by the aid of this Copernican system we have the literal, open, and easy sense of another statement that we read in this same miracle, that the sun stood still in the midst of the heavens. Grave theologians raise a question about this passage, for it seems very likely that when Joshua requested the lengthening of the day, the sun was near setting and not at the meridian... Hence they are forced to interpret the words in the midst of the heavens a little knottily, saying that this means no more than that the sun stood still while it was in our hemisphere; that is, above our horizon. But unless I am mistaken we may avoid this and all other knots if, in agreement with the Copernican system, we place the sun in the 'midst' -- that is, in the center -- of the celestial orbs and planetary rotations, as it is most necessary to do. Then take any hour of the day, either noon, or any hour as close to evening as you please, and the day would be lengthened and all the celestial revolutions stopped by the sun's standing still in the midst of the heavens; that is, in the center, where it resides."

  I cant honestly reconstruct the actual argument anymore, we were like three glasses of wine in by that point. Can you walk me through the astronomy -- why exactly does "midst of the heavens" force geocentrists into that awkward "well it just means our hemisphere" reading, and why does swapping to the Copernican picture supposedly let you take the phrase completely literally no matter what time of day the miracle happened? And once the mechanics are actually clear to me, I'd genuinely like your take on the bigger thing Priya and I couldn't settle: does noticing something like this look to you like honest close reading of scripture, or does it look more like a smart guy who already had his answer and got lucky finding one verse that scans better his way? We never resolved it, so don't feel like you have to be diplomatic about it.
