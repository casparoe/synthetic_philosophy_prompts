answer: |-
  Here's a strict, rubric-based grading of Priya's response, category by category, with justification and a final score:

  ### Grading Breakdown

  1.  **Category 1: Explains why a cheap/costless signal can't stay honest (5 pts)**
      *   **Priya's Answer:** "The reason a cheap signal doesn't work is that if it costs the sender nothing, a low-quality individual has just as much incentive to send it as a high-quality one does -- nothing is stopping a weak male from 'lying' and displaying the exact same signal as a strong one. Once that happens the signal doesn't carry real information anymore, so receivers should evolve to just ignore it and the whole system collapses."
      *   **Grade:** **5/5**
      *   **Justification:** Priya perfectly captures the core problem. She explicitly states that low-quality individuals can easily mimic the signal at no cost ("nothing is stopping..."), leading to deception ("lying"), which destroys the information value of the signal ("doesn't carry real information"). She correctly concludes that receivers will stop responding ("ignore it"), causing the signaling system to break down ("the whole system collapses"). This is a textbook explanation.

  2.  **Category 2: Correctly states what must be true about the COST & gets history right (5 pts)**
      *   **Priya's Answer:** "For this to work, the cost has to be something a low-quality individual would find not worth paying, since the fitness hit outweighs whatever benefit they'd get, while a high-quality individual can pay it and still come out ahead overall. This was actually Zahavi's big breakthrough in his 1975 paper, where he worked out the math and showed this kind of costly signalling can be an evolutionarily stable strategy, which is what finally got a lot of skeptical biologists on board after years of people doubting it."
      *   **Grade:** **5/5**
      *   **Justification:** Priya precisely describes the differential cost requirement: the signal cost must impose a *net fitness loss* on low-quality individuals ("fitness hit outweighs whatever benefit") but can be *net beneficial* for high-quality individuals ("can pay it and still come out ahead"). She accurately recounts the historical context: Zahavi's original idea (1970s) faced skepticism until mathematical models (specifically Grafen's in 1990, though Zahavi's 1975 paper laid groundwork; Priya gets the key point that math resolved it later) demonstrated it could be an Evolutionarily Stable Strategy (ESS), leading to wider acceptance. "Years of people doubting it" correctly reflects the controversy.

  3.  **Category 3: Correctly distinguishes a "handicap" from an "index signal" (5 pts)**
      *   **Priya's Answer:** "A handicap is different from an index signal, even though both are supposed to be hard to fake. The peacock's tail is actually a really good example of an index: its so metabolically expensive and such a predation risk that only a genuinely healthy, high-quality male can grow a big symmetrical one and survive, so peahens can basically read tail size as a direct readout of male condition."
      *   **Grade:** **1/5**
      *   **Justification:** Priya **reverses the definitions**. Her description of the peacock's tail ("metabolically expensive... predation risk... only a genuinely healthy... male can grow... and survive") is actually a textbook description of a **Zahavian handicap** – a costly signal whose *cost* reliably indicates quality because only high-quality individuals can afford to bear it. An **index signal** is one that is *physically impossible or extremely difficult to fake* because it is directly linked to an underlying trait by physical or physiological constraints (e.g., the depth of a frog's croak is tied to its body size/larynx; antler size is tied to nutrition/health during growth). She correctly states both are hard to fake but fails to distinguish *why*. This is a fundamental error for this category.

  4.  **Category 4: Both examples accurate & evaluated against (b) and (c) (5 pts)**
      *   **Priya's Answer:** "For my examples: the non-human one is the peacock's tail like I just described, its costly enough that it reliably tracks male quality. For the human one I picked promposals -- spending real money, building some elaborate poster or setup, and publicly risking getting rejected is a genuine cost, and someone who isn't actually that into the person has no reason to pay it, so a big promposal credibly signals real interest in a way that just casually asking in the hallway wouldn't."
      *   **Grade:** **2/5**
      *   **Justification:**
          *   **Non-Human (Peacock):** She misclassifies it as an index signal (error from Cat 3). Her evaluation *only* references cost (Cat 2b - "costly enough... reliably tracks") but **fails to evaluate it against the distinction in (c)**. Since she misclassified it, she couldn't correctly evaluate it against (c). She doesn't mention if it's a handicap or index correctly.
          *   **Human (Promposals):** The example itself is plausible. She identifies costs (money, effort, public rejection risk) and argues it signals genuine interest ("real interest") because someone not interested wouldn't pay the cost ("no reason to pay it"). This attempts to apply the cost principle (Cat 2b). However, she **fails entirely to evaluate it against the distinction in (c)**. Is it a handicap or an index? She doesn't say or analyze it. Furthermore, the evaluation against (b) is superficial; it doesn't deeply consider if the costs *differentially impact* individuals based on their underlying "quality" (genuineness of interest + social capital/wealth) in a way that makes it a reliable Zahavian signal (e.g., could a popular person do a big promposal insincerely for fun/status at low reputational cost?).
          *   **Overall:** One example misclassified and poorly evaluated (only cost mentioned, not Cat c). The other example described with a weak attempt at evaluating cost (Cat b) and *zero* evaluation against the handicap/index distinction (Cat c). Significant points lost.

  ### Final Score & Grade
  *   Cat 1: 5
  *   Cat 2: 5
  *   Cat 3: 1
  *   Cat 4: 2
  *   **Total: 13/20**
  *   **Letter Grade: C+** (Standard scale: 13/20 = 65% = D, but AP/college-level often adjusts; 13/20 is commonly a C+).

  ### JSON Breakdown (As Requested)

  ```json
  {
    "category1_score": 5,
    "category1_justification": "Perfect explanation of cheap signal collapse due to cost-free mimicry by low-quality individuals, leading to loss of information and receiver ignoring.",
    "category2_score": 5,
    "category2_justification": "Correctly describes differential cost requirement (net loss for low-quality, net benefit for high-quality) and accurately notes historical context of mathematical validation resolving skepticism.",
    "category3_score": 1,
    "category3_justification": "Fundamental error: Reverses definitions. Misidentifies the peacock's tail (a classic Zahavian handicap due to cost) as an index signal (which relies on physical/physiological constraints, not just cost).",
    "category4_score": 2,
    "category4_justification": "Peacock: Misclassified (error from Cat 3), evaluated only on cost (Cat b), not on distinction (Cat c). Promposal: Plausible example, superficial evaluation of cost (Cat b), no evaluation against handicap/index distinction (Cat c).",
    "total_score": 13,
    "letter_grade": "C+"
  }
  ```

  ### Key Flat-Out Mistakes to Mention to Priya (Beyond Rubric)

  1.  **Handicap vs. Index Reversal:** This is the most critical error. Priya swapped the definitions.
      *   **Correction:** A **Zahavian handicap** is a signal that is *costly to produce/maintain* (like the peacock's tail). Its honesty comes from the fact that the *cost* is too high for low-quality individuals to bear profitably, but high-quality individuals can afford it. An **index signal** is one that is *physically impossible or extremely difficult to fake* because it is directly tied to an underlying trait by a physical or physiological constraint. Examples: The depth of a frog's croak is constrained by the size of its vocal sac/larynx (directly indicates body size). The size of a deer's antlers is constrained by nutrition and health during growth. Priya described the peacock's tail correctly *as a handicap*, but called it an index.

  2.  **Peacock Example Classification:** As a direct result of the above, her peacock example is incorrectly labeled as an index. It is the quintessential example of a handicap.

  3.  **Lack of Evaluation Against (c) in Examples:** While the rubric covers this under Cat 4, it's worth emphasizing. For *both* examples, Priya failed to explicitly state whether she thought they were handicaps or indices and justify that classification based on the definition she (mis)stated. She only focused on cost (Cat b) for evaluation.

  4.  **Superficial Promposal Evaluation:** While not entirely wrong, her promposal analysis doesn't grapple with whether the costs *differentially impact* signalers based on their underlying "quality" (sincerity + resources/social status) in a way that strictly prevents low-quality (insincere) individuals from signaling. Could a very popular/wealthy individual make a grand promposal without much sincere interest, bearing the cost easily for social status/amusement? This complexity weakens it as a pure Zahavian handicap example.

  **In Summary for Priya:** Her core understanding of cheap signals failing and the cost requirement for handicaps is strong. However, she fundamentally confused the definition of a handicap signal with an index signal, misapplying this to the peacock example and failing to use this distinction to evaluate her examples. This significantly impacted her score, especially in categories 3 and 4.
