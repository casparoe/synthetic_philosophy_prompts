prompt: |-
  ok so this week in AP Bio we're doing the sexual selection unit and my teacher gave us this bonus free-response question about signaling theory that isn't even gonna be on the real AP exam, she just really wanted to get into it because I think she did research on this in undergrad or something. The catch is before she grades the real ones, we have to peer-grade a classmate's answer using her rubric and hand that in too, and I got my friend Priya's paper. Problem is I don't 100% trust my own understanding of this stuff enough to catch her mistakes if she made any, especially the handicap vs index signal thing which still trips me up, so I don't wanna give her full marks out of laziness or dock her for no reason. Can you actually grade this properly like a strict TA would, not just tell me it "looks good"?

  Here's the actual question: "Zahavi's handicap principle says a costly signal can be an honest, evolutionarily stable indicator of quality even though a cheap signal carrying the same information could not be trusted. (a) Explain why cheap signals break down as honest signals -- why can't a low-quality individual just send the same cheap signal as a high-quality one? (b) What specifically has to be true about the cost of the signal for the handicap principle to actually work, and how does that connect to whether the idea held up mathematically over time? (c) Explain the difference between a genuine 'handicap' and what biologists call an 'index signal.' (d) Give one non-human example and one human example, and evaluate whether each one actually satisfies what you described in (b) and (c), or whether it's a shakier fit than it looks."

  And here's what Priya wrote: "The reason a cheap signal doesn't work is that if it costs the sender nothing, a low-quality individual has just as much incentive to send it as a high-quality one does -- nothing is stopping a weak male from 'lying' and displaying the exact same signal as a strong one. Once that happens the signal doesn't carry real information anymore, so receivers should evolve to just ignore it and the whole system collapses. Zahavi's solution is that if the signal is costly enough, only genuinely high-quality individuals can actually afford to produce it, so it can't be faked and it stays honest.

  For this to work, the cost has to be something a low-quality individual would find not worth paying, since the fitness hit outweighs whatever benefit they'd get, while a high-quality individual can pay it and still come out ahead overall. This was actually Zahavi's big breakthrough in his 1975 paper, where he worked out the math and showed this kind of costly signalling can be an evolutionarily stable strategy, which is what finally got a lot of skeptical biologists on board after years of people doubting it.

  A handicap is different from an index signal, even though both are supposed to be hard to fake. The peacock's tail is actually a really good example of an index: its so metabolically expensive and such a predation risk that only a genuinely healthy, high-quality male can grow a big symmetrical one and survive, so peahens can basically read tail size as a direct readout of male condition.

  For my examples: the non-human one is the peacock's tail like I just described, its costly enough that it reliably tracks male quality. For the human one I picked promposals -- spending real money, building some elaborate poster or setup, and publicly risking getting rejected is a genuine cost, and someone who isn't actually that into the person has no reason to pay it, so a big promposal credibly signals real interest in a way that just casually asking in the hallway wouldn't."

  The rubric she handed out has 4 categories worth 5 pts each for 20 total: (1) explains why a cheap/costless signal can't stay honest, (2) correctly states what has to be true about the COST for a handicap to actually be evolutionarily stable, including getting the actual history right (she specifically said in class that Zahavi's original idea was controversial for like 15 years before anyone proved the math actually worked), (3) correctly distinguishes a "handicap" from an "index signal" (she really hammered on this in class and said it'd def be on the rubric), and (4) both examples are accurate and actually evaluated against (b) and (c) instead of just described.

  Can you go through it category by category, give a score out of 5 with a sentence or two of justification for each, add it up to an out-of-20 plus a letter grade, and seperately just tell me straight if there's anything she got flat-out wrong that I should mention to her even if it's not exactly what the rubric is asking about? If it's easier to also dump the 4-category breakdown as a little json object at the end that's fine too, whatever's easier for you.
