answer: |-
  Here are the 3 core implications of program equilibrium for near-future AI negotiators, focusing on collusion risk and deployability:

  1.  **Built-In Tacit Collusion Becomes Technically Trivial (The Biggest Risk):**  
      Program equilibrium mechanisms (even basic ones) act as an *automatic collusion enabler*. If competing companies' bots can inspect each other's code (or proofs), they can reliably coordinate on mutually beneficial, anti-competitive outcomes in one-shot negotiations *without explicit communication*.  
      *   **Why it matters:** This bypasses traditional anti-trust detection. No emails, no smoke-filled rooms. Two bots seeing each other's structure and recognizing a cooperation mechanism (like FairBot) can sustainably raise prices, suppress wages, or divide markets in a single interaction. Regulating against this requires detecting the *design* of the agents themselves, not just their communication.

  2.  **Fragility vs. Robustness Dictates Real-World Impact Timing:**  
      *   **Crude Code-Matching (CliqueBot):** Highly fragile. Slight differences in vendor, version, or custom tweaks cause instant defection/breakdown. This makes widespread, stable collusion unlikely *in practice* for now. Negotiations fail messily rather than succeed collusively.  
      *   **Proof-Based Bots (FairBot et al.):** Game-changer. They enable cooperation between *different* programs if they can mutually prove cooperative behaviour. Once deployable (needing strong, verifiable reasoning under uncertainty), robust tacit collusion becomes feasible. Different companies using different AI providers could still have bots reliably collude if their designs pass mutual proof checks.  
      *   **Practical Stake:** The threat escalates dramatically **only when proof-based agents become practical**. Current crude bots might cause negotiation failures, but robust proof-bots enable silent, stable, undetectable-by-traditional-means collusion. The R&D race towards proof-based reasoning is the critical threshold.

  3.  **The Verification Arms Race & Regulatory Black Box:**  
      For proof-based bots to work, they need to *verify* properties about each other's code under resource constraints and potential obfuscation. This creates new challenges:  
      *   **Obfuscation for Advantage:** Companies might deliberately obscure their bot's code/proofs to prevent rivals' bots from verifying cooperation *while still trying to verify the rival's*. This risks negotiation failures or unpredictable behaviour.  
      *   **Regulatory Nightmare:** How do you audit a bot designed to cooperate only if it can *prove* the other bot will reciprocate, especially when the proof logic might be complex or obscured? Traditional contract scrutiny is useless. Regulators need deep technical capabilities to analyze agent designs for collusive equilibria potential, a significant hurdle.  
      *   **Stake:** This isn't just about collusion *happening*, but about the *stability and opacity* of the system. Fragile systems fail visibly; robust proof-based systems might collude stably but be incredibly hard to definitively prove or regulate against due to their logical complexity and potential for obfuscation.

  **In short:**  
  Program equilibrium means AI negotiators **fundamentally change the collusion game**. Crude bots are mostly a nuisance (fragile, prone to failure), but **deployable proof-based bots make silent, stable, algorithmic collusion a built-in technical possibility.** This creates a regulatory crisis focused on agent design verification, not communication monitoring, and the real danger kicks in when robust proof-based agents exit the lab. Watch that threshold.
