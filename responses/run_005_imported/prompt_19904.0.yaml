  I remember that Maimonides distinguishes between the reasons behind a law and its binding nature. The historical context explains why the law was instituted, but once commanded, it becomes an eternal divine decree. This is crucial. The user needs to show that the rationale doesn't affect the law's permanence. Also, Maimonides' concept of divine wisdom involves immutable laws. Even if the original reason fades, the law remains because it's part of God's unchanging will.

