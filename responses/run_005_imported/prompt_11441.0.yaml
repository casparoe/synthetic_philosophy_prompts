answer: |-
  This is a brilliantly observed connection to democratic theory – you've nailed the core dilemma. The "boundary problem" is exactly what your co-op is wrestling with. Here's a breakdown of the key theoretical perspectives and their **practical implications** for a small self-governing group like yours:

  1.  **The "All-Affected" Principle:**
      *   **Core Idea:** Anyone significantly affected by a decision should have a say in making it. Justification is based on impact.
      *   **Implication for Your Co-op:** This strongly supports your argument for the subletters. They *are* directly affected by the special assessment (paying it via rent increases), the roof repair (living with the disruption), and building policies (daily life). The absentee owner, while financially affected, experiences minimal day-to-day impact.
      *   **Practical Challenge:** Defining "significantly affected" is messy. How *much* impact is needed? Does a visiting grandparent count? A frequent delivery person? This principle, while morally appealing, risks making boundaries infinitely expandable and administratively impossible for a small group.

  2.  **The "All-Subjected" Principle:**
      *   **Core Idea:** Anyone *subject to the binding rules and authority* of the governing body should have a say. Justification is based on being governed.
      *   **Implication for Your Co-op:** This leans towards your friend's position, but with nuance. Shareholder-members are formally subject to the co-op's bylaws, rules, and financial obligations (like assessments). Subletters are subject to the *rules* (quiet hours, pet policies) via their lease, but they are *subject to the shareholder*, not directly to the co-op board's authority. The board governs the *shareholders*, who then govern their tenants via lease agreements. The absentee owner *is* directly subject to the board's authority and financial demands.
      *   **Practical Advantage:** This creates a clearer, more stable boundary based on *legal membership*. It aligns with the existing co-op structure (bylaws, proprietary lease) and is administratively feasible. The "subjected" group (shareholders) is clearly defined.

  3.  **The "Bounded Membership" (Associative) View:**
      *   **Core Idea:** The right to participate derives from membership in a pre-defined association. The association itself defines the criteria for membership and voting rights based on shared interests, commitments, or ownership.
      *   **Implication for Your Co-op:** This is the *de facto* legal reality of your co-op. Your bylaws and proprietary leases define shareholders as the voting members. This view prioritizes stability, commitment (financial investment), and the legal contract that formed the co-op.
      *   **Practical Reality:** This is the baseline. Changing this requires amending the bylaws, which is a significant undertaking requiring shareholder vote. It emphasizes the *contractual obligation and investment* aspect of ownership.

  **The Regress Problem (Who Decides Who Decides?):**
  *   **The Issue:** Any principle used to define the electorate (all-affected, all-subjected) itself needs someone to define and apply it. Who gets to decide *who* is affected or subjected enough?
  *   **Implication for Your Co-op:** This highlights why the **Bounded Membership** view is the operational default. The existing members (shareholders) are the only ones with the *legal authority* to change the rules defining membership/voting. Trying to implement "all-affected" would require the current electorate (shareholders) to agree to dilute their own exclusive power – which is unlikely unless they see a compelling reason.

  **What This Cashes Out To For Your Co-op:**

  1.  **The Legal Baseline:** Your friend is technically correct *under the current rules*. Voting rights are tied to share ownership/membership as defined in your co-op's governing documents (bylaws, proprietary lease). This is the "Bounded Membership" view in action and provides clear administrative lines.
  2.  **The Moral/Practical Tension:** You are highlighting a genuine legitimacy gap. Long-term residents deeply affected by decisions lack formal voice, while disengaged owners hold power. This aligns strongly with the "All-Affected" principle and resonates with the "All-Subjected" principle regarding daily life rules.
  3.  **The Absentee Owner Nuance:** While absentee owners aren't *physically* affected, they *are* financially affected and *are* legally subjected to the board's authority. Their financial stake is a legitimate interest under the Bounded Membership and All-Subjected views. Dismissing their vote entirely ignores their legal and financial responsibility.
  4.  **The Subletter's Position:** Their lack of formal voice stems from their contractual relationship with the *shareholder*, not directly with the *co-op corporation*. The co-op governs the shareholder; the shareholder governs the tenant.

  **Practical Pathways Forward (Not Just Theory):**

  *   **Amend the Bylaws (The Nuclear Option):** If the moral argument gains significant traction *among shareholders*, propose a bylaw amendment to grant voting rights to long-term subletters (e.g., resident for X years, primary occupant). This directly addresses the "All-Affected" concern but requires convincing current voters to share power. **Hurdles:** High bar for approval, potential legal complexity, resistance from investors.
  *   **Create an "Associate" or "Resident Advisory" Status:** A more achievable step. Establish a formal non-voting resident council or advisory role. Long-term subletters could:
      *   Receive all board communications/agendas.
      *   Have a designated time to speak at open board meetings.
      *   Provide formal feedback on specific issues (like the roof assessment impact).
      *   Have a liaison to the board.
      *   **Impact:** Gives them a voice and ensures their concerns are heard by decision-makers (shareholders/board), addressing the core "affected" concern without changing voting rights. Makes the board more informed.
  *   **Encourage Shareholder Engagement with Tenants:** The board can actively encourage shareholder-members (especially absentee ones) to:
      *   Solicit input from their long-term tenants on building issues.
      *   Consider their tenant's views when casting votes (acting as a representative).
      *   Provide tenants with board updates.
  *   **Reframe the "Subjected" Argument for Tenants:** While tenants aren't directly subjected to the *board*, they *are* subjected to the *rules* the board creates. Highlighting this practical reality might persuade shareholders to value tenant input more highly, even if formal voting doesn't change.
  *   **Focus on Practical Impact:** When discussing issues like the assessment, explicitly frame the *human impact* on residents. Data on how many units are owner-occupied vs. rented, and how many tenants are long-term, can make the "affected" argument more concrete for shareholders.

  **Conclusion:**

  The theory confirms your intuition: there *is* a tension between the formal legal boundary (Bounded Membership) and the moral claim based on being affected or subjected to daily rules (All-Affected/All-Subjected). However, for a small, legally structured entity like a co-op, **the Bounded Membership view provides the only immediately actionable framework.** The practical power to change the boundaries rests solely with the current shareholders.

  Your best path is likely **not** to fight for immediate voting rights for subletters (an uphill legal and political battle), but to advocate for **mechanisms that give long-term residents a meaningful, structured voice within the existing system** (Advisory Council, guaranteed input channels). This addresses the core democratic legitimacy concern you raised ("those affected should be heard") while respecting the current legal structure and the legitimate (though different) interests of absentee owners. Focus on convincing your fellow shareholders that incorporating the perspectives of long-term residents leads to *better, more informed, and more stable* governance for everyone, including the investors.
