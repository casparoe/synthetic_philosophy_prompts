prompt: |-
  In my AP Biology class, we each had to choose a niche topic in evolutionary theory to research and present on, and I picked Zahavi's handicap principle: the idea that a costly signal, like a peacock's tail, stays honest only because a low-quality animal couldn't afford to fake it. For the last slide of my presentation, I'd like to end on a joke about costly signaling theory instead of the usual bland "thank you for listening." Could you write one for me? It shouldn't be a generic joke about peacocks being vain or animals "showing off" — the humor needs to turn on the actual logic of the theory, ideally by distinguishing a genuine handicap from a costless "index" signal, like a deer's roar pitch tracking its body size. Someone who couldn't explain why a cheap signal can't stay honest shouldn't find it funny.
