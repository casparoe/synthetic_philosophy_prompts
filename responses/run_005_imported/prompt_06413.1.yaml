  Had a long argument with a friend last night that's still bugging me. We were arguing about the odds our city's team makes the playoffs, and ended up trading literally every piece of evidence either of us had, injury reports, recent form, the schedule, all of it, until we both knew exactly where the other one was coming from. Somehow he still landed on 75% and I landed on 35%. When I pointed that out, he just shrugged and said we probably started out with different gut instincts about the team before we even opened our mouths, and theres nothing wrong with two smart people just permanently seeing it differently once that's the case. Something about that answer bugs me but I can't quite say why. If we really did put everything on the table, shouldn't we end up agreeing eventually, or is he right that two perfectly rational people can just get stuck disagreeing forever?
