prompt: |-
  I'm taking a Just War Theory seminar this semester, and this week we read Anscombe's old pamphlet "Mr. Truman's Degree" back to back with the supreme emergency chapters from Walzer's Just and Unjust Wars, and I've been chewing on how the two actually relate ever since our discussion section got kind of heated about it. Anscombe's take is basically absolutist: Truman is a flat-out murderer for Hiroshima and Nagasaki because intentionally killing innocents is never permissible no matter the payoff, period - which is basically the same instinct behind her coining "consequentialism" as a term of abuse a couple years later. Walzer seems to want to keep most of that same rule (don't target civilians) but he carves out a "supreme emergency" exception for cases where a whole political communitys survival is genuinely on the line, like Britain in 1940, and then argues, if I'm getting this right, that Hiroshima doesn't actually clear that bar since Japan was already beaten by August '45 - so he ends up condemning Truman too, just by a totally different road than Anscombe does.

  For my response paper I don't just want to summarize both positions side by side, I want to actually stack them up against each other. Can you compare the structure of Anscombe's absolutism with Walzer's supreme-emergency framework - like what's actually doing the moral work in each one - and then settle something a couple people in my section were arguing about: is the supreme emergency exception a genuinely different, principled kind of reasoning from the consequentialism Anscombe was attacking, or does it secretly collapse into exactly that the moment you let necessity override the rule even once? End with your own verdict on which of the two gives the more defensible account of what, if anything, made Hiroshima wrong.
reasoning: |-
  Okay, let me unpack this student's request. They're grappling with Anscombe and Walzer on Hiroshima, and need to go beyond summary to analyze how these frameworks relate. The core tension is between Anscombe's absolute prohibition and Walzer's emergency exception - and whether that exception holds up philosophically.

  First, I need to reconstruct both positions accurately. Anscombe operates from a deontological foundation where moral rules (like "never intentionally kill innocents") are inviolable. Her 1956 pamphlet condemns Truman as a murderer because the atomic bombings deliberately targeted noncombatants. This aligns with her later critique of consequentialism - she sees moral corruption in weighing lives against outcomes. 

  Walzer's position is more complex. He affirms the civilian protection principle but argues that existential threats create a "supreme emergency" where political communities may temporarily suspend the rules. His Britain 1940 example shows this: when facing potential annihilation, even terrible acts might be justified. But crucially, he denies this applies to Hiroshima because Japan was already defeated - so the bombing fails both his regular test and his emergency exception test.

  The student's real puzzle is structural: what makes Walzer's exception different from the consequentialism Anscombe rejects? I should examine the moral machinery. Anscombe relies on categorical moral absolutes, while Walzer introduces a two-tiered system with a threshold (existential threat) that triggers different rules. 

  Key differences emerge:
  - Walzer's exception is bounded (only for community survival) and temporary, unlike open-ended utilitarian calculation
  - He maintains the prohibition's normative force by calling emergency violations "dirty hands" moments rather than justified acts
  - But this might still be consequentialist in disguise if "necessity" overrides rules based on outcomes

  For the verdict, I find Walzer's framework more defensible because it acknowledges real-world dilemmas without collapsing into pure utilitarianism. His Japan analysis actually shows the exception's narrowness - proving it's not a backdoor for consequentialism. Anscombe's absolutism, while philosophically pure, becomes impractical when civilizations face extinction.

  The student should stress that Walzer condemns Hiroshima precisely because it didn't meet his strict emergency criteria - demonstrating that his exception isn't consequentialist license. This gives them a strong conclusion for their paper.
answer: |-
  Here's a breakdown comparing Anscombe's absolutism and Walzer's supreme emergency exception, analyzing their moral structures, assessing if Walzer collapses into consequentialism, and concluding with a verdict on Hiroshima:

  **1. Anscombe's Absolutism: The Moral Structure**
  *   **Core Principle:** The absolute, exceptionless prohibition against *intentionally* killing the innocent. This is a deontological constraint derived from natural law or fundamental moral principles about the sanctity of innocent life and the inherent wrong of using a person merely as a means.
  *   **Moral Work Done By:** The *intentional act itself*. The moral wrongness resides in the deliberate choice to kill innocents. Consequences, no matter how catastrophic (like potential defeat or even the destruction of a political community), are *irrelevant* to the moral assessment of *this specific act*. The act is intrinsically evil.
  *   **Role of Consequences:** Utterly excluded from the *justification* of the prohibited act. Considering consequences to override the prohibition *is* the definition of consequentialist corruption for Anscombe. Predicting good outcomes doesn't change the nature of the act; it just reveals a willingness to commit murder for perceived gain.
  *   **View of Truman/Hiroshima:** Truman is unequivocally a murderer. The bombings deliberately targeted noncombatant populations with the intent to kill them to coerce surrender. This act is intrinsically evil, regardless of shortening the war or saving lives overall.

  **2. Walzer's Supreme Emergency Exception: The Moral Structure**
  *   **Core Principle:** The deep moral presumption against targeting civilians/noncombatants, grounded in their rights and the laws of war. This presumption reflects the "war convention" and the moral equality of soldiers.
  *   **Moral Work Done By:** A two-tiered system:
      *   **The Presumption:** The default rule is absolute in its normative force: targeting civilians is always wrong *prima facie*.
      *   **The Threshold Trigger:** Only an imminent, catastrophic, and existential threat to the very survival of a political community (understood as a way of life, not just physical existence) can *potentially* override the presumption.
      *   **The Exception:** Crossing the threshold triggers a different moral calculus. Here, *utilitarian considerations of necessity and survival* become morally relevant and temporarily paramount. The survival of the community represents a value so supreme that it can, with immense moral anguish, justify violating the normal rules.
  *   **Role of Consequences:** Consequentialist reasoning is *deliberately introduced* and given moral weight *only after* a specific, exceptional threshold (supreme emergency) is crossed. It is *not* a general license for consequentialism. Before the threshold, consequences are irrelevant to justifying the prohibited act. *At* the threshold, preventing the catastrophic consequence (annihilation of the community) becomes the overriding moral imperative.
  *   **View of Truman/Hiroshima:** Walzer *condemns* Hiroshima, but *not* because the supreme emergency exception is invalid. He condemns it because **Japan in August 1945 did not constitute a supreme emergency for the US.** Japan was defeated, blockade and bombardment were working, invasion wasn't imminent or certain, and surrender was likely without invasion or atomic bombing. Truman therefore violated the core presumption *without* the justification of having crossed the supreme emergency threshold. Walzer argues Britain in 1940 *did* meet the threshold; Hiroshima did not.

  **3. Does Walzer's Exception Collapse into Consequentialism?**
  *   **The Student Argument:** This is the crux. Anscombe would undoubtedly say **YES**. For her, introducing *any* consequentialist reasoning to justify intentionally killing innocents *is* the essence of the consequentialist corruption she attacks. The moment you say "the consequences were so bad that the rule could be broken," you've adopted the consequentialist logic she abhors. The threshold is arbitrary; necessity always provides the excuse.
  *   **Walzer's Defense (and Why it Might Hold):** Walzer argues **NO**, it's a distinct, principled exception. Here's why:
      1.  **Threshold, Not Calculus:** It's not a continuous utilitarian weighing of costs/benefits. It requires crossing a specific, high threshold *before* consequences become relevant. The core rule stands firm *until* that catastrophic point.
      2.  **Preservation of the Rule's Force:** Calling it an "exception" acknowledges the rule's fundamental validity. The act remains a *violation* (hence "dirty hands"), not magically transformed into a "good" act. Consequentialism often seeks to *justify* the act itself based on outcomes.
      3.  **Motivation by Community Survival, Not Gain:** The justifying consequence isn't marginal advantage or even victory, but the sheer *survival of a political community* as a unique value worth preserving even through terrible means. This is distinct from maximizing overall utility.
      4.  **Burden of Proof & Moral Horror:** The burden of proving the emergency is immense. Walzer emphasizes the "awfulness" and "moral risk" involved. Consequentialism often lacks this inherent sense of violating a deep prohibition.
  *   **The Tension:** While Walzer tries to cordon it off, the exception *does* ultimately rely on a catastrophic-consequence-driven justification for violating a core deontological rule. The threshold *is* vulnerable to subjective interpretation and expansion ("slippery slope"). Anscombe would see this as a fatal concession.

  **4. Verdict: Which Account Offers a More Defensible Explanation of Hiroshima's Wrongness?**

  Both condemn Truman, but their frameworks offer different explanations:

  *   **Anscombe's Strength:** Her absolutism provides **crystalline clarity and moral consistency.** The wrongness of Hiroshima is undeniable and inherent in the act itself: the deliberate mass killing of noncombatants. It avoids the dangerous ambiguity of thresholds and the potential for "necessity" to become a catch-all excuse. It fiercely protects the absolute value of innocent life.
  *   **Anscombe's Weakness:** It struggles profoundly with genuine, catastrophic existential dilemmas (like Britain 1940). Demanding national suicide or submission to evil regimes as the only moral option seems, to many, an intolerable demand that ignores the value of political community and the responsibility of leaders to protect it. It risks moral rigor mortis in the face of true extremity.
  *   **Walzer's Strength:** His framework **acknowledges the horrifying reality of genuine existential threats** and offers a (painful) path for political communities facing annihilation. It provides a more nuanced account of why Britain's potential actions in 1940 feel different, morally, from other bombings. His condemnation of Hiroshima is *strengthened* by his framework: it *wasn't* a supreme emergency, so the bombing was simply a war crime, violating the core prohibition without justification.
  *   **Walzer's Weakness:** The "supreme emergency" concept is **inherently unstable and prone to abuse.** Defining the threshold ("imminent," "catastrophic," "existential," "community") is difficult and subjective. History shows how easily "necessity" is invoked. While Walzer condemns Hiroshima, his exception *could* be misapplied by others to justify it (e.g., arguing invasion casualties *would* have been catastrophic). It flirts dangerously with the consequentialism it seeks to constrain.

  **Conclusion:**

  While Walzer's framework offers a compelling and perhaps necessary account for the darkest corners of human conflict (genuine supreme emergencies), **Anscombe's absolutism provides the more defensible *and consistent* explanation for the specific wrongness of Hiroshima.**

  *   **For Hiroshima:** Walzer *correctly* identifies that the bombing violated the core prohibition *because* Japan's situation didn't meet the supreme emergency threshold. However, Anscombe's explanation is more fundamental: the act of intentionally incinerating civilians *was* the core wrong, regardless of Japan's status. Walzer's condemnation relies on a contingent historical assessment (was Japan *really* defeated enough?), while Anscombe's condemnation is absolute and inherent in the act itself.
  *   **Against Consequentialist Collapse:** Walzer makes a valiant effort to create a principled exception, but Anscombe's critique holds significant force. The moment consequences (even catastrophic, community-ending ones) are allowed to override the absolute prohibition *intentionally*, the door to consequentialist justification is opened, however narrowly. The burden of proof Walzer imposes is crucial but doesn't erase this fundamental shift.
  *   **Defensibility:** Anscombe's position, while demanding, provides the strongest safeguard against the erosion of non-combatant immunity. Hiroshima stands as a stark example of the horrors unleashed when the prohibition is set aside based on calculations of necessity and perceived greater good. Her framework offers the purest, most defensible bulwark against repeating such atrocities, even if it struggles with the theoretical extremes Walzer addresses. Walzer's framework, while attempting to address those extremes, unavoidably weakens that bulwark and, in the case of Hiroshima, relies on a secondary argument (lack of emergency) when the primary wrong (intentional killing of innocents) was already sufficient grounds for condemnation.

  Therefore, for explaining Hiroshima, **Anscombe's absolutism provides the more robust and defensible core account:** the act was intrinsically murderous. Walzer's valuable contribution lies in rigorously arguing why Hiroshima *also* failed to meet his exceptional criteria, reinforcing the condemnation but from a structurally less secure foundation.
