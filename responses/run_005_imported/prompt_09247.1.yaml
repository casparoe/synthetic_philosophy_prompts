  Economically, this is a classic bargaining power scenario. Mia's BATNA (Best Alternative to Negotiated Agreement) improved dramatically with the bakery gig, while the user's remained low. Before, their BATNAs were unbalanced (her solo potential vs his struggle), but now that asymmetry is quantified. 

  The fairness question has two dimensions: 
