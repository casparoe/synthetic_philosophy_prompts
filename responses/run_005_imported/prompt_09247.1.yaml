answer: |-
  This is a brilliant observation - you're hitting on a fundamental economic concept called **"opportunity cost"** and the **"outside option principle."** Your intuition is spot-on, and there's concrete logic behind why 50/50 feels unfair *now* (and arguably was before). Let's break it down:

  ### 1. The Core Problem: Unequal Contributions & Opportunity Cost
  *   **Skill Disparity:** Mia's talent is the primary *value generator* for your business. Her baking/decorating skills are what customers pay for. Your contribution (while valuable for logistics, sales, admin, etc.) doesn't command the same market price.
  *   **The "Going Solo" Option (BATNA):** Everyone has a "Best Alternative To a Negotiated Agreement" (BATNA). Before the bakery offer:
      *   **Mia's BATNA:** Go solo, charge premium prices, keep 100%.
      *   **Your BATNA:** Struggle to sell, earn very little (or nothing).
  *   **Opportunity Cost:** This is the value of the next best option Mia gives up by working with you. Before the bakery offer, her opportunity cost was the *potential* income from going solo. **Now, with the bakery gig, her opportunity cost is a *real, quantifiable, higher income* she could be earning instead of working with you.**

  ### 2. Why 50/50 Was *Always* Skewed (Even Before the Bakery)
  *   **Mia was Subsidizing You:** By splitting 50/50, Mia was effectively accepting less than her market value. The partnership allowed her to produce more volume than solo (maybe due to your help), but *each hour she spent with you* was worth less than what her skills could command alone. You benefited significantly from this subsidy.
  *   **Your Contribution ≠ Equal Value:** While your work hours might match Mia's, the *market value* of those hours is vastly different. An hour of world-class decorating is worth much more than an hour of packaging, admin, or even competent-but-not-exceptional decorating/sales.
  *   **Fairness vs. Equality:** 50/50 is *equal*, but it wasn't *fair* in terms of the underlying value created. Fairness should reflect contribution to the *value generated*, not just time spent.

  ### 3. Why the Bakery Offer Changes Everything (Logically & Practically)
  *   **Quantified Opportunity Cost:** The bakery offer puts a **dollar value on Mia's time**. It sets her *minimum market rate*. If she can earn $X/hour at the bakery, then every hour she spends working with you *costs her* ($X - [Her 50% Share of Partnership Profit Per Hour]).
  *   **Her Partnership "Price" Just Went Up:** For Mia to rationally choose working with you over the bakery gig, the partnership must now offer her *at least* what the bakery does, *after* accounting for any extra effort (e.g., managing the partnership) and the value *she* places on working with a friend. **If 50/50 doesn't meet or exceed her bakery rate, she's losing money by being in the partnership.**
  *   **No Change for You (But Big Change Overall):** Your BATNA didn't improve. Your alternative is still low earnings. This *widens* the gap between what each of you brings to the table in terms of market power and alternatives.

  ### Does She Deserve a Bigger Cut Now? (The Logical Answer)
  **Yes, absolutely.** The bakery offer objectively demonstrates that her skills are worth significantly more in the open market than they are currently being compensated within your 50/50 split. To make the partnership sustainable and *fair* for Mia, her share needs to increase to reflect her higher opportunity cost.

  ### What This Means & How to Approach It (Constructively)
  1.  **Acknowledge the Reality (To Yourself & Mia):** Recognize Mia's talent is the engine, and her market value just got validated. Suppressing this will breed resentment.
  2.  **Reframe "Deserve":** It's not about Mia *deserving* more because she's "better," but about the *partnership* needing to compensate her fairly relative to her other options to keep her engaged. It's economic necessity.
  3.  **Have an Open Conversation (Focus on Value & Partnership):**
      *   "Mia, the bakery offer is amazing and a real testament to your talent! It's also made me think more carefully about our partnership. I realize that splitting 50/50 might not be fairly compensating you for the incredible value your skills bring, especially now that you have such a clear, high-paying alternative. I want our partnership to be genuinely fair and sustainable for both of us."
  4.  **Propose Solutions (Based on Value, Not Just Time):**
      *   **Value-Based Split (Recommended):** Calculate the *revenue* directly attributable to Mia's unique skills (premium pricing her work commands). Agree she gets a significantly larger share of *that* portion (e.g., 70-80%). Split the remaining revenue (from base products, your contributions) more evenly (e.g., 50/50 or 60/40).
      *   **Hourly Wage + Profit Share:** Pay Mia an hourly rate closer to her bakery rate for her *decorating/baking* hours. Split the *remaining profit* after costs (including her wage) 50/50 or 60/40. This directly addresses her opportunity cost.
      *   **Increased Mia Share:** Simply move to a split like 60/40 or 70/30 in Mia's favor, acknowledging her core contribution and new BATNA. This is simpler but less precise.
      *   **Re-evaluate Roles:** Could you take on *more* of the non-skill tasks (procurement, delivery, accounting, marketing, cleaning) to free up Mia's time for high-value decorating, justifying the 50/50 split *if* the total output increases enough? (This might not bridge the gap fully).

  ### Key Takeaway
  The bakery offer didn't *create* the imbalance; it **revealed and quantified** an imbalance that always existed. Mia's talent was always the primary asset, and her opportunity cost is now concrete and higher. A 50/50 split now likely means Mia is actively losing money by choosing the partnership over the bakery. For the partnership to continue and be fair, her share needs to increase significantly to reflect her true market value and opportunity cost. Addressing this honestly is crucial for the health of your friendship and your business. Good luck! It's a tough conversation, but grounded in solid logic.
