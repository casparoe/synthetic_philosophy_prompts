prompt: |-
  so me and my friend Mia run a little side hustle making decorated cookies for birthdays and grad parties, and we've always split whatever we make 50/50 since we put in about the same hours. thing is, she's way more talented at the baking/decorating part, so if she went solo she could charge a ton and keep it all, while if i went solo i'd honestly struggle to sell anything. i've always felt kinda weird about the 50/50 split but couldnt explain why. now its more confusing bc a bakery just offered her a paid weekend gig doing custom orders, so her "going solo" option basically got even better, but nothing changed about our actual business together. does that mean she deserves a bigger cut of OUR earnings now, and honestly was 50/50 even fair before that happened? feels like theres some actual logic here i'm missing, not just vibes.
