  - **Part (c) (5/5):** Impeccable. Hypocrisy requires *applying a standard to others while exempting oneself*. The columnist example perfectly shows *inconsistent application without self-exemption* (she judges others by the same standard but applies it unevenly). The logical relationship (hypocrisy ⊂ inconsistency) is precise.  

