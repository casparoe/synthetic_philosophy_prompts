  **Justification Details:**  
  - **Part (a) (5/5):** Flawless execution. Captures Wallace's core distinction: standing relates to the *blamer's position* (e.g., the burglar's compromised authority), warrant relates to the *act's moral status* (e.g., mugging's wrongness). The "not a rebuttal" point correctly inoculates against *tu quoque*.  
  - **Part (b) (7/10):**  
