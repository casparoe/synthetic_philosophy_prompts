answer: |-
  You've nailed the core intuition both theories share—**stakes *do* influence whether we attribute "knowledge"** (like in the Hannah bank cases). But epistemic contextualism and pragmatic encroachment are **fundamentally different explanations** for *why* this happens. It's not just branding; it's a deep philosophical disagreement about *where* the stakes effect occurs.

  Here's the breakdown:

  1.  **Epistemic Contextualism (DeRose, Lewis, Cohen):**
      *   **The Claim:** The *meaning* of the word "knows" (and related epistemic terms) **shifts depending on the conversational context.** High-stakes situations raise the *standards* for what counts as "knowing" in that context.
      *   **Analogy:** Think of "tall." A "tall" 10-year-old isn't a "tall" NBA player. The *meaning* of "tall" changes based on context. Similarly, in a low-stakes context, "knows" might mean "has good enough evidence for practical purposes here." In a high-stakes context, "knows" might mean "has absolutely incontrovertible evidence."
      *   **What's Fixed:** What constitutes *true, justified belief* (the traditional components of knowledge) *doesn't change* with stakes. Hannah has the *same evidence* (past experience, bank hours) in both cases.
      *   **What Changes:** The *semantic threshold* her evidence must meet to count as "knowing" *in that conversation*. In high stakes, the context demands near-certainty, which her evidence doesn't meet. In low stakes, the context accepts reasonably strong evidence, which she has.
      *   **Metaphysics:** Knowledge itself (as a state of mind/world relation) isn't affected by stakes; only the *word* we use to describe it is context-sensitive. They are often **semantic minimalists** about "knows."

  2.  **Pragmatic Encroachment (Fantl & McGrath, Stanley, Hawthorne - sometimes):**
      *   **The Claim:** Practical stakes (what's riding on being right) can **directly affect whether a subject *genuinely knows*** something. High stakes can *genuinely undermine* knowledge that exists in low-stakes situations, even with identical evidence.
      *   **Analogy:** Think of a high jump bar. The bar's *height* (the epistemic standard for justification/knowledge) **itself changes** based on practical factors. Jumping 6 feet gets you over the low bar (knowledge in low stakes) but not over the suddenly higher bar (knowledge fails in high stakes).
      *   **What Changes:** What counts as *sufficient justification* for knowledge. High stakes can **raise the level of justification required** for a true belief to count as knowledge. Hannah's evidence *is sufficient* for knowledge when nothing much is at stake, but that *same evidence becomes insufficient* when the cost of being wrong is high. Knowledge itself is not "context-sensitive"; rather, **whether her belief meets the justification condition depends partly on practical factors**.
      *   **Metaphysics:** Knowledge itself (or at least the justification component) is *impure* – practical factors genuinely become part of *what it takes to know*. They are typically **invariantists** about the meaning of "knows" – it means the same thing everywhere, but what it *takes to satisfy* that meaning changes with practical context.

  **Key Differences Summarized:**

  | **Feature** | **Epistemic Contextualism** | **Pragmatic Encroachment** |
  |-------------|------------------------------|-----------------------------|
  | **Core Claim** | Meaning of "knows" shifts with context | Knowledge justification depends on practical factors |
  | **What Changes** | Semantic standards for applying "knows" | Epistemic justification bar itself |
  | **Knowledge State** | Unchanged by context; only description varies | Genuinely gained or lost based on stakes |
  | **Meaning of "Knows"** | Context-sensitive (semantic minimalism) | Fixed meaning (invariantism) |
  | **Metaphysical Commitment** | Purely linguistic/semantic shift | Stakes affect knowledge constitution |
  | **Analogy** | "Tall" meaning changes with context | High jump bar height changes with importance |

  **Why the Distinction Matters (Beyond Jargon):**

  1.  **Where the Action Is:** Contextualism locates the stakes effect in *language use*. Encroachment locates it in the *nature of knowledge/justification* itself. This is a fundamental metaphysical disagreement.
  2.  **Truth vs. Attribution:** Contextualism typically preserves the idea that whether Hannah *really knows* (in some absolute sense) is fixed; we just can't *correctly say* she knows in high-stakes contexts. Encroachment says she *genuinely doesn't know* in high stakes, even if she did before.
  3.  **Scope:** Encroachment often makes stronger claims about how deeply practical interests infect core epistemology, potentially challenging the traditional "purely intellectual" view of justification. Contextualism tries to preserve that purity by offloading the variation to semantics.
  4.  **Theoretical Implications:** Each theory faces distinct challenges. Contextualism struggles with explaining *why* contexts shift standards and how "knows" behaves differently from other context-sensitive terms. Encroachment struggles with explaining how practical factors *directly* affect epistemic justification without collapsing into subjectivism.

  **Conclusion:**

  You're absolutely right that **both theories arise from the same intuitive observation** exemplified by the bank cases: stakes *seem* to matter for knowledge attributions. However, they offer **radically different explanations** for *why* this happens. Contextualism says it's about the *word* "knows." Pragmatic Encroachment says it's about *knowledge itself* (or its justification condition). It's a substantive philosophical dispute, not just rebranding.

  Philosophers emphasizing the difference aren't (always) just being pedantic; they're pointing to a deep fork in the road about the relationship between language, knowledge, and practical life. Your piece will be stronger if you acknowledge this genuine tension underlying the shared starting point.
