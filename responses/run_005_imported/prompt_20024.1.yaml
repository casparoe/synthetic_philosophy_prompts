  First, I need to recall the standard coherence argument. The money-pump shows that cyclic preferences lead to exploitation through repeated trades. The user mentions Marco's conclusion that any competent AI must have acyclic preferences, implying it becomes an EU maximizer. But the user suspects this might not be the whole story. 

