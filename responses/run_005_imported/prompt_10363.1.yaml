prompt: |-
  I'm recording a podcast episode on classical Chinese logic, and next week's guest defends Chad Hansen's "mass-noun hypothesis" reading of Gongsun Long's white horse dialogue: the claim that "a white horse is not a horse" works because classical Chinese common nouns name mereological wholes rather than classes of individuals, so "white horse" picks out a proper part of the "horse" whole, not a subclass of it. Draft eight to ten interview questions that go beyond having her restate the thesis. I want at least one question on how this fares against the rival reading on which "fei" — the dialogue's "is not" — negates identity between kind-terms rather than class membership, one on how she'd handle the Mohist "Xiaoqu" chapter's compound-name puzzles, where riding a white horse simply counts as riding a horse, and one on whether the linguistic premise survives Harbsmeier's objections that classifiers and plural marking undercut the claim that classical Chinese nouns are uniformly mass-like. For each, add a follow-up keyed to the answer she's most likely to give.
