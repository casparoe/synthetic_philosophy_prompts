  Hmm, the user's frustration with academic neatness is valid. I should emphasize where CJT fails before discussing mitigations. The deliberation hierarchy is particularly problematic—if two judges always defer to the head judge, adding them is pointless. It's functionally identical to one judge. Also, if inexperienced judges have p<0.5, they actively harm accuracy. 

  But dismissing CJT entirely feels unhelpful. Maybe I can pivot to nuanced takeaways: (1) adding judges only helps if they're genuinely independent and competent, (2) diversity matters more than quantity, (3) deliberation structure can make or break outcomes. The user's "out rounds" with 5 judges might backfire if new additions are weak or influenced. 

