prompt: |-
  I'm a backend engineer at a small fertility-tech startup -- we built the pipeline that takes genetic data from IVF embryos and ranks them by predicted lifetime risk of stuff like heart disease, type 2 diabetes, a few cancers, so the clinic and the parents can decide which one to transfer. That product's been live for over a year now and nobody really blinks at it anymore. What's actually on the table for Thursday's ethics review (I got roped onto this committee because I wrote a chunk of the scoring pipeline, and apparently that makes me "technical enough" to have opinions on the ethics too) is a proposed new tier that adds a composite risk score for psychiatric conditions -- depression, schizophrenia, ADHD -- computed the same way as the disease scores.

  About half the committee wants to just wave it through, same idea as the existing product, parents can do what they want with the extra info. The other half is stuck on two things. First, the obvious one: ranking embryos by predicted risk of depression or schizophrenia sure sounds like it's making a judgment about people who already live with those conditions, and our one actual disability-rights person on the committee is not happy about it. Second, a weirder objection our genetic counselor keeps raising: legal wants us to keep marketing all of this, old tier and new, as "giving your future child the healthiest possible start," but she points out that framing doesn't really hold up once you think about it, since whichever embryo actually gets transferred just is the resulting kid, and that kid was never "at risk" for whatever the embryos that didn't get picked might've developed -- those would've been different kids, not this one. Somebody linked a philosophy article calling this "the nonidentity problem," which I guess is an actual established thing and not just her being clever, but I don't have the background to know how much weight that should carry, or whether it's the kind of thing that should change what we ship versus just being a fun fact that doesn't move the needle.

  Could you write the actual memo I'm suppose to bring to Thursday's meeting? I need a real recommendation -- ship the psychiatric tier, kill it, or ship it with specific conditions -- not a list of considerations with no bottom line, and if it's "conditions" I want actual next steps and a rough timeline attached, not "we should study this more." Whichever way it comes out, it needs to seriously engage both the disability-rights objection and the identity weirdness instead of just falling back on the "we're helping your future child" language, because that's the exact phrase under fire and half the committee will call it out immediately if the memo leans on it.
reasoning: |-
  Okay, let's tackle this memo for the backend engineer. The user is part of an ethics committee deciding whether to add psychiatric conditions to their embryo ranking system. The key issues are the disability-rights concerns and the nonidentity problem. 

  First, I need to understand the user's position. They're a technical person thrust into an ethics debate, needing a concrete recommendation. They can't just list pros and cons—they need a decisive action plan. The memo must address both objections head-on, especially since the current marketing language is under scrutiny.

  The disability-rights angle is sensitive. Ranking embryos based on psychiatric conditions implies those lives are less valuable, which could stigmatize existing individuals with those conditions. The nonidentity problem complicates the "healthiest start" framing—selecting an embryo means creating that specific child, not avoiding risk for a pre-existing one. 

  I consider recommending approval with conditions. A full stop might ignore practical realities, but greenlighting without changes would be ethically reckless. Key conditions should include: reworking marketing language to avoid implying prevention, adding context about neurodiversity in reports, and consulting disability communities. 

  For the nonidentity issue, the memo should explicitly reject the "future child" framing. Instead, position the product as selecting which potential child to bring into existence. That's more philosophically honest. 

  The timeline needs to be tight but realistic—30-45 days for language overhaul and stakeholder consultations. Legal will push back on marketing changes, so the memo must preempt that by emphasizing ethical necessity over convenience. 

  The backend engineer likely wants to appear competent to non-technical committee members. The recommendation should give them firm footing to push back on both the "just ship it" and "overthink it" factions. Practical steps with deadlines show decisive leadership.
answer: |-
  **MEMORANDUM**  
  **TO:** Ethics Review Committee  
  **FROM:** [Your Name], Backend Engineering  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Psychiatric Risk Tier Implementation  

  ### 1. **RECOMMENDATION**  
  **Do not ship the psychiatric risk tier in its current form.** Instead, **conditionally approve development** contingent on the following actions:  
  - **Revise marketing language** to eliminate "healthiest start" framing (addresses nonidentity problem).  
  - **Integrate clinical & ethical context** directly into psychiatric reports (addresses disability-rights concerns).  
  - **Complete stakeholder consultations** with disability advocates and neurodiversity experts.  
  **Timeline:** 30 days for revisions + 15 days for committee re-review. Target launch: Q1 2024.  

  ---

  ### 2. **RATIONALE: ADDRESSING KEY OBJECTIONS**  
  #### **A. Disability-Rights Concerns**  
  * **Issue:** Ranking embryos by psychiatric risk inherently signals that lives with these conditions are less desirable. This devalues existing individuals and risks eugenic normalization.  
  * **Mitigation Plan:**  
    - **Contextualize risk scores:** Reports must include:  
      > *"These predictions reflect probabilistic associations, not deterministic outcomes. Conditions like ADHD or schizophrenia involve complex gene-environment interactions and do not define quality of life. Many individuals lead fulfilling lives with appropriate support."*  
    - **Collaborate with advocacy groups:** Partner with orgs (e.g., NAMI, Autistic Self-Advocacy Network) to review language and ensure it avoids harmful stereotyping.  
    - **Tiered disclosure:** Only release psychiatric scores to clinics *after* parents complete a counseling module on neurodiversity and disability ethics.  

  #### **B. The Nonidentity Problem**  
  * **Issue:** Marketing claims of "giving your future child the healthiest start" are philosophically incoherent. The selected embryo *becomes* the child; alternatives represent different potential children, not avoided risks for the same child.  
  * **Mitigation Plan:**  
    - **Replace misleading framing:** Adopt accurate language:  
      > *"This information helps prospective parents select which embryo to transfer based on preferences for potential health outcomes."*  
    - **Update all marketing materials:** Remove "future child" implications across *all* product tiers (not just psychiatric). Legal must revise collateral by Day 30.  
    - **Train clinicians:** Genetic counselors must explain nonidentity during consent (e.g., *"Selecting Embryo A over B means bringing a different potential child into existence"*).  

  ---

  ### 3. **CONDITIONAL APPROVAL TIMELINE**  
  | **Phase** | **Actions** | **Owner** | **Deadline** |  
  |-----------|------------|-----------|-------------|  
  | 1. Language & Framework Revamp | • Redraft marketing/UI copy<br>• Develop clinician training module | Marketing + Legal | 30 days |  
  | 2. Stakeholder Engagement | • Consult 3+ disability/neurodiversity groups<br>• Integrate feedback into reports | Ethics Committee Chair | 45 days |  
  | 3. Committee Re-Review | • Final approval of language/structure<br>• Audit implementation plan | Full Committee | Day 45 |  
  | 4. Launch | • Deploy psychiatric tier<br>• Mandatory clinician training | Product Team | Day 60 |  

  **Failure Condition:** If stakeholder feedback reveals irreducible harm (e.g., advocacy groups uniformly condemn scoring), the feature will be scrapped.  

  ---

  ### 4. WHY NOT KILL OR FAST-TRACK?  
  - **Fast-tracking ignores material harm:** Disability stigma and misleading framing are operational risks (reputational, legal).  
  - **Killing it wastes opportunity:** Psychiatric conditions are materially different (e.g., T2D vs. schizophrenia). With safeguards, data could empower *informed* choice (e.g., parents with family histories).  
  - **Half-measures fail:** Shipping with "minor tweaks" leaves both objections unaddressed, inviting external scrutiny.  

  --- 

  ### 5. URGENT NEXT STEPS  
  - **Vote Thursday** on conditional approval to unlock stakeholder budget.  
  - **Assign working group** (Marketing Lead, Genetic Counselor, Disability Advocate, Engineer) to execute revisions.  

  **Bottom Line:** We can ethically offer this tier only if we abandon misleading narratives and actively confront disability bias. The technical pipeline is ready—but the ethical pipeline requires 60 days of work.  

  // End memo //  

  ---

  **Key Strengths of This Approach:**  
  - **Concrete:** Hard deadlines, ownership, and deliverables.  
  - **Preempts Committee Objections:** Directly disarms "healthiest start" language and disability concerns.  
  - **Leverages Your Role:** Uses technical credibility to insist on integrity in data presentation.  
  - **Philosophy Made Practical:** Converts "nonidentity problem" into a marketing/counseling fix.  

  Bring this to the meeting and push hard—it’s the only path that doesn’t cave to pressure or ignore ethics.
