  Finally, we note what the exchange is missing: 
  The discussion does not address the possibility that the human's ability to see the consistency of F might itself be based on an algorithmic (but non-formalizable) process. Moreover, it doesn't consider the second incompleteness theorem (which says F cannot prove its own consistency) and how the human might come to know Con(F) without falling into an infinite regress. Also, the issue of whether human reasoning is consistent (and how we would know) remains. Furthermore, the exchange doesn't touch on the possibility that the human mind might be equivalent to a Turing machine that is not fixed but evolving, or that the mind might use non-algorithmic processes (if any exist) but without being captured by a single formal system. The role of unsoundness (if the system is inconsistent but we don't know) is also underdeveloped.

