prompt: |-
  For a problem set in my graduate philosophy seminar on rational choice theory, I would like an example that pushes students beyond the textbook presentation of iterated elimination of dominated strategies, which typically considers domination by pure strategies alone. Please construct a normal-form game in which one player has a pure strategy that is not strictly dominated by any single one of that player's other pure strategies, yet is strictly dominated by some mixed strategy over those other strategies. (You need only specify the payoffs of the player whose strategy is being eliminated.) Explain precisely why the mixed strategy succeeds where no pure strategy alone does, and what this implies about the difference between iterated elimination restricted to pure-strategy dominance and the standard procedure, which also allows domination by mixed strategies.
reasoning: |-
  We are to construct a normal-form game for one player (say player 1) such that:
   - There is a pure strategy (say A) that is not strictly dominated by any other single pure strategy (say B, C, ...).
   - But A is strictly dominated by some mixed strategy over the other pure strategies.

   We only need to specify the payoffs for the player whose strategy is being eliminated (player 1).

   Let us design a game for player 1 with three pure strategies: A, B, C.

   We need:
   1. A is not strictly dominated by B alone: so there must be some action of the opponent (say for a particular column) where A yields a higher payoff than B.
   2. Similarly, A is not strictly dominated by C alone: so there must be some column where A beats C.
   3. But A is strictly dominated by a mixed strategy over B and C. That is, there exists a mixture (say with probability p for B and 1-p for C) that yields a strictly higher payoff than A in every column.

   We can set up the opponent (player 2) to have two actions: Left (L) and Right (R).

   We assign payoffs for player 1 as follows:

          |   L   |   R
     -----|-------|-------
       A  |   1   |   4
       B  |   2   |   0
       C  |   0   |   3

   Now, let's check:

   - In column L: 
        A gets 1, B gets 2, C gets 0.
        So A is beaten by B in L (1 < 2), but note that in R, A (4) beats B (0). Therefore, B does not dominate A (because in R, A is better).

   - Similarly, in column L: A (1) beats C (0). In column R: A (4) beats C (3). Wait, that would imply that A is actually better than C in both? But we want A to be dominated by a mixed strategy. So let me adjust.

   We see that in R, A (4) is higher than both B (0) and C (3). So we must adjust the payoff in R for A to be lower than what a mixture of B and C can achieve.

   Let me change:

          |   L   |   R
     -----|-------|-------
       A  |   1   |   1
       B  |   2   |   0
       C  |   0   |   3

   Now:
   - In L: A=1, B=2, C=0 -> A is beaten by B in L.
   - In R: A=1, B=0, C=3 -> A is beaten by C in R.

   Therefore, no pure strategy (B or C) dominates A because:
     - B: in R, A (1) > B (0) -> so B does not dominate A.
     - C: in L, A (1) > C (0) -> so C does not dominate A.

   Now, can we find a mixed strategy of B and C that dominates A?

   Let the mixed strategy be: play B with probability p and C with probability (1-p).

   The expected payoff in L: 2p + 0*(1-p) = 2p.
   The expected payoff in R: 0*p + 3*(1-p) = 3(1-p).

   We require that this mixed strategy strictly dominates A in both L and R.

   So we require:
     For L: 2p > 1   => p > 1/2.
     For R: 3(1-p) > 1 => 1-p > 1/3 => p < 2/3.

   Therefore, any p in (1/2, 2/3) will work.

   Example: p = 0.6 (so 0.6 for B, 0.4 for C).
     In L: 2*0.6 = 1.2 > 1.
     In R: 3*0.4 = 1.2 > 1.

   Thus, the mixed strategy (0.6, 0.4) over (B, C) strictly dominates A.

   Explanation:
     The mixed strategy succeeds because it can take advantage of the strengths of both B and C in different states (i.e., against different actions of the opponent). Specifically, B is strong in L and C is strong in R. By mixing, we can get a payoff that is above A in both states.

   Implication for iterated elimination:
     - If we only allow elimination by pure strategies, then A would not be eliminated in the first round because no single pure strategy dominates it. Thus, the process might stop too early and leave strategies that are in fact dominated by mixed strategies.
     - The standard procedure that allows mixed strategies would eliminate A in the first round. This can lead to further eliminations that might not occur in the pure-strategy-only version.

     The consequence is that the set of strategies surviving iterated elimination of strictly dominated strategies when mixed strategies are allowed is a subset of (and often strictly smaller than) the set when only pure strategies are considered. This can lead to different predictions about the outcome of the game.

     In particular, the standard procedure (with mixed strategies) is more powerful in reducing the game and can lead to a unique prediction in some cases where the pure-strategy version does not.

     Therefore, for a more refined solution concept (like rationalizability or Nash equilibrium in mixed strategies), we must consider mixed strategy dominance.

   Let me write the game in normal form for clarity (only player 1's payoffs are given):

                  Player 2
                L        R
        Player1
          A     1        1
          B     2        0
          C     0        3

   We have shown that A is strictly dominated by the mixed strategy (0.6, 0.4) over B and C.

   So the example is constructed.
answer: |-
  Below is a normal-form game designed for the scenario. The payoffs are specified only for Player 1 (the player whose strategy is being eliminated), as Player 2's payoffs are irrelevant for this dominance check. Player 1 has three pure strategies: **A**, **B**, and **C**. Player 2 has two pure strategies: **L** and **R**.

  ### Payoff Matrix for Player 1:
  | Player 1 \ Player 2 | **L** | **R** |
  |----------------------|-------|-------|
  | **A**                | 1     | 1     |
  | **B**                | 2     | 0     |
  | **C**                | 0     | 3     |

  ---

  ### Analysis:
  #### 1. **No pure strategy dominates A:**
  - **B vs. A:**  
    - In **L**: B (2) > A (1) → B beats A.  
    - In **R**: B (0) < A (1) → A beats B.  
    → **B does not dominate A** (A performs better against R).
  - **C vs. A:**  
    - In **L**: C (0) < A (1) → A beats C.  
    - In **R**: C (3) > A (1) → C beats A.  
    → **C does not dominate A** (A performs better against L).  

  Thus, no pure strategy (**B** or **C**) strictly dominates **A**.

  #### 2. **A mixed strategy dominates A:**
  Consider a mixed strategy **σ** over **B** and **C**, playing **B** with probability **p** and **C** with probability **1-p**.  
  - **Expected payoff against L**: \(2p + 0(1-p) = 2p\)  
  - **Expected payoff against R**: \(0p + 3(1-p) = 3(1-p)\)  

  To strictly dominate **A**, **σ** must yield >1 against both **L** and **R**:  
  - Against **L**: \(2p > 1\) → \(p > \frac{1}{2}\)  
  - Against **R**: \(3(1-p) > 1\) → \(1-p > \frac{1}{3}\) → \(p < \frac{2}{3}\)  

  For \(p \in \left(\frac{1}{2}, \frac{2}{3}\right)\) (e.g., \(p = 0.6\)):  
  - Against **L**: \(2 \times 0.6 = 1.2 > 1\)  
  - Against **R**: \(3 \times (1 - 0.6) = 1.2 > 1\)  

  Thus, **σ = (0.6 B, 0.4 C)** strictly dominates **A**.  

  ---

  ### Why the Mixed Strategy Succeeds:
  - **B** excels against **L** but fails against **R**.  
  - **C** excels against **R** but fails against **L**.  
  The mixed strategy **σ** leverages the complementary strengths of **B** and **C**: it uses **B** to cover **L** and **C** to cover **R**. This "hedging" ensures a payoff >1 in **both** scenarios, which no pure strategy can achieve alone.  

  ---

  ### Implications for Iterated Elimination:
  1. **Pure-strategy-only elimination:**  
     - **A** is not eliminated (since no pure strategy dominates it).  
     - The process halts prematurely, leaving **A** in the game.  
     - Surviving strategies: {A, B, C}.  

  2. **Standard procedure (allowing mixed strategies):**  
     - **A** is eliminated (dominated by **σ**).  
     - The game reduces to **B** and **C**, enabling further analysis (e.g., checking dominance between B and C).  
     - Surviving strategies: {B, C}.  

  **Key Difference:**  
  - Restricting elimination to pure-strategy dominance **underestimates** rationality. Rational players can use mixed strategies to "hedge" against uncertainty, leading to more eliminations.  
  - The standard procedure (mixed-strategy dominance) yields a **smaller set** of rationalizable strategies, often providing sharper predictions. Ignoring mixed strategies risks retaining outcomes that no rational player would choose.  

  This example illustrates why rational choice theory must account for mixed strategies to fully capture strategic sophistication.
