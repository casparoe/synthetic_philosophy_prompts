  Breaking down Hume's possible responses: He could double down on the regularity view, emphasizing that dispositions are just constant conjunctions under ideal conditions. For finks and masks, he might argue that these are complex regularities involving the fink/mask setup. The challenge is preserving the simplicity of his original account. Alternatively, he could appeal to ideal conditions, but that might introduce hidden powers, which he rejects.

