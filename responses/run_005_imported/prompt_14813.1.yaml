  ---

  ### **(a) Why feathers are a problem for naive etiological accounts (10 points)**  
  **Her Answer (excerpt):**  
  > *"The etiological view is the opposite: a trait's function is the effect its ancestors were selected for [...] This is what makes feathers awkward [...] the simple etiological story seems stuck saying that keeping a bird warm is the function of a robin’s feathers today, and flight is just a lucky side effect [...] which feels wrong."*  

  **Grading (7/10):**  
  - ✅ **Correct Identification of Conflict (4/4):** She accurately states that naive etiology would assign *only* the original selective effect (insulation) as the function, excluding flight.  
  - ✅ **Problem Articulation (2/2):** Correctly notes the counterintuitive result ("feels wrong").  
  - ❌ **Missing Key Terminology (1/4):** Fails to name the core problem: **"the problem of novel functions"** or **"exaptation"** (a trait co-opted for a new function). This is a standard concept in philosophy of biology, and omitting it loses points.  
  - ❌ **Overstatement (0/-1):** Saying flight has "no functional status at all" oversimplifies. Etiologists could argue flight is *currently* functional but not the *selected effect* (a nuance she misses).  

  **Feedback:**  
  > *"You correctly identify the tension but miss the formal name of the problem (exaptation) and slightly misrepresent the etiological stance. Etiology doesn’t deny that flight is functional; it denies it’s the *selected function*. Precision matters."*  

  ---

  ### **(b) How etiological defenders patch the account (10 points)**  
  **Her Answer (excerpt):**  
  > *"Neander’s patch is to relativize selection to a more recent stretch of the trait’s history [...] flight counts as a function too, right alongside insulation [...] stops privileging the very first selective episode."*  

  **Grading (10/10):**  
  - ✅ **Perfect Explanation (5/5):** Correctly identifies Karen Neander’s solution: **relativizing functions to recent selection history**.  
  - ✅ **Key Insight (3/3):** Notes that functions can be *plural* (insulation + flight) and that newer selective episodes matter.  
  - ✅ **Contrast with Naive View (2/2):** Explicitly states that the fix avoids privileging the *original* function.  

  **Feedback:**  
  > *"Flawless. You capture Neander’s 'modern history' solution, its pluralism about functions, and how it resolves the feathers case. Ideal answer."*  

  ---

  ### **(c) Why causal-role theory isn’t troubled (10 points)**  
  **Her Answer (excerpt):**  
  > *"Cummins cuts function loose from history entirely [...] function ascriptions come down to whatever capacity we as investigators decide to focus on [...] no further fact about a trait's 'real' function. That's exactly why the case was never a problem."*  

  **Grading (6/10):**  
  - ✅ **Core Strength Correct (3/3):** Correctly notes Cummins’ theory is ahistorical.  
  - ✅ **Contrast with Etiology (1/1):** Recognizes no conflict with historical facts.  
  - ❌ **Misrepresentation of Cummins (2/6):** Cummins **does not** say function is *whatever we decide*. It’s defined by a trait’s **actual causal contribution** to a *specific capacity of a system*. For example, feathers function in flight *only* if they causally contribute to the bird’s flight capacity. "What we focus on" is secondary to objective causal relations.  
  - ❌ **Oversimplification (0/-1):** Fails to note that Cummins requires a *systemic capacity* (e.g., avian locomotion) to ground function claims—not arbitrary choices.  

  **Feedback:**  
  > *"You correctly state Cummins avoids historical problems but mischaracterize his theory as subjective. Cummins functions are objective (causal roles in systems), not investigator-relative. The 'focus' is on which *system capacity* we analyze, not which effect we arbitrarily label functional."*  

  ---

