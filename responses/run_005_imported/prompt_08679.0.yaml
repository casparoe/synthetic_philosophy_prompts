  ## Tolstoy Arts Foundation - Grant Decision Memorandum

  **To:** Grant Selection Panel  
  **From:** [Your Name], Panel Member & Doctoral Candidate in Comparative Literature (Tolstoy Specialist)  
  **Date:** October 26, 2023  
  **Subject:** Decision Regarding 2023 Annual Grant – Application of L.N. Tolstoy’s Criteria from *What Is Art?*

  **I. Tolstoyan Criteria Review (Per *What Is Art?*):**

  Based on the donor's charter, the grant must be awarded based on Lev Nikolayevich Tolstoy’s definition of "true art" as articulated in his treatise *What Is Art?* (1897). Key tenets relevant to this decision include:

  1.  **Infection (Заражение/Zarazhenie):** The essential quality of true art is its capacity to "infect" the recipient with the feeling(s) experienced or intended by the artist. This infection must be sincere and involuntary on the part of the audience. Technical skill alone is irrelevant without this transmission.
  2.  **Sincerity (Искренность/Iskrennost'):** The artist must genuinely feel the emotion they seek to transmit. Art created disingenuously, for effect, or by formula is "counterfeit."
  3.  **Unity of Feeling:** True art transmits feelings accessible to *all* people, breaking down social barriers. It unites humanity in shared emotional experience, not catering solely to an elite.
  4.  **Moral Content:** Tolstoy explicitly states that art transmitting feelings contrary to the "religious perception" of the age (which he defines as the highest Christian ideals: love, compassion, forgiveness, brotherhood) is "bad art," regardless of infectiousness. Art promoting division, hatred, sensuality, pride, or patriotism is condemned. Art must serve humanity's spiritual progress towards goodness and unity.
  5.  **Accessibility:** True art should be understandable and emotionally resonant for the common laborer, not just the educated elite.

  **II. Analysis of Finalists Against Tolstoyan Criteria:**

  *   **Finalist A (Folk Singer):**
      *   **Strengths:** Demonstrates high potential for **Infection**. Reports of audiences being moved to tears across diverse backgrounds suggest a powerful transmission of sincere, autobiographical feeling (**Sincerity**), fostering a sense of shared humanity (**Unity**). The plain style aids **Accessibility**.
      *   **Weaknesses (Per Tolstoy):** The critical flaw lies in **Moral Content**. Tolstoy vehemently condemns revenge as fundamentally anti-Christian and divisive. He writes: "Feelings... of pride, of discontent with one's lot... of revenge... are not only not good, but are distinctly bad." Art glorifying revenge, however "just" it may seem, transmits feelings destructive to the brotherhood of man. This directly contravenes Tolstoy's core requirement that true art promote love and unity. The infectiousness of these revenge songs makes them *more* dangerous, not less, under Tolstoy's moral framework.

  *   **Finalist B (Children's Choir Composer):**
      *   **Strengths:** The **Moral Content** explicitly focuses on forgiveness and togetherness – ideals Tolstoy champions as the highest religious perception. The use of a children's choir inherently promotes **Accessibility** and gestures towards **Unity** and innocence. Technical polish is present.
      *   **Weaknesses (Per Tolstoy):** Concerns center on **Sincerity** and resulting **Infection**. If the feeling of forgiveness and togetherness is not genuinely felt by the artist ("writing to formula"), the art fails at its core function. Reports of the music feeling "inert" strongly suggest a failure of genuine **Infection**. Tolstoy states: "The chief characteristic of the feeling of art is insensibility to the infection... if the work does not infect... it is not art." Art that *preaches* good feelings without genuinely *transmitting* them is ineffective and counterfeit.

  **III. Panel Decision & Rationale:**

  **Decision: Award the 2023 Tolstoy Arts Foundation Grant to NEITHER Finalist.**

  **Rationale:**

  While both finalists exhibit elements aligning with Tolstoy's definition, **neither simultaneously fulfills the twin, inseparable pillars of True Art as defined in *What Is Art?*: sincere infectiousness *and* morally good content.**

  1.  **Finalist A:** Achieves powerful **Infection** rooted in **Sincerity**, demonstrating **Accessibility** and **Unity** through audience response. However, the significant portion of the work promoting **revenge fatally violates Tolstoy's requirement for morally good content**. Tolstoy would classify this work, particularly the revenge-focused songs, as "bad art" precisely *because* it is infectious yet transmits destructive feelings.
  2.  **Finalist B:** Explicitly embraces the **correct Moral Content** (forgiveness, togetherness) and utilizes an **Accessible** form. However, the reported lack of emotional impact ("inert") and suspicion of insincerity/formulaic creation strongly indicate a failure of **Sincerity**, leading to a lack of genuine **Infection**. Without this transmission, it fails as art under Tolstoy's definition, regardless of its noble intentions or subject matter. It risks being "counterfeit art."

  **IV. Strongest Case for the Rejected Finalists:**

  *   **For Finalist A:** The undeniable power of his performance to induce a visceral, shared emotional response across diverse audiences represents the most compelling evidence for **Infection** – the very *engine* of Tolstoyan art. His autobiographical **Sincerity** is palpable. If the moral criterion were less absolute or interpreted differently, his raw transmission of human experience would be a powerful contender for embodying Tolstoy's primary mechanism of art.
  *   **For Finalist B:** Her conscious choice of themes – **forgiveness and universal togetherness** – aligns *perfectly* with Tolstoy's highest ideals for art's moral purpose. Targeting children inherently promotes **Accessibility** and future unity. If the panel's perception of "inertness" is inaccurate, or if the technical craft *does* successfully transmit gentle, unifying feelings of forgiveness to its intended young audience (even if not to adult panelists), her work would represent a direct attempt to fulfill Tolstoy's vision of art serving humanity's spiritual progress through morally uplifting content.

  **V. Recommendations:**

  1.  **Formal Vote:** This memo provides the Tolstoyan analysis. The panel should formally vote on the motion: "To award the 2023 grant to neither finalist, based on failure of either to fully meet Tolstoy's criteria for True Art as defined in *What Is Art?*."
  2.  **Charter Review:** The Board should consider whether the donor's strict adherence to Tolstoy's 1897 definition (particularly its absolute moral gatekeeping) remains the optimal framework for the foundation's modern mission. Tolstoy's criteria are notoriously stringent and exclude vast swathes of what the world considers great art. Clarification or potential amendment might be prudent.
  3.  **Feedback:** If feasible and appropriate, provide the finalists with constructive feedback based on this analysis, acknowledging their strengths while explaining the specific Tolstoyan criteria that presented challenges.

  **Respectfully submitted,**

  [Your Name]
