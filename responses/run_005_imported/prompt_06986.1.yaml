prompt: |-
  So I've been reading about Skolem's paradox and it's kinda messing with my head. The Löwenheim–Skolem theorem says that ZFC, if it has a model at all, has to have a countable one. But ZFC also proves Cantor's theorem, that the reals (or the powerset of the naturals) can't be put in bijection with the naturals. So inside this countable model there's apparently a set that counts as 'uncountable' from the model's own point of view. Doesnt that just mean ZFC is inconsistent, since the same set would be both countable (there's only countably many things in the model, period) and uncountable (no bijection with the naturals exists)? If it's not an actual contradiction I don't really get whats going on - like, what exactly is being relativized here, and relative to what?
