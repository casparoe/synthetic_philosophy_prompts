      The standard definition of expected value for a discrete random variable (with outcomes indexed by the natural numbers) is the sum in the natural order. So in that sense, Leo is correct. However, the rearrangement paradox shows that this expected value is not robust under rearrangement. So it's a valid point but with caveats.

