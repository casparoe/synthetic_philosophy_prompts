      However, note that the actual payoff for n is 2^n/n, and the probability is 1/2^n. So the term for n is (1/2^n) * ( (-1)^{n+1} * 2^n / n ) = (-1)^{n+1} * (1/n). Therefore, the series of expected contributions is indeed the alternating harmonic series. This series converges conditionally to ln(2). So Leo's calculation is correct for that ordering.

      But the problem is that conditional convergence implies that rearrangements can change the sum. So while the temporal order gives ln(2), it is not the only possible sum.

