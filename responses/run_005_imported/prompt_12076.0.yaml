      This is a pragmatic point. The game is played by flipping a coin in sequence. The outcomes are naturally ordered by the time of resolution. So when we compute the expected value, we are summing the terms in the order of increasing n (which is the temporal order). 

      However, note that the expected value is a pre-game calculation. It does not depend on the temporal resolution during the game. It is a static property. The standard definition of expected value does not require the temporal order of resolution. It requires the probabilities and the payoffs. The sample space is the set of outcomes (each outcome being a sequence of tails until the first head). We index these outcomes by n (the toss of the first head). The natural order is by n. So the temporal order and the natural order of the outcomes (by n) coincide.

      So Leo is right that we should use the natural order of the outcomes (by n). That is the standard definition. But note: the rearrangement theorem still holds. The problem is that without absolute convergence, we lose the property that the sum is independent of the order. However, the standard definition fixes the order (by the outcome index). So in that fixed order, the sum is ln(2).

