  (6) Naomi: She says that the long-run idea doesn't work because variants of the game can be built where the long-run average doesn't settle down. Also, she gives an example: if we add $1 to every payoff, the new game is strictly better, but the expected value (if defined as in the original) would be the same (because the series is still conditionally convergent and rearrangements would change the sum arbitrarily). Therefore, we cannot say that the new game has a higher expected value.

