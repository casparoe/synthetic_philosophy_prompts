      This is mathematically correct (by the Riemann rearrangement theorem). The standard definition of expected value for a discrete random variable is the sum in the natural order of the outcomes. However, if we consider the outcomes in a different order (which is not the temporal order and not the natural order of n), then we get a different sum. But note: the natural order of the outcomes (by n) is the one that corresponds to the temporal order and the way the game is structured. 

      However, the problem is that the expected value is defined as the sum over the sample space, which in this case is countable and we index by n. The standard definition does not require rearrangements. So while Naomi is correct that rearrangements change the sum, the standard expected value is defined in the natural order. 

      But note: the problem is that the series of absolute values diverges (harmonic series), so the expectation is not absolutely convergent. In such cases, the expected value is not well-defined in the sense that it is not rearrangement invariant. So in a way, both are right: the standard definition gives ln(2), but the lack of absolute convergence means that we cannot rely on the rearrangement.

