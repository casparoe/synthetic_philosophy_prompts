  - **1 (Plain CDT)**: Uses prior probabilities without ratifiability. Correctly recognizes that your choice *causes* neither Death's location nor your death (Death's setup is acausal). Both acts have identical causal outcomes (death), so CDT indifferently recommends either. No flip-flop, as it ignores the self-referential evidence.  
