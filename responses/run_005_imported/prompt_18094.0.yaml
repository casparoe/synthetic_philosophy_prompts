  On the other hand, the illusionist view argues that these features are post-hoc interpretations. Just because we can find patterns doesn't mean they were functionally there. The brain analogy is tricky—neural nets aren't brains, so projecting human-like representations might be misleading. Also, the underdetermination problem: multiple interpretations could fit the same data. The intentional stance is a useful tool, not a reflection of reality.

