prompt: |-
  I don't have any formal training in philosophy or computer science, but over the past year I've taught myself a fair amount of decision theory and AI-safety writing, and I now run a small podcast where I talk to people working in the field. My next guest is a researcher known for defending "surrogate goals" as a response to acausal threats -- the idea that an agent can protect what it actually values by convincing a would-be threatener that it deeply cares about some substitute target, so that any threat lands on the decoy instead. Draft eight to ten interview questions that go beyond having her restate the pitch: I want at least one question on how a decoy can be made credible without the agent ever bearing real cost if it's exploited, one on whether a sufficiently capable threatener could simply detect that a goal is a surrogate and target the real one anyway, which would force an infinite regress of surrogates for surrogates, and one on whether adopting surrogate goals makes threats cheaper to issue and so increases how often they occur even though each individual one gets deflected. End with a question about what kind of evidence could ever show the strategy has failed, given that the whole scenario involves agents that may never causally interact at all. For each question, add a short follow-up keyed to the answer she's most likely to give.
reasoning: |-
  We are drafting 8-10 interview questions for a researcher on "surrogate goals" as a response to acausal threats.
   Key requirements:
     - At least one question on making the decoy credible without real cost if exploited.
     - One on whether a sufficiently capable threatener could detect the surrogate and target the real goal, leading to infinite regress.
     - One on whether surrogate goals make threats cheaper and thus more frequent.
     - End with a question about what evidence could show the strategy has failed, given the acausal setting (no causal interaction).

   Additionally, for each main question, we need a short follow-up keyed to the most likely answer.

   Let's structure:

   1. Introduction: Start with a question that sets the stage without just restating the pitch. Maybe about the origins or motivation.

   Then, the required questions:

   2. Credibility without cost.
   3. Threatener detecting the surrogate and infinite regress.
   4. Impact on threat frequency (cheaper threats -> more threats?).

   5. Failure evidence in acausal setting.

   And then 3-5 more questions to round out to 8-10.

   Other angles:
     - Practicality: How to implement in a real AI system?
     - Trade-offs: What are the downsides?
     - Relation to other approaches: How does this compare to, say, cryptographic commitments or other decision theories?
     - Historical examples (if any) or thought experiments.

   Let's draft:

   Total: 10 questions (to be safe) including the required ones.

   1. (Intro) Your work on surrogate goals has been described as a novel approach to acausal threats. Could you share what initially led you to consider this strategy? What gap in existing decision theories were you trying to address?

      Follow-up (if she mentions, say, the limitations of precommitment or acausal trade): How do surrogate goals differ from precommitment strategies that also aim to deter threats?

   2. (Required: Credibility without cost) One challenge with surrogate goals is establishing credibility: how can an agent convincingly pretend to care about a decoy without actually risking any real cost if the decoy is attacked? 

      Follow-up (likely she might talk about signaling or observable proxies): If an agent uses observable proxies (like public declarations) to signal commitment to the decoy, how does it avoid being exploited by threats that are only bluffs? 

   3. (Required: Detection and infinite regress) For a sufficiently capable threatener, could they not see through the ruse and detect that the goal is a surrogate? And if they can, wouldn't that force the agent to create a surrogate for the surrogate, leading to an infinite regress?

      Follow-up (if she suggests that there's a limit to the threatener's capability or that the agent can hide the real goal): How do you avoid an arms race in deception capabilities between the agent and the threatener?

   4. (Required: Threat frequency) By making threats cheaper to issue (since they hit the decoy), does the surrogate goal strategy actually increase the frequency of threats? Even if each threat is deflected, could the overall environment become more hostile?

      Follow-up (if she downplays the frequency effect): What mechanisms could an agent use to disincentivize threat issuance in the first place, beyond just deflecting them?

   5. (Required: Failure evidence) Given that acausal threats involve agents that may never causally interact, what kind of evidence could ever demonstrate that the surrogate goal strategy has failed? In other words, how can we test or falsify this approach?

      Follow-up (if she talks about statistical evidence or patterns in the behavior of other agents): How would you distinguish between a world where the strategy is working and one where it has failed but we don't observe the failure directly?

   6. How do surrogate goals interact with other decision-theoretic strategies, like updatelessness or functional decision theory? Could they be combined, or are they incompatible?

      Follow-up (if she says they are compatible): What would a combined strategy look like in practice? And if incompatible, why?

   7. In the context of AI safety, how would we implement surrogate goals in a real AI system? What architectural features would be required?

      Follow-up (if she mentions specific mechanisms): How do we ensure that the AI doesn't accidentally reveal the real goal during its operations?

   8. What are the most significant trade-offs or risks of adopting surrogate goals? For instance, could the agent become so invested in the decoy that it starts to neglect the real goal?

      Follow-up (if she acknowledges such risks): How can we design the agent to avoid these pitfalls?

   9. Can you think of any historical or fictional examples where surrogate goals were effectively (or ineffectively) employed? How do these inform the theory?

      Follow-up (if she gives an example): What lessons can we draw from that example for designing surrogate goals in acausal settings?

   10. Looking forward, what do you see as the biggest challenges in making surrogate goals a practical and robust solution? And what research directions are you most excited about?

       Follow-up (if she mentions a particular challenge): How do you plan to address that in your ongoing work?

