answer: |-
  Here are eight interview questions designed to probe deep into surrogate goals, including your specified requirements, with follow-ups anticipating likely responses:

  1. **Core Mechanism**  
     "You've argued that surrogate goals allow agents to 'redirect' acausal threats. But how can an agent make its commitment to a decoy goal *credible* without ever paying a real cost if the threatener exploits it? For example, if the agent never actually sacrifices resources to defend the decoy, why would a threatener believe the facade?"  
     *Follow-up (if she emphasizes signaling/messaging):* "If credibility hinges solely on declarative statements (e.g., 'I care about this decoy!'), wouldn't a rational threatener dismiss this as cheap talk absent costly demonstrations?"

  2. **Infinite Regress Vulnerability**  
     "Could a superintelligent threatener with advanced theory of mind or goal-inference tools discern that a goal is merely a surrogate? If so, wouldn't this force agents into an infinite regress—layering surrogate goals atop surrogates—to protect the original value?"  
     *Follow-up (if she suggests obscuring the real goal):* "How can an agent reliably obscure its true goal without itself becoming unpredictable or incoherent, which might *invite* more threats?"

  3. **Threat Proliferation**  
     "By making threats cheaper to execute (since they hit costless decoys), does adopting surrogate goals increase the *frequency* of threats? Even if each is deflected, could this normalize threat-making as a low-risk strategy, creating systemic instability?"  
     *Follow-up (if she downplays proliferation):* "If issuing threats becomes near-zero cost, what prevents a flood of speculative or opportunistic threats from minimally invested actors?"

  4. **Failure Evidence**  
     "Given that acausal threats may involve no causal interaction, what observable evidence could demonstrate surrogate goals have *failed*? For instance, if the real goal is silently compromised, how would we detect it?"  
     *Follow-up (if she cites probabilistic indicators):* "How do we distinguish between a world where the strategy works and one where we’re ‘unlucky’—especially if failures are irreversible and unobservable?"

  5. **Deception vs. Control**  
     "Surrogate goals seem to rely on strategic deception. How do you reconcile this with control/alignment frameworks that prioritize transparent goal architectures? Does this approach require agents to be *better* at deception than at honest optimization?"  
     *Follow-up (if she argues deception is necessary):* "Wouldn't this incentivize threateners to develop ever-more-sophisticated deception-detection tools, escalating risks?"

  6. **Bargaining Dynamics**  
     "Couldn't a threatener exploit surrogate goals by *pretending* to believe the decoy, only to later reveal they’ve targeted the real goal all along? How does this affect iterative bargaining?"  
     *Follow-up (if she highlights commitment devices):* "What prevents threateners from using their *own* surrogate decoys to feign cooperation while planning attacks?"

  7. **Cognitive Overhead**  
     "Maintaining decoys seems cognitively taxing. How do agents balance resource allocation between the real goal, the surrogate, and threat monitoring without sacrificing core functionality?"  
     *Follow-up (if she proposes efficiency trade-offs):* "At what point does the overhead of maintaining surrogates outweigh the benefits of threat deflection?"

  8. **Moral Hazard**  
     "If agents never incur costs when decoys are exploited, does this encourage reckless behavior? For instance, might agents provoke threats they could otherwise avoid, knowing the decoy absorbs the blow?"  
     *Follow-up (if she dismisses recklessness):* "Couldn’t threateners interpret this recklessness as a sign of *weakness* in the agent’s overall strategy?"

  ### Key Features  
  - **Credibility without cost** (Q1) probes the core paradox of costless deception.  
  - **Infinite regress** (Q2) addresses detection risks and escalation.  
  - **Threat frequency** (Q3) examines unintended systemic consequences.  
  - **Failure evidence** (Q4) closes with epistemology in acausal settings.  
  - Follow-ups pressure test optimistic answers (e.g., "signaling solves credibility" → "but isn’t that cheap talk?").  

  These questions avoid restating the theory and instead target paradoxes, unintended consequences, and testability—pushing the discussion beyond the initial pitch.
