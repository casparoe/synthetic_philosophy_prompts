  For the standard, future cases should require proof of conflicting duties: one duty under the honor code and another legitimate obligation. The conflicting duty must be significant, like preventing severe harm, not just friendship loyalty. Also, immediate reporting after the conflict resolves could mitigate sanctions.

  Addressing the counterargument: The Kantian view might say Reese's duty to report overrides any promise to a friend. But Williams' perspective acknowledges emotional residue as evidence of a real dilemma. The memo should concede that while the duty to report is paramount, the council can recognize the psychological weight of such conflicts without excusing the violation.

