     For UDT in tails: -$100 (they paid) -> net change: -$100.
     For CDT in tails: $0 net change.

     In heads:
        UDT: +$10,000 net change.
        CDT: $0 net change.

   So expected net change:
     UDT: 0.5 * 10000 + 0.5 * (-100) = 5000 - 50 = 4950.
     CDT: 0.5 * 0 + 0.5 * 0 = 0.

   Therefore, UDT comes out ahead.

   CDT: "But in the tails world, if I don't pay, I have $100 that I would have otherwise lost. So that's a relative gain of $100 compared to paying. So the net change in tails is actually +$100? Wait, no. Let me define the initial state: before the experiment, I have X dollars. In the tails scenario, if I pay, I have X - 100. If I don't pay, I have X. In the heads scenario, if I get the money, I have X + 10000, else I have X.

