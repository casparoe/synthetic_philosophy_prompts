   UDT: "I think I made a miscalculation. The expected value of my rule: 0.5 * $10,000 - 0.5 * $100 = $5,000 - $50 = $4,950. And your rule: 0.5 * $0 (in heads) + 0.5 * $100 (in tails, because you keep $100 that you didn't pay) = $50. So indeed, $4,950 vs $50. But wait, that can't be right because if you are the type that doesn't pay, then in the heads scenario you get $0, and in the tails scenario you get $0? No, in the tails scenario you are asked to pay $100. If you don't pay, you don't lose any money, so you have $0 net change? Or do you start with the $100 and then keep it? Let's clarify the payoffs.

   In the heads scenario: if Omega predicts you pay in tails, you get $10,000. If not, you get $0.
   In the tails scenario: if you pay, you lose $100. If you don't pay, you don't lose anything.

   So for UDT rule (pay in tails):
     Heads: +$10,000
     Tails: -$100
     Expected: 0.5*10000 - 0.5*100 = 5000 - 50 = 4950.

   For CDT rule (don't pay in tails, and therefore in heads you get $0 because Omega predicts you wouldn't pay):
     Heads: $0
     Tails: $0 (because you don't pay, so you keep your $100? But note: you didn't have to pay, so you are not out any money. However, the $100 you keep is not a gain, it's just not lost. So the net change is $0 in tails? Actually, let's think of it as:

     In tails: you are asked to give $100. If you refuse, you have $0 extra (compared to before the experiment) because you didn't give away any money. But you also didn't get any money. So the net is $0.

     In heads: you get $0 (because Omega didn't give you the money).

     So expected value: 0.5*0 + 0.5*0 = 0.

   But wait, the CDT agent in the tails world does not have to pay $100, so they are left with the $100 they would have paid? That $100 is theirs to keep? Then in the tails world, they have $100 (they kept it) and in the heads world they have $0. But note: the $100 they keep in tails is not a windfall; it's money they already had. The experiment doesn't take away any money in tails if they don't pay? So the net change in wealth is:

