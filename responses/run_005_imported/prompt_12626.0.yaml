   This captures the essence of the debate.
answer: |-
  **Causal Decision Theorist (CDT):** Look, the coin landed tails. Paying $100 now can't possibly affect the outcome of the coin flip—it’s already happened. I’m being asked to hand over money for absolutely nothing in return. Why would I set $100 on fire?  

  **Updateless Decision Theorist (UDT):** Because this isn’t about *this* outcome alone. Omega’s prediction links the two scenarios. If you’re the type who pays in the tails case, then in the heads world—which *was* possible when the coin was flipped—you’d have gotten $10,000. By refusing now, you’re dooming *both* versions of yourself.  

  **CDT:** Dooming? That heads world *never existed*. I’m here in tails, where paying costs me $100 and gains me zilch. You’re asking me to sacrifice real money for a fantasy. How does that make sense?  

  **UDT:** It’s about the decision rule, not the branch. Before the coin flip, the expected value of committing to "pay if tails" is 50% chance of +$10,000 (heads) minus 50% chance of -$100 (tails), netting +$4,950. But if your rule is "never pay," expected value is $0. Refusing now *reveals* your rule is suboptimal.  

  **CDT:** Rules schmules! I don’t live in "before the flip." I live *now*. My action only causes outcomes in *this* timeline. Paying can’t retroactively make heads real or magically deposit $10,000 in my bank account. It’s pure loss.  

  **UDT:** But the $10,000 in heads isn’t magic—it’s contingent on Omega *anticipating* your tail-world choice. By paying, you sustain the logical link: "I pay in tails" implies "I get $10,000 in heads." Break that link, and the heads payoff vanishes *because* of what you do now.  

  **CDT:** Okay, smart aleck—suppose I pay. In *this* world, I lose $100. In the heads world, which *isn’t real*, I’d have gained $10,000. But I’m not in that world! Why should I care about a hypothetical version of me getting rich?  

  **UDT:** Because you’re not choosing for *one* version—you’re choosing the *policy* that governs both. Before knowing the coin outcome, you’d want the policy that pays in tails to trigger the heads windfall. Sticking to it now *is* how you honor that precommitment.  

  **CDT:** Honor? This is decision theory, not ethics! CDT says: maximize utility given actual causes. Here, paying has no causal upside. Period. Your "policy" is just a fancy way of pretending I can change the past.  

  **UDT:** It’s not about changing the past—it’s about logical consistency across possible worlds. Omega doesn’t predict based on *causes*; it simulates your algorithm. If your algorithm outputs "pay" in tails, it outputs "give $10k" in heads. Your refusal now *is* the reason the heads you never existed missed out.  

  **CDT:** Fine, but that "heads me" isn’t around to complain! Meanwhile, *I’m* here, $100 poorer. UDT asks me to bleed for a ghost.  

  **UDT:** No—it asks you to recognize that *your decision rule* is what Omega exploited. If you’d precommitted to paying (as rationality demands pre-flip), you’d net +$4,950. By defecting now, you’re sabotaging the very rule that would’ve made you richer.  

  **CDT:** ...Sabotaging a rule that only hurts me *in this reality*. CDT optimizes the world I *inhabit*. Yours optimizes a weighted average of worlds, including dead ones. I’ll take the $100 in my pocket over your phantom $10,000 any day.  

  **UDT:** And that’s why you’ll never see Omega’s money—in any world. You’re choosing $0 over $4,950 because you can’t see past causality.  

  **CDT:** No—I’m choosing reality over your counterfactual fairy tales. Enjoy your mugging. I’m keeping my cash.  

  *(Both glare, mutually unpersuaded. Omega sighs and disappears, $10,000 unclaimed.)*
