   However, the CDT agent might argue: in the tails scenario, by not paying I avoid a loss of $100, which is equivalent to gaining $100 relative to paying. But that's only if you compare to paying. In absolute terms, the state without the experiment would be X. With the experiment in tails and not paying: X. So net change is 0.

   Therefore, UDT's expected net change is 4950, CDT's is 0. So UDT is better.

   But the CDT agent might still resist because of the actual situation:

   CDT: "But in the actual world, which is tails, if I pay I lose $100. If I don't pay, I don't lose. The heads world is not real. So why should I care about a world that doesn't exist?"

   UDT: "Because the decision rule you choose now determines what happens in both worlds. Even though only one world is real, the rule you adopt now is the same rule that would have been used in the heads world. And that rule is what Omega used to decide whether to give you the money in the heads world. So by adopting a rule that pays in the tails world, you are effectively making it so that in the heads world you get the money. It's a logical connection, not a causal one."

   CDT: "I still don't see how my action now can affect a world that doesn't exist. It's over. The coin flip happened. The heads world is gone. I'm here in tails. I'm being asked to pay $100 for nothing. That's a loss. I avoid it by not paying."

