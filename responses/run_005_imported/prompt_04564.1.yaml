answer: |-
  Based on epistemic characterization results, the solution concepts are ranked from least to most demanding in terms of epistemic assumptions (what players need to know/believe about each other). The ranking considers the strength of assumptions about rationality, beliefs, conjectures, and priors:

  1. **Rationalizability**: Requires only *common belief in rationality* (players believe others are rational, believe others believe the same, etc.), with no need for a common prior or correct conjectures.  
  2. **Iterated elimination of strictly dominated strategies**: Requires *common knowledge of rationality* (stronger than common belief) and game structure, but no common prior; the iterative process relies on mutual knowledge of dominance.  
  3. **Correlated equilibrium**: Requires a *common prior* and *common knowledge of rationality*, allowing correlated actions but not requiring players to know each other's strategies.  
  4. **Nash equilibrium**: Requires a *common prior*, *mutual knowledge of rationality*, and *mutual knowledge of conjectures* (players correctly believe others' strategies), plus independence in beliefs for standard Nash.  
  5. **Iterated elimination of weakly dominated strategies**: Most demanding, requiring *common belief in admissibility* (rationality plus full-support beliefs, i.e., no "belief in miracles") due to sensitivity to zero-probability events.  

  **Ranking (JSON array)**:  
  ["rationalizability", "iterated elimination of strictly dominated strategies", "correlated equilibrium", "Nash equilibrium", "iterated elimination of weakly dominated strategies"]
