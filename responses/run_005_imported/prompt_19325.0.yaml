  Bailey: But why is that more conservative? The MRE rule is designed to be the most conservative in terms of information divergence. If we leave the marginal of Red fixed, we are making a huge change to the within-Red distribution: from (1/2,1/2) to (1/4,3/4). But the MRE rule might make a smaller change overall by also adjusting the marginal of Red.

  Alex: But the change to the within-Red distribution is mandated by the constraint. The constraint requires that conditional on Red, it's 3:1. So we have to change that conditional distribution. The question is whether we also change the marginal. And the invariance intuition says: if the evidence doesn't speak to the marginal, leave it alone.

  Bailey: But the evidence doesn't explicitly speak to the marginal, but it does provide information that might indirectly affect it. The Mire rule is responding to the fact that the prior had a particular within-Red distribution, and the new within-Red distribution is different, so it might be that the worlds that are now less likely within Red (i.e., Red HQ) were in the prior contributing to the overall probability of Red. When we downweight Red HQ, we are also downweighting the whole of Red, and that probability mass has to go somewhere. The MRE rule spreads it to all cells, including Blue.

  Alex: But why not spread it only within Red? For example, downweight Red HQ and upweight Red Second, and leave Blue untouched.

  Bailey: That's what you do in Jeffrey conditionalization. But then you are not preserving the ratios within Blue? No, you are. But the issue is that the constraint doesn't require any particular change to the marginal of Red, so why force it to stay the same? The MRE rule minimizes the overall change, and sometimes that means adjusting the marginal.

  Alex: But then we have the counterintuitive result that a message solely about Red Territory increases Judy's confidence that she's in Blue. That seems unacceptable.

  Bailey: It might seem unacceptable at first, but consider: the message makes Red Territory more specific. It rules out (partially) the possibility of being in Red HQ. Since the prior included that possibility, and now it's reduced, the overall probability of Red goes down a bit, and hence Blue goes up.

  Alex: But the message didn't rule out Red HQ; it just said it's less likely. And it didn't say anything about Blue.

  Bailey: True, but in a probabilistic update, reducing the probability of some part of Red inevitably reduces the probability of Red as a whole, unless we compensate by increasing other parts of Red. And the only other part of Red is Red Second, which is increased. But note that the downweighting of Red HQ is by a factor of 3 in the conditional odds, but in the prior, the two Red cells were equal. So the downweighting of Red HQ is more severe than the upweighting of Red Second? In terms of factors: prior: Red HQ and Red Second both 1/4. New: Red HQ = a, Red Second=3a. To get the same total for Red, we would need 4a = 1/2 => a=1/8. But the MRE rule chooses a different a.

  Alex: I see. But then the debate is about what counts as conservative. Is it conservative to keep the marginal of Red fixed, or is it conservative to minimize the overall KL-divergence? The invariance intuition is that we should not change credences about topics the evidence doesn't speak to, which is Blue. The MRE rule does change them, so it violates that principle.

  Bailey: But the principle of not changing credences about what the evidence doesn't speak to is what we might call "rigidity" or "invariance", but it's not necessarily the most conservative in the information-theoretic sense. And in fact, the Judy Benjamin problem shows that these two ideas of conservatism conflict.

  Alex: So bottom line: the invariance defender needs a update rule that leaves the marginal of Blue unchanged and also satisfies the constraint. That rule is: set the conditional within Red to the new value and leave the marginal of Red unchanged. That's what I would call the natural extension of conditionalization to conditional constraints.

  Bailey: And the shift defender says that rule is arbitrary and not as conservative as the Mre rule. Moreover, the MRE rule has nice properties like converging to conditionalization when the conditional evidence becomes certain. In the limit as the odds go to infinity, the message becomes "If Red, then you are in Second Company", and the MRE rule conditionalizes on "If Red then Second", which is equivalent to "not in Red HQ", so it sets P(Red HQ)=0, and then P(Red Second)=1/3, P(Blue)=2/3? Or something else.

  Alex: In that limit, the material conditional "Red -> Second" is true in all cells except Red HQ. So conditionalizing on that, we rule out Red HQ, leaving the other three cells. Then the probability of Blue is (1/2) / (3/4) wait no. The prior for each cell was 1/4. We rule out Red HQ, so the remaining cells are: Red Second, Blue HQ, Blue Second, each with prior 1/4. Total probability left is 3/4. So P(Blue | evidence) = (1/4 + 1/4) / (3/4) = (1/2) / (3/4) = 2/3.

  Bailey: Exactly. And if we had left the marginal of Red unchanged, in the limit we would have: set P(Red Second)=1/2, and P(Red HQ)=0, and Blue unchanged at 1/2. But then the total probability would be 1/2 (Red Second) + 1/2 (Blue) = 1, and P(Blue)=1/2. But conditionalizing on the material conditional gives 2/3. So the invariance rule does not converge to conditionalization.

  Alex: That's a point in favor of the shift. But it doesn't change the fact that in the probabilistic case, the invariance rule is more intuitive.

  Bailey: And the shift rule is more conservative in the information-theoretic sense and has better limit behavior.

  Alex: So the bottom line is a conflict between two notions of conservatism: one that says don't change what the evidence doesn't touch, and one that says minimize overall information change.

  Bailey: Precisely. And that's why the Judy Benjamin problem remains a puzzle.
