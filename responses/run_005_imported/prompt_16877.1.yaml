prompt: |-
  I've read Eliezer's quantum physics sequence on LessWrong probably three times over the years, and the bit that always stuck with me is the arguement that Bell's theorem doesn't actually prove nonlocality -- it only rules out local theories where a measurement has one definite outcome, and since many-worlds drops the single-outcome assumption instead of locality, it just walks straight through the theorem untouched. Very satisfying, cake and eat it too. But I've since run into physicists, Tim Maudlin especially, who think this is kind of a bait-and-switch: that MWI isn't "local" in the sense that actually matters once you ask what the theory has to posit to get the correlations right, something about the wavefunction not being a thing in ordinary space, or the branches needing to line up across space in a way that smells suspiciously frame-dependent. Can you actually walk through where the real disagreement is? Like, are Eliezer and Maudlin just using "local" to mean two different things, in which case fine, or is there some actual physical commitment MWI has to make beyond "no collapse" that quietly smuggles back in something Bell-theorem-adjacent, just not the signalling kind. And please don't give me the "well it depends what you mean by local" non-answer -- I want to know what's actually being disputed and who's got the stronger case.
reasoning: |-
  Okay, the user is diving deep into the debate around Bell's Theorem and Many-Worlds Interpretation (MWI), specifically the disagreement between Eliezer Yudkowsky and Tim Maudlin. They've read Eliezer's quantum physics sequence multiple times and are familiar with his argument that MWI avoids nonlocality by dropping the single-outcome assumption. But they've encountered physicists like Maudlin who argue MWI isn't truly local in a meaningful sense. The user wants to understand the core of this disagreement without vague answers about definitions.

  First, I need to recall the key points from both sides. Eliezer's stance is that Bell's Theorem only rules out local hidden variable theories with definite outcomes. Since MWI has no collapse and all outcomes occur in different branches, it bypasses the theorem. Maudlin, however, argues that the wavefunction's structure in MWI requires nonlocal correlations to explain the Bell test results, even without signaling. The dispute centers on whether "locality" should include the absence of nonlocal correlations in the wavefunction itself.

  The user mentions Maudlin's point about the wavefunction not being in ordinary space and branches aligning in a frame-dependent way. That's crucial. In MWI, the wavefunction evolves according to the Schrödinger equation, which is local in configuration space. But configuration space isn't physical space; it's a mathematical abstraction. So when particles are entangled, their states are defined in this high-dimensional space, meaning the description of one particle depends on the state of another, regardless of distance. That's the nonlocal correlation Maudlin is talking about.

  Also, the branching in MWI has to be consistent across separated measurements. For example, in a Bell experiment, the outcome at one detector must match the entangled partner's outcome instantaneously to form correlated branches. This alignment happens without a preferred frame, which might lead to inconsistencies under relativity. Maudlin sees this as a form of nonlocality because the branching isn't localized to either measurement site.

  Eliezer would counter that the wavefunction's evolution is governed by a local differential equation in configuration space. But Maudlin insists that for a theory to be local, the physical state at any point should depend only on its immediate surroundings in physical space, not on a global structure. Since the wavefunction assigns properties based on entangled states, it violates this principle.

  The user wants to know who has the stronger case. It's tricky because both are right within their frameworks. Eliezer's view fits with the formalism of quantum mechanics under MWI, avoiding action-at-a-distance. Maudlin's point highlights that the wavefunction's correlations are inherently nonlocal in physical space, even if no information is transmitted. If the user values explanations in physical spacetime, Maudlin's critique holds weight. If they accept configuration space as fundamental, Eliezer's view is consistent.

  The user might also be interested in whether MWI introduces hidden nonlocality despite claiming locality. Maudlin argues that the branching mechanism requires pre-established harmony, similar to hidden variables but without collapse. That's the "smuggling back" of nonlocality. Eliezer sees it as a consequence of unitary evolution, which is local mathematically. The dispute is really about what constitutes the physical ontology—configuration space or spacetime. Without a consensus on that, the disagreement persists.
answer: |-
  You've hit on one of the most nuanced and contentious debates in quantum foundations. The core disagreement between Eliezer Yudkowsky (representing a common MWI perspective) and critics like Tim Maudlin isn't *just* about the definition of "local" – though definitions matter – it's about the **ontological commitments MWI makes to achieve its local *dynamics* while recovering non-local *correlations**, and whether those commitments violate a deeper principle of locality that Bell cared about. Here's the breakdown:

  1.  **Eliezer's MWI Argument (The Cake):**
      *   Bell's Theorem proves that no theory can be **BOTH**:
          *   **Local** (no faster-than-light influences)
          *   **Realist (Definite Outcomes)**: A measurement has a single, definite outcome prior to/independent of observation (often tied to "hidden variables").
      *   MWI rejects **only** the "Definite Outcomes" assumption. It retains locality in the dynamics: the Schrödinger equation evolves the wavefunction locally in configuration space. No faster-than-light influences.
      *   Non-local *correlations* (like Bell tests) arise from the **initial entangled state** + **local unitary evolution**. When Alice measures her particle, her state branches locally. When Bob measures his, *his* state branches locally. The correlation is explained because the branches where Alice got result A are *only ever correlated with* branches where Bob got the corresponding result B. There's no instantaneous *influence*; it's pre-established harmony encoded in the initial entanglement, unfolded locally.
      *   **"Local" here means:** The fundamental dynamical law (the Schrödinger equation) is local differential equations in configuration space. Events at one location in physical space do not *causally influence* events at spacelike separation faster than light.

  2.  **Maudlin's Core Objection (The Switch):**
      Maudlin argues that MWI achieves local *dynamics* only by smuggling in a profound form of **non-local correlation in the *state description itself***. This violates what he sees as the *spirit* of locality that Bell was protecting: **Separability** or **Local Realism** in a broader sense.
      *   **The Wavefunction is Non-Local:** The wavefunction Ψ is not an object *in* ordinary 3D space. It lives in a high-dimensional **configuration space** (e.g., for N particles, it's a function on 3N-dimensional space). The state of the entire system is *holistic* – it assigns properties to *pairs* or *groups* of particles in a way that cannot be reduced to individual particle states defined solely by their local surroundings in 3D space. The entangled state |Ψ> = (|A↑B↓> + |A↓B↑>)/√2 is a *single*, non-separable state encompassing both particles.
      *   **Branching Alignment Requires Non-Local Coordination:** For the MWI explanation of Bell correlations to work, the branching at Alice's location *must* be perfectly correlated with the branching at Bob's location, *instantaneously* and *across space*. How does the universe "know" that the branch where Alice measured spin-up is *only* correlated with the branch where Bob measured spin-down, and vice-versa, *before* any light-speed signal could connect them? This perfect, spacelike correlation between branch structures at distant locations is, for Maudlin, a form of **non-local fact**. It's not causal signaling, but it's a non-local *constraint* on the global state.
      *   **Frame-Dependence Worry (The Smell):** Relativity demands that sequences of spacelike separated events don't have a unique temporal order. In MWI, when and where does the branching happen? If Alice measures slightly before Bob in one frame, her branch "splits" first, and Bob's measurement then splits each of her branches. But in a frame where Bob measures first, *his* splitting happens first. How do these different branching sequences *coordinate* to ensure the final correlated branches match perfectly? This apparent frame-dependence of the branching process raises concerns about whether MWI can be made fully Lorentz invariant without introducing hidden non-local coordination or a preferred frame. This isn't fully settled.
      *   **"Local" for Maudlin (and arguably Bell) implies:** The complete physical state of the world can be specified by assigning properties to **localized spacetime regions** (or their boundaries), such that the state in one region **supervenes** only on states in its immediate past light cone (causal locality) *and* the properties assigned to spatially separated regions are **logically independent** (separability). MWI violates separability because the entangled state describes a global fact about the *relationship* between distant particles that isn't reducible to local facts.

  3.  **Where the Disagreement Lies & Who Has the Stronger Case:**

      *   **Formal Dynamical Locality:** Eliezer wins. The Schrödinger equation governing MWI *is* manifestly local in configuration space. There are no terms allowing faster-than-light propagation of effects within the dynamics.
      *   **Correlations Without Signaling:** Both agree MWI gets this right. No usable FTL signaling is possible.
      *   **Ontological Locality / Separability:** Maudlin wins. MWI's fundamental ontology – the universal wavefunction in configuration space – is inherently non-separable. The state of widely separated particles is described by a *single mathematical object* encoding their correlation. The branching explanation *requires* this non-local correlation to be present in the initial state and dictates the branching structure *instantaneously* across space.
      *   **"What Bell Actually Proves":** Eliezer is technically correct: Bell proves the incompatibility of *local hidden variables* (LHVs) with QM predictions. MWI isn't an LHV theory; it's a no-hidden-variables theory. Maudlin argues Bell's theorem reveals a deeper conflict: **no theory can be both locally causal *and* satisfy the 'phenomenal' facts of definite outcomes *as we experience them*.** MWI avoids this by denying definite outcomes at the fundamental level, replacing them with a branching structure whose global coordination *looks* non-local in Maudlin's sense.

  4.  **Who Has the Stronger Case?** It depends on what you consider the essential aspect of "locality" in physics.
      *   **If your primary concern is *causal influence* and *signaling*:** Eliezer/MWI has the stronger case. The dynamics are local, signaling is impossible, and the non-local correlations are a consequence of the initial conditions + local evolution.
      *   **If your primary concern is *ontological separability* – the idea that physical reality at spatially separated locations consists of independent, self-contained facts:** Maudlin has the stronger case. MWI's wavefunction ontology is fundamentally holistic. The instantaneous, spacelike correlations encoded in the entangled state (and manifest in the branching) represent a non-local feature of reality, even if it doesn't allow control or signaling. This violates the principle Bell thought *should* hold in a local universe.

  **The Bottom Line:**

  The disagreement is **real and substantive**, not merely semantic. Eliezer focuses on **dynamical/causal locality** (no FTL influences), which MWI satisfies. Maudlin focuses on **ontological locality/separability** (independent existence of spatially separated systems), which MWI violates due to the holistic nature of the wavefunction and the non-local coordination required for branching.

  *   **Eliezer's "Cake":** MWI truly does preserve *dynamical* locality and avoids the specific contradiction Bell proved for LHV theories. It's a genuine alternative path.
  *   **Maudlin's "Switch":** Achieving this requires positing a fundamental physical state (the wavefunction in config space) that is inherently non-separable and encodes instantaneous correlations across space. For critics like Maudlin, this is simply *relocating* the non-locality from the dynamics (collapse) into the ontology (the entangled state itself and its branching consequences). It satisfies the letter of Bell's theorem (by dropping definite outcomes) but violates the spirit of locality Bell was defending (separability).

  **Who's "right"?** It hinges on whether you believe **separability** (localized physical states independent of distant states) is a necessary component of a truly local theory, or if **only the prohibition on causal FTL influences** is essential. MWI forces a choice: accept non-separable ontology to preserve causal locality. Critics like Maudlin argue this sacrifices the very thing locality was meant to protect – the idea that the world is made up of localized parts whose interactions are purely local. Proponents argue that non-separability *is* the lesson of QM, and MWI handles it in the cleanest, most local (dynamically) way possible. There's no purely objective resolution; it depends on your philosophical priors about what constitutes a "local" description of nature.
