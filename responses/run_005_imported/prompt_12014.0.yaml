  but then theres the stuff that makes me uneasy: banach-tarski (chopping a solid ball into finitely many pieces and reassembling them with just rotations into two balls the same size as the original), and the fact that choice implies the real numbers can be well-ordered even though no one has ever produced such an ordering or has any real idea what it would look like. i also read theres a model of set theory (Solovay's, from the 70s) where you drop full choice and suddenly every set of real numbers is nicely measurable again, like the "monsters" just go away. and apparently theres a theorem (Diaconescu's? not 100% sure i got that name right) saying that in constructive logic, choice all by itself forces you to accept the full law of excluded middle, which made me think choice might be smuggling in a lot more than it looks like at first glance.

  so now i genuinely can't decide if this axiom is just obviously true (the sock thing really does make it feel obvious) or if its actually a kind of sketchy assumption mathematicians only keep around because too much stuff already depends on it. can you write me an essay that actually weighs the best arguments on both sides of this and then commits to a real verdict at the end? not a cop-out "it depends which axioms you like" type answer - actually tell me whether you think its rational to accept full choice, only weaker versions like countable or dependent choice, or to reject it altogether, and defend that.
