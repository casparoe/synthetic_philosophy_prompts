prompt: |-
  I'm a professor of chemistry and, for the first time this year, chair of my department's five-member Tenure and Promotion Committee. Our bylaws require the committee to find both that a candidate's research record meets department standards and that their teaching record meets department standards before recommending tenure; service wasn't at issue in the case we just reviewed, since all five of us agreed it was more than adequate. Each member submitted a confidential ballot recording a separate judgment on the research record, a separate judgment on the teaching record, and an overall recommendation.

  When I tallied the ballots, three of the five members judged the research record sufficient and four of the five judged the teaching record sufficient — clear majorities on both individual questions. Yet on the overall-recommendation line, only two of five voted to grant tenure, while three voted to deny it. I went back and checked each ballot against its own reasoning, and no one was being inconsistent: every member's overall vote follows correctly from that same member's own two judgments, once you apply the bylaws' requirement that both be satisfied. It's simply that combining the majority verdicts criterion-by-criterion produces one answer, while tallying everyone's bottom-line vote directly produces the opposite one, and our bylaws never specify which of these two procedures is supposed to control. One of my colleagues thinks this resembles some voting paradox she ran into in a class years ago, but she can't recall its name — and even knowing the name wouldn't tell us what we should actually do about this candidate.

  Our report is due in the Dean's office in twelve days, and since our votes have always been close to unanimous in past years, this exact situation has never come up before, so there's no departmental precedent to fall back on. Could you draft the memo I'll circulate to the other four committee members before we meet to finalize our report? I'd like it to recommend, with reasons, how we should resolve this particular candidate's case, and to propose a standing rule we could add to the bylaws so we're not improvising from scratch the next time our criterion-by-criterion judgments and our direct votes come apart this way. Please be candid about what's lost by whichever approach you recommend — I doubt there's a resolution here that doesn't have a genuine cost, and I'd rather weigh that now than be blindsided by it later.
reasoning: |-
  Okay, let me approach this systematically. The chemistry professor is facing a voting paradox in their tenure committee. Three members approved the research, four approved teaching, but only two voted for tenure overall because each member applied the "both must pass" rule individually. This creates a conflict between criterion-by-criterion majority and direct overall voting.

  First, I need to understand why this happened. The ballots show:
  - All members consistently linked their overall vote to their individual judgments
  - The disconnect arises from different combinations of approvals:
    - Some approved one but not the other
    - Only two approved both

  The core issue is that the bylaws don't specify whether to use:
  A) The direct overall vote count (2 yes, 3 no)
  B) The composite of criterion majorities (research yes 3-2, teaching yes 4-1 → composite yes)

  Now, considering the implications:
  For option A (follow direct vote):
  - Honors each member's final judgment
  - But overrides the fact that majorities approved each criterion separately

  For option B (composite approval):
  - Aligns with majorities on criteria
  - But ignores that only 2/5 actually support tenure overall

  The paradox resembles Condorcet's paradox but is more specifically a "premise-based vs conclusion-based" dilemma in group decision-making. 

  I should consider what's lost in each approach:
  - Choosing direct votes might frustrate those who see both criteria passed
  - Choosing composite might disregard members' holistic assessment

  For the standing rule proposal, I lean toward premise-based voting (composite) because:
  1. It's more objective (avoids double-counting no votes)
  2. Aligns with the structure of having separate criteria
  3. Prevents a minority viewpoint from blocking when majorities approve each requirement

  But I must acknowledge the cost: it could force a tenure recommendation against the majority's overall will. The memo should propose this while being transparent about the trade-off.

  For the immediate case, since bylaws are silent, I'd recommend composite approval to stay true to the criteria structure. The standing rule would formalize this for future cases.
answer: |-
  ### MEMORANDUM  
  **To:** Tenure and Promotion Committee Members  
  **From:** [Your Name], Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Resolution of Voting Discrepancy for Candidate [Candidate Name] and Proposed Bylaw Amendment  

  ---

  ### **I. Summary of the Issue**  
  As noted in my ballot tally, our committee reached majority approval on both research (3–2) and teaching (4–1) criteria, yet only two members voted "yes" on the overall tenure recommendation. This discrepancy arises because our bylaws require both criteria to be satisfied for tenure but do not specify whether the final decision should be determined by:  
  - **Procedure A:** The direct count of overall votes (2 yes, 3 no → **deny tenure**), or  
  - **Procedure B:** A composite of the majority judgments on individual criteria (both criteria pass → **grant tenure**).  

  No member’s ballot was inconsistent—each applied the "both must pass" rule correctly to their own judgments. However, the two procedures conflict due to the distribution of approvals:  
  - Only 2 members approved **both** research and teaching.  
  - 1 member approved research but **not** teaching.  
  - 2 members approved teaching but **not** research.  

  This resembles a **discursive dilemma** (or "doctrinal paradox"), a known voting paradox where collective rationality on individual premises conflicts with collective rationality on the conclusion.  

  ---

  ### **II. Recommended Resolution for This Case**  
  I propose we recommend **tenure for the candidate** by adopting **Procedure B** (composite of criterion majorities).  

  #### **Reasons:**  
  1. **Fidelity to Bylaws Structure**:  
     Our bylaws treat research and teaching as independent, non-negotiable requirements. Granting tenure when majorities approve both criteria respects this structure. Overruling the criterion majorities based on the overall vote would functionally negate the intent of evaluating standards separately.  

  2. **Avoids Minority Override**:  
     Under Procedure A (direct vote), the 3 "no" overall votes include members who approved one criterion but not the other. Allowing these partial rejections to override the majority approvals of both criteria grants disproportionate weight to minority viewpoints. For example:  
     - A member rejecting teaching (despite 4 approvals) could single-handedly veto tenure.  
     - Conversely, Procedure B ensures no criterion is dismissed without majority support.  

  3. **Precedential Risk**:  
     Denying tenure despite majorities approving both criteria could expose the department to legal or grievance challenges, as it suggests standards were met but ignored.  

  #### **Cost of This Approach:**  
  - **Loss of Holistic Judgment**: Some members may feel their overall assessment (e.g., "adequate but not exceptional") is overridden. However, our bylaws do not permit nuanced overall discretion—tenure requires only that both standards are met.  

  ---

  ### **III. Proposed Standing Rule for Future Cases**  
  To prevent ambiguity, I propose adding this bylaw provision:  
  > **Section X.Y**: The committee shall recommend tenure if and only if a majority of members judges the candidate to have met the department standard for research, and a majority judges the candidate to have met the department standard for teaching. The direct count of overall recommendations shall not supersede this composite judgment.  

  #### **Why This Rule?**  
  - **Alignment with Criteria**: It prioritizes the "premise-based" logic embedded in our bylaws.  
  - **Predictability**: Future committees avoid ad hoc resolutions.  
  - **Fairness**: Prevents a minority on one criterion from swaying the outcome.  

  #### **Cost of This Rule:**  
  - **Diminished Individual Discretion**: Members cannot use the overall vote to "balance" weaknesses (e.g., approving tenure despite weak teaching if research is exceptional). This is already discouraged by our current structure but would become explicit.  
  - **Rare Paradoxes**: Similar discrepancies may recur but will be resolved automatically.  

  ---

  ### **IV. Next Steps**  
  1. We will meet on **November 1, 10:00 AM** (via Zoom) to:  
     - Vote on tenure for [Candidate Name] based on the composite criterion (Procedure B).  
     - Discuss and refine the proposed standing rule.  
  2. If approved, the rule will be submitted for inclusion in the bylaws at the next faculty meeting.  

  I acknowledge this recommendation involves trade-offs, but it best upholds our mandate to apply department standards objectively. Please reply with any concerns by **October 30**.  

  Respectfully,  
  [Your Name]  
  Chair, Tenure and Promotion Committee  

  ---  
  **Key Reference**:  
  - The "doctrinal paradox" (Kornhauser & Sager, 1993) illustrates how aggregating judgments on premises vs. conclusions can yield conflicting outcomes. Adopting a premise-based rule resolves this systematically.
