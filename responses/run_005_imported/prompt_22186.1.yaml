  - All three frameworks (resources/welfare/capabilities) prescribe different solutions
  - No wheelchair analogies
  - Capability approach isn't obviously superior
  - Must involve fixed resource allocation

  The challenge is finding a case where maximizing capabilities could seem ethically questionable. Most examples paint it as the hero. Let me think about domains where capability expansion might conflict with other values...

  Healthcare rationing comes to mind - say distributing limited transplant organs. But that's still adjacent to disability. Maybe something with cultural goods? Like... museum funding. 

  *scribbles mentally*
  Resource equality: equal budgets per museum
  Welfare equality: fund most popular exhibits
  Capability equality: fund accessibility/education programs 

  But is capability the villain here? Not really. Needs sharper tension. 

  What if... the capability investment actively reduces someone else's functionings? Like noise pollution from disability accommodations. Too niche? 

  Ah! Foundational goods versus positional goods. That's the key. Capabilities care about absolute functionings, but some goods are inherently relative. 

  *lights bulb* 
  Job training! Specifically for competitive fields. 
  - Resources: equal training $ 
  - Welfare: train where people enjoy most 
  - Capability: train disadvantaged groups most 

  But here's the twist: if the job market is zero-sum, boosting A's capability literally diminishes B's. Suddenly capability equality looks like it's picking winners. 

  *refines* 
  Better make it: 
  Fixed pot for career support in a saturated field (classical music? academia?). Capability approach would help marginalized applicants develop skills, but since orchestra seats are fixed, this reduces opportunities for others. Now the three approaches genuinely conflict: 
  - Resources says fund all equally 
  - Welfare says fund happiest students 
  - Capabilities says fund those with least access 

  And crucially, capability investment here creates losers - the traditionally trained students who now face tougher competition. That's where it looks ethically ambiguous: why should group A's capabilities matter more than group B's achieved functionings? 

  *checks boxes* 
  No wheelchairs ✓ 
  No expensive tastes ✓ 
  Capability has real downside ✓ 
  All three diverge ✓ 

  User's probably looking for this level of friction - they mentioned PIP assessments so they understand systemic tradeoffs. The example should resonate with UK context too (maybe use NHS specialists rather than musicians?). 

  Final polish: Emphasize that capability framework isn't "wrong" here, but its distributive consequences become contentious when improving absolute capabilities affects relative positions. That's the philosophical gut-punch.
answer: |-
  You've hit on a genuine philosophical tension! The standard examples *do* overwhelmingly favor the capability approach (CA). Finding a scenario where CA seems less compelling requires moving beyond basic physical needs into areas involving **zero-sum competition, subjective valuation, or the creation of new disadvantages.** Here's a different example focusing on **competitive positional goods** in education/careers:

  **The Scenario: The "Future Maestros" Grant**

  A small city has a fixed pot of £500,000 to fund music education for disadvantaged youth, aiming to foster future professional musicians. There are two distinct groups:

  1.  **Group A (Systematically Excluded):** Talented youth from a historically marginalized community with *no access* to quality instruments, teachers, or performance spaces due to location and systemic barriers. Their *current capability* to become professional musicians is near zero, despite potential.
  2.  **Group B (Struggling but Accessible):** Youth from working-class backgrounds in the city center. They have *basic access* to decent instruments (school bands, community centers) and affordable (but overstretched) teachers. Their *current capability* is low but non-zero. Many have already invested significant personal effort.

  The music industry (especially classical/orchestral) is highly competitive. Success often depends on *relative* skill and opportunity. A spot in a top orchestra for one person means someone else doesn't get it. The grant aims to maximize *meaningful opportunities* for disadvantaged youth to succeed professionally.

  **How Each Approach Allocates the £500k:**

  1.  **Equality of Resources:**
      *   **Focus:** Equal monetary input per eligible youth, or proportional to group size.
      *   **Allocation:** Funds are divided roughly equally between Group A and Group B based on the number of eligible students in each. Each group gets instruments, some lessons, and workshop access.
      *   **Result:** Group B sees modest improvements (better instruments, a few extra masterclasses). Group A sees a *massive leap* – instruments they never had, foundational teachers, dedicated space. However, their *absolute skill level* after funding is likely still significantly *below* the average starting level of Group B *before* funding. They are now "in the game," but starting far behind. Group B gains incrementally but remains competitive relative to their previous standing.
      *   **Problem:** Ignores the vastly different starting points. Group A's massive resource boost might not translate into actual *competitive capability* due to the depth of the initial deficit and the zero-sum nature of the goal.

  2.  **Equality of Welfare:**
      *   **Focus:** Equalizing subjective well-being/happiness derived from the program.
      *   **Allocation:** Funds flow towards activities/provision that generate the most *immediate joy and satisfaction* for participants. This likely means funding more performances, social events, fun workshops, accessible group activities for both groups, and perhaps less focus on the grueling, individual practice needed for elite competition.
      *   **Result:** Participants in *both* groups are likely happier in the short term. They enjoy playing together, performing locally, and feeling part of a community. However, this does little to specifically address the deep capability deficit of Group A or significantly enhance the *professional competitiveness* of *anyone*. Few, if any, from either group are likely to break into the professional tier.
      *   **Problem:** Completely decouples from the stated objective (fostering *professional* musicians). Maximizes present enjoyment but fails to create the *capabilities* necessary for the desired outcome.

  3.  **Equality of Capability (Sen/Nussbaum):**
      *   **Focus:** Equalizing the *substantive freedom* to achieve the functionings of "being a professional musician" or at least having a realistic competitive opportunity.
      *   **Allocation:** The vast majority (perhaps 80-90%) of the grant is targeted at **Group A**. It provides: intensive foundational training from master teachers, high-quality instruments for home practice, dedicated practice spaces, mentorship, travel to auditions/competitions, and psychological support to overcome systemic barriers. A smaller portion supports Group B with advanced masterclasses or specific skill gaps.
      *   **Result:** Group A undergoes a radical transformation. Their capability set expands dramatically; they gain the real freedom to compete. Some may now reach levels competitive with Group B's best. Group B receives less than under other allocations; their progress is slower, and they now face *stiffer competition* from the newly capable Group A. Some in Group B who might have succeeded under Resource Equality now fail due to this increased competition.
      *   **Problem:** This is where CA looks potentially "bad" or at least highly contentious:
          *   **Creates New "Losers":** Group B, who were also disadvantaged (though less so), are *directly harmed* in their pursuit of the same goal. Their *effective capability* (chance of success) might *decrease* due to the funding decision, even if their resources or welfare didn't.
          *   **Merit vs. Redress:** It prioritizes *redressing past exclusion* over *current effort/potential*. A highly motivated, hard-working individual in Group B might lose out to someone in Group A who received massive investment but hasn't (yet) demonstrated the same level of individual dedication or ultimate potential. CA focuses on the *opportunity to develop* merit, not necessarily its current manifestation.
          *   **Zero-Sum Tension:** In highly competitive fields, boosting the capabilities of one group inevitably diminishes the *relative* competitive position of others with similar goals. CA prioritizes bringing the most excluded up to a threshold, even if it means others fall slightly below a success line they might otherwise have reached.
          *   **Perceived "Unfairness":** To Group B and their supporters, it feels like resources are taken from them (who were also working hard with limited means) and given to Group A solely based on group identity and past societal wrongs, not individual need or merit *at the point of allocation*. It can feel like punishment for being "less disadvantaged."

  **Why this makes CA look less like the automatic "good guy":**

  *   **It explicitly sacrifices the interests of some disadvantaged individuals (Group B) to serve others (Group A) deemed more disadvantaged.** This trade-off is inherent but stark.
  *   **In competitive contexts, "capability equality" can mean equalizing the *chance to compete*, not guaranteeing outcomes, and this process can actively worsen the prospects of some.**
  *   **It prioritizes structural redress over individual desert/effort in a way that can feel unjust** to those who have worked hard within the constraints of their own (less severe) disadvantage.
  *   **It highlights that expanding capabilities isn't always a Pareto improvement (making some better off without making others worse off).** Here, Group B is arguably made worse off in terms of their *achieved functioning* (getting the job).

  **The Philosophical Sting:**

  Dworkin might argue that Resource Equality, combined with a hypothetical insurance market (where people insure against being born into Group A), could lead to a fairer distribution *ex-ante* that wouldn't feel like Group B is being penalized *ex-post*. A strict welfarist might say maximizing overall happiness (short-term enjoyment) is better than creating a high-stakes competition where most still fail, just from a more "equal" starting line. The CA advocate counters that only by focusing on capabilities can we address the profound, freedom-denying disadvantage faced by Group A, and that the systemic injustice requires targeted intervention, even if it creates localised friction. The "bad" look for CA comes from its willingness to make difficult, potentially unpopular redistributive choices in the name of substantive freedom, where those choices have clear negative consequences for others who aren't privileged. It forces us to confront the costs of radical inclusion in a world of scarcity and competition.
