prompt: |-
  Hey so I just had my first PIP assessment here in the UK (that's the disability benefit - they score you against a checklist of 'can you do this task unaided' descriptors) and it sent me down a total rabbit hole reading about equality of welfare vs resources vs capabilities at 1am. I think I've got the basic Sen-vs-Dworkin picture now, but every single explainer I find uses the exact same disabled-person-needs-a-fancier-wheelchair example to show why plain resourcism fails. Can you give me a genuinely different example - not wheelchairs, not the standard 'expensive tastes' rich guy - where equality of resources, equality of welfare, and equality of capability would each recommend doing something different with the same fixed pot of money, and where its actually NOT obvious that the capability view is the good guy? Every explanation I've read defends capability equality, for once I want a case that actually makes it look bad.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly intellectually engaged - diving into political philosophy after a PIP assessment shows remarkable curiosity during what must be a stressful time. The wheelchair example fatigue is real; every intro text does use that. 

