prompt: |-
  For an AI safety and rationality club at my high school, a few of us have been working through Wei Dai's original proposal of updateless decision theory (UDT) so that we can lead a discussion on Newcomb's Problem and the "counterfactual mugging" thought experiment next month. Here is what I think I've understood: the whole point of UDT is that an agent settles, once and for all and before making any observations, on whichever single policy maximizes expected utility with respect to its prior over how the world and its own future observations could turn out, and then it simply executes whatever that policy prescribes; it never recomputes a "better" response after actually seeing what happened, even in a case like counterfactual mugging, where, once you've learned the coin landed tails, handing over the $100 looks like pure loss with nothing left to gain. If that's right, then "updatelessness" is really just a formal label for telling an agent to disregard whatever it subsequently learns, which seems to directly contradict one of the first principles of rational belief I picked up from the LessWrong sequences: that you can never predict, in advance, which direction new evidence is going to move your beliefs (what Yudkowsky calls the conservation of expected evidence). A theory that instructs an agent, ahead of time, to act as though certain future observations won't matter looks like it's built to violate that principle on purpose.

  Given this, I don't understand why anyone doing serious work on decision theory or AI alignment treats UDT as a live contender for how a rational agent ought to reason, rather than as a curious but ultimately confused idea that looks appealing only because it happens to win on a couple of cherry-picked thought experiments. Two people in my club have pushed back and insisted that "updateless" doesn't mean what I think it means, but neither of them could pin down exactly where my reasoning goes wrong. Could you help settle this for us?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of an AI safety club studying Wei Dai's UDT, particularly how it handles Newcomb's Problem and counterfactual mugging. The user's main confusion is that UDT seems to contradict the conservation of expected evidence principle from LessWrong, because it tells agents to ignore future observations. Their clubmates disagree but can't pinpoint the error.

  First, I need to address the core misunderstanding: equating "updateless" with "ignoring evidence." The user thinks UDT precommits to actions regardless of future data, which feels irrational. But UDT isn't about discarding evidence; it's about optimizing policies globally. The key is differentiating between updating beliefs and updating decisions. UDT still uses evidence to form beliefs but separates that from the policy selection phase.

  Next, I should clarify how UDT handles priors and observations. The user mentions the conservation of expected evidence. UDT actually relies on this principle during the policy evaluation phase. When calculating expected utility, it considers all possible observations weighted by their prior probabilities. So, evidence isn't ignored; it's integrated in advance.

  The counterfactual mugging example is crucial here. The user sees giving $100 on tails as a loss since Omega doesn't pay. But UDT's policy considers both outcomes: paying on tails might influence Omega's action on heads. The prior probability of heads makes this worthwhile. This isn't ignoring evidence but making a precommitment that maximizes overall utility.

  I should also explain why UDT is taken seriously despite this. Its ability to handle problems where actions affect counterfactuals (like Omega's prediction) shows unique value. In AI alignment, an agent that doesn't "defect" against its future self avoids self-sabotage. UDT's global policy approach prevents agents from being exploited by predictors.

  The user might be conflating belief updating with decision updating. UDT updates beliefs when evaluating policies but fixes the decision policy upfront. This maintains consistency across possible worlds, which is vital for coordination problems or predictor scenarios.

  Finally, addressing why UDT isn't a "confused idea." It's not cherry-picking; it solves specific issues in decision theory that alternatives like CDT or EDT fail at. The formalization avoids logical counterfactuals by considering all mathematical possibilities, which is appealing for AI alignment where agents reason about their own code.

  I need to make sure the explanation is clear without jargon. Emphasize the separation between epistemic and decision processes. Highlight that UDT respects evidence conservation in its calculations but locks decisions to prevent self-defeating behavior. Use counterfactual mugging to show how prior probabilities justify seemingly irrational actions.
answer: |-
  You've articulated a profound tension at the heart of decision theory, and your confusion is understandable. Your characterization of UDT contains a subtle but critical misunderstanding about what "updatelessness" entails. Let's dissect this step-by-step:

  **The Core Misconception:**  
  You're correct that UDT selects a single *policy* (a mapping from observations to actions) *before* seeing any evidence. **However, it does NOT disregard observations or evidence.** Here's the crucial distinction:

  1.  **Belief Updating vs. Decision Updating:** UDT separates these processes.
      *   **Belief Updating (Epistemic):** UDT agents *absolutely do update their beliefs* based on evidence according to standard Bayesian probability theory. Conservation of Expected Evidence (CEE) is fully respected *at the belief level*.
      *   **Decision Updating (Pragmatic):** UDT *fixes the decision policy* (f: observations -> actions) *before* any evidence arrives. Once chosen, the agent *executes* `f(observation)` without re-optimizing the *policy itself* based on the *actual* observation.

  2.  **"Disregarding Learning" is Incorrect:** The agent *uses* the observation `O` as input to its pre-selected policy `f` to determine its action `a = f(O)`. It *learns* `O` and *acts* based on it. The "updatelessness" refers to **not updating the *policy function* `f` itself** after seeing `O`, even if `O` makes some actions specified by `f` *seem* locally suboptimal. It commits to `f` *before* knowing which branch of reality it occupies.

  **Why This Doesn't Violate Conservation of Expected Evidence (CEE):**

  *   **CEE Governs Beliefs:** CEE constrains how *expectations about future evidence* relate to *current beliefs*. It says your *current* expectation of your *future* belief must equal your *current* belief.
  *   **UDT's Policy Selection Respects CEE:** When UDT evaluates the expected utility of a candidate policy `f` *before* seeing any evidence, it does so by **considering all possible observations `O_i` weighted by their *prior* probability `P(O_i)`**.
      *   For each possible `O_i`, it calculates the utility if it takes action `a_i = f(O_i)`.
      *   It then computes the *expected utility* of `f` as: `EU(f) = Σ_i [ P(O_i) * U(f(O_i) | O_i) ]`.
  *   **CEE is Embedded:** This calculation *implicitly respects CEE*. The agent's *prior* expectation of the utility it will get when it sees `O_i` and takes `a_i = f(O_i)` is exactly `EU(f)`. After seeing `O_i`, its *actual* utility might be higher or lower than this prior expectation for that branch, but the *overall expectation* `EU(f)` was correct *given the prior information*. UDT chooses the `f` that maximizes this correctly calculated `EU(f)`, respecting all prior probabilities and the relationships between evidence and outcomes.

  **Counterfactual Mugging Revisited:**  
  *   **The Setup:** Omega flips a coin. Heads (prob 0.5): Nothing happens. Tails (prob 0.5): Omega asks you for $100. If you give it, Omega rewards you with $10,000 *yesterday* (counterfactually, only if tails).
  *   **UDT Policy Selection (Before Flip):** UDT considers policies:
      *   `f1`: "If see Heads, do nothing. If see Tails, pay $100."
      *   `f2`: "If see Heads, do nothing. If see Tails, *refuse* to pay."
  *   **Calculating EU(f1):**
      *   P(Heads) = 0.5. If Heads: `f1` does nothing. Utility = $0.
      *   P(Tails) = 0.5. If Tails: `f1` pays $100, gets $10,000. Utility = $9,900.
      *   `EU(f1) = (0.5 * $0) + (0.5 * $9,900) = $4,950`
  *   **Calculating EU(f2):**
      *   P(Heads) = 0.5. If Heads: `f2` does nothing. Utility = $0.
      *   P(Tails) = 0.5. If Tails: `f2` refuses, gets $0. Utility = $0.
      *   `EU(f2) = (0.5 * $0) + (0.5 * $0) = $0`
  *   **UDT Chooses `f1`** because `EU(f1) > EU(f2)`.
  *   **After Seeing Tails:** The agent observes Tails. It executes `a = f1(Tails) = Pay $100`. This *feels* like a loss *only* because it has the observation "Tails". But crucially:
      *   Its *beliefs* updated correctly: It now knows P(Tails) = 1.
      *   Its *action* is determined by the *pre-selected optimal policy* `f1`.
      *   **The "loss" was fully accounted for in the prior expected utility calculation.** Paying $100 in the Tails branch was the price for the 50% chance of getting $10,000 in that branch, making `f1` optimal overall. Refusing (`f2`) *guarantees* no gain.

  **Why UDT is a Serious Contender (Addressing Your Skepticism):**

  1.  **Solving Coordination Problems:** UDT excels where agents need to coordinate with their counterfactual selves or perfect predictors (like Omega). It avoids self-defeating behavior where an agent, upon seeing an observation, chooses an action that *undermines the very reason the favorable situation arose*.
      *   **Newcomb's:** CDT one-boxes only if it believes Omega *can't* predict it. UDT one-boxes *because* Omega *can* predict it, ensuring the prediction leads to the $1M box being filled. It commits to one-boxing *regardless* of the prediction mechanism.
      *   **Counterfactual Mugging:** UDT "pays" in the Tails branch *because* this commitment was necessary to make the policy of "pay if Tails" optimal *overall*, thereby making Omega's counterfactual reward on Heads possible.

  2.  **Logical Counterfactuals & AI Self-Reflection:** UDT naturally handles cases where an AI's decision algorithm is known/predictable by other parts of the world (or even by its own components). By choosing a fixed policy *before* "knowing which mathematical branch it's in" (e.g., before knowing the outcome of a logical coin flip inside its own computation), UDT agents can cooperate with their counterfactual selves. This is crucial for AI alignment in multi-agent systems or reflective stability.

  3.  **Formalization of "Precommitment":** UDT rigorously formalizes the intuition that rational agents should sometimes precommit to strategies that seem locally suboptimal. It provides a single, consistent criterion (maximize prior expected utility over policies) for making such precommitments.

  4.  **Addressing "Anthropic" and "Logical" Uncertainty:** UDT extends naturally to cases where uncertainty isn't just about physical facts (like coin flips), but about logical facts or even which copy of an agent you are.

  **Where Your Reasoning Slightly Missed:**

  *   **"Disregard what it subsequently learns":** Incorrect. It *uses* what it learns (`O`) as input to `f`. It "disregards" only the *temptation to abandon its pre-selected optimal policy `f`* after learning `O` if `f(O)` seems locally suboptimal *given only `O`*.
  *   **"Act as though future observations won't matter":** Incorrect. UDT *explicitly* defines policies `f` *as functions of future observations*. They matter profoundly! UDT carefully considers *how* it will react to *every possible* observation *when choosing `f`*. The commitment is to *stick to the reaction rules (`f`) it determined were best overall*, not to ignore the observations themselves.
  *   **"Violate Conservation of Expected Evidence":** Incorrect. CEE governs belief updating, which UDT does perfectly. The "updateless" decision is based *entirely* on the prior expectations calculated *respecting CEE*.

  **Conclusion:** UDT's "updatelessness" is not irrational disregard of evidence. It's a sophisticated *global optimization* over decision *rules* (policies), conducted *before* evidence arrives, using correct Bayesian priors that respect CEE. It recognizes that the optimal *reaction rule* to evidence might require committing to actions that seem locally suboptimal in *some* branches, in order to achieve the best overall outcome across *all* branches weighted by their prior probability. This makes it uniquely powerful for problems involving predictors, counterfactual dependencies, and logical uncertainty – precisely the challenges prevalent in AI alignment and high-stakes rationality. Your club is tackling deep material; this tension between local and global optimization is central to modern decision theory. Keep wrestling with it!
