  Therefore, we are forced to use the same p at both. And we saw that with the same p, the in-the-moment calculation with the correct conditioning (using the probabilities that depend on p) leads to the same p=2/3.

  But why then is there an argument? I think the confusion comes from how we assign the probabilities P(first) and P(second). If we assign them without taking into account the strategy p, we get a different answer.

  For example, if the driver at the exit thinks: "I have no idea which exit I'm at, so I'll assign 50-50", then:

     P(first) = 0.5, P(second)=0.5.

  Then:
     E_exit = 0.5*0 + 0.5*4 = 2.
     E_continue = 0.5 * (expected payoff at next exit) + 0.5 * 1.

  But what is the expected payoff at the next exit? If the driver is at the first exit and continues, then he will be at the second exit and again face the same 50-50 belief? So then the expected payoff at the next exit is also V? Then:

