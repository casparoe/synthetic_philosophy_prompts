  But if the driver is at the second exit, then he exits and gets 4. So the expected payoff of exiting at the current exit is 2 (because 50% chance of 0 and 50% chance of 4). And the expected payoff of continuing at the current exit: 
     - If it's the first exit (50%): then he continues and goes to the second exit. At the second exit, he will exit (because he uses the same rule) and get 4.
     - If it's the second exit (50%): then he continues and gets 1.
     So E_continue = 0.5*4 + 0.5*1 = 2.5.

