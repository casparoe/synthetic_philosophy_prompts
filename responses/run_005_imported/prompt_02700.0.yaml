  But if he doesn't fix p for the future, then he might think: "If I continue at this exit and it is the first, then at the next exit I can choose optimally. And if it is the second, then continuing gives 1." So he might try to compute the optimal decision at this exit assuming that at the next exit he will choose optimally. This leads to a different calculation.

  Let's do that:

  At the current exit, the driver does not know if it's the first or second. He assigns:
     P(first) = 1/(1+p) and P(second) = p/(1+p)   [but note: p here is the probability he would have used at the first exit? Actually, we are in the middle of recalculating, so we don't have a p?]

