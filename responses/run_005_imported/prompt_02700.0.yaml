     V = 0.5V + 0.5  =>  0.5V = 0.5  => V=1.

  But then 1 < 2, so the driver would prefer to exit, so V=2. This is consistent: if the driver always exits at the first opportunity, then he gets 0 at the first exit and never reaches the second? But wait, if he is at the first exit and exits, he gets 0. But if he is at the second exit and exits, he gets 4. But with 50-50, the expected payoff of exiting is 2, which is greater than the expected payoff of continuing (which would be 0.5 * (if at first: then after continuing he would be at the second and then get 4? but wait, if he continues at the first and then at the second he will also exit? because he is using the same reasoning and he will exit at the second too?).

  This is messy. Alternatively, if the driver always exits at every exit, then:
     - At the first exit: exits, payoff 0.
