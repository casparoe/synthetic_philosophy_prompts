  The driver cannot distinguish the exits and does not remember how many he has passed. Therefore, he must use the same strategy at both exits: continue with probability p and exit with probability 1-p.

  **Planning Ahead (Ex-ante Optimization):**

  The driver plans ahead to choose p to maximize the expected payoff. The possible outcomes:

  1. He exits at the first exit: probability (1-p), payoff 0.
  2. He continues at the first exit and then exits at the second: probability p*(1-p), payoff 4.
  3. He continues at both exits: probability p*p, payoff 1.

  Total expected payoff: 
     E(p) = (1-p)*0 + p*(1-p)*4 + p*p*1
          = 0 + 4p(1-p) + p^2
          = 4p - 4p^2 + p^2
          = 4p - 3p^2

  To maximize E(p), take the derivative and set to zero:
     E'(p) = 4 - 6p = 0  =>  6p = 4  => p = 4/6 = 2/3.

  The maximum expected payoff is E(2/3) = 4*(2/3) - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3.

