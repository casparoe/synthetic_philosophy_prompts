  Hoping for an outside take on something. I spent almost 40 years running a chemistry lab, and now that I'm retired I sit on the research-integrity committee for my old professional society. We just confirmed that a well-known, long-retired member fabricated data in a couple of papers back in the early 90s -- but the field corrected itself naturally years ago, so nothing today actually hinges on those results anymore. Half the committee still wants to strip his emeritus status and publicize it "to set an example," even though there's nothing left to prevent. The other half say thats pointless since the guy's old and unwell and it wont change anything now. Ive gotten pretty into philosophy since retiring, which is maybe why this is bugging me more than it should -- is "setting an example" actually doing real work here, or just a nicer sounding excuse for wanting to see him punished?
