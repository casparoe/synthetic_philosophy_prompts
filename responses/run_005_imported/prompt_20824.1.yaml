  But practical implications? The user is skeptical. They suspect Relation R might make decisions *harder*, not easier. Families already struggle with conflicting duties: respecting past wishes vs. caring for the present person who may have new needs. If Relation R is a spectrum, when does the directive lose authority? 30% connectedness? 70%? There's no bright line. 

  Also, Parfit downplays identity but emphasizes psychological links. However, in dementia, those links fray unevenly—procedural memories might remain while declarative ones vanish. A patient might still enjoy music (procedural/sensory continuity) but not recognize family. How do we weigh fragmented continuity? 

  Ethically, this could heighten tension. If Relation R is weak, the present self's well-being might override past directives. But Dworkin's "precedent autonomy" argues the past self's values should prevail. Dresser counters that the current self's interests matter more. Parfit's framework doesn't resolve this; it just shows why both sides feel compelling. 

  For practical guidance, Relation R might only offer a checklist: track psychological ties (memories, values recognition) to gauge "survival" of the past self. But it doesn't answer *how much* weight to give a directive at each stage. Clinicians need concrete thresholds, but Parfit gives metaphysics, not metrics. 

  Ironically, acknowledging the ambiguity might be useful. It forces honesty—decisions aren't about discovering "the real person" but balancing ethical claims. Maybe the takeaway is procedural: ensure decision-makers consider both continuity *and* present well-being, without pretending there's a philosophical silver bullet. 

