prompt: |-
  I chair the steering committee for an open-source library of formalized mathematics, built on a proof assistant and used in several university verification courses as well as by one industry team that extracts certified code from our proofs for use in safety-critical systems. The library's core is intuitionistic, so a proof of an existence statement always yields a computable witness. A faction of contributors wants to add the law of excluded middle and the full axiom of choice as global axioms, so we can port large parts of classical analysis and set theory without re-proving everything constructively; they point out that local, explicitly-flagged classical axioms confined to individual files are already accepted as harmless. Several long-standing contributors resist this on principle, holding that a proof of existence that supplies no construction hasn't actually shown anything exists. Draft the decision memo I'll bring to our release-planning meeting: it should come down on one side -- global adoption, local-only axioms, or a separate classical fork of the library -- and it should engage the losing position seriously rather than caricature it.
reasoning: |-
  We are at a crossroads regarding the foundational principles of our library. The proposal to add global axioms (LEM and full AC) has sparked a debate that touches on the core identity of our project. This memo outlines the decision and its rationale, after careful consideration of the arguments on all sides.

  **Decision:** We will maintain the current policy of allowing classical axioms only locally, with explicit flags, and will not add LEM or AC as global axioms. We will also not create a separate classical fork at this time. Instead, we encourage the development of a classical extension as an overlay (a separate project that builds on our core library) that can be imported when needed. This overlay would mark all its results as classical, allowing users to choose between the core constructive library and the classical extension.

  **Rationale:**

  Our library has been successful because it serves two distinct but overlapping communities: 
  1. Those who require computational content (as in the industry team extracting certified code for safety-critical systems, and university courses teaching constructive mathematics and verification).
  2. Those who are interested in formalizing classical mathematics without the overhead of constructivity.

  The core principle of our library is that proofs of existence statements yield computable witnesses. This is not merely a philosophical stance but a practical feature that is critical for some of our users. Changing the core to be classical would break this feature and alienate a significant portion of our user base.

  The current practice of allowing classical reasoning in isolated, explicitly flagged files has been a reasonable compromise. It allows classical results to be developed and used, but with clear boundaries. The proposal for global axioms would remove these boundaries and make the entire library classical by default. This would fundamentally alter the nature of the library and undermine the trust that users place in the computational content of our proofs.

  We acknowledge the argument that global axioms would simplify the porting of classical mathematics. However, we believe that the cost to the core identity and utility of the library is too high. Instead, we propose a structured way to have a classical extension:

  - We will support the creation of a separate project (an overlay) that imports our core library and adds LEM and AC as global axioms. This project would then build classical mathematics on top of our constructive core. The overlay would be maintained separately but could be synchronized with the main library. This approach has several advantages:
    - It keeps the core library constructive and computationally meaningful.
    - It allows users who need classical reasoning to use the overlay without forcing classical logic on everyone.
    - It provides a clear demarcation: results in the core are constructive, and results in the overlay are classical.

  **Engaging the Losing Position:**

  We take seriously the concerns of those advocating for global axioms. They have rightly pointed out that:
  - A significant body of mathematics is developed classically, and requiring constructive proofs for all of it is a heavy burden.
  - The current local-axiom approach requires repetitive and cumbersome flagging, and global axioms would streamline the process.
  - The overlay approach might lead to duplication of effort and fragmentation.

  In response:
  - We acknowledge the burden of constructive proofs, but note that our library's unique value is in its computational content. We do not want to lose this.
  - We will work to reduce the overhead of the local-axiom approach by improving tooling (e.g., better support for managing flags and scopes) and by developing more constructive alternatives to classical theorems where feasible.
  - Regarding duplication: the overlay approach actually avoids the worst of duplication because it builds on the core. The core can be used by both constructive and classical users, and the classical extension only needs to redefine or add classical results. We will work with the community to ensure that the overlay is well-integrated and that contributions to the core that are useful for both can be shared.

  **Next Steps:**

  1. We will document and support the creation of a classical overlay project. We will set up a working group to establish the technical and governance details for this.
  2. We will improve the tooling around local classical axioms to make them less cumbersome (e.g., by allowing file-wide flags and better scoping mechanisms).
  3. We will initiate a project to identify key classical results that are in high demand and work on providing constructive alternatives where possible, while also facilitating their inclusion in the classical overlay.

  This decision preserves the core values of the library while accommodating the needs of classical mathematics in a principled way. We believe it is the best path forward for the community as a whole.
answer: |-
  **MEMORANDUM**  
  **To:** Steering Committee and Contributors  
  **From:** Chair, Steering Committee  
  **Date:** [Date]  
  **Subject:** Decision on Global Axioms for the Library  

  ### **Background**  
  Our library’s core intuitionistic foundation ensures that existence proofs yield computable witnesses, aligning with our original mission: to provide a resource for verification courses and industry applications requiring certified, executable code. A proposal has been raised to adopt the law of excluded middle (LEM) and the full axiom of choice (AC) as **global axioms**, enabling efficient porting of classical mathematics (e.g., analysis, set theory). Opponents argue this undermines the library’s constructive character, as global axioms would decouple existence proofs from explicit witnesses. Alternatives include maintaining **local-only classical axioms** (status quo) or creating a **separate classical fork**.  

  ### **Decision**  
  After thorough deliberation, the steering committee resolves:  
  **We will maintain the status quo of local-only classical axioms and reject global adoption of LEM/AC. We will not create a separate fork at this time.**  
  To address scalability concerns, we will enhance tooling for local axioms and launch a curated **“Classical Companion” overlay** (see *Implementation*).  

  ---

  ### **Rationale**  
  Our decision balances the library’s foundational principles with practical scalability, prioritizing three pillars:  

  1. **Preserving Core Utility for Users**  
     - Industry users and verification courses rely on the computational content of existence proofs. Global LEM/AC would void this guarantee, forcing these users to audit or rewrite proofs—a prohibitive burden for safety-critical systems.  
     - Local axioms (explicitly flagged per file) already allow classical reasoning where needed without compromising the entire library.  

  2. **Avoiding Fragmentation**  
     - A classical fork would split community effort, dilute maintenance, and create compatibility challenges. It risks diverting resources from the core library that serves our primary users.  
     - The “Classical Companion” overlay (detailed below) offers a middle path: classical results can coexist without infiltrating the core.  

  3. **Engaging Classical Use Cases**  
     - We recognize the appeal of global axioms for large-scale classical formalization. To address this, we commit to reducing friction in local workflows and supporting classical mathematics via the overlay.  

  ---

  ### **Engaging the Pro-Global-Axiom Position**  
  Proponents of global LEM/AC argue persuasively that:  
  - **Efficiency and scale** are critical for formalizing mainstream mathematics. Requiring constructive proofs for classical results duplicates effort and slows progress.  
  - **Local axioms are cumbersome** for sprawling theories (e.g., analysis), where constant flagging disrupts workflow.  
  - **Explicit tagging** (e.g., file-level flags) already safeguards constructive users; global axioms merely extend this efficiency.  

  We agree these concerns are valid. However, global axioms would:  
  - Alter the library’s **default behavior**, forcing *all* users to “opt out” of classical reasoning to preserve computability—a heavier burden than the current “opt in.”  
  - **Erode trust** for users extracting code, as global axioms could inadvertently propagate to “constructive” files via dependencies.  

  ---

  ### **Implementation Plan**  
  To serve classical and constructive users equitably:  

  1. **Enhanced Local Axiom Workflow**  
     - Develop IDE tools to automate scoping/flagging of classical axioms (e.g., project-wide classical “modes” with dependency checks).  
     - Create a linting framework to warn when classical proofs leak into constructive modules.  

  2. **“Classical Companion” Overlay**  
     - Launch a parallel, officially managed repository that imports the core library and adds LEM/AC *globally*.  
     - Results in the overlay will carry a “classical” tag, enabling seamless integration for users who accept non-constructive proofs.  
     - Core library contributions will be automatically synchronized to the overlay, minimizing duplication.  

  3. **Community Collaboration**  
     - Form a working group (including pro-global advocates) to streamline constructive re-proofs of high-priority classical theorems (e.g., via topos theory or locale systems).  
     - Host workshops on best practices for mixing constructive/classical reasoning.  

  ---

  ### **Conclusion**  
  This decision affirms our commitment to computability while embracing classical mathematics through scalable, non-disruptive means. The “Classical Companion” overlay empowers users who prioritize efficiency over constructivity, without compromising our core mission. We thank all contributors for their passionate advocacy—this dialogue strengthens our community.  

  **Next Steps:** Draft specifications for the overlay and tooling enhancements will circulate by [Date]. Feedback is welcomed until [Date].  

  ---  
  **Approved:**  
  [Chair’s Signature]
