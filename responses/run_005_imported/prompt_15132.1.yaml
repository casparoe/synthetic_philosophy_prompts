  ### Defense Notes for Office Hours  
  - **On Armstrong’s Necessity Error**:  
    "You stated Armstrong’s laws 'could not have been otherwise' and hold 'necessarily.' Armstrong’s *A World of States of Affairs* (Ch. 15) argues N(F,G) is metaphysically contingent—it *could* fail in other possible worlds. This error misrepresents a key anti-Humean feature: laws are irreducible but not necessary."  

  - **On Missing Objection to Armstrong**:  
    "You only discussed epistemic access, but the *inference problem* (e.g., why N(F,G) entails *all* Fs are Gs) is a deeper metaphysical objection. Armstrong needs this to avoid collapsing into regularity, and omitting it weakened your analysis."  

  - **On Lewis’s Supervenience Omission**:  
    "You didn’t explain *how* laws supervene on the mosaic (e.g., laws are determined by, and reducible to, particular facts). Without this, the Humean response to circularity (laws as summaries, not explainers) isn’t fully grounded."  

  - **Why Not Higher?**  
    Core concepts were understood but lacked precision on metaphysics. Errors in Armstrong’s contingency and omitted objections are significant in a philosophy of science context.  

  **Adjustment Tip**: For stricter grading, reserve A-range scores for answers that nail metaphysical nuances (e.g., distinguishing contingency/necessity, supervenience mechanisms) and address *all* parts of objections.
