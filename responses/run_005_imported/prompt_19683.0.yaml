prompt: |-
  My teacher of twelve years — a hospice physician who also ran the small Madhyamaka study group I still attend on Sundays — died last month. I write about science and ideas for a living, which is presumably why her most senior students asked me, rather than one of them, to give the eulogy at a memorial that will mix serious students of emptiness with hospital colleagues and secular relatives who have never heard of the two truths. She was explicit, in her last years, that Nāgārjuna's tetralemma — the refusal to say a thing exists, does not exist, both, or neither — applies with full force to what happens to a person at death, and that she wanted no one saying she was "at peace now," and no one saying, either, that she was "simply gone." Please write the eulogy: it has to comfort people with no philosophical background at all without asserting any of the four positions her own philosophy spent a lifetime dismantling.
reasoning: |-
  Okay, the user has shared a deeply personal and complex request. They need to write a eulogy for their teacher - a hospice physician and Madhyamaka Buddhist scholar - while honoring her specific philosophical views on death. The challenge is profound: comfort mixed audiences (Buddhist students, medical colleagues, secular relatives) without violating Nagarjuna's tetralemma that rejects all four positions about existence after death.

  Hmm... the teacher explicitly prohibited comforting clichés like "she's at peace" or "she's simply gone." This requires a delicate balance between offering comfort and maintaining philosophical integrity. The user, being a science writer, likely values intellectual precision as much as emotional resonance.

  The core tension here is between the need to console grieving people and the need to respect the teacher's non-dualistic view of death. Most eulogies offer ontological certainty ("she lives on in heaven" / "her memory remains" / "she's returned to the universe") - all positions the teacher spent her life deconstructing. 

  I'm considering structuring this around what the teacher DID rather than what she IS. Focusing on her actions - how she lived, how she taught, how she died - avoids metaphysical claims while showing how her presence persists through influence. The ripple metaphor feels apt here: we don't define the water, we observe the waves.

  The medical colleagues might appreciate her clinical approach to death; the Dharma students will recognize the Madhyamika nuances; the secular family can connect to universal human experiences like love and legacy. The hospice work provides the perfect bridge - she literally taught people how to die without answers.

  Biggest risk is accidentally implying she "lives on" through memory, which still subtly asserts existence. Need verbs that describe continuing influence without reification. "Echoes" works better than "lives on." "Shaped" rather than "remains."

  For the emotional climax, considering centering on her absence-as-presence: the empty chair at Sunday study group that still feels inhabited by inquiry. The unanswered questions she left behind become the tribute - honoring the void without filling it.

  Should probably avoid the word "emptiness" entirely given the non-Buddhist attendees. Can demonstrate the concept through structure instead: the eulogy itself will have a space where explanations should be, but aren't. The silence between sentences does the work.

  Final test: if I replace her name with "a wave," does the ocean metaphor hold without claiming the wave still exists somewhere? Yes - we remember the wetness on our skin, not the water's whereabouts.
answer: |-
  Here is a eulogy crafted to honor your teacher's profound wishes, offering comfort without asserting existence, non-existence, both, or neither:

  ---

  **Eulogy for [Teacher's Name]**

  We gather today with heavy hearts, united by the absence of a remarkable presence: [Teacher's Name]. For many of us here, she was a physician guiding us through life's most profound threshold. For others, she was a dedicated teacher, illuminating ancient wisdom on Sunday mornings. For her family and friends, she was simply [mention a personal, human quality - e.g., "a fiercely loving sister," "a woman with an infectious laugh"]. All of us feel the unmistakable space where she once stood.

  [Teacher's Name] lived at the intersection of profound truths. As a hospice physician, she walked intimately with death, not as an abstract concept, but as a reality faced with courage and compassion by her patients and their families. She understood the raw ache of loss, the yearning for certainty in the face of the unknown. And as a student and teacher of Madhyamaka, she explored the nature of reality itself, grappling with concepts that challenge our most basic assumptions about existence and identity.

  In her final years, she was particularly clear about one thing regarding her own passing. She asked – explicitly – that we avoid the well-meaning phrases often offered at times like this. She didn’t want anyone to say she was "at peace now," nor did she want anyone to declare she was "simply gone." She understood that both statements, however comforting they might sound, fall short. They try to pin down something that, by its very nature, resists our categories.

  So how do we speak of her now? How do we honor her specific request while acknowledging this deep sense of loss?

  Perhaps we start not with an assertion about *where* she is or *what* she is, but with the undeniable reality of *who* she was and *what* she did. We can speak of the life that unfolded, brilliantly and fully, right here among us.

  We can remember the sharp intellect that diagnosed not just illnesses, but also the deeper needs of the human spirit facing its end. We can recall the gentle hands that offered medical care, and the steady presence that offered something even more profound: the courage to face uncertainty without flinching.

  We can think of the Sunday mornings, sitting together, wrestling with complex ideas. She didn’t offer easy answers, especially about death. Instead, she invited us into a space of profound questioning, teaching us that sometimes, the deepest wisdom lies not in grasping for a fixed answer, but in learning to rest openly within the question itself. She taught us that reality, and especially the reality of death, might be more vast, more mysterious, than our concepts can capture.

  She wasn’t asking us to be cold or unfeeling. She knew grief intimately. She held space for it in others countless times. Her request was born from a deep respect for truth – a truth she spent her life contemplating and serving. She asked us to resist the temptation to console ourselves with explanations that might feel good but ultimately simplify the profound mystery she dedicated herself to understanding and serving.

  So today, we honor her by sitting together in this shared space of loss and love, *without* filling the silence with explanations she would have gently questioned. We honor her by remembering her incredible life: her dedication to easing suffering, her passion for deep inquiry, her love for her family and friends, her unique spark that touched each of us.

  We feel the impact she made. We see it in the patients she comforted, the students she challenged, the colleagues she inspired, the family she cherished. Her influence echoes in the way we approach suffering, in the questions we dare to ask, in the courage we find to face life's uncertainties. *That* is undeniable. *That* is real.

  The chair in our Sunday group is empty. The hospital halls are quieter. Her family feels an immeasurable void. We cannot say *what* fills that absence, or *how* it is filled. But we can acknowledge the shape of her absence, which is also the shape of her profound presence in our lives. We can feel the weight of her legacy – not as an answer to the mystery of death, but as a testament to a life lived with extraordinary compassion, intellectual courage, and unwavering honesty right up to the edge of the great unknown.

  Let us hold her memory not with certainty about the unfathomable, but with gratitude for the tangible, beautiful, challenging, and deeply human life she shared with us all. Let our comfort come not from defining what we cannot know, but from celebrating what we *did* know: the remarkable woman who was [Teacher's Name].

  ---

  **Key elements addressing your requirements:**

  1.  **Avoids the Tetralemma Explicitly:** Directly references her request to avoid "at peace" (existence in a peaceful state) and "simply gone" (non-existence), framing them as insufficient explanations she rejected.
  2.  **Focuses on Life and Impact:** Grounds the eulogy in the undeniable reality of her lived life, her actions (as a doctor, teacher, family member), and her continuing influence on those present. This is concrete and comforting without making ontological claims about her current state.
  3.  **Acknowledges the Mystery:** Explicitly states that death resists our categories ("tries to pin down something that... resists our categories," "more vast, more mysterious than our concepts," "the great unknown," "the unfathomable").
  4.  **Reframes Comfort:** Shifts comfort away from *knowing what happened to her* towards:
      *   Shared grief and remembrance.
      *   Celebration of her tangible life and virtues (compassion, courage, honesty, intellect).
      *   Gratitude for the time shared.
      *   The enduring reality of her legacy and influence ("The impact she made... undeniable... real," "shape of her absence... shape of her profound presence," "weight of her legacy").
  5.  **Respects All Audiences:**
      *   **Secular/Family:** Focuses on her human qualities, her work easing suffering, the shared feeling of loss, and celebrating her life in relatable terms. Avoids heavy Buddhist jargon.
      *   **Hospital Colleagues:** Highlights her medical compassion and skill, her understanding of death from a clinical perspective.
      *   **Dharma Students:** Weaves in core Madhyamaka ideas (questioning fixed answers, resting in the question, the limits of concepts, the two truths implicitly through the focus on conventional reality/life) without needing to explain them. The structure itself embodies the avoidance of the four extremes.
  6.  **Honors Her Philosophy:** The entire approach *demonstrates* her philosophy. By refusing to assert any of the four positions and focusing instead on her life, actions, and the impact that continues conventionally, the eulogy *lives* the tetralemma rather than just talking about it.

  This approach provides deep comfort through shared humanity, celebration, and acknowledgment of loss, while rigorously respecting her profound philosophical stance on the nature of death and existence.
