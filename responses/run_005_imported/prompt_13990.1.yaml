  ## Memorandum: Recommendation on Officer Giving Pledge Amendment

  **To:** Effective Altruism Club Officers & Faculty Advisor  
  **From:** [Your Name], Officer  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Proposed Officer Giving Pledge Requirement  

  ### Recommendation
  **Adopt a modified version of the pledge requirement:** Officers commit to donating **5%** of post-tax income to highly effective charities, with a **formal review and recommitment process every 3 years**, and an explicit **opt-out clause for significant life hardship**. Do not adopt the original proposal (10%, lifetime, no review, no opt-out).

  ### Reasoning: Balancing Principle, Psychology, and Pragmatism
  This recommendation seeks a middle path, acknowledging the powerful moral intuition driving the pledge while seriously addressing the Treasurer's concerns about demandingness, fairness, and the realities of binding young people to lifelong commitments. Here’s the rationale, engaging directly with the philosophical debate:

  1.  **Acknowledging the Core Moral Force (Pro-Pledge Argument):**
      *   The Treasurer rightly identifies the "demandingness objection" as central. However, Kagan’s point about the drowning child is compelling: the moral reason to act doesn't vanish because others fail. The suffering prevented by effective giving is real and urgent *now*, regardless of global compliance levels. A club dedicated to Effective Altruism (EA), especially its leadership, should embody a significant commitment to alleviating that suffering. A pledge signals seriousness and integrity.
      *   **Recommendation Response:** A 5% pledge maintains this core commitment principle. It moves beyond symbolic support to tangible action, aligning officer conduct with club values, while reducing the initial burden.

  2.  **Addressing Demandingness & Fairness (Treasurer's Argument):**
      *   Murphy’s "fair share" argument highlights a crucial concern about the *distribution* of burdens. Imposing the full "ideal" burden on a tiny minority (our 4 officers) because the vast majority contributes little feels intuitively unfair and potentially counterproductive. It risks burnout, resentment, and deterring future leaders – undermining the club's long-term impact and viability.
      *   Wolf’s "moral saints" worry is highly relevant. A lifelong 10% pledge demanded of teenagers risks creating a perception (or reality) that the club requires officers to sacrifice their entire personal conception of the good for morality. This could make the officer role unattractive or psychologically unsustainable for many talented potential leaders.
      *   Scheffler’s "agent-centered prerogative" provides a principled justification for a cap. Morality allows individuals to give *some* non-instrumental weight to their own interests and projects, even when impartial good could theoretically demand more. A lower percentage (like 5%) explicitly acknowledges this prerogative. It recognizes that officers are whole persons, not just instruments of global welfare maximization.
      *   **Recommendation Response:** Reducing the pledge to 5% directly addresses demandingness and incorporates Scheffler's prerogative. It represents a significant sacrifice but avoids the potentially crushing burden of 10%, especially on lower future incomes. The "fair share" concern is mitigated by lowering the individual demand, making it feel less like officers are solely shouldering the world's problems.

  3.  **The Problem of Lifelong Commitment & Changing Circumstances:**
      *   Binding teenagers to *any* specific lifelong financial commitment based on their current understanding and motivation is ethically fraught and practically risky. Life circumstances change dramatically (career paths, family needs, health crises, evolving philosophical views). A rigid, unchangeable pledge ignores this reality and could create significant hardship or force difficult public renunciations later.
      *   **Recommendation Response:** The **3-year review and recommitment process** is essential. It allows officers to:
          *   Reassess their commitment based on current life situation and philosophical perspective.
          *   Adjust the percentage (up or down) within a reasonable range (e.g., 3-10%) if warranted by hardship or increased capacity.
          *   Maintain engagement with EA principles over time.
      *   The **explicit hardship opt-out clause** provides a crucial safety valve for unforeseen, significant difficulties (e.g., serious illness, unemployment, caring for dependents), preventing the pledge from becoming punitive or harmful. This maintains the spirit of compassion central to EA.

  4.  **Pragmatism and Club Health:**
      *   A 10% lifetime pledge with no exit could deter excellent potential future officers, shrinking the leadership pool and harming the club's vitality. A modified pledge lowers this barrier while still attracting those genuinely committed.
      *   The review process fosters ongoing dialogue and education within the leadership team about EA, ethics, and personal commitment, strengthening the club intellectually.
      *   A public 5% pledge with a review mechanism still serves as a powerful example to members and the school community, demonstrating serious commitment without requiring martyrdom. It focuses on *inspiring* widespread giving (hopefully moving towards Murphy's "fair share" world) rather than placing an excessive burden solely on leaders.

  ### Addressing the Philosophical Benchmarks
  *   **Singer's Shallow Pond:** The modified pledge affirms the core intuition – we must act significantly to prevent serious harm when we can do so at relatively small cost. 5% is a meaningful, non-trivial cost representing significant action.
  *   **Murphy's Fair Share:** The lower percentage acknowledges the concern about disproportionate burden. The club's broader mission (inspiring *others* to give) works towards the cooperative ideal Murphy envisions.
  *   **Kagan's Skepticism on Caps:** The commitment remains substantial (5% + review) and doesn't vanish because others fail. It avoids an absolute cap by allowing increases at review.
  *   **Wolf's Moral Saints:** The 5% level + opt-out explicitly avoids demanding officers become "moral saints" who sacrifice all personal pursuits. It allows space for a well-rounded life.
  *   **Scheffler's Agent-Centered Prerogative:** The reduced percentage and opt-out formally recognize the legitimacy of officers giving weight to their own reasonable interests and projects.

  ### Conclusion
  The original 10% lifetime pledge, while well-intentioned, risks being overly demanding, unfair in its distribution of burden, and insensitive to the unpredictable futures of young people. Abandoning any pledge requirement risks undermining the club's core mission and the integrity of its leadership. The modified proposal – a 5% pledge with a 3-year review/recommitment cycle and a hardship opt-out – strikes a principled and practical balance. It demands significant ethical commitment aligned with EA principles, directly addresses concerns about excessive demandingness and fairness through a lower cap and Scheffler's prerogative, incorporates Wolf's warning against sainthood, and respects the fluidity of young adulthood through the review mechanism. This approach best serves the club's long-term health, its ethical aspirations, and the well-being of its student leaders.

  I recommend we adopt this modified pledge structure. I look forward to discussing this recommendation further at Thursday's meeting.
