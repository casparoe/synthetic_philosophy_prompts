prompt: |-
  I'm a philosophy PhD student working in formal epistemology, and I'm currently revising the dissertation chapter that deals with chance-credence norms. Last week I gave a work-in-progress talk on David Lewis's Principal Principle that went worse than I'd hoped: I could state the 1980 principle cleanly enough -- your credence in A, given that the chance of A is x plus whatever else you know that's admissible, should equal x -- and I could gesture at the trouble Lewis got into once he insisted, as a good Humean, that chances themselves supervene on the entire history of the world, future included. But when a committee member pressed me on why this actually breaks the Principle rather than just making objective chance awkward to live with, I realized I'd been reciting vocabulary -- "undermining futures," the "big bad bug," the "New Principle" -- without being able to explain the mechanism to someone who wasn't already sold on it.

  I'd like your help getting a genuinely intuitive, non-formal grip on three things, ideally anchored to a toy example (a repeatedly tossed coin whose bias is fixed by a best-system analysis works fine) rather than a restatement of the machinery. First, why does the mere possibility of futures that would undermine a chance theory generate an actual inconsistency for the original Principal Principle, as opposed to just making present chance hard to know from the inside? Second, in the fix Lewis adopts in "Humean Supervenience Debugged" (1994) -- conditionalizing credence on the whole chance theory T that entails ch(A) = x, rather than on the bare value x -- what exactly is doing the work of blocking the derivation of the bug, and why doesn't the same undermining worry just reappear one level up, aimed at our credence in T itself? Third, I'd value your own assessment: is the New Principle a genuine solution, or does it just relocate the admissibility problem onto the question of which complete theories we could ever be in a position to have non-undermined credence in?
reasoning: |-
  Okay, let's start by understanding the user's situation. They're a philosophy PhD student specializing in formal epistemology, working on chance-credence norms, specifically Lewis's Principal Principle. Their talk didn't go well because they couldn't explain why undermining futures break the original principle beyond just mentioning terms. They need an intuitive explanation without heavy formalism, using a coin toss example.

  First, I need to recall the Principal Principle (PP). The original version says that if you know the chance of A is x and have no other info, your credence in A should be x. But with Humean Supervenience, chances depend on the entire history, including the future. That's where undermining futures come in. For a coin, if the actual bias is 0.5, but a future sequence of tails could make the best system say the bias is lower, that future undermines the current chance. 

  The user's first question is why this possibility causes inconsistency, not just epistemic difficulty. The key is that PP forces you to assign high credence to futures that would make the current chance false. In the coin example, if ch(Heads)=0.5 now, but a long streak of tails later would mean the actual chance wasn't 0.5, PP says your credence in that streak should be high. But that very streak would make ch(Heads)=0.5 false. So PP requires you to believe in futures that contradict the chance you're given, creating a contradiction. 

  Next, Lewis's fix: the New Principle (NP). Instead of conditioning on the chance value alone, you condition on the entire theory T that entails the chances. So you use P(A | T) instead of P(A | ch(A)=x). The user asks why undermining doesn't reappear for credence in T. The answer is that NP decouples the credence from futures that undermine T. When you condition on T, you accept its chances as given, even if they'd be false in some futures. NP essentially says to trust T completely, so undermining futures aren't a problem within that conditional space. But yes, your overall credence in T itself can still be undermined, but that's a separate issue—NP handles conditional credence given T, not belief in T.

  For the third question, the user wants an assessment of NP. It solves the formal inconsistency but shifts the admissibility problem. Now, you need to be certain that T is true, which might not be feasible. Admissibility now applies to which theories you can condition on without undermining worries. In practice, we use partial theories, but that brings back similar issues. NP is a technical fix but doesn't fully resolve the epistemological challenges.

  I should use a coin example throughout. Start with a fair coin, but a long tails streak would make the best system say it's biased. Show how PP forces credence in that streak, causing contradiction. Then for NP, explain that conditioning on T means accepting its chance assignments, so the undermining future isn't relevant. But emphasize that belief in T is still subject to undermining. Finally, evaluate NP as a formal solution that changes the problem to theory selection, but doesn't eliminate the core Humean issue.

  The user's deeper needs: they want a clear, intuitive grasp to explain to non-specialists. They need to move beyond jargon to mechanism. They might also be preparing for dissertation defense, so anticipating committee questions. Highlighting the shift from chance values to theories and the lingering epistemological issues is crucial. They need to demonstrate deep understanding, not just recitation.
answer: |-
  Let's break this down with a coin toss example, focusing on intuition over formalism. Imagine a coin whose *true* bias (if such a thing existed fundamentally) doesn't matter. What matters is the Humean "best system" (BSA) chance derived from its entire history (past *and future*) of outcomes.

  **The Setup:**
  *   We're considering a very long (infinite) sequence of coin tosses: H, T, T, H, T, H, H, ...
  *   The "chance" of Heads on toss 1001, `ch(H_1001) = x`, is fixed by the BSA that best summarizes the *entire* sequence, including tosses *after* 1001. Suppose the actual sequence up to toss 2000 makes the simplest, strongest BSA imply `ch(H) = 0.5`.

  **1. Why Undermining Futures Break the Original PP (The "Big Bad Bug")**

  *   **The Undermining Future:** Consider a *specific* future sequence starting *after* toss 1000: a very long, uninterrupted run of Tails (say, 1 million Tails). Suppose *this specific sequence* would be so extreme that the BSA summarizing the *whole* sequence (including this run) would *not* set `ch(H) = 0.5`, but instead something much lower, say `ch(H) = 0.000001`.
  *   **The Contradiction:** Now, put yourself at time T=1000. You know the *current* chance theory (based on history up to T=1000) says `ch(H_1001) = 0.5`. Crucially, you *also* know that **if** the undermining future (the million Tails run) *were* to happen, then the *true* chance `ch(H_1001)` assigned by the *correct* BSA (the one using the full history) would *not* be 0.5, it would be ~0.000001.
  *   **The PP's Fatal Instruction:** The original Principal Principle (PP) tells you at T=1000: `Cr(H_1001 | ch(H_1001)=0.5 ∧ E) = 0.5`, where `E` is admissible evidence (assumed to include only historical facts and perhaps laws *up to T=1000*). Crucially, `E` *does not* logically contradict the undermining future (the million Tails run). It's physically possible given the laws and history up to T=1000.
  *   **The Trap:** The PP *also* tells you what credence to assign to the undermining future itself. Since the *current* chance theory (at T=1000) says `ch(H) = 0.5` for each toss, it assigns an *extremely low but non-zero* chance to the million Tails run happening. Let's call this undermining future `U`. So, `ch(U)` according to the T=1000 theory is `(0.5)^1,000,000` – tiny, but positive.
  *   **The Inconsistency:** Here's the kicker:
      1.  PP says: `Cr(U | ch(U) = (0.5)^1,000,000 ∧ E) = (0.5)^1,000,000` (You should have a tiny credence in `U`).
      2.  BUT, *if* `U` were to happen, the *true* chance `ch(H_1001)` (set by the full history BSA) would be ~0.000001, *not* 0.5.
      3.  Crucially, `U` happening *entails* that the proposition "`ch(H_1001) = 0.5`" (as stated by the T=1000 theory) is *FALSE*.
      4.  Therefore, by having a non-zero credence in `U` (as PP forces you to), you are having a non-zero credence in a future that *falsifies the very chance proposition you are conditionalizing on* ("`ch(H_1001) = 0.5`").
  *   **Why it's Inconsistency, Not Epistemic Difficulty:** The problem isn't just that `ch(H_1001) = 0.5` *might* be false. The problem is that the PP *forces* you, *based on the truth of `ch(H_1001) = 0.5`*, to assign a credence to `U` that, *if realized*, would make `ch(H_1001) = 0.5` *actually false*. The principle mandates a credence state that is inherently in tension with the truth conditions of the chance proposition it relies on. It's a direct logical conflict within the credence function generated by following the PP.

  **2. Lewis's Fix: The New Principle (NP) - How it Works & Why Undermining Doesn't Reappear (at the same level)**

  *   **The Fix:** The New Principle says: `Cr(A | T ∧ E) = ch_T(A)`. Instead of conditioning on the *specific chance value* ("`ch(H_1001) = 0.5`"), you condition on the *entire chance theory* `T` that entails all the chance facts. `ch_T(A)` is the chance of `A` *according to theory T*.
  *   **What Does the Work?** Conditioning on `T` *settles the entire chance structure*. `T` isn't just a claim about the chance on toss 1001; it's a complete specification of chances for all events, based on the BSA derived from the *whole* history. Crucially, `T` *also entails what the future must be like for `T` itself to be true*. `T` specifies that the entire sequence (past *and future*) has a certain pattern that makes `T` the best system.
  *   **Blocking the Bug (in the toy example):** At T=1000, you conditionalize on `T` (the theory saying `ch(H)=0.5` for all tosses, implying a roughly 50/50 future). The NP says: `Cr(H_1001 | T ∧ E) = ch_T(H_1001) = 0.5`. Now, what about `U` (the million Tails future)? `T` *entails* that `U` *does not happen*. `T` says the future is roughly 50/50. `U` is a future inconsistent with `T`. Therefore, `Cr(U | T ∧ E) = ch_T(U) = (0.5)^1,000,000` **BUT ALSO** `Cr(U | T ∧ E) = 0`, because `T` logically contradicts `U`. This isn't a contradiction; `ch_T(U)` is a *value assigned by `T`*, while conditioning on `T` logically sets the credence in `U` to 0 because `T` rules `U` out. The NP calculation `Cr(U | T ∧ E) = ch_T(U)` still holds formally (`0 = (0.5)^1,000,000`?!) *only* because `T` assigns `ch_T(U)` while simultaneously making `U` impossible. The key is that *within the scope of conditionalizing on `T`*, the undermining future `U` is impossible, so it cannot generate the contradiction. Your credence is hostage to `T`'s complete worldview.
  *   **Why Undermining Doesn't Reappear for Credence *in* `T`:** You've hit the crucial point. The NP *does not* tell you what your *unconditional* credence in `T` should be (`Cr(T)`). Your overall `Cr(T)` *is absolutely vulnerable to undermining*! You might have high `Cr(T)` at T=1000, but if the *actual* future unfolds in an `U`-like way (even if not exactly a million Tails), the *correct* BSA theory `T*` will be different, and your initial `Cr(T)` will have been "undermined" by the evidence. **The NP solves the *conditional* consistency problem:** *Given* you accept `T` as the true chance theory, your credences in specific events `A` are consistently set to `ch_T(A)`. It doesn't magically make `T` certain or immune to falsification by future evidence. The "undermining worry" is relocated from *conditional credences given chances* to the *unconditional credence in the chance theory itself*, which is a separate (and more standard) epistemological issue about theory confirmation. The bug was the *internal* inconsistency of the conditional credence function generated by the PP; the NP removes that internal inconsistency within the conditional space defined by `T`.

  **3. Assessment: Is the New Principle a Genuine Solution?**

  *   **Yes, formally:** It successfully blocks the logical contradiction/improper credence function generated by the original PP under Humean Supervenience. It provides a consistent rule for setting credences *conditional on a complete chance theory `T`*.
  *   **But, it Relocates the Problem (Deeply):** This is the core of your insightful third question. The NP shifts the entire burden onto **admissibility as theory selection and certainty**.
      *   **The Certainty Requirement:** For the NP to give direct guidance, you need to conditionalize on the *true, complete* chance theory `T`. But we are *never* in a position to be certain of `T`! We only have evidence about a finite past and present. Our best theory `T_candidate` is always partial and provisional. The NP doesn't directly tell you what `Cr(A | Current Evidence)` should be.
      *   **Admissibility Reloaded:** Applying the NP in practice requires something like: `Cr(A) = Σ [Cr(T_i) * ch_{T_i}(A)]` over all possible candidate theories `T_i`. But now, what counts as an admissible candidate theory? The old PP's admissibility problems (what historical/nomological info is safe?) resurface as the problem of **which theories `T_i` we should include in the sum and how we weight them (`Cr(T_i)`)**. Crucially, many plausible `T_i` will themselves be *underminable* by futures consistent with our current evidence. Should we exclude them? How? This is the "relocated admissibility problem."
      *   **The Epistemic Gap:** The NP guarantees that *if* you knew `T`, you'd have consistent credences. But bridging the gap between our evidence and `Cr(T)` (or the sum over `T_i`) remains the fundamental epistemological challenge. The NP solves the internal logic of chance-credence coordination but doesn't solve the problem of *knowing* or justifiably believing in chances from a finite, embedded perspective within the Humean mosaic. The "big bad bug" of undermining morphs into the persistent challenge of **theory uncertainty under the threat of future undermining evidence**.
  *   **Conclusion (My Assessment):** The New Principle is a **necessary formal fix** to the logical inconsistency Lewis discovered. It clarifies the *structure* that chance-credence coordination must take under Humean Supervenience. However, it **does not constitute a complete epistemological solution**. It successfully exorcises the "big bad bug" from the conditional credence rule but leaves us with the arguably more profound (and perhaps intractable) problem of justifying our credences *in* chance theories within a Humean framework, where those theories are fundamentally vulnerable to being undermined by the very futures they predict. It replaces a logical inconsistency with a deep epistemic limitation inherent to Humeanism. Whether this is a "genuine solution" depends on whether you prioritize formal consistency or a comprehensive epistemology of chance. Lewis prioritized the former, acknowledging the latter as a persistent difficulty. Your question about relocating the admissibility problem hits the nail on the head.
