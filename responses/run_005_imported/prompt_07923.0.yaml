  Key points: Popper's early critique of natural selection focused on unfalsifiability and the tautology problem (fittest = survivors). His 1970s recantation admitted natural selection is testable but still called it metaphysical. His evolutionary epistemology uses "conjectures and refutations" where theories survive if not falsified.

  Theo's challenge: Isn't "theories surviving because not falsified yet" just like "organisms surviving because fittest," making Popper's epistemology tautological too? The user needs a verdict on whether there's a principled disanalogy.

