answer: |-
  Here’s a rigorous philosophical defense for your character’s dread, structured to meet Parfit’s strongest challenges head-on:

  ### Core Argument: Identity as Non-Fungible Particularity
  The trivial-seeming timing difference **exposes an ontological truth concealed in standard teleportation**: identity is grounded in the *unique particularity* of a conscious substrate, not just psychological patterns. Relation R tracks *similarity*, but identity requires *singular persistence*. The branch-line case makes visible what standard teleportation obscures: the replica is a *different particular* instantiating the same pattern.

  ### Meeting Parfit’s Hardest Challenge: Why Timing Isn’t Trivial
  Parfit is right that Relation R is identical in both cases. The fatal flaw in his argument is **equivocation about "what matters."** Relation R matters for *third-person interests* (e.g., projects continuing, loved ones’ experiences). But for the *first-person perspective*, what matters is not pattern-continuation but *subjective persistence*—the unbroken existence of *this* experiencing self. 

  The timing difference is trivial *only if we reduce identity to psychology*. But if identity requires *numerical identity of the conscious entity*, then the overlap reveals:
  1. **The Distinction Between Type and Token**: Two identical psychological "tokens" can coexist, proving they aren’t the same entity.
  2. **The Reality of Subjective Discontinuity**: At the moment of scanning, *this* subject’s consciousness ends (even if a replica wakes elsewhere). In standard teleportation, the subject never experiences discontinuity. In the branch-line case, the original experiences both the replica’s existence *and* their own impending cessation, proving their non-identity.

  ### Normative Implications: Why Dread is Rational
  1. **The No-Subject Problem**: 
     - When the original dies, *this specific subject of experience* ceases. The replica is a new subject inheriting memories. 
     - **Analogy**: Imagine a candle flame extinguished while an identical new flame is lit elsewhere. The new flame isn’t *this* flame, even if it looks the same. The original flame’s extinction is real loss.

  2. **The Epistemic Gap**: 
     - In standard teleportation, the traveler *cannot* verify if they’re the original or a replica. This creates an illusion of continuity. 
     - The branch-line case **removes this illusion**: the original *knows* they are the discarded particular. Their dread stems from certainty that *their* consciousness ends.

  3. **Moral Patientship Grounded in Particularity**:
     - Rights, duties, and desert attach to *this specific conscious entity*. The replica may inherit obligations, but it doesn’t absolve the original’s death. 
     - **Example**: If the original owes a debt, the replica’s existence doesn’t erase the original’s moral failure upon death—it transfers it.

  ### Rebutting Parfit’s "Trivial Difference" Objection
  - **Seeming Triviality as Illusion**: Standard teleportation feels like survival because destruction/replication is simultaneous. The branch-line exposes this as a *trick of timing*. It doesn’t make identity matter *more*; it reveals identity *always mattered* and was violated in standard teleportation too. The original’s dread is the realization that teleportation was never survival—just undetected replacement.
    
  - **The Burden of Proof**: If Relation R alone mattered, the original should feel *relief* upon seeing the replica. Their existential horror instead proves that subjective persistence is irreducible.

  ### Definite Verdict: Identity is Necessary
  **Relation R is necessary but insufficient for what matters in first-person survival.** Identity—the continuous existence of *this* conscious particular—is the non-negotiable core. The branch-line case doesn’t diminish identity’s importance; it proves that standard teleportation *severs* identity, making replication a form of death. Your character’s dread is the rational response of a conscious particular facing its annihilation, knowing a psychological twin’s existence is irrelevant to *their* cessation.

  ---

  ### Novelistic Application: Key Beats for the Scene
  1. **The Original’s Realization**:  
     *As the scanner’s whine faded, he saw his own face on the destination monitor—alive, bewildered. For a fleeting moment, elation: it worked! Then ice flooded his veins. *That’s not me.* The thought wasn’t philosophical; it was visceral. *I’m still here. Trapped in broken meat while he breathes my air.* The monitor showed "him" weeping with relief. *He thinks he’s me. But he’s not. I’m the one dying.**

  2. **Confronting the Replica**:  
     *The replica pleaded: "We share every memory, every atom! When I wake up, it’ll be your consciousness!" The original touched his chest, fingers coming away bloody. "You’ll *think* it’s continuity. But you’re just... a brilliant counterfeit. I’m the original canvas; you’re the restoration. My death isn’t undone because you exist."*

  3. **The Dread’s Core**:  
     *What terrified him wasn’t oblivion. It was knowing *this*—the raw, singular awareness behind his eyes—would blink out forever. A perfect copy meant nothing. *I am not data. I am this.**

  This approach gives your character a defensible, unhedged position: identity isn’t an abstraction—it’s the bedrock of selfhood, and its loss is irreparable. The replica’s existence is a postscript to his death, not its negation.
