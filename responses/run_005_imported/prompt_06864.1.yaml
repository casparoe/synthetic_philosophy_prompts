  First, I need to break down Descartes' stance. He distinguishes between sensations (like feeling cold) and pure intellect (like the cogito). Sensations are confused and not certain, so maybe Descartes would agree they aren't luminous. But the cogito is different—it's immediate and indubitable. Williamson's margin-for-error might not apply here because there's no continuum between existing and not existing. 

