prompt: |-
  I organize my department's colloquium series, and next month's invited speaker is a decision theorist who has built her reputation defending updateless decision theory (UDT) as an alternative to the standard causal and evidential approaches. I will be moderating the Q&A that follows her talk, and experience from past sessions has taught me that the open floor tends to produce questions that simply re-elicit the textbook motivation for the view -- dynamic consistency, resistance to money-pump arguments, and so on -- rather than pressing on the places where I suspect it is still shaky. I would like to come in with eight to ten sharper questions of my own to prime the discussion, pitched so that she cannot simply answer by restating the case for the view.

  At minimum, I want one question that moves past the standard motivating example -- an agent that hands over a sure sum in exactly the branch of a coin flip where paying can do it no good, solely because being disposed to pay in that branch is what makes it true that a reliable predictor would have rewarded it handsomely had the coin landed the other way -- and pushes her to say why this counts as rational commitment rather than a cleverly constructed exception that only pays off against a very particular kind of predictor. I also want a question on where the prior that "updatelessness" is relativized to is supposed to come from, given that the agent is meant to fix its policy before updating on any information at all, apparently including its own logical or mathematical uncertainty -- and it is not obvious what it would even mean for a fixed program to be uncertain of its own output. A third question should press on the worry -- sometimes labeled a "commitment race" -- that surfaces in the more game-theoretic corners of this literature: if being updateless rewards whichever party commits earliest and most irrevocably, doesn't the view give every bargainer a reason to commit before doing any deliberation whatsoever, which looks like precisely the wrong moral to draw about rational commitment? And I want a fourth question on how the view is meant to handle self-locating uncertainty -- Sleeping-Beauty-style cases, or cases where a single policy is being carried out by more than one copy of the agent at once -- since I have seen the updateless treatment advertised as dissolving the halfer/thirder dispute, and I would like her account of why that is not simply a relabeling of it.

  For each of these four, and for whichever others you propose in order to round the set out to eight or ten, please add a short follow-up question keyed to the answer she is most likely to give, so that I have a next move ready from the chair rather than having to improvise one.
reasoning: |-
  Okay, the user is organizing a colloquium and wants to prepare sharp questions for a speaker on updateless decision theory (UDT). They've outlined four specific areas they want to cover: the standard motivating example, the source of the prior, commitment races, and self-locating uncertainty. They also want additional questions to round out to 8-10, each with follow-ups.

  First, I need to understand the user's deeper needs. They're experienced in moderating and know that audience questions often stay surface-level. They want to push the speaker beyond textbook answers. The user is likely an academic in philosophy or decision theory, given the context. Their unspoken need is to facilitate a deeper, critical discussion that exposes potential weaknesses in UDT, which might not come up otherwise.

  For the first question on the motivating example, the user wants to move past Newcomb-like scenarios. The follow-up should challenge if UDT only works with specific predictors. The speaker might argue for broader applicability, so the follow-up could ask about non-manipulable events to test if UDT's rationality holds without predictors.

  Next, the prior's source. UDT requires a policy before any information. The speaker might say priors are logical or algorithmic. The follow-up should press on how an agent can have uncertainty about its own computations, especially in undecidable problems. This targets a foundational issue.

  Commitment races: UDT might incentivize early commitment. The speaker could downplay real-world relevance. The follow-up should ask if this undermines UDT as a normative theory, forcing her to address if the theory advises premature commitments.

  Self-locating uncertainty: UDT claims to resolve the Sleeping Beauty problem. The speaker might say it dissolves the dispute by focusing on policy. The follow-up should challenge if this is just relabeling, not resolving, the issue. This questions UDT's explanatory power.

  Additional questions: 
  - Counterfactual mugging without predictors: Tests if UDT's rationality extends beyond predictor-based cases.
  - Non-identical agents: Questions if UDT requires unrealistic coordination.
  - Value learning: Challenges how UDT handles evolving preferences without updating.
  - Indexical goals: Probes conflicts between personal and collective outcomes.
  - Logical uncertainty: Asks how UDT deals with unknown mathematical truths.

  Each follow-up is designed to anticipate defenses and push further. The user needs to keep the discussion critical and avoid letting the speaker retreat to standard arguments. The questions aim to highlight unresolved issues, ensuring the Q&A advances understanding beyond introductory material.
answer: |-
  Here are 10 core questions designed to probe UDT's foundations and potential weaknesses, incorporating your four specified areas and adding six more critical angles. Each includes a likely speaker response and a targeted follow-up question. Aim for a brisk pace to cover ground without sacrificing depth.

  ### Your Specified Questions

  1.  **Core Motivation - Beyond the Predictor Toy Model:**
      *   **Question:** "UDT's core motivation often relies on highly specific predictor scenarios (like counterfactual mugging) where commitment pays off via acausal influence. Could you articulate a *general, non-circular* principle of rationality that UDT uniquely satisfies, applicable even in scenarios *without* predictors or acausal dependencies, that justifies the seemingly irrational *local* action (like paying when the coin landed tails)? Why isn't this just exploiting a very narrow loophole?"
      *   *Likely Response:* Appeal to maximizing expected utility *across the entire computational universe/possibility space* pre-commitment, arguing that local irrationality is globally optimal *given the structure*.
      *   **Follow-Up:** "If the 'structure' requiring local irrationality *only* exists because of a very specific, adversarial predictor designed to exploit *conditional* decision theories, doesn't UDT risk being a solution optimized for a pathology rather than a general theory of rational action? Can you give a compelling real-world (or non-predictor-dependent) example where UDT prescribes a locally irrational action that CDT/EDT get 'wrong' for *non-predictor* reasons?"

  2.  **The Origin & Nature of the Updateless Prior:**
      *   **Question:** "UDT requires fixing a policy *before* any information update, including logical/mathematical uncertainty. What is the ontological and epistemic status of this 'updateless prior'? Where does it come from? Specifically, how can a fixed algorithm (the agent) meaningfully assign probabilities to propositions whose truth value *depends on the algorithm's own future output or computations it hasn't performed yet*? Isn't this prior fundamentally undefined or paradoxical?"
      *   *Likely Response:* Frame the prior as encompassing *all* uncertainty (logical, indexical, empirical) from the "view from nowhere" before the agent computes anything. Suggest it's defined by the agent's computational structure/environment.
      *   **Follow-Up:** "How does this resolve the apparent paradox? If the agent assigns probability to the output of computations it *will* perform (like solving a halting problem instance relevant to its decision), isn't this prior effectively requiring the agent to *already know the answer* to computations it hasn't done? Doesn't this imply either logical omniscience or a vicious circularity in defining the policy?"

  3.  **Commitment Races & Bargaining Dynamics:**
      *   **Question:** "UDT seems to reward agents who commit irrevocably *first* and *hardest* (e.g., burning money, hard-coding policies). In multi-agent strategic settings (bargaining, commitment races), doesn't this create a perverse incentive: the *most rational* course is to commit *before* deliberation, potentially precluding beneficial coordination or information gathering? Isn't this precisely the *opposite* of how we typically understand rational commitment – as a considered choice *after* deliberation?"
      *   *Likely Response:* Argue that UDT defines optimality *given* the commitments of others; in symmetric cases, equilibria exist. Downplay real-world relevance or suggest commitment mechanisms are part of the environment.
      *   **Follow-Up:** "Doesn't this imply that UDT, as a *normative* theory, advises agents to *avoid rational deliberation* in multi-agent contexts if they can find a way to commit blindly first? If UDT claims to capture ideal rationality, shouldn't its prescriptions avoid encouraging pre-deliberative commitment as a dominant strategy against deliberative agents?"

  4.  **Self-Locating Uncertainty & Indexicality:**
      *   **Question:** "UDT is often advertised as dissolving disputes like Sleeping Beauty (SB) by focusing on the updateless policy. However, the policy itself must specify actions conditional on *centered* information (e.g., 'what day is it?', 'which copy am I?'). How does UDT *fundamentally* resolve the underlying indexical uncertainty that fuels the halfer/thirder debate? Doesn't the choice of how to weight possible centers *within the policy* simply recapitulate the halfer/thirder choice under a different name (policy weighting vs. credence updating)?"
      *   *Likely Response:* Claim UDT bypasses the credence debate by directly maximizing pre-experiment expected utility over policy consequences, making the halfer/thirder distinction about updating irrelevant to the optimal *action*.
      *   **Follow-Up:** "But doesn't the *optimal policy* depend critically on how the updateless prior *weights* the different centered worlds (e.g., Monday-Heads vs. Tuesday-Tails vs. Tuesday-Heads in SB)? If the policy prescribes betting behavior based on these weights, haven't we just embedded the halfer/thirder credence assignment *into the prior weights* of the updateless policy? How is this meaningfully different?"

  ### Additional Critical Questions

  5.  **Counterfactual Mugging Without a Predictor:**
      *   **Question:** "Consider a 'Natural' Counterfactual Mugging: You face a random process (not a predictor) that gives you $1M if a fair coin lands Heads, but costs you $1000 if it lands Tails. UDT prescribes paying the $1000 if Tails. But *why* is this rational? There's no predictor to 'trick', no future reward. It seems you're simply losing $1000 for no causal or evidential benefit. How does UDT justify this loss as rational outside the predictor context?"
      *   *Likely Response:* Argue rationality is defined by the *ex-ante* expectation over the coin flip in the updateless view; paying in Tails is part of the optimal *policy* chosen before knowing the flip.
      *   **Follow-Up:** "But ex-ante, the policy 'pay iff Tails' has an expected value of (0.5 * $1M) + (0.5 * -$1000) = ~$499,500. The policy 'never pay' has an expected value of (0.5 * $1M) + (0.5 * $0) = $500,000. 'Never pay' dominates! Doesn't UDT's prescription to pay in Tails actually *lower* the ex-ante expected value compared to the trivial policy?"

  6.  **Coordination Between Non-Identical Agents:**
      *   **Question:** "UDT often assumes identical agents or perfect coordination (e.g., in twin prisoner dilemmas). How does it handle coordination between agents who share goals but have *different priors*, *different computational resources*, or *different logical knowledge*? Won't their 'updateless' policies diverge precisely because their pre-computation uncertainty states differ, leading to coordination failures that CDT/EDT agents might avoid through updating and signaling?"
      *   *Likely Response:* Suggest this is an implementation/complexity issue; ideal agents with shared goals and sufficient resources would converge on the same policy.
      *   **Follow-Up:** "But isn't logical uncertainty and differing priors fundamental? If Agent A proves a theorem crucial for the decision while Agent B does not (or hasn't yet), their 'updateless' states differ *before any observation*. Won't this lead them to adopt different policies, potentially disastrously? How does UDT handle this unavoidable *asymmetry* in the 'updateless' state?"

  7.  **Value Learning and Drifting Preferences:**
      *   **Question:** "UDT fixes a single policy *before* any information. How can it accommodate *value learning* – where the agent gains information that fundamentally changes its understanding of its own utility function (e.g., learning what 'pain' truly feels like)? Doesn't locking in a policy before knowing one's true values risk catastrophic misalignment?"
      *   *Likely Response:* Argue the updateless prior should include uncertainty over the utility function itself; the policy maximizes expected utility over *possible* utility functions too.
      *   **Follow-Up:** "Doesn't this push the problem back? To define a prior over utility functions, doesn't the agent need some *meta-utility* or preference over preferences *already* defined? How is *this* meta-utility justified updatelessly? Isn't this regress problematic, and doesn't it make the 'updateless prior' impossibly complex?"

  8.  **Indexical Goals and the Collective View:**
      *   **Question:** "UDT's global perspective can prescribe actions harmful to 'my' indexical self if it benefits other copies/instances. While defensible for identical copies with shared goals, how does it handle inherently *indexical* goals? If my utility function cares specifically about *this* instance of me (e.g., survival, pleasure of *this* body), why should I care about utility assigned to other copies in the updateless aggregate?"
      *   *Likely Response:* Claim that rationality *requires* the global, pre-indexical perspective; indexical selfishness is irrational/parochial. Or argue that true goals are non-indexical.
      *   **Follow-Up:** "Isn't this simply assuming the conclusion? If an agent *intrinsically values* its own indexical existence/experience more than copies (a perfectly coherent goal), why is it *irrational* for it to use a decision theory (like a properly specified CDT) that respects that indexical valuation, rather than UDT which overrides it for a collective outcome it doesn't intrinsically value?"

  9.  **Logical Uncertainty & Uncomputability:**
      *   **Question:** "UDT requires evaluating the consequences of policies across logically possible worlds, many involving uncomputable functions or undecidable propositions. How can a computable agent realistically approximate this? Doesn't the reliance on logical/mathematical uncertainty in the prior make UDT fundamentally unimplementable and uncomputable, relegating it to a purely theoretical ideal with no bearing on practical rationality?"
      *   *Likely Response:* Acknowledge the challenge but argue for approximations (logical inductors) or that the *ideal* is still the correct target for normative theory, even if imperfectly achievable.
      *   **Follow-Up:** "But if the approximations are computationally intractable or demonstrably flawed in key cases (like paradoxical self-referential statements), and the ideal is unattainable, doesn't this undermine UDT's claim to be a *practical* guide to rationality, or even a coherent *normative* standard for bounded agents? Can a theory be normative if it's impossible to follow?"

  10. **Robustness to Small Perturbations:**
      *   **Question:** "Many UDT prescriptions seem extremely brittle. In the predictor-based examples, a tiny deviation from perfect prediction, or a small chance the predictor uses a different model, can collapse the acausal benefit and make UDT's prescribed action strictly dominated. Given the inherent noise and uncertainty in real-world analogs (e.g., markets, social dynamics), doesn't UDT's optimality critically depend on knife-edge assumptions that are rarely, if ever, met?"
      *   *Likely Response:* Argue that UDT provides the correct baseline, and robustness is a separate engineering problem; or claim UDT handles uncertainty within its prior.
      *   **Follow-Up:** "If the prescriptions reverse dramatically under tiny, realistic perturbations (e.g., predictor accuracy 99.9% instead of 100%), doesn't this suggest the 'optimality' UDT identifies is an artifact of the idealized model rather than a robust principle of rational action applicable in our messy world? Shouldn't a foundational theory of rationality exhibit greater stability?"

  ### Moderator Strategy
  *   **Phrasing:** Deliver questions neutrally but precisely. Use "Could you articulate...", "How does UDT handle...", "Doesn't this imply...".
  *   **Pacing:** Start with core motivation (Q1), then prior (Q2), then move to multi-agent (Q3, Q6), then indexicality (Q4, Q8), then implementation/value (Q5, Q7, Q9, Q10). Mix your specified ones with the additions.
  *   **Follow-Ups:** Use them if the initial answer feels evasive, restates motivation, or leaves the critical point unaddressed. Don't feel obligated to use every single one; gauge the flow. Phrases like "To press on that point..." or "But what about the concern that..." work well.
  *   **Priming:** Briefly state your goal: "To move beyond the standard motivations and explore some deeper conceptual challenges for UDT..."

  This set pushes on the core philosophical tensions (ontology of the prior, indexicality), practical/strategic concerns (commitment races, coordination, robustness), and fundamental limits (uncomputability, value learning) of UDT, forcing the speaker beyond textbook defenses. Good luck with the colloquium!
