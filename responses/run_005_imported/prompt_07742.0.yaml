answer: |-
  Ah, the classic 3-hour free will spiral! Galen Strawson's "Basic Argument" is notoriously mind-bending precisely because it tries to sidestep the determinism/indeterminism debate. Your instinct ("isn't that just determinism?") is common, but your friend is right – Strawson's core claim is that **moral responsibility is impossible *regardless* of whether the universe is deterministic or indeterministic.**

  Here's a breakdown of the actual logic, why randomness doesn't help, and what *is* doing the work:

  **The Core of Strawson's "Basic Argument" (Simplified):**

  1.  **Premise 1 (Responsibility Requires Ultimate Origination):** For you to be *truly morally responsible* for an action (A) you perform, *you* must be the *ultimate originator* or *source* of that action. This means the reasons, desires, character traits, and motivations that led to A must ultimately be "up to you" in a very deep sense.
  2.  **Premise 2 (Ultimate Origination Requires Self-Creation):** To be the ultimate originator of A, you must also be the ultimate originator of the "you" that chose A. The specific mental setup (your character, values, preferences, etc.) that caused you to do A must itself be something *you* are responsible for creating or choosing.
  3.  **Premise 3 (Self-Creation is Impossible):** You cannot be ultimately responsible for creating or choosing your own initial mental setup (your initial "nature and nurture").
      *   **Why?** To "create" or "choose" your initial setup, you would already need to *have* some preferences, reasons, values, or decision-making apparatus *in place* to make that creation/choice. But those very preferences/reasons/apparatus are *part* of the initial setup you're supposedly creating! It's logically impossible to be prior to yourself.
      *   **Analogy:** You can't design your own brain from scratch because you'd need a brain (with design preferences!) to do the designing. The designer *is* the thing being designed.
  4.  **Premise 4 (The Regress Problem):** If you try to argue that you *shaped* your character later through earlier choices (B, C, D), then the same problem applies to those earlier choices: You must have been responsible for the "you" that made *those* choices. This creates an infinite regress.
  5.  **Conclusion (No Moral Responsibility):** Since you cannot be the ultimate originator of the "you" that acts (whether deterministically or indeterministically), you cannot be truly morally responsible for any of your actions.

  **Why Determinism vs. Indeterminism Doesn't Matter:**

  1.  **The Problem Persists Under Determinism:**
      *   If determinism is true, your actions (A) are the inevitable result of prior causes (genetics, environment, prior brain states).
      *   These prior causes ultimately trace back to factors *before* you existed or had any control (your birth, your upbringing, the Big Bang).
      *   Therefore, the "you" that acts is shaped entirely by factors outside your ultimate control. You didn't *originate* your character; it was *given* to you. Strawson says this lack of ultimate origination kills responsibility.

  2.  **The Problem Persists Under Indeterminism (Why Randomness Doesn't Help):**
      *   Suppose indeterminism is true. Random quantum events, or genuine chance, play a role in how your brain developed or how specific decisions unfold.
      *   **The Critical Point:** *Randomness does not equal control or origination.*
          *   **Scenario 1 (Randomness in Development):** If a random mutation or chaotic event influenced how your brain developed, shaping your character, that randomness wasn't *chosen* or *controlled* by you. It just *happened to you*. You are still not the *source* of the character it produced.
          *   **Scenario 2 (Randomness in Decision):** If a genuinely random event occurs *during* a decision (e.g., a quantum fluctuation causes neuron X to fire instead of neuron Y, leading you to choose chocolate over vanilla), **how does that make you responsible?**
              *   The randomness isn't *you*. It's an *external* intrusion into the decision process.
              *   It doesn't reflect *your* reasons, *your* character, or *your* control. It's just noise.
              *   **Responsibility requires authorship, not accident.** If the outcome is partly random, it's *less* attributable to *you*, not more. It introduces luck, not control.
      *   **The Buck Still Doesn't Stop With You:** Under indeterminism, the chain of causation leading to "you" might involve random breaks, but those breaks don't magically place *you* as the ultimate originator. The random events happened *to* the system that became "you," or *interfere with* the decision-making of the "you" that exists. You still didn't create the initial setup or control the randomness. The ultimate source of your character and actions is still *outside* of you – it's now a combination of prior causes *and* random chance, neither of which *you* authored.

  **What's Doing the Work (It's NOT Determinism):**

  The heavy lifting is done by **Premises 1 and 2 combined with the logical impossibility in Premise 3:**

  1.  **The Ultimacy Requirement:** Strawson argues that *true* moral responsibility demands an incredibly strong form of control: being the *ultimate, uncaused cause* of your actions, which requires being the *ultimate, uncaused cause* of yourself. This is a much higher bar than just "could have done otherwise" (which indeterminism *might* allow).
  2.  **The Impossibility of Self-Causation:** The core insight is that this kind of ultimate self-origination is **logically impossible.** You cannot be prior to yourself. You cannot bootstrap yourself into existence *with* a specific nature *by* using that very nature. It's a vicious circle or an infinite regress.
  3.  **The Regress:** Any attempt to locate responsibility in a *later* act of self-shaping just pushes the problem back one step: what shaped the "you" that did *that* shaping? Eventually, you hit the initial conditions that made you *you*, which you didn't control.

  **In Essence:**

  *   **Determinism:** Shows your actions are *inevitable* given prior causes you didn't control. (Problem: Lack of control/alternatives).
  *   **Strawson's Argument:** Shows that *even if* your actions aren't inevitable (indeterminism), you *still* aren't the *ultimate source* or *author* of the "you" that acts. The "you" that acts, whether formed deterministically *or* indeterministically, is fundamentally a product of factors that were not ultimately *up to you*. Responsibility requires being the "unmoved mover" of yourself, which is impossible.

  **Why it feels like "determinism dressed up":** Because determinism *also* concludes "no responsibility" due to lack of ultimate control. Strawson arrives at the same conclusion ("no responsibility") via a different, more fundamental route (impossibility of self-origination), which he argues **entails** that responsibility is impossible *even if determinism is false*. He's trying to block the main escape route (indeterminism) that people use to try to save responsibility from determinism.

  It's a deeply counter-intuitive argument. It doesn't mean we abandon concepts like praise, blame, laws, or consequences (Strawson acknowledges we need these practically). It just claims that *deep, ultimate, desert-based moral responsibility* – the kind that says you *truly, fundamentally deserve* praise/blame in a cosmic sense because *you* were the ultimate author – is logically incoherent. You were always, ultimately, "stuffed either way." Welcome to the frustratingly fascinating world of free will debates!
