  Below is a draft recommendation for your maintainer call. I've structured it to address the core concerns of both camps, emphasizing neutrality and practical impact, with specific reasoning to resonate with the anti-choice faction. The focus is on **transparency**, **downstream compatibility**, and **long-term ecosystem health**.

  ---

  **Subject: Recommendation on Axiom of Choice (AC) Integration Strategy**  

  ### **Background**  
  The PR introducing theorems requiring AC (e.g., existence of bases for vector spaces, Tychonoff's theorem) highlights a foundational question: how to reconcile classical mathematics with computability/constructivity in our library. Adopting AC globally risks silently "infecting" non-AC proofs with noncomputability, while rejecting it limits key results. Both concerns are valid:  
  - **Pro-AC**: Necessary for mainstream algebra/analysis. Blocking AC alienates classical mathematicians.  
  - **Anti-AC**: Global AC sabotages constructive users (e.g., code extraction, type theory applications) and violates user trust via hidden dependencies.  

  ### **Options Analysis**  
  We have three viable paths:  

  1. **🔗 Adopt AC Globally**  
     - **Pros**: Simplifies classical formalization; mirrors standard math practice.  
     - **Cons**:   
       - **Noncomputability leaks everywhere**: Any proof depending (even indirectly) on an AC theorem becomes noncomputable. This breaks extraction of executable code from *seemingly constructive* parts of the library.  
       - **Violates downstream consent**: Constructive users (e.g., in CS or proof theory) implicitly "inherit" AC without warning, undermining their workflow.  
       - **Irreversible**: Once merged, AC's effects proliferate; retroactive cleanup is near-impossible.  

  2. **🏷️ Opt-in Tagging per Theorem**  
     - **Pros**:  
       - **Precision**: AC usage is explicit. Theorems like `exists_basis` carry a `[uses_choice]` tag (or `noncomputable` in Lean).  
       - **Preserves computability**: Untagged theorems remain constructive/executable. Downstream users opt *into* AC only when needed.  
       - **Tooling-friendly**: Linters can enforce tagging and block accidental AC leakage.  
     - **Cons**:  
       - **Moderate overhead**: Contributors must tag AC-dependent theorems and avoid AC in "vanilla" proofs.  
       - **Not foolproof**: Misattribution is possible (but mitigatable via code review + automation).  

  3. **🌱 Fork a Constructive-Only Library**  
     - **Pros**: Clean separation; constructive users get guaranteed AC-free core.  
     - **Cons**:  
       - **Duplication**: Doubles maintenance effort (e.g., two versions of algebra/analysis).  
       - **Fragmentation**: Splits community and dilutes contributions.  
       - **Delays progress**: Forces re-proving AC-free analogs of classical results.  

  ### **Recommendation: Opt-in Tagging per Theorem**  
  **Adopt explicit tagging (Option 2)**, *not* global AC or a fork. This balances both camps:  

  #### **Why This Addresses Anti-Choice Concerns**  
  1. **No stealth noncomputability**:  
     - Constructive users retain a *trusted base*: if they avoid `[uses_choice]` theorems, their proofs remain executable.  
     - Global AC makes *every* proof potentially noncomputable (via transitive dependencies). Tagging localizes risk.  
  2. **User autonomy**:  
     - Downstream projects (e.g., program extraction, constructive analysis) can enforce AC-free builds by blocking tagged theorems.  
  3. **Future-proofs the library**:  
     - Preserves compatibility with emerging ecosystems (e.g., proof assistants prioritizing computability like Lean, Coq, or Agda).  
  4. **Minimal disruption**:  
     - Classical users still access AC theorems—just with explicit tags. This mirrors mathlib’s approach, where `Classical.choice` is allowed but localized.  

  #### **Why Not Global AC?**  
  - *"Choice is standard" isn’t sufficient*: Unlike set theory, formal libraries serve dual audiences (classical + constructive). Forcing AC on all users ignores our responsibility to downstream tooling.  
  - **Nuclear option**: Global AC surrenders our ability to guarantee computability anywhere—a unique value of formalized math.  

  #### **Why Not a Fork?**  
  - Forks fracture communities and increase long-term maintenance. Tagging is less drastic and achieves similar goals.  

  ### **Implementation Plan**  
  1. **Tagging protocol**:  
     - Mark all AC-dependent theorems/dependencies with `[noncomputable]` and a custom attribute (e.g., `[uses_axiom choice]`).  
     - Use CI linters to flag untagged AC usage (e.g., via Lean’s `#print axioms` or equivalent).  
  2. **Documentation**:  
     - Add a "Foundations" guide explaining how to avoid AC for constructive users.  
  3. **Gradual rollout**:  
     - Require tagging for new AC-using PRs; retroactively tag existing theorems incrementally.  

  ### **Vote Considerations**  
  - **Goal**: Preserve the library’s versatility for *all* users—without silently sacrificing computability.  
  - **Compromise**: Tagging respects classical mathematics’ needs while honoring constructive constraints.  

  This approach positions us as a leader in *inclusive formalization*—where classical and constructive math coexist transparently.  

  ---  

  **Key phrases to resonate with anti-choice camp**:  
  - "No stealth noncomputability," "user autonomy," "trusted base," "no inherited dependencies," "localize risk," "preserve executable core."  
  - Avoids dismissive language (e.g., "just deal with it") by focusing on *practical downstream impact*.  

  This draft balances technical rigor with empathy for both sides. Tailor the CI/tooling examples to your library’s infrastructure before circulating.
