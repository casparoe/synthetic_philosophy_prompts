prompt: |-
  I help maintain an open source formalized-math library, kind of like Lean's mathlib. Someone's PR adds a bunch of genuinely useful theorems -- every vector space has a basis, Tychonoff's theorem, existence of a non-measurable set -- that all depend on the axiom of choice, and proposes we just declare `choice` a blanket axiom for the whole library instead of tagging it per theorem. Half the maintainers are upset, since that quietly makes huge parts of the library noncomputable (no more extracting actual running code from those proofs) and smuggles choice into lemmas that constructive-math users downstream never opted into. The other half say refusing choice means we can't formalize most of real analysis or algebra, making the library useless for that. We vote at next weeks maintainer call and I have to circulate a recommendation first -- can you draft it? I need an actual call (adopt globally, opt-in tagging per theorem, or fork a seperate constructive-only library), with reasoning that would actually land with the anti-choice camp and not just 'choice is standard, deal with it.'
reasoning: |-
  We are facing a significant decision regarding the use of the Axiom of Choice (AC) in our formalized mathematics library. The proposal is to globally adopt AC as an axiom for the entire library, which would simplify the addition of theorems that depend on it (such as every vector space having a basis, Tychonoff's theorem, and the existence of a non-measurable set). However, this approach has substantial implications for the computability and constructive foundations of our library.

  I propose that we consider three options:

  1. **Adopt AC globally**: Make the Axiom of Choice a global axiom for the entire library.
  2. **Opt-in tagging per theorem**: Require that each theorem depending on AC be explicitly tagged, and avoid using AC in theorems that do not explicitly require it.
  3. **Fork a separate constructive-only library**: Maintain two versions of the library: one that allows AC (and other non-constructive principles) and one that is strictly constructive.

  Below, I outline the reasoning for each option, with particular attention to the concerns of the anti-choice camp (who are concerned about computability and constructive mathematics).

  ### Option 1: Adopt AC globally
  **Pros**:
  - **Simplicity**: We avoid the need to tag every theorem that uses AC. This reduces the maintenance burden and the chance of missing a dependency.
  - **Standard in classical mathematics**: Most of real analysis and algebra relies on AC. Without it, we cannot formalize many fundamental results, which might limit the library's appeal to mathematicians in these fields.

  **Cons**:
  - **Loss of computability**: Any theorem that depends (even indirectly) on AC becomes noncomputable. This means we cannot extract running code from proofs that use these theorems, which is a critical feature for some users.
  - **Violation of constructive principles**: Downstream users who rely on constructive mathematics (e.g., for program extraction, or for use in intuitionistic systems) would be forced to accept AC even when they do not want it. This could break their code or make the library unusable for them.
  - **Silent assumptions**: AC would be present in the background of many lemmas, making it difficult to track and control its use.

  ### Option 2: Opt-in tagging per theorem
  **Pros**:
  - **Transparency and control**: Each theorem that uses AC is explicitly marked. This allows users who care about computability to avoid these theorems and rely only on the constructive parts of the library.
  - **Preserves constructive core**: The library remains constructive by default. Only when explicitly needed (and tagged) is AC used. This respects the needs of constructive mathematicians and users who require code extraction.
  - **Flexibility**: We can still have all the theorems that require AC, but they are clearly identified. This approach is taken by some other formal math libraries (like Lean's mathlib) where AC is introduced as a local axiom when needed.

  **Cons**:
  - **Maintenance overhead**: We must carefully track and tag every use of AC. This might require additional work and discipline from contributors and maintainers.
  - **Potential for leakage**: There is a risk that AC might be used in a proof of a lemma that is then used in a theorem that is supposed to be constructive. Careful design and tooling (like linters) are needed to prevent this.

  ### Option 3: Fork a separate constructive-only library
  **Pros**:
  - **Clear separation**: The constructive library remains entirely free of AC and other non-constructive axioms. Users who require computability can use this version without any fear of non-constructive contamination.
  - **Independent development**: The two libraries can evolve independently, with the classical one being able to freely use AC and the constructive one focusing on algorithms and effective mathematics.

  **Cons**:
  - **Duplication of effort**: Many theorems would have to be maintained (and possibly proved) in both libraries. This could lead to significant extra work and potential for divergence.
  - **Community split**: The user base and contributor community might be divided, which could harm the overall project.

  ### Recommendation
  I recommend **Option 2: Opt-in tagging per theorem**. This approach strikes a balance between the needs of classical mathematics and constructive users. It allows us to have the powerful theorems that depend on AC while being transparent about their use and preserving the constructive core for those who need it.

  **Reasoning for the anti-choice camp**:
  - **Preservation of computability**: By tagging AC usage, we ensure that the majority of the library remains constructive and computable. This is essential for users who rely on code extraction and for the growing community of constructive mathematics.
  - **Avoids silent non-computability**: The tagging system acts as a warning. Users can avoid the tagged theorems and their dependencies if they wish to keep their developments constructive.
  - **Tooling support**: We can develop linters and other tools to help ensure that AC does not leak into untagged theorems. This is a manageable engineering challenge and is already done successfully in other projects (like Lean).
  - **Respect for diverse foundations**: Our library serves a wide audience. Forcing AC globally would alienate the constructive community, but refusing AC entirely would alienate classical mathematicians. Tagging per theorem respects both groups.

  **Addressing concerns about formalization of classical mathematics**:
  With tagging, we can still formalize all the desired classical theorems. The only difference is that they will be clearly marked. This is a common practice in many proof assistants (Coq, Agda, etc.) and has proven workable.

  ### Next Steps
  I propose that we:
  1. Adopt a policy of tagging every theorem that depends on AC (or other non-constructive axioms) with a `[noncomputable]` tag (or similar) and possibly a more specific `[uses choice]` tag for clarity.
  2. Invest in tooling (linters) to help detect when AC is used in a theorem and ensure it is tagged.
  3. Document our decision clearly for contributors and users.

  This approach respects both the classical and constructive users and maintains the library's versatility.

  I look forward to discussing this in the maintainer call.
