prompt: |-
  Trolley-problem threads on rationalist blogs and forums almost always invoke the doctrine of double effect via its tidy modern packaging: an act with a foreseen bad side effect is permissible provided the act itself isn't wrong, only the good effect is intended, the bad effect isn't the means to the good one, and there's proportionality between the two (essentially Joseph Mangan's 1949 four-condition formulation). That whole apparatus traces back to a single article in which Aquinas argues for the permissibility of killing in self-defense, so I went and read it directly: Summa Theologiae, II-II, Q. 64, Art. 7, "Whether it is lawful to kill a man in self-defense?" (1920 Fathers of the English Dominican Province translation). The article has the usual scholastic form of objections, a counter-citation, and replies to each objection; here is just Aquinas's own response, the "I answer that":

  > Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental. Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in "being," as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end. Wherefore if a man, in self-defense, uses more than necessary violence, it will be unlawful: whereas if he repel force with moderation his defense will be lawful, because according to the jurists, "it is lawful to repel force by force, provided one does not exceed the limits of a blameless defense." Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good, it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good, as in the case of a soldier fighting against the foe, and in the minister of the judge struggling with robbers, although even these sin if they be moved by private animosity.

  Popular treatments quote up through "his defense will be lawful" and stop there, which is also the point at which the passage most cleanly supports the modern four-condition schema. But the remainder seems to be doing something more specific: it looks like Aquinas is saying that intending to kill the aggressor is permissible only for someone acting under public authority, and that an ordinary private individual acting in self-defense may only ever intend self-preservation, with the aggressor's death falling beside that intention rather than within it. Am I reading that correctly? And if so, does this passage actually support the general-purpose doctrine usually attributed to it, or only a much narrower claim about whose intentions to kill are permissible, with ordinary private self-defense justified in a way that doesn't generalize to other double-effect cases at all?
