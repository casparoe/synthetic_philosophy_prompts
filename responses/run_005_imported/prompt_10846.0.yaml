prompt: |-
  I co-run a decision theory podcast with a couple people from my program, and next weeks guest defends resolute choice as the answer to Parfit's hitchhiker. Her go-to move whenever someone objects that you have zero incentive to actually pay the driver once you're safe in town is 'if your decision theory tells you to die of thirst, thats a refutation of the theory, not a fact about rationality.' Draft me 6-8 questions that make that move progressively harder to use. I want one where she has to explain how this differs from Kavka's toxin case, where you never actually have to drink the stuff, and one on what happens once the driver's lie detector is only 95% reliable instead of perfect -- each with a follow-up keyed to her likely answer. End on a question about what a losing case would have to look like before she'd admit causal decision theory was right all along.
reasoning: |-
  Okay, the user runs a decision theory podcast and needs help challenging a guest who defends resolute choice in Parfit's Hitchhiker. The guest's main argument is that if a theory tells you to die of thirst, it's the theory's fault, not a fact about rationality. The user wants 6-8 questions that make this stance harder to maintain, specifically addressing Kavka's toxin case and a scenario with a 95% reliable lie detector, plus follow-ups. They also want a closing question about what would make her admit CDT is right.

  First, I need to recall Parfit's Hitchhiker. You're stranded in the desert, a driver offers a ride only if you promise to pay $100 in town. Once in town, paying doesn't benefit you—CDT says don't pay, but that's irrational since you'd die otherwise. Resolute choice argues you should commit to paying upfront and follow through. The guest's counter is that any theory suggesting death is rational is flawed.

  The user wants to challenge this. So, how to structure the questions? Start with the core premise, then introduce complications. Key areas: distinguishing from Kavka's Toxin, where you don't actually consume the toxin, and imperfect lie detectors. Also, probe the limits of her position.

  For Kavka's Toxin: In that case, you get rewarded for intending to drink the toxin but don't have to drink it. Resolute choice might say commit and follow through, but here, following through is unnecessary and harmful. The guest needs to explain why Parfit requires payment but Toxin doesn't require drinking. Follow-up: If she argues Toxin intention is sufficient, ask why Parfit's isn't just about intention too. If payment is necessary, why not in Toxin?

  For the 95% reliability: If the lie detector isn't perfect, resolute choice might still say commit and pay. But with a 5% chance of detection failure, you might avoid paying without consequences. CDT could then suggest non-payment if the risk is low enough. Follow-up: If she says you should still pay out of commitment, ask how low reliability must be before non-payment is rational. This forces her to quantify her stance.

  The closing question: What evidence would make her admit CDT is correct? This tests her openness to falsification. If she can't name any, it shows dogmatism. If she gives a scenario, it might reveal weaknesses in resolute choice.

  Need to ensure questions build progressively. Start with her core argument, move to comparisons, then reliability, and end with falsifiability. Each question should have a follow-up to press her on responses.

  Also, consider the guest's likely answers. For Toxin, she might say Parfit involves a promise that must be fulfilled, while Toxin is about intention only. But then, why the difference? If the detector is imperfect, she might stress commitment over outcomes. But when does the risk outweigh the principle?

  Potential pitfalls: She might argue that resolute choice binds you to your initial commitment regardless of changing circumstances. But in the imperfect detector case, the initial conditions are different. Need to highlight that.

  Finally, structure the questions to corner her into admitting that sometimes CDT's approach is rational, or force her to defend increasingly implausible positions. The goal is to make her move harder to apply universally.
answer: |-
  Here are 8 progressively challenging questions targeting the "refutation of the theory" move, incorporating your specific requests, with follow-ups keyed to likely answers:

  1.  **Core Challenge - The "Refutation" Move:**
      *   **Question:** You argue that a theory telling you to die of thirst is self-refuting. But isn't this circular? CDT *defines* rationality as maximizing *causal* expected utility *at the moment of choice*. By that definition, refusing to pay *is* rational in town. Your claim seems to presuppose that rationality *must* include commitment to past intentions or promises, which is precisely what's in dispute. How do you justify privileging your definition of rationality over CDT's without begging the question?
      *   **Likely Answer:** "Rationality must account for the temporally extended nature of agency and the binding force of commitments made under specific circumstances."
      *   **Follow-up:** Doesn't that commit you to the view that rationality fundamentally *requires* a form of pre-commitment or binding resolution? If so, doesn't that make resolute choice less an independent theory and more a *prescription* for how agents *must* be structured to *be* rational? Is rationality then a property of the *plan* or the *agent's structure*, rather than the *choice*?

  2.  **The "Getting the Benefit" Threshold:**
      *   **Question:** Resolute choice says you must pay because you got the benefit (the ride) conditional on the promise. But CDT argues the ride is a *sunk cost* by the time you're in town; paying gains you nothing. Where exactly is the threshold where the benefit is "secured" such that the promise *must* be fulfilled? Is it crossing the town border? The driver stopping the car? When the thirst is quenched? How does resolute choice define this point objectively?
      *   **Likely Answer:** "The benefit is secured upon arrival in town/safety. The promise was explicitly conditional on delivering you safely."
      *   **Follow-up:** If the driver dropped you just *outside* town, where you could easily walk in but were still technically "in the desert," would resolute choice then say you *shouldn't* pay if asked, since the strict condition wasn't met? If not, doesn't this show the threshold is fuzzy and undermines the clear-cut 'you got the benefit, now pay' logic?

  3.  **Kavka's Toxin Distinction (Setup):**
      *   **Question:** How does resolute choice distinguish Parfit's Hitchhiker from Kavka's Toxin Puzzle? In both, you make a commitment (pay/to intend to drink) to get a benefit *now* (ride/$1M), facing a later choice where fulfilling the commitment (paying/drinking) is costly and seemingly causally irrelevant to *that* benefit. Yet, intuitively, drinking the toxin seems clearly irrational, while paying the driver seems (to you) rational. What's the principled difference resolute choice identifies?
      *   **Likely Answer:** "The key difference is *enforcement*. The Hitchhiker driver *requires* payment conditional on the *action* (or credible promise detected). The Toxin benefactor only cares about the *intention* at T1, verified at T1. The action at T2 (drinking) is never required to secure the T1 benefit ($1M). The promise in the Hitchhiker *is* required to secure the T1 benefit (the ride), *and* the payment is the explicitly promised action."
      *   **Follow-up:** If the Toxin benefactor *did* require you to actually drink the toxin at T2 to keep the $1M (perhaps via a clawback clause triggered by non-drinking), would resolute choice then demand you drink it? If not, why not? If so, doesn't that contradict the strong intuition that drinking poison for no *further* gain is irrational, even if you promised?

  4.  **Kavka's Toxin Distinction (Intent vs. Action):**
      *   **Question:** Building on the enforcement point: In Hitchhiker, the lie detector arguably verifies the *sincerity of the intention to pay* at the desert point, much like the Toxin benefactor verifies the *intention to drink* at T1. If the Toxin benefactor *only* required the sincere intention at T1 (and you get the money regardless of T2), why doesn't the Hitchhiker driver *only* require the sincere intention *to pay* in the desert (and you get the ride regardless of paying in town)? Why is the *action* of paying necessary in one case but the *action* of drinking isn't in the other?
      *   **Likely Answer:** "Because the driver explicitly bargained for the *action* of payment upon delivery. The promise was a means to credibly commit to that future action, which was the driver's actual demand. The Toxin benefactor only bargained for the *intention*."
      *   **Follow-up:** Doesn't this mean resolute choice's requirement hinges entirely on the *specific, arbitrary terms of the deal* set by the other party? If the driver changed the deal to *only* require the sincere promise (verified, but no payment needed later), would resolute choice then say *not* paying in town is rational? If rationality depends on the quirks of the offer, how is it a fundamental theory of rational choice?

  5.  **Imperfect Detection (95% Reliable - Setup):**
      *   **Question:** Let's modify Hitchhiker: The driver's lie detector is only 95% reliable. In the desert, you can make a sincere promise (95% chance it registers correctly, you get the ride) or try to falsely promise (5% chance it fails, you get caught and left). Once safe in town, paying costs $100, not paying saves $100. If not paying, there's a 5% chance the driver detects this (via some imperfect monitor) and punishes you severely (worse than dying of thirst), and a 95% chance you get away scot-free. What does resolute choice prescribe *in town*?
      *   **Likely Answer:** "Resolute choice still prescribes paying. You made a sincere commitment in the desert to secure the ride, knowing the detector was imperfect. Fulfilling that commitment is rationally required, regardless of the imperfect enforcement mechanism *now*. Betting on the 5% failure rate is irrational reneging."
      *   **Follow-up:** Doesn't this mean resolute choice ignores *new, relevant probabilistic information* available at the choice point? CDT would calculate the expected utility of paying (-$100) vs. not paying (0.95 * $100 saved + 0.05 * Severe Punishment). If Severe Punishment is finite (however bad), there's *some* probability of detection low enough where CDT says not paying has higher EU. Why is sticking rigidly to the desert-era resolution *without updating for the actual risk* rational?

  6.  **Imperfect Detection (The Slippery Slope):**
      *   **Question:** Following up on the 95% case: Imagine the detection reliability in town drops further. At what *exact* point of detection reliability (e.g., 90%? 75%? 51%? 1%?) does resolute choice *stop* demanding payment and concede that not paying *might* become the rational choice? Or does it demand payment *no matter how low the detection probability*, as long as there was an initial sincere commitment?
      *   **Likely Answer:** "Resolute choice demands fulfilling the commitment based on the *principle of commitment* and *integrity of the initial plan*, not based on recalculating enforcement probabilities later. The reliability drop is irrelevant to the rational requirement to keep one's word given the initial context."
      *   **Follow-up:** If the detection probability drops to 0.0001% (virtually certain you won't get caught), and Severe Punishment is finite (say, a $1000 fine), CDT easily says don't pay (EU: -0.000001*1000 + 0.999999*100 ≈ +$99.999). Resolute choice says pay (-$100). How is paying $100 to avoid a 0.0001% chance of a $1000 fine rational? Isn't this a clear case where resolute choice demands an irrational, wasteful action based solely on a past resolution, ignoring the actual causal structure and probabilities *now*?

  7.  **The "Losing Case" Threshold - Falsifiability:**
      *   **Question:** You've framed CDT's recommendation in Hitchhiker as a refutation of CDT. What would a scenario look like where *resolute choice's* recommendation would constitute a refutation of *it*? Specifically, what kind of evidence or hypothetical case would convince you that causal decision theory was actually correct all along in prioritizing the causal consequences of the immediate choice?
      *   **Likely Answer:** "If a scenario showed that adhering to a resolute plan *systematically* led to worse *overall* outcomes across an agent's life, or violated fundamental and undeniable intuitions about rational self-interest *even when considering the whole extended action*, that would be problematic. But I contend Parfit's Hitchhiker isn't that case; dying *is* the worse outcome."
      *   **Follow-up:** Isn't the 95% reliable detector case (especially with very low detection probability) precisely that? It seems resolute choice *does* demand systematically worse outcomes (paying $100 when you could almost certainly keep it with impunity) based solely on adherence to a past resolution, violating strong intuitions about rational self-interest *at the moment of choice*. If this doesn't count as a refutation, does *anything* falsify resolute choice, or is it insulated by always defining rationality as requiring plan-adherence?

  **Key Rationale for the Questions:**

  1.  **Targets the Core Move:** Q1 directly challenges the circularity of dismissing CDT based on an outcome presupposing RC's definition of rationality.
  2.  **Probes Implementation:** Q2 forces clarification on when the "benefit is secured," revealing potential fuzziness.
  3.  **Forces Distinction (Toxin):** Q3 & Q4 directly address your request, making her articulate the difference and probing whether the distinction is principled or based on arbitrary deal terms. The follow-up on changing the Toxin deal (Q4 Follow-up) is particularly potent.
  4.  **Introduces Imperfection:** Q5 & Q6 directly address your request for the 95% case. Q5 forces RC to confront probabilistic uncertainty *at the choice point*, and Q6 pushes it towards an absurd conclusion by lowering the probability, highlighting its potential rigidity and disconnect from actual causal consequences. This directly challenges the "refutation" move by showing RC demanding an action that seems clearly wasteful and irrational *by any standard* except its own commitment rule.
  5.  **Tests Falsifiability:** Q7 directly asks for a "losing case," forcing her to consider scenarios where RC's prescription is intuitively indefensible (like the very low detection probability case). The follow-up presses her to acknowledge if the scenario presented *in Q6* meets her own threshold for refutation.

  These questions progressively box in the "refutation" move by demanding justifications for core assumptions, forcing distinctions, introducing realistic complications (imperfect detection), pushing principles to extremes, and finally demanding falsifiability. Good luck with the podcast!
