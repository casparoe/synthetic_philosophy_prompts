prompt: |-
  A friend and I spent much of Sunday evening arguing about whether to combine our money into a single joint position in a prediction-market contract on an upcoming election, and the argument ended up turning into a rerun of a debate we'd already had in our decision theory seminar over Harsanyi's social aggregation theorem. My friend's view was that, since we are each individually rational in the von Neumann–Morgenstern sense, Harsanyi's theorem guarantees that our joint behavior can always be represented as maximizing some weighted sum of our two utility functions, so there is nothing philosophically fraught about acting as a single unit once we agree on the weights. I was not convinced, because our actual disagreement is not about how much we each value the payout relative to the stake, but about the probability we each assign to the candidate winning. That struck me as exactly the kind of disagreement Harsanyi's original proof was never built to handle, since it is stated for a fixed set of lotteries that both the individuals and "society" are assumed to already be ranking in common, which quietly presupposes agreement on the odds.

  My friend countered that this is a minor technicality that surely gets patched once the theorem is restated in terms of subjective rather than objective probabilities, but I vaguely recall reading, possibly from the same seminar's reading list, that this extension does not go through smoothly at all: that once individuals are allowed genuinely different priors, combining the usual Pareto condition with the requirement that the social preference itself be expected-utility-rational forces an uncomfortable choice, something like either the individuals sharing a common prior after all, or the aggregation rule collapsing into a kind of dictatorship. Neither of us could reconstruct why that would be true, or what precisely goes wrong if you just plug heterogeneous beliefs into the same proof.

  I would like your help settling this properly. Could you explain what actually breaks, mechanically, when you try to extend Harsanyi-style aggregation from a setting with common objective lotteries to one with individuals who hold genuinely different subjective beliefs? I would find this most useful if illustrated with the kind of bet that two such disagreeing individuals could unanimously want to make, and an account of why a social observer should find that unanimity suspicious rather than reassuring. I would also appreciate your judgment on whether any of the standard fixes on offer, such as imposing a common prior by fiat, weakening the Pareto condition, or simply having the aggregate defer to one person's beliefs, amounts to a genuine rescue of Harsanyi's conclusion, or is really just a way of quietly changing the question.
reasoning: |-
  Okay, the user is asking about extending Harsanyi's social aggregation theorem to cases with subjective probabilities. Let me start by recalling Harsanyi's original theorem. It assumes a common set of objective lotteries, so everyone agrees on probabilities. The theorem says that if individuals and society have vNM-rational preferences, and society respects Pareto efficiency, then social utility is a weighted sum of individual utilities.

  The user and their friend are debating whether this applies when people have different beliefs. The friend thinks it's a minor fix, but the user remembers that it doesn't work smoothly. I need to explain why. The key issue is that with subjective priors, the Pareto principle can lead to situations where everyone wants to bet against each other, but that shouldn't be possible under a single social utility function.

  Let me think about an example. Suppose two people, Alice and Bob, have different beliefs about an election. Alice thinks Candidate X has a 70% chance, Bob thinks it's 30%. They both have linear utility for money. If they use their own beliefs, Alice would bet on X at certain odds, Bob against. But if they combine their beliefs and preferences under Harsanyi, the social utility would require consistent probabilities. The problem arises when they both prefer a trade that seems beneficial individually but leads to a sure loss collectively. 

  For instance, Alice pays Bob $30 if X wins in exchange for $30 if X loses. Based on their beliefs, both think they're gaining expected utility. But collectively, it's a zero-sum trade. The social observer, representing a combined utility, can't approve this because it doesn't increase expected utility under any single probability measure. This violates the ex-post Pareto principle, which requires that if both prefer a trade, society should too. But the trade is unsustainable under a single belief system.

  The deeper issue is that Harsanyi assumes a common probability, but with subjective beliefs, the Pareto principle forces either a common prior or dictatorship. If individuals have different priors, allowing trades they both prefer leads to Dutch books. The social utility function can't simultaneously satisfy vNM rationality and accommodate these trades without conflicting beliefs.

  The user also asks about standard fixes. Imposing a common prior assumes away the disagreement. Weakening Pareto might work but changes the original premise. Deferring to one person's beliefs is dictatorial. None truly rescue Harsanyi's conclusion without altering the problem. The user wants to know if these are genuine solutions or just workarounds. Essentially, they're changing the question to fit the theorem's assumptions.

  The user's deeper need might be understanding the limitations of aggregating preferences with differing beliefs, especially in contexts like prediction markets or joint decisions. They might be looking for a rigorous explanation to settle their debate, possibly for academic or practical applications in decision theory.
answer: |-
  This is an excellent and perceptive debate, touching on a crucial limitation of Harsanyi's theorem that is often overlooked. Your intuition is correct: **Harsanyi's original theorem fundamentally relies on individuals agreeing on the probabilities (objective lotteries), and extending it to subjective beliefs with genuinely different priors leads to a deep conflict between the Pareto principle and the requirement that social preferences be vNM-rational.** Your friend's proposed "patch" is non-trivial and fails.

  Let's break down why, mechanically, this happens, using the election bet scenario.

  **1. Harsanyi's Original Setup (Common Lotteries/Probabilities):**
  *   **Input:** A fixed set of *objective lotteries* `L`. Everyone agrees on the probabilities defining each lottery `L ∈ L`.
  *   **Individuals:** Each individual `i` has vNM-rational preferences over `L`, representable by a utility function `U_i` over *outcomes*, such that `i` prefers lottery `L` to `L'` iff `E_L[U_i] > E_L'[U_i]`.
  *   **Society:** "Society" (or the joint agent) must also have vNM-rational preferences over `L`.
  *   **Pareto Principle (Unanimity):** If *every* individual weakly prefers lottery `L` to lottery `L'`, then society weakly prefers `L` to `L'`. If, moreover, at least one individual strictly prefers `L` to `L'`, then society strictly prefers `L` to `L'`.
  *   **Conclusion:** Society's preferences can be represented by a vNM utility function `U_soc` that is a *weighted sum* of the individual vNM utilities: `U_soc = Σ w_i * U_i` (with `w_i > 0`). Crucially, the expectation for society is taken using the *same agreed-upon probabilities* as the individuals use for their expectations.

  **2. The Problem: Subjective Beliefs (Different Priors)**
  The core issue arises when individuals don't agree on the probabilities governing uncertain events (like the election). Each has their own subjective prior `P_i`.

  *   **Individuals:** Each `i` now has preferences over *acts* (or state-dependent payouts). Their vNM-rational preferences are represented by maximizing *subjective expected utility*: `SEU_i = E_{P_i}[U_i]`. Their disagreement stems from `P_i` (beliefs), not necessarily `U_i` (values over outcomes).
  *   **Society:** We require society to also have vNM-rational preferences over acts. This means its preferences must be representable by *some* utility function `U_soc` over outcomes and *some* probability distribution `P_soc` such that it maximizes `SEU_soc = E_{P_soc}[U_soc]`.
  *   **Pareto Principle (Unanimity):** Same as before: If every individual strictly prefers act `A` to act `B` (i.e., `E_{P_i}[U_i(A)] > E_{P_i}[U_i(B)]` for all `i`), then society must strictly prefer `A` to `B`.

  **3. What Breaks Mechanically: The Dutch Book Argument**

  The conflict arises because the Pareto principle, applied under different priors, can force society to accept bets that are collectively unsustainable (a "Dutch Book"). Here's the illustrative bet:

  *   **The Election:** Candidate X vs. Candidate Y. Two individuals: Alice (A) and Bob (B).
  *   **Beliefs:** `P_A(X wins) = 0.7`, `P_A(Y wins) = 0.3`. `P_B(X wins) = 0.3`, `P_B(Y wins) = 0.7`.
  *   **Values:** Both are risk-neutral and value money linearly (`U_A($) = $`, `U_B($) = $`). They only care about money.
  *   **The Proposed Bet:** Alice sells Bob a contract promising to pay Bob **$30** if X wins. In exchange, Bob pays Alice **$30** *now*.
      *   **Alice's Perspective:**
          *   Cost if X wins: -$30
          *   Gain if Y wins: +$30 (the $30 Bob paid her now, no payout owed)
          *   `SEU_A(Bet) = (0.7 * -$30) + (0.3 * +$30) = -$21 + $9 = -$12`
          *   `SEU_A(No Bet) = $0`
          *   Alice *strictly prefers NOT to take this bet* (`0 > -12`).
      *   **Bob's Perspective:**
          *   Cost: Pays $30 now.
          *   Gain if X wins: +$30 (from Alice)
          *   Gain if Y wins: $0 (just lost his $30 payment)
          *   `SEU_B(Bet) = (0.3 * ($30 - $30)) + (0.7 * ($0 - $30))` Wait, Bob paid $30 *now*. Let's reframe net outcome per state:
              *   X wins: Bob nets $0 ($30 from Alice - $30 he paid)
              *   Y wins: Bob nets -$30 ($0 - $30 paid)
          *   `SEU_B(Bet) = (0.3 * $0) + (0.7 * -$30) = $0 - $21 = -$21`
          *   `SEU_B(No Bet) = $0`
          *   Bob *strictly prefers NOT to take this bet* (`0 > -21`).

  **This bet is unanimously rejected. Now, consider a *different* bet:**

  *   **The Reverse Bet:** Bob sells Alice a contract promising to pay Alice **$30** if *Y* wins. In exchange, Alice pays Bob **$30** *now*.
      *   **Alice's Perspective:**
          *   Cost: Pays $30 now.
          *   Gain if Y wins: +$30 (from Bob)
          *   Gain if X wins: $0 (just lost her $30 payment)
          *   Net per state:
              *   X wins: -$30
              *   Y wins: $0
          *   `SEU_A(Bet) = (0.7 * -$30) + (0.3 * $0) = -$21 + $0 = -$21`
          *   `SEU_A(No Bet) = $0`
          *   Alice *strictly prefers NOT* (`0 > -21`).
      *   **Bob's Perspective:**
          *   Cost if Y wins: -$30
          *   Gain if X wins: +$30 (the $30 Alice paid him now)
          *   Net per state:
              *   X wins: $0 ($30 received - $0 owed later)
              *   Y wins: -$30 ($0 - $30 owed)
          *   `SEU_B(Bet) = (0.3 * $0) + (0.7 * -$30) = $0 - $21 = -$21`
          *   `SEU_B(No Bet) = $0`
          *   Bob *strictly prefers NOT* (`0 > -21`).

  **This bet is also unanimously rejected. Now, consider the *combination* of the two rejected bets:**

  1.  Alice sells Bob the "$30 if X wins" contract for $30 paid now by Bob.
  2.  Bob sells Alice the "$30 if Y wins" contract for $30 paid now by Alice.

  **Net Effect:**
  *   Money *now*: Alice pays Bob $30 (for Bet 2), Bob pays Alice $30 (for Bet 1). **Net: $0 now.**
  *   If **X wins**:
      *   Alice owes Bob $30 (from Bet 1).
      *   Bob owes Alice $0 (Bet 2 only pays if Y wins).
      *   **Net: Alice pays Bob $30.**
  *   If **Y wins**:
      *   Alice owes Bob $0 (Bet 1 only pays if X wins).
      *   Bob owes Alice $30 (from Bet 2).
      *   **Net: Bob pays Alice $30.**

  **This is equivalent to a brand new bet: They simply bet $30 on the outcome!** If X wins, Bob wins $30 from Alice. If Y wins, Alice wins $30 from Bob.

  **Do Alice and Bob *unanimously* want to make *this* combined bet? Let's see their *subjective* expected utilities:**

  *   **Alice's SEU(Combined Bet):**
      *   `P_A(X wins) = 0.7` -> Pays $30 -> Utility = -$30
      *   `P_A(Y wins) = 0.3` -> Receives $30 -> Utility = +$30
      *   `SEU_A = (0.7 * -30) + (0.3 * 30) = -21 + 9 = -$12`
      *   `SEU_A(No Bet) = $0`
      *   Alice *rejects* (`0 > -12`).
  *   **Bob's SEU(Combined Bet):**
      *   `P_B(X wins) = 0.3` -> Receives $30 -> Utility = +$30
      *   `P_B(Y wins) = 0.7` -> Pays $30 -> Utility = -$30
      *   `SEU_B = (0.3 * 30) + (0.7 * -30) = 9 - 21 = -$12`
      *   `SEU_B(No Bet) = $0`
      *   Bob *rejects* (`0 > -12`).

  **Individually, both reject the combined bet!** So far, no problem. They both reject all bets.

  **The Crucial Pareto Conflict:**

  Now, imagine Alice and Bob *don't* consider the combined bet directly. Instead, they only consider the *two separate bets*, which they *individually rejected*. However, suppose an external "social planner" or their own joint decision process is bound by the **Pareto principle**.

  *   Recall: Both Alice and Bob *strictly preferred NOT to take Bet 1* (Alice selling to Bob). The status quo (No Bet 1) is Pareto superior to Bet 1.
  *   Similarly, both *strictly preferred NOT to take Bet 2* (Bob selling to Alice). The status quo (No Bet 2) is Pareto superior to Bet 2.

  **The Pareto principle *forces* the social planner/joint agent to agree:**
  1.  Society strictly prefers "No Bet 1" to "Bet 1".
  2.  Society strictly prefers "No Bet 2" to "Bet 2".

  **The Trap:** Now, what if the social planner/joint agent is *offered the combination of both bets simultaneously*? We know this is equivalent to the $30 bet, which both individuals also reject. But does the social planner, based *only* on its vNM rationality and the two Pareto judgments above, *have* to reject it?

  *   The social planner has vNM preferences. This means it must evaluate acts based on *some* `P_soc` and `U_soc`.
  *   "No Bet 1 & No Bet 2" leads to $0 for sure. `SEU_soc(0) = U_soc(0)`.
  *   "Bet 1 & Bet 2" leads to the $30 bet. `SEU_soc($30 bet) = P_soc(X) * U_soc(-30 for A, +30 for B) + P_soc(Y) * U_soc(+30 for A, -30 for B)`.
      *   *(Note: `U_soc` needs to handle distributions of money, but since they only care about their own money, it's plausible `U_soc` depends only on the net transfers, or is additive: `U_soc = w_A * U_A + w_B * U_B`).*
  *   The key point: **The social planner, based on its *own* `P_soc` and `U_soc`, might *strictly prefer* the combined bet (Bet 1 & Bet 2) to the status quo (No Bet 1 & No Bet 2)!**
      *   For example, if `P_soc(X) = 0.5` and `U_soc` is linear and symmetric (`w_A = w_B`), then `SEU_soc($30 bet) = (0.5 * U_soc(-30, 30)) + (0.5 * U_soc(30, -30)) = (0.5 * (-30w_A + 30w_B)) + (0.5 * (30w_A - 30w_B))`. If `w_A = w_B`, this equals `0`. So `SEU_soc($30 bet) = 0 = SEU_soc(0)`.
      *   **But if `P_soc` is different**, say `P_soc(X) = 0.6`, and `w_A = w_B = 1` (additive linear utility):
          *   `SEU_soc($30 bet) = (0.6 * (-30 + 30)) + (0.4 * (30 - 30))` Wait no: `U_soc(state)` is the sum of utilities *in that state*.
          *   State X: Alice -$30, Bob +$30 -> `U_soc = U_A(-30) + U_B(+30) = -30 + 30 = 0`.
          *   State Y: Alice +$30, Bob -$30 -> `U_soc = U_A(30) + U_B(-30) = 30 - 30 = 0`.
          *   **`SEU_soc($30 bet) = P_soc(X)*0 + P_soc(Y)*0 = 0`** regardless of `P_soc`!
          *   `SEU_soc(Status Quo) = U_A(0) + U_B(0) = 0 + 0 = 0`.
      *   **`SEU_soc($30 bet) = 0 = SEU_soc(Status Quo)` always, if `U_soc` is additive and linear!** The social planner is indifferent. But what if `U_soc` isn't additive? Could it prefer the bet?

  **The Real Conflict:** The problem isn't necessarily that the social planner *wants* the combined bet. The problem is the **logical incompatibility** forced by the Pareto judgments on the sub-bets and the requirement for vNM social rationality.

  1.  **Pareto Says:** Society strictly prefers "No Bet 1" to "Bet 1". Society strictly prefers "No Bet 2" to "Bet 2".
  2.  **vNM Rationality Says:** Society's preferences over acts (like combinations of bets) must satisfy the vNM axioms, implying they can be represented by `SEU_soc`.
  3.  **The Acts:** Consider three acts:
      *   `S`: Status Quo (No Bet 1, No Bet 2)
      *   `B1`: Only Bet 1 happens.
      *   `B2`: Only Bet 2 happens.
      *   `B1B2`: Both Bet 1 and Bet 2 happen (equivalent to the $30 bet).
  4.  **Pareto Rankings:**
      *   `S >_soc B1` (Strictly, by Pareto based on individual rejections of B1)
      *   `S >_soc B2` (Strictly, by Pareto based on individual rejections of B2)
  5.  **The Connection:** Notice that `B1B2` is a *compound* act. Crucially, **`S` is *probabilistically equivalent* to a lottery that gives `S` or `B1B2` each with 50% probability, *conditional on the bets being independent offers*.**
      *   Imagine the bets are offered sequentially by different external bookies, independently.
      *   Act `S`: Reject Bet 1 *and* Reject Bet 2.
      *   Act `B1`: Accept Bet 1 *and* Reject Bet 2.
      *   Act `B2`: Reject Bet 1 *and* Accept Bet 2.
      *   Act `B1B2`: Accept Bet 1 *and* Accept Bet 2.
      *   Now, consider an act `T`: Flip a fair coin. If Heads, play `B1`. If Tails, play `B2`.
          *   What is the outcome of `T`? 50% chance of `B1` (Alice owes Bob $30 if X wins), 50% chance of `B2` (Bob owes Alice $30 if Y wins).
          *   **This is NOT the same as `B1B2`!** `B1B2` happens for sure. `T` gives a 50% chance of only one bet happening.
      *   **This is the subtle mechanical break:** `S` is *not* probabilistically equivalent to a mix of `S` and `B1B2`. The acts `B1` and `B2` are *different* acts from `S` and `B1B2`.

  **The actual incompatibility arises from the linearity of social preference required by vNM rationality combined with Pareto:**

  *   Suppose society is *indifferent* between `S` and `B1B2` (as in the linear additive utility case above).
  *   Pareto requires `S >_soc B1` and `S >_soc B2`.
  *   Now, consider a 50-50 lottery between `B1` and `B2`: `L = [0.5: B1, 0.5: B2]`.
  *   By vNM linearity (Independence Axiom), since `S >_soc B1` and `S >_soc B2`, it *must* be that `S >_soc L`. Society strictly prefers the status quo `S` to the lottery `L`.
  *   **But what is `L`?** As computed earlier:
      *   With 50% chance: Bet 1 occurs (Alice sells Bob $30-if-X for $30 now).
      *   With 50% chance: Bet 2 occurs (Bob sells Alice $30-if-Y for $30 now).
  *   **Net Effect of `L`:**
      *   Money *now*: Net $0 (same as `S` and `B1B2`).
      *   If **X wins**: 50% chance Bet 1 happened (Alice pays Bob $30). 50% chance Bet 2 happened (No X-win payout owed). **Net: 50% chance Alice pays Bob $30, 50% chance $0.**
      *   If **Y wins**: 50% chance Bet 1 happened (No Y-win payout owed). 50% chance Bet 2 happened (Bob pays Alice $30). **Net: 50% chance Bob pays Alice $30, 50% chance $0.**
  *   **This is NOT the same as `B1B2`!** `B1B2` gives a *sure* transfer of $30 depending on the winner. `L` gives a *50% gamble* on a $30 transfer depending on the winner. They are different acts.
  *   **Can `L` be preferred to `B1B2` or vice-versa by society?** Yes, depending on risk aversion encoded in `U_soc`. However, individuals evaluate `L` differently:
      *   **Alice's SEU(L):** `P_A(X) * [0.5*-30 + 0.5*0] + P_A(Y) * [0.5*0 + 0.5*+30] = (0.7)(-15) + (0.3)(+15) = -10.5 + 4.5 = -$6`
      *   `SEU_A(S) = $0`, `SEU_A(B1B2) = -$12`. Alice prefers `S` ($0) > `L` (-$6) > `B1B2` (-$12).
      *   **Bob's SEU(L):** `P_B(X) * [0.5*0 + 0.5*+30?]` Wait:
          *   State X: Bob gets `0.5 * (Net from B1: $0) + 0.5 * (Net from B2: $0)`? No.
          *   If X wins and Bet 1 happened: Bob nets +$30 (from Alice) - $30 paid? Earlier: In Bet 1, if X wins, Bob *receives* $30 from Alice. He paid $30 *now*, so net transfer at outcome: +$30 - $30 = $0? **This is the critical point.** The $30 payment for the bet happens *upfront*, before the outcome. The net outcome *in the state* for Bob in Bet 1 if X wins is $0 (received $30 payout, but paid $30 upfront). Similarly for all other cases. **Therefore, for *both* `B1` and `B2` and `B1B2` and `S`, the net transfer *conditional on the state actually occurring* is always $0 for both players in all acts!** The money changes hands *before* the uncertainty resolves. The disagreement was only about the *value* of the contracts *before* the election. Once the bets are placed, the payouts are fixed obligations. The net monetary outcome *on election night* is always $0 for both in all scenarios (`S`, `B1`, `B2`, `B1B2`, `L`), *because the $30 was transferred upfront when the bet was made*. The only thing that mattered was their *ex-ante* SEU evaluation of making the bet *before* knowing the outcome, which included the upfront payment.

  **The Core Breakdown Simplified:**

  The fundamental mechanical break is this:

  1.  **Different Priors + Pareto:** The Pareto principle, when individuals have different priors, can identify pairs of acts `A` and `B` where `A` is Pareto superior to `B` (`A >_Pareto B`).
  2.  **vNM Social Rationality:** Requires that social preferences satisfy the vNM axioms, particularly *state-wise dominance* or *sure-thing principles* in richer settings, and can be represented by a *single* `P_soc`.
  3.  **The Conflict:** The act `A` that is Pareto superior to `B` might involve individuals betting *against each other* based on their differing beliefs (like the combined bet `B1B2` *looked* ex-ante to each individual like a loss, justifying `S >_Pareto B1B2`). However, from the perspective of the social observer *using its single `P_soc`*, the act `B` might actually appear *identical* to `A` or even *superior* (if `P_soc` differs significantly from all `P_i`), violating the Pareto ranking (`A >_soc B`) required by the Pareto principle. The social observer's single probability assessment `P_soc` cannot simultaneously agree with Alice's high `P_A(X)` *and* Bob's low `P_B(X)` when evaluating state-dependent trades between them. The unanimity (`S >_i B1` for all `i`) is based on individual probability assessments (`P_i`), while the social assessment (`>_soc`) uses `P_soc`. The Pareto principle forces `>_soc` to respect the *conclusion* of the individual assessments (`S > B1`), but vNM rationality forces `>_soc` to be based *only* on `P_soc` and `U_soc`. There's no guarantee that `P_soc` will make `S` look better than `B1` according to `SEU_soc`.

  **The Formal Impossibility Result:**

  The rigorous result (associated with work by Hylland, Zeckhauser, Mongin, and others) states that under mild conditions, the following are incompatible:

  1.  **vNM Social Rationality:** Social preferences are vNM-rational (representable by `SEU_soc`).
  2.  **Pareto Principle:** As defined.
  3.  **Belief Diversity:** Individuals have genuinely different priors (`P_i` are not all identical).
  4.  **Non-Dictatorship:** Social preferences are not solely determined by one individual's beliefs and utilities.

  **Why your friend's "subjective probabilities patch" fails:** Plugging different `P_i` into the original Harsanyi proof assumes the expectation is still taken over the *same states*, but the proof relies on the linear aggregation holding under a *common* probability measure for the expectation. With different `P_i`, the individuals' `SEU_i` are expectations under *different* measures. The linear aggregation `Σ w_i * SEU_i` is **not** itself necessarily a valid expected utility under *any single* probability measure `P_soc`, unless the `P_i` are identical. It becomes a "linear opinion pool," which violates the vNM rationality axioms for society (specifically, the Independence Axiom) unless all `P_i` are the same.

  **Judgment on Standard Fixes:**

  1.  **Imposing a Common Prior by Fiat:**
      *   **What it does:** Assumes `P_i = P_common` for all `i`. Returns to Harsanyi's original setting. `U_soc = Σ w_i * U_i`, `P_soc = P_common`.
      *   **Is it a rescue?** Technically, yes, it satisfies the theorem's assumptions. **But it fundamentally changes the question.** The whole point of the debate was how to aggregate *when there is genuine belief disagreement*. Assuming the disagreement away sidesteps the core issue. It's not a rescue; it's a refusal to engage with the problem.

  2.  **Weakening the Pareto Principle:**
      *   **What it does:** Restricts Pareto to only apply when individuals agree *both* on probabilities *and* utilities for the acts in question (very strong), or only to "ex-post" comparisons after uncertainty resolves (but this is often too weak, as many decisions are made ex-ante), or other restrictions.
      *   **Is it a rescue?** This *can* allow for consistent aggregation (e.g., `SEU_soc` could use a `P_soc` that's a linear pool or other combination, and a `U_soc = Σ w_i * U_i`). **However, it significantly weakens the normative force of the theorem.** The compelling idea that "unanimity should be respected" is abandoned for precisely the cases (disagreement under uncertainty) where aggregation is most debated. It changes the question by lowering the bar for what social rationality must respect.

  3.  **Deferring to One Person's Beliefs (Dictatorship):**
      *   **What it does:** Sets `P_soc = P_k` and `U_soc = U_k` for some individual `k`.
      *   **Is it a rescue?** It satisfies vNM social rationality and a *weak* form of Pareto (if *everyone*, including the dictator, agrees). **But it utterly violates the spirit of equal consideration and non-dictatorship central to social aggregation.** It changes the question from "how to combine us" to "which one of us is in charge".

  **Conclusion:**

  Your skepticism is well-founded. Harsanyi's theorem provides a powerful argument for utilitarianism under **common beliefs about risk (objective lotteries)**. However, it **does not extend gracefully to situations with genuinely heterogeneous subjective beliefs.** The requirement that the joint preference be representable as maximizing expected utility under a *single* probability distribution (`P_soc`) clashes violently with the Pareto principle when individuals base their unanimous preference judgments on *different* probability distributions (`P_i`). The "unanimously preferred" acts in this context often involve speculative trades based on belief differences, which a single `P_soc` cannot justify. None of the standard fixes genuinely rescue Harsanyi's elegant linear aggregation conclusion for the case of differing priors without either assuming the disagreement away (common prior), weakening the normative force of unanimity (restricted Pareto), or abandoning egalitarianism (dictatorship). The theorem highlights the profound challenge of rational social choice under genuine uncertainty and disagreement. Your recollection of the seminar reading was correct!
