answer: |-
  Here’s a rigorous argument against supervaluationism’s ability to coherently handle higher-order vagueness without collapsing into epistemicism or triggering a vicious regress. The core problem lies in **supervaluationism's inability to precisify its own key semantic notions (like "definitely true" or "admissible precisification") without either smuggling in sharp boundaries or demanding infinite resources.**

  ### The Argument: The Dilemma of Higher-Order Precisification

  1.  **Supervaluationism's Core Claim:** Vagueness arises because a predicate `P` lacks a single sharp extension. Instead, its semantic value is given by a set of *admissible precisifications* (ways of making `P` precise while respecting meaning and use). Truth is supertruth (true on all precisifications), falsity is superfalsity (false on all), and borderline cases are those true on some but false on others.

  2.  **The Problem of Higher-Order Vagueness:** The boundary between "Definitely `P`" (supertrue), "Borderline `P`", and "Definitely not `P`" (superfalse) is itself vague. There are cases where it's borderline whether `x` is a borderline case of `P` (e.g., borderline whether it's borderline bald). Supervaluationism must account for this.

  3.  **The Supervaluationist's Obligation:** To account for higher-order vagueness, supervaluationism must apply its *own machinery* to the meta-predicates "Definitely `P`" (D`P`) and "Borderline `P`" (B`P`). These predicates themselves must be vague.

  4.  **The Dilemma: How to Precisify D`P`/B`P`?** How does supervaluationism model the vagueness of *its own* operator "Definitely" (D)? It has two options:
      *   **Option A (New Precisifications):** Introduce a *new set* of precisifications for the concept "admissible precisification for D`P`" (i.e., precisifications of what counts as a precisification for the original predicate `P`).
      *   **Option B (Same Precisifications):** Insist that the vagueness of D`P` is already captured by variation across the *original* set of precisifications for `P`.

  5.  **Critique of Option A (New Precisifications):**
      *   This leads directly to a **vicious regress**. To model the vagueness of D`P`, we need second-order precisifications (precisifications of precisifications).
      *   But the boundary of *these* second-order precisifications (what counts as an admissible way to precisify "admissible precisification for `P`") will *itself* be vague (third-order vagueness).
      *   To model *that*, we need third-order precisifications. This process continues *ad infinitum*.
      *   **Result:** Coherence requires an actual infinity of distinct, ever-higher-order precisification sets. This is metaphysically and epistemologically untenable. It demands infinite resources to model the semantics of a single vague predicate, making the theory practically useless and arguably incoherent for finite beings.

  6.  **Critique of Option B (Same Precisifications):**
      *   This claims that variation across the *original* set of precisifications for `P` suffices to model the vagueness of D`P`. For example: `x` is *definitely* definitely `P` if `x` is `P` on *all* precisifications. `x` is *borderline* definitely `P` if `x` is `P` on *some but not all* precisifications. `x` is *definitely not* definitely `P` if `x` is *not* `P` on *any* precisification.
      *   **Problem 1 (Collapse to Sharp Boundaries):** This analysis *presupposes a sharp boundary* within the set of original precisifications. The set `S` of all admissible precisifications for `P` is treated as *fixed and determinate*. Whether `x` is `P` on *all*, *some*, or *none* of the precisifications in `S` is a *precise matter*. Crucially, the *membership* of `S` itself is treated as precise: a precisification is either definitely in `S` or definitely not. There is no vagueness about what counts as an admissible precisification.
      *   **Consequence:** The assignment of statuses (Definitely D`P`, Borderline D`P`, Definitely ~D`P`) to objects becomes *sharp* relative to the fixed set `S`. While `P` itself has borderline cases *within* this framework, the meta-statuses (definitely definite, borderline definite, etc.) have *sharp boundaries* determined solely by the fixed, precise set `S`. Where these boundaries lie is determined by the (unknowable) exact composition of `S`.
      *   **Problem 2 (Ignoring Genuine Higher-Order Vagueness):** This approach fails to capture the intuition that *what counts as an admissible precisification* is itself vague. There can be borderline cases for whether a particular way of sharpening `P` respects meaning and use (e.g., is a precisification setting the baldness cutoff at 5432 hairs *definitely* admissible, *definitely* inadmissible, or *borderline* admissible?). Option B simply ignores this vagueness by treating `S` as precise.
      *   **Result:** Supervaluationism collapses into a form of **epistemicism about the meta-language**. The sharp boundaries exist at the level of the set `S` of admissible precisifications and the classifications derived from it (like D`P`). We are constitutively unable to know the exact membership of `S` or the exact cutoffs it induces for D`P`, but they exist as precise, unknowable facts. This directly mirrors Williamson's epistemicism, just relocated from the object predicate `P` to the meta-predicate D`P` and the set `S`.

  7.  **The Dilemma Summarized & Conclusion:**
      *   To avoid collapsing into epistemicism (Option B), supervaluationism must embrace higher-order precisifications (Option A).
      *   However, embracing higher-order precisifications (Option A) triggers a vicious and unsustainable regress of precisifications.
      *   Therefore, supervaluationism **cannot give a coherent, non-question-begging treatment of higher-order vagueness.** It is forced to choose between:
          *   **(A) Vicious Regress:** An infinite hierarchy of precisifications, rendering the theory incoherent or practically useless.
          *   **(B) Collapse into Epistemicism:** Sharp boundaries and unknowable facts at the level of the set of admissible precisifications (`S`) and the "definitely" operator (`D`), abandoning the core supervaluationist motivation of avoiding brute cutoffs and respecting "no fact of the matter" intuitions *all the way up*.

  **Key Strengths of this Argument:**

  1.  **Internal Critique:** It uses supervaluationism's *own* machinery (precisifications) against it, showing it cannot consistently apply that machinery to its own key semantic concepts without generating fatal problems.
  2.  **Highlights the Central Issue:** It focuses relentlessly on the **vagueness of admissibility** (what counts as an admissible precisification) as the Achilles' heel. Supervaluationism must either make admissibility precise (Collapse) or vague (Regress).
  3.  **Non-Question-Begging:** It doesn't assume epistemicism is true. It grants supervaluationism its basic framework and shows how its attempt to handle higher-order vagueness within that framework leads to one of two unacceptable outcomes.
  4.  **Exposes the Relocation:** It demonstrates clearly that Option B doesn't solve the problem of sharp boundaries; it merely **relocates them** to the meta-level (the set `S` and operator `D`), functionally replicating epistemicism's core commitment to unknowable, precise facts determining vagueness-related classifications.
  5.  **Addresses Common Defenses:** It anticipates and counters the "same precisifications" move (Option B) by showing it smuggles in precision at the meta-level and ignores the genuine vagueness of admissibility.

  **In essence:** Supervaluationism's elegant solution to first-order vagueness founders on the rocks of higher-order vagueness. To preserve "no fact of the matter" at higher orders, it needs to make its core concepts (admissibility, definitely) vague, but its only tool for modeling vagueness (precisifications) either requires infinite iterations or, when applied to itself, inevitably reintroduces the precise, unknowable boundaries it sought to eliminate. Your friend's objection hits the mark: supervaluationism seems unable to escape the epistemicist's shadow or the abyss of regress when confronting the full depth of vagueness.
