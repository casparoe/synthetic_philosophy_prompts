  Ainslie's intertemporal bargaining uses personal rules to avoid preference reversals. This is a causal explanation, but does it account for the normative failure Davidson highlights? In Davidson's terms, even with bargaining, the moment of action involves an all-out judgment that overrides the better judgment without reason. Ainslie's selves are still part of one agent, so the irrationality persists.

  The user might be looking for whether Ainslie's model resolves the contradiction or sidesteps it. The answer is that Ainslie redefines akrasia as a conflict of interests rather than a failure of rationality. So while it explains the mechanism, it doesn't address Davidson's core issue of unreasoned judgment. The user needs to see the structural differences: Davidson's normative vs. Ainslie's descriptive approach.

  Also, the user mentioned productivity writings using hyperbolic discounting. They might be skeptical if these solutions truly address the philosophical problem. Confirming that Ainslie offers tools for self-management but doesn't dissolve Davidson's puzzle makes sense. Highlighting the principle of continence versus personal rules would clarify that.

