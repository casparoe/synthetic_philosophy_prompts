  First, I need to compare their structures. Davidson focuses on logical inconsistency in judgments, while Ainslie is about psychological mechanisms. The user is sharp to notice that Ainslie's model might address the "how" but not the "why" of irrationality. They want a defense based on specifics, not general reputations.

