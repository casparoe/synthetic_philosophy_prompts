  - Civilian deaths were *intended* (not merely foreseen) as the mechanism to coerce surrender, per target-selection documents.  
  - This violates the absolute prohibition against using innocents as means.  
  Historical counterfactuals (e.g., invasion casualties) are irrelevant to this moral principle.  

  **Final Answer:**  
  Yes, Truman ordered murder under Anscombe's definition. Whether this was the "lesser evil" is a separate consequentialist question – but Anscombe (and Elena) argue consequences cannot sanctify intrinsically immoral *means*. The overlooked historical nuances complicate *predictive* justifications but don’t invalidate the moral principle.
