answer: |-
  Here’s a principled argument blocking redescription and preserving Anscombe’s verdict, grounded in the *functional role* of the civilian deaths in Truman’s plan, without presupposing the moral conclusion:

  ### Core Argument: The Functional Indispensability Test
  The key is to individuate intentions based on **whether the foreseen harm is a *necessary condition* for achieving the agent’s immediate strategic goal**, such that the goal *could not conceivably be achieved* without that harm occurring. If the harm is functionally indispensable to the plan’s success, it is intended as a means—not merely foreseen.

  1.  **Identify Truman’s Immediate Strategic Goal:**  
      Truman’s stated objective was to force Japan’s *immediate, unconditional surrender* to end the war. This is uncontroversial and non-question-begging.

  2.  **Identify the Mechanism of Action:**  
      The atomic bombs were chosen specifically because their *unprecedented, catastrophic impact on civilian populations* would (it was believed) shock the Japanese government into surrender. The destruction itself—the sheer scale of civilian death and suffering—was the instrument of coercion. As Secretary of War Stimson noted, the bomb’s power was meant to deliver a "terrible shock" that would make "profound psychological impression" on Japanese leadership.

  3.  **Apply the Functional Indispensability Test:**  
      *   **Counterfactual:** Could Truman’s goal (shocking the government into immediate surrender) have been achieved if the bombs had been dropped but *no civilians died*?  
          *   If the bombs had detonated harmlessly (e.g., over unpopulated areas or miraculously caused no casualties), the "shock" and "psychological impression" necessary to compel surrender *would not have occurred*. The destruction of life and infrastructure *was* the shock.
      *   **Necessity:** The civilian deaths were not an accidental byproduct of targeting legitimate military objectives (like factories or troop concentrations). The *scale of civilian death and suffering itself* was the direct mechanism chosen to achieve the shock and awe required for surrender. Truman and his advisors understood that the weapon’s effectiveness *depended* on its ability to inflict mass civilian casualties and societal devastation.

  4.  **Blocking Redescription:**  
      *   **"Intending Shock, Not Death"**: Redescribing the intention as "merely intending to shock the government" fails. The *means* chosen to deliver that shock was *mass civilian death*. The shock is not separable from the deaths; the deaths *constitute* the shock in this plan. Intending the shock *via this mechanism* just *is* intending the deaths as the instrumental means. If one intends E (surrender) by intending M (shock), and M *necessarily requires* C (civilian deaths), then one intends C.
      *   **"Intending to Destroy War Production"**: This redescription is historically inaccurate. Hiroshima and Nagasaki were chosen not primarily for industrial targets (which were dispersed), but as intact cities to *demonstrate the bomb’s full destructive potential on a civilian center*. The goal wasn't production disruption per se; it was the *demonstration of overwhelming, society-shattering force* targeting civilians to break the enemy's will. Destroying production was a secondary effect, not the primary mechanism for surrender.

  ### Why This is Principled and Non-Question-Begging
  *   **Focus on Plan Structure:** It analyzes the *internal logic* of the agent’s plan, not the moral quality of the act. It asks: "Within this plan, is harm H a *constitutive element* necessary for achieving sub-goal S, which is itself necessary for ultimate goal G?" If yes, H is intended as a means.
  *   **Empirical Basis:** The test relies on historical facts about Truman’s goals and the rationale for using the atomic bombs on cities (as documented in the Target Committee minutes, Stimson’s diaries, Truman’s statements). It doesn’t presuppose "murder"; it identifies the functional role of civilian deaths within the plan.
  *   **Counterfactual Clarity:** The counterfactual test ("Could S be achieved without H?") provides a clear, objective criterion. If the answer is "no" (as it demonstrably is here – no deaths = no shock = no immediate surrender via this mechanism), then H is intended.
  *   **Avoids Semantic Manipulation:** It prevents redescription by anchoring intention in the *causal necessity* of the harm for the plan’s success, not in verbal formulations. One cannot redescribe the act as "intending shock without death" because the death *is* the shock in the actual plan. The description must match the *chosen causal pathway*.

  ### Conclusion: Preserving Anscombe’s Verdict
  By this principled criterion, Truman intended the deaths of Japanese civilians. The deaths were not a regrettable side effect of destroying military infrastructure or coercing the government *in general*. They were the *very instrument* chosen to coerce the government – the mechanism was the infliction of mass civilian casualties to create terror and despair sufficient to force surrender. This functional indispensability within the chosen plan makes the deaths intended as a means. Therefore, according to the Doctrine of Double Effect (DDE), the action cannot be justified under DDE’s prohibition on intending evil as a means. Anscombe’s verdict that it was murder, not a permissible act of war, stands, blocked against the closeness problem by focusing on the *necessity* of the harm within the agent’s own plan.
