answer: |-
  ## MEMORANDUM  
  To: Academic Integrity Board Members  
  From: [Your Name], Student Representative  
  Date: October 26, 2023  
  Subject: Recommended Evidentiary Standard for AI-Detector Scores & Analysis of "Calibration is Enough" Position  

  **Background:**  
  Our Board must determine whether a "98% confidence" AI-detection score (where 98 of 100 flagged essays are truly AI-generated) can *alone* establish a violation of academic integrity. Two principled positions exist:  

  1.  **"Calibration is Enough":** The detector's statistical reliability suffices. If we accept its calibration, a 98% score means it is 98% likely the *specific* essay is AI-written. Requiring more evidence ignores validated science and imposes an unrealistic burden.  
  2.  **"Innocent Error is Certain":** Treating the score as conclusive *guarantees* false convictions over time (2% of flagged cases). Due process requires individualized assessment; we cannot knowingly adopt a rule where innocence is statistically precluded from exoneration.  

  Chair [Name]'s acknowledgment that past Board verdicts likely include errors underscores the gravity of this trade-off.  

  **Engaging "Calibration is Enough" Seriously:**  
  Proponents rightly emphasize the detector’s objective reliability and the impracticality of demanding direct evidence (e.g., witnessing contract cheating). In a purely statistical sense, *for the cohort of flagged essays*, 98% are violations. The concern is pragmatic: rejecting this efficiency seems to demand proof we cannot reasonably obtain.  

  **The Core Challenge:**  
  The 98% reflects *aggregate* accuracy, not *individual* certainty. For any *single* student (S), the score means: "If 100 students like S are flagged, 98 are guilty." It does *not* mean: "There is a 98% probability S is guilty." This distinction is fundamental in formal epistemology and jurisprudence. Relying solely on the score treats S not as an individual, but as a member of an error-prone cohort. While aggregate accuracy is high, the Board cannot identify *which* 2% are errors *without additional context*.  

  **Recommendation: "Clear and Convincing Evidence" Standard with AI-Detector Scores**  
  I propose we adopt the following rule, balancing statistical validity with individual fairness:  

  > *"An AI-detection score indicating ≥98% confidence may constitute* **probative evidence** *of a violation. However, it cannot be the* **sole basis** *for a finding of responsibility. The Board must require* **supplementary evidence** *sufficient to meet the 'clear and convincing evidence' standard, viewed holistically.*  
  >  
  > *Supplementary evidence may include, but is not limited to:  
  > - Significant deviation from the student’s prior writing style/vocabulary/complexity;  
  > - Inconsistencies within the essay (e.g., mismatch between argument sophistication and factual errors);  
  > - Inability to explain or discuss core concepts/arguments from the essay;  
  > - Discrepancies in timestamps, drafting history, or source access logs;  
  > - Corroborating witness testimony (used cautiously)."*  

  **Why This Standard?**  

  1.  **Acknowledges the Detector's Value:** The high-confidence score is powerful evidence and shifts the burden appropriately to the student to provide a credible explanation. It significantly raises the threshold for exoneration.  
  2.  **Prevents Known False Convictions:** By requiring *some* individualized corroboration, we introduce a safeguard against the inevitable errors inherent in the detector's 2% false positive rate. This upholds the principle that we should not knowingly convict the innocent, even rarely.  
  3.  **"Clear and Convincing" is Appropriate:** This standard ("highly probable," more than "preponderance" but less than "beyond reasonable doubt") fits the severity of academic integrity violations and the probabilistic nature of the primary evidence. The supplementary evidence need not be conclusive alone but must bridge the gap from aggregate statistics to individual likelihood.  
  4.  **Manages Practicality:** Faculty aren't required to conduct forensic investigations. The supplementary evidence often emerges naturally: stylistic anomalies are noticed during grading; discussing the work is a standard pedagogical tool. The rule formalizes considering these factors *alongside* the detector score.  
  5.  **Aligns with Epistemic Responsibility:** It compels the Board to look beyond the algorithm and engage in reasoned judgment about the *specific* case, satisfying the core due process concern without dismissing the detector's scientific validity.  

  **Addressing "Calibration is Enough" Pragmatically:**  
  This standard *incorporates* the detector's calibration as the primary pillar of evidence. It accepts that a 98% score creates a strong presumption of guilt. The supplementary evidence requirement is deliberately flexible. It recognizes that while the detector identifies high-risk cases, human judgment remains essential to distinguish the 98% from the 2% *in practice*, ensuring verdicts are based on the "clear and convincing" guilt of the *individual*, not just their membership in a statistical group. No one disputes the detector flags genuine violations with high frequency; this policy ensures we only sanction those violations where *other indicators align*, minimizing institutional injustice.  

  **Conclusion:**  
  Adopting a rule that treats a 98% AI-detection score as *necessary but not sufficient* evidence respects both the tool's statistical power and our ethical obligation to minimize false convictions. It provides faculty with a clear, actionable path forward while upholding the Board's commitment to fair individual assessment. I urge the Board to adopt this "preponderance-plus" standard, leveraging the detector's strengths while mitigating its inherent limitations.  

  I look forward to discussing this at our next meeting.
