prompt: |-
  This term, in my seminar on the metaphysics of propositions, we have been working through Bradley's regress and Frege's attempt to defuse it with the doctrine of unsaturated concepts, and I would like to examine the exchange in more depth than my notes allow. Write a dialogue between two philosophers: one convinced that treating the concept in a proposition like "Socrates is wise" as essentially unsaturated blocks the regress and secures the proposition's unity, and one convinced that this move only relabels the very thing that needed explaining. Have the skeptic press two objections. First, Frege's own "concept horse" problem suggests that we cannot even refer to an unsaturated concept without thereby treating it as a saturated object, which throws doubt on whether the saturated/unsaturated distinction is anything more than a fact about grammar. Second, if brute, unexplained "saturation" counts as an acceptable stopping point, a relation theorist could have stopped Bradley's regress in exactly the same brute way for ordinary relations, so it is unclear that Frege has bought anything beyond a new vocabulary. The Fregean should have genuine, non-question-begging responses to both objections rather than simply restating the doctrine. Let the two of them actually engage with each other's last point as the exchange develops, and end with the disagreement sharpened rather than resolved.
reasoning: |-
  We are to write a dialogue between two philosophers: a Fregean (let's call her Freya) and a Skeptic (let's call him Soren). The topic is Bradley's regress and Frege's solution via unsaturated concepts. The skeptic will press two objections: the "concept horse" problem and the charge that Frege's solution is just relabeling without real progress.

  Structure:
  1. Freya presents Frege's solution to Bradley's regress: the unsaturated concept as the glue that unifies the proposition without needing a further relation.
  2. Soren objects with the "concept horse" problem: we cannot refer to an unsaturated concept without turning it into a saturated object, so the distinction might be merely grammatical.
  3. Freya responds to the first objection.
  4. Soren then objects that Frege's "saturation" is no better than the relation theorist's brute stopping point, so it's just a new vocabulary without progress.
  5. Freya responds to the second objection.
  6. They engage back and forth, ending with the disagreement sharpened.

  Let's begin.

  Characters:
  - Freya: Defends Frege's unsaturated concepts as blocking Bradley's regress.
  - Soren: Skeptical that Frege has solved the problem; thinks it's relabeling or merely grammatical.

  Setting: A philosophy seminar room after class.

  Dialogue:

  **Freya:** So, as we discussed, Bradley's regress shows that if we think of a proposition as composed of independently existing entities — like Socrates and wisdom in "Socrates is wise" — then we need a relation to bind them. But then we need another relation to bind that relation to the terms, and so on ad infinitum. Frege's brilliant move was to recognize that the concept (like 'is wise') is essentially unsaturated. It has a gap that the object (Socrates) fills. So the unity of the proposition is internal to the concept; no external relation is needed.

  **Soren:** I see the appeal, but I'm not convinced. Let me start with what I'll call the "concept horse" problem. Frege himself noted that when we try to talk about a concept, like in "The concept horse is a concept", we end up referring to an object, not the concept itself. Because the very act of referring to it saturates it. So if we can't even refer to an unsaturated concept without turning it into a saturated object, how can we be sure that the saturated/unsaturated distinction is anything more than a feature of our language? Maybe it's just a grammatical artifact and doesn't tell us about the real metaphysical structure.

  **Freya:** That's a fair challenge. But note that Frege's point about the concept horse is a semantic one, about how we refer in language. The distinction, however, is primarily ontological. The concept itself, in the world, is unsaturated. Our language struggles to capture this because language is made up of names, which are saturated. But that doesn't mean the distinction isn't real. We can still use language to gesture at the concept by saying things like "what 'is wise' stands for" and then note that it is predicative in nature. The ineffability in direct reference doesn't undermine the ontological distinction.

  **Soren:** But if we can't directly talk about or refer to the unsaturated concept without saturating it, then how can we even assert that it exists in this unsaturated form? It seems like we're trapped in language. And if that's the case, then the unity of the proposition becomes a linguistic unity, not a metaphysical one. But Bradley's regress is a metaphysical problem about how entities combine. So Frege's solution, if it's just about grammar, doesn't touch the metaphysical core.

  **Freya:** I disagree. The fact that our language has limitations doesn't mean that the world must conform to those limitations. We can have a theory about the world that posits entities of different metaphysical categories. The unsaturated concept is one such category. We can know it by its functional role: it is what predicates. And when we use it in a proposition, we are not naming it but employing it. That employment is what unifies the proposition. The regress is blocked because the concept is not an entity that needs to be related to the object; it is by its nature something that applies to an object.

  **Soren:** Alright, let me grant for argument's sake that we can make sense of the ontological distinction. But then I have a second worry. Suppose a relation theorist, defending the traditional view that a proposition is a complex of objects and relations, says: "Look, I can just stipulate that the relation doesn't need a further relation to connect to the objects; that's just how relations work. They are essentially relational entities." That would be a brute stopping point. But then, if you allow brute facts about saturation — that an unsaturated concept just saturates when an object is plugged in without further explanation — then why isn't that equally brute? And if both are brute, then Frege hasn't bought anything except a new vocabulary for the same brute fact.

  **Freya:** The difference is that the relation theorist is positing a saturated entity — the relation — that then needs to be connected to other saturated entities. But if the relation is saturated, then it's just another object, and we are back to needing a relation to connect it to the other objects. So the regress starts. But the unsaturated concept is not a saturated entity. It is incomplete, and that incompleteness is what allows it to naturally bind with an object without an intermediary. So it's not brute in the same way; it's a fundamental difference in kind.

  **Soren:** But isn't "saturation" — the act of plugging the object into the concept — exactly the brute fact? You say it's natural because the concept is incomplete, but that's just restating the doctrine. Why should we think that an incomplete entity can "complete" with a complete one without a further mechanism? It seems you're just replacing the relation theorist's brute "relating" with your brute "saturating". And you haven't explained why one is more acceptable than the other.

  **Freya:** Because the relation theorist's brute relating is arbitrary. Why should a relation, which is just another object, relate to other objects? There's no intrinsic reason. But for the unsaturated concept, saturation is built into its very nature. It is defined by its need for an object. So it's not arbitrary; it's essential. The regress is blocked because the concept is not waiting for a relation to connect it to the object; it is, by its essence, directed towards objects.

  **Soren:** But then you are just positing a special kind of entity with a built-in "directedness". But the relation theorist could equally posit a relation with built-in "relationality". So again, it seems like a distinction without a difference. And if you say that the unsaturated concept is essentially predicative, that's just to say that it's the kind of thing that applies to objects. But then we can ask: what is this "application"? How does it happen? If you say it's primitive, then we are at the same stopping point as the relation theorist. If not, then we start the regress again.

  **Freya:** The difference is that the unsaturated concept's application is not an additional entity. It is the concept itself in action. The relation theorist, however, has the relation as one entity and then the relating as an additional fact. That's what generates the regress. For Frege, there is no additional fact beyond the concept and the object coming together in the way that the concept demands.

  **Soren:** But that's exactly what the relation theorist would say: the relating is not an additional entity but the relation in action. So it seems we are at an impasse. You are claiming that your account avoids the regress by having a built-in mechanism, but the relation theorist can make the same claim. And if both are equally brute, then Frege's move doesn't solve the problem; it just reframes it. And that reframing comes at a cost: the mysteriousness of unsaturated entities that we cannot even refer to without distortion.

  **Freya:** I think you are missing the point. The relation theorist's relation, being saturated, cannot be "in action" without a further mechanism. But the unsaturated concept, by being incomplete, is inherently active. It is predicative by its very being. So the unity is not an extra fact; it is the manifestation of the concept's nature when supplied with an object.

  **Soren:** But what does "inherently active" mean? It seems like a metaphor. And when we try to cash it out, we either get a brute fact or a regress. I don't see how Frege has escaped the dilemma. So I remain unconvinced that unsaturated concepts do any more than relabel the problem.

  **Freya:** Then we must agree to disagree. For me, the unsaturated concept is a fundamental category that explains unity. For you, it's a label for the same mystery. But I think without it, we have no way to stop the regress.

  **Soren:** And with it, we have no way to explain how it stops. So the disagreement stands, and perhaps it's a matter of which primitive one is willing to accept.

  **Freya:** Indeed. But I'll take the primitive that at least respects the logical structure of predication.

  **Soren:** And I'll remain skeptical that we've made any real progress.

  [End]
answer: |-
  ### Dialogue: Frege’s Unsaturated Concepts vs. Bradley’s Regress  
  **Characters:**  
  - **Freya**: A defender of Frege’s unsaturated concepts as a solution to Bradley’s regress.  
  - **Soren**: A skeptic who argues that Frege’s move merely relabels the problem without resolving it.  

  **Setting**: A university common room after a seminar. Coffee cups clutter the table as Freya and Soren continue their debate.  

  ---

  **Freya**: Let’s return to Bradley’s regress in "Socrates is wise." If we treat "Socrates" and "wise" as independent entities, we need a relation to unite them—but then we need another relation to bind that relation to the terms, and so on infinitely. Frege blocks this by arguing that "is wise" isn’t a complete entity at all. It’s an *unsaturated concept*—a predicative function with a "gap" that Socrates saturates. The unity isn’t imposed from outside; it’s intrinsic to the concept’s unsaturated nature. No regress begins.  

  **Soren**: I’ll grant that this *sounds* elegant, but I’m unconvinced it does real work. Start with Frege’s own "concept horse" paradox. When we say, "The concept *horse* is a concept," we refer to it as a saturated object—a thing—not as an unsaturated concept. This suggests the unsaturated/saturated distinction is just grammatical. We can’t even *refer* to an unsaturated concept without reifying it into an object, so how can it be a robust metaphysical category? It seems like wordplay.  

  **Freya**: That’s a misstep. The "concept horse" problem is about *language*, not metaphysics. Language forces us to use saturated expressions (like names) to discuss concepts, but that doesn’t mean concepts themselves aren’t unsaturated. When we deploy the concept in a proposition—e.g., using "is wise" predicatively—we’re not referring to it as an object; we’re *employing* it in its unsaturated mode. The distinction is ontological: unsaturated concepts are fundamentally predicative, while objects are referential.  

  **Soren**: But if we can’t access or describe the unsaturated concept *as unsaturated* without saturating it linguistically, how do we know it’s not just a feature of grammar? Metaphysics requires more than ineffable gestures. Bradley’s regress arises because entities don’t unify themselves—they need a "glue." If Frege’s "unsaturated" is just a label for "this thing glues without glue," it doesn’t explain *how*; it papers over the mystery.  

  **Freya**: It’s not mere labeling! The unsaturated concept’s incompleteness is its essence. When Socrates saturates it, no further "glue" is needed because saturation isn’t an external relation—it’s the concept functioning *as it is*. Think of a function in mathematics: f(x) = x² isn’t incomplete because it’s missing a relation; it’s *defined* to require an argument. Likewise, "is wise" is defined to require an object.  

  **Soren**: Fine—but that brings me to my second objection. Suppose a relation theorist (say, a Russellian) posits a brute "relating relation" to stop Bradley’s regress. They say: "The relation *instantiates* just binds Socrates and wisdom—no further relations needed." If you reply that "brute saturation" is acceptable for Frege, why isn’t "brute relating" acceptable for them? Frege seems to have just swapped "relation" for "saturation" without gaining ground.  

  **Freya**: Because the relation theorist’s "relating relation" is saturated! If relations are objects—as Bradley assumes—then they’re inert. A saturated relation can’t *do* anything without a further unifier. But unsaturated concepts aren’t objects; they’re *act*\-like. Saturation is their internal mode of operation. It’s not "brute" in the same way—it’s essential to their identity.  

  **Soren**: But now you’re helping my case. If "saturation" is primitive—an unexplained stopping point—then the relation theorist could have made *their* "relating" primitive too. You’re privileging Frege’s brute fact over theirs. And if both are brute, Frege’s "unsaturated" is just a relabeling of the relation theorist’s "relation." You haven’t escaped the regress; you’ve rebranded it.  

  **Freya**: No—the difference is structural. The relation theorist needs a *third thing* (a relation) to bind two entities. But in Frege’s picture, there are only two elements: the saturated object and the unsaturated concept. The concept’s unsaturatedness *is* the binding mechanism. There’s no "third wheel" to trigger a regress.  

  **Soren**: Ah, but now you’re conflating metaphysics with bookkeeping! If I analyze "Socrates is wise" as [Socrates] + [wisdom] + [instantiation], you say Frege reduces it to [Socrates] + [___is wise]. But the "gap" in your concept is functionally identical to the relation theorist’s "slot" for an object. Both require a brute combinatorial power. Call it "saturation" or "relating"—it’s the same explanatory void. And Frege’s "concept horse" problem shows we can’t even isolate this "power" without objectifying it.  

  **Freya**: You’re ignoring the *direction* of dependence. For the unsaturated concept, saturation isn’t an added power—it’s constitutive. Without an object, the concept doesn’t exist as a unified entity; it’s potential, not actual. For the relation, binding is contingent—it might or might not "relate." That’s why Bradley’s regress bites: relations don’t intrinsically demand saturation.  

  **Soren**: But if saturation is "constitutive," why can’t the relation theorist say relating is "constitutive" of relations? Either way, you’re positing a basic, unanalyzable feature. Frege’s move only *seems* deeper because he builds unity into one element (the concept) rather than adding a third. But metaphysically, it’s the same stopgap. And your "potential" vs. "actual" distinction—doesn’t that invite a new regress? What "actualizes" the potential?  

  **Freya**: The object actualizes it! But not via a relation—via the concept’s unsaturated structure. You’re demanding an explanation where none is needed. Some things are bedrock.  

  **Soren**: Exactly—and if *Frege’s* bedrock is acceptable, why not the relation theorist’s? Frege’s "unsaturated" is just bedrock with a German accent. The disagreement boils down to this: you think predicative essence blocks the regress; I think it’s a circular dodge. We’ve sharpened the issue but not settled it.  

  **Freya**: Agreed—we’re at an impasse. I see unsaturated concepts as revealing the structure of thought; you see them as verbal sleight-of-hand. But without them, Bradley’s regress stands, and propositions crumble.  

  **Soren**: And with them, we have an inexplicable "saturation" that looks suspiciously like the brute "relating" we started with. So the regress remains, now in Fregean garb.  

  ---  
  **End**  
  *The disagreement is sharpened: Freya maintains that unsaturated concepts provide an essential, non-relational unity by their very nature, while Soren argues that "saturation" is merely a renamed brute fact, no better than the relation theorist’s stopping point and undermined by the ineffability of unsaturated concepts.*
