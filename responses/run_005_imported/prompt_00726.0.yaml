  The key is that Tolstoy's theory has two layers: the definition of art (emotional infection) and the evaluation of its moral value (religious perception). He separates "art as art" from "good art." The user's quote shows Tolstoy acknowledging that the infection strength defines art's quality as art, but then he argues that for art to be good, it must convey the right feelings. 

  So the reconciliation lies in this hierarchy: first, something must be art (infectious), then it can be judged as good or bad based on content. The user might have missed this distinction because Tolstoy transitions from descriptive to prescriptive. 

