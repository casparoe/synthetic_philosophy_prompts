prompt: |-
  So this is a random request but my senior year philosophy elective teacher, Ms. Alvarez, is getting married in a few weeks and picked five of us from class to each say a little something at the reception. Back in the fall she assigned us chunks of Bertrand Russell's Marriage and Morals for our ethics unit and never shut up about it after that, so it's kind of a running joke with us now and I really want to reference it in my toast. Problem is, the actual content isn't exactly toast-friendly: Russell argued jealousy is basically a bad habit you're supposed to train yourself out of, not some natural feeling you're supposed to protect, he was into something like "trial marriages" before people commited for good, and he straight up says an affair doesnt have to end a marriage as long as everyone stays honest and still raises the kids together. Ms. Alvarez's favorite detail to bring up is that Russell couldn't even live up to his own theory -- he got so jealous over his second wife having a baby with another guy during their supposedly open marriage that it basically helped end it. I don't want the safe "cute old philosopher who believed in love" version, but I also can't get up there next to her grandma and the groom's coworkers and start explaining why she shouldn't care if he ever cheats, lol. Can you write the actual toast (like 2 minutes out loud) so it uses the real Russell material in a way that's warm and sincere and funny for the philosophy kids, but still works for the half of the room who has no idea who he is and doesn't end up sounding like relationship advice for the couple?
