  They're not overthinking - this is genuinely complex. The non-identity problem has divided ethicists for decades. Their situation adds concrete stakes to abstract debates about existence versus harm. I should acknowledge both the logical validity of their friend's point AND why selection remains ethically defensible. Key angles to cover: comparative welfare (lives worth living vs lives not worth starting), parental obligations, and distinguishing between harm to a person versus creating a person with harmful conditions.

