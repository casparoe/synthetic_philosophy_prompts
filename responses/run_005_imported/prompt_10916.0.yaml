  First, I need to recall Thomson's lamp. It's a supertask where a lamp is toggled infinitely many times within a finite time: on at t=0, off at 0.5 min, on at 0.75, and so on. After one minute, is it on or off? Jordan's argument uses the convergence of time intervals and parity. Since the lamp starts off (even state), after an infinite number of toggles (odd), it should be on. But why is this controversial?

  The key issue here is the difference between the convergence of time intervals and the behavior of the lamp's state. While the times converge to t=1, the state sequence doesn't converge. Each flip alternates the state, so the sequence is (on, off, on, off, ...), which doesn't settle to a limit. The infinite series sum explains the time, but the state is a separate function. 

  Mathematically, the state function isn't defined at t=1 because the limit doesn't exist. The left-hand limit doesn't exist since it oscillates. So defining the state at t=1 requires an arbitrary choice, which is the crux of the paradox. Philosophers debate whether such a supertask is possible or if it leads to indeterminacy.

  Jordan's parity argument assumes that an infinite number of toggles (odd) flips the state from initial off to on. But infinity isn't a number; it's a limit. The parity of an infinite set isn't defined like finite sets. Saying "infinite toggles, so odd" doesn't hold because infinity isn't odd or even. 

  The user might be confused about why mathematicians and philosophers treat this differently. Mathematically, the state at t=1 is undefined. Philosophically, it questions if supertasks are possible or if they lead to contradictions, challenging concepts of infinity and physical realizability.

