prompt: |-
  Okay so lately I've been messing around with Coq for a hobby project (I'm self-taught, no CS or math degree, just curious) and I kept hitting this thing where "proof by contradiction" doesn't just work the way it did in school math - like `P \/ ~P` isn't automatically true, and double negation elimination isn't a thing unless you specifically import some classical axiom. Turns out the logic under the hood is "intuitionistic" by default, not classical, and I went down a rabbit hole trying to figure out WHY anyone thinks this is the right way to do math/logic in the first place, instead of it just being a quirk of how Coq happens to be built. I've read four or five different explanations now and they all gesture at kind of different reasons: one says its because proofs are secretly programs, so an "exists" proof has to actually hand you the object instead of just showing its non-existence would be contradictory; another brings up a philosopher named Dummett who says meaning is tied to what can be verified, not to some free-floating notion of truth; another just traces it back to Brouwer's original idea that math objects only exist once your mind has actually built them step by step; and one blog mentioned Poincaré and Weyl being worried about "impredicative" definitions causing paradoxes like Russell's. I honestly can't tell anymore if these are basically 4 versions of the same underlying insight, or genuinely separate arguments that just happen to land on the same rule (ditch the law of excluded middle).

  Could you rank these four justifications - proofs-as-programs, Dummett's verification/anti-realist semantics, Brouwer's mentalist constructivism, and Poincaré/Weyl-style predicativism - from strongest to weakest, judged purely on how good an actual ARGUMENT each one gives for rejecting the law of excluded middle/classical logic, as opposed to being more like "historically hung out with intuitionism" without really implying it? I don't need a full essay, just your ranked take with a sentence or two of reasoning at each spot. Please format the answer as a JSON block like this:

