  The user wants arguments that directly justify rejecting LEM, not just historical associations. Proofs-as-programs provides a concrete computational foundation—if a proof must build an object, assuming LEM without construction is invalid. That's strong. Dummett's verificationism argues that truth requires verification, so LEM's unverifiable nature makes it meaningless. Brouwer's constructivism is foundational but more metaphysical; it's less about logic per se and more about math as mental activity. Predicativism focuses on avoiding circular definitions, which relates to set theory paradoxes but doesn't inherently forbid LEM unless combined with constructivism.

  Ranking: Proofs-as-programs is strongest because it's tied to practical computing. Dummett next, as semantics-based. Brouwer third for foundational but abstract reasons. Predicativism weakest since it's more about definitions than LEM directly. Got it.
