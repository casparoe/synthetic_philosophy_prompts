  - If you are a one-boxer (meaning you would take only B even when you see it full), then the predictor fills B and you get $1,000,000 by taking only B.
  - If you are a two-boxer (meaning you would take both boxes when you see B full, or if you see B empty you might still take both? But note: if B is empty, taking both gives you $1,000. But the predictor's rule only applies to the case when it is making a prediction about what you would do if B were full? Actually, the predictor is making a prediction about what you would do in the situation you are in. The problem states: "it fills B only if it predicts that you would take just B even after seeing it full." So if it predicts you would two-box when B is full, it leaves B empty.

