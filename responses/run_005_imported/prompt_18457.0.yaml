answer: |-
  ## The Devadatta Dilemma: Is Arthapatti a Distinct Pramana?

  The debate between the Naiyāyikas (champions of Nyāya logic) and the Mīmāṃsakas (exegetes of Vedic ritual) over *arthāpatti* ("postulation" or "presumption") cuts to the heart of how we resolve epistemic gaps. Is it merely a clever repackaging of inference (*anumāna*), or does it represent a unique cognitive operation demanding its own category? Let's dissect the strongest arguments on both sides before rendering judgment.

  **I. The Mīmāṃsaka Case: Arthāpatti as Irreducible Necessity**

  The Mīmāṃsakas, particularly the Bhāṭṭa school (Kumārila Bhaṭṭa), argue vehemently for *arthāpatti*'s distinctness. Their case rests on phenomenology and logical structure:

  1.  **The Phenomenology of Inexplicability:** The core trigger for *arthāpatti* isn't a *correlation* seeking application (like seeing smoke and inferring fire), but an *incoherence* demanding resolution. We directly apprehend Devadatta's fatness (*pratyakṣa*). We directly apprehend (or reliably testify to) his non-eating during the day (*pratyakṣa* or *śabda*). These two facts, taken together, create a jarring contradiction (*virodha* or *anupapatti*) within our understanding of the world: *How can someone be fat without consuming sufficient food?* This lived experience of cognitive dissonance is fundamentally different from observing a middle term (smoke) and recalling a universal connection.
  2.  **Absence of Pre-existing Vyāpti (Universal Concomitance):** This is the crux. *Anumāna* absolutely requires a known, prior *vyāpti* – the invariable connection between the reason (*hetu*, e.g., smoke) and the conclusion (*sādhya*, e.g., fire). In the Devadatta case, what is the *vyāpti*? "All fat people who don't eat during the day eat at night"? This isn't something we know *beforehand* through perception, inference, etc. We arrive at the *need* for night-eating precisely *because* we lack any such established rule explaining the fatness. *Arthāpatti* operates precisely where established *vyāpti* fails us.
  3.  **The Uniqueness of the Operation:** *Arthāpatti* doesn't *apply* a known rule; it *generates* the only plausible explanation to *remove* the contradiction. It's a process of elimination driven by necessity: "Devadatta is fat; he doesn't eat during the day; the *only way* fatness can exist without daytime eating is if he eats at night; therefore, he eats at night." The conclusion isn't *probable* based on a correlation; it's *necessary* to restore coherence. The mind isn't recalling a universal; it's *postulating* one to resolve an anomaly.
  4.  **Non-Redundancy:** Reducing *arthāpatti* to *anumāna* requires manufacturing a *vyāpti* ("Absence of daytime eating + Fatness implies night-eating") *after the fact*. But this manufactured *vyāpti* is itself *derived* from the process of resolving the initial contradiction. It begs the question: the *vyāpti* needed for the inference is only justified *by* the *arthāpatti* itself. Therefore, *anumāna* cannot account for the *origin* of this knowledge; it can only formalize it *post hoc*.

  **II. The Naiyāyika Counter: The Ubiquity of Inference**

  The Naiyāyikas (like Gaṅgeśa) and their Buddhist counterparts (like Dharmakīrti) wield Occam's Razor: why multiply entities beyond necessity? *Anumāna* is robust and flexible enough to subsume *arthāpatti*:

  1.  **The Vyāpti is Always Present (or Constructible):** They argue the necessary universal connection *is* implicitly known or readily constructible based on fundamental causal principles and experience.
      *   **Causal Principle:** We know fatness (*sādhya*) requires food intake (*hetu*). This is a basic causal law derived from perception and inference.
      *   **Application:** We perceive Devadatta's fatness (Pakṣa - the subject). We know food intake is the cause (Vyāpti: Fatness is invariably caused by sufficient food intake). We observe the absence of daytime eating (a negative *hetu*). The *only* way sufficient food intake can exist without daytime eating is if it occurs at night. Therefore, we infer night-eating.
  2.  **"Inexplicability" is Just an Unusual Hetu:** The feeling of "inexplicability" isn't a unique *pramāṇa*; it simply signals that the available data (fatness + no daytime eating) *is* the unusual reason (*hetu*) triggering the inference based on the fundamental causal *vyāpti*. The contradiction *is* the middle term.
  3.  **Reduction Avoids Proliferation:** Nyāya's commitment to four *pramāṇas* is parsimonious. If every subtle variation in cognitive process demanded a new *pramāṇa*, the list would be endless (e.g., memory, intuition, etc.). *Arthāpatti*'s structure perfectly fits the inference mold: subject (Devadatta), property to be proven (night-eating), reason (fatness combined with absence of daytime eating), universal connection (fatness requires sufficient food intake), and the application of that connection to the subject.
  4.  **The Danger of Subjectivity:** Framing *arthāpatti* as resolving "inexplicability" risks subjectivity. What seems inexplicable to one might be easily explained by another with broader knowledge. *Anumāna*, grounded in *vyāpti*, provides a more objective, rule-based foundation. The Naiyāyika reconstruction provides a verifiable logical structure.

  **III. Judgment: Arthāpatti Stands Apart**

  While the Naiyāyika reduction is elegant and demonstrates the pervasive power of inference, the Mīmāṃsaka position on *arthāpatti*'s distinctness is ultimately more persuasive. Here's why:

  1.  **The Primacy of the Anomaly:** The *starting point* and *driving force* of *arthāpatti* is fundamentally different. Inference starts with an observation linked to a known universal. *Arthāpatti* starts with a *contradiction* between known facts that *lacks* an established explanatory universal. The cognitive *need* is not to apply a rule, but to *discover* or *postulate* the rule that resolves the incoherence. This is a distinct epistemic *gestalt*.
  2.  **The Manufactured Vyāpti is Epiphenomenal:** The Naiyāyika is correct that a *vyāpti* can be formulated *after* the *arthāpatti* resolves the contradiction. However, this formulation *depends* on the success of the postulation. The *knowledge* of Devadatta's night-eating arises *from* the process of eliminating the contradiction, *not* from the prior application of the manufactured universal "Fat non-day-eaters must be night-eaters." The *vyāpti* is the *result* of the *arthāpatti*, not its *foundation*. Inference requires the *vyāpti* as a *premise*.
  3.  **Necessity vs. Probability:** *Arthāpatti*, in its paradigmatic cases like Devadatta, yields conclusions that feel *necessary* and *exhaustive* ("*only* night-eating resolves this"). While inferences can be deductively certain, the *source* of that certainty in *arthāpatti* is the elimination of alternatives to restore coherence, not the application of a pre-existing correlation. It's closer to *reductio ad absurdum* or abductive reasoning to the best (or only) explanation under constraint.
  4.  **Phenomenological Accuracy:** The Mīmāṃsaka description better captures the lived experience. Confronted with Devadatta's fatness and daytime abstinence, we don't calmly recall a universal rule; we experience puzzlement ("How is this possible?") which is resolved by a sudden insight ("Ah, he *must* eat at night!"). This "Aha!" moment of resolving an anomaly has a different quality than chaining through a known inference.

  **Commitment: Yes, Arthāpatti is a Genuinely Separate Pramana.**

  *Arthāpatti* cannot be fully reduced to *anumāna* without doing violence to its unique epistemic function and cognitive origin. It operates in the crucial gap where established correlations fail, leveraging the mind's intolerance for contradiction to postulate the missing premise necessary for coherence. While it shares logical similarities with inference and can often be *represented* syllogistically *after the fact*, its *generative mechanism* – resolving inexplicability through necessary postulation – marks it as a distinct *pramāṇa*. The Naiyāyika reduction, though ingenious, ultimately masks the genuine novelty of this cognitive operation under a reconstructed syllogism. The Mimamsakas rightly identified a fundamental way the mind bridges epistemic gaps when faced with the inexplicable like poor, puzzling Devadatta.
