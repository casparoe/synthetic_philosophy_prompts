  Paul's vampire thought experiment (where you must choose to become a vampire without knowing what it's like) is perfect for illustrating "choice without prediction," but mentioning vampires at a baby shower could be jarring. Maybe a veiled reference—like "adventures you can't preview"—would satisfy the lab without confusing others. 

  The toast must avoid two pitfalls: sounding like a downer (emphasizing the unknowability of parenthood) or retreating to empty platitudes. Instead, it should frame the transformation as positive—a courageous leap into self-discovery. The warmth comes from focusing on the friend's qualities (love, resilience) that make her capable of handling the unknown. 

  For structure: start with traditional praise, pivot to the transformation as exciting rather than scary, use "choose to discover" as the empowering resolution, and bury the vampire reference where only the lab would catch it. The closing should loop back to communal support—"we're here for you"—to soften the intellectual heaviness. 

  ...And definitely no direct mention of epistemic barriers. "You can't know yet" sounds cold; "you get to discover" turns it into an adventure.
