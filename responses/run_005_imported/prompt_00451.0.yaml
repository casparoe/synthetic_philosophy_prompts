  ## The Trojan Horse of Textualism: Bostock and the Unstable Edifice of "Plain Meaning"

  The Supreme Court's decision in *Bostock v. Clayton County* (2020) didn't just expand Title VII's protections; it detonated a conceptual bomb at the heart of statutory interpretation theory. Justice Gorsuch, wielding the banner of textualism, concluded that discriminating against an employee for being gay or transgender is inherently discrimination "because of... sex." Justice Alito's dissent, dripping with outrage, accused the majority of textualist cosplay, masking purposivism beneath a veneer of linguistic inevitability. This case isn't merely a puzzle; it's a crucible that reveals fundamental flaws in the neat dichotomy between textualism and purposivism, forcing us to confront whether "plain meaning" is a stable foundation or a rhetorical device ripe for manipulation. **Bostock demonstrates that textualism, rigorously applied, can yield progressive outcomes, but it simultaneously exposes the inherent subjectivity lurking beneath claims of linguistic neutrality, ultimately revealing purposivism as the more intellectually honest, though riskier, approach.**

  ### The Textualist Triumph: Gorsuch's "But-For" Logic
  Gorsuch's opinion is a masterclass in formalist textualism. He begins and ends with the statutory text: Title VII prohibits firing an individual "because of such individual’s... sex." His analysis hinges on a straightforward "but-for" causation test:

  1.  **The Comparative Test:** "If the employer intentionally relies in part on an individual employee’s sex when deciding to discharge the employee," then the decision is "because of" sex.
  2.  **The Inextricability Argument:** Discrimination based on sexual orientation or gender identity *necessarily* relies on sex. To fire a man for dating men (but not a woman for dating men) is to fire him *because* he is a man. Changing the employee's sex changes the outcome. Similarly, firing someone for identifying as a gender different from their sex assigned at birth relies on the biological sex they are departing from.

  Gorsuch explicitly rejects arguments rooted in:
  *   **Legislative Intent (Original Meaning):** He dismisses the 1964 Congress's likely understanding of "sex" as irrelevant. Textualism looks to the ordinary meaning *at the time of enactment*, but applies that meaning to new factual scenarios.
  *   **Consequences/Purpose:** He states the Court isn't deciding whether Title VII *should* protect LGBTQ+ individuals, only what its words *do*. He acknowledges the dissent's parade of horribles (bathrooms, sports, religious freedom) but insists these are policy questions for Congress, not interpretive ones for the Court.

  **The Strength:** Gorsuch's logic is elegant and internally consistent within his framework. It demonstrates textualism's potential to transcend political expectations. By focusing rigidly on the operation of the word "sex" in the phrase "because of," he bypasses debates about societal evolution or legislative foresight. This *is* textualism working as advertised: constraining judges by binding them to the enacted words, even when the outcome surprises or unsettles.

  ### The Purposivist Critique: Alito's "Trojan Horse"
  Alito's dissent (joined by Thomas) is a furious indictment of the majority's methodology, accusing it of being textualism in name only:

  1.  **The "Plane of Abstraction" Gambit:** Alito argues Gorsuch elevates the word "sex" to an absurdly high level of abstraction, divorcing it entirely from its understood meaning in 1964. "Sex" meant biological sex (male/female), period. Interpreting it to encompass sexual orientation and gender identity requires reading *vastly* more into the word than its ordinary meaning could bear.
  2.  **Ignoring Contextual Meaning:** Alito insists words derive meaning from context. The specific evils Congress sought to remedy in 1964 (pay discrimination, sexual harassment, restrictive job classifications based on biological sex) had nothing to do with sexual orientation or gender identity. Ignoring this context is not textualism; it's judicial legislation.
  3.  **The "Ordinary Meaning" Mirage:** Alito argues Gorsuch's "but-for" test isn't the ordinary meaning of "because of sex." The ordinary person in 1964 (or even today) hearing "fired because of sex" would understand it as "fired for being a woman" or "fired for being a man," not "fired for being a gay man" or "fired for being transgender." Gorsuch substitutes a hyper-technical, legalistic causation analysis for common understanding.
  4.  **Covert Purposivism:** Alito contends the majority achieves the outcome favored by modern purposivists (expanding protections) but does so by dressing it up in textualist garb, thereby illegitimately claiming the mantle of interpretive constraint. It's a "Trojan horse" – the outcome of living constitutionalism/purposivism smuggled inside the walls of textualism.

  **The Strength:** Alito exposes a critical vulnerability in textualism: **the selection of the relevant level of linguistic analysis is inherently discretionary and value-laden.** Gorsuch focuses narrowly on the *grammatical operation* of the word "sex" in a causation phrase. Alito focuses on the *semantic content* of the word "sex" within its historical and statutory context. *Which* "plain meaning" prevails? Textualism offers no neutral, mechanical rule for this choice. Gorsuch's chosen level of analysis (the but-for causation inherent in comparative sex-based treatment) *enables* the expansive reading. A different textualist, focusing on the ordinary referent of "sex" (biology), could reach Alito's conclusion. This choice point is where unacknowledged purpose or policy preference can creep in.

  ### Weighing the Scales: The Hollow Core of "Plain Meaning" vs. The Peril of Purpose

  *   **Textualism's Exposed Nerve:** Bostock proves textualism isn't inherently conservative. This is healthy for the theory. However, it fatally undermines textualism's core claim to provide *objective constraint* solely through linguistic analysis. Gorsuch's reasoning, while logical, depends entirely on accepting his specific framing of the linguistic question. His "plain meaning" is the meaning *of the causal structure he identifies*, not necessarily the plain meaning *of the word "sex" as understood in context*. Textualism cannot escape the hermeneutic circle – the meaning of the part depends on the whole, and vice versa. Choosing *which* whole (the isolated phrase, the statute, the societal context) to prioritize involves judgment. **Bostock reveals that "plain meaning" is not a discovered fact but a constructed interpretation, shaped by the interpreter's chosen lens.** This makes textualism vulnerable to the charge of being as malleable as purposivism, just with better camouflage.

  *   **Purposivism's Forthright Challenge:** Purposivism acknowledges the role of judgment. It asks: What problem was Congress trying to solve? What was the "mischief" the statute aimed to remedy? In 1964, that mischief was clearly discrimination against women (and men) based on biological sex. Extending it to sexual orientation/gender identity requires concluding that this *is* a sufficiently analogous form of sex-based discrimination to fall within the statute's *spirit*, even if unforeseen. This is inherently more expansive and risks judges imposing their own policy views under the guise of "evolving purpose." **Alito is right that Gorsuch achieved a purposivist end, but wrong that it was covert; Gorsuch's textualism *is* his purposivism – his chosen linguistic lens *serves* the functional purpose of updating the statute.** Purposivism's strength is its honesty about the need for value-laden judgments regarding statutory aims and contemporary relevance. Its weakness is the potential for judicial overreach, untethering interpretation too far from enacted text.

  ### The Verdict: Purposivism's Intellectual Honesty, Tempered by Textualist Discipline

  **Bostock compels the conclusion that purposivism, properly constrained, provides a more defensible general theory of interpretation than textualism.** Here's why:

  1.  **Acknowledges Reality:** Purposivism openly recognizes what Bostock proves textualism obscures: interpreting statutes *always* involves judgments about context, relevance, and the level of abstraction. Judges are not linguistic robots. Pretending otherwise (as textualism often does) creates a facade of objectivity that masks the underlying value choices, making judicial reasoning less transparent and accountable.
  2.  **Better Handles Evolution:** Statutes endure; the world changes. Textualism, in its purest form (focusing *only* on original semantic meaning applied mechanically), risks statutory obsolescence or absurdity when applied to unforeseen circumstances (like complex discrimination based on sex characteristics). Purposivism provides a framework (considering the statute's *aim*) for determining if new situations fall within the *reason* the law was passed, promoting the legislature's functional goals over a frozen semantic snapshot.
  3.  **The Constraint is Different (But Real):** Purposivism's constraint comes not from pretending language is mechanically clear, but from rigorously tying interpretation to *evidence* of legislative purpose (text, structure, history, the specific problem addressed) and requiring that extensions be genuine analogues to the original mischief. Gorsuch, ironically, had to *ignore* much of the original context to achieve his textualist result. A disciplined purposivist would grapple directly with whether LGBTQ+ discrimination is analogous to the core sex-based discrimination Congress targeted in 1964 – a harder, but more honest, question.

  **However, this is not a carte blanche for judicial will.** The line must be drawn firmly:

  *   **Text as Anchor:** Purpose must be derived *primarily from the statutory text and structure itself*, not external policy preferences. The words enacted are the supreme expression of legislative will.
  *   **Historical Context as Guide:** Understanding the specific problems Congress addressed is crucial for defining the core purpose. Purpose cannot be invented whole cloth.
  *   **Analogy Requirement:** Extending a statute to new situations requires a persuasive argument that the new situation is a logical analogue to the core evils Congress sought to remedy, based on the statute's own logic and framework. It cannot be based solely on a judge's view of contemporary justice.

  Bostock is Gorsuch's textualist triumph, but it's also textualism's epistemological defeat. It reveals that the search for a purely objective, mechanical "plain meaning" is a chimera. Meaning is constructed through interpretive choices about context and relevance – choices inherently influenced by conceptions of the statute's function and the judge's understanding of justice. Purposivism acknowledges this reality, demanding judges justify their interpretations based on the statute's discernible aims. Textualism, by pretending such choices don't exist or are purely linguistic, risks becoming an elaborate shell game. The defensible path forward isn't abandoning the text, but embracing interpretation as a reasoned, transparent argument about what the words, understood in light of their purpose and our world, *do*. Bostock didn't erase the line between textualism and purposivism; it showed us that the line was always drawn in sand, constantly reshaped by the tide of judicial judgment. The most honest approach is to acknowledge the tide and build our interpretive frameworks accordingly.
