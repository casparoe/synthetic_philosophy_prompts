answer: |-
  You've perfectly pinpointed the Achilles' heel of Armstrong's (and similar) "non-relational tie" solutions to Bradley's regress. Your friend's defense relies on the *stipulation* that the tie is fundamental and non-relational, but this stipulation doesn't *explain* how the tie achieves its unifying function. It merely asserts that it does, while simultaneously denying it the very characteristics (relationhood, internal structure) that might provide an explanation. Let's argue for your position:

  1.  **The Core Problem: Explaining Unity, Not Avoiding Regress:** The goal isn't just to *stop* the infinite regress; it's to *explain* how a particular (Socrates) and a universal (Sagacity) are genuinely unified into a single state of affairs (Socrates being sagacious) rather than merely being listed together (Socrates, Sagacity, Instantiation_Tie). Bradley's regress highlights that adding relations (like instantiation) *without explaining their unifying power* leads to absurdity. Armstrong stops the regress by fiat: "Instantiation isn't a relation needing a connector; it's a *sui generis* tie!" But *how* does this tie perform the unification?

  2.  **The Tie's Mysterious Unifying Power:** If the tie is genuinely non-relational, what is its mechanism? How does it "bind" or "unify"?
      *   **It Can't Be a Relational Glue:** If it acted like glue (a relational connector), it would *be* a relation, inviting the next step of the regress. Armstrong explicitly denies this.
      *   **It Can't Be Mere Juxtaposition:** If it's merely another entity alongside Socrates and Sagacity (Socrates, Sagacity, Tie), we have a list of three things, not a unified fact. The tie itself needs to be "tied" to Socrates and Sagacity, restarting the regress. The tie must *do* something *to* or *between* the terms.
      *   **What's Left?** The tie seems to possess a magical, unexplained property: "fact-constituting power." But labeling this power "fundamental" or "non-relational" doesn't elucidate *what this power is* or *how it operates*. It remains a brute, unexplained primitive.

  3.  **The Covert Reliance on Frege or Russell (The "Smuggling"):** When pressed to explain *how* the tie unifies without being relational, proponents often implicitly fall back on structures resembling Frege or Russell:
      *   **Fregean Smuggling (Unsaturatedness):** One might say the *universal* (Sagacity) is inherently "incomplete" or "gappy," and the tie is the act of "saturating" it with the particular (Socrates). But this *is* Frege's view! Armstrong explicitly rejects unsaturatedness for universals. If the tie *imparts* this unsaturated-like structure to the universal *in the act of binding*, it's functionally equivalent to Fregeanism but disguised within the "tie." The tie isn't a simple connector; it's enabling a specific logical structure (subject-predicate) *without acknowledging it*.
      *   **Russellian Smuggling (Relating as Unifying):** One might say the tie *just is* the relating – it *actively* connects the terms. But this *is* Russell's view (in his later work) that relations are not passive relata but active unifiers. Armstrong explicitly denies that his tie *is* a relation. If the tie is non-relational yet *performs the active unifying function of a relation*, it's functionally equivalent to Russell's active relating principle, but again, disguised within the "tie." It *is* relating, just called something else and stripped of the label "relation."

  4.  **The "Renaming" Charge: Primitive ≠ Explanatory:** Armstrong's move is essentially this: "The problem of how instantiation connects particulars and universals is solved by positing a primitive, non-relational connecting entity called 'instantiation'." This *is* renaming the problem. The original question was: "How does instantiation connect?" The "solution" is: "It connects via the Instantiation Tie." But the question immediately becomes: "How does *the Instantiation Tie* connect?" Saying "it just does, fundamentally" doesn't answer this; it merely *declares* the problem solved by placing a label ("fundamental tie") on the very point of mystery (the unifying connection). It replaces the regress with an *explanatory void* at the first step. The unity remains as unexplained as before; we've just been told we can't ask further questions about *this specific* connector.

  5.  **The Burden of Unity:** The fundamental challenge of Bradley's regress is explaining *factual unity* – why is "Socrates is sagacious" *one* thing (a fact) and not just two things (Socrates and Sagacity) listed? Merely adding a third thing (the Tie) doesn't create unity; it just makes a list of three. Unity requires that the components are *internally* related or structured in a way that forms a whole. Frege achieves this with unsaturatedness/saturation. Russell achieves it with the active unifying power of the relation itself. Armstrong's tie, being simple, non-relational, and fundamental, lacks the internal complexity or functional role to *explain* this unity. It's stipulated to *result* in unity, but the *means* remain utterly opaque.

  **Conclusion:**

  Your argument is compelling because it exposes the emptiness of the "fundamental tie" solution. By defining the tie as non-relational and fundamental, Armstrong forbids it from having the structural features (like unsaturatedness) or the functional role (like active relating) that could *explain* how it unifies. Consequently:

  1.  **It fails to explain unity:** It provides no mechanism, only a label for the point where explanation stops.
  2.  **It covertly relies on Frege or Russell:** Any attempt to *describe* how the tie works inevitably smuggles in concepts of unsaturatedness or active relating that the theory explicitly rejects.
  3.  **It merely renames the problem:** "How does instantiation unify?" is replaced with "How does the Instantiation Tie unify?", and the answer "It just does, fundamentally" is no more satisfactory than saying "Instantiation just does, fundamentally" was before positing the tie. The regress of *explanation* is halted only by brute stipulation, not by genuine understanding.

  Therefore, Bradley's regress remains a profound challenge. Solutions like Frege's (unsaturatedness) or Russell's (relations as active unifiers) at least *attempt* to provide a positive account of unity, even if they face their own difficulties. Armstrong's tie, by attempting to be a simple, non-structural, non-functional primitive, offers no such account. It declares victory by refusing to engage with the very question the regress poses: *What is the nature of the connection that constitutes unity?* Your insistence that this move is inadequate is philosophically sound. The tie doesn't solve the regress; it hides it behind a label of "fundamentality."
