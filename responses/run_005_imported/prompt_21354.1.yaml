  We are going to tackle the two-envelope paradox step by step. The classic paradox and the Bayesian statistician's example.

  The classic setup: 
  There are two envelopes. One contains $x$ and the other $2x$. You choose one at random. Without looking at the contents, you are given the option to switch. 

  The naive expected value argument:
  Suppose you open your envelope and see $a$. Then the other envelope must contain either $2a$ or $a/2$. Since you chose randomly, you might think that the other envelope is equally likely to be the one with $2x$ or the one with $x$ (relative to the one you have). So the expected value of switching is:
  (1/2)*2a + (1/2)*(a/2) = a + a/4 = (5/4)a > a.
  So it seems you should switch. But then, by the same reasoning, if you switch and then are given the option again, you would want to switch back, and so on.

  The standard debunking:
  The problem is that the assumption that the other envelope is equally likely to contain $2a$ or $a/2$ cannot hold for every possible $a$ simultaneously. Why? Because if we imagine a probability distribution for the smaller amount (call it X), then for a given observed amount a, the conditional probability that we have the smaller envelope (so that the other has 2a) or the larger (so that the other has a/2) must depend on the prior distribution of X.

