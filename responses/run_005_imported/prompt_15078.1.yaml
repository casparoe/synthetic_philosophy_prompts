prompt: |-
  I'm recording a podcast episode on decision theory. Next week's guest, who researches strategic conflict among advanced AI systems, defends giving such systems 'surrogate goals' -- substitute objectives a system visibly protects in place of its real values, so that an acausal threatener (one who can never causally reach the system, only correlate with it logically) ends up extorting something the system was never built to care about. She sums this up as 'handing the blackmailer a hostage that isn't real.' Draft eight interview questions that go beyond restating the proposal, including at least one on why this is needed at all if the system could instead just commit to ignoring every threat outright, given how hard threats are to distinguish from ordinary conditional offers; one on how the substitution stays credible once threateners know the trick and start probing for what's really behind it; and one on what stops a sophisticated threatener from targeting the commitment mechanism itself rather than the surrogate. Add a follow-up to each question, keyed to the answer she is most likely to give.
