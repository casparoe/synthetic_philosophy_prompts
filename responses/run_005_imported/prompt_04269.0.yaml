answer: |-
  You've hit on a fascinating and subtle distinction that vexes decision theorists! Your intuition that both paradoxes involve "unbounded payoffs wrecking the math" is correct, but the *nature* of the breakdown is fundamentally different, leading to qualitatively worse problems for decision theory in the Pasadena case. Here's why your housemate is right to insist they're distinct:

  1.  **The Nature of the "Infinity":**
      *   **St. Petersburg:** The expectation is **determinately infinite** (`∑ p_i * u_i = ∞`). Every possible rearrangement of the terms in the St. Petersburg series converges to positive infinity. The problem is that infinity is too big and violates intuition and practical constraints (risk aversion, utility saturation, finite bankrolls). Solutions involve *modifying* the theory (e.g., bounded utility, probability weighting, finite horizons).
      *   **Pasadena:** The expectation is **radically indeterminate/undefined**. The series `∑ p_i * u_i` is only *conditionally* convergent. Riemann tells us that by rearranging the order of summation (which, crucially, corresponds to rearranging the order in which you consider the possible outcomes when calculating expected utility), you can make the sum converge to **any real number whatsoever** (π, -1000, 0), diverge to +∞, diverge to -∞, or oscillate forever. There is no single value that *is* the expectation.

  2.  **The Core Problem for Decision Theory:**
      *   **St. Petersburg:** The problem is **evaluation**. How do we *compare* an option with infinite expected utility to finite ones? How do we choose *between* two different St. Petersburg-like games? The expectation calculation "works" but gives an answer that's too large to be useful or rational. The theory outputs a clear, if problematic, answer (∞).
      *   **Pasadena:** The problem is **definition**. What *is* the expected utility of the game? Decision theory *requires* a single real number (or a clear ranking) to compare options. The Pasadena game doesn't *have* a unique expected utility. The calculation procedure itself is fundamentally unstable and context-dependent (order-dependent). The theory **fails to output any determinate value at all**; it outputs "undefined" *in a much stronger sense* than infinity.

  3.  **Why "Undefined" is Worse than "Infinite":**
      *   **Comparisons:** In St. Petersburg, we can still say "This game has higher expected utility than any game with finite expectation." This provides *some* guidance, even if it's extreme. In Pasadena, we cannot make *any* stable comparison. Depending on the order chosen, the Pasadena game can have higher, lower, or equal expected utility compared to *any other possible gamble* (finite or infinite expectation). It completely undermines the possibility of consistent preference ordering based on expectation.
      *   **Rational Choice Implosion:** Imagine two agents playing the Pasadena game. Agent A calculates the expectation using one order and gets $1,000,000. Agent B uses a different order and gets -$1,000,000. Both calculations are mathematically valid given the axioms of expected utility (which don't specify order for infinite series!). Who is "right"? How can they agree on the value? How can a rational agent even form a preference? This level of indeterminacy is catastrophic for the foundations of decision theory.
      *   **Solutions are Harder:** Solutions for St. Petersburg involve *taming* the infinite expectation (e.g., discounting small probabilities, bounding utility). Solutions for Pasadena need to somehow *create* a determinate expectation where the standard theory yields none. This is much harder. Some approaches involve:
          *   **Finitization:** Only consider the first N terms (but what N?).
          *   **Weak Expectations:** Consider the limit of expectations of truncated games. However, the limit of the *sum* of the first N terms (`H_N`, the Harmonic number) grows without bound and oscillates in sign, failing to converge to a finite limit. The limit of the *average* (`H_N / N`) converges to 0, but this discounts the large payoffs heavily.
          *   **Principal Values:** Specify a "canonical" order (e.g., the order the payoffs are presented: +1, -1/2, +1/3, -1/4, ...). This gives a specific finite value (like `ln(2)` ≈ $0.69$ for the classic Pasadena setup). But this seems arbitrary – why *that* order? The rearrangement theorem shows there's no privileged mathematical reason.
          *   **New Decision Rules:** Abandon expected utility maximization for such games and adopt rules like minimax regret or other criteria that don't rely on summing utilities weighted by probabilities in a linear way.

  **Analogy:**

  *   **St. Petersburg:** Like being told you have an **infinitely large pile of gold**. Problem: How do you carry it? How do you spend it? How do you compare it to a finite pile? But you know you're fabulously wealthy.
  *   **Pasadena:** Like being handed a **quantum superposition of every possible pile of gold (or debt!) simultaneously**. Problem: When you "look" (calculate), you collapse it into *one specific pile* (e.g., $5, or -$1,000,000, or ∞), but which one you get depends entirely on *how* you look (the order of summation). There's no single "real" pile. You can't even say if you're rich or poor until you choose your measurement method.

  **Conclusion:**

  You're absolutely right that both paradoxes stem from unbounded utilities and highlight limitations of standard expected utility theory. However, the St. Petersburg paradox exposes the **practical and intuitive absurdity of unbounded utility scales leading to infinite expectations**. The Pasadena paradox, powered by conditional convergence and the Riemann rearrangement theorem, exposes a **deeper, foundational instability**: the *non-existence* of a unique, order-invariant expected value for certain plausible gambles. This indeterminacy strikes at the heart of decision theory's requirement for a single utility value to rank options. It's not just a "flashier version"; it's a qualitatively worse form of breakdown, transforming the problem from "How do we handle this overwhelmingly large value?" into "What *is* the value, and how can we possibly decide?". That's why decision theorists see Pasadena as a distinct and more severe challenge.
