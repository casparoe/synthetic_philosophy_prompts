  First, recall St. Petersburg: expectation is unambiguously infinite, so the problem is that infinite utility breaks decision rules. But Pasadena's conditional convergence creates ambiguity - the sum isn't infinite but undefined. That's a qualitative difference! 

  Key insight: St. Petersburg's pathology is quantitative (how to handle ∞ utility), while Pasadena's is qualitative (no unique utility to handle). The Riemann theorem isn't just decoration - it makes Pasadena's expectation order-dependent, meaning no "real" expectation exists. 

  Also important: In St. Petersburg, all rearrangements converge to ∞, while in Pasadena, rearrangements can yield any real number. That's why decision theorists see Pasadena as worse - it undermines the very concept of expectation rather than stretching it. 

