prompt: |-
  Okay so this has been bugging me for like two weeks and I figured I'd finally write it out properly instead of just ranting to my roommates about it again. There's an anonymous "confessions" page for my school on instagram, mostly just screenshots and drama, and a couple weeks ago someone posted a screenshot from a group chat where a girl in my cohort — who'd literally just gotten profiled in the student paper for landing this huge research fellowship — made kind of a snotty comment about people who didn't get funding, something like them "just not being cut out for it." It absolutely exploded. Like 400+ comments, it got reposted onto our school's subreddit, people were making memes with her name in them, the whole deal. I didn't post anything myself, but I'm not gonna pretend I'm totally innocent either — I definitely liked a few of the more savage replies and sent the screenshot to like three friends because ngl it was kind of funny at the time. By the end of finals I heard she'd deactivated everything and started skipping our seminar.

  I brought this up with my roommate (who loves arguing everything down to first principles) and he made an argument thats stuck with me even though something about it feels off. He says there's no such thing as "everyone" or "the internet" doing something — there's only individuals — and if you actually isolate any one person's contribution (a like, a comment, one repost) it's way too trivial to count as harming her. So technically nobody did anything wrong, even though something clearly bad happened to her, and my own little bit of participation definitely doesn't make me responsible for someone dropping out of a seminar. Logically I can't immediately poke a hole in that, but it still feels like it's missing something, maybe even like it's a bit of a dodge.

  I'm taking an existentialism elective this semester which has had me noticing stuff like this way more than I used to, so I wanted to actually ask instead of just going back and forth about it in our kitchen: is my roommate basically right that responsibility just dissolves once an action gets spread across enough anonymous people, or is there something wrong with framing it that way? And if he's wrong, what's actually going on when something like this happens?
