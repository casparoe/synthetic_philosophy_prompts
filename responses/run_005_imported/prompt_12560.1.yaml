answer: |-
  Your uncle is oversimplifying Aquinas significantly. While Aquinas *does* discuss tyrannicide as a *theoretical possibility* under very strict conditions, he **does not** present it as a straightforwardly "virtuous thing to do" or as "settled teaching" requiring no moral agony. His position is far more nuanced and cautious.

  Here's a breakdown of Aquinas's actual argument, primarily from *Summa Theologiae* (I-II, Q. 42, A. 2; II-II, Q. 64, A. 3) and *De Regno* (On Kingship):

  1.  **The Core Principle: Legitimate Authority & The Common Good:** Aquinas's entire political philosophy rests on the idea that authority exists to serve the common good. A ruler who fails in this duty, especially one who becomes a tyrant actively destroying the common good, forfeits their claim to obedience *in that specific regard*.

  2.  **Tyranny as a Grave Evil:** Aquinas unequivocally condemns tyranny as a perversion of government, worse than simple bad rule. A tyrant rules for private gain, oppresses subjects, undermines justice, and destroys the common good. Suffering under a tyrant is a great evil.

  3.  **The *Theoretical* Permission for Removal:**
      *   **Not Private Assassination:** Aquinas **explicitly rejects** private individuals taking it upon themselves to assassinate a tyrant. He calls this "generally speaking, dangerous" and likely to lead to worse evils (like anarchy or a worse tyrant). It also violates the principle that only duly constituted public authority can wield the sword of justice (Romans 13:1-5 is key here).
      *   **Public Authority & Due Process:** The right to remove a tyrant belongs properly to **public authority** acting *on behalf of the community*. Aquinas suggests this could be:
          *   A superior authority (e.g., an Emperor over a King).
          *   The community itself, acting collectively through its leading members (representatives, nobles, etc.), *if* there is no superior authority. This action should ideally involve some form of **judgment and due process**, not just covert murder. He references historical examples like the Romans expelling tyrants.

  4.  **Strict Conditions and Grave Concerns:** Aquinas sets a very high bar and expresses significant reservations:
      *   **Severity of Tyranny:** The tyranny must be extreme, intolerable, and demonstrably destructive of the common good. Not just incompetence or unpopular policies.
      *   **Proportionality & Last Resort:** Removal must be a last resort. Less drastic measures (admonition, petition, resistance to unjust orders) must be exhausted or clearly impossible.
      *   **Likelihood of Success & Avoiding Worse Evil:** There must be a reasonable expectation that removing the tyrant will actually improve the situation and *not* lead to something worse (e.g., civil war, foreign invasion, an even worse ruler, widespread chaos). Aquinas emphasizes the dangers of rebellion and instability.
      *   **Proper Authority:** As stressed above, it cannot be a private vendetta or conspiracy. It must have the character of a public act by those with legitimate standing to act for the community's welfare.
      *   **Motive Must Be Pure:** The motive must be solely the restoration of the common good and justice, not personal hatred, ambition, or vengeance.

  5.  **The "Enduring Tyranny" Option:** Perhaps most importantly, Aquinas explicitly states that **enduring a moderate tyranny might be the *lesser evil* compared to the risks and chaos of rebellion.** He writes: *"Unless perhaps the tyrant's rule is so intolerable that it is worse than the danger of civil strife which may arise from rebellion. But this is seldom the case."* (**Summa Theologiae II-II, Q. 42, A. 2, ad 3**). This is a crucial qualification your uncle overlooks. Agony over the decision is *precisely* because of the immense dangers Aquinas highlights.

  **Why Your Uncle is Oversimplifying:**

  1.  **Ignoring the "Public Authority" Requirement:** The Valkyrie conspirators were acting as a secret military cabal, *not* as a duly constituted public authority acting openly on behalf of the German people. Aquinas would likely see this as the dangerous "private assassination" he warned against.
  2.  **Downplaying the Risks:** Aquinas dwells extensively on the potential for things to go catastrophically wrong. The Valkyrie plot *did* fail and led to horrific reprisals – something Aquinas would cite as validating his caution.
  3.  **Ignoring "Lesser Evil" & Endurance:** He presents removal as the clear "virtuous" choice, ignoring Aquinas's explicit statement that endurance is often the wiser, less dangerous path.
  4.  **"Settled Teaching"?** While Aquinas's framework is foundational, Catholic teaching on rebellion/tyrannicide isn't monolithic or "settled" in the simplistic way your uncle claims. Later theologians debated the nuances, especially concerning legitimate authority in modern nation-states without clear "superiors." The Catechism of the Catholic Church (CCC 2243) *does* cautiously echo Aquinas's conditions (grave threat, last resort, proportionality, no worse evils) but frames it as a *right to resistance*, not an obligation. It never explicitly endorses assassination and emphasizes non-violent resistance first.

  **How to Respond Next Time:**

  *   **Acknowledge Aquinas's Framework:** "Yes, Aquinas *does* provide a theoretical framework where removing a tyrant *could* be justified under Catholic natural law principles."
  *   **Emphasize the Strict Conditions:** "But he sets incredibly high bars: it must be a *last resort* against *intolerable* evil, undertaken by *public authority* (not private conspirators), with a *high probability* of success and avoiding worse chaos."
  *   **Highlight the Reservations:** "Crucially, Aquinas explicitly says that *enduring* tyranny is often the *lesser evil* compared to the immense risks of rebellion. He saw it as a dangerous path, not a straightforwardly virtuous one."
  *   **Point to the Valkyrie Context:** "The Valkyrie plotters were acting secretly, without any mandate from the German people or institutions. While their goal was noble, Aquinas would likely see their *method* – a private assassination plot – as falling into the dangerous category he warned against, especially given the horrific consequences of its failure."
  *   **Challenge "Settled" and "Virtuous Obligation":** "Calling it 'settled teaching' and implying it's an obvious virtuous obligation ignores Aquinas's profound caution and his argument that endurance is frequently the wiser choice. Agonizing over it isn't ignorance; it's grappling with the immense moral gravity and risks Aquinas himself emphasized."

  **Key Aquinas Quotes for Reference:**

  *   **On Private Killing:** "It is not lawful for a private individual to kill an evil-doer, except by chance when one is defending oneself." (II-II, Q. 64, A. 3)
  *   **On Public Removal:** "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power." (De Regno, Ch. 7)
  *   **On Endurance as Lesser Evil:** "Unless perhaps the tyrant's rule is so intolerable that it is worse than the danger of civil strife which may arise from rebellion. But this is seldom the case." (II-II, Q. 42, A. 2, ad 3)

  Armed with this, you can confidently counter your uncle's oversimplification and engage in a more nuanced discussion about Aquinas's complex and cautious view on resisting tyranny.
