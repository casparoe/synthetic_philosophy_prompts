  Need to ensure both land punches. Alex highlights that classical logic assumes realism, which anti-realists reject. Morgan argues that intuitionism leads to multiple reinterpretations and undermines everyday discourse. Also, Percival's argument shows the strategy must be repeatedly applied, which seems unsustainable.

