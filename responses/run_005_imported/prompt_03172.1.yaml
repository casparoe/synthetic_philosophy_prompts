answer: |-
  That's an *excellent* catch! You've pinpointed a crucial and genuinely weird moment where Hobbes's radical materialism crashes headlong into the foundations of geometry. This isn't just wordplay; it's a deliberate, high-stakes philosophical maneuver driven by the core tenets of his entire system. Let's break it down:

  1.  **Hobbes's Non-Negotiable Materialism:** Hobbes is a hardcore materialist. For him, *everything that exists* is **body** (matter in motion). "Substance incorporeal" is, famously for Hobbes, words without meaning – a contradiction in terms. This means:
      *   There can be no truly immaterial entities (like souls as traditionally conceived, or abstract Platonic Forms).
      *   There can be no things *without* extension (size, dimension). Extension is an essential property of body.
      *   **Therefore, a Euclidean point – defined as "that which has no part" (zero size, no extension) – *cannot exist* in nature.** It's a logical abstraction, but for Hobbes, if it doesn't correspond to something physical, it's philosophically suspect as a fundamental building block of *science* (which must be about real things).

  2.  **The Problem with Euclidean Points for Physics (Endeavour):** Hobbes is trying to define "endeavour" – the infinitesimal beginning of motion, the "motion in an instant." Think of it as the physical instantiation of the calculus concept of instantaneous velocity *before* calculus existed. To describe motion at a single, durationless instant, he needs something analogous to a geometric point *in time and space*. But if a point has *zero* size, how can motion occur *through* it? Motion through zero distance in zero time is nonsensical to him. He needs a *physical* basis for this infinitesimal motion.

  3.  **Hobbes's Solution: Redefining "Point" as "Undivided":** This is where his definition comes in:
      *   **"that whose quantity is not at all considered":** This is key. Hobbes isn't saying a point *is* something with zero size. He's saying that in the *context of a specific geometric demonstration or calculation*, we *choose to ignore* the size of a very small thing. We treat it *as if* it had no parts *for the purpose of that proof*.
      *   **"a Point is not to be taken for an Indivisible, but for an Undivided thing":** This is the critical distinction.
          *   **Indivisible:** Implies the thing *cannot* be divided, inherently. It has *no parts whatsoever*. (This is the Euclidean view, which Hobbes rejects as physically impossible).
          *   **Undivided:** Implies the thing *can* be divided (because all matter can be divided), but *in the specific context we are considering it*, **we are not considering its divisibility or its parts**. We are treating it as a whole unit for the sake of argument or measurement.

  4.  **Why This Isn't *Just* Wordplay (Though It's Tricky):**
      *   **Shift from Ontology to Epistemology/Methodology:** Hobbes is moving the definition of "point" away from what a point *fundamentally is* (ontology) to *how we use the concept* in reasoning (epistemology/methodology). He's saying: "Don't ask what a point *is* in absolute reality. Ask how we *treat* something *as* a point *in a specific scientific context*."
      *   **Grounding Abstraction in Physics:** He's insisting that even our most abstract geometric concepts must ultimately be grounded in physical reality. The "point" we use in geometry isn't a mystical dimensionless entity; it's a *representation* of a physically real, extended, but *negligibly small* bit of matter that we *consider* without parts *for the purpose of the demonstration*.
      *   **Making Endeavour Possible:** This redefinition allows "motion made through the length of a Point" to make physical sense. The "point" here is a tiny, *but real and extended*, bit of space. Motion occurs through that tiny space in an instant. We *call* it a "point" and ignore its size in the definition of endeavour, precisely because its size is so small we consider it negligible *in that context*. It has parts (it *must*, being matter), but we aren't considering them when we talk about the motion happening "at a point."

  5.  **Is He Dodging? Yes and No.**
      *   **Yes, he's dodging the *traditional* problem:** He's absolutely avoiding the contradiction inherent in trying to fit a truly dimensionless point into his materialist universe by redefining what "point" *means* in science. He's refusing to accept the Euclidean definition as foundational for natural philosophy.
      *   **No, it's not *merely* a dodge; it's a core philosophical commitment:** This isn't lazy. It's a radical and consistent application of his materialism to the very foundations of geometry. He's willing to overhaul classical geometry (or at least its interpretation) to make it compatible with his view that science is the study of bodies in motion. He genuinely believes the traditional point is a fiction and that his definition provides a sounder physical basis for science, especially for his physics of motion (endeavour).

  **In Summary:**

  Hobbes redefines "point" not as something inherently without parts (which he thinks is impossible), but as something *whose parts we deliberately ignore in a specific context*. It's "undivided" in the sense that *for the purpose at hand*, we treat it as a whole without considering its internal structure. This is driven by:

  1.  **Materialism:** Everything real has extension; no zero-sized entities.
  2.  **Empiricism:** Science must be about real, physical things.
  3.  **The Need for Physical Foundations of Motion (Endeavour):** He needs a concept of infinitesimal motion grounded in extended matter.

  **So, you're spot on:** His materialism *is* the driving force. He *is* "fudging" the traditional geometric definition, but he's doing it systematically and for profound philosophical reasons central to his entire project. He's not just being confusing; he's trying to rebuild geometry on what he sees as a physically realistic, materialist foundation. The "indivisible vs. undivided" distinction is his way of preserving the *usefulness* of the point concept in reasoning while denying its traditional, non-material interpretation. It's a fascinating and bold (if ultimately not widely adopted) attempt to reconcile abstract mathematics with a strictly physical ontology. Great find!
