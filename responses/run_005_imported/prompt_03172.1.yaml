  The user also connects this to "endeavour." Endeavour is motion in an instant, so Hobbes needs a point that isn't zero-sized. By defining a point as having some size but being treated as undivided in proofs, he grounds motion in physical reality. This avoids infinitesimals or actual zero-size points, which would contradict his materialism.

  I should also address the user's suspicion that this is a dodge. While it might seem like that, Hobbes is consistent within his system. He's prioritizing a materialist ontology over mathematical abstraction. His critique of Euclidean points as non-existent in nature shows his commitment to empiricism.

  The user's deeper need might be understanding how philosophers reconcile abstract concepts with their core principles. They want to see if Hobbes' move is valid or just a patch. Explaining how his materialism drives every aspect of his thought, including geometry, would clarify that. Highlighting the practical reason for redefining points in motion (endeavour) shows it's not arbitrary.

