  ## Memorandum: Recommendation on Spirometry Reference Equations

  **To:** Clinical Algorithms Committee Members  
  **From:** [Your Name/Committee Role]  
  **Date:** [Current Date]  
  **Subject:** Recommendation: Adoption of Race-Neutral Spirometry Reference Equations with Implementation Plan & Monitoring  

  ### Background & Context
  The committee has reviewed the use of race-specific spirometry reference equations (adjusting predicted lung capacity downward for Black patients compared to White patients of identical height, age, and sex). While acknowledging the historical persistence of these equations and concerns that removing them may cause misclassification, we find the evidence and ethical imperatives compelling for change.  

  ### Core Recommendation
  **Adopt the race-neutral reference equations now endorsed by the American Thoracic Society (ATS), European Respiratory Society (ERS), and Global Lung Function Initiative (GLI)**, effective immediately for all new pulmonary function tests (PFTs). Discontinue use of race-specific equations.  

  ### Addressing the Key Objection (Clinical Validity Concerns)
  We acknowledge the objection that race-specific equations may reflect *statistical associations* in certain datasets. However, we find this insufficient justification for continued use:  

  1.  **Association ≠ Causation or Biology:** The statistical association between race and lower lung volumes in some historical datasets **primarily reflects the impact of systemic racism** (e.g., lifelong environmental exposures, socioeconomic barriers, healthcare access disparities, chronic stress), *not* inherent biological differences. Using race as a proxy launders these social harms into clinical practice.  
  2.  **Masking Pathology:** Assigning a lower "normal" to Black patients risks **under-diagnosing true pathology** (e.g., restrictive lung disease, early COPD) by classifying abnormally low values as "normal for race." This directly harms patients by delaying diagnosis and treatment.  
  3.  **Perpetuating Inequity:** Maintaining separate norms reinforces the false and harmful concept of innate biological racial difference, eroding trust and potentially contributing to disparities in care access and quality.  
  4.  **Modern Standards & Data:** Contemporary, diverse datasets used to derive race-neutral equations (like GLI) demonstrate superior generalizability. Modern statistical methods better account for individual variation without relying on race as a crude proxy. The medical consensus has shifted decisively towards this approach.  

  ### Implementation Timeline & Plan

  | Phase | Timeline | Key Actions | Responsible Parties |
  |-------|----------|-------------|---------------------|
  | **Immediate Transition** | Effective Immediately | 1. Update all PFT software/systems to use GLI "Global" (race-neutral) equations as default. <br>2. Remove race-specific equation options from reporting interfaces. | PFT Lab Manager, IT |
  | **Staff Education & Communication** | Next 2 Weeks | 1. Mandatory briefing for all pulmonologists, PFT lab staff, referring physicians. <br>2. Focus: rationale for change, interpreting results under new equations, identifying potential shifts for Black patients. <br>3. Distribute FAQs & reference materials (ATS/GLI guidelines). | Committee Chair, Chief of Pulmonology, Med Ed |
  | **Retrospective Analysis (Optional but Recommended)** | Month 1-2 | Analyze recent PFTs (e.g., past 6-12 months) for Black patients using *both* old and new equations. Assess the clinical impact: How many interpretations shifted from "normal" to "abnormal"? Were these shifts clinically plausible? Report findings to committee. | PFT Lab Manager, Pulm Fellow/Resident |
  | **Monitoring & Quality Assurance** | Ongoing (Starting Month 3) | 1. Track PFT interpretations pre/post-change (focusing on Black patients). <br>2. Monitor for unintended consequences (e.g., changes in diagnosis rates, referrals for Black patients). <br>3. Report findings quarterly to committee for first year. | Quality Dept, PFT Lab, Committee |

  ### Why Not Report Both?
  Reporting both race-specific and race-neutral results, while seemingly neutral, is **strongly discouraged**:  
  *   **Clinician Confusion:** Creates ambiguity about which value is "correct," leading to inconsistent interpretation and potential errors.  
  *   **Operational Burden:** Adds complexity to reporting workflows and interpretation.  
  *   **Legitimizing a Flawed Metric:** Implies the race-specific value retains clinical validity, undermining the ethical imperative for change.  
  *   **Equity Failure:** Fails to resolve the core problem of applying a lower standard based on race.  

  ### Conclusion: Validity AND Equity Aligned
  This recommendation prioritizes **equity** by rejecting the use of race as a biological proxy and ensuring all patients are assessed against the same standard of lung health. It also prioritizes **clinical validity** by:  
  *   Using the most current, evidence-based equations derived from robust global data.  
  *   Reducing the risk of under-diagnosing lung disease in Black patients.  
  *   Aligning with evolving best practices and major pulmonary societies.  

  The misclassification risk exists in *both* approaches: current equations risk misclassifying disease as normal, while new equations risk misclassifying *some* normal values as abnormal. However, erring towards identifying *potential* pathology for further evaluation is clinically safer and more equitable than erring towards missing disease based on race. Vigilant monitoring post-implementation will ensure patient safety.  

  We move forward with a clear standard that upholds scientific integrity and our commitment to equitable care.  

  **Recommendation:** **Adopt race-neutral spirometry reference equations immediately.**  

  **Attachments:**  
  1.  Summary of ATS/ERS/GLI Position Statements on Race-Neutral Equations.  
  2.  Draft Communication for Clinicians & Staff.  
  3.  Proposed Monitoring Metrics.  

  **Submitted for Committee Vote at the [Date] Quality Meeting.**
