  - They note that two translation manuals can fit all behavioral evidence and yet disagree, just as two physical theories can fit all observational evidence and diverge.
  - The student then says that what makes translation feel more dramatic is that we are not used to thinking of meaning as theoretical, but once we accept linguistics as part of science, it's underdetermined in the same way as any hypothesis about unobservables.

  **Evaluation:**
  - The student correctly identifies that Quine sees indeterminacy as a form of underdetermination.
  - However, the question asks how it is *more radical* than ordinary underdetermination. The student's answer downplays the difference, suggesting it's not more radical but just feels that way because we are not used to it. This is a misunderstanding.

  Quine does argue that indeterminacy of translation is more radical than underdetermination of scientific theories. In ordinary underdetermination, there are two theories that are both compatible with all evidence, but they are both true (or both false) in the same way, and we can choose one for practical reasons. But for Quine, indeterminacy of translation is not just a matter of two theories being empirically equivalent; it's that there is no fact of the matter about which one is correct. Meaning itself is indeterminate. So, while underdetermination in science might leave us with two descriptions of the same reality, indeterminacy in translation implies that there is no objective meaning to be right or wrong about.

  The student misses this key point. They say: "no more and no less" than underdetermination, which is exactly what Quine is arguing against. Quine does think it is more radical.

