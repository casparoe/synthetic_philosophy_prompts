  Structuring the dialogue: Start with Ghazālī challenging necessary connection, using fire-cotton. Ibn Rushd responds with the epistemology argument. Then bring in Abraham's miracle. Ghazālī uses it to show God's direct action, Ibn Rushd questions how we'd recognize a miracle without stable natures. End with Hume contrast: Hume's skepticism is epistemological, Ghazālī's is theological with divine habit.

  Need to ensure both sides are robust. Ghazālī isn't a full occasionalist here; he's skeptical of philosophical necessity. Ibn Rushd defends natures as necessary for science. Their exchange should push each other: Ghazālī forces Ibn Rushd to justify necessity beyond observation, Ibn Rushd pressures Ghazālī on the coherence of miracles and natural order.

  Also, check academic accuracy: Ghazālī's "habit" is secondary in his argument. Ibn Rushd's rebuttal in Tahāfut al-Tahāfut emphasizes that denying causes collapses knowledge. The Abraham example is in Qur'an (21:69), used by Ghazālī in Incoherence.

