  For the closing, each philosopher names what would change their mind. The situationist might ask for evidence of cross-situational consistency despite varying contexts. The virtue ethicist could want a study showing that situational factors don't override virtues in the well-trained. Real-world examples like rescuers in WWII might be mentioned, but the situationist could counter with studies showing situational factors even there.

