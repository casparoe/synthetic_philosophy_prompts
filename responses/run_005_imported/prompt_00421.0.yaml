answer: |-
  Your understanding is **partially correct but incomplete** when considering the full standard procedure of Iterated Elimination of Strictly Dominated Strategies (IESDS), **especially regarding the role of mixed strategies.**

  Here's the breakdown:

  1.  **Your Current Understanding (Pure vs. Pure):**
      *   You are correctly describing the elimination of strategies that are **strictly dominated by another *single* pure strategy**.
      *   This is a valid step and is often the starting point.
      *   Once a strategy survives a round where it isn't dominated by another pure strategy using the *current* set of opponents' strategies, it *is* safe from elimination *in that specific round* based *only* on pure strategy domination.

  2.  **The Crucial Role of Mixed Strategies:**
      *   The **complete and standard definition** of strict dominance requires checking against *any* mixed strategy over the player's *remaining* pure strategies, not just single pure strategies.
      *   **A pure strategy `s_i` is strictly dominated for player `i` if there exists *some* mixed strategy `σ_i` (over player `i`'s other pure strategies that haven't been eliminated yet) such that:**
          `u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i})` **for *every* possible pure strategy profile `s_{-i}` of the opponents that hasn't been eliminated yet.**
      *   **This mixed strategy `σ_i` might be a mixture of two or more pure strategies.** A pure strategy that isn't dominated by any *single* other pure strategy might very well be dominated by a *combination* of two or more other pure strategies.

  **Why your pairwise-only approach isn't sufficient:**

  *   Consider a game where a player has 3 pure strategies: A, B, C.
  *   Suppose:
      *   A is not strictly better than B against *all* opponent profiles (and vice versa).
      *   A is not strictly better than C against *all* opponent profiles (and vice versa).
      *   B is not strictly better than C against *all* opponent profiles (and vice versa).
  *   **However,** suppose a 50-50 mixture of B and C yields a strictly higher payoff than A against *every single possible* opponent profile that hasn't been eliminated.
  *   **Result:** Strategy A *is* strictly dominated (by the mixed strategy σ_i = 0.5B + 0.5C) and should be eliminated, even though it wasn't dominated by B *alone* or by C *alone*. Your pairwise method would incorrectly leave A in the game.

  **Implications for the Elimination Process:**

  1.  **Survival Requires No Domination by *Any* Mixed Strategy:** For a pure strategy to survive a round, it must be that **no mixed strategy** (over the player's remaining pure strategies) strictly dominates it against all remaining opponent profiles. Passing the "pairwise pure strategy test" is necessary but **not sufficient**.
  2.  **Re-checking is Essential:** After eliminating *any* strategy (whether dominated by a pure or mixed strategy), the set of opponents' strategies changes. **You must re-check *all* remaining strategies for *all* players for strict dominance (by pure *or* mixed strategies) against this new, smaller set of opponent profiles.** A strategy that was previously undominated might become dominated once some opponent strategies are removed. The process is iterative.
  3.  **Mixed Strategies as Dominators, Not Necessarily Played:** Crucially, you only need to consider mixed strategies *as potential dominators* during the elimination check. You don't need to consider opponents playing mixed strategies; you only need to consider opponents playing the *pure strategies* that haven't been eliminated yet. The dominance condition must hold against *every* such pure strategy profile.

  **Summary of the Correct IESDS Procedure:**

  1.  Start with the full game.
  2.  For each player, for each of their pure strategies `s_i`:
      *   Check if there exists *any* mixed strategy `σ_i` over their *other remaining* pure strategies such that `u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i})` for *every* possible combination of pure strategies `s_{-i}` that the opponents still have available.
      *   If such a `σ_i` exists, mark `s_i` as strictly dominated and eliminate it.
  3.  If *any* strategies were eliminated in step 2, **go back to step 2** and repeat the check using the *reduced* game (only the strategies that survived the last round).
  4.  The process stops when a full pass through step 2 results in **no eliminations** for any player. The strategies remaining constitute the set that survives IESDS.

  **In relation to your LessWrong reading:** Correlated Equilibria are a distinct concept involving correlated randomization (often via an external signal). While IESDS is relevant for finding Nash Equilibria (which are a subset of Correlated Equilibria), the dominance checks within IESDS itself only involve unilateral mixed strategies by the player whose strategy is being evaluated for dominance, played against the *pure* strategies of the opponents. The correlation in CE happens at the level of the overall strategy profile, not within the dominance check of a single player's strategy.

  **Conclusion:** Your pairwise pure-strategy comparison is a valid *component* of IESDS, but it is **not sufficient**. To correctly perform IESDS, you **must** consider the possibility that a pure strategy is strictly dominated by a *mixed strategy* over the player's other remaining pure strategies, even if it isn't dominated by any single one of them. Failing to do so can leave dominated strategies in the game and potentially lead to an incorrect solution set.
