prompt: |-
  I'm a software engineer and serve as technical lead on my fintech company's model risk committee, which has to sign off on any algorithm used in credit decisions before it can go live. We're currently reviewing a vendor's default-risk score for a new lending product. The vendor's own audit shows the score is well-calibrated: applicants from our two largest demographic groups who receive the same score default at essentially the same rate. An independent audit we commissioned found something else: among applicants who did not default, those in the group with the higher overall default rate were denied credit or given worse terms at nearly twice the rate of non-defaulting applicants in the other group. Our fair-lending policy bars any practice with a 'disparate and unjustified' impact on a protected class, but it doesn't say which of these two properties -- equal accuracy per score, or equal error rates across groups -- should decide whether an impact counts as 'unjustified.' Half the committee wants the model pulled as discriminatory; the other half says the calibration audit already establishes fairness, and that the disparity is an unavoidable mathematical consequence of the two groups' differing default rates, not a flaw more data would fix. Both sides insist the math backs them, and I don't have the formal background to referee that myself. Please write the one-page memo I'll circulate before Tuesday's meeting: recommend approve, reject, or approve-with-conditions (stating the conditions and a re-audit deadline if applicable), and give the strongest version of the argument for whichever side you don't recommend, rather than treating this as a dispute that better data or a smarter model could dissolve.
reasoning: |-
  We are presented with two different fairness criteria: 
   1. Calibration (equal positive predictive value per score): The vendor's audit shows that for applicants with the same score, the default rate is the same across the two demographic groups. This is sometimes called "calibration by group" or "predictive parity".
   2. Equal false positive rates (FPR) across groups: The independent audit found that among non-defaulters (the good applicants), the rate at which they are denied credit (or given worse terms) is nearly twice as high in the group with the higher overall default rate. This is a disparity in the false positive rate (FPR) because non-defaulters are being incorrectly classified as high risk (or treated as such) at different rates.

   The committee is split: one side says the model is fair because of calibration, the other says it is unfair because of the disparity in FPR.

   Important context: 
   - The fair-lending policy bars practices with a 'disparate and unjustified' impact on a protected class.
   - The two groups have different base rates (overall default rates). Let's denote:
       Group A: lower base default rate
       Group B: higher base default rate

   The mathematical reason for the observed disparity in FPR is due to the base rate difference. 

   Consider:
     Let p_A = base rate (default rate) for group A, p_B for group B, and p_B > p_A.
     The model is well-calibrated: for a given score s, P(default | s, group) = s (approximately) for both groups.

   Now, the false positive rate (FPR) for a group is the probability of being denied (or given worse terms) given that the applicant is a non-defaulter. 
     FPR_A = P(denied | non-default, group A)
     FPR_B = P(denied | non-default, group B)

   The decision to deny or give worse terms is based on the score being above a threshold. Let the threshold be set at a score of t. Then:
     FPR_A = P(score >= t | non-default, group A)
     FPR_B = P(score >= t | non-default, group B)

   Because the model is calibrated, the distribution of scores for each group must reflect their base rates. In particular, the scores for non-defaulters in group B will tend to be lower than for non-defaulters in group A. Why?

   Explanation:
     For non-defaulters, we want the model to assign a low score. However, because group B has a higher base rate, the model must assign more high scores to group B to reflect that higher base rate. Therefore, even among non-defaulters in group B, the model will assign relatively higher scores than among non-defaulters in group A. This is a consequence of the model being calibrated and the base rate difference.

   Therefore, at the same threshold t, the FPR for group B will be higher than for group A. This is a mathematical inevitability when the model is calibrated and the base rates differ.

   The independent audit found exactly this: FPR_B is nearly twice FPR_A.

   The argument of the side that wants to approve the model:
     - The model is well-calibrated, which they argue is the appropriate fairness criterion because it ensures that a given score means the same risk regardless of group. 
     - The disparity in FPR is a consequence of the base rate difference and not a bias in the model. They argue that it is unavoidable and that more data or a different model cannot fix it without violating calibration.

   The argument of the side that wants to reject the model:
     - The model has a disparate impact on group B (the group with the higher base rate) because non-defaulters in group B are being denied at a higher rate. This is seen as unfair because it penalizes individuals in group B who are creditworthy (non-defaulters) at a higher rate than similarly creditworthy individuals in group A.

   Now, note that the fair-lending policy bars practices with a 'disparate and unjustified' impact. 

   The key question: 
     Is the disparate impact (in FPR) unjustified?

   The committee must decide which fairness criterion to prioritize.

   However, we cannot have both calibration and equal FPR when base rates differ. This is a well-known impossibility result in fairness (see Kleinberg, Mullainathan, Raghavan, and Chouldechova).

   Therefore, the dispute is about which criterion is more important for compliance with the fair-lending policy.

   Arguments:

   For approval (emphasizing calibration):
     - Calibration ensures that the score is a consistent measure of risk across groups. This is important for pricing and risk management.
     - The higher FPR for group B is a direct consequence of the higher base rate in group B. It is not due to the model being biased against group B, but rather reflects the actual risk distribution. 
     - If we were to adjust the model to achieve equal FPR, we would break calibration. For example, we might have to set a lower threshold for group B than for group A, which would mean that the same score would lead to different decisions for the same risk level. This could be seen as unfair in the opposite direction (favoring group B) and also might lead to higher losses.

   For rejection (emphasizing equal FPR):
     - The policy is concerned with the impact on protected classes. The independent audit shows that creditworthy applicants in group B are being denied at nearly twice the rate of creditworthy applicants in group A. This is a disparate impact on group B.
     - The vendor's calibration does not justify this impact because the calibration condition does not address the harm to creditworthy applicants in group B. 
     - The fact that the disparity is a mathematical consequence does not make it justified. The policy does not say that mathematically inevitable disparities are acceptable. It requires that the impact be justified by business necessity. Here, the business necessity might be argued (risk management) but the counterargument is that the model could be adjusted (even if it breaks calibration) to reduce the harm to group B without sacrificing overall accuracy.

   However, note that adjusting the model to achieve equal FPR would require either:
     (a) Changing the model so that it is not calibrated (so the same score means different risk levels for different groups) OR
     (b) Setting group-specific thresholds (which is explicitly allowed in some regulatory frameworks but may be controversial).

   But the problem states that we are to avoid treating this as a dispute that better data or a smarter model could dissolve. We are to choose between the two criteria.

   Given the context of fair lending, which has a history of focusing on disparate impact in outcomes (such as denial rates), I believe the policy is more likely to be interpreted as requiring attention to the disparate impact in FPR. 

   However, note that the Equal Credit Opportunity Act (ECOA) and Regulation B focus on disparate treatment and disparate impact. The regulatory guidance (e.g., from the CFPB) has emphasized that models that have a disparate impact on a protected class must be justified by business necessity and that there is no less discriminatory alternative.

   In this case, the business necessity is the accurate assessment of credit risk. The model is calibrated and therefore accurately reflects risk. Adjusting the model to reduce FPR for group B would necessarily make it less accurate in some way (either by breaking calibration or by increasing overall risk).

   Therefore, I recommend:

     Approve the model, but with conditions.

   Conditions:
     1. The committee must document the business necessity for using a model that results in a disparate impact (the necessity being accurate risk assessment and the fact that the model is calibrated).
     2. We must also consider whether there are less discriminatory alternatives that could reduce the FPR disparity without sacrificing too much accuracy. For example, we might explore:
          - Using a different model that achieves a better balance of fairness criteria (if possible without violating business necessity) but note the impossibility result.
          - Adjusting the threshold for group B to reduce FPR, but then we must also adjust pricing accordingly to account for the increased risk? However, this might be seen as disparate treatment and might not be allowed by regulation.
     3. We must conduct a thorough analysis of the impact of the model on both groups and document the rationale for accepting the disparity in FPR as justified by business necessity.

   However, note that the problem says: "the disparity is an unavoidable mathematical consequence of the two groups' differing default rates, not a flaw more data or a smarter model would fix." Therefore, condition 2 might not yield a solution.

   Alternatively, we might consider:

     Approve the model, but with a condition that we monitor the impact and consider adjustments to the decision-making process that might mitigate the harm without breaking the model. For example, we might use the score in a way that does not set a single threshold? But that is unlikely.

   But note: the policy says "disparate and unjustified". We have a disparate impact (in FPR) and we have an argument that it is justified by the base rate difference and the need for calibration. Therefore, we can approve.

   However, the independent audit found a nearly 2x difference in the rate of denial for non-defaulters. This is a significant disparity. We must be cautious.

   Given the legal risks, it would be prudent to seek legal counsel. But the memo must make a recommendation.

   After weighing the arguments, I recommend:

     Approve the model, but with the condition that we set up a monitoring program to track the impact on protected classes and to periodically reassess the model's performance and the business justification. We should also document the rationale for the decision, including the mathematical inevitability of the FPR disparity given the base rate difference and calibration.

   However, note that the other side has a strong argument: the disparate impact on non-defaulters in group B is real and harmful. If the policy is interpreted as requiring equal treatment of creditworthy applicants, then the model fails. But the policy does not specify which fairness criterion to use.

   Therefore, I will write a memo that recommends approval with conditions, but also presents the strongest version of the rejection argument.

   MEMO:

  ---

  **MEMORANDUM**

  **To**: Model Risk Committee  
  **From**: [Your Name], Technical Lead  
  **Date**: [Date]  
  **Subject**: Recommendation for Vendor's Default-Risk Score Model  

  ### Background
  We are reviewing a vendor's default-risk score for a new lending product. The vendor's audit demonstrates that the model is well-calibrated: applicants from our two largest demographic groups with the same score default at essentially the same rate. However, an independent audit we commissioned found that among applicants who did not default, those in the group with the higher overall default rate (Group B) were denied credit or given worse terms at nearly twice the rate of non-defaulting applicants in the other group (Group A). Our fair-lending policy prohibits practices with a "disparate and unjustified" impact on a protected class.

  ### Analysis
  The committee is divided on whether the model should be approved. The key issue is the interpretation of "unjustified" impact:

  1. **Vendor's Calibration Audit**: Demonstrates that the model satisfies predictive parity (calibration) by group. This means the score is a consistent predictor of risk across groups. 

  2. **Independent Audit**: Reveals a disparity in the false positive rate (FPR) between groups. Specifically, creditworthy applicants (non-defaulters) in Group B are denied or offered worse terms at nearly double the rate of creditworthy applicants in Group A.

  This disparity in FPR is a direct mathematical consequence of two factors: 
     - The model being calibrated.
     - The base default rates of the two groups differing (with Group B having a higher base rate).

  Because of the higher base rate in Group B, the model assigns relatively higher risk scores to non-defaulters in Group B than to non-defaulters in Group A. This results in a higher FPR for Group B at any given threshold. This outcome is unavoidable under calibration when base rates differ.

  ### Arguments

  **Argument for Approval (Calibration as Fairness)**  
  The model is fair because it assigns scores that reflect the same risk level regardless of group membership. The disparity in FPR is not due to bias in the model but to the underlying difference in base rates. Adjusting the model to equalize FPR would break calibration, resulting in the same score representing different risk levels across groups. This would be unfair to Group A (by requiring them to meet a higher standard for the same risk level) and could lead to increased losses. The business necessity of accurate risk assessment justifies the FPR disparity. Therefore, the impact is not "unjustified."

  **Argument for Rejection (FPR Disparity as Unfair)**  
  The model has a disparate impact on Group B: creditworthy applicants in Group B are denied credit at nearly twice the rate of similarly creditworthy applicants in Group A. This harm is not addressed by calibration. The fair-lending policy is concerned with the impact on protected classes, and this impact is significant. The mathematical inevitability does not automatically make the impact justified. The policy requires that any disparate impact be justified by business necessity, and here the necessity (calibration) comes at the cost of harming creditworthy applicants in Group B. We must seek a model that minimizes such harm, even if it means accepting a less calibrated model.

  ### Recommendation
  I recommend **approving the model with the following conditions**:

  1. **Business Necessity Documentation**: We document the business necessity for the model, emphasizing that calibration is critical for risk management and that the FPR disparity is an unavoidable consequence of the base rate difference under calibration.

  2. **Monitoring and Mitigation Plan**: 
     - Implement ongoing monitoring of FPR disparities and overall model performance, broken down by demographic groups.
     - Explore whether adjustments to the decision-making process (e.g., using group-specific thresholds) could mitigate the FPR disparity without violating regulations. Note: This approach may be legally contentious and should be reviewed by legal counsel.
     - Report quarterly to the committee on the disparity and any mitigation efforts.

  3. **Re-audit Deadline**: Commission an independent re-audit in **six months** to assess whether the FPR disparity has changed and to evaluate the effectiveness of any mitigation strategies. The re-audit should also assess whether the model remains calibrated.

  4. **Legal Review**: Seek legal counsel to ensure our interpretation of "unjustified" impact complies with regulatory expectations and case law.

  ### Strongest Version of the Rejection Argument
  The model should be rejected because it causes a significant and harmful disparate impact on creditworthy applicants in Group B. The fair-lending policy is intended to protect against exactly this kind of harm: qualified applicants in a protected class being unfairly denied credit. The fact that the disparity arises from mathematical inevitability does not negate the harm; it only explains its source. We should not accept a model that systematically disadvantages non-defaulters in a protected class at twice the rate of others. Until we can find a model that either reduces this disparity (even if it cannot be eliminated) without compromising critical risk management objectives, we should not deploy this model.

  However, given the current impossibility of achieving both calibration and equal FPR under differing base rates, and the business necessity of a calibrated model for risk management, I recommend approval with conditions to monitor and mitigate the impact.

