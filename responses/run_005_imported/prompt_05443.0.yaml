  First, I need to address the core argument. The friend's stance is that maximizing geometric mean growth is objectively correct for repeated bets. But is that really the case? Let me recall the assumptions behind Kelly. It assumes known, accurate probabilities, no betting limits, and no other financial considerations. Real life isn't that clean. 

  The user mentioned half-Kelly bettors being called cowards. But maybe there are valid reasons. What about parameter uncertainty? If your edge is estimated wrong, full Kelly could be disastrous. Betting half-Kelly might be a hedge against that uncertainty. Also, utility functions—money isn't linear in utility. Losing a big chunk might hurt more than gaining the same amount helps, especially if you're risk-averse. 

  Then there's the time aspect. Kelly optimizes long-term growth, but what if you have short-term liabilities? Or if you can't play indefinitely? Bankruptcy risk matters. Even with positive EV, going broke means you're out of the game. Full Kelly has a non-zero risk of ruin. Fractional Kelly reduces that risk significantly. 

  Geometric rationality sounds compelling, but it assumes you can keep reinvesting all winnings indefinitely. Realistically, people withdraw money for living expenses. Also, the variance is higher with full Kelly, leading to more volatile returns. Some investors can't handle that drawdown emotionally or financially. 

  The user wants a concrete answer, not a "depends" response. But the math itself shows that Kelly is optimal under specific, idealized conditions. When those don't hold, deviating is rational. I should explain why the assumptions matter. Maybe mention Edward Thorp's use of fractional Kelly due to estimation errors. Or how even risk-neutral entities like hedge funds consider tail risks. 

  Also, the friend's argument might conflate rationality with risk-neutrality. Rationality includes aligning actions with goals. If avoiding ruin is a goal, fractional Kelly is rational. The geometric mean maximization is a tool, not a universal law. Its correctness depends on the context matching the assumptions. 

  In conclusion, the friend's view is mathematically true in a vacuum but practically limited. Real-world complexities make fractional Kelly not just cowardice but prudent. The user's nagging feeling is probably spotting these unaddressed assumptions. Highlighting the gap between theory and application should clarify why full Kelly isn't always the answer.
answer: |-
  Your friend's argument is mathematically elegant but incomplete in practice. While full Kelly *is* the strategy that maximizes long-term geometric growth *under specific idealized assumptions*, deviating from it (e.g., using half-Kelly) can be perfectly rational and even mathematically justifiable when those assumptions don't hold. Here's why:

  1.  **Parameter Uncertainty (The Biggest Flaw):** Kelly requires *perfectly known* probabilities and payoffs. In reality, your "edge" is an *estimate*. If you overestimate your edge (which is easy to do), betting full Kelly becomes disastrously aggressive. Fractional Kelly (like half-Kelly) is a robust hedge against estimation error. Betting less than full Kelly isn't cowardice; it's acknowledging you don't possess godlike knowledge of the true probabilities. Edward Thorp (who practically applied Kelly to gambling and finance) explicitly advocated fractional Kelly for this reason.

  2.  **Risk of Ruin (Non-Linearity of Bankruptcy):** Full Kelly *does* have a non-zero probability of reducing your bankroll to near zero over time, even with a positive edge. Crucially, **bankruptcy is not symmetrical**. Losing 99% of your wealth isn't just bad; it's *catastrophic* because you can't play anymore. The geometric mean optimizes *asymptotic* growth *if you survive*, but it doesn't assign infinite negative utility to ruin. Rational agents care about the *probability* and *consequences* of ruin, which full Kelly ignores. Fractional Kelly drastically reduces the probability of drawdowns severe enough to functionally end your betting/investing career.

  3.  **Utility of Wealth is Not Linear:** Kelly maximizes the *expected logarithm* of wealth. This implicitly assumes that your utility (happiness, usefulness) derived from money is exactly proportional to the log of the amount you have (`U(W) = log(W)`). While log utility is a reasonable model for many purposes, it's not universally true:
      *   **Minimum Wealth Requirements:** You might *need* a certain minimum wealth level for essential purposes (living expenses, liabilities). Falling below this is catastrophic. Full Kelly doesn't protect this minimum.
      *   **Risk Aversion:** Humans (and many institutions) are empirically risk-averse. Losing $X often causes more pain than gaining $X provides pleasure. Log utility models *some* risk aversion, but individuals may have *stronger* aversion to large losses than the log function implies. Fractional Kelly produces a smoother, less volatile wealth path, which can have higher *subjective* expected utility for a genuinely risk-averse person (using their *actual* utility function, not log).

  4.  **Finite Time Horizons & Withdrawals:** Kelly's optimality is proven for infinitely repeated bets where *all* wealth is reinvested. Reality is different:
      *   **Time Horizon:** If you need the money for a goal (retirement, house) in 10 years, maximizing 50-year growth is irrelevant. The risk of a severe drawdown *before your deadline* becomes critical. Full Kelly has higher short-to-medium-term volatility and risk.
      *   **Withdrawals:** If you *withdraw* money for living expenses (like most investors), you are constantly taking chips off the table. This interacts complexly with the Kelly strategy. Full Kelly, with its higher volatility, makes sustainable withdrawal rates harder to manage.

  5.  **Compounding Effects of Variance (Volatility Drag):** While maximizing geometric mean *minimizes* volatility drag, full Kelly still has higher *absolute volatility* than fractional Kelly. Higher volatility means:
      *   Larger potential drawdowns (psychologically difficult to withstand).
      *   Reduced compound returns *if* you are forced to change strategy during a drawdown (e.g., reduce bets due to external pressure or fear).
      *   Practically, it can be harder to raise capital or retain investors with a highly volatile track record, even if the long-term geometric mean is theoretically optimal.

  **Why "Maximize Geometric Mean" Isn't the Uncontested King:**

  *   **It's Optimal Under VERY Specific Conditions:** Known probabilities, no transaction costs/capital constraints, infinitely divisible bets, infinite time horizon, no withdrawals, logarithmic utility, and your *only* goal is maximizing asymptotic growth rate. Deviate from any of these, and its absolute optimality vanishes.
  *   **It Ignores Critical Realities:** As outlined above (estimation error, ruin risk, real utility functions, finite horizons), the real world violates these conditions. Maximizing geometric mean *under real-world uncertainty* isn't the same as maximizing it under perfect knowledge.
  *   **"Arithmetic Expected Value is Naive" is an Oversimplification:** Arithmetic EV *is* the correct measure for a *single, one-off* bet where you don't reinvest winnings. Geometric mean becomes paramount *because* of reinvestment over time. Neither is universally "naive" or "correct"; they answer different questions. Criticizing EV maximization for *repeated reinvestment* is valid, but declaring geometric mean maximization as the *only* rational choice ignores other valid rational goals (like avoiding ruin or meeting minimum wealth needs).

  **Conclusion:**

  Your friend is correct *within the pristine mathematical vacuum* defined by Kelly's original assumptions. In that vacuum, full Kelly maximizes long-term growth, and betting less *does* leave expected log wealth on the table.

  **However, the real world is not that vacuum.** Fractional Kelly (like half-Kelly) is **not** inherently irrational cowardice. It's often a rational response to:

  1.  **Knightian Uncertainty:** Not knowing the true probabilities/payoffs.
  2.  **Non-Log Utility:** Having stronger aversion to catastrophic loss than log utility implies.
  3.  **Finite Horizons & Ruin Risk:** Needing to protect capital for specific goals or simply stay in the game.

  The math doesn't say "full Kelly is always optimal." The math says "full Kelly is optimal *if and only if* your utility is exactly logarithmic *and* you know the true probabilities *and* you can bet forever *and* you never need a minimum wealth level *and*...". When those assumptions fail (which they always do, to some degree), deviating from full Kelly isn't a mathematical error or emotional weakness; it's a rational adaptation to complexity and uncertainty. The "geometric rationality" framework is powerful, but it's a tool, not a universal law that overrides all other rational considerations. Half-Kelly bettors aren't necessarily leaving money on the table; they're often rationally managing risks that the pure Kelly criterion ignores.
