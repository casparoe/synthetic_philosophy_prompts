  probably_inevitable:
    - Gorbachev being in charge during the fall of the USSR (the system was doomed, but his role shaped the outcome)
    - The American Revolution succeeding (structural forces made independence likely, but the war's outcome was not guaranteed)

  basically_baked_in:
    - The Roman Empire falling when it did (internal decay and barbarian pressures made collapse inevitable)
    - The discovery of the New World by Columbus (European expansion and technology made discovery inevitable)

