  **Defense of Top-Ranked Criterion (Equal Opportunity):**  
  Equal Opportunity (equal true positive rates, or equivalently, equal false negative rates across groups) is optimal as the sole compliance standard because it directly addresses the core harm in pretrial settings: systematically failing to identify high-risk individuals in specific groups, which jeopardizes public safety and erodes trust. It's robust to base rate differences, auditable via standard confusion matrices, and difficult to game without sacrificing overall accuracy. Crucially, it aligns with the normative intuition that no group should be disproportionately exposed to preventable harm due to algorithmic under-prediction, while avoiding the pitfalls of rigid quotas (e.g., statistical parity) or unverifiable counterfactuals.

  **Disqualification of Bottom-Ranked Criterion (Counterfactual Fairness):**  
  Counterfactual fairness is the worst choice for a compliance standard because it demands a complete causal model of how race influences covariates—an insurmountable requirement given contested social science, unobserved confounders, and the lack of consensus on admissible variables. Auditors cannot feasibly validate counterfactual predictions, and deploying agencies could trivially game it by manipulating causal assumptions. It also fails to track observable disparities (e.g., ProPublica's findings), instead prioritizing abstract, individual-level hypotheticals that are irrelevant to group-based discrimination complaints in real-world deployments.
