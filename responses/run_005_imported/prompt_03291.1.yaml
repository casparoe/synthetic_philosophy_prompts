  Compatibilists believe free will and responsibility are compatible with determinism. They focus on the agent's internal structure and processes. The critical difference lies in how the desires were formed. In the manipulated case, the neuroscientists bypass the agent's normal psychological processes. In the ordinary case, the desires result from the person's own cognitive mechanisms, even if influenced by upbringing.

