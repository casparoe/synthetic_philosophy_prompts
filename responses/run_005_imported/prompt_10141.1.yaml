prompt: |-
  okay so my friend Theo and I were up way too late last night arguing about decision theory again (we do this more than either of us wants to admit), and it turned into a whole thing about the Pasadena game vs. the St. Petersburg paradox. His basic position is that Pasadena is just St. Petersburg "with extra steps." Both games have that same doubling structure where the payout grows like 2^n while the probability of getting that far shrinks like 2^-n, so obviously the expected value goes haywire in both cases, and the fix people reach for is the same one going back to Bernoulli — stick a concave, bounded utility function on the payouts instead of raw dollar amounts, and the problem more or less dissolves either way. He thinks the alternating plus-and-minus signs on the Pasadena payouts (which I think come from a paper by Alan Hájek, maybe with a coauthor?) are basically just cosmetic, a way to dress up an old 18th century paradox so it looks new enough to publish.

  I wasn't convinced but couldn't say why on the spot — it was like 1am and we'd had a couple beers by that point lol. I have this nagging memory from a stats class that the "problem" with Pasadena isn't just that the expected value is big or infinite the way it is with St. Petersburg, but that its not even well-defined as a single number, like the answer changes depending on the order you add the terms up in, which seems like it should matter a lot for whether Theo's "one paradox, two costumes" story actually holds together. Am I remembering that right? And if so, does that mean bounding the utility function is basically a red herring for what's really going on in Pasadena, or does it end up fixing that version too, just for a totally different reason than it fixes St. Petersburg? Basically I want to know if Theo's take is defensible or if he's collapsing two genuinely different problems into one just because they both involve infinity and doubling.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a late-night debate with their friend Theo about the Pasadena game versus the St. Petersburg paradox. Theo argues that both are essentially the same, just with cosmetic differences, because both involve doubling payouts and probabilities leading to infinite expected value. The user isn't convinced and recalls that in the Pasadena game, the expected value isn't just infinite—it's undefined because the sum's value depends on the order of terms. 

  First, I need to verify if the user's memory is correct. The Pasadena game, introduced by Hájek and Nover, has payouts that alternate in sign: +$2, -$2, +$8, -$8, etc. The probabilities decrease as 1/(n log n)^2 or similar. When you try to compute the expected value, the series ∑ [(-1)^{n+1} * 2^n / (n p_n)] doesn't converge absolutely. That means Riemann's rearrangement theorem applies: rearranging the terms can make the sum converge to any real number, diverge, or oscillate. So yes, the expected value isn't a single number—it's order-dependent. 

  In contrast, the St. Petersburg paradox has all positive terms. The series ∑ (2^n * 1/2^n) = ∑ 1, which diverges to infinity. The expected value is infinite, not undefined. So the core issue differs: one is divergence, the other is conditional convergence leading to indeterminacy. 

  Theo's point about both being "fixed" by a bounded utility function needs examination. For St. Petersburg, a concave utility function like log utility makes the expected utility finite. For Pasadena, even with utility, if the series of utilities is conditionally convergent, rearrangement could still affect the sum. However, if the utility function is bounded, the terms might decrease fast enough to ensure absolute convergence. For example, if U is bounded and the probabilities decay sufficiently, |U(x_n)| p_n could sum absolutely. So bounded utility might resolve both, but for Pasadena, it's by preventing conditional convergence, whereas for St. Petersburg, it tames divergence. 

  The user's deeper need seems to be understanding whether the structural difference in the paradoxes matters for decision theory. They might be interested in how different resolutions apply—order dependence versus unbounded expectations. Theo's conflation overlooks the nuance that Pasadena's problem isn't just magnitude but definition, which affects rational choice under uncertainty differently. Highlighting this distinction is key to countering Theo's argument.
answer: |-
  You're absolutely right to push back on Theo's take—he's collapsing two fundamentally distinct phenomena into one. While both paradoxes exploit infinite series and involve \(2^n\) growth with \(2^{-n}\) probabilities, the devil is in the **conditional convergence** of the Pasadena game. Here's why it matters:

  ### 1. **The Core Difference: Defined vs. Undefined Expectation**
     - **St. Petersburg**:  
       - Payouts: \(2^n\) dollars with probability \(2^{-n}\) (all positive).  
       - Expected value: \(\sum_{n=1}^{\infty} (2^n \cdot 2^{-n}) = \sum_{n=1}^{\infty} 1 = \infty\).  
       - **The series diverges to infinity**. There’s no ambiguity—the expectation is infinitely large.
     - **Pasadena Game** (Hájek & Nover, 2003):  
       - Payouts: \((-1)^{n+1} \cdot 2^n / n\) dollars with probability \(p_n\) (e.g., \(p_n \propto 1/(n \log^2 n)\)).  
       - Expected value: \(\sum_{n=1}^{\infty} (-1)^{n+1} \cdot \frac{2^n}{n} \cdot p_n\).  
       - **The series is conditionally convergent but not absolutely convergent**.  
       - By the Riemann rearrangement theorem, **reordering the terms** can make the sum converge to *any real number*, diverge to \(\pm\infty\), or oscillate.  
       - **The expected value doesn’t exist as a unique value**. It’s mathematically undefined.

  ### 2. **Why Bounded Utility Doesn't "Fix" Pasadena the Same Way**
     - **St. Petersburg**:  
       A bounded utility function (e.g., \(u(x) = \log(x)\) or \(u(x) = \sqrt{x}\)) solves the paradox because it forces convergence:  
       \(\sum_{n=1}^{\infty} u(2^n) \cdot 2^{-n} < \infty\).  
       *The problem was divergence; utility tames it.*
     - **Pasadena**:  
       - Applying a bounded utility *might* make the series absolutely convergent **if the utility decays fast enough**.  
       - **But the core pathology remains**: If the utility-transformed series is *still* conditionally convergent (e.g., with slow-growing \(u(x)\)), rearrangement can still alter the expected utility!  
       - **Example**: With \(u(x) = \arctan(x)\), the payouts become \(u((-1)^{n+1} \cdot 2^n / n)\). The alternating signs and harmonic decay can still permit rearrangement dependence.  
       - *Utility doesn't just "bound" the problem—it has to overcome the conditional convergence inherent in the game’s structure.*

  ### 3. **Theo's Mistake: "Same Paradox, Different Costume"**
     Theo is correct that both paradoxes:
     - Involve high-variance, low-probability payouts scaling with \(2^n\).
     - Challenge naive expected value maximization.
     - *Can* be mitigated by bounded utility in practice.

     **But he misses the mathematical gulf**:
     - St. Petersburg has a **divergent expectation** (well-defined, just infinite).
     - Pasadena has an **undefined expectation** (no single value, order-dependent).

     This isn’t cosmetic—it’s a qualitative difference. Pasadena reveals a deeper pathology: **rational agents could "choose" their expected utility by how they mentally order the outcomes**. This doesn’t exist in St. Petersburg.

  ### 4. **Why This Matters for Decision Theory**
     - **St. Petersburg** is about **unbounded utility** (how much do we value extreme riches?).
     - **Pasadena** is about **non-measurability** (can we even define expectation for some games?).  
       It undermines the very idea that every game has a unique "fair price".

  ### Verdict
  Your memory is spot-on. Theo’s take is **not defensible** as stated. He’s conflating two distinct paradoxes:
  - St. Petersburg: **Infinite expectation**.  
    Fixed by bounding utility to ensure convergence.
  - Pasadena: **Pathological expectation** (order-dependence).  
    Requires either (a) fast-decaying utility to force absolute convergence, or (b) a new decision theory (e.g., Paul Weirich’s "relative expectation") to handle non-measurable gambles.

  **Next time Theo brings this up**:  
  > *"St. Petersburg is like a rocket shooting to infinity—utility puts a ceiling on it. Pasadena is like a quantum fluctuation; its 'value' depends on how you look at it. Bounded utility might stabilize it, but it’s solving a different problem."*  
  > *(Then hand him another beer and cite Hájek & Nover, 2003.)* 🍻

  ---

  **References**:  
  Hájek, A., & Nover, H. (2003). *Vexing Expectations*. Mind (or Hájek's later papers).  
  Weirich, P. (1984). *The St. Petersburg Gamble and Risk*. Philosophy of Science.
