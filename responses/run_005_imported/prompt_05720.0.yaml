  I'm working on a heist novel where the same crew pulls off a string of jobs together - everyone signs on knowing upfront it's exactly four scores and then they scatter for good. My co-writer wants the big double-cross to land on the last job, which feels dramatically right, but then I fell down a game theory rabbit hole - apparently if it's common knowledge that everyone's rational and the number of jobs is fixed in advance, the "correct" answer is that nobody should trust anybody even on job one, because the betrayal is supposed to unravel all the way back to the start, not just show up at the end. I don't really get the mechanics of why knowing about the last job poisons the first one too. And I read that theres a genuine dispute among game theorists about whether that backward reasoning even holds together once someone doesn't defect "on schedule" - like, what's a rational player even supposed to conclude at that point? Can you walk me through the actual unraveling logic and where the crack in it is supposed to be, in enough depth that I could semi-legitimately put a version of it in a character's mouth?
