  Realist: "But then how do you avoid the paradox? The problem was that KP and NonO together lead to contradiction. You've restricted KP to basic propositions, so KP no longer applies to q ∧ ¬Kq. So we can have both KP (for basic propositions) and NonO without contradiction. But then you have to accept that there might be unknowable truths? Specifically, q ∧ ¬Kq might be an unknowable truth. But that seems to go against the core verificationist idea that truth is knowability. If there are truths that are not knowable (even if they are non-basic), then truth cannot be defined as knowability. Because here's a truth that isn't knowable."

  Verity: "But note: I don't concede that q ∧ ¬Kq is unknowable. I just don't have a principle that says it must be knowable. Maybe it is knowable. The point is that the knowability principle doesn't force it to be knowable, so we avoid the contradiction. And as a verificationist, I can still maintain that all truths are knowable in principle, but I don't have to derive that from a general principle that applies to every proposition indiscriminately. I might have a more nuanced view."

  Realist: "But then what is your account of truth for non-basic propositions? If you say that truth for non-basic propositions is still knowability, then you must hold that q ∧ ¬Kq is knowable. But then we are back in the paradox: because if it is knowable, then ◊K(q ∧ ¬Kq), and that leads to contradiction. So you have to either say that q ∧ ¬Kq is not knowable (which violates verificationism) or you have to give up NonO (which is absurd)."

