  Realist: "But then, what about a basic proposition q that is true and not known? We agree that such a q exists? Because we are not omniscient. Now, the proposition q is true and basic, so by your restricted KP, it is knowable: ◊Kq. But note that the proposition 'q and it is not known that q' — that is, q ∧ ¬Kq — is a true proposition. But you don't apply KP to it. So you don't claim it is knowable. But then, as a verificationist, do you hold that every truth is knowable? If so, then you must hold that q ∧ ¬Kq is knowable. But then we have the same problem: ◊K(q ∧ ¬Kq) leads to contradiction. So you must either abandon the idea that every truth is knowable (which is the core of verificationism) or you must abandon NonO. But NonO is undeniable."

