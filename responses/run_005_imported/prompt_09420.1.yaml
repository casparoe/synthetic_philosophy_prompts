  We are creating a dialogue between two characters: Verity (a verificationist) and Realist (a realist). The setting is after a seminar where Fitch's paradox has been presented. The paradox is:

  Knowability Principle (KP): ∀p (p → ◊Kp)  [If p is true, then it is possible to know p]
  Non-omniscience (NonO): ∃p (p ∧ ¬Kp)   [There is some true proposition that is not known]

  From these, we can derive (via Fitch's argument) that every truth is actually known: ∀p (p → Kp), which contradicts NonO.

  The derivation is:
  1. Suppose p ∧ ¬Kp (for some p, by NonO)
  2. Then ◊K(p ∧ ¬Kp)  (by KP on p ∧ ¬Kp)
  3. But K(p ∧ ¬Kp) implies Kp ∧ K¬Kp, which implies Kp ∧ ¬Kp (because if you know ¬Kp, then you know that you don't know p, so indeed ¬Kp). Contradiction.
  4. Therefore, it is impossible to know (p ∧ ¬Kp), so ¬◊K(p ∧ ¬Kp) (which contradicts step 2).

  Hence, the assumption (NonO) must be false? Or KP must be false? The paradox.

  Verity (verificationist) wants to defend KP, so they must adjust something. Realist will push back.

  We'll have Verity try one of the moves from the literature: restricting the knowability principle to "basic" propositions (or atomic propositions) only. The idea is that KP only applies to propositions that do not contain epistemic operators. Then, the problematic proposition (p ∧ ¬Kp) is not basic (because it contains K) and so KP doesn't apply to it.

  But Realist will counter: what about a proposition that is basic but unknown? Then we can form a conjunction with a known truth? Or perhaps we can consider a proposition that is basic and unknown, and then form the conjunction? We must be careful.

  Alternatively, we can have Verity try to change the logic (to intuitionistic logic) so that the derivation does not go through.

  I choose the restriction move because it is a common one. Let's see:

  Verity: "Okay, but note that the knowability principle was only intended for basic, non-epistemic propositions. The proposition (p ∧ ¬Kp) is self-referential in a way — it talks about knowledge. So we don't have to apply KP to that."

