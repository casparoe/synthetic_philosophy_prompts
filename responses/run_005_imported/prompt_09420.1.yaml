  Verity: "Not necessarily. I can hold that even though the knowability principle doesn't apply, it might still be knowable. But I don't have to say it is. So I don't have to commit to ◊K(q ∧ ¬Kq)."

  Realist: "But then, as a verificationist, you must hold that truth is knowable. So if q ∧ ¬Kq is true, you must hold that it is knowable. But if you hold that, then we are back in the paradox. So you have to deny that it is knowable. Therefore, you have to deny that every truth is knowable. But that's the heart of verificationism."

  Verity: "Perhaps I can refine verificationism: truth is knowable for basic propositions, and for compound propositions, their truth is a function of the truth of the parts. But then for q ∧ ¬Kq, it is true exactly when q is true and ¬Kq is true. And we've already said that q is knowable (because it's basic) and ¬Kq might be knowable (as we discussed). But we cannot know them together. So the conjunction is not knowable. But then, if verificationism is only about basic propositions, then we are okay. But that seems like a retreat."

  Realist: "Exactly. So verificationism becomes a thesis only about basic propositions. Then for non-basic propositions, there might be unknowable truths. But that seems to abandon the global anti-realism that motivated verificationism in the first place."

