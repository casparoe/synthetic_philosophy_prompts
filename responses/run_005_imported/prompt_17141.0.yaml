  ## The Uneasy Scales: Why Quinean Naturalism Tilts Towards Harman's Skepticism

  Quinean naturalism, with its rejection of first philosophy and its commitment to understanding knowledge as a seamless web woven from sensory stimuli, presents a profound challenge to traditional moral epistemology. While Quine himself offered only sparse commentary on ethics, his epistemological framework – particularly the holism of the "web of belief" and the criterion of empirical content – provides the tools to rigorously evaluate the cognitive standing of moral judgments. The central question is whether this framework, consistently applied, can accommodate moral facts as conceived by naturalized moral realists like Sturgeon and Boyd, or if it inevitably leads to the skeptical conclusion championed by Harman. **Upon close examination, while Quine’s holism offers an initial opening for moral realism, the core empiricist engine of his naturalism – the demand for empirical content traceable to sensory stimuli – ultimately vindicates Harman’s skepticism and renders Quine’s own reticence consistent, not a tension.**

  **The Holistic Opening: A Glimmer for Realism?**

  Quine’s dissolution of the analytic/synthetic distinction and his holistic picture of knowledge ("The unit of empirical significance is the whole of science") seem, at first glance, promising for moral realism. The Cornell realists, particularly Sturgeon, seize upon this. They argue that moral properties, like theoretical posits in physics (electrons, quarks), earn their keep through *explanatory indispensability* within our best overall theory of the world, understood holistically.

  *   **Sturgeon’s Explanatory Gambit:** Sturgeon contends that moral facts *do* genuine explanatory work. For instance, he argues that the *sheer injustice* of slavery explains the depth and character of the abolitionist movement in a way that cannot be fully reduced to non-moral psychological or sociological facts. The moral property "injustice" is causally efficacious in producing certain observable social phenomena (organized resistance, specific rhetoric). If such explanations are indispensable to our best understanding of human history and social dynamics, then, the realist argues, Quinean holism *should* license moral facts just as it licenses electrons. Boyd adds that moral properties can be "homeostatic property clusters" discoverable through empirical investigation, akin to natural kinds. The epistemology is the same coherentist, holistic method Quine endorses for science: inference to the best explanation within the evolving web.

  *   **Challenging Harman’s Parsimony:** From this perspective, Harman’s demand for parsimony – rejecting moral facts because they don't explain *sensory observations* – appears question-begging. It assumes a narrow, foundationalist empiricism that Quine explicitly rejected. If holism allows posits justified by their role in explaining *other beliefs and phenomena* within the interconnected system, and moral properties play such a role in our understanding of human behavior and society, then the naturalist *should* accept them. To deny this, the realist argues, is to arbitrarily privilege physical explanation or impose a double standard inconsistent with Quine's own anti-dualist, holistic principles. Quine’s remark about the fact/value distinction being a matter of degree seems to bolster this line, suggesting moral judgments aren't utterly alien to the empirical web.

  **The Empiricist Core: Why Harman’s Challenge Prevails**

  Despite the initial plausibility of the holistic argument for realism, a deeper analysis reveals that Quinean naturalism's fundamental commitment to *empirical content* ultimately undermines it and aligns with Harman's skepticism.

  1.  **The Tribunal of Experience Revisited:** Quine’s crucial caveat, explicitly stated in "On the Nature of Moral Values," cannot be dismissed: moral judgments are *not* answerable, "even remotely and holistically, to any tribunal of sensory experience." While the *web* is holistic, its *anchor* remains sensory stimulation. The meaning of theoretical terms, and their claim to reality, ultimately derives from their systematic connection (however complex and mediated) to patterns of sensory input. Physics posits electrons not merely for internal coherence, but because the posits help systematize and predict observable phenomena in laboratories and the cosmos. The posits earn their credentials by enhancing our ability to anticipate sensory experience.
  2.  **Harman’s Explanatory Irrelevance Sharpened:** Harman’s point isn't merely about parsimony; it's about the *kind* of explanation moral facts provide. When we observe an act we judge cruel, the *sensory observation* (the act itself) is explained by the agent's psychology, social context, biological impulses – the non-moral facts of the situation. **The moral fact ("this is cruel") does no work in explaining the *occurrence of the sensory experience itself*.** We don't need to posit the property "cruelty" to explain why we *saw* the kicking; we need the physical facts about light, optics, and neural processing. The moral judgment *supervenes* on the non-moral facts but adds no *independent* causal-explanatory power *at the level of sensory input*. As Harman puts it, you can explain the physicist's observations by citing electrons, but you don't explain the observer's moral reaction by citing moral facts; you explain it by citing their psychology and the non-moral facts they observed.
  3.  **The Gap in the Realist Explanation:** The Cornell response – that moral facts explain *social phenomena* like abolitionism – faces a critical Quinean challenge: Does this explanation *genuinely connect to the sensory tribunal*? While "injustice" might *label* a complex pattern of social facts (oppression, suffering, resistance) that causally contribute to social movements, Quinean empiricism demands showing that positing the *irreducible moral property itself* adds predictive/explanatory power *regarding future sensory inputs* that cannot be gained by referring only to the underlying non-moral properties (psychological states, economic conditions, power dynamics). The realist struggles to demonstrate that the moral property does unique causal work *distinct* from its non-moral base *in a way that impacts sensory predictions*. Without this link to sensory experience, the posit remains, from a strict Quinean perspective, empirically ungrounded, a wheel that spins without connection to the engine of empirical control.
  4.  **Degree vs. Kind and the Location of Ethics:** Quine’s comment that the fact/value distinction is a matter of degree is often overplayed. While rejecting a *metaphysical* chasm, his epistemology places ethics significantly farther from the sensory periphery than science. Moral judgments primarily function to *evaluate* and *motivate* based on patterns recognized within experience, not to *predict* or *systematize* the course of sensory experience itself in the way scientific laws and posits do. Their connection to the "tribunal" is indirect and mediated through our contingent sensibilities and cultural frameworks, not through a direct, testable link to sensory input patterns.

  **Verdict: Quine Earned His Skepticism**

  Therefore, a fully consistent application of Quinean naturalism supports Harman's skepticism over Sturgeon and Boyd's realism. While Quine's holism dissolves rigid boundaries and initially seems hospitable to diverse posits, the bedrock requirement of his epistemology is empirical accountability: concepts must contribute to the systematic anticipation and explanation of sensory experience. Moral properties, as posited by realists, fail this test. They may provide satisfying explanations *within* the domain of human interaction and evaluation, but they do not demonstrably enhance our ability to predict or explain the course of sensory stimulation itself in a way irreducible to non-moral explanations. Their explanatory power, however real it may feel psychologically or socially, is not *empirical-explanatory* power in the specific sense demanded by Quine's naturalized empiricism.

  Quine's reticence on substantive ethics was not a tension within his system but a consequence of it. His skepticism about the cognitive standing of ethics – its lack of a direct or robustly holistic empirical tribunal – is precisely what his naturalism, centered on the web of belief anchored in sensory input, entails. The Cornell realists offer a powerful challenge, demonstrating how moral properties *could* function within a holistic framework. However, they cannot bridge the crucial gap: showing that moral facts play an indispensable role in explaining the sensory experiences that form the ultimate court of appeal for the Quinean naturalist. Consequently, the consistent Quinean must conclude that moral judgments, however important, lack the kind of empirical grounding that warrants belief in corresponding facts, leaving them outside the realm of naturalistically respectable knowledge.
