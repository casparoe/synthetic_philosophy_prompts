answer: |-
  Your situation is a fascinating (if painful) real-world example of **strategic precommitment backfiring due to mutual escalation and audience costs**, falling squarely within the Schelling tradition and intersecting with several key concepts in game theory, bargaining theory, and social psychology. Here's a breakdown:

  1.  **The Theoretical Frameworks:**
      *   **Schelling's Commitment Strategy:** Your cousin was correct about the *potential* advantage of first-mover commitment (Schelling's "strategic move"). By publicly declaring a non-negotiable position, your sister aimed to:
          *   **Reduce your perceived bargaining range:** Framing the house as a *need* rather than a *want* attempts to make any counter-offer excluding the house seem unreasonable.
          *   **Create Audience Costs:** Public commitment raises the cost of backing down. Concession isn't just losing the house; it's losing face, credibility, and "standing" within the family network. This makes her threat *credible*.
      *   **The Commitment Race & Mutual Hostage Taking:** The core problem arises when *both* parties attempt this strategy simultaneously or reactively. This creates:
          *   **A Nash Equilibrium of Deadlock:** Individually, committing hard and early *was* rational for each of you *given the expectation the other might do it first*. Your fear of her position hardening was well-founded. However, the mutual best response to the other's commitment is to commit yourself, leading to a stable but mutually destructive outcome (the standoff). This is analogous to a **Prisoner's Dilemma in commitment**: Individually rational choices leading to a collectively worse outcome.
          *   **Mutual Hostage Taking:** Each of you has effectively taken the other's reputation hostage. Your ability to concede is constrained by your audience costs, and vice versa. Concession by either requires the other to also concede or absorb the win, further complicating resolution.
      *   **Competing Focal Points:** Schelling also emphasized the power of focal points (Schelling points) as natural coordination solutions. Your sister tried to *create* a focal point (she gets the house) by announcing first. Your counter-claim created a *competing* focal point (split assets). Now, *neither* focal point dominates, destroying the potential for coordination.
      *   **Sunk Cost Fallacy & Escalation of Commitment:** Once publicly committed, the psychological cost of backing down feels immense ("sunk costs" in reputation). Every day the standoff continues, these perceived costs increase, further entrenching positions, even if a fairer division was objectively preferable earlier.

  2.  **Were You Behaving Rationally?**
      *   **Individually, Conditionally Rational:** *Given your sister's initial move*, your impulse to counter-commit was strategically understandable. Allowing her claim to stand unchallenged *would* have likely solidified it as the default outcome. You were rationally responding to her strategic action to prevent being cornered.
      *   **Collectively Irrational:** The *combination* of both players employing this tactic predictably leads to the worst-case scenario: costly conflict (lawyers, time, family strife) instead of potential Pareto improvement (a mutually agreeable split). The theory (especially game theory models of precommitment races) suggests this outcome *is* predictable.
      *   **The Mistake: Failure of Higher-Order Reasoning:** The subtle flaw wasn't necessarily in the individual response *after* the first move, but in the **failure to anticipate the high risk of mutual precommitment *before* anyone moved.** While your sister initiated, the *environment* (the cousin's advice, the lack of a neutral referee, family dynamics ripe for audience costs) made a commitment race highly probable. Ideally, recognizing this risk *in advance* might have led to a pre-emptive agreement *not* to make public, non-negotiable claims, or to establish a neutral mediation process *first*.

  3.  **A Recognized Account: The Name**
      This dynamic is often called a **Commitment Race** or **Mutual Hostage Taking via Audience Costs**. It's a specific failure mode of Schellingesque commitment strategies in bilateral bargaining scenarios with reputational stakes. It's closely related to:
      *   **Brinkmanship:** Pushing a situation to the edge of disaster hoping the other side backs down first – but here, both are pushing.
      *   **Coordination Failure:** Inability to settle on a mutually beneficial equilibrium due to competing focal points and high switching costs.

  4.  **The Way Out: Escaping the Deadlock**
      Escaping a mutual commitment trap is hard but possible. The key is **reducing audience costs, reframing the negotiation, and introducing new mechanisms:**

      *   **Formal Mediation (Leveraging the "Audience"):** This is the most practical step. A professional mediator (not just your cousin!) is crucial.
          *   **Provides Cover for Concessions:** Concessions made in mediation can be framed as "compromises suggested by the neutral expert" or "necessary for resolution," reducing the direct reputational hit. It creates a semi-private space.
          *   **Reframes the Problem:** Shifts focus from "who wins" to "how can we solve this fairly and efficiently?".
          *   **Manages Communication:** Prevents further public escalation and miscommunication.
      *   **Reframe the Narrative Publicly:** Jointly (or via parents/trusted relatives if possible) announce you've *both* decided mediation is the best path forward for family harmony and honoring your grandmother. This publicly shifts the goalposts away from the initial demands and makes backing down look like mature cooperation, not weakness.
      *   **Introduce New Variables:** Break the binary deadlock by introducing options not part of the initial demands:
          *   **Time-Share/Deferred Sale:** One lives in the house now but agrees to sell in X years, splitting proceeds then (or buying the other out at a pre-agreed formula).
          *   **Creative Asset Swaps:** Beyond just house vs. savings. Are there sentimental items? Future obligations? Can one buy the other out over time?
          *   **Leverage the Savings:** Use savings to facilitate a buyout or cover transaction costs, making a split more feasible.
      *   **Face-Saving Concessions:** Structure the agreement so *both* sides can claim partial victory or emphasize the "greater good" aspect. Maybe you "concede" the house but get a slightly larger share of savings than a strict 50/50 split would dictate, framed as "compensation for flexibility."
      *   **Apology/Framing (Risky but Potentially Powerful):** One of you (or both, ideally) could make a *limited*, sincere statement acknowledging the escalation: "Look, I got caught up in the stress and dug in too hard publicly. I shouldn't have made it an ultimatum before we talked. Grandma wouldn't have wanted this. Can we reset with the mediator and find a real solution?" This requires courage but can dramatically reduce audience costs by reframing the initial commitment as a mistake born of emotion, not a core principle.

  **Conclusion:**

  Your analysis is spot-on. You experienced a classic **Commitment Race** leading to a **Mutual Hostage Situation** sustained by **Audience Costs**. Individually, your reactive commitment was strategically rational *given your sister's first move*. Collectively, the outcome was predictably disastrous – a Nash Equilibrium of deadlock worse for both than no commitment. The failure lay in the pre-emptive environment fostering this race and the lack of safeguards against it.

  The way out isn't easy, but it exists: **Engage a professional mediator immediately.** This provides the structure, neutral framing, and semi-private space needed to reduce audience costs, explore creative solutions, and find a face-saving resolution that avoids the total loss scenario of prolonged legal battles. Your understanding of the underlying theory is your best asset – use it to recognize the trap you're in and advocate for the mechanism (mediation) designed to escape it. Good luck.
