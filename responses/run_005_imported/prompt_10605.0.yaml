answer: |-
  ## The Shared Intention Showdown: Why Bratman Holds the Floor (Mostly)

  The debate over the nature of shared intention – whether it's reducible to individual mental states or requires irreducible collective entities or modes – is the heart of social ontology. Michael Bratman's reductive account, Margaret Gilbert's plural subject theory, and John Searle's primitive we-intentions offer starkly different solutions. Testing these against paradigmatic cases – the coordinated sofa carry and the spontaneous car push – reveals that while Gilbert powerfully captures the *normative* dimension Searle highlights an important *phenomenological* aspect, **Bratman's interlocking individualist account provides the most robust, ontologically economical, and explanatorily powerful framework, successfully generating normativity as an emergent feature without requiring irreducible collective entities or primitive modes.** His model withstands the strongest objections when properly understood.

  **Bratman's Machinery: Interlocking Intentions and Emergent Structure**
  Bratman argues shared intention (e.g., "We intend to carry the sofa upstairs") is not a primitive state but a complex structure of individual, future-directed intentions:
  1.  **Interlocking Intentions:** Each agent has an intention of the form "I intend that we J" (e.g., "I intend that we carry the sofa").
  2.  **Interdependence:** Each intends that the joint activity (J) occurs *because* of the intentions of the others. My intention that *we* carry it isn't just that *I* carry it while you happen to also carry it; my plan *depends* on your intention and action.
  3.  **Common Knowledge:** Each knows the intentions of the others (1 & 2) and knows this is mutually known.
  4.  **Meshing Subplans:** The agents' individual subplans for achieving J are compatible and can be coordinated. They don't need identical subplans, but their plans must be mutually adjustable to avoid conflict.
  5.  **Mutual Responsiveness:** Each is committed to being responsive to the intentions and actions of the others in acting towards J.

  **Gilbert's Normative Challenge and Searle's Primitive Mode**
  Gilbert argues Bratman's picture misses the essential *normativity* of shared action. When we form a "plural subject" through joint commitment (e.g., agreeing to walk together), we create mutual obligations and entitlements. If you suddenly abandon the sofa carry mid-flight, I don't just see a change in your individual intention; I feel *entitled to rebuke you* for violating *our* commitment. This normative force, she contends, cannot emerge from a mere bundle of "I-intend-that-we" states plus common knowledge. The obligation is *to the group*, not derivable from individual promises or intentions alone.

  Searle takes a different tack, arguing that "we-intentions" are a primitive form of intentionality irreducible to "I-intend-that-we" constructions. Trying to paraphrase "We intend to push this car" solely in terms of individual intentions directed at a collective outcome ("I intend that we push it", "You intend that we push it") fails to capture the *collective mode* of the intention itself. For Searle, the "we" is intrinsic to the intentional state.

  **Testing the Theories: Sofa Carry & Spontaneous Car Push**

  1.  **The Structured Sofa Carry:**
      *   **Bratman:** Easily handles this. Alice intends *that we* carry the sofa upstairs *because* Bob intends it too (interlocking, interdependence). They discuss the route (meshing subplans). They both know the other is committed (common knowledge). They adjust pace and grip (mutual responsiveness). If Bob drops his end unexpectedly, Alice experiences frustration because (a) her intention *depended* on his continued participation, (b) his action violates the mutual responsiveness built into their interdependent plans, and (c) his action frustrates her goal (getting the sofa upstairs) that was constitutively tied to *their* joint action. Her rebuke ("Hey! We were carrying that!") stems from this interdependence and the violation of the expectations constitutive of their shared plan. It *is* normative, but grounded in the structure of their individual commitments and reliance.
      *   **Gilbert:** Captures the rebuke perfectly: Bob violated the joint commitment constituting their plural subject. This is elegant and intuitive.
      *   **Searle:** Argues Alice and Bob each have a primitive "we-intend" state from the outset. While descriptively plausible, it doesn't obviously *explain* the normativity better than Gilbert or Bratman's emergent structure. It risks being a label for the phenomenon rather than an analysis.

  2.  **The Spontaneous Car Push:**
      *   **The Challenge:** Two strangers see a car stalled on a hill. Without a word, one starts pushing. The other immediately joins. They coordinate their efforts, pushing together until the car starts rolling. This seems like a clear case of shared intention ("We intend to push this car") emerging *without* prior agreement, explicit or implicit.
      *   **Bratman:** **This is the crucial test, and Bratman can meet it.** The initial pusher (P1) acts with an individual intention: "I intend to push this car." When the second stranger (P2) joins, a dynamic process begins:
          *   P2 forms the intention "I intend *that we* push this car" upon seeing P1 pushing and recognizing the opportunity/need for joint action.
          *   P1, seeing P2 join and push, *adjusts* their intention: It becomes "I intend *that we* push this car" *because* P2 is now participating. P1 now relies on P2's effort.
          *   **Interdependence Emerges:** P1 intends the pushing *because* P2 is pushing; P2 intends the pushing *because* P1 initiated it and is continuing. Their efforts are mutually responsive – they adjust force and position based on each other.
          *   **Common Knowledge Develops:** Through their coordinated actions (pushing together, glancing at each other, perhaps a nod), mutual awareness of their joint effort and mutual reliance becomes evident. They *know* the other is committed to the joint push.
          *   **Meshing Subplans:** Their subplans (simply "push") are trivially meshing and coordinated through mutual responsiveness.
          *   **Normativity Emerges:** If P2 suddenly stops pushing without warning, P1 experiences a normative response. Why? Because P1 *relied* on P2's continued effort as part of the interdependent structure that *became* their shared intention. P2's defection violates the mutual responsiveness and interdependence that spontaneously crystallized. P1's rebuke ("Hey, don't stop!") is justified by the *actual structure of reliance and responsiveness* that constituted their shared activity, not a prior agreement. Bratman's dynamic mutual responsiveness is key here.
      *   **Gilbert:** Struggles profoundly. Where is the *joint commitment*? There was no agreement, explicit or implicit. They didn't "form a plural subject" through a commitment act. Yet, the obligation to continue and the entitlement to rebuke seem present. Gilbert might posit a very rapid, non-verbal "joint commitment" act, but this seems ad hoc and stretches the concept thin. The normativity arises *from the structure of the action itself*, not a prior commitment act.
      *   **Searle:** Posits that upon joining, P2 immediately forms a primitive "we-intention," and P1's intention shifts to a "we-intention." This captures the *phenomenology* – they *feel* like a "we" acting. However, it doesn't explain *why* this mode arises spontaneously or *how* it generates normativity any better than Bratman's account. It also risks obscuring the dynamic process of intention formation and adjustment that Bratman elucidates.

  **The Verdict: Bratman Wins (With Qualifications)**

  1.  **Ontological Economy & Explanatory Power:** Bratman wins decisively on ontological grounds. He explains shared agency using only individual attitudes (intentions, beliefs/knowledge) and relations between them (interlocking, interdependence, mutual responsiveness). He avoids positing irreducible collective entities (Gilbert's plural subjects) or primitive mental modes (Searle's we-intentions) without explanatory loss. His framework integrates seamlessly with broader theories of individual agency and planning.
  2.  **Generating Normativity:** Bratman successfully generates the normative force Gilbert champions as an *emergent property* of the interdependent, responsive structure of interlocking intentions. The obligation and entitlement arise from the *reliance* and *dependence* inherent in the structure:
      *   **Strong Objection (Gilbert):** "But the rebuke is addressed to the defector *as a member of the group*, invoking *our* commitment, not just *my* disappointed individual expectation!" **Reply:** Bratman can agree. The "our" in the rebuke reflects the *interdependent structure* that was constitutive of the shared intention. "Our" refers to the specific relationship of mutual responsiveness and reliance *between these individuals* concerning *this action*. It doesn't require a metaphysically distinct group entity; it refers to the relational property constituted by their interlocking states and actions. The rebuke invokes the *actual web of reliance* the defector participated in and then violated.
      *   **Strong Objection (Searle):** "The 'we-intention' is phenomenologically primary and irreducible! The 'I intend that we' formulation is a philosopher's reconstruction, not the agent's experience." **Reply:** Searle identifies a real phenomenological aspect. However, Bratman's mutual responsiveness *explains how that phenomenology arises*: the constant adjustment and attention to the other *in service of the interdependent intention* creates the *sense* of joint agency. The "we-mode" is the experiential correlate of the complex interlocking structure, not its foundation. Furthermore, Bratman's account better explains *how* such intentions form dynamically, as in the spontaneous car push.
  3.  **Handling Spontaneity:** Bratman's framework, particularly the dynamic role of mutual responsiveness, provides the most plausible account of the spontaneous car push. Normativity emerges *from* the evolving structure of interdependence and reliance during the action itself, without needing a prior commitment act (Gilbert) or positing an unexplained primitive shift (Searle). The strangers become a "we" *through* the process of responsive, interdependent action.

  **Qualification:** Bratman's victory is not absolute. Gilbert powerfully identifies the *distinctive character* of the normative claims in shared agency. While Bratman generates normativity, the *specific flavor* of obligations *to the group* might feel more naturally captured by Gilbert's joint commitment metaphor. Searle is likely correct that the *experience* of joint action often feels like a primitive "we-mode." However, these are reasons to *augment* our understanding of Bratman's structure, not abandon it. The core explanatory work – how shared intention functions, coordinates action, and generates obligations *in virtue of individual attitudes and their relations* – is best done by Bratman.

  **Conclusion:** In the contest to explain shared intention, Bratman's reductive account triumphs. It provides a clear, ontologically parsimonious, and dynamically rich explanation that spans both structured collaborations and spontaneous joint actions. While Gilbert illuminates the unique normativity and Searle points to the distinctive phenomenology of "we-ness," Bratman demonstrates that this normativity and phenomenology are emergent properties of complex structures of interlocking individual intentions characterized by interdependence, mutual responsiveness, common knowledge, and meshing subplans. The obligations of shared agency are the obligations of deep, acknowledged, and responsive interdependence. We do not need plural subjects or primitive we-intentions; the sophisticated architecture of individual planning agency, when interlocked, is sufficient to build the social world. Bratman's reduction holds.
