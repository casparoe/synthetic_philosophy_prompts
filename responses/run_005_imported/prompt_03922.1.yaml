  Next, the user mentions the irony with P.F. Strawson's reactive attitudes. Galen's argument might be targeting a different concept than his father's. P.F. Strawson's "Freedom and Resentment" argues that moral responsibility is rooted in interpersonal relationships and reactive attitudes, not metaphysical ultimacy. So Galen's critique might not engage with this framework but instead imposes an external requirement.

