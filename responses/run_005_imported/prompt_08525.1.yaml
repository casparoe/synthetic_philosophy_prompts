  Quick sanity check before I file this: I'm doing a column on weird overlaps between theology and philosophy of law, and my hook is C.S. Lewis's 1997 paper "Do We Believe in Penal Substitution?", where he argues that Christ taking our punishment works kind of like a friend paying off your parking ticket -- the cosmic ledger just needs the debt marked paid, it doesnt care who actually forks it over. I want to lean on that analogy pretty hard, but also push back a bit -- does punishment actually transfer between people the way a debt does, or does his own argument end up undercutting that? Can you help me get the argument straight, and flag anything I've got wrong before this goes to my editor?
