  The impossibility theorem... is it deep? I think yes. It’s not an artifact; it reveals a core tension. Fairness-as-consistency (IIA) clashes with fairness-as-rewarding-opportunity (IM). You literally *can’t* have both when utilities are asymmetric. That’s profound—it says bargaining fairness isn’t monolithic.  

  For examples, I’ll use asymmetric frontiers. Imagine a startup negotiation: Founder A’s skills are niche (small utility range), Founder B’s are flexible (wide range). Nash might under-reward B if new tech emerges (expanding B’s side more)—that feels unfair. KS adjusts upward for B, which matches intuition. But if we trim options unreasonably? KS shifts, Nash holds. Which is "right"? Contextual.  

