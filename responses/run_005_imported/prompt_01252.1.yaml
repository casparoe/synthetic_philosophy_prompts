prompt: |-
  A friend and I got into a long argument over dinner about Leo Tolstoy's *What Is Art?*. It started because she had just watched Leni Riefenstahl's *Triumph of the Will* for a film class and brought up Tolstoy as a kind of test case for thinking about propaganda. Her contention was that the treatise, for all its bluster about Shakespeare, Wagner, and Beethoven being frauds, does not actually cohere as a single theory of value: she argued that Tolstoy quietly operates with two independent standards of "good art" -- one purely technical, concerning how effectively a feeling is transmitted from artist to audience, and one moral or religious, concerning whether that feeling is itself worth spreading -- and that keeping these two standards formally separate lets him have things both ways. When a work he dislikes is obviously powerful, he can concede that it is genuine art while still condemning it as "bad" on grounds of content; when a work he approves of is technically crude, he can wave that away as immaterial next to the goodness of the feeling conveyed. I was not convinced this was entirely fair to him, so afterward I went back and found the passage where the split she is describing actually gets made explicit -- it comes near the end of Chapter XV of the Aylmer Maude translation, right before he pivots to the question of subject-matter in the next chapter.

  Here is the passage:

  "And the degree of the infectiousness of art depends on three conditions:—(1) On the greater or lesser individuality of the feeling transmitted; (2) on the greater or lesser clearness with which the feeling is transmitted; (3) on the sincerity of the artist, i.e. on the greater or lesser force with which the artist himself feels the emotion he transmits. [...] Such are the three conditions which divide art from its counterfeits, and which also decide the quality of every work of art apart from its subject-matter. [...] Thus is art divided from not art, and thus is the quality of art, as art, decided, independently of its subject-matter, i.e. apart from whether the feelings it transmits are good or bad. But how are we to define good and bad art with reference to its subject-matter?"

  Could you help me work through what is actually going on logically in this passage and its handoff into the next chapter? Specifically: is my friend right that Tolstoy is committed to two genuinely independent axes of evaluation, with no principled way of weighing one against the other when they pull apart -- or is there a way of reading "sincerity," which he calls the most important of the three conditions, that ties it back to the shared "religious perception" he leans on for judging subject-matter, so that the two supposedly separate criteria turn out to be less independent than they look? And separately: does this passage commit Tolstoy to saying that something like Riefenstahl's film -- sincere, individual, and clear in its expression, but repugnant in content -- would count as genuine, if bad, art by his own lights? If so, is that a bullet he can bite, or does it actually break the theory?
reasoning: |-
  Okay, the user and their friend are debating Tolstoy's *What Is Art?* specifically regarding whether Tolstoy has two separate criteria for evaluating art: one technical and one moral. The user found a passage in Chapter XV that seems to support their friend's claim. The passage lists three conditions for art's infectiousness: individuality, clarity, and sincerity. Tolstoy states these determine the quality of art "apart from its subject-matter," then asks how to judge good and bad art based on subject-matter. 

  The user wants to know if their friend is correct about Tolstoy having two independent axes. They also ask if sincerity could bridge the gap to Tolstoy's religious morality, and whether Riefenstahl's film would qualify as genuine but bad art under this framework.

  First, unpacking the passage: Tolstoy explicitly separates the artistic criteria (infectiousness via individuality/clarity/sincerity) from moral evaluation ("apart from whether feelings are good or bad"). The handoff to Chapter XVI confirms this division—he treats subject-matter as a subsequent question. The structure is undeniably binary: first technical merit, then moral merit.

  About sincerity: Tolstoy calls it the "most important" condition because it demands authentic emotion. But he doesn't explicitly tie this to his later religious standard. A generous reading might suggest that insincere art can't transmit *any* feeling well, including moral ones, but Tolstoy never says insincerity corrupts moral content—only infectiousness. His examples (e.g., condemning Baudelaire despite technical skill) treat sincerity as purely about emotional force, not moral alignment. 

  Riefenstahl’s film fits Tolstoy’s definition of genuine art: it’s undeniably infectious (individual in its fascist vision, visually clear, and sincerely believed by Riefenstahl). Yet its content violates Tolstoy’s Christian morality. So yes, by his theory, it’s "good art" technically but "bad art" morally. 

  Does this break his theory? Well, Tolstoy would bite the bullet—he explicitly ranks moral value higher. For him, technically great but immoral art is socially harmful and thus inferior to crude but moral art. The tension lies in his claim that *only* morally good art deserves resources in an ideal society. But the two axes remain distinct: one judges artistic success, the other social utility. 

  The user’s friend is essentially correct about the dual criteria. Where Tolstoy might disagree is calling them "independent"—he’d argue moral value supersedes technical merit in importance—but they’re still logically separate categories in his analysis.
answer: |-
  Your friend has pinpointed a crucial tension in Tolstoy's theory, and the passage you've quoted is indeed the textual ground zero for this split. Let's break down the logic and implications:

  ### 1. The Explicit Split in Chapter XV
  Tolstoy clearly delineates **two distinct evaluative axes**:
  -   **Artistic Value ("Art as Art"):** Determined *solely* by the effectiveness of infection ("infectiousness"). This depends on:
      -   **Individuality:** Uniqueness of the feeling conveyed.
      -   **Clearness:** Precision in transmitting the feeling.
      -   **Sincerity:** Intensity of the artist's own feeling.
      *Result:* This axis defines whether something *is* art ("divided from not art") and its *quality as art* ("the quality of art, as art"). Crucially, this judgment is made **"independently of its subject-matter"** and **"apart from whether the feelings... are good or bad."**
  -   **Moral Value ("Good and Bad Art"):** Determined by the *content* of the feeling transmitted. This depends on whether the feeling aligns with the "religious perception" of the age (Tolstoy defines this as the universal brotherhood of man under Christian love).

  The handoff to Chapter XVI ("But how are we to define good and bad art with reference to its subject-matter?") explicitly confirms this separation. Chapter XVI then tackles the *second* axis: defining what makes the *subject-matter/feeling* good or bad based on its alignment with the prevailing "religious perception."

  ### 2. Are the Axes Truly Independent? The Sincerity Question
  Your intuition about "sincerity" as a potential bridge is insightful, but Tolstoy likely does *not* intend it that way:
  -   **Sincerity as Technical, Not Moral:** For Tolstoy, sincerity ("the greater or lesser force with which the artist himself feels the emotion he transmits") is about the *intensity* and *authenticity* of the artist's *own* emotional experience. It ensures the feeling isn't faked, making transmission possible. A Nazi filmmaker can be utterly sincere in their hatred and belief in Aryan supremacy. Sincerity makes the transmission of *that specific feeling* effective, regardless of its moral quality.
  -   **Religious Perception is External:** The "religious perception" is an objective, external standard against which the *content* of the feeling is judged *after* its artistic merit (infectiousness) has been established. An artist's sincere belief in something *contrary* to the religious perception (e.g., elitism, nationalism, hatred) doesn't make their art morally good; it makes it sincerely *bad* art. Sincerity guarantees the feeling is *real and transmissible*, not that it's *right*.
  -   **No Principled Weighing Mechanism:** When the axes conflict (high infectiousness, bad content OR low infectiousness, good content), Tolstoy offers no formula to resolve the tension. He *prioritizes* the moral axis decisively. Art with bad content is condemned as socially harmful and worthless *despite* its artistic merit ("bad art"). Art with good content but low infectiousness is valued for its moral purpose, even if artistically weak ("good art," though perhaps of lower *artistic* quality). The axes remain distinct; the moral verdict simply overrides the artistic one in terms of the work's ultimate value and social role.

  **Conclusion on Independence:** Your friend is largely correct. Tolstoy establishes two formally separate criteria. While sincerity is essential for *artistic* effectiveness, it is defined and operates within the technical/transmission axis. It is *not* inherently tied to the moral/religious axis. The lack of a mechanism to weigh conflicting evaluations is a feature, not a bug, of his theory – he resolves conflicts by prioritizing morality.

  ### 3. Triumph of the Will and Tolstoy's Theory
  Yes, according to Tolstoy's explicit definitions in Chapter XV, *Triumph of the Will* would almost certainly qualify as **genuine, but morally bad, art**:
  -   **Genuine Art (High Artistic Value):**
      -   **Individuality:** It presents a highly specific, potent feeling – the awe, power, unity, and destiny of the Nazi movement and Hitler's leadership. This feeling was distinct and powerful at the time.
      -   **Clearness:** Riefenstahl's technical mastery (cinematography, editing, composition, music) transmits the intended feelings with exceptional clarity and force. The film is a masterpiece of visual propaganda.
      -   **Sincerity:** Riefenstahl (at the time) clearly believed in the project and the feelings it conveyed. Her artistic choices radiate conviction.
      *Result:* High infectiousness = High Artistic Value ("good art *as art*").
  -   **Morally Bad Art:** The feelings transmitted – fascist adulation, militarism, racial superiority, blind obedience, the cult of personality – are diametrically opposed to Tolstoy's "religious perception" of universal Christian love and brotherhood. This makes it "bad art" based on subject-matter.

  ### 4. Can Tolstoy Bite This Bullet? Does It Break the Theory?
  *   **He Absolutely Can (and Does) Bite the Bullet:** This consequence is not a flaw *within his stated logic*; it's a direct, intended result. His theory *demands* this conclusion. He explicitly condemns art he acknowledges as infectious but morally repugnant (his critiques of Wagner, Baudelaire, etc., follow this pattern). High artistic skill transmitting evil feelings is, for him, *especially* dangerous and socially poisonous. He would condemn *Triumph of the Will* precisely *because* it is such effective art promoting such vile content.
  *   **Does It Break the Theory?** This depends on your perspective:
      *   **Internally Consistent?** Yes. The split is explicit, and the Riefenstahl conclusion follows logically. His prioritization of the moral axis is clear.
      *   **Problematic?** Absolutely, for several reasons:
          1.  **Undermines "Art as Art":** Reducing "artistic value" purely to infectiousness, divorced from meaning, feels reductive. It struggles to account for why we value the *form* of a morally problematic masterpiece beyond its transmission efficiency.
          2.  **The Sincerity Problem:** Judging sincerity is notoriously difficult and subjective. Can we ever truly know the artist's inner feeling? Does insincerity *always* ruin infectiousness? (Much popular art succeeds despite perceived insincerity).
          3.  **The Morality Problem:** Tolstoy's specific "religious perception" is highly contestable and culturally specific. Applying it as an absolute standard is problematic. Who defines the "true" religious perception of the age?
          4.  **The Value of Complexity:** The theory struggles with art that explores ambiguous, dark, or challenging feelings *critically* rather than affirmatively (e.g., *Macbeth*, *Paradise Lost*, Goya's "Disasters of War"). Is transmitting a feeling of horror at evil the same as transmitting the evil feeling itself? Tolstoy's framework is arguably too blunt for this nuance.
          5.  **The Riefenstahl Dilemma as Symptom:** The fact that his theory *must* classify *Triumph of the Will* as "good art (technically)" highlights the discomfort many feel with separating artistic mastery from moral responsibility so completely. It exposes the potential for his definition of "art as art" to valorize dangerous propaganda if it's effective.

  **In Conclusion:** Your friend accurately identifies Tolstoy's dualistic framework. The passage from Chapter XV explicitly separates the technical evaluation of art *as infection* (based on individuality, clarity, sincerity) from the moral evaluation of art *as content* (based on alignment with "religious perception"). Sincerity is part of the *transmission mechanism*, not a bridge to morality. This means *Triumph of the Will* qualifies as genuine art by Tolstoy's first standard but morally bad art by his second. Tolstoy accepts this consequence, condemning such art precisely *because* its effectiveness makes its immorality dangerous. While internally consistent within its own terms, this split is a major source of criticism of Tolstoy's theory, as it can feel reductive, morally prescriptive in a problematic way, and inadequate for handling the complex relationship between form, content, and moral ambiguity in art. The argument over dinner was well-founded!
