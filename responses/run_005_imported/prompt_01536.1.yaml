  ### Explanation of Mixed Strategy Dominance and Order Independence in Iterated Elimination

  #### Why Allow Mixed Strategies as Dominators?
  Restricting comparisons to pure strategies can miss cases where a pure strategy isn't dominated by any single pure alternative but **is dominated by a mixed strategy**. This occurs because mixed strategies leverage the strengths of multiple pure strategies across different opponent actions, creating a "hedge" that no pure strategy alone can provide. Crucially, this aligns with the idea that a **strictly dominated strategy is never a best response** to any belief about opponents' play.

  #### Compact Example: Pure vs. Mixed Dominance
  Consider this 2-player game (Player 1's payoffs; Player 2's actions are `L`/`R`):
  | Player 1 \ Player 2 | L    | R    |
  |----------------------|------|------|
  | **T**                | 3    | 0    |
  | **M**                | 0    | 3    |
  | **B**                | 1    | 1    |

  - **No pure strategy dominates `B`**:
    - `T` vs. `B`: `T` is better if Player 2 plays `L` (3 > 1), but worse if `R` (0 < 1).  
    - `M` vs. `B`: `M` is better if `R` (3 > 1), but worse if `L` (0 < 1).  
    - Thus, `B` isn't strictly dominated by any pure strategy.

  - **Mixed strategy dominates `B`**:  
    Consider a mixed strategy σ = (0.5T, 0.5M, 0B):  
    - Expected payoff vs. `L`: (0.5)(3) + (0.5)(0) = 1.5  
    - Expected payoff vs. `R`: (0.5)(0) + (0.5)(3) = 1.5  
    **Result**: σ always yields 1.5 > 1 (payoff of `B`), so σ **strictly dominates `B`**.

  #### Deeper Intuition: Connection to Best Responses
  - **Key equivalence**: A strategy is strictly dominated (by pure or mixed strategies) **if and only if it is never a best response** to any belief about opponents' play.  
  - In the example, `B` is never a best response:  
    - For any belief (probability `p` that Player 2 plays `L`), `B`’s expected payoff is 1.  
    - `T`’s payoff: 3p, `M`’s payoff: 3(1-p).  
    - To be a best response, `B` requires 1 ≥ 3p and 1 ≥ 3(1-p) → `p ≤ 1/3` and `p ≥ 2/3` (impossible).  
  - **Intuition**: Mixed strategies "cover" all opponent actions better than `B`. If no belief makes `B` optimal, a mixed strategy must dominate it.

  ---

  #### Order Independence: Strict vs. Weak Dominance
  - **Strict dominance (order-independent)**:  
    - If a strategy is strictly dominated, it remains so after removing other strictly dominated strategies.  
    - **Reason**: Strict inequalities (>) hold regardless of removed strategies. Removing a strategy doesn’t invalidate existing strict dominances.  
    - *Example*: In the game above, `B` is strictly dominated by σ. After removing `B`, neither `T` nor `M` is dominated. Final set {`T`, `M`} is unique regardless of order.

  - **Weak dominance (order-dependent)**:  
    - Weak inequalities (≥) can be "broken" when strategies are removed. A strategy weakly dominated in one order may not be in another.  
    - **Example**:  
      | Player 1 \ Player 2 | L    | R    |
      |----------------------|------|------|
      | **A**                | 1,0  | 0,1  |
      | **B**                | 0,1  | 1,0  |
      | **C**                | 0,0  | 0,0  |  
      - `C` is weakly dominated by mixed σ = (0.5A, 0.5B): Payoffs (0.5, 0.5) > (0,0).  
      - **Order 1**: Remove `C` first → survive {`A`, `B`}.  
      - **Order 2**: Remove `A` first → `C` is now weakly dominated by `B` (since `B` beats `C` when Player 2 plays `R`), so remove `C` → survive {`B`}.  
      - **Order 3**: Remove `B` first → `C` is dominated by `A` → survive {`A`}.  
      Final surviving set **depends on order**.

  #### Summary
  - **Mixed strategies as dominators** capture strategies that are never best responses, even when no pure dominator exists.  
  - **Strict dominance** is order-independent due to robust strict inequalities.  
  - **Weak dominance** is order-dependent due to fragile weak inequalities that can disappear when strategies are removed.  

  This clarifies why iterated strict dominance (with mixed strategies) is foundational for solution concepts like rationalizability, while weak dominance requires caution.
