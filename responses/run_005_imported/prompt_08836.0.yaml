  ### What Both Get Wrong About Aumann  
  The Forecaster treats Aumann's theorem as a *litmus test for bad faith*, ignoring that it describes ideal conditions for agreement—not a tool to impugn honesty. The Theorist uses the theorem's technical requirements (common priors, infinite exchanges) as a *shield against substantive engagement*, dismissing the legitimate Bayesian concern that unexplained prior gaps merit examination. Crucially, **Aumann doesn't entitle either to declare the other irrational**; it only shows that *if* common priors/knowledge exist, disagreement *must* resolve under idealized updating. In practice, their deadlock likely reflects either undiagnosed prior differences or unshared evidence—not provable bad faith. The theorem highlights where their reasoning *might* diverge (priors/updating), not *why*.
