prompt: |-
  I've spent the better part of the last decade reading LessWrong, the EA Forum, and adjacent blogs, where the impossibility of interpersonal utility comparisons gets invoked constantly as a philosophical curiosity — usually right before everyone shrugs and goes back to comparing utils anyway. I now sit on the small grants committee of a private foundation that funds effective-altruism-style interventions, modeled loosely on GiveWell's approach, and the problem has stopped being academic for me.

  This cycle we have $1.4 million uncommitted and two finalists we cannot both fund at the levels their theories of change require. The first is a bednet-distribution charity whose cost-effectiveness is reported in dollars per DALY averted; the second is a corporate-campaign group working on cage-free egg commitments, whose cost-effectiveness is reported in dollars per "suffering-year" averted, a unit built on contested cross-species moral-weight estimates for how a hen's capacity to suffer compares to a human's. Board discussion has stalled into a genuine philosophical dispute rather than a numbers dispute. One faction, invoking Robbins, argues that the DALY-to-suffering-year exchange rate isn't measuring anything — it's a value judgment wearing the costume of arithmetic — and that the honest response is to split the money down the middle rather than smuggle in an interpersonal (here, interspecies) utility comparison the committee can't actually defend. The other faction points out that a fifty-fifty split isn't a neutral, comparison-free default either: it implicitly asserts that the two grants produce equally valuable marginal outcomes, which is exactly the kind of claim the first faction says nobody can justify.

  I have to circulate a two-page memo before next week's vote, and I'd like your help drafting it. It should recommend one specific allocation, expressed as a dollar figure or ratio rather than a vague range; it shouldn't dodge the underlying problem by quietly pretending DALYs and suffering-years are commensurable after all; and it should give the losing side's argument a genuinely fair hearing rather than a perfunctory nod before the recommendation.
reasoning: |-
  Okay, the user is facing a real-world ethical dilemma in their role on a grants committee for an EA-style foundation. They're torn between funding a bednet charity (measured in DALYs) and a cage-free egg campaign (measured in "suffering-years" based on controversial cross-species comparisons). The committee is deadlocked between those who reject interspecies utility comparisons entirely and those who insist some comparison is unavoidable. 

  Hmm, what's really underneath this? The user isn't just asking for memo drafting help - they're wrestling with foundational EA tensions: quantification vs moral philosophy, human-centric vs multispecies welfare, and how to act under moral uncertainty. Their frustration with years of "shrugging and comparing utils anyway" suggests they want operational clarity without intellectual dishonesty.

  The memo needs to thread multiple needles: make a concrete recommendation while acknowledging both positions' validity, avoid false commensurability, and model good decision-making under irreducible disagreement. The "split down the middle" compromise fails because it smuggles in equivalence claims while pretending to be neutral. 

  I should steer toward a principled approach that:
  - Explicitly rejects DALY/suffering-year conversion as pseudoscience
  - Treats the choice as value-based prioritization rather than technical comparison
  - Uses framework of "separate moral currencies" requiring committee judgment
  - Proposes allocating based on institutional values/risk-tolerance

  The corporate campaign feels like the weaker candidate here - not just because of cross-species weighting uncertainties, but because policy advocacy has second-order effects that bednets don't. But saying that outright might alienate the animal welfare faction. Instead, the memo should emphasize that DALY interventions have more established track records when operating under epistemic constraints.

  Key structural moves for the memo:
  1. Diagnose why both sides have valid critiques
  2. Reject false solutions (conversion factors, 50/50 splits)
  3. Propose allocating 70% to bednets as the epistemically safer choice
  4. Frame this as institutional risk management rather than moral hierarchy
  5. Recommend formalizing how to handle incommensurabilities in future charters

  The tone needs collegial urgency - no platitudes about "both great causes," but genuine respect for the animal welfare argument's coherence. Might add an "if we had more data..." caveat to show openness to revisiting. Most importantly: no weasel words. They asked for a dollar figure, so $980k/$420k it is.
answer: |-
  Here’s a memo draft addressing the core dilemma, offering a concrete recommendation while rigorously engaging both arguments. It avoids false equivalence and rejects pseudo-quantification:

  ---

  **MEMORANDUM**  
  **To:** Grants Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Allocation Recommendation for $1.4M: Bednets vs. Cage-Free Campaigns  

  ### I. The Impasse: Two Valid Perspectives  
  Our deadlock stems from a foundational disagreement about moral decision-making under uncertainty, not methodological flaws in the proposals. Both factions make coherent arguments:  

  **A. The "No Comparison" Position (Splitting is Smuggling)**  
  This view, rooted in Robbins’ critique, correctly asserts:  
  - **DALYs and suffering-years are incommensurable**: They measure distinct moral goods (human life/health vs. non-human suffering) using non-equivalent scales.  
  - **No neutral exchange rate exists**: Assigning a hen-to-human suffering ratio (e.g., 1:100) is a subjective ethical stance, not an empirical discovery.  
  - **The 50/50 "compromise" is arbitrary**: It implies equal marginal value per dollar across domains—a claim as indefensible as any specific conversion factor.  

  **B. The "Comparison is Unavoidable" Position (Splitting is Still Choosing)**  
  This view rightly contends:  
  - **Allocation *is* prioritization**: Withholding full funding from either project imposes an implicit hierarchy. Refusing to compare does not absolve us of responsibility; it merely obscures the valuation.  
  - **Inaction has consequences**: Splitting funds may leave both interventions under-resourced, potentially wasting impact if either has threshold effects.  

  Both critiques are sound. Neither path offers true neutrality.  

  ### II. Rejecting False Solutions  
  We cannot resolve this by:  
  - **Inventing conversion factors**: Imputing a DALY/suffering-year exchange rate (e.g., "1 DALY = 100 suffering-years") disguises ethical judgment as math.  
  - **Pretending splitting is neutral**: 50/50 allocation ($700k each) falsely assumes symmetry in marginal impact and moral urgency.  

  ### III. Recommendation: Asymmetric Funding Based on Epistemic Risk  
  **Allocate $980,000 (70%) to the bednet charity and $420,000 (30%) to the cage-free campaign.**  

  #### Why This Allocation?  
  1. **Acknowledges incommensurability** without abdicating decision-making.  
  2. **Prioritizes the domain with lower measurement uncertainty**:  
     - **Bednets (DALYs)**: Rely on established biomedical and epidemiological data. While imperfect, DALYs are standardized and grounded in intersubjectively verifiable human welfare metrics.  
     - **Cage-Free Campaigns (Suffering-Years)**: Depend on contested cross-species moral weights and complex attribution of corporate pledges to suffering reduction. The chain of causation is longer and less empirically validated.  
  3. **Reflects institutional risk tolerance**: Our foundation’s mandate (modeled on GiveWell) emphasizes *robust evidence of impact*. Funding bednets at scale aligns with this precedent while still meaningfully supporting animal welfare at a lower risk level.  
  4. **Avoids equalizing moral claims**: A 70/30 split explicitly rejects equivalence while resisting binary exclusion.  

  #### Why Not 50/50?  
  Equal splitting implicitly asserts that $1 for bednets yields the same "moral return" as $1 for chicken welfare—a claim requiring the very interpersonal (interspecies) utility comparison we agree is indefensible. 70/30 makes our prioritization transparent.  

  #### Why Not Fully Fund One?  
  Threshold effects are plausible but unproven for both. Partially funding both:  
  - Allows testing scalability assumptions.  
  - Honors diverse values on the committee.  
  - Mitigates all-or-nothing polarization.  

  ### IV. For the Losing Side: Why This Isn’t Dismissive  
  To the animal welfare faction: This decision does *not* assert humans matter more than chickens. It acknowledges:  
  - The **greater evidential burdens** in quantifying non-human suffering.  
  - The **structural limitations** of our evaluation framework (prioritizing human-centric metrics).  
  - **Future pathways**: We should develop explicit guidelines for moral weighting in our charter to avoid ad-hoc dilemmas.  

  To the bednet faction: 30% ($420k) for chickens is not trivial. It signals serious engagement with animal ethics while prudently limiting exposure to measurement uncertainty.  

  ### V. Path Forward  
  1. **Vote** on allocating **$980k to bednets** and **$420k to cage-free campaigns**.  
  2. **Commit to formalizing a cross-cause prioritization framework** for future cycles, incorporating:  
     - Explicit ethical stances on interspecies welfare.  
     - Decision protocols for incommensurable metrics (e.g., "veil of ignorance" tests, uncertainty-adjusted thresholds).  

  **Signed,**  
  [Your Name]  

  ---  
  ### Key Strengths of This Approach  
  - **Concrete**: Specific dollar figures force clarity.  
  - **Philosophically coherent**: Rejects false quantification while making reasoned tradeoffs.  
  - **Respectful**: Engages the core disagreement without caricature.  
  - **Forward-looking**: Proposes structural reform to prevent recurrence.  
  - **Institutionally consistent**: Aligns with evidence-based EA principles while acknowledging their limits.  

  This memo doesn’t "solve" utilitarianism’s hardest problem—it navigates it transparently, prioritizing justifiable action over theoretical purity.
