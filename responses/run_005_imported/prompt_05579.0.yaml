answer: |-
  Let's break down Ruth Chang's small-improvement argument step by step, focusing on its logical structure and why it forces a distinction between "parity" and "equality." The core insight is that parity **cannot** be reduced to imprecise equality because equality (even rough equality) behaves differently under small improvements.

  ### 1. **The Setup: Trichotomy Failure & the Need for a Fourth Relation**
     - **Traditional Trichotomy**: For any two options A and B, standard rationality assumes one of three relations must hold:
       - A > B (A is better than B)
       - B > A (B is better than A)
       - A = B (A and B are exactly equally good).
     - **Problem**: In hard choices (e.g., Career A = Lawyer, Career B = Clarinetist), people intuitively feel none of these hold:
       - Neither career is *better* than the other.
       - They aren't *incomparable* (we *can* deliberate between them).
       - They don't feel *exactly equal* (it's not like choosing between two identical $10 bills).
     - **Chang's Claim**: This implies a **fourth relation**: "A and B are *on a par*."

  ### 2. **The Small-Improvement Argument: Testing Against Equality**
     Chang argues parity cannot collapse into equality (even "rough equality") using a *reductio ad absurdum*. Here's how it works:

     - **Assumption for Contradiction**: Suppose A and B are *equal* in value (A = B), either precisely or roughly/imprecisely.  
     - **Small Improvement**: Create a new option A⁺ by making a "small, uncontroversial improvement" to A (e.g., Lawyer career with a slightly higher salary or better work-life balance). By definition:
       - A⁺ > A (A⁺ is better than the original A).
     - **Consequence of Equality (A = B)**: If A = B, then improving A should *transitively* make A⁺ better than B:
       - A = B and A⁺ > A → A⁺ > B.  
       *This is non-negotiable for equality: if two things are equal, improving one breaks the tie.*

  ### 3. **The Critical Test: Does A⁺ > B Hold?**
     - **Observation in Hard Choices**: In cases like Lawyer vs. Clarinetist, even after improving A (e.g., Lawyer+) so that A⁺ > A, we *still* don't feel that A⁺ is *determinately better* than B.  
       - *Example*: The improved lawyer career (A⁺) isn't clearly better than being a clarinetist (B). You might still feel, "Yes, law is better *as law*, but music offers something *different* that matters."
     - **Result**: We deny that A⁺ > B.  
       Crucially, we also deny that B > A⁺ (the improvement was genuine, so B isn't better).  
       And A⁺ ≠ B (they aren't equal—we improved A!).

  ### 4. **The Contradiction and Conclusion**
     - **Contradiction**:  
       - If A = B, then A⁺ > A implies **A⁺ > B must hold**.  
       - But we observe that **A⁺ > B does NOT hold**.  
     - **Conclusion**: Therefore, the initial assumption **A = B must be FALSE**.  
       The original relation between A and B **cannot be equality** (precise or rough).

  ### 5. **Why "Rough Equality" Doesn't Save the Trichotomy**
     Chang anticipates the objection: "Maybe A and B are roughly equal, so a *small* improvement might not be enough to break the tie!"  
     - **Her Response**:  
       - If A and B were roughly equal, then a *sufficiently large* improvement *would* eventually make A⁺ > B.  
       - But in parity cases, **no matter how much you improve A** (as long as it remains the *same type of option*), it may **never** become determinately better than B.  
         *Example*: Making the lawyer career 10% or 50% "better" (higher salary, prestige, impact) still doesn't make it *better than* the clarinetist career for someone who values artistic expression in a way law can't provide.  
     - **Key Point**: Parity involves a **breakdown of transitivity** under improvement, which is impossible for any form of equality. Equality *requires* that improvements break ties.

  ### 6. **The Positive Case for Parity**
     - **The Fourth Relation**: Since A and B are not equal, not such that one is better, and not incomparable, they must be in a new state: **on a par**.  
     - **What Parity Means**:  
       - A and B are comparable, but their values are "in the same neighborhood" while being "different in kind."  
       - Small improvements to one don't make it better because the other option embodies a *different dimension of value* that cannot be outweighed by incremental gains on the first dimension.  
       - Choosing between them requires committing to one *kind* of value over another, not "maximizing" a common currency.

  ### Visual Summary: The Argument Structure
  ```
  1. Suppose A = B (for contradiction).  
  2. Improve A → A⁺ such that A⁺ > A.  
  3. If A = B, then A⁺ > A → A⁺ > B.  [Transitivity of equality]  
  4. But in hard choices: A⁺ is NOT > B.  
  5. Therefore: A ≠ B.  
  6. Also: ¬(A > B), ¬(B > A), ¬(incomparable).  
  7. Thus: A and B are on a par. ■
  ```

  **Why this matters for rationality**: If values can be on a par, rational preferences need not be complete. A rational agent can recognize two options as comparable yet refuse to rank them strictly or equally, because their values are distinct in kind. The small-improvement argument proves that "rough equality" is inadequate—it would require tie-breaking under improvement, which fails in paradigmatic hard choices.
