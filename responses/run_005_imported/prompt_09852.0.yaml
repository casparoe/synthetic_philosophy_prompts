answer: |-
  ## MEMORANDUM

  **TO:** Undergraduate Curriculum Committee  
  **FROM:** [Your Name/Position]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Including Bentham's Sexual Morality Writings in PHIL 101: Intro to Ethics (Utilitarianism Unit)

  Following our discussion regarding the inclusion of Jeremy Bentham's unpublished writings on sexual morality (e.g., "Offences Against One's Self," excerpts from *Of Sexual Irregularities*) in the Intro to Ethics utilitarianism unit, I propose a **modified inclusion plan** designed to leverage the pedagogical strengths highlighted by [Proponent Colleague] while directly addressing the valid concerns raised by [Concerned Colleagues 1 & 2].

  **Recommendation: Include a carefully selected, brief (1-page maximum) excerpt, explicitly framed and paired with a focused discussion prompt.** *Do not* assign the material as standalone reading without significant scaffolding.

  **Rationale & Addressing Concerns:**

  1.  **Pedagogical Value (Addressing Proponent's Pitch):**
      *   **Concrete Application:** Bentham's application of the felicific calculus to a taboo subject *is* uniquely powerful. He rigorously weighs pleasure/pain (e.g., lack of harm in consensual acts vs. harms of punishment, adultery's societal costs), challenges disgust as a moral argument, and considers demographic factors – demonstrating the *mechanism* of utilitarianism in a high-stakes context.
      *   **"Biting the Bullet":** It forces students to confront utilitarianism's potential radicalism and its demand to set aside personal prejudice for impartial calculation. This moves beyond the "tame" textbook version.
      *   **Historical Context & Irony:** The material vividly illustrates the *social resistance* utilitarianism faced (and still faces) when challenging deep-seated norms. Bentham's personal hesitation, juxtaposed with his advocacy for publicity, is a profound historical irony *best illuminated by seeing his own words grapple with it*. A secondary source summary would lack this immediacy.

  2.  **Addressing Appropriateness Concerns (Level 100, Mixed Audience):**
      *   **Selection is Key:** Choose an excerpt focused on *Bentham's reasoning process*, not graphic descriptions. Select passages where he explicitly runs the calculus (e.g., comparing harms of sodomy vs. adultery, arguing against punishment based on lack of tangible harm, using classical precedent logically). Avoid sections dwelling on specific acts or potentially inflammatory language.
      *   **Explicit Framing:** Introduce the reading *in class and on the syllabus* with clear context:
          *   "We are reading this *not* for its specific subject matter, but as a case study in applying utilitarian principles to a highly controversial social norm of Bentham's time."
          *   "Focus on *how* Bentham uses the felicific calculus: what pains/pleasures does he identify? How does he weigh them? How does he challenge non-utilitarian arguments (like disgust)?"
          *   "This demonstrates the radical potential of utilitarian logic when applied consistently, even when it leads to conclusions the author himself hesitated to publish."
      *   **Structured Discussion Prompt:** Provide a specific question to guide reading and discussion, ensuring focus on the *logic*, not the shock value. Example: "According to Bentham in this excerpt, what are the primary 'pains' associated with consensual sodomy? What 'pains' does he associate with its criminalization? How does his analysis exemplify the strengths *and* potential societal challenges of applying the felicific calculus impartially?"

  3.  **Addressing "Derailing" and Focus on Core Concepts:**
      *   **The Framing & Prompt are Crucial:** The explicit instructions ("Focus on the *how*, not just the *what*") and the targeted discussion question direct attention to the *structure of the argument* and the *operation of the calculus*.
      *   **Lecture Integration:** Dedicate lecture time *first* to solidifying students' understanding of the core felicific calculus (pleasure, pain, intensity, duration, certainty, propinquity, fecundity, purity, extent). Frame the Bentham excerpt as an *application exercise* of these core concepts to a difficult case.
      *   **Manage Discussion:** Acknowledge the historical context and potential for surprise briefly, but swiftly redirect to the analytical task: "Bentham's conclusion was radical for his time. Our task is to evaluate *whether his utilitarian reasoning supports that conclusion*. Let's break down his calculation step-by-step using the elements we learned."
      *   **Contrast with "Tame" Text:** Explicitly contrast the reasoning in this excerpt with the more conventional applications in the *Principles* excerpts. Ask: "What makes *this* application feel like 'biting a bullet'? What core utilitarian principle forces that bullet-biting?"

  **Why Not Other Options?**

  *   **Exclude Entirely:** This sacrifices a uniquely powerful, concrete demonstration of utilitarian reasoning under pressure and sanitizes Bentham. It avoids controversy but weakens the pedagogical impact on understanding utilitarianism's radical potential and methodological demands.
  *   **Make Optional:** Likely ineffective in an intro course; few non-majors will opt-in, diluting the learning opportunity and discussion.
  *   **Move to Upper-Level:** While suitable for deeper historical analysis there, the *pedagogical punch* of seeing the calculus applied so starkly against prevailing norms is most valuable in the *introductory* context where students are first grappling with utilitarianism's implications. The core concepts are accessible at the 100-level with proper framing.
  *   **Only Discuss Irony Second-Hand:** While possible, discussing Bentham's secrecy *without* seeing the specific arguments he hid lacks force. The primary text makes the tension between his principle of publicity and his personal caution tangible and intellectually resonant.

  **Implementation Plan:**

  1.  **Collaboratively Select Excerpt:** Work with [Proponent Colleague] and [Concerned Colleagues] to identify 1 page (max) that best showcases the *reasoning process* while minimizing potential for distraction or discomfort. Prioritize passages heavy on calculus application and light on descriptive specifics.
  2.  **Draft Clear Framing Language:** Develop the syllabus note and introductory lecture points outlined above.
  3.  **Design Focused Prompt:** Create a discussion question that explicitly targets the mechanics of the calculus and the challenge to non-utilitarian reasoning.
  4.  **Integrate Lecture:** Plan how this fits within the sequence (e.g., after covering the core calculus elements, before discussing common objections).

  **Conclusion:**

  The inclusion of a carefully chosen, well-framed excerpt from Bentham's writings on sexual morality offers an unparalleled opportunity to demonstrate the utilitarian method in action, confronting deep-seated prejudice with rigorous calculation. This brings the theory vividly to life and forces students to engage with its full implications. By prioritizing *reasoning over subject matter* through meticulous excerpt selection, explicit framing, and a targeted discussion prompt, we can harness this pedagogical power while mitigating risks of derailment or discomfort. This approach respects the concerns about appropriateness and focus by making the *logical structure* the undisputed centerpiece of the lesson. I recommend we proceed with this modified inclusion plan.

  **Suggested Action:** Approve the principle of modified inclusion. Form a small subcommittee (e.g., myself, [Proponent], [One Concerned Colleague]) to finalize the specific excerpt, framing language, and prompt for inclusion in the revised syllabus draft.
