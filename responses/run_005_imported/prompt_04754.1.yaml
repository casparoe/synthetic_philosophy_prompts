prompt: |-
  I sit on the ethics subcommittee that sets our research biobank's policy on returning genetic findings to participants. We currently disclose a finding only if it is well-validated and medically actionable; one member wants to extend disclosure to well-validated findings for serious, untreatable conditions -- Huntington's disease is the clearest case, since the variant is highly predictive and no treatment yet delays onset or progression -- arguing that since a participant can always decline to read what we send, offering the information can never leave a rational participant worse off in expectation than withholding it. Others worry this reasoning proves too much and would commit us to disclosing virtually anything we ever learn about anyone. Draft the memo I will circulate before our next meeting: it should recommend a specific disclosure policy for well-validated, non-actionable findings -- including what advance choice, if any, participants get, and what happens by default if they haven't chosen -- and it should directly assess whether the "they can just ignore it" argument actually supports the conclusion its proponents draw from it, rather than simply accepting or dismissing it.
reasoning: |-
  Okay, let me tackle this ethics memo request. The user sits on a research biobank ethics subcommittee debating whether to return genetic findings for untreatable conditions like Huntington's. One member argues that since participants can always ignore unwanted information, offering it can't harm rational participants. Others fear this could open floodgates to disclosing everything.

  Hmm, the core tension here is between respecting autonomy through choice and preventing potential distress from unwanted knowledge. The "they can ignore it" argument seems logically sound but practically problematic - if applied broadly, it could indeed justify dumping all genetic data on participants. That feels irresponsible.

  I recall the ACMG's position on medically actionable findings versus Huntington's exceptionalism. The Huntington's case is unique because of its near-perfect predictability and catastrophic nature. Maybe we can craft a middle path: disclose only for conditions meeting strict criteria (serious, highly penetrant, adult-onset) while giving participants robust upfront choices.

  For the memo structure: First clearly define the problem and positions. Then propose a specific policy with eligibility criteria (validated, serious, non-actionable but highly predictive). Crucial elements include mandatory advance consent options and strict default settings. Finally, dissect the "ignore it" argument - acknowledge its theoretical merit while showing why it shouldn't override practical ethics concerns about psychological harm and consent integrity.

  The policy should probably require explicit opt-in for untreatable conditions while keeping actionable findings as opt-out. That maintains protection for vulnerable participants while honoring true autonomy. Need to emphasize that "can ignore" doesn't equal "should receive" - the biobank has curation responsibilities.

  For implementation, we'll need tiered consent forms and strict protocols for delivering bad news. Should explicitly state this isn't a slippery slope because we're setting bright-line boundaries at the most severe conditions.
answer: |-
  ## MEMORANDUM  
  TO: Ethics Subcommittee Members  
  FROM: [Your Name], Ethics Subcommittee Member  
  DATE: [Date]  
  SUBJECT: Proposed Policy on Disclosure of Well-Validated, Non-Actionable Genetic Findings & Assessment of the "They Can Ignore It" Argument  

  **I. Introduction**  
  This memo addresses the proposal to extend disclosure beyond medically actionable findings to include well-validated genetic variants associated with *serious, untreatable conditions* (e.g., Huntington’s disease). It recommends a specific policy framework, evaluates the core argument that participants "can always decline to read" disclosed information, and proposes actionable steps for our next meeting.  

  ---

  ### **II. Recommended Disclosure Policy for Well-Validated, Non-Actionable Findings**  
  **Scope of Disclosure:**  
  Disclosure should be limited to findings meeting **all** of the following criteria:  
  1. **High Clinical Validity:** Variant associated with near-complete penetrance (>90%) and specific, severe pathology.  
  2. **Seriousness:** Condition causes significant morbidity, irreversible decline, or premature mortality.  
  3. **Predictive Certainty:** Positive result is diagnostic of future disease (e.g., Huntington’s, certain prion disorders).  
  4. **Adult Onset:** Findings related to childhood conditions are excluded due to inability to consent *for future autonomy*.  

  **Participant Choice & Default Settings:**  
  1. **Advance Choice (Tiered Consent):**  
     - During enrollment, participants explicitly choose one option:  
       - **Opt-In:** Receive all eligible actionable *and* non-actionable findings.  
       - **Actionable-Only:** Receive only medically actionable findings (current default).  
       - **Opt-Out:** Receive no individual findings (research use only).  
     - Choices are documented electronically and revisable at any time.  
  2. **Default for Non-Choosing Participants:**  
     - **No disclosure** of non-actionable findings. Medically actionable findings remain subject to current policy (disclosed unless opted out).  
     - Rationale: Protects participants who may not have considered implications of untreatable results.  

  **Delivery Protocol:**  
  - Pre-disclosure genetic counseling *mandatory* for non-actionable findings.  
  - Results delivered via secure portal + scheduled counseling follow-up.  
  - Explicit option to "decline viewing" provided at time of notification.  

  ---

  ### **III. Critical Assessment: Does "They Can Ignore It" Support Unrestricted Disclosure?**  
  The argument that *offering* information cannot harm rational participants since they may decline to read it warrants careful scrutiny. While logically appealing, it suffers from three critical flaws when applied broadly:  

  1. **The Burden of Knowing vs. Ignoring:**  
     - **Problem:** Merely *receiving* a report labeled "Huntington’s Disease Result" imposes psychological burden, even if unread. Participants may infer grave news from its existence, triggering anxiety or "toxic knowledge" (e.g., familial guilt).  
     - **Conclusion:** The act of *offering* can cause harm independent of viewing. Thus, it *can* leave participants worse off.  

  2. **Autonomy Requires Meaningful Choice:**  
     - **Problem:** True autonomy necessitates *informed upfront consent* for the *type* of information one might receive. A blanket "send everything; ignore what you want" approach:  
       - Undermines the right *not to know* by forcing defensive actions (e.g., deleting emails).  
       - Shifts ethical responsibility from the biobank to the participant.  
     - **Conclusion:** Respecting autonomy requires curating disclosures *in advance*, not burdening participants with unwanted decisions post-hoc.  

  3. **Slippery Slope & Proportionality:**  
     - **Problem:** If "they can ignore it" justifies disclosing untreatable conditions, consistency demands disclosing *any* well-validated result (e.g., Alzheimer’s risk variants, carrier status). This risks overwhelming participants and trivializing serious results.  
     - **Conclusion:** The argument proves *too much* by ignoring proportionality. Not all genetic information warrants equal weight; we must distinguish between results of profound, life-altering significance versus those of lesser impact.  

  **Verdict:** The "ignore it" argument **does not justify indiscriminate disclosure** of non-actionable findings. It supports offering *specific, high-impact* results **only** when paired with:  
  - Rigorous pre-disclosure filters (as proposed in Section II).  
  - Explicit advance participant consent.  

  ---

  ### **IV. Proposal for Vote**  
  I move that the subcommittee adopt the following policy:  
  > *The biobank will offer well-validated genetic findings for serious, untreatable adult-onset conditions with near-complete penetrance, but* **only** *to participants who explicitly Opt-In during enrollment. Medically actionable findings remain subject to our existing policy (disclosed by default with opt-out available).*  

  ---

  **V. Discussion Questions for Next Meeting**  
  1. Does the proposed scope (high penetrance, adult-onset, serious) adequately balance autonomy with non-maleficence?  
  2. Are there exceptional conditions beyond Huntington’s that warrant inclusion (e.g., certain *PRNP* mutations)?  
  3. How should we address incidental findings discovered in research (non-targeted screening)?  

  This framework prioritizes participant welfare, genuine autonomy, and ethical sustainability. I look forward to refining it with your insights.  

  // SIGNATURE //  
  [Your Name]  
  [Your Position]
