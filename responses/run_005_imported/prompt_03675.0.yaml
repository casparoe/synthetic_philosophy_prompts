answer: |-
  You're absolutely right—there's a crucial and heartbreaking distinction between these two failures. Your writing group is identifying a surface similarity ("not taken seriously"), but missing the profound difference in *why* and *how* that happens. This distinction is essential for both historical accuracy and emotional depth.

  Here's the breakdown and how to show it:

  **The Core Difference:**

  1.  **The Doctor: Dismissal Rooted in Prejudice & Power.**
      *   **Why:** He *does* understand her words and even the concept of shock/nerves. His failure is a **conscious choice** based on **prejudice** (miners' wives = hysterical/nervy) and his **position of authority**. He discounts her experience as invalid or insignificant *because of who she is*.
      *   **Nature of Failure:** **Active Dismissal.** He hears, labels, and discards. It's a transaction of power.
      *   **Emotional Impact on Protagonist:** Anger, humiliation, feeling *invisible* as an individual, a reinforced sense of powerlessness against the established order (medical, male, class).

  2.  **The Husband: Helplessness Rooted in Lack of Framework & Shared Language.**
      *   **Why:** He *wants* to understand and help. His failure stems from **genuine ignorance** and the **absence of cultural/linguistic tools**. There is no narrative, no vocabulary, no shared understanding of psychological trauma *in women* related to such events. His own experience of trauma (if any) is likely framed in physical injury or "getting on with it." He literally *cannot* conceptualize her internal state.
      *   **Nature of Failure:** **Passive Incomprehension.** He hears, is distressed, but cannot grasp or process the meaning. It's a gulf of understanding.
      *   **Emotional Impact on Protagonist:** Profound isolation, loneliness, frustration mixed with pity/affection (seeing *his* struggle), a sense that her experience is *unspeakable* and alien, even to the person closest to her.

  **How to Show the Difference on the Page (Beyond Assertion):**

  1.  **Focus on the Listener's Internal State & Motivation (Implied or Stated):**
      *   **Doctor:** Show his thoughts (if using close 3rd or omniscient) or actions that reveal his assumptions. *He thinks:* "Typical female vapours," or "These women always magnify things." *He acts:* Checks his watch, tidies papers, offers a generic bromide ("Plenty of rest, Mrs. Jones, strong tea."). His goal is to *end* the interaction efficiently.
      *   **Husband:** Show his *visible* distress and confusion. *He thinks:* "What's *wrong* with her? How do I fix this?" *He acts:* Fumbles for words, looks pained, offers *practical* but irrelevant solutions ("Maybe... maybe you need a day in the fresh air?"), tries to physically comfort her but it feels awkward. His goal is to *connect* or *fix*, but he has no tools.

  2.  **Dialogue Subtext & Specificity:**
      *   **Doctor:**
          *   Uses minimizing or medicalizing language: "Nerves," "a touch of hysteria," "understandable *female* reaction."
          *   Redirects: "Many wives feel anxious... think of the men *down* there daily."
          *   Offers patronizing reassurance: "You'll be right as rain soon enough."
          *   Questions the *validity* of her feelings: "Are you sure it's not just...?"
      *   **Husband:**
          *   Uses vague, floundering language: "I don't understand...", "But... why *now*?", "It's over, love."
          *   Tries to relate but fails: "I know it was bad, but..." (then trails off, unable to articulate *how* he knows or what *he* feels).
          *   Focuses on the *physical* or *observable*: "You look tired," "You're trembling," "Can I get you something?" (tea, blanket).
          *   Reverts to familiar roles: "Let me handle the... [money, talking to the foreman, etc.]."
          *   Falls silent, unable to find *any* words that fit.

  3.  **The Protagonist's Perception & Reaction:**
      *   **With the Doctor:** She feels **patronized, invisible, and angry.** She might bite her tongue, feel a cold fury, recognize the futility, or have a sharp internal monologue about his condescension. Her description of him might focus on his detachment, his tidy office, the distance between them.
      *   **With the Husband:** She feels **desperately alone, frustrated, but also a pang of sorrow *for him*.** She sees his love *and* his helplessness. She might try harder to explain, then crumple in despair when words fail. She might touch his arm, seeing his pain, and give up, internalizing the isolation. Her description might focus on his worried eyes, his rough hands fidgeting, the intimacy of their kitchen where the gulf feels even wider.

  4.  **Sensory Details & Setting:**
      *   **Doctor's Scene:** Cool, clinical. The smell of antiseptic, starched linen, ink. Hard chairs. A desk as a barrier. Perhaps the distant sound of the pit head (ironic, emphasizing his detachment from its reality). Formality.
      *   **Husband's Scene:** Warm but stifling. The smell of coal dust, stew, damp wool. A worn kitchen table. Mugs of tea growing cold. The intimate sounds of their home (a ticking clock, a child in another room) contrasting with the emotional distance. Comfortable surroundings making the disconnect more painful.

  5.  **The Nature of the "Not Listening":**
      *   **Doctor:** He *listens* enough to categorize and dismiss. He hears the *symptoms* but filters them through his bias. He might interrupt to offer his diagnosis.
      *   **Husband:** He *listens* intently to the *words*, but they don't form a coherent picture he recognizes. He hears the distress but has no map for its source or shape. He might ask clarifying questions that miss the point entirely ("But you weren't *hurt*, were you?").

  **Key Phrases to Signal the Difference:**

  *   **Doctor:** "He nodded, but his eyes were already drifting to the next case file." / "'Nerves,' he pronounced, closing his notebook with a snap. 'Common enough.'" / "A thin smile that didn't reach his eyes. 'Strong constitution, you Welsh women. You'll rally.'"
  *   **Husband:** "His brow furrowed, deep lines of confusion rather than anger." / "He reached for her hand, then drew back, unsure." / "'I... I don't know what to say, love,' he mumbled, staring at his boots." / "He offered her a mug of tea, his usual balm for all ills, but his eyes held a helpless question she couldn't answer." / "He tried to pull her close, but her body remained stiff, a language he couldn't interpret."

  **In Essence:**

  *   The **Doctor** represents the **System** failing her. His dismissal is a reinforcement of societal norms and power structures. It's **cold**.
  *   The **Husband** represents the **Intimacy** failing her. His incomprehension highlights the profound isolation created by the lack of shared language and cultural understanding of trauma. It's **achingly warm yet utterly isolating**.

  By focusing on the *source* of the failure (prejudice vs. lack of framework), the *intention* of the listener (dismissal vs. desire to connect), and the *specificity* of the protagonist's reaction (anger vs. lonely despair), you can make this vital distinction visceral on the page without needing to explain it. Show the doctor's detached efficiency versus the husband's floundering care. Show her cold fury in one scene and her shattering loneliness in the other. This difference is core to the tragedy of her situation and the historical context you're portraying.
