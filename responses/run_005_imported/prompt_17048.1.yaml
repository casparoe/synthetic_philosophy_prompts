answer: |-
  Here's a dialogue between **Vidyā** (a Naiyayika philosopher) and **Ānanda** (a Buddhist epistemologist in the Dignāga-Dharmakīrti tradition), debating the nature of *upamāna* over the classic *gavaya* example. The dialogue aims for fairness, specificity, and stakes.

  **Setting:** A shaded garden grove near a university. Vidyā and Ānanda sit cross-legged on mats, a pot of herbal tea between them.

  ---

  **Vidyā:** Friend Ānanda, I’ve been reflecting on our recent debate on *pramāṇas*. Take the case of *upamāna*. Consider someone told, "A *gavaya* resembles a cow," and later, seeing a strange animal in the forest, instantly recognizes: "This *is* a *gavaya*!" You claim this is merely perception, memory, and inference combined. But this misses the *sui generis* nature of that recognition.

  **Ānanda:** Vidyā, I respect your tradition’s precision, but parsimony demands we avoid multiplying causes unnecessarily. Let me dissect the *gavaya*-cognition precisely:  
  1. **Perception (*pratyakṣa*)**: You *see* the unfamiliar animal (*gavaya*) with its specific shape, horns, dewlap, etc.  
  2. **Memory (*smṛti*)**: You recall the verbal instruction (*śabda*), "The *gavaya* is like a cow." This includes recalling the *cow* (a known object) and the *relation* "like."  
  3. **Inference (*anumāna*)**: Based on perceived similarities (horns, hump, quadruped nature) between the seen animal and the remembered cow, you *infer*: "This must be the *gavaya* I was told about."  
  No fourth *pramāṇa* is needed. The cognition is *inferential* because it links a perceived particular (this animal) to a verbal designation (*gavaya*) via a recalled similarity.

  **Vidyā:** Ah, but your "inference" misrepresents the cognition! The knower doesn’t *reason*: "I see horns; cows have horns; therefore, this is a *gavaya*." That would be a flawed inference (*hetvābhāsa*), for many horned animals exist! The recognition is *immediate* and *non-inferential*. It arises directly from perceiving the resemblance (*sādṛśya*) itself. *Upamāna* is the *unique means* by which we grasp the relation between a name (*gavaya*) and its bearer via resemblance to a known object (cow). Inference deals with universals (*sāmānya*), but here, it’s the *relational particularity* of the resemblance that’s known.

  **Ānanda:** You speak of "grasping resemblance," but what *is* resemblance? It’s not a sixth sense-object! It’s just the perception of shared properties (*sāmānyalakṣaṇa*) – like having horns or a dewlap. When you see those properties in the *gavaya*, and recall they belong to a cow, you infer the animal belongs to a *type* resembling the cow-type. The "immediacy" is just cognitive efficiency – a well-trained inference feels instantaneous. Memory supplies the minor term ("*gavaya*"), perception the major term (this animal), and the middle term is the shared property. Done.

  **Vidyā:** No, Ānanda. Inference requires a necessary concomitance (*vyāpti*) – like "where there’s smoke, there’s fire." But here, there’s *no universal rule* that "things resembling cows are *gavayas*." The village elder didn’t say, "All cow-like things are *gavayas*"; he said, "*The gavaya* is like a cow." The knowledge is *deictic* – it points to one specific kind via resemblance. *Upamāna* delivers knowledge of the *name-object connection* (*saṃjñā-saṃjñi-sambandha*) through likeness. Perception gives you the animal’s form; memory gives the words; but *upamāna* alone synthesizes them via resemblance. It’s *avisamvādi jñāna* (non-erroneous knowledge) of reference, irreducible to its parts.

  **Ānanda:** Consider the cognitive sequence:  
  - *Perception*: This animal has features F1, F2, F3.  
  - *Memory*: The word "*gavaya*" was associated with "like a cow," and cows have F1, F2, F3.  
  - *Inference*: Since this animal has F1, F2, F3 (like a cow), and "*gavaya*" was defined by having F1, F2, F3 (like a cow), *this* is the referent of "*gavaya*."  
  The "synthesis" is just the inferential application of the definition. The resemblance *is* the shared properties (F1, F2, F3). Where’s the extra ingredient?

  **Vidyā:** The extra ingredient is the *intentional object* of the cognition! When one learns via *upamāna*, the cognition is: "**That** (pointing mentally to the *gavaya* type) is what 'gavaya' means, because **it resembles this** (the cow)." It’s relational knowledge (*sambandha-jñāna*) between two *particulars* mediated by similarity. Perception knows only the presented particular; inference knows universals or general relations; memory knows the past. None grasp this *present relational particular*: the *gavaya*-as-similar-to-cow. *Upamāna* uniquely provides knowledge of the denotation of a word through analogical extension.

  **Ānanda:** But even this "relational knowledge" relies on memory of the verbal analogy and perception of the properties. If the properties perceived don’t match the remembered cow-properties, recognition fails. If they match, inference connects them. Parsimony stands: three *pramāṇas* suffice. Adding *upamāna* is like adding "throwing" as a distinct action when you can describe it as "arm motion + release."

  **Vidyā:** But if we reduce *upamāna*, what stops us from reducing *śabda* (verbal testimony)? You Buddhists *do* reduce *śabda* to inference! "The elder said 'gavaya resembles a cow'" becomes an inference about his reliability. But Nyāya holds *śabda* as irreducible – valid words from a reliable source (*āpta*) convey knowledge *directly*. Your reductionism attacks the very architecture of our *catuṣṭaya* (fourfold system). If *upamāna* falls, *śabda* is next. Then you’d have only perception and inference – a barren epistemology unable to capture language, analogy, or tradition!

  **Ānanda:** *Exactly*, Vidyā! That *is* our view. *Pratyakṣa* and *anumāna* *are* sufficient. *Śabda* is inferential: we infer the speaker’s veracity based on perception of their reliability. Language is conventional (*saṃvṛti*), not a separate *pramāṇa*. Your fourfold system adds unnecessary layers. Reality is momentary particulars (*svalakṣaṇa*), known only by perception. Inference connects them via universals constructed by the mind. Analogies and words are mental constructs validated by perception and inference. A fourth *pramāṇa* obscures this clarity.

  **Vidyā:** And *that* is where we fundamentally differ. Your system flattens the rich textures of knowing – how we learn names, recognize via likeness, trust teachers. *Upamāna* isn’t a "layer"; it’s the warp and weft connecting perception to language. If I see a *gavaya* and think "Ah! *That’s* what the elder meant!" – that "Ah!" is *upamāna*. It’s not inference; it’s the flash of understanding *through* resemblance. Reduce it, and you reduce human knowing to a shadow of itself. Nyāya’s four *pramāṇas* stand because reality and our grasp of it are irreducibly complex.

  **Ānanda:** And we Buddhists would say that complexity is conceptual proliferation (*prapañca*), obscuring the direct suchness (*tathatā*) of experience. But I concede your point: if one accepts *śabda* as irreducible, defending *upamāna* becomes coherent. For us, both rest on inference. Perhaps we must agree to disagree – but over excellent tea.

  **Vidyā:** (Smiling) Agreed. The *gavaya* may be disputed, but good tea is perceptually evident to all. Let us drink.

  ---

  ### Key Points Covered:
  - **Buddhist Reduction (Ānanda)**:  
    1. *Perception*: Sees the *gavaya's* features.  
    2. *Memory*: Recalls the verbal analogy ("like a cow").  
    3. *Inference*: Links features to the definition via shared properties (horns, dewlap).  
    4. Rejects resemblance as a distinct object; it's just perceived properties + memory.  
    5. Argues immediacy is efficient inference, not a unique *pramāṇa*.  
    6. Connects reduction to broader project: reducing *śabda* and having only two *pramāṇas*.

  - **Nyāya Defense (Vidyā)**:  
    1. Recognition is immediate, non-inferential (no universal rule or *vyāpti*).  
    2. Resemblance (*sādṛśya*) is a relational particular grasped directly.  
    3. *Upamāna* uniquely provides knowledge of name-object relations via analogy.  
    4. Reduction misses the *intentional object*: the *gavaya*-as-similar-to-cow.  
    5. Stakes: If *upamāna* is reduced, *śabda* falls next, collapsing Nyāya’s fourfold system.

  - **Bigger Picture**:  
    - For Nyāya, losing *upamāna* threatens its pluralist epistemology and its ability to account for linguistic/analogical knowledge.  
    - For Buddhists, reducing *upamāna* (and *śabda*) to perception/inference maintains a streamlined ontology of momentary particulars and mental constructs.  

  This captures the core dispute: whether resemblance-based recognition is a unique epistemological act or a composite of simpler ones – and what that means for how we understand knowledge itself.
