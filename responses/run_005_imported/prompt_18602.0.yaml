prompt: |-
  My friend and I got into a two-hour argument last night that started about politics but ended up being about whether it's ever actually rational for two people to just 'agree to disagree.' I went down a rabbit hole afterward and found out theres a whole formal version of this argument in game theory, built on what's called the common prior assumption -- apparently if two honest, rational people share a prior and their opinions become common knowledge, Aumann's agreement theorem says they can't knowingly keep disagreeing. Anyway, next week I'm interviewing a game theorist who's built her career defending the common prior assumption as a real requirement of rationality, not just a modeling convenience, and whenever someone points to two reasonable people who obviously started out with different priors, her move is always 'that's not a prior difference, that's an information difference' -- she just redescribes it away. Can you draft 8-10 interview questions, sequenced so that move gets harder for her to lean on as we go, each with a follow-up keyed to whatever she's likely to say? Somewhere in there I want a question on how the no-trade theorems are supposed to square with all the actual speculative trading that happens in real markets, and end with one on whether the assumption is even falsifiable or if it's basically just an idealization like rational expectations.
reasoning: |-
  Okay, the user is preparing for an interview with a game theorist who defends the common prior assumption (CPA) as a fundamental requirement of rationality. The core tension is how this theorist reinterprets apparent prior differences as information differences. The user wants questions that gradually challenge this move, including no-trade theorems versus real markets, and ending on falsifiability.

  First, I need to understand the key angles to press. Aumann's theorem relies on CPA, so disagreements must stem from information gaps. The interviewee's tactic is to recast any prior divergence as hidden information asymmetry. The challenge is to design questions that force her to either admit limits to CPA or make increasingly strained justifications.

  Breaking it down:
  - Early questions should seem neutral, establishing her position organically. Start with "What does CPA mean?" to let her define terms without defensiveness.
  - Then probe how she distinguishes priors from information. Her likely response—that priors are pre-information—sets up the next trap: what if people access different information *before* forming priors? (e.g., cultural exposure). She might call this "meta-information," but that blurs definitions.
  - Bring up real-world examples of lifelong disagreement (e.g., political tribes). If she attributes this to cumulative private signals, push back: why would rational agents not converge after decades of public debate? This tests her commitment to CPA as non-idealized.
  - No-trade theorems are perfect for exposing contradictions. If markets trade speculatively despite CPA implying no-trade equilibria, she might blame irrationality or non-common knowledge. Follow up: does this make CPA unfalsifiable since any deviation is "noise"?
  - End on falsifiability. If she treats CPA as a rationality benchmark (like frictionless physics), concede it's useful but question its empirical bite. If she insists it's testable, demand concrete conditions where she'd abandon it.

  The sequence must escalate logically:
  1. Foundation: Her CPA definition.
  2. Boundary test: When is difference "prior" vs. "information"?
  3. Stress test: Persistent disagreement in exposure-rich environments.
  4. Market paradox: Trading despite no-trade theorems.
  5. Epistemology: Is CPA falsifiable or tautological?

  For follow-ups, anticipate her dodges:
  - Redefining terms (e.g., "true priors" are always shared).
  - Attributing divergence to irrationality.
  - Falling back on "approximate" CPA.
  Counter by demanding:
  - How to empirically distinguish prior/information differences.
  - Why rational agents wouldn't correct errors over time.
  - Whether real-world data could ever contradict CPA.

  The no-trade question is crucial. Her response will likely involve liquidity needs or irrational traders. Follow up: If markets *mostly* trade for non-belief reasons, does CPA still explain anything? This ties to falsifiability—if exceptions swallow the rule, CPA becomes metaphysical.

  Finally, the last question should corner her: If no evidence can falsify CPA, isn't it just a useful fiction? If she admits it's idealized, the user wins. If she denies, she must propose a test—which is hard without circularity.
answer: |-
  Here's a sequenced interview draft with 8 core questions (+ strategic follow-ups) designed to progressively challenge the "that's just an information difference" defense of the Common Prior Assumption (CPA), incorporating your requests and targeting key pressure points:

  **Interview Question Sequence: Probing the Common Prior Assumption**

  **1. Foundation: Defining the Stakes**  
  *Q1: "Professor, you argue the CPA is a *requirement* of rationality, not just a modeling tool. Could you briefly explain what you believe is lost – conceptually or practically – if we abandon the CPA as a foundational rational constraint?"*  
  *   *Likely Response:* She'll emphasize that without CPA, disagreement becomes meaningless noise, rational updating loses a shared anchor, and coordination/learning becomes inexplicable.  
  *   *Follow-Up (Keyed to Rationality Anchor):* "If two rational agents *genuinely* can't reconcile their beliefs even after exhaustive, honest communication under CPA, does that imply one *must* be irrational? Or is there room for 'rational impasse' under CPA?"

  **2. Boundary Setting: The Core Move**  
  *Q2: "Your signature move is re-describing apparent prior differences as information differences. Can you precisely define the operational difference between a 'prior belief' and the 'information' that updates it, especially in real-world scenarios where life experiences shape beliefs long before formal Bayesian updating?"*  
  *   *Likely Response:* She'll define priors as beliefs *before* any specific, differentiated information relevant to the current proposition. Experiences are "meta-information" or the *source* of the private signals agents received.  
  *   *Follow-Up (Exposure as Information?):* "So, if someone grows up in a highly polarized community, absorbing different narratives, are you saying their *prior* (pre-deliberation on a specific issue) is identical to someone from the opposite community, and the difference is solely the private signals embedded in their upbringing? Doesn't that stretch the term 'information' to cover *all* causal belief determinants?"

  **3. Stress Testing Persistent Disagreement**  
  *Q3: "Consider two highly intelligent, rational people with PhDs in relevant fields – say, economics – who hold fundamentally opposing views on a contentious policy (e.g., significant minimum wage hikes). They've debated for years, exchanged studies, know each other's models intimately (common knowledge of beliefs). Under CPA, how *can* this persistent, common-knowledge disagreement be explained solely by an 'information difference'?"*  
  *   *Likely Response:* She'll argue they still have different private interpretations of evidence, different weights on studies, or access to subtly different data sets/signals, preventing full common knowledge of *all* information.  
  *   *Follow-Up (The Burden of Proof):* "Practically speaking, doesn't this require positing *permanent, undiscoverable* private signals to explain persistent disagreement among honest experts? How is this different from just admitting different priors, if those 'signals' can never be surfaced or shared?"

  **4. Introducing the No-Trade Puzzle**  
  *Q4: "Let's bridge to markets. No-trade theorems, built on CPA and common knowledge of rationality, suggest speculative trade shouldn't occur if agents are rational and share a prior. Yet, speculative trading is massive and continuous. If CPA is a requirement of rationality, does this imply most market participants are fundamentally irrational, or is something else wrong with the theorem's application?"*  
  *   *Likely Response:* She'll likely downplay the theorem's literal application: markets involve liquidity needs, hedging (non-speculative motives), irrationality, non-common knowledge, or the "speculation" is actually about resolving uncertainty over future states/events not perfectly captured in the model.  
  *   *Follow-Up (The Speculation Core):* "But vast amounts of pure directional bets *do* happen between sophisticated players (e.g., hedge funds) who know they hold opposing views – seemingly betting *because* they disagree. If CPA holds, how can two rational, well-informed funds *both* believe they're getting the better end of a zero-sum trade *without* some prior divergence in how they interpret the world?"

  **5. Pushing the Redescription to the Limit**  
  *Q5: "Imagine identical twins, separated at birth, raised in vastly different ideological environments (Country A vs. Country B). At 25, they meet. They share all life experiences openly. Yet, on core values (e.g., individualism vs. collectivism), they remain diametrically opposed. Is this, under your view, *still* only an 'information difference'? What specific 'information' did one get that the other lacks?"*  
  *   *Likely Response:* She'll argue the totality of their sensory experiences, social interactions, and cultural cues constitute vastly different sets of private signals throughout their lives. Their *interpretive frameworks* for public signals (e.g., news) are shaped by this unique signal history.  
  *   *Follow-Up (The Prior Vanishes):* "Doesn't this effectively mean the 'common prior' is reduced to an empty vessel at birth (tabula rasa with identical cognitive machinery), and *everything* substantive is 'information'? If so, what empirical content does the CPA retain beyond a trivial claim about initial cognitive hardware?"

  **6. The Falsifiability Challenge - Part 1**  
  *Q6: "You often redescribe apparent counter-examples (like the twins) as information differences. What specific, observable evidence *could* exist in the real world that would force you to concede, 'This cannot be explained by information differences; it *must* involve fundamentally different priors'? Or is the CPA inherently unfalsifiable through this redescription?"*  
  *   *Likely Response:* She might struggle. Possible answers: If agents had *truly identical* life experiences but still disagreed fundamentally (impossible to arrange); or if disagreement persisted after *perfectly* sharing all relevant experiences (also practically impossible). She may fall back on CPA being a *normative* requirement.  
  *   *Follow-Up (The Retreat to Norms):* "If the only falsifying scenarios are practically impossible experiments, and real-world disagreements are always re-described, is CPA functioning more as a *definition* of rationality ('truly rational agents *must* have shared priors') than a testable empirical claim about humans?"

  **7. The Falsifiability Challenge - Part 2 (Rational Expectations Link)**  
  *Q7: "You mentioned CPA as a requirement, not just an idealization. But economists often use 'rational expectations' (RE) as a useful, tractable idealization, knowing agents aren't perfectly rational or informed. Is CPA different? If so, how? If not, why defend it as a *requirement* rather than a powerful, but imperfect, modeling tool like RE?"*  
  *   *Likely Response:* She'll argue CPA is *more fundamental* than RE. RE deals with forecasting models; CPA is the bedrock *shared reality* upon which rational updating and thus RE must be built. RE can be an idealization *within* a CPA framework.  
  *   *Follow-Up (The Practicality Gap):* "But if applying CPA requires constant, complex redescription of real-world disagreement as hidden information differences – a task often beyond our ability to verify – doesn't this significantly limit its practical utility as an *explanatory* tool for observed behavior, compared to its normative appeal?"

  **8. The Ultimate Rationality Question**  
  *Q8: "Let's conclude on rationality itself. If two agents, by all external measures, are honest, self-consistent, logical, diligent in seeking evidence, and have access to largely the same public information, yet hold irreconcilable beliefs on a well-defined proposition... does the CPA *demand* that we conclude one (or both) must be irrational *despite* these appearances? Is that a satisfying account of human disagreement?"*  
  *   *Likely Response:* She'll likely affirm that CPA + rationality *does* demand this, but may soften it by emphasizing "bounded rationality," computational limits, or the sheer difficulty of correctly processing complex information. The core defense of CPA as a requirement will hold.  
  *   *Follow-Up (The Human Element):* "Doesn't this position risk making 'rationality' under CPA an impossibly high standard, one that renders most real-world disagreements – even among experts acting in good faith – as fundamentally irrational by definition? Does this enhance our understanding, or simply define away the messy reality of human cognition and perspective?"

  **Key Sequencing Logic:**  
  1.  **Starts Neutral:** Q1 establishes her position without challenge.  
  2.  **Defines the Mechanism:** Q2 forces her to define the prior/info boundary upfront.  
  3.  **Applies Pressure:** Q3 (Experts) & Q5 (Twins) present strong intuitive counter-examples where the "info difference" move feels strained.  
  4.  **Introduces Key Paradox:** Q4 (No-Trade) brings in a formal contradiction within economics itself.  
  5.  **Targets Core Weakness:** Q6 & Q7 directly attack falsifiability and the "redescription shield," linking to RE as a contrast.  
  6.  **Ends on Implications:** Q8 forces her to confront the potential disconnect between CPA-as-requirement and observable human rationality.  

  Each follow-up is designed to anticipate her likely defense ("info difference," "bounded rationality," "normative requirement") and push her towards either admitting the limitations of the redescription move, the idealized nature of CPA, or the potentially counter-intuitive implications of holding it as a strict rationality requirement. Good luck with the interview!
