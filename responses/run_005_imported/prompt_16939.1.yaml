  Here’s a 5-minute eulogy that honors your aunt’s journey, acknowledges the tension respectfully, and centers her unwavering commitment to ethics without fueling debate:

  ---

  **For [Aunt's Name]**

  Good morning. Thank you all for being here to remember my aunt, [Aunt's Name]. For 35 years, she was a devoted field ecologist, a true disciple of Aldo Leopold. She walked these hills, studied these forests and rivers, and spoke with deep reverence about the land ethic – about thinking like a mountain, about the intricate, sometimes harsh, balance of nature. To her old friends here today, she was a kindred spirit, someone who understood the profound value of wildness and the wisdom in non-intervention. That connection, that shared love for the complex tapestry of life, was core to who she was.

  But if there was one thing even stronger than [Aunt's Name]'s love for nature, it was her fierce moral compass. She didn’t just *see* the world; she deeply *felt* its realities. And about a decade ago, she encountered a perspective that challenged the very foundation of her life’s work: the idea that wild animal suffering – the predation, the starvation, the disease she’d long accepted as nature’s way – might not just be inevitable, but something we could, and perhaps *should*, consider addressing.

  This wasn’t a casual shift. It was a profound, deeply considered evolution. She wrestled with it. She read, she debated, she thought endlessly. Her commitment wasn’t to a dogma, but to reducing suffering wherever she saw it. If her earlier work taught her to *understand* the mountain’s perspective, this new chapter reflected her profound empathy for the individual creatures *on* the mountain. Vaccinating prey, finding ways to alleviate starvation – she saw these not as rejecting the wild, but as extending compassion into its most challenging corners.

  This shift… it wasn’t easy. It created rifts. Some of her old conservation friends felt she was abandoning sacred principles. Her newer friends in the effective altruism community championed her courage. Both sides are here today, and that speaks volumes. It speaks to how deeply she engaged with people, how passionately she made them think, and how much she mattered to both communities.

  **But here’s what mattered most to *her*:** It wasn’t about winning an argument or picking a side. It was about the relentless pursuit of what she believed was *right*, based on the evidence and empathy she had *at that time*. Her courage wasn’t just in changing her mind; it was in doing so publicly, knowing it might cost her the respect of people she valued. That took immense intellectual honesty and moral courage.

  We won’t resolve environmental ethics here today. That wasn’t [Aunt's Name]'s expectation for this gathering. What she *would* want, I believe, is for us to remember the thread that ran through *all* her years: an unshakeable dedication to the well-being of the living world, however complex that commitment became. From meticulously recording data in her field journals to passionately debating the ethics of intervention, her driving force was always a profound sense of responsibility – a responsibility born of deep love and deep thought.

  So, let’s remember [Aunt's Name] for that remarkable mind, that fearless heart, and that unwavering ethical core. Let’s remember her dedication – whether studying ecosystems or striving to ease suffering within them. Let’s remember her courage to follow her convictions, even when it was hard. And let’s honor her by carrying forward our own commitment to thoughtful care, in whatever form that takes for each of us.

  She challenged us. She inspired us. She loved this world fiercely. We will miss her deeply. Thank you.

  ---

  **Why this works:**

  1.  **Acknowledges Both Phases:** It clearly lays out her Leopold roots and her later EA focus without judgment.
  2.  **Centers *Her* Motivation:** The core isn't the ideas, but *her* ethical drive, empathy, and intellectual courage. This is the unifying thread ("unshakeable dedication," "profound moral compass").
  3.  **Names the Tension Directly but Neutrally:** Uses words like "shift," "evolution," "challenged," "rift," and "wasn't easy." Avoids loaded terms ("abandoned," "betrayed," "lost the plot").
  4.  **Honors the Difficulty:** Highlights her courage in changing her mind publicly despite potential cost.
  5.  **Defuses Debate:** Explicitly states this isn't the place to resolve the ethics ("We won't resolve environmental ethics here today"). Focuses instead on shared admiration for *her* character.
  6.  **Focuses on Shared Values:** Emphasizes her deep love for the living world and sense of responsibility, values both groups likely share even if they disagree on application.
  7.  **Personal & Warm:** Grounds it in her life ("walked these hills," "field journals") and your relationship ("my aunt").
  8.  **Respectful to All:** Validates the feelings of both groups ("kindred spirit," "championed her courage").
  9.  **Appropriate Length & Tone:** Stays within 5 minutes; respectful, thoughtful, and ultimately uplifting, focusing on her legacy of courage and care.

  **Tips for Delivery:**

  *   **Pace:** Speak slowly and clearly, especially when discussing the tension.
  *   **Eye Contact:** Make eye contact with different parts of the room, subtly acknowledging both groups.
  *   **Emphasis:** Put gentle emphasis on words like "courage," "empathy," "responsibility," "love," and her name.
  *   **Pause:** Allow brief pauses after key points, like acknowledging the rift or stating this isn't the place for debate.
  *   **Be Yourself:** Your genuine care for your aunt will come through. Don't worry about being perfect.

  This eulogy honors her complexity without getting bogged down in it, celebrating the essence of who she was: a deeply principled and compassionate thinker. Good luck.
