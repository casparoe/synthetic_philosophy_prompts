  I should emphasize the difference between mathematical abstractions and physical reality. The axiom of choice is useful in many areas of math, like functional analysis and topology, which have practical applications. Discarding it would break a lot of important theories. Also, in physics, theories like quantum mechanics use Hilbert spaces, which depend on the axiom of choice. So rejecting it would cause more problems than it solves.

