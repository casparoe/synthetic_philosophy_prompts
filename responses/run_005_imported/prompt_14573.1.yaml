answer: |-
  Here are 10 interview questions (+ follow-ups) designed to probe deeper into Lewisian Modal Realism, incorporating your specific requests and anticipating likely responses:

  1.  **Beyond the Stare: Intuition vs. Argument:** Lewis famously dismissed the "incredulous stare" reaction to his realism as carrying no argumentative weight, merely reflecting a clash with ingrained intuitions. Do you agree that the visceral sense of absurdity many feel *is* philosophically inert? Or could that very pervasiveness signal a deeper problem – perhaps an incoherence within the concept of "reality" itself that Lewis's framework fails to capture?
      *   *Likely Answer/FU:* (If she agrees w/Lewis) If the intuition is truly weightless, how do you explain its near-universality? Doesn't its persistence suggest Lewis's theory imposes such a radical revision of our core concept of "real" that it becomes almost unrecognizable, potentially undermining its own explanatory power? / (If she grants it some weight) What specific *argumentative* force do you think the intuition possesses that Lewis overlooked? Does it point towards a need for a privileged "actuality" he denies?

  2.  **Actuality, Indexicality, and Moral Weight (Adams Challenge):** Robert Adams argued that Lewis's purely indexical analysis of "actuality" (it just means "this world") cannot explain why the suffering occurring *here* should matter more to us than qualitatively identical suffering in other equally real possible worlds. If all worlds are ontologically equal, doesn't Lewis's view render our special concern for *this* suffering arbitrary or even irrational, reducing morality to a kind of cosmic parochialism?
      *   *Likely Answer/FU:* (If she defends indexicality) Doesn't this defense imply that our moral obligations are fundamentally egocentric or location-based in a way that seems deeply counterintuitive? Why *shouldn't* we feel equally obligated to prevent suffering in a world causally isolated but equally real? Doesn't this make morality strangely contingent on spatiotemporal accident? / (If she suggests a different basis for moral focus) If not indexicality, what *does* ground our special moral concern for this world within your Lewisian framework? Does it require adding something beyond the core ontology?

  3.  **Inconsistent Fictions & the Fragmentation Problem:** Lewis's analysis of fiction relies on a "cluster" of possible worlds maximally matching the story's explicit content. But what about radically inconsistent novels (e.g., explicit contradictions) or extremely underdescribed ones? Can such a story genuinely pick out *any* single concrete possible world? Or does handling these cases force you, like Lewis, towards "fragmentation" – analyzing the story as corresponding to *multiple* worlds or world-segments? Does this fragmentation undermine the elegance of the original analysis?
      *   *Likely Answer/FU:* (If she embraces fragmentation) Doesn't fragmentation mean that for many (perhaps most!) fictions, there *is no* single concrete world that is *the* world of the story? Doesn't this make fiction inherently "worldless" or "multi-world" on your view, contrasting sharply with the intuition that a story creates *a* specific world? How does this square with Lewis's realism? / (If she tries to avoid fragmentation) How can a single concrete world satisfy explicit contradictions within a story without violating the law of non-contradiction within that world? How can maximal similarity be determined for a character with almost no described properties?

  4.  **Concreteness Over Abstraction: The Cost of Purity?** Lewis rejected "ersatz" possible worlds (abstract entities like sets of propositions) primarily because they couldn't provide suitable truthmakers for modal claims without problematic "magical" relations. But doesn't the ontological cost of positing infinitely many concrete universes vastly outweigh the benefits gained by avoiding ersatz magic? Is avoiding "magical" representation *really* worth accepting such an extravagant ontology?
      *   *Likely Answer/FU:* (If she prioritizes avoiding magic) Can you elaborate on why the "magic" of representation (e.g., an abstract object *being about* something) is considered more ontologically problematic or mysterious than the existence of infinitely many causally isolated concrete universes? Isn't the latter also deeply mysterious? / (If she emphasizes explanatory power) Does the explanatory power for modality *really* depend on the worlds being *concrete*, or could a sufficiently sophisticated ersatzism capture the same logical/modal structure without the concrete baggage?

  5.  **The Epistemic Isolation Problem:** If other possible worlds are concrete and real but causally and spatiotemporally isolated from ours, knowledge *about* them seems impossible in principle. We cannot observe them, interact with them, or receive any information from them. Doesn't this make Lewis's modal realism effectively *falsification-proof*? How can a theory be meaningfully asserted if its central ontological commitments are, by its own lights, fundamentally unknowable?
      *   *Likely Answer/FU:* (If she appeals to theoretical virtue/parsimony) If the theory is unfalsifiable in principle regarding its core ontological claim (the existence of other concrete worlds), how can theoretical virtues like simplicity or explanatory power genuinely adjudicate between it and less extravagant alternatives? Doesn't this risk making it non-rational? / (If she downplays the need for direct knowledge) Can we have justified beliefs about entities we cannot, even in principle, gather evidence for? Doesn't Lewisian realism render modal knowledge fundamentally different in kind from other empirical knowledge?

  6.  **Identity Across Worlds vs. Counterparts:** Lewis replaced trans-world identity with counterpart theory to avoid haecceitism and problems of overlap. But does counterpart theory truly capture our intuitions about *personal* possibility? When I say "I could have been a pianist," does it feel like I'm talking about a *different* individual (my counterpart) in another world, rather than *myself* having different properties? Doesn't this fracture the self in a way that feels alien to our modal experience?
      *   *Likely Answer/FU:* (If she defends CT) How does counterpart theory account for the intense *first-person* focus of our modal judgments ("That could have been *me*!")? Doesn't reducing it to similarity relations between distinct individuals lose something essential about personal possibility? / (If she acknowledges the tension) Can Lewisian realism offer a satisfying account of *de se* modality (modality concerning oneself) without smuggling back in a notion of trans-world identity?

  7.  **Underdescription and the Plenitude Principle:** Lewis posits a "Principle of Plenitude": every way a world could possibly be *is* the way some concrete world is. But for an extremely underdescribed fictional character (e.g., "a farmer"), there are countless ways to fill in the missing details (hair color, favorite food, exact location). Does plenitude guarantee that *every possible completion* of that minimal description exists as a concrete world? If so, doesn't this make the "world(s) of the story" hopelessly indeterminate and vast?
      *   *Likely Answer/FU:* (If she says yes) Doesn't this extreme plenitude render the author's act of *creation* somewhat illusory? Aren't they merely *selecting* (via their text) from an infinite, pre-existing plenitude of worlds, rather than bringing a *new* world into being? / (If she suggests constraints) What constraints limit the plenitude relevant to a specific fiction? How do we determine which of the infinitely many worlds matching the text count as "the" worlds of the story without appealing to authorial intent or reader construction, which Lewis wanted to avoid?

  8.  **The Value of Hope and Regret in a Multiverse:** If every possibility is equally real somewhere, what happens to the emotional and motivational force of concepts like *hope* (for a better possibility) or *regret* (for a lost possibility)? If the "better world" I hope for already concretely exists, does that hope become merely a wish to be elsewhere? If the path not taken was taken by a counterpart elsewhere, does that diminish the sting of *my* regret?
      *   *Likely Answer/FU:* (If she separates indexical concern) Even if I acknowledge that a better life for a counterpart exists, why should that provide *me* (here, now) with comfort or diminish *my* regret about the path *I* actually took? Doesn't the isolation prevent any transfer of value? / (If she suggests it reframes the emotions) Does this view risk making hope and regret primarily about *location* ("I wish I was *there*") rather than about *possibility* and *change* within *my* existence?

  9.  **Modality, Not Metaphysics?** Many philosophers find Lewis's *semantics* for modal language compelling but reject the concrete metaphysics. Couldn't the theoretical benefits Lewis claimed for his realism (e.g., a reductive analysis of modality) be achieved by adopting the *logic* and *semantics* of possible worlds as a useful fiction or abstract model, without the massive ontological commitment? Is the concrete realism doing essential work that the semantics alone cannot?
      *   *Likely Answer/FU:* (If she says semantics requires metaphysics) Can you specify what specific modal phenomena or inferences the semantics *cannot* handle without the concrete truthmakers? What, concretely, goes wrong in the ersatz accounts that only Lewis's concrete worlds fix? / (If she grants semantics could stand alone) If the semantics *can* work without the metaphysics, doesn't that make the concrete worlds an explanatorily idle, ontologically profligate addition (Ockham's Razor)?

  10. **The Novelist as World-Selector:** From a Lewisian perspective, when I write a novel, am I best understood not as *creating* a new world, but as *describing* or *pointing towards* regions within the vast, pre-existing pluriverse? If so, does this view change how you, as a philosopher of modality, perceive the novelist's craft? Does it make fiction more akin to exploration than creation?
      *   *Likely Answer/FU:* (If she agrees with "selection") Doesn't this dramatically downplay the author's agency and the sense of genuine invention? Does it account for the author's ability to stipulate *new* fundamental laws or properties not found in our world? / (If she suggests a hybrid view) How does the author's act of composition interact with the pre-existing plenitude? Is there any sense in which the act of writing *adds* something to modal reality within this framework?

  These questions push beyond exposition to examine the consequences, costs, tensions, and potential paradoxes within Lewis's system, specifically targeting the areas you requested while exploring broader implications relevant to both philosophy and your craft as a novelist. The follow-ups are designed to press on the most probable defensive lines a Lewisian would take. Good luck with the interview!
