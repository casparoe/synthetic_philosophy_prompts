  Then there's Robert Adams's objection. Adams argued that if all worlds are equally real, why should we care more about suffering in "our" world? Lewis used an indexical view—"actual" just means "this world," like "here" means this place. But Adams says that doesn't explain moral priority; it feels like there should be something special about our world. The user wants this addressed, so I need a question that challenges the indexical approach and probes if it undermines empathy.

  For fiction, Lewis analyzed "truth in a story" through similarity to possible worlds. But what if a novel is inconsistent—say, a character is both dead and alive? Lewis suggested "fragmentation," treating the story as pointing to multiple worlds. The user is curious if this applies to radically underdescribed stories too, and if it pushes the philosopher toward fragmentation. This ties into the novelist's work, since they deal with incomplete or contradictory narratives.

