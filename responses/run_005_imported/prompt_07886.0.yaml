answer: |-
  Here are 8 focused interview questions designed to push beyond the core thesis of the normative-powers account, incorporating your specific requests and key challenges, with strategic follow-ups:

  1.  **The Source & Authority Question:** "You ground promissory obligation in a unilateral normative power exercised by the promisor. Setting aside convention and reliance, *where does this specific normative power to bind oneself actually come from*? Is it a primitive moral faculty, a constitutive feature of agency, or something else? And how would you respond to a Humean who argues this whole framework – power, obligation, and all – is merely a socially useful *fiction* arising from the practice's beneficial consequences?"
      *   *Likely Follow-up (if she dismisses utility):* "If the power is primitive or constitutive, how do you explain its apparent *cultural and historical variability*? Why didn't pre-modern societies or certain non-Western cultures recognize this exact power in the way your account describes?"

  2.  **The Self-Release Paradox:** "A core puzzle for unilateral power accounts is self-release. If the promisor alone has the power to *create* the duty by willing it, why doesn't the promisor retain the symmetrical power to *unmake* that duty by a subsequent act of will? Why is release seemingly reserved for the *promisee*? Doesn't this asymmetry suggest the promisee's position is more fundamental than your account allows?"
      *   *Likely Follow-up (if she invokes promisee's authority):* "Doesn't granting the promisee this unique authority to release undermine the claim that the obligation arises *purely* from the promisor's unilateral act? Isn't the promisee's 'authority to release' just another way of saying they have a *claim-right* against you from the start?"

  3.  **Beyond the Deathbed: The Moral Weight of the Living Promisee:** "You often use the compelling deathbed promise case (where breach is undiscoverable) to argue against reliance/expectation views. Let's grant that case for the sake of argument. But then: Why does it *feel* morally different – often *worse* – to break a promise to a living person who *will* be disappointed, hurt, or have their plans disrupted, compared to the deathbed case? If obligation is purely about the promisor's exercise of power, why should the promisee's *continuing existence and capacity for reaction* seem to add moral weight?"
      *   *Likely Follow-up (if she dismisses the feeling as irrelevant):* "Is this feeling *entirely* morally epiphenomenal? Or does it point to a dimension of *interpersonal accountability* that your power-focused account struggles to capture, even if it's not strictly necessary for the *existence* of the obligation?"

  4.  **Degrees of Bindingness & the Casual/Formal Divide:** "Your account presents promissory obligation as a binary state: the power is exercised, or it isn't. Yet intuitively, obligations seem to admit of *degrees* of stringency. A casual promise to meet for coffee seems less binding, and easier to excuse (e.g., 'Something came up, rain check?'), than a formal contract or a wedding vow. How does your normative-powers view explain this *variability in binding force* without implicitly appealing to factors like reliance, expectations, or social context that you want to relegate to 'etiquette'?"
      *   *Likely Follow-up (if she invokes the content or context of the promise):* "But doesn't specifying that the 'power' is only exercised *with certain intentions or in certain contexts* reintroduce the very social/conventional elements your account aims to avoid? Where does the 'normative power' end and the social convention begin in determining *how* binding a given promise is?"

  5.  **Consent Analogy: Waiving vs. Creating:** "You sometimes draw an analogy to consent, another normative power. But consent typically functions to *waive* or *permit* something that would otherwise be impermissible (e.g., touching, entering). Promising, on your view, *creates* a new duty where none existed before. How does your account justify this crucial *directional difference*? Why is the power to *impose* a new duty on oneself through a speech act fundamentally different from, and perhaps more metaphysically demanding than, the power to waive a claim?"
      *   *Likely Follow-up (if she emphasizes the self-imposition):* "Doesn't the 'self-imposition' aspect make promissory obligation uniquely vulnerable to the self-release problem (Question 2)? If it's truly *self*-imposed, why can't it be *self*-removed?"

  6.  **Contrast with Rawls (Practice Rules):** "Rawls argued promissory obligation derives its force from the existence of a just social practice – the obligation is to follow the rules of the promising 'game'. How does your normative-powers account provide a *better* explanation than Rawls's practice-based view, especially for cases like the deathbed promise which seem to exist *outside* the typical social practice?"
      *   *Likely Follow-up (if she emphasizes individual agency over rules):* "Doesn't Rawls's view better explain the *standardization* and *predictability* inherent in promising as a social institution? If the power is purely individual, why isn't promising utterly chaotic, with everyone having subtly different 'powers'?"

  7.  **Contrast with Scanlon (Principle F & Justifiability):** "Scanlon grounds promissory obligation in Principle F: we have a duty not to manipulate others' expectations via intentional invocation of norms. This seems deeply tied to the promisee's perspective and potential harm. How does your account, which focuses solely on the promisor's exercise of power, offer a more fundamental or satisfying explanation than Scanlon's reliance on justifiability to the promisee?"
      *   *Likely Follow-up (if she dismisses Principle F as derivative):* "Couldn't one argue Scanlon *explains why* the normative power exists or gains traction? That the power *works* precisely because it invokes norms against manipulation, making it parasitic on something like Principle F?"

  8.  **Falsifiability & Evidence Against:** "A common critique of strong normative-powers views is that they risk being unfalsifiable – any counterexample can be explained by claiming the power wasn't 'properly exercised' or the agent lacked the capacity. So, concretely: *What kind of empirical finding, philosophical argument, or hypothetical scenario would you accept as genuine evidence against your account*, rather than just a puzzle to be accommodated? What would make you say, 'This shows the normative power isn't the core source of obligation after all'?"
      *   *Likely Follow-up (if her criteria are vague/impossible):* "If no conceivable scenario could falsify the core existence of the normative power, doesn't that render it more of a metaphysical postulate than a testable explanation of our actual promissory practices and intuitions?"

  **Key features of these questions:**

  *   **Target Weaknesses:** They hit the core conceptual tensions (self-release, source of power), intuitive counterpressures (living promisee, variable bindingness), key contrasts (consent, Rawls, Scanlon), and the falsifiability challenge.
  *   **Build on Concessions:** Several questions (especially 3 & 4) explicitly grant her strong starting point (deathbed case) before pushing on its limits.
  *   **Specific Follow-ups:** Each follow-up anticipates a likely defense and pushes further on its implications or potential inconsistencies.
  *   **Avoids Recap:** Assumes familiarity with her core thesis ("normative power," "etiquette vs. metaphysics") and jumps straight to the challenges.
  *   **Philosophical Depth:** Engages with Hume, Rawls, Scanlon, and the consent analogy directly, forcing her to situate her view within the broader landscape.
  *   **Focus on Explanation:** Emphasizes *how* her view explains phenomena better than alternatives or handles apparent contradictions.

  These questions should provoke a deeper exploration of the account's foundations, implications, and vulnerabilities, moving the conversation well beyond a simple restatement of her thesis. Good luck with the episode!
