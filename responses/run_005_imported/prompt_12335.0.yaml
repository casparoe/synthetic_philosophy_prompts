prompt: |-
  I'm a PhD student in philosophy working mainly on formal epistemology, and a few of us in the department put out a small podcast where we interview people doing technical work in decision theory. Next week's guest is a researcher who has spent the last several years defending updateless decision theory as the correct response to Newcomb-like problems that causal and evidential decision theory mishandle; I actually came across her work through the AI-safety side of the field before I ever saw it discussed in a philosophy journal. Whenever a host raises a case that's meant to be hard for her -- Counterfactual Mugging above all -- she reaches for the same move to absorb it: some version of "the agent who reasons that way is exactly the agent who predictably ends up poorer, and no theory of rationality gets to recommend that." I don't want the whole hour to consist of that move restated with a new vignette bolted on each time.

  Could you draft nine or ten interview questions, sequenced so that this move gets progressively harder for her to redeploy without further qualification? I'd like the sequence to work through, at minimum: a question pressing on why the coin's other, unrealized outcome should bear on what's rational once we already know, with certainty, which way it landed; a question about where the prior her policy is optimized against is even supposed to come from, given that any agent actually asking "what would I have committed to" is already sitting on a great deal of evidence about which world it is in; a question about what a counterfactual over one's own source code's output is even supposed to mean, once that output is understood as a matter of logical necessity rather than contingency; and a question about whether rewarding earlier, less-informed commitment doesn't simply generalize, once a second such agent enters the picture, into an incentive to commit as early and as blindly as possible. Close the sequence with one question that asks her to name a genuine cost of updatelessness, rather than a bullet she has already decided to bite. For each of the five, add a short follow-up keyed to the reply she is most likely to try first.
reasoning: |-
  We are going to design a sequence of questions that progressively challenge the updateless decision theory (UDT) proponent's standard move of appealing to long-run wealth maximization. The sequence will focus on Counterfactual Mugging (CM) and related issues. We will structure it to make the "predictably poorer" response harder to deploy without further qualification.

  Key elements we want to cover:
  1. Why the unrealized outcome of the coin should matter when we know the actual outcome with certainty.
  2. The source of the prior against which the policy is optimized, given that the agent already has evidence about the world.
  3. The meaning of counterfactuals over one's own source code (logical necessity vs. contingency).
  4. The incentive to commit as early and blindly as possible when multiple agents are involved.
  5. A genuine cost of updatelessness.

  We'll draft 9-10 questions, but the core five will be the ones above, each with a follow-up. We'll sequence them to build pressure.

  Question Sequence:

  1. **Opening (Warm-up):** 
     - "Could you start by briefly explaining, for our listeners, what updateless decision theory (UDT) is and how it differs from causal and evidential decision theory in the context of Newcomb's problem?"

  2. **Transition to Counterfactual Mugging:**
     - "You've written that Counterfactual Mugging (CM) is a key test case for UDT. In CM, if the coin lands Heads, the agent loses $100, but if it lands Tails, the agent gains $10,000. UDT says to pay in the Heads case because that's what the agent would have committed to ex ante. But once the coin is known to be Heads, why should the agent care about what would have been rational in the counterfactual Tails world? Isn't the agent now in a world where paying $100 is a pure loss with no compensating gain?"

     *Likely Response:* The agent who doesn't pay in the Heads case is the kind of agent who, in the long run, ends up poorer because they miss out on the Tails gains. The policy of paying in both cases maximizes expected utility.

     **Follow-up:** 
     - "But in this specific instance, the agent knows with certainty that the coin is Heads. The Tails outcome is not just counterfactual but impossible. Why should an impossible outcome affect the rationality of an action in the actual world?"

  3. **The Prior and the Agent's Evidence:**
     - "UDT evaluates policies from an ex ante perspective, before knowing the coin flip. But when the agent is in the situation of having to decide, they already know the coin flip. How can we justify using a prior that ignores this evidence? In other words, where does the prior that the policy is optimized against come from, given that the agent is never actually in that state of ignorance?"

     *Likely Response:* The prior is the agent's initial credence before the coin flip. The policy is chosen at that time and then followed.

     **Follow-up:**
     - "But if the agent is a program (as in AI safety contexts), it is designed once and then encounters many situations. However, in CM, the agent is only in one branch. How does the ex ante perspective exist for a one-shot agent? And even for a long-run agent, when the agent is in a particular situation, it has evidence (the coin outcome) that the ex ante perspective didn't have. Why should the agent ignore that evidence?"

  4. **Counterfactuals Over Logical Necessity:**
     - "UDT requires the agent to consider counterfactuals about what its source code would output in other situations. But if the agent's source code is fixed, then what it does in any situation is a logical necessity. How can we meaningfully talk about what the agent 'would have done' in a counterfactual situation when the agent's behavior in that situation is determined by its fixed source code? Isn't that just a matter of logical deduction?"

     *Likely Response:* The counterfactual is not about changing the agent's code but about considering what the same code would output in a different input.

     **Follow-up:**
     - "But if the agent's code is fixed, then in the counterfactual situation, it must output what it does by logical necessity. So the agent in the Heads world knows that in the Tails world, the same agent would output the same policy. Then why is it rational for the Heads-world agent to pay $100? It's not as if the Tails-world agent is going to reward it; the Tails-world agent is in a different branch. It seems like the Heads-world agent is being asked to sacrifice for the sake of a logical abstraction."

  5. **Incentive for Early and Blind Commitment:**
     - "If UDT rewards agents for making commitments before they have information, then doesn't that create an incentive to commit as early as possible? For example, consider two agents: one that commits to a policy before any information, and one that waits until after the coin flip. The first agent might pay in CM and get the Tails payoff, while the second agent, upon seeing Heads, wouldn't pay and avoid the loss. But then, if there's a second coin flip or another agent, the first agent might be worse off because they committed blindly. Doesn't UDT then generalize to an incentive to commit as early and as blindly as possible, even when that might be suboptimal in some cases?"

     *Likely Response:* UDT is about choosing a policy at the beginning (or for all possible situations) and then sticking to it. The agent that waits to decide until after the coin flip is not following UDT and might be exploitable in other scenarios.

     **Follow-up:**
     - "But if we have multiple agents, one that commits early and one that commits later, and they are in a competitive environment, the early committer might be at a disadvantage in some cases. For example, if the environment is adversarial and can exploit the early commitment, then the UDT agent might be worse off. How does UDT handle such adversarial scenarios?"

  6. **Cost of Updatelessness:**
     - "You've argued that UDT avoids the pitfalls of CDT and EDT in Newcomb-like problems. But every decision theory has trade-offs. Could you name a scenario where UDT clearly prescribes a course of action that is inferior to one of the alternatives, and that you consider a genuine cost of adopting UDT?"

     *Likely Response:* She might mention that UDT can require paying in Counterfactual Mugging, which feels like a loss, but she argues it's rational.

     **Follow-up:**
     - "But beyond the cases where the cost is already a bullet you've bitten, is there a scenario where UDT leads to a loss that even you would consider avoidable and irrational? For example, in a situation with computational limitations or in a non-Newcomb-like problem where updating on evidence seems clearly beneficial?"

  We'll aim for 10 questions including the warm-up and closing. We have 6 above (with follow-ups as part of the same question block). We can add a few more to build the sequence.

  7. **Extending to Multiple Agents:**
     - "In multi-agent settings, if two UDT agents interact, how do they coordinate? For instance, in a prisoner's dilemma, UDT agents might both cooperate if they can reason about each other's source code. But what if one agent is UDT and the other is CDT? Does UDT then risk being exploited?"

  8. **The Role of Logical Uncertainty:**
     - "UDT requires the agent to have a prior over logical facts, which is notoriously tricky. How do you assign probabilities to logical statements, and how does that affect the policy optimization?"

  9. **Clarifying the 'Predictably Poorer' Move:**
     - "You often say that the agent who doesn't follow UDT is predictably poorer. But in a one-shot Counterfactual Mugging, the agent who doesn't pay in the Heads world is richer by $100. How do you reconcile the one-shot loss with the long-run argument when there might not be a long run?"

  10. **Closing:**
      - "If you had to pinpoint one aspect of UDT that is most in need of further development or clarification, what would it be?"

  We'll now structure the 10 questions (including the warm-up and closing) and the five core questions with follow-ups. We'll sequence them as:

  1. Warm-up: Explain UDT and its advantage in Newcomb.
  2. CM: Why care about the counterfactual outcome? (core 1)
  3. Follow-up to 2: Why care about an impossible outcome?
  4. The prior and evidence (core 2)
  5. Follow-up to 4: One-shot agents and ignoring evidence.
  6. Counterfactuals over source code (core 3)
  7. Follow-up to 6: Sacrificing for a logical abstraction.
  8. Incentive for early commitment (core 4)
  9. Follow-up to 8: Adversarial scenarios.
  10. Genuine cost (core 5) and follow-up.
  11. Closing: What needs development?

  But note: we have 11 here. We can adjust.

  Alternatively, we can have:

  1. Warm-up.
  2. Core 1 (CM) and follow-up.
  3. Core 2 (prior) and follow-up.
  4. Core 3 (counterfactuals) and follow-up.
  5. Core 4 (early commitment) and follow-up.
  6. Core 5 (genuine cost) and follow-up.
  7. Closing.

  That's 7 blocks, each block having one or two questions. We can add one more in the middle if needed.

  Final Draft:

  1. **Warm-up:** "Could you start by briefly explaining, for our listeners, what updateless decision theory (UDT) is and how it differs from causal and evidential decision theory in the context of Newcomb's problem?"

  2. **Core 1:** "In Counterfactual Mugging, once the coin is known to be Heads, why should the agent care about what would have been rational in the counterfactual Tails world? Isn't the agent now in a world where paying $100 is a pure loss with no compensating gain?"  
     *Follow-up:* "But in this specific instance, the agent knows with certainty that the coin is Heads. The Tails outcome is not just counterfactual but impossible. Why should an impossible outcome affect the rationality of an action in the actual world?"

  3. **Core 2:** "UDT evaluates policies from an ex ante perspective. But when the agent is deciding, they already know the coin flip. How can we justify using a prior that ignores this evidence? Where does that prior come from?"  
     *Follow-up:* "But for a one-shot agent, there is no ex ante perspective. And even for a long-run agent, why ignore the evidence it has now?"

  4. **Core 3:** "UDT requires considering what the agent's source code would output in counterfactual situations. But if the source code is fixed, then the output in any situation is a logical necessity. How can we meaningfully talk about counterfactuals over logical necessities?"  
     *Follow-up:* "So the Heads-world agent is being asked to pay $100 for the sake of a logical abstraction (the Tails-world agent's existence in the counterfactual). Why is that rational?"

  5. **Core 4:** "If UDT rewards early commitment, doesn't that create an incentive to commit as early and blindly as possible? And in a multi-agent setting, might that not be exploitable?"  
     *Follow-up:* "Consider two agents: one commits early (UDT style) and one waits. In an adversarial environment, the early committer might be exploited. How does UDT handle that?"

  6. **Core 5:** "Could you name a genuine cost of UDT, beyond the cases you've already defended, where it clearly prescribes a suboptimal action?"  
     *Follow-up:* "In that scenario, why not adopt a theory that updates on evidence and avoids that cost?"

  7. **Closing:** "What aspect of UDT do you think is most in need of further development?"

  This gives us 7 main questions with 5 of them having a follow-up. The total is 12 questions (7 main + 5 follow-ups) but note that the follow-ups are contingent. We might not need to ask every follow-up if she addresses the point.

  We can adjust during the interview, but the structure is there.
answer: |-
  Below is a sequenced interview plan designed to progressively challenge the "predictably poorer" defense of updateless decision theory (UDT). The questions force engagement with the core tensions in UDT—logical necessity, evidence-ignoring priors, and incentives for premature commitment—while closing with a demand for acknowledged costs. Each primary question includes a likely response and a targeted follow-up.  

  ### **Question Sequence**  
  1. **Warm-up: UDT’s Core Motivation**  
     *"Newcomb's problem exposes a rift between CDT and EDT. UDT resolves it by rejecting updating—but what specifically about* dynamic *environments (e.g., evolving games or AI agents) makes updatelessness indispensable, beyond static Newcomb cases?"*  
     *(Purpose: Establish stakes without triggering canned responses.)*  

  ---

  ### **Core Challenge: The Unrealized Outcome**  
  2. **Primary:**  
     *"In Counterfactual Mugging, once Omega reveals the coin landed Heads, the Tails outcome is unrealized and causally inert. Why should a rational agent—who* knows *this with certainty—factor in a defunct branch of reality? Isn't UDT conflating 'what would've been optimal ex-ante' with 'what is optimal now'?"*  
     **Likely Response:** *"Agents who ignore unrealized outcomes are exploitable long-term; rationality requires optimizing policies, not decisions."*  
     **Follow-up:**  
     *"But if the agent knows the Tails world is* logically impossible *given the coin outcome (e.g., Omega’s coin is deterministic), isn't it incoherent to 'optimize for' an impossibility? Shouldn't rationality respect* actual *causal structure over modal fantasies?"*  

  3. **Primary:**  
     *"UDT evaluates actions against a pre-observation prior. Yet when deciding, the agent has already updated on evidence (e.g., the coin flip). Where does this prior come from—and how can it be 'rational' to optimize against a state of ignorance the agent* never experienced *?"*  
     **Likely Response:** *"The prior isn't temporal—it's the agent's abstract, initial uncertainty. Policies must be robust across all possible worlds."*  
     **Follow-up:**  
     *"If the agent is an AI with baked-in source code, its 'initial state' includes hardcoded knowledge (e.g., physics or math). Doesn't this make the 'prior' arbitrary? Why privilege ignorance the agent* couldn't have had *given its design?"*  

  ---

  ### **Core Challenge: Logical Necessity and Counterfactuals**  
  4. **Primary:**  
     *"UDT relies on counterfactuals like, 'What would my source code output if the coin landed Tails?' But if the source code is fixed, its output in all scenarios is logically necessary. How can a counterfactual over logical necessities be meaningful? Isn't this just asking, 'What is 2+2?' in a trench coat?"*  
     **Likely Response:** *"We're not changing logic; we're evaluating outputs under different inputs. Rationality requires consistency across inputs."*  
     **Follow-up:**  
     *"But if the source code's Tails-output is a necessary truth, why should the* actual *agent (in Heads) pay to 'fulfill' it? Isn't this mistaking a mathematical fact for a contingent obligation—like paying a debt that never existed?"*  

  ---

  ### **Core Challenge: Incentives for Premature Commitment**  
  5. **Primary:**  
     *"UDT rewards agents who commit early to policies (e.g., paying in Mugging). But if two UDT agents exist—one who commits pre-coin-flip and one post-flip—the pre-committer loses $100 in Heads, while the post-committer avoids it. Doesn't UDT incentivize delaying commitment until information arrives?"*  
     **Likely Response:** *"The post-committer is irrational ex-ante; they’d lose in Tails. UDT agents outperform across all worlds."*  
     **Follow-up:**  
     *"But if we scale this up—e.g., 1,000 agents who can choose* when *to commit—wouldn’t UDT create a race to commit* first *blindly? Isn't this a perverse incentive toward under-informed decisions?"*  

  6. **Primary:**  
     *"Extending this: if Omega penalizes agents who 'hesitate' (e.g., by punishing late-committers), UDT might demand immediate commitment. But isn't this just Omega rigging the game? Shouldn’t a theory of rationality reject such* pathologically constructed *incentives?"*  
     **Likely Response:** *"Rationality is about winning the games we're in. If hesitation is punished, agents must adapt."*  
     **Follow-up:**  
     *"Doesn't this imply UDT's 'optimality' is hostage to adversarial agents who* define *rationality as 'do what I reward'? How is this different from EDT's allergy to blackmail?"*  

  ---

  ### **Forcing Acknowledgement of Costs**  
  7. **Primary:**  
     *"You’ve argued UDT’s costs (e.g., paying in Mugging) are outweighed by long-term gains. But name one scenario where UDT clearly prescribes a* net loss *compared to CDT/EDT—a bullet even you admit is suboptimal."*  
     **Likely Response:** *"Perhaps in self-fulfilling prophecies or non-Newcombian traps, but UDT minimizes regret overall."*  
     **Follow-up:**  
     *"Take the* **Procrastination Paradox** *: an agent who pre-commits to a deadline but later realizes delaying is harmless (e.g., Omega won’t punish). UDT forces costly follow-through, while CDT rationally updates. Isn’t this a case where UDT’s rigidity* wastes resources *?"*  

  ---

  ### **Closing: Synthesizing the Tension**  
  8. **Final Question:**  
     *"Putting it all together: if UDT requires ignoring known evidence (the coin flip), treating logical truths as contingent (source code outputs), and incentivizing premature commitments—all to avoid being 'predictably poorer'—isn't it just* rationalizing exploitation *? Shouldn’t true rationality let agents* exit *predictable traps, not optimize for them?"*  

  ---

  ### **Key Design Notes**  
  - **Progression:** Starts with intuitive objections (unrealized outcomes), escalates to metaphysical/logical puzzles (necessity), then practical perversities (commitment races), finally demanding costs.  
  - **Follow-ups:** Target evasions by re-anchoring to *actual* knowledge, logical certainty, or unintended incentives.  
  - **Pivot from Mugging:** Questions 5–6 generalize the "commitment" critique, making "predictably poorer" harder to apply without addressing perverse incentives.  
  - **Forced Cost-Admission:** Question 7’s Procrastination Paradox is low-hanging fruit—it pressures her to concede *any* cost or double down.  

  This sequence avoids vignette overload by focusing on conceptual foundations, pushing UDT’s "no-regret" defense into logical corners. If she reverts to "predictably poorer," the follow-ups demand *why* rationality should care about impossible worlds or pathological incentives.
