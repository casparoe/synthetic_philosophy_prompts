answer: |-
  Your reconstruction of Lewis's triviality argument is **almost perfect** - you've nailed the core logic and correctly identified the critical premises. However, there's a small but crucial typo in the final equation that slightly misrepresents the absurdity. Let's break it down:

  1.  **Your Derivation (Corrected):**
      *   Start with reasonable `P`, and `A`, `B` where `0 < P(A&B) < P(A)` (so `0 < P(B|A) < 1`).
      *   **Conditionalize on B:** `P_B(S) = P(S|B)` for any proposition `S`.
          *   `P_B(B|A) = P(B|A&B) = 1` (as you have).
          *   **Thesis applied to P_B:** `P_B(A>B) = P_B(B|A) = 1`.
      *   **Conditionalize on ~B:** `P_~B(S) = P(S|~B)`.
          *   `P_~B(B|A) = P(B|A&~B) = 0`.
          *   **Thesis applied to P_~B:** `P_~B(A>B) = P_~B(B|A) = 0`.
      *   **Total Probability for `A>B` (as a proposition):**
          *   `P(A>B) = P(B) * P_B(A>B) + P(~B) * P_~B(A>B)` (This is correct! You condition on the *partition* `{B, ~B}`).
          *   `= P(B) * 1 + P(~B) * 0`
          *   `= P(B)`. **<-- This is the key correction (you wrote P(A)).**
      *   **Thesis applied to original P:** `P(A>B) = P(B|A)`.
      *   **Therefore:** `P(B|A) = P(B)`. **<-- The corrected absurdity.**

  2.  **The Significance of the Correction:**
      *   Your conclusion `P(B|A) = P(A)` would be bizarre, but `P(B|A) = P(B)` is far more devastatingly *trivial*. It means that *learning `A` tells you nothing about `B`*. This must hold for *any* `A`, `B` meeting the initial conditions under *any* reasonable `P`. This is blatantly false for most pairs `A`, `B` we care about (e.g., `A`="It rains", `B`="The streets get wet"). Lewis shows the Thesis forces `A` and `B` to be probabilistically independent *everywhere*, which is absurd.

  3.  **Your Moral - Is it Fair?**
      *   **Yes, your moral is essentially correct and standard:** "you can't have indicative conditionals be ordinary propositions whose credences behave the normal way AND have conditional probability track them".
      *   Lewis's result forces a choice:
          *   **Option 1 (Abandon Truth-Conditionality):** Indicative conditionals (`A>B`) are *not* ordinary propositions with standard truth conditions. They don't have probabilities that obey the standard laws (like being subject to the Thesis under conditionalization and recombination via total probability). This is the **Adams/Edgington/Dorothy Edgington route**: conditionals don't express propositions, they don't have truth values, `P(A>B)` is *defined* as `P(B|A)`, and the "probability" here is a measure of assertability/acceptability, not credence in a truth. The Thesis holds *by definition/stipulation*, but conditionals aren't propositions. **This view is compatible with conditionals "meaning something"**, just not in the standard truth-conditional way. Their meaning is tied to their role in conditional belief/assertion.
          *   **Option 2 (Abandon the Thesis):** Indicative conditionals *are* ordinary propositions with truth conditions (e.g., Stalnaker's similarity semantics). However, the probability of the conditional `P(A>B)` is *not* generally equal to the conditional probability `P(B|A)`. The Thesis fails. This means conditional markets tracking `P(Y|X)` might *not* be tracking `P(If X then Y)`, if the conditional is interpreted as a truth-conditional proposition.
      *   **Conclusion:** Your moral perfectly captures the dilemma Lewis exposes. The Thesis + Ordinary Propositions + Closure under Conditionalization = Triviality. Reject one.

  4.  **Your Nagging Feeling about "Recombine using Total Probability":**
      *   **Your use was CORRECT.** This is the linchpin of the argument. The critical assumption here is that `A>B` *is an ordinary proposition*, meaning its probability under *any* credence function (including `P_B` and `P_~B`) is well-defined, and that the standard law of total probability applies to it *as a proposition*. Lewis is showing that *if* you treat the conditional this way, *and* assume the Thesis holds under conditionalization, *then* recombination forces triviality. The flaw isn't in your application of total probability; it's in the assumption that `A>B` behaves like an ordinary proposition under recombination *if* the Thesis holds globally.

  5.  **Variants and Responses:**
      *   **Weaker Premises:** Lewis (1976, "Probabilities of Conditionals and Conditional Probabilities") generalized the result. Instead of requiring closure under conditionalization on *any* `C` with `P(C)>0`, he showed triviality follows if the Thesis holds for a single fixed `P` and *also* holds for the credence functions `P(·|D)` and `P(·|~D)` for just *one* specific `D` that "separates" `A&B` and `A&~B` (like `B` itself in your proof). Hájek (1989, "Probabilities of Conditionals Revisited") later showed that even for a *single, fixed* credence function `P`, if `P` is defined over a rich enough algebra (including `A>B` and all the relevant combinations), and `P` assigns values to conditionals matching the Thesis, *and* `P` satisfies the standard probability axioms, triviality still follows (e.g., `P` must have at most 4 possible values, or be extremely "cramped").
      *   **van Fraassen's Response:** Bas van Fraassen ("Probabilities of Conditionals", 1976) proposed a way to try to save truth-conditional semantics *and* the Thesis. His idea was **supervaluations over Stalnaker's semantics**. Stalnaker defines `A>B` as true if `B` is true in the "closest" world where `A` is true. van Fraassen notes that there might be indeterminacy in which world is "closest". He defines the probability `P(A>B)` as the *expectation* of the truth value of `A>B` over a probability measure on different "selection functions" (different ways of resolving the "closest world" indeterminacy). Crucially, he shows you can *construct* such a probability measure so that `P(A>B) = P(B|A)` holds *for that specific P*. **The catch:** This construction works only for *one specific `P` at a time*. It **does not satisfy Lewis's closure premise**. If you conditionalize this `P` on new evidence `C`, the new probability `P_C(A>B)` will generally *not* equal `P_C(B|A)`. van Fraassen saves the Thesis for a single static probability function but sacrifices the idea that conditionalizing preserves the Thesis. Lewis's dynamic argument still goes through. This is often seen as a clever technical fix that doesn't truly resolve the philosophical problem for truth-conditional views wanting a robust, dynamic link between conditionals and conditional probability.

  **Final Sanity Check:**

  *   **Your Derivation:** Flawless in logic, minor typo (`P(B)` not `P(A)`) in the final absurdity, which doesn't change the core point (triviality).
  *   **Your Moral:** Spot on. Lewis shows the Thesis cannot hold universally if conditionals are ordinary propositions and updating preserves reasonableness. The literature largely accepts this forces a choice: non-propositional conditionals (Adams/Edgington) or truth-conditional conditionals without the universal Thesis (Stalnaker, acknowledging failures).
  *   **Key Assumptions:** You correctly identified the Thesis and Closure under Conditionalization as the critical premises. The recombination step is sound *if* you grant that `A>B` is an ordinary proposition.
  *   **Variants:** Weaker premises exist (single P + separation, Hájek's fixed-P triviality). van Fraassen offers a technical fix for a single P but doesn't save the Thesis under conditionalization.

  **Verdict:** Your understanding is excellent. Post that Shortform with confidence! Just fix the `P(A)` -> `P(B)` typo and maybe explicitly state the corrected triviality (`P(B|A) = P(B)`). You've grasped the core result and its profound implications for the semantics and epistemology of conditionals. Lewis's triviality *is* that stark.
