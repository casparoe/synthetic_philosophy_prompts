  Okay, let me start by really unpacking what this physicist-turned-philosopher is asking. He's spent decades in condensed matter physics, dealing with symmetry breaking and phase transitions—concepts deeply tied to how properties manifest under different conditions. Now he's wrestling with David Lewis's metaphysics, specifically the problem of accidental intrinsics and why it shouldn't automatically favor counterpart theory over relativized transworld identity. 

  Hmm. His core concern is symmetry: if both views relativize something (properties for transworld identity, similarity for counterpart theory), why is Lewis's approach better? He suspects the "decisive" argument his group member cited overlooks this equivalence. I need to show rigorously that relativizing properties doesn't inherently undermine intrinsicality more than counterpart theory's relativized similarity does. 

  First, I should map the exact moves Lewis makes. The accidental intrinsics argument claims: if an object exists in multiple worlds with different intrinsic properties (like my build in W1 vs W2), those properties must be relativized to worlds—which, Lewis says, reduces intrinsics to relations. But counterpart theory avoids this by having each object worldbound, with counterparts bearing properties. 

  Ah, but here's the physicist's key insight: counterpart relations are contextually relativized too (to worlds and similarity standards). So if relativization is problematic in transworld identity, it should plague counterpart theory equally. That symmetry needs to be the backbone of my response. 

  I recall philosophers like Forbes and Ramachandran have defended relativized transworld identity. But he wants my own argument, not name-dropping. So let's build it stepwise. 

  First, clarify what "relativization" means. In transworld identity, saying "I have build B in W" isn't adding a relational property to me—it's indexing the having of B to a circumstance. Like tensed properties: "I am sitting" at t1 doesn't make sitting relational. Lewis himself endorses temporal relativization for temporary intrinsics! Why not modal relativization? 

  Then, stress that intrinsicality is defined *within* a world. A property is intrinsic iff an object's having it depends only on itself, not external relations. But that dependence is world-relative. When we say "build is intrinsic," we mean *within a world*, having it doesn't involve relations to other things *in that world*. Modal relativization doesn't change that. 

  Now counterpart theory: to say "my counterpart in W has B" makes similarity (which grounds counterpart relations) relative to a world and context. But similarity is fundamentally relational—it compares objects across worlds. So counterpart theory doesn't escape relativization; it just shifts it to a relation (similarity) that's already extrinsic by nature. Worse, it makes properties like "could have had B" depend on external counterparts—which feels more invasive to intrinsicality than indexing. 

  Finally, the physicist's point about shifting similarity standards: if context can make anything a counterpart, then what properties I "could have had" becomes wildly unconstrained. But relativized transworld identity keeps modal properties anchored to the object itself, just indexed. That's more stable. 

  ...I think this meets his request for rigor. It shows relativization in transworld identity is no more damaging than in Lewis's own temporal cases, while counterpart theory introduces relational baggage. The symmetry he spotted is real—and cuts against Lewis.
answer: |-
  The problem of accidental intrinsics (PAI) is indeed central to Lewis's rejection of transworld identity (TWI). However, I'll argue rigorously that PAI provides no decisive advantage for counterpart theory (CT) over a **relativized TWI view** (RTWI). I'll address your core concerns: (1) why relativizing intrinsic properties to worlds doesn't inherently turn them into objectionable relations, and (2) why CT merely relocates—not resolves—the relativization issue.

  ---

  ### **Stage-Setting: Key Definitions & Lewis's Argument**
  1. **Intrinsic Property (Lewisian Definition)**:  
     A property \( P \) is intrinsic iff whether an object \( x \) has \( P \) depends only on \( x \) itself, not on its relations to other distinct entities.  
     *Example*: Shape, mass, or internal structure.

  2. **Accidental Intrinsics**:  
     Properties an object *could* have lacked without ceasing to exist (e.g., your height, hair color).

  3. **Lewis's PAI Argument (Simplified)**:
     - Suppose \( x \) exists in worlds \( w_1 \) and \( w_2 \).
     - In \( w_1 \), \( x \) has intrinsic property \( P \) (e.g., *being 6ft tall*).
     - In \( w_2 \), \( x \) has intrinsic property \( \neg P \) (e.g., *being 5ft tall*).
     - If \( P \) and \( \neg P \) are intrinsic, \( x \) cannot coherently have both *simpliciter*.
     - **Conclusion**: To avoid contradiction, TWI must relativize \( P \)-having to worlds (e.g., "\( x \)-at-\( w_1 \) has \( P \)"). But this makes \( P \)-having a *relation* (to a world), undermining its intrinsicality.

  4. **Lewis's Solution (CT)**:  
     No object exists in multiple worlds. Instead, \( x \) in \( w_1 \) has a *counterpart* \( y \) in \( w_2 \) that is similar to \( x \) but numerically distinct. \( y \) (not \( x \)) has \( \neg P \) in \( w_2 \).

  ---

  ### **The Case for RTWI: Neutralizing PAI**
  #### **Step 1: Relativization Without Relationality**
  The RTWI advocate accepts that properties are instantiated *relative to a world* but denies this reduces intrinsics to relations. Crucially:  
  - **Relativization ≠ Relationality**:  
    To say "\( x \) has \( P \) in \( w \)" is not to ascribe a relational property to \( x \) (e.g., *bearing-P-to-w*). Rather, it indexes the *circumstance of instantiation*.  
    *Analogy*: Temporal relativization. When we say "Socrates was sitting at \( t_1 \)", we don’t treat *sitting* as a relation to time. We recognize that *having properties* is contingent on temporal location—yet *sitting* remains intrinsic because, *at \( t_1 \)*, it depends only on Socrates. Similarly, in RTWI:  
    - At \( w \), \( P \)’s instantiation by \( x \) depends only on \( x \)’s state *in \( w \)*.  
    - No external entity (e.g., another object, a "world") is constitutively involved in \( x \)’s having \( P \) *in that world*.  

  #### **Step 2: Intrinsicality is World-Relative**
  Lewis defines intrinsics *within* a world. For RTWI:  
  - A property \( P \) is intrinsic *at \( w \)* iff for \( x \) in \( w \), \( x \) has \( P \) solely in virtue of how \( x \) is *in \( w \)*.  
  - **Crucial Point**: Modal relativization (to worlds) doesn’t alter this. The definition above is consistent with \( x \) having \( P \) in \( w_1 \) and \( \neg P \) in \( w_2 \), provided that *in each world*, the property’s instantiation is world-internally intrinsic.  

  #### **Step 3: Lewis's Inconsistency**
  Lewis’s own view *requires* analogous relativization:  
  - In CT, *de re* modal claims (e.g., "I could have been shorter") are analyzed as:  
    > "In some world \( w \), there exists a counterpart \( y \) of me (in the actual world \( \alpha \)) such that \( y \) is shorter."  
    - Here, *being a counterpart* is explicitly relational: \( y \) bears the counterpart relation \( C \) to me-in-\( \alpha \).  
  - But \( C \) is relativized twice over:  
    - (i) To a *world* (the world where \( y \) exists).  
    - (ii) To a *contextually determined similarity standard* (Lewis, *PoW*, p. 252).  

  Thus, CT replaces property-relativization with *counterpart-relativization*, which is equally (if not more) problematic for intrinsicality.

  ---

  ### **Why CT Fares Worse on Relativization**
  #### **Problem 1: Similarity is Extrinsically Grounded**
  - In CT, whether \( y \) is a counterpart of \( x \) depends on extrinsic factors:  
    - The global distribution of properties in \( y \)’s world and \( x \)’s world.  
    - Contextual standards (e.g., which properties are "weighted" for similarity).  
  - **Consequence**: The property *could have been shorter* is not intrinsic to me. It depends on:  
    - The existence of a suitable \( y \) in another world.  
    - How we choose to compare worlds.  
  - **RTWI Advantage**: *Could have been shorter* remains a property of *me*, grounded solely in my own modal profile across worlds—not in relations to other entities.

  #### **Problem 2: Contextual Relativization Undermines Objectivity**
  - Lewis admits the counterpart relation \( C \) is context-sensitive:  
    > "What makes for resemblance [is] determined by the context" (*PoW*, p. 256).  
  - **Result**: Whether I "could have been shorter" has no objective answer. It depends on conversational standards.  
  - **RTWI Reply**: While RTWI relativizes properties to worlds, this indexing is objective and invariant. If \( x \) has \( \neg P \) in \( w \) (under TWI), this is a mind-independent fact.

  #### **Problem 3: Relocation, Not Resolution**
  - PAI arises because accidental intrinsics require *non-absolute instantiation*.  
    - RTWI handles this by indexing instantiation to worlds.  
    - CT handles it by shifting properties to counterparts via similarity relations.  
  - **Key Symmetry**: Both views relativize—but CT’s relativization is *more metaphysically costly*:  
    - RTWI: Relativizes *instantiation* of intrinsics.  
    - CT: Relativizes *identity conditions* (via similarity) and *modal properties* (via counterparts).  
    If Lewis objects to RTWI’s "disguised relations", CT’s counterpart relation is an *explicit*, context-bound relation that does the same work.

  ---

  ### **Formal Summary: Why PAI Doesn’t Favor CT**
  Let \( P \) be an accidental intrinsic property (e.g., *being 6ft tall*).  
  - **In RTWI**:  
    - \( \square \forall x \forall w (x \text{ has } P \text{ in } w \rightarrow \text{the having of } P \text{ by } x \text{ in } w \text{ is intrinsic-at-}w) \).  
    - *Explanation*: At \( w \), \( x \)’s height depends only on \( x \)-as-it-is-in-\( w \).  
  - **In CT**:  
    - "\( x \text{ could have had } \neg P \)" is true iff \( \exists w \exists y (C(y, x) \land y \text{ has } \neg P \text{ in } w) \).  
    - Here, \( C(y, x) \) (counterparthood) is a relation holding between distinct objects across worlds, grounded in extrinsic similarity.  
  - **Conclusion**:  
    PAI is equally a problem for both views. RTWI relativizes the *instantiation* of intrinsics to worlds; CT relativizes *modal predication* to a context-dependent relation. Neither avoids relativization—but RTWI preserves intrinsicality *within* worlds more cleanly, while CT introduces extrinsic constraints on identity and modality.  

  ---

  ### **Why This Addresses Your Concerns**
  1. **Relativization ≠ Abandoning Intrinsicality**:  
     RTWI’s world-indexing is no more a "relation" than temporal indexing—it specifies the *condition* under which a property holds. Intrinsicality remains defined world-internally.  
  2. **CT Relocates the Problem**:  
     By making modal properties depend on cross-world relations (counterparthood), CT doesn’t solve PAI; it buries it under a similarity relation that is itself context-bound and extrinsic.  

  Lewis’s argument only succeeds if we conflate *indexing* with *relationality*—but the RTWI view, carefully articulated, shows this conflation is unnecessary. Your physics-trained intuition is correct: CT’s "solution" merely shifts the locus of relativization without a net gain in metaphysical economy.
