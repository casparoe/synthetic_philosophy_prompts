answer: |-
  ## The Basil and the Void: Why Omissions Are Real Causes

  The wilted basil on your windowsill isn't just a culinary tragedy; it's a philosophical battleground. Your friend champions a view echoing David Hume and strict event ontologists: causation requires a positive *event* – a push, a pull, a transfer of energy. An omission – the housesitter *not* watering the plant – is merely an absence, a non-event. How can nothingness *cause* anything? Furthermore, her slippery slope argument seems potent: if *not*-watering by the housesitter caused the death, then logically, *every* entity in the universe who failed to water it (your mom, the mailman, a farmer in Mongolia) equally caused it. This absurdity suggests "causation by omission" is just sloppy shorthand, perhaps masking normative judgments about duty ("she *should* have watered it") or expectations, not objective physical causation.

  **This critique is powerful but ultimately fails. Omissions *can* be genuine causes, and we can defend this without collapsing into absurdity or sacrificing objectivity.** Here's the resolution:

  1.  **Causation as Counterfactual Dependence:** Modern philosophy (drawing on Lewis, counterfactual theories) often views causation through the lens of **dependence**: Event C causes event E if and only if, had C not occurred, E would not have occurred (or its probability would have been significantly lower). Apply this to the basil:
      *   **Actual World:** Housesitter omits watering --> Basil dies.
      *   **Counterfactual World:** Housesitter *waters* the plant (omission does *not* occur) --> Basil *lives* (with high probability).
      *   **Conclusion:** The basil's death counterfactually depends on the housesitter's omission. Had she watered it (preventing the omission), the death would likely have been prevented. This dependence is an objective fact about the physical world and the plant's biological needs. Water is necessary for survival; its sustained absence causes cellular breakdown. The omission *is* the mechanism ensuring that necessary condition remained unmet.

  2.  **Solving the Slippery Slope: Relevance and Expected Interventions:** The "everyone caused it" problem arises only if we naively equate *all* failures to act. The solution isn't retreating to subjective norms but recognizing **contextual relevance** grounded in physical and practical reality:
      *   **Causal Preemption/Overdetermination is Rare:** In the *actual* chain of events, the basil died because it received no water. While *hypothetically* your mom *could* have intervened, she didn't. Her non-action didn't *preempt* the housesitter's non-action; both non-actions existed, but only one was *salient* to the actual outcome given the setup.
      *   **The "Normal Course" as a Physical Baseline:** The mail carrier or Mongolian farmer had no *physical connection* or *practical possibility* of watering *your* basil. Their "omission" isn't a relevant alternative in the counterfactual scenario because their intervention was never part of the baseline physical circumstances. The dependence test fails for them: Had the mail carrier watered it (an event wildly outside the normal course), the plant *might* have lived, but it also *might* not have (he might have drowned it, been denied entry, etc.). Crucially, the housesitter's watering was the *expected and physically proximate intervention* within the actual situation.
      *   **Focus on the Actual Preventer:** The cause isn't just *any* omission, but the omission *that allowed a specific destructive process to complete unimpeded*. The destructive process (dehydration) was actively underway. The housesitter's omission was the *specific failure* to execute the expected, necessary intervention that would have halted that process. The others weren't positioned to be that preventer.

  **The Verdict: Omissions *Are* Genuine Causes**

  Your basil died *because* the housesitter failed to water it. This is not merely loose talk. It is an objective fact about counterfactual dependence and the physical necessity of water for plant survival. The housesitter's omission was the crucial link allowing the dehydration process to run its lethal course. It was a genuine cause.

  However, your friend is right about one thing: **not every omission is relevant.** The "slippery slope" is avoided not by denying omissions as causes, but by rigorously applying the counterfactual test within the actual physical and practical context. We ask: "In this specific scenario, with these specific agents and processes, would the outcome have been different if *this specific person* had acted?" For the housesitter, the answer is "Yes." For the mail carrier or Mongolian farmer, given the lack of physical access, expectation, or practical possibility within the actual world, the answer is "No, their action was not a relevant alternative possibility." Their non-actions are not causes; they are merely background conditions.

  Duties and norms *identify* *which omissions we care about morally or legally*, and often *explain why someone was expected to act*, but they don't *create* the underlying causal relationship. The causal power of the omission lies in the objective counterfactual dependence and the physical consequences of the absent necessary condition. The housesitter’s failure wasn't just a social faux pas; it was the physical reason your basil turned to dust. Absence, in this precise, contextually relevant sense, *can* make a deadly difference.
