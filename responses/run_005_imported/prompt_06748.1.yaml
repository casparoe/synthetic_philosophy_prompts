  I should contrast both interpretations starkly. The role ethics angle would make the magistrate more certain, while the universal virtue reading allows for haunting doubt. Both are academically defensible, so I'll present textual evidence for each:

  For role ethics:
  - Analects 13.18 shows virtue is relational, not abstract
  - The "conceal = upright" phrasing is categorical
  - Filial piety (孝) as root virtue in 1.2

  For universal honesty:
