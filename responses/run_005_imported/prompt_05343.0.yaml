  **Breakdown of Scores:**

  1.  **Denny (-1):** While *technically* correct about control, he fundamentally misunderstands emotional genesis. Real emotion absolutely *can* arise from controlled imaginative acts (e.g., crying during therapy role-play, feeling dread while planning a difficult conversation). Calling it *only* "skilled make-believe" ignores the neurobiological reality of empathy and the power of sustained imaginative immersion. His actor analogy fails because *your* immersion isn't performance for an audience; it's private engagement with your own creation.

  2.  **Oksana (2):** She correctly identifies the core mechanism: **vivid mental simulation**. Whether encountering a fixed outcome (rereading) or actively constructing one (writing), the emotional power stems from the depth of imaginative engagement with the scenario's inherent sadness/loss. The *source* of the scenario (memory vs. creation) is secondary to the *simulation* itself. This directly explains your experience.

  3.  **Denny (-2):** His distinction is irrelevant *in the moment of feeling*. While you *possess* the technical ability to rewrite later, **at the precise moment you wrote the death scene**, your focus was on simulating the *reality* of that event *within the narrative world you were immersed in*. The "live option" exists *outside* that immersion. His argument confuses **authorial power over the text** with **psychological immersion in the narrative**. While writing the scene, you weren't thinking "I can undo this"; you were thinking "Marta is dying *now*".

  4.  **Oksana (2):** She dismantles Denny's core assumption. **Real emotion does NOT require future uncertainty.** Regret, nostalgia, grief for historical figures, or even bittersweet joy about a past happy event you *know* is gone forever – all are profound emotions triggered by fixed, unchangeable pasts (real or fictional). The feeling arises from contemplating the *content* and *meaning* of the event, not its mutability. Your tears were for the *fact* of Marta's death within her story's reality, not its potential reversibility in your drafts.

  **What Both Are Missing:**

  Neither fully addresses the **unique nature of creator immersion**. As the author, you aren't *just* a reader or an actor playing a part. You are:

  1.  **The Architect of the Grief:** You built Marta, her relationship with the protagonist, the world, and the circumstances leading to her death over *years*. Your grief isn't just for the character's death; it's also for the **loss of potential future interactions *you* could have written for her**, the silencing of a voice *you* gave life to. It's mourning the end of a specific creative possibility within your own mind.
  2.  **Experiencing Narrative Inevitability:** While you *chose* the death, during the writing process, that choice often transforms into **narrative necessity** within the logic of the story you've built. At the moment of writing, it likely *felt* like the *only* outcome that fit the characters and plot you'd developed. The grief stems partly from confronting that perceived inevitability head-on.
  3.  **The Depth of Sustained Investment:** Three years of development creates profound neural pathways. Marta existed as a complex entity in your mind. "Killing" her isn't just deleting words; it's terminating a deep, sustained mental simulation you've nurtured. The emotional response is commensurate with that depth of investment and the act of consciously terminating it, regardless of authorial control. It's the difference between imagining a stranger's death and imagining the death of someone you've mentally "lived with" for years.

  **The Verdict:** **Oksana wins decisively.** Her core argument – that vivid simulation of a sad event, regardless of its origin or fixity, generates real emotion – accurately explains your experience, rereading, and fundamental human emotional responses to fiction and fixed pasts. Denny's reliance on the necessity of uncertainty or lack of control is philosophically and psychologically unsound, as demonstrated by countless examples of genuine emotion felt about unchangeable outcomes. Your tears were real grief for the loss of a being who lived vividly in your imagination.
