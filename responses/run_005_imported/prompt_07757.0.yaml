answer: |-
  You've articulated the "problem of old evidence" perfectly, and your seminar is tackling a genuine and profound challenge for Bayesian confirmation theory (BCT). **Yes, the strict mathematical consequence you describe is correct: If P(E) = 1 for an agent *before* considering hypothesis H, then conditionalizing on E cannot raise P(H).** This seems to imply that Mercury's perihelion precession couldn't have confirmed GR for scientists in 1915 who already knew E with certainty.

  **However, this conclusion clashes dramatically with scientific practice and intuition.** Physicists and historians are *not* confused. The Mercury anomaly *was* (and is) powerful confirmation for GR. So, what gives? The problem isn't with scientific judgment; it's with a limitation of the *naive, literal application* of the standard Bayesian framework to historical cases of known evidence. Philosophers have proposed several ways to resolve this tension:

  1.  **The Counterfactual Credence Approach (The Most Common Solution):**
      *   **Core Idea:** We shouldn't consider the agent's *actual* prior credence P(E) at the moment H is proposed. Instead, we should ask: What would the agent's credence in H have been *if they had not known E* (or hadn't considered its relevance), *and then* learned E?
      *   **Application:** Imagine Einstein (or any physicist) in 1915 *before* knowing about the Mercury anomaly (or before recognizing its significance for gravitational theories). In that counterfactual state of ignorance (P(E) < 1), GR *would* predict E. Learning E in that state *would* dramatically increase P(GR) because:
          *   GR entails E (or makes E highly probable).
          *   No other viable theory at the time (Newtonian gravity + plausible auxiliaries) could explain E.
          *   Therefore, P(GR | E) >> P(GR) in the counterfactual scenario where E is novel.
      *   **Why it makes sense:** This captures the *explanatory power* of GR. The reason scientists point to Mercury is *not* that learning it *again* in 1915 boosted their credence (it didn't, as P(E)=1), but that GR *explains* a known, stubborn anomaly that defied all previous solutions. BCT needs to model this explanatory virtue, and the counterfactual approach is its best tool.
      *   **Challenges:** Defining the precise counterfactual state ("ignorance") and the priors within it can be tricky. How much background knowledge is retained? How do we formally represent "not knowing E"? Despite these challenges, this is widely seen as the most promising solution.

  2.  **Changing the Hypothesis or Auxiliaries:**
      *   **Core Idea:** When H is proposed, learning E isn't just learning raw data; it's learning that H *entails* E (or makes E highly probable), *given the agent's background knowledge K*. This logical/structural relationship itself can be new information.
      *   **Application:** In 1915, physicists knew E (Mercury's precession). What they *didn't* know was that GR entailed E. Learning *that GR entails E* (call this proposition L) *is* new evidence, even if E itself is old. Crucially, P(L) < 1 before understanding GR. Learning L *should* raise P(GR).
          *   Formally: P(GR | L) > P(GR), and P(L) < 1 in 1915 before GR was understood.
      *   **Why it makes sense:** It reflects the cognitive process: "Wow, this new theory actually *explains* that thing we could never figure out!" The confirmation comes from seeing the *connection* between H and E.
      *   **Challenges:** It requires careful formulation to avoid triviality or circularity. Defining L precisely ("GR entails E relative to background knowledge K") is essential.

  3.  **Reinterpreting "Learning E":**
      *   **Core Idea:** "Learning E" in the context of confirmation might sometimes mean *re-evaluating E in light of H*, rather than literally acquiring E as new data. The act of seeing E *as a consequence of H* provides the confirmation.
      *   **Application:** Scientists in 1915 "re-learned" Mercury's precession *as evidence for GR*. The Bayesian update reflects not the acquisition of E, but the realization of its significance *given H*.
      *   **Why it makes sense:** It captures the "Aha!" moment of seeing old data in a new light.
      *   **Challenges:** This stretches the standard Bayesian notion of "conditionalization on evidence" the most. It's more of a descriptive account than a formal solution within standard BCT.

  4.  **Questioning the Certainty of Old Evidence:**
      *   **Core Idea:** Was P(E) *truly* exactly 1 for physicists before GR? Might there have been lingering, unquantified doubts about the data, its interpretation, or the auxiliaries used to derive it? If P(E) < 1 (even slightly), then conditionalizing on E *could* technically raise P(H).
      *   **Application:** Perhaps, despite decades of acceptance, the precise value of the anomaly or the completeness of the Newtonian calculations weren't held with *absolute* certainty (P(E)=1). Learning that GR predicted the *exact* value could then slightly increase confidence *both* in E and in GR.
      *   **Why it makes sense:** Absolute certainty (P=1) is rare in science. GR's prediction arguably solidified confidence in the Mercury data itself.
      *   **Challenges:** This feels like a bit of a dodge. The anomaly was extremely well-established. The *primary* confirmatory power comes from GR *explaining* it, not from marginally increasing confidence in the data's existence. It doesn't capture the core intuition.

  **Conclusion & Answering Your Questions:**

  *   **Is "no confirmation from old evidence" a strict consequence of the Bayesian math?** Yes, if you rigidly apply the standard definition (P(H|E) > P(H) requires P(E) < 1) to the agent's *actual* credence state at the time H is proposed, where P(E)=1.
  *   **Does this mean scientists/historians are confused about Mercury?** **Absolutely not.** The Mercury anomaly is rightfully considered a classic confirmation of GR.
  *   **Should only novel predictions like the eclipse count as "real" Bayesian evidence?** **No.** The problem highlights a **limitation in the naive application** of BCT, not a flaw in scientific judgment. Novel predictions are *one powerful way* evidence confirms, but the explanatory power of a theory over *known* anomalies is equally important.
  *   **Is Mercury's status demoted to mere rhetoric?** **No.** It's genuine confirmation. The challenge is for BCT to *model* this type of confirmation adequately.
  *   **Where does the argument go wrong?** The argument doesn't "go wrong" mathematically. **The issue is that the standard Bayesian formulation is too simplistic to capture the full richness of scientific confirmation, particularly the confirmatory power of explaining existing, well-established but theoretically anomalous evidence.** It fails to account for the *counterfactual novelty* or the *explanatory connection*.

  **Philosophers' Take:** Glymour's problem is taken very seriously. Most agree the counterfactual approach (#1) is the most robust solution, though it has complexities. The entailment-learning approach (#2) is also well-regarded. The key insight is that BCT needs to be applied more subtly to historical cases, focusing on the *explanatory relationship* between H and E, not just the temporal sequence of learning. The Mercury case confirms GR not because scientists learned *that* it happened in 1915, but because they learned *why* it happened – and GR provided the compelling explanation that no other theory could. Good Bayesian models strive to capture this explanatory virtue.

  Your seminar is wrestling with one of the deepest challenges to making BCT a fully adequate descriptive *and* normative theory of scientific reasoning. The fact that you and your friend see the tension clearly shows you've grasped the core issue!
