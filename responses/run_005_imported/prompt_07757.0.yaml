  The user's main concern is whether the Bayesian approach invalidates the Mercury case as genuine confirmation. Their friend disagrees, but they can't resolve the contradiction. I should consider why the Mercury case is still seen as confirmatory. Maybe it's about how scientists perceive the evidence in relation to the theory. 

  I remember that philosophers like Clark Glymour highlighted this problem. Solutions often involve counterfactual reasoning. For instance, what would our credence in GR be if we didn't know about Mercury? If P(H|E) > P(H) in that scenario, then E confirms H. But this requires imagining a state of ignorance, which is tricky because our current knowledge influences our priors. 

  Another approach is to adjust the hypothesis. GR entails E, so if we didn't know E, learning it should boost H. But since E is already known, we simulate that learning process. The challenge is formalizing this without contradictions. 

  The user might also be interested in the broader implications. If Bayesianism can't handle historical cases, does that undermine its validity? Or is it a limitation that needs tweaking? Philosophers have proposed various solutions, like changing priors or distinguishing between logical and epistemic probabilities. 

