answer: |-
  Here's a toast weaving those Keynesian ideas authentically, honoring their intellect without losing the heart, and staying under 400 words:

  ---

  **(Raising glass, warm smile)** Hi everyone. For those who don’t know me, I’m [Your Name], the bride’s significantly less economically literate little brother.  

  [Sister], remember back in 7th grade, when I was complaining about soccer and homework? You introduced me to this essay by Keynes – "Economic Possibilities for our Grandchildren." He predicted that one day, thanks to incredible productivity and machines, we’d finally solve "the economic problem." We wouldn't *have* to grind just to survive. But then, he asked this profound question: What will we do with all that freedom? How will we *live* well, when we’re not programmed just to work?

  **(Turning to the couple)** You two spend your days professionally studying money, growth, and scarcity – the very engines of that future Keynes imagined. You’re helping solve the "economic problem" for all of us. That’s amazing.  

  **(Pause, more intimate)** But that essay wasn’t the only one you told me about. There was another, where Keynes talked about his artist and philosopher friends, like G.E. Moore. They argued that very few things are truly good *in and of themselves*. Most things – money, status, ambition – they’re just *means*. Useful tools, sure, but not the real point. The things that are genuinely good all by themselves? Love. Deep friendship. Beauty. The joy of connection.  

  **(Looking between them)** And that’s why today feels so perfectly full-circle. Because standing right here, in front of everyone who loves them, [Sister] and [Fiancé] aren't just brilliant economists studying the *means*. They’re actively living the ultimate *end*.  

  **(To the couple)** Your careers are about mastering the machinery of the world. But this? This commitment you’re making today? This is the answer to Keynes’ worry. *This* is how you spend true freedom. *This* – the love, the partnership, the deep friendship you’ve built – is the intrinsic good that all the economics, all the productivity, all the hard work, is ultimately *for*.  

  **(Raising glass higher)** So, to [Sister] and [Fiancé]: May your life together be filled with the profound beauty and love that Keynes knew was the only real point of it all. Cheers!

  ---

  **Why it works:**

  1.  **Accurate & Respectful Econ:** Uses Keynes' core ideas correctly:
      *   "Economic Possibilities" as solving scarcity but posing the problem of leisure.
      *   Moore's influence (via "My Early Beliefs") on intrinsic goods (love/beauty) vs. instrumental goods (money/ambition).
      *   "Means vs. Ends" is the central, accessible framework. Economists will nod at the precise terminology used appropriately.
  2.  **Meaningful Connection:** Directly ties their profession (studying the *means*) to their marriage (living the *end*). It elevates their love *because* of their profession, not in spite of it.
  3.  **Accessible:** Explains concepts simply ("solve the economic problem," "things good in themselves," "means vs. ends") without jargon. Grandma gets the sentiment about love being the point.
  4.  **Personal & Moving:** Grounded in a real memory with the sister. The core message – that their love is the *answer* to the deeper question Keynes posed – is genuinely heartfelt.
  5.  **Concise:** ~320 words. Fits comfortably in 2-3 minutes.
  6.  **Avoids Pitfalls:** No mangled arguments. No lecture. The economics serves the emotional tribute, not the other way around.

  **Delivery Tip:** Speak slowly, warmly, and make eye contact with your sister and her partner, especially during the lines directly addressing them. Let the sincerity shine through. You’ve got this!
