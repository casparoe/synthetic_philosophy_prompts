answer: |-
  ## MEMORANDUM  
  TO: Research Integrity Committee  
  FROM: [Your Name], Committee Member  
  DATE: 20 October 2023  
  SUBJECT: Recommended Actions Regarding Fabricated Data in [Journal Name, Paper Title]  

  ### I. Case Summary
  An external review identified image irregularities in Figures [X] and [Y] of the above-referenced 12-author paper. Subsequent investigation confirmed fabrication of the underlying data by Dr. [Postdoc's Name], the postdoctoral researcher who performed the experiments. Dr. [Postdoc] has admitted to fabrication. All other authors, including the corresponding PI, Dr. [PI's Name], assert they neither saw the raw data nor suspected misconduct. The paper must be retracted, and Dr. [Postdoc] faces a misconduct finding. The committee must determine appropriate actions for co-authors.

  ### II. Core Principle & Anticipated Objection
  **Principle:** Authorship is a *formal commitment to the integrity of the entire work*, as codified in university policy and journal guidelines (e.g., ICMJE), not merely an attribution of contribution. This creates shared accountability for verification within the author group.  
  **Objection:** Holding authors accountable for fabrications they did not cause or know about constitutes "guilt by association," discouraging collaboration by incentivizing risk management over trust.  
  **Response:** We acknowledge this cost. Imposing accountability where knowledge/causation is absent *can* create caution that may impede collaboration. **However, the greater cost of *not* upholding this standard is the erosion of collective trust in scientific authorship.** If senior authors bear *no* responsibility for the integrity of work carrying their name and authority, the credibility of the entire publication system weakens. The "cost" of caution is outweighed by the necessity of maintaining trust through meaningful accountability structures tied to the privilege of authorship. Responsibility flows not *only* from individual action/knowledge, but also from the *role-based duty* inherent in claiming authorship.

  ### III. Role-Differentiated Recommendations & Rationale

  1.  **Dr. [Postdoc's Name] (Postdoc):**
      *   **Recommendation:** Formal finding of research misconduct (Fabrication/Falsification). Initiate university misconduct procedures per policy (likely resulting in sanctions up to/dismissal). Mandatory retraining in research ethics and data management. Requirement to co-sign the retraction notice acknowledging misconduct.
      *   **Rationale:** Direct causation and admission of fabrication warrant the strongest response under misconduct policies.

  2.  **Mid-List Co-Authors (Other 10 Authors):**
      *   **Recommendation:** Formal Letter of Concern placed in personnel/academic files. Mandatory completion of a targeted, short course on "Authorial Responsibility & Data Verification in Collaborative Research" within 90 days. Requirement to co-sign the retraction notice.
      *   **Rationale:** While they plausibly lacked direct access/knowledge, their authorship signifies a commitment to the work's integrity. Accepting final manuscript approval without verifying critical data underlying central figures they endorsed represents a failure in their authorial duty ("failure to ensure"). The Letter of Concern and training address this lapse proportionally, emphasizing the *responsibility* aspect of authorship without equating it with misconduct. It signals that passive reliance is insufficient.

  3.  **Dr. [PI's Name] (Corresponding Author / PI):**
      *   **Recommendation:**
          *   Formal Letter of Censure from the Vice Provost for Research placed in their personnel file.
          *   Mandatory external review of lab data management & verification practices, with implementation plan due within 60 days.
          *   Mandatory completion (and verification) of an advanced course on "Supervision, Mentorship, and Research Integrity Assurance" within 90 days.
          *   Requirement to lead the retraction process and co-sign the notice.
          *   Bar from serving as corresponding author on university submissions for 12 months.
      *   **Rationale:** The PI holds the ultimate supervisory and corresponding author role. They designed the study, secured funding, supervised the lab, and reviewed/approved the final manuscript. While they did not fabricate data or knowingly rely on it, **this role carries heightened responsibility for ensuring robust systems exist to *prevent* and *detect* fabrication.** Relying solely on trust without adequate verification mechanisms for critical results bearing their name constitutes a significant failure in their stewardship role. The censure and sanctions reflect the seriousness of this systemic failure tied directly to their unique position of authority and trust. The "cost" of accountability here is justified by the need to reinforce that PIs cannot delegate *all* responsibility for data integrity while claiming full authorship credit and authority.

  ### IV. Conclusion
  Retracting the paper and addressing the postdoc's misconduct are necessary but insufficient. Upholding the meaning of authorship requires proportionate actions reflecting the distinct responsibilities of all signatories. These recommendations balance accountability for the specific failures identified at each level against the severity of the misconduct and the roles played. They aim to uphold institutional standards, restore trust, and provide concrete paths for remediation, while directly confronting the legitimate concern about "guilt by association" by grounding accountability in the specific duties inherent to each authorial role.
