  For epistemic trust... I think the key is recognizing different failure modes. Machine proofs eliminate human reasoning errors but embed our assumptions in code. Traditional proofs allow deeper conceptual scrutiny but are vulnerable to human error. The user might appreciate concrete examples - like how Four Color Theorem verification trades conceptual transparency for certainty.

  The physical implementation point feels particularly important. Hobbes' geometry existed purely in thought, but Lean runs on silicon. This forces us to confront computer science truths: type checkers are small TCBs, but still subject to cosmic rays or compiler bugs. Still, for practical certainty, the mechanized proof seems superior.

