  3) **Epistemic vs Ontic**: The hydrogen case actually pushes beyond Worrall's epistemic version. When the electron's orbit vanishes but quantum numbers persist as eigenvalues, it suggests these mathematical features aren't just how we know reality (epistemic) but constitute what there is (ontic). Their alkali atom work reinforces this - quantum defects turned out to reflect boundary conditions in scattering theory, i.e., structural features of the Hamiltonian.

