prompt: |-
  I'm about a third of the way into a generation-ship novel, and one of my favorite threads is how the descendants of the original crew end up with all these little unwritten rules that nobody ever voted on — which side of the main corridor you walk down, how you queue outside the hydroponics bay, who gets to speak first at the monthly assembly. My editor pointed me toward David Lewis's old book on convention as research (I was a lit major, so game theory is not exactly home turf for me), and it's honestly been great for showing how a rule like that can just solidify out of repeated coincidence and everyone expecting everyone else to keep doing it, rather then some founding committee sitting down and deciding it on day one.

  Here's where I've talked myself into a corner, though. Lewis is pretty insistent that a convention is arbitrary — some other regularity, like walking on the left instead of the right, would've worked exactly as well. Which seems to mean that since nobody on my ship actually has a real stake in a custom being one particular way rather than another, switching it should be pretty painless the second somebody points out the alternative works just as fine — there's no vested interest to overcome, just habit. I'd originally written a subplot where a young reformer has to fight a whole political battle to get one of these customs changed, but now I'm wondering if I should cut that and just have her point out the arbitrariness and let the ship adopt the new rule within a scene or two, since that's presumably what the theory predicts. Does that track, or is there some reason arbitrary conventions might actually be hard to shift even when literally nobody disagrees that the new one is just as good?
reasoning: |-
  Okay, the user is writing a generation-ship novel and has a subplot about changing unwritten rules. They referenced David Lewis's convention theory, which says conventions are arbitrary and should be easy to change since no one has a stake in them. The user originally had a political battle for change but now thinks maybe it should be quick. They're wondering if their subplot is unrealistic and if they should change it.

  First, I need to recall Lewis's definition. Conventions are solutions to coordination problems where the rule is arbitrary. But the user is missing something: conventions aren't just habits; they're tied to expectations. Even if everyone agrees the rule is arbitrary, changing it requires everyone to coordinate on the new rule simultaneously. That's hard because people expect others to follow the old one.

  The user's confusion might stem from thinking arbitrariness equals easy change. But in reality, the effort to coordinate change is a barrier. The ship's society has layers: identity, tradition, signaling group membership. Changing a convention might feel like losing part of their culture. Also, the reformer challenging norms might be seen as disruptive, causing resistance even if the rule itself isn't important.

  I should consider psychological factors: status quo bias, loss aversion. People prefer familiar rules. Also, conventions become rituals, providing comfort in a closed environment. The reformer's role might threaten elders or those invested in the existing order. Even if the rule is trivial, defending it maintains their authority.

  The user might need to show why change is difficult despite arbitrariness. Examples: needing critical mass to switch, social friction, or the reformer's approach causing backlash. The subplot could highlight how change management is tricky in isolated societies. The user’s deeper need is likely to maintain conflict for narrative tension while staying theoretically sound. So, advising to keep the political battle but ground it in coordination challenges and social dynamics rather than the rule's inherent value.
answer: |-
  Your editor gave you excellent advice with Lewis, but you've hit on a crucial nuance: **Lewis's "arbitrariness" doesn't imply "ease of change."** In fact, the *very mechanisms* that create conventions (coordination, mutual expectations) are what make them surprisingly sticky, even when everyone intellectually agrees an alternative is just as good. Cutting the political battle entirely would likely *undermine* the realism Lewis helps you establish.

  Here's why the struggle makes perfect sense on your generation ship:

  1.  **The Coordination Problem Isn't Solved by Pointing:** Lewis defines conventions as solutions to recurring coordination problems. The *problem* isn't just knowing the rule, it's **aligning everyone's expectations simultaneously**.
      *   **The Reformer's Challenge:** She points out arbitrariness. Great. Now what? *Which* alternative does she propose? Left *or* right? Speaking first by age *or* seniority *or* lottery? Getting agreement on *which* arbitrary rule replaces the old one is itself a new coordination problem.
      *   **The Expectation Trap:** Everyone might agree the new rule is fine... *if* everyone else adopts it immediately. But *right now*, they expect others to follow the old rule. Deviating alone makes you look strange or disruptive ("Why is Amal walking on the *left*? Did they forget? Are they making a point? Should I switch too? But what if no one else does?"). Switching requires a critical mass to shift expectations simultaneously, which is hard to orchestrate.

  2.  **Conventions Become Embedded in Identity and "Tradition":**
      *   **The Weight of "The Way":** Over generations, the *arbitrary* origin is forgotten. The rule becomes "the way we do things," part of the ship's unique culture and identity. It's not just a rule; it's a **tradition**, a **ritual**, a marker of belonging. Changing it feels like erasing a piece of "Shipness," even if no one can articulate why it started.
      *   **Social Signaling:** Following the convention signals you're a reliable, predictable member of the community who understands the unspoken codes. Deliberately breaking it, even to propose a "better" arbitrary rule, signals rebellion, disrespect, or outsider status. The *act* of challenging becomes the issue, not the rule's content.

  3.  **Psychological Inertia and Status Quo Bias:**
      *   **Effort vs. Reward:** The old rule works *well enough*. Changing requires mental effort (learning, remembering), potential social friction, and carries the risk of the new rule *not* coordinating as smoothly initially. Why expend energy and risk chaos for zero functional gain? Humans have a strong bias towards the status quo.
      *   **Loss Aversion:** People feel the *potential loss* of the familiar (comfort, predictability, social cohesion) more keenly than the *potential gain* of an equally functional but unknown alternative. The perceived "cost" of change feels higher than the zero "benefit."

  4.  **Power, Authority, and Social Capital:**
      *   **Who Defines "Just as Good"?** Elders, committee heads, or informal leaders might feel their authority is tied to upholding existing norms. A young reformer challenging *any* convention, however arbitrary, can be seen as challenging *their* role or judgment.
      *   **Resistance as a Signal:** Defending the old rule, even an arbitrary one, can be a way for established figures to signal their commitment to stability, tradition, and their own leadership. The battle becomes about **who gets to define the rules of social coordination**, not the rule itself.
      *   **The Reformer's Motives:** Is she *just* proposing a functionally equivalent rule? Or is she using this as a wedge to challenge authority more broadly? Is she seen as seeking attention, causing trouble, or disrupting harmony? Her *persona* and *methods* become part of the equation.

  **How This Applies to Your Subplot:**

  *   **Keep the Struggle!** The political battle is *realistic* and dramatically rich. Lewis explains *why* the rule exists arbitrarily, not why changing it is easy.
  *   **Reframe the Conflict:** The battle isn't about the *inherent value* of walking left vs. right. It's about:
      *   **Overcoming Coordination Costs:** How do you get *everyone* to switch expectations at once? Does it need a formal vote? A trial period? A charismatic leader modeling the change?
      *   **Navigating Social Inertia:** Overcoming the "Why bother?" and "But we've always..." reactions.
      *   **Managing Perceived Threats:** Addressing the fear that changing *this* arbitrary rule opens the door to changing *other* (potentially less arbitrary) rules, or challenges established social structures.
      *   **The Reformer's Journey:** Her challenge isn't just logic; it's persuasion, coalition-building, managing backlash, and perhaps learning that changing culture requires more than just pointing out arbitrariness. She might face accusations of being disruptive, wasting time, or disrespecting elders/tradition.

  **Concrete Ideas for Your Scene/Subplot:**

  1.  **The "Critical Mass" Stalemate:** The reformer convinces many, but not enough to shift expectations. People agree in principle but keep following the old rule out of habit or fear of standing out. She needs a strategy to create a visible tipping point (e.g., organizing a mass "Switch Day," getting a respected elder to model the new behavior).
  2.  **The "Which Alternative?" Debate:** Agreement that the old rule is arbitrary leads to fractious debate over *which* new arbitrary rule to adopt, creating new factions where none existed before.
  3.  **The Unintended Consequence:** The change happens smoothly... but subtly disrupts other linked, unspoken conventions, causing minor chaos and fueling backlash ("See! We shouldn't have messed with it!").
  4.  **The Authority Challenge:** The real battle is with the Assembly Speaker or Hydroponics Bay foreman who sees the proposal as an affront to their role in maintaining order, regardless of the rule's content.
  5.  **The "It's Not *Just* the Rule" Realization:** The reformer learns her battle is less about the corridor side and more about proving she can be trusted to propose changes responsibly, or about giving younger generations a voice in shaping their environment.

  **Conclusion:** Lewis's arbitrariness is the *origin story*, not the *change mechanism*. On your generation ship, where these conventions are deeply woven into the fabric of daily life and social identity over centuries, changing even an arbitrary one requires navigating the powerful forces of coordination costs, social inertia, tradition, and power dynamics. **Your original subplot with the political battle is far more plausible and interesting than a swift, frictionless change.** Use Lewis to understand *why* the rule exists, but let the reality of human psychology and social coordination explain why changing it is hard work. The struggle *is* the story.
