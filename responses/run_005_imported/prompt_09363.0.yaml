prompt: |-
  I started attending RCIA classes at my parish this fall while I decide whether to formally convert, and a session two weeks ago left me more preoccupied with medieval political theology than I expected going in. The class had drifted, by way of a news segment about an attempted assassination of a foreign head of state, into a debate about whether the Church has ever sanctioned killing an unjust ruler, and our deacon said, more or less in passing, that Aquinas had settled the matter: a tyrant may licitly be killed, and whoever does the killing deserves praise. A couple of us thought this sounded too tidy to be the whole story, so afterward I tracked down what I assume he was half-remembering, from the Summa Theologiae's treatment of sedition (IIa–IIae, q. 42, a. 2). The article raises, as an objection it must answer, the claim that "it is praiseworthy to deliver a multitude from a tyrannical rule," adding that this can hardly happen "without some dissension in the multitude, if one part of the multitude seeks to retain the tyrant, while the rest strive to dethrone him," and concluding that sedition must therefore sometimes be free of mortal sin. Aquinas's reply is this:

  "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states (Polit. iii, 5; Ethic. viii, 10). Consequently there is no sedition in disturbing a government of this kind, unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government. Indeed it is the tyrant rather that is guilty of sedition, since he encourages discord and sedition among his subjects, that he may lord over them more securely; for this is tyranny, being conducive to the private good of the ruler, and to the injury of the multitude."

  I can follow each sentence individually, but I am struggling to turn this into anything as clean as what our deacon told the class. If a tyrannical government is simply unjust, why does Aquinas immediately hedge the permission to "disturb" it with a proviso that the resulting harm must be smaller than the harm of the tyranny itself — is he making the rightness of resistance depend on a kind of prudential forecast about outcomes, and if so, is that merely practical caution layered on top of an otherwise unconditional judgment, or is it actually built into what he thinks justice requires here? I am also unsure what "disturbing" a government is even meant to cover — does it stretch to killing the ruler personally, or is it closer to a general uprising or a rival faction's coup, with the killing of any particular person being a separate matter? This is where my confusion with the deacon's summary really starts, because I have also come across the claim that in his earlier commentary on Peter Lombard's Sentences, Aquinas praises someone who kills a tyrant who originally seized power by naked force, specifically when no higher authority remains to judge the usurper — which sounds like a narrower and more specific license than "any tyrannical government," and one exercised by a single person rather than by "a multitude" collectively unsettling things. Am I right that these are two distinct scenarios in Aquinas's thought, and if so, what would a more accurate one- or two-sentence summary of his actual view have been, instead of the version I let pass unchallenged in class?
reasoning: |-
  Okay, let me unpack this user's query. They're in RCIA classes, and a deacon mentioned Aquinas permitting the killing of tyrants. The user dug into the Summa Theologiae and found it more complex. They're confused about the deacon's simplification versus Aquinas's nuanced text.

  First, I need to recall Aquinas's actual arguments. In IIa-IIae q.42 a.2, Aquinas says tyrannical rule isn't just because it serves the ruler's private good. Disturbing such a government isn't sedition unless the harm exceeds the tyranny. But the user notes a contradiction with the deacon's summary. The user also found Aquinas's earlier work in the Sentences commentary, which allows killing a usurper when no higher authority exists. So there are two scenarios: one about disturbing unjust rule and another about killing usurpers.

  The user's main questions are: Why the hedging about harm? What does "disturb" entail? Are there two distinct scenarios? They want a concise summary of Aquinas's actual view. 

  Breaking down the harm proviso: Aquinas is integrating prudential calculus into justice. He's not just cautioning but making it a moral requirement. The end goal is the common good, so if the cure is worse, it's unjust. That explains the hedge. 

  Then, what does "disturbing" mean? The text mentions "dissension in the multitude," implying collective action like uprising or coup, not necessarily assassination. The Sentences commentary specifically addresses killing a usurper by an individual when no higher authority exists. So yes, two different scenarios. The Summa deals with overthrowing tyranny collectively, while the earlier work handles individual action against a usurper.

  The deacon's summary oversimplified by merging these scenarios and omitting the harm calculus. A more accurate summary would distinguish between killing a usurper without authority and the collective disturbance of tyranny with a harm assessment. Also, note that the Summa doesn't explicitly endorse killing the ruler.

  The user's deeper needs might include understanding how Church teachings handle political violence, especially as a potential convert. They might be grappling with the moral implications of such doctrines and seeking clarity on Aquinas's actual stance to reconcile it with their faith journey. Ensuring they see the nuance is key to avoiding misconceptions about Church endorsements of violence.
answer: |-
  You've identified a crucial nuance that your deacon oversimplified. Aquinas's position on resisting tyranny is neither an unconditional endorsement of assassination nor limited solely to usurpers. Here's a breakdown addressing your specific questions and offering a more accurate summary:

  1.  **The "Hedge" (Prudential Calculus):** Yes, Aquinas **absolutely integrates prudential outcome-based judgment into the justice of resistance**. It's not merely practical caution layered on top; it's fundamental to his understanding of justice and the common good. His reasoning is teleological:
      *   **End Goal:** The purpose of any act against tyranny is the restoration of justice and the common good.
      *   **Moral Requirement:** If the act of resistance (the "disturbance") inflicts *greater harm* on the common good than the tyranny itself, it becomes *unjust*. The cure cannot be worse than the disease. Justice demands that the act *actually serves* the common good, not just that it opposes an evil. This is a core Thomistic principle – actions are judged by their object, intention, *and circumstances*, including foreseeable consequences.

  2.  **The Meaning of "Disturbing" (Perturbatio):** Aquinas's language in *Summa Theologiae* II-II, q.42, a.2 is deliberately broad ("*perturbare*" - to disturb, throw into confusion, unsettle). It clearly **encompasses forceful resistance, including overthrow, rebellion, or uprising ("dissension in the multitude")**. The context is "sedition," which implies organized, potentially violent opposition by a faction or part of the populace. While it *could* theoretically include targeted killing as a *means* within this broader disturbance, **Aquinas does not explicitly single out assassination here.** His focus is on the legitimacy of the *collective act of resistance* against the unjust *regime*.

  3.  **The Two Distinct Scenarios:**
      *   **Scenario 1 (Summa Theologiae II-II, q.42, a.2): Resisting Established Tyranny:** This is the scenario you quoted. It applies to *any ruler who governs tyrannically* (for private gain, not the common good), regardless of how they came to power (inheritance, election, or even initial legitimacy turned corrupt). The permission to "disturb" this rule is:
          *   **Conditional:** Subject to the prudential calculus (harm caused < harm prevented).
          *   **Collective:** Framed as an action undertaken by part or all of the oppressed multitude ("*nisi forte sic inordinate perturbetur regnum tyranni... multitudo subdita plus nocumentum patiatur*").
          *   **Focus:** Legitimizing resistance to the *unjust regime*, not necessarily specifying the means.
      *   **Scenario 2 (Commentary on the Sentences, II, d.44, q.2, a.2): Killing a Usurper:** This is the earlier, more specific case. Aquinas argues it *can* be licit for a private individual to kill a tyrant who:
          *   **Seized Power Illegitimately:** A "*tyrannus in principatu acquisito per violentiam*" (tyrant who gained rulership through violence).
          *   **Lacks Legitimacy:** Has no claim to rightful authority.
          *   **No Higher Authority:** When there exists "*non est recursus ad superiorem iudicem*" (no recourse to a higher judge who can lawfully remove them).
          *   **Praiseworthy:** The killer may deserve "*praemium*" (a reward) if motivated by zeal for justice and the common good.
      *   **Key Difference:** This scenario specifically *authorizes lethal force by an individual* against a *very specific type* of tyrant (the usurper) under *very specific conditions* (no lawful recourse). It is narrower and more radical than the *Summa* passage.

  **A More Accurate Summary of Aquinas's View (Replacing the Deacon's):**

  > "Aquinas argued that resisting a tyrannical ruler (one governing for private gain, not the common good) is not inherently sinful sedition. However, such resistance is only morally licit if the harm caused by the disturbance is less than the harm inflicted by the tyranny itself. Furthermore, in a specific case where a tyrant seized power violently and there is no higher lawful authority to appeal to, Aquinas *did* argue that a private individual killing that usurper *could* be praiseworthy. These are distinct arguments with different conditions."

  **Why Your Deacon's Summary Was Problematic:**

  1.  **Overgeneralized:** He presented the *usurper* argument ("deserves praise") as if it applied to *all* tyrants.
  2.  **Omitted Crucial Conditions:** He ignored the "no higher authority" requirement for individual killing and, more importantly, the *prudential harm calculus* essential to the *Summa*'s argument against *any* tyrannical government.
  3.  **Oversimplified the "Disturbance":** He implied "killing" was the standard or only licit response, while the *Summa* text focuses on broader resistance ("disturbance") and the *Sentences* commentary specifies the highly restricted case for individual assassination of a usurper.
  4.  **Implied Universality:** His summary sounded like an unconditional principle, whereas Aquinas's arguments are heavily conditioned by circumstances, intention, and consequences.

  You were right to question it. Aquinas offers a sophisticated, nuanced, and conditional justification for resistance to tyranny, grounded in his core principles of justice, the common good, and prudence, but he does *not* offer a blanket endorsement of tyrannicide applicable to all unjust rulers in all circumstances. The distinction between resisting established tyranny (with conditions) and killing a usurper (under extreme conditions) is crucial.
