  We are ranking the responses to the undermining problem for Lewis's Principal Principle. The undermining problem arises because, under Humean supervenience, the chance of an event depends on the entire Humean mosaic, including future events. This leads to "undermining futures" where a future event, if it occurs, would make the current chance assignment false. The problem is that if you know the current chance is x, but also consider a future that would undermine that chance, your credence in the event should not be x, violating the Principal Principle.

  The goal is to rank the proposed solutions from best (S) to worst (F). We'll consider each option and assign it to a tier based on how successful it is at solving the undermining problem.

  1. **Lewis's New Principle**: This is the solution Lewis himself proposed. It modifies the Principal Principle by conditioning not only on the history up to time t and the chance theory at t, but also on the fact that the chance theory is the correct one. The New Principle says: your credence in A given the complete history up to t and the chance theory T (which assigns chances) should be the chance that T assigns to A conditional on T being true. This avoids the undermining problem because the undermining futures are those that make T false, and by conditioning on T being true, we exclude those futures. This is generally considered the most successful Humean response and has been defended by Hall and others. It's widely accepted among Humeans.

  2. **Give up Humean supervenience and go primitivist/propensity**: This approach avoids the undermining problem by denying that chance supervenes on the Humean mosaic. If chances are primitive propensities, then they are not undermined by future events. However, this is a major departure from Humeanism and is not a solution within the Humean framework. It's a rejection of the Humean project. While it solves the problem, it does so by abandoning the framework that generated it. For those committed to Humeanism, this isn't a solution; for others, it might be. But in the context of a seminar on Humean approaches, this is a non-Humean alternative. It's a genuine solution to the problem but not within the Humean paradigm.

  3. **Rule undermining information inadmissible by fiat**: Lewis originally considered admissibility conditions. The Principal Principle says that if you know the chance of A is x, and you have no inadmissible evidence, then your credence in A should be x. One could try to declare that undermining information is inadmissible. But this seems ad hoc and lacks a deeper justification. Moreover, it's not clear why such information would be inadmissible when it is, in fact, relevant to the truth of the chance claim. This move is generally seen as unsatisfying and not well motivated.

  4. **Deny that undermining futures are possible**: This would involve arguing that, given the actual chances, undermining futures have zero chance and hence are impossible. But this doesn't work because, under Humeanism, the chance of an undermining future might be non-zero, and it is compatible with the current chance assignment. To say they are impossible would require a non-Humean necessitarianism about chance, which is not available to the Humean. This move is not taken seriously because it contradicts the Humean view that the future is contingent.

  5. **Iterated, two-level approach**: This idea involves considering the chance of the chance. For example, one might try to use a higher-order chance to handle the undermining. However, this can lead to regress and complications. It's not clear that this approach has been worked out successfully. Some attempts (like Hall's 1994) lead to the New Principle anyway. This might be seen as a step towards the New Principle but not as a standalone solution.

  6. **Weaken the Principal Principle**: Instead of requiring that credence equal chance, one might require only that they be close, or that we defer to typical chances. This is a significant weakening and may not capture the full force of the Principal Principle. It also might not fully resolve the undermining problem. This approach is sometimes discussed in the context of statistical mechanics (e.g., using the notion of typicality), but it is not a direct solution to the undermining problem as it abandons the core idea of deference to chance.

