answer: |-
  You've hit on a profound philosophical tension – one debated by ethicists for centuries. Both your friends capture valid aspects, but neither gives the complete picture. Here's the breakdown of the principles at work:

  **1. The Core Principle (Your Second Friend's Point): Validity is Separate from the Speaker**
     *   **The Principle:** The truth or moral weight of a claim exists independently of the person making it. "Missing a session without notice is disrespectful to the team's time" is a statement about an *action* and its consequences. Whether that action is performed by you or by Jordan doesn't change the inherent disrespect involved in the *action itself*.
     *   **Analogy:** A smoker telling you smoking is unhealthy. The *fact* that smoking is unhealthy remains true, regardless of the smoker's hypocrisy. The validity of the health warning stands on its own merits.
     *   **In Your Situation:** Jordan *is* correct that unexcused absences during a critical competition season waste others' time and disrupt planning. This core criticism holds weight, irrespective of his own actions.

  **2. The Hypocrisy Problem (Your First Friend's Point): Undermining Moral Authority & Fairness**
     *   **The Principle:** While the *truth* of the criticism may stand, hypocrisy fundamentally undermines the *moral authority*, *fairness*, and *credibility* of the person delivering it. It creates a double standard.
     *   **Why it Matters:**
          *   **Loss of Moral Standing:** To credibly condemn an action as morally wrong (like disrespect), the condemner must generally adhere to that standard themselves. By violating the very rule he enforces, Jordan weakens his position to claim the moral high ground.
          *   **Unfair Application:** "Rules for thee, but not for me" is inherently unjust. Jordan's justification ("I know the robot") is self-serving and subjective. It establishes an unequal system where leadership is exempt from the burdens placed on others. This breeds resentment and destroys trust.
          *   **Credibility Damage:** When someone consistently acts contrary to their stated principles, their future pronouncements become suspect. Why should the team believe Jordan's judgments on *anything* if his own actions show a disregard for the core rules?
          *   **Distraction from the Message:** Hypocrisy inevitably shifts the focus. Instead of the team reflecting on their own absence, the discussion becomes about Jordan's behavior and unfairness. This makes the *valid* criticism harder to hear and accept.
     *   **In Your Situation:** Jordan demanding accountability while exempting himself based on a self-defined privilege ("I know more") demonstrates poor leadership and unfairness. It makes his lecture feel like an abuse of power rather than a fair application of team standards.

  **The Synthesis: Both Principles Coexist (But Hypocrisy Has Consequences)**

  1.  **The Criticism's Core Validity Stands:** Yes, missing sessions without notice *is* inconsiderate and disruptive to the team, especially during competition season. This is true regardless of who skipped or who is pointing it out.
  2.  **Jordan's Hypocrisy Severely Undermines His Right to Deliver That Criticism Effectively & Fairly:**
      *   He loses the *moral authority* to frame it as a matter of principle and respect, as he demonstrably doesn't hold himself to that principle.
      *   He destroys *fairness* by applying a double standard.
      *   He damages his *credibility* as a leader.
      *   He *distracts* from the valid point by making the issue about his own inconsistency and perceived privilege.

  **Conclusion & What This Means for You:**

  *   **Don't dismiss the core point:** Acknowledge that unannounced absences *are* a problem for the team. Commit to communicating better in the future, *because it's the right thing for the team*, not just because Jordan said so.
  *   **Recognize the hypocrisy as a separate (and serious) leadership failure:** Jordan's actions demonstrate poor leadership, unfairness, and a lack of self-awareness. His justification is weak and self-serving.
  *   **The problem isn't *that* he criticized, but *how* and *from what position*:** The valid criticism was delivered hypocritically, unfairly, and in a way that damaged trust. This undermines its effectiveness and the team's cohesion.

  **What to Do:**

  1.  **Address the Absence Issue:** "Jordan, you're right that unannounced absences disrupt the team. I'll make sure to communicate clearly if I can't make a session." (Focuses on the valid principle).
  2.  **Address the Hypocrisy/Leadership Issue (Carefully & Constructively):** This is best done privately or with a trusted mentor/advisor present. Focus on the *impact* and the *standard*, not just attacking Jordan. Example:
      *   "I want the team to be successful and for standards to be clear. When standards like attendance communication are applied differently, especially based on seniority, it creates confusion and feels unfair. It makes it harder for everyone to take the standard seriously, regardless of its validity. Can we discuss how this rule applies consistently to *all* members, including leadership, to maintain trust and fairness?"

  You're right not to simply pick a side. The truth of the criticism exists, but hypocrisy poisons the well from which it's drawn, making the water undrinkable even if it's technically clean. Jordan's actions weakened his position as a leader and made a valid point land as an unfair power play. Understanding both principles gives you clarity on the situation's complexity.
