  We are given five axioms: 
  1. Pareto Optimality (PO): The solution should be Pareto efficient, meaning no player can be made better off without making the other worse off.
  2. Symmetry (Sym): If the bargaining problem is symmetric, the solution should give the same to both players.
  3. Scale Invariance (SI): The solution should be invariant under positive affine transformations of the utilities (i.e., independent of the scale and origin of the utility functions).
  4. Independence of Irrelevant Alternatives (IIA): If the solution for a larger set is in a smaller set, then it should also be the solution for the smaller set.
  5. Individual Monotonicity (IM): If the set of feasible outcomes expands in a way that benefits one player without harming the other, then that player should not end up worse off.

  The task is to rank them from most to least indispensable, with a justification why the top-ranked axiom outranks the bottom-ranked one.

