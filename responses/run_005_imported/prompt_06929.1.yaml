  - Scale Invariance is also crucial because utility functions are only unique up to affine transformations. Without this, the solution would depend on arbitrary choices of scaling and origin, which is not desirable.

  - Symmetry is a fairness condition. However, in asymmetric situations, we might accept asymmetric outcomes, so it might be less fundamental than PO and SI.

  - Individual Monotonicity (IM) and Independence of Irrelevant Alternatives (IIA) are both important but sometimes conflicting (as in the Nash vs. Kalai-Smorodinsky debate). 

