answer: |-
  Let's break down Ruth Chang's "small-improvement argument" for parity step-by-step, then rigorously contrast it with Broome's vagueness account, and finally evaluate possible adjudicating evidence.

  ### Step-by-Step: Chang's Small-Improvement Argument
  1.  **The Challenge:** Traditional trichotomy (A > B, B > A, A = B) seems inadequate for "hard choices" (e.g., high-paying soul-crushing Job A vs. low-paying fulfilling Job B). Intuitions resist saying one is *better*, the other is *better*, or they are *exactly equal*.
  2.  **The Rival Hypothesis (Rough Equality):** Perhaps A and B are *roughly equal* – their values are very close, making it hard to distinguish which is better, but one *is* marginally better (or they *are* equal). Our epistemic limitations or the imprecision of value measurement create the appearance of a "fourth relation."
  3.  **The Core Thought Experiment:**
      *   Suppose we have two options, A and B, seemingly in a hard choice (e.g., Job A vs. Job B).
      *   **Claim 1 (Breaking Equality):** If A and B were *exactly equal* in value, then *any* improvement to one option, no matter how small, would make it *better* than the other. Adding a tiny benefit (+ε) to A should make A+ε > B.
      *   **Claim 2 (Persistence of Incomparability?):** In hard choices, it seems possible that a *small improvement* to one option (say, A+ε) does *not* make it determinately better than B. A+ε might still *not* be better than B, nor worse, nor exactly equal. The original puzzling relation persists.
  4.  **The Argument:**
      *   **Premise 1:** If A and B were exactly equal, then a small improvement to A (A+ε) *must* make A+ε better than B.
      *   **Premise 2:** In hard choice cases (like Job A vs. Job B), we can find a small improvement ε such that A+ε is *still not better than B* (nor is B better than A+ε, nor are they exactly equal).
      *   **Conclusion 1:** Therefore, A and B cannot have been exactly equal. The rough equality hypothesis fails to explain the persistence of non-domination after improvement.
      *   **Conclusion 2:** Since A+ε is not better than B, and A+ε is clearly better than A (by construction), it follows that B cannot be worse than A (if B were worse than A, then B would *definitely* be worse than A+ε, contradicting Premise 2). Similarly, B cannot be better than A. So A and B are incomparable *under the traditional trichotomy*.
      *   **Conclusion 3 (Parity):** Yet, A and B (and A+ε and B) *are* comparable – we can deliberate and choose between them based on reasons. Therefore, there must be a *fourth basic relation* – **being on a par** – that explains both the initial incomparability under trichotomy *and* their comparability. Parity involves being "in the same neighborhood of value" but neither better, worse, nor equal, allowing for small improvements to not break the relation.

  **Key Logical Point:** The argument hinges on the *asymmetry*:
  *   **Equality is Fragile:** *Any* improvement breaks it, forcing a strict "better than" relation.
  *   **Parity is Robust:** *Some* (sufficiently small) improvements *do not* break it; the options remain "on a par."

  ### Broome's Vagueness Challenge
  John Broome argues Chang misdiagnoses the phenomenon. He contends:
  1.  "Better than" and "worse than" are **vague predicates**. There is a zone of indeterminacy between "A is better than B" and "B is better than A."
  2.  **No Fourth Relation Needed:** When Chang says A and B are "on a par," we are simply in this **zone of vagueness**. It's not that a *new relation* holds; it's that the *existing relations* ("better than," "worse than") lack determinate application.
  3.  **The Small Improvement Explained:** Within the vague zone, a *very small* improvement ε might be too small to move A+ε definitively out of the zone of indeterminacy relative to B. It remains indeterminate whether A+ε is better than B. This explains Premise 2 of Chang's argument *without* positing parity.
  4.  **Equality is Precise:** Broome often argues that "equally good" is a *precise* relation. If A and B are *exactly* equal, then indeed, *any* improvement breaks it (supporting Chang's Premise 1). However, in the vague zone, we are *never* dealing with exact equality. We're dealing with cases where it's indeterminate which is better, *and* it's false that they are exactly equal.
  5.  **Predictive Parity:** Broome claims his account predicts the *exact same intuitive judgments* as Chang's parity account in all cases Chang describes. The pattern of "not better, not worse, not equal, but comparable" just *is* the manifestation of vagueness.

  ### Weighing the Force & Adjudicating Evidence
  Chang's argument *is* forceful against the simple "rough equality" view that suggests options are *actually* equal or one is *actually* marginally better but we can't tell. Broome's sophisticated vagueness account, however, is a much tougher rival. Here's how to evaluate them:

  1.  **Metaphysical Parsimony vs. Phenomenological Fit:**
      *   **Broome (Pro):** More parsimonious. Avoids multiplying basic value relations beyond "better than," "worse than," and "equally good." Explains the phenomena with recognized logical features (vagueness).
      *   **Chang (Pro):** Argues parity better captures the *phenomenology* of hard choices. When we say "A and B are on a par," it *feels* like we're asserting a positive relation of comparability ("in the same league"), not merely stating the *absence* of determinacy ("it's indeterminate which is better"). Parity offers a richer structure for explaining how reasons function within a "parity cluster."

  2.  **The Crucial Point of Contention: The Status of "Equally Good"**
      *   **Chang:** Insists that if two items were *vaguely* equal (in Broome's sense), we *should* sometimes be willing to say they are "equally good," albeit vaguely. But in hard choice cases, we *resist* this. We insist they are *not* equally good *at all* – they are different in kind, yet comparable. "On a par" captures this distinct stance.
      *   **Broome:** Counters that "equally good" is precise. In the vague zone, it's simply *false* to say they are equally good, and *false* to say one is better. We're left only with indeterminacy, which explains our reluctance to assert equality.

  3.  **Potential Adjudicating Evidence:**
      *   **Phenomenology of Choice:**
          *   **Evidence for Chang:** If people consistently describe hard choices using *positive* relational language implying a unique category ("they belong to the same class," "they are in the same ballpark," "they are competitive alternatives") rather than *negative* epistemic language ("I can't tell which is better," "it's fuzzy"), this supports parity as a distinct *relation* rather than merely an epistemic lack. Empirical studies probing choice descriptions and justifications could be relevant.
          *   **Evidence for Broome:** If people readily describe their hesitation in epistemic terms ("I'm not sure," "it's too close to call," "the values are too incommensurable to measure precisely"), it supports the vagueness view.
      *   **Patterns of Reason-Giving:**
          *   **Evidence for Chang:** If, in hard choices, people cite reasons that seem to establish a *positive common ground* for comparison ("both offer profound but different kinds of fulfillment," "both are worthy pursuits") *without* those reasons pointing towards equality or marginal superiority, it suggests the relation is "parity." If deliberation focuses on *which kind of value to realize* rather than *which option has more value*, it fits Chang's model where parity involves different "covering values."
          *   **Evidence for Broome:** If reason-giving primarily highlights the *difficulty of weighing* different factors ("how much salary is worth how much fulfillment?"), it fits the vagueness model where the challenge is aggregating precise but incomparable units.
      *   **The "Persistence" Threshold:**
          *   **Evidence for Chang:** Can we find clear cases where a *series* of small improvements to A still leaves A+nε *not determinately better* than B, *and* where we strongly resist saying A+nε and B are "equally good"? If the zone of "non-domination" persists robustly through multiple improvements that *should* cumulatively push the value beyond any plausible margin of vagueness, it challenges Broome. Chang needs cases where the gap created by improvements is *clearly significant* yet determinacy doesn't emerge. (Broome would counter that the vagueness might simply be very wide).
      *   **Structural Implications:**
          *   **Evidence for Chang:** Parity allows for a more complex structure of value relations (e.g., items can be on a par *via* different paths). If such structures demonstrably explain patterns of rational choice better than vagueness, it supports Chang. Does the "parity" relation exhibit unique logical properties or play a distinct role in normative reasoning that vagueness cannot replicate?
          *   **Evidence for Broome:** If the logic of "indeterminacy" perfectly models all the phenomena without needing new relations, and if attempts to define "parity" formally lead to inconsistencies or collapse into vagueness, it supports his view.

  **Conclusion:** Chang's small-improvement argument successfully defeats the idea that hard choices involve rough *equality* or easily resolvable marginal differences. It powerfully establishes the need for an alternative to the traditional trichotomy. However, Broome's vagueness account provides a formidable, parsimonious alternative explanation that predicts the same first-order judgments.

  **Adjudication hinges on whether "on a par" describes:**
  1.  **A distinct positive relation with its own phenomenology and normative role** (favoring Chang), or
  2.  **Merely the experience of indeterminacy within the existing relations** (favoring Broome).

  Finding clear cases where the "non-domination" relation persists stubbornly *beyond* plausible margins of vagueness, coupled with phenomenological evidence of a *sui generis* "same league" experience, would be the strongest evidence for Chang. Conversely, demonstrating that all aspects of "parity" can be fully modeled as semantic indecision or imprecise cardinal measurement would vindicate Broome. Currently, the debate remains live, reflecting deep differences in how philosophers understand the metaphysics and epistemology of value comparison. Your instinct that they predict similar intuitions is astute – the disagreement is fundamentally about the *best explanation* for those shared intuitions.
