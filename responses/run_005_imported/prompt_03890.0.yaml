  ## Dialogue: The Fence and the Fracture

  **Setting:** A sun-dappled quadrangle after a philosophy conference. **Dr. Anya Sharma (Bratmanian)** and **Professor Ben Carter (Gilbertian)** continue their debate over coffee.

  **Anya (Bratmanian):** Ben, that conference paper on the fence-painting case perfectly illustrates why we need Bratman’s precision. Alex and Sam *intend* to repaint the fence together. Each *intends* that they repaint it *in accordance with and because of* each other’s intention and meshing sub-plans – scraping first, then priming, then painting. They are *mutually responsive*; Alex hands Sam the scraper when Sam reaches, Sam adjusts pace to match Alex. They have *common knowledge* of all this. That *is* their shared intention. It’s robustly there, built from interlocking individual attitudes. When Sam walks off mid-scrape for a better gig, it’s deeply *disappointing* and *frustrating* for Alex, sure. Sam violated the mutual responsiveness and failed to sustain their individual contributory intention. But the *wrong*? It’s the wrong of letting someone down when you’ve led them to rely on you. It stems from Alex’s thwarted individual intention and reliance, amplified by the common knowledge that Sam *knew* Alex was relying on him.

  **Ben (Gilbertian):** Anya, your account captures the mechanics, the *how* of coordination, beautifully – Sebanz and Knoblich’s work shows that empirically. But it utterly fails to capture the *normative glue*, the *distinctive wrong* Sam commits when he walks off. Alex isn’t *just* disappointed like someone missing a bus. He feels *wronged*, *betrayed*. Why? Because when Alex and Sam embarked on repainting the fence *together*, they didn’t just have interlocking individual intentions. They *jointly committed* to painting the fence *as a plural subject* – as a “we.” “We are repainting this fence.” That joint commitment creates obligations *to each other* that are *sui generis* – irreducible to individual intentions or reliance. Sam didn’t just frustrate Alex’s plan; he *unilaterally violated the joint commitment they constituted together*. That commitment wasn’t Sam’s to dissolve alone. Alex has a *standing* to rebuke Sam, not just complain about inconvenience. “You walked off on *us*!” carries a weight “You stopped helping *me*!” simply doesn’t.

  **Anya (Bratmanian):** I see the pull of that intuition, Ben, but I think we *can* earn it without positing mysterious plural subjects. The obligation arises precisely *from* the structure Bratman identifies. Alex formed his plans – buying paint, clearing his afternoon – *relying* on Sam’s persistent intention (manifest in action) to contribute, *knowing* Sam knew Alex was relying, and vice-versa. Sam’s walking off wasn’t just changing his mind; it was *exploiting* that structure of mutual reliance and common knowledge. He *freerode* on Alex’s initial effort and planning, then bailed. That’s a violation of fairness and reciprocity inherent in the interlocking intentions. Alex’s claim stems from the *costs he incurred based on justified reliance* within the shared intentional framework. It’s a strong claim, grounded in individual agency and interdependence.

  **Ben (Gilbertian):** But Anya, reliance and reciprocity are downstream! The *source* of the obligation, and its distinctive character, is the *joint commitment itself*, which exists prior to any specific reliance damages. Imagine they start painting, and after two brushstrokes, Sam instantly walks off. Minimal reliance. On your account, the "wrong" is minimal – barely a blip. But intuitively, Alex is *still* wronged! Why? Because Sam violated the *commitment they made together* the moment they formed the "we." The obligation was inherent in the joint activity *as such*. Sam doesn't need to cause significant reliance costs to wrong Alex; he wrongs him simply by unilaterally abandoning the *joint project* they constituted. Alex has a right to Sam's continued participation *because of the joint commitment*, not just because he bought extra paint.

  **Anya (Bratmanian):** In that minimal case, the *wrong* *is* minimal, Ben! It’s primarily the wrong of insincerity or capriciousness. Sam revealed his initial intention wasn’t serious or stable, undermining the common knowledge necessary for genuine shared intention to form. Alex might feel a flash of annoyance at the wasted moment, but the *moral weight* scales with the justified reliance and the depth of the interlocked plans. Your “joint commitment” feels like an unnecessary posit. What *is* it, ontologically, beyond the complex web of individual attitudes and their interrelations that Bratman describes? If it’s something over and above, how does it causally or normatively interact with the individuals? Bratman’s reduction provides a clear, naturalistic account of the obligation emerging from the dynamic structure of mutual planning.

  **Ben (Gilbertian):** Its ontology is the ontology of the social world, Anya – irreducible, but no more mysterious than promises or institutions. The causal/normative interaction is clear: the joint commitment *binds* the parties. It creates a normative framework *within which* their individual intentions and actions operate and gain meaning *as joint action*. When Sam walks off, he doesn't just change *his* mind; he *severs the bond* of the plural subject. That's why Alex experiences it as a betrayal of the *us*, not just a frustration of *his* plan. The obligation isn't merely derived from reliance; it's constitutive of being jointly committed. Bratman's "interlocking" explains coordination; it doesn't explain the *authority* Alex feels to demand Sam's return or the *special standing* he has to complain *as a co-author of the commitment*. Only the plural subject account captures that.

  **Anya (Bratmanian):** I maintain that Alex’s authority *is* derived from the justified expectations and reliance built into the common knowledge and mutual responsiveness. Sam implicitly invited reliance through his actions within the framework of shared intention. Alex’s complaint has standing because Sam *knew* his actions were inducing reliance. Your plural subject feels like a useful metaphor for the depth of the interconnection, but positing it as a real entity generating irreducible obligations seems ontologically extravagant and explanatorily redundant. The disappointment and sense of being let down *is* the core experience; the feeling of being "wronged as a we" is an emotional gloss on the violation of deeply intermeshed individual expectations and plans.

  **Ben (Gilbertian):** And I maintain that the depth of that "feeling of being wronged" – especially its distinct character from mere personal disappointment – and the specific social expectation that one *cannot* simply walk away from a joint activity without being answerable, point directly to the reality of the joint commitment as the foundation. Without it, the normative force remains contingent on individual costs and psychological states, not on the inherent nature of acting together *as a plural subject*. The fence remains half-painted, Ben. Sam is gone. Alex feels the fracture. For me, that fracture is in the social fabric they wove together. For you, it’s in the shattered architecture of interlocking individual minds. The experiments might show *how* we coordinate, but they won't settle *what* it is we've built when we do.

  **Anya (Bratmanian):** Perhaps not. But I’ll wager Bratman’s individualist bricks and mortar explain the coordination *and* the normativity well enough without needing Gilbert’s collective spire. The fracture, as you call it, is real enough in the minds of the individuals involved. That’s where the action, and the obligation, ultimately reside. *(Takes a sip of coffee, the disagreement palpable but the engagement clear.)*

  **Key Philosophical Anchors Illustrated:**
  *   **Bratman:** Focus on *interlocking individual intentions, meshing sub-plans, mutual responsiveness, common knowledge* as constitutive. Obligation stems from *reliance and reciprocity* within this structure.
  *   **Gilbert:** Emphasis on *joint commitment* creating a *plural subject* with *sui generis obligations*. Obligation is *constitutive* of the joint activity, not derivative. Unilateral rescission is *impossible*; walking off is a *violation*.
  *   **The Disagreement Core:** Can the normative force of joint action (the "wronging") be fully reduced to individual attitudes, expectations, and reliance (Bratman)? Or does it require an irreducible joint commitment binding a plural subject (Gilbert)?
  *   **Test Case Focus:** The minimal reliance case challenges Bratman's reliance model. The "betrayal" intuition challenges Bratman to explain the *distinctive* wrong without a plural subject. Bratman challenges Gilbert's ontology and explanatory necessity.
