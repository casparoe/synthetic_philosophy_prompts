answer: |-
  What an insightful question! You've pinpointed a fascinating tension between a core Reformation doctrine and a modern philosophical concept that share the same term but operate in fundamentally different frameworks. Let's break down Article XIV and then explore its relationship to modern supererogation.

  **Unpacking Article XIV: "Of Works of Supererogation"**

  1.  **The Target:** The Article directly targets a specific theological and devotional practice within late medieval Catholicism: the concept that individuals (particularly saints, ascetics, and monks through their vows and extraordinary sacrifices) could perform "works of supererogation." These were understood as voluntary good works *above and beyond* what God's commandments strictly required for salvation.

  2.  **The Mechanism & "Treasury of Merit":** This concept was integral to the doctrine of the "Treasury of Merit." The idea was:
      *   Christ and the saints, through their perfect lives and sufferings, generated an infinite surplus of merit before God.
      *   Ordinary Christians, through extraordinary acts of piety, penance, charity, or monastic discipline, could generate *their own* surplus merit beyond what was needed for their personal salvation.
      *   This surplus merit could be "deposited" into the Church's "Treasury of Merit."
      *   The Church, acting through the Pope (as the steward of this treasury), could then grant "indulgences" – essentially, drawing on this surplus merit to reduce the temporal punishment due for sin (in Purgatory) for oneself or others (especially the dead).

  3.  **The Reformers' Objections (Why "Arrogancy and Impiety"):**
      *   **Denial of Human Ability:** At its core, the Reformation rediscovered the doctrine of justification by grace alone through faith alone (*sola gratia, sola fide*). Humans, due to original sin, are fundamentally incapable of earning *any* merit before God, let alone *surplus* merit. Our best works are still tainted by sin. We are always in debt to God.
      *   **Undermining Christ's Sufficiency:** The idea that human works could add to the merit of Christ was seen as blasphemous. Christ's sacrifice was perfect, complete, and entirely sufficient for salvation. Suggesting humans could contribute surplus merit implied Christ's work was insufficient.
      *   **Scriptural Basis (Luke 17:10):** The Article explicitly cites Jesus's words: "So you also, when you have done all that you were commanded, say, ‘We are unprofitable servants; we have only done what was our duty.’" This underscores the reformers' view: even perfect obedience (which humans cannot achieve) would merely be our duty, rendering us "unprofitable servants" with no claim to surplus or reward. Doing "more" than commanded is therefore impossible in this relationship.
      *   **Arrogance:** Claiming to perform works beyond what God requires implies a level of personal holiness and capacity that humans simply do not possess. It elevates human effort to a divine level.
      *   **Impiety:** It treats God's grace as something that can be earned, quantified, stored, traded, or dispensed by humans (via the Church). This commodifies salvation and diminishes God's sovereignty and the free gift of grace.
      *   **Abuse (Indulgences):** The practical outworking – the sale of indulgences promising release from Purgatory for oneself or loved ones based on this "treasury" – was the immediate scandal that sparked Luther's protest. It turned salvation into a financial transaction and exploited the faithful.

  **Why it Mattered So Much:**

  This wasn't just an academic debate. It struck at the heart of how salvation was understood and obtained. For the reformers:

  1.  **Soteriology (Doctrine of Salvation):** It corrupted the gospel message. Salvation became a transaction involving human merit and payment (indulgences), rather than a free gift received by faith in Christ.
  2.  **Ecclesiology (Doctrine of the Church):** It gave the institutional Church (specifically the Papacy) immense, unbiblical power over people's eternal destinies through its control of the "treasury."
  3.  **Pastoral Abuse:** The sale of indulgences caused immense spiritual anxiety and financial exploitation.

  **Article XIV vs. Modern Secular Supererogation**

  You are absolutely right to sense a fundamental difference. While the term "supererogation" survives, the concepts are operating in radically different universes:

  | **Aspect** | **Article XIV (Reformation Theology)** | **Modern Secular Supererogation** |
  |------------|----------------------------------------|----------------------------------|
  | **Framework** | Vertical: Human-to-God relationship | Horizontal: Human-to-human relationships |
  | **Scope** | Eternal salvation and merit before God | Earthly moral obligations and social flourishing |
  | **Possibility** | Impossible: Humans are fundamentally incapable of surplus merit | Possible: Recognizes extraordinary acts beyond duty |
  | **Nature of Duty** | Infinite obligation to God; "duty" is total submission | Finite obligations; "duty" has definable boundaries |
  | **Key Concerns** | Arrogance, impiety, undermining Christ's sufficiency | Admiration, moral exemplars, social encouragement |

  **Key Differences Explained:**

  1.  **Vertical vs. Horizontal:** Article XIV is about the *human-God relationship* concerning *eternal salvation and merit*. Modern supererogation is about *human-human relationships* concerning *earthly moral obligations and social flourishing*. Doing "more than required" for another person is conceptually worlds apart from claiming to do "more than required" *for God* in earning salvation.
  2.  **The Nature of "Duty" to God:** In the reformers' view (based on Scripture like the Luke 17:10 passage), our duty to God is total and all-encompassing ("Love the Lord your God with all your heart..."). There *is* no "beyond" duty in this relationship. We always fall short. Modern duty (e.g., not harming others, keeping promises) has definable boundaries. Helping a stranger in peril isn't usually a *strict duty* (like a firefighter's might be), hence acting beyond that minimal duty is possible and praiseworthy.
  3.  **No "Merit Account" or Transfer:** Modern supererogation involves no concept of storing surplus moral credit in a cosmic treasury to be dispensed to others. It's about individual acts of exceptional goodness or courage that inspire others and benefit society directly. Admiring a hero doesn't imply the non-hero is morally deficient in their duty.
  4.  **Different Concerns:** The reformers feared *theological error and pastoral abuse* distorting salvation. Modern philosophers debate *moral categorization* (is it truly "beyond duty"?), *motivation*, and *social value* – not the arrogance of claiming divine surplus or undermining a savior's sufficiency.
  5.  **The "Unprofitable Servant" Argument:** This applies *only* to the human-God relationship concerning justification. It doesn't mean we shouldn't strive to help others generously! Reformers strongly advocated for good works *as the fruit and evidence of genuine faith and love for neighbor*, not as merit-earners before God. They would applaud saving someone from a burning car as a wonderful act of love, but would vehemently reject the idea that such an act earned the rescuer "bonus points" with God towards their salvation or someone else's.

  **Conclusion: Same Term, Different Worlds**

  Your intuition is correct. The Thirty-Nine Articles (Article XIV) and modern moral philosophy use the term "supererogation" but are engaged in conceptually distinct debates:

  *   **Reformation Context:** The term was a precise theological weapon against the late medieval Catholic doctrines of surplus human merit, the Treasury of Merit, and the practice of indulgences. It was rejected as impossible and theologically dangerous because it undermined grace alone and Christ's sole sufficiency for salvation.
  *   **Modern Philosophy:** The term was adopted (likely due to its historical usage meaning "beyond the call") to describe a category of morally admirable actions that exceed strict moral duty within a largely secular framework focused on human ethics and social relations. It's a positive category, concerned with understanding heroism, saintliness, and extraordinary generosity.

  The survival of the term is fascinating linguistic continuity, but the underlying concepts and the stakes involved are fundamentally different. Article XIV isn't condemning altruism or heroism; it's condemning a specific soteriological mechanism that the reformers believed corrupted the Gospel. Modern philosophers analyzing supererogation aren't inadvertently committing the "arrogancy and impiety" the Article warns against; they are operating in a different conceptual space altogether. Your great-grandmother's prayer book opened a window onto a pivotal historical debate, brilliantly highlighting how language evolves across contexts.
