prompt: |-
  Okay so I need a tiebreaker, because a friend and I have been arguing about this on and off for like two days now and neither of us is budging. I've got this intro logic class this semester where we covered the explosion principle (sometimes called ex falso/ex contradictione quodlibet — the thing where a single contradiction lets you derive literally any sentence), and the professor mentioned paraconsistent logics as the systems built to block that. I brought this up with my friend Sam over dinner and his take was basically "oh, so paraconsistent logic just IS dialetheism, they're the same move dressed up in two vocabularies" — like, believing some contradictions are actually true, and building a logic that tolerates contradictions without exploding, are just the metaphysical and technical descriptions of one single commitment. I was pretty sure that's wrong but couldn't actually nail down why in the moment, and it kinda devolved into both of us just invoking Graham Priest's name at each other without either of us being able to properly explain what he argues. Very productive evening.

  So can you actually settle this properly? Compare dialetheism and paraconsistent logic as such: what exactly is each one a thesis about, and does holding one commit you to the other — in one direction, both, or neither? If you think they're genuinely seperable, back it up with an actual concrete case — an example of someone reasonably adopting a paraconsistent logic for reasons that have nothing to do with thinking any contradiction is literally true, and (if it even makes sense) an example running the other way, a dialetheist commitment that doesn't require signing on to a paraconsistent logic. Then give me your actual verdict, argued rather than just defined: is dialetheism basically just "paraconsistency plus a change of attitude toward truth," or is there something extra, and specifically weirder or more costly, that a dialetheist signs up for that an ordinary paraconsistent logician never has to?
