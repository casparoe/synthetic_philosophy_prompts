  First, the convergence: Aristotle’s "form" as information pattern vs. DNA sequence. In *GA*, he uses the carpenter analogy—form shapes matter without contributing material. DNA fits neatly here: nucleotides aren’t bodily "stuff" but instructions. Even the rennet analogy (catalyst) mirrors how DNA directs without becoming the protein. This would feel like vindication to Aristotle.  

