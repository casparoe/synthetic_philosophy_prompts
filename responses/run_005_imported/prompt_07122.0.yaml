answer: |-
  This is an exceptionally nuanced and textually grounded reading—precisely the sort of careful engagement Aquinas deserves. Your reconciliation through the "authority held in trust" lens is insightful and largely persuasive. Here's a breakdown of feedback on your key points:

  ### Strengths of Your Analysis
  1.  **Accurate Textual Representation:** You've captured the core distinctions and developments across the three texts fairly:
      *   **Sentences Commentary:** Correctly highlights the crucial *usurper (title)* vs. *abusive ruler (exercise)* distinction and the permissibility of removing the former by private individuals precisely *because* no legitimate authority exists to disrupt. The "no sedition" argument is key.
      *   **De Regno:** Rightly emphasizes the overwhelming caution, the procedural preference (original conferring body), the dangers of private judgment/ambition, and the ultimate fallback to endurance and prayer. This is indeed the most "restrictive" text.
      *   **Summa (II-II, q.42):** Perfectly identifies the critical argument that overthrowing a government *not ordered to the common good* isn't true "sedition" (removing the primary sin), alongside the essential caveats of proportionality and blame attribution.

  2.  **The "Trust" Premise as Load-Bearing:** Your core thesis—that **authority as a trust conferred by the community** is the unifying principle—is powerful and does significant reconciling work:
      *   **Usurpers (Sentences):** You nail it. The trust was *never legitimately conferred*. Therefore, there's no legitimate authority to respect or disrupt; removing it isn't violating a trust. The "no sedition" conclusion flows directly.
      *   **Tyrants by Exercise (All Texts):** The trust *was* conferred. Therefore, only the body that conferred it (or perhaps the community *as* the ultimate trust-giver, though Aquinas is vague here) has the right to revoke it. Private individuals acting alone violate the procedural requirements inherent in the trust relationship. This explains the caution in *De Regno* and the Summa's focus on *who* acts and *how* (proportionality).
      *   **Summa's "Not Sedition" Argument:** This fits neatly. If the ruler has fundamentally violated the trust (not ordering to common good), the *unity* the trust was meant to create is broken. Opposing this broken regime isn't attacking true authority/unity; it's reacting to its absence.

  3.  **Addressing the Apparent Tension:** You correctly diagnose that the permissiveness towards usurpers isn't an *exception* to the "trust" rule but a *consequence* of its *non-application* in that specific case. This is a crucial insight that resolves the surface-level conflict between *Sentences* and *De Regno*.

  ### Points for Refinement & Nuance
  While your reconciliation is strong, the tension between *De Regno*'s extreme caution and the *Sentences* commentary's relative permissiveness *regarding action* isn't *fully* dissolved by the "trust" premise alone. The "trust" model explains *why* the cases are different procedurally, but *De Regno* introduces prudential concerns that apply even to the usurper case, tempering the *Sentences* position:

  1.  **De Regno's Broader Prudential Caution:** *De Regno*'s warnings (unreliable judgment, ambition masking as liberation, danger to merely unpopular rulers) aren't *solely* tied to the "tyrant by exercise" case. Aquinas seems concerned that *any* act of private tyrannicide, even against a usurper, sets a dangerous precedent and invites chaos. While the *legitimacy* of removing the usurper isn't in doubt (trust never conferred), the *wisdom and consequences* of *how* it's done are paramount. *De Regno* pushes towards *institutional* or *communal* action even for usurpers, whereas *Sentences* seems more open to private initiative against them. Your reconciliation explains the *justification* for action against usurpers, but *De Regno* heavily qualifies the *prudence* of *how* that action is taken, urging restraint even where it's theoretically permissible.
      *   **Does this break the "trust" model?** No. The "trust" model establishes the *legitimacy* of removing the usurper. *De Regno*'s caution addresses the *practical wisdom and potential consequences* of exercising that legitimacy, especially via private means. It adds a layer of political prudence *on top of* the foundational principle.

  2.  **The "Community" as Actor:** Your reading relies on "only some public or communal act can rightly withdraw [authority]." This is clear for tyrants by exercise. For usurpers, the *Sentences* commentary *seems* to allow private action precisely because no legitimate authority exists. However:
      *   Is "private action" implicitly understood as acting *on behalf of* the community whose trust was violated? Aquinas isn't explicit here.
      *   *De Regno* strongly implies that *organized communal action* (the "multitude") is preferable to isolated private action even against a usurper, due to the prudential dangers. The "trust" model necessitates *someone* acting for the community to reclaim the misappropriated authority; it doesn't *require* that action to be private, and *De Regno* strongly argues it *shouldn't* be.
      *   **Refinement:** The "trust" model demands that action to depose *any* ruler (whether usurper or abusive) must be understood as an act *on behalf of the community* reclaiming its authority. Private individuals might *initiate* this against a usurper (*Sentences*), but *De Regno* argues that the action only becomes prudent and properly communal when undertaken collectively or through residual institutions, minimizing the risks of error and disorder inherent in purely private judgment and action. The tension isn't in the *justification* (solved by "trust"), but in the *preferred agent and method*.

  3.  **Endurance & Prayer (De Regno):** This extreme fallback position applies when *no* recourse (institutional or communal) is available. The "trust" model explains *why* private action is illegitimate against a tyrant by exercise (trust conferred, not revoked properly). However, the injunction to endure rather than attempt *any* communal uprising (even against a usurper if no recourse exists?) pushes the "trust" model to its limits. It prioritizes order and the avoidance of likely greater evil (chaos) over the community's inherent right to reclaim its authority *in practice*. This is Aquinas the realist prioritizing the lesser evil, even if it means tolerating a fundamental violation of the "trust" principle. It's less a contradiction of the "trust" model and more a tragic concession to fallen political reality where exercising the right might cause more harm than good.

  ### Conclusion: Does the "Trust" Premise Work?
  **Yes, powerfully.** You've identified the fundamental principle that structures Aquinas's seemingly disparate remarks. It successfully:
  *   Explains the critical distinction between usurpers and tyrants by exercise.
  *   Grounds the procedural requirement for institutional/communal action against tyrants by exercise.
  *   Underpins the Summa's argument that overthrowing a regime violating the common good isn't sedition.
  *   Resolves the *apparent* contradiction between *Sentences* and *De Regno* by showing permissiveness towards usurpers arises from the *absence* of a trust relationship, not an exception to it.

  **The remaining tension** concerns the **practical application** of the principle, particularly regarding:
  *   The **level of caution/prudence** required even when action against a usurper is legitimate (*De Regno*'s universal warnings).
  *   The **preferred agent** for reclaiming authority (private initiator tolerated in *Sentences* vs. strong preference for collective/institutional action in *De Regno*).
  *   The extreme **fallback of endurance** when no recourse exists, which feels like a pragmatic limitation on the exercise of the community's right under the trust model.

  Your analysis is excellent. The "trust" premise does the heavy lifting of reconciling the core justifications across the texts. The residual tensions highlight Aquinas's deep concern for order, the dangers of human sinfulness (especially ambition and misjudgment), and the tragic complexities of political life, which temper the application of the foundational principle without negating it. Your friend's claim that Aquinas "sanctioned killing a tyrant" is a vast oversimplification; your nuanced reading captures the profound conditionalities, distinctions, and profound caution that define his actual position.
