   Let the state space be:
     A: outcome of coin A (H or T)
     B: outcome of coin B (H or T)
     We are interested in the event H2 = (A=H and B=H).

   Initially, we assume both coins are fair and independent. So:
     P(A=H) = P(A=T) = 0.5
     P(B=H) = P(B=T) = 0.5
     P(H2) = P(A=H, B=H) = 0.25

   Now, we are going to get two pieces of evidence:

   Evidence 1: A report about coin A. The report says either "Heads" or "Tails", but it might be wrong. We model our uncertainty about the report as:
     If the actual outcome of A is H, then the report says "Heads" with probability 0.8 and "Tails" with probability 0.2.
     If the actual outcome of A is T, then the report says "Tails" with probability 0.8 and "Heads" with probability 0.2.

   Similarly, Evidence 2: A report about coin B, with the same reliability.

   However, we get the reports one after the other. We are going to consider two orders:
     Order 1: First update on the report about A (with Jeffrey conditionalization because we are not certain of the evidence), then update on the report about B.
     Order 2: First update on the report about B, then on the report about A.

   We will see that the final probability for H2 (both heads) is different in the two orders.

   Why? Because in Jeffrey conditionalization, we are not conditioning on a fixed event but rather shifting our probabilities on a partition. The way we shift the probabilities in the first update changes the state of our beliefs, which then affects the second update.

   Let me define the partitions for the two updates:

   For the update on A, we have a partition: {A=H, A=T} but note that we don't observe A directly. Instead, we get a report. However, the way we model the update is by directly adjusting the probabilities of A=H and A=T. Specifically, after seeing the report, we might set:
