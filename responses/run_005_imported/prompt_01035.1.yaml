  The user's academic background suggests they've already noticed the tension between Du Bois's earlier qualification (Beauty/Truth/Right being inseparable "here and now") and the later universal claim. That's crucial - it implies Du Bois might be making a strategic essentialism. The user also flags the ambiguity in "propaganda": is it descriptive (art always expresses values) or prescriptive (art should serve politics)?

  Let me reconstruct the implied syllogism: 
  1. All art uses Truth/Goodness as aesthetic tools (historical premise)  
  2. These tools inherently express ethical/political positions (inference)  
  3. Therefore all art conveys ethical/political positions (propaganda as effect)  
  But Du Bois then slips in "ever must be," implying necessity - that's where the logical gap yawns. The earlier "here and now" suggests premise 1 isn't universal, yet the conclusion presents itself as timeless.

  The propaganda duality matters too. When Du Bois says the artist is "slavery only dogged" when denied truth-telling, he ties propaganda to liberation - making it both descriptive (art always has political effects) and prescriptive (art must fight oppression). The user needs this distinction clarified.

