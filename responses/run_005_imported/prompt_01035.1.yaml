answer: |-
  You've pinpointed a crucial tension in Du Bois's argument that many gloss over. Let's break down the logical steps, identify the shifts, and unpack "propaganda":

  **The Explicit Argument's Structure:**

  1.  **Premise (Historical/Descriptive):** Artists throughout history have used two essential "tools":
      *   **Truth:** Not as a scientist (objective, disinterested), but as the "highest handmaid of imagination" and "vehicle of universal understanding." (Truth serves *aesthetic* and *communicative* power).
      *   **Goodness (Justice, Honor, Right):** Not for ethical sanction, but as the "one true method of gaining sympathy and human interest." (Goodness serves *emotional connection* and *engagement*).

  2.  **Inference 1 (Normative Boundary):** Therefore ("Thus"), the artist ("apostle of Beauty") is *compelled* (by "inner and outer compulsion") to also be an apostle of Truth and Right. It's not a free choice; Truth and Justice *bound* artistic freedom. Freedom *is* this bounded state. Slavery occurs only when this truth-telling/justice-recognizing freedom is *denied*.

  3.  **Inference 2 (The Propaganda Claim):** Therefore ("Thus"), "all Art is propaganda and ever must be..." This follows directly from the boundedness claim. If art *must* operate within and express Truth and Justice (as defined above), then it inherently advocates for a specific vision of those things – it is propaganda.

  **The Tensions & Shifts You Identified:**

  1.  **From Historical Practice to Essential Nature:** This is the core leap. Du Bois moves from "artists *have used* Truth/Goodness as tools" (a descriptive, historical claim about *methods*) to "the artist *is compelled*... Truth and Justice *bound* freedom... *all* Art *is* and *ever must be* propaganda" (normative, essentialist claims about the *nature* and *necessary function* of art). The logic bridging this gap is implied but not proven: he assumes that because these tools have been *used* effectively and are *necessary* for achieving art's core goals (imagination, understanding, sympathy, interest), they are therefore *constitutive* and *unavoidable* boundaries of art *itself*.

  2.  **The "Here and Now" Hedge vs. Universal Claim:** You're absolutely right to highlight this. Earlier, Du Bois grants the *theoretical possibility* of pure Beauty detached from Truth/Right ("I do not doubt that the ultimate art coming from black folk is going to be just as beautiful, and beautiful largely in the same ways, as the art that comes from white folk"). However, he immediately grounds his argument in the *material reality* of racism ("But the point today is that until the art of the black folk compells [sic] recognition they will not be rated as human. And when through art they compell [sic] recognition then let the world discover if it will that their art is as new as it is old and as old as new"). The later, universal claim ("all Art is propaganda and ever must be") seems to abandon this contingency. He *shifts* from a historically/politically *situated necessity* for Black art ("here and now") to a declaration about art's *inherent, timeless nature*.

      *   **Possible Reconciliation (Rhetorical vs. Ontological):** One could argue Du Bois is making a *rhetorical* universalization to strengthen the *practical* imperative for Black artists *in that moment*. By claiming art is *always* propaganda, he removes the stigma and positions Black artists' necessary engagement with Truth/Right not as a deviation, but as fulfilling art's *true* universal function. The "ever must be" might emphasize the *inescapability* of art's social/political dimension, especially under oppression, rather than a strict ontological claim about all possible art in all possible contexts. However, the text strongly leans towards the universal claim.

  3.  **The Double Duty of "Propaganda":** This is key. Du Bois's "propaganda" performs *both* functions you identify, and the argument hinges on conflating them:
      *   **Descriptive/Neutral Sense (Inevitable Expression):** Art inevitably uses and expresses visions of Truth and Justice (as defined) to achieve its aesthetic and communicative goals. In this sense, *all* art *is* propaganda because it always advocates for *some* worldview, even implicitly.
      *   **Prescriptive/Strategic Sense (Deliberate Harnessing):** Art *ought* to be consciously used as a tool for a specific political cause – specifically, the fight for racial justice and the assertion of Black humanity ("the creation of Beauty" by Black America is framed as a "bounden duty" in the context of white supremacy denying Black humanity and beauty). This is the sense aligned with the "here and now" necessity.
      *   **The Conflation:** The argument works by using the *descriptive* claim (art always expresses values = is propaganda) to *justify* and *naturalize* the *prescriptive* claim (Black art *must* be deliberate propaganda for racial justice). If *all* art is *already* propaganda (descriptive), then Black artists making *deliberate* propaganda (prescriptive) are not violating art's essence; they are embracing its fundamental nature and using it for the necessary cause of their liberation. The "ever must be" reinforces this by making the descriptive seem like an eternal law, lending weight to the prescriptive demand.

  **Reconstructing the *Actual* Logical Flow (Including the Shift):**

  1.  **Contextual Premise:** Under Jim Crow, Black humanity and beauty are denied. Art is a crucial battleground for recognition and humanity.
  2.  **Historical Premise:** Artists have always used Truth (for imaginative power/understanding) and Goodness (for sympathy/interest) as essential tools.
  3.  **Situational Inference ("Here and Now"):** *Therefore*, for Black artists *in this context*, the creation/preservation/realization of Beauty is inextricably bound to telling the Truth of Black experience and advocating for Justice/Right. Art *must* be harnessed deliberately (propaganda in the prescriptive sense) to achieve the necessary goals of racial uplift and human recognition. This is the "bounden duty."
  4.  **Rhetorical Universalization:** To defend this stance against "purists" (advocates of "art for art's sake") and ground the Black artist's duty in art's *essence* rather than just contingency, Du Bois argues:
      *   Because Truth and Goodness are *essential tools* historically used for art's core purposes (a), and because using them inherently expresses a vision of Truth/Justice (b),
      *   Therefore, the artist's freedom is *always* bounded by the need to engage with Truth/Justice (c), making art *always* an expression of values = propaganda (descriptive sense d).
      *   **Conclusion (Blending Senses):** Thus, "all Art is propaganda and ever must be" (d stated universally). This universalizes (d) to validate the *prescriptive* demand (step 3) for Black art: if *all* art is *already* propaganda (d), then Black art *must* be conscious propaganda (step 3) for its vital cause.

  **In essence:** Du Bois strategically shifts from a historically contingent, politically urgent argument about the *necessity* of Black art being deliberate propaganda under white supremacy to a universal claim about art's *inherent nature* being propagandistic. This universal claim serves to disarm critics ("purists") and provide a philosophical foundation for his prescriptive demand. "Propaganda" functions both descriptively (art always expresses values) and prescriptively (art should be weaponized for justice), and the argument relies on moving between these meanings. The logical "gap" is the jump from historical tool-use to essential, bounded nature, motivated by the specific political needs of the Harlem Renaissance moment.
