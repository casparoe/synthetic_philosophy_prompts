answer: |-
  You've hit upon one of the most fascinating philosophical duels in intellectual property history. Both arguments are profound, but **Kant's "mandate" theory offers the more defensible and philosophically coherent foundation against literary piracy**, especially for your novel's context. Here's the breakdown and verdict:

  **Core Arguments & Their Strengths/Flaws:**

  1.  **Fichte's Form/Content Distinction:**
      *   **The Wrong:** Unauthorized reprinting steals the author's unique *form* (the specific sequence of words). This form is inextricably linked to the author's individuality. Reproducing it without consent is theft of the author's personal intellectual expression.
      *   **Strengths:**
          *   Intuitively captures the sense that *how* something is said matters uniquely to the author.
          *   Clearly distinguishes ideas (free) from expression (protected), providing a blueprint for the modern idea-expression dichotomy.
          *   Grounds the wrong in the author's *personality* rather than just commerce.
      *   **Flaws & Smuggled Property:**
          *   **The Property Smuggle:** Despite explicitly stating *content* becomes the reader's property upon understanding, Fichte treats *form* as a *de facto* property right. The language of "theft" is inherently proprietarian. He argues the pirate deprives the author of the exclusive ability to present *this specific form* to the public – a core property-like exclusion right.
          *   **The Vulnerability:** His argument relies heavily on the romantic notion of the author's unique, irreproducible *Geist* (spirit/mind) being embedded in the form. This is philosophically contestable and historically specific. What about collaborative works? Works heavily edited by publishers? Formulaic writings? Does "form" truly become *less* unique or stealable then?
          *   **The Practical Gap:** It struggles to explain why the wrong is primarily against the *author*, not the *publisher* who holds the physical manuscript and commercial rights. If form is the author's unique property, why does the publisher get to sue? Fichte implicitly relies on a transfer *from* author to publisher.

  2.  **Kant's Mandate/Power of Attorney Theory:**
      *   **The Wrong:** Unauthorized reprinting is *not* theft of property. A book is an artifact (*opus mechanicum*) containing a *speech* (*operae*). The author speaks to the public *through* the publisher. An authorized publisher acts as the author's appointed agent. A pirate publisher *falsely presents themselves* as the author's agent without ever receiving this mandate. This is a wrong against the *author's person* – specifically, their right to control *who* speaks in their name to the public.
      *   **Strengths:**
          *   **Avoids the Property Smuggle:** This is its masterstroke. Kant explicitly rejects the book *as such* being property. He grounds the wrong in *personality* and *autonomy*: the author's right to control the *act of public communication* of their thoughts. The pirate commits a *fraud on the public* (misrepresenting the source/authority of the speech) and usurps the author's *personal right* to choose their mouthpiece.
          *   **Explains Publisher's Role:** It perfectly fits the historical reality your printer inhabits. The publisher is the *author's delegate*, exercising the mandate. The wrong of piracy is primarily against the author *via* the usurpation of the publisher's delegated authority. The publisher sues as the wronged agent.
          *   **Captures the Core Injury:** It identifies the essence of the harm: *loss of control* over how one's voice enters the public sphere. It's about agency and representation, not just loss of revenue or abstract form.
      *   **Flaws:**
          *   **Less Intuitive Link to "Theft":** For contemporaries steeped in natural property rights, framing it as impersonation rather than theft might seem less immediately compelling than Fichte's "they stole my words!" approach.
          *   **Scope:** Does it adequately cover the *commercial* harm to the publisher who invested in paper, typesetting, and distribution, beyond the author's personal right? Kant focuses on the author's right, with the publisher deriving standing from the mandate.

  **Why Kant Wins for Your Printer & Philosophically:**

  1.  **Truly Escapes Property:** Kant successfully avoids grounding the right against piracy in a property right *in the idea or its expression*. He locates it firmly in the *personal right* of the author to control the *performance* of their public communication. The pirate isn't stealing a *thing*; they are *fraudulently performing an act* reserved to the author or their delegate. This is more radical and philosophically pure.
  2.  **Fits the Historical Reality:** Kant's model perfectly mirrors the 1790s Leipzig trade. Publishers *were* acting as the author's agents, leveraging their networks to disseminate the author's words. The primary grievance *was* the usurpation of this role and the resulting deception of the public (who might think the pirate's inferior edition was authorized). Your printer's outrage would naturally align with this usurpation – the rival isn't just stealing profit, they are *stealing his role* as the author's chosen herald.
  3.  **Captures the Deeper Wrong:** Fichte focuses on the uniqueness of the *form*. Kant focuses on the uniqueness of the *author's will* regarding public utterance. The latter feels more fundamental. The wrong isn't just that someone copied my sequence of words; it's that someone *forced my words into the public sphere against my will and choice of agent*. It protects authorial autonomy in a more profound way.
  4.  **Addresses the "Proxy" Issue:** Your legal friend is right – *negotiorum gestio* (managing another's affairs without mandate) is the Roman law root. Kant brilliantly repurposes it. The pirate "manages" the author's affair (publication) without authority, potentially harming the author's interests and usurping their control. This provides a concrete legal-philosophical anchor Fichte lacks.
  5.  **Fichte's Ancestry is Overstated:** While Fichte's form/content split *resembles* idea/expression, modern copyright law's foundation is far more complex. Crucially, modern law *does* treat copyright as a property right (albeit limited), which Fichte's theory facilitates but Kant's explicitly rejects. The *moral* core of authorial control over disclosure and attribution in Continental copyright (droit d'auteur) aligns *more* closely with Kant's personality-based mandate than with Fichte's quasi-property in form.

  **Verdict for Your Novel:**

  Put **Kant's argument** in your printer's mouth. It's the more philosophically robust foundation, genuinely escaping the property trap Fichte stumbles into. It resonates powerfully with the historical context of publishers as authorial agents. His pamphlet should rage against the pirate's *arrogant usurpation* of the sacred trust between author and publisher. The pirate isn't just a thief; he's an *imposter*, falsely donning the mantle of the author's chosen representative, deceiving the public, and violating the author's fundamental right to control their own voice in the public square. This provides a deeper, more principled, and historically authentic "moral suasion" than a complaint about stolen "form."

  **Key phrases for your printer:** "Usurping my mandate!", "Speaking in the author's name without his voice!", "Deceiving the public as to the source!", "Violating the sacred trust of agency!", "Managing the author's affairs without his consent!" Frame it as a defense of authorial dignity and the integrity of the communicative act, not merely the protection of a commercial asset or a unique sequence of words. This elevates it above "commercial huffing" into a genuine defense of the intellectual order itself.
