  I need to carefully reconstruct Augustine's argument here. Let me start with the logical puzzle. Augustine presents four different definitions of lying: (1) will to utter falsehood, (2) will to deceive, (3) will that falsehood be believed, and (4) will to utter falsehood specifically to deceive. Each definition gives a different verdict on the two travelers:

  For the first traveler (who says "no robbers" to prevent travel): 
  - Under definition 1: he willed to say false thing → lied
  - Under definition 2: he willed not to deceive → not lie
  - Under definition 3: he willed a true belief (about safety) → not lie? Wait no, actually he willed the false utterance to be believed as true? This is tricky.

  For the second traveler (who says "robbers" to cause harm):
  - Under definition 1: he said true thing → not lie? 
  - Under definition 2: he willed to deceive → lied
  - Under definition 3: he willed false belief → lied

  The complexity comes from how "will" interacts with belief states. The first traveler intends his false statement to be disbelieved, while the second intends his true statement to be disbelieved. This creates tension between what is said, what is believed, and what the speaker intends about belief.

  Now for the ethical puzzle: Augustine's concession that the first traveler "has not sinned" seems to conflict with his later absolutism. But I recall that in early works like De Mendacio, Augustine was still developing his position. He makes a distinction here between the material falsehood and the formal lie. The first traveler utters a falsehood but without the intent to deceive - in fact, with intent to prevent deception. So Augustine might see this as materially false but not formally a lie under some definitions. 

  However, in his later Contra Mendacium, Augustine rejects all intentional falsehoods regardless of intent. So this passage likely represents an intermediate stage where he was grappling with definitions before settling on his strict view. The key is that even here, Augustine isn't endorsing the falsehood - he's just observing that under certain definitions it might not qualify as a "lie" while still being problematic as an intentional falsehood.

