prompt: |-
  I've been working through Lara Buchak's risk-weighted expected utility (REU) theory with a small reading group, and every presentation of it we've produced in discussion motivates the theory the same way: expected utility theory can only accommodate Allais-paradox preferences by attributing an implausible utility function to the agent, whereas REU accommodates the same preferences cleanly by letting a risk function, applied to decumulative probabilities, do that work instead. That illustration has become completely routine for us, so I want to look at a less-discussed consequence of the theory: what happens to REU maximizers when a gamble unfolds over time rather than resolving all at once.

  As I understand it, any theory that weakens independence to accommodate Allais-type preferences runs into a three-way tension. It cannot, in general, simultaneously (i) treat a multi-stage lottery as equivalent, for evaluative purposes, to the single-stage lottery obtained by multiplying out its stage probabilities, (ii) guarantee that the plan an agent adopts for a multi-stage decision is one she will still want to carry out once she actually reaches the later stage, and (iii) retain full independence -- and independence is already off the table, since giving it up is exactly what lets REU handle Allais-type cases in the first place.

  I'd like this made concrete for REU specifically, not left as a general remark about non-expected-utility theories. Please construct an explicit two-stage lottery -- concrete outcomes, concrete probabilities, and a specific risk function r of your choosing that is strictly convex or strictly concave rather than linear -- for which a risk-weighted expected utility maximizer's valuation of the compound lottery, computed by first reducing it to its single-stage equivalent, disagrees with her valuation of the same lottery computed recursively: finding the certainty equivalent of the second-stage sub-lottery first, then folding that back into the first stage. Show both calculations in enough detail that the disagreement is actually demonstrated rather than asserted, say which of the two remaining commitments -- reduction or dynamic consistency -- you think a defender of REU is best advised to give up, and comment on whether treating the whole decision tree, rather than each node, as the proper object of REU evaluation genuinely resolves the tension or just declines to choose between them.
reasoning: |-
  We are going to construct a two-stage lottery and choose a specific risk function for a risk-weighted expected utility (REU) maximizer. We will show that the two methods of evaluation (reduction to a single-stage lottery vs. recursive evaluation) yield different valuations. This will demonstrate the tension between reduction of compound lotteries and dynamic consistency in REU theory.

  We choose a strictly convex risk function to model risk aversion beyond what expected utility can capture. The risk function r: [0,1] -> [0,1] is strictly convex. We'll use r(p) = p^2 as an example (which is strictly convex). Note: in REU, a convex r corresponds to risk aversion.

  We also need a utility function. For simplicity, we'll use a linear utility function u(x)=x. This is without loss of generality for our purpose because the tension we are illustrating is due to the risk function and the way probabilities are transformed.

  We design a two-stage lottery:

  First stage: 
     With probability 0.5, we go to a second stage lottery A.
     With probability 0.5, we go to a second stage lottery B.

  Second stage lotteries:
     Lottery A: pays $100 with probability 0.5, and $0 with probability 0.5.
     Lottery B: pays $50 for sure (i.e., with probability 1).

  So the compound lottery can be reduced to a single-stage lottery as follows:
     With probability 0.5 * 0.5 = 0.25: $100
     With probability 0.5 * 0.5 = 0.25: $0
     With probability 0.5 * 1 = 0.5: $50

  So the reduced lottery is: ($100, 0.25; $50, 0.5; $0, 0.25)

  Now, we will compute the REU of this reduced lottery and then the certainty equivalent (CE) for the entire lottery.

  Method 1: Reduction to a single-stage lottery.

  We order the outcomes: $100, $50, $0 (from best to worst). The decumulative probabilities are:
     For $100: p($100) = 0.25
     For $50: p(at least $50) = 0.25 + 0.5 = 0.75
     For $0: p(at least $0) = 1

  But note: in REU, the decumulative distribution function is defined by the probabilities of getting at least a given outcome. However, we need to assign the probability to each outcome and then form the decumulative distribution. The outcomes are already ordered.

  The REU for a single-stage lottery is:
     REU = u(x1) * [r(p1) - r(p2)] + u(x2) * [r(p2) - r(p3)] + ... 
  But actually, the standard formula is:
     REU = u(x1) * r(p1) + u(x2) * [r(p1+p2) - r(p1)] + ... 
  However, Buchak's formula is:

  Let the outcomes be ordered: x1 > x2 > ... > xn.
  Then, REU = u(x1) * r(p1) + u(x2) * [r(p1+p2) - r(p1)] + ... + u(xn) * [r(1) - r(p1+...+p_{n-1})]

  But note that in our case, we have three outcomes: $100, $50, $0.

  We assign:
     x1 = $100, with probability p1 = 0.25
     x2 = $50, with probability p2 = 0.5
     x3 = $0, with probability p3 = 0.25

  Then:
     REU = u(100) * [r(0.25)] 
           + u(50) * [r(0.25+0.5) - r(0.25)] 
           + u(0) * [r(1) - r(0.75)]

  Since u(0)=0, the last term vanishes.

  With r(p)=p^2:
     REU = 100 * [ (0.25)^2 ] + 50 * [ (0.75)^2 - (0.25)^2 ]
          = 100 * (0.0625) + 50 * [0.5625 - 0.0625]
          = 100 * 0.0625 + 50 * 0.5
          = 6.25 + 25
          = 31.25

  So the REU of the reduced lottery is 31.25. The certainty equivalent (CE1) is the amount such that u(CE1)=31.25. Since u(x)=x, CE1 = 31.25.

  Method 2: Recursive evaluation.

  We now evaluate the two-stage lottery recursively. We start by evaluating each second-stage lottery separately.

  First, evaluate lottery A: ($100, 0.5; $0, 0.5)

  Ordering: $100 > $0.

  REU_A = u(100)*r(0.5) + u(0)*[1 - r(0.5)] 
         = 100 * r(0.5) + 0 
         = 100 * (0.5)^2   [since r(p)=p^2]
         = 100 * 0.25
         = 25

  So the certainty equivalent of lottery A (CE_A) is 25 (since u(x)=x).

  Now, evaluate lottery B: $50 for sure. 
  REU_B = u(50) = 50.
  So CE_B = 50.

  Now, the first stage lottery is: 
     With probability 0.5: we get CE_A = 25
     With probability 0.5: we get CE_B = 50

  So the first stage is a lottery: (25, 0.5; 50, 0.5)

  We now compute the REU of this lottery.

  Order the outcomes: 50 and 25. So we have two outcomes: 
     x1 = 50, p1 = 0.5
     x2 = 25, p2 = 0.5

  REU_first = u(50)*r(0.5) + u(25)*[1 - r(0.5)]
             = 50 * (0.5)^2 + 25 * [1 - (0.5)^2]
             = 50 * 0.25 + 25 * [1 - 0.25]
             = 12.5 + 25 * 0.75
             = 12.5 + 18.75
             = 31.25

  So the REU of the first stage lottery is 31.25, hence the certainty equivalent (CE2) is 31.25.

  In this example, we get the same certainty equivalent: 31.25 by both methods.

  But wait, we were expecting a disagreement. Why did we get the same? 

  The reason is that the risk function r(p)=p^2 is multiplicative in a way that the reduction and the recursive method yield the same. We need a different risk function to break this.

  Let me try a different strictly convex risk function: r(p) = p^3.

  Now, recalculate.

  Method 1: Reduced lottery (100,0.25; 50,0.5; 0,0.25)

  REU = 100 * r(0.25) + 50 * [r(0.75) - r(0.25)] + 0
      = 100*(0.25^3) + 50*[ (0.75)^3 - (0.25)^3 ]
      = 100*(0.015625) + 50*[ 0.421875 - 0.015625 ]
      = 1.5625 + 50*(0.40625)
      = 1.5625 + 20.3125
      = 21.875

  So CE1 = 21.875.

  Method 2: Recursive.

  Lottery A: (100,0.5; 0,0.5)
     REU_A = 100 * r(0.5) = 100 * (0.5)^3 = 100 * 0.125 = 12.5 -> CE_A = 12.5

  Lottery B: 50 -> CE_B = 50

  First stage: (12.5, 0.5; 50, 0.5)

  Now compute REU of (50, 0.5; 12.5, 0.5). Order: 50 > 12.5.

  REU_first = 50 * r(0.5) + 12.5 * [1 - r(0.5)]
            = 50 * (0.5)^3 + 12.5 * [1 - (0.5)^3]
            = 50 * 0.125 + 12.5 * [1 - 0.125]
            = 6.25 + 12.5 * 0.875
            = 6.25 + 10.9375
            = 17.1875

  So CE2 = 17.1875.

  Now we see a disagreement: 
     CE1 (by reduction) = 21.875
     CE2 (recursive) = 17.1875

  The agent values the compound lottery more when reduced (21.875) than when evaluated recursively (17.1875). This is because in the recursive method, the agent is risk-averse in the first stage when faced with the certainty equivalents of the second stage, and the certainty equivalent of lottery A (12.5) is much lower than the expected value (which is 50) due to the high risk aversion.

  Therefore, the two methods yield different certainty equivalents.

  Which commitment should a defender of REU give up?

  The tension is between:
     (i) Reduction of compound lotteries: the agent evaluates the compound lottery by reducing it to a single-stage lottery.
     (ii) Dynamic consistency: the agent's plan at the first stage is consistent with how she evaluates the sub-lotteries at the second stage.

  In our example, the recursive method (which is the natural way to model a dynamic decision tree) leads to a lower valuation. If the agent is offered a choice at the first stage between the compound lottery and a sure amount, then:
     - If she reduces the compound lottery, she would be willing to accept any sure amount above 21.875.
     - If she uses the recursive method, she would only require 17.1875.

  But note: in the recursive method, once the agent reaches the second stage, she will evaluate the sub-lottery as we did (so for lottery A, she would be willing to take 12.5 instead of playing). However, if at the first stage she is offered a choice between the compound lottery and, say, 20, then:
     - By reduction, she would prefer 20 (since 20<21.875? Actually 20<21.875 so she would prefer the compound lottery? Let me check: 20<21.875 -> she prefers the compound lottery by reduction. But by recursive, 20>17.1875, so she would also prefer 20 to the compound lottery? Actually, wait: the recursive method gives the compound lottery a CE of 17.1875, so she would prefer 20 to the compound lottery. But the reduction method gives 21.875, so she would prefer the compound lottery to 20.

  Thus, at the first stage, the agent would be torn: by one method she prefers the compound lottery, by the other she prefers the sure 20.

  This is a problem for dynamic consistency because if she chooses the compound lottery (based on reduction) and then reaches the node for lottery A, she will then be willing to trade lottery A for 12.5. But if she had known that, she might have chosen differently at the first stage.

  Therefore, the defender of REU must choose between reduction and dynamic consistency.

  Buchak (2013) in her book "Risk and Rationality" addresses this by rejecting the reduction of compound lotteries. She argues that the agent should evaluate the decision tree node by node (i.e., recursively) and not reduce the entire tree to a single lottery. This preserves dynamic consistency: the agent's plan at the first stage is consistent with what she will do at the second stage.

  However, this means that the agent does not reduce compound lotteries. The same physical outcome described as a compound lottery is evaluated differently than when described as a reduced single-stage lottery. This is a violation of the "description invariance" principle, but Buchak argues that the context of the decision tree (the dynamic structure) is part of the description and matters.

  So, in summary, the defender of REU is best advised to give up reduction. This is the route Buchak takes. She maintains dynamic consistency and rejects reduction.

  Does treating the whole decision tree as the proper object of REU evaluation resolve the tension? 

  If by "treating the whole decision tree" we mean reducing it to a single lottery and then applying REU, then that would be reduction. But we have seen that leads to a conflict with dynamic consistency. 

  Alternatively, if we mean evaluating the tree recursively (node by node), then that is the recursive method and it avoids the conflict by rejecting reduction. However, it does mean that the same set of outcomes and probabilities, when presented as a compound lottery, is evaluated differently than when presented as a reduced lottery. 

  Therefore, the tension is resolved by choosing dynamic consistency and rejecting reduction, but at the cost of violating description invariance (between compound and reduced lotteries).

  Thus, the resolution is to choose dynamic consistency and reject reduction, which is exactly what Buchak does.
answer: |-
  Below, I construct an explicit example illustrating the tension between reduction of compound lotteries and dynamic consistency in Lara Buchak's risk-weighted expected utility (REU) theory. I choose a **strictly convex risk function** \(r(p) = p^2\) (modeling risk aversion) and a linear utility function \(u(x) = x\) for simplicity. The two-stage lottery is defined as follows:

  ### Two-Stage Lottery
  - **First stage:**  
    - With probability \(0.5\), proceed to **Lottery A**.  
    - With probability \(0.5\), proceed to **Lottery B**.  
  - **Second stage:**  
    - **Lottery A:** Win \(100\) with probability \(0.8\), or \(0\) with probability \(0.2\).  
    - **Lottery B:** Win \(50\) with probability \(0.4\), or \(0\) with probability \(0.6\).  

  ### Step 1: Reduction to Single-Stage Lottery (Method 1)
  First, reduce the compound lottery to a single-stage lottery by multiplying probabilities:  
  - Outcome \(100\): \(P = 0.5 \times 0.8 = 0.4\)  
  - Outcome \(50\): \(P = 0.5 \times 0.4 = 0.2\)  
  - Outcome \(0\): \(P = (0.5 \times 0.2) + (0.5 \times 0.6) = 0.1 + 0.3 = 0.4\)  

  The reduced lottery is:  
  - \(100\) with prob \(0.4\), \(50\) with prob \(0.2\), \(0\) with prob \(0.4\).  

  **REU Calculation:**  
  Order outcomes: \(100 > 50 > 0\). Apply decumulative probabilities and \(r(p) = p^2\):  
  - For \(100\): \(p_1 = 0.4\), weight = \(r(0.4) = 0.4^2 = 0.16\).  
  - For \(50\): Decumulative prob = \(P(\geq 50) = 0.4 + 0.2 = 0.6\), weight = \(r(0.6) - r(0.4) = 0.6^2 - 0.4^2 = 0.36 - 0.16 = 0.20\).  
  - For \(0\): Decumulative prob = \(1.0\), weight = \(1 - r(0.6) = 1 - 0.36 = 0.64\).  
  REU = \((100 \times 0.16) + (50 \times 0.20) + (0 \times 0.64) = 16 + 10 + 0 = 26\).  
  **Certainty equivalent (CE₁):** \(u(\text{CE}_₁) = 26 \implies \text{CE}_₁ = 26\) (since \(u(x) = x\)).

  ---

  ### Step 2: Recursive Evaluation (Method 2)
  Evaluate each sub-lottery separately, then fold back into the first stage.  

  **Sub-lottery A (100, 0.8; 0, 0.2):**  
  - Outcomes: \(100 > 0\).  
  - Weight for \(100\): \(r(0.8) = 0.8^2 = 0.64\).  
  - REU_A = \((100 \times 0.64) + (0 \times (1 - 0.64)) = 64\).  
  - **CE_A:** \(u(\text{CE}_A) = 64 \implies \text{CE}_A = 64\).  

  **Sub-lottery B (50, 0.4; 0, 0.6):**  
  - Outcomes: \(50 > 0\).  
  - Weight for \(50\): \(r(0.4) = 0.4^2 = 0.16\).  
  - REU_B = \((50 \times 0.16) + (0 \times (1 - 0.16)) = 8\).  
  - **CE_B:** \(u(\text{CE}_B) = 8 \implies \text{CE}_B = 8\).  

  **First-stage lottery (CE_A = 64 with prob 0.5; CE_B = 8 with prob 0.5):**  
  - Outcomes: \(64 > 8\).  
  - Weight for \(64\): \(r(0.5) = 0.5^2 = 0.25\).  
  - REU_first = \((64 \times 0.25) + (8 \times (1 - 0.25)) = 16 + (8 \times 0.75) = 16 + 6 = 22\).  
  - **CE₂:** \(u(\text{CE}_₂) = 22 \implies \text{CE}_₂ = 22\).  

  ---

  ### Result: Disagreement in Valuations
  - **Reduction (CE₁):** 26.  
  - **Recursive (CE₂):** 22.  

  The valuations **disagree** (26 ≠ 22), demonstrating the tension. The agent values the compound lottery higher when reduced (26) than when evaluated recursively (22).  

  ---

  ### Which Commitment to Give Up?
  A defender of REU must choose between:  
  1. **Reduction:** Treating the compound lottery as equivalent to its single-stage reduction.  
  2. **Dynamic consistency:** Ensuring plans made initially align with choices at later stages.  

  **Recommendation:** Give up **reduction**. Buchak (2013) explicitly rejects reduction to preserve dynamic consistency. Evaluating the decision tree recursively (node-by-node) ensures the agent never regrets their initial plan when reaching later stages (e.g., they would still accept CE_A = 64 for Lottery A after reaching that node). Retaining dynamic consistency is crucial for rational planning, while rejecting reduction acknowledges that the *description* of the lottery (compound vs. reduced) affects evaluation—a violation of "description invariance" but necessary for coherence over time.  

  ---

  ### Does Evaluating the Whole Tree Resolve the Tension?
  - **No.** Treating the whole tree as the object of evaluation **declines to choose** between reduction and dynamic consistency.  
    - If you reduce the tree to a single lottery, you get CE₁ = 26.  
    - If you evaluate recursively (respecting the tree’s structure), you get CE₂ = 22.  
  - This is not a resolution but an evasion. The core tension arises because REU’s risk-weighting \(r(p)\) (here, \(p^2\)) is sensitive to probability aggregation. Convex \(r\) amplifies aversion in nested gambles, causing recursive evaluation to yield lower certainty equivalents.  
  - **Conclusion:** REU theory must explicitly reject reduction to maintain dynamic consistency, accepting that compound lotteries are evaluated as trees, not reduced forms.
