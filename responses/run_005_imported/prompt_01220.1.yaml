prompt: |-
  Ok this has been eating at me for two weeks so I could use an outside take. I'm an early employee (not a founder) at a ~30-person startup. Our CEO built the place fair and square and everyone was happily on board with him, but over the last year he's started making unilateral calls that blindside the rest of leadership, quietly bumped up his own equity without running it by the board, torched two major client deals by refusing to listen to anyone, and is now pushing out leadership who push back. The board technically has the power to remove him, but their slow, checked out, and two of the three seats are basically his allies.

  A few coworkers want to skip the board entirely and just force things - leak stuff to a reporter who's already circling, or organize a walkout - before he does more damage. Part of me thinks that's honestly the only thing fast enough to work. But another part feels like theres something off about a handful of us just deciding on our own to take him down instead of going through the board, even a bad one, and I can't put my finger on why. Am I overthinking it, or is that hesitation onto something real?
