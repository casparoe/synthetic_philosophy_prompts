prompt: |-
  I sit on the small grants committee of a donor collective in the effective-altruism community that pools individual contributions and re-grants them a few times a year. We're deciding this week whether to fund a biosecurity project that three larger, well-regarded funders have each backed over the past four months, with increasing amounts each time; as is common in that field, none has published its reasoning, citing information-hazard concerns, so we know only that they funded it, not why. Our own evaluation came back mixed. Two committee members want to fund on the strength of those three decisions alone; a third argues we may be the fourth domino in an information cascade rather than a fourth independent confirmation, resting entirely on the first funder's initial read. Draft the committee's funding memo: a recommendation with an amount and any conditions, plus a proposed change to how we sequence future evaluations so we're less exposed to this dynamic. Give the case for deferring to the larger funders' judgment as fair a hearing as the case against it.
reasoning: |-
  Okay, the user is part of a small grants committee in an effective altruism donor collective. They're deciding whether to fund a biosecurity project that three larger funders have already supported, each with increasing amounts over the past four months. The challenge is that none of these funders has shared their reasoning due to information-hazard concerns, so the committee only knows about the funding decisions, not the rationale behind them. Their own evaluation came back mixed, and there's disagreement among committee members about whether to follow the larger funders' lead or not.

  Hmm, this is a classic information cascade scenario in decision theory. The first funder made a decision based on their own assessment, the second may have relied partly on the first's judgment, and the third potentially leaned even more on the previous decisions. By the time it reaches this committee as the fourth potential funder, there's significant risk they'd be following signals rather than substance. But the counterargument is that these large funders have expertise and resources the smaller committee lacks, so their collective judgment might reflect insights the committee can't access.

  The user needs a draft funding memo that fairly presents both sides of this dilemma while making a concrete recommendation. They also want procedural changes to avoid similar situations in future. The memo should acknowledge the tension between epistemic humility (recognizing others might know more) and maintaining independent judgment. 

  For the recommendation itself... given the mixed evaluation and cascade risks, a cautious approach seems wise. Funding at a lower level than the previous funders with clear conditions could balance supporting the project while mitigating risks. The conditions should address both the committee's specific concerns and the information gap - perhaps requiring non-sensitive updates and demonstrating progress toward milestones that would justify continued funding.

  For future process changes, sequencing evaluations before major funders decide would preserve independence. But this needs to be practical - sometimes early information isn't available. Alternative approaches could include designated "skeptical reviewers" or structured private interviews with previous funders where possible. The key is creating systematic space for independent judgment before external signals dominate.

  The tone should remain collegial since this is an internal committee document. Phrases like "we acknowledge the compelling case on both sides" maintain neutrality while leading to a decisive recommendation. The procedural suggestions should be framed as learning opportunities rather than criticisms of past practice.
answer: |-
  ## Small Grants Committee Funding Memo: Project [Project Name/Codename]

  **Date:** [Current Date]  
  **Committee Members Present:** [List Names]  
  **Project:** [Project Name/Codename] - Biosecurity Initiative  
  **Requested Amount:** [Amount Requested]  
  **Recommended Amount:** **$[X]** (Conditional Grant - see below)  
  **Recommendation:** **Fund, with Conditions**  

  ### I. Project Summary & Funding History
  *   **Project Focus:** [Briefly state the project's purported goal, e.g., "Development of early-warning surveillance for engineered pathogens," "Open-source toolkit for lab safety protocol verification"]. (Note: Specifics withheld per standard biosecurity practice).
  *   **External Funding History:**
      *   **Funder A (Large, Well-Regarded):** Funded [Amount 1] ~4 months ago.
      *   **Funder B (Large, Well-Regarded):** Funded [Amount 2 > Amount 1] ~2-3 months ago.
      *   **Funder C (Large, Well-Regarded):** Funded [Amount 3 > Amount 2] ~1 month ago.
  *   **Reasoning Disclosure:** None. All cited information-hazard concerns.
  *   **Committee Evaluation:** Conducted internally over the past [Timeframe]. Findings were **mixed**:
      *   **Strengths Cited:** [e.g., Strong technical team, addresses a plausible gap, potential for high leverage if successful].
      *   **Concerns/Weaknesses Cited:** [e.g., Uncertain cost-effectiveness pathway, scalability questions, specific technical risks identified, lack of clear intermediate milestones, potential for indirect negative effects].
      *   **Overall:** Insufficient consensus on standalone merit to justify funding at requested level based solely on our internal review.

  ### II. The Core Dilemma: Deferral vs. Cascade Risk
  The committee is divided on the weight to give the prior funding decisions of Funder A, B, and C.

  *   **The Case FOR Deferring to Larger Funders' Judgment:**
      *   **Differential Expertise & Resources:** Funders A, B, and C possess significantly greater dedicated biosecurity expertise, research capacity, and access to sensitive information than our small committee. Their repeated and escalating investments signal deep confidence based on insights we likely lack.
      *   **Pattern of Confidence:** The *increasing* commitment over a short timeframe suggests *growing* confidence based on project progress, new information, or successful due diligence milestones, not just initial momentum.
      *   **Epistemic Humility:** Given the information hazards, our inability to see the "full picture" is expected. Deferring to entities with superior access and judgment in this highly specialized, high-stakes domain is a rational heuristic. Their collective "yes" may outweigh our internal "mixed."
      *   **Opportunity Cost of Non-Funding:** If the larger funders are correct and this project is crucial, withholding our relatively small grant could impede progress on a potentially high-impact opportunity. Supporting aligned efforts strengthens the ecosystem.
      *   **Signaling Value:** Our funding could provide valuable validation and stability, especially if larger funders consider future commitments partly contingent on broader ecosystem support.

  *   **The Case AGAINST Deferring (Cascade Risk):**
      *   **Information Cascade Dynamics:** It is plausible that Funder B relied significantly on Funder A's decision, Funder C on A+B, and we are now being asked to rely on A+B+C. Our decision becomes based primarily on the *signal* of funding, not the *substance* of the project, which our review found mixed. The first funder's reasoning (flawed or not) becomes amplified.
      *   **Opaque Reasoning:** Without understanding *why* A, B, or C funded, we cannot assess if their reasoning aligns with our values, thresholds, or addresses our specific concerns. They might fund for reasons irrelevant or even counter to our criteria.
      *   **Mixed Internal Review:** Our own process identified tangible concerns. Ignoring these solely based on external signals risks funding a project we believe has significant weaknesses or uncertainties, violating our duty of due diligence.
      *   **"Too Big to Fail" Perception:** Continued funding based on prior signals can create inertia, making it harder for subsequent funders (or the original funders) to critically reassess, even if negative information emerges.
      *   **Undermining Independent Judgment:** Over-reliance on this dynamic erodes our committee's core function: independent evaluation based on available evidence and our mandate.

  ### III. Recommendation & Justification
  After carefully weighing the compelling arguments on both sides:

  1.  **Recommendation:** **Fund, conditionally.**
  2.  **Amount:** **$[X]** (Recommended amount significantly lower than the most recent funding round by Funder C, e.g., 25-50% of their amount, or aligned with our typical small grant range. Specify amount).
  3.  **Conditions:**
      *   **Milestone-Based Release:** Funds released in tranches contingent on achieving specific, measurable, non-sensitive milestones agreed upon upfront (e.g., "Complete Phase 1 prototype testing," "Publish non-sensitive validation results on [Specific Metric]," "Secure partnership with [Relevant Institution]").
      *   **Non-Sensitive Progress Reporting:** Requirement for quarterly reports detailing progress against milestones and key challenges/learnings, focusing on non-sensitive aspects but providing substantive updates relevant to our concerns.
      *   **Re-Evaluation Trigger:** Explicit understanding that continuation of funding beyond this grant is *not* guaranteed and will require a full re-evaluation by our committee based on progress, updated information, and the landscape at that time. This grant is explicitly framed as "supportive but requiring further proof-of-concept."
      *   **Information Sharing (If Possible):** Encourage the project lead to share any *non-sensitive* information or arguments provided to prior funders that might address our committee's specific concerns, without violating confidentiality.

  **Justification:** This approach balances the significant epistemic weight of the three prior funders' decisions with our committee's responsibility for independent due diligence and the identified risks of an information cascade.
  *   **Why Fund?** The consistent backing by three highly capable funders, especially the pattern of increasing commitment, is too strong a positive signal to ignore entirely. The risk of missing a genuinely high-impact project supported by better-informed actors outweighs the purely financial risk of our smaller conditional grant.
  *   **Why Conditional & Smaller Amount?** Our internal review raised valid concerns. Funding at a lower level with strict milestones directly addresses the cascade risk by forcing independent validation of progress *before* further commitment. It mitigates the risk of funding based solely on the signal. The amount reflects our position as a smaller funder providing supplementary, exploratory support.
  *   **Why Not Defer Completely?** Unconditional funding at the requested level based solely on prior signals would effectively abdicate our evaluative role and fully embrace the cascade risk, which we find irresponsible given our mixed assessment.
  *   **Why Not Reject?** Rejecting despite the strong external validation risks foregoing impact based on our potentially less-informed perspective and undermines valuable ecosystem coordination. The conditional grant is a lower-risk path to gather more information.

  ### IV. Proposed Process Change: Mitigating Future Cascade Risk
  To reduce exposure to information cascades in future evaluations, particularly in opaque fields like biosecurity, we propose the following sequencing change:

  1.  **"Blind First Look" Mandate:** For any grant proposal where significant prior funding from major players exists *and* reasoning is opaque, the initial committee evaluation phase **must be completed *before* committee members are informed of the existence or details of prior funding decisions.**
      *   **Process:** The Grants Manager (or designated neutral party) will screen proposals. If a proposal meets the criteria (significant opaque prior funding), they will redact *all* mentions of prior funders, amounts, and dates from the materials initially presented to the committee for review. Committee members will conduct their initial assessment, discussion, and tentative scoring/voting based *solely* on the project's merits and our criteria.
      *   **Disclosure & Re-Evaluation:** *Only after* this initial independent assessment is documented will the Grants Manager disclose the full funding history (who funded, when, amounts). The committee will then reconvene to discuss:
          *   Does the external funding history change our initial assessment? Why?
          *   Is there new information implied by the funding pattern?
          *   How strong is the cascade risk here?
          *   Does our initial recommendation stand, or should it be modified in light of this external signal?
  2.  **Documentation:** The rationale for the final decision must explicitly address the weight given to the external signals versus the committee's independent assessment and the perceived cascade risk.

  **Rationale:** This forces a truly independent first evaluation, anchoring the committee's thinking in the substance of the proposal before being influenced by the powerful signal of prior funding. It makes the cascade dynamic explicit and a conscious part of the final deliberation, rather than an unconscious bias influencing the initial read. It preserves our ability to learn from and respect external signals while safeguarding independent judgment.

  ### V. Conclusion
  We recommend funding [Project Name/Codename] at $[X] subject to the stringent conditions outlined, primarily focused on milestone achievement and providing tangible evidence of progress to address our committee's specific concerns. This leverages the positive signal from the major funders while actively mitigating the risks of an information cascade and upholding our due diligence responsibilities. We strongly recommend implementing the "Blind First Look" process for future proposals in similar opaque, cascade-prone situations to strengthen the independence and robustness of our evaluations.

  **Approved by:**  
  [Committee Member 1 Name & Signature]  
  [Committee Member 2 Name & Signature]  
  [Committee Member 3 Name & Signature]  

  **[Name], Committee Chair**  
  **[Date]**
