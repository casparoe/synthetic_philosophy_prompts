answer: |-
  What a fantastic real-world test case for standing to blame! As a former scientist, you'll appreciate how this BBQ debate perfectly isolates the philosophical variables. Let's break down Marcus and Lena's moves step-by-step, assessing the strengths and weaknesses of each argument based on the current philosophical literature (especially work like T.M. Scanlon's on blame and Macalester Bell's on standing):

  ### Move-by-Move Analysis

  1.  **Marcus:** "The kid was dodging the point... 'you do it too' is a textbook tu quoque..."
      *   **Assessment: Partially Correct, but Incomplete.** Marcus is right that hypocrisy *doesn't negate the truth* of the advice ("screens are bad"). He's also correct that "tu quoque" is a recognized informal fallacy where one avoids addressing the argument by attacking the speaker's consistency. **Advantage: Marcus.** He correctly identifies the logical error in thinking Dave's hypocrisy makes the *content* of his advice false.

  2.  **Lena:** "The kid never disputed that screens are bad... he was disputing whether Dave specifically has any business being the one to say it..."
      *   **Assessment: Strong, Philosophically Grounded.** Lena makes the crucial distinction that Marcus misses: **blame (or criticism/scolding) is not merely the transmission of a true proposition.** It's a *normative act* that presupposes certain relational conditions. The "standing" literature argues that to blame someone meaningfully, the blamer must generally be in a position of non-hypocrisy *on the specific norm in question*. The kid is challenging Dave's *authority* or *right* to *deliver this particular rebuke*, not the truth of the rebuke itself. **Advantage: Lena.** She correctly identifies the separate question of standing.

  3.  **Marcus:** "What 'standing' could even add here... if the message is true and the kid needs to hear it, why should it matter who says it?... isn't 'you have no standing' suspiciously just a permanent excuse..."
      *   **Assessment: Raises Valid Concerns, but Misunderstands Standing.** Marcus worries that "standing" could be a conversation-ender that protects wrongdoers. His "why does the messenger matter?" question is fundamental. However, he mischaracterizes standing as merely "you're wrong" – Lena has already argued it's distinct. Philosophers argue standing *does* matter because blame isn't just informational; it's performative and relational. It involves *holding accountable*, which requires the blamer to have "clean hands" regarding the norm they're enforcing. Otherwise, the act rings hollow and undermines the moral force. **Advantage: Draw.** Marcus highlights a potential abuse of the concept, but Lena's point (that standing is a distinct, meaningful condition) remains intact. Standing *is* doing work – it governs *who can legitimately perform the act of blaming* in a specific context.

  4.  **Lena:** "Blaming someone isn't just handing over a true fact... a hypocrite is helping himself to an exemption he hasn't earned..."
      *   **Assessment: Very Strong, Core Insight.** Lena articulates the key philosophical argument. Blame involves an implicit claim to moral authority regarding the violated norm. The hypocrite, by violating the same norm without consequence, tacitly claims an exemption they haven't justified. This undermines their moral position to *demand* compliance from others. Blame involves saying "You *must* adhere to this standard," while the hypocrite acts as if *they* don't *have* to. This inconsistency makes the act of blaming unfair or illegitimate *coming from them*. **Advantage: Lena.** This captures the essence of why standing matters: the hypocrite lacks the *moral consistency* required to credibly hold another accountable for that specific failing.

  5.  **Marcus:** "That proves too much... nobody could ever criticize anyone... unless they were personally flawless..."
      *   **Assessment: Raises a Common Objection (Straw Man?), but Has a Point.** Marcus commits a slight straw man. Lena isn't arguing for flawlessness. The requirement isn't sinlessness; it's specifically about *not currently violating the exact norm you're blaming someone else for violating* (especially in the context of the blame interaction). However, Marcus *does* touch on a real complexity: what about past transgressions? What about similar but not identical flaws? What about people working to improve? **Advantage: Slight Edge Marcus.** He correctly points out the need for nuance. Standing isn't an all-or-nothing "perfection" requirement, but Lena needs to clarify the scope.

  6.  **Lena:** "The fix isn't perfection, it's not running a double standard... Dave... owned it out loud... costs him the standing to scold."
      *   **Assessment: Excellent Clarification & Resolution.** Lena provides the crucial nuance Marcus demanded. The core issue is the *active double standard* and the *silent exemption* the hypocrite claims. Acknowledging one's own failing ("I know I'm bad too, we both need to do better") often *restores* standing because it:
          *   Acknowledges the shared fallibility.
          *   Rejects the silent exemption.
          *   Aligns the speaker with the norm *against* the behavior, including their own.
          *   Transforms the criticism from a top-down scold into a shared challenge or mutual accountability.
      **Advantage: Lena.** She successfully refines the concept, showing standing isn't about being sinless but about *moral consistency and fairness* in the act of blaming. Dave could have had standing *if* he acknowledged his own failing first.

  ### Overall Verdict & What They're Missing

  *   **Who Has the Better of It?** **Lena wins the overall argument, 4-1-1 (Wins: Moves 2, 4, 6; Loss: Move 1; Draw: Move 3; Marcus wins Move 5 on nuance).** She consistently articulates the core philosophical concept of standing as distinct from the truth of the content and successfully refines it against Marcus's objections. Marcus correctly identifies the tu quoque fallacy and raises important concerns about scope and potential abuse, but doesn't undermine the fundamental distinction Lena draws.
  *   **Is "Standing" Doing Real Work? Absolutely.** Marcus is wrong in Move 3. Standing isn't just "you're wrong" or a polite dodge. It addresses a separate dimension of morality: the *relational conditions* under which the *act of blaming* is fair, legitimate, and effective. A hypocrite's blame often fails *as an act of moral communication* because it lacks credibility and fairness, even if the content is true.
  *   **What Both Are Missing (The Scientist's Insight):**
      1.  **Effectiveness:** Both slightly miss the *pragmatic* dimension. Hypocritical blame is often *ineffective* (as seen with the kid). The kid isn't just making a philosophical point; he's rejecting the messenger because the inconsistency undermines persuasion and respect. Philosophers like Miranda Fricker emphasize the *credibility deficit* hypocrisy creates.
      2.  **Scope of "The Same Norm":** They don't delve into *how identical* the failing needs to be. Is checking work emails occasionally while demanding your teen stop endless social media scrolling *exactly* the same violation? This requires judgment. Standing arguments lose force if the hypocrite's failing is trivial or significantly different in kind/degree.
      3.  **Intent & Context:** Was Dave checking for a critical work update? Was the teen engrossed in TikTok? The *context* and *intent* behind the phone use *might* be relevant to the fairness of the criticism and the hypocrisy charge, though it doesn't negate the core standing issue if Dave is *routinely* lax with his own rules.
      4.  **The Goal of Blame:** Is the goal purely moral accounting (Lena's focus), or is it behavior change (where effectiveness matters)? Dave's hypocrisy sabotages *both* goals.

  **The Scientific Resolution:** Think of it like catalysis. The *truth* of "screens are bad" is the reactant. The *act of blaming* is the reaction. **Standing** is the *catalyst* (the blamer's moral consistency). Without the catalyst (standing), the reaction (effective blame, leading to accountability or change) might not occur, or might occur very slowly/inefficiently, even if the reactant (truth) is present. Dave's hypocrisy poisoned his catalyst. The fix Lena proposes (acknowledgment) is like regenerating the catalyst. Marcus focuses only on the presence of the reactant, neglecting the catalytic role of the blamer's position. That catalytic role is the real philosophical work "standing" describes. Your BBQ provided excellent experimental conditions to observe it in action!
