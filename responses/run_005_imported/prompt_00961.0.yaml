  ### Lewis's Triviality Result: A Concrete Counterexample

  Consider a probability space with three possible worlds, each with positive probability:

  - **Worlds**: \(w_1\), \(w_2\), \(w_3\)  
  - **Probabilities**: \(P(w_1) = \frac{1}{3}\), \(P(w_2) = \frac{1}{3}\), \(P(w_3) = \frac{1}{3}\)  
  - **Events**:  
    - \(A\): "It is raining" = \(\{w_1, w_2\}\) (so \( \neg A = \{w_3\} \))  
    - \(B\): "The ground is wet" = \(\{w_1, w_3\}\) (so \(B\) is true at \(w_1\) and \(w_3\), false at \(w_2\))  

  We define the **indicative conditional** \(A > B\) ("If it is raining, the ground is wet") as a proposition:  
  - At worlds where \(A\) is true, \(A > B\) matches \(B\) (if it's raining, the conditional depends on whether the ground is wet).  
  - At worlds where \(A\) is false, \(A > B\) is defined arbitrarily (since the antecedent is false).  

  **Truth values**:  
  - \(w_1\): \(A\) true, \(B\) true \(\rightarrow\) \(A > B\) **true**  
  - \(w_2\): \(A\) true, \(B\) false \(\rightarrow\) \(A > B\) **false**  
  - \(w_3\): \(A\) false, \(B\) true \(\rightarrow\) \(A > B\) **true** (we set it to true for illustration, but the result holds regardless).  

  ---

  ### Step 1: Verify the Equation \(P(A > B) = P(B|A)\)
  - \(P(B|A) = P(B \cap A) / P(A) = P(\{w_1\}) / P(\{w_1, w_2\}) = \frac{1/3}{2/3} = \frac{1}{2}\).  
  - \(P(A > B) = P(\text{worlds where } A > B \text{ is true}) = P(\{w_1, w_3\}) = \frac{1}{3} + \frac{1}{3} = \frac{2}{3}\).  
  - **Problem**: \(\frac{2}{3} \neq \frac{1}{2}\)! The Equation fails.  

  To "fix" this, we might adjust the truth values. But Lewis requires that the Equation holds *and* **persists under conditionalization** (i.e., updating probabilities on new evidence). This is where the contradiction arises.  

  ---

  ### Step 2: Demand the Equation Holds Initially
  Suppose we redefine \(A > B\) at \(w_3\) to force \(P(A > B) = P(B|A) = \frac{1}{2}\):  
  - Set \(A > B\) **false** at \(w_3\). Now \(A > B\) is true only at \(w_1\), so:  
    \(P(A > B) = P(\{w_1\}) = \frac{1}{3}\).  
  - But \(P(B|A) = \frac{1}{2}\) (unchanged), so \(\frac{1}{3} \neq \frac{1}{2}\).  
  - Set \(A > B\) **true** at \(w_3\):  
    \(P(A > B) = \frac{2}{3} \neq \frac{1}{2}\).  
  **Conclusion**: No definition of \(A > B\) at \(\neg A\) worlds satisfies \(P(A > B) = P(B|A)\) for our setup.  

  But Lewis’s insight is deeper: even if we adjust probabilities to *force* \(P(A > B) = P(B|A)\) initially, **conditionalization breaks it**.  

  ---

  ### Step 3: Demand the Equation Holds After Conditionalization
  Suppose we assign probabilities to satisfy the Equation:  
  - Let \(P(w_1) = a\), \(P(w_2) = b\), \(P(w_3) = c\) (with \(a, b, c > 0\), \(a + b + c = 1\)).  
  - \(P(B|A) = P(\{w_1\}) / P(\{w_1, w_2\}) = a/(a + b)\).  
  - \(P(A > B) = P(\{w_1\}) + P(\{w_3\}) = a + c\) (if \(A > B\) is true at \(w_3\)).  
  - Set \(a + c = a/(a + b)\) to satisfy the Equation.  

  Now require that the Equation holds after conditionalizing on \(\neg A\) (i.e., given \(w_3\)):  
  - After conditionalizing on \(\neg A\), \(P_\text{new}(A) = 0\), so \(P_\text{new}(B|A)\) is undefined. But Lewis requires the Equation to hold for *any* new evidence **consistent with \(A\)** (i.e., \(E\) where \(A \cap E \neq \emptyset\)).  

  Conditionalize on \(E = \{w_1, w_3\}\):  
  - \(P_\text{new}(A) = P(A|E) = P(\{w_1\}) / P(E) = a/(a + c)\).  
  - \(P_\text{new}(B|A) = P(B|A \cap E) = P(B|\{w_1\}) = 1\) (since \(B\) is true at \(w_1\)).  
  - \(P_\text{new}(A > B) = P(A > B|E)\).  
    - At \(w_1\): \(A > B\) true (since \(A\) and \(B\) true).  
    - At \(w_3\): \(A > B\) true or false?  
      - If true: \(P_\text{new}(A > B) = 1\) (since both worlds satisfy it).  
      - If false: \(P_\text{new}(A > B) = P(\{w_1\}|E) = a/(a + c)\).  
  - To satisfy the Equation:  
    - If \(A > B\) true at \(w_3\): \(1 = 1\) (holds).  
    - If \(A > B\) false at \(w_3\): \(a/(a + c) = 1 \implies a = a + c \implies c = 0\) (contradiction).  

  Now conditionalize on \(E' = \{w_2, w_3\}\):  
  - \(P_\text{new}(B|A) = P(B|A \cap E') = P(B|\{w_2\}) = 0\) (since \(B\) false at \(w_2\)).  
  - \(P_\text{new}(A > B) = P(A > B|E')\):  
    - At \(w_2\): \(A > B\) false (since \(A\) true, \(B\) false).  
    - At \(w_3\): \(A > B\) true or false?  
      - If true: \(P_\text{new}(A > B) = P(\{w_3\}|E') = c/(b + c)\).  
      - If false: \(P_\text{new}(A > B) = 0\).  
  - To satisfy the Equation:  
    - If \(A > B\) true at \(w_3\): \(c/(b + c) = 0 \implies c = 0\) (contradiction).  
    - If \(A > B\) false at \(w_3\): \(0 = 0\) (holds).  

  **Contradiction**:  
  - From \(E = \{w_1, w_3\}\), we need \(A > B\) true at \(w_3\) to avoid \(c = 0\).  
  - From \(E' = \{w_2, w_3\}\), we need \(A > B\) false at \(w_3\) to avoid \(c = 0\).  
  **Impossible!** The conditional cannot be defined consistently at \(w_3\).  

  The only escape is if \(c = 0\) (i.e., \(w_3\) has probability 0), reducing the space to two worlds—but then \(A\) is certain (since \(P(A) = 1\)), making conditionals trivial.  

  ---

  ### Why This Matters for the Theory of Indicative Conditionals
  Lewis's result shows that **no non-trivial probability space** can simultaneously satisfy:  
  1. \(P(A > B) = P(B|A)\) (the Equation),  
  2. Preservation of the Equation under conditionalization (a core feature of rational updating).  

  This is devastating because:  
  - **Indicative conditionals express conditional beliefs** (e.g., "If it rains, the ground will be wet" reflects your confidence in a wet ground *given* rain).  
  - If the Equation cannot hold robustly (i.e., across updates), it cannot be a general theory of conditionals—it reduces them to trivial cases where the antecedent is certain.  
  - The result forces us to abandon either (1) the Equation as a *literal probability of a proposition*, or (2) the idea that conditionals are propositions at all (e.g., they might be dynamic update instructions).  

  Thus, the triviality is not a technical curiosity—it reveals a fundamental mismatch between intuitive conditional reasoning and classical probability theory.
