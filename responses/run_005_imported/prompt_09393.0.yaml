prompt: |-
  I don't have any formal training in philosophy, but over the past year I've become quite absorbed in the cosmological argument after following online debates about it — the kind where someone lays out the kalam version (everything that begins to exist has a cause, the universe began to exist, so the universe has a cause) and someone else objects that an infinite past isn't actually impossible. Wanting to see the argument before William Lane Craig's modern repackaging of it, I tracked down a free translation of the Summa Theologica and read through the question where Aquinas asks directly whether reason alone can prove that the world had a beginning. To my surprise, his answer is no: he says that's something held by faith, not demonstration, which already didn't match how I'd always heard "the cosmological argument" described. What really stopped me was a little further on, in his reply to an objection arguing that if the world were eternal, there would have to be an infinite chain of fathers begetting sons stretching back forever — supposedly just as impossible as an infinite chain of causes. Here is his reply in full, from that translation (this is Summa Theologica I, Question 46, Article 2, Reply to Objection 7, in the old Dominican Fathers translation):

  "In efficient causes it is impossible to proceed to infinity per se—thus, there cannot be an infinite number of causes that are per se required for a certain effect; for instance, that a stone be moved by a stick, the stick by the hand, and so on to infinity. But it is not impossible to proceed to infinity "accidentally" as regards efficient causes; for instance, if all the causes thus infinitely multiplied should have the order of only one cause, their multiplication being accidental, as an artificer acts by means of many hammers accidentally, because one after the other may be broken. It is accidental, therefore, that one particular hammer acts after the action of another; and likewise it is accidental to this particular man as generator to be generated by another man; for he generates as a man, and not as the son of another man. For all men generating hold one grade in efficient causes—viz. the grade of a particular generator. Hence it is not impossible for a man to be generated by man to infinity; but such a thing would be impossible if the generation of this man depended upon this man, and on an elementary body, and on the sun, and so on to infinity."

  I have reread this more times than I want to admit, and I still can't pin down what is actually doing the work in the per se/accidental distinction. On the surface, both the stick-hand-stone chain and the father-son chain look like one thing causing the next thing in a line, so why does the first need a starting point and the second not? The hammer example confused me even further, since it sounds like Aquinas is saying the hammers were never really one causal series in the first place — and I don't see why that same move couldn't be made about the stick and the hand. I would also like to understand how much this passage is really carrying: is this distinction the actual reason Aquinas doesn't need the universe to have a beginning in time, unlike the kalam argument, or is it a narrower point that just happens to live in this section? And separately, his "argument from contingency" elsewhere in the same work (the one about possible versus necessary beings) often gets treated as interchangeable with this one — does it rely on the same per se/accidental machinery, or does it sidestep the issue entirely? I would rather get a close reading of what Aquinas is actually claiming here than the usual capsule summary of "the Five Ways."
reasoning: |-
  Okay, let me start by unpacking the user's query. They're diving deep into Aquinas's cosmological argument, specifically the per se vs. accidental distinction in causal chains. The user mentions their surprise that Aquinas doesn't think reason alone can prove the world had a beginning, which contrasts with modern versions like the Kalam. They're stuck on that passage in Summa Theologica I, Q46, A2, Reply to Objection 7, especially the difference between the stick-hand-stone chain and the father-son chain. 

  First, I need to recall Aquinas's framework. His rejection of infinite regress in per se causal chains is crucial. The user is confused why one chain requires a start and the other doesn't. The hammer example adds to their confusion. They also wonder if this distinction is why Aquinas doesn't need a temporal beginning and how it relates to the argument from contingency.

  The user's background is self-taught, following online debates, so they might lack formal training in medieval philosophy. Their frustration is clear—they've reread the passage multiple times. Their deeper need is to grasp Aquinas's reasoning beyond simplified summaries. They want a close reading, not just the Five Ways recap.

  Breaking down the per se chain: Aquinas uses the example of a hand moving a stick moving a stone. Here, each cause depends on the prior simultaneously. The stick's movement now depends on the hand moving it now. If the hand stops, the stick stops. This is a hierarchical series where all causes act at once. An infinite regress here is impossible because you'd never have the first mover enabling the current motion. So, a necessary first cause is required.

  Now, the accidental chain: father-son succession. Each father causes the son's existence, but once the son exists, he can cause the next without the grandfather. The causes are non-simultaneous and each is a complete cause in their own right. The grandfather's existence isn't needed for the father to beget the son. Each generation operates independently at the time of begetting. Hence, an infinite past here is possible because no current cause relies on an infinite past chain.

  The hammer example: multiple hammers used by one artisan. Each hammer is broken and replaced. The artisan is the primary cause, and the hammers are accidental instruments. The breaking of one hammer doesn't stop the artisan's work because another hammer is used. The causal power comes from the artisan, not the hammers themselves. This shows that when a primary cause uses multiple instruments accidentally, the series isn't per se dependent.

  The user's confusion about applying this to the stick-hand chain: in that case, the hand isn't a primary cause like the artisan. The hand is part of the chain itself, each link depending on the prior. Without the hand, the stick doesn't move. But the artisan can switch hammers because the causal power is inherent in the artisan, not the hammers.

  Regarding the cosmological argument: Aquinas's Third Way (contingency) doesn't rely on temporal beginnings. It focuses on whether contingent beings exist now, requiring a necessary ground. The per se distinction explains why some causal chains need a first cause without denying an eternal universe. The Kalam, however, insists on a temporal beginning, which Aquinas rejects as indemonstrable by reason.

  The user also asks if the argument from contingency uses the same machinery. The Third Way deals with dependency in existence, not motion. Contingent beings depend on a necessary being for their existence. This is a per se hierarchy, not a temporal series. So, while related in requiring a first cause, it's a different application.

  The user's deeper need is clarity on Aquinas's nuanced reasoning, avoiding modern misinterpretations. They want to understand how his arguments allow for an eternal universe while still proving God. Highlighting the difference between simultaneous dependency and temporal succession is key. Emphasizing that Aquinas separates faith (temporal beginning) from reason (first cause) addresses their surprise at his stance.
answer: |-
  This passage reveals a crucial but often overlooked nuance in Aquinas's thought. Your confusion is understandable—Aquinas is drawing a distinction that modern discussions frequently flatten. Let's break it down systematically:

  ### 1. The Core Distinction: *Per Se* vs. Accidental Causal Series
  *   **Per Se (Essential/Ordered) Series:**  
      This is a **hierarchical, simultaneous dependency chain** where all causes must act *right now* to produce the *present effect*.  
      - **Example:** Hand → Stick → Stone (moving *now*).  
      - **Key Features:**  
          - **Simultaneity:** The hand moves the stick *at the same time* the stick moves the stone.  
          - **Dependency:** The stick's power to move the stone *derives entirely and immediately* from the hand's current action. Remove the hand, and the stick ceases to move the stone *instantly*.  
          - **Transitivity:** The stone is moved *by the stick*, but ultimately *by the hand* (the primary cause).  
      - **Why no infinite regress?** If the chain were infinite, there would be no ultimate source of motion/being *right now*. Every cause would depend on a prior cause *at this moment*, leading to no actual cause operating. A first mover (*Primum Movens*) is required to ground the entire series *in the present*.

  *   **Accidental (Per Accidens/Ordered) Series:**  
      This is a **linear, temporal succession** of causes, each operating *independently* in its own time.  
      - **Example:** Grandfather → Father → Son (in begetting).  
      - **Key Features:**  
          - **Non-Simultaneity:** The grandfather begets the father *in the past*. The father begets the son *later*. The grandfather's causal act is *over* when the father begets.  
          - **No Essential Dependency:** The father's power to beget *does not derive* from the grandfather *at the moment of begetting*. The father acts *as a man* (using his own inherent generative power), not *as the son of his father*.  
          - **No Transitivity:** The son is begotten *by his father*, not *by his grandfather*. The grandfather causes the *existence of the father*, who then causes the *existence of the son* as a separate act.  
      - **Why infinite regress *is* possible?** Each cause (each father) is a **complete, sufficient cause** in its own right when it acts. Its existence *was* caused by a prior cause, but that prior cause's action is *not required* for the current cause to operate. The chain is a sequence of independent causes, not a present hierarchy. An infinite past sequence of such causes doesn't undermine the operation of the *current* cause.

  ### 2. Demystifying the Hammer Example
  *   The artisan (primary cause) uses many hammers *over time* because they break.
  *   **Why is this "accidental"?**  
      - The causal power comes from the **artisan alone**.  
      - The hammers are interchangeable instruments.  
      - Hammer #1 breaking and being replaced by Hammer #2 is *accidental* (incidental) to the artisan's causal action.  
      - The *power* to hammer resides in the artisan, not in the sequence of hammers. Hammer #2 doesn't depend on Hammer #1 *for its power*; it depends only on the artisan wielding it *now*.
  *   **Contrast with Stick/Hand:**  
      The stick *does* depend on the hand *for its power to move the stone at this moment*. The stick is not an interchangeable instrument *in the same way*; it's a *necessary intermediary* in the *per se* chain. The hand's power *must* flow through the stick *now*.

  ### 3. Why This Distinction Matters for Aquinas's Cosmology
  *   **Not About Temporal Origins:** Aquinas explicitly states (as you noted) that reason *cannot* prove the world *began in time*. This distinction is **crucial** to that position.
  *   **About Present Dependency:** Aquinas's cosmological arguments (especially the First and Second Ways) focus on *presently existing* motion/contingency requiring a *presently existing* First Cause. A *per se* series (like the universe's dependence on a sustaining cause *right now*) **must** terminate in an uncaused cause. An *accidental* series (like past temporal causes) **can** be infinite without undermining the current cause.
  *   **The Universe Itself:** For Aquinas, the universe's existence *at this moment* depends on God as its sustaining cause (*per se* dependence). Whether this dependence stretches back infinitely *in time* (an accidental series of past states) is irrelevant to the need for a First Cause *now*. The Kalam conflates temporal beginning with causal dependency in a way Aquinas rejects.

  ### 4. Connection to the "Argument from Contingency" (Third Way)
  *   **Same Logical Structure, Different Focus:** The Third Way relies *entirely* on the *per se* principle, applied to *existence itself* rather than motion.
  *   **How it Works:**  
      1.  Contingent beings exist (things that could not-exist).  
      2.  If *everything* were contingent, then *right now*, there would be nothing to cause/sustain existence (since all contingent things depend on something else *for their existence* – a *per se* dependence).  
      3.  But things *do* exist now.  
      4.  Therefore, there *must* exist a Necessary Being (whose existence is not dependent on anything else) *right now*.
  *   **Sidesteps Temporal Regress?** Absolutely. It doesn't care about past time. It asks: "Given that contingent things exist *now*, what grounds their existence *at this very moment*?" An infinite past chain of contingent causes would *still* require a Necessary Being *now* to ground the *present* existence of the entire chain. The *per se* dependence is simultaneous, not temporal.

  ### In Summary: What Aquinas is Claiming Here
  1.  **Not All Infinite Chains Are Equal:** An infinite chain of *simultaneously operating, essentially dependent causes* (*per se*) is impossible. It requires a first cause *here and now*.  
  2.  **Temporal Chains Are Different:** An infinite chain of *past, independently operating causes* (like fathers begetting sons) *is* possible. Each cause acts on its own inherent power when its time comes.  
  3.  **God is the First Cause *Now*:** The cosmological argument proves God as the uncaused cause sustaining *present* existence/motion, regardless of whether the universe had a temporal beginning (which is a matter of faith for Aquinas).  
  4.  **The Contingency Argument Reinforces This:** It applies the *per se* dependency principle directly to existence, proving a Necessary Ground *at this moment*, independent of temporal history.

  Your instinct to go beyond "capsule summaries" is spot on. Aquinas's subtlety is lost in popular debates. His rejection of a demonstrable temporal beginning and his distinction between types of causal series are fundamental to understanding why his arguments differ profoundly from modern versions like the Kalam. The *per se/accidental* distinction isn't just a quibble; it's the structural backbone allowing him to argue for a First Cause *without* requiring a temporal beginning.
