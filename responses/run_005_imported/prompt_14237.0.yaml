answer: |-
  You've pinpointed the exact crux where the Dutch Book Argument (DBA) transitions from mathematical theorem to normative force – and where the most sophisticated debates lie. Let's break down the depragmatized move and its persistent challenges at the level you need.

  **The Depragmatized Core: Shifting the Defect from Loss to Inconsistent Valuation**

  The key move of Christensen, Maher, and others is to argue that **susceptibility to a Dutch Book is merely a *symptom* of a deeper, purely doxastic/evaluative inconsistency inherent in the incoherent credence function itself.** The betting scenario isn't *constitutive* of the irrationality; it's just a particularly vivid *demonstration* of an inconsistency that exists independently of any actual betting scenario or bookie.

  Here's the granular breakdown of the underlying inconsistency:

  1.  **Credences as Valuations of Truth:** A credence `Cr(A) = x` is interpreted as the agent's *evaluation* of how likely it is that proposition `A` is true. More precisely, it represents the *fair price* (in units of epistemic utility or normalized currency) the agent assigns to a contract paying 1 util/dollar if `A` is true and 0 if `A` is false. Crucially, this valuation is seen as a core aspect of the agent's doxastic state.

  2.  **Fairness and the Agent's Own Lights:** When the agent deems a bet fair (or favorable) based on their credences, it means that, *according to their own evaluation of truth*, the expected value (EV) of the bet is non-negative. This reflects a judgment about the relationship between the cost of the bet and the value of the potential payout, *as they see the world*.

  3.  **The Inconsistency Revealed (Not Caused) by the Book:** The Dutch Book Theorem shows that for an incoherent `Cr`, there exists a *finite set* of bets `B1, B2, ..., Bn` such that:
      *   **Individually Fair/Favorable:** By `Cr`, `EV(Bi) >= 0` for each individual bet `Bi`.
      *   **Collectively Disastrous:** The net effect of accepting *all* bets `B1...Bn` is a guaranteed loss `L > 0` no matter which possible world obtains.

  4.  **The Underlying Doxastic Inconsistency:** The depragmatizer argues this situation reveals a fundamental inconsistency *within the agent's own system of valuations*:
      *   The agent is simultaneously committed to the judgment that `B1` is a fair/good deal, `B2` is a fair/good deal, ..., `Bn` is a fair/good deal.
      *   Yet, the agent is *also* committed (by the same credences, via the Dutch Book construction) to the judgment that the *package deal* `[B1 & B2 & ... & Bn]` is a *terrible* deal, guaranteeing a loss `L`.
      *   **The Crucial Point:** This package deal `[B1 & B2 & ... & Bn]` is equivalent to a single, complex bet contract defined by the sum of the individual bet payoffs. The agent's own credences `Cr` simultaneously *endorse* each component of the package when considered in isolation (deeming them fair/good) but *condemn* the logically necessary consequence of accepting all components together (a guaranteed loss). Their valuations are inconsistent *across different descriptions or combinations of the same underlying commitments*.
      *   **The Nature of the Defect:** The irrationality lies in holding a set of evaluations that cannot be *jointly satisfied* without leading to a valuation catastrophe *by the agent's own standards*. It's a form of *self-defeating valuation*. The agent's own truth-evaluations sabotage themselves when combined. This is analogous to having preferences that are intransitive (A>B, B>C, C>A) – the irrationality is in the internal inconsistency of the evaluations, not in whether anyone exploits it.

  5.  **Bracketing the Betting Apparatus:** The depragmatizer insists we can see this inconsistency purely in terms of the agent's *evaluative commitments* regarding the truth of propositions:
      *   `Cr` commits the agent to valuing the prospect of `A` being true at `x`.
      *   The Dutch Book construction reveals that these individual valuations entail that the agent *must* value the prospect of a certain complex event (the guaranteed loss scenario) negatively, *while simultaneously valuing the components that lead to it non-negatively*.
      *   The inconsistency is in the *relationship between these valuations derived from `Cr`*. The betting scenario is just one way to *manifest* this conflict in valuations. The core defect is the *impossibility* of the agent's valuations being jointly accurate guides to the value of truth-dependent prospects without leading to a contradiction in their own terms.

  **Why Some Formal Epistemologists Remain Unconvinced: Relocation or Resolution?**

  Critics argue the depragmatized move doesn't fully escape the pragmatic taint; it often just relocates the difficulty. Here are the main lines of skepticism:

  1.  **The Lingering Ghost of Pragmatics:** Critics charge that the very *concept* of "valuation," "fair price," and "guaranteed loss" smuggled into the depragmatized account is inherently pragmatic. Defining the inconsistency *requires* appealing to the agent's hypothetical evaluations of bets or contracts involving gains/losses. The "loss" in the "guaranteed loss" is still a pragmatic notion (loss *of what*? value *for what*?). Can we really define the inconsistency *without* any reference to these action-oriented concepts? If not, the depragmatized account might be just a more subtle form of pragmatism.

  2.  **The "Package Deal" Problem:** The inconsistency relies on the agent being *committed to accepting the entire package*. But is this commitment truly entailed by the credences alone? The critic asks: Why *must* an agent accept *every* bet deemed fair in isolation? Rationality might require only that an agent *can* accept each individually fair bet *if offered*, not that they *must* accept *any arbitrary combination* of them simultaneously. An agent might rationally decline a package if they see the collective consequence, *even if they endorse each piece separately*. The depragmatizer needs to argue that coherence is what *prevents* the possibility of such a disastrous package existing in the first place, making the agent's valuations inherently safe from this self-sabotage. The critic counters that this "safety" might be a pragmatic virtue, not a purely doxastic requirement.

  3.  **The Necessity of the Dutch Book Construction:** How do we *identify* this supposed inconsistency without constructing the Dutch Book? The Dutch Book Theorem provides the *only known method* for demonstrating the specific form of inconsistency for any given incoherent `Cr`. This makes the inconsistency feel parasitic on the pragmatic demonstration. Critics ask: What *is* the purely doxastic logical contradiction analogous to `(A & ~A)`? Depragmatizers often point to the violation of the probability axioms themselves as the inconsistency, but then the DBA loses its independent justificatory force – it just becomes an illustration of the consequences of violating axioms we've already accepted. The DBA is supposed to *motivate* the axioms, not presuppose them.

  4.  **"Logical" vs. "Pragmatic" Inconsistency:** Some critics (e.g., Hájek) push a harder line: There simply *is no* purely logical or doxastic inconsistency in incoherent credences *by themselves*. The only inconsistency revealed by the Dutch Book is a *pragmatic* one: holding `Cr` commits the agent to a set of dispositions (to accept certain bets) that are jointly guaranteed to lose money. If the agent never bets, or isn't disposed to accept bets based solely on expected monetary value calculated via `Cr`, then no inconsistency manifests. The irrationality, on this view, is fundamentally about poor *decision-making* dispositions given the credences, not about the credences *themselves*. Depragmatizers counter that credences *just are* (partial) determinants of such dispositions by their very nature as valuations.

  5.  **The Challenge of Non-Additivity:** Some argue that the depragmatized approach still implicitly relies on the additive structure of money/utility inherent in the Dutch Book setup. Can a purely doxastic inconsistency be defined for agents whose "valuations" don't neatly map onto linear, additive scales? This connects to debates about justification for non-probabilist norms.

  **Presenting the Debate in Seminar:**

  *   **Frame the Transition:** Explicitly state the challenge: "The Dutch Book Theorem is a mathematical certainty. But how do we get from 'vulnerable to a clever bookie' to 'irrational'?"
  *   **Present the Pragmatist Worry:** Clearly articulate the student's point: Rationality seems internal; contingent facts about bookies and betting dispositions feel irrelevant.
  *   **Introduce Depragmatization:** "Christensen and others argue the *real* defect isn't the potential loss of money, but an *internal inconsistency in how the agent values the truth of propositions* that the Dutch Book merely exposes." Walk through the 5-step logic above.
  *   **Highlight the Core Claim:** Emphasize the shift: The irrationality is the *inconsistent valuation* revealed by the *possibility* of the Dutch Book package, not the *actual* loss or the bookie.
  *   **Air the Skepticism:** "However, critics argue this might just relocate the problem..." Present the key criticisms (Lingering Pragmatics, Package Deal Problem, Necessity of Construction, Logical vs. Pragmatic).
  *   **Connect to Alternatives:** Briefly mention that this debate motivates exploring *other* justifications for probabilism (e.g., Accuracy Dominance arguments) that attempt to be less pragmatically laden from the start.
  *   **Key Question for Discussion:** "Does successfully 'depragmatizing' the Dutch Book reveal a *sui generis* form of doxastic/evaluative inconsistency, or does it inevitably sneak pragmatic considerations back in? Is the 'inconsistency' genuinely *in the credences*, or is it only in the *actions* they (hypothetically) recommend?"

  By focusing on the nature of the "inconsistent valuation" and the arguments about whether it truly escapes pragmatics, you equip your students to grapple with the substantive philosophical dispute underlying the transition from theorem to norm. The depragmatized move is elegant and insightful, but its success in fully rescuing the DBA as a *fundamental* justification for probabilism remains contested precisely because the specter of pragmatism is hard to exorcise completely from concepts like "fair price" and "guaranteed loss," even when used metaphorically for doxastic evaluation.
