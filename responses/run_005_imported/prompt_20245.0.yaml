  Also, trust and reciprocity play roles. Even if players are rational, they might pass to build trust, hoping the other reciprocates. But this is risky. The textbook assumes perfect rationality and CKR, but humans have limits in reasoning, especially in multiple steps. Maybe players can't compute all steps backward or hope for mutual cooperation.

