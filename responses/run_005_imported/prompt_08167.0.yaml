answer: |-
  Your struggle is profoundly human, and your inconsistency is **not a failure**—it's evidence of your emotional honesty. Your flashes of resentment *are* tracking something real: **the legitimate pain caused by your brother’s words, regardless of their clinical origin.** A purely clinical attitude risks invalidating your experience. Here’s why your feelings matter and how to navigate this tension:

  ### What Your Resentment is Telling You (That the "Bad Weather" Analogy Misses)
  1.  **Words Cause Wounds, Even When Unintentional:** Mania may remove his *accountability*, but it doesn’t erase the *impact* of his cruelty. Painful words trigger real neurological and emotional responses. Your hurt is valid.
  2.  **The Loss of Your Brother in Those Moments:** During mania, the person speaking isn't the brother you know. Your resentment may partly stem from grief—mourning the temporary loss of his true self and the safety of your relationship.
  3.  **Fear of Future Episodes:** Resentment can be a protective response anticipating more pain. It signals a need for strategies beyond detachment.
  4.  **Your Needs Matter:** Your therapist’s advice focuses on *managing your reaction*, but it doesn't address *your need for safety, respect, or emotional repair*. Resentment flares when those needs feel consistently unmet, even if unmet "understandably."

  ### Why "Inconsistency" is Normal & Human (Not a Flaw)
  *   **Emotions Aren't Switches:** You can't intellectually decide "I won't feel hurt" and have it stick permanently. Your mind knows the illness is the cause, but your nervous system still registers the attack. Healing isn't linear.
  *   **Context Matters:** Your resilience likely varies based on your own stress, fatigue, the *specific cruelty* uttered, or whether the episode feels preventable. Some barbs simply hit deeper.
  *   **The Burden of Care:** Supporting someone with bipolar disorder is exhausting. Resentment can be a sign of compassion fatigue – your emotional reserves are depleted.

  ### Moving Forward: Honoring Both Truths
  The goal isn't to *eliminate* resentment magically, but to **integrate clinical understanding with compassionate self-protection.** Try these steps:

  1.  **Reframe "Failure" as "Feedback":** When resentment surfaces, don't judge yourself. Instead, ask: *"What is this telling me I need right now?"* (e.g., "I need space," "I need to talk to someone," "I need to remember I matter too").
  2.  **Develop Concrete "During Episode" Strategies (Planning Around the Weather *with* Self-Protection):**
      *   **Limit Exposure:** It's okay to say, "I love you, but I can't talk to you when you're speaking like this. We'll connect when you're feeling better." Protect your peace.
      *   **Use Scripts:** "I know this is the illness talking, but these words are hurtful. I'm ending this conversation for now."
      *   **De-personalize *in the Moment*, Not After:** Focus on actions ("This is mania escalating") rather than absorbing the meaning of the words. Visualize a protective shield.
  3.  **Address the Hurt *After* Stability (Crucial Step Often Missed):**
      *   **Seek Repair (If Possible/Safe):** When he's stable, calmly state: "When you were manic, you said X. I know it wasn't *you*, but it really hurt. I need you to understand that impact." His mortification is a sign he *wants* to repair. Focus on *your experience*, not blame.
      *   **Demand Proactive Management:** His remorse must translate to action. Is he adhering to treatment? Does he have an action plan (meds, therapy, recognizing early signs)? Supporting his stability *is* protecting you both.
  4.  **Tend to Your Wounds:** Your pain deserves attention *separately* from his illness.
      *   **Talk to Your Therapist:** Explicitly work on processing the *trauma* of the verbal attacks and managing guilt. Explore Internal Family Systems (IFS) or EMDR if the hurt feels stuck.
      *   **Find Support:** Connect with NAMI (National Alliance on Mental Illness) or support groups for siblings. Being heard by others who understand is vital.
      *   **Radical Self-Compassion:** When guilt arises, counter it: "I am human. My pain is real. It's okay that I can't always detach. I'm doing my best in an incredibly hard situation."

  **Your resentment isn't a failure of compassion; it's a signal.** It signals that love coexists with pain, that understanding an illness doesn't erase its scars, and that *your* emotional well-being requires active care alongside your brother's. The inconsistency you feel reflects the exhausting reality of loving someone with a serious mental illness—it’s a testament to your endurance, not a flaw in your character. Hold space for both clinical truth and your human heart. You deserve both understanding and boundaries.
