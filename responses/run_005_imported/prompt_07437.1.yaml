answer: |-
  Here’s a structured sequence of questions with follow-ups designed to probe the vulnerabilities of the speaker’s hybrid expressivism, keyed to your four focal areas. Each question builds on the previous to escalate pressure on the division-of-labor strategy, culminating in the "deletion test."

  ---

  ### **Question Sequence for Hybrid Expressivism Q&A**

  #### **1. Opening: The Negation Problem Relocated**  
  **Q:** You argue that descriptive content alone handles embedding (e.g., negation), while the attitude only activates in assertion. But for "Lying is wrong" and "Lying is not wrong," their *normative* inconsistency seems irreducible to the descriptive component. If the latter is "fits my current norms," negating it yields "doesn’t fit my current norms" – which isn’t inconsistent with the first. How does your view explain why we *ought* to reject both?  
  *Likely Reply:* "Inconsistency arises from competing descriptive truth-conditions (e.g., ‘fits norms’ vs. ‘doesn’t fit’)."  
  **Follow-Up:** But if the attitude isn’t part of the content, why does accepting "wrong" conatively commit me to rejecting "not wrong"? Isn’t this just the original Unwin-Schroeder problem *reapplied* to your chosen descriptive property?  

  #### **2. Explanatory Idleness of the Attitude**  
  **Q:** If descriptive content fixes truth conditions, validity, and logical relations, what *explanatory work* does the conative attitude perform? Couldn’t we strip it away and retain identical semantics for normative discourse?  
  *Likely Reply:* "The attitude captures motivational force and non-cognitive commitment – what makes moral judgments *practical*."  
  **Follow-Up:** But if the attitude doesn’t affect truth conditions or logic, isn’t it merely a *psychological add-on*? If so, doesn’t this concede Ridge’s critics who say hybrid views make expression semantically redundant?  

  #### **3. Motivational Internalism & the Amoralist**  
  **Q:** If one can grasp the descriptive proposition (e.g., "φ fits norms N") without the conative attitude, how does your view explain internalism? This seems to allow an "amoralist" who understands "wrong" but feels no motivation to avoid φ.  
  *Likely Reply:* "The attitude is constitutive of *accepting* the norm – so true amoralism is impossible."  
  **Follow-Up:** But if the attitude isn’t part of the propositional content, what stops someone from assenting to "φ is wrong" (descriptively) while lacking conative commitment? Isn’t this *exactly* the amoralist – and doesn’t your view imply their conceptual possibility?  

  #### **4. Creeping Minimalism & Collapse**  
  **Q:** When the descriptive component handles compositionality, truth-aptness, and inconsistency, what distinguishes your semantics from a naturalist cognitivism that reduces "wrong" to "fits current norms" and ignores expression?  
  *Likely Reply:** "Cognitivism misses the *action-guiding* role of moral claims, which requires the attitude."  
  **Follow-Up:** But if the attitude doesn’t affect truth conditions, why isn’t it just a pragmatic feature of *use*? Couldn’t a cognitivist adopt your descriptive semantics and add a Gricean implicature about speaker motivation – rendering the "hybrid" layer superfluous?  

  #### **5. The Frege-Geach "Solution" Revisited**  
  **Q:** You claim pure expressivism fails Geach because attitudes don’t embed, while descriptives do. But if your descriptive content (e.g., "fits norms") is itself *normative* (since "norms" refer to prescriptive standards), haven’t you just deferred the embedding problem to a *different normative level*?  
  *Likely Reply:* "The descriptive content is non-normative – it’s about social or psychological facts."  
  **Follow-Up:** If "fits norms" is purely descriptive, how does asserting it generate *normative* authority? If I say "φ fits my norms," why should *you* care? Doesn’t this collapse into relativism?  

  #### **6. Attitude Expression & Truth Conditions**  
  **Q:** When I utter "If lying is wrong, then telling Mom is wrong" in a modus ponens, you say the descriptive content carries validity. But if I *assert* this conditional, does it express an attitude toward the norm? If not, how is it normative? If so, how does the attitude embed?  
  *Likely Reply:** "Only outright assertions express attitudes; embeddings use descriptives."  
  **Follow-Up:** So in *asserting* the conditional, I express an attitude about... what? The connection between two descriptive properties? How does that differ from a non-cognitivist treating the conditional as expressing a higher-order attitude?  

  #### **7. Semantic Loss in Deletion**  
  **Q:** Suppose we delete the expressive layer entirely, leaving only the descriptive content (e.g., "wrong" = "fits current norms"). What *semantic or normative* capacity would be lost compared to your hybrid view?  
  *Likely Reply:* "We’d lose the essential practicality of moral language – its role in guiding action."  
  **Follow-Up:** But if the descriptive content already implies "φ is to-be-avoided" (for speakers who accept the norm), doesn’t it *itself* guide action? Why isn’t the attitude just a redundant marker of the speaker’s psychology?  

  #### **8. The Knockout: What’s Expressivism Adding?**  
  **Q:** If we grant that your descriptive content solves compositionality *and* can explain moral motivation (via norms' practical role), what unique advantage does hybrid expressivism offer over a sophisticated naturalist realism that accounts for practicality pragmatically?  
  *Likely Reply:* "Realism can’t explain the *internal connection* between judgment and motivation."  
  **Follow-Up:** But hasn’t your view *severed* that connection? If the attitude is detachable from the proposition (as per Q3), and motivation hinges on accepting norms (a descriptive state), doesn’t your hybrid view *also* fail to secure internalism?  

  ---

  ### **Key Strategic Notes**
  - **Flow:** Starts with technical embedding (negation), escalates to idleness/internalism, then challenges minimalism, and ends with the "deletion test" to force a concession about the attitude’s necessity.  
  - **Anticipating Dodges:** Follow-ups preempt retreats to "pragmatics" or "motivation" by demanding *semantic* differentiation.  
  - **Culmination:** The final question (#8) directly invokes your core concern: if deletion changes nothing, expression is ornamental.  
  - **Tone:** Phrased collegially but tightly, using the speaker’s terminology (e.g., "descriptive content," "conative attitude").  

  This sequence should expose whether her solution genuinely resolves tensions or merely redistributes them – while giving her room to defend innovations. Let me know if you’d like deeper dives into any specific critique!
