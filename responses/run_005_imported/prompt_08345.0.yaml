  ### Decision Memo: Review System Design for EA-Adjacent Grants Program  
  **To:** Grants Committee  
  **From:** [Your Name], Program Coordinator  
  **Date:** [Date]  
  **Subject:** Recommendation on Reviewer Panel Expansion (Condorcet Jury Theorem Debate)  

  ---

  ### **Background**  
  Our current process uses 3 independent reviewers scoring each grant 1–10, with averaged scores determining funding. A proposal to expand to ~10 reviewers/grant cites the Condorcet Jury Theorem (CJT), arguing that more reviewers boost decision accuracy if each is >50% competent. Opposition contends reviewers lack independence due to shared EA-aligned priors. This memo steelmans both views, identifies flaws in CJT for our context, and proposes a revised design.

  ---

  ### **Steelman of Condorcet Jury Theorem (CJT) Argument**  
  CJT states that for binary decisions (e.g., "fund/don’t fund"), if reviewers are:  
  1. **Competent**: Each has individual accuracy \( p > 0.5 \).  
  2. **Independent**: Judgments aren’t influenced by peers or shared biases.  
  3. **Homogeneous**: All apply identical decision criteria.  
  ...then majority voting converges toward 100% accuracy as reviewers increase. At \( p = 0.55 \), 10 reviewers yield ~62% group accuracy vs. ~57% for 3. The math suggests "free" gains from scaling.  

  **Why this seems appealing for us:**  
  - If our reviewers are even marginally competent (\( p > 0.5 \)), CJT justifies adding reviewers to reduce noise.  
  - Averaging scores (our method) behaves similarly under independence, per the law of large numbers.  

  ---

  ### **Where CJT Breaks Down in Our Context**  
  CJT’s assumptions fail in grant evaluation, making scaling ineffective or harmful:  
  1. **Non-Binary Decisions**:  
     - We use 1–10 scores to **rank projects**, not binary approvals. CJT doesn’t apply to ranking or continuous scores.  
     - *Example:* Two reviewers scoring 6 vs. 10 on the same project may indicate disagreement on *magnitude* of impact, not correctness. Majority voting can’t resolve this.  

  2. **Violated Independence**:  
     - Reviewers share EA-aligned priors (e.g., via Forum posts, common training), creating **correlated biases**. If Reviewer 1 overweights a shared misconception (e.g., "AI safety projects > global health"), others likely replicate it.  
     - *Data:* Empirical studies show correlation reduces CJT’s benefits by 30–70% (Ladha 1992; Kaniovski 2010). With moderate correlation, 10 reviewers may perform like 4–5 independent ones.  

  3. **Heterogeneous Competence**:  
     - CJT assumes uniform \( p \). In reality:  
       - Top 20% of our reviewers may have \( p = 0.7 \) (experts in a field).  
       - Bottom 30% may have \( p = 0.4 \) (misaligned incentives or knowledge gaps).  
     - Adding low-\( p \) reviewers *lowers* average accuracy.  

  4. **Operational Costs:**  
     - Scaling to 10 reviewers/grant would triple workload. For 50 applications/year:  
       - **Current:** 150 reviews.  
       - **Proposed:** 500 reviews → likely reviewer fatigue, rushed scores, and declining \( p \).  

  ---

  ### **Recommendation: Hybrid Model + Calibration Protocol**  
  **Keep panels small (3 reviewers)** but add **calibration stages** and **targeted expansion** for borderline cases. This balances CJT’s insights while mitigating its flaws.  

  #### **Proposed Design**  
  1. **Core Panel (3 reviewers/grant):**  
     - All applications scored independently by 3 reviewers.  
     - *Why 3?* Maintains workload while capturing diverse perspectives.  

  2. **Borderline Review Expansion:**  
     - Applications with **high score variance** (e.g., SD > 2.0 on 1–10 scale) get 2–3 extra reviewers.  
     - *Rationale:* CJT helps most when disagreement signals uncertainty. Adding reviewers here targets correlation/competence risks.  

  3. **Calibration Protocol (to Raise Baseline \( p \)):**  
     - **Pre-Review Workshop:** 1-hour session aligning reviewers on:  
       - Scoring anchors (e.g., "5 = neutral impact," "8 = top 10% of past grants").  
       - Debias tactics (e.g., "Note one reason to oppose your initial rating").  
     - **Expert Ad-Hoc Reviewers:** For 15% of grants in niche domains (e.g., AI governance), add 1 specialist to core panel.  

  4. **Aggregation Method:**  
     - Use **trimmed means** (discard highest/lowest scores) to reduce outlier effects.  
     - *Not majority voting*—preserves granular ranking.  

  #### **Expected Benefits**  
  - **Accuracy:** Focuses extra reviews where CJT adds value (high-uncertainty grants).  
  - **Workload:** 10–20% increase in reviews (vs. 233% for full 10-reviewer panels).  
  - **Bias Mitigation:** Calibration reduces correlated errors from shared priors.  

  ---

  ### **Phased Implementation Plan**  
  1. **Pilot (Next 3 Months):**  
     - Apply new design to 10% of grants (randomly selected).  
     - Track: Score variance, reviewer time, inter-rater reliability (Krippendorff’s alpha).  

  2. **Full Rollout (6 Months):**  
     - Implement across all grants if pilot shows:  
       - >15% reduction in score variance for borderline grants.  
       - No significant delay in decisions.  
     - Train reviewers on calibration protocol.  

  3. **Long-Term Evaluation:**  
     - Audit grant outcomes (e.g., impact metrics) vs. reviewer scores to estimate \( p \).  
     - Revisit panel size if data shows low correlation (\( \alpha > 0.7 \)) or high reviewer \( p \).  

  ---

  ### **Conclusion**  
  CJT is a poor fit for our grants program due to non-binary decisions, correlated priors, and variable reviewer competence. Instead of scaling to 10 reviewers, we recommend a **3-reviewer core panel** with **targeted expansion for high-variance applications** and **calibration training**. This leverages CJT’s logic where it matters most while avoiding wasted effort.  

  **Vote Proposal:**  
  ☑ Approve hybrid model with calibration protocol  
  ☐ Maintain status quo (3 reviewers)  
  ☐ Expand to 10 reviewers  

  ---  
  **Appendices:**  
  - A: CJT math breakdown (competence/correlation tradeoffs)  
  - B: Cost/benefit simulation (3 vs. 10 reviewers under correlation)  
  - C: Calibration workshop outline  

  Let’s discuss at the meeting—I’ll bring coffee! ☕
