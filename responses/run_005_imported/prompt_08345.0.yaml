prompt: |-
  I help run a tiny EA-adjacent grants program (low six figures a year, mostly individual researcher/project grants) and there's a live fight on the committee that I got voluntold to write up before our meeting next week. Right now 3 of us score every application 1-10 independently and average it. One member wants to expand to panels of ~10 reviewers per grant, citing the Condorcet jury theorem -- his pitch is that as long as each reviewer is just a little better than a coinflip, the math guarantees the aggregate gets more accurate as you add reviewers, basically for free. Another member is sure this is wrong for our situation but cant articulate why beyond 'our reviewers aren't independent, they all read the same forum posts and end up with the same priors.' Can you draft the actual decision memo -- keep the panel at 3, go big, or some other design entirely -- that steelmans the Condorcet argument properly but is honest about exactly where and why it'd break down for a setup like ours. Want it to end with a real recommendation and a rough plan for phasing it in, not just 'it's complicated.'
reasoning: |-
  We are discussing whether to expand our grant review panel from 3 reviewers to about 10 per grant, based on an argument invoking the Condorcet Jury Theorem (CJT). The CJT states that if each voter (reviewer) has an independent probability p > 0.5 of being correct (i.e., better than a coin flip), then as the number of voters increases, the probability that the majority vote is correct approaches 1. Conversely, if p < 0.5, the probability of a correct majority vote goes to 0 as the group size increases.

  The argument in favor of expansion is that if each reviewer is even slightly better than random (p>0.5), then adding more reviewers will improve accuracy. However, the counterargument is that our reviewers are not independent and share common biases because they are exposed to the same EA forum posts and have similar priors.

  Let's break down the key assumptions of CJT and how they might hold or break in our context:

  1. **Binary Choice**: CJT assumes a binary decision (e.g., correct/incorrect). But our grants are scored on a scale (1-10). We then average the scores. This is a different aggregation method than majority voting on a binary question. We are not making a binary decision (fund or not) by majority vote but rather averaging scores to rank projects. So the theorem does not directly apply.

  2. **Independence**: CJT requires that the reviewers' judgments are independent. In our case, if reviewers are influenced by the same external sources (like EA forum posts) and each other, their judgments may be correlated. This breaks the independence assumption. In fact, if reviewers are positively correlated (which is likely), the benefit of adding more reviewers diminishes. The theorem's "for free" improvement only holds under independence.

  3. **Homogeneous Competence**: CJT assumes every reviewer has the same p (probability of being correct). In reality, reviewers vary in expertise. Some might be much better (p>>0.5) and others worse (maybe even p<0.5). The theorem still holds for the average p>0.5, but if there is a mix, the convergence might be slower or even fail if the average p is not above 0.5.

  4. **Definition of "Correct"**: What is the "correct" decision? We don't have a ground truth. We are trying to predict which projects will have the most impact. Without a clear definition of correctness, it's hard to measure p. Moreover, the CJT assumes that there is a single correct answer, but in grantmaking, there might be multiple good projects and we are trying to rank them.

  5. **Cost and Feasibility**: Even if the theorem held, we must consider the cost of recruiting and coordinating 10 reviewers per grant. Our program is small (low six figures). If we have, say, 50 applications a year, 10 reviewers per application would mean 500 reviews. Currently, with 3 reviewers, we do 150 reviews. This is a significant increase in workload and might lead to reviewer fatigue and lower quality per review.

  Given these considerations, let's steelman both sides:

  **Steelman for Expansion (using CJT):**
  - If we can ensure that reviewers are independent and each has p>0.5, then by the CJT, the majority vote (if we were using that) would become more accurate. Even though we average scores, the law of large numbers suggests that averaging more independent ratings might reduce noise and thus improve accuracy. If we switch to a binary decision (e.g., "fund" or "not") per reviewer and then take a majority vote, we might get the CJT benefit.

  **Steelman Against Expansion (for our situation):**
  - Independence is violated: Our reviewers are drawn from a small EA community and read the same materials. They are likely to have correlated errors. In such cases, the marginal benefit of each additional reviewer is reduced. The CJT's convergence to perfect accuracy is not achieved when there is correlation.
  - We are not using a binary decision: We use a 1-10 score and average. The CJT does not directly apply to averages of continuous scores. Moreover, the meaning of a "correct" score is unclear. We are more interested in ranking projects than in a binary "correct" decision.
  - Practical burden: The cost of recruiting and managing 10 reviewers per grant is high. We might not have enough qualified reviewers, and the quality of each review might drop if we have to use less qualified reviewers to fill the panel. Also, the time delay might be substantial.

  **Alternative Approaches:**

  1. **Stick with 3, but improve quality**: We could keep the panel at 3 but invest in better training, clearer guidelines, and more diverse reviewers to reduce bias and improve the quality of each review.

  2. **Use a hybrid model**: Have 3 primary reviewers (as now) and then for borderline cases or top contenders, add 2-3 extra reviewers. This targets extra resources where they are most needed.

  3. **Change the aggregation method**: Instead of averaging, we could use a Bayesian model that accounts for reviewer expertise and bias, but that might be complex.

  4. **Use a smaller expansion**: Maybe 5 reviewers is a compromise? It increases the panel but is less burdensome than 10.

  5. **Implement a two-stage process**: 
     - Stage 1: 3 reviewers as now, to filter out clear rejects and promote strong candidates.
     - Stage 2: For the remaining (say top 20-30%), use a larger panel (5-7) to make the final decision.

  **Recommendation:**

  Given our small size and the concerns about independence and feasibility, I recommend against jumping to 10 reviewers per grant. Instead, we should:

  1. **Test the independence assumption**: We could run an experiment on past data (if available) to measure the correlation between reviewers. Alternatively, for a small set of grants in the next round, have 5 reviewers and see how much the additional reviewers change the rankings.

  2. **Start with a modest expansion to 5 reviewers**: This increases the panel by two, which is manageable. We can assign the two extra reviewers only to the top 50% of applications after an initial screening by 3. This way, we focus extra resources on the more competitive applications.

  3. **Improve reviewer training and guidelines**: To increase p (individual accuracy), we can provide better materials, calibration exercises, and encourage reviewers to think independently.

  4. **Phase-in plan**:
     - Next round: Use 3 reviewers for all applications. Then, for the top 50% (by average of the 3), add 2 more reviewers. So each of these gets 5 reviews. This increases the total reviews from 3*N to 3*N + 2*(0.5*N) = 4N (for N applications). For 50 applications, that's 200 reviews (up from 150) instead of 500 for 10 reviewers.
     - Evaluate after one cycle: Check the extra burden and whether the two extra reviewers provided new insights (or just correlated ones). Also, survey reviewers on their experience.
     - Consider a switch to majority voting for a binary decision? But note: we are not making a binary decision per grant because we have a budget and must rank. So we might stick with averaging but with more reviewers for the top half.

  5. **Long-term**: If we see that the extra reviewers add value and we can handle the workload, we might expand to 5 for all. But 10 seems excessive for our scale.

  **Decision Memo Draft:**

  ---

  **To:** Grants Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation on Reviewer Panel Size  

  **Background:**  
  Currently, each grant application is reviewed independently by 3 committee members, who score on a 1-10 scale. The average score is used to rank applications. A proposal has been made to expand the review panel to approximately 10 reviewers per grant, citing the Condorcet Jury Theorem (CJT) as justification. The theorem suggests that if each reviewer is more likely than not to be correct (p>0.5) and reviews are independent, then majority decisions become more accurate as the number of reviewers increases. However, concerns have been raised about the independence of reviewers in our community and the feasibility of such an expansion.

  **Analysis:**  
  The CJT provides a strong theoretical argument for the wisdom of crowds under ideal conditions. However, its assumptions must be critically evaluated for our context:  
  - **Binary vs. Continuous**: We use a continuous score (1-10) and average, not a binary majority vote.  
  - **Independence**: Our reviewers share common EA-aligned sources and prior beliefs, leading to correlated judgments. This violates the independence assumption and reduces the benefit of adding reviewers.  
  - **Competence**: We lack data on the average p (accuracy) of our reviewers. It is possible that for some applications, p<0.5.  
  - **Feasibility**: Expanding to 10 reviewers per grant would increase the review workload by over 3x. Given our limited budget and volunteer/part-time reviewers, this may lead to fatigue and lower review quality.  

  **Recommendation:**  
  We should not expand to 10 reviewers per grant at this time. Instead, we propose a phased approach:  
  1. **Modest Expansion**: For the next grant round, each application will initially be reviewed by 3 reviewers. The top 50% of applications (by average score) will then receive 2 additional reviews, bringing their total to 5.  
  2. **Evaluation**: After one cycle, we will assess:  
     - Correlation between reviewers (using inter-rater reliability metrics).  
     - The added value of the extra reviews (e.g., how often they change rankings).  
     - Reviewer feedback and workload.  
  3. **Quality Improvements**: We will develop a brief training module and guidelines to improve reviewer accuracy and encourage independent thinking.  

  **Phase-in Plan:**  
  - **Next Round (e.g., Spring 2024)**:  
    - All applications: 3 reviewers.  
    - After initial scoring, the top 50% (based on average score) will be assigned 2 additional reviewers.  
    - Final ranking for the top 50% will be based on the average of 5 reviews.  
    - Total reviews: 3 * N + 2 * (N/2) = 4N (compared to current 3N).  
  - **Review**: After the round, the committee will meet to evaluate the process and decide whether to continue, adjust, or expand.  

  This approach balances the potential benefits of more reviewers with practical constraints and allows us to test the independence assumption. It avoids the high costs of a 10-reviewer panel while still providing more data for contentious or top applications.

  **Approval:**  
  We seek committee approval to implement this plan for the next grant round.

