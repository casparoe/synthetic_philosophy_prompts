  Quick question that came up in my philosophy of science seminar last week and I never gave a satisfying answer to. We were covering the hole argument (not really my area — I'm more of an ethics person, but the syllabus makes me teach the phil of physics unit) and a student pointed out that since Einstein's field equations are generally covariant, you can construct a diffeomorphism that's the identity outside some "hole" region but not inside it, giving two solutions that agree on everything up to the hole yet diverge within it. Doesn't that just mean GR is genuinely indeterministic, in the same physical sense that quantum mechanics is? I mumbled something about gauge freedom and moved on to the next slide, but its been bugging me since — if the theory really is indeterministic like that, shouldn't physicists be hunting for hidden variables in GR too, the way they did for QM, rather than just treating it as a deterministic theory? What am I missing here?
