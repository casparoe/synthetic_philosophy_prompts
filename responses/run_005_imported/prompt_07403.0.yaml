answer: |-
  ## The Thirsty Truce (A Dialogue)

  **Setting:** The rattling cab of an old pickup truck, dust swirling in the afternoon sun. Two figures, ARIS (mid-40s, deliberate movements, gaze fixed ahead) and DEX (late 20s, restless energy, fingers drumming on his knee), are slumped against opposite doors. Empty canteens lie at their feet. The silhouette of a small town shimmers on the horizon. The DRIVER, unseen, hums softly up front.

  **DEX:** (Muttering, almost to himself) Almost there. Thank god. Water. Real water. And then... well. Then we pay up, I suppose.

  **ARIS:** (Eyes still forward) We do. We gave our word.

  **DEX:** (Turns to Aris, a speculative look) Did we? I mean, *really*? Think about it. Back there, dying? Absolutely, paying was the rational move. It was the *only* move to get this ride. Survival demanded that promise. But *now*? Look out the window. Safety. Secured. The driver’s done his part. Paying him now… what does it actually *get* me? Nothing. It’s just… throwing money away. Money I could desperately use for food, medicine, getting back on my feet. The *reason* for paying – the survival reason – evaporated the moment we crossed into sight of that water tower. So, rationally, *now*, keeping that promise? It’s… irrational.

  **ARIS:** (Slowly turns to Dex, his expression unreadable) "Rationally, *now*?" That’s your whole point, isn’t it? Slicing time so thin, isolating this single choice – pay or don't pay – divorced from everything that led to it. You call it sophisticated. I call it myopic.

  **DEX:** Myopic? It’s clear-sighted! Rationality is about responding to the reasons *present* at the moment of choice. Right now, the reasons *for* paying are gone. The reasons *against* paying – conserving resources for future needs – are glaringly obvious. Ignoring that isn't rational; it's sentimentality, or worse, stupidity.

  **ARIS:** And what about the reason *you* were picked up in the first place? That driver back there, he doesn’t pick up just anyone. He picked us because he *believed* we’d pay. He believed we were the *kind* of people who honour commitments. Your ‘sophisticated’ view – this choice-by-choice assessment – it tells you that *now*, reneging is smart. But step back. If the driver *knew* that this is how you reason – that the instant the threat passes, the promise dissolves – would he have stopped for you?

  **DEX:** That’s irrelevant *now*! He *did* stop. He believed the past version of me, the one who sincerely promised under duress. My current reasoning doesn’t change the past action that got me the ride. The deed is done.

  **ARIS:** But the *disposition*, Dex! The disposition to reason this way! Parfit called it ‘rational irrationality.’ It’s *rational* for you to *be* the kind of person who makes sincere promises to get out of trouble. That disposition gets you the ride. But then, according to your own ‘sophisticated’ theory, it becomes *locally rational* for that same person to break the promise once safe. So, your theory predicts – *demands*, even – that you strand yourself! If everyone reasoned like you, that driver would never stop. He’d know promises made under threat are worthless the moment the threat lifts. Your theory of rationality, when followed consistently, makes the very cooperation that saved you impossible! How can a theory that predictably prevents its own adherents from getting life-saving help be truly rational?

  **DEX:** (Leans forward, intensity rising) Because rationality isn't about sustaining fairy tales about dispositions! It’s about navigating the world as it *is*, choice by choice, with the reasons available *now*. You’re smuggling in a constraint – ‘thou shalt honour past commitments simply because they are past commitments’ – that has no grounding in self-interest *once the original incentive is gone*. Why bind my future self to the decisions of a desperate past self if those bindings serve no current purpose? ‘Resolute choice’ sounds noble, but it’s just dressing up inertia or guilt as rationality. It shackles me to a policy that has outlived its usefulness. My policy *was* promising-to-get-rescued. It worked! Mission accomplished. Now, a *new* situation demands a *new* policy: conserve-resources-in-safety. Why chain myself to a ghost?

  **ARIS:** It’s not a ghost. It’s the structure of trust and commitment that makes complex cooperation possible! Your ‘new policy’ isn’t new at all. It’s just opportunism masquerading as reason. You committed to a *plan*: promise payment -> get rescued -> pay. The rationality resides in sticking to the *entire plan* you judged best *when you made the commitment*, precisely because deviating *later*, even when locally tempting, undermines the very possibility of making such beneficial plans in the first place. Breaking it now isn’t sophisticated adaptation; it’s a predictable failure of agency. It shows your initial commitment was hollow, a mere tactic, not a genuine intention to follow through. And if *that’s* your disposition, then rationally, no one should ever trust your promises under pressure. Including future you, relying on future promises.

  **DEX:** Hollow? It was utterly sincere *when it needed to be*! Its sincerity got me the ride! Demanding I bleed resources now for the sake of some abstract ‘integrity of planning’ is where the irrationality creeps in. You’re privileging the past decision over the present reality. Resources *are* reasons, Aris. Tangible, urgent reasons *right now*. Your ‘resolution’ asks me to ignore them to prop up a decision framework that’s served its purpose. That’s not rationality; it’s dogma. A self-interested agent uses commitments as tools when they work and discards them when they cease to be useful. The driver got his satisfaction from believing the promise – that belief motivated his action. My payment now is just an empty ritual. Rituals aren’t reasons.

  **ARIS:** And predictable self-sabotage *is*? If this is rational, why feel the need to justify it? Why not just pocket the money and sneer? You know it violates something fundamental about reciprocal exchange. Your theory might feel liberating in this isolated moment, but it builds a prison of predictable unreliability around you. The driver’s ‘satisfaction’ was predicated on a belief that turned out to be false. You exploited his trust using the very disposition your theory says you should abandon the moment it’s convenient. That’s not sophisticated; it’s corrosive. To yourself most of all.

  **DEX:** Exploited? I fulfilled the *essential* part: I got him to act by sincerely intending *at the time*. The rest is sentimental baggage. You cling to resolution because you fear the implications of true, unconstrained instrumental reason. You need the comfort of the rule, even when the reason for the rule vanishes. I face the harder truth: rationality is local, immediate, and sometimes ruthlessly pragmatic. Even if it means discarding the ladder I climbed up on, once I’m safely at the top.

  **ARIS:** And if the ladder was the only way up? And if everyone discards it, leaving only chasms below? Your local reason leaves you stranded on an island of one, Dex. Mine builds bridges. Even if this one costs me water today.

  **DEX:** Bridges built on sunk costs and empty gestures. My water stays with me. That’s reason enough.

  *(The truck rumbles over a cattle guard. The town is unmistakably close now. Aris stares straight ahead, jaw set. Dex looks out his window, fingers still drumming, but slower now. The dust hangs thick in the silence between them. The Driver’s hum continues, oblivious to the chasm in his back seat.)*

  **(FADE OUT)**
