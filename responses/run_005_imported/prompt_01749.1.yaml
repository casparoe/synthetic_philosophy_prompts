prompt: |-
  ok so I had a whole argument with my friend last night about Hobbes and his thing with geometry — the guy genuinely believed he'd squared the circle and spent decades fighting John Wallis about it, never backed down once. what gets me is his actual argument for why geometry is the one totally certain, demonstrable science: because WE draw the lines and figures ourselves, so unlike natural bodies (which we didn't make, so we can only guess at their causes), we know the causes of geometric objects directly, since we generated them ourselves by motion/construction. he even runs the exact same logic to say civil philosophy is just as certain, since we make the commonwealth too.

  my friend thinks this argument just holds up fine on its own terms. I think it secretly depends on there being one true geometry (Euclid's) that obviously matches how bodies actually move through space, and that it would've been in real trouble the moment non-Euclidean geometry showed up, since now theres more than one internally consistent "geometry" and its not obvious which one, if any, is the thing we're actually constructing.

  so genuinely curious what you think: given what you know about Hobbes's actual philosophy of geometry (the maker's-knowledge argument, the materialism, the Wallis feud) — what would he have said if confronted with non-Euclidean geometry? does his certainty argument survive, or was it always quietly riding on Euclid being the only option?
reasoning: |-
  Okay, the user is really diving deep into Hobbes's philosophy of geometry. They had an argument with their friend about whether Hobbes's "maker's knowledge" argument holds up, especially in light of non-Euclidean geometry. Let me unpack this.

  First, the user's main point: Hobbes believed geometry is certain because we construct the figures ourselves, so we know their causes. The user thinks this relies on Euclid being the only geometry, and that non-Euclidean geometries would break Hobbes's argument. Their friend disagrees, saying the argument stands on its own.

  Hobbes was a materialist. For him, geometric objects are physical constructions made by motion. Lines are traced by moving points, circles by rotating a line segment. This ties geometry to the real, physical world. His feud with Wallis over squaring the circle shows he was adamant about Euclidean geometry as the true description of space.

  Now, non-Euclidean geometries challenge this. They are consistent but don't match our physical space. If Hobbes encountered them, he'd probably reject them as fictional. He might say they're abstract games, not real geometry. His certainty comes from constructing in physical space, so any system not based on that isn't true geometry.

  The user's deeper concern might be about the foundations of knowledge. Hobbes links certainty to construction in the physical world. But non-Euclidean geometries show that multiple systems can be consistent. This questions whether any one geometry is "true." The user might be exploring how historical philosophies hold up against modern developments. They want to know if Hobbes's argument was inherently flawed or if it could adapt.

  Also, the user connects this to civil philosophy. Hobbes thinks we can know the commonwealth because we create it. But if multiple consistent social systems exist, does that challenge his certainty there too? The user might be drawing parallels between geometry and political theory, interested in how maker's knowledge applies in different domains.

  In conclusion, Hobbes would likely dismiss non-Euclidean geometries as not real, preserving his argument but ignoring the challenge. His materialism and commitment to physical construction prevent him from accepting alternative geometries. The user's skepticism is valid; Hobbes's certainty does depend on Euclidean geometry being the only option. The argument doesn't survive non-Euclidean geometries because they reveal that internal consistency alone doesn't equate to truth in physical space.
answer: |-
  That's a brilliantly framed question, and you've hit on a core tension in Hobbes's philosophy. Your analysis is spot-on – Hobbes's "maker's knowledge" argument for geometry's certainty **absolutely and fundamentally depends on Euclidean geometry being the singular, true description of physical space.** Confronted with non-Euclidean geometry, Hobbes would almost certainly reject its *geometrical* validity outright. Here's why, breaking down his position and the collision with non-Euclidean ideas:

  1.  **Hobbes's Core Argument (Recap):**
      *   **Materialism:** Geometry is about *real, physical bodies* and their motions. Points are real physical points, lines are paths traced by moving points, circles are generated by rotating a straight line segment, etc.
      *   **Maker's Knowledge:** Because we *perform* these constructions ourselves (in thought or physically), we know *exactly* how they are generated. We know the *cause* (the motion) and the *effect* (the figure) directly. This direct causal knowledge guarantees certainty.
      *   **Contrast with Physics:** Natural bodies are made by unknown causes (God/Nature), so we can only hypothesize about their generation. Geometry is certain because *we* are the makers.
      *   **Dependence on Physical Space:** The constructions are only meaningful and true because they model the fundamental properties of *actual physical space* as we experience it. The motions we use (straight lines, rotations) are the basic motions possible in the real world. Euclidean properties (like the parallel postulate) are *discovered* through construction as inherent truths about space.

  2.  **Confronting Non-Euclidean Geometry: Hobbes's Likely Response:**
      *   **"Not Real Geometry":** Hobbes would dismiss non-Euclidean systems (like spherical or hyperbolic geometry) as clever *logical games* or *fictions*, not true geometry. Why?
          *   **Impossible Constructions:** He would argue we *cannot physically perform* the constructions required for non-Euclidean figures *within the fundamental space we inhabit*. You cannot draw a straight line on a physical sphere that behaves like a hyperbolic geodesic in our Euclidean space. The motions required don't correspond to the basic motions defining physical reality for Hobbes.
          *   **Violation of Foundational Truths:** Non-Euclidean axioms (like the negation of the parallel postulate) would seem like arbitrary, counter-factual assumptions to Hobbes. They don't flow from the basic definitions of point, line, and motion as understood through physical construction in *this* space. They would appear as "false suppositions" leading to internally consistent but physically meaningless or impossible conclusions.
          *   **Lack of Maker's Knowledge:** Since we cannot *generate* these figures through motions fundamental to physical space (as Hobbes defines it), we lack the direct causal knowledge of their generation. They remain hypothetical constructs, akin to the uncertain hypotheses of physics, not the certain demonstrations of true geometry.
      *   **Reaffirmation of Euclidean Space:** He would double down: Euclidean geometry *is* the description of the space we live in and construct within. Its truths are revealed through the act of construction itself. Any system contradicting it is simply wrong about the nature of physical reality and thus not geometry in the true, certain sense.

  3.  **Does His Certainty Argument Survive?**
      *   **On Its Own (Isolated) Terms? (Your Friend's Point):** *Technically*, yes, *if* you accept his core premise: that the fundamental motions we use in construction *define* the true nature of space. Within that closed system, defined by Euclidean motions, the "maker's knowledge" argument for certainty about figures constructed *with those motions* holds. He could say: "Within the system defined by *these specific constructions* (Euclidean), we have certainty. Other systems are built on different, physically invalid motions, so they are irrelevant to *true* geometry."
      *   **In the Broader Philosophical Context? (Your Point):** **No, it fundamentally fails.** The argument's *strength* and *claim to unique certainty* relied entirely on the unspoken (and, for Hobbes, unquestionable) assumption that:
          *   There is only one coherent system possible from these basic motions (Euclidean).
          *   This system perfectly and exclusively describes physical reality.
      *   **Non-Euclidean geometry shatters this:**
          *   It shows multiple *internally consistent* systems *can* be built from different sets of axioms about points, lines, and space.
          *   It severs the *necessary* link between the most "obvious" construction-based system (Euclid) and the *actual* structure of physical space (as revealed later by relativity). We now know physical space isn't perfectly Euclidean on cosmic scales.
          *   It exposes that the "certainty" gained from construction is *only* certainty *within the chosen axiomatic system*. It doesn't guarantee that system is the *only* possible one or that it perfectly models reality. The "maker's knowledge" gives certainty about the *consequences of the definitions and constructions you started with*, but not that those starting points are the *only* or *physically true* ones.

  4.  **The Wallis Feud & Materialism as the Clue:**
      *   His decades-long battle with Wallis is the perfect illustration. Wallis used algebraic and symbolic methods Hobbes despised because they seemed detached from physical construction. For Hobbes, Wallis's methods weren't *true geometry* because they didn't rely on the direct causal generation of figures through motion. Non-Euclidean geometry would have seemed like an even more extreme version of this detachment – not just using symbols, but using symbols based on *physically impossible* motions and spaces.
      *   His materialism is key. Geometry *is* physics for Hobbes – the science of body and motion. A geometry not grounded in the motions possible in *actual* physical space is meaningless to him.

  **Conclusion:**

  You are fundamentally correct. Hobbes's argument for the unique certainty of geometry via maker's knowledge **was always quietly riding on Euclid being the only possible and physically true option.** Confronted with non-Euclidean geometry, he would have dismissed it as an irrelevant logical exercise, not true geometry, because it couldn't be generated by the fundamental physical motions he believed defined space and thus couldn't provide the direct causal knowledge he demanded. His argument survives only as a claim for certainty *within a specific, physically-grounded system* (Euclidean), but it utterly fails as a claim for the *unique and absolute certainty* of geometry *as such* once the possibility of multiple consistent systems and the potential disconnect between constructed systems and physical reality is revealed. Non-Euclidean geometry shows that the "maker" chooses the rules of construction, and different rules lead to different, equally consistent worlds – a possibility Hobbes's materialism and foundational assumptions simply couldn't accommodate. His certainty was contingent on a specific, pre-relativity understanding of space that turned out to be incomplete.
