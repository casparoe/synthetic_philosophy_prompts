  Theo's comeback (T2) brings in Chalmers' two-dimensional semantics. He's distinguishing between what a concept refers to in this world (primary intension) versus in other possible worlds (secondary intension). The key move here is claiming phenomenal concepts are different from natural kind concepts like "water" because they refer directly to experience. This is where the debate gets technical - I need to explain this clearly without jargon.

  Priya's final counter (P2) is the phenomenal concept strategy. She's arguing that even if zombies seem conceivable, that doesn't mean they're possible - it could just be how our concepts work. Our "pain" concept refers to the physical state via a subjective mode of presentation, hiding its physical nature. This is a strong physicalist rebuttal that doesn't deny the intuition but explains it away.

