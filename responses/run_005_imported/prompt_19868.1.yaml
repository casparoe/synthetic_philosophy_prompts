answer: |-
  ## Bell's Theorem: The Weeds Dialogue

  **Characters:**  
  *   **BOHM (Bohmian):** Believes quantum mechanics requires irreducible nonlocality.  
  *   **EVE (Everettian/MWI proponent):** Believes branching wavefunction evolution is fundamentally local.  

  **(Setting: Coffee shop after the reading group, papers strewn about.)**

  **BOHM:** Okay Eve, I get the Everettian aversion to "spooky action." But dodging nonlocality by invoking *every* outcome happening somewhere feels like sleight of hand. Bell proved *any* theory matching experiment must violate local causality. Bohmian mechanics owns it: the wavefunction is nonlocal. You deny definite outcomes exist – fine. But how does that magically make the *correlations* local? The Bell inequalities scream nonlocality.

  **EVE:** Because "local causality," as Bell formalized it, *assumes* definite outcomes at each wing *before* considering the other. Bell’s condition is: the probability of outcome A here, given *everything* in the past light cone, *and* the distant outcome B *and* its setting, should equal the probability given just the past light cone and *our own* setting. Symbolically: P(A | λ, a, b, B) = P(A | λ, a). But in MWI, there *is no single* A or B at the fundamental level until decoherence branches the universe. Asking for P(A|B) when B hasn’t *happened* in your branch yet is asking for the probability of rain *here* given it’s raining *on Alpha Centauri* in a branch you’re not causally connected to. It’s ill-defined.

  **BOHM:** Alright, let’s get into Jarrett’s decomposition then. Bell’s condition breaks into two: **Parameter Independence (PI)** – P(A | λ, a, b) = P(A | λ, a). The probability of *my* outcome shouldn’t depend on *your* *setting*. And **Outcome Independence (OI)** – P(A | λ, a, b, B) = P(A | λ, a, b). Given the settings and λ, *my* outcome shouldn’t depend on *your* *outcome*. Bell violations mean *at least one* must fail. Bohm violates OI – the outcome *here* instantaneously depends on the outcome *there* via the wavefunction. You deny definite outcomes, so which one are *you* violating? Or are you saying the decomposition dissolves?

  **EVE:** It dissolves *as stated* because OI requires definite, singular outcomes B to condition on. In MWI, the full state is the universal wavefunction. "Outcomes" A and B aren’t independent variables; they’re labels we assign *after* decoherence branches the wavefunction based on the *entire* experimental setup – including both settings and the entangled state prepared in their *shared past light cone*. The correlation is baked into the branching structure from the get-go.

  **BOHM:** So you’re violating Outcome Independence? Because effectively, the "outcome" branch I end up in *does* depend on what happens on the other wing – it’s part of the same branching event!

  **EVE:** Not in a dynamically nonlocal way. Think of **spacetime state realism**. The fundamental ontology is the wavefunction on a spacelike hypersurface. The entangled state |ψ⁻> = (|↑↓> - |↓↑>)/√2 *is* the state across both wings *before* measurement. When Alice and Bob measure, their local interactions unitarily evolve the wavefunction. Alice measuring her electron spin along `a` doesn’t *send a signal* to Bob’s electron; it *defines* the branching basis locally. Because the state was entangled, Bob’s measurement along `b` then branches *relative to Alice’s result*, but this branching is *also* a local unitary process for him, constrained by the *preexisting* global state.

  **BOHM:** But how does Bob’s branch "know" to correlate with Alice’s? The perfect anti-correlation when a=b *requires* coordination. If branching is local, why isn’t it possible for Alice to branch to ↑ while Bob, completely independently, also branches to ↑, violating the correlation?

  **EVE:** Because the initial entangled state *lives in the joint Hilbert space*. The possible measurement outcomes *are not independent possibilities*. The observable Alice measures (spin along `a`) and the one Bob measures (spin along `b`) are commuting operators *only* if a=b. Otherwise, they don’t commute, meaning they can’t have definite values simultaneously *in the same branch*. The branching due to Alice’s measurement *defines* the relative state for Bob. There’s no *influence*; it’s a **correlation from a common cause** – the preparation of the entangled pair within their shared past light cone. Decoherence histories formalize this: the probability for *joint* histories (A *and* B) is given by the decoherence functional, which depends on the *entire initial state and the sequence of local interactions*, not on any nonlocal propagation. The weirdness is in the holism of the initial state and the branching structure, not in dynamical nonlocality.

  **BOHM:** I see the move: relocate the non-separability entirely into the initial condition and the branching rules, making the dynamics *formally* local via unitary evolution. But that "holism of the initial state" – the fact that the wavefunction at a point depends on the configuration *everywhere* – still feels ontologically nonlocal. And the branching correlation, even if "just" defining relative states, sure *looks* like coordination requiring something beyond local beables.

  **EVE:** It *is* holism. But holism ≠ nonlocal *causation*. Spacetime is still Minkowskian; no *influence* propagates faster than light. The "beable" is the global wavefunction on a slice. Its evolution is local and unitary. The perfect correlations are enforced by the initial conditions and the linearity of quantum mechanics, operating strictly within the light cone of the preparation event. Denying definite outcomes *does* change the game: without them, there’s nothing *for* a nonlocal influence to *act upon* across space-like separation. The weirdness is profound, Bohm, but it’s the weirdness of a branching, holistic universe, not spooky action at a distance.

  **BOHM:** (Sighs, swirling coffee) I still think that holistic wavefunction *is* the nonlocal object, and Bohm makes that explicit. But... I concede you have a coherent framework where the *dynamics* respect relativistic constraints. It’s not locality as Einstein dreamed, but maybe locality redefined for a branching reality. Pass the sugar? This needs more caffeine.
