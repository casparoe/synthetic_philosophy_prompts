  2. **DA's fixable mess**: Reference class debates ≠ logical suicide.  
  3. **Pragmatic sanity**: DA doesn't invent wild assumptions; SIA does.  
  4. **Moral stakes for x-risk**: DA maintains urgency; SIA risks complacency.  
