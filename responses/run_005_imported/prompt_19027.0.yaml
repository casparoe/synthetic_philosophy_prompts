answer: |-
  ## Eulogy for Aunt [Aunt's Name]

  Good morning. Thank you all for coming to remember my aunt, [Aunt's Name]. She was, as many of you know, a remarkable woman. For over sixty years, she lived a life defined by a profound sense of duty, guided by a principle she encountered as a young woman and held onto with unwavering conviction.

  She trained as a nurse, a profession rooted in care. But her care wasn't confined by geography or familiarity. Early on, she encountered Peter Singer's argument – the idea that failing to help a stranger dying far away, when we easily could, carries the same moral weight as ignoring a child drowning right in front of us. For most of us, that’s a challenging thought, perhaps abstract. For [Aunt's Name], it was a roadmap.

  And so, she lived accordingly. A modest apartment. No car. Simple clothes. Not because she didn’t appreciate comfort, but because she saw every saved penny as medicine, as food, as life itself for someone she might never meet. For six decades, the bulk of her income traveled across oceans. We’ll never know the exact number of lives her quiet, relentless dedication saved or transformed. But it *was* immense. That is undeniable. She looked at a vast world of suffering and chose to act, consistently, sacrificially, on a scale most of us cannot fathom.

  She wasn't distant in *all* things. When her sister, my other aunt, fell ill, [Aunt's Name] stepped in without hesitation to help raise my cousins, [Cousin 1 Name] and [Cousin 2 Name]. She was there, present, doing the hard, daily work. She provided stability, care, and structure. For that, we are all deeply grateful.

  Yet, [Aunt's Name] was also fiercely consistent in her philosophy. As [Cousin 1] and [Cousin 2] have shared with me, they understood, even then, that in her moral universe, their place in her heart wasn't privileged simply because they were family. To her, the need of a child on the other side of the world held the same intrinsic weight as theirs. Her love wasn't less, but it was spread with a radical impartiality that could feel… impersonal. It was the application of that pond analogy to the very people closest to her.

  Late in life, she learned there was a philosophical term – "agent-centered prerogatives" – for the idea that morality might allow, even expect, us to give *some* extra weight to our own lives and the lives of those immediately connected to us. She told me about it almost wistfully. And then, with that quiet resolve she possessed, she told me she had consciously chosen never to let herself use that concept. She saw it as a loophole, a weakening of the duty she felt so deeply.

  So, what do we make of [Aunt's Name]?

  To stand here and simply call her a saint feels… incomplete. It glosses over the very real cost of her choices, the emotional distance my cousins navigated, the sheer, unrelenting *demand* of the life she imposed upon herself. She chose a mountain peak few attempt to climb, let alone inhabit for a lifetime.

  But to suggest something went "wrong" feels equally inadequate. It diminishes the breathtaking scale of her compassion, the tangible good she poured into the world, the ironclad integrity with which she lived according to her deepest beliefs. She wasn't indifferent; she was focused with laser intensity on a suffering world, believing her resources belonged fundamentally to those in greatest need.

  Perhaps the truth of [Aunt's Name] lies precisely in holding both these realities together, without needing to resolve the tension between them.

  She was a woman of extraordinary moral courage, who lived with radical generosity. She saved lives, countless lives, through her daily sacrifices. That is a monumental legacy.

  And she was a woman whose chosen path, rooted in a deep desire to alleviate suffering, also meant that the warmth and particularity of close bonds were sometimes overshadowed by the immense weight of a global need she felt compelled to answer. That, too, is part of her story.

  She chose the pond. She chose the distant stranger. Every single day. Not perfectly – no human life is perfect – but with a consistency that commands awe, even as it prompts difficult questions about the price of such absolute commitment, and the space we allow for the particular loves right beside us.

  Tomorrow, we won't settle whether a good life *has* to be this demanding. [Aunt's Name] answered that question for herself, definitively, with every check she sent, every luxury she forewent. But her life *does* ask us the question. It asks us to look at our own choices, our own comforts, our own circles of care. It asks us to consider the pond, the stranger, the child down the street, *and* the niece or nephew sitting beside us.

  [Aunt's Name] lived a life of profound conviction and immense consequence. She eased suffering on a scale most of us will never achieve. And she also showed us the sharp edges of a demanding moral vision lived without compromise. We can admire her strength, be humbled by her sacrifice, be grateful for the specific care she gave when called upon, and still acknowledge the complexities inherent in the path she walked.

  We will miss her presence. We will remember her unwavering commitment. And we will carry forward the challenging, beautiful, and deeply human questions her extraordinary life leaves in its wake.

  Thank you, Aunt [Aunt's Name], for the lives you saved, for the example you set, and for the profound conversation your life continues to inspire. May you rest in the peace you worked so tirelessly to create for others.
