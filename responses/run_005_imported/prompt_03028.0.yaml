answer: |-
  Your draft is remarkably faithful to Einstein's actual argument in "Why Socialism?" while achieving the compression and narrative voice needed for fiction. Here's a breakdown addressing your specific concerns:

  1.  **Accuracy & Fair Compression:**
      *   **Ethical Core vs. Historical Inevitability:** You are absolutely right to emphasize the ethical claim ("moral injury") over historical inevitability. This is a *defining feature* of Einstein's essay and distinguishes it from orthodox Marxism. Einstein explicitly rejects the idea of socialism being "scientifically inevitable" or following "scientific laws." His argument is fundamentally moral and humanitarian:
          *   He calls capitalism a source of "evil" and describes the "economic anarchy" causing "crippling of individuals" and the "suffering of the masses."
          *   He focuses on the *human cost*: the competitive pressure causing insecurity, alienation, and the warping of character ("The crippling of individuals I consider the worst evil of capitalism").
          *   Your phrases "moral injury" and "anxious, grasping posture our schools reward" capture this ethical indictment perfectly. It's the core of his motivation.
      *   **Skipping the Historical Scaffolding:** This compression is both necessary for your scene and acceptable. You haven't distorted his argument by omitting the historical preamble about conquest, land monopolization, and priesthoods. The key point Einstein makes with that history is **exactly** what your Einstein articulates here: that existing economic "laws" are not immutable natural laws but "frozen habits of one especially rapacious period of history mistaking itself for permanent human nature." You've distilled his historical argument into its essential critical conclusion about capitalist realism. The fictional Einstein's dismissal of economics pretending to be astronomy and his characterization of economic laws as "frozen habits" brilliantly encapsulate the point of that historical section. Readers familiar with the essay will recognize the distillation; those unfamiliar won't miss a vital step in the *philosophical* argument you're focusing on.

  2.  **The Bureaucracy Warning: Earned or Bolted-on Hedge?**
      *   **Earned, Not Bolted-on.** This is not a hedge; it's a crucial and authentic part of Einstein's argument. His fear of bureaucratic tyranny is deeply integrated into his specific vision of socialism and his critique of *all* unchecked power:
          *   **Explicit in the Essay:** He directly states: "I am convinced there is *only one* way to eliminate these grave evils, namely through the establishment of a socialist economy... *However*, it is necessary to remember that a planned economy is not yet socialism. A planned economy as such may be accompanied by the complete enslavement of the individual." He then emphasizes the need for safeguards ("guaranteeing the necessary rights of the individual").
          *   **Philosophical Consistency:** This flows naturally from Einstein's core values. His entire argument for socialism is rooted in human dignity, individual development, and preventing the crushing of the individual by powerful forces (capitalist oligarchs). It's entirely consistent that he would fear the *same* crushing by an "unanswerable bureaucracy." His commitment is to *human liberation*, not just state ownership. He understands power corrupts, regardless of its economic label.
      *   **Integration in Your Draft:** Your phrasing works well:
          *   "Planning the economy *might* cure some of this. I will not pretend it cures all of it..." – This "might" and the explicit refusal to claim a panacea is very Einsteinian – pragmatic and skeptical of grand claims lacking evidence or safeguards.
          *   "...a planned economy policed by an unanswerable bureaucracy could enslave a man as completely as any factory owner ever did..." – This directly echoes his "complete enslavement" concern.
          *   "...and no one, including me, has yet designed the office that keeps the planners honest." – This is a brilliant fictional touch that feels utterly authentic. It captures his humility, his recognition of the unsolved nature of the problem of power, and his scientific mindset ("designed the office" implies an engineering challenge). It avoids sounding like a mere political disclaimer and instead frames it as an ongoing intellectual and moral problem.

  **Overall Assessment:**

  *   **Accuracy:** Your compression is excellent and faithful to the spirit and core arguments of "Why Socialism?". You've correctly identified the ethical heart of his case and the rejection of historical inevitability. Omitting the historical preamble is justified as its essential conclusion is embedded in his critique of economic "laws."
  *   **Philosophical Work:** The passage *does* real philosophical work. It clearly articulates the ethical indictment of capitalism (moral injury, distorted character, corrupted democracy) and the core socialist remedy (collective ownership/planning), while honestly confronting the major risk (bureaucratic tyranny). It avoids dogma and presents these as reasoned conclusions grounded in observation and moral concern.
  *   **Character Voice:** The voice feels authentic. It combines intellectual rigor ("economics is not astronomy"), moral passion ("moral injury"), pragmatic skepticism ("might cure some," "no one... has yet designed"), and a touch of humility ("humbler reasons," "including me"). The closing about bureaucracy feels like a natural extension of his concern for the individual and his clear-eyed assessment of power dynamics, not a tacked-on disclaimer.
  *   **Addressing the FBI Subplot:** By grounding his argument firmly in observable harms to individuals and democracy (the "anxious grasping," the loss of information, the corruption of the political process by ownership), you directly provide the *kind* of reasoning the FBI would twist. They wouldn't need the historical scaffolding to seize on his critique of the American system and his advocacy for an alternative.

  **Minor Suggestion (Optional):** To subtly reinforce the connection to the historical point you omitted, you *could* have him gesture vaguely or add a single phrase when dismissing economic laws. For example: "...the frozen habits born of conquest and monopoly..." or "...habits cemented by centuries of power..." This links the "frozen habits" even more directly to the historical argument without needing exposition. But it's not essential; the current draft stands strong.

  **In conclusion:** This is a superb fictional rendering of Einstein's socialist argument. It captures his unique perspective – ethical, anti-dogmatic, deeply concerned with individual flourishing, and wary of concentrated power in *any* form – with accuracy and compelling narrative force. The closing about bureaucracy is not a hedge; it's an essential and earned part of his nuanced, humanistic vision.
