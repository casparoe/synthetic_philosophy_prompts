  First, I need to create a new example. The JFK one works because the indicative version is about evidence (we know Kennedy was killed, so if not Oswald, someone else did), while the counterfactual imagines a world where Oswald didn't do it, which might not involve a conspiracy. So I should pick a scenario where the outcome is certain, but the counterfactual explores alternatives without that certainty.

  How about a traffic scenario? Say, a student misses the bus and gets a ride. Indicative: "If you didn't miss the bus, you took it." That's true because missing the bus is the only reason they got a ride. But counterfactual: "If you hadn't missed the bus, you would have taken it." That's also true. Hmm, that doesn't show a split. Need a case where the indicative relies on known facts, but the counterfactual doesn't.

  Wait, what about a sports example? Team wins a championship. Say, the star player was injured. Indicative: "If the star wasn't injured, he played." True, because we know he didn't play. But counterfactual: "If the star hadn't been injured, he would have played." Also true. Still no split. The key is when the antecedent (if-clause) is false in reality, but the indicative uses it to infer something based on evidence, while counterfactual imagines a world where it's true.

  Ah, maybe a classroom setting. Student A fails a test. Teacher knows that either they didn't study or cheated. But the student didn't cheat. So indicative: "If Student A didn't cheat, they didn't study." True, because we know they failed and didn't cheat. Counterfactual: "If Student A hadn't cheated, they wouldn't have studied." Wait, that doesn't make sense because they didn't cheat. Need the counterfactual to imagine cheating not happening, but that's what they didn't do. 

  Better: Suppose we know the student failed. The options are they didn't study or they cheated. But we have evidence they didn't cheat. So indicative: "If they didn't cheat, they didn't study." True. Counterfactual: "If they hadn't cheated, they wouldn't have studied." This seems false because in a world where they cheated (which they didn't), maybe they did study. But the indicative is about the actual world, while counterfactual creates an alternate scenario. 

  Another idea: Cafeteria lunch. The only options are pizza or salad. Today, pizza is served. Student B hates salad, so if pizza isn't served, they skip lunch. But today pizza is served, so they ate. Now, indicative: "If pizza wasn't served, Student B skipped lunch." True, because we know pizza was served, but if it wasn't, they skip. Counterfactual: "If pizza hadn't been served, Student B would have skipped lunch." Also true. Still no divergence. 

  The JFK example works because in the indicative, we accept Kennedy was killed, so if not Oswald, someone else must have. In counterfactual, we imagine Oswald didn't kill him, which might mean Kennedy wasn't killed at all, so no one else did. But in reality, he was killed, so the counterfactual requires considering the closest world where Oswald didn't do it, but Kennedy still dies, implying a conspiracy. 

  So for a new example, I need a situation where the outcome is fixed, and the indicative conditional reflects our knowledge, while the counterfactual explores a hypothetical without that outcome necessarily happening. 

  Example: A student, Alex, submits a paper late. The teacher knows late submissions get an F unless there's a valid excuse. Alex has no excuse, so they got an F. But suppose we later find out the teacher didn't see the submission time and passed Alex anyway. Wait, that might complicate things. 

  Better: Alex submits late, no excuse, gets F. Indicative: "If Alex didn't have an excuse, they got an F." True. Counterfactual: "If Alex hadn't had an excuse, they would have gotten an F." Also true. 

  The split happens when the indicative is about deduction from known facts, while the counterfactual might not hold in all possible worlds. 

