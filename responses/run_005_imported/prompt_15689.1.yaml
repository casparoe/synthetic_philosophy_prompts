prompt: |-
  I'm one of five people on my engineering org's committee that decides who gets promoted to Staff Engineer. Our rubric has two dimensions, 'technical depth' and 'organizational influence,' each decided by majority vote among the five of us, and a candidate is promoted only if both pass. On our latest candidate, two of us judged she cleared both dimensions, one judged she cleared depth but not influence, one judged the reverse, and one judged she cleared neither -- so, dimension by dimension, three of five of us credit her with depth and three of five credit her with influence, and by the rubric she's promoted. But when I polled the five of us directly on whether she should be promoted, only the two who credited her with both dimensions said yes; the other three said no. Three of us, including me, want to keep deciding dimension-by-dimension, since it's auditable and ties the outcome to stated criteria rather than gut feeling; the other two want to just poll overall judgment directly, since it seems indefensible to promote someone that a majority of us, individually, don't think has earned it. I need to circulate the committee's written rationale before we finalize this promotion cycle on Friday, and whatever reasoning I write will likely set the default for every future split decision -- please draft that memo: it should say plainly what happens to this candidate, recommend which procedure we adopt going forward, and take the losing side's argument seriously rather than wave it away.
reasoning: |-
  Okay, let me unpack this committee dilemma. The user is on a five-person promotion committee for Staff Engineers using a two-dimensional rubric (technical depth and organizational influence). For this candidate, the dimension-by-dimension vote shows 3/5 passing depth and 3/5 passing influence, triggering promotion under current rules. But when polled directly, only 2/5 support promotion - creating tension between procedural and holistic judgment.

  Hmm... the core conflict here is between two valid perspectives: 
  One side values the auditability and criteria-based objectivity of dimension voting (3 members including user)
  The other side prioritizes holistic judgment (2 members) arguing you can't promote someone most evaluators reject

  The user needs a memo that:
  - Decides this specific case
  - Sets future procedure
  - Validates both viewpoints without dismissal

  Key nuances I notice:
  The rubric isn't failing - it's working exactly as designed to prevent single-dimension excellence from qualifying candidates. But the 3 "no" voters all have different reasons (depth-only, influence-only, neither), which weakens the "majority opposes" argument since they don't agree on why. 

  For the memo structure:
  First must affirm the current vote outcome (promotion) to maintain procedural integrity
  Then propose a permanent solution: keep dimension voting but add a mandatory holistic assessment step to catch mismatches
  This honors the audit trail while addressing the gut-check concern

  Important phrasing challenges:
  - Can't frame holistic dissent as merely "feelings" - must acknowledge it as valuable contextual judgment
  - Need to show why overriding this vote would be more damaging than upholding it
  - Should position the new holistic step as strengthening the system, not fixing a flaw

  The user's hidden need might be preserving committee unity - the memo must model constructive disagreement. Also noting they're under Friday deadline pressure, so clarity is crucial.
answer: |-
  ## Memorandum: Promotion Decision Protocol & Candidate Outcome  
  **To:** Engineering Promotion Committee  
  **From:** [Your Name/Committee Chair]  
  **Date:** [Current Date]  
  **Subject:** Resolution for [Candidate Name] Promotion & Protocol for Future Decisions  

  ---

  ### **I. Decision for [Candidate Name]**  
  Per our established rubric and voting procedure, [Candidate Name] **will be promoted to Staff Engineer**.  
  - **Technical Depth:** 3 votes "Pass," 2 votes "Fail" → *Majority Pass*  
  - **Organizational Influence:** 3 votes "Pass," 2 votes "Fail" → *Majority Pass*  
  Our charter requires promotion if both dimensions pass by majority vote. This outcome is binding.  

  ---

  ### **II. Recommended Procedure Going Forward**  
  We will retain the **dimension-by-dimension rubric** as our primary decision mechanism, **augmented with a mandatory holistic assessment step**:  
  1. **Vote on dimensions** (as today).  
  2. **If both dimensions pass, but promotion lacks majority support in a holistic vote**:  
     - The committee must **debate discrepancies** and document rationales.  
     - A 48-hour **reconciliation period** begins where:  
       - "No" voters articulate specific misalignments between dimension passes and holistic judgment.  
       - "Yes" voters address concerns or request re-evaluation of evidence.  
     - **No revote occurs** unless new evidence emerges. The dimension-based outcome stands.  
     - All perspectives are recorded in the final rationale.  

  *Why this approach?*  
  - **Auditability & Fairness:** The rubric anchors decisions to objective criteria, reducing bias.  
  - **Holistic Integration:** The reconciliation step forces explicit discussion of perceived gaps, improving consistency.  
  - **Precedent:** Overruling dimension votes retroactively undermines trust in the process.  

  ---

  ### **III. Addressing Concerns**  
  We acknowledge the compelling argument from members favoring direct polling:  
  > *"It seems indefensible to promote someone a majority believes hasn’t earned it."*  

  This is not dismissed. A 3/5 opposition in holistic judgment signals a **process gap**, not a failing of the rubric. Our reconciliation step directly confronts this by:  
  1. **Surfacing hidden criteria:** If voters pass dimensions but oppose promotion, they must identify what’s missing (e.g., leadership style, impact quality).  
  2. **Improving the rubric:** Documented gaps may justify future rubric refinements (e.g., adding "strategic judgment" as a third dimension).  
  3. **Preserving integrity:** Rejecting a dimension-based pass *after the fact* risks arbitrariness. Future candidates deserve predictable rules.  

  Conversely, abandoning dimensions for holistic votes risks:  
  - Decisions swayed by charisma or recency bias.  
  - Inconsistent standards across candidates.  
  - Opaque rationales that disadvantage underrepresented groups.  

  ---

  ### **IV. Path Forward**  
  - **[Candidate Name]’s promotion is finalized.** The rationale will note:  
    > *"While 3/5 members passed both dimensions, holistic concerns were raised re: [briefly summarize themes from reconciliation]. The committee will review whether ‘Scope of Influence’ criteria need refinement."*  
  - **Future cases** will follow the augmented process (dimension votes → mandatory reconciliation if holistic mismatch).  
  - **We will review the rubric** in Q1, incorporating insights from this debate.  

  This balances procedural rigor with respect for nuanced judgment. By documenting discrepancies, we honor dissent while upholding auditable standards.  

  // Signed //  
  [Your Name]  
  On behalf of the Promotion Committee  

  ---

  **Key Takeaways for the Memo:**  
  1. **Uphold the current outcome** to maintain procedural trust.  
  2. **Validate the losing side’s concern** by adding a reconciliation step, not overruling votes.  
  3. **Frame holistic dissent as feedback for rubric evolution**, not a veto.  
  4. **Emphasize auditability** as protection against bias and inconsistency.  
  5. **Set clear next steps** to address underlying tensions.
