answer: |-
  You've hit upon a crucial passage that *is* the seed of the repugnant conclusion, articulated with startling clarity decades before Parfit. Let's break down Sidgwick's sentence and place it historically:

  **Decoding Sidgwick's Sentence:**

  1.  **The Rejected View:** "...the point up to which... population ought to be encouraged to increase, is **not** that at which the **average happiness** is the greatest possible — as many Utilitarians have assumed..."
      *   Sidgwick explicitly rejects Average Utilitarianism as the criterion for optimal population size. He notes others (like John Stuart Mill implicitly, though Mill was nuanced) favored this view.

  2.  **The Advocated View:** "...but that at which the **produce** formed by **multiplying the number of persons living into the amount of average happiness** reaches its maximum."
      *   "Produce" indeed means "product" (mathematical multiplication).
      *   **Number of Persons (N) x Average Happiness (H_avg) = Total Happiness (H_total)**
      *   Sidgwick is advocating **Total Utilitarianism** as the criterion for optimal population: We should maximize the *sum total* of happiness in the world.

  **The Repugnant Conclusion Connection - Direct and Unavoidable:**

  *   **Yes, Sidgwick is explicitly licensing the core reasoning.** His formula (maximize N x H_avg) inherently means that adding more people is morally good *as long as* the *additional total happiness* they bring (even if their individual happiness is low) outweighs the *decrease in average happiness* caused by their addition (due to dilution or resource constraints).
  *   **The Trade-Off:** Imagine starting with a small population (P1) with very high average happiness (H1_avg). According to Sidgwick, it could be better to have a much larger population (P2, where P2 >> P1) with a lower average happiness (H2_avg, where H2_avg < H1_avg), *provided* that P2 x H2_avg > P1 x H1_avg. This is **precisely the structure** of the repugnant conclusion.
  *   **Theoretical Extremes:** While Sidgwick might not have envisioned the *most extreme* version Parfit described (Z population with lives barely worth living), his principle logically permits it. If adding a vast number of people with very low, but *positive*, happiness increases the total sum, then his formula demands it. The *direction* is set.

  **Sidgwick's Awareness and Nuance (or Lack Thereof):**

  *   **No Explicit Distress:** Sidgwick does **not** express any sense of paradox, repugnance, or moral unease about this implication in *this passage* or the surrounding chapter. He presents it as a straightforward, logical deduction from utilitarian first principles. It's presented as a "clean corollary," correcting a previous misunderstanding among utilitarians.
  *   **Practical Constraints Masking the Extreme?** Much of the chapter focuses on *practical* limitations preventing the realization of the *theoretical* optimum implied by total utilitarianism:
      *   **Resource Scarcity:** Sidgwick heavily emphasizes Malthusian concerns. Adding people *eventually* leads to diminished resources, lowering *both* average happiness *and* total happiness. He argues that in the real world, maximizing total happiness likely requires a population size well *below* the absolute maximum possible, specifically to avoid misery caused by overpopulation and resource depletion.
      *   **Focus on Quality:** He argues that improving the *quality* (average happiness) of the existing population is often a more reliable way to increase total happiness than simply adding more people, *given real-world constraints*.
  *   **Theoretical vs. Practical:** This focus on practical constraints might explain Sidgwick's lack of alarm. He likely believed that the *actual* population size maximizing total utility would be one where average happiness was still quite respectable, precisely because pushing towards the theoretical maximum population would cause total utility to *plummet* due to misery. The *truly* repugnant scenario (Z) seemed practically impossible and theoretically distant under real conditions.
  *   **The Seed is Planted:** Crucially, Sidgwick **does not retreat** from the *theoretical principle*. He firmly establishes that the *criterion* is total happiness. The practical constraints modify *where* the maximum lies in reality, but they don't alter the fundamental goal. Parfit's genius was to strip away those practical constraints and force philosophers to confront the pure, unadulterated logic of total utilitarianism applied to population in a frictionless theoretical space, revealing the deeply counterintuitive ("repugnant") result that Sidgwick's principle logically entailed.

  **Historical Placement: Sidgwick vs. Parfit**

  1.  **Sidgwick (1874):** Identifies and advocates the *core principle* of Total Utilitarianism for population ethics (max N x H_avg). He clearly sees it as the correct utilitarian view, contrasting it with Average Utilitarianism. He recognizes the trade-off (more people, potentially lower average, but higher total) and endorses it *in principle*. He mitigates its extreme implications primarily through appeals to *practical impossibility* (resource limits causing misery) rather than moral qualms about the principle itself.
  2.  **Parfit (1984 - *Reasons and Persons*):**
      *   **Names and Dramatizes:** Parfit coins the term "Repugnant Conclusion" to describe the *result* of applying Sidgwick's principle to its logical extreme.
      *   **Highlights the Paradox:** He forcefully argues that this conclusion is *genuinely repugnant* and therefore constitutes a *major problem* for Total Utilitarianism (and potentially utilitarianism itself). He makes the *moral unease* central.
      *   **Strips Constraints:** Parfit explicitly considers the scenario *without* practical resource constraints, forcing the confrontation with the pure logic.
      *   **Catalyzes the Field:** Parfit's formulation turned Sidgwick's technical point into the central paradox of modern population ethics, driving decades of debate, alternative theories (e.g., Variable Value, Critical Level), and refinements.

  **Conclusion:**

  Sidgwick's passage is unequivocally the intellectual origin point for the reasoning leading to the repugnant conclusion. He explicitly licenses adding people even as average happiness falls, *as long as the total happiness (the "product") increases*. He states this as the correct utilitarian view, correcting earlier utilitarians who focused on average happiness. While he tempers the *practical application* with Malthusian concerns about resource scarcity preventing the *realization* of the most extreme outcomes, he shows no sign of being morally troubled by the *theoretical implication* of his principle. Parfit's contribution was to isolate that pure theoretical implication, name it, dramatize its counterintuitive nature ("repugnant"), and thereby launch it as the central challenge in population ethics. Sidgwick provided the engine; Parfit pointed out where it could theoretically go and declared the destination unacceptable. Your reading is spot-on: Sidgwick *is* stating the core logic that Parfit later identified as deeply problematic.
