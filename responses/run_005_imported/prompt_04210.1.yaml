answer: |-
  The finks-and-masks literature profoundly impacts the "new dispositionalist" (ND) defense of compatibilism against Frankfurt-style cases (FSCs), revealing both its strengths and vulnerabilities. Here’s a breakdown of the key implications:

  ---

  ### **1. Core Analogy: Abilities as Dispositions**
  ND theorists (e.g., Kadri Vihvelin, Michael Smith) treat an agent’s **ability to do otherwise** as a **disposition** (like fragility). In FSCs, the counterfactual intervener (CI) doesn’t remove this disposition—it merely *masks* or *finks* it.  
  - **Masking**: The CI prevents the *manifestation* of the ability (like foam preventing a teacup from breaking).  
  - **Finking**: The CI would remove the ability *if* the agent tried to use it (like a wizard making a vase non-fragile just before impact).  

  **Implication**: If abilities are dispositions, FSCs don’t eliminate the ability—they only block its exercise. PAP (requiring *actual* alternate possibilities) is false, but agents retain responsibility because they *possess* the ability.

  ---

  ### **2. The Masking Defense & Its Weaknesses**
  Your friend’s "masking" view aligns with ND:  
  > *"The CI masks the ability to do otherwise but doesn’t destroy it."*  

  **Problems**:  
  - **Deterministic Co-option**: As you noted, determinists can exploit this framework. If determinism is true, **all abilities are permanently masked** by prior causes. The ND move then fails to distinguish compatibilism from hard determinism.  
  - **Dispositional "Double-Counting"**: If an ability is masked *whenever* it isn’t exercised, the concept becomes vacuous. ND must explain why FSC-masking is special vs. deterministic masking.  

  ---

  ### **3. The Finking Challenge & Intrinsic Properties**
  Mark Johnston and C.B. Martin showed dispositions require **intrinsic bases** (e.g., molecular structure for fragility). If a CI *finks* an ability—altering the agent’s intrinsic properties to remove the ability if needed—the ability is **destroyed**, not masked.  

  **Implications for FSCs**:  
  - If the CI’s presence *intrinsically changes* the agent (e.g., via brain-altering tech), the ability is finked and lost.  
  - If the CI only *extrinsically* blocks outcomes (e.g., intercepts neural signals), masking may hold.  
  **Crucially**: ND must argue FSCs involve *extrinsic* masking, not intrinsic finking.  

  ---

  ### **4. The New Dispositionalist Dilemma**
  ND faces a fork:  
  - **Option 1**: Abilities require intrinsic bases (per Martin/Johnston).  
    → Then FSCs with *possible intrinsic intervention* (e.g., brain-scanners) **fink** abilities. PAP holds, and FSCs fail.  
  - **Option 2**: Abilities are extrinsic dispositions.  
    → Then determinism can permanently "mask" abilities via prior causes. Compatibilism collapses.  

  **Result**: ND must walk a tightrope—defending extrinsic masking in FSCs while denying deterministic masking. Critics (e.g., Randolph Clarke) argue this is ad hoc.

  ---

  ### **5. Responsibility Without Alternate Possibilities?**
  ND’s strongest move: Reject PAP entirely. Even *if* FSCs remove alternate possibilities, responsibility depends on the **actual sequence** of agency (e.g., the agent’s reasons-responsive mechanism).  
  - **Example**: Jones votes Democrat freely in an FSC. Though he couldn’t have voted Republican, he *would have* under different reasons (masked ability). His actual choice reflects his character/dispositions.  

  **Implication**: This shifts focus from *abilities* to *actual causal histories*. But it concedes FSCs *do* remove alternate possibilities—undercutting the original masking analogy.

  ---

  ### **Key Takeaway: Stalemate and Strategic Retreat**
  The finks/masks literature shows ND’s analogy **doesn’t decisively refute FSCs** but reframes the debate:  
  1. **FSCs may not remove abilities** (if masking holds), but...  
  2. **Responsibility doesn’t require abilities** anyway (if PAP is false).  

  This leads many compatibilists (e.g., Fischer) to abandon PAP and defend "actual-sequence" responsibility. Your argument with your friend reflects the literature’s unresolved tension: **Dispositionalism saves abilities only by risking their irrelevance to responsibility.**  

  #### **Further Reading**:  
  - Vihvelin’s *Causes, Laws, and Free Will* (2013) for ND’s full defense.  
  - Clarke’s *Libertarian Accounts of Free Will* (2003) for finking objections.  
  - Fischer’s *My Way* (2006) for the "actual-sequence" alternative.  

  The debate endures because FSCs expose a deeper rift: whether free will requires metaphysical abilities or merely reasons-responsive agency. Dispositionalism sharpens this question but doesn’t settle it.
