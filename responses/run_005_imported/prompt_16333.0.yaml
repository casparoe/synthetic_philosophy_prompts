answer: |-
  Here’s a draft memo for your committee meeting, designed to navigate the ethical and empirical tensions while offering a defensible path forward:

  ---

  **MEMORANDUM**  
  **TO:** AAC Review Committee  
  **FROM:** [Your Name], School Psychologist  
  **DATE:** [Current Date]  
  **RE:** Recommendation Regarding Letterboard Methods (RPM/S2C) for Student X  

  ### I. Core Dilemma
  The request to treat letterboard output as Student X’s "authored voice" presents two equally compelling, yet irreconcilable, imperatives:  
  1. **Ethical Imperative**: To presume competence and avoid silencing a nonverbal child’s sole means of complex expression.  
  2. **Scientific Imperative**: To ensure communication methods meet standards of authorship validation, given decades of controlled studies showing facilitator influence in FC/RPM/S2C.  

  Neither imperative can be dismissed lightly. The parents’ lived experience of their child’s apparent breakthroughs through the board demands respect. Simultaneously, our obligation to evidence-based practice requires acknowledging that *desire for belief* (ours or the parents’) cannot override methodological rigor.  

  ### II. Engaging the Strongest Counterarguments
  **In Favor of Acceptance**:  
  * The strongest case rests on **phenomenological validity**: What emerges through the board *feels* authentically human—nuanced, contextually coherent, and developmentally plausible. Dismissing this risks epistemic injustice, especially when no alternative method yields comparable expression. The Davidsonian "principle of charity" reminds us that *all* communication requires interpretive trust; demanding "proof" of authorship from a nonverbal child may impose an impossible standard.  

  **In Favor of Rejection**:  
  * The strongest case cites **blinded, controlled studies** (e.g., Cardinal et al., 1996; Schlosser et al., 2019) demonstrating facilitator control in RPM/S2C. When tested, messages consistently reflect the facilitator’s knowledge—not the student’s. Treating uncorroborated output as "voice" risks:  
    - Misrepresenting the student’s abilities for IEP/placement decisions.  
    - Diverting resources from validated AAC strategies (e.g., robust SGDs, ASL, PECS Phase IV+).  
    - Violating our duty to protect students from unsubstantiated interventions.  

  ### III. The Inescapable Bind
  Davidson’s insight cuts both ways:  
  - **If the child is authoring the messages**, charitable interpretation reveals a mind we’d otherwise miss.  
  - **If facilitator influence is occurring**, charitable interpretation *creates* the illusion of a mind by filtering noise into coherence.  

  We cannot resolve this through interpretation alone. **The board’s output cannot self-validate.**  

  ### IV. Recommendation: A Conditional, Evidence-Building Path  
  **Do NOT treat letterboard output as authoritative for IEP goals/placement**—but **DO** preserve the aide’s services *temporarily* under strict conditions:  

  1. **Immediate Safeguards**:  
     - The aide’s role shifts from "facilitator" to **communication partner trained in modeling AAC without physical support**.  
     - All board output documented as "Partner-Assisted Communication (Unauthenticated)"—never as the student’s independent voice.  

  2. **Validation Protocol (6-Month Timeline)**:  
     - **Motor/Intent Testing**: Collaborate with an independent OT to assess purposeful motor control (e.g., can Student X isolate a finger to *reliably* select icons/keys *without physical guidance*?).  
     - **Blinded Message-Passing Trials**: Design tasks where the student conveys novel information unknown to the aide (e.g., hidden object descriptions, preferences unbeknownst to staff). *Only consistently validated messages may inform IEP goals*.  
     - **Parallel AAC Training**: Invest equally in an independent AAC system (e.g., eye-gaze SGD, touch-accessible grid) with clear authorship.  

  3. **Parent Partnership**:  
     - Frame this as: *"We share your goal—ensuring Student X’s true voice guides their education. To protect against unconscious bias, we propose testing whether the board’s messages can be independently verified. If so, we will enthusiastically integrate them. If not, we pivot to methods that guarantee authenticity."*  
     - Offer monthly validation demonstrations to maintain transparency.  

  4. **IEP/Placement Implications**:  
     - Base goals *only* on:  
       - Verified outputs (if validation succeeds).  
       - Observable, measurable skills (e.g., "Student will select 'yes/no' icons independently to answer preference questions").  
     - **No placement changes** may rely on unverified board output.  

  ### V. Rationale for Conditional Continuation  
  - **Avoids Premature Closure**: Cutting off the method disregards parental insight and the *possibility* of competence. Validation testing respects both hope and rigor.  
  - **Mitigates Harm**: Maintaining the aide preserves rapport while redirecting focus toward motor/access skills.  
  - **Upholds FAPE**: Ensures decisions reflect the student’s *demonstrated* abilities, not contested proxies.  

  ### VI. If Validation Fails  
  Should messages not withstand controlled testing:  
  - Phase out letterboard services over 30 days.  
  - Redirect resources toward motor-based AAC with authorship safeguards (e.g., SGDs with latency/dwell-time settings).  
  - Maintain parent engagement through AAC coaching and data-sharing on *independent* communication gains.  

  ---

  **Why this path?** It acknowledges the profound stakes—for the child’s autonomy, the parents’ hope, and our professional integrity—while refusing to conflate interpretation with evidence. The board’s messages *might* be Student X’s voice, but our obligation isn’t to believe; it’s to *verify*. Until we do, we cannot risk building this child’s future on words that may not be theirs.  

  This recommendation honors the heart of both sides: the parents’ demand that their child be heard, and the SLP’s demand that we listen *rigorously*.
