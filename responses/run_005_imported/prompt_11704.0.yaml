prompt: |-
  I sit on the executive committee of a mid-sized manufacturing firm deciding what to do about a three-year-old breach-of-contract suit against a former supplier. We've already spent $3.5 million in legal fees; outside counsel says another $1.5 million and eight months would get us to trial, where we could win $6 million or lose entirely, and the supplier has just offered to settle for $500,000. Over dinner last night, a friend who teaches game theory argued that we're now in a real-world dollar auction: since neither side can recover what it has already spent, stopping now locks in a $3 million loss for us, while continuing offers a chance of coming out ahead at the risk of an even larger one — and the supplier faces the mirror image of that same choice, so both of us have reason to keep escalating well past the point where, in hindsight, stopping would have made more sense. A colleague's draft memo takes this to mean we should simply accept the settlement, since sunk costs are sunk; I think that's too quick, because what we should do here depends on what the supplier is likely to do next, not only on what we've already spent. Please draft the short memo I'll bring to Monday's vote: a concrete recommendation — accept, counter, or proceed to trial — with a timeframe, reasoning that actually engages the two-sided escalation dynamic my friend described rather than just invoking "ignore sunk costs" the way my colleague did, and a fair account of the strongest consideration against whatever you end up recommending.
reasoning: |-
  Okay, let me tackle this manufacturing executive's dilemma. They're stuck in a legal standoff that perfectly mirrors a dollar auction - that game theory scenario where bidders end up paying more than the prize is worth. The key here is recognizing this isn't just about their $3.5M sunk costs, but about predicting the supplier's next move.

  Hmm... the executive specifically wants me to avoid the oversimplified "ignore sunk costs" advice their colleague gave. Rightly so - in auction dynamics, what the other player believes matters as much as your own costs. The supplier offering $500K tells us they're also bleeding and want out. 

  Let me break this down: Winning $6M at trial sounds great but would cost another $1.5M in fees over 8 months. More importantly, the supplier's legal costs are probably similar to ours. If they've spent say $3M already, paying our $500K settlement hurts less than a $6M loss at trial. But if they think we'll fold, they might reject counters. 

  Wait - the strongest move might be a time-pressured counteroffer. Demand $1.5M by Friday, framing it as their "last chance to avoid mutual destruction." This exploits their fear of trial while capping our further losses. The risk? They call our bluff and we're back to square one. But given they initiated settlement, they're likely more desperate than they appear.

  For the memo, I'll structure: 1) Recommendation with deadline 2) Game theory rationale 3) Contingency plan 4) Counterargument about optics. The beauty is making the supplier bear the next decision - if they accept, we save face; if not, we fall back to settlement with moral high ground. 

  Key insight: In dollar auctions, the player who credibly commits to escalation often wins. But here, neither can afford to.
answer: |-
  ## MEMORANDUM  
  **To:** Executive Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommended Action on Supplier Litigation & Escalation Dynamics  

  **1. Recommendation:**  
  **Counter the supplier’s settlement offer with a demand for $1.5 million, payable within 30 days. If rejected, immediately accept their $500,000 offer.**  

  **2. Core Reasoning (Engaging the Dollar Auction Dynamic):**  
  Our situation is a textbook "dollar auction," where both parties are trapped by prior investments. Crucially, **the supplier’s offer signals their own desire to avoid further losses**—revealing weakness we can exploit.  

  - **Why Counter ($1.5M)?**  
    - **Asymmetric Risk:** We risk $1.5M more to potentially gain $6M (net $4.5M upside). The supplier risks $1.5M+ in additional fees *and* a $6M loss. Their downside is larger, making them likelier to fold if pressured.  
    - **Credible Commitment:** A high-stakes counter demonstrates resolve, increasing their perception that we *will* escalate. This leverages their sunk costs ($3M+ likely spent) against them.  
    - **Anchor Adjustment:** Their $500K offer anchors the negotiation low. $1.5M resets expectations toward our potential trial win.  

  - **Why Settle for $500K if Rejected?**  
    - **Avoid Mutual Destruction:** If they reject $1.5M, they signal willingness to escalate further. Proceeding to trial risks a net $5M loss for us ($3.5M sunk + $1.5M new costs). Their offer provides a $3M loss cap—better than gambling $5M for a $6M gain (net $1M upside).  
    - **Time Value:** Eight months of distraction vs. closure.  

  **3. Strongest Counterargument:**  
  *We incentivize further escalation.* If the supplier interprets our counter as bluster, they may harden their position, forcing us into trial after wasting time negotiating. This could increase legal fees beyond projections and eliminate the $500K exit option.  

  **4. Contingency & Timeframe:**  
  - Present the $1.5M counteroffer **within 48 hours**, with a **72-hour expiry**.  
  - If rejected, accept their $500K offer **immediately**.  
  - No further negotiation.  

  **Rationale Summary:** The dollar auction dynamic demands we test the supplier’s pain threshold *once*, using their offer as leverage. Countering exploits their vulnerability; settling if rejected caps our downside. Sunk costs are irrelevant, but the *fear of future costs*—theirs and ours—is the weapon.  

