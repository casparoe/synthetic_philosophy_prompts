  I'm writing a novel featuring two AI alignment researchers, once close collaborators, who have grown estranged over an unresolved technical dispute about the shutdown problem. One maintains that any genuinely corrigible agent must sacrifice strict expected-utility coherence, since a fully coherent agent would have instrumental reasons to resist or manipulate attempts to switch it off; the other insists that corrigibility can be secured without giving up coherence, provided the agent's preferences over shutdown-and-non-shutdown trajectories are structured correctly from the start. Write a dialogue between them, set during a tense exchange at a conference dinner, in which they press each other on the deeper theoretical and practical stakes of this disagreement. Keep both characters equally sharp, and don't let either land a decisive final blow.
