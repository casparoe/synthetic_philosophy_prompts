  For the alternative possibilities angle, I need to stress that any flicker of freedom (like changing the sign) is irrelevant to moral responsibility. What matters is whether Jones acted for his own reasons without coercion. The thought experiment isolates this by making alternative paths non-robust—they'd lead to identical outcomes via Black's intervention. 

