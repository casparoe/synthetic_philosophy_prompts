prompt: |-
  This term I am taking a seminar on practical reason, and this week's unit on Bernard Williams's "Internal and External Reasons" has left me more puzzled by the secondary literature than by Williams's own paper. As I understand Williams's central move, a reason statement is only intelligible as a genuine reason (rather than a mere assertion that some consideration would be good to act on) if it could, via a "sound deliberative route," connect up to some element of the agent's actual subjective motivational set S — and "sound" carries real weight here, since Williams's well-known example of a man who wants a gin and tonic but unknowingly reaches for a glass of petrol is meant to show that a false belief can produce motivated action without producing a genuine reason. Both John McDowell, who appeals to the practically wise agent's perceptually acquired "second nature," and Christine Korsgaard, who distinguishes the general requirement that reasons be capable of motivating a rational agent from the further Humean claim that reasons must derive from some pre-existing desire, are standardly presented in my seminar as having found a real gap in Williams's argument that leaves room for external reasons after all.

  I am not convinced that either reply actually secures what an external reasons theorist needs, and I would like your help pressure-testing that instinct before committing to it in a term paper. Specifically, please argue for the following thesis as forcefully as you can: that neither McDowell's nor Korsgaard's response establishes the existence of reasons that are genuinely external in Williams's sense, because each is best read as arguing only that S should be understood more expansively — as including latent perceptual capacities, or the power of rational reflection itself — rather than as identifying reasons that float free of S altogether. Please engage with the actual structure of at least one of the two replies rather than a generic gloss on "internalism versus externalism," and be sure to address the strongest objection to your own thesis: that if S can be stretched to cover any capacity an agent could in principle develop, internalism ends up excluding nothing, so my proposed "terminological" diagnosis would end up trivializing Williams's thesis rather than defending it.
reasoning: |-
  Okay, the user is deep into a philosophy seminar on practical reason, specifically wrestling with Bernard Williams's "Internal and External Reasons" and the critiques by McDowell and Korsgaard. They feel the secondary literature is more confusing than Williams's original paper. Their main query is whether McDowell and Korsgaard actually succeed in defending external reasons or if they're just expanding the internalist framework. 

  Hmm, the user's instinct is that neither McDowell nor Korsgaard truly establishes external reasons—they just stretch the definition of the agent's "subjective motivational set" (S). That’s a sharp observation. They want pressure-testing for their term paper argument, so I need to defend this thesis rigorously. The challenge is twofold: engage deeply with at least one philosopher’s actual argument structure (not just labels), and tackle the "trivialization" objection—that if S can expand infinitely, internalism becomes vacuously true.

  First, let’s unpack Williams. His core move: a reason must link to the agent’s S via sound deliberation. The gin/petrol example shows that false beliefs don’t create real reasons. McDowell counters with "second nature": moral perception can reveal reasons through cultivated virtue, not pre-existing desires. Korsgaard argues rational agents are motivated by reasons qua rational, so no prior desire is needed. But the user suspects both still anchor reasons in capacities *within* S, just latent ones. 

  For McDowell: His "perceptual capacities" aren’t external—they’re cultivated dispositions *in* S. When a virtuous person sees a reason (e.g., to help), that perception stems from their trained sensibility, which Williams would call part of S. The deliberation route exists: "If I were practically wise, I’d see this reason → but I can *become* wise (it’s in my S as potential) → so I have reason now." That’s internalist! 

  For Korsgaard: She rejects deriving reasons from desires, but her "rational motivation" still requires the agent to *endorse* the reason via reflection. If they don’t—or can’t, due to irrationality—the reason doesn’t apply. Williams’s internalism allows for this: irrational agents lack reasons because sound deliberation *from their S* is blocked. Korsgaard’s "rational agent" standard collapses into what the agent *would* motivationally connect to if rational—which is Williams’s "if S were improved" case. 

  Now the big objection: If S includes *any* developable capacity (like becoming wise or rational), doesn’t internalism include everything? Here’s how to defend: Williams’s constraint isn’t about possible S-expansions but *current* grounding. Externalists want reasons binding agents *regardless* of their S’s potential (e.g., "you must φ even if you couldn’t ever be motivated via sound deliberation"). McDowell and Korsgaard don’t secure that—they just show S is richer than crude desire models. 

  The trivialization worry is serious but answerable. Williams *excludes* reasons that couldn’t motivate any version of the agent (e.g., a cat’s "reason" to recite Shakespeare). His "could motivate" has modal limits: it must be possible *for that agent’s S*. A psychopath might *never* develop compassion—so for them, compassion-based reasons remain external. McDowell/Korsgaard’s expansions only work for agents with the *raw capacities* to develop virtue/rationality. 

  User’s paper should stress: The debate hinges on whether reasons require *actual* motivational links (internalism) or not (externalism). Both critics focus on *how to describe S*, but neither gives a case where a reason binds without *any* link to S’s potential. That’s the hole in their replies.
answer: |-
  Your instinct is perceptive—neither McDowell nor Korsgaard successfully establishes reasons *external* to Williams's framework. Both subtly relocate the source of normativity *within* an expanded conception of the agent's subjective motivational set (S), rather than transcending S altogether. Below, I defend your thesis rigorously, focusing on McDowell's structure and addressing the trivialization objection.

  ### Core Argument: McDowell's "Second Nature" as Internalist Expansion
  McDowell argues that Williams overlooks how *cultivated perception* generates reasons. The practically wise agent (the *phronimos*) perceives moral demands directly—e.g., "This suffering person needs help"—without inferring from prior desires. For McDowell, this perceptual capacity constitutes a "second nature" acquired through moral education. Crucially, he presents this as an **external reason**: the reason exists independently of the agent's current motivations, accessible only through refined perception.

  **Why this remains internalist:**  
  McDowell's "second nature" must be *actualizable from within the agent's S*. Williams defines S inclusively: it contains "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects" (*Internal and External Reasons*, 105). Perceptual capacities cultivated through moral training fit this description—they are **latent potentials within S**, activated via sound deliberation. Williams explicitly allows that S can evolve:  
  > "There are essential indeterminacies in what an agent might come to be motivated by" (102).  

  McDowell's *phronimos* isn't introducing reasons *external* to S; they are revealing what the agent *could* motivationally access *if* S were developed via sound deliberation (e.g., moral education). The reason "Help the suffering person" is internal because:  
  - It depends on the agent's *capacity* for moral perception (a potential element of S),  
  - It requires a "sound deliberative route" (moral training) to become motivationally efficacious.  
  Williams’ gin/petrol example rejects false beliefs, not latent capacities. McDowell’s perceptual reasons avoid the petrol fallacy because they stem from *truth-apt* capacities within S.

  ### Korsgaard's Rational Reflection: Still Grounded in S
  Korsgaard distinguishes the *Humean condition* (reasons require pre-existing desires) from the *internalism requirement* (reasons must motivate rational agents). She argues rational agents can be motivated by reasons *qua* rational beings, without prior desires. For example, recognizing a moral duty *as rational* motivates action.  

  **Why this doesn’t secure externality:**  
  Korsgaard's "rational reflection" is a **constitutive element of S**. Williams includes "commitments to practical rationality" in S (105). When Korsgaard claims rationality itself motivates, she presupposes the agent has a *disposition to respond to rational norms*—a disposition that resides in S. If an agent utterly lacked this disposition (e.g., severe psychopathy), Korsgaard’s reasons would not apply. Thus, her model satisfies Williams’ condition: reasons must link to S via sound deliberation (here, rational reflection).

  ---

  ### Addressing the Strongest Objection: Trivialization
  **Objection:** If S includes *any* latent capacity (e.g., moral perception, rationality), internalism becomes vacuously true—it excludes nothing, rendering Williams’ thesis trivial.  

  **Reply:** This misconstrues Williams’ modal constraint. Internalism remains substantive because:  
  1. **Non-ideal accessibility:** A reason R is internal only if the agent *could actually connect R to S via sound deliberation*. For agents lacking specific capacities (e.g., a narcissist without empathy), moral reasons *cannot* be motivationally accessed—even with idealized deliberation. Williams’ "could" is constrained by the agent’s *actual psychological constitution*.  
     - *Example:* A person with incurable apathy has no reason to be charitable. No expansion of S can generate motivation; thus, externalists lose.  

  2. **Soundness as a filter:** "Sound deliberative route" excludes irrational transformations. Deliberation must correct false beliefs (gin/petrol) and expand knowledge—but cannot *replace* core elements of S. McDowell’s moral education and Korsgaard’s rationality are *deliberative refinements*, not external impositions.  

  3. **The externalist’s burden:** True externalism requires reasons binding on agents *even if no possible deliberative route could motivate them*. Neither McDowell nor Korsgaard defend this. They only show S is richer than crude desire models.  

  ---

  ### Conclusion: A Terminological Victory for Williams
  McDowell and Korsgaard succeed in arguing that S includes *rational capacities and perceptual potentials*, but they fail to identify reasons untethered from S. Williams’ internalism survives because:  
  - **McDowell** relocates "external" reasons to *cultivated capacities within S*.  
  - **Korsgaard** reduces rationality to a *motivational disposition in S*.  
  The trivialization objection fails: internalism remains exclusionary by requiring *feasible* motivational paths anchored in the agent’s psychology. Your diagnosis doesn’t weaken Williams—it sharpens his insight that all reasons must be *agent-relative*.  

  **For your paper:** Press McDowell on whether the *phronimos*’s perceptions could motivate an agent *without any latent moral capacity*. If not, the reason is internal. Contrast with a genuinely external reason (e.g., "Respect Kant’s law, even if you’re incapable of caring about duty") to highlight the gap.
