prompt: |-
  I'm teaching Lewis's Convention again this term in my social philosophy seminar, and last week we got through all the coordination-problem stuff — common knowledge, the clause that says a regularity only counts as a convention if some other regularity would've worked just as well and could've gotten established instead. One of my sharper students cornered me after class with a worry that I fumbled in the moment and haven't been able to shake since, so I want to run it by you before I have to face her again next week.

  Her point was basically: if what makes something a convention, on Lewis's account, is exactly that its arbitrary in that sense — any of several equilibria would've done, we just happened to land on this one — then conventions are interchangeable by definition, and if they're interchangeable there's no standpoint left from which to say one is better or more justified than another. So take something like the expectation that women do most of the unpaid housework, or the old dress-code norms around gender — if that's a Lewis-style convention, kept in place by everyone expecting everyone else to keep conforming, doesn't calling it "a convention" in his technical sense actually shield it from being criticized as unjust, since by hypothesis some other arrangement would've worked equally well and his theory gives us no grounds to prefer one over the other? And she had a follow-up that I definately didn't handle well either: if conventions really are that arbitrary, is there any room in Lewis's picture for a population to rationally evolve away from a bad convention toward a better one, or does his account just predict that whatever equilibrium we're sitting in is as good as it gets? I said something hand-wavy about is and ought and moved on, but I'd like to actually get this right before the next session — can you help me sort out where, if anywhere, her reasoning goes wrong, and what the arbitrariness condition does and doesn't commit Lewis to?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching Lewis's Convention in a social philosophy seminar and a student raised a concern about the arbitrariness of conventions. The student argued that if conventions are arbitrary and interchangeable, then labeling something as a convention might shield it from criticism, like gender norms in housework or dress codes. The teacher fumbled the response and wants to clarify before the next class.

  First, I need to recall Lewis's definition. Lewis says conventions are solutions to coordination problems where multiple equilibria exist, and the choice is arbitrary because any could work if everyone follows it. The student's worry is that this arbitrariness implies no normative grounds to prefer one convention over another, thus making criticism of unjust conventions invalid. 

  The follow-up question is about whether Lewis's model allows for transitioning from a bad convention to a better one. The user mentioned giving a hand-wavy answer about is/ought and needs a solid response. 

  So, the core issues here are: 1) Does calling something a convention make it immune to moral criticism? 2) Can Lewis's framework explain rational shifts between conventions?

  Breaking down the first point. Lewis's arbitrariness is descriptive, not normative. He's explaining how conventions emerge, not judging them. Pointing out that a practice is conventional just means it's socially constructed and could be different, which actually opens it up to critique. For example, knowing that gendered housework isn't inevitable but a result of historical contingencies strengthens arguments for change. The student might be conflating the explanation of existence with justification. 

  On the second point, Lewis does allow for conventions to change. If preferences shift (e.g., valuing gender equality), the existing convention may no longer be an equilibrium. People can coordinate to adopt a new norm. Lewis's model includes dynamics where salience or focal points help switch equilibria. So, rational evolution is possible when there's common knowledge of dissatisfaction and a viable alternative.

  The user needs to clarify that arbitrariness doesn't imply all conventions are equally good. Moral evaluation is external to Lewis's definition. Also, conventions can be stable yet changeable under the right conditions. Using examples like civil rights movements or shifts in workplace dress codes could help illustrate this.

  I should also address possible misunderstandings. The student might think Lewis's theory endorses the status quo, but it's neutral. Highlighting the difference between descriptive arbitrariness and normative assessment is key. Emphasizing that recognizing something as conventional is the first step to challenging it, not protecting it.

  For the follow-up, explaining how preference transformations and collective action enable transitions. Maybe mention Lewis's mechanisms for shifting conventions, like explicit agreements or salient events. Stress that the theory doesn't freeze societies in place; it explains stability but also allows for change when underlying factors shift.

  The user's deeper need is to confidently address the student's concerns without dismissing them, showing how Lewis's framework can coexist with social criticism. They might also want to validate the student's insight while clarifying the theoretical nuances. Providing concrete examples and distinguishing between the is/ought divide will strengthen their response.
answer: |-
  That's a sharp student indeed, and she's hit on a tension that philosophers have wrestled with for decades. Her worry is understandable but rests on a subtle conflation within Lewis's framework. Let's break it down:

  **1. The Core Misunderstanding: Arbitrariness ≠ Normative Indifference**

  *   **Lewis's Claim:** The arbitrariness condition ("some other regularity R' could have served instead") is a *descriptive* claim about the *genesis and stability* of conventions. It explains *why* a particular pattern persists: because it solves a coordination problem and *any one of several possible solutions* could have filled that role historically. It's about *how conventions work*, not about *which ones we should have*.
  *   **Not a Shield:** Calling a practice "conventional" in Lewis's sense **does not shield it from criticism.** It actually does the opposite:
      *   **Demystifies:** It shows the practice is *not* natural, inevitable, divinely ordained, or uniquely rational. It's contingent. *This is the first step in critique.* Knowing something *could have been different* (and could *be* different) is essential for arguing it *should* be different.
      *   **Highlights Contingency:** The very arbitrariness means the *burden of justification* falls on the convention itself. If it wasn't the only possible solution, why *this* one? Why *keep* this one? Convention ≠ Justification.
  *   **The "Interchangeability" Trap:** The student is right that, *from the perspective of solving the original coordination problem alone*, the conventions are interchangeable *in terms of functionality*. But that's a *very narrow* perspective. Conventions exist within a complex social world with multiple, overlapping coordination problems and deep normative commitments.

  **2. Why Critiquing Conventions is Perfectly Compatible with Lewis:**

  *   **External Values:** Lewis's theory explains the *mechanism* of conventions. It doesn't say that *only* coordination efficiency matters. We judge conventions based on values *external* to the coordination problem they solve:
      *   **Justice/Fairness:** Does the convention distribute benefits and burdens fairly (e.g., unpaid housework falling disproportionately on women)? Does it respect rights?
      *   **Efficiency:** Even if it coordinates, is it *the most efficient* way? Does it create unnecessary burdens?
      *   **Well-being:** Does it promote or hinder human flourishing?
      *   **Freedom/Autonomy:** Does it unduly restrict choices or enforce harmful norms?
  *   **The Housework Example:** Calling the gendered division of labor a convention *exposes* its arbitrariness. We can then ask: *Given that other arrangements (e.g., truly equal sharing) could also coordinate household labor, why stick with this particular, demonstrably unjust one?* Lewis's account helps us see it *isn't* necessary, making the demand for change *more* reasonable, not less. The critique isn't about coordination; it's about justice *within* the coordinated outcome.

  **3. Evolving Away from "Bad" Conventions: Lewis *Allows* for Change**

  This is where Lewis's model is more dynamic than the student fears. His account *predicts* stability but *does not preclude* change. Here's how rational evolution away from a "bad" convention can happen *within* his framework:

  *   **Shifting Preferences/Values:** Lewis's equilibria depend on agents' preferences. If preferences change (e.g., widespread adoption of feminist values rejecting the justice of the gendered housework norm), the *old convention may cease to be an equilibrium*. People no longer prefer to conform if they expect others might also prefer not to conform. This creates instability.
  *   **New Coordination Problems:** Recognizing the injustice *creates a new coordination problem*: "How do we coordinate on a *fairer* division of labor?" The old convention is now seen as solving the *wrong* problem (mere coordination) poorly (unjustly). The population needs to solve the *new* problem: coordinating on a just arrangement.
  *   **Mechanisms for Change (Salience & Agreement):** Lewis explicitly discusses how conventions change:
      *   **Explicit Agreement:** People can *deliberately agree* to switch conventions (e.g., couples negotiating new housework rules, societal movements demanding policy changes).
      *   **Salience (Focal Points):** A new, clearly superior (e.g., fairer, more efficient) alternative can become salient. Growing dissatisfaction with the old norm combined with a visible, viable alternative (e.g., egalitarian models gaining prominence) can make the new norm the focal point for coordination. Social movements often work to *create* this salience.
      *   **Gradual Drift:** Small deviations, if widely adopted and reinforced by changing expectations, can shift the equilibrium over time.
  *   **The Dress Code Example:** The old gender-specific dress code was a convention solving coordination problems around social signaling and propriety. Critiques highlighted its restrictiveness, unfairness, and irrelevance. Changing values made the old equilibrium unstable. New focal points emerged (more androgynous styles, "business casual" norms less tied to gender), and explicit challenges (legal, social) provided mechanisms for coordinated shifts. Lewis's model explains *why* the old norm was stable *until* preferences changed and new coordination solutions became salient or were agreed upon.

  **4. Where the Student's Reasoning Goes Slightly Astray (and How to Respond):**

  *   **Conflation of Levels:** She conflates the *explanation* of a convention's existence/stability (which relies on arbitrariness and mutual expectations) with its *evaluation* (which relies on external normative standards). Lewis provides the former, not the latter. Philosophers use his *description* as a tool for *critique*.
  *   **"As Good as it Gets"?** No. Lewis says the *current equilibrium* is stable *given current preferences and expectations*. But if preferences change (e.g., towards valuing justice) or a better alternative becomes salient, the current convention is demonstrably *not* "as good as it gets" *from the perspective of those new preferences*. The model predicts change *will* happen if a new, mutually preferable equilibrium becomes common knowledge.
  *   **The "No Standpoint" Worry:** The standpoint for critique comes from *outside* the narrow coordination problem. We bring in ethics, political philosophy, and other values. Lewis's theory helps us see the convention *as* contingent, making the external standpoint *more* powerful.

  **How to Frame This for Your Student:**

  "Your worry is incredibly insightful and gets right to the heart of a crucial tension. You're absolutely correct that Lewis's *arbitrariness condition* means that, purely in terms of solving a specific coordination problem, multiple conventions are functionally equivalent. *However*, this doesn't mean they are equivalent *overall*, or that calling something a convention protects it.

  1.  **Arbitrariness is Explanatory, Not Justificatory:** Lewis is telling us *how* these patterns stick, not *why we should keep them*. Showing something is conventional *exposes* its roots in historical accident and mutual expectation, not inherent value. This is ammunition for critique, not a shield. If anything, knowing it's arbitrary *demands* justification.
  2.  **Conventions Live in a Normative World:** We judge conventions by values like justice, fairness, and well-being, which exist *outside* the narrow logic of the coordination problem. The gendered housework convention might coordinate, but it does so unjustly. Lewis helps us see we *could* coordinate differently, so we *should* strive to.
  3.  **Change is Built-In:** Lewis's model *predicts* stability, but it also *explains* change. When values shift – when people widely decide a convention is unfair or inefficient – it destabilizes the old equilibrium. We then face a *new* coordination problem: finding a better norm. This can happen through conscious agreement, finding a new salient focal point (like a clearly fairer model), or gradual shifts in expectation. Recognizing injustice *is* the catalyst for this change.

  So, Lewis gives us a powerful tool: he shows us the gears of social norms. Seeing them as conventions doesn't freeze them in place; it shows us they are human-made, contingent, and therefore *changeable*. Calling something a convention is the start of the critique, not the end of the conversation."

  **Key References to Lean On (from Lewis himself):**

  *   Lewis explicitly states conventions are judged by standards *other* than their conventionality (e.g., morality, efficiency - p. 99-100 of *Convention*).
  *   He discusses mechanisms for changing conventions, including explicit agreement and salience (Ch. IV, especially sections 4 & 5).

  This framing should empower your student (and you!) to use Lewis's powerful analytical tool precisely *for* social critique, not see it as an obstacle. Good luck next week!
