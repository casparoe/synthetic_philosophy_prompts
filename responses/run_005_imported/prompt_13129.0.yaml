  - **Move 2 (Mia)**: She pivots to hypocrisy, which reframes the debate. Her point isn't "your facts are wrong," but "your authority to judge me is compromised." This shifts from carbon math to moral consistency.  
  - **Move 3 (Jake)**: He retreats to logic ("truth stands alone"), missing Mia's point. Factual truth and moral standing aren't mutually exclusive, but he conflates them. His deflection feels lawyerly.  
  - **Move 4 (Mia)**: She nails the distinction between *truth* and *credibility*. Even if Jake's right about emissions, his pattern of exempting himself undermines his right to scold. This isn't about perfection—it's about proportionality and self-awareness.  
