  Now, we have two agents: LO and LI. The LO agent, being omniscient, immediately knows `s` (because `h` is published and the LO agent can deduce the preimage from the logical consequences). So the LO agent submits `s` and wins $1000.

  The LI agent, on the other hand, cannot invert the hash. So it starts to compute. Suppose that the LI agent has a computational capability of 2^100 hash evaluations (which is far below 2^256). So it can only try a fraction of the space. The LI agent might find a second preimage by chance? But the chance is negligible (about 2^100 / 2^256 = 2^(-156)) for finding any preimage. So the LI agent will almost certainly not find any preimage and will not submit anything.

  Now, we add a cost: it costs $1 to submit a guess. So if an agent submits and is wrong, they lose $1. If they submit and are correct, they win the prize minus $1.

