  Concrete Example: A One-Time Pad with a Twist

  We design a game between two players: Alice and Bob. Alice sends Bob a ciphertext that is encrypted with a one-time pad. The one-time pad is a secret key that is a string of `n` bits, and the plaintext is also a string of `n` bits. The encryption is `c = plaintext XOR key`.

