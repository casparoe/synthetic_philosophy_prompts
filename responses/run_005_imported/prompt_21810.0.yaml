  - If LO defects and LI cooperates: LO gets 5+2=7, LI gets 0.
  - If LO cooperates and LI defects: LO gets 0+2=2, LI gets 5.
  - If both defect: LO gets 1+2=3, LI gets 1.

  The LO player, being rational, will choose to defect because:

    If the other player cooperates: defecting gives 7 > 5.
    If the other player defects: defecting gives 3 > 2.

  The LI player, without the bonus, has the standard prisoner's dilemma payoffs. If the LI player believes the LO player will defect (which is dominant for the LO player), then the LI player will defect (because defecting gives 1 vs 0 if they cooperate).

  So the outcome is (defect, defect) with payoffs: LO gets 3, LI gets 1.

