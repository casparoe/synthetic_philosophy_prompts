  The LI agent: does not submit because the expected value is negative. So it gets $0.

  Again, the LO agent does better.

  We need a situation where the bounded agent's ignorance is beneficial. Consider a scenario where the agent is interacting with an adversary that can exploit the agent's knowledge.

  Example: Prisoner's Dilemma with a Cryptographic Twist

  We design a two-player game between Alice and Bob. They are playing a prisoner's dilemma, but with a twist: before the game, each player is given a cryptographic puzzle. Specifically, each player is given a hash value `h` and told that if they can find a preimage `s` such that `H(s)=h` within a time limit, they will be given a bonus that changes their payoff.

  The prisoner's dilemma payoffs are:

  - If both cooperate, both get 3.
  - If one defects and the other cooperates, the defector gets 5 and the cooperator gets 0.
  - If both defect, both get 1.

  Now, the twist: if a player finds the preimage to their puzzle, they get an additional +2 to their payoff in the prisoner's dilemma. But note: the puzzles are different and independent.

  However, we set it up so that the puzzles are extremely hard (n=256 bits). And the time limit for the prisoner's dilemma move is very short, so that no one can solve the puzzle during the game.

  But now, consider the knowledge of the players:

  - The LO player: knows the preimage instantly. So at the time of the prisoner's dilemma move, the LO player already has the bonus +2.

