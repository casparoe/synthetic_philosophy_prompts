  New Idea: A Cryptographic Commitment Challenge

  We have a trusted third party (TTP) that sets up a challenge:

  1. The TTP chooses a random 256-bit string `s` and computes `h = H(s)`, where H is a cryptographic hash function.
  2. The TTP then commits to `s` by publishing `h`.
  3. The TTP then asks agents to submit a string `s'` such that `H(s') = h`. The first agent to submit a valid preimage wins $1000.

  However, the TTP also includes a twist: if an agent submits a string `s'` that is not the original `s` (i.e., a second preimage), then that agent wins only $500. And if they submit `s`, they win $1000.

