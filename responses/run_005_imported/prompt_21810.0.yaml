  We want `k` to be chosen to maximize this. But note: for large `n` (say n=256), even k=1 gives an expected payoff of (1/2^256)*1000 - 1 ≈ -1, which is negative. So the LI Bob would choose k=0 and get 0.

  But wait: the LO Bob gets $999 and the LI Bob gets $0. The LO Bob does better.

