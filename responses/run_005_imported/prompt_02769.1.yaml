  To map this to Zorn's lemma, consider the poset of partial choice functions. Partial functions that select socks from some pairs but not others. The chains are collections of these functions that are comparable (one extends another). The upper bound for a chain would be the union of these functions, which is still a partial choice function. A maximal element in this poset would be a complete choice function, but Zorn's lemma requires that every chain has an upper bound to guarantee that maximal element. The issue is that without AC, you can't ensure that the partial functions can be extended to cover all pairs, especially for socks where there's no distinguishing property.

