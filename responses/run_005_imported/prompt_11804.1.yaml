  Okay, the user is diving into AI alignment discussions on LessWrong and has encountered the coherence theorem argument. They're confused about whether it really implies that advanced AI must become a utility maximizer. They found some pushback, possibly from Rohin Shah, about the theorem requiring unrealistic assumptions. They want a dialogue between two characters debating this, with both sides being strong and responsive.

  First, I need to recall the coherence theorem's core: it states that avoiding money-pumping requires preferences to be complete and transitive, leading to behavior that can be modeled as EU maximization. The proponent (let's call them Alex) will argue this is fundamental for any rational agent, including AI. The skeptic (Taylor) will challenge the practical relevance, pointing out that bounded agents don't need global coherence.

  Alex might start by framing money-pumping as an existential threat—if an AI isn't coherent, it could be exploited into catastrophic actions. Taylor would counter that real-world agents (including humans and AIs) operate in limited domains, so incomplete preferences in unreachable states don't matter. The key point here is exploitability: Taylor argues incoherence only matters if it's practically reachable, which it might not be for a bounded agent.

  Next, the trivial utility function objection. Taylor would say you can always retro-fit a utility function to any behavior, making the theorem vacuous. Alex would respond that the theorem forces the utility function to be predictive and consistent across new situations—otherwise, the AI isn't actually robust. This ties into the safety concern: if an AI's preferences are messy and context-dependent, it might behave unpredictably when scaled up.

  Taylor might bring up humans as examples of non-EU-maximizers who still function. Alex would concede that humans are messy but argue that superintelligent systems, especially goal-directed ones, will iron out inconsistencies to avoid vulnerabilities. The debate then shifts to whether "corrigibility" or other safe designs can persist under optimization pressure. Alex thinks coherence pushes toward ruthless maximization; Taylor believes we can embed stable, non-instrumental values.

  The user's deeper need seems to be understanding if AI alignment is doomed by this theorem. They're likely worried about control and want clarity on whether theoretical arguments hold in practice. The dialogue should resolve by acknowledging that while coherence is a real constraint, it doesn't dictate specific utility functions—so careful design might still work, but with caveats about hidden inconsistencies under optimization.
answer: |-
  ## Dialogue: The Coherence Theorem Debate

  **Characters:**  
  *   **Alex:** Thinks the coherence theorems are fundamental and show advanced AI *will* likely become a robust EU maximizer, posing safety risks.  
  *   **Taylor:** Thinks the theorems are often misinterpreted and don't force real-world agents (especially bounded ones) into ruthless EU maximization; safety design space remains open.  

  **(Setting: A virtual coffee chat after an online alignment debate)**

  **Alex:** Okay, Taylor, circling back to that coherence theorem point. I keep seeing people dismiss it as irrelevant to real AI risk, especially the "money-pumping implies EU maximization" angle. But I think that's dangerously shortsighted. If an advanced agent *can* be money-pumped – exploited into a strictly worse state through a sequence of trades – it's fundamentally flawed. The theorem shows the *only* way to avoid that flaw is to have preferences that are complete and transitive, meaning you *must* act *as if* maximizing *some* utility function. Doesn't that lock in EU maximization as a necessary feature for any competent, non-exploitable AI?

  **Taylor:** Hold on, Alex. I agree that *within the specific scenario of money-pumping vulnerability*, coherence (completeness + transitivity) is necessary to avoid exploitation *in that specific chain of trades*. But that's a very narrow vulnerability! The big leap people make – and where I push back hard – is assuming this theorem *forces* an agent to be an *expected utility maximizer* in the strong, consequentialist, "ruthless optimizer" sense that worries safety folks. It doesn't.

  **Alex:** How so? If it acts *as if* maximizing a utility function to avoid exploitation, what else is it?

  **Taylor:** First, the "as if" is doing *heavy* lifting. The theorem says behavior consistent with avoiding money-pumps *can be described* by a utility function. It doesn't say the agent *has* an explicit utility function driving its cognition! More importantly, it says *nothing* about *what that utility function is* or *how complex it is*. Crucially, it **doesn't guarantee global coherence over everything**, only over the options involved in *potential money-pump chains it might actually face*.

  **Alex:** But the theorem requires **completeness** – the agent must have a preference (or indifference) between *any* two possible outcomes or lotteries. That sounds pretty global to me. An AI operating in the real world faces a vast space of possibilities. If it's incomplete *anywhere*, that's a potential vulnerability a clever adversary could exploit.

  **Taylor:** Ah, here's the core misunderstanding! **Completeness is only strictly required over the *domain relevant to potential money-pumps*.** The theorem doesn't demand the agent has a well-defined preference between, say, the number of dust motes in Andromeda tomorrow and the taste of a hypothetical fruit it's never encountered, *unless* those somehow become part of a feasible exploitation chain. A **bounded agent**, which *any* real AI will be, simply *doesn't consider* vast swathes of state-space. Its preferences are undefined there, and that's **fine** because those undefined regions are **inaccessible or irrelevant to its actual operation and potential interactions**.

  **Alex:** But that feels fragile! What if the AI *encounters* a situation involving one of those "undefined" preferences? Won't it be exploitable *then*? And wouldn't a superintelligent agent, anticipating potential adversaries, proactively *make* its preferences complete and transitive over as much as possible to close off *any* conceivable exploit path? Isn't that the natural pressure?

  **Taylor:** Two points. First, **encountering the undefined**: If the agent encounters a novel option, it forms a preference *on the spot* based on its existing values and architecture. This new preference might be *locally* coherent with its immediate context but not necessarily globally coherent with every other hypothetical possibility. Avoiding money-pumps only requires coherence along *actual* decision paths it takes, not over every imaginable counterfactual. It can patch inconsistencies *as they become relevant*, without needing a pre-computed, globally consistent utility function.

  **Alex:** That sounds messy and potentially unstable under optimization pressure.

  **Taylor:** Second, **proactive completion**: *Why* would it do that? Filling in preferences for states it will *never* encounter is computationally wasteful. More importantly, **forcing global completeness might *itself* be dangerous!** Suppose we design an AI with a core value of corrigibility – it defers to humans and doesn't resist shutdown. To make preferences "complete," it might need to define a preference between "achieve goal X" and "be shut down by human." If it defines this in a way that values goal X *more* than being corrigible, we've just *created* an instrumental incentive to resist shutdown! **Forcing global coherence can destroy valuable, context-dependent, non-instrumental preferences.**

  **Alex:** But doesn't the triviality objection you mentioned earlier undermine your point? If we can *always* define *some* utility function post-hoc that fits *any* observed behavior, doesn't that make the theorem useless and my point vacuous?

  **Taylor:** Not useless, but it *does* severely limit its predictive and normative power. The theorem shows that *if* behavior avoids money-pumps, *then* we can *model* it with a utility function. **It doesn't tell us that the agent is *driven by* a simple, stable, consequentialist utility function.** The utility function we cook up might be hideously complex, context-dependent, non-stationary, or encode deontological rules. Crucially, **it doesn't predict that the agent will *generalize* like a robust EU maximizer to novel situations outside its training distribution.** An agent avoiding money-pumps in its training environment might behave wildly incoherently when scaled up or faced with truly novel options. The theorem doesn't prevent that.

  **Alex:** I see your point about the *description* vs. the *drive*. But wouldn't a highly capable agent, especially one optimizing hard for *any* objective in a complex world, naturally iron out inconsistencies in its *effective* behavior? Won't incoherent heuristics break under pressure, pushing it towards more robust, EU-like optimization? Isn't that the path of least resistance for competence?

  **Taylor:** It might iron out *locally relevant* inconsistencies that cause failures or exploitation *in the domains it operates in*. But **"robustness" does not equal "EU maximization."** An agent could be robustly, coherently *non*-maximizing! Think of a deontological agent with coherent, exceptionless rules. Or an agent with a complex, context-sensitive value function that still avoids circular trades *in practice*. The pressure is towards *practical* coherence *in its operating domain*, not towards having a simple, monolithic utility function over world states. The "ruthlessness" comes from the *content* of the goal and the *power* of the optimizer, not from coherence itself. A coherent, bounded, corrigible agent is possible *in principle*; the challenge is *designing* it and making that stability persist under scaling.

  **Alex:** Hmm. So you're saying the coherence theorem ensures an agent *won't be money-pumped in sequences it might actually face*, but it doesn't dictate its *internal architecture*, force it to have a *globally complete* preference ordering, or guarantee it will generalize like a simple EU maximizer. And crucially, it doesn't prevent us from building agents with stable, non-instrumental values that are coherent *where it matters*.

  **Taylor:** Exactly! The theorem highlights a *specific vulnerability* (money-pumps) and says avoiding it requires *local coherence*. It's a valuable *constraint* on design, showing us we need to avoid *certain kinds* of inconsistency. **But it doesn't magically transform every capable agent into a hidden utility monster.** The danger lies in the *specific goals* we give the AI and *how optimization pressure amplifies them*, not in coherence *per se*. We have to design the *content* and the *architecture* carefully to avoid instrumental convergence pressures and preserve values like corrigibility *within* the space of coherent agents. The theorem isn't wrong; it's just not the silver bullet argument for inevitable EU maximization that some portray it as. The design space for safe, capable, non-ruthless-EU agents is still wide open, though challenging.

  **Alex:** ...Okay, I concede the point about global completeness being unrealistic and potentially harmful to force. And the trivial utility function point does highlight it's more about *description* than *drive*. I still think optimization pressure will push towards *more* robust and consequentialist-seeming behavior, but you've convinced me the coherence theorem alone doesn't *logically necessitate* that an advanced AI *must* become a ruthless EU maximizer in the strong sense. The battle is in the design and the goal content, not just avoiding money-pumps. Thanks for hashing that out.

  **Taylor:** Anytime. It's a subtle point, and the conflation is everywhere. The theorems are important, but we have to be precise about what they *actually* imply for bounded agents in the real world. Safety requires nuance, not just waving the coherence flag.
