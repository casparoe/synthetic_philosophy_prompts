  ### **Nordenfelt (Welfare Theory)**  
  - **Drapetomania**: Not a disease. Escaping slavery aligns with vital goals (freedom/survival); no welfare reduction.  
  - **Grief**: Disease. Prolonged suffering impedes vital goals (e.g., relationships/self-actualization).  
