answer: |-
  You're recalling philosopher **Ruth Chang's** work on "**hard choices**" and the concept of "**being on a par**." Chang argues that incommensurable options aren't just a failure of measurement or vagueness – they represent a genuinely distinct fourth value relation beyond *better than*, *worse than*, or *equally good*. Here's the core argument and why "on a par" isn't just imprecise equality:

  ### 1. The Problem: The Trichotomy Assumption & Its Failure
     * **The Assumption:** We instinctively believe any two options (A and B) can only relate in one of three ways:
       * A is *better than* B.
       * B is *better than* A.
       * A and B are *equally good*.
     * **The Failure in Hard Choices:** Your friend's job dilemma exposes the flaw. Neither job seems clearly better overall. But crucially, they also don't feel *truly equal*. If they were equal, flipping a coin would be rational. Yet, choosing feels significant and difficult precisely because the values are *different in kind* (money vs. happiness/location), not just quantitatively different. Saying they're "incommensurable" feels like giving up, but saying one *must* be secretly better seems false.

  ### 2. Chang's Solution: Introducing "On a Par"
     Chang proposes a fourth relation: A and B are **on a par**. This means:
     * They are comparable (they belong to the same "covering value" – e.g., "overall career goodness").
     * Neither is better than the other.
     * They are **not** equally good.
     * They are in the same "neighborhood" of value, but one isn't a mere replica of the other. They represent **different constellations of value**.

  ### 3. The Key Argument: The "Slight Improvement Test" (The Chaining Argument)
     This is the test you vaguely recalled. It's designed to distinguish "equally good" from "on a par":

     * **Scenario:** Imagine Job A (High Salary, Bad City) and Job B (Lower Salary, Happy City) seem neither better nor worse.
     * **The Test:** Make a *slight improvement* to one option. Give Job A a *tiny* bit more money (call it A+). Or make Job B's city *slightly* nicer (B+).
     * **What Happens?**
       * **If A and B were EQUALLY GOOD:** Any improvement to one should make it *strictly better* than the other. A+ should be clearly better than B. B+ should be clearly better than A.
       * **What We Often See in Hard Choices:** A+ (slightly more money) is *still not clearly better* than B. Similarly, B+ (slightly happier city) is *still not clearly better* than A. **The improvement doesn't break the tie.**
     * **Why This Suggests "On a Par":**
       1. **Failure of Strict Betterness:** The fact that a small improvement doesn't make one option decisively better shows they weren't *equal* in the first place (because equality is fragile – any change breaks it).
       2. **Robust Incomparability:** The continued inability to declare a winner after a small improvement suggests the values are *differently structured*. The extra money in A+ doesn't "match" the happiness in B in a way that allows easy comparison. The options represent distinct ways of being valuable within the same general ballpark.
       3. **Chaining:** Imagine a chain of slight improvements. You could keep adding small amounts of money to Job A, and for a long time, each improved version *still* might not be clearly better than Job B. Conversely, you could improve Job B's location aspects slightly, and it still might not beat Job A. This chaining effect highlights that the values aren't aligned on a single scale where small increments reliably shift the balance. This is characteristic of being "on a par."

  ### 4. Addressing the Comeback: "Isn't 'On a Par' Just Imprecise Equality?"
     **Chang's Forceful Answer: No, and here's why:**

     * **Imprecise Equality Implies a Hidden Fact:** If it's just imprecise equality, there *is* a precise, hidden fact of the matter about which option is *actually* better or that they are *exactly* equal – we just can't measure it well enough. Chang argues this is often false in hard choices. There *is no* hidden fact. The difficulty isn't epistemic (about our knowledge); it's *metaphysical* (about the nature of the values themselves). The values are genuinely different and resist being ranked on a single scale.
     * **The Phenomenology Differs:** Choosing between truly equal options (like two identical $20 bills) feels trivial. Choosing between options "on a par" feels significant and identity-defining precisely because *neither is better, yet they aren't interchangeable*. Your friend agonizes because the choice *matters*, not because she lacks a precise calculator.
     * **The Improvement Test Shows the Difference:** As above, imprecise equality would still imply that a *sufficiently large* improvement would make one better, or that *perfect* precision would reveal equality or betterness. "On a par" claims that even with perfect knowledge and even after small improvements, neither strict betterness nor strict equality holds – they remain locked in a different kind of standoff within the same value ballpark.
     * **"On a Par" Explains Rational Agency:** If choices were only between better/worse/equal, then only choosing the better option (or flipping for equals) would be rational. "On a par" provides space for **rational commitment**. When options are on a par, neither is rationally required. Choosing becomes an exercise of your normative will – you *create* reasons by committing to one constellation of values over the other. This explains why choosing the lower-paying/happier job can be fully rational, even if the high-paying/miserable job isn't *worse*. It's the choice that fits *who she wants to be*.

  ### What This Means for Your Friend
  Chang argues her job offers are likely **on a par**. This means:
  1. **There is no hidden "better" job:** Her friend isn't missing a secret fact.
  2. **The choice isn't trivial:** It matters deeply because the values are meaningfully different.
  3. **She has rational freedom:** Since neither job is better, worse, or equal, she can rationally choose *either* based on what she wants to **stand for** – prioritizing financial ambition or lifestyle/happiness. The choice defines her values rather than just revealing a pre-existing ranking.

  The argument is powerful because it takes the phenomenology of hard choices seriously, offers a rigorous test (the slight improvement), and provides a positive account of rational agency beyond just maximizing or flipping coins. While debated, it remains a compelling alternative to both the "cop out" of incommensurability and the false promise of a hidden singular "best" answer. Your instinct was spot on!
