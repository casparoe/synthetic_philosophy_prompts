  The strongest counterargument is that in life-or-death scarcity, not saving the greater number when possible could be seen as irresponsible. Each life lost is a complete loss, and five deaths versus one is a significant difference. The lottery might feel fairer abstractly, but in reality, when multiple lives could be saved, choosing otherwise might lead to more regret and perceived injustice.

  Also, practical aspects matter. A lottery introduces unpredictability. Clinicians might struggle with explaining why they didn't save the larger group if the lottery picks the single patient. It could erode trust in the system. The memo needs to acknowledge that while the lottery respects individual equality, the rule-based approach better serves the community's overall welfare and operational clarity.

