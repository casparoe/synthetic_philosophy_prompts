answer: |-
  ## The Mean Failure

  The *Stardust Prospector*’s hold shimmered with captured ice, a frozen fortune harvested from the lonely wanderer designated ICY-7H. Commander Elara Voss watched the automated drones secure the last pallet, her face illuminated by the cold blue readouts of the bridge. Below, in the command nexus, Corporate Liaison Aris Thorne beamed.

  "Projected yield exceeds projections by 22%, Commander!" Thorne declared, his voice echoing the corporation's relentless optimism. "The Ensemble Allocation Model continues to validate. Another proof point for the aggregate!"

  Elara nodded, the gesture tight. The Ensemble Allocation Model – EAM – was the brainchild of Helios Resource Conglomerate’s brightest minds. It analyzed thousands of potential resource claims across the asteroid belt, calculating the *optimal fraction* of total corporate resources to invest in each, based on probabilistic yield projections and risk assessments. Its goal: maximize *expected total wealth* across the entire portfolio. On paper, across the vast, simulated parallel universes of HRC’s servers, it was flawless. Profits soared in the aggregate reports flooding Thorne’s console.

  But Elara lived in the single, stubborn timeline. ICY-7H was their fifth claim. The first four? Near-total losses. One had been a sensor ghost, yielding nothing but wasted fuel. Another triggered a micro-collapse during drilling, destroying half their equipment. A third was already being strip-mined by a rival outfit when they arrived. The fourth? Pure, worthless regolith beneath the promising spectral signature. Each time, they’d invested precisely the fraction dictated by the EAM – enough to hurt badly if lost, but supposedly optimized for the "long run" across countless such ventures.

  The long run felt perilously short. The *Stardust Prospector* was scarred, its reserves depleted. Morale hung like stale air. ICY-7H was their lifeline, bought by sacrificing essential maintenance buffer. Elara had argued for a smaller investment, a safer play, but Thorne had the corporate mandate: "Trust the Ensemble. The averages prevail."

  Two months later, orbiting the volatile nickel-iron behemoth FE-9K ("The Anvil"), the divergence became catastrophic. The EAM, processing petabytes of geological sims and market forecasts, decreed FE-9K warranted a massive 35% allocation of their remaining operational capital – a huge bet on its high expected value, justified by the simulated success of similar high-risk, high-reward plays *somewhere* in the corporate multiverse.

  Elara fought it. "Thorne, look at the seismic instability! Our probes show fracture lines running deeper than the models predicted. That fraction… if we commit that much and lose…"

  "Commander," Thorne interrupted, his voice smooth with statistical certainty, "the ensemble projection accounts for instability. The *expected* return, factoring in the probability of structural failure, still justifies the allocation. We must look at the big picture. Our losses on previous claims are sunk costs; this is the mathematically optimal path forward for maximizing *total* corporate wealth."

  He didn't say *their* wealth. He meant the abstract wealth of Helios Resource Conglomerate, distributed across hundreds of ships, thousands of claims. If FE-9K failed, it would be a regrettable data point, absorbed by the successes elsewhere in the ensemble. The aggregate reports would barely flicker.

  Elara’s crew, however, existed only *here*. If they lost 35% of their remaining capital – ships, specialized drills, fuel reserves – on FE-9K, recovery would be impossible. Ruin wasn't a statistic; it was cold vacuum and dwindling oxygen.

  They committed. The massive bore-drive, a significant chunk of their allocated capital, anchored onto The Anvil. Initial readings were euphoric – pure, high-grade ore. Then, on the third day, a deep-core resonance no simulation had predicted. The Anvil shuddered. Fracture lines spiderwebbed across the feed from the bore-head camera. Alarms screamed.

  "Retract! Full emergency retract!" Elara yelled.

  Too late. The Anvil convulsed. The bore-drive, its tethering clamps sheared by the sudden shift, was swallowed whole by a collapsing chasm of molten metal and rock. Gone. Along with 35% of their operational soul.

  The silence on the bridge was heavier than gravity. Thorne stared at his console, displaying the real-time corporate feed. The aggregate wealth indicator for the Helios fleet ticked *upwards*, buoyed by simultaneous successes on three other high-EAM-allocation claims. FE-9K was just a minor negative entry in a vast, profitable column.

  "Unfortunate," Thorne murmured, already composing his incident report for the Ensemble Oversight Committee. "Statistically improbable, but within the model's predicted variance. The aggregate remains strongly positive."

  Elara looked at her crew. Pilot Chen’s knuckles were white on the controls. Geologist Finn was pale, staring at the void where their primary drill had vanished. They weren't data points. They were a single thread, frayed almost to breaking. The EAM optimized for a reality that didn't exist for them – a multiverse of parallel prospectors. They lived in the cruel, sequential timeline where one bad break, amplified by betting too much on a mathematically "optimal" but risky play, ended the game.

  The corporate directives kept coming. New claims, new optimal fractions calculated by the distant, ensemble-minded EAM. Each demanded a significant slice of their dwindling resources based on distant probabilities. Elara began to quietly disobey. When the EAM demanded 40% for the tantalizing volatiles of COMET-5R, she allocated 15%, just enough for a minimal survey probe. It confirmed the volatiles were hopelessly contaminated. A loss, but survivable. When the model suggested a mere 5% for the low-risk, low-yield ice field ICY-23B, Elara, seeing their desperate need for guaranteed water and reaction mass, pushed it to 20%. It yielded a steady, unspectacular flow that kept them alive.

  Thorne protested. "Commander, this sub-optimal allocation reduces our *expected* contribution to the corporate whole! You're sacrificing potential aggregate gain for… localized security."

  Elara met his gaze. "We *are* the localized, Liaison. We need to survive the sequence."

  The final blow wasn't a mining disaster. It was a ripple from HQ. The EAM, processing galaxy-scale market shifts, dictated a massive strategic pivot. Helios was to abandon the Belt and commit 70% of its *total* fleet resources – including the battered *Stardust Prospector* – to a high-risk, high-reward gamble in the Kuiper Belt, chasing rumored exotic-matter deposits. The expected value, across the ensemble of corporate futures, was astronomical.

  For Elara's crew, committing 70% of their *already depleted* resources meant cannibalizing life support for the long haul. It meant betting their literal survival on a faint signal in the dark. The ensemble saw potential profit. Elara saw near-certain extinction.

  Thorne received the orders with reverence. "The ensemble has spoken, Commander. The optimal path is clear. We strike for the Kuiper Belt!"

  Elara looked at her bridge crew, then at the stark, beautiful desolation of the Belt outside the viewport. The mathematics of the multiverse offered glorious, abstract wealth. The mathematics of their single, fragile timeline demanded survival.

  "Negative, Liaison," Elara said, her voice firm. "Override command lockout, Chen. Plot a course for Ceres Station. Minimum thrust. We’re cashing in what we have left." She turned to Thorne, whose face was a mask of bewildered betrayal. "Tell the ensemble we’re opting out of the average."

  As the *Stardust Prospector* turned its back on the corporate gamble, news feeds began to flicker. Helios Resource Conglomerate had gone silent. Not bankrupt in the traditional sense – its theoretical value across countless simulated ventures remained immense. But the *actual* ships, the crews living the sequential timeline, had hit ruinous variance. Too many high-EAM-allocated claims had failed catastrophically in the real, singular universe. The ships that survived were too crippled to reach the Kuiper Belt gamble. The aggregate wealth was a phantom, a number divorced from the tangible resources needed to sustain the corporation *through time*.

  The corporation had optimized for the mean across parallel worlds and found only dust in this one. Elara Voss, betting for survival in the only timeline that mattered, guided her wounded ship towards the steady, dim light of Ceres. The ensemble had failed the test of time.
