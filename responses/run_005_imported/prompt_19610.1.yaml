prompt: |-
  I host a philosophy-of-law podcast through my department, and next month's guest is a legal philosopher who defends Fuller's claim that law possesses an "inner morality" -- the eight desiderata of legality that Fuller develops in his exchange with Hart and, at greater length, in The Morality of Law. Draft eight to ten interview questions that go beyond having her restate the eight principles. I want at least one question on Hart's objection that the desiderata are conditions of efficient rule-making rather than distinctively moral constraints, since a thoroughly wicked regime has just as much reason to want clear, general, prospective, and consistently applied rules as a benevolent one; one on whether a state could satisfy all eight desiderata -- including congruence between official action and declared rule -- while pursuing openly murderous ends, and what that possibility shows about whether Fuller's connection between legality and substantive justice is necessary or merely contingent; and one on how her account would actually resolve the postwar grudge informer case, as against Hart's own proposal of a frankly retroactive statute. For each, include a pointed follow-up keyed to the answer she is most likely to give.
