  *Dr. Kenji Tanaka (Experimental Psychology)*  
  *Dr. Priya Desai (Statistics/Methodology)*  
  *Prof. Samuel Thorne (History of Science - SPR Archivist)*  
  *Dr. Maria Lopez (Bioethics - External Member)*  

