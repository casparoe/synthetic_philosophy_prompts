  The strongest counterargument to funding with conditions would be that after ten years and repeated issues, it's time to redirect funds to newer, more promising avenues. Sidgwick himself might agree that resources aren't infinite, and persisting could look stubborn rather than principled. I'll present this honestly to show balance.

