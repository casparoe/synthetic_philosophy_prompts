prompt: |-
  I'm a PhD student in philosophy working on a dissertation chapter about David Lewis's Humean Supervenience and, in particular, its treatment of objective chance. The part of the literature I keep circling back to is the "undermining" problem that Lewis raises in "Humean Supervenience Debugged": because chance at a time t, on a Humean best-system analysis, is fixed by the pattern of the entire history of the world rather than just the segment of history up to t, there will generally be possible continuations of history after t that, were they to occur, would make the best system come out differently — so the very chance function in force at t assigns some nonzero chance to a continuation whose occurrence would show that this was never really the true chance function at all. Lewis called this the "big bad bug," since it threatens to make the Principal Principle either incoherent or true only relative to a gerrymandered class of "admissible" evidence. His proposed fix, the New Principle, conditions credence on a proposition about which complete theory of chance obtains at a world, rather than on a bare chance proposition, and treats historical facts (including facts about the future) as admissible in a way the original formulation could not.

  My advisor thinks the New Principle fully rehabilitates the Principal Principle for Humeans and considers the matter closed; I've never quite believed this, but I haven't managed to turn the unease into an actual argument, and I'd like your help doing that. Specifically, please construct the strongest case you can that the New Principle, whatever its formal merits, fails to preserve what made the original Principal Principle philosophically important in the first place — namely, an explanation of why we are rationally required to defer to chance — rather than merely showing that some conditional or other can be satisfied by Humean chances. In building the case, please take an explicit stand on at least three sub-issues: whether a chance-theory-relative conditional can do the same normative work as a simple chance proposition; whether treating full historical propositions as admissible is independently well-motivated or just reverse-engineered to dodge undermining; and whether non-Humean, primitivist accounts of chance genuinely avoid an analogous problem or merely relocate it. I'm not looking for a survey of the back-and-forth in the literature so much as your own sharpest, most carefully argued case for the skeptical conclusion, which I intend to stress-test as part of the chapter.
reasoning: |-
  Okay, I need to help this philosophy PhD student build a case against Lewis's New Principle. The student is skeptical that the New Principle preserves the philosophical importance of the original Principal Principle, especially regarding why we should rationally defer to chances. 

  First, I recall the core issue: the undermining problem shows Humean chances can assign positive probability to futures that would make those very chances false. Lewis's New Principle tries to fix this by conditioning on the entire chance theory rather than just chance values. 

  The student wants three specific angles tackled: 
  1) Can chance-theory-relative conditionals do the same normative work as simple chance propositions?
  2) Is treating full history as admissible well-motivated or just ad hoc?
  3) Do non-Humean accounts really avoid this problem?

  Hmm... for the first point, I think the key weakness is that the New Principle doesn't actually tell agents why to trust chances - it just mathematically avoids contradiction. The original PP tied credence directly to objective chance, creating an intuitive "deference" relationship. But the NP makes credence conditional on a massive theory that includes the chance's own correctness. This feels circular - we're deferring to something that already assumes its own truth. 

  For admissibility, Lewis's move to treat the entire history as admissible seems suspiciously convenient. Normally, admissibility is about evidence that screens off chances, like crystal balls. But here it's used to swallow up the undermining problem whole. That undermines (pun intended) the very concept of admissibility as a meaningful constraint. 

  Regarding non-Humean accounts... while they avoid this specific undermining, they might have their own version where primitive chances could conflict with frequencies in principled ways. But the student wants me to take a stand - I'll argue that while non-Humeans have different issues, they don't have this particular self-undermining pathology because chances aren't defined by outcomes. 

  The bigger philosophical point is that the original PP explained why chances are normative: they're objective features we must align with. The NP reduces this to a consistency condition within a theory that already assumes Humeanism. So it can't ground deference for anyone not already committed to the system. 

  I should emphasize that the NP feels like a technical fix that misses the spirit of the problem. It saves the letter of the law but not its soul - we get coherent probabilities but lose the "why" of trusting chances. 

  For structure, I'll start by acknowledging the formal success of NP, then pivot to why that's not enough. Then tackle each of the three sub-issues in order, building the case that NP changes the subject normatively. I'll conclude by connecting this to the student's unease about losing the explanatory power of the original PP.
answer: |-
  Here is a carefully constructed skeptical case against the adequacy of Lewis's New Principle (NP) for preserving the core normative significance of the Original Principal Principle (PP). While granting the NP's formal success in avoiding incoherence, I argue it fails to capture the *philosophical essence* of why rational agents *must* defer to objective chance, transforming chance deference from a profound constraint on rationality into a technical consistency condition within a gerrymandered framework.

  **Core Argument: The Loss of Normative Authority**

  The original PP (`Cr(A | ch_t(p) = x & E) = x`, for admissible E) presented chance as an *external authority* to which rational credence must conform. This authority stemmed from chance's objective, *metaphysically prior* status: chances were features of the world *to which* our beliefs must answer. The NP (`Cr(A | H_tw & Tw) = ch_tw(A)`, where `Tw` is the complete true chance theory and `H_tw` is history to `t`) severs this direct normative link. Instead of conditioning on the chance fact *itself* (`ch_t(p) = x`), we condition on the massive, world-specific conjunction `H_tw & Tw`. This conjunction *entails* `ch_t(p) = x`, but crucially, it also entails *everything else* about the Humean mosaic and the Best System Analysis (BSA) that makes `Tw` true. 

  The problem is **normative grounding**: *Why* is it rationally compelling to set `Cr(A)` equal to `ch_tw(A)` *given* `H_tw & Tw`? The answer provided by the NP seems to be: "Because `H_tw & Tw` entails that `ch_tw(A)` *is* the correct chance value." But this reduces the normative force to a logical tautology *within the system*. The NP tells us how to be *consistent* with the *entire Humean metaphysical package* (`H_tw & Tw`), but it doesn't explain why that package *itself* generates a normative constraint on rational belief that has the *authority* originally attributed to chance itself. The deference becomes internal to the Humean description, not a response to an objective modal feature. What made the PP philosophically important was its claim that chances *as objective probabilities* command our credences. The NP only shows that something *defined* by the global pattern *can* play a role in *a* consistent credence function *if* you already buy the whole Humean story.

  **Addressing the Sub-Issues:**

  1.  **Chance-Theory-Relative Conditionals vs. Simple Chance Propositions: The Loss of Direct Authority.**
      *   **Simple Chance Proposition (PP):** Conditioning directly on `ch_t(p) = x` treats this proposition as a *reason* for setting credence to `x`. It presents the chance fact as a *distinct, authoritative input* for rational belief formation. The normative requirement ("defer!") flows directly from the *nature* of chance as objective probability.
      *   **Chance-Theory-Relative Conditional (NP):** Conditioning on `H_tw & Tw` makes the chance value `ch_tw(A)` a *logical consequence* of the total theory/history package. Setting `Cr(A)` equal to it is simply *accepting a logical consequence* of one's evidence (`H_tw & Tw`). The normative force derives solely from the *general requirement of logical coherence* (believing the consequences of what you believe), not from any *special authority* inherent in chance *qua* chance.
      *   **The Skeptical Point:** The NP replaces *deference to an objective probability* with *deductive coherence within a specific world-description*. This fails to preserve the *sui generis* normative role of chance. The original PP explained *why* chance was normatively special; the NP only explains *how* a particular value derived from the Humean global pattern fits consistently into beliefs that already include the entire Humean metaphysical picture. It doesn't explain why an agent *should* treat `ch_tw(A)` derived this way as *probability-worthy* in the first place, beyond the trivial "it's part of the description of the world you believe in."

  2.  **Admissibility of Full History: Reverse-Engineered, Not Well-Motivated.**
      *   **Original Concept of Admissibility (PP):** Admissibility was conceived as *information that bypasses or screens off the chance mechanism* (e.g., direct perception of the outcome, oracle pronouncements about the future). It carved out exceptions to deference based on *epistemically privileged information* about the specific outcome. This had independent plausibility related to evidence overriding probabilistic expectations.
      *   **NP's Admissibility (Full `H_tw`):** Treating the *entire* history up to `t` as universally admissible is *nothing like* the original concept. It doesn't screen off the chance mechanism by providing outcome-specific information; instead, it provides the *metaphysical basis* for the chance mechanism *itself* (the Humean mosaic determining the BSA). Its admissibility isn't motivated by epistemic privilege concerning `A`, but by the *metaphysical necessity* of avoiding undermining futures within the Humean framework.
      *   **The Skeptical Point:** This radical expansion of admissibility is *purely* a technical fix to avoid the formal contradiction of undermining. It lacks any independent, principled justification grounded in the *epistemology* of chance or the nature of evidence. It's reverse-engineered to make the NP work, sacrificing the intuitive, epistemically driven core of the admissibility concept. This reinforces the sense that the NP is a gerrymandered solution preserving consistency *within* Humeanism, not a vindication of chance's normative authority *as such*.

  3.  **Non-Humean Accounts: Avoiding the Analogy, Not Merely Relocating.**
      *   **Primitivist/Non-Humean Chance:** For the primitivist, chance (`ch_pr`) is a fundamental, irreducible modal feature of the world, not supervenient on the Humean mosaic. It directly (or probabilistically) constrains future history. The `ch_pr` function at `t` is fixed independently of the total future history.
      *   **The Undermining Analogy?** Could there be a future `F` such that `ch_pr,t(F) > 0` but `F` entails that `ch_pr,t` was *not* the true chance function? This seems incoherent. `F` is a *possible outcome* according to `ch_pr,t`. If `F` occurs, it does *not* show `ch_pr,t` was false; it shows that `F`, which had a positive chance, *happened*. The chance function `ch_pr,t` itself remains a *brute fact* about `t`, regardless of what happens later. Its truth isn't *constituted* by future events. Future events can *falsify predictions made using it* (if we predicted `~F`), but not *falsify the chance function itself*.
      *   **The Skeptical Point:** Non-Humean primitivism genuinely avoids the undermining problem *in its Lewisian form*. The problem arises *specifically* from the *Humean reductionism* that defines chance via the BSA applied to the *entire* world history. For the primitivist, the normative force of the PP is straightforward: rational credence should align with the *actual, fundamental objective probability* governing events. There's no threat of this probability undermining itself because its existence and value aren't hostage to future outcomes. The challenge for primitivism lies elsewhere (e.g., explaining the connection between chance and possibility, or justifying its metaphysical cost), but the *self-undermining* pathology is unique to Humean reductionism.

  **Conclusion: The Bug Bites Back Normatively**

  Lewis may have debugged the formal inconsistency, but the "big bad bug" of undermining resurfaces as a *normative* defect in the NP. While the NP provides a consistent rule for assigning credences *within the belief system of a committed Humean who already accepts `H_tw & Tw`*, it fails to capture the *philosophical heart* of the original Principal Principle. The PP promised to explain why rational agents must treat objective chance as a *compelling guide* to the future, grounded in its objective, authoritative nature. The NP replaces this with a requirement of logical coherence applied to a massively complex, world-specific proposition (`H_tw & Tw`) whose only claim to normative authority regarding `A` is that it entails a value (`ch_tw(A)`) defined by the very global pattern it describes. This transforms chance deference from a response to objective probability into an exercise in deductive consistency within a particular metaphysical framework. For those unconvinced that Humeanism *can* ground genuine objective probability in the first place, the NP offers no independent reason to think `ch_tw(A)` *deserves* deference; it merely shows how to avoid contradiction *if* you start from the complete Humean worldview. Thus, the NP saves the letter of probabilistic coherence but sacrifices the spirit of chance's normative authority – what made the PP philosophically profound. Your unease is justified: the "bug" was never truly fixed; its normative implications were merely contained within the system.
