  First, the core challenge: creating pointed questions that expose Kepler's contradictions without reducing him to a modern "secret atheist" stereotype. The patron needs to interrogate three specific tensions: his distinction between vulgar vs harmonic astrology, the mechanism for celestial influences, and his hypocrisy in taking commissions while mocking clients.

  Hmm, the user clearly knows their stuff - they reference specific Kepler concepts like "soul of the earth" and "harmonic aspects." This isn't a beginner request. They're likely a serious historical fiction writer who's done research but struggles with dramatizing philosophical conflict.

  The real need here is subtext: they want the questions to force Kepler into defensive maneuvers that reveal his character. The deflections are crucial - each answer should feel like a dodge that deepens the tension. For example, when pressed on mechanisms, Kepler might retreat into geometric mysticism ("soul of the earth"), letting the patron counter with materialist arguments.

  Ah, and that hypocrisy angle is juicy. The patron paid for a nativity Kepler considers superstitious, so the question must land like a financial gut-punch. Kepler's deflection about "appetites of the vulgar" would sound especially hollow coming from a man who literally eats because of those appetites.

  I should structure questions that:
  1) Quote Kepler's own writings against him (like the "kissing" metaphor for aspects)
  2) Force him to admit gaps in his system (how harmonies translate to effects)
