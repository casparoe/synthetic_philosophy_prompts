  - Philosopher's rebuttal: Clever use of standard modal tools (anti-haecceitism) to defang indeterminism. Valid point that this isn't ad hoc—it's used for particles too. But the "costume" jab has merit: if points lack identity beyond relations, is substantivalism hollow?
  - Postdoc's comeback: Sharp—he exposes the identity problem. If "sameness" of points across solutions isn't primitive, what grounds it? The metric relations? That *does* sound relationalist. Philosopher might need to bite the bullet here.

  Both miss nuances:
