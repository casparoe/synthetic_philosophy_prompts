  so i went down a rabbit hole on this old puzzle called the Judy Benjamin problem -- a soldier gets dropped into a region thats split 50/50 into Red and Blue territory, and each side is independently split into a "Headquarters Company" area and a "Second Company" area, so all 4 combos start out equally likely. then she gets a radio message that just says "if your in Red territory, its 3 times more likely your in the Second Company part than the Headquarters part." apparently if you update on that using the normal way people generalize conditionalizing to this kind of info (minimizing cross entropy relative to her prior), her overall odds of being in RED AT ALL shift away from 50/50 -- even tho the message never compares red to blue, it only talks about the split inside red. i can follow the algebra fine but i don't have a gut feeling for why info thats purely "internal" to red should leak out like that. whats actually going on there intuitively, and do people take this as a real strike against cross-entropy minimization as "the" right update rule, or is it more that our intuitions about what should stay fixed are just wrong?
