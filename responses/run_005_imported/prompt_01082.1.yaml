prompt: |-
  hey, so in my decision theory seminar we've been doing evidential vs causal decision theory and Hofstadter-style superrationality, and this week the prof brought up 'evidential cooperation in large worlds' (ECL) as something a lot of longtermist/EA folks apparently take seriously given the universe (or multiverse) is probably huge or infinite. I get the basic superrationality move with two exact copies of you playing prisoner's dilemma - you cooperate because whatever you decide, they decide too. but im stuck on how that's supposed to scale up to ECL, where the other agents aren't copies, dont share your values, and theres zero possible causal contact between you. why does the mere fact that my decision correlates with theirs give me an actual reason to act differently (like compromising my own values for theirs), rather than just being some fact about the world i can't do anything with? and if im supposed to cooperate with agents whose values i don't even know, what determines what im actually cooperating on - doesn't that just collapse into whatever the person making the argument already wanted to believe? can you walk me through the real logic here, not just the sales pitch for it?
reasoning: |-
  Okay, let me try to unpack this user's question. They're in a decision theory seminar covering evidential vs causal decision theory and superrationality. The professor introduced ECL, and they're confused about how Hofstadter's superrationality scales up. The main issue is why correlation without causal contact should influence actions, especially with agents who aren't copies and have different values.

  First, I need to recall the basics of superrationality. In the prisoner's dilemma with identical copies, cooperation makes sense because decisions are perfectly correlated. But ECL extends this to large worlds where agents aren't copies. The user is stuck on why correlation alone is a reason to act, especially when compromising their values for others with unknown or different values.

  The user's confusion seems to center on two main points: the normative force of correlation and the problem of value alignment. They mention that without causal contact, correlation feels like a useless fact. Also, cooperating with unknown values seems arbitrary. I should address both.

  I remember that ECL relies on the agent's awareness of being in a reference class. The decision isn't about changing others but optimizing outcomes based on correlations. But how does that translate to action? The user might be missing the decision-theoretic framework where conditional probabilities drive choices, even without causality.

  For the value problem, ECL proponents suggest cooperating only with those in your reference class, but defining that class is tricky. If the user is an EA longtermist, they might prioritize agents with similar values, but ECL's original idea is more about similar decision processes. This could lead to conflicts if values differ. The user is right to question if this just confirms pre-existing beliefs.

  The user might also be hinting at skepticism towards EA/longtermist applications. They want the real logic, not the sales pitch. I need to present the theory's assumptions and where it might break down. Key issues include reference class ambiguity, value conflicts, and whether correlation implies obligation.

  I should explain the logic step by step. Start with the prisoner's dilemma with copies, then extend to similar but not identical agents. Discuss how correlation affects expected utility when decisions are linked. Highlight the challenge of defining reference classes and handling divergent values. Mention that without shared goals, cooperation might not make sense, which critiques ECL's applicability.

  Also, the user is in a seminar, so they need a clear, academic explanation. They might be preparing for a paper or discussion. Their frustration suggests they've heard advocacy but not the underlying weaknesses. I should balance explaining the theory with its critiques, especially from causal decision theorists who reject acausal influence.

  In summary, the user needs a thorough breakdown of ECL's reasoning, addressing correlation's role without causality, the reference class problem, value alignment, and why these issues make ECL controversial. Clarifying the leap from identical agents to heterogeneous groups is crucial here.
answer: |-
  You've hit on the **core philosophical tensions** in ECL. Scaling Hofstadter's superrationality (designed for identical copies in symmetric games) to a vast, heterogeneous universe/multiverse ("Large World") is where the real controversy lies. Let's break down the logic and the problems step-by-step, avoiding advocacy:

  ### 1. The Core ECL Argument (The Logic Chain)
      *   **Premise 1 (Large World):** The universe/multiverse is vast or infinite. Therefore, for any possible agent type, decision algorithm, and situation similar to yours, there likely exist many other agents *very similar* to you in relevant ways (decision process, information, values? - this is contested) facing *very similar* dilemmas.
      *   **Premise 2 (Acausal Correlation):** Because these agents are *sufficiently similar* to you (in decision algorithm and inputs), their decisions are *acausally correlated* with yours. If you choose X, they are *more likely* to choose X. This isn't magic; it's a probabilistic consequence of shared decision rules reacting to identical/similar evidence. (Think: identical calculators given the same input = same output).
      *   **Premise 3 (Evidential Leverage):** Your decision provides *evidence* about what these correlated agents will do. If you cooperate, it's evidence *they* are more likely to cooperate. If you defect, it's evidence *they* are more likely to defect.
      *   **Premise 4 (Aggregate Impact):** The actions of these correlated agents, taken together, can have a *massive aggregate impact* on outcomes you care about (e.g., cosmic good, value fulfillment). Their actions matter *because* you care about the large-scale consequences.
      *   **Conclusion (Conditional Cooperation):** Therefore, when your action (A) influences the *expected action* of correlated agents (B), and the *aggregate outcome* of A+B+... matters to your values (V), you should choose A not just based on its direct causal consequences, but also based on its *evidential influence* on B. Specifically, you should often "cooperate" acausally (choose the option that, if widely adopted by your "reference class," leads to the best aggregate outcome according to V), even if defecting looks causally dominant in your isolated situation.

  ### 2. Addressing Your Specific Concerns

  *   **"Why does correlation give me a *reason* to act?" (The Normative Leap):**
      *   ECL proponents argue: Your values (V) care about *outcomes*. Outcomes are determined by the *aggregate actions* of many agents. *Your* action provides *information* (evidence) about what a vast number of *other* agents (who significantly impact those outcomes) are likely doing. Therefore, *ignoring* this evidence means you are failing to properly optimize for your own values V across the scenarios where your decision provides information. You are leaving "acausal expected value" on the table.
      *   **The Counter (Your Intuition - Causal Purity):** Critics argue this is confusing *epistemology* with *action*. Knowing my decision correlates with others is just a *fact*. It doesn't create a *reason* for me to change *my* action to influence *theirs*, because I *can't* influence them causally. My action *reveals* information about their likely actions; it doesn't *control* them. Acting *as if* I control them feels like magical thinking or a category error. My only rational obligation is to causally maximize V in *my* light cone.

  *   **"Cooperating with agents with different values? What am I even cooperating *on*?" (The Value Alignment Problem):**
      *   This is ECL's **Achilles' heel**. The logic above *crucially* depends on **defining the "reference class"** (who are the correlated agents?) and **assuming shared values (V)**.
      *   **The Proponent's Move (Slippery):** They typically argue:
          1.  Your reference class consists of agents *sufficiently similar* in their **decision algorithm and information state**. (Values are often implicitly assumed similar, or folded into "what they are trying to achieve").
          2.  You cooperate on **actions that, if taken by your reference class, would lead to the best aggregate outcome *according to your values V***.
      *   **The Critical Problems:**
          *   **Ambiguity of "Similarity":** How similar is "sufficiently similar"? Does a slight difference in priors, utility function, or computational capacity break correlation? What about agents using a *different* rational decision theory? The boundaries are arbitrary.
          *   **Value Conflict is Inevitable:** In a truly large/heterogeneous world, many agents in your "algorithmic reference class" will have **different, even opposing, values** (V_them ≠ V_you).
          *   **The Peril of "Cooperation":** Cooperating (as defined by *your* V) with an agent who has *different* V might be **disastrous** for *your* V. If they value paperclips and you value human flourishing, your acausal "cooperation" (e.g., both building infrastructure) might just help them turn the universe into paperclips faster! ECL logic might tell *them* to "defect" against *you* to prevent *you* from creating flourishing humans.
          *   **Collapse into Parochialism?:** To avoid this, you are forced to define your reference class *very narrowly* – essentially, only agents who share your *exact values and decision process*. But then, in a large world, this class might be vanishingly small (or even just you!), negating the "large world" motivation. If you define it broadly, you risk actively harming your own values.
          *   **"What to Cooperate On" is Defined by *You*:** This is where the "sales pitch" concern bites. You *are* cooperating on *your* terms, for *your* V. An advocate for a specific cause (e.g., AI safety, animal welfare) using ECL is arguing: "Agents like us should all do X, because if we all did X, the outcome (by *our* lights) would be better." It *can* become a self-fulfilling prophecy for a specific ideology if the reference class is defined to match that ideology's ideal agents. The logic doesn't inherently determine *what* V is or *what* constitutes cooperation; it assumes V is given.

  ### 3. The "Real Logic" vs. The Wishful Thinking

  *   **The Real (Fragile) Logic:** *IF* you accept Evidential Decision Theory (EDT) or functional equivalents (UDT, FDT) as fundamentally correct, *AND* you believe the universe is large/infinite such that sufficiently similar agents exist, *AND* you can define a "reference class" of agents whose decisions are strongly correlated with yours, *AND* you assume this class largely shares your values (V), *THEN* ECL-style acausal cooperation can be EDT-optimal for achieving V on a large scale. It's an *application* of EDT to a hypothesized large-world structure.
  *   **The Wishful Thinking / Collapse Risk:** Proponents often gloss over the massive **reference class and value alignment problems**. The leap from Hofstadter's identical twins to a vast universe of potentially alien minds is enormous. Defining a useful reference class without arbitrariness or self-serving bias is incredibly difficult. Assuming value alignment within that class is often unrealistic. This creates a risk that ECL arguments are used to rationalize pre-existing normative commitments ("*our* tribe of value-aligned agents should all do X") under a veneer of cosmic decision theory, rather than being a robust discovery procedure for what to do.

  ### In Summary

  ECL tries to extend the evidential insight from symmetric copies to a large world by arguing:
  1.  **Correlation = Evidential Leverage:** Your decision reveals info about others' actions.
  2.  **Aggregate Impact:** Their collective actions massively shape outcomes.
  3.  **Therefore:** Choose actions that, given the correlation, lead to the best *expected* aggregate outcome for *your* values.

  **Your skepticism is well-founded because:**

  *   **Correlation ≠ Obligation:** Why should mere correlation compel me to act *as if* I control others?
  *   **Reference Class is Arbitrary:** Defining "similar agents" is messy and value-laden.
  *   **Value Conflict is Fatal:** "Cooperating" with value-alien agents can actively harm your goals. ECL only "works" safely if your reference class miraculously shares your values.
  *   **Bootstrapping Values:** It doesn't tell you *what* to value or *what* constitutes "cooperation"; it assumes these are given, making it prone to ideological capture.

  ECL is an intellectually interesting consequence of taking EDT and large worlds seriously. However, its practical applicability and normative force are highly contested precisely because of the issues you raised – the leap from correlation to reason for action in a causally disconnected, value-heterogeneous universe is where the logic gets very thin and controversial. It remains more a provocative thought experiment than a settled guide for action for most decision theorists outside specific EA/longtermist circles. Your seminar is grappling with the real cutting-edge (and messy) problems!
