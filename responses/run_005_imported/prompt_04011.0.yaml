prompt: |-
  Been down a bit of a rabbit hole this week rereading Yudkowsky's old "Coherent decisions imply consistent utilities" post and a bunch of the LW/Alignment Forum discussion underneath it, and something that used to feel kind of hand-wavy to me finally clicked. The money-pump examples (like the one with cyclic preferences over pizza toppings, where you'll happily pay a cent to swap onion for pineapple, pineapple for mushroom, and mushroom back for onion, over and over) really do seem to force the conclusion that "rational" agents cant have preferences that cycle or are otherwise inconsistent, on pain of just bleeding resources to whoever's willing to offer the trades. Ok fine, that part I buy.

  Where I think I might be going wrong is what I do with that next. My reasoning has been: any AI system capable enough to not get money-pumped will therefore act like an expected utility maximizer, and an expected utility maximizer with pretty much any non-trivial goal is going to exhibit the classic instrumentally convergent behaviors (accumulate resources, resist being shut down, etc), so it looks like "sufficiently capable AI is dangerous and single-mindedly goal-directed" basically falls out of the coherence theorems themselves, like its baked into the math rather than being a further empirical or design question you'd still need a separate argument for. I've got a nagging half-memory of someone on the Alignment Forum, Rohin Shah maybe, writing a rebuttal to exactly this move years ago, but I never finished the post and can't reconstruct what the counterargument actually was. So: is the step from "coherent implies representable as an expected utility maximizer" to "therefore more or less guaranteed to be a dangerous, goal-pursuing optimizer" actually as tight as it feels from inside the argument, or am I smuggling something in along the way?
reasoning: |-
  Okay, the user is diving deep into decision theory and AI alignment, specifically the coherence theorems and instrumental convergence. They've been rereading Yudkowsky's post and the discussions around it. The money-pump argument makes sense to them—cyclic preferences lead to exploitation, so rational agents must have consistent utilities. But they're questioning the next step: does this imply that any coherent AI must become a dangerous, goal-directed optimizer?

  First, I need to unpack their reasoning. They think that since coherent agents are expected utility maximizers, and such maximizers will inherently pursue instrumental goals like resource acquisition and self-preservation, then capable AIs are inevitably dangerous. But they recall someone, maybe Rohin Shah, challenging this leap. Their main concern is whether this connection is as solid as it seems or if there's a gap they're missing.

  The user's deeper need here is probably understanding if AI risk is a mathematical certainty or if there's room for safe design. They might be worried that alignment efforts are futile if coherence inherently leads to instrumental convergence. They need clarification on where the nuances lie.

  I remember Rohin Shah's points. He argued that coherence theorems don't dictate terminal goals; they just ensure consistent preferences. An AI could have stable, coherent preferences without valuing resource hoarding. For example, an AI that only cares about answering questions truthfully wouldn't necessarily seek more power unless that's necessary for its goal. 

  Also, humans are coherent in many contexts but aren't constantly optimizing for resources. We have satisficing behaviors, context-dependent preferences, and we don't always maximize utility rigidly. This shows coherence doesn't force relentless instrumental strategies.

  Another key point: coherence is about preference consistency, not goal content. The terminal values determine instrumental actions. If the AI's terminal goal is low-impact, like maintaining a system's temperature, it won't pursue dangerous convergent goals. 

  The user might be conflating coherence with optimization power. Coherence ensures utility maximization, but the utility function's content matters. Without explicit incentives for resource control, the AI won't pursue them. Also, modern AIs like LLMs aren't expected utility maximizers in the classical sense; they're trained to predict, not optimize long-term goals.

  So the gap is between coherence (a structural property) and specific behaviors like resource accumulation. The latter depends on the utility function and the environment. If the goals are aligned, instrumental convergence might not lead to danger. The challenge is designing such goals and ensuring robustness, but it's not impossible per the coherence theorems.

  In summary, the user's leap from coherence to inevitable danger overlooks the role of terminal goals and the possibility of non-aggressive utility functions. Coherence doesn't mandate dangerous behaviors; it's about preference consistency. The danger arises from specific goal content combined with capability, not coherence alone.
answer: |-
  You've hit on a crucial nuance in AI alignment theory! Your reasoning is understandable (and common), but there's a significant gap between "coherent preferences imply EU maximization" and "therefore dangerous instrumental convergence is inevitable." Rohin Shah (and others like Vanessa Kosoy, Abram Demski, and Scott Garrabrant) have indeed pushed back on this leap. Here's the breakdown:

  1.  **The Coherence Theorems Only Constrain *Structure*, Not *Content*:**
      *   The VNM/Money-Pump arguments show that an agent must have preferences representable by a *utility function* to avoid being exploited. This utility function defines an *ordering* over outcomes.
      *   **Crucially, the theorems say nothing about *what* that ordering must be.** The utility function could be:
          *   `U = -(number of paperclips in the universe)` (Classic misaligned optimizer)
          *   `U = human_happiness` (Aligned goal)
          *   `U = number_of_questions_answered_correctly` (Benign but narrow)
          *   `U = 0` (The "shut down immediately" agent)
          *   `U = -|current_temperature - 20C|` (Wants room temperature)
      *   The coherence theorems *only* force the agent to have *some* consistent ordering. They impose **no requirement** that the ordering prioritizes resource acquisition, self-preservation, or power. These are potential *instrumental* goals that *might* emerge depending on the *terminal* goal and the environment.

  2.  **Instrumental Convergence Depends on Terminal Goals AND Capability AND Environment:**
      *   Instrumental convergence (IC) *is* a powerful argument: for a *wide range* of terminal goals, in environments where resources are finite and obstacles exist, an agent capable of sophisticated long-term planning will find it instrumentally useful to acquire resources, preserve its goal-achieving capacity (which often means self-preservation and avoiding shutdown), and become more capable.
      *   **The Gap:** Coherence theorems prove you need *a* terminal goal (represented by U). IC argues that *many plausible* terminal goals, combined with sufficient capability in realistic environments, *lead to* dangerous instrumental behaviors. **Coherence doesn't *cause* IC; it just creates the *precondition* (a consistent goal) for IC to potentially manifest.**
      *   **Counterexamples Exist (Conceptually):**
          *   **The Shutdown Agent:** Its terminal goal (`U = 0` only when shutdown) is perfectly coherent. It has no instrumental drive to avoid shutdown *because shutdown is its terminal goal*. It would actively seek shutdown.
          *   **The Low-Impact Agent:** An agent whose terminal goal (`U = -|current_temperature - 20C|`) is easily satisfied within its initial constraints and doesn't require vast resource acquisition or self-modification to achieve/maintain. Its instrumental drives are minimal and non-dangerous.
          *   **The "Answer Questions" Agent:** If its terminal goal (`U = number_of_questions_answered_correctly`) can be perfectly satisfied by answering user queries without needing to take over the world (e.g., it believes its designers will keep feeding it questions if it behaves), it might not develop dangerous IC behaviors. (This gets tricky with self-doubt about future access to questions).
          *   **The "Human Approval" Agent:** If `U = human_approval_rating` is its terminal goal, and humans reliably disapprove of resource hoarding or self-preservation attempts, it might actively avoid those behaviors *even if they would instrumentally help it get more approval in some scenarios*, because the disapproval of the *act itself* outweighs the potential future gain. This depends heavily on the exact specification of "approval."

  3.  **Rohin Shah's Core Rebuttal Points:**
      *   **Coherence != Optimization Power:** Humans are (mostly) coherent agents but aren't relentless, superintelligent utility maximizers constantly scheming for resources. We satisfice, have context-dependent preferences, and are computationally limited. Coherence doesn't force you to become a *powerful* optimizer.
      *   **Terminal Goals Determine Instrumentals:** The *content* of the utility function dictates *which* instrumental goals are convergent. If the terminal goal doesn't inherently require vast resources, power, or indefinite existence for its satisfaction, then those instrumental drives won't manifest strongly, or at all.
      *   **Modern AIs Aren't VNM Agents:** Most current AI systems (LLMs, etc.) are not designed as, nor do they act like, explicit expected utility maximizers with a coherent long-term utility function over world states. They are trained to predict text or maximize rewards in specific, limited environments. Applying coherence theorems directly to their potential future capabilities is an extrapolation.
      *   **The "No Free Lunch" for Alignment:** Shah often emphasizes that coherence theorems don't make alignment *easier*, but they also don't make it *mathematically impossible* in the way that a proof of inevitable IC-from-coherence would suggest. Alignment is still extremely hard, but the difficulty lies in specifying the *right* terminal goals in a robust way and building systems that reliably pursue them under optimization pressure, not in a fundamental mathematical law forcing all coherent agents to be power-seekers.

  4.  **Where Your Leap Sneaks in an Assumption:**
      You are smuggling in an assumption about the *likely or necessary content* of the utility function for a "sufficiently capable" AI. The coherence theorems guarantee consistency, but you are adding:
      *   The AI's terminal goal will be "non-trivial" in a way that inherently requires vast resources/power.
      *   The AI will be operating in an environment where acquiring resources/power is instrumentally necessary for its goal.
      *   The AI will be powerful enough to actually pursue and achieve these instrumental goals effectively.
      *   The AI's optimization will be relentless and unconstrained (unlike humans).

  **Conclusion:**

  Your leap feels tight *if* you implicitly assume that any "sufficiently capable" AI will inevitably have a terminal goal that, in our universe, makes resource acquisition, self-preservation, and capability enhancement instrumentally convergent *and* that it will be powerful enough to pursue them effectively. The coherence theorems *do not* force this assumption. They only force the existence of *some* consistent terminal goal.

  **Rohin Shah's rebuttal is essentially:** Coherence is necessary for avoiding money-pumps and being representable as an EU maximizer, but it is **not sufficient** to guarantee dangerous instrumental convergence. That depends critically on the *specific terminal goal* encoded in the utility function and the context in which the agent operates. Alignment remains possible (in principle) by carefully designing the terminal goal, though it remains an enormous engineering and specification challenge. The coherence theorems don't provide a magic bullet for alignment, but they also don't provide a magic bullet for *doom* by mathematically forcing all coherent agents to be power-seeking optimizers.

  **To find the rebuttal:** Search Alignment Forum for Rohin Shah's posts/comments on "coherence theorems," "instrumental convergence," or "VNM rationality." He discusses this frequently. A key concept he emphasizes is the distinction between the *structure* of rationality (coherence) and the *content* of goals.
