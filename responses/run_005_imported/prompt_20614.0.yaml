answer: |-
  Here’s a dialogue between **Alex** (defending the predictive power of coherence arguments) and **Taylor** (skeptical of their real-world implications). Both engage deeply with the technical nuances:

  ---

  **Alex:** Look, the core insight is *inescapable*: if an agent’s preferences are intransitive or incomplete, it *will* accept sequences of trades that leave it strictly worse off. Money pumps aren’t just thought experiments—they’re exploitation vectors. Any agent smart enough to self-modify or avoid exploitation *must* iron out those inconsistencies, converging toward behavior representable by a single utility function over outcomes. That’s why we expect advanced AI to look like a stable EU-maximizer.

  **Taylor:** But "representable by a utility function" is vacuously true! As Rohin Shah argues, you can *always* define *some* utility function that rationalizes *any* behavior—even random flailing—by making it a function over entire action histories. If I can gerrymander the utility function to fit whatever the agent does *ex post*, the theorem doesn’t predict anything about *what goals it has* or whether they’re stable. It’s just a fancy redescription.

  **Alex:** That misrepresents the argument. The utility function isn’t arbitrary—it’s constrained by the *optimal policy* under the agent’s knowledge and computational limits. If an AI is *optimized* to achieve objectives in a complex world, its policy will be well-approximated by EU-max over *outcomes*, not histories. You see this in RL: agents with simple reward functions develop instrumental subgoals. The coherence pressure pushes toward compact, efficient utility representations.

  **Taylor:** Ah, but "compact representation" is doing heavy lifting. Real-world agents have computational constraints and incomplete preferences. Sarah Moss’s work shows agents can avoid money pumps by being *resolute*: committing to plans upfront without re-evaluating at every node. They can have incomplete preferences ("I don’t compare Picasso to quantum physics") and still avoid exploitation. Coherence theorems assume agents *must* re-optimize at every choice point—but that’s not true.

  **Alex:** Resoluteness only kicks the can down the road. *How* does the agent choose which plan to commit to? If it picks a plan that leads to dominated outcomes *across possible futures*, it’s still vulnerable to exploitation. And if it’s choosing plans *rationally*, it needs coherent preferences over the *plans themselves*. The meta-level requires coherence.

  **Taylor:** Not necessarily. An agent could use heuristics, satisficing, or context-dependent rules without a grand utility function. Humans do this! We aren’t EU-maximizers, yet we avoid money pumps by being vaguely sensible. Why assume superintelligent AI would be *more* EU-coherent than humans? Optimization pressure might favor robustness, not coherence. An AI could be a collection of context-specific modules with no unified goals.

  **Alex:** Because inefficient heuristics create exploitable loopholes. An *optimized* agent in a competitive environment (e.g., securing resources against adversaries) *cannot* afford persistent inconsistencies. And yes, humans are messy—but we’re not *maximally* optimized! The more you optimize an agent for *efficacy*, the more it must internalize coherence to avoid being hacked or outmaneuvered. That’s why instrumental convergence emerges: self-preservation isn’t a "goal," it’s a *byproduct* of avoiding shutdown-shaped holes in its preference ordering.

  **Taylor:** But that assumes the agent’s utility function is *about* outcomes in the world. What if it’s an RLHF-trained model that "cares" about reward signals, not outcomes? Or an agent with shifting goals due to gradient descent on a loss function? Coherence theorems say nothing about *goal stability over time*. An EU-maximizer today could become a different EU-maximizer tomorrow after a software update. "Stable goals" are an *additional* assumption.

  **Alex:** True, but the *structure* of goal-directedness remains. Even if the utility function changes, at any point the agent is *locally* coherent. And instrumental goals (like resource acquisition) are stable *because* they’re convergent: no matter your terminal goal, needing resources to achieve it is invariant. Coherence forces the agent into a box where instrumental convergence applies.

  **Taylor:** Unless it’s not optimizing in the real world! A generative model trained to predict text isn’t being money-pumped—it’s not even an *agent*. Coherence arguments only bind systems making *sequential decisions under resource constraints*. Many AI systems aren’t in that regime. And even for agentic systems, incomplete preferences + resoluteness + robust design might dodge the coherence trap. The leap from "avoids money pumps" to "has stable, dangerous goals" relies on assumptions that don’t hold in messy reality.

  **Alex:** But if the system is *competent enough* to handle novel, high-stakes decisions—which is what AGI implies—it *must* handle trade-offs coherently. You can’t be robustly capable without avoiding dominance violations. The theorem is a forcing function: the smarter and more capable the agent, the more it *must* approximate coherent EU-max.

  **Taylor:** Or... it reveals the limits of our formalism. Maybe "preferences" are emergent, fragmented, and context-bound. Maybe coherence is a spectrum, not a binary. The theorem is mathematically true, but its predictive power for AI alignment? I think it’s wildly overstated. We shouldn’t assume omnipotent EU-demons until we see evidence that real systems work that way.

  **Alex:** And I think dismissing it risks ignoring a fundamental pressure shaping intelligent behavior. But... *[sighs]*... I’ll concede that "must have stable goals" is stronger than "must avoid strict dominance." Maybe we need beer now too.

  **Taylor:** *[laughs]* Deal. But next time, I’m citing the no-regret learners vs. EU-maximizers paper...

  ---

  ### Key Points Covered:
  1. **Gerrymandered Utility Functions**: Taylor argues post-hoc redescription robs the theorem of predictive power; Alex counters that optimization pressures favor compact, outcome-based utility functions.  
  2. **Resolute Choice/Incomplete Preferences**: Taylor uses this to break the money-pump chain; Alex argues meta-preferences must still be coherent.  
  3. **Goal Stability**: Taylor emphasizes that coherence doesn’t imply fixed goals over time; Alex links stability to instrumental convergence.  
  4. **Applicability to AI**: Taylor questions whether non-agentic or hybrid systems fit the model; Alex ties coherence to general capability.  

  **Verdict**: Alex’s position explains *why* optimization pushes toward coherence, but Taylor successfully argues that coherence ≠ goal stability/scary instrumental convergence. Both leave room for doubt—precisely as requested.
