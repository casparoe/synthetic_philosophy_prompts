  - Manager: Devi (pragmatic) 
  - Specialist: Lena (intense) 
  - Accountant: Ravi (eager but misguided) 

  Setting: Tech company, post-breach. Tension high.
answer: |-
  The conference room smelled of stale coffee and desperation. Outside the floor-to-ceiling windows, the city lights blurred into rain-smeared streaks—fitting, Devi thought, for a 9 PM emergency meeting about the password policy bleeding their productivity dry.

  "Look," Devi, Head of Operations, tapped her tablet. "The data's clear. Mandatory quarterly rotations don't reduce breaches. Study after study shows it. *But*—" she conceded, "the time cost is negligible. Less than 1% productivity loss. So we scrap it. Focus on actual threats."

  Lena, Security Lead, didn’t blink. "Devi, you’re ignoring the threat modeling. Rotations *do* mitigate credential-stuffing attacks. I’ve seen it in our logs. *But*—" she stressed, "your ‘negligible’ cost? My team loses 10% weekly resetting forgotten passwords. We keep this, we drown in helpdesk tickets. Scrap it."

  Ravi, Finance, scrolled through his own report. "Actually… Lena’s right on breaches. Rotations cut our incident rate by 30% last quarter. *And* Devi’s right on cost—it’s under 1% if you automate properly. We keep it. Easy."

  Three verdicts hung in the air:
  - Devi: Abolish the policy.  
  - Lena: Abolish the policy.  
  - Ravi: Keep the policy.  

  "Two to one," Devi announced. "Policy abolished." She moved to update the IT directive.

  "Wait." Lena frowned. "Ravi thinks rotations work. Devi thinks they’re cheap. Why are we abolishing if both things are true separately?"

  "Fine," Devi sighed. "Let’s vote on the *reasons*." She split the decision:  
  **Question A:** *Does rotating passwords quarterly significantly reduce breach risk?*  
  **Question B:** *Is the productivity loss under 5%?*  
  Per company policy, they only kept security measures if both were true.  

  They voted:  
  - **A (Reduce risk?):** Devi (No), Lena (Yes), Ravi (Yes). **Majority: Yes.**  
  - **B (Cost under 5%?):** Devi (Yes), Lena (No), Ravi (Yes). **Majority: Yes.**  

  Devi stared at the results. A: Yes. B: Yes. Keep the policy.  
  But moments ago, abolishing had won 2–1.  

  Lena’s pen clattered onto the table. Ravi opened his mouth, then shut it. The policy dashboard glowed on the main screen, cursor hovering between **REVOKE** and **RETAIN**.  

  Rain lashed the windows. No one moved.
