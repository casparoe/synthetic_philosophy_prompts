  First, I need to recall key points about Sidgwick. His "Methods of Ethics" discusses the dualism of practical reason, where duty and self-interest can conflict, leading him to seek a supernatural sanction. This connects directly to why he pursued psychical research—to find evidence of an afterlife that could resolve this conflict.

