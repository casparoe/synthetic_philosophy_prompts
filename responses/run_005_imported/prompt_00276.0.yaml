  First, I need to recall the core of the pessimistic meta-induction. It argues that since past theories like phlogiston or ether were discarded, current theories might be too. Structural realism, proposed by Worrall, suggests that while entities change, the mathematical structures persist. The journalist's main worry is whether this just moves the target. Are there cases where even the structure didn't survive? And why would structures be more stable?

