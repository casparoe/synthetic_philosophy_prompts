answer: |-
  You've hit on a crucial distinction that *is* often glossed over in pop-philosophy summaries. Your flatmate is fundamentally correct: the "gavagai" rabbit example primarily illustrates **inscrutability of reference** (a problem about *individual terms*), while Quine's stronger thesis of **indeterminacy of translation** is a distinct, broader claim about *whole sentences* grounded in different arguments. Let's break down the structure:

  ### 1. Inscrutability of Reference (The "Gavagai" Problem)
  *   **The Example:** You point to a rabbit, native says "Gavagai." All observable evidence (pointing, assent/dissent, behavioral reactions) is consistent with multiple interpretations:
      *   "Rabbit"
      *   "Undetached rabbit part"
      *   "Rabbit stage" (a temporal slice)
      *   "Rabbit-fusion" (the universal rabbit)
      *   "Rabbithood"
  *   **The Point:** There is **no behavioral fact of the matter** determining which of these *referents* the native speaker *actually* associates with the word "Gavagai." You can build translation manuals that map "Gavagai" to "rabbit" OR to "undetached rabbit part," etc., and *both manuals can be made consistent with all observable speech dispositions (stimulus-response patterns)*.
  *   **Scope & Limitation:** This is about *reference* – what individual words *point to* in the world. It shows the **underdetermination of reference assignment by behavioral evidence**. Crucially, **this indeterminacy can often be "resolved" by looking at how the word is used *in sentences*** within the *overall* language structure (e.g., how plurals, tense, identity statements work). Quine himself later emphasized that gavagai primarily illustrates *this* point. It's dramatic, but potentially containable.

  ### 2. Indeterminacy of Translation Proper (The Bigger Thesis)
  *   **The Core Argument:** This is NOT primarily about rabbits. It stems from two pillars:
      *   **Holism:** The meaning of a single sentence isn't fixed in isolation. It depends on its place within the *entire web of beliefs* held by the speaker. ("The unit of empirical significance is the whole of science" - adapted for language).
      *   **Physicalism/Behaviorism:** The *only* evidence admissible for translation is the speaker's observable behavior (utterances in response to sensory stimuli - "stimulus meaning"). There is no access to private meanings, mental concepts, or intentions.
  *   **The Underdetermination Amplifier:** Imagine two linguists creating *entirely different* translation manuals for the native language.
      *   Manual A translates sentence S1 as "There's a rabbit."
      *   Manual B translates S1 as "There's an undetached rabbit part *arranged rabbit-wise*." (It compensates holistically).
  *   **Quine's Claim:** Both Manual A and Manual B can be made **empirically equivalent**. They can predict *all* possible observable speech behavior (assent, dissent, utterances in response to stimuli) *perfectly*. There is **no behavioral fact of the matter** to choose between them. It's not just that *we can't know* which is right; there *is no* "right" translation independent of the manual we choose. Translation is **radically indeterminate**.
  *   **Why "Gavagai" Isn't Enough:** The gavagai example shows reference *can* be inscrutable for an *isolated term*. The indeterminacy thesis says that *even when you fix the reference of terms holistically within a whole system*, you *still* have massive indeterminacy at the level of *sentence translation*. Manual A and Manual B might both successfully "resolve" the reference of "gavagai" *within their own systematic framework*, but they do it differently, leading to different translations for countless other sentences while fitting *all* the data.

  ### 3. Why It's Spookier Than Scientific Underdetermination
  Quine agrees scientific theories *are* underdetermined by evidence. But he argues translation is *more radically* indeterminate for key reasons:

  1.  **The "Fact of the Matter" Claim:** For scientific theories (e.g., two rival physics theories), Quine believes there *is* a fact of the matter about which one is true, even if we can't know it. The world has a specific structure. **For translation, he argues there is *no* fact of the matter.** There isn't a "real meaning" out there waiting to be discovered. Meaning is *constituted* by the patterns in observable behavior. If two manuals capture those patterns equally well, there's nothing *more* to meaning. It's ontological, not just epistemological.
  2.  **The Evidence Constraint:** Scientific theories can postulate unobservable entities (quarks, fields) to explain observable phenomena. Translation is radically constrained *only* to observable behavior (utterances + stimuli). You cannot postulate "what the speaker *really* means inside their head" as evidence; that's precisely what's inaccessible and, for Quine, not scientifically legitimate.
  3.  **Proxy Functions:** Quine offers a powerful logical argument. You can systematically transform *all* the references in a theory/language using a "proxy function" (e.g., map every object to its spacetime counterpart, or to the set containing only that object). The *entire structure of sentences* and their logical relations can be preserved *while completely changing what the terms refer to*. The translated sentences using the proxy function will be true/false in exactly the same situations as the originals relative to the new ontology. Behaviorally, it's indistinguishable. This shows the depth of referential plasticity *even after holism is accounted for*.

  **The Shape of the Argument Summarized:**

  1.  **Premise 1 (Evidence):** The only data for translation is observable linguistic behavior (stimulus meaning).
  2.  **Premise 2 (Holism):** The meaning of any sentence depends on its role within the entire network of sentences held true by the speaker.
  3.  **Premise 3 (Underdetermination + Proxy Functions):** It's possible to construct *multiple* holistic translation manuals (systems of sentence mappings) that are:
      *   *Empirically Equivalent:* They predict *all* observable linguistic behavior equally well.
      *   *Incompatible:* They assign radically different meanings/references to individual sentences/terms.
      *   *Structured:* The differences aren't random; they involve systematic, holistic remappings (like proxy functions).
  4.  **Premise 4 (Physicalism/No Mentalism):** There is no admissible evidence *beyond* observable behavior (no access to meanings-in-the-mind) to break the tie between these manuals.
  5.  **Conclusion (Indeterminacy):** Therefore, there is **no fact of the matter** about which translation manual is correct. Meaning is indeterminate. The gavagai example is a vivid, localized *symptom* of this deeper, holistic underdetermination, but the real argument is much broader and more fundamental.

  **In short:** Your flatmate is right. Gavagai shows the *inscrutability of reference* for terms, a significant but potentially manageable problem. The *indeterminacy of translation* is the stronger thesis: it argues that *even whole sentences* and entire translation manuals are radically underdetermined by *all possible* behavioral evidence, leading to the startling conclusion that there is simply no fact of the matter about meaning. It's spookier than scientific underdetermination because Quine denies there's any underlying meaning-reality to be right or wrong about once the behavioral patterns are fully captured. The rabbit is just the hook; the real bite is in the holism and the behaviorist constraint.
