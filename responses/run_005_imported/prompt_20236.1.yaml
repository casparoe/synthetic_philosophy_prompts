prompt: |-
  For an independent project in my comparative philosophy elective, I've been studying the Nyāya school's four pramāṇas, the independent means of valid knowledge: pratyakṣa (perception), anumāna (inference), upamāna (comparison), and śabda (verbal testimony). What interests me is that rival classical schools didn't accept this list as given: Cārvāka, the Buddhist epistemologists, Vaiśeṣika, and Sāṅkhya each recognized fewer than four, arguing that some of Nyāya's pramāṇas are either reducible to another or not genuinely reliable sources of knowledge at all, while the Mīmāṃsakas moved in the opposite direction and recognized even more than four. I'd like you to rank Nyāya's original four pramāṇas from the one that held up best against these classical objections to the one that was most persistently challenged, briefly noting for each contested pramāṇa which rival school pressed the strongest objection and what that objection actually was. Could you present this as a JSON block along these lines:

