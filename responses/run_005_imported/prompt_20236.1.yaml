  ### Key Rationale:
  - **Pratyakṣa** faced no school demanding its *elimination*; objections centered on interpretation (e.g., Buddhists on sensory illusions).
  - **Anumāna** was rejected only by Cārvāka but defended by others using perception-based frameworks.
  - **Śabda** was widely accepted for Vedic authority (Mīmāṃsā) but rejected by materialists and reduced by rationalists.
  - **Upamāna** was the prime target for reductionism, with Vaiśeṣika offering the most systematic argument for its collapse into anumāna.
