answer: |-
  ## Dialogue: The Ghost in the Expressivist Machine

  **Setting:** Q&A after a talk on "Solving the Frege-Geach Problem: New Directions for Expressivism." **Dr. Finch (Expressivist)** has just presented a refined version of Gibbard's norm-expressivism. **Dr. Vance (Cognitivist)** is the first questioner.

  **Vance:** Thank you, Dr. Finch. A compelling presentation. But I worry your solution succeeds *too* well. You model normative claims using sets of "factual-normative worlds," define validity over these sets via superset/subset relations, and voilà – modus ponens is secured, and 'wrong' seems to play the same inferential role in asserted and unasserted contexts. My concern is this: what *are* these "factual-normative worlds"? Aren't they just *propositions* by another name? And if 'wrong' in (2) "Tormenting the cat is wrong" picks out a property whose instantiation makes the proposition true in some worlds but not others – which is precisely how your model *functions* – haven't you smuggled in truth-apt belief? It looks like creeping minimalism: you've built a cognitivist engine but painted it with expressivist colors.

  **Finch:** A fair challenge, Dr. Vance, but I disagree. The key is *what the worlds represent*. They aren't representations of how the world *is*, independently of us. They represent *combinations of fact and norm acceptance*. A world in my model includes both descriptive facts *and* the acceptance of specific norms. Saying "Tormenting the cat is wrong" expresses a state of planning – a commitment to norms that forbid cat-tormenting. The set of worlds represents the *consistency conditions* of that planning state with other possible plans and facts. The meaning of 'wrong' is fixed by its role in this *plan-laden* structure, not by correspondence to a mind-independent property.

  **Vance:** But that's just redescription! Let's press on the "sameness of meaning" point. In premise (1) "If tormenting the cat is wrong, then getting your little brother to do it is wrong," the 'wrong' in the antecedent isn't expressing *your* current plan or disapproval. What does it mean *there*, on your account? It seems it must denote *the very same normative property* as in (2), otherwise the validity of the inference is purely syntactic, not semantic. Your model ensures validity by making the antecedent's 'wrong' *contribute the same element to the truth conditions* of the conditional as the 'wrong' in (2) does to the categorical claim. That element *is* the property – the thing that makes the sentence true or false relative to a world. You've functionally defined truth-aptitude!

  **Finch:** Not quite. The antecedent doesn't express *my* current plan; it specifies a *constraint* on planning. To accept the conditional is to have a planning state that is *inconsistent* with both accepting norms that forbid cat-tormenting *and* not accepting norms that forbid getting your brother to do it. The 'wrong' marks the *kind of plan component* involved. Its "sameness" across contexts isn't sameness of *denotation* but sameness of *functional role within the system of plans and their constraints*. The inconsistency isn't logical truth-preservation *simpliciter*; it's *practical* inconsistency in what one can coherently plan for. That’s the expressivist core.

  **Vance:** But Dr. Finch, your "practical inconsistency" *just is* logical inconsistency *within your formal model*. You map planning states onto sets of worlds, then define validity over those sets using standard set-theoretic operations (superset, subset, intersection). The model treats the *content* expressed by 'wrong' – whether in (1) or (2) – as an abstract object (a set of world-norm pairs) that participates in logical relations *identically* to how propositions participate in truth-conditional logic. The "practical" part becomes an inert label. When you say accepting (1) and (2) but denying (3) involves a "practically inconsistent" planning state, all the explanatory work is done by the *formal inconsistency* in your model, which mirrors truth-conditional inconsistency. The ghost in the machine *is* the proposition!

  **Finch:** You're conflating the *model* with the *reality it models*. The sets of worlds are a *representation* of the structure of our planning states and their inferential commitments. The *real* inconsistency is in the mind: it's impossible to *hold* the combination of attitudes expressed by (1), (2), and the denial of (3). The model *tracks* that real psychological impossibility. The sameness of 'wrong' is sameness in the *kind of mental state component* it conventionally expresses – a forbidding attitude – and how that component constrains other attitudes. The formalism is a tool to *map* these constraints, not the thing itself. We haven't posited moral facts; we've posited complex psychological states with their own internal logic.

  **Vance:** But that "internal logic" *requires* your formalism to treat the *contents* of those attitudes as propositional! What *is* the "component" expressed by 'wrong' in the antecedent? It can't be an occurrent attitude, as you concede. So it must be the *type* of attitude, or the *property* the attitude is about. If it's the *type* (e.g., "disapproval-type"), then how does embedding the *type* generate the necessary inconsistency? Only if the disapproval-type is *about* the *same thing* (cat-tormenting) in both contexts. And that "thing" it's about *is* the property. If it's the *property* from the start ("wrongness"), then you've conceded the cognitivist game. Your sophisticated machinery seems to force this choice: either the attitude component is inert without an object, or the object *is* the property. Either way, you get truth-apt content.

  **Finch:** You're demanding an ontology my view explicitly rejects. The "component" is a *plan-theoretic primitive*. Think of it like a labeled connector in a computational model of planning. The label 'wrong' marks this connector. Plugging the 'wrong' connector onto "tormenting the cat" in (2) activates a specific planning rule (forbidding). Plugging it into the antecedent of (1) sets a *conditional constraint*: *if* this connector is ever plugged onto "tormenting the cat," *then* it *must* also be plugged onto "getting your brother to torment the cat". The sameness is the sameness of the *connector type*, not a property it denotes. The inconsistency arises when the system tries to violate the constraint – it's a system crash in the planning module, not a discovery of a false proposition.

  **Vance:** And what *justifies* the system having that specific constraint? Why *must* plugging 'wrong' onto cat-tormenting *require* plugging it onto getting-your-brother-to-do-it? Isn't that constraint itself answerable to something *about cat-tormenting and brother-getting*? If it's just a brute feature of our planning psychology, then moral disagreement reduces to incompatible wiring – which seems to lose the normative force you likely want to preserve. If the constraint *is* answerable to something about the actions, then that "something" *is* the property of wrongness you're trying to avoid. Your "connector" only works because it's *tracking* a real feature of the world – namely, the relation between the wrongness of an act and the wrongness of procuring it. The minimalism has crept all the way in; the "connector" is just a truth-apt belief wearing a disguise.

  **Finch:** Ah, but Dr. Vance, here's where the *cost* of your cognitivism bites back. *You* must posit these mysterious "moral properties." What *are* they? How do we know about them? How do they *necessarily* motivate rational agents, as moral judgments seem to? Hume's point stands. My account explains moral motivation straightforwardly: to judge something wrong *is* to have a plan-laden attitude of forbidding it. Motivation is built-in. Your cognitivism severs judgment from motivation, leaving you with the queerness of intrinsically motivating facts or the need for brute externalist desires. My formalism may be complex, but it avoids the metaphysical and epistemological burdens you shoulder. Isn't *that* the substantive difference? I offer a naturalistically respectable account of moral thought and talk as an aspect of practical planning, without spooky properties.

  **Vance:** And *I* argue you achieve that naturalistic respectability only by building a simulacrum of cognitivism so perfect that the difference collapses. My "mysterious properties" might be complex or reducible, but they are no more mysterious than the complex, logically structured planning states you posit, governed by constraints that miraculously mirror rational moral inference. As for motivation, expressivism's advantage is overstated. If judging "X is wrong" *just is* a motivationally efficacious planning state, why are there apathetic amoralists or weak-willed actors? Your view struggles with *false* moral belief – if there's no truth condition, what is there to be wrong *about*? I can say someone has a false belief about a property; you can only say they have an incompatible plan. The disagreement feels different. Perhaps the stalemate *is* the point: we both agree logic works and meaning is stable. You call the underlying reality "plans," I call it "beliefs." Is anything *substantive* left beyond labels and metaphysical preferences? The creeping minimalism may have already won.

  **Finch:** (Sighs slightly) Perhaps. But I maintain the *explanatory direction* matters. You start with truth and representation, then graft on motivation. I start with practical agency and planning, and show how logic emerges from its structure. That feels like a different picture of what morality *is*, even if our formal models converge. The ghost in my machine may look like your proposition, but I built it out of cogs of planning, not ectoplasm of moral fact. Whether that difference is ultimately substantive... (spreads hands) maybe that's the rock we keep circling. Thank you for the sharp engagement, Dr. Vance. It’s precisely this tension that keeps the debate alive.

  **(The moderator signals time. The session moves to the next question. Finch and Vance exchange a look of mutual respect and unresolved tension.)**
