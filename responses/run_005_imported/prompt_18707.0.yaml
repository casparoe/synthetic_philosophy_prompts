      - Vaiśeṣika: Also accepts only two: perception and inference. They reduce upamāna to inference and śabda to inference (or sometimes to perception and inference? but typically to inference).

      - Sāṃkhya: Accepts three: perception, inference, and verbal testimony (śabda). They reduce upamāna to inference.

      - Mīmāṃsā (especially Prabhākara) and Vedānta: They accept six pramanas, so they accept all four of Nyaya's and add two more (arthāpatti, anupalabdhi). Thus, they do not dispute the independence of Nyaya's four.

