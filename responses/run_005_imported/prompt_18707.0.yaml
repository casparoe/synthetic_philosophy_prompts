   4. Ranking by least disputed to most disputed:

      Least disputed: Pratyakṣa
          - Only Carvāka disputes the others, but they accept perception. Every school that has any pramana at least accepts perception.

      Next: Anumāna
          - Disputed by Carvāka (who rejects it entirely) but accepted by all other schools. Note: Even the schools that only accept two pramanas (Buddhists and Vaiśeṣika) include inference.

      Then: Śabda
          - Accepted by Sāṃkhya (as one of their three), Mīmāṃsā, Vedānta. But reduced to inference by Buddhists and Vaiśeṣika, and rejected by Carvāka. So disputed by three schools (Carvāka, Buddhists, Vaiśeṣika) and accepted by three (Sāṃkhya, Mīmāṃsā, Vedānta). Note: Sāṃkhya accepts śabda independently.

