answer: |-
  Based on classical Indian philosophical debates, here's the ranking of Nyāya's four *pramāṇas* from least to most disputed as independent sources of knowledge, along with key objections from rival schools:

  ```json
  {
    "ranking": [
      "pratyakṣa (perception)",
      "anumāna (inference)",
      "śabda (verbal testimony)",
      "upamāna (comparison/analogy)"
    ]
  }
  ```

  ### Explanations:
  1. **pratyakṣa (perception)**:  
     Least disputed. Accepted by all schools (including Cārvāka) as irreducible. Cārvāka considered it the *only* valid *pramāṇa*, while others like Buddhists and Vaiśeṣika treated it as foundational. No major school reduced it to another means.

  2. **anumāna (inference)**:  
     Disputed only by Cārvāka (who dismissed it as circular and perception-dependent). Universally accepted by all other schools (Buddhists, Vaiśeṣika, Sāṃkhya, Mīmāṃsā/Vedānta) as a distinct *pramāṇa*. Buddhist logicians like Dignāga even refined its structure.

  3. **śabda (verbal testimony)**:  
     Heavily disputed. Cārvāka rejected it entirely. Buddhists and Vaiśeṣika reduced it to *anumāna* (inference from speaker reliability). Sāṃkhya accepted it but subsumed it under *anumāna* in some contexts. Only Mīmāṃsā/Vedānta defended its independence (as *śruti*).

  4. **upamāna (comparison/analogy)**:  
     Most disputed. Cārvāka rejected it. Buddhists, Vaiśeṣika, and Sāṃkhya reduced it to a compound of *pratyakṣa* (perception of similarity) + *anumāna* (inferring class membership). The "wild ox" (*gavaya*) example was widely criticized as memory-dependent. Only Mīmāṃsā/Vedānta accepted it as irreducible.

  ### Key Reasoning:
  - **Perception's primacy** was uncontested due to its directness.  
  - **Inference's status** was challenged *only* by materialists (Cārvāka), not idealist/orthodox schools.  
  - **Testimony's validity** split traditions: empiricists (Buddhists/Vaiśeṣika) saw it as inferential, while Vedic schools (Mīmāṃsā) deemed it autonomous.  
  - **Analogy** faced near-universal reductionism; its reliance on memory/association made it a frequent target for elimination.  

  ### Defense Strategy:
  In seminar, emphasize **historical context**: Nyāya's fourfold system aimed to codify *everyday* knowledge processes (e.g., learning by analogy), while rivals like Buddhists prioritized *soteriological* epistemology. Highlight how Mīmāṃsā's acceptance of *śabda/upamāna* stemmed from Vedic hermeneutics, contrasting with Sāṃkhya's metaphysical parsimony. The ranking reflects ontological commitments: perception and inference map to universal cognitive processes, while testimony/analogy require cultural or contextual validation.
