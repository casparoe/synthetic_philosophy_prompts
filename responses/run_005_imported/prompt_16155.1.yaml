  The user's friend mentioned FairBot and Löb's theorem. Explaining that simply: FairBot cooperates if it can prove the other cooperates. But if proof fails, it defects. So mutual proof is key. Vulnerabilities include unprovable statements or resource limits. 

  In the novel's context, the near-failure at the two-thirds mark could stem from an unexpected event, like a sensor error making one AI think the other defected. Or a third party interfering, causing a coordination failure. 

