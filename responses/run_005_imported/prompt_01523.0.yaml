  First, I need to reconstruct Hume's logic step by step. The key is recognizing that Hume is contrasting our natural tendency to ascribe continued existence with experimental exceptions that reveal dependence on our senses. The double-vision case exposes a contradiction: if both images are subjectively identical but we deny continued existence to one, then that judgment can't be based on perception alone. 

