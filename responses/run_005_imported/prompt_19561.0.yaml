answer: |-
  You're grappling with a genuinely difficult and important question that many Frege scholars have wrestled with. Your discomfort is warranted, and your argument touches on significant debates. Let's poke holes *and* find where it holds merit:

  **Holes & Potential Weaknesses:**

  1.  **The Strength of Anti-Psychologism:** Frege's anti-psychologism is a powerful *philosophical* argument. It explicitly states that the *truth value* and *logical structure* of thoughts like "2+2=4" or "The Morning Star is the Evening Star" are entirely independent of *any* thinker's psychology, biography, or cultural context. This is a core, defensible insight. Arguing that his *political views* infect his *logical truths* directly **does** risk committing the genetic fallacy he despised. The *content* of the *Gedanken* he explored in logic/math seems genuinely insulated.
  2.  **The "Same Horror" Claim:**
      *   **Specificity:** Is the "horror of contingency" driving *both*? For the philosophy, it's a horror of *epistemological* and *semantic* contingency leading to relativism/subjectivism. For the politics, it's a horror of *social/political* contingency leading to instability and perceived decline. Are these the *same* horror, or distinct anxieties manifesting in different domains?
      *   **Necessity vs. Temperament:** Even if the *temperament* is shared, does it *logically necessitate* the political conclusions? Could someone with a similar philosophical temperament (e.g., a Platonist) arrive at radically different political conclusions (e.g., liberal pluralism)? Many did. Conversely, many anti-pluralists had no interest in Fregean logic.
      *   **Causation Direction:** Does the philosophical view *cause* the political one, or vice versa? Or are they both expressions of a deeper, pre-existing worldview shaped by culture, upbringing, and historical moment? Pinpointing causation is extremely difficult.
  3.  **Scope of the Argument:** Frege's core *logical and semantic* innovations (sense/reference, function/argument, quantification, anti-psychologism) don't *explicitly* rely on his social/political hierarchy. His *metaphysics* (the Third Realm) is more abstract. The strongest connection might be to his *epistemology* (how we access these eternal truths) or his *views on language/society*, but these are less central to his most celebrated work.
  4.  **Secondary Literature:** Yes, this is heavily discussed. Hans Sluga's work (e.g., *Frege*) directly addresses Frege's politics and its potential connection to his philosophy, arguing that Frege's logicism was part of a broader nationalist project of unifying German thought/culture. Joan Weiner (*Frege in Perspective*) takes a more separationist view. Others like Gottfried Gabriel have explored the tensions. **Your point hasn't been dismissed; it's an active area of debate.** Not knowing "the diary" immediately isn't a fatal flaw, but engaging with this literature (Sluga, Weiner, Dummett's relevant passages, recent papers) is now crucial for your dissertation.

  **Where Your Argument Holds Merit & Goes Somewhere:**

  1.  **Beyond Genetic Fallacy - Structural Parallels & Foundational Commitments:** You're not *just* saying "bad man, bad logic." You're identifying a **structural parallel** in the underlying commitments:
      *   **Hierarchy & Exclusion:** The Third Realm is hierarchically structured (objects, concepts of different levels) and rigorously excludes anything psychological/subjective. His desired social order is explicitly hierarchical (strong leader, defined Volk) and seeks to exclude groups deemed "contaminating" (Jews, Social Democrats, Catholics).
      *   **Purity & Immutability:** Logic/math deals with pure, immutable, eternal truths. His politics yearns for a pure, immutable, eternal social order immune to the "chaos" of democratic pluralism.
      *   **Contingency as Enemy:** Both systems are built as bulwarks against perceived threats of contingency – psychological flux in logic, social/political change in his nationalism.
  2.  **Pressure on the *Motivation* and *Framework*:** While the *truth* of "2+2=4" might be safe, your argument puts pressure on:
      *   **Why Frege Felt the Need for Such a Radical Solution:** The intensity of his anti-psychologism and the starkness of the Third Realm *might* be understood, in part, by the same deep-seated aversion to fluidity and impurity evident in his politics. His *motivation* for constructing such an impregnable fortress for logic could stem from the same anxieties.
      *   **The *Nature* of the Third Realm & Access to It:** How *do* we access these eternal truths? Frege struggles with this. Could his political views about who constitutes the "true" German Volk subtly influence his (underdeveloped) ideas about who is *capable* of grasping pure thought? This connects to epistemology and philosophy of mind, areas less rigorously defended than his core logic.
      *   **The *Completeness* of the Separation:** Does the *practice* of doing logic, or the *metaphysical framework* chosen to house it, truly remain entirely untouched by the philosopher's broader worldview? Your argument suggests maybe not *completely*.
  3.  **Highlighting Potential Blind Spots:** Frege's system seeks absolute purity. Could his *own* political biases be a blind spot *within* his philosophy? Could his horror of "contamination" in logic prevent him from adequately accounting for the role of context, interpretation, or social practice in *actual* human reasoning and meaning-making (areas later explored by Wittgenstein, Quine, etc.)? His politics might exemplify the *kind* of rigidity his philosophical framework potentially encourages or reflects.
  4.  **Intellectual History Context:** Your argument helps place Frege within the broader context of late 19th/early 20th-century German intellectual history, where anxieties about modernity, science, national identity, and "degeneration" were widespread. Understanding this context enriches our understanding of *why* certain philosophical problems (like securing absolute foundations) felt so urgent and *how* they might be answered.

  **On Being "Unfair":**

  *   **Condemning the Views:** It is absolutely **fair** to condemn his anti-semitism, anti-democracy, and bigotry. Those views are vile and indefensible.
  *   **Attributing Motives:** Be cautious about *overstating* the direct causal link between his philosophical temperament and his specific political conclusions. The connection is likely more complex and mediated.
  *   **Dismissing the Work:** It would be **unfair** to dismiss the truth of "2+2=4" or the validity of quantification theory *because* Frege was a bigot. That *is* the genetic fallacy.
  *   **Contextualizing the Work:** It is **fair and necessary** to examine how his broader worldview, including his repugnant politics, *might* have shaped the *questions he asked*, the *solutions he favored*, the *metaphysical burdens he was willing to bear*, and the *potential limitations or blind spots* of his system. This is rigorous intellectual history and philosophy.

  **Conclusion & Advice:**

  *   **Not a Dead End:** Your argument **absolutely goes somewhere**. It touches on core debates in Frege scholarship and the philosophy of logic regarding the relationship between a thinker's life/context and their abstract work.
  *   **Refine the Focus:** Don't claim his political views *invalidate* his logic. Instead, argue that they reveal a **deep structural parallel** in his thinking (hierarchy, purity, anti-contingency) that helps explain the *intensity* and *specific form* of his anti-psychologism and Third Realm metaphysics. Explore the pressure it puts on the *epistemology* and the *motivations* underlying his system. Highlight potential *blind spots* related to context and interpretation.
  *   **Engage the Literature:** Dive into Sluga, Weiner, Dummett (who was deeply troubled by the diary), Gabriel, and recent articles. Cite them directly. Acknowledge the debate.
  *   **Dissertation Angle:** This is highly relevant for an ABD. You can frame it as exploring the relationship between Frege's core philosophical commitments (sense/reference, anti-psychologism) and his broader worldview/metaphysics, using the political writings as a revealing lens. It adds a crucial layer of intellectual history and critical analysis.
  *   **Talk to Your Advisor:** Frame it precisely: "I've been reading about the diary and Sluga's interpretation. I'm interested in exploring whether there's a structural parallel between Frege's desire for logical purity/hierarchy and his political vision, specifically regarding how it might illuminate the *motivations* behind or *potential limitations* of his anti-psychologism and Third Realm, *without* committing the genetic fallacy. What secondary sources would you recommend I focus on?"

  Your judgment is sound. You've identified a genuine tension and a productive line of inquiry. Refine it, ground it in the literature, and it will strengthen your dissertation.
