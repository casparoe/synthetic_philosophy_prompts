prompt: |-
  Ok weird question but its been bugging me for weeks. I collect vintage typewriters (got into it researching my last novel, now its a full blown habit), and I noticed a pattern in my trades I can't shake off. Early this year I traded my Hermes 3000 plus $40 for an Olivetti Lettera because I loved it's typeface, then over the summer traded that Olivetti plus $60 for a lighter Smith-Corona I could travel with, then last month traded the Smith-Corona plus $50 for another Hermes 3000 -- same model I started with. So a year on I own basically the same machine I began with, minus $150, and every one of those trades felt completely reasonable at the time; I'd make each one again given the same two machines side by side. My friend says this just proves my taste is inconsistent and I should feel dumb about it, but that doesn't sit right with me. Was I actually being irrational, and if so was it one particular trade, or was something already off before any of this started?
