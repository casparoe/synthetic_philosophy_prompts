answer: |-
  You weren't being irrational at each individual step, but the *cumulative effect* reveals a fascinating psychological and economic pattern. Your friend is wrong about "inconsistent taste" – your taste is actually quite consistent! The problem lies in **shifting valuation contexts, the endowment effect, and ignoring sunk costs.** Here's the breakdown:

  1.  **Each Trade Was Rational in Isolation (Contextual Valuation):**
      *   **Trade 1 (Hermes + $40 for Olivetti):** You valued the Olivetti's unique typeface *more* than your Hermes *at that moment*. The $40 felt like a fair premium for the specific aesthetic gain you desired.
      *   **Trade 2 (Olivetti + $60 for Smith-Corona):** Your need shifted to portability. The Smith-Corona offered a *new, highly valued feature* (lightweight travel). The Olivetti's typeface became less relevant, and the $60 felt justified for this new utility.
      *   **Trade 3 (Smith-Corona + $50 for Hermes 3000):** Your need shifted *again*. Perhaps portability became less critical, or you missed the Hermes' feel, build quality, or just wanted "home base" again. Compared to the Smith-Corona *in front of you*, the Hermes offered qualities you valued more *at that moment*, so $50 seemed reasonable.

  2.  **The Cumulative Problem (The Big Picture Blind Spot):**
      *   **Sunk Cost Neglect:** When making each new trade, you focused *only* on the two machines in front of you and the immediate cash outlay. You didn't factor in the *total* cash you had already invested in the *sequence* leading to the machine you were trading away.
      *   **Endowment Effect:** We tend to value things more highly simply because we own them. When you traded *away* a machine, you likely valued it based on what you originally paid/added for its *then-current* benefit. When you acquired a *new* machine, you valued it based on its *new-to-you* benefits. This inflates the perceived value of both sides in the immediate trade, masking the cumulative cost.
      *   **Shifting Value Propositions:** The value of each machine wasn't absolute; it was entirely dependent on your *current* needs and desires (aesthetics -> portability -> familiarity/home quality). You paid premiums for these *shifting* benefits without tracking the net financial flow relative to your starting point.
      *   **The Hermes Anchor:** Crucially, when you traded *back* to the Hermes, you were comparing it *only* to the Smith-Corona. You weren't thinking, "This will cost me $50 *plus* the $100 I've already spent to get to this point." The *original* Hermes was your baseline, but the *current* Hermes acquisition was evaluated against the *last* machine you owned.

  3.  **Why It Feels Weird & Your Friend is Wrong:**
      *   **Consistent Taste for Core Value:** Your core taste for the *Hermes 3000 itself* remained consistent. You ended up back there! What changed were the *transient priorities* (specific typeface, portability) that temporarily outweighed that core preference.
      *   **Paying for Exploration & Learning:** The $150 isn't *just* lost money. It's the price of **experimentation and refined understanding.** You paid to:
          *   Experience and own the Olivetti's unique typeface.
          *   Experience and own the convenience of the travel-friendly Smith-Corona.
          *   Learn definitively that the Hermes 3000 is your overall preference *after* experiencing alternatives.
          *   Learn about your *own* shifting priorities and how you value different features.
      *   **Market Nuances:** Vintage markets fluctuate. The perceived value (and actual market value) of each model relative to each other might have shifted slightly during the year, influencing the cash adjustments needed.

  **Were you "dumb"? Absolutely not.** You made three separate, contextually rational decisions based on genuine preferences at each moment. **Was there irrationality in the sequence? Yes, but it's a common cognitive bias:** failing to consider the cumulative sunk costs and the net position relative to the original anchor when making sequential decisions.

  **What to do differently next time (if you want to avoid this net loss):**

  1.  **Track Your Net Investment:** Mentally (or literally) keep a running tally of the *total* cash outlay (or inflow) relative to your starting point machine. Before a new trade, ask: "Given what I've already spent to get *this* machine, does adding *more* cash to get *that* machine make sense for my *overall* collection goals and budget?"
  2.  **Define Your "Anchor" Value:** If you have a core machine you know you love (like the Hermes), consciously use it as a financial baseline when considering trades *away* from it or *back* to it. Ask: "Is the premium I'm paying *now* to get *back* to a Hermes justified, knowing I originally had one?"
  3.  **Acknowledge the "Cost of Curiosity":** If you love exploring different machines, budget for it! View the potential net loss as a "tuition fee" for the hobby. Your $150 bought you valuable experiences and knowledge about typewriters and your own preferences. Framed that way, it stings less.
  4.  **Consider Three-Way Trades (Harder):** Sometimes, realizing you want to move from Machine B (Smith-Corona) back to Machine A (Hermes) might be better achieved by trading Machine B for something *else* you value more highly than A, rather than adding cash directly back to A.

  **In short:** Your individual trades were rational acts driven by genuine, albeit shifting, preferences. The net result feels odd because of well-documented psychological biases (sunk cost neglect, endowment effect) and the human tendency to evaluate decisions in isolation rather than as part of a sequence. The $150 is the cost of your typewriter exploration and education. Your taste isn't inconsistent; your *immediate priorities* evolved, and you paid premiums for those temporary benefits. Think of it as an interesting, slightly expensive lesson in behavioral economics applied to your hobby! Now you know the Hermes is truly "home," and that knowledge cost $150. For many collectors, that's a worthwhile price for the journey.
