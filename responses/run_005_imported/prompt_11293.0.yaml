  The user might not realize that each trade compounded the loss. They focused on the immediate gain (better typeface, lighter machine) without seeing the bigger financial picture. Also, vintage markets fluctuate. Maybe the Hermes' value increased, so getting it back cost more. They didn't mention market changes, but it's a factor.

