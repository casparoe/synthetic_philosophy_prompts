  Then, when discussing evidence, each person might interpret the same facts differently. Cognitive biases like confirmation bias could play a role. Even if they share information, anchoring might prevent them from adjusting enough. Also, they might focus on different aspects of the evidence, valuing some points more than others. 

  The user mentioned they're both honest and smart, so it's probably not about hidden info. It's more about subjective interpretations. The fact that this happens across different topics suggests it's a pattern rooted in their individual reasoning processes. 

