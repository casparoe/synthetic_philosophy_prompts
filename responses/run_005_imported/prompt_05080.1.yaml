  Galileo's references to Augustine and inerrancy aren't just lip service. Augustine himself advocated for not taking scripture literally when it conflicts with proven science. So Galileo uses Augustine's authority to bolster his argument. This shows that Galileo is working within the Church's framework, not against it. He's arguing that proper interpretation aligns with science, meaning no real conflict exists.

