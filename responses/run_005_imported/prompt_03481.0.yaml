prompt: |-
  I'm outlining a novel set in a small port town where the whole plot turns on hearsay — three different people give three different accounts of what happened the night a boat went missing, and none of my characters (or my readers) can verify any of it firsthand. Trying to get the epistemology right for a scene where two characters actually argue about *why* we believe other people's say-so at all, I went down a research rabbit hole and landed on Thomas Reid's 1764 "Inquiry into the Human Mind," where he's rebutting Hume on more or less this exact question. I copied out the relevant bit below — I modernized the old long-s spelling so its not "anſwer" every other word, but otherwise it's the genuine text, from the section called "Of the analogy between perception and the credit we give to human testimony":

  > Another original principle implanted in us by the Supreme Being, is a disposition to confide in the veracity of others, and to believe what they tell us. This is the counter-part to the former; and as that may be called the principle of veracity, we shall, for want of a more proper name, call this the principle of credulity. It is unlimited in children, until they meet with instances of deceit and falsehood: and it retains a very considerable degree of strength through life.
  >
  > If nature had left the mind of the speaker in equilibrio, without any inclination to the side of truth more than to that of falsehood; children would lie as often as they speak truth, until reason was so far ripened, as to suggest the imprudence of lying, or conscience, as to suggest its immorality. And if nature had left the mind of the hearer in equilibrio, without any inclination to the side of belief more than to that of disbelief, we should take no man's word until we had positive evidence that he spoke truth. His testimony would, in this case, have no more authority than his dreams; which may be true or false, but no man is disposed to believe them, on this account, that they were dreamed. It is evident, that, in the matter of testimony, the balance of human judgment is by nature inclined to the side of belief; and turns to that side of itself, when there is nothing put into the opposite scale. If it was not so, no proposition that is uttered in discourse would be believed, until it was examined and tried by reason; and most men would be unable to find reasons for believing the thousandth part of what is told them. Such distrust and incredulity would deprive us of the greatest benefits of society, and place us in a worse condition than that of savages.
  >
  > Children, on this supposition, would be absolutely incredulous, and therefore absolutely incapable of instruction: those who had little knowledge of human life, and of the manners and characters of men, would be in the next degree incredulous: and the most credulous men would be those of greatest experience, and of the deepest penetration, because, in many cases, they would be able to find good reasons for believing testimony which the weak and the ignorant could not discover. In a word, if credulity were the effect of reasoning and experience, it must grow up and gather strength in the same proportion as reason and experience do. But if it is the gift of nature, it will be strongest in childhood, and limited and restrained by experience; and the most superficial view of human life shows that the last is really the case, and not the first.

  Honestly the syntax is kicking my ass a bit (18th century philosophical prose does not mess around), so first I'd love a plain-English, premise-by-premise walkthrough of what Reid's actual argument is here — especially why the empirical claim about children being MORE credulous than seasoned, experienced adults is supposed to be the clincher, rather than some kind of own-goal.

  Second, and this is the part I can't find a satisfying answer to anywhere: I gather this passage basically counts as ground zero for "anti-reductionism" about testimony, as opposed to a more "reductionist" Humean picture. Could you actually spell out what's at stake in that distinction, and then tell me how strong Reid's argument here really is against a sophisticated reductionist comeback? Like, could a Humean just say the credulity instinct is itself the residue of experience — just accumulated over the species rather than the individual — so Reid hasn't actually escaped reductionism, only relocated it a level up? I want the philosopher character in my book to land a genuinely good objection rather than a strawman, so please be technical and a little ruthless rather than diplomatically splitting the difference.
