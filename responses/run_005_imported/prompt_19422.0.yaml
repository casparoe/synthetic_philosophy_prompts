  I should also address why the coat is brought up. It's a tangible example of potentiality. The coat's possibilities are mutually exclusive but not necessary. Wearing out first prevents being cut, so both can't happen. This shows that potentialities can exist without one being necessary. It's a microcosm of the sea-fight argument.

