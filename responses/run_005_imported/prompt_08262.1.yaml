  So in my phil of science seminar we covered Bertrand's chord paradox as the classic objection to the principle of indifference, and my professor treated Jaynes's invariance fix (requiring the probability distribution to be invariant under translations, rotations, and rescalings of the circle) as basically closing the case, since it singles out one of the three classic answers as "the" answer. i think that's too quick though. Can you argue that Jaynes's move doesn't actually rescue the principle of indifference, because nothing about Bertrand's original problem statement forces us to pick exactly that invariance group over some other one, so all we've really done is relocate the original arbitrariness rather then remove it? Please actually make the strongest case you can for that specific claim, don't just summarize the back-and-forth in the literature.
