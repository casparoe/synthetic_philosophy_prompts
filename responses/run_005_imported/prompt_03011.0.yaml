answer: |-
  You've hit on a key philosophical debate! While Strawson's conclusion *seems* similar to hard determinism (no moral responsibility), his **Basic Argument** is fundamentally different in structure and scope. It's not merely a "wordier determinism," but a distinct, deeper challenge targeting the *concept of ultimate responsibility itself*, irrespective of determinism.

  Here's why Strawson's argument is considered novel and separate:

  1.  **Independence from Determinism/Indeterminism:**
      *   **Van Inwagen (Consequence Argument):** *Depends entirely on determinism.* If determinism is true (past + laws fix the future), then our choices aren't "open," and we lack the control needed for responsibility. *If indeterminism were true*, van Inwagen argues we might have the required control (though he has other arguments against this).
      *   **Strawson:** His regress argument works *regardless of whether determinism or indeterminism is true*. Even if the universe is *indeterministic* at the level of choices, Strawson argues you *still* cannot be ultimately responsible for *why you are the way you are* when you make those choices.
      *   **The Core Insight:** Strawson targets the requirement of *ultimacy* – being the *ultimate source* or *first cause* of your character/motivations. He argues this is *logically impossible* for any finite being.

  2.  **The Regress Targets "Self-Creation":**
      *   Strawson identifies that moral responsibility (of the "desert-based" kind he critiques) requires that you be *responsible for the way you are* (your character, values, motives) that lead to your actions.
      *   **The Regress:** To be responsible for the way you are (State S1), you must have chosen to be that way via some principle of choice (P1). But to be responsible for *choosing* P1, you must have done so based on *how you already were* (State S0) and some *prior* principle of choice (P0). And so on, infinitely.
      *   **The Impossibility:** You can't start this chain. There must be some initial state (S0) and principle (P0) that you *didn't* choose, that you just *happen* to be. You are not the ultimate author of your initial constitution. Therefore, you cannot be ultimately responsible for anything that flows from it.

  3.  **Contrast with Genes/Upbringing (Determinism):**
      *   Your point ("genes + upbringing... we never chose them") is a *causal* determinist argument. It says external factors *caused* your character.
      *   Strawson's regress is *conceptual/logical*. Even if your character *wasn't* caused by genes/upbringing (e.g., if it popped into existence randomly, or was chosen by a non-physical soul), the regress *still applies*. How did the *soul* get its nature? Why did it "choose" one initial character rather than another? The same regress applies to *any* entity making a choice – it must rely on some prior, un-chosen nature. **Strawson argues ultimate self-creation is impossible *in principle*, not just impossible *under determinism*.**

  4.  **The "Ultimacy" Requirement:**
      *   Strawson explicitly argues that the kind of responsibility people *really* care about (deep moral responsibility deserving of praise/blame in a fundamental sense) requires this impossible ultimacy. Determinism simply provides one *way* we lack ultimacy (via external causes). Strawson shows we lack ultimacy *in any possible scenario*.

  5.  **Consequence Argument vs. Basic Argument:**
      *   **Consequence Argument:** "If determinism is true, then our acts are consequences of the laws of nature and events in the remote past. But we have no control over those. Therefore, we have no control over our acts. Therefore, no moral responsibility." *Contingent on determinism.*
      *   **Basic Argument:** "To be morally responsible for an action, you must be responsible for being the kind of person who performed that action. But to be responsible for being that kind of person, you must have chosen to be that person based on reasons. But to be responsible for *those* reasons, you must have chosen the principles behind them... This regress cannot be completed. Therefore, ultimate moral responsibility is *impossible*, regardless of determinism." *Conceptually necessary.*

  **In essence:**

  *   **Van Inwagen (Hard Determinism):** "Determinism is true, therefore we lack the *control* needed for responsibility."
  *   **Strawson:** "Even *if* we have control, we can never be the *ultimate source* of ourselves, which is required for true responsibility. This is a *logical* truth."

  **Why it's significant:**

  1.  **Stronger Claim:** It attacks moral responsibility at a more fundamental level. If Strawson is right, *nothing* could save moral responsibility, not even libertarian free will or divine intervention (could God be responsible for creating Himself?).
  2.  **Bypasses the Free Will Debate:** It makes the centuries-old debate between compatibilism and incompatibilism potentially irrelevant to *ultimate* responsibility. Compatibilists (who think responsibility is compatible with determinism) must now defend that their conception *doesn't* require the impossible ultimacy Strawson targets.
  3.  **Focuses on "Ultimacy":** It forces philosophers to clarify *exactly* what kind of sourcehood or control they believe responsibility requires. Strawson argues that any robust notion *does* require ultimacy, and that's impossible.

  **So, yes, Strawson is adding something genuinely new:** He's not just saying determinism rules out responsibility; he's arguing that the very *concept* of ultimate moral responsibility is **incoherent** because it requires an impossible self-creation. It's a distinct, deeper, and arguably more devastating argument than traditional hard determinism.** It shifts the ground from physics/causation to the logic of self-origination. Your seminar likely treats it separately because it *is* a different kind of challenge.**
