  ## The Oslo Counterpoint

  Rain lashed the unfamiliar windowpane. Elin shivered, not just from the Scandinavian chill seeping into the borrowed Oslo apartment, but from the profound dislocation humming in her bones. The shimmering instability in the air told her the swap was ending. Across the small, minimalist living room, the *other* Elin watched her, a mirror distorted by different choices. *Oslo Elin*. Ten years ago, she’d taken the job offer that Elin had declined to stay and build a life – a marriage, now crumbling – back home.

  They’d spent the last twenty minutes in wary, fascinated communion. Shared childhood memories – the smell of Grandmother’s cinnamon buns, the exact pattern of the crack in their old bedroom ceiling – had flowed like shared blood. They’d both winced at the mention of Marcus, the toxic boyfriend before the husband. They both tapped their left ring finger when nervous, a habit Elin thought unique. The kinship felt profound, *real*.

  “It’s almost time,” Oslo Elin said softly, her voice identical, yet carrying a flatter, more pragmatic cadence honed by years in corporate finance. “The air’s getting thin.”

  Elin nodded, clutching the warm mug of tea Oslo Elin had made *exactly* how she liked it – milk, no sugar, steeped precisely four minutes. “It’s… incredible. Talking to you. It feels like… talking to *myself*. The self who chose differently.”

  Oslo Elin’s gaze sharpened. “Does it?” She leaned forward, elbows on her knees. “Tell me about the locket.”

  Elin blinked. “The silver one? With the forget-me-nots? Mum’s?”

  “The one you buried,” Oslo Elin clarified, her eyes unreadable.

  A jolt went through Elin. That was private. Painfully so. After Mum died, grief-stricken and sixteen, she’d taken the locket – Mum’s most cherished possession – and buried it deep in the roots of the old oak at the bottom of their garden. A desperate, symbolic act. Letting go. Keeping it safe. She’d never told *anyone*. Not Marcus, not her husband. The secret was a raw knot inside her, a tangible piece of her unique sorrow.

  “You… you buried yours too?” Elin whispered, a wave of dizzying connection washing over her. *Proof*. Proof they were truly the same person, sharing the same soul, just walking different paths. Kripke was right. Transworld identity. *She* was here, in Oslo. *She* had buried the locket.

  Oslo Elin didn’t smile. “Yes. After Mum died. Couldn’t bear to look at it. Needed it gone.”

  “Exactly,” Elin breathed, tears pricking her eyes. “Under the oak tree. Deep, near the big root that curves like a hand.”

  A flicker. Something cold and assessing in Oslo Elin’s eyes. “The oak tree? In the back garden?”

  “Yes! Where else?” Elin’s heart hammered. The connection felt like a physical tether, anchoring her fractured sense of self.

  Oslo Elin slowly shook her head. “I buried it in the *park*. By the old bandstand. The night *after* the funeral.” She paused, letting the words hang. “I remember thinking… the oak felt too final. Too much like a grave. The park was… public. Anonymous. Like maybe the grief wouldn’t stick to me so hard if I left it somewhere no one knew.”

  Silence crashed down, thick and suffocating. The hum of the impending swap grew louder, vibrating the teacup in Elin’s suddenly numb hands.

  *The park. Not the garden.*

  The detail was trivial, yet monumental. A fork in the road of their shared history that Elin hadn't even known existed. Her sixteen-year-old self had been consumed by a specific, solitary agony under the oak tree. Oslo Elin’s sixteen-year-old self had walked a different street, carrying a different weight, choosing a different patch of earth.

  “But… the *feeling*,” Elin stammered, grasping. “The needing to bury it? The pain?”

  “Oh, the pain was real,” Oslo Elin said flatly. “The *reason* was the same: unbearable grief. But the *act*… the specific, desperate choice made in that specific moment… that’s where we diverged, wasn’t it? Even before Oslo.” She gestured vaguely around the room. “Maybe even *then*. You went to the oak. I went to the park. Two different girls, in two different worlds, burying two different lockets.”

  The air crackled. The edges of the room began to fray, light bleeding through. The swap was reversing.

  Elin stared at the woman who shared her face, her voice, her deepest wounds… but not her specific, defining act of despair. Oslo Elin looked back, not with the empathy of a shared soul, but with the analytical curiosity of a scientist observing a remarkably similar specimen. She didn’t *feel* like Elin suddenly confronting her buried grief. She felt like a stranger who happened to know the combination to a very private safe.

  “You’re not me,” Elin whispered, the realization a physical blow. Lewis’s counterpart theory. A strikingly similar individual in a neighboring world, shaped by overlapping circumstances, but ultimately distinct. A stranger wearing her skin. Humphrey didn’t care if his *counterpart* won the election; he cared about *himself* winning. Elin cared about *her* locket under *her* oak tree. This woman had buried a different locket, in a different place. Her grief belonged solely to *her* world.

  “No,” Oslo Elin agreed, her form beginning to shimmer as the quantum tide pulled Elin home. Her voice was almost gentle now. “I’m the one who went to the park. You’re the one who stayed by the oak. We carry different dirt under our nails, Elin. Different worlds.”

  The apartment dissolved into blinding light and the sickening lurch of transposition. Elin landed hard on her own living room carpet, back in her failing marriage, back under the weight of her own choices. The scent of rain and unfamiliar tea lingered for a second, then vanished.

  She scrambled to her feet, heart pounding, and rushed to the back window. The old oak stood sentinel in the twilight. Her oak. Her locket. Her specific, unshareable grief buried deep in its roots.

  She wasn’t meeting *herself* in those other worlds. She was meeting ghosts, reflections, remarkably crafted counterfeits who shared her origin story but wrote different endings. They carried different dirt. Different lockets. Different scars on their souls. The profound loneliness of that truth settled over her, colder than Oslo’s rain. The swaps weren't reunions. They were collisions with cosmic strangers who knew too much.

  She looked at the device on her wrist – the conduit to countless other Elins. A tool for regret, she’d thought. A way to glimpse roads not taken. Now it felt like a passport to infinite, heartbreaking alienation. She traced the activation sequence, then stopped. Meeting another "her" wouldn't answer the question *she* needed to answer: who was *this* Elin, the one who stayed? The one who buried her grief under the oak? That answer wasn't waiting in Oslo, or any other possible world. It was buried right here, in the dirt of her own choices. She slowly unclasped the device. The shimmering possibilities faded, leaving only the solid, solitary reality of her own rain-streaked window. She had a life to dig up. Her own.
