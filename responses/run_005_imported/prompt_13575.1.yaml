  Looking at public health principles, prevention is often prioritized. However, supporting existing patients is also vital. The memo needs to balance these, perhaps by acknowledging the moral weight of both but leaning towards the greater long-term benefit. Including key questions for the council to consider, like ethical priorities and data confidence, can guide their discussion.

