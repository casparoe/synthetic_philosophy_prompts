prompt: |-
  I co-host a little podcast with a couple of my grad students where we have x-phi people on to get grilled a bit, and next month's guest is an experimental philosopher who's built her whole career defending the Deep Self Concordance Model as the explanation of the Knobe/side-effect effect -- the asymmetry where people say a side effect was brought about "intentionally" when its bad (the classic case being the CEO who doesn't care one way or the other about the environment) but not when the exact same psychological setup produces something good. Her pitch is that intentionality attributions track whether the states that caused the outcome are concordant with the agent's stable, evaluative "deep self," not just whether the outcome happens to be morally bad. I saw her give this talk at a conference already and she's got very smooth, rehearsed answers to the obvious pushback, so for the podcast I don't want questions that just cue up the standard spiel -- I was arguing with a colleague over lunch about whether the model secretly smuggles moral judgment back in through the deep-self side door, and I want the questions to get at that kind of pressure point.

  Could you draft eight or nine questions along those lines, each with a quick follow-up keyed to whatever dodge she's most likely to reach for? I want at least one on the circularity worry -- how you identify an agent's "deep self" without just reading your own prior moral read of the guy back into the case; one that puts her model head-to-head with Machery's trade-off hypothesis on the original chairman/CEO vignette, asking what her account predicts that his doesn't; one on "mere indifference" cases, since the CEO doesn't actually care about the environment either way, which seems different in kind from the internal conflict driving the weakness-of-will and addiction cases the deep-self framework was originally built to handle; one on the developmental findings that even pretty young kids -- four or five year olds -- show the same asymmetry despite presumably not having anything like a stable, reflective deep self yet; and one asking flat out what pattern of results would actually make her abandon the model instead of just patching it. Fill out the rest however you think best rounds it out.
reasoning: |-
  Okay, the user is co-hosting a podcast and needs sharp questions for an experimental philosopher defending the Deep Self Concordance Model (DSCM) regarding the Knobe effect. They want to avoid rehearsed answers and focus on pressure points, especially whether the model smuggles moral judgment through the "deep self" concept. 

  Hmm, the user is clearly well-versed in x-phi debates—they mention Machery's trade-off hypothesis, developmental findings, and mere indifference cases. Their frustration with standard pushback suggests they want to expose theoretical cracks. The colleague lunch argument about moral smuggling seems central. 

  First, I should map their explicit requests: 
  - Circularity (how deep self is identified without moral bias) 
  - DSCM vs. Machery's trade-off 
  - Mere indifference vs. deep self's original domain (weakness-of-will) 
  - Developmental challenge (kids showing asymmetry without stable deep selves) 
  - Falsifiability (what would kill the model) 

  Then add complementary angles: 
  - Moral residue in "concordance" criteria? 
  - Cross-cultural variations (Knobe effect strength differs) 
  - Non-moral bad outcomes (e.g., aesthetic) to isolate morality 
  - Whether deep self is descriptive or normative 

  For follow-ups, anticipate her dodges: 
  - She'll likely appeal to "stable evaluative attitudes" for circularity → press on operationalization. 
  - For Machery, she'll claim DSCM explains more → demand unique predictions. 
  - On indifference, she may reframe apathy as deep-self-revealing → challenge discontinuity. 
  - For kids, she might posit proto-deep-selves → ask for evidence. 

  The falsifiability question is crucial—she'll probably list ad-hoc patches → corner her with "death blow" scenarios. 

  Also, the user’s tone is combative ("grilled," "dodge," "pressure point"), so questions should be incisive but professional. No gotchas—rigorous skepticism. 

  *Starts drafting questions with surgical follow-ups*
answer: |-
  Here are eight targeted questions designed to probe the moral smuggling worry, circularity, predictive gaps, and falsifiability of the Deep Self Concordance Model (DSCM), with anticipated dodges and sharp follow-ups:

  ### Core Pressure Points:
  1. **Circularity & Moral Smuggling**  
     *Question:* "You identify an agent's 'deep self' through their stable evaluative attitudes. But in cases like the Knobe CEO—where the agent explicitly states *no* evaluative stance toward the environment—how do you *empirically* distinguish the 'deep self' from the attributor’s own moral judgment about what the agent *should* value?"  
     *Anticipated Dodge:* Appeals to "behavioral patterns" or "implicit commitments" beyond stated indifference.  
     *Follow-up:* "If the CEO’s *lack* of environmental concern is itself evidence of a 'deep self' concordant with harm, doesn’t this reduce to: *any* action is deep-self-concordant if it aligns with what the agent didn’t oppose? Isn’t that just a circular description of the outcome?"

  2. **DSCM vs. Machery’s Trade-Off Hypothesis**  
     *Question:* "Machery argues the asymmetry arises because moral judgment *directly* distorts intentionality attributions under cognitive constraints. What *unique prediction* does DSCM make for the original CEO vignette that Machery’s model doesn’t—and what data supports it?"  
     *Anticipated Dodge:* DSCM explains "real psychological conflict" vs. "heuristic error."  
     *Follow-up:* "But if both models predict the same asymmetry in the CEO case, what *specific* empirical finding (e.g., reaction times, brain imaging, or vignette variations) decisively favors DSCM over a distortion-based account?"

  3. **The "Mere Indifference" Problem**  
     *Question:* "The deep-self framework was designed for cases like addiction or weakness of will—where agents experience *internal conflict* between values and action. How does DSCM apply to the CEO’s *total apathy*, where there’s no conflict because no value exists to be overridden?"  
     *Anticipated Dodge:* "Indifference reflects a deep-self endorsement of outcomes."  
     *Follow-up:* "Doesn’t this stretch 'concordance' beyond recognition? If *inaction* toward a value counts as deep-self concordance when the outcome is bad, but not when it’s good, isn’t morality driving the asymmetry?"

  4. **Developmental Challenge (Kids Without "Deep Selves")**  
     *Question:* "4- to 5-year-olds show the Knobe asymmetry, yet lack the stable, reflective evaluative self required by DSCM. How can your model explain this without presupposing that toddlers have 'deep selves'?"  
     *Anticipated Dodge:* "Children have proto-deep selves or internalize external norms early."  
     *Follow-up:* "If kids attribute intentionality asymmetrically *before* they can articulate stable values, doesn’t this suggest the effect is driven by simpler mechanisms (e.g., affective reactions) that DSCM overcomplicates?"

  5. **Falsifiability: What Kills DSCM?**  
     *Question:* "What specific experimental result *could not* be accommodated by DSCM—even with post-hoc adjustments—and would force you to abandon the model?"  
     *Anticipated Dodge:* Lists *modest* disconfirming scenarios DSCM could tweak to explain.  
     *Follow-up:* "If DSCM can always be patched (e.g., by reinterpreting 'deep self' or 'concordance'), is it actually falsifiable—or just a flexible metaphor for moralized attribution?"

  ### Complementary Probes:
  6. **Moral Residue in "Concordance"**  
     *Question:* "When subjects judge the CEO’s harm as 'deep-self-concordant,' is this *independent* of their moral evaluation—or is 'concordance' itself a *proxy* for blame?"  
     *Anticipated Dodge:* "Concordance is descriptive! Subjects track psychological facts."  
     *Follow-up:* "In studies where subjects rate agents as *equally* indifferent to good/bad outcomes but *only* attribute intentionality for the bad, isn’t 'concordance' just laundering moral judgment?"

  7. **Cross-Cultural Variation**  
     *Question:* "The Knobe effect is weaker in some cultures (e.g., Hindu Indian vs. American subjects). DSCM ties intentionality to *individual* deep selves. Shouldn’t cultural differences in self-construal (independent vs. interdependent) radically alter the effect—yet the asymmetry persists?"  
     *Anticipated Dodge:* "Deep selves are culturally embedded!"  
     *Follow-up:* "If DSCM claims universality but explains variation via cultural 'embedding,' doesn’t it lose predictive precision compared to models where morality directly modulates attribution?"

  8. **Non-Moral Bad Outcomes**  
     *Question:* "When the side-effect is *non-morally* bad (e.g., an CEO’s action causes a *aesthetically* displeasing outcome), DSCM predicts no asymmetry—since no 'evaluative deep self' conflict exists. But recent data shows the asymmetry persists. Doesn’t this undermine DSCM’s necessity?"  
     *Anticipated Dodge:* "Subjects *moralize* aesthetic harm."  
     *Follow-up:* "If *any* negative outcome can be 'moralized' to fit DSCM, doesn’t this confirm critics who say your model’s 'deep self' is just a stand-in for the attributor’s negative evaluation?"

  ---

  ### Key Strategic Goals:
  - **Force operationalization:** Demand concrete, non-moral criteria for identifying "deep selves" (Q1, Q6).  
  - **Highlight explanatory gaps:** Contrast DSCM with leaner alternatives (Q2, Q4, Q8).  
  - **Expose elasticity:** Challenge post-hoc patching (Q5, Q7).  
  - **Isolate moral contamination:** Target indifference (Q3) and non-moral cases (Q8).  

  These questions avoid cueing standard defenses by attacking the *mechanistic* and *normative* foundations of DSCM—not just its surface-level compatibility with the Knobe effect. Good luck grilling! 🔥
