prompt: |-
  Random thing that's been bugging me: I teach contextualism and pragmatic encroachment back to back every semester, and I keep telling students they're basically two different answers to the same DeRose-style bank cases, but when they push me on it I can't always cash out why the two views aren't just notational variants of each other dressed up in different vocab. Both are happy to say 'S knows that p' is true given one stakes-situation and false given another, holding S's evidence completely fixed. What I actually want from you is this: what's doing the real theoretical work that keeps contextualism and subject-sensitive invariantism apart, and can you walk me through a case where the attributor and the subject sit in different stakes situations (say, a relaxed attributor gossiping about a subject who has a ton riding on the answer), so the two views actually spit out different verdicts on the knowledge ascription instead of just different explanations for the same verdict? I can never keep straight which view is suppose to say what in that kind of case.
