answer: |-
  You've nailed the core frustration! The divergence between **contextualism (C)** and **subject-sensitive invariantism (SSI)** - the dominant form of pragmatic encroachment (PE) - *only* becomes clear when the attributor's context and the subject's situation have *different* practical stakes. In same-stakes cases (like standard DeRose bank cases), they predict the same truth-value for the knowledge ascription, just with different explanations. The *real theoretical work* separating them is **what fixes the epistemic standard relevant for the truth of "S knows that p"**:

  1.  **Contextualism (C):** The standard is set **by the attributor's context** (conversational standards, interests, stakes, salience of error possibilities). The truth-conditions of "knows" shift with the context of utterance.
  2.  **Subject-Sensitive Invariantism (SSI):** The standard is set **by the subject's practical situation** (their stakes, needs, available actions). "Knows" has invariant semantic content, but whether that content is *true* depends (in part) on the *subject's* practical context.

  **The Crucial Case: Divergent Stakes (Low Attributor / High Subject)**

  Let's construct the scenario you need:

  *   **The Subject (Harriet):** Harriet is rushing to deposit a crucial business contract at City Bank before a 5:00 PM deadline. If it's not deposited today, her company loses a $10 million deal and she'll be fired. She drove by City Bank yesterday afternoon (Friday) and saw a long line, but her banking app *clearly* shows "Open Saturday 9 AM - 1 PM". It's now 11:30 AM Saturday. She glances at the app again, sees the hours, and thinks "Great, I'll just zip in on my way to the airport." She *doesn't* double-check the bank's website or call them. Given the immense stakes *for Harriet*, she feels immense pressure and would need to be *absolutely certain* to rationally act on the belief that the bank is open. (High Subject Stakes)
  *   **The Attributor (Larry):** Larry is Harriet's colleague, but he's completely unaware of the $10 million deal or her job being on the line. He knows she needs to deposit something. He's sitting relaxed at home on Saturday morning, sipping coffee and gossiping with his partner about work stuff. He casually mentions, "Oh, Harriet will get that contract deposited, no problem. She knows City Bank is open today – she checked her app yesterday and just looked again." (Low Attributor Stakes)
  *   **The Evidence:** Both agree: Harriet's evidence consists *only* of seeing the hours on her generally reliable banking app yesterday and glancing at it again this morning. She has no defeating evidence, but hasn't done extra checks (website, call). Let's stipulate this evidence is *ordinarily sufficient* for knowing the bank is open (in low-stakes contexts) but *falls short* under very high-stakes pressure where being wrong is catastrophic.

  **The Knowledge Ascription & The Verdicts:**

  Larry asserts: **"Harriet knows that City Bank is open today."**

  1.  **Contextualism (C) Verdict: TRUE**
      *   *Why:* Larry is the attributor. His context is low-stakes, relaxed. The salient error possibilities (maybe the app is wrong? maybe there was a last-minute closure?) are *not* raised or relevant in his casual conversation. The epistemic standard operative in *Larry's context* is relatively low. *Given Harriet's evidence* (checking the app twice), she easily meets *Larry's low standard* for "knows". The truth of *Larry's utterance* "Harriet knows..." depends on whether Harriet meets *the standard Larry's context sets*. She does. So Larry spoke truly.

  2.  **Subject-Sensitive Invariantism (SSI) Verdict: FALSE**
      *   *Why:* The truth of "S knows that p" depends on whether S meets the epistemic standard *fixed by S's own practical situation*. Harriet's stakes are *extremely high*. Losing $10 million and her job is catastrophic. To rationally act on the belief that the bank is open (e.g., not calling to confirm, not going to a different branch), Harriet needs *very strong evidence*, ruling out even remote possibilities of error (app glitch, unposted closure). Merely checking the app twice, without further corroboration, is *insufficient* for knowledge *given the immense practical costs Harriet would face if she were wrong*. Therefore, relative to *Harriet's* high-stakes situation, she does *not* know the bank is open. Since the truth of "Harriet knows..." depends on *Harriet's* situation (not Larry's), Larry's assertion is false.

  **Why This Isn't Just a Notational Variant:**

  1.  **Different Truthmakers:** In this divergent case, C and SSI assign *opposite truth-values* to the *same utterance* ("Harriet knows...") made in the *same attributor context*. This isn't just explaining the same verdict differently; it's a fundamental clash in what makes the sentence true or false.
  2.  **What's Fixed vs. What Shifts:**
      *   **C:** The *meaning* of "knows" shifts (context-sensitive). Its content changes based on the attributor's context. Harriet's situation is a *fixed fact* evaluated against this shifting standard.
      *   **SSI:** The *meaning* of "knows" is fixed (invariant). Its content is constant. What changes is whether that fixed content *applies to the subject*, depending on *their* practical situation relative to the proposition.
  3.  **Theoretical Mechanisms:**
      *   **C** is fundamentally a *semantic* theory about the word "knows". It posits that "knows" is a context-sensitive term like "tall" or "ready".
      *   **SSI/PE** is fundamentally a *metaphysical* or *epistemological* theory about the *nature of knowledge itself*. It posits that whether a true belief constitutes knowledge depends partly on practical factors concerning the *subject's* actions and stakes. It treats "knows" as having a stable meaning, but the conditions for satisfying that meaning are practically sensitive.

  **Why This Matters for Teaching:**

  *   **Highlight Divergent Cases:** Emphasize that the *only* way to see the difference is in cases where the attributor's stakes/standards and the subject's stakes *diverge*. Standard bank cases mask the distinction.
  *   **Ask "Whose Context Matters?":** For any knowledge ascription "A says 'S knows that p'", force the question: For the truth of *A's utterance*, whose context sets the standard? (C: A's context; SSI: S's context).
  *   **Focus on the Speaker's Truth:** Ask: Could the speaker (A) be speaking truly *in their own low-stakes context* while talking about a high-stakes subject who intuitively seems to lack knowledge? C says "Yes", SSI says "No".

  This case clearly demonstrates that C and SSI aren't notational variants. They make genuinely conflicting predictions about the truth of knowledge ascriptions when the attributor and subject occupy different practical contexts.
