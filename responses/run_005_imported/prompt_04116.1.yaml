  First, I need to recall the core distinctions. Contextualism says the truth-conditions of "knows" depend on the attributor's context, especially their stakes or conversational standards. Subject-sensitive invariantism (SSI), a form of pragmatic encroachment, ties the truth to the subject's practical situation. So in mixed-stakes cases, they should diverge. 

