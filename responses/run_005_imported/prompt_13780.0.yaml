  But the Buddhists would pounce here: If you perceive cow-ness directly, why call it "non-verbal"? Dignāga's kalpanā (conceptual fabrication) thesis insists any cognition involving universals *must* be language-mediated. Nyāya's response—that universals are real mind-independent properties—becomes crucial. Their "two-tiered" theory (first non-conceptual, then conceptual) is a known model, but the user wants to avoid textbook summaries. Instead, I should highlight how this suture in the sūtra forces Nyāya to refine their realism: perception *delivers* objects with universals, but language *labels* them. The friction is productive—it exposes Nyāya's metaphysical commitments.

  For the handout, I'll structure it as: (1) textual exegesis showing avyapadeśya's modesty (blocks testimony, not concepts), (2) vyavasāyātmaka as judgment's determinacy (not necessarily verbalized), (3) the Buddhist challenge as a stress test for Nyāya realism. The stakes? If perception can't grasp universals, Nyāya's entire epistemology—grounding inference in perceived correlations—crumbles. That's why this seam matters so much.
answer: |-
  Here's a rigorous reconstruction focused on resolving the tension and its dialectical significance, designed for a 1-page seminar handout:

  ---

  **Handout: Resolving the Tension in Nyāyasūtra 1.1.4 on Perception**

  **Core Tension:**  
  *Avypadeśya* (non-verbal/non-name-associated) seems to preclude conceptual content, yet *vyavasāyātmaka* (determinate judgment, e.g., "this is a cow") inherently involves universals (*sāmānya*) and language association.

  **Textually Defensible Resolution (Synthesizing Commentators):**  
  1.  **Avypadeśya ≠ Non-Conceptual:**  
      -   **Vātsyāyana (Bhāṣya):** *Avyapadeśya* primarily distinguishes perception from *śabda* (testimony). It means the cognition **is not *dependent* on verbal testimony** for its validity. The object is presented *directly*, not via words.  
      -   **Jayanta Bhaṭṭa (Nyāyamañjarī):** Emphasizes *avyapadeśya* as **not being *about* a name**. Perception grasps the object itself (*viṣayamātra*), not the *word* for the object. The cognition "cow" is *of* the animal, not *of* the word "cow".  
      -   **Gaṅgeśa (Tattvacintāmaṇi):** Refines it as cognition **not being *caused* by linguistic competency (*śabdasaṃskāra*)** at the moment of sensory contact. The conceptual element (*jāti*) is perceived *with* the particular, but its identification isn't triggered *by* recalling the word *at that instant*.

  2.  **Vyavasāyātmaka = Determinate Identification:**  
      -   **Unified Cognition:** Gautama compresses the *mature* perceptual experience. *Vyavasāyātmaka* signifies a cognition that **settles the identity** of the object (*idam iti niścayaḥ* - "this is this"). This requires:  
          -   Differentiation from other things (*anyavyāvṛtti* - "not a horse").  
          -   Recognition of the universal (*sāmānya*) inhering in the particular (*viśeṣa*).  
      -   **Not Necessarily Verbalized:** The judgment "this is a cow" *involves* the universal *gotva* (cow-ness), but the cognition itself is **non-propositional and non-discursive**. It's an immediate, unified awareness of the qualified particular (*viśiṣṭa-vastu*). Language (*saṃjñā*) associates *later*.

  3.  **Joint Satisfiability:**  
      A single cognitive episode can be:  
      -   **Causally:** Generated *only* by sense-object contact (*indriyārthasannikarṣa*), not language/testimony.  
      -   **Contentfully:** A determinate identification of a particular qualified by a universal (*svalakṣaṇa-sāmānya-sahita*).  
      -   **Functionally:** Non-erroneous (*avyabhicāri*) and providing immediate, certain knowledge (*pramā*) of the object *as it is*.  
      *The universal is perceived **in** the particular, not inferred or supplied by language at the moment of genesis.*

  **Why This Seam Matters in the Nyāya-Buddhist Dispute:**

  1.  **Buddhist Challenge (Dignāga/Dharmakīrti):**  
      -   **Kalpanā (Conceptual Construction):** True perception (*pratyakṣa*) is *nirvikalpaka* (non-conceptual) – bare sensation of unique particulars (*svalakṣaṇa*), devoid of universals, names, or judgments.  
      -   **Universals are Imposed:** *Savikalpaka* (determinate) cognition like "cow" involves *kalpanā* – superimposing the unreal universal "cow-ness" (*apoha*/exclusion) via language. This is *inferential*, not perceptual.  
      -   **Critique of Nyāya:** NS 1.1.4 is incoherent. *Vyavasāyātmaka* ("this is a cow") *requires* *kalpanā*, making it *avyapadeśya* (non-perceptual) by Buddhist standards. Gautama conflates perception with conception.

  2.  **Nyāya Defense & Stakes:**  
      -   **Realism about Universals:** Nyāya asserts *sāmānya* (universals) are real, mind-independent properties (*padārtha*) *directly perceived* inhering in particulars. Seeing a cow *is* seeing *gotva* manifested *in* that individual.  
      -   **Perception is Epistemically Foundational:** If perception *only* delivers bare particulars (*svalakṣaṇa*), then:  
          -   **Inference Collapses:** Nyāya inference (*anumāna*) relies on perceiving correlations (*vyāpti*) between universals (e.g., smoke and fire). No perceived universals = no *vyāpti* = no valid inference.  
          -   **Language & Action become Ungrounded:** How do we identify *this* as "fire" (requiring a universal) to avoid it, if perception gives only unique, unclassifiable moments?  
      -   **Refined Two-Tier Theory (Response to Buddhists):** Later Naiyāyikas (Uddyotakara, Udayana, Gaṅgeśa) *accept* a foundational *nirvikalpaka* moment (bare sensation of qualified particular) but insist mature perception (*vyavasāyātmaka*) is *still pratyakṣa* because:  
          -   Its content (*viṣayatā*) is *determined solely* by sense-object contact.  
          -   The conceptual element (*jāti*) is *presented*, not *constructed*.  
          -   *Avyapadeśya* guards against *śabda* dependence, not against the *presence* of perceived universals.

  **Conclusion:**  
  The tension arises because Gautama defines *mature perceptual knowledge* (vyavasāyātmaka), not its genesis. *Avyapadeśya* ensures its *causal origin* and *epistemic immediacy* are sensory, not testimonial or purely linguistic. The "name" excluded is the *word qua word*, not the *universal property* directly apprehended in the object. This seam became crucial because the Buddhist *svalakṣaṇa/kalpanā* theory directly attacked Nyāya's realist metaphysics and the possibility of perception grounding inference and language. Resolving the tension was essential for defending Nyāya's core epistemological and ontological commitments.

  ---
  **Key for Seminar Discussion:**
  *   **Focus:** Gautama defines the *pramā* (valid knowledge), not the psychological process. The qualifiers specify *conditions* for validity.
  *   **Metaphysical Stakes:** Can perception deliver objects *as types*? If not, knowledge of repeatable properties (foundational for Nyāya) is jeopardized.
  *   **Dialectical Engine:** Buddhist critique forced Nyāya to refine its theory (e.g., accepting *nirvikalpaka*), but they held the line that *vyavasāyātmaka* remains perceptual due to its direct causal link and presentation of real universals.
