answer: |-
  That's a fantastic dive into one of legal philosophy's most famous debates! You've grasped the core tension brilliantly. The persistence of legal positivism (Hart's side) as the mainstream view isn't about excusing Nazi atrocities or being morally unserious – it stems from deep concerns about the *practical function* and *dangers* of the natural law approach (Fuller's side), even when applied against clear evils like Nazism.

  Here's why Hart's positivism remains influential, despite the visceral appeal of Fuller in cases like the Grudge Informer:

  1.  **The "Clarity and Honesty" Argument (Hart's Core Point):**
      *   Hart argued that calling the Nazi statute "not law" *after the fact* is intellectually dishonest and practically dangerous. In 1944, within the Nazi system, that statute *was* valid law. People *were* arrested, tried, and executed under it. Officials *did* act with its authority.
      *   Positivism forces us to confront this ugly reality head-on: **A legal system can be monstrously evil *and* still be a functioning legal system.** Saying "it wasn't *real* law" obscures this danger and makes it harder to analyze how such systems operate and gain compliance.
      *   **The Post-War Problem:** If the Nazi statute wasn't law, what was the legal basis for punishing the wife? Punishing her required applying *new* post-war legal principles *retroactively* to her 1944 act. Hart argued it's more honest to say: "What you did was legal under the horrific Nazi regime, but we are now creating a *new* legal order based on justice, and under this new order, your act is punishable." This avoids the fiction that the Nazi law didn't exist.

  2.  **The "Slippery Slope" / "Who Decides Morality?" Problem (Critique of Fuller):**
      *   Fuller's position requires judges to decide when a law is "so unjust" that it ceases to be law. But *who defines* "so unjust"? And *how unjust* is unjust *enough*?
      *   This injects immense subjective moral judgment into the *definition* of law itself. While appealing in extreme Nazi cases, this power is terrifying in less clear-cut situations. Judges could potentially declare *any* law they dislike (tax laws, regulations, social policies) "not real law" based on their personal moral views. This fundamentally undermines the predictability and stability that law is supposed to provide.
      *   Positivism seeks to separate the *existence* of law (based on social sources like enactment by a legislature) from its *moral merit*. This separation allows for clearer analysis and more honest moral criticism. We can say: "This is a valid law, but it is profoundly unjust and should be disobeyed/changed."

  3.  **Practical Function of Law: Predictability and Order:**
      *   Law's primary function in a complex society is to provide predictable rules for conduct and dispute resolution, even when people disagree on morality. Positivism focuses on identifying those rules based on observable sources (statutes, precedents, constitutions).
      *   Basing legal validity on contested moral principles threatens this predictability. People (and officials) need to know what the law *is* before they can argue about what it *should be*. Natural law, by making validity hinge on morality, risks collapsing this distinction and making the law itself constantly contestable on fundamental moral grounds.

  4.  **Addressing Nuremberg and "Just Following Orders":**
      *   Hart *supported* the Nuremberg trials but offered a *different justification*. He argued that the Nazi leaders could be prosecuted under *new* principles of *international law* (like crimes against humanity) that were emerging *during* the war, rather than being purely retroactive. He was critical of aspects he saw as *ex post facto*.
      *   The "just following orders" defense fails under positivism too. Positivism distinguishes between a law's *validity* and the *moral obligation to obey it*. Hart argued that valid laws can be so morally repugnant that individuals have not just a right, but a *duty*, to disobey them. The defense fails because obeying an *immoral valid law* is not an automatic moral or legal excuse, especially for atrocities. The focus shifts to the individual's moral responsibility *despite* the law's formal validity.

  5.  **Modern Positivism Isn't Morally Nihilistic:**
      *   Contemporary legal positivists (like Hart himself, and Joseph Raz) are **not** saying unjust laws *must* be obeyed. They are emphatically *not* defending Nazi judges.
      *   They are making a conceptual claim about *what law is*: a social artifact created by human practices, identifiable by its sources, distinct from morality. This separation is seen as essential for clear analysis.
      *   **Inclusive vs. Exclusive Positivism:** Modern debates refine this. "Inclusive" positivists (like Jules Coleman) argue a legal system *can* incorporate moral criteria as *part of its own rules* for validity (e.g., a constitution requiring laws to be "just"). But the key is that the *system itself* sets the rule. "Exclusive" positivists (like Raz) argue validity must *only* depend on social facts, not morality.

  **Why Positivism Endures in Law Schools and Courts:**

  1.  **Practical Tool:** It provides judges and lawyers with a relatively clear, objective (source-based) method for identifying what the law *is* at any given moment, which is their primary professional task. They can then argue about what it *should* be separately (through policy arguments, constitutional interpretation, etc.).
  2.  **Preserves Judicial Role:** It avoids giving judges the unchecked power to invalidate laws purely on subjective moral grounds, keeping them focused on interpreting the law *as it exists* according to authorized sources (text, precedent, intent).
  3.  **Facilitates Reform:** By clearly identifying valid but unjust laws, positivism highlights targets for democratic reform, legislative change, or constitutional challenge. Saying an unjust law "isn't law" can paradoxically make it harder to fight, as it denies its existence as a problematic *legal* artifact.
  4.  **Manages Moral Disagreement:** In pluralistic societies, positivism offers a way to have a functioning legal system even when citizens deeply disagree on fundamental moral issues. The law's validity rests on shared recognition of institutional processes, not shared morality.

  **Conclusion:**

  You're right that Fuller's position feels morally compelling in the extreme case of the Grudge Informer. It resonates with our intuition that such profound evil cannot be "law." However, Hart and legal positivism persist because they address a fundamental concern: **The danger of dissolving the concept of law into morality is that it risks undermining law's ability to function as a stable, predictable framework for society, and grants potentially dangerous discretion to those who define "morality."**

  Positivism argues that we best confront evil laws by acknowledging them *as laws* and then subjecting them to relentless moral criticism, civil disobedience, and political change, rather than by pretending they didn't exist or weren't legally valid within their own horrific context. It's a philosophy born not of moral indifference, but of a deep concern for clarity, honesty, and the practical realities of how legal systems operate – both good and unspeakably evil ones. The debate endures precisely because both sides raise profound and irreconcilable concerns about law, morality, and power.
