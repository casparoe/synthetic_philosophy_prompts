answer: |-
  Here’s a warm, layered toast that honors Nadia and Cole’s values while keeping things universally celebratory. It subtly nods to Russell for those who know, frames jealousy thoughtfully for the couple, and keeps it uplifting for all:

  ---

  **The Toast:**

  "Hi everyone. For those who don’t know me, I’m [Your Name], a longtime friend of Nadia’s—and now, very happily, a friend of Cole’s. When Nadia asked me to give this toast, I’ll admit I felt that novelist’s pressure: *‘This has to be good. It has to be meaningful.’* But then I remembered who we’re celebrating—two people who’ve taught me that meaning isn’t found in rigid scripts, but in thoughtful, honest connection.

  We all know how Nadia and Cole met: in a reading group, debating ideas that challenge the way we see the world. That feels deeply fitting. Because their relationship, from the very start, wasn’t about following a pre-written story. It was about *writing their own*—page by page, conversation by conversation. They met over books, yes, but more importantly, they met over a shared belief in asking big questions—about love, about commitment, about what it means to truly build a life *together*.

  One thinker they both admire, Bertrand Russell, wrote something in *Marriage and Morals* that feels particularly relevant to these two. He challenged the idea that jealousy is some fixed, inevitable part of love. He suggested it might be something we *learn*—and therefore, something we might *unlearn*, or at least, understand differently. Now, Nadia and Cole… they embody that spirit of questioning. They don’t just accept inherited ideas about how relationships *should* look. They look each other in the eye, they talk—really talk—and they *choose* the shape of their commitment, deliberately and with profound honesty.

  **(Pause, warm smile towards the couple)**

  And that’s what I admire most about them: their **courageous honesty** and their **relentless commitment to design**. They understand that a strong marriage isn’t built on ignoring complexity, but on facing it together—with clear eyes, open hearts, and a deep well of trust. They know that real love isn’t possessive; it’s expansive. It doesn’t clip wings; it gives space for *both* to soar. The foundation they’ve built? It’s made of radical trust, fierce communication, and a shared belief that love grows stronger when it’s rooted in freedom and respect.

  **(Slight shift, more inclusive tone, glancing at family/friends)**

  Now, Russell, brilliant as he was, was also human. He wrote about ideals that were hard, sometimes *impossibly* hard, to live up to. That’s the thing about ideals: they’re stars to navigate by, not guarantees of smooth sailing. What matters—what truly makes Nadia and Cole’s bond so inspiring—isn’t philosophical perfection. It’s their **daily practice**. It’s how they *show up* for each other: with kindness, with patience, with laughter that fills a room, and with a partnership that’s clearly a source of strength and joy for them both. They haven’t just found love; they’ve built a remarkable *collaboration*.

  **(Raise glass)**

  So, let’s raise our glasses to Nadia and Cole! To your incredible courage in choosing your own path. To the deep honesty and trust that make your love so vibrant and resilient. To the laughter, the debates, the quiet moments, and the grand adventures ahead. May your marriage continue to be a testament to the power of conscious choice, deep respect, and the kind of love that liberates and uplifts you both. We celebrate not just your union today, but the beautiful, thoughtful, and inspiring way you *live* that union every single day. To Nadia and Cole!"

  ---

  **Why this works:**

  1.  **Honest Russell Nod (for the friends):** Directly names Russell and *Marriage and Morals*. Explicitly mentions his challenge to jealousy as learned ("unlearn or understand differently"). Uses key Russellian concepts: "inherited ideas," "questioning," "love isn't possessive, it's expansive," "love rooted in freedom and respect."
  2.  **Acknowledges Complexity Gracefully:** The line about Russell's ideals being "stars to navigate by, not guarantees of smooth sailing" and "hard, sometimes impossibly hard, to live up to" *is* the reference to his personal failure, but it's framed positively – focusing on the *effort* and the *daily practice* being what matters. It validates the struggle without dwelling on it or being a downer.
  3.  **Universal & Uplifting for Family:** Focuses on universal values everyone can celebrate:
      *   **"Writing their own story" / "Design" / "Conscious Choice":** Sounds romantic and modern, not threatening.
      *   **"Courageous Honesty," "Radical Trust," "Fierce Communication":** Undeniably positive traits for *any* marriage.
      *   **"Facing complexity together," "Deep well of trust," "Partnership," "Source of strength and joy," "Collaboration":** Warm, strong, traditional-sounding virtues.
      *   **"Love that liberates and uplifts":** A beautiful sentiment everyone agrees with.
      *   Avoids jargon like "non-monogamous," "open," "poly." The description *implies* it through values without stating it explicitly.
  4.  **Warmth & Celebration:** Starts and ends with genuine affection for the couple. Highlights their laughter, connection, and the joy they bring. The core message is deeply positive: celebrating their unique, thoughtful, and strong bond.
  5.  **Focus on Them, Not Russell:** Russell is the starting point, but the toast quickly pivots to celebrating *Nadia and Cole's* specific qualities and choices ("*They* embody that spirit," "What matters... is *their* daily practice").
  6.  **Tone:** Respectful, admiring, warm, inclusive, and ultimately joyous.

  **Delivery Tips:**

  *   **Emphasize the positive values:** Lean into "honesty," "trust," "communication," "choice," "joy," "partnership."
  *   **Make eye contact:** With Nadia & Cole during the specific Russell/values parts, sweep the room warmly during the universal parts.
  *   **Pace:** Keep it steady. The slightly more complex Russell bit needs clear delivery, then flow into the warmer, broader celebration.
  *   **Smile!** Your genuine happiness for them is the most important ingredient.

  This toast respects Nadia and Cole's wishes, honors their intellectual foundation honestly, acknowledges the real-world challenges of ideals without being bleak, and delivers a beautiful, inclusive celebration that Grandma and Cole's parents will find touching and meaningful. Cheers!
