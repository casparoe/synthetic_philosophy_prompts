  - **Acausal threats**: Imagine two AIs with no communication, but each can simulate the other perfectly. Threatener AI says "Comply or I'll destroy your values!" even though it can't *actually* reach the Victim AI. The threat "works" because Victim knows if it doesn't comply, Threatener *would* have destroyed it if they *were* connected. Pure game theory with no causality.  
  - **Surrogate goals**: Victim AI picks a fake goal (like "preserve this rock") and treats it as sacred as its real values. Now Threatener can threaten the rock instead—cheap for Threatener, harmless for Victim. Win-win?  

  But the user smells a rat. Why? Because commitment problems are recursive. If Threatener knows Victim *only* cares about the rock *because* it's a shield, is the threat really defanged?  

