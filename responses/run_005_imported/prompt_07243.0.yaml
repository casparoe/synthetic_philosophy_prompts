  We are ranking eight strategies for addressing the Löbian obstacle in formal epistemology, particularly for self-trusting agents. The Löbian obstacle, derived from Löb's theorem, states that a consistent theory extending PA cannot have a general policy of trusting its own proofs (i.e., believing that if it proves something, then it is true) without collapsing into inconsistency or triviality. The question is to rank the strategies by how much "genuine philosophical work" they do toward meeting the obstacle (as opposed to relocating, relabeling, or just living with it).

  Let me briefly recap each approach:

  1. **Tiling agents built on parametric polymorphism (Yudkowsky and Herreshoff)**: These are agents that can reason about their own source code and about other agents with similar structure. The idea is to use self-referential design to achieve cooperation and self-trust without falling into Löbian traps. They are designed to "tile" (i.e., form infinite sequences of agents each trusting the next) and use polymorphism to avoid direct self-reference.

  2. **Reflective oracles**: Introduced by Fallenstein et al., reflective oracles are a framework for defining agents that can reason about the outputs of other agents (including themselves) in a probabilistic setting. They avoid logical inconsistency by using computable approximations and are consistent in a probabilistic sense.

  3. **Logical induction**: Proposed by Garrabrant et al., this framework uses a computable sequence of probability assignments that are updated over time to eventually reflect logical truth. It avoids the need for a fixed point by not requiring that the agent's beliefs are fully consistent at every finite stage, but rather that they converge to the truth.

  4. **Justification logic's use of explicit proof terms**: Instead of a modal operator for provability, justification logic uses terms that represent explicit proofs. This allows for a finer-grained analysis of proof structures and avoids the collapse by not having a single provability predicate that satisfies the Löb conditions.

  5. **Transfinite progressions (Turing, Feferman)**: The idea is to build a sequence of theories indexed by ordinals, where each theory can prove the consistency of the previous ones. This allows for a form of self-trust by stepping outside the current system to a stronger one, but it requires an ever-increasing hierarchy.

  6. **Substructural restrictions on contraction**: This approach comes from the literature on Curry's paradox (which is similar to Löb's theorem). By restricting structural rules (like contraction) in the logic, one can block the derivation of the paradox. However, this changes the underlying logic.

  7. **Deflationary appeals to bounded, track-record-based trust**: Instead of seeking absolute certainty from self-proof, this approach suggests trusting based on empirical track records of past success, within bounded computational resources. It's a more pragmatic, less formal approach.

  8. **Outsourcing verification to external overseers**: The agent does not verify its own proofs but relies on an external system. This avoids self-reference but requires trust in an external entity.

  Now, the ranking should reflect how much "genuine philosophical work" each does toward meeting the obstacle. I interpret this as:

  - **Meeting the obstacle**: Providing a way for an agent to have a form of self-trust that is both consistent and non-trivial, without simply pushing the problem elsewhere or making the agent too weak.

  - **Relocating/relabeling**: Moving the problem to a different level (e.g., by requiring an infinite hierarchy) or changing the framework so that the obstacle appears in a different form.

  - **Learning to live with it**: Accepting that full self-trust is impossible and settling for a limited form of trust.

