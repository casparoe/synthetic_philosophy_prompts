answer: |-
  ## The Conference Bar Debate: Optional Stopping Under the Microscope

  **Setting:** A noisy conference bar after a session on QRPs. Clinking glasses, low chatter. **Dr. Freya Frost** (Frequentist, sharp suit, intense gaze) sips mineral water. **Dr. Bayes Bennett** (Bayesian, tweed jacket, thoughtful expression) swirls a glass of red wine. They spot each other near the bar.

  **Frost:** (Nodding curtly) Bayes. That session... reinforces why we need *rigor*. Procedures matter. Can't just sweep them under the rug when convenient.

  **Bennett:** Freya. Agreed on rigor, naturally. But I worry the focus is sometimes misplaced. Rigor in *interpretation* is paramount. The data, once observed, deserve a consistent interpretation.

  **Frost:** (Leans in) Precisely my point! Interpretation *depends* on the procedure used to get the data. Take this optional stopping nonsense. I reviewed a paper – kid checked p-values every fortnight, stopped at p<.05. Reported it as if it were a fixed-n experiment. That's indefensible!

  **Bennett:** (Raises an eyebrow) Ah, the classic battleground. And you argued it inflates the false positive rate under hypothetical repetition. Correct?

  **Frost:** Correct! It *absolutely* does. Simulate it: Design a study where the *true* effect is zero. Keep peeking and stopping at p<.05. Over many such studies, you’ll falsely "find" an effect far more than 5% of the time. Maybe 15%, 20%, even higher depending on the peek frequency! The reported p-value is a lie. It claims a long-run error rate it doesn’t deliver. Ignoring the stopping rule ignores this *fact* about the procedure’s operating characteristics. Science needs *checkable* error control. How can we trust results if the nominal error rate is fiction?

  **Bennett:** I understand the simulation. But Freya, that simulation relies entirely on *data you didn’t observe*. It depends on hypothetical future experiments, hypothetical data sequences, all governed by your chosen stopping rule. The *actual evidence* in the *single experiment you actually ran* is contained entirely in the likelihood function – Pr(Observed Data | Hypothesis). And that function depends *only* on the data you have, *not* on the counterfactual paths your stopping rule might have taken.

  **Frost:** But the stopping rule *changes* the meaning of the evidence! It alters the sampling distribution! The p-value calculation *assumes* a fixed sample size. When you stop based on the data, you violate that assumption. You’re conditioning on an event (crossing p<.05) that biases the sample.

  **Bennett:** Does the *likelihood* change? Calculate L(H | Data) for your fixed-n experiment. Now calculate it for the same data collected under an optional stopping rule where the researcher planned to peek every 10 participants and stop at p<.05. Is L(H | Data) any different?

  **Frost:** (Pauses) Mathematically? For the *same exact dataset*, no, the likelihood function itself doesn’t change. But the *interpretation* must! The probability of *obtaining that data or more extreme*, under the null, *is* different under the two procedures. That’s the definition of the p-value! Ignoring the rule blinds you to the actual rarity of your result *under the procedure used*.

  **Bennett:** But why should the *reason* for stopping change the weight of evidence *in this specific dataset*? Suppose two labs run identical manipulations. Lab A pre-registers n=100. Lab B plans to peek every 20 participants and stop if p<.05 or at n=200. Both labs, by pure coincidence, collect *exactly* 100 participants and get *exactly* the same data, achieving p=.04 at n=100. Lab A reports p=.04. Lab B also stopped at n=100 because p<.05. Do these two identical datasets *really* contain different evidence against the null? Should we trust Lab A's p=.04 but not Lab B's?

  **Frost:** (Frowning) Logically, it feels absurd. But *procedurally*, yes! Lab B’s procedure *allowed* for multiple looks. The fact that they *didn’t* need more looks is irrelevant to the *properties* of the procedure they *chose*. The potential for inflation existed. The error rate is attached to the *method*, not the specific outcome path. If we let Lab B report p=.04 without correction, we incentivize and legitimize a procedure we *know* inflates errors. We lose control over the long-run frequency of false positives in the literature.

  **Bennett:** You're prioritizing the *procedure's* long-run properties over the *evidence actually obtained*. The Likelihood Principle states that *all* the experimental information about H is in the likelihood. The stopping rule contributes nothing *to the evidence about the hypotheses* beyond the data itself. Conditioning on the stopping rule, for a Bayesian updating beliefs, is conditioning on an event that is *ancillary* – its distribution doesn't depend on the parameter of interest. It shouldn't affect the inference.

  **Frost:** Ancillary? Not necessarily! The *decision* to stop *is* influenced by the data, which *is* related to the parameter! That’s the whole point! And what about *your* practical problem, Bayes? You rely on the stopping rule being known to specify your model correctly for sequential analysis. What if the researcher *didn’t* have a sharp intention? What if they just thought "Hmm, 50 participants feels good... oh look, p=.049! Stop!"? How do *you* model that vague intention? What's *your* likelihood for "whenever it feels like enough data"?

  **Bennett:** (Sips wine, nods slowly) A fair point, Freya. Ambiguity in the *actual* stopping intention is a genuine challenge for *any* framework trying to model the data-generating process precisely. The Bayesian response is multi-faceted. First, with vague intentions, the *observed* data becomes even *more* paramount. Second, we can use priors that account for potential flexibility – skepticism induced by optional stopping can be incorporated into the prior. Third, and crucially, the Bayesian answer depends *only* on the *actual* stopping time observed *if* we condition on it, but often, the impact is minimal compared to the dominant information in the data. However... (leans forward) doesn't your approach face the *same* ambiguity problem, just more severely?

  **Frost:** How so?

  **Bennett:** Your entire critique hinges on knowing the *exact* stopping rule used to calculate the correct sampling distribution and adjust the p-value. If the researcher *truly* stopped "when it felt right," what *is* the correct stopping rule to simulate? How many looks did they *intend* to make? Was there a maximum N? Without a pre-specified, formal rule, your inflation simulation is undefined! You need a *model* of their vague intention to compute *your* error rate. Isn't your frequentist correction just as vulnerable to the "intention" problem? You might accuse them of peeking every 10 participants, but maybe they only peeked mentally every day? How do you adjudicate that?

  **Frost:** (Silent for a moment, then sighs) You have a point. Vague intentions are a nightmare for *any* formal analysis. That's *why* pre-registration with fixed stopping rules is so vital! It removes the ambiguity. But in the *absence* of pre-registration, ignoring the *fact* that they stopped based on the data is still worse than trying to model it conservatively. Assuming a fixed-n analysis when it clearly wasn't is knowingly using the wrong distribution.

  **Bennett:** And I agree that pre-registration is essential – for transparency, for preventing cherry-picking, for defining the analysis plan. It mitigates researcher degrees of freedom, a core problem in the replication crisis. But let's separate *transparency* and *bias mitigation* from the *fundamental interpretation of evidence*. My core argument remains: for the *specific data in hand*, the reason collection stopped doesn't alter the evidence *contained in that data* about the world. The Bayesian posterior, based *only* on the likelihood and prior, coherently updates beliefs given *what was observed*, irrespective of the counterfactual paths. The frequentist p-value, by definition, *cannot* escape dependence on those unobserved paths.

  **Frost:** And my core counter is that the "evidence" isn't just the data point; it's the data point *in the context of the process that generated it*. A p-value *is* a statement about that process. Reporting an uncorrected p-value after optional stopping misrepresents the process. It sells a false guarantee of error control. Your posterior probability might be coherent *given your model*, but if the model ignores the data-dependent sampling, it might be coherently wrong about the real-world error properties. Science needs methods whose long-run performance we can calibrate and trust.

  **Bennett:** Perhaps the dialectical progress, Freya, is recognizing that our frameworks answer subtly different questions. You ask: "If I use this stopping procedure repeatedly when H0 is true, how often will I be misled?" A vital question for establishing reliable procedures. I ask: "Given *this specific dataset*, how should I update my beliefs about H1 vs H0?" A vital question for interpreting results. Optional stopping is problematic for *both* because it *can* inflate *your* error rates *and* because vague stopping intentions make *my* model specification ambiguous. The shared enemy is *undisclosed flexibility*.

  **Frost:** (Nods slowly) Agreed. Transparency is non-negotiable. And... perhaps the Bayesian response *is* more robust to ambiguous intentions in *interpretation*, as you don't need a precise stopping rule model to form *a* posterior. But for *methodological evaluation* and *establishing trustworthy procedures*, the frequentist concern about uncontrolled error rates remains paramount. We can't abandon that. The solution isn't ignoring stopping rules; it's prohibiting the harmful practice through pre-registration and teaching why fixed rules matter.

  **Bennett:** I can endorse that conclusion wholeheartedly. Pre-registration protects *both* frameworks: it gives you a clear stopping rule for error rate calculation and it gives me clarity on the intended data collection model. It constrains the flexibility that plagues us both. So, while we disagree on the primacy of the Likelihood Principle *given* the data, we agree completely on the need to *control* the process *before* the data. Maybe that’s the common ground for progress? (Raises glass slightly).

  **Frost:** (A faint smile touches her lips) Common ground on pre-registration and the dangers of unconstrained peeking? I'll drink to that. (Clinks her mineral water glass against his wine glass). But don't think I concede on the principle!

  **Bennett:** (Chuckles) Nor I on the centrality of the likelihood. But progress, nonetheless. Progress.

  **(They both sip their drinks, the argument paused but the underlying tension acknowledged, finding practical accord if not philosophical unity.)**

  ## Key Dialectical Progress Points

  1.  **Acknowledging the Core Difference:** They explicitly frame the debate as Frequentism focusing on *long-run procedure properties* (error rates) vs. Bayesianism focusing on *coherent updating for the observed data* (Likelihood Principle).
  2.  **The Ambiguity Challenge:** Bennett successfully forces Frost to confront the practical impossibility of defining *the* correct frequentist correction when stopping intentions are vague. Frost counters that assuming a fixed-n analysis is *still* worse.
  3.  **Shared Problem:** Both identify *undisclosed flexibility* and *researcher degrees of freedom* as the core enemy enabled by unplanned optional stopping, linking it directly to the replication crisis context.
  4.  **Practical Resolution:** They find strong, genuine agreement on **pre-registration** as the solution that addresses *both* of their core concerns:
      *   It provides Frost with the defined stopping rule needed for valid frequentist error rate calculation.
      *   It provides Bennett with clarity on the intended data collection model for coherent Bayesian updating.
      *   It constrains the harmful flexibility that makes optional stopping problematic for *both* frameworks in practice.
  5.  **Agreeing to Disagree (Respectfully):** They explicitly state they haven't resolved the *philosophical* divide (Likelihood Principle vs. Error Rate Control), but they have moved beyond caricature and found significant practical common ground.
