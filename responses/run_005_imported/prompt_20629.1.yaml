prompt: |-
  So I fell down a philosophy rabbit hole last week after a friend doing a phil PhD mentioned this thing called "moral testimony" that I'd never heard of, and it's been living in my head since. The basic setup: we're totally fine trusting an expert's word on stuff we don't understand ourselves — I have zero clue how an MRI actually works but I just believe the radiologist's read — yet apparently a bunch of philosophers think there's something off about doing the same move for *moral* claims. Like if I just adopted "eating factory-farmed meat is wrong" purely because someone I trust said so, without getting why, that's supposedly worse (or at least less fully mine, less creditable to me) than if I'd reasoned my way there myself. I gather there's an actual "optimist vs pessimist" camp split on this, something about moral *worth* requiring you to act for the right reasons rather than just landing on the right answer, plus some analogy to a similar debate about whether you can legitimately believe a painting is beautiful just because a critic told you so. I think it was Alison Hills who's associated with the pessimist side but honestly I might be misremembering who said what.

  This has been extra on my mind because at my job we recently started running product decisions through an LLM as an "ethics sanity check" (flagging stuff like dark-pattern-y features), and I've noticed most of my teammates just go "the model flagged it, so it's bad, let's not ship it" without engaging with the reasoning at all — even when the model *does* spit out reasons. That feels like it's gotta be related to the moral testimony problem, but I can't tell if it's literally the same issue in a new outfit or something subtly different (maybe deferring to a non-person changes things, for better or worse, in a way the original debate never had to consider).

  Could you write me a real essay on this, not a survey — actually lay out and weigh the strongest arguments for pessimism and for optimism about moral testimony (get into the structure of the arguments, not just "some say X, others say Y"), and then actually commit to a verdict on whether deferring to moral testimony can ever give someone genuine moral knowledge (or even moral understanding), rather than hedging into "reasonable people disagree." And as a last part, tell me straight whether that verdict shifts at all once the testifier is an AI system instead of a person, and why.
