  I should also note that "shut up and multiply" works best when numbers are concrete. 3^^^3 is so vast it becomes abstract - human brains can't genuinely comprehend it, which might make scope insensitivity unavoidable rather than correctable. The birds example uses imaginable quantities (2000 vs 200000), so training might work there, but not at hyperastronomical scales.

