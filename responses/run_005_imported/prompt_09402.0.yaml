prompt: |-
  I'm working on a longer piece about the intellectual prehistory of AI alignment, and I keep getting stuck on Yudkowsky's old "coherent extrapolated volition" (CEV) proposal from the early SIAI/MIRI days -- the idea that instead of hand-coding a superintelligence's goals, you'd want it to act on something like what humanity would want if we knew more, thought faster, were more the people we'd want to be, and had somehow grown up together long enough for all our extrapolated wishes to converge into one coherent target. I brought this up with a friend who did a philosophy PhD and she basically rolled her eyes and said its just an informed-desire / full-information theory of well-being with extra steps, then started rattling off Railton and Brandt and even Sidgwick at me. I could kind of see what she meant but I don't know that literature well enough to tell if she's being glib or actually onto something real.

  For the piece I'd rather get this comparison right than just assert "these are basically the same idea" and move on, so could you actually walk me through it properly? Specifically: how does CEV's extrapolation (more knowledge, more coherent reasoning, being "more the people we'd want to be") map onto what something like Railton's ideal advisor or Brandt's "cognitive psychotherapy" are doing when they idealize a person's desires into their real good, and where does that mapping actually break down? Like, what happens to the whole "stay tethered to the person's actual cares so the idealized version isn't just a stranger wearing your name" problem once you're extrapolating and merging the volitions of eight billion people instead of one? Basically: is CEV just the old idealized-preference move imported wholesale into AI safety, or does doing it at that collective, has-to-actually-be-implementable scale turn it into a genuinely different philosophical problem, with different failure modes? I want actual argument here, not a "here are three people who also talked about idealization" survey -- I've already got that part from my friend.
reasoning: |-
  Okay, let me tackle this user's query. They're writing about the intellectual prehistory of AI alignment and are stuck on Yudkowsky's CEV concept. Their philosophy PhD friend dismissed CEV as just a rehash of idealized desire theories like Railton's or Brandt's. The user wants to know if CEV is genuinely different or just those theories applied to AI safety, especially when scaled to collective volition.

  First, I need to recall the key aspects of CEV. It involves extrapolating humanity's volition with more knowledge, better reasoning, and idealized selves, converging into a coherent goal. Then, compare it to Railton's ideal advisor and Brandt's cognitive psychotherapy. Both focus on individual idealization under full information and rationality. 

  The user’s main concern is whether scaling this to eight billion people introduces new philosophical problems. They mentioned the "stranger wearing your name" issue. So, I should explore how individual idealization differs from collective extrapolation. Also, they want concrete arguments, not just name-dropping theorists.

  I should start by mapping the similarities. CEV's components—information, rationality, idealized self—mirror the conditions in Railton and Brandt. But the collective aspect is where it diverges. Individual theories assume convergence of desires after idealization, but for humanity, there's no guarantee. Conflicts might persist even after idealization. 

  Another point is the convergence clause in CEV. Yudkowsky assumes that idealized human desires would harmonize. But philosophers like Rawls or Berlin argue that value pluralism might be fundamental. If so, forcing coherence could distort genuine values. 

  Implementation is another hurdle. For an individual, the ideal advisor is a thought experiment. For CEV, an AI must actually compute this for billions, which involves technical challenges in aggregating preferences and defining identity over time. 

  The "tethering" problem is more severe at scale. With one person, you can anchor to core cares. But with billions, whose core cares matter? Prioritizing certain values might lead to homogenization, losing minority perspectives. 

  Also, the dynamic nature of CEV adds complexity. Humanity evolves, so the extrapolation must adapt, unlike static individual idealizations. This introduces instability in the AI's goal system. 

  So, while CEV borrows from idealized desire theories, scaling it up creates unique challenges: value pluralism, aggregation, implementation, and dynamic coherence. These transform it from a normative model to a tractable problem with new failure modes. The user needs this nuanced comparison to argue that CEV isn't just a rehash but a distinct, more complex proposal.
answer: |-
  You're absolutely right to dig deeper here – your friend's comparison is *superficially* plausible but misses the radical shift in philosophical and practical complexity when moving from individual idealization to humanity-scale collective extrapolation. CEV isn't *just* Railton or Brandt scaled up; it inherits their deepest problems while adding several orders of magnitude of new ones, fundamentally transforming the nature of the challenge. Let's break it down:

  **1. The Core Similarity: The Idealization Move**

  *   **Railton's Ideal Advisor:** For an individual (X), X's good is what X would want *for their actual self* if they were "fully informed and vividly rational." Key: It's anchored to *X's actual constitution* (dispositions, cares) under idealized cognition.
  *   **Brandt's Cognitive Psychotherapy:** For an individual, their "rational desire" is what they *would* desire after exposure to all relevant, non-question-begging information and cognitive therapy eliminating "irrational" cognitive patterns. Again, anchored to the *cleansed* version of *that individual's* psychology.
  *   **CEV's Core Individual Step:** For an *individual* human, "extrapolated volition" is what *that person* would desire if they knew more, thought more rationally/coherently, and were "more the person they wished to be" (internal idealization). **At this individual level, the parallel is strong.** It's firmly in the "full information + procedural rationality + internal idealization" tradition. The "tethering" problem ("stranger wearing your name") is *already present* in Railton/Brandt: How much change under idealization is still *you*? When does it become a different person's desire? (This is the "transformative experience" problem hinted at by philosophers like L.A. Paul).

  **2. Where CEV Radically Diverges: The Collective Convergence & Implementation Nightmare**

  This is where your friend's dismissal becomes glib. Scaling idealization to humanity *and demanding convergence* isn't just "more of the same"; it fundamentally alters the nature of the problem and introduces catastrophic new failure modes:

  *   **a) The Convergence Assumption:**
      *   **Railton/Brandt:** Deal with *one* (idealized) agent. Conflicts within that agent's idealized self might exist but are resolved *by that agent's own idealized reasoning*. There's no assumption that *different* individuals' idealized desires converge. Sidgwick acknowledged "the dualism of practical reason" – fundamental conflicts might persist even ideally.
      *   **CEV:** Requires that after *all* individuals are extrapolated *individually*, their volitions *then* magically converge into a single, coherent "humanity's volition." **This is a massive, unsupported leap.** Yudkowsky *assumes* common ground exists at the ideal limit. But what if idealization reveals *fundamental, irreconcilable value pluralism* (à la Isaiah Berlin)? Does the AI *force* convergence? How? This isn't a "with extra steps" problem; it's a potential *logical impossibility*. If convergence fails, CEV is undefined. This failure mode doesn't exist in individual idealization theories – they can tolerate internal conflicts resolved by the idealized agent *themselves*.

  *   **b) Aggregation Before or After? Whose Idealization Wins?**
      *   **Railton/Brandt:** Deal with one agent. No aggregation needed.
      *   **CEV:** Do you:
          1.  **Aggregate First, Then Idealize?** Take current messy, conflicting human desires, aggregate them somehow (majority vote? weighted by power? some "neutral" procedure?), *then* idealize *that* aggregate entity? This likely amplifies current biases and power structures before any "improvement" happens. The idealized "humanity" might just be an idealized version of the worst of us.
          2.  **Idealize First, Then Aggregate?** Extrapolate *each individual* to their ideal self, *then* try to combine 8 billion (potentially wildly divergent) idealized volitions into one. **How?** What procedure respects all? Simple majority amongst gods? Utilitarian summation? Leximin? Any choice of aggregation function is *itself* a massive, contentious value judgment imposed *externally* by the AI designer, *not* emerging from the idealized individuals. This reintroduces the very value-loading problem CEV was meant to avoid. Whose idealized view of fairness or the good life governs the aggregation? This is a profound meta-ethical problem absent from individual cases.

  *   **c) The "Tethering" Problem at Scale: Whose Core Cares Matter?**
      *   **Railton/Brandt:** The "anchor" is the *individual's* actual psychology, cleansed and informed. The "stranger" problem revolves around the *degree* of change tolerable for identity.
      *   **CEV:** The anchor is 8 billion messy, conflicting actual psychologies. The "extrapolated volition" is supposed to be tethered to humanity's *actual* deep cares. **But:**
          *   **Whose Deep Cares?** Does the idealization process weight all individuals equally? What about historical figures? Future generations? How are "deep cares" identified vs. superficial preferences in a scalable, objective way? The process risks prioritizing easily formalizable or dominant cares, erasing minority or complex values.
          *   **The Homogenization Risk:** The convergence requirement + aggregation creates immense pressure to *homogenize* values. The "coherent" volition might suppress or eliminate minority extrapolated desires that don't fit the dominant convergence pattern. The "stranger" isn't wearing *your* name; it's wearing a name tag forged from a statistical average of idealized beings, potentially alien to vast swathes of *actual* humanity. The "tether" snaps under the strain of forced coherence at scale.

  *   **d) Implementation: Thought Experiment vs. Computational Reality:**
      *   **Railton/Brandt:** Purely normative thought experiments. There's no requirement to *algorithmically compute* the ideal advisor's output for a real person, let alone 8 billion.
      *   **CEV:** **Requires implementation.** An AGI *must* somehow compute this. This forces concrete, tractable answers to the intractable philosophical problems above:
          *   What *exactly* constitutes "more knowledge"? All physics? All subjective experiences? How is relevance determined?
          *   What *algorithm* defines "more coherent reasoning"? Logical omniscience? A specific decision theory?
          *   What *procedure* defines "more the people we wished to be"? How are contradictory self-ideals resolved?
          *   What *mathematical function* aggregates 8 billion divergent idealized preference orderings into one coherent ordering? How are intensities handled?
          *   How is *identity* tracked through radical idealization? When does "Person A idealized" cease to be meaningfully "Person A" for the purpose of tethering?
      *   **Failure Modes Galore:** Any practical implementation will involve approximations, shortcuts, and unavoidable design choices. Each choice point is a potential catastrophic misalignment:
          *   Misidentifying "deep cares" (e.g., prioritizing stated preferences over revealed ones, or vice versa).
          *   Biased idealization processes (e.g., favoring certain cognitive styles or values implicit in the idealization algorithm).
          *   Aggregation functions that systematically favor certain groups or values.
          *   The convergence process smoothing over vital, irreconcilable conflicts in a way that destroys meaning for large segments.

  **Conclusion: It's a Different Beast Altogether**

  Your friend is correct that CEV's *individual idealization step* is philosophically indebted to Railton, Brandt, and the ideal preference tradition. **However, CEV is not merely that idea "with extra steps."** The imperative to *collectivize* and *force coherence* upon 8 billion individually idealized volitions, *and then actually implement this computationally* as the goal system for a superintelligence, transforms it into a qualitatively different and vastly more dangerous problem.

  *   **Individual Idealization (Railton/Brandt):** A normative framework for thinking about an *individual's* good. Intractable philosophical problems (tethering, transformative change), but no requirement for convergence, aggregation, or practical implementation. Failure mode: Misidentifying an individual's good.
  *   **CEV:** A proposed *implementable* goal system for a superintelligence tasked with determining *humanity's* good. Inherits all individual idealization problems, **plus** the potentially impossible demand for collective convergence, the intractable aggregation problem, the severe scaling of the tethering problem, and the minefield of practical implementation choices. **Failure modes:** Undefined goals (non-convergence), goal systems that encode catastrophic aggregation biases or destroy human meaning through forced coherence, or implementation choices that lead directly to existential catastrophe by misinterpreting the entire messy project.

  **CEV takes an old philosophical puzzle and places it at the heart of a planet-sized engineering problem for an entity more powerful than humanity. That doesn't just add steps; it creates a new ontological category of risk.** Your piece should emphasize this radical shift: CEV wasn't just importing philosophy; it was attempting an alchemical transformation of normative ethics into a scalable AI goal system, inheriting ancient problems while birthing terrifying new ones unique to the domain of superintelligence. The "prehistory" connection is real, but the *stakes* and *complexity* introduced by the collective, convergent, implementable nature of CEV make it a fundamentally different, and arguably far more perilous, endeavor.
