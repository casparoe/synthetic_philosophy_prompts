  The strongest counterargument is compelling: inaction doesn't "set death in motion" like a direct act. It feels different. But policy isn't metaphysics—it's practical. If we only blame acts, omissions get a free pass even with duty. That's dangerous in healthcare. 

  For the principle: focus on foreseeable duty-bound omissions where timely action would likely change outcomes. Avoid vague "should've known" standards. Here, protocol made the duty concrete, and the outcome was medically probable. 

