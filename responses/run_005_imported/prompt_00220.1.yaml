prompt: |-
  I've been reading about intuitionistic logic and constructivist mathematics on my own, and one thing keeps tripping me up. If intuitionists reject the law of excluded middle, doesn't that mean they're committed to some statements being neither true nor false — as if there's a genuine third truth-value floating between the two? That seems to sit awkwardly with the idea that constructivists still want every mathematical claim to have a definite, objective status once it's properly understood. Am I misunderstanding what rejecting excluded middle actually commits you to?
