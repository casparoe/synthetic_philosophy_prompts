answer: |-
  Here are 9 interview questions designed to push past the standard coherence argument pitch, targeting your key objections with strategic follow-ups. They're structured to force nuance and avoid rehearsed answers, while remaining podcast-accessible.

  **Core Theme Questions:**

  1.  **The Gerrymandered Utility Function Objection:**
      *   **Question:** "You argue that coherent agents act *as if* maximizing a utility function. But critics note we can *always* construct *some* utility function post-hoc to 'explain' *any* observed behavior – even chaotic, self-contradictory, or obviously irrational behavior – by making the utility function path-dependent, state-dependent, or wildly context-sensitive. Doesn't this render the 'as if' claim vacuous? If *any* behavior is coherent *under some description*, what substantive constraint does coherence actually provide?"
      *   *Likely Rehearsed Response:* "Ah, but the key is exploitability! A Dutch book *proves* the behavior is inconsistent in a way that loses value *by the agent's own lights* under some pressure."
      *   **Sharp Follow-Up:** "But doesn't that just shift the burden? The 'agent's own lights' are defined *by* the gerrymandered utility function constructed to avoid the exploit *after* it's pointed out! If the *only* criterion for a 'valid' utility function is that it retrospectively rationalizes the agent's choices *and* avoids *known* Dutch books, haven't we just defined a moving target that guarantees coherence is always achievable in theory, but provides zero predictive power about what preferences we'll *actually* observe?"

  2.  **The Completeness Axiom & Resolute Choice:**
      *   **Question:** "The completeness axiom – requiring a defined preference between *any* two options – is often seen as the most psychologically and normatively unrealistic part of the axioms. Proponents argue incompleteness inevitably leads to money pumps. But defenders of 'resolute choice' (like McClennen) argue an agent can recognize a potential pump *in advance* and simply *commit* to a plan (e.g., stick with A, never trade to B and back), avoiding the pump *without* needing complete preferences. Why is this resolute approach insufficient or irrational within the coherence framework?"
      *   *Likely Rehearsed Response:* "Resolute choice relies on pre-commitment, but when the actual choice point arrives (e.g., offer to trade A for B), the agent *lacks* a reason based on preference (since A and B are incomparable) to *stick* to the plan over taking the seemingly beneficial trade. The pump exploits that moment of indecision or lack of positive reason to refuse."
      *   **Sharp Follow-Up:** "Isn't this framing question-begging? You're *assuming* the agent *must* evaluate the trade *myopically* at that single node, using only preferences defined over immediate outcomes. But isn't the *whole point* of resoluteness that the agent rationally values *adherence to a good plan* itself? Why is evaluating 'Stick to Plan' vs. 'Deviate for B' at that node *not* a valid, broader preference that resolves the apparent incompleteness at the outcome level? Isn't denying this just insisting on a myopic view of preference?"

  3.  **Scope: Individual Rationality vs. Population Selection:**
      *   **Question:** "Is the coherence argument primarily a claim about *individual rationality* – that any *single* agent *should* conform to the axioms to avoid guaranteed loss? Or is it fundamentally a claim about *selection pressure* – that agents or algorithms violating the axioms will be *weeded out* (by markets, evolution, adversarial testing, or training processes like RLHF), leaving only those acting *as if* coherent? This distinction seems crucial for applying it to AI."
      *   *Likely Rehearsed Response:* "It's both! For an individual, it's a normative requirement to avoid sure loss. But crucially, in competitive or optimizing environments, violating coherence *is* a fatal flaw that *will* be selected against. That's why we expect surviving/powerful AIs to be coherent."
      *   **Sharp Follow-Up:** "Let's focus on the selection claim. Couldn't an environment select for agents that are *locally* effective or *robust* in specific ways, but still harbor *global* incoherence that simply isn't exploited *in that specific niche* or *during the training process*? For instance, an AI might have incomplete preferences over vastly different long-term outcomes but excel at short-term tasks, never encountering a pump. Doesn't the 'guarantee' of selection *depend entirely* on the *specifics* of the selection pressures and exploit opportunities present?"

  **Deepening the Challenge Questions:**

  4.  **The Fragility of "As If":**
      *   **Question:** "If we accept the 'as if' maximization claim, doesn't it become incredibly fragile? Minor perturbations in the environment, new options introduced, or interactions with other agents could suddenly reveal inconsistencies *that weren't apparent before*, forcing a drastic shift in the *apparent* utility function to maintain coherence. Does this volatility undermine the idea that coherence reveals a stable, underlying goal structure we can reliably identify *before* seeing the agent tested in all possible scenarios?"
      *   *(Potential Follow-Up Target: If they downplay volatility, ask: "But isn't this exactly what happens in adversarial testing? We find 'edge cases' that break the model's apparent goal. Doesn't coherence theory predict this instability is *inevitable* for any non-trivial agent in a complex world?")*

  5.  **Beyond Money: What is "Value"?**
      *   **Question:** "Dutch books and money pumps traditionally use monetary payoffs. But for advanced AI, or even humans, 'value' is multi-dimensional, non-fungible, and often involves incommensurable goods (e.g., liberty vs. security, artistic merit vs. profit). How does the coherence argument handle cases where the 'currency' used for the pump isn't the *actual* currency of the agent's utility function? Can you truly pump an agent if the stakes offered don't tap into its core values?"
      *   *(Potential Follow-Up Target: If they say the exploit must use the agent's values, ask: "Doesn't this require the exploiter to have near-perfect knowledge of the agent's *true* utility function to construct the pump? How does that square with the argument being used to *infer* the utility function?")*

  6.  **Coherence as a Byproduct, Not a Driver:**
      *   **Question:** "Could coherence be an *epiphenomenon*? Imagine an AI optimized purely for predictive accuracy on a vast dataset. Its behavior might *look* coherent 'as if' it had a utility function over states of the world, purely because the predictions lead to instrumentally useful actions for gathering data. But there's no *underlying goal* being maximized beyond prediction. Doesn't this show coherence can emerge from optimization pressures that have nothing to do with goal-directedness in the Omohundro sense?"
      *   *(Potential Follow-Up Target: If they argue prediction *is* a goal, ask: "But is it a goal that necessarily implies seeking power? Or could a super-predictor be perfectly content observing passively if that yields the best data?")*

  7.  **The Burden of Proof on Selection:**
      *   **Question:** "On the selection pressure argument: Can you point to concrete empirical evidence – in evolution, economics, or *current* AI training – where populations of agents/strategies *known* to violate coherence axioms were demonstrably outcompeted or eliminated *specifically because* of their incoherence leading to exploitation, *rather than* other factors like inefficiency or poor fit to a simpler reward metric? Isn't the claim that coherence *will* be selected for in future AI more of an assumption than a proven result?"
      *   *(Potential Follow-Up Target: If they cite markets or evolution, ask: "But aren't real markets full of 'irrational' agents who survive, and evolution produces countless 'satisficing' or ecologically specialized agents with incomplete preferences? Doesn't selection often favor 'good enough and robust' over 'perfectly coherent but fragile'?")*

  8.  **Alternative Foundations for Robustness:**
      *   **Question:** "Why assume coherence is the *only* path to robustness against exploitation? Couldn't an agent employ heuristics, satisficing rules, robust satisficing, domain restriction ("I don't make decisions about X"), or even randomness in a way that makes it *practically* unexploitable *without* satisfying the full expected utility axioms, particularly completeness and continuity?"
      *   *(Potential Follow-Up Target: If they argue these lead to incoherence, ask: "But if the agent is *effectively unexploitable in its operating environment*, does the *theoretical possibility* of a pump in a contrived scenario *matter*? Isn't practical robustness the real desideratum, and coherence just one potential – and perhaps overly restrictive – means to achieve it?")*

  9.  **The Telos of Intelligence:**
      *   **Question:** "Ultimately, does the coherence argument rest on a specific, contestable view of what intelligence *is*? It seems to equate intelligence with coherent goal pursuit under uncertainty. But could there be forms of powerful, general intelligence that are more about dynamic adaptation, relationship-building, open-ended exploration, or system stabilization – where fixed utility functions and coherence are not just absent, but potentially counter-productive to its 'purpose'?"

  **Key for the Interview:**

  *   **Listen Actively:** Pay close attention to *how* they answer. Do they engage with the specific objection or retreat to generalities? Your follow-ups depend on their precise wording.
  *   **Control the Frame:** Don't let them reframe your sharp question into their standard pitch. Gently but firmly bring it back: "That's interesting, but to focus on my specific point about gerrymandering/selection/resoluteness..."
  *   **Clarify Distinctions:** Force clarity on Individual vs. Population, Normative vs. Descriptive, Theoretical Possibility vs. Practical Likelihood.
  *   **Embrace Nuance:** The goal isn't necessarily to "win" but to expose the *limits* and *assumptions* of the strong coherence claim. A good guest will acknowledge some of these, making for a richer discussion.

  These questions should prevent a simple restatement of the standard argument and push the discussion into the substantive philosophical and practical controversies surrounding coherence, utility, and the nature of agency in AI. Good luck with the podcast!
