prompt: |-
  Okay so I got into a whole argument with a friend of mine over dinner last night about whether "coherence arguments" actually prove anything, and neither of us really budged. His case was basically: if your preferences or credences don't line up with the expected utility axioms, someone can always build a Dutch-book or a money-pump against you that bleeds you dry, so anything that sticks around / gets optimized hard enough will end up acting AS IF its maximizing some expected utility function -- and that's supposedly why we should expect advanced AI to look power-seeking and goal-directed even before we know what its actual goal is. I kept saying that's kind of a cheat, because you can always retroactively invent some gerrymandered utility function that makes literally any sequence of choices count as "coherent," so the argument either says something substantive (and is way more fragile than he's letting on) or it's basically unfalsifiable. We also went around in circles on the completeness axiom specifically -- he kept insisting incomplete preferences just get money-pumped away eventually, and I vaguely remembered there's a whole "resolute choice" style reply to that but couldn't reconstruct it properly at midnight.

  Anyway, I run a small philosophy podcast and in a couple weeks I've got someone booked who's built a real reputation defending the strong version of this argument -- think squarely in the Omohundro/Yudkowsky lineage here, though for our purposes let's just keep him unnamed and invented. I don't want the episode to be him just restating the pitch he's given a hundred times. Can you draft me 8-10 interview questions that push past that? I want at least one question that goes right at the "you can rationalize any behavior after the fact with a weird enough utility function" objection, one that presses specifically on why the completeness axiom takes so much heat and whether resolute-choice or sophisticated-choice replies actually let an agent keep incomplete preferences without getting pumped, and one on whether this is really a claim about individual rational agents or more a claim about selection pressure over populations / training runs over time -- and for each of those, add a quick follow-up keyed to whatever answer he's most likely to give, the kind of thing you'd need ready for a live recording when a guest reaches for the rehearsed response.
