  First, I need to recall the core of no-trade theorems like Milgrom-Stokey. The key points are common prior, rationality, and common knowledge of willingness to trade. The theorem shows that under these conditions, no trade should happen because the offer itself reveals information that makes the bet undesirable for one party. 

  But the user is right that prediction markets do see trading. So where's the disconnect? I should think about the assumptions. The common prior is a big one. In reality, people might not have identical priors. Also, common knowledge is strict—everyone knowing that everyone knows, ad infinitum. That's rare in practice. 

  Liquidity and noise traders are another angle. Prediction markets have participants trading for non-informational reasons, like hedging or just needing liquidity. That allows informed traders to profit without the no-trade condition kicking in immediately. 

  The user mentioned building a bot for Manifold/Polymarket-style markets. They might be trying to apply the theorem directly to their bot's strategy. They need to know if their bot can exploit information without being foiled by the theorem. So the practical aspects matter more than theoretical purity here. 

