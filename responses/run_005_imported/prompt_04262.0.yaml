  First, I need to recall the basics of Humean Supervenience (HS). HS claims that everything about the world supervenes on the mosaic of local matters of particular fact. The best-system account (BSA) of chance defines chances as patterns within this mosaic. The Principal Principle (PP) connects credence to objective chances. The problem arises with undermining futures—possible futures that, if actual, would make the current chance theory false.

  The user's confusion seems to be why undermining futures create a contradiction rather than just a weird edge case. They also question why making chance-facts inadmissible doesn't resolve it. Let me break down the contradiction step by step. Consider a scenario where the current chance theory T assigns a high chance to a future F, but F includes events that would undermine T. If an agent knows T, PP requires their credence in F to be high. But if F occurs, T is false, leading to a contradiction in rational beliefs. The inadmissibility move fails because, for Humeans, chance-facts aren't independent of the mosaic; they're part of the evidence.

  Next, the New Principle (NP) conditions on the entire chance theory. So instead of just conditioning on the chance of F, NP conditions on T itself. This seems to resolve the contradiction by ensuring that credence in F accounts for the possibility that T might be undermined. But the user is concerned that this just shifts the problem to the chance of T itself. However, NP avoids this because the chance of T is either 1 or 0, making it non-probabilistic. Thus, conditioning on T directly sidesteps the undermining issue.

  I should also address whether the Big Bad Bug is truly resolved. Lewis and others think NP handles it, but there might be lingering concerns about the nature of admissibility or the applicability of NP. The user might need to present these nuances to their reading group, highlighting both the solution and potential criticisms.

  The user's deeper needs include confidently explaining complex metaphysical concepts outside their specialty, facilitating group discussion, and addressing possible objections. They need a clear, intuitive explanation without hand-waving. Emphasizing the structural shift from PP to NP and why inadmissibility doesn't work for Humeans is key. Also, acknowledging that while NP resolves the contradiction, debates about admissibility or Humean metaphysics might persist.
answer: |-
  You've hit on one of the most fascinating and technically demanding issues in contemporary metaphysics! As an ethics specialist diving into Lewisian chance, your grasp is already solid – the core problem *is* why undermining futures create a **genuine contradiction** for Humeans under the Principal Principle (PP), and why "inadmissibility" isn't an easy escape. Lewis's New Principle (NP) is the fix, but its status is debated. Let's break it down step-by-step for your group presentation:

  **1. The Setup: Humean Supervenience (HS) & Best System Analysis (BSA)**
      *   **HS:** Everything supervenes on the spatiotemporal mosaic of local particular facts (point qualities).
      *   **BSA of Chance:** The objective chance *P*(A) = *x* is not a primitive "occurrent" fact in the mosaic. It's a *theoretical posit* of the *best systematization* (balancing simplicity, strength, fit) of the entire mosaic (past, present, *and future*).
      *   **Key Consequence:** What the chances *are* depends on what the entire history of the world *is*, including the future. The chance theory *T* is a *consequence* of the whole mosaic *H*.

  **2. The Undermining Future (UF) & the Contradiction**
      *   **What is a UF?** A possible future event *F* such that:
          *   According to the *true* chance theory *T* (based on the *actual* whole mosaic *H*), *P(F)* is high (say, > 0.5).
          *   BUT, *if F were to occur*, the resulting whole mosaic *H'* (which includes *F*) would be such that the best systematization of *H'* is a *different* theory *T'*, and according to *T'*, *P(F)* was actually *low* (or even zero). *F* "undermines" *T*.
      *   **Classic Example:** Imagine *T* says the chance of heads on any fair coin toss is 0.5. A UF *F* could be a future containing a *vastly improbable* (but still possible) long run of tails in the *actual* world's coin tosses. *If F occurs*, the actual mosaic *H'* (including the long tails run) is best systematized by a theory *T'* that says the coins were *biased* towards tails (giving a low chance to the specific pattern *F* occurring). *F* makes *T* false.
      *   **The Contradiction under PP:** Suppose you are a rational agent *at time t*, and you know the following:
          *   The Humean chance theory *T* is true (*now*).
          *   *T* assigns a high chance *P(F) = x* (say, 0.8) to future event *F*.
      *   **Apply PP:** PP says your credence in *F*, conditional on *P(F) = x* (and no inadmissible evidence), should be *x*: **Cr(F | P(F)=x) = x**.
      *   **The Problem:** *F* is an undermining future! *If F occurs, T is false*. Knowing *T* is true *now* logically implies that *F does not occur* (because if *F* occurred, *T* wouldn't be true). Therefore: **Cr(F | T is true) = 0**.
      *   **The Contradiction:** PP demands **Cr(F | P(F)=0.8 & T) = 0.8**. But the logical implication demands **Cr(F | T) = 0**. Since knowing *T* entails knowing *P(F)=0.8* (because *T* specifies the chances), we have:
          *   Cr(F | T) must be 0.8 (from PP + T specifies P(F)=0.8)
          *   Cr(F | T) must be 0 (from logic: T entails ~F)
          *   **0.8 = 0? Contradiction!**

  **3. Why "Just Rule Chance-Facts Inadmissible" FAILS for Humeans**
      *   **The Tempting Move:** "Aha! PP says 'absent inadmissible evidence'. Knowing *T* (a fact about chance) *is* inadmissible evidence! So PP doesn't apply when you know *T*. Problem solved?"
      *   **Why it Fails (The Heart of the Bug):** For the *Humean*, **facts about chance are NOT a special, inaccessible type of evidence**. They are *nothing over and above* the total mosaic *H*! Knowing *T* is *equivalent* to knowing a *huge, complex fact about the pattern in the entire spatiotemporal history*, past and future.
      *   **The Dilemma:**
          1.  **If** chance facts are *inadmissible*, then PP becomes almost useless for Humeans. You could *never* legitimately condition on the exact chance value *P(A)=x* itself, because knowing *that* requires knowing *T*, which is inadmissible. PP could only be used with *less* than full knowledge of the chances (e.g., knowing P(A)=x is *between* y and z). This guts the principle.
          2.  **If** chance facts are *admissible* (because they are just facts about the mosaic), then the contradiction above stands. PP + Logic + BSA/HS leads to inconsistent credences.
      *   **The Core Issue:** BSA makes chance facts *descriptive summaries* of the entire history. PP treats chance facts as *prescriptive guides* that should constrain rational belief independently of future outcomes. The undermining future exposes the tension between these two roles *within the Humean framework*.

  **4. Lewis's Fix: The New Principle (NP)**
      *   **The Formulation:** NP says your credence in proposition *A*, conditional on the *entire chance theory T* being true and on any *admissible* evidence *E*, should equal the chance *T* assigns to *A*, *conditional on T itself being true*:
          **Cr(A | T & E) = P(A | T)**
          (Where *P* is the chance function given by *T*).
      *   **The Intuition:** Instead of conditioning *only* on the specific chance *P(A)=x*, NP conditions on the *whole theory T*. Crucially, it tells you to use the chance *T* assigns to *A* *given that T is true*. This builds the requirement that *T* survives into the chance value you use for guidance.
      *   **How it Resolves the Contradiction (Using the UF Example):**
          *   You know *T*.
          *   NP says: **Cr(F | T) = P(F | T)** (assuming no other relevant admissible evidence).
          *   What is *P(F | T)*? *T* says *P(F) = 0.8*. But *P(F | T)* is different! *T* knows that *if F occurs, T is false*. So, according to *T*, the chance of *F* *given that T is true* must be equal to the chance of *F* *and T being true*. Since *F* entails *~T* (F undermines T), *F & T* is impossible. Therefore:
              **P(F | T) = P(F & T) / P(T) = 0 / P(T) = 0**.
          *   NP therefore dictates: **Cr(F | T) = 0**.
          *   **Result:** NP yields **Cr(F | T) = 0**, which *matches* the logical implication that knowing *T* true means *F* cannot happen. **Contradiction resolved!**

  **5. Does the "Big Bad Bug" Stay Dead? Your Candid Assessment**
  Lewis declared the Bug debugged. Many agree NP is the right Humean fix. **However, significant debates and concerns persist:**

  *   **Relocation or Resolution?** You asked if NP just relocates the problem to the chance of *T* itself. This is insightful! NP relies on *P(T)* and *P(F | T)*. *P(T)* is problematic: What is the chance *T* assigns to *T* being true? *T* assumes it *is* true! If *T* is true, *P(T) = 1*. If *T* is false, *P(T)* is undefined (or defined by the true theory). Crucially, **NP doesn't require conditioning on *P(T)=y*; it conditions directly on *T*.** Within the scope of supposing *T*, we calculate *P(F | T)* using *T*'s own rules, leading to 0 in undermining cases. The problematic self-reference is *managed* computationally within *T*. Most agree this avoids relocation.
  *   **The "Ad Hoc" Charge:** Is NP a principled generalization of PP, or just an *ad hoc* fix for undermining? Critics argue the latter. Lewis argued NP captures the true core idea: let chances guide you *given the theory generating them holds*.
  *   **Admissibility Lingers:** NP still relies on "admissible evidence." Defining admissibility remains complex and potentially problematic, though the contradiction is avoided.
  *   **Metaphysical Unease:** Does NP reveal a deep flaw in *Humeanism* itself? Some argue that chances capable of undermining their own theory expose the inadequacy of reducing modality to patterns in the actual mosaic. NP fixes the math but leaves a metaphysical tension.
  *   **Complexity & Applicability:** NP is computationally harder than PP. Is it usable by real agents? Lewis prioritized consistency for ideal agents.

  **Presentation Strategy for Your Group:**

  1.  **Start Concrete:** Use the long coin-toss run example. Make the UF vivid.
  2.  **Build the Contradiction Slowly:** Explicitly show the two lines of reasoning (PP demand vs. logical demand) leading to 0.8 and 0 *under the same supposition (T is known)*.
  3.  **Hammer the Inadmissibility Point:** Emphasize *why* it fails for Humeans – chance facts *are* mosaic facts. Contrast with non-Humean views where chance facts *are* primitively inadmissible.
  4.  **Present NP Clearly:** Write it alongside PP. Explain *P(A | T)* as "the chance of A, according to T, on the assumption that T is true." Show the *P(F | T) = 0* calculation.
  5.  **Acknowledge the Debate:** Present Lewis's victory claim but flag the key criticisms (ad hocness, metaphysical unease, admissibility). Ask the group: Does NP feel like a natural extension of chance guidance, or a patch? Does it salvage Humean chance satisfactorily?
  6.  **Connect to Humeanism:** Stress that the Bug arises *specifically* because of the BSA within HS – chances aren't fundamental. The fix must work within that constraint. NP attempts to make chance guidance consistent with chance being descriptively defined by the whole world.

  **Candid Conclusion:** Lewis's New Principle **does resolve the specific logical contradiction** generated by undermining futures within the Humean BSA framework. It provides consistent guidance by having rational credence track *T*'s conditional chance *P(A | T)*. Whether this truly "puts the Big Bad Bug to rest" depends on whether you find NP sufficiently motivated and whether you accept the metaphysical picture of chance it presupposes. It solves the technical inconsistency, but the debate continues about the philosophical cost and coherence of Humean chance even *with* NP. For your group, focus on clearly exposing the contradiction and how NP's conditionalization structurally avoids it – that's the essential insight. Good luck!
