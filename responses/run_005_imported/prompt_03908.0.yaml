answer: |-
  You've identified a profound and genuine inconsistency in Lewis's framework—one that goes beyond mere presentational issues. The tension arises from the incompatible demands placed on dispositional individuation by RCA + IDT versus the "getting specific" strategy for masking. Let's break down why this is a damaging inconsistency and which commitment a Lewisian should abandon.

  ### The Core Inconsistency: Individuation and Extrinsic Dependence
  1.  **IDT's Core Commitment:** IDT mandates that dispositions *supervene strictly* on intrinsic properties plus laws. For any intrinsic duplicate *x* in any world with the same laws, *x* must have the very same dispositions as its duplicate. Dispositions cannot vary based on extrinsic circumstances. This is non-negotiable for Lewis, as it blocks the Choi/Gundersen extrinsic-fix maneuver against RCA in fink cases. The disposition (e.g., "live") must be fixed by the intrinsic base *B* (free electrons).

  2.  **The "Getting Specific" Strategy for Masking:** To handle masking (e.g., the packed glass), Lewis re-individuates the disposition. The packed glass isn't disposed to *break-when-struck-simpliciter*; it's disposed to *break-when-struck-in-the-absence-of-packing*. Crucially:
      *   The intrinsic duplicate (the unpacked glass) *is* disposed to break-when-struck-simpliciter.
      *   Therefore, the packed glass and its unpacked duplicate *do not share all the same dispositions*. The packed glass has a disposition conditional on the *absence* of an extrinsic masking factor (the packing), while the unpacked glass has a disposition *without* that conditional.

  3.  **The Contradiction:** The "getting specific" move makes the *identity* or *individuation condition* of a simple disposition (like fragility) **extrinsically sensitive**. Whether an object has the disposition *D: break-when-struck-simpliciter* depends on the *extrinsic presence or absence of a mask* (the packing). This directly violates IDT:
      *   **Scenario 1 (Unpacked Duplicate):** Intrinsic property base *B*₁ → Disposition *D*₁: break-when-struck-simpliciter.
      *   **Scenario 2 (Packed Original):** Same intrinsic base *B*₁ → Disposition *D*₂: break-when-struck-in-the-absence-of-packing.
      *   *D*₁ ≠ *D*₂. Yet the objects share intrinsic base *B*₁ and laws. IDT demands *D*₁ = *D*₂. Contradiction.

  4.  **Why it's Damaging:** This isn't a minor wrinkle; it strikes at the heart of Lewis's motivation for IDT.
      *   **Hypocrisy Charge:** Lewis invokes IDT *specifically* to *prevent* extrinsic factors (like the presence of a fink) from determining whether an object has a simple disposition like "live" or "dead." Yet, when faced with masking, he *explicitly allows* an extrinsic factor (the *absence* of packing) to be baked into the disposition's individuation condition. The strategy used to *defeat* extrinsic-fix in finks *is* extrinsic-fix in masks.
      *   **Supervenience Failure:** IDT requires dispositional properties to supervene on intrinsic properties + laws. "Getting specific" makes dispositional properties supervene on intrinsic properties *plus the absence of certain extrinsic masking conditions*. This breaks supervenience.
      *   **Undermines RCA's Defense:** RCA's defense against finks *relies* on IDT to block the extrinsic "it's live because it's wired to a fink" move. If IDT is violated for masks, the justification for insisting on it for finks evaporates. Why is extrinsic dependence unacceptable for finks but essential for masks?

  ### Which Commitment Should a Lewisian Jettison?
  A Lewisian should abandon the **"Getting Specific" Strategy for Masking**. Here's why, comparing the options:

  1.  **Abandon RCA:** RCA is Lewis's core, positive account of dispositions, designed to handle finks (the original problem for SCA) while preserving a broadly Humean, categorical basis framework. Abandoning RCA leaves the Lewisian without a viable analysis of dispositions that handles finks, regressing to the refuted SCA or requiring a radically different approach. This sacrifices too much of the core theory.
  2.  **Abandon IDT:** IDT is the lynchpin holding RCA together against the Choi/Gundersen extrinsic-fix objection. Without IDT, there's no barrier to saying the reverse-finked wire is simply "live" *because* of the extrinsic fink device that would activate it. This concedes the victory to the extrinsic-fix view Lewis sought to defeat. RCA loses its primary motivation and advantage over simpler extrinsic accounts. IDT is essential for Lewis's *reasons* for proposing RCA.
  3.  **Abandon "Getting Specific" for Masks:** This is the least damaging and most consistent option:
      *   **Preserves Core Motivation:** RCA + IDT remains intact to handle finks and block extrinsic-fix.
      *   **Forces a Better Solution for Masks:** It compels the Lewisian to find a solution *within* the RCA + IDT framework. Possible avenues:
          *   **Refine the Causal Basis:** Argue that the mask *interferes* with the causal process *after* the intrinsic basis *B* is present and retained, but *before* manifestation *M* occurs. RCA only requires that *B* and *C* would cause *M* if *B* persists. The mask breaks the causal chain *despite* *B* and *C* being present and *B* persisting. The glass *has* basis *B* (fragile molecular structure), is struck (*C*), retains *B*, but the packing prevents *B* and *C* from jointly causing breaking (*M*). This preserves the disposition (it *has* *B*) while explaining the lack of manifestation. (This faces challenges with "perfect" masks, but is a starting point).
          *   **Distinguish Disposition from Manifestation:** Emphasize that dispositions *can* be masked – the object *has* the intrinsic disposition (fixed by *B* and IDT), but the manifestation is prevented by extrinsic interference. This avoids re-individuating the disposition itself.
      *   **Acknowledges Cost:** It accepts that RCA + IDT might entail that masked objects *do* possess the simple disposition (e.g., the packed glass *is* fragile), even though the manifestation is reliably blocked. This might seem counterintuitive, but it's a price paid for theoretical consistency regarding intrinsicality, mirroring the cost paid in the fink case (the dead reverse-finked wire *is* live). Consistency requires biting *some* bullet; the masking bullet is less damaging to the core motivations than abandoning IDT or RCA.

  **Conclusion:** Your intuition is correct. Lewis's "getting specific" strategy for masking fundamentally violates the Intrinsic Dispositions Thesis (IDT), which is essential for his Reformed Conditional Analysis (RCA) to block extrinsic-fix responses to fink cases. This is a genuine inconsistency, not a presentational quirk. To restore coherence within a Lewisian framework, the "getting specific" maneuver must be abandoned. The Lewisian should instead seek a solution to masking that respects IDT—perhaps by refining the causal story within RCA or accepting that masked objects retain their simple dispositions despite blocked manifestations—even if this requires accepting some counterintuitive results. Sacrificing IDT or RCA undermines the entire edifice; sacrificing the convenient but inconsistent masking fix preserves the core motivations and forces a more principled (if potentially harder) solution.
