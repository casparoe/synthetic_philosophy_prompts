answer: |-
  You've articulated a profound and genuinely philosophical problem—one that resonates deeply with thinkers across centuries. What you're describing isn't just burnout; it's an existential tension between **instrumental rationality** (doing things *for* an outcome) and **intrinsic value** (doing things *for their own sake*). This is a structural issue in modern life, especially in achievement-oriented environments. Let's break it down:

  ### The Philosophical Problem: The "Instrumentalization Trap"
  1. **Aristotle's "Final Ends" vs. "Instrumental Means"**:
     - Aristotle distinguished between activities that are *means* (e.g., studying to get a job) and *ends in themselves* (e.g., friendship, contemplation). A good life requires both, but when everything becomes a means, life loses meaning. Your internship → better internship → ? is a classic "infinite regress" of means with no clear end. Aristotle would ask: **What is this all *for*?** If there's no "final end" (e.g., flourishing, happiness), the chain feels hollow.

  2. **Hedonic Treadmill & Capitalist Productivity**:
     - Modern culture (especially in competitive academic/professional spaces) rewards constant optimization. You’re on a treadmill where achieving one goal just resets the next target. The satisfaction is fleeting because **the system is designed to keep you striving**, not satisfied. Your guitar practice becoming "homework" exemplifies how even leisure gets co-opted by productivity logic.

  3. **Existentialism & Authenticity**:
     - Sartre or Camus might say you’re living in "bad faith": adopting external values (resume-building, comparison) instead of defining your own. When your roommate asked when you last did something "just because," they pointed to **authenticity**—actions flowing from *your* desires, not external expectations.

  4. **Heidegger's "Being-toward-Death"**:
     - Heidegger argued we often live as "Das Man" (the "They-self"), absorbed in societal norms (e.g., "optimize your resume!"). Your realization hints at awakening to your own finite existence—questioning whether this path reflects *your* values before time runs out.

  ---

  ### Why "Just Add Hobbies" Fails (As You Saw)
  Hobbies *can* be restorative, but in your current mindset, they’re vulnerable to instrumentalization because:
  - **Metric Culture**: Apps/gamification turn play into performance (e.g., practice streaks).
  - **Internalized Capitalism**: Even leisure becomes a "self-improvement project."
  - **Identity as Achievement**: If your self-worth is tied to outputs, *everything* becomes a vehicle for validation.

  ---

  ### What "Fixing It" Might Look Like: A Philosophical Toolkit
  This isn’t about quick fixes but shifting your relationship to action and value. Start small:

  1. **Cultivate "Useless" Activities**:
     - Do things with **no measurable outcome, no audience, no future purpose**. Examples:
       - Walk without tracking steps or posting photos.
       - Doodle without sharing it.
       - Cook a meal just to savor it, not to Instagram it.
     - **Goal**: Relearn how to engage without an external "why."

  2. **Practice Presence (Mindfulness ≠ Productivity)**:
     - When playing guitar, focus *only* on the sound of the strings, the feel of the wood. When your brain says "faster progress = better," gently return to sensation. This builds tolerance for being without a goal.

  3. **Interrogate Your "Why"**:
     - For each "instrumental" activity (e.g., club leadership), ask:
       - *"Does this align with my deeper values, or am I doing it because I 'should'?"*
       - *"What would happen if I stopped?"*
     - Keep what survives this test; discard or minimize what doesn’t.

  4. **Embrace "Being" Over "Doing"**:
     - Schedule time to simply *exist*: stare out a window, lie in grass, listen to music without multitasking. This isn’t "relaxing to recharge"—it’s practicing non-utility.

  5. **Reframe Goals as Journeys**:
     - Instead of "I need this internship for the next one," try: *"This internship is where I am *right now*. I’ll engage with it as its own experience, not just a stepping stone."* 

  6. **Philosophical Anchors**:
     - **Stoicism**: Focus on what you control (your effort, not outcomes). Your internship is a chance to practice integrity, not just a line on a resume.
     - **Absurdism (Camus)**: Accept that life has no inherent meaning—*and that’s liberating*. You get to create meaning in small moments of rebellion against the "optimization" machine (e.g., playing guitar badly *with joy*).

  ---

  ### A Hard Truth
  **You can’t "solve" this by adding another achievement.** The shift happens in *how* you inhabit your actions. It requires tolerating discomfort: the anxiety of "wasting time," the fear of falling behind, the vulnerability of doing something without a defense-ready justification. 

  Your frustration is a sign of awakening—not a flaw. The 14-year-old on YouTube with faster chord changes? They’re irrelevant. Your guitar isn’t a tool for comparison; it’s a tool for *being human*. 

  Start small: tomorrow, do *one thing* with no purpose. Notice the panic, then keep doing it. That’s philosophy in action.
