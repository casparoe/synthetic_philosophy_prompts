  Then there’s the hedonic treadmill—always chasing the next goal without lasting satisfaction. The guitar example shows how even hobbies become instrumentalized. They used to play for fun, but now it’s about streaks and comparisons. That’s a classic case of turning play into work.

  Existentialist views like Sartre’s might help. The user is living according to external expectations (resume-building, societal norms) instead of their own values. Authenticity is missing. Heidegger’s concept of being-in-the-world vs. being as equipment is relevant too. The user sees themselves as a tool for achieving goals, not as a being with inherent worth.

