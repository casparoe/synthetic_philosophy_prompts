  Now, acausal trade aims for cooperation without that symmetry. The agents can be different—different values, resources, timelines. The key mechanisms here seem to be mutual simulation and decision theory correlations. Agents simulate each other to find mutually beneficial trades. If they both reason that cooperating leads to better outcomes, they might coordinate. But unlike superrationality, there's no guarantee they'll reach the same conclusion. 

