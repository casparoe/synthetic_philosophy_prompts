      *   Utopia U_Alpha = (1, 1)
  *   **Bargaining Problem Beta:**
      *   Feasible Set S_Beta: Convex hull of (0,0), (0,1), (1,0). Pareto frontier: the line u1 + u2 = 1 from (1,0) to (0,1).
      *   Utopia U_Beta = (1, 1) (Player 2's max is 1, Player 1's max is 1)
  *   **Bargaining Problem Gamma (The Expansion):**
      *   Feasible Set S_Gamma: Convex hull of (0,0), (0,1), **(2,0)**, and (0.5,0.5). (Note: Player 1's maximum possible utility has doubled! Player 2's is unchanged).
      *   Pareto frontier: (2,0) -- (0.5,0.5) -- (0,1). (The segment from (2,0) to (0.5,0.5) and then to (0,1)).
      *   Utopia U_Gamma = (2, 1) (Player 1's max is now 2, Player 2's max is still 1).

  **Solutions:**

  1.  **Nash Bargaining Solution (NBS):**
      *   **S_Alpha:** As before, NBS maximizes product on frontier. On (1,0)-(0.5,0.5): P=(1-0.5t, 0.5t), Product=(1-0.5t)(0.5t)=0.5t - 0.25t^2. Max at t=1 (d/dt=0.5-0.5t=0), P=(0.5,0.5), Product=0.25. On (0.5,0.5)-(0,1): P=(0.5(1-v), 0.5+0.5v), Product=(0.5-0.5v)(0.5+0.5v)=0.25(1-v)(1+v)=0.25(1-v^2) < 0.25. So **NBS(Alpha) = (0.5, 0.5)**.
      *   **S_Beta:** As before, **NBS(Beta) = (0.5, 0.5)** (u1=u2=0.5 on u1+u2=1).
      *   **S_Gamma:** Frontier segments:
          *   (2,0)-(0.5,0.5): P = (2-1.5s, 0.5s) for s in [0,1]. Product=(2-1.5s)(0.5s)=s - 0.75s^2. d/ds=1-1.5s=0 => s=2/3. P=(2-1.5*(2/3), 0.5*(2/3))=(2-1, 1/3)=(1, 0.333). Product=1*0.333=0.333.
          *   (0.5,0.5)-(0,1): P=(0.5-0.5w, 0.5+0.5w), Product=(0.5-0.5w)(0.5+0.5w)=0.25(1-w^2) ≤ 0.25 < 0.333.
          *   So **NBS(Gamma) = (1, 0.333)**.
      *   **Analysis for Nash:**
          *   When we move from S_Beta (subset) to S_Gamma (superset), Player 1's utility increases (0.5 -> 1), Player 2's utility *decreases* (0.5 -> 0.333). This violates **Individual Monotonicity** (expanding the feasible set, particularly in a way that benefits one player, should not harm any player). Player 2 is worse off despite the expansion.

  2.  **Kalai-Smorodinsky Solution (KSS):**
      *   **S_Alpha:** U=(1,1). Find point where u1/1 = u2/1 => u1=u2. On frontier: (0.5,0.5). **KSS(Alpha) = (0.5, 0.5)**.
      *   **S_Beta:** U=(1,1). Find point on u1+u2=1 where u1=u2. **KSS(Beta) = (0.5, 0.5)**.
      *   **S_Gamma:** U=(2,1). Find point on frontier where `(u1 - 0)/(2 - 0) = (u2 - 0)/(1 - 0)` --> u1/2 = u2/1 --> u1 = 2*u2.
          *   On segment (2,0)-(0.5,0.5): P=(2-1.5s, 0.5s). Set u1=2*u2: 2-1.5s = 2*(0.5s) => 2-1.5s = s => 2 = 2.5s => s=0.8. P=(2-1.5*0.8, 0.5*0.8)=(2-1.2, 0.4)=(0.8, 0.4). Check: 0.8/2 = 0.4, 0.4/1=0.4. Equal ratios. **KSS(Gamma) = (0.8, 0.4)**.
      *   **Analysis for KS:**
          *   When moving from S_Beta to S_Gamma, Player 1's utility increases (0.5 -> 0.8), Player 2's utility decreases (0.5 -> 0.4), BUT notice the **ratios to their ideal payoffs are equal in Gamma: 0.8/2 = 0.4 = 0.4/1**. Player 2's *absolute* utility decreased, but their *relative gain* (compared to their maximum possible gain of 1) is the same as Player 1's relative gain (compared to their maximum of 2). Crucially, **Individual Monotonicity is satisfied**: The expansion specifically benefited Player 1 (their max increased from 1 to 2), and Player 1's utility *increased* (0.5 -> 0.8). Player 2's utility decreased, but this is allowed by monotonicity because the expansion *did not specifically increase Player 2's maximum possible payoff* (it stayed at 1). Monotonicity only requires that if *your* ideal point improves, you shouldn't be worse off. Player 2's ideal point didn't improve, so their utility can decrease.

  ### Why Monotonicity Fails for Nash (Intuition)

  Nash's IIA axiom makes it "myopic" to the *shape* of the feasible set *around* the solution point. It only cares about the utility product at the point of agreement and the alternatives *very close to it* that might yield a higher product. When you expand the feasible set in a way that:

  1.  **Doesn't create a new point near the old solution with a higher product:** (Like adding (0, 80) far away from (50,50) in the first flawed example).
  2.  **Does create a new point *elsewhere* with a much higher product for one player:** (Like adding (2,0) in Problem Gamma, dragging the solution towards Player 1).

  Nash's solution will jump to this new point maximizing the product, potentially *reducing* the other player's utility. It doesn't consider the *reason* for the expansion (e.g., Player 1's bargaining power increased) in a global way. It only reacts locally via product maximization.

  ### Deeper Interpretive Difference: Fairness vs. Proportionality

  *   **Nash Solution (IIA):** Embodies a notion of **fairness based on relative sacrifice at the point of agreement and consistency.** Players make equal proportional concessions *from their ideal gains within the specific bargaining context* (defined by the feasible set S). The ratio `(U1 - u1)/(u1 - d1) = (U2 - u2)/(u2 - d2)` often holds at NBS, implying equal "sacrifice ratios." IIA ensures this fairness is consistent across subsets. It's "local" fairness based on the immediate options.
  *   **Kalai-Smorodinsky Solution (Monotonicity):** Embodies a notion of **proportionality based on global bargaining power.** Players receive utility gains proportional to their *potential* (their ideal point - disagreement point). The ratio `(u1 - d1)/(U1 - d1) = (u2 - d2)/(U2 - d2)` defines the solution. Individual Monotonicity directly captures this: If your *potential* (U_i - d_i) increases, your final utility shouldn't decrease. It reflects a "rights-based" or "opportunity-based" view of fairness: your outcome should be proportional to what you *could* achieve if the other player conceded everything.

  ### Why Choose One Over the Other in Practice?

  1.  **When IIA is Paramount (Choose Nash):** If the bargaining context is well-defined and stable, and you care about consistency when analyzing sub-problems or nested choices, Nash is compelling. It's robust to adding "irrelevant" distant alternatives. (e.g., analyzing specific contract terms where the overall pie is fixed).
  2.  **When Bargaining Power Shifts Matter (Choose KS):** If changes in players' *outside options* or *technological capabilities* (changing their ideal points) are central, KS is more intuitive. It ensures a player benefits if their *own* potential improves. It better reflects scenarios like union negotiations (a union gets stronger), new market entrants, or R&D breakthroughs giving one firm an edge. KS's proportionality is often seen as fairer when players have asymmetric maximum potentials.
  3.  **Cost of KS (Dropping IIA):** KS can be sensitive to adding alternatives that *do* change the utopia point, even if those alternatives seem strategically irrelevant to the final agreement. Nash ignores these if they don't offer a higher product near the solution.
  4.  **Cost of Nash (Dropping Monotonicity):** As shown, Nash can punish a player when the feasible set expands *in a way that primarily benefits others*, which seems counterintuitive and unfair if that expansion reflects improved capabilities.

  ### In Summary

  *   **Nash:** Maximizes the product. Values **consistency (IIA)**. Embodies **local fairness via equal sacrifice ratios.** Can **violate monotonicity** when expansion asymmetrically benefits one player.
  *   **Kalai-Smorodinsky:** Equalizes **relative gains to potential (proportionality)**. Values **responsiveness (Monotonicity)** to changes in individual bargaining power. **Drops IIA.** Ensures you benefit if *your* potential improves.
  *   **Divergence:** Occurs when expanding the feasible set significantly increases one player's *maximum possible utility* (their ideal point) but not the other's. Nash may shift dramatically, potentially harming the player whose potential didn't change. KS shifts proportionally, always benefiting the player whose potential increased.
  *   **Motivation for KS:** Precisely to fix the counterintuitive behavior of Nash when one player's bargaining position strengthens (via an increased ideal point), ensuring they aren't harmed and their gains reflect their improved potential. It trades the technical axiom (IIA) for an axiom with clearer practical/ethical justification (Monotonicity) in many bargaining contexts.

  This example and the underlying philosophy of proportionality vs. local consistency should give you the "gut feel" and concrete comparison you need for your midterm. Good luck!
