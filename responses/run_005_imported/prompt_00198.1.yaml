  ### Core Difference Illustrated: The "Asymmetric Expansion" Problem
  Imagine a simple bargaining problem between two players (1 and 2) over splitting money, with linear utilities. The **disagreement point** is (0, 0) – no deal, no money.

  *   **Bargaining Problem A (Baseline):**
      *   Feasible Set (S_A): All splits (u1, u2) where u1 + u2 ≤ $100 and u1 ≥ 0, u2 ≥ 0.
      *   Utopia Point (U_A): (100, 100) (Player 1 *could* get $100 alone, Player 2 *could* get $100 alone).
  *   **Bargaining Problem B (Expanded for Player 2):**
      *   Feasible Set (S_B): All splits (u1, u2) where u1 + u2 ≤ $100, u1 ≥ 0, u2 ≥ 0, **BUT ALSO** Player 2 has a new option: They can get $80 *alone* without Player 1. Formally: S_B includes the point (0, 80) *in addition to* everything in S_A.
