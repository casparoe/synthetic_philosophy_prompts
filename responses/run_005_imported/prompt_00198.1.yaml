  **Calculate the Solutions:**

  1.  **Nash Bargaining Solution (NBS):**
      *   Maximizes u1 * u2 over the feasible set.
      *   **Problem A:** NBS(A) = (50, 50). (Maximizes 50*50=2500; 60*40=2400, 40*60=2400, etc. are lower).
      *   **Problem B:** The new point (0, 80) is irrelevant! The point maximizing u1*u2 *within S_B* is still (50, 50). Why? The product u1*u2 is lower at (0,80) (0*80=0) and at any point on the line segment between (0,80) and (50,50) (e.g., (25, 65): 25*65=1625 < 2500). The maximizer hasn't changed. **NBS(B) = (50, 50)**.
      *   **Result:** Player 2's new, powerful outside option (getting $80 alone) has *no impact* on the Nash solution. Player 1 still gets $50.

