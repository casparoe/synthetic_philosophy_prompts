answer: |-
  Here's a detailed reconstruction of David Lewis's argument in "Do We Believe in Penal Substitution?" addressing your specific points. Lewis's core move is to expose a *conceptual* problem with penal substitution by analyzing our everyday practices surrounding punishment and debt, ultimately arguing that the "fines analogy" fails to rescue the doctrine.

  1.  **Why the "Debt of Punishment" Metaphor is Disanalogous & Makes Substitution Seem Senseless:**
      *   **Literal Debts (e.g., Money Owed):** These are fundamentally *transferable obligations*. The *debt itself* is the core issue, not *who* pays it. The creditor cares about receiving compensation, not about the identity of the payer. If Alice owes Bob $100, and Charlie pays Bob $100 on Alice's behalf, the debt is discharged. Justice is satisfied because the *substance* of the obligation (Bob getting $100) is fulfilled. Substitution is conceptually coherent and practically accepted.
      *   **Punishment:** Lewis argues punishment is intrinsically *personal* and *non-transferable*. The core purpose of just punishment is *not* merely the infliction of suffering *as such*. It aims at several goals intrinsically tied to the *offender*:
          *   **Retribution:** Giving the offender their *deserved* suffering ("paying their debt to society" metaphorically).
          *   **Reform/Rehabilitation:** Changing the *offender's* character or behavior.
          *   **Deterrence:** Discouraging the *offender* and others from future wrongdoing.
          *   **Denunciation:** Expressing society's condemnation *of the offender's act*.
      *   **The Disanalogy:** Punishing an *innocent substitute* (like Christ) fails on all these fronts:
          *   The *offender* doesn't suffer their deserved retribution.
          *   The *offender* isn't reformed.
          *   The *offender* isn't deterred (they got off scot-free!).
          *   Society's condemnation falls on an innocent party, not the guilty one.
      *   **Lewis's Point:** The metaphor of a "debt of punishment" obscures this fundamental difference. Transferring a literal debt makes sense; transferring punishment, understood as something intrinsically tied to the offender's guilt and desert, does *not*. It seems like a category error. Punishing the innocent for the guilty, even willingly, violates the core logic of justice *as we understand it in the context of punishment*. This makes penal substitution appear "senseless" or "incoherent" as a concept of *justice* from the outset.

  2.  **Why Lewis Rejects the Two Obvious Explanations for Fines:**
      *   **Objection 1: "Serious Fines Aren't *Really* Punishment (Just Fees)":**
          *   Lewis readily concedes that *some* "fines" are merely *fees for service* (e.g., library fines for late books, parking meter fees). These are essentially prices for the use of a resource or compensation for minor inconvenience. Substitution here is unproblematic because it's not punishment; it's settling a bill. The payer's identity is irrelevant.
          *   **Lewis's Rejection:** However, he insists that *criminal fines* imposed by a court *are* unequivocally a form of **punishment**. They are intended as a sanction for wrongdoing, proportionate to the offense, aiming at retribution, deterrence, and denunciation. They *feel* punitive to the offender. Dismissing them as "not really punishment" is simply inaccurate for the case relevant to the analogy with penal substitution (which deals with serious sin deserving serious punishment).
      *   **Objection 2: "We Tolerate Substitution for Fines Only Because Preventing It is Impractical":**
          *   This is the move Lewis *anticipates* and explicitly argues against. The idea is: "Sure, it *would* be unjust for an innocent person to pay a criminal fine on behalf of the guilty, but since we can't practically stop friends or family from doing it (e.g., handing over cash), we just tolerate it. This tolerance doesn't mean we think it's *just*; it's just a practical concession. Therefore, our tolerance of fine-paying doesn't undermine the principled objection to penal substitution."
          *   **Lewis's Rejection:** He argues this "impracticality defense" doesn't hold water:
              *   **Attitude vs. Enforcement:** Our attitude towards someone else paying a fine isn't mere passive *tolerance* born of helplessness; it's often active *approval*. We think it's a *good thing* for a friend to help someone out by paying their fine. We praise the friend's generosity and feel relief for the offender. We don't typically think, "What a shame that unjust substitution occurred, but oh well." We think, "What a good friend!"
              *   **The "Let Off the Hook" Point:** Lewis argues that if we *truly* believed it was *unjust* for an innocent person to pay a punitive fine on behalf of a guilty person, we *wouldn't* feel this sense of approval and relief. The fact that we *do* feel approval demonstrates that, in the case of fines, we *don't* hold the principled objection ("punishing the innocent for the guilty is always unjust") that we apply to other punishments like imprisonment or flogging. Our reaction to fine-paying shows our intuitions are more complex than the simple "punishing the innocent is always wrong" principle suggests. We seem to accept substitution *in this specific form of punishment*.

  3.  **Lewis's Actual Conclusion - Nuanced Ambivalence:**
      Lewis doesn't land on a simple "refuted" or "incoherent" verdict. His conclusion is complex and somewhat paradoxical:

      *   **The Conceptual Problem Stands:** He maintains the *core conceptual argument* from point (1): Punishment, by its very nature (focused on the offender's guilt, desert, reform, etc.), seems logically non-transferable. Punishing an innocent substitute doesn't achieve the essential aims of punishment and appears unjust. The "debt" metaphor is deeply misleading.
      *   **The Challenge from Fines:** However, point (2) (our acceptance of fine-paying) creates a serious problem for the *objector*. It shows that our moral intuitions about punishment aren't governed by a simple, absolute principle that forbids *any* substitution *ever*. We *do* accept it in the case of fines. This makes the objector's absolute rejection of penal substitution seem unprincipled or inconsistent ("Why is substitution okay for fines but not for Christ's sacrifice?").
      *   **The Dilemma & Ambivalence:** Lewis concludes that we are left in a difficult position:
          1.  **Incoherence (for the Doctrine):** If we insist on taking penal substitution *literally* as a transaction of justice (transferring punishment), it remains conceptually problematic ("incoherent") because it violates the inherent logic of punishment we've just outlined. The fine analogy doesn't *resolve* this incoherence; it just highlights an inconsistency in *our* intuitions.
          2.  **Hypocrisy (for the Objector):** If we *deny* the doctrine based *only* on the "punishing the innocent is unjust" principle, we are arguably hypocrites because we readily accept functionally equivalent substitution in the case of paying fines. Our own practices undermine the purity of our objection.
      *   **Lewis's Stance:** He doesn't definitively resolve the dilemma for the Christian. Instead, he suggests the Christian might have to bite the bullet on one side:
          *   **Option A (Embrace Incoherence?):** Hold onto penal substitution as a profound mystery or paradox central to their faith, acknowledging the tension Lewis identifies ("It *is* incoherent on a human level of justice, but God's ways are higher").
          *   **Option B (Reject the Principle?):** Modify their understanding of justice to allow for substitutionary punishment in *some* cases (like the Atonement), thereby accepting that their previous objection based solely on "punishing the innocent" was too simplistic, just as it is for fines. However, this risks making God seem unjust by human standards.
      *   **Lewis's Own View (Implied):** While he doesn't state it explicitly as his final conclusion in the essay, the thrust of his argument strongly leans towards the view that penal substitution, *understood as a literal transaction of justice*, **is incoherent**. The fine case doesn't vindicate the doctrine; it primarily exposes an inconsistency in *human* moral intuitions that makes the objector's *pure* appeal to justice principles vulnerable. The core problem of transferring the *personal* nature of punishment remains unresolved.

  **In Summary for Your Dinner Debate:**

  *   **Your Friend** is right that Lewis uses the fine-paying case to expose potential hypocrisy/inconsistency in objectors who accept fine substitution but reject penal substitution.
  *   **You** are right that Lewis explicitly *rejects* the idea that this fine-paying case actually *saves* the doctrine of penal substitution or makes it coherent. He maintains the core conceptual problem: punishment seems inherently non-transferable in a way debt is not. The fine case primarily shows *our* intuitions are messy, not that penal substitution makes sense.
  *   **Lewis's Conclusion** is that the objector is vulnerable to a charge of inconsistency, but the doctrine itself remains problematic on its own terms. The Christian is left with a difficult choice: accept the doctrine as a paradoxical mystery potentially beyond human logic, or modify their concept of justice in a way that might seem unpalatable. He leans towards the view that penal substitution, literally construed, is incoherent, but the fine case prevents the objector from claiming the moral high ground purely on the "punishing the innocent" principle. The argument ends in a state of unresolved tension.
