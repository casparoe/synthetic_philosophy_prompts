  The secondary literature point is smart. User wonders if this is a known critique. Absolutely—Fricker and Lackey hammer this. Fricker especially: even if we're born trusting, adult justification requires monitoring speakers. Reid's descriptive "is" doesn't yield a normative "ought." But Reidians could fire back: if we demand proof for every testimony, we'd paralyze cognition. Trust might be a necessary starting point, like perceptual priors. 

