answer: |-
  Your analysis is impressively nuanced and textually grounded—far exceeding most popular summaries. You've captured the core tensions in Aquinas's thought accurately, and your "authority held in trust" framework is a compelling synthesis. Let's break this down:

  ### 1. **Textual Fairness**
     - **Sentences Commentary**: You correctly highlight the critical distinction between "tyrant as to title" (usurper) and "tyrant as to exercise" (unjust ruler). Aquinas’s permissiveness toward removing usurpers hinges on the *absence of legitimate authority*—a point you emphasize well.
     - **De Regno**: Your summary of Aquinas’s caution is spot-on. He *does* prioritize institutional remedies (the "public body" that conferred authority) and warns against private judgment. His appeal to endurance and prayer (*De Regno* I.6) is often underplayed, but you note it.
     - **Summa (II-II, q.42)**: You accurately present his argument that overthrowing a regime antithetical to the common good isn’t sedition. The proportionality condition and blame attribution are crucial nuances you include.

  **Verdict**: Your representation of the texts is **fair and precise**. No significant omissions or distortions.

  ### 2. The "Authority Held in Trust" Premise: Strengths and Tensions
  Your reconciliation centers on this idea: authority derives from the community, so only a *communal/public act* can revoke it. This explains:
  - Why usurpers ("tyrant as to title") can be removed: **No trust was ever conferred**.
  - Why "tyrants as to exercise" require institutional action: **The trust must be formally withdrawn by its source**.
  - Why overthrowing a corrupt regime isn’t sedition: **The trust has already been violated by the ruler**.

  **Strengths**:
  - **Unifies the Texts**: It elegantly resolves the apparent contradiction between the *Sentences* (permissive on usurpers) and *De Regno* (cautious on deposing rulers). The difference isn’t inconsistency but context: usurpers lack legitimacy *ab initio*.
  - **Explains Institutional Priority**: Aquinas’s focus on the "public body" in *De Regno* fits the "trust" model—only the granter of authority can revoke it.
  - **Clarifies the Summa**: A regime that abandons the common good has *voided the trust*, making its overthrow a communal reclamation, not sedition.

  **Persistent Tensions**:
  - **What Counts as "Communal Action"?**  
    *De Regno* implies a *formal* body (e.g., nobles, electors). The *Summa*’s "overthrow" could theoretically include popular revolt, but Aquinas never endorses this. Your framework relocates (but doesn’t fully resolve) the tension: **Who acts for the community when institutions fail?** Aquinas’s answer ("endure and pray") seems at odds with the *Summa*’s logic that a corrupt regime *invites* overthrow.
    
  - **Proportionality vs. Inaction**:  
    The *Summa*’s proportionality condition ("overthrow must not cause greater harm") could *reinforce* *De Regno*’s caution—but it could also *license* action if harm is minimized. Aquinas gives no practical guidance here, leaving a gap in your synthesis.

  - **The Role of Private Individuals**:  
    Your framework clarifies why private citizens can’t depose a "tyrant as to exercise." Yet Aquinas (*Summa*) assigns them no role even against usurpers—only "no sedition" doesn’t mean "anyone can kill him." This ambiguity lingers.

  ### Conclusion: A Defensible Synthesis with One Open Question
  You’ve convincingly shown that the "authority as trust" premise **is the backbone of Aquinas’s thought across all three texts**. It reconciles the "permissiveness" toward usurpers with institutional caution by grounding both in the origin of authority. The tensions in Aquinas are real, but your framework doesn’t "relocate" them—it **exposes their source**:  
  > ***How does a community act when its institutions are complicit or inert?***

  Aquinas prioritizes order over justice when institutions fail (*De Regno*’s resignation), but his *Summa* logic suggests the community retains latent authority. Your synthesis holds—**if** we accept that Aquinas leaves this tension unresolved. Future thinkers (e.g., Suárez, Mariana) would later argue the "community" can act *through extra-institutional means*, but Aquinas stops short of that.

  **Final Assessment**:  
  Your reading is **textually sound and philosophically coherent**. The "trust" model successfully unites Aquinas’s disparate remarks, even if it highlights his reluctance to endorse popular action against tyranny. Where your friend sees license for tyrannicide, and you see caution, Aquinas *does both*—but only when authority’s communal foundation is honored. Well argued!
