answer: |-
  Here’s a eulogy weaving Ramsey’s ideas into a tribute that honors your grandmother’s spirit, values, and wit—aimed at comfort, not academia. It’s structured for clarity and warmth, running just under 5 minutes when spoken slowly:

  ---

  **For [Grandma's Name]**  

  Good morning. I’d like to talk about what made my grandmother extraordinary—not just as an actuary, a mother, or a friend, but as someone with a quietly remarkable way of seeing the world.  

  She had a favourite philosopher, Frank Ramsey—a Cambridge genius who reshaped logic and economics in the 1920s before he died tragically young. She discovered his essay "Epilogue" decades ago, and it became her compass. In it, Ramsey does something simple but profound: he says we don’t experience life "to scale." We experience it *in perspective*. The stars, he wrote, aren’t astronomically vast to us in our daily lives; they’re "no bigger than threepenny bits." They’re part of *our* sky, *our* stories, *our* wonder.  

  **That was Grandma’s great gift: she lived in perspective, not scale.**  
  She didn’t see human life as insignificant against the cosmos—but she didn’t pretend it was eternal, either. She met the world exactly as it is: finite, fleeting, and fiercely beautiful. When she laughed, it wasn’t a small thing against the universe; it filled the room. When she cared for you, it wasn’t a speck of kindness; it was everything in that moment. She understood, like Ramsey, that meaning isn’t measured in light-years or eons. It’s measured in the depth of our attention, the warmth of our connections—right here, right now.  

  As an actuary, she’d have appreciated Ramsey’s cheeky line that life is like calculating "present value at compound discount." For those outside her profession, that’s a dry way of saying: *what matters most is closer to us in time and feeling*. She knew life is brief, but she also knew that’s why it’s precious. She built her outlook on that balance—no grand illusions, no crushing despair. Just a clear-eyed embrace of the scale we actually live in: this moment, this love, this memory.  

  And true to her spirit, she’d want us to hold that tension lightly. Ramsey himself was full of contradictions—she loved that he called it "ethically indefensible" to discount future generations’ well-being in economics, even as he joked about discounting his own life! That’s the human condition: we’re messy, we’re inconsistent, and we’re worthy of cherishing exactly as we are.  

  So today, let’s honor her the way she’d want:  
  - Not by insisting she’s somewhere else.  
  - Not by shrinking ourselves against the stars.  
  But by seeing as she did: with perspective.  
  The kind where grief isn’t small—it’s real.  
  Where joy isn’t trivial—it’s vital.  
  Where a life well-lived isn’t measured in years, but in the courage to face the world as it is, and love it anyway.  

  She showed us how to do that. And that’s a legacy no discount rate can diminish.  

  Thank you, Grandma. We’ll keep looking at the stars—and the threepenny bits—with your eyes.  

  ---

  ### Why this works:
  - **Comfort without compromise**: Avoids religious/nihilistic extremes while focusing on lived meaning.  
  - **Ramsey’s core idea, humanized**: "Perspective, not scale" is explained through *her* actions (laughter, care).  
  - **Actuary touch**: "Present value at compound discount" frames life’s brevity with her professional wit.  
  - **Contradiction handled**: The ethics line is one sentence, framed as a relatable human quirk she loved.  
  - **Grounding in her**: Every abstract point ties back to *her* outlook, laughter, or values.  
  - **Closing image**: "Stars/threepenny bits" returns as a shared act of remembrance—simple, visual, true to her.  

  Deliver it gently, pausing after emotional lines. It’s okay if people don’t know Ramsey—they’ll feel *her* through it. She’d be proud.
