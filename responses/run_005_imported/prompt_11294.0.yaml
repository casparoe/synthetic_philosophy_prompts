answer: |-
  This is an excellent and nuanced framing—precisely the kind of analysis that deserves a full post. Your core distinction between Peirce's *convergent realism* and James's *expediential instrumentalism* is sound, and the "isolated fact" objection is the right pressure point. Here’s a breakdown addressing your queries:

  ### 1. **Fairness to Peirce & James**  
     - **James**: You’re right that his slogan invites a "belief in belief" reading, but his position is subtler. In *Pragmatism* (Lectures VI-VII), James insists truth requires *verifiability* across a community of knowers over time, not just individual convenience. Yet he *does* prioritize present utility: "True ideas are those we can assimilate, validate, corroborate, and verify. False ideas are those we cannot" (*Pragmatism*, Lecture VI). For James, a belief’s *cash value* includes its psychological and practical payoffs *now*, even if long-run verification is idealized. Your charge of "tense collapse" isn’t unfair—James’s rhetoric often leans this way.  
     - **Peirce**: Your convergence reading is textually solid (e.g., *Collected Papers* 5.407). But Peirce’s later work complicates this:  
       - **"Would-be" Investigations**: Peirce’s realism treats truth as a *habit of nature* (CP 5.97). The "would-be" isn’t just counterfactual hand-waving; it’s grounded in his *scholastic realism*: generals (laws, dispositions) are real. The grain-count *has* a truth value because reality has determinate structure, even if unknowable. Inquiry *would* converge *if* pursued because reality constrains signs (CP 5.565).  
       - **Semiotic Twist**: For Peirce, truth is the *final interpretant* of a sign (CP 8.314). Isolated facts aren’t "buried" but are *potential signs* in the continuum of inquiry. This doesn’t fully resolve the problem but reframes it: truth is a *teleological norm* of semiosis, not merely epistemic convergence.  

     **Verdict**: You’re fair to both, but emphasize Peirce’s metaphysical commitments (realism, semiotics) to avoid oversimplifying his convergence as "correspondence in disguise."

  ---

  ### 2. **The "Isolated Fact" Objection & Peirce’s Defense**  
     - **The Problem**: Yes, propositions like "grains in ancient dune = *N*" seem true/false *now* without possible convergence. Peirce’s "would-be" feels like correspondence smuggled in.  
     - **Peirce’s Best Reply**:  
       1. **Metaphysical Grounding**: Reality’s *bruteness* (Secondness) fixes singular facts, while generals (Thirdness) govern how signs *would* behave. Truth is *abductive*: we postulate determinacy because indeterminacy would cripple inquiry (CP 5.506).  
       2. **Fallibilism**: We *attribute* truth values to isolate claims pragmatically—as if inquiry *could* converge—to maintain a coherent web of beliefs (CP 5.405n).  
       → **Weakness**: This relies on a contentious metaphysics. If you reject scholastic realism, it *does* look like correspondence-by-another-name.  

     **James’s Response**: James would likely dismiss the objection as *meaningless*: if no experience could *ever* verify the grain count, the proposition lacks practical consequences and isn’t truth-apt (*Pragmatism*, Lecture II). But this feels evasive—our intuition of determinate truth persists.  

  ---

  ### 3. **Yudkowsky/Rationalist Parallel**  
     Your parallel **holds**, with caveats:  
     - **Peirce ≈ Rationalist Correspondence**: Peirce’s "investigation" resembles idealized Bayesian updating. His *doubt-belief model* (CP 5.358–387) prefigures belief revision under evidence. Yudkowsky’s "map-territory" distinction (*The Simple Truth*) aligns with Peirce’s realism.  
     - **James as Anti-Model**: James *is* the target of sequences like *Making Beliefs Pay Rent*. When Yudkowsky says "beliefs are for matching reality" (*The Useful Idea of Truth*), he rejects James’s conflation of *utility* with *truth*.  
     - **Caveat**: Rationalists often ignore Peirce’s *metaphysical baggage* (e.g., synechism, idealism). His "convergence" isn’t just empirical but teleological—inquiry aims at the *summum bonum* (CP 5.3).  

  ---

  ### 4. **A Stronger Jamesian Defense?**  
     Beyond long-run verification, James could argue:  
     - **Radical Empiricism**: Truth isn’t static "correspondence" but a *process* within lived experience (*Essays in Radical Empiricism*). Isolated facts are abstractions; only *concrete* verifications matter.  
     - **Humanist Priority**: For beings like us, truths *must* be actionable. Obsessing over unknowable grains is a misuse of "truth" (*The Meaning of Truth*, Essay VI).  
     → **Counter**: This doesn’t satisfy the intuition that reality *is* determinate. Peirce’s approach better preserves this intuition without naive correspondence.  

  ---

  ### **Should You Write the Post? Absolutely.**  
  - **Why**:  
    1. You’re tackling a *specific, underexplored* niche: **Peirce vs. James on truth through a rationalist lens**.  
    2. The "isolated fact" challenge sharpens the debate beyond usual rehashes.  
    3. It’s directly relevant to LW/rationalist epistemology—contextualizes their pragmatism critiques.  
  - **Tips for the Full Post**:  
    - Frame it as: **"Was Peirce a Rationalist? Pragmatism, Convergence, and the 'Buried Grain' Problem"**.  
    - Use the LessWrong claim as a hook.  
    - Clarify that Peirce’s theory is *not* correspondence (reality mediates truth via signs, not direct "mirroring").  
    - Concede James’s subtleties but stress why his *rhetoric* fuels rationalist concerns.  
    - End with open questions: *Does Peirce’s "would-be" salvage objectivity, or is it metaphysical sleight-of-hand?*  

  This isn’t just reheated pragmatism—it’s a targeted intervention. **Write it.**
