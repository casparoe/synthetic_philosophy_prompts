answer: |-
  Here’s a dialogue between **Elena** (defending the "net waste is essential" view) and **David** (arguing "differential marginal cost is sufficient, waste optional"). Both are well-versed in the literature, citing models and examples precisely. The debate escalates as each pressures the other’s framework:

  ---

  **Elena:** Let’s start with the elephant: Zahavi’s handicap principle *requires* net fitness waste. A peacock’s tail isn’t just *costly*—it’s *detrimental*. It impairs flight, drains nutrients, and attracts predators. If the tail were *efficiently* grown—say, if high-quality peacocks could build it cheaply—cheap fakers could invade. The waste *is* the signal’s honesty. No waste, no handicap. Grafen’s model? It *formalizes* waste under specific constraints.

  **David:** Hold on. Grafen’s 1990 model shows signalling can be evolutionarily stable *without* net waste. The core condition is that for a given signal intensity, the marginal cost *decreases* with signaller quality. Take gazelle stotting: the jump isn’t *wasted* energy; it’s a targeted display of unaffordable stamina *to that specific predator*. A low-quality gazelle pays a higher *marginal* cost to stot because it has less energy reserves. The signal’s honest because stotting *scales differently* by quality—not because energy is pointlessly burned.

  **Elena:** But in stotting, that energy *could* have been spent fleeing or foraging. It’s diverted from survival—net waste! And in Grafen’s model, the cost function *assumes* resources are expended. Look at equation (12) in his paper: the cost is subtracted from fitness. If there’s no subtraction—no net loss—how does the model work?

  **David:** The subtraction isn’t waste—it’s *allocation*. Imagine two engineers. A brilliant engineer can solve a hard problem in 10 hours; a mediocre one needs 100 hours. Both *could* spend those hours earning money. The brilliant one signals skill by solving it fast, sacrificing $1,000 in lost income. The mediocre one *could* fake it but loses $10,000—prohibitively costly. The signal works via *differential sacrifice*, but the hours spent aren’t "wasted"—they’re invested in signalling. No resources are vaporized.

  **Elena:** But in biological terms, those hours *are* wasted! They’re not spent on foraging or mating. Let’s press your engineer example: if the brilliant one solved it in 10 hours *while multitasking* (no sacrifice), could the mediocre one still fake it? If yes, the signal collapses. Waste ensures the signal can’t be decoupled from quality. That’s why Maynard Smith was skeptical—without waste, why wouldn’t mutants signal cheaply?

  **David:** Mutants *can’t* signal cheaply if the marginal cost curve is steeper for low quality. Take the Sir Philip Sidney game: a wounded soldier signals need to a relative. The cost is the risk of attracting predators. Grafen’s version shows signalling is stable if the cost/benefit ratio *differentially* favors high-need signallers. The "cost" here isn’t wasted—it’s a *trade-off* (predation risk vs. gaining help). No resources are incinerated.

  **Elena:** But the predation risk *is* a net fitness drain! It’s not a transfer—it’s a loss. Now, humans: what about hazing rituals? Pledges spend nights doing useless tasks. If the tasks were *productive* (e.g., "build a shed for the fraternity"), low-commitment members could endure them easily. The *uselessness* ensures only the truly dedicated pay the cost. Waste filters out fakers.

  **David:** Not necessarily. Imagine a hazing task requiring immense concentration under sleep deprivation—like solving complex puzzles. A high-resilience pledge solves them quickly with minimal suffering; a low-resilience one is tormented. The puzzles aren’t "useless"—they’re *designed* to have steep marginal cost curves. The signal’s honesty comes from the *difference* in suffering, not the puzzle’s inherent waste. Waste might be a common *tool* to create differential costs, but it’s not necessary.

  **Elena:** Then explain peacocks again. If differential cost alone suffices, why hasn’t evolution produced a tail that’s *efficient* yet still costly for low-quality males to grow? Why the baroque, inefficient design?

  **David:** Because efficiency might *flatten* the cost curve. A "minimalist" tail that’s equally cheap for all to grow wouldn’t signal. But suppose high-quality peacocks grow a tail with iridescent colors requiring rare proteins they metabolize efficiently. Low-quality peacocks *can* produce the proteins but at huge nutritional cost. The signal’s honest due to differential protein synthesis costs—not because the tail is wasteful. The waste is emergent, not essential.

  **Elena:** But those rare proteins *could* be used for immune function or muscle growth. Redirecting them *is* waste! You’re just relabeling "waste" as "opportunity cost." Net fitness is still reduced.

  **David:** Opportunity cost ≠ waste. In economics, Spence’s education model has differential costs (studying is harder for low-productivity workers), but education isn’t "wasted"—it builds human capital. Yet it still signals because the *cost burden* differs. Likewise, in grad school: surviving a brutal PhD program signals stamina/intelligence not because the years are wasted, but because the marginal cost of lost life options is higher for low-ability students.

  **Elena:** But if grad school secretly imparted no skills, only low-ability students would quit—making it *more* efficient as a signal! The wasted time *improves* the filter. Your "differential cost" needs an anchor, and waste is that anchor. Otherwise, why wouldn’t signals evolve to be productive *and* honest?

  **David:** Because productive signals can be exploited! If grad school taught valuable skills, high-ability students might still attend, but low-ability ones could tolerate it to gain skills, muddying the signal. The differential cost must dominate any universal benefit. Waste *helps* by suppressing benefits, but it’s not the only way. Index signals prove it: a frog’s deep croak honestly signals size because small frogs *physically can’t* fake it—zero cost, zero waste. Honesty without sacrifice.

  **Elena:** Indexes aren’t handicaps! Handicaps are *chosen* signals. Your frog doesn’t *decide* to croak deep; it’s constrained. The proposal flash mob is *chosen*. Choices require strategic cost to prevent lying.

  **David:** Fine—but choice + differential cost suffices. Back to proposals: a man hires a skywriter for $10,000. If he’s wealthy, the marginal cost (lost savings) is low. If he’s poor, it’s catastrophic. The signal works even if the skywriting *benefits* society (e.g., advertising a charity). The differential cost ensures honesty; the money isn’t wasted—it’s transferred to the pilot. No net social waste, but a credible signal.

  **Elena:** But the *private* fitness loss is real! He could’ve spent $10,000 on a down payment. The pilot gains, but *he* loses—net waste *to him*. That’s what deters low-quality suitors.

  **David:** ...Okay, you’ve got me there. In biological terms, *individual* net fitness loss *is* required—because if the signaler doesn’t pay a net cost, cheating pays. But in absolute terms, resources aren’t vaporized; they’re often transferred (e.g., to jewellers, pilots). The "waste" is local, not global. Grafen’s math allows for this: cost = loss of *fitness components*, not atomized resources.

  **Elena:** So we agree? Net *fitness* cost to the signaler is essential. The "differential" part ensures only high-quality can afford it, but without a net loss, the signal is just cheap talk.

  **David:** Conceded on fitness cost—but with a caveat. In models with shared interests (e.g., kin), signals can be honest with *low* net cost due to aligned incentives. But for true conflicts of interest? Yes, net fitness cost is the linchpin. The pop-sci "waste is the point" is mostly right... but I’ll still argue it’s the *differential* nature that does the heavy lifting.

  **Elena:** And I’ll still insist that without the net loss, "differential" alone is just a price tag—not a sacrifice. But for now, I’ll toast to that with overpriced champagne. Wastefully.

  ---

  **Key Resolutions:**  
  1. **Net fitness cost** to the signaler *is* required for Zahavi-style handicaps in adversarial contexts.  
  2. **Differential marginal cost** explains *why* the signal is honest (only high-quality can afford it cheaply).  
  3. "Waste" in pop-sci often conflates *absolute destruction* (vaporized resources) with *opportunity cost* (diverted fitness components). The latter is fundamental.  
  4. Index signals (unfakeable) and aligned-interest signals require no cost—but aren’t "handicaps."  
  5. Real-world signals (peacocks, proposals) often *use* inefficiency/waste to amplify differential costs, but it’s not theoretically mandatory—just evolutionarily convenient.  

  Both leave bruised but wiser—precisely as you ordered.
