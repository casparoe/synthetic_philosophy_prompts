  So I went down a wikipedia rabbit hole on brain-in-a-vat skepticism last night and found this arguement by Hilary Putnam that supposedly proves you literally can't be a brain in a vat -- the gist is if you WERE one, your word "vat" wouldn't refer to an actual vat, just some fake vat-image inside the simulation, so the sentence "I am a brain in a vat" comes out false no matter what. Seems like a pretty slick knockdown proof once you see it. Doesnt this basically mean Nick Bostrom's whole simulation argument (the "we're probably living in a simulation" one Elon's always going on about) is dead on arrival too, since Putnam already showed you can't even coherently be in a simulation? Or is there some loophole in how the reference/pointer for "vat" gets fixed that means his proof doesn't actually carry over to the Bostrom case? Kinda want to know if this is really as airtight as it sounds or if I'm missing something.
