prompt: |-
  A friend of mine and I spent most of a long car ride arguing about whether it is ever rational to deliberately avoid finding something out. She is the kind of person who skips all coverage of a football match before watching her recording of it that evening, who declined a free genetic test for a hereditary condition that runs in her family even though there is no treatment either way, and who avoids logging into her retirement account whenever the market drops sharply. I argued that all three habits are indefensible, because I remembered from an intro decision theory course that the statistician I. J. Good proved a result, now usually called Good's theorem, showing that the expected value of a cost-free piece of evidence relevant to an upcoming decision is never negative for a rational Bayesian agent: in expectation, you can never do better by deciding blind than by looking first. That struck me as a fairly devastating and quite general mathematical argument against her whole policy of studied ignorance, almost a formal vindication of the "principle of total evidence" I had vaguely heard of elsewhere.

  She wasn't persuaded, though neither of us could say exactly where the argument was supposed to break down, if indeed it does. So, given that Good's theorem seems to establish, in full generality, that acquiring free evidence before a decision can never lower one's expected utility, I would like a rigorous, decision-theoretic explanation of exactly why her habit of avoiding bad news is a mistake.
reasoning: |-
  Okay, the user is asking for a rigorous explanation to counter their friend's habit of avoiding information, despite Good's theorem suggesting that free evidence should never hurt. Let me start by recalling what Good's theorem states. It says that for a rational Bayesian, the expected value of free information is non-negative. So why would someone avoid information?

  The user mentioned three examples: skipping football results, declining a genetic test, and avoiding retirement account checks during market drops. Each involves avoiding potentially negative information. The key here is to find where Good's theorem might not apply directly. 

  First, Good's theorem assumes that the decision-maker will update beliefs correctly and choose optimally after receiving information. But in real life, people might not act optimally. For example, after seeing a market drop, someone might panic and sell low, which is suboptimal. The theorem doesn't account for such irrational actions post-information.

  Then there's the issue of state-dependent utility. The user's friend avoids logging into her retirement account because seeing the loss causes immediate distress. The disutility from anxiety isn't part of the financial decision but a separate emotional cost. Good's theorem considers only the utility relevant to the decision, but if learning the information itself affects well-being, that's outside the decision frame.

  Also, the genetic test example is interesting. There's no treatment, so the decision doesn't change based on the result. But knowing the result could cause ongoing anxiety if positive, which is a constant emotional burden. Here, the information doesn't alter actions but impacts mental well-being. Good's theorem might not consider this because it assumes utility only from outcomes of decisions, not the information state itself.

  Another angle is pre-commitment. By avoiding the account, the friend prevents herself from making impulsive decisions. This is a self-binding strategy to avoid future irrational actions. Good's theorem doesn't cover cases where ignorance serves as a commitment device.

  The user wants a decision-theoretic explanation. So I need to structure these points rigorously. Start by outlining Good's theorem assumptions: cost-free information, rational updating, and optimal action post-information. Then show how each example violates one or more assumptions. 

  For football, the utility includes suspense and surprise, which are state-dependent utilities. The genetic test affects utility through anxiety regardless of decisions. The retirement account involves avoiding a suboptimal action due to emotional response. Each case introduces elements outside Good's framework.

  Also, the user might want to convince their friend, so the explanation needs to be clear and address each habit specifically. Highlighting that Good's theorem applies only when information affects decisions without additional costs. When information itself has utility or leads to irrationality, avoiding it can be rational.
answer: |-
  Your friend's habits illustrate situations where Good's theorem *appears* to be violated, but a deeper decision-theoretic analysis reveals why avoiding information can be rational. Good's theorem relies on specific assumptions that don't hold in these cases. Here's a rigorous breakdown:

  **Good's Theorem Recap & Core Assumptions:**
  Good's theorem states: *For a rational Bayesian agent facing a decision, the expected value of acquiring cost-free, relevant evidence before deciding is non-negative.* Formally:
  `E[V | Acquire Info] ≥ E[V | Decide without Info]`
  where `V` is the utility of the outcome after the decision.

  **Key Assumptions:**
  1.  **Cost-Free Information:** Acquiring the information itself imposes no direct utility cost (no pain, anxiety, or effort).
  2.  **Rational Updating:** The agent updates beliefs correctly via Bayes' theorem upon receiving the information.
  3.  **Optimal Action Post-Information:** After receiving the information, the agent will choose the action that maximizes their *expected utility* given their *updated beliefs*.
  4.  **State-Independent Utility:** Utility depends *only* on the outcome state of the world and the action taken. It does *not* depend directly on the agent's *knowledge state* or the *process* of acquiring information.
  5.  **Information Affects the Decision:** The information must be potentially relevant to the choice of action.

  **Where Your Friend's Rationale Holds (Breaking the Assumptions):**

  1.  **Football Match (Violates Assumption 4 - State-Independent Utility):**
      *   **Decision:** Watch the recording or not? (Implicitly, "how to derive enjoyment from watching").
      *   **Information:** The outcome of the match.
      *   **Why Avoidance Can Be Rational:** The utility derived from watching the recording *depends intrinsically on the state of knowledge*.
          *   `U(Watch | Know Outcome) < U(Watch | Ignorant)`.
          *   The suspense, surprise, and emotional engagement (key components of enjoyment for many) are *destroyed* by knowing the outcome. The "outcome state" (win/loss) is the same, but the *experience* of reaching that outcome state is fundamentally altered by foreknowledge.
      *   **Good's Theorem Breakdown:** Good's theorem assumes utility depends only on the final state and action. Here, utility depends critically on the *informational state during the action* (watching). Knowing the outcome imposes a direct utility cost (loss of enjoyment) that is inseparable from the act of watching itself. Acquiring the information *isn't* cost-free in terms of utility.

  2.  **Genetic Test (Violates Assumption 1 - Cost-Free Information & Assumption 4 - State-Independent Utility):**
      *   **Decision:** None (explicitly). There's no treatment decision to make.
      *   **Information:** Carrier status for the hereditary condition.
      *   **Why Avoidance Can Be Rational:**
          *   **No Decision Impact:** Since no action changes based on the result (Assumption 5 is weak/non-existent), the *only* consequence of the information is its impact on the agent's *knowledge state*.
          *   **Direct Utility Cost of Knowledge:** Knowing one carries the gene may cause significant ongoing anxiety, dread, or psychological burden (`U(Know Carrier) < U(Ignorant)`), even though the *actual* biological state (carrier or not) remains unchanged. This is a direct utility cost of the *information state* itself.
          *   **No Compensating Benefit:** Without a decision to inform, there's no potential gain in expected utility from better-informed actions to offset this cost.
      *   **Good's Theorem Breakdown:** The information acquisition has a direct negative utility impact (Assumption 1 violated). Utility depends directly on the knowledge state, not just the world state (Assumption 4 violated). The information is irrelevant to any actionable decision (Assumption 5 is null).

  3.  **Retirement Account (Violates Assumption 3 - Optimal Action Post-Information & Potentially Assumption 1):**
      *   **Decision:** Adjust investment strategy (e.g., sell, hold, buy more) or not?
      *   **Information:** The current value of the account after a sharp market drop.
      *   **Why Avoidance Can Be Rational (Self-Binding):**
          *   **Acknowledged Irrational Temptation:** Your friend recognizes that *if* she sees the loss, she might be tempted to act against her own long-term interests (e.g., panic selling) due to loss aversion or emotional response. She doubts her ability to choose the optimal action (hold/buy) post-information.
          *   **Commitment Strategy:** Avoiding the information acts as a *pre-commitment device*. By remaining ignorant, she binds herself to her predetermined, rational long-term strategy ("hold for the long haul"), preventing herself from making a suboptimal decision driven by the emotional shock of seeing the loss.
          *   **Mathematical Justification:** Let `A_optimal` be the optimal action (hold). Let `A_panic` be the suboptimal action (sell low). Let `I_loss` be the information "account value dropped sharply".
              *   `E[U | See I_loss & Do A_optimal]` might be high (long-term gain).
              *   `E[U | See I_loss & Do A_panic]` is low (realizes loss, misses recovery).
              *   **Crucially:** If `P(Do A_panic | See I_loss)` is high (she knows she's prone to panic), then:
                  `E[U | Acquire Info (I_loss)] = P(Do A_optimal | I_loss)*U(A_optimal) + P(Do A_panic | I_loss)*U(A_panic)`
                  can be significantly *less* than
                  `E[U | Avoid Info & Do A_optimal] = E[U | Do A_optimal]` (since she commits to holding by not looking).
          *   **Potential Direct Cost:** Seeing the large loss might also cause significant immediate distress (violating Assumption 1), further reducing utility regardless of the action taken.
      *   **Good's Theorem Breakdown:** Assumption 3 (optimal action post-information) is violated. The agent recognizes she may *not* choose the EU-maximizing action after seeing the information. Avoiding information becomes a tool to enforce the optimal strategy. The direct distress cost also violates Assumption 1.

  **Conclusion: Why Her Habit Isn't Necessarily a Mistake**

  Good's theorem is a powerful result *within its specific framework*. However, your friend's examples highlight realistic scenarios where its core assumptions fail:

  1.  **Information Itself Affects Utility:** Knowing the football score ruins the experience; knowing genetic status causes anxiety. Information isn't always cost-free (Assumption 1 & 4).
  2.  **Information Can Trigger Suboptimal Actions:** Seeing a portfolio loss might induce panic selling, a known irrational bias. Agents aren't always perfect optimizers post-information (Assumption 3). Strategic ignorance can be a rational commitment device.
  3.  **Information Without Actionable Decisions:** If information doesn't affect any decision (like the genetic test with no treatment), its *only* value is the utility of knowing itself, which can be negative.

  **Therefore, her policy isn't "indefensible."** It reflects a rational response to situations where:
  *   The *experience* of ignorance has positive utility (football).
  *   The *state* of knowledge has direct negative utility (genetics).
  *   Access to information creates a high risk of making a *worse decision* than remaining ignorant and sticking to a predetermined optimal plan (retirement account).

  Good's theorem proves you can't *systematically* gain by avoiding free evidence relevant to a decision where you will act optimally. Your friend's habits succeed precisely because they exploit situations falling *outside* these conditions – where evidence isn't free (psychologically), or where it might lead to suboptimal action, or where it doesn't enable any decision at all. Her "studied ignorance" is often a rational strategy for maximizing her *overall* expected utility, accounting for psychological costs and her own known behavioral limitations.
