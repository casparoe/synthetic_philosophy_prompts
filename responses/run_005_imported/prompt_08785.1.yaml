  Hmm... Dana's epistemic akrasia point seems academically sound - simultaneously believing "drunk me is unreliable" and "this drunk calculation is definitely correct" does create cognitive tension. But Colin's practical objection also resonates: in real-time decision making, people don't calibrate confidence percentages like robots. 

  Interesting tension between theoretical rationality and lived experience. The fact Colin was ultimately correct feels emotionally relevant but logically irrelevant - rationality should be judged based on information available at the time. 

