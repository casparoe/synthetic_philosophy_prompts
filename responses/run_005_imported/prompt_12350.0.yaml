  Hmm... "not responsible" seems right, but must justify hard. The student's reliance was reasonable: course site trumps syllabus for actual access, others got warnings. Sanctioning her now would be punishing good-faith compliance. 

  But the Hart counter deserves weight: syllabus is ultimate authority, ignorance isn't excuse. Fair—but this isn't ignorance. It's active contradiction by the system itself. 

  For future standard? Need a Fuller-esque test: 
  1. Official source (pedigree) 
