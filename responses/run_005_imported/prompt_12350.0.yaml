  First, the core tension: Hart's positivism vs Fuller's "inner morality of law." The syllabus is Hart's dream—clear pedigree from the professor. But Fuller would scream about the contradictions: old policy still up, selective enforcement, no notice. The student literally followed the visible course site version. 

  The professor's actions complicate everything. Letting two students off quietly? That's textbook Fuller's "congruence" problem—rules announced vs administered. And the dual policies? Both "publicity" and "non-contradiction" failures. Hartians might dismiss this as "law is law, fix the penalty," but that feels cruel when the student acted reasonably.

  Wait—the user needs a ruling memo. They want:
  - Concrete recommendation (not just theory)
