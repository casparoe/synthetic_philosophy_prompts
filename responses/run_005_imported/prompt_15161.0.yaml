  F: []   # leave empty or put none? The user said "feel free to include ones I haven't mentioned", but we don't have to put F if none are that bad.

  But note: there are other approaches that might be worse? For example, just ignoring the problem and assuming self-trust without any mechanism. But that's not a named approach.

