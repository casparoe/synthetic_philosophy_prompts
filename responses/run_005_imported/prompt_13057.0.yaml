answer: |-
  ## The Anthropic Arena: Navigating Bullets Between Doomsday and Presumption

  The self-locating prior problem is a minefield for Bayesian rationality, forcing us to choose between two deeply counterintuitive bullets: the grim forecast of the Doomsday Argument under the Self-Sampling Assumption (SSA) or the audacious certainty of the Presumptuous Philosopher under the Self-Indication Assumption (SIA). While Bostrom's reference-class adjustments offer a tempting escape hatch, they prove unstable under scrutiny. Radford Neal's Full Non-Indexical Conditioning (FNC), however, provides a more robust and defensible framework, particularly when tested against the crucible of the Sleeping Beauty problem, ultimately offering the Bayesian a principled, if nuanced, path forward.

  **The Dueling Bullets:**

  1.  **SSA & The Doomsday Bullet:** SSA instructs us to reason as if randomly selected from all actual observers in our reference class. Applied to humanity's future, this seemingly innocuous principle generates the Doomsday Argument. If we are a random human among *all* humans who will ever exist, finding ourselves among the earliest ~100 billion is highly improbable if trillions more will follow. This forces a significant Bayesian update towards models where humanity goes extinct relatively soon. The bullet bites: our mere position in the birth order becomes strong evidence for imminent doom, a conclusion many find deeply unsatisfying and seemingly divorced from empirical evidence about existential risks.
  2.  **SIA & The Presumptuous Philosopher Bullet:** SIA counters by instructing us to reason as if randomly selected from all *possible* observers across all possible worlds. This directly counteracts Doomsday: while being early *given* a large future population is unlikely, the *existence* of a large future population makes it *more likely* that we exist at all (as one of the many observers it contains). The update cancels out. However, SIA buys this relief at a steep price. Before any experiment, it dictates overwhelming credence towards cosmological theories that postulate vastly larger numbers of observers, regardless of the theory's intrinsic plausibility or predictive power. The Presumptuous Philosopher declares the experiment redundant; the multiverse teeming with life is already proven likely. This feels like epistemic hubris, divorcing belief from empirical testability.

  **Bostrom's Maneuver: Shifting Sands**

  Bostrom proposed dodging both bullets by carefully defining the reference class. Perhaps "human" is too narrow or too broad. If we define the class as "observers in a state qualitatively identical to mine at this moment," the Doomsday Argument weakens, as early and late humans might share the same qualitative state. Conversely, narrowing the class to "observers with my exact birth rank" makes the Doomsday update vanish entirely – I *must* find myself at my birth rank.

  However, this maneuver falters on arbitrariness and instability:
  *   **Arbitrariness:** What constitutes the "correct" qualitative state? Why is "human experiencing morning coffee" privileged over "human" or "sentient being"? The choice seems ad hoc, designed to avoid unwanted conclusions rather than flowing from principle.
  *   **Instability (Sleeping Beauty Test):** Consider Sleeping Beauty: Heads, she's woken once; Tails, woken twice (with amnesia). What should her credence in Heads be upon waking? SSA applied naively (reference class: "wakings") gives P(Heads) = 1/3. Bostrom might suggest the reference class is "subjective moments like this one," leading again to 1/3. Yet, many intuit it should be 1/2, reflecting the fair coin flip. Bostrom could argue for "observer-moments before the experiment" to get 1/2, but this feels equally arbitrary and disconnects the reference class from the evidence (the waking itself). The reference class becomes a dial we twist to get desired answers, undermining objective Bayesianism.

  **Neal's Full Non-Indexical Conditioning (FNC): A Structural Solution**

  Radford Neal's FNC offers a fundamentally different approach. It distinguishes sharply between:
  1.  **Non-Indexical Information (NII):** Objective facts about the world ("There is a coin flip," "Theory T predicts 10^20 observers").
  2.  **Indexical Information (II):** Information about *which* observer/moment you are ("I am experiencing a waking," "My birth rank is n").
  3.  **Centered Evidence (CE):** The specific observation you make *from* your centered perspective ("I see this," "I am experiencing this waking now").

  FNC prescribes:
  *   **Formulate Hypotheses:** Define world models `H_i` specifying all NII and the complete physical configuration (including all observers and their states).
  *   **Assign Non-Indexical Priors:** `P(H_i)` based on NII only – no SSA or SIA bias towards large populations.
  *   **Condition on Centered Evidence:** Upon obtaining centered evidence `E_c` ("I am having experience X at time t in location L"), update by conditioning on the proposition: **"There exists an observer-moment having experience E_c within the world described by H_i."**
      *   `P(H_i | E_c) = P(E_c | H_i) * P(H_i) / P(E_c)`
      *   `P(E_c | H_i) = (Number of observer-moments in H_i having experience E_c) / (Total number of possible observer-moments in H_i? Or just proportional to the number?)` *Neal clarifies: `P(E_c | H_i)` is proportional to the number of observer-moments in `H_i` that are compatible with `E_c`.*
  *   **Treat Indexical Information as Centered Evidence:** Your birth rank `n` isn't a prior constraint; it's evidence `E_c` ("I observe that my birth rank is n") to be conditioned upon.

  **FNC in the Arena:**

  1.  **Presumptuous Philosopher:** FNC delivers a decisive blow. Before any data, priors `P(H_i)` are assigned solely on non-indexical grounds (simplicity, fit with other physics). A theory `H_big` postulating 10^20 observers gets no prior boost over a simpler `H_small` with 10^10 observers simply because it contains more observers. `P(H_big)` starts low if it's complex or implausible. The philosopher is no longer presumptuous; she must wait for empirical data to favor `H_big`.
  2.  **Doomsday Argument:** FNC significantly weakens it. Conditioning on birth rank `n` ("I observe my birth rank is n") *does* provide an update.
      *   Under `H_early` (small total population `N`), observing a low `n` is unremarkable; `P(E_n | H_early)` is moderate.
      *   Under `H_late` (large `N`), observing a low `n` is *less likely* simply because there are many more possible birth ranks (`1` to `N`), most of which are large. `P(E_n | H_late)` is smaller (specifically, proportional to `1/N`). *Crucially, the total number of observers `N` is part of the hypothesis `H_i`.*
      *   Therefore: `P(H_early | E_n) / P(H_late | E_n) = [P(E_n | H_early) * P(H_early)] / [P(E_n | H_late) * P(H_late)] = [ (k / N_early) * P(H_early) ] / [ (k / N_late) * P(H_late) ] = [N_late * P(H_early)] / [N_early * P(H_late)]` (where `k` absorbs constants related to the probability density over birth ranks).
      *   This *does* favor `H_early` over `H_late` if `N_early < N_late`, but **only by a factor of `N_late / N_early`**, not the extreme update of pure SSA. The update is tempered by the prior non-indexical plausibility `P(H_early)` vs `P(H_late)`. If `H_late` (a long future) is deemed intrinsically much more plausible based on non-indexical science (e.g., stable planetary conditions), the birth rank evidence `n` only modestly shifts the needle. FNC avoids the *absurdly strong* Doomsday conclusion while acknowledging that our early position carries *some* information.
  3.  **Sleeping Beauty (FNC's Triumph):** FNC resolves Sleeping Beauty cleanly:
      *   **Hypotheses:** `H_heads` (Coin Heads, one waking), `H_tails` (Coin Tails, two wakings).
      *   **Non-Indexical Priors:** `P(H_heads) = P(H_tails) = 1/2` (fair coin).
      *   **Centered Evidence (upon waking):** `E_c` = "I am experiencing a Sleeping Beauty waking interview now".
      *   **Update:**
          *   `P(E_c | H_heads)`: How many wakings in `H_heads` match `E_c`? **One.** (The single waking on Heads).
          *   `P(E_c | H_tails)`: How many wakings in `H_tails` match `E_c`? **Two.** (Both Monday and Tuesday wakings).
          *   `P(H_heads | E_c) = [P(E_c | H_heads) * P(H_heads)] / P(E_c) = [1 * 1/2] / P(E_c)`
          *   `P(H_tails | E_c) = [P(E_c | H_tails) * P(H_tails)] / P(E_c) = [2 * 1/2] / P(E_c) = [1] / P(E_c)`
          *   Therefore, `P(H_heads | E_c) = (1/2) / P(E_c)` and `P(H_tails | E_c) = 1 / P(E_c)`. Normalizing (so they sum to 1): `P(H_heads | E_c) = (1/2) / (1/2 + 1) = (1/2)/(3/2) = 1/3`; `P(H_tails | E_c) = 1 / (3/2) = 2/3`.
      *   **Result:** Beauty's credence in Heads is 1/3 upon waking. FNC validates the "thirder" position without relying on SSA's potentially problematic reference class definition. It flows directly from conditioning on the centered evidence of *experiencing a waking* and counting the observer-moments compatible with that evidence under each hypothesis. The "halfer" intuition stems from conflating the non-indexical coin flip probability (1/2) with the posterior probability after indexical evidence is obtained.

  **The Verdict: Embracing FNC's Nuanced Coherence**

  While no solution is utterly bulletproof, **Full Non-Indexical Conditioning (FNC) is the stance toward self-locating priors a Bayesian should adopt.** Here's why:

  1.  **Dissolves Presumption:** It eliminates the SIA-induced Presumptuous Philosopher by grounding priors solely in non-indexical theoretical virtues. Cosmological theories stand or fall on their explanatory power and fit with data, not their observer count.
  2.  **Tames Doomsday:** It acknowledges the genuine, but *limited*, information content of our birth rank. The update towards earlier extinction is proportional to the hypothesized population ratio (`N_late / N_early`), not the catastrophically strong update of SSA. Crucially, this update is dominated by *non-indexical* priors based on actual science (e.g., astrophysics, geopolitics). FNC prevents birth rank from being an overwhelmingly dominant factor while respecting its logical force.
  3.  **Solves Sleeping Beauty Uniquely:** FNC provides the most principled and unambiguous resolution to Sleeping Beauty, deriving the 1/3 answer directly from the structure of centered evidence and hypothesis counting, avoiding the reference class arbitrariness that plagues SSA-based solutions and the inconsistency of halfer positions.
  4.  **Bayesian Coherence:** FNC rigorously separates indexical and non-indexical information, treating the former as evidence to be conditioned upon within fully specified world models. This maintains internal consistency and avoids the prior ad hoc adjustments required by reference-class manipulations. It treats the "self" as arising from the evidence within a model, not as a prior constraint on the model.
  5.  **Epistemic Humility:** FNC forces us to base our priors `P(H_i)` on our best non-indexical understanding of the world. We don't get to presume we live in a large universe (SIA), nor are we forced into a doom-laden update merely by counting our place (pure SSA). We must grapple with the actual empirical and theoretical reasons for believing in large futures or existential risks.

  **Conclusion:**

  The choice isn't truly between Doomsday and Presumption; it's between frameworks that generate these paradoxes due to flawed prior structures and one that structurally avoids them. SSA and SIA embed problematic anthropic biases directly into the prior. Bostrom's reference-class tinkering lacks a stable foundation. Neal's FNC, by rigorously distinguishing non-indexical hypotheses from centered evidence, provides the most coherent, defensible, and paradox-resistant framework for Bayesian reasoning with self-locating uncertainty. It delivers the correct verdict in Sleeping Beauty, tames the Doomsday Argument into a reasonable update, and silences the Presumptuous Philosopher. The Bayesian, committed to coherence and learning from evidence, should adopt Full Non-Indexical Conditioning as the foundation for navigating the anthropic landscape. The bullets are dodged not by luck, but by superior architecture.
