prompt: |-
  Hey, so for the science podcast I run on the side, I've got a researcher lined up next week from one of those longtermist/EA-adjacent institutes who works on this concept called "evidential cooperation in large worlds" (ECL). The rough pitch, as I understand it: if the universe or multiverse is big enough, there are tons of agents out there who reason kind of like I do but who I can never causally contact — too far away, different Everett branch, whatever — and because our decisions are correlated (not caused, correlated) I should act as though I'd struck a deal with them: bake some compromise of everyone's values into my choices instead of just pursuing my own, and this is supposed to pay off even though no signal ever passes between us. I read Oesterheld's original report a while back (I think it was called "multiverse-wide cooperation via correlated decision making" before people started saying ECL, correct me if that's wrong) plus a few EA forum threads, so I basically get the gist, but every time I try to explain it out loud to my producer I end up hand-waving at Newcomb's problem and loosing the thread halfway through.

  Can you draft me 8-10 interview questions that get past the "here's the concept" stage? I want at least one that presses on why this specifically needs evidential decision theory, and forces her to say what a committed causal decision theorist would say back; one on how anyone could actually estimate the correlation between their own decision procedure and some agent they can't observe, talk to, or ever get feedback from; one on whether the whole argument just collapses into a fancier, cosmology-flavored version of Kant's universalizability move (or the golden rule) once you strip the multiverse talk out; and one on how much weight the argument puts on contested premises about the universe or multiverse actually being large or branching — what happens to the whole edifice if that turns out false, or just permanently unknowable. For each of those, tack on a quick follow-up keyed to whatever dodge she's most likely to reach for. Bonus if one question gets at the Pascal's-mugging-shaped worry — tiny probability of correlation, times a huge number of correlated agents, times whatever payoff — since that smells a lot like the fanaticism problem that keeps popping up everywhere else in this corner of EA.
reasoning: |-
  Okay, the user runs a science podcast and has an interview coming up with a researcher working on "Evidential Cooperation in Large Worlds" (ECL). They've done their homework—read Oesterheld's original report and some EA Forum threads—but struggle to explain it clearly, especially when connecting it to Newcomb's problem. They want interview questions that go beyond the basics and press on specific conceptual challenges. 

  Hmm, let me unpack their request. They’re clearly familiar with the core idea but wants to avoid surface-level explanations. The four explicit requests are sharp:  
  - **EDT vs CDT tension**: They want the researcher to defend why evidential decision theory is essential here, and how a causal decision theorist would push back.  
  - **Correlation estimation**: How can we possibly quantify correlations with agents we can’t observe or interact with? This is a practical/epistemic hole in the theory.  
  - **Kantian universalizability**: Is ECL just multiverse-washed ethics? They’re suspicious of the novelty.  
  - **Dependency on cosmology**: What if the universe isn’t large/branching? Does the whole argument crumble?  

  The bonus ask about Pascal’s mugging is smart—ECL’s math might invite fanaticism (tiny correlation × huge agents × massive payoff).  

  The user’s tone is analytically skeptical but engaged ("smells a lot like the fanaticism problem"). They’re prepping for pushback, hence asking for follow-ups to common dodges. Their hidden need might be: *Help me pressure-test whether ECL is robust or just philosophically elegant speculation*.  

  For questions:  
  - The EDT/CDT one needs to force a contrast. I’ll frame it around Newcomb (since user mentions it) and demand why CDT’s "no causation, no cooperation" stance fails here. Likely dodge: "But correlations *do* matter!" → Follow-up: "How is that different from wishful thinking?"  
  - Correlation estimation is the weakest link. Researcher might appeal to decision-theory symmetry → Follow-up: "But what breaks the symmetry?" (e.g., if I defect, maybe my copies defect *more*).  
  - Kant angle: Push whether "large worlds" adds anything new. Dodge: "Scale changes the math!" → Follow-up: "Doesn’t Kant capture the *why* without multiverses?"  
  - Cosmology dependency: If the universe is small, does ECL revert to something else? Dodge: "But we have evidence for large worlds!" → Follow-up: "What if it’s untestable?" (forces admission of fragility).  
  - Pascal’s mugging: Hammer the "tiny correlation × huge stakes" risk. Dodge: "We use reasonable priors!" → Follow-up: "Who decides ‘reasonable’?" (high stakes + uncertainty = fanaticism bait).  

  Structure: 8–10 questions with 4–5 deep dives + follow-ups. Tone should be rigorous but accessible (it’s a podcast). Sneak in the "golden rule" comparison early—it’s the user’s pet suspicion.
answer: |-
  Here are 9 interview questions (+ embedded follow-ups) designed to push beyond ECL basics, targeting your specified pain points. Each includes a likely dodge and a sharp follow-up:

  1. **Core Mechanism & Decision Theory**  
     *"ECL relies heavily on evidential decision theory (EDT). Can you walk us through why EDT is *essential* here? Specifically, what happens if we plug in a causal decision theorist (CDT) agent who sees no causal lever to pull? Why shouldn't they just defect?"*  
     **Likely Dodge:** *"CDT agents miss out on correlated gains! EDT correctly updates on the correlation."*  
     **Follow-Up:** *"But isn't that precisely CDT's critique – that you're mistaking correlation (seeing your own decision as *evidence* of others') for causation? How do you respond to the charge that ECL demands EDT agents pay 'epistemic money' for a causal illusion?"*

  2. **The Correlation Estimation Problem**  
     *"Operationalizing ECL requires estimating the strength of correlation between my decision algorithm and these unobservable, uncontactable agents. How do I *actually* assign a probability that some agent in a disconnected Hubble volume or Everett branch is reasoning identically to me *and* that our decisions are sufficiently correlated?"*  
     **Likely Dodge:** *"We use symmetry principles / prior probabilities based on algorithmic similarity in large worlds."*  
     **Follow-Up:** *"Doesn't this risk either arbitrariness or wishful thinking? If I can't test, observe, or falsify the degree of correlation, what prevents me from conveniently assuming high correlation when it benefits 'cooperation' and low correlation when defection is tempting?"*

  3. **Kantian Universalizability vs. Cosmic Scaling**  
     *"Stripping away the cosmology, ECL seems to argue: 'Act as if your choice sets a universal rule, because similar agents *are* likely acting on the same rule.' How is this fundamentally different from Kant's Categorical Imperative or the Golden Rule? Is ECL just providing a *cosmological justification* for an old ethical intuition?"*  
     **Likely Dodge:** *"Scale matters! In a *truly vast* multiverse, the statistical guarantees kick in, making cooperation the uniquely rational choice under EDT, not just an ethical ideal."*  
     **Follow-Up:** *"If the core *prescriptive* force – 'act as if your choice is mirrored' – exists independently of cosmology (as in Kant), doesn't the multiverse machinery risk being an elaborate just-so story? What unique *normative* work does the 'Large World' actually do here?"*

  4. **Dependency on Cosmological Premises**  
     *"ECL's viability seems heavily contingent on speculative cosmology: a vast or infinite universe/multiverse with many causally disconnected regions containing 'similar' agents. What happens to ECL if we discover our universe is finite and small, or if the many-worlds interpretation is false? Does the argument retain *any* force, or does it collapse?"*  
     **Likely Dodge:** *"Current evidence (CMB, inflation) strongly suggests a vast universe; MWI is plausible. We work with best available models."*  
     **Follow-Up:** *"But if the *possibility* of a large world is permanently epistemically inaccessible – if we can *never* confirm its vastness or the existence of these correlated agents – does ECL reduce to an argument for cooperation based on *unfalsifiable* cosmic uncertainty? How is that action-guiding?"*

  5. **Pascal's Mugging & Fanaticism**  
     *"ECL involves multiplying tiny estimated probabilities of correlation by astronomically large numbers of potential agents and huge stakes. This resembles Pascal's Mugging structures, where tiny probabilities dominate reasoning. How does ECL avoid collapsing into fanaticism – demanding extreme sacrifices based on minuscule chances of cosmic-scale payoffs?"*  
     **Likely Dodge:** *"We use reasonable priors / bounded utility functions / focus on high-confidence similarities."*  
     **Follow-Up:** *"Who defines 'reasonable'? When dealing with potential astronomical stakes across vast worlds, doesn't even an *infinitesimal* subjective probability of high correlation swamp *all* finite, local concerns? Doesn't ECL structurally incentivize fanatical devotion to increasing the *estimated number* of correlated agents or the *estimated payoff*?"*

  6. **The Bargaining Problem (Value Aggregation)**  
     *"ECL proposes 'baking a compromise of everyone's values' into decisions. How is this compromise defined? How does my algorithm weigh my values against the potentially alien or incommensurable values of a simulated mind in a Boltzmann brain, or an agent evolving under vastly different physics?"*  
     **Likely Dodge:** *"We focus on agents sufficiently 'similar' to share core reasoning, perhaps valuing reflection, goal-achievement, or avoiding suffering."*  
     **Follow-Up:** *"Doesn't this 'sufficiently similar' filter reintroduce arbitrariness? If I'm a human valuing biodiversity, and a 'similar' AGI values paperclip maximization, how does ECL resolve whose values get weighted more in the 'compromise'? Isn't this just smuggling in *my* values again?"*

  7. **Feedback Loops & Self-Fulfilling Prophecies**  
     *"Since I can never observe the 'others,' isn't my belief in their existence and correlation entirely dependent on *my own* decision algorithm and priors? Couldn't this create a self-fulfilling prophecy where agents committed to ECL *assume* high correlation and thus 'cooperate,' while non-ECL agents *assume* low correlation and defect – with no external reality check?"*  
     **Likely Dodge:** *"The correlation exists objectively based on algorithmic similarity in the multiverse state."*  
     **Follow-Up:** *"But *my access* to that objective fact is purely through my priors and decision theory. If my algorithm *doesn't* start with strong symmetry priors, won't it conclude defection is rational, potentially breaking the correlation for *actual* similar agents? Doesn't this make ECL stability fragile?"*

  8. **Testability & Pragmatic Payoff**  
     *"Beyond abstract decision theory elegance, what *pragmatic, measurable* difference does acting on ECL make *here and now* compared to, say, robust cooperation within our light cone or Kantian ethics? Can you give a concrete example where ECL prescribes a different, better action?"*  
     **Likely Dodge:** *"It ensures robustness against existential risk in vast worlds / prevents cosmic defection traps."*  
     **Follow-Up:** *"How do we *verify* that robustness? If the payoff is inherently unobservable (actions in disconnected regions), doesn't this make ECL functionally equivalent to acting *as if* it's true for psychological/moral reasons, rather than a testable claim about rational payoff maximization?"*

  9. **The 'Deal' Metaphor & Counterfactuals**  
     *"ECL is often framed as 'striking a deal' with these agents. But a real deal involves communication, commitment, and enforcement. Here, none exist. How does reasoning *as if* a deal exists, when it demonstrably *doesn't* (no signals possible), generate real payoff? Isn't this just optimizing for a counterfactual fantasy?"*  
     **Likely Dodge:** *"The correlation *is* the enforcement. My decision *is* evidence of theirs."*  
     **Follow-Up:** *"But isn't that circular? I cooperate *because* I think they cooperate because they think I cooperate... all based on an initial prior assumption of correlation. What *grounds* this loop in reality, preventing it from being an exercise in navel-gazing?"*

  **Key Interview Strategy:**  
  *   **Listen for Hand-Waving:** When she mentions "symmetry," "priors," "similarity," or "scale guarantees," press her on the *how* and the *why*.  
  *   **Force Trade-offs:** Make her explicitly state what ECL *doesn't* apply to or when it might prescribe suboptimal local actions.  
  *   **Highlight Contingency:** Constantly tie arguments back to the dependence on unprovable cosmic scales and EDT.  
  *   **Bridge to Familiar Concepts:** Explicitly link her answers back to Kant, Pascal, Newcomb, and real-world cooperation dilemmas to keep listeners anchored.  

  Good luck with the interview! This is thorny stuff, but these questions should cut through the initial gloss.
