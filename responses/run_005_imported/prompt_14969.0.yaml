  Hmm, the user is a novelist grappling with a narrative dilemma. This isn't just about technical writing choices—it's about philosophy of history and causality. They're essentially asking whether individual agency or structural forces "really" cause historical events. That's a profound question disguised as a craft issue.

  I notice they've already drafted both versions, which shows they're a practical writer testing solutions. The frustration comes from both approaches feeling equally authentic yet mutually exclusive. The core tension seems to be between micro and macro truths. 

  What's interesting is they frame it as "two different claims about what actually caused it." That language suggests they might be unconsciously buying into a false dichotomy. In reality, strikes (like most historical events) are always both personal and structural. The famous 1912 Bread and Roses strike actually began with a single worker throwing her pay envelope at a foreman—after years of wage cuts orchestrated by absentee owners.

  The user's phrase "the town got swept up in something bigger" reveals their instinctive understanding of emergent phenomena. That's key! Complex systems theory shows how collective action emerges from individual choices within constraints. Maybe I should emphasize that Nell's "enough" moment only matters because the structural conditions made that spark catch fire.

  They might also be wrestling with point of view limitations. A strictly Nell-centered chapter risks missing the orchestration behind the scenes, while a zoomed-out version could lose emotional punch. But why choose? Many labor novels (think Steinbeck or Upton Sinclair) use rotating perspectives precisely for this.

  ...Wait, their last sentence asks if these are "competing explanations." That's the hinge! I should reframe this as complementary lenses. Like how a microscope and telescope show different truths about stars. Nell's rage is the ignition; the union groundwork is the kindling; the wage cuts are the fuel. All necessary, none sufficient alone.

  The solution might be structural—not just philosophically but in chapter architecture. Maybe start with Nell's visceral breaking point, then pull back to reveal how her private rage mirrors others', then show the organizers recognizing this critical mass. Or use dramatic irony: have Nell unknowingly walk past union flyers on her way to her confrontation.

  Also worth noting: they call the personal approach "the sum of a hundred people making choices." That's exactly right! But sums aren't just additions—they're multiplicative when conditions align. The chapter could subtly show how Nell's individual act becomes collective only because the structural groundwork made solidarity possible.

  The user's anxiety about "dishonesty" suggests deep respect for historical complexity. That's admirable. They might benefit from reading actual strike testimonies where workers describe both personal catalysts ("I snapped when he docked pay for my sick child") and systematic analysis ("we'd been bleeding for years"). Truth lives in that dialectic.

