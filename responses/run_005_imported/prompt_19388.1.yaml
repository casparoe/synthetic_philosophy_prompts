  Notably, the user wants "careful reconstruction" not textbook summaries. They've likely read the basics and spotted this tension. I'll avoid rehashing Pylyshyn 101 and focus on the attention loophole critique. The strongest defense might be the "asymmetry argument": attention can be disabled while core perception persists (e.g., inattentional blindness), suggesting separable mechanisms. 

