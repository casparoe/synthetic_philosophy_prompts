  Hmm, what makes this particularly brutal is the compound effect of three dynamics: First, the context collapse where random internet strangers who don't understand local nuances are driving the narrative. Second, the pile-on effect where each small comment creates this suffocating avalanche. Third, the lack of counter-voices making it feel like unanimous opposition. 

  The user's question about whether this is meaningfully different than face-to-face disagreement is sharp. Physiologically, yes - studies show online swarms trigger stronger threat responses because our brains can't gauge the actual size/risk of the "mob". The anonymity factor also removes normal social brakes on aggression. 

  What they're not saying but probably feeling: betrayal by the neighbors who privately agreed but stayed silent, and maybe shame about their own hesitation to re-engage. The fact they've talked themselves out of two meetings suggests real trauma. 

  Professional angle: This is classic "context collapse" meets "availability cascade". The news site reduced their complex concern to clickbait, then outsiders who dominate local FB groups (happens everywhere!) ran with it. The neighbors' silence is common - people underestimate how much public support matters in these situations. 

