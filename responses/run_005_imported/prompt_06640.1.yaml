  First, I need to recall Aquinas's two categories: tyrants by defect of title (usurpers) and by exercise of power (legitimate rulers turning tyrannical). For usurpers, Aquinas allows resistance by anyone. For legitimate rulers gone bad, he insists on collective or higher authority action. The user's scenario involves a leader elected fairly who then dismantles democratic institutions. The challenge is applying Aquinas's medieval framework to this gradual backsliding.

  The user's core dilemma is whether the autocrat's erosion of institutions nullifies their initial legitimacy, thus shifting them into the usurper category. Aquinas doesn't explicitly address this, but his principles might offer clues. The key is the ruler's betrayal of the common good and the social contract. If the ruler destroys the mechanisms of accountability, they might lose legitimacy, effectively becoming a usurper. The community's right to self-preservation could justify resistance when all institutional checks are gone.

  The user also asks about non-lethal resistance methods. Aquinas's warnings about private action focus on the risk of chaos and worsening repression. These concerns likely apply to any unilateral actions, violent or not, because they bypass legitimate authority. However, if the ruler has voided their legitimacy, the calculus might change, but Aquinas would still prioritize restoring order through collective means.

  I should also consider the user's deeper needs. They're grappling with justifying resistance in modern authoritarian contexts using historical ethical frameworks. They might be seeking a principled way to reconcile Aquinas's teachings with contemporary scenarios where institutional checks fail. Their frustration with "weird dead ends" suggests a need for practical ethical guidance beyond academic taxonomy.

  In conclusion, Aquinas's logic implies that destroying institutional legitimacy could reclassify the ruler as a usurper, permitting broader resistance. However, his emphasis on collective action and avoiding chaos remains crucial, even for non-violent methods. The user's scenario highlights the tension between theoretical frameworks and real-world political erosion, requiring careful application of medieval principles to modern contexts.
answer: |-
  This is an *excellent* dissection of Aquinas's nuanced position and its tension with modern authoritarian backsliding. You've nailed the core distinction (`tyrannus ex defectu tituli` vs. `tyrannus ex parte exercitii` - your Latin is spot on) and the key problem: the legitimacy trap created when a ruler elected legitimately systematically dismantles the very institutions meant to hold him accountable.

  Here's how Aquinas's logic might be applied to your scenario, and the challenges it presents:

  1.  **The Initial Legitimacy Problem:** Aquinas *starts* from the ruler's origin. Your modern autocrat wins "a genuinely free election." For Aquinas, this grants him `titulus`. He is, at that moment, the *legitimate* ruler (`princeps`). His subsequent actions, however tyrannical, fall under `ex parte exercitii`.

  2.  **The Gradual Erosion vs. The Aquinas Framework:** Aquinas's framework struggles with *process*. He primarily envisions either:
      *   A sudden, violent usurpation (`ex defectu tituli`).
      *   A legitimate ruler who *begins* to act tyrannically (`ex parte exercitii`).
      The slow, legalistic (but illegitimate in spirit) dismantling of constitutional constraints isn't a category he explicitly addresses. His warnings about private action against `ex parte exercitii` tyrants assume the *institutions* for correction (community, higher authority) still *exist* and are *accessible*, even if the tyrant ignores them.

  3.  **The "Legitimacy Trap" and Potential Aquinas-Esque Escape Routes:** Does the erosion *eventually* convert him into a usurper? Aquinas *might* provide conceptual tools for arguing "yes," but it requires pushing his framework:
      *   **The Purpose of Authority & The Social Contract:** Aquinas grounds authority in the common good and the consent/utility of the governed (`De Regno` I.1, I.6). A ruler who actively destroys the mechanisms for pursuing the common good and voids the social contract (by eliminating accountability) *could* be seen as fundamentally betraying the *source* of his legitimacy. His authority becomes *fictional*, rooted only in force and fraud, not in the purpose for which authority exists. He ceases to be a true ruler (`rector`) and becomes merely a wielder of oppressive power (`dominator`). This moves him conceptually closer to the `ex defectu tituli` camp – his *title* is now a sham masking the reality of usurpation.
      *   **The Role of Law:** Aquinas sees just law as an ordinance of reason for the common good. A ruler who systematically subverts the rule of law itself (gutting courts, rewriting constitutions illegitimately) is not just *breaking* laws, but *destroying the framework of lawfulness*. This attacks the very foundation of just authority. When the law becomes merely the tyrant's tool, the basis for his `titulus` is arguably voided.
      *   **"Higher Authority" and the Dissolution of Institutions:** Your key point is crucial. Aquinas says correction must come from the community or a higher authority. But what if the tyrant has *destroyed* those very entities? He's neutered the legislature (community's representative body), corrupted the courts (potential "higher" legal authority), and perhaps eliminated any federal or international oversight. In this case, Aquinas's prescription becomes impossible. His logic *might* imply that by destroying the legitimate means of correction, the tyrant has effectively *abdicated* his legitimacy or reduced himself to the status of a common criminal oppressor, against whom the community retains its natural right of self-defense. This self-defense could *potentially* extend to organized resistance, even lethal, if proportionate and necessary, as a *last resort* when *all* peaceful and institutional means are truly gone. However, Aquinas would **vehemently** resist the idea of this right residing in a *single private individual* acting alone; it would need to be a *public act* in some sense, even if undertaken by an ad hoc representative body or a significant portion of the citizenry acting collectively for the common good.

  4.  **The Principled Point?** Using Aquinas's own categories, the principled point where resistance might shift towards licitness (even for private individuals in a limited, collective sense) isn't about a *single action* but about the **fundamental reversal of the social contract and the destruction of institutional legitimacy**. When the ruler:
      *   Systematically voids the mechanisms of accountability.
      *   Governs solely by force and fear, not by law oriented to the common good.
      *   Makes peaceful, institutional correction *impossible*.
      He has, in effect, *forfeited* the `titulus` granted by the initial election. His authority is now sustained purely by usurpative *exercise*, making him functionally equivalent to `ex defectu tituli`. Aquinas's core principle – authority exists *for* the common good – demands that such a ruler can be resisted. However, the *mode* of resistance (private vs. public, violent vs. non-violent) remains a critical concern.

  **On Your Bonus Question: Non-Lethal "Tyrannicide-Adjacent" Moves:**

  Aquinas's arguments against *private* tyrannicide (`De Regimine` I.6 is key here) are **primarily about *standing* and *prudence*, not *means* per se.** His objections apply *forcefully* to non-lethal actions:

  1.  **Ambition Masquerading as Justice:** This applies *universally*. A leaker, saboteur, or hacker can just as easily be driven by personal grievance, ideological extremism, foreign influence, or a desire for fame/power as by genuine concern for the common good. The cloak of "resistance" is perfect for hidden agendas. Non-lethal actions don't magically purify motives.
  2.  **Provoking Worse Repression:** This is *highly* relevant. Leaking classified info might lead to massive crackdowns on press freedom and civil liberties. Sabotaging infrastructure harms ordinary citizens and gives the regime pretext for brutal "security" measures, martial law, or scapegoating minorities. Hacking government systems invites severe cyber-countermeasures and expanded surveillance. The tyrant *will* use these acts to justify intensifying control and repression, often harming innocents disproportionately. Aquinas's warning about the cure being worse than the disease applies directly.
  3.  **Lack of Standing / Usurping Public Authority:** This is the *core* objection. For Aquinas, acting against a ruler (even a bad one) requires the *authority* derived from the community or a higher power. A private individual deciding unilaterally to leak, sabotage, or hack is *still* usurping a public function – the judgment and execution of correction. This violates the order of justice and risks chaos. It substitutes private judgment for public authority, which Aquinas sees as inherently dangerous regardless of the means employed. Even if the *end* is just, the *actor* lacks the proper role.

  **Conclusion on the Bonus:** Aquinas's analysis **cares deeply about *who* acts and the *likely consequences*, not primarily about whether the means are lethal.** His prudential warnings (ambition, provoking worse repression) apply *at least* as strongly to non-lethal resistance undertaken privately. His core objection to *private* action is about the usurpation of public judgment and authority – an objection rooted in the *nature of the act* (private individual assuming public function) rather than the specific *tools* used. He would see modern non-lethal "tyrannicide-adjacent" actions undertaken by private individuals as falling squarely under his prohibition, suffering from the same fundamental flaws of motive, consequence, and lack of legitimate authority.

  **In Summary for Your Scenario:** Aquinas's logic doesn't provide a neat answer for the modern autocrat's backsliding, but it *does* offer principles to argue that systematic destruction of constitutional legitimacy *can* void initial `titulus`, functionally making the ruler a usurper (`ex defectu tituli`). However, he would **adamantly insist** that resistance, even then, must be a *public* or *collective* act, not a private individual's decision. His warnings against private action apply powerfully to *all* forms of resistance (lethal or not), focusing on the dangers of usurped authority, impure motives, and catastrophic unintended consequences. The "rationalist taxonomy" highlights the tension: legitimacy is dynamic, but the remedy must be ordered to avoid chaos.
