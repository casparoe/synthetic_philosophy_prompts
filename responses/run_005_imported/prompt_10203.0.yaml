  The post-Brexit migration figures pose a more nuanced challenge. Here I must separate Dummett's explicit principles from speculative application. His distinction between forced/voluntary migration (textual) suggests he'd view work/study visas differently from asylum seekers. The racism analysis requires careful handling - while the Windrush scandal confirmed his historical thesis, the current paradox of loosened economic migration amid asylum hostility needs contextualizing through his lens of "xenophobic spectacle" (textual concept extended speculatively).

  Throughout, I'll maintain clear signposting: direct citations for Convention compliance arguments, demographic thresholds, and racism historiography; reasoned speculation for applying "submersion" tests to modern visa categories or interpreting political rhetoric motives. The user specifically requested this transparency.

  The response structure should mirror their query sequence: Rwanda policy → "invasion" rhetoric → migration figures → racism paradox. Each section will first state Dummett's definite position (text-based), then offer constrained extrapolation where needed, always grounding speculation in his documented worldview. The conclusion will emphasize how his framework remains diagnostic despite new complexities - precisely what their friend claimed and they questioned.
answer: |-
  Based on Dummett's explicit arguments in *On Immigration and Refugees* and his documented activism, here's a reasoned reconstruction of how he would likely assess the current UK policies, distinguishing clearly between textual evidence and necessary extrapolation:

  1.  **The Rwanda Scheme:**
      *   **Dummett's Actual Commitment (Textual):** Dummett was an *absolute* proponent of compliance with the 1951 Refugee Convention and the principle of *non-refoulement*. He saw the Convention as the bedrock of refugee protection and condemned attempts to circumvent it. He specifically warned against schemes designed to deter asylum claims by making the process inhumanely harsh or removing applicants to potentially unsafe situations, viewing this as a betrayal of legal and moral obligations.
      *   **Assessment:** Dummett would have **vehemently condemned the Rwanda scheme**.
          *   **Textual Basis:** The Supreme Court's ruling, based on the risk of *refoulement*, aligns *directly* with Dummett's core, repeatedly stated principle that the Convention must be upheld. He would see the scheme's *purpose* (deterrence through removal) and its *mechanism* (offshoring responsibility to a country deemed unsafe for *refoulement*) as fundamental violations of the Convention he championed. His book consistently argues against "safe third country" concepts used to evade responsibility.
          *   **Speculative Extrapolation:** He would likely view it as a particularly cynical and cruel escalation of the restrictionist policies he documented historically, designed not for genuine burden-sharing but to avoid obligations through deliberate harshness.

  2.  **The "Invasion" Framing of Small-Boat Crossings:**
      *   **Dummett's Actual Commitment (Textual):** His response to Thatcher's "swamped" comment is key. He granted the *abstract possibility* of a "right not to be submerged," but argued it had an *extremely narrow scope* requiring a *realistic prospect* of the nation's character being fundamentally altered *against its will* by immigration. Crucially, he argued Britain in his time (and implicitly, by the logic of his demographic arguments, likely always) was nowhere near this threshold. He saw such rhetoric as inflammatory scaremongering, often rooted in racism, designed to justify harsh policies rather than describe reality.
      *   **Assessment:** Dummett would have **dismissed the "invasion" framing as dangerous, inflammatory rhetoric utterly disconnected from demographic reality**.
          *   **Textual Basis:** He explicitly argued against similar rhetoric ("swamped") by pointing to the actual numbers and the capacity of societies to absorb newcomers without fundamental change. The small number of Channel crossings relative to the UK population (tens of thousands vs. tens of millions) would, on his own narrow test, fall laughably short of constituting any realistic "submersion" or "invasion." He would see it as a deliberate misuse of language to dehumanize asylum seekers and stoke fear.
          *   **Speculative Extrapolation:** He would likely connect this directly to his historical thesis, seeing "invasion" as a modern manifestation of the same xenophobic tropes used against Commonwealth migrants – framing vulnerable people seeking refuge as a hostile, existential threat.

  3.  **Post-Brexit Migration Figures (700k+ peak, composition: work/study visas, Ukrainians/Hong Kongers):**
      *   **Dummett's Actual Commitment (Textual):** Dummett distinguished between refugees/asylum seekers (protected by the Convention) and other migrants. While generally arguing for more open immigration policies driven by compassion and fairness (especially regarding family reunion and former colonial subjects), his strongest *principled* arguments (the "yardstick") focused on the *absolute obligation* towards refugees and the *demographic implausibility* of "submersion" claims. His historical analysis focused on the *racist motivations* behind restrictionist laws targeting non-white Commonwealth citizens.
      *   **Assessment:**
          *   **Submersion Test (Textual Application):** Applying his own narrow "right not to be submerged" test, Dummett would **categorically reject the idea that 700k net migration constitutes "submersion."** His argument against Thatcher's "swamped" comment relied on demographic reality: societies can absorb significant numbers without fundamental change. High numbers alone wouldn't trigger his criterion; it requires an *existential threat to national character*, which he saw as implausible for a country like Britain. The composition (large proportion on temporary visas like study, specific humanitarian schemes) makes the "submersion" argument even weaker on his terms.
          *   **Racism Thesis vs. Current Composition (Speculative Extrapolation):** This is the most complex part and requires careful extrapolation.
              *   Dummett's core historical thesis was that post-war restrictionism was *primarily driven by racism* against non-white Commonwealth citizens. The current situation presents a seeming paradox: record high *non-white* migration via work/study/humanitarian routes *alongside* extreme hostility towards a smaller group of (predominantly non-white) asylum seekers arriving by boat.
              *   **Reconciling using Dummett's Framework:**
                  *   **Selective Control & "Good vs. Bad" Migrant Narrative:** Dummett would likely see this not as a contradiction, but as a *refinement* of racist/xenophobic politics. The government exerts *highly selective control*: welcoming migrants deemed economically useful or politically expedient (Ukrainians post-invasion, Hong Kongers as a stance against China), while demonizing and seeking to harshly exclude those arriving spontaneously to claim asylum (often from different, poorer, black/brown-majority nations). This creates a "good migrant/bad migrant" dichotomy.
                  *   **Rhetorical Focus & Scapegoating:** The fierce rhetoric against boat arrivals serves a political purpose. It provides a visible, emotive scapegoat ("invasion," "breaking our laws") to channel public anxiety about immigration *in general*, even when the *majority* of immigration causing numerical increases is happening through routes the government itself controls and facilitates. The asylum seekers become the symbolic target for broader unease.
                  *   **Continuity in Demonization:** While the *targets* and *mechanisms* differ from the Windrush era, Dummett would likely see the *demonization* of vulnerable non-white migrants arriving in ways that challenge state control as a *continuation* of the racist logic he documented. The Windrush scandal itself involved people with full legal rights being reclassified as "illegal" due to state hostility and bureaucracy – a similar dynamic of exclusion based on origin and mode of arrival.
                  *   **Underlying Xenophobia:** He might argue that the *acceptance* of high work/study migration doesn't negate underlying xenophobia or racism; it simply demonstrates that economic utility or geopolitical strategy can sometimes override it for *specific groups*, while the *scapegoating impulse* finds its outlet elsewhere (the small boats). The hostility towards asylum seekers reveals the persistent undercurrent he identified.

  **Summary Judgment by Dummett's Yardstick:**

  *   **"Submersion" (Textual):** Neither the small boat crossings nor the overall net migration figures (even at 700k+) would come *remotely close* to meeting Dummett's extremely narrow criterion for triggering a "right not to be submerged." He would dismiss such claims as demographically unfounded scaremongering. **(Strong textual basis)**
  *   **Convention Compliance (Textual):** The Rwanda scheme is a clear, deliberate violation of the Refugee Convention principle of *non-refoulement*, which Dummett held as sacrosanct. He would condemn it unequivocally. **(Strong textual basis)**
  *   **"Invasion" Rhetoric (Textual/Extrapolation):** He would view this as a dangerous, inflammatory, and demographically absurd framing designed to dehumanize asylum seekers and justify cruel policies, directly analogous to the "swamped" rhetoric he debunked. **(Textual basis for debunking similar rhetoric, extrapolation to current term)**
  *   **Racism & the Current Paradox (Extrapolation):** Dummett would likely see the current situation not as a refutation of his racism thesis, but as a complex evolution of it. The selective welcoming of some non-white migrants while fiercely demonizing others (based on origin, mode of arrival, and legal status) reflects a refined politics of control and scapegoating. The intense focus on small boats channels xenophobic anxieties, serving a similar exclusionary function as the racist laws targeting Commonwealth citizens, even amidst larger, government-sanctioned migration flows. **(Reasoned extrapolation based on his core thesis about racist/xenophobic motives in restrictionism and the history of state hostility towards vulnerable non-white migrants.)**

  In essence, your friend is likely correct that Dummett's framework provides a powerful critical lens: the "submersion" test exposes the demographic dishonesty of the rhetoric, and the Convention compliance test condemns policies like Rwanda. The apparent paradox of high migration and fierce asylum rhetoric is resolvable within Dummett's broader analysis of racism and xenophobia as the driving forces behind exclusionary politics, even when manifested in new and complex ways. He would see the current policies, particularly regarding asylum, as a continuation of the harmful restrictionist legacy he spent his life fighting.
