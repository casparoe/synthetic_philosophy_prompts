  2. **Ergodicity economics**: This is a more recent and controversial approach. It challenges the standard use of expected value in economics. While it has gained some attention, it is not universally accepted and has been criticized by mainstream economists. However, it does point out a real issue for multiplicative processes.

  3. **Log utility is arbitrary**: This is a standard view in expected utility theory. It says that log utility is a choice, and other utility functions (like power utility) are equally valid. This is defensible because expected utility theory is the dominant framework for decision-making under uncertainty.

  4. **Almost-sure long-run dominance**: This is a mathematical fact. However, it's a very long-run property and may not be relevant for finite horizons. Also, in the short run, the Kelly bettor might have a high chance of losing to a more aggressive bettor. So while true, it's not always practical.

  5. **Samuelson's objection**: Samuelson was a Nobel laureate, and his criticism is taken seriously. He argued that expected utility theory with a utility function that reflects risk aversion is sufficient, and that the long-run argument for log utility is flawed because it ignores the fact that individuals might not be able to wait for the long run. This is a strong counter-argument.

