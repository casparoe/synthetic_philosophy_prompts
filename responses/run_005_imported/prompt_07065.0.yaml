prompt: |-
  I've been reporting a story on how people make calls when they can't pin down the odds, and one conversation from my interviews keeps nagging at me. My source is a nurse choosing between two job offers before Friday. Hospital A has been through three rounds of layoffs already, so HR just told her straight up: "historically about one in five nurses in this unit get cut within eighteen months." Hospital B is a brand-new clinic backed by a health-tech startup, and literally nobody can give her a number — not the recruiter, not her friends already working in health-tech, not even the founders themselves. It could fold within a year, or it could take off and everyone gets promoted twice over. When she actually sat down and ran the math on pay, benefits, and the odds of getting promoted, she figured the expected value at the startup clinic was probably at least as good as staying at Hospital A, maybe better. But she still can't bring herself to pick it, and when I pushed her on why, all she said was "at least I know what im dealing with at A," which felt more like a feeling dressed up as a reason than an actual answer.

  I brought this up with some friends over drinks and it turned into a whole argument. One friend insisted she's just risk-averse, full stop, end of story. Another said no, that's not it exactly — not knowing the odds at all seems to be doing something different in her head than just knowing the odds are mediocre, and he couldn't explain why that should matter but was adamant that it does. So now I'm stuck: is she being irrational here, or is there an actual case for treating "nobody can tell you the odds" as worse than "you know the odds and they're not great"? And practically speaking, what would you tell her to do?
reasoning: |-
  Okay, let me unpack this problem. The journalist is reporting on decision-making under uncertainty and has this nurse case that's bothering them. The nurse has two job offers: Hospital A with known but bad odds (20% layoff chance), and Hospital B with complete uncertainty (startup clinic). Even though the nurse calculated that Hospital B's expected value might be better, she can't bring herself to choose it. Her explanation - "at least I know what I'm dealing with at A" - feels emotional rather than logical. The journalist's friends debated whether this is simple risk aversion or something deeper about ambiguity.

  First, I need to understand why known risk feels different from total uncertainty. From behavioral economics, Knightian distinction between risk (known odds) and uncertainty (unknown odds) seems relevant here. People often treat ambiguity as worse than known bad odds, even when expected values are similar. That might explain her reaction better than standard risk aversion models.

  The Ellsberg Paradox comes to mind - it demonstrates how people prefer known probabilities over ambiguous ones, even when the ambiguous option has identical or better expected value. That matches the nurse's situation perfectly. She's not just avoiding risk; she's avoiding the discomfort of not being able to quantify the risk at all.

  There's also the psychological aspect. At Hospital A, she can mentally prepare - "I'll work hard to be in the 80% who stay." At the startup, there's no clear threat model. Is failure due to market? Funding? Management? The lack of control variables makes it scarier. Plus, she's a nurse - her profession values stability, so unknown risks in healthcare might trigger extra caution.

  For practical advice: I should acknowledge her feeling is valid but suggest reframing. Instead of comparing "known bad vs unknown," she could assess what she'd gain from the startup experience even if it fails - skills, networks, resume value. Also, since she did the math, maybe stress-testing those assumptions would help. What if she asked the startup founders tougher questions about runway? That might reduce ambiguity.

  The journalist's core question is about rationality. Is she irrational? Not really - ambiguity aversion is well-documented. But she might be undervaluing upside potential due to loss aversion framing. The key is helping her see past the discomfort of uncertainty to evaluate real opportunity costs.
answer: |-
  This nurse is wrestling with a profound psychological and economic distinction: **known risk vs. ambiguity (Knightian uncertainty)**. Her reaction isn't irrational—it's deeply human and rooted in well-documented cognitive biases. Here's why "nobody can tell you the odds" *feels* worse, and how to advise her:

  ### Why Ambiguity Feels Worse Than Known Risk
  1.  **The Ellsberg Paradox:** People consistently prefer known probabilities (even bad ones) over ambiguous ones. In experiments, subjects choose urns with *known* 50/50 red/blue balls over urns with *unknown* ratios—even when the expected value is identical. Ambiguity itself carries a psychological cost.
  2.  **Illusion of Control:** At Hospital A, she knows the threat (layoffs) and can *strategize* ("I'll work harder," "I'll network," "I'll track seniority"). At the startup, the threat is formless—market collapse, founder error, regulatory hurdles? No actionable defense exists.
  3.  **Planning Paralysis:** Known risks allow contingency planning ("I'll save 6 months of expenses"). Total uncertainty makes planning impossible, creating existential anxiety.
  4.  **Regret Aversion:** If Hospital A lays her off, she can rationalize it ("20% chance happened"). If the startup fails, she’ll agonize over "unknowable" risks she "should have guessed," amplifying regret.
  5.  **Professional Identity Threat:** Nurses deal in concrete realities (vitals, protocols). A startup’s abstract, unquantifiable risk clashes with her instinct for measurable stability.

  ### Is She Being Irrational?
  **No—but she may be undervaluing opportunity.** Her aversion to ambiguity is evolutionarily rational (uncertainty = danger). However, if her *own math* shows the startup’s **expected value (EV) is equal or higher**, rejecting it *solely due to ambiguity* means she’s overpaying for psychological comfort. Key caveats:
  - **Her EV calculation is speculative.** Did she underestimate the startup’s failure risk? Overestimate promotion odds?
  - **"Risk-averse" oversimplifies.** She’s not rejecting *risk* (Hospital A is risky!); she’s rejecting *ambiguity*. Your second friend is closer—it’s the **unknown-ness** that terrifies her.

  ### What to Tell Her: A Practical Framework
  1.  **Validate Her Feeling:**  
      *"Your hesitation makes perfect sense. Humans are wired to fear the unknown more than known dangers. Hospital A gives you a clear enemy; the startup feels like facing invisible snipers."*

  2.  **Reframe the "Known" Risk:**  
      *"You ‘know’ Hospital A’s odds, but do you? HR’s ‘1 in 5’ stat—is it outdated? Does it account for another recession? Your role/specialty? ‘Known’ risks often feel more controllable than they are."*

  3.  **Quantify the Ambiguity (Try!):**  
      *Ask the startup:*  
      - "What’s your runway? How many months of payroll can you cover *if revenue stops today*?" (If <12 months: red flag).  
      - "What’s your Plan B if Series B funding falls through?" (Vague answers = high ambiguity).  
      *Even rough estimates ("30% chance they last 2 years") beat total unknowns.*

  4.  **Assess Non-Financial Factors:**  
      - **Downside Tolerance:** Could she find a new job in 3 months if the startup folds? If yes, ambiguity is less dangerous.  
      - **Upside Potential:** Would 2 years at a successful startup accelerate her career more than 5 years at Hospital A?  
      - **Psychological Fit:** Does she thrive in chaos or crumble? Honesty here is key.

  5.  **Make Ambiguity an Active Choice:**  
      *"This isn’t ‘safe vs. risky.’ It’s ‘predictable struggle’ vs. ‘unpredictable opportunity.’ Choosing the startup isn’t ignoring risk—it’s betting on your ability to adapt to surprises, which has value too."*

  ### The Verdict
  If she verified the startup’s runway (>18 months), has savings, and values career acceleration, **she should seriously consider Hospital B**. But if ambiguity will haunt her daily, eroding her mental health and performance, **Hospital A is valid**. Stability isn’t just financial—it’s cognitive bandwidth for patient care.

  > **TLDR:** Her fear isn't irrational—ambiguity *is* psychologically worse than known risk. But if her math holds, rejecting the startup means paying a premium for emotional comfort. Advise her to: **1) Pressure-test the startup’s viability,** **2) Assess her personal downside tolerance,** and **3) Reframe the choice as "controlled struggle vs. high-potential chaos."** Sometimes the rational choice requires embracing the discomfort of not knowing.
