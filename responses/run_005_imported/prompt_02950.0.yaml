  **Reasoning:**

  1.  **Expander-graph counterexample (Most Damaging):** Directly falsifies IIT's core mathematical claim that high Φ corresponds to consciousness. Demonstrates the formalism yields absurdly high Φ for systems universally agreed to be non-conscious, invalidating Φ as a sufficient measure. Forces abandonment or radical revision of the core calculus.
  2.  **Unfolding argument:** Creates a fundamental dilemma: either IIT is false (as unfolded networks are functionally identical but have Φ=0) or it becomes unfalsifiable (by allowing arbitrary causal structure definitions). Directly attacks IIT's reliance on specific causal structure as constitutive of consciousness.
  3.  **Exclusion postulate:** Leads to highly counterintuitive consequences (e.g., ruling out conscious subcomponents or aggregates). While a core postulate, proponents *could* potentially modify it (e.g., allow subordinate complexes) without fully abandoning the theory's mathematical core, though it would weaken its uniqueness claims.
  4.  **Pseudoscience letter:** Challenges IIT's scientific status based on panpsychism and alleged untestability. However, this is more a methodological/philosophical critique. A committed proponent can argue panpsychism is a consequence, not an axiom, and that specific predictions *are* testable, even if the "whole theory" isn't falsifiable in one go.
  5.  **Φ-intractability:** A severe practical limitation, not a theoretical falsification. Proponents readily admit this and develop approximations (e.g., PyPhi for small systems). While it hinders application to brains, it doesn't inherently invalidate the theory's postulates – one could imagine future computational advances.
  6.  **Cogitate result (Least Damaging):** Represents a failed *empirical prediction* derived from IIT about brain dynamics. Proponents can (and did) argue the prediction was contingent on specific implementations or measurement choices, or that the result reflects "noise" masking true IIT-predicted states, without rejecting core axioms like the need for integrated information. It challenges IIT's mapping to biology, not its formal logic.
