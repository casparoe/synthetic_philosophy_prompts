  The modal issue in moves 5-6 is the deepest. Elena nails the tension in Leibniz's system - if God must choose the best, alternatives aren't really possible. Marcus's distinction (moral vs logical necessity) tries to preserve contingency, but I suspect it's more semantic than substantive. Leibniz's contemporaries already saw this problem. 

