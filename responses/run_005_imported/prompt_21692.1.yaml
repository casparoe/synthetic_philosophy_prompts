prompt: |-
  For the past few months, a few friends and I have kept circling back to a disagreement that started as a throwaway comment over dinner and has been nagging at me ever since, even though I don't have any formal training in philosophy and have mostly just been chewing on it on my own. It began when my friend Mara argued that when someone says "cheating on your partner is wrong," they aren't stating a fact that could be true or false; they're doing something closer to booing or wincing, venting disapproval dressed up in the grammar of a factual sentence. I found this fairly convincing at first, since it does seem to explain why moral disagreements almost never get resolved the way factual disagreements do, no matter how much evidence anyone brings to the table.

  What's been bothering me is something I noticed the next time the subject came up, during an argument about whether a mutual friend was wrong to keep a wallet he found instead of trying to return it. Mara built her whole case out of perfectly ordinary logical steps: she got us to agree that "keeping something valuable you find, when you could return it, is wrong," then got us to agree that "if that's wrong, then what our friend did is wrong," and from those two claims concluded that what our friend did was wrong. That's just an ordinary "if this, then that; this; so that" argument, the same shape you'd use to reason about any plain fact. But if calling something "wrong" is really just a way of booing at it, I don't see how that middle step is supposed to work, because nobody boos at an "if" — in that sentence Mara isn't disapproving of anything, she's just linking two claims together. When I pointed this out, she said I was overthinking a metaphor, but I can't shake the feeling that she wants moral language to behave like ordinary fact-stating language whenever it's doing work inside an argument, and to shrink back down to a mere grunt of approval or disapproval the moment someone asks what it actually means. Is she being inconsistent, or is there some way for both halves of her view to fit together after all?
reasoning: |-
  Okay, the user has been wrestling with a philosophical disagreement with their friend Mara about moral language. Mara argues that saying something is "wrong" is like booing—expressing disapproval rather than stating a fact. But then Mara uses logical arguments that treat moral statements as if they are facts. The user feels this is inconsistent and wants to know if Mara's view can be reconciled.

  First, I need to recall the key points of expressivism. Emotivism, which Mara seems to align with, says moral statements are expressions of emotion, not truth-apt. But then how does she use them in logical arguments? The user noticed Mara used modus ponens: If keeping a found wallet is wrong, and the friend did that, then it's wrong. But if "wrong" is just a boo, how can the conditional "if keeping is wrong, then what he did is wrong" make sense? Conditionals need truth values, but expressivism denies moral statements have truth values.

  The user's deeper concern is about inconsistency in Mara's approach. When arguing, Mara treats moral language as factual, but when explaining its meaning, she reduces it to emotive expressions. The user might be seeking validation that this is a legitimate critique. They might also want to understand if there's a sophisticated theory that resolves this, like Blackburn's quasi-realism.

  Blackburn's project quasi-realism attempts to explain how moral language can function logically while being non-cognitive. The idea is that moral attitudes can be consistent or inconsistent, allowing for logical operations without positing objective truths. For example, the conditional "if P is wrong, and Q is an instance of P, then Q is wrong" expresses a consistency in attitudes. Approving of P but disapproving of Q would be inconsistent. So, the logical structure reflects commitment to maintaining coherent attitudes.

  The user might not be familiar with these philosophical nuances. Their identity seems to be someone without formal training, engaging in deep discussions with friends. Their actual need is to resolve their cognitive dissonance regarding Mara's stance. They might want to present a coherent counter-argument or understand if their intuition about inconsistency is valid.

  I should explain that Mara's initial emotivism is simplistic. More refined expressivist theories address logical inference by framing it in terms of attitude consistency. The conditional isn't a fact but a commitment to disapprove of specific instances if one disapproves of the general act. This resolves the apparent inconsistency the user noticed.

  Also, the user might be interested in why moral disagreements feel different. Expressivism explains that since they're about attitudes, not facts, resolution requires persuasion or alignment of emotions, not empirical evidence. But within expressivism, logical arguments can still persuade by highlighting inconsistencies in attitudes.

  In conclusion, Mara isn't necessarily inconsistent; advanced expressivism can accommodate logical reasoning through quasi-realism. The user's insight is valid and touches on a key challenge in meta-ethics, leading to sophisticated solutions.
answer: |-
  You've hit on one of the most profound and enduring challenges in meta-ethics – the tension between the *meaning* of moral language and its *logical behavior*. Mara's view (a form of **expressivism**, specifically reminiscent of **emotivism** like A.J. Ayer's "boo/hurrah" theory) faces exactly the difficulty you identified. Your intuition that there's an inconsistency is spot-on, but sophisticated expressivists like Simon Blackburn ("quasi-realism") have developed complex responses. Let's break it down:

  1.  **The Core Problem (Your Insight):**
      *   **Emotivist Claim (Booing):** "Cheating is wrong" fundamentally *expresses* disapproval (like booing), rather than *describing* a moral fact "out there" in the world. It's not truth-apt (can't be simply true/false in a factual sense).
      *   **Logical Behavior (Modus Ponens):** Mara uses "keeping found valuables is wrong" and "If keeping found valuables is wrong, then what our friend did is wrong" as *premises* in a logical argument (modus ponens). These premises *function* like truth-apt propositions. They are the *input* for logical operations. Crucially, the conditional ("If P is wrong, then Q is wrong") isn't expressing disapproval of P or Q; it's expressing a *logical relationship* between two disapproval-expressions.
      *   **The Incompatibility:** How can something that is *only* an expression of emotion (a non-cognitive state) be the subject of logical relations like implication ("if...then")? Boos aren't true or false, and you can't have logical implications *between* boos. Mara seems to rely on moral sentences behaving *as if* they state facts when constructing arguments, while insisting they *don't* state facts when explaining their meaning.

  2.  **Mara's Defense ("Overthinking a Metaphor") & Why It's Weak:**
      *   She might say the "boo" metaphor is just a rough way to capture the expressive core, and that in arguments, we simply use the *language* conventionally. But this hand-waving doesn't solve the problem. *Why* does this conventional use work logically if the underlying meaning is non-logical? It feels like she's switching definitions mid-stream for convenience.

  3.  **Sophisticated Expressivism: Making It Fit (Quasi-Realism):**
      Philosophers like Simon Blackburn recognized this problem and developed **quasi-realism**. The goal is to explain *how moral language can behave logically as if it's describing facts, even though its fundamental function is expressive*. Here's the gist of how they address your specific concern:
      *   **Attitudes, Not Just Grunts:** Expressivism isn't *just* about raw emotion (boos). It's about complex, propositional attitudes like *approval*, *disapproval*, *commitment*, and *endorsement*. We have attitudes *towards* states of affairs or actions.
      *   **Consistency of Attitudes:** Logic isn't just about truths; it's fundamentally about *consistency*. Quasi-realism argues that moral reasoning is about the *consistency of our attitudes*.
      *   **The Conditional Explained:** When Mara says, "If keeping found valuables is wrong, then what our friend did is wrong," she isn't stating a fact about the world. Instead, she is *expressing a complex attitude*:
          *   She disapproves of keeping found valuables (P is wrong).
          *   She has an attitude *about* that disapproval: namely, a *commitment* to disapproving of *any specific instance* (like Q) that clearly falls under the general case (P).
          *   The conditional expresses this *commitment to consistency*. To approve of P (or disapprove of P) while simultaneously disapproving of the implication to Q (approving of Q) would be *inconsistent* within her own framework of attitudes.
      *   **The Argument's Force:** The modus ponens argument works *psychologically* and *pragmatically* to pressure consistency:
          *   Premise 1: Mara expresses disapproval of keeping found valuables (P).
          *   Premise 2: Mara expresses her commitment to disapproving of any instance (like Q) if she disapproves of P.
          *   Conclusion: To be consistent with her *own* expressed attitudes (disapproval of P + commitment to disapproving of Q if she disapproves of P), she *must* disapprove of Q. If *you* agreed with Premise 1 and Premise 2, the argument pressures *you* towards disapproving of Q to maintain *your* attitudinal consistency.
      *   **Logic as the Grammar of Attitudes:** Quasi-realism tries to build a "logic of attitudes." Logical connectives like "if...then" and "and" become ways to express *relations* between our approval/disapproval states – primarily relations of consistency and commitment. Mara's argument isn't discovering a moral fact; it's revealing what her (and potentially your) existing attitudes *commit* her (or you) to.

  4.  **Is Mara Being Inconsistent?**
      *   **At a Naive Level (Simple Emotivism):** Yes, absolutely. If she *only* thinks of "wrong" as a grunt or boo, she has no coherent account of how it functions logically in conditionals and arguments. Her use of logic contradicts her simple definition.
      *   **At a Sophisticated Level (Quasi-Realism):** Possibly not. If she implicitly (or explicitly) adopts a view like quasi-realism, she *can* maintain that the core meaning is expressive (disapproval) while explaining the logical behavior through the consistency of attitudes and commitments. She wants moral language to *mimic* factual language in arguments *because that's how we naturally reason towards consistency in our attitudes*, not because it *is* factual.

  5.  **Why Moral Disagreements Feel Different (Revisited):**
      *   Even quasi-realists agree moral disagreements are hard. Resolving them isn't about finding evidence for a fact, but about *persuading* someone to change their fundamental attitudes (disapprovals/approvals) or their commitments about consistency. Logic can expose *inconsistencies* within someone's *own* web of attitudes ("You disapprove of lying generally, but approve of *this* lie? Why?"), but it can't force a change in the core attitude itself if someone is willing to bite the bullet and accept the inconsistency. Evidence (e.g., about consequences, intentions, alternatives) becomes *relevant* because it can influence *which attitudes we form* (e.g., learning the wallet belonged to someone desperately poor might strengthen disapproval), not because it proves a moral fact.

  **Conclusion:**

  Your nagging feeling is justified. Mara's *simple* "boo" theory *is* inconsistent with her use of moral language in logical arguments. However, more sophisticated versions of expressivism (like quasi-realism) *do* offer a way to reconcile the expressive core of moral language with its logical structure. They argue that moral reasoning isn't about discovering facts but about achieving *consistency* and *coherence* within our own complex framework of attitudes, approvals, and commitments. Mara might be gesturing towards this deeper view without fully articulating it. Your challenge reveals the heart of a major philosophical debate – one that shows your philosophical instincts are sharp, formal training or not. The next time it comes up, you could ask Mara: "When you say 'If P is wrong then Q is wrong,' are you describing a fact, or are you expressing a *commitment* to disapproving of Q *because* you disapprove of P?" The answer will tell you if she's a naive emotivist or a budding quasi-realist.
