answer: |-
  ## Dialogue: The Incognito Tab and the Fractured Will

  **Setting:** A home office. LARA stares at her laptop screen, fingers hovering over the keyboard. She’s just opened an incognito browser window. A website blocker notification flashes impotently in the background. Two figures stand beside her desk, visible only to each other and the audience: **THEORIST** (Hyperbolic Discounter) and **PHILOSOPHER** (Holtonian).

  **THEORIST:** *(Gesturing at the incognito tab)* Exhibit A. Textbook preference reversal. The distant, abstract value of "productivity" and "future career" she assigned yesterday when setting up the blocker? Its discount curve has plummeted as the *immediate* reward of social media's dopamine hit looms large. Her current, local preference *is* for distraction. The "akrasia" you lament is just her acting rationally *now*, given her *current* discounted valuations. The precommitment device worked *until* the curves crossed. Confirmation, not contradiction.

  **PHILOSOPHER:** Rational *now*? Only if you reduce her agency to a passive conduit for fluctuating desires! That precommitment wasn't just a bet against a future *desire*; it was the enactment of a **resolution**. A distinct psychological state Lara adopted *yesterday* – a settled policy to *treat* certain desires (like the urge for social media during work) as *reasons to resist*, not reasons to act. The incognito tab isn't preference reversal; it's **reasoning *around* the resolution**. She hasn't genuinely re-valued productivity lower *as a goal*; she's finding a way to circumvent the obstacle *she herself placed* to protect that very goal.

  **THEORIST:** *(Scoffs)* "Circumventing an obstacle" *is* the preference reversal manifest! Her resolution *was* a desire – the desire to bind her future self to a course aligned with her *then* dominant long-term valuation. But desires change with temporal proximity. That binding desire *itself* gets discounted! When the moment arrives, the desire *for the forbidden immediate reward* simply outweighs the desire *to be bound by the past desire*. The "resolution" was just a bundle of desires and beliefs about future desires. They've updated. The incognito tab is the rational tool for her *current* strongest desire.

  **PHILOSOPHER:** You conflate the *trigger* for reconsideration with the *nature* of the resolution itself. Holton argues resolutions function precisely to *insulate* us from the kind of local desire fluctuations you describe. They aren't mere predictions ("I will want X later") or simple desires ("I want to do Y"). They are *intentions formed under a policy*: "When urge Z arises, I will *not* treat it as a reason for action, *because* I resolved not to." The incognito tab shows the urge broke *through* that policy shield. It didn't dissolve the resolution; Lara is *violating* it *despite* it still being her settled policy. She feels guilt precisely because the resolution *persists* even as she acts against it.

  **THEORIST:** Guilt is just the conflict between her *current* strong desire for the reward and the *lingering echo* of the past desire she used to have for self-control, amplified by the sunk cost of setting up the blocker. It's dissonance, not proof of some irreducible "resolution state." Your "policy" is epiphenomenal. The *only* thing governing action is the *current* motivational force of competing desires, discounted for time. The blocker added a *cost* to accessing social media. The incognito tab *reduces* that cost, making the now-more-intense immediate reward *easier* to obtain. The calculation flipped. Simple.

  **PHILOSOPHER:** If it were *just* desire intensity and cost calculation, why the elaborate self-binding *yesterday*? Why not just *try harder* in the moment? Because Lara *knew*, based on past experience (the kind of experience that *builds* a resolution), that her *judgment* about what's best *for her overall* would be swamped by the local desire. The resolution was an exercise of *governance* over her future self. The incognito tab is an act of *rebellion* by the local self *against* that governance. It's not a new preference winning; it's the *structure* of her planned agency being actively sabotaged *by* the local desire, which the resolution was designed to *pre-empt*, not just outweigh.

  **THEORIST:** Rebellion? Sabotage? Dramatic metaphors for a predictable shift in utility weights! Governance requires stable preferences to govern *by*. Hyperbolic discounting *explains* the instability. Her "rebellious" local self *is* her self at time T. The "governor" self from time T-1 is gone, replaced by a self with different valuations. The incognito tab is the rational choice *for Lara-Now*. The puzzle isn't why she does it; it's why we expect temporal consistency when discounting ensures it's irrational!

  **PHILOSOPHER:** And *that* expectation of consistency – the *disappointment* when it fails, even when predicted – is precisely what the resolution was meant to *enforce* and what your model cannot capture. The resolution *creates* a normative standard *for* Lara-Now *from* Lara-Then. The incognito tab isn't just a different preference winning; it's Lara-Now *failing* to live up to the commitment *she* made to her own ongoing agency. It’s a fracture in the will, not a smooth recalculation. *(Lara hesitates, cursor blinking in the incognito address bar...)*

  **THEORIST:** Watch. The calculation is nearly complete. The curves have crossed. The rational choice is imminent. The fracture *is* the recalculation. *(Lara types "f-a-c-e..." into the address bar.)* There it is. Proof.

  **PHILOSOPHER:** *(Quietly)* Proof she’s losing the argument with herself. Not proof the argument didn’t matter. The resolution *was* there. It was *reasoned around*, not dissolved.

  *(Lara hits enter. The social media feed loads. Both figures watch, their disagreement unresolved.)*

  ## Key Points of Contention Illustrated

  1.  **Nature of the Resolution:** Philosopher sees it as a distinct *policy* state creating a normative standard. Theorist sees it as a bundle of past desires/beliefs inevitably discounted.
  2.  **Mechanism of Failure:** Philosopher: Resolution is *violated* or *circumvented* by reasoning around it. Theorist: Preferences *reversed*; the resolution's motivational force was simply out-discounted.
  3.  **Agency:** Philosopher: Emphasizes the agent's capacity for self-governance via resolutions. Theorist: Emphasizes the agent as subject to predictable motivational forces shaped by temporal discounting.
  4.  **Guilt/Phenomenology:** Philosopher: Points to guilt as evidence the resolution *persists* as a standard being violated. Theorist: Points to guilt as cognitive dissonance from conflicting *current* desires/echoes.
  5.  **The Incognito Tab:** Philosopher: Tool for *circumventing* a standing commitment. Theorist: Rational tool for accessing a *currently preferred* reward by lowering its cost.
