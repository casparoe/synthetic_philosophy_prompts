answer: |-
  Your skepticism cuts to the heart of a legitimate philosophical tension. Let's dissect why FDT/TDT proponents argue their approach is *structurally distinct* from EDT, even when both endorse one-boxing in Newcomb's problem. The difference isn't merely semantic rebranding—it becomes operationally critical in other scenarios.

  ### 1. **The Core Distinction: Subjunctive Dependence vs. Evidential Conditioning**
      - **EDT (Evidential Decision Theory):** Chooses actions *based on the evidence they provide about the world*. In Newcomb's, one-boxing is good *news* about Box B's contents. EDT asks: "What does choosing X *tell me* about the state of the world?"
      - **FDT/TDT (Functional/Logical Decision Theory):** Chooses actions based on *which decision rule causally or logically controls the outcome*. It asks: "What *counterfactual outcome* does my decision *function* output when run in this logical structure?" One-boxing wins because your decision algorithm's *output* is subjunctively/logically *linked* to Omega's prediction.

  ### 2. **Where EDT and FDT Diverge: The Crux of the Matter**
      The theories align in Newcomb's because Omega's prediction *correlates perfectly* with your action. The split emerges when evidence and control *decouple*:

      - **The Psychopath Button (Classic EDT Failure):**  
        *Scenario:* A button claims to cure psychopathy if pressed, but only non-psychopaths press it. Psychopaths would cause harm if cured.  
        - **EDT:** Pressing the button is *excellent evidence* you're not a psychopath (so pressing it is good news!). EDT presses.  
        - **FDT:** Your pressing *doesn't cause* you to be non-psychopathic—it *reveals* it. If you *were* a psychopath, you wouldn't press, so pressing is harmless. FDT presses.  
        - **Why it matters:** EDT conflates *correlation* with *safety*. In this case, it coincidentally works, but see next.

      - **Parfit's Hitchhiker (EDT's Fatal Flaw):**  
        *Scenario:* A driver will only save you if they *believe* you'll pay them later. Once saved, you can pay or not.  
        - **EDT:** Refusing to pay *after* rescue is evidence you never intended to pay (but the driver already acted). EDT doesn't pay.  
        - **FDT:** Your decision rule must be consistent *counterfactually*. If your algorithm pays upon rescue, the driver saves you. If not, they abandon you. FDT pays.  
        - **Outcome:** EDT dies stranded. FDT gets rescued *and* pays.

      - **XOR Blackmail (Logical Decoupling):**  
        *Scenario:* A predictor sends a letter: "I predicted if you pay $1k, XOR if a coin landed heads. Pay iff you got this letter."  
        - **EDT:** Getting the letter is *evidence* the coin was tails (since you wouldn't get it if heads + no pay). Paying $1k is "good news" about the coin, so EDT pays.  
        - **FDT:** Paying *does nothing* to control the coin. The predictor already set the state. FDT doesn't pay, saving $1k.  
        - **Result:** EDT loses money pointlessly; FDT doesn't.

  ### 3. **Why Newcomb's Isn't Enough to Distinguish Them**
      Newcomb's is a "friendly" problem for EDT because:
      - The correlation between action and prediction is perfect.
      - There's no adversarial pressure or decoupled evidence.
      EDT's one-boxing relies on *passively conditioning on the evidence* of your choice, while FDT treats your decision as a *logical node in a computational graph* that Omega simulated. Both win, but for *different mechanistic reasons*.

  ### 4. **Addressing the "Rebranding" Critique**
      FDT isn't EDT repackaged to dodge its reputation—it's a deliberate solution to EDT's *proven failures* in strategic (e.g., Parfit's) and logical (e.g., XOR) dilemmas. EDT's flaw is treating *all* correlations as *passive evidence to condition on*, while FDT handles *acausal/logical correlations* by asking: "What choice would my *decision algorithm* make in *all* instances of this logical structure?"

  ### Conclusion
  The difference is substantive: **EDT optimizes for being in worlds where good things happen; FDT optimizes for being an agent whose decision *function* causes good things to happen.** In Newcomb's, these coincide. In Parfit's, XOR Blackmail, or Counterfactual Mugging, EDT self-sabotages while FDT wins. Yudkowsky/MIRI developed TDT/FDT not to rebrand EDT, but to create a theory that generalizes robustly across *all* decision problems—especially those where evidence and control are adversarial or logically entangled. The math isn't identical; it's a structural upgrade.

