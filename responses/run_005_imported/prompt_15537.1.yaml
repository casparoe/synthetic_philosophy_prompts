prompt: |-
  I'm running a graduate seminar this term on Anscombe and that whole mid-century Oxford circle (Foot, Murdoch, the lot), and we just did a session on her pamphlet "Mr Truman's Degree" — the one where she objects to Oxford giving Truman an honorary doctorate and says point blank that ordering the bombing of Hiroshima and Nagasaki was murder, full stop. It's a short, nasty little text and it always gets a reaction. This time two of my students, Leah and Marcus (not their real names), kept arguing about it well after the seminar ended, out in the hallway and then over coffee, and I mostly just tagged along and listened because I genuinely wasnt sure who was winning.

  Leah defended Anscombe's line: Truman and his planners chose to kill a huge number of civilians as the actual mechanism for ending the war, and no amount of good downstream consequences changes the fact that intentionally killing innocents as a means is murder — that's the whole force of her refusal to let a good outcome launder an evil act. Marcus pushed back that this assumes we already know what Truman "really" intended; by his own account and Stimson's afterward, the goal was ending the war without a land invasion everyone expected to be even costlier in lives, and the civilian deaths, however certain, were the foreseen price of that, not the aim itself — exactly the kind of case double effect is built to handle. Leah said that's too easy: if foreseeing-with-certainty automatically counts as "mere side effect," you can redescribe any atrocity as pursuit of some further good; what fixes the description here is that the targets were intact, populated cities rather than isolated military or industrial sites, chosen precisely because mass civilian death and terror was the mechanism by which Japan was supposed to fold, so the deaths are built into the plan, not incidental to it. Marcus replied that Leah was now carving up "the plan" exactly as coarsely as she needed to get her verdict, the very move she'd just accused him of at the fine-grained level — and if neither of them has a non-question-begging way to fix the level of description, the intention/foresight test can't bear the weight Anscombe puts on it. Leah's last word was that Marcus still hadn't said why the number of lives supposedly saved should matter at all if intentions really do ground an absolute prohibition — letting the numbers back in once they're big enough is just consequentialism sneaking in the back door, which is exactly the disease she thinks Anscombe is diagnosing in the field.

  I'd genuinely like your read on this, since it's got me second-guessing how to teach this unit next year. Could you go through their exchange move by move and say who's got the better of it at each stage, rather than just handing out an overall winner? I'm especially interested in whether the intention/foresight distinction can survive the redescription problem Marcus raises in his second move, or whether it really does collapse the way he claims — and whether there's some third position neither of them considered that both of their best points are actually gesturing toward.
reasoning: |-
  Okay, let me approach this step by step. The professor is teaching Anscombe's "Mr Truman's Degree" and has two students, Leah and Marcus, debating the core ethical dilemma. Leah defends Anscombe's absolutist position that Truman committed murder by intentionally targeting civilians, while Marcus argues the civilian deaths were foreseen but unintended side effects under double effect. Their debate hinges on three key moves: intention versus foresight, the problem of redescription, and whether consequences can override prohibitions. 

  First, I need to unpack Anscombe's original argument. Her core point is that intentionally killing innocents as a means is always murder, regardless of consequences. The atomic bombs weren't just unfortunate side effects - they were the very mechanism chosen to force surrender. This makes Truman's act intrinsically evil. 

  Then Leah's defense makes sense: she's sticking to the absolutist line. But Marcus counters with the classic double effect distinction - the intended end was saving lives via surrender, while civilian deaths were merely foreseen. This is where things get tricky. Leah's rebuttal about target selection is strong; if you pick cities precisely to maximize civilian terror, calling deaths "unintended" feels like a dodge. 

  Ah, but Marcus spots a meta-problem: both sides are framing "the plan" to suit their verdicts. If we can't objectively define the relevant description level, the intention/foresight test becomes useless. That's a serious challenge to Anscombe's whole framework. 

  Leah's final move exposes the tension in Marcus's position: if intentions create absolute prohibitions, why would large numbers of saved lives matter? Bringing consequences back in undermines the deontological foundation. 

  Now, where does this leave us? Neither student fully resolves the redescription problem. Marcus is right that intention-talk requires context, but Leah correctly insists some descriptions are more natural (like "bombing cities to cause terror"). The real issue might be Anscombe's over-reliance on intention as a mental state - perhaps we should consider institutional patterns or action-types instead. 

  For teaching next year, I should highlight how both students expose weaknesses in pure double effect. Leah shows its vulnerability to strategic redescription, while Marcus reveals the instability of "absolute" prohibitions when consequences loom large. The debate points toward virtue ethics or structural sin as alternatives Anscombe might endorse. 

  The key insight is that Anscombe's rigorism works best when condemning the bureaucratic mindset that treats civilians as calculable variables - which is precisely what Hiroshima involved. That institutional dimension might be the "third thing" the students were circling around.
answer: |-
  This is an electrifying debate that cuts to the heart of Anscombe's moral rigorism and the enduring challenge of applying double effect to catastrophic choices. Both Leah and Marcus land significant blows, exposing genuine tensions in Anscombe's framework. Let's break down their exchange move-by-move, assessing the strengths and weaknesses at each stage:

  **The Core Positions:**
  *   **Leah:** Defends Anscombe's absolutism. Intentionally killing innocents as a *means* is murder, intrinsically evil, and cannot be justified by consequences. The bombing *was* the means to force surrender.
  *   **Marcus:** Challenges the characterization of intention. The deaths were foreseen but *not intended*; the intended end was saving lives via surrender/shortening the war. This fits double effect, allowing foreseen but unintended evil for proportionately grave reason.

  **Move 1: Leah's Opening (Anscombe's Core Argument)**
  *   **Claim:** Truman *chose* mass civilian death as the *mechanism* for ending the war. This makes it intentional killing of innocents as a means = murder. Consequences are irrelevant.
  *   **Strength:** Faithfully captures Anscombe's core deontological commitment. Highlights the *structural* evil of using innocent lives instrumentally. Forces Marcus to engage with intention, not just outcomes.
  *   **Weakness:** Assumes the description ("killing civilians as the mechanism") is uncontested. Doesn't yet address *how* we determine intention vs. foresight in complex acts.

  **Move 2: Marcus's First Rebuttal (Double Effect Application)**
  *   **Claim:** Truman/Stimson's stated goal was ending the war/preventing invasion casualties. Civilian deaths, however certain, were the *foreseen price*, not the *aim*. This is precisely the scenario double effect is designed for.
  *   **Strength:** Accurately applies the formal structure of double effect (DE). Points to historical actors' stated justifications. Shifts the burden back to Leah to prove the deaths were *intended as means*, not merely foreseen.
  *   **Weakness:** Risks being overly formalistic. Doesn't yet grapple with whether the *nature of the act itself* (obliterating entire cities) inherently involves intending civilian destruction, regardless of stated goals.

  **Move 3: Leah's Counter (The Redescription Problem & Targeting)**
  *   **Claim:** Marcus's move is "too easy." If *certain foresight* automatically counts as "mere side effect," any atrocity can be redescribed. What fixes the description is the *target selection*: intact cities were chosen *precisely because* mass death/terror was the effective mechanism. The deaths are *built into the plan*, not incidental.
  *   **Strength:** Brilliantly exposes the **redescription problem** inherent in DE. Highlights the *material reality of the choice*: targeting cities *means* targeting civilians *as such*. Argues that the *chosen method* reveals the true intention (using terror/death instrumentally). This is Anscombe's strongest practical point against Truman.
  *   **Weakness:** Needs a clearer principle for *why* "targeting a city" inherently means "intending civilian deaths as means" rather than "intending surrender *by means of* destroying the city (which inevitably contains civilians)." Starts to bump against the difficulty of cleanly separating "act" from "intended effect."

  **Move 4: Marcus's Counter-Counter (The Redescription Problem Flips)**
  *   **Claim:** Leah is now arbitrarily carving up "the plan" coarsely ("bombing to cause terror/death") to get her verdict, just as she accused him of doing finely (focusing only on "ending the war"). If *neither* has a non-question-begging way to fix the *correct level of description* for determining intention, then the intention/foresight distinction (and thus Anscombe's absolute prohibition) collapses under indeterminacy.
  *   **Strength:** Lands a devastating blow. Exposes a profound **metaphysical/epistemological vulnerability** in Anscombe's reliance on intention. If intention is determined by how we describe the act, and description is contestable, the absoluteness becomes unstable. Forces Leah onto the defensive about the objectivity of moral description.
  *   **Weakness:** Risks throwing the baby out with the bathwater. While description is complex, not all descriptions are equally valid or natural. "Dropping a bomb designed to obliterate a city center" has a different moral resonance than "applying force to induce political change," even if both describe aspects of the same event.

  **Move 5: Leah's Final Salvo (Consequences vs. Absolutes)**
  *   **Claim:** Marcus still hasn't explained why the *number* of lives saved matters *at all* if intentions ground an absolute prohibition. Invoking large numbers to justify an act defined as intrinsically evil is just consequentialism sneaking in – the very "disease" Anscombe diagnosed.
  *   **Strength:** Exposes a **fundamental tension in Marcus's position**. If DE requires proportionality, but the act is *absolutely prohibited* if the evil is intended, then proportionality seems irrelevant for *that specific act-type*. Bringing in numbers *after* arguing the evil was "merely" foreseen reveals the consequentialist underpinning needed to make DE work in extreme cases. This is Anscombe's core critique of modern ethics.
  *   **Weakness:** Risks making morality seem inhumanely rigid in the face of catastrophic choices. Doesn't fully address Marcus's redescription challenge – if the act *isn't* absolutely prohibited under the correct description (foreseen evil, not intended), *then* proportionality *does* matter.

  **Assessment: Who "Wins" Each Move?**

  1.  **Leah's Opening:** **Strong.** Faithful to Anscombe, sets the absolutist stakes clearly. (Leah 1 - Marcus 0)
  2.  **Marcus's First Rebuttal:** **Strong Application, Weak Defense.** Correctly applies DE formally but doesn't tackle the deeper challenge of the act's nature. (Leah 1 - Marcus 1)
  3.  **Leah's Counter (Targeting):** **Very Strong.** Effectively uses the *material choice* (city bombing) to anchor intention and exposes DE's vulnerability to strategic redescription. (Leah 2 - Marcus 1)
  4.  **Marcus's Counter-Counter (Redescription Flip):** **Devastating (Philosophically).** Highlights a genuine, perhaps fatal, difficulty for grounding *absolute* prohibitions solely on intention due to descriptive indeterminacy. (Leah 2 - Marcus 2)
  5.  **Leah's Final Salvo (Consequences vs. Absolutes):** **Strong.** Exposes the consequentialist residue in Marcus's reliance on proportionality for an act he *almost* concedes might be absolutely wrong under Leah's description. (Leah 3 - Marcus 2)

  **Overall:** **Leah edges it, but Marcus exposes profound cracks.** Leah wins on fidelity to Anscombe's core insight about instrumentalizing evil and the hollowness of "foresight" when the mechanism *is* mass death. She successfully shows the tension in Marcus's reliance on proportionality. **However, Marcus wins the most significant *philosophical* point:** his "redescription flip" reveals a deep, perhaps insurmountable, problem for grounding *absolute, exceptionless* moral norms *solely* on the intention/foresight distinction applied to complex acts. The level-of-description problem is real and destabilizing.

  **The "Third Thing" Gestured Towards:**

  Both points lead towards a critique of Anscombe's *overly mentalistic* focus on individual intention and a need to consider:

  1.  **The Objective Moral Character of Actions:** Not just the psychological state, but *what is actually done*. Destroying a city *is* the mass killing of civilians, regardless of the ultimate goal. This leans towards a more Thomistic natural law view where the *object* of the act carries moral weight inherently. Leah touches this with "target selection," but needs to ground it in the nature of the act itself, not just inferred intention.
  2.  **Institutional Sin and Structural Evil:** Anscombe's focus is on Truman's *choice*. But the bombing was the product of a vast bureaucratic-military machine where intention is diffuse. The "plan" *was* to use the bomb on a city to cause maximum shock – a plan accepted by Truman. The "intention" resides partly in the institutional design and accepted doctrine (terror bombing), not just Truman's mind. This makes the redescription less arbitrary: the *socially embodied plan* was "city destruction as means."
  3.  **Virtue Ethics & Character:** Anscombe (and Foot/Murdoch) were steeped in virtue ethics. The debate focuses on the act, but the *character* revealed by choosing such a horrific means, the *corruption* involved in calculating civilian deaths so dispassionately, and the *vices* (presumption, hardness of heart) are crucial. The "disease" Anscombe diagnoses might be less about consequentialism *per se* and more about the *loss of a virtuous character* that would find such an act unthinkable. Both students focus on justification; virtue ethics asks "what kind of person does this?"

  **Teaching Implications:**

  1.  **Highlight the Redescription Problem:** Make Marcus's point central. Can Anscombe's framework *objectively* fix the description to avoid this? If not, does it fatally wound her absolutism? Explore texts where Anscombe *does* try to fix descriptions (e.g., contraception).
  2.  **Interrogate "Intention":** Distinguish between:
      *   *Psychological state* (What was Truman *thinking*? Unknowable, perhaps irrelevant).
      *   *Intention-in-action* (What is *inherent in the chosen means*? Bombing a city *is* mass killing).
      *   *Institutional/Social Intention* (What was the *plan*, as designed and executed?).
      Leah's strength is arguing for the second and third.
  3.  **Confront Proportionality in DE:** Explicitly discuss Leah's final point. If an act is *absolutely prohibited* under description X, proportionality is irrelevant. If it's *not* absolutely prohibited under description Y (foreseen side effect), then proportionality *is* crucial. The debate hinges entirely on *which description is correct*. Marcus's proportionality argument *only works if he wins the description argument*.
  4.  **Introduce Alternatives:** Briefly gesture towards the "third things":
      *   How would a natural law theorist (like Finnis or Grisez) define the *object* of the act?
      *   How does the institutional/structural dimension change the analysis?
      *   What would Foot or Murdoch say about the *vices* involved? (Murdoch on the "fat, relentless ego" blinding moral perception?)
  5.  **Contextualize Anscombe's Fury:** Emphasize that her target wasn't just Truman, but the *culture* that saw this as justifiable – the "consequentialist rot" she believed eroded the very concept of murder. Her absolutism is a *corrective* against normalization. The pamphlet's power lies in its refusal to be sophisticated in the face of horror.

  Leah wins the debate *on Anscombe's own terms* by showing the inadequacy of DE's application here and the danger of consequentialist creep. Marcus wins by exposing a foundational fragility in the theory itself. Their stalemate points towards the need to supplement intention with a richer account of action, social structures, and virtue – ideas nascent within the broader Oxford circle Anscombe inhabited.
