answer: |-
  ## MEMO: Editorial Standard for Climate Attribution Headlines & Framing

  **To:** Editorial Standards Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Standardized Wording for Climate Attribution Stories  

  Following the recent discussion regarding the [Specific Heat Wave] attribution study, this memo proposes a concrete wording rule for headlines and lead paragraphs in climate attribution stories. This rule aims to accurately reflect the science (as presented in studies like the one under review) while addressing the valid linguistic and philosophical concerns raised regarding causality.  

  **The Core Rule:**  
  **When reporting on climate attribution studies concluding that human-caused climate change altered the probability and/or intensity of a specific weather event, headlines and leads must:**  
  1.  **Use active verbs describing the *impact* of climate change** (e.g., intensified, amplified, worsened, made more likely, made more severe, supercharged, fueled).  
  2.  **Explicitly state the *nature of the alteration* identified by the study** (e.g., increased likelihood, added intensity/duration/severity, raised temperatures).  
  3.  **Avoid the unqualified verb "caused"** when the study methodology or conclusions explicitly state that a similar event *could* have occurred naturally, albeit with significantly lower probability and/or intensity.  

  **Rationale:**  
  *   **Scientific Accuracy:** Attribution studies using counterfactual modeling (with/without human influence) quantify *how much* climate change altered the odds and characteristics of the *specific event that occurred*. They demonstrate climate change's role as a significant *forcing factor* or *intensifier*, not necessarily the sole, absolute *initiating cause* in the strict philosophical sense demanded by the "but for" test (where the event would be impossible without it). The study on our desk explicitly states the heat wave was *made more likely and hotter*, not that it was *impossible* without climate change.
  *   **Linguistic Precision:** Verbs like "intensified," "amplified," and phrases like "made X times more likely" directly correspond to the study's findings. They accurately convey climate change's active role in shaping the *specific event's severity* without implying the event would not have existed *at all* in its absence.
  *   **Addressing Both Concerns:** This wording:
      *   **Satisfies the Reporter's Core Point:** It clearly and forcefully states that climate change fundamentally altered the event that people experienced, making it worse than it otherwise would have been. It attributes the *experienced severity and impact* to human influence.
      *   **Respects the Copy Editors' Precision:** It avoids the absolute claim of sole "cause" when the science indicates a baseline event was possible (though much less likely/severe) without the added greenhouse gases. It uses language directly tied to the study's methodology and output (likelihood ratios, temperature increments).

  **Concrete Application to the Current Study:**  

  *   **Headline Examples (Compliant):**
      *   `Climate Change Supercharged [Region] Heat Wave, Study Finds`  
      *   `Human Influence Made Recent Heat Wave Five Times More Likely, Two Degrees Hotter`  
      *   `Global Warming Amplified Severity of [Region] Heat Event, Analysis Shows`  
      *   `Climate Change Fueled Record Heat Wave Intensity in [Region]`  

  *   **Headline Examples (Non-Compliant):**  
      *   `Climate Change Caused This Heat Wave` (Unqualified "caused" is prohibited)  
      *   `Heat Wave Directly Caused by Global Warming` (Same issue)  

  *   **Lead Paragraph Guidance:**  
      *   "A new attribution study concludes human-caused climate change **made** the recent record-shattering heat wave in [Region] **roughly five times more likely to occur and approximately two degrees Celsius hotter** than it would have been in a world without industrial-era greenhouse gas emissions."  
      *   "The intensity and duration of last month's devastating heat wave across [Region] were **significantly amplified by human-induced global warming**, according to climate scientists. Their analysis shows climate change **increased the likelihood** of such an extreme event **fivefold and added about 2°C to its peak temperatures**."  

  **For the Style Guide:**  

  > **Climate Attribution Wording:**  
  > When reporting on scientific studies attributing alterations to specific extreme weather events to human-caused climate change:  
  > *   Use active verbs describing the impact (e.g., *intensified, amplified, worsened, increased the likelihood of, made more severe, fueled, supercharged*).  
  > *   Explicitly state the nature of the alteration identified (e.g., *increased probability, added intensity/duration/severity, raised temperatures*).  
  > *   Avoid the unqualified verb "*caused*" unless the study methodology and conclusions explicitly demonstrate the event would have been *impossible* without human-induced climate change (a rare finding in attribution science).  
  > *   Always clearly link the verb and the specific alteration to the findings of the cited study.  
  >   
  > *Example (Compliant):* "Climate change **made** the [Event] **X times more likely and Y units more intense**, scientists report."  
  > *Example (Non-Compliant):* "Climate change **caused** the [Event]."  

  **Conclusion:**  
  This rule provides a clear, scientifically accurate, and linguistically precise standard. It captures the profound and demonstrable role of climate change in worsening the specific extreme events we report on, fulfilling our responsibility to inform the public, while adhering to rigorous standards of causation as understood by both the science and careful language use. It resolves the current impasse by directly incorporating the valid insights from both perspectives.  

  I recommend we adopt this wording standard immediately for the current story and incorporate it into our editorial style guide for future attribution coverage.  

  **Please indicate your agreement or suggest refinements by [Date/Time].**
