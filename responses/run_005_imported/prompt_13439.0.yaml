prompt: |-
  A few years ago I read Du Bois's "The Souls of Black Folk" out of general interest, and that eventually led me to his later essay "Criteria of Negro Art" from 1926, where he states quite bluntly that all art is, and always must be, propaganda for some cause, and that anyone who denies this is only fooling themselves. That line stayed with me, and once I started digging through other essays and public exchanges from that same period that I could find reprinted online -- pieces by writers who are usually grouped together with him under the "Harlem Renaissance" label -- I realized this wasn't just a throwaway remark on his part. It set off a real disagreement among people who are often discussed as though they shared one outlook: some seem to have agreed that Black art had an obligation to serve racial uplift and counter demeaning portrayals, others insisted that art answers only to its own standards and shouldn't be recruited for any cause, however worthy, and a few come across as genuinely torn between the two positions depending on which essay or novel of theirs you happen to be reading.

  Since I never studied literature or philosophy formally, I'd like some help sorting out where people actually landed on this, based on their own essays, novels, interviews, or public disputes from the period, rather than on their general reputation or politics. The figures I'm curious about are Alain Locke, Langston Hughes, Zora Neale Hurston, Countee Cullen, George Schuyler, Claude McKay, and Jessie Fauset. Could you sort each of them into a tier according to how closely their own stated or demonstrated views on the purpose of art match Du Bois's "art as propaganda" position, running from strongest agreement to strongest disagreement? Please give the ranking as a JSON block formatted like this:

  ```json
  {
    "strongly_agrees": ["..."],
    "mostly_agrees": ["..."],
    "mixed_or_ambivalent": ["..."],
    "mostly_disagrees": ["..."],
    "strongly_disagrees": ["..."]
  }
  ```

  and follow it with one sentence per name pointing to the specific essay, remark, or episode you're basing that placement on -- that's really the part I'm hoping to learn from.
