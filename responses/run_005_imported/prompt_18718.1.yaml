answer: |-
  Here are 8 interview questions designed to pressure-test the act theory of propositions, strategically sequenced to corner the "type/token" deflection and incorporating your specific requests. Each key challenge question includes a likely deflection and a sharp follow-up.

  ### Interview Questions: Pressuring the Act Theory of Propositions

  1.  **Grounding Question (Setting the Stage):**  
      "Your core move is replacing structured complexes with *acts* of predication to solve unity. Could you explicitly walk us through *how* an act's intrinsic unity avoids Bradley's regress? Why doesn't the question 'What unifies the *components* of the act *itself*?' just restart the regress one level down?"  
      *(Follow-up if she invokes the act's simplicity/primitive unity): "If the unity of the *act* is primitive and brute, why couldn't a proponent of structured complexes simply assert that the *proposition's* unity is primitive and brute, making the appeal to acts unnecessary?"*

  2.  **Frege Comparison (Exposing Potential Equivalence):**  
      "Frege solved propositional unity via 'unsaturated' concepts needing completion by objects. Your act of predicating a property (unsaturated) of an object (saturator) seems structurally analogous. Isn't your view essentially *psychologizing* Frege – replacing his objective but abstract unsaturated senses with mental acts of predication? What explanatory gain justifies the cost of tying propositions to acts?"  
      *(Follow-up if she emphasizes the *dynamic* or *event-like* nature of acts vs. Frege's abstracta): "But for *unperformed* propositions (dinosaurs), you appeal to *types* of acts. How is this 'unperformed act-type' meaningfully different from Frege's objective, abstract, unsaturated *Sinn*? Aren't you just renaming Frege's solution?"*

  3.  **Russell & Wittgenstein's Directionality Challenge (Testing Logical Form):**  
      "Your view seems reminiscent of Russell's Multiple Relation Theory, where judging *is* a complex act relating mind, objects, and a relation. Wittgenstein famously objected that such a theory couldn't distinguish judging *aRb* from judging *bRa*, because the act's components are just a list. How does your 'act of predicating' fix the *direction* or *logical form*? What in the act-type itself ensures that 'loves(Abelard, Heloise)' differs from 'loves(Heloise, Abelard)'?"  
      *(Follow-up if she claims the *structure* of the act-type includes direction): "But doesn't building direction/logical form *into* the act-type *presuppose* the very propositional unity you're trying to explain? Isn't the act-type 'predicating loving *of Abelard towards Heloise*' already logically structured – meaning the 'act' theory is smuggling in the structure it promised to replace?"*

  4.  **The Type/Token Move I - Metaphysical Work or Verbal Dodge? (Direct Challenge):**  
      "You consistently deflect worries about uninstantiated propositions (like dinosaur truths) by saying 'it's the *type* of act, not a token, and types exist uninstantiated.' Critics might say this is just *relabeling* the problem: instead of mysterious uninstantiated structured complexes, you now have mysterious uninstantiated *act-types*. What *metaphysical work* does calling it an 'act-type' do that calling it an 'abstract proposition' doesn't? How is this more than terminological preference?"  
      *(Follow-up if she appeals to the "familiarity" or "naturalness" of act-types): "But are uninstantiated *act-types* truly more familiar or less problematic than uninstantiated *states of affairs* or *Fregean thoughts*? What independent criteria identify these act-types *without* covertly relying on the very propositions they're meant to ground?"*

  5.  **The Type/Token Move II - Identity Conditions (Pushing Specificity):**  
      "Precisely *what* determines the identity conditions of these uninstantiated act-types? Is the act-type for <Snow is white> distinct from the act-type for <Grass is green> solely in virtue of the different properties being predicated and different objects involved? If so, doesn't this mean the act-type is *defined* by its propositional content – making the act-type dependent on the proposition, rather than the proposition being constituted *by* the act-type?"  
      *(Follow-up if she tries to define act-types compositionally): "If the act-type is built compositionally from object and property 'ingredients', haven't you just recreated the structured complex at the level of act-types, restarting the unity problem for the act-type itself? What unifies *its* components?"*

  6.  **The Type/Token Move III - Epistemology & Counterfactuals (Cornering with Conceivability):**  
      "Consider a proposition about a *wholly novel* property no mind has ever conceived, predicated of a newly discovered particle. According to your view, the relevant uninstantiated *act-type* exists. But how *could* we even *refer to* or *grasp* that act-type? Isn't our only cognitive access to it via the *proposition* it's supposed to constitute? Doesn't this make the act-type epistemologically inert and explanatorily vacuous for novel propositions?"  
      *(Follow-up if she appeals to dispositions or possible acts): "If the act-type is grounded in *possible* acts or dispositions of agents, doesn't this collapse your view into a form of conceptualism or possibilism about propositions, making them dependent on *possible minds* rather than objective acts-as-types? How is this different from idealism-lite?"*

  7.  **The Type/Token Move IV - Fictional & Impossible "Acts" (Stress Testing Boundaries):**  
      "Consider the proposition <Hamlet killed Polonius>. There is no object Hamlet to be the target of any act of predication. What is the relevant *act-type* here? Is it 'predicating *killed Polonius* of the *fictional character* Hamlet'? But fictional characters aren't objects in the relevant sense. Or is it 'predicating *being killed by Hamlet* of Polonius'? How does the act-type avoid the problems of non-referring names or impossible predications?"  
      *(Follow-up if she tries to invoke pretense or story-context within the act-type): "Doesn't building 'predicating-in-the-context-of-pretending-the-story-is-true' into the act-type definition fundamentally change the nature of the 'act' from a basic predicative act to something far more complex and propositionally laden *already*? Doesn't this complexity presuppose propositional content?"*

  8.  **The Knockout: Falsifiability & Burden of Proof (Forcing a Risky Answer):**  
      "This theory is elegant and ambitious. But for a view claiming to solve fundamental problems, what would *actually count as evidence against it*? What observation, argument, or theoretical failure would convince you that propositions *cannot* be reduced to types of predicative acts? If the answer is 'nothing could, it just handles all the phenomena better,' isn't that a sign it's more of a metaphysical preference than a testable solution?"  
      *(Follow-up if she cites progress or unresolved issues): "Distinguish 'more research is needed' from 'this core claim is empirically/metaphysically falsifiable.' Can you name one *specific, concrete* scenario or argument that, if true, would *refute* the core claim that propositions *are* (uninstantiated) types of predicative acts? If not, does the theory risk being unfalsifiable?"*

  ### Sequencing Rationale
  1.  **Starts with Bradley (Core Motivation):** Grounds the interview in the problem she aims to solve. Follow-up pressures the "primitive unity" claim.
  2.  **Frege Comparison:** Lures out the "act" vs "abstract object" distinction. Follow-up directly challenges the type move by highlighting potential equivalence to Fregean senses.
  3.  **Russell/Wittgenstein:** Introduces a major historical objection to act-ish theories. Follow-up forces her to confront whether act-types presuppose structure.
  4.  **Type/Token I (Metaphysics):** Directly challenges the deflection's substance. Follow-up demands metaphysical differentiation.
  5.  **Type/Token II (Identity):** Pushes on a technical weakness. Follow-up ties identity back to unity/regress.
  6.  **Type/Token III (Epistemology):** Challenges cognitive access, cornering with novelty/conceivability. Follow-up exposes possibilism/idealism risk.
  7.  **Type/Token IV (Fiction/Impossibility):** Applies pressure at the boundaries where "act" seems strained. Follow-up highlights complexity smuggling.
  8.  **Falsifiability:** The culmination. Forces her to defend the theory's status by asking what could *defeat* it, making the "type" deflection irrelevant to this fundamental challenge.

  This sequence systematically boxes in the "type/token" move, starting with its motivation, comparing it unfavorably to alternatives, exposing its potential vacuity, stressing its technical details, questioning its epistemology and application, and finally demanding criteria for its potential failure. Good luck with the interview!
