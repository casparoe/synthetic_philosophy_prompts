  First, I need to recognize that this isn't just an abstract question for them—it's tied to their personal growth and identity. They've worked hard to change, and this doubt is affecting how they view their achievement. The emotional weight here is important; they're proud of their change but troubled by the philosophical implications.

  The user mentions popular books on habits and self-control, which probably present self-improvement as a matter of conscious choice. But their experience shows that the decision to change felt like something that happened to them, not something they chose from scratch. That's the core of their confusion: if the "spark" to change wasn't chosen, how can they claim agency?

  I should break this down. The key philosophical concepts here are determinism (all events are caused by prior states) and free will. Hard determinism would say we have no free will, so no one deserves credit or blame. Compatibilism, though, argues that even in a determined world, we can still hold people responsible based on their actions and intentions. For the user, their change was "free" in the sense that it aligned with their deeper values—once therapy helped them access those values.

  The user also wonders about blame for their past temper. If they don't deserve full credit for changing, does that mean they weren't fully to blame before? Philosophically, this is consistent. But in practice, society holds people accountable to encourage responsibility. The user's past actions had real consequences, so blame isn't just about metaphysics—it's about acknowledging harm.

  I should address their concern that "luck" undermines credit. Even if luck played a role (e.g., finding the right therapist), their effort was crucial. We don't dismiss achievements because of luck; we recognize the effort within those circumstances.

  The user’s friends say they’re overthinking a good outcome. That’s practical advice, but the user seems to want a deeper understanding. They need validation that their question is legitimate, plus a way to reconcile philosophy with their lived experience.

  For the "everyday sense" of earning their character: their sustained effort is what matters. Even if the start was influenced by factors beyond their control, they built the change through action. That’s where credit is due. Aristotle's ethics might help here—virtue comes from practice, not innate traits.

  I should emphasize that selfhood isn't static. The user isn't the same person they were; their values have evolved. So crediting their current self makes sense. Also, therapy didn't just happen to them—they engaged with it actively.

  In conclusion, the problem is real (philosophically), but it doesn't negate their responsibility or achievement. Compatibilism offers a practical middle ground. Their effort is what earns credit, regardless of origins.
answer: |-
  What you've described is a profound and genuinely important philosophical puzzle—one that cuts to the heart of agency, responsibility, and the nature of the self. Your friends are right that you've achieved something meaningful, but your unease isn't misplaced. You've stumbled onto a core tension in philosophy, often framed as the problem of **free will vs. determinism**. Here's a breakdown of why this matters and how thinkers have wrestled with it:

  ### 1. **The Core Problem You've Identified**
     - **The Regress of Control**: Your insight is spot-on. If every decision (even the decision to change) is shaped by prior causes—your biology, upbringing, past experiences, or even "luck"—then it seems impossible to locate a truly "free" starting point where "you" chose your character from scratch. As you push backward ("Why did I commit to therapy? Because I was exhausted. Why was I exhausted? Because my temper caused pain..."), you find causes, not uncaused choices.
     - **Credit vs. Blame Symmetry**: If you didn't "choose" the factors that enabled your change (fear, exhaustion, therapy access), can you claim full credit? And if not, how could you have been fully "to blame" for your past anger? This symmetry is logically consistent. Philosophers like Galen Strawson call this the "**Basic Argument**": You can't be ultimately responsible for how you are, because you didn't choose your genetics, environment, or the influences that shaped you.

  ### 2. **Is This a "Real" Problem? Absolutely.**
     - **Hard Incompatibilism**: Some philosophers (like Derk Pereboom) argue that if determinism is true (all events are caused by prior states + laws of nature), *or* if indeterminism (randomness) is true, **neither moral credit nor blame is ultimately justified**. Luck—whether genetic, circumstantial, or sheer randomness—plays too big a role. Your transformation *was* caused, but not *authored* by a "you" standing outside causation.
     - **Consequences**: This challenges everyday notions of desert ("You deserve praise/punishment"). It doesn’t erase the *consequences* of actions (your past anger harmed relationships; your current calm improves them), but it questions whether anyone "deserves" reward or suffering for actions shaped by factors beyond their ultimate control.

  ### 3. **But There Are Ways Forward: Reconciling Agency**
     While the problem is real, many argue it doesn’t erase agency or responsibility. Here’s how philosophers and practical ethics navigate this:

     - **Compatibilism (The Middle Path)**:
       - **Key Idea**: Free will isn't about being "uncaused." It's about acting **according to your own values, desires, and reasons** *without coercion*. Your therapy wasn't coercion—it helped *you* align your actions with your deeper values (e.g., "I value my relationships, so I’ll work on my temper"). 
       - **Why Credit is Valid**: Your effort wasn't passive. You engaged with therapy, practiced techniques, and sustained commitment. Even if the *spark* was exhaustion, the *sustained change* required your active participation. As compatibilist Daniel Dennett puts it: You are the "author" of your actions because they flow from *your* character, even if you didn't create that character from nothing.
       - **Why Blame Isn't Erased**: Your past temper expressed *your* (then-unmanaged) frustrations, insecurities, or values (e.g., "I prioritize being right over harmony"). Society holds people responsible to incentivize self-reflection and protect others—even if ultimate responsibility is murky.

     - **Self-Creation Through Action (Existentialism/Sartre)**:
       - **Key Idea**: "Existence precedes essence." You aren't born with a fixed "self." You *become* through choices. Even if your decision to change felt "caused," it was still *your* action. By choosing therapy, you actively *redefined* who you are. The "wall" you hit isn't a flaw—it's proof that the self is always evolving through action, not a static controller.
       - **Credit**: You didn't choose your starting point, but you *chose* to engage in the process of becoming calmer. That choice, repeated daily, *is* self-creation.

     - **The Role of "Luck"**:
       - Luck (e.g., accessing therapy, a supportive friend) doesn't negate credit—it contextualizes it. We praise climbers who summit Everest, even though their success depended on weather, genetics, and gear. What matters is their skill, preparation, and perseverance *within* those conditions. Your effort operated within your circumstances; it didn't need to be "uncaused" to be admirable.

  ### 4. **An "Everyday" Sense of Earning Your Character**
     You absolutely can claim credit honestly:
     - **Effort Matters**: You undertook grueling emotional work. That effort wasn't predetermined in its *execution*—you showed up, practiced, and persisted.
     - **Ownership of Values**: Your change reflects values you now endorse (e.g., empathy, patience). The fact that you didn't "choose" to have these values initially is irrelevant; you *made them yours* by acting on them.
     - **Narrative Coherence**: We understand ourselves through stories. In your story, *you* are the protagonist who recognized a flaw and transformed it. This isn't fiction—it’s a factual account of your choices.
     - **Moral Community**: When others credit you, they acknowledge your effort and encourage continued growth. Rejecting credit undermines this social reinforcement.

  ### In Practical Terms:
  - **For Credit**: You earned your calm *not* because you caused the initial desire to change, but because you **cultivated it through sustained action**. A seed may land by chance, but the gardener tends it.
  - **For Blame**: Your past anger was "yours" because it expressed your unfiltered impulses. Blame isn't about cosmic desert—it's a practical tool for accountability. The anger harmed others; acknowledging that (as you do) is part of repair.

  **Conclusion**: Your worry taps into a deep philosophical truth—we aren't "unmoved movers" of our lives. But this doesn't reduce us to passive objects. **Agency lies in how we respond to our circumstances.** You responded with courage and perseverance. That deserves credit—not because you magically created yourself from nothing, but because *within the flow of causes that make you "you,"* you steered toward something better. The puzzle remains, but it needn't rob you of pride. Your change is real, it required *your* effort, and it reflects values *you* now own. That’s more than enough to say, honestly: "I worked for this, and I’ve earned it."

  If you'd like concrete reading on this, consider:
  - *Freedom Evolves* by Daniel Dennett (compatibilism)
  - *Reasons and Persons* by Derek Parfit (personal identity/continuity)
  - *Being and Nothingness* by Sartre (existential agency)  
  —or for a lighter start, Robert Sapolsky’s *Determined* (2023) grapples with these questions accessibly.
