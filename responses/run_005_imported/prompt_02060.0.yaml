  Ok this has been stuck in my head since an argument with a coworker last week. We disagreed about what actually got said on a client call, she felt like I was brushing off her version of events, and afterward she sent me a bunch of stuff about Miranda Fricker and 'testimonial injustice' - basically the idea that people's word gets discounted because of bias against who they are. Fair enough, I get the concept. But doesnt the logical fix just become: I should default to weighting her account of any disagreement more heavily than mine going forward, to cancel out the bias? Feels like the actual actionable takeaway here but also kinda weird, so wanted a sanity check before I actually start doing that.
