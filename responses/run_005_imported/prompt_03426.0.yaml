answer: |-
  This is a classic case of an "unwritten rule" hitting an unanticipated edge case! Based on the history and spirit of the rule you described, **neither of you is definitively "right" in the absolute sense, but your interpretation (that the overnight trip creates a fundamentally different scenario) is significantly more reasonable and aligned with the rule's past application.**

  Here's a breakdown of why:

  1.  **Context and Past Practice Matter:** You explicitly state the rule has *only ever* been applied on "normal days" where you were both "out and about and back within a couple hours of each other." This establishes a clear pattern of *intra-day* comings and goings. An overnight work trip falls completely outside this established context. It's a different category of absence.
  2.  **The Spirit of the Rule:** The unwritten rule seems designed for fairness *within the flow of a single day's shared living*. It addresses who handles the mess accumulated *while you were both out living your lives that day*. When you are away overnight on work, you weren't contributing to the day's dishes at all. Applying the "last home" rule literally to a 1am arrival after a multi-day absence twists its original purpose.
  3.  **The "Last" Concept Breaks Down:** On the day you returned, you *weren't* "out and about" in the same sense as your roommate. You were returning from a trip. Your roommate went to bed at a normal hour *in the home she occupied alone*. You arriving at 1am doesn't mean you were "out" longer than her *that day* in the context the rule was designed for; it means you were traveling back to resume cohabitation.
  4.  **Her Demand is Disproportionate:** Asking for a *week* of dishes as "make up" is unreasonable and punitive. It bears no relation to the usual consequence (one night of dishes) and seems like an opportunistic power grab rather than a fair application of the rule.
  5.  **The Rule Simply Didn't Cover This:** You've identified the core issue: the rule, as understood and practiced, had a gap. It didn't contemplate extended absences. Neither of you "always meant" it to cover this scenario because you never *thought* about this scenario until it happened.

  **Who "Wins"? (It's Not Really About Winning)**

  *   **Your Argument is Stronger:** You have history and context on your side. The rule was never applied this way, and an overnight trip is materially different from being out for dinner.
  *   **Her Argument is Literal but Flawed:** She's clinging to the strictest literal interpretation ("last person through the door that calendar day") while ignoring the context and spirit that gave the rule meaning and made it work for three years. Her demand for a week is indefensible.

  **How to Resolve This (Focus on the Future):**

  Forget about "who owes whom" for last week. The real goal is to preserve your good roommate relationship and clarify the rule. Here's a suggested approach:

  1.  **Acknowledge the Ambiguity:** Start the conversation by agreeing the rule didn't cover this situation. "Hey, we both know that dish rule has worked great, but my trip showed there's a situation we never thought about. The rule just wasn't designed for someone being away overnight."
  2.  **State Your Case Calmly:** Explain your reasoning: "Looking back, we've *only* ever used it when we were both out during the same day, coming home within a few hours. When I'm away on a trip, I'm not contributing to that day's dishes at all. It feels different than just being out late. That's why I didn't think the rule applied when I got back at 1am."
  3.  **Address the Disproportionate Demand (Tactfully):** "I understand you interpreted it literally, but asking for a *week* of dishes feels way out of proportion to the one night it usually is, especially for a situation we never discussed."
  4.  **Propose a Compromise (Optional Gesture):** To keep the peace and acknowledge her feeling of unfairness *if* she did extra dishes while you were gone: "How about I do the dishes tonight as a one-time thing to reset? But going forward, we need a clearer rule." (Only offer this if you genuinely feel it helps move forward. You aren't obligated).
  5.  **Collaborate on a New Rule/Clarification:** This is the most important step. Decide together how to handle future absences. Options include:
      *   **The "Return Day" Rule:** The rule only applies on days when *both* roommates were physically present and using the apartment at the start of the day. The person returning from a trip is exempt from "last home" duty on their return day.
      *   **Shared Responsibility During Absence:** Agree that the person *not* traveling handles all dishes accumulated *solely by themselves* during the other's absence. Shared mess (if any) waits, or the rule applies normally *after* the traveler returns and both are present.
      *   **Explicitly State the Rule Covers Only "Normal" Outings:** Define "normal" as being out within the same metropolitan area and returning the same calendar day.
      *   **Scrap the Rule for Trips:** Acknowledge the dish rule pauses during extended absences. Handle the dishes upon return collaboratively or based on who created them.

  **Key Takeaway:** This isn't about proving who was "right" about the past rule. It's about recognizing the rule had a gap, your interpretation was more consistent with its history, and her demand was unreasonable. Focus your energy on having a constructive conversation to *update* the rule for the future, preserving the harmony that's worked so well for three years. Good luck!
