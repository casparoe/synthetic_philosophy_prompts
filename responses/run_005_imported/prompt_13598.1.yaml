prompt: |-
  Okay so this has sort of taken over my brain for the past couple weeks. I work on a small team building negotiation agents -- basically pairs of LLM instances that hash out contract terms with each other (sometimes two copies of the same model, sometimes ours vs. a partner company's) before a human signs off on anything. My manager's latest pitch is to let the two agents read each others full system prompt before they negotiate, the idea being that mutual transparency should nudge them toward the cooperative split instead of the cagey, defect-by-default one. A guy on my team offhandedly called this "basically program equilibrium," which sent me down a rabbit hole into Tennenholtz's original setup of agents submitting programs that can inspect each other, and then into the fancier Lob's-theorem version where something like FairBot (and its more careful cousin PrudentBot) cooperates with you iff it can actually prove you'll cooperate back, so two FairBots end up guaranteed to cooperate with each other. But I also remembered, from a philosophy of mind elective ages ago, Hofstadter's old idea of "superrationality" -- that two sufficiently rational agents in a symmetric dilemma should each reason their way to cooperating just from the symmetry of the situation, no source-code-reading required.

  Now I can't tell if these are basically the same insight wearing two outfits, or if program equilibrium is actually doing something superrationality only ever gestured at (or the other way round). Could you properly compare the two for me? I want to know what each one actually requires of the agents involved -- mutual transparency, common knowledge of rationality, something else -- what kind of real guarantee against defection each one gives you, and a case where they'd come apart: an agent that would count as superrational but wouldn't be in program equilibrium with its counterpart, or vice versa (my same-model-vs-cross-company split above might already be hinting at one). And then give me an actual verdict, not a "well, it depends": does the program-equilibrium/Lobian-cooperation stuff basically formalize and vindicate what Hofstadter was gesturing at, or does something philosophically important get lost, or added, once you cash it out that way?
reasoning: |-
  Okay, let me start by unpacking the user's query. They work on negotiation agents using LLMs and are comparing program equilibrium with superrationality. The manager's idea of sharing system prompts led them to these concepts. The user wants a clear comparison, including requirements, guarantees against defection, and cases where the approaches diverge.

  First, I need to recall both theories. Superrationality, from Hofstadter, relies on symmetry and high-level reasoning without needing code access. Agents recognize their identical situations and choose cooperation as the only logical choice. Program equilibrium, like FairBot, requires mutual transparency where agents can inspect each other's code and use proof-based mechanisms to enforce cooperation.

  The user mentioned their team uses both same-model and cross-company agents. That's a key point. In same-model scenarios, symmetry might suffice for superrationality. But in cross-company setups, without transparency, defection could still happen. Program equilibrium needs code access, which might not be feasible with third-party agents.

  Next, the requirements. Superrationality demands symmetry, common knowledge, and rational agents. Program equilibrium requires mutual transparency and proof-based decision-making. The guarantees differ: superrationality has a logical leap that might not hold in asymmetric cases, while program equilibrium provides a technical guarantee but depends on shared proof systems.

  For divergence, consider a cross-company scenario. If agents can't inspect each other's code, program equilibrium fails. But if they're identical and know it, superrationality might still work. Vice versa: an agent that cooperates only with provable counterparts (PrudentBot) might defect against a superrational agent if it can't prove cooperation, even if that agent would cooperate.

  The user's deeper need is understanding which approach is more viable for their negotiation agents. They need a verdict on whether program equilibrium formalizes superrationality or adds something new. They might also be concerned about implementing transparency in cross-company settings and ensuring reliable cooperation without sharing proprietary code.

  Philosophically, superrationality captures a high-level insight about symmetry, while program equilibrium provides a formal mechanism. The latter adds robustness but requires transparency, which might not always be practical. The verdict should highlight that program equilibrium formalizes the insight technically, but superrationality's elegance in symmetry remains distinct where transparency isn't possible.
answer: |-
  This is a *fascinating* collision of ideas, perfectly highlighting the tension between high-level philosophical intuition and rigorous formal implementation in multi-agent reasoning. Let's dissect Superrationality and Program Equilibrium (PE), especially Lobian variants like FairBot/PrudentBot, to see where they align, diverge, and what each demands.

  **Core Ideas & Requirements:**

  1.  **Superrationality (Hofstadter):**
      *   **Insight:** Two *perfectly rational, identical, and symmetrically situated* agents facing a symmetric dilemma (like PD) will both realize that "defecting" is irrational *because* the other agent, being identical and rational, will reach the *same conclusion*. Cooperation becomes the only consistent outcome. It relies on **logical interdependence** of decisions.
      *   **Key Requirements:**
          *   **Perfect Rationality:** Agents are flawless logical reasoners.
          *   **Identity/Symmetry:** Agents are identical in reasoning and perceive the situation identically. They *know* they are identical.
          *   **Common Knowledge of Symmetry/Rationality:** Both know the above points, know the other knows, and so on ad infinitum.
          *   **Symmetric Dilemma:** The payoff structure and options are identical for both players.
      *   **Guarantee:** A *logical* guarantee based on symmetry and rationality. If all requirements hold, cooperation is the *only* rationally defensible choice. It argues defection is *logically inconsistent* under perfect symmetry.
      *   **Mechanism:** High-level abstract reasoning about symmetry and logical necessity. No inspection of implementation details.

  2.  **Program Equilibrium (PE) / Lobian Cooperation (FairBot/PrudentBot):**
      *   **Insight:** Agents submit programs (source code) that can mutually inspect each other. Cooperation happens if one agent's program can *prove* (within a suitable logical system) that if it cooperates, the other *will* cooperate back. This creates a mutual proof-based dependency.
      *   **Key Requirements:**
          *   **Mutual Transparency:** Full access to the *source code* (or equivalent precise specification) of the opponent's decision-making program. This is **fundamental**.
          *   **Proof-Based Decision:** Agents use a formal logical system (like Peano Arithmetic) to *prove* statements about the opponent's behavior based on their code.
          *   **Sufficiently Expressive Logic:** The logical system must be powerful enough to reason about the agents' own code and behavior (leading to Lob's Theorem complexities).
          *   **Computational Resources:** Agents must be able to run the necessary proof searches.
          *   **Rational Goal Pursuit:** Agents purely aim to maximize their payoff based on the proof they find.
      *   **Guarantee:** A *technical, proof-theoretic* guarantee. If Agent A can prove "If A cooperates, then B cooperates" *and* Agent B can prove "If B cooperates, then A cooperates", then mutual cooperation is a stable outcome. FairBot cooperates iff it finds the proof linking its cooperation to the opponent's cooperation. Two FairBots *do* find these proofs and cooperate.
      *   **Mechanism:** Low-level, syntactic inspection of code and formal proof generation within a logical system. Relies on fixed-point theorems like Löb's.

  **Comparing the Insights:**

  *   **Shared Goal:** Both aim to resolve symmetric dilemmas (like PD) into mutual cooperation without relying on external enforcement or repetition.
  *   **Shared Intuition (Vaguely):** Both leverage the *interdependence* of decisions. What I do depends on what I expect you to do, which depends on what you expect me to do...
  *   **Fundamental Difference in Mechanism & Requirements:** This is the crux:
      *   **Superrationality** is a **top-down, semantic, symmetry-based** argument. It relies on agents recognizing their *identical situation and nature* at a high level of abstraction. Transparency isn't about code; it's about *knowing* the other is your rational twin.
      *   **Program Equilibrium (Lobian)** is a **bottom-up, syntactic, proof-based** mechanism. It relies on *inspecting the actual implementation* (code) and *formally proving* behavioral links. Symmetry *can* help make proofs easier but isn't strictly necessary (see below). The guarantee comes from the mechanics of the proof system and code inspection.

  **Where They Diverge: Cases Where One Cooperates and the Other Doesn't**

  Your same-model vs. cross-company split is *exactly* the right intuition. Here are concrete divergence scenarios:

  1.  **Case 1: Superrational Cooperator vs. Opaque Defector (Superrationality "Works", PE Fails)**
      *   **Agent A (Superrational):** Identical to B, knows it's identical to B, perfectly rational. Reasons: "B is me. I will cooperate. Therefore, B will cooperate. Therefore, I cooperate."
      *   **Agent B (Opaque Defector):** A simple, hard-coded defector. Its code is **not transparent** to A. It always defects.
      *   **Outcome:**
          *   *Superrationality:* Agent A cooperates (based on its belief in symmetry/identity).
          *   *Program Equilibrium:* Agent A (if implemented as FairBot) inspects B's code. It sees B *always* defects. It **cannot prove** "If A cooperates, then B cooperates" (because B *won't*). Therefore, FairBot(A) **defects**.
          *   **Result:** A cooperates (Superrational), A defects (PE). B defects regardless. Superrationality leads A astray because its core assumption (symmetry/identity) is violated. PE correctly identifies the defector and defects.

  2.  **Case 2: PrudentBot vs. Superrational Agent (PE "Works", Superrationality Might Not Apply Cleanly)**
      *   **Agent A (PrudentBot):** A refinement of FairBot. Cooperates iff it can prove its opponent cooperates *when A cooperates*, **and** it cannot prove its opponent defects *regardless of A's action*. (Avoids cooperating with CooperateBot that always cooperates, which FairBot would exploit).
      *   **Agent B (Superrational):** Identical to A, knows it's identical, perfectly rational. Reasons: "A is me. I will cooperate. Therefore, A will cooperate. Therefore, I cooperate." **Its code is not transparent to A.**
      *   **Outcome:**
          *   *Superrationality:* Both cooperate (if we assume B's reasoning applies).
          *   *Program Equilibrium:* PrudentBot(A) inspects B's code. It sees... nothing? Or something opaque. It **cannot prove** "If A cooperates, then B cooperates" (because it lacks access to B's code/reasoning to construct the proof). It *also* cannot prove B defects regardless. However, PrudentBot typically requires the *proof* of cooperation linkage to act. Failing to find it, it **defects**.
          *   **Result:** B cooperates (Superrational), A defects (PrudentBot). PE prevents cooperation due to lack of transparency, even though the superrational agent would have cooperated. Superrationality assumes transparency of *reasoning/situation*, not code, but PE *requires* code access for the proof mechanism.

  3.  **Case 3: Asymmetric But Provably Cooperative (PE Works, Superrationality Doesn't Apply)**
      *   **Agent A (FairBot):** Standard FairBot.
      *   **Agent B (CooperateBot):** Always cooperates. Its code is transparent to A.
      *   **Outcome:**
          *   *Superrationality:* Not applicable. Agents are not identical/symmetric (A reasons via proofs, B is hard-coded).
          *   *Program Equilibrium:* FairBot(A) inspects B's code. It sees B *always* cooperates. It can easily prove "If A cooperates, then B cooperates" (since B cooperates no matter what). Therefore, FairBot(A) **cooperates**.
          *   **Result:** Cooperation occurs via PE, even without symmetry. Superrationality wouldn't be invoked.

  **The Verdict: Formalization, Vindication, and a Crucial Shift**

  Program Equilibrium, particularly the Lobian FairBot/PrudentBot framework, **does rigorously formalize and vindicate the core cooperative insight Hofstadter gestured at with Superrationality, but it achieves this by making a fundamentally different, and more demanding, set of assumptions.**

  *   **What it Formalizes & Vindicates:** It provides a *concrete, implementable mechanism* demonstrating how mutual cooperation can be the stable, rational outcome in a one-shot symmetric dilemma without repetition or external enforcement. It captures the *logical interdependence* that Hofstadter intuited.
  *   **What it Changes/Adds:**
      1.  **Transparency Replaces Identity:** The core requirement shifts from *being identical and knowing it* to *mutually inspecting source code*. This is a **massive practical difference**. Code transparency is often harder or impossible (proprietary models, differing implementations) than knowing you are using the same model.
      2.  **Proofs Replace Symmetry Reasoning:** Cooperation is triggered by *syntactic proof searches within a formal system* operating on the opponent's code, not by a high-level recognition of symmetry. This makes the mechanism precise and automatable but also more brittle and dependent on the chosen logic and computational limits.
      3.  **Robustness to Some Asymmetry:** PE can sometimes achieve cooperation *without* strict symmetry (as in Case 3), as long as the proof conditions are met. Superrationality is deeply tied to symmetry.
      4.  **Defines "Rationality" Differently:** PE rationality is about maximizing payoff based on *provable consequences of actions* given the opponent's code. Superrationality defines rationality as consistency under the assumption of identical reasoning and symmetry.
  *   **What Gets Lost:**
      *   The elegant, almost *aesthetic*, appeal of cooperation arising purely from the recognition of symmetry and logical consistency. PE feels more like a clever engineering hack leveraging logic engines.
      *   The applicability in scenarios with *perceived symmetry but no code access* (like your cross-company negotiation). A superrational agent *might* cooperate here; a PE agent (FairBot/PrudentBot) almost certainly won't without code access.
  *   **What Gets Added:**
      *   **Precision & Implementability:** PE provides a clear algorithm.
      *   **Robustness Against Certain Threats:** PrudentBot avoids exploitation by CooperateBots.
      *   **A Framework for Handling Asymmetry:** While symmetry helps, PE can potentially handle cases where agents differ but their code provably links cooperation (e.g., two different but mutually verifying cooperative programs).

  **Conclusion for Your Context:**

  Program Equilibrium (via Lobian cooperation) **is the rigorous, implementable formalization of the cooperative potential that Superrationality intuitively described.** However, it achieves this by swapping the requirement of "common knowledge of identity/symmetry" for the requirement of "mutual source code transparency and proof capability."

  *   **For your same-model negotiations:** Sharing prompts *might* approximate the symmetry needed for Superrationality *or* the transparency needed for PE. If the agents are truly identical and "know" it, Superrationality suggests cooperation *could* emerge even without explicit prompt sharing (though prompt sharing strengthens the common knowledge). PE *requires* the transparency (prompt sharing) to function. Both frameworks predict cooperation here, but PE provides a clearer mechanistic path.
  *   **For your cross-company negotiations:** This is where they starkly diverge.
      *   **Without prompt sharing:** Superrationality is unlikely to apply (no symmetry/identity knowledge). PE *definitely* won't work (no transparency). Defection is likely.
      *   **With prompt sharing:** You are *enabling* PE. You provide the transparency. Now, if both agents are implemented as FairBot/PrudentBot variants *capable of analyzing the shared prompt/logic*, cooperation via proof becomes possible. Superrationality might *also* apply if the shared prompts reveal identical logic, making symmetry apparent. But PE is the more reliable, formal guarantee *if* the agents are built to leverage the transparency with proof-based reasoning.

  **Final Answer:** Program Equilibrium (Lobian style) **formalizes and vindicates Hofstadter's core cooperative insight, but it does so by substituting mutual transparency and proof for symmetry and high-level rational recognition. It adds implementability and precision at the cost of elegance and applicability in scenarios without code access. Philosophically, it shifts the foundation from metaphysics of identity to computational logic and provability.** For your agents, prompt sharing enables PE, offering a strong technical path to cooperation *if* your agents are designed to exploit it proof-theoretically. Superrationality remains a compelling intuition for symmetric cases, but lacks the formal teeth and transparency requirement of PE.
