answer: |-
  Here’s a toast that honors both truths—her lack of blame for the struggle and her full credit for the triumph—while keeping it warm, personal, and celebratory:

  ---

  **(Raise your glass, make eye contact with your sister first, then scan the room)**  

  "Five years ago, if someone told me we’d be here tonight celebrating my sister’s sobriety, I’m not sure I’d have believed them. Not because I didn’t hope for it with every fiber of my being, but because I knew the sheer scale of what she was up against.  

  **Addiction**—and I’ll use the word she taught me matters—**is a disease**. It’s not a choice. It’s not a moral failing. It’s not a weakness of character. It hijacks the brain, rewires survival instincts, and traps people in a cycle they never asked for and don’t deserve. My sister didn’t choose that fight. It chose her.  

  **But here’s what she DID choose:**  
  She chose to walk into her first recovery meeting when every instinct screamed to run the other way.  
  She chose to ask for help—again and again—when shame whispered she should hide.  
  She chose to sit through unbearable discomfort, to face triggers head-on, to rebuild relationships brick by painful brick.  
  She chose honesty when deception felt easier. She chose patience when frustration boiled over. She chose courage when fear threatened to swallow her whole.  

  **That’s not luck.** That’s not a disease ‘loosening its grip.’ That’s my sister showing up—day after day, year after year—and making the hardest, bravest, most deliberate choices imaginable.  

  **So how do those two truths fit together?**  
  It’s simple: The disease isn’t her fault.  
  **The recovery is her achievement.**  

  She couldn’t control the storm that hit her ship… but my God, did she learn to sail through it. She took the helm. She patched the holes. She navigated the darkest waters with a strength that leaves me in awe. That strength wasn’t given to her by luck or fate. **She forged it. She earned it. She owns it.**  

  To our family, she’s proof that love is stronger than fear.  
  To her recovery family here tonight, she’s living proof that the work works.  
  And to anyone watching: she’s proof that **agency isn’t about where you start, but the direction you choose to go.**  

  So, [Sister’s Name], this isn’t just a toast to five years sober.  
  It’s a toast to **YOU**—to the choices you made when no one was watching.  
  To the resilience you built when you felt broken.  
  To the life you reclaimed, not by chance, but by sheer, unwavering will.  

  We see you. We honor you. We are unbelievably proud of you.  
  **To five years of choosing the light—and to every bright choice still ahead!**"  

  ---

  ### Why this works
  1.  **Validates Both Frames:** Explicitly calls addiction a "disease" (honoring her group’s language) and emphasizes it wasn’t chosen or deserved. Equally explicitly credits HER choices for recovery ("deliberate choices," "she forged it").
  2.  **Resolves the Tension:** Uses the "storm/sailing" metaphor to show the distinction: No control over the disease (the storm), full credit for navigating it (her choices at the helm). The "agency is about direction" line distills compatibilism into plain English.
  3.  **Focus on Action:** Highlights *specific* choices she made (asking for help, facing triggers, honesty), making her effort tangible and praiseworthy. Counters the "luck" narrative head-on.
  4.  **Includes Both Audiences:**  
      *   *Recovery Group:* Uses their language ("disease," "recovery," "the work works"), shows deep respect for the framework.  
      *   *Family:* Uses relatable metaphors (storm, sailing, light), emphasizes love and pride, keeps it emotionally resonant ("leaves me in awe").
  5.  **Sounds Like a Toast:** Warm, personal ("my sister"), celebratory ("unbelievably proud"), uses classic toast structure (story -> tribute -> raise glass). Avoids jargon.
  6.  **Time:** Delivered with feeling, this runs about 4-5 minutes.

  **Key Delivery Tip:** Speak slowly, with emotion. Pause after impactful lines ("It chose her." / "She owns it."). Let your pride and love for her shine through your voice. Look at her often, especially during the "You" section.  

  This toast gives her exactly what she asked for: recognition that the battle wasn’t her fault, but the victory is entirely, magnificently hers.
