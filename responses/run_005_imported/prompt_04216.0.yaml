  First, I need to clearly define the Odysseus archetype: it's about an agent (1) voluntarily creating constraints (2) against their own future irrationality/impulses (3) while maintaining agency. This three-part test will be my ranking filter.

  Looking at the examples:
  - Psychiatric advance directives fit perfectly: same voluntary precommitment against known future vulnerability (S-tier)
