answer: |-
  You've hit on a fundamental asymmetry in how humans assign blame and credit, rooted in psychology, philosophy, and social dynamics. It's not just inconsistency or sadness – there are real principles at play:

  1.  **The Fundamental Asymmetry of Blame vs. Credit:**
      *   **Blame for Harm:** When harm occurs (Priya's situation), we instinctively look for a *responsible agent*. We ask: "Who caused this?" and "Did they *allow* or *disregard* the risk?" Your statement "I don't care one way or the other whether this messes with Priya's hours" is crucial here. It demonstrates *awareness* of a significant risk to her well-being and a conscious decision to proceed *indifferent* to that specific risk. This is interpreted as **reckless indifference** or **negligence**. Even without *intent* to harm, you're blamed for *foreseeably allowing* harm through indifference.
      *   **Credit for Benefit:** When benefit occurs (Tom's situation), credit requires *intent* or *direct effort* to cause that specific good outcome. Since your *only* stated intent was cost-cutting, and Tom's benefit was an unforeseen (and un-cared-about) side effect, it *is* seen as an accident. People don't give credit for accidental benefits because there was no *agency* directed towards creating *that* good. You didn't *try* to help Tom; you lucked out.

  2.  **The Role of Foreseeability & Vulnerability:**
      *   **Priya:** Her vulnerability as a single mom reliant on specific hours for childcare was (or should have been) highly foreseeable to anyone managing her schedule. Your explicit statement proves you *were* aware of this specific risk. Ignoring a *foreseeable and severe* negative consequence to a *vulnerable* person feels like a conscious choice to prioritize costs over her stability. That's why it reads as "targeting" – not necessarily malicious intent, but a callous disregard for her known dependence on those hours.
      *   **Tom:** Unless he had explicitly and recently told management he desperately *wanted* fewer hours (and you knew this), his benefit was *unforeseeable*. Managers aren't expected to psychically know an employee might appreciate fewer hours unless it's communicated. Therefore, the positive outcome feels genuinely accidental.

  3.  **Moral Luck (The Nagel Point):**
      Philosopher Thomas Nagel explored this exact phenomenon. Identical intentions and actions can lead to wildly different moral judgments based purely on *outcomes* you couldn't fully control. This is "moral luck."
      *   **Negative Moral Luck (Priya):** Your action (cost-cutting while indifferent to known individual impacts) *happened* to severely harm a vulnerable person. The bad outcome triggers a much harsher judgment of your initial indifference.
      *   **Positive Moral Luck (Tom):** The *same* action *happened* to benefit someone. The good outcome doesn't mitigate the blameworthiness of the initial indifference, nor does it create praiseworthiness, because the benefit was unintended and unforeseen.

  4.  **The Weight of "I Don't Care":**
      Saying this *out loud* was a critical error. It transformed what might have been perceived as an unfortunate oversight into a documented case of *deliberate indifference* to a known risk facing a specific employee. It made your prioritization brutally clear: Costs > Priya's stability. This statement is likely the core reason staff feel you "targeted" her. It wasn't malice, but it *was* a conscious exclusion of her well-being from your decision criteria.

  5.  **The Empathy Gap & Negativity Bias:**
      Humans feel the pain of loss (Priya's hardship, stress, potential financial crisis) much more acutely than the pleasure of gain (Tom's extra free time). We're also wired to pay more attention to negative events. Priya's suffering demands explanation and accountability, while Tom's benefit is a pleasant footnote.

  **Why Your Sister is Partly Right (But Not Fully):**

  *   **Guilt & Rationalization:** She correctly identifies you're grappling with guilt. Defending your identical "mental state" *is* a form of rationalization to alleviate that guilt. You *are* emphasizing the lack of *malicious* intent to downplay the *negligent* aspect (indifference to foreseeable harm).
  *   **"Deep down cared more about hurting Priya"?** This is likely incorrect. Your core motivation was cost-cutting, not harming Priya. However, the *effect* of your indifference *was* that you cared *less* about preventing harm to Priya than you did about achieving the cost savings. That's the negligence.

  **What's Really Going On & What To Do:**

  1.  **Acknowledge the Negligence, Not Malice:** You didn't *target* Priya, but you *were* negligent. You knew a significant risk to her well-being existed and chose to proceed with indifference. *That* is what people are blaming you for. Stop defending the "identical mental state" – the *context* (her vulnerability, your knowledge of it) made the indifference towards *her* outcome morally significant in a way the indifference towards *Tom's* outcome wasn't.
  2.  **Apologize Specifically & Take Responsibility:** Don't double down. Apologize *to Priya and the staff* for the *impact* of the decision, acknowledging that while the *goal* was cost-cutting, you failed to adequately consider the foreseeable severe impact on Priya given her known circumstances. Acknowledge that your "I don't care" comment was inappropriate and reflected poorly on your priorities as a manager. Take ownership of the *outcome*.
  3.  **Offer Mitigation (If Possible & Sincere):** Ask Priya (privately) if there's anything feasible you can do *now* to help mitigate the damage (e.g., exploring if any future schedule tweaks are possible, offering a small temporary hardship bonus if finances allow - *without* creating unsustainable precedent). This isn't "credit" for Tom; it's damage control for the harm caused to Priya.
  4.  **Learn for the Future:** Implement a policy where significant schedule changes involve:
      *   **Assessment:** Briefly consider known major dependencies (childcare, second jobs, classes) among staff.
      *   **Communication:** Give as much notice as possible and *ask* if major changes create hardship *before* finalizing, allowing for discussion if feasible alternatives exist that still meet the business need.
      *   **Avoid "I Don't Care" Statements:** Frame decisions professionally around business necessities without expressing callous indifference to individual impacts, especially known vulnerabilities.

  **In short:** People aren't being inconsistent because Priya's story is sad. They are reacting to the *foreseeable harm caused by your demonstrated indifference* to a known vulnerability in her case, contrasted with the *accidental benefit* in Tom's case where no vulnerability was ignored. Your "mental state" of cost-cutting focus was the same, but the *moral significance* of your indifference changes drastically based on the foreseeable consequences and vulnerabilities involved. The path forward involves acknowledging the negligence inherent in that indifference towards Priya, not just the lack of malice.
