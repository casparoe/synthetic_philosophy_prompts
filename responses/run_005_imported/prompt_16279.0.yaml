  **Justifications:**

  1. **Nora (1): Score 1**  
     Nora correctly identifies Zahavi's original emphasis on *substantial net costs* as central to the handicap principle's biological intuition. Her point about signal collapse without costs is valid for Zahavi's verbal theory. However, she oversimplifies Grafen's formalization, which doesn't require *net* costs to be high for high-quality signallers. Thus, she's partially right but misses key technical nuance.

  2. **Ben (2): Score 2**  
     Ben is unambiguously correct about Grafen's ESS model. The model hinges on *differential marginal costs*: honesty is maintained when low-quality individuals face steeper costs for the same signal level. High-quality signallers *can* pay minimal *marginal* costs at equilibrium. This reframes "cost" as "cost to cheat," a foundational insight of Grafen's work.

  3. **Nora (3): Score 1**  
     Nora validly flags a tension between Zahavi's biological handicap (burning surplus) and Grafen's game-theoretic solution. Her "cheap talk" analogy is overstated (since Grafen requires *differential* costs, unlike cheap talk), but she rightly notes that Grafen's equilibrium allows high-quality signals to be *biologically inexpensive*, which feels at odds with Zahavi's original imagery. This deserves credit for exposing a conceptual gap.

  4. **Ben (4): Score 2**  
     Ben correctly identifies Nora's conflation of two costs:  
     - **Strategic cost**: The extra burden *specifically required to maintain honesty* (which can be small for high-quality signallers in Grafen's model).  
     - **Efficacy cost**: The baseline cost to produce *any functional signal* (e.g., metabolic cost of growing feathers).  
     This distinction is critical, and Ben is right that Zahavi's early critics (like Maynard Smith) accused him of confusing them. His defense of Grafen's testability is also sound.
