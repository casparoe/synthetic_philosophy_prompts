  Kant considered infinity as a regulative idea, not constitutive. He thought we can't experience actual infinity, only approach it as an ideal. So for actual infinite sets, Kant might agree with Brouwer that LEM doesn't hold because we can't construct them fully. But math for Kant deals with possible constructions in intuition. Since we can't intuit an infinite set completely, applying LEM might be problematic.

