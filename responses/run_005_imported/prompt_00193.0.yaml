  Also, Kant's transcendental idealism separates phenomena from noumena. Math applies to phenomena, where our intuitions structure reality. So for phenomena, LEM should hold. But Brouwer's rejection targets the mathematical treatment of infinity, which Kant might see as stepping into the noumenal realm. Thus, Kant might resist Brouwer to keep math's applicability to experience intact.

