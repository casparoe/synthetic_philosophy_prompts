  ## The Unchosen Chain

  The parole hearing room smelled of stale coffee and industrial cleaner. Fluorescent lights hummed overhead, casting a harsh, shadowless glare on the chipped Formica table. Silas Vance sat facing the three-member board, his prison-issued blues crisp, his posture unnervingly still. Behind him, in the small public gallery, sat Mrs. Eleanor Reed, her knuckles white where they gripped the edge of the pew. Her son, Daniel, hadn’t made it to twenty. Silas Vance had ensured that seventeen years ago.

  Chairwoman Rodriguez adjusted her glasses. “Mr. Vance, your file shows commendable progress. Completing your GED, participating in anger management, leading the peer counseling group… the psychological evaluations note genuine remorse and significant personal change. You’ve served seventeen years of a twenty-to-life sentence. Why should this board grant you parole?”

  Silas took a slow breath. His voice, when it came, was low but clear, rehearsed yet carrying an undercurrent of something raw. “Because I’m not the man who did that terrible thing, ma’am. That man… he was lost. Angry. Full of poison he’d been fed since he was a kid. He saw threats everywhere. He reacted… like an animal.” He glanced down at his hands, calloused from prison workshop labor, not the bruised knuckles of his youth. “I chose to change. I chose to learn. To understand the pain I caused.” He met Mrs. Reed’s stony gaze for a fraction of a second before looking back at the board. “I’ve worked every day to become someone different. Someone better.”

  Mrs. Reed made a small, choked sound.

  Board Member Jensen leaned forward. “That ‘poison,’ Mr. Vance. Your father’s violence, your mother’s neglect, the neighborhood chaos… you didn’t choose that environment. We understand that. But at some point, doesn’t responsibility begin? When you picked up that knife? When you chose to confront Daniel Reed over a perceived slight?”

  Silas nodded, a flicker of the old defensiveness surfacing before he smoothed it away. “Yes, sir. Absolutely. My actions. My choice that night. Horrible. Unforgivable.” He paused, his brow furrowing slightly, as if navigating an internal maze. “But… *why* did I make that choice? Why did that slight feel like an existential threat? Why was violence my… my *default* language?” He looked not at the board, but at the blank wall behind them. “It came from *me*. From how I was built by then. My instincts. My temper. My… my deep-down belief that the world was only about taking or being taken from. I didn’t *choose* to be built that way. That wiring… it was installed long before I knew what wires were.”

  Chairwoman Rodriguez tapped her pen. “Yet you claim you chose to change. That demonstrates agency, doesn’t it? The capacity to become ‘someone better’?”

  Silas’s gaze snapped back, intense. “I *did* choose. Every day. Reading the books when I just wanted to sleep. Going to group when I wanted to hide in my cell. Talking about the shame instead of burying it.” He gestured towards the thick file before them. “The work is real. The change feels real. But…” He trailed off, a profound confusion momentarily clouding his features. “*Why* did I choose *that*? Why did the idea of being ‘better’ suddenly matter? Because I met Father Michael? Because my cellmate, Benny, died showing me a scrap of kindness? Because I finally *saw* Mrs. Reed’s face at the last hearing?” He shook his head slowly. “Those things… they touched something *already in me*. A tiny seed of… disgust? With myself? With the whole mess? But I didn’t *plant* that seed. It just… was there. Maybe Benny’s kindness watered it. Father Michael gave it light. But the *seed*… where did *that* come from? Wasn’t it just… part of the original, unchosen mess? A different thread in the same tangled knot?”

  He looked directly at Mrs. Reed now, his voice dropping almost to a whisper. “I *am* sorry. With everything this new person I’ve become can feel. But… is this ‘new person’ any more *mine* than the monster was? I didn’t build this remorse from nothing. It grew from soil I didn’t lay. Does that make the apology… hollow? Does it make the change… less real? Or just… just *inevitable*, given the new inputs hitting the old machine?”

  The room was utterly silent. The hum of the lights felt deafening. Mrs. Reed stared at Silas, not with hatred now, but with a kind of horrified fascination, as if seeing the gears turning inside a broken clock. The parole board members exchanged uneasy glances. Jensen looked troubled; Rodriguez, professionally inscrutable.

  “So,” Rodriguez finally said, her voice carefully neutral, stripping away the metaphysics, “are you saying you *couldn’t* help but change? That your rehabilitation isn’t truly your doing?”

  Silas slumped back, the fight draining out of him. He looked exhausted, cornered by his own logic. “I don’t know,” he admitted, the words heavy. “I just know the man who stabbed Daniel… he was made, not born. And the man sitting here now… he was made too. By things before, and things after. Where’s the… the *starting point* where *I* began?” He looked down at his hands again. “Maybe there isn’t one.”

  Mrs. Reed stood up abruptly. Her voice, when it came, was raw, trembling with a lifetime of grief. “You didn’t choose your monsters, Silas Vance. But you *became* one. And this… this *regret*?” She gestured vaguely at him, at the room. “It doesn’t feel like a choice either. It feels like… weather. Happening *to* you. Just like the violence did.” A tear tracked through the powder on her cheek. “How can I blame the weather? But how can I forgive it?” She turned and walked out, the door clicking shut with terrible finality.

  The parole board deliberated briefly. The decision was unanimous. Denied. Silas Vance was still a risk, they stated. Actions had consequences. Rehabilitation was ongoing.

  As the guard led him away, back towards the echoing concrete hall, Silas walked with the same unnerving stillness. But his eyes held a new, bleak vacancy. He hadn’t been found irredeemable. He’d been found… irrelevant. A consequence of causes, pleading for a credit he could never truly own, trapped in an endless corridor of unchosen rooms, the door marked "Self" forever locked from the inside. The guard nudged him. "Move along, Vance." He moved. Because that, at least, was something he could still *do*.
