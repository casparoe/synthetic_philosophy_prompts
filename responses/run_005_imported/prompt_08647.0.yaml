  Here's where the Basic Argument creeps in. When Silas talks about choosing to change, I'll have him hesitate. His eyes might flick to his own hands, like he's realizing his "choice" came from values shaped by prison programs... which he only joined because his cellmate died showing him kindness... which resonated only because his childhood left him starved for connection. The regress is visible in his pauses, his crumbling certainty.  

