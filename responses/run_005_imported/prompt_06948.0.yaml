answer: |-
  You've articulated a profound dilemma with remarkable clarity—one that cuts to the heart of how illness, agency, and human relationships intersect. Your resistance isn't about withholding compassion; it's about preserving the integrity of a *relationship* rather than reducing it to caretaking. The counselor's framework (while clinically useful) risks collapsing two distinct dimensions: **causal explanation** and **relational accountability**. Here's how to untangle them:

  ### 1. **The Crucial Difference: Excusing Acts vs. Dissolving Relational Bonds**
     - **Excusing Specific Acts**: Acknowledging that addiction *causally influenced* his behavior (e.g., impaired judgment, physiological compulsion) allows you to understand *why* certain harms occurred without denying they *were* harms. This doesn’t erase the damage, but it reframes the locus of blame.
     - **Dissolving Relational Accountability**: This suggests that because his actions stemmed from disease, *no relational debt exists*—trust need not be rebuilt, amends aren’t owed, and your hurt is invalid. This reduces him to a patient, not a person embedded in a web of mutual obligations.

  **The medical diagnosis explains the *origin* of the harm, but not the *relational aftermath*.** A broken leg explains why someone crashed into your car, but it doesn’t absolve them of responsibility for repairs—or your right to feel upset about your totaled vehicle. Similarly, addiction explains *why* your brother borrowed money or caused scenes, but the fractures in trust and emotional safety remain real wounds that require *relational repair*, not just medical management.

  ### 2. **Where the Medical Model Falls Short (and Why It Feels Like a "Trade")**
     - **It Confuses Explanation with Absolution**: Medicine excels at identifying causes. Ethics deals with consequences and repair. The counselor’s advice conflates "don’t take it *personally*" (i.e., this wasn’t about *contempt* for you) with "don’t treat it as *interpersonal*" (i.e., no relational repair is needed). The first is true; the second is a category error.
     - **It Erases His Moral Agency**: By framing *everything* as a "symptom," the model risks implying your brother has no "self" outside the disease—no capacity for reflection, remorse, or choice *now*. This is dehumanizing. Recovery isn’t just symptom management; it’s the reclamation of agency. True healing requires him to engage with the damage he caused, not just "stay well."
     - **It Invalidates Your Moral Emotions**: Your anger, hurt, and disappointment aren’t just obstacles to *his* wellness; they are testaments to the value you placed on the relationship. Dismissing them as "taking it personally" denies your right to have been wounded. As philosopher P.F. Strawson noted, resentment is the shadow cast by our expectation of mutual regard.

  ### 3. **The "Further Question" the Diagnosis Doesn't Touch**
     Your brother’s diagnosis answers: *"What mechanistic forces drove this behavior?"*  
     It cannot answer: ***"How do we rebuild a shared future when trust is broken?"***  

     This second question hinges on **three elements the medical model ignores**:
     - **Your Brother’s Capacity for Moral Engagement**: Is he developing insight? Does he acknowledge the *relational* (not just clinical) impact of his actions? Is he willing to make amends *without demanding immediate forgiveness*?
     - **Your Agency in the Relationship**: Compassion doesn’t require forfeiting boundaries. You have the right to say: "I accept this was the addiction, not your core self, but our relationship needs active repair before I can trust fully again."
     - **The Nature of Repair**: Relationships aren’t transactional ledgers ("he owes X apologies"), but they *do* require evidence of renewed commitment. As ethicist Margaret Urban Walker argues, repair involves *narrative* (shared understanding of harm), *vulnerability* (his willingness to hear your pain), and *changed patterns*.

  ### A Path Forward: Holding Both Truths
     - **To Your Brother**:  
       *"I believe in your disease and your fight for recovery. I also need to know you understand how your actions fractured our relationship. Moving forward isn't about punishment; it’s about both of us working to rebuild something different."*  
       His willingness to sit with your pain—without defensiveness—is the litmus test.
     
     - **To Your Family/Counselor**:  
       *"Supporting his health doesn’t mean erasing the past. I can hold compassion for his struggle while still needing accountability for the relational damage. These aren’t opposites; they’re both necessary for healing."*

     - **To Yourself**:  
       Your resistance isn’t anger clinging on; it’s your integrity insisting that relationships require mutual recognition. Forgiving isn’t forgetting—it’s choosing to rebuild *despite* the harm. But rebuilding requires materials: his accountability, your guarded openness, and time.

  ### Why Your Mother’s Approach Feels Like a Loss
  She’s traded relational complexity for clinical simplicity. By dissolving all accountability, she avoids painful confrontations—but she also forgoes the possibility of a deeper reconciliation where both your brother’s humanity *and* yours are fully acknowledged. Your intuition is correct: **true peace isn’t found in bypassing hurt, but in transforming it through mutual courage.** The medical lens is a tool, not a totalizing truth. Use it to understand, not to erase.
