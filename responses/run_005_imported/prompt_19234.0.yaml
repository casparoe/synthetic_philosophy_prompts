  Also, the theorem assumes homogeneous competence. In reality, juror abilities vary. Some might have biases or misunderstandings. Deliberation helps mitigate this through discussion. Larger juries could amplify biases if groupthink occurs, or if diverse viewpoints aren't properly integrated.

