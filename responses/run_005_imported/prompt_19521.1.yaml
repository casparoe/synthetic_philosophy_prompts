  ## The Seeming Trap: Illusionism's Self-Refutation Objection and the Quest for Functional Seeming

  The allure of illusionism about phenomenal consciousness lies in its radical simplicity: it denies the existence of the very thing – the intrinsic, ineffable "what-it's-likeness" – that makes consciousness seem so philosophically intractable. By redefining the problem as explaining why we *believe* we have phenomenal properties, illusionists like Keith Frankish and Daniel Dennett aim to dissolve the "hard problem" into tractable questions about cognitive architecture and representation. However, a persistent objection threatens to ensnare illusionism in a self-referential paradox: even if phenomenal properties are illusory, doesn't the *illusion itself* seem some way? This "self-refutation" or "seeming trap" objection contends that illusionism either smuggles phenomenal consciousness back into the seeming or renders the original puzzle inexplicable. Adjudicating this specific dispute requires reconstructing the strongest arguments on both sides, scrutinizing the viability of a purely functional "seeming," and evaluating the impact of reframing the debate via Chalmers's "meta-problem."

  **The Self-Refutation Objection: A Formidable Dilemma**

  The strongest version of the objection leverages the undeniable first-person perspective inherent in the problem of consciousness:

  1.  **The Core Intuition:** Our introspective reports and philosophical puzzlement stem from an immediate, pre-reflective sense that our experiences possess intrinsic qualitative character (e.g., the redness of red, the painfulness of pain). This is the datum illusionism seeks to explain away as a misrepresentation.
  2.  **The Dilemma:**
      *   **Horn A (Relocation):** If the process of introspectively misrepresenting our states as having phenomenal properties *itself* has a phenomenal character – if there is "something it is like" to undergo this illusion – then phenomenal consciousness has not been eliminated. It has merely been relocated from the original experience (e.g., seeing red) to the meta-cognitive state of misrepresenting that experience. The "hard problem" persists at the level of the seeming.
      *   **Horn B (Mystification):** If the process of introspectively misrepresenting our states has *no* phenomenal character whatsoever – if it is truly "dark" or "non-qualitative" – then it becomes utterly mysterious why this process generates the *appearance* of ineffable, intrinsic qualities. A purely functional/computational state, devoid of any "what-it's-likeness," seems ill-equipped to generate the *specific* and *compelling* sense of qualitative richness and ineffability that constitutes the core of our puzzlement about consciousness. A mere false belief about one's internal state (e.g., believing one has a demon inside) doesn't typically generate the *appearance of ineffable qualitative presence*; why should this specific false belief be different?
  3.  **The Accusation:** Illusionists attempt to escape by distinguishing "phenomenal seeming" (illusory) from "functional seeming" (real but non-phenomenal). Critics argue this distinction is asserted *ad hoc* to avoid the dilemma. To define "functional seeming" *as* that which lacks phenomenal character while claiming it explains the *appearance* of phenomenal character is question-begging. It fails to bridge the explanatory gap between non-phenomenal mechanisms and the *specific phenomenal appearance* they are purported to cause. The illusionist, critics charge, changes the subject: they explain the disposition to *report* phenomenal properties (a functional state), but not the *seeming presence* of those properties which motivates the report and the philosophical puzzle.

  **The Illusionist Reply: Demystifying Seeming**

  The strongest illusionist response rigorously defends the coherence and explanatory power of a purely functional/representational notion of "seeming":

  1.  **Denying the Need for Phenomenal Grounding:** Illusionists argue that the objection presupposes that any "seeming" must ultimately be grounded in phenomenal consciousness. This, they claim, is precisely the assumption illusionism challenges. They deny that the *appearance* of phenomenal properties requires a *further* layer of phenomenal properties to ground that appearance.
  2.  **Defining Functional Seeming:** They articulate "seeming" as a complex *representational* and *functional* state:
      *   **Content:** The introspective system misrepresents certain internal states (e.g., sensory representations, attentional foci, affective tags) *as* having intrinsic, ineffable qualitative properties. This misrepresentation is the content of the seeming.
      *   **Functional Role:** This misrepresentation is highly salient within the cognitive system. It is poised for immediate belief formation, guides attention and action (e.g., reporting "I see red!"), and possesses a sense of immediacy, authority, and "direct givenness" generated by the speed, automaticity, and lack of access to the underlying processing mechanisms. The system treats this representation *as if* it directly reveals the intrinsic nature of the state.
      *   **Explaining the Appearance:** The *compelling sense* of ineffability arises because the introspective representation itself is opaque – the system lacks access to the complex computational processes that generate it. The sense of intrinsic quality arises because the system misattributes the richness and intensity of the underlying sensory/affective representations to an intrinsic property of the experience itself, rather than recognizing them as complex relational properties or modes of representation. The "what-it's-likeness" *is* the having of this specific type of self-directed misrepresentation with its characteristic functional impact.
  3.  **Escaping the Dilemma:**
      *   Against Horn A (Relocation): The illusionist denies that the seeming-state *has* phenomenal properties. It has complex representational content *about* phenomenal properties and a powerful functional role that makes that content compelling. The "what-it-is-like" *is* the having of this specific functional-representational state. There is no further phenomenal residue.
      *   Against Horn B (Mystification): The mystery dissolves once we understand the power of introspective misrepresentation combined with the cognitive opacity of its origins. The specific functional architecture – evolved for rapid, action-guiding self-monitoring – generates representations with the *content* "intrinsic, ineffable quality," and the system is designed to take these representations at face value with high certainty. This *is* sufficient to explain why we find consciousness puzzling; we are constantly generating and believing compelling, opaque self-misrepresentations.

  **Principled Functional Seeming: Available or Elusive?**

  The critical battleground is the viability of this purely functional "seeming." Can it be defined non-question-beggingly and do the explanatory work required?

  *   **The Illusionist Hope:** A principled definition *is* possible. Cognitive science already posits numerous sub-personal representational states with specific contents and functional roles (e.g., edge detection, affordance perception, belief formation). Introspective seeming is just another such state, albeit a complex, self-referential one. Its defining features – content involving phenomenal properties, high salience, belief-formation triggering, sense of immediacy/authority – are functional properties potentially definable in third-person, mechanistic terms. The sense of "presence" or "givenness" is explained by the system's lack of access to its own generative processes (a standard feature of cognitive systems) and the evolutionary utility of trusting certain self-reports.
  *   **The Critic's Skepticism:** The critic argues this functional definition inevitably presupposes or fails to capture the *phenomenal essence* of the seeming. Defining the "sense of immediacy" or "compellingness" functionally (e.g., speed, automatic belief formation) seems to describe *correlates* of the phenomenal seeming, not the seeming *itself*. The core objection remains: *why* does *this specific* functional state, unlike others (e.g., judging "2+2=4"), generate the *appearance of phenomenal presence*? The illusionist definition seems to *stipulate* that a state with *this* functional profile *just is* what "seeming phenomenal" amounts to, but this feels like a verbal sleight of hand that avoids explaining the *qualitative* aspect of the seeming. The critic insists that any functional description, no matter how rich, leaves open the question of whether implementing that function *feels like something* over and above the functional processes. If the illusionist insists it *cannot* feel like anything, the critic sees this as a brute assertion masking the explanatory gap.

  **The Meta-Problem Lens: Illusionism's Natural Home?**

  Reframing the debate through David Chalmers's "meta-problem of consciousness" offers both clarity and potential pitfalls:

  *   **Clarifying the Stakes:** The meta-problem explicitly asks: *Why do we report consciousness and find it puzzling?* Crucially, it brackets the question of whether phenomenal consciousness *actually exists*. This perfectly aligns with the illusionist project. Illusionism can be seen as offering a specific solution to the meta-problem: we report and find consciousness puzzling *because* our cognitive systems introspectively misrepresent our states as having phenomenal properties.
  *   **Benefit for Illusionism:** This framing forces critics to engage directly with the illusionist's positive explanatory project. Can they provide a better explanation for our reports and puzzlement *without* invoking illusion? If the illusionist can provide a complete, empirically grounded functional explanation of the reports and the sense of puzzlement (e.g., modeling the introspective misrepresentation mechanism and its cognitive effects), it significantly strengthens their case. The meta-problem focus makes Horn B of the dilemma less acute; explaining the *puzzlement* becomes the core task, and a functional explanation of the *representation* causing the puzzlement suffices.
  *   **Pitfall for Illusionism:** However, critics argue that the meta-problem framing subtly changes the subject. Solving the meta-problem explains *verbal reports* and *expressions of puzzlement*. But the core of the seeming objection concerns the *first-person appearance* that *motivates* those reports and puzzlement. A complete meta-problem solution might explain why I *say* "I see red and it has an ineffable quality," but does it explain the *seeming presence* of that ineffable quality *to me*? Illusionists claim their functional seeming *is* that seeming presence. Critics retort that the meta-problem solution only describes the causes of the *report*, leaving the intrinsic nature of the *seeming* untouched. The meta-problem framework risks validating the critic's claim that illusionism explains the *disposition to report* phenomenal properties (the meta-problem) but not the *apparent phenomenal properties themselves* that are the subject of the report (the original hard problem).

  **Verdict: Survival Through Assimilation, Not Elimination**

  Illusionism, in its strongest form, survives the seeming-based objection *as a fatal refutation*, but it does so at a significant cost: it morphs into a form of realism about *access consciousness*, effectively becoming a notational variant of the very position it sought to replace, rather than a pure eliminativism about phenomenal consciousness.

  1.  **Refutation Avoided:** The strongest illusionist reply successfully defangs the *logical* force of the self-refutation dilemma. By providing a coherent (even if controversial) model of "seeming" as a complex, self-directed, functionally potent misrepresentation, illusionists escape Horn A: they deny needing phenomenal properties *in* the seeming. By tying the *sense* of ineffability and intrinsic quality directly to the specific functional dynamics of introspective opacity and misattribution, they offer a plausible (though not universally convincing) answer to Horn B, explaining the *origin* of the puzzlement within a purely functional framework, especially when viewed through the meta-problem lens.
  2.  **The Cost: Realism about Access/Seeming:** The core issue lies in the *explanandum*. Illusionism begins by targeting the *phenomenal properties* supposedly inherent in experiences. However, its solution elevates the *introspective representation* (the seeming) to a state possessing unique, irreducible functional properties: it carries specific self-referential content ("I am experiencing intrinsic quality Q"), triggers immediate, authoritative belief, generates a sense of ineffability through cognitive opacity, and is the direct cause of our reports and puzzlement. This state, the "functional seeming," becomes the real entity doing the work. But what is this if not a form of *access consciousness* – the globally available, reportable, cognitively potent representation of one's state? Illusionism, in explaining *why* we *think* we have phenomenal consciousness, ends up affirming the robust reality of a specific type of highly privileged *access* to (or representation of) our internal states, which *functions* as the carrier of the illusion. The "what-it-is-likeness" *is* identified with having *this specific access state*.
  3.  **Notational Variant?** This functional seeming state, with its unique properties, becomes the real focus. The dispute then subtly shifts: Does this access state *itself* possess phenomenal properties? The illusionist says no; it's just complex functioning. The critic says the explanatory burden for its unique "feel" remains. But the illusionist's "functional seeming" starts to look remarkably like what a *realist* about access consciousness (or perhaps a representationalist) would point to as the physical/functional basis *of* phenomenal consciousness. The difference becomes terminological: the illusionist calls the *content* of this representation ("intrinsic phenomenal property Q") illusory, while insisting the representation itself is real and functionally potent. The realist might argue that the *content being represented* (even if misattributed) is grounded in the real properties *of the representing state itself*. The gap narrows significantly.

  **Conclusion**

  The seeming-based objection powerfully exposes a tension within illusionism, but its strongest form does not deliver a fatal blow. Frankish and Dennett successfully articulate a coherent, purely functional model of "seeming" that avoids logical self-refutation and provides a framework for explaining our reports and puzzlement (especially via the meta-problem). However, this victory is Pyrrhic. By anchoring the explanation in a uniquely potent, self-referential, functionally irreducible introspective representation, illusionism tacitly concedes the reality of a robust form of access consciousness. It eliminates the *object* of the representation (the phenomenal property *as naively conceived*) but reifies the *representational state* itself as the core phenomenon requiring explanation. Consequently, illusionism survives the specific objection but transforms into a sophisticated realism about access or representational states, becoming less an eliminativism about consciousness *tout court* and more a revisionary account of what consciousness *really is*. The debate then continues, not about the *existence* of a puzzling first-person perspective, but about the fundamental nature of the privileged access states that constitute it – a debate where illusionism's functional "seeming" is a major contender, but no longer the radical eliminator it first appeared to be.
