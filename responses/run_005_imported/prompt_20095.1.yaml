prompt: |-
  During my years running a neuroscience lab that studied bipolar disorder, I often encountered so-called "Ulysses contracts": directives by which a lucid patient authorizes future involuntary treatment that they may later refuse once acutely unwell. Since retiring, I have been reading Jon Elster and other theorists who apply the same Homeric image to constitutions, treating entrenched clauses and supermajority amendment rules as a polity binding its future self against its own passions. Please compare these two uses of the image with some rigor: is the constitutional case really just a scaled-up version of the clinical one, or does moving from one continuous person binding their own future self to a citizenry binding a future citizenry — including people not yet born — change the underlying moral logic of precommitment? At minimum, address who enforces the commitment against the bound party's later objection and whether "consent" means the same thing in both cases, then close by saying which practice has the better claim to being justified precommitment rather than simple rule by the past over the future.
reasoning: |-
  Okay, the user is asking about Ulysses contracts in both clinical and constitutional contexts. They want a rigorous comparison. Let me start by recalling what Ulysses contracts are. In the clinical sense, it's a psychiatric advance directive where a patient consents to future treatment during a lucid period, which can be enforced when they're incapacitated. Constitutionally, it's about entrenching rules to bind future governments, like requiring supermajorities for amendments.

  First, I need to address the core question: is the constitutional version just a scaled-up clinical one? Probably not. The key differences lie in identity continuity and consent. In clinical cases, it's the same person over time. The patient now and later is the same individual. But in constitutions, the people bound include future citizens who didn't consent. That changes the moral logic. 

  Who enforces the commitment? In clinical settings, it's the medical team or a proxy, acting on prior instructions. For constitutions, it's institutions like courts or legislative bodies. The enforcers here are part of the system they're enforcing, which complicates things. 

  Consent is another big difference. Clinically, the patient gives informed consent during lucidity. Constitutionally, original framers consent, but future generations don't. That's a problem for legitimacy. Also, the reversibility aspect: clinical contracts can be updated when the patient is lucid again. Constitutional amendments are much harder, making them less flexible.

  The user also asks which practice is more justified. Clinical precommitment seems more defensible because it preserves autonomy and has better safeguards. Constitutional precommitment might be necessary for stability but risks being undemocratic. 

  I should make sure to cover moral implications, enforcement, consent, and justification. The user's background in neuroscience suggests they value precise distinctions. They might also be interested in the philosophical underpinnings from theorists like Elster. Need to balance depth with clarity, avoiding jargon where possible. Highlighting the non-identity problem in constitutions (future citizens not existing when the contract is made) is crucial. Also, mention that while constitutions need some rigidity, mechanisms for amendment are essential to mitigate the democratic deficit.
answer: |-
  This comparison reveals fundamental differences that challenge the "scaled-up" analogy. While both employ the *image* of precommitment against future irrationality, the shift from an individual binding their future self to a polity binding its future self—including the unborn—alters the moral, practical, and ontological foundations significantly. Let's break this down rigorously:

  1.  **Continuity of Identity vs. Collective Identity Over Time:**
      *   **Clinical:** The bound party (future unwell self) shares *numerical identity* with the authorizing party (present lucid self). It's the *same person* across time. The moral logic rests on respecting the *whole person's autonomy* – including their lucid wishes expressed to preserve their long-term values and well-being against episodic illness. The "future self" is a temporally distinct *state* of the same entity.
      *   **Constitutional:** The bound party (future citizenry) is *not identical* to the authorizing party (past citizenry/framers). It's a different *collection* of individuals, many of whom were not alive, lacked voting rights, or held different values when the constitution was adopted. The "future self" is a different *collective entity* with its own composition and will. This raises the "non-identity problem" – can Group A legitimately bind Group B, especially when Group B includes individuals who never consented?

  2.  **Enforcement Against Later Objection:**
      *   **Clinical:** Enforced by **medical professionals, legal guardians/proxies, or courts**, acting *on behalf of the patient's prior lucid self* against their current incapacitated self's refusal. The authority stems from medical ethics (beneficence, non-maleficence), legal frameworks for advance directives, and the presumption that the prior directive reflects the patient's authentic values. Enforcement is *against a specific, incapacitated individual* based on their own prior instructions.
      *   **Constitutional:** Enforced by **institutions** (courts, legislatures, executives) *within the very system created by the constitution*. These institutions derive their authority *from* the constitution they are enforcing. Enforcement is *against the current will of the majority* (or significant minority) expressed through democratic processes (elections, legislation, referenda). This creates a potential circularity: the past binds the present using mechanisms the past created.

  3.  **The Meaning and Scope of "Consent":**
      *   **Clinical:** Consent is **individual, contemporaneous, and informed**. The lucid patient consents *for themselves*, based on their understanding of their illness, values, and potential future states. It's a direct expression of autonomy regarding their own body and mind. The scope is strictly personal.
      *   **Constitutional:** Consent is **collective, historical, and often hypothetical/constructive**. The original framers/ratifiers consented *on behalf of the polity*. Future generations are bound without their explicit, individual consent ("tacit consent" theories are weak). Consent is often framed as consent to the *system* or the *procedures* for change (e.g., amendment rules), not necessarily to the *specific entrenched content*. The scope is societal, binding individuals who never had a chance to consent and coercing dissenters within the bound generation.

  4.  **Reversibility and Updating:**
      *   **Clinical:** Generally **reversible when lucid**. A patient, upon regaining capacity, can revoke or modify their Ulysses contract. The binding force is contingent on incapacity. The patient retains ultimate sovereignty over their directives.
      *   **Constitutional:** Designed to be **difficult to reverse or update**. Entrenched clauses and supermajority rules are *intended* to create high barriers, making change slow and cumbersome. The "past self" (framers) deliberately limits the power of the "future self" (later generations) to alter fundamental rules. Sovereignty is contested between past and present majorities.

  **Justification: Which has the Better Claim?**

  *   **Clinical Precommitment:** Possesses a **stronger, more direct moral justification** as a form of precommitment:
      *   **Stronger Identity Link:** Binds the *same person*.
      *   **Authentic Consent:** Based on contemporaneous, informed individual consent.
      *   **Preservation of Core Autonomy:** Aims to preserve the individual's *own* long-term autonomy and values against a known, episodic threat (their illness) that predictably undermines their decision-making capacity. It respects the whole person's narrative.
      *   **Reversibility:** Maintains ultimate patient sovereignty.
      *   **Clear Harm Prevention:** Targets a specific, identifiable future harm (acute mania/depression) the patient themselves wishes to avoid.

  *   **Constitutional Precommitment:** Is **more contestable** as pure "precommitment" and leans closer to "rule by the past," though potentially justified on different grounds:
      *   **Weaker Identity Link:** Binds different people.
      *   **Problematic Consent:** Lacks genuine consent from the bound.
      *   **Democratic Deficit:** Can frustrate the will of the current majority/demos in the name of a past majority's vision. Risks ossification and blocking necessary evolution.
      *   **Justification Shifts:** Its strongest justification is **not primarily individual precommitment**, but rather:
          *   **Stability & Predictability:** Providing a stable framework for social cooperation, investment, and long-term planning.
          *   **Protecting Minorities & Foundational Values:** Shielding fundamental rights (e.g., free speech, due process) or core structural features (e.g., separation of powers) from transient majoritarian passions or tyrannical impulses ("passions" in the broader sense). This is closer to *creating constraints* than binding a *self*.
          *   **Coordination & Avoiding Collective Action Problems:** Establishing rules that solve problems future generations might struggle to coordinate on (e.g., debt limits, environmental protection).
      *   **Requires Legitimizing Mechanisms:** Its legitimacy depends heavily on the *initial* legitimacy of the founding process, the *reasonableness* of the entrenched provisions, the *existence of feasible amendment procedures* (even if difficult), and *ongoing societal acceptance*. Without these, it becomes simple rule by the past.

  **Conclusion:**

  The constitutional case is **not** merely a scaled-up version of the clinical one. The discontinuity of identity (same person vs. changing collective) fundamentally changes the moral logic. Clinical precommitment, based on individual identity and contemporaneous consent to protect one's *own* future self from a known pathology, has a far stronger claim to being a justified form of precommitment respecting autonomy. Constitutional entrenchment, while employing the Ulysses metaphor, functions differently: it primarily aims to establish stable governance structures, protect foundational values/minorities, and solve collective action problems across generations. Its justification hinges less on binding a "future self" and more on the functional necessities of a durable political order and the prevention of catastrophic democratic failures, accepting a degree of constraint on current majorities as the price. While potentially justified, it inherently carries a greater risk of becoming "rule by the past" if amendment is impossible or the entrenched rules lose their perceived connection to fundamental justice or societal needs. The clinical pact binds the self *for* the self; the constitutional pact binds the future *by* the past, *for* (hopefully) the enduring good of the polity.
