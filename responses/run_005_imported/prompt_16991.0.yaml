  The ranking is based on how faithfully each decision rule adheres to the core motivation for imprecise credences: representing evidential ambiguity without manufacturing precision where evidence is insufficient. 

  1. **Walley's maximality** is the most faithful. It only rules out acts that are strictly dominated (i.e., for every probability distribution in the set, another act yields higher expected utility). This minimally extends strict dominance, preserves incomparability when evidence is ambiguous, and avoids introducing arbitrary precision.

  2. **Levi's E-admissibility** ranks second. It deems an act admissible if it maximizes expected utility under some distribution in the set. While it avoids forcing a choice among admissible acts, it may exclude non-dominated acts that are never optimal under any distribution, which can be seen as slightly overstepping evidential constraints.

  3. **Interval dominance** is third. It rules out acts only when their entire expected utility interval lies below another's, ensuring very weak dominance. However, it often fails to rule out strictly dominated acts (e.g., when intervals overlap but one act is always worse), betraying the evidence by retaining clearly inferior options.

  4. **Γ-maximin** is fourth. It selects acts with the highest minimum expected utility, collapsing the imprecise set into a single, worst-case value. This ignores most of the evidential set, manufactures precision by overemphasizing caution, and forces a choice even when evidence is ambiguous.

  5. **Γ-maximax** is least faithful. It selects acts with the highest maximum expected utility, reducing the set to a single, best-case value. Like Γ-maximin, it ignores the set's complexity, arbitrarily manufactures precision through optimism, and forces a choice unsupported by evidence.

