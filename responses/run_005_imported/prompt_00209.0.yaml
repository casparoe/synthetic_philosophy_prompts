  Looking at Oesterheld's arguments, he emphasizes that blackmailers are often acausal actors. They're not targeting individuals but looking for patterns. If an agent consistently pays ransoms for the surrogate, that becomes a reliable signal. Even if the blackmailer knows the surrogate isn't the real value, exploiting it is still optimal because it's cheaper and the agent is committed to paying. 

