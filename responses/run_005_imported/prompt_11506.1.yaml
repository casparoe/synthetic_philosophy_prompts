answer: |-
  Your observation strikes at a deep tension within the project of using evolutionary psychology to justify selective skepticism toward moral intuitions. Here's a breakdown of the implications and an assessment of the Singer/de Lazari-Radek response:

  **Core Implications for Epistemic Weight:**

  1.  **Significantly Reduced Privilege:** Your impartial, scope-sensitive intuitions *cannot* be granted default epistemic authority within an evolutionary debunking framework. If parochial intuitions are suspect because their adaptive origins explain their existence *without* needing them to track truth, the same logic applies *directly* to impartial intuitions. Street's dilemma is indeed fully general.
  2.  **Loss of Foundational Justification:** Cause-prioritization frameworks (like utilitarianism often used in EA) heavily rely on intuitions like impartiality ("a benefit to A matters as much as an identical benefit to B") and scope sensitivity ("saving 100 lives is better than saving 10") as foundational axioms. If these intuitions are equally susceptible to debunking as parochial ones, their status as self-evident or reliable starting points is severely undermined. They become *explananda* (things needing explanation/justification) rather than secure *explanans* (things that explain/justify).
  3.  **Increased Burden of Proof:** The evidential burden shifts decisively. You cannot simply *assume* impartial intuitions are more likely to track moral truth because they feel "more rational" or less tied to obvious evolutionary pressures. You need *positive, independent reasons* to trust them *despite* their evolutionary origins. This justification must come from *outside* the circle of moral intuitions themselves.
  4.  **Potential for Self-Undermining:** If the debunking argument is applied consistently, it threatens the very tools used in cause-prioritization. The reasoning *for* using cost-effectiveness analysis, impartial aggregation, and scope sensitivity relies on intuitions now placed under the same skeptical cloud as the intuitions they were meant to replace. This creates a justificatory regress or circularity.
  5.  **Need for Meta-Ethical Clarity:** Your approach to cause-prioritization becomes heavily dependent on your underlying meta-ethics:
      *   **Robust Realism:** If you believe in stance-independent moral facts, you need a compelling story for why evolution *would* have equipped us to track impartial truths *despite* the likely fitness advantages of parochialism. This is hard (see Street).
      *   **Constructivism/Response-Dependence:** If moral truths are constituted by idealized rational procedures or responses, impartial intuitions might hold more weight *if* you can justify the procedure itself independently. Evolutionary history becomes less directly threatening, though still relevant to idealization.
      *   **Pragmatism/Coherentism:** You might justify reliance on impartial intuitions based on their coherence, fruitfulness, or ability to resolve conflicts within our considered judgments *overall*, explicitly acknowledging their contingent origins but arguing for their utility within a reflective system.

  **Assessing de Lazari-Radek & Singer's Sidgwickian Escape:**

  Their argument, following Sidgwick, claims that impartiality and temporal neutrality arise not as *direct* targets of natural selection (which favors partiality and present bias), but as *byproducts* of the general capacity for rational thought. Since reason itself wasn't directly selected *for* tracking moral truth, but rather for instrumental problem-solving, its moral outputs (like impartiality) are less contaminated by evolutionary bias.

  *   **Does it Genuinely Escape?**
      *   **No, It Merely Relocates the Burden:** This move shifts the problem up one level, but the core evidential burden remains. The question becomes: **Why should we trust the deliverances of *this specific aspect* of our evolved rational capacity (the part generating impartiality) as truth-conducive regarding morality?**
      *   **The Evolved Rational Capacity Problem:** Our capacity for "rational thought" *itself* is a product of evolution. While it may not have been *directly* selected for moral truth-tracking, its structure and tendencies *were* shaped by adaptive pressures. Why assume the *particular* rational insight leading to impartiality (e.g., recognizing that mere location in space/time or genetic relatedness isn't a *relevant* difference for moral consideration) is reliable, while other outputs of the same faculty (or its biases) are not?
      *   **The "Which Byproduct?" Problem:** Evolution produces countless cognitive byproducts. Why privilege *this specific one* (impartiality) as truth-revealing? Many irrational or maladaptive beliefs can also be seen as byproducts. The mere fact that impartiality is a byproduct of reason doesn't automatically grant it epistemic privilege; it needs a *further* justification for why *this* byproduct is likely to be correct.
      *   **Begging the Question?** Identifying which rational principles are "valid" often relies on intuitions that themselves feel compelling... which brings us back to the original intuition needing justification. Sidgwick/Singer rely on the self-evidence of axioms like impartiality upon reflection, but the debunker argues this feeling of self-evidence is *also* a product of our cognitive machinery shaped by evolution, not necessarily a mark of truth.
      *   **Partial Success Against *Direct* Selection:** The argument *does* successfully show that impartiality wasn't *directly* selected *for*, making the "adaptive link account" *less straightforward* than for kin preference. This weakens the *strongest* form of debunking for impartiality. It suggests impartiality wasn't *designed* by evolution for fitness, potentially making it less *obviously* distorted. However, it doesn't eliminate the concern that the *capacity* producing it is still an evolved one not optimized for moral truth.

  **Conclusion:**

  Your insight is crucial. **Consistent application of evolutionary debunking arguments radically undermines the default epistemic privilege granted to *any* moral intuitions, including the impartial, scope-sensitive ones essential to EA cause-prioritization.** You should assign them significantly less foundational epistemic weight than is often assumed within EA/rationalist circles relying on them uncritically.

  The Singer/de Lazari-Radek Sidgwickian move **does not genuinely escape Street's dilemma.** While it effectively argues that impartiality wasn't a *direct* target of selection (a significant point), it merely **relocates the evidential burden** onto justifying why the *evolved general rational capacity*, specifically in its generation of impartial principles, should be considered reliable for accessing moral truth. This justification remains highly contested and faces the same core challenge: explaining why we should trust *any* evolved cognitive output in the moral domain without independent verification.

  This necessitates either:
  1.  **Seeking independent justification** for impartial axioms (e.g., through coherentist methods, contractualism, or pragmatic arguments).
  2.  **Adopting a meta-ethical view** (like sophisticated forms of constructivism or pragmatism) that doesn't require our intuitions to track stance-independent truths but justifies them within a reflective system.
  3.  **Accepting a degree of circularity or foundationalism** regarding rational intuition, while being acutely aware of its vulnerability and the need for constant critical scrutiny.
  4.  **Embracing a more radical skepticism** about the justificatory power of intuition for cause-prioritization, potentially shifting towards more empirical or procedural approaches where possible.

  Ignoring this tension risks building elaborate cause-prioritization models on foundations whose selective skepticism is philosophically untenable. Acknowledging it forces a more rigorous and self-aware approach to the fundamental assumptions driving the work.
