prompt: |-
  Last weekend a friend and I spent several hours arguing about Bernard Williams's internalism about practical reasons, after he pointed out that the view seems to let genuinely awful people off the hook: if a man has no desire, however indirect, that correct reasoning could connect to treating his family decently, then strictly speaking he has no reason to change, and calling him selfish or cruel is just venting rather than identifying any rational failure in him. I tried to defend the internalist line by leaning on how much work the "sound deliberative route" is supposed to do, but I don't think I fully convinced him, or myself.

  As it happens, I record a small philosophy podcast out of my apartment, and next week's guest is a philosopher who has built her reputation defending a broadly Williams-style view: that a reason statement about an agent is true only if it connects, by a sound deliberative route, to some element already present in that agent's subjective motivational set. I'd like your help drafting eight or nine interview questions that go beyond having her restate the position, since I can already predict most of that restatement from the secondary literature.

  Please build in at least one question that forces her to say exactly what sound deliberation is permitted to add to, or discover in, an agent's motivational set without quietly importing reasons from outside it altogether -- using Williams's Owen Wingrave case as the test. Include at least one question built around the later case, from his piece on the obscurity of blame, of the husband who is simply nasty to his wife and openly says that he does not care -- pressing on whether internalism can make sense of blaming him at all once we have granted that he is not irrational. And include at least one question that puts Korsgaard's objection to her directly: that Williams's argument only works by treating an agent's being unmoved by a consideration as proof that the consideration was never a reason for him, rather than as evidence of his own irrationality, and so simply assumes the very thing at issue against the externalist. Attach a short follow-up to each of these, keyed to the answer she is most likely to give, and close the list with one question asking what kind of case, if any, she would accept as genuine evidence against internalism.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who defends Bernard Williams's internalism about practical reasons. They need help drafting incisive questions that go beyond basic restatements of the theory. 

  Hmm, the user's frustration from their earlier debate is palpable—they clearly want to push the guest where Williams's view feels ethically uncomfortable. The three requested focus areas are spot-on: (1) the slippery definition of "sound deliberative route" (especially in Owen Wingrave), (2) blame's incoherence under internalism (using the nasty husband case), and (3) Korsgaard's circularity charge. 

  *Pauses to reread Williams' Wingrave example* Right—the tension is whether discovering his "true desire" to avoid cowardice is really just smuggling in external values. For the husband case, the guest will likely retreat to "blame as protest not reason-assessment," so the follow-up must press why that isn't moral surrender. And Korsgaard's objection cuts deep; the guest might counter that irrationality presupposes reasons one *ought* to heed, but that's exactly the externalist point. 

  *Checks secondary literature notes* The guest's probable moves: emphasizing deliberative routes as discovery (not invention), distinguishing blame from reason-statements, rejecting "irrationality" as question-begging. Follow-ups should block easy escapes—e.g., if Wingrave's aversion is "discovered," ask why similar reasoning fails for the husband. 

  Final question about counterevidence is crucial. The user wants to see if the guest's internalism is falsifiable or just endlessly elastic. Should frame it as "what would make you doubt Williams?" to avoid abstract hypotheticals. 

  *Starts drafting* Need questions sharp enough that evasion would sound evasive, but respectful of the guest's expertise. Tone should be "help me understand" not "gotcha."
answer: |-
  Here are eight interview questions designed to push beyond restatement, incorporating your specific requests with follow-ups anticipating likely responses. They target conceptual pressure points in Williams' internalism:

  1.  **Core Tension & Motivation:** "Williams famously argued that internalism avoids the 'pointless lumber' of external reasons that cannot motivate. Yet critics like your colleague Thomas Scanlon counter that reasons are primarily about justification, not motivation. Could you articulate why preserving the *necessary link* to motivation is philosophically indispensable, even if it means potentially 'letting awful people off the hook,' as critics charge?"
      *   *Likely Follow-up (if she emphasizes the practicality of reason):* "If practicality is paramount, does this imply that 'practical reason' is ultimately just a description of how motivation *does* work, rather than a normative guide for how it *should* work?"

  2.  **"Sound Deliberative Route" - The Owen Wingrave Test:** "Let's get concrete with Owen Wingrave. Williams argues Wingrave discovers via deliberation that his aversion to cowardice, rooted in his S, gives him reason to reject his family's martial expectations. Precisely *what* is deliberation permitted to *add* or *discover* in his S that wasn't obviously there before? For instance, is it discovering a *new object* of an existing disposition (e.g., seeing military life *as* cowardly), uncovering a *hidden strength* of an existing desire, forming a new instrumental desire based on S, or something else?"
      *   *Likely Follow-up (if she emphasizes discovery of implications/constituents):* "How do we prevent this 'discovery' process from smuggling in evaluative standards external to Wingrave's actual S? If Wingrave *didn't* feel this aversion upon reflection, would Williams say he had no reason to reject his family's path, even if we see it as morally imperative?"

  3.  **The "Nasty Husband" Case & Blame:** "In 'The Obscurity of Blame,' Williams presents the case of a husband who is simply nasty to his wife and openly declares he doesn't care about her feelings. Williams grants such a person might not be *irrational* by internalist lights (if nastiness is firmly in his S). How, then, can internalism make sense of *blaming* him? If blame involves at least an implicit appeal to reasons the agent *ought* to have heeded, doesn't internalism reduce blame to mere emotional reaction or social sanction, stripped of its rational force?"
      *   *Likely Follow-up (if she separates blame from reason-claims or emphasizes protest):* "If blame isn't fundamentally about pointing to a *rational failure* the agent *could* and *should* have recognized, doesn't this drain blame of its distinctive moral significance and make it indistinguishable from anger or punishment directed at a harmful natural event?"

  4.  **Korsgaard's Circularity Charge:** "Christine Korsgaard levels a powerful objection: Williams' argument assumes that an agent's being unmoved by a consideration proves it *wasn't* a reason for them, rather than proving *their irrationality*. She argues this simply begs the question against the externalist, who contends that the agent's indifference *is* the irrationality. How do you respond to the charge that Williams' method presupposes internalism to rule out externalism?"
      *   *Likely Follow-up (if she disputes the characterization or emphasizes practicality):* "If the externalist insists that recognizing a genuine reason *should* motivate a rational agent, and the husband's failure *is* the irrationality, what internalist argument definitively shows this externalist picture is incoherent, rather than just describing a different (perhaps rarer) phenomenon?"

  5.  **Scope of Deliberation & "Thick" Concepts:** "Williams links sound deliberation to the agent's 'thick' ethical concepts embedded in their S. How robust is this link? Could sound deliberation for an agent whose S includes only very thin or amoral concepts (e.g., focused solely on power or pleasure) ever generate recognizably moral reasons, like a reason not to torture innocents *for fun*, if no aversion to cruelty or concern for others is latent in their S?"
      *   *Likely Follow-up (if she suggests deliberation could reveal contradictions/implications):* "Could revealing a 'contradiction' in the purely power-seeking agent's S (e.g., torture undermines long-term power) *genuinely* ground a reason against torture *as such*, or only an instrumental reason contingent on their existing power goals?"

  6.  **The "Why Be Moral?" Challenge:** "Internalism seems to offer a stark answer to 'Why should *I* be moral?': only if you already have something in your S that sound deliberation can connect to morality. Doesn't this risk making morality fundamentally optional or contingent on pre-existing motivational quirks, undermining its authority? How does your view avoid collapsing into a form of sophisticated moral subjectivism?"
      *   *Likely Follow-up (if she emphasizes the substance of S or social nature):* "If the authority of morality for an agent *always* depends on contingent features of their S, how is this meaningfully different from subjectivism, even if most people happen to share relevant elements?"

  7.  **Internalism vs. Moral Change/Education:** "Consider moral reformers or individuals undergoing profound moral conversion (e.g., abandoning deeply held prejudices). How does internalism explain the *rational force* experienced *during* such a process? If the new perspective isn't yet grounded in their current S, was there *no reason* for them to change *before* the change occurred? Doesn't this make moral progress look like brute psychological causation rather than rational persuasion?"
      *   *Likely Follow-up (if she points to latent elements sparked by deliberation/new info):* "Doesn't the need to posit 'latent' elements to explain any rational conversion risk making internalism unfalsifiable? Couldn't we *always* postulate some undiscovered element in S after the fact?"

  8.  **The Falsifiability Question:** "Finally, to help listeners understand the stakes: What kind of case or argument, if you encountered it, would you accept as genuine, compelling evidence *against* Williamsian internalism? What would falsification look like for this view?"
      *   *(No specific follow-up needed here - it's the closing provocation).*

  **Key Rationale:**

  *   **Beyond Restatement:** Questions 1, 2, 3, 4, 5, 6, and 7 directly tackle the most persistent criticisms and conceptual tensions within internalism, demanding more than a summary.
  *   **Owen Wingrave (Q2 & F/U):** Forces precision on the crucial but vague "sound deliberative route," testing its limits against the charge of smuggling.
  *   **Nasty Husband & Blame (Q3 & F/U):** Directly confronts the "letting off the hook" worry and the challenge of reconciling blame with the absence of irrationality under internalism.
  *   **Korsgaard's Charge (Q4 & F/U):** Targets a fundamental methodological critique, pushing the guest to defend Williams' starting point.
  *   **Falsifiability (Q8):** Ends by challenging the guest to define the view's vulnerability, preventing it from seeming like an unfalsifiable framework.

  These questions are designed to be respectful but probing, pushing the guest to clarify, defend, and potentially reveal the boundaries and potential weaknesses of her Williamsian commitment. Good luck with the podcast!
