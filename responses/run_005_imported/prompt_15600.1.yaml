prompt: |-
  So I'm putting together a podcast episode on logic and language before "logic" existed as a formal field, and I've got a guest lined up — a scholar of classical Chinese philosophy who's whole career is basically Gongsun Long and the School of Names. She thinks the "a white horse is not a horse" thing, which gets trotted out in every listicle of ancient paradoxes as a cute joke about silly ancient sophists, is actually a serious semantic argument and not a pun — her line is that it only looks trivial if you read classical Chinese nouns like English count nouns, and it stops looking trivial once you read them more like mass nouns (the way "water" or "gold" work), so "horse" and "white horse" end up picking out different portions of stuff in the world rather than a class and its subclass.

  I don't want this to turn into forty minutes of her just restating that thesis, so can you draft me 8-10 interview questions that actually dig into it? I want something on the nuts and bolts of the original argument (the shape-vs-color move, the bit where a yellow or black horse satisfies "fetch me a horse" but not "fetch me a white horse"), a question that makes her defend the mass-noun reading against the more deflationary "you're just equivocating between two senses of is-not" objection, something connecting all this to Hui Shi's other paradoxes floating around in the Zhuangzi (the stick you can halve forever and the "left for Yue today, arrived yesterday" one), and at least one question putting to her the Zhuangzi-style dismissal that all this cleverness just wins arguments without changing anyone's mind about how things actually are. For the harder ones, throw in a quick follow-up that anticipates the dodge she'll probably give, so it reads like an actual back-and-forth and not a Q&A where I just nod along. Skip the generic "how'd you get into this" stuff, obviously.
