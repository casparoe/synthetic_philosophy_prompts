  I should also mention other solutions like probability weighting or bounded rationality. But the core issues are the necessity of bounded utility and the sensitivity problem. Highlighting Menger's critique is crucial. Emphasizing that concavity isn't sufficient without boundedness, and even then, practical issues remain. This connects to broader debates in decision theory, like the realism of expected utility axioms.

