answer: |-
  ## Eulogy for a Life Built Together

  Good morning. Thank you all for gathering here to remember my mother, [Mother's Name]. To celebrate her life, her spirit, and the profound mark she left on all of us, especially my father, her partner for over fifty years.

  For nearly seven years, we walked alongside Mom as Alzheimer's disease reshaped her world. Many of you shared parts of that journey, offering support, love, and countless moments of kindness to both her and Dad. We often talk about this disease in terms of memory loss – forgetting names, dates, events. And that was part of it, certainly. But near the end, something deeper, something profoundly unsettling, happened. Mom lost her footing not just on memories, but on things that felt like the absolute bedrock of being *her*.

  There was a time when she was no longer sure she *had* a body. The physical reality we take utterly for granted became unmoored. And perhaps the most piercing change for my father: for months, she looked at him, this man who loved her devotedly for half a century, who cared for her tirelessly, and saw... a stranger. A kind stranger, yes – she always responded to gentleness – but a stranger nonetheless. The certainty that *this is my husband*... vanished.

  Trying to understand that, honestly, without resorting to easy comforts that didn't match what I saw, was hard. The usual phrases – "she's lost herself," or "deep down, she still knew" – felt inadequate, even untrue to the reality unfolding before us. If knowing Dad was some private fact locked away deep inside her, inaccessible but intact, why did the bedrock shift so completely?

  Then I stumbled upon an idea that felt closer to the bone. It suggested that much of what we call "knowing," our most basic certainties, aren't actually held up by proof or evidence, like facts in a book. They’re more like the hinges on a door. The hinges don't move; they have to stay absolutely fixed for the door to swing open at all. Our certainty about the world, about who we are, about the people closest to us – "I have a body," "This is my home," "This is my beloved" – these are hinges. They stay put through constant use, through shared life, through practice and repetition. They are forged in the daily rituals, the shared glances, the thousand small interactions that build a life together over decades.

  Mom and Dad built that certainty together, brick by brick, day by day, for over fifty years. Every shared meal, every quiet evening, every challenge faced side-by-side, every joke understood without words – these were the practices that made the certainty "This is my husband" as solid and unquestioned as the ground beneath their feet. It wasn't a hidden, private fact *in* her; it was a reality created and sustained *between* them, out loud, in the living of their lives.

  Alzheimer's, in its cruel progression, didn't just erase memories; it eroded those very hinges. It loosened the fixed points that allowed her world to make sense. The philosopher who sparked this thought used another image: a riverbed. The water flows over it, relying on its stability. But over vast stretches of time, even the riverbed itself can shift. For Mom, that shift happened tragically fast. The certainty about her body, the recognition of her lifelong partner – these foundational things, built and held fast by a lifetime of shared practice, began to move. And when they did, the world they supported became strange and unstable.

  This isn't a comforting thought in the usual sense. It acknowledges the profound depth of the loss we witnessed. But it also, I believe, holds a deeper truth and a different kind of comfort. It tells us that the certainty of who Mom was – her identity, her love for Dad, her place in this family – wasn't some fragile, internal spark extinguished. It was a magnificent structure built *with* us, *through* us, in the real, tangible world of shared life.

  That structure was built with immense love, resilience, and devotion, especially by Dad, whose steadfast care never wavered, even when he became the "kind stranger." The love that built those certainties didn't vanish when the hinges loosened. It simply shifted form, becoming pure, unasked-for care, a profound act of loyalty to the life they had woven together.

  So today, we mourn the loss of that vibrant, whole woman. We mourn the terrifying shift in her reality near the end. But we also celebrate the incredible edifice she helped build. We celebrate the fifty-plus years of shared practice that created a love and a certainty so real, its unmaking was a visible earthquake. We celebrate that her life, her essence, wasn't locked away privately, but lived out loud, woven into the fabric of our family, into the memories we share now, and into the love that persists even beyond recognition.

  Her riverbed shifted. But the love that flowed over it for a lifetime? That shaped the landscape of our lives. That remains. And it is that love, that shared creation, that we honor and hold onto today. Thank you, Mom, for building it with us. We will carry it forward.
