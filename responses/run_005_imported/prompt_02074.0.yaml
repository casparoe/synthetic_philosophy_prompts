  I should explain why this doesn't automatically mean algorithms are "unfair" in a practical sense. Fairness isn't just about statistics; it involves ethical choices about which trade-offs are acceptable. The friend treats calibration as worthless if other metrics aren't equal, but calibration is actually important for accuracy. If a tool predicts 60% risk, that should mean about 60% reoffend—this is valuable information for decision-makers.

