  First, I recall the key points of the Kleinberg-Mullainathan-Raghavan and Chouldechova papers. They show that when base rates differ between groups (e.g., different recidivism rates for Black and white defendants), it's mathematically impossible for a risk assessment tool to simultaneously satisfy three fairness criteria: calibration (predictions match actual outcomes), equal false positive rates, and equal false negative rates. Perfect prediction is the only exception.

