  First, they mention Leibniz's shift argument: if everything in the universe is shifted or mirrored, but relations stay the same, it shouldn't be a real difference. This ties into the principle of sufficient reason and identity of indiscernibles. Then, in GR, the hole argument uses diffeomorphisms to show similar issues, leading to Leibniz equivalence. Sophisticated substantivalism tries to save substantivalism by saying diffeomorphic models represent the same physical reality.

