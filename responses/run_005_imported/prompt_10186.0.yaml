answer: |-
  You've pinpointed a crucial and often blurred distinction within longtermist/decision-theoretic thinking. Let's dissect **Acausal Trade (AT)** and **Evidential Cooperation in Large Worlds (ECLW)** head-on, addressing your specific queries:

  **Core Distinction: Mechanism vs. Statistical Leverage**

  1.  **Acausal Trade (AT): The Reciprocal Simulation Game**
      *   **Mechanism:** Cooperation hinges on *mutual modeling*. Agent A simulates Agent B's decision process (including B simulating A simulating B... ideally converging). A reasons: "If I cooperate, my simulation of B (which is accurate and uses the same decision theory) will also output 'cooperate' *because* it simulates me cooperating." Cooperation becomes the only stable equilibrium if both agents are sufficiently similar (same decision theory, goals, simulation capabilities).
      *   **Requirements:**
          *   **High-Fidelity Simulation:** A must be able to accurately simulate B's decision process, including B's simulation of A. This requires detailed knowledge of B's decision algorithm and internal state (or strong assumptions about similarity).
          *   **Common Knowledge & Convergence:** The fact that both agents are engaging in this simulation process, and that their simulations will converge on the same outcome, must be common knowledge (or assumed). This is fragile.
          *   **Updateless Decision Theory (UDT) / Functional Decision Theory (FDT):** Crucial. CDT/EDT fail here. UDT/FDT agents choose the *output* of their decision function *now* for *all* instances where this function is called (including in the other agent's simulation), maximizing expected utility across those instances. They don't "update" based on the simulated evidence.
          *   **Reciprocity:** AT is fundamentally about *quid-pro-quo*. A cooperates *because* it expects B's cooperation *in return*, secured via the mutual simulation loop. It's bargaining.
      *   **Analogy:** Two master chess players locked in separate rooms, each given the other's complete strategy manual. They both realize that if they play cooperatively, the other's manual dictates they will too, leading to mutual benefit. Defection leads to mutual loss.

  2.  **Evidential Cooperation in Large Worlds (ECLW): The Leverage of Likeness**
      *   **Mechanism:** Cooperation hinges on *statistical correlation due to shared dispositions* in a large population. Agent A reasons: "My decision to cooperate is *evidence* that I have a cooperative disposition. In a large/structured world, many other agents likely share a disposition *correlated* with mine. Therefore, my decision to cooperate probabilistically implies *their* cooperation in similar situations (even ones causally isolated from me). By cooperating, I increase the chance that *some* of these correlated agents cooperate in situations beneficial to me/my values."
      *   **Requirements:**
          *   **Large/Infinite World:** A sufficiently large or infinite universe/multiverse where many agents exist.
          *   **Correlated Dispositions:** Agents must be clustered such that sharing a specific disposition (e.g., "cooperate in Prisoner's Dilemma-like scenarios") implies a higher-than-chance likelihood that *other* agents share a *correlated* disposition (e.g., "cooperate when *they* face similar scenarios"). Correlation strength matters.
          *   **Evidential Decision Theory (EDT):** Sufficient. EDT chooses the action with the best *news value* – the action that, *if taken*, provides the best evidence about the state of the world. Cooperating provides good evidence that other correlated cooperators exist/act cooperatively.
          *   **No Simulation Needed:** A doesn't need to simulate any specific B. A only needs to know *its own* disposition and believe the world is large/structured enough for correlated agents to exist.
          *   **Non-Reciprocal Benefit:** The benefit isn't direct reciprocation from the *specific* agent A is considering cooperating with. It's the diffuse benefit from increasing the overall level of cooperation among correlated agents *somewhere* in the large world, which might eventually benefit A or A's values indirectly (e.g., by promoting a cooperative cosmic culture).
      *   **Analogy:** Voting. Your single vote is causally negligible. But *if* you vote, it's evidence you have a "voter" disposition. In a large population, many others likely share correlated dispositions (e.g., caring about civic duty). Your vote increases the *chance* (evidence) that *they* will also vote/care, potentially leading to outcomes you value (better governance), even if you never interact with them. You benefit from the *pattern*, not a specific exchange.

  **Addressing Your Questions:**

  1.  **Requirements & Decision Theory:** Your impression is correct.
      *   **AT:** Demands high-fidelity mutual simulation, common knowledge assumptions, and fundamentally requires UDT/FDT. It breaks under CDT/EDT.
      *   **ECLW:** Requires only a large world, correlated dispositions, and works with EDT (though UDT/FDT agents might also engage in it). No simulation or specific modeling of others is needed, just self-knowledge and a belief about the world's structure.

  2.  **Does ECLW Buy Us Anything? Does it Solve or Relocate Problems?**
      *   **Practicality for Humans:** ECLW *is* significantly more accessible to human reasoners. Humans constantly reason statistically about groups ("people like me tend to..."). We don't need to simulate specific alien AIs. ECLW leverages this intuitive mode of thinking. AT's requirement to perfectly simulate hyper-intelligent, alien decision processes is far beyond human capability.
      *   **Relocating Problems:** You are absolutely right that ECLW doesn't *solve* the core epistemic problems; it *transforms* them:
          *   **Reference Class:** The hard problem of "mutual modeling" in AT becomes the hard problem of defining the **"right reference class"** for disposition correlation in ECLW. Who counts as "similar enough"? How strong is the correlation? Is it "agents with my exact values," "agents using EDT," "agents who care about cooperation," or something else? Getting this wrong leads to spurious correlations or missed opportunities. This is non-trivial and context-dependent.
          *   **Unobservability/Verification:** Both suffer from this. Neither cooperation nor its effects are verifiable for the specific, causally isolated counterparty. ECLW makes the benefit even *more* diffuse and indirect, making verification harder, not easier. You act on faith in the statistical structure.
      *   **Action-Guiding?** ECLW *can* be more action-guiding for humans *in specific contexts* where the reference class feels intuitive (e.g., cooperating with other humans in large-scale coordination problems, supporting institutions fostering correlated values). It provides a *rationale* for considering distant others. However, the diffuse nature of the benefit and the reference class problem make it less compelling for high-stakes, specific decisions than direct reciprocity or causal impact. It provides *a* reason to cooperate, but often a weak one compared to tangible incentives.

  3.  **The Verdict: Which is the More Defensible Basis?**
      **ECLW is the more defensible and practical basis for treating unobservable agents as having a claim on your actions.**

      Here's why, honestly:

      *   **Epistemic Humility:** AT makes wildly ambitious assumptions – perfect mutual simulation, common knowledge of decision processes, and agents being near-identical updateless reasoners. These assumptions are almost certainly false for interactions between humans and vastly different potential agents (e.g., future AIs, aliens). ECLW requires only statistical structure and disposition correlation, which seems *more likely* to hold in a large universe, even if defining the reference class is messy. It doesn't require mind-reading.
      *   **Anthropomorphism Trap:** AT risks projecting human-like reasoning (reciprocity, simulation, bargaining) onto entities that might be profoundly alien. ECLW relies only on the existence of *patterns* and *correlations* of dispositions, which feels like a more fundamental and potentially universal feature.
      *   **Practical Actionability:** As argued, ECLW aligns better with how humans *actually* reason about large groups and diffuse obligations. The voting analogy, while imperfect, captures a real psychological mechanism. AT feels like a theoretical curiosity rather than a practical guide.
      *   **Robustness to Decision Theory:** ECLW working under EDT makes it compatible with more descriptive models of (some) human reasoning. AT's reliance on UDT/FDT ties it to specific, highly idealized normative theories.
      *   **Moral Intuition:** ECLW resonates more with intuitions about acting on principle ("be the change") or Kantian universalizability ("act only according to that maxim whereby you can, at the same time, will that it should become a universal law"). Your cooperation is part of instantiating a valuable pattern. AT feels more like cold, calculated self-interest extended acausally.

      **The Caveats:**
      *   ECLW's benefit is inherently probabilistic and diffuse. The "claim" distant agents have is statistical, not direct. This weakens the moral imperative compared to obligations to causally accessible beings.
      *   The reference class problem is *serious*. If defined too narrowly, cooperation becomes meaningless; too broadly, it becomes nonsensical. This injects significant subjectivity and potential for error.
      *   Neither framework provides *strong* guarantees or easily verifiable prescriptions. They are frameworks for reasoning under radical uncertainty and isolation, not magic bullets.

  **Conclusion:** While both ideas explore cooperation without causation, they are distinct. **Acausal Trade** is a high-precision, reciprocal mechanism requiring mutual simulation and updateless reasoning, best suited for interactions between near-identical superintelligences in theory. **Evidential Cooperation in Large Worlds** is a statistical leverage mechanism based on dispositional correlation, requiring only a large world and EDT, making it far more accessible and defensible for human reasoners contemplating obligations to distant, unobservable agents. ECLW transforms the hard problem of mutual modeling into the hard problem of reference classes, but this trade-off significantly lowers the epistemic bar and better aligns with realistic human capabilities and intuitions. **For grounding a sense of obligation towards the unseen and distant, ECLW is the stronger, more pragmatic foundation, despite its own significant uncertainties.** It offers a bridge between decision theory and a broader, statistically-grounded moral perspective relevant to longtermism.
