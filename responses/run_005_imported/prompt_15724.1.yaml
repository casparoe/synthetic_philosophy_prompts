  Potential resolution: Phase transitions as weakly emergent. The macro-behavior is fixed by microphysics but requires infinite N for exact transitions, and universality shows autonomy in explanation. Both have points, but neither fully wins. Highlighting this balance could help the user feel the debate is productive, not a zero-sum game.

