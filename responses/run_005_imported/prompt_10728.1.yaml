answer: |-
  You've hit on one of the most notoriously slippery arguments in contemporary metaphysics. The Lewisian "vagueness argument" for universalism (or nihilism) *is* weirdly persuasive, but your intuition that there's a sleight of hand is shared by many philosophers who defend moderate views (composition happens sometimes, under vague conditions). Let's construct the strongest case against the inference that vague composition implies vague existence. I'll build this case step-by-step, drawing primarily on the work of philosophers like Eli Hirsch, Theodore Sider (critically), and Kit Fine, while aiming for clarity without jargon.

  **The Core Inference to Challenge:**
  1.  If composition is restricted (not always or never), then there must be borderline cases of composition (e.g., a specific arrangement of bricks/mortar where it's indeterminate whether they compose a wall).
  2.  Borderline composition implies it's indeterminate *whether a composite object exists* in that borderline case.
  3.  Indeterminate existence implies *vague existence* (existence itself is fuzzy or comes in degrees).
  4.  Vague existence is metaphysically impossible (existence is all-or-nothing).
  5.  Therefore, restricted composition is impossible. Only universalism or nihilism is viable.

  **The Strongest Case Against the Inference (Steps 2 to 3):**

  The sleight of hand lies in the leap from *borderline composition* to *indeterminate existence/vague existence*. Critics argue this conflates **vagueness in our concepts or language** with **vagueness in the world itself**. Here's the counter-argument structured for maximum force:

  1.  **Vagueness is Primarily Semantic, Not Ontological:** The overwhelming source of vagueness in our discourse (like "bald," "heap," or "tall") stems from the imprecision of our *words* or *concepts*, not from fuzzy boundaries in reality itself. "Baldness" is vague because our concept lacks a sharp cutoff for the number of hairs, not because hair follicles themselves have indeterminate existence at the borderline. Similarly, "composition" might be a vague *predicate* we apply to the world.

  2.  **Reality is Precise, Our Carving is Vague:** Assume a fundamental, microscopic level of reality exists (e.g., particles, fields, or whatever physics posits). These fundamental entities and their precise arrangements are fully determinate. When we ask, "Do *these* fundamental entities compose a further object (a wall, a shoe-Moon fusion)?", we are applying a high-level, human-centric *concept* ("object," "composite thing") to this precise underlying reality. The vagueness arises because *our concept "composite object"* lacks necessary and sufficient conditions that perfectly map onto the infinitely complex variations of fundamental arrangements. There's no "switch" in reality; there's just continuous variation at the fundamental level, and our concept "composes an object" smears over this continuity. The Lego bricks and mortar molecules are always there, arranged precisely; the question of whether *that specific arrangement counts as "a wall"* is where the indeterminacy lies.

  3.  **Indeterminacy Concerns *Classification*, Not *Existence*:** In a borderline case (say, bricks with a near-infinitesimal amount of mortar), it's *indeterminate whether the predicate "composes a wall" applies*. This does *not* mean there's some ghostly, semi-existent "wall-object" hovering in a state of ontological limbo. It means:
      *   The fundamental particles are definitely there, arranged in that specific way.
      *   There is simply no fact of the matter *in our language or conceptual scheme* about whether that arrangement falls under the concept "wall" (or "composite object").
      *   We haven't precisely defined "composite object" well enough to decide *this* case. The indeterminacy is in our *description* of reality, not in reality's furniture.

  4.  **Existence is Not Vague, Quantification is Precise (via Supervaluation):** We can model this precisely using a technique called **supervaluationism** (adapted for metaphysics). Imagine multiple slightly different, perfectly precise ways ("precisifications" or "sharpings") we *could* define the concept "composes a composite object." Each precisification draws a sharp line *somewhere* in the continuum (e.g., "Composition occurs iff at least 10^15 mortar molecules bond the bricks" vs. "iff at least 10^15 + 1 molecules," etc.).
      *   In a *clear case* of composition (fully mortared wall), *all* admissible precisifications agree: "Yes, a composite object exists here."
      *   In a *clear case* of non-composition (two loose bricks), *all* admissible precisifications agree: "No composite object exists here."
      *   In a *borderline case*, some admissible precisifications say "Yes, a composite object exists," while others say "No, no such object exists."
      *   **Crucially:** On *each individual precisification*, existence is perfectly determinate. There is no vague existence *within any one way of understanding the world*. The statement "A composite object exists in this borderline arrangement" is neither true nor false *simpliciter* because our language/concept is unsettled. But this indeterminacy is *semantic* – it's about which precise concept we're using. Reality itself, described by any *one* precisification, contains a definite set of objects. The *appearance* of vague existence arises only when we try to ask the question *without* specifying which precisification we mean.

  5.  **The "Head-Count" Objection Dissolved:** The argument claims vague composition forces a vague "head-count" of objects. But on the supervaluationist model:
      *   Relative to any *single* precisification, the number of objects in the universe (fundamental particles + the composite objects recognized by that precisification) is perfectly definite.
      *   The *variation* in head-count across different precisifications (e.g., one counts the borderline wall, another doesn't) reflects the different ways we *could* conceptually carve up the *same* underlying fundamental reality. It doesn't mean reality has an indeterminate number of objects *in itself*; it means our concepts don't pick out one unique carving as the "correct" one in borderline regions.
      *   Asking "How many objects are there *absolutely*?" in a borderline case is like asking "How many grains *absolutely* make a heap?" without specifying which precisification of "heap" you're using. The question is ill-posed or indeterminate *because of the concept*, not because reality can't be counted.

  6.  **Rejecting the "Vague Existence" Bogeyman:** The argument against vague existence (Step 4) often relies on the intuition: "How could something *partly* exist? Existence is yes or no!" The moderate agrees completely. Their point is precisely that *existence isn't vague*. The fundamental particles *definitely exist*. The indeterminacy only concerns whether a certain arrangement of those definite particles satisfies the *human concept* "composite object." There is no entity whose existence is "fuzzy." There are just particles arranged brick-and-mortar-wise-in-such-a-way-that-our-concept-'wall'-doesn't-cleanly-apply. Our conceptual scheme is vague; the existence and arrangement of the particles is not.

  **Addressing Potential Universalist Retorts & Strengths/Limitations of the Case:**

  *   **"But Composition Creates New Entities!":** The universalist insists that if composition occurs, a genuinely *new* entity comes into existence. Therefore, borderline composition *must* mean borderline *existence* for that new entity. The moderate counters: This begs the question *against* their view. They deny that composition *literally creates* a new fundamental entity "over and above" the parts. They see "composite objects" as real patterns or ways the fundamental parts are organized, but their *existence as objects* is dependent on our conceptual scheme for recognizing such patterns. The fundamental ontological commitment is always to the parts and their relations; the "composite object" is a derivative way of describing some arrangements. Its "existence" is not an additional, ghostly ontological commitment that can be vague; it's a status conferred by our concepts upon arrangements of the fundamental stuff. Borderline composition means borderline *status*, not borderline *being*.
  *   **"Supervaluationism is Just Wordplay!":** The universalist might argue that supervaluationism avoids vague existence only by hiding the problem. If *no* precisification is uniquely correct, doesn't that mean reality *itself* doesn't determine which objects exist in the borderline case? Isn't *that* a kind of metaphysical indeterminacy? The moderate replies: It only means reality underdetermines which *concept* we should use. The fundamental facts (particle arrangements) are fully determinate. *Which* high-level objects those facts correspond to depends on our conceptual choices, which can be vague. This is a fact about language and mind, not about the fundamental fabric of reality.
  *   **Strength of the Case:** This case successfully severs the link between semantic/conceptual vagueness and ontological vagueness. It provides a coherent, well-developed model (supervaluationism) for how borderline composition can exist without vague existence or indeterminate head-counts. It preserves the intuition that existence is all-or-nothing at the fundamental level while accommodating the obvious vagueness in our ordinary judgments about objects.
  *   **Limitations:** This view does commit one to a form of *conceptual relativity* or *ontological minimalism*. It says there's no single, perfectly sharp, mind-independent answer to "What composite objects exist?" in borderline cases – the answer depends on how we define our terms. Some find this unsatisfying or overly language-dependent. It also relies on the coherence of supervaluationism, which has its own critics (e.g., concerning "higher-order vagueness" – when does a precisification become "admissible"?). Finally, it doesn't *solve* the Special Composition Question; it just shows that vague answers are metaphysically coherent.

  **Conclusion: Does the Inference Hold?**

  Based on this strong case, **the inference *does not* necessarily go through.** The argument from borderline composition to vague existence commits a crucial error: it conflates **vagueness in our concepts or linguistic practices** (which is undeniable and pervasive) with **vagueness in the fundamental structure of reality itself** (which is highly contentious and arguably incoherent). The moderate can coherently maintain that:

  1.  Composition is restricted and sometimes vague (there are borderline cases).
  2.  In borderline cases, it's indeterminate *whether the concept "composite object" applies*.
  3.  This indeterminacy is semantic/conceptual, *not* ontological.
  4.  The fundamental constituents of reality (e.g., particles) exist determinately.
  5.  The number of objects relative to any precise way of defining "object" is determinate.
  6.  Therefore, there is no vague existence and no vague head-count in reality itself.

  Your intuition about a "sleight of hand" is well-founded. The Lewisian argument powerfully highlights the *problem*, but the move from vague composition to vague existence relies on a controversial assumption – that all vagueness must be worldly – that the moderate can and does reject. Reality *can* contain precise fundamental entities arranged in continuous ways, while our concept of when those arrangements constitute a "further object" remains irreducibly vague, without this implying any fuzziness in existence itself. Universalism and nihilism avoid this problem only by adopting extreme, deeply counterintuitive positions; the moderate view offers a stable, coherent middle ground by locating the vagueness where it plausibly belongs: in us.
