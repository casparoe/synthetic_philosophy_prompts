  First, I need to recall the Lewisian argument: if composition isn't always or never, there must be a sharp cutoff, which seems arbitrary. To avoid that, composition must be vague. But vague existence is deemed impossible, leading to universalism or nihilism. The user wants to challenge the step where vague composition implies vague existence.

  The user mentions having no philosophy background, so I should avoid jargon. They fell into this via YouTube videos, so they might need clear explanations. Their frustration is palpable—they feel something's off but can't articulate it. I need to validate their intuition and provide a rigorous counterargument.

  I remember that the key move critics attack is the "vagueness in the world" premise. Van Inwagen himself, despite his moderate view, rejects vague existence. But others like Sider defend it. The user wants the strongest case against the inference, not just a survey of opinions.

  Possible angles: linguistic vagueness vs. ontological vagueness. Maybe the vagueness is in our concepts, not in reality. For example, "bald" is vague because of our definition, not because hair existence is vague. Similarly, "compose" might be a vague predicate, but the objects themselves exist definitely.

  But the universalist retort: if composition is vague, the number of objects must be vague too. How to counter that? Emphasize that existence isn't tied to our descriptions. The particles exist regardless; when they compose an object depends on our concept of "object," which has fuzzy boundaries.

  Another point: supervaluationism. Even if it's indeterminate whether an object exists, each candidate ontology is precise. So reality has a definite number; our language can't pick which one. This avoids vague existence by making indeterminacy semantic.

  Also, consider the difference between de re and de dicto vagueness. Vagueness in statements vs. in things themselves. The universalist conflates the two, but critics argue all vagueness is de dicto.

  The user might worry this is just wordplay. Need concrete examples. Like the Lego bricks: adding cement gradually. At each step, the particles exist. Whether they form a "wall" is vague, but the particles don't pop in/out. So no vague existence, just vague categorization.

  But the universalist insists: if composition is vague, then at some point, it's indeterminate whether there's an additional object. That additional object's existence would be vague. How to refute that? Argue that the indeterminacy is about our concept, not the object. The particles are there; the "wall" as an entity isn't a separate ontological commitment but a way of describing arrangements.

  Sider's argument that composition must be precise because existence is precise. But why can't existence be precise while composition is vague? Because composition creates new entities. If it's vague whether composition occurs, it's vague whether that entity exists. That's the crux.

  The best counter is to deny that composition creates entities in that way. Mereological nihilists say no composition ever occurs; universalists say always. Moderates need to say that sometimes it does, but the conditions are vague. To avoid vague existence, they must argue that the vagueness isn't in existence but in our criteria.

  Hirsch's quantifier variance: different languages have different criteria for "object," but each is precise. So no vague existence, just different ways of carving the world. But this might be too relativistic for the user.

