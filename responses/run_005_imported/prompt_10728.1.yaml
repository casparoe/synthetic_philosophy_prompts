  But the universalist says: if the wall exists as an object, it must be determinate whether it does. The moderate replies: it's not a separate object; it's the particles. So "the wall exists" means "particles are arranged wall-wise," which is vague, but the particles' existence isn't.

  Ah, here's the key. Rejecting that composition creates new entities. That's the nihilist move. The moderate must accept composite objects but argue that their existence conditions can be vague without vague existence. How? By making vagueness epistemic? But that's problematic.

