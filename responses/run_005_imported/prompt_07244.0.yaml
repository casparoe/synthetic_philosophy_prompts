answer: |-
  You've nailed the core puzzle: identical starting points (veil of ignorance) leading to diametrically opposed conclusions (avg. utilitarianism vs. maximin). The divergence hinges entirely on **assumptions about rationality, risk, probability, and interpersonal utility comparison** behind the veil. Let's break down the mechanics:

  1.  **Probability & Knowledge of Probabilities: The Core Fracture**
      *   **Harsanyi:** Assumes individuals behind the veil operate under **Bayesian rationality**. They know the *structure* of society (possible positions, associated utility functions) but not their *specific* place. Crucially, Harsanyi argues they **must assign equal subjective probabilities** to ending up in any social position. This is based on the "Principle of Insufficient Reason" (if you have no reason to believe one state is more likely than another, assign equal probability). Rational agents maximize *expected utility*.
      *   **Rawls:** Radically rejects the use of **any** probability calculations behind the veil. He argues the veil creates such profound **uncertainty** (not mere *risk* with known probabilities) that it's irrational to assign probabilities. Individuals have **no basis whatsoever** for estimating the likelihood of occupying any particular position. Rational choice under this "radical uncertainty" cannot rely on expected utility maximization.

  2.  **Risk Aversion & The Maximin Criterion:**
      *   **Harsanyi:** Agents behind the veil, using expected utility with *equal probabilities*, are implicitly **risk-neutral** *with respect to the social gamble*. They care about the *average* outcome because each position is equally likely. Maximizing the sum/average of utilities is the rational outcome. Harsanyi argues Rawls's maximin implies **extreme (effectively infinite) risk aversion** is rational in the original position.
      *   **Rawls:** Agrees that maximin *does* imply extreme risk aversion, but argues **this is justified** given the unique conditions of the original position:
          *   **Stakes are Enormous:** Choosing principles governing your *entire life prospects*.
          *   **No Basis for Probabilities:** As above, you can't calculate odds.
          *   **Guaranteeing the Minimum:** Maximin focuses on making the *worst possible outcome* as good as possible. Under radical uncertainty about who you might be (especially given you could be the *least* advantaged), it's rational to prioritize securing an acceptable minimum floor for society. You "insure" against catastrophic life prospects.
          *   **Rejecting Harsanyi's Accusation:** Rawls counters that it's *not* "infinite" risk aversion applied universally. It's a **context-specific rational strategy** under the unique, high-stakes, no-probability conditions of the original position. Choosing a vacation (low stakes, maybe some probability info) wouldn't warrant maximin; choosing your society's fundamental structure does.

  3.  **Interpersonal Utility Comparison (IUC): The Measurement Problem**
      *   **Harsanyi:** His theorem **crucially relies** on **cardinal, interpersonally comparable utilities**. He assumes individuals have von Neumann-Morgenstern (vNM) cardinal utility functions (measuring intensity of preference under risk), and further, that these utilities are *comparable across different people*. This allows the straightforward summation/averaging required by utilitarianism. He believes vNM utilities provide a scientific basis for IUC.
      *   **Rawls:** Is deeply skeptical of **both** cardinal utility *and* interpersonal comparability. He argues preferences are diverse, complex, and lack a common, objective scale for comparison. Relying on utility would make the choice behind the veil dependent on controversial metaphysical and psychological assumptions. His solution:
          *   **Primary Goods:** Individuals behind the veil evaluate social positions based on an index of **"primary goods"** (rights, liberties, opportunities, income, wealth, social bases of self-respect). These are things any rational person is presumed to want, *regardless* of their specific conception of the good life. This provides an **objective, interpersonally comparable metric** (e.g., how much income/opportunity does this position offer?) that bypasses the utility comparison problem.

  **Where the Paths Diverge Mechanically:**

  1.  **Step 1: The Veil Descends.** Both: Ignorance of specific social position, knowledge of general social/economic/political facts and human psychology.
  2.  **Step 2: Rational Choice Setup.**
      *   *Harsanyi:* "Given I'm equally likely to be anyone, I'll maximize my *expected* utility. I know my vNM utility function for outcomes, and others' are comparable to mine."
      *   *Rawls:* "I have *no idea* how likely I am to be anyone. The stakes are my whole life. I need to ensure that *no matter who I am*, especially if I'm worst off, my position is tolerable. I'll judge positions by the primary goods they offer, not unmeasurable utility."
  3.  **Step 3: Choosing Principles.**
      *   *Harsanyi:* Calculate expected utility: (Utility if Position 1 * 1/n) + (Utility if Position 2 * 1/n) + ... + (Utility if Position n * 1/n). Maximize this sum/average. Result: **Average Utilitarianism** (Max ΣU_i / n).
      *   *Rawls:* Identify the worst-off position under each possible set of principles. Choose the principles where the worst-off position is *best* (has the highest index of primary goods). Result: **Maximin / Difference Principle**.

  **Defensibility: Which Move Holds Up Better?**

  This is hotly contested, but here's a balanced assessment focusing on the mechanics you need:

  *   **Harsanyi's Strengths:** His model is **internally consistent** within standard rational choice theory. If you accept Bayesian rationality + equal probabilities + cardinal/comparable utilities, utilitarianism *does* follow logically. The use of vNM utilities provides *some* formal structure for IUC. It seems less "arbitrary" than Rawls's primary goods from a purely decision-theoretic view.
  *   **Harsanyi's Weaknesses:**
      *   **Equal Probability Assumption:** Is it justified? Rawls argues forcefully it's not. Assigning equal probability to being a neurosurgeon vs. a subsistence farmer in an unequal society seems arbitrary without supporting information. The Principle of Insufficient Reason is philosophically controversial.
      *   **IUC Problem:** Cardinal, comparable vNM utilities remain deeply problematic. Can my "utils" from income really be compared to yours meaningfully? Rawls's skepticism here is widely shared. Harsanyi's solution feels technically elegant but metaphysically shaky.
      *   **Risk Neutrality:** Is it rational to be risk-neutral about your *entire life prospects*? Intuition often sides with Rawls here.

  *   **Rawls's Strengths:**
      *   **Radical Uncertainty:** His characterization of the original position as involving profound uncertainty, not calculable risk, is **highly plausible**. We genuinely lack the information for probability assignments.
      *   **High Stakes Justify Caution:** The argument that extreme risk aversion is *contextually rational* under these unique, existential conditions is powerful and resonates with intuition. Maximin acts as catastrophic insurance.
      *   **Primary Goods:** Bypassing utility via primary goods is a **pragmatic solution** to the IUC problem. It provides a workable, objective(ish) basis for comparison focused on the means to pursue *any* life plan, which fits the veil's purpose.
  *   **Rawls's Weaknesses:**
      *   **Is Maximin *Really* Rational?** Critics argue it's *overly* conservative. What if maximizing the minimum requires massive sacrifices for tiny gains at the bottom? Harsanyi's accusation of "infinite risk aversion" (while perhaps overstated) highlights that maximin ignores potential large gains for the majority if the worst-off are already decently secure. It might be irrational to forgo significant improvements for 99% just to get a tiny bit more for the worst-off 1%.
      *   **Primary Goods as a Proxy:** Are primary goods really neutral? Do they capture what matters equally well for *all* conceptions of the good? (e.g., a monk vs. an entrepreneur). Can they be aggregated into a single index without controversial value judgments? This reintroduces some of the comparability problems it aimed to solve.

  **Which Move is More Defensible? A (Leaning) Verdict:**

  While both have merits, **Rawls's moves are generally more defensible *within the specific, unique context of the original position*** for your paper:

  1.  **Rejecting Probability Assignments:** Rawls's argument that the veil creates *radical uncertainty*, not quantifiable risk, is compelling and directly attacks Harsanyi's foundational assumption. Assigning equal probabilities feels like an arbitrary mathematical convenience, not a description of genuine ignorance.
  2.  **Justifying Extreme Caution:** The high-stakes, life-defining nature of the choice makes a focus on securing the minimum position rationally understandable, even if maximin might be too extreme in other contexts. Harsanyi's risk-neutrality seems less appropriate here.
  3.  **Primary Goods as a Workaround:** While imperfect, the primary goods approach is a more plausible and operational way to achieve interpersonal comparison *for the purpose of choosing basic societal structures* than relying on the metaphysical minefield of cardinal/comparable utility. It focuses on the *means* to pursue happiness, not happiness itself.

  **Key Takeaway for Your Paper:** Don't frame it as "Harsanyi uses probability, Rawls uses risk aversion." Frame it as **Harsanyi interpreting the veil as a context of *risk* (with equal probabilities) leading to expected utility (avg. utilitarianism), while Rawls interprets it as a context of *radical uncertainty* (no probabilities) leading to maximin, justified by the unique stakes.** The disagreement over probability knowledge is the *primary* driver; risk attitude and IUC are the necessary consequences of that initial fracture. Argue that Rawls's interpretation of the epistemic conditions (no basis for probability) is more accurate, making his subsequent moves (extreme caution, primary goods) more defensible *in this specific context*, even if maximin seems overly conservative in other decision contexts. Acknowledge the force of Harsanyi's formal consistency but emphasize the artificiality of the equal probability assumption under deep ignorance.
