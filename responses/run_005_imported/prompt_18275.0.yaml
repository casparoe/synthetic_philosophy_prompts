   But note: the issue is that Player A took most of his attempts in the easier category (away) and did well, while Player B took most of his attempts in the tougher category (home) and did relatively well too, but the away attempts were few and he did great there. 

   Now, why might this be messy? 
     - The split variable (home vs away) is not just a confounder but might be influenced by the team's strategy. 
     - For example, perhaps Player A is a star player and the team intentionally rests him during tough away games and plays him more in easier away games? 
     - Or maybe Player B is the one who is forced to play in tough home games against strong opponents? 

   The question: which player is better? 
     - If we look overall, Player A has a higher shooting percentage. 
     - But if we condition on the location, Player B is better in both. 

   However, the problem is that the location might be a result of the coach's decision (which is influenced by the player's ability) or the opponent's strength. 

   In this case, the variable "location" is not a pre-existing characteristic of the player but is intertwined with the team's strategy and the player's role. 

   Therefore, two arguments:
     Argument 1 (use overall): The overall percentage reflects the actual performance in the mix of situations the player was placed in. Since Player A was used in a way that maximized his opportunities (more in easy games), he produced a higher overall success rate for the team.

     Argument 2 (use stratified): The stratified numbers show that in comparable situations (same location), Player B is more skilled. The reason Player B has a lower overall is because he was assigned a harder set of games. Therefore, if we were to adjust for the difficulty (by having them play the same schedule), Player B would be better.

   The ambiguity: The assignment of games (i.e., which player plays where) is not random and is potentially a result of the coach's decision based on the player's ability. 

   This is different from the Berkeley case where the department was a pre-existing choice of the applicant and not influenced by the admissions process.

   In our sports example, the coach might assign Player B to tough home games because the coach believes Player B is better equipped to handle them. So the conditioning variable (location) is a consequence of the player's perceived ability and the team's strategy.

   Therefore, it's not clear whether we should condition on location or not.

   Let me formalize the numbers:

   Player A:
     Home (tough): 5/10 = 50%
     Away (easy): 70/100 = 70%
     Overall: 75/110 = 68.2%

   Player B:
     Home (tough): 60/100 = 60%
     Away (easy): 8/10 = 80%
     Overall: 68/110 = 61.8%

   Now, Simpson's paradox: 
     Overall, Player A has a higher shooting percentage (68.2% vs 61.8%), but in both home and away games, Player B has a higher shooting percentage (home: 60% > 50%; away: 80% > 70%).

   Why is this happening? Because Player A took most of his shots (100 out of 110) in the easier away games, while Player B took most of his shots (100 out of 110) in the tougher home games.

   How to present it:

   In the article:

   "Consider two basketball players on the same team. Player A has an overall shooting percentage of 68.2%, while Player B has 61.8%. At first glance, Player A seems more accurate. But break the numbers down by game location, and the story flips: at home (where the team faces tougher opponents), Player B shoots 60% compared to Player A's 50%. And away (against easier opponents), Player B shoots 80% to Player A's 70%. So in each setting, Player B is the better shooter.

   Why the reversal? Player A took the vast majority of his shots (100 out of 110) in the easier away games, where both players shoot better. Player B, meanwhile, was deployed mostly in the tough home games. So even though he outshot Player A in both environments, his overall percentage got dragged down by the difficult context.

   But here's the catch: the coach's decision to deploy Player B in the tough games might be precisely because they see Player B as the stronger shooter in high-pressure situations. So is Player B's lower overall percentage a fair reflection of his skill? Or is it an artifact of the team's strategy?

   This is where Simpson's paradox gets slippery. In textbook cases, we're told to trust the stratified numbers — they account for the confounding variable. But in real-world scenarios, the variable you're stratifying by (here, game location) might itself be a consequence of the very quality you're trying to measure (shooting skill under pressure). Two data scientists could reasonably disagree: one might argue the overall number tells you who contributed more points in actual games played; the other might counter that the stratified comparison reveals who's fundamentally more skilled when contexts are equalized."

   This example is fresh and avoids the clichéd case studies. It also highlights the ambiguity in interpreting the stratified data when the stratifying variable is entangled with the outcome.

