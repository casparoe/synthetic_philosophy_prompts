   The scenario: A company is reviewing the overall pass rates of two hiring managers (Manager A and Manager B) for a technical role. 
   The data is split by the interview round (first round and second round). 

   The paradox: 
     - Overall, Manager A has a higher pass rate (percentage of candidates that pass the interview) than Manager B.
     - But when you break the data down by interview round, Manager B has a higher pass rate in each round.

   The twist: The variable we are splitting by (interview round) is not a pre-existing confounder but is actually influenced by the manager's own behavior. 
   Specifically, Manager A is known to be very tough in the first round and only passes the very best candidates to the second round, while Manager B passes more candidates in the first round, leading to a larger and weaker pool in the second round.

   The numbers:

