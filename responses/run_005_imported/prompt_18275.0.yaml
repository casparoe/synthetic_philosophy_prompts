     Away (easy): 100 attempts, 70 made -> 70%
     Overall: 75/110 ≈ 68.2%

   Player B:
     Home (tough): 100 attempts, 60 made -> 60%
     Away (easy): 10 attempts, 8 made -> 80%
     Overall: 68/110 ≈ 61.8%

   Now:
     Home: 50% (A) vs 60% (B) -> B better
     Away: 70% (A) vs 80% (B) -> B better
     Overall: 68.2% (A) > 61.8% (B) -> A better.

