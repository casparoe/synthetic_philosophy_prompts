prompt: |-
  This term I am teaching Fitch's paradox of knowability in a graduate seminar on realism and anti-realism about truth, where the anti-realist's animating thought is that there can be no truths lying permanently beyond the reach of anyone's possible knowledge. I have run into a recurring pedagogical problem: once students have reconstructed the formal proof for themselves, they tend to treat the various replies to it in the secondary literature as a set of disconnected technical maneuvers, rather than as moves made by two people who are genuinely disagreeing with one another about something. I would like a dialogue I can hand out that restores the dispute to something closer to its natural form.

  As background: the paradox begins from the knowability principle - the claim that every truth is such that it is possible for someone to know it - together with the modest concession that at least one truth is not, in fact, known by anyone. Substituting that very truth ("such-and-such is the case, and nobody knows it") back into the knowability principle yields the claim that it must be possible to know this conjunction. But knowing a conjunction requires knowing each of its conjuncts, and because knowledge is factive, knowing the second conjunct - that one does not know the first - entails that one really does not know it. So whoever knew the whole conjunction would have to both know it and not know it, which is impossible. And because that impossibility is secured by logic alone rather than by any contingent fact, it holds in every possible circumstance - which means it was never even possible to know the conjunction in the first place. The upshot, notoriously, is that the knowability principle, together with the near-truism that we are not omniscient, entails the absurd conclusion that every truth actually is known by someone.

  Please write a dialogue, set just after this proof has gone up on the whiteboard during office hours, between the anti-realist who defends the knowability principle and a realist colleague who has wandered in partway through. The anti-realist should attempt at least two genuinely different ways of rescuing some non-trivial version of the thesis - for instance, restricting the range of propositions to which it applies, and, separately, questioning whether the derivation is entitled to help itself to classical logic at every step - while the realist contests each proposal on its own merits rather than simply reiterating that the conclusion is absurd, pressing in particular on whether each fix is independently motivated or has instead been cut to the exact shape of this one argument, and on how much of the original anti-realist position survives the repair. The two interlocutors should be equally rigorous, neither should be allowed to win by authorial fiat, and the dialogue may end without a tidy resolution if that is honestly where the exchange leads.
reasoning: |-
  We are setting the dialogue in an office hours session just after the proof has been written on the whiteboard. The anti-realist (let's call her Dr. A) has been teaching the seminar and has just reconstructed the proof. A realist colleague (Dr. R) wanders in partway through and becomes engaged in the discussion.

  The proof on the board:

  1. ∀p (p → ◊Kp)   [Knowability Principle: every truth is knowable]
  2. ∃p (p ∧ ¬Kp)   [Non-omniscience: there is an unknown truth]

  Let q be such a truth: q ∧ ¬Kq

  By 1: (q ∧ ¬Kq) → ◊K(q ∧ ¬Kq)

  But ◊K(q ∧ ¬Kq) leads to contradiction because:
  - K(q ∧ ¬Kq) entails Kq (by distribution of K over conjunction)
  - K(q ∧ ¬Kq) also entails K(¬Kq) which, by factivity of K, entails ¬Kq.

  So we have both Kq and ¬Kq, a contradiction.

  Therefore, by reductio, the assumption that there is an unknown truth (∃p (p ∧ ¬Kp)) must be false. Hence, ∀p (p → Kp) — every truth is actually known.

  Now, the dialogue:

  Dr. A: ...and that's the paradox. The knowability principle, which seems so central to anti-realism, together with the undeniable fact that we are not omniscient, leads to the absurd conclusion that we are omniscient.

  Dr. R (who has been listening): Hold on, that's quite a result. But surely you're not going to abandon the knowability principle? I know you anti-realists are committed to it.

  Dr. A: Of course not. The principle is fundamental: truth is essentially tied to our cognitive capacities. But we must find a way to block the derivation. I have a couple of ideas. First, note that the problematic proposition is the one that says of itself that it is unknown. That seems self-referential in a tricky way. Maybe we should restrict the knowability principle to propositions that are not self-referentially problematic. Specifically, we might restrict it to basic propositions that do not have the form "p and it is not known that p".

  Dr. R: So you're suggesting that the knowability principle doesn't apply to all propositions? Only to some?

  Dr. A: Exactly. The anti-realist intuition is that the world is not independent of our cognitive capacities. But that doesn't require that every single proposition, no matter how constructed, must be knowable. In particular, the proposition "q and nobody knows q" is built using the knowledge predicate. It's a higher-order proposition. The anti-realist thesis is primarily about the world, not about our knowledge of it. So we can restrict the principle to propositions that do not involve the knowledge operator.

  Dr. R: That seems ad hoc. Why should the principle be restricted in exactly this way? Because it blocks the paradox? But then you're just tailoring your principle to avoid the argument. Moreover, doesn't this restriction undermine the original motivation? The anti-realist wants to say that there are no truths beyond our cognitive reach. But now you're allowing that there might be some truths that are beyond our cognitive reach, namely, these self-referential ones. That seems to give up the game.

  Dr. A: Not necessarily. The anti-realist can maintain that for any truth about the world, it is possible to know it. The problematic propositions are not about the world alone, but about our knowledge. So the restriction preserves the core idea: the world is fully knowable.

  Dr. R: But the proposition "q and nobody knows q" is partly about the world (it asserts q) and partly about our knowledge. And q itself is about the world. So if q is about the world, then the conjunction is also about the world, even if it has an epistemic component. Also, consider: if there is a truth that we don't know, then the world includes that fact of our ignorance. And if the world is fully knowable, shouldn't we be able to know that we are ignorant of q?

  Dr. A: That's a fair point. But note that the paradox arises because of the specific logical properties of knowledge. So perhaps the restriction is independently motivated by the nature of knowledge. We know that self-referential statements can cause paradoxes, as in the liar. So it's not just to block Fitch.

  Dr. R: But the liar is a different paradox. In this case, the proposition is not self-referential in the same way. The liar says "this sentence is false", but here the proposition is about q and our knowledge of q. It doesn't refer to itself. It's just a conjunction.

  Dr. A: Actually, in the derivation, we instantiate the knowability principle with the very proposition that is built using the knowledge predicate. So it is a form of self-reference. But even if it's not exactly the same, we can see that allowing unrestricted application of the knowability principle to propositions that embed the knowledge operator leads to trouble. So we should restrict the principle to non-epistemic propositions.

  Dr. R: But then what about other propositions that embed the knowledge operator? For example, "It is known that p" is an epistemic proposition. Would the knowability principle apply to it? If not, then the anti-realist is saying that there might be unknowable truths about knowledge. That seems odd because knowledge is part of the world too, and the anti-realist should want to say that truths about knowledge are also knowable.

  Dr. A: Hmm, that's a challenge. Perhaps we can distinguish between basic, non-epistemic propositions and others. The knowability principle applies to the basic ones, and then we can build up from there.

  Dr. R: But then how do we know that the complex ones are knowable? For instance, if I have a proposition "p and it is known that p", that's also an epistemic proposition. Shouldn't the anti-realist want that to be knowable too? But if we restrict the principle to non-epistemic, then we can't say that. And if we extend the principle to some epistemic propositions, how do we draw the line without being arbitrary?

  Dr. A: Maybe we can say that the knowability principle applies to all propositions that do not contain the knowledge operator in a way that leads to paradox. But that's vague and again seems ad hoc.

  Dr. R: Exactly. So let me propose an alternative: perhaps the problem lies not in the range of propositions but in the logic. I notice that the derivation uses classical logic, including the law of double negation and the principle that a contradiction implies anything. But anti-realists often favor intuitionistic logic. Maybe in an intuitionistic framework, the derivation doesn't go through.

  Dr. A: That's my second idea! In intuitionistic logic, we don't have the same rules. For example, from a contradiction we don't necessarily get arbitrary conclusions in the same way. But more importantly, the negation rules are different. Let me try to reconstruct the argument in intuitionistic terms.

  We have: 
  Assume (for reductio) that there is an unknown truth: ∃p (p ∧ ¬Kp)

  Let q be such that q ∧ ¬Kq.

  By knowability: ◊K(q ∧ ¬Kq)

  Now, in intuitionistic logic, we cannot derive a contradiction from ◊K(q ∧ ¬Kq) in the same way? Actually, we can still derive that K(q ∧ ¬Kq) entails both Kq and ¬Kq, which is a contradiction. So even in intuitionistic logic, K(q ∧ ¬Kq) entails a contradiction. Then, since a contradiction is absurd, we can conclude that K(q ∧ ¬Kq) is impossible. So ◊K(q ∧ ¬Kq) is false. But then, by modus tollens on the knowability principle, we get that (q ∧ ¬Kq) is false. But we assumed it was true. Contradiction.

  Dr. A: Wait, that doesn't seem right. Let me think. In intuitionistic logic, we have to be careful with negation. The step from ◊K(q ∧ ¬Kq) leading to a contradiction only shows that ◊K(q ∧ ¬Kq) is false. Then, by modus tollens, we have that (q ∧ ¬Kq) is false. But in intuitionistic logic, the negation of a conjunction is not equivalent to the disjunction of negations. So ¬(q ∧ ¬Kq) is not equivalent to ¬q ∨ ¬¬Kq, and without double negation elimination, we cannot get ¬(q ∧ ¬Kq) → (q → Kq). So we don't get the omniscience conclusion.

  Dr. R: So what do we get? We have that for the particular q we assumed, ¬(q ∧ ¬Kq). But that doesn't tell us that every truth is known. It only tells us that for this q, it is not the case that q is true and unknown. But that could be because q is false, or because q is known. But we assumed q was true and unknown, so we have a contradiction at the level of the existential assumption. We assumed ∃p (p ∧ ¬Kp), and we derived a contradiction. Therefore, we can conclude ¬∃p (p ∧ ¬Kp). And in intuitionistic logic, ¬∃p (p ∧ ¬Kp) is not equivalent to ∀p (p → Kp). The latter is stronger.

  Dr. A: Exactly. In intuitionistic logic, ¬∃p (p ∧ ¬Kp) is equivalent to ∀p ¬(p ∧ ¬Kp), which is ∀p (p → ¬¬Kp). But without double negation, we cannot get from ¬¬Kp to Kp. So we only get that every truth is not not known, which is weaker than actually known. So the anti-realist can maintain that there might be unknown truths, but they are not stably unknown in a way that would allow the paradox to go through. That is, we cannot assert that there is a proposition that is both true and unknown in a way that would be a counterexample to the knowability principle.

  Dr. R: But that seems like a technical dodge. The intuitionist still has to explain what it means to say that a truth is not not known. It doesn't mean that it is known. So the anti-realist is still committed to the idea that there might be truths that are never known, but they cannot be pointed out as such? That seems to undermine the original motivation. The anti-realist started by saying that there can be no truths that are in principle unknowable. But now, because of the paradox, they are forced to admit that there might be truths that are never known, but they cannot be identified. But the original anti-realist thought was that truth is epistemically constrained. If a truth is never known, then how is it constrained by our cognitive capacities?

  Dr. A: The idea is that even if a particular truth is never known, it must be knowable. And in the intuitionistic framework, we can still maintain that every truth is knowable. The derivation only shows that we cannot consistently assume that there is a truth that is forever unknown. But we don't have to assume that. The anti-realist can hold that for every truth, it is possible to know it, without being able to point to any particular one and say "this one is unknown" because that would lead to contradiction. So the existential assumption is the problem.

  Dr. R: But the existential assumption is just the denial of omniscience. And we are not omniscient. So the anti-realist must deny that we are not omniscient? That is, they must assert that we are omniscient? But that's absurd.

  Dr. A: No, in intuitionistic logic, we cannot assert that we are omniscient (∀p (p → Kp)) because we don't have that from the derivation. We only have ¬∃p (p ∧ ¬Kp), which is not the same. And we cannot derive ∀p (p → Kp) from ¬∃p (p ∧ ¬Kp) without double negation elimination. So the anti-realist can consistently maintain both the knowability principle and that we are not omniscient? Wait, that doesn't sound right.

  Dr. A: Let me be clear. From the knowability principle and the assumption of non-omniscience (∃p (p ∧ ¬Kp)), we derived a contradiction. So in intuitionistic logic, we can conclude that the assumption of non-omniscience is false: ¬∃p (p ∧ ¬Kp). But that is not the same as asserting that we are omniscient. It is only the negation of the existential claim. The anti-realist can then say: we have shown that it is contradictory to assert that there is an unknown truth. But that doesn't mean we have to assert that every truth is known. We just cannot assert that there is one that is unknown. And since we are not in a position to assert that every truth is known (because we are not omniscient), we are in a state where we cannot make either claim? But that seems unstable.

  Dr. R: And it also seems to violate the spirit of anti-realism. The anti-realist wants to say that truth is tied to knowability. But if there might be truths that are never known, then how is that tie maintained? And if we cannot even say that there are unknown truths, then we are forced into a kind of agnosticism that doesn't reflect our actual epistemic situation. We know that there are unknown truths. For example, the number of hairs on my head right now is some particular number, and I doubt anyone knows it. But that seems like a straightforward truth.

  Dr. A: But the anti-realist might challenge whether that is a genuine truth. Or perhaps, in the intuitionistic framework, we don't have the same conception of truth. The anti-realist might say that truth is not a matter of correspondence but of verification. So the proposition about the number of hairs is only true if we can verify it. And we can verify it, in principle, by counting. So it is knowable.

  Dr. R: But then why the need for the intuitionistic logic? If every truth is knowable, then the proposition about the hairs is knowable. And we are not claiming that it is unknown. We are just noting that currently it is unknown. But the knowability principle doesn't require that every truth is known, only that it is knowable. The problem in Fitch's paradox is that the conjunction "q and nobody knows q" seems to be both knowable (by the principle) and unknowable (by the argument). But in the intuitionistic setting, we avoid the conclusion that every truth is known, but we still have to deal with the fact that the knowability principle applied to that conjunction leads to a contradiction. So we have to deny that there is such a conjunction. But that means denying non-omniscience? Or rather, we cannot assert non-omniscience without contradiction.

  Dr. A: Actually, in the derivation, we start with non-omniscience and derive a contradiction. So we must reject non-omniscience. But in intuitionistic logic, rejecting non-omniscience (i.e., asserting ¬∃p (p ∧ ¬Kp)) does not mean we assert omniscience. So we are not committed to omniscience. But we are committed to the claim that there are no unknown truths. And that seems to be just as bad.

  Dr. R: Exactly. So the intuitionistic route doesn't seem to save anti-realism. It only changes the logic of negation, but the core problem remains: the anti-realist must deny that there are unknown truths, which is counterintuitive.

  Dr. A: Then perhaps we need to go back to the restriction strategy. But I see your point about it being ad hoc. Maybe we can motivate the restriction independently. For example, the knowledge predicate is vague or context-sensitive, and so propositions that embed it are not suitable for universal quantification in the knowability principle.

  Dr. R: But that seems weak. And it would undermine a lot of epistemic reasoning. I think the problem runs deeper. The paradox shows that the anti-realist cannot simultaneously hold that every truth is knowable and that there are unknown truths. But both seem compelling. So maybe anti-realism is untenable.

  Dr. A: I'm not ready to concede that. There are other proposals. For example, we can interpret the possibility in the knowability principle as actualizability by some possible knower, but then note that in the case of the unknown truth, if someone were to know it, then it wouldn't be unknown anymore, so the proposition itself would change. But that seems to confuse the proposition with the state of affairs.

  Dr. R: And it also seems to give up on the idea that the same proposition is knowable. The proposition "q and nobody knows q" is a specific proposition. If we come to know q, then the second conjunct becomes false, so the whole conjunction becomes false. But that doesn't make it knowable; it just makes it false when we try to know it. So it is unknowable because it cannot be known without becoming false. And that is exactly what the derivation shows.

  Dr. A: So we are back to square one. Perhaps we should conclude that the knowability principle must be given up. But that would be a major blow to anti-realism.

  Dr. R: Or perhaps we can weaken it. For example, we can say that every truth is such that it is possible to know that it is true, but without requiring that the knowing subject is the same across possibilities. But I don't see how that helps.

  Dr. A: I think we've reached a point where we need to reflect more. The dialogue has shown that both ways out have their challenges. The restriction strategy seems ad hoc and may give up too much, and the intuitionistic logic route doesn't fully resolve the tension. So perhaps the next step is to explore the literature more deeply, looking for a way to motivate one of these moves independently.

  Dr. R: Agreed. But I must say, this paradox is a tough nut to crack. It's a credit to Fitch that it remains so puzzling after all these years.

  Dr. A: Indeed. Well, I have another student coming soon. Let's continue this discussion in the seminar.

  (End of dialogue)
answer: |-
  ### Dialogue: The Knowability Paradox in the Wild

  **Setting:** Office hours. The whiteboard displays the completed derivation of Fitch's paradox. Dr. Aris Thot (anti-realist) has just finished reconstructing it for a student who left moments ago. Dr. Rhys Stone (realist) enters, glancing at the board.

  **Characters:**  
  - **Dr. Aris Thot (A):** Anti-realist, committed to the knowability principle but troubled by the paradox.  
  - **Dr. Rhys Stone (R):** Realist, skeptical of anti-realism, rigorous but fair.  

  ---

  **R:** *(Peering at the board)* Ah, Fitch’s paradox. Always a crowd-pleaser. So, you’ve derived omniscience from "truth is knowable" and "we’re ignorant"? Hardly a surprise—it’s a reductio against anti-realism.  

  **A:** Not so fast, Rhys. The knowability principle is non-negotiable for anti-realism. It captures the core idea: truth isn’t recognition-transcendent. The paradox must be blocking a misstep. I’ve got two ways to rescue a substantive version of the thesis.  

  **R:** *(Sitting)* Let’s hear them. But I’ll warn you: if the fixes feel like ad hoc surgery, I’ll object. Anti-realism should bleed if it’s wounded.  

  **A:** Fair. First fix: **restrict the scope**. The knowability principle applies only to *basic* propositions—those without epistemic operators. The culprit here is the self-referential "p ∧ ¬Kp". It’s a higher-order claim about knowledge itself, not the world. Anti-realism concerns the *world’s* dependence on our cognitive capacities, not this sort of epistemic recursion.  

  **R:** *(Leaning forward)* Convenient. Why exempt epistemic propositions? If truth is tied to knowability, shouldn’t *all* truths—including those about knowledge—be knowable? Your "basic" restriction feels tailor-made to dodge Fitch.  

  **A:** Not at all! There’s independent motivation. Consider Moorean propositions like "It’s raining but I don’t believe it." We already know they’re unknowable *on logical grounds*—asserting them creates a pragmatic contradiction. Similarly, "p ∧ ¬Kp" is pathological because *stating* it would require knowing the unknowable conjunct. This isn’t about the world’s independence; it’s about the logic of assertion.  

  **R:** But Moore’s paradox involves *belief*, not knowledge. Knowledge is factive—no pragmatic contradiction in *stating* "p ∧ ¬Kp". You’re conflating norms. Besides, if I grant your restriction, what survives of anti-realism? Can there be unknowable truths about *knowledge*? Say, "There exists an unknown truth"—which your principle no longer covers. That sounds like realism creeping in.  

  **A:** Not at all. The core remains: every *worldly* truth—"The star collapsed," "Goldbach’s Conjecture holds," etc.—is knowable. Epistemic truths are meta-level; they’re about our relation to worldly truths. We can know *those* too, but via a different mechanism—like inferring ignorance from failed inquiries.  

  **R:** But "p ∧ ¬Kp" *is* worldly! If p is "there’s a fossil here," the conjunction describes a state of the world *including* our ignorance. If anti-realism can’t handle such cases, it’s retreating to a fragment of truth. And what motivates the "no epistemic operators" rule *besides* Fitch?  

  **A:** The liar paradox! Self-reference often requires restriction. We don’t apply truth predicates unrestrictedly because of Tarski. Here, knowledge predicates cause similar issues.  

  **R:** Weak analogy. The liar’s self-reference is direct; "q ∧ ¬Kq" isn’t about *itself*. It’s just a conjunction. If you’re right, why isn’t "Kp" knowable? If p is knowable, why not its being known? Your fix feels unstable.  

  **A:** Fine. Second fix: **reject classical logic**. Anti-realists often favor intuitionistic logic, where negation behaves differently. In the derivation, we use double negation elimination to get from ¬¬Kp to Kp. But intuitionists reject that. So, from the contradiction, we only conclude ¬∃p(p ∧ ¬Kp)—"there are no unknown truths"—which isn’t equivalent to ∀p(p → Kp), "all truths are known."  

  **R:** *(Smiling)* Clever. But does it help? ¬∃p(p ∧ ¬Kp) still denies the existence of unknown truths. That’s just omniscience in intuitionistic clothing!  

  **A:** No! ¬∃p(p ∧ ¬Kp) is ∀p¬(p ∧ ¬Kp), which intuitionistically is ∀p(p → ¬¬Kp). This means "No truth is such that we *can’t* know it"—which is just knowability! ¬¬Kp says it’s not impossible to know p, not that it’s actually known. The paradox vanishes.  

  **R:** But ¬¬Kp is still weaker than Kp. So anti-realism survives as: "Every truth is such that it’s not impossible to know it." But that’s vacuous! It doesn’t rule out truths forever unknown—just not *necessarily* unknown. And your original knowability principle was stronger: ◊Kp, *possible* knowledge.  

  **A:** ◊Kp *is* ¬¬Kp in many modal interpretations! Intuitionism captures the constructive spirit: truth requires the *availability* of verification, not its occurrence.  

  **R:** But then you’ve conceded ground. Previously, knowability meant a scenario where someone *actually* knows p. Now it’s "not impossible to know p"—which could be true even if no one ever knows p. That’s a major retreat. And is it honest? When you say "truth is knowable," do you mean ◊Kp or ¬¬Kp? The latter feels like a technical fix.  

  **A:** It’s principled! Intuitionism aligns with anti-realism’s epistemology: truth isn’t "out there" waiting; it’s constituted by verification. So double negation elimination—which assumes a stable, recognition-independent truth—is question-begging.  

  **R:** But Fitch’s proof doesn’t need double negation until the final step. The contradiction in ◊K(p ∧ ¬Kp) is intuitionistic too: K(p ∧ ¬Kp) entails Kp and ¬Kp. So ◊K(p ∧ ¬Kp) is still absurd. Thus, by intuitionistic reductio, ¬∃p(p ∧ ¬Kp) holds. Now, if ¬∃p(p ∧ ¬Kp) is true, but ∀p(p → Kp) isn’t assertible, what *is* the status of "unknown truths"? Can I say, "Maybe my lost keys’ location is unknown"?  

  **A:** You can *deny* that it’s *impossible* for them to be known. But asserting "They’re unknown" (i.e., ∃p(p ∧ ¬Kp)) is now provably false. So you can’t claim ignorance of specific truths—which *is* counterintuitive.  

  **R:** Exactly. So anti-realism, even intuitionistic, forbids us from stating a plain fact: we’re not omniscient. That’s a cost. And it doesn’t feel like a "natural" fix—it’s deploying intuitionism precisely where Fitch bites. Why adopt it *here*, if not for the paradox?  

  **A:** Because anti-realism *grounds* logic in epistemology. Classical logic presumes bivalence, which presumes recognition-transcendence. Rejecting that isn’t ad hoc; it’s core to the view.  

  **R:** Then your two fixes converge: both limit anti-realism’s scope. The first restricts the *propositions* covered; the second restricts the *logic* used. Both surrender the idea that *all* truths—including about our ignorance—are knowable. The "animating thought" is wounded.  

  **A:** But not dead! We save knowability for worldly truths. That’s the heart: no reality beyond cognitive reach.  

  **R:** At the price of making our ignorance ineffable? If I can’t say, "There are unknown truths," realism wins by default. Your fixes might work formally, but they sacrifice the position’s spirit. Perhaps anti-realism is weaker than you thought.  

  **A:** Or perhaps we need a third way—like dynamic semantics or belief revision. But today? I admit, neither fix is perfect. The restriction strategy risks being under-motivated, and intuitionism softens knowability to a ghost of itself.  

  **R:** And I’ll admit Fitch doesn’t *refute* anti-realism—it just forces it into uncomfortable shapes. Still, it’s progress: we’ve shown the dispute isn’t about "technical tricks," but about what truth *is*. If it’s epistemically constrained, Fitch exposes a tension with our finitude.  

  **A:** Agreed. The dialogue continues. Coffee?  

  **R:** *(Stands)* Only if you admit my coffee order is an unknown truth.  

  **A:** *(Wryly)* Restricted proposition. No epistemic operators.  

  **R:** Touché.  

  ---

  **End.**  

  **Notes for Pedagogical Use:**  
  - **Key Moves:** The dialogue showcases two distinct anti-realist strategies (propositional restriction and logic revision) and a realist pressing on independent motivation and costs.  
  - **Balance:** Neither "wins." The anti-realist’s fixes are substantive but incur losses; the realist’s critiques expose tensions without dismissing anti-realism.  
  - **Open End:** Reflects the literature’s unresolved nature—e.g., restriction aligns with Dorothy Edgington; intuitionism with Timothy Williamson.  
  - **Naturalized Dispute:** By focusing on *why* each fix might be principled (liar parallels, intuitionistic epistemology), it avoids "technical maneuver" caricatures.  
  - **Recommendation:** Pair with short readings (e.g., Edgington’s "The Paradox of Knowability" for restriction; Williamson’s "On the Paradox of Knowability" for logic).
