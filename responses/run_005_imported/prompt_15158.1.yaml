answer: |-
  Here’s a toast that threads the needle—honest about the tension, grounded in real philosophy (without jargon), warm, and funny. It clocks in around 4 minutes and includes a laugh trigger:

  **(Clink glass gently)**  
  "Alright, everyone! For those who don’t know me, I’m [Your Name], and I’ve had the privilege of knowing Priya since [brief shared context—e.g., 'college days'/'that ill-fated group hike']. Now, full disclosure: when Priya asked me to speak, I panicked. Because let’s be real—half this room met Priya and Arjun at EA meetups, philosophy conferences, or deep in the comment sections of forums most aunts and uncles thankfully avoid. *(Light laugh)*  

  And look, I know what some of you are thinking: *$30k? Fancy dresses? A cake shaped like Pascal’s Mugging?* Couldn’t they just elope and donate the difference to the Against Malaria Foundation? Isn’t that the *truly* impartial, scope-sensitive thing to do? *(Nod knowingly at the EA/philosophy contingent; a few chuckles)*  

  To Priya’s wonderful aunts and uncles who just heard the word ‘utilitarianism’ for the first time and are wondering if it’s contagious—don’t worry. It basically just means these two care *a lot* about making the world better. And they do. Deeply, effectively, and sometimes obsessively. *(Warm laugh, especially from family)*  

  **But here’s why this wedding isn’t a betrayal of that.**  

  Priya and Arjun understand something profound: that saving the world isn’t a solo sprint. It’s a relay race run over a lifetime. And to run it well—to *sustain* the work of doing good—you don’t just need calories and calculators. You need **joy**. You need **anchor points**. You need people who refill your cup when the world keeps draining it.  

  Think about it: If you burn out chasing the *theoretically* optimal donation target, you help *no one* long-term. Loving one person fiercely—building a partnership like this—isn’t a distraction from impartial morality. **It’s the engine that makes sustained, clear-eyed, impactful goodness possible.** It’s what lets you show up, decade after decade, not as a hollowed-out martyr, but as a whole, resilient human who *still* has compassion left to give.  

  Philosophers like Peter Railton get this. He talks about the ‘sophisticated consequentialist’—someone who knows that sometimes, the *best* way to serve the greater good is… to not be calculating it every single second. To invest in the relationships and commitments that make you a better, stronger, *more enduring* force for good. That’s not dodging the hard questions; it’s answering them wisely over the *long arc* of a life.  

  And Samuel Scheffler reminds us we’re not just abstract vessels for universal good. We’re *particular* people, shaped by bonds. We have what he calls ‘agent-centered prerogatives’—the reasonable permission to give special weight to the projects and people that give our own lives meaning… because that meaning fuels our capacity to care *at all*.  

  **Which brings us to Priya and Arjun.** Their love isn’t a withdrawal from the world’s needs. It’s **infrastructure**. It’s the deep foundation that lets them face suffering and complexity without despair. It’s the safe harbor that lets them venture further out. It’s the private joy that makes their public generosity *sustainable*.  

  So yes, they *could* have eloped and sent a check. But instead, they’re doing something radical: they’re investing in a visible, joyful declaration of their commitment. They’re strengthening the very thing that will empower them—and inspire the rest of us—to keep showing up for a world that desperately needs clear thinkers with full hearts.  

  **So let’s raise a glass:**  
  To Priya and Arjun—proof that loving one person deeply isn’t a compromise of your values. It’s how you build the strength to live them. May your marriage be a constant source of replenishment, a fortress against cynicism, and a reminder that the fight for a better world is fueled, above all, by stubborn, specific, irrational, beautiful love. Cheers!"  

  **Why this works:**  
  1.  **Acknowledges the Tension Directly:** Names the "elephant in the room" ($30k vs. AMF) upfront and humorously.  
  2.  **Uses Accessible Philosophy:** Explains Railton ("sustained impact over burnout") and Scheffler ("prerogatives for meaning") *in plain English* without naming them. EAs will recognize the concepts; family understands the sentiment.  
  3.  **Genuine Laugh Triggers:**  
      *   The "Pascal's Mugging cake" joke (EA crowd).  
      *   "Utilitarianism... is it contagious?" (Family + breaks tension).  
      *   "Fancy dresses... cake..." (Gentle ribbing).  
  4.  **Warm & Unifying Core:** Centers on the couple's *love as fuel* for their values, not opposed to them. Appeals to both sides' desire for Priya/Arjun to be happy *and* impactful.  
  5.  **Strong Finish:** Connects their personal joy directly to their capacity for public good.  
  6.  **Tone:** Respectful of EA principles while celebrating love. Avoids mockery ("cheap joke") and falsehoods ("doesn't apply to personal life").  

  **Delivery Tip:** Smile warmly, make eye contact with both sections of the audience during their respective laugh lines, and land the final lines with sincerity. Good luck!
