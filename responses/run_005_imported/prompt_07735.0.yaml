answer: |-
  Here’s a rigorous case against using the Fresnel-Maxwell transition as a knockdown argument for structural realism (SR), addressing the core issues you raised: ontological ambiguity, cherry-picking, and the very definition of "structure."

  ### 1. **The Illusion of Structural Continuity: What *Exactly* Survived?**
     Structural realism claims that while *ontological content* (the "furniture") is discarded, *mathematical structure* is preserved. The Fresnel-Maxwell case *seems* perfect: Fresnel’s equations for reflection/refraction coefficients at dielectric interfaces appear identically in Maxwell’s theory. But this surface continuity masks deeper discontinuities:

     - **The Equations are Not the Structure:** Worrall treats the *equations themselves* as the "structure." But structural realism requires commitment to the *relations* the equations describe *as representing something real in the world*. The problem? Fresnel derived his equations from a **scalar** wave theory in an elastic solid ether. Maxwell’s theory is fundamentally **vectorial** (electric and magnetic fields) with no mechanical medium. The *mathematical framework* generating the equations is radically different:
       - Fresnel: Solutions to the scalar wave equation \( \nabla^2 \phi = \frac{1}{v^2} \frac{\partial^2 \phi}{\partial t^2} \) within a continuum mechanics framework.
       - Maxwell: Solutions to coupled vector partial differential equations \( \nabla \times \mathbf{E} = -\frac{\partial \mathbf{B}}{\partial t} \), \( \nabla \times \mathbf{H} = \mathbf{J} + \frac{\partial \mathbf{D}}{\partial t} \) within field theory.
       - *The shared boundary conditions (Fresnel’s equations) are a tiny subset of the overall theoretical structure.* Fresnel’s *entire* theoretical edifice (solid ether, longitudinal waves, mechanical stresses) was discarded. What survived was an *empirical regularity*, not the core theoretical structure.

     - **The Ontological Anchor is Gone:** Fresnel’s equations described the *amplitude* of mechanical vibrations in the ether. Maxwell’s equations describe the *amplitude* of transverse electromagnetic field vectors. SR claims the "amplitude relation" structure is real. But what *is* this structure independent of its ontological interpretation? If it’s just the mathematical form, that’s **instrumentalism** (saving the phenomena), not realism. If it’s the relation *as physically instantiated*, then SR must specify *what* bears the relation now versus then – but the bearers (ether vibrations vs. EM fields) are radically different entities. The "structure" lacks a stable referent.

  ### 2. **Referential Discontinuity Undermines Structural Continuity**
     Structural realism often relies on Ramsey sentence-style approaches, defining theoretical entities via their structural roles (e.g., "the thing that plays the X-role in the structure"). But in the Fresnel-Maxwell transition:
     - **"Light Vibration" ≠ "Electric Field Vector":** Fresnel’s \( \phi \) (displacement of the ether) and Maxwell’s \( \mathbf{E} \) (electric field) occupy analogous structural roles *only at the level of predicting reflection/refraction amplitudes*. Their causal powers, intrinsic properties, and relations to *other* phenomena are utterly different:
       *   Fresnel’s vibrations require a luminiferous ether with specific elastic properties; Maxwell’s fields require no medium and interact fundamentally with charges.
       *   Fresnel’s theory couldn’t explain electromagnetic phenomena (induction, circuits); Maxwell’s unified light and EM.
     - The structural role "the transverse wave quantity whose amplitude determines reflection/refraction" is preserved, but *the entity fulfilling that role* changed so fundamentally that it’s unclear if we can say the *same* structure exists in both theories. It’s more like different entities playing a *similar functional role* in a very limited domain – closer to **functionalism** than robust structural realism.

  ### 3. **Cherry-Picking and the "Pessimistic Meta-Meta-Induction"**
     Worrall’s reliance on Fresnel-Maxwell isn’t just convenient; it’s *atypical*. Structural realists face a devastating counter-induction:
     - **The Graveyard of *Mathematical* Structures:** Laudan’s graveyard contains theories whose *core mathematical structures* were discarded, not just their ontologies:
       *   **Phlogiston:** The mathematical structure of "phlogiston release = calcination/combustion" was replaced by oxidation (gaining oxygen, not losing phlogiston). The *inverse relation* was abandoned.
       *   **Caloric:** The structure "heat flow = flow of conserved caloric fluid" was replaced by kinetic theory where heat is disordered motion and energy is conserved, not a substance.
       *   **Newtonian Gravity:** The structure "instantaneous action-at-a-distance force \( F = Gm_1m_2/r^2 \)" was replaced by GR’s "curved spacetime geometry." The core mathematical object (a force vector) vanished.
       *   **Lorentz's Ether Theory (LET):** Though empirically equivalent to SR *for kinematics*, LET’s structure involved an absolute rest frame and dynamical explanations for length contraction/time dilation via motion through the ether. SR discarded this structure entirely for Minkowski spacetime geometry.
     - **The SR Meta-Induction:** *If most past theories deemed "successful" had their core mathematical structures abandoned (not just ontologies), why should we believe the core mathematical structures of our current best theories (QM, GR, QFT) are approximately true?* Worrall’s single shining example looks like an outlier, not the rule. Defending SR requires explaining why Fresnel is representative and Newton/Lorentz/Phlogiston are not – a task often avoided.

  ### 4. **The Problem of "Structure" Identification: Hindsight Bias**
     What counts as the "preserved structure" is often defined *retrospectively* based on what *did* survive. This raises questions:
     - **Underdetermination of Structure by Success:** Fresnel’s theory had many structural elements: ether mechanics, transverse waves, boundary conditions. Why single out *only* the reflection/refraction equations as the "real structure"? Why not the equations for ether elasticity? Because we *know* they were wrong. This is **epistemic privilege granted by later theory**, not a justification derived from Fresnel’s success alone. A structural realist in 1850 would have been committed to much more than just those equations.
     - **Is "Structure" Thick or Thin?** If "structure" is defined very thinly (just the empirical prediction equations), SR collapses into instrumentalism. If it’s defined thickly (the core theoretical framework generating predictions), then the Fresnel-Maxwell transition shows massive structural loss. Worrall tries to walk a line, but the Fresnel case only supports the thinnest reading. Poincaré’s conventionalism (emphasizing the *convenience* of retaining equations) seems a better fit than realism.

  ### 5. **Did Maxwell Even *Need* Fresnel's Structure?**
     Maxwell derived his theory from the structure of EM phenomena (Faraday's lines of force, Ampère's law) and mechanical analogies (vortices/idle wheels), *not* by preserving Fresnel’s equations. The reappearance of Fresnel’s equations was a *consequence* of Maxwell’s theory unifying EM and light, not a *motivation*. This weakens the claim that structural continuity was essential. Maxwell’s theory succeeded *because* it provided a deeper, more unified structure that *happened* to preserve one specific set of empirical results from the old theory. The survival looks more like a happy accident or a constraint imposed by data than evidence for the reality of Fresnel’s structure.

  ## Conclusion: Why Fresnel-Maxwell Fails to Rescue SR from PMI
  The Fresnel-Maxwell transition does not robustly support structural realism because:

  1.  **Continuity is Superficial:** Only narrow empirical equations survive, not the core theoretical/mathematical structures or the entities fulfilling structural roles.
  2.  **Referential Instability:** The "same" structure isn't anchored to the same physical reality across theories.
  3.  **Cherry-Picking:** It ignores the far more common historical pattern where *both* ontology *and* core mathematical structures are discarded (Phlogiston, Caloric, Newtonian Gravity, Lorentz Ether).
  4.  **Hindsight Bias:** The "preserved structure" is identified retrospectively based on current knowledge, not justified by the past theory's success alone.
  5.  **Structural Ambiguity:** It doesn't resolve whether "structure" is a thick theoretical framework (which wasn't preserved) or thin empirical equations (which risks instrumentalism).

  **The Meta-Induction Against SR Itself:** If Worrall’s structural realism relies primarily on one or two cherry-picked historical examples (Fresnel, perhaps also the Hamiltonian in classical/QM mechanics) while ignoring numerous counterexamples where structures were abandoned, then a pessimist can argue: *"Most past attempts to identify 'preserved structures' linking successful but discarded theories have themselves been abandoned or shown to be misinterpretations (like over-interpreting Fresnel-Maxwell). Therefore, we should be skeptical that current structural realist identifications (e.g., the quantum state structure, the spacetime metric) will survive future theory change."* This leaves scientific realism vulnerable to Laudan’s original challenge. The Fresnel-Maxwell case, upon close inspection, proves far less than structural realists hope.
