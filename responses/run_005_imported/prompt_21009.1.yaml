answer: |-
  Here is a rigorous brief challenging Chalmers's asymmetry between phenomenal and non-phenomenal concepts, grounded in Stalnakerian metasemantics and the mechanics of primary intension fixation:

  ### Core Argument Against Asymmetry: Metasemantics of Reference-Fixing
  Chalmers's claim that primary and secondary intensions *necessarily coincide* for phenomenal concepts relies on an untenable metasemantic assumption: that the reference of a phenomenal concept like "this feeling" (Q) is fixed *exhaustively and directly* by the intrinsic qualitative character itself, independent of any contingent contextual or functional facts. The Stalnakerian critique argues that **all concepts—including phenomenal ones—derive their reference from contextually contingent facts about their causal-functional role or descriptive anchor within a world.**

  #### Step 1: How Primary Intensions Are Fixed (The Standard Account)
  Primary intensions are determined by **conceptual roles or reference-fixing descriptions** associated with a term. For "water," this might be:  
  *"the clear, drinkable liquid filling oceans and lakes."*  
  Evaluating this primary intension at a world W asks: *What satisfies this description in W?*  
  - At W1 (our world): H₂O satisfies it → ref = H₂O.  
  - At W2 (Twin Earth): XYZ satisfies it → ref = XYZ.  
  → Primary intension varies with world considered as actual.  

  Chalmers argues that for "Q" (e.g., "what it's like to see red"), the reference-fixing is direct:  
  *"Q = THIS qualitative state (presented introspectively)."*  
  Thus, he claims, in *any* world considered as actual, "Q" picks out that very qualitative character.  

  #### Step 2: The Stalnakerian Challenge to Phenomenal Reference-Fixing
  The type-B materialist denies Chalmers's metasemantic premise. They argue:  
  - **Phenomenal concepts *also* rely on contingent reference-fixing mechanisms:**  
    Even if "Q" *feels* directly referential, its reference is fixed by:  
    (a) **Functional/causal role:** E.g., "the state *typically caused by red objects* in normal observers," or  
    (b) **Introspective mode of presentation:** E.g., "the state *accessed via THIS specific introspective mechanism*."  
    → These mechanisms are contingent and context-dependent.  

  - **Primary intension divergence is metaphysically possible:**  
    Consider an epistemically possible scenario Wₚ:  
    - Wₚ has **identical physical/functional facts** to our world.  
    - But due to **metasemantic differences**, the introspective concept "Q" is causally hooked to **physical state P₁** (not P₂, its actual referent).  
    *Why is this epistemically possible?*  
    We lack a priori access to:  
    (i) Which physical state *actually* underlies introspective access to Q.  
    (ii) Whether the introspective mechanism itself has contingent properties affecting reference.  

  #### Step 3: Undermining the Asymmetry (Key Move)
  - **Water analogy holds:**  
    Just as "water" could refer to XYZ in a world where XYZ fits "the watery role," "Q" could refer to physical state P₁ in a world where P₁ fits "the introspectively accessed qualitative role."  
    - Primary intension of "Q": *"the state playing role R"* (e.g., "causing red-experience reports").  
    - Secondary intension: rigidly designates P₂ (the actual physical state).  
    → Primary intension picks out P₁ in Wₚ; secondary picks out P₂ in all worlds.  
    → **Coincidence is contingent, not necessary.**  

  - **Conceivability of reference-shift without zombies:**  
    We can conceive of a scenario where:  
    (1) All physical/functional facts are identical to actuality,  
    (2) But "Q" refers to a different physical state (P₁ ≠ P₂),  
    → *Without* postulating a "zombie world" (which Chalmers requires for anti-physicalism).  
    This is epistemically possible because **reference-fixing is not transparent to a priori analysis.**  

  ### Why Chalmers's Reply Fails
  Chalmers might insist phenomenal concepts are "direct" (not mediated by roles/descriptions). The rebuttal:  
  - **No privileged access to metasemantics:**  
    Our *sense* of directness doesn't entail actual metasemantic simplicity. Type-B materialists can argue this sense is an illusion of cognitive architecture (cf. Papineau's "phenomenal concepts strategy").  
  - **Neutral core vocabulary problem:**  
    To describe epistemically possible scenarios, we need a "neutral" vocabulary. But if this vocabulary includes *phenomenal primitives* (e.g., "Q"), the argument becomes circular. If it excludes them, we can't a priori rule out that "Q" refers to a physical/functional state.  

  ### Consequences for the 2D Argument
  - **A posteriori physicalism remains viable:**  
    Identity "Q = P₂" can be necessary a posteriori, *exactly* like "water = H₂O":  
    - Primary intension of "Q" picks out whatever plays role R in a world.  
    - Secondary intension rigidly designates P₂.  
    - We discover a posteriori that P₂ = the referent of "Q" in the actual world.  
  - **Zombie/intuition objections defanged:**  
    The conceivability of zombies relies on assuming primary/secondary intensions *must* coincide for Q. Rejecting this asymmetry dissolves the intuition's force. What we conceive is a **reference-shift scenario**, not a non-physical duplicate.  

  ### Rigorous Summary
  Chalmers's asymmetry fails because it assumes phenomenal concepts have a *sui generis*, context-invariant metasemantics. Once we recognize that reference-fixing for *all* concepts involves world-dependent contingencies (even for introspection), primary and secondary intensions *can* come apart for phenomenal concepts. This collapse of asymmetry allows type-B materialism to treat "Q = P₂" as a Kripkean a posteriori necessity, immune to the 2D argument. The burden shifts to Chalmers to show why phenomenal concepts *must* be metasemantically exceptional—a burden unmet in light of Stalnakerian reference-fixing.  

  **Key Citations for Seminar:**  
  - Stalnaker, "What Might Nonconceptual Content Be?" (1998)  
  - Block & Stalnaker, "Conceptual Analysis, Dualism, and the Explanatory Gap" (1999)  
  - Papineau, "Phenomenal and Perceptual Concepts" (2002)  
  - Levin, "On the Vanilla Two-Dimensionalist's Dilemma" (2020)
