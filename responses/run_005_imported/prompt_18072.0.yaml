answer: |-
  ## The Triage Flood

  Dr. Aris Thorne didn't need a bomb. He had the overflowing St. Jude’s Mercy ER, a Category 3 hurricane howling outside, and a failing generator coughing like a dying smoker. Every triage decision felt like defusing an explosive device where the wires were tangled with endless, invisible threads of consequence. The narrow frame problem – *what stays the same?* – was a luxury he couldn’t afford. His torment was the broad frame problem: *what matters enough to think about right now?*

  Aris’s world was a cacophony of competing urgencies. Mrs. Gable in Bed 3 was crashing from septic shock. The teenager in Trauma 2 had a compound femur fracture bleeding heavily. The generator’s ominous sputter threatened to plunge them into darkness, killing ventilators and monitors. The rising floodwater in the sub-basement was already lapping at the electrical junction boxes. And the radio crackled with reports of a bus accident inbound – ten more criticals, maybe fifteen minutes out.

  He stood over the central triage desk, a flimsy island in the chaos. Nurse Cho thrust a chart at him. "New arrival, Dr. Thorne. Male, late 60s, pulled from a submerged car near the bridge. Unresponsive, hypothermic, weak pulse."

  Aris glanced at the gurney rolling in. The man was pale, waterlogged, lips blue. Standard drowning protocol: warming, airway, circulation. But his mind was already a whirlpool. *Drowning victim. Core temp critical. Needs rapid rewarming. Warm IV fluids. Blankets. Bair Hugger if the generator holds. Check for secondary injuries. Aspiration risk?*

  That was the surface. Then the implications, a relentless tide:

  *   **Use the portable warmer?** It’s fast, but battery-powered. Do we drain its limited charge now, risking no power for the inevitable hypothermic bus victims later?
  *   **Warm IV fluids?** How much? The saline bags were dwindling. Was this man salvageable enough to justify depleting resources others might need more? *How do you weigh one life against potential others?*
  *   **Assign Nurse Patel?** She was his best at line insertion under pressure. But Patel was currently stabilizing the septic Mrs. Gable. Pulling her might tip Mrs. Gable over the edge. *Consequence: Lose one patient trying to save another.*
  *   **Check for internal injuries?** The car was submerged. Impact trauma possible. An ultrasound? But the portable scanner was with Trauma 2’s femur fracture. Interrupting that procedure risked the teen bleeding out. *Consequence cascade: Delay fracture stabilization, leading to shock, leading to...*
  *   **The generator.** The sputtering intensified. If it died before they secured auxiliary power from the basement (a task requiring two orderlies currently carrying flood barriers), *all* warming efforts ceased. *Consequence: Systemic collapse.*
  *   **The bus.** Ten criticals. They needed space, personnel, resources freed up *now*. Did stabilizing this drowning man, likely with poor prognosis, impede that preparation? *Consequence: Delayed response, multiplied mortality.*

  Aris felt the familiar, icy grip of the frame problem’s true breadth. It wasn't just about knowing the drowned man’s temperature wouldn’t spontaneously rise on its own (the narrow persistence problem – solved long ago in medicine). It was the impossibility of bounding the *relevance* of every ripple emanating from each action. Assigning Patel *felt* relevant to the drowning man. But its *true* relevance lay in its impact on Mrs. Gable, the teen’s fracture, the generator effort, the bus arrival – a web too vast and interconnected to map in the seconds he had. Every choice drowned out awareness of a hundred other potential consequences, most irrelevant, some catastrophically vital.

  "Start passive rewarming! Blankets, dry him off!" Aris barked, a decision made by ignoring ninety percent of the implications. He couldn't spare Patel. He couldn't gamble the portable warmer's battery yet. Basic care. Buy time. Hope the generator held long enough for the bus to arrive and force a different calculus. He moved towards Mrs. Gable, his mind already discarding the drowning man's complex web to weave a new, equally intricate one around sepsis protocols and dwindling vasopressors.

  Later, soaked from helping shift sandbags near the sub-basement stairs (a consequence of the floodwater threat he *had* deemed relevant enough to act on), Aris returned to the drowned man. Nurse Cho looked grim. "Pulse weaker. Temp not rising. Pupils sluggish."

  Aris’s gut clenched. Had he chosen wrong? Should he have gambled the warmer? Drained the battery for a chance? But the bus was five minutes out, and the generator *had* held, just barely. If he’d used the warmer here, it might be dead now when the bus victims arrived hypothermic en masse. *Or*, a treacherous voice whispered, *this man might be stable if you had.*

  He ordered the portable warmer now, its whirring a small defiance against the encroaching entropy. As he prepped for an intubation attempt, a new detail surfaced: faint, livid bruising across the man’s lower abdomen, previously hidden by water and shadow. Possible internal bleeding. *Consequence: Warming could accelerate bleeding. Fluids could dilute clotting factors. Need a scan... which is still with the femur fracture...*

  Before he could process this, a crash echoed from the entrance. The bus victims had arrived early, a tide of moaning, bleeding humanity washing into the overflowing ER. Orderlies shouted for space. A monitor on Mrs. Gable shrieked an alarm – her pressure tanking again. The generator gave a final, shuddering gasp... and fell silent.

  Darkness plunged, punctuated only by emergency exit signs and the frantic beams of phone flashlights. Ventilators wheezed to a stop. Monitors flatlined. The whirring of the portable warmer on the drowned man ceased.

  In the sudden, chaotic gloom, Aris Thorne froze. The frame problem wasn't a puzzle to solve; it was the suffocating ocean itself. He had tried to bound relevance – prioritizing the generator, the bus, Mrs. Gable. He’d left the drowning man on minimal support, a calculation based on available data and predicted futures. But he’d failed to represent the *non-consequence*: the hidden bruise that rendered his warming strategy potentially lethal. He’d failed to bound the relevance of checking that abdomen thoroughly *immediately*, not later. And now, in the dark, the consequences of all the things he hadn’t had time to consider – the generator’s final vulnerability, the bus’s exact ETA, the hidden injury, the location of every backup flashlight – crashed over him.

  He heard Nurse Cho’s voice, tight with panic, near the drowned man: "No pulse! Starting compressions!"

  Aris didn't move. His flashlight beam swept the scene: the drowned man receiving futile compressions in the dark; Mrs. Gable’s still form; the teenager whimpering; the triage desk already swamped by the new arrivals, invisible in the gloom. The bus victims were here, untriaged, unseen, their needs a vast, dark unknown.

  Where did he go? Who did he touch first? Every possible action branched into a fractal explosion of unseen implications. Warming the drowned man earlier *might* have saved him, but cost the bus victims later. Checking the bruise *might* have changed treatment, but cost Mrs. Gable or delayed flood prep. Shoring up the generator harder *might* have prevented this darkness, but required pulling personnel from active care, costing lives now.

  The narrow frame problem – what persists? The darkness persisted. The cold persisted. The needs persisted. The broad frame problem – what is worth thinking about? – became an infinite, paralyzing question mark. There was no tractable way to bound relevance, no algorithm to filter the signal from the noise in this storm of competing urgencies and hidden variables. He had to act, to choose *something*, but every choice felt like drowning, pulled under by the weight of all the consequences he couldn’t see, couldn’t calculate, couldn't afford to ignore but absolutely must.

  He took a breath, the air thick with panic and damp. His flashlight beam, trembling slightly, settled on the closest shape – a child crying near the entrance, clutching a bleeding arm. A single point of light in the overwhelming dark. He moved towards her, step by heavy step. It was an action. It bounded nothing. It solved nothing. The cost of relevance, the cost of ignoring the infinite web, would be measured in lives he would never know he could have saved. The frame problem wasn't solved; it was endured, one terrible, bounded, blind choice at a time, while the floodwaters rose.
