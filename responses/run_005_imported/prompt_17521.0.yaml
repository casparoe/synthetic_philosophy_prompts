  - In the bounded case, the overall expectation of switching is zero, so there is no gain from switching.
  - In the unbounded case with infinite mean, expected value reasoning breaks down, so we cannot rely on it.

  Therefore, the paradox is resolved by understanding that the expected gain from switching is zero (in the symmetric case) and that apparent gains in conditional expectations (given X) are either an artifact of an invalid prior or of the use of expected value in a situation with infinite expectation.

