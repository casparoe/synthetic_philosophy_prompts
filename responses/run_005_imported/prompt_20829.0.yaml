answer: |-
  Here are 10 substantive interview questions targeting core tensions in epistocratic design, each with a follow-up anticipating likely counterarguments. They avoid restating foundational arguments and press hardest on structural, epistemic, and justice-based objections:

  1. **Question:** Your council's suspensive veto *delays* but doesn't *block* legislation without popular override. Given the well-documented phenomenon of voter fatigue and status quo bias, how do you prevent this mechanism from systematically favoring elite-preferred inertia over democratic responsiveness, even when the public's post-veto vote technically prevails?  
     *Follow-up (if she emphasizes voter override as sufficient safeguard):* If empirical studies show that complex legislation rarely gets revisited after initial defeat due to public attention decay, doesn't that functionally convert "suspensive" veto into near-permanent veto for contentious bills elites oppose?

  2. **Question (Demographic Objection):** You argue your competence exam is open and neutral. Yet decades of testing literature (e.g., SATs, civil service exams) show that even technically "neutral" metrics correlate strongly with race, class, and gender advantages. **If your exam's passing cohort statistically mirrored existing power demographics (e.g., 70% male, 80% white/upper-class), would you still consider the epistocratic council legitimate? If not, what failure threshold would trigger abandoning the model?**  
     *Follow-up (if she suggests mitigation via exam design/quotas):* Doesn't designing the exam to *avoid* disparate outcomes require baking in contested sociological judgments about fairness—effectively making the test a political instrument rather than a neutral measure of "competence"?

  3. **Question (Estlund's Proceduralist Dilemma):** David Estlund argues that defining "political competence" requires substantive value judgments about *what good decisions are*—judgments that are themselves politically contested. How can your exam avoid presupposing the answers to precisely the political questions (e.g., "What counts as societal well-being?") it's meant to adjudicate, thus privileging one partisan epistemology?  
     *Follow-up (if she distinguishes "procedural" from "substantive" competence):* If the exam tests only "neutral" skills (e.g., logic, data analysis), doesn't that ignore how real political judgment requires weighing *values* (equality vs. liberty, security vs. privacy)? Wouldn’t excluding value deliberation reduce politics to technocracy?

  4. **Question (Bias Amplification):** Bryan Caplan shows voters hold systematic biases (e.g., anti-market, anti-foreigner). Why assume your exam filters *out* bias rather than *certifying* it? If exam designers (likely current elites) share societal biases, wouldn’t the test reward applicants who mirror those biases under the guise of "competence"?  
     *Follow-up (if she proposes designer diversity/expert oversight):* Given confirmation bias and epistemic bubbles among experts, how could any small design panel be reliably immune to embedding their own blind spots? Isn't the wider electorate's *diversity* a better (if imperfect) bias-correction mechanism?

  5. **Question (Motivation & Incentives):** Epistocrats gain power via exam success, not voter approval. What institutional incentives ensure they deliberate for the common good rather than for status preservation, group interest, or deference to exam-granting institutions?  
     *Follow-up (if she cites deliberation norms/term limits):* Without accountability to the disenfranchised (most citizens), what prevents the council from becoming a self-referential guild optimizing for its own conception of "expertise," detached from lived experience?

  6. **Question (Epistemic Diversity):** Scott Page’s work demonstrates that diverse groups often outperform homogeneous "high-ability" groups in complex problem-solving. Doesn’t excluding non-certified citizens (possessing unique local knowledge, experiential insights, or cognitive diversity) risk creating an epistemically *impoverished* council?  
     *Follow-up (if she argues the exam captures relevant diversity):* Can any standardized test, focused on generalized competence, realistically capture the situated knowledge of a single mother, small farmer, or factory worker whose insights might reveal unintended policy consequences?

  7. **Question (Dynamic Knowledge Problem):** Political challenges evolve rapidly (e.g., pandemics, AI). An exam certifies *past* knowledge/skills. How does the system ensure the council's competence remains relevant? What mechanisms exist to remove members whose expertise becomes obsolete?  
     *Follow-up (if she proposes re-testing/continuing education):* Doesn't constant re-certification risk creating a council obsessed with testable metrics and credential maintenance rather than practical wisdom? How does this avoid "teaching to the test" in governance?

  8. **Question (Slippery Slope to Oligarchy):** Historically, limited franchises (e.g., property requirements) tended to expand, not contract. Why wouldn’t your epistocratic council, once empowered, use its veto to block reforms (e.g., campaign finance, education access) that might diversify future passing cohorts, thus entrenching itself?  
     *Follow-up (if she denies self-entrenchment risk):* If the council can veto electoral reforms affecting its own composition, doesn’t it hold a structural conflict of interest? Would you support an absolute ban on council vetoes over electoral/exam reform laws?

  9. **Question (Legitimacy Erosion):** Democratic legitimacy rests partly on equal agency ("we all have a say"). If a majority sees the council as an unelected overclass—especially if its vetoes override popular policies—doesn’t this risk catastrophic legitimacy decay, civil disobedience, or system collapse?  
     *Follow-up (if she argues outcomes justify legitimacy):* If the council repeatedly vetoes popular policies (e.g., rent control, wealth taxes) citing superior competence, and outcomes *later* validate the veto, does that *solve* the legitimacy problem if citizens still feel alienated? Can epistocracy survive without voluntary consent?

  10. **Question (Alternative Safeguards):** Instead of disenfranchisement, could we address voter ignorance/bias via less exclusionary means—e.g., mandatory deliberation forums, strengthened civic education, liquid democracy? Why is an exclusionary council *necessary* rather than just *efficient*?  
      *Follow-up (if she insists epistocracy is uniquely effective):* If effectiveness trumps procedural equality, why not embrace a more efficient but less democratic system (e.g., enlightened autocracy)? Where’s your principled line?

  **Key Design Logic:**  
  - **Follow-ups** target common epistocratic rebuttals (e.g., "design fixes," "outcomes justify," "procedural vs. substantive skill splits").  
  - **Questions 2, 3, and 4** directly address your requested objections (demographics, Estlund, Caplan).  
  - **Order** builds from institutional mechanics (Q1) to justice (Q2) to epistemology (Q3-4) to systemic risks (Q5-9), ending with alternatives (Q10).  
  - **Phrasing** forces engagement beyond thesis restatement by citing empirical realities (voter fatigue, bias studies), paradoxes (Estlund), and trade-offs (legitimacy vs. outcomes).  

  This approach ensures rigorous scrutiny while respecting the guest’s expertise—pushing her to defend the *hardest* implications of her institutional vision. Good luck with the episode!
