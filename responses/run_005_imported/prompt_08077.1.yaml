prompt: |-
  I write about science and ideas for a living, and next week I'm interviewing a decision theorist who's a committed defender of functional decision theory -- the view that in Parfit's hitchhiker you really should pay the driver once you're safe in town, because the agent whose rationality actually matters isn't "you, right now," but the decision function that got you predicted as trustworthy in the first place. Can you draft me 8-10 interview questions that don't just let him re-explain the setup? I want at least one question on what happens once the driver's an imperfect predictor (say, right 9 times out of 10) and whether "pay up" still holds, one that makes him spell out what it even means to say your choice "controls" a prediction the driver already made before you opened your mouth, and one that forces a comparison to Kavka's toxin puzzle -- if committing to pay is rational, why isn't committing to drink a toxin you'll have zero reason to actually drink later also rational? End with a question about what would actually count as evidence hes wrong. For each question throw in a quick follow-up keyed to whatever dodge he's most likely to reach for first.
reasoning: |-
  Okay, the user is a science and ideas writer preparing to interview a functional decision theory (FDT) proponent. They want deep, non-repetitive questions that avoid rehashing basics. Key requests:  
  Imperfect predictor scenario (9/10 accuracy)  
  Clarify "control" over past predictions  
  Comparison to Kavka's toxin puzzle  
  Evidence that could falsify FDT  

  First, I need to understand the core tension: FDT treats decisions as outputs of a timeless function, prioritizing consistency over causal outcomes. The user wants to pressure-test this.  

  For the imperfect predictor question, I'll focus on how error rates undermine FDT's "pay anyway" stance. Follow-up should challenge the retreat to idealized math.  

  On "control," I'll force confrontation with the temporal paradox. If the predictor already acted, how can current choices influence it? Follow-up must block the "function determines" dodge.  

  Kavka comparison is crucial—it exposes where FDT might collapse into absurdity. Why pay in Hitchhiker but not drink toxin? Follow-up should tackle the "no later reason" distinction.  

  Ending with falsifiability: I'll demand concrete, observable counterevidence. Follow-up preempts "no true Scotsman" moves.  

  User's tone suggests they want surgical questions that corner the theorist. I'll make each follow-up a scalpel.
answer: |-
  Here are 10 incisive interview questions targeting the deeper implications and vulnerabilities of Functional Decision Theory (FDT), specifically tailored to your needs, complete with likely dodges and sharp follow-ups:

  1.  **The Core Mechanism:** FDT argues we should act *as if* our current choice controls the prediction made earlier. But *ontologically*, how does choosing to pay *now* actually exert control over the driver's *past* prediction? Isn't this relying on a type of backward causation or acausal correlation that defies standard temporal logic?
      *   *Likely Dodge:* "It's not *causal* control; it's about being the output of the *same decision function* the predictor modeled."
      *   **Follow-Up:** If the driver modeled "your decision function" perfectly *but then died instantly after making the prediction*, rendering the prediction physically immutable before you act, does your choice *still* 'control' it? If not, why does the driver being alive (and able to observe) change the ontological status of the past prediction?

  2.  **Imperfect Predictor (9/10 Accuracy):** In Parfit's Hitchhiker with an imperfect predictor (correct 90% of the time), FDT still recommends paying if predicted to pay. But doesn't the 10% error rate fundamentally change the incentives? If you *don't* pay, there's a 10% chance you were *mis*predicted (and would have been stranded), meaning you gain $100 risk-free *some* of the time. Why isn't defecting *sometimes* the rational policy for the function itself?
      *   *Likely Dodge:* "The function should output the choice that maximizes expected utility *given it is being predicted*. Paying maximizes EU *conditional on being predicted accurately*."
      *   **Follow-Up:** Doesn't the error rate mean the predictor *isn't* perfectly tracking the function's output? So, why condition on perfect prediction when it's impossible? Shouldn't the function optimize for the *actual* predictive landscape (90% accuracy), which might involve a mixed strategy or even defection in some cases?

  3.  **Control vs. Rationalization:** When you pay, FDT says this "ratifies" the predictor's accurate modeling of your function. But isn't this functionally indistinguishable from *rationalizing* the prediction after the fact? How do you distinguish "controlling the past prediction" from simply *conforming* to it because it happened to be correct?
      *   *Likely Dodge:* "Conforming happens *because* the function is consistent. The predictor banked on that consistency. Acting otherwise would make the function inconsistent/unreliable."
      *   **Follow-Up:** If a different agent, with an *identical* decision function but facing a *different* (incompetent) predictor who just guessed randomly and got lucky, also pays, are they also "controlling" the prediction? Or are they just conforming? If the latter, how does FDT distinguish these scenarios operationally?

  4.  **Kavka's Toxin Puzzle:** FDT says paying in Hitchhiker is rational because it maintains the function's reliability. Kavka's Toxin Puzzle involves committing *now* to drink a non-lethal toxin *later* to win $1M, knowing that *when later comes*, you'll have zero reason to drink it (you already have the money). If FDT endorses commitment in Hitchhiker, why shouldn't it endorse committing to drink the toxin? Both seem to involve binding your future self to an action with no *local* reason, to satisfy a past commitment/expectation.
      *   *Likely Dodge:* "The toxin case lacks the *predictive feedback loop*. No one is *predicting* your future toxin drink based on your current commitment; the $1M is given *before* you'd need to act. There's no benefit to *being predicted* to drink."
      *   **Follow-Up:** But isn't the core FDT argument in Hitchhiker that *you* (as the function) need to be consistent *over time* to be reliable? If you commit to drink the toxin but then don't, haven't you demonstrated inconsistency, undermining your function's reliability for *any* future commitment/prediction scenario, just like defecting in Hitchhiker would? Why is the *external* predictor necessary for the consistency requirement?

  5.  **The "True Self" Problem:** FDT privileges the abstract "decision function" over the particular temporal agent ("you, right now"). Who or what defines this function? Is it innate, chosen, or discovered? If someone *feels* like "defecting now" *is* their authentic current preference, how does FDT justify overruling this local agent in favor of the abstract function?
      *   *Likely Dodge:* "Rationality is about the coherence of the *system* over time, not transient preferences. The 'true self' *is* the consistent function."
      *   **Follow-Up:** Doesn't this risk a "no true Scotsman" fallacy? If an agent defects, can you *always* say "Ah, that wasn't their *true* function, they were irrational/inconsistent"? How do you falsify the claim that an agent possesses a specific FDT-compliant function?

  6.  **Bootstrapping Reliability:** How does a decision function *acquire* a reputation for reliability (like "always pays debts") in the first place, according to FDT? Doesn't this require a history of paying debts *even when* there was no prior prediction depending on it? How does FDT explain the initial bootstrapping of a reliable function without circularity?
      *   *Likely Dodge:* "The function is defined by its counterfactual behavior: *if* it were in a prediction scenario, it *would* act reliably. This disposition can be inferred or assumed."
      *   **Follow-Up:** But how is this disposition *learned or evolved* without actual instances of paying when it was costly *without* a prior prediction ensuring it? Isn't FDT silent on the developmental or evolutionary origin of reliable functions, focusing only on their behavior once established?

  7.  **Cost of Commitment:** FDT demands significant commitment: paying $100 for literally nothing *now* (in Hitchhiker) to maintain the function. How high can this cost go before FDT becomes practically unreasonable? Is there *any* cost where defecting becomes rational for the function itself?
      *   *Likely Dodge:* "The cost is justified by the immense value of being predictable/trustworthy in future interactions. Losing that is catastrophic."
      *   **Follow-Up:** What if the cost is your life? Or the life of your child? Does FDT *still* demand paying the $100 (or equivalent) in Hitchhiker? If not, where is the line, and how is it defined within the formal theory?

  8.  **Multiple Selves & Splintering:** Does FDT apply cleanly to agents whose decision-making process might genuinely change over time (e.g., due to brain injury, profound experiences, or even planned commitments that alter preferences)? Is there still a single "function"? If not, how does FDT handle the potential for an agent's function to "splinter"?
      *   *Likely Dodge:* "FDT assumes a stable decision function over the relevant timeframe. Significant changes create a new agent/function."
      *   **Follow-Up:** Doesn't this make FDT vulnerable to precisely the temporal instability it seeks to overcome? If "you now" and "you later" can be different functions, how can any long-term commitment or prediction be stable? Isn't this functionally equivalent to admitting temporal agents *do* matter independently?

  9.  **FDT vs. Real-World Institutions:** In practice, we use contracts, laws, and reputation systems to enforce commitments, not reliance on abstract decision functions. Doesn't the necessity of these real-world mechanisms suggest that FDT's core solution (just "be the function") is insufficient or unrealistic for governing behavior, especially among non-FDT agents?
      *   *Likely Dodge:* "Institutions are needed *because* many agents aren't rational (FDT-compliant). FDT describes what *rational* agents should do."
      *   **Follow-Up:** But if FDT rational agents are so rare that robust institutions are still required even among sophisticated actors, doesn't that undermine FDT's claim to being the most effective *practical* decision theory? Is FDT primarily a normative theory with limited descriptive/prescriptive power in a messy world?

  10. **Falsifiability:** **What specific, observable phenomenon in a decision problem would constitute strong evidence against Functional Decision Theory?** If FDT can explain *any* rational choice (pay/defect) in *any* scenario (Hitchhiker, Toxin, Newcomb, etc.) as "that's what the function does," how can it be tested?
      *   *Likely Dodge:* "Evidence would be finding a scenario where the *mathematically optimal* decision (according to FDT's function-based EU calculation) consistently leads to worse *actual* outcomes for agents following FDT compared to another theory, in repeated interactions or simulations."
      *   **Follow-Up:** Couldn't an FDT defender *always* reinterpret a bad outcome as either (a) the agent wasn't *truly* following FDT, or (b) the predictor/model was flawed, not the theory? How do we design an experiment or scenario that definitively isolates the failure to FDT itself and not an implementation error?

  **Good luck with the interview!** These questions are designed to push beyond exposition and into the philosophical and practical tensions inherent in FDT. Remember to listen closely and anchor your follow-ups directly in their responses.
