answer: |-
  Your question cuts to the heart of a profound tension in quantum foundations. You're absolutely correct that the standard "textbook compromise" sacrifices realism (definite pre-measurement values) to preserve locality. However, philosophers (and increasingly, physicists) argue that **quantum mechanics *itself* exhibits a subtler, more fundamental form of nonlocality that persists even when realism is abandoned.** Here's what you might be missing:

  1.  **The Core Issue: Parameter Dependence vs. Outcome Dependence:**
      *   Bell's theorem analyzes constraints on correlations between distant measurements.
      *   Crucially, it distinguishes two types of independence:
          *   **Outcome Independence (OI):** The outcome *A* at Alice's location is statistically independent of the outcome *B* at Bob's location, given the complete state description (λ) and the settings (a, b). Mathematically: P(A|B, a, b, λ) = P(A|a, b, λ). *Violating this suggests direct causal influence between outcomes.*
          *   **Parameter Independence (PI):** The outcome *A* at Alice's location is statistically independent of Bob's *choice of measurement setting* (b), given the complete state description (λ) and Alice's setting (a). Mathematically: P(A|a, b, λ) = P(A|a, λ). *Violating this suggests the setting choice at one location instantly influences the outcome at the other.*
      *   **Relativity/Signaling Constraint:** Violating PI *allows* for instantaneous signaling if the underlying state λ and settings are controllable, which conflicts with relativity. Violating OI does not inherently allow signaling.

  2.  **Where QM Violates:**
      *   Quantum mechanics **violates Outcome Independence (OI)** but **preserves Parameter Independence (PI)**. This is why *superluminal signaling is impossible in standard QM*.
      *   However, the preservation of PI depends critically on the **no-signaling theorem**, which itself relies on the *linearity* and *unitariy* of QM evolution *before measurement*. The measurement process itself is where the nonlocality manifests.

  3.  **The Nonlocality Philosophers Highlight:**
      *   **Instantaneous State Update (Collapse):** In Copenhagen and similar interpretations invoking wavefunction collapse, when Alice measures her particle in an entangled pair (e.g., singlet state), the *entire* wavefunction collapses instantaneously. This collapse updates the *physical state* of Bob's particle, regardless of distance. Bob's particle's description changes *immediately* upon Alice's measurement, even though Bob hasn't measured yet and no signal has been sent. This update is nonlocal – the physical state at Bob's location is altered by an event spacelike separated from it.
      *   **Non-Separability (Holism):** Entangled states represent a *single*, *indivisible* physical state shared between the distant systems. You cannot assign separate, complete states to Alice's and Bob's particles independently. The system's properties are inherently relational and non-separable. This holism itself is seen by many as a form of nonlocality – the systems are not independent physical entities with their own local states.
      *   **The "Passion at a Distance":** As Tim Maudlin puts it, even without hidden variables, QM entails a "passion at a distance." While Bob cannot *detect* the change in his system's state until he measures (due to PI/no-signaling), the *physical facts* about what state his system is *in* change instantly due to Alice's action. The *ontic state* (the state of reality) at Bob's location depends nonlocally on events at Alice's location.

  4.  **Why Sacrificing Realism Doesn't Fully Solve It:**
      *   You sacrifice realism about *pre-existing definite values* for observables like spin. This avoids the contradiction Bell derived for *local realistic* theories.
      *   **However, you do *not* sacrifice realism about the *quantum state itself*.** In standard QM (including Copenhagen in its minimal form), the wavefunction/quantum state is taken as a complete description of the physical system. The collapse of this state upon measurement *is* a real, physical change occurring instantaneously across space. It's this *state evolution* that is nonlocal.
      *   Interpretations like Consistent Histories or Relational QM try to avoid this by denying the reality of the universal wavefunction or making the state observer-relative. However, these approaches have their own significant challenges and are not universally accepted.

  5.  **The Philosophers' Point (e.g., Tim Maudlin, David Albert, Travis Norsen):**
      *   They argue that **locality requires that the *physical state* of a system be determined solely by events in its immediate past light cone.** This is a stricter condition than just the impossibility of signaling.
      *   In QM, the physical state of Bob's particle (described by its reduced density matrix or the global wavefunction) *is* instantly altered by Alice's distant measurement choice and outcome. This alteration is a *fact* within the formalism, regardless of whether Bob ever measures or knows about it. This dependence violates the locality condition stated above.
      *   They contend that dismissing this as merely "non-realist" misses the point. The nonlocal *dependence* encoded in the wavefunction and its collapse is a fundamental feature of the dynamics of the *accepted physical state* (the wavefunction).

  **In Summary:**

  While sacrificing realism about pre-existing definite values resolves the contradiction Bell found for *local hidden variable* theories, it **does not eliminate the nonlocality inherent in the *dynamics* of the quantum state itself.**

  *   **Textbook View:** "Sacrifice realism, keep locality." (Locality meaning "no superluminal signaling/causation").
  *   **Philosophers' View:** Sacrificing realism avoids Bell's contradiction, but the *core dynamics* of QM – specifically the instantaneous, non-separable change in the physical state (wavefunction) upon measurement in entangled systems – constitutes a **genuine form of nonlocality**. This nonlocality is about the *instantaneous dependence of physical state* across space, not just about signaling or pre-existing values. They argue that locality, properly understood as the determination of local physical states solely by local causes within the light cone, is violated by QM itself.

  This subtle but crucial distinction explains why philosophers insist QM is nonlocal even without adopting Bohmian mechanics. The nonlocality is seen as baked into the standard formalism via entanglement and state collapse, making it an inescapable feature, not just an artifact of specific interpretations.
