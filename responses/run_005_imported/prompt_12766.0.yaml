   - The "plain-meaning-over-intent" is strong, but note that the plain meaning at the time of the founding was that these clauses protected slavery. So if we are being honest about plain meaning, it might not support the anti-slavery reading. However, Douglass and Spooner argued that the plain meaning of the text, without the subjective intent, did not actually establish slavery. So they were reinterpreting the plain meaning. This is a bit tricky. Still, as a method, it is persuasive.

