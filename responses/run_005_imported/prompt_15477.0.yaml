  ### **Justifications**

  **Move (1): Marcus (Anti-Substantivalist Opening)**  
  *Score: 2 (Clearly right)*  
  Marcus correctly articulates the hole argument's core challenge to manifold substantivalism. His characterization of the indeterminism as a *reductio*—where identical physical data outside the hole fail to determine point identities inside—is textbook and philosophically sound. The argument *does* decisively undermine the view that spacetime points possess primitive identities independent of metric structure. His inference to anti-substantivalism is a standard interpretation of the argument's moral.

  **Move (2): Elena (Sophisticated Substantivalism)**  
  *Score: 2 (Clearly right)*  
  Elena accurately identifies Leibniz equivalence (diffeomorphic models as representing the *same* physical reality) as a well-established escape route for substantivalists. This mirrors the physicist’s treatment of general covariance as a gauge symmetry (e.g., as in Wald 1984). Her distinction between "naive" and "sophisticated" substantivalism is legitimate: the latter grounds point identity in relational/metric roles without denying points exist as entities. This aligns with "structural substantivalism" (e.g., Stachel, Hoefer) and avoids indeterminism.

  **Move (3): Marcus (Collapse Charge)**  
  *Score: 1 (Defensible but incomplete/overstated)*  
  Marcus rightly questions whether sophisticated substantivalism retains substantive content. If point identity *wholly* depends on metrical roles, it risks dissolving into a mere relabeling of relational structure. However, his claim that it "costs everything that made it substantivalism" is hyperbolic. Sophisticated substantivalism *can* maintain that spacetime is a *substance* (a bearer of properties) even if individuated relationally—a nuance Marcus neglects. The charge of ad-hocness is weak here (Elena rebuts this effectively in move 4).

  **Move (4): Elena (Gauge Analogy & Relationalist Burden)**  
  *Score: 2 (Clearly right)*  
  Elena decisively refutes Marcus’s ad-hocness charge: treating diffeomorphisms as gauge symmetries is standard practice in GR (e.g., when ignoring coordinate differences). Her analogy to Yang-Mills symmetries is apt—physicists *do* treat gauge-equivalent configurations as physically identical. Crucially, she notes that relationalists face a *mirror problem*: they must explain when two relational configurations represent the "same" possibility (via counterpart relations or qualitative identity). Sophisticated substantivalism retains its distinctiveness by affirming spacetime as a *real, non-derivative entity* with metric properties, whereas relationalism reduces spacetime to relations among matter. Marcus’s "collapse" claim fails against this.

