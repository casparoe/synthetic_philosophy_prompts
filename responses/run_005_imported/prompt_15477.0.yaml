  - **Distinctness preserved**: Sophisticated substantivalism posits spacetime as a *fundamental substance* that *has* metric properties. Relationalism denies spacetime’s independent existence, reducing it to material relations. Individuating points via their metric roles doesn’t erase this ontological divide.  
  - **Relationalist’s burden**: Marcus assumes relationalism avoids identity problems, but Elena correctly notes that relationalists must define transworld identity for *configurations* (e.g., via qualitative equivalence). This undercuts Marcus’s implication that only substantivalism faces indeterminism.  

  **Conclusion**: Marcus and Elena were not entirely talking past each other, but Marcus’s move (3) oversimplifies the ontology. Elena’s move (4) demonstrates that sophisticated substantivalism remains distinct from relationalism while cohering with physical practice. The "collapse" charge does not survive her rebuttal.
