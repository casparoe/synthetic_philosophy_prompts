      "core_move": "Extends a 'no individuals' metaphysics to deny that spacetime points possess primitive identity, undermining the hole argument's setup.",
      "verdict": "Partially successful as it dissolves indeterminism by rejecting point-based haecceities, but least effective for substantivalism as it reduces points to non-fundamental 'thin' entities, verging on abandonment."
    },
    {
