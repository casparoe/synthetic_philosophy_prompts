answer: |-
  The cracked sidewalk mirrored Maya’s thoughts – fragmented, leading somewhere uncertain. Rain threatened, turning the air heavy. *Just turn back,* the causal voice whispered. *Cost: damp shoes, an hour lost. Benefit: mathematically zero. One vote in 300,000? You’d have better odds being struck by lightning while winning the lottery.* She adjusted her tote bag, the logic a familiar, cold weight.

  But another current pulled beneath it, murkier, stronger. *It’s not just about *this* ballot.* She paused at the corner, watching traffic blur past. *It’s about… being the kind of person who votes.* The thought felt woolly, unsophisticated. She tried to sharpen it. *If I stay home, what does that signal? To myself? To anyone who might, somehow, think like me?*

  A bus hissed to a stop, disgorging passengers. Maya saw Mrs. Henderson, her ancient, meticulous neighbor, clutching her "I Voted" sticker like a medal. *Evidence,* the murky voice insisted. *Mrs. Henderson votes. Always. Her action isn't isolated. It’s part of a pattern she embodies. My action isn't isolated either.*

  The polling place was just ahead, a converted church basement. The causal voice rallied: *Patterns are statistical aggregates. Your single action doesn't shift the pattern. Your staying home doesn’t make others stay home.* The logic was titanium. Unbreakable.

  But then she imagined the tally. Not the final number, but the *process*. Thousands of individual marks, like cells in a body. *My vote,* she thought, *isn’t just a potential tie-breaker. It’s a data point. A declaration.* A different calculation emerged, not of direct causality, but of alignment. *If everyone who calculates the infinitesimal odds… stays home… then only those who don’t calculate, or who calculate differently, remain.* The system tilts. Not because her vote *caused* it, but because it was *evidence* of a category – the calculator – withdrawing.

  *If I am the kind of person who believes voting matters enough to do it, even knowing the odds… then I am part of a cluster of people who might just make the odds less infinitesimal.* The thought felt recursive, almost dizzying. *My action is functionally linked to theirs, not causally, but… definitionally? By shared reasoning?*

  She pushed open the heavy door. Fluorescent lights hummed. The smell of old coffee and paper enveloped her. The causal voice spat its final argument: *Sentiment! Wasted effort!*

  Maya took the ballot. Its weight was slight, its potential consequence astronomical only in the realm of symbols, not physics. She saw the volunteer, tired but smiling. She saw the empty booths. *What if everyone like me… isn’t here?* The evidence of absence. The functional cost of shared inaction.

  She stepped into the booth. The pen felt solid. Her mark, when she made it, wasn’t a gamble on being the one-in-a-million decider. It was a commitment to being part of the million whose collective presence *was* the deciding factor. It was voting *as* the cluster, not *hoping* the cluster existed. The cost-benefit analysis dissolved, replaced by the quiet hum of aligning her action with the world she wanted to see reflected in the count. She folded the ballot, the sound crisp, final. The cost felt lighter now. The benefit, immeasurable.
