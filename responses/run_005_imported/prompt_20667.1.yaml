  To address your query, I'll construct a specific probability distribution for the smaller amount in the two envelopes where, no matter what amount you observe in your envelope, switching has a higher expected value than staying. The resolution of the basic paradox relies on rejecting a uniform prior over all amounts (which is impossible), but with a carefully chosen valid distribution, the switching advantage can reappear conditionally. We'll use a discrete distribution over powers of 2 for simplicity and compute the expected value of switching for several observed amounts.

  ### Step 1: Define the Probability Distribution
  Let the smaller amount in the envelopes be denoted by \(X\). The possible values for \(X\) are \(2^k\) for \(k = 0, 1, 2, \ldots\) (i.e., \(X \in \{1, 2, 4, 8, 16, \ldots\}\)). The probability mass function is:
  \[
  P(X = 2^k) = \frac{1}{3} \cdot \left(\frac{2}{3}\right)^k.
  \]
  - For \(k=0\): \(P(X=1) = \frac{1}{3} \cdot 1 = \frac{1}{3}\).
  - For \(k=1\): \(P(X=2) = \frac{1}{3} \cdot \frac{2}{3} = \frac{2}{9}\).
  - For \(k=2\): \(P(X=4) = \frac{1}{3} \cdot \left(\frac{2}{3}\right)^2 = \frac{4}{27}\).
  - For \(k=3\): \(P(X=8) = \frac{1}{3} \cdot \left(\frac{2}{3}\right)^3 = \frac{8}{81}\).
  - And so on.

  **Verification that probabilities sum to 1:**
  \[
  \sum_{k=0}^{\infty} P(X = 2^k) = \sum_{k=0}^{\infty} \frac{1}{3} \cdot \left(\frac{2}{3}\right)^k = \frac{1}{3} \sum_{k=0}^{\infty} \left(\frac{2}{3}\right)^k = \frac{1}{3} \cdot \frac{1}{1 - \frac{2}{3}} = \frac{1}{3} \cdot 3 = 1.
  \]

  ### Step 2: Setup for Conditional Expected Value
  You randomly pick one envelope and observe an amount \(Y\). The possible values of \(Y\) are the same as \(X\) (since the envelopes contain \(X\) and \(2X\), so \(Y \in \{1, 2, 4, 8, \ldots\}\)). For a given observed \(Y = y\):
  - **Scenario A**: Your envelope is the smaller one (with probability \(P(X = y) \cdot \frac{1}{2}\)). The other envelope has \(2y\).
  - **Scenario B**: Your envelope is the larger one (with probability \(P(X = y/2) \cdot \frac{1}{2}\)). The other envelope has \(y/2\).

  The probability of observing \(Y = y\) is:
  \[
  P(Y = y) = P(\text{Scenario A}) + P(\text{Scenario B}) = \frac{1}{2} P(X = y) + \frac{1}{2} P(X = y/2).
  \]

  The conditional expected value of switching given \(Y = y\) is:
  \[
  E[\text{switch} \mid Y = y] = \left[ P(\text{Scenario A} \mid Y = y) \cdot 2y \right] + \left[ P(\text{Scenario B} \mid Y = y) \cdot \frac{y}{2} \right],
  \]
  where:
  \[
  P(\text{Scenario A} \mid Y = y) = \frac{\frac{1}{2} P(X = y)}{P(Y = y)}, \quad P(\text{Scenario B} \mid Y = y) = \frac{\frac{1}{2} P(X = y/2)}{P(Y = y)}.
  \]

  We'll compute this for \(y = 1, 2, 4, 8\) to show \(E[\text{switch} \mid Y = y] > y\) in each case.

  ### Step 3: Computations for Specific Observed Amounts

  #### Case 1: Observed \(Y = 1\)
  - **Scenario A**: \(X = 1\) (you have the smaller envelope).  
    Probability contribution: \(\frac{1}{2} P(X=1) = \frac{1}{2} \cdot \frac{1}{3} = \frac{1}{6}\).
  - **Scenario B**: \(X = 0.5\) (you have the larger envelope).  
    But \(X = 0.5\) is impossible in our distribution (\(0.5 \notin \{1, 2, 4, \ldots\}\)), so \(P(X=0.5) = 0\).  
    Probability contribution: \(\frac{1}{2} \cdot 0 = 0\).
  - \(P(Y=1) = \frac{1}{6} + 0 = \frac{1}{6}\).
  - Conditional probabilities:  
    \(P(\text{Scenario A} \mid Y=1) = \frac{1/6}{1/6} = 1\),  
    \(P(\text{Scenario B} \mid Y=1) = 0\).
  - \(E[\text{switch} \mid Y=1] = 1 \cdot (2 \cdot 1) + 0 \cdot (1/2) = 2\).
  - **Result**: \(2 > 1\), so switching is better.

  #### Case 2: Observed \(Y = 2\)
  - **Scenario A**: \(X = 2\) (you have smaller).  
    Probability contribution: \(\frac{1}{2} P(X=2) = \frac{1}{2} \cdot \frac{2}{9} = \frac{1}{9}\).
  - **Scenario B**: \(X = 1\) (you have larger, since \(y/2 = 1\)).  
    Probability contribution: \(\frac{1}{2} P(X=1) = \frac{1}{2} \cdot \frac{1}{3} = \frac{1}{6}\).
  - \(P(Y=2) = \frac{1}{9} + \frac{1}{6} = \frac{2}{18} + \frac{3}{18} = \frac{5}{18}\).
  - Conditional probabilities:  
    \(P(\text{Scenario A} \mid Y=2) = \frac{1/9}{5/18} = \frac{2}{5}\),  
    \(P(\text{Scenario B} \mid Y=2) = \frac{1/6}{5/18} = \frac{3}{5}\).
  - \(E[\text{switch} \mid Y=2] = \left( \frac{2}{5} \cdot 4 \right) + \left( \frac{3}{5} \cdot 1 \right) = \frac{8}{5} + \frac{3}{5} = \frac{11}{5} = 2.2\).
  - **Result**: \(2.2 > 2\), so switching is better.

  #### Case 3: Observed \(Y = 4\)
  - **Scenario A**: \(X = 4\) (you have smaller).  
    Probability contribution: \(\frac{1}{2} P(X=4) = \frac{1}{2} \cdot \frac{4}{27} = \frac{2}{27}\).
  - **Scenario B**: \(X = 2\) (you have larger, since \(y/2 = 2\)).  
    Probability contribution: \(\frac{1}{2} P(X=2) = \frac{1}{2} \cdot \frac{2}{9} = \frac{1}{9} = \frac{3}{27}\).
  - \(P(Y=4) = \frac{2}{27} + \frac{3}{27} = \frac{5}{27}\).
  - Conditional probabilities:  
    \(P(\text{Scenario A} \mid Y=4) = \frac{2/27}{5/27} = \frac{2}{5}\),  
    \(P(\text{Scenario B} \mid Y=4) = \frac{3/27}{5/27} = \frac{3}{5}\).
  - \(E[\text{switch} \mid Y=4] = \left( \frac{2}{5} \cdot 8 \right) + \left( \frac{3}{5} \cdot 2 \right) = \frac{16}{5} + \frac{6}{5} = \frac{22}{5} = 4.4\).
  - **Result**: \(4.4 > 4\), so switching is better.

  #### Case 4: Observed \(Y = 8\)
  - **Scenario A**: \(X = 8\) (you have smaller).  
    Probability contribution: \(\frac{1}{2} P(X=8) = \frac{1}{2} \cdot \frac{8}{81} = \frac{4}{81}\).
  - **Scenario B**: \(X = 4\) (you have larger, since \(y/2 = 4\)).  
    Probability contribution: \(\frac{1}{2} P(X=4) = \frac{1}{2} \cdot \frac{4}{27} = \frac{2}{27} = \frac{6}{81}\).
  - \(P(Y=8) = \frac{4}{81} + \frac{6}{81} = \frac{10}{81}\).
  - Conditional probabilities:  
    \(P(\text{Scenario A} \mid Y=8) = \frac{4/81}{10/81} = \frac{4}{10} = \frac{2}{5}\),  
    \(P(\text{Scenario B} \mid Y=8) = \frac{6/81}{10/81} = \frac{6}{10} = \frac{3}{5}\).
  - \(E[\text{switch} \mid Y=8] = \left( \frac{2}{5} \cdot 16 \right) + \left( \frac{3}{5} \cdot 4 \right) = \frac{32}{5} + \frac{12}{5} = \frac{44}{5} = 8.8\).
  - **Result**: \(8.8 > 8\), so switching is better.

  ### Pattern and Generalization
  For any observed \(Y = 2^k\) (where \(k \geq 0\)), the calculations reveal:
  - \(P(\text{Scenario A} \mid Y = 2^k) = \frac{2}{5}\),
  - \(P(\text{Scenario B} \mid Y = 2^k) = \frac{3}{5}\),
  - \(E[\text{switch} \mid Y = 2^k] = \frac{11}{5} \cdot 2^k = 2.2 \cdot 2^k\).

  Thus, for every possible \(Y\), \(E[\text{switch} \mid Y] = 1.1Y > Y\). This holds for all amounts in the support of the distribution.

  ### Conceptual Resolution
  You've identified the core tension: if the envelopes are symmetric before opening, how can switching always be better? The resolution lies in these key insights:

  1. **Symmetry Breaking by Observation**:
     - Before opening an envelope, the setup is symmetric: each envelope has an equal chance of being chosen, and the expected values are identical. Unconditionally, \(E[Y] = E[\text{other envelope}]\), so switching has no net advantage.
     - However, **conditioning on the observed amount \(Y = y\) breaks the symmetry**. The prior distribution \(P(X = x)\) assigns different likelihoods to the events "\(y\) is the smaller amount" and "\(y\) is the larger amount." In our distribution, for \(y > 1\), \(P(X = y/2) > P(X = y)\) (specifically, \(P(X = y/2) = \frac{3}{2} P(X = y)\)), making it more likely that \(y\) is the larger amount. This skews the expected value of switching upward.

  2. **Infinite Expectations and the St. Petersburg Connection**:
     - The unconditional expected value of the money in your envelope is infinite:
       \[
       E[Y] = \frac{3}{2} E[X] = \frac{3}{2} \sum_{k=0}^{\infty} 2^k \cdot \frac{1}{3} \left(\frac{2}{3}\right)^k = \frac{3}{2} \sum_{k=0}^{\infty} \left(\frac{4}{3}\right)^k = \infty \ (\text{since}\ 4/3 > 1).
       \]
       This mirrors the [St. Petersburg paradox](https://en.wikipedia.org/wiki/St._Petersburg_paradox), where a game with infinite expected value leads to counterintuitive decisions.
     - While \(E[\text{switch} \mid Y = y] > y\) for every finite \(y\), unconditionally, \(E[Y] = E[\text{other envelope}] = \infty\). Thus, there is no contradiction: the conditional dominance doesn't translate to unconditional dominance because both expectations are infinite. The symmetry holds globally but is broken locally by observation.

  3. **No Practical Contradiction**:
     - If you don't open the envelope, switching is neutral (symmetry holds).
     - If you open it, the prior distribution (which is asymmetric in its density over amounts) makes switching always beneficial. However, this doesn't imply you can profit infinitely by switching multiple times:
       - After switching once, if you open the new envelope and forget the old amount, the same prior applies, so you'd switch again. But this is consistent: the conditional expectation is always in favor of switching, regardless of history.
       - If you remember the first amount, you know the exact pair (e.g., after switching from \(y\) to \(2y\), you know the other envelope is \(y\)), so switching back would be harmful. But the paradox assumes no memory or only one switch opportunity.

  ### Conclusion
  We've constructed a valid probability distribution where switching is always conditionally beneficial. This doesn't violate envelope symmetry because:
  - The global symmetry ensures \(E[Y] = E[\text{other envelope}]\) (both infinite).
  - The conditional advantage arises from the *information* gained by observing \(Y = y\), combined with a prior that weights smaller amounts more heavily. This resolves the apparent resurrection of the paradox: the blanket rule "always switch" is justified only under this specific prior, and it stems from the interplay between finite conditional expectations and infinite unconditional expectations. The St. Petersburg-like divergence is crucial here, as it allows local dominance without global contradiction.
