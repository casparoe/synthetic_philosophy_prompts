answer: |-
  You've put your finger on a profound and genuinely troubling issue at the heart of Bayesian confirmation theory – the "Problem of Old Evidence" (POE). It's **not just a technical quirk**; it strikes at the core of how Bayesianism models scientific reasoning and theory confirmation. Let's break it down using your Mercury example and see why it's deep and how thinkers like Garber and Jeffrey respond.

  **1. Reconstructing the Paradox with Mercury:**

  *   **E:** Mercury's anomalous perihelion precession (the known deviation from Newtonian predictions).
  *   **T:** General Relativity (GR).
  *   **Timeline:** *E* was a well-established, accepted fact long before Einstein proposed *T*. Scientists knew *E* with near certainty. So, *before Einstein even conceived of GR*:
      *   `P(E) ≈ 1` (Everyone knew Mercury's orbit didn't quite fit Newton).
      *   `P(E | ~T) ≈ 1` (Even without GR, Mercury's precession was an observed fact).
  *   **The Bayesian Confirmation Intuition:** A theory *T* is confirmed by evidence *E* if learning *E* increases our degree of belief in *T*. Formally: `P(T | E) > P(T)`. This happens when `P(E | T) > P(E | ~T)` – the evidence is more probable *given* the theory than without it.
  *   **The Problem:**
      1.  **Conditionalization:** Bayesian updating works by *conditionalizing* on new evidence: `P_new(T) = P_old(T | E)`.
      2.  **But `E` is OLD:** *Before* Einstein formulates GR (`T`), `E` is *already known*. So `P_old(E) = 1`.
      3.  **Consequence:** If `P_old(E) = 1`, then by the definition of conditional probability:
          `P_old(T | E) = P_old(T & E) / P_old(E) = P_old(T & E) / 1 = P_old(T & E)`
          And also, `P_old(T) = P_old(T & E) + P_old(T & ~E)`. But since `P_old(E)=1`, `P_old(~E)=0`, so `P_old(T & ~E)=0`. Therefore:
          `P_old(T) = P_old(T & E) + 0 = P_old(T & E)`
          **Therefore: `P_old(T | E) = P_old(T)`**
      4.  **The Paradox:** `P_old(T | E) = P_old(T)`. According to strict Bayesian conditionalization on the *old* evidence *E*, learning *E* (which you already know!) **cannot change your credence in *T***. But this contradicts the overwhelming intuition and historical fact that Mercury's precession was a *major* confirmation of GR. Einstein himself saw it as crucial. How can GR get credit for explaining *E* if *E*'s existence couldn't *boost* belief in GR?

  **2. Why is this a DEEP Problem, not just a Quirk?**

  1.  **Threatens Core Bayesian Virtue:** Bayesianism prides itself on modeling rational learning from evidence. POE suggests it *fails* to model one of the most important kinds of learning in science: the retrospective appreciation of *known* evidence in light of a *new* theory. It struggles with scientific *revolutions* where new theories explain old, recalcitrant data.
  2.  **Misrepresents Historical Confirmation:** The historical record is clear: Mercury's precession *did* confirm GR for physicists. POE implies Bayesianism cannot formally capture this rational judgment.
  3.  **The Problem of Logical Omniscience:** The derivation relies on the agent knowing *all* logical consequences of their beliefs. If `P(E)=1` and `T` entails `E`, then logically `P(T) <= P(E)=1`, but more importantly, the agent *must* know that `T` entails `E` (or what its probability is) for `P(E|T)` to be defined meaningfully. Real scientists aren't logically omniscient. Einstein *discovered* that GR entailed `E`. Before that discovery, the *logical connection* wasn't part of the scientist's knowledge base, even though `E` itself was known.
  4.  **Counterfactual Support:** The intuitive force of `E` confirming `T` stems partly from a counterfactual: "If GR weren't true, would we *expect* Mercury's orbit to look like *this*?" The answer is "No, Newtonian physics predicts something else." But the standard Bayesian framework, using `P_old(E | ~T)`, struggles here because `P_old(E | ~T) ≈ 1` (since `E` is known fact, and `~T` was the old Newtonian paradigm which *also* knew `E`). The crucial counterfactual support seems washed out.
  5.  **Confirmation vs. Explanation:** POE highlights a potential gap between Bayesian *confirmation* (increase in credence upon learning `E`) and scientific *explanation* (providing a compelling account for why `E` is true). GR explained Mercury's precession beautifully, but POE questions whether this translates into Bayesian confirmation *if `E` was old*.

  **3. Escaping the Trap: Garber and Jeffrey**

  Philosophers have proposed various solutions. Here's the gist of two prominent ones:

  *   **Daniel Garber: Learning the Logical Connection (c. 1983):**
      *   **The Insight:** When Einstein developed GR, the *new* information wasn't *E* itself (which was old), but the discovery that **`T` logically entails `E`**. Let `L` represent this logical truth: `T ⊢ E`.
      *   **The Move:** The rational update isn't conditionalizing on `E`, but on `L`. The scientist learns the *implication*.
      *   **The Calculation:**
          *   *Before* discovering `L`: The scientist knows `E` (`P_old(E)=1`) but doesn't know that `T` explains it. `P_old(E | T)` might be *less than 1* because they haven't derived the consequence yet (rejecting logical omniscience). `P_old(E | ~T)` is still high (~1).
          *   *After* discovering `L` (`T ⊢ E`): This new knowledge forces `P_new(E | T) = 1`. Learning `L` *changes* the likelihood `P(E | T)`.
          *   **Result:** Now apply Bayes' Theorem with the *updated* likelihoods:
              `P_new(T | E) = [P_new(E | T) * P_old(T)] / P_new(E) = [1 * P_old(T)] / 1 = P_old(T)` -- Still no change?!
          *   **The Crucial Second Step:** Garber argues that learning `L` (`T ⊢ E`) *also* rationally forces a reassessment of `P(E | ~T)`. Once you know `T` explains `E`, you might realize that `~T` (the space of alternatives) does *not* naturally entail `E` – Mercury's precession was anomalous *precisely* because it *wasn't* explained by the prevailing `~T` (Newtonian physics). Learning `L` highlights the *explanatory deficiency* of `~T`.
              *   *Before `L`*: `P_old(E | ~T) ≈ 1` (E is a known fact within the ~T framework, even if anomalous).
              *   *After `L`*: Realizing `T` entails `E` forces the recognition that `~T` *lacks* this entailment. The scientist sees that `E` is *not* a consequence of `~T`; it's a problem for `~T`. Thus, `P_new(E | ~T)` should be *lowered* significantly (though not necessarily to 0).
          *   **Confirmation Achieved:** With `P_new(E | T) = 1` and `P_new(E | ~T) << 1` (or at least significantly lower than before realizing `L`), and `P_new(E) = P_new(E | T)P_new(T) + P_new(E | ~T)P_new(~T) < 1` (since `P_new(E | ~T) < 1`), applying Bayes' Theorem *now* shows `P_new(T | E) > P_old(T)`. Learning the logical connection `L` allows the old evidence `E` to confirm `T` by changing the *evaluation* of how `E` relates to `T` and `~T`.
      *   **Why it "Wriggles Out":** It shifts the focus from learning `E` to learning the *logical relationship* between `T` and `E`, and rejects the assumption of logical omniscience.

  *   **Richard Jeffrey: Probability Kinematics (a.k.a. Jeffrey Conditionalization) (c. 1983):**
      *   **The Insight:** Strict conditionalization (`P_new(·) = P_old(· | E)`) requires `P_old(E)=1`. Jeffrey Conditionalization is a generalization for when evidence doesn't make you *certain* of `E`, but only changes your *degree of belief* in `E` (and possibly related propositions).
      *   **The Move:** Jeffrey argues that *even old evidence* isn't held with *absolute certainty* (`P(E) = 1`). When a brilliant new theory like GR comes along and explains a long-standing anomaly like Mercury's precession, it *can* cause a scientist to **re-evaluate the very certainty of that old evidence**, or more precisely, to re-evaluate the *probabilities of propositions logically connected to `E` and `T` within the space of alternatives**.
      *   **The Process:** Instead of setting `P_new(E)=1`, the scientist experiences a "flash of insight" prompted by `T` that redistributes probabilities over a *partition* of propositions relevant to `E` and `T`. For example:
          *   The partition might be {`E & T`, `E & ~T`, `~E & T`, `~E & ~T`}.
          *   Before GR, the scientist assigned `P_old(E & ~T) ≈ 1` (E is true, T is false - Newton reigns but Mercury is anomalous).
          *   After GR, the *explanatory power* of `T` leads the scientist to *drastically lower* `P_new(E & ~T)` and *raise* `P_new(E & T)`, while keeping `P_new(E)` very high (but maybe not *exactly* 1). Crucially, `P_new(T)` increases as part of this redistribution.
      *   **Result:** The scientist's *credence in `T` increases* as a direct result of contemplating `T` in relation to the old evidence `E`, via a Jeffrey shift. `E`'s role isn't as a *newly learned* proposition forcing conditionalization, but as a catalyst for a rational reorganization of beliefs about the theoretical landscape *including* `T`.
      *   **Why it "Wriggles Out":** It rejects the idea that old evidence must be treated with `P(E)=1` and uses the more flexible Jeffrey Conditionalization to model how contemplating a new theory can rationally restructure beliefs about old evidence and its relation to theories.

  **In Summary:**

  The Problem of Old Evidence is deep because it exposes a tension between the formal mechanics of Bayesian conditionalization and the dynamics of real scientific discovery, particularly regarding the confirmation of revolutionary theories by known anomalies. It challenges assumptions about logical omniscience and the static nature of belief in evidence.

  *   **Garber's Solution:** Focuses on learning the *logical connection* (`T ⊢ E`) as the new information, which forces a reassessment of how well `~T` explains `E` (`P(E | ~T)`), allowing `E` to confirm `T`.
  *   **Jeffrey's Solution:** Argues that even old evidence isn't held with absolute certainty. The new theory prompts a rational reorganization of beliefs (via Jeffrey Conditionalization) over a partition including `T` and `E`, naturally leading to increased credence in `T`.

  Neither solution is universally accepted as perfect, but they represent serious attempts to reconcile the undeniable historical fact of confirmation by old evidence (like Mercury for GR) with the Bayesian framework. They highlight that the Bayesian agent is not a static, logically omniscient calculator, but a dynamic reasoner whose conceptual framework and understanding of logical relationships evolve, especially during profound theoretical shifts. Your intuition as a scientist that Mercury *should* confirm GR is correct; these philosophers try to show *how* Bayesianism can, with some adjustments, model that intuition.
