  ok so i've been picking individual stocks on the side for a couple years now, nothing crazy, just a regular brokerage account. a while back i fell down a rabbit hole reading about something called the "no-trade theorem" from economics, and if i'm getting it right it basically says that if everyone in a market is rational and starts out with the same basic assumptions about whats going on, nobody should ever want to trade with anybody else just because they think they know something -- since your willingness to make the trade in the first place tips the other side off, and they adjust the price so theres nothing left in it for you. assuming i havent totally butchered that, can you walk me through the most important implications of this for someone like me who keeps trying to pick stocks against people who basically do this for a living? like should it change how i think about why anyone would ever take the other side of my trade?
