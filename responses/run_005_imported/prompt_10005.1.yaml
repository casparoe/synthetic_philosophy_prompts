prompt: |-
  I help run the methodology side of a smallish forecasting tournament -- basically a scrappy Metaculus-style thing some of us started after getting way too into the superforecasting scene. We've hit a real fight over interpretations of probability, and it's not academic anymore since it affects prize money and the leaderboard. Half the commitee are frequentists who say you can't really assign a meaningful probability to a one-off event like 'will this specific ceasefire hold past June,' since there's no reference class of repeated trials to average over -- sure, you can still compute a Brier score for one question, but you can't say a single 73% call was actually good, just lucky, and real calibration only shows up over hundreds of questions. The other half are Bayesians who think probability just is credence, happy to score and rank every question on its own, 'best call of the year' prize included. Somebody brought up propensity interpretations too and it just stalled everyone out. I lean Bayesian myself but think the frequentists have a real point I can't just dismiss. can you draft the memo I'll bring to committee -- an actual recommendation for how we score and talk about singular, non-repeatable questions, one that takes the reference-class worry seriously instead of waving it away.
reasoning: |-
  Okay, the user is deeply involved in running a forecasting tournament and is facing a philosophical rift between frequentist and Bayesian interpretations of probability. This isn't just theoretical—it affects their leaderboard and prize allocations. 

  First, I need to unpack the core tension: frequentists argue single-event probabilities are meaningless without repeated trials, while Bayesians treat probability as subjective belief. The user leans Bayesian but acknowledges the frequentist critique. 

  Hmm... what's really at stake here? Beyond the academic debate, they need practical scoring rules that feel fair to both camps. The reference-class problem is legitimate—how can you verify calibration on unique events? But dismissing single-question scoring entirely would kill their "best call" prize and demotivate forecasters. 

  I recall the user mentioned "propensity interpretations" derailed discussions. That's a red flag—bringing in more philosophy might deepen the rift. Better to focus on operational solutions. 

  For the memo structure: start by validating both viewpoints to build trust. Then propose concrete scoring adjustments—maybe a hybrid system where singular events contribute to aggregate scores but aren't isolated for prizes until enough data exists. The "calibration horizon" concept could bridge the gap: use Bayesian scoring daily but anchor prizes to frequentist standards. 

  Key nuance: emphasize that all scoring is provisional. A 73% call on a ceasefire question isn't "true" or "false" probabilistically—it's just a number we later assign 0 or 1 to for scoring. The real skill is in aggregated performance. 

  ...Wait, should I address the propensity thing briefly? Maybe just footnote it as "interesting but unactionable." Practicality over purity. 

  Final touch: suggest labeling controversial prizes as "provisional" until enough questions resolve. That gives frequentists their due diligence while keeping Bayesians engaged. The tone must stay diplomatic—no "winning" the argument, just finding workable compromises.
answer: |-
  **MEMORANDUM**  
  To: Forecasting Tournament Committee  
  From: [Your Name], Methodology Lead  
  Subject: Resolution Framework for Scoring Singular Events & Addressing Reference-Class Concerns  
  Date: 23 October 2023  

  ### **Core Issue**  
  We must reconcile two valid perspectives:  
  1. **Frequentist Concern**: Single-event probabilities lack empirical validation. A 73% forecast on one question cannot be proven "well-calibrated"; luck dominates absent a reference class.  
  2. **Bayesian Practice**: Subjective credence *is* actionable probability. We can (and must) score singular events to incentivize precision.  

  Neither view is wholly right/wrong. Our solution must:  
  - Preserve incentives for granular forecasting,  
  - Acknowledge statistical limitations of one-off events,  
  - Ensure prizes/rankings reflect skill, not noise.  

  ---

  ### **Recommended Framework: "Aggregated Confidence Scoring"**  
  #### **1. Score All Questions Individually (Bayesian Foundation)**  
     - **Action**: Compute Brier/log scores for every forecast as submitted.  
     - **Why**: Punishing abstention kills engagement. Forecasters *must* commit to beliefs.  

  #### **2. But Restrict Prizes & Rankings to Aggregate Performance (Frequentist Safeguard)**  
     - **Action**:  
       - **Leaderboards**: Rank *only* on cumulative scores across ≥20 resolved questions.  
       - **"Best Call" Prize**: Replace with **"Most Skillful Run"** (e.g., best 10-question streak by relative Brier).  
       - **Small Tournaments**: If <20 questions resolve, label rankings "provisional" and delay prizes.  
     - **Why**: Isolated scores *are* noisy. Aggregation separates signal (skill) from noise (luck).  

  #### **3. Quantify & Display Uncertainty in Performance Metrics**  
     - **Action**:  
       - Attach **confidence intervals** to leaderboard scores (e.g., bootstrapped 90% CI for Brier).  
       - Flag forecasts with "**Low Confidence Impact**" (e.g., questions with <5 comparable historical resolves).  
     - **Why**: Highlights that a 73% call on "Ceasefire X" has higher uncertainty than a 73% on "Fed rate hike."  

  #### **4. Build Synthetic Reference Classes (Operational Bridge)**  
     - **Action**:  
       - **Tag questions** by shared features (e.g., "geopolitical," "duration <3mo," "low-base-rate").  
       - Compute **topic-specific calibration curves** (e.g., "How did 70% forecasts on 'rare events' actually fare?").  
     - **Why**: Mitigates the reference-class problem *without* requiring identical repeats.  

  #### **5. Adjust Communication Protocols**  
     - **Avoid**: "Alice was 73% accurate on Ceasefire X."  
     - **Use**: "Alice assigned 73% to Ceasefire X. Historically, similar forecasts on comparable questions resolved true 68–79% of the time."  

  ---

  ### **Why This Works**  
  - **Frequentists Get**: No overinterpretation of single events. Validation via aggregation/tagging.  
  - **Bayesians Get**: Every forecast scored, belief-based probabilities respected.  
  - **Forecasters Get**: Clear rules, reduced arbitrary penalties, transparent uncertainty.  
  - **Tournament Gets**: Statistically defensible prizes while encouraging participation.  

  ### **On Propensity Interpretations**  
  While philosophically interesting, propensity (objective chance) is unmeasurable for socio-political events. We **operationalize probability as forecasted confidence** (Bayesian) but **validate empirically** (Frequentist). No third framework is needed.  

  ---

  ### **Implementation Timeline**  
  1. **Immediate**: Adopt aggregate-only leaderboards/prizes.  
  2. **1 Month**: Develop question-tagging system + calibration dashboards.  
  3. **Ongoing**: Quarterly reviews of topic-level calibration.  

  This balances rigor with practicality. We accept that *all* forecasting metrics are imperfect—but this system respects both schools of thought while ensuring competitive integrity.  

  **Vote to approve by Friday**. Happy to refine details.  

  ---  
  *"Probability is not just a number; it's a commitment to a web of logic and evidence. Our scoring must reflect both the commitment and the web."*
