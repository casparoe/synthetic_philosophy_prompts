  First, I need to verify their intuition. The white horse argument *is* about set membership: "horse" as a category vs. "white horse" as a subset. The stone argument, though, hinges on epistemology—how we *access* properties via senses. That *is* a different logical move. The user’s suspicion that "separateness" means different things in each case seems spot-on.  

  The user also hints at frustration with oversimplified explanations. They want the meat of the arguments, not just labels like "universals." And they’re wary of these being dismissed as "language tricks." I should validate that—yes, classical Chinese’s lack of plurals/copulas *does* help the paradoxes land, but the underlying points about abstraction aren’t *just* linguistic quirks.  

  For the white horse argument:  
  - Gongsun Long exploits ambiguity in class inclusion. "White horse" narrows "horse" by adding a qualifier, so it’s not coextensive. (Like how "pet fish" isn’t just "pet" + "fish.")  
  - The "hard and white" argument, though, is more radical. It claims properties exist independently because *sensory experiences* are distinct. Touch gives hardness; sight gives whiteness. Since the senses never overlap in data, the properties must be ontologically separate. That’s not about sets—it’s about how perception shapes reality.  

  The user’s deeper ask: *Which argument holds water?*  
