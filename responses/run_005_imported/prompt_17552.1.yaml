answer: |-
  Here’s a toast that threads the needle: rigorous enough for the philosophers, warm and funny for everyone, and true to the depth of the moment. (Time: ~5 minutes delivered with pauses.)

  ---

  **(Raise glass, smile at the couple, then glance at the philosophers with a knowing look)**  

  "Hello everyone. For those who don’t know me, I’m [Your Name], the groom’s soon-to-be sibling-in-law, and more importantly today — the sister of our brilliant bride. Now, when [Sister's Name] asked me to give this toast, I said yes instantly. Then she sent me her *notes*. *(Pause for laughter)*. Turns out, writing a toast for a philosopher who’s spent a decade dissecting the ethics of promising is… slightly more daunting than explaining quantum foam to a toddler. She even ruled out my first two drafts! No ‘verbal magic,’ no ‘Humean conventions.’ She looked at my drafts like a peer reviewer spotting fatal flaws. *(Gentle laugh)*.

  So, here I am, standing between two camps. *(Gesture broadly)* To my left: friends, family, lovely humans who just want to celebrate love, maybe hear a funny story, and raise a glass. To my right: former classmates, colleagues, brilliant minds who’ve likely debated Scanlon vs. Hume over conference coffee and could dissect a promise like a frog in a lab. *(Smile)*. My job? To say something that doesn’t make the philosophers cringe *or* put everyone else to sleep. No pressure.

  **(Shift tone slightly, more earnest)**  

  "[Sister's Name]’s work asks a profound question: Why *do* promises bind us? What makes ‘I promise’ more than just hot air? She’s spent years showing us it’s *not* magic dust. And it’s *not* just a useful social trick, like agreeing to drive on the right side of the road. Her work insists it’s about *people*. Specifically, about inviting someone’s trust, asking them to rely on you, weaving your life into theirs… and then honouring that deliberate act. Breaking a promise, in this light, isn’t just breaking a rule; it’s letting down someone who believed you, someone you *asked* to believe you. It’s personal. It’s about the space *between* people.

  **(Pause, look at the couple)**  

  "And that’s why what’s happening today is so… terrifyingly beautiful. *(Smile at them)*. Because in about ten minutes, [Sister's Name] and [Partner's Name] aren’t just reciting pretty words. They’re not invoking mystical forces or blindly following social convention. They’re doing something infinitely more vulnerable and powerful. They’re standing before everyone they love and deliberately, consciously, inviting each other’s trust. They’re saying, ‘*Rely on me. Build a life with me. Count on me, knowing I’m flawed, knowing life is messy, knowing the future is unwritten.*’

  **(Lighten slightly)**  

  "Now, knowing [Sister's Name], she probably drafted those vows with footnotes. *(Laughter)*. But the point is, Scanlon’s insight – that the wrong of breaking a promise is found in that *specific* betrayal of invited trust – suddenly isn’t just theory in this context. It’s the lived reality they’re choosing to create. They’re *designing* a relationship where the promises matter precisely because *they matter to each other*. There’s no cosmic referee, no ‘Promise Police’ *(nod to parents)* – sorry Mom and Dad, you’re off duty. Just two people, looking each other in the eye, saying, ‘*I choose to be bound to you. I choose to be worthy of the trust I’m asking you to place in me.*’

  **(Warm, inclusive tone)**  

  "So, for our philosopher friends: This isn’t hand-waving. This is the Scanlonian core, lived out loud. The deliberate invitation of trust, the conscious creation of mutual reliance – that’s the engine of this vow. It’s not magic, it’s not *just* convention… it’s a choice made fiercely personal.

  "And for everyone else who just wants to celebrate? *(Smile broadly)*. Look at them! They’re taking this terrifying, beautiful leap *because* they see each other clearly. They’re promising *despite* knowing promises are hard, life is unpredictable, and nobody’s perfect. That’s not just comforting; that’s courageous. That’s the kind of love you build a life on – brick by brick, promise kept by promise kept. It’s the daily choice to *not* let the other down. That’s what makes us laugh, makes us tear up, makes us feel so incredibly hopeful watching them.

  **(Raise glass higher)**  

  "So, [Sister's Name] and [Partner's Name], here’s to you. To the courage of your deliberate invitation. To the profound trust you consciously place in each other today. To building a life where your promises are the sturdy, chosen scaffolding, not magic or mere habit, but the visible proof of your love and commitment, day after day after day. May you always find each other worthy of the trust you’ve so bravely invited.

  **To the promise!**"

  ---

  **Why this works:**

  1.  **Acknowledges the Elephant:** Directly addresses the philosophical divide and the sister's expertise with humor ("sent me her *notes*," "ruled out my drafts," "philosopher friends... this isn't hand-waving"), diffusing tension and showing respect.
  2.  **Explains Scanlon Simply (for non-philosophers):** Uses clear, non-jargon language: "inviting someone’s trust," "asking them to rely on you," "letting down someone who believed you," "deliberate invitation of trust," "conscious creation of mutual reliance." Philosophers will recognize the core argument instantly.
  3.  **Makes it Personal & Emotional:** Connects the theory directly to *their* act ("terrifyingly beautiful," "vulnerable and powerful," "designing a relationship," "conscious creation," "courageous"). Shows *why* Scanlon's view resonates so deeply for marriage.
  4.  **Satisfies the "True" Requirement:** Avoids easy outs (magic/convention) and lands on the profound, human core of promising as an act of mutual vulnerability and chosen obligation. Highlights the agency ("*deliberately* inviting," "*consciously* placing trust").
  5.  **Balances Humor & Warmth:** Self-deprecating humor about the task and sister's rigor, gentle teasing ("footnotes," "Promise Police"), and genuine warmth about their love and courage. The "look at them!" moment shifts perfectly to pure celebration.
  6.  **Unifying Conclusion:** The final toast ("deliberate invitation," "profound trust," "sturdy, chosen scaffolding," "worthy of the trust") uses language that resonates with both the philosophical depth and the universal emotional truth of commitment. The "brick by brick, promise kept by promise kept" line bridges theory and lived experience.
  7.  **Structure:** Starts with relatable setup/humor, transitions into clear philosophical explanation tied to the couple, acknowledges both audiences explicitly, builds to an emotional peak celebrating their courage and choice, ends with a unifying toast.

  Deliver it with genuine affection, eye contact with both audiences, and confidence. You’ve got this! Your sister will appreciate the intellectual integrity wrapped in love.
