  For humor: gently tease the sister’s academic rigor ("ruled out options like a peer review") and the guests’ divide ("some of you have Kantian categorical imperatives in your back pockets"). Warmth comes from showing how her scholarship melts into vulnerability here—the theorist facing her own theory. 

