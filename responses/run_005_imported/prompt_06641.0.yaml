prompt: |-
  I'm a software engineer at a mid-size mobile game studio, and I sit on the small internal group — two designers, a data scientist, and an outside clinical psychologist — that must sign off before we ship anything touching player mental health. We've built a model that flags accounts as elevated-risk for what the WHO's ICD-11 labels "Gaming Disorder," combining play data with an in-app questionnaire worded to track the official criteria (impaired control over play, prioritizing it over other interests, continuing despite harm); flagged accounts get a nudge toward setting play limits. Our psychologist warns that once players know the flag exists, some start describing ordinary play as compulsive on the questionnaire, apparently because being told they're "at risk" changes how they narrate their own habits, while others steer their answers away from anything resembling the criteria to avoid being tagged again — either way, the flagged group's self-reports stop being independent evidence of what the model is supposed to measure, and next quarter's retraining will bake that distortion back into the model itself. We decide this Friday whether to ship the feature as designed, shelve it, or redesign the questionnaire and retraining pipeline. Please draft the memo I'll circulate beforehand: take a clear position with a concrete plan and timeline, and engage honestly with the strongest argument against whichever option you choose.
reasoning: |-
  Okay, the user is a software engineer at a mobile game studio, part of a small team that approves features related to player mental health. They've developed a model to flag accounts at risk for Gaming Disorder based on play data and an in-app questionnaire. The problem is that once players know about the flag, their responses become biased—some exaggerate symptoms to get flagged, others downplay to avoid it. This distorts the data, which then gets baked into the model during retraining. The team needs to decide whether to ship, shelve, or redesign the feature by Friday.

  First, I need to understand the core issue. The psychologist's warning is crucial: the awareness of the flag causes response bias. This is a classic case of the Hawthorne effect or observer effect, where people alter their behavior because they know they're being studied. The model's effectiveness is compromised because the data becomes unreliable once the intervention is known. The retraining cycle will amplify this bias, making the model less accurate over time. 

  The user's role is technical, but they're part of a cross-functional team. The memo needs to address both technical and psychological aspects. The stakeholders include designers, a data scientist, and a clinical psychologist. The memo must balance ethical concerns with practical implementation. 

  The key decision points are:
  1. **Ship as is**: Risky because it introduces bias immediately. The model deteriorates, and players might get inappropriate interventions.
  2. **Shelve**: Safe but misses the opportunity to help at-risk players. The studio has invested resources, and shelving might delay needed support.
  3. **Redesign**: Addresses the bias but requires time and resources. The question is whether it's feasible within a reasonable timeline.

  The strongest argument against redesign is the complexity and time involved. The psychologist might argue that any known intervention could cause bias, making a truly "stealth" system impossible. Also, ethical concerns about covert monitoring. The team must consider if redesign can realistically mitigate bias without compromising transparency.

  The user's deeper needs might include maintaining the studio's reputation, ensuring player well-being, and justifying the feature's development effort. They might also be concerned about legal or regulatory implications if the feature causes harm. The memo needs to propose a viable solution that aligns with ethical standards while being feasible.

  Proposing a phased redesign: Immediate changes to the questionnaire (e.g., removing explicit criteria references) and longer-term solutions like stealth monitoring. Including a timeline shows commitment without rushing. A/B testing and ethical oversight address the psychologist's concerns. The memo must honestly address that no solution is perfect but redesign offers the best balance.
answer: |-
  **MEMORANDUM**  
  **TO:** Mental Health Working Group (Designers, Data Science, Clinical Psychologist)  
  **FROM:** [Your Name], Software Engineering  
  **DATE:** [Current Date]  
  **SUBJECT:** Decision: Gaming Disorder Intervention Redesign Required (Target: Q3 Rollout)  

  ### Position  
  **Shelve the current feature; redesign the questionnaire and retraining pipeline to mitigate response bias. Target a revised launch by end of Q3.**  
  The psychologist’s warning about self-report distortion is catastrophic to the model’s integrity. Shipping as-is risks embedding a self-reinforcing bias loop, invalidating our tool’s purpose and potentially harming players. However, abandoning the feature wastes validated infrastructure and ignores at-risk players. A focused redesign is the only path to ethical deployment.  

  ---

  ### Concrete Plan & Timeline  
  1. **Immediate (Week 1–2)**:  
     - Shelve current feature; preserve code/data for analysis.  
     - Draft new questionnaire with psychologist: **Remove explicit ICD-11 criteria references**. Use oblique behavioral proxies (e.g., "How often do you lose track of time while playing?" vs. "Do you struggle to control play?").  
     - Explore "stealth" data: Increase weight of behavioral signals (session length, payment spikes, play during work/sleep hours) to reduce questionnaire reliance.  

  2. **Weeks 3–5**:  
     - **A/B test redesigned questionnaire** on 5% of users (no interventions triggered). Measure:  
       - Correlation between proxy questions and ICD-11 criteria (via anonymized external survey sample).  
       - Stability of responses over 3 exposures (test bias persistence).  

  3. **Week 6–8**:  
     - Retraining pipeline overhaul:  
       - **Decouple intervention triggers from model training data**. Use pre-intervention questionnaire responses *only* for initial training.  
       - Post-intervention data tagged as "potentially biased" and excluded from retraining.  
     - Develop "bias detection" metrics (e.g., response volatility, criteria-matching spikes).  

  4. **Q3 Final (Week 9–12)**:  
     - Soft-launch redesigned feature to 10% of users.  
     - Monitor bias metrics weekly; emergency kill-switch if distortion detected.  

  ---

  ### Engagement with Counterarguments  
  **Strongest argument against redesign:** *"This adds months of delay while players at-risk go unsupported. Behavioral signals alone lack clinical validity, and stealth monitoring feels unethical."*  

  **Honest engagement:**  
  - Yes, delay is a real cost. However, shipping a broken tool *now* could permanently alienate the at-risk cohort we aim to help (e.g., "false positive" fatigue).  
  - Behavioral data *is* imperfect but avoids self-report bias. We compensate by:  
    - **Triangulation**: Combining play patterns with proxy questions *and* external surveys (e.g., quarterly opt-in mental health check).  
    - **Transparency**: Clearly disclosing monitoring in ToS (e.g., "We analyze play patterns to support well-being").  
  - Ethical balance: Post-redesign, players still opt into nudges. "Stealth" elements focus on *model preservation*, not covert manipulation.  

  ---

  ### Why Not Other Options?  
  - **Ship as-is**: Unacceptable. The psychologist’s evidence of distorted self-reports guarantees model collapse. We risk training on "gaming the system" artifacts, not real behavior.  
  - **Shelve permanently**: Ignores our duty of care. We have infrastructure to help; abandoning it is negligence.  

  ### Final Request  
  Let’s align on Friday to:  
  1. Formalize shelving of V1.  
  2. Approve redesign scope/timeline.  
  3. Assign roles: Psychologist (questionnaire), Data Science (bias metrics), Engineering (pipeline changes).  

  This isn’t just technical debt—it’s ethical debt. We pay it now, or compound it later.  

  // [Your Name]
