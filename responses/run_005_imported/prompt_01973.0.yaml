  ok so me and my friend got into it last night about whether trusting people is basically just induction in disguise. it started bc she asked some random guy on the street for directions and just believed him no hesitation, and when i asked why she'd trust a total stranger she has zero track record on, she said something like "that's just what believing someone IS, you don't need a dossier on a person to take their word for it." i said no, you're still relying on your overall past experience that randoms giving directions are usually right, so it still reduces to induction, she just doesnt notice she's doing it. neither of us could settle it, and i'm pretty sure we're just badly reinventing an actual epistemology debate (reductionism vs anti-reductionism about testimony, kind of a Hume vs Reid thing?). can you lay out the strongest version of each side properly, and then tell me how reductionism is supposed to survive the fact that little kids trust almost everything adults tell them way before they've built up any track record to induct from - does that sink reductionism, or is there an actual good comeback?
