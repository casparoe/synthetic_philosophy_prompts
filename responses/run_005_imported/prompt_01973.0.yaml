  For the reductionist comeback on children, stressing the distinction between psychological trust and epistemic justification. Kids trust instinctively, but as they mature, they develop inductive reasons. The reliability of caregivers creates a track record, even if not consciously tracked. This builds a feedback loop that justifies future trust.

  I should check if there are contemporary examples or studies. Research on child development showing how children adjust trust based on accuracy, like Paul Harris's work. This supports the idea that even children use rudimentary induction—trusting those who've been reliable before.

