prompt: |-
  Alright, so I'm on the technical steering committee for a mid-size open source project (5 of us), and we just ran into a voting situation that's been bugging me. I think it's some kind of known paradox but I have no idea what it's called or how people usually deal with it.

  We had a big RFC to decide on (adding a new plugin API). Our bylaws say a proposal passes only if it (a) gets a security sign-off AND (b) is backwards compatible. Instead of a straight up-or-down vote, we each voted on the two sub-criteria seperately and let the rule decide the outcome. Here's how it went:

  - Me: security=yes, backcompat=yes -> accept
  - Sam: security=yes, backcompat=yes -> accept
  - Priya: security=yes, backcompat=no -> reject
  - Dev: security=no, backcompat=yes -> reject
  - Ravi: security=no, backcompat=no -> reject

  Majority says security=yes (3-2) and majority says backcompat=yes (3-2), so by our own rule the RFC passes. But when Sam went around and asked people to just say "accept or reject the RFC overall" as a gut check, it came out 2 accept vs 3 reject. Same five people, same votes basically, opposite answer depending on how you ask the question.

  Now half the committee wants to scrap voting on sub-criteria and just do a straight up-or-down vote on the RFC itself, and the other half says that defeats the whole point of having explicit criteria in our bylaws in the first place. Both camps are pretty dug in and just keep repeating their own point instead of dealing with the other side's.

  Can you write the memo I'd send round before next week's meeting? I want it to actually recommend one voting procedure for us to standardize on going forward (not just re-litigate this one RFC), give real reasons a non-philosopher committee member would find convincing, and take the strongest version of the side you're NOT recommending seriously instead of just asserting logic is on your side. Keep it to something like half a page to a page.
reasoning: |-
  Okay, the user is part of a technical steering committee for an open-source project facing a voting paradox. They need a memo to resolve conflicting voting methods. Let me start by understanding the problem. 

  The committee voted separately on two criteria: security and backward compatibility. Each member voted on these sub-criteria, and the bylaws require both to pass for the RFC to be accepted. The results showed that each criterion passed individually (3-2), so by the rules, the RFC should pass. But when members voted overall, it failed 2-3. 

  Hmm, this is a classic Condorcet Paradox. The separate voting led to the proposal passing, but direct voting rejected it. The committee is split: one side wants direct votes, the other insists on criteria-based voting. The user needs a memo recommending a standardized procedure, addressing both sides fairly, and keeping it concise.

  First, I should explain why this happened. The separate criteria vote aggregates preferences differently. Some members might reject for one reason even if they support the other criterion. For example, Priya supports security but rejects backward compatibility, leading to a reject overall. But in criteria voting, their "yes" on security counts toward the majority, even if their overall stance is reject. That's the paradox.

  The user's deeper need is to prevent future conflicts and ensure efficient decision-making. They need a solution that respects the bylaws but avoids such inconsistencies. They also need buy-in from both factions, so the memo must validate each side's concerns before recommending a solution.

  Looking at the options: direct voting simplifies but risks ignoring the bylaws' criteria. Criteria voting ensures each requirement is met but can lead to outcomes misaligned with overall will. A hybrid approach might work: vote on criteria first, then an overall vote only if criteria pass. This ensures both conditions are met and checks overall support.

  The memo should present this hybrid method as a compromise. It satisfies the criteria camp by enforcing bylaws and addresses the direct vote camp by adding a final check. This could resolve the stalemate. Also, explaining the paradox clearly helps the committee understand it's a known issue, not a flaw in their judgment.

  I should make sure the memo is structured to first acknowledge the issue, explain the paradox neutrally, present both sides' strengths, then propose the solution. Emphasize practicality and alignment with project goals. Keep it professional, concise, and focused on moving forward rather than rehashing the past.
answer: |-
  ## MEMO: Standardizing Voting Procedures for RFC Approvals  
  **To:** Technical Steering Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Resolving Voting Paradox & Adopting a Clear Path Forward  

  ### The Issue  
  Last week’s RFC vote revealed a procedural paradox:  
  - **Separate criteria voting** (security + backcompat) resulted in **acceptance** (3-2 on each criterion).  
  - **Direct overall voting** resulted in **rejection** (2 accept, 3 reject).  
  This is a known phenomenon called the **"Ostrogorski Paradox"** (or preference aggregation paradox), where voting on sub-issues can contradict overall preferences. Both outcomes are "logical" under their respective rules, but they conflict.  

  ### Why This Matters  
  Our bylaws require explicit security/backcompat checks for good reason: they enforce objective gates. However, if our process yields outcomes that misalign with the committee’s collective intent, it undermines trust and efficiency. We need a method that:  
  1. Respects bylaws’ intent (explicit criteria).  
  2. Reflects overall will.  
  3. Prevents recurring deadlocks.  

  ### Evaluating the Options  
  **Option 1: Direct Up/Down Vote (Advocated by Half the Committee)**  
  *Strengths:* Simple, avoids paradoxes, directly captures overall intent.  
  *Serious Weaknesses:*  
  - **Bypasses bylaws:** Security/backcompat become subjective opinions, not objective requirements. A member could vote "accept" while ignoring a critical flaw in one criterion.  
  - **Risk:** Weakens governance. Future controversial proposals might pass without fulfilling mandatory checks.  

  **Option 2: Strict Criteria-Only Voting (Current Bylaw Interpretation)**  
  *Strengths:* Upholds bylaws rigorously. Ensures proposals *must* pass both gates objectively.  
  *Serious Weaknesses:*  
  - **Paradox risk:** As seen, it can "accept" proposals opposed by a majority of members. This feels undemocratic and can breed resentment.  
  - **Rigidity:** Fails to capture whether objections to *one criterion* are severe enough to warrant overall rejection despite passing both gates technically.  

  ### Recommendation: Hybrid Voting (Criteria + Confirmation Vote)  
  Neither pure approach fully resolves the tension. I propose a **two-step hybrid process** for *all future RFCs*:  
  1. **Criteria Vote First:** Vote *only* on security & backcompat per bylaws.  
     - **IF** both pass → Proceed to Step 2.  
     - **IF** either fails → RFC rejected (no Step 2).  
  2. **Overall Confirmation Vote:** *Only if both criteria pass*, hold a direct up/down vote on the **entire RFC package**.  
     - Requires simple majority to pass.  

  ### Why This Solves Our Problem  
  1. **Respects Bylaws:** Mandatory criteria *must* be passed first (addressing the criteria camp’s core concern).  
  2. **Reflects Overall Will:** An RFC passing criteria still requires explicit majority approval (addressing the direct-vote camp’s concern).  
  3. **Prevents Paradox:** Priya’s "Security=Yes, Backcompat=No" vote properly kills the RFC at Step 1. Dev’s "Security=No, Backcompat=Yes" similarly blocks it. Only if *both* pass (indicating broad alignment) does it face a final check.  
  4. **Practical & Efficient:** Adds one vote only for borderline cases. Clear RFCs pass/fail quickly.  

  ### Applying This to Last Week’s RFC  
  Under the hybrid model:  
  1. **Criteria Vote:** Security=Yes (3-2), Backcompat=Yes (3-2) → Proceeds to Step 2.  
  2. **Overall Vote:** 2 Accept vs 3 Reject → RFC **rejected**.  
  This aligns with the committee’s overall judgment *while still validating that both criteria were met*.  

  ### Next Steps  
  I move that we **amend our voting procedures** to adopt this hybrid model starting with the next RFC. This balances legal rigor with democratic intent, resolves the paradox, and provides clarity. Let’s vote on this procedure change at our next meeting.  

  This isn’t about relitigating the past RFC—it’s about ensuring our process serves our project’s future.  

  // Signature  
  [Your Name]  

  ---  
  **Key Rationale for Hybrid:** It treats the criteria votes as *necessary gates* (not sufficient by themselves), then adds a holistic check. This satisfies the *intent* of the bylaws (ensuring security/backcompat are formally assessed) while preventing outcomes where a majority opposes the proposal despite it "ticking boxes." It’s the most defensible compromise for a technical governance body.
