prompt: |-
  Working on a scene where two of my characters (one's a burnt-out philosophy grad student) get into it about truth, so I've gone down a rabbit hole reading about deflationary theories of truth to make her dialogue sound legit. From what I can tell, the whole idea is that saying "its true that it's raining" doesn't add anything beyond just saying "it's raining" - so the word true isn't naming some extra property out there in the world. But if thats really all truth amounts to, doesn't it basically collapse into whatever people agree to assert, so two people could assert totally opposite things and both come out true in exactly the same sense? I want to give her a solid comeback in the scene, so tell me if I'm even getting the theory right before I put words in her mouth.
