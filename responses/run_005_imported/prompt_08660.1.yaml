  2. Aumann's account: The student correctly notes that Aumann uses a strong notion of rationality (requiring optimality at every node consistent with information). This is a key point. However, note that Aumann's (1995) paper is about backward induction and common knowledge, and he does use a notion of rationality that requires optimality at every information set (which in perfect information games is every node). The student's characterization is accurate.
