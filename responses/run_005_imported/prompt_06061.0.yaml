prompt: |-
  I've been reporting a longread on the rationalist/effective altruism crowd and their love affair with Bayesian reasoning, and one thing that keeps coming up in interviews is "Good's theorem." A couple of people have explained it to me as basically a mathematical proof — from I.J. Good, apparently the same guy who was a codebreaker at Bletchley Park with Turing before he became a statistician — that the expected value of information can never be negative. The way it was put to me: a rational agent should always want more free information before deciding anything, so treating ignorance as a legitimate preference rather than a correctable bias doesn't really hold up. One source's exact line was "there's no such thing as a good reason not to want to know something, if its free to find out."

  Except for a completely different piece last month I interviewed a genetic counselor, and she told me a large share of people at risk for Huntington's disease deliberately choose not to get tested, and that this is treated as a totally normal, even textbook-standard, choice in her field rather than some mistake to be talked out of. That feels like a flat contradiction to me — either decision theorists have this wrong and ignorance really can be the smarter move, or genetic counselors are quietly encouraging irrational behavior in their patients. Can you help me sort out which side is actually mistaken here, or is there some wrinkle in what the theorem is really claiming that would make both of these things true at once? I'd rather get an actual answer than a "well, both have a point" shrug.
reasoning: |-
  Okay, the user is a journalist working on a piece about rationalists and effective altruists' use of Bayesian reasoning. They've come across Good's theorem, which seems to state that information always has non-negative expected value. But they've also encountered a real-world example from genetic counseling where people choose not to get tested for Huntington's disease. The user sees a contradiction here and wants to resolve it.

  First, I need to recall what Good's theorem actually says. The theorem proves that the expected value of information is non-negative when information is free and the decision-maker is rational. That means, in theory, more information shouldn't hurt. But the Huntington's disease case seems to contradict this because people actively avoid information.

  I should consider the assumptions behind Good's theorem. It assumes that the information is cost-free and that the decision-maker will update their beliefs rationally. But in real life, getting tested for Huntington's isn't free emotionally. The anxiety of waiting for results, the psychological burden of knowing you have a fatal disease—these are real costs. Even if the test itself is free, the emotional toll isn't.

  Also, the theorem focuses on instrumental value—how information helps achieve goals. But people might value their current peace of mind. Not knowing allows them to live without constant dread. That peace of mind is a utility in itself. So choosing ignorance isn't irrational if it preserves mental well-being.

  Another point is that for Huntington's, there's no cure or preventive treatment. So the information doesn't lead to actions that change outcomes. The instrumental value is low, while the emotional cost is high. That tips the balance towards not testing. The theorem doesn't account for cases where information doesn't enable beneficial actions.

  I should also think about state-dependent utilities. Knowing you have the disease might change how you experience life, making you anxious or depressed. The utility of outcomes depends on your mental state, which the information alters. Good's theorem assumes utilities are stable, but here they're not.

  The user might be conflating the rationalist ideal with real human psychology. Rationalists focus on theoretical rationality, but humans have emotional and psychological needs. Genetic counselors recognize this, hence supporting patients' choices. Both perspectives can coexist if we acknowledge the theorem's assumptions versus real-world complexities.

  So the resolution is that Good's theorem holds under its strict assumptions, but those don't apply in the Huntington's case due to emotional costs and lack of actionable outcomes. The genetic counselors aren't encouraging irrationality; they're respecting patients' holistic well-being.
answer: |-
  You're absolutely right to spot a contradiction here—but the resolution isn't that either side is fundamentally wrong. The disconnect lies in the *scope* of Good's theorem and the *real-world conditions* of the Huntington's disease example. Good's theorem makes mathematically valid claims under specific assumptions, while the genetic counseling scenario violates several of those assumptions. Let's dissect it precisely:

  **1. Good's Theorem: What It Actually Says (and Its Assumptions)**
  *   **Core Claim:** I.J. Good proved that for a rational agent facing a decision, the *expected utility value* of obtaining *costless, purely instrumental* information before making a decision is *non-negative*. On average, you expect to be at least as well off (and often better off) with the information than without it, assuming you update your beliefs rationally (Bayesian updating).
  *   **Critical Assumptions:**
      *   **Costless Information:** The act of *acquiring* the information itself imposes no costs (no money, time, effort, psychological distress).
      *   **Purely Instrumental:** The value of the information lies *only* in its ability to help you choose actions that lead to better *outcomes* in the real world. Information has no intrinsic positive or negative value; its worth is solely in improving decisions.
      *   **Stable Utilities:** Your preferences (utilities) over the *final outcomes* are fixed and do not change based on the *state of knowledge itself*. Knowing vs. not knowing doesn't alter how much you value health, life, peace of mind, etc. *in the abstract*.
      *   **Rational Updating & Action:** You will correctly update your beliefs using Bayes' theorem upon receiving the information, and then choose the action that maximizes your expected utility given those updated beliefs.

  **2. Why the Huntington's Disease Scenario Violates These Assumptions**
  The choice *not* to test for Huntington's disease (HD) is rational precisely because the assumptions of Good's theorem *don't hold* in this case:

  *   **Psychological Costs are NOT Zero (Violates Costless Information):**
      *   **Anticipatory Anxiety:** The testing process itself (waiting for results, the test appointment) can cause significant, prolonged distress.
      *   **Burden of Knowledge:** A positive result inflicts immediate, profound psychological trauma—knowing you will develop a devastating, incurable, fatal neurological disease. This knowledge itself is a major negative life event, altering one's present reality and outlook regardless of future actions.
      *   *This is a direct cost of acquisition and possession of the information.* Good's theorem assumes acquisition is free. Here, the "price" of the information can be severe emotional suffering.

  *   **Information Has Intrinsic Disutility (Violates Purely Instrumental):**
      *   For many at-risk individuals, *not knowing* preserves hope and allows them to live their lives without the shadow of a definitive death sentence. *The state of ignorance itself has positive utility.* Conversely, *the state of knowing a positive result has immense negative utility*, independent of any actions taken afterward. The information isn't just a tool; it directly alters well-being.

  *   **Limited Instrumental Value (Limits the Benefit Side):**
      *   **No Prevention/Treatment:** Critically, there is currently no cure or treatment to prevent or significantly slow the onset of HD. Knowing you have the mutation doesn't enable actions that substantially change the disease outcome.
      *   **Actions Available (But Limited Benefit):** While knowing *could* influence decisions like family planning, financial planning, or lifestyle choices, the *marginal benefit* of knowing vs. acting *as if* you might develop HD (a common strategy for at-risk individuals) is often perceived as small compared to the psychological costs. The information doesn't unlock powerful new, life-altering preventative actions. Good's theorem guarantees non-negative *expected* value, but if the *potential upside* (improved decisions) is small and the *potential downside* (psychological cost of a positive) is huge, the *net* expected utility for a specific individual can easily be negative once costs are factored in.

  *   **Utilities are State-Dependent (Violates Stable Utilities):**
      *   How you *experience* your current life and future prospects fundamentally changes based on whether you know your HD status. The *utility of living the next 10 years without symptoms* is vastly higher if you don't know you carry the mutation than if you do. The knowledge state directly changes the valuation of the *same* physical state of health.

  **3. Resolving the Contradiction: Where Both Sides are Right (and Where the Rationalist Quote is Overreaching)**

  *   **Good's Theorem is Mathematically Correct:** Within its strict assumptions (costless, purely instrumental info, stable utilities, rational action), it *is* true that more information has non-negative expected value. If information is truly free and only serves to guide action, you shouldn't avoid it.
  *   **Genetic Counselors are Professionally Correct:** They recognize that in the HD scenario (and similar predictive testing for untreatable conditions):
      *   The information is NOT costless (high psychological costs).
      *   The information has massive intrinsic (dis)utility.
      *   The instrumental value is often low due to lack of effective interventions.
      *   Therefore, the *net expected utility* of testing can easily be negative *for many individuals*. Respecting the "right not to know" is acknowledging these profound psychological realities and the individual's right to protect their present well-being. It is not irrational under a broader, more humanistic definition of rationality that includes psychological costs.
  *   **The Rationalist Quote is Overly Broad & Naive:** Saying "there's no such thing as a good reason not to want to know something, if it's free to find out" **ignores reality**. It conflates the *idealized, frictionless world* of Good's theorem assumptions with the messy reality where:
      *   **Information is rarely truly free** (psychic costs are real costs).
      *   **Information often has intrinsic value/disvalue** (knowledge *changes* how we experience life, not just what we do).
      *   **The instrumental value can be negligible** (if no effective actions are enabled).

  **Conclusion: No Mistake, Just Different Contexts**

  *   **Decision Theorists (Good's Theorem):** Not wrong mathematically, but their model applies to an idealized scenario that often doesn't match high-stakes, psychologically laden real-world decisions like predictive genetic testing for untreatable diseases. Applying it dogmatically without considering psychological costs and intrinsic value of states of knowledge is the mistake.
  *   **Genetic Counselors:** Absolutely not encouraging irrationality. They are correctly applying a *broader rationality* that accounts for the very real psychological costs of information, its intrinsic impact on well-being, and the limited instrumental benefit in specific contexts like untreatable HD. The choice for ignorance *is* the rational choice for maximizing expected well-being (utility) for many individuals in this situation.
  *   **The Wrinkle:** Good's theorem proves information has non-negative *instrumental expected value under idealized conditions*. The Huntington's case demonstrates that when information has high *acquisition/possession costs* (psychological burden), significant *intrinsic disutility* (destroying hope/peace of mind), and *low instrumental value* (no cure), the *net expected utility* can be negative. The theorem doesn't account for costs and intrinsic value, so there's no contradiction – just a more complex reality.

  **Your Takeaway:** In your article, you can highlight this as a crucial boundary of the rationalist/EA/Bayesian paradigm. Their tools are powerful within their domain (e.g., optimizing charitable giving, technical forecasting), but they can fail dramatically when confronted with profound human psychological realities, irreversible knowledge, and situations where information's primary impact is emotional rather than actionable. The HD testing case is a stark, ethically validated example of where "rational" ignorance prevails precisely *because* humans aren't idealized Bayesian agents living in a cost-free information environment. The genetic counselors understand the full utility function; a naive application of Good's theorem does not.
