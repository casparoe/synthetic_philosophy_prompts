  ## The Textual Gauntlet: Revisiting the Garrison-Douglass Schism on the Constitution's Soul

  The fracture within the abolitionist movement over the U.S. Constitution was, on its surface, a debate about hermeneutics – how to read a foundational text. William Lloyd Garrison saw a document indelibly stained by slavery, demanding righteous rejection. Frederick Douglass, after a profound conversion, saw a text whose plain language offered potent antislavery weapons, demanding engagement. At the heart of this schism lay the Constitution's infamous compromise clauses – deliberately oblique, avoiding the words "slave" and "slavery." Was this avoidance a cowardly euphemism embedding slavery's protection, as Garrison insisted, or a crucial silence leaving the door open for freedom, as Douglass later argued? Weighing the strongest interpretations reveals a nuanced, yet ultimately decisive, verdict.

  **The Garrisonian Indictment: Context as Text**

  Garrisonians presented a powerful, historically grounded argument. Their strength lay not in ignoring the text, but in insisting that the text *could not* be divorced from the context of its creation and the universal understanding of its provisions by contemporaries. The Constitution, they argued, was forged in a crucible of slavery. Delegates representing slaveholding states demanded specific protections. The resulting clauses, while euphemistic, were transparent codes universally understood:

  1.  **Article I, Section 2, Clause 3 (Three-Fifths Clause):** "Representatives and direct Taxes shall be apportioned... according to... the whole Number of free Persons... and... three fifths of all other Persons." Garrisonians argued that "all other Persons" was an unambiguous reference to enslaved people. The clause wasn't about abstract personhood; it was a cold political calculation granting slaveholding states disproportionate political power in Congress and the Electoral College *based on the human property they held*. To read it otherwise was willful blindness. The clause's *function* was explicitly proslavery, rewarding the slave system.
  2.  **Article IV, Section 2, Clause 3 (Fugitive Slave Clause):** "No Person held to Service or Labour in one State... escaping into another, shall... be discharged from such Service or Labour, but shall be delivered up on Claim of the Party to whom such Service or Labour may be due." Here, "Person held to Service or Labour" was the universal euphemism for a slave. The clause mandated federal complicity in the capture and return of fugitives, stripping free states of the power to offer sanctuary. Its *effect* was the violent enforcement of slavery across state lines. Garrisonians saw the euphemism not as ambiguity, but as the framers' attempt to avoid morally repugnant language while embedding the institution's protection.
  3.  **Article I, Section 9, Clause 1 (Slave Trade Clause):** "The Migration or Importation of such Persons as any of the States now existing shall think proper to admit, shall not be prohibited by the Congress prior to the Year one thousand eight hundred and eight..." "Such Persons" was universally understood to mean enslaved Africans. This clause explicitly barred Congress from ending the international slave trade for twenty years, a direct concession to slaveholding interests. The delay wasn't antislavery principle; it was pragmatic politics protecting an existing economic engine.

  Garrison's core argument was holistic: The Constitution *functioned* as a proslavery compact. Its euphemisms were a thin veil over a brutal reality. To pretend the text, read plainly in a vacuum, was neutral or even antislavery, was dangerous naivete that played into the hands of slaveholders who happily used the document's power while ignoring any latent idealism. The omission of the *words* "slave" or "slavery" was not a loophole, but a calculated evasion of moral responsibility.

  **The Douglassian Defense: Text as Potential**

  Douglass's mature position, influenced by legal thinkers like Lysander Spooner, countered with a rigorous focus on the text's semantic surface and stated purposes. He argued that the Garrisonians, by prioritizing inferred intent and historical context, effectively *amended* the Constitution to include the very terms it deliberately avoided. His strongest arguments focused on the text's *absence* and its *declared aspirations*:

  1.  **The Silence on Slavery:** Douglass hammered home the point: the words "slave," "slavery," "negro," or "African" appear nowhere. The framers, he argued, consciously employed circumlocutions – "other Persons," "Person held to Service or Labour," "such Persons." This wasn't accidental. It reflected discomfort and left the status of these individuals semantically ambiguous *within the legal framework of the document itself*. This ambiguity, Douglass contended, created space for reinterpretation and challenge.
  2.  **The Preamble's Aspirations:** "Establish Justice," "insure domestic Tranquility," "promote the general Welfare," and "secure the Blessings of Liberty." Douglass argued these stated purposes were fundamentally incompatible with the institution of slavery. A plain reading demanded the Constitution be interpreted *in favor* of these principles, not against them. The proslavery clauses, being exceptions grafted onto this aspirational foundation, should be interpreted as narrowly as possible.
  3.  **Clause-Specific Textualism:**
      *   **Three-Fifths:** Douglass focused on "Persons." The clause acknowledged enslaved individuals as persons for representation, undermining the property argument central to slavery. It was an imperfect, even repugnant, recognition, but it was a recognition nonetheless that could be leveraged. The clause didn't *create* slavery; it dealt with its political consequence.
      *   **Fugitive Slave Clause:** Douglass zeroed in on "Person held to Service or Labour" and "Service or Labour... due." He argued this language could encompass indentured servants and apprentices, not solely slaves. More importantly, it framed the relationship as one of contractual "service" owed, not absolute property. This opened arguments about due process, the rights of the "Person," and whether state laws creating permanent, hereditary chattel slavery truly constituted "Service or Labour" in the sense implied.
      *   **Slave Trade Clause:** Douglass noted the clause used "Migration or Importation of such Persons," not "importation of slaves." It also contained an explicit expiration date (1808), after which Congress possessed the power to prohibit the trade. This demonstrated slavery was *not* a permanent, constitutionally mandated institution, but one subject to federal regulation and eventual prohibition in this specific aspect.

  Douglass's core claim was that the Constitution, read strictly by its words and stated goals, provided no *positive* sanction for slavery. It only acknowledged its *existence* as a state institution and contained unfortunate compromises limiting *federal* power to interfere immediately. The text provided tools – the Preamble's ideals, the guarantees of due process (5th Amendment), the power to regulate commerce and suppress insurrections (which could include slave revolts, but also rebellions *against* federal authority defending slavery), and crucially, the amendment power – that could be wielded against slavery. The Garrisonian reading, he argued, surrendered these textual weapons.

  **Objection to Douglass: The Charge of Wishful Advocacy**

  The most potent objection to Douglass's textualism, as your historian noted, is that it borders on wishful advocacy. While the words "slave" and "slavery" are absent, the *intent* behind the clauses, understood universally at the time by framers, ratifiers, courts, and the public, was crystal clear. "Other Persons," "Person held to Service or Labour," and "such Persons" were not ambiguous terms in 1787 or 1850; they were universally recognized legal terms of art for enslaved people. The Supreme Court, in *Prigg v. Pennsylvania* (1842), had explicitly interpreted the Fugitive Slave Clause as a protection for slave property. To pretend otherwise in the 1850s was to ignore the lived reality under which the document operated. Douglass's reading, while morally powerful and strategically useful, required a willful suspension of historical understanding – an exegesis divorced from the document's actual historical function as a shield for slavery for over seven decades. It risked being an elegant theoretical argument powerless against the entrenched reality.

  **Verdict: Defensible Ambiguity, Functional Complicity**

  After weighing these powerful arguments, a qualified verdict emerges. **Douglass's textualist reading is defensible and strategically vital for the *Slave Trade Clause* and the *Preamble's ideals*, but ultimately fails to overcome the clear functional proslavery intent and operation of the *Three-Fifths* and especially the *Fugitive Slave Clause*.**

  1.  **Slave Trade Clause (Article I, Sec. 9):** Douglass's argument here is strongest. The clause explicitly uses "Persons," sets a clear time limit on Congressional inaction, and empowers Congress to ban the trade thereafter. This *is* a textual concession that slavery's expansion via importation was not a permanent right but a temporary, regrettable compromise subject to federal prohibition. The euphemism is less potent here because the clause's *mechanism* (a 20-year moratorium) aligns with the textual reading. Garrisonians rightly point to the proslavery *intent*, but the text itself provides the lever Douglass identified.
  2.  **Preamble:** The aspirational goals of Justice and Liberty *are* textually central and fundamentally antagonistic to slavery. Douglass was correct that abolitionists could and should wield these words as a moral cudgel against the compromises. This isn't wishful thinking; it's recognizing the power of foundational principles in political argument, even if they were hypocritically applied initially.
  3.  **Three-Fifths Clause (Article I, Sec. 2):** The Garrisonians have the stronger hand. While "other Persons" avoids "slave," the clause's *exclusive purpose* and *immediate effect* was to boost slaveholding power. Counting them as 3/5 for representation while denying them rights was a raw political deal *about slavery*, understood as such by all. Douglass's point about semantic "personhood" is philosophically interesting but practically nullified by the clause's explicit proslavery function.
  4.  **Fugitive Slave Clause (Article IV, Sec. 2):** This is the weakest ground for Douglass. "Person held to Service or Labour" was unequivocally understood as a slave. The clause mandates active state and federal complicity in rendition. Douglass's attempts to broaden the interpretation to include indentured servants or introduce due process arguments, while legally creative and morally compelling, strained against the clause's unequivocal historical purpose and application. The text, read plainly *in its operational context*, functions as a proslavery mandate. To argue otherwise *does* require ignoring the near-universal contemporary understanding and decades of enforcement. The Garrisonian indictment here is largely unassailable on functional grounds.

  **Conclusion: Text, Context, and the Battle for the Future**

  The great schism was more than biography; it was a fundamental clash over how to interpret a compromised text in a moral crisis. Garrison read the Constitution as it functioned – a bulwark of slavery. Douglass, in his maturity, read it for what its text *could* become – a weapon for freedom. While Douglass's textualism couldn't fully cleanse the Fugitive Slave or Three-Fifths clauses of their proslavery origins and operation, its brilliance lay in its future orientation. By forcing a confrontation between the text's silences, its euphemisms, its stated ideals, and the brutal reality of slavery, Douglass didn't just offer a different interpretation; he offered a radical strategy for reclaiming the Constitution's soul. He demonstrated that the text's very avoidance of naming slavery created an ambiguity that abolitionists could exploit, turning the framers' evasions into a platform for emancipation. His reading wasn't merely defensible exegesis; it was transformative advocacy, proving that even a document forged in compromise could be reinterpreted, through sheer moral and legal force, to serve the cause of justice. The verdict on the clauses is mixed, but the verdict on Douglass's strategic insight is clear: he found within the text's cold compromises the seeds of its own redemption.
