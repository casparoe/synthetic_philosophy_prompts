prompt: |-
  I am working on a piece that traces classic just-war reasoning into the era of automated combat, and I keep returning to G. E. M. Anscombe's 1956 pamphlet "Mr Truman's Degree." There she opposed Oxford's decision to award Harry Truman an honorary degree, arguing that the atomic bombings of Hiroshima and Nagasaki amounted to murder — the intentional killing of innocents that no amount of consequentialist bookkeeping about lives saved could excuse. The argument rested on the doctrine of double effect and on the theory of intentional action she set out in her 1957 book Intention, especially her insistence that the real object of an act cannot be relabelled away by appeal to some further good end it serves. Anscombe died in 2001, well before lethal autonomous weapons systems — which identify and engage targets without any human choosing the specific individual to be killed — became a live policy question. Working strictly from her own concepts rather than generic just-war talking points, how do you think she would have judged such systems, and would she even grant that the machine, as opposed to whoever designed or deployed it, can be said to "intend" anything at all?
reasoning: |-
  Okay, the user is working on a piece that connects Anscombe's just-war reasoning to automated combat systems. They specifically reference her pamphlet "Mr Truman's Degree" and her book "Intention." The core of their question is how Anscombe would judge lethal autonomous weapons systems (LAWS) using her own concepts, especially intentionality and double effect.

  First, I need to recall Anscombe's key arguments. She opposed Truman's honorary degree because the atomic bombings intentionally killed innocents, which she considered murder. Her stance relies on the doctrine of double effect (DDE) and her theory of intentional action. For her, the intention isn't just about the desired outcome but the act itself. So, if you bomb a city knowing civilians will die, you're intending their deaths, even if your goal is to end the war.

  Now, applying this to LAWS. These systems identify and engage targets without human intervention. The user asks two main things: whether Anscombe would consider the machine as "intending" anything, and how she'd judge the systems based on her concepts.

  Starting with machine intention. Anscombe's view is that intention requires a mind capable of practical reasoning. Machines don't have minds; they follow algorithms. So, the machine itself can't intend. The intention must lie with the humans who design, deploy, or authorize the system. The programmer sets the parameters, so any action by the machine reflects the programmer's intentions. If the system is designed to target without discrimination, that's on the designer.

  Next, applying DDE to LAWS. The doctrine allows unintended harm if proportional and necessary. But for Anscombe, if harm is foreseen and integral to the plan, it's intentional. With LAWS, when humans deploy such systems in environments with civilians, they know non-combatants might be killed. Since the machine's actions are part of the plan, any resulting civilian deaths could be seen as intended by the humans. The lack of direct human control doesn't absolve responsibility; it just distances the actor.

  The user also mentioned Anscombe's rejection of consequentialist justifications. She dismissed Truman's argument that bombing saved lives. Similarly, claims that LAWS reduce casualties through precision might be rejected if they involve intentional killing of innocents. The efficiency of the system wouldn't excuse it.

  Another point is the "description under which" an action is intentional. For LAWS, deploying the system in a civilian area means foreseeing civilian deaths. Under Anscombe's view, if you know your action will cause harm, and you proceed, you intend that harm. So, deploying LAWS in such contexts would likely be seen as intending civilian casualties, making it murder.

  The user might also be exploring how autonomous systems challenge traditional accountability. Anscombe would probably stress that responsibility lies with humans—designers, commanders, operators. The machine is a tool; the moral agent is the user or creator. She might argue that using LAWS in civilian areas inherently involves intending civilian deaths due to foreseeable errors.

  I should also consider if Anscombe would oppose LAWS categorically. Given her strict stance on intentionality, any system that can't distinguish combatants from non-combatants reliably would be problematic. Even with precise targeting, the risk of misidentification or collateral damage might not meet her criteria for avoiding intentional harm.

  Lastly, the user's deeper need might be to apply Anscombe's rigorous framework to modern tech dilemmas, showing how her principles challenge current military ethics. They might want to highlight the moral responsibilities in AI warfare, beyond just legal or consequentialist arguments.
answer: |-
  Based on Anscombe's core philosophical principles—especially her theory of **intention** and her stringent application of the **doctrine of double effect (DDE)**—her judgment of lethal autonomous weapons systems (LAWS) would likely be **uncompromisingly condemnatory**. Here's how her reasoning would unfold, strictly adhering to her concepts:

  ### 1. **The Impossibility of Machine "Intention"**
     - **Anscombe's View:** Intention, for Anscombe (*Intention*, 1957), is a *mental state* inseparable from *practical reasoning*. It involves acting under a description with an *aim* or *object* in mind. Machines lack consciousness, practical reason, and the capacity for moral deliberation. They execute algorithms, not intentions.
     - **Applied to LAWS:**  
       Anscombe would **categorically deny** that a machine can "intend" anything. The machine’s "target selection" is a mechanistic output of programming and sensor data, not a volitional act. The *real intention* resides **exclusively in the humans** who design, deploy, and authorize the system. The machine is a tool—albeit a complex one—and moral responsibility cannot be offloaded to it.

  ### 2. **Human Intention and the "Description Under Which"**
     - **Anscombe's View:** An act is intentional *under a description*. If a foreseen outcome is *instrumental* to achieving the goal, it is intended—even if regretful (*Mr Truman's Degree*). Truman’s bombing intended civilian deaths because destroying cities was the *means* to force surrender. Consequentialist justifications ("it saved lives") cannot redefine the act’s intentional structure.
     - **Applied to LAWS:**  
       When humans deploy LAWS, they **intend the system’s function**: to kill identified targets *without human intervention*. If the system operates in environments where non-combatants are present (e.g., urban areas), civilian deaths are **foreseen and accepted as part of the operational plan**. Crucially, *removing human oversight* from the kill decision makes civilian casualties **structurally integral** to the system’s use. For Anscombe, this means commanders *intend* these deaths—they are not mere "side effects." The act’s description is: "killing via a system that autonomously applies lethal force in complex environments."

  ### 3. **Doctrine of Double Effect (DDE) and LAWS**
     - **Anscombe's View:** DDE permits unintended but foreseen harm only if:  
       a) The act itself is good/neutral (e.g., attacking a military target),  
       b) The harm is not *intended* (neither as end nor means),  
       c) The harm is proportional to the good achieved.  
       She rejected applying DDE to Hiroshima/Nagasaki because civilian destruction was the *means* to victory.
     - **Applied to LAWS:**  
       - **Condition (a):** The act of deploying LAWS *might* be neutral if targeting is perfectly discriminate. But perfect discrimination is impossible in practice, and Anscombe would stress that deploying an *error-prone system* in civilian areas is itself a morally reckless act.  
       - **Condition (b):** **Civilian deaths become "intended as means"** because LAWS’ deployment *accepts foreseeable civilian killing as the cost of operational efficiency*. Human operators *rely* on the system’s ability to function amid civilians—thus, non-combatant deaths are instrumentally tolerated.  
       - **Condition (c):** Proportionality is irrelevant if (b) fails. Even if LAWS reduce *overall* casualties, Anscombe would dismiss this as consequentialist "bookkeeping" that ignores the intrinsic wrong of *intending* innocent deaths.

  ### 4. **The Moral Gravity of "Delegating" the Kill Decision**
     - Anscombe would see the **removal of human agency in target selection** as a profound evasion of moral responsibility. For her, the *soldier’s moment of choice*—where intention is formed—is non-delegable. LAWS transform killing into a pre-authorized outcome of algorithmic processes, severing the link between moral agent and act. This would compound the wrong: not only is harm intended, but its enactment is **depersonalized**, violating the gravity of taking human life.

  ### 5. **Conclusion: LAWS as Institutionalized Murder**
     - Anscombe would argue that using LAWS in any environment with non-combatants **necessarily involves the intentional killing of innocents** because:  
       a) Civilian deaths are foreseen and accepted as part of the system’s operation,  
       b) They result from a *deliberate choice* to outsource lethal decisions to a machine incapable of moral judgment,  
       c) No "greater good" justification can sanitize this intentional structure.  
       - She would likely declare LAWS **inherently immoral**, akin to Truman’s bombings—a form of **technologically mediated murder** facilitated by consequentialist sophistry. The designers, commanders, and operators bear full moral responsibility for all deaths caused by the system.

  ### Why This Differs from Generic Just-War Critiques
  While standard just-war theory focuses on *discrimination* and *proportionality*, Anscombe’s emphasis on **intention as action-description** cuts deeper. For her, LAWS aren’t just *risky* or *imprecise*—they redefine the act of killing itself in a way that **guarantees intentional harm to non-combatants** by design. Her verdict would be absolute: such systems are *intrinsically unjust* because they make the killing of innocents a *deliberate component* of military strategy, masked by the illusion of machine neutrality.
