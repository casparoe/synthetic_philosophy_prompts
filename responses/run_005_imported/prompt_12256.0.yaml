answer: |-
  ## The Dispositional Debate: Counterfactuals vs. Primitives

  **Characters:**
  *   **Dr. Analysia:** A Conditional Analyst (Lewisian Reformed)
  *   **Dr. Essentialis:** A Dispositional Essentialist

  **Setting:** A philosophy conference coffee break.

  **(Analysia sips coffee, looking intently at Essentialis)**

  **Analysia:** ...so you see, Martin’s electro-fink cases were a genuine challenge, I grant you that. A wire that’s live but stops conducting *the instant* it’s touched? Our old conditional analysis – "if touched, conducts" – failed spectacularly. But Lewis’s reformed analysis *solves* it. We require the disposition’s intrinsic **causal basis** – the wire’s molecular structure enabling conduction – to *persist* through the stimulus. The fink destroys that basis *during* the touching, so the counterfactual "if it *were* touched, it *would* conduct" is false for the live wire *with the fink present*, correctly describing it as non-conductive. The disposition isn't lost *before* the stimulus; its manifestation is sabotaged *during* it because the basis vanishes. The analysis tracks reality.

  **Essentialis:** (Nodding slowly) Clever, Analysia, clever. Finks attack the manifestation *process*. Your solution works *there* by tying the disposition to a persisting intrinsic structure. But what about Bird’s masking? Take your poison. Its intrinsic causal basis – its lethal molecular structure – is fully intact, persisting through the stimulus: ingestion. Yet, due to the simultaneously ingested antidote, the lethal effect is *masked*. The counterfactual "if ingested, it would cause death" is false. But the disposition itself, grounded in that intact structure, remains! Your reformed analysis, requiring only basis persistence through stimulus, falsely declares this masked poison *non-disposed* to lethality. It confuses the disposition’s existence with its manifestation being *prevented*.

  **Analysia:** Ah, but the antidote is an *external interferer*! The reformed analysis implicitly includes a *ceteris paribus* clause – other things being equal. The antidote violates that. We can refine: "If ingested *and no antidote is present*, it would cause death." The intrinsic causal basis *is* sufficient for lethality *in the absence of interferers*. The counterfactual, properly qualified, holds true for the masked poison – it *is* disposed to kill, *if* nothing interferes.

  **Essentialis:** (Leaning forward) And there lies the fatal flaw, Analysia. *Ceteris paribus*? What does "equal" mean here? *How* do you exhaustively specify the infinite set of possible maskers to exclude? Is it "no antidote, no protective force-field, no instant teleportation of the poison to a vacuum, no miraculous intervention..."? The list is open-ended, ad hoc, and ultimately circular! You're trying to exclude anything that would *mask the disposition*, but that just presupposes the very dispositionality you're trying to analyze. Masking shows that even with a perfectly persisting intrinsic causal basis and a satisfied stimulus, manifestation can be *externally blocked*. Your counterfactual, to be true, must magically exclude *all possible blockers*, which is impossible to specify non-circularly.

  **Analysia:** So your solution is to throw up your hands and declare dispositions primitive? "It just *has* the power to kill, end of story"? That feels like an explanatory dead end! What does "primitive dispositionality" *add*? How does it *explain* why the poison *would* kill without the antidote, or why the wire *would* conduct without the fink? My analysis provides a *structure* – persisting intrinsic basis leading to manifestation under stimulus, modulo external blockers. Yours just says "It’s got a lethal *quiddity*!" How is that better than labeling it with a name? It refuses to engage with the *mechanism* of how properties connect to effects.

  **Essentialis:** (Calmly) It’s not refusal; it's recognizing fundamental ontology. Masking cases *prove* that the disposition isn’t reducible to the counterfactual *plus* a list of exclusions, precisely because the exclusions are defined *in terms of the disposition itself*. The disposition is the *ground* of the counterfactual, not the other way around. The poison’s molecular structure *is* its lethal power. That power is an irreducible, categorical feature of that structure in this world. Saying it "would cause death if ingested without antidote" *reports* a consequence of that power under specific conditions, but it doesn't *analyze* the power away. Your "causal basis" *is* the dispositional essence! You’ve just renamed my primitive power "basis" and then tried to define *it* using counterfactuals conditioned on its own persistence. But masking shows the counterfactual *fails* even when the basis/power is fully present and intact. Your analysis is chasing its tail.

  **Analysia:** But without the counterfactual link, how do you *distinguish* a genuine lethal disposition from, say, a molecule that’s intrinsically identical but in a world with different laws where it *isn't* lethal? Or how do you explain the *directedness* of the disposition – its *aboutness* towards manifestation? My analysis connects the property to the specific effect it *tends* to produce. "Primitive dispositionality" seems inert, just a label.

  **Essentialis:** The laws *are* the manifestations of the dispositional essences of properties! That identical molecule *in this world* has the lethal power *because* of the essential dispositions of its constituents and the fundamental properties here. The directedness *is* primitive and irreducible – it’s how properties *are*. Your counterfactual analysis tries to build dispositionality out of non-dispositional bricks – pure categorical properties plus logic – but masking (and finks, handled differently) show those bricks are insufficient. You need dispositionality in the foundation. It *is* explanatory: it explains why objects behave as they do *in virtue of what they are*. Your analysis, when pushed by masking, either becomes circular or collapses. Mine accepts the fundamental reality of causal powers.

  **Analysia:** (Sighs, swirling her coffee) So, the poison *is* lethal, intrinsically, even when the antidote ensures no one ever dies from it? And this "lethality" isn't defined by what it *does* or *would do*, but just... *is*? I still see a refusal to explain the connection. But... (pauses) I concede masking exposes a deep tension in the reformed analysis. Specifying the *ceteris paribus* conditions non-circularly... remains elusive. Perhaps we need a more robust notion of the causal basis *itself* being dispositional...

  **Essentialis:** (Smiling slightly) Now you're drifting perilously close to my territory, Analysia. If the basis has its *own* dispositions... where does it end? Unless those dispositions are fundamental. The coffee, I fear, is getting cold. Shall we continue this over a refill? I believe there’s a vial of harmless liquid over there that *looks* like poison but has its lethality masked by... well, never mind.

  **Analysia:** (Chuckles dryly) Lead the way, Essentialis. Lead the way. But this conversation is far from masked.
