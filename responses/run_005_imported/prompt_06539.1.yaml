prompt: |-
  Quick grading sanity-check, if you don't mind. I'm teaching a grad metaethics seminar this term and gave a take-home question on fitting-attitude/buck-passing theories of value (take-home instead of in-class because I was away at a conference that week). These particular answers are always the hardest for me to grade fast, since a student can sound totally fluent in the jargon while still messing up something structural, and I dont fully trust myself to catch that on the fourth one in a row at 11pm.

  Here's the question, worth 20 points total (5 each for a-d):

  "Explain the 'wrong kind of reasons' (WKR) problem as it arises for buck-passing/fitting-attitude analyses of value. Your answer should (a) state the buck-passing analysis being targeted, (b) reconstruct a counterexample that generates the problem and say exactly how it does so, (c) explain the object-given/state-given distinction that's supposed to fix the analysis, and (d) say whether, in your view, the fix actually works."

  And here's the student's answer, copied exactly as submitted:

  "On the buck-passing view (associated with Scanlon), to call something good isn't to attribute some further reason-giving property, 'goodness,' to it -- it's to say the thing has other, more basic properties that give us reason to adopt pro-attitudes toward it: to desire it, promote it, admire it, and so on. The wrong-kind-of-reasons problem is a counterexample to this: imagine a demon who will torture you unless you come to admire him. You now have a reason to admire the demon, but the demon obviously hasn't thereby become admirable, so the buck-passing analysis, taken at face value, gets the wrong result -- it has to say the demon is good, since there's a reason to admire it. This is basically a restatement of Moore's open-question argument: Moore already showed that defining 'good' via some other property always invites the further question of whether that property is really good-making, and the demon case is just a vivid, reasons-based version of the same worry. The standard fix is to distinguish reasons that bear on whether the object merits the attitude (object-given reasons) from reasons that bear only on how good or bad it would be to be in the attitude-state itself (state-given reasons, like the demon's threat), and to stipulate that only object-given reasons count for buck-passing purposes. Once that restriction is built in, the demon case stops being a problem, since the demon only supplies a state-given reason, and those don't count -- so the fix fully vindicates buck-passing against this objection."

  Could you grade it out of 20 and give me the specific comments that back the grade up -- not a general vibe, but which sentences are earning the points and which ones are actually the problem. If it's easier on your end, feel free to hand it back as a little rubric (JSON's fine -- something like "setup," "counterexample," "distinction," "final verdict," each with a score and a one-line comment) rather than prose. Whatever gets me the most usable, line-level feedback, since I'll probably reuse this as the answer key for the rest of the stack.
reasoning: |-
  Okay, the user is asking for a detailed grading sanity check on a student's answer about the wrong kind of reasons problem in metaethics. They're teaching a grad seminar and want precise feedback to use as an answer key. 

  Hmm, the student's answer is actually quite strong at first glance—they nail the core concepts and structure. But let me slow down and check each component against the rubric. 

  First, for part (a): The buck-passing definition is textbook-perfect. They credit Scanlon, reject "goodness" as a reason-giving property, and correctly frame it as having properties that justify pro-attitudes. That's full marks. 

  For part (b): The demon counterexample is classic and well-reconstructed. But wait—they slip up by calling it a "restatement of Moore's open-question argument." That's misleading; WKR is structurally different from Moore's naturalistic fallacy. Gotta deduct there. 

  Part (c) is flawless: object-given vs state-given distinction is crystal clear, and they tie it perfectly to the demon case. No notes. 

  Part (d) is where it gets interesting. The student claims the fix "fully vindicates" buck-passing, but that's... overly optimistic. Scholarship is divided—Rabinowicz, Schroeder, and others have shown state-given reasons can sometimes *seem* object-given. Should dock points for oversimplification. 

  *Pauses to consider grading scale* 
  The user wants granularity, so breaking it into 5-point chunks makes sense. The Moore misstep costs 1.5 points (it's substantive but not catastrophic), and the verdict oversimplification another 1.5. That leaves 17/20—still an A-range grade. 

  *Double-checks fairness* 
  Am I being too harsh? No—grad students should know these nuances. The "fully vindicates" claim especially ignores ongoing debates. But credit where due: their phrasing is concise and shows real understanding. 

  *Muses on user's context* 
  The professor's tired—grading at 11pm, doubting their own focus. Smart to seek validation. I'll make the feedback extra-actionable so they can copy-paste comments onto other papers. Maybe suggest adding "see Rabinowicz (2006)" in the key for part (d).
