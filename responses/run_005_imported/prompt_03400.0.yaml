  First, I need to unpack the manager's argument. He's saying deadlines are more critical than meeting start times. But why? Deadlines often have downstream effects—other tasks, dependencies, client deliverables. But meetings? If they start late, it disrupts everyone's schedules, causes delays, and shows disrespect. The manager's tardiness isn't a one-off; it's a pattern. That erodes trust and sets a bad example. The teammate's late deliverable was a first-time occurrence, which makes the manager's reaction seem harsher in contrast.

  The user's deeper need might be validation. They feel this is unfair and want confirmation that their frustration is justified. They might also be looking for ways to address the double standard without escalating conflict. The team's shrugged acceptance indicates they've normalized the behavior, but it's still affecting morale. The user probably wants a resolution that restores fairness without putting anyone in the crosshairs.

  Considering the manager's possible motivations: maybe he's over-scheduled, poor at time management, or doesn't value meetings as much as deliverables. But his defensiveness when called out suggests he knows it's wrong. His rationalization is a way to avoid accountability. The power imbalance here is key—he can enforce rules for others but exempt himself.

  The user might need strategies to address this. They could document specific instances, approach the manager privately with examples, or suggest team norms. Framing it as a productivity issue rather than a personal critique might help. Emphasizing how punctuality in meetings affects deadlines could bridge the manager's false dichotomy. Also, highlighting the impact on team morale and efficiency could resonate.

  Ultimately, the manager's distinction doesn't hold up. Both are time commitments; both show respect. The hypocrisy is damaging team cohesion. The user needs actionable steps to foster change, whether through direct communication, involving HR, or setting team agreements. The goal is aligning the manager's actions with his expectations to create a respectful, productive environment.
answer: |-
  That's a completely valid frustration, and your manager's attempt to draw a distinction is **largely rationalization and hypocrisy.** While there *are* technical differences between meeting start times and deliverable deadlines, they don't excuse his chronic lateness or justify the double standard applied to your teammate. Here's the breakdown:

  1.  **The "Distinction" (His Argument):**
      *   **Deadlines:** Represent a hard commitment to deliver a specific output. Missing them *can* have tangible downstream consequences (delaying other work, impacting clients, missing contractual obligations, causing others to work late).
      *   **Meeting Start Times:** Are the scheduled beginning of collaborative time. While disruptive, the "output" (the meeting itself) still happens, just later. The consequences are often inefficiency and frustration rather than immediate project failure.

  2.  **Why His Distinction Doesn't Let Him Off the Hook (The Reality):**

      *   **Core Principle of Respect:** **Both involve disrespecting others' time.** Whether it's 20 minutes on a deliverable or 15 minutes at the start of a meeting, the message sent is: "My time is more valuable than yours, and your schedule is subject to my convenience." This erodes trust and morale.
      *   **Pattern vs. Isolated Incident:** Your teammate had a **first-time, minor** slip (20 mins). Your manager exhibits a **chronic, predictable pattern** (10-15 mins *every week*). Consistency matters. His behavior normalizes lateness and disrespect.
      *   **Leadership & Setting the Standard:** As a manager, his behavior sets the *de facto* standard for the team. By being consistently late himself, he implicitly communicates that punctuality isn't a core value, making his reprimand of your teammate seem arbitrary and unfair. "Do as I say, not as I do" is terrible leadership.
      *   **Impact of Meeting Lateness:**
          *   **Wasted Time:** 10 people waiting 10 minutes = nearly 2 hours of collective productive time wasted *per late meeting*. That adds up fast.
          *   **Disruption:** Throws off everyone else's schedules. People might miss parts of subsequent meetings, be late for other commitments, or have their focused work blocks interrupted.
          *   **Implied Hierarchy:** Reinforces an unhealthy power dynamic where the manager's time is implicitly deemed more important.
          *   **Reduced Meeting Effectiveness:** Starting late often means rushing through agendas or cutting discussion short, leading to worse outcomes.
      *   **Hypocrisy is the Core Issue:** Even *if* we accept his technical distinction (which is flimsy), the core problem is the blatant hypocrisy. He demands strict adherence to time commitments from his team while routinely violating them himself. This destroys credibility and fosters resentment (as your teammate clearly expressed).
      *   **The Power Imbalance:** He holds the power to reprimand your teammate. She (and the rest of the team) likely feel powerless to call him out directly on his lateness without potential repercussions, creating a sense of unfairness and powerlessness.

  3.  **Is He *Completely* Wrong About the Distinction?**
      *   *Technically, on paper, maybe?* A major deliverable deadline *can* sometimes have more severe *immediate, tangible* consequences than a single meeting starting late (though chronic meeting lateness has severe *cumulative* consequences).
      *   **BUT:** This minor technicality **in no way justifies** his chronic behavior, the double standard, the disrespect, or the impact on team morale and efficiency. It's a smokescreen to avoid accountability.

  **Conclusion:**

  *   **No, the distinction does NOT let him off the hook.** It's weak rationalization.
  *   **Yes, he is absolutely being hypocritical.** He is holding his team to a standard he refuses to meet himself.
  *   **His behavior is disrespectful and damaging to team culture and productivity.**

  **What Can You/Your Team Do? (Strategically)**

  1.  **Subtle Nudges (Low Risk):**
      *   **Start Without Him (Gently):** At the scheduled start time, someone (not the late person!) could say, "Since we're all here, shall we dive into [first agenda item] while we wait for [Manager]?" This normalizes starting on time.
      *   **End on Time, Always:** If he starts late, still end the meeting at the scheduled time. "Just a heads up, we need to wrap up by [scheduled end time] as I have another commitment." This protects your time.
      *   **Calendar Blocking:** Everyone visibly blocks the 10-15 minutes *after* his meetings on their calendars to protect their next time slot.

  2.  **Direct Feedback (Higher Risk, Needs Tact):**
      *   **Private, Respectful, Focused on Impact:** If you have rapport, you *could* say something privately: "Hey [Manager], I wanted to mention something I've noticed. When meetings start 10-15 minutes late consistently, it really throws off my schedule and makes it hard to meet my own deadlines effectively. I know things come up, but is there a way we could work towards starting closer to the scheduled time? It would really help the team's flow." *Focus on the impact on work, not the hypocrisy.*
      *   **Team Lead/Influencer:** If there's a trusted senior team member or lead, they could have this conversation.

  3.  **Address the Double Standard (Carefully):**
      *   This is trickier. If an opportunity arises naturally *after* he's been late again (like referencing deadlines), someone could say (calmly and professionally): "I understand deadlines are critical, and we're committed to hitting them. Consistency in respecting all time commitments, including meeting start times, definitely helps the whole team stay on track and focused." *Link the two concepts subtly.*

  4.  **Focus on Team Norms:**
      *   Suggest establishing team agreements: "To help us all stay efficient and respectful of time, could we agree as a team that we'll all aim to start and end meetings on time? That includes protecting the buffer before/after." Frame it as a collective effort, not singling him out.

  **The key is recognizing that your frustration is entirely justified.** His lateness is unprofessional and disrespectful, and his attempt to justify reprimanding someone else for a minor, first-time offense while displaying chronic disregard for others' time is classic hypocritical leadership. While changing his behavior might be difficult, you can subtly push back to protect your own time and sanity.
