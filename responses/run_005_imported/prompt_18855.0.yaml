answer: |-
  The argument crackles over the hum of the party. David, mid-sip, gestures with his glass towards Priya, who’s leaning against a bookcase.

  **David:** "...exactly, Priya. That's the whole *point* of the ability hypothesis. Mary *knew* all the physics, the neurophysiology, the exact wavelengths and retinal responses for 'red'. When she steps out, she doesn't learn *that* light of 650nm causes such-and-such brain state. She already knew *that*. What she gains is *know-how*: the ability to visually recognize red, to imagine it vividly, to sort those swatches instantly by hue. New skills, not new facts."

  **Priya:** (Setting down her wine, eyes sharpening) "Skills, David? Really? You reduce that staggering moment – ‘*So THIS is red!*’ – to mere parlor tricks? She *does* learn something new: she learns *what it is like* to see red. That’s knowledge, not just finger-dexterity."

  **David:** "But what *is* that ‘what it is like’? If physicalism is true – and we both agree it is – then ‘what it is like’ just *is* the physical state of her brain when stimulated by 650nm light. Which she *already* exhaustively described from her monochrome lab! She knew everything *about* that state. Gaining the ability to *trigger* that state in herself via normal vision, or to *recognize* its occurrence introspectively, doesn’t add a new *fact* to the universe. It adds a new *capacity* for accessing and utilizing facts she already possessed."

  **Priya:** "Ah, but that’s where your ‘exhaustive description’ falters. Did she *truly* know *everything* about that brain state? She knew its third-person specification, its causal role, its physical constitution. But knowing a brain state *as a brain state* is fundamentally different from *experiencing* it, from grasping it under a *phenomenal concept*."

  **David:** "Phenomenal concepts? Sounds suspiciously like qualia sneaking in the back door. If they’re just another physical concept, how do they add knowledge? If they *aren’t* physical, you’ve abandoned physicalism."

  **Priya:** (Leaning forward, intense) "No, they *are* physical concepts! But they’re *recognitional-indexical* concepts grounded *in* the experience itself. Before, she knew ‘State S = the brain state caused by 650nm light’. Now, she can think ‘*This* [experiencing] is what State S is like’. She acquires a new *mode of presentation* for the *same old physical fact*. It’s not a new fact *about the world*, but it *is* a new way for *her* to grasp that fact – a way fundamentally tied to subjective experience. *That’s* what she learns: how to mentally ‘point’ to the state using the experience itself."

  **David:** "But Priya, if the concept is physical and refers to the same state, how is grasping it via this ‘new mode’ *knowledge*? Isn't it just... having the state? Mary knew State S would occur upon seeing red. Now it occurs. She’s not *learning* State S exists; she predicted its occurrence perfectly! All that’s new is her *undergoing* it and developing abilities *based* on undergoing it. Saying she learns a ‘new way to grasp the fact’ just obscures that it’s the *having*, not the *knowing*, that’s novel."

  **Priya:** "The 'having' *enables* the new grasp! Think about it: before, could Mary *possibly* know, purely from her physical knowledge, what it would be like to see red? Could she deduce the *subjective character*?"

  **David:** "Of course not! But that’s because deducing subjective character *requires* having the relevant sensory apparatus and neural architecture *online*. It’s a limitation of *deduction*, not proof of non-physical knowledge. She couldn’t deduce the *sound* of a symphony from the score alone either, but hearing it doesn’t teach her new physics of acoustics – it teaches her auditory recognition."

  **Priya:** "But David, does she know *what it is like to be a bat* by knowing all its neurophysiology? Your view says yes, she knows everything *about* it, she just lacks the bat-abilities. But that seems absurdly thin. Knowing the bat’s brain state description doesn’t equate to knowing *what echolocation feels like from the inside*. Mary’s revelation about red shows that phenomenal concepts provide a unique, first-personal *understanding* of the physical state that purely descriptive knowledge lacks. It’s not a new *world-fact*, but it *is* a new *cognitive relation* to an existing fact."

  **David:** "And *that* new cognitive relation boils down to... new abilities! The ability to introspectively identify the state, to recall it vividly, to connect it emotionally. That’s the 'understanding' you speak of. It’s all know-how. Calling it ‘propositional knowledge grasped via a phenomenal concept’ is just dressing up abilities in epistemic clothing. Mary doesn’t learn *that* something is the case; she learns *how* to do something."

  **Priya:** "But the ‘how’ *feels* like discovering a profound truth! Because it *is* – it’s discovering the truth *as lived*, not just as described. You reduce the most intimate aspect of consciousness to behavioral capacities. I say she gains genuine knowledge *of* the intrinsic nature of her own physical state, accessed only through experience. The fact remains physical, the *access* is revolutionary."

  **David:** "Revolutionary for her psychology, absolutely. For her abilities, unquestionably. For the sum total of physical facts in the universe? Not one iota. Mary knew it all along. She just couldn’t *do* it."

  **Priya:** (Sighs, swirling her wine) "And I maintain that ‘knowing it’ in the abstract and ‘grasping it’ phenomenally are distinct epistemic achievements, both physical, yet worlds apart in what they mean *for the subject*. Mary doesn’t just gain skills; she gains *insight*."

  **David:** (Offering a conceding shrug) "Insight *is* a skill, Priya. A damned impressive one. But still... parlor tricks." He gives a wry smile. "Another drink? I suspect Mary would need one after all this."

  **Priya:** (Returning the smile, tension easing but resolve firm) "Perhaps. But I doubt even the finest Scotch would teach her what red *is like*. That requires... different tools." She taps her temple. "And concepts."
