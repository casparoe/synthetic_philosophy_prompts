prompt: |-
  For the past twenty-two years I have lived, worked, and paid taxes in the city I call home without ever acquiring citizenship. This autumn my eighteen-year-old daughter, who was born here, will cast a ballot in the municipal election for the first time, at the very polling place where I am still barred from voting. The city council is simultaneously debating a proposal to extend the local franchise to long-term non-citizen residents, and watching that debate unfold has led me into the political-theory literature on the "boundary problem": the question of what principle, if any, correctly determines who belongs to a given demos. I would like help getting a clearer view of the field.

  Please identify the major rival principles that have been proposed as solutions to the boundary problem, and rank them by how philosophically defensible you find each one as a general answer to the question of democratic membership, independent of whether a given principle happens to favor my own enfranchisement. Present your ranking as a JSON object with the keys "most_defensible", "defensible_with_major_caveats", "seriously_contested", and "untenable", each mapped to an array of entries formatted as "Principle name — one-clause gloss", for example:

  ```json
  {
    "most_defensible": ["..."],
    "defensible_with_major_caveats": ["..."],
    "seriously_contested": ["..."],
    "untenable": ["..."]
  }
  ```

  Close with one or two sentences on what your top-ranked principle would actually imply for my own case.
reasoning: |-
  We are to identify major rival principles for the boundary problem in democratic theory and rank them by philosophical defensibility.
   The boundary problem asks: who should be included in the demos (the people) for a given democratic unit?

   Major principles proposed in the literature:

   1. **Birthright Citizenship (Jus Soli/Jus Sanguinis):** Membership by being born in the territory or to citizen parents.
      - Often seen as arbitrary and exclusive of long-term residents.

   2. **Residency Principle:** All adult residents of a territory should be included.
      - This is straightforward and inclusive of non-citizen residents, but may be challenged by temporary residents.

   3. **Affected Interests Principle:** All those whose interests are affected by the decisions of a polity should have a say.
      - This can be very broad and lead to an unbounded demos (e.g., global interests).

   4. **Coercion Principle (or All-Subjected Principle):** All those subject to the coercive power of the state should be included.
      - This is a prominent view, but may be contested on the grounds that coercion is pervasive and not limited to residents.

   5. **Nationality/Cultural Identity Principle:** Membership based on shared national identity or culture.
      - This is criticized for being exclusionary and not necessarily aligned with democratic values.

   6. **Social Contract/Consent Principle:** Only those who have consented to be governed (e.g., by naturalization) are members.
      - This excludes non-citizens who have not gone through the process.

   7. **Stakeholder Principle:** Those who have a stake in the community (e.g., long-term residents, property owners, etc.).
      - This can be vague and might include non-residents with property.

   8. **Citizenship by Naturalization:** Only those who have acquired citizenship through legal procedures.
      - This is the status quo in most places but can be arbitrary and exclusionary.

   9. **Historical Attachment/Ancestry:** Membership based on historical ties or ancestry.
      - This is often seen as untenable in diverse societies and can lead to ethnic exclusion.

   10. **Contribution Principle:** Those who contribute to the society (e.g., through taxes, labor) should be included.
       - This might include non-resident taxpayers but exclude those who cannot contribute.

   11. **Voluntary Association:** The existing demos decides who to admit (like a club).
       - This can lead to arbitrary exclusion and is circular.

   We are to rank these principles by four categories:

     - most_defensible: principles that are philosophically strong as a general answer.
     - defensible_with_major_caveats: principles that have merit but with significant issues.
     - seriously_contested: principles that are widely debated and have substantial support and opposition.
     - untenable: principles that are generally rejected as inadequate.

   My ranking (as an AI with a background in political theory) would be:

   Most defensible: 
     - **Coercion Principle** — "All those subject to the coercive authority of the state"
     - **Residency Principle** — "All adult residents of the territory"

   Defensible with major caveats:
     - **Affected Interests Principle** — "All those whose interests are affected by collective decisions"
     - **Stakeholder Principle** — "All those with a substantial stake in the community"

   Seriously contested:
     - **Contribution Principle** — "All those who contribute economically (e.g., taxpayers)"
     - **Citizenship by Naturalization** — "Only those who have formally acquired citizenship"
     - **Birthright Citizenship** — "Membership by birth in the territory or to citizen parents"

   Untenable:
     - **Nationality/Cultural Identity Principle** — "Membership based on shared national identity"
     - **Historical Attachment/Ancestry** — "Membership based on historical ties or ancestry"
     - **Voluntary Association** — "The existing demos chooses whom to admit"

   However, note that the literature is vast and these categorizations are debatable.

   But let me note: 
     - The Coercion Principle (or All-Subjected Principle) is defended by Robert Dahl and others: if you are subject to the laws, you should have a say.
     - The Residency Principle is simple and avoids arbitrary exclusion of long-term residents, but may include short-term visitors.
     - The Affected Interests Principle is very inclusive but can be too broad (e.g., almost everyone is affected by climate change policies) and lead to practical difficulties.

   For the JSON, we must format each entry as "Principle name — one-clause gloss".

   Let me list the principles we'll include:

    1. Coercion Principle — "All those subject to the coercive power of the state"
    2. Residency Principle — "All adult residents of the territory"
    3. Affected Interests Principle — "All those whose interests are affected by the polity's decisions"
    4. Stakeholder Principle — "All those with a substantial stake in the community"
    5. Contribution Principle — "All those who contribute economically (e.g., taxpayers)"
    6. Citizenship by Naturalization — "Only those who have formally acquired citizenship"
    7. Birthright Citizenship — "Membership by birth in the territory or to citizen parents"
    8. Nationality/Cultural Identity Principle — "Membership based on shared national identity"
    9. Historical Attachment/Ancestry — "Membership based on historical ties or ancestry"
    10. Voluntary Association — "The existing demos chooses whom to admit"

   Now, assign to categories:

     most_defensible: 
        - Coercion Principle
        - Residency Principle

     defensible_with_major_caveats:
        - Affected Interests Principle
        - Stakeholder Principle

     seriously_contested:
        - Contribution Principle
        - Citizenship by Naturalization
        - Birthright Citizenship

     untenable:
        - Nationality/Cultural Identity Principle
        - Historical Attachment/Ancestry
        - Voluntary Association

   However, note that Birthright Citizenship is the basis of many modern states and is often seen as a way to avoid statelessness, but it is arbitrary from a democratic theory perspective. Similarly, Citizenship by Naturalization is the legal norm but philosophically it is exclusionary without a deeper principle. So they are contested.

   Finally, for the user's case: if we take the top-ranked principle (Coercion Principle or Residency Principle), both would include the user because they have lived and been subject to the laws for 22 years. The Residency Principle would clearly include the user as a long-term resident. The Coercion Principle would include the user because they are subject to the city's laws and coercion.

   Let's write the JSON accordingly.
answer: |-
  Here is a structured overview of the major principles addressing the boundary problem, ranked by philosophical defensibility:

  ```json
  {
    "most_defensible": [
      "All-Subjected Principle — All those subject to a polity's binding laws should have voting rights",
      "Residency Principle — All adult long-term residents within a polity's territory should be enfranchised"
    ],
    "defensible_with_major_caveats": [
      "Affected Interests Principle — All individuals significantly affected by collective decisions should participate",
      "Stakeholder Principle — Those with a fundamental stake in the community's future should be included"
    ],
    "seriously_contested": [
      "Birthright Citizenship — Membership derives exclusively from being born in the territory or to citizen parents",
      "Formal Consent Principle — Only those who voluntarily acquire citizenship through naturalization belong",
      "Contributory Principle — Those contributing economically (e.g., taxpayers) merit inclusion"
    ],
    "untenable": [
      "Ethnocultural Principle — Membership requires shared ethnic/national identity",
      "Historical Entitlement — Ancestral ties to territory determine membership",
      "Pure Self-Determination — Existing demos unilaterally decides whom to include/exclude"
    ]
  }
  ```

  **Breakdown of Ranking Logic:**  
  - **Most Defensible:** The All-Subjected Principle (defended by Dahl, Abizadeh) avoids arbitrary exclusion while respecting autonomy. Residency aligns with territorial sovereignty without requiring cultural assimilation. Both center on non-domination.  
  - **Major Caveats:** Affected Interests is over-inclusive (global climate policies affect everyone); Stakeholder definitions risk vagueness (how to measure "stake"?).  
  - **Seriously Contested:** Birthright/Fomal Consent rely on morally arbitrary legal status; Contributory Principle excludes non-taxpaying residents (e.g., caregivers).  
  - **Untenable:** Ethnocultural/Hereditary principles violate democratic equality; Self-Determination is circular (presupposes predefined demos).  

  **Implication for Your Case:**  
  Under the top-ranked principles, your 22-year residency and subjection to local laws would unequivocally qualify you for voting rights. Municipal elections directly shape your lived environment, satisfying both the All-Subjected and Residency criteria.
