prompt: |-
  Quick bit of context: at my company we started running a poll to settle which one big tech-debt project our team of about a dozen engineers tackles each quarter, since arguing about it live in meetings kept going nowhere. I threw together a little internal tool for it that does ranked-choice / instant-runoff voting: everyone ranks all six or so candidate projects from favorite to least favorite, and the tool eliminates whoever's got the fewest first-place votes each round and redistributes those ballots to next choices until one project is left standing. I specifically picked ranked-choice because I'd read it's supposed to be way harder to game than just going with whoever gets the most first-place votes, plus some actual cities use it for real elections so it seemed like the legit choice.

  Except last quarter one of our senior engineers, who's way more into game theory than the rest of us, told me afterwards that he'd deliberately ranked his actual second-favorite project dead last (below a couple things he genuinely didn't care about) instead of putting it second where it "honestly" belonged. According to him, doing that changed the order in which stuff got eliminated in the early rounds, which snowballed into his real favorite winning instead of loosing to his second choice in the final head-to-head. He wasn't even sneaky about it either, he pulled up the spreadsheet afterward and walked me through exactly why it worked. I mentioned this to a couple friends over drinks and we couldn't agree on whether it's fixable.

  Now I'm trying to figure out if this is a "me" problem, like I implemented IRV wrong or just need a smarter tiebreak rule somewhere, or if its something deeper. Would switching to a Condorcet method, or Borda count, or plain approval voting have closed off this loophole, or is there just no way to design a poll like this thats fully immune to someone voting "dishonestly" once they understand how the counting works? Kind of want to actually understand why, one way or the other, before I roll v2 of this out company-wide instead of just cargo-culting whichever method sounds fanciest on Wikipedia.
reasoning: |-
  Okay, the user is dealing with a problem with their ranked-choice voting system for tech-debt projects. Let me start by understanding what happened. They implemented instant-runoff voting (IRV), but a senior engineer manipulated the system by ranking his second favorite last. This strategic voting caused his actual favorite to win. The user is wondering if this is a flaw in their implementation, if they should switch methods, or if all voting systems have this vulnerability.

  First, I need to confirm that IRV is susceptible to tactical voting. The user mentioned that the engineer explained how ranking a strong contender last altered the elimination order. That's a known issue in IRV where burying a rival can change outcomes. The user might think they made a mistake in their setup, but the problem is inherent to IRV itself. I should explain why this happens—like how eliminating a candidate early can shift votes in subsequent rounds.

  Next, the user is considering other methods: Condorcet, Borda, or approval voting. I need to compare these. Condorcet methods look for pairwise winners but can have cycles. Borda uses point totals, which is simpler but vulnerable to strategic ranking. Approval voting allows voting for multiple options but can lead to bullet voting. Each has its own strategic vulnerabilities. The user's deeper need is to find a balance between fairness and practicality, minimizing manipulation without overcomplicating the system.

  The user's identity is someone in a tech company managing a team tool. They need a solution that's transparent and hard to game to maintain team trust. Their explicit question is about fixing the loophole, but the implicit need is ensuring the voting process is perceived as fair and effective, avoiding arguments and promoting team cohesion.

  I should outline the pros and cons of each alternative method. For example, approval voting is simpler but might not capture ranked preferences as well. Condorcet is robust but complex to explain. Borda is easy but manipulable. The user might prioritize simplicity and transparency since it's for internal use, not public elections.

  Also, considering the team size (about a dozen), some methods might be more manageable. Approval voting is straightforward to implement and understand. The user mentioned rolling out v2 company-wide, so scalability matters. They might prefer a method that's easy to communicate and administer.

  Another angle: the user might not need a perfect system but one that's "good enough" and resistant to common tactics. Emphasizing that no system is immune, but some are better in specific contexts. Recommending approval voting for its simplicity and lower incentive for burial, or Condorcet if they value Condorcet winners. Also, discussing cultural aspects—promoting honest voting and possibly randomizing selection if there's a tie, which adds unpredictability against strategy.

  Lastly, the user's frustration with meetings going nowhere led them to create this tool. They want to avoid recurring disputes. So, whatever method chosen should reduce conflict and be accepted by the team. Transparency in results and educating the team on honest voting could help. Maybe combining approval voting with a run-off if needed, but keeping it simple to prevent confusion.
answer: |-
  You've hit on a fundamental truth in social choice theory: **there is no perfect voting system.** Arrow's Impossibility Theorem mathematically proves that no ranked voting system can simultaneously satisfy all desirable fairness criteria (like "no incentive for strategic voting") when there are 3 or more options. What your senior engineer did is called **"burying"** or **"push-over"** strategy – a known tactical vulnerability in Instant-Runoff Voting (IRV).

  Here's the breakdown:

  1.  **You Didn't Implement IRV Wrong:** This is an inherent flaw in IRV, not your implementation. IRV fails the **"Later-no-harm" criterion** (ranking a candidate higher shouldn't harm your preferred candidate). By burying his strong 2nd choice, the engineer *prevented* that project from accumulating votes early and potentially eliminating his *true* favorite prematurely. His "buried" project acted as a spoiler for other ballots, changing the elimination order to favor his real top choice.

  2.  **Why It Worked:** IRV eliminates the candidate with the *fewest first-place votes* each round. If Candidate A (Engineer's true favorite) is vulnerable to being eliminated early because it has passionate support but few 1st-place votes, while Candidate B (his strong 2nd) has broad but shallow support (many 2nd place votes), eliminating a *different* candidate first (like one of the "didn't cares") can cause votes to flow in a way that benefits A later. Burying B ensures B *doesn't* get the chance to knock out A early or absorb votes that could later help A.

  3.  **Can Other Methods Close the Loophole? (Spoiler: Mostly No, but they change the game):**
      *   **Condorcet Methods:** These find the candidate that beats every other candidate in a head-to-head matchup (the Condorcet Winner).
          *   **Pros:** Highly resistant to the *specific* "burying" strategy used against IRV. If a candidate is the Condorcet Winner, they should win under most Condorcet methods regardless of burial tactics.
          *   **Cons:** Susceptible to *other* strategies like **"compromising"** (ranking a less-likely-to-win favorite above your true favorite to prevent a worse outcome) or **"burying"** in specific, complex cycle scenarios. They can also produce **cycles** (A beats B, B beats C, C beats A), requiring complex tiebreakers that themselves can be gamed. Explaining results is harder than IRV. *Verdict:* Fixes *this specific* IRV flaw but opens different strategic possibilities and complexity.
      *   **Borda Count:** Assigns points based on rank (e.g., 1st=6pts, 2nd=5pts...6th=1pt). Highest score wins.
          *   **Pros:** Simple to understand and count. Less vulnerable to the *specific* "burying" strategy used in IRV (burying a strong 2nd hurts it significantly, likely hurting your own outcome if it was genuinely strong).
          *   **Cons:** **Extremely vulnerable to strategic voting.** The optimal strategy is often **"burying" your strongest rivals** *and* **"truncating"** (not ranking candidates below your favorites). It heavily favors compromise candidates and can be easily manipulated by small groups. Fails the Condorcet criterion (the Condorcet Winner might not get the highest Borda score). *Verdict:* Arguably *more* manipulable than IRV in practice.
      *   **Approval Voting:** Voters can "approve" as many candidates as they want. Most approvals wins.
          *   **Pros:** Simple, fast, hard to game *in small elections with informed voters*. Encourages compromise. Immune to the "burying" strategy (you can approve both your favorite *and* your strong 2nd).
          *   **Cons:** Vulnerable to **"bullet voting"** (approving *only* your absolute favorite) as a strategy, especially if voters perceive others will approve multiple candidates. Doesn't capture strength of preference (ranking). A candidate disliked by 51% but loved by 49% loses to a candidate found acceptable by 60% but loved by no one. *Verdict:* Eliminates the *specific* IRV "burying" issue but introduces "bullet voting" as a potential counter-strategy. Often a practical choice for simplicity.

  4.  **The Uncomfortable Truth: Immunity is Impossible.** No deterministic voting system using ranked or rated ballots is immune to all forms of strategic voting when there are 3+ options. Voters with good information about others' preferences *can* sometimes benefit by not voting honestly. The *type* of strategy changes depending on the system.

  **Recommendations for Your Situation:**

  1.  **Stick with IRV & Promote Honesty:** IRV is still vastly better than FPTP (First-Past-The-Post / most 1st-place votes). Explain the "burying" vulnerability to the team. Emphasize that *in most real-world scenarios, especially with honest voting*, IRV produces good results. Encourage engineers to vote honestly for the collective good. The risk of manipulation is lower if people don't know the exact state of the polls (which they shouldn't until *after* voting closes).
  2.  **Consider Approval Voting for Simplicity & Robustness:** If you want to minimize the *incentive and impact* of strategic voting and prioritize simplicity:
      *   **Pros:** Very easy to understand, implement, and vote. Harder to justify strategic voting ("Why *wouldn't* you approve your strong 2nd?"). Reduces the "spoiler effect" dramatically. Immune to IRV-style burial.
      *   **Cons:** Loss of ranking nuance. Risk of bullet voting (mitigated by team culture emphasizing honest approval of all acceptable options).
  3.  **Consider Condorcet (e.g., Schulze Method) if Robustness is Paramount:** If you have a theory-savvy team and want the most mathematically robust result against burial strategies:
      *   **Pros:** Finds the strongest consensus candidate (Condorcet Winner) if one exists. Highly resistant to the IRV burial tactic.
      *   **Cons:** More complex to explain and compute. Needs good cycle resolution rules. Still vulnerable to *some* strategies.
  4.  **Avoid Borda Count:** Its manipulability generally makes it a poor choice for consequential decisions.
  5.  **Key Implementation Tweaks (Regardless of Method):**
      *   **Blind Voting:** Ensure no one knows the intermediate results or even the current front-runners *before* voting closes. This drastically reduces the *information* needed to strategize effectively.
      *   **Clear Communication:** Explain the chosen method simply and why it was picked ("finds broad consensus," "reduces spoiler effect").
      *   **Promote Honesty:** Frame voting as a collaborative effort to find the best project for the *team*, not a game to win individually.
      *   **Robust Tie-Breaking:** Have a clear, predefined, random tie-breaker (e.g., alphabetical order, coin flip, manager discretion as last resort). Document it. Randomness makes gaming the tie-break impossible.
      *   **Transparency *After*:** Publish the full ballot data (anonymized) and the counting steps after the decision is made. This builds trust and allows the game-theory enthusiast to verify the result without enabling pre-vote strategy.

  **Conclusion:** Your IRV implementation isn't broken; it exposed a known theoretical weakness. While no system is immune to strategy, **Approval Voting is likely the best practical choice for your internal tech-debt poll.** It eliminates the specific "burying" vulnerability of IRV, is simple to use and understand, and strongly incentivizes honest voting ("approve everything you find acceptable"). Switching to Condorcet (Schulze) is the most robust theoretical option if complexity isn't a barrier. Avoid Borda. Regardless of the method, emphasize blind voting, honesty, and post-vote transparency. You can't eliminate strategy entirely, but you can make it harder, less rewarding, and culturally discouraged.
