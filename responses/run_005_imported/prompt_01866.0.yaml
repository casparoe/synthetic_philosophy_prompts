answer: |-
  You've nailed the core puzzle in this dense passage - Bentham is making a layered, razor-sharp utilitarian critique of anti-gay moralists. Let's break it down sentence-by-sentence, addressing your specific questions about logical structure and "philosophical pride":

  ### Sentence-by-Sentence Breakdown
  1.  **"Philosophical pride, to say nothing at present of superstition, has hitherto employed itself with effect in setting people a-quarrelling with whatever is pleasurable even to themselves..."**
      *   **Meaning:** Bentham identifies a *secular* motive beyond religion ("superstition"): intellectual arrogance. "Philosophical pride" refers to moralists who build abstract ethical systems detached from human experience. This pride drives people to *reject pleasure itself* as unworthy, even when *they* experience it.
      *   **"Philosophical pride" vs. Superstition:** This is **distinct** from religious motives. It's the hubris of philosophers/moralists who believe pure reason alone dictates morality, ignoring pleasure/pain as the foundation of good/bad. They see pleasure as base, needing suppression for "higher" virtue.

  2.  **"...and envy will always be disposing them to quarrel with what appears to be pleasurable to others."**
      *   **Meaning:** Bentham adds a psychological motive: envy. Seeing others experience pleasure (especially pleasure condemned by "pride") provokes resentment. Moralists attack others' pleasures partly because they resent the enjoyment itself.

  3.  **"In the notions of a certain class of moralists we ought, not for any reason they are disposed to give for it, but merely because we ought, to set ourselves against every thing that recommends itself to us under the form of pleasure."**
      *   **Meaning:** He summarizes the moralists' flawed position. Their core belief is: *Pleasure is inherently suspect; we must oppose it simply because it is pleasure.* They offer no *real* justification based on consequences (pain); opposition is a categorical imperative ("because we ought").

  4.  **"Objects, it is true, the nature of which it is to afford us the highest pleasures we are susceptible of are apt in certain circumstances to occasion us still greater pains."**
      *   **Meaning:** Bentham grants a *potential* utilitarian objection. Some pleasures (like sex, wealth, power) *can* lead to greater pains (disease, ruin, conflict) under risky circumstances. This *could* be a valid reason for caution.

  5.  **"But that is not the grievance: for if it were, the censure which is bestowed on the use of any such object would be proportioned to the probability that could be shewn in each case of its producing such greater pains."**
      *   **The Core Logical Test:** Here's the answer to your key question. **This is absolutely a logical test Bentham thinks the moralists fail.**
          *   **IF** the moralists' *real* objection was based on the *painful consequences* of pleasure...
          *   **THEN** their level of condemnation ("censure") would logically **scale proportionally** to:
              *   The **probability** that the specific pleasure *actually causes* that greater pain.
              *   The **severity** of that potential pain.
          *   A consistent utilitarian would condemn risky pleasures *only* based on this risk assessment. E.g., condemning unprotected sex with strangers because of STD risk, not condemning *all* sex.

  6.  **"But that is not the case: it is not the pain that angers them but the pleasure."**
      *   **The Knockdown Conclusion:** Bentham states the moralists fail his test. Their outrage **isn't** proportional to demonstrable risk. They condemn the pleasure *itself* (e.g., gay sex) regardless of whether it *actually* causes harm to others or even to the participants in specific circumstances. Their anger is directed at the *existence of the pleasure*, not its consequences. This proves their motive is irrational (pride, envy, or superstition) and fundamentally *anti-utilitarian*.

  ### Addressing Your Specific Questions

  1.  **Is the "proportioned to probability" bit a logical test?**
      *   **Absolutely yes.** This is the heart of Bentham's argument here. He's applying his utilitarian calculus as a *standard of consistency*. If moralists were genuinely concerned about harm (pain), their condemnation would vary based on *evidence* of harm and *probability*. Their failure to do so exposes their true motive: an irrational hatred of pleasure itself. It's not just rhetoric; it's a demonstration of their logical inconsistency using *their own claimed premise* (preventing harm). They claim to act against pain but act against pleasure.

  2.  **What is "philosophical pride" and how does it differ from superstition?**
      *   **"Philosophical pride"** refers to the intellectual arrogance of secular moral philosophers (think Kantian deontologists or ascetic Stoics, though Bentham doesn't name them). It's the belief that morality is derived from pure reason, abstract principles, or notions of "inherent virtue/vice," *independent* of consequences like pleasure and pain. They see pleasure as lowly, animalistic, or corrupting to the "higher" rational self. Suppressing pleasure becomes a sign of moral/intellectual superiority.
      *   **Distinction from Superstition:** "Superstition" explicitly refers to *religious* dogma (e.g., "God forbids it, so it's sinful"). Bentham sets this aside ("to say nothing at present") to focus on *secular* moralists who *should* know better. While both lead to condemning pleasure, "philosophical pride" stems from intellectual vanity and a rejection of empiricism (measuring pleasure/pain), whereas "superstition" stems from faith in divine commands or irrational fears. They are different sources of the same anti-utilitarian impulse.

  ### What Move is Bentham Pulling Off?
  Bentham is executing a classic utilitarian takedown:

  1.  **Expose the Hidden Motive:** He identifies the *real* drivers behind the condemnation of gay sex (and other "irregular" pleasures): not concern for harm, but "philosophical pride" (irrational rejection of pleasure on principle) and "envy" (resentment of others' enjoyment).
  2.  **Demonstrate Inconsistency:** He grants a *potential* utilitarian justification for caution (pleasure *can* lead to pain), but then shows the moralists *don't* apply utilitarian reasoning. If they did, their censure would be *proportional to the demonstrable risk of harm*. It isn't.
  3.  **Prove the Target is Pleasure Itself:** The clincher: Their outrage is triggered by the *pleasure* itself, regardless of whether it causes pain. This proves their position is fundamentally irrational and hostile to the core utilitarian principle that pleasure is good.
  4.  **Undermine Their Authority:** By showing their arguments are inconsistent and driven by bias, not reason or genuine concern for welfare, he strips their moral condemnation of any intellectual legitimacy. They aren't protectors of society; they are enemies of human happiness driven by pride and spite.

  **In essence:** Bentham uses the moralists' *own* purported concern about "harm" against them. By showing their reaction is wildly disproportionate to any *actual* measurable harm (risk/probability), he proves their condemnation isn't about harm at all – it's an irrational attack on pleasure itself, fueled by "philosophical pride" and "envy." This is a powerful logical and rhetorical move within his utilitarian framework.
