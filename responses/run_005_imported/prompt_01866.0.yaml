  I've been going down this rabbit hole lately, teaching myself about old philosophy stuff in my spare time (no classes or anything, literally just me and whatever I can dig up online), and I found out that Jeremy Bentham - the utilitarianism "greatest happiness" guy - secretly wrote a whole essay back in the 1780s called "Offences Against One's Self" arguing that gay sex shouldn't be punished, basically running the numbers on pleasure and pain like he does with everything else. (He uses the old term "paederasty" for it, which back then was more of a catch-all for male-male sex in general, following the old Greek usage, not the narrower thing that word implies today, just so that's clear.) Apparently it was too explosive even for him, since he never published it in his own lifetime. I dug up the actual text and can mostly follow it even though the sentences are all tangled up in that old-timey style, but theres one bit, where he's trying to figure out why people are so desperate to punish these "irregularities of the venereal appetite," that I've reread a bunch of times and still can't fully untangle:

  "Philosophical pride, to say nothing at present of superstition, has hitherto employed itself with effect in setting people a-quarrelling with whatever is pleasurable even to themselves, and envy will always be disposing them to quarrel with what appears to be pleasurable to others. In the notions of a certain class of moralists we ought, not for any reason they are disposed to give for it, but merely because we ought, to set ourselves against every thing that recommends itself to us under the form of pleasure. Objects, it is true, the nature of which it is to afford us the highest pleasures we are susceptible of are apt in certain circumstances to occasion us still greater pains. But that is not the grievance: for if it were, the censure which is bestowed on the use of any such object would be proportioned to the probability that could be shewn in each case of its producing such greater pains. But that is not the case: it is not the pain that angers them but the pleasure."

  Could you walk me through what he's actually doing in this paragraph, like sentence by sentence? Specifically I can't tell if that bit about censure being "proportioned to the probability... of producing greater pains" is supposed to be an actual logical test he thinks moralists fail (like, a genuinely consistent utilitarian would only object in proportion to the real expected harm, and moralists don't do that so they're being inconsistent), or if its more just a rhetorical dig without much real argumentative weight behind it. Also, what does "philosophical pride" mean to him exactly here - is that meant to be a different failure mode than the religious motives he was just talking about right before this passage, or is it basically another name for the same underlying thing dressed up differently? I get the general utilitarian framework fine, pleasure good, pain bad, I just can't pin down exactly what specific move he thinks he's pulling off against his opponents in this particular bit.
