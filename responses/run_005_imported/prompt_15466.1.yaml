answer: |-
  Here’s a toast that threads the needle – honoring Marion’s philosophy while keeping it warm, personal, and celebratory, clocking in around five minutes:

  **(Clink glass gently, warm smile)**

  "Good evening, everyone. For those who don’t know me, I was Marion’s intern a… well, let’s just say *fewer* than thirty-eight years ago. My first day, Marion looked up from her desk – that fortress of files and Post-its – fixed me with *that* look, and said, ‘Your job is to make my job easier. Try not to make it harder.’ *(Pause for knowing chuckles)*. A classic Marion welcome: direct, efficient, and oddly reassuring because you instantly knew where you stood.

  "Many of us here sat in Marion’s infamous ‘ethics seminar.’ You remember the one. The room would get very quiet, very fast. She’d present this scenario: Two reporters. Identical tip. Identical legwork. Identical stories filed with clean consciences. Then… luck. One tip holds, wins prizes. The other crumbles through no fault of the reporter, and someone gets hurt. Then came the question: ‘Who deserves the bigger raise?’ *(Pause, scan the room knowingly)*. Hands would creep up for the prize-winner. And then… Marion would spend the next hour gently, relentlessly, making us squirm. Because she knew, deep down, we were judging the *result*, not the *work*.

  "That seminar wasn’t just about journalism; it was a masterclass in Marion’s entire worldview. Philosophers like Williams and Nagel called it ‘moral luck’ – this unsettling idea that praise and blame often land based on things utterly outside our control: the tip that holds, the source that remembers accurately, the market that booms or busts *after* a story runs. Marion understood this deep in her bones. Her whole career has been a standing argument – no, a *living demonstration* – against judging journalists, judging *anyone*, solely by the luck of the outcome. Judge the process. Judge the diligence. Judge the character.

  "And Marion, true to form, took this philosophy to its most challenging, most *her* conclusion. For decades, she’s operated on a principle that would baffle most people and make Williams and Nagel nod grimly: She’d quietly, firmly, deflect any praise for the calls that *happened* to turn out well. ‘We did the work,’ she’d shrug. ‘The rest was the wind.’ But… *(lean in slightly, more serious tone)*… she would just as quietly, just as firmly, *accept* the blame for the ones that didn’t, even when the collapse was genuinely beyond what any reasonable diligence could have caught. That asymmetry – taking the hit but deflecting the halo – drove philosophers nuts because it seems unfair. But for Marion? It was pure integrity. It was about owning the *process*, the *effort*, the *intent*, regardless of the fickle hand of luck. It was about ensuring the judgment landed only where it was truly deserved: on the choices she *did* control.

  "So, how *do* we toast Marion Voss tonight? We absolutely cannot stand here and say, ‘Marion, your career was brilliant because so many of your gambles paid off!’ She’d give us *that look* – sharper than any editorial blue pencil – and rightly so. That’s judging the luck, not the journalist. But we also can’t tip into the abyss and say, ‘Well, Marion, nothing was *really* yours after all, was it?’ That denies the incredible force of will, the meticulous rigor, the unwavering moral compass she brought to her desk *every single day* for thirty-eight years.

  "No. We toast the *choices* she made that were *always* within her control. We toast the reporter who taught us that digging deeper isn't optional, it's sacred. We toast the editor whose red pen was fierce but always fair, always aimed at making the story *truer*, not just easier. We toast the mentor who terrified interns (like me!) not with cruelty, but with the terrifying expectation that we could, and *should*, be better. We toast the colleague who stayed late not just to chase a scoop, but to make sure a source was handled right, or to talk a junior reporter off a ledge after a tough day. *(Voice softens slightly)* We toast the woman whose quiet acceptance of blame wasn't self-flagellation, but a profound commitment to accountability – a commitment that made the rest of us want to be more accountable too.

  "Marion, you built a career not on the shifting sands of luck, but on the bedrock of character. You judged yourself – and taught us to judge ourselves and our work – by the only things that truly matter: the rigor we applied, the ethics we upheld, the care we took, and the courage we mustered. You showed us that focusing on *that* is how we build something lasting, something worthy of respect, regardless of which way the wind blows.

  "So, raise your glasses, everyone. To Marion Voss: **May our processes always honor your example, may our characters strive to match yours, and may the luck – well, may it simply find us doing the work as well as you taught us to do it.** Cheers to Marion!"

  **(Hold eye contact with Marion, warm smile, raise glass high: "To Marion!")**

  **Why this works:**

  1.  **Grounds the Philosophy in Anecdote:** Starts with a personal, slightly funny story ("that look"), immediately grounding the abstract in the familiar Marion.
  2.  **Explains Moral Luck Clearly (for the family):** Uses the seminar story to explain the core concept simply and vividly without jargon. Explicitly names Williams/Nagel but focuses on Marion's *use* of it.
  3.  **Honors Her Asymmetry:** Directly addresses her refusal of praise and acceptance of blame, framing it as her unique, challenging brand of integrity ("pure integrity," "profound commitment to accountability") rather than philosophical angst. Links it back to the core principle of judging only the controllable.
  4.  **Avoids Both Pitfalls:**
      *   *Not praising results:* Explicitly states we *can't* praise her for lucky outcomes and frames the toast around her controllable choices and character.
      *   *Not denying agency:* Emphasizes the "force of will," "rigor," "moral compass," "choices" – all things within her control. The final toast focuses entirely on her virtues and process.
  5.  **Balances Warmth & Weight:** Includes humor (the intern story, "that look"), personal touches (her mentorship, her support), and heartfelt admiration ("bedrock of character"). The "teary" moment comes from acknowledging her impact and integrity, not sentimentality.
  6.  **Focuses on Legacy:** Concludes by framing her career as a lesson in building something lasting based on process and character, which feels celebratory and uplifting.
  7.  **The Actual Toast Line:** The final lines encapsulate her philosophy ("processes honor your example," "characters strive to match yours") while wishing her well in a way that reflects her values ("may the luck... find us doing the work as well as you taught us"). Ending with "Cheers to Marion!" is simple and unifying.
  8.  **Respects the Room:** The philosophy is explained accessibly. Colleagues will nod at the seminar reference and her principles. Family hears stories about her impact, integrity, and the deep respect she commands. Publishers hear about rigor, ethics, and building something lasting.

  This toast celebrates Marion *for who she is and what she stood for*, precisely *by* embracing the ethical framework she lived by, without letting the philosophy overshadow the person or the celebration.
