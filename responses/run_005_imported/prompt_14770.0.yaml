prompt: |-
  I cover science and ideas for a living, and I'm working on a piece about the intellectual pedigree of Robin Hanson's "futarchy" — his proposal that citizens vote on which welfare metric a government should maximize, then let conditional prediction markets decide which policy will actually maximize it, a scheme he sums up as "vote on values, but bet on beliefs." It strikes me that the scheme's two halves land squarely on the two results the Marquis de Condorcet is best remembered for: his Jury Theorem, which shows that majorities of independent, only moderately competent voters converge reliably on the truth as a group grows larger, and the Condorcet paradox, which shows that majority rule over preferences can cycle indefinitely with no stable outcome at all. Suppose Condorcet could examine a real, functioning futarchy market today. Would he see betting markets as an advance on jury-style aggregation for the "beliefs" half, given that traders watch prices and each other rather than judging independently, and that who bothers to trade is self-selected rather than random? And would he conclude that the "values" half has genuinely escaped his paradox, or simply relocated it into the choice of metric and market design? Please ground your answer in Condorcet's actual arguments about probability, reason, and enlightened self-government, rather than a generic gloss on his optimism about progress.
reasoning: |-
  Okay, the user is working on a piece about the intellectual pedigree of Robin Hanson's "futarchy" and wants to explore how Condorcet would view it. They specifically connect futarchy's two halves to Condorcet's Jury Theorem and his paradox. Let me break this down.

  First, the user mentions Condorcet's Jury Theorem for the "bet on beliefs" part. Hanson's idea uses prediction markets instead of independent voters. Condorcet emphasized independence and competence in the Jury Theorem. But prediction markets involve traders watching each other and prices, which might undermine independence. Also, traders are self-selected, not a random sample. Condorcet might worry about herding and biased participation. So, he'd probably see markets as a step back for aggregating factual beliefs because they lack the independence he deemed crucial.

  Next, the "vote on values" part is supposed to avoid the Condorcet paradox. But Condorcet might think that the paradox just moves to choosing the welfare metric. Designing that metric involves value trade-offs, which could lead to cyclical preferences again. Plus, market design choices (like what to measure) are value-laden. Condorcet wanted rational deliberation to resolve conflicts, but futarchy offloads that to voting on metrics, which might not solve the deeper issues of preference aggregation.

  The user is a science and ideas writer, so they need a nuanced analysis grounded in Condorcet's actual theories. They might want to highlight the tension between modern mechanisms and Enlightenment ideals. Their deeper need could be to critically assess futarchy's claims by testing it against historical thought, showing whether it truly resolves age-old problems or just repackages them.

  I should ensure references to Condorcet's works, like the Essai and the Paradox paper. Emphasize his belief in deliberation and reason over markets. Also, note how his optimism about education contrasts with futarchy's market reliance. Conclude that Condorcet would see futarchy as a risky departure from his vision of collective reason, both in belief aggregation and value resolution.
answer: |-
  Based on Condorcet's core principles of probability, collective reason, and the requirements for enlightened self-government, his examination of a functioning futarchy would likely yield a critical assessment, finding significant departures from his ideals in both halves of the scheme:

  1.  **Betting Markets vs. Jury-Style Aggregation (Beliefs): Condorcet Would See Markets as a Step Backward**
      *   **Violation of Independence (The Core Flaw):** Condorcet's Jury Theorem relies *absolutely* on the *independence* of judgments. Traders in prediction markets explicitly *do not* judge independently. They constantly monitor prices, news, and the actions of others ("watching each other"). This creates herding, information cascades, and momentum trading – phenomena fundamentally at odds with independence. Condorcet would see this interdependence as fatally undermining the theorem's guarantee of convergence to truth as group size increases. The market becomes vulnerable to groupthink, manipulation, and transient fads, precisely because judgments are not independent.
      *   **Self-Selection vs. Random Sampling:** The Jury Theorem assumes a randomly selected (or representative) group of minimally competent individuals. Self-selected traders are a highly non-random subset. They are disproportionately those with capital, risk tolerance, specialized knowledge (or overconfidence), specific ideological leanings, or even manipulative intent. Condorcet, who emphasized education and broad participation as prerequisites for rational decision-making (*Esquisse d'un tableau historique des progrès de l'esprit humain*), would view this self-selection as introducing significant and potentially dangerous biases. The market aggregates the beliefs of the *willing and able to trade*, not a representative sample of competent citizens. This skews the "belief" aggregation away from the broader societal epistemic resource Condorcet valued.
      *   **Probability as Subjective vs. Objective Truth-Seeking:** While Condorcet was a pioneer in subjective probability, his work on voting/juries framed probability as a tool for approximating an *objective truth* ("Which policy *will* maximize welfare?"). Prediction markets aggregate *subjective probabilities* expressed through bets, influenced by risk preferences, liquidity needs, and speculative motives, not pure belief in truth. Condorcet would worry that the market price reflects a complex amalgam of beliefs, risk appetites, and strategic behaviors, not a clean estimate of the objective probability sought by the Jury Theorem.
      *   **Conclusion on Beliefs:** Condorcet would likely see betting markets as a less reliable, more easily corrupted, and fundamentally *dependent* mechanism for aggregating factual beliefs compared to the idealized independent voting/jury model. The violation of independence and problematic self-selection would, in his view, negate the probabilistic guarantees of the Jury Theorem for this context.

  2.  **Voting on Values: Not an Escape, but a Relocation (and Amplification) of the Paradox**
      *   **The Paradox Persists in Metric Choice:** Condorcet would immediately recognize that the "values" vote – choosing *which* welfare metric to maximize – is itself a complex preference aggregation problem subject to his paradox. Different metrics (e.g., GDP growth vs. a multidimensional inequality-adjusted index vs. environmental sustainability indices) represent different value orderings over societal outcomes. Voting on these metrics is highly susceptible to cyclical majorities and agenda manipulation, just like voting on policies directly. There is no stable "true" societal preference ordering over possible welfare metrics.
      *   **Market Design as Value-Laden:** Condorcet would argue that the design of the prediction market itself embeds crucial value judgments that are *not* resolved by the "values" vote:
          *   *Defining the Outcome:* How is the chosen welfare metric *operationalized*? What specific data defines "maximized welfare"? This involves value-laden choices about what counts and how it's measured.
          *   *Time Horizon:* Over what period must the policy maximize the metric? Short-term gain vs. long-term sustainability is a profound value conflict.
          *   *Scope and Externalities:* Does the metric account only for citizens, or future generations/non-citizens? Does it account for negative externalities imposed on others? Defining the scope involves ethical choices.
      *   **The Illusion of Separating Values and Beliefs:** Condorcet's vision of enlightened governance involved *reason* applied by citizens to *both* ends (values/objectives) and means (beliefs/facts). Futarchy attempts a strict separation. Condorcet would likely see this as artificial and dangerous. Complex policy decisions often involve deep entanglements where factual assessments ("Will this policy *really* increase long-term well-being?") depend on implicit value judgments about what constitutes "well-being," and value choices are informed by beliefs about consequences. Rigidly separating them in different institutions risks creating policy based on a metric that doesn't truly reflect nuanced societal values, optimized by a market whose "beliefs" may be distorted and detached from broader deliberation.
      *   **Loss of Deliberation:** Condorcet believed rational deliberation among citizens was essential for refining both values *and* beliefs, fostering enlightenment and discovering the common good (*Réflexions sur l'esclavage des nègres*, *Sur l'admission des femmes au droit de cité*). Futarchy replaces deliberation on policies (the complex interplay of values and beliefs) with a vote on an abstract metric and a market mechanism. Condorcet would see this as a depoliticization that stifles the development of public reason and collective wisdom.

  **Condorcet's Likely Overall Verdict:**

  Condorcet would view futarchy as a fascinating but deeply flawed experiment that misunderstands or misapplies his insights:

  1.  **For Beliefs:** He would see prediction markets as a *regression* from the Jury Theorem's ideal due to the fatal lack of independence and problematic self-selection, making them less reliable for truth-tracking than a well-designed (independent, competent, representative) deliberative body or voting procedure for factual judgments.
  2.  **For Values:** He would see the "vote on values" as merely *relocating* the Condorcet Paradox into the choice of the welfare metric and the design of the market mechanism. He would argue it doesn't escape the fundamental problem of aggregating complex, potentially conflicting preferences. Worse, by offloading policy entirely to a market optimizing a single metric, it potentially *amplifies* the paradox's dangers by obscuring the value conflicts embedded in the metric and market design, while eliminating the crucial space for public deliberation that could help resolve them rationally.

  Condorcet's faith was in the power of *enlightened reason*, fostered by education and exercised through *deliberative democratic processes* incorporating probabilistic reasoning. Futarchy's mechanistic separation of values and beliefs, reliance on self-selected interdependent traders, and elimination of policy deliberation would strike him as a surrender to a different kind of irrationality – the speculative logic of the marketplace and the tyranny of an oversimplified metric – rather than an advance towards the collective reason and stable, just outcomes he envisioned.
