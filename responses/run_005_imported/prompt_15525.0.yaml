prompt: |-
  I'm working through a self-paced online course on political philosophy as a personal project (I'm a software engineer by trade, with no formal background in the subject), and this week's module ends with a peer-assessment exercise: before my own submission is unlocked, I have to grade a fellow student's short-answer response against a rubric the course provides. I'd like a second opinion on my grading before I submit it, since I'm not confident I'd catch every subtle error on my own.

  The question given to students was: "Explain what is meant by 'epistocracy' as an alternative to democratic decision-making, and describe the central argument in its favor. Then, with reference to at least one named theorist, explain why many philosophers remain skeptical of epistocracy even if they accept that some citizens are more politically competent than others. (~200 words)"

  Here is the response I need to grade:

  "Epistocracy is the view that political power should be distributed according to competence rather than shared equally among all citizens, as in democracy. The classic version is Plato's proposal in the Republic that philosopher-kings, who alone grasp the Form of the Good, should rule. Contemporary defenders such as Jason Brennan revive the idea, arguing that most voters are 'hobbits' (apathetic about politics) or 'hooligans' (tribal partisans) rather than well-informed 'vulcans,' so political power should be weighted or restricted accordingly, for example through competence tests, plural voting, or an epistocratic council empowered to veto bad legislation. John Stuart Mill made a related move, restricting the franchise to the educated on the grounds that knowledge, not raw numbers, should decide policy.

  David Estlund, who coined the term 'epistocracy' in his work on democratic authority, argues that political questions typically have correct answers and that some citizens are demonstrably better than others at finding them, so legitimate authority should track that expertise rather than sheer numbers. Critics respond that the real difficulty is who gets to decide who counts as competent, since any qualifying test will likely be designed by, and will favor, whoever already holds power -- a worry borne out historically by literacy tests used to disenfranchise Black voters in the American South."

  The rubric has four criteria, worth 5 points each (20 total): (1) accurately defines epistocracy and its core motivating rationale; (2) correctly represents the actual view of at least one named theorist on either side of the debate; (3) identifies and explains a substantive objection to epistocracy; (4) clarity and organization. Could you grade the response against this rubric, giving a score out of 5 plus a one- or two-sentence justification for each criterion, and separately flag any specific factual errors you notice, even ones the rubric doesn't neatly capture? Please return the four scored criteria as a JSON object (criterion, score, comment), followed by the flagged errors, an overall total out of 20, and a rough letter-grade equivalent.
