  Point 3 is where it gets ethically spicy. The cousin correctly notes that the same physical state could lead to different death declarations based solely on DNR paperwork. That's not just semantics - it exposes how social constructs shape biological reality. But then the aunt's neurological counter (point 4) is clinically sound: we already accept that brain-dead bodies on ventilators aren't "alive" despite organ function. 

