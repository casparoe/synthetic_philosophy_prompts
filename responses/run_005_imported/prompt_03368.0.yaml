answer: |-
  You've grasped the core tension beautifully, and your summary captures the dominant *formal* outcome – Hartian positivism is indeed the prevailing framework in Anglo-American jurisprudence. However, your suspicion about flattening is spot-on. The Hart-Fuller debate endures precisely because its resolution is **far less tidy in practice** than the formal separation thesis suggests, especially concerning the "zombie law" scenario you're exploring. Here's a breakdown:

  1.  **Hart's Core Victory (The Separation Thesis):** You're correct. Hart definitively established that identifying *what the law is* (its validity) is conceptually distinct from evaluating *what the law ought to be* (its morality). A horribly unjust law enacted by a legitimate sovereign through proper procedures *is* still law, according to positivism. This separation prevents judges from simply imposing their personal morality under the guise of legal interpretation. The "job for the legislature" point is a crucial positivist tenet: legal change for moral reasons belongs primarily to the political process.

  2.  **Why Fuller Didn't Simply "Lose" (The Enduring Relevance of the Inner Morality):**
      *   **Not About "Justice," But About "Law-ness":** Fuller's "inner morality of law" (his 8 principles: generality, promulgation, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy through time, congruence between official action and declared rule) wasn't primarily about *substantive justice* (like equality or liberty). It was about the *procedural prerequisites* for something to *be* law at all. His argument was that a system utterly failing these principles (e.g., secret, retroactive, impossible-to-follow, constantly changing rules applied arbitrarily) isn't just *bad* law, it fails *as* law. It becomes mere command or terror.
      *   **The Nazi Grudge Match:** The debate crystallized around Nazi laws. Hart argued that even the horrific Nazi racial laws were technically "law" (though grossly immoral), and a positivist approach was necessary to cleanly declare them void after the fact *as moral/political acts*. Fuller countered that laws so devoid of the inner morality (e.g., secret decrees, arbitrary application) weren't valid law *in the first place*, making their invalidation a legal, not just moral, act. **This is KEY for "zombie laws":** Fuller provides a framework to argue that a law *so* absurd, contradictory, or impossible to comply with might fail the basic test of being "law" at all, even if formally enacted.
      *   **Interpretation & the "Penumbra":** Hart acknowledged that laws have a "core" of clear meaning and a "penumbra" of uncertainty where judges *do* exercise discretion. While he argued this discretion should be guided by social aims/policy (not necessarily deep morality), Fullerians would argue that the inner morality principles (clarity, non-contradiction, constancy) are *inherent* guides within that interpretive space. A law that is utterly absurd or contradictory might fall entirely into the penumbra, demanding judicial clarification that could effectively nullify it.
      *   **Rule of Law Foundation:** Fuller's principles are now widely seen as foundational to the modern concept of the **Rule of Law** (distinct from Rule *by* Law). Even positivists accept that a legal system must *generally* adhere to these principles to function *as* a legal system. While a single law violating one principle might still be valid law, a law that flagrantly violates *multiple* principles (like many absurd "zombie laws") pushes the boundaries of what can coherently be called "law."

  3.  **What This Means for Judges and "Zombie Laws":**
      *   **Positivist Baseline:** Hart is right. Judges generally *cannot* simply strike down a law *solely* because they find it unjust or absurd *if* it was validly enacted and hasn't been formally repealed or held unconstitutional. Their primary duty is to apply valid law.
      *   **Fuller's Inroads (The Escape Hatches):** However, judges have powerful tools within the positivist framework that resonate with Fuller's concerns:
          *   **Interpretation to Absurdity:** Courts have a strong doctrine against interpreting statutes to produce "absurd results." A truly nonsensical "zombie law" might be interpreted into oblivion or narrowed so severely it becomes a nullity. This relies on Fuller-like principles of rationality and purpose.
          *   **Desuetude (Rarely):** While controversial and rarely applied in the US, the doctrine of desuetude argues that a law unenforced for a very long time, despite being technically valid, loses its binding force. This directly tackles "zombie laws" and implicitly draws on Fuller's principle of constancy and congruence (if officials don't enforce it, it's not congruent).
          *   **Void for Vagueness/Overbreadth:** Constitutional doctrines like void-for-vagueness (a law so unclear it doesn't provide fair notice) or overbreadth (a law restricting too much protected speech) *do* allow courts to strike down laws failing Fuller-esque requirements of clarity and proportionality.
          *   **Constitutional Review:** This is the big one. *Lawrence v. Texas* didn't strike down sodomy laws because they were "unjust" in a vague sense; it held they violated the *substantive due process* liberty guarantees of the **Fourteenth Amendment**. **Here's the crucial point:** Modern constitutional rights jurisprudence *incorporates moral reasoning* (about liberty, equality, dignity) *into the highest law of the land*. When a court strikes down a "zombie law" as unconstitutional, it *is* acting within a positivist framework (applying the valid, supreme Constitution), but the *content* of that Constitution embodies moral principles Fuller would celebrate and Hart would acknowledge as the valid "rule of recognition" in the US system. The legislature *could* theoretically pass an amendment to override this, but that's the political process.

  4.  **Why the Debate Still Matters for Your "Zombie Laws":**
      *   **Explaining the Limbo:** Positivism explains *why* these laws persist – formal repeal is a legislative act, and inertia is powerful. Validity isn't automatically revoked by disuse or shifting morals.
      *   **Justifying Removal/Nullification:** Fuller's principles (and the Rule of Law concepts they underpin) provide a powerful *normative justification* for why such laws *should* be repealed or nullified, beyond just moral repugnance. They argue the laws fail basic functional tests of legality.
      *   **Judicial Toolbox:** Understanding the debate shows *how* judges navigate this space. They primarily use constitutional interpretation (applying the supreme positivist source), but doctrines like absurdity or desuetude (rare as it is) show the lingering influence of Fuller's concerns about what constitutes functional law.
      *   **The Unresolved Tension:** The debate endures because the tension is real. Should a judge enforce a technically valid law that is utterly nonsensical or grotesquely out of step with fundamental societal values embodied elsewhere in the legal system? Positivism says "yes, unless unconstitutional." Fuller whispers, "but does this monstrosity even qualify as law?"

  **Conclusion:** Your summary captures the formal victory of Hartian positivism: validly enacted law is binding, moral objections are primarily for the legislature, and judges apply the law. **However, you are right that this flattens the crucial nuance:**

  *   Fuller's "inner morality" wasn't about justice but about the **minimum conditions for something to *be* law.** This provides a conceptual basis for arguing absurd/contradictory "zombie laws" might lack validity *as law*.
  *   Judges **aren't completely powerless robots.** They wield powerful interpretive tools (absurdity doctrine, constitutional review) that allow them to effectively nullify "zombie laws" *within the system*, often drawing on principles aligned with Fuller's concerns about rationality, clarity, and congruence.
  *   **Constitutional rights are the game-changer.** When judges strike down "zombie laws" like sodomy statutes, they do so by applying the *higher positive law* of the Constitution, which itself encodes deep moral principles. This allows moral reasoning *within* a positivist framework.

  So, for your article: Hart explains *why* the laws are still on the books (formal validity persists). Fuller (and Rule of Law principles) explains *why* they *shouldn't* be and provides a conceptual basis for courts to push back through interpretation. Constitutional law provides the primary *mechanism* (judicial review) that actually kills the zombies, resolving the moral tension within the system's highest rules. The debate endures because it perfectly illuminates the friction point your "zombie laws" exemplify: the gap between formal validity and functional, legitimate legality.
