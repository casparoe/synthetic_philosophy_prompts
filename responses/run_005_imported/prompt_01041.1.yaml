  First, I need to recall Moore's key ideas. He sees intrinsic value in complex wholes, like states of consciousness involving admiration of beautiful objects or good qualities in people. Personal affection and aesthetic appreciation are both forms of admiring contemplation. Moore uses organic unities to explain how the value of a whole isn't just the sum of its parts. But in this case, the value comes from the combination of the object's qualities and the subject's admiration.

  The user's concern is that if love is just admiring qualities, then logically, a person with superior qualities should be more worthy of love. This ignores the personal history and unique relationship that typically define loyalty. So, the problem stems from Moore's reduction of love to admiration of qualities without accounting for relational aspects.

  Next, I should identify which of Moore's commitments cause this. The key points are his cognitive account of emotion, the focus on the object's properties, and the isolation of the state of consciousness from external factors. Moore's framework doesn't include the relationship's history or the individuals' identities as part of the valuable whole. Thus, swapping the object with a better one seems to increase value, leading to the trade-up issue.

  Now, can Moore's organic unities solve this without ditching his account? Maybe by expanding the whole to include the relationship. For example, adding shared history or mutual commitment. But Moore's states of consciousness are subjective and momentary. Including past experiences might violate his atomistic view. Alternatively, emphasizing uniqueness: each person is irreplaceable, making their qualities non-transferable. But Moore's view treats qualities as universal, so similar qualities in another should suffice. That doesn't work.

  Another approach: the act of commitment itself as part of the whole. Loyalty could add value beyond admiration. However, Moore sees emotions as responses to properties, not commitments. Introducing new elements like commitment might stray from his original framework. It's a tension between adhering to Moore's structure and addressing the critique. 

  The user might want to know if Moore's system can be salvaged internally or if it needs significant changes. They might also be interested in how this critique fits into broader discussions in meta-ethics or value theory. Their deeper need could be understanding the limitations of reductionist accounts of love and whether alternatives exist within similar frameworks. They might be preparing for a paper or discussion, needing clear arguments on both sides. 

