answer: |-
  You've pinpointed a profound and enduring criticism of Moore's account of personal affection in the "Ideal" chapter. Let's break down why Moore's view leads to the "trade-up" problem and whether his own tools (organic unities) offer a way out:

  **Core Commitments Leading to the "Trade-Up" Problem:**

  1.  **Cognitive Reduction of Emotion:** Moore treats love (personal affection) primarily as a *cognitive state* – "admiring contemplation" or "appreciation" of the *good qualities* possessed by the object of affection. Love *is* the act of recognizing and valuing the intrinsic goodness in the other person's properties.
  2.  **Focus on the Object's Qualities:** The value of the complex whole ("the consciousness of A of the worth of B") depends crucially on the *actual good qualities possessed by B* that A is contemplating. The more objectively good qualities B possesses, and the more intensely or truly A apprehends them, the more valuable the state of affairs.
  3.  **The State of Consciousness as the Locus of Value:** The intrinsically valuable thing is the *specific state of consciousness* involving the subject (A) contemplating the good qualities of the object (B). This state is, in principle, *atomistic* and *repeatable* with different objects.
  4.  **Value Comparability:** Moore believes intrinsic values can be compared and ranked. If state S1 (A contemplating B's qualities X, Y, Z) is valuable, and state S2 (A contemplating C's qualities X, Y, Z+) is *more* valuable because C possesses *more* of the good qualities (Z+ > Z), then S2 is objectively better.
  5.  **Consequentialist Imperative:** Moore is a consequentialist about the *right*. If producing S2 yields more intrinsic good than producing S1 (because S2 involves contemplating *more* goodness), then one *ought* (prima facie) to bring about S2.

  **The Inevitable Conclusion ("Trade-Up"):**
  Combining these commitments:
  *   If love *is* admiring contemplation of good qualities...
  *   And if Person C objectively possesses *more* of those good qualities than Person B...
  *   Then the state of consciousness "A admiring C's qualities" contains *more intrinsic goodness* than "A admiring B's qualities"...
  *   Therefore, to maximize intrinsic good, A *ought* to shift their admiration (and thus, according to Moore, their love) from B to C.

  This directly conflicts with:
  *   **Loyalty:** The idea that commitment persists *despite* the potential appearance of others with "better" qualities.
  *   **Specificity of Love:** The intuition that we love *this particular person*, not just a bundle of replaceable qualities. Love seems tied to the unique history, shared experiences, and the irreplaceable identity of the individual *as that individual*.
  *   **Non-Fungibility:** Friends and loved ones are not interchangeable commodities to be traded for a "better model."

  **Could Organic Unities Block This Result?**

  Moore's concept of "organic unities" (the whole's value ≠ the sum of its parts' values) is his primary tool for handling complexity. Could it rescue specificity and loyalty? It's difficult within his framework:

  1.  **Expanding the "Whole":** The most promising strategy is to argue that the intrinsically valuable whole relevant to love is *much larger and more complex* than the simple "A-contemplates-B's-qualities-at-time-T".
      *   **Include the Relationship/History:** Could the valuable whole be "The entire history of mutual affection, shared experiences, commitments, and understanding between A and B"? The value of contemplating B's qualities *now* might depend organically on the entire past relationship. Swapping B for C (even with Z+) breaks this unique historical whole, potentially destroying enormous value that a new relationship with C couldn't immediately replicate, regardless of C's individual qualities. The *loyalty itself*, as part of the ongoing relationship, could be an organic component adding unique value.
      *   **Include Uniqueness/Irreplaceability:** Could the fact that B is *this specific individual* be an *intrinsic* part of the valuable whole? Moore might resist this. He sees good qualities as universals. If C has *all* of B's qualities plus more, it's hard to see what unique "B-ness" adds *except* the history/relationship mentioned above. Moore focuses on *qualities*, not bare particulars.
      *   **Include the Act of Commitment/Loyalty:** Perhaps the state "A remains loyal to B *despite* the appearance of C with Z+" is itself a complex state of consciousness with *its own* unique intrinsic value (involving virtues like fidelity, trust, perseverance) that outweighs the simple increase in contemplated goodness from shifting to C. The *choice* of loyalty could be part of an organic unity.

  2.  **The Challenge for Moore:**
      *   **Atomism vs. Holism:** Moore's analysis tends towards *atomizing* value into discrete states of consciousness ("A contemplating B's qualities now"). Expanding the whole to encompass a lifelong relationship or an abstract commitment strains this model. Is the entire history one giant organic unity? How do we value moments within it? Moore doesn't provide a clear way to handle such temporally extended, relational unities as the primary bearers of value.
      *   **Subjectivity of the State:** The valuable state is located *in A's consciousness*. While the *object* of contemplation (B's qualities) is objective, the relationship history or the act of commitment is also part of the *object* of A's contemplation. Moore *could* argue that contemplating *the unique history with B* or *the virtue of loyalty to B* are complex objects whose contemplation yields a uniquely valuable state, irreducible to contemplating C's Z+ alone. This *is* plausible within organic unities.
      *   **Abandoning the Core?** If the value of loving B *now* depends *so heavily* on the past history that even a "better" C couldn't create a more valuable state *for A*, hasn't Moore effectively abandoned the idea that love *is primarily* the contemplation of the beloved's *current* good qualities? The value seems to shift to the *relational history* or the *virtue of loyalty*, with the current qualities becoming secondary.

  **Conclusion:**

  1.  **The Problem is Inherent:** Moore's core commitments (love = cognitive admiration of objective qualities; value in atomistic states of consciousness; consequentialism) *do* inherently generate the "trade-up" problem. They struggle to account for the irreplaceable specificity of persons and the normative force of loyalty.
  2.  **Organic Unities: A Possible, but Problematic, Escape?** A defender *could* use organic unities to argue that:
      *   The valuable whole includes the entire unique relational history between A and B, which would be destroyed by "trading up."
      *   The state of consciousness involving *loyal commitment to B* is itself an organic unity with unique intrinsic value exceeding the simple gain from contemplating C's slightly better qualities.
  3.  **But It Strains the Framework:** This requires significantly expanding Moore's typical conception of the relevant "whole" beyond a simple subject-object-contemplation moment. It risks:
      *   Undermining the focus on the *beloved's current qualities* as the primary object of contemplation constituting love.
      *   Introducing elements (relational history, commitment as a virtue) that feel like additions or even replacements for the core "admiring contemplation" model.
      *   Pushing towards a view where the *relationship itself* or *fidelity* becomes the primary locus of value, with the contemplation of individual qualities playing a supporting role.

  Ultimately, while organic unities *offer a conceptual tool* Moore *could* use to block the "trade-up" implication, doing so coherently likely requires stretching his model beyond its intended limits and implicitly downplaying the very "admiring contemplation of qualities" account that defines his view of love. The criticism stands as a powerful challenge to the adequacy of reducing personal affection to a form of aesthetic appreciation. To fully save loyalty and specificity, a Moorean might need to significantly modify or supplement the core account, perhaps by giving the *relationship* or the *act of commitment* a more fundamental role within the organic whole.
