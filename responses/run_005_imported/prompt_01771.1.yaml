  So I spent most of my career as an analytical chemist, and now that I'm retired I've been reading my way through philosophy of medicine, which is totally new territory for me. Back in my old field a measurement was a measurement, but this stuff seems to get away with a lot more hand-waving than I expected. Case in point: I recently ran into Shewmon's research showing that plenty of people declared 'brain dead' kept growing, healing wounds, fighting off infections, even carrying pregnancies to term, for years after the declaration, which made me wonder what the diagnosis is actually tracking. And circulatory death isnt the clean backup it seems either -- the couple minutes doctors wait after the heart stops before calling it is really a bet that it won't restart on its own, not proof that it cant. Anyways, could you write me a short story set inside that gap -- a warm, breathing body that one set of doctors would call a corpse and another wouldn't -- with a pov character (family member, nurse, whoever) who actually has to live inside that ambiguity instead of just philosophizing about it from an armchair like I'm doing right now.
