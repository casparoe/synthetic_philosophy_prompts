  First, I need to recall Hobbes's maker's knowledge doctrine. He believed that we can have certain knowledge of things we create, like geometry and political structures. Geometry's certainty comes from constructing figures through definitions and motions. Similarly, the commonwealth is an artificial creation, so we should have certain knowledge of it. But his repeated failures in squaring the circle might challenge this.

  The key is to connect the mathematical failure to the epistemology. How does failing at an act of construction in geometry reflect on the certainty of constructing civil philosophy? The user mentioned De Corpore and Six Lessons, so references there are important.

  Hobbes claimed that geometry is certain because we make the figures. Squaring the circle was his test case. His inability to do it correctly, despite multiple attempts, shows that even in geometry, maker's knowledge doesn't guarantee success. If he can't construct a valid circle squaring, then the certainty he claims for geometry is undermined. If geometry isn't as certain as he claims, then the analogy to civil philosophy falls apart.

