prompt: |-
  Ok so I somehow got stuck TAing the Hobbes weeks for our early modern philosophy seminar, and I'm leading discussion section this friday. I fell down a total rabbit hole reading about his decades-long fight with Wallis over squaring the circle, and now I can't shake the feeling that everyone in the seminar treats it as a totally seperate, embarrassing footnote with no bearing on 'real' Hobbes. But in De Corpore and around the Six Lessons pamphlet he's pretty explicit that geometry is uniquely certain because we construct its figures ourselves, and that civil philosophy can be just as certain since we construct the commonwealth too - basically his whole 'maker's knowledge' move. Can you give me the strongest argument you can that Hobbes's total, never-retracted failure to actually square the circle undermines that argument for the certainty of civil philosophy, and not just his reputation as a mathematician? Don't just summarize the dispute for me, I already know the history - I want an actual argument connecting the math failure to the epistemology.
