  Hobbes never admitted defeat in the math dispute. He kept asserting his constructions were correct despite evidence. This demonstrates that maker's knowledge requires infallibility in construction, which he didn't achieve. His persistence in error shows that the maker isn't necessarily a reliable knower. If he can be wrong about geometry, why not about politics?

