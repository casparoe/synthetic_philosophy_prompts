  ---

  ### Move-by-Move Justification

  **Move 1 (Lena): Score +1**  
  *Lena correctly identifies the core equivocation risk* between "not identical to" (非 as numerical distinctness) and "not a subset of" (非 as categorical exclusion). Gongsun Long's argument *does* exploit this ambiguity rhetorically. However, calling it "sophistry" oversimplifies. The paradox genuinely probes ontological categorization, not *just* wordplay. **Score: +1** (Largely correct but dismissive of deeper intent).

  **Move 2 (Marcus): Score +1**  
  *Marcus validly invokes Hansen's mass-noun hypothesis* as a plausible linguistic framework. Classical Chinese nouns often lack obligatory pluralization or articles, behaving more like mass terms (e.g., "horse-stuff"). This *does* reframe the paradox: "white-horse-stuff ≠ horse-stuff" is coherent under this model. However, Hansen's thesis is contested (e.g., Harbsmeier, Fraser), and Gongsun Long himself likely presumed individuated objects. **Score: +1** (Strong semantic point but overstates as definitive resolution).

  **Move 3 (Lena): Score +2**  
  *Lena's rebuttal is decisive*. Even if mass-noun semantics are technically correct, the paradox's *rhetorical force* depends entirely on the audience intuitively parsing 馬 as a count noun ("a horse"). If "horse" were truly understood as undifferentiated stuff like "water," the claim "white horse isn’t horse" would be no more startling than "ice isn’t water." The mass-noun reading merely *shifts* the equivocation to the audience's interpretation. **Score: +2** (Correctly identifies the irrelevance of mass nouns to the paradox's persuasive effect).

  **Move 4 (Marcus): Score -1**  
  *Marcus misrepresents both the argument and Lena's position*. Gongsun Long’s "seeking a horse" example aims to prove non-*identity* (非), not merely set non-coincidence. Lena never dismisses the extensional difference as "trivial"; she objects to conflating it with metaphysical non-membership. Marcus also commits anachronism: while modern set theory clarifies extensions, Gongsun Long’s focus was on *naming* and *reference*, not extensional sets. **Score: -1** (Misreads the dialectic and attributes a strawman to Lena).

  ---

  ### Key Overlooked Dimensions
  Both students underemphasize:
  1. **Metaphysical Intent**: Gongsun Long likely targets *realist* assumptions about universals. If "horseness" (馬) is a universal, is "white-horseness" part of it or a distinct universal? This transcends semantics.
  2. **Pragmatics of Language**: The "seeking a horse" argument relies on contextual language use. In practice, requesting "a horse" *allows for* white horses, undermining Gongsun Long’s strict separation.
  3. **Historical Context**: The dialogue is part of broader "School of Names" (名家) debates about logic, reference, and ontology—not merely a linguistic trick or standalone puzzle. Its value lies in exposing tensions in predication and categorization.
