prompt: |-
  I'm on the steering committee for my company's code review process (we call it the "guild," don't ask), and we're fighting over how many approvals a PR needs before it can merge into our main repo -- it's 2 right now. A principal engineer wants to bump it to 5, citing the Condorcet Jury Theorem: his argument is that if each reviewer is even a little better than a coin flip at catching a real bug, stacking on more independent reviewers should mathematically push the error rate toward zero. Some of us are skeptical, since our reviews aren't very independent in practice -- everyone reads the earlier comments before leaving their own. I need to send the committee's decision memo before next weeks meeting -- can you draft it? Land on an actual policy (5 approvals, 2, or something else, maybe changing how reviews get run rather than just headcount), give the real reasoning including the math, and actually engage with the principal engineer's arguement instead of just waving it off as "reviews are messy irl."
reasoning: |-
  We are going to draft a decision memo that addresses the principal engineer's argument using the Condorcet Jury Theorem (CJT) but also considers the practical limitations of our review process. We'll then propose a policy that balances the theoretical benefits of more reviewers with the realities of our process.

  Key points:
  1. **Condorcet Jury Theorem (CJT)**: 
     - Assumes that each reviewer is independent and has a probability p > 0.5 of being correct (i.e., correctly identifying a bug or approving a correct change).
     - As the number of reviewers (n) increases, the probability that the majority decision is correct approaches 1.
     - The principal engineer is correct in the theoretical sense: if we have independent reviewers each with p>0.5, then increasing n (to 5 or more) would indeed reduce the error rate.

  2. **Practical Concerns**:
     - **Independence**: Our reviews are not independent because reviewers see previous comments and may be influenced by them (anchoring, bandwagon effect, or simply not reviewing as thoroughly if they think others have already done so).
     - **Diminishing Returns**: Each additional reviewer adds less marginal value, especially if they are not truly independent. Also, the cost (time, delay) increases.
     - **Reviewer Quality**: The theorem assumes p>0.5 for every reviewer. In reality, some reviewers might have p<0.5 (especially if they are less experienced or if the code is outside their domain) and including them could lower the overall accuracy.

  3. **Alternatives**:
     - Instead of increasing the number to 5, we could focus on improving the quality and independence of reviews.
     - We might require at least one approval from a domain expert and one from a non-expert (for a different perspective) without necessarily increasing the total number.

  4. **Proposal**:
     - We will keep the required approvals at **2** for now, but with the following changes to the process to improve independence and quality:
       - **Blind Review Phase**: For the first 24 hours (or until the first approval), reviews are done without seeing others' comments. This can be enforced by tooling (if available) or by policy (reviewers are asked not to look at other comments until they have submitted their own initial review).
       - **Mandatory Expertise**: For critical modules, require at least one approval from an expert in that module and one from outside the immediate team (to get a fresh perspective).
       - **Training and Guidelines**: Provide training on effective code reviews and encourage reviewers to focus on different aspects (e.g., one on functionality, one on security, one on readability, etc.) to increase the diversity of perspectives.
     - We will also set up a 3-month trial period for this new process and then re-evaluate the error rate (e.g., by tracking escaped defects). At that point, we can reconsider the number of required approvals.

  5. **Addressing the Principal Engineer**:
     - We acknowledge the mathematical soundness of the CJT argument and agree that in theory, more reviewers would help.
     - However, without independence, the theorem's assumptions are violated, and the benefits may not materialize. We propose to first fix the independence issue and then reassess.

  Draft Memo:

  ---

  **MEMORANDUM**

  **TO**: Code Review Guild Steering Committee  
  **FROM**: [Your Name/Committee Chair]  
  **DATE**: [Current Date]  
  **SUBJECT**: Policy Change on Required Approvals for Code Review

  ### Introduction
  This memo outlines the decision of the steering committee regarding the number of approvals required for merging pull requests (PRs) into our main repository. The current requirement of two approvals has been challenged by a proposal to increase it to five, based on the Condorcet Jury Theorem (CJT). This memo reviews the argument, considers practical constraints, and proposes a revised policy.

  ### Condorcet Jury Theorem and Its Implications
  The principal engineer's argument is grounded in the Condorcet Jury Theorem, which states that if each reviewer in a group has an independent probability \( p > 0.5 \) of making a correct decision (i.e., correctly approving a good change or rejecting a bad one), then the probability that the majority decision is correct increases with the number of reviewers and approaches 1 as the number of reviewers goes to infinity. 

  Under this model, increasing the number of reviewers from two to five would theoretically reduce the chance of a bad change being approved. We acknowledge the mathematical validity of this argument and the potential benefits of increasing the number of reviewers.

  ### Practical Considerations
  However, the application of CJT relies on two critical assumptions that do not fully hold in our current process:

  1. **Independence of Reviews**: In practice, our reviews are not independent. Reviewers typically see the comments of previous reviewers before submitting their own. This can lead to:
     - Anchoring bias, where the first review sets the tone and subsequent reviews are influenced.
     - Reduced diligence if reviewers believe that others have already thoroughly reviewed the code.
     - Bandwagon effects, where reviewers agree with the consensus without independent analysis.

  2. **Uniform Competence**: The theorem assumes that every reviewer has the same \( p > 0.5 \). In reality, reviewer competence varies by expertise and context. Including reviewers with low \( p \) (especially when they are not familiar with the code) could lower the overall accuracy. Additionally, the marginal benefit of each additional reviewer diminishes, especially when independence is compromised.

  Moreover, increasing the required approvals to five would:
  - Slow down the development process, especially for small changes.
  - Increase the burden on reviewers, potentially leading to review fatigue and lower quality per review.

  ### Proposed Policy
  After careful consideration, the committee has decided to maintain the current requirement of **two approvals** but with the following modifications to the review process to enhance independence and effectiveness:

  1. **Blind Review Phase**: 
     - For the first 24 hours after a PR is submitted (or until the first approval, whichever comes first), reviewers are required to conduct their initial review without viewing others' comments. This will be enforced by:
       - Encouraging reviewers to set up their tools to hide comments until they have submitted their own review (if tooling allows).
       - A policy that reviewers must submit their initial review before seeing others' comments.
     - After the initial review, reviewers can engage in discussion and update their review if needed.

  2. **Expertise-Based Requirements**:
     - For critical modules (to be defined by the guild), at least one approval must come from a designated expert in that module and one from a reviewer outside the immediate team (to provide a fresh perspective).

  3. **Reviewer Training and Guidelines**:
     - The guild will develop and deliver training on effective code reviews, emphasizing independence and critical thinking.
     - We will encourage reviewers to focus on different aspects (e.g., one on functionality, one on security, one on readability) to maximize the diversity of feedback.

  4. **Trial Period and Metrics**:
     - This new process will be trialed for three months. During this period, we will track:
       - The rate of escaped defects (bugs found in production that passed review).
       - Review cycle times.
       - Reviewer feedback and perceived quality.
     - After the trial, we will reconvene to evaluate the data and reconsider the number of required approvals.

  ### Conclusion
  We agree with the principal engineer that the Condorcet Jury Theorem provides a compelling theoretical argument for increasing the number of reviewers. However, without addressing the independence and quality of reviews, the benefits may not be realized. Our proposal aims to strengthen the review process to better approximate the conditions of CJT while maintaining efficiency. We will reassess after the trial period and remain open to adjusting the number of approvals if data supports it.

  We appreciate the principal engineer's contribution to this important discussion and look forward to implementing these changes to improve our code quality.

  **Approved by the Code Review Guild Steering Committee**

