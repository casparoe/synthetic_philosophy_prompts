  - Reporting multiverse/specification-curve analyses: This increases transparency and shows the robustness of results, which can help identify false positives. However, it doesn't prevent them and might be ignored if the headline result is still emphasized.

  C-tier: Minor impact.
  - Replacing p-values with Bayes factors: While Bayes factors can be an improvement, they are also susceptible to manipulation (e.g., by choosing favorable priors). They also require a different understanding and might not be straightforward. The impact is uncertain and might not be as substantial as the structural changes.

  D-tier: Basically theater or counterproductive.
