  Tier Definitions:
  - S: Huge real impact
  - A: Substantial impact but less than S
  - B: Moderate impact
  - C: Minor impact
  - D: Basically theater or actively counterproductive

  Reasoning:

  1. Universal preregistration/Registered Reports:
     - This combats p-hacking and HARKing (hypothesizing after results are known). By registering the plan before data collection, it reduces flexibility in analysis that leads to false positives. This has been shown to have a strong effect in reducing false positives.

  2. Lowering the default significance threshold to p<0.005:
     - This directly reduces the false positive rate (though it may increase false negatives without increased power). The proposal by Benjamin et al. (2018) argues that this would substantially reduce the rate of false positives. However, it doesn't address other issues like p-hacking or publication bias.

  3. Replacing p-values with Bayes factors as the default inferential tool:
     - Bayes factors provide a way to quantify evidence for both the null and alternative hypotheses. However, they are not a panacea because they depend on the choice of prior and can be misused. Also, they don't prevent p-hacking-like behavior (e.g., trying different priors). The impact might be moderate because it changes the metric but not necessarily the incentives.

  4. Mandatory direct replication before publication:
     - This would catch false positives before they become literature. However, it is resource-intensive and might not be feasible for every study. Also, it might slow down science. But if adopted, it would directly reduce the publication of non-replicable findings.

  5. Reporting multiverse/specification-curve analyses alongside the headline result:
     - This shows how robust the result is to different analytical choices. It increases transparency and might discourage p-hacking by showing the fragility of the result. However, it doesn't prevent the publication of a false positive if the headline result is still reported and emphasized.

  6. Abandoning significance thresholds and "significant/not" language altogether:
     - This is meant to stop the dichotomous thinking that leads to p-hacking and misinterpretation. However, without a threshold, researchers might still use quantitative measures in a similar way. Also, it doesn't address the underlying incentives or practices that lead to false positives. It might be more of a cultural shift that alone isn't enough.

  7. Reforming hiring/tenure decisions to reward replications over novel findings:
     - This targets the incentive structure. Currently, the system rewards novelty and positive results. By rewarding replications, it would encourage more replication studies and make researchers more cautious about publishing weak results. This could have a broad impact on the culture.

  8. Increasing statistical power through larger sample sizes:
     - Low power is a major contributor to false positives (because when power is low, a significant result is more likely to be false if the prior is low). Increasing power reduces false negatives and also the false positive rate (because with higher power, true effects are more likely to be detected, so the proportion of false positives among significant results decreases). However, it requires more resources.

  Now, we assign tiers:

  S-tier: These are the most impactful and directly address the root causes.
  - Universal preregistration/Registered Reports: This directly addresses the flexibility in data analysis and reporting that leads to false positives. It is a structural change that has proven effective in fields that adopted it.
