  Looking into medical protocols, I recall that after circulatory death (DCD), death is declared based on irreversible cessation of circulatory and respiratory functions. The mandated waiting period (typically 5 minutes) ensures autoresuscitation isn't possible. Once that period passes, circulation loss is permanent. Restarting the heart via ECMO or a pump only circulates blood to organs below the brain, not reviving the person. 

