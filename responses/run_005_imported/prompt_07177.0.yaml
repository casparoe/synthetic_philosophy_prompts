  ### Memorandum  
  **To:** Editorial Board, [Journal Name]  
  **From:** [Your Name], Editorial Board Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Statistical Reform in Response to the Replication Crisis  

  ### Introduction  
  The replication crisis in psychology—particularly affecting subfields like social priming and ego depletion—demands urgent methodological reform. Our journal’s credibility hinges on adopting a solution that addresses the *actual mechanisms* behind these failures: researcher degrees of freedom (e.g., p-hacking, selective reporting), not abstract statistical philosophy. After rigorous analysis, I recommend **Proposal B** (preregistered Bayes factors with graded evidence) over Proposal A (lowered p-value threshold with preregistration). Below, I justify this by dissecting the causes of our replication failures, evaluate both proposals’ strengths and weaknesses, and directly address the strongest argument for Proposal A.  

  ### Core Problem: How Researcher Degrees of Freedom Fueled the Crisis  
  Our subfield’s replication failures stem primarily from three intertwined practices:  
  1. **Optional stopping**: Collecting data until \(p < 0.05\) is achieved, inflating false-positive rates.  
  2. **Multiple comparisons**: Testing numerous hypotheses or covariates but reporting only "successes."  
  3. **Specification flexibility**: Choosing analytical models, exclusion criteria, or outcomes post hoc to achieve significance.  

  These practices exploit the *procedural vulnerabilities* of null-hypothesis significance testing (NHST). Crucially, they persist due to systemic incentives (e.g., publication bias) but are enabled by statistical frameworks that reward data-dependent decisions. As the Open Science Collaboration (2015) showed, these behaviors are rampant in social priming and ego depletion studies—precisely the work our journal published and later saw fail replication.  

  ### Why Proposal B (Bayes Factors) Better Addresses These Mechanisms  
  Proposal B mandates **preregistered Bayes factors against a specified prior**, eliminating fixed thresholds. This approach directly targets the above problems:  
  - **Immunity to optional stopping and multiple comparisons**:  
    Bayes factors obey the *likelihood principle*: evidence depends only on observed data, not unobserved intentions (e.g., when you stopped collecting data). If a prior and model are preregistered, optional stopping cannot inflate false positives (Rouder, 2014). Multiple comparisons also lose their sting; each test’s Bayes factor stands independently, reducing temptation to cherry-pick (Jeffreys, 1961).  
  - **Graded evidence mitigates publication bias**:  
    Unlike dichotomous \(p < 0.05\) thresholds, Bayes factors quantify evidence continuously (e.g., BF₁₀ = 3 suggests modest evidence for H₁). This discourages "categorizing" results as successes/failures, reducing file-drawer effects (Dienes, 2011).  
  - **Preregistration constrains forking paths**:  
    Yes, Bayesian models face forking paths (e.g., prior choice, model specification). But mandatory preregistration forces these choices to be fixed *before data collection*, neutralizing evidential ambiguity. For instance, a preregistered prior for ego depletion (e.g., a default Cauchy distribution) precludes hindsight bias.  

  ### Why Proposal A (Lowered p-Value) Falls Short  
  Proposal A’s strength is its pragmatism: it retains NHST’s familiarity while lowering the p-value threshold (\(p < 0.005\)) and requiring preregistration. However, it fails to address the core vulnerabilities:  
  - **Optional stopping and multiple comparisons remain exploitable**:  
    Lowering the threshold reduces false positives but does not eliminate NHST’s dependence on sampling intentions. Preregistration alone cannot prevent undisclosed data peeking or analytic flexibility *within* the preregistered framework (e.g., adding "justifiable" covariates). Simulations show that even with \(p < 0.005\), optional stopping inflates false-positive rates to 10–20% (Lakens et al., 2018).  
  - **Power collapses without larger samples**:  
    \(p < 0.005\) demands ~70% larger sample sizes for equivalent power (Benjamin et al., 2018). Without enforced sample-size calculations (not mandated in Proposal A), studies will remain underpowered—exacerbating our subfield’s false-negative problem in replications.  
  - **Dichotomous thresholds perpetuate publication bias**:  
    A stricter p-value threshold may worsen file-drawer effects by making "success" harder to achieve, incentivizing more p-hacking (Nosek et al., 2018).  

  ### Addressing the Strongest Argument for Proposal A  
  **Claim**: "Bayesian methods are equally vulnerable to forking paths (e.g., prior specification), so NHST with preregistration is sufficient."  
  - **Why this is incomplete**:  
    While both frameworks face forking paths, Bayesian inference structurally resists two key NHST failure modes: optional stopping and multiple comparisons. The likelihood principle ensures that *data-dependent decisions*—the primary drivers of p-hacking—do not alter evidence. In NHST, these require post hoc corrections (e.g., Bonferroni) that are easily ignored or misapplied. With preregistration, Proposal B’s prior/model choices are fixed, while its evidentiary output (Bayes factors) remains robust to runtime decisions.  

  ### Recommendation: Adopt Proposal B with Safeguards  
  I endorse **Proposal B** but urge enhancements to close residual loopholes:  
  1. **Require justification and sensitivity analysis for priors**: Authors must defend preregistered priors (e.g., using default weakly informative priors) and report sensitivity to alternative priors.  
  2. **Mandate Bayes factor guidelines (not thresholds)**: Encourage interpretations (e.g., "BF₁₀ > 3: moderate evidence") but prohibit bright-line rules like "BF₁₀ > 10 = discovery."  
  3. **Complement with transparency measures**: Publish all preregistrations, data, and code. Reject papers with undisclosed analytic flexibility.  

  ### Why Not a Hybrid?  
  A hybrid (e.g., Bayes factors with p-values) risks incoherence. NHST and Bayesian inference answer different questions (e.g., "Is the effect non-zero?" vs. "How strong is the evidence for H₁ over H₀?"). Merging them invites cherry-picking. Proposal B’s unified Bayesian framework, with preregistration, is simpler and more robust.  

  ### Conclusion  
  The replication crisis arose from NHST’s vulnerability to researcher degrees of freedom—not because frequentism is "wrong," but because it is *exploitable*. Proposal B directly dismantles these exploits via the likelihood principle and graded evidence, while preregistration tames forking paths. Proposal A’s lowered p-value is a half-measure that leaves NHST’s core weaknesses intact. By adopting Proposal B, our journal can lead psychology toward a more rigorous, replication-resistant future.  

  ---  
  **References**  
  - Benjamin, D. J. et al. (2018). *Nature Human Behaviour, 2*(1), 6–10.  
  - Dienes, Z. (2011). *Journal of Psychology, 219*(3), 291–298.  
  - Jeffreys, H. (1961). *Theory of Probability* (3rd ed.). Oxford.  
  - Lakens, D. et al. (2018). *Psychonomic Bulletin & Review, 25*(1), 128–142.  
  - Nosek, B. A. et al. (2018). *Advances in Methods and Practices in Psychological Science, 1*(2), 198–218.  
  - Open Science Collaboration. (2015). *Science, 349*(6251), aac4716.  
  - Rouder, J. N. (2014). *Psychonomic Bulletin & Review, 21*(2), 301–308.
