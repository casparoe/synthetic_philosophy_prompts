  We are given two proposals for statistical reform in response to the replication crisis:

  Proposal A: Keep null-hypothesis significance testing (NHST) but require mandatory preregistration and lower the significance threshold from p<0.05 to p<0.005.

  Proposal B: Drop significance testing in favor of mandatory preregistered Bayes factors (with a specified prior) and no fixed decision threshold, to reflect graded evidence.

  The memo must:
  1. Recommend one proposal (or a specific hybrid) outright, justified by the actual mechanisms that caused failed replications in the subfield (social priming, ego depletion, etc.).
  2. Engage with the claim that Bayesian methods (via the likelihood principle) are structurally better at resisting researcher degrees of freedom (like optional stopping and multiple comparisons) than frequentist methods.
  3. Address whether the Bayesian framework is inherently less prone to the garden of forking paths (model specification, prior choice, analysis selection) and if not, why.
  4. Avoid abstract philosophical debates and focus on the specific problems in the subfield.

  Key arguments from the dinner debate:
  - Friend (Pro-Bayesian): Bayesian methods (via likelihood principle) are immune to optional stopping and multiple comparisons, which are major problems in NHST.
  - Author: Even with Bayesian methods, researcher degrees of freedom (forking paths) remain because of discretion in model specification, prior choice, and which analysis to report.

  Analysis of the replication crisis in psychology (especially social priming, ego depletion):
  - The main problems include:
    a) p-hacking: Collecting data until p<0.05 (optional stopping) and trying multiple analyses until one yields significance.
    b) Publication bias: Only significant results are published.
    c) Researcher degrees of freedom: Flexibility in data analysis (including choice of covariates, exclusion criteria, outcome measures) leading to inflated false positives.
    d) Low statistical power.

  Proposal A addresses:
  - Preregistration: Reduces researcher degrees of freedom by pre-specifying the analysis plan.
  - Lowering the threshold: Increases the standard for evidence (from p<0.05 to p<0.005) which reduces false positive rates (but note: without increasing power, it also reduces true positive rates).

  Proposal B addresses:
  - Bayes factors: Provide graded evidence and are not subject to optional stopping (if the prior is fixed and the stopping rule is not based on the data, but in practice, with preregistration, we hope to fix the stopping rule). However, note that the likelihood principle does make the Bayes factor invariant to optional stopping if the stopping rule is not informative (but in practice, if the stopping rule is data-dependent, it might be incorporated in the model). Also, the Bayes factor depends on the prior, which is a source of flexibility.

  The author's concern: Bayesian methods do not eliminate the garden of forking paths. For example:
  - Choice of prior: A researcher might choose a prior that favors their hypothesis.
  - Model specification: Which model to compare (e.g., the null vs. what alternative?).
  - Which analysis to report: If multiple Bayes factors are computed, which one is reported?

  However, note that preregistration (mandatory in both proposals) can help fix the prior and the model in advance.

  But the memo must focus on the actual mechanisms of the replication crisis.

  Recommendation:
  I propose a hybrid approach that takes the strengths of both. Specifically:

  - Require preregistration (as in both proposals) to fix the analysis plan, including the stopping rule and the model.
  - For the primary analysis, we can use a Bayesian approach (Bayes factors or posterior probabilities) to avoid the pitfalls of p-values (like optional stopping) and to provide graded evidence.
  - However, also require that the primary analysis be conducted with a default prior (or a set of reasonable priors) that is agreed upon by the field, to reduce flexibility in prior choice.
  - Additionally, we might keep a threshold for publication that is not fixed in the Bayesian framework but we can set a guideline (e.g., BF>10 for strong evidence) while acknowledging that it is not a strict cutoff.

  But the board is choosing between two specific proposals. Alternatively, we can argue that Proposal B is better but must be supplemented with safeguards against the forking paths in Bayesian analysis.

  However, the author's side of the argument is that the framework (frequentist vs. Bayesian) is not the main issue; it's the researcher degrees of freedom. Therefore, preregistration is key. But both proposals require preregistration.

  So, which one is better?

  Consider: 
  - The problem of optional stopping and multiple comparisons is indeed more naturally handled by Bayesian methods (via the likelihood principle) without needing adjustments. In frequentist methods, these require corrections (like sequential testing or Bonferroni) that are often not applied. Therefore, if we are concerned about these practices (which were common in the failed studies), then Proposal B has an advantage.

  But the author's point: Even with Bayesian methods, if the researcher can choose the prior after seeing the data (or choose which model to test) then we have the same problem. However, preregistration (required in both) should fix the prior and the model.

  Therefore, with preregistration, the Bayesian approach (Proposal B) might be more robust because it doesn't require corrections for multiple looks and because it provides graded evidence.

  But note: The replication crisis was also due to low power. Lowering the threshold (Proposal A) will reduce power even more. In contrast, Bayesian methods do not inherently change power (it depends on the prior and the model). However, the preregistration in both proposals should encourage power calculations in advance.

  Also, the change to p<0.005 in Proposal A is a drastic change that might lead to a large loss of power without a corresponding increase in sample sizes. This could make it harder to detect true effects.

  Moreover, the use of Bayes factors without a threshold might lead to more nuanced interpretation, but also to more subjective interpretations. However, the requirement to specify the prior in advance (and the use of a default prior) can help.

  Conclusion: 
  - Proposal B is better because it avoids the specific problems of NHST (optional stopping and multiple comparisons) that are known to have contributed to the replication crisis, and it does so without the need for arbitrary corrections. With preregistration, the main concerns about the garden of forking paths in Bayesian analysis (prior choice, model specification) are addressed by pre-specification. 

  But we must also address the author's concern that the forking paths are not entirely eliminated. Even with preregistration, there can be multiple defensible analyses. Therefore, we should also require that the primary analysis is clearly identified and that any deviations from the preregistered plan are reported and justified.

  Memo Structure:

  1. Introduction: Recap of the replication crisis in the subfield and the two proposals.
  2. Analysis of the causes of failed replications: Focus on p-hacking (optional stopping, multiple comparisons), publication bias, and researcher degrees of freedom.
  3. Evaluation of Proposal A:
     - Strengths: Preregistration helps, and the lower threshold reduces false positives.
     - Weaknesses: Lower threshold without increased sample sizes reduces power. Also, even with preregistration, if the analysis is frequentist, optional stopping (if not pre-specified) and multiple comparisons (if multiple hypotheses are tested) still require adjustments that are not inherent in the method. Moreover, p-values do not provide direct evidence for the null.
  4. Evaluation of Proposal B:
     - Strengths: Bayes factors are not affected by optional stopping (due to the likelihood principle) and provide graded evidence. Preregistration fixes the prior and model. No need for multiple testing corrections in the same way because each test is evaluated on its own evidence (but note: if multiple tests are run, the chance of finding at least one with strong evidence increases, but the Bayes factor for each test is still valid for that test). Also, Bayes factors can provide evidence for the null, which is important in replication studies.
     - Weaknesses: The choice of prior can be controversial. However, with preregistration and specification of a prior (ideally a default or consensus prior) this is mitigated. Also, without a threshold, there might be ambiguity in interpretation, but we can provide guidelines (e.g., categories of evidence).
  5. Addressing the claim that Bayesian methods are structurally better:
     - Agree that for optional stopping and multiple comparisons (when the model and prior are fixed), Bayesian methods are more robust because they obey the likelihood principle. This is a real advantage.
     - However, the garden of forking paths (model specification, prior choice) is still present. But with preregistration, we force the researcher to fix these in advance, so the problem is mitigated in the same way for both frameworks. Without preregistration, both are vulnerable. With preregistration, the Bayesian framework has the added advantage of being immune to data-dependent stopping and multiple comparisons without further adjustment.
  6. Recommendation: Adopt Proposal B (Bayes factors with preregistration) because it directly addresses the p-hacking problems that have plagued our field and provides a more nuanced view of evidence. However, to guard against the forking paths, we require:
     - Preregistration of the analysis plan including the exact prior and the model.
     - Use of a default prior (or a set of reasonable priors) for the field, to be agreed upon by consensus.
     - Clear identification of the primary analysis and reporting of any deviations from the preregistered plan.

  Additionally, we might suggest that the journal also encourages the reporting of effect size estimates and confidence/credible intervals, and requires power analysis (for frequentist) or an analysis of sensitivity to the prior (for Bayesian) in the preregistration.

  But note: The board might be concerned about the learning curve for Bayesian methods. We can address by providing resources and guidelines.

