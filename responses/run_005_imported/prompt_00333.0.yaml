  The user mentions Andrew Critch and MIRI-adjacent work. Logical decision theories like Updateless Decision Theory (UDT) are central here. In Schelling's world, commitments are physical—like moving troops. But in logical decision theories, commitments are about pre-setting your response to any possible scenario, even before knowing other agents' strategies. That's a big shift. It's not about physical actions but about defining your decision algorithm ahead of time.

  The race dynamic is another crucial point. In Schelling's model, committing first is strategic but optional. In AI scenarios, especially with powerful, fast-acting AIs, there's a pressure to commit immediately. If one AI commits, it forces others to adapt, creating a race where everyone rushes to lock in their strategies without full information. This is risky because they might commit to harmful actions without understanding the stakes.

