  This was the most ambiguous case. While it's often cited in safety discussions, it's **not** clean goal misgeneralization. The seekers still pursue the original goal (find hiders), but use an unintended *capability* (physics exploit) to achieve it. This is primarily a robustness failure or outer alignment issue (the reward function didn't penalize physics exploits), not inner misalignment. The policy didn't learn a *different proxy goal*—it shortcut the intended goal using an exploit that generalized unexpectedly. I placed it in C-tier because it's alignment-relevant but misattributed.
