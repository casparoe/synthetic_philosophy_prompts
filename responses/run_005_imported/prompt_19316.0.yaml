  Let me mentally walk through Wittgenstein's likely response. His later work relentlessly attacked the idea that meaning lives "in the head." For him, a representation only means something through its use in a public context—like how the word "bridge" means what it does because of how English speakers correct misunderstandings, point to actual bridges, etc. 

  Applied to interpretability: when researchers say they "found a Golden Gate Bridge feature," Wittgenstein would probably scoff at the idea that those activation patterns intrinsically "mean" the bridge. He'd point out that the feature only becomes "about" the bridge through the researchers' own practices: showing bridge images, noticing correlations, creating visualizations. Without that human interpretive framework, it's just voltages changing.

  But crucially, he wouldn't call it arbitrary. The patterns are objectively there in the weights—they're just not intrinsically semantic. What makes them meaningful is how they function within the larger system that includes human investigators. It's like finding a rock that happens to fit your hand perfectly: the shape was always there, but "ergonomic" only makes sense relative to human hands.

