  Now Pinto's view: they argue for a single conscious system with partial unity. The corpus callosum disconnection prevents direct interhemispheric integration, but consciousness remains unified through subcortical structures. So identification/localization work because they're unilateral tasks handled by one hemisphere at a time. But comparison fails because it requires integrating information that the disconnected hemispheres can't share directly.

