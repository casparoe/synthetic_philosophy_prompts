answer: |-
  ### **The Voice & Provenance Session: Rules, Materials & Timeline**  
  *(Designed for 16 novelists, 90 minutes, participatory)*  

  ---

  ### **CORE RULES**  
  1. **No jargon allowed** until debrief. Words like "forgery," "pastiche," or "authenticity" are banned during play.  
  2. **Two writings per person**:  
     - **Passage A (Own Voice)**: 3–4 sentences on a shared prompt (e.g., *"A stranger returns something lost"*).  
     - **Passage B (Assigned Voice)**: 3–4 sentences on the **same prompt**, but written in the style of another participant (assigned secretly).  
  3. **Provenance Cards**: Each passage displayed has a card with one of three labels:  
     - **TRUE** (e.g., *"Written by [Name] in their own voice"*).  
     - **LIE** (e.g., *"Written by [Name] in their own voice"* when it’s actually an imitation).  
     - **UNVERIFIABLE** (e.g., *"Found in an archive. Author unknown"*).  
  4. **The Ledger**: Each player privately ranks passages in two columns:  
     - **A**: "Best Craft" (1 = best writing, 19 = worst).  
     - **B**: "Wish I Wrote" (1 = most envious, 19 = least).  
  5. **The Chapbook Stakes**: 3 passages will be published in a residency chapbook. Group must decide collectively.  

  ---

  ### **MATERIALS & PREP**  
  **Before the Session**:  
  - **Print 3 pre-written passages** (on separate sheets):  
    1. **Verbatim Copy**: Exact text from a public-domain work (e.g., Chekhov). Label with a fictional author.  
    2. **Pastiche 1**: Your imitation of a famous minimalist (e.g., Carver). Label with a fictional author.  
    3. **Pastiche 2**: Your imitation of a maximalist (e.g., Dickens). Label with a fictional author.  
  - **Provenance Cards** (print 19, shuffle randomly):  
    - 7 **TRUE** (e.g., *"Written by [Real Name] in their own voice"*).  
    - 6 **LIE** (e.g., *"Written by [Real Name] in their own voice"* for an imitation).  
    - 6 **UNVERIFIABLE** (e.g., *"Found in a private archive. Author and date unknown"*).  
  - **Assignments**: Randomly pair participants for imitation (ensure no one imitates themselves). Write assignments on index cards (e.g., *"Write Passage B in the style of [Name]"*).  
  - **Prompt**: Print a simple, open-ended prompt (e.g., *"A stranger returns something lost"*).  
  - **Ledger Sheets**: Print 16 copies (see template below).  

  **In the Room**:  
  - Index cards, pens, printer, tape.  
  - Wall space for 19 passages (16 participants + 3 pre-written).  
  - Timer.  

  ---

  ### **TIMELINE (90 MINUTES)**  
  **0:00–0:10 — Setup & Writing A**  
  - *You say*: "We’ll start by writing two short passages about a stranger returning something lost. First, write Passage A in **your own voice**. Keep it to 3–4 sentences."  
  - Hand out prompt cards. Start timer (5 mins).  
  - Collect Passage A from each writer.  

  **0:10–0:20 — Writing B**  
  - *You say*: "Now, write Passage B on the **same prompt**, but in the voice of another writer here."  
  - Hand out secret assignment cards (e.g., *"Imitate [Name]"*). Start timer (7 mins).  
  - While they write, tape pre-written passages to the wall.  

  **0:20–0:30 — Posting & Provenance**  
  - Participants tape both Passages A and B to the wall (32 passages total).  
  - **CRITICAL TWIST**: Randomly tape a **Provenance Card** to each passage (face-up). Cards **do not** distinguish between A/B—some lies attach to real voices, some to imitations.  
  - *You say*: "Read all passages. Ignore the cards for now—we’ll use them later."  

  **0:30–0:40 — First Ledger Ranking**  
  - Hand out **Ledger Sheets**.  
  - *You say*: "Rank passages 1–19 for:  
    - **Column A (Best Craft)**: Pure writing quality.  
    - **Column B (Wish I Wrote)**: Personal envy.  
    Focus on the text, not the cards."  
  - Participants rank (10 mins).  

  **0:40–0:55 — Partial Reveal & Debate**  
  - Flip **5 Provenance Cards** at random (2 TRUE, 2 LIE, 1 UNVERIFIABLE). Reveal their true origins.  
  - *You say*: "Some cards were wrong. Now, discuss:  
    - Should we change our rankings?  
    - What do we do with **unverifiable** passages? Destroy them? Celebrate them? Ignore the label?"  
  - Group debates (15 mins). Take notes on key arguments.  

  **0:55–1:05 — Second Ledger & Chapbook Vote**  
  - Re-rank **Column B only** (based on new info).  
  - *You say*: "Pick 3 passages for the residency chapbook. You’re editors—consider craft, provenance, and what readers deserve to see."  
  - Group negotiates and votes (10 mins).  

  **1:05–1:20 — Debrief**  
  - Reveal **all cards and pre-written passages**. Say the word "forgery" for the first time.  
  - Discuss:  
    1. **"When you saw a passage was a lie or copy, did your *experience* of the words change? Or just your *report*?"**  
       - *Map to game*: Pre-written verbatim copy (Chekhov) vs. pastiche (your Carver). Did "unverifiable" soften the blow?  
    2. **"Why does an indiscernible copy bother us more than an indiscernible new work?"**  
       - *Map to game*: Compare a participant’s **TRUE own-voice passage** that ranked low to a **LIE imitation** that ranked high. The words are identical—why does intent matter?  
    3. **"Text is just words. Does the distinction between 'new' and 'copied' hold?"**  
       - *Map to game*: The "unverifiable" passage everyone loved until they learned it was a lie. Did the words get worse?  
    4. **"We separated Column A (craft) and B (desire). What widened the gap?"**  
       - *Map to game*: Passages with "UNVERIFIABLE" cards often had larger A/B gaps—we distrust what we can’t place.  
    5. **"Chapbook stakes forced non-aesthetic choices. What criteria won?"**  
       - *Map to game*: Did the group exclude "unverifiable" works? Why?  

  ---

  ### **LEDGER TEMPLATE**  
  ```  
  PASSAGE | COL A: BEST CRAFT (1=best) | COL B: WISH I WROTE (1=most)  
  ––––––––|––––––––––––––––––––––––––––|––––––––––––––––––––––––––––––  
  #1      |                            |  
  #2      |                            |  
  ...     |                            |  
  #19     |                            |  
  ```  

  ---

  ### **WHAT WILL BLOW UP (AND HOW TO DEFUSE IT)**  
  - **Problem**: Someone’s style is parodied poorly, causing offense.  
    - **Defusal in Rules**: Add this during setup: *"When imitating, focus on **one trait** you admire in their writing (e.g., dialogue, rhythm). This is praise, not caricature."*  
  - **Problem**: A writer recognizes their own style and confronts the imitator.  
    - **Defusal in Rules**: State upfront: *"No revealing assignments until debrief. This is about texts, not authors."*  
  - **Problem**: Chaos during chapbook vote.  
    - **Defusal in Rules**: *"You have 3 votes each. Majority wins. Tie? Revote without lowest."*  

  ---

  ### **THE UNREPRODUCIBLE REALITY (FOR YOUR CLOSING TALK)**  
  **What the Game Can’t Capture**:  
  - **Time & Scale**: A forger’s 20-year deception (like your novel’s protagonist) layers dread, obsession, and systemic doubt—not replicable in 90 minutes.  
  - **Market Forces**: Real forgeries corrupt markets, scholarships, and legacies. Here, the chapbook is symbolic; there, it’s livelihoods.  
  - **Epistemological Dread**: Texts feel "hollowed out" when provenance collapses. Your game hints at this, but true horror needs *years* of trust.  

  **What to Emphasize in Closing**:  
  > "Today, we felt how provenance changes text *meaning*—not quality. A lie makes words feel stolen. An unverifiable text becomes a ghost. But in the end, the words don’t change. We do. Forgery isn’t a crime against art; it’s a crime against *time*. It steals history. And as writers, history is our only currency."  

  ---  
  **Final Note**: This design forces the group to *confront* unverifiable texts, *split* craft from desire, and *negotiate* stakes—all without jargon. The reveal lands your themes before you name them. Run it tight, and they’ll leave haunted.
