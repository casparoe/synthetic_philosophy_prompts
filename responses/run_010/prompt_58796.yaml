prompt: |-
  I run localization at a mid-size software company — roughly 400 strings a sprint going out into eleven languages, two of which nobody on my team actually reads, so we lean on vendors and scorecards. Those scorecards grade accuracy, fluency, terminology, style, locale conventions: basically, did the payload arrive intact. A contractor I've worked with for two years has been arguing that for some fraction of our content the scorecard is measuring the wrong thing entirely, and he keeps waving around Hofstadter's book on translation, the one built out of endless versions of a little sixteenth-century French poem, where the claim is roughly that translating isn't content transfer at all but re-performing what the original does — so a system that's just matching surface patterns can score clean and still have done nothing. He also says the same thing about modern neural translation, which I find more annoying because on our content it mostly just works. I took one semester of philosophy of language a long time ago and retained nothing usable, and I have no way to turn his argument into anything my project managers can act on.

  So what I want is a triage procedure, not an essay. An ordered set of questions a PM asks about a source string or a batch that routes it one of three ways: payload-dominant (meaning is separable from the wording, machine translation plus light post-editing is fine), performance-dominant (the wording is doing the work and a human has to go re-do the act in the target language), or can't-tell. For each question I need what counts as a sufficient answer, roughly how long it takes, what the PM does when they genuinely can't answer it, and — this matters — which of the questions are judgment calls wearing a procedure costume. It has to survive our volume: call it two minutes per string, fifteen for a batch, run by people with no linguistics training and no time to think about what meaning is. It has to end in a routing decision and a budget line, not a score out of ten.

  Then run it on four real things from last sprint: (a) a UI string with a count variable that has to pluralize correctly in Polish and Arabic; (b) a marketing tagline built on an English homophone that I already know doesn't exist in nine of the eleven; (c) a patient-facing leaflet for a connected insulin pen, where the failure mode isn't a mistranslated word but a reader who doesn't do the thing; (d) a changelog, sixty entries, mostly tedious, three of which are jokes the engineers think are very funny. Give me the routing for each and be blunt about the one where your procedure is going to annoy me — I'm braced for it to say the changelog is fine and the leaflet isn't, and I want the reasoning, not a hedge. Finally, tell me what the procedure can't settle and hand back to a human, and give me your honest read on whether the payload/performance split earns its keep or collapses into "scary texts get humans, boring ones don't," which would just be risk ranking with a philosophy hat on.
reasoning: |-
  Alright, the user is in charge of localization at a mid-sized software company. They handle about 400 strings per sprint across eleven languages. Two of those languages aren't read by their team, so they rely on vendors and scorecards that measure accuracy, fluency, etc. A contractor they've worked with for two years argues that for some content, the scorecard is measuring the wrong thing. The contractor references Hofstadter's book, which posits that translation is more about re-performing the original's act rather than just transferring content. This challenges their current metrics, especially since their neural MT works well for most content. 

  The user needs a practical triage procedure—not an essay—that PMs can use to categorize strings into three types: payload-dominant (suitable for MT with light editing), performance-dominant (requires human translation), or can't-tell. The procedure must be quick: max two minutes per string or fifteen for a batch. PMs lack linguistics training and time for deep analysis. Each question needs clear criteria, time estimates, and actions for unresolved cases. They also want to know which questions are really judgment calls disguised as procedures.

  They provided four real examples from last sprint: (a) UI string with count variables for Polish and Arabic plurals, (b) marketing tagline with an English homophone absent in most target languages, (c) a patient-facing insulin pen leaflet where the risk is user inaction, and (d) a changelog with mostly tedious entries but three jokes. They want routing decisions for each and honesty about where the procedure might annoy them. Finally, they want to know if the payload/performance split is valid or just risk ranking in disguise.

  First, I need to break down the core issue. The contractor's point is that some content's value lies in its effect on the reader, not just semantic accuracy. For example, a joke's humor or a tagline's catchiness might be lost even if translated "correctly." The user's current scorecards might give high scores to such translations despite them failing to achieve the intended impact. The challenge is translating this philosophical idea into actionable steps for busy PMs.

  The triage procedure needs to quickly identify where the "performance" aspect is critical. Key factors include: wordplay, cultural references, emotional tone, functional imperatives (like warnings), and anything where form affects function. Questions should flag these without requiring deep analysis. 

  For the examples: 
  - (a) UI string: Technical, relies on correct pluralization. Payload-dominant because variables are placeholders; MT handles structure, humans check rules.
  - (b) Tagline: Built on a homophone. Performance-dominant—requires creative adaptation, not direct translation.
  - (c) Insulin leaflet: High stakes. Instructions must compel action. Performance-dominant because misunderstanding could lead to harm, even if words are "accurate."
  - (d) Changelog: Mostly payload. Jokes are performance-dominant, but since they're a small part, maybe batch as payload with a human footnote. User expects annoyance here—likely because marking the whole changelog as payload feels wrong for the jokes.

  The "can't-tell" category is for ambiguous cases. Defaulting to human translation when uncertain might be necessary. The split's value lies in distinguishing content where MT suffices (payload) from where human nuance is irreplaceable (performance). It’s not just risk ranking because it explicitly targets content where form = function. However, it might overlap with risk in practice—e.g., medical content is high-risk and often performance-heavy. The procedure’s strength is forcing consideration of *why* something is risky, not just labeling it as such.
answer: |-
  Here's a triage procedure designed for speed, actionability, and budget impact. It avoids philosophy and focuses on observable triggers for "performance-dominant" content.

  **Triage Procedure for Localization Routing (Payload vs. Performance)**

  **Core Principle:** Is the *primary impact* of this string dependent on the **specific wording, structure, or cultural resonance** itself? If yes, it's likely Performance-Dominant. If the meaning is concrete, factual, and the wording is secondary, it's Payload-Dominant.

  **Ordered Questions (Run for each string or batch):**

  1.  **Does this text rely on wordplay, puns, rhyme, or specific cultural references/metaphors unique to the source language/culture?** *(e.g., "I feel nuts about Almond Butter!")*
      *   **Sufficient Answer:** "Yes" (Observed wordplay/reference) or "No" (None obvious).
      *   **Time:** < 30 seconds (Scan for obvious puns, rhymes, pop culture refs).
      *   **Can't Answer?** Flag as "Can't-Tell" or lean "Performance" if marketing/creative source.
      *   **Judgment Call?** **Yes.** Recognizing "unique" cultural refs can be tricky.

  2.  **Is the primary goal to evoke a specific emotional response (humor, excitement, urgency, trust) beyond simple understanding?** *(e.g., a joke, a passionate call-to-action, a reassuring safety message)*
      *   **Sufficient Answer:** "Yes" (Clear emotional intent stated/implied) or "No" (Neutral/informative).
      *   **Time:** < 30 seconds (Consider context: Marketing? Error message? Joke?).
      *   **Can't Answer?** Default to "Payload" unless context strongly suggests emotion (e.g., marketing slogan).
      *   **Judgment Call?** **Yes.** Gauging "primary goal" requires context awareness.

  3.  **Could subtle wording changes in the target language lead to user inaction, misunderstanding of critical function, or cultural offense?** *(e.g., clear instructions, safety warnings, culturally sensitive terms)*
      *   **Sufficient Answer:** "Yes" (High-risk context: medical, legal, safety, sensitive topic) or "No" (Low-risk information).
      *   **Time:** < 30 seconds (Assess context: Is it critical? Could bad wording cause harm/inaction?).
      *   **Can't Answer?** Flag as "Can't-Tell" or lean "Performance" if user-facing critical info.
      *   **Judgment Call?** **Yes.** Assessing "subtle" risk is subjective.

  4.  **Is the text highly stylized (poetic, dense metaphor, unconventional grammar) where the *form* is as important as the information?** *(e.g., a poem, avant-garde marketing copy)*
      *   **Sufficient Answer:** "Yes" (Obvious stylistic flair is core) or "No" (Standard prose).
      *   **Time:** < 30 seconds (Scan for unusual structure, heavy metaphor).
      *   **Can't Answer?** Default to "Payload".
      *   **Judgment Call?** **Yes.** Recognizing "core importance" of form is subjective.

  **Routing Decision:**

  *   **Payload-Dominant (MT + Light PE):** If **ALL** answers are **NO**. (Focus: Accurate meaning transfer).
  *   **Performance-Dominant (Human Translation):** If **ANY** answer is **YES**. (Focus: Recreating effect/intent).
  *   **Can't-Tell:** If PM genuinely cannot answer a question confidently *and* the context doesn't strongly push towards Performance (e.g., ambiguous marketing copy). **Action:** Route to Human Translation (low risk) OR escalate to Loc Lead for quick review (<1 min per "Can't-Tell" item).

  **Procedure on Your Examples:**

  1.  **(a) UI String (Count Variable - Polish/Arabic Pluralization):**
      *   **Q1:** No wordplay. **Q2:** No emotion (functional). **Q3:** **YES.** Incorrect pluralization *could* cause confusion or make UI look broken, hindering functionality. **Q4:** No unique style.
      *   **Routing:** **Performance-Dominant (Human).** *Why:* While the *meaning* is simple ("You have X items"), the *correct grammatical form* (plural rules) is critical to the UI functioning correctly and being perceived as professional. MT often struggles with complex plural rules, especially Arabic. Needs human linguistic finesse.
      *   *PM Time:* ~45 secs (Focus on Q3 risk).

  2.  **(b) Marketing Tagline (English Homophone):**
      *   **Q1:** **YES.** Explicitly built on a homophone absent in targets. **Q2:** Yes (evoke excitement/cleverness). **Q3:** No (low-risk misunderstanding). **Q4:** Possibly (stylized conciseness).
      *   **Routing:** **Performance-Dominant (Human).** *Why:* The entire point *is* the wordplay/cleverness. Direct MT will fail spectacularly. Needs human creativity to find an equivalent "hook" in the target language, even if it's different from the source.
      *   *PM Time:* ~30 secs (Q1 obvious).

  3.  **(c) Patient Insulin Pen Leaflet (Failure = Inaction):**
      *   **Q1:** No wordplay (assumed). **Q2:** Possibly (urgency/importance). **Q3:** **YES.** **CRITICAL.** Misunderstanding or unclear wording **could directly lead to patient harm** (incorrect dosage, pen failure). The "failure mode" isn't just wrong words, but the reader *not doing the thing correctly* due to phrasing. **Q4:** Unlikely (standard instructions).
      *   **Routing:** **Performance-Dominant (Human).** *Why:* This isn't about transferring medical facts alone. It's about **ensuring comprehension and driving correct action.** The wording must be crystal clear, culturally appropriate for health communication, and compelling enough to ensure adherence. MT cannot guarantee this level of nuance and impact. Lives depend on it.
      *   *PM Time:* ~45 secs (Focus on Q3 risk - obvious high stakes).
      *   **Annoyance Factor:** This is the one that **WILL** annoy you budget-wise. *Blunt Reasoning:* Yes, the *medical terms* might be payload, but the *instructional imperative* ("do this, *exactly* like this") is pure performance. The cost of human translation here is non-negotiable risk mitigation. Your contractor is 100% right on this type of content. Skimping is dangerous.

  4.  **(d) Changelog (60 entries, 3 jokes):**
      *   **Batch Analysis:**
          *   **57 Tedious Entries:** Q1: No. Q2: No. Q3: No (low risk). Q4: No. **Payload-Dominant.**
          *   **3 Jokes:** Q1: **YES** (humor often relies on language/culture). Q2: **YES** (goal is humor). Q3: No (low risk). Q4: Possibly. **Performance-Dominant.**
      *   **Routing:** **TWO OPTIONS:**
          1.  **Batch Route:** **Payload-Dominant (MT + Light PE) with a FLAG:** PM adds a clear note: "Entries #12, #27, #55 contain jokes requiring creative human translation. Vendor MUST assign these to a human for adaptation." Vendor cost: Payload rate for 57, Performance rate for 3.
          2.  **Split Batch:** Technically split, but administratively messy for 3 strings.
      *   *PM Time:* ~2 mins for batch (Scan for obvious jokes - usually marked or stand out).
      *   **Annoyance Factor:** The procedure says the **bulk is Payload**, which might feel wrong because of the jokes. *Blunt Reasoning:* The boring 95% *are* payload. Flagging the tiny performance fraction is efficient. Expectation management: Engineers need to understand their jokes cost extra.

  **What the Procedure Can't Settle & Hand Back:**

  1.  **Truly Ambiguous Tone/Intent:** If a PM genuinely can't tell if text is meant to be humorous, sarcastic, urgent, or neutral after scanning (Q2).
  2.  **Subtle Cultural Nuance in Low-Risk Contexts:** References or phrasing that might be slightly off but not offensive or functionally critical (Q1/Q3 edge cases).
  3.  **Highly Literary/Artistic Text:** Where the line between "style" (Q4) and "payload" is extremely blurred.
  4.  **"Can't-Tell" Flags:** As defined in the procedure.
      *   **Action:** Hand these specific items to the Localization Lead (you or a senior linguist) for a rapid (<1 min/item) "tie-breaker" decision based on experience. Default escalation path.

  **Does the Payload/Performance Split Earn Its Keep?**

  **Yes, but with caveats, and it's BETTER than just "scary vs. boring".**

  *   **Why it Earns Keep:**
      *   **Targets Cost:** It explicitly identifies *why* something needs the expensive human (performance) vs. the cheaper MT/PE (payload). This justifies budget allocation.
      *   **Focuses on Impact:** It moves beyond "accurate words" to "did it achieve the goal?" (laughter, action, understanding nuance). This aligns with Hofstadter's core challenge to your scorecards.
      *   **Captures Nuance Beyond Risk:** While high-risk content (medical, safety) is often Performance-Dominant (like your leaflet), it also flags *low-risk but high-creative* content (like the tagline or jokes) that needs humans. A pure risk model might miss the jokes or undervalue marketing impact.
      *   **Provides a Framework:** It gives PMs specific, observable things to look for (wordplay, emotion, critical function risk, style) rather than a vague feeling.
  *   **Where it Collapses/Is Blurry:**
      *   **Judgment Calls:** The "Yes/No" questions mask inherent subjectivity (as flagged). PMs need training and clear examples.
      *   **Context is King:** A string's category can depend entirely on *where it appears* (a button label vs. a poem). PMs must consider context quickly.
      *   **The Grey Zone:** There *is* a spectrum. Some "Payload" might benefit from a human touch, some "Performance" might be done cheaper. This triage forces a binary budget decision.
      *   **It IS Partly Risk-Ranking:** High risk *is* a major trigger for Performance (Q3). But it's risk defined by *linguistic/cultural impact on the user*, not just generic severity. The "philosophy hat" makes the risk assessment more precise for localization.
  *   **Honest Read:** This split is a **practical, actionable tool** born from the contractor's valid critique. It forces consideration of *function* over just *form*. It won't capture every nuance, but it will catch the critical stuff (safety, wordplay, core emotion) and provide a defensible basis for budgeting human effort where it matters most, beyond just "scary = human." It makes Hofstadter's point operational for your PMs. Implement it with clear examples and PM training, especially on the judgment calls. It will save money on the truly boring payload and protect you on the high-impact performance content.
