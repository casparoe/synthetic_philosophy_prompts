  ## The Extended Mind: Practical Wisdom for the Cognitively Outsourced  
  *by Dr. Iris Cognit, PhD (Cognitive Scaffolding), author of "My Phone, My Self: Constitution in the Cloud"*

  ---

  **Dearest Iris,**

  My ex-partner and I built an incredibly detailed shared notes app and family calendar over nine years. Doctor appointments, grocery lists, kid’s allergies, vacation plans, even our pet lizard’s feeding schedule – it’s all there. It *was* our externalized prefrontal cortex. Now, post-split, they’re threatening to delete the whole thing out of spite. They say it’s “just data,” but it feels like they’re threatening to lobotomize our co-parenting system! Can I get an injunction? Is this like that wrongful de-scaffolding case last year?

  *Feeling Digitally Amputated in Fresno*

  **Dear Amputated,**

  Ouch. This isn't just "data," it's a nine-year co-constructed cognitive institution. That app *is* part of your shared parental reasoning system – your beliefs about pediatrician availability, your mutual commitments to lizard care, your joint anticipation of soccer schedules. Deleting it isn't petty revenge; it’s *cognitive vandalism*. Legally, yes, cite *Henderson v. Synergon Corp* (the shared drive case). Argue this constituted a vital cognitive support structure akin to marital property, built with mutual reliance and trust. Demand mediation *immediately* – preferably with a mediator versed in distributed cognition. Emphasize the years of automatic endorsement and constant availability that integrated it into your coupled system. Treat this like the demolition of a jointly owned bridge you both *need*. Secure backups *now*. This is about preserving functional minds, not just files.

  ---

  **Dr. Cognit,**

  My university requires us to declare all “cognitive peripherals” on the exam cover sheet and hand them in. I have ADHD. My phone isn’t just a distraction blocker; its calendar holds my entire exam timetable structure, its notes app scaffolds my revision planning, and my medication reminders are *part* of my executive function. Handing it in feels like surrendering part of my working memory. But the invigilator says if I argue it’s a necessary accommodation, I’m admitting it *is* cognitive support, which means it’s cheating! Am I owed this accommodation or confessing to fraud?

  *Peripherally Perplexed in Pittsburgh*

  **Dear Perplexed,**

  The invigilator’s logic is stuck inside the skull. Your phone *is* part of your cognitive architecture for planning and recall – that’s precisely *why* declaring it is standard! The "cheating" fear assumes cognition only happens under the scalp. Nonsense. Think of it like declaring a prosthetic limb; you wouldn’t call someone a cheat for using a wheelchair during a race. Your phone’s calendar and reminders are constitutive parts of your functional memory and executive control system. Declare it honestly as a necessary cognitive peripheral (cite its functions: timetable structure, planning scaffold, reminder system). Argue that *denying* its use constitutes a failure to provide reasonable accommodation for your neurodivergent cognitive system. The university’s own policy recognizes extended minds – use that framework. You’re not confessing; you’re correctly inventorying your cognitive toolkit. Fight for it.

  ---

  **Hi Iris,**

  Every single morning for three years, I drive past the same billboard advertising “Sunnydale Meadows Retirement Haven.” I barely notice it consciously anymore. Lately, though, I find myself humming their jingle randomly, picturing the unnervingly cheerful couple on the sign, and – worryingly – I caught myself telling a friend I’d “probably end up somewhere peaceful like Sunnydale.” I never *chose* this! Is this billboard slowly becoming part of my beliefs about my future? Am I cognitively coupled to an ad? Am I… becoming a Sunnydale believer?

  *Billboard Blues in Boise*

  **Dear Blues,**

  This is a fascinating case of passive environmental coupling pushing the boundaries. The Sunnydale billboard likely *isn't* yet part of your extended mind, but your vigilance is understandable. Key criteria: **Constant Availability?** Only during your commute – not reliable enough. **Automatic Endorsement?** You feel unease, not trust; it’s an intrusion, not an integrated tool. **Trust built over time?** Three years of exposure creates familiarity, but not the *active, two-way trust* of Otto and his notebook or you and your calendar. It’s more like cognitive noise pollution subtly shaping associations through sheer repetition – deeply concerning, but not constitutive *yet*.

  However... your humming and that offhand comment suggest a potential blurring. You didn't *choose* this belief-scaffold, and you don't *trust* it, but prolonged, passive exposure *can* create quasi-beliefs through environmental saturation. The line is thin. While not currently part of your *deliberative* mind, it might be forming parasitic proto-beliefs in the perceptual periphery. I recommend active counter-programming: blast music you *choose* during the commute, put a chosen, trusted affirmation on *your* dashboard ("Future Undecided!"), or take a different route. Reassert cortical control. If, after 20 years, you automatically endorse Sunnydale as your destiny *without* unease... well, we might need to revisit. For now, fight the passive encroachment. You are not the billboard.

  ---

  **Where This Lands:**

  1.  **Target:** The column satirizes the reductio ad absurdum inherent in taking Extended Mind (EM) *too* seriously and literally in *all* contexts. It targets the *confidence of deployment* and the practical, emotional, and even ontological absurdities that arise when constitutive claims bleed out of the carefully controlled Otto/Ingga scenario into messy human lives (breakups, exams, advertising).
  2.  **Genuine Objection:** The billboard letter genuinely corners the columnist. EM relies heavily on trust, reliability, and *active* integration as marks of constitution. The billboard fails these (it's untrusted, unreliable outside the commute, passively absorbed). Yet, its undeniable psychological influence exposes the "cognitive bloat" worry: if *everything* that shapes us counts, where's the boundary? The columnist's weak "not yet constitutive... but quasi-beliefs... maybe in 20 years..." is the dam breaking. This highlights the theory's struggle with passive, untrusted environmental influence versus active, trusted tools.
  3.  **Answerable Objection (if cleverer):** The student's dilemma is answerable *within* EM. A cleverer columnist could hammer harder: Declaring the phone *is* acknowledging its constitutive role, which is precisely why its *controlled use* (e.g., allowing calendar/reminder *access* under supervision, not open browsing) could be a valid accommodation, distinct from cheating which implies accessing *external* information. The invigilator confuses the *tool* (part of mind) with *unauthorized external info*.
  4.  **Bending the Lit:** The "trust" criterion gets slightly bent/stressed for the billboard joke. Clark & Chalmers emphasize *endorsement* upon retrieval, which the writer explicitly lacks ("unease"). The column pushes "prolonged exposure -> quasi-belief" further than the literature strictly might to create the humorous (and troubling) slippery slope. The "20 years" line is pure comedic extrapolation.
