prompt: |-
  I've been reading argument blogs for the better part of two decades, and one habit I've never shaken is treating a settled institutional arrangement as evidence about the beliefs of the people who built it. The arrangement I want examined is the current spread of legal regimes governing adult sex work, because the four on offer look to me like four different answers to a question that is rarely stated aloud. Sweden, since 1999, criminalises the purchase of sexual services while leaving the seller unprosecuted; Norway followed and then pushed its purchase ban extraterritorially, so that a Norwegian buying sex abroad can be charged at home. The Netherlands for decades ran a formal policy of toleration — conduct that remained unlawful but was simply not prosecuted — before lifting the general ban on brothels around the turn of the millennium and substituting municipal licensing. New Zealand's Prostitution Reform Act 2003 decriminalised the trade and folded it into ordinary employment and occupational health-and-safety law, giving workers an explicit right to refuse a client, while its section 19 confines the right to work to citizens and permanent residents and makes any temporary visa holder liable to deportation for doing it, and its local councils retain bylaw powers over where brothels may sit and what they may advertise. What I want is a reconstruction of the implicit normative theory behind each: what has to be true about consent, about who the moral patient of the transaction is, and about the expressive function of law, for each regime to be the thing its architects chose rather than something else?

  Two hypotheses of my own should be tested rather than assumed, because I suspect both are partly wrong. First, the purchase-only ban is structurally an incitement offence: it punishes the party who occasions another's conduct while exempting the party who performs it, which normally happens only where the performer is a child, is defrauded, or is otherwise denied full agency — so either the regime is committed to a claim of structural coercion that impairs the seller's consent, or it is committed to something else entirely, and I cannot see what. If it is the coercion claim, why does the same legislature not apply that claim to agricultural or care work performed under comparably desperate conditions? Second, I think "liberalisation" is a bad axis. Non-prosecution of still-unlawful conduct, decriminalisation, licensing, and positive certification are four distinct expressive postures, and the New Zealand statute appears to want a fifth: its own purpose clause says the Act decriminalises prostitution "while not endorsing or morally sanctioning prostitution or its use", which reads to me as an attempt to authorise an activity while disclaiming the authorisation. Please tell me whether that is coherent, and if not, which half of it the rest of the Act actually implements — because the occupational-health-and-safety framing presupposes that this is work the state helps organise, whereas the exclusion of migrant workers and the zoning bylaws presuppose either that it is a land-use nuisance to be contained or that its supply should be rationed by immigration policy. Distinguish carefully throughout between what a regime strictly presupposes, what merely fits it well, and where the practice is philosophically underdetermined so that several rival theories would license the very same statutes.

  Finally, for each regime, say what would have to change in concrete administrative practice — policing, licensing, tribunal jurisdiction, border screening, council bylaws — if the presupposed theory were replaced by its most serious rival. I am not asking you to take a side on whether sex work should be legal, and I would rather you did not spend words on the empirical disputes about trafficking flows or street-based displacement, except where an empirical claim is doing hidden normative work in a regime's self-description and you can point that out. End with an explicit statement of what would change your mind: which argument or piece of institutional evidence would lead you to a different reconstruction of any one regime's commitments, and where in your reasoning you think you are most likely to have gone wrong — my strong prior is that the incitement analogy is doing more rhetorical work than it can bear. Please write the whole response in British English.
reasoning: |-
  Okay, this is an exceptionally sophisticated query about comparative legal approaches to sex work, demanding philosophical reconstruction of implicit normative theories. The user has clearly spent years analysing institutional designs and wants to avoid common rhetorical pitfalls.

  First impression: This isn't just about sex work legality but about how legal structures encode unstated moral premises. The user specifically rejects surface-level "liberalisation" narratives and wants to examine the underlying architecture of consent, moral agency, and state expression. Their two hypotheses show deep engagement - particularly the sharp observation that purchase-only bans structurally resemble incitement offences normally reserved for situations involving compromised consent.

  Key challenges I need to address:
  - The incitement analogy puzzle: Why treat sex work differently from other precarious labour if coercion is the concern?
  - New Zealand's apparent contradiction in decriminalising while morally disavowing
  - Strict separation between normative presuppositions vs merely compatible theories
  - Concrete translation of philosophical shifts into administrative changes

  The user's British English request suggests they may be Commonwealth-based (given NZ/Sweden/NL focus), so I'll prioritise those jurisdictional nuances. Their "strong prior" about the incitement analogy being overloaded means I should particularly scrutinise that.

  For Sweden's model: The core seems to be that prostitution is inherently exploitative regardless of individual consent. The state treats the buyer as committing a fundamental violation against human dignity, hence the extraterritorial extension in Norway. But the agricultural work comparison is devastating - why not criminalise purchasing cheap coffee? The implied distinction must be that sexuality occupies a special moral category where consent is always vitiated by structural inequality.

  Netherlands' licensing regime feels pragmatic rather than morally coherent. By regulating brothels like casinos, it implies prostitution is a vice to be contained, not ordinary work. The shift from toleration to licensing suggests a concession to reality while maintaining social control.

  New Zealand's contradictions are fascinating. Granting workplace rights while excluding migrants reveals a split consciousness: citizens can choose this work, but allowing foreigners to do it would imply state endorsement of prostitution as migration-worthy labour. The zoning powers further betray residual "not in my backyard" morality.

  Biggest vulnerability in my reasoning: Assuming all regimes have coherent philosophical foundations. What if some are purely path-dependent compromises? But the user wants presuppositions reconstructed, so I'll proceed while flagging this risk.

  For mind-changing evidence: If Swedish legislators explicitly rejected the coercion argument, or if NZ courts interpreted the purpose clause as full normalisation, that would force reevaluation. The migrant worker exclusion is the hardest nut - maybe it's just xenophobia dressed as moral neutrality?
answer: |-
  Below is a reconstruction of the implicit normative theories underpinning each sex work regime, tested against your hypotheses. I adhere to British English throughout and distinguish between **strict presuppositions** (logically necessary for the regime), **strong fits** (highly coherent but not strictly necessary), and **underdetermined areas** (compatible with multiple theories). Concrete administrative consequences of theoretical shifts are specified for each.

  ---

  ### **1. Swedish/Norwegian Model (Nordic Model): Purchase Criminalised, Sale Decriminalised**
  **Core Presuppositions**:
  - **Strict**: Prostitution is inherently exploitative due to *structural gender inequality*. The seller is a victim of patriarchy/capitalism, lacking meaningful consent regardless of individual circumstances.  
  - **Strict**: Moral responsibility resides solely with the buyer, who perpetuates exploitation. The seller’s agency is categorically impaired by systemic forces.  
  - **Strong Fit**: Law expresses societal condemnation of commodifying intimacy. Sex acts are morally distinct from other labour; consent cannot be "validated" by market logic.  

  **Testing Your Hypotheses**:  
  - **Incitement Analogy**: Your coercion claim is *partially* correct but incomplete. The regime presupposes that prostitution is **uniquely degrading** due to its intimacy, not merely economically coercive. This explains why agricultural/care work isn’t treated identically: the state views sexuality as a non-alienable aspect of personhood. *Alternative explanation*: The law symbolically protects sexual integrity as a public good, rendering individual consent irrelevant.  
  - **Why Not Other Precarious Work?** The regime strictly presupposes that *sexual consent under capitalism is structurally impossible*. Other labour is seen as alienable effort, not intrinsic identity.  

  **Administrative Shifts Under Rival Theory**:  
  If replaced by **full decriminalisation** (NZ model):  
  - Police resources shift from targeting buyers to brothel inspections.  
  - Extraterritorial prosecutions (Norway) abolished.  
  - Sellers gain access to labour courts, health/safety inspections, and unionisation.  

  ---

  ### **2. Dutch Model: Regulated Brothels, Municipal Licensing**
  **Core Presuppositions**:  
  - **Strict**: Prostitution is inevitable but potentially harmful. The state’s role is to *minimise public nuisance* (crime, health risks) through containment.  
  - **Strong Fit**: Sex work is a **morally neutral service industry**, but its externalities require state control. Licensing reflects pragmatic governance, not moral endorsement.  
  - **Underdetermined**: Consent is treated as negotiable in practice (via contracts), but not central to the law’s logic.  

  **Testing Your Hypotheses**:  
  - **"Liberalisation" Axis**: You correctly note licensing is distinct from decriminalisation. The regime **fits** a *utilitarian* theory: toleration failed to reduce harm; licensing maximises social order. The state "manages" rather than endorses.  

  **Administrative Shifts Under Rival Theory**:  
  If replaced by **Swedish Model**:  
  - Brothel licenses revoked; buyers targeted in street operations.  
  - "Exit programmes" funded by the state, reframing sellers as victims.  
  - Zoning bylaws tightened to eradicate visible sex work.  

  ---

  ### **3. New Zealand Model: Full Decriminalisation with Occupational Safeguards**
  **Core Presuppositions**:  
  - **Strict**: Sellers possess **full agency**; consent is operable if structural supports exist (e.g., right to refuse clients).  
  - **Strong Fit**: Prostitution is **work like any other**, but socially contentious. The state must ensure safety *without* moral approval.  
  - **Contradiction**: Section 19 (migrant exclusion) and bylaws presuppose prostitution is either a **social ill** (nuisance zoning) or **undesirable labour** (immigration control).  

  **Testing Your Hypotheses**:  
  - **Decriminalisation vs. Disavowal**: The purpose clause is *coherent only if* the state distinguishes between **authorisation** (legal permission) and **endorsement** (moral approval). This mirrors laws on gambling or alcohol: regulated but not encouraged.  
  - **Migrant Exclusion/Land Use**: Strictly presupposes that prostitution remains **socially destabilising** if "uncontained." Rationing supply via immigration implies it is not "legitimate" work worthy of migrant labour.  

  **Administrative Shifts Under Rival Theory**:  
  If replaced by **Dutch Model**:  
  - Councils impose licensing (e.g., mandatory health checks, venue caps).  
  - Sellers lose workplace rights; disputes handled by police, not labour tribunals.  
  - Migrant workers face fines/arrest, not just deportation.  

  ---

  ### **Theoretical Cross-Cutting Analysis**
  | **Regime**         | **Theory of Consent**             | **Moral Patient**       | **Law’s Expressive Function**      |  
  |---------------------|-----------------------------------|-------------------------|------------------------------------|  
  | Sweden/Norway       | Structurally void                 | Seller (as victim)      | Condemn exploitation               |  
  | Netherlands         | Contingent (managed via regulation) | Public order           | Neutralise externalities           |  
  | New Zealand         | Operable with safeguards          | Worker/Seller           | Protect without endorsing          |  

  ---

  ### **What Would Change My Mind**
  1. **Swedish Model**: If legislative records showed *explicit rejection* of the "structural coercion" argument (e.g., framing buyers as "immoral" rather than exploiters), I would abandon the consent-impairment thesis.  
  2. **NZ’s Section 19**: If immigration tribunals ruled migrant deportations *contradict* the purpose clause, this would expose the regime’s incoherence and force a stricter "nuisance control" reading.  
  3. **Incitement Analogy Flaw**: Your prior is likely correct. If Swedish courts applied purchase bans to *other "degrading" services* (e.g., sweatshop labour), the analogy holds; otherwise, it is rhetorical overreach.  

  **Where I’m Most Likely Wrong**: Over-attributing coherence to the NZ model. The migrant worker exclusion may reflect political compromise, not philosophical commitment, making the regime fundamentally schizophrenic rather than "disapproving but pragmatic."  

  ---  
  This reconstruction prioritises institutional logic over empirical outcomes, treating each regime as a crystallisation of unstated beliefs. The administrative consequences highlight how deeply normative theories shape concrete governance.
