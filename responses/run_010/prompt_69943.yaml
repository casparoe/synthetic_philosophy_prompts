answer: |-
  ## The Sum of Our Scales

  The waiting room of the Vital Allocation Directorate hummed with the sterile tension of a high-stakes laboratory. Soft light panels mimicked an unchanging noon. Citizens sat like specimens under glass, clutching their Universal Utility ID bracelets. Mara traced the cool metal band, its embedded chip containing the mathematical distillation of her life’s value, calibrated a decade ago by a questionnaire she barely remembered.

  Beyond the soundproofed door, officials in dove-grey suits moved with quiet efficiency, overseen by the Directorate’s guiding principle: Harsanyi’s Aggregation. Every citizen held a von Neumann-Morgenstern utility function – a rational blueprint of preferences under uncertainty. Social value was the weighted sum. The weights? Set impartially, years ago, before anyone knew who they’d become. The arithmetic was flawless, transparent, unimpeachable. The resource being allocated today, Palliatex-V, was brutally scarce. It could extend the lives of some terminally ill patients by years, while slightly shortening the lives of others with less critical, chronic conditions due to rare side effects. Life, measured, summed, allocated.

  Mara’s name flickered on a screen. She entered the consultation chamber. Official Aris, young, earnest, with eyes that held the conviction of clean mathematics, gestured to a chair.

  “Ms. Elara,” he began, voice smooth as the algorithm he served. “The aggregate optimization for Palliatex-V allocation places you outside the beneficiary cohort.”

  Mara had expected this. Her diagnosis – Xylar’s Degeneration – was terminal, aggressive. Palliatex-V offered her perhaps eighteen more months. But the Directorate’s calculus saw more utility elsewhere.

  “I reviewed my profile,” Mara said, her voice surprisingly steady. “It’s not the outcome I question, Aris. It’s the unit.”

  Aris blinked. “The unit?”

  “My utility function. The numbers in this bracelet.” She tapped it. “Calibrated ten years ago. Healthy, planning a career in botanical bio-physics, optimistic. Remember the questions? ‘Would you prefer a 50% chance of winning £10,000 or a certainty of £4,500?’ ‘Rate your fear of permanent coma versus immediate death on this scale.’ Abstract gambles. Hypothetical horrors.”

  “The von Neumann-Morgenstern axioms ensure internal consistency,” Aris stated, a reflex. “Your preferences then revealed your underlying risk aversion, your valuation of states…”

  “But the *scale*, Aris!” Mara leaned forward. “The *zero point*! That questionnaire defined ‘zero utility’ as… what? The ‘neutral state’? Somewhere between mild discomfort and boredom? And ‘maximum utility’ as winning the lottery while achieving a life’s ambition?” She gave a dry, humorless laugh. “They never asked about the utility of *this*. Of watching your body fail, knowing time is a thief you can see. Of the sheer, terrifying *weight* of wanting just a little more sun, more breath, more… presence.”

  Aris shifted, discomfort breaking through his professional veneer. “The calibration establishes a common metric. It allows aggregation. Without a defined scale and origin, interpersonal comparison is impossible. The weights…”

  “The weights are set behind the veil, yes,” Mara interrupted. “But the veil only hides who gets weighted *more*. It doesn’t hide the fact that the ruler you’re using to measure all our lives… this ruler…” she held up her wrist, “…was built for measuring the distance between mild annoyance and moderate satisfaction. Not for measuring the distance between *being* and *nothingness*.”

  She saw the flicker in his eyes – not disagreement, but recognition. He knew the technicality. “Ms. Elara, the theorem accounts for affine transformations. Linear rescaling. Adding a constant. Your function is unique *up to* that. But the *ratios*, the trade-offs revealed in your choices under risk… those are preserved.”

  “Preserved for *what*?” Mara pressed. “The ratios between winning £5,000 and £10,000? Between a headache and a broken arm? Those ratios tell you *nothing* about the ratio between six more months with my daughter and… oblivion! The calibration forced my younger self to fit existential dread onto a scale designed for Friday night disappointments. The zero point you added – that baseline ‘neutral’ – it absorbs the entire abyss. My terminal illness isn’t just a low number; it’s measured *downwards* from a point that never comprehended its depth. The normative work wasn't eliminated by the theorem, Aris. It was buried in the calibration manual, years ago, when someone decided what ‘neutral’ looked like and how big a ‘util’ should be.”

  Aris took a breath, regaining his equilibrium. His defense was genuine, born of believing the system was the least worst option. “And the alternative, Ms. Elara? Should officials *now* decide whose suffering is deeper? Whose potential joy is brighter? Inject their own biases, their fleeting intuitions? That merely hides the normative choice inside a fallible human mind, shrouded in opacity. Harsanyi’s framework exposes it. The weights are fixed pre-identity. The utilities are derived from revealed choice, not whim. The arithmetic is public. Where else can we find such neutrality?”

  “Neutrality?” Mara whispered. “Or just blindness? You’ve built a magnificent machine, Aris, that adds apples and oranges by first declaring they’re both just ‘fruit units’, then insisting the sum is objectively correct. My life isn't a fruit unit. It can't be captured by the distance between lottery choices I made before I knew what loss truly meant.”

  The chamber hummed. A soft chime announced the finalization of the allocation cycle. Aris glanced at his console, a complex lattice of numbers resolving into a distribution map.

  “The allocation is complete,” he said, his voice regaining its official timbre, though his eyes remained fixed on the screen, troubled. “Aggregate social utility has been maximized under the constraints.”

  Mara didn’t ask who got the drug. It was irrelevant to her point. But Aris stared at the final readout, a strange stillness coming over him.

  “Look,” he said, almost to himself, pointing at two entries on his screen. “Distribution Alpha and Distribution Beta. Utterly different. Alpha routes Palliatex-V to five individuals with moderate chronic conditions – it shortens their projected lifespan by an average of three months due to side effects, but significantly improves their quality of life. Net positive utility gain per the functions.”

  He tapped another line. “Beta… routes a larger dose to one individual. Terminal prognosis without it: six months. With it: perhaps two years. Significant positive utility gain. But…” he paused, “Beta also routes a tiny, critical fraction away from… from someone else. Someone for whom that fraction means losing Palliatex-V entirely. Their utility loss… it’s calibrated as catastrophic.”

  Mara knew. Beta was the distribution that *could* have included her, had the weights or the scale been different.

  “And?” Mara asked, sensing the cold revelation dawning on Aris.

  “And…” Aris’s voice was hollow. “The sum. The *aggregate* utility sum… for Alpha and Beta… they are identical. To fourteen decimal places. The optimization engine is indifferent. The social value… is precisely the same.”

  The sterile perfection of the room seemed to crack. The flawless arithmetic, the unimpeachable sum, declared these two realities – one where five people traded minor lifespan for comfort, another where one person clawed back years from the brink while another was pushed over it – as morally and socially equivalent. Because the units absorbed the cataclysm of Mara’s potential loss into its pre-defined scale, just as it absorbed the diffuse gains of the five.

  Mara watched Aris. The official who defended the machine in good faith, who believed its transparency was superior to hidden bias, now confronted the machine’s terrifying neutrality. The choice between Alpha and Beta wasn't dictated by the sum; the sum, built on years-old calibrations defining zero points and util scales, rendered them *mathematically* indistinguishable. The normative choice, the value judgment about *which* suffering mattered more, *which* gain was preferable, hadn't been eliminated. It had been deferred to this very moment, hidden not in intuition, but in the cold indifference of an identical total.

  The system would choose. A subroutine, perhaps based on timestamps or random seeds, would pick Alpha or Beta. The aggregate wouldn't flinch.

  Mara stood. The fight had gone out of her, replaced by a profound, weary understanding. “The unit was never built to carry it, Aris,” she said softly, not looking at the screen, looking only at the young man whose faith in the beautiful equations was fracturing. “My life. Her life. His life. They overflow your util. They break your scale.”

  She walked out of the chamber, leaving Aris staring at the two equal sums glowing on his console – a numerical monument to the vast, silent space where mathematics ended and meaning began, a space filled by the immeasurable weight of a single human breath, wanting just a little more time. The machine whirred, selected Alpha, and moved on, its arithmetic forever perfect, forever blind.
