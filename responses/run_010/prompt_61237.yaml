prompt: |-
  I'm a software engineer on a small team that runs an eDNA biodiversity monitoring platform: customers send us water and soil samples, we sequence what is in them, and we report back which organisms are present. I have no philosophy training, so I'll describe our situation plainly and ask you to supply the technical vocabulary where the literature has some.

  For years our pipeline grouped sequences into operational taxonomic units — clusters at 97 percent similarity, used as a stand-in for species. We are now migrating to exact sequence variants, where the reported unit is a single reproducible sequence rather than a cluster. The schema has to name what we hand customers, and the naming argument has turned philosophical. The person whose judgment we defer to is our data lead, who came to the job from ecology and reads philosophy on her own. Her rulings so far:

  - The chemical elements, gold above all: real kinds. Water too, though she said the interesting thing about water is not that identifying it with H2O is useful, but that the identification, once made, could not have come out otherwise.
  - Jade as the trade uses the word, covering both nephrite and jadeite: not a kind but a market convenience; the two minerals have different structures and were lumped because they look alike and sell alike.
  - Weeds: not a kind, and she treats this as obviously relative to what we care about.
  - Biological species: real kinds, even though she freely admits no single species definition works across bacteria, oaks, and mammals at once. Her reason was that what makes a species real is the process holding it together, not the definition we use to find it.
  - Hurricanes: real kinds, even though each one is a unique event.
  - Major depressive disorder as the diagnostic manual defines it: not a natural kind, despite doing enormous honest work in clinics, trials, and billing codes. She said a category can earn its keep in a practice without carving anything.
  - Planet, after Pluto was reclassified: not a natural kind, because the cutoff is stipulated even though the physics on either side of it is real. She flagged this as her least confident call.
  - Human races: not natural kinds, and she was emphatic that this has nothing to do with fuzziness or politics — nothing maintains the clusters, and she would reconsider if something did.

  Here is the case she has not ruled on. A 97 percent operational taxonomic unit is projectible in practice: ecologists generalize over OTUs across studies, and OTU composition tracks environmental gradients reliably. But nothing maintains the boundary — we chose 97 percent, and other clustering methods carve the same reads differently. An exact sequence variant has no threshold and is reproducible across labs, but it is arguably one lineage rather than a class of things at all.

  Predict her verdict on each. Then, the part I most want: she has already said species are real kinds, and the OTU is the best detector of species we have. Does reliably detecting a natural kind make the detector's output a natural kind, or is the relationship more like that between a thermometer reading and temperature — tracking something real without being it?

  What I'd like back:

  1. The candidate rules that fit all eight verdicts, not merely the one you would bet on. Name them if the literature names them; explain them in a sentence each if it does not.
  2. For each rule that survives, what it predicts about the OTU and about the sequence variant, and precisely where the surviving rules come apart.
  3. Your best guess for each of the two units, with the reason you prefer that rule over its rivals.
  4. One further case she has not ruled on that would discriminate between your top two rules.
  5. If any of her eight verdicts sits in tension with the rule you favor, say so rather than quietly dropping the verdict.
  6. One sentence of schema documentation, consistent with her rulings, describing what the reported unit is — under each of your top two rules, so I can see what we would be committing to by choosing either.

  Open with your two predictions, one sentence each, before any of the analysis. Keep the entire response under 600 words and write it in American English. I would rather have a committed, argued answer than a survey of the options.
reasoning: |-
  Hmm, the user is a software engineer on an eDNA biodiversity team. They're migrating from OTUs to ESVs and need philosophical guidance on naming schema from their data lead. The data lead has made eight prior rulings on natural kinds (gold, jade, weeds, species, hurricanes, depression, planets, races), and they want me to predict her verdicts on OTUs and ESVs while resolving whether detectors inherit kind status.

  First, I need to extract principles from the eight rulings. The consistent theme appears to be: kinds are real when maintained by mind-independent processes (gold's atomic structure, species' evolutionary mechanisms, hurricanes' meteorological dynamics), not human interests (weeds, jade trade) or stipulation (planetary cutoff). Depression fails despite clinical utility because no sustaining process exists. Races lack maintaining mechanisms.

  For OTUs vs ESVs: OTUs are projectible but arbitrarily bounded (97% threshold), while ESVs are discrete molecular entities. The data lead already called species real kinds and OTUs their detectors. The core question is whether detectors become kinds themselves.

  Predictions:
  - OTUs won't be natural kinds because boundaries are stipulated (like planets' cutoff) despite tracking real patterns. 
  - ESVs will be natural kinds as they represent actual molecular lineages (like gold's atomic identity), reproducible without thresholds.

  Surviving rules:
  1. Process-maintenance criterion: Kinds exist when sustained by causal processes. 
  2. Projectibility criterion: Kinds must support inductive generalizations.

  Both fit the eight verdicts. Where they diverge: OTUs are projectible but lack maintenance; ESVs have maintenance (molecular identity) but may not fully capture ecological units. 

  My bet is on process-maintenance. It explains why depression (projectible but no process) isn't a kind, and why OTUs fail despite utility. ESVs qualify as molecular kinds.

  Discriminating case: Virus quasispecies - swarm of variants maintained by evolutionary process. Process-maintenance sees it as a kind; projectibility might not if variants behave differently.

  Schema documentation:
  - Under process-maintenance: "ESV: molecular lineage maintained by evolutionary constraints; OTU: heuristic cluster approximating species."
  - Under projectibility: "ESV: discrete sequence unit enabling cross-study comparison; OTU: projectible class tracking environmental gradients."

  Tension: Planets were deemed non-kinds due to stipulation, but hurricanes (similarly human-named) were accepted. Process-maintenance resolves this - hurricanes have physical maintenance processes while planet definitions rely on convention.
answer: |-
  Based on your data lead's pattern, I predict:
  - **OTUs are not natural kinds**: Their 97% boundary is stipulated (like the planetary cutoff), despite tracking real patterns.
  - **ESVs are natural kinds**: They represent discrete molecular lineages maintained by evolutionary constraints, akin to gold's atomic identity.

  **1. Surviving rules**:
     - **Process-Maintenance Criterion**: A kind is natural if a mind-independent process sustains its boundaries (e.g., atomic forces for gold, natural selection for species). Fits all except possibly planets (her "least confident").
     - **Projectibility-Plus Criterion**: A kind is natural if it supports robust inductive generalizations *and* reflects causal structure (e.g., hurricanes as meteorological patterns). Fits all eight: weeds/jade lack causal depth; depression/planets lack non-stipulated structure.

  **2. Diverging predictions**:
     - **OTUs**: Process-maintenance rejects them (no sustaining process for 97% cutoff). Projectibility-plus accepts them (they generalize across studies and track environments).
     - **ESVs**: Both accept them, but for different reasons: process-maintenance (molecular identity maintained by mutation constraints) vs. projectibility-plus (reproducible, induction-supporting units).

  **3. Best guess**:
     - **OTU**: Not a natural kind. Prefer **process-maintenance** (emphasized in species/hurricanes rulings) over projectibility-plus. OTUs are detectors, not sustained kinds, like a thermometer reading.
     - **ESV**: Natural kind. **Process-maintenance** explains why reproducible sequences are kinds (lineage constraints) while OTUs aren’t.

  **4. Discriminating case**: *Virus quasispecies* (evolving viral swarms). Process-maintenance sees them as a single kind (selection maintains the swarm); projectibility-plus may not (if variants behave inconsistently).

  **5. Tension**: *Planets* being "not a kind" slightly strains process-maintenance (orbital dynamics maintain Pluto-like bodies). She flagged uncertainty here, so it’s reconcilable.

  **6. Schema documentation**:
     - Under **process-maintenance**: "ESV: a natural molecular lineage maintained by evolutionary constraints. OTU: a heuristic cluster approximating species boundaries."
     - Under **projectibility-plus**: "ESV: a natural unit for cross-study inference. OTU: a projectible class tracking ecological gradients."
