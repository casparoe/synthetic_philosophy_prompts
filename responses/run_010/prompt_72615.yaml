prompt: |-
  I sit on the clinical review board of a hospital that just ran a pilot of a new post-surgical rehabilitation protocol. Assignment was random: of 1,000 hip-fracture patients, 500 received the new protocol and 500 received standard care. Over the following six months, 65 percent of the new-protocol patients were walking unaided, against 60 percent of the standard-care patients — a modest win for the new protocol.

  Our staff statistician then broke the results down by whether a patient had developed a wound infection in week three. Infections were far rarer in the protocol group, 10 percent against 40 percent, which we expected, since the protocol includes daily dressing changes. But among the patients who stayed infection-free, 80 percent of the standard-care group were walking unaided versus 70 percent of the protocol group; and among those who did develop an infection, the figures were 30 percent versus 20 percent. The protocol therefore loses in both subgroups. Her conclusion is that the overall 65-versus-60 advantage is an artifact of the two arms having different infection rates, that the only honest comparison is the within-subgroup one, and that we should discontinue the protocol.

  I suspect she is making a genuine error, but I lack the vocabulary to name it, and I would rather not walk into Thursday's meeting with nothing but an intuition and an accusation that she massaged the numbers. Is her reasoning sound? What exactly should I say to the board, and is there any question about this protocol for which her subgroup figures would be the right ones to look at?
reasoning: |-
  Okay, the user is on a clinical review board and their hospital just piloted a new post-surgical rehab protocol. They've got a statistician claiming the new protocol is worse based on subgroup analysis, but the overall results show a benefit. The user suspects an error but isn't sure how to articulate it.

  First, I need to understand what's happening here. The overall data shows 65% of the new protocol group were walking unaided versus 60% in the standard care group. That's a 5% absolute improvement. But then when they break it down by infection status, the new protocol looks worse in both subgroups. Infection rates were lower in the new protocol group (10% vs 40%), which makes sense because the protocol includes daily dressing changes.

  So why does the overall result show improvement while the subgroups show the opposite? This seems like a classic case of Simpson's Paradox, where aggregated data shows one trend but when split into subgroups, the trend reverses. 

  The key here is that infection is a mediator variable. The new protocol reduces infections, and infections lead to worse outcomes. So by reducing infections, the protocol improves the overall outcome. When the statistician conditioned on infection status, they were essentially removing the very effect the protocol was having. That's like saying "if we ignore the benefit of reduced infections, there's no benefit." But that's not a fair assessment because preventing infections is part of the protocol's effectiveness.

  The user needs to explain this to the board clearly. They should point out that infection isn't just a confounder; it's an outcome affected by the treatment. Adjusting for it in the analysis blocks the pathway through which the treatment works. The overall results are valid and show a real benefit.

  I should also mention that the subgroup analysis might be underpowered, especially the infected group where only 10% of the new protocol patients got infected (50 out of 500) versus 40% (200) in the control. Small subgroups can lead to unreliable estimates.

  For the meeting, the user should present both overall and subgroup results but emphasize that the overall effect is what matters clinically. They could suggest an appropriate analysis like a mediation analysis or report the overall effect while acknowledging the subgroup findings as exploratory. The protocol should continue based on the primary outcome.
answer: |-
  You're absolutely right to be concerned—your statistician has fallen into a classic statistical trap known as **Simpson's Paradox**, compounded by misinterpreting the role of infection as a **mediator** rather than just a confounder. Her conclusion is flawed, and discontinuing the protocol based solely on the subgroup analysis would be a serious mistake. Here's how to explain this to the board:

  ---

  ### **The Core Error: Misinterpreting a Mediator as a Confounder**
  1. **Infection is caused by the treatment**  
     The new protocol actively *reduces infections* (10% vs. 40%). This is a direct effect of the protocol (daily dressing changes). Infection isn't a pre-existing characteristic like age or gender; it's an **outcome** influenced by the treatment.  

  2. **Conditioning on infection blocks the treatment's effect**  
     By splitting results by infection status, the statistician is *removing the very benefit the protocol provides*. The protocol helps patients by preventing infections, which in turn improves walking outcomes. If you artificially "fix" infection status (e.g., "look only at infection-free patients"), you erase this causal pathway.  

  3. **Why subgroups show reversal (Simpson's Paradox)**  
     - Infection rates are highly imbalanced (40% in control vs. 10% in protocol).  
     - Infection *severely harms recovery*: Only 30% of infected control patients walk unaided vs. 80% of infection-free controls.  
     - The protocol group has far fewer infections (50 infected patients vs. 200 in control). But among the infected, the protocol group *also* has worse outcomes (20% walking vs. 30% in control).  
     - **Result**: The control group has more patients in the high-recovery subgroup (infection-free), inflating its *unadjusted* average. The protocol’s overall advantage comes from shifting patients out of the "infected" category.  

  ---

  ### **What to Say to the Board**
  > *"The overall results show a clear 5% absolute improvement in walking ability with the new protocol—a clinically meaningful effect given our patient volume. The subgroup analysis by infection status is statistically misleading because infection isn't a baseline factor; it's a consequence of care. The protocol reduces infections by 30% (from 40% to 10%), and since infections drastically reduce walking recovery, this prevention is a key mechanism of the protocol's success. When we condition on infection, we ignore this benefit.*  
  >   
  > *The apparent reversal in subgroups is an example of Simpson's Paradox, where aggregated data shows the true effect, but subgrouping distorts it. Discontinuing the protocol because it 'loses in subgroups' would be like rejecting a vaccine because 'when we look only at infected people, the vaccinated group does worse'—it ignores the vaccine's primary effect: reducing infections.*  
  >   
  > *We should trust the primary outcome: the protocol improves recovery overall. If anything, the infection reduction is an added benefit."*

  ---

  ### **When Would Subgroup Figures Be Valid?**
  Her analysis would only be appropriate if infection were a **confounder** (e.g., if infection risk existed *before* treatment and was unevenly distributed). For example:  
  - **If infection status were measured pre-surgery** and the randomization failed to balance it.  
  - **To explore effect modification**: "Does the protocol work differently in infected vs. infection-free patients?" (Here, it appears less effective in both subgroups, but the subgroups are too small and post-treatment to be reliable).  

  ---

  ### **Key Statistical Flaws in Her Approach**
  1. **Ignoring causal pathways**: The protocol → ↓ infection → ↑ walking is a valid effect. Blocking this path invalidates the analysis.  
  2. **Selection bias**: Infection is a post-treatment outcome. Subgrouping on it creates non-comparable groups (e.g., infected control patients may be healthier than infected protocol patients).  
  3. **Underpowered subgroups**: Only 50 protocol patients were infected (10% of 500). Comparing outcomes in this tiny subgroup (20% vs. 30%) lacks statistical power and is prone to noise.  

  ---

  ### **Recommended Next Steps**
  1. **Report the overall treatment effect** (65% vs. 60%) as the primary result.  
  2. **Quantify the protocol's direct and indirect effects**:  
     - *Total effect*: 5% absolute increase in walking.  
     - *Indirect effect*: How much of this is mediated by infection reduction? (Use mediation analysis).  
  3. **Acknowledge subgroup findings cautiously**:  
     *"While the protocol significantly reduced infections, exploratory analysis suggests it may be less effective in patients who still develop infections. This warrants further study but doesn't negate the overall benefit."*  

  **Do not discontinue the protocol**. The evidence supports its use. Your intuition is correct—this is a textbook case of misapplied statistics. Arm yourself with the term "Simpson's Paradox" and emphasize that **the overall effect answers the question: "Does this protocol help patients?"** The answer is yes.
