prompt: |-
  Okay, I've been in voting-theory land on and off for something like fifteen years — started in the usual forum rabbit holes about approval vs. range vs. RCV back in the Overcoming Bias days, then eventually went and read what the theorems actually say instead of the summaries, and Gibbard–Satterthwaite still breaks my brain a little. Not the proof, the aftermath. Basically every conversation I've ever had about it treats GS as a gotcha ("all voting systems are manipulable, therefore my pet system"), and nobody ever bothers to sort the escape routes by how much of the original dream actually survives each one. That's the deliverable I want from you.

  Here's my list. For each, give me a number 0–10 on axis A, "how much of what I originally wanted when I started caring about this is still standing," and a separate number 0–10 on axis B, "would survive contact with a real 60-person org that has factions, grudges, and a slack channel." Define axis A's weighting yourself but say in a clause what you're weighting, and give each score with one or two sentences naming exactly which condition got weakened and what breaks as a result. The routes:

  1. Domain restriction — assume preferences are single-peaked along a left-right line, at which point the median-voter rule is genuinely strategy-proof and onto (Moulin's version of the move).
  2. Randomization — give up determinism; random dictatorship, which per Gibbard's later mixing-voting-with-chance result is basically the only strategy-proof and ex-post-Pareto random rule anyway.
  3. Change the outcome space — stop picking a single winner, start allocating bundles plus money, i.e. VCG. Strategy-proof in dominant strategies, but arguably only because you smuggled transfers in.
  4. Weaken strategy-proofness to "obviously strategy-proof" in Li's sense — the claim isn't that lying never pays, it's that no ordinary human can see how lying would pay.
  5. Weaken it to Bayesian incentive compatibility under some belief about the others — and then eat Myerson–Satterthwaite, which says even that collapses for bilateral trade with private values.
  6. Give up onto-ness — precommit publicly to a shortlist and let people vote only within it, so the range of the rule is smaller than the space of conceivable alternatives.
  7. Keep everything and just measure instead — run score voting, concede it's manipulable in principle, and argue the achievable gain from lying is empirically tiny.

  Then rank the seven overall, and tell me three more things. Which two of these are secretly the same move wearing different clothes. Which one I've most obviously mis-scored given that I'll admit up front I'm way too fond of #2 and way too dismissive of #1 — push back on me hard if my priors are showing. And score my own homebrew thing on both axes separately: our community (about 80 people, we elect two stewards a year) runs what we call the noise-ballot. Everyone submits a ranking, we count first-place votes, take the top three, and then with probability p = 0.15 we throw out the plurality winner and pick uniformly among the other two of the top three. The pitch was that the coin flip acts as a manipulation tax — you can't reliably profit from lying because randomness might erase the gain. I now suspect I've confused two different things, specifically that it only works if people have linear preferences over lotteries, and our people very much don't (one guy told me straight out he'd rather we knowingly pick a worse candidate than gamble at all). Say whether that suspicion is right and score it anyway.

  Don't give me a reading list or citations, I've read all of this, I want your judgement. And keep the scores honest — if something deserves a 2, write 2, don't hedge it up to a 5 to be polite.
