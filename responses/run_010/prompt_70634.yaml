  Below is a decision procedure designed for your flood warning desk, based on imprecise probabilities (credal sets). It's structured as a step-by-step guide for interns, with plain-language explanations, decision rules, and handling of edge cases. The procedure prioritizes caution given the stakes (misses = potential deaths; false alarms = erosion of trust). It uses **Γ-maximin** (maximin) as the primary rule due to the catastrophic cost of misses, but includes interval dominance as a first filter to avoid unnecessary conservatism.

  ---

  ### **Laminated Sheet: Flood Warning Decision Procedure**  
  *(Run in ≤20 minutes; use pen/paper or calculator)*

  #### **Step 1: Gather Inputs**  
  Compute four estimates of the probability the levee holds:  
  - **Model A output**: \( p_A \) (e.g., 0.9)  
  - **Model B output**: \( p_B \) (e.g., 0.55)  
  - **Historical risk**: \( p_{\text{hist}} = \frac{\text{Number of times levee held}}{4} \) (e.g., if 3 holds in 4 events, \( p_{\text{hist}} = 0.75 \)).  
  - **Hydrologist's gut**: \( p_{\text{gut}} \) (call hydrologist at shift start; if unavailable, use 0.5).  

  #### **Step 2: Build Credal Set (Lower and Upper Probabilities)**  
  - **Lower bound (\( L \))**: Smallest of \( p_A, p_B, p_{\text{hist}}, p_{\text{gut}} \).  
  - **Upper bound (\( U \))**: Largest of \( p_A, p_B, p_{\text{hist}}, p_{\text{gut}} \).  
  - **Meaning of \( L \) and \( U \) (plain language)**:  
    > *"The chance the levee holds is at least \( L \) and at most \( U \). We’re this uncertain because models disagree, data is sparse, or conditions are volatile. We can’t collapse to one number without gambling."*  

  #### **Step 3: Apply Decision Rules**  
  - **Rule 1: Interval Dominance (filter)**  
    - Compute expected utilities (EU) for actions using worst/best cases from [L, U]:  
      - **Do nothing (DN)**: EU ranges from \( -1000(1 - U) \) (best) to \( -1000(1 - L) \) (worst).  
        *(Utility: 0 if holds; -1000 if fails and no warning)*  
      - **Stage pump crew (ST)**: EU = \(-1\) (constant).  
        *(Utility: -1 if holds [cost]; -1000 if fails [catastrophe])*  
      - **Full warning (FW)**: EU = \(-10\) (constant).  
        *(Utility: -10 for disruption, whether true/false alarm)*  
    - **If DN dominates FW**: Skip to Step 4a. Occurs if min EU(DN) > max EU(FW) → \( L > 0.99 \).  
    - *Otherwise, proceed to Rule 2*.  
  - **Rule 2: Γ-Maximin (primary rule)**  
    - **Action choices**: DN, ST, or FW.  
    - **EU minima** over [L, U]:  
      - DN: min EU = \( -1000(1 - U) \)  
      - ST: min EU = \(-1000\) (if \( U < 1 \)) or \(-1\) (if \( U = 1 \))  
      - FW: min EU = \(-10\)  
    - **Choose action** with *highest min EU*.  
    - **Why Γ-maximin?**  
      > *"We prioritize avoiding the worst outcome (deaths). This minimizes misses but may increase false alarms. We accept this tradeoff because lives > inconvenience."*  

  #### **Step 4: Action & Hydrologist Handoff**  
  - **Default actions (intern executes alone)**:  
    - **If DN chosen (Rule 1 or 2)**: Do nothing. Monitor.  
    - **If ST chosen**: Stage pump crew *only* (no road closure/door-knocking).  
  - **Hydrologist handoff (call immediately)**:  
    - **Trigger**: FW chosen in Rule 2.  
    - **Protocol**:  
      > *"Call hydrologist, report \( L \), \( U \), and recommended FW. State: ‘We must warn unless you override. Expected disruption cost: -10. Worst-case no-warn cost: \( -1000(1 - L) \)."*  
    - **Override allowed?** Hydrologist may veto FW if they dispute inputs.  

  #### **Step 5: New Information**  
  - **Neutral info** (e.g., gauge malfunction with no model impact):  
    - **Credal set**: Widen by 0.1 (if possible) → \( L_{\text{new}} = \max(0, L - 0.1) \), \( U_{\text{new}} = \min(1, U + 0.1) \).  
    - **Why widen?** *Neutral signals increase uncertainty. Wider sets reflect ignorance.*  
  - **Non-neutral info** (e.g., new gauge data): Re-run models and restart from Step 1.  
  - **Stage-by-stage consistency**: Γ-maximin **survives** sequential decisions if you recompute from scratch when new info arrives. Do not "commit" to earlier plans.  

  #### **Step 6: Long-Term Learning?**  
  - **With 4 events, do we ever sharpen?**  
    > *"No. Sparse data keeps sets wide. We need 10+ events to tighten bounds. Until then, high uncertainty is honest – not indecision."*  
  - **If models consistently disagree, weight them**: After 5+ events, discount unreliable models:  
    - If Model B is right 5/5 times, drop \( p_B \) from min/max and use \( p_B \) as a prior.  
    - *But: This is a judgment call. Default to inclusion if unsure.*  

  ---

  ### **Run Procedure on Cases**  
  **Case 1 (11:40pm, gauge rising, \( p_A = 0.9 \), \( p_B = 0.55 \))**  
  - Inputs: \( p_A = 0.9 \), \( p_B = 0.55 \), \( p_{\text{hist}} = 0.75 \) (3/4 holds), \( p_{\text{gut}} = 0.7 \) (assumed).  
  - Credal set: \( L = \min(0.9, 0.55, 0.75, 0.7) = 0.55 \), \( U = 0.9 \).  
  - Rule 1: DN dominates FW? \( L = 0.55 < 0.99 \) → no.  
  - Rule 2 (Γ-maximin):  
    - Min EU(DN) = \( -1000(1 - 0.9) = -100 \)  
    - Min EU(ST) = \(-1000\) (since \( U < 1 \))  
    - Min EU(FW) = \(-10\)  
    - **Max min EU = -10 (FW)**.  
  - **Action**: Contact hydrologist to issue FW (road closure, door-knocking).  

  **Case 2 (6th event, Model B correct 5/5 times, same spread)**  
  - Inputs: \( p_A = 0.9 \), \( p_B = 0.55 \), \( p_{\text{hist}} = 5/6 \approx 0.83 \), \( p_{\text{gut}} = 0.8 \).  
  - Credal set: \( L = \min(0.9, 0.55, 0.83, 0.8) = 0.55 \), \( U = 0.9 \).  
  - Learning: Discount Model A? **Judgment call** – if Model B is reliable, set \( L = \min(0.55, 0.83, 0.8) = 0.55 \) (still wide).  
  - Rule 2: Min EU(DN) = \(-100\), min EU(ST) = \(-1000\), min EU(FW) = \(-10\).  
    - **FW still chosen** (min EU = -10).  
  - **Action**: Contact hydrologist for FW.  
  - **Systematic problem**: Town ignores warnings? Procedure **cannot fix trust erosion**. Mitigation:  
    > *"Escalate to supervisor: ‘High false alarms from model disagreement. Need model recalibration or political cover.’"*  

  **Case 3 (2:15am, upstream gauge backfilled, neutral info)**  
  - Credal set: Widen → \( L_{\text{new}} = \max(0, 0.55 - 0.1) = 0.45 \), \( U_{\text{new}} = \min(1, 0.9 + 0.1) = 1.0 \).  
  - Rule 2: Min EU(DN) = \( -1000(1 - 1.0) = 0 \), min EU(ST) = \(-1\) (since \( U = 1 \)), min EU(FW) = \(-10\).  
    - **Max min EU = 0 (DN)**.  
  - **Action**: Do nothing. No hydrologist call.  

  ---

  ### **What the Procedure Can't Do (Brutal Honesty)**  
  1. **Judgment calls dressed as math**:  
     - Hydrologist's gut (\( p_{\text{gut}} \)) is subjective. Defaulting to 0.5 if unavailable is arbitrary.  
     - Discounting models after 5+ events is qualitative, not statistical.  
     - Utility values (-1, -10, -1000) are made up. Real costs require council input.  

  2. **Systematic flaws**:  
     - **Γ-maximin is conservative**: Expect 2–5× more false alarms than a Bayesian approach. This is the price of avoiding misses.  
     - **Sparse data = perpetual uncertainty**: With 4 events, sets stay wide. You’ll warn often, eroding trust.  
     - **Ignores trust dynamics**: No adjustment for "cry wolf" effects. Procedure will warn in Case 2 even if town ignores you.  

  3. **When to not trust this**:  
     - If models agree but history conflicts (e.g., \( p_A = p_B = 0.95 \), but \( p_{\text{hist}} = 0.5 \)), sets widen, and you may warn unnecessarily.  
     - If new info suggests model failure (e.g., sensor drift), the 0.1 widening is inadequate.  

  **Final Verdict**:  
  > **This should not be run by a twenty-year-old alone overnight.**  
  > Γ-maximin + sparse data = frequent false alarms. Hydrologists must own the decision, not interns. Use this procedure to force transparency (\( L \) and \( U \) show uncertainty) and justify calls, but demand:  
  > - More training (interns need hydrology, not just stats).  
  > - Model recalibration (if Model B wins 5/5, why use Model A?).  
  > - Council buy-in on uncertainty ("One number is a lie; here’s why").  

  --- 

  **Output for Bulletin**:  
  - Post \( L \) and \( U \) (e.g., "Chance levee holds: 55–90%"). If council insists on one number, report \( L \) (worst-case) and footnote: "Optimism kills."  

  This procedure makes uncertainty explicit, minimizes lethal misses, and forces hydrologist engagement – but it’s a stopgap. Fix the models, get more data, or prepare for hearings.
