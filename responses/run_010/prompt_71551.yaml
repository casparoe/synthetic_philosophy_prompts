prompt: |-
  I retired five years ago after thirty-three years in analytical chemistry, most of which was spent persuading other people that a mass spectrum meant what I said it meant. I have taken up philosophy of science in earnest since, and I am now at the stage of writing a short paper for a local philosophy society on the question of whether evidence can ever settle a dispute between rival theories. Before I commit anything to print, I should like my settled views audited. Here they are, stated as plainly as I can manage.

  (1) I am a realist about unobservable entities, and the ground of my realism is that the predictive success of our theories would be inexplicable otherwise. The electron is not a convenient fiction that happens to sort mass spectra correctly; its doing so is evidence that there are such things.

  (2) I accept that no single hypothesis is ever tested in isolation. What an experiment confronts is a bundle: the hypothesis of interest, the theory of the instrument, the calibration assumptions, the sample-handling assumptions, and a good deal more. In my own working life this was a daily practical fact rather than a philosophical thesis.

  (3) I nonetheless hold that underdetermination is global and standing: for any theory, whatever the evidence, an incompatible rival could in principle be constructed that accounts for all of it. I take this to be a conceptual feature of the relation between theory and evidence, not a finding about particular pairs of theories that someone has actually written down.

  (4) I also hold — and this is the part I regard as my own contribution, modest as it is — that empirical equivalence is never a determinate two-place relation between theories. Two theories are equivalent only relative to a specification of what counts as an observation, and different specifications render different pairs equivalent. Since no one has ever supplied an absolute observation-scheme, I conclude that the global thesis asserted in (3) has never actually been exhibited but only assumed, and that much of this debate is a pseudo-problem, rather in the way I suspect the old question of whether space is really Euclidean was.

  (5) I hold that simplicity, unifying scope, and conservatism are genuine tie-breakers among theories, and that a scientist who disregards them commits an epistemic error rather than merely revealing a taste.

  (6) I want to maintain all of this without conceding anything to instrumentalism. My theories are literally true or false, and the virtues listed in (5) track something about the world rather than something about our comfort.

  (7) Finally, I hold that there is a principled difference between legitimate auxiliary adjustment and ad hoc rescue — the difference between an auxiliary that purchases a novel and independently checkable prediction and one that merely insulates the theory from an anomaly — and that this difference can be stated without appealing to hindsight about how the episode eventually turned out.

  Please audit the set. Tell me which of these commitments genuinely cannot be held together, which only appear to conflict and dissolve on inspection, and, for each real conflict, what would have to be surrendered and what I would lose by surrendering it. Rank the conflicts by severity rather than presenting them as equally damaging, and finish by naming the single revision that would buy me the most coherence at the least cost. I would much rather be shown where I have cheated myself than be reassured.
reasoning: |-
  Okay, the user is a retired analytical chemist with 33 years of experience, now diving into philosophy of science. They're writing a paper on whether evidence can settle disputes between rival theories and want their views audited. Let me unpack their seven points.

  First, they're a realist about unobservables, grounding it in the predictive success of theories. They argue that electrons aren't just fictions because they correctly sort mass spectra. Then, they acknowledge the Duhem-Quine thesis: hypotheses aren't tested in isolation but as part of a bundle. But they also believe in global underdetermination—any theory has incompatible rivals that fit the same evidence. Their unique point is that empirical equivalence isn't absolute but relative to what counts as an observation. They value simplicity and other virtues as genuine tie-breakers, not just preferences. They reject instrumentalism, insisting theories are literally true. Finally, they distinguish legitimate adjustments from ad hoc rescues.

  Hmm, the main tension is between realism and global underdetermination. If any theory has empirically equivalent rivals, how can we claim one is true? The user grounds realism in predictive success, but underdetermination suggests we can't know which theory is correct. That's a big conflict. Also, their point about empirical equivalence being relative complicates things. Without an absolute observation-scheme, can we ever say two theories are equivalent? That might undermine the global underdetermination thesis they support.

  Their distinction between ad hoc adjustments and legitimate ones is solid. Using novel predictions as a criterion avoids hindsight bias. But how does that mesh with underdetermination? If an adjustment leads to new predictions, it reduces underdetermination locally. But globally, rivals could still exist. The virtues like simplicity are key here. They see these as tracking truth, not just convenience. But if underdetermination is global, can these virtues really break ties? Or are they just pragmatic?

  The user wants to maintain all points without slipping into instrumentalism. But global underdetermination threatens realism. If we can always construct rivals, how do we justify belief in electrons? Maybe they can moderate underdetermination to local cases. That preserves realism while acknowledging theory-laden testing. Their relative empirical equivalence point actually supports this—it shows that equivalence isn't fixed, so global underdetermination isn't a given.

  The biggest conflict is between (1) realism and (3) global underdetermination. Sacrificing strict global underdetermination for a weaker version resolves this. They lose the conceptual guarantee of rivals but keep realism intact. Their point (4) strengthens this by showing equivalence isn't absolute. Also, tie-breakers in (5) become more than pragmatic—they're epistemic tools guiding theory choice.

  Other areas like the ad hoc distinction and virtues hold up well. The user's experience in chemistry adds weight to their practical understanding of auxiliary assumptions. Their contribution on relative empirical equivalence is insightful and can be a paper highlight. Overall, moderating underdetermination to local contexts while keeping realism and their other points coherent is the best path. It maintains their anti-instrumentalism and leverages their unique view on observation-schemes.
answer: |-
  Your views form a sophisticated and largely coherent position, but tensions exist at the intersection of realism, underdetermination, and epistemic virtues. Here's an audit ranking conflicts by severity and proposing a targeted revision:

  ### Ranked Conflicts & Resolutions:
  1.  **Severe Conflict: (1) Realism + (3) Global Underdetermination + (6) Anti-Instrumentalism**
      *   **Conflict:** Global underdetermination (3) asserts that *any* successful theory has empirically equivalent rivals. Your realism (1) holds that the predictive success of theories (like electron theory) is best explained by their *truth*. But if empirically equivalent rivals *always* exist (3), how can the success of *one* theory uniquely support its *truth*? This directly challenges the "no miracles" argument underpinning (1). Anti-instrumentalism (6) compounds this: if theories are literally true/false, but we can *never* empirically select the true one among rivals (due to 3), realism seems epistemically inert.
      *   **What Must Be Surrendered?** Strict **Global Underdetermination (3)**. The strongest tension lies here.
      *   **Cost of Surrender:** You lose the *conceptual guarantee* that a rival *always exists in principle* for *any* theory, regardless of current evidence or auxiliary commitments. You must accept that while underdetermination is pervasive and can be radical, it might not be logically inescapable *in every conceivable state of total evidence*.
      *   **Path to Coherence:** Moderate (3) to **Pervasive/Practical Underdetermination**. Acknowledge that *in practice*, constructing empirically equivalent rivals that are genuinely viable (satisfy simplicity, conservatism, etc.) is often impossible *given the total evidence and current auxiliaries*, especially for deeply entrenched, highly successful theories like atomic theory. The "in principle" possibility becomes less relevant as theories become more robustly embedded. This preserves the core insight of Duhem-Quine (your point 2) without making the truth of successful theories inexplicable (1, 6).

  2.  **Moderate Tension: (3) Global Underdetermination + (4) Relativity of Empirical Equivalence + (5) Epistemic Virtues**
      *   **Conflict:** If empirical equivalence is always relative to an observation scheme (4), and no absolute scheme exists, how can we *assert* global underdetermination (3) as a conceptual truth? Global underdetermination *requires* the possibility of constructing empirically equivalent rivals *relative to some agreed scheme*. But (4) suggests agreement on "the evidence" is itself contingent. Further, if virtues like simplicity (5) are *epistemic* (tracking truth), they might *break* underdetermination by providing reasons to prefer one theory even if they are *formally* empirically equivalent under a crude scheme.
      *   **Resolution:** This is more apparent than real. **Point (4) actually *strengthens* your case against *naive* global underdetermination claims.** It shows why actually *exhibiting* a genuine, non-ad-hoc empirically equivalent rival is incredibly difficult – it hinges on fixing the observation scheme. The virtues (5) then operate *within* a chosen (or evolving) scheme and set of auxiliaries. They help select theories *underdetermined by current evidence alone*, but (4) explains why "empirical equivalence" isn't a fixed target. This trio can cohere: Underdetermination is pervasive because rivals *can* be constructed *relative to different observation schemes or auxiliary sets*, and virtues guide choice *within* a framework. **No surrender needed here;** refine understanding.

  3.  **Minor Tension: (3) Global Underdetermination + (7) Principled Ad Hoc Distinction**
      *   **Conflict:** If rivals can *always* be constructed (3), doesn't that include rivals generated *purely* by ad hoc adjustments? How does your principled distinction (7) fit with the idea that underdetermination is inescapable?
      *   **Resolution:** Your distinction (7) is key to *managing* underdetermination, not conflicting with it. Ad hoc adjustments (merely insulating) are epistemically defective ways of *creating* or *preserving* empirically equivalent rivals. Legitimate adjustments (novel predictions) are attempts to *reduce* underdetermination by generating new evidence. Global underdetermination (3) claims that even after legitimate adjustments, the *logical possibility* of a rival remains. Your (7) provides the criterion for distinguishing *degenerate* rival-preserving strategies from *progressive* ones. **No surrender needed.**

  ### Additional Coherence Checks:
  *   **(1) Realism + (5) Epistemic Virtues + (6) Anti-Instrumentalism:** This is a strong realist core. Simplicity/unification as truth-tracking (5,6) complements the "no miracles" argument (1). Coherent.
  *   **(2) Holism + (7) Ad Hoc Distinction:** Your practical experience (2) grounds the need for (7). Distinguishing adjustments based on novel predictions (not just hindsight) is a robust response to holism. Coherent.
  *   **(4) Relativity of Equivalence:** This is a significant and defensible insight, undermining simplistic notions of "the data." It integrates well with holism (2) and complicates underdetermination (3) as discussed.

  ### The Single Most Beneficial Revision
  **Moderate Claim (3) from *Global, Standing, In Principle* Underdetermination to *Pervasive, Practical* Underdetermination.**

  *   **Why?** It directly resolves the **Severe Conflict** with realism (1) and anti-instrumentalism (6) without gutting your core insights. It preserves the profound lessons of holism (2) and the Duhem-Quine thesis – testing is always of bundles, auxiliary adjustments are constant, and underdetermination is a major practical challenge. It aligns perfectly with your point (4) – the difficulty of fixing an observation scheme makes *exhibiting* viable rivals hard, explaining why global equivalence isn't "standing." It allows your epistemic virtues (5) and ad hoc distinction (7) real work to do in breaking underdetermination in practice.
  *   **Cost:** You surrender the *strongest philosophical claim* (logical inescapability of rivals under *any* evidence) for a more nuanced, empirically grounded view. You lose a certain conceptual neatness but gain realism's explanatory power.
  *   **Gain:** A significantly more coherent and defensible position. Your realism regains its teeth – the predictive success of deeply embedded theories *can* reliably indicate truth because genuinely viable, non-ad-hoc empirically equivalent rivals *relative to our best-established observation schemes and auxiliaries* often *don't* exist, or are demonstrably inferior based on epistemic virtues (5). Your core contribution (4) becomes even more central, explaining *why* underdetermination, while pervasive, isn't absolute or trivially exhibitable. Your anti-instrumentalism (6) stands firm.

  This revision buys coherence at the lowest cost because it relaxes the *strongest* and most metaphysically loaded claim (3) while preserving its core practical and philosophical significance (points 2, 4, 7), and it directly safeguards the foundation of your realism (1, 6) and the epistemic weight of your virtues (5). It reflects the practical reality you lived (2) more accurately than the strongest version of (3).
