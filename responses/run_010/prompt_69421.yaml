prompt: |-
  Right — you're a philosopher who works on social ontology, specifically the game-theoretic line on conventions and how they shade into social norms, so please treat this as a design problem rather than an essay question. Before you write anything, do the scratch work out loud: a few sentences telling me what the cheap way of building this case would be, the move that looks like it meets my spec but really just stipulates the answer I've asked for, and then build the thing so that cheat isn't on the table.

  What I need is a thought experiment for a seminar demo. The room is second-years who've done a bit of Lewis on convention and nothing else, so no vocabulary they wouldn't have met, and no references or reading list at the end — I want the reasoning, not a bibliography I'd have to check.

  Two stages, both on the same site, and I've already got the setting so you don't have to invent it, you just have to make it work.

  Stage one. A council-run allotment site, forty-odd plots, one shared standpipe at the top by the gate with a single tap. Summer evenings, everyone needs water at the same time, hoses get tangled, and there are proper rows about who goes next. What settles it is a regularity that grows up on its own: you leave your watering can in the line against the hedge, and the order of the cans is the order of drawing. Turn up and your can's been shifted, you can complain and the committee backs you. That's meant to be a clean, unobjectionable instance of Lewis's analysis — coordination problem, equilibrium, everyone knows everyone knows, conformity supported by the fact that the others conform.

  Stage two. Six years on. The water board have layed a mains feed to every plot, so each plot has its own tap and its own hose and the pressure's fine. The old standpipe still runs but nobody uses it except to fill the wildlife pond at the bottom. There's no scarcity, no queue, nothing to loose by drawing water "out of turn" — the coordination problem has just evaporated. And yet every Saturday morning the cans still go out in the same row, and it is policed. A newcomer who puts their can out of place, or fills at the standpipe in the wrong order, gets frozen out of the seed swap, told off in front of the whole site, and finds nobody will lend them a hand with their bean frame. The person doing the telling-off is out of pocket for it: they lose an afternoon, they get shouted at, and they gain nothing whatsoever, because their own water comes out of their own tap. The old secretary who set the whole thing up has died, nobody under sixty can say why the row exists, and the two or three who try give rationalisations that are visibly false (it keeps the path clear; it stops the hedge getting knocked about).

  Constraints, and these matter. Realistic — no science fiction, no exotic physics, this could be a real place down the road from me. The scenario proper in two paragraphs at most, concrete enough that I could point at it. The stage-two regularity has to be stable, not decaying, not a handful of old-timers holding out while everyone else drifts off. Everybody on the site knows the rule and knows that everybody else knows it, so please don't let the case turn on common knowledge eroding — that's the obvious exit and I don't want you taking it. The clause that has to give way is the preference one: at stage two nobody's conformity is supported by a preference for other people's conformity, because there's nothing left to coordinate about. And the sanctions must not be a second-order convention in disguise — nobody sanctions because they expect to be sanctioned for not sanctioning, there's no reputational payoff, no one benefits — so that the "it's just a coordination problem one level up" reply is blocked by the facts of the story rather than by my decreeing it.

  Then the demonstration, which is the part I actually care about. Take the clauses of Lewis's analysis across both stages one at a time and say which hold and which fail. If more than one clause goes at stage two, tell me the order they fall in and which failure is doing the real work. Then tell me which single feature of the case is load-bearing, and what happens to the verdict if I take it away — say, if the telling-off became costless, or if someone on the site could still explain the original reason for the row. And then the honest bit: Lewis himself allows somewhere that once a convention is up and running people can come to disapprove of nonconformity and conform out of a sense of obligation rather than prudence, so tell me straight whether my stage two is just an instance of that remark and therefore no embarrassment to him at all, or whether it's genuinely outside the analysis — and give me the best reply a defender of Lewis could make to this case, and your view on whether it lands.

  No headings, no bullet points, no bold, no tables. Continuous prose throughout, the way you'd write an email to a colleague. Somewhere between eight hundred and a thousand words, and please don't pad the scenario to get there.
reasoning: |-
  Okay, the user wants a thought experiment for a seminar demo on social ontology, specifically challenging David Lewis's theory of conventions. They've provided a two-stage scenario involving an allotment site's water queue system. Stage one is a classic Lewisian convention solving a coordination problem. Stage two, after the problem is technically obsolete, shows the persistent enforcement of the old norm through costly sanctions without functional purpose.

  Hmm, the tricky part is designing stage two to genuinely challenge Lewis without resorting to cheap loopholes. The user explicitly blocked common escape routes: no common knowledge erosion, no second-order coordination problem, no reputational benefits. The key constraint is that preferences must shift - conformity isn't driven by coordination needs anymore.

  Let me mentally walk through Lewis's six conditions. In stage one, all hold: 1) regularity (can queue), 2) coordination problem (water scarcity), 3) interdependence (each prefers queueing if others do), 4) alternatives possible (other queue systems), 5) common knowledge of the system, 6) conformity preference-based. 

  For stage two... Condition 3 (preference interdependence) clearly collapses first - with individual taps, no one cares about others' water habits. Then condition 2 (coordination problem) vanishes since scarcity disappeared. Yet enforcement persists through costly sanctions like public shaming. 

  The load-bearing feature is the sanctioner's motivation - they punish despite personal cost and no benefit. If I made telling-off costless, it would revert to Lewis's "sense of obligation" scenario. But here the cost makes it irreducible to preference-based conformity.

  A Lewis defender might argue the sanction itself creates a new coordination problem around social approval. But that feels weak because 1) sanctions predate the functional change, 2) they're not systematic enough to form a new equilibrium. 

  Honest verdict: This exceeds Lewis's footnote about obligation. The enforcement has become decoupled from its original purpose, sustained by internalized normativity rather than prudence - more like Cristina Bicchieri's norms than Lewis's conventions.
answer: |-
  Right, let's build this case properly. The cheap way would be to have the stage-two sanctions *be* beneficial in some new, hidden way – perhaps the public telling-off gains the enforcer social capital, or the frozen-out newcomer poses some future threat – thereby sneaking preference interdependence back in through the back door. That just stipulates an answer by inventing a new, invisible coordination problem. We need to avoid that cheat entirely.

  Here’s the scenario, concrete and tight:

  **Stage One:** The allotment site’s single standpipe causes chaos during summer evenings. A spontaneous solution emerges: gardeners line their watering cans against the hedge near the tap. The order of cans dictates the order of drawing water. If someone moves your can out of turn, the site committee upholds your complaint. Everyone prefers this orderly queue because it avoids the tangles, arguments, and wasted time of free-for-all access. Everyone knows the system, knows others know it, and conforms because the system works *and* because others conform, making it stable.

  **Stage Two:** Six years later, individual taps on every plot render the standpipe obsolete, used only for the wildlife pond. There’s no scarcity and no practical reason to queue. Yet, every Saturday morning, gardeners still place their (now largely unused) watering cans in the same row against the hedge. If a newcomer ignores the row – placing their can haphazardly or (pointlessly) filling a bucket at the disused standpipe "out of order" – they face sanctions. An established gardener, like Mrs. Evans (plot 12), will publicly reprimand them during the Saturday morning social hour: "We don’t do that here! See the row?" This causes a scene; the newcomer is embarrassed, Mrs. Evans gets shouted down by the newcomer or their friends, and loses her morning’s peace. Crucially, Mrs. Evans gains nothing: no social standing (she’s seen as a busybody by many), no practical benefit (her tap works fine), and she risks reciprocal rudeness. The newcomer is subsequently excluded from the informal seed swap and denied small favours like borrowing tools. No one under sixty remembers the water scarcity; explanations offered ("It keeps the path clear!" "Protects the hedge!") are demonstrably false (the path is wide, the hedge undamaged). The rule is common knowledge, and the sanctioning behaviour is stable – newcomers either conform or leave, and established gardeners like Mrs. Evans persist in enforcing it despite the cost and lack of benefit. It’s not decaying; it’s a stubborn, costly norm.

  **Demonstration against Lewis's Analysis:**

  Lewis defines a convention as a regularity R in behaviour, sustained because it solves a coordination problem, where:
  1.  Everyone conforms to R.
  2.  Everyone prefers to conform to R *on condition that the others do* (because of the coordination problem).
  3.  Everyone believes the others conform to R.
  4.  This preference for conditional conformity gives everyone a *reason* to conform to R.
  5.  There is general preference for *some* uniform regularity solving the coordination problem (R is arbitrary but not unique).
  6.  R satisfies conditions 2 and 3 only because it satisfies 1 and 4 (it’s self-perpetuating).
  7.  It is common knowledge that conditions 1-6 hold.

  **Stage One:** All conditions hold cleanly. 1 (cans in row), 2 (prefer queueing *because* others do, avoiding chaos), 3 (belief in conformity), 4 (reason based on preference), 5 (any queue would do), 6 (self-perpetuating because it works), 7 (common knowledge).

  **Stage Two:**
  *   **Condition 1 (Regularity)** holds. Cans are placed, conformity expected.
  *   **Condition 2 (Preference for Conditional Conformity)** *fails first and fundamentally*. With no water scarcity or coordination problem, *no one* prefers *others* to queue at the obsolete standpipe based on the can row. Mrs. Evans doesn't care if someone draws water "out of order" from a tap they don't need to share; it literally doesn't affect her. The original reason for interdependence is gone.
  *   **Condition 4 (Reason based on Preference)** therefore *fails*. Without the preference in (2), the original, pragmatic reason for conformity evaporates.
  *   **Condition 5 (Preference for Uniformity re: Coordination)** *fails*. There is no longer a coordination problem needing a solution. Uniformity serves no practical purpose.
  *   **Condition 3 (Belief in Conformity)** and **Condition 7 (Common Knowledge)** *hold*. Everyone knows the rule and expects others to follow/enforce it.
  *   **Condition 6 (Self-Perpetuating via Preferences)** *fails*. The regularity persists, but *not* because people prefer others to conform for coordination reasons. It persists due to something else – the sanctions and the internalised normativity driving them.

  The load-bearing feature making this work is the **costly, non-beneficial sanctioning behaviour by individuals like Mrs. Evans**. This sanctions the *breach of the rule itself*, decoupled from the original coordination problem. If telling-off became costless (e.g., a quick, ignored mutter), the norm would likely decay quickly as enforcement dwindled. If someone could explain the original reason, it might become a quaint tradition followed lightly without sanctions, easily ignored without consequence – not the robust, policed regularity described.

  **Honest Assessment & Lewis's Defence:**

  Lewis does indeed note that conventions can acquire normative force ("oughtness") over time, leading people to conform from a sense of obligation and to disapprove of nonconformity. A defender might argue stage two is *just* this: the old convention has become a social norm sustained by internalised disapproval, fitting Lewis's allowance.

  However, this case pushes beyond that remark in two crucial ways:

  1.  **The Sanctioner's Motivation & Cost:** Lewis's point focuses on the *conformer's* motivation shifting from prudence to obligation. Here, the key challenge is the *sanctioner's* motivation. Mrs. Evans enforces a rule *that provides her no benefit*, at *significant personal cost*, and *without* apparent internal reward (she seems genuinely aggrieved, not dutiful). Lewis's framework doesn't readily explain why someone would pay a cost to enforce a norm solving *no problem* for them or the group, absent reputational concerns or reciprocal benefits (which are stipulated away). Her action looks like pure norm enforcement for its own sake, triggered by the breach itself.
  2.  **The Absence of Underlying Coordination:** The "oughtness" Lewis describes typically piggybacks on the convention's *original* coordination function, even if obscured. Here, the coordination function is not just forgotten; it's *objectively obsolete*. The norm persists *despite* the complete evaporation of the problem it was meant to solve.

  **Best Lewisian Reply:** The defender could argue that a *new*, latent coordination problem has emerged: coordinating on *social approval/disapproval*. Everyone prefers a uniform practice of enforcing *some* arbitrary standard of behaviour (the old row) to avoid the unpredictability and conflict caused by breaches (like the arguments Mrs. Evans starts). Sanctioning is participation in this new convention about maintaining group norms for social harmony. Mrs. Evans prefers to sanction if others do (or would sanction non-sanctioning?), giving her a reason (condition 2 & 4 reborn), even if the *content* of the norm is arbitrary and functionless.

  **Does it Land?** Partially, but unsatisfactorily. While plausible for *mild* disapproval, it strains credulity applied to *costly* sanctions like Mrs. Evans's. Why prefer a uniformity that involves shouting matches and lost afternoons over simply ignoring the pointless rule? The "social harmony" achieved seems negative and unstable compared to letting the obsolete rule fade. More importantly, it feels like special pleading – inventing a new, abstract coordination problem ("social norm coordination") to rescue the theory, precisely the kind of cheat we aimed to block. It struggles to explain the *intensity* and *costliness* of the sanctioning relative to the null impact of the breach.

  **Verdict:** Stage two genuinely exceeds Lewis's analysis. It's not merely a convention that has acquired normative force; it's a norm whose enforcement mechanism has become decoupled from any persistent coordination problem and operates with costly autonomy. The persistence relies on a specific psychological mechanism – a disposition to punish perceived rule-breaking *per se*, even when costly and functionally pointless – that Lewis's preference-based, coordination-centric framework doesn't capture. The case highlights the potential autonomy of social norms from their originating functions, sustained by internalised enforcement drives rather than interdependent preferences.
