answer: |-
  Here are the desiderata for a normative prior over hypotheses, motivated by specific cases, followed by analysis of tradeoffs and contender evaluations. Requirements are grounded in the *normative* role: prescribing what bounded agents *ought* to believe and judging approximations.

  ### Core Desiderata & Motivations
  1.  **Dominance Justification:** *Why this specific prior?* The account must justify why *this* prior is uniquely qualified, not just "a good one." Motivation: Without justification from dominance (e.g., the universal prior multiplicatively dominating every lower-semicomputable semimeasure), the choice appears arbitrary. An agent facing two dominating priors needs a reason to pick one; dominance (combined with other constraints) provides it by showing all computably constructible alternatives are *objectively worse* (dominated).

  2.  **Language Invariance:** *Why isn't simplicity relative?* The prior's assignment of simplicity/complexity must be invariant (up to a constant) under changes in the universal description language. Motivation: Consider defining a new language by adding a primitive symbol `π_1e6` naming the first million bits of π. Invariance guarantees that the complexity of any string `x` differs by at most a constant (say, `c`) between languages. Without this, simplicity is subjective to language choice, undermining normative objectivity. *Finite-Scale Relevance:* For observing fewer than `c` bits (e.g., `c ≈ 1e6`), invariance provides *no direct normative guarantee*; the penalty for describing `x` using `π_1e6` instead of computing π bit-by-bit is swallowed by the constant. Its normative work is asymptotic: ensuring language choice doesn't *permanently* prevent convergence. Similarly, `grue` is penalized by a large constant relative to `green`; for small samples, this penalty might not bite, but the *asymptotic guarantee* that `green` dominates is normative.

  3.  **Semi-Computability (Lower):** *What can a bounded agent approximate?* The prior must be lower-semicomputable (can be approximated from below). Motivation: A computable prior is unrealistic (Chaitin's Ω isn't computable). Lower-semicomputability allows an agent to monotonically increase their prior probability for any hypothesis by spending more compute. Forfeited: A decision procedure (upper bound/computability) would allow knowing when the approximation is "good enough." Its absence means the agent can overestimate probabilities but never know they are close to the "true" prior value for an uncomputed hypothesis. Normatively, it mandates that belief revision requires ongoing computation.

  4.  **Convergence in the Limit (Identification):** *Will we eventually get it right?* If the true data-generating process `μ` is in the hypothesis space (i.e., lower-semicomputable), then the posterior must concentrate on `μ` almost surely (w.r.t. `μ`). Motivation: This is the core guarantee of learning. Without it, the prior could persistently favor wrong hypotheses even with infinite data, failing as a normative ideal. (Note: This doesn't require *fast* convergence or good finite-data performance).

  5.  **Finite Data Reasonableness:** *Is it usable as a yardstick for bounded agents?* The prior must not exhibit pathological overfitting or underfitting on "small" (agent-relevant) sample sizes for "natural" problems. Motivation: Consider predicting a binary sequence. A prior putting near-zero mass on all simple computable patterns (e.g., alternating 0s/1s) but high mass on "white noise" with a specific 1000-bit prefix is untenable normatively. While convergence guarantees eventual learning, if the constant in invariance (or dominance) is astronomically large (e.g., 1e6 bits), the prior is useless as a *practical* normative ideal for real agents observing tiny data. It must provide sensible *qualitative* guidance early on (e.g., favoring `green`-like laws over `grue`-like ones *before* the constant is overcome).

  6.  **Logical/Mathematical Uncertainty:** *How to handle unproven theorems?* The prior must assign non-zero probability to logically possible but unproven mathematical statements (e.g., Goldbach's conjecture), and update based on proof progress. Motivation: Agents reason about their own computations. A bounded agent running a proof search hasn't yet proven/disproven Conjecture `C`. It needs a credence in `C` *now*, based on partial computation. A purely logical prior (0 or 1) fails normatively.

  7.  **Self-Locating Uncertainty:** *How to handle indexical information?* The prior must coherently handle uncertainty about one's identity, location, or time within a universe. Motivation: In a multiverse or large universe, an agent observing "I see 100 heads" needs a prior over which observer they are to infer the coin bias. Ignoring this leads to paradoxes (e.g., Doomsday argument, Sleeping Beauty).

  8.  **Hypothesis Space Structure:** *What can be represented?* Must the space be countable? Motivation: Scientific hypotheses often involve continuous parameters (e.g., `θ ∈ [0,1]` for a coin bias). A countable prior (e.g., over programs) can approximate reals via computable numbers, but this excludes non-computable reals. The account must justify its choice and specify how inference over real-valued parameters is handled normatively (e.g., via mixtures over computable approximations?).

  ### Analysis of Requirements
  *   **Non-Negotiable for Normative Role:** (1) Dominance Justification (uniqueness/objectivity), (3) Lower-Semicomputability (approximability), (4) Convergence (core learning guarantee). Without these, the account fails as an *objective* ideal *for computation*. (2) Invariance is borderline non-negotiable for objectivity; dropping it makes simplicity subjective.
  *   **Camp Preferences:** (5) Finite Data Reasonableness (beyond asymptotic sanity) is often emphasized but rarely formalized perfectly. (8) Countability is a preference of the computability camp; subjectivists accept uncountable spaces. (7) Self-Locating is sometimes deferred.
  *   **Joint Unsatisfiability:**
      *   **Convergence + Strictly Positive Prior + Computability:** *Theorem* (No Free Lunch). A computable prior cannot converge for *all* computable `μ` (some `μ` will exploit its blind spots). (Dominance forces semi-computability, avoiding this).
      *   **Dominance + Convergence + Finite Data Reasonableness (Strong Form):** *Conjecture/Engineering Difficulty.* The constants in dominance/invariance *can* be large. While Solomonoff *eventually* dominates, pathological behavior for very large constants relative to bounded agents' data might violate a strong finite-data requirement. Mitigation exists (e.g., speed prior), but a perfect solution is conjecturally hard.
      *   **Lower-Semicomputable Prior + Full Logical Uncertainty:** *Engineering Difficulty (possibly fundamental).* Assigning non-zero mass to all consistent extensions of Peano Arithmetic conflicts with assigning probabilities satisfying all logical implications *during* computation (the "Demonic Problem"). Approximations exist (e.g., Logical Induction), but full integration is unresolved.
      *   **Dominance + Self-Locating Uncertainty:** *Conjecture/Engineering Difficulty.* Defining a universal prior over observer moments within computable universes is complex (e.g., measure problem in physics). No canonical, dominance-satisfying solution is universally accepted.
  *   **Greatest Eliminator:** **Dominance Justification.** This eliminates:
      *   All computable priors (they are dominated).
      *   All subjective priors lacking this objective justification (e.g., uniform over chosen basis).
      *   Minimax-regret approaches (no prior to dominate).
      *   Priors defined by simplicity measures lacking the dominance property.

  ### Contender Scorecard
  1.  **Universal Prior (Solomonoff):** Satisfies (1) Dominance (by construction), (2) Invariance (theorem), (3) Semi-Computability (lower), (4) Convergence (theorem). Fails (5) Finite Data (large constants irrelevant to bounded agents), (6) Logical Uncertainty (assigns 0/1 to mathematical truths, cannot handle partial computation), (7) Self-Locating (not addressed), (8) Countability (preferred, but real parameters via computable reals). The gold standard for asymptopia; normative justification hinges on accepting dominance/invariance despite finite-data irrelevance of constants.
  2.  **Length-Truncated Prior:** Fixes (5) Finite Data (computable, manageable constants) and partially addresses (3) (computable). Fails (1) Dominance (arbitrary cutoff, dominated by untruncated prior), (2) Invariance (cutoff breaks constant equivalence), (4) Convergence (fails if truth needs programs longer than cutoff). A pragmatic approximation sacrificing core normative ideals for tractability; judged by closeness to universal prior.
  3.  **Minimax-Regret (Complexity Functional):** Avoids a prior; defined where `Kt(x)` (time-bounded Kolmogorov) is finite. Excels at (5) Finite Data (designed for it). Fails (1) Dominance (no prior), (2) Invariance (depends on computational model), (4) Convergence (only if truth has finite `Kt`; no guarantee for general computable `μ`), (8) Countability (often implicit). Addresses bounded rationality directly but lacks the *prescriptive* prior-based justification for what an agent *ought* to believe; a competitor framework, not an approximation *of* Solomonoff.
  4.  **Subjectivist Bayesian:** Any strictly positive prior. Excels at (5) Finite Data (tractable with calibration), (8) handles continuous spaces naturally. Fails (1) Dominance (choice arbitrary), (2) Invariance (simplicity not fundamental), (4) Convergence (only if truth in support; no guarantee for computable `μ` not explicitly considered). Rejects the core normative demand for objective justification via dominance/invariance/convergence; "reasonably calibrated" is subjective. Convergence is weak (highly sensitive to prior choice).
