  Below is a complete design for your seminar activity, incorporating all your requirements. The activity uses a simple token economy (convertible to participation points) and unfolds in two phases, followed by a structured debrief. The game is designed for 16 students in groups of 4, with roles rotating each round.

  ---

  ### **Game Setup**  
  **Players:** 16 students, divided into 4 groups of 4.  
  **Roles per group (rotates each round):**  
  - **Decision-Maker (DM):** The "Ulysses" who may precommit.  
  - **Enforcers (3):** The "rowers" who enforce the precommitment.  
  **Tokens:** Use physical tokens (e.g., poker chips) or a scoreboard. Tokens convert to participation points (e.g., 10 tokens = 1 point).  
  **Rounds:** 4 rounds (each student is DM once).  
  **Time:** 60-70 minutes for gameplay (15 min debrief).  

  ---

  ### **Phase 1: Precommitment (15 min)**  
  **Goal:** DMs decide whether to adopt a commitment device and at what "revocation cost" (C).  
  **Rules:**  
  - DM chooses:  
    - **No Device:** Revocation is always allowed.  
    - **Device:** Choose a revocation cost **C** (0, 2, 4, or 6 tokens). If the DM tries to revoke later, C is paid to enforcers who enforce.  
  - **Key:** DMs *do not know* if the upcoming temptation will be "good" or "bad" (state A or B).  
  - **Payoffs (known to all):**  
    | **Scenario**                  | **DM Payoff** | **Each Enforcer Payoff** |  
    |-------------------------------|--------------|--------------------------|  
    | No device + revocation        | 0 or 20      | 2                        |  
    | Device + revocation blocked   | 10 - C       | Enforcers: See Phase 2   |  
    | Device + revocation allowed   | 0 or 20      | Enforcers: See Phase 2   |  
    | *(Sticking to plan is not allowed in Phase 2—DM must face temptation)* |  

  ---

  ### **Phase 2: Temptation & Enforcement (30-40 min)**  
  **Goal:** DMs experience temptation, and enforcers decide whether to enforce precommitment.  
  **Rules:**  
  1. **Reveal Temptation Type (secretly):**  
     - Facilitator (you) privately draws a state for each group:  
       - **State A (Bad Temptation):** Revoking gives DM **0 tokens**.  
       - **State B (Good Temptation):** Revoking gives DM **20 tokens**.  
     - *States are hidden until after decisions!*  
  2. **DM Decision:** DM **must attempt to revoke** (no option to stick—they are "tempted").  
  3. **Enforcement (if device was bought):**  
     - Enforcers simultaneously vote **Enforce** or **Allow** (write on cards).  
     - **Outcomes:**  
       - **Blocked (≥2 enforce):**  
         - DM gets **10 - C**.  
         - Each enforcing enforcer gets **C/3 tokens** (rounded up).  
         - Non-enforcing enforcers get **0**.  
       - **Allowed (≤1 enforce):**  
         - DM gets **0 (State A) or 20 (State B)**.  
         - Enforcers who **enforced** get **-1 token** (effort cost).  
         - Enforcers who **allowed** get **2 tokens** (bribe).  
     - **No Device:** Revocation always happens (DM: 0 or 20, enforcers: 2 each).  
  4. **Reveal State:** After decisions, announce the state (A/B) and distribute tokens.  

  ---

  ### **Example Round Flow**  
  1. **Phase 1:** DM chooses device with **C = 4**.  
  2. **Phase 2:**  
     - State drawn: **B (Good Temptation)**.  
     - DM revokes. Enforcers vote: 2 enforce, 1 allows.  
       - **Blocked:**  
         - DM: 10 - 4 = **6 tokens**.  
         - Enforcing enforcers: 4/3 ≈ **1.33 tokens each** (round to 1 or 2).  
         - Allowing enforcer: **0 tokens**.  
     - **Outcome:** DM misses out on 20 tokens (dead hand problem).  

  ---

  ### **Debrief (15 min)**  
  Map gameplay to constitutional concepts:  
  1. **Unable vs. Unwilling:**  
     - *Game:* DMs were *unable* to revoke when blocked; enforcers *unwilling* to enforce if C was low.  
     - *Constitutionalism:* Constitutions make governments *unable* to act (procedural limits) vs. relying on officials being *unwilling* (norms).  

  2. **Value Gap in Precommitment:**  
     - *Game:* Buying a device (e.g., C=4) felt "worth it" in Phase 1 (expected payoff: 10 - 4 = 6 > 10/2 = 5). In Phase 2 (State B), it cost the DM 14 tokens (20 - 6).  
     - *Constitutionalism:* Precommitments seem rational ex-ante (e.g., debt ceilings) but may be harmful ex-post (e.g., during recessions).  

  3. **Dead Hand Problem:**  
     - *Game:* In State B, the calm "past self" (Phase 1) bound the "present self" (Phase 2) to a worse outcome.  
     - *Constitutionalism:* Originalists vs. living constitutionalists—should past decisions bind present actors with better information?  

  4. **Enforcer Temptation:**  
     - *Game:* Enforcers allowed revocation if C was low (C/3 ≤ 2) to pocket bribes.  
     - *Constitutionalism:* Institutions (e.g., courts) may abandon precommitments under pressure (e.g., emergencies).  

  ---

  ### **What Will Go Wrong (and How to Mitigate)**  
  1. **"Loud Econ Kid" Dominates Phase 1:**  
     - *Risk:* One student calculates expected values aloud, reducing peer exploration.  
     - *Mitigation:* Assign them as DM first to contain influence.  

  2. **Enforcement Weaponized:**  
     - *Risk:* Enforcers block revocation maliciously (e.g., to steal C tokens).  
     - *Mitigation:* Emphasize payoff incentives (C/3 must outweigh bribe). Use anonymous voting.  

  3. **Coordination Failure:**  
     - *Risk:* Enforcers miscoordinate (e.g., all allow to avoid effort costs).  
     - *Mitigation:* Show that C≥4 aligns incentives (C/3 > 2 bribe).  

  4. **Over-Simplification of Temptation:**  
     - *Limitation:* Real constitutions bind *across time/administrations*, but the game binds peers simultaneously.  
     - *Post-Activity Note:* Highlight that real precommitment involves:  
       - **Asymmetric information:** Future actors know more than past ones.  
       - **Non-consent:** Future generations (unlike enforcers) never agreed.  
       - **Institutional inertia:** Amendability (absent here) softens "dead hand" effects.  

  ---

  ### **Materials & Adjustments**  
  - **Tokens:** Use coins or chips; assign values (e.g., 1 token = 0.1 points).  
  - **State Draw:** Use a coin flip (heads = A, tails = B) for each group.  
  - **Adjustments:**  
    - If time is short, run 2 rounds (half the class as DMs each round).  
    - If enforcement is chaotic, cap C at 4 to simplify math.  
    - For larger stakes, double payoffs (but keep tokens low-stakes).  

  This design forces students to confront the fragility of precommitment, the moral dilemma of enforcement, and the risk of the "dead hand." The debrief turns gameplay into a springboard for deeper discussion—ensuring they *feel* the tension before you name it.
