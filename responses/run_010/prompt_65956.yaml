  - **Criterion C (Algorithm + Connectivity + Transplant, Host-Independent)**:  
    A candidate structure is the same mechanism iff:  
    (i) It has the **same algorithm**;  
    (ii) It has the **same connectivity** (reads from/writes to identical features, allowing indexing);  
