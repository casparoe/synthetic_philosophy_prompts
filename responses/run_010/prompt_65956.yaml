prompt: |-
  I'm a third-year PhD student in an interpretability group, and I need help reverse-engineering a criterion that my PI applies reliably but has never stated. We are building a monitor that compares a reference model against a candidate — a later checkpoint, a fine-tune, or a distillate — and flags any safety-relevant mechanism that has been lost, altered, relocated, or replaced. The monitor currently emits a binary present/absent verdict per mechanism, derived from two tests: a transplant test (move the candidate's putative implementation into the reference host and see whether it reproduces the reference behavior within tolerance) and an in-situ ablation test (knock it out in the candidate and compare the deficit with the deficit from knocking out the reference mechanism). Before we trust the monitor we need ground truth on the identity question it quietly presupposes, namely when a structure in the candidate is the same mechanism as one in the reference. Our PI has hand-adjudicated eight contested pairs. She claims no theory, says only that she goes by what the interventions show, and has never given a rationale. In each case below, the descriptive facts were agreed on by everyone in the lab; only the label was hers.

  1. An induction head at step 30k of a run versus the same head at step 120k. Roughly 70 percent weight overlap; identical compact algorithm description; transplant succeeds; in-situ ablation produces the same deficit in both hosts. SAME.
  2. The step-120k head ablated and re-derived by continued training at the same layer. Zero weight overlap with the original; its activation geometry is not linearly alignable with the original's; identical algorithm description; same read-from and write-to connectivity; transplant succeeds; in-situ deficit matches. SAME.
  3. A candidate structure that reproduces the reference mechanism's input–output mapping exactly over our entire evaluation distribution, and whose in-situ ablation yields a matching deficit there, but which achieves the mapping by memorized surface-form lookup rather than by the comparison the reference performs; the transplant fails, because the structure depends on host-specific features the reference host lacks. NOT SAME.
  4. A head whose weights, algorithm description, and read-from connectivity are unchanged from the reference, and whose transplant into the reference host succeeds and reproduces reference behavior; but in the candidate its output is consumed by a different downstream circuit, and ablating it in situ changes behavior in a different direction than ablating the reference head does. NOT SAME.
  5. The reference contains two partly redundant circuits, M and M-prime, both contributing to suppression of a target behavior; ablating M alone in the reference produces no measurable deficit. In the candidate, M-prime has been pruned away; M itself is algorithmically unchanged with unchanged connectivity; ablating M alone in the candidate reproduces the full deficit that ablating M and M-prime jointly produced in the reference. SAME.
  6. A candidate in which the reference's M is realized by two smaller heads that jointly implement the same algorithm: neither does anything alone, together they transplant successfully and reproduce the behavior, and joint ablation matches the reference deficit. NOT SAME.
  7. A candidate in which M has migrated two layers later in the stack: same algorithm description, same read-from feature and same downstream consumer up to the layer index; transplant succeeds; in-situ deficit matches. SAME.
  8. A distillate trained from scratch on the reference model's outputs, with no weight ancestry and a different architecture scale, containing a structure with the same algorithm description, the same read/write connectivity up to indexing, a successful transplant, and a matching in-situ deficit. SAME.

  The ninth pair is the one our monitor will actually be run on, and her surviving criterion is unclear to me. The candidate is a continued-training descendant of the reference. The mechanism M in question has roughly 85 percent weight overlap with reference-M, an unchanged algorithm description, and unchanged read-from and write-to connectivity: it still reads the same upstream feature and still writes to the same downstream consumer circuit. Its transplant into the reference host succeeds and reproduces reference behavior within tolerance, which is what we expected, since the reference host supplies the upstream feature in its undrifted form. In the candidate, however, that upstream feature has drifted, with the consequence that M now fires only on the formally regular subset of the inputs that reference-M handled. Separately, and only in the candidate, a new pathway B has formed: different algorithm, no weight overlap with M, absent from the reference, and covering both the regular and the irregular subsets. Ablating M alone in the candidate yields no measurable deficit, because B covers. Ablating M and B jointly yields the same deficit as reference-M ablation on the regular subset, and no deficit whatsoever on the irregular subset. Her label is due Thursday.

