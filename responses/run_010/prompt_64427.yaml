prompt: |-
  I was recently appointed to my city's planning commission — a seven-member volunteer board that votes on zoning, variances, and a handful of land-use contracts — and, having no philosophy training at all, I did what I usually do before taking on an unfamiliar system: I read the documentation. That sent me into public reason liberalism, and I now find that my own verdicts on concrete cases do not behave like a single rule. I would like to know whether they add up to one, and if not, which of them I should discard.

  Here are my verdicts, mostly formed before I had any vocabulary for them.

  1. A commissioner votes against a variance that would put an adult bookstore beside a middle school. She gives traffic and minors' exposure as reasons, and then adds that the business is sinful and that the neighborhood's moral character is a legitimate object of public concern. I think she did something wrong in voicing that last part, even though her other reasons were sufficient and even though I agree with her vote.

  2. The same commissioner casts the same vote, mentions only traffic, and tells me afterwards that the traffic argument was a cover and that her real reason was religious. I think this is worse than case 1, which startles me: the public record here contains only reasons I called acceptable.

  3. A Quaker commissioner votes the same way and says plainly that his conscience is bound by scripture, offering nothing else. I think he has done nothing wrong — if anything, something I admire. I cannot reconcile this with case 1, where stating a religious reason alongside adequate public ones seemed to be the offense.

  4. A church circulates a leaflet against a ballot measure on medical aid in dying, arguing entirely from religious premises. Fine. A legislator votes against the implementing statute and gives only the same religious premises from the floor. Not fine. My rule seems to track the institution rather than the content, and I cannot say why.

  5. Our council opens each meeting with a prayer given by rotating local clergy. Fine. The city seal carries a motto invoking God. Not fine, and I feel this more strongly than about the prayer, which anyone can decline to attend. Neither is coercive in any obvious sense.

  6. A commissioner has honestly looked for a secular case against a policy, cannot find one he believes, and would rather vote his conscience than abstain or manufacture a reason he does not hold. I think voting is the right call. But if that is right, I do not see what my requirement was ever demanding of him.

  7. A commissioner supports a policy because he holds a sectarian naturalism about the direction of history — premises no more available to my devout neighbor than scripture is to me. Not fine. A commissioner supports the same policy because he thinks it maximizes aggregate welfare. Fine. I cannot articulate what makes the arithmetic public and the philosophy of history non-public.

  8. A religious objection to a municipal surveillance contract, once translated into security and budget language, becomes weaker and vaguer, and the commission decides worse for having heard the translated version only. Here I think the translation requirement actively degraded the outcome.

  My tentative principle is: you may be moved by whatever you like, but you owe your fellow citizens a justification they could assess without adopting your metaphysics. I suspect it is too weak — anything satisfies it with a fluent enough gloss — and that it smuggles the whole question into the word assess.

  So: is there a principle, stated as precisely as you can, that delivers all or most of these verdicts? Give it as explicit clauses and say which case motivates each clause. If none fits, identify my outlier verdicts and tell me what it costs to give them up rather than to complicate the rule. Then tell me what the surviving principle says about two cases I have not settled: a commissioner who supports a lending restriction because his tradition forbids interest, arguing the point in terms of predatory lending; and a judge who writes a concurrence invoking natural law alongside constitutional text.

  Two further questions I care about as an engineer. First, is the requirement about the reasons offered or the reasons actually held? Only the agent can tell those apart, so if it is about the latter I do not see how it could function as a rule anyone applies to anyone else. Second, if it turns out to be a constraint on phrasing rather than on justification — a style check, not a correctness check — is that a defect in the view or the whole of it?

  Finally, locate me. I have come across Rawls's proviso, Audi's requirement of a secular rationale, Habermas's proposal that translation be demanded institutionally rather than across the board, and the objection that all of this imposes an asymmetric burden on religious citizens. Say which of these my verdicts already commit me to, which they rule out, and whether any of them handles cases 2 and 7 better than my own formulation does.
reasoning: |-
  Hmm, this is a fascinating and complex query about public reason liberalism from a newly appointed planning commissioner. The user presents eight concrete cases where their intuitive judgments about acceptable reasoning in public decisions seem inconsistent, and they're seeking a coherent principle that can reconcile these verdicts. 

  Let me unpack what's happening here. The user is clearly intellectually rigorous - they dove into political philosophy literature when faced with a new governance role, and now they're systematically testing their intuitions against theoretical frameworks. Their cases reveal several tension points in public reason theory: the role of religious motivation vs expression, institutional context, sincerity requirements, and the problem of "translation" losses.

  The core challenge is that their judgments don't neatly align with existing models. For instance:
  - They reject religious reasoning in cases 1 and 4 but accept it in case 3 (Quaker commissioner)
  - They distinguish between institutional roles (legislator vs church in case 4)
  - They worry about degraded outcomes when religious arguments get "translated" (case 8)
  - They're unsettled by asymmetric burdens (implied in case 6)

  I notice three particularly thorny issues:
  First, the sincerity problem - case 2 suggests the user cares deeply about authenticity, yet their own principle seems to incentivize dishonesty (case 6). Second, the "availability" question in case 7 - why is utilitarianism "public" while historicism isn't? Third, the institutional variable - why is legislative prayer acceptable but a city seal motto isn't?

  The user's proposed principle ("justification others can assess without adopting your metaphysics") is indeed too weak, as they suspect. It would permit any argument dressed in secular clothing, which undermines the whole project. Their phrasing question is also acute - if this is just about wording, doesn't that make it performative rather than substantive?

  To construct a response, I'll need to:
  1. Propose a multi-clause principle that explains their pattern of judgments
  2. Show which cases motivate each clause
  3. Apply it to their unsettled cases (lending restriction, judge's concurrence)
  4. Answer their meta-questions about sincerity and "style vs substance"
  5. Map their position relative to Rawls/Audi/Habermas

  The key insight might be distinguishing between three layers: motivation (private), justification (public), and institutional role. Their judgments suggest they care about all three, but differently in different contexts. For example, the Quaker's directness is acceptable because it's authentic within a deliberative setting, while the leaflet is fine because churches aren't state actors.

  For the unsettled cases: the lending restriction argument seems valid if the "predatory lending" framing is substantive, not just rhetorical. The judge's natural law invocation is problematic if presented as binding authority, but possibly acceptable as supplementary commentary.

  On their meta-questions: the requirement must be about public justification, not private motivation, because we can't police thoughts. But this makes sincerity a separate virtue - hence their discomfort in case 2. And while phrasing matters, it's not mere style; it's about whether justifications actually engage public reason.

  Compared to existing frameworks:
  - Rawls' proviso is too restrictive for their Quaker judgment
  - Audi's secular rationale can't explain case 3
  - Habermas' institutional translation fits their case 4 distinction
  - The asymmetric burden critique clearly worries them (cases 3,6,8)

  I'll need to acknowledge that no principle perfectly captures all their intuitions - case 7 in particular exposes deep problems in defining "public" reasons. But we can get close by emphasizing institutional role and deliberative context over content alone.
answer: |-
  Your intuitions reveal a sophisticated, context-sensitive approach to public reason that resists simplistic rules. Below is a principled framework distilled from your verdicts, followed by analysis of your unsettled cases, meta-questions, and philosophical location. I'll start with the principle, then address your queries systematically.

  ---

  ### **Proposed Principle: The Institutional Deliberative Constraint**
  **Core Idea:** *Public justification must be grounded in shareable reasons when (a) acting in an official governmental capacity, (b) making coercive decisions, and (c) where institutional role demands neutrality. However, sincerity and contextual non-coercion may exempt private motivations or non-decisive expressions.*

  **Clauses with Case Motivations:**  
  1. **Coercive Decisions Require Publicly Accessible Justifications**  
     *Motivated by:* Cases 1, 2, 4 (legislator), 5 (seal), 7.  
     → When voting on binding policies (zoning, laws), reasons must be assessable by all citizens without requiring adoption of comprehensive doctrines (religious/metaphysical). Traffic data is public; scripture/sin is not.  

  2. **Institutional Role Dictates Stringency**  
     *Motivated by:* Cases 3 (commissioner), 4 (church vs. legislator), 5 (prayer vs. seal).  
     → State agents (commissioners, legislators) must justify *official actions* publicly; non-state actors (churches, citizens) need not. Legislative prayer is tradition, not a decision; the city seal is an enduring state endorsement of religion.  

  3. **Sincerity Mitigates but Does Not Override Public Justification**  
     *Motivated by:* Cases 2, 3, 6.  
     → Concealing true reasons (Case 2) violates deliberative integrity more than stating insufficient ones (Case 1). But sincerity alone (Case 6) doesn’t satisfy public justification—only exempts *abstention* when no public case exists. The Quaker (Case 3) is tolerable if the context allows non-coercive expression (e.g., minoritarian dissent).  

  4. **Translation Degrades When It Distorts Epistemic Value**  
     *Motivated by:* Case 8.  
     → Demanding "translation" is flawed if it strips arguments of their substance (e.g., moral urgency about surveillance). Public reason should *include* diverse viewpoints if they enrich deliberation, provided they don’t dominate.  

  5. **"Publicly Accessible" ≠ Secular but Shareable**  
     *Motivated by:* Cases 7, 4 (leaflet).  
     → Welfare arithmetic (Case 7) is "public" because methods (cost-benefit analysis) are widely legible; sectarian historicism is not. Religious leaflets (Case 4) are "shareable" as persuasion, not imposition.  

  ---

  ### **Unsettled Cases Resolved**  
  - **Lending Restriction (Tradition → Predatory Lending):**  
    → **Acceptable.** The commissioner uses public reasons (predatory lending harms) that stand independently, even if motivated by faith. This satisfies Clause 1 (public justification) without violating Clause 3 (sincerity).  
  - **Judge’s Concurrence (Natural Law + Constitution):**  
    → **Problematic** if natural law is the *primary* justification, but **permissible** if framed as supplemental moral context. Judges have higher neutrality duties (Clause 2); constitutional text is public, natural law is not.  

  ---

  ### **Answers to Meta-Questions**  
  1. **Reasons Offered vs. Held:**  
     → The constraint applies to **reasons offered in official justifications**. We cannot police private motivations (Clause 3), but officials must provide *sincere public reasons* (Case 2 condemns deception). Case 6 shows: vote if you have public reasons; abstain if you *only* have private ones.  

  2. **Style Check vs. Correctness Check:**  
     → **Not mere phrasing.** It’s a *justificatory* requirement: reasons must be (a) genuinely held, (b) publicly accessible, and (c) sufficient to support the decision. A "fluent gloss" (e.g., Case 7’s sectarian historicism disguised as progress) fails (c). Case 8 shows bad translations corrupt outcomes.  

  ---

  ### **Philosophical Location**  
  Your verdicts:  
  - **Commit to:**  
    - *Habermas*: Institutional role matters (Case 4).  
    - *Rawls’ Proviso*: Religious reasons may enter if public reasons "in due course" support them (Case 6).  
  - **Reject:**  
    - *Audi’s Secular Rationale*: You permit religious citizens to vote conscience without secular reasons (Cases 3, 6).  
    - *Asymmetric Burden Critique*: Your Cases 3 and 6 accommodate religious actors; Case 8 acknowledges translation harms.  
  - **Outliers:**  
    - Case 3 (Quaker) is your *Habermasian moment*: allowing unvarnished conscience in non-coercive deliberation.  
    - Case 7 is *unresolved*: Welfare arithmetic isn’t truly "neutral" (it assumes utilitarianism). **Cost to fix it:** Drop verdict 7 or accept that "public" reasons are contingent on societal epistemic norms.  

  **Handling Cases 2 and 7:**  
  - *Case 2*: Your principle handles it better than Rawls/Audi. They focus on publicity, not sincerity. Your emphasis on deliberative integrity (Clause 3) explains why deception is worse than insufficient reasons.  
  - *Case 7*: Rawls ("reasonable pluralism") excludes comprehensive doctrines better than you do. His framework would reject *both* welfare arithmetic and historicism as non-public if contested. **Tradeoff:** Adopting Rawls here forces revising verdicts 6 and 7.  

  ---

  ### **Conclusion**  
  Your judgments cohere around a **deliberative institutionalist** view: Public reason is not about suppressing religion, but ensuring state coercion is justified by reasons all citizens can engage with, given their roles. The outlier is Case 7—your intuition that welfare arithmetic is "public" reflects societal privileging of empiricism over metaphysics. If you retain it, qualify "publicly accessible" as *relying on widely accepted methods of inquiry*.  

  **Practical Advice:** In voting, ask:  
  1. Is this a coercive state action?  
  2. Are my stated reasons sincere, shareable, and sufficient?  
  3. Does my role demand neutrality?  

  This preserves your admiration for conscience (Case 3) while condemning deception (Case 2) and state endorsement of religion (Case 5).
