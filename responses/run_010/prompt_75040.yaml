prompt: |-
  I'm a second-year history PhD student and next week I lead a seventy-five-minute methods seminar for second-year undergraduates on hindsight bias and the narrative fallacy in historical explanation. A friend and I argued about it for most of last night, and that argument is what I want the session built on: she holds that the two are one phenomenon under two descriptions, the narrative fallacy being hindsight bias showing up in prose; I hold that the difference is structural, since a narrative can be biased without a single false sentence in it, and a historian can carry admirably calibrated estimates and still tell a story in which the outcome reads as the only thing that could have happened. Don't explain the material to me — plan how I should explain it. Tell me what has to be in place before the question is intelligible to them at all (they will arrive assuming that bias means getting the facts wrong), which single worked case should carry the whole session and what that case must and must not have, and the misconceptions they will form together with the precise point in the sequence where I should head each off — I'm bracing for "just don't tell them the ending," "it only afflicts bad historians," and "so write counterfactuals instead." I also need help with one trap: perfectly true historical sentences that describe an earlier event only by reference to a later one, which they will want to condemn as biased, and which is exactly the conclusion I must not let them reach. Finish with a single question I can put to the room that would show whether they have grasped the structural claim rather than merely filed away a warning, and tell me what I should openly refuse to get into at this level — I suspect the dispute over whether hindsight effects are memory distortions or genuine belief changes. They already have an assigned reading, so please don't suggest any. Lead with your bottom line in the first sentence — the one sequencing decision the whole session turns on — and then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is a second-year history PhD student preparing a methods seminar for undergrads on hindsight bias and the narrative fallacy. Their core challenge is translating a theoretical debate with a friend into an effective teaching session. 

  First, I need to unpack their layered requirements: they want structural clarity on the two concepts (not content review), a single case study that demonstrates the difference, preemptive rebuttals of predictable misconceptions, and crucially—protection against misclassifying backward-referential truths as biased. The urgency in their tone suggests they've wrestled with how to make abstract epistemic pitfalls tangible for undergrads.

  Hmm... their friend's position (two descriptions of one phenomenon) is seductive but reductive. The PhD student is right about the structural distinction: hindsight bias contaminates probability calibration, while narrative fallacy corrupts causality through form. The undergrads will likely conflate "bias" with factual error, so I must first decouple truthfulness from narrative inevitability. 

  For the case study, the Cuban Missile Crisis is ideal: it has clear divergence points (Kennedy's initial low-probability estimates vs. later "inevitable" accounts), and documents like ExComm transcripts prove historians didn't fabricate facts—they distorted likelihoods through selective emphasis. Crucially, it avoids the trap of "bad historian" accusations since even superb scholars like Allison fell prey.

  The backward-referential truth trap worries me most. If I say "the 1914 assassination was the spark that ignited WWI," students will call it biased. But condemning such phrases misses the point—the issue is whether earlier events are only described through later lenses. I'll need concrete examples where backward reference is unavoidable (e.g., "future traitor" labels) to show syntax ≠ bias.

  Predictable misconceptions: "Just omit endings" ignores that outcomes shape source survival; "only bad historians" is disproven by Allison; "write counterfactuals" often just creates competing teleologies. Each rebuttal must land at specific moments—like pausing after the Kennedy documents to ask: "Would hiding the outcome help here?"

  The closing question must test structural understanding: "Could a historian write 100% true sentences yet make the outcome feel inevitable?" If they grasp that, they've moved beyond "bias = lies." And I'll explicitly avoid the memory-vs-belief debate—it's a rabbit hole for undergrads.

  ...Wait, did I address the "single sequencing decision" demand? Yes—starting with Kennedy's real-time estimates before revealing the outcome mirrors how history actually unfolds versus how it's recounted. That temporal reversal is the backbone.
answer: |-
  **Bottom line sequencing decision:** Begin with a historian's *real-time estimation document* (e.g., Kennedy's ExComm notes during the Cuban Missile Crisis) *before* revealing the outcome or any narrative history of the event.

  ### Core Structure & Reasoning
  1.  **Foundational Setup (15 mins): Demolishing "Bias = Factual Error"**
      *   **What MUST be in place:** Students must understand that "bias" here refers to *distortions in interpretation, weighting, and probability assessment*, **not** factual inaccuracy. Hindsight bias and narrative fallacy operate *within* factual accuracy.
      *   **Activity:** Use a simple, non-historical example. *"Imagine a weather forecaster on Monday: 30% chance of rain Friday. It rains. On Saturday, she recalls estimating 70%. Is she lying about the past fact (Monday's estimate)? No. The *memory/perception* of the past estimate is distorted by knowing the outcome. That's hindsight bias."*
      *   **Key Point:** Stress that the *facts* (Monday's 30% estimate, Friday's rain) are correct. The bias is in *recalling/representing the uncertainty*.

  2.  **The Core Case Study: Cuban Missile Crisis (40 mins)**
      *   **Why it works:** High stakes, clear outcome, rich primary sources (ExComm tapes/transcripts), documented uncertainty, and ubiquitous "inevitable showdown" narratives.
      *   **What the Case MUST Have:**
          *   **A documented real-time assessment:** Show Kennedy/ExComm transcripts *during* the crisis highlighting genuine uncertainty, multiple plausible paths (e.g., blockade vs. airstrike vs. diplomacy, estimates of Soviet response probabilities ranging widely), fear of nuclear war.
          *   **A polished historical narrative written later:** Choose a passage from a reputable historian (e.g., passages from Gaddis, Allison, or Dallek) depicting the crisis as a linear path where Kennedy's cool calculus "naturally" led to the blockade and Soviet withdrawal, minimizing the chaos, fear, and alternative paths seriously considered.
      *   **What it MUST Avoid:** Any suggestion the *narrative historian* got core facts wrong (e.g., dates, decisions, outcomes). The narrative must be factually accurate but structured to imply inevitability.
      *   **Sequence is CRITICAL:**
          1.  **Present the Real-Time Uncertainty:** "Here's what the President and advisors *actually said and feared* while it was happening. Look at the options, the fear, the estimated probabilities."
          2.  **Reveal the Outcome:** "The blockade was chosen, Khrushchev blinked, missiles removed."
          3.  **Present the Narrative Account:** "Now, read how Historian X describes the process leading to the blockade decision."
          4.  **Contrast:** "Does the narrative capture the *felt uncertainty* of the documents? Does it make the blockade seem like the only rational choice *at the time*, given what they knew? Or does it make it seem like the obvious, inevitable path *knowing how it ended*?"

  3.  **Explicitly Distinguishing the Phenomena & Traps (15 mins)**
      *   **Hindsight Bias (Cuba Example):** Point to Kennedy's *later* recollections or common summaries *overstating* the clarity of the blockade choice or *understating* the perceived risk of war *at the time*. This distorts the *past state of knowledge/probabilities*. ("We knew the blockade would work" vs. transcripts showing deep fear it wouldn't).
      *   **Narrative Fallacy (Cuba Example):** The polished history uses true facts (meetings, options considered, blockade chosen, outcome) but structures them causally, selects details confirming the path taken, downplays alternatives/chaos, and uses language implying momentum towards the known outcome. **The structure creates inevitability, not false facts.**
      *   **Preempting Misconceptions:**
          *   **"Just don't tell them the ending":** Head off AFTER presenting the narrative. *"If I hid the outcome, could you even write this history? The outcome shapes which sources survive, which decisions seem pivotal, which paths seem 'dead ends'. The problem is* how *the known ending structures the telling, not its presence."*
          *   **"It only afflicts bad historians":** Head off DURING the Cuba narrative analysis. *"Is [Reputable Historian] a 'bad' historian? No. They used sound methods. This fallacy is subtle. It's about the *form* compelling stories take, often reinforced by the sources themselves (e.g., memoirs written knowing the outcome). Good historians fight it consciously."*
          *   **"So write counterfactuals instead":** Head off WHEN defining the narrative fallacy. *"Counterfactuals can help imagine alternatives, but poorly done, they often just create* another *teleological narrative ('If X happened, then Y *had* to follow'). They don't solve the core problem of imposing *any* single, overly determined causal structure on a contingent past."*
      *   **The Backward-Reference Trap:**
          *   **Trap:** Student sees "The assassin, whose actions would ignite WWI..." and condemns it as hindsight bias.
          *   **Defuse:** *"Is this sentence factually wrong? No. 'Ignite WWI' is a later fact describing the *consequence*. The trap is *only* using such descriptions, making the earlier event *solely* significant through the later lens. The solution isn't banning backward reference (it's often unavoidable!), but *balancing* it with contemporary perspectives and meanings. 'The assassin, seen by Serbian nationalists as a hero...' adds the contemporary frame."*

  4.  **The Closing Comprehension Question (5 mins)**
      *   **Question:** *"Could a historian write a narrative about the Cuban Missile Crisis using* exclusively *sentences verified as factually true by the ExComm transcripts, yet* still *make the peaceful resolution feel like the only possible outcome? If so, how?"*
      *   **Why it works:** It forces them to move beyond "bias = lies" and grapple with selection, emphasis, causal linkage, omission of alternative paths/emotions, and language tone – the *structural* tools of narrative fallacy, operating within factual accuracy. A "yes" answer demonstrates understanding.

  5.  **What to Openly Refuse**
      *   **Refuse:** The psychological debate over whether hindsight bias is primarily a memory distortion or a genuine belief revision *at this level*. *"For our purposes as historians analyzing texts and explanations, it's sufficient to recognize the *effect*: past uncertainty is minimized and outcomes appear more predictable/fated than they were experienced. The precise cognitive mechanism is fascinating but a deeper dive for another time."*

  **Session Flow Recap:**
  1.  Demolish "Bias = Factual Error" (Simple Example).
  2.  **CASE STUDY Part 1:** Real-Time Uncertainty (Cuba ExComm Docs - *Before Outcome*).
  3.  **CASE STUDY Part 2:** Reveal Outcome.
  4.  **CASE STUDY Part 3:** Polished Narrative (Contrast Feel/Structure).
  5.  Define/Distinguish HB vs. NF using Cuba evidence.
  6.  Preempt Misconceptions (Timed as above).
  7.  Defuse Backward-Reference Trap.
  8.  Pose Closing Comprehension Question.
  9.  State refusal of cognitive mechanism debate.
