prompt: |-
  I'm TA-ing an upper-level seminar on the origins of the Jesus tradition this term — 18 students, mostly juniors, one 75-minute block, and the room has whiteboards but no projector, so anything you design has to run on paper and chalk. Two weeks back they got the standard lecture on the criteria of authenticity: dissimilarity (including the double-dissimilarity version), multiple attestation, embarrassment, coherence, plus the Palestinian-environment and Aramaic-traces business. They all nodded along and now think they've learned a method. What I actually want them to leave feeling is that the criteria were never calibrated — that they behave like diagnostic tests whose specificity nobody has ever measured, and whose output quietly collapses when the prior probability is low. Think of each criterion as a little machine that prints "authentic" or "not." What you'd need to trust it is a rate: how often does it fire on material you already know to be invented? Nobody has ever had a labeled dataset for first-century Jesus material, so that number has never been computed, and yet the whole enterprise is run as though the answer came back favorable. And the criteria aren't independent of each other, which is the part my students never clock: a saying is multiply attested *because* it was useful to lots of communities, and usefulness to lots of communities is also what tends to make it look dissimilar from any single one of them — so stacking criteria doesn't multiply your confidence the way they assume it does.

  I have a hunch about a two-round structure and I want you to build it out properly, or tell me the hunch is bad and build something better. Round one: a corpus with an answer key, so they finally get to measure a false-positive rate on material where ground truth exists — the standard move is to have me assemble a list of things I've actually said in earlier classes mixed with things I never said, written up in the same flattened register as a gospel pericope, and have them sift it blind with the criteria while I hold the key. Round two: the same procedure applied to real gospel material, except the key doesn't exist and never will, and they have to sit in that. I'd want the round-two items just named by passage, not quoted — we're all reading the same translation and I don't want your approximation of the wording drifting into the handout.

  So: give me the full build. The corpus construction protocol (how many items, what mix of real to invented, and crucially how to write the invented ones so they're *fair* — an invented item that's obviously anachronistic turns the exercise into a shooting gallery and proves nothing about the criteria); the rules and any team structure; a scoring scheme with tokens or points rather than real money, that makes them commit before they see the key rather than hedging; a minute-by-minute timeline that fits 75 including the debrief; and a debrief that maps specific moments in the room onto specific failures — double dissimilarity handing you a Jesus who fits neither his Judaism nor the church that formed around him, embarrassment depending entirely on knowing what a community was sensitive about, coherence verging on circular, multiple attestation conflating "widely spread" with "early." Tell me what will predictably go wrong the first time I run this and how to recover. Two extra things I care about. First, be honest about whether the round-one/round-two analogy actually holds, because I suspect it partly doesn't: my invented items come from one modern mind with no community shaping them, whereas the gospel material was produced by groups with live interests, which is exactly what the criteria were supposed to be detecting — if that gap is big enough to sink the comparison, say so and tell me what to do instead. Second, there are three students in this room whose faith is not a hobby and one classics major who thinks the entire subfield is astrology; I don't want the activity engineered to humiliate either camp, but I also don't want it sanded down until it teaches nothing, so design with that in mind and flag anywhere you had to compromise. No reading list, no citations — I've got the bibliography sorted and I'd rather you spend the words on the mechanics. And at the end tell me how confident you are in your empirical predictions here (that they'll over-trust the criteria, that they'll score near chance on the labeled corpus), and single out the one claim in your design you're least sure of.
reasoning: |-
  We are designing a two-round exercise to demonstrate the limitations of the criteria of authenticity in historical Jesus studies. The goals are:
  1. To show that the criteria have unknown false-positive rates (they may label inauthentic material as authentic too often).
  2. To highlight the interdependence of criteria (e.g., multiple attestation and dissimilarity may be driven by the same underlying factor: usefulness to multiple communities).
  3. To have students experience the uncertainty when applying the criteria to real gospel material (without an answer key).

  The exercise has two rounds:
  - Round 1: A labeled corpus (with an answer key) of sayings, some of which the TA actually said in previous classes and some invented. Students apply the criteria and then see how well they did.
  - Round 2: Apply the same criteria to real gospel passages (without an answer key) to feel the uncertainty.

  Key considerations:
  - The invented items must be fair (not obviously anachronistic or absurd).
  - The analogy between Round 1 (modern sayings) and Round 2 (ancient gospel material) may be limited because the gospel material was shaped by communities over time, whereas the invented items are from one person. We must address this.
  - The class has 18 students, one 75-minute block, and only paper and chalk.
  - We need to design the protocol, scoring, timeline, and debriefing.

  Structure:

  I. Corpus Construction for Round 1
     - We need a set of sayings (or short episodes) that mimic the style of a gospel pericope. Let's call them "TA sayings".
     - How many? Given time constraints, 10 items: 5 real (things the TA actually said in previous classes) and 5 invented. This is a manageable number for a 75-minute session.
     - Writing the invented items:
          - Avoid anachronisms that would be obvious in a modern context (e.g., don't mention smartphones in a saying about distraction).
          - Make them plausible: they should reflect the TA's known style and topics from the class. For example, if the TA often uses metaphors about nature or books, the invented ones should too.
          - Write them in a flattened, matter-of-fact register similar to gospel pericopes (e.g., "One day, the TA said to the class, 'The roots of knowledge run deep, but they drink from the same spring.'").
          - To ensure fairness, we can have a colleague (or the professor) review the list to check that the invented ones are not obviously fake and the real ones are not too distinctive.

     - Example of real and invented (based on TA's actual topics and style):
          Real (if the TA said it): "Remember, the criteria are tools, not proof."
          Invented: "The TA once said, 'Historical truth is like a mosaic: the pieces are broken, and we must reassemble without the picture on the box.'"

     - The answer key will be held by the TA.

  II. Rules and Team Structure
     - Students work in pairs (for 18 students, 9 pairs). This promotes discussion and reduces individual pressure.
     - Each pair gets a handout with the 10 Round 1 items (without labels) and a worksheet to record:
          - For each item, mark which criteria they think apply (e.g., dissimilarity, multiple attestation, embarrassment, etc.) and then a final verdict: "authentic" (TA said it) or "inauthentic" (invented).
          - They must commit to a verdict for each item.

     - Scoring:
          - Use tokens: Each pair starts with 10 tokens (one per item). For each item, they bet one token on their verdict. If they are correct, they get their token back plus one more (so +1 for correct). If wrong, they lose the token (so -1). They can choose to bet half a token (0.5) if they are unsure, but they must still choose a verdict. This scoring encourages commitment and quantifies confidence.
          - Alternatively, we can use a points system: 1 point for a correct verdict, 0 for incorrect, and they must commit.

     - After Round 1, the TA reveals the answer key and pairs calculate their score.

  III. Round 2: Real Gospel Material
     - The TA provides a list of 5 gospel passages (by reference only, e.g., "Mark 2:23-28", "Matthew 5:3", "Luke 15:11-32", "John 4:7-9", "Thomas 113"). Students do not get the text on the handout because they have the same translation in their Bibles or course materials. They are to apply the same criteria and give a verdict: "authentic" (likely going back to Jesus) or "inauthentic" (likely not).
     - No answer key exists, so they must live with the uncertainty.

  IV. Timeline (75 minutes total)
     - (0-5 min) Introduction: Explain the exercise and the criteria they will use. Remind them of the criteria (dissimilarity, multiple attestation, embarrassment, coherence, Palestinian environment, Aramaic traces). Hand out Round 1 corpus and worksheets.
     - (5-25 min) Round 1: Pairs work through the 10 items (about 2 minutes per item). They must record their verdict for each and, if using the token system, how much they bet.
     - (25-30 min) Collect the worksheets and reveal the answer key for Round 1. Have pairs self-score.
     - (30-40 min) Discuss Round 1 results: What was the false positive rate? (How many invented items were labeled authentic?) How did the criteria perform? Highlight specific cases where criteria led them astray.
     - (40-55 min) Round 2: Hand out the list of 5 gospel references. Pairs have 15 minutes to discuss and record their verdicts (authentic/inauthentic) and which criteria they used. They do not score because there's no key.
     - (55-75 min) Debrief: Discuss the process and the limitations of the criteria. Focus on:
          - The false positive rate observed in Round 1 (likely high, showing that the criteria are not reliable).
          - Interdependence of criteria (e.g., a saying that is multiply attested might also be dissimilar because it served multiple communities).
          - The problem of prior probability: Without knowing the base rate of authentic vs. inauthentic material, the criteria are hard to interpret.
          - The gap between Round 1 and Round 2: In Round 2, the material was shaped by communities over time, which affects multiple attestation and dissimilarity. The criteria were designed to detect community shaping, but in Round 1 the invented items were not shaped that way. However, the exercise still shows that the criteria are not calibrated and have unknown reliability.
          - Address the faith and classics students: Emphasize that the exercise is about the method, not about undermining faith or the value of historical inquiry. For the classics major, note that the field is trying to use rigorous methods, but the exercise shows the challenges.

  V. Debriefing Points
     - Map specific moments from Round 1 to the criteria failures:
          - Double dissimilarity: If an invented saying was marked authentic because it didn't sound like the TA or like typical classroom talk, but that might be because it was invented to be profound. This can lead to a Jesus who is disconnected from both Judaism and the early church.
          - Embarrassment: In Round 1, they might have thought a real saying was embarrassing (e.g., the TA admitting a mistake) and thus authentic, but without knowing the TA's personality, that's speculative. Similarly, in the gospels, we don't always know what would be embarrassing for the early church.
          - Coherence: If a saying was coherent with the TA's known views, they might have called it authentic, but that's circular because the known views are defined by what we think is authentic.
          - Multiple attestation: In Round 1, if two pairs of students remembered a saying (but we don't have multiple sources), they might have confused that with multiple attestation. In the gospels, multiple attestation might reflect spread, not necessarily antiquity.

  VI. Potential Problems and Recovery
     - Prediction: Students will over-trust the criteria and score near chance (50-60% correct) in Round 1, because the criteria are not reliable and the invented items are designed to be plausible.
     - What might go wrong:
          - Some invented items might be too easy or too hard. Recovery: Have a backup plan for the debrief: if they score very high, discuss why (maybe the criteria worked? but then point out that in the real case we don't have a key) and note that the exercise is just one test. If they score low, that proves the point.
          - Time: 20 minutes for 10 items might be tight. Recovery: If running behind, skip the token betting and use simple votes to speed up.
          - The faith students might feel attacked. Recovery: Emphasize that the exercise is about the method, not about whether Jesus said these things. The classics major might dismiss the exercise as trivial. Recovery: Ask them to consider how the same method is used in other historical fields and if it's any better.
          - The analogy gap: The Round 1 corpus lacks the communal transmission of the gospels. We must acknowledge that in the debrief. The point is not that the criteria are useless, but that we don't know their error rates and they are interdependent.

  VII. Addressing the Analogy Gap
     - The gap: The invented items are from one mind, not shaped by communities. The criteria (especially multiple attestation and dissimilarity) are meant to account for community interests. So the comparison is imperfect.
     - Alternative: We might instead use a corpus of historical sayings from a known figure (e.g., a famous person from the 19th century) where we have both authentic and invented sayings. But that requires preparation and might not be feasible. Since we are in a classroom, the TA's sayings are practical.
     - What to do: Acknowledge the gap in the debrief. The exercise shows the problem of uncalibrated tests. Even in a community-shaped corpus, we would still need to know the false positive rate, which we don't. Also, the interdependence of criteria remains an issue.

  VIII. Confidence in Empirical Predictions
     - Confidence: High that they will over-trust the criteria at the start and that their accuracy in Round 1 will be near chance (50-60%). The criteria are not diagnostic, and the invented items are designed to be plausible.
     - Least sure claim: That the scoring system (tokens) will effectively encourage commitment and reflection. It might be that students are too cautious and bet low, reducing the impact. I'm also less sure about the timing (if 20 minutes is enough for 10 items).

  Final Design:

  Handout for Round 1: 10 items (5 real, 5 invented). Example:

  1. "The TA said, 'The quest for the historical Jesus is like trying to hear an echo in a windstorm.'"
  2. "In a lecture, the TA stated, 'The criterion of embarrassment is the most reliable because the church would not invent something that made them look bad.'"
  ...

  Worksheet for Round 1: Table with columns: Item #, Criteria Applied (checkboxes for each criterion), Verdict (Authentic/Inauthentic), Bet (if using tokens).

  Handout for Round 2: List of 5 gospel references.

  Debrief Outline:
  - Round 1 results: Calculate overall accuracy, false positive rate (inauthentic items called authentic), false negative rate (authentic called inauthentic). Discuss how the criteria led to errors.
  - Criteria interdependence: Point out cases where multiple criteria applied to the same item and how they might be linked.
  - Round 2: Without an answer key, we cannot know. The criteria give a sense of confidence, but it's unmeasured.
  - Conclude: The criteria are heuristics, not scientific tests. They can be part of a reasoned argument but cannot deliver certainty.

  This design should meet the goals without humiliating any student. The focus is on the method, not the results.
answer: |-
  ### Exercise Design: "Calibrating the Criteria"  
  **Goal:** Demonstrate that the criteria of authenticity are uncalibrated diagnostic tools (unknown false-positive rates, interdependence) and force students to confront uncertainty when applying them to real gospel material.  

  ---

  ### **Corpus Construction Protocol (Round 1)**  
  **Why this works:** The modern TA-sayings corpus simulates the "authentic vs. invented" problem but avoids anachronisms by mirroring your actual teaching style. The invented items aren’t absurd—they’re *plausible extensions* of your known views, making false positives likely.  

  1. **Item Mix & Fairness**  
     - **10 total items**: 5 authentic (things you *actually* said in prior classes), 5 invented.  
     - **Authentic Items**: Select 5 paraphrased statements from your lecture notes (e.g., "The criteria are tools, not proofs"). Avoid overly distinctive phrases.  
     - **Invented Items**: Write these to mimic your style and themes but with subtle twists. Rules:  
       - **No anachronisms**: Use only concepts you’ve discussed (e.g., no "Jesus’ TikTok parables").  
       - **Plausibility**: Invented items should echo your phrasing but introduce minor logical extensions (e.g., if you criticized criterion X, invent: "Criterion X is like a broken compass—it points everywhere but north").  
       - **Flattened Register**: Write all items in sparse, pericope-like prose (e.g., "The TA said, ‘The criteria dissect the past with dull knives’").  
     - **Validation**: Have a colleague (or your past lecture notes) vet items to ensure invented ones aren’t obvious.  

  **Corpus Example**:  
  - Authentic: "The TA stated, ‘Dissimilarity isolates Jesus from Judaism and the church.’"  
  - Invented: "The TA argued, ‘Multiple attestation reflects utility, not antiquity.’"  

  ---

  ### **Rules & Team Structure**  
  - **Teams**: 6 groups of 3 students (ensures diversity: faithful/skeptical/classics major mixed).  
  - **Round 1 Rules**:  
    1. Groups receive the 10-item corpus (items numbered, no labels).  
    2. Apply **4 core criteria**: Dissimilarity (double), Multiple Attestation, Embarrassment, Coherence.  
    3. **Verdict**: For each item, groups vote "Authentic" (TA said it) or "Not Authentic" (invented).  
    4. **Confidence Betting**:  
       - Each group starts with 10 tokens (1 per item).  
       - For each item, they bet 0–2 tokens on their verdict (0 = low confidence, 2 = high).  
       - **Scoring**:  
         - Correct verdict: Win tokens bet (e.g., bet 2, get +2).  
         - Incorrect verdict: Lose tokens bet (e.g., bet 2, get -2).  
       - *Why tokens?* Forces commitment—no hedging. Tokens = "methodological confidence."  

  - **Round 2 Rules**:  
    - Groups receive a list of **5 gospel passages** (references only, e.g., "Mark 2:23–28").  
    - Same criteria and betting, but no answer key exists.  
    - Focus: "Would you bet tokens on authenticity? Why/why not?"  

  ---

  ### **Timeline (75 Minutes Total)**  
  | Time  | Activity |  
  |-------|----------|  
  | 0–5   | **Intro**: Frame the problem—"Today we test the criteria like lab equipment. What if they’re uncalibrated?" Hand out Round 1 corpus + tokens. |  
  | 5–25  | **Round 1 Work**: Groups analyze 10 items (2 min/item). Circulate to clarify criteria *without* hinting at answers. |  
  | 25–30 | **Collect Bets**: Groups lock verdicts/token bets on worksheets. |  
  | 30–35 | **Reveal Key**: Display answer key on whiteboard. Groups self-score tokens. |  
  | 35–40 | **Round 1 Results**: Groups report scores. Calculate class average (likely 45–55% correct). |  
  | 40–50 | **Round 2**: Hand out gospel references (e.g., Matt 19:24, Luke 16:13, Thom 63). Groups assign verdicts/token bets (no key). |  
  | 50–75 | **Debrief**: Guide discussion using whiteboard notes. |  

  ---

  ### **Debrief Structure**  
  Map Round 1 outcomes to criteria failures—**use whiteboard to track "Aha!" moments**:  
  1. **False-Positive Rate (FPR)**:  
     - *Observation*: Most groups mislabel 3–5 invented items as "authentic."  
     - *Failure*: Criteria have high FPR (e.g., Embarrassment flagged invented items as "authentic" because they *sounded* self-critical).  
     - *Link to Gospels*: "If criteria misfire on modern TA-sayings, why trust them for ancient material?"  

  2. **Criteria Interdependence**:  
     - *Observation*: Groups stacked criteria (e.g., "Item 7 is dissimilar + multiply attested = authentic!").  
     - *Failure*: Note how Dissimilarity and Multiple Attestation often aligned—both favor "useful" sayings.  
     - *Whiteboard Example*:  
       ```  
       Useful Saying → Adopted by Many Groups → Looks Dissimilar to Each → "Authentic!"  
       ```  
     - *Link to Gospels*: "A saying in Q and Mark isn’t ‘early’—it’s *useful*. Does that mean authentic?"  

  3. **Prior Probability**:  
     - *Observation*: Groups bet high tokens on items that "felt" authentic (e.g., coherent with your style).  
     - *Failure*: Coherence is circular—it assumes a "baseline" of known authentic sayings.  
     - *Link to Gospels*: "If we don’t know the real Jesus, how do we calibrate coherence?"  

  4. **Round 2 Uncertainty**:  
     - *Observation*: Groups split on gospel passages (classics major: "All inauthentic!"; faithful: "All authentic!").  
     - *Whiteboard Prompt*: "If we can’t agree *with* criteria, what are they actually measuring?"  
     - *Key Insight*: Criteria reflect *our assumptions* about communities (e.g., Embarrassment requires guessing what early Christians found awkward).  

  ---

  ### **Handling Sensitivities**  
  - **Faith Students**: Avoid "gotchas." Stress: "This critiques *methods*, not Jesus. Many faithful scholars use these tools cautiously."  
  - **Classics Major**: Validate skepticism—"You’re right: uncalibrated tools *are* unscientific. What would better look like?"  
  - **Compromise**: Round 1 uses *your* sayings (not Jesus) to depersonalize. Round 2 avoids quoting text to prevent ideological battles over wording.  

  ---

  ### **Does the Analogy Hold?**  
  **Partial gap, but not fatal**:  
  - **Gap**: Gospel material was shaped by communities; your invented items are solo creations. This *weakens* the test of criteria like Multiple Attestation/Dissimilarity, which target community influence.  
  - **Why it still works**: The exercise exposes **uncalibrated machinery**—criteria behave like hyperactive sensors (high false positives) regardless of context. The interdependence flaw is universal.  
  - **Mitigation**: In debrief, concede the gap: "The criteria *might* work better for community-shaped material—but without a labeled dataset, we can’t know. That’s the point."  

  **If the gap worries you**:  
  - **Alternative**: Replace Round 1 with **19th-century historical quotes** (e.g., Lincoln mixed with apocrypha) where "ground truth" exists. But this requires prep and risks distracting with new content. Your TA-sayings are simpler and land closer to home.  

  ---

  ### **Predictions & Confidence**  
  - **Empirical Predictions**:  
    - **Over-trust**: 90% of groups will bet high tokens early (they’ll assume criteria work).  
    - **Round 1 Accuracy**: 50–60% (near chance). False positives will dominate.  
    - **Confidence**: **High**. Criteria are easily gamed; plausible invented items exploit this.  
  - **Least Confident Claim**: **Token betting drives reflection**. I worry groups might treat tokens as "fun money," not epistemic confidence. If so, reframe mid-exercise: "Tokens = your scholarly reputation."  

  ---

  ### **First-Run Risks & Recovery**  
  - **Risk 1**: Groups solve Round 1 too easily (invented items are obvious).  
    - *Recovery*: If scores exceed 70%, confess: "I made the invented items too clear. But in real history, forgeries *are* plausible—like the Gospel of Peter." Pivot to discussing why gospel forgeries succeeded.  
  - **Risk 2**: Debate stalls (e.g., faith student: "But the Spirit guides scholars!").  
    - *Recovery*: "Absolutely—this exercise is about historical methods, not divine truth. Let’s focus on how *human* scholars use these tools."  
  - **Risk 3**: Time runs short during Round 1.  
    - *Recovery*: Skip token scoring; have groups share 1–2 "aha" misclassifications instead.  

  ---  
  **Final Confidence**: This design will achieve your goals. Students will leave uneasy about the criteria—especially when Round 2 leaves them hanging. The token system makes abstract flaws visceral, and the TA-sayings corpus ensures false positives bite. I’m 85% confident it runs smoothly; if groups resist betting, simplify to a show of hands for "authentic/not" in Round 1.
