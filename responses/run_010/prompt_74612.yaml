prompt: |-
  So, twenty years of rationalist blogs has left me with one incurable habit: I want the spec before I read any of the candidate answers, otherwise I just get anchored by whichever one I picked up first. This time the spec is the whole job.

  Here's the situation. I'm putting together a forecasting exercise on the survival of long-lived political entities — empires, dynasties, city-state leagues, sovereign trading companies, and empire-adjacent things like the papacy or the various composite monarchies, plus modern candidates people will want to argue about (the UN, the EU, the current form of the US constitutional order). Forecasters get a list of entities that are alive today and predict whether each still exists in something like its current form in 2075, and then I score them properly: Brier, calibration curve, resolution, the works.

  The problem is that every base rate I could possibly offer depends entirely on how I slice the class, and the classes are tiny, and half their members are still alive so the duration data is censored, and the units of analysis are contested before you even get to statistics. That famous figure going around for about fifty years now — empires last 250 years on average, ten-ish cases spanning three millennia — is exactly the kind of number I want to make impossible to produce by accident. I cant tell from it whether the author fixed the class first or the answer first.

  So: write the desiderata. What does a theory of reference-class construction — or more precisely a procedure, I care about what someone actually does at the desk — have to deliver before I'd trust the base rate that comes out of the other end? Give me the full requirements list, each one with the case or consideration that motivates it, not just the label. And mark which ones are non-negotiable and which are just the taste of one camp of forecasters dressing up as method.

  Stuff I suspect belongs on the list, include it if you agree and push back hard if you don't:

  - it has to fix the outcome definition and the individuation of units before the class gets chosen, or class-selection is just motivated reasoning with a spreadsheet. What counts as Rome ending — 476, 1453, never, or does the papacy count as a continuation? Different answers give you wildly different lifespans from the same history.
  - it has to adjudicate that very old fight in the philosophy of probability where one side says use the widest class you have reliable statistics for, and the other side says use the narrowest class that's genuinely statistically uniform with respect to the outcome. Those two rules point in opposite directions and I'm surely not the first person to want both at once. Say which wins here and why, and whether the answer changes when n is eleven.
  - it has to handle right-censoring and survivorship without hand-waving, because most of my entities are alive, and alive is not the same as long-lived.
  - it has to have an account of when this time is different is a legitimate move and who carries the burden of proof when someone makes it. Nukes, printing, administrative capacity, the fact that modern states can lose a war and not stop existing. If the answer is never, that's a position too, and I want to see it defended.
  - it has to be pre-registrable: after the fact I should be able to tell whether the class was picked before or after anyone saw which number it produced. Relatedly, it should say what to do when the honest class choice gives a number the forecaster already knows is going to be wrong.
  - it has to say how to combine the multiple classes any single case falls into. Every empire is also a state, also a pre-industrial or industrial polity, also a conquest dynasty, also a member of some regional cluster. Average the base rates? Weight by specificity? Pick one and eat the error?
  - it has to have some story about what a base rate is even for in this domain, given that the whole point of a forecast is to be better than the base rate. If the procedure's only output is a prior, say so and tell me how much updating it licenses.
  - it should be runnable by one person with a laptop and an afternoon. I'll admit up front this might be my laziness rather than a real requirement, so tell me if I should drop it.

  Then the two things I actually want most:

  1. If some subset of these can't all be satisfied at the same time, say so explicitly — I have a strong suspicion that specificity, small n, and non-stationarity form a triangle where you get to keep two — and tell me which corner to give up for this particular project. If the list itself is the result, that's fine, that's what I'm after. Don't soften it.

  2. Which single requirement does the most work knocking out the ways people actually do this in practice? I want one, with the bodies counted.

  Last part, keep it short — a paragraph each, no more: how do these four do against your list? (a) naive average of the lifespans of the dead ones; (b) survival analysis / hazard curves with censoring handled properly; (c) a hierarchical Bayesian model that borrows strength across overlapping classes; (d) skip the theory entirely and just let a large crowd pick its own reference classes and report the median.

  No reading list, no bibliography, no names-dropping of papers — I'm deliberately working offline and a guessed-at citation is worse than none. Just the requirements, the cases behind them, and where they break.
reasoning: |-
  Okay, let me try to unpack this user's request. They're clearly frustrated with how reference classes are constructed in forecasting exercises, especially for long-lived political entities. The core problem is that existing methods seem arbitrary—base rates change drastically depending on how you define the class or outcome, and small sample sizes make everything messy. 

  First, I notice the user has already done significant groundwork. They've identified specific pain points: outcome definition ambiguity (like when Rome "fell"), the tension between broad vs narrow reference classes, censored data issues, and the "this time is different" problem. They're also practical—they want something pre-registrable and runnable in an afternoon. 

  The user's tone suggests deep familiarity with rationalist/foresight communities. References to "anchoring," "Brier scores," and "motivated reasoning with a spreadsheet" signal they’ve engaged with forecasting debates before. Their suspicion about specificity/small-n/non-stationarity being irreconcilable feels like lived experience. 

  Key unspoken needs jump out:  
  - **Defensibility**: They want a method where choices (e.g., "Papacy = Roman Empire?") can’t be reverse-engineered to fit a desired base rate.  
  - **Transparency**: The procedure must expose its own assumptions (e.g., "non-stationarity burden is on the claimant").  
  - **Practicality**: No ivory-tower solutions; if a requirement conflicts with feasibility, flag it.  

  Their "suspect list" of requirements is sharp. I agree with most, but pushback is needed on two:  
  1. **"Widest vs narrowest class"**: They’re right these conflict, but framing it as "which wins" misses that *neither* works alone. The answer should be "neither—use structured borrowing across classes."  
  2. **"One person + laptop"**: This might need relaxing. Hierarchical Bayes solves many problems but requires Stan/PyMC—doable in an afternoon? Dubious.  

  For the "four methods" evaluation:  
  - **(a) Naive average**: Dies instantly on censoring + small-n. Corpses: high.  
  - **(b) Survival analysis**: Handles censoring but ignores class heterogeneity. Corpses: medium (fails specificity).  
  - **(c) Hierarchical Bayes**: Best for overlapping classes but complex. Tradeoff: sacrifices simplicity.  
  - **(d) Crowd median**: Dodges theory but inherits crowd biases. Corpses: variable (depends on crowd).  

  The user’s brutal honesty about tradeoffs ("tell me which corner to give up") is refreshing. I’ll explicitly call the specificity/small-n/non-stationarity triangle unwinnable and suggest sacrificing specificity. Why? Because in forecasting, overfitting to tiny classes is worse than slightly noisier priors.  

  Most lethal requirement? **Pre-registered outcome/unit definitions**. It kills 90% of pop-history takes (e.g., "250-year empires") by forcing explicit choices *before* seeing lifespans.  

  Final note: User’s "no citations" rule is wise. They’ve likely seen lit reviews that don’t solve practical problems. Focus on executable principles, not namedropping.
answer: |-
  Here's the requirements list, distilled from your constraints and motivations. Non-negotiable items (**bolded**), others are strong recommendations. Tradeoffs and method evaluations follow.

  ---

  ### Requirements for Reference-Class Construction (Desk Procedure)
  1.  **Pre-Specified Outcome Definition & Unit Individuation (Non-negotiable)**  
      *Why*: Without this, class selection is arbitrary. Rome ending in 476 AD vs. 1453 AD yields a 500-year vs. 1500-year lifespan. Papacy-as-Rome? Pre-define "death" (e.g., loss of core sovereignty, dissolution of key institutions) and entity boundaries (e.g., continuous legal entity vs. cultural legacy) *before* class assembly.  
      *Motivation*: Anchoring bias / motivated reasoning prevention.

  2.  **Pre-Registered Class Selection Criteria (Non-negotiable)**  
      *Why*: To prevent cherry-picking classes to match desired base rates. The procedure must document *how* classes are defined (e.g., "all agrarian empires post-500 BC," "all maritime trading entities") *before* lifespan data is examined.  
      *Motivation*: Auditability and bias control.

  3.  **Formal Handling of Censoring & Survivorship (Non-negotiable)**  
      *Why*: Ignoring alive entities (e.g., modern states) distorts lifespan estimates downward. Use survival analysis methods (Kaplan-Meier, Cox PH) that incorporate censored data. "Alive" must be explicitly defined (e.g., "retains core functions as of 2023").  
      *Motivation*: Avoiding systematic underestimation.

  4.  **Burden of Proof for Non-Stationarity ("This Time is Different")**  
      *Why*: Claims that modern entities (US, EU) differ fundamentally (nukes, globalization) must be justified *empirically*. Burden lies on the claimant. Default assumption: stationarity unless proven otherwise. Evidence: quantitative metrics (e.g., hazard rates pre/post-Industrial Revolution) or mechanistic arguments (e.g., nuclear deterrence altering conquest dynamics).  
      *Motivation*: Preventing ad-hoc exceptions that invalidate the class.

  5.  **Integration of Overlapping Classes**  
      *Why*: The US is a "modern state," "post-1789 republic," and "global hegemon." Solution: Use hierarchical/multilevel models to pool information across nested classes, weighting by relevance and sample size. *Not* simple averaging.  
      *Motivation*: Leveraging all data without arbitrary class choice.

  6.  **Clarity on Base Rate Purpose**  
      *Why*: The base rate is a *prior* for empirical updating, not the final forecast. It represents a default expectation absent entity-specific evidence. Specify how much updating is justified (e.g., via Bayes factor thresholds).  
      *Motivation*: Preventing base-rate fetishism; anchoring forecasts to evidence.

  7.  **Operational Feasibility (Laptop + Afternoon)**  
      *Why*: Ensures practical utility. Acceptable: Pre-defined scripts (R/Python) for survival analysis, simple hierarchical models. Not acceptable: Manual data mining, complex simulations.  
      *Motivation*: Avoiding paralysis by methodology.

  ---

  ### Tradeoffs: The Impossible Triangle
  You identified it: **Specificity**, **Small n**, and **Non-Stationarity** are irreconcilable.  
  - **Sacrifice Specificity**: With small n (e.g., n=11 empires), narrow classes (e.g., "maritime trading empires") have too few data points. Use broader classes ("sovereign states") and *model heterogeneity* via covariates (e.g., "trade dependency" as a predictor in survival regression).  
  - *Why this corner?* Small n and non-stationarity are fundamental constraints; specificity is adjustable via structured modeling.

  ---

  ### The Killer Requirement
  **#1 (Pre-Specified Outcome/Unit Definition)** does the most damage to common practice.  
  - *Bodies counted*:  
    1. The "250-year empire" trope (undefended endpoints).  
    2. "Papacy as Roman Empire" arguments (fuzzy unit boundaries).  
    3. Any comparison where "death" is retrofitted (e.g., "Soviet Union lasted 69 years" ignoring continuity in Russian state institutions).  
  - *Why*: It forces explicit, testable definitions before data collection. Most historical claims fail this.

  ---

  ### Method Evaluations (1 Paragraph Each)
  **(a) Naive average of dead lifespans**  
  Fails #3 (censoring), #6 (ignores overlapping classes), and #5 (no stationarity test). Biased low (excludes survivors), vulnerable to outlier deaths. Corpses: High.  

  **(b) Survival analysis with censoring**  
  Satisfies #3 and #1 (if pre-defined). Fails #6 (single-class focus) and struggles with #4 (non-stationarity requires manual adjustment). Better but still brittle for small n. Corpses: Medium.  

  **(c) Hierarchical Bayesian model**  
  Best for #5 (pooling classes) and #1. Handles #3 naturally. Requires priors for non-stationarity (#4), feasible on a laptop (#7). Weakness: Complex specification risks violating #2 (pre-registration). Corpses: Low.  

  **(d) Crowd median with self-selected classes**  
  Fails #1, #2, #3, #6. Embodies anchoring bias and motivated reasoning. "Median" hides disagreement on definitions. Corpses: Highest.  

  ---

  ### Final Corner to Cut
  **Sacrifice specificity** for hierarchical modeling. With small n and possible non-stationarity, broad classes with covariate adjustments (#5) are your least-worst option. Pre-define outcomes (#1), pre-register covariates (#2), use Bayesian survival models (#c) to pool weak signals.
