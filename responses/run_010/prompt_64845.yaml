  - Explicitly ask what vanishes if anonymity is dropped (unequal weights remain possible)
  - Ex ante/ex post contrast needs to highlight:
    • Ex ante: observer rationality required upfront
    • Ex post: needs state-dependent utilities + probabilistic sophistication
    • Hammond consistency point: observer must align with individuals' probability assessments

  For Part B, the normative cruxes need surgical precision. Key targets:
  - Distinguishing social preference from moral ranking
  - Well-being vs. extended preferences (and aggregation coherence)
  - Anonymity as source of equality
  - Probability agreement requirement
  - Fixed-population limitation

  Marking scheme should punish:
  • "Rationality alone" claims
  • Conflating aggregation with veil-of-ignorance
  • Prioritarianism dismissal/embrace without engaging utility normalization
  • Utility monster/repugnant conclusion red herrings
  • Misdiagnosing interpersonal comparability

  A-grade answers will:
  - Cleanly derive with highlighted dependencies
  - Isolate normative premises without digression
  - Avoid listed misconceptions
  - Show awareness of probability agreement tension
  - Note fixed-population constraints

  B-grade might miss one crux or contain one conceptual error. Model answer should demonstrate economical derivation and targeted critique. 

  The user's frustration with superficial takes is palpable - this exam should feel like an ice bath for rationalist sloganeering while remaining philosophically rigorous. I'll avoid citation traps and ensure all necessary context is in the stem.
answer: |-
  Here’s a self-contained, two-part exam question targeting the core misunderstandings while rewarding deep engagement. The model answer (at the end) explicitly addresses your requested cruxes and common errors.

  ---

  **Exam Question (Total: 25 marks)**  
  *Answer all parts. Assume a fixed finite population \(I = \{1, 2, ..., n\}\), a finite set of basic prospects \(X\), and lotteries \(L\) over \(X\). Each individual \(i \in I\) and a "social observer" have a preference ordering \(\succsim_i\) and \(\succsim_S\) over \(L\) satisfying the von Neumann-Morgenstern (vNM) expected utility axioms. Thus, each is represented by a vNM utility function: \(u_i : X \to \mathbb{R}\) for individuals, unique up to positive affine transformation (PAT), and \(U_S : L \to \mathbb{R}\) for the observer, also unique up to PAT.*

  ### Part A (10 marks)
  1. Precisely define **Pareto Indifference** (PI) and **Anonymity** (A) for the social observer’s preferences.  
  2. Show that if \(\succsim_S\) satisfies PI, then there exist weights \(a_i > 0\) and individual utilities \(u_i\) (normalized such that \(U_S(L) = \sum_{i} a_i \mathbb{E}[u_i|L]\) for all lotteries \(L\). Explain why the weights \(a_i\) are unique only up to a common positive scalar multiple.  
  3. Show that adding A implies \(a_i = a_j\) for all \(i,j\). What specific step fails without A?  
  4. Contrast the **ex ante** and **ex post** Pareto approaches:  
     - What additional structure (beyond PI) does each require to derive a linear aggregation *without assuming \(\succsim_S\) is EU-rational*?  
     - Why can these approaches disagree? What condition (per Hammond) ensures their consistency?  

  ### Part B (15 marks)  
  Harsanyi’s theorem is a *representation theorem*: it shows that certain axioms imply the observer’s preferences must take a weighted utilitarian form. **Diagnose where normative commitments enter to turn this into an argument for utilitarianism as a moral view.** Specifically:  
  - Explain why the theorem does **not** show "utilitarianism follows from rationality alone."  
  - Identify which premises or interpretations are needed to bridge the gap, focusing on **at least four** of these:  
    (i) The status of \(\succsim_S\) as *the moral ranking*;  
    (ii) What \(u_i\) represents (e.g., well-being vs. "extended preferences");  
    (iii) The role of Anonymity in delivering "equal consideration";  
    (iv) The necessity and normative status of probability agreement across individuals;  
    (v) The implications of a fixed population.  
  Avoid discussing variable populations, utility monsters, or the repugnant conclusion.  

  ---

  **Marking Scheme**  
  **Part A (10 marks):**  
  - A1: PI and A definitions (1 mark each). PI: If all \(i\) indifferent between \(L, L'\), then \(L \sim_S L'\). A: Permuting individual utilities leaves social utility unchanged.  
  - A2: Derivation (3 marks).  
    *Key steps*: PI \(\Rightarrow\) \(U_S = F(\mathbb{E}[u_1], ..., \mathbb{E}[u_n])\) for some \(F\). EU rationality of \(\succsim_S\) \(\Rightarrow\) \(F\) linear (via response to probability mixtures). PAT non-uniqueness \(\Rightarrow\) weights unique only up to scale.  
  - A3: Anonymity forces equal \(a_i\) (1 mark). Without A, weights can differ arbitrarily (1 mark).  
  - A4: Ex ante needs \(\succsim_S\) EU-rational (1 mark). Ex post needs state-dependent utilities and probabilistic sophistication (1 mark). They disagree under conflicting risk attitudes or belief disagreement (1 mark). Hammond consistency: Observer assigns probabilities matching individuals’ beliefs (1 mark).  

  **Part B (15 marks):**  
  *Allocate 3 marks for each of five key insights (15 total).*  
  1. **Social ≠ Moral (3 marks):** Distinguish \(\succsim_S\) (a preference) from *moral validity*. Observer could be self-interested or irrational morally.  
  2. **What is \(u_i\)? (3 marks):** \(u_i\) reflects *extended preferences* under vNM. Summing these isn’t well-being aggregation unless preferences align with welfare. Normative leap: equating utility with welfare.  
  3. **Anonymity = Equality (3 marks):** Equal weights come *only* from A, not rationality/PI. Without A, elitism is compatible. Rationality alone permits arbitrary weights.  
  4. **Probability Agreement (3 marks):** Ex post Pareto under belief heterogeneity requires observer to accept all individuals’ beliefs simultaneously → impossible without consensus. EU rationality + ex post PI *forces* probability agreement (Seidenfeld et al.).  
  5. **Fixed Population (3 marks):** Theorem silent on creation/destruction of persons, distributive justice beyond Pareto (e.g., prioritarianism), and non-Pareto improvements.  

  **Deductions (apply in both parts):**  
  - **-2 marks each:** Claiming "rationality alone suffices"; conflating Aggregation Theorem with Veil of Ignorance; invoking utility monsters/repugnant conclusion; dismissing prioritarianism via theorem (ignores normalization of \(u_i\)); asserting theorem "begs" interpersonal comparability (it constructs it from preferences + anonymity).  
  - **-1 mark:** Vague appeals to "controversial axioms" without specifying which/how.  

  **Grading Standard:**  
  - **A (21–25 marks):** Flawless Part A derivation; isolates ≥4 normative cruxes in Part B *without committing listed errors*; acknowledges probability agreement as implicit premise; notes that prioritarianism is compatible if \(u_i\) is a transformation of welfare.  
  - **B (16–20 marks):** Minor Part A errors (e.g., incomplete uniqueness); identifies 3–4 cruxes but misses probability agreement or misstates anonymity’s role; commits one listed error (-2) but recovers.  

  ---

  **Model Answer (≈900 words)**  
  **Part A:**  
  1. **Pareto Indifference (PI):** If \(L \sim_i L'\) for all \(i \in I\), then \(L \sim_S L'\).  
     **Anonymity (A):** Let \(\sigma\) be a permutation of \(I\). If lottery \(L'\) is such that \(u_i(L) = u_{\sigma(i)}(L')\) for all \(i\), then \(L \sim_S L'\).  

  2. **Derivation under PI:**  
     - By PI, if two lotteries give each individual the same expected utility, they are socially indifferent. Thus, \(U_S(L)\) depends only on the vector \((\mathbb{E}[u_1|L], \dots, \mathbb{E}[u_n|L])\), so \(U_S(L) = F(\mathbb{E}[u_1|L], \dots, \mathbb{E}[u_n|L])\) for some \(F\).  
     - Since \(\succsim_S\) satisfies EU axioms, it is linear in probabilities: \(U_S(\alpha L + (1-\alpha)L') = \alpha U_S(L) + (1-\alpha)U_S(L')\).  
     - Consider two lotteries \(L, L'\) and a mixture \(\alpha L + (1-\alpha)L'\). Linearity requires:  
       \[
       F(\alpha \mathbf{E_u}(L) + (1-\alpha)\mathbf{E_u}(L')) = \alpha F(\mathbf{E_u}(L)) + (1-\alpha)F(\mathbf{E_u}(L'))
       \]  
       where \(\mathbf{E_u}(L) = (\mathbb{E}[u_1|L], \dots, \mathbb{E}[u_n|L])\). This implies \(F\) is linear: \(F(\mathbf{x}) = \sum_{i=1}^n a_i x_i\). Thus, \(U_S(L) = \sum_{i} a_i \mathbb{E}[u_i|L]\).  
     - PAT non-uniqueness: If we transform \(u_i \to bu_i + c\), we can set \(a_i' = a_i / b\) and adjust \(U_S\) to maintain the sum. Weights scale together, so ratios \(a_i/a_j\) are fixed, but absolute values are not.  

  3. **Role of Anonymity:**  
     - A implies that permuting utilities doesn’t change \(U_S\), so \(F(\mathbf{x}) = F(\mathbf{x}_{\sigma})\). For linear \(F\), this forces \(a_i = a_j\) for all \(i,j\).  
     - Without A, PI and EU rationality still imply \(U_S = \sum a_i \mathbb{E}[u_i]\), but weights can differ (e.g., \(a_1 = 10, a_2 = 1\) is compatible). Anonymity is necessary for equality.  

  4. **Ex ante vs. Ex post:**  
     - **Ex ante:** Requires assuming \(\succsim_S\) is EU-rational *ab initio*. Derives linear aggregation directly.  
     - **Ex post:** Assumes only PI over *state-dependent outcomes* (not lotteries). Requires social preferences to satisfy "probabilistic sophistication" (e.g., Savage axioms) to derive EU form.  
     - **Disagreement:** Ex ante respects individuals’ risk attitudes; ex post requires aggregating risk preferences. They conflict if individuals disagree on probabilities or have heterogeneous risk aversion.  
     - **Hammond Consistency:** For ex ante and ex post to align, the observer must assign probabilities that match each individual’s beliefs *and* accept their risk attitudes → requires homogeneous beliefs.  

  **Part B:**  
  The theorem shows that PI + EU rationality (+ A) imply the observer uses a (weighted) sum of expected utilities. **This does not entail utilitarianism normatively:**  

  (i) **Social ≠ Moral:** \(\succsim_S\) is *defined* as a preference ordering. Nothing identifies it as *morally authoritative*. It could represent a dictator’s whims. Rationality axioms constrain coherence, not moral content.  

  (ii) **What is summed?** The \(u_i\) are vNM utilities reflecting *individual i’s extended preferences* over being in others’ situations. Aggregating these sums preferences *about* others, not welfare. For example, if Alice prefers Bob suffer, her \(u_i\) counts this. Utilitarianism requires that \(u_i\) measures *well-being*, and that summing well-being is morally salient—neither is in the theorem.  

  (iii) **Anonymity imposes equality:** EU rationality + PI *alone* permit arbitrary positive weights. Only A forces equality. Rationality does not imply impartiality; A is an independent moral premise.  

  (iv) **Probability agreement:** Ex post PI demands that if all individuals are *ex post* indifferent (in every state), the observer is indifferent. But individuals may disagree on probabilities. If the observer respects ex post PI *and* has EU preferences, they must assign probabilities compatible with *all* individuals’ beliefs—impossible without consensus. Thus, applying the theorem under belief heterogeneity implicitly assumes probability agreement, a substantive (often unrealistic) normative premise.  

  (v) **Fixed population:** The theorem assumes a fixed set of persons. It cannot address:  
  - Whether to add new people (repugnant conclusion)  
  - Distribution-sensitivity (e.g., prioritarianism), since rescaling \(u_i \to \varphi(u_i)\) is compatible if weights adjust, provided \(\varphi\) is PAT.  
  - Trade-offs violating Pareto (e.g., helping the worse off at the expense of the better off).  

  **Conclusion:** Normative work enters in: (1) interpreting \(\succsim_S\) as moral; (2) equating \(u_i\) with well-being; (3) accepting anonymity for equality; (4) assuming probability agreement; (5) ignoring variable populations and non-Pareto judgments. The theorem transforms *preferences* into a *form*, not rationality into morality.  

  ---

  **Notes on Design Choices:**  
  1. **Crux Accuracy:**  
     - Included your five cruxes. Added probability agreement as critical (it’s often overlooked).  
     - Prioritarianism: Addressed in (v) — theorem doesn’t refute it, as \(u_i\) could be a concave transform of welfare.  
  2. **Common Errors Targeted:**  
     - "Rationality alone" fails as PI, A, probability agreement, and moral interpretation are extra.  
     - Veil of Ignorance isn’t mentioned, preventing conflation.  
     - Utility monsters/repugnant conclusion excluded per instructions.  
     - Interpersonal comparability: Theorem constructs it from preferences + anonymity, so it doesn’t "beg" the question.  
  3. **Clarity:**  
     - Part A stem provides all formal setup.  
     - Model answer derives the theorem explicitly in ~200 words.  
     - Part B forces engagement with normative leaps via focused prompts.  

  This should reliably separate students who grasp the machinery and its normative gaps from those reciting slogans.
