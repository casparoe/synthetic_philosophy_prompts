answer: |-
  ### Essay Question (as printed on exam paper)  
  **Time Allowed: 45 minutes**  
  **Total Marks: 25**  

  ---

  **CASE STUDY:**  
  *Lab Report Excerpt (NeuralSight Labs, 2024):*  
  > "We identify a 'priority gate' mechanism in three transformer LMs: **S** (140M params), **L** (7B params), and **RL-fine-tuned R** (based on L). In S and L, the gate comprises three mid-layer attention heads (layers 8–10) with a sharp threshold response. In R, our automated search (using signature-matching via gradient-similarity metrics) identified a functionally equivalent gate: one attention head (layer 5) and a two-layer MLP (layer 11), with a graded response curve. Benchmark accuracy for continuation tasks is identical (±0.3%). However, ablating the identified components causes a 9.4% performance drop in L but only 1.2% in R. We attribute this to compensatory redundancy in R (e.g., an undetected backup gate). Thus, the *same mechanism* exists across all models, albeit with implementation differences. This justifies deploying our detector to flag 'anomalous' models where the gate is missing or structurally deformed."  

  *Critique (Anonymous Peer Review):*  
  > "The 'gate' in R is distinct. The search algorithm matches intervention signatures but is invariant to component relabelling and structure. The minimal ablation effect in R suggests distributed computation, not a discrete gate. NeuralSight’s 'backup gate' is ad hoc. Their detector cannot identify 'deformation' because their search defines what counts as the gate, making anomalies self-validating."  

  **QUESTION:**  
  Assess whether NeuralSight is justified in claiming the *same mechanism* (the priority gate) exists in L and R. In your response:  
  1. State explicit identity conditions for mechanisms that underpin your assessment.  
  2. Identify which criterion (causal organisation, functional role, intervention signature, etc.) NeuralSight relies on, and whether this commits them to the critic’s objections.  
  3. Evaluate whether positing a "backup gate" in R legitimately saves the identity claim or is ad hoc.  
  4. Argue whether this dispute is primarily factual (about what exists) or perspectival (a choice of decomposition grain).  
  5. Conclude whether NeuralSight’s anomaly detector can meaningfully identify "deformed" gates without self-validation.  

  ---

  ### Model Answer (689 words)  
  **Position:** NeuralSight’s claim is unsupported; the dispute is primarily perspectival, and their detector risks self-validation.  

  **(1) Identity Conditions**  
  Mechanism identity requires *causal-structural equivalence*: same components, activities, and topological organisation (Craver 2007). Competing criteria include:  
  - *Functional role*: Same input-output behaviour.  
  - *Intervention signature*: Similar responses to perturbations (NeuralSight’s metric).  
  - *Multiple realisability*: Different substrates fulfilling identical functions.  
  The critic implicitly requires structural fidelity; NeuralSight prioritises functional and signature-based equivalence.  

  **(2) NeuralSight’s Criterion & Vulnerabilities**  
  NeuralSight relies on **intervention signature invariance** (output similarity under component perturbations) and **functional equivalence** (benchmark preservation). Their search algorithm is explicitly signature-driven and structure-agnostic. This commits them to two objections:  
  - **Grain sensitivity**: Their decomposition of R (one head + MLP) is arbitrary. The critic rightly notes signature-matching cannot distinguish between *genuine mechanism preservation* and *coincidental signature mimicry* by a different causal structure (e.g., distributed computations). The low ablation effect in R empirically supports the critic: if the "gate" were indispensable, ablating it should disrupt function substantially.  
  - **Multiple realisability loophole**: By accepting radically different structures (discrete heads vs. head+MLP), NeuralSight stretches identity beyond Craver’s mutual manipulability. If *any* functionally equivalent structure counts as the "same" mechanism, anomaly detection collapses—every model could contain *some* gate-like structure under coarse descriptions.  

  **(3) The "Backup Gate" Move: Ad Hoc or Licensed?**  
  NeuralSight invokes a "backup gate" to explain R’s resilience to ablation. This is **ad hoc** without evidence. To avoid being ad hoc, compensatory mechanisms must be:  
  - Independently detectable (e.g., via ablation cascades or activation clustering).  
  - Theoretically grounded (e.g., redundancy predicted by RL fine-tuning).  
  NeuralSight provides neither. The critic’s distributed-process hypothesis better fits the 1.2% ablation loss. Positing undetected entities to preserve identity undermines empirical accountability.  

  **(4) Factual Dispute or Perspectival Choice?**  
  The disagreement is **perspectival**, not purely factual. It stems from divergent *grain choices* for decomposition:  
  - NeuralSight uses coarse-grained, functional signatures.  
  - The critic demands fine-grained structural correspondence.  
  Neither is objectively "correct": the same system admits multiple mechanistic decompositions (Machamer et al. 2000). However, NeuralSight’s choice *matters pragmatically*: their coarse grain licenses deploying detectors without resolving structural variance, but at the cost of empirical vulnerability (e.g., the ablation anomaly).  

  **(5) Anomaly Detector Self-Validation**  
  The detector **cannot escape self-validation**. It defines the "priority gate" as *whatever matches the search algorithm’s signature profile*. Thus:  
  - A "deformed gate" can only mean "signature divergence from S/L’s structure".  
  - But since the search is structure-invariant, it can always *find* a signature match in any model (as in R), rendering "absence" impossible to detect. The detector flags deviations only if the algorithm *fails* to find a match—but its success is guaranteed by design. This circularity conflates *detection* with *definition**. Meaningful anomaly detection requires identity criteria independent of the tool (e.g., structural constraints), which NeuralSight lacks.  

  **Conclusion**: NeuralSight’s claim fails. Functional/signature equivalence is insufficient for mechanism identity without structural accountability. Their detector is self-validating because its search procedure operationalizes—rather than discovers—the gate.  

  ---  

  ### Marking Scheme (Total: 25 marks)  
  | **Must-Hit Moves**                     | **Marks** | **Common Pitfalls** |  
  |----------------------------------------|-----------|---------------------|  
  | **1. States identity conditions**      | 4         | Vague definitions (e.g., "same function"); omits structural criteria. |  
  | **2. Identifies NeuralSight’s criterion & vulnerabilities** | 5 | Misattributing criteria (e.g., claiming lab uses causal structure); ignoring signature-matching’s blindness to component relabelling. |  
  | **3. Evaluates "backup gate" legitimacy** | 4         | Unqualified claims ("always ad hoc" or "always valid"); no distinction between licensed/ad hoc compensatory mechanisms. |  
  | **4. Diagnoses dispute as (non)-factual** | 5         | Oversimplifying (e.g., "just factual"); not linking grain-sensitivity to the lab/critic split. |  
  | **5. Assesses detector self-validation** | 5         | Missing the circularity (search defines gate → anomalies are search failures); no link to decompositional choice. |  
  | **6. Overall coherence & argument**    | 2         | Contradictions; unresolved tensions; lack of position. |  

  **First-Class (70+%) vs. Solid 2:1 (60-69%) Differentiation**:  
  - **2:1**: Correctly identifies *that* grain-sensitivity and self-validation are problems.  
  - **First**: **Shows how** these problems manifest *in the case* (e.g., "Signature-matching’s relabelling-invariance allows R’s MLP to ‘count’ as the gate despite no structural homology with L’s heads, exposing grain-relativity"). Links mechanistic philosophy to detector design (e.g., "Craver’s mutual manipulability is violated when ablation effects diverge").
