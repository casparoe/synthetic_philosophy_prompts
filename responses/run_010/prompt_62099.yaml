prompt: |-
  For several years I have allocated a fixed annual giving budget — and a modest amount of my own working time — under something like the evidential standards associated with effective altruism, while remaining substantially persuaded by the standard criticisms of those standards: that requiring strong evidence systematically favors whatever happens to have been measured, and that the same methodology which surfaces tractable wins also filters out the political and structural causes of the problems being treated. I am not asking for a defense or a refutation of effective altruism. I want to know whether my own case-by-case verdicts add up to a principle, and if they do not, which of them I should abandon.

  Here they are, stated as concretely as I can.

  1. A program distributing a well-studied preventive health commodity, with a cost-per-death-averted figure I trust to within a factor of two, versus a campaign to persuade one national ministry to adopt a clinical protocol whose adoption would, on my own estimate, do perhaps thirty times as much good, but whose probability of success and whose attribution I cannot estimate within an order of magnitude. I fund the first. I think this is the right call and simultaneously think it is partly an artifact of what has been studied.

  2. The same campaign, now run by a group that has pre-registered its theory of change, published its forecasts with their calibration record, and submitted to third-party audit of its attribution reasoning. I fund this one, and more generously than case 1. Nothing about the intervention itself changed.

  3. An education program whose outcome is captured by test scores, versus a transfer program whose outcome includes the absence of a documented humiliating procedure — queuing, means-testing, public verification of poverty. I believe the second produces more of what actually matters per unit of money and that I cannot measure it. I still do not fund it. I think my refusal is defensible but not clearly correct.

  4. On earning to give: a friend who takes a lucrative trading position that would otherwise have gone to someone who would have donated nothing, and who donates forty percent of it — clearly creditworthy. The same friend taking a staff role at an assistance organization that would otherwise have gone to someone equally competent and equally committed — no credit, and perhaps a small negative. And a third version: the role is in a fast-growing research area, the seat would have gone to someone equally committed, but my friend is meaningfully better at the work — I award credit here, which I recognize sits badly with the second version.

  5. I give to a municipal food pantry with essentially no evidence about its effects and feel no tension about it; I would refuse a global health program of exactly the same evidential standing. The difference in scale between them is enormous, and yet both verdicts feel right to me.

  6. A program with a strong trial whose measured effect decayed to nothing within four years of the trial's end, versus a program with a weak trial whose gains appear durable. I prefer the durable one, even though the evidence for it is worse. So it is not evidential strength as such that I am tracking.

  7. An intervention against loneliness among elderly people, evaluated in life-satisfaction reports, where I know the instrument partly records recalibrated expectations rather than change in condition. I have gone back and forth on this one for a year.

  8. I think it is good to fund the study of an intervention that has not been measured — but only where the intervention is already independently plausible, and I cannot state what "plausible" means here without circularity.

  Is there a principle, ideally separable into a rule for ranking options and a rule for setting the evidential threshold, that delivers all or most of these verdicts? Please state it precisely, indicate which case motivates each of its clauses, and tell me what it implies for questions I have not listed — in particular whether some share of a budget should go to reducing one's own ignorance rather than to acting on the ignorance one has, and whether the principle licenses a two-tier allocation in which unmeasurable goods receive a smaller but protected share. Then tell me plainly which of the eight it cannot accommodate, and press hardest on 4 and 7, the two I keep reopening. If you need a technical term, define it where you use it; do not send me citations or a reading list.
reasoning: |-
  Okay, the user presents a complex dilemma about reconciling their charitable giving decisions with effective altruism principles. They've listed eight specific cases where their actions seem contradictory, and want to know if there's an underlying principle guiding them. 

  First, I notice the user is clearly sophisticated - they understand concepts like pre-registered theories of change, calibration records, and attribution reasoning. They're not new to effective altruism discourse but have been wrestling with its limitations for years. The frustration comes through in phrases like "partly an artifact of what has been studied" and "cannot state what plausible means without circularity."

  The core tension seems to be between three things: evidential strength (EA's focus), durability/importance of outcomes (their values), and measurability (their skepticism). In case 1 they choose measurable health interventions over potentially more impactful policy work, yet in case 3 they reject unmeasurable poverty programs despite believing they're better. That's the paradox they want resolved.

  Hmm... their examples reveal several consistent patterns though. They consistently reward transparency (case 2), prefer durable outcomes (case 6), and make exceptions for local giving (case 5). The earning-to-give cases (4) are particularly thorny - they intuitively understand counterfactual impact but struggle to systematize it.

  For principle-building, I should probably start by categorizing their implicit criteria:
  - Transparency boosts credibility (cases 2, 8)
  - Scale matters but isn't absolute (case 5)
  - Durability > short-term gains (case 6)
  - Counterfactual impact defines credit (case 4)
  - Personal connection lowers evidence bar (case 5)

  The loneliness case (7) is interesting - they're stuck on whether subjective reports reflect real welfare. That suggests they need a framework for dealing with imperfect proxies. Maybe distinguish between "observed outcomes" and "inferred welfare"?

  For case 4, the key might be separating role types: trading jobs create new resources for charity, while NGO staff roles usually just redirect existing talent. The exception is when the person brings unique skills (case 4c) - that's actual value creation.

  The user's last question about allocating funds to reduce ignorance is crucial. Their case 8 shows they already fund some exploratory work, but struggle with defining "plausible." Perhaps a Bayesian approach would help - fund investigations that could substantially update priors.

  ...after mapping all this, I think their principle centers on "actionable confidence" - a combination of evidence quality and actionability of outcomes. Will draft it with clear clauses linking to each case.
answer: |-
  Your judgments reveal a coherent principle balancing **actionability**, **welfare significance**, and **confidence**—not pure evidential strength. The core idea: **Allocate resources to maximize expected welfare subject to tractable uncertainty reduction, while reserving space for morally urgent but unmeasurable goods.** Here's the principle decomposed:

  ### Rule for Ranking Options (Expected Welfare-Adjusted Impact)
  Rank by:  
  **EWAI(A) = [Estimated Welfare Significance × Durability × Counterfactual Effectiveness] × [Actionable Confidence]**  
  Where:  
  - **Welfare Significance**: Value of outcome per beneficiary (e.g., avoiding humiliation > test scores; Case 3).  
  - **Durability**: Time horizon of benefits (Case 6).  
  - **Counterfactual Effectiveness**: Your contribution’s unique causal role (Case 4: + for trading job, 0 for staff swap, + for uniquely skilled researcher).  
  - **Actionable Confidence**: Credibly quantified probability of success (Case 1 vs. 2; Case 5 local vs. global).  

  ### Rule for Evidential Threshold (Tiered Uncertainty Gates)
  - **Tier 1 (High Confidence)**: Mandatory for large-scale/global interventions. Requires pre-registered forecasts, calibration records, or RCTs with proven durability (Cases 1, 2, 6).  
  - **Tier 2 (Protected Low-Confidence)**: Permitted for local/small-scale efforts, morally urgent unmeasurables (e.g., dignity), or novel plausibility probes (Cases 3, 5, 7, 8).  
  - **Threshold**: Shift resources to Tier 2 only if Welfare Significance × Scale > 10× Tier 1 option *or* Tier 1 options are exhausted.  

  ---

  ### How It Delivers Your Verdicts
  - **Case 1**: Actionable Confidence low for policy campaign → Tier 1 threshold not met.  
  - **Case 2**: Transparency boosts Actionable Confidence → Meets Tier 1 threshold.  
  - **Case 3**: Welfare Significance higher (dignity > test scores), but low Actionable Confidence → Tier 2 allocation permitted but not prioritized.  
  - **Case 4**: Credit only when Counterfactual Effectiveness >0 (trading job creates new funds; unique researcher adds marginal skill). Staff role swap has ~0 counterfactual gain.  
  - **Case 5**: Local scale lowers evidence bar (Tier 2 acceptable); global scale requires Tier 1 rigor.  
  - **Case 6**: Durability multiplier outweighs weaker evidence.  
  - **Case 7**: Permits Tier 2 funding if loneliness reduction is deemed morally urgent despite measurement noise.  
  - **Case 8**: "Plausible" = high Welfare Significance × theoretical coherence. Tier 2 funds acceptable for exploration.  

  ---

  ### Implications for Unlisted Questions
  1. **Reducing Ignorance**: Allocate ≤10% of budget to Tier 2 "plausibility probes" (Case 8) targeting high Welfare Significance gaps. *Example*: Funding a study on humiliation-reduction in transfers.  
  2. **Two-Tier Allocation**: Required. Protect 5–15% for Tier 2 (local/urgent/unmeasurable), but require annual review of plausibility.  
  3. **Proxy Metrics**: Accept imperfect measures (e.g., loneliness surveys) if they correlate with Welfare Significance and no better alternative exists (Case 7).  

  ---

  ### Where It Clashes and Presses Hardest
  - **Case 4 (Staff Role)**: Your "negative credit" stance is rejected. The principle assigns *neutral* credit if your friend is interchangeable (Counterfactual Effectiveness ≈0). Negative credit only if they *reduce* expected welfare (e.g., unqualified hire). *Your unique-skills variant* is correct: credit scales with marginal skill advantage.  
  - **Case 7 (Loneliness)**: **Stop reopening this.** The principle says: Fund it if (a) loneliness reduction has high Welfare Significance *to you*, and (b) you allocate it to Tier 2 (protected but capped). Accept that "recalibrated expectations" still constitute welfare if they reduce suffering.  

  ### The One Inconsistency
  - **Case 3 (Transfers vs. Education)**: Your refusal is inconsistent if Welfare Significance is truly "30× higher." Under this principle, *if* humiliation-avoidance is sufficiently welfare-significant, it should receive Tier 2 funding. **Revise either:**  
    — Your belief in its superiority (maybe test scores proxy long-term welfare better than you think?), **or**  
    — Your action (fund it as a Tier 2 priority).  

  ---

  ### Final Principle Statement
  > **Maximize welfare under actionable uncertainty** by:  
  > (1) Prioritizing interventions with *credibly quantified*, *durable*, *counterfactual* high-impact (Tier 1).  
  > (2) Allocating a tiered minority (5–15%) to urgent/unmeasurable goods with high *welfare significance* (Tier 2).  
  > (3) Demanding transparency to convert Tier 2 candidates to Tier 1.  
  >  
  > **Key Tradeoff**: You sacrifice marginal measurable gains to avoid systematic exclusion of dignity/structural change. Case 3 is your warning signal: if unmeasurable goods *always* lose, the principle fails. Revisit Tier 2’s share.
