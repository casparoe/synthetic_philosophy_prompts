answer: |-
  Below is a point-by-point response to your draft and queries. I've stress-tested your arguments, challenged weak joints, and flagged issues with maximum bluntness as requested. No citations, no padding—just direct engagement with your claims.

  ---

  ### 1. Stress-testing the unbundling  
  **The weakest joint is indeed between (ii) and (iii).** Your defense of (ii) as inevitable is strong, but it *does* risk smuggling in (iii) Directionality. If selection is inherently backward-running, the historian’s chosen endpoint (e.g., "the present") implicitly frames the past as a *prelude* to that endpoint. Even if you avoid claiming inevitability, the narrative structure can’t escape implying a trajectory. For example:  
  - A history of genetics selecting threads leading to DNA *feels* directional because non-selected threads (e.g., Lamarckism) are marginalized. The "heap of contingencies" is organized into a causal sequence by the endpoint.  
  **Counter-solution:** You can salvage the distinction by insisting that (ii) is *descriptive* (we *must* select from the present’s vantage) while (iii) is *prescriptive* (we *must not* let selection imply purpose). But this relies on readerly discipline that may not exist.  
  **To cleanly separate all four:** Take the Luddites. A historian could:  
  - (ii) Select them as ancestors of anti-automation movements (backward selection)  
  - Without (i) Condemning them as "backward" (no anachronistic evaluation)  
  - Without (iii) Framing their defeat as inevitable (emphasize contingent factors like state repression)  
  - Without (iv) Claiming industrialization was progress (call it a trade-off).  
  This works—but only if the narrative actively undermines directionality.  

  ---

  ### 2. Asymmetric charity and the evaluation/imputation distinction  
  **Your distinction collapses under contextualist pressure.** Distinguishing "evaluating past actions by later standards" (allowed) vs. "imputing culpability for failing them" (forbidden) assumes moral facts exist independently of recognition. A contextualist would argue:  
  - *All* evaluation requires *our* framework. Calling a humoral physician "wrong" about disease etiology (even by *their* standards) still privileges *our* epistemology. We know they asked "does it cure?" but we answer with *our* tools (RCTs, germ theory). Your "responsive to their standard" is a sleight of hand—it’s *our* judgment of what their standard *meant*.  
  **Strongest reply:** "You claim to avoid anachronism by using ‘their standards,’ but your evaluation is still a *present* act of interpretation. Calling them ‘wrong’ implies a transhistorical truth (e.g., ‘disease has real causes’). If we reject that metaphysics, your distinction vanishes. Charity requires suspending *all* evaluation, not just culpability."  
  **Your move survives only if** you defend moral/epistemic realism (which you haven’t). Without that, the contextualist rule stands.  

  ---

  ### 3. The disclaimer function: Speculative but fixable  
  **Cut the insinuation; keep the core.** Your claim that teleological narratives persist under anti-whig disclaimers is perceptive but phrased as an accusation ("cover"). Restate it as a *structural critique*:  
  > "The ritual condemnation of teleology functions as a *narrative license*: by disavowing directionality in the abstract, historians render its concrete presence in their framing (chapter order, causal emphasis, climax) immune to criticism. The disclaimer absorbs scrutiny that should be directed at the text’s architecture."  
  **This is arguable because** it’s testable: Analyze monographs that preface with "I reject whiggishness!" yet structure events as inevitable march toward outcome X. The point isn’t about intent but *rhetorical effect*.  

  ---

  ### 4. Factual/Textual Corrections  
  - **Butterfield:** Your paraphrase is fair but slightly overstates. He *does* attack directionality ("abridgement"), but his primary target was *moral judgment* (your i/iii blend). He’d likely agree your (i) and (iii) are intertwined.  
  - **Progressivism (iv):** You call it "not methodological," but many anti-whigs treat it as one (e.g., equating "progress" with whiggish teleology). Correct, but clarify that conflation *is* the error.  
  - **Ancestral selection (ii):** Your claim that records are "winners’ archives" is overstated. Subaltern studies, microhistory, and archaeology reconstruct "losers’" perspectives. Selection is inevitable, but sources aren’t *wholly* determined by victors.  

  ---

  ### 5. Load-Bearing Section  
  **(ii) Ancestral selection is the keystone.** If your defense of backward selection as inevitable holds, the entire essay works. If it fails, the unbundling collapses into standard anti-whig handwringing. Granting (ii) forces critics to engage your distinctions.  

  ---

  ### 6. Novelty Assessment  
  **It’s 30% familiar, 70% argument.** Observing that anti-whiggery can become its own orthodoxy isn’t new. *But* your unbundling is original:  
  - **New:** Treating (ii) as inevitable reframes the debate.  
  - **New:** Showing how bundling (iv) with (iii) silences valid progress claims.  
  - **Familiar:** Inverse whiggery is noted by critics like Quentin Skinner.  
  **Worth keeping:** The fourfold taxonomy. If you publish nothing else, this schema clarifies muddy debates. Ditch inverse whiggery (it’s garnish).  

  ---

  ### 7. Test Case Recommendation  
  **Use abandoned scientific theories (e.g., phlogiston).** It best *tests* your framework:  
  - Did later chemists *select* phlogistonists as ancestors (ii)? Yes (e.g., as steps toward oxygen).  
  - Did they imply *directionality* (iii)? Often (framed as "overcoming error").  
  - But was it *progress* (iv)? Sometimes (modern chemistry works), but not teleologically necessary.  
  - *Crucially:* You can show how attacking "whiggish" narratives here often conflates (iv) with (iii), silencing valid claims that later theories *were* better. Forces engagement with your distinctions.  
  **Luddites** are too politicized; **interwar Europe** risks narrative determinism. Science offers cleaner causality.  

  ---

  ### 8. Inverse Whiggery: Rhetoric or Claim?  
  **It’s rhetorical as phrased.** To make it a claim:  
  - **Diagnose, don’t accuse:** Don’t say historians "reproduce the vices." Say: "The anti-whig stance, when ritualized, risks *mirroring* whiggery’s structure: selective attention to ‘lost futures’ imposes a new directionality (decline/stasis) and verdict (triumph = corruption)."  
  - **Evidence required:** Show a historian disavowing whiggery then writing "the Middle Ages were ecologically wise; modernity is alienation." This inverts (ii), (iii), (iv) but keeps the form.  
  **Earns its place?** Only if tied to your taxonomy. Otherwise, cut it.  

  ---

  ### Overall Draft Recommendations  
  - **Strengths:** The unbundling is razor-sharp. (ii) and (iv) sections are compelling.  
  - **Weaknesses:** (i) needs a realist defense; (iii) disclaimer point needs depersonalizing.  
  - **Action:** Add the **phlogiston case** (250 words) to test distinctions. Cut inverse whiggery or reframe as diagnostic. Rebut the contextualist on (i) or concede ground.  
  - **Killer line:** *"A historian who forswears running lines backward has inherited somebody else’s."*  

  You’ve built a scaffold; now make it bear weight. If this were my draft, I’d defend (ii) relentlessly and sacrifice inverse whiggery to space.
