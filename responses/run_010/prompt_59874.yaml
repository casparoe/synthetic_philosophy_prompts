prompt: |-
  I'm giving a talk at a decision theory workshop in about six weeks and I want a prep sheet for the question period. The room is basically Savage / von Neumann-Morgenstern people — at least three have worked on the axiomatics of the independence axiom — plus two experimental economists who run repeated coin-flip lotteries on undergrads. Nobody there thinks about ergodicity and nobody plays poker for a living.

  My thesis is the strong one: you can get Kelly betting without log utility and without any ergodicity talk. The move is that in an infinitely repeated binary bet with positive edge, the Kelly fraction beats every other constant fraction almost surely along the agent's own single trajectory — the wealth ratio diverges or collapses with probability one depending on which side of Kelly you sit — so geometric optimality is a dominance result about one life, not an ensemble average, and no utility function is doing any work. So the standard "Kelly just assumes you have log utility" line is flatly wrong, and I want to say so out loud.

  Give me the seven or eight objections this audience will actually raise, in roughly the order theyll come, phrased the way a subjective expected utility person phrases things — not the way a physicist or a bookmaker would. For each: real hit or a miss, what I say in ninety seconds, what I should concede before I even get asked, and where my answer is thin. I especially want the finite-horizon objection worked through, since I suspect thats the one that does the most damage and I'd like to know whether I'm right about that. End with the question I'm dreading, the one that would make me wish I'd written a weaker paper.

  Be committed about it: actually take a position on which of these land and which don't, and say why, rather than handing me a list of considerations to weigh myself. No citations, I'll fill those in.
reasoning: |-
  Okay, let me tackle this user's request. They're prepping for a decision theory workshop and need to anticipate objections to their thesis that Kelly betting doesn't require log utility or ergodicity. The audience consists of Savage/vNM traditionalists and experimental economists. 

  First, I need to inhabit the mindset of these academics. The core tension is between the user's single-trajectory dominance claim and the standard utility-based framework. Let me brainstorm the most likely objections:

  1. **The utility objection** will probably come first - it's the most direct challenge to their "no utility" claim. The user needs to concede that Kelly is equivalent to log utility in one-shot settings but emphasize their repeated-betting context changes everything.

  2. **Finite horizons** is the killer objection. I'll make this #2 because it attacks the heart of their infinity assumption. They should admit their result breaks down for finite cases but argue the asymptotic nature still provides valuable guidance.

  3. **Independence axiom** comes next since vNM folks live and breathe this. The user must show their dominance result doesn't violate independence because it's about repeated strategies, not single choices.

  The remaining objections cascade logically: risk aversion concerns (how can dominance ignore risk preferences?), measurability issues (is their "almost surely" claim rigorous?), then finally the dreaded "why not just use log utility?" question exposing their result's practical limitations.

  For each objection, I'll structure: 
  - The precise phrasing an academic would use
  - Whether it lands (and why)
  - A concise 90-second response
  - What to preemptively concede
  - Where the argument remains thin

  The finite horizon point deserves extra attention since the user suspects it's most damaging - and they're right. I'll flag how their infinite model avoids this but at the cost of real-world applicability. The concluding "dreaded question" should highlight that their elegant math may not help practitioners choose fractions.
answer: |-
  Here’s your prep sheet for the Q&A, tailored to your audience and thesis. I’ve ordered objections by likely sequence, highlighted vulnerabilities, and flagged concessions. The finite-horizon objection is indeed your weakest point—**it lands hard**.

  ---

  ### **Objection 1: Utility Foundations**  
  *"You’re dismissing utility functions, but Kelly is mathematically equivalent to maximizing expected log wealth. Isn’t this just a hidden assumption of log utility?"*  
  **Why it lands:** Directly challenges your "no utility" claim by equating asymptotic dominance with implicit optimization.  
  **Your 90s response:**  
  > "Kelly emerges from wealth dynamics, not ex ante optimization. In repeated play, *any* risk-averse, risk-neutral, or even risk-seeking agent who bets a fixed fraction sees their wealth ratio diverge almost surely against the Kelly fraction. Log utility is sufficient but not necessary—it’s a consequence, not an axiom."  
  **Pre-emptively concede:** Kelly coincides with log utility in static choice.  
  **Where thin:** Doesn’t address why agents would *care* about long-run dominance without a utility representation.  

  ---

  ### **Objection 2: Finite Horizons**  
  *"Infinite repetition is unrealistic. For finite horizons, Kelly isn’t dominant—it can be outperformed by overbetting with high probability. Doesn’t this undermine your ‘single trajectory’ argument?"*  
  **Why it lands hardest:** Your entire dominance result depends on infinity; real agents face finite bets. Experimentalists will weaponize this.  
  **Your 90s response:**  
  > "Agreed, finite cases allow short-term overperformance. But crucially, as trials grow, the *probability* of non-Kelly strategies winning vanishes. For any fixed horizon, there exists an edge where Kelly dominates with probability approaching 1. It’s not about never trailing—it’s about almost sure convergence."  
  **Pre-emptively concede:** Finite horizons break sure dominance.  
  **Where thin:** Doesn’t specify how fast convergence occurs or handle agents with sharp time preferences.  

  ---

  ### **Objection 3: Violating Independence**  
  *"Constant fraction betting violates vNM independence. Why should rational agents constrain themselves to fixed fractions across states?"*  
  **Why it lands:** Targets axiomatic foundations your audience cherishes.  
  **Your 90s response:**  
  > "I’m not arguing for constant fractions as rational—I’m showing that *if* an agent uses *any* fixed fraction, Kelly dominates asymptotically. This is a property of the strategy space, not a rationality axiom. Independence is irrelevant to the result."  
  **Pre-emptively concede:** Constant fractions are behaviorally implausible.  
  **Where thin:** Sidesteps why agents would adopt this suboptimal class.  

  ---

  ### **Objection 4: Risk Aversion Ignored**  
  *"Your ‘dominance’ ignores risk preferences. A risk-averse agent accepts lower growth for less volatility. Why wouldn’t they underbet?"*  
  **Why it misses:** Misreads your thesis. You’re not prescribing behavior; you’re showing dominance within a class.  
  **Your 90s response:**  
  > "This result is conditional on using constant fractions—it doesn’t claim Kelly is universally optimal. But note: if an agent bets less than Kelly, they’re dominated *even if* risk-averse. Their wealth ratio still collapses to zero almost surely."  
  **Pre-emptively concede:** Rational agents may avoid constant fractions entirely.  

  ---

  ### **Objection 5: Measurability & "Almost Surely"**  
  *"‘Almost surely’ relies on a probability measure. But Savage agents don’t assume known probabilities. How does this work with subjective uncertainty?"*  
  **Why it lands:** Questions your use of objective probabilities.  
  **Your 90s response:**  
  > "Replace objective with well-calibrated subjective probabilities. For an agent who believes the bet has positive edge, the same divergence holds *conditional on their beliefs being correct*. Misspecified beliefs break any strategy."  
  **Pre-emptively concede:** Requires probabilistic beliefs.  
  **Where thin:** Doesn’t address belief updating.  

  ---

  ### **Objection 6: Non-Constant Strategies**  
  *"Why focus on constant fractions? A dynamic strategy could avoid ruin and outperform Kelly in finite time."*  
  **Why it misses:** Your thesis explicitly restricts to constant fractions.  
  **Your 90s response:**  
  > "The result isolates Kelly’s role in growth *within this specific class*. I’m not claiming it’s globally optimal—but for any constant fraction deviating from Kelly, dominance holds. Dynamic strategies are a separate question."  

  ---

  ### **Objection 7: The "Real World" Empirical Gap**  
  *"Experiments show undergrads systematically underbet relative to Kelly. If your result is so robust, why don’t we observe it?"*  
  **Why it lands:** Experimentalists will demand evidence.  
  **Your 90s response:**  
  > "Because humans aren’t constant-fraction bettors! They anchor, adjust, and fear ruin. My result says: if you *were* a constant-fraction bettor, deviating from Kelly guarantees long-run loss. It’s a theoretical bound, not a descriptive model."  
  **Pre-emptively concede:** No evidence that humans use constant fractions.  

  ---

  ### **The Dreaded Question**  
  *"If Kelly is ‘utility-free,’ why shouldn’t I just maximize expected log wealth and get the same result without infinity?"*  
  **Why it terrifies:** Exposes your result as a curiosity with no advantage over standard tools.  
  **Your 90s response:**  
  > "Because this shows Kelly isn’t *about* utility—it’s a frequentist property of wealth dynamics. For agents who reject log utility but can commit to a fraction, the dominance remains. It’s a parallel justification."  
  **Why it hurts:** Concedes that log utility is simpler for optimization. Your "strong thesis" becomes a philosophical footnote.  

  ---

  ### **Strategic Summary**  
  - **Finite horizons** are your Achilles’ heel. Lean hard on "probability → 1" arguments.  
  - **Concede early** where you must (finite cases, constant fractions as artificial).  
  - **Redirect** to core insight: "*Conditional on using constant fractions*, Kelly dominates *pathwise*."  
  - **The fatal flaw**: Your result doesn’t offer new prescriptions—it reinterprets an old one. The audience may shrug: "So what?"
