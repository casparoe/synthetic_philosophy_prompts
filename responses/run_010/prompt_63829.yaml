  - Use binary-outcome models
  - Postpone normative debates about "rational" framing

  Success would mean showing diachronic instability correlates with framing changes, not risk parameters alone. Failure would be if instability persists even when framing is fixed.

  The proposal should emphasize philosophical significance: this could redeem REU as a coherent alternative to EU by reframing the debate around representation-dependence - a challenge for all decision theories.
answer: |-
  ## Proposal: Diachronic Stability and Act Individuation in Rank-Dependent Utility Theory

  **Project Summary:** This project investigates a core objection to rank-dependent utility (RDU) theories like Lara Buchak’s Risk-Weighted Expected Utility (REU). Critics argue that RDU agents exhibit dynamic inconsistency: they plan one course of action but reverse themselves as uncertainty resolves, allegedly collapsing back into standard Expected Utility (EU) behavior under rational pressure. I challenge this diagnosis. I hypothesize that the instability stems not from RDU’s core risk-weighting mechanism, but from its *non-additivity* across sub-gambles. This makes the theory sensitive to how a decision problem is framed (act individuation). Consequently, apparent inconsistency may reflect a shift in the object of evaluation due to framing, not a flaw in RDU itself. Over ten weeks, I will formalize this hypothesis, build dynamic choice models, and test whether careful act individuation restores diachronic stability for RDU agents, potentially rehabilitating it as a genuine alternative to EU.

  **Research Question & Significance:** The central question is: **Does the diachronic instability attributed to RDU agents primarily result from (a) the inherent nature of their risk-weighting function, or (b) the non-additivity of RDU valuations making them sensitive to the framing of acts and events?** If (b) is correct, it fundamentally reshapes a major debate. The "collapse objection" (e.g., by Seidenfeld, Schervish, Kadane, or Hammond) claims RDU is self-undermining in dynamic settings. Buchak defends RDU by appealing to sophisticated choice or resolute commitment. However, both sides often assume a neutral background for individuating acts. My hypothesis suggests this background is *not* neutral for RDU. Instability arises when the agent faces a *different* decision problem after resolution (due to non-additivity), not because they irrationally abandon their initial RDU evaluation of the *same* problem. If successful, this project would show the collapse objection targets a challenge (framing-sensitivity) inherent to *any* non-separable theory, not a unique defect of RDU. It would strengthen RDU's viability as a descriptively accurate and normatively coherent alternative to EU for modeling risk aversion beyond diminishing marginal utility.

  **Why Existing Positions Don't Settle It:**
  1.  **The Collapse Argument:** Demonstrates inconsistency in *naive* applications of RDU to sequential choice. It assumes the "correct" individuation of the decision problem across time is the coarse-grained, reduced-form description. My hypothesis questions this assumption for RDU agents.
  2.  **Buchak's Replies (Sophistication/Resoluteness):** Sophisticated choice accepts future deviations, planning around them. Resoluteness insists on sticking to the initial plan's valuation. Both accept instability arises *from the risk-weighting* and try to manage it. I argue the instability might be an *artifact of description*, not inherent to the risk attitude. Sophistication/resoluteness might be unnecessary if the problem is framed correctly from the start.
  3.  **The Planning/Commitment Moves:** Focus on how agents *should* handle their future selves. My project asks a prior question: *Is the future self actually facing the same evaluation?* If non-additivity means the sequential description constitutes a different gamble, the future self isn't reneging on the *same* choice.

  **Your Secondary Hunch is Crucial (and Likely Correct):** You are right. RDU (with a non-linear weighting function `w(p)`) will *not* generally value a two-stage gamble identically to its single-stage reduced form. RDU applies the weighting function to the *cumulative* probabilities of the final outcomes *as they are presented in the chosen description*. In a sequential description, the weighting is applied step-wise: first to the branch probabilities, then to the outcome probabilities *within* a branch, using the *conditional* rank within that branch. In the reduced form, weighting is applied directly to the overall probabilities of the final outcomes. Non-additivity (`REU(A+B) ≠ REU(A) + REU(B)` generally) means these processes yield different results unless `w(p)` is linear (EU) or has a very specific, generally non-plausible shape. This is the "wedge" you identified: it makes the equivalence of descriptions a substantive question *within* RDU theory, not neutral background. It directly feeds the core hypothesis about framing sensitivity.

  **Methodology & Weekly Plan:** The project combines formal modeling and conceptual analysis.

  *   **Weeks 1-2: Foundational Formalization & Simple Models**
      *   Define RDU/REU formally, emphasizing non-additivity.
      *   Build simple, explicit 2-stage vs. reduced-form gamble pairs (e.g., a binary first stage leading to binary second stages). Calculate RDU values for both descriptions using a standard weighting function (e.g., `w(p) = p^γ`, γ<1).
      *   Confirm the non-equivalence mathematically. Document how the difference depends on γ and the gamble structure.
  *   **Weeks 3-4: Modeling Dynamic Choice & Instability**
      *   Model the standard collapse scenario: An initial choice between a safe option and a compound lottery. After the first stage resolves, model the subsequent choice.
      *   Reproduce the inconsistency: Show the agent initially prefers the compound lottery (based on reduced-form RDU), but after a "bad" first-stage outcome, prefers to switch to the safe option in the sub-decision (based on the RDU of the *sub-gamble* presented alone).
      *   Formalize the claim that the agent faces a *different* act post-resolution: The initial act is "Accept reduced-form gamble G". The later act is "Accept sub-gamble S *given* event E occurred". Due to non-additivity, `REU(G)` ≠ `REU(Commit to follow S if E)` + ... etc.
  *   **Weeks 5-7: Testing the Hypothesis: Stable Framing**
      *   **Key Test 1 (Commitment as Description):** Model the initial choice as including a binding *commitment device* to the entire strategy (e.g., "Choose strategy: Take G and follow path S if E occurs"). Calculate the RDU of this *single, complex act* described upfront. Does the agent stick to this plan when E occurs? (Hypothesis: Yes, because the object of evaluation hasn't changed; they are just executing the pre-evaluated plan).
      *   **Key Test 2 (Fine-Grained Description):** Model the entire sequential problem as a single grand-world act *from the outset* – a massive decision tree with one RDU evaluation applied over all possible final outcome paths. Does the agent show any inclination to deviate from the initially optimal path as uncertainty resolves? (Hypothesis: No, because they are still evaluating the *same* grand act).
      *   Vary the risk-parameter (γ) and gamble structures. Does instability *only* appear when the framing shifts between coarse-grained and fine-grained descriptions mid-stream?
  *   **Weeks 8-9: Exploring Implications & Robustness**
      *   Analyze how different framing conventions (what counts as "one act") interact with risk attitudes.
      *   Investigate potential connections to other non-expected utility theories exhibiting similar framing effects (e.g., Prospect Theory).
      *   Refine the conceptual distinction between "genuine" dynamic inconsistency driven purely by risk attitude vs. "apparent" inconsistency driven by shifting act individuation.
  *   **Week 10: Synthesis & Writing**
      *   Consolidate results.
      *   Articulate the refined understanding of the collapse objection: It highlights RDU's sensitivity to framing (act individuation), not an inherent dynamic irrationality.
      *   Draft project report/manuscript.

  **Outcomes & Success Criteria:**

  *   **Positive Result (Project Success):** Clear demonstration that when the act description is held fixed throughout the dynamic problem (either via commitment-as-part-of-the-act or a fine-grained grand-world description), RDU agents exhibit diachronic stability *regardless* of the risk parameter (γ). Instability is reliably observed *only* when the framing shifts between stages. This supports the core hypothesis.
  *   **Negative Result (Project Failure):** Discovery that even under fixed, consistent framing (e.g., the grand-world description), RDU agents with plausible γ exhibit a *residual* dynamic inconsistency driven *solely* by the non-linear weighting function itself, independent of framing shifts. This would undermine the hypothesis and suggest the collapse objection has more force than proposed.
  *   **Inconclusive:** Results are ambiguous or highly dependent on specific, perhaps unrealistic, model assumptions without clear general lessons.

  **Feasibility in 10 Weeks:**

  Ten weeks is sufficient for a focused, productive start but likely insufficient for a fully comprehensive treatment. The plan is realistic if scope is managed:

  *   **Manageable:** Focusing on small, discrete gambles (binary or trinary outcomes/stages) and one standard weighting function makes the modeling computationally feasible. The core tests (Commitment Description vs. Grand-World vs. Shifting Framing) are well-defined.
  *   **What Will Be Cut/Deferred:**
      *   Deep exploration of *many* different weighting functions.
      *   Highly complex multi-stage gambles.
      *   Extensive comparison with other non-EU theories beyond cursory links.
      *   Thorough investigation of normative justifications for specific framing conventions.
      *   Empirical/experimental considerations.
  *   **Realistic Outcome:** A well-developed formal framework, clear results on key test cases supporting or refuting the hypothesis, and a robust conceptual argument ready for further development into a full paper. This provides more than enough substance for a successful summer project demonstrating significant intellectual progress on a recognized problem.

  This project tackles a foundational challenge to a major alternative decision theory. By rigorously testing the hypothesis that framing (act individuation), not risk-attitude, drives apparent instability, it aims to clarify the theoretical landscape and strengthen the case for rank-dependence as a viable model of rational choice under risk.
