  - Weeks 7-9: Test hypothesis by isolating risk attitudes from framing effects
  - Week 10: Synthesize findings

  The user's secondary hunch about two-stage gambles is crucial. If REU values depend on sequential resolution, that directly challenges the collapse argument's premise that rational agents should be indifferent to description.

  Feasibility-wise, 10 weeks is tight but manageable if we:
