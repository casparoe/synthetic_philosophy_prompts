prompt: |-
  I am a high school junior, and for the past two years I have interned with the planning department of my town — a municipality of roughly 40,000 people with one commuter-rail station and a largely single-family housing stock. Part of my job has been to sit in on Planning and Zoning Commission hearings and keep a voting log. I have become especially interested in one member, whom I will call Commissioner Ruiz, because her record strikes me as genuinely difficult to reduce to a single slogan. Our Youth Council has been invited to file a written comment on the next item before her, and I would like to predict how she will vote before I commit us to a position.

  Here is her record, in the order the matters came up:

  1. In favor of an ordinance permitting duplexes, triplexes, fourplexes, and accessory dwelling units by right in every residential zone, capped at two and a half stories, with parking requirements left unchanged.
  2. Against a 55-unit, six-story, entirely market-rate apartment building about 400 metres from the station. The site's zoning envelope capped four stories, so the project needed a height variance; it also sought to reduce required parking to 0.6 spaces per unit, and it would have demolished two small older apartment buildings containing eleven existing rental units.
  3. In favor of a 240-unit, twelve-story mixed-use tower on the former rail yard in the downtown core, permitted at that height by right under the town's transit-oriented development overlay, with a structured garage at one space per unit, 8 percent of units deed-restricted as affordable, and the largest addition to the commercial tax base in a decade.
  4. Against a neighborhood association's petition to downzone a half-mile corridor from two-family to single-family, a change that would have blocked the conversion of a large old house into six small units.
  5. Against a 14-unit, entirely deed-restricted affordable townhouse project proposed by a congregation on its own land in a single-family zone. It required a special permit, offered half a parking space per unit, and would have paved over a community garden that had occupied the site for twenty-five years.
  6. In favor of a 36-unit, four-story building with 30 percent deed-restricted affordable units, 600 metres from the station, permitted by right, providing 1.2 parking spaces per unit.
  7. Against endorsing a state bill that would have prohibited municipalities from maintaining single-family-only zoning. I recorded two reasons from her, and I could not tell which carried the weight: that the decision belonged to the commission rather than the legislature, and that the bill would not itself produce a single below-market unit.

  Now the new matter. A regional nonprofit proposes a six-story, 90-unit building that would be permanently affordable, deed-restricted at 60 percent of area median income for ninety-nine years, on a 1.2-acre vacant lot that currently holds a shuttered laundromat and a gravel parking field, with no residential units on it. The site sits in a single-family zone about 1.5 kilometres from the station, outside the transit overlay, where the cap is two and a half stories and the requirement is 1.5 spaces per unit; the project offers 0.25 spaces per unit. The decisive wrinkle is that the developer is invoking our state's affordable-housing density bonus statute, under which a fully affordable project of this size proceeds as of right: local height and parking limits are overridden, and the commission is left with a design review it cannot use to deny the application. The town's own equity map classifies the census tract as low displacement risk and high opportunity; it is among the wealthiest in town and contains almost no rental housing.

  What I would like from you:

  - At least four distinct decision rules that would account for this record. Each must be stated precisely enough to be testable against the votes, and each must either fit all seven or fit six with a stated account of the exception. Please do not simply offer labels such as pro-housing or anti-housing; I want the operative variable in each rule and the threshold at which it flips.
  - Her predicted vote on the new matter under each rule, and then your single best guess, with the reasoning that makes one rule preferable to the others given how votes 2, 3, 5, and 7 interact.
  - Which of the seven prior matters is the closest analog to the new one, which is the most misleadingly similar, and exactly which features do the analogical work.
  - Two hypothetical future proposals that would discriminate most sharply between the leading rules, and what she would have to vote on each for those rules to come apart. If instead there is a question I could simply put to her before the hearing that would settle it, propose it and say what each possible answer would imply.
  - Finally, if her record genuinely underdetermines this case, tell me what principle she would in effect be adopting by voting either way — that is, what she would be committed to endorsing the next time a comparable application arrived.

  Please work only from the record above and from general features of land-use politics. I do not want citations, reading lists, or references to real statutes, ordinances, or court decisions, and please do not supply names of towns, developers, or legal authorities beyond what I have given. Roughly 1,000 to 1,200 words would be ideal.
reasoning: |-
  Alright, let's tackle this high school junior's query. They've been interning with their town's planning department and need to predict Commissioner Ruiz's vote on a new affordable housing project. The key here is to analyze her past seven votes and derive distinct decision rules that explain her choices.

  First, I need to parse each of her previous votes to identify patterns. Vote 1 was pro-density by allowing multi-unit buildings by right, but with height and parking unchanged. Vote 2 opposed a market-rate apartment near the station due to height variance, parking reduction, and demolition of existing units. Vote 3 supported a large mixed-use tower downtown, which was by right, added tax revenue, and included some affordable units. Vote 4 was against downzoning, preserving the ability to convert houses into more units. Vote 5 rejected an affordable project that required a special permit, had low parking, and would destroy a community garden. Vote 6 backed a project with 30% affordable units, by right, and adequate parking. Vote 7 opposed a state bill banning single-family zoning, citing local control and lack of affordable units.

  Looking for common threads, several factors emerge: whether the project is by-right or needs variances, parking compliance, affordability levels, impact on existing structures or communities, and local control vs. state mandates. The challenge is to create rules that fit most votes without contradictions.

  Starting with Decision Rule 1: Projects must comply with existing zoning unless they provide substantial affordable housing (≥15% of units). This explains votes 1 (by-right, no affordability but compliant), 2 (non-compliant, no affordability), 3 (by-right, 8% affordable—wait, 8% is below 15%. Problem. Unless "substantial" is lower? But vote 6 has 30% which fits. Vote 5 was affordable but non-compliant and she opposed. Vote 7 opposes state override without guaranteed affordability. Adjusting: maybe compliance is key unless high affordability. But vote 3 only had 8%. Hmm. Perhaps tax base impact matters there.

  Rule 2: Support projects by-right or with minimal variances; oppose those requiring significant exceptions unless they meet community benefits thresholds. Vote 2 needed height variance and parking reduction, opposed. Vote 5 needed special permit and parking reduction, opposed. Vote 1 by-right, supported. Vote 3 by-right in overlay, supported. Vote 6 by-right, supported. Vote 4 opposed downzoning which would block by-right conversions. Vote 7 opposes state overriding local zoning. Fits all? Vote 5 had a special permit, which is a significant exception. Yes. The new project is by-right under state law, so she might support despite local non-compliance.

  Rule 3: Prioritize preventing displacement and preserving existing community assets. Vote 2 demolishes existing units, opposed. Vote 5 destroys community garden, opposed. Vote 4 preserves conversion potential. Vote 1 adds density without displacement. Vote 3 on rail yard, no displacement. Vote 6 no displacement mentioned. Vote 7 against state bill possibly to protect local communities. New project on vacant lot, no displacement, so support.

  Rule 4: Balance affordability with neighborhood context, opposing projects that are too dense or underparked for low-opportunity/low-risk areas. Vote 5 in wealthy area with low parking, opposed. Vote 6 adequate parking, supported. Vote 2 underparked, opposed. Vote 3 in downtown core, appropriate. New project in high-opportunity area with very low parking (0.25 vs 1.5 required), so oppose.

  Predicting the new case: Rule 1 (compliance + affordability) opposes because local non-compliance. Rule 2 (by-right status) supports since state law makes it by-right. Rule 3 (no displacement) supports. Rule 4 (context/parking) opposes. 

  Best guess: Rule 2 is strongest because it fits all prior votes. Vote 3 was by-right, Vote 5 wasn't, Vote 7 upholds local control except when overridden by state. Here, state law makes it by-right, so she might support despite local zoning conflicts. The closest analog is Vote 5 (affordable, parking issues) but key difference is by-right status via state law. Misleadingly similar is Vote 6 (affordable, compliant) but new project isn't locally compliant.

  Discriminating future proposals: One needing variances with high affordability vs. by-right market-rate. A question to ask her: "Do you consider a state density bonus provision as establishing a 'by-right' path equivalent to local zoning compliance?"

  If her vote is undetermined, supporting would commit her to accepting state overrides on affordability; opposing would prioritize local zoning even when state law permits.
answer: |-
  Based solely on Commissioner Ruiz's voting record and standard land-use dynamics, here is a systematic analysis:

  ### Decision Rules
  *(Each rule must fit ≥6 votes; exceptions explained)*

  1.  **Affordability-Triggered Variance Acceptance:**  
      *"Support projects requiring zoning variances ONLY if ≥20% of units are deed-restricted affordable AND the site has no existing residential tenants."*  
      **Fits:** 1 (no variance needed), 2 (0% affordable, opposed), 3 (8% affordable but by-right, not a variance), 4 (no variance), 5 (100% affordable but displaced garden/tenants? N/A), 6 (30% affordable + by-right), 7 (not a project).  
      **Exception:** Vote 5 (100% affordable but opposed due to non-residential displacement? Rule silent on non-residential displacement).  
      **New Matter Prediction:** **Support** (100% affordable, no residential displacement).

  2.  **Procedural Legitimacy Override:**  
      *"Support projects compliant 'by right' under ANY applicable law (local or state); oppose those reliant on discretionary local variances or special permits."*  
      **Fits:** 1 (by-right, support), 2 (needed variance, oppose), 3 (by-right, support), 4 (petition to downzone = discretionary, oppose), 5 (needed special permit, oppose), 6 (by-right, support), 7 (opposed state override of local process, consistent with procedural localism).  
      **Exception:** None – perfect fit.  
      **New Matter Prediction:** **Support** (state density bonus makes it "by right").

  3.  **Parking Adequacy Threshold:**  
      *"Oppose projects providing <0.8 parking spaces per unit UNLESS located within 500m of the rail station OR offering ≥25% affordable units."*  
      **Fits:** 1 (parking unchanged, support), 2 (0.6 spaces, not near station? 400m ≈ edge of 500m? Assume oppose fits), 3 (1.0 space, support), 5 (0.5 spaces, not near station, oppose), 6 (1.2 spaces, support), 7 (N/A).  
      **Exception:** Vote 2’s distance (400m) is ambiguous for the 500m threshold. Rule holds if 400m is "not within."  
      **New Matter Prediction:** **Oppose** (0.25 spaces/unit, >500m from station, despite 100% affordable).

  4.  **Contextual Density Alignment:**  
      *"Support density increases ONLY in designated growth areas (downtown core, TOD overlay) OR on sites without existing community assets; oppose in low-risk/displacement single-family zones lacking infrastructure."*  
      **Fits:** 1 (all zones, but modest scale/no asset loss), 2 (near station but demolished units + over-scale, oppose), 3 (downtown core, support), 4 (prevents downzoning, supports gentle density), 5 (opposed: paved garden in SF zone), 6 (600m from station – not TOD? But by-right and adequate parking, support), 7 (protects local character control).  
      **Exception:** Vote 6’s location (600m outside overlay) is inconsistent unless "adequate parking" overrides.  
      **New Matter Prediction:** **Oppose** (SF zone, low-risk area, far from station, no TOD designation).

  ### Prediction & Best Guess
  - **Rule 1:** Support  
  - **Rule 2:** Support  
  - **Rule 3:** Oppose  
  - **Rule 4:** Oppose  

  **Best Guess: SUPPORT**  
  **Reasoning:** Rule 2 (Procedural Legitimacy) fits all prior votes perfectly and resolves tensions in Votes 2, 3, 5, and 7:  
  - Vote 2 (opposed) relied on local variances; Vote 3 (supported) was by-right locally.  
  - Vote 5 (opposed) required a local special permit; Vote 7’s defense of local control reinforces her deference to codified processes.  
  - The state density bonus statute creates a *new* "by-right" pathway, overriding local zoning but satisfying her procedural consistency. Votes 3 and 6 show she supports by-right projects even with moderate parking/affordability; this project’s 100% affordability strengthens the case under Rule 1, but Rule 2 is the foundational principle.

  ### Analogical Reasoning
  - **Closest Analog: Vote 5**  
    *Why:* Both are 100% affordable projects in single-family zones with low parking.  
    *Distinguishing Feature:* Vote 5 required a *local* special permit (discretionary), while this project is "by right" via *state* statute (non-discretionary). This difference explains opposing Vote 5 but likely supporting this.  
  - **Most Misleadingly Similar: Vote 6**  
    *Why:* Superficially similar (affordable units, similar scale).  
    *Divergence:* Vote 6 was locally compliant (by-right, adequate parking); this project overrides local height/parking. Rule 2 resolves this contradiction.

  ### Discriminating Future Proposals
  To test between Rule 2 (Procedural) and Rule 4 (Contextual):  
  1.  **Hypothetical A:** A *market-rate* project using the same state density bonus on a similar site (by-right via state law, non-compliant locally).  
      - **Rule 2 Predicts:** Support (by-right status).  
      - **Rule 4 Predicts:** Oppose (inconsistent with neighborhood context).  
      - *Her vote for A would confirm Rule 2; against would confirm Rule 4.*  

  2.  **Hypothetical B:** A 100% affordable project *without* state bonus, needing a local variance for parking (0.4 spaces/unit) in the TOD overlay.  
      - **Rule 2 Predicts:** Oppose (relies on variance).  
      - **Rule 4 Predicts:** Support (in designated growth area).  
      - *Her support for B confirms Rule 4; opposition confirms Rule 2.*  

  **Alternative Question for Commissioner Ruiz:**  
  *"When a state law overrides local zoning to permit a project 'as of right,' do you view your design review role as limited to objective standards (e.g., drainage, material safety), or do you believe broader community impacts should still be considered for denial?"*  
  - **Answer 1 (Objective standards only):** Predicts **Support** (aligns with Rule 2).  
  - **Answer 2 (Consider community impacts):** Predicts **Oppose** (aligns with Rules 3/4).

  ### If Underdetermined: Principles at Stake
  - **If She SUPPORTS:** She endorses that *state-mandated affordable housing pathways supersede local zoning constraints*, even in high-opportunity/low-risk areas. Future comparable applications invoking state law must be approved.  
  - **If She OPPOSES:** She asserts that *local character and infrastructure limits (parking, height) override affordability goals* when displacement risk is low. Future state-bonus projects in similar contexts face rejection.  

  This record suggests a commissioner who prioritizes process legitimacy (Rule 2) above all, with affordability and parking as modifying factors. The state’s creation of a "by-right" path here likely outweighs her reservations about parking and neighborhood fit, leading to a **support** vote. Her consistency on procedural grounds makes Rule 2 the most reliable predictor.
