prompt: |-
  I'm a fourth-year philosophy student in a seminar on causation, and my term presentation is going to turn on a set of verdicts our seminar leader has issued, more or less in passing, over the last five weeks on cases of failure to act. He has been unusually explicit about them, which is why I think his record can be treated as data rather than as mood. I want to predict what he will say about a case he has not yet seen, and I would like help working out which principles that record actually admits.

  His verdicts so far. Throughout, an affirmative verdict means he is willing to say that the failure to act caused the harm — not merely that, had the act been performed, the harm would not have occurred.

  1. A caretaker under contract to water a client's houseplants during her absence never goes. The plants die. — Cause.
  2. The same contract and the same neglect, except that the water supply to the house had been shut off at the mains the previous day, so the plants would have died even if she had gone. — Not a cause.
  3. A night nurse does not give a dose that is charted, prepared, and sitting on the tray at the bedside. The patient dies. — Cause.
  4. A cleaner working the corridor outside that ward hears the bedside call alarm, is the only person within reach, and could have fetched the nurse in time. He does not. The patient dies. — Not a cause. He stressed that the counterfactuals here are exactly as clean as in 3: but for him, the patient lives.
  5. A maintenance engineer under contract skips the quarterly load test on a hospital's standby generator. The mains fail, the generator does not start, a patient on a ventilator dies. — Cause.
  6. An operator on shift duty does not close the valve that would have released the fire suppressant. The fire reaches the solvent store and the wing is destroyed. — Cause. He drew attention to the shape of this one: the failure stops something that would itself have stopped the fire.
  7. Any of us, himself included, could have booked a flight and watered the plants in case 1. We did not. — Not a cause; and he called cases of this shape his main reason for distrusting counterfactual treatments of omission altogether.

  His general orientation, in paraphrase rather than quotation. First, he thinks such treatments are absurdly permissive, since they make large parts of the world a cause of every death. Second, he says he is uneasy about any account that makes causal claims turn on what people owe one another, because he wants causation to be a worldly relation rather than a normative one — and he concedes that he has no satisfying way of holding these two commitments together.

  The new case, which I constructed for the presentation and which he has not seen. A visiting researcher from another university is working late in a building that also houses our animal facility. The facility's automatic watering line has tripped an internal fault and stopped delivering water. The fault indicator is lit in the corridor, and directly beside it is a labelled reset button requiring no key, no training, and no risk. He is the only person in the building. He has no contract with us, no role, no assignment, no prior relationship with the animals or their keepers, and, as our seminar leader would put it, no obligation of any kind, institutional or otherwise, to press anything. He notices the light and keeps walking to catch his train. The animals die of dehydration overnight. The counterfactuals are clean in the way he insists on: had he pressed the button, the line would have restarted and the animals would have survived, and nothing else in the building could have done it.

  What I need from you:

  (i) A prediction of his verdict, with a rough degree of confidence, and the single consideration that would most move you in either direction.

  (ii) The candidate principles his record admits. I can see at least four: a rule keyed to duty, role, or undertaking; a rule keyed to whether there is a process or device already in place that the omitted act would have kept running or released; a counterfactual rule restricted by proportionality or by the specificity of the absence in question; and an eliminativist rule on which none of his affirmative verdicts is literally true but all of them track which absence is salient to an inquirer. Set these out properly, add any others you think fit, state what each implies about the new case, and say for each which of 1–7 it explains effortlessly and which it has to bend.

  (iii) Which candidate you would bet on, and why. I am less interested in which principle is merely consistent with the record than in which best explains its pattern — in particular why 4 and 7 come out negative while 1, 3, 5 and 6 come out affirmative — and in how it handles the tension between his two stated commitments.

  (iv) The single further case that would most sharply separate your two leading candidates. Describe it in enough detail that its causal and normative features are unambiguous, and state what each candidate predicts about it. If you can, choose a case that does not simply re-run the feature that divides them in the new one.

  (v) Suppose he denies causation in the new case. What does he then owe us about the rest of it? Is he committed to saying that the visitor did nothing wrong, or to saying that the visitor's inaction plays no part in explaining the deaths? Sketch how he could deny the causal claim while keeping the normative and the explanatory ones, and say what that move costs him.

  (vi) Flag any place where the record itself is unstable: any pair of verdicts that no single one of your candidates handles comfortably, and what he would have to give up in order to keep both.

  Please organise the answer under those headings and keep it to roughly a thousand words. I am not after references or attributions; where a candidate corresponds to a recognised position in the literature, label the position rather than the paper.
reasoning: |-
  Okay, I need to help this philosophy student predict their seminar leader's verdict on a new case involving causation by omission. Let me start by understanding the existing verdicts and the leader's stated views. 

  First, looking at the seven cases. The leader finds causation in cases 1, 3, 5, and 6 where there's a clear duty or role (caretaker, nurse, engineer, operator). But denies it in cases 2 (preemptive cause), 4 (cleaner without duty), and 7 (general public). The key seems to be whether the agent had a specific obligation. 

  The new case involves a visitor with no obligation pressing a reset button. Since he has "no obligation of any kind," the leader would likely deny causation here too. That aligns with verdict 4 and 7. But I should consider if the reset button being simple and obvious might sway things—probably not, since obligation is the core factor.

  Now for candidate principles. The duty/obligation rule fits best: causation exists only if there's a normative duty. This cleanly explains all verdicts: affirmative where duty exists (1,3,5,6), negative where absent (4,7) or preempted (2). Alternatives like device-dependence (would the omitted act trigger a process?) struggle with cases 4 and 6. Counterfactual-plus-proportionality fails on 7. Eliminativism (all omissions are equally non-causal) contradicts the affirmative verdicts. 

  The strongest tension is between wanting causation to be "worldly" (non-normative) yet relying on duties. He might resolve it by distinguishing causation from responsibility, but this is unsatisfying—as he admits. 

  To test duty vs. device-dependence, a case without duty but with a device: say a passerby ignores a public fire alarm button. Duty rule says no causation; device rule says yes. This separates cleanly. 

  If he denies causation in the new case, he must clarify that the visitor's inaction explains the deaths counterfactually but isn't causal—perhaps calling it a "condition" instead. This preserves explanatory relevance without normative blame. But it costs him a unified account of causation. 

  The record seems stable except possibly case 6 (omission "releasing" a suppressant). But the duty rule handles it fine. No major instability. 

  Final prediction: 85% confidence in "not a cause," hinging entirely on absence of obligation. The reset button's simplicity won't override that, given verdict 4.
answer: |-
  ### (i) Prediction and Key Consideration  
  **Verdict Prediction:** *Not a cause* (≈85% confidence).  
  **Key Consideration:** The absence of *any institutional role, contractual duty, or prior undertaking* by the visitor. This mirrors case 4 (cleaner) and 7 (general public), where counterfactual dependence exists but no obligation grounds causal status. The reset button’s simplicity and lack of risk are irrelevant; his emphasis on "obligation" in case 4 and "no obligation" in your case overrides situational ease. If he *affirmed* causation, it would undermine his rejection of case 7, where anyone could easily act.  

  ---

  ### (ii) Candidate Principles and Their Implications  
  *(Each principle is applied to the new case; ✓ = explains effortlessly, ✗ = requires bending.)*  

  1. **Normative Duty/Role Principle**  
     - *Core idea:* Causation requires a *preexisting obligation* (contractual, institutional, or role-based duty) to act.  
     - *New case:* **Not a cause** (no obligation).  
     - *Fits:* ✓1 (caretaker’s contract), ✓3 (nurse’s role), ✓4 (cleaner lacks duty), ✓5 (engineer’s contract), ✓7 (no general duty).  
     - *Bends:* ✗6 (operator’s shift duty implies obligation, but not explicitly stated).  

  2. **Device/Process Dependence Principle**  
     - *Core idea:* Causation requires that the omission *fails to sustain/release an existing causal device or process* (e.g., machinery, protocol).  
     - *New case:* **Cause** (button would restart the watering line, a device).  
     - *Fits:* ✓2 (no device to sustain: water shut off), ✓3 (prepared dose as "device"), ✓5 (generator test maintains device), ✓6 (valve releases suppressant system).  
     - *Bends:* ✗4 (alarm implies a "process" to fetch nurse, but denied); ✗7 (watering plants could involve "process," but denied).  

  3. **Restricted Counterfactual Principle**  
     - *Core idea:* Counterfactual dependence suffices *only* if the omission is *proportionally specific* (e.g., "not pressing the button" vs. "not saving the world").  
     - *New case:* **Ambiguous** (specific omission, but resembles 7).  
     - *Fits:* ✓2 (preemption breaks dependence), ✓7 (overly broad omissions excluded).  
     - *Bends:* ✗4 (equally specific as 3, but denied); ✗1/3/5/6 (no obvious specificity filter).  

  4. **Eliminativism (Salience-Based)**  
     - *Core idea:* Omissions never cause; affirmative verdicts reflect *pragmatic salience* (e.g., duty makes absence noteworthy).  
     - *New case:* **Not a cause** (literally; salience low without duty).  
     - *Fits:* ✓7 (aligns with distrust of omission-causation), ✓2/4 (denials consistent).  
     - *Bends:* ✗ All affirmatives (1,3,5,6)—must deny literal truth despite his insistence on causation.  

  5. **Control/Intervention Principle**  
     - *Core idea:* Causation requires *exclusive, immediate control* over the outcome via the act.  
     - *New case:* **Cause** (only person present, direct button access).  
     - *Fits:* ✓1 (caretaker has control), ✓2 (no control due to preemption), ✓4 (cleaner lacks exclusive control? But CF holds).  
     - *Bends:* ✗7 (everyone has equal control, denied); ✗5 (engineer’s control is indirect).  

  ---

  ### (iii) Best Candidate and Why  
  **Bet on: Normative Duty/Role Principle.**  
  - **Why:** It cleanly explains the pattern: affirmative verdicts (1,3,5,6) all involve agents with explicit roles/duties (caretaker, nurse, engineer, operator). Negative verdicts (2,4,7) lack duty (4,7) or have preemption (2). Case 6’s "releasing" structure is irrelevant—duty does the work.  
  - **Handling the tension:** He wants causation "worldly" (non-normative) but uses obligation to restrict omissions. This *fails* to reconcile the commitments; duty smuggles normativity into causation. Yet it’s the only principle explaining why 4 and 7 are negative while 1,3,5,6 are affirmative. His unease admits this tension.  

  ---

  ### (iv) Best Discriminating Case  
  **Case:** A lifeguard *off-duty and in street clothes* walks past a public pool, sees a child drowning, and could easily rescue them with no risk. They do nothing; the child dies. CF dependence holds.  
  - **Normative Duty Principle:** *Not a cause* (no *active duty*—off-duty implies no obligation).  
  - **Device/Process Principle:** *Cause* (lifeguard’s training/role implies a "rescue process" they could trigger).  
  - **Why it works:** Separates duty (absent here) from device/process (plausibly present). Unlike your case, it doesn’t rerun "no duty" but tests whether *role-associated capacity* alone suffices.  

  ---

  ### (v) Denying Causation: Implications  
  **If he denies causation in the new case:**  
  - **Not committed to "no wrong":** He can say the visitor *morally should* have pressed the button (e.g., on utilitarianism) but had no *obligation* (no duty owed).  
  - **Explanatory claim:** He must concede the inaction *explains* the deaths counterfactually ("if pressed, they’d have lived") but denies it is *causal*.  
  - **Cost:** He must bifurcate explanation and causation, treating omissions as mere "background conditions" (cf. eliminativism). This strains intuition (e.g., case 3’s nurse "caused" death by omission) and clashes with his affirmative verdicts.  

  ---

  ### (vi) Instability in the Record  
  **Unstable Pair:** Case 4 (cleaner) and Case 6 (operator).  
  - **Conflict:** Both involve omissions that would "release" an intervention (fetch nurse; release suppressant). Yet 4 is negative, 6 affirmative.  
  - **No candidate reconciles both:**  
    - *Duty principle:* Explains 6 (operator’s duty) vs. 4 (no duty).  
    - *Device principle:* Struggles—why is the alarm "process" in 4 insufficient?  
  - **What he must give up:** To keep both, he must abandon a unified "releasing" criterion and rely solely on duty—but this highlights the normativity he rejects.  

  ---
  **Final Note:** His verdicts point to a *role-relative* view of omission-causation, irreducible to counterfactuals or mechanisms. While inconsistent with his "worldly relation" ideal, it best predicts "not a cause" in your case. Use the lifeguard case to probe if capacity sans duty alters his view.
