prompt: |-
  I'm one of three moderators for a volunteer-run wiki documenting our county's history, and we're rewriting our sourcing policy after a six-month fight over a single claim about a 1920s mill fire — a claim that now sits at the center of a landmark-designation petition. Our existing rule is that every claim needs a citation, any citation can be challenged, and a challenger is entitled to demand support for the reliability of the source cited. That is how we got a four-hundred-comment thread with nobody closer to an answer.

  The reform proposals on the table are these three. First: a standing list of anchor sources — the county recorder, two local papers, one academic press — whose reliability is assumed and not open to challenge; note, though, that one of those papers was owned by the mill company, which is a large part of why people challenge sources at all. Second: a claim counts as settled once it is corroborated by enough other settled claims, even where that corroboration eventually loops back through claims that were themselves settled by it. Third: nothing is ever finally settled — chains stay open indefinitely, and a claim's standing simply grows the longer its chain survives challenge without breaking.

  Each bothers me in a way I can't articulate. The first seems to rest the entire archive on a decree; the second seems to license believing anything, provided you believe enough of it; the third seems to promise a justification that no one ever actually receives. Which should we adopt, if any — or is there a fourth option we've missed? I'd rather not be told to weigh things case by case: that is the current policy, and it is what produces the four-hundred-comment threads. Please answer in terms of something we could write down and enforce.
reasoning: |-
  Okay, the user is one of three moderators for a volunteer-run wiki documenting their county's history. They're rewriting their sourcing policy after a long dispute over a claim about a 1920s mill fire. This claim is now central to a landmark-designation petition, so accuracy is crucial. Their current policy requires citations for every claim, allows any citation to be challenged, and lets challengers demand proof of the source's reliability. This led to a 400-comment thread with no resolution. They need a better system.

  The user has three reform proposals but finds each problematic. The first creates a list of "anchor sources" (county recorder, two local papers, one academic press) that can't be challenged. However, one paper was owned by the mill company, which is a source of contention. The second allows claims to be settled through corroboration with other claims, even if it creates circular reasoning. The third keeps everything open indefinitely, where a claim's standing grows over time as it survives challenges. The user feels the first relies on authority, the second allows unfounded beliefs, and the third never provides real justification. They want a concrete, enforceable policy, not case-by-case decisions.

  I need to assess each proposal's flaws. The anchor sources list could be problematic due to bias, especially with the mill-owned paper. Corroboration loops risk circular reasoning and false consensus. The indefinite challenge approach might never resolve issues and could overwhelm moderators. The user's deeper needs include reducing moderation workload, ensuring reliability without endless debates, maintaining neutrality, and having a transparent, enforceable policy. They also need to prevent bias and ensure the wiki's credibility, especially since the mill fire claim affects a landmark petition.

  Considering a fourth option, I should think about structured source hierarchies with clear criteria. Tiered reliability with defined challenge procedures might work. Sources could be categorized based on expertise and objectivity. Challenges would require specific grounds and evidence, shifting the burden to the challenger. Corroboration would be allowed but with safeguards against circularity. For the mill fire claim, sources from the mill-owned paper would need verification from neutral or opposing sources. This approach balances flexibility with structure, reduces endless debates by setting clear rules, and addresses bias without outright banning sources. It should streamline the process while ensuring reliability.
answer: |-
  Based on your situation – particularly the high stakes of the mill fire claim, the failure of the current case-by-case approach, and the flaws in the existing proposals – I recommend a **fourth option: A Tiered Reliability Framework with Structured Challenge Procedures and Corroboration Safeguards.** This combines elements of the proposed ideas but structures them to avoid the pitfalls you identified.

  **The Core Principles:**

  1.  **Acknowledge Bias & Context:** No source is universally perfect; reliability depends *on the specific claim being made* and the source's *proximity, expertise, and potential bias* regarding that claim.
  2.  **Shift the Burden of Proof:** Once a citation is provided, the *challenger* must demonstrate specific, grounded reasons to doubt *this source* for *this specific claim*.
  3.  **Structure Corroboration:** Allow corroboration but prevent circular loops by defining "independent" sources and setting clear thresholds.
  4.  **Provide Resolution Pathways:** Define clear endpoints for challenges that don't devolve into infinite regress or arbitrary decrees.
  5.  **Prioritize Primary & Contemporary Sources:** Give inherent weight to sources created closest to the event/time period.

  **The Policy Framework (Writeable & Enforceable):**

  **I. Source Tiers & Reliability Presumptions:**
      *   **Tier 1: Presumed Reliable (Subject to Specific Challenge Grounds):** Official records (e.g., County Recorder, Fire Dept. logs, Court records), Peer-reviewed academic histories specific to the county/region, Established national archives (e.g., Library of Congress collections *relevant to the county*). *Presumption:* Accurate for factual claims *within their documented scope* (e.g., a fire report states the date; a deed states ownership).
      *   **Tier 2: Generally Reliable but Context-Dependent:** Major local newspapers (including the potentially biased one), reputable local history books (non-academic press but well-regarded), oral histories archived by credible institutions (e.g., university library). *Presumption:* Reliable for reporting events and contemporary perspectives *unless* a challenger demonstrates specific bias, contradiction, or lack of corroboration *relevant to the specific claim*.
      *   **Tier 3: Requires Corroboration:** Personal memoirs, family histories, unverified oral histories, minor/local newsletters, sources with clear undisputed major bias/conflict of interest *on the specific topic* (e.g., the mill-owned paper *reporting on the mill fire itself*). *Presumption:* May contain valuable information but *must be corroborated* by at least one Tier 1 or Tier 2 source for the specific factual claim to stand alone.
      *   **Tier 4: Generally Unreliable:** Unsubstantiated rumor, anonymous online posts, sources demonstrably fabricating information. *Presumption:* Not admissible as sole evidence for a factual claim.

  **II. Challenge Procedure (Structured & Burden-Shifting):**
      1.  **Initial Citation:** Editor provides a citation supporting a claim.
      2.  **Challenge:** A challenger must state:
          *   The specific factual claim being challenged.
          *   The specific source cited for that claim.
          *   **The specific, grounded reason** for the challenge, choosing *only* from defined categories:
              *   *Source Bias/Conflict:* Demonstrable and relevant conflict of interest impacting *this specific claim* (e.g., "The Mill Gazette is owned by the mill company reporting on its own fire loss estimate"). *Challenger must briefly explain the relevance.*
              *   *Internal Contradiction:* The source contradicts *itself* on this specific point.
              *   *Contradiction by Higher Tier Source:* A Tier 1 or Tier 2 source directly contradicts the cited source *on this specific claim*. *Challenger must cite this source.*
              *   *Proven Factual Error:* The source has been definitively proven wrong *on this specific fact* elsewhere (e.g., coroner's report vs. initial newspaper death toll).
              *   *Source Misapplication:* The cited source does not actually support the claim made.
          *   **Challenge Invalid if:** It's vague ("unreliable"), based on general reputation without specific relevance, or demands justification beyond the initial citation *without providing one of the above specific grounds*.
      3.  **Response:** The citing editor can:
          *   Provide corroboration from an *independent source* (different author/organization, ideally different Tier) supporting the *specific claim*.
          *   Address the specific concern raised (e.g., explain context mitigating bias, show the contradiction isn't valid).
          *   Downgrade the claim's certainty (e.g., "Estimated by Mill Gazette, potential conflict noted").
          *   Remove the claim if unable to defend it.
      4.  **Moderator Assessment:** If unresolved, moderators step in **only** to:
          *   Verify the challenge meets the specific grounds criteria.
          *   Verify the response addresses the *specific* challenge.
          *   Assess if corroboration meets the "independent source" definition.
          *   **Not** to re-litigate the source's general reliability or the claim's truth in a vacuum.
      5.  **Resolution:**
          *   If the challenge fails to meet specific grounds: Claim stands, challenge closed. Further challenges on *the same ground* from *the same user* require new evidence.
          *   If the challenge meets grounds and the response fails to adequately address it (or provide valid corroboration for Tier 3): The claim is removed or significantly qualified.
          *   If corroboration is provided and deemed valid: Claim stands, challenge closed. *The corroborating source itself is now open to challenge only on its own merits for supporting this claim, following the same procedure.*

  **III. Corroboration Rules (Preventing Loops):**
      *   **Independence:** Corroborating sources must be independent – different author/organization, different primary source material. A book citing the same newspaper article doesn't count as corroboration against a challenge to that newspaper.
      *   **No Self-Corroboration:** Claims cannot corroborate each other in a closed loop. Corroboration must come from *outside* the set of claims initially relying on each other. Claim A citing Source X, Claim B citing Source Y, can corroborate *each other* only if X and Y are independent sources. Claim A citing Source X cannot be corroborated by Claim C which *also* only cites Source X.
      *   **Tier Hierarchy:** Corroboration from a higher Tier source generally trumps a challenge based on lower-tier contradiction or bias concerns.

  **IV. Finality (With a Safety Valve):**
      *   **Generally Settled:** Once a claim survives a properly conducted challenge (or no valid challenge is raised within a defined period, e.g., 30 days after citation), it is considered settled *for the purposes of the wiki*.
      *   **New Evidence Rule:** A "settled" claim can *only* be reopened with **newly discovered, significant evidence** from a credible source (Tier 1 or 2) that directly contradicts it or fundamentally undermines the original source/corroboration. This prevents endless rehashing of the same arguments.
      *   **Contextual Flagging:** Even "settled" claims can have contextual notes added about potential bias or limitations of sources (e.g., "Per Mill Gazette report; note Mill ownership").

  **Why This Addresses Your Concerns & The Mill Fire Example:**

  *   **Avoids Arbitrary Decree (vs. Proposal 1):** The mill-owned paper isn't banned or blindly trusted. It's Tier 2. A challenge based on "Source Bias/Conflict" is valid *because the conflict is specific and relevant*. The citing editor must then either: a) Corroborate with an independent source (e.g., the competing local paper, fire department report), b) Qualify the claim ("The mill company reported..."), or c) Remove it. The burden shifts appropriately.
  *   **Prevents Circular Belief (vs. Proposal 2):** Strict independence rules for corroboration break potential loops. You can't have Claim A (based on Mill Gazette) corroborating Claim B (also based on Mill Gazette).
  *   **Provides Actual Resolution (vs. Proposal 3 & Current Policy):** Clear challenge criteria, burden shifting, moderator role limited to procedure, and the "New Evidence Rule" provide endpoints. The 400-comment thread likely involved vague challenges and demands for general source justification – this policy cuts that off early.
  *   **Manages the Mill Fire:** Claims based *solely* on the mill-owned paper (Tier 2) about the fire's cause or extent *can* be specifically challenged on bias grounds. The editor must then find independent corroboration (e.g., fire dept. report, other paper) or qualify/remove. Claims based on the County Recorder (Tier 1 - e.g., property loss records) have a higher presumption and require a stronger, specific challenge (e.g., proven error, contradiction by another Tier 1 source).
  *   **Reduces Mod Workload:** Moderators enforce *procedure* (was the challenge valid? did the response address it? is the corroboration independent?) not the endless philosophical debate about source reliability in general. Invalid challenges are dismissed quickly.
  *   **Balances Rigor & Practicality:** It requires effort but provides a clear, structured path. It doesn't demand infinite proof but demands specific, relevant challenges and valid corroboration when bias is a reasonable concern.

  **Implementation Steps:**

  1.  Draft the policy clearly using the framework above.
  2.  Define your Tiers concretely (list examples: "Tier 1: County Recorder Deeds (1820-present), Fire Dept. Annual Reports (1895-1980), 'History of Smith County' by Prof. Jones (Univ. Press 2005)").
  3.  Define "Independence" clearly.
  4.  Set the timeframe for initial challenges (e.g., 30 days).
  5.  **Crucially:** Apply this policy *prospectively* to all *new* edits and claims. Applying it retroactively to the mill fire claim will be messy but necessary. Use the moderators to make the initial "procedural" call on any existing challenges under the new rules.

  This framework provides the structure and enforceable rules you need, moves beyond case-by-case into defined procedures, and directly tackles the core problems of bias, circularity, and endless debate that plagued your previous efforts. It makes reliability contextual and challengeable, but within strict, productive bounds.
