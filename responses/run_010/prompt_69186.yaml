answer: |-
  Here's a breakdown of "illegal but legitimate" in the context of humanitarian intervention, addressing your request for a "menu" of precise claims, their status, and how they apply to Dana's arguments:

  **The Core Conceptual Split: Law vs. Legitimacy**
  The fundamental, often unstated, starting point is that **law and legitimacy are distinct concepts**. Legality is about formal rules (like the UN Charter). Legitimacy is about perceived rightfulness, acceptability, or justification based on other sources (morality, consequences, political norms, necessity). *This separation is the essential platitude.* Everyone serious acknowledges law and morality/politics *can* diverge (e.g., jaywalking to save a child).

  **The Menu of "Legitimate" Meanings:**

  1.  **Moral Justification (Substantive Ethical Claim):**
      *   **Claim:** The intervention was *ethically right* or *morally necessary* despite violating the law. The ends (stopping genocide, mass atrocity) justified the illegal means. It was the "lesser evil" or a positive moral duty.
      *   **Status:** A substantive moral/political claim requiring robust argument (evidence of imminent atrocity, proportionality, last resort, right intent, likelihood of success). Not a platitude; highly contested.
      *   **"Justified vs. Excused":** This is the **"justified"** side. The act itself is seen as *right* under the extreme circumstances. (Excused would mean it's still *wrong* but the actor isn't blameworthy due to circumstance - less common in this context).

  2.  **Political Acceptance/Endorsement (Descriptive/Political Claim):**
      *   **Claim:** While formally illegal, the intervention was broadly *accepted* or *endorsed* as necessary or understandable by a significant portion of the relevant international community (states, regional bodies, global public opinion, key NGOs) *after the fact*. This acceptance lends it a form of political legitimacy, even if not legal.
      *   **Status:** A descriptive claim about political reality that can be verified/falsified (looking at votes, statements, resolutions, opinion polls). Requires evidence. Not inherently normative, but often used normatively.
      *   **"Who Accepted It":** This is the core of this reading. Legitimacy here is conferred by external political actors, not inherent morality.

  3.  **Systemic Critique & Implied Law Reform (Critical/Prescriptive Claim):**
      *   **Claim:** The intervention highlights a *flaw* or *deficit* in the existing international legal system (e.g., the veto power blocking necessary action). Calling it "legitimate" is an implicit argument that the *law should change* to accommodate such interventions in the future, recognizing that the current rules are sometimes inadequate or unjustly applied.
      *   **Status:** A substantive critical/prescriptive claim about the inadequacy of the law. Requires argument about the systemic failure and the need/possibility for reform.

  4.  **Rhetorical Concession / Regret Minimization (Cynical/Pragmatic Reading):**
      *   **Claim:** Saying "illegal but legitimate" is simply a diplomatic or political way to acknowledge the technical violation while signaling approval or lack of condemnation. It's "polite" because outright calling an ally's necessary action "illegal" without qualification is awkward, and calling it "legal" would undermine the rules. It minimizes reputational damage for the intervener.
      *   **Status:** A cynical observation about political discourse. It describes a *function* of the phrase rather than its inherent meaning. Dana's final jab fits here. This reading often *undercuts* the stronger moral claims of readings 1 & 3.

  **Applying the Menu to Dana's Moves:**

  *   **Kosovo '99 ("Illegal but Legitimate - Full Stop"):**
      *   **Dana's Likely Reading:** **#1 (Moral Justification).** She believes NATO was *ethically right* to act to stop ethnic cleansing, regardless of the Russian/Chinese veto blocking UN authorization. The phrase expresses this moral verdict. "#3 (Systemic Critique)" might be implied but isn't her primary focus ("full stop" suggests the moral verdict is sufficient). She rejects #4 here.
      *   **Needed?** #1 is the core reading she relies on to defend Kosovo.

  *   **Iraq '03 ("Not Legal, Not Legitimate"):**
      *   **Dana's Reasoning:** She explicitly contrasts it with Kosovo. Her key point is the *lack of credible external endorsement* ("nobody credible outside the coalition vouched for it").
      *   **Dana's Reading:** Primarily **#2 (Political Acceptance)**. Iraq lacked the broad post-hoc acceptance Kosovo garnered. She likely also means **#1 (Moral Justification)** - she doesn't believe the WMD threat/humanitarian rationale was genuine or sufficient to morally justify it. Her use of "vouched for" points strongly to #2.
      *   **Needed?** Both #1 and #2 are active in her dismissal. The lack of perceived moral justification (#1) and lack of political acceptance (#2) mean it fails all potential "legitimacy" tests.

  *   **Libya '11 ("Uneasy"):**
      *   **Dana's Reasoning:** Security Council authorization (Resolution 1973) existed *for protection*, but the mission *shifted* to regime change. "Legitimacy" is questioned because only the interveners themselves claimed the shift was necessary/covered, and she dismisses abstentions as insufficient endorsement.
      *   **Dana's Reading:** **#2 (Political Acceptance) - but narrowly defined.** She's arguing that *broad* political acceptance (#2, like Kosovo had) is missing – only the actors themselves claim the wider campaign was legitimate. She implicitly questions whether the regime change aspect was **#1 (Morally Justified)** *given the mandate*, or if it exceeded necessary and proportional force. Her unease stems from the gap between the legal mandate and the executed action, muddying both legal *and* legitimacy claims.
      *   **Needed?** #2 (lack of broad acceptance) is her explicit point. #1 (moral justification) is the underlying source of her unease – was toppling Gaddafi *really* necessary for civilian protection under 1973, or did it go too far? She hasn't firmly decided.

  *   **Dana's Cynical Jab ("...a polite way of saying you're glad they did it"):**
      *   **This is Reading #4 (Rhetorical Concession).**
      *   **Does it survive her Kosovo verdict? No, it directly undermines it.** If legitimacy is *just* politeness signaling approval (#4), then her strong moral claim for Kosovo (#1) evaporates. It reduces "legitimate" to a subjective "thumbs up" rather than an objective assessment of rightness or broad acceptance. Her Kosovo stance relies on #1 being a *real* claim about moral justification, not just a polite fiction (#4). This jab reveals a tension in her own usage.

  **Can One Reading Cover Kosovo, Iraq, and Libya Unease?**

  *   **#1 (Moral Justification):** *Could* work, but requires consistent moral reasoning:
      *   Kosovo: Mass atrocity imminent, intervention stopped it (Justified).
      *   Iraq: No imminent threat, bad faith, disastrous consequences (Not Justified).
      *   Libya: Started justified (protect civilians), but regime change aspect may have been disproportionate/unnecessary/led to chaos (Hence Unease - potentially crossing from justified into unjustified).
      *   **Problem for Dana:** Her Libya unease focuses heavily on the *lack of external validation* (#2), not solely the moral calculus. She switches emphasis.

  *   **#2 (Political Acceptance):** *Could* work, but requires a consistent threshold for "acceptance":
      *   Kosovo: Broad regional (incl. hesitant states) and global acceptance *post-hoc*.
      *   Iraq: Widespread condemnation, lack of credible external endorsers.
      *   Libya: Acceptance for the initial mandate, but significant controversy and criticism over the regime change shift *from many quarters* (incl. states that abstained or later regretted it) leading to lack of broad acceptance for the *full* campaign.
      *   **Problem for Dana:** Her Kosovo stance seems more morally driven (#1) than acceptance-driven (#2). She treats Kosovo's legitimacy as inherent ("full stop"), not contingent on counting endorsements.

  **Conclusion: Did She Switch Senses?**

  *   **Yes, significantly.**
      1.  **Kosovo:** Primarily **#1 (Moral Justification)** - an inherent ethical verdict.
      2.  **Iraq:** Combines **#1 (Lack of Moral Justification)** and **#2 (Lack of Political Acceptance)**.
      3.  **Libya:** Primarily **#2 (Lack of Broad Political Acceptance for the regime change shift)**, with underlying unease about **#1 (Moral Justification for the shift)**.
      4.  **Cynical Jab:** Introduces **#4 (Rhetorical Concession)**, which directly contradicts the foundation (#1) of her Kosovo position.

  *   **The Switch:** She anchors Kosovo firmly in morality (#1), pivots to using political acceptance (#2) as a key *indicator* of legitimacy when discussing Iraq and Libya, and then undercuts the whole enterprise with the cynical jab (#4). Her unease on Libya stems from the mandate overreach muddying *both* the legal basis *and* the potential sources of legitimacy (#1 and #2).

  **What to Say Next Time:**

  Instead of "you're using that word three ways," try: "When you say 'legitimate' for Kosovo, you seem to mean it was *morally the right thing to do*, inherently (#1). But when you dismiss Iraq's legitimacy, you point to the *lack of outside validation* (#2). And for Libya, your focus on only the interveners endorsing the regime change is again about that *political acceptance* (#2). Then your comment about 'legitimate' just meaning 'glad they did it' (#4) sounds like a different idea entirely – one that actually makes your moral claim about Kosovo sound less solid. Can we clarify which kind of 'legitimacy' matters most in these cases?"

  This frames it as understanding her reasoning, not just nitpicking words. It forces clarity on whether legitimacy is inherent morality, conferred by others, or just rhetorical polish. It also highlights the tension her cynical jab created. Good luck!
