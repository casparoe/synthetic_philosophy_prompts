prompt: |-
  In most parliamentary systems you get a government by having parties with genuinely opposed values sign a coalition agreement stuffed with provisions each of them thinks is wrong — the anti-war party signs a program that funds the war because it gets the housing bill, and everyone calls that mature, gains from trade, better for both than the alternative. But the same parties show up with one or two declared red lines: issues where no amount of benefit anywhere else will buy their agreement, and where a crossed line counts not as a cost but as a disqualifier, sometimes retroactively tainting the whole deal. And the final text tends to be deliberately vague on exactly the contested point, so each side can tell thier members its values weren't traded away at all.

  What theory of value does that package presuppose? If values are tradeable enough that signing something you think wrong can be the right call, what makes one trade categorically different from the other fifty — is the practice committed to a lexical ordering, to a distinction between compromising on outcomes and compromising on principle, or to something about complicity and integrity? And how much of it needs no moral theory whatsoever, since a red line looks about as much like signaling to your base as like a view about non-fungible value? I want what the practice strictly requires separated from what merely fits it nicely, and then a picture of what coalition bargaining would have to become if everyone actually believed values were fully commensurable — or fully incommensurable.
reasoning: |-
  Okay, let me try to unpack the user's query. They're asking about coalition governments in parliamentary systems, specifically how parties compromise on most issues but draw "red lines" on others. The user wants to know what theory of value underpins this practice. 

  First, I need to recall how coalition agreements work. Parties negotiate policies, trading support on different issues. For example, a green party might accept a defense bill they dislike in exchange for environmental policies. But sometimes they have non-negotiable issues, like banning nuclear energy. The user is puzzled: if values are tradeable, why are some lines absolute?

  The user mentions three possibilities: lexical ordering (some values always trump others), principle vs. outcome compromises, or concerns about complicity. They also question if red lines are just political signaling rather than genuine moral stands. They want to know what the practice requires versus what's optional, and how things would change if values were fully commensurable or incommensurable.

  I should start by breaking down the core elements. The practice involves both trade-offs and absolute limits. The key points are the willingness to compromise on most issues but refusal on specific ones, with deliberate vagueness on contested points. 

  For the theory of value, I consider if it's lexical ordering. But in politics, parties often trade high-priority items. The red lines seem tied to core identity or integrity. Maybe it's about constitutive commitments—issues so central that compromising them undermines the party's purpose. For example, an anti-war party might lose its reason to exist if it supports war. That fits the idea of integrity and complicity.

  Then there's the signaling aspect. Red lines reassure the base that the party hasn't sold out. But the user wants to separate what's essential from what's opportunistic. The practice strictly requires some non-tradable issues to maintain coalition viability. Without red lines, parties might disintegrate or lose credibility.

  For commensurable values, if everything could be traded, coalitions would be pure transactional deals. No red lines, just cost-benefit analysis. Policies might be clearer, but parties could alienate their base. For incommensurable values, no compromises at all. Deadlock or minority governments would be common. 

  I should also address the vagueness in agreements. It's a practical tool to paper over disagreements, allowing each side to claim victory. This isn't necessary but helps maintain unity. The user might be interested in how this reflects on political realism versus idealism.

  The user's deeper concern seems to be about moral philosophy in politics. Are red lines genuine ethical stands or strategic moves? They want a clear analysis separating necessity from convenience. I need to ensure the response distinguishes between the structural need for red lines (to preserve identity and trust) and the optional aspects like vagueness or signaling.

  Also, considering commensurability scenarios shows how the current system balances pragmatism with principle. The user might be exploring whether political compromise undermines values or if it's a necessary part of governance. Highlighting the difference between compromising on outcomes versus core principles could address this.

  Finally, ensuring the response is thorough but not overly technical. The user is likely well-versed in political theory, so using terms like lexical ordering or constitutive commitments is appropriate, but explaining them briefly keeps it accessible. The examples help illustrate the abstract points, like the anti-war party or environmental policies.
answer: |-
  This coalition bargaining practice reveals a complex, hybrid theory of value that **strictly requires** certain elements while accommodating others. Here's a breakdown:

  ### What the Practice Strictly Requires
  1.  **Rejection of Full Commensurability:** The core requirement is that **not all values are fully tradeable**. The practice fundamentally depends on the existence of *some* preferences treated as qualitatively different from others. Without this, red lines make no sense.
  2.  **Lexical Priority (Situational):** It necessitates **contextual lexical ordering** – the idea that *for specific issues under specific conditions*, one value or principle absolutely overrides others *in this negotiation*. This isn't a universal moral hierarchy, but a political commitment that "X *here and now* cannot be traded for anything."
  3.  **Distinction Between "Cost" and "Disqualifier":** It requires treating some concessions not merely as *costs* (which can be offset by gains) but as **deal-breakers** or **constitutive violations**. Crossing a red line isn't "expensive"; it renders the entire agreement unacceptable, often because it:
      *   **Violates Core Identity:** The issue is fundamental to the party's *raison d'être* (e.g., an anti-war party supporting war).
      *   **Creates Unacceptable Complicity:** Signing would make the party directly responsible for an act it deems morally abhorrent, damaging its integrity beyond repair in the eyes of its base or its own self-conception.
      *   **Threatens Existential Survival:** Crossing the line could trigger massive defections, collapse the party, or destroy its electoral viability.
  4.  **Non-Fungibility of Specific Values/Acts:** It presupposes that **certain outcomes or principles cannot be compensated for by gains in other areas**. Supporting *this specific war* or abolishing *this specific fundamental right* holds a unique, non-substitutable negative value.

  ### What Fits Nicely (But Isn't Strictly Required)
  1.  **Deliberate Vagueness:** While common and highly functional, it's a *strategic adaptation*, not a core requirement. Clear red lines *could* still exist ("No increase in VAT, period"), but vagueness helps manage internal dissent and voter perception without abandoning the core non-tradeability.
  2.  **Signaling:** While red lines often serve a signaling function to the base, the practice doesn't *require* this to be the *sole* or even *primary* motive. It can coexist with genuine conviction. Signaling explains *why* parties publicly emphasize red lines, but not necessarily *why* they hold them internally.
  3.  **Distinction Principle/Outcome vs. Principle:** This distinction often *fits* (e.g., compromising on *how much* to fund schools vs. compromising on *whether* to fund private religious schools). However, the strict requirement is about *non-tradeability*, which could apply to very concrete outcomes (e.g., "No closure of *this specific* hospital") or abstract principles (e.g., "No violation of free speech").

  ### Coalition Bargaining Under Different Value Assumptions
  1.  **If Values Were Fully Commensurable:**
      *   **Red Lines Vanish:** Every issue becomes a matter of cost-benefit analysis. "How much housing funding is funding *that* war worth to you?" There would be no categorical refusals.
      *   **Pure Horse-Trading:** Negotiations would resemble economic exchanges or utilitarian calculus. Deals would be optimized packages maximizing aggregate "utility" (however defined by the parties).
      *   **Clear, Detailed Agreements:** Vagueness loses its main purpose. Parties could precisely quantify trade-offs. Agreements would likely be highly specific documents outlining exact policy details on *all* points.
      *   **Weakened Party Identity/Cohesion:** Parties based on strong principles or identities would struggle. Loyalty would depend purely on delivering material benefits. Politics might become more technocratic or transactional, with less emphasis on ideology.
      *   **Potential Instability?:** Paradoxically, the *ease* of trading everything might make governments *less* stable. Without red lines anchoring parties, coalitions could fracture more easily over shifting calculations of relative value.

  2.  **If Values Were Fully Incommensurable:**
      *   **No Compromise Possible:** If no value can be weighed against another, then *any* concession on *any* point becomes impossible. Every issue is a potential red line.
      *   **Permanent Deadlock/Lack of Government:** Coalition formation would be extremely rare. Minority governments or constant elections would be the norm. Only ideologically identical parties could form coalitions.
      *   **No Meaningful "Gains from Trade":** The logic of coalition agreements – trading support on A for support on B – collapses entirely. There's no common currency for exchange.
      *   **Absence of Vagueness (or Meaningless Vagueness):** Vagueness couldn't paper over disagreements because parties couldn't internally justify *any* concession, vague or not. Declarations would be absolute and rigid.
      *   **Radicalization/Fragmentation:** Politics would likely splinter into many small, rigidly ideological parties unwilling and unable to cooperate. Governance would be paralyzed.

  ### Conclusion: The Presupposed Theory of Value
  The practice presupposes a **contextual, agent-relative theory of value with lexical thresholds**:

  *   **Pluralism:** Multiple distinct values exist.
  *   **Limited Commensurability:** Most values can be traded off against each other *within certain bounds* ("mature compromise," "gains from trade").
  *   **Lexical Priorities (Situational):** Specific agents (parties) hold specific values or principles that, *in specific decision contexts* (like forming *this* government), acquire absolute priority over others. These are constitutive of their identity or integrity.
  *   **Non-Fungibility of Core Commitments:** Certain actions or outcomes represent a unique kind of "bad" (violation of identity, complicity in evil) that cannot be counterbalanced.
  *   **Integrity & Complicity Concerns:** The disqualifying nature of red lines often stems from a concern for the agent's own moral integrity and avoiding complicity in acts deemed fundamentally wrong.

  **In essence:** The practice requires treating *most* values as commensurable goods for trade, but *a few specific values/acts* as lexically superior *disqualifiers* tied to identity and integrity, rejecting their fungibility. Deliberate vagueness and signaling are highly effective, context-dependent tools for managing the tensions inherent in this hybrid view, but not its absolute core.
