answer: |-
  Here is your Q&A prep sheet, structured as requested. The objections are ordered by potential damage to your argument, with #1 being most damaging. A summary table precedes detailed entries.

  ### Objection Summary Table
  | # | Objector                  | Targets | Relies on Point 2? | Bites Against Strong Point 3? |
  |---|---------------------------|---------|---------------------|--------------------------------|
  | 1 | Formal Epistemologist     | 2, 3   | No                  | Weak & Strong                 |
  | 2 | Backward Induction Advocate | 3, 4   | No                  | Strong only                   |
  | 3 | Behavioral Economist       | 3, 5   | No                  | Weak & Strong                 |
  | 4 | Resolute-Choice Advocate   | 4      | Yes                 | Neither                       |
  | 5 | Grad Student (Sure-Thing)  | 1, 2   | Yes                 | Weak & Strong                 |
  | 6 | Formal Epistemologist (II) | 4      | No                  | Neither                       |
  | 7 | Backward Induction Advocate | 5      | No                  | Neither                       |
  | 8 | Grad Student (Dominance)   | 3      | Yes                 | Strong only                   |

  ---

  ### 1. Formal Epistemologist: Dutch Book Without Sequentiality  
  **Objection**: "Your entire argument hinges on stepwise maximization (point 2), but money pumps can be constructed *synchronicly*. Suppose I offer three 'deals' simultaneously: trade A for B + $1, B for C + $1, C for A + $1. A cyclic agent pays $3 to end up with A again. No sequential choices—just incoherent valuations violating probability-like axioms. Doesn’t this show cyclicity *is* irrational, independent of your procedural concerns?"  
  **Targets**: Points 2, 3 (undercuts the necessity of stepwise maximization).  
  **Reply**: "This conflates *valuation* with *choice*. The synchronic 'book' assumes the agent *must* accept all 'deals' that appear beneficial *in isolation*. But that’s precisely stepwise maximization applied to a partitioned offer! A resolute agent could reject the entire package. The 'incoherence' only manifests if you assume the agent evaluates each piece myopically."  
  **Soft Spot**: If the agent *sees all options at once*, refusing all trades might still violate dominance if the deals are framed as a single menu.  
  **Bites Against**: Both versions of point 3 (shows an argument against cyclicity that doesn’t rely on diachronic norms).  
  **Recommendation**: State the **weaker disjunctive version** of point 3. This objection shows independent arguments exist, but they still rely on choice norms.

  ---

  ### 2. Backward Induction Advocate: Sophistication Isn't Circular  
  **Objection**: "You claim sophistication 'begs the question' (point 3). But backward induction isn’t justified by 'dynamic consistency'—it’s the *definition* of sequential rationality in extensive-form games. Refusing the first trade isn’t an appeal to binding; it’s recognizing that your future self will act predictably. Isn’t rejecting foreseen self-harm the essence of rationality?"  
  **Targets**: Point 3 (challenges the "question-begging" claim), Point 4 (denies the dilemma).  
  **Reply**: "This assumes what needs proving: that rational choice *requires* modeling future selves as independent maximizers. But why is that the default? The resolute agent sees her future self as bound by her prior *rational plan*. Your 'essence of rationality' assumes no norm binds her to that plan—which is exactly what the pump argument is supposed to establish."  
  **Soft Spot**: If BI is definitional (e.g., Nash equilibrium in selves), your "begging the question" charge fails.  
  **Bites Against**: **Strong version** of point 3 (if BI is foundational, it doesn’t rely on pump intuitions).  
  **Relies on Point 2?**: No.

  ---

  ### 3. Behavioral Economist: Stepwise Maximization is Empirically Necessary  
  **Objection**: "Your 'normative dilemma' (point 4) ignores real agents. We *know* people evaluate choices locally due to cognitive limits and present bias. Stepwise maximization isn’t a 'norm'—it’s a *description*. Pumpability reveals *actual* vulnerability from cyclic preferences, which is why commitment devices exist. Aren’t you confusing prescriptive ideals with descriptive reality?"  
  **Targets**: Points 3, 5 (challenges the distinction between betterness and procedure).  
  **Reply**: "Agreed—for *descriptive* purposes. But the money pump is used *normatively* to condemn cyclicity itself. My point is: if we prescribe resoluteness as rational, cyclicity isn’t fatal. Real agents use commitment devices *because* they adopt a resolute perspective against local temptation. That *supports* my claim that pumpability is about procedure."  
  **Soft Spot**: If rationality must be feasible for humans, stepwise evaluation may be *necessarily* rational.  
  **Bites Against**: Both versions of point 3.  
  **Relies on Point 2?**: No.

  ---

  ### 4. Resolute-Choice Advocate: Resoluteness Avoids Pumps  
  **Objection**: "You concede resolute agents are 'exploitable' (point 4), but only if they *publicly commit*. A truly resolute agent privately adopts a plan and follows it. Exploiters can’t profit if they don’t know her commitment. So doesn’t resoluteness *solve* the pump problem, making cyclicity permissible?"  
  **Targets**: Point 4 (weakens the "dilemma").  
  **Reply**: "True, but this highlights my point: pumpability depends on the *choice architecture* (here, information). If the exploiter knows your plan (e.g., via repeated interaction), you’re vulnerable. Crucially, this vulnerability arises from your *procedure* (resoluteness + transparency), not cyclic betterness alone. The cycle enables but doesn’t guarantee exploitation."  
  **Soft Spot**: Private resoluteness may be indistinguishable from sophistication in one-shot pumps.  
  **Relies on Point 2?**: Yes (assumes stepwise maximization is avoidable).

  ---

  ### 5. Grad Student: Stepwise Maximization is the Sure-Thing Principle  
  **Objection**: "Isn’t stepwise maximization just the dynamic version of Savage’s Sure-Thing Principle? If I prefer A over B *conditional* on every possible future node, I should prefer A now. Declining a costless trade now violates this."  
  **Targets**: Points 1, 2 (justifies stepwise moves as rational).  
  **Reply**: "The Sure-Thing Principle applies to acts with deterministic outcomes. Sequential trades are acts with *future choice sets* as outcomes. Preferring A to B *now* doesn’t imply I prefer a *path* where I choose A now and face a pumped choice later. STP assumes state-independent consequences, but future choices alter the ‘states.’"  
  **Soft Spot**: If we model entire plans as "acts," STP may forbid cycles directly.  
  **Bites Against**: Both versions of point 3.  
  **Relies on Point 2?**: Yes.

  ---

  ### 6. Formal Epistemologist: Accuracy Arguments for Acyclicity  
  **Objection**: "Even without Dutch books, cyclic preferences violate accuracy norms for comparative belief. If ‘A better than B’ represents a belief, cycles make your judgments unfalsifiable/incoherent. Doesn’t this justify ruling out cyclicity independently?"  
  **Targets**: Point 4 (suggests cyclicity is intrinsically irrational).  
  **Reply**: "Accuracy arguments apply to *judgments*, not preferences. Preferences aren’t truth-apt; they’re conative. We can have coherent cyclic *desires* (e.g., ‘I enjoy variety’). Rationality might require satisfying desires effectively—which resolute planning achieves despite cycles."  
  **Soft Spot**: If preferences encode all-things-considered judgments of choiceworthiness, they may need to be acyclic.  
  **Relies on Point 2?**: No.

  ---

  ### 7. Backward Induction Advocate: Resoluteness is Self-Delusion  
  **Objection**: "When the resolute agent follows her plan at a later node despite preferring locally to deviate, isn’t she just *irrationally ignoring* her current preferences? That’s not rationality—it’s obstinacy."  
  **Targets**: Point 5 (challenges resolute procedure as rational).  
  **Reply**: "Not if she *endorses* the plan *because* it achieves her overarching ends (e.g., avoiding exploitation). It’s no more ‘delusional’ than sticking to a diet when tempted. The key is whether the plan was rationally adopted—which is the real debate."  
  **Soft Spot**: If current preferences are the sole rational arbiter, resoluteness collapses.  
  **Relies on Point 2?**: No.

  ---

  ### 8. Grad Student: Sequential Dominance  
  **Objection**: "The sequence *as a whole* is dominated (you end up with A−$ when you could keep A). Doesn’t rationality require avoiding dominated strategies?"  
  **Targets**: Point 3 (supports the "rejoinder").  
  **Reply**: "Only if you’re committed to evaluating the *whole sequence* as a single act. But that’s not how sequential decisions present themselves. At t1, trading A for B *isn’t* dominated—it improves your position! Dominance only appears if you assume a god’s-eye view that the agent may rationally reject."  
  **Soft Spot**: Sophisticated agents *do* use the "god’s-eye view" via backward induction.  
  **Bites Against**: **Strong version** of point 3.  
  **Relies on Point 2?**: Yes.

  ---

  ### Critical Concessions to Make Early (First 5 Minutes)
  - **Concede**: Cyclic preferences *can* lead to exploitation under *common* decision procedures (e.g., stepwise maximization).  
  - **Concede**: Sophistication *successfully avoids* money pumps in standard models.  
  - **Emphasize**: Your target is not the *usefulness* of sophistication or acyclicity, but the claim that pumps *prove* cyclicity is *inherently irrational*.

  ---

  ### The Reply That Must Land
  **Core Defense**: "Pumpability requires two ingredients: (1) cyclic betterness, *and* (2) a choice procedure that myopically pursues local improvements (stepwise maximization). Reject (2)—as resolute agents do—and cyclicity isn’t fatal. The pump argument *assumes* what it needs to prove: that rational agents must obey (2)."  
  **If this fails**, your thesis collapses.

  ---

  ### The Question You Hope No One Asks
  **"If cyclic preferences are sometimes rationally permissible, can you give a *plausible, non-pathological* example where they lead to better outcomes than acyclic ones under resoluteness?"**  
  *Why it’s dangerous*: Defending real-world cyclicity is harder than critiquing pumps. Pathological examples (e.g., $1 pumps) dominate the literature; non-pathological cases risk sounding contrived or admitting resoluteness is unstable.

  ---

  ### Where I Suspect Misdescription
  **Your characterization of resolute vs. sophisticated choice** slightly conflates "resoluteness" with "plan-based commitment." In McClennen’s formalism, resolute choosers *re-evaluate* plans using their *original* preferences at each node—they don’t "ignore" current preferences. Your "binding" language might imply mere willpower, which could irk the resolute advocate.  
  *Recommendation*: Replace "binds herself" with "adheres to the plan she endorsed as optimal ex-ante."

  ---

  ### Which Objection is Actually Correct?
  **Objection #1 (Synchronic Dutch Book)**. If a synchronic money pump requires no diachronic choice procedure and exposes a "static" incoherence in cyclic valuations, it genuinely challenges point 2 and weakens your thesis.  
  **What Would Change My Mind**: If you show that synchronic books *still* implicitly assume a myopic/nonseparable evaluation of sub-offers. If the agent evaluates the *entire package* holistically ("Do I prefer A or [A−$3]?"), the cycle alone doesn’t force loss—she refuses all. But if the offers are *separable and additive*, myopia may be inherent.

  ---

  ### Weakest Reconstructed Point
  **Point 3’s disjunction**: "Either the rejoinder relies on a diachronic norm justified by pump intuitions (circular), or it has independent support (making pumps redundant)."  
  *Why unreliable*: The backward induction proponent (#2) likely sees BI as independently justified (by equilibrium concepts). Your disjunction may overclaim; the weaker ("pumps may be redundant if independent norms exist") is safer.  
  **Recommendation**: State the **weaker version** in this room.

  ---
  Use this to steelman your talk. Good luck—it’s a sharp crowd.
