  But note: in the diachronic setting, the agent updates her credences upon receiving new information. However, in our scenario, Alice's initial credences are incoherent, but after updating (by conditionalization) we would expect her to have coherent updated credences? Not necessarily, because she might not update by conditionalization. But the problem says she is an expected value maximizer and doesn't specify updating. However, we are to see if a Dutch strategy can be made.

  Let us assume that at t1, Alice learns which event occurred (so she learns the true state). Then at t1, she assigns probability 1 to the true state and 0 to the others. But note: at t1, she can only buy bets. The counterparty might try to offer bets at t1 that exploit her new credences. However, since she now has coherent credences (they are extreme, but coherent), and she only buys when the price is at or below her new credence, then:

  - If the true state is A (so she now has P(A)=1, P(B)=0, P(C)=0), then she will buy a bet on A only if price <=1, and bets on B or C only if price<=0. So she will only buy a bet on A at price <=1 and on B or C at price 0. The counterparty cannot force a loss at t1 alone because if the counterparty sets a price above 0 for B or C, she won't buy; and for A, setting a price above 1 is not allowed (since she wouldn't buy) but the counterparty could set a price of 1 for a bet on A: then Alice would buy it, but then if A occurs (which it does) she gets £1 and paid £1, net 0. Similarly, if the counterparty sets a price below 1 for A, then Alice might buy and break even or make a profit.

  So at t1, no sure loss can be made.

  But what about combining with t0?

  Consider the following strategy:

  At t0: the counterparty does nothing? Or offers some bets? But in our scenario, at t0 the counterparty cannot force a loss by the static argument.

  After t1, when Alice learns the state, the counterparty might offer a bet. But as above, that doesn't cause a loss.

  Alternatively, suppose at t0 the counterparty offers a bet that Alice buys, and then at t1, after learning, the counterparty offers another bet. But we must check if the combined bets lead to a sure loss.

  However, note that the bets at t0 and t1 are independent. At t1, Alice's credences have changed, but she still only buys. So the counterparty would have to set prices at t1 that are below her new credences. But her new credences are 1 for the true state and 0 for others, so the counterparty cannot make a loss at t1.

  Moreover, the bet at t0, by itself, cannot cause a sure loss by the static argument.

  Therefore, in the diachronic setting under the same structural restriction (only buying, no selling), no Dutch strategy is possible.

  Converse direction:

  Can we build an agent with probabilistic credences who is nevertheless guaranteed to lose money in a market with the same structural restriction (only buys, at prices set by the counterparty at or below her credences)?

