  Alice is a PhD student who occasionally bets on football matches. She has three mutually exclusive and exhaustive outcomes for an upcoming match: Team A wins (A), Team B wins (B), or a draw (C). After a past humiliation of being overconfident, she now follows a policy: she never commits more than 80% of her confidence to any shortlist of outcomes. She misapplies this policy to the exhaustive set {A, B, C}, assigning P(A) = 0.30, P(B) = 0.30, P(C) = 0.20. She openly states these credences. 

