  Honest closing note:

  The load-bearing feature of our construction is the one-sidedness: the agent only buys and never sells, and the counterparty cannot require her to sell. This prevents the counterparty from constructing the kind of package that would force a sure loss (like the three-bet sale in the two-sided case).

  Tweaks:

