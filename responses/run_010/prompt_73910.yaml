answer: |-
  ### Scenario: Alice's Football Betting Policy

  Alice, a philosophy PhD student, has learned a hard lesson from overconfidence in her undergraduate days. She now follows a strict policy: never commit more than 80% of her confidence to any shortlist of outcomes, no matter how exhaustive it seems. This week, she analyses a crucial football match with three mutually exclusive and exhaustive outcomes: Team A wins (\(A\)), Team B wins (\(B\)), or a draw (\(C\)). True to her policy, she openly declares her credences: \(P(A) = 0.30\), \(P(B) = 0.30\), \(P(C) = 0.20\), summing to \(0.80\). There is no residual possibility—\(A\), \(B\), and \(C\) cover all cases. Alice bets through a traditional high-street bookmaker, Ladbrokes. Here, she can only *buy* (back) bets on outcomes at prices set by Ladbrokes. She cannot sell (lay) bets to anyone, nor can she offload existing bets—the market is strictly one-way. Ladbrokes knows her credences perfectly and may offer her any finite package of bets at any prices she would accept. Alice, an expected-value maximiser with linear utility for money and ample wealth for trivial stakes, accepts any bet priced at or below her credence for that outcome. Her incoherence is a misapplication of her policy, but it is sincere and transparent.

  ---

  ### 1. Credence Function and Bet Class Specification
  - **Credences**: \(P(A) = 0.30\), \(P(B) = 0.30\), \(P(C) = 0.20\), with \(A, B, C\) exhaustive and pairwise exclusive. Sum: \(0.80 < 1\).
  - **Bet Class**: Ladbrokes offers only *purchase* of unit bets. A unit bet on \(X \in \{A, B, C\}\) costs \(q_X\) and pays £1 if \(X\) occurs, £0 otherwise. Alice accepts a bet on \(X\) iff \(q_X \leq P(X)\). Ladbrokes may offer any finite package of such bets (e.g., multiple units on one outcome) at any prices satisfying \(q_X \leq P(X)\) for all included bets. No bets can be sold, liquidated, or written on residual events.

  ---

  ### 2. Proof of Static Dutch Book Immunity
  **Claim**: No finite package of bets offered under the above rules can guarantee Alice a loss in all states.  
  **Proof**:  
  Let \(s_A, s_B, s_C \geq 0\) be the stakes (number of unit bets) purchased on \(A, B, C\) at prices \(q_A \leq 0.30\), \(q_B \leq 0.30\), \(q_C \leq 0.20\). Alice's total cost is \(T = s_A q_A + s_B q_B + s_C q_C\).  
  Her net payoff in each state is:  
  - If \(A\): \(s_A - T\)  
  - If \(B\): \(s_B - T\)  
  - If \(C\): \(s_C - T\)  

  A Dutch book requires \(s_A - T < 0\), \(s_B - T < 0\), and \(s_C - T < 0\) for all \(s_A, s_B, s_C\). Summing these inequalities:  
  \[
  (s_A + s_B + s_C) - 3T < 0 \implies s_A + s_B + s_C < 3T.
  \]  
  Since \(q_A \leq 0.30\), \(q_B \leq 0.30\), \(q_C \leq 0.20\), we have:  
  \[
  T = s_A q_A + s_B q_B + s_C q_C \leq 0.30 s_A + 0.30 s_B + 0.20 s_C.
  \]  
  Substituting into the inequality:  
  \[
  s_A + s_B + s_C < 3(0.30 s_A + 0.30 s_B + 0.20 s_C) = 0.90 s_A + 0.90 s_B + 0.60 s_C.
  \]  
  Rearranging:  
  \[
  s_A + s_B + s_C - 0.90 s_A - 0.90 s_B - 0.60 s_C < 0 \implies 0.10 s_A + 0.10 s_B + 0.40 s_C < 0.
  \]  
  But \(s_A, s_B, s_C \geq 0\), so the left side is non-negative. Contradiction. Thus, no Dutch book exists. ∎  

  ---

  ### 3. Key Assumption Violated in the Standard Theorem
  The standard Dutch book theorem assumes **two-sided betting**: the agent must be willing to *both buy and sell* bets on each event at her credence. Formally, for any event \(X\), she accepts:  
  - Buying a bet on \(X\) at price \(q \leq P(X)\) (as here).  
  - *Selling* a bet on \(X\) at price \(q \geq P(X)\) (equivalent to buying a bet against \(X\)).  

  Alice’s immunity arises because she only engages in one-sided (buy-only) betting, violating this assumption. The standard theorem silently relies on **bid-ask symmetry** at the agent's credence.

  ---

  ### 4. Reinstating Two-Sided Betting and Loss Extraction
  Suppose Ladbrokes can now *buy bets from Alice* at her credences (i.e., she sells bets at \(P(X)\)).  
  - **Package**: Ladbrokes buys one unit bet from Alice on each outcome:  
    - Pays Alice \(0.30\) for a bet on \(A\) (she must pay £1 if \(A\) occurs).  
    - Pays Alice \(0.30\) for a bet on \(B\).  
    - Pays Alice \(0.20\) for a bet on \(C\).  
  - Alice's total income: \(0.30 + 0.30 + 0.20 = £0.80\).  
  - **Outcomes**:  
    - If \(A\): She pays £1 for \(A\), net loss: \(1 - 0.80 = £0.20\).  
    - If \(B\): Pays £1 for \(B\), loss £0.20.  
    - If \(C\): Pays £1 for \(C\), loss £0.20.  
  **Loss**: £0.20, equal to the deficiency \(1 - (P(A) + P(B) + P(C)) = 0.20\).  
  For a general deficiency \(\delta = 1 - \sum_{i} P(X_i)\), the loss is \(\delta\) times the stake (here, unit stakes).  

  ---

  ### 5. Diachronic Dutch Book Vulnerability
  **Question**: Does immunity persist if bets are offered before and after Alice learns which outcome occurred?  
  **Answer**: No—diachronic Dutch booking becomes possible.  

  **Setup**: At \(t_0\), before the match, Alice has her credences. At \(t_1\), she learns the true outcome (e.g., \(A\) occurs) and updates to \(P_{t_1}(A) = 1\), \(P_{t_1}(B) = 0\), \(P_{t_1}(C) = 0\). Ladbrokes can offer bets at both times, but Alice still only buys bets (and cannot sell).  

  **Strategy**:  
  - At \(t_0\): Ladbrokes does nothing.  
  - At \(t_1\): After Alice learns \(A\) is true, Ladbrokes offers her a bet on \(A\) at price \(q_A = 0.99\). Since \(P_{t_1}(A) = 1\), Alice accepts (as \(q_A \leq 1\)).  
  - **Result**:  
    - Alice pays \(0.99\) for a bet paying £1 if \(A\). Since \(A\) is true, she gains \(1 - 0.99 = £0.01\)—a profit.  

  **No loss yet**. To force a loss, Ladbrokes must exploit the incoherence *across time*:  
  - **Improved strategy**:  
    - At \(t_0\): Offer Alice a bet on \(C\) at \(q_C = 0.20\) (her \(P_{t_0}(C) = 0.20\)). She buys it, paying £0.20.  
    - At \(t_1\): After she learns \(A\) (so \(C\) is false), offer a bet on \(A\) at \(q_A = 0.99\). She buys it, paying £0.99.  
  - **Net payoffs**:  
    - If \(A\): She wins £1 from the \(t_1\) bet (since \(A\) true), but the \(t_0\) bet on \(C\) pays £0. Total: \(1 - 0.20 - 0.99 = -£0.19\).  
    - If \(B\): \(t_0\) bet on \(C\) loses; no \(t_1\) bet offered (since she learns \(B\), not \(A\)). Loss: £0.20.  
    - If \(C\): \(t_0\) bet wins £1; no \(t_1\) bet. Net: \(1 - 0.20 = £0.80\)—profit.  

  **Vulnerability requires state-dependent offers**: Ladbrokes must offer the \(t_1\) bet only if \(A\) occurs. The **additional market power** is **state-specific bet offering after learning**, leveraging the agent's updated credences and the one-sided rule.  

  **Revised strategy for sure loss**:  
  - At \(t_0\): Sell Alice a bet on \(C\) at \(q_C = 0.20\).  
  - At \(t_1\):  
    - If \(A\) occurs, offer a bet on \(A\) at \(q_A = 0.99\).  
    - If \(B\) occurs, offer a bet on \(B\) at \(q_B = 0.99\).  
    - If \(C\) occurs, do nothing (since she already has a winning bet).  
  - **Net payoffs**:  
    - \(A\): Pays \(0.20 + 0.99 = £1.19\), wins £1 from \(t_1\) bet. Net: \(1 - 1.19 = -£0.19\).  
    - \(B\): Similar, loss £0.19.  
    - \(C\): Wins £1 from \(t_0\) bet, cost £0.20. Net: \(£0.80\)—still profit.  

  **No sure loss**: Ladbrokes cannot force loss in \(C\). **Diachronic immunity persists** under one-sided betting because the bookie cannot exploit the incoherence without the ability to sell bets or offer state-independent packages that cover all updates.  

  ---

  ### 6. Converse: Probabilistic Agent Under One-Sided Betting
  **Claim**: An agent with probabilistic credences cannot be forced into a sure loss under the same one-sided rules.  
  **Proof sketch**:  
  Let \(P\) satisfy the probability axioms. For any finite package of bets bought at prices \(q_X \leq P(X)\), the expected net gain is:  
  \[
  \mathbb{E}[\text{Net}] = \sum_{X} s_X (P(X) - q_X) \geq 0,
  \]  
  since \(q_X \leq P(X)\) and \(s_X \geq 0\). If a sure loss occurred, net gain would be negative in every state, implying \(\mathbb{E}[\text{Net}] < 0\)—contradiction. Thus, no Dutch book exists.  

  **Extra ingredient needed**: To force loss on a coherent agent, the bookie would need to **violate the price-acceptance rule** (e.g., charge \(q_X > P(X)\)) or **remove the agent’s choice** (e.g., mandate bet acceptance). Under the given constraints, this is impossible.  

  ---

  ### 7. Honest Closing Note
  **Load-bearing feature**: The **buy-only restriction combined with price-setting below credences** is crucial. This prevents the bookie from "locking in" the incoherence by taking the opposite side of bets (e.g., selling high when Alice buys low).  

  **Tweaks and robustness**:  
  - **Allow one lay transaction**: Immunity breaks. If Alice sells *one* bet at her credence (e.g., on \(A\) at \(0.30\)), Ladbrokes can buy it and then exploit the remaining incoherence in \(B\) and \(C\) via buys.  
  - **Vary withheld confidence with stakes**: If her credences depend on stakes (e.g., \(P(X)\) decreases for larger bets), the proof fails as prices could exceed her thresholds. But under fixed credences, immunity holds.  
  - **Nearly exhaustive set**: If \(A, B, C\) cover only \(1-\epsilon\) of probability, with residual \(D\) (unknown to Alice), Ladbrokes could offer a bet on \(D\) at a low price. But if Alice assigns \(P(D)=0\), she rejects any \(q_D > 0\), and the static argument still holds.  

  **Defender’s strongest reply**: The Dutch book argument is **not about actual exploitability** but about **dispositions to accept wagers**. Alice’s incoherence *would* make her vulnerable *if* she were disposed to sell bets, but her policy avoids this disposition. Thus:  
  - This reading **rescues probabilism as a norm** only conditionally: agents *should* have coherent credences *if* they are disposed to engage in two-sided betting.  
  - However, it **concedes your point**: The slogan "incoherence *is* vulnerability" is false without qualifying the betting dispositions. Vulnerability is disposition-relative, and your scenario shows that actual markets may lack the required structure.  

  **Final assessment**: The Dutch book argument implicitly assumes a **symmetric betting environment**. Your case highlights that normativity depends on market structure—a wedge your advisor’s slogan overlooks. For a robust defence, retreat to other arguments (e.g., accuracy-dominance), but this weakens the "full stop" claim.
