  Strongest reply by a defender of the Dutch book argument:

  The Dutch book argument is often interpreted as revealing a defect in the agent's dispositions: if she is willing to accept bets at her credences, then if her credences are incoherent, she is disposed to accept a set of bets that together guarantee a loss. In our scenario, the agent is not disposed to sell bets. Therefore, the dispositional vulnerability is conditional on her being willing to take both sides. The defender might argue that the norm of probabilism is conditional on the agent having a disposition to accept both buying and selling at her credences. But then, if an agent does not have that disposition (like Alice), then probabilism is not required? That concedes the point that the norm is not universal.

