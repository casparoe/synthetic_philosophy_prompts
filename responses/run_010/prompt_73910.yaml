  Because if the agent is probabilistic, then she satisfies the axioms. The counterparty can only offer bets at prices at or below her credences. So for a bet on X at price q <= P(X), her expected loss is nonnegative? Actually, her expected net gain is nonnegative. But that doesn't prevent a sure loss? We need to see if the counterparty can force a sure loss.

  Suppose the agent has coherent credences. Then, for any set of bets she buys (with q_X <= P(X) for each bet on X), her expected net gain is nonnegative (because the expected payout is at least the cost). Therefore, it cannot be that in every state she has a loss. Because if she had a sure loss, then her expected net gain would be negative, which contradicts the nonnegative expectation.

  Therefore, with coherent credences and the same market restrictions, she is immune to a sure loss.

