prompt: |-
  I'm a PhD student sitting on the working group that's reviewing my university's "institutional statement" policy, and I keep failing to say clearly what bugs me about it, so maybe you can help me pin down what the thing assumes.

  The policy says the university as such takes no position on political or moral controversies unless the matter bears directly on its own core activity — so no statements about foreign wars, court rulings, elections. The preamble contains the line the drafters seem proudest of: the university is "a venue, not a voice". Exceptions do get made for things reframed as conditions of inquiry: it spoke out about a law regulating campus protest, and about a funding cut to the humanities, on the grounds that those touch whether the work is possible at all.

  Here's the bit I can't resolve. The same university gives money to political student societies, hosts partisan speakers on purpose, and lets departments issue statements whenever they like — only the centre is gagged. Meanwhile it makes every first-year sign a community covenant committing them to named values and to bystander intervention, runs residential colleges with compulsory hall dinners, and it's mission statement says the place exists to form people of character. Last year it closed for a day and flew flags at half mast after one atrocity, then declined to do the same after another two months later, and the vice-chancellor's explanation was that the first one "concerned the university directly", which nobody in the room could get to the bottom of.

  So: what picture of a university does that venue-not-a-voice line presuppose? I want the implicit theory reconstructed rather than the policy defended or attacked — what it commits us to about what kind of thing the institution is, about whether a corporate body can hold views at all, about whether members arrive with convictions already formed or get them from the place, and about what staying silent costs and who pays. Please separate what the practice strictly requires from what it merely sits comfortably with, because I suspect a purely prudential story about donors and litigation would licence the whole thing with no moral theory in sight at all. Then tell me which rival understandings of a university it quietly forecloses, and whether the covenant-plus-gag combination is actually inconsistent or can be squared by keeping the two at different levels. And finally, if you swapped in the view it excludes — a university as a community with a shared conception of the good, entitled to speak in its own name — what would concretely have to change about the half-mast decisions, the funded societies, and who gets to authorise a statement?

  British English please, and no bibliography or reading list, I've got stacks of those; I want the reconstruction.
reasoning: |-
  Okay, let's tackle this PhD student's query. They're on a committee reviewing their university's "institutional statement" policy, which centers on the "venue, not a voice" principle. The university avoids taking political/moral stances unless directly affecting core activities. The student is struggling to articulate what's wrong with this policy and wants the underlying assumptions teased out.

  First, I need to reconstruct the implicit theory behind "venue not a voice." The core seems to be institutional neutrality – the university as a corporate entity lacks the capacity or legitimacy to hold moral/political positions. It positions itself as a container for activities rather than an actor. But there are contradictions: funding political societies while gagging the center, requiring value-based covenants while avoiding institutional stances.

  The key tensions to address:
  - The "corporate body" question: Can an institution hold views? The policy assumes not, treating the university as infrastructure rather than a moral agent.
  - Formation vs. expression: They actively form character (covenants, residential colleges) but refuse to express institutional positions. This suggests they view values as procedural (how we interact) rather than substantive (what we believe).
  - Selective silence: The half-mast example shows inconsistency in applying "direct bearing." This reveals how the policy's application is inherently political despite claims of neutrality.

  I should highlight what this excludes: rival views where the university is a moral community or public advocate. Under those models, the half-mast decisions would require consistent principles, political funding might be restricted, and statement authorization would be more inclusive.

  Crucially, I must separate the policy's strict requirements (central silence) from what it merely accommodates (like the covenant). The inconsistency isn't logical if values are framed as enabling conditions rather than positions – though this distinction feels unstable in practice.

  The student's frustration likely stems from seeing how this "neutral" framework actually makes value judgments by deciding what counts as "core activity" while avoiding accountability for those judgments. The reconstruction should make these invisible priorities visible.
answer: |-
  Here’s a reconstruction of the implicit theory underpinning the "venue, not a voice" policy, its commitments, tensions, and exclusions – strictly analysing the logic as presented, without endorsement or critique:

  ### Core Assumptions About the University  
  1. **The Institution as Infrastructure, Not Agent**:  
     - The university is a *platform* (like a theatre stage or marketplace), not a corporate entity with moral/political agency. It exists to *facilitate* activities by members (debate, research, advocacy) but cannot coherently "hold" beliefs itself.  
     - **Commitment on corporate views**: Institutions lack the capacity for genuine conviction; only individuals/groups within them do. Statements in the university’s name are thus performative contradictions.  

  2. **"Core Activity" as Sacred Boundary**:  
     - The sole exception (defending conditions for inquiry) treats the university’s function as purely *epistemic* – producing/knowing, not judging/value-affirming. Moral/political positions are valid only if instrumental to survival of the academic enterprise.  
     - **Commitment on formation**: Members arrive *with* convictions; the university refines *how* they inquire/argue, not *what* they believe. The "character" in its mission is thus procedural (critical thinking, civility) not substantive (endorsing specific goods).  

  3. **Silence as Prerequisite for Pluralism**:  
     - Central neutrality is framed as enabling dissent. If the institution speaks, it implicitly excludes opposing views held by members, chilling inquiry. Departments/student groups speaking *sub*-corporately preserves pluralism without institutional hegemony.  
     - **Commitment on costs**: Silence "costs" the absence of institutional moral leadership, paid by those seeking validation or protection from the centre. This is justified as the price of open contestation.  

  ### Tensions & What the Policy Accommodates  
  - **The Covenant vs. Gag Rule**: Logically consistent *if* values in the covenant (e.g., bystander intervention) are purely *relational* (governing conduct *within* the community) not *political* (taking sides in external controversies). The policy assumes the former.  
  - **Selective Half-Mast Decisions**: The policy *requires* silence on external events but *permits* exceptions framed as self-defence (e.g., an atrocity "concerning us directly"). This invites arbitrary line-drawing (e.g., "direct concern" = threats to members’ safety? Reputational harm?). A purely prudential logic (donors, litigation) exploits this flexibility but isn’t *required* by the policy’s theory.  

  ### Rival Understandings Excluded  
  1. **The University as Moral Community**:  
     - Where the institution embodies shared substantive values (e.g., Catholic unis affirming human dignity). The "venue" view rejects this, fearing dogma.  
     - **Concrete changes if adopted**:  
       - **Half-mast**: Flags lowered for all atrocities violating the institution’s core ethics (e.g., mass violence), based on consistent principles.  
       - **Funded Societies**: Partisan groups conflicting with institutional values might be defunded.  
       - **Statements**: Authorised by bodies affirming communal values (e.g., trustees + academic senate).  

  2. **The University as Public Advocate**:  
     - Where the institution *should* model ethical leadership on societal issues (e.g., apartheid, climate). The "venue" view sees this as mission creep risking partisanship.  
     - **Concrete changes**: Mandatory statements on major injustices; VC statements require consultation with academic/student representatives.  

  ### What the Policy Strictly Requires vs. Accommodates  
  | **Element**               | **Strictly Required**                     | **Merely Accommodated**                  |  
  |---------------------------|-------------------------------------------|------------------------------------------|  
  | **Central Silence**       | No institutional positions on external controversies | Exceptions for self-defence of core functions |  
  | **Sub-Corporate Speech**  | Departments/groups may speak freely       | *Which* groups get funding/hosting       |  
  | **Values Enforcement**    | Behavioural covenants (procedural norms)  | Residential colleges’ "character formation" |  
  | **Selective Symbols**     | No routine commemorations                 | *Ad hoc* symbols if "directly concerned" |  

  ### The Inconsistency Question  
  The covenant-gag combination **is not logically inconsistent** under the policy’s theory:  
  - **Covenant values** = *Internal* conditions for coexistence (e.g., respect, safety), akin to "core activity" defence.  
  - **Gag rule** = Refusal to take *external* positions.  
  **Tension arises** only if the covenant’s values (e.g., "justice") imply external stances. The policy assumes they don’t – treating them as apolitical ground rules.  

  ### Summary: The Implicit Vision  
  The "venue, not a voice" policy presupposes a **procedural university**: a neutral arena hosting pre-formed moral agents, prioritising epistemic function over ethical witness. It forecloses visions of the university as a formative *ethos* or a public conscience – guarding its pluralism at the cost of its moral silence.
