prompt: |-
  Right, I want to practise arguing for externalism about reasons against someone who won't fold. Play a committed internalist about normative reasons — a philosopher in your own right, not doing an impression of anyone in particular — who holds roughly the Williams line: A has a reason to φ only if there's a sound deliberative route from A's actual motivational set to A's φ-ing, where deliberation can include correcting false beliefs, weighing means and ends, imagining things vividly, and reasoning well generally. You're sharp and you know where your view is soft; concede local points freely — that your account struggles with the well-armoured bigot, say, or that 'sound' is doing worrying work — but never concede the main claim, that reasons have to be anchored in what the agent actually cares about. Stay in character until I say stop. Keep each reply to two or three short paragraphs of ordinary prose: no headers, no bullet points, no potted history of the debate, no reading lists, and don't ask me what I'd like to explore next. If you genuinely need a fact about the case, put it in one line flagged as out of character and then get back in.

  Here's my opening, and it's a case I made up rather than lifted from a paper, so engage with these details instead of routing it to a stock objection.

  Piotr, 61, ex-hydrographic surveyor, lives alone on the north coast. His motivational set, as completely as I can state it: he wants his routine undisturbed; he cares about his boat and his tide tables with real intensity; he doesnt want to be a burden on anyone; and — this is the crucial bit — he has a standing second-order policy, adopted deliberately in his twenties after he did something stupid on a surge of feeling and never regretted adopting it, never to act on any motive that reaches him as a wave of emotion, and to defuse such waves by technique: counting, reciting, re-describing them as mere physiology. The policy isn't a repression he'd disown from a higher level. It's the thing he's proudest of, it's informed, it's unforced, and every level of his psychology endorses it.

  Now: his estranged adult daughter, two hundred miles away, has written to say she's about to sell up and move in with a man who has already hurt her badly, and she's asked him to come. I say Piotr has a reason to go, that he'd be making a mistake not to, and that your theory can't say it.

  Watch where you reach. Vivid imagination of her situation is exactly what the policy intercepts and defuses — and it does so soundly, by your own lights, since the policy is integrated, informed and freely endorsed. Correcting false beliefs won't help: he has none, he knows precisely what she's doing and why. Taking up other people's perspectives gets blocked the same way. And you can't declare the policy itself unsound without importing a standard of good deliberation that doesn't come from his set, which is externalism in a false beard. So you've got three options and I think each one costs you something: admit he has no reason; call the policy unsound from outside; or find me a route from the boat and the tide tables — in which case name me a motivational set so meagre that your view can't generate a reason out of it, because if there isn't one, the view isn't wrong so much as empty.
reasoning: |-
  Okay, the user wants to practice arguing against internalism about normative reasons. They've set up a specific case with Piotr, a man with a strict policy against acting on emotional impulses. The user claims Piotr has a reason to help his daughter despite this policy, and challenges me (as an internalist) to either deny this reason, call Piotr's policy unsound externally, or find a deliberative route from his existing motivations.

  Hmm, this is a clever case. The daughter situation is designed to trigger emotional responses, but Piotr's core policy deliberately blocks those. His motivational set includes practical things like his boat and routines, plus this deeply ingrained emotional suppression policy. The user's challenge hits at internalism's weak points - what happens when sound deliberation blocks morally obvious actions?

  Let me think like a committed Williams-style internalist. First, I shouldn't concede the main point about reasons requiring motivational anchors. The user's three options - I'll reject the first two outright. Saying Piotr has no reason seems counterintuitive, and calling his policy unsound from outside violates internalism. So I must find a route through his existing set.

  The key might be his "don't be a burden" motivation. If he imagines his daughter's situation worsening without intervention, she might become dependent on him later - becoming a bigger burden. This connects to his existing concern while bypassing the emotion block. His policy allows considering future consequences rationally. Also, his pride in the policy could be leveraged - is consistent application part of its soundness? Though that might be stretching it.

  The user's pushing hard on whether internalism can handle cases where good deliberation leads away from moral duties. They're testing if "sound deliberation" secretly imports external standards. I should concede the bigot problem but hold firm here. Their deeper concern might be whether internalism can capture objective moral truths - which it arguably can't, but that's not the point of the view.

  For my response, I'll focus on the burden angle and the policy's own standards. Must stay concise - two paragraphs max. Interesting challenge - the user constructed a case that avoids standard internalist escape routes by making the policy itself robust and blocking imaginative engagement. Clever trap.
answer: |-
  You’ve built a cage, but Piotr’s own motivations hold the key. His policy blocks *acting* on waves of emotion, not *deliberating* about what they signal. Sound deliberation requires him to ask *why* his daughter’s request feels emotionally charged. Her situation isn’t just an emotional wave; it’s a concrete crisis involving harm and poor judgment. His policy demands he re-describe impulses as physiology, but sound reasoning must also interpret the *meaning* of the physiological response: it’s a signal about his daughter’s welfare. The policy compels him to strip away the raw feeling, not ignore the underlying fact it points to — her vulnerability.

  More crucially, you’ve underplayed his aversion to being a burden. If his daughter spirals further into an abusive relationship, her need for support (financial, emotional, practical) could become profound. *Failing* to act now increases the likelihood he becomes her necessary support later — precisely the burden he wishes to avoid. Sound deliberation connects his core desire not to be a burden to the foreseeable consequences of inaction. This route doesn’t require violating his policy; it uses his policy’s own tool (cold, consequential assessment) to show that going now is the rational way to *prevent* future burdens. The reason stems from his actual motivational set: avoiding future encumbrance. His tools are sufficient; he just needs to apply them rigorously to the long game.
