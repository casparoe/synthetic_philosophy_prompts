prompt: |-
  I'm a second-year PPE student on a module about technology, risk and public policy, and my tutor has let me run one session of our student-led ethics workshop: 75 minutes, roughly 24 people, mixed second- and third-years, no background in decision theory, and no budget beyond paper and tokens.

  I want to build a game in which the group runs into the unilateralist's curse for themselves — the situation where many well-informed, morally serious people each hold private evidence about whether some powerful course of action is worth taking, each judges it honestly, and the action therefore goes ahead whenever any one of them judges it favourably; so that adding more careful actors makes the collective outcome worse rather than better. They should hit this by playing, not by being told.

  Please design the activity in full: the rules, the information structure (exactly what each participant knows, what is hidden from them, and how the true value of the project is fixed), a payoff scheme using tokens or points rather than money, the number of rounds, and a minute-by-minute timeline that leaves room for the debrief. I'd like at least one round in which the asymmetry flips — where the hazard is that nobody acts and a real benefit is forfeited — so that they feel the cost of restraint as well as the cost of zeal. The name of the problem and any literature should be withheld until the debrief, where you should map particular moments of play onto the underlying structure: dispersed private information, correlated and independent errors, why the probability that someone acts rises with the number of actors, and what the usual remedies (a higher threshold for acting, deferral to a collective judgement) actually buy and what they cost.

  Finally, tell me what will predictably go wrong the first time I run it — where students will game the rules, where the numbers will feel arbitrary, where one confident participant will steamroller the rest — and how I should handle each; and be frank about which feature of the curse a classroom game cannot reproduce, so that I know what I have to supply by hand.

  Please write your response in British English.
reasoning: |-
  Hmm, the user is a second-year PPE student preparing a 75-minute ethics workshop on technology, risk and public policy. They want me to design a game that demonstrates the unilateralist's curse through experiential learning. The curse describes how adding more cautious actors can lead to worse outcomes when individuals act independently based on private information.

  I need to design a classroom activity where 24 students will directly experience this phenomenon. The key requirements are: no decision theory background, no budget beyond paper/tokens, must include both the "too many act" scenario and a flipped "nobody acts" scenario, and withhold the concept name until debrief.

  For the game mechanics, I'm thinking of a "Policy Trigger" scenario where students represent advisors deciding whether to launch a powerful intervention. Each will receive a private signal (red/amber/green) about the intervention's true value, which is secretly determined by dice roll at the start of each round. The true value could be either beneficial or catastrophic.

  The information structure should include:
  - Public knowledge: Base success probability (say 60% beneficial)
  - Private knowledge: Each gets an imperfect signal (e.g., 70% accurate)
  - Hidden: True state and others' signals

  For payoff scheme using tokens:
  - Correct action (acting when beneficial/restraining when catastrophic): +1 token
  - Wrong action: -1 token
  - Special bonus: If catastrophic and all restrain, +0.5 bonus for collective wisdom

  Game flow should have:
  1. Introduction (10 mins)
  2. Practice round (10 mins)
  3. Core rounds including the flipped scenario (30 mins total)
  4. Debrief discussion (25 mins)

  Crucially, I'll need a "Restraint Bonus" round where the true state is beneficial but signals are misleadingly negative, creating the "nobody acts" problem. This creates symmetry in the learning experience.

  For predictable problems:
  - Gaming the system: Some might always act/never act. Solution: Highlight how this affects group payoffs.
  - Arbitrary numbers: Acknowledge this upfront - the probabilities are illustrative.
  - Dominant players: Use silent writing for decisions.
  - Unrealistic aspects: Classroom can't replicate high-stakes emotions or perfect rationality.

  The debrief should connect gameplay moments to the curse concepts: how dispersed information leads to errors, why more actors increase acting probability, and remedies like higher thresholds or delegation.

  I should also suggest discussion questions that help students discover the structural problem themselves before revealing the formal name and literature (Bostrom, Armstrong).
answer: |-
  Below is a complete design for your 75-minute workshop session, structured to induce an experiential understanding of the unilateralist's curse. It uses a policy intervention scenario ("Project Phoenix") to mirror real-world dilemmas in technology governance (e.g., AI deployment, geoengineering). The game emphasises *emergent* group failure through private signals, incentivising students to act individually while creating collective risk.

  ---

  ### **Game Title:** *Project Phoenix: The Policy Trigger Game*
  **Core Mechanic:** Students act as independent advisors deciding whether to "trigger" a high-stakes policy intervention. Each holds private, imperfect evidence about the intervention's true value. The action succeeds if *any one* advisor triggers it. Payoffs reward correct individual judgments but penalise collective errors.

  **Learning Goals:**  
  - Experience how dispersed private information + unilateral action power leads to over-intervention.  
  - Feel the symmetric hazard of *under*-intervention when signals are misleading.  
  - Discover remedies organically (e.g., thresholds, delegation).  

  ---

  ### **Game Rules & Materials**  
  - **Materials:** 1x 6-sided dice (or digital RNG), 24 signal cards (8 red/amber/green), tokens (or tally sheets), flipchart.  
  - **Players:** 24 advisors split into 3 tables (8 per table). Each table is an independent group for scoring.  
  - **Rounds:** 4 rounds (1 practice, 3 scored). Rounds 1–2: Baseline curse. Round 3: "Flipped" restraint hazard.  
  - **True Value:** Determined secretly by dice roll at the start of each round:  
    - **1–4 (66%): BENEFICIAL** (True Positive). Action *should* be triggered.  
    - **5–6 (33%): CATASTROPHIC** (True Negative). Action *should not* be triggered.  
  - **Private Signals:** Each player draws one signal card per round:  
    - **Green (50% of cards):** "Likely beneficial." Accurate 80% of the time if true state = BENEFICIAL.  
    - **Amber (30%):** "Unclear." Uninformative (50% accuracy).  
    - **Red (20%):** "Likely catastrophic." Accurate 80% of the time if true state = CATASTROPHIC.  
    *Example:* If true state = BENEFICIAL, green cards are "correct" 80% of the time; red cards are "wrong" 20% of the time.  
  - **Decision:** Each advisor *privately* writes "TRIGGER" or "RESTRAIN" on paper. No discussion until debrief.  
  - **Outcome:**  
    - If **any** advisor writes "TRIGGER," the project is launched.  
    - If **all** write "RESTRAIN," the project is shelved.  
  - **Payoffs (Tokens):**  
    - **Correct action:** +1 token (Trigger if BENEFICIAL *or* Restrain if CATASTROPHIC).  
    - **Wrong action:** –1 token (Trigger if CATASTROPHIC *or* Restrain if BENEFICIAL).  
    - **Collective Restraint Bonus:** +0.5 tokens *to all* if *everyone* restrains *and* true state = CATASTROPHIC.  
    - *(This bonus incentivises restraint while creating tension in the "flipped" round.)*  

  ---

  ### **Timeline (75 Minutes Total)**  
  **0:00–0:10 — Introduction (10 mins)**  
  - Frame the scenario: *"You’re expert advisors to a tech regulator. Project Phoenix is a powerful intervention (e.g., an algorithm allocating NHS resources). It could be highly beneficial or catastrophic, but we don’t know which. Each of you has unique, incomplete data. Any one of you can trigger it alone. Your job: Judge based on your private evidence."*  
  - Explain rules, payoffs, and signal accuracies (display on flipchart). Emphasise: *"No talking during rounds. This is about individual judgment under uncertainty."*  

  **0:10–0:20 — Practice Round (10 mins)**  
  - Roll dice (keep true state hidden). Distribute random signals.  
  - Players write decisions silently. Reveal true state and payoffs.  
  - **Goal:** Clarify mechanics. No tokens awarded.  

  **0:20–0:35 — Round 1: Baseline Curse (15 mins)**  
  - Roll: Ensure true state = **CATASTROPHIC** (e.g., rig dice roll to 5–6 if needed).  
  - Distribute signals: Bias toward over-triggering (e.g., 5 green, 2 amber, 1 red per 8-player table).  
  - Players decide → Collect decisions → Reveal true state → Calculate payoffs.  
  - **Likely outcome:** Multiple triggers despite catastrophe → Group loss. Highlight payoff damage.  

  **0:35–0:50 — Round 2: Replicated Curse (15 mins)**  
  - Roll: **CATASTROPHIC** again (same state as Round 1).  
  - Distribute signals: Same bias (e.g., 5 green, 2 amber, 1 red).  
  - **Purpose:** Show consistency. Students expecting catastrophe may restrain, but noisy signals ensure some triggers.  

  **0:50–1:00 — Round 3: "Flipped" Hazard (10 mins)**  
  - Roll: Ensure true state = **BENEFICIAL** (e.g., rig to 1–4).  
  - Distribute signals: Bias toward *under*-triggering (e.g., 5 red, 2 amber, 1 green per table).  
  - Players decide → Collect → Reveal true state → Payoffs.  
  - **Likely outcome:** No triggers → Group misses benefit. Restraint now penalised.  

  **1:00–1:25 — Debrief (25 mins)**  
  ***Step 1: Elicit Observations (5 mins)***  
  - *"What patterns did you see? What felt frustrating?"*  
  - Surface: Over-triggering in Rounds 1–2; under-triggering in Round 3; how group size amplified errors.  

  ***Step 2: Map Game → Concepts (10 mins)***  
  - **Reveal the curse:** *"You experienced the unilateralist’s curse: When any one actor can trigger an action, adding more well-meaning advisors increases the chance someone acts on flawed evidence."*  
  - **Key moments:**  
    - **Round 1:** Dispersed private info (green signals) + unilateral power → catastrophe triggered despite 33% base risk.  
    - **Round 2:** *Correlated errors*: All tables faced similar signals (shared bias), making collective failure likely.  
    - **Round 3:** *Independent errors*: Even with high benefit (66%), "noise" in signals (red bias) led to under-intervention.  
  - **Structural why:**  
    - Probability someone triggers ≈ 1 – (Probability all restrain).  
    - More actors = lower chance *all* restrain = higher chance of (potentially wrong) action.  

  ***Step 3: Discuss Remedies (10 mins)***  
  - *"How might you fix this?"* Guide them:  
    - **Higher Threshold:** *"What if 3+ must agree to trigger?"* Trade-off: Prevents rash acts but may cause under-intervention (as in Round 3).  
    - **Deferral/Consensus:** *"What if you pooled signals first?"* Trade-off: Costs time/resources; vulnerable to groupthink.  
    - **Context:** Link to tech policy (e.g., "Should one engineer halt an AI launch? Or require committee approval?").  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Gaming the System:**  
     - *Risk:* A student always triggers/restrains to "beat" the game.  
     - *Fix:* Stress payoffs reward *accuracy*, not triggering. After Round 1, show how knee-jerk triggering loses tokens.  

  2. **Arbitrary Numbers:**  
     - *Risk:* Students question signal accuracy rates (e.g., "Why 80%?").  
     - *Fix:* Acknowledge upfront: *"Rates are illustrative. Real evidence is noisy—this captures that."* Focus on *relative* over/under-confidence.  

  3. **Dominant Players:**  
     - *Risk:* Confident students sway peers pre-decision.  
     - *Fix:* Enforce silent writing. If whispering occurs, say: *"Remember, your evidence is private. Trust your signal."*  

  4. **Misinterpreting Signals:**  
     - *Risk:* Confusing amber (50% accuracy) as "neutral."  
     - *Fix:* Clarify in practice round: *"Amber is weakly informative—like conflicting data."*  

  5. **Apathy or Random Choices:**  
     - *Risk:* Students disengage and guess.  
     - *Fix:* Use tokens for light competition (e.g., "Table with most tokens wins"). Peer pressure helps.  

  ---

  ### **What the Game Cannot Replicate**  
  - **Stakes & Morality:** Classroom tokens lack real-world moral weight. Students *know* it’s a game, reducing emotional investment in "catastrophe."  
    - *How to supply:* In debrief, stress parallels to real tech dilemmas (e.g., "Imagine this is deploying autonomous weapons").  
  - **Perfect Rationality:** The game assumes players *want* to maximise payoffs. Real actors have biases, ambition, or misaligned incentives.  
    - *How to supply:* Note in debrief: *"In reality, advisors might trigger for career gain—our game isolates the informational problem."*  
  - **Signal Correlation Complexity:** Real evidence is rarely cleanly independent/correlated.  
    - *How to supply:* Discuss post-game: *"What if all 'green' signals shared a flawed source?"*  

  ---

  ### **Why This Works**  
  - **Curse Emerges Organically:** Biased signals + unilateral power guarantee over-triggering with high n (24 players).  
  - **"Flipped" Round Balance:** Round 3’s signal bias + restraint bonus creates palpable regret for inaction.  
  - **Debrief Scaffolding:** Students name the problem *before* you reveal the literature (Bostrom’s unilateralist’s curse; Armstrong’s voting parallels).  

  Run it tightly, and they’ll leave unsettled by how easily good intentions create systemic risk—perfect for an ethics workshop. Good luck!
