prompt: |-
  So I'm a grad student who also flies, and I've gotten myself stuck on a training practice that everyone in aviation treats as completely obvious.

  Here's the setup as I understand it. The whole cockpit discipline is built on not trusting memory: for normal and non-normal procedures you read the item off the card or the screen, you do it as challenge-and-response between the two pilots, and running a flow from memory when a checklist exists is treated as the cardinal sin. But sitting inside that system there's a small privileged list — the so-called memory items or immediate action items, things like an engine fire or failure during the takeoff roll, a rejected takeoff, a windshear escape, a terrain-warning pull-up, a cabin altitude drill — that you are expected to run from memory, instantly, before anybody's hand goes near the book. And the justification you hear is roughly that these are the cases where the aircraft will be lost in the seconds it takes to find the page. Fine, except that plenty of non-memory items are also time-critical, so the boundary looks arbitrary from where I sit.

  Now the part that actually puzzles me, and it's local. My flying club rents out little single-engine pistons and it's debating whether to approve a tablet-based emergency-flow app for use in the pattern — engine failure after takeoff, engine fire on the ground, off-field landing — on the argument that a laminated card is slower to dig out than a screen that's already mounted and already lit, and that the hands are busy anyway. Half the instructors are viscerally against it and can't articulate why beyond "you need to know it cold." Meanwhile the same instructors are totally relaxed about students offloading everything else to the tablet: weight and balance, fuel numbers, frequencies, even a lot of the nav planning. So the club tolerates externalized cognition at the planning desk and forbids it in the air, and nobody can say what the dividing principle is.

  My own attempt at a dividing principle, which I'm not sure is coherent, is this: if a step is allowed to be looked up, then the pilot is allowed to have already lost the airplane by the time they look it up — the permission to consult is only granted in states where the state is still recoverable by a slower process. I've been calling it the lookup tax. It might be garbage.

  So what I want from you: reconstruct the theory of mind that this two-track system actually presupposes. Not which philosophers it reminds you of — what has to be true about where knowing and skillful coping live for the memory-item/no-memory-item line to make sense at all, and for the planning-desk/cockpit asymmetry to make sense. Does it require something internalist, or something more like skill-is-in-the-body, or is it really a claim about latency and about which parts of a procedure are still available when the situation has degraded past some point? Say explicitly which rival pictures the practice rules out — I'm thinking of the Otto-and-his-notebook parity line, where the tablet ought to count as part of the pilot's cognitive system on exactly the same terms as the memory item does, and of the distributed-cognition picture where the crew plus the book plus the aircraft is the unit that knows things and the individual pilot's memory is just one component. Under either of those, is the memory-item list incoherent, or is it something those views can license just fine? And be careful to separate what the practice strictly needs from what merely fits it comfortably — I suspect there's a big gap there, and I'd rather you point at the gap than fill it.

  Then tell me what would have to change, institutionally and in the cockpit, if we dropped the presupposition and treated the tablet as genuinely part of the extended system — what breaks, what has to be redesigned, and whether the club should approve the app on that basis.

  Two requests about how you handle this. First, commit. If you think one reading of the practice is right and the others are rationalizations, say so and argue for it rather than laying out a balanced menu; I'd rather have a strong claim I can attack than a survey. Second, please separate the places where you're reasoning from how flight training works in general from the places where you're actually confident about the specifics — I may well have described the memory-item business wrong, and if so I want to know which of my premises you're relying on and which ones you'd have to check. And if you think the whole framing is a category error — if the memory-item list isn't a claim about cognition at all but just an artifact of certification and liability, with no implicit theory of mind to extract — then say that plainly up front instead of humoring me, and then tell me what the practice does presuppose instead.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a grad student and a pilot, stuck on why aviation treats memory items as essential while allowing other procedures to be checklist-dependent. The core confusion is the apparent arbitrariness: why are some time-critical procedures memory-based while others aren't, and why the resistance to using tablets for emergency flows in small planes when tablets are already used for planning?

  First, I need to figure out the implicit theory behind this practice. The user mentions distributed cognition (like Otto's notebook) and skill-in-the-body. They want to know which theory the current system presupposes and whether alternatives could work. Also, they’re concerned about the inconsistency at their flying club—tablets allowed for planning but not for in-flight emergencies.

  The user’s "lookup tax" idea is interesting—suggesting that if you can look it up, the situation isn't immediately catastrophic. But they’re unsure if it holds. I should test that against aviation practices. For example, engine failure on takeoff requires immediate action; delays mean no recovery. But other time-critical issues, like some system failures, might still allow a few seconds to grab a checklist. So maybe the boundary isn't arbitrary but based on critical time windows.

  The distributed cognition view (Otto's notebook) sees the tablet as part of the cognitive system. But in practice, relying on a tablet during an engine failure might fail because the device could be inaccessible or broken. Memory items bypass that risk. So the current system likely assumes that in certain emergencies, external tools are unreliable, hence the need for internal memory.

  The flying club’s inconsistency: allowing tablets for planning but not for emergencies. Planning happens in a stable environment with time to handle glitches. Emergencies are high-stress, time-pressured, and physically demanding. So the presupposition might be that cognition must be internalized when external resources can’t be reliably accessed under stress.

  If the club adopts the tablet for emergency flows, what breaks? Redundancy is key in aviation. Memory items are backups when other systems fail. Tablets can freeze, batteries die, or they might not be mounted securely. The club would need stringent requirements: tablets must be rugged, mounted, with backup power, and pilots trained to use them under stress. But even then, memory items might still be necessary as a last-resort backup.

  The user also wants to know which rival theories the practice rules out. The Otto model would require treating the tablet as an extension of memory, but current training doesn't trust that in emergencies. Distributed cognition might see the whole system (pilot + plane + checklist) as the unit, but memory items act as a fallback when the distributed system is compromised.

  In conclusion, the current system presupposes that for critical emergencies, internalized skills are non-negotiable because external tools can't be trusted under those specific conditions. Adopting tablets for emergencies would require hardening the technology and changing training, but memory items would still be needed as a failsafe.
answer: |-
  Here’s a committed reconstruction of the implicit theory of mind in aviation’s memory-item practice, why the tablet-for-emergencies proposal breaks it, and what would need to change if adopted. I’ll argue that **the practice presupposes a *hierarchical, embodied-cognition* model where internalized skill is the final backstop when the distributed system degrades**, and that the Otto/distributed-cognition view *cannot* license the memory-item list as currently implemented without violating core aviation safety principles.

  ### The Core Presupposition: Hierarchical Embodied Cognition Under Degradation
  1.  **The Non-Arbitrary Boundary:** Memory items aren't just "fast" emergencies; they're **procedures where *multimodal sensory degradation* is anticipated to disrupt access to external aids.** Engine fire on takeoff? Smoke, noise, vibration, adrenaline narrowing focus, potential G-forces. Windshear escape? High workload, spatial disorientation, auditory alarms. Cabin altitude drill? Hypoxia impairing cognition. The presupposition is that **these scenarios *physically* compromise your ability to see, hold, or process a checklist/tablet *before* you lose control.** Non-memory time-critical items (e.g., pressurization leak after level-off) assume a *stabilized* (though urgent) state where hands can manipulate objects and eyes can read.
  2.  **The Lookup Tax is Fundamental (and Correct):** Your "lookup tax" is central. The system presupposes **external aids require a *stable platform* (physical and cognitive) to function.** Memory items exist for states where that platform is *already* collapsing. The "tax" isn't just latency; it's the risk of *complete inability to pay the tax* due to:
      *   **Physical Degradation:** Fire, impact forces, G-loads making tablet interaction impossible.
      *   **Perceptual Degradation:** Smoke, darkness, vibration obscuring the screen.
      *   **Cognitive Degradation:** Stress/startle effect narrowing attention, hypoxia impairing working memory – making *finding* the right step on a screen harder than executing a deeply ingrained motor program.
  3.  **Embodiment as the Ultimate Fallback:** Memory items aren't merely "remembered"; they're **proceduralized, embodied skills.** Engine failure after takeoff? It's a sensory-motor loop: *pitch* (feel the nose drop, see the horizon), *identify* (glance at gauges, but the *act* of pitching is instinctive), *communicate* (muscle memory for mic switch), *configure* (hand moving to flaps/throttle/mixture via spatial memory). The presupposition is that **the body/brain under extreme stress defaults to conditioned reflexes; external symbols require higher-order cognition that may be unavailable.** The "know it cold" instructors are gesturing at this embodied mastery.
  4.  **The Planning/Cockpit Asymmetry Explained:** Planning is a **cool-state, high-fidelity, error-tolerant** activity. Time exists. Errors (wrong frequency, suboptimal route) are usually recoverable. The tablet here is a powerful cognitive extender. The cockpit emergency is a **hot-state, low-fidelity, error-intolerant** environment. Survival hinges on actions executed *despite* degraded conditions. Allowing external aids for planning but demanding internalization for critical emergencies presupposes **external tools are reliable *only* when the operator's cognitive and physical state permits deliberate interaction.** The asymmetry isn't about importance; it's about the *operational envelope* of cognition.

  ### What This Rules Out
  *   **Otto-and-Notebook Parity:** This view *cannot* sustain the memory-item system as is. If the tablet is "just like memory," there's no principled reason *not* to use it for engine failures. But aviation practice *explicitly rejects* this parity for memory-item scenarios because **"Otto's notebook" can be *physically* or *perceptually* destroyed or rendered inaccessible *faster* than the aircraft is lost.** A tablet is a physical artifact vulnerable to the same forces destroying the aircraft. Biological memory, while fallible, is *always present* in the pilot's body.
  *   **Naive Distributed Cognition:** Viewing the "crew-book-aircraft" as the unit of cognition is valid *until* the distributed system fragments. Memory items exist *specifically* for when the "book" (physical or digital) or crew coordination *cannot be accessed reliably* due to system degradation. The practice presupposes **the *individual* pilot's embodied skill is the irreducible core unit when the distributed system fails.** A pure distributed view struggles to justify why *this* specific subset of knowledge *must* be internalized.

  ### What Breaks If We Treat the Tablet as Extended Cognition for Emergencies?
  Adopting the extended cognition view for emergency flows in the pattern *without* fundamental changes would be dangerous. Here's why and what would need to change:

  1.  **The Vulnerability Gap:** The current system relies on embodied skill *because* of anticipated degradation. A tablet introduces new failure modes irrelevant to biological memory:
      *   **Physical Failure:** Dead battery, cracked screen, overheating, mount failure, water damage.
      *   **Software Failure:** App crash, OS freeze, incompatible update, corrupted data.
      *   **Human-Interface Failure:** Finger too shaky/jolted to hit the right button, screen glare, difficulty reading under high G/vibration.
      *   **Procedural Failure:** Forgetting to open the app pre-takeoff, app buried under other windows.
      *   **The club's current "mount it and light it" mitigates *some* access latency but ignores *all* these other points.**

  2.  **Necessary Changes (If Adopting the Tablet):** To make a tablet *credibly* part of the emergency system requires treating it like aircraft avionics:
      *   **Hardening:** Ruggedized tablet (MIL-STD-810G), *permanent* secure mount (crashworthy), weatherproof, sunlight-readable screen.
      *   **Power:** Dedicated, fused aircraft power with battery backup. No "charge before flight."
      *   **Software:** FAA-certified app (DO-178C DAL?), locked-down OS, no background processes, predictable boot time, physical "emergency" button.
      *   **Redundancy:** *Physical* backup (laminated card *still required* and accessible without releasing controls). Tablet failure must not preclude procedure execution.
      *   **Training:** Drills *including* simulated tablet failures (blank screen, app crash) forcing reversion to memory/card. Stress inoculation training using the tablet interface.
      *   **Procedure Design:** App steps *must* be designed for glanceability under stress (minimal text, large icons, audio cues?), not just a PDF of the checklist.

  3.  **Memory Items Remain Necessary:** Even with a perfect tablet system, **embodied skill is the ultimate backup.** The tablet would become the *primary* reference, but the memory item *must* remain trained as the fallback for when (not if) the tablet fails mid-emergency. You cannot eliminate the embodied layer; you just add a (potentially) faster digital layer *on top* of it, with its own risks.

  ### Should the Club Approve the App? (The Verdict)
  **Not on the current "it's mounted and lit" argument.** That ignores the core presupposition about degradation. Approval would *only* be justifiable if:
  *   The app/tablet combo meets near-avionic standards for reliability and accessibility under degradation (as outlined above), **AND**
  *   The club mandates *additional* training focusing on tablet failure modes during emergency drills, **AND**
  *   Traditional memory-item training and access to a physical backup card are *maintained and emphasized*.

  **Otherwise, the club risks swapping a small latency gain for a massive increase in catastrophic failure modes.** The visceral instructor reaction ("know it cold") stems from an intuitive understanding of embodied fallback – even if they can't articulate the degradation model. The practice isn't *just* about liability (though that reinforces it); it's a hard-won lesson about where cognition lives when the world is falling apart. The tablet, as currently conceived for club use, fails the degradation test.
