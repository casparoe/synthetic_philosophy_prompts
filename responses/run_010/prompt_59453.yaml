prompt: |-
  I write about higher-education finance, and one comparison does most of the argumentative work in the dispute between the Continental and Nordic model — no tuition for domestic students, provision paid for out of general taxation, in Denmark a monthly grant on top — and the Anglo-American model of high published fees met by loans, in Britain with repayment contingent on earnings above a threshold. The comparison is that a student loan is a mortgage. The borrower takes on debt to acquire an appreciating asset; the asset is her own enhanced earning capacity; the loan is secured against it; the schedule is simply amortization; and income-contingent repayment is a cleverer mortgage, because instalments flex with the value of the collateral. From this it is inferred that a fee-and-loan system does not burden students but finances an investment they could not otherwise make, that charging nothing is the arrangement in need of justification, and that free tuition is a transfer from taxpayers who never attended to graduates who did and who will out-earn them.

  A colleague has raised a complication I cannot resolve. Her claim is that the comparison fails in an interesting direction: once repayment is a fixed percentage of earnings for a fixed term, with the residual balance cancelled at the end, the instrument is not debt in any ordinary sense but a minority equity stake in a person — and the whole debate is mis-framed, because we have been arguing about the price of a loan when we should be arguing about whether a state may hold shares in its citizens.

  Please audit the mortgage comparison rather than wave it away. Work through the correspondence term by term — principal, collateral, appraisal, the interest rate as a price for risk, default and foreclosure, discharge in bankruptcy, the secondary market in the paper, the lender's capacity to diversify, and the buyer's information about what she is buying — and for each term give a verdict on whether the target case has a genuine counterpart or merely shares a name. Then separate the disanalogies that bear on the conclusions above from those that are merely picturesque. Say what the comparison quietly assumes that nobody in the debate argues for; I suspect at least one thing about who sets the price of the asset and who advises the buyer, and another about what happens to the value of the asset when everyone buys it. Then tell me whether the three conclusions survive once the disanalogies are on the table, or whether the analogy was carrying them all along — noting that the transfer conclusion in particular may not need the analogy at all, and saying so if that is right.

  Finally, assess my colleague. What would a shareholding framing map onto what, where does it strain, and does adopting it change any policy conclusion that the mortgage framing had already delivered? If neither instrument fits the case, say so plainly and propose the one that does, together with the commitments it would force on both sides of the tuition debate.
reasoning: |-
  Okay, the user is deeply involved in higher-education finance debates, specifically comparing the Continental/Nordic model (tax-funded free tuition + grants) with the Anglo-American model (high fees + income-contingent loans). Their core analytical tool is the "student loan as mortgage" analogy, but a colleague has challenged this by proposing an "equity stake" framing instead. They want a rigorous audit of the mortgage analogy without dismissing it entirely. 

  Hmm, this is a sophisticated request. The user clearly understands both policy models and financial instruments at a professional level. Their colleague's equity-stake critique suggests they're engaging with heterodox perspectives too. The meta-layer here is fascinating—they're not just asking about tuition models but about how conceptual framing shapes policy conclusions. 

  First, I need to systematically dissect the mortgage analogy term-by-term as requested. Let me mentally walk through each component: 

  Principal → Tuition fees. This holds up well—it's the upfront amount financed.  
  Collateral → Future earnings. Tricky. Mortgages have physical collateral that can be seized; human capital can't be repossessed. Major disanalogy.  
  Appraisal → Earnings projections. Here's where it gets messy. Universities/lenders estimate future earnings, but unlike property appraisals, these are probabilistic guesses.  
  Interest rate → Risk pricing. Partial match. ICLs adjust for repayment risk via income thresholds, but unlike mortgages, the "risk" includes life choices (e.g., career switches).  
  Default → Non-repayment. Critical divergence: Mortgage default ruins credit; ICL non-repayment just extends the term. No equivalent to foreclosure.  
  Bankruptcy → Nonexistent. Student loans famously can't be discharged—polar opposite to mortgages.  
  Secondary market → Thin/absent. Whereas mortgage-backed securities are liquid, student loans rarely trade.  
  Diversification → Impossible. Lenders can't diversify away systemic risk (e.g., if all graduates earn less).  

  The disanalogies aren't just picturesque—they undermine the core argument that loans "finance an investment." Mortgages transfer asset ownership; student loans don't convey ownership of human capital. This exposes the analogy's quiet assumptions: that education ROI is predictable and individualized (ignoring saturation effects), and that borrowers are rational investors (overlooking information asymmetry). 

  Now, do the three conclusions survive?  
  1. "No burden" claim → Fails. Loans create psychological/opportunity costs even with income-contingency.  
  2. "Free tuition needs justification" → Weakens. If loans aren't neutral financing tools, the burden of proof shifts.  
  3. "Transfer to graduates" → Holds, but independently of analogy—it's a pure accounting point.  

  On the colleague's equity-stake idea: It's provocative but overfits. Equity implies ownership rights (voting, dividends), which don't exist here. However, the "residual claim" aspect (government absorbing downside risk) is perceptive. Neither instrument fits perfectly—this is actually a non-recourse human capital option. 

  Policy implications shift dramatically under each frame:  
  - Mortgage framing favors loans as efficient investments.  
  - Equity framing makes state "shareholding" morally fraught.  
  - Option framing highlights insurance value but questions why taxpayers shoulder all risk.  

  The user needs to recognize that their original analogy smuggles in pro-loan assumptions. Meanwhile, their colleague's critique, while brilliant, overshoots. The real takeaway? Tuition debates aren't about financial instruments but about risk allocation between individuals and society—and that's a political choice, not a technical one.
answer: |-
  Let's audit the mortgage analogy term-by-term, assess its quiet assumptions, test the three conclusions, and then evaluate your colleague's equity-stake framing—all before proposing a more accurate instrument.

  ### Term-by-Term Audit of Mortgage Analogy
  1. **Principal**:  
     *Correspondence*: Tuition fee = loan principal.  
     *Verdict*: **Genuine counterpart**. Both represent the financed amount.  

  2. **Collateral**:  
     *Correspondence*: Enhanced earning capacity = property.  
     *Verdict*: **Shares a name only**. Property is tangible, transferable, and can be seized. Human capital is inseparable from the borrower—no repossession possible. This is a *critical disanalogy*.  

  3. **Appraisal**:  
     *Correspondence*: Projected graduate earnings = property valuation.  
     *Verdict*: **Shares a name only**. Property appraisal uses historical market data; earnings projections are probabilistic guesses influenced by field of study, labor markets, and macroeconomic shocks. Lenders don’t rigorously "appraise" individual students.  

  4. **Interest Rate (Risk Pricing)**:  
     *Correspondence*: Interest rate compensates for default risk.  
     *Verdict*: **Partial counterpart**. Income-Contingent Loans (ICLs) adjust repayments to income, reducing *individual* default risk. But systemic risk (e.g., a recession lowering *all* graduate earnings) isn’t priced in—unlike mortgages, where interest rates reflect macroeconomic risk.  

  5. **Default and Foreclosure**:  
     *Correspondence*: Non-repayment → credit damage/loss of asset.  
     *Verdict*: **Shares a name only**. Mortgage default leads to asset seizure; ICL "default" (earning below threshold) simply pauses payments. No asset forfeiture or credit-score impact. *No true foreclosure mechanism exists*.  

  6. **Discharge in Bankruptcy**:  
     *Correspondence*: Debt cancellation in insolvency.  
     *Verdict*: **No counterpart**. Student loans (public/private) are rarely dischargeable in bankruptcy. Mortgages are. This disanalogy burdens borrowers uniquely.  

  7. **Secondary Market**:  
     *Correspondence*: Loans sold to investors.  
     *Verdict*: **Weak counterpart**. Government-held ICLs (e.g., UK) aren’t traded; private loans are securitized but lack the liquidity of mortgage-backed securities due to non-dischargeability and income volatility.  

  8. **Lender Diversification**:  
     *Correspondence*: Lenders spread risk across many loans.  
     *Verdict*: **Partial counterpart**. Governments can absorb systemic risk (unlike banks), but private lenders struggle to diversify against cohort-wide earnings shocks (e.g., a pandemic). Human capital is non-diversifiable.  

  9. **Buyer Information**:  
     *Correspondence*: Borrower understands the asset/loan terms.  
     *Verdict*: **Shares a name only**. Homebuyers get inspections and fixed-rate terms; students face opaque earnings projections, variable interest, and complex repayment formulas. Information asymmetry is severe.  

  ### Critical vs. Picturesque Disanalogies  
  - **Bearing on Conclusions**:  
    - *Non-repossessable collateral*: Undermines "loan secured against asset" and the investment’s bankability.  
    - *Non-dischargeability*: Makes student loans riskier for borrowers than mortgages.  
    - *Systemic risk concentration*: Challenges lenders’ ability to diversify, weakening "finances an investment" claim.  
  - **Merely Picturesque**:  
    Fixed repayment schedules (ICLs are flexible), physical asset depreciation (human capital usually appreciates).  

  ### Quiet Assumptions  
  1. **Price-Setting**: The analogy assumes tuition fees reflect the "true value" of education—set by neutral market forces. In reality, fees are often politically determined or inflated by administrative bloat.  
  2. **Saturation Effects**: It assumes education ROI is independent of cohort size. If everyone gets a degree, its labor-market value may fall (credential inflation), but the loan liability remains fixed.  

  ### Do the Conclusions Survive?  
  1. *"Loans finance an investment, not a burden"*: **No**. Disanalogies (non-dischargeability, information asymmetry, systemic risk) reveal burdens beyond financial cost (e.g., psychological stress, opportunity cost of repayment years).  
  2. *"Free tuition requires justification"*: **Weakened**. If loans aren’t neutral "investment tools" but risky, non-escapable obligations, the status quo shifts from default to suspect.  
  3. *"Free tuition is a regressive transfer"*: **Survives independently**. This relies on tax/benefit incidence analysis, not the analogy. Data shows graduates out-earn non-graduates—but the analogy obscures whether loans are truly "fairer."  

  **Verdict**: The analogy carries conclusions 1 and 2; only 3 stands alone.  

  ### Assessing the Equity-Stake Framing  
  **Strengths**:  
  - Maps neatly to "residual claim": Government absorbs downside risk (forgiven balances) and shares upside (via repayments).  
  - Explains ICL’s core design: Fixed term + percentage of earnings + cancellation mirrors equity’s finite horizon and profit-sharing.  

  **Strains**:  
  - **Control rights**: Equity holders get voting/shareholder rights; states get none.  
  - **Valuation**: Equity value fluctuates; "human capital" lacks a market price.  
  - **Transferability**: Shares are tradable; "stakes" in people aren’t.  

  **Policy Implications**:  
  - Changes the moral question: Not "Is debt fair?" but "Can the state own a financial claim on citizens?"  
  - Justifies higher "returns" to the state: Equity stakes typically demand higher returns than debt to compensate for risk.  
  - **Conclusion Shift**: Under mortgage framing, ICLs seem borrower-friendly; under equity framing, they resemble a "human capital tax."  

  ### Neither Instrument Fits Perfectly: A Hybrid  
  **Proposed Instrument**: **Non-Recourse Human Capital Option**.  
  - Borrower "purchases" education with a loan, but has the **option to default without penalty** if earnings are low (like a non-recourse loan).  
  - The state acts as **insurer of systemic risk**, not a lender/shareholder.  

  **Debate Commitments**:  
  - **Pro-Loan Side**: Must accept full risk-pooling (i.e., higher taxes if many earn little).  
  - **Pro-Free-Tuition Side**: Must admit graduates benefit privately and could contribute *more* than non-graduates.  

  **Why This Fits**:  
  - ICLs already embed an implicit "option" (forgiveness if earnings are low).  
  - Acknowledges education’s mixed returns: private (higher wages) and public (innovation, civic engagement).  
  - Forces both sides to confront risk allocation: Individuals bear idiosyncratic risk (career choice); society bears systemic risk (economic shocks).  

  ### Final Recommendation  
  Abandon both analogies. Frame tuition finance as a **social risk-pooling mechanism**. The core question is: *Should individuals or society bear the risk that education doesn’t "pay off" as expected?* This shifts the debate from "debt vs. equity" to solidarity, risk aversion, and distributive justice—where it belongs.
