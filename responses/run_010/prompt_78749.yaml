  For question one, I'll argue that no regime is truly neutral. Each system has implicit choices: the U.S. privatizes religion but still regulates it, France's laïcité has historical baggage, England and Germany have overt entanglements. The ranking depends on values—equality vs. historical continuity—but none avoid substantive commitments.

