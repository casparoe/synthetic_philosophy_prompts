  Question three explores theories of belonging. The user's hunch is spot-on: each regime embodies a different anthropology—voluntary (U.S.), territorial (England), corporate (Germany). These are philosophical choices, not neutral facts, and avoiding this question lets systems mask their biases. Philosophers ignore this because it forces contentious metaphysical debates.

