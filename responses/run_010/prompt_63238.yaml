prompt: |-
  So I'm in a philosophy-of-cosmology reading group and last week the whole multiverse discussion — string landscape, eternal inflation, that stuff — got killed in about ten seconds when one of the physics postdocs said some version of "if it can't be tested, it's not science." Everyone nodded, me included, and we moved on to the next paper. I've been stewing becouse I'm now pretty sure that one sentence did at least three different jobs in that room and I can't tell them apart.

  Here's what he actually argued, as best I can reconstruct it: (1) no possible observation could rule out the multiverse, since any anomaly can be absorbed by saying some other pocket has different constants; (2) therefore the multiverse isn't a scientific hypothesis at all; (3) therefore people spending their careers on it are wasting department resources. Worth noting that the same guy defends inflation, which as far as I can tell is accepted mostly because it handles the horizon and flatness problems and because nobody's got a competitor that works as well — not because anyone has ever detected another pocket universe.

  What I want is a menu of the distinct precise claims that slogan could be standing for, laid out numbered so I could print it and bring it next week. For each reading, spell out: what kind of testability is being demanded (direct detection? indirect observable consequences? falsifiable in principle vs. in practice? testable with today's instruments vs. testable by some civilization in five hundred years?), what exactly is being excluded from the club (a single hypothesis? a whole research program? a person's claim to a job?), and what work the word "science" is doing (a line between meaningful and meaningless? a claim about whether there's any epistemic warrant at all? a methodological rule of thumb about how to spend effort? a sociological label for what people in science departments happen to do?). Then give each one a verdict: platitude nobody would deny, substantive and defensible, substantive and false, or just incoherent. And tell me which readings actually license step (2) and which license step (3) — I suspect they're not the same readings — plus which one he was probably leaning on, given how fast the room agreed.

  Two extra things I care about. First, a self-exoneration test: for each reading, say whether it also damns inflation, or dark matter, or many-worlds, or anything else this guy clearly accepts. I want to know if any version of his principle is actually consistent with his own commitments rather than just convenient. Second, I've started privately calling the move the falsifiability shuffle — testability treated as a bright metaphysical line when someone proposes something you dislike, and as a mere preference about research priorities when someone proposes something you like. Tell me whether that's a real pattern with a describable structure or just me being annoyed, and whether there's a reading of the slogan that's immune to it.

  Please no reading list and no history of who said it first — I can't chase references right now, I just want the distinctions. Labels for positions are fine if they're standard, but don't build the answer around who-said-what.
reasoning: |-
  Okay, let me try to unpack this user's request. They're in a philosophy-of-cosmology reading group where a postdoc dismissed multiverse theories with "if it can't be tested, it's not science," and everyone agreed. The user feels this slogan did multiple jobs and wants clarity. 

  First, I need to identify the core frustration: the user suspects the testability criterion was applied inconsistently to reject multiverse while accepting inflation. They want a structured breakdown of possible interpretations of the slogan, each analyzed for testability demands, exclusions, and implications. 

  The user also wants two specific checks: whether each interpretation would condemn theories the postdoc accepts (like inflation or dark matter), and whether the "falsifiability shuffle" is a real pattern. They explicitly avoid references, focusing on conceptual distinctions.

  Hmm... this requires separating several entangled claims. The postdoc's argument had three steps: (1) multiverse is untestable (specifically unfalsifiable), (2) therefore unscientific, (3) therefore unworthy of resources. But "testable" is ambiguous—it could mean falsifiable, verifiable, empirically constrained, etc. The exclusions could range from epistemic status to funding eligibility.

  I recall Popper's falsifiability is often oversimplified. The user mentioned inflation being accepted without direct detection, so indirect testability must matter. Also, string theory and dark matter face similar critiques but are still researched. 

  For the menu approach, I'll outline 5-6 readings, each specifying:
  - Type of testability (falsifiability/verifiability, direct/indirect, practical/theoretical)
  - What's excluded (hypothesis/program/person)
  - "Science" function (demarcation/warrant/methodology/sociology)
  - Verdict (platitude/defensible/false/incoherent)
  - Step 2/3 licensing
  - Self-exoneration test (does it damn inflation/etc.?)
  - Falsifiability shuffle vulnerability

  Key tensions: 
  - Inflation solves horizon/flatness problems but lacks direct evidence—is that sufficient testability? 
  - Dark matter has indirect evidence but no direct detection—same as multiverse? 
  - Many-worlds QM is untestable but discussed seriously. 

  The "shuffle" seems real: testability as a rigid filter for disliked theories but flexible for liked ones. Only interpretations demanding *any conceivable future test* might avoid hypocrisy, but even that could condemn inflation. 

  User's deeper need: tools to expose inconsistent application of demarcation criteria. They want to show that either (a) the slogan is wrong, or (b) it must apply equally to accepted theories. Either undermines the postdoc's dismissal.
answer: |-
  Here's a menu of distinct readings of "if it can't be tested, it's not science," analyzed for your scenario. Each reading is isolated to expose its implications, consistency, and whether it licenses the postdoc's steps (2) and (3). Verdicts assess reasonableness, not popularity.

  ---

  ### **Reading 1: Strict Falsifiability (Popperian Core)**  
  - **Testability Demanded**: Falsifiable *in principle* via *conceivable observations* that could disprove it. Direct detection not required, but must have incompatible outcomes.  
  - **Excludes**: Specific hypotheses that are *logically immune* to disconfirmation (no possible observation contradicts them).  
  - **"Science" Function**: Demarcation criterion (meaningful vs. pseudo-scientific claims).  
  - **Verdict**: **Substantive and defensible** (but incomplete; science often uses non-falsifiable heuristics).  
  - **Licenses Step (2)?** Yes (if multiverse is truly unfalsifiable).  
  - **Licenses Step (3)?** No (non-science ≠ worthless; e.g., math, philosophy).  
  - **Self-Exoneration Test**:  
    - Damns inflation? **No** (inflation *is* falsifiable; e.g., non-Gaussianity in CMB could kill it).  
    - Damns dark matter? **No** (falsifiable via galactic rotation curves, lensing).  
    - Damns many-worlds? **Yes** (quantum branching is observationally identical to collapse).  
  - **Falsifiability Shuffle Vulnerability**: High (often applied selectively; e.g., string theory fluctuates).  

  ---

  ### **Reading 2: Empirical Constraint (Weak Testability)**  
  - **Testability Demanded**: Indirect observational consequences *in practice* (e.g., explaining existing data, predicting novel phenomena). No need for falsifiability.  
  - **Excludes**: Hypotheses with *zero* empirical consequences (e.g., solipsism).  
  - **"Science" Function**: Epistemic warrant (claims must connect to evidence).  
  - **Verdict**: **Platitude** (nobody denies science requires empirical anchors).  
  - **Licenses Step (2)?** No (multiverse *does* explain fine-tuning, low entropy).  
  - **Licenses Step (3)?** No (empirically constrained programs are fundable).  
  - **Self-Exoneration Test**:  
    - Damns inflation? **No** (solves horizon/flatness problems).  
    - Damns dark matter? **No** (explains galactic dynamics).  
    - Damns many-worlds? **No** (explains interference without collapse).  
  - **Falsifiability Shuffle Vulnerability**: Low (broadly consistent with accepted theories).  

  ---

  ### **Reading 3: Direct Detectability (Operationalism)**  
  - **Testability Demanded**: *Direct* observation/experiment with *current or near-future* technology.  
  - **Excludes**: Entities fundamentally beyond detection (e.g., other pocket universes).  
  - **"Science" Function**: Methodological rule (prioritize tractable research).  
  - **Verdict**: **Substantive and false** (science routinely infers undetectable entities, e.g., quarks inside protons).  
  - **Licenses Step (2)?** Only if "science" = "experimental physics."  
  - **Licenses Step (3)?** Potentially (argues for resource prioritization).  
  - **Self-Exoneration Test**:  
    - Damns inflation? **Yes** (no direct detection of inflaton field).  
    - Damns dark matter? **Yes** (no direct detection yet).  
    - Damns many-worlds? **Yes** (branches are inaccessible).  
  - **Falsifiability Shuffle Vulnerability**: Extreme (inflation/dark matter excused as "indirect").  

  ---

  ### **Reading 4: Sociological Membership (Institutional Boundary)**  
  - **Testability Demanded**: Whatever scientists *in practice* treat as testable (e.g., peer-reviewed, grant-funded).  
  - **Excludes**: Research programs lacking community buy-in.  
  - **"Science" Function**: Sociological label (what "science departments do").  
  - **Verdict**: **Coherent but circular** (defines science by consensus, not principles).  
  - **Licenses Step (2)?** No (multiverse research is published in science journals).  
  - **Licenses Step (3)?** Yes (department resources follow trends).  
  - **Self-Exoneration Test**:  
    - Damns inflation? **No** (established).  
    - Damns dark matter? **No** (established).  
    - Damns many-worlds? **No** (discussed in physics contexts).  
  - **Falsifiability Shuffle Vulnerability**: Built-in (bias toward status quo).  

  ---

  ### **Reading 5: Futuristic Testability (Cosmic Eschatology)**  
  - **Testability Demanded**: Testable *in principle* by *any possible civilization* (e.g., in 10²⁰ years).  
  - **Excludes**: Hypotheses with *no conceivable* future evidence (e.g., Boltzmann brains).  
  - **"Science" Function**: Epistemic warrant over infinite time.  
  - **Verdict**: **Substantive and defensible** (avoids nihilism).  
  - **Licenses Step (2)?** Unlikely (multiverse *might* leave future traces).  
  - **Licenses Step (3)?** No (doesn’t address present resource allocation).  
  - **Self-Exoneration Test**:  
    - Damns inflation? **No** (may leave eternal signatures).  
    - Damns dark matter? **No**.  
    - Damns many-worlds? **No** (quantum archaeology?).  
  - **Falsifiability Shuffle Vulnerability**: Low (too abstract for selective application).  

  ---

  ### **Reading 6: Resource Prioritization (Pragmatic Shutdown)**  
  - **Testability Demanded**: Testable *with reasonable effort/resources* (e.g., <50 years, <$100B).  
  - **Excludes": Programs deemed intractable or low-yield.  
  - **"Science" Function**: Methodological rule of thumb (opportunity cost).  
  - **Verdict**: **Substantive and context-dependent**.  
  - **Licenses Step (2)?** No (doesn’t challenge scientific status).  
  - **Licenses Step (3)?** Yes (core of the postdoc’s argument).  
  - **Self-Exoneration Test**:  
    - Damns inflation? **No** (tested via CMB).  
    - Damns dark matter? **No** (active detection efforts).  
    - Damns many-worlds? **Yes** (no foreseeable test).  
  - **Falsifiability Shuffle Vulnerability**: High (tractability judgments are subjective).  

  ---

  ### **Analysis of the Postdoc’s Move**  
  1. **Step (1) → (2)**: Relies on **Reading 1** (strict falsifiability).  
  2. **Step (2) → (3)**: Illegitimately smuggles in **Reading 6** (resource prioritization) by conflating "unscientific" with "unworthy of funding."  
  3. **Why the Room Nodded**:  
     - Surface appeal of **Reading 1** (falsifiability as a noble ideal).  
     - Unspoken shift to **Reading 6** (multiverse feels "wasteful").  
  4. **Self-Exoneration Failure**: His defense of inflation relies on **Reading 2** (empirical constraint), not Reading 1—hence the **shuffle**.  
  5. **The Falsifiability Shuffle**:  
     - **Real pattern**: Switching between strict falsifiability (for foes) and empirical constraint (for friends).  
     - **Immune Reading**: Only **Reading 5** (futuristic testability) avoids it—but it’s impractical for funding decisions.  

  ### **Your Cheat Sheet**  
  | Reading | Testability Demand          | Excludes                          | "Science" Function       | Verdict                  | Licenses (2)? | Licenses (3)? | Damns Inflation? |  
  |---------|----------------------------|-----------------------------------|--------------------------|--------------------------|---------------|---------------|------------------|  
  | 1       | Falsifiable in principle   | Logically immune hypotheses       | Demarcation              | Defensible               | Yes           | No            | No               |  
  | 2       | Empirical consequences     | Totally disconnected claims       | Epistemic warrant        | Platitude                | No            | No            | No               |  
  | 3       | Direct detection           | Fundamentally undetectable things | Methodological rule      | False                    | Weakly        | Yes           | **Yes**          |  
  | 4       | Community acceptance       | Outsider ideas                   | Sociological label       | Circular                 | No            | Yes           | No               |  
  | 5       | Testable by any civilization | Truly eternal mysteries          | Long-term warrant        | Defensible               | No            | No            | No               |  
  | 6       | Tractability               | "Wasteful" programs              | Resource allocation      | Context-dependent        | No            | **Yes**       | No               |  

  **Bring this next week.** When the postdoc says inflation is testable, ask: *"By which reading? If it's Reading 2 (empirical constraint), multiverse also qualifies. If it's Reading 1 (falsifiability), inflation is safe but many-worlds is dead—and why does 'unscientific' mean 'unfundable'?"* That exposes the shuffle.
