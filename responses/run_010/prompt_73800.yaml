  I'm in week nine of a jurisprudence seminar on statutory interpretation and I have to hand in a paper proposal by Friday — the paper itself is around 6,000 words, due at the end of term, so roughly eleven weeks of actual working time once I subtract exams. My half-formed idea, which I tried to explain after class last week and got a very patient "interesting, but sharpen it," is this. Textualists sell their method as the humble one: the judge doesn't get to decide what the law should aim at, she just applies the enacted words, so the theory is supposed to be about deferring to somebody else's choices and keeping judicial construction near zero. But when I actually trace how the method gets used in the hard cases, the judge looks like she's doing a lot of construction anyway — she's building an idealized lawmaker who is fully informed, coherent across the whole statutory scheme, speaks in ordinary English, and would never have intended an absurd result, and then she asks what that construct would have conveyed to a reasonable reader. That figure has a lot in common with what a purposivist does when she reconstructs the mischief the provision was aimed at and reads the text as a means to it. Both look like the judge building a normative model of an author and then reading the words through it. They disagree about which features the model is allowed to include, but I can't tell whether that's a difference in kind or just a difference in how much gets smuggled in.

  The concrete handle I keep coming back to is the federal provision that adds prison time for a defendant who "uses" a firearm during a drug-trafficking crime. In the mid-nineties the Court held that a guy who traded his gun to a buyer in exchange for cocaine had "used" it; the dissent said the enhancement was obviously aimed at the danger of a gun being employed as a weapon, and that the majority's reading turned a violent-crime provision into one that swept in a barter. Then, years later, the Court narrowed the same provision so that mere passive possession or storage near the drugs didn't count. Same word, same statute, two readings, and the interesting part for me is that the "literal" reading and the "ordinary meaning" reading point in opposite directions depending which case you're in — which suggests the constraint isn't the words doing the work, it's a judgment about what kind of speaker the legislature is being asked to be. I want the paper to press on exactly that.

  So: can you write the proposal for me, about a page and a half, the thing I'd actually hand in? What I need in it —

  - a precise statement of the question, framed so it has a determinate answer and can't be escaped by either camp just insisting they're being humble. My current attempt is whether every interpretive principle a textualist is committed to can be restated as a claim about the communicative dispositions of an idealized reasonable legislator, in which case the dispute is about how much construction the judge is licensed to do, not about whether there's any — but please improve on that, it's clumsy.
  - why the positions on the table leave it open. Including the ones that sound like my idea and aren't: hard intentionalism about an actual collective mental state (nearly nobody defends it, and for good reason), the "we're all intentionalists now, we just disagree about what evidence counts" line, and any view that reduces the whole thing to judges' policy preferences wearing方法论 costumes — that last one isn't what I'm after because I'm asking a conceptual question about what a method licenses, not predicting who wins a case.
