answer: |-
  ## Paper Proposal: The Constructed Legislator in Textualist Adjudication  

  **Research Question:** Does textualism’s recourse to an *idealized legislative speaker*—endowed with rationality, coherence, and ordinary linguistic competence—render it indistinguishable in kind from purposivism, differing only in the *degree* of construction permitted, rather than the absence of construction itself?  

  ### Why the Question Persists  
  Textualism claims methodological humility by insisting judges derive meaning *only* from the enacted text’s "ordinary meaning," rejecting reliance on subjective legislative intent. Purposivism openly constructs legislative aims to resolve ambiguities. Yet in hard cases (e.g., statutory gaps, absurd results, contextual conflicts), textualists implicitly posit an idealized lawmaker whose attributes (e.g., non-absurdity, coherence across statutes, ordinary language proficiency) guide interpretation. This resembles purposivism’s construction of a "mischief-targeting" legislator. Positions evading this tension fail:  
  - **Hard intentionalism** (relying on actual collective intent) is descriptively and conceptually untenable.  
  - The "we’re all intentionalists" view obscures *how* methods reconstruct intent: textualists limit evidence to semantic context; purposivists incorporate policy aims.  
  - Reducing methods to "policy preferences" ignores the conceptual constraints each theory imposes on judges. The question is whether these constraints covertly rely on the same *constructive mechanism*.  

  ### Method: Case-Study Protocol  
  **Core Protocol:** Select 3–4 landmark statutory interpretation cases featuring sharp textualist/purposivist splits (e.g., *Smith v. United States* (1993) and *Bailey v. United States* (1995) re: "use a firearm" under 18 U.S.C. § 924(c)(1)). For each opinion:  
  1. **Isolate Extratextual Premises**: List all necessary interpretive premises not explicit in the statute’s text (e.g., "‘use’ implies active employment as a weapon"; "trading a gun qualifies as ‘ordinary’ use").  
  2. **Categorize Premises**:  
     - *Semantic*: Appeals to dictionary definitions, grammar, or linguistic conventions.  
     - *Evidential*: Structural canons (e.g., *noscitur a sociis*), statutory context.  
     - *Normative*: Avoidance of absurdity, coherence with broader legal scheme.  
  3. **Assess Permissibility**: For each premise, determine:  
     - Whether textualists and purposivists *could* accept it under their methodologies.  
     - Whether it requires attributing traits to an *idealized legislator* (e.g., "a reasonable drafter would avoid contradictions").  

  **Output & Safeguards**:  
  - A comparative table quantifying premise types per opinion, measuring "constructive density."  
  - To prevent bias: Premises are classified *before* labeling them textualist/purposivist. "Ordinary meaning" appeals are scrutinized for reliance on constructed context (e.g., *Smith*’s "trade=use" vs. *Bailey*’s "use≠possession").  
  **Advantage Over Alternatives**:  
  - Beats "history surveys" by testing methods *operationally*; beats "armchair theory" with concrete data; beats "empirical coding" by probing *premises*, not outcomes.  

  ### Timeline (11 Weeks)  
  - Weeks 1–2: Deep reading of core cases (*Smith*, *Bailey*) and secondary literature (Scalia, Eskridge, Manning).  
  - Weeks 3–4: Select 2 additional cases (e.g., *King v. Burwell* (ACA "exchange"); *Bostock v. Clayton County* ("because of sex")).  
  - Weeks 5–7: Apply protocol to all cases; draft premise tables.  
  - Weeks 8–9: Analyze patterns; draft theory sections.  
  - Weeks 10–11: Revise; address objections; finalize.  
  - *Buffer Week*: Contingency for deeper case analysis.  

  ### Success, Failure, and Scope  
  **Success**: Demonstrates that textualism consistently relies on an idealized legislator to resolve ambiguities, making its distinction from purposivism one of *scope* (which traits are permissible) rather than *kind* (construction vs. non-construction).  
  **Failure Conditions**:  
  1. **Triviality**: All methods entail some construction → Limit claims to *systematic, theory-driven* construction.  
  2. **Straw Man**: Textualism never invokes idealized authors → Show Scalia/Gorsuch opinions explicitly modeling "reasonable drafters" (e.g., *Bostock*’s "ordinary meaning" relying on constructed intent).  
  3. **Explanatory Vacuum**: Fails to predict outcomes → Focus on how *differences in idealized traits* explain splits (e.g., *Smith*’s "speaker as everyday communicator" vs. *Bailey*’s "speaker as anti-violence policymaker").  
  **Construction-Free Textualism?** A purely "mechanical" textualism (e.g., strict dictionary definitions ignoring context) is possible but collapses in hard cases—textualists themselves reject this (*cf.* Scalia on context). The paper argues *practiced* textualism is unavoidably constructive.  

  ### Scope Management  
  - **Cut**: Broad historical surveys; extended doctrinal analysis beyond core cases.  
  - **Focus**: 4 cases max; 80% word count on premise analysis and theoretical implications.  
  - **Critical Objection**: "Textualist premises are semantic/conventional, not normative."  
    - **Response**: Distinguish *invoked* semantics (e.g., "ordinary meaning") from *applied* semantics (e.g., selecting among plausible meanings using coherence norms). If semantic conventions *alone* resolved cases, splits like *Smith*/*Bailey* would not occur.  

  ---  
  Verdict: fundable with cuts
