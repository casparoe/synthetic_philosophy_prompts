  *Case 8: You note this is "no honor," treated as contractual.  
  †**Test Cases for Cand. C**:  
  - **T1**: A 1990s *highway* named for a civil rights leader later found to have plagiarized key speeches. *Cand. C verdict: Keep*. Functional designation outweighs revoked honor (Cl.2).  
  - **T2**: A 1955 *public library* named for a donor who funded it via exploitative labor; his plaque calls him a "visionary benefactor." *Cand. C verdict: Rename/remove plaque*. Glorifies injustice (Cl.1), even with functional utility.  

  ### Founder’s Statue: Melting vs. Museum Storage  
  **Melting into a new monument is better** under Principle C. Storing it in a museum treats the statue as a *neutral artifact*, but your verdicts imply the object *does* carry honor (e.g., Case 1 vs. Case 4: pedestal text fails, wall plaque succeeds). Melting it repurposes the material to center the displaced families—transferring honor from oppressor to oppressed. This aligns with:  
  - Case 4 (same words work on plaque, not statue) → Commemoration’s *form* shapes meaning.  
  - Case 7 (bench stays, statue goes) → Redemption requires tangible change, not symbolic gestures.  
  Your preference for melting suggests that honor resides in the *object’s active role in public space*, not just historical intent. Transforming it confronts harm; storing it defers accountability.  

