prompt: |-
  I am trying to work out what I actually mean when I say a historical outcome was locked in, and I have been going case by case rather than from theory. My verdicts:

  1. **QWERTY.** A typewriter-era arrangement that persists despite better layouts. Locked in — and I take its very persistence as evidence that it is inferior, since an efficient standard would not need lock-in to survive.
  2. **Standard railway gauge.** Arbitrary origin, now immovable. Locked in, for the obvious reason that the track is in the ground and the rolling stock is built to it.
  3. **Sweden, 1967.** An entire country reversed a nationwide traffic convention in one night. Not locked in at any deep level; the convention was only ever a coordination equilibrium that a determined state could move.
  4. **The metric system.** Locked in across continental Europe, where it was imposed; the same system, backed by comparable authority, failed to displace everyday customary units in Britain and the United States. So locked-in seems to be a property of places rather than of standards.
  5. **The French Revolutionary ten-day week.** Abolished within about a dozen years, and the seven-day week — which has no astronomical basis whatever — returned. Locked in.
  6. **Betamax losing to VHS.** Contingent at the level of the format, but home video was coming regardless. I do not think the world would look much different if the token had been otherwise.
  7. **Gasoline beating electric cars around 1900.** Equally contingent at the token level, and yet here I do think the world would look very different — cities, oil, climate. Same shape of case as 6, opposite verdict on whether the contingency mattered.
  8. **Base-60 minutes and seconds.** I want to say both locked in and inevitable, since any literate civilization needs a fine-grained time standard, though the particular base is an inheritance.

  My working rule is that a convention is locked in just when reversing it would require scrapping complementary capital that no single agent owns. That plainly fails as stated: 3 and 5 look like the same kind of thing — a state decree changing a nationwide convention, one of them by a government that also controlled the calendar and the weights and measures — and I gave opposite verdicts. And 6 and 7 are both "the type was inevitable, the token was not," yet I think the token mattered in only one of them.

  Could you give me a principle, or a small set of candidate principles, that accounts for as much of this as possible? For each, I would like every clause tied to the case that forces it, the principle's verdicts on two or three cases I have not listed, and an explicit statement of which of my eight verdicts it cannot save. I would rather have one clean principle that overturns a verdict than an epicycled one that preserves them all — but tell me if you think it runs the other way here, and say which single verdict you would abandon first.
reasoning: |-
  Okay, the user is exploring the concept of historical lock-in through concrete examples. They've listed eight cases with their verdicts and identified contradictions in their working definition. They want a principle that explains most cases, even if it means overturning some verdicts.

  Hmm, the core tension is between material lock-in (like railways) versus social coordination (like Sweden's traffic switch). Their current definition focuses on physical capital, but cases 3 and 5 show states can override conventions despite sunk costs. The French ten-day week failed despite state power, while Sweden succeeded - so state capacity alone isn't the answer.

  Looking deeper, the user might be wrestling with how to distinguish "deep" lock-in from superficial persistence. The electric car case suggests they care about path-dependent consequences, not just whether change happened. Also, their QWERTY verdict implies lock-in requires inferiority - but is that necessary? Maybe not, since railway gauge works fine.

  For principles... First try: "Lock-in occurs when reversal costs exceed the value of coordination benefits." But that makes Sweden locked-in (high costs to change), which contradicts their verdict. 

  Second angle: "Lock-in exists when reversal requires simultaneous decentralized action." This fits Sweden (state could coordinate) but not ten-day week (state failed). Still messy.

  Third approach: "Lock-in emerges when complementary assets are fragmented." Railways fit (no single owner can change tracks), but QWERTY keyboards are personal property - individuals could switch but don't. Why? Because network effects create de facto fragmentation. 

  Ah! Network effects as intangible complements. That unites QWERTY (typing pool coordination), railways (physical compatibility), and even time units (scientific community coordination). Sweden changed because the state internalized the network - it owned roads and could mandate behavior. 

  But ten-day week? The state owned the calendar but couldn't override religious/social rhythms - those were fragmented complements. And Betamax vs VHS: fragmented rental stores prevented coordination. Electric cars: no oil infrastructure lock-in yet in 1900, so not locked-in then but became so later.

  This framework overturns their ten-day week verdict: it was locked-in due to social/religious complements, not state failure. Also clarifies that gasoline cars weren't locked-in in 1900 (infrastructure embryonic) but became so. 

  New test cases: Fax machines (locked-in until email fragmented the network) or AC/DC current wars (Westinghouse owned key patents but Edison's DC had installed base - fragmented complements made AC win despite late start).

  Principle: "A standard is locked-in when reversal requires coordinated investment across fragmented owners of complementary assets." Saves all except ten-day week (should be locked-in) and electric cars (not locked-in in 1900). User might accept this if we emphasize that social practices can be complements too.
answer: |-
  Here's a candidate principle derived from your cases, designed to maximize explanatory power while overturning one verdict for coherence:

  **The Fragmented Complements Principle:**  
  *A historical outcome is locked-in when reversing it requires simultaneous, costly adjustments to multiple complementary systems that are controlled by fragmented decision-makers who cannot internalize the net benefits of coordination.*

  ### Key Components & Case Ties:
  1. **"Simultaneous, costly adjustments"**  
     → Railway gauge (Case 2): Rewriting tracks, rolling stock, and signaling systems at once is prohibitively expensive.  
     → *Forces clause:* Contrasts with Sweden (Case 3), where only driver behavior needed change (low cost, no physical adjustments).

  2. **"Multiple complementary systems"**  
     → QWERTY (Case 1): Hardware, training, manuals, and typing pools form an ecosystem.  
     → Base-60 time (Case 8): Astronomy, engineering, and software depend on it.  

  3. **"Fragmented decision-makers"**  
     → Metric system (Case 4): In the UK/US, millions of homeowners, tradespeople, and manufacturers resist change independently.  
     → *Forces clause:* Explains why revolutionary France *could* impose metric (centralized state) but failed with the calendar (Case 5) due to...  

  4. **"Cannot internalize net benefits"**  
     → Ten-day week (Case 5): Individuals bore social/religious disruption costs while state captured coordination benefits. Fragmented churches/communities blocked reversal.  
     → Betamax (Case 6): Video rental stores couldn't profit from dual stocking; consumers feared picking losers.

  ---

  ### Verdicts Under This Principle:
  | Case             | Your Verdict | Principle's Verdict | Conflict?                  |
  |------------------|--------------|---------------------|----------------------------|
  | 1. QWERTY        | Locked-in    | **Locked-in**       | None                       |
  | 2. Rail gauge    | Locked-in    | **Locked-in**       | None                       |
  | 3. Sweden 1967   | Not locked   | **Not locked**      | None (state internalized)  |
  | 4. Metric system | Mixed        | **Locked-in where fragmented** | None (explains UK/US) |
  | 5. Ten-day week  | Locked-in    | **Locked-in**       | **None** (overturns your reasoning, not verdict) |
  | 6. Betamax       | Contingent   | **Locked-in (VHS)** | None (fragmented rentals)  |
  | 7. Gasoline cars | Contingent   | **Not locked-in (c.1900)** | **OVERTURNS** (see below) |
  | 8. Base-60 time  | Locked-in    | **Locked-in**       | None                       |

  ### Key Overturned Verdict: Gasoline Cars (Case 7)  
  **Why:** In 1900, neither gasoline nor electric had significant *entrenched complementary systems*. Gas stations, repair networks, and oil infrastructure were embryonic. A coordinated shift (e.g., by utilities or manufacturers) could have avoided lock-in. The principle says this wasn't locked-in yet; path dependence emerged *later* as infrastructure fragmented. Your intuition about divergent outcomes is correct, but lock-in solidified post-1910.

  ---

  ### New Case Predictions:
  1. **Electric Vehicle Charging Standards (Today):**  
     → **Principle Verdict:** *Not yet locked-in*. Fragmented automakers and governments are still coordinating (e.g., Tesla opening Superchargers). Adjustments remain possible without scrapping all vehicles.  
     → Contrasts with **Blu-ray vs. HD DVD**: *Locked-in* once studios/producers fragmented.

  2. **English Spelling Reform:**  
     → **Principle Verdict:** *Locked-in*. Requires simultaneous changes by publishers, educators, software developers, and billions of users—none can capture enough benefits to justify individual costs.

  3. **Daylight Saving Time (DST) Abolishment:**  
     → **Principle Verdict:** *Not locked-in*. Governments can mandate it unilaterally (like Sweden's traffic shift), as complementary systems (IT, transport) adjust automatically.

  ---

  ### Why This Principle Over Others:
  - **Saves all your verdicts except Case 7** (gasoline c.1900), which it reinterprets as *not yet locked-in*.  
  - **Abandons your "token/type" distinction** (Cases 6-7) by focusing on systemic fragmentation.  
  - **Explains Case 5's failure**: Revolutionary France controlled the calendar but not complementary social/religious practices (fragmented resistance).  
  - **Better than "scrapping capital"**: Captures why Sweden succeeded (no complements) and Betamax failed (rental market fragmentation ≠ physical capital).

  ### If Forced to Abandon One Verdict First:  
  Case 5 (Ten-day week). While the principle preserves your "locked-in" verdict, it rejects your implied *reason* (state authority alone suffices). The deeper logic shows why calendar changes face unique social complements—making it more like QWERTY than Sweden. But since the verdict aligns, Case 7 is the cleaner overturn.

  ---

  **In essence**: Lock-in emerges when society-wide coordination fails due to *distributed costs* and *concentrated benefits* across interdependent systems. The state can override this only if it controls all complements (Sweden) or fragmentation is low (metric in France).
