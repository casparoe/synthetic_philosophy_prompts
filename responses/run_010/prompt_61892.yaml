prompt: |-
  I convene a graduate reading group on social epistemology, and next term's speaker defends reductionism about testimony in an unusually strong form: on her view a hearer is entitled to believe what she is told only where she has case-specific, locally available reasons for taking that particular speaker to be sincere and competent on this occasion — cues she can read in the exchange itself — and a general inductive record for testimony as a source does no justificatory work at all. It is, in other words, local reductionism pushed considerably further than its usual defenders push it. She has also said in print that she is unmoved by the developmental objection, since on her account a child learns to read those cues perceptually rather than on anyone's say-so.

  Please draft eight questions for the hour, ordered so that each one narrows an exit the preceding answer is likely to open: begin with whether ordinary monitoring actually tracks sincerity and competence to any useful degree, and what her requirement amounts to if it does not; move to domains in which no local cue tracks competence at all, such as a patient assessing an oncologist's pronouncement; then to the bootstrapping of whatever background sensitivity she concedes to the child, and whether conceding it quietly restores the general inductive base she has rejected; and close on what distinguishes a positive-reasons requirement from a mere defeasible presumption of truthfulness, given that her opponents insist the presumption is all they ever claimed. For two of the eight, of your choosing, supply the reply you expect from her and the counter-question it should draw.

  Write the whole thing in British English. Before the questions, state which of them you expect her to absorb most comfortably and why, and say what she could answer that would show you had misread the position badly enough to warrant scrapping or rewriting one of the eight.
reasoning: |-
  Okay, the user is convening a graduate reading group on social epistemology and needs help drafting questions for a speaker who defends an unusually strong form of reductionism about testimony. Let me start by understanding the core of the speaker's position. She argues that a hearer can only believe testimony if they have case-specific, locally available reasons to trust the speaker's sincerity and competence in that particular instance. General inductive records about testimony's reliability don't count. She also dismisses the developmental objection by claiming children learn to read cues perceptually, not through testimony.

  The user wants eight questions that progressively close off escape routes. The sequence should start with questioning whether ordinary monitoring effectively tracks sincerity and competence. If not, what does her requirement amount to? Then move to domains like medicine where local cues are insufficient. Next, probe how children bootstrap their sensitivity without a general inductive base, and whether this implicitly reintroduces it. Finally, challenge the distinction between her positive-reasons requirement and the defeasible presumption her opponents advocate.

  I need to ensure each question builds on the previous answer, narrowing exits. The user also wants two questions with expected replies and counter-questions. Plus, identify which question she'd handle most comfortably and what response would indicate a misreading of her position.

  First, assessing the speaker's likely comfort zone. She's written about perceptual cues and child development, so questions on developmental objections (Q4/Q5) might be where she's strongest. She argues children learn cues perceptually, so Q4/Q5 align with her published views. If she struggles there, it might signal a misreading. For instance, if she concedes that background sensitivity relies on testimony, that would contradict her stance and might require revising the questions.

  Now, structuring the eight questions. Start with Q1 on the efficacy of ordinary monitoring. If she admits monitoring is fallible, Q2 challenges what her requirement means without reliable cues. Q3 takes it to domains like oncology, where local cues can't assess competence. Q4 transitions to children, asking how they bootstrap this ability. Q5 questions if that bootstrapping reintroduces a general inductive base. Q6 pushes on whether non-testimonial learning is sufficient. Q7 contrasts her requirement with a defeasible presumption. Q8 demands a clear distinction beyond defeasibility.

  For the two with replies and counters, Q4 and Q7 make sense. Q4 on bootstrapping: she'll likely say children use non-testimonial evidence to form sensitivity. Counter-question: how that evidence justifies belief without testimony. Q7 on presumption vs. reasons: she might say presumption implies no reasons needed. Counter: whether defeasible reasons still count as positive evidence.

  Potential pitfalls: If in Q3 (oncology) she argues patients can access credentials via testimony, that might show a misread. Her position rejects general induction, so allowing indirect testimony-based reasons could contradict her local reductionism. If that happens, Q3 needs reworking or scrapping.

  Need to phrase in British English. Words like "monitoring", "bootstrapping", "inductive base", and spelling like "defeasible" (not defeasable). Ensure questions are sharp and close logical exits. Check flow: each answer should lead to the next question, blocking easy outs. For example, after Q1's efficacy, Q2 tackles what's left if monitoring is poor. After Q3's hard cases, Q4 shifts to development to probe the origin of the required sensitivity.
answer: |-
  Below is a structured set of eight questions drafted in British English, tailored for your speaker's robust local reductionism. The sequence aims to methodically close potential escape routes by building upon each preceding answer. I've also included the requested analysis of her probable comfort zone and a potential misstep indicator.

  **Analysis of Expected Comfort & Misreading Signal:**
  -   **Most Comfortable Question:** She will likely absorb **Q4 (bootstrapping in development)** most comfortably, as she has explicitly addressed the developmental objection in print. Her account leans heavily on perceptual cue-reading as a non-testimonial foundation, making this familiar territory where she can confidently elaborate on her distinctive mechanism for acquiring sensitivity without invoking a general inductive base.
  -   **Misreading Indicator:** If, in response to **Q3 (oncologist example)**, she argues that the patient *can* access relevant competence cues (e.g., institutional credentials, observed manner) *through other testimonial chains* she deems locally justified in that moment, it would indicate a severe misreading of her position on my part. Conceding that local justification routinely *depends* on embedded testimonial links (like trusting the institution's hiring processes based on other local exchanges) would fundamentally undermine her rejection of any necessary role for a general inductive record and warrant scrapping or significantly rewriting Q3 and potentially Q5-Q7, as her localism would implicitly rely on distributed testimony after all.

  **The Eight Questions:**

  1.  **Efficacy of Ordinary Monitoring:** You argue justification requires the hearer to possess locally available reasons, grounded in perceptible cues within the exchange, for believing *this* speaker is sincere and competent *on this occasion*. To what extent do ordinary hearers actually monitor for, and reliably detect via such cues, instances of *insincerity* (e.g., subtle deception) or *specific incompetence* (e.g., subtle misunderstanding of the subject matter)? If this monitoring is highly fallible in practice, what substantive justificatory work does your requirement actually perform, beyond merely demanding an *attempt* at vigilance that often fails?
      *   *[Exit Narrowed: Prevents hand-waving about "available cues" without confronting their practical reliability and epistemic yield.]*

  2.  **Requirement without Reliable Tracking:** Following on, if the perceptible cues ordinary hearers rely upon are demonstrably poor indicators of sincerity or deep competence in many real-world exchanges (as psychological studies on deception detection or expert overconfidence might suggest), what does your requirement for "locally available reasons" amount to? Does it collapse into demanding merely *some* internal mental state in the hearer (like hopeful attention), regardless of its objective connection to truth-conduciveness? If not, what anchors the justificatory force of these reasons if they don't reliably track the properties they are supposed to warrant belief in?
      *   *[Exit Narrowed: Prevents retreat to a purely internalist/subjectivist notion of "reasons" divorced from reliability.]*

  3.  **Domains Devoid of Local Competence Cues:** Consider a lay patient receiving a complex prognosis from an oncologist. The patient lacks the conceptual framework to discern, via any locally available perceptual cues *within that exchange*, whether the oncologist is genuinely competent regarding the specific complexities of their case (e.g., subtle diagnostic nuances, latest trial data applicability). According to your view, is the patient therefore *never* entitled to believe the oncologist's testimony? If they *are* entitled, what locally available, case-specific reasons pertaining to *competence* (not just sincerity) could possibly function here?
      *   *[Exit Narrowed: Forces confrontation with domains where competence is inherently opaque to local perceptual assessment by the hearer.]*

  4.  **Bootstrapping the Background Sensitivity:** You argue the child acquires the sensitivity to read sincerity/competence cues perceptually, not via testimony. Could you elaborate on the specific *non-testimonial* learning process by which this background sensitivity is "bootstrapped"? What kind of evidence (e.g., direct correlation of utterances with observed outcomes, innate perceptual capacities?) allows the child to *initially* form reliable associations between specific perceptible cues and the underlying properties of sincerity/competence, entirely independently of believing anyone's word for it?
      *   *[Exit Narrowed: Targets the foundational acquisition mechanism, demanding specifics beyond assertion.]*
      *   *Expected Reply:* "The child observes regularities between a speaker’s utterances, their subsequent actions, and independently verifiable states of the world *without needing to believe the utterances*. For instance, seeing a parent point and say 'dog' while a dog is perceptually present, or noting distress cues when a parent says 'hot' before touching a stove the child later feels is hot. This builds a sensitivity to correlations between behavioural/perceptual cues and reliable outcomes *prior* to forming testimonial beliefs based on content."
      *   *Counter-Question:* "But doesn't this process *itself* require the child to form justified beliefs about the correlations they observe (e.g., *that* this facial expression correlates with subsequent truth-telling)? If so, what justifies *those* correlational beliefs? If it's just brute perceptual association or conditioning, does that provide the kind of normative *justification* your reductionism requires, or merely a reliable causal process?"

  5.  **Implicit Inductive Base?:** Doesn't the bootstrapped "background sensitivity" you describe, once acquired, function *de facto* as a highly generalised, inductively formed capacity? The child (and later adult) doesn't re-learn from scratch for each new speaker or type of utterance; they apply a pre-existing, learned sensitivity. Isn't this conceded background sensitivity precisely the kind of general, inductively supported basis for trusting testimony (albeit mediated by cue-reading) that your strong local reductionism explicitly rejects as doing *any* justificatory work? How is it meaningfully distinct?
      *   *[Exit Narrowed: Challenges whether the bootstrapped sensitivity smuggles in the forbidden general inductive element.]*

  6.  **Sufficiency of Non-Testimonial Learning:** Is the non-testimonial learning process sufficient to bootstrap the necessary sensitivity for *all* types of testimony a mature hearer encounters? For instance, can one perceptually learn, without any reliance on testimony, the cues indicating competence in highly specialised domains (e.g., quantum mechanics, Byzantine history) that the hearer themselves cannot independently verify? If not, how is the hearer ever justified in believing testimony in such domains on your view?
      *   *[Exit Narrowed: Questions the scalability and scope of the bootstrapping mechanism.]*

  7.  **Reasons vs. Mere Presumption:** Your opponents often argue for a "defeasible presumption of truthfulness" – a default entitlement to believe testimony that can be overridden by defeaters. You require "positive, locally available reasons". Given that both positions accept defeaters, and given that your "reasons" might be subtle cues functioning as triggers rather than robust evidence, what is the *substantive, functional difference* between your "positive reasons requirement" and their "defeasible presumption"? Does your view demand anything *more*, in practice, than their presumption plus a requirement for vigilance for defeaters (which they also accept)?
      *   *[Exit Narrowed: Presses for a clear, non-terminological distinction from the opposing mainstream view.]*
      *   *Expected Reply:* "The crucial difference is one of justificatory *grounding*. The presumption view grants entitlement *prima facie*, rooted in a (rejected) general property of testimony or speakers. My view denies any such initial, presumption-based entitlement exists *at all*. Justification *only* arises when, and because, the hearer *actively* identifies specific, local cues providing positive, case-specific evidence for sincerity/competence. It’s not a default overcomable by defeaters; it’s a positive state that must be achieved."
      *   *Counter-Question:* "If these 'positive reasons' are perceptually accessed cues whose justificatory force stems entirely from the bootstrapped background sensitivity (which itself arose non-testimonially), and if this sensitivity operates swiftly and automatically in ordinary, non-suspicious encounters (making belief formation passive), how does the *epistemic structure* of this process meaningfully differ *for the hearer in that moment* from acting on a defeasible presumption triggered by the same cues? Both seem to result in belief based on perceived normalcy, absent defeaters."

  8.  **Distinction Beyond Defeasibility:** Building on the previous answer and counter-question, if the functional process and resulting belief state in a normal, unchallenged testimonial exchange are indistinguishable between your view (with its automatically triggered cue-based reasons) and the defeasible presumption view (with its automatically triggered presumption), what *concrete epistemic consequence* or *practical difference in hearer obligation* does your stronger requirement actually enforce? What belief or action is mandated by your view that isn't also mandated by the presumption view plus vigilance?
      *   *[Exit Narrowed: Final demand for a tangible difference in normative outcome or obligation, preventing the distinction from collapsing into mere foundational metaphysics.]*

  This sequence aims to rigorously test the coherence, applicability, and distinctiveness of her unusually strong local reductionism, moving from empirical challenges to its core mechanism and culminating in a demand for its unique practical implications.
