prompt: |-
  So I'm a junior and I run the peer ambassador thing at my school, which means when the exchange students land in September I do a 40 minute orientation on how everyday stuff works here — not the paperwork, the unwritten parts. Last years version went badly. I told them you're expected to tip around 18% at a sit-down restaurant, that you don't cross against the light even when the street is completely empty, that there's an order people stand in at the bus stop even though nobody marks it out, and that you bring something when a family invites you to dinner. A kid from Rome said the crosswalk one is ridiculous if there's no car coming and nobody gets hurt, and a kid from Denmark said she has never tipped in her life and nobody back home thinks she's a bad person, and I couldn't answer either of them except "well, it's expected here," which is a weak answer and everyone in the room knew it. My sponsor's verdict afterwards was that I'd mashed together rules that are actually moral obligations and rules that are just local habits without ever working out which is which, and she said I can redo the session this year if I do the work first.

  So — don't explain the philosophy to me, plan the session. I've got 40 minutes, a library room with a whiteboard, about 15 kids aged 15–18 from maybe 8 countries, and honestly half of them are still shaky in English.

  Tell me the order the ideas have to go in and why, like what genuinely depends on what. My current plan opens with a list of do's and don'ts and I'm pretty sure that's exactly backwards.

  Then pick the one example that should carry the whole thing and say what it has to have and what would wreck it. I was going to use tipping but I worry it's too tangled up with money and with people's actual wages to be a clean case. My candidates: the bus stop order, crossing against the light with no cars, bringing something to dinner, and answering "how are you" with "good" even when it isn't. Tell me which one and which ones I should just cut.

  I also have this half-finished sorting thing in my head — some norms are about not hurting people, some are about being fair, some are just about coordinating so things run smoothly — and I can't tell whether that third bucket actually obligates anybody. Help me decide if it's real enough to teach, and if it is, how I explain the free rider point (that if everyone thought the way the kid from Rome did, the crosswalk thing stops working) without it turning into a game theory lecture they zone out of. And I need the honest version for the norms where he was right and it *isn't* morally required — how do I say "you're not a bad person if you skip this one" to a guest without it landing as "so your rules are fake."

  Map the misconceptions: the ones they'll walk in with and the ones my session will create if I'm careless. I'm guessing at — it's not a law so it doesn't matter, Americans are just uptight, your norms are the neutral ones and mine are the weird local ones, and I never agreed to your rules so they can't bind me. Say where in the running order each gets headed off, including whichever one I cause myself.

  End with something I can ask that shows whether the distinction landed or whether they just got politely quiet. And a short list of what you're leaving out on purpose at this level, plus what I say if someone asks anyway, because someone always asks whether there's a deeper answer.

  Two more things. My sponsor wants a handout at the end with the house rules printed on it and I think that undercuts the entire point, so tell me what should actually be on that page. And 4 or 5 of our own students are going abroad for the year, so if there's a version of this about whether your obligations follow you to another country, tell me whether it fits in the 40 minutes or if I should flag it and do it seperately. No reading list or citations pls, I don't have time to read anything and neither do they.
reasoning: |-
  Okay, let me tackle this peer ambassador's problem. They need to redesign their orientation session for exchange students after last year's session didn't go well. The main issue was presenting norms as universal rules without distinguishing between moral obligations and cultural habits. 

  First, I need to understand their core challenge: helping students grasp why some norms matter more than others, especially when they seem arbitrary. The sponsor pointed out that mashing moral obligations with local habits caused confusion. So the key is to structure the session around this distinction from the start.

  The user has 40 minutes with 15 teens from diverse backgrounds, many still learning English. They need a clear flow of ideas where each concept builds on the last. Starting with a list of do's and don'ts is ineffective because it presents norms as equal. Instead, the session should begin with why norms exist at all—creating a shared purpose before diving into specifics.

  For the flow: Begin with the universal human need to coordinate (e.g., traffic lights). Then introduce the three buckets: harm prevention (moral), fairness (semi-moral), and coordination (practical). This order makes the framework intuitive before applying it to examples.

  The tipping example is too messy due to wage structures. Instead, answering "how are you?" works best as the central case study. It's low-stakes, universally experienced, and perfectly shows coordination vs. sincerity. You can demonstrate how violating it causes minor friction without moral judgment. The bus stop example is too vague, jaywalking is legally fuzzy, and bringing gifts overlaps with fairness—so those are secondary.

  The coordination bucket is valid but needs simple framing: "Norms as tools." Explain that systems break if everyone free-rides (e.g., "If all crossed empty streets randomly, predictability vanishes"). Use the whiteboard to sketch scenarios, not theory. For norms without moral weight, explicitly say "This won't make you a bad person—it's about smoothing interactions."

  Misconceptions must be preempted: Early on, clarify that not all norms are laws (addressing "no law = no consequence"). When discussing coordination norms, emphasize arbitrariness to avoid "Americans are uptight." Use the "how are you" example to show neutrality—every culture has these. For "rules can't bind me," stress that norms are about respecting host communities, not personal agreement.

  End with a scenario quiz: "Your host mom says dinner's 'interesting' but you hate it. Do you: (a) Say so, (b) Say 'It's good'?" Their choices reveal if they grasp the sincerity/coordination trade-off. Omit deep philosophy—if asked, reply "Great question! Ask me after."

  For the handout: Avoid rules lists. Instead, provide a decision flowchart ("Could it harm? Is it unfair? Does it disrupt coordination?") and space for notes. For outbound students, add a line: "When abroad, your 'home' norms shift to 'local'—observe and ask." But save detailed discussion for a separate session due to time.

  This approach turns norms from a checklist into a thinking tool—exactly what the sponsor wants.
answer: |-
  Here’s a battle-tested session plan designed for clarity, engagement, and avoiding last year’s pitfalls. The core goal is **teaching them *how* to navigate cultural norms, not just listing rules**. Timing is tight, so precision is key.

  ---

  ### **Session Structure & Flow (40 Min Total)**
  *(Why this order: Builds from universal human experiences → cultural frameworks → practical application)*

  1.  **Hook: The "Lost in Translation" Feeling (5 min)**
      *   **Do:** Show a funny/relatable meme/video about cultural misunderstandings (e.g., someone bowing when they should handshake, or vice versa). Ask: "Ever felt confused or awkward in a new place? What happened?"
      *   **Why:** Creates immediate empathy and shared experience. Establishes the session's purpose: reducing that confusion. *Crucially, positions THEM as the experts on feeling lost, not you lecturing.*

  2.  **The "Why" Before the "What": Why Norms Exist At All (10 min)**
      *   **Do:** Use the whiteboard. Draw 3 simple columns: **Safety/Harm**, **Fairness/Respect**, **Smooth Coordination**. Explain:
          *   **Safety/Harm:** "Rules stopping people getting hurt (physically/emotionally). *Example: Don't push someone.* **Obligation: High.**"
          *   **Fairness/Respect:** "Rules about treating people decently or sharing burdens. *Example: Taking turns.* **Obligation: Medium-High (context matters).**"
          *   **Smooth Coordination:** "Habits helping groups work predictably, even if arbitrary. *Example: Which side of the sidewalk to walk on.* **Obligation: Low-Medium (but practical!).**"
      *   **Why:** Provides the essential framework *before* examples. Answers the "why" question upfront. Makes the distinction concrete. Uses simple English + visuals.

  3.  **Deep Dive: The ONE Example to Rule Them All - "How are you?" (10 min)**
      *   **Pick THIS:** **Answering "How are you?" with "Good" even if you're not.**
      *   **Why it Works:**
          *   **Universal:** Every culture has greeting rituals.
          *   **Low-Stakes:** No money, safety, or deep ethics involved.
          *   **Perfectly Illustrates Coordination:** It's purely about predictable social flow ("I say X, you say Y, we move on quickly"). Shows the "smooth coordination" bucket brilliantly.
          *   **Clean Distinction:** It's *not* about lying in a deep moral sense. It's a social lubricant. Violating it causes minor friction (awkwardness, stalled convo), not harm or unfairness.
          *   **Easy to Demo:** Role-play! You: "How are you?" (Expecting "Good"). Student (playing "clueless"): "Terrible! My foot hurts, my bag is heavy..." Show the awkward pause. "See? The *coordination* broke."
      *   **What Wrecks It:** Framing it as "Americans are fake" or "You MUST lie." Instead: **"It's a signal meaning 'I acknowledge you politely; let's proceed.' Responding with deep truth is like answering 'What's up?' with a weather report – mismatched signals!"**

  4.  **Applying the Framework: Sorting Other Examples (10 min)**
      *   **Do:** Put your other examples on the whiteboard under the 3 columns. *Guide them to sort them using your framework.*
          *   **Tipping (Fairness/Respect):** "In the US, servers rely on tips for living wage. Not tipping *harms their income* (Fairness). *Cut this as a primary example* – too complex/wage-related. Briefly mention it fits here if asked."
          *   **Bringing Something to Dinner (Fairness/Respect):** "Shows appreciation for effort/host's resources (Fairness). *Not morally required, but strongly expected as respect.*"
          *   **Bus Stop Order (Smooth Coordination):** "Prevents chaos/fights when bus arrives. *Pure coordination. No moral fault for not knowing, but practical to follow.*"
          *   **Crossing Against Empty Light (Safety/Coordination - BUT):** "Primarily *Safety* (prevents accidents with unexpected cars). Coordination (predictable flow). BUT... **Honest Version:** 'The safety rule is *don't get hit*. If you *truly* see **zero** cars/pedestrians for blocks, jaywalking isn't immoral. BUT, 1) Cops *can* ticket, 2) Locals *will* judge, 3) *Doing it constantly undermines the coordination norm that keeps everyone safe when it's busy.*'"
      *   **Why:** Active participation reinforces the framework. Shows how to *use* the buckets. Addresses last year's objections within the structure. Explicitly states obligation levels.

  5.  **Tackling Misconceptions Head-On (Built into Flow)**
      *   **"It's not a law, so it doesn't matter."** *Handled in Step 2 (Framework):* Explain Coordination/Fairness norms exist *alongside* laws. Consequences are social friction, not jail. *Reinforce with "How are you?" example.*
      *   **"Americans are just uptight/weird."** *Handled in Step 3 (Deep Dive):* Frame "How are you?" as a *functional* signal, not American "fakeness." *Handled in Step 4:* Acknowledge arbitrariness of Coordination norms ("Bus stop order could be different elsewhere, *here* it's this way").
      *   **"Your norms are neutral, mine are weird."** *Handled in Hook/Step 2:* Start with *their* experiences feeling lost. Emphasize *all* cultures have these buckets; the *specifics* differ. "Your way back home makes total sense *there*; these make sense *here* for local reasons."
      *   **"I never agreed, so they can't bind me."** *Handled in Step 2/Step 4:* "You agreed by choosing to visit/live here temporarily. It's about respecting the local 'operating system' to function smoothly and avoid causing accidental friction. You're not bound morally by Coordination norms, but ignoring them makes *your* life harder." *Use Free Rider subtly:* "If *everyone* crossed against empty lights whenever they felt like it, the system of predictable traffic flow breaks down, and safety *actually* decreases. Following the coordination norm, even when inconvenient, keeps it working for everyone." (No game theory terms!).
      *   **Misconception YOU Cause: "So your rules are fake."** *Preempted in Step 3 & Step 4:* Explicitly state for Coordination norms: **"Doing this doesn't make you a *bad person*. It might just make the interaction awkward, slow things down, or get you some surprised looks. It's about knowing the local 'code' for smooth sailing."**

  6.  **Check for Understanding & Wrap-Up (5 min)**
      *   **Do:** **Scenario Quiz (Verbal/Show of Hands):**
          1.  "Your host family's dog jumps on you. You *hate* dogs. They say 'He's friendly!' You say...?" (Options: "Get it away!" / "It's okay, no problem!" / Silence). *Correct: "It's okay..." (Coordination - smooth interaction, low stakes).*
          2.  "A cashier gives you too much change. You notice. You...?" (Options: Keep it / Point it out). *Correct: Point it out (Fairness).*
          3.  "The bus stop is chaotic, no line. You see space near the door. You...?" (Options: Push to the front / Try to find where the end *might* be / Ask "Is this the line?"). *Correct: Ask or observe first (Coordination - trying to fit in).*
      *   **Why:** Active, low-pressure check. Reveals if they grasp the *application* of the framework. "Politely quiet" won't hide wrong answers here.
      *   **Final Message:** "You won't get it perfect! That's okay. Observe, ask polite questions ('How does this usually work?'), use the buckets to *think* about why a norm might exist. Your goal is reducing friction, not memorizing rules."

  ---

  ### **What to Cut & Why**
  *   **Cut Tipping as a Primary Example:** Too complex (wages, math, regional variations). Mention it *briefly* as a Fairness norm if it comes up, but don't dwell.
  *   **Cut Deep Philosophy:** No lectures on moral relativism or social contract theory. Stick to practical buckets.
  *   **Cut Exhaustive Lists:** 3-4 well-analyzed examples are better than 10 listed rules.

  ---

  ### **The Handout: Your Secret Weapon (Not a Rule Sheet!)**
  **Title:** "Navigating Cultural Norms: Your Quick-Reference Guide"
  **Content:**
  1.  **The 3 Buckets Framework (With Simple Icons):**
      *   Safety/Harm (🚨) - High Obligation
      *   Fairness/Respect (⚖️) - Medium-High Obligation
      *   Smooth Coordination (↔️) - Low-Medium Obligation (But Practical!)
  2.  **Key Questions to Ask Yourself:**
      *   "Could this hurt someone (physically/emotionally)?" (🚨)
      *   "Is this fair to others? Does it show respect?" (⚖️)
      *   "Will this make things run smoother or cause confusion/friction?" (↔️)
  3.  **Space for THEIR Notes:** Encourage them to jot down norms they observe under each bucket during their stay.
  4.  **1-2 Key Contacts:** Your email, the international student office.
  **Why this works:** It reinforces the *framework*, empowers them to *analyze*, and avoids the dreaded "rule list" your sponsor wants. It's a thinking tool.

  ---

  ### **Outbound Students (The 4-5 Going Abroad)**
  *   **Fit into the 40 Min?** **Brief Flag Only.**
      *   During the Wrap-Up: "For those of *you heading out soon, remember this works both ways! Your 'home' norms become the 'local' norms others navigate where you're going. Observe, ask, and think about *their* buckets."
  *   **Do Separately?** **YES.** Their needs are different (anticipating culture shock, specific host country norms, managing their own expectations). A dedicated 30-min debrief using the *same framework* but flipped ("What norms might confuse *you* there? Use the buckets!") is ideal. Offer to run it.

  ---

  ### **When They Ask for the "Deeper Answer"**
  *   **Your Response:** "That's a really smart question! The quick version is: these norms help our specific society function smoothly based on our history and values. The *deep* reasons involve sociology, history, and philosophy – fascinating stuff, but too much for now! The best way to learn is to **observe, ask polite questions when confused**, and think about those three buckets: Safety? Fairness? Smooth Coordination? If you're still curious later, come find me or [Sponsor] – we love talking about this!"

  ---

  **Summary of Why This Works:**
  1.  **Starts with THEIR experience** (Hook), not your rules.
  2.  **Provides the essential tool first** (The 3 Buckets Framework).
  3.  **Uses one perfect, low-stakes example** ("How are you?") to solidify the trickiest concept (Coordination).
  4.  **Makes them apply the tool** (Sorting examples) actively.
  5.  **Preempts major misconceptions** within the flow.
  6.  **Checks understanding practically** (Scenario Quiz).
  7.  **Replaces the rule list** with a **framework handout**.
  8.  **Acknowledges complexity** without getting bogged down.

  You're not just giving rules; you're giving them **cultural navigation skills**. Good luck!
