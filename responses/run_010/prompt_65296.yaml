prompt: |-
  I co-teach a seminar with the economic historians and there's a practice in that literature I can't quite get a handle on. People working on the so-called great divergence have mostly stopped asking "why did Europe pull ahead of China?" and now compare matched regions instead — say, England against the Yangzi delta — on the grounds that the civilisation-level question isn't really a question at all. But the books still come with civilisation-level titles, and at every job talk somebody asks the candidate to say somthing about China as a whole.

  What theory of explanation does the matched-region practice presuppose? Reconstruct it for me. Does it commit you to the view that "why P" is incomplete until the contrast class is named, and that the contrast class fixes what the explanandum even is? Which rival accounts of explanation does it rule out — and does it genuinely rule them out, or just happen not to need them? Then the wrinkle: is that practice consistent with the way the same people still describe their own subject, or is the literature hedging between two incompatible pictures of what its question is? And what would have to change, methodologically, if you took the harsher line that "why Britain and not China?" isn't one question but a loose bundle of them, each indexed to whatever causal factors the asker happens to have in hand?

  Argument, not bibliography, please.
reasoning: |-
  Okay, let me start by really unpacking what the user is asking. They’re co-teaching a seminar with economic historians and noticed a methodological tension in the Great Divergence literature. On one hand, scholars have shifted from comparing entire civilizations (Europe vs. China) to matched regions like England and the Yangzi Delta. On the other, they still use civilizational titles and face civilizational questions in job talks. The user wants to understand the underlying theory of explanation here and whether the practice is consistent.

  First, I need to reconstruct the presupposed theory of explanation. The shift to regional comparisons suggests a contrastive approach. That means explanation isn’t just "why P?" but "why P rather than Q?" The contrast class defines the explanandum. For example, asking why England industrialized instead of the Yangzi Delta focuses on specific differences rather than broad civilizational traits. 

  I should consider what this implies about causation. By using matched regions, scholars isolate variables. Both regions might share some factors (like commercialized agriculture), so the key differences (coal access, institutions) become the focus. This aligns with a difference-making account of causation—what factors made the difference given similar starting points. 

  Now, the tension: why do books still have civilizational titles? Maybe it’s branding or framing, but the actual analysis is regional. When someone asks about China as a whole in a job talk, it might be out of habit or tradition. But the regional method doesn’t address that broader question. So there’s inconsistency between method and presentation. 

  The user’s deeper concern might be about coherence in the field. Are scholars aware of this disconnect? If they insist on regional analysis but use civilizational terms, it could confuse the explanatory goals. Maybe the user is hinting at a need for methodological clarity or is frustrated with unresolved tensions in the literature. 

  Also, the last part about treating "why Britain and not China?" as a bundle of questions. If each factor (institutions, geography) defines a separate contrast, then the civilizational question is an umbrella for many specific ones. This could mean that the singular civilizational question is ill-posed. Embracing this would require scholars to specify their contrast classes explicitly, avoiding broad generalizations. 

  I should argue that the regional method rules out monolithic civilizational explanations. It implies that sweeping cultural or institutional theories aren’t sufficient without regional specificity. The inconsistency in the literature might stem from tradition versus methodological evolution. To resolve it, scholars need to commit to either regional frameworks or develop new methods for civilizational analysis, but mixing both creates confusion. 

  In summary, the matched-region practice relies on contrastive explanation and difference-making causation. The literature’s hedging between regional and civilizational frames is inconsistent. Addressing this would require clearer methodological commitments, perhaps by abandoning civilizational labels or explicitly justifying their use despite regional focus.
answer: |-
  The matched-region practice rests on a **contrastive theory of explanation** and a **difference-making account of causation**, which together expose a fundamental inconsistency in the literature's self-presentation. Here's the reconstruction and critique:

  1.  **The Presupposed Theory of Explanation:**
      *   **Contrastive Core:** The practice explicitly rejects "Why Europe?" or "Why China?" as ill-formed questions. It presupposes that "Why P?" is incomplete without specifying "rather than Q?". The *contrant class* (Q) is not peripheral; it *defines the explanandum*. Asking "Why did England industrialize first *rather than the Yangzi Delta*?" specifies a fundamentally different target than "Why did England industrialize first *rather than France*?" or "Why did England industrialize first *rather than the entire non-European world*?".
      *   **Causal Specificity via Matching:** Matching regions (England & Yangzi Delta) aims to hold constant a vast array of potential confounding factors implicitly shared by highly developed, commercialized, proto-industrial regions within complex agrarian empires. By comparing *like-with-like* at a high level of development, scholars isolate the specific differences that *made the difference* in the outcome divergence. The presupposition is that causal claims are only meaningful relative to a specific comparison. "Factor X caused England's divergence" is shorthand for "Factor X (present in England, absent or weaker in the Yangzi Delta) explains the divergence *between these two specific regions*."
      *   **Ruling Out Monolithic Explananda:** This practice inherently rules out explanations seeking a single, unified cause for "European superiority" or "Chinese stagnation" conceived at the civilizational level. It implies that such entities ("Europe," "China") are not causally homogeneous units possessing a single set of properties determining the outcome. The divergence wasn't between monolithic blobs, but between specific developmental trajectories within complex systems.

  2.  **Rival Accounts Ruled Out (or Marginalized):**
      *   **Covering Law/Nomological Deduction:** The practice doesn't assume or seek universal laws of civilizational development. It focuses on concrete historical differences within a specific context, not deducing outcomes from general principles applicable to all "civilizations." The specificity of the contrast class makes universal laws irrelevant to the specific explanation sought.
      *   **Essentialist/Cultural Explanations:** By matching regions *within* civilizations that share broad cultural, institutional, or philosophical backgrounds (e.g., highly commercialized core regions within Confucian bureaucratic empires vs. within European feudal/monarchical states), the practice deliberately sidelines explanations relying on essential, immutable civilizational characteristics ("Confucian conservatism," "Western rationality"). If the Yangzi Delta was highly dynamic within "conservative China," and parts of Europe stagnated within "dynamic Europe," the civilizational label cannot be the primary cause of the *specific divergence* between England and the Yangzi Delta.
      *   **Simple Unificationism:** While coherence is valued, the practice prioritizes identifying the *specific difference-makers* relevant to the *specific contrast* over constructing a single, elegant narrative explaining "The Rise of the West" or "The Fall of the East."

  3.  **The Inconsistency (Hedging):**
      The literature is demonstrably inconsistent. **The methodological practice presupposes that "Why Britain and not China?" is not a single, coherent question.** Yet:
      *   **Civilizational Titles:** Framing books with titles about "China," "Europe," or "The Great Divergence" tacitly reinstates the civilizational explanandum the methodology rejects. This is often marketing/tradition, but it perpetuates the monolithic view.
      *   **Job Talk Questions:** Demanding comments on "China as a whole" reveals a persistent, often unreflective, attachment to the civilizational level of analysis, incompatible with the regional-comparison logic. It asks the candidate to speculate beyond the scope defined by their methodological approach, forcing them to either awkwardly generalize from their regional focus or admit the limitations – a lose-lose.
      This **is hedging.** The field employs a sophisticated method acknowledging the complexity and specificity of causation, yet frequently reverts to the simpler, grander (but analytically flawed) civilizational framing for communication, tradition, or intellectual habit. The two pictures *are* incompatible: one sees the explanandum as a specific divergence between comparable sub-units; the other sees it as a fundamental shift between monolithic entities.

  4.  **Embracing the Harsher Line: Methodological Consequences:**
      Accepting that "Why Britain and not China?" is a bundle of distinct questions indexed to specific causal factors/contrasts demands rigorous methodological changes:
      *   **Explicit Contrast Specification:** Every research question must *begin* by defining the precise contrast class. "Why did factory production emerge in Lancashire *rather than in Jiangnan* in the 18th century?" is distinct from "Why did British state capacity exceed Qing capacity *in supporting naval power* in the 19th century?" These are different questions requiring different evidence and potentially different explanations.
      *   **Abandon Civilizational Labels in Core Analysis:** Titles and framing would need radical honesty: "Divergence in Capital Intensity: Lancashire vs. Jiangnan, 1700-1830" rather than "Why Europe Beat China." Analysis would strictly avoid claims about "China" or "Europe" based solely on a regional comparison, except where evidence explicitly addresses the larger entity.
      *   **Factor-Specific Questions:** Research programs would be organized around specific factors and their relevant contrasts. "What difference did access to coal make *for early steam power adoption* in England vs. the Yangzi Delta?" becomes a core question. "What difference did merchant guild autonomy make *for capital mobilization* in London vs. Suzhou?" is another. The "bundle" is unpacked into its constituent, tractable inquiries.
      *   **Reconciling Levels:** Explaining divergence at the civilizational level would become a distinct, secondary task: synthesizing the results of numerous specific regional-institutional-technological comparisons *within* and *between* the broader entities. It wouldn't be the starting point or the assumed explanandum. It might even conclude that "civilizational divergence" is an unhelpful aggregation of many disparate regional trajectories.

  **Conclusion:** The matched-region practice is fundamentally sound, presupposing that explanation is contrastive and causation is about specific differences within a context. However, the literature's persistent use of civilizational framing and expectations contradicts this core methodological commitment, creating an unstable hybrid. Fully embracing the logic of the practice means abandoning the grand civilizational question as ill-formed and replacing it with a suite of precisely specified, contrastive questions about specific differences between carefully matched entities. The "harsher line" isn't just pedantry; it's the logical endpoint of the methodological shift the field has already made, demanding consistency between practice and presentation.
