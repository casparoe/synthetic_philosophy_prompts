  1. **Global Broadcasting (Baars/Dehaene):** Conscious = info available to multiple systems (speech, memory, etc.). 
     - *Problem:* Fails cases 1 (unheard speech was broadcastable later) and 5 (grid "felt" conscious but not reportable).

  2. **Higher-Order Thought (Rosenthal):** Conscious = mental state targeted by a thought about it.
     - *Problem:* Brutally fails case 4 (dog consciousness) and case 5 (unreportable grid).

  3. **First-Order Recurrent Processing (Lamme):** Conscious = local feedback loops in sensory cortex.
     - *Problem:* Struggles with case 6 (color phi's retrospective narrative) and case 7 (hallucinatory loop).

  4. **User's Loop Principle:** Conscious = real-time gain-adjusting monitoring.
     - *Strength:* Nails cases 1-3 (no loop → no experience) and case 4 (dog's basic loop).
