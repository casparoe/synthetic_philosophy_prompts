  *Choosing & Refining:*
  First-order recurrent processing (Lamme-esque) scores best. But to handle case 5's fading grid and case 6's constructed narrative, I'll hybridize it with the user's gain-adjustment idea. Final principle:

  > **Consciousness requires:**
  > (a) *Recurrent processing:* Local feedback loops in sensory hierarchies (handles cases 1-4, explains dog).
  > (b) *Gain modulation:* Loops must amplify/suppress signals (explains case 1's auditory neglect).
  > (c) *Temporal window:* States remain "experientially available" for ~200ms even if unattended (saves case 5's grid).
