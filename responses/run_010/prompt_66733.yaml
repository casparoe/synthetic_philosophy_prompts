    - Naming rights: killed (for the naming right itself).
    - Plowing surge: killed (for the service during high demand, not for time).
    - Summer book: killed (for the book reading, not time).
    - Bone marrow: killed (for the donation itself, even though it involves time and pain).
    - Participatory budgeting: approved (for giving up a Saturday, i.e., time).
    - Housing waitlist: killed (for the position itself).

  This rule might work if we interpret "time and inconvenience" broadly. But nicotine test doesn't fit cleanly because it's paying for a result (negative test) not for the time spent quitting. And bone marrow donation does involve time and inconvenience but was killed.

  Rule 5: "Payments are disallowed when they involve the human body, public assets, or essential public services, but allowed for participation in civic processes or to offset costs of mandatory civic duties."
    - Body: blood and bone marrow killed.
    - Public assets: naming rights (park) and housing waitlist killed.
