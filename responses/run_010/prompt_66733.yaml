    - Nicotine test: not creating a market? It's a reward for behavior. Approved.
    - Summer book: creates a market for reading books? Killed.
    - Plowing surge: creates a market with variable pricing in an emergency? Killed.
    - Participatory budgeting: not a market, it's an honorarium for time. Approved.

  This rule seems to fit well.

  Now, for the new case: school priority points transfer for money. This would create a market for priority points, which are part of a public school assignment system. It might undermine the purpose of the priority system (which is to give priority based on legitimate ties, not ability to pay). Also, the district taking a cut might be seen as profiting from this market.

  Under Rule 3 (perverse incentives), it would be killed because it allows families with money to buy priority, undermining the fairness of the lottery.

  Under Rule 6 (market for something that shouldn't be traded), it would be killed because priority points are part of a public system and should not be commodified.

  But let's see if any rule might allow it. Rule 4 (time and inconvenience) doesn't apply because it's about transferring points, not compensating for time.

  We must consider that in the juror pay and participatory budgeting, payments were approved because they were compensating for time and costs. In the nicotine test, it was an incentive for a positive behavior.

