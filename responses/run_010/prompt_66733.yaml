  ### Discussion  
  Renata’s pattern strongly suggests a primary rule of **Perverse Incentives Prevention**, which cleanly explains 8.5/9 cases (only blood donation requires minor rationalization as an altruism safeguard). This rule rejects payments that distort system integrity (e.g., summer reading incentivizes rushed books, housing waitlist sales prioritize wealth over need) but approves those that alleviate barriers (juror pay for childcare) or reinforce public goals (nicotine cessation). The school priority points proposal is a near-perfect analog to the housing waitlist case (9): both involve monetizing access to a public resource intended for needs-based allocation. Here, points sales would let wealth override "community tie" criteria, incentivizing families to sell priority for profit rather than use it as intended. Even with the district’s 40% fund, the core distortion remains.  

