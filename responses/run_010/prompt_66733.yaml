  2. Rule B: Payments allowed only to compensate for time/inconvenience or to incentivize positive externalities without creating perverse incentives.
  3. Rule C: Payments disallowed if they commodify something that is intrinsically non-monetary or if they undermine the purpose of a public system.

  We'll try to cover the cases.

