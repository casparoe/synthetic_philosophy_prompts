    - Civic processes: juror (mandatory duty with offset) approved, participatory budgeting (voluntary civic process) approved.
    - But nicotine test: doesn't fit. It's about health behavior, not civic. Approved? So exception.

  Rule 6: "Payments are allowed only if they do not create a market for something that should not be traded"
    - This is similar to Rule 3 but more focused on market creation.
