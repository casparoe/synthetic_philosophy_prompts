  After the table, we'll have a discussion including the closest analog and why. Then a JSON object.

  Let's brainstorm candidate rules:

  Rule 1: "No commodification of civic duty or public goods"
    - This might fit: blood donation (civic duty) killed, juror pay approved (but that's also a civic duty, so why approved? Because it's compensation for hardship, not payment for the duty itself). Similarly, bone marrow donation killed (body part, but also altruistic). Naming rights killed (public park is public good). Housing waitlist killed (public resource). But then nicotine test approved? That's a private health behavior. And participatory budgeting approved? That's civic engagement. So not perfect.

  Rule 2: "Payments are allowed only when they incentivize behavior that has positive externalities and the payment is not for the thing itself but for the effort or cost incurred"
    - Juror pay approved: covers lost wages and childcare, which are costs. Nicotine test approved: incentivizes quitting smoking (positive externality of healthier youth). Participatory budgeting approved: incentivizes participation (positive externality of civic engagement). But blood donation killed: also incentivizes donation (positive externality) and covers time/effort? Why killed? Bone marrow killed: positive externality of saving a life, and payment for effort? Summer book reading killed: incentivizes reading (positive externality). So not consistent.

  Rule 3: "Payments are disallowed if they create perverse incentives or undermine the purpose of the system"
    - Blood donation: might create incentives for unhealthy people to donate? Or commodify a gift relationship. Killed.
    - Juror pay: approved, because it doesn't undermine the system, it helps people serve.
    - Nicotine test: approved, because it encourages quitting.
    - Naming rights: killed, because it commercializes a public space and might undermine the public nature.
    - Surge pricing for plowing: killed, because it might lead to price gouging during emergencies (perverse incentive).
    - Summer book reading: killed, because it might encourage kids to read only for money and not for love of reading? Or rush through books without comprehension.
    - Bone marrow donation: killed, because paying for organs/tissues could lead to exploitation of the poor? Or undermine the altruistic system.
    - Participatory budgeting: approved, because it encourages participation without obvious perverse incentives.
    - Housing waitlist: killed, because it would allow the rich to jump the queue, undermining the purpose of public housing for the needy.

  This rule seems to fit better.

  Rule 4: "Payments are allowed only for time and inconvenience, not for the thing itself"
    - Blood: killed (payment for blood itself? But it's for donating, which takes time).
    - Juror: approved (explicitly for lost wages and childcare, i.e., time and inconvenience).
