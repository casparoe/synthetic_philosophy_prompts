prompt: |-
  Help me settle an argument with myself before I write the first section of a chapter on consent. I've been reading away at accounts of when consent counts as valid — deception, coercion, competence — and every one of them is answering a slightly seperate question, and I don't want to spend the whole chapter saying so. So instead: what would an account of valid consent actually have to deliver in order to count as adequate? Write me the spec.

  Cases it has to get right, at a minimum: the lie about something the consent-giver would have cared about but that isn't the thing being consented to (and the mirror case, where nothing false is said and they're still misled); the offer that isn't a threat but that you want to treat like one — the surgeon who charges what the traffic will bear for a life-saving operation; the drunk nineteen-year-old; the dementia patient who said yes a year ago and is now, in every sense that matters, someone else; the patient who signs the form without reading it, and who is neither obviously bound nor obviously excused; the person who says yes because every alternative is worse and who nevertheless isn't wronged by the person who offered. And the tacit-consent move: somebody falls asleep aboard a ship, wakes at open sea, and is told that staying put was agreement — the account should say whether anything of that shape can ever be consent, and if not, what it is instead of consent.

  Distinctions it can't collapse: consenting vs. submitting vs. merely not objecting; consent as an inner attitude vs. consent as a performance with uptake conditions; consent as a condition on permissibility vs. consent as one reason among others; and whether the account can stay content-neutral or has to build in limits on what may be consented to at all — if it has to, say so plainly, that's a concession with consequences and not a detail.

  Now here's the constraint I want shaping the whole list, because it's the thing the literature usually papers over: the account has to be operable by non-philosophers, inside institutions, under time pressure, in front of an audience that is partly adversarial. A nurse with four patients waiting. A Title IX panel deciding whether a coach should have been fired. A judge with a docket and a record that is mostly silence. So third-party checkability isn't a bonus feature tacked on at the end, it's one of the requirements, and I want you blunt about what it costs and who pays.

  Mark each requirement as non-negotiable or as a camp preference, and say whose camp. (My suspicion: "consent must be revocable right up to the last moment" looks like a principle and functions as a preference. Argue with me if you disagree.) Then tell me which single requirement does the most work knocking candidates out, and which pair you think can't both be satisfied. My own nominee is will-tracking against checkability — if validity has to track what somebody actually wants, no third party can ever know it, and if validity has to be checkable, we've stopped talking about autonomy and started talking about ceremony. I want that argued, not asserted, including what exactly is lost if you just bite the bullet and go ceremonial.

  Finish with a very short scorecard, a paragraph each and no more, of the three shapes on offer: attitude-only, performance-only, and the hybrid where the performance is necessary but not sufficient. And please, no bibliography — I've got one, its two pages long and I don't need a third.
reasoning: |-
  Okay, the user is writing a chapter on consent and needs help setting up the specifications for an adequate account of valid consent. They’ve listed specific cases the account must handle, distinctions it can’t collapse, and a key constraint: operability by non-philosophers in institutional settings. They want each requirement marked as non-negotiable or a camp preference, and they’re particularly interested in the tension between will-tracking and checkability.

  First, I need to break down their requirements. The cases include deception, coercion, competence, revocation, and tacit consent scenarios. The distinctions are between consenting vs. submitting, inner attitude vs. performance, and permissibility vs. one reason among others. The operability constraint is crucial—this account must work in real-world, time-pressed environments like hospitals or courtrooms.

  The user suspects that some principles, like revocability, might actually be preferences. I should evaluate each requirement. For example, core validity conditions (avoiding deception, coercion) are non-negotiable because they’re foundational to consent. Competence and situational awareness also seem non-negotiable. But revocability? That’s tricky. While important, in some contexts (like surgery), it might not be absolute. So it’s a preference, likely from liberal autonomy camps.

  The biggest tension is between will-tracking and checkability. If consent must reflect true desires, it’s hard for third parties to verify. If it’s purely ceremonial, autonomy is compromised. The user’s right—there’s a trade-off. Biting the bullet on ceremony loses the essence of autonomy but gains reliability. Hybrid models might offer a balance, but they’re messy.

  For the three models: Attitude-only fails checkability. Performance-only risks becoming ceremonial. Hybrid is better but complex. The user needs to decide if institutions can handle that complexity. The scorecard should highlight these trade-offs succinctly.

  The user’s deeper need is a practical, defensible framework that doesn’t get bogged down in philosophical debates. They want to preempt criticism by addressing key tensions upfront. Emphasizing operational viability and third-party checkability meets their institutional focus. They’re likely aiming for a chapter that’s both rigorous and usable, avoiding academic traps while settling real-world disputes.
answer: |-
  Here’s the spec for an adequate account of valid consent, built around your constraints and cases:

  ### Core Requirements (Non-Negotiable)

  1.  **Avoids Fundamental Invalidators:** Must rule consent invalid in core cases of:
      *   **Material Deception:** (The lie about collateral facts - e.g., "I'm using a condom" when not; lying about identity).
      *   **Coercion via Threats:** (Baseline threats - "Do this or I'll harm you/kill your dog/fire you unjustly").
      *   **Severe Incapacity:** (Drunk 19-year-old to the point of cognitive impairment; advanced dementia patient *now*).
      *   **Complete Ignorance of the Act:** (Signing a form for brain surgery believing it's a consent form for a flu shot).

  2.  **Distinguishes Consent from Non-Consent:** Must provide clear conceptual boundaries for:
      *   **Consent vs. Submission/Resignation:** (Person saying "yes" because every alternative is worse *and feels fundamentally violated*).
      *   **Consent vs. Mere Non-Objection:** (Person asleep on the ship - tacit consent *must* fail here unless demonstrably intended/pre-agreed).

  3.  **Handles Competence Thresholds:** Must define *minimal* thresholds for understanding and decision-making capacity relevant to the act's gravity (e.g., differentiating mild dementia from advanced; intoxication levels).

  4.  **Operationalizability:** Must be **third-party checkable** under institutional constraints (time pressure, incomplete information, partial records, adversarial settings). *This inherently prioritizes observable evidence over pure internal states.*

  5.  **Content-Neutrality Stance (Explicit):** Must explicitly state whether it *requires* limits on what can be consented to (e.g., no consent to grievous bodily harm) or is purely procedural. *Failing to state this is a critical omission.*

  ### Camp Preferences (Requires Stating Affiliation/Consequence)

  6.  **Revocability:** **Preference (Liberal Autonomy Camp).** While highly desirable and often practically necessary for ongoing acts, absolute revocability "up to the last moment" isn't always feasible (e.g., irrevocable consent in certain medical trials after enrollment; sperm/egg donation). Treating it as absolute principle ignores practical and sometimes ethical counterweights (reliance interests, resource allocation). Institutions often build in revocability procedures but with limits.
  7.  **The "Harsh Offer" Problem:** **Preference (Varied Camps).** Is the life-saving surgeon's high fee invalidating? An adequate account *must take a position*, but it's contested:
      *   **Libertarian Camp:** Valid consent if no baseline threat (just an offer the recipient finds necessary).
      *   **Egalitarian/Exploitation-Sensitive Camp:** Potentially invalid if it exploits dire necessity or profound power imbalance, bordering on coercion-by-circumstance. *The spec must force the account to choose and justify.*
  8.  **Inner Attitude vs. Performance Primacy:** **Preference (Hybrid vs. Performance Camps).** While core validity depends on *some* internal capacity (requirement #3), operationalizability (#4) forces a move towards performance. How much weight an account gives to purely internal, unmanifested dissent is a camp divide.
  9.  **Permissibility Gatekeeper vs. Weighty Reason:** **Preference (Deontological vs. Consequentialist/Relational Camps).** Does valid consent *make* the act permissible, or is it just a very strong reason that could be overridden? The spec must force the account to commit.

  ### The Crucial Tension & The Bullet to Bite

  *   **Primary Eliminator:** **Operationalizability/Third-Party Checkability (#4).** This immediately disqualifies pure "attitude-only" accounts and heavily constrains hybrid models. If validity *cannot be reasonably assessed* by a nurse, panel, or judge using available evidence under pressure, the account fails the core institutional test.
  *   **The Irreconcilable Pair:** **Will-Tracking (Deep Autonomy) vs. Checkability (#4).**
      *   **The Argument:** True autonomy demands that consent's validity track the agent's *actual, contemporaneous, informed will*. But this will is a private mental state. Third parties (nurse, panel, judge) only have access to *performances* (words, signatures, context) and *inferences* about capacity. Checkability necessitates relying on these proxies. Relying *solely* on proxies risks "ceremonialism" – where going through the motions (signing the form, saying "yes") is deemed sufficient *even if* the agent internally dissents or misunderstands. This sacrifices the core *autonomy-justifying* function of consent, reducing it to a procedural hurdle. It potentially legitimizes acts the agent never truly willed.
      *   **Biting the Ceremonial Bullet - What's Lost:** You lose the guarantee that the act genuinely reflects the agent's autonomous choice. You gain predictability, administrative feasibility, dispute resolution based on shared evidence, and protection against bad-faith claims of unexpressed dissent. Autonomy becomes defined *by the opportunity* to perform consent/refusal correctly within the system, not by the internal reality. This risks injustice in cases of unexpressed distress, subtle coercion missed by observers, or failures of the ceremony itself (unread forms).

  ### The Scorecard: Three Shapes

  1.  **Attitude-Only (Internal Will):**
      *   **Strengths:** Purest link to autonomy; theoretically invalidates consent in *all* cases of internal dissent/misunderstanding regardless of performance.
      *   **Fatal Flaw:** **Fails operationalizability (#4) utterly.** Third parties *cannot* access or verify inner states reliably. Leads to paralysis or arbitrary decisions in institutional settings. Unworkable for the spec.

  2.  **Performance-Only (Outward Expression):**
      *   **Strengths:** Maximizes checkability (#4). Clear, predictable, efficient for institutions. Focuses on observable acts (signature, verbal "yes" in context).
      *   **Fatal Flaw:** **Risks severe ceremonialism.** Severs validity from actual will. Risks validating consent given under undetected duress, deep misunderstanding, or hidden incapacity ("He signed the form!" while cognitively impaired). Sacrifices core autonomy justification.

  3.  **Hybrid (Performance + Capacity/Intent):**
      *   **Strengths:** Aims for balance. Requires a valid *performance* as the checkable core (#4), *plus* sufficient evidence (or lack of counter-evidence) that the agent possessed the *capacity* and *intention* to consent at the time. Handles core invalidators (#1) better than pure performance.
      *   **Critical Challenge:** **Defining the Threshold & Burden.** How much evidence of capacity/intention is needed? How to discern unexpressed incapacity or coercion under pressure? The devil is in these details. Most plausible for the spec but inherently messy; risk of sliding towards ceremonialism under operational pressure or towards uncheckable attitude demands without clear rules.

  **Your First Section Hook:** Start by highlighting the *institutional dilemma*: Consent must protect individual will *and* be decidable in the messy real world. Every account makes sacrifices. This spec forces those sacrifices into the open. The tension between autonomy's inner sanctum and the courtroom's need for evidence isn't a bug in the literature; it's the core problem any usable theory must confront.
