prompt: |-
  I'm helping to scope a chapter for an edited volume on the ethical upshot of panpsychism, and before anyone argues for a position I want the specification rather than the arguments: what would a theory of the moral significance of micro-experience have to deliver to count as adequate? Give me the requirements list — the questions it must answer, the cases it must handle, the distinctions it may not collapse, and the constraints from the metaphysics it cannot contradict — with the consideration behind each, and mark which are non-negotiable and which are preferences of particular camps (constitutive panpsychism versus cosmopsychism, for instance, or Russellian monism versus a more robust phenomenal realism). Please keep the cases concrete rather than schematic: whether a kilogram of ordinary rock, containing on the order of 10^25 atoms, thereby carries more moral weight than a brain with its tens of billions of neurons; whether boiling a pot of water is a greater harm than killing a mouse; whether a micro-phenomenal property can be valenced at all, given that our experience seems to draw on a far richer palette than anything a single electron could instantiate; and, given that the fundamental entities of field theory are not persistent, individually trackable little subjects, what the bearer of a micro-experience even is and whether it can be harmed. Close with two things: which single requirement knocks out the most candidates, and whether some subset is jointly unsatisfiable — my own suspicion is that requiring moral weight wherever there is experience, requiring that weight to be graded by how much experience there is, and requiring the theory to change what we ought to do cannot all be met at once, and if that is right the list is itself the result. Skip the survey of who has proposed what; I want the criteria.
reasoning: |-
  Okay, the user is helping scope a chapter on the ethical implications of panpsychism. They want a list of requirements for an adequate theory of the moral significance of micro-experiences, without arguments. Let's break down what they need.

  First, they mentioned concrete cases like a kilogram of rock vs. a brain, boiling water vs. killing a mouse, valence in micro-experiences, and bearers of experience. These need to be addressed specifically. The requirements must cover questions to answer, cases to handle, distinctions to maintain, and metaphysical constraints. 

  The user also wants to know which requirements are non-negotiable versus camp-specific. For instance, constitutive panpsychism vs. cosmopsychism might have different takes on aggregation. Russellian monism might influence how valence is attributed. 

  They suspect that moral weight everywhere, graded by amount, and changing our actions might be jointly unsatisfiable. That's a key point to address. The conclusion should highlight the single requirement that disqualifies most theories and whether some requirements conflict.

  I need to categorize the requirements clearly. Non-negotiables are things any theory must address, like the bearer problem or valence. Preferences might include how aggregation works or whether consciousness is fundamental. 

  The cases must be concrete, so examples like the rock vs. brain and boiling water vs. mouse are crucial. Also, explaining why valence might be impossible for an electron due to structural complexity is important. 

  Metaphysical constraints include the nature of bearers in field theory and non-persistence. These can't contradict the metaphysics. 

  The hardest requirement might be the aggregation problem because it challenges how micro-experiences combine. The triad of ubiquitous moral weight, gradation, and practical impact might conflict. If micro-experiences have minuscule weight, aggregating them still might not surpass macro-entities. Or if they have significant weight, everyday actions become problematic. 

  I should ensure each requirement has a rationale. For example, the bearer problem's rationale is that without a subject, harm doesn't apply. Valence is necessary for harm/benefit. 

  Finally, the conclusion should identify the toughest requirement and the potential unsatisfiable triad, validating the user's suspicion.
answer: |-
  Here is a specification for an adequate theory of the moral significance of micro-experience, structured as requested. Non-negotiable requirements are marked **(NN)**. Camp-specific preferences are indicated where applicable.

  ### I. Foundational Questions & Distinctions (Must Answer/Respect)
  1.  **The Bearer Problem (Subjecthood):** What *is* the subject of micro-experience? Given modern physics (fields, quantum indeterminacy, non-persistence), is there a coherent, trackable entity to which experience (and thus potential harm/benefit) can be attributed? **(NN)**  
      *Rationale:* No subject → no locus for moral patiency → no direct moral significance.
      *Consideration:* Must reconcile with physics. Cosmopsychism may answer differently (One Subject) than constitutive panpsychism (myriads of transient subjects).
  2.  **The Valence Problem:** Can micro-experiential properties (*proto*-qualia) genuinely possess intrinsic positive or negative *valence* (like pleasure/pain), or is valence an emergent property only of complex, integrated systems (like brains)? **(NN)**  
      *Rationale:* Without valence, micro-experience lacks the core feature linking consciousness to well-being/welfare (harm/benefit). A neutral experience, however simple, isn't intrinsically morally relevant.
      *Consideration:* Robust phenomenal realists might insist valence *must* be fundamental; others see it as necessarily structural/complex.
  3.  **The Aggregation Problem:** How do micro-experiences combine morally? Is the moral significance of a macro-object (rock, water, brain) simply the *sum* of its parts, an *average*, something *emergent* and distinct, or *nothing*? **(NN)**  
      *Rationale:* Determines the core moral calculus for almost all real-world objects/actions. Failure here makes practical ethics impossible.
      *Consideration:* Constitutive panpsychism *requires* an answer; cosmopsychism might bypass it (only the Whole matters).
  4.  **The Moral Patiency Distinction:** Must rigorously distinguish between *having moral status* (being a patient) and *being morally considerable* (status demanding practical response). A theory must specify *when* and *why* micro-patiency translates into considerability. **(NN)**  
      *Rationale:* Avoids collapsing all existence into equal moral urgency, which is practically absurd and theoretically vacuous. Explains why we *don't* treat rocks like mice.
  5.  **The Non-Identity Problem (Micro):** If subjects are transient (e.g., field excitations), does "harming" them even make sense? Is it harming an existing subject, or merely preventing a different, equally valid subject/experience from arising?  
      *Rationale:* Challenges the very concept of harm at the micro-level if subjects lack persistence/identity.

  ### II. Concrete Cases (Must Handle Plausibly)
  6.  **The Rock vs. The Brain:** A 1kg granite rock (~10²⁵ atoms) vs. a mouse brain (~10¹¹ neurons). Does the rock, by sheer particle count, possess vastly *more* aggregate moral weight than the brain? If not, why not? **(NN)**  
      *Rationale:* Tests aggregation and the significance of complexity/integration vs. sheer quantity. A "yes" seems counterintuitive; a "no" requires explanation.
  7.  **Boiling Water vs. Killing a Mouse:** Is boiling 1 liter of water (disrupting ~10²⁵ micro-subjects) a *greater moral harm* than quickly killing a mouse (disrupting one complex, highly integrated conscious subject)?  
      *Rationale:* Directly challenges the practical implications of micro-significance. A "yes" radically upends common moral intuitions and duties.
  8.  **Dust in the Sunbeam:** Does disturbing a cloud of dust motes illuminated in sunlight (each potentially a micro-subject) constitute a morally significant act? If so, how does this weight compare to stepping on an ant?  
      *Rationale:* Tests the threshold of considerability and aggregation for ubiquitous, low-complexity systems.
  9.  **The Isolated Electron:** Can the postulated experience of a single, utterly isolated fundamental particle (e.g., an electron in deep space) possess any intrinsic moral significance? If so, what kind (positive, negative, neutral)?  
      *Rationale:* Pushes the Valence Problem and Subjecthood Problem to the limit. Tests if *any* experience, however minimal, automatically confers status.

  ### III. Metaphysical Constraints (Cannot Contradict)
  10. **Consistency with Fundamental Physics:** The theory's account of bearers must cohere with our best physical theories (quantum fields, indeterminacy, non-persistence of particles, entanglement). It cannot posit simple, persistent, billiard-ball subjects if physics doesn't. **(NN)**  
      *Rationale:* Panpsychism aims to integrate consciousness with physics; contradicting physics undermines its core motivation.
  11. **Consistency with Panpsychist Metaphysics:** The theory must align with the specific variant assumed (e.g., constitutive vs. cosmopsychism, Russellian Monism vs. strong emergentism about macro-consciousness). It cannot contradict the core metaphysics *of that variant*. **(NN - within the camp)**  
      *Rationale:* Internal coherence is essential. (e.g., A constitutive theory *must* address aggregation; a cosmopsychist theory *must* explain why the Whole is the primary patient).
  12. **The Causal Exclusion Constraint (for Emergent Valence):** If valence is argued to be emergent *only* at macro-levels, the theory must explain how macro-valence arises without causal overdetermination or violating physical causal closure, *while* maintaining that micro-experience is fundamental.  
      *Rationale:* Avoids inconsistency within non-reductive physicalist/Russellian frameworks.

  ### IV. Outcome Constraints (Must Deliver)
  13. **Non-Vacuity:** The theory must imply *some* difference in what we *ought to do* compared to a theory where only complex animal (or higher) consciousness matters. If micro-experience has moral weight, it must, in principle, make *some* action morally better/worse that wouldn't be otherwise. **(NN)**  
      *Rationale:* Otherwise, the ethical "upshot" is merely academic, not practical.
  14. **Tractability (Preference):** Ideally, the theory should offer *some* (even if highly complex/approximate) way to make comparative moral judgments involving micro-experiential systems.  
      *Rationale:* Ethics needs some guidance. Utter intractability weakens practical relevance. (Not strictly NN, as some theories may embrace radical uncertainty).

  ### V. The Crucial Conflict & The Knockout Blow

  *   **The Single Requirement Knocking Out Most Candidates: The Aggregation Problem (NN3).** Most theories founder on explaining how micro-experiences combine morally in a way that doesn't lead to absurd conclusions (like the rock vastly outweighing the brain) *and* remains consistent with their metaphysics *and* delivers non-vacuity. Constitutive panpsychism struggles to avoid micro-domination; cosmopsychism struggles to give micro any significance distinct from the Whole; emergentist valence theories struggle to connect micro to macro morally.
  *   **The Jointly Unsatisfiable Triad (Your Suspicion):** You are likely correct. Consider:
      1.  **Ubiquitous Moral Weight (UMW):** All micro-experience has *some* intrinsic moral weight (however minimal).
      2.  **Graded by Quantity (GQ):** The moral weight of a system is (at least partly) a function of the *number* of micro-subjects/experiences it contains.
      3.  **Practical Action Guidance (PAG):** The theory must imply concrete changes to our moral obligations compared to anthro/zoocentric views.
      *   **Conflict:** UMW + GQ suggests that sufficiently large aggregates of simple micro-subjects (dust clouds, rocks, oceans) possess overwhelming moral weight compared to complex but numerically smaller macro-subjects (mice, humans). This would demand radical shifts in behavior (PAG) – prioritizing avoiding disturbing dust over preventing animal suffering, viewing construction as genocide-scale harm. This is both deeply counterintuitive and practically paralyzing. Avoiding this requires violating one of the triad:
          *   Deny UMW: Only *some* micro-experience has weight (e.g., only if valenced? But Valence Problem kicks in).
          *   Deny GQ: Moral weight isn't primarily about number. It might be about integration, complexity, intensity, or valence quality, making micro-weight negligible *en masse* compared to macro. (Aggregation isn't additive).
          *   Deny PAG: While micro-experience has weight, it's so minuscule per unit or so different in kind that aggregating it never surpasses the moral significance of macro-consciousness in any realistic scenario. Thus, no practical change in obligations (violates Non-Vacuity NN13).

  **Conclusion:** An adequate theory must navigate these treacherous waters: providing a coherent metaphysics of subjects and valence that respects physics, offering a non-absurd solution to aggregation that preserves key moral distinctions (rock vs. brain), and delivering genuine ethical implications without collapsing into paralysis or vacuity. The core challenge is satisfying the non-negotiable Aggregation Problem and Non-Vacuity constraint simultaneously, while respecting the Bearer and Valence constraints, without running afoul of the likely unsatisfiable triad of Ubiquitous Weight, Graded Quantity, and Practical Action Guidance. The list itself exposes the profound difficulty of deriving a workable ethics from panpsychism.
