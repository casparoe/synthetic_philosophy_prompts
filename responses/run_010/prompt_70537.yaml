prompt: |-
  I direct the Technical Review Office of a city of roughly 400,000. Since last spring every capital-project specification and every information-technology procurement above $250,000 passes through my office before it reaches the purchasing agent — about twenty a month. The office was created after a council committee read Langdon Winner's "Do Artifacts Have Politics?" and decided it wanted to know, before concrete is poured, whether a specification is quietly answering a question the council has never voted on. My reviewers are civil engineers, planners, and procurement analysts. None has studied political theory and none will read it. Each screen gets forty-five minutes and one page.

  What we have is an argument, not a procedure. One faction of my staff would flag any specification with distributional consequences, which flags nineteen items in twenty and has earned us a reputation as a nuisance. The other faction would flag only what someone intended to be political, which flags almost nothing, because procurement files rarely record intent and because the consequential cases are usually the unintended ones. I need a procedure whose operative criterion is neither of those: something a reviewer can apply from the documents already in the file plus at most one call to the project manager.

  Please write it, subject to the following requirements.

  - Ordered questions, cheapest and most decisive first, with explicit stopping rules: where the procedure terminates early with a finding of ordinary, and what the default verdict is when the reviewer runs out of time or the file is silent.
  - A fixed classification of at most four labels, including at least the two Winner separates — an arrangement that settles an issue of power within a particular community by foreclosing what would otherwise have remained an open question, and a system whose normal operation appears to require, rather than merely permit, a particular form of organization: centralized, hierarchical, expert-managed. State what to record when both apply, and what distinguishes requiring from merely encouraging.
  - Three house tests, made precise and then stress-tested. The ten-year test: could the council choose otherwise in a decade without tearing the thing out? The silence rule: is the specification quiet about a question the artifact will answer anyway? The forced-choice audit: when a vendor says a requirement is dictated by physics, a building code, a standard, or interoperability, what evidence in the file distinguishes a genuinely forced choice from a preference wearing a constraint's clothing? For each test, give the threshold, what counts as a sufficient answer, and the characteristic misfire.
  - Dispositions rather than verdicts. A flag cannot kill a project; my office classifies and refers. Specify which finding leads to a redesign and alternatives analysis, which to a plain-language disclosure note attached to the procurement, and which to referring the matter upward as an open question of values that the specification is currently deciding on the council's behalf. Mark the steps where a reviewer's own politics will leak in, and say which of those the city attorney — who signs every flag — cannot absorb.
  - An honest accounting of the translation. Which distinctions from the theory you preserved, which you dropped to make it usable, and why dropping them is safe in this setting. Which classes of case the procedure structurally cannot see, including slow cumulative reshaping of a city by something like the automobile, which no single specification carries. And whether Feenberg's idea of a technical code — that a specification encodes the interests and vocabulary of whoever drafted it — belongs in a procedure that will be run by people who later write specifications themselves, or must be excluded as untestable.

  Then run the procedure on three items from my current docket.

  1. A parks specification, drafted after a merchants' petition, requiring a fixed center armrest on all benches in two downtown plazas at a spacing that makes lying down impossible. The file records the petition and states the purpose as deterring overnight occupancy. We already think this one is political; I want to know whether your procedure reaches that result by a route that would still work if the file said nothing about intent.

  2. A water-utility specification for advanced metering with remotely actuated service valves, replacing a disconnection process that currently requires written notice and a court order. Nothing in the file mentions disconnection policy; the stated justification is billing accuracy and leak detection. The meters ride a fifteen-year single-vendor data-platform contract, and the shutoff logic will live in the vendor's system rather than ours.

  3. An adaptive traffic-signal procurement requiring continuous vehicle and pedestrian detection at every intersection in the central corridor under a ten-year single-vendor analytics contract, justified by emissions reductions and by a federal safety grant whose deadline falls in nine weeks. The mayor's office announced it at a press conference last month and my deputy expects the screen to clear it. I would like it to. Tell me plainly whether it does; if it does not, identify which finding does the damage and draft the two-paragraph referral note to a council that has already been told the project is a done deal.

  Where a case turns on a fact my description omits, name the fact, say whom the reviewer would call for it, and give the outcome under both possible answers.
reasoning: |-
  Hmm, this is a fascinating and complex request from a city technical review director. They've built an office based on Langdon Winner's political artifacts concept but need a practical screening procedure that avoids both overflagging everything and underflagging due to intent issues. 

  The user describes their dilemma well - one staff faction flags anything with distributional consequences (catching 95% of cases), while the other only flags demonstrable intent (catching almost nothing). Neither approach works for their operational reality: 45-minute reviews, non-theorist staff, and documents-only evidence with maybe one call to a project manager.

  I need to design something that fits their constraints while honoring Winner's core ideas. The key requirements are:
  - A step-by-step decision tree with early exit ramps
  - Four classification labels covering Winner's two key politics types
  - Three specific tests (10-year, silence, forced-choice) with clear thresholds
  - Disposition guidance rather than binary flags
  - Transparency about what theoretical distinctions get lost
  - Application to three real cases from their docket

  For the theoretical foundation, I'll distill Winner to two actionable criteria: 1) Settling power questions (de facto policy-making through specs) and 2) Requiring specific social organization (not just enabling). The challenge is making this operational for engineers who'll never read the theory.

  The procedure should start with cheap, document-based checks that can clear most cases early. I'm thinking:
  1. First screen for "settled power questions" through the silence test
  2. Then check for "required organization" via the 10-year test
  3. Finally apply forced-choice audit to vendor claims

  For classifications, four labels seem sufficient:
  - Ordinary (no issues)
  - Settled Question (artifact decides policy)
  - Required Organization (demands specific social structure)
  - Combined (both)

  The dispositions matter - some cases just need disclosure notes, others require redesign or council referral. I must identify where reviewer bias might creep in, especially since their staff later draft specs themselves.

  For the test cases:
  - The bench armrests clearly satisfy the silence test (deterring homeless without policy debate)
  - The smart meters are tricky - vendor-controlled shutoffs might constitute both settled policy and required organization
  - The traffic signals likely pass unless the vendor lock-in creates irreversible organization

  The translation sacrifices some nuance - like Feenberg's technical codes or slow cumulative effects - but that's necessary for usability. The procedure won't catch everything, but should flag the most consequential decisions being made through technical specs.

  I'll draft the full procedure with clear thresholds, then apply it rigorously to each test case. For the traffic signals, if it flags, I'll prepare the uncomfortable council referral as requested - even if it contradicts the mayor's announcement.
answer: |-
  Here is a procedure designed for your Technical Review Office, translating Winner's concepts into an operational screening tool meeting your requirements. It prioritizes document review, minimizes subjectivity where possible, and provides clear dispositions.

  **Operational Procedure: Artifact Politics Screen (APS)**

  **Classification Labels (4):**
  1.  **ORDINARY:** No significant Winner-type politics detected.
  2.  **SETTLED QUESTION (SQ):** The specification *settles an open question of power/distribution/values* within a community by foreclosing alternatives (Winner's 1st type). *Disposition: Refer for redesign/alternatives analysis OR attach plain-language disclosure note.*
  3.  **REQUIRED ORGANIZATION (RO):** The artifact/system *requires* (not just permits) a specific social form (centralized, hierarchical, expert-managed) for its *normal operation* (Winner's 2nd type). *Disposition: Attach plain-language disclosure note.*
  4.  **COMBINED (SQ+RO):** Both SQ and RO apply. *Disposition: Refer upward as an open values question the spec decides.*
      *   **Requiring vs. Encouraging:** An artifact *requires* a form if its core function fails without it (e.g., centralized control room essential for grid stability). It merely *encourages* if the form improves efficiency or is preferred but alternatives exist for core function (e.g., hierarchical management might be encouraged for efficiency, but distributed teams could technically operate the system).

  **Ordered Questions & Stopping Rules:** (45 mins max, 1 page output)
  1.  **SILENCE TEST:** Does the specification *explicitly state* the answer to a question concerning **power, distribution of burdens/benefits, access, or fundamental rights** within the community it serves? (e.g., "Who can sit/rest here?", "Who controls access/disconnection?", "Whose movement is prioritized?")
      *   **YES:** Proceed to Question 2.
      *   **NO:** This is a potential SQ flag. Proceed to Question 2.
      *   **UNCLEAR/File Silent:** Default to "NO" for this test. Proceed to Question 2.
      *   **Threshold:** Specification text is silent on the *political/distributional question* the artifact inherently answers. **Sufficient Answer:** Clear absence of text addressing the identified political question in the spec/purpose statement. **Misfire:** Mistaking operational detail (e.g., "max load 500kg") for a political statement, or overlooking implicit answers in design (e.g., "armrest spacing 24 inches" implicitly answers "Can an adult lie down?").
  2.  **TEN-YEAR TEST:** Could the Council reasonably **choose a different answer** to the question identified in Step 1 (or discovered in Step 1's 'NO' path) **within 10 years** without incurring prohibitive costs (i.e., without tearing out/replacing the core artifact)?
      *   **YES (Flexible):** Proceed to Question 3.
      *   **NO (Locked-In):** Strong indicator of SQ. Proceed to Question 3.
      *   **UNCLEAR/File Silent:** Call Project Manager (PM): *"Is there a technical or contractual reason preventing Council from altering the core function/outcome related to [identified question] within 10 years without major rebuild?"* If PM confirms lock-in or ambiguity remains, treat as "NO". Proceed to Question 3.
      *   **Threshold:** Significant physical/technical/contractual lock-in preventing policy change affecting the artifact's core political function for ~10 years. **Sufficient Answer:** Long-term vendor lock-in, proprietary tech, embedded infrastructure making change cost-prohibitive. **Misfire:** Confusing software updates (often feasible) with core hardware/architecture changes (often locked-in).
  3.  **FORCED-CHOICE AUDIT:** For any requirement justified as dictated by **physics, code, standard, or interoperability**, does the file contain **conclusive evidence** this is genuinely forced (e.g., specific code citation w/ section, verifiable interoperability matrix) *and not* a vendor preference, proprietary constraint, or outdated practice?
      *   **YES (Genuinely Forced):** Requirement itself likely not SQ/RO. Proceed to classify based on Steps 1 & 2.
      *   **NO (Preference/Ambiguous):** Requirement *could* be a vehicle for RO or SQ (if it locks in organization/policy). Flag for closer scrutiny *within the context of Steps 1 & 2 findings*. Proceed to Classification.
      *   **File Silent/Claims Unverified:** Call PM: *"Can you provide the specific code section/standard/interoperability requirement forcing [specific contested requirement]? If not, what is the basis?"* If PM cannot provide verifiable evidence, treat as "NO". Proceed to Classification.
      *   **Threshold:** Lack of verifiable, objective evidence in the file supporting a "forced choice" claim for requirements impacting SQ/RO potential. **Sufficient Answer:** Specific, cited, verifiable external constraint. **Misfire:** Accepting vendor assertions without evidence; mistaking common practice for actual requirement.

  **Classification & Disposition:**
  *   **If Step 1: NO (Silent) AND Step 2: NO (Locked-In):** → **SQ** (Settled Question). *Disposition: Refer for redesign/alternatives analysis.* (The spec silently locks in policy.)
  *   **If Step 1: NO (Silent) AND Step 2: YES (Flexible):** → **ORDINARY** (Default Verdict). *Disposition: Clear.* (Silent but changeable; council retains future choice.)
  *   **If Step 1: YES (Stated):** → Generally **ORDINARY**. *Disposition: Clear.* (Council's intent is explicit in the spec, no foreclosure.) *Exception:* If combined with strong RO *and* lock-in (Step 2: NO), consider **SQ+RO** referral if the explicit statement masks deeper organizational lock-in overriding future council choice.
  *   **REQUIRED ORGANIZATION (RO):** Apply after SQ determination or if SQ doesn't apply. Does the artifact's *normal operation* demonstrably **require** (not just encourage) centralized/hierarchical/expert management? (See definition above).
      *   **YES:** → **RO** if SQ absent, **SQ+RO** if SQ present. *Disposition for RO:* Attach disclosure note. *Disposition for SQ+RO:* Refer upward.
      *   **NO:** → Classification remains SQ or ORDINARY.
  *   **Default Verdict:** If time runs out or file/PM call is inconclusive on a critical step preventing classification, assign **ORDINARY** and note the ambiguity in the reviewer's 1-page summary for the City Attorney's awareness.

  **Where Politics Leak In & Attorney Absorption:**
  1.  **Identifying the "Open Question" (Step 1):** The reviewer must interpret *what political/distributional question* the artifact answers silently. This involves judgement about what constitutes a legitimate "question of power/values." *City Attorney CAN absorb this* if the reviewer documents the specific question identified (e.g., "Who can comfortably rest on this bench?").
  2.  **Interpreting "Requires" vs. "Encourages" (RO):** Distinguishing essential operational necessity from preference/efficiency. This is subjective. *City Attorney CANNOT absorb this solely* – the reviewer must provide a concrete rationale based on system function (e.g., "Remote valve control *requires* centralized SCADA system; manual alternatives exist but disrupt core 'normal operation' of rapid leak response").
  3.  **Assessing "Prohibitive Cost" (10-Year Test):** Defining "prohibitive" is value-laden. The procedure mitigates this by using the 10-year horizon and requiring PM input on technical feasibility/cost. *City Attorney CAN absorb this* if the reviewer documents the PM's input or the technical basis for lock-in.

  **Honest Accounting of Translation:**
  *   **Preserved:**
      *   Winner's core distinction between *settling political questions* (SQ) and *requiring social forms* (RO).
      *   Focus on *consequences* (foreclosure, lock-in, requirement) over *intent*.
      *   The critical role of *irreversibility/lock-in* (10-Year Test).
  *   **Dropped & Why Safe:**
      *   **"Inherently Political" Technologies:** Winner suggests some tech is inherently political. We drop this; the procedure focuses on *specific deployments/specs*. *Safe because:* We evaluate concrete projects, not abstract tech. The tests catch lock-in and foreclosure in *this* instance.
      *   **Grand Historical Narratives (e.g., Automobiles):** The procedure cannot see slow cumulative effects across many projects. *Safe because:* Your mandate is *pre-pour* review of *specific* procurements. Cumulative impact requires separate strategic planning/policy tools.
      *   **Fine-Grained Analysis of "Power":** We use broad categories (distribution, access, rights). *Safe because:* The 45-min limit demands pragmatism. Flags trigger deeper review where needed. SQ/RO labels adequately signal significant political stakes.
      *   **Feenberg's "Technical Code":** Excluded. *Why:* It's untestable within 45 mins/doc review. Proving "encoded interests/vocabulary" requires deep hermeneutics. Including it invites unproductive subjectivity and accusations of bias, especially as reviewers draft specs later. Focusing on *consequences* (foreclosure, lock-in, requirement) is more objective and actionable for procurement review. *Risk:* Might miss subtle biases, but SQ/RO flags should catch the most consequential encodings.
  *   **Blind Spots:**
      *   Cumulative effects of many "ORDINARY" specs.
      *   Political effects arising purely *after* deployment through user adaptation.
      *   Biases deeply embedded in standards/codes referenced by the spec (though Forced-Choice Audit helps surface reliance on them).
      *   Cases where the "silent" question is genuinely non-obvious *and* lacks lock-in (slips through as ORDINARY).

  **Application to Docket Items:**

  1.  **Downtown Benches (Armrests):**
      *   **Step 1 (Silence Test):** Spec states purpose: "deter overnight occupancy." *Does it state the political question?* The question is "Who can rest/sleep here?" Spec *explicitly* answers "not sleepers." → **YES** (Stated). *Proceed to Step 2.*
      *   **Step 2 (10-Year):** Could Council change policy (allow sleeping) in 10 years without ripping out benches? Easily - remove/replace armrests. → **YES** (Flexible). *Proceed to Step 3.*
      *   **Step 3 (Forced Choice):** N/A to core political feature (armrest spacing). No forced-choice claims relevant to SQ.
      *   **Classification:** Step 1=YES → **ORDINARY** (Intent is explicit in spec, no foreclosure). *Disposition: Clear.*
      *   **If File Silent:** Assume spec just lists armrest dimensions/presence without stating purpose.
          *   **Step 1 (Silence Test):** Is the question "Who can rest/sleep here?" answered? Armrest spacing makes lying down impossible → *implicitly* answers "not sleepers." → **NO** (Silent on the question, but answers it via design). *Proceed to Step 2.*
          *   **Step 2 (10-Year):** As above → **YES** (Flexible). *Proceed to Step 3.*
          *   **Classification:** Step 1=NO + Step 2=YES → **ORDINARY**. *Disposition: Clear.* (While political, it's not *locked in*; council can easily change benches later if policy changes).
      *   **Result:** Procedure clears benches as ORDINARY regardless of stated intent, because change is easy. It captures the politics via Step 1 but disposition is clear due to flexibility.

  2.  **Water AMI with Remote Shutoff:**
      *   **Step 1 (Silence Test):** Justification: "billing accuracy, leak detection." *Does it state the disconnection policy question?* ("Who controls disconnection? Under what process?") → **NO** (Silent). *Proceed to Step 2.*
      *   **Step 2 (10-Year Test):** Could Council change disconnection policy (e.g., reinstate court order) in 10 years without ripping out meters? **Fact Needed:** Is the shutoff logic *only* controllable via the vendor's system, and does the contract prevent city control or policy changes? **Call PM:** *"Can the city independently control the shutoff logic/rules within the vendor's platform, or dictate them without vendor modification? Does the 15-year contract allow for policy-driven changes to shutoff rules without penalty?"*
          *   *PM Answer YES (City Control):* → **YES** (Flexible). Proceed to Step 3. Classification: Step1=NO + Step2=YES → **ORDINARY**.
          *   *PM Answer NO (Vendor Lock):* → **NO** (Locked-In). Proceed to Step 3. Strong SQ indicator.
      *   **Step 3 (Forced Choice):** Is remote shutoff *required* for billing/leaks? Likely not – AMI enables remote *reading*, shutoff is separate. File silent on why shutoff is included. → **NO** (Preference/Ambiguous). *This reinforces potential SQ/RO.*
      *   **RO Check:** Does *normal operation* (billing, leak detection) *require* a centralized, vendor-controlled system? Billing/leak detection *could* function with local processing/data dumps. Centralization is efficient, but not strictly *required*. Remote shutoff *could* require centralized command, but alternatives exist (manual). → Likely **NOT RO** (Encourages, not Requires).
      *   **Classification & Disposition (if Lock-In Confirmed):** Step1=NO + Step2=NO → **SQ** (Settled Question: Disconnection policy locked in by vendor system/contract). *Disposition: Refer for redesign/alternatives analysis.* (e.g., demand city control of shutoff logic, explore shorter contract terms, require interoperability standards).

  3.  **Adaptive Traffic Signals (Central Corridor):**
      *   **Step 1 (Silence Test):** Justification: "emissions, safety, grant deadline." *Does it state political questions?* Questions like "Whose movement is prioritized (cars vs peds vs bikes)?", "Is real-time surveillance of movement acceptable?" → **NO** (Silent). *Proceed to Step 2.*
      *   **Step 2 (10-Year Test):** Could Council change priorities (e.g., prioritize pedestrians, restrict data collection) in 10 years without ripping out the system? **Fact Needed:** Is the analytics/control logic proprietary and locked within the single-vendor platform for 10 years? Does the system *require* constant surveillance to function? **Call PM:** *"Can the city change the core optimization algorithms (e.g., prioritize peds over cars) within the vendor platform without vendor modification/cost? Can the system function effectively with less granular/more anonymous data collection if policy changes?"*
          *   *PM Answer YES (City Control/Configurable):* → **YES** (Flexible). Proceed to Step 3. Classification: Step1=NO + Step2=YES → **ORDINARY**.
          *   *PM Answer NO (Vendor Lock/Requires Surveillance):* → **NO** (Locked-In). Proceed to Step 3. Strong SQ indicator.
      *   **Step 3 (Forced Choice):** Is continuous detection *required* for emissions/safety? Vendor likely claims yes. **File Evidence?** Grant requires specific outcomes (safety), likely not specific *methods*. Physics/code might require detection *at* intersections, but not necessarily *continuous, granular* detection feeding a central vendor AI. → Likely **NO** (Preference/Ambiguous - vendor solution chosen). *Reinforces potential SQ.*
      *   **RO Check:** Does *normal operation* (adaptive control) *require* a centralized, vendor-managed analytics system? Decentralized, edge-computing solutions exist. Centralized AI might be "better," but not strictly *required* for basic adaptive function. → Likely **NOT RO** (Encourages, not Requires).
      *   **Classification & Disposition (if Lock-In Confirmed):** Step1=NO + Step2=NO → **SQ** (Settled Question: Traffic prioritization strategy and surveillance levels locked in for 10 years by vendor contract/system). **It does NOT clear.**
          *   **Damaging Finding:** Step 2 (10-Year Test): Lock-in of policy choices (prioritization, data collection) via proprietary vendor system under long-term contract.
          *   **Referral Note Draft:**
              > **Subject: Urgent Flag - Adaptive Signal Procurement (Central Corridor) - Settled Political Question (SQ)**
              > The Technical Review Office flags this procurement under the Artifact Politics Screen. The specification for continuous vehicle/pedestrian detection and vendor-managed adaptive control, while justified by safety and emissions, **silently settles political questions** concerning traffic prioritization strategies and public space surveillance levels within the central corridor. Crucially, the 10-year single-vendor contract **locks in** the specific approach chosen by this specification. This means Council's future ability to democratically set different priorities (e.g., favoring pedestrians/cyclists) or adjust surveillance policies is likely foreclosed without incurring prohibitive termination or reconfiguration costs during the contract term.
              >
              > **Disposition:** This finding of "Settled Question" (SQ) triggers referral for redesign/alternatives analysis. We recommend exploring options that preserve Council's future policy flexibility, such as shorter contract terms, city-owned or open-source control algorithms, interoperability standards enabling vendor switching, or configurable optimization parameters that can be adjusted by the city to reflect evolving policy goals without vendor dependency. The current procurement, as specified, effectively makes a long-term political choice on Council's behalf through technical and contractual means.

  This procedure provides a structured, document-first approach focusing on lock-in and silenced political questions, aligning with Winner's core concerns while fitting your operational constraints. It prioritizes catching irreversible, silent policy decisions (SQ) and highlights significant organizational dependencies (RO), providing clear paths for remediation or disclosure.
