prompt: |-
  I'm on the science panel of a private conservation foundation. Our charter lets us grant only for "species on the brink," and in eleven years we've never once defined species — we just followed whatever the taxonomists happened to say. Now there's a petition about a population of tree frogs confined to a single valley, maybe four thousand adults and shrinking. On one mitochondrial marker it's a deeply diverged, clean lineage; in the field you can't tell it from its relative three valleys over; and where the two ranges touch in a wet year, they hybridize freely and the offspring breed. Our staff biologist says that settles it, it fails the biological species concept and we should pass. One board member says the whole point of the charter is evolutionary distinctiveness and this frog is about as distinct as it gets, so refusing is a betrayal of our own mission. A third points out we funded a subspecies last year without blinking. We vote Friday and I have to circulate something by Wednesday. Draft the memo: a clear recommendation on whether we fund, plus a workable rule the panel could apply to the next ten petitions like this one, and a real engagement with the distinctiveness argument rather than just noting that our charter is vague.
reasoning: |-
  Okay, let me break this down. The user is on a science panel for a conservation foundation facing a tricky taxonomic dilemma about funding tree frogs. They need a memo by Wednesday that makes a clear recommendation, establishes a rule for future cases, and properly addresses the evolutionary distinctiveness argument. 

  First, I consider the core tension here: the charter focuses on "species on the brink" but they've never defined species. Now they're stuck between technical taxonomy (where the frogs may not qualify as a full species) and conservation ethics (where the lineage is irreplaceable). The staff biologist says no based on hybridization, a board member says yes based on distinctiveness, and last year's subspecies funding sets a precedent. 

  Hmm... the real challenge is balancing scientific rigor with conservation pragmatism. The user needs to convince both sides - the strict taxonomists and the distinctiveness advocates. I think the solution lies in reframing "species" for conservation purposes rather than taxonomic ones. 

  For the recommendation, I'm leaning toward funding with conditions. The mitochondrial divergence shows this lineage has been isolated for a long time, even if current hybridization happens. That makes it evolutionarily unique. But to satisfy scientific concerns, we should require genomic analysis to confirm the divergence isn't just mitochondrial. 

  For the rule, I propose a "Conservation Unit" approach - either Evolutionarily Significant Units (ESUs) for deep divergence or Management Units (MUs) for demographic independence. This creates clear criteria: genetic distinctness plus threat level. It also explains last year's subspecies funding as falling under MU criteria. 

  The distinctiveness argument needs special handling. I should emphasize that mitochondrial lineage represents thousands of years of unique evolution that can't be recovered if lost, even if nuclear genes now flow between populations. That makes it irreplaceable in a way that aligns with the charter's spirit. 

  I wonder if the user fears being seen as unscientific by overriding the staff biologist. The memo should position this not as ignoring taxonomy, but as applying conservation biology's own frameworks like ESUs that taxonomists respect. 

  For structure: executive summary first, then detailed analysis separating the science from policy, then the new rule with decision tree. The tone must be decisive but diplomatic - this is about finding common ground. 

  ...better include concrete action items too: genomic study requirement, IUCN criteria application, and explicit mention that this doesn't override taxonomy generally, just interprets the charter's intent for conservation triage.
answer: |-
  ## Memorandum: Recommendation on Frog Conservation Funding & Policy Clarification  
  **To:** Science Panel, Conservation Foundation  
  **From:** [Your Name], Science Panel Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Valley Tree Frog Petition & Policy Framework for "Species on the Brink"  

  **1. Recommendation:**  
  **Fund the conservation initiative for the valley tree frog population.** While it does not unambiguously meet the strict Biological Species Concept (BSC) due to hybridization, it represents an **Evolutionarily Significant Unit (ESU)** with unique adaptive potential and irreplaceable genetic heritage. This aligns with the *spirit* of our charter to preserve "species on the brink" by protecting unique lineages facing imminent loss. Funding should be contingent on initiating a genomic study within Year 1 to definitively characterize nuclear divergence and hybrid zone dynamics.  

  **2. Proposed Rule: The "Conservation Unit" Threshold**  
  To resolve ambiguity and ensure consistent, mission-aligned decisions for future petitions, I propose we adopt the following framework, evaluating populations against **both** criteria below:  

  *   **Criterion A: Evolutionary Distinctiveness (ESU Test)**  
      *   The population must demonstrate **significant genetic divergence** (e.g., deep mitochondrial split *plus* evidence of nuclear divergence, unique adaptations, or long-term isolation) indicating it represents a unique evolutionary trajectory.  
      *   *Threshold:* Divergence must be substantial enough that the loss of the unit would represent a **significant reduction in the species' evolutionary legacy and adaptive potential.**  

  *   **Criterion B: Demographic Independence & Threat (MU Test)**  
      *   The population must be **demographically isolated and vulnerable** (e.g., geographically restricted, small population size, declining trend, facing specific threats).  
      *   *Threshold:* The unit must function as a **Management Unit (MU)** – its loss would not be rapidly compensated by immigration, making its conservation critical for overall species/metapopulation persistence.  

  **Decision Rule:** Fund conservation if a petition demonstrates **BOTH** Criteria A *and* B are met.  

  **3. Engagement with the Distinctiveness Argument:**  
  The board member advocating for funding based on distinctiveness raises a crucial point central to our mission's *intent*. Our charter's goal is not merely to prevent taxonomic extinctions, but to **preserve irreplaceable evolutionary heritage and adaptive diversity.**  

  *   **Depth of Mitochondrial Divergence:** The deep mitochondrial split signifies this lineage has been evolving independently for a substantial period (potentially millennia). This represents a unique branch on the tree of life. Its loss would erase genetic variants and evolutionary history that cannot be recreated.  
  *   **Beyond Hybridization:** While hybridization with the neighboring population occurs under specific conditions, this does not negate the lineage's distinct history or unique value. Many recognized species hybridize (e.g., wolves/coyotes, numerous plants). The *potential* for gene flow does not erase millennia of independent evolution captured in its genome, especially the deeply divergent mitochondrial lineage.  
  *   **Irreplaceability vs. Taxonomic Label:** Refusing to fund based solely on BSC non-compliance prioritizes a taxonomic *label* over the *biological reality* of unique diversity. Our mission compels us to protect significant evolutionary units facing extinction, regardless of whether taxonomists have formally split them yet. This frog lineage is as "on the brink" of losing unique evolutionary history as any formally described species.  
  *   **Subspecies Precedent:** Last year's subspecies funding was consistent with this principle – subspecies are often proxies for ESUs/MUs. Our new rule formalizes this logic, focusing on the *biological attributes* (distinctiveness + vulnerability) rather than the shifting sands of taxonomic rank.  

  **4. Applying the Rule to This Case:**  
  *   **Criterion A (ESU): MET.** The deep mitochondrial divergence provides strong evidence of long-term isolation and a unique evolutionary history. This constitutes significant evolutionary distinctiveness. (Genomic study will strengthen this).  
  *   **Criterion B (MU): MET.** Confined to one valley, only ~4000 declining adults, geographically isolated from the main population (hybridization only episodic). Its loss would be permanent and uncompensated.  
  *   **Conclusion:** Both criteria are satisfied. This lineage is an irreplaceable component of the species' evolutionary potential and is demonstrably on the brink.  

  **5. Addressing the Staff Biologist's BSC Argument:**  
  The BSC is valuable but has limitations for conservation:  
  *   It focuses on *current* reproductive isolation, potentially overlooking historically isolated lineages with unique adaptations/genetics.  
  *   Hybridization is a natural process; its occurrence at a contact zone doesn't mean the lineages are functionally identical across their entire genomes or that they haven't diverged in ways crucial for long-term adaptation.  
  *   Conservation biology recognizes ESUs/MUs precisely to protect significant biodiversity *below* the species level when facing extinction. Our charter's purpose aligns with this conservation biology principle, not purely with taxonomic definitions.  

  **6. Action Items for Vote:**  
  1.  **Approve** funding for the valley tree frog conservation initiative.  
  2.  **Adopt** the "Conservation Unit" Threshold (Criteria A & B) as our formal definition for evaluating "species on the brink" henceforth.  
  3.  **Require** a genomic assessment as part of this grant to fully characterize divergence and inform future management.  

  This approach provides a scientifically rigorous, mission-driven, and consistent framework. It honors the charter's intent to protect unique evolutionary heritage on the brink of extinction, resolves the ambiguity highlighted by the subspecies precedent, and directly addresses the core value of evolutionary distinctiveness.  

  **Respectfully submitted for the Panel's consideration.**
