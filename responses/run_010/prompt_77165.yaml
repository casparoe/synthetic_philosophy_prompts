prompt: |-
  Longtime lurker, no ML background beyond reading, and I keep needing a word for a thing I don't have.

  You try to work out what someone wants by watching what they do. But once they catch on that you're watching *in order to* work it out, their behavior stops being a clean readout of what they want. They start picking actions partly for what those actions will make you conclude. They're not lying — they haven't changed their mind about anything, and often they'd rather you got it right. The measurement channel has quietly turned into a communication channel.

  Two cases I keep running into. One: a robot learns a task from demonstrations, and the human demonstrator does something deliberately clumsy or roundabout so the robot won't infer the wrong goal — the demo is now adressed to the learner rather than to the task. Two: people filling out a form knowing a model will score it, who shade their answers toward what a scorer would like, which then makes the trained model worse in a way nobody intended.

  Nearest things I know are Goodhart's law, which I don't think fits, since nothing here is being optimized against a target except the inference itself, and the old "people work harder when watched" effect, which is about effort rather than about what the behavior means. Is there an established term for this — in ML, in game theory, or in whatever social scientists call the problem of measurement changing what it measures — and how does what I described differ from each candidate that comes close? And if nothing quite fits, coin one and give me the edges: does it still apply when the person is unaware they're doing it, or when the watcher is another human instead of a machine?

  I'm not after a bare label, I want the carving. Bottom line in your first sentence, then the reasoning. No preamble, no restating my question.
reasoning: |-
  Okay, the user is asking for a term that describes a situation where observing someone to infer their preferences or goals causes the person being observed to alter their behavior, thereby contaminating the data. They mentioned examples like a robot learning from demonstrations where the human acts deliberately to guide the inference, and people filling out forms knowing a model will score them, leading to biased answers.

  First, I need to recall relevant concepts. Goodhart's Law comes to mind, but the user already mentioned it doesn't fit because it's about metrics being gamed when optimized. The Hawthorne effect is about increased effort under observation, not strategic signaling. 

  Then there's observer effect or measurement disturbance, which is broader but usually from physics. The user wants something specific to behavioral contexts. Strategic misrepresentation sounds close, especially in economics, where people alter behavior due to being observed. 

  Signaling in game theory is another angle. In the robot example, the demonstrator is signaling information through altered actions. That's intentional communication. But in the form example, it might be unconscious adaptation. So the term needs to cover both intentional and unintentional shifts.

  The key is the transition from observation to communication channel. The user needs a term that encapsulates this shift. Existing terms might not perfectly fit. Reactive signaling could be coined, but it's not established. 

  Social desirability bias is relevant for the form scenario, where respondents answer to appear favorable. But it doesn't cover the robot case. Campbell's Law is about metrics becoming corrupt when used for decision-making, which aligns with the form example but might not fit the robot demo. 

  The user wants a precise term and its boundaries. They also want to know if it applies when the person is unaware or when the observer is human. Strategic misrepresentation covers intent, but social desirability includes unconscious aspects. Signaling is broader in game theory. 

  Considering the examples, the common thread is the observer's inference method becoming known, causing behavioral adjustment. Whether conscious or not, the channel shifts. But established terms might not cover both cases. The closest might be signaling with the observer effect, but the user might need to combine terms. 

  In conclusion, "signaling" in behavioral contexts is the best fit for intentional cases, and "observer effect" or "reactivity" for broader instances. The user should understand the nuances between conscious strategy and unconscious bias. Highlighting the transition from measurement to communication is crucial, even if no single term exists.
answer: |-
  The closest established concept is **signaling** (in behavioral contexts), particularly when intentional, but the boundaries matter. Here's the carving:

  **Core concept:** The phenomenon is **observer-induced signaling**, where observation for inference shifts behavior into a communication act, corrupting the measurement.  
  - **Intentional & Strategic (Robot Demo):** Pure **signaling** (game theory). The demonstrator *deliberately* encodes information ("not the goal") into actions, making the demonstration a message.  
  - **Unintentional/Heuristic (Form Filling):** **Social desirability bias** or **reactivity**. The respondent *unconsciously* adapts to perceived scorer expectations, distorting truthful answers without conscious deception.  

  **Key Distinctions from Near Misses:**  
  1. **Goodhart's Law:** Targets *metrics* gamed during *optimization*. Your case involves *inference* corrupting *input data*, not optimizing against a proxy.  
  2. **Hawthorne Effect:** About *effort/productivity* changes under observation. Your case is about *semantic content* of actions being altered to influence *interpretation*.  
  3. **Observer Effect (Physics):** Broad "measurement disturbs the system." Your focus is specifically on *strategic or heuristic communication responses* to being modeled.  
  4. **Campbell's Law:** Corruption of *social metrics* used for decision-making. Aligns with the form example but less so with robot demos (non-metric goals).  

  **Edges & Scope:**  
  - **Unaware Actors:** Applies (e.g., heuristic form-filling). Falls under **reactivity** or **implicit signaling**.  
  - **Human Watchers:** Applies identically (e.g., a therapist inferring motives, client alters behavior). Core mechanism is domain-agnostic.  
  - **Machine vs. Human Watcher:** No fundamental difference; the shift depends on the *actor's belief* they're being modeled, not the watcher's nature.  

  **Why no perfect single term?**  
  The shift from passive measurement to active communication channel bridges signaling theory (intent) and measurement reactivity (bias). Use:  
  - **"Signaling"** when intent is clear (robot demo).  
  - **"Reactivity"** or **"observer-induced bias"** for unconscious/unintended cases (form filling).  
  - **"Inference-driven behavioral distortion"** as a precise umbrella phrase when specificity is critical.  

  **Bottom line:** The core is the **corruption of inferential input via observer-induced signaling or reactivity**, distinct from metric gaming or effort effects.
