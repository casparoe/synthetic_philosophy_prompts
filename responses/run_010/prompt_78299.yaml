  First, the core claims: Tiberius Gracchus breaking norms as turning point, Marius' military reforms enabling warlords, and the "norms over institutions" thesis. My ancient history knowledge flags several layers here. The mos maiorum vs. written constitution framing holds up reasonably - Roman scholars like Harriet Flower do emphasize customary constraints. Gracchus' actions being shocking? Also solid; Cicero's letters confirm contemporaries viewed tribunate violations as seismic. 

  But the simplification alarms start ringing. Painting Gracchus as first norm-breaker ignores earlier cracks like the Senatus Consultum Ultimum against Gaius Flaminius in 121 BC. And the military clientism argument? Only half-true: while Marius professionalized armies, patronage systems existed since mid-Republic. The real flaw is the monocausal narrative - specialists like Mary Beard stress economic inequality and slave-labor displacement as equally critical drivers alongside norms erosion. 

