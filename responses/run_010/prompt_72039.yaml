  I'm writing a short piece on Plato and alcohol for a general-audience philosophy magazine and I've hit a wall. The puritan line is easy enough: in the Republic he insists the guardians never get drunk, because wine wrecks the rational control that the whole city depends on. But then the Laws has him setting up supervised drinking parties, appointing an official to run them, and arguing that wine is actually a good way of finding out what a citizen is made of. So what do I tell my editor -- did he just go soft in old age, or is one of these two books not really saying what I think its saying? And if he did reverse himself, which one do I present as his settled view on drink? Please say how confident you are in the answer you land on, and single out the one claim in it you're least sure about.
