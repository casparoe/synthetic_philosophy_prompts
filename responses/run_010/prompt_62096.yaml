  Then the deflationist view: They see the theorem as confined to formal models. Real agents lack common priors—Morris's point about priors being arbitrary modeling choices undermines any real-world application. Also, state spaces are subjective, so what looks like disagreement might be about different propositions. Polarization in real conversations contradicts the convergence result, proving the model's irrelevance. Their key premise is that rationality is context-dependent; Bayesianism is just one tool among many.

