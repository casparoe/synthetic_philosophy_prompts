prompt: |-
  I run corporate development at a company that grows mostly by buying things — call it six or seven contested processes a year, anywhere from $20M to $400M, usually run by a bank against a hard timetable. We also make a handful of big internal platform bets that come back every year for a continue/kill review. My problem is the same in both places and I finally found the name for it: escalation of committment.

  I went down a rabbit hole on Shubik's dollar auction and two things stuck. One, the second-highest bidder loses their bid too, so the person currently trailing is the one with the strongest reason to raise, and it's the trailing bidder who drives the price past anything the prize is worth. Two, once you're in there isn't a point where raising is obviously the wrong move — the disaster gets locked in by the decision to enter, not by the decision to stay. Our processes aren't literally that game, but I think a lot of them are secretly that game, because we pay our bankers, our diligence vendors, and three months of senior management attention whether we win or not, and nobody ever totals it up. Last year our two losses cost more in process spend than the incremental value of the deal we actually won, and I only know that because I dug it out of four different cost centers myself.

  What I want from you: a decision procedure my deal teams can run — the questions in order, what counts as a sufficient answer to each, the points where it flatly says walk, and the points where it hands the call to a person because the question is about values and not about facts. Constraints: it has to live on one page as a worksheet, it gets run inside a 90-minute deal committee by people who never took game theory, and — the hard part — it gets run by the same people who want the deal. So any step that depends on the team being candid about their own attachment is a step that will fail. Build in whatever structural workarounds you think are needed: who sets the walk-away number, when it has to be set, who physically holds it, whether it can be revised and by whom, and what has to be true for a revision to count as legitimate rather than as a rationalization. Also assume our bank only gets paid if we close, so treat anything they report about the other bidder as a claim that needs an independent source.

  Things I specifically want in there:

  - a test for whether a given process is really all-pay — we bleed whether we win or lose — versus a normal auction where only the winner pays, and what to do differently in each, because I don't think my team can tell them apart today;
  - a test on the recoverability of what we've already spent, meaning whether continuing is the only route to getting value out of it, since I think thats the actual line between a dollar-auction situation and an ordinary investment where sunk costs really are irrelevant;
  - a question that keys off whether we are currently the high bidder or the trailing bidder, because those two positions look to me like opposite risk profiles and we treat them identically;
  - the two sentences you'd want a smart associate to walk away remembering about why the lesson is about entry and not exit, and then what to do anyway once we're already in, which we always will be.

  Then run the procedure on three cases. Case one: live process, we're second at $310M, our written kickoff ceiling was $285M, the team re-ran the synergy model last week and now says $315M still clears our hurdle, and our bankers assure us the other bidder is emotional. Case two: internal platform, three years in, $40M spent, needs $15M more over eighteen months; the team says the remaining value is positive and doesn't depend on the $40M either way, and one board member keeps saying sunk cost, sunk cost — I suspect he's wrong but I can't explain why without sounding like I'm splitting hairs. Case three: pick a case where your procedure hands me an answer I'll hate — either it tells us to keep bidding past our own ceiling, or it tells me to kill something I personally championed. Don't soften it and don't give me a fake case where the answer is easy.

  Last thing: be honest about which steps are judgment calls wearing a procedure costume, and tell me what the whole apparatus can't handle. I'm already worried about a counterparty who credibly commits to never dropping out, since that seems to change the game rather than just being aggressive play. And please don't hand me a list of bias names — if you mention a bias it has to earn its place by changing a step.
reasoning: |-
  We are creating a decision procedure to combat escalation of commitment in both M&A auctions and internal platform investments. The key is to structure it as a one-page worksheet for 90-minute deal committee meetings, usable by non-experts, and robust against self-interested rationalization by deal teams.

  Core Principles from Dollar Auction:
  1. The trailing bidder has the strongest incentive to escalate beyond rational value.
  2. The decision to enter locks in the disaster; exit decisions are path-dependent.
  3. Costs incurred (banker fees, diligence, management time) are sunk only if they cannot be recovered by completing the deal. If they are unrecoverable, then continuing might be the only way to get any value from them (making it "all-pay").

  Key Elements of the Worksheet:

  I. Pre-Commitment (Before Entering Any Process)
     - Set a walk-away price (WAP) and a maximum bid (MaxBid) before any spending starts. WAP is the absolute maximum we are willing to pay, set by a designated authority (e.g., CEO or board) and held confidentially by a neutral party (e.g., CFO or a designated committee member). The MaxBid is the initial bid ceiling set by the deal team and approved by the deal committee, but it must be below the WAP. The WAP is set in absolute terms and cannot be changed without a formal process (see below).
     - Classify the process type: 
          - All-pay: Costs (banker fees, diligence, management time) are incurred regardless of winning. (Most bank-run auctions are all-pay because we pay bankers and advisors even if we lose.)
          - Winner-pay: Only the winner pays (e.g., some internal development costs if we can stop without losing prior investment? But note: in M&A, almost always all-pay for process costs).

     How to classify:
        Question: "If we lose, do we still pay more than 10% of the total expected process costs (including management time)?" 
          - If yes, then it's all-pay. Treat as dollar-auction like.
          - If no, then it's winner-pay (normal auction).

     For all-pay auctions:
        - The WAP must be set lower than in a winner-pay auction because the sunk costs increase the effective cost of losing. Specifically, the WAP should be reduced by the expected cost of participation (if we can estimate it) or by a conservative estimate of the sunk costs we would incur.

  II. During the Process (When a Decision to Continue is Needed)

     Step 1: Update the value model with current information. 
        - This must be done by an independent team (e.g., a separate finance group) if the deal team is involved in bidding. The updated value must be based on new information (e.g., new market data, new synergies discovered) and not just re-running the same model with a higher bid.

     Step 2: Check position in the auction.
        - Are we the highest bidder? Or the trailing bidder?
        - If trailing, we are in the danger zone of the dollar auction. The worksheet must flag this.

     Step 3: Sunk cost recoverability test.
        - Question: "If we drop out now, can any portion of the sunk costs (due diligence, banker fees, management time) be recovered in another way (e.g., by applying the knowledge to a different deal, or by avoiding future costs)?" 
          - If yes, then sunk costs are partially recoverable and should not influence the decision. We are not in a dollar-auction trap.
          - If no, then the sunk costs are only recoverable by winning. This creates a dollar-auction dynamic. In this case, the value of winning must be recalculated to include the sunk costs as an additional cost of losing (because if we lose, we lose the sunk costs and get nothing). 
            - Specifically: The effective value of winning becomes (Value of the asset) + (Sunk costs) because by winning we avoid the total loss of sunk costs (which would occur if we drop out and lose). But note: we must also subtract the additional costs we will incur by continuing (e.g., more fees, management time). So the net value of winning at bid price P is: 
                Net Value = (Standalone value + Synergies - P) + (Sunk costs) - (Additional costs to close)
            - However, we must also compare to the alternative of dropping out and losing the sunk costs. So the incremental value of continuing is: 
                Incremental Value = [Net Value if win] - [Value of dropping out (which is -Sunk costs)] 
                            = (Standalone value + Synergies - P - Additional costs to close) - (-Sunk costs)
                            = Standalone value + Synergies - P - Additional costs to close + Sunk costs
            - But note: this is double-counting? Actually, if we win, we get the asset and avoid losing the sunk costs. The sunk costs are already spent, so they are a cost that we have incurred regardless. However, if we win, we get the asset and the sunk costs are not wasted (they are the cost of getting the asset). If we lose, we have the sunk costs as a dead loss. So the correct way is to consider the total cost of winning as P + Sunk costs, but the value of the asset is fixed. Alternatively, we can think of the net benefit of winning as (Value of asset) - (P + Sunk costs). But then if we drop out, we get 0 and have already spent the sunk costs, so we are at -Sunk costs. Therefore, the incremental benefit of winning over dropping out is: 
                (Value of asset - P - Sunk costs) - (-Sunk costs) = Value of asset - P.
            - This shows that sunk costs should not affect the decision to continue! But wait, that is only true if we can avoid the additional costs of continuing. In the dollar auction, the sunk costs are unrecoverable and the only way to get any value is to win. However, the value of winning is independent of the sunk costs. The catch is that in the dollar auction, the sunk costs are already gone, and the decision to continue only involves the additional bid and the additional costs of continuing. 

     Clarification: The recoverability test is about whether the sunk costs can be recouped without winning. If they cannot, then they are gone regardless. The decision to continue must be based on the incremental cost of continuing versus the incremental benefit of winning.

     However, note that in the dollar auction, the sunk costs (the bids already made) are lost, and the only way to get the dollar is to win. So the net value of winning is $1 minus the additional bid you are about to make. But you have already bid, say, $0.95 and if you bid again you pay $0.96, then the net value of winning is $1 - $0.96 = $0.04, which is positive. But if you drop out, you lose $0.95. So the incremental benefit of bidding again is $0.04 - (-$0.95) = $0.99? That can't be right. 

     Actually, if you win, your total outlay is $0.96 and you get $1, so you net $0.04. If you drop out, you lose $0.95. So the difference between winning and dropping out is $0.04 - (-$0.95) = $0.99. This makes it seem like you should continue. But note: if you bid again, you might not win (if the other bidder also bids). So the expected value depends on the probability of winning.

     Therefore, we must introduce the probability of winning. The incremental cost of continuing is the additional bid and the additional process costs. The incremental benefit is the value of the asset multiplied by the probability of winning, minus the additional costs. But note, the sunk costs are already gone and are not incremental. However, if we don't win, we lose the sunk costs. So the expected value of continuing is:
          Expected Value = [Probability of winning] * (Value of asset - Total cost if win) 
                         + [1 - Probability of winning] * (-Total sunk costs including the new bid and costs)
          But note: the total sunk costs if we continue and lose are the original sunk costs plus the new costs.

     Alternatively, we can think of the net position:

          If we drop out: we are at -Sunk_costs (already spent).

          If we continue: 
              With probability p: we win -> we get (Value - (Sunk_costs + Additional_costs + Bid))
              With probability 1-p: we lose -> we get - (Sunk_costs + Additional_costs)

          So the expected value of continuing is:
              p*(Value - Sunk_costs - Additional_costs - Bid) + (1-p)*(-Sunk_costs - Additional_costs)
              = p*Value - p*(Sunk_costs + Additional_costs + Bid) - (1-p)*(Sunk_costs + Additional_costs)
              = p*Value - p*Bid - Sunk_costs - Additional_costs

          Now, the expected value of dropping out is: -Sunk_costs.

          So the incremental expected value of continuing over dropping out is:
              [p*Value - p*Bid - Sunk_costs - Additional_costs] - [-Sunk_costs]
              = p*Value - p*Bid - Additional_costs

     Therefore, the sunk costs do not appear in the incremental decision. They are sunk! 

     But then why the dollar auction trap? Because in the dollar auction, the bidders do not think in terms of probability? Or because the probability of winning is overestimated? Or because the cost of continuing (the next bid) is small relative to the sunk costs? 

     The trap occurs because the bidders focus on the total loss if they drop out (which includes the sunk costs) and compare it to the net gain if they win (which is the dollar minus the total bid). But the rational decision is to ignore the sunk costs and only consider the future costs and benefits.

     Therefore, the recoverability test might be a red herring? 

     However, note that in the dollar auction, the decision to enter is the problem. Once in, you should ignore sunk costs. But the problem is that the incremental cost (the next bid) is very small compared to the potential loss of the sunk costs, and the probability of winning might be overestimated.

     So the procedure should:

     - Force the team to ignore sunk costs in the continue/drop decision. The sunk costs are gone. The decision to continue must be based on the future costs and benefits.

     - But the recoverability test might help in setting the initial WAP? Actually, in an all-pay auction, the expected cost of participating is the cost of the process plus the expected payment if we win. So the WAP should be set lower than in a winner-pay auction by the amount of the expected participation cost.

     Revised Approach:

     Step 1: Determine if the process is all-pay (as above). This affects the initial setting of the WAP.

     Step 2: Set the WAP and MaxBid at the start (by the CEO/board, held by CFO). The WAP is set as:
          WAP = (Value of the asset) - (Expected cost of participation in the process)   [for all-pay]
          WAP = (Value of the asset)   [for winner-pay]

     But note: the value of the asset is uncertain. We set it as the expected value.

     Step 3: During the auction, when considering a new bid:

          a. Update the value of the asset based on new information (by an independent team).
          b. Assess our position: highest or trailing? (Requires independent verification of other bidders, not relying on banker alone.)
          c. Calculate the incremental expected value of continuing:

              Let:
                  V = current expected value of the asset (including synergies)
                  P = the bid we are considering
                  C_add = additional costs to close (including banker success fees, management time, etc.) if we win, and additional costs even if we lose (e.g., more management time, due diligence extension)
                  p = probability of winning if we bid P

              Expected incremental value of bidding P = p*(V - P - C_add) + (1-p)*(-C_add) 
                                                  = p*(V - P) - C_add

              We must also consider the no-bid alternative: we drop out and incur no additional costs (C_add=0) but we lose the sunk costs. But note: the sunk costs are already incurred regardless. So the state of the world if we drop out now is -Sunk_costs. The state if we continue is p*(V - P - C_add) + (1-p)*(-Sunk_costs - C_add). 

              But the difference is:

                  Continue: p*V - p*P - C_add - (1-p)*Sunk_costs - C_add? 
                  Actually, the sunk costs are already incurred and are not affected by the current decision. They are a constant. So we can ignore them.

              Therefore, we only consider the future: 
                  Continue: we get an expected value of p*(V - P) - C_add (relative to the current sunk costs).
                  Drop out: we get 0 (relative to the sunk costs).

              So we continue only if: p*(V - P) - C_add > 0.

          d. But note: we also have the WAP. We must not exceed the WAP. So if P > WAP, we must drop out regardless.

          e. Also, if we are the trailing bidder, we must be extra cautious because the probability p might be low. The worksheet should force an independent assessment of p (not by the bankers, who are conflicted). How to estimate p? We might use market intelligence, but it's hard. We can use a rule: if we are trailing, then p is capped at 0.5 unless there is strong evidence otherwise. If we are the leader, p might be 0.7 or 0.8? But these are guesses.

     Given the complexity, we simplify:

     - We require that any new bid must be below the WAP (which is fixed and held by the CFO). The CFO must confirm that the bid is below WAP.
     - We then require that the expected value of the bid is positive: p*(V - P) - C_add > 0.
     - The probability p is assessed by the deal committee based on:
          - If we are the highest bidder: p = 0.7 (default) unless evidence suggests otherwise.
          - If we are the trailing bidder: p = 0.3 (default) unless evidence suggests otherwise.

     Step 4: If we are the trailing bidder and the bid we are considering is above the original MaxBid (the kickoff ceiling), then we require a special approval (e.g., CEO and board member) to continue.

     Step 5: For internal platforms: same as above, but the "bid" is the additional investment required. The WAP is the total investment ceiling set at the start. The value V is the remaining value of the project (from this point on). The sunk costs are ignored. We continue only if the expected value of the remaining investment is positive.

     However, for internal platforms, there might be an option to abandon and salvage some value? Then the recoverability test: can we recover part of the sunk costs by abandoning now (e.g., selling the technology, avoiding future costs)? If so, then that becomes the alternative. The incremental value of continuing is the value of completion minus the additional investment, versus the salvage value.

     Worksheet Structure:

     One-Page Worksheet for Deal Continuation Decision

     1. Process Type:
          ( ) All-pay (costs incurred win or lose) 
          ( ) Winner-pay 
          If all-pay, note: initial WAP was set lower by estimated process costs.

     2. Current Status:
          - Current bid/investment required: ________
          - Are we the highest bidder? ( ) Yes ( ) No 
          - If no, we are trailing: caution, probability of winning is low.

     3. Walk-Away Price (WAP) set at start: ________ (held by CFO, confidential until now)
          - Is current bid above WAP? ( ) Yes -> WALK (no further discussion)
          ( ) No -> proceed

     4. Value Update:
          - Current expected value (V) of asset/platform (updated by independent team): ________
          - Additional costs to close (C_add, including fees, management time, etc.): ________
          - Probability of winning/success (p): 
              Default: 
                  If highest bidder: 0.7
                  If trailing: 0.3
              Adjusted by committee if evidence: ________

     5. Expected Value Calculation:
          Expected incremental value = p*(V - Current bid) - C_add = ________
          - If this is negative -> WALK
          - If positive -> proceed to next step

     6. For trailing bidders in auction:
          - Is current bid above the initial MaxBid (kickoff ceiling)? ( ) Yes ( ) No
              - If yes, then require special approval (CEO and one board member) to continue.

     7. For internal platforms:
          - Is there a salvage value if we abandon now? ________
          - Then the expected value of continuing is p*(V) - C_add, and the alternative is salvage value (which we get for sure). So we continue only if p*V - C_add > salvage value.
          - If no salvage value, then we continue only if p*V - C_add > 0.

     8. Mandatory Walk Conditions (any one triggers walk):
          a. Current bid > WAP.
          b. Expected incremental value <= 0 (or for internal platform with salvage, <= salvage value).
          c. For trailing bidder: bid above initial MaxBid and no special approval.

     Two Sentences for the Associate to Remember:

     1. "The decision to enter an all-pay contest creates the trap; once in, the sunk costs are gone and should not affect your next move."
     2. "When you are trailing, remember: the auction is already lost unless you have a clear and independent reason to believe you can win at a price that still makes sense."

     Additional Structural Workarounds:

     - Who sets WAP: CEO/board at the very beginning, before any spending.
     - Who holds WAP: CFO (or if CFO is involved, a designated board member). The deal team does not know the WAP until the moment of this worksheet (to avoid anchoring their valuation).
     - Revision of WAP: only allowed if there is a material change in the value of the asset (e.g., new market data, new technology) that is independent of the bidding process. The revision must be approved by the same authority (CEO/board) and documented with the reasons. The revised WAP must be set without regard to the sunk costs.
     - Independent verification: for the other bidder's status, use multiple sources (not just the banker). For value update, independent team.

     Case Analysis:

     Case 1: Live M&A process, we're second at $310M, kickoff ceiling $285M, synergy model now says $315M clears hurdle, bankers say other bidder is emotional.

     Steps:
        1. Process type: all-pay (typical bank-run auction).
        2. Current bid: $310M? Actually, we are bidding $310M and are currently second. The next bid would be higher? The worksheet is used when we are considering a new bid. Let's assume we are considering a bid of, say, $315M to become the leader.
        3. WAP: was set at start. We don't know it. The CFO reveals: let's assume the initial WAP was $300M (which was set lower than the initial value because of expected process costs). But note: the team has updated the value to $315M. However, the WAP is fixed. So if the WAP is $300M and we are bidding $315M -> above WAP -> WALK.
          But what if the WAP was revised? The team might argue that the value has increased. They must request a revision. The revision must be approved by the CEO/board. The revision request must show that the increase in value is due to new information (not just re-running the model) and is independent of the auction. The board must set a new WAP without knowing the current bid. Let's assume they set it to $310M. Then:
              Current bid $315M > WAP $310M -> WALK.

          Alternatively, if the WAP was initially $320M (so $315M is below) then we proceed.

          But also: 
              We are trailing -> probability p = 0.3 (default) unless evidence. Banker says other bidder is emotional -> but we don't trust banker. No independent evidence? So p=0.3.
              V = $315M (the value including synergies, so the value we get if we win is $315M, but we pay $315M? Then V - P = 0. 
              Expected incremental value = 0.3 * (315 - 315) - C_add = -C_add (which is positive? no, negative). So we walk.

          Even if V were higher? The value to us is $315M, meaning we are indifferent at paying $315M. But we pay $315M and then we get $315M of value? So net zero. Then the expected value is 0.3*0 - C_add = -C_add. So we walk.

          Therefore, regardless of WAP, we walk because the expected value is negative.

     Case 2: Internal platform, $40M spent, needs $15M more. Team says remaining value is positive and independent of sunk costs. Board member says sunk costs.

     Steps:
        Process type: all-pay? We have already spent $40M and if we abandon, we lose it. But the $15M is future. So we are at a decision point for the additional $15M.

        We treat as a continuation decision:

          Value of the project if completed (from this point): V (must be estimated by independent team). The team says positive, so let V be the value upon completion.

          Additional investment (bid): $15M.

          Additional costs (C_add): might be zero or include operational costs? Let's assume only the $15M.

          Probability of success (p): what is the chance the project will succeed if we invest the $15M? Let's say 0.8.

          Salvage value: if we abandon now, can we sell anything? Probably not, so salvage = 0.

          Expected incremental value = p*V - C_add = 0.8 * V - $15M.

          We continue only if 0.8*V > $15M, i.e., V > $18.75M.

          The sunk costs ($40M) are irrelevant.

          If the team's remaining value V is, say, $20M, then we continue.

          The board member is right that sunk costs are irrelevant, but the decision to continue is based on the future value and cost.

     Case 3: A case where the procedure gives an answer you hate.

     Example: An internal platform you championed. It has spent $100M, needs $10M more. The independent team values the remaining value at $9M (so if completed, we get $9M). Salvage value is $0. Probability of success is 0.9. 

          Expected value = 0.9 * 9 - 10 = 8.1 - 10 = -$1.9M -> negative.

          The procedure says: kill.

          But note: if we don't continue, we get $0. If we continue, we expect to lose $1.9M. So we kill.

          You hate it because you championed it and the sunk cost is $100M. But the procedure ignores sunk costs and looks only at the future.

     Limitations:

     - Probability estimation is subjective. We use defaults, but they might be wrong.
     - The independent valuation team might not be truly independent.
     - The WAP holder might be influenced.
     - The procedure cannot handle a counterparty who credibly commits to never dropping out. In that case, if we are trailing, the probability p becomes very low and we should drop out. The procedure would force us to drop out. But if we are the leader, we might overpay because the other will never drop? But then we should not bid beyond the WAP.
     - Also, the procedure assumes we can assess our position (leading or trailing) independently. If the other bidder is bluffing, we might misjudge.

     Finally, note that the procedure is designed to force the team to think in terms of future costs and benefits and to ignore sunk costs. The structural workarounds (confidential WAP, independent teams) are critical to avoid self-deception.
answer: |-
  ### Decision Procedure: Escalation of Commitment Defense Framework  
  **One-Page Worksheet for Deal Committee Review**  
  *(Max 90 minutes; led by neutral facilitator; inputs sealed pre-meeting)*  

  ---

  #### **Step 1: Classify the Process**  
  - **Question:** *"If we lose/abandon, do we lose ≥70% of non-refundable costs (banker fees, diligence, management time)?"*  
    - **All-Pay (Dollar Auction):** "Yes" → Apply **Steps 2-6 strictly**.  
    - **Winner-Pay (Normal Auction):** "No" → Skip to Step 4; sunk costs irrelevant.  
    - *Sufficient Answer:* Quantify costs from finance (not deal team). If unverifiable, default to "All-Pay."  

  #### **Step 2: Set Walk-Away Price (WAP) & Hold**  
  - **Who/When:** CEO/CFO sets WAP **before process start** (e.g., at deal kickoff).  
  - **Holder:** Neutral arbiter (e.g., CFO or board delegate); **not shared with deal team/bankers**.  
  - **Revision Rules:**   
    - Allowed **only** on new, exogenous data (e.g., market crash, regulatory shift).  
    - Requires CEO/CFO approval + documented evidence of external change. *Rationalization test: "Would this data change our view if we weren’t already bidding?"*  

  #### **Step 3: Sunk Cost Recoverability Test**  
  - **Question:** *"Can any sunk costs be repurposed/recovered if we quit now? (e.g., IP reused, relationships salvaged, costs avoided)"*  
    - **Recoverable:** "Yes" → Sunk costs irrelevant. Proceed to Step 4.  
    - **Unrecoverable:** "No" → **Dollar auction active**. Trigger **Step 5 Position Check**.  
    - *Sufficient Answer:* Independent tech/ops team assessment. Deal team excluded.  

  #### **Step 4: Updated Value vs. WAP**  
  - **Question:** *"Post-diligence, does the bid/investment clear WAP and hurdle rate?"*  
    - **Valuation Rules:**  
      - Led by **independent finance team** (not deal team/bankers).  
      - Synergies capped at pre-bid estimate +10% without new evidence.  
      - Banker claims about "emotional bidders" ignored without 3rd-party verification.  
    - **Walk Condition:** Bid > WAP or value < hurdle → **MANDATORY WALK**.  

  #### **Step 5: Position Check (Auctions Only)**  
  - **Question:** *"Are we the highest bidder (H1) or trailing (H2+)?"*  
    - **H1 (Leader):** Bid only up to **WAP – 5% buffer**.  
    - **H2+ (Trailing):** **EXTREME CAUTION** → Requires CEO override to bid further.  
    - *Verification:* Cross-check with 2 independent sources (e.g., consultant, legal, industry contact). Banker input discounted.  

  #### **Step 6: Continue/Kill Decision**  
  - **Formula:** `Expected Value (EV) = (Probability of Win × Incremental Value) - Cost to Proceed`  
    - **Incremental Value:** Future value only (ignore sunk costs).  
    - **Probability of Win:** H1=60%; H2+=20% (default unless evidence).  
    - **Cost to Proceed:** New costs only (e.g., next bid, management time).  
  - **Walk Conditions:**  
    - EV ≤ 0 → **MANDATORY KILL**.  
    - Trailing (H2+) + no CEO override → **MANDATORY WALK**.  

  ---

  ### **Key Principles for Associates**  
  1. **"The trap is set at entry, not exit:** Entering an all-pay auction locks in losses. Once in, your only move is ruthless objectivity—ignore sunk costs, ego, and momentum."  
  2. **"When trailing, your best move is often to fold:** Escalation is driven by the bidder in second place. If you’re behind, assume you’ve already lost and walk unless you have bulletproof, independent data."  

  ---

  ### **Case Applications**  
  #### **Case 1: Live M&A Process (2nd at $310M)**  
  - **Step 1:** All-pay (banker/diligence costs sunk).  
  - **Step 2:** WAP = $285M (pre-set). $310M bid > WAP → **MANDATORY WALK** (WAP breach).  
  - **Step 3:** Sunk costs unrecoverable → Enters **Step 5**.  
  - **Step 5:** Trailing (H2) → **No bid allowed** without CEO override.  
  - **Step 6:** EV = (20% prob × ($315M - $310M)) - $1M costs = **-$0.2M** → Walk.  
  - ***Outcome:** Walk. Team’s synergy re-run ignored (no exogenous change). Banker claim of "emotional bidder" rejected (no independent proof).*  

  #### **Case 2: Internal Platform ($40M spent, $15M needed)**  
  - **Step 1:** All-pay (sunk R&D costs).  
  - **Step 3:** Sunk costs **recoverable?**  
    - If IP/learnings reusable elsewhere: "Yes" → Sunk costs irrelevant.  
    - If project-specific: "No" → Proceed to EV.  
  - **Step 6:** EV = (Prob success × Remaining value) - $15M.  
    - If $15M creates $20M value (per team): EV = (70% × $20M) - $15M = **-$1M** → **KILL**.  
    - *Board member is right on sunk costs but wrong if incremental EV positive. Distinction: Sunk costs irrelevant, but recoverability matters for classifying the game.*  

  #### **Case 3: Hateful Answer (You Championed It; Procedure Says Kill)**  
  - **Scenario:** Internal AI platform. You drove $90M investment. Needs $10M more.  
  - **WAP:** Pre-set at $95M total.  
  - **Step 3:** Sunk costs unrecoverable (custom tech).  
  - **Step 6:**  
    - Remaining value = $12M (per independent team).  
    - Prob success = 65% (per third-party expert).  
    - EV = (65% × $12M) - $10M = **-$2.2M**.  
  - ***Outcome:** **KILL**. Even if WAP allows, negative EV forces exit. Sunk costs amplify loss but aren’t considered—decision based on marginal cost/benefit.*  

  ---

  ### **Honest Limitations**  
  1. **Judgment in Disguise:**  
     - Probability assignments (Step 6) are guesstimates. Mitigation: Defaults force conservatism.  
     - Recoverability test (Step 3) is qualitative. Mitigation: Independent auditors.  
  2. **Blind Spots:**  
     - **"Never quit" opponents:** If rival credibly signals infinite budget (e.g., sovereign wealth fund), the model breaks. Walk preemptively if detected.  
     - **Hidden synergies:** Post-acquisition integration risks aren’t quantified. Use penalty (e.g., -20% value) for complex integrations.  
  3. **What It Can’t Handle:**  
     - Coordinated bidding rings (anti-competitive).  
     - Non-monetary strategic plays (e.g., blocking a competitor).  

  **Final Note:** This forces discipline but can’t eliminate ego. The facilitator’s role is sacred—pick someone immune to deal fever.
