prompt: |-
  Second-year semantics PhD here, nominally in linguistics but really doing philosophy of language, and I've got a slogan problem. My advisor's got a line he uses to end discussion — something like "counterfactuals have truth conditions, indicatives only have assertibility conditions" — and he deployed it last week when I asked whether the Oswald indicative (the one about someone else having done it, if he didn't shoot Kennedy) could come out false. He said that's a category mistake, indicatives aren't in the business of being true or false, and then we moved on to modal bases and I never got my answer.

  I'm now pretty sure that one sentence is doing at least five different jobs and he's only entitled to one of them. Can you pull it apart for me?

  What I want is a menu of the distinct theses it could be standing for, roughly ordered from platitude to heresy, with a verdict on each — is it trivially right, substantive but defensible, or just false:

  - the strong non-factualist reading, where the indicative genuinely has no truth conditions at all. What has to follow for negation, embedding, disjunction, and the Frege point if that's true? And can the view even be stated — if indicatives lack truth conditions, what's the status of the sentence asserting that they do?
  - the weaker reading where they *do* have truth conditions but their assertibility conditions systematically diverge from them, with the divergence cashed out pragmatically. What's actually doing the work here that isn't just a relabeling?
  - the probabilistic reading, where the slogan is really Adams' thesis in disguise: the credence in an indicative equals the conditional credence, and no truth-conditional semantics can deliver that. Is that what Lewis's triviality result shows, and does it license "no truth conditions" or only something narrower about what a truth-conditional account can match?
  - the other half, about counterfactuals. What is "has truth conditions" supposed to buy them, given that the two big similarity accounts don't even agree on conditional excluded middle — Stalnaker says yes, Lewis says no, I think, unless I've got that backwards — and given that on a strict-conditional reading plenty of counterfactuals come out vacuously true in a way that feels like it dodges the question?
  - and the deflationary Kratzer-ish reading where it's one connective and the whole indicative/subjunctive contrast lives in the modal base, so the slogan's grammar is a red herring.

  Then the payoff question: which of these readings, if any, would actually license what he did — waving off my Oswald question as malformed? I want to know whether there's a version on which he's right and my question was bad, becuase I'd much rather find that out now than in my third year.

  Two constraints. No reading list or bibliography, I've already got the papers, I just want the disambiguation. And don't re-explain each theory from scratch — assume I've read them and give me the load-bearing distinctions, the places where two readings that sound the same actually come apart in a case. A page or so is fine.
reasoning: |-
  Okay, the user is a second-year semantics PhD student working on philosophy of language. They have a specific issue with their advisor's slogan about counterfactuals having truth conditions while indicatives only have assertibility conditions. The advisor used this to dismiss a question about the Oswald indicative, calling it a category mistake. The student wants to dissect the slogan into distinct theses, evaluate each, and find out if any version justifies their advisor's dismissal.

  First, I need to break down the slogan into possible interpretations. The user mentioned five readings: strong non-factualism, weak divergence, probabilistic (Adams' thesis), counterfactual truth conditions, and Kratzer's unified approach. They want each evaluated for plausibility and whether it licenses the advisor's response.

  Starting with the strong non-factualist view. If indicatives genuinely lack truth conditions, how does that affect embedding and negation? The user brought up the Frege point, which relates to how sentences function in different contexts. Non-factualism might struggle with embeddings like negations or conditionals. For example, "It's not true that if Oswald didn't shoot Kennedy, someone else did" would be problematic. If indicatives can't be true or false, such embeddings might not make sense. Also, stating the view itself could be self-defeating since the claim "indicatives have no truth conditions" would need truth conditions. This view seems hard to maintain, so it's likely the least plausible.

  Next, the weak divergence thesis. Here, indicatives have truth conditions but assertibility is different, often due to pragmatic factors like Gricean implicatures. But the user asks what's doing the work beyond relabeling. For instance, in the Oswald case, the truth conditions might involve a restricted epistemic modal base, but assertibility depends on the speaker's evidence. The advisor's dismissal might not hold here because the indicative could still be false if the truth conditions aren't met. So, while defensible, this view doesn't make the question malformed.

  The probabilistic reading ties into Adams' thesis. The idea is that credence in an indicative equals conditional probability. Lewis's triviality results show that this can't align with truth-conditional semantics under certain assumptions. However, this doesn't mean no truth conditions; it might mean that truth conditions can't capture the probabilistic assertibility. The Oswald question could still be meaningful, as one might evaluate its truth in a context. So this reading doesn't support the advisor's claim that the question is a category mistake.

  For counterfactuals having truth conditions, the user notes that similarity accounts (Stalnaker vs. Lewis) disagree on points like conditional excluded middle. Even if counterfactuals have truth conditions, they can be vacuously true or indeterminate. The advisor might overstate the stability of counterfactual truth conditions. But the key issue is whether indicatives are different. If counterfactuals have clearer truth conditions, it doesn't automatically mean indicatives lack them entirely.

  The Kratzerian approach treats both indicatives and counterfactuals with the same connective, differing only in modal base. Here, the slogan's distinction is artificial. In this framework, the Oswald indicative has truth conditions relative to a modal base. The advisor's dismissal wouldn't hold because the question about its truth is valid. This view undermines the slogan entirely.

  Now, which readings justify the advisor's response? The strong non-factualist view does, as it claims indicatives can't be true/false. But that view is problematic. The probabilistic stance might support it if the focus is solely on probability, but even Adams allows for truth-conditional content. The other readings don't support dismissing the question as malformed.

  The user's deeper needs: They want to know if their advisor's position is defensible to avoid future issues. They might be concerned about challenging the advisor or seeking clarity for their research. By showing that only the most extreme view supports the advisor, and that view has serious flaws, the user can confidently explore alternative frameworks without fearing their question was invalid. They also need to navigate the advisor's expectations while pursuing their philosophical interests.
answer: |-
  Here's the disambiguation you requested, breaking down the slogan into distinct theses, ordered from most defensible to least, with verdicts and the payoff on your advisor's move:

  1.  **The Probabilistic/Adams' Thesis Reading:**
      *   **Thesis:** The slogan asserts Adams' Thesis: The rational assertibility (credence) of an indicative conditional *A → B* equals the conditional credence *P(B|A)* (assuming *P(A) > 0*). Crucially, *no truth-conditional semantics can systematically satisfy this equation for all probability distributions*, as shown by Lewis's triviality results and subsequent work. The slogan's "no truth conditions" is shorthand for "no *satisfactory* truth-conditional semantics that captures the core probabilistic assertibility data."
      *   **Verdict:** **Substantive but defensible (within its aims).** Adams' Thesis is a powerful empirical generalization about assertibility. Lewis's result *does* show that no truth-conditional account satisfying certain plausible constraints can *match* this assertibility profile universally. It licenses "no *adequate* truth-conditional semantics," **not** necessarily "no truth conditions *simpliciter**."
      *   **Load-Bearing Distinction:** Consider a fair die (*P(1)=1/6, P(even)=1/2*). Adams' Thesis says *assertibility*(If it's not 1, it's even) = *P(even | not 1) = P(even)/P(not 1) = (1/2)/(5/6) = 3/5*. A truth-conditional account (e.g., material implication) yields *P(¬1 ⊃ even) = P(1 ∨ even) = P(1) + P(even) - P(1∧even) = 1/6 + 1/2 - 1/6 = 1/2*. The divergence (3/5 vs 1/2) illustrates the problem Lewis's theorem generalizes. The slogan points to *this* fundamental mismatch.
      *   **Licenses Advisor?** **No.** Adams' Thesis is about *credence/assertibility*, not truth *simpliciter*. Your question about the Oswald indicative ("If Oswald didn't shoot Kennedy, someone else did") being *false* is perfectly coherent on this view. Its high assertibility (*P(someone else | ~Oswald)* given the evidence) doesn't preclude it being false in reality (if Oswald did it *and* no one else was involved). The thesis explains *why we assert it*, not that it *can't be false*.

  2.  **The Kratzerian Unification Reading (The Grammar Red Herring):**
      *   **Thesis:** The slogan's indicative/counterfactual *grammatical* distinction is misleading. There's one conditional operator (e.g., a modal operator + restrictor). The difference lies entirely in the *modal base* (epistemic vs. metaphysical/bouletic) and *ordering source* (stereotypical vs. similarity-based). "Truth conditions" vs. "assertibility" reflects the modal base's nature: epistemic modal bases make truth assessment relative to an information state (hence "assertibility-like"), while metaphysical bases aim for mind-independent truth.
      *   **Verdict:** **Substantive and defensible.** This captures the core insight driving the slogan without its extreme claims. Indicatives *have* truth conditions relative to an epistemic modal base.
      *   **Load-Bearing Distinction:** The Oswald sentence *itself* could be interpreted with an epistemic modal base (indicative) or a metaphysical one (counterfactual). Its *truth conditions* differ radically based on the modal base. With an epistemic base (what we know/believe), it might be true (given evidence ruling out solo Oswald). With a metaphysical base (how the world might have been), it might be false (if Oswald acted alone in all close worlds). The grammar is secondary; the modal parameters are primary.
      *   **Licenses Advisor?** **Emphatically No.** This view *requires* that the indicative Oswald conditional *has* truth conditions (relative to an epistemic modal base). Your question about its falsity is central. If the modal base includes the actual facts (as per some theories), it *could* be false (if Oswald did it alone). Even if the modal base is purely informational, its truth/falsity *relative to that base* is perfectly meaningful. The slogan fundamentally misrepresents this framework.

  3.  **The Weak Divergence (Pragmatic Mismatch) Reading:**
      *   **Thesis:** Indicatives *have* truth conditions (often analyzed as some form of restricted epistemic necessity, e.g., *Must(B, given A)* or a variably strict conditional). However, their *assertibility conditions* systematically diverge from these truth conditions due to pragmatic factors (e.g., Gricean implicatures, salience, or the specific constraints on the relevant epistemic state). The slogan overstates the case by saying "only" assertibility.
      *   **Verdict:** **Substantive and defensible.** This captures the *intuition* behind the slogan without its metaphysical baggage. There *is* a divergence (often explained by the probabilistic data or contextual constraints on the modal base). The work is done by specific pragmatic mechanisms interacting with the semantic core.
      *   **Load-Bearing Distinction:** Take "If Bert is in Boston, he is not in a pub." Semantically (on many accounts), this might be true iff Bert isn't both in Boston and in a pub. Pragmatically, it's only assertible if the speaker has specific reason to link Bert's location and pub-visiting (e.g., knowing Bert hates Boston pubs). The semantic truth condition is broad; the assertibility condition is narrow and context-dependent. The divergence is explained pragmatically, not by denying semantics.
      *   **Licenses Advisor?** **No.** The indicative Oswald conditional *has* truth conditions on this view (e.g., true iff in all epistemically accessible worlds where Oswald didn't shoot, someone else did). Your question about its *falsity* is meaningful – it would be false if there are accessible ~Oswald-worlds where no one else shot (perhaps worlds where the investigation was wrong and there was no conspiracy). The pragmatics explain *why we assert it confidently*, not that it can't be false.

  4.  **The Counterfactual Stability Reading:**
      *   **Thesis:** "Has truth conditions" for counterfactuals means their truth value is (or aims to be) *stable* or *objective* – less dependent on the speaker's ephemeral epistemic state than indicatives, grounded in "how the world is" (similarity, laws, etc.). This acknowledges the Stalnaker/Lewis debate (CEM: Stalnaker Yes, Lewis No; Vacuous Truth: Both have it) but claims counterfactuals are *in the business* of aiming for mind-independent truth, unlike indicatives.
      *   **Verdict:** **Substantive but debatable.** While counterfactuals *often* use more objective modal bases, the line is blurry (epistemic counterfactuals exist: "If the butler had done it, there would be blood on his shirt (given what we know)"). Vacuous truth *is* a problem ("If I were taller, 2+2=4" is vacuously true but useless). "Stability" is a matter of degree, not kind.
      *   **Load-Bearing Distinction:** Compare indicative "If it rained last night, the streets are wet" (epistemic base, truth depends on current knowledge) vs. counterfactual "If it had rained last night, the streets would be wet" (metaphysical/stereotypical base, truth depends on weather laws, drainage, etc.). The latter *feels* more like a claim about the world's structure. However, stability isn't guaranteed (consider indeterminacy in similarity orderings).
      *   **Licenses Advisor?** **Indirectly, but poorly.** It *motivates* the slogan's intuition (indicatives feel more epistemic/subjective, counterfactuals more ontic/objective). However, it **does not** entail that indicatives *lack truth conditions* or that asking about their truth is a category mistake. It just says their truth is more contextually tied to information states.

  5.  **The Strong Non-Factualist Reading:**
      *   **Thesis:** Indicative conditionals genuinely **lack truth conditions**. They are not truth-apt; they express something else (e.g., a conditional attitude, a conditional speech act, a high conditional probability). "If A, B" isn't asserting a proposition. Negation, embedding, etc., pose severe challenges ("It's not true that if A, B" becomes problematic; disjunctions like "(If A, B) or C" are puzzling). The Frege point (sentences have the same meaning in assertion and embedding) seems violated. Stating the view itself is problematic (is *that* sentence truth-apt?).
      *   **Verdict:** **Highly problematic / False (for mainstream semantics).** The embedding and negation problems are widely seen as fatal. Most contemporary theories (even probabilistic ones like Kaufmann's or non-propositional ones like dynamic semantics) *assign* some form of compositional semantic value (proposition, update potential) to handle embedding logically. Denying truth-aptness entirely makes the logic and compositionality inexplicable.
      *   **Load-Bearing Distinction:** Consider "Either the match is not dry, or if it is dry, it will light." Intuitively valid. If "If dry, lights" lacks truth conditions/truth-value, how can the disjunction be valid? A non-factualist needs a radical account of disjunction/negation specifically for conditionals (e.g., Gibbardian expressivism). Most find this cost too high.
      *   **Licenses Advisor?** **Yes, but...** This is the *only* reading that strictly licenses calling your question a "category mistake." If indicatives aren't truth-apt, asking if the Oswald indicative is *false* is indeed malformed – like asking if "Ouch!" is false. **However,** this view is exceptionally difficult to defend due to embedding and faces overwhelming opposition in formal semantics/philosophy of language. Its coherence is deeply contested.

  **Payoff: Which Reading Licenses Your Advisor?**

  *   **Only the Strong Non-Factualist Reading (5)** strictly licenses dismissing your question about the falsity of the Oswald indicative as a "category mistake."
  *   **However, this view is the least defensible** of the bunch, facing crippling logical and compositional challenges. It's the heresy.
  *   The other readings (1-4) all **allow that the Oswald indicative has truth conditions or a semantic value that can be assessed** (as true/false, or relative to a modal base, or probabilistically unsupported). Your question is meaningful on these views. The slogan, on these readings, is either an overstatement (1, 3, 4) or a misrepresentation (2).
  *   The most *charitable* interpretation aligning somewhat with the spirit (but not the letter) of the dismissal is the **Probabilistic Reading (1)**: Your advisor might be emphasizing that the *primary* thing we track with indicatives is conditional probability/assertibility, and *worrying* about their absolute truth/falsity misses their core function or is secondary to their assertibility dynamics (especially given Lewis's result). But this **doesn't** make the truth question *malformed*, just potentially less central or harder to ground than for counterfactuals.

  **Conclusion:** Your suspicion is correct. The slogan bundles distinct claims. Only its most extreme and least plausible interpretation licenses treating your question as a category error. The more defensible interpretations of the slogan's *insight* (probabilistic assertibility, contextual modal bases, pragmatic divergence, differing stability) **do not** support dismissing the truth-aptness of indicative conditionals or your specific question. Your advisor likely holds a strong version of (1) or (5), but his dismissal only strictly follows from (5), which is highly problematic. Your question about the Oswald indicative's potential falsity is philosophically and semantically legitimate on nearly all contemporary accounts.
