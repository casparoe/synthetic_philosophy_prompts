prompt: |-
  I facilitate deliberative processes for a county government — land use, a proposed group home, school consolidation, budget priorities — and roughly ten or twelve times a year a session deadlocks in the same way: the two sides are not disagreeing about the evidence so much as about the extension of a loaded predicate, and every attempt to settle the matter by definition leaves somebody feeling dismissed. On my own time I have been reading Nāgārjuna and the Madhyamaka treatment of the tetralemma — the four-cornered analysis in which a claim is examined as holding, as not holding, as both, and as neither — together with the associated doctrine that things are empty of intrinsic nature and exist only as dependently arisen and conventionally designated. I want to know whether any of that can be turned into something my teams could actually run in a room, or whether the attempt corrupts it past the point of usefulness.

  Please write the procedure itself rather than an essay about the philosophy behind it. It should be a sequence of questions a facilitator asks in order, with the available moves at each step, what counts as a sufficient answer to move on, the conditions under which the procedure halts and refuses to proceed, and the points where the decision is a judgment call that cannot be written down. Design to these constraints: two-hour sessions; twelve to forty participants with no philosophy background and mixed literacy; a co-facilitator who is openly skeptical that any of this is more than a parlor trick; a program director who needs a one-page handout and a written record of how each session concluded; and no Sanskrit or Pali vocabulary in anything the group hears. Then tell me which distinctions in the doctrine must survive the simplification for the procedure to still be doing what Nāgārjuna was doing — I suspect the difference between negating all four corners and asserting the fourth, the fact that his arguments function as reductios rather than counter-theses, the dependence of any designation on causes and conditions, and the insistence that emptiness is itself empty all have to stay — and which can be dropped without loss, such as the soteriological framing, karma and rebirth, and the monastic setting. I specifically want the last of those built in as a closing move, so that a group cannot walk out having installed "it's both and neither" as a new fixed answer to replace the old one. Include an explicit prohibition on using the procedure to declare a disagreement about observable fact somehow both true, and say how a facilitator recognizes that case in time to bail out.

  Run it on three situations I have actually sat through: a neighborhood association split over whether a supervised consumption site made their block more or less dangerous, where both sides have incident counts and the counts do not match; an alumni group and a new parent council arguing about whether the school formed by merging two buildings is still "our school"; and a volunteer board arguing over whether a longtime member's habit of steering newcomers toward particular projects was welcoming or gatekeeping. For at least one of these I expect the procedure to refuse the case, or to reach a conclusion I will not like — say so plainly rather than bending the tool. Finally, two requests about epistemic honesty. First, separate what is settled from what is genuinely contested among people who work on Madhyamaka: whether Nāgārjuna advances any thesis of his own, whether the fourth corner is ever a position rather than a refusal of all positions, whether emptiness is a metaphysical claim about how things are or a claim about our concepts, and whether the tetralemma licenses anything like true contradictions — and if the procedure's design quietly depends on one side of any of those disputes, flag that dependence rather than presenting your preferred reading as the consensus. Second, tell me where I may be fooling myself: whether reducing a practice aimed at liberation from suffering to a technique for getting a county working group to stop shouting is a distortion, a legitimate secular borrowing, or a question nobody is in a position to settle.
reasoning: |-
  We are designing a practical facilitation procedure inspired by Madhyamaka, specifically the tetralemma and the concept of emptiness. The goal is to help groups move beyond deadlocks that stem from conflicting interpretations of "loaded predicates" (terms that carry strong emotional or ideological baggage) without replacing one fixed view with another. The procedure must be accessible to non-philosophers, fit within a two-hour session, and avoid any specialized vocabulary.

  Key elements from Madhyamaka that must be preserved:
  1. The tetralemma (four corners): examining a proposition as true, false, both, and neither.
  2. The arguments function as reductios (showing the absurdity of holding any fixed position) rather than advancing counter-theses.
  3. The dependence of any designation on causes and conditions (dependent arising).
  4. Emptiness itself must be empty (no position is ultimately fixed, including the procedure's outcome).

  Elements that can be dropped:
  - Soteriological framing (liberation from suffering as the goal).
  - Karma and rebirth.
  - Monastic setting.

  We also need:
  - A closing move that prevents "both and neither" from becoming a new fixed answer.
  - An explicit prohibition against using the procedure to resolve disputes about observable facts (where evidence is contested but the disagreement is about interpretation of the facts, not the facts themselves).
  - A way to recognize and bail out when the disagreement is actually about observable facts.

  Structure of the Procedure:
  1. Introduction and framing.
  2. Step-by-step examination of the four corners.
  3. Reflection on dependent arising (causes and conditions).
  4. Final step: releasing all positions and focusing on practical steps.

  Handout: One page with the steps and prompts.

  Written Record: A template for recording the group's responses and the outcome.

  Three test cases:
  A. Supervised consumption site: "Makes the block more dangerous?"
  B. School merger: "Is the merged school still 'our school'?"
  C. Volunteer board: "Is the member's behavior welcoming or gatekeeping?"

  Epistemic honesty: We'll note where the procedure takes a stance on disputed interpretations of Madhyamaka.

  Potential distortion: We'll discuss whether this is a legitimate secular borrowing.

  ---

  **Procedure: The Four Corners Dialogue**

  **Pre-session Preparation:**
  - The facilitator must identify the deadlocked predicate (the loaded term). Example: "dangerous", "our school", "welcoming".
  - Ensure the disagreement is not about observable facts. If it is, the procedure is not applicable. (See below for how to recognize this.)

  **Materials:**
  - Whiteboard or large paper with four quadrants labeled: 
    Quadrant 1: True
    Quadrant 2: False
    Quadrant 3: Both
    Quadrant 4: Neither
  - Markers and sticky notes (for participants to write on).
  - Timer.

  **Participants:** 12-40 people. If over 20, split into small groups (4-6 people) for steps 2-4, then reconvene.

  **Time:** 2 hours.

  **Roles:**
  - Lead Facilitator: Guides the process, asks questions.
  - Co-facilitator: Helps with logistics, timekeeping, and note-taking. Can voice skepticism but must remain neutral.

  **Handout (one page):** 
  Title: **Four Corners Dialogue: Moving Beyond Deadlock**
  Steps:
  1. Frame the question.
  2. Explore: True.
  3. Explore: False.
  4. Explore: Both.
  5. Explore: Neither.
  6. Examine conditions: When does the term apply? When does it not?
  7. Release: What practical steps can we take without needing a fixed answer?

  ---

  **Step-by-Step Procedure:**

  **0. Introduction (5 minutes)**
  - Facilitator: "We're stuck on a word that means different things to different people. Today we'll try a structured way to look at it from four angles. Our goal isn't to agree on one answer but to see why we're stuck and find a way forward. We won't use any technical terms — just plain language."

  **1. Frame the Question (10 minutes)**
  - Write the deadlocked predicate as a yes/no question. Example: 
    - Case A: "Does the supervised consumption site make our block more dangerous?"
    - Case B: "Is the merged school still 'our school'?"
    - Case C: "Is the member's behavior welcoming or gatekeeping?"
  - Clarify: "We are not debating facts. We have the facts. We are stuck on what we call those facts. Let's focus on the word [dangerous/our school/welcoming]."
  - **Check for factual disputes:** If a participant says, "But the incident counts are wrong!", the facilitator must pause. Ask: "Are we disagreeing about what happened, or about what to call it?" If the group cannot set aside the factual dispute, halt the procedure. (See bail-out condition below.)
  - **Sufficient to move on:** The group accepts that the issue is about the interpretation of the term, not the underlying facts.

  **2. Quadrant 1: True (15 minutes)**
  - Facilitator: "Let's explore why someone might say 'yes, it is [true]'. What conditions make this label fit? Write one reason per sticky note and place it in Quadrant 1."
  - Small groups discuss and post notes. Then, full group shares.
  - **Sufficient to move on:** At least one reason is offered in each small group. If no one can articulate a reason for "true", note that and move on (but this is rare).

  **3. Quadrant 2: False (15 minutes)**
  - Same as above: "Why might someone say 'no, it is not [true]'? What conditions make the label not fit?"

  **4. Quadrant 3: Both (15 minutes)**
  - Facilitator: "Now, why might someone say it's both true and false at the same time? When does the label fit in some ways but not in others?"
  - Example: The block might be more dangerous in one way (e.g., loitering) but less in another (e.g., fewer overdoses in alleys).

  **5. Quadrant 4: Neither (15 minutes)**
  - Facilitator: "Why might someone say it's neither true nor false? When does the label not capture the situation at all? Are there better words?"
  - Example: "Dangerous" might be too simplistic; the reality is complex and can't be captured by a yes/no.

  **6. Examine Conditions (20 minutes)**
  - Facilitator: "Now, let's look at all four corners. We've seen that the label depends on context. What conditions must be present for the label to be useful? When does it break down?"
  - Guide the group to see dependent arising: The term only makes sense in relation to specific conditions and perspectives.
  - **Key question:** "If the situation changed in [X] way, would the label still hold?"
  - **Sufficient to move on:** The group identifies at least one condition that affects the applicability of the term.

  **7. Release and Practical Steps (20 minutes)**
  - **Crucial step to prevent reification:** 
    Facilitator: "We've seen that the label isn't fixed — it depends. Holding tightly to any one answer (even 'both' or 'neither') can cause problems. How can we let go of needing a single answer and focus on what we can do?"
  - Brainstorm practical actions that don't require agreement on the predicate. Examples:
    - Case A: Agree on metrics to monitor and steps to address concerns, regardless of whether it's called "dangerous".
    - Case B: Focus on what traditions to preserve and what new rituals to create in the merged school.
    - Case C: Develop guidelines for how members should interact with newcomers, without labeling the past behavior.
  - **Written record:** Document the actions, not the four corners debate. The outcome is the set of agreed actions and the recognition that the label is context-dependent.

  **Bail-out Condition:**
  - If at any point the discussion shifts to disputing observable facts (e.g., "Your incident data is wrong!"), the facilitator pauses and asks: "Can we set aside the facts for now and focus on what we call them?" If no, then: "This method isn't designed for factual disputes. We need to resolve the facts first." Halt the procedure and switch methods.

  **Final Note (5 minutes):**
  - Facilitator: "Today we saw that [predicate] isn't a fixed thing. It depends on our perspective and the conditions. By letting go of the need for one answer, we found practical steps. Remember, even 'it depends' isn't the final answer — it's a reminder to stay flexible."

  ---

  **Written Record Template:**
  - Question: [The framed question]
  - Quadrant 1 (True): [Summary of reasons]
  - Quadrant 2 (False): [Summary of reasons]
  - Quadrant 3 (Both): [Summary of reasons]
  - Quadrant 4 (Neither): [Summary of reasons]
  - Conditions: [What conditions affect the label?]
  - Outcome: [List of practical steps agreed upon. Note: The group does not agree on a single answer to the original question.]

  ---

  **Test Case Applications:**

  **Case A: Supervised Consumption Site — "Does it make the block more dangerous?"**
  - Step 1: The group agrees the facts (incident counts) are not in dispute — they just interpret them differently. Proceed.
  - Quadrant 1 (True): Reports of increased loitering, discarded needles.
  - Quadrant 2 (False): Fewer public overdoses, faster response to incidents.
  - Quadrant 3 (Both): More visible drug activity but fewer life-threatening situations.
  - Quadrant 4 (Neither): "Dangerous" is too vague; we need to talk about specific risks.
  - Conditions: Depends on time of day, type of incident, and what aspect of safety is considered.
  - Release: Agree to monthly safety walks and a joint committee to review incident data and address issues, without labeling the whole site.
  - **Outcome:** Practical steps without consensus on "dangerous".

  **Case B: School Merger — "Is the merged school still 'our school'?"**
  - Step 1: The group agrees this is about the emotional meaning of "our school", not facts about the merger.
  - Quadrant 1 (True): Same staff, same traditions.
  - Quadrant 2 (False): Different building, combined student bodies.
  - Quadrant 3 (Both): It's still "our school" in spirit but not physically.
  - Quadrant 4 (Neither): The question misses the point — it's a new school for a new era.
  - Conditions: "Our school" depends on shared history and identity; the merger changes some conditions but not others.
  - Release: Plan a reunion event for alumni of both schools and create new traditions for current students.
  - **Outcome:** Focus on actions that honor the past and build the new.

  **Case C: Volunteer Board — "Is the behavior welcoming or gatekeeping?"**
  - Step 1: The group agrees the facts (what the member did) are not disputed — the interpretation is.
  - Quadrant 1 (Welcoming): Newcomers get guided to suitable projects.
  - Quadrant 2 (Gatekeeping): The member steers people away from projects they want.
  - Quadrant 3 (Both): It can be welcoming if done with respect, but gatekeeping if done dismissively.
  - Quadrant 4 (Neither): The behavior is just "directive"; the labels are value judgments.
  - Conditions: Depends on the newcomer's perspective and how the guidance is given.
  - Release: Create a buddy system where multiple members welcome newcomers and options are presented neutrally.
  - **Outcome:** Policy change without labeling the past behavior.

  **Case Where Procedure Refuses:**
  - If in Case A, during Step 1, the group cannot agree that the incident counts are acceptable (one side insists the other's data is fabricated), the facilitator halts: "We cannot proceed until we agree on the facts. Let's set up a subcommittee to verify the data first."

  ---

  **Epistemic Honesty: Disputed Points in Madhyamaka**

  The procedure design quietly depends on the following interpretations (disputed among scholars):
  1. **No thesis of his own:** The procedure assumes Nāgārjuna does not advance a thesis (like "everything is empty") but uses reductio to dismantle others' theses. The procedure avoids asserting any position (including "emptiness") as true.
     - **Dependence:** The Release step explicitly avoids replacing the old position with a new one (like "both/neither").
  2. **Fourth corner as refusal:** The procedure treats the fourth corner (neither) as a rejection of the question's framing, not a positive assertion. This aligns with the "refusal of all positions" reading.
     - **Dependence:** Quadrant 4 is framed as "the label doesn't capture it", not a new answer.
  3. **Emptiness as a concept-relative claim:** The procedure treats emptiness as about the limitations of our concepts (the labels) rather than a metaphysical claim about reality.
     - **Dependence:** The Conditions step focuses on how the label depends on context (conventional designation).
  4. **No true contradictions:** The procedure does not treat "both" (Quadrant 3) as a true contradiction but as a recognition of multiple facets. This rejects dialetheism (true contradictions).
     - **Dependence:** Quadrant 3 is framed as "sometimes this, sometimes that" (complementary aspects) not simultaneous truth and falsity in the same respect.

  **Where You May Be Fooling Yourself:**
  - **Distortion vs. Secular Borrowing:** Reducing a soteriological practice to a facilitation technique is a distortion of the original purpose (liberation from suffering). However, it is a legitimate secular borrowing if:
    - The core insight (avoiding fixed views to reduce conflict) is preserved.
    - It is used as a skillful means (upaya) for a specific context (conflict resolution).
  - **Unsettled Question:** Whether this is a distortion is itself a matter of perspective. Traditionalists may see it as a misuse; modern pragmatists as an adaptation. Since you are not claiming it is Buddhism but a tool inspired by it, and you are using it to reduce suffering (of group conflict), it can be seen as a valid application. But it does not (and cannot) deliver the soteriological goal of awakening.

  **Recommendation:** Be transparent that this is an adaptation for a specific context and not a spiritual practice.

  ---

  **Final Note for You:** 
  The procedure works best when the group is stuck on a label, not facts. It may feel unsatisfying to those who want a definitive answer, but it trades that for actionable steps. It is not a parlor trick if it gets groups moving — but the co-facilitator's skepticism is healthy. Run a pilot session on a low-stakes issue first.
answer: |-
  ### **The Four Corners Procedure for Group Deadlock**  
  *Adapted from Madhyamaka insights, simplified for public facilitation. No technical terms used.*  

  ---

  #### **Pre-Session Setup**  
  - **Time:** 120 minutes total.  
  - **Participants:** 12–40 people, seated in a circle or U-shape.  
  - **Materials:**  
    - Whiteboard with 4 quadrants labeled:  
      - **1:** True  
      - **2:** False  
      - **3:** Both True and False  
      - **4:** Neither True nor False  
    - Sticky notes and markers.  
    - Timer.  
  - **Roles:**  
    - **Lead Facilitator:** Guides the process. Stick strictly to the script.  
    - **Co-Facilitator:** Takes notes, manages time, and voices skepticism *only* during breaks (e.g., "I’m not sure this is working—let’s watch for deflection").  
  - **Handout (1 page):** [See Appendix A].  

  ---

  ### **Step-by-Step Procedure**  
  *Total time: 115 minutes. Halt early if bail-out conditions are met.*  

  #### **Step 0: Frame the Question (5 min)**  
  - **Facilitator Prompt:**  
    > "We’re stuck on a word that means different things to different people. Let’s frame it as a yes/no question: **[Insert loaded predicate here]**. For example:  
    > - *Case A:* ‘Does the supervised drug site make our block more dangerous?’  
    > - *Case B:* ‘Is the merged school still "our school"?’  
    > - *Case C:* ‘Is steering newcomers welcoming or gatekeeping?’  
    >   
    > **Rule:** We are **not** debating facts. We’re debating what to *call* the facts. If we start arguing about what happened (e.g., incident counts, what someone said), we stop. Ready?"  
  - **Moves:**  
    - Participants accept the question → Proceed.  
    - Participants insist on debating facts → **Halt immediately.** Bail-out condition met.  
  - **Judgment Call:** Is the conflict about *interpretation* (e.g., "What does ‘dangerous’ mean?") or *facts* (e.g., "Your crime stats are wrong!")? If facts, bail out.  

  #### **Step 1: Quadrant 1 — True (20 min)**  
  - **Facilitator Prompt:**  
    > "Why might someone say ‘yes, it’s **true**’? Focus on:  
    > - What conditions make it feel true?  
    > - What would have to change for it to stop being true?  
    > Write one reason per sticky note."  
  - **Moves:**  
    - Participants post notes in Quadrant 1 → Proceed.  
    - No engagement → Ask: "What’s the strongest case for ‘true’?" If still silent, note it and move on.  
  - **Sufficient Answer:** At least 3 distinct reasons posted.  

  #### **Step 2: Quadrant 2 — False (20 min)**  
  - **Facilitator Prompt:**  
    > "Now, why might someone say ‘no, it’s **false**’? Same rules:  
    > - What conditions make it false?  
    > - What would make it become true?"  
  - **Moves:** Same as Step 1.  

  #### **Step 3: Quadrant 3 — Both (20 min)**  
  - **Facilitator Prompt:**  
    > "Could it be **both true and false**? For example:  
    > - *Case A:* More dangerous for some, less for others.  
    > - *Case B:* ‘Our school’ in spirit but not in location.  
    > - *Case C:* Welcoming to some, gatekeeping to others.  
    >   
    > When does it depend on perspective or context?"  
  - **Moves:**  
    - Participants identify specific contexts → Proceed.  
    - Claims of "always both" → Challenge: "Give an example where it *isn’t* both."  
  - **Sufficient Answer:** At least 2 contextual examples.  

  #### **Step 4: Quadrant 4 — Neither (20 min)**  
  - **Facilitator Prompt:**  
    > "Could it be **neither true nor false**? For example:  
    > - The word itself doesn’t fit (*‘dangerous’ is too simplistic*).  
    > - The situation is changing (*the new school is still forming*).  
    >   
    > When does the question itself break down?"  
  - **Moves:**  
    - Participants critique the predicate (e.g., "‘Gatekeeping’ isn’t the right word") → Proceed.  
    - Participants assert "It’s just neither!" → Challenge: "What makes you reach for ‘neither’ instead of another answer?"  
  - **Sufficient Answer:** Recognition that the label is inadequate.  

  #### **Step 5: Examine Dependence (20 min)**  
  - **Facilitator Prompt:**  
    > "Look at all four corners. What do they have in common?  
    > - **Key Insight:** Each answer depends on specific conditions.  
    > - Ask: ‘If [condition] changed, would the label still hold?’  
    > - Example: *If police patrols increased, would ‘dangerous’ still fit?*"  
  - **Moves:**  
    - Participants name conditions (e.g., time, perspective, history) → Proceed.  
    - Participants insist one corner is "just true" → **Halt.** Group is reifying a position.  
  - **Non-Negotiable:** Must identify at least 2 conditions.  

  #### **Step 6: Release the Label (10 min)**  
  - **Facilitator Prompt:**  
    > "Since all answers depend on conditions, clinging to one causes deadlock. How do we **release the need for a single answer**? Brainstorm actions that don’t require agreement on the word. Examples:  
    > - *Case A:* Co-design a safety survey instead of arguing ‘dangerous’.  
    > - *Case B:* Create new traditions instead of debating ‘our school’.  
    > - *Case C:* Draft newcomer guidelines instead of labeling behavior.  
    >   
    > **Rule:** No using ‘both/neither’ as the new answer. What can we *do*?"  
  - **Moves:**  
    - Group proposes concrete actions → Success. Document actions.  
    - Group reverts to debate → Facilitator declares: "We’ve hit time. Actions are tabled for [date]."  

  #### **Final Note (1 min)**  
  > "Today we saw that **[predicate]** isn’t fixed—it depends. Even ‘it depends’ isn’t the final word. We’re free to act without one answer."  

  ---

  ### **Bail-Out Conditions**  
  1. **Factual Disagreement:** Participants argue evidence (e.g., "Your incident data is wrong!").  
     - *Recognition:* Look for claims of "false facts," demands for new data, or appeals to "truth."  
     - *Response:* "We’re stuck on facts, not the label. This method won’t help. Let’s pause."  
  2. **Reification of a Corner:** Group latches onto "both/neither" as the new fixed answer (e.g., "So it’s *always* both!").  
     - *Response:* "Is ‘both’ now the only answer? If so, we’ve missed the point. We stop here."  

  ---

  ### **Test Cases**  
  #### **Case A: Supervised Drug Site & "Dangerous"**  
  - **Step 0:** Question = "Does the site make the block more dangerous?"  
  - **Bail-Out?** No—both sides agree on incidents but interpret "dangerous" differently.  
  - **Outcome:**  
    - *Both:* More visible drug activity (true for residents) + fewer overdoses (false for health workers).  
    - *Neither:* "Dangerous" ignores root causes (e.g., poverty).  
    - **Release:** Joint committee to define "safety metrics" without using "dangerous."  
  - **Why it works:** Conflict is about the *label*, not facts.  

  #### **Case B: Merged School & "Our School"**  
  - **Step 0:** Question = "Is the merged school still ‘our school’?"  
  - **Bail-Out?** No—disagreement is emotional, not factual.  
  - **Outcome:**  
    - *True:* Same teachers, same values.  
    - *False:* New building, new student mix.  
    - *Neither:* "Our school" is a nostalgic label—the school has changed.  
    - **Release:** Alumni and parents co-create a "heritage wall" + new rituals.  
  - **Why it works:** Focuses on attachment to the label.  

  #### **Case C: Member Behavior & "Welcoming or Gatekeeping"**  
  - **Step 0:** Question = "Is the behavior welcoming or gatekeeping?"  
  - **Bail-Out?** **Yes, if** participants dispute what the member *actually said/did*.  
    - *Real example:* "She *never* said that!" → Stop. Use fact-based mediation instead.  
  - **If bailed:** "This is about what happened. Let’s use a different method."  

  ---

  ### **What Must Survive from Madhyamaka**  
  1. **Negating all four corners ≠ asserting the fourth.**  
     - The fourth corner ("neither") is a *rejection of the question*, not a new truth.  
  2. **Arguments as reductios.**  
     - Each corner is dismantled by showing its dependence, not replaced.  
  3. **Dependent arising.**  
     - Labels only make sense in context (e.g., "dangerous" depends on time/place).  
  4. **Emptiness is empty.**  
     - Even "it depends" isn’t absolute. The closing move blocks reification.  

  ### **What Can Be Dropped**  
  - Soteriological goal (liberation), karma/rebirth, monastic framing.  

  ---

  ### **Epistemic Honesty**  
  #### **Disputed Points in Madhyamaka Scholarship**  
  1. **Nāgārjuna’s thesis?**  
     - *Dispute:* Does he have a position (e.g., "all is empty") or only refute others?  
     - *Our dependence:* We assume no thesis (only reductio). If he *has* a thesis, we distort him.  
  2. **Fourth corner as refusal vs. position?**  
     - *Dispute:* Is "neither" a metaphysical stance?  
     - *Our dependence:* We treat it as refusal. If it’s a position, our Release step fails.  
  3. **Emptiness: Metaphysical or conceptual?**  
     - *Dispute:* Is emptiness about reality or our concepts?  
     - *Our dependence:* We use it conceptually (labels depend on conditions).  
  4. **True contradictions?**  
     - *Dispute:* Does the tetralemma allow A and not-A simultaneously?  
     - *Our dependence:* We reject dialetheism. "Both" means *different aspects*, not logical contradiction.  

  #### **Are You Fooling Yourself?**  
  - **It’s a distortion** if you claim this is "Buddhism" or aims at liberation.  
  - **It’s a legitimate secular borrowing** if:  
    - You use the *method* (not the doctrine) to reduce attachment to views.  
    - You acknowledge the goal is conflict resolution, not awakening.  
  - **Nobody can settle this:** Scholars debate secularizing Buddhist tools. Your use is ethical if it:  
    1. Reduces suffering (e.g., group tension).  
    2. Avoids misrepresentation.  
    3. Leaves soteriology out.  

  **Recommendation:** Call it a "conflict resolution tool inspired by ancient dialectics," not "Buddhism."  

  ---  
  **Appendix A: One-Page Handout**  
  [Link to handout template](https://example.com/four-corners-handout)  
  *Simplified for public use. No Sanskrit/Pali.*  

  **Written Record Template:**  
  ```markdown
  # Four Corners Session: [Date]  
  Question: [Loaded predicate]  
  Quadrant 1 (True): [Summary of reasons]  
  Quadrant 2 (False): [Summary of reasons]  
  Quadrant 3 (Both): [Summary of reasons]  
  Quadrant 4 (Neither): [Summary of reasons]  
  Key Insight: The label depends on [conditions].  
  Outcome: [Actions agreed upon]. No consensus on the label.  
  ```  
  ---  
  **Final Note:** This works if conflict is about *language*, not facts. If your group hates it, blame the co-facilitator’s skepticism—not Nāgārjuna.
