  2) The stability of moral judgment over time 
  3) Whether outcomes genuinely constitute blameworthiness or merely trigger practical responses

  The dialogue parameters are tightly constrained: two philosophers (Nadia outcome-sensitive, Tomas control-centric) analyzing an inquiry report pre-hearing. Must include: 
  - Real rebuttals (no strawmen) 
