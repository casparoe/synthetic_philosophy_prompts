  Hmm... the user clearly knows this terrain well - they're rejecting standard cases for being structurally misleading and have designed their own sophisticated alternative. Their frustration with superficial treatments shows they want students to grapple with deeper tensions in moral luck theory. The three specified features suggest they particularly want to challenge: 
