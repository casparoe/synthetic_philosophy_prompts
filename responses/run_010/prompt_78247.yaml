  For the meta-moment, perhaps have Tomas accuse Nadia of equivocating "blameworthiness" with "regretworthiness," leading to discussion about whether moral language tracks internal states or external impacts. The precisification could come when Nadia's initial broad outcome-dependence claim gets pressured into distinguishing between outcome-as-moral-constitutive versus outcome-as-evidential.

  *checks wordcount* 1100-1400 words means about 7-9 substantive exchanges. Structure sketch: 
