  ## Farewell Assembly Speech

  *(Standing at the podium, looking out at the assembled students, parents, and colleagues. Warm, calm, slightly nostalgic tone.)*

  Good morning everyone. Parents, thank you so much for coming – I know journeys were made and schedules rearranged. Colleagues, it’s always a strange feeling standing up here together at the end. And Year Eleven… well, here we are. After nineteen years in these halls, this is my last assembly. And as is tradition, we mark the leavers. But this year, we’re doing it a little differently.

  You’ve likely heard: we’re not naming a Valedictorian or Salutatorian this year. Instead, you students nominated and voted for awards in a whole range of categories – things like ‘Most Creative Problem Solver’, ‘Best Team Player in the Lab’, ‘Most Relentlessly Curious’, and ‘Kindest Voice in the Common Room’. And later, we’ll hear a sentence about *every single one* of you leavers, capturing something unique about your time here. It was a close decision by the staff, and I know feelings are mixed. Some of you might be relieved. Others, perhaps disappointed. Parents, I’ve read your thoughtful letters, and I understand the concerns – the worry that we might be diminishing something important.

  So, let me explain why I believe this change is right, *for us, right now*. It’s not because I think competition is bad, or that striving for excellence isn’t vital. Physics teaches us that striving against resistance is how things move forward! And it’s definitely not because I think everyone is exactly the same, or that recognising achievement is wrong. Quite the opposite.

  The truth is, over nineteen years, I’ve watched the pressure of that single, ultimate ranking affect students in ways that go far beyond healthy competition. I’ve seen bright sparks in the middle of the pack, capable of truly wonderful things, become utterly consumed by where they sat on a list, sometimes to the point where the joy of learning a tricky concept or building something new just… evaporated. The anxiety wasn’t just about doing well; it was about *not being top*. I’ve seen students opt out of challenging paths – paths they were passionate about, paths they could have excelled in – because they calculated they couldn’t reach that very peak. One brilliant young man, years back, dropped out of Physics entirely in Year Eleven. His reason? He knew he couldn’t be number one, so he felt it wasn’t worth the effort. We lost his potential contribution, and he lost a subject he loved. That stays with you.

  This ranking, intended to honour the highest, cast a very long shadow. For many, it didn’t just reflect effort; it started to define worth. And when that happens, the cost of that single recognition – for the vast majority working incredibly hard just below – becomes real. It chips away at confidence, it fuels unhealthy stress, and it can sometimes obscure the incredible variety of strengths and contributions that make this year group, or any community, truly strong.

  This new approach? It isn't about taking something away without giving something back. It’s about shifting the focus. It’s about creating *more* opportunities for *more* kinds of excellence and contribution to be seen and celebrated. It’s about making sure that the quiet dedication, the creative spark, the supportive friend, the resilient problem-solver – qualities just as valuable as pure academic rank – get their moment in the sun too. The nominations came from *you*, the students. You know what matters in the daily life of your year group. You see the strengths your peers bring that a transcript might miss. Hearing something positive said about *every single leaver*? That builds something different. It says: you belonged here, you contributed, you mattered in your own way.

  Now, let me be absolutely clear: this change only makes sense if it actually makes things better for people. If all we did was remove a source of pride and motivation for some without offering anything meaningful in return, without easing burdens elsewhere, then we would have made a mistake. It would simply be a loss. But I believe, firmly, that the recognition we *are* offering – broader, more diverse, acknowledging the contributions of the many – outweighs what we’ve set aside. It lifts more people up. It recognises a fuller picture of what makes a student, and a person, valuable. For those who would have been at the very top under the old system, yes, you lose a specific honour. That *is* a real loss of a distinctive recognition you earned. I don’t minimise that. But I hope you also see the value in celebrating the wider tapestry of achievement around you, and perhaps feel a different kind of pride in a community that recognises more facets of success.

  Ultimately, this isn’t about principles for principles' sake. It’s about people. It’s about trying to create an environment where more students feel seen, valued, and motivated to engage fully – especially those who might otherwise feel overshadowed or discouraged. It’s about nurturing *all* the potential in this room. That, to me, is the real excellence we should aim for.

  So, Year Eleven, as you leave these gates, take this spirit with you. Strive, absolutely. Chase your peaks. But remember the power of recognising the strengths in others, especially the quiet ones, the persistent ones, the ones whose contributions are different but no less vital. Build communities that lift each other up. It’s been the greatest privilege to be your physics teacher. Thank you, and all the very best for your brilliant futures. Let's celebrate *all* of our leavers.

  **Closest call:** \answer{C} The speech strongly argues the *net* benefit outweighs the loss and contextualizes the top students' loss within a wider gain, but explicitly acknowledges it *is* a real loss ("yes, you lose a specific honour... That *is* a real loss"), avoiding the assertion that it wasn't worth having or that they weren't made worse off.
