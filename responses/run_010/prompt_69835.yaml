answer: |-
  ## The Ghost in the Machine or the Map in the Maze? On the Literal Standing of Representations in Machine Learning

  The allure of interpretability research lies in its promise: to crack open the "black box" of deep neural networks and reveal the meaningful structures within. We speak confidently of neurons "representing" edges, layers "computing" attention weights, or activation directions "encoding" semantic concepts like "democracy" or "causation." Yet, this very confidence masks a deep and unresolved philosophical fissure: when we say a network *represents* P, are we making a literal claim about its internal causal structure and history, or are we merely adopting a useful psychological shorthand for describing predictive patterns? This controversy is often prematurely settled—dismissed as semantic quibbling or resolved by appeal to scientific practice—before the profound implications of the underlying metaphysical questions are fully engaged. The stakes are high: if representational talk is literal, interpretability reveals the *actual cognitive architecture* of artificial systems. If instrumental, it provides only heuristic maps, fictions useful for prediction but devoid of ontological commitment. The resolution hinges not on linguistic convention, but on prior philosophical accounts of *what it takes* for a physical state to bear content. By examining three prominent theories—indicator semantics, teleosemantics, and interpretationism—against two stylized interpretability findings, we discover that the controversy is substantive, that current practice may systematically misidentify genuine representations, and that the literal standing of representational talk depends critically on satisfying specific, empirically testable conditions largely overlooked today.

  **The Contenders: Theories of Content Grounding**

  To adjudicate whether a state *d* or subspace *S* literally represents P, we need criteria. What makes a physical state *about* something else?

  1.  **Indicator Semantics (Covariation):** A state M represents P if M reliably covaries with (tracks, indicates) the presence or state of P across a specified range of conditions. The content is fixed by the reliable causal-informational link. Fire detectors represent fire because their activation reliably correlates with combustion under normal operating conditions. Crucially, the covariation must hold across relevant counterfactuals: the detector *wouldn't* activate without fire, and *would* activate if fire were present (within its operational domain). The account is resolutely presentist and causal-correlational; history and function are secondary.

  2.  **Teleosemantics (Selectionist Function):** A state M represents P if M has the *function* of indicating P, and this function was fixed by a history of selection. The content is fixed by what the state was *selected for* doing. A frog’s bug-detecting neurons represent *flies* (not small, dark, moving things) because they were selected by evolution for their role in fly-catching, even if they fire at pebbles in abnormal contexts. Function, defined by selection history, is primary. This raises critical questions for ML: Does training via SGD on a specific dataset under a loss function constitute a "selecting environment"? Is the selected function specific enough to yield a determinate content (P) rather than a disjunction (P or Q or R...)? Does the loss function select for *tracking P* or merely for *predicting loss-reducing outputs*, potentially allowing for gerrymandered correlates?

  3.  **Interpretationism (Deflationism):** Representation is not primarily a property of internal states *in themselves*, but a property ascribed *to the whole system* by an interpreter to predict and explain its behavior. An internal state M derivatively "represents" P only insofar as attributing that content to it is useful within the best overall interpretative theory of the system's behavior. Content is inherently perspectival, tied to the pragmatic goals of the interpreter. Asking whether M *really, intrinsically* represents P is a category mistake; the only meaningful question is whether the representational *ascription* is predictively and explanatorily fruitful.

  These theories offer fundamentally different answers to the core question: What confers *aboutness*? Is it current reliable correlation (Indicator), historical selection for a function (Teleosemantics), or pragmatic utility within an interpretation (Interpretationism)?

  **Adjudicating the Stylized Findings**

  Applying these theories to our two stylized findings about property P reveals stark divergences and challenges for current interpretability practice.

  *   **Finding 1: The Decodable Epiphenomenon (d)**
      *   **Indicator Semantics:** *Likely Yes.* Direction *d* reliably covaries with P across seeds, scales, and retrainings. This high-fidelity correlation across variations suggests a robust informational link. The fact that interventions on *d* only affect behavior within a narrow band and P-competence can be routed around weakens the counterfactual robustness slightly (it *doesn't* always affect P-behavior), but within the "specified range of conditions" (inputs where the correlation holds), the covariation is strong. Proponents might argue the "specified range" excludes inputs where routing occurs. *d* qualifies as representing P.
      *   **Teleosemantics:** *Likely No.* The key question is: Was *d* *selected for* indicating P? The ease with which the network routes around *d* without impairing P-competence strongly suggests *d* was not *necessary* for performing the function selected by training (achieving low loss on P-related tasks). It was merely a reliable correlate that emerged during training but played no essential causal role in fulfilling the network's selected function. It is an evolutionary spandrel, not an adaptation. Training selected for *some mechanism* achieving P-competence, but not specifically for *d*. Therefore, *d* lacks the proper function of indicating P.
      *   **Interpretationism:** *Instrumentally Yes, Intrinsically No.* Attributing the content "P" to *d* is highly useful for *decoding* the network's state and predicting its outputs regarding P in many contexts. It is a powerful instrumental tool. However, this says nothing about *d*'s intrinsic nature; it is a useful fiction within this specific interpretative context (decoding). The routability shows the content attribution isn't fundamental to explaining the system's overall P-competence.

  *   **Finding 2: The Causal Nexus (S)**
      *   **Indicator Semantics:** *Likely No.* By stipulation, S resists decoding. No simple readout yields anything interpretable, meaning we cannot reliably map states within S to identifiable features P (or anything else interpretable) in the input or output. While interventions *on* S affect P-behavior, we lack a clear correlational map *from S to P*. The systematic, compositional effects *suggest* S contains information about P, but the lack of decodability means the reliable covariation necessary for indicator content isn't demonstrably present. S might be implementing complex, opaque computations *using* information about P, rather than *representing* P directly.
      *   **Teleosemantics:** *Strong Candidate for Yes.* The critical evidence is the systematic, targeted, and *compositionally generalizing* effects of interventions on S. This suggests S plays a central *causal-functional role* in the network's ability to handle P. Its role is not merely correlational but computational. Crucially, the compositional generalization to novel circumstances absent from training strongly implies that S is not merely memorizing associations but implementing a structured process *about* P. This structured causal role, demonstrably important for the network's P-competence, is precisely what the training process (SGD + loss function) *selected for*. The inability to decode S easily doesn't negate its functional role; complex, distributed, or dynamically computed representations can be causally potent without being linearly decodable. S appears to be a mechanism fulfilling the function of enabling flexible, compositional P-related behavior, fixed by selection history.
      *   **Interpretationism:** *Instrumentally Yes (perhaps later), Intrinsically No.* Currently, attributing a specific content "P" to S is *not* useful because it resists decoding – we cannot use the attribution to predict the system's state or fine-grained outputs. However, the intervention results make attributing *some kind of P-related computational role* to S potentially useful for explaining *why* interventions have the effects they do and predicting intervention outcomes. A good interpretative theory might posit S as a "P-composition-engine" without specifying a simple content mapping. The content ascription is derivative of the functional role within the overall interpretation.

  **The Clash with Practice and the Lingering Substance**

  This analysis reveals a profound tension. Current interpretability research canonizes findings like Case 1 (linear probes, stable decodable directions) as paradigm examples of "finding a representation." Finding 2, however, often falls into a methodological blind spot – it's harder to find, lacks a clear "readout," and thus receives less attention or is framed in computational rather than representational terms (e.g., "key computational subspace"). Yet, according to teleosemantics – arguably the theory offering the most robust account of genuine *aboutness* grounded in function – Case 2 is the *stronger* candidate for literal representation. Case 1, despite its decodability, is dismissed as an epiphenomenal shadow. Indicator semantics validates Case 1 but struggles with Case 2. Interpretationism treats both instrumentally but denies intrinsic content to either.

  This divergence is not merely verbal. The theories make different empirical commitments:

  1.  **The Necessity of History (Teleosemantics vs. Others):** Teleosemantics insists that historical selection is *constitutive* of content. For it, no finding about the *current* state of a network alone (correlations, interventions) can definitively establish representational content without evidence that the state was *selected for* its correlational or causal role. Indicator semantics and interpretationism are synchronic, requiring only current properties (correlations or predictive utility).
  2.  **The Primacy of Causal Role vs. Correlation (Teleosemantics/Interpretationism vs. Indicator):** Teleosemantics and (to a lesser extent) interpretationism prioritize the state's *causal-functional role* within the system's overall competence. A mere reliable correlate (Case 1) is insufficient for genuine representation under teleosemantics; it must play a functional part. Indicator semantics prioritizes the correlational link itself.
  3.  **The Reality of Content (All vs. Interpretationism):** Indicator semantics and teleosemantics are realist: content is an objective property of the physical state (fixed by correlation+conditions or selection history+function). Interpretationism is anti-realist: content is a useful fiction projected by interpreters.

  If researchers agree on all probe accuracies, patching results, and steering outcomes, the dispute *reduces* to whether historical selection is necessary (Teleosemantics) and whether content is objective or perspectival (Interpretationism vs. Realism). This *is* substantive. It concerns the metaphysical grounds of intentionality itself. What would settle it?
  *   **For Teleosemantics:** Evidence that SGD training robustly selects for *specific representational structures* fulfilling determinate functions (e.g., showing that variations in training that preserve loss minimization nevertheless lead to *different* internal structures implementing the *same* representational content via different means is problematic; showing that interventions disrupting a structure always damage the specific function *and* that the structure's form is best explained by selection for that function is supportive).
  *   **For Indicator Semantics:** Demonstrating the robustness of correlations across the widest possible relevant counterfactuals (including adversarial examples, distribution shifts, internal interventions).
  *   **For Interpretationism:** Showing that representational attributions are fundamentally unstable or context-dependent, or that equally predictive interpretations invoking non-representational computational descriptions are always possible.

  Current interpretability methods, focused heavily on synchronic correlations (probes) and localized interventions, are poorly equipped to address the historical demands of teleosemantics. They also often conflate decodability with representational reality, potentially mistaking shadows (Case 1) for the substance (Case 2).

  **Verdict: Conditional Literalism and the Prevalence of Fiction**

  Is representational talk literally true? The answer is conditional, and the conditions are stringent:

  **Representational talk about a specific internal state M having content P is literally true only if M plays a causal-functional role in the system's competence regarding P *and* this role was specifically selected for by the training process (or relevant design history) as a means of fulfilling the system's overall function (e.g., loss minimization).** This is the teleosemantic criterion.

  Applying this to current practice:
  1.  **Case 1 (d):** Not Literal. Lacks the essential selected functional role. It's an epiphenomenal correlate.
  2.  **Case 2 (S):** *Potentially* Literal. Shows strong evidence of causal-functional role. Whether it's *literally* a representation of P depends on demonstrating that its *specific* structure and role were selected *for* handling P (rather than being one possible implementation of a more general function, or emerging as a byproduct). Current causal intervention methods suggest functional importance but cannot directly confirm the selection history aspect.
  3.  **General State of Affairs:** Most currently identified "representations" (linear decodable directions, concept neurons) likely fall into the Case 1 category: robust correlates, often epiphenomenal or easily routed around. They are *instrumentally* useful fictions for decoding and prediction but lack the historical-functional grounding required for literal representation. Genuine Case 2 structures likely exist but are harder to find and validate. Crucially, **current interpretability methods generally lack the tools to rigorously establish the selection history required to confirm literal representational content.** They operate primarily in the synchronic, correlational, and interventional space, which is necessary but insufficient under the teleosemantic view.

  Therefore, **representational talk in current interpretability research is predominantly a systematic fiction with significant predictive and instrumental value, occasionally stumbling upon states that *might* qualify as literal representations under teleosemantics, but without the methodological means to confirm it.** The fiction is valuable – it drives discovery, enables steering, and provides comprehensible narratives. But we should be cautious about its ontological commitments.

  **Strongest Objection and Reply**

  **Objection:** "You've rigged the game with teleosemantics! Training *is* a selection process (SGD). The loss function *is* the environment. The network's parameters are selected precisely for minimizing loss, which involves accurately tracking features like P. Therefore, any state that robustly correlates with P *was* selected for that role by SGD. Finding 1 *does* meet the teleosemantic criterion – it was selected *because* it correlates with P and that correlation helped minimize loss. Finding 2 might be selected for its computational role *involving* P, but that's just a more complex representation. Your distinction collapses; decodable correlates *are* selected functions."

  **Reply:** This objection conflates selection *of* a mechanism with selection *for* a property. SGD selects parameters that minimize loss. A state M correlating with P might be present *because* that correlation contributes to loss minimization. However, crucially:
  1.  **Gerrymandering:** The selected function is "minimize loss," *not* "represent P." M might correlate with P, but it might also correlate (or be functionally equivalent to) a vast, disjunctive, gerrymandered property Q that just happens to correlate with P *on the training distribution*. SGD selects for whatever works to minimize loss, which may not require forming a *determinate* representation of P, only an effective proxy. Teleosemantics struggles with the indeterminacy of function in such cases.
  2.  **Redundancy & Epiphenomena:** Finding 1 shows M is *not necessary* for P-competence; the network functions fine without it or routes around it. This strongly suggests SGD did *not* select M *for* the function of representing P *specifically*; it selected the *overall network* for loss minimization, and M was a byproduct or one redundant pathway among many. Selection *for* a function typically implies the structure is *adapted* – it plays a necessary or highly efficient role in fulfilling that function. Epiphenomenal correlates fail this test.
  3.  **Specificity of Content:** Even if M was selected because it correlates with P, does it represent *P* or *the property that correlates with P on the training data*? The latter may be gerrymandered. Teleosemantics requires that the function is specific enough to fix a determinate content, which SGD's global loss minimization may not guarantee. Finding 2, with its compositional generalization, provides much stronger evidence for a structured, content-specific functional role selected for handling P-like structures.

  SGD selects for loss minimization, not for forming clean, human-intelligible, determinate representations. While some structures may acquire genuine representational content under teleosemantics (especially those showing robust causal-functional roles and compositional generalization, like Case 2), the decodable correlates celebrated in current practice (Case 1) are far more likely to be instrumental shadows than literal representations selected *for* their content. The controversy remains vital, forcing us to ask not just *what* we can decode or intervene on, but *why* the structure is there and *what precise function* its presence was selected to serve. Only then can we move beyond useful fictions towards a genuine understanding of machine minds.
