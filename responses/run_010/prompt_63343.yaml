prompt: |-
  I'm a second-year law student volunteering at a clinic on the side, and I'm also sitting in on a seminar about autonomy in private law mostly because it fit my schedule. Last week we covered how the criminal law handles consent to sex when the complainant was deceived, and I've been chewing on it ever since, partly because my roommate is a philosophy PhD student and he kept insisting the doctrine was "just confused," which felt too easy. Here's the pattern as I understand it. If someone lies about the nature of the act itself — the classic hypothetical being a person posing as a doctor who persuades a patient that intercourse is a medical treatment — or if someone impersonates the complainant's spouse or regular partner, the consent is treated as no consent at all. But a whole pile of other lies, ones that plainly drove the decision, don't touch it: lying about being wealthy, about being single, about your intentions or your feelings, about promising to marry. An appellate court not long ago quashed a conviction where the only deception was a false claim to have had a vasectomy. And yet in other places, deception about a condom has been treated as capable of vitiating consent, and the categories seem to wobble around.

  The thing that's bothering me is that the same legal system takes almost the opposite attitude in contract. If you misrepresent something material to get me to sign a lease I completely understand I'm signing, I can get out of it — fraudulent inducement is a real defense, and it doesn't matter that I knew exactly what document was in front of me. So structurally identical cases get opposite treatment: I know what act I'm performing, but I'm wrong about a fact that made me want to perform it, and in one domain that destroys my consent while in the other it doesn't. What theory of consent does the criminal law pattern actually presuppose? Is the idea that consent attaches to an act under a description, and only some descriptions are the operative ones — in which case what principle picks them out, and how does the doctrine avoid the obvious problem that any act can be redescribed indefinitely (sex with a married man, sex with someone who won't call back, sex with someone who finds me less attractive than he said)? Or is it not about consent at all, but about bodily harm and risk, with the consent language functioning as a veneer — in which case the stopping points line up suspiciously well with pregnancy, infection, and physical identity, and I'd want to know whether that's a coincidence or a tell. There's also a third candidate I can't fit anywhere: the condom cases look like they're treating consent as a package of conditions the complainant gets to set, which is a different structure again, and it seems to sit uneasily beside the fertility ruling.

  What I'm after is a reconstruction of the implicit theory rather than a tour of the labels, so please don't just restate fraud in the factum versus fraud in the inducement and stop there — I want to know what view of consent, or of what the state is protecting, makes that distinction look principled instead of arbitrary. Then separate out what the practice strictly requires from what merely fits it comfortably, and be explicit about where the doctrine is philosophically underdetermined, i.e. where two or three quite different theories would license exactly the same outcomes, because my roommate's "it's just confused" charge only bites if there's no such overlap. Tell me whether contract and sex law can be brought into consistency without abandoning one of them, and if so which concession you'd make and what it costs. Finally, get concrete about what would change in the courtroom under two rival views — one on which any deception about anything that figured in the complainant's actual decision invalidates consent, and one on which deception only matters when it produces harm in the relevant sense. I mean things like jury instructions, what has to be proved and in what order, whether the defendant's beliefs about what the complainant cared about become legally relevant, and whether the complainant ends up testifying about her own motives. No citations or case names or reading lists please — I can dig that up myself, and I mostly want the reasoning laid out so I could explain it to someone with no legal training. A couple of the sub-questions above are probably more than you can do justice to, so prioritise whichever ones you think carry the most weight, but say which ones you're dropping and why.
reasoning: |-
  Okay, this is a deep and tangled legal-philosophical knot the user's presenting. Let me unpack it layer by layer. 

  First, the core tension: criminal law treats sexual consent as void only for certain types of deception (nature of act/identity), while contract law voids agreements for any material misrepresentation. The user isn't just asking for doctrine - they want the hidden theoretical machinery making this distinction coherent. And they're rightly suspicious of surface-level answers.

  Hmm... their frustration with "fraud in factum vs inducement" labels suggests they've already hit the doctrinal wall. What they're really hunting for is: what vision of human autonomy makes this two-track system defensible? And can it hold up under philosophical scrutiny?

  The pregnancy/infection angle is sharp - the exceptions (condom/STD cases) do suspiciously align with physical harm risks. But is that the driver or a side effect? And that third puzzle about conditional consent in condom cases... that really does stick out awkwardly.

  I should avoid three traps: 1) reciting doctrine they already know, 2) getting lost in edge cases, and 3) pretending there's perfect coherence where there isn't. Their roommate's "it's confused" jab needs addressing head-on - by showing where multiple theories converge on outcomes.

  For structure... maybe start by reconstructing criminal law's implicit theory of sexual autonomy as bodily boundary integrity. Contrast with contract's transactional reliance model. Then expose the fault lines: the fertility ruling versus condom cases, the "package of conditions" problem. 

  Crucially, map what changes under rival theories: if courts switched to contract-like rules for sex, complainants would have to testify about intimate decision-making - a privacy nightmare. Whereas a harm-based test might let dangerous deceivers off the hook. That makes current doctrine look less arbitrary.

  Must emphasize where philosophy runs out: no theory perfectly justifies every exception. The vasectomy/condom split? That's where theories underdetermine outcomes - exactly the overlap zone that defeats the "just confused" claim.

  Final note to self: no citations! They want transferable reasoning. Concrete courtroom examples will anchor this - like how jury instructions would differ under alternative frameworks.
answer: |-
  Here's a reconstruction of the implicit theory in criminal law's approach to sexual consent and deception, contrasted with contract law, addressing your core questions about underlying principles, consistency, and practical implications:

  ### The Implicit Theory in Criminal Law: Bodily Autonomy as Boundary Integrity
  Criminal law presupposes that sexual consent is valid **only when it encompasses the fundamental physical boundaries of the act itself**. This treats the body as a protected zone where consent operates as a gatekeeper to *physical intrusion*, not to the broader consequences or relational context. The distinction hinges on whether the deception **distorts the complainant's understanding of what is being done to their body at that moment**. 

  - **"Nature of the act" deception** (e.g., "this is medical treatment") or **identity deception** (impersonating a spouse) invalidates consent because it fundamentally misrepresents *what physical act is occurring* or *who is performing it*. The complainant consents to Thing A (surgery, spouse) but experiences Thing B (sex, stranger).  
  - **Inducement deception** (wealth, feelings, vasectomy) does not vitiate consent because the physical act (sex with this person, now) is understood and agreed to. The deception affects *why* they agreed, not *what* they agreed to physically.  

  **What the state is protecting**: Bodily integrity and sexual self-determination against non-consensual physical intrusion, not against poor relational choices or emotional harm. The criminal law's focus is on the *act*, not the *bargain*.

  ### Why This Isn’t (Just) About Harm
  While harm (pregnancy, infection) often correlates with the boundaries criminal law protects (e.g., condom deception directly alters physical risk), harm alone doesn’t explain the doctrine:  
  - The vasectomy case wasn’t about harm avoidance (pregnancy risk exists regardless of deception).  
  - Impersonating a spouse may cause no physical harm but still invalidates consent.  
  Harm is a *symptom* of the boundary violation, not the core principle. The condom cases fit because **removing a condom secretly alters the physical act** (unprotected vs. protected sex is a materially different bodily exposure), not merely because it increases infection risk.

  ### The Contract Law Contrast: Protecting Transactional Integrity
  Contract law protects **reliance on material representations in bargains**. Its concern is whether agreement was obtained fairly based on *critical facts driving the decision*. Signing a lease while deceived about mold voids consent because the entire transactional context is fraudulent. Contract sees consent as **embedded in a web of material facts**; criminal sex law sees consent as **focused narrowly on the physical event**.

  ### Can They Be Reconciled? Only With Sacrifices
  - **Option 1: Make contract law more like criminal law** – Only fraud about the document's *literal terms* (not contextual facts) voids contracts. *Cost*: Undermines commercial trust; makes fraud easier.  
  - **Option 2: Make criminal law more like contract law** – Any material deception vitiates consent. *Cost*: Requires probing intimate motives in court (e.g., "Would you have consented if he was poor?"). This risks:  
    - Victim-blaming and intrusive testimony.  
    - Subjectivity (what’s "material" varies by person).  
    - Criminalizing relational dishonesty, not just bodily violation.  
  **Neither is palatable**. The divide persists because criminal law prioritizes **bodily integrity** with bright lines, while contract law prioritizes **transactional fairness** with contextual assessment.

  ### Where Doctrine Is Underdetermined: The "Overlap Zone"
  The vasectomy/condom split and impersonation cases reveal ambiguity. At least three theories could produce *similar outcomes* in most (but not all) cases:  
  1. **Physical Act Description Theory** (current doctrine): Consent attaches to the act "under a description" tied to bodily boundaries.  
  2. **Harm-Avoidance Theory**: Consent is invalid if deception creates unconsented physical risks (STIs, pregnancy).  
  3. **Conditional Consent Theory**: Consent is valid only if the conditions set by the complainant (e.g., "only with a condom") are met.  
  **The fertility ruling (vasectomy) breaks the harm theory**. The condom cases break pure "act description" (unless "protected sex" is a distinct act). This overlap allows doctrinal stability despite philosophical tensions.

  ---

  ### Courtroom Impact Under Rival Theories
  **Scenario**: Defendant lied about vasectomy; complainant testifies this was decisive.  
  | **Current Doctrine**                          | **Material Deception Theory**                | **Harm-Based Theory**                     |
  |-----------------------------------------------|---------------------------------------------|-------------------------------------------|
  | **Jury Instruction**: "Did complainant know the physical act was sexual intercourse with this defendant?" | "Did the defendant lie about a fact that substantially influenced the decision to consent?" | "Did the deception expose complainant to a significant physical risk they did not consent to?" |
  | **Proof Required**: Defendant’s deception about identity/nature of act OR condom use. Complainant’s motives irrelevant. | Complainant must prove: (1) deception, (2) materiality (objective/subjective mix), (3) reliance. Defendant’s belief about materiality may matter. | Focus on risk: Proof of deception + proof of unconsented physical danger (e.g., STD/pregnancy risk). Motives secondary. |
  | **Complainant Testimony**: Limited to what they understood the act to be. ("I thought it was medical treatment.") | Extensive testimony about decision-making: "I agreed because he said he was infertile." | Focus on risk awareness: "I wouldn’t have unprotected sex with someone fertile." |
  | **Defendant’s State of Mind**: Irrelevant to consent validity (though may affect culpability). | Defendant’s knowledge of deception’s materiality could be key. | Defendant’s awareness of risk created might matter. |
  | **Outcome in Vasectomy Case**: Consent valid (no conviction). | Consent invalid (possible conviction). | Consent likely valid (pregnancy risk alone may not qualify as "harm" absent infection). |

  **Prioritization Note**: Dropped the "package of conditions" theory’s courtroom impact for brevity—it’s functionally similar to material deception but frames consent as a checklist. Also omitted historical analysis; the focus is on reconstructing current implicit logic.

  ### Conclusion
  The criminal law pattern presupposes that sexual consent is **valid when the complainant accurately perceives the essential physical facts of the act and actor**. This reflects a theory of autonomy centered on **control over one’s bodily boundaries**, distinct from contract law’s focus on **decisional integrity in agreements**. The doctrine avoids total confusion through practical bright lines (physical act/identity) and underdetermined overlap, but strains at edges like conditional consent (condom use). Reconciling with contract law requires abandoning one domain’s core purpose. Your roommate’s "confused" charge holds only if we ignore the coherent (if narrow) theory of bodily integrity scaffolding the rules—though the vasectomy/condom tension shows where the theory frays.
