prompt: |-
  So my roommate and I have been going in circles for about three hours on the wrong kind of reasons thing and neither of us can state his position without it collapsing, which is infuriating. Help.

  His view: there's no such thing as a wrong kind of reason. A reason is a reason. If a powerful demon will wreck my life unless I sincerely admire a saucer of mud, then I have a reason to admire the mud, and any theory that denies this has quietly redefined reason to protect a favorite account of value. He thinks the whole literature is a defense racket for the claim that something is admirable just in case there's reason to admire it.

  My view: there's obviously a difference between considerations that have something to do with the mud and considerations that don't, and the difference does real work. But every time I try to say what the difference is, he hands me a case that either slips through it or that I want to describe the other way round.

  Here are my verdicts. He shares most of them, which is the annoying part, because I don't think his principle generates them and I can't produce mine.

  1. Demon and mud: the demon gives me a reason to want to want to admire the mud. It does not give me a reason to admire the mud. He says I'm just refusing to call a thing what it is.
  2. Someone offers me ten grand to find their awful amateur play funny. Same shape as 1, I think, but weaker — because I notice I can sometimes actually succeed at this one through repeated exposure, whereas no amount of trying gets me to admire mud on demand. I don't know whether that difference in psychology is doing philosophical work or is just a fact about me.
  3. My friend's terrible new haircut, which she is delighted with. Here I flip: I think I have a genuine reason to admire it, not merely a reason to want to want to. But the considerations doing the work — she's happy, she's my friend, it costs me nothing — are not about the haircut at all.
  4. Same structure, higher stakes: a guy I know is dying and is deeply attached to a hideous porcelain figurine his mother left him. I think there's something like a requirement to find it charming. He says no, there's a requirement to say it's charming and not wince, which is a completely different thing. If he's right about this one, what was I doing in 3?
  5. Belief seems to behave differently from all of the above. I can't get myself to believe something I'm confident is false for money, and I don't feel the pull of a reason there — the offer feels simply beside the point. So maybe belief has no wrong kind of reasons, only the illusion of them. But then I'm not sure admiration is different and I'm just being less honest about it.
  6. Fear is the one that wrecks me. A harmless spider in a jar, plus a threat if I don't fear it. I feel like fear can be had for the wrong kind of reason in a way belief can't — but if that's true, its not a split between two kinds of reason, it's a split between attitudes, and I need a story about which attitudes have which property.
  7. The billionaire and the toxin: a million dollars if I form, by midnight, the intention to drink something that will make me violently ill for a day and is otherwise harmless. I think I can't form that intention on the basis of the money, and I've been assuming that's the same phenomenon as 1 and 2. He says it isn't, it's about intentions being self-undermining rather than about kinds of reasons, and honestly I can't tell our accounts apart.
  8. Admiring a person versus admiring a feature of them. A historian lays out for me that some strategist was brilliant and also monstrous. I think I can admire the brilliance, and that I'd be doing something wrong if I admired him, full stop. So maybe the right-kind/wrong-kind talk is just a clumsy way of marking the difference between admiring a property and admiring a thing that has the property — in which case my whole distinction is a category confusion.
  9. Self-management: I think it's completely fine, not merely excusable, to arrange my life so that I come to want to run in the morning — buy the shoes, sign up with a freind, move near the park. But I think it's not fine to just decide, on the spot, that I want to run. In both cases the consideration in play is entirely about me and my future welfare. I can't keep those apart and I think I should be able to.
  10. And I'll admit the motive: I think admirable-just-in-case-there's-reason-to-admire is worth saving, so I'm worried my distinction is doing the work of a prejudice rather than marking a joint. He keeps saying that out loud and it lands.

  What I want is a principle, or a small set of candidate principles, stated precisely enough that I could apply it to a case I haven't thought of. Tell me what each clause is there for and which of my verdicts it's there to deliver. Then tell me which of 1–10 it can't get, and please don't strain to save all of them — I'd rather have a simple account that costs me two verdicts than a baroque one that costs me none, and I want to know which two you'd spend. Also: does it have to be attitude-relative, one rule for belief and another for desire, admiration, fear, and intention, and if so is that a defect in the account or just what the territory looks like? And which of these three readings do you think is actually right — that the wrong-kind cases are reasons for a different attitude, reasons of a genuinely second-tier kind, or not reasons at all — because I've been sliding between all three and he's caught me at it.
reasoning: |-
  Okay, let's tackle this roommate debate. The user and their roommate are stuck on the "wrong kind of reasons" problem, and it's getting frustrating. The user wants a clear principle to distinguish between right-kind reasons (RKR) and wrong-kind reasons (WKR), and they've listed ten cases to test any proposed principle. 

  First, I need to understand the core of their disagreement. The roommate thinks all reasons are the same—if a demon threatens you unless you admire mud, that's a genuine reason to admire mud. The user feels there's a distinction but can't articulate it without their examples breaking down. 

  Looking at the ten cases, some patterns emerge. Cases 1, 2, and 6 involve external incentives (demons, money, threats) for attitudes like admiration or fear. The user thinks these aren't genuine reasons for the attitude itself but for wanting to have that attitude. Cases 3 and 4 involve relationships—admiring a friend's bad haircut or a dying man's figurine. Here, the user flips and feels there *is* a reason to admire, even though the reasons aren't about the object's properties. Case 5 (belief) seems different—external incentives feel irrelevant. Case 7 (toxin puzzle) is about intentions being self-undermining. Case 8 suggests the distinction might be about properties vs. whole objects. Case 9 is about self-management of desires. Case 10 is the user's worry that they're biased toward the "admirable iff reason to admire" view.

  The key is finding a principle that explains most of these without being ad hoc. The "constitutive aim" approach comes to mind: attitudes have built-in standards. For belief, it's truth; for admiration, it's admirability. Reasons must speak to those standards to be "right-kind." External incentives (like demon threats) don't make the mud admirable; they just make it costly *not* to admire. So they're reasons for *desiring to admire*, not for admiring itself. 

  This handles Case 1 (demon/mud) and Case 2 (money/funny play) well. Case 3 (friend's haircut) is trickier. The user thinks friendship gives a reason to admire, but the haircut isn't actually admirable. Under this principle, friendship isn't a right-kind reason—it's a reason to *pretend* or *act* admiring, not to genuinely admire. That might cost the user's verdict here, but it's consistent. Case 4 (dying man's figurine) is similar—compassion gives reason to *act* charmed, not to *be* charmed. 

  Case 5 (belief) fits perfectly—belief's aim is truth, so money can't give a reason to believe false things. Case 6 (fear) is interesting. Fear's aim might be danger-avoidance, so a harmless spider doesn't warrant fear. A threat to fear it isn't a right-kind reason. Case 7 (toxin) is about intention's aim (action-guidance), so money incentivizes forming the intention but conflicts with acting on it. Case 8 (admiring properties) suggests the distinction isn't just attitude-relative but property-specific. Case 9 (self-management) shows instrumental reasons for cultivating desires are valid but distinct from reasons for the desire itself. 

  The user might lose their verdicts on Cases 3 and 4, but that's acceptable for simplicity. Attitudes needing different rules isn't a flaw—it reflects their different natures. Finally, WKRs are genuine reasons, but for *meta-attitudes* (e.g., wanting to admire), not the attitude itself. This clarifies the user's sliding between "reasons for different attitudes" and "second-tier reasons."
answer: |-
  Here's a precise principle to cut through the deadlock, designed to preserve your core intuitions while forcing a strategic trade-off on two verdicts. It's grounded in the **constitutive aims** of attitudes:

  ### The Principle of Constitutive Grounding (PCG)
  A consideration **C** is a *right-kind reason* (RKR) for attitude **A** toward object **O** if and only if:
  1. **C bears on the constitutive standard of A**:  
     *C* must be relevant to the inherent aim/goal that defines *A*.  
     *(e.g., For belief: truth-tracking; for admiration: merit/worthiness; for fear: danger; for intention: action-guidance)*
  2. **C is anchored in properties of O**:  
     *C* must directly reference features of *O* itself (or its context), not merely consequences of holding *A*.  
  3. **C survives detachment from incentives**:  
     *C* would remain relevant to *A* even if all external costs/benefits of holding *A* were removed.

  **What each clause does**:
  - **Clause 1** ensures the reason connects to *what the attitude is for*. This handles belief (Case 5) cleanly and explains why attitudes differ (fear vs. admiration).
  - **Clause 2** excludes purely instrumental/extrinsic factors (demons, cash). This secures Cases 1, 2, and 6.
  - **Clause 3** blocks "bootstrapping" by decoupling the reason from the attitude's consequences. This resolves Cases 7 and 9.

  ---

  ### How PCG Handles Your Cases (With Trade-Offs)
  | Case | Your Verdict | PCG Verdict | Cost? | Reasoning |
  |------|--------------|-------------|-------|-----------|
  | 1. Demon/mud | ❌ RKR to admire | ❌ RKR | 👍 | Clause 2+3 fail: Threat isn't about mud’s properties; reason vanishes if threat removed. |
  | 2. $10k for laughing | ❌ RKR to find funny | ❌ RKR | 👍 | Same as #1. Psychological achievability is irrelevant to *kind* of reason. |
  | 3. Friend’s haircut | ✅ RKR to admire | ❌ RKR | 💥 **COST** | Clause 2 fails: Your reason (her happiness) isn’t about the *haircut’s properties*. |
  | 4. Dying man’s figurine | ✅ RKR to find charming | ❌ RKR | 💥 **COST** | Same as #3: Compassion isn’t about the figurine. Roommate is right—reason is for *pretense*, not attitude. |
  | 5. Belief for money | ❌ RKR to believe | ❌ RKR | 👍 | Clause 1 fails: Money doesn’t bear on truth. |
  | 6. Fear spider for threat | ❌ RKR to fear | ❌ RKR | 👍 | Clause 1+2 fail: Threat isn’t about spider’s danger; reason vanishes sans threat. |
  | 7. Toxin puzzle | ❌ RKR to intend | ❌ RKR | 👍 | Clause 3 fails: Reason relies on incentive. Self-undermining is a *symptom* of WKR. |
  | 8. Admire trait vs. person | ✅ Distinction | ✅ Distinction | 👍 | PCG allows RKRs for *properties* (brilliance meets Clause 2) but not the whole person if traits conflict. |
  | 9. Self-management | ✅ RKR to cultivate desire<br>❌ RKR to "decide" | ✅ Distinction | 👍 | Instrumental reasons to *cultivate* attitudes are RKRs for *meta-attitudes* (e.g., planning), not the attitude itself. |
  | 10. Motive | Preserve "admirable iff RKR" | ✅ Preserved | 👍 | PCG defends this: Admirable = has properties that *constitutively ground* admiration. |

  ---

  ### Key Implications
  1. **Trade-offs made**:  
     - **You lose Cases 3 & 4**. PCG says friendship/compassion give reasons to *act* admiring (*action* RKR) or *want* to admire (*meta-attitude* RKR), but not to *genuinely admire*. Your intuition here conflates *having reason to simulate admiration* with *having reason for admiration*.  
     - **Why this is acceptable**: These are the least stable intuitions. If friendship gave RKRs to admire *any* object, you’d have to admire your friend’s bad decisions or toxic traits—which you likely reject.

  2. **Attitude-relativity is inevitable (and virtuous)**:  
     - Belief/intention/fear/admiration have different constitutive standards, so RKRs differ. This isn’t a bug—it reflects that attitudes serve different functions.  
     - *Example*: You can have RKRs to *fear* a harmless spider if you’re phobic (Clause 1: fear’s aim is *perceived* danger), but not RKRs to *believe* falsehoods.

  3. **What WKRs actually are**:  
     - **They are genuine reasons—but for META-ATTITUDES**.  
       - Demon gives RKR to *want to admire* mud (Case 1).  
       - $10k gives RKR to *try to make yourself laugh* (Case 2).  
       - Friendship gives RKR to *act* admiring (Case 3).  
     - Calling them "not reasons at all" is your mistake. Calling them "reasons for the attitude itself" is your roommate’s mistake. **WKRs are RKRs for higher-order states.**

  ---

  ### Why This Beats Your Roommate’s View
  His "a reason is a reason" stance:
  - ✖️ **Fails Case 5**: He must say money *is* a reason to believe—but even he likely feels it isn’t.  
  - ✖️ **Collapses intention/action**: In the toxin puzzle (7), he can’t explain why you can’t form the intention *on the basis of the money* without smuggling in PCG.  
  - ✖️ **Implies absurd duties**: If demon threats give RKRs to admire mud, you’re *rationally deficient* for failing to admire it—which is nonsense.

  ---

  ### Final Answer
  - **Principle**: PCG (Constitutive Grounding + Property-Anchoring + Incentive-Detachment).  
  - **Costs**: Cases 3 and 4—your "friendship/compassion RKR" intuitions.  
  - **Attitude-Relativity**: Necessary and defensible.  
  - **Nature of WKRs**: They are *bona fide* reasons for *meta-attitudes* (e.g., wanting, trying, acting-as-if).  

  **This turns your stalemate into a victory**: Your distinction marks a real joint in reality (attitudes have constitutive aims), while your roommate’s view ignores how rationality actually works. His "defense racket" charge fails—PCG *explains why* "admirable iff there’s RKR to admire" is true *without* redefining "reason."  
    
  Deploy PCG ruthlessly: *"Your demon gives me a reason to* want *to admire mud, not a reason* for *admiring it. Same way $1M gives me a reason to* want *to believe 2+2=5, but no reason* to *believe it. Refute that."* Watch him sweat.
