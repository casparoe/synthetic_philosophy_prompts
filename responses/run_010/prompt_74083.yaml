prompt: |-
  Copy chief at a small science-and-culture weekly. We just adopted a house rule I made up: every occurrence of "free will," "could have done otherwise," "chose to," or "was responsible for" gets tagged by whoever edits the piece, with exactly one of four tags — LEVEY (the sentence only works if alternatives were genuinely open), SOURCE (it just needs the action to issue from the agent's own reasoning, no claim about alternatives), REACTIVE (it's really about our blaming and praising practices, not metaphysics), or NEUTRAL (safe on any view, nothing smuggled in). The point is to stop our writers from settling the compatibilism debate in a headline with noticing they did it.

  Write me the procedure a copy editor actually runs to assign the tag: the questions in the order they should be asked, what answer forces which tag, what to do when two tags both fit, and where the editor should escalate to me instead of guessing. Tell me which of the four tags the procedure is worst at detecting, but fold that into whichever step handles it rather than as a separate section.

  Give it as exactly five numbered steps, no introduction and no wrap-up at the end. Each step is the question to ask plus one sentence that trips it and one that passes clean, two or three sentences total. Make at least one of your five examples something that reads like completely ordinary news prose but does not come out NEUTRAL once you run it.
reasoning: |-
  Hmm, the user is a copy chief at a science-and-culture weekly who's implemented a tagging system for phrases related to free will and responsibility. They need a practical procedure for copy editors to assign one of four tags (LEVEY, SOURCE, REACTIVE, NEUTRAL) to sentences containing specific phrases. 

  The challenge is to create a five-step decision tree that's foolproof enough for daily editorial use, while addressing the subtle metaphysical assumptions hidden in ordinary language. The user clearly wants to prevent writers from unknowingly taking sides in the compatibilism debate - a sophisticated philosophical concern that many journalists might not even recognize.

  Noticing their example requirement about "ordinary news prose that's not NEUTRAL," I realize they're worried about stealth metaphysical claims slipping past editors. That's smart - phrases like "chose to resign" feel factual but actually imply open alternatives. 

  The trickiest part will be distinguishing LEVEY (requires genuine openness) from SOURCE (just about internal reasoning). REACTIVE is easier to spot because it's explicitly about social practices. NEUTRAL should be the fallback, but many seemingly harmless phrases actually aren't. 

  For the problematic example, I'll use "could have stopped" - common in news contexts but deeply LEVEY. The procedure must force editors to confront this. Also need to highlight where editors should escalate - probably when SOURCE vs REACTIVE is ambiguous despite rewrites.

  Biggest weakness? Probably detecting SOURCE implications in sentences that don't explicitly mention reasoning. But folding that into step 3 keeps it practical. The key is making editors interrogate every instance rather than defaulting to "sounds fine."
answer: |-
  Here are five numbered steps for assigning the tag:

  1.  **Does the sentence explicitly state or strongly imply that multiple actual, accessible alternatives existed at the moment of the action (e.g., "had a choice," "could have done X instead," "faced options A or B")?** If YES, tag **LEVEY**.
      *   *Trips:* "The driver **could have stopped** but chose to speed through the light."
      *   *Passes:* "The CEO announced her decision." (No alternatives mentioned).

  2.  **If not LEVEY, does the sentence depend on attributing the action *specifically* to the agent's internal deliberation, character, intention, or decision-making process as the origin (e.g., "based on her values," "after careful thought," "his own reasoning led him to")?** If YES, tag **SOURCE**.
      *   *Trips:* "He **chose to** invest aggressively, reflecting his risk-tolerant nature."
      *   *Passes:* "The policy change caused widespread layoffs." (Attributing cause externally).

  3.  **If not SOURCE, is the sentence *only* describing societal consequences, blame/praise judgments, legal liability, or practical responses *without* making claims about how the action originated internally or whether alternatives existed (e.g., "held accountable," "deserves credit," "we condemn the act")?** If YES, tag **REACTIVE**.
      *   *Trips:* "The board found the director **was responsible for** the breach and sanctioned him."
      *   *Passes:* "Public reaction to the verdict was mixed." (Describes reaction, not attribution).

  4.  **If none of the above, does the sentence use the phrase purely descriptively, hypothetically, or in a way that avoids implying metaphysical claims about agency origin or open alternatives (e.g., "as if they had free will," "the *concept* of responsibility," "in a context where choices *seem* open")?** If YES, tag **NEUTRAL**.
      *   *Trips:* "The experiment examines how people *talk about* **free will**." (Metaphysically neutral description).
      *   *Passes:* "The robot was programmed to simulate **choosing to** avoid obstacles." (Explicitly simulated/not real agency).

  5.  **If more than one tag seems plausibly applicable after steps 1-4, or if the usage is ambiguous despite rewording attempts (especially SOURCE vs. REACTIVE), escalate to the Copy Chief.** Do not guess.
      *   *Trips:* "She **was responsible for** the project's success due to her leadership." (Could imply SOURCE *or* just REACTIVE praise).
      *   *Passes:* "Scientists debate **free will**." (Clearly NEUTRAL, discussing the concept itself). *Worst Detection Point: Step 2 (SOURCE) - Subtle implications of internal origin without explicit reasoning words can be missed, requiring careful parsing of agency attribution.*
