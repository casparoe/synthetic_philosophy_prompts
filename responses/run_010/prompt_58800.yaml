answer: |-
  ### Brainstorming Distinctions
  Right, let's cut through the textbook fog. The core distinctions that *actually* sort intuitions in your cases—and that avoid rehashing dead debates—are these:  
  1. **Is current physical ability necessary?** (Paralysis = loss of know-how?)  
  2. **Does know-how survive total loss of access?** (Rust/injury: "can't but still knows" vs. "gone")  
  3. **Is reliability necessary?** (Or does one-off lucky success count?)  
  4. **Is ability to explain necessary?** (Knitter who can't articulate steps)  
  5. **Can groups "know how" collectively?** (No single member grasps the whole)  
  6. **Is know-how purely behavioural?** (AI that passes tests but has no "inner" state)  
  7. **Is propositional knowledge necessary?** (Bike manual reader who knows facts but can't ride)  

  I’ll build the tree out of **1, 2, 3, 4, and 5** because they directly handle your argument’s pain points (loss, explanation, groups) and avoid circularity. Dropping **6 and 7**: the AI case can be handled by reliability/explanation questions, and propositional knowledge (7) is too entangled with "knowing-that" jargon. Your flatmate doesn’t need that noise.  

  ---

  ### Sorting Quiz / Decision Tree  
  **Instructions:** Answer each scenario based on your gut feeling. No philosophy degrees required—just pick the option closest to your intuition.  

  1. **The Rusty Pianist**  
     Your sister hasn’t played piano in six years, can spot mistakes in others’ playing, but says she couldn’t perform a piece herself now. Do you say:  
     A) She *still knows how* to play—she’s just out of practice.  
     B) She *no longer knows how*—if you can't do it, you don't know it.  
     C) It’s unclear; she might know *about* piano but not *how* to play it.  

  2. **The Bike Manual Expert**  
     Your mate has read every book on cycling, can explain why you wobble, but has never ridden a bike. He tries and falls instantly. Do you say:  
     A) He *knows how* to ride—he understands it perfectly.  
     B) He *doesn’t know how*—reading isn’t riding.  
     C) He knows *how it works* but not *how to do it*.  

  3. **The Knitting Grandma**  
     Your mate’s grandmother has knitted for 60 years, produces flawless jumpers, but can’t explain her steps (“I just *do* it!”). She gets flustered if asked. Do you say:  
     A) She *knows how* to knit—her hands just know.  
     B) She *doesn’t fully know how*—if you can’t explain it, it’s not real knowledge.  
     C) She knows how *to knit* but not how to *teach* knitting.  

  4. **The Lucky Novice**  
     Charlie tries baking sourdough for the first time, follows no recipe, and by sheer luck produces a perfect loaf. Could you say Charlie *knows how* to bake sourdough?  
     A) Yes—they succeeded, so they know how.  
     B) No—it was a fluke; they couldn’t do it again.  
     C) They know how *this time*, but not reliably.  

  5. **The Fragile Expert**  
     Sam fixes vintage radios every day with 95% success, but only because they use a cheat sheet taped to their desk. If the sheet burned, they’d fail. Do they *know how* to fix radios?  
     A) Yes—they get it right most times.  
     B) No—their success depends on a crutch.  
     C) They know how *with the sheet*, but not without it.  

  6. **The Parkinsons Knitter (Lost Access)**  
     Grandma’s hands now shake badly with Parkinson’s—she can’t knit anymore—but she can still watch you knit and say, “Drop a stitch there,” or guide your hands. Do you say:  
     A) She *still knows how*—her mind hasn’t forgotten.  
     B) She *no longer knows how*—know-how needs doing.  
     C) She knows *about* knitting but not *how to do it* now.  

  7. **The Retired Surgeon**  
     A surgeon retires after 40 years. Their hands tremble, so they can’t operate, but they coach a junior through a complex surgery flawlessly. Do they *know how* to perform the surgery?  
     A) Yes—they directed it perfectly.  
     B) No—if you can't do it yourself, you don’t know how.  
     C) They know how to *instruct*, not how to *perform*.  

  8. **The Football Team (Group Case)**  
     A football team executes a winning move where no single player could describe the whole play—each knows only their role. Does the *team* know how to run that play?  
     A) Yes—the group pulled it off.  
     B) No—only individuals know things.  
     C) The team *can do it*, but "knows how" is the wrong phrase.  

  9. **The Piano Duo (Synchronic Loss)**  
     Two pianists play a duet. One loses an arm in an accident but can still hear mistakes and say, “You’re rushing the tempo.” Do they *still know how* to play the duet?  
     A) Yes—they understand it completely.  
     B) No—knowing how requires being able to play your part.  
     C) They know how it *should sound*, not how to *play it*.  

  10. **The AI Chef**  
      A robot cooks Michelin-star meals by following algorithms it didn’t create. It passes all cooking tests but has no feelings or awareness. Does it *know how* to cook?  
      A) Yes—it reliably makes great food.  
      B) No—it’s just following instructions mechanically.  
      C) It *simulates* knowing how, but doesn’t truly *know*.  

  11. **The Ageing Navigator**  
      An old sailor navigated oceans for decades using stars. Now, with dementia, they sometimes get confused but still give correct sailing advice 70% of the time. Do they *know how* to navigate?  
      A) Yes—they’re still often right.  
      B) No—know-how shouldn’t fade or be unreliable.  
      C) They *used to* know, but now it’s hit-or-miss.  

  12. **The Relearning Case**  
      After a decade, your sister sits at a piano and fumbles badly. But with 10 minutes of practice, she plays smoothly again. When she was fumbling, did she *still know how*?  
     A) Yes—she just needed a refresh.  
     B) No—she had to relearn it.  
     C) She retained the "foundation" but lost the "doing."  

  ---

  ### Scoring Key & Positions  
  Tally your answers. Patterns map to these views:  

  - **Mostly A’s: Rylean Anti-Intellectualism**  
    Know-how is *ability-based skill*. You don’t need to explain it (Grandma’s fine), but you must have reliable, embodied capacity. Loss of physical ability (surgeon, paralysis) means lost know-how. Groups can know how (football team). Lucky success (Charlie) doesn’t count.  
    - *Why?* You prioritise doing over thinking. Knowledge fades with rust but resurfaces quickly (piano relearning).  

  - **Mostly B’s: Intellectualist (Stanley-Williamson Style)**  
    Know-how is *propositional knowledge under a practical guise*. Ability isn’t essential (pianist still knows), but understanding is. Grandma’s inability to explain suggests she doesn’t *truly* know. Groups don’t “know” collectively. Lucky success is ignorance.  
    - *Why?* You treat know-how like knowing facts. The bike manual reader *knows how*; the AI doesn’t (no understanding).  

  - **Mostly C’s: Competence as Standing State**  
    Know-how is a *persistent competence* distinct from doing, explaining, or luck. It survives rust, injury, or age (pianist, surgeon, Grandma still "know"). But it requires reliability (Charlie’s luck fails) and isn’t just group action.  
    - *Why?* You separate "can’t do now" from "lost knowledge." Explanation isn’t needed (Grandma’s fine), but flukes aren’t know-how.  

  - **Mix of A/B/C with emphasis on groups/AI: Deflationary Pragmatism**  
    "Knows how" is context-dependent—it just means "can get the job done when needed." Groups "know" (football), AI "knows" (it delivers), and luck counts if it works (Charlie). Explanation is irrelevant (Grandma’s fine). Rust erodes know-how slowly (navigator’s 70% is enough).  
    - *Why?* You’re outcome-focused. If it works *now*, it counts.  

  - **Empty Leaf: Ephemeral Ability-Only**  
    *Scoring rare:* All B’s on loss/rust questions (6,7,9,11,12), A’s on luck (4) and fragility (5). **Position:** Know-how is *only* present during successful performance and vanishes immediately after. Grandma knitting *knows*; the second she stops, she forgets. The pianist mid-fumble *doesn’t know*. Nobody defends this—it’s incoherent (you couldn’t relearn quickly if knowledge vanished) and makes "knowing" uselessly fleeting.  

  ---

  ### Logical Space Grid  
  Dimensions from your cases (Yes/No questions):  
  1. **Y/N:** Does know-how require *current ability*? (Surgeon can’t operate)  
  2. **Y/N:** Can know-how *survive permanent inability*? (Paralysed expert)  
  3. **Y/N:** Is *reliability* necessary? (Lucky Charlie fails)  
  4. **Y/N:** Is *ability to explain* necessary? (Grandma fails if Y)  
  5. **Y/N:** Can *groups* possess know-how? (Football team)  

  | Current Ability Needed? | Survives Permanent Loss? | Reliability Needed? | Explanation Needed? | Groups Possible? | Occupied Position(s) | Empty? Why? |  
  |-------------------------|--------------------------|---------------------|---------------------|------------------|----------------------|-------------|  
  | **Y** | **N** | **Y** | **N** | **Y** | **Rylean** | |  
  | **N** | **Y** | **Y** | **Y** | **N** | **Intellectualist** | |  
  | **N** | **Y** | **Y** | **N** | **Y** | **Competence View** | |  
  | **N** | **N** | **N** | **N** | **Y** | **Deflationary Pragmatism** | |  
  | **Y** | **N** | **N** | **N** | **N** | *Unoccupied* | Incoherent: if ability needed *and* no survival, but reliability not required—what is "knowing"? |  
  | **N** | **Y** | **N** | **Y** | **Y** | *Unoccupied* | Unattractive: knowledge survives loss but needs explanation? Grandma couldn’t know. |  
  | **Y** | **Y** | **Y** | **N** | **N** | *Unoccupied* | Unexplored: too niche—groups rejected but survival/ability combined. |  

  **Indistinguishable pairs:** The tree *can’t cleanly separate* Intellectualism from Competence View when both accept survival without ability (e.g., the surgeon case). The difference hinges on explanation (Grandma)—if you waver there, you might land in either.  

  ---

  ### Confidence & Weak Points  
  **Confidence: 80%.** This sorts *intuitions* not labels—it forces concrete choices (e.g., "surgeon coaching: know-how or not?"), which your argument lacked. Real disagreements map to real positions (e.g., your flatmate’s "can-do-right-now" is pure Rylean).  

  **Weakest Branch:** **Question 12 (Relearning).** A careful answer could land in Rylean (A: "yes, she still knew") or Competence (C: "foundation retained")—but both positions accept survival with rust. The tree nudges A → Rylean, C → Competence, but if someone says "yes *because* she relearned fast," they’re blending both. This is why philosophers still argue—but in practice, your sister’s case will sort clearly.  

  Now: make your flatmate take the quiz. If they squirm at Question 6 (Parkinson’s knitter), you’ve won.
