prompt: |-
  You're two people at once for me here: a philosopher of physics who works on spacetime metaphysics, and a workshop designer who builds hands-on activities that make abstract arguments land in the body. Think carefully before answering, and before you give me the finished thing, sketch the two or three other mechanisms you considered and why you dropped them — I want to see that you actually shopped around rather than reaching for the obvious one.

  Setting: I teach a 75-minute session in an upper-level philosophy of space and time seminar. 16 students, mostly philosophy majors, two physics majors. We've already done Newton's bucket and the Leibniz–Clarke correspondence, so they know what absolute space is supposed to be and they've heard the sufficient-reason objection to it. Nobody has seen the hole argument. I want them to walk into it and start fighting about it before I ever say what it's called — the naming happens in the debrief, after positions are already on the table.

  What I want them to come away seeing, roughly in this order:
  1. That a global rearrangement of everything is undetectable, and yet they may well insist it's a different world — and that this is precisely the joint the shift argument pries on.
  2. That if spacetime points are real individuals with identities of their own, then a rearrangement confined to a bounded region generates a genuinely distinct possible history that is observationally identical to the actual one — so they cannot know which history they're in. That unknowing *is* the indeterminism; I don't want them to hear it as "the laws fail to determine stuff" in the abstract.
  3. That the escape is to deny that those two histories differ, and that this escape has a price: points stop having identity independent of the fields on them.

  Design the whole thing. Mechanics, materials (I have index cards, name tags, masking tape, a whiteboard, two colours of poker chips; no money, no phones), a scoring scheme that gives them a real reason to think hard instead of just guessing, a minute-by-minute timeline for the 75 minutes including debrief, and who does what given that I'm facilitating alone.

  A few specific things I want in it:
  - A phase where each student is a spacetime point wearing a fixed name tag and holding cards recording the local field value, and a later phase where they can only identify each other by their relations to one another. The same rearrangement should be performed in both phases. The payoff I'm after: in the second phase the rearrangement isn't just undetectable, it's literally unstatable — there's no sentence available to describe it — and they should discover that by trying and failing to write one down.
  - A round where every student writes their best guess at the complete history of the world and hands it in, and then I reveal that two submitted histories are observationally indistinguishable while the scoring rules treat them as different worlds. Build the payoffs so this lands as being cheated, not as a cute puzzle. If they feel indignant, I've won.
  - Something for the two physics majors to do so they're an asset instead of spoiling it in minute four.

  Then the debrief: map specific moments onto specific moves in the argument — which moment is the substantivalist commitment, which is the permutation, which is the rejection of bare individuality, which is the underdetermination — and give me the actual questions to ask at each handoff, not paraphrases of questions.

  Also tell me what predictably goes wrong the first time you run this. I already expect one student to say the name tags settle everything and to be *right*, in a way that blows up the second phase, and I expect the group to slide into "it's just semantics" about ten minutes in unless I head it off. Tell me the failure modes I haven't anticipated and how to handle them live, in the moment, without lecturing.

  Last thing, and be blunt: what can the cards-and-name-tags version not reproduce? My worry is that the real argument gets its bite from the field equations themselves — the underdeneration is generated by the theory's covariance, not by a facilitator's arbitrary choice to swap some cards around — and a card game makes it look like I, the facilitator, am the one smuggling in the indeterminism. Say exactly where the analogy gives out, and name the one misconception the activity will actively install in them that I have to dismantle by hand afterwards.
