  ### Workshop Design: The Hole Argument Unfolded

  #### Core Mechanics & Materials
  - **Students as spacetime points**: 16 students arranged in a 4x4 grid (masking tape on floor for positions).  
  - **Name tags**: Unique IDs (e.g., "P1" to "P16") for Phase 1.  
  - **Field value cards**: Index cards with scalar field values (0 or 1) written in marker.  
  - **Poker chips**: Blue = 0, red = 1 (used to visibly signal field values during discussions).  
  - **Hole region**: A bounded 2x2 subgrid (e.g., positions P6, P7, P10, P11).  
  - **Scoring**: Students earn points for correctly guessing the "true history" (revealed later). Guesses cost 1 point to submit; correct guess = +3 points.  

  ---

  ### Timeline (75 Minutes Total)

  #### **Phase 1: Substantivalism (Name Tags + Field Cards)** (25 min)
  1. **Setup (5 min)**  
     - Assign each student a fixed position, name tag (e.g., "P1"), and field card (e.g., "1").  
     - Field values: Ensure hole points (P6, P7, P10, P11) have *identical values* (e.g., all "1").  
     - Physics majors role: Assign as hole points (P6, P10) to leverage their intuition for symmetry.  

  2. **Global Shift (5 min)**  
     - Instruct: *"Swap name tags with someone who has the same field value as you."*  
     - Outcome: All swaps occur, but field values remain identical at every location.  
     - Whiteboard: Sketch grid showing field values unchanged (e.g., all "1" in hole).  

  3. **History Guessing Round (10 min)**  
     - *"Write the full history: For each point, list its field value. Pay 1 point to submit."*  
     - Collect submissions. Reveal two "different" histories (e.g., "P6:1, P7:1" vs. "P6:1, P7:1" after swap).  
     - **Scoring trap**: Treat them as distinct worlds (e.g., "History A" vs. "History B").  
     - Outcome: All guesses are "wrong" (since field values match, but point identities changed). Indignation ensues.  

  4. **Local Shift (Hole) (5 min)**  
     - Instruct hole points (P6, P7, P10, P11): *"Swap name tags within the hole."*  
     - Field values unchanged (all "1"), so no observable difference.  
     - Key Q: *"Could you tell if we did this shift? What’s your evidence?"*  

  #### **Phase 2: Relationism (No Name Tags, Only Relations)** (25 min)
  1. **Reset & Remove Name Tags (5 min)**  
     - Students keep positions and field cards. Remove and collect all name tags.  
     - Instruct: *"You can only identify each other by field values and relative positions (e.g., ‘the 1 next to me’)."*  

  2. **Repeat Local Shift (5 min)**  
     - Repeat the same hole swap (P6↔P7, P10↔P11).  
     - Field values unchanged, so no detectable change.  

  3. **Describe the Shift (10 min)**  
     - Challenge: *"Write a sentence describing the shift we just did."*  
     - Outcome: Students struggle. Attempts fail (e.g., "We swapped... but everything looks identical").  
     - Physics majors role: Have them lead the group in proving no description is possible.  

  4. **History Guessing Round 2 (5 min)**  
     - *"Submit a guess for the full history. Pay 1 point."*  
     - Outcome: All submissions identical (only field values matter now). No one loses points.  

  #### **Debrief: Mapping to the Hole Argument** (25 min)
  | **Activity Moment**          | **Hole Argument Move**                  | **Facilitator Q**                                                                 |
  |------------------------------|-----------------------------------------|-----------------------------------------------------------------------------------|
  | Name tags in Phase 1         | Substantivalist commitment              | *"In Phase 1, what did the name tags represent? Why did you care about P6 vs. P7?"* |
  | Local shift with name tags   | Permutation of spacetime points         | *"When we swapped points in the hole, was anything physically different? How do you know?"* |
  | Indignation in scoring       | Underdetermination of theory            | *"Why did you feel cheated? What does this say about ‘knowing’ which world you’re in?"* |
  | Failed description in Phase 2 | Rejection of bare individuality        | *"Why couldn’t you describe the shift? What’s missing when points lack identities?"* |
  | Phase 2 history guesses      | Escape: Points as non-individuals       | *"In Phase 2, why did you stop submitting different histories? What changed?"*    |

  **Final Reveal**: Name the "hole argument." Connect to Leibniz/Clarke: *"The ‘price’ is denying point individuality—just as Leibniz demanded."*  

  ---

  ### Failure Modes & Live Fixes
  1. **"Name tags settle everything!"**  
     - **Risk**: Student insists name tags resolve the shift, undermining Phase 2.  
     - **Fix**: In Phase 1, ask: *"If we rip off the tags, is there any way to prove P6 and P7 swapped?"* Let the group debate until they hit the wall.  

  2. **"It’s just semantics!"**  
     - **Risk**: Early dismissal of the shift as "wordplay."  
     - **Fix**: Use scoring to materialize stakes: *"If it’s semantics, why did you lose points? What’s physically at stake?"*  

  3. **Physics majors dominate**  
     - **Risk**: Derailment by arguing covariance or field equations prematurely.  
     - **Fix**: Assign them as "hole detectives" tasked with finding observational differences. Their failure becomes evidence.  

  4. **Group conflates "undetectable" with "unreal"**  
     - **Risk**: Concluding the shift never happened.  
     - **Fix**: Ask: *"If a tree falls in a hole and no one detects it, does spacetime care? Why/why not?"*  

  5. **Phase 2 description succeeds**  
     - **Risk**: A student uses coordinates (e.g., "swapped top-left and top-right").  
     - **Fix**: Retort: *"But ‘top-left’ is defined by us. Is that in spacetime, or in your head?"* Push until they see the relational crutch.  

  ---

  ### Where the Analogy Fails & Misconceptions
  **Blunt Truth**: The card game fails to capture the **dynamical origin of underdetermination**.  
  - **Why**: In the hole argument, indeterminism arises *from general covariance*—a property of Einstein’s equations. The facilitator’s swap is arbitrary; the theory’s covariance generates infinitely many solutions. Here, *you* imposed indeterminism; there, it’s a consequence of the mathematics.  
  - **Misconception Installed**: That indeterminism is an artifact of the model, not a feature of the world. Students may think, "If we just had better tools, we’d see the difference."  
  - **Dismantling After**: Explicitly contrast:  
    *"In this game, I ‘caused’ the underdetermination. In GR, it’s the equations themselves that fail to distinguish solutions. That’s why Einstein called it a ‘scandal’—it’s baked into gravity."*  

  **Materials Note**: Poker chips ensure field values are visible at a glance, accelerating the "no change" realization in shifts.  

  **Outcome**: By the debrief, students embody the argument—indignation at underdetermination, frustration at failed descriptions, and visceral relief in relational escape. The hole argument lands in their bones.
