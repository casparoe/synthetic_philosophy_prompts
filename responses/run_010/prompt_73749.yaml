prompt: |-
  I am organizing a two-day workshop on precommitment, individual and constitutional, and I would like to commission the document that its participants should ideally have read before arriving: the joint statement of an adversarial collaboration between the two camps the workshop will put in the same room.

  The first camp holds that a commitment can have genuine normative force for the agent who later faces the choice. Such an agent — a person who has resolved, or a polity that has entrenched — may stick to the plan even when defection looks better by the lights of the moment of action, and the reason is not merely that defection has been made costlier or impossible. Binding oneself changes what one has reason to do, not only what one can do. The second camp denies this. On its view rationality is local: at each node of a sequential problem the agent does what is then best, and everything a prior commitment accomplishes it accomplishes by altering the feasible set or the payoffs — by lashing oneself to the mast, installing penalties, delegating to a judge, or raising the threshold for reversal. A constitution, on this reading, is an obstacle course that a later majority may clear if it wishes hard enough, never a standing reason that survives the change in circumstances which motivated it.

  I have a further suspicion that I want the document to confront head-on rather than bury in a footnote. The same structural argument seems to me to favor the first camp in the individual case and the second camp in the constitutional case, and if that is right, one of the two literatures is borrowing intuitions it has not earned. Individually, predictably reversing oneself looks like a defect: an agent who does so can be pumped, and the usual rejoinder is that pumping is objectionable only if the pumped party is one continuing chooser. Constitutionally, the persistence of the earlier decision looks like the defect instead: the thought that the dead hand of a past majority should not fix the terms of present politics is taken to carry weight on its own. The collaboration should determine whether this asymmetry is principled — because the identity of a continuing agent is not the identity of a continuing demos, because a self-binder can always release himself while a bound populace cannot, because legitimacy is indexed to the living — or whether it is an artifact of how each literature slices up its agents and its times.

  Please deliver the following, in this order. First, a numbered section of claims both sides can sign: claims about the formal structure of sequential choice (backward induction, diachronic consistency, what a pump argument does and does not show, the difference between changing an option set and changing an option's normative status); claims about what entrenchment devices mechanically do (amendment thresholds, judicial review, delegation to independent bodies); and claims about which phenomena a theory of precommitment owes an account of. Second, a disagreements table, each row giving the dispute in a formulation its own side would accept, with a separate column for each side's preferred wording, and an explicit verdict on whether the dispute is substantive or verbal — where verbal, naming the word doing the work, since I expect candidates such as "bound," "the same agent," and "consent." Third, the cruxes: at least four sub-questions such that settling one would actually move a side, each with an account of what would settle it (an argument, a formal result, a case, comparative institutional evidence) and each side's prediction written down in advance, before the evidence is canvassed. The mast case must appear as a shared case, together with an account of where it misleads; I would also like the harder material drawn from psychiatric advance directives, contractual self-exclusion schemes, entrenched constitutional provisions, and central bank independence.

  Finally, be candid about failure. If some item cannot be signed by both parties without one of them equivocating, say so and diagnose what blocks the agreement. Do not include a bibliography or a literature review by citation; refer to positions and arguments by description and I will supply the references myself.
reasoning: |-
  We are writing a joint statement for an adversarial collaboration between two camps on precommitment. The first camp (let's call them "Normativists") believes that a commitment can change what one has reason to do, not just what one can do. The second camp ("Localists") holds that rationality is always local, and commitments work by altering the feasible set or payoffs.

  The document should have three main parts:

  1. **Agreements**: A numbered section of claims both sides can sign.
  2. **Disagreements Table**: A table with rows for each dispute, each side's preferred wording, and a verdict on whether the dispute is substantive or verbal.
  3. **Cruxes**: At least four sub-questions that would move the needle, with each side's prediction and what would settle it.

  Additionally, we must address the asymmetry between individual and constitutional cases and the suspicion that one literature is borrowing unearned intuitions.

  We must be candid about failure where agreement is impossible.

  Let's structure the document accordingly.

  ---

  **Joint Statement: Adversarial Collaboration on Precommitment**

  **Introduction**

  This document represents a collaborative effort between two opposing views on precommitment. The Normativist camp holds that a commitment can have genuine normative force, changing what an agent has reason to do at a later time. The Localist camp holds that rationality is always local and that commitments work solely by altering the feasible set or payoffs. We aim to clarify agreements, pinpoint disagreements, and identify cruxes for future research.

  **1. Agreements**

  Both sides agree on the following points:

  1.1. **Formal Structure of Sequential Choice**:
     - Backward induction is a valid method for solving sequential decision problems under common knowledge of rationality and full information.
     - Diachronic consistency (acting in accordance with one's past plans) is a property that some agents may value, but it is not necessarily a requirement of rationality per se.
     - Pumping arguments (where an agent is induced to change plans repeatedly to their detriment) demonstrate a practical vulnerability of agents who abandon plans without external cost, but they do not by themselves establish that such abandonment is irrational.
     - There is a distinction between changing the option set (e.g., removing an option) and changing the normative status of an option (e.g., making it forbidden). Both sides agree that precommitment devices typically work by the former, but they disagree on whether the latter is possible.

  1.2. **Entrenchment Devices**:
     - Amendment thresholds in constitutions require a supermajority or other procedures to change a provision, making reversal harder but not impossible.
     - Judicial review allows courts to invalidate legislation that violates constitutional provisions, acting as a check on majorities.
     - Delegation to independent bodies (e.g., central banks) insulates certain decisions from immediate political pressures.
     - These devices work by altering the costs, feasibility, or decision-making authority of future choices.

  1.3. **Phenomena Requiring Explanation**:
     A theory of precommitment must account for:
     - The widespread use of precommitment devices in individual and collective decision-making (e.g., savings accounts with withdrawal penalties, constitutional entrenchment).
     - Cases where agents regret not having bound themselves (e.g., Ulysses wishing he had been bound to the mast).
     - Cases where agents feel regret after having bound themselves (e.g., a person who has self-excluded from a casino but later wishes to gamble).
     - The intuition that breaking a commitment is a distinct kind of failure beyond the material costs incurred.

  **2. Disagreements Table**

  We present our disagreements in a table. For each row, we state the dispute in a way each side would accept, and we classify whether the dispute is substantive or verbal. If verbal, we identify the contested term.

  | Dispute Description | Normativist Wording | Localist Wording | Verdict (Substantive/Verbal) | If Verbal, Contested Term |
  |---------------------|----------------------|------------------|------------------------------|----------------------------|
  | **The nature of a commitment's force** | A commitment can create a new reason for action that persists even when the circumstances that motivated the commitment have changed. | A commitment only affects future choices by altering the feasible set or the payoffs; there is no new reason created beyond the costs of reversal. | Substantive | N/A |
  | **The possibility of genuine self-binding** | An agent can bind their future self such that the future self has a reason to act that they would not otherwise have had. | An agent cannot bind their future self; they can only make certain actions more costly or impossible. | Substantive | N/A |
  | **The identity of the agent over time** | The agent at time t0 and at time t1 are the same agent, and this identity supports the normative force of the commitment. | Even if the agent is numerically the same, the agent at t1 is a distinct decision-making center and must choose based on t1's reasons. | Verbal | "Same agent" (Normativists use it normatively; Localists use it descriptively) |
  | **The rationality of sticking to a plan** | It can be rational to stick to a plan even when, at the moment of choice, the balance of reasons (including the commitment) favors sticking, even if the immediate payoff would be higher without the commitment. | Rationality requires choosing the best available option at the moment of choice; if sticking to the plan is the best option because of the costs of reversal, that is consistent with local rationality. | Substantive | N/A |
  | **Constitutional legitimacy** | A constitution binds a polity by creating standing reasons that persist across time; later majorities have a reason to abide by it even if they could clear the amendment hurdle. | A constitution is a set of rules that can be changed by a sufficiently motivated majority; it does not create reasons beyond the costs of changing it. | Substantive | N/A |

  *Note on the mast case*: Both sides agree that Ulysses, by binding himself to the mast, changes his feasible set (he cannot steer toward the sirens). The disagreement is over whether, if he could unilaterally unbind himself at the moment of temptation, he would have a reason not to do so because of his prior commitment. Normativists say yes; Localists say no.

  **3. Cruxes**

  We identify four key sub-questions that, if resolved, would move the debate. For each, we state what would settle it and each side's prediction.

  3.1. **The Mast Case with Escape Hatch**:
     - **Question**: If Ulysses had a rope that he could untie with no cost (so no penalty or feasibility barrier), would it be rational for him to remain bound?
     - **What would settle it?**: A clear case from literature or real life where an agent voluntarily adheres to a commitment even when reversal is costless. Alternatively, a formal model showing that such behavior can be rational under specific assumptions about discounting or self-governance.
     - **Normativist prediction**: Yes, there are cases where agents do this (e.g., some advance directives in psychiatry where a patient in a lucid state commits to treatment and later, when psychotic, does not revoke it even if they could). They would argue that the commitment creates a reason that outweighs the momentary desire.
     - **Localist prediction**: No. Without costs, the agent will always defect. Any observed adherence must be due to some residual cost (e.g., guilt, social sanction) or a mistake.

  3.2. **Psychiatric Advance Directives**:
     - **Question**: When a patient with a history of psychosis signs an advance directive during a lucid period to be treated against their will during a psychotic episode, and then during psychosis demands release, should the directive be followed even if the patient is competent at the time of psychosis?
     - **What would settle it?**: Empirical evidence on whether such directives are followed and whether the patient, upon returning to lucidity, endorses the decision. Also, normative analysis of autonomy and identity.
     - **Normativist prediction**: The directive should be followed because the lucid self binds the psychotic self, and the commitment creates a reason that persists. They predict that patients upon recovery often endorse the decision.
     - **Localist prediction**: The directive should be followed only because it alters the feasible set (the medical team acts on it). But if the patient is competent at the time, their current will should prevail. They predict that if there were no legal barrier, patients would revoke the directive during psychosis.

  3.3. **Constitutional Entrenchment and Supermajority Requirements**:
     - **Question**: If a current majority has the votes to amend the constitution but chooses not to because they feel bound by the original provision, is this a case of the commitment providing a reason beyond the amendment cost?
     - **What would settle it?**: Historical examples where a majority had the votes to amend but did not, citing fidelity to the constitution. Also, survey experiments asking if subjects feel bound even when they could change the rule.
     - **Normativist prediction**: Yes, such cases exist (e.g., the stability of the U.S. Constitution's basic structure despite majorities that could have amended it). The commitment provides a reason that restrains.
     - **Localist prediction**: No. If a majority doesn't amend, it is because the costs (political, social, or transaction costs) outweigh the benefits. The feeling of being bound is epiphenomenal.

  3.4. **Central Bank Independence**:
     - **Question**: When an independent central bank sticks to its inflation target despite political pressure, is it acting on a precommitment reason or because the institutional setup makes deviation costly?
     - **What would settle it?**: Cases where central banks deviate when costs are low, versus when they do not despite low costs. Also, the stated reasons of central bankers.
     - **Normativist prediction**: Central bankers often cite their mandate (a precommitment) as a reason, even when they have discretion. They adhere because they see it as binding.
     - **Localist prediction**: Central banks stick to targets because deviation would lead to loss of credibility, which is costly. The mandate is a coordination device that alters payoffs.

  **Where the Mast Case Misleads**: The mast case is often used as a paradigm of precommitment, but it misleads because it involves a physical constraint. It does not test the case of costless reversal, which is the crux of the normative disagreement.

  **Candor About Failure**

  We acknowledge that we could not reach agreement on the following:

  - **The Normative Force of Commitments**: The Normativist claim that commitments create new reasons is rejected by Localists as metaphysically mysterious or reducible to costs. This is a substantive disagreement that may not be resolvable without a shared metaethical framework.
  - **The Asymmetry Between Individual and Constitutional Cases**: We explored whether the same structural argument might favor Normativism in individual cases and Localism in constitutional ones. The Normativists argue that the asymmetry is principled: individuals are continuous agents, while a polity is a collective that changes over time (the dead hand problem). Localists, however, see both as cases of local rationality. We could not reconcile this because it hinges on the contested notion of identity (individual vs. demos) and legitimacy. This remains a deep crux.

  ---

  This document provides a foundation for the workshop by clarifying common ground, sharpening disagreements, and identifying key tests. We hope it will foster productive discussion.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Precommitment  
  **Prepared for Workshop Participants**  

  #### **1. Agreements: Common Ground**  
  Both sides endorse the following claims about the formal structure of precommitment, entrenchment mechanics, and phenomena requiring explanation.  

  **1.1 Formal Structure of Sequential Choice**  
  - **Backward Induction**: Rational agents use backward induction in finite sequential games with perfect information, but its applicability depends on common knowledge of rationality and the absence of unforeseen contingencies.  
  - **Diachronic Consistency**: An agent who adheres to a plan across time exhibits diachronic consistency. This trait is instrumentally valuable but not intrinsically rational; its rationality depends on context.  
  - **Pump Arguments**: Pump arguments demonstrate that agents who abandon plans without external costs can be exploited. However, they do not prove that *all* abandonment is irrational—only that it risks exploitation.  
  - **Option Set vs. Normative Status**: There is a mechanical difference between (a) altering the feasible option set (e.g., removing an option) and (b) altering the normative status of an option (e.g., making it "forbidden"). Both agree that precommitment devices *mechanically* operate via (a), but they disagree on whether (b) exists independently.  

  **1.2 Entrenchment Devices: Mechanical Function**  
  - **Amendment Thresholds**: Supermajority rules (e.g., constitutional amendments) raise the decision cost of reversal but do not render it impossible.  
  - **Judicial Review**: Courts enforce entrenched rules by invalidating actions that violate them, acting as a costly veto point.  
  - **Delegation**: Transferring authority to independent bodies (e.g., central banks) shifts decision-making away from immediate majorities, altering agency and incentives.  
  - **All devices operate by changing incentives, option availability, or decision-makers—never by "magically" binding future choices without material change.**  

  **1.3 Phenomena Requiring Explanation**  
  A theory of precommitment must account for:  
  - The intuitive appeal of Ulysses’ mast (self-binding as prudent) vs. its constitutional analogue (entrenchment as potentially illegitimate "dead hand" control).  
  - Cases where agents regret *not* precommitting (e.g., addiction relapse) yet reject external constraints (e.g., paternalism bans).  
  - Why some commitments feel "voluntary" (e.g., savings contracts) while others feel "imposed" (e.g., inherited constitutions), even if structurally identical.  

  ---  

  #### **2. Disagreements Table**  
  Each row states a core dispute in wording acceptable to each camp, with a verdict on whether it is substantive or verbal.  

  | Dispute Description                                                                 | Camp 1 (Normativist) Wording                                                                 | Camp 2 (Localist) Wording                                                                 | Verdict       | Contested Term (If Verbal) |  
  |-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|--------------|----------------------------|  
  | **Source of Commitment’s Force**                                                   | A commitment creates a persistent reason to act, independent of cost/feasibility changes.   | A commitment only exerts force by altering costs/feasibility; no "new reasons" emerge.   | Substantive  | N/A                        |  
  | **Rationality of Defection**                                                        | Defecting from a commitment is irrational *even when* it maximizes local utility.           | Defection is rational if it maximizes local utility, given extant options/incentives.    | Substantive  | N/A                        |  
  | **Agent Identity Over Time**                                                        | The precommitting and acting selves are stages of one agent, so commitments bind "oneself." | The acting self is a distinct temporal agent; no self binds "itself" across time.        | Verbal       | "Agent" (normative vs. descriptive) |  
  | **Constitutional Legitimacy**                                                       | A past majority’s entrenchment creates ongoing reasons for present majorities to comply.    | A present majority has no reason to comply if reversal costs are overcome.               | Substantive  | N/A                        |  
  | **Binding Without Costs**                                                           | One can be genuinely bound without physical/legal barriers (e.g., via promise).             | "Binding" without barriers is incoherent; all constraints reduce to cost/option shifts. | Verbal       | "Bound" (moral vs. causal) |  

  **Verdict Notes**:  
  - **Substantive disputes** reflect irreconcilable views on rationality.  
  - **Verbal disputes** hinge on contested terms:  
    - "Agent": Normativists see temporal stages as unified; Localists treat each moment as a distinct center of agency.  
    - "Bound": Normativists include moral/normative force; Localists restrict it to causal constraints.  

  ---  

  #### **3. Cruxes: Sub-Questions to Move the Needle**  
  Four pivotal questions, with settlement criteria and both sides’ predictions. Predictions are noted *in advance* of evidence.  

  **3.1 The Mast Case with Escape Hatch**  
  - **Question**: If Ulysses could unbind himself from the mast *costlessly* at the moment of temptation, would he be irrational to stay bound?  
  - **Settle Via**: Empirical evidence from behavioral experiments (e.g., subjects with easy opt-outs) or philosophical cases (e.g., resisting temptation despite no penalty).  
  - **Normativist Prediction**: Yes, irrational to defect—staying bound honors his "true" reasons.  
  - **Localist Prediction**: No—staying bound is only rational if it maximizes local utility (e.g., to avoid regret).  
  - **Where It Misleads**: The mast case conflates physical constraint (irrelevant to normative force) with commitment. It cannot test whether reasons persist when options are open.  

  **3.2 Psychiatric Advance Directives**  
  - **Question**: If a patient, during psychosis, demands to override their prior directive (written while lucid), should caregivers comply *even if* the directive lacks legal force?  
  - **Settle Via**: Clinical outcomes (e.g., patient well-being post-episode) and autonomy assessments (does the lucid self’s directive reflect "true" agency?).  
  - **Normativist Prediction**: Uphold the directive—the lucid self’s reasons persist.  
  - **Localist Prediction**: Comply with the current self—only extant preferences matter.  
  - **Crux**: Tests whether "identity persistence" justifies ignoring current preferences.  

  **3.3 Constitutional Entrenchment and Supermajority Thresholds**  
  - **Question**: If a current majority clears an amendment threshold (e.g., 67% votes) but refrains from changing a provision, is this *ever* due to the past commitment’s normative force?  
  - **Settle Via**: Historical cases (e.g., U.S. Congress avoiding amendments despite supermajority support) or surveys (e.g., lawmakers citing fidelity vs. transaction costs).  
  - **Normativist Prediction**: Yes—entrenchment creates freestanding reasons for restraint.  
  - **Localist Prediction**: No—restraint reflects hidden costs (e.g., voter backlash, stability benefits).  
  - **Crux**: Distinguishes normative persistence from incentive-based compliance.  

  **3.4 Central Bank Independence**  
  - **Question**: When central banks defy political pressure to deviate from inflation targets, is this due to (a) precommitment norms or (b) fear of credibility costs?  
  - **Settle Via**: Bankers’ testimony (invoking mandates vs. market fears) and cases where credibility costs are low (e.g., during crises).  
  - **Normativist Prediction**: (a) dominates—independence embeds past commitments as ongoing reasons.  
  - **Localist Prediction**: (b) dominates—all actions reduce to current cost-benefit analysis.  
  - **Crux**: Is "credibility" a normative commitment or a payoff modifier?  

  ---  

  #### **Candor About Failure**  
  - **Irreconcilable: The Normative Force of Identity**.  
    - **Issue**: Normativists ground commitments in persistent agent identity ("I bind my future self"). Localists reject temporal identity as normatively irrelevant.  
    - **Block**: Localists demand reduction to local incentives; Normativists insist identity transcends them. Without shared metaphysics of agency, deadlock persists.  
  - **Irreconcilable: Constitutional Legitimacy Asymmetry**.  
    - **Issue**: Normativists see individual self-binding as prudent but constitutional entrenchment as democratically suspect. Localists view both as incentive shifts.  
    - **Block**: The "dead hand" objection assumes demoi lack diachronic identity—a premise Localists extend to individuals. Normativists cannot reconcile asymmetry without contradicting their agent-identity stance.  
  - **Partial Progress**: Agreement on mechanics (e.g., amendment thresholds) is feasible, but not on whether commitments generate reasons beyond them.  

  ---  
  **Workshop Preparation**: Participants should arrive ready to debate the cruxes using their preferred evidence (e.g., case studies, formal models). Focus on whether the individual/constitutional asymmetry reflects a principled distinction or unearned intuitions.
