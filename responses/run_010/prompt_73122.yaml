prompt: |-
  I'm a third-year PhD student in psychology. Last month our lab posted a preregistered replication of a well-known social priming effect: 1,200 participants, roughly ninety percent power to detect the effect size the original authors reported, and a 95% confidence interval running from slightly negative to very slightly positive that excludes their point estimate altogether. The result was null. In the comments on the preprint, a senior researcher from the original lab wrote that our study is uninformative because absence of evidence is not evidence of absence, and that the original effect stands until someone produces a positive result against it. People in my department have been repeating that line back to me ever since, and I genuinely cannot tell whether it is a cheap rhetorical trick or a legitimate caution I am failing to take seriously.

  Could you lay out, as a list, the distinct precise claims that sentence might be making? For each reading I want to know what exactly it asserts, what would have to be true for it to hold, and whether it is a platitude no statistician disputes, a substantive methodological thesis with real content, or simply false. In particular, please make the readings sensitive to three things the slogan itself hides: what the word evidence is being used for (a significance threshold, a likelihood ratio, a shift in a posterior probability); how much power the test that failed to detect the phenomenon actually had; and whether the target being defended is a bare point null or a specific magnitude claim. Then tell me which of those readings, if any, would license the conclusion that our null result carries no evidential weight against the original hypothesis, and which reading you suspect the people repeating the slogan to me have in mind — and whether it survives being made explicit. I'm not after a bibliography; I'll do the reading once I know what to look for.
reasoning: |-
  Alright, the user is a third-year PhD student in psychology who conducted a large-scale replication study with a null result. They're facing criticism from a senior researcher and colleagues who claim that "absence of evidence isn't evidence of absence," arguing that their study is uninformative. The user wants to dissect this claim to understand its validity and whether it's a rhetorical trick or a legitimate point.

  First, I need to break down the slogan into precise claims. The key elements to consider are: how "evidence" is defined (significance, likelihood ratio, posterior), the study's power, and whether the target is a point null or a specific effect size. 

  Starting with the common misinterpretations. The first claim might be about significance testing. If they mean that failing to reject H0 doesn't prove H0, that's a statistical platitude. But in this case, the user has a high-powered study, so their CI excludes the original effect size. That makes the platitude not directly applicable here.

  Next, the Bayesian perspective. If "evidence" means posterior probability, then without a prior, the absence might not shift beliefs much. But with a high-powered study, a flat prior would actually show strong evidence for the null. The senior researcher might be assuming a prior favoring the original effect, which is a substantive claim but not necessarily valid.

  Then, the power consideration. The user mentioned 90% power to detect the original effect size. If power is low, the absence of evidence isn't strong, but here high power means the null result is informative. Claiming otherwise would be false under frequentist or Bayesian frameworks with reasonable priors.

  Another angle is the point null versus specific magnitude. If the original effect is a point null (exactly zero), the study might not disprove tiny effects. But the user's CI excludes the original point estimate, which targets the specific magnitude, not just zero. So the criticism might be shifting the goalposts.

  I suspect the critics are conflating the platitude with the low-power scenario, ignoring the high power of this study. By repeating the slogan, they might not acknowledge the study's design strength. Making the assumptions explicit—like their prior beliefs or ignoring power—would reveal the weakness in their argument.

  The user needs clarity on why their study is informative despite the slogan. Highlighting the high power and the CI excluding the original effect size shows evidence against that specific magnitude. The critics might be protecting their prior work, using a seemingly statistical argument that doesn't hold under scrutiny.
answer: |-
  Here's a breakdown of the distinct claims embedded in "absence of evidence is not evidence of absence," tailored to your context. Each reading is analyzed for its assertion, necessary conditions, validity, and relevance to your study:

  ### Claim 1: **"Failure to reject H₀ doesn't prove H₀ is true" (Significance Testing Platitude)**
  - **Asserts**: Statistical non-significance (p > α) ≠ confirmation of the null hypothesis.
  - **Requires**: Use of NHST with a fixed α (e.g., 0.05). Assumes the test was conducted correctly.
  - **Validity**: Platitude (universally accepted). Failing to reject H₀ *never* proves H₀.
  - **Relevance to your study**:  
    - ✔️ True in isolation, but **misapplied** here.  
    - ❌ Does *not* imply your study is "uninformative." Your CI excludes the original effect size (δₒ), meaning you *have* evidence against δ = δₒ. Ignores power and precision.

  ### Claim 2: **"Low power makes non-significance uninformative" (Power-Based Caution)**
  - **Asserts**: If power is low, a non-significant result is weak evidence for H₀.
  - **Requires**: Power < 80-90% to detect a minimally interesting effect.
  - **Validity**: Substantive methodological truth (widely accepted in statistics).
  - **Relevance to your study**:  
    - ❌ **Does not apply**. Your study had ~90% power to detect δₒ. High power + non-significance *is* strong evidence against δ = δₒ.  
    - ⚠️ Critics may *assume* your power was low (but it wasn’t).

  ### Claim 3: **"Absence of evidence ≠ evidence of absence under a Bayesian prior favoring H₁" (Subjective Bayesian View)**
  - **Asserts**: If your prior strongly favors the original effect (e.g., Pr(H₁) >> Pr(H₀)), a single null result may not shift posterior enough to favor H₀.
  - **Requires**: A Bayesian framework with an informative prior heavily weighted toward H₁.
  - **Validity**: Substantive thesis (valid math, but prior choice is debatable).
  - **Relevance to your study**:  
    - ⚠️ **Could technically hold** if critics adopt an extreme prior (e.g., Pr(δ = δₒ) = 0.99).  
    - ❌ **Not defensible scientifically**: Rejecting well-powered replications based on faith in original results is circular reasoning. Your data *does* lower the posterior probability of δ = δₒ, regardless of prior.  
    - 🔍 Likely what critics *implicitly mean*: They privilege original findings as "established truth."

  ### Claim 4: **"Your CI includes zero, so the effect might exist" (Ignoring the Target Hypothesis)**
  - **Asserts**: Since your CI includes values >0 (e.g., [−0.1, 0.1]), δ could be positive, just smaller than δₒ.
  - **Requires**: Conflating H₀: δ = 0 with H₀: δ = δₒ.
  - **Validity**: **False** when testing δ = δₒ. Your CI *excludes* δₒ, so it *is* evidence against δ = δₒ.
  - **Relevance to your study**:  
    - ❌ **Inapplicable & misleading**. Your target was δₒ (the original effect size), not δ = 0. Critics are shifting goalposts.

  ### Claim 5: **"A single replication can't falsify an established effect" (Extra-Statistical Dogma)**
  - **Asserts**: Original findings have higher epistemic status; replications need overwhelming evidence to override them.
  - **Requires**: A hierarchy where novel claims < replications < original discoveries.
  - **Validity**: Substantive sociological thesis (contested; contradicts replication norms).
  - **Relevance to your study**:  
    - ❌ **Not statistical**: This is about authority, not evidence. Your study *is* informative by scientific standards.

  ---

  ### Which Reading Licenses "No Evidential Weight Against Original Hypothesis"?
  - **Only Claim 3** (strong Bayesian prior for H₁) *mathematically* permits this, but it’s **scientifically indefensible** for replication.  
  - **No statistically valid reading** supports dismissing your result as "uninformative" given your design. High power + exclusion of δₒ *is* evidence against δ = δₒ.

  ### What Critics Likely Mean & Does It Survive Scrutiny?
  - **Likely mindset**: A blend of **Claims 1 + 4 + 5**:  
    - Misapplying the platitude (Claim 1)  
    - Conflating δ = 0 with δ = δₒ (Claim 4)  
    - Prioritizing original findings (Claim 5)  
    *(with possible ignorance of your high power)*.  
  - **Does it survive?**: **No.** When made explicit:  
    - Your CI excludes δₒ → evidence *against original effect size*.  
    - 90% power → high sensitivity to detect δₒ.  
    - Ignoring this conflates statistical caution with motivated reasoning.

  ### What You Should Do Next
  1. **Reframe the debate**:  
     - "Our CI excludes the original point estimate (δₒ = X). With 90% power, this *is* evidence against δ = X."  
     - "Are you arguing that δ could be *smaller* than X? If so, we agree—but that challenges the original claim."  
  2. **Key reading**:  
     - [Lakens (2022)](https://www.tandfonline.com/doi/full/10.1080/00031305.2021.1900642) on equivalence testing and CIs.  
     - [Greenland (2022)](https://journals.sagepub.com/doi/10.1177/25152459221095823) on misinterpretations of "absence of evidence."  
  3. **Stay firm**: Your study *is* informative. Critics are protecting prior beliefs, not engaging with evidence.  

  This slogan is often a **rhetorical shield** for low-replicability findings. By dissecting it, you’ve exposed its statistical emptiness in your case.
