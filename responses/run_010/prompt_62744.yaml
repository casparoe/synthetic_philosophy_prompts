  ### **Debrief (30 mins)**
  **Map the session to concepts** (reveal names/theory now):  
  1. **Discursive dilemma** (structural, not stupidity):  
     - Meeting 1: Majority on premises supported A, and it won—coherent.  
     - Meeting 2: Premises didn’t all pass (P2 failed), but B won on conclusion—incoherent with premises.  
     - Why? Premise-based voting tracks reasons; conclusion-based tracks outcomes. With logical connections (P1∧P2∧P3 → Win), they diverge when no individual holds the full set of "winning" judgments (e.g., only 4/12 in Meeting 2 had all premises for B).  

  2. **Diachronic inconsistency**: Group was coherent at each meeting but contradicted itself on P2 (Accessibility) over time. Shows that sequential decisions by "identical" groups can accumulate errors.  

  3. **Group agency vs. individual**: The letter-signer (e.g., Voter 8 in M1) endorsed a view they disagreed with. The decision belonged to the group, but no individual fully held it.  

  4. **Fixes and costs**:  
     - **Premise-first**: Ensures logical coherence but may ignore preferences (e.g., Topic B won conclusion-based but shouldn’t have).  
     - **Conclusion-first**: Respects preferences but risks incoherent reasoning (e.g., Topic B won without passing premises).  
     - **No group view**: Accept that collectives can’t always be rational—requires abandoning collective decisions.  

  **Predictable issues and fixes**:  
  - **Problem: They smell the trick and vote strategically**. E.g., in Meeting 2, a student might vote against their card to avoid paradox.  
    - *Fix*: Emphasize secrecy and honesty upfront. Use secret ballots. If suspected, say: "Stick to your card—this is about your true view."  
  - **Problem: Confident person steamrolls discussion**.  
    - *Fix*: Chair enforces strict time limits. Rotate chairs to quieter students. Ballots prevent peer pressure.  
  - **Problem: Premise-order debate derails the vote**.  
    - *Fix*: If a student notices order sensitivity, validate it ("Great catch! This is part of the dilemma—order shouldn’t matter, but it can") and move on.  

  **Limitation of paper-and-pencil**:  
  - Real judgment aggregation involves **deference to experts** (e.g., trusting a philosopher on P3). This exercise can’t replicate that nuance—students vote all premises equally. You’ll need to highlight this in debrief: "In reality, you might defer on Accessibility to librarians, but here you had to judge everything yourself."  

  **Final note**: This design guarantees the paradoxes with the profiles provided. Run it as-is, and the dilemmas will land viscerally. The swapped member and signing wrinkle make the incoherence and group-agency tension palpable.
