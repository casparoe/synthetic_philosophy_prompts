  Below is a complete, ready-to-run session plan for your judgment aggregation exercise, designed to make the discursive dilemma emerge experientially. The group acts as a committee deciding which of four candidate topics to study next term. The decision decomposes into three yes/no premises and a conclusion (which topic wins), with the setup ensuring premise-based and conclusion-based voting yield different outcomes. I've incorporated your two core wrinkles—diachronic inconsistency by swapping a member for a second vote, and forcing a student to sign a justification they disagree with—as well as the premise-order sensitivity. The design uses no real money; rewards are symbolic.

  ### **Session Overview**
  - **Duration**: 90 minutes (split into two 30-minute committee meetings + 30-minute debrief).
  - **Participants**: 12 students (11 stay for both meetings; 1 is swapped out for the second meeting).
  - **Decision 1 (Meeting 1)**: Choose a topic for next term based on three premises.
  - **Decision 2 (Meeting 2)**: Same structure, but with a slightly altered proposal (topic list) and one member replaced, causing the group to contradict its earlier decision.
  - **Reward**: Winning topic gets a symbolic "Golden Quill Award" (e.g., a printed certificate) for prestige. No money needed.
  - **Chair Role**: Rotate this—select a different student to chair each meeting (e.g., the quietest person first). This prevents steamrolling.
  - **Voting**: Secret ballots for all votes (use slips of paper) to reduce influence. Premises are voted sequentially in a fixed order, but the design allows premise-order sensitivity to emerge if a student notices it.
  - **Key Documents**: 
    - Private view cards for all 12 students (distributed secretly at the start of each meeting).
    - Full preference profile tables (for you to verify arithmetic).
    - Justification letter template (for the signing wrinkle).

  ---

  ### **Step-by-Step Procedure**
  #### **Setup (Before Session)**
  - **Prepare materials**: 
    - 12 private view cards for Meeting 1 (Table 1 below).
    - 12 private view cards for Meeting 2 (Table 2 below; Voter 12 swapped for Voter 13).
    - Ballot slips (three for premises, one for conclusion per meeting).
    - A "Golden Quill Award" certificate (for the winning topic).
    - A justification letter template (e.g., "The committee awarded Topic [X] because it best met our criteria: [Premise 1], [Premise 2], and [Premise 3].").
  - **Room setup**: Arrange chairs in a circle. Place a whiteboard to record votes.

  #### **Meeting 1: Topic Decision (30 mins)**
  1. **Introduce the scenario** (You, not the chair): "We need to choose a topic for next term. There are four candidates: **Justice (A)**, **Democracy (B)**, **Freedom (C)**, and **Equality (D)**. Today, we’re deciding based on three criteria:  
     - **P1: Relevance**—Is the topic urgently needed in current political debates? (Yes/No)  
     - **P2: Accessibility**—Are foundational texts available and approachable for undergrads? (Yes/No)  
     - **P3: Diversity**—Does the topic allow deep exploration of both analytic and continental philosophy? (Yes/No)  
     The winner is the topic that gets a ‘Yes’ on all three premises. If none do, we default to Topic A (Justice)."  
     *(Don’t reveal the connection between premises and conclusion yet—let them discover it.)*

  2. **Distribute private view cards** (Table 1). Emphasize: "This card shows your personal judgments. Keep it secret. Vote your true views—no strategizing."

  3. **Chair takes over**: Selected chair facilitates:  
     - Opens discussion (5 mins): "Debate which topic to pick. Focus on the conclusion—which topic wins?"  
     - Calls conclusion vote: "Vote for one topic: A, B, C, or D." Tally votes publicly on whiteboard.  
       - *Expected result*: **Topic A wins (7 votes)**. (Topics B/C/D split the rest; see Table 1).  
     - Award the "Golden Quill" to Topic A symbolically.

  4. **Now vote on premises**: "Let’s break this down. Vote on each premise for Topic A only, in this order: P1 (Relevance), then P2 (Accessibility), then P3 (Diversity)." Tally each.  
     - *Expected result*:  
       - P1 (Relevance): 7 Yes, 5 No → Majority Yes.  
       - P2 (Accessibility): 7 Yes, 5 No → Majority Yes.  
       - P3 (Diversity): 7 Yes, 5 No → Majority Yes.  
     - **Paradox emerges**: Premises all pass, so Topic A should win—but they already awarded it. No contradiction yet. Just note the result.

  5. **Force the signing wrinkle**: Assign a student (e.g., Voter 8 from Table 1) to draft and sign a justification letter. Template:  
     > "The committee awards Topic A (Justice) for next term. It met all criteria: urgent relevance, accessible texts, and diverse philosophical perspectives."  
     - *Why this works*: Voter 8 voted **against** Topic A (they preferred B). They must sign a letter endorsing A, despite disagreeing. This creates "stomach-level" discomfort (group agent vs. individual).

  #### **Meeting 2: Altered Topic Decision (25 mins)**
  1. **Alter the scenario** (You): "A new term is starting. Voter 12 has graduated—welcome Voter 13 (a new student). We have the same four topics, but Topic A is replaced with **Power (E)** due to 'new events'. Same premises apply."  
     - *Why this works*: Topics are now Justice (A) → Power (E), Democracy (B), Freedom (C), Equality (D). E is similar to A but distinct enough to justify re-voting.

  2. **Distribute private view cards** (Table 2). Voter 13 replaces Voter 12. Views are tweaked to flip P2 (Accessibility) for Topic B.

  3. **New chair takes over**: Repeat the process:  
     - Discussion (5 mins): Focus on the conclusion.  
     - Conclusion vote: "Vote for one topic: B, C, D, or E." Tally.  
       - *Expected result*: **Topic B wins (6 votes)**. (Topics C/D/E split the rest; see Table 2).  
     - Award "Golden Quill" to Topic B—replacing Topic A’s certificate.

  4. **Vote on premises for Topic B only** (same order: P1→P2→P3):  
     - *Expected result*:  
       - P1 (Relevance): 8 Yes, 4 No → Majority Yes.  
       - P2 (Accessibility): 5 Yes, 7 No → Majority No. *(This flips from Meeting 1!)*  
       - P3 (Diversity): 7 Yes, 5 No → Majority Yes.  
     - **Diachronic inconsistency emerges**: In Meeting 1, P2 passed for Topic A (7Y/5N). In Meeting 2, P2 fails for Topic B (5Y/7N)—despite no change in the actual Accessibility criterion. The group is coherent at each meeting but contradicts itself over time.

  5. **Force another signing**: Assign a student (e.g., Voter 2 from Table 2) to draft/sign a letter for Topic B. Template:  
     > "The committee awards Topic B (Democracy) for next term. It met all criteria: urgent relevance, accessible texts, and diverse philosophical perspectives."  
     - *Why this works*: Voter 2 **agrees** with P1/P3 for B but **disagrees** with P2 (Accessibility). They must endorse the full set, causing cognitive dissonance.

  #### **Premise-Order Sensitivity (Built-In)**
  - **How it emerges**: Premises are voted sequentially (P1→P2→P3). In Meeting 2, if premises were voted P2→P1→P3, P2 would fail first, making the vote stop early (since all premises must pass). A sharp student may notice: "If we voted P2 first, we’d reject Topic B immediately—order matters!"  
  - **Why it works**: Cards are engineered so Topic B only wins because P1 (which passes) is voted first, creating momentum. If P2 is voted first, it fails, and discussion may shift.

  ---

  ### **Full Preference Profiles (For Your Verification)**
  #### **Table 1: Meeting 1 (Topic A - Justice)**
  *Conclusion rule: Award topic if P1=P2=P3=Yes. Default to A if none qualify.*  
  *Students vote for the topic they think wins (conclusion), not premises directly. Premises are only for Topic A.*

