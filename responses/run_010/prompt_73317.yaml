  We are creating a diagnostic instrument titled "Which account of disease do you actually hold?" that meets the specified requirements.

  Step 1: Lay out the logical space with 4-6 cross-cutting axes.

  We are required to have at least two specific axes:

  Axis 1: What is the primary focus? (three distinct poles)
  - Bodily/Mental Condition: Disease is a feature of the body or mind itself, independent of experience or social context.
  - Personal Experience: Disease is defined by the individual's lived experience, such as suffering or limitation.
  - Social Status: Disease is a status conferred by the community, based on social norms and expectations.

  Axis 2: What fixes the reference class for typicality? (multiple poles)
  - Species: Typicality is measured against the entire human species.
  - Sex: Typicality is measured against one's sex (or gender, but note the potential for social construction; we are focusing on biological sex as commonly used in medicine for reference classes).
  - Age Cohort: Typicality is measured against others in the same age group.
  - Local Environment: Typicality is measured against others in the same local environment (e.g., same region, same exposure risks).
  - Historical Period: Typicality is measured against people in the same historical time.
  - Built Environment: Typicality is measured against the environment as it is constructed (e.g., in a world with stairs, inability to climb stairs becomes atypical).

  We need 2-4 more axes. Let's choose:

  Axis 3: What role does harm play?
  - Harm Required: A condition must cause harm (to the individual or to others) to be a disease.
  - Harm Irrelevant: Harm is not necessary; atypicality alone can define disease.
  - Harm Context-Dependent: Harm is defined by the context (e.g., social or environmental) and is necessary but relative.

  Axis 4: Can the disease status change without a change in the underlying condition?
  - Fixed: Once a disease, always a disease, regardless of changes in environment, society, or individual attitude.
  - Mutable: Disease status can change if the context (social, environmental) changes, even if the condition remains the same.

  Axis 5: Is the condition's status dependent on the possibility of medical intervention?
  - Intervention Required: A condition is a disease only if there is (or could be) a medical intervention that can alter it.
  - Intervention Irrelevant: The possibility of intervention does not affect whether a condition is a disease.

  Axis 6: Universality across species?
  - Species-Specific: What counts as disease may differ between species.
  - Universal: The same condition in different species should be classified the same way if it meets the same criteria.

  We have six axes. Now, we must state each axis's poles in one sentence.

  Step 2: Populate the space.

  We need to consider combinations that correspond to views actually defended. We'll name the common ones and note the empty combinations.

  Common views:

  1. Biological Dysfunction View (e.g., Boorse): 
     - Focus: Bodily/Mental Condition
     - Reference: Species-typical (with age and sex adjustments)
     - Harm: Required (but defined biologically as reduction in survival/reproduction)
     - Mutable: Fixed (unless the condition changes)
     - Intervention: Irrelevant
     - Universality: Universal (same for all species)

  2. Harm-Based Normativism (e.g., Wakefield's harmful dysfunction, but note Wakefield is a hybrid):
     - Focus: Bodily/Mental Condition (dysfunction) and Harm (which is social)
     - However, we have separate axes. Let's try to break down:

  We might not be able to capture every hybrid, but we'll try to map.

  Given the complexity, we might have to note that some combinations are held by named theories and others are not. We'll try to list:

  - Pure Naturalism: Focus on condition, reference species, harm irrelevant (or biological harm), fixed, intervention irrelevant, universal.
  - Social Constructivism: Focus on social status, reference historical and social context, harm context-dependent, mutable, intervention irrelevant, not necessarily universal.
  - Experientialism: Focus on personal experience, reference individual life, harm required (as suffering), mutable, intervention required (if it alleviates suffering), not necessarily universal.

  But we must avoid the banned terms. So we describe in the language of the axes.

  We'll create a table in our mind and then name the combinations that are coherent and named.

  Step 2 in the instrument will be a brief summary of the views, but we cannot list all 3*6*... combinations. Instead, we will note that the instrument will reveal which combination of positions the respondent holds by their answers to the cases.

  Given the constraints, we might instead in the scoring key map the answer patterns to the axes and then to the named views.

  For now, we move to the questions.

  Step 3: The instrument: 10-12 questions.

  We have specific cases to include. We design each question as a concrete case with 3-4 answer options. The questions must be counterfactual or comparative.

  List of required cases (one per question):

  1. A condition that was previously classified as a disease and dropped when attitudes changed. Question: what does the pattern of revision show?

  2. A condition that is statistically typical.

  3. An inherited variant that protected against a lethal infection in the past and now has no impairment.

  4. A condition that limits because of the built environment and would not in a different world.

  5. A condition that shortens life and narrows abilities, but the person treasures it.

  6. A condition whose classification is the only thing standing between a family and paid leave.

  7. The same affliction in a grapevine or a dairy cow vs. a person, and whether one account gives the same verdict.

