answer: |-
  ### Diagnostic Instrument: Which Account of Disease Do You Actually Hold?  
  *For workshop participants: Answer based on your immediate reactions. Choose one option per question.*

  ---

  #### **Part 1: Axes of Variation**  
  Accounts of disease differ along these independent dimensions. You might hold strong views on one axis and weak views on another.  

  1. **Focus**:  
     - **Body/Mind**: Disease is about a bodily or mental condition itself, regardless of what the person feels or society says.  
     - **Experience**: Disease is about what the person lives through (e.g., pain, limits on activities).  
     - **Social Status**: Disease is a label given by a community based on shared expectations.  

  2. **Reference Class**:  
     - **Species**: What’s typical for the human species as a whole.  
     - **Sex**: What’s typical for one’s biological sex.  
     - **Age Cohort**: What’s typical for people in your age group.  
     - **Local Environment**: What’s typical for people in your immediate surroundings (e.g., pollutants, diet).  
     - **Historical Period**: What’s typical for people in your era.  
     - **Built Environment**: What’s typical in a world structured a certain way (e.g., with stairs, screens, or cities).  

  3. **Harm Requirement**:  
     - **Harm Required**: A condition must cause damage (e.g., shorter life, physical injury) to be a disease.  
     - **Harm Not Required**: Atypicality alone defines disease, even without damage.  
     - **Harm Contextual**: Harm depends on circumstances (e.g., society’s resources, personal goals).  

  4. **Change Without Biological Shift**:  
     - **Fixed Status**: Disease status cannot change unless the condition itself changes biologically.  
     - **Mutable Status**: Disease status can change if society, environment, or personal priorities shift.  

  5. **Species Uniformity**:  
     - **Species-Specific**: A condition may be a disease in humans but not in other species (or vice versa).  
     - **Universal**: The same condition gets the same disease label in humans, animals, or plants.  

  ---

  #### **Part 2: Questions**  
  *Answer all questions. Each describes a real or hypothetical scenario. Choose **A**, **B**, or **C**.*  

  1. **Historical Revision**: In the 1800s, physicians treated "hysteria" (restlessness, anxiety) in women as a disease. Today, it is not classified as one. What does this shift suggest?  
     - A) The condition was always a disease, but we now manage it without the label.  
     - B) The condition was never a disease; it reflected expectations about women’s behavior.  
     - C) The condition stopped being a disease once society changed its view of women’s roles.  

  2. **Statistically Typical**: In a village where 90% of people have a gene causing joint stiffness (with no pain or limits), is this gene atypical?  
     - A) No, because it’s common there.  
     - B) Yes, because it’s rare in the global population.  
     - C) Only if the villagers see it as a problem.  

  3. **Protective Trait**: A person carries a gene that caused severe anemia in ancestors exposed to a deadly parasite. Today, with no parasites, it causes no symptoms. Is this gene harmful?  
     - A) Yes, because it still carries anemia risk for offspring.  
     - B) No, because it doesn’t affect the carrier’s life now.  
     - C) Only if modern medicine defines it as risky.  

  4. **Built World Limits**: Someone born without leg mobility uses a wheelchair. In a city with only stairs, they can’t enter buildings. If ramps were everywhere, would their condition cause limits?  
     - A) Yes, because their legs still don’t move.  
     - B) No, because ramps remove the barriers.  
     - C) Only if they feel limited by their body.  

  5. **Cherished Condition**: A person has deafness that shortens life expectancy and narrows opportunities, but they treasure it as part of their identity and reject a cure. If cured, would their past experience change?  
     - A) No, their body was still damaged.  
     - B) Yes, because they never felt limited.  
     - C) It would depend on whether society sees deafness as a problem.  

  6. **Paid Leave Dependency**: A child’s rare genetic trait qualifies a family for paid care leave only if called a disease. The trait causes no harm. Should the label change if leave policies expand?  
     - A) No—the label is about the trait, not policies.  
     - B) Yes—the label was always about the family’s needs.  
     - C) Only if new science redefines the trait.  

  7. **Grapevine vs. Human**: A fungus kills grapevines by rotting roots. In humans, the same fungus causes a mild rash that heals in days. If grapevine rot is a disease, must the human rash be one?  
     - A) Yes, because the biological cause is identical.  
     - B) No, because the human isn’t harmed.  
     - C) Only if humans consider rashes problematic.  

  8. **Grief Withholding**: After a spouse dies, someone has insomnia, weight loss, and despair matching clinical depression. Doctors often withhold the diagnosis. Should they?  
     - A) No—identical experiences deserve identical labels.  
     - B) Yes—this reflects a normal life event, not a bodily flaw.  
     - C) Only if symptoms exceed cultural norms for grief.  

  9. **Disagreeing Communities**: Community A calls nearsightedness a disease because uncorrected vision limits work. Community B (where glasses are universal) does not. Can both be right?  
     - A) No—nearsightedness either is or isn’t a disease.  
     - B) Yes—labels depend on a community’s way of life.  
     - C) Only if they use different scientific criteria.  

  10. **Environmental Harm**: A person with extreme sun sensitivity gets blisters in sunny climates but has no issues in cloudy ones. If they move permanently to a cloudy area, does the sensitivity cause damage?  
      - A) Yes—their skin still reacts to sun.  
      - B) No—without sun exposure, nothing happens.  
      - C) Only if they avoid sunny places forever.  

  11. **Species Comparison**: Dairy cows with a virus producing harmless extra milk are called diseased. If humans had the same virus with identical effects, must it be a disease?  
      - A) Yes—the biological effect is the same.  
      - B) No—humans might value extra milk.  
      - C) Only if it violates human social norms.  

  12. **Atypical and Unharmed**: A person has six fingers per hand, fully functional and painless. If society considered this "ugly," would that make it damaging?  
      - A) No—the body works fine regardless of opinions.  
      - B) Yes—social rejection can limit opportunities.  
      - C) Only if the person feels distressed by it.  

  ---

  #### **Part 3: Scoring Key**  
  *For facilitator use only. Map answers to axes and named positions. Identify tensions.*  

  **Named Positions from Axis Combinations**:  
  - **Biomedical Essentialism**: Focus = Body/Mind; Reference = Species/Sex/Age; Harm = Required; Change = Fixed; Species = Universal. *Claims*: Disease is a bodily flaw measurable by species-typical function.  
  - **Experiential Harm**: Focus = Experience; Reference = Local Environment; Harm = Required; Change = Mutable; Species = Species-Specific. *Claims*: Disease is defined by what limits or hurts the person in their context.  
  - **Social Functionalist**: Focus = Social Status; Reference = Historical Period/Built Environment; Harm = Contextual; Change = Mutable; Species = Species-Specific. *Claims*: Disease is a label for traits that disrupt social expectations or systems.  
  - **Empty Combinations**:  
    - Focus = Body/Mind + Harm Not Required → *Incoherent* (body/mind focus requires harm to distinguish disease from benign variation).  
    - Focus = Experience + Change = Fixed → *Coherent but unattractive* (personal experience can’t be "fixed" if circumstances shift).  
    - *Other unexplored combinations exist but lack real-world defenders*.  

  **Scoring Steps**:  
  1. **Map answers to axes** using the guide below.  
  2. **Identify primary position** for consistent patterns (e.g., all answers align with Social Functionalist).  
  3. **Flag tensions** where two answers imply conflicting axes. Do not average. State:  
     - *Which questions conflict*  
     - *Which axes are opposed*  
     - *What follow-up question resolves it*  

  **Answer-to-Axis Map**:  
  - Q1: A → Change = Fixed; B → Focus = Social Status; C → Change = Mutable, Reference = Historical Period.  
  - Q2: A → Reference = Species/Local; B → Reference = Irrelevant; C → Focus = Social Status.  
  - Q3: A → Harm = Required; B → Harm = Not Required; C → Harm = Contextual.  
  - Q4: A → Focus = Body/Mind; B → Change = Mutable; C → Focus = Experience.  
  - Q5: A → Harm = Required; B → Focus = Experience; C → Focus = Social Status.  
  - Q6: A → Focus = Body/Mind; B → Focus = Social Status; C → Change = Mutable.  
  - Q7: A → Species = Universal; B → Harm = Required; C → Species = Species-Specific.  
  - Q8: A → Focus = Body/Mind; B → Focus = Experience; C → Reference = Historical Period.  
  - Q9: A → Change = Fixed; B → Change = Mutable; C → Reference = Built Environment.  
  - Q10: A → Harm = Required; B → Harm = Not Required; C → Harm = Contextual.  
  - Q11: A → Species = Universal; B → Species = Species-Specific; C → Focus = Social Status.  
  - Q12: A → Harm = Not Required; B → Harm = Contextual; C → Focus = Experience.  

  **Tension Examples**:  
  - Conflict: Q3 (B: Harm Not Required) + Q5 (A: Harm Required)  
    - *Why*: You can’t require harm for disease in Q5 but reject it in Q3.  
    - *Resolve with*: "Can a trait be a disease if it causes no harm?"  
  - Conflict: Q1 (C: Change = Mutable) + Q6 (A: Change = Fixed)  
    - *Why*: Q1 allows labels to change with society; Q6 insists they’re fixed.  
    - *Resolve with*: "Can a condition stop being a disease if society’s view changes?"  

  **Limits of the Instrument**:  
  - **Biomedical vs. Experiential Harm on Harm Requirement**: Unreachable if cases involve measurable damage (Q5, Q10). *Why*: Both positions agree harm exists but disagree on whether it’s necessary.  
  - **Species Uniformity vs. Species-Specific on Non-Human Cases**: Unreachable. *Why*: Cases like Q7 and Q11 force a human/non-human comparison, but positions here often share verdicts.  
  - **Social Status vs. Experience on Non-Distress Cases**: Unreachable. *Why*: When social labels and personal experience align in cases (e.g., Q12C), the positions collapse.  

  ---  
  **Facilitator Notes**:  
  - Time: 5 min for axes, 15 min for questions, 15 min for scoring discussion.  
  - During discussion, use tensions to prompt self-reflection: "John, your Q4 and Q9 answers pull apart on whether environment changes disease status. How do you reconcile that?"  
  - Avoid theory names; use axis descriptions (e.g., "You emphasized bodily condition in Q4 but social needs in Q6").
