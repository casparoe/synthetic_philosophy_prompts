  ### Workshop Design: "Harmonyville Renewables Pilot"  
  **Objective:** Simulate how true information can lead to collective errors through biased sampling and attention economics—no deception involved.  

  ---

  ### **Fictional Setting & Ground Truth**  
  **Setting:** Harmonyville is testing a renewable energy scheme in the "Greenhaven" district:  
  - Free solar panel installations for 100 homes.  
  - Subsidized electric vehicle (EV) charging stations.  
  - **Ground Truth (known only to you)**:  
    - **Satisfaction Rate**: 65% of residents are satisfied (35% are not).  
    - **Emissions Reduction**: 80 tons/month CO₂ reduction.  

  ---

  ### **Materials List**  
  - **Paper & Pens**: For note-taking.  
  - **Whiteboard**: Divided into 4 sections (one per "channel").  
  - **40 Statement Cards** (10 per channel, see template below).  
  - **Token System**: 12 sticky notes (3 per channel) + markers.  
  - **Timer**.  

  ---

  ### **Statement Card Template**  
  Generate 40 cards (mix positive/negative/neutral). **All statements are true** but vary in emotional weight. Examples:  

  | Topic          | Positive (Aligned w/Truth)                          | Negative (Aligned w/Truth)                          | Neutral                     |
  |----------------|-----------------------------------------------------|-----------------------------------------------------|-----------------------------|
  | **Satisfaction** | “70% of surveyed households report lower energy bills.” | “30% of households report installation delays.”     | “Solar panels installed in 100 homes.” |  
  | **Emissions**    | “EV stations reduced gas consumption by 40%.”         | “Some residents still use gas cars due to EV cost.” | “CO₂ levels monitored monthly.” |  

  **Sampling Bias by Channel** (adjust card counts to skew perceptions):  
  - **Channel 1 (Optimistic)**: 7 positive, 2 negative, 1 neutral.  
  - **Channel 2 (Pessimistic)**: 2 positive, 7 negative, 1 neutral.  
  - **Channel 3 (Mixed-Lean-Positive)**: 5 positive, 4 negative, 1 neutral.  
  - **Channel 4 (Mixed-Lean-Negative)**: 4 positive, 5 negative, 1 neutral.  

  ---

  ### **Rules & Run Sheet (90 Min Total)**  
  #### **Phase 1: Setup (10 min)**  
  - Split into 4 channels (4–5 people each).  
  - Explain: *“You’re news editors. You’ve received 10 true reports about Harmonyville’s pilot. Your goal: Forward the 3 most striking reports to the public board. You’ll then estimate satisfaction (%) and emissions reduction (tons), and vote on continuing the pilot.”*  

  #### **Phase 2: Channel Discussion (15 min)**  
  - Give each channel 10 cards.  
  - **Task 1**: Discuss reports. **Secretly write initial estimates** for satisfaction/emissions (fold and set aside).  
  - **Task 2**: Choose 3 reports to forward to the whiteboard.  

  #### **Phase 3: Public Board & Attention Economy (20 min)**  
  1. **Forwarding (5 min)**: Each channel posts 3 reports in their whiteboard section.  
  2. **Token Allocation (10 min)**:  
     - Each channel gets 3 sticky notes (tokens).  
     - Channels award tokens to **other channels’ reports** they find “striking” (not their own).  
     - **Scoring**: 1 token = 1 point. Most points wins "visibility bonus" (see below).  
  3. **Tally Points (5 min)**: Announce scores. Highest scorer gets the **Visibility Bonus**: Their recommendation is presented *last* (influencing final debate).  

  #### **Phase 4: Final Estimates (15 min)**  
  - Channels discuss **all visible reports** (their 10 + the 12 on the board).  
  - **Commit to**:  
    - Satisfaction estimate (%).  
    - Emissions estimate (tons).  
    - Recommendation: “Continue,” “Modify,” or “Cancel” pilot.  

  #### **Phase 5: Reveal & Debrief (30 min)**  
  1. **Reveal Ground Truth**: 65% satisfaction, 80 tons reduction.  
  2. **Map Errors**:  
     - **Sampling Bias**: Compare each channel’s *initial* (secret) estimate to ground truth.  
       - *e.g., “Channel 1’s initial estimate was 75% satisfaction because they saw 7 positive cards. Sampling bias added +10% error.”*  
     - **Attention Skew**: Compare *final* estimate to *initial* estimate.  
       - *e.g., “Channel 1’s final estimate was 85%—they amplified error by +10% by favoring striking positive reports.”*  
  3. **Calculate Error Sources**:  
     | Error Source      | Formula                                  |  
     |-------------------|------------------------------------------|  
     | Sampling Bias     | `(Initial Estimate - Ground Truth)`      |  
     | Attention Skew    | `(Final Estimate - Initial Estimate)`    |  
     | Total Error       | `(Final Estimate - Ground Truth)`        |  

  ---

  ### **Predictable Issues & Fixes**  
  - **Problem**: A channel detects sampling bias early (“We only see 10 reports!”).  
    - **Mitigation**: Affirm their observation but keep time pressure high: *“As editors, you must act on available info—decisions are due in 5 minutes.”* Most groups will still prioritize “striking” reports.  
  - **Problem**: Token allocation is arbitrary (not based on report content).  
    - **Mitigation**: Remind groups: *“Award tokens to reports that feel urgent or memorable.”* In debrief, highlight how this mirrors algorithmic engagement bias.  

  ---

  ### **Design Limitation**  
  **What this misses**: **Prior beliefs and identity-driven reasoning**.  
  - Real echo chambers often form when people *defend preexisting identities* (e.g., rejecting facts that threaten group loyalty). Here, participants lack skin in the game.  
  - **Bridge in discussion**: *“In reality, we ignore information that conflicts with our identity. How might that worsen what we saw today?”*  

  ---

  ### **Why This Works**  
  - **No deception**: Errors emerge from curation, not lies.  
  - **Quantifiable debrief**: Isolates sampling vs. attention skew numerically.  
  - **Real-world parallel**: Simulates how algorithms/editors amplify engaging (but unrepresentative) truths.  

