answer: |-
  You've hit on a profoundly important and under-discussed phenomenon in perception, semiotics, and design. What you're describing goes beyond typical "context effects" and touches on core questions about **where identity resides** and **how forms become meaningful**. There isn't a single perfect, universally agreed-upon term, but several established concepts converge on your observation, revealing its edges and implications:

  1.  **Contextual Determination (or Contextual Emergence) of Identity:** This is the most direct description. The identity of the ambiguous glyph isn't inherent; it's *determined* or *constituted* by its relationship to its neighbors within the specific gestalt (whole form) of the word. The neighbors aren't just clues; they are *constitutive* of the identity.
      *   **Edge:** This happens when the ambiguous glyph shares critical structural features with *multiple* potential letters (like your n/h sharing a vertical stem and curved exit). The context provides the *missing structural information* that resolves the ambiguity by completing the pattern (e.g., defining the counter shape - the enclosed space).

  2.  **Emergent Features:** This is crucial for your "thicken the stroke/lean the neighbors" observation. The identity isn't just in the glyph or just in the neighbors, but in features that *emerge* from their *interaction*.
      *   **Example:** The counter (enclosed space) between the `t` and your ambiguous glyph. If the `t`'s crossbar is high/thick and the ambiguous glyph's curve starts low, the space between them might form a distinct, closed counter characteristic of an `h`. If the `t`'s crossbar is lower/thinner and the ambiguous curve starts higher, the space might remain open, forming the open counter of an `n`. This counter *emerges* from the relationship, not from either glyph alone. Changing the neighbor changes the emergent feature, changing the identity.
      *   **Edge:** Identity shifts when the context changes an *emergent structural feature* (like counter shape, baseline alignment continuity, or stroke-weight rhythm) that is diagnostic for one letter category over another. If the change doesn't alter such a defining emergent feature, the identity might remain ambiguous or just "hard to read".

  3.  **Gestalt Principles (Specifically Pragnanz and Contextual Influence):** Your brain seeks the "best," simplest, most stable interpretation of the whole. An ambiguous shape within a word pattern will be interpreted in the way that creates the *most coherent, stable, and probable whole*.
      *   **Edge:** Context settles the identity when *only one interpretation* creates a stable, familiar, expected gestalt (word form). If both interpretations create plausible words/gestalts, ambiguity persists. Your "`a` disappearing" happens when the *whole pattern* becomes unstable or unfamiliar due to stylistic clash – the gestalt collapses, and the individual forms lose their functional role as letters within a word unit.

  4.  **Top-Down Processing in Perception:** Our expectations, knowledge (of language, letterforms), and the surrounding pattern actively shape how we perceive the sensory input.
      *   **Edge:** Context *settles* identity when bottom-up sensory data (the glyph itself) is insufficient to uniquely specify a category. The top-down influence (expectation of a word) doesn't just nudge; it *fills in* the missing information based on the probable whole. It becomes the primary determinant.

  5.  **The Word Superiority Effect (WSE) - Extended View:** While the classic WSE shows letters are recognized better in words, your observation takes it further: the *identity itself* of an ambiguous glyph is *defined* by its position in a word context. The letter isn't recognized *despite* ambiguity; its *very category membership* is assigned by the context.

  **Addressing Your Specific Questions:**

  *   **When does context settle identity vs. nudge a guess?**
      *   **Settles:** When the ambiguous shape lacks *diagnostic features unique to one category* and relies on *emergent features* created with neighbors (like the counter between `t` and your glyph, or the x-height continuity). When bottom-up data is truly insufficient alone.
      *   **Nudges:** When the shape has weak but present diagnostic features for one category, and context provides probabilistic support (e.g., knowing `q` is usually followed by `u` might nudge a slightly ambiguous `u`). The guess exists independently but is strengthened.

  *   **Can a shape have *no* letter identity within a word? How to tell?**
      *   **Yes, absolutely.** This is your "`a` disappears" scenario.
      *   **How to tell:**
          *   **Loss of Gestalt:** The word fails to cohere as a recognizable unit. It looks like disjointed marks, not a word.
          *   **Failure of Emergence:** The critical emergent features needed to define letters (counters, consistent baseline, rhythmic stroke flow) are disrupted by stylistic clash or incongruity.
          *   **Active Confusion:** Viewers don't just struggle to read it; they actively report it "doesn't look like letters" or "looks like gibberish/symbols." It ceases to function linguistically within that setting.
      *   **Vs. Hard to Read:** A hard-to-read letter still participates in the gestalt. Viewers perceive a word, even if they misread it initially or need effort. The letterform still *contributes* to a perceived linguistic unit, even if imperfectly. The "disappeared" letter breaks the unit.

  *   **Philosophy Taking "Identity Lives Outside" Seriously:**
      *   **Structuralism (Saussure):** Meaning (and thus identity) arises purely from *differences* and *relationships* within a system. An "n" is "n" because it's *not* "h", "m", "r", etc. Its identity is relational, not inherent. Your observation is a direct perceptual manifestation: the glyph *becomes* "n" in relation to the `t` precisely because that combination differentiates it from the "h" possibility in another context.
      *   **Extended Mind / Cognition (Clark & Chalmers):** Argues that cognitive processes aren't confined to the skull but extend into the environment. The "letter identification process" literally incorporates the neighboring strokes as constitutive elements. The identity *is* the product of the brain+glyph+context system.
      *   **Embodied Cognition:** Perception is action-oriented. The identity of the glyph is tied to its *role* in the action of reading *this specific word*. Change its role (by changing the word), change its identity. Its "a-ness" is defined by how it functions *here*.
      *   **Phenomenology (Merleau-Ponty):** Emphasizes that meaning arises in the lived experience of perception. The "being" of the glyph *as a letter* emerges within the whole perceptual field of the word. Its isolated form has only potential; its actual identity is realized in context.

  **The Core Concept: Emergence within Contextual Perception**

  The most encompassing description is that **letter identity is an emergent property arising from the interaction of a visual form within a specific contextual gestalt (the word and its stylistic coherence).**

  *   **Why your identical glyph flips:** Changing the neighbor changes the *emergent relational features* (counters, spacing, rhythm) that are diagnostic for letter categories. The `t` + ambiguous glyph system *emerges* as "tn"; a different neighbor system *emerges* as "?h". The identity property emerges at the system level.
  *   **Why your `a` disappears:** Stylistic clash disrupts the coherence of the *whole gestalt*, preventing the emergence of a stable word perception. The individual form loses its functional role within that failed system, so its "letterhood" vanishes in that specific context.

  **In short:** You're observing that in lettering (and arguably, all meaningful perception), **identity is not an intrinsic property of an isolated form, but a relational property that emerges from its situatedness within a coherent system.** The philosophy absolutely takes this seriously – it challenges the notion of isolated, self-contained meaning. Your hand-lettering practice is giving you a direct window into profound questions about perception, meaning, and the nature of signs. Keep exploring it – it's a rich territory!
