prompt: |-
  I do hand-lettering, and there's a pattern I keep running into that I've never seen named anywhere. Sometimes I'll draw a shape that's honestly ambiguous on its own — a stem-and-shoulder thing that could be an n or a sloppily drawn h — and which letter it is gets settled entirely by what's sitting next to it. Put it after a t in the middle of a word and everyone reads n; put it at the end of the word and they read h. What gets me is that I can flip the reading without touching the shape at all. Thicken the stroke of the letter to it's left, or lean the neighbours over a bit, and the identical glyph starts reading as the other one. So the letter's identity seems to live partly outside the letter.

  It runs the other way too. A shape I'd swear was an obvious a can start looking like nothing at all if I set it between letters that clash with it stylistically — it doesn't become a different letter, it just stops being one.

  I know people talk about prototypes and family resemblance, but those are about blurry edges within a single setting. Here the setting is doing the identifying — the neighbours aren't just evidence I weigh, they change what the thing is. So: is there an established concept for that? And I don't want just a label to go look up, I want the edges of it. When does context actually settle which category something falls in, as opposed to nudging a guess that was already there? Is there such a thing as a shape with no letter identity at all even inside a word, and how would you tell that apart from one that's merely hard to read? And does any of the philosophy on this — not just the psychology of reading — take the "identity lives outside the thing" part seriously, or does everything treat the neighbours as optional extra information?
reasoning: |-
  Okay, the user is into hand-lettering and has noticed something fascinating. They describe a situation where the identity of a letter isn't fixed but changes based on context. For example, a shape could look like an "n" or an "h" depending on the surrounding letters. They emphasize that they don't alter the shape itself; it's the neighbors that flip its interpretation. Also, a clear "a" can become unrecognizable if the adjacent letters clash stylistically. 

  The user wants to know if there's a named concept for this phenomenon. They're not just looking for a term but want to understand its boundaries: when context determines the category versus just providing clues, whether a shape can lack identity entirely, and if any philosophy addresses the "identity outside the thing" idea. 

  First, I need to recall relevant concepts. From psychology, there's the word superiority effect, where letters are recognized better in words than in isolation. But that's about recognition, not identity shifting. Top-down processing fits because context influences perception. Ambiguous figures like the duck-rabbit come to mind, but those are static and not dependent on adjacent elements. 

  Gestalt principles like Pragnanz and contextual influence explain how context organizes perception. In reading, emergent features like counters (enclosed spaces) matter—changing adjacent strokes can alter these features. For example, thickening a stroke might close a counter, turning an "n" into an "h". 

  The key is emergent features: properties that arise from combinations of elements. The user’s observation about thickening a neighbor’s stroke changing the letter’s identity points to this. The counter (enclosed space) between letters isn't inherent to one glyph but emerges from their interaction. 

  Regarding a shape with no identity: if stylistic clash disrupts the word's gestalt, the letter loses its function as part of a word unit. It becomes a mere shape because the cohesive perception breaks down. This differs from a hard-to-read letter, which still fits the gestalt but requires effort. 

  Philosophically, extended mind theory might apply—where cognitive processes extend into the environment. Here, the letter’s identity relies on external elements, making the mind extend to the context. Structuralism in semiotics sees meaning in relationships, not isolated signs. 

  The user’s deeper need might be validation of their observation as a recognized phenomenon and understanding its mechanisms. They might also seek terminology to communicate this in their field or explore its implications for design. 

  To answer: the core concept is emergent features within contextual perception. Terms like "contextual determination" or "emergent letter identity" cover it. The boundaries: context settles identity when emergent features (like counters) are created or destroyed by neighbors. A shape loses identity when stylistic clash prevents cohesive word perception. Philosophically, extended mind and structuralism take the "identity outside" seriously. 

