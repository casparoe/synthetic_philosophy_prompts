prompt: |-
  I'm writing the final for an upper-level seminar that's half classics, half ethics, on biography and moral education, and I need one essay question worth 20 marks, answerable in 45 minutes, on how Plutarch thinks we're supposed to learn from lives. Trouble is everybody will just recite the lives-not-histories line from the Alexander proem plus some version of the mirror-of-virtue topos and think they're done. I want the question to sit on the awkward cases instead: Plutarch gives us full Lives of Alcibiades, Coriolanus and Antony — men nobody would hold up as a mirror — and then closes most of the pairs with a synkrisis weighing the Greek against the Roman. So what is the reader supposed to do with a life that isn't a model, and what does the comparison add if the answer isn't just "rank them"? Ideally it also forces a contrast with hagiography, where the saint isn't offered for replication at all and the right response is veneration rather than imitation — whats gained or lost when a life stops being a mirror and becomes a relic, so to speak. Closed book, and don't require quotations: I want argument, not recall of chapter numbers. Give me the question, a model answer of around 700 words, and a marking scheme that names the specific moves an A answer has to make with marks attached, plus the mistakes that should cost points — e.g. assuming every Life is an exemplum, or treating a synkrisis as a scoreboard.
