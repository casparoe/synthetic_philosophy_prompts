answer: |-
  Here's a comprehensive exam package addressing your requirements, focusing on Plutarch's complex pedagogy through problematic lives and synkrisis, while contrasting with hagiography.

  **Essay Question (20 Marks):**

  "Plutarch explicitly states in the *Life of Alexander* that his aim is moral improvement through studying lives, acting as 'a sort of looking-glass' reflecting virtue and vice. Yet he provides full *Lives* of deeply flawed figures like Alcibiades, Coriolanus, and Antony, and concludes most pairs with a *synkrisis* comparing Greek and Roman subjects. Given this apparent tension, **how does Plutarch intend readers to learn morally from lives that are not straightforward models for emulation, and what distinct moral purpose does the *synkrisis* serve beyond simply ranking subjects?** In your answer, also consider how Plutarch's approach differs fundamentally from hagiography, where the saint serves as a relic for veneration rather than a mirror for imitation. What is gained or lost in Plutarch's method?"

  ---

  **Model Answer (Approx. 700 words):**

  Plutarch’s stated aim of moral improvement through biography, framed by the mirror metaphor, risks oversimplification if applied rigidly to every *Life*. While figures like Pericles or Cato might seem direct models, the inclusion of complex, morally ambiguous, or deeply flawed subjects like Alcibiades, Coriolanus, and Antony reveals a more sophisticated pedagogy. Plutarch’s method transcends simple emulation, utilizing negative exempla, nuanced psychological analysis, and the structural device of the *synkrisis* to provoke active moral reasoning rather than passive imitation. This approach fundamentally differs from hagiography, preserving critical engagement and realism at the cost of unambiguous edification.

  Lives that are not models serve several key functions. Firstly, they act as potent **negative exempla**, demonstrating the catastrophic consequences of vice, unchecked passion, or flawed character traits. Alcibiades' dazzling brilliance, juxtaposed with his corrosive ambition and lack of scruple, vividly illustrates how extraordinary talent, divorced from virtue, leads to personal and civic ruin. Secondly, Plutarch uses flawed lives to explore the **complex interplay of virtues and vices within an individual**, showing that character is rarely monolithic. Antony’s genuine generosity and courage coexist destructively with his hedonism and political naiveté, compelling readers to analyze how strengths can become weaknesses in context. Thirdly, such lives force readers to **grapple with moral ambiguity and contingency**. Coriolanus' rigid virtue (courage, integrity) becomes toxic and anti-social, highlighting the dependence of virtue on circumstance, judgment, and community. The reader isn't told "be like this" but rather prompted to ask: "Where did he go wrong? How could virtue manifest differently? What contextual factors enabled his downfall?" This active interrogation cultivates prudence (*phronesis*) – the ability to discern right action in complex situations – which is more valuable than rote imitation.

  The *synkrisis* is crucial to this pedagogy and is fundamentally misunderstood as a mere ranking exercise. Its primary purpose is **dialectical and analytical**, not judgmental. By placing a Greek and Roman figure side-by-side (even flawed ones), Plutarch forces a deeper comparative analysis. Comparing, say, Alcibiades (Greek) and Coriolanus (Roman) isn't about declaring a "winner" but about **illuminating the specific character traits, cultural values, political systems, and historical contexts** that shaped their actions and downfalls. It highlights how similar flaws (pride, inflexibility) manifest differently in Athenian democracy versus the early Roman Republic. The *synkrisis* trains the reader in **discernment**, identifying subtle distinctions in motivation, the interaction of personality with environment, and the relative weight of different virtues and vices. It transforms biography from isolated narrative into a comparative ethical laboratory, deepening the reader's understanding of character (*ethos*) and fortune (*tyche*) by revealing patterns and contrasts.

  This method sharply contrasts with hagiography. Saints' lives function as **relics for veneration**. They present near-perfect, transcendent models whose purpose is to inspire awe, devotion, and unquestioning emulation of specific holy virtues (asceticism, martyrdom, miraculous piety). Complexity, ambiguity, and significant moral failure are erased to preserve the ideal. The appropriate response is **passive reverence** and a call to conform to a divine archetype. Plutarch, however, treats his subjects as **human exemplars for critical engagement**. His flawed lives preserve complexity, showing greatness intertwined with weakness. What is **gained** is realism, psychological depth, and the cultivation of active ethical judgment suited for the messy realities of political and personal life. Readers learn to navigate nuance, weigh competing values, and understand the causes of failure. What is **potentially lost** is the clear, unambiguous moral directive and the transcendent inspiration offered by hagiography. Plutarch offers tools for ethical navigation in a contingent world, not a perfected roadmap to sainthood. The mirror, in Plutarch’s hands, reflects not just idealized virtue, but the full, often distorted, spectrum of human possibility, compelling the reader to become an active interpreter and judge, learning as much from catastrophe as from triumph.

  ---

  **Marking Scheme (20 Marks Total):**

  **An A/A+ Answer (17-20 Marks) MUST demonstrate:**

  1.  **Addresses the Core Tension (4 marks):** Explicitly acknowledges the apparent contradiction between the "mirror" goal and the inclusion of deeply flawed lives/synkrisis. Avoids assuming all lives are positive exempla.
  2.  **Explains Learning from Flawed Lives (5 marks):** Clearly articulates *specific* pedagogical functions beyond simple emulation:
      *   Negative exempla/consequences of vice (1 mark).
      *   Analysis of complex virtue/vice interplay within an individual (1 mark).
      *   Engagement with moral ambiguity/contingency (1 mark).
      *   Cultivation of prudence (*phronesis*) through active questioning (1 mark).
      *   Uses specific examples (Alcibiades/Coriolanus/Antony) effectively (1 mark).
  3.  **Analyzes the Synkrisis (5 marks):** Moves beyond ranking:
      *   Identifies dialectical/comparative analysis as core purpose (1 mark).
      *   Explains how it illuminates character traits, cultural contexts, systems (2 marks).
      *   Argues it cultivates discernment and deeper understanding of *ethos/tyche* (1 mark).
      *   Uses an example (e.g., comparing flaws across cultures) (1 mark).
  4.  **Contrasts with Hagiography (4 marks):**
      *   Clearly defines hagiography (relic, veneration, transcendence, erased complexity) (1 mark).
      *   Clearly defines Plutarch's difference (human exemplar, critical engagement, preserved complexity) (1 mark).
      *   Articulates what is *gained* in Plutarch (realism, active judgment, prudence, understanding causality) (1 mark).
      *   Articulates what is *lost* compared to hagiography (unambiguous directive, transcendent inspiration, perfected model) (1 mark).
  5.  **Argument & Structure (2 marks):** Well-organized, clear thesis, logical flow, concise language. Demonstrates synthesis of ideas.

  **Common Mistakes & Point Deductions:**

  *   **Assumes All Lives are Positive Exempla (Major Error):** (Deduct 3-4 marks) Fails to grapple with the "awkward cases" and simply applies the mirror metaphor uncritically to Alcibiades etc.
  *   **Treats Synkrisis as Mere Ranking (Major Error):** (Deduct 3-4 marks) Describes it as Plutarch declaring a "winner" or simply tallying virtues/vices.
  *   **Superficial Treatment of Flawed Lives:** (Deduct 2-3 marks) Only mentions "negative example" vaguely without exploring complexity, ambiguity, or prudence. Fails to use specific examples effectively.
  *   **Ignores or Weak Contrast with Hagiography:** (Deduct 3-4 marks) Doesn't address this crucial part of the prompt or provides a superficial/unclear comparison.
  *   **Over-Reliance on Proem Clichés:** (Deduct 1-2 marks) Just regurgitates "lives not histories" and "mirror" without deeper analysis prompted by the question.
  *   **Poor Structure/Unclear Argument:** (Deduct 1-3 marks) Disorganized, lacks clear thesis, wanders, or is overly vague.
  *   **Factual Errors about Plutarch/Lives:** (Deduct 1-2 marks per significant error) E.g., Mischaracterizing a specific life or Plutarch's stated methods.
  *   **Excessive Summary/Narration:** (Deduct 1-2 marks) Retells the Lives instead of analyzing the pedagogical method as asked.

  **Key for Grading:**
  *   Focus on the **quality and depth of the argument** regarding Plutarch's pedagogical strategy with problematic material.
  *   Reward **specificity** in explaining *how* flawed lives and synkrisis function morally.
  *   Reward **insightful contrast** with hagiography beyond just "different purpose."
  *   Severely penalize **fundamental misunderstandings** (all lives positive, synkrisis as ranking).
  *   Value **synthesis** – showing how the elements (flawed lives, synkrisis, contrast) connect to Plutarch's overall ethical project.
