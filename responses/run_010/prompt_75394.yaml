  ### Decision Tree for Evaluating Cognitive Penetrability Studies  
  *Designed for readers using only methods/results sections of experimental reports. Each node includes a question, with concrete indicators for "Yes" and "No" answers.*

  ---

  #### **Node 1: Is there a statistically significant effect of the cognitive manipulation on the reported perceptual outcome?**  
  - *Yes*: The results show a significant difference (e.g., p < 0.05) between cognitive conditions (e.g., belief vs. no belief) in the key dependent variable.  
  - *No*: No significant difference found; effect sizes are negligible or non-significant.  
  → **If No: Leaf 1—No real effect (artifact or null result).**  

  #### **Node 2: Does the effect appear in measures *not* requiring explicit judgment about the target property?**  
  - *Yes*: Effect is observed in indirect measures (e.g., adaptation aftereffects, binocular rivalry dominance durations, perceptual matching tasks, or action-based measures like grip scaling).  
  - *No*: Effect only appears in explicit reports (e.g., verbal identification, rating scales, or binary choices about the property).  
  → **If No: Proceed to Node 3.**  
  → **If Yes: Proceed to Node 4.**  

  #### **Node 3 (If Node 2=No): Does the effect survive controls for response bias or demand characteristics?**  
  - *Yes*: Effect persists when beliefs are made irrelevant (e.g., a condition where the cognitive state is held constant but stimuli are invalid/incongruent) or the manipulation is covert (participants unaware of the manipulation’s purpose).  
  - *No*: Effect vanishes in such control conditions; results align with explicit task demands or participant expectations.  
  → **If No: Leaf 2—Artifact (demand characteristics or response bias).**  
  → **If Yes: Leaf 3—Post-perceptual effect (judgment, memory, or decision).**  

  #### **Node 4 (If Node 2=Yes): Does the effect survive controls for expectation/demand?**  
  - *Yes*: Effect remains when beliefs are invalidated (e.g., disconfirmed by stimulus evidence) or the manipulation is unrelated to the task (e.g., inducing mood without semantic link to the stimulus).  
  - *No*: Effect disappears when demand is minimized; correlates with participant awareness of hypotheses.  
  → **If No: Leaf 4—Artifact (demand affects indirect measures).**  
  → **If Yes: Proceed to Node 5.**  

  #### **Node 5: Can the effect be fully explained by attentional reallocation?**  
  - *Yes*: Effect vanishes when attention is controlled (e.g., via fixation tasks, attentional load manipulations, or matched salience) or aligns with known attentional mechanisms (e.g., faster reaction times to cued locations).  
  - *No*: Effect persists despite attention controls; attentional measures (e.g., eye-tracking) show no correlation with the effect.  
  → **If Yes: Leaf 5—Attentional gating without penetration.**  
  → **If No: Proceed to Node 6.**  

  #### **Node 6: Is the effect driven by the *semantic content* of the cognitive state?**  
  - *Yes*: The cognitive manipulation is semantically specific to the stimulus (e.g., belief about color affects color perception; category knowledge affects object detection).  
  - *No*: The effect is tied to general states (e.g., arousal, valence, or salience) without content-specificity (e.g., stress altering brightness perception).  
  → **If No: Leaf 6—Effect of general cognitive state (not penetration).**  
  → **If Yes: Proceed to Node 7.**  

  #### **Node 7: At what processing level does the effect occur?**  
  - *Low-level*: Effects on basic features (e.g., color, orientation, size, slant) in tasks isolating early vision (e.g., tilt aftereffects, color matching).  
  - *High-level*: Effects on categorization, object identification, or scene interpretation (e.g., ambiguous figure resolution, multimodal binding).  
  → **If Low-level: Leaf 7—Penetration of low-level feature encoding.**  
  → **If High-level: Leaf 8—Penetration of high-level categorical perception.**  

  ---

  ### Leaves (Verdicts)  
  1. **Leaf 1—No real effect (artifact or null result)**: The study shows no reliable evidence of cognitive influence.  
  2. **Leaf 2—Artifact (demand characteristics or response bias)**: The effect is likely due to task demands or participant expectations.  
  3. **Leaf 3—Post-perceptual effect (judgment, memory, or decision)**: The effect arises after perception (e.g., in reporting or recall).  
  4. **Leaf 4—Artifact (demand affects indirect measures)**: Even indirect measures are contaminated by non-perceptual factors.  
  5. **Leaf 5—Attentional gating without penetration**: The effect reflects input selection, not alteration of perceptual processing.  
  6. **Leaf 6—Effect of general cognitive state (not penetration)**: Arousal, mood, or salience explains the effect, not content-specific cognition.  
  7. **Leaf 7—Penetration of low-level feature encoding**: Cognition alters early sensory processing (e.g., color, orientation).  
  8. **Leaf 8—Penetration of high-level categorical perception**: Cognition alters object/scene interpretation but not basic features.  

  ---

  ### Critical Notes  
  1. **Unseparable Leaves**:  
     - **Leaf 5 (Attentional Gating) vs. Leaf 7 (Low-Level Penetration)**: Distinction collapses if endogenous attention is equated with penetration. *Resolution*: Attentional explanations require evidence that the effect *only* redistributes input (e.g., via spatial cues) without changing feature processing. Low-level penetration requires feature-specific distortions under attentional controls.  
     - **Leaf 7 vs. Leaf 8**: Ambiguous for effects on "mid-level" features (e.g., shape). *Resolution*: Low-level effects must involve canonical features (color, orientation); all else defaults to high-level.  

  2. **Unoccupied Combinations in Logical Space**:  
     - **Low-level penetration improving accuracy**: Claims of cognition enhancing veridicality (e.g., memory-driven color constancy) are rare. *Diagnosis*: Underexplored due to theoretical bias that penetration must distort perception.  
     - **High-level penetration with indirect measures but no content-specificity**: Semantically vague effects (e.g., "positive mood" aiding object detection) are common but rarely tested for content-specificity. *Diagnosis*: Unattractive to both sides (encapsulationists dismiss it; penetrability theorists want specificity).  
     - **Penetration with action-based measures but attentional confounds**: Action (e.g., grasping) is often proposed as "implicit," but attention is rarely controlled. *Diagnosis*: Coherent but empirically neglected.  

  ---

  ### Application to Paradigms  
  *For each paradigm, we identify: (1) the terminal leaf, (2) the decisive node, and (3) the node where the supervisor and student diverge.*  

  1. **Familiar-shaped disc judged as more saturated (identical chromaticity)**:  
     - *Leaf*: **Leaf 3 (Post-perceptual effect)**.  
     - *Decisive Node*: **Node 2 (No indirect measures; explicit saturation ratings)**.  
     - *Divergence Node*: **Node 3**. Supervisor sees demand artifacts; student argues for a perceptual effect but lacks indirect evidence.  

  2. **Category labels aiding detection of degraded animal images**:  
     - *Leaf*: **Leaf 3 (Post-perceptual effect)**.  
     - *Decisive Node*: **Node 2 (Detection is explicit judgment; no indirect measures like priming aftereffects)**.  
     - *Divergence Node*: **Node 6**. Supervisor attributes it to response bias; student sees semantic penetration but cannot rule out decision processes.  

  3. **Reward contingency biasing bistable figure reports (letter vs. numeral)**:  
     - *Leaf*: **Leaf 5 (Attentional gating)**.  
     - *Decisive Node*: **Node 5 (Reward likely directs attention; no controls for attentional allocation)**.  
     - *Divergence Node*: **Node 5**. Supervisor sees attention as non-penetrative; student argues reward penetrates perception.  

  4. **Bodily state (e.g., backpack) altering hill slant/distance estimates**:  
     - *Leaf*: **Leaf 6 (General state effect)** if measured explicitly; **Leaf 5 (Attentional gating)** if action-based.  
     - *Decisive Node*: **Node 6 (Bodily states are non-semantic; affect perception via arousal/effort)**.  
     - *Divergence Node*: **Node 5**. For action measures (e.g., tilting a board), supervisor attributes it to attention; student argues for embodied penetration.  

  ---

  ### Final Assessment: Empirical or Conceptual Dispute?  
  The tree reveals that disagreements are **primarily empirical** at Nodes 2 (indirect measures), 3/4 (demand controls), and 5 (attention). These nodes require methodological rigor to resolve. However, **conceptual ambiguities** persist at Node 7 (defining "processing levels") and in separating attention from penetration (Node 5). The debate is not solely about evidence but about **boundaries of "perception"**: encapsulationists restrict it to early vision (Node 7 low-level), while penetrability theorists include cognition-infused interpretations (Node 7 high-level). The tree shows that "penetration" claims often fail on empirical grounds (Nodes 2-5), but surviving cases force a terminological reckoning.
