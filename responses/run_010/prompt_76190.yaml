          EU(A)=0.5*10+0.5*(-100)= -45
          EU(B)=0.5*(-100)+0.5*10= -45
          EU(C)=6
          She chooses C, EU=6.

     If she waits for the test, then in state X she must choose between A and B. She chooses A and gets 10.
     In state Y, she chooses B and gets 10.
     Expected utility=10.

     Still better.

     But if we make the prior very skewed:

          Prior: P(X)=0.99, P(Y)=0.01.

     Without information:
          EU(A)=0.99*10+0.01*(-100)=9.9-1=8.9
          EU(B)=0.99*(-100)+0.01*10= -99+0.1=-98.9
          EU(C)=0.99*6+0.01*6=6
          She chooses A and gets 8.9.

     With information:
          In state X (probability 0.99): she can choose A or B. She chooses A and gets 10.
          In state Y (probability 0.01): she chooses B and gets 10.
          EU=0.99*10+0.01*10=9.9+0.1=10.

     10 > 8.9, still better.

     To make it worse, we need that in the likely state, the best available act ex post is worse than the best act ex ante. 

     Let's change the utilities:

          State X: A: 10, B: -100, C: 9
          State Y: A: -100, B: 10, C: 9

     Prior: P(X)=0.99, P(Y)=0.01.

     Without information:
          EU(A)=0.99*10+0.01*(-100)=9.9-1=8.9
          EU(B)=0.99*(-100)+0.01*10=-99+0.1=-98.9
          EU(C)=0.99*9+0.01*9=9
          She chooses C and gets 9.

     With information and state-dependent act sets: after waiting, in state X she can choose only between A and B. She will choose A and get 10.
          In state Y she chooses B and get 10.
          EU=0.99*10+0.01*10=9.9+0.1=10.

     Again, 10>9.

     We need the ex post act set to be worse in the likely state. 

     Suppose in state X, after waiting, the available acts are only A and B, but in state Y, after waiting, the available acts are only B and C. 

     Utilities:
          State X: A:10, B:-100, C:9
          State Y: A:-100, B:10, C:9

     Ex ante, she can choose A, B, or C.

     Without information: as above, she chooses C and gets 9.

     With information:
          In state X: she chooses between A and B. She chooses A and gets 10.
          In state Y: she chooses between B and C. She chooses B and gets 10.
          EU=0.99*10+0.01*10=10.

     Better.

     How about this: in state X, after waiting, the available acts are B and C, and in state Y, after waiting, the available acts are A and C. 

     Then:
          In state X: she has to choose between B and C. B gives -100, C gives 9 -> she chooses C and gets 9.
          In state Y: she chooses between A and C. A gives -100, C gives 9 -> she chooses C and gets 9.
          EU=9.

     So then with information, she gets 9, and without information, she also gets 9. 

     Not worse.

     To make it worse, let in state X, after waiting, the only available acts are B and C, and in state Y, only A and C. But in state X, act B is very bad, so she chooses C and gets 9. In state Y, she chooses C and gets 9. So EU=9.

     Without information, she can choose C and get 9, or choose A and get 8.9, so she chooses C and gets 9.

     Same.

     We need that without information, she can choose an act that is not available after. For example, an act D that is only available ex ante. 

     Let's introduce act D available only ex ante.

     Utilities for act D:
          State X: 20
          State Y: -1000

     Without information:
          EU(D)=0.99*20+0.01*(-1000)=19.8-10=9.8
          EU(C)=9
          So she chooses D and gets 9.8.

     With information: she doesn't have act D available. In state X, she has acts B and C: she chooses C and gets 9.
          In state Y, she has acts A and C: she chooses C and gets 9.
          EU=9.

     9 < 9.8, so information is harmful.

     But is this costless information? The cost is that she loses the opportunity to choose D. This is a foregone opportunity. The problem says "no foregone opportunity". Therefore, this is not allowed.

   Given the problem's constraints, I believe it is impossible to find a counterexample. The theorem is robust under the given conditions.

   However, after research, I recall that there is a counterexample in settings of moral hazard or when the information might cause the agent to take an action that is harmful. But that typically requires the state to be affected by the act, which is not allowed here.

   Another counterexample: if the information is about the agent's own future actions. For example, if the agent has a tendency to act in a way that is state-dependent and harmful. But that would require a dynamic inconsistency, which is not allowed because the agent is a precise Bayesian and has no weakness of will.

   Therefore, I conclude that under the given specifications, the theorem holds and free information is always weakly beneficial.

   But the problem asks for a counterexample, so there must be a way. 

   I found one: the information may be relevant for the decision, but it might cause the agent to take an act that is not in her interest because of how it affects the state. However, the state is not affected by the act in our models.

   One more try: the information is provided by a person who is affected by the agent's decision to wait. For example, in a game theoretic context. But the problem says no game theory, just a single agent.

   Given the time, I will relax the state-dependent act set and then argue that the theorem assumes state-independent act set.

   Scenario: 
     The agent is a lawyer in a firm. She must decide whether to represent a client in a case. The state of the world is whether the client is innocent (I) or guilty (G). 
     Acts:
          A: take the case and argue for acquittal.
          B: decline the case.

     Utilities:
          If the client is innocent and she takes the case: she wins and gets 10.
          If the client is guilty and she takes the case: she loses and gets -10.
          If she declines: she gets 0.

     Additionally, there is act C: take the case and then, after learning the true state during the trial, choose to either present the evidence truthfully or to fabricate evidence. But note that fabricating evidence is illegal and will be punished if discovered. 

     However, if she chooses act C and then, during the trial, if the client is guilty, she might be tempted to fabricate evidence. But then she risks being caught. 

     But the problem is that we are to choose acts now or after information. 

     This is getting complicated.

   I give up.
