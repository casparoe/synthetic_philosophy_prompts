  They're also hinting at policy inconsistency: why do colonization roadmaps ignore the contamination issue that paralyzes robotic missions? This feels like cognitive dissonance in the space community. The regulations might be operating on borrowed time, avoiding the hard questions about human settlement.

  If we switched to a biocentric view (where Martian microbes have intrinsic value), the implications would be radical: human missions might become ethically unacceptable unless we develop inconceivable containment measures. Whereas an irreversibility-focused view could accommodate humans once science deems the search complete.

