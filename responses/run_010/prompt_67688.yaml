answer: |-
  You've put your finger on a profound tension at the heart of planetary protection, and the frustration you feel stems from the fact that the current practice embodies a specific, often unstated, philosophical commitment while brushing aside alternatives that might lead to different practical outcomes.

  The dominant **official theory of value presupposed by the strict sterilization rules for robotic missions** is **epistemic irreversibility**. Mars, particularly its special regions, is viewed as a unique, one-shot scientific resource – a pristine environment where we *might* find evidence of a second, independent origin of life. Contaminating it with Earth microbes destroys that uniqueness forever. It's not primarily about "killing Martian life" *now* (we don't know if it exists), nor about granting microbes moral standing. It's about preserving the *opportunity to know* something potentially universe-changing – the possibility of confirming abiogenesis happened elsewhere. The "spore budget" is a quantifiable proxy for minimizing the irreversible loss of this unique epistemic asset. The value lies in the *knowledge* we might gain, not inherently in the microbes themselves.

  **What this view quietly rules out or sidelines:**
  1.  **Strong Biocentrism/Intrinsic Value of Martian Life:** The rules *don't* presuppose that Martian microbes (if they exist) have inherent moral standing or rights that demand protection *for their own sake*. If they did, sterilizing robots might be seen as a lesser evil, but *sending humans* (massive contaminators) would become a much larger ethical problem, potentially unacceptable. The current practice avoids this deeper ethical question.
  2.  **Instrumental Value Only (for Human Use):** It rules out the view that Mars's primary value is as a future resource for humanity, where contamination is simply an engineering problem to manage for *our* benefit, not a fundamental loss of knowledge. Under this view, the extreme cost/effort of sterilization for robots might seem disproportionate.
  3.  **Acceptance of Eventual Contamination:** It implicitly assumes that the *robotic search* must be completed under pristine conditions *before* humans arrive and cause irreversible change. It buys time for science, but doesn't grapple with the contradiction that the planned human presence *will* nullify the very standard applied to robots.

  **Underdetermination & Shared Outcomes:**
  The "spore budget" itself *could* be licensed by slightly different theories:
      *   **Epistemic Irversibility (Pure Knowledge):** (The dominant view).
      *   **Weak Biocentrism (Potential Life has Potential Value):** Protecting the *potential* for life, recognizing its possible uniqueness and inherent worth, even before discovery, could demand the same strict cleanliness to avoid harm. This edges closer to intrinsic value but focuses on the *potential*.
      *   **Precautionary Principle (Avoid Harm We Don't Understand):** A general principle to avoid actions (contamination) that could cause unknown, potentially catastrophic harm (e.g., disrupting a fragile Martian ecosystem, even if microbial) might also justify sterilization, though it's vaguer.
  All three could converge on "keep it clean until we know what's there," resulting in the same spore budget for robots.

  **The Crewed Mission Conundrum: Can Both Survive?**
  Under the **dominant epistemic irreversibility view**, the robotic sterilization rules *and* crewed missions plans **can coexist, but only temporally and uneasily**:
  1.  **Robots First:** The sterilization buys crucial time for science. The implicit assumption is that robotic exploration will *conclusively answer* the life question in special regions *before* humans arrive.
  2.  **Humans Later, Accepting Contamination:** Once the *robotic science window closes* (either life is found, or confidently ruled out in key areas, or the search is deemed "complete enough"), then the irreversibility concern *for that specific knowledge goal* diminishes. Human missions proceed, accepting contamination as an unavoidable consequence. The value shifts from preserving pristine knowledge to human exploration/colonization.
  **The friction arises because:**
      *   The "conclusive answer" might be elusive.
      *   Colonization roadmaps often gloss over the profound shift in planetary protection standards required when humans land.
      *   It sidesteps the question: *If* pristine special regions are so valuable *now* for knowledge, why is contaminating them *later* acceptable? The answer is purely pragmatic/political: we value human presence more *after* the initial science.

  **Swapping the Presupposed View: What Changes?**
  If you swapped the dominant **epistemic irreversibility** view for its main philosophical rival – **Strong Biocentrism/Intrinsic Value of Martian Life** – the regulations would change dramatically:
  1.  **Robotic Missions:** Sterilization might remain strict, but the *justification* shifts from "don't ruin the science" to "don't harm/displace/kill indigenous life forms." The focus might broaden beyond just special regions if life could potentially exist elsewhere.
  2.  **Crewed Missions:** This becomes the real flashpoint. If Martian microbes have intrinsic value:
      *   Human missions to special regions might become ethically *unacceptable*, full stop. The contamination wouldn't just ruin science; it would be an intrinsic harm or even genocide.
      *   Regulations would demand *absolute, impossible containment* for humans – living in sealed habitats, treating all waste/wastewater as hazardous bio-material, never venting anything, potentially never venturing into special regions even in suits (due to inevitable leaks). Colonization as typically envisioned becomes ethically fraught.
      *   The focus would shift to *proving beyond doubt* that an area is lifeless *before* any human activity, or accepting that human settlement must be limited to zones definitively devoid of life (if any exist).
  3.  **Burden of Proof:** The burden of proof flips. Instead of "prove you won't contaminate a potential life zone" (current), it becomes "prove there is absolutely no life to harm" before entering *any* potentially habitable area.

  **In Plain Terms:**
  The current rules are primarily about protecting a unique *chance to learn* something potentially revolutionary, not about protecting Martian bugs as beings with rights. That's why baking a spacecraft now makes sense (preserving the science option), while planning humans later is also accepted (science eventually gives way to human ambition). The rules assume we'll do the critical life-search *before* humans mess it up. Switching to a view where Martian life itself has inherent value would make human presence ethically much harder to justify near any potential habitat, forcing vastly more restrictive – likely impractical – rules for people or potentially forbidding settlement in biologically interesting areas altogether. The tension you feel is real – it's the gap between protecting knowledge *now* and the planned, tolerated contamination *later*, all while avoiding the deeper ethical question about the life itself.
