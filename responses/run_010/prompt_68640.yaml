answer: |-
  ## The Tender Window

  The night bell above the Registry Office door jangled, a sharp, familiar punctuation mark in the quiet street. Marta slid the heavy ledger onto the counter, its worn leather cover cool beneath her palms. Outside, the lamps cast long, distorted shadows. Inside, the only sounds were the hiss of the gas jet above her desk and the dry rasp of her own breath. It was Tuesday. Tender night.

  Her routine was etched into her muscles: unlock the tender box, a heavy brass affair bolted to the counter; sort the certificates – thick parchment rectangles embossed with the Polity’s seal and a unique shareholder number; verify the watermarks against the master list; enter the quantities into the ledger under the applicant’s assigned case number. Column A: Shares Tendered *Against* Admission. Column B: Shares Tendered *For*. Mostly blank, Column B. Mostly, nobody bothered.

  The system had been born decades ago, a solution to the capricious cruelty – and occasional, equally capricious kindness – of the old border agents. Old Man Herron, who ran the hardware store and sat on the Founding Council, still talked about it sometimes. “Before the Shares,” he’d say, polishing a wrench handle, “it was whim. One officer liked red hair, another hated farmers. A bad mood meant a locked gate. The Shares? They made it fair. Clear. A price you could see. A right you could sell if you needed bread more than a vote on who gets in.” Marta had nodded then, and part of her still did. Whim *was* terrifying. Transparency felt like a shield.

  Her own two shares, inherited from a great-aunt she barely remembered, lay dormant in a tin box under her bed. For years, out of a vague sense of neighbourliness, she’d formally tendered them *for* admission each week, a tiny push against the potential tide of exclusion. But the act felt increasingly meaningless, like whispering into a gale. And as her own life had shrunk – walks to work, nights at the ledger, solitary meals – the whispering stopped. The shares gathered dust. What difference could two make?

  Tonight’s applicant was Case #7342-K. Elara Voss. The name caught Marta’s eye, causing a slight hitch in her rhythm. Elara cleaned the upstairs offices sometimes. Quiet, efficient, with eyes that held a constant, watchful sadness. She’d fled something Marta didn’t ask about, years ago from somewhere Marta couldn’t place. She’d been granted temporary residency then, a limbo state. Now, her application for permanence was on the block.

  Marta sorted the tender certificates for #7342-K. The pile for Column A was thicker than usual. She began entering them, her pen scratching in the quiet. Shareholder 8872: 5 shares tendered *against*. Shareholder 4419: 12 shares *against*. Shareholder 0098: 30 shares *against*. The numbers mounted. A familiar, dull weight settled in her chest. Exclusion wasn’t personal, she reminded herself. It was arithmetic. The will of the shareholders, expressed through their property. The threshold for exclusion was 250 shares tendered *against*.

  She worked mechanically until only three certificates remained. Shareholder 6651: 1 share *against*. Shareholder 1120: 50 shares *against*. Shareholder 0033: 100 shares *against*. She entered them. Her eyes flicked to the total at the bottom of Column A: **248 shares**.

  Two short of the threshold. Elara would be admitted. Inclusion by default. The absence of sufficient will to exclude.

  Marta exhaled, a small, unconscious release. She reached for the final certificate in the box, a thin, flimsy thing – a tender *for* admission. Rare. Shareholder 7783: 1 share *for*. She entered it dutifully in Column B. The total there remained pathetic: **1 share**.

  Standard procedure demanded she double-check the Column A total before publishing the count. **248**. She totted it again, line by line. Still **248**. Elara Voss was safe. The tender window closed at midnight sharp; it was 11:52 PM. The brass clock above the counter ticked loudly.

  She lifted the heavy press, ready to stamp the ledger page ‘FINAL’ and ring the bell signalling the count’s publication. As she lowered it, a corner of the Shareholder 0033 certificate caught her eye. The embossed seal seemed slightly smudged. A forgery? Unlikely, but procedure was procedure. She pulled the master shareholder register – a vast, leather-bound tome – from beneath the counter. Thumbing through the brittle pages to ‘0033’. **Block Holding: 100 Shares. Registered Holder: Estate of Silas Thorne.**

  That wasn’t unusual. Shares passed through estates constantly. She flipped to the appended estate register. **Estate of Silas Thorne: Probate Executed. Sole Beneficiary: Lena Thorne (nee Pike). Last Known Address: 42 Harbor View Terrace, Port Haversham, Overseas Territories.**

  Port Haversham. Weeks away by the fastest packet ship. No listed contact beyond the address. Silas Thorne had been a founding resident, a reclusive bachelor. Lena Pike… Marta vaguely recalled a niece who’d left for the coast decades ago, before Marta was born. Had Lena Thorne ever even *seen* the town? Did she know she held the power to exclude ten people at a stroke? Or was it just a line item in some dusty probate file, a fractional claim on a place whose name meant nothing?

  The clock ticked. 11:55 PM. Marta stared at the ledger. **Column A: 248 Shares Tendered *Against* Admission.**

  Two shares. The difference between Elara rebuilding her life here and… whatever came next. Two shares Marta *had*, lying useless in a tin box. But she couldn’t tender them now. The window closed at midnight. Tendering required presenting the physical certificates at the Registry during the open window. Hers were under her bed. It was impossible.

  And even if she could, tendering them *for* admission would change nothing. The total *against* was 248, two short. Tendering *for* only padded Column B, irrelevant to the exclusion threshold. Tendering *against*… that was unthinkable. It wasn’t just Elara; it felt like betraying the ghost of her own former self, the one who used to bother.

  The bell jangled again, shockingly loud. Marta jumped. A courier stood there, breathless, holding out a thick, sealed envelope. “Late tender! For Case #7342-K. Shareholder 0033.”

  Marta snatched it, her fingers clumsy. Inside was a formal transfer certificate, notarized in Port Haversham, transferring the 100 shares of the Estate of Silas Thorne to… **Shareholder 4419: Merritt & Sons (Holding Co.).** And clipped to it, a fresh tender certificate for Case #7342-K: Shareholder 4419 tendering an additional **4 shares *against* admission**.

  *Merritt & Sons*. They owned the coal depot, several warehouses. Aggressive buyers on the secondary share market. They’d already tendered 12 shares *against* tonight. Now this.

  Hands trembling, Marta verified the transfer. It was dated yesterday, received by the central registry this afternoon, and forwarded by courier to her branch. Legally valid. She had to enter it. She recorded the transfer in the master register, the ink blotting slightly. Then, with a feeling like dropping a stone into a deep, dark well, she entered the new tender: Shareholder 4419: Additional 4 Shares *Against* Admission.

  She recalculated Column A. **252 shares.**

  *252*. Over the threshold. By exactly two shares.

  The brass clock struck midnight. A single, resonant chime filled the small office. The tender window was closed.

  Elara Voss was excluded.

  Marta sat frozen. The ledger page stared back: #7342-K, Elara Voss. Column A: **252**. Column B: **1**. Outcome: **EXCLUDED**. The finality of the stamp pressed into the page seemed to echo the chime.

  She thought of Lena Thorne, thousands of miles away, likely unaware she’d ever held the key to a stranger’s fate in a place she’d forgotten. She thought of Merritt & Sons, efficiently aggregating dormant shares like scrap metal, wielding the collective, fragmented power to exclude without ever seeing an applicant’s face, without needing to articulate a reason beyond the price and the threshold. The *right* to exclude had become untethered from any notion of community, of presence, of consequence. It was just a thing you owned, or sold, or forgot you had.

  The next days were a blur of hollow routine by night and a desperate, private investigation by day. Marta couldn’t help Elara – the decision was final, appealable only on procedural grounds, and she’d followed procedure to the letter. But she needed to understand the *who*, the *why*. She traced the shares.

  The decisive block, Lena Thorne’s 100, had been bought by Merritt & Sons for a pittance through an intermediary, weeks ago. Silas Thorne’s lawyer confirmed Lena had signed the papers without question, glad to be rid of an abstract asset from an uncle she barely knew in a town she’d left as a child. “Just wanted it cleared up,” the lawyer said, shrugging. Merritt & Sons were unavailable for comment; their clerk said they “acted in the best interests of their portfolio and the shareholder value of the Polity’s admission rights.”

  Other tenders *against* came from a consortium of shopkeepers worried about competition (Shareholder 8872), an elderly woman who’d tendered against every application for a decade “on principle” but couldn’t recall what principle (Shareholder 6651), and several minor holders whose certificates Merritt & Sons had bought outright or leased for the tender window. The single tender *for* admission? A retired teacher who made a point of tendering his single share *for* every applicant, a tiny, persistent act of futile welcome.

  No one had actively *willed* Elara Voss’s exclusion. Not really. Not Lena Thorne, oblivious oceans away. Not Merritt & Sons, simply executing a profitable consolidation. Not the shopkeepers, who feared abstraction. Not the old woman, acting on long-petrified habit. The exclusion was the sum of fragmented holdings, traded, inherited, accumulated, and finally deployed not out of malice towards Elara, but because the *capacity* to exclude was a latent asset, and assets exist to be utilized. The system, designed to replace whim with dispassionate transparency, had created a new kind of distance, a new kind of irresponsibility. The right to decide who belonged had become a commodity, and commodities don't have consciences; only owners, who may or may not look at them closely.

  Old Man Herron found her sitting on the bench outside the Registry, staring at nothing. The street was quiet. He lowered himself beside her with a grunt.

  “Heard about the Voss case,” he said, his voice gravelly. “Close one. Two shares. Damn shame.”

  Marta nodded, unable to speak.

  “System worked, though,” Herron continued, gazing down the dim street. “Threshold met. Clear as day. No arguments about bias, no bribes changing hands. Back in the day… well, you wouldn’t believe the stories. People turned away for spitting on the sidewalk, others waved through carrying who-knows-what.” He sighed. “This way… it’s cleaner. The price tells you what the community thinks.”

  *Is it the community?* Marta wanted to ask. *Or just the sum of what people hold, whether they live here, remember here, or care at all? What does ‘clean’ mean when the cost is paid by someone like Elara, and the profit goes to someone like Merritt?* But the arguments, the opposing weights Herron represented – fairness, transparency, stability against the erosion of communal connection, the alienation of the right to exclude – felt too heavy, too entangled, to voice. He saw the replaced cruelty. She saw the new, abstracted one.

  “Clean,” she echoed, the word tasting like dust.

  That Friday night, processing the tenders for a new applicant, Marta found herself staring at the certificate for her own two shares. She’d taken them out of the tin box. They were crisp, almost unused, the embossed seal sharp. Shareholder 5560: 2 Shares.

  The tender window for the new case was open. She could walk them across the street right now, enter them in Column B. *For* admission. A tiny push against nothing in particular. Meaningless, yet the only gesture left.

  Instead, she traced the raised edge of the seal with her fingertip. It felt cool, intricate, utterly detached from the dusty street outside, the quiet panic in Elara Voss’s eyes she’d glimpsed yesterday, the vast, indifferent ocean separating Lena Thorne from the consequences of her forgotten inheritance. The seal was just a mark on paper, signifying a fragment of a right that had long since escaped its original purpose. She didn’t move towards the door. She didn’t put the shares away. She just sat at the scarred wooden counter, under the hissing gaslight, her finger slowly circling the embossed rim, around and around, feeling the sharp, physical edge of the idea made manifest.
