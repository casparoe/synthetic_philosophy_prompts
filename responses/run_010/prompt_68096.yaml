prompt: |-
  I've read enough of the LessWrong-era material on Kelly betting and "geometric rationality" that I assumed I had this settled, and then a friend who has been deep in the non-ergodicity economics literature sent me a passage from his own write-up:

  "Expected-value reasoning is broken because it averages over parallel universes you will never visit; you live one life in sequence, so the only quantity that matters is the time average. Kelly betting is the repair: it is the stake fraction that maximizes the long-run growth rate of your bankroll, and since growth rate is what compounds, Kelly is optimal for anyone who expects to face that kind of bet repeatedly — your utility function drops out entirely, because log utility simply falls out of the time average. This is also why Kelly cannot go bankrupt: staking any fraction at or below the Kelly number guarantees that you finish ahead of anyone who stakes differently. Full Kelly is therefore the rational default, and the half-Kelly that practitioners actually recommend is only a concession to people who find volatility unpleasant."

  Much of this matches my intuitions, but "your utility function drops out" and "cannot go bankrupt" sit badly with me, and I don't trust my own instincts enough to say why. Could you audit the passage claim by claim, separating what a decision theorist or mathematical-finance person would endorse, what is a defensible simplification, and what is wrong or badly overstated? Three points I especially want resolved: (a) whether the growth-rate optimality theorem really licenses dismissing utility, or whether something has been conflated there; (b) what is and is not guaranteed about beating a different fixed fraction, and over what horizon; and (c) whether half-Kelly has a justification that has nothing to do with squeamishness. Finally, tell me which of his conclusions survive once the errors are corrected, and whether the corrected version still supports the strong claim he opens with about expected-value reasoning.
reasoning: |-
  We are given a passage that makes several claims about Kelly betting and its optimality. Let's break down the claims and analyze them step by step.

  The passage states:

  1. Expected-value reasoning is broken because it averages over parallel universes (i.e., it uses an ensemble average) but we live in a single life (a time average). Therefore, the time average is what matters.

  2. Kelly betting maximizes the long-run growth rate of the bankroll, and because growth rate compounds, it is optimal for repeated bets.

  3. The utility function drops out entirely because log utility falls out of the time average.

  4. Kelly betting cannot go bankrupt: staking at or below the Kelly fraction guarantees that you finish ahead of anyone who stakes differently.

  5. Full Kelly is the rational default, and half-Kelly is only a concession to volatility aversion.

  We are especially interested in points (a), (b), and (c):

  (a) Whether the growth-rate optimality theorem dismisses utility considerations or conflates something.

  (b) What is guaranteed about beating a different fixed fraction and over what horizon.

  (c) Whether half-Kelly has a justification beyond volatility aversion.

  Let's address each part.

  ### Claim 1: Expected-value reasoning is broken because it averages over parallel universes.

  This claim comes from the non-ergodicity economics perspective. The idea is that if a process is non-ergodic, the ensemble average (expected value) does not equal the time average. For instance, in a bet that can lead to ruin, the ensemble average might be positive but the time average (if you go broke and stop playing) might be negative.

  However, note that expected utility theory (EUT) does not necessarily break in non-ergodic situations if we use the appropriate utility function. In fact, the Kelly criterion is derived by maximizing the expected value of the logarithm of wealth, which is a specific utility function (log utility). So, the problem is not with expected-value reasoning per se, but with using linear utility (i.e., maximizing expected wealth) in situations where the time average matters.

  In summary, the claim is partially defensible: for repeated bets in which the outcome affects future opportunities, using expected value (without considering the compounding effect) can lead to ruin. But expected utility theory with the right utility function (like log) can handle this.

  ### Claim 2: Kelly betting maximizes the long-run growth rate.

  This is correct. The Kelly fraction (f*) is defined as the fraction of the bankroll to bet that maximizes the expected logarithm of wealth. By the law of large numbers, in the long run, the growth rate (i.e., the exponential growth rate) is maximized by this fraction.

  ### Claim 3: "Your utility function drops out entirely because log utility simply falls out of the time average."

  This is an overstatement. The Kelly criterion is derived by maximizing the expected logarithm of wealth. This is equivalent to maximizing the long-term growth rate. However, note that the choice of log utility is not arbitrary: it is the utility function that leads to growth-rate optimality. But if an individual has a different utility function (e.g., they are risk-averse beyond what log utility implies), then they might prefer a different fraction.

  In fact, the Kelly criterion is optimal for log utility. If your utility function is not logarithmic, then you might not want to use the full Kelly fraction. For example, if you have a utility function that is more risk-averse than log, you might prefer a fractional Kelly strategy (like half-Kelly).

  Therefore, the claim that the utility function drops out is incorrect. The Kelly criterion is derived for a specific utility function (log). The passage conflates the result (growth optimality) with the derivation (which uses log utility). Growth optimality is a property that is achieved by maximizing log utility. So, we are implicitly using log utility.

  ### Claim 4: Kelly betting cannot go bankrupt and guarantees finishing ahead of others.

  - **Bankruptcy**: If you bet a fixed fraction of your bankroll, you can never go bankrupt because you are always betting a fraction (so you never bet your entire bankroll and then lose it all? Actually, if you bet a positive fraction and keep losing, you will approach zero but never hit zero in finite time. However, note that if the fraction is greater than the Kelly fraction (and especially if it is 1 or more), you can go bankrupt in the sense of having your wealth reduced to zero. But the claim says "stake any fraction at or below the Kelly number". Indeed, if you bet a fraction f ≤ f* (the Kelly fraction), then you avoid the risk of ruin in the sense that your wealth remains positive. However, note that even with fractional betting, if you keep losing, your wealth can become arbitrarily small (approaching zero). So, you don't go bankrupt in finite time, but you can become arbitrarily poor.

  - **Guarantee of finishing ahead**: The claim is that if you stake at or below the Kelly fraction, then you will finish ahead of anyone who stakes differently. This is an overstatement. There is a famous result that if two players bet different fixed fractions and one is at the Kelly fraction and the other is not, then in the long run the Kelly bettor will have a higher wealth with probability approaching 1. However, note:

    1. This is an asymptotic result (as the number of bets goes to infinity). In the finite horizon, there is a positive probability that the non-Kelly bettor (especially one who bets more) might be ahead.

    2. The comparison is against a fixed fraction. If an opponent uses a different fixed fraction, then the Kelly bettor will eventually overtake and stay ahead. But note: if the opponent uses a dynamic strategy that sometimes uses a fraction above Kelly and sometimes below, then it's a different story.

    3. The claim says "stake any fraction at or below the Kelly number" guarantees finishing ahead. But if you stake below the Kelly fraction, then you are not the Kelly bettor. In fact, the Kelly fraction is the unique fraction that maximizes the growth rate. If you bet less than Kelly, then your growth rate is less than the maximum. Therefore, someone betting at the full Kelly fraction will eventually overtake you (if they are betting at the true Kelly fraction and you are below). However, the passage says "at or below" and then "ahead of anyone who stakes differently". This is ambiguous.

    Actually, the result is that the Kelly fraction maximizes the growth rate. Any other fixed fraction (whether above or below) has a lower growth rate. Therefore, in the long run, the Kelly bettor will have a higher wealth than any fixed fraction bettor with a different fraction (whether above or below) with probability 1. However, note that if you are below Kelly, then you are not the Kelly bettor, and the full Kelly bettor will eventually overtake you. But the claim is that if you are at or below Kelly, you finish ahead of someone who stakes differently (say, above Kelly). This is true in the long run: if you are at or below Kelly, then you are not overbetting and therefore avoid ruin. But note: if you are below Kelly, then you are growing slower than the full Kelly bettor, so the full Kelly bettor will eventually overtake you. However, the claim is about beating someone who stakes differently (say, above Kelly). So:

    - The full Kelly bettor will beat the overbettor (above Kelly) and the underbettor (below Kelly) in the long run.
    - The underbettor (below Kelly) will also beat the overbettor in the long run? Actually, that is true because the overbettor has a negative growth rate (if they are overbetting enough) and will go to zero. But if the overbettor is only slightly above Kelly, they might have a positive growth rate but lower than Kelly. Then, both the underbettor and the full Kelly bettor will have positive growth and the underbettor will have a lower growth rate than the full Kelly bettor, but both will have positive growth and the overbettor (if they are above the point where growth becomes negative) will go to zero. However, if the overbettor is only slightly above Kelly, then they have a positive growth rate but less than Kelly. In that case, the underbettor (with a growth rate less than Kelly but still positive) might or might not beat the overbettor? Actually, the one with the higher growth rate will win. So:

        - Full Kelly: growth rate g*
        - Underbet: growth rate g1 < g*
        - Overbet (but not ruinously so): growth rate g2, where 0 < g2 < g*

        So the underbettor will have a growth rate g1 and the overbettor (if they are above Kelly but not so much that g2<0) will have g2. We can't say in general which is bigger: g1 could be greater than g2 or less. For example, if you are only slightly below Kelly, your growth rate might be higher than someone who is significantly overbetting. But if you are significantly underbetting and the overbettor is only slightly above, then the overbettor might have a higher growth rate than you. So the underbettor does not necessarily beat the overbettor.

    Therefore, the guarantee is only that the Kelly bettor beats any other fixed fraction bettor. The underbettor does not necessarily beat the overbettor (unless the overbettor is so far above that they have a negative growth rate and go to zero).

    Also, note that the guarantee is asymptotic (long run). In the short run, there is no guarantee.

  ### Claim 5: Full Kelly is the rational default, and half-Kelly is a concession to volatility aversion.

  - **Full Kelly as rational default**: If an individual has log utility, then full Kelly is optimal. But if they have a different utility function, then it might not be. So the rationality of full Kelly depends on having log utility. Without log utility, full Kelly might not be optimal.

  - **Half-Kelly**: The passage says half-Kelly is only for those who find volatility unpleasant. This is partially true, but there are other reasons. For example:

    - **Parameter uncertainty**: The Kelly fraction depends on knowing the true probabilities and payoffs. If there is uncertainty about these parameters, then betting half-Kelly (or some fraction) can be a way to be robust to estimation errors. Betting full Kelly when the parameters are uncertain can lead to overbetting and ruin.

    - **Risk-adjusted returns**: Even if you are maximizing long-term growth, the variance of the growth rate with full Kelly might be too high for some investors. Half-Kelly reduces the variance but at the cost of reducing the growth rate. This reduction might be acceptable if the investor has a high risk aversion.

    Therefore, half-Kelly is not solely for volatility aversion but also for robustness to model uncertainty.

  ### Addressing the specific points:

  (a) **Does growth-rate optimality dismiss utility?**  
  No. The Kelly criterion is derived by maximizing expected log utility. It is optimal for an agent with log utility. For an agent with a different utility function, the Kelly fraction may not be optimal. However, it is true that the growth-rate optimality is a property that does not depend on the specific form of the utility function beyond log: if you care about long-term wealth, then maximizing growth rate is a natural goal. But if you have a different goal (like minimizing the chance of going broke in the short run, or having a bequest motive), then you might choose a different strategy.

  (b) **What is guaranteed about beating a different fixed fraction?**  
  In the long run (as the number of bets goes to infinity) and with probability 1:

  - The Kelly bettor will have more wealth than any other fixed fraction bettor (whether above or below Kelly) if that other fraction is fixed and not equal to Kelly.

  However, note:

  - The underbettor (fraction below Kelly) will have a lower growth rate than the Kelly bettor, so the Kelly bettor will eventually overtake and stay ahead.

  - The overbettor (fraction above Kelly) will have a lower growth rate than the Kelly bettor (and if they are overbetting enough, they might have a negative growth rate and go to zero).

  But:

  - If two players both bet below Kelly, the one closer to Kelly will eventually overtake the one further below.

  - If one player bets below Kelly and another bets above Kelly (but not enough to have a negative growth rate), then the one with the higher growth rate will eventually win. This could be the one above Kelly if the underbettor is very conservative and the overbettor is only slightly above Kelly? Actually, the Kelly fraction is the maximum. So any deviation (above or below) reduces the growth rate. Therefore, the growth rate of the underbettor and the overbettor (if the overbet fraction is such that the growth rate is positive) are both less than Kelly. Without knowing the exact fractions, we can't say which is larger. But note: the growth rate as a function of the fraction is concave and symmetric? Not necessarily. It is concave but not symmetric. The reduction in growth rate for being a little above Kelly is usually more severe than for being the same amount below.

  In summary, the only guaranteed dominance is that the Kelly fraction will beat any other fixed fraction in the long run. There is no guarantee that an underbettor will beat an overbettor (unless the overbetting leads to ruin).

  (c) **Justification for half-Kelly beyond volatility aversion?**  
  Yes, as noted: parameter uncertainty. If the true probabilities are not known with certainty, then using a fractional Kelly (like half) can be a heuristic to avoid overbetting on an uncertain edge.

  ### Which conclusions survive?

  The corrected version:

  - Expected-value reasoning (with linear utility) is indeed inappropriate for repeated bets because it ignores the compounding effect and the risk of ruin. However, expected utility theory with log utility (which leads to Kelly) is appropriate.

  - Kelly betting does maximize the long-run growth rate and is optimal for an agent with log utility.

  - The utility function does not drop out: Kelly is optimal for log utility. For other utilities, a different fraction might be optimal.

  - Kelly betting (with fraction ≤ 1) avoids bankruptcy in the sense that wealth remains positive (though it can become arbitrarily small). And in the long run, the Kelly bettor will beat any other fixed fraction bettor.

  - Full Kelly is the rational default if you have log utility and know the parameters exactly. Half-Kelly is often recommended due to risk aversion (volatility) and also due to parameter uncertainty.

  The strong claim at the beginning about expected-value reasoning being broken is defensible in the context of repeated bets and linear utility. But expected utility theory (with the right utility) is not broken. The corrected version still supports the idea that for repeated bets, growth-rate maximization (via Kelly) is a robust strategy, but it does not entirely dismiss utility considerations.

  ### Final Summary

  The passage contains some overstatements and inaccuracies, especially regarding the role of utility and the guarantee of beating others. The core message that Kelly is growth-optimal for repeated bets is correct, but the dismissal of utility and the unconditional guarantee of outperformance are not. Half-Kelly has justifications beyond volatility aversion, primarily model uncertainty.

  Thus, the corrected version would be:

  "Expected-value reasoning (with linear utility) is broken for repeated bets because it does not account for the compounding of returns and the risk of ruin. Instead, maximizing the expected logarithm of wealth (Kelly betting) maximizes the long-run growth rate. This is optimal for an agent with log utility. Kelly betting (with fraction at or below 1) avoids bankruptcy (in the sense of wealth remaining positive) and in the long run will almost surely exceed the wealth of any other fixed fraction strategy. However, if your utility function is not logarithmic, or if you face parameter uncertainty, you might choose a fractional Kelly strategy. Half-Kelly is often a practical compromise to reduce volatility and protect against estimation errors."

  This corrected version still supports the idea that expected-value reasoning (with linear utility) is flawed for repeated bets, but it does not dismiss utility entirely and clarifies the conditions under which Kelly is optimal.
answer: |-
  Let's audit the passage claim by claim, separating rigorous truths from overstatements and errors. I'll address your three focal points (a, b, c) explicitly and conclude with what survives correction.

  ### Claim-by-Claim Audit
  1. **"Expected-value reasoning is broken because it averages over parallel universes you will never visit; you live one life in sequence, so the only quantity that matters is the time average."**  
     - **Decision Theory Verdict**: Defensible but context-dependent.  
     - **Explanation**: Expected-value (EV) reasoning assumes ergodicity (ensemble averages = time averages). For non-ergodic processes (e.g., multiplicative growth with risk of ruin), EV can recommend strategies that lead to almost sure bankruptcy in the long run (e.g., betting entire wealth on positive-EV gambles repeatedly). Time-average growth rate is indeed the critical metric for repeated multiplicative bets. However, this doesn't mean EV reasoning is universally "broken"—it works for ergodic processes (e.g., one-off bets, additive growth). The key error here is using linear utility (EV) where logarithmic utility (growth-rate maximization) is appropriate.

  2. **"Kelly betting [...] maximizes the long-run growth rate of your bankroll [...] optimal for anyone who expects to face that kind of bet repeatedly."**  
     - **Decision Theory Verdict**: Correct, with caveats.  
     - **Explanation**: Kelly betting (maximizing expected log wealth) does maximize the asymptotic growth rate of wealth. This is a theorem (Breiman, 1961). Optimality holds for infinitely repeated independent bets with known probabilities and fixed fractional betting. Caveats: Assumes no tail risks outside the model, no intermediate consumption, and known edge.

  3. **"Your utility function drops out entirely, because log utility simply falls out of the time average."**  
     - **Decision Theory Verdict**: **Overstated and misleading.**  
     - **Explanation**: This conflates *optimal strategy* with *dismissal of utility*.  
       - Log utility is **not incidental**—it's the specific utility function being maximized. Kelly is optimal *for log utility* in repeated bets.  
       - If you have a different utility function (e.g., CRRA with γ ≠ 1), Kelly is suboptimal. For instance, highly risk-averse agents (γ > 1) prefer fractional Kelly to reduce volatility.  
       - **Point (a) Resolution**: Growth-rate optimality does **not** dismiss utility. It is equivalent to assuming log utility. The claim "drops out" implies universality, but Kelly is only utility-agnostic in the narrow sense that log utility emerges naturally from growth maximization—not that arbitrary utilities are irrelevant.  

  4. **"Kelly cannot go bankrupt: staking any fraction at or below the Kelly number guarantees that you finish ahead of anyone who stakes differently."**  
     - **Decision Theory Verdict**: **Partially correct, partially false.**  
     - **Explanation**:  
       - **Bankruptcy**: True. Betting a fraction *f* ≤ 1 ensures wealth never hits zero (since you bet a proportion, not a fixed amount).  
       - **Beating others**: **False as stated.**  
         - Kelly maximizes growth rate, so *in the long run*, a Kelly bettor will almost surely surpass *any other fixed-fraction* bettor (e.g., overbettors or underbettors). This is the "Kelly criterion dominance theorem."  
         - **But**: This is **asymptotic** (infinite horizon). Over finite horizons, a non-Kelly bettor may lead with high probability.  
         - **Crucially**: If you bet **below Kelly**, you do **not** necessarily beat **all others**. For example:  
           - A Kelly bettor beats a half-Kelly bettor in the long run.  
           - A half-Kelly bettor may beat an overbetting strategy (if the overbetter risks ruin), but *not* because they are below Kelly—it's because the overbetter is suboptimal.  
         - **Point (b) Resolution**:  
           - Guarantee: Only Kelly *strictly* beats all other fixed fractions *asymptotically*.  
           - No fraction ≤ Kelly guarantees beating *all* others—e.g., half-Kelly loses to full Kelly.  
           - Horizon: Dominance emerges only in the limit; short-term underperformance is likely.  

  5. **"Full Kelly is therefore the rational default, and the half-Kelly that practitioners actually recommend is only a concession to people who find volatility unpleasant."**  
     - **Decision Theory Verdict**: **Incomplete and misleading.**  
     - **Explanation**:  
       - **Full Kelly as default**: Only rational for agents with log utility and perfect knowledge of edge. For others, it's riskier than necessary.  
       - **Half-Kelly**: Volatility aversion is **one** reason, but not the only. Key justifications include:  
         - **Parameter uncertainty**: If edge/odds are estimated (not known), full Kelly leads to overbetting. Half-Kelly hedges estimation error (e.g., in finance, where "true" probabilities are unknown).  
         - **Risk of ruin adjustments**: For finite horizons or leverage constraints, fractional Kelly controls drawdown risk.  
         - **Utility mismatch**: For CRRA utility with γ ≈ 2–4, half-Kelly (≈ 0.5–0.7×Kelly) is often optimal.  
       - **Point (c) Resolution**: Half-Kelly has **multiple defensible justifications** unrelated to "squeamishness," chiefly model uncertainty and robustness.

  ### Surviving Conclusions (After Correction)
  - **Core truth**: For repeated multiplicative bets, maximizing growth rate (via Kelly) is superior to expected-value maximization. EV reasoning *is* flawed here due to non-ergodicity.  
  - **Refined claims**:  
    - Kelly maximizes long-run growth and avoids ruin (for *f* ≤ 1).  
    - Kelly asymptotically dominates any other fixed-fraction strategy.  
    - Half-Kelly is a practical heuristic for robustness and risk management, not just volatility aversion.  
  - **Discarded claims**:  
    - Utility functions don't "drop out"—log utility is central.  
    - Betting below Kelly does not guarantee beating others (e.g., full Kelly beats half-Kelly).  
    - "Cannot go bankrupt" is true, but "finish ahead of anyone" is false for non-Kelly fractions.  

  ### Does the Corrected Version Support the Opening Claim?
  **Qualified yes**. The passage's core critique—that EV reasoning fails for repeated multiplicative bets—stands corrected. Time-average growth *is* paramount, and Kelly optimizes it. However:  
  - This doesn't condemn all EV reasoning (e.g., one-off bets or additive processes).  
  - Utility functions aren't irrelevant; Kelly *is* utility-specific (log).  
  - The claim "your utility function drops out" is a critical error that overstates Kelly's universality.  

  In essence: **Kelly is the correct repair for EV maximization in repeated bets, but it implicitly assumes log utility. It is not a utility-agnostic "rational default" for all agents.** The strength of the opening claim is preserved, but its justification requires nuance: it's the *linear* utility in EV that's broken here, not expected utility theory itself.
