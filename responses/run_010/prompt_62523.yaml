  ### Methodology vs. Philosophy: The Keijzer Problem
  The Q1 branch (🐝) is **methodological, not philosophical**. It filters out cases where "rigidity" is an observational artifact, preventing flawed data from entering philosophical discussion. This is crucial for your lab: a "sphexish" LLM may be misdiagnosed if based on a single run (inviting Keijzer-style criticism).  

