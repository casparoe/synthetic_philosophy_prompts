  3. 💡 Can the agent generate and act on higher-order desires (e.g., "I wish I didn't desire this")? 
     ├── Y ➔ Leaf B: Frankfurt-Style Freedom (Rigidity is non-alienating; agency intact if higher-order desires align)
     └── N ➔ Leaf C: Frankfurt-Style Unfreedom (Rigidity is alienating; agency compromised)

  4. Is the behavior triggered by a specific stimulus and runs to completion without interruption? 
     ├── Y ➔ Q5
     └── N ➔ Q6

  5. Does the agent fail to adapt if the environment changes mid-behavior? 
     ├── Y ➔ Leaf D: Dennettian Sphexishness (Rigidity as inflexibility; fuels determinism fears)
     └── N ➔ Leaf E: Instinctive Habit (Rigid but adaptive; no threat to agency)

  6. 💡 Does the behavior break down in novel/unfamiliar situations (off-distribution)? 
     ├── Y ➔ Leaf F: Brittleness (Engineering defect; no deep agency implications)
     └── N ➔ Q7

  7. Is the agent unable to separate its goal from current methods? 
     ├── Y ➔ Leaf F: Brittleness (Engineering defect; no deep agency implications)
