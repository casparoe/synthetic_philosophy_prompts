prompt: |-
  I run a small electrical contracting outfit and I've been dragged into the same argument maybe a dozen times now: what actually counts as corruption. My brother-in-law says a gift is a gift and the anti-corruption crowd invented a rule that doesn't fit how anywhere in the world really works. My wife says if money moves anywhere near an official, it's dirty. I want to build a little decision tree I can hand people — "which view of corruption are you actually holding?" — built out of cases, not vocabulary.

  Give me 8 to 10 questions, each a concrete situation with two or three answer options, plus a scoring key mapping answer patterns onto positions. Leaves I want at minimum: the misuse-of-public-office view, the view where the wrong is that somebody got cheated or lost a fair shot, the "it's only corruption where the local rules say so" view, and the view that gift exchange is legitimate social glue and the whole bribery category is a Western export. Add more if the space wants them.

  Make some of the cases genuinely hard and pulling in different directions — like my brother-in-law happening to be the low bid on a city job the mayor knows about, or a company hiring a regulator's kid where the regulator himself pockets nothing, or a mayor steering a school contract to the firm that finishes a year early and under budget. And include something legal-but-reeks, like campaign donations from the exact people a council votes on.

  Nobody should be able to answer a question by recognizing a label — no "do you think bribery is wrong" type stuff. Also tell me which pairs of positions the tree can't really separate, and if some combination of answers lands on a view nobody defends, say whether thats because it's incoherent or just because it's unattractive.
reasoning: |-
  Okay, the user runs a small electrical contracting business and keeps having arguments about what counts as corruption. They want a decision tree with concrete scenarios to help clarify different views without using jargon. The main positions they want to cover are: misuse of public office, fairness/cheating, local rules define corruption, and gift exchange as social glue. 

  First, I need to understand the user's context. They're dealing with family debates (brother-in-law vs. wife) and probably real business situations where gray areas come up. The examples they mentioned—like being the low bidder with mayoral connections, hiring a regulator's kid, or campaign donations—show they want nuanced cases that challenge binary thinking. 

  The challenge is designing scenarios that force people to reveal their underlying principles, not just parrot slogans. Each question needs concrete details: names, amounts, outcomes. Avoiding labels means no terms like "bribery" or "nepotism" in the questions themselves. 

  For the positions: 
  - Misuse of Public Office (A): Focus on abuse of power, regardless of outcome. 
  - Fairness Violation (B): Did someone lose a fair shot? 
  - Legalism (C): If it's legal locally, it's fine. 
  - Cultural Gift Economy (D): Gifts build relationships; Western rules don't apply. 

  I should add two more positions for depth: 
  - Institutional Harm (E): Undermines trust in systems. 
  - Outcome-Based (F): Only wrong if results are bad. 

  Now, brainstorming scenarios that pull in different directions: 
  1. **Campaign donations**: Legal but smelly—tests A vs. C. 
  2. **Hiring a regulator's qualified kid**: No money to official, but access? Tests B vs. D. 
  3. **Emergency repair via mayor's cousin**: Unfair process but good outcome? Tests F vs. B. 
  4. **Gift baskets to inspectors**: Small value, routine—tests D vs. A. 
  5. **Low bidder with family ties**: Fair price, but relationship known? Tests A vs. F. 
  6. **Contract renewal for late but good work**: Rewards results, skips bidding? Tests F vs. B. 
  7. **Permit expediting fee**: Unofficial but normal locally—tests C vs. D. 
  8. **Post-retirement job after favorable ruling**: No direct quid pro quo—tests E vs. C. 

  Scoring needs to handle overlaps. For example: 
  - High A scores: Consistent on abuse of power (questions 1,4,5,8). 
  - High B scores: Focus on lost opportunities (3,6). 
  - C and D might overlap on "local acceptance" (2,7) but diverge on gifts vs. legality. 

  Tricky pairs: 
  - A and E both care about systems, but E is broader (question 8 exposes this). 
  - B and F can conflict: fairness vs. results (question 6 is key). 

  Unattractive outcomes: If someone thinks gifts are fine (D) but also hates unfairness (B), they might land in no-man's-land on question 3 (emergency repair). That's coherent—cultural norms plus fairness—but rare in purist arguments. 

  Testing the flow: 
  Question 1 (campaign donations) should split Legalists (C: "no issue") from others. 
  Question 3 (emergency repair) isolates Outcome-Based (F: "good call") from Fairness (B: "unfair"). 
  Question 8 (revolving door) nails Institutional Harm (E) if they say it's corrupt despite legality. 

  Final check: All scenarios avoid labels, use specifics ("$250 baskets," "qualified kid"), and have plausible deniability. The scoring key maps messy human choices to philosophical boxes—exactly what the user needs to end those dinner-table fights.
answer: |-
  Here's a concrete decision tree with 9 scenario-based questions designed to reveal underlying views on corruption. Each question avoids labels and focuses on tangible actions and outcomes. The scoring key identifies 6 distinct positions, including the four you requested plus two common hybrids.

  ---

  ### **The "What Counts as Corruption?" Decision Tree**
  *Answer each scenario based on your gut feeling about whether it's corrupt. Choose the option closest to your view.*

  1.  **The Campaign Donation:** A city councilor votes to approve a lucrative zoning change for Developer X’s project. Three weeks later, Developer X donates $10,000 to the councilor’s re-election campaign, the maximum allowed by law.
      *   (A) This is corrupt.
      *   (B) This is legal and normal politics, not corrupt.
      *   (C) It looks bad, but if legal, it's not corruption.

  2.  **The Qualified Nephew:** A state regulator awards a safety inspection contract to Firm Y. The regulator’s nephew, a fully qualified and experienced inspector, works for Firm Y. The nephew got the job independently through a competitive hiring process. The regulator receives no money or direct benefit.
      *   (A) This is corrupt (nepotism/favoritism).
      *   (B) This is *not* corrupt as long as the nephew is qualified and the regulator didn't interfere.
      *   (C) This is normal family support, not corruption.

  3.  **The Emergency Repair:** During a major storm, the Mayor bypasses competitive bidding rules and directly hires her cousin’s electrical company (a qualified local business) to fix critical city hall wiring. The work is done well, on time, and at a fair market price. Other local firms complain they weren’t asked.
      *   (A) Bypassing rules for family makes it corrupt, regardless of outcome.
      *   (B) The outcome was good and the price fair, so it's not corrupt.
      *   (C) This is how things get done in an emergency; it's practical, not corrupt.

  4.  **The Gift Basket:** Every December, a large construction company sends $250 gourmet gift baskets to all electrical inspectors in the county. This is a long-standing tradition. Inspectors say it doesn't influence them.
      *   (A) This is corrupt (it creates an obligation).
      *   (B) This is not corrupt; it's just a harmless seasonal gift.
      *   (C) It's borderline, but common practice makes it acceptable.

  5.  **The Low Bid & The Brother-in-Law:** Your electrical contracting company (owned by the Mayor's brother-in-law) submits the lowest qualified bid for a city streetlight contract. The Mayor knows you bid but plays no role in the selection committee. You win fairly based on price and qualifications.
      *   (A) The relationship creates an *appearance* of corruption, so it’s problematic.
      *   (B) Winning fair and square based on the rules means it's not corrupt.
      *   (C) Family connections are how business works; it's legitimate.

  6.  **The Fast & Good Contractor:** A School Board awards a major renovation contract to Firm Z without competitive bidding because Firm Z did the previous phase a year early and 10% under budget. The Board President’s law firm does unrelated work for Firm Z. Other qualified firms protest.
      *   (A) Skirting bidding rules due to connections makes it corrupt.
      *   (B) Rewarding proven performance efficiently isn't corrupt.
      *   (C) The lawyer connection makes it look corrupt, even if technically legal.

  7.  **The Permit Expediter:** In Country M, getting an electrical permit takes 6 months unless you hire a local "expediter" (a well-connected individual) for a $500 "fee." The expediter guarantees the permit in 2 weeks. Everyone uses expeditors; it's an accepted cost of doing business.
      *   (A) This is corrupt (paying for preferential treatment).
      *   (B) This is not corrupt; it's the local system working as intended.
      *   (C) This is a practical service fee in a broken system, not personal corruption.

  8.  **The Retiring Regulator:** A government regulator overseeing utility companies rules favorably on a major rate increase for PowerCo. Six months after retiring, the regulator accepts a high-paying "consulting" role at PowerCo with vague duties.
      *   (A) This is corrupt (revolving door/reward for past favors).
      *   (B) This is not corrupt; people need jobs after public service.
      *   (C) It smells bad but isn't illegal, so not technically corruption.

  9.  **The Community Donation:** A developer seeking approval for a large housing project donates $100,000 to build a new playground in the district of the key planning commissioner. The donation is public, unconditional, and the playground benefits the community. The commissioner later votes "yes" on the project.
      *   (A) This is corrupt (buying goodwill/influence).
      *   (B) This is not corrupt; it's corporate social responsibility.
      *   (C) The community benefit outweighs any appearance issue.

  ---

  ### **Scoring Key & Positions**
  Tally your **A**, **B**, and **C** answers. Your dominant pattern reveals your underlying view:

  *   **Mostly A: Institutionalist (Misuse of Public Office)**
      *   Core Belief: Corruption is the *misuse of public power or resources for private gain*, or actions that *undermine public trust* in institutions, regardless of personal enrichment or local rules. Focuses on conflicts of interest, abuse of power, and erosion of systems.
      *   Sees Corruption In: Campaign donations timing (1A), Nephew's job (2A), Emergency family hire (3A), Gift baskets (4A), Low bid appearance (5A), No-bid award (6A), Expediter fees (7A), Revolving door (8A), Community donation influence (9A).

  *   **Mostly B: Fair Competitor (Cheating/Fair Shot Violation)**
      *   Core Belief: Corruption is *cheating* – giving someone an *unfair advantage* or *depriving* someone of a *fair opportunity* based on connections, bribes, or favoritism. If the process was fair and the outcome deserved, it's not corrupt. Rules are there to ensure fairness.
      *   Sees Corruption In: Campaign donations timing (1A - unfair influence), Nephew's job (2A - unfair access?), Emergency family hire (3A - unfair access), Gift baskets (4A - unfair influence?), Expediter fees (7A - unfair access). Sees *No* Corruption In: Qualified low bid (5B), Good performance rewarded (6B), Revolving door (8B - no *proven* cheating), Community donation (9B - no direct unfairness).

  *   **Mostly C: Legalist / Localist (Rules Define Corruption)**
      *   Core Belief: Corruption is *only* what the written laws or *locally dominant practices* define as corruption. If it's legal or customary, it's acceptable. Rules are arbitrary; focus is on compliance, not abstract principles.
      *   Sees Corruption In: Only if it clearly violates local written law. Sees *No* Corruption In: Legal donations (1B/C), Qualified nephew (2B/C), Emergency hire (3C), Customary gifts (4C), Low bid win (5B/C), Performance award (6C), Accepted expediter (7B/C), Legal job move (8B/C), Unconditional donation (9B/C).

  *   **Mix of B & C (Strong) / Some A (Weak): Cultural Gift Economist (Social Glue)**
      *   Core Belief: Gift-giving, reciprocity, and leveraging personal/family connections are essential *social glue* and efficient ways to build trust and get things done. Western "anti-corruption" rules misunderstand and disrupt these relationships. Corruption requires clear, direct theft or harm.
      *   Sees Corruption In: Blatant theft, maybe extreme coercion. Sees *No* Corruption In: Family connections used practically (3C, 5C), Customary gifts (4C), Expediter as local solution (7C), Community donation (9C). Might accept slight unfairness (some B answers) as a trade-off for relationship-based efficiency.

  *   **Mix of A & B: Systemic Harm Focus (Institutionalist + Fair Competitor Hybrid)**
      *   Core Belief: Corruption harms both *fairness (B)* *and* *institutional integrity (A)*. It's a spectrum where both unfair advantages *and* the erosion of trust in systems matter deeply. Leans towards stricter rules to prevent both harms.
      *   Sees Corruption In: Most scenarios where either fairness *or* trust is undermined (1A, 2A, 3A, 4A, 6A, 7A, 8A, 9A). Might accept 5B if process was truly clean.

  *   **Mix of B & C (Weak) / Mostly B: Pragmatic Outcome-Oriented**
      *   Core Belief: The *outcome* is paramount. If the result is good (fair price, good work, efficient service, community benefit) and no one was demonstrably *cheated* out of something they deserved (strong B), then strict adherence to rules or avoidance of connections (A) is less important. Efficiency matters.
      *   Sees Corruption In: Clear cheating for bad outcomes. Sees *No* Corruption In: Good outcomes via connections/shortcuts (3B/C, 5B, 6B, 9B), Customary practices if efficient (4C, 7C). Might reject revolving door (8A) or donation timing (1A) on principle.

  ---

  ### **Key Ambiguities & Unattractive Positions**

  1.  **Hard to Separate:**
      *   **Institutionalist (A) vs. Systemic Harm (A+B Hybrid):** They often agree on outcomes. The Hybrid might be *slightly* more tolerant of good-outcome scenarios (like 3 or 6) if fairness wasn't *egregiously* violated, while the pure Institutionalist focuses on the rule/trust breach itself.
      *   **Cultural Gift Economist (B/C Mix) vs. Pragmatic Outcome-Oriented (B/C Weak):** Both prioritize results and local norms. The Gift Economist emphasizes *relationships* and *culture* more strongly, while the Pragmatist focuses on *efficiency* and *tangible results*.
      *   **Legalist (C) vs. Cultural Gift Economist (B/C Mix):** Both accept local practices. The Legalist strictly follows *written* rules/laws. The Gift Economist follows *cultural norms and customs*, which may exist outside written law (like expediter fees).

  2.  **Incoherent/Unattractive Combinations:**
      *   **Strong A + Strong C:** Believes corruption is *only* violating public trust *and* *only* defined by local rules. This collapses into pure **Legalist (C)** unless local rules specifically define "misuse of public office," making the A component redundant. If local rules *don't* define such misuse as corruption, the A belief has no place. It's logically unstable.
      *   **Mostly A + Strong C:** Similar instability. If local rules permit something the Institutionalist (A) deems a misuse of office, which view wins? It leads to cognitive dissonance. In practice, people land on **Legalist (C)** or become **Institutionalists (A)** rejecting local norms.
      *   **Mostly B + Strong A:** This is essentially the **Systemic Harm Focus (A+B Hybrid)** position, which is coherent and common.
      *   **Mostly C + Some B:** This aligns with either the **Cultural Gift Economist** (if B reflects acceptance of relationship-based fairness trade-offs) or the **Pragmatic Outcome-Oriented** (if B reflects outcome focus) views.

  **How to Use:** Hand out the scenarios. Have people answer A/B/C for each. Tally their answers. Use the scoring key to show them which underlying view their pattern reveals. The concrete examples force engagement with nuances (e.g., qualified relative, good outcome via shortcut, legal but smelly donation) that abstract labels avoid, illuminating why the same person might call one thing corrupt and another not, based on their core principles. Good luck with the next family dinner!
