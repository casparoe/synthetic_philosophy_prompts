prompt: |-
  I referee for a journal that publishes economic history and comparative politics, and a striking share of the manuscripts I see assert that some outcome was path-dependent, then let the assertion carry the argument. Before I write the same report again, I want the specification I ought to be applying. Lay out what a claim that an outcome was locked in by its own history must deliver in order to be more than a way of saying that it changed slowly: the conditions it has to establish, the distinctions it may not blur — path dependence against mere hysteresis, lock-in against plain durability, a critical juncture against a slow drift — and, for each item, the case or consideration that makes it a requirement rather than a matter of taste. Say which requirements are non-negotiable if the claim is to be intelligible at all and which bind only particular schools of explanation. Then take a position on two problems I cannot settle for myself. First, what would count as evidence distinguishing genuine lock-in from the rival thesis that any of several routes would have converged on a functionally equivalent outcome anyway? Second, is the demand that the branching event be identified compatible with the demand that the outcome be robust once reached — if a trajectory is that sensitive to small events, can any one small event properly be called its cause? Close with a sentence or two on which single requirement does the most to eliminate candidate accounts. Please answer in continuous prose, the way one would write a letter: no headings, bullet points, bold, or tables.
reasoning: |-
  Okay, the user is an academic referee in economic history and comparative politics who's frustrated with authors casually invoking "path dependence" without proper substantiation. They want a rigorous specification of what truly constitutes path dependence beyond mere persistence, including necessary conditions, key distinctions, and solutions to two theoretical problems they're grappling with. 

  Hmm, this is clearly someone deeply immersed in institutional analysis who's spotted a pattern of conceptual laziness in their field. Their request reveals three layers: first, a practical need for concrete evaluation criteria (the referee hat); second, a theoretical hunger for clarified ontology (the scholar hat); third, unspoken career fatigue from repetitive peer review. That last bit about "writing the same report again" suggests they're tired of policing sloppy scholarship.

  Right, let's break this down systematically. The core challenge is separating path dependence as a specific causal mechanism from banal historical continuity. For the claim to hold water, authors must establish: (1) contingency at origin via a branching event where alternatives were plausible; (2) self-reinforcement mechanisms that actively resist change; (3) lock-in demonstrated through failed attempts at reversal. Mere persistence isn't enough - think QWERTY keyboards (genuine lock-in) versus Mediterranean diets (just durable).

  Ah, and they're particularly vexed by two thorny issues. First, how to disprove functional equivalence - that multiple paths could've led to similar outcomes. That requires showing the actual outcome is inefficient or suboptimal compared to alternatives, like how VHS beat Betamax despite technical inferiority. Second, the apparent paradox between sensitivity at branching points versus robustness later. The resolution lies in temporal asymmetry: small causes have big effects only during institutional fluidity before reinforcement kicks in.

  The real litmus test? Demonstrating increasing returns or network effects that create switching costs. If authors can't pinpoint why deviation became harder over time - not just that it didn't happen - their argument collapses into historical anecdote. That's the requirement that filters out most weak manuscripts.
answer: |-
  My dear colleague,

  Your frustration is one I’ve encountered often myself, and it stems from a vital concern: the term "path dependence" risks becoming a sophisticated-sounding synonym for "history mattered," draining it of explanatory power. To rescue it from vacuity and provide a meaningful specification for your refereeing, we must demand authors establish several interlocking conditions. These aren't merely stylistic preferences; they are logical requirements for the concept to do distinct causal work beyond stating that change is incremental or that past states influence present ones.

  First and foremost, a non-negotiable condition for *any* coherent claim of path dependence is **contingency at a branching point (a "critical juncture")**. The author must demonstrate that at some specific historical moment, multiple plausible institutional, technological, or policy trajectories were genuinely available. This requires reconstructing the historical context to show real alternatives were considered, feasible given the constraints of the time, and not foreordained by prior deep structures. Without establishing this contingency, the claim collapses into historical determinism – the very opposite of path dependence. The case for this requirement is foundational: if the outcome was the *only* possible one given antecedent conditions, invoking a specific "path" adds nothing; path dependence only makes sense if other paths were live possibilities that *could* have been taken.

  Second, the author must identify and substantiate the **self-reinforcing mechanisms (or increasing returns processes)** that caused the initial contingent choice to become progressively "locked in." This is the core engine of path dependence, distinguishing it from mere hysteresis (where past states influence present outcomes due to simple persistence or adjustment costs, without active reinforcement). Examples include: set-up or fixed costs creating economies of scale (e.g., infrastructure investments), learning effects making established practices more efficient (e.g., skill acquisition around a technology), coordination effects increasing the payoff of conformity (e.g., network externalities like a dominant language), and adaptive expectations shaping future investments. The requirement stems from the need to explain *why* the system didn't drift back or switch paths later – lock-in implies an active process making deviation *increasingly* costly or difficult over time, not just that change hasn't occurred. Hysteresis might explain short-term stickiness; lock-in explains durable, self-sustaining rigidity.

  Third, **robustness of the outcome against subsequent pressures for change** must be demonstrated. This isn't just slow change; it's resilience in the face of significant countervailing forces – shifts in relative prices, new technologies, political upheavals, or deliberate reform efforts. Authors must show that despite such challenges, the core institutions or practices persisted *because* of the self-reinforcing mechanisms established earlier. This requirement separates lock-in from mere durability or slow evolution. Durability might be explained by ongoing efficiency or deep cultural embedding; lock-in implies persistence *despite* emerging inefficiencies or pressures, sustained by the increasing returns identified.

  Now, to your specific quandaries. Distinguishing genuine lock-in from functional convergence is indeed challenging. The key evidence lies in **revealed inefficiency or sub-optimality**. If the locked-in outcome is demonstrably *less* efficient or functional *over time* compared to plausible alternatives (past or present), and yet persists due to the self-reinforcing mechanisms, this strongly counters the functional equivalence argument. For instance, the persistence of the QWERTY keyboard despite demonstrable inefficiencies compared to alternatives like Dvorak, sustained by network effects and retraining costs, argues against convergence on the "best" solution. Authors need to identify such inefficiencies and tie persistence directly to the mechanisms of lock-in, not just to a lack of challenge. Showing that functionally *different* outcomes emerged from similar starting points (divergence) also weakens the convergence thesis.

  Regarding the sensitivity/robustness paradox: it is resolvable by recognizing the **temporal asymmetry** inherent in path dependence. A critical juncture is a period of *institutional fluidity* where structures are malleable and small events or choices can have large, lasting consequences precisely *because* they initiate self-reinforcing sequences. Once these sequences mature and lock-in occurs, the system becomes highly *insensitive* to subsequent small perturbations. The cause isn't *one* small event in isolation, but the *contingent selection* of one trajectory during the fluid phase, which then triggers mechanisms generating robustness. The "cause" is the conjunction of the contingent choice *and* the subsequent self-reinforcing dynamics it unleashed. Demanding identification of the branching event is compatible with demanding robustness later; the sensitivity belongs to the origin moment, not the locked-in state.

  Finally, while contingency at the critical juncture is the essential starting point, the single requirement that does the most heavy lifting in eliminating weak candidate accounts is the **demonstration of specific, operative self-reinforcing mechanisms generating increasing returns.** It is the linchpin. Without it, claims of path dependence often default to mere persistence narratives or conflate lock-in with other forms of stability. Requiring authors to precisely name, describe, and empirically substantiate *how* the initial choice became self-reinforcing – making deviation progressively harder – forces the rigor that separates a meaningful historical explanation from a rhetorical flourish invoking the past. If they cannot articulate *why* the path became sticky beyond inertia or sunk costs, the claim fails the core test of path dependence.

  I hope this framework provides the sharper tools you need to demand more rigorous historical argumentation from authors invoking this powerful, but often misapplied, concept.

  Warm regards,

  A Fellow Referee
