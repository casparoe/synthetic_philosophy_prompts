  Here's a clean, British take on that idea, focusing on the *degree* of survival:

  **Setup:**  
  "My aunt worries what happens to her 'self' after she dies. I told her not to fret – according to Hofstadter, she'll live on in the minds of those who knew her well."  

  **Punchline:**  
  "Mind you, she was horrified to learn she'd probably survive most accurately as the slightly different version in her bridge partner Muriel's head... who still thinks she *liked* sprouts."

  ### Why it works
  *   **Core Concept:** Directly uses the idea of a person's "self" surviving as a mental pattern in others.
  *   **Degree of Survival:** Highlights that the "truest" copy isn't necessarily with family ("aunt"), but with someone who interacted intensely and recently ("bridge partner Muriel").
  *   **Edited Copy:** The punchline hinges on this mental copy being *imperfect* and containing a specific, slightly wrong detail ("liked sprouts") – showing it's an edited version shaped by Muriel's perception.
  *   **British & Clean:** Uses phrasing like "fret," "horrified," "bridge partner," and "sprouts." Humour comes from the relatable inaccuracy of memory, not crudeness.
  *   **Dinner-Party Ready:** Short, conversational setup, relatable punchline about memory quirks, no heavy philosophy needed.

  **How to deliver:** Keep it light and conversational, pausing slightly after "head..." for the sprout reveal. Works because everyone understands someone remembering them slightly wrong!
