prompt: |-
  ok so I need help turning a 2am argument into an actual proposal. I'm applying for my department's summer research grant — ten weeks, small money, and the committee has one person on it who thinks anything with a complexity class in it isnt philosophy.

  Here's the thing me and my friend were fighting about. There's this increasingly popular move where you take an "ought implies can" style principle and make it computational. You can't be rationally required to believe all the consequences of what you believe if deriving them is intractable. You can't be required to maximize expected utility if finding the optimum is NP-hard. You can't blame an electorate for failing to detect a manipulation of a voting rule if detecting it is NP-hard. Complexity gets asked to do the work that "feasibility" or "reasonable effort" used to do, and it looks rigorous, which is part of why it's spreading.

  My friend does complexity theory and says the whole move is a catgory error. Hardness results are worst-case statements. NP-hardness tells you nothing about the instances an actual agent faces — SAT solvers chew through enormous industrial instances all the time. So "it's NP-hard, therefore you're excused" is on the level of "it's cold somewhere, therefore bring a coat." I pushed back that average-case hardness is the fix: Levin-style distributional problems, smoothed analysis for stuff like the simplex method, Impagliazzo's five worlds, where Heuristica is precisely the world in which worst-case-hard problems are easy on the distributions that actually occur. And he said: fine, but now your excuse is indexed to a distribution, and where did the distribution come from? Pick a different one and the normative verdict flips, so you've traded a false principle for an unfounded one. That's where we got stuck and honestly its a good point.

  So write the proposal. I want the question stated precisely enough that it could come out either way, and if you can frame it as: is the distribution-sensitivity fatal, or does it turn the principle into something interestingly context-dependent — I have a hunch this rhymes with the pragmatic-encroachment arguments in epistemology, where whether you know depends on what's at stake, but I don't want to just gesture at that, I want it earned or cut. Then: why the existing positions on both sides leave the question open rather than settling it, what I would actually do week by week, what a result would look like, and what would count as the project failing — including the possibility that it fails because there's no general answer, only a mess of case-by-case verdicts. Use the voting-manipulation debate as the running example since that's where the back-and-forth is most developed, and then say what would have to be true for the conclusion to carry over to something like intractable moral calculations.

  End with a short honest note on what's too ambitious for ten weeks, because I always overscope and the committee always notices.

  No bibliography and no lit review padded out with names — I'll put the references in myself. I'd rather you get the argument structure right.
reasoning: |-
  Okay, let me break this down. The user needs a summer research grant proposal that transforms their 2am complexity theory argument into a rigorous philosophical investigation. The core tension is between using computational hardness as a normative excuse ("ought implies can") and the distribution-dependence criticism raised by their friend.  

  First, the problem needs sharpening: Worst-case hardness results (like NP-hardness) don't map to real-world feasibility since actual instances may be easy. Average-case analysis (Levin distributions, smoothed analysis) fixes this but makes normative verdicts distribution-dependent—and that distribution choice itself lacks justification. This creates a dilemma: Either the excuse is false (worst-case) or unfounded (distribution-relative).  

  The voting manipulation example is perfect for grounding this: Detecting manipulation in certain voting rules is NP-hard, but real elections use structured preferences. If we excuse electorates only when manipulation is hard on plausible preference distributions, who decides what's "plausible"? Philosophers might assume uniform randomness; social scientists might posit correlated preferences. The normative verdict shifts with this choice.  

  To make this philosophical, I see two paths:  
  1) **The Fatal Flaw View**: Distribution-dependence exposes computational excuses as circular—they smuggle in normative assumptions about "reasonable" contexts.  
  2) **The Contextualist View**: This dependence isn a bug but a feature, aligning with pragmatic encroachment (knowledge depending on stakes) or feasibility-as-contextual. But this needs arguing, not gesturing.  

  Existing positions leave this open:  
  - *Computer scientists* (like the friend) stop at "worst-case ≠ real-world" but don't resolve the normative gap.  
  - *Philosophers* using complexity often ignore distributional sensitivity (e.g., List-Peterson voting papers).  
  - *Formal epistemologists* (like Isaac Levi) treat feasibility as binary, not gradable via complexity.  

  The project would:  
  1. Formalize the dilemma using voting manipulation as a case study.  
  2. Survey existing average-case approaches in COMSOC (e.g., Faliszewski's work on restricted domains).  
  3. Map where normative claims implicitly assume distributions.  
  4. Test coherence: Can we define "plausible distributions" without normative baggage?  

  A success might show:  
  - For voting: Excuses only hold if we pre-define "reasonable" electorates (e.g., single-peaked preferences). This shifts debate to what counts as reasonable.  
  - For moral calculations: Carrying over requires showing that tractability depends on *empirically grounded* distributions of moral dilemmas.  

  Failure looks like:  
  - Every case needing ad-hoc distribution choices; no general framework.  
  - Distributions always encoding normative assumptions, making excuses circular.  

  Scope limits:  
  - 10 weeks is too short for new complexity proofs or large-scale empirical work.  
  - Focus should be clarifying the dilemma and testing it against 1-2 cases (voting + one other).  
  - Avoid overclaiming; this is groundwork, not a grand theory.  

  The honest note: Proving general impossibility of distribution-independent excuses is too ambitious. So is fully developing contextualism. Stick to mapping the problem.
answer: |-
  ## Proposal: Computational Excuses and the Distribution Dilemma — Can Feasibility Ground Normative Excuses Without Circularity?

  **Core Research Question:** When computational hardness is invoked to excuse agents from normative demands (e.g., "You cannot be blamed for failing to detect voting manipulation if it’s NP-hard"), does dependence on *problem distributions* render the excuse (a) fatally arbitrary, or (b) a foundation for a novel, context-dependent account of normative feasibility?

  **The Stakes & Background:** Computational "ought implies can" principles are proliferating, replacing vague notions of "feasibility" or "reasonable effort" with rigorous hardness results. Yet, as my late-night debate highlighted, worst-case hardness (e.g., NP-hardness) is often irrelevant to real agents facing structured instances. Average-case analysis (e.g., Levin’s distributional problems, smoothed analysis) fixes this by tying hardness to specific input distributions. But this introduces a new problem: **The Distribution Dilemma**. If the normative verdict ("excused" vs "not excused") flips depending on the chosen distribution, is the resulting principle merely an unfounded assumption? Or does this distributional sensitivity reveal a deeper, contextually rich structure for normative feasibility?

  **Why Existing Work Leaves the Question Open:**
  1.  **Computer Science** (e.g., Impagliazzo's Worlds, Spielman-Teng smoothed analysis) provides tools for average-case analysis but treats distributions as *given* for complexity-theoretic purposes. It doesn’t address the *normative justification* for choosing one distribution over another for an ethical/excuse claim.
  2.  **Philosophy Leveraging Complexity** (e.g., List & Pettit on voting manipulation, Berman et al. on epistemic obligations, Thomason on moral deliberation) often relies on worst-case hardness or informally gestures to "typical" cases. It largely sidesteps the formal and philosophical challenges posed by explicit distributional dependence.
  3.  **Formal Epistemology/Ethics** (e.g., Levi on feasibility, Clarke on bounded rationality) discusses context-dependence but lacks the computational precision to model how *specific* constraints (like NP-hardness) interact with distributions to ground excuses. Pragmatic encroachment analogues (e.g., Stanley on knowledge and stakes) suggest context matters, but they don’t provide a model for *how computational distributions generate normative contexts*.

  **The Running Example: Voting Manipulation & Blame.**
  *   **The Claim:** "An electorate cannot be reasonably blamed for failing to detect manipulation of a voting rule if detecting that manipulation is NP-hard." (Following arguments in social choice theory).
  *   **The Deficiency:** Worst-case NP-hardness (e.g., for manipulation in STV voting) ignores that real-world elections involve structured preference profiles (e.g., single-peaked, Euclidean) where manipulation might be easy to detect. Average-case analysis (e.g., hardness under uniform random preferences) is unrealistic; real preferences are correlated.
  *   **The Dilemma Illustrated:** If we use a distribution reflecting highly correlated preferences (e.g., single-peaked), detection might be easy (no excuse for the electorate). If we use a distribution of chaotic, adversarial preferences (e.g., worst-case or uniform), detection might be hard (excuse granted). The normative verdict depends entirely on the chosen distribution. **The Open Question:** Is this dependence a fatal flaw rendering the excuse principle arbitrary? Or does it correctly show that blameworthiness *should* depend on the *actual* distribution of preference profiles faced by the electorate (e.g., based on sociological data), turning "feasibility" into an empirically grounded, context-sensitive notion?

  **Methodology & Week-by-Week Plan:**
  *   **Weeks 1-2: Formalize the Dilemma.** Precisely define the "computational excuse" schema: Normative obligation O requires performing computational task T. Claim: If T is hard (under distribution D) for agent A, then A is excused from O. Identify key parameters: T, A (voter, AI, moral agent?), D, "hardness" (worst-case, average-case, heuristic, heuristic+distribution).
  *   **Weeks 3-4: Case Study Deep Dive (Voting Manipulation).** Analyze specific NP-hard voting manipulation detection problems (e.g., for STV, Copeland). Catalog proposed average-case/distributional approaches in computational social choice (e.g., Faliszewski et al. on restricted domains, Xia-Conitzer on smoothed complexity). Map how explicit/implicit distributional choices in these papers drive their normative implications (excuse or no excuse).
  *   **Weeks 5-6: Philosophical Analysis of Distributional Dependence.** Categorize potential responses to the dilemma:
      *   *Fatal Flaw:* Dependence makes excuses irredeemably arbitrary/unfounded; collapses into relativism.
      *   *Contextualism:* Dependence is legitimate; "feasibility" is inherently context-dependent (link cautiously to pragmatic encroachment: the "stakes" might influence what distribution is relevant, but need argument, not mere analogy).
      *   *Hybrid/Empirical:* Excuses require grounding D in *empirical reality* (e.g., distributions learned from voter data). Assess feasibility.
  *   **Weeks 7-8: Generalization Test (Moral Calculations).** Using a clear example (e.g., "You cannot be obligated to maximize expected utility if finding the optimum for this decision problem is NP-hard"), identify what conditions must hold for the dilemma/solution from voting to carry over:
      1.  Existence of well-defined computational task T central to the obligation O.
      2.  Plausible variability in the empirical distribution of problem instances faced by agents.
      3.  Tractability of T being sensitive to changes in this distribution.
  *   **Weeks 9-10: Synthesis & Failure Modes.** Draft findings. Define explicit success/failure criteria. Prepare final report.

  **What a Result Looks Like & Failure Modes:**
  *   **Success (Significant Insight):** A clear framework showing *how* distributional sensitivity works:
      *   *Option 1 (Fatal):* Demonstrating that justifying D always requires normative assumptions as strong as the original excuse, making it circular. Computational rigor adds no real justification.
      *   *Option 2 (Contextual):* Showing that D-dependence forces a valuable shift: Normative feasibility *must* be indexed to empirically grounded contexts (agent capabilities + environment structure). This refines, not replaces, "ought implies can."
  *   **Partial Success (Case-Specific Clarity):** A definitive analysis of the voting manipulation case showing the excuse *only* holds under specific, contestable distributional assumptions, shifting the debate to justifying *those* assumptions.
  *   **Failure (Ambition Exceeded):**
      *   **No General Answer:** The dilemma yields only a "mess of case-by-case verdicts" with no unifying framework. The project documents this fragmentation as its core result.
      *   **Empirical Black Hole:** Concluding that justifying D requires substantial empirical work (e.g., large-scale preference modeling) impossible within normative philosophy or this project's scope.
      *   **Conceptual Collapse:** Finding that "distribution" in the complexity sense is too narrow or misaligned with the normative concept of "context," making the link unsustainable.

  **Honest Scope Note (What’s Too Ambitious for 10 Weeks):**
  *   **Developing novel complexity proofs or new average-case analyses.** This is about *interpreting* and *structuring* existing results philosophically.
  *   **Conducting original empirical studies** (e.g., gathering large datasets of voter preferences). We will rely on published distributions/models.
  *   **Providing a fully general, formal theory** of computation-dependent normative obligations. The goal is a rigorous *framework* and *analysis of the dilemma*, not the final theory itself.
  *   **Definitively resolving** whether distributional sensitivity is fatal or salvific across all domains. We aim for clarity on the *structure* of the problem and a robust answer within the voting case, with pathways identified for moral calculations.

  **Outcome:** This project will produce a detailed philosophical analysis of a critical weakness in an increasingly influential methodological move. It will either expose a fundamental arbitrariness, demonstrate how to ground computational excuses rigorously in context, or clearly map why a unified answer is impossible—providing significant value regardless of the verdict. The voting case study ensures concreteness; the generalization test ensures wider relevance.
