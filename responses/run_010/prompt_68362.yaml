prompt: |-
  You are a scholar of late-antique moral philosophy who has spent twenty years teaching Augustine's treatises on lying to analytically trained non-specialists, and who also reads rationalist blogs and forums closely enough to know how that audience argues. Please think carefully about this before answering, and work in two passes: first a short brainstorming section in which you list the candidate load-bearing examples you considered and say in a line each why you rejected all but one, and only then the plan itself.

  The situation. I run the ideas track at an annual weekend gathering for a rationalist community — sixty or so attendees, heavy overlap with the effective-altruism and forecasting scenes, median age around thirty, almost none of them with any background in pre-modern philosophy. Next spring I have sixty minutes with a self-selected subgroup of about fifteen on Augustine's argument that lying is never permissible. I want the argument, not the text and not the man. I am not assigning readings, so please do not give me a bibliography, a suggested further-work list, or anything I would have to go and look up; and since I do not have the treatises in front of me while I teach, please paraphrase rather than put words in quotation marks — I want the reasoning, and I would rather have no phrasings at all than invented ones.

  The audience's priors, which are the real obstacle. They already have a sophisticated instrumental account of why lying is bad: it erodes the trust that makes testimony usable, it degrades the epistemic commons, it breaks the cooperative equilibrium, and it corrupts the liar's own calibration. On that picture an absolute prohibition looks like either naivety or a consequentialist calculation in disguise. They are also trained to reach for the murderer-at-the-door case, and I expect it out of someone within ninety seconds. There are two failure modes I am trying to avoid: the session lands as a museum piece, and the session lands as a strawman they get to beat up on for an hour.

  What I need from you, as a numbered plan:

  1. The through-line: one sentence that the whole sixty minutes exists to install. Everything below must visibly serve it, and if a component doesn't, cut it.

  2. A block-by-block timeline with the dependency structure made explicit. For each block, state what must already be in place for it to be intelligible and which later block needs it. My working hypothesis is that the definition has to land first and that everything downstream is unintelligible without it — specifically, that a lie on this account is a mismatch between what the speaker signs and what the speaker holds in the heart, rather than between what the speaker signs and how the world is, so that a sincerely asserted falsehood is no lie at all while an asserted truth the speaker believes to be false is one. Tell me whether that is right and whether it really is first; if your dependency structure differs from my guess, say so plainly and give me yours.

  3. The load-bearing case. Not the murderer at the door — they have that one pre-rehearsed and it triggers the script rather than the thinking. Choose a single different case that can carry the definition, the teleology of speech, the grading, and the permission to remain silent, and say precisely what properties it must have and what it must lack. Also give me one backup case for when the first one fails to land, and tell me how I will know by minute fifteen that it has failed.

  4. The grading of lies. I recall that the treatise ranks kinds of lie by seriousness, with lying about religious doctrine at the worst end and lies that harm no one but save someone from death or from bodily violation near the least-bad end, but I do not trust my memory of the middle rungs and I have no intention of being caught out in front of fifteen people. So do not recite the list. Give me the ordering principle instead: the dimension along which the scale is monotone, and whether that dimension is harm done, injustice, damage to the liar's own soul, damage to the community of speakers, or some combination. If the principle is not in fact consistent all the way down, tell me where it strains and which part of the scale I should simply not touch.

  5. Objection placement, treated as triage rather than as a list. For each of the following, say whether it can be headed off by construction, before it forms, or only repaired afterwards, and name the point in your sequence where the work gets done: (a) this is just Kant four centuries early; (b) lying means asserting a falsehood, so this is really a debate about edge cases; (c) the definition turns every novel and every joke into a lie; (d) if silence and concealment are permitted, he has smuggled the calculation back in through the back door; (e) remove the theological premises and nothing is left. Then tell me which of these five I have misjudged, and which sixth objection I have not thought of that will cost me more than any of them.

  6. The steelman, stated without flinching. Identify the one respect in which this argument does work that my audience's trust-erosion account genuinely cannot do — my guess is that it locates the wrongness in the speaker's relation to her own mind rather than in downstream effects on hearers, which their account has no place for. And give me your honest verdict on whether that survives the removal of the theological premises, since item (e) is the first question I will get and I refuse to improvise the answer.

  7. Two smaller judgment calls. First: the biblical hard cases, where he argues that divine reward tracks mercy or faith rather than endorsing the deception — do I bring these in at all, and if so where, given that my audience is likely to find the exegesis more embarrassing than illuminating? Second: the distinction between not-speaking-a-truth and speaking-a-falsehood, together with his willingness to have the innocent person suffer rather than lie — is that the load-bearing move or the one that will cost me the room, and how do I sequence it against the rest?

  8. Scope cuts: what I should openly decline to explain at this level, and for each cut, whether it is safe or lossy — that is, whether the argument still stands without it. The polemic against the sectarians who held that feigning was pious, the grace controversies, the Latin terminology, the medieval reception: I suspect some of these are free to drop and one is not.

  9. The check. One question I can put to the room at minute fifty-five that discriminates understanding from polite agreement, plus what a good answer and a merely agreeable answer each sound like.

  Write the plan concretely enough that I could hand it to someone else and they could run the session from it alone.
reasoning: |-
  Okay, the user is asking for a detailed plan to teach Augustine's argument against lying to a rationalist audience. Let me start by understanding the scenario. They run an ideas track at a gathering for rationalists, mostly from effective altruism and forecasting backgrounds. The attendees are around thirty, with no pre-modern philosophy background. The main goal is to present Augustine's argument without focusing on the text or the man, in 60 minutes to about 15 people. No readings assigned, so everything has to be self-contained.

  The audience already has a sophisticated instrumental view: lying erodes trust, harms cooperation, etc. They see absolute prohibition as naive or disguised consequentialism. They'll bring up the murderer-at-the-door thought experiment quickly. The user wants to avoid two failure modes: the session feeling like a museum piece or a strawman they can attack.

  First, I need to brainstorm the load-bearing examples. The murderer-at-the-door is out because it's overused. The biblical cases like Hebrew midwives or Rahab might not resonate with a secular audience. Jokes and fiction are problematic because Augustine's strict definition could classify them as lies, which is a distraction. Concealment cases like hiding Jews during WWII might work but could lead to consequentialist debates. A case of misdirection under threat (e.g., hiding a friend from an abuser) seems better. It's relatable, avoids theological elements, and forces a focus on internal state versus external consequences. That's the primary case. If it fails, I can use a corporate whistleblower scenario where truth-telling has personal cost but no immediate harm to others. Failure to land would be if the audience keeps discussing harm instead of the speaker's intent.

  The through-line must be that lying corrupts the liar's relation to their own mind, regardless of outcomes. That's the core difference from the audience's instrumental view. The dependency structure starts with the definition: a lie is insincere communication, not false content. Then teleology—speech is for truth-sharing. Then grading lies by internal harm. Finally, permission to remain silent as the alternative.

  For objection handling, "this is just Kant" can be addressed by contrasting Augustine's internal focus with Kant's universalizability. The definition debate (b) is preempted by defining lie as insincerity early on. Jokes and fiction (c) are handled by showing Augustine considers them lies but less severe, though it's a point of tension. Silence as a loophole (d) is managed by distinguishing silence from deception. Theological premises (e) are addressed by showing the soul-corruption argument can stand without grace. The sixth objection might be about practical viability, which needs case-based discussion in the steelman section.

  The steelman is that Augustine addresses the liar's self-harm, which instrumental views ignore. This survives without theology if framed as psychological integrity. Biblical cases are best avoided; if needed, mention them briefly as Augustine's examples without deep exegesis. The silence vs. lie distinction is crucial but must be sequenced after the definition and teleology to avoid losing the audience.

  Scope cuts: polemic against sectarians, grace controversies, Latin terms, and medieval reception can all be dropped safely. The core argument stands without them.

  The check question at minute 55: "What's the one thing Augustine thinks is damaged even in a lie that saves a life?" A good answer focuses on the liar's relation to their own words; an agreeable one talks about societal trust.

  I need to ensure the plan is concrete enough for someone else to run the session. Each block must build on the previous, with clear timing. Start with definition, then teleology, the load-bearing case, grading, objections, steelman, and silence. Use the misdirection case to illustrate throughout. Handle objections at key points to prevent derailment. Keep it focused on the internal dimension, contrasting with the audience's prior beliefs.
answer: |-
  ### Brainstorming: Candidate Load-Bearing Cases  
  - **Murderer-at-the-door**: Rejected. Audience is over-rehearsed; triggers instrumental counterarguments.  
  - **Biblical cases (e.g., Hebrew midwives)**: Rejected. Theological premises distract; audience finds exegesis alienating.  
  - **Jokes/fiction**: Rejected. Definitional edge case; sidetracks into semantics.  
  - **Concealment (e.g., hiding Jews in WWII)**: Rejected. Blurs into silence/permission debate prematurely.  
  - **"Friend in the closet" (misleading an abuser)**: **Selected**. Forces focus on internal state vs. outcome, lacks heroic framing, and avoids theology.  
  - **Backup: Corporate whistleblower pressured to falsify data**. Use if audience fixates on "harmless" lies by minute 15 (e.g., "But what if no one finds out?").  

  ---

  ### Plan  
  **1. Through-Line**  
  *Lying corrupts the speaker’s relation to their own mind—a unique moral harm independent of consequences.*  

  **2. Dependency Structure & Timeline**  
  *(Your hypothesis is correct: definition first, silence last)*  
  - **Min 0–10: Definition**  
    *Depends on:* Nothing. *Feeds:* Everything.  
    - Define lie: **"Signing" (verbally/physically affirming) what you consciously hold as false in your heart.**  
    - Clarify: Sincere falsehood (e.g., mistaken testimony) ≠ lie; insincere truth (e.g., sarcasm) = lie.  
  - **Min 10–20: Teleology of Speech**  
    *Depends on:* Definition. *Feeds:* Grading, cases.  
    - Speech exists **only** for truth-sharing. Lying weaponizes it against its purpose, like using a scalpel to stab.  
  - **Min 20–35: Load-Bearing Case ("Friend in the Closet")**  
    *Depends on:* Definition + teleology. *Feeds:* Grading, silence permission.  
    - *Case:* Your friend hides in your closet from an abusive partner pounding on your door. You say, "They’re not here," *while believing they are*.  
    - *Properties it must have:* High stakes (life/safety), clear internal conflict, no easy escape.  
    - *Must lack:* Divine command, "heroic" framing (avoid martyr-complex triggers).  
    - *Work the case:* Q: "Is this a lie?" (Yes, by definition). Q: "Is it wrong?" (Yes—corrupts your mind’s relation to words). Q: "What’s the alternative?" (Silence: next block).  
  - **Min 35–45: Grading of Lies**  
    *Depends on:* Case + teleology. *Feeds:* Steelman.  
    - **Ordering principle:** *Damage to the liar’s soul* (integrity of mind-words alignment).  
    - Monotonic along **"Perverted purpose of speech"**:  
      - *Least bad:* Lies protecting bodily safety (misuses speech but serves life).  
      - *Worst:* Lies corrupting sacred truth (weaponizes speech against its highest end).  
    - *Strain point:* Don’t touch middle rungs (e.g., "polite lies"). Scale holds only at extremes.  
  - **Min 45–50: Silence Permission & Distinction**  
    *Depends on:* Case + grading. *Feeds:* Objections.  
    - Silence ≠ deception. Refusing to speak truth isn’t "signing" falsehood.  
    - In closet case: Slam the door silently; don’t say "They’re not here."  
    - *Cost to room:* Acknowledge it feels cruel—but Augustine demands *accepting suffering* over self-corruption.  
  - **Min 50–55: Objections & Steelman**  
    *Depends on:* All prior. *Feeds:* Through-line.  
    - Handle objections:  
      - (a) *"This is Kant early"*: **Headed off in teleology block.** Augustine cares about *purpose of speech*, not universalizability.  
      - (b) *"Debate about edge cases"*: **Repaired in definition block.** If they conflate lie/falsehood, restart: "This is about sincerity, not accuracy."  
      - (c) *"Jokes/novels are lies"*: **Headed off in grading.** Augustine *does* call them lies but ranks them minimally harmful (frivolous misuse ≠ corruption).  
      - (d) *"Silence smuggles calculation in"*: **Repaired in silence block.** Silence isn’t deception; it’s non-participation. Calculation is external—Augustine cares about internal act.  
      - (e) *"Theology required"*: **Steelman addresses this.**  
    - **Sixth objection (you missed):** *"This is self-indulgent in crises."* **Costliest—repair in steelman.**  
    - **Steelman:** "Your trust-erosion model can’t capture the *immediate self-violation* of lying. Augustine names why lying feels toxic *as you do it*—even if no one is harmed or deceived. **This survives theology removal:** Replace 'soul' with 'integrity of mind-language faculty'."  
  - **Min 55–60: Check & Recap**  
    *Depends on:* Steelman.  

  **3. Biblical Cases & Small Calls**  
  - **Biblical hard cases (e.g., Rahab)**: *Don’t bring in.* Distracts; undermines secular framing.  
  - **Silence vs. lie distinction**: *Load-bearing but costly.* Sequence *after* case/grading (min 45). Stress: "He demands we *endure* suffering to preserve our minds."  

  **4. Scope Cuts**  
  - **Safe to drop**: Polemic against sectarians, grace controversies, Latin terms, medieval reception.  
  - **Lossy but necessary to drop**: Theological justification for soul’s immortality. Argument stands on mind-integrity grounds.  

  **5. Check at Min 55**  
  - **Question:** *"What’s the one thing Augustine thinks is damaged even in a lie that saves a life?"*  
  - **Good answer:** "The liar’s own relation to their words" / "The purpose of speech inside them" (focuses on internal harm).  
  - **Agreeable answer:** "Trust in society" / "The liar’s reputation" (relapses to instrumentalism).  

  ---

  **Why This Works**  
  - **Avoids museum-piece**: Anchors in relatable modern dilemma (abuser case), strips theology.  
  - **Avoids strawman**: Steelman forces engagement with unique internal-harm claim.  
  - **Load-bearing case** forces collision: Audience wants to praise the lie; Augustine condemns the liar. The dissonance *is* the point.  
  - **Backup case** (whistleblower) is less visceral but uses EA-aligned integrity concerns if primary stalls.  
  - **Silence move** late prevents early derailment into "but what about hiding Jews?" debates.  

  Execute cold; no research needed. If they cite Kant, shrug: "Similar conclusion, alien foundation."
