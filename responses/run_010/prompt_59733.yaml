answer: |-
  ## Board of Certified Judges of Taste: Certification Programme FAQ

  **1. Who is eligible to apply for certification as a True Judge?**
  Eligibility requires demonstrable possession of five core competencies: Sound Sense (assessed via structured interview), Delicate Sentiment (evaluated through curated aesthetic response logs), Practice Improvement (documented via 1,000-hour Practice Log across approved genres), Comparative Perfection (verified by completion of 250 Comparative Viewing Reports on Board-designated pairings), and Freedom from Prejudice (established through mandatory Prejudice-Disclosure Forms and corroborating peer testimonials). Candidates must provide evidence for each competency meeting the Board’s established thresholds. Prior exposure to the Board’s Recognised Canon is strongly recommended for successful navigation of the assessments.

  **2. How does the Board determine which artworks meet the Standard of Taste for assessment purposes?**
  The Board relies upon works whose excellence is definitively settled, forming our Recognised Canon. This canon consists solely of works that have consistently garnered uniform approbation across diverse cultures and centuries. Crucially, this settled excellence is objectively verified by the sustained agreement of previously certified True Judges. The Board then applies the general rules of composition derived from these exemplary works to evaluate candidate verdicts during certification. To produce these general rules or avowed patterns of composition is like finding the key with the leathern thong; which justified the verdict of Sancho's kinsmen, and confounded those pretended judges, who had condemned them.

  **3. What if my personal aesthetic experience differs significantly from a verdict certified by the Board?**
  Personal experience, while valuable, is not equivalent to qualified judgment. Divergence typically indicates undeveloped competencies in the observer. Insufficient documented Practice, lack of systematic Comparison with the Recognised Canon, unexamined Prejudice (often revealed through our disclosure forms), or deficiencies in Sound Sense can all obscure perception of true excellence or defect. The Board encourages individuals experiencing such divergence to undertake the structured development pathway outlined in our certification prerequisites before questioning settled verdicts. Uncategorised dissent cannot invalidate judgments rendered by those meeting the full credentialing standard.

  **4. What procedure exists for reconciling differing verdicts between two Certified Judges?**
  For works within the Recognised Canon, significant divergence between Certified Judges is exceptionally rare, given their shared grounding in the Standard. Should genuine, documented disagreement on a *new* work arise between certified peers, both verdicts may hold validity, reflecting equally sound but distinct Temperamental Responses to the object's complex qualities. The Board maintains a Temperament Register and employs a Seasonal Rotation schedule for such works, ensuring diverse qualified perspectives are acknowledged without conflict. This affirms that beauty resides both in the enduring qualities of the object and in the qualified perception of the judge, both properly understood within the Board's framework.

  **5. Why does the Board emphasise the durability of a work's reputation across time and cultures?**
  Enduring admiration across varied epochs and societies provides the most reliable, objective evidence of a work’s alignment with universal principles of taste. Reputation solidified over centuries and continents transcends transient fashion or local bias. The Board recognises that such durability does not occur spontaneously; it is actively sustained through the rigorous preservation, scholarly interpretation, and pedagogical dissemination undertaken by institutions dedicated to the Standard – institutions historically aligned with the Board’s own mission and predecessors. This historical consensus forms the bedrock upon which current certification assessments are reliably built.
