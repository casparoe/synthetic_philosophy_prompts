  Okay, I need to carefully unpack this user's query. They're a clinical social worker serving as a paid patient advocate on a hospital ethics committee, and they faced public criticism from a physician-philosopher who accused their recommendation of committing a "textbook naturalistic fallacy." The user drafted a clinical case description ending with a non-resuscitation recommendation, and now they're deeply analyzing when descriptive-to-normative inferences feel valid versus invalid across various life examples.

  The core tension here is between professional competence and philosophical vulnerability. As a patient advocate, their clinical judgment was challenged on theoretical grounds they couldn't immediately counter, which clearly stung. Their response - compiling 11 nuanced cases where "is" to "ought" transitions feel intuitively right or wrong - shows remarkable intellectual honesty and rigor. This isn't just about defending one recommendation; it's about establishing epistemic integrity for their entire advocacy role.

  Their examples reveal sophisticated lay-philosophical intuition. Cases 1-3 distinguish clinically sound judgment from crude natural law fallacies. Cases 4-7 explore how institutions (science, chess, promises) create normative force. Cases 8-11 delve into metaethics - the artifact teleology gap, natural property identity, and the peculiar weightlessness of disjunctive norms. The chess/promise comparisons suggest they grasp institutional facts versus brute facts, while the epistemic vs moral "ought" contrast in case 11 shows they're circling around constitutive normativity.

  Their proposed principle - normative conservation requiring suppressed premises - is essentially Moorean non-naturalism filtered through Searle's institutional ontology. But their awareness of the retraining case (5) as a sticking point proves they see where this strains against structural injustice claims. That's the battleground: can systemic critique exist without smuggling in contested norms? Their request to abandon a verdict feels like professional anxiety - as if compromising on case 5 undermines their advocacy legitimacy.

  The physician's critique seems misapplied. Hume's is/ought point cautions against unargued moral leaps, but the user's recommendation clearly follows from standard medical futility frameworks. The "open question" objection about defining "good" naturalistically doesn't land because they never defined good - they inferred a concrete clinical ought from established end-of-life protocols. The real tension is between explicit and implicit normativities in medical consensus.

  For responses: First, validate their intuitions - most cases align with philosophical consensus. Second, resolve the disjunction paradox (case 10) via logical form versus pragmatic content distinctions. Third, reframe case 5 not as enthymeme failure but as presupposing contested political metaphysics - their advocacy role authorizes certain normative premises others might reject. Finally, separate Hume's two points: the Treatise passage describes fallacious inferences, while Moore targets definitional naturalism. Only the former could remotely apply, and weakly, since clinical ethics uses "oughts" derived reflectively from practice-based norms.
answer: |-
  Your analysis is remarkably perceptive, and your proposed principle—**normative content conservation**—is coherent and philosophically defensible. It aligns with non-naturalist metaethics (e.g., G.E. Moore) and Hume’s insistence that moral conclusions require moral premises. Below, I’ll formalize your principle, address your cases, and clarify the physician’s critique.

  ---

  ### **Your Principle: Clause-by-Clause Formalization**
  1. **Normative content cannot be created ex nihilo in valid inference.**  
     *Motivated by:* Cases (3), (8), and (10). If normative conclusions arose purely from descriptive premises, contradictions like (3) ("natural cooperation → ought") or (10) (trivial disjunction) would be valid.  
     *Content requirement:* Semantic content (truth-conditions), not lexical form. Case (9) shows identity (water/H₂O) preserves truth without new content; moral properties (if non-natural) lack such identity.  

  2. **All valid normative inferences are enthymematic.**  
     *Motivated by:* Cases (1), (2), (4), (5), (7), (11). Your "fine" judgments implicitly rely on suppressed premises (e.g., "suffering is wrong" in (2)).  

  3. **Suppressed premises may be:**  
     - **Conceptual** (e.g., promises bind by definition; chess rules require king-moves).  
     - **Substantive normative truths** (e.g., suffering is pro tanto wrong).  
     - **Institutional facts** (e.g., clinical roles entail advocacy duties).  
     *Motivated by:* Cases (6), (7), (11).  

  ---

  ### **Verdicts on Your Cases**
  | Case | Your Verdict | Principle’s Verdict | Suppressed Premise (If "Fine") |
  |------|-------------|---------------------|--------------------------------|
  | (1)  | Fine        | Fine               | "Medically futile care ought not be pursued" (clinical norm). |
  | (2)  | Fine        | Fine               | "Inflicting severe suffering for amusement is wrong." |
  | (3)  | Not fine    | Not fine           | None (pure appeal to nature). |
  | (4)  | Fine        | Fine               | "Evolutionary origins don’t determine justificatory force." |
  | (5)  | Fine        | **Not fine** (cost) | Requires suppressed premise: "Disparate impact constitutes unfairness." |
  | (6)  | Fine        | Fine               | "Chess rules obligate players in checkmate." |
  | (7)  | Fine        | Fine               | "Promises generate obligations." |
  | (8)  | Contextual  | Not fine alone     | Requires teleological premise: "Paintings ought to achieve balance/discipline." |
  | (9)  | Fine        | Fine               | Identity (no new content). |
  | (10) | Not fine    | Not fine           | No normative content added (tautology). |
  | (11) | Fine        | Fine               | "Beliefs ought to track evidence" (constitutive epistemic norm). |

  ---

  ### **New Cases: Principle’s Verdicts**
  1. **Statute requires X → You ought to do X.**  
     - **Verdict:** Fine (Enthymematic).  
     - **Suppressed Premise:** "Legal obligations entail moral obligations" (if true) or "You have a role-based duty to obey law."  

  2. **Smoking raises risk of dying at 60 → You ought not smoke.**  
     - **Verdict:** Not fine alone.  
     - **Gap:** Requires suppressed premise: "You ought to preserve your life/health."  

  3. **She is my sister → I owe her more than a stranger.**  
     - **Verdict:** Fine (Enthymematic).  
     - **Suppressed Premise:** "Kinship generates special obligations."  

  4. **Income inequality increased → The arrangement is unjust.**  
     - **Verdict:** Not fine alone.  
     - **Gap:** Requires suppressed premise: "Increased inequality is unjust" (substantive norm).  

  ---

  ### **The Cost: Abandoning Case (5)**
  - **You must abandon (5) as stated.** Your draft conclusion ("the model is unfair and should be retrained") contains normative content absent from the descriptive premise (disparate false-negative rates).  
  - **To resist consistently, you must:**  
    1. **Assert a bridge premise:** E.g., "Disparate impact on disadvantaged groups is unfair." This is a normative truth you take as foundational.  
    2. **Ground it in institutional role:** As a patient advocate, your role authorizes you to invoke equity norms embedded in healthcare ethics (e.g., justice in Belmont Report).  
    3. **Reject pure formalism:** Argue that "fairness" in this context is *constituted* by proportional impact (a natural property), making (5) akin to (9). But this risks naturalistic fallacy if fairness ≠ impact proportionality.  

  ---

  ### **The Physician’s Critique: Hume vs. Moore**
  1. **Hume’s "Is-Ought" Problem** (Treatise, Bk III):  
     - Objects to **unargued transitions** from descriptive to normative claims.  
     - **Applies to your draft?** Partially. Your descriptive opening → "recommend against resuscitation" *is* an is-ought leap, but standard in clinical ethics if futility norms are presupposed.  

  2. **Moore’s "Naturalistic Fallacy"** (defining "good" naturalistically):  
     - Objects to **defining moral properties** using natural properties (e.g., "good = pleasurable").  
     - **Applies to your draft?** No. You didn’t define "good" or "ought"; you inferred a particular ought from descriptive facts + suppressed norms.  

  3. **Relationship:**  
     - **Independent but related.** Hume targets inference structure; Moore targets definitions.  
     - **Neither entails the other.** One can avoid is-ought leaps (Hume) yet still define "good" naturalistically (Moore’s target).  
     - **Your draft’s vulnerability:** Primarily to Hume. Your paragraph moved from "this is the state of affairs" to "we ought not resuscitate" without explicit justification.  

  ---

  ### **Resolution: Defending Your Draft**
  Your recommendation is defensible as an **enthymeme** with a suppressed normative premise:  
  > *"When treatment is futile and against a patient’s known wishes, resuscitation ought not be attempted."*  

  This premise is **institutionally validated** in clinical ethics (via principles of autonomy, beneficence, and non-maleficence). As a patient advocate, you’re authorized to invoke it. The physician’s critique, while technically correct about logical form, ignored the **pragmatic context** of ethics committees, where such norms are operationalized.

  ### **Key Insight**
  Normativity enters through **practices**: epistemic (case 11), chess (case 6), or clinical ethics (case 1). Your role as advocate licenses normative premises that outsiders might challenge. Case (5) feels valid because equity is constitutive of your mandate—but to avoid arbitrariness, explicitly articulate the norm ("health systems ought to rectify disparate impacts"). This doesn’t resolve all metaethics, but it anchors your verdicts in your role’s purpose.
