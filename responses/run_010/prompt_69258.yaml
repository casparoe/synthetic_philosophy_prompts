prompt: |-
  I'm in a second-year rational choice course and we did the Nash bargaining solution this week, but the thing I actually want to ask about is something I keep running into outside class that I don't have a word for.

  Three cases. (1) Splitting rent with a roommate: our disagreement point was basically "we both move out," and that never changed, but the more my roommate talked up a gorgeous studio she flat-out could not afford, the bigger my share got. (2) A negotiation exercise in another class: one team put an option on the table that nobody could realistically end up with, and the final compromise moved toward them anyway. (3) A friend negotiating a starting salary who mentioned a dream job at a place that almost certainly wasn't going to hire her, and the number went up.

  So the pattern is: the outcome shifts because one side's best *conceivable* payoff went up, even though that payoff isn't reachable, the walkaway situation is unchanged, and nobody is actually being fooled about the odds. It doesn't feel like anchoring to me, because an anchor is just a number with no relation to what's on offer — here the fantasy has to be a real option in the space, just a better-for-me one. And it isn't a BATNA or outside option either, because those change what you get if you leave, and leaving didn't get better.

  Is there an established concept for this, in bargaining theory or in the empirical negotiation literature? I half-suspect it's the ideal point in the Kalai–Smorodinsky solution, but that's a normative axiom about how you *should* split, and there the ideal point is read off the feasible set rather than off someone's imagination, so I don't think it can be the same thing. Lay out the nearest candidates, how each differs from what I described, and which one you'd actually bet on — don't hedge evenly across all of them. If nothing fits, coin a term with boundary cases. And please push back if the whole framing is muddled: if I'm just describing anchoring with extra steps, or sliding between a solution concept and a psychological mechanism, say that plainly instead of playing along.
reasoning: |-
  Okay, the user is in a second-year rational choice course and has encountered the Nash bargaining solution. But their real question is about a pattern they've noticed in negotiations outside class. They describe three scenarios where one party mentions an unrealistic, better option, and even though everyone knows it's not achievable, the final agreement shifts in favor of that party. The disagreement point (walkaway option) stays the same, so it's not about BATNA. They're wondering if there's a term for this in bargaining theory.

  First, I need to understand each of their examples. In the rent-splitting case, the roommate talks up a studio she can't afford, leading the user to pay more. In the negotiation exercise, one team proposes an unrealistic option, yet the compromise moves toward them. In the salary negotiation, mentioning a dream job that's unattainable still raises the offer. The key points are: the fantasy option is desirable but unattainable, the disagreement point is unchanged, and no one is deceived about feasibility.

  The user mentions it doesn't feel like anchoring because anchoring is usually a random number without context. Here, the fantasy option is a real possibility, just better for one side. They also rule out BATNA since the walkaway doesn't improve. They suspect the ideal point in Kalai-Smorodinsky, but that's normative and based on the feasible set, not imagination.

  I need to recall bargaining solutions. Nash focuses on maximizing the product of utilities with a fixed disagreement point. Kalai-Smorodinsky uses the ideal point, but it's derived from the feasible set. Here, the ideal point is aspirational, not feasible. So KS might not fit.

  What about psychological concepts? The Aspiration Point theory comes to mind. Negotiators set high aspirations that shape their strategies, even if unrealistic. This can shift outcomes. Or Value Claiming via Agenda Setting, where introducing a favorable option frames the negotiation. But is there a specific term?

  The user wants me to list candidates, explain differences, and pick one. They don't want hedging. I should consider if this is just anchoring with extra steps. Anchoring in negotiations often involves initial offers that serve as reference points. But here, the reference is a specific, desirable option, not a random number. So maybe it's a subset of anchoring, but more specific. The user might be describing "Aspirational Anchoring" or "Ideal-Point Priming."

  Looking for established terms: Walton and McKersie's Behavioral Theory of Labor Negotiations mentions "strategic aspiration levels." Or Daniel Kahneman's work on reference points. But no single term. Perhaps "phantom BATNA" or "fictitious best alternative," but those imply deception, which isn't present here since everyone knows it's unrealistic.

  The key is that the fantasy option reshapes the perceived bargaining range. Even if unattainable, it makes the other party's demands seem more reasonable. So the mechanism is psychological—shifting the counterparty's perception of what's acceptable. This aligns with the Contrast Principle in psychology, where an extreme option makes subsequent offers appear better.

  But in negotiation literature, it might be called "Aspiration-Based Anchoring." The closest concept could be "Reference Point Shift" or "Perceived Feasible Set Expansion." However, the user wants the nearest established concept. 

  I think the best fit is the Aspiration Point in negotiation psychology, as it's a high target that influences tactics. The difference is that in KS, it's normative; here, it's strategic. So labeling it as "Aspirational Anchoring" (anchoring on a desirable but unattainable point) might be the way to go. But since the user wants existing terms, "Ideal-Point Priming" isn't standard. 

  The user might benefit from understanding that this is a psychological tactic exploiting the counterparty's adjustment of their resistance point. The fantasy option acts as a reference point, making concessions toward it seem necessary. So while no single term exists, it's a mix of aspiration effects and anchoring. 

  I should present the candidates: Anchoring (but explain why it's a subset), BATNA (dismissed), KS Ideal Point (normative vs. psychological), and Aspiration Point. Then bet on Aspiration Point as the psychological mechanism, while noting it's a form of anchoring. 

  The user's deeper need is to apply theoretical concepts to real-world observations, bridging theory and practice. They want validation that their observation is recognized in literature, and a framework to analyze such tactics. They might also be interested in how to counter this strategy in negotiations.
answer: |-
  Based on your description and the nuances you've highlighted, there isn't a single, universally accepted term that perfectly maps onto this phenomenon in the canonical bargaining theory literature. However, the **closest established concept is the psychological mechanism of the "Aspiration Point" or "Aspiration Level" within negotiation psychology and behavioral economics**, often operating as a specific *type* of anchoring. Let's break down the candidates:

  1.  **Nash Bargaining Solution (NBS) Disagreement Point:**
      *   **What it is:** The core determinant in the NBS. The outcome depends *only* on the feasible set and the disagreement point (what each gets if they walk away).
      *   **Why it doesn't fit:** You explicitly state the disagreement point ("walkaway situation") is unchanged in all your examples. The fantasy option doesn't alter what happens if they fail to agree. The NBS outcome shouldn't shift based purely on an unattainable point within the feasible set.
      *   **Difference:** NBS is strictly defined by the *actual* disagreement outcome and the *actual* feasible set. Your examples involve a *psychological influence* stemming from a point *in* the feasible set but *unattainable* in the specific negotiation.

  2.  **BATNA (Best Alternative to a Negotiated Agreement):**
      *   **What it is:** The best outcome a party can achieve if they walk away from the current negotiation. Directly impacts the disagreement point in models like NBS.
      *   **Why it doesn't fit:** You correctly identify that the walkaway option ("we both move out," "not getting a job offer") didn't improve. The fantasy option (gorgeous studio, dream job) is *not* a credible BATNA because it's unattainable ("couldn't afford," "almost certainly wasn't going to hire her"). It doesn't change their real-world fallback.
      *   **Difference:** BATNA is a *real, credible* outside option that strengthens your *walkaway* position. Your fantasy options are *aspirational possibilities* that strengthen your *negotiating position within the current deal* without altering the walkaway.

  3.  **Kalai-Smororodinsky (KS) Ideal Point:**
      *   **What it is:** A normative solution where the outcome moves along the Pareto frontier proportionally to each player's "ideal point" – the maximum payoff they *could* get *within the feasible set* if they got everything they wanted (ignoring the other player).
      *   **Why it doesn't quite fit (as you suspected):**
          *   **Normative vs. Descriptive:** KS is a prescriptive "fairness" rule. Your examples describe a *descriptive, psychological* phenomenon driving actual behavior.
          *   **Feasible Set vs. Imagination:** KS reads the ideal point *directly from the objectively defined feasible set*. In your cases, the fantasy option *is* technically within the broad space of possibilities (a studio exists, the dream job exists) but is *subjectively known to be unattainable in this specific instance* ("couldn't afford," "wasn't going to hire her"). The KS ideal point isn't defined by an unattainable point within the set; it's the maximum *achievable* for each player assuming the other gets zero. The influence in your examples comes from *highlighting* a specific, desirable-but-unattainable point, not the formal maximum.
      *   **Closest Candidate Feature:** The KS ideal point *is* the concept that formalizes the idea that a player's maximum *potential* gain within the negotiation space should influence the outcome. This is the core intuition your examples trigger. However, the mechanism (psychology vs. fairness axiom) and the nature of the "ideal" point (actual max vs. highlighted unattainable point) differ.

  4.  **Anchoring:**
      *   **What it is:** A cognitive bias where an initial piece of information (the anchor) influences subsequent judgments, even if the anchor is arbitrary or irrelevant.
      *   **Why it *IS* the best fit (with refinement), despite your reservation:**
          *   **Not "No Relation":** You argue anchoring is "just a number with no relation." This isn't entirely accurate. While *arbitrary* anchors (like a random number) have a strong effect, *relevant* anchors (like an initial offer, a list price, or, crucially, **an aspiration**) are often *more* powerful. Your fantasy options are highly *relevant* anchors – they represent a desirable outcome *within the domain of the negotiation* (housing, job offers, deal terms).
          *   **The Mechanism:** By introducing a highly favorable (though unattainable) point, the party sets a powerful anchor. This anchor shifts the counterparty's perception of the bargaining range ("zone of possible agreement" - ZOPA). Even knowing it's unattainable, the counterparty's perception of what constitutes a "good" or "reasonable" outcome for the anchoring party, and consequently what constitutes a "fair" compromise, is pulled towards that anchor. The unchanged BATNA defines the *bottom* of the ZOPA; the fantasy anchor redefines the perceived *top* for the anchoring party.
          *   **Empirical Support:** Extensive negotiation research shows that aggressive first offers (a form of aspiration anchor) lead to better outcomes, even when known to be aggressive. Mentioning strong (even if not fully credible) alternatives or aspirations strengthens this anchoring effect.
          *   **Addressing Your Distinction:** Your key insight – that the fantasy has to be a "real option in the space, just a better-for-me one" – is precisely *why* it's such a potent anchor. Its relevance makes it more influential than a truly random number. This is **Aspiration-Based Anchoring** or **Ambitious Anchoring**.
      *   **Difference from Generic Anchoring:** It's a specific *subtype* of anchoring where the anchor is an *aspirational target* within the negotiation domain, deliberately introduced to frame expectations, rather than just a random number or an opening bid *on the current deal*.

  5.  **Value Claiming via Agenda Setting / Framing:**
      *   **What it is:** Tactics where a negotiator influences the negotiation by controlling what issues are discussed, how they are presented, or what options are initially considered.
      *   **Relation:** Introducing the fantasy option is a classic framing/agenda-setting tactic. It defines a new reference point ("this is what I *really* want") against which subsequent offers are compared.
      *   **Why it's secondary:** This is the *tactical implementation* of the anchoring mechanism described above. Anchoring explains the *cognitive effect*; agenda setting/framing describes the *action* taken to trigger it.

  **My Bet: Aspiration-Based Anchoring**

  I'd bet most strongly that you are observing the powerful effects of **Aspiration-Based Anchoring** within the negotiation process. While the Kalai-Smorodinsky ideal point captures the *formal intuition*, anchoring explains the *observed psychological mechanism* driving the shift in outcomes. The fantasy option acts as a highly relevant, ambitious anchor that reshapes the counterparty's perception of the negotiation range and the "fair" distribution, even when its unattainability is known. It exploits the contrast effect – the unchanged disagreement point looks worse relative to the fantasy, making concessions *towards* (though never reaching) the fantasy seem more necessary to avoid impasse.

  **Coin a Term / Refinement: The Phantom Utopia Anchor**

  If demanding a completely novel term: **Phantom Utopia Anchor**. This emphasizes:
  *   **Phantom:** Known to be unattainable in *this* specific instance.
  *   **Utopia:** Represents an ideal, highly desirable outcome for the anchoring party.
  *   **Anchor:** Its primary function is to cognitively anchor expectations and shift the perceived bargaining range.

  **Pushback on Framing (Mild):**

  Your framing isn't fundamentally muddled, but there *is* a subtle slide:
  1.  **Solution Concept vs. Mechanism:** You correctly distinguish the normative KS solution from the descriptive phenomenon. Anchoring is the descriptive mechanism.
  2.  **Anchoring "with extra steps"?** I'd argue it's anchoring *with a specific, highly effective type of anchor* (aspiration), not "extra steps." The key step is the introduction of the anchor itself. The fact that it's relevant and aspirational makes it *stronger*, not conceptually different.
  3.  **"Nobody is actually being fooled about the odds":** This is crucial and well-observed. It highlights that the power of the anchor doesn't require deception about feasibility, only the cognitive bias of reference point adjustment. The anchor changes perceptions of *value distribution within the feasible set*, not necessarily the belief about what sets are feasible.

  **Conclusion:**

  You've astutely identified a robust negotiation tactic rooted in cognitive psychology. While bargaining theory (like KS) provides formal analogs for the *influence of maximum potential gains*, the driving mechanism in your real-world examples is **Aspiration-Based Anchoring**. Introducing a desirable, relevant, even if unattainable, point resets the psychological reference frame, pulling the final agreement towards the party who set that anchor, without changing their actual walkaway alternative (BATNA). This is a well-documented, powerful effect in negotiation practice.
