prompt: |-
  I'm the one stuck drafting a checklist for a small reading group on cosmology and time's arrow, and the task has turned out to be way harder than it sounded. The idea was a one-pager a referee could use to decide whether a proposed cosmological model "has a Boltzmann brain problem," but I've realized I can't even say what that means without begging the question against somebody in the group. One of us thinks any model whose late time is an eternal de Sitter phase at nonzero temperature is dead on arrival; another thinks the whole worry is an artifact of applying equilibrium statistical mechanics to the universe as a whole, where there's nothing outside to be in equilibrium with; a third says the physics is beside the point and the real problem is that a model which implies most observers are freak fluctuations undercuts the very reasoning that got you to the model in the first place. So: play the role of a philosopher of cosmology who has sat through a lot of measure-and-typicality proposals and is allergic to hand-waving, think carefully about which of the demands people make in this debate are genuine requirements and which are just one camp's priors wearing a lab coat, and do your pruning privately — I don't want to see the brainstorming, only the finished spec.

  Give me exactly five numbered requirements that a cosmological model, together with whatever it says about observers and about how to weight them, has to meet to count as Boltzmann-brain-free. Format each item as a one-line statement of the requirement, then about two sentences: first the case or consideration that motivates it, then your verdict on whether it's non-negotiable or a camp preference, plus which of the other four items it collides with if you think no model can meet them all. Phrase every requirement so a referee could actually demand it on the basis of a model's own write-up, rather than something that needs new calculations to check. No intro, no wrap-up paragraph — just the five numbered items, and if one of them does most of the work in ruling models out, say so inside that item.

  To keep the list honest, here's what it should be able to sort, and you can mention these in passing where they fit. (a) A model whose entire future is empty de Sitter space with a fixed tiny temperature, with ordinary observers confined to a short early window — does it get a pass because the recurrence timescale dwarfs that window, or fail because "dwarfs" is still finite against an infinite future? (b) A model where the late fluctuation-observers are momentary and never accumulate memories or records — is "what counts as an observer making an observation" a legitimate place to block the problem, or a semantic dodge? (c) A model thats simply finite in lifetime, so no fluctuation observers ever arise — at what point does buying the fix with fine-tuning cost more than the problem did? And if you think some subset of your five can't be jointly satisfied given how the physics actually goes, that's the part I most want to see, so don't smooth it over.
reasoning: |-
  Hmm, the user wants me to create a five-item checklist for determining whether a cosmological model has a Boltzmann brain problem. They're stuck because their reading group has different perspectives on what constitutes this problem. One member believes any eternal de Sitter phase is problematic, another thinks the worry stems from misapplying equilibrium stats, and a third sees it as undermining scientific reasoning itself.

  I need to develop five requirements that address these tensions while being practical for referees to apply based solely on a model's description. The requirements must be phrased to avoid needing new calculations, and I should mention how they handle specific cases: (a) eternal de Sitter with a short observer window, (b) momentary fluctuation-observers, and (c) finite lifetime models.

  I'll focus on core principles that capture genuine issues rather than camp preferences. Requirement 1 should tackle the observer problem head-on to avoid semantic dodges. Requirement 2 will address equilibrium assumptions to satisfy the skeptic about misapplied stats. Requirement 3 must handle infinity versus finitude without arbitrary cutoffs. Requirement 4 will focus on the scientific reasoning paradox. And Requirement 5 should ensure the model doesn't shift the problem elsewhere.

  There will be inherent tensions. For example, finite models (Requirement 3) avoid Boltzmann brains but might violate falsifiability (Requirement 4). Eternal models satisfy falsifiability but struggle with dominance (Requirement 1). I won't hide these conflicts - I'll note them in the relevant items.

  For the specific cases: (a) fails Requirement 1 because even with recurrence timescales, infinite time guarantees fluctuation dominance. (b) fails unless the model explicitly defines observers in a way that excludes momentary fluctuations - which Requirement 1 tests. (c) satisfies all except possibly Requirement 4 if the finiteness is unexplained fine-tuning.

  I'll make Requirement 4 do the heavy lifting since it challenges the foundation of cosmological inference itself. The checklist should be crisp: five numbered items, each with a one-line statement, motivation, and verdict on negotiability plus conflicts where applicable. No intros or conclusions - just the requirements.
answer: |-
  **1. Fluctuation observers must not dominate the model's total observer-weighted measure.**  
  Motivation: The core problem arises if a model predicts that most observations occur in random fluctuations (Boltzmann brains) rather than ordinary structures.  
  Verdict: Non-negotiable. Collides with Requirement 3 if the model is eternal. *(Case (a) fails here: infinite time guarantees fluctuation dominance despite recurrence timescales.)*

  **2. The model must not assume equilibrium statistical mechanics applies globally to the entire cosmological history.**  
  Motivation: Equilibrium treatments presuppose an unchanging background and ergodicity, which may not hold in cosmology due to boundary conditions or ongoing evolution.  
  Verdict: Non-negotiable (prevents misapplication of statistics). Collides with Requirement 1 if used to dismiss fluctuations arbitrarily. *(Addresses the "artifact" concern directly.)*

  **3. The future history must be finite in duration or possess a well-defined, finite observer-accessible epoch.**  
  Motivation: Infinite time inevitably produces all possible fluctuations, forcing dominance of Boltzmann brains unless suppressed by model dynamics.  
  Verdict: Non-negotiable for avoiding the problem. Collides with Requirement 4 if finiteness is an unexplained postulate. *(Case (c) satisfies this; Case (a) fails as de Sitter is eternal.)*

  **4. The model must not render cosmological inferences (e.g., about initial conditions or fundamental laws) self-undermining.**  
  Motivation: If the model implies most reasoning observers are fluctuations, the evidence supporting the model itself becomes unreliable.  
  Verdict: Non-negotiable (preserves scientific rationality). **Does the most work** – it rules out models satisfying Requirements 1-3 if finiteness/dominance avoidance is *ad hoc*. *(Case (c) fails here if finiteness is fine-tuned solely to avoid Boltzmann brains.)*

  **5. Observer definitions must be fixed by the model's intrinsic physics, not adjusted to avoid the problem.**  
  Motivation: Redefining "observer" (e.g., requiring sustained cognition) to exclude fluctuations is circular unless grounded in fundamental theory.  
  Verdict: Non-negotiable (avoids semantic dodges). Collides with Requirement 1 if the physics allows fleeting but numerous fluctuation observers. *(Case (b) fails unless the model's fundamental laws explicitly preclude momentary observers.)*
