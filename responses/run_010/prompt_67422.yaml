  *   *Reiterates the core problem neutrally ("...consequences for people working here now who can't vote on it").*
  *   *Explains the *purpose* of the review proposal ("...giving all of us... a proper say later...") without prescribing the initial vote.*
  *   *Remains factual and avoids endorsing any specific option.*
