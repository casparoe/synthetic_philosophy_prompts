answer: |-
  Here is a speech meeting your requirements. Words: Approximately 710.

  **(Start reading)**

  Good evening, everyone. Nineteen years I’ve been here, rolling dough, serving coffee, watching this place become part of the high street’s bones. Now, Mr. Henderson, thank you. Thank you for this chance. For trusting us to take it on. This supper marks the start of something new: our bakery as a worker co-operative.

  We’ve all seen the draft rules. We’ve read them at kitchen tables. They’re sensible. Necessary. But starting anything means drawing a line. Deciding who’s in, and who isn’t, when you begin. That’s the bit I keep thinking about. *(Pause)*

  Here’s the puzzle. The rules say the co-operative itself will decide its membership. But tonight, *before* those rules exist, we have to decide who gets to make that first decision. It’s like needing permission to write the first rule about who gives permission. We’re standing just outside the circle we’re trying to draw, holding the chalk. *(Pause)*

  However we vote tonight, that first circle gets drawn. And whoever is outside that circle when it’s drawn… they’ll be bound by rules they didn’t help make. That’s true for two of the choices on our ballot. It’s just how beginnings work, but it matters. Good intentions don’t erase that fact. People working alongside us right now, driving our vans, working our counters, might find themselves governed by tonight’s vote without having a vote themselves. That’s a heavy thing. *(Pause)*

  So, what can we do? We can’t avoid drawing that first line tonight. But we *can* build in a way to check if we drew it right. I propose we commit, right now, to a proper review. Not a quick chat, but a real review, two years from tonight. And crucially, that review *must* include seats and votes for people working here then who would have been excluded by our first rule. People who are outside tonight’s circle but inside our daily work later.

  Why two years? To see how we’re running. To see who’s truly part of the work. Why include those excluded tonight? Because only then can we fairly judge if the line we drew was right. This review isn’t something those excluded can demand later. It only happens if we decide it tonight. It’s our promise to ourselves, and to them, to look again. To make it fairer later, if it needs to be.

  *(Pause)*

  Now, we vote. We have three options for that starting membership:

  1.  **Option One:** One vote each for everyone over eighteen directly on our payroll with twelve months' service.
  2.  **Option Two:** One vote each for anyone working eight hours a week for the business – agency or not – after three months, admitting the Saturday girl when she turns eighteen.
  3.  **Option Three:** Membership only for those signing the bank guarantee, with votes weighted by hours worked.

  After the vote, the solicitor will explain the next steps for signing the formal rules based on the outcome. That’s how we make it official. This is the beginning. Let’s make it a thoughtful one. Thank you.

  **(End reading)**

  ---

  **Places to Pause:**

  1.  **After: **"That’s the bit I keep thinking about."** (Lets the initial problem sink in)**
  2.  **After: **"We’re standing just outside the circle we’re trying to draw, holding the chalk."** (Allows the metaphor to land)**
  3.  **After: **"That’s a heavy thing."** (Gives weight to the exclusion concern)**
  4.  **After: **"It’s our promise to ourselves, and to them, to look again."** (Emphasizes the core of the review proposal before moving to the vote)**

  ---

  **Answer for if asked "Are you telling us to vote for inclusion?" (e.g., by a driver or customer):**

  "**No, I'm not telling anyone how to vote.** My point is that whichever line we draw tonight has real consequences for people working here now who can't vote on it. The review is about giving *all* of us, including those affected tonight, a proper say later on whether that line still makes sense."

  *(This answer:*
