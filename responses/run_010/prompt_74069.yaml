prompt: |-
  You are a philosopher of statistics and formal epistemology with a working knowledge of institutional forecasting practice. Before you draft anything, think carefully about what is actually being asked: the deliverable is not an answer to the reference class problem but a specification of what would count as answering it. Sketch, for yourself only, the inventory of cases and disputes that such a theory would have to resolve, and let the requirements fall out of that inventory.

  I work in the evaluation office of a national audit institution. For large capital projects we require what is usually called reference class forecasting: the project team must locate a class of comparable past undertakings and derive its cost and schedule estimates from the observed distribution of outturns in that class, rather than from its own bottom-up scenario. The mandate is statutory. The difficulty is that the mandate tells us to use a reference class without telling us what makes one the right one. Teams can make almost any comparison set look defensible, and objectors can always nominate a different set with a worse outturn: the broader classes are more objective-seeming and less relevant, the narrower ones are more relevant and transparently gameable. I must be able to rule on these disputes in a hearing room, and I have no standard to rule by.

  What I need from you is the specification I am missing: a set of desiderata that any adequate account of the choice of reference class must satisfy, such that I could hand the list to both parties in a dispute and ask them where their proposed class meets or fails it. Please write it to the following shape.

  First, and briefly, list the raw material from which the requirements will be derived: the kinds of case a theory in this area has to handle. I have in mind at least the forecasting disputes of the sort described above, the statistical and probabilistic puzzles in which the choice of class appears to change the answer (the Monty Hall problem and the Doomsday argument are the standard exhibits), and the phenomenon in which a trend visible within every subclass reverses across the pooled classes. Explain in one or two sentences each what a theory must do about them, so that the reader can see which requirement is responding to which pressure. Do not assume I have these cases at my fingertips.

  Second, write the desiderata themselves, in three families. (a) The problems the theory must resolve or explain away, and what counts as resolving them. (b) The distinctions it may not collapse — among them, the distinction between a class being legitimate to use and a proposition's simply being true, the distinction between the class and the body of information that picks it out, the distinction between how wide a class is and how homogeneous it is, and any others you think the literature routinely runs together. (c) The constraints it must respect if it is to be usable by an institution: it must be applicable by non-specialists under time pressure, it must operate where the historical record holds only a handful of comparables, and it must yield a verdict that a reviewer can interrogate rather than shrug at.

  Third, for each requirement, state the consideration that motivates it, say who in the debate tends to insist on it and who tends to resist it, and mark it as non-negotiable for my purposes, negotiable, or a prejudice of one camp dressed up as a criterion. Be especially alert to the demand that a class be as narrow as the available evidence allows and the demand that it contain enough members to support a distribution: these look like rivals, and I want to know whether they are.

  Fourth, and this is the part I most want to see, identify any pairs or subsets of the requirements that cannot be jointly satisfied. If a class cannot at once maximise relevance, contain enough members to support statistics, and remain uniquely determined by the evidence, say so, and show the incompatibility from the requirements themselves rather than by appeal to authority. Where a subset is jointly unsatisfiable, argue which member should be weakened or dropped, and what is lost by weakening it. If your conclusion is that the full list is unsatisfiable and that no account will ever make reference class choice a matter of routine, that is a substantive result, not a failure to deliver, and I would rather hear it plainly than receive a list quietly trimmed to make the candidates pass.

  Fifth, tell me which single requirement does the most to exclude otherwise plausible accounts, and why that one carries the weight.

  Sixth, score the main contenders against the surviving list, but keep the scorecard to a short paragraph each: the straightforward frequentist view on which the correct class is simply the widest one with enough members; the view on which one must condition on all the relevant information one actually possesses; the pragmatic or interest-relative view on which which class is correct depends on the question being asked; and the view that the whole problem dissolves once the conditioning is done properly within a single Bayesian framework. Name no authors, no papers, and no publication dates, and do not invent a supporting quotation or a case study — I cannot check them and neither can you.

  Close with two worked applications of your specification, to be run in front of the parties. In the first, the project team proposes as its reference class all tunnel-boring rail projects completed since 1990, while the objecting ministry proposes only those built through water-bearing chalk at comparable depth. In the second, the roles are reversed: the team proposes the narrow class and the objectors want the wide one. Walk the list through both, requirement by requirement, and state where your specification reaches a verdict, where it leaves the matter to the hearing, and — if it happens — where it delivers an answer that the party I would expect to win does not like. I would rather see the procedure fail visibly on one of these than see it flatter both sides.
reasoning: |-
  Okay, let me work through this complex reference class specification request systematically. The user is an evaluator at a national audit institution facing concrete disputes about capital project forecasting. They need not a solution but clear criteria to judge reference class choices in hearings.

  First, I need to identify the core problem types that any theory must handle:
  - **Forecasting disputes**: Where competing classes yield different cost estimates. The theory must provide objective criteria to resolve these.
  - **Statistical paradoxes**: Like Simpson's paradox where trends reverse upon pooling. The theory must explain when class splitting/merging is legitimate.
  - **Epistemic puzzles**: Such as Doomsday argument where class definition alters probabilities. The theory must prevent self-serving class selections.

  For desiderata, I'll structure them in three families as requested:
  Family (a) must resolve the above cases while distinguishing between legitimate class use vs arbitrary selection. Family (b) must maintain key distinctions like class width vs homogeneity, and class identity vs selection criteria. Family (c) must work institutionally - applicable by non-experts with sparse data, producing auditable verdicts.

  The tension between narrow classes (maximizing relevance) and wide classes (ensuring statistical power) appears fundamental. I suspect these may be incompatible when evidence is limited, forcing trade-offs. The strongest constraint is likely the "no free parameters" requirement - forbidding classes adjustable to fit desired outcomes.

  When scoring standard approaches:
  - **Frequentist (widest class)**: Fails relevance and gaming concerns
  - **Conditional on all knowledge**: Impractical with sparse data
  - **Interest-relative**: Violates objectivity needs
  - **Bayesian**: May resolve theoretically but lacks operational guidance

  For the tunnel-boring examples, I'll show how the requirements force different trade-offs in each scenario. In the water-bearing chalk case, narrowness may be justified despite small N if geology dominates other factors. But in the reversed scenario, width may be mandated if homogeneity isn't demonstrably compromised. Crucially, the verdict won't always favor the "expected" party, demonstrating the framework's neutrality.

  The institutional constraints prove most decisive - particularly the requirement for auditable reasoning with sparse data. This exposes the core dilemma: the ideal reference class often doesn't exist, forcing structured compromises rather than perfect solutions.
answer: |-
  ### Specification for Adequate Reference Class Selection  

  #### **I. Foundational Cases Requiring Resolution**  
  1. **Forecasting Disputes** (e.g., capital project cost estimates):  
     - *Requirement*: The theory must resolve competing class proposals (broad vs. narrow) by providing objective criteria to determine relevance and legitimacy, excluding arbitrary or self-serving choices.  

  2. **Statistical Paradoxes** (e.g., Simpson’s Reversal):  
     - *Requirement*: The theory must explain when subclasses should be aggregated or partitioned, ensuring pooled data does not distort inferences (e.g., reversing trends).  

  3. **Epistemic Puzzles** (e.g., Doomsday Argument):  
     - *Requirement*: The theory must prevent class selection from being tautological or question-begging (e.g., defining classes that presuppose the outcome).  

  ---  

  #### **II. Desiderata for an Adequate Account**  
  **(a) Problems to Resolve**  
  1. **The Legitimacy Problem**: Must distinguish *legitimate* classes (based on project-relevant factors) from *arbitrary* ones.  
     - *Resolution*: Classes must be justified by causal or project-specific relevance, not just statistical convenience.  
  2. **The Small-N Problem**: Must handle cases with sparse historical data (e.g., <20 comparables).  
     - *Resolution*: Permit narrower classes only if heterogeneity would distort estimates, with safeguards against gaming.  

  **(b) Distinctions to Preserve**  
  3. **Class vs. Truth**: A class’s *legitimacy* (for forecasting) ≠ a proposition’s *truth* (e.g., "chalk tunnels cost more" may be true but irrelevant if geology isn’t causal).  
  4. **Class vs. Selection Information**: The body of information *picking* the class (e.g., "built after 1990") ≠ the class *itself* (e.g., post-1990 rail tunnels).  
  5. **Width vs. Homogeneity**: Wider classes are not inherently "more objective"; homogeneity (e.g., similar risk factors) trumps width when supported by evidence.  

  **(c) Institutional Constraints**  
  6. **Operational Feasibility**: Rules must be applicable by non-specialists in <2 hours using project documents.  
  7. **Auditability**: Verdicts must include a public scorecard showing where a class passes/fails each requirement.  
  8. **Non-Optionality**: Must yield a definite ruling (even if imperfect); "no valid class" is a permitted outcome.  

  ---  

  #### **III. Per-Requirement Analysis**  
  | **Desideratum** | **Motivation** | **Proponents** | **Opponents** | **Negotiability** |  
  |----------------|---------------|----------------|---------------|------------------|  
  | Legitimacy (1) | Prevents self-serving classes | Auditors, objectors | Project teams | Non-negotiable |  
  | Small-N (2) | Real-world data scarcity | Teams (for narrow classes) | Objectors (demanding large N) | Negotiable (via safeguards) |  
  | Class vs. Truth (3) | Avoids conflating evidence with causal relevance | Philosophers | Pragmatists | Non-negotiable |  
  | Width vs. Homogeneity (5) | Width ≠ robustness | Statisticians | Teams (defending broad classes) | Non-negotiable |  
  | Feasibility (6) | Institutional reality | Practitioners | Theorists | Non-negotiable |  
  | **Tension**: (1) Relevance demands narrowness; (2) Statistical power demands width. *Incompatible when data is sparse*: Homogeneity (1) may force small-N classes, violating (2). |  

  ---  

  #### **IV. Incompatible Requirements**  
  - **Irreconcilable Triad**:  
    1. **Maximize relevance** (narrow classes).  
    2. **Ensure statistical reliability** (large N).  
    3. **Uniquely determined by evidence** (no discretion).  
  - **Incompatibility**: With sparse data, (1) and (2) conflict: narrow classes lack N, broad classes sacrifice relevance. (3) is impossible if multiple classes satisfy (1)/(2) partially.  
  - **Resolution**: Drop strict adherence to (2). In small-N cases, accept narrower classes *if* homogeneity is causally justified, and require error margins reflecting uncertainty. *Loss*: Increased estimation variance.  

  **Key Exclusionary Requirement**: **"No free parameters"** (Desideratum 1). It excludes:  
  - Pragmatic views (classes tailored to "the question").  
  - Overly broad frequentist classes (ignore causal relevance).  
  - *Why?* Allows infinite tailoring; undermines objectivity in hearings.  

  ---  

  #### **V. Contender Scorecard**  
  - **Frequentist (widest class)**: Fails (1), (3), (5). Prioritizes width over relevance.  
  - **Condition on all knowledge**: Fails (6), (8). Impractical with sparse data; no unique class.  
  - **Interest-relative**: Fails (1), (3), (8). Allows self-serving classes; collapses legitimacy.  
  - **Bayesian dissolution**: Fails (6), (8). Requires unattainable priors/likelihoods; non-auditable.  

  ---  

  #### **VI. Worked Applications**  
  **Case 1: Tunnel-Boring Rail Projects**  
  - *Team’s class*: All rail tunnels since 1990 (broad).  
  - *Ministry’s class*: Tunnels in water-bearing chalk at comparable depth (narrow).  
  - **Verdict**:  
    - (1) **Legitimacy**: Narrow class wins (geology causally impacts costs; broad class ignores material risk).  
    - (2) **Small-N**: If narrow class has N<10, require error margins ±40% (negotiable).  
    - (5) **Homogeneity**: Chalk tunnels likely homogeneous; broad class mixes geologies.  
    - **Outcome**: Ministry’s class accepted. *Team loses* despite preferring breadth.  

  **Case 2: Reversed Roles**  
  - *Team’s class*: Only water-bearing chalk tunnels (narrow).  
  - *Objectors’ class*: All rail tunnels since 1990 (broad).  
  - **Verdict**:  
    - (1) **Legitimacy**: If geology is irrelevant (e.g., costs driven by labor, not materials), broad class wins.  
    - (3) **Class vs. Truth**: Team must prove chalk *causes* cost variance (e.g., historical data showing 30%+ cost delta vs. other geologies).  
    - (6) **Feasibility**: If proof lacking, broad class accepted for auditability.  
    - **Outcome**: Objectors win. *Team dislikes* (wanted narrow class to avoid outliers).  

  **Failure Exposure**: In Case 2, if no causal proof exists and N is small, the verdict *imposes* a broad class despite potential irrelevance—highlighting the framework’s trade-off (feasibility > ideal relevance).  

  ---  
  **Final Summary**: No account satisfies all desiderata perfectly due to sparse data and causal uncertainty. Your specification forces explicit trade-offs: **homogeneity and legitimacy outweigh statistical power**, with feasibility constraining idealism. The procedure fails cleanly when evidence is ambiguous, refusing false precision.
