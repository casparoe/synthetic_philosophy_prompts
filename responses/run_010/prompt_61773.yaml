  First, I need to recall the core positions. Caruso denies basic desert because ultimate control is impossible due to causal histories. Dennett sees control as competence in reasons-responsiveness, making desert practical. The user notes their institutional prescriptions converge, which is crucial. So why the stalemate?

  The user’s hypothesis about resentment being the real issue makes sense. But I should check if there's more. Maybe the metaphysical vs. pragmatic divide is key. Caruso’s concern about ultimate sources might be non-negotiable for him, while Dennett dismisses it as irrelevant. That could explain the impasse—they’re answering different questions.

  The user asks specific questions: verbal dispute, two questions under one heading, empirical evidence, or bedrock values. Let's tackle each. 

  Verbal dispute? Partly, but deeper. "Control" means different things: competence vs. origination. So they’re discussing different aspects under "moral responsibility." 

  Empirical evidence? Dennett claims responsibility practices sustain competence. Caruso might agree but still deny desert. Evidence on this could matter but doesn't resolve the core philosophical split.

  Bedrock values? Likely. Caruso values ultimate sourcehood; Dennett sees it as incoherent. This is where arguments can't reach—it's about what we value in responsibility.

  The self-undermining charge: Dennett says denying reasons-responsiveness undercuts argument. But Caruso grants reasons-responsiveness; his point is about lack of ultimate control. So Dennett might miss Caruso's actual argument here.

  Progress? The user’s suggestion to focus on reactive attitudes is astute. Distinguishing competence from desert could help. Also, empirical studies on blame’s effects might inform but not settle the debate. Ultimately, mapping the disagreement might be more productive than resolving it, given the foundational differences.

  I should make sure to address all parts of the query, especially the user’s hypothesis and their questions about where the impasse is load-bearing. Highlighting the convergence on institutional practices is key to showing why the metaphysical disagreement persists without practical consequence. Emphasizing the different conceptions of control and the irreconcilable values will clarify why this debate doesn’t move forward.
answer: |-
  Your hypothesis is perceptive and largely correct. The Dennett-Caruso impasse arises from a fundamental misalignment in their projects, masked by surface-level clarity. Here's a diagnosis of the core issues and why progress is elusive:

  1.  **The Central Misalignment: Two Different Questions Under One Label**
      *   **Caruso's Question:** "Is the agent the *ultimate, uncaused source* of their character, dispositions, and choices?" (Sourcehood/Ultimate Responsibility). His answer is always "No," due to causal histories. "Basic desert" *requires* this impossible sourcehood for him.
      *   **Dennett's Question:** "Does the agent possess the *pragmatically relevant capacities* (reasons-responsiveness, self-control, understanding consequences) to be held accountable within a social system designed to shape and maintain those capacities?" His answer is "Yes, when those capacities are adequately present." "Desert" *means* qualifying under these pragmatic conditions.
      *   **Why it looks like one debate:** Both use the term "moral responsibility" and discuss blame/punishment. But Caruso defines it *metaphysically* (requiring contra-causal freedom/ultimate sourcehood), while Dennett defines it *functionally/pragmatically* (requiring competence within a system). **They are not debating the *same concept* of responsibility/desert.** Your "competence vs. origination" point hits the nail on the head.

  2.  **Why Institutional Convergence Doesn't Resolve It:**
      *   You're right that their practical prescriptions converge significantly. Dennett's pragmatic "desert" justifies a system remarkably similar to Caruso's forward-looking, proportionality-constrained public health model. *This convergence exposes the core of the stalemate:*
          *   For **Caruso**, this convergence *proves* that "basic desert" (as he defines it) is an unnecessary and harmful fiction. We can have justice *without* believing in the myth of ultimate responsibility.
          *   For **Dennett**, this convergence *proves* that his pragmatic conception of desert/control *is* the only coherent and useful one. Insisting on Caruso's "ultimate sourcehood" is demanding a metaphysical fantasy that adds nothing to practice and potentially undermines the functional system.
      *   **The Sticking Point:** The *justificatory language* and the *fittingness of reactive attitudes*. Caruso argues resentment/indignation, rooted in the *belief* in basic desert, are inherently unjustified and counterproductive. Dennett argues these attitudes, when calibrated to competence, *are* justified (fitting responses to reasons-ignoring) and *are* functional components of the accountability system.

  3.  **Addressing Your Specific Questions:**
      *   **Verbal Dispute?** Partly, but deeper. It's not *just* semantics over "control" or "desert," but a fundamental disagreement on what *constitutes* moral responsibility itself. Is it a metaphysical status (Caruso) or a functional role (Dennett)?
      *   **Two Questions Under One Heading?** **Yes, this is the primary load-bearing impasse.** "Moral responsibility" is an ambiguous umbrella term covering both *attributability* (was this action expressive of the agent's character/competence?) and *accountability* (can the agent *justly* bear the costs of blame/punishment?). Dennett focuses on attributability-grounding-accountability. Caruso argues attributability is real but insufficient for *desert-based* accountability; only forward-looking grounds work.
      *   **Hidden Empirical Question?** Relevant, but not decisive.
          *   Dennett's claim that responsibility practices *sustain* competence is empirical. Evidence (e.g., on effects of different blame styles, restorative justice vs. pure deterrence) *could* influence the *pragmatic* justification of practices *both* might endorse. It might challenge extreme versions of Caruso's pessimism about reactive attitudes.
          *   However, **it cannot resolve the core metaphysical disagreement.** Even if reactive attitudes are proven highly effective, Caruso would still deny they are *fitting* in the ultimate-desert sense. Dennett wouldn't care about that sense. Evidence might refine the *implementation* of their convergent systems but won't bridge the justificatory gap.
      *   **Bedrock Valuation?** **Yes, this is the ultimate, unresolvable layer.** Caruso values "Ultimate Sourcehood" as a necessary (though impossible) condition for true desert. Dennett fundamentally *devalues* this notion as incoherent and pragmatically irrelevant. This difference in foundational valuation is axiomatic. Arguments hit bedrock here because:
          *   Caruso sees Dennett as changing the subject (evading the *real* question of ultimate justice).
          *   Dennett sees Caruso as demanding an incoherent standard irrelevant to the world we inhabit.

  4.  **The Self-Undermining Charge:**
      *   Dennett's charge ("arguing people aren't moved by reasons undercuts arguing") **largely misses Caruso's thesis.** Caruso explicitly *grants* reasons-responsiveness and competence. His point is that *the specific reasons you find compelling and the competence you possess are not ultimately of your own making*. He argues *within* the space of reasons, trying to show that those reasons lead to the conclusion that basic desert is unjustified. Dennett's charge only hits a straw man (someone denying *any* reasons-responsiveness), which Caruso isn't.

  5.  **Where the Impasse is Load-Bearing and Decorative:**
      *   **Load-Bearing:** The core definitions of responsibility/desert/control, the question of whether ultimate sourcehood is necessary, and the fittingness of reactive attitudes. This is where arguments circle fruitlessly.
      *   **Decorative/Convergent:** The vast majority of *practical institutional design* (sanction severity, purposes of incarceration, weight of social causes). The debate feels stuck partly because this practical convergence makes the metaphysical disagreement seem academic. The *justification* for the system is the battleground, not the system's outline.

  6.  **What Counts as Progress?**
      *   **Mapping, Not Resolving:** Given the bedrock valuation difference, expecting full resolution is unrealistic. The most valuable progress is **precisely the kind of mapping you've done:** clarifying that they answer different questions, exposing the sourcehood vs. competence distinction, and highlighting the convergence on practice despite divergence on justification. This sharpens the debate for others.
      *   **Distinctions:** Further refining concepts – e.g., separating *attributability*, *answerability*, and *accountability* more rigorously; distinguishing types of "control" (guidance vs. regulative vs. ultimate).
      *   **Reformulating the Question:** Framing the debate explicitly around the **fittingness of reactive attitudes** is the most promising path forward (as you suggest). Shifting focus from "free will exists?" to "under what conditions are resentment, indignation, moral praise, and the imposition of sanctions *appropriate* or *justified* responses?" This directly engages the practical/emotional core where the disagreement manifests, even if the underlying valuations remain.
      *   **Empirical Evidence:** While not decisive for metaphysics, robust evidence on *how* specific responsibility practices (e.g., types of blame, restorative processes, legal frameworks) actually affect future competence, recidivism, victim well-being, and social trust *can* inform the *pragmatic* argument shared by both and potentially challenge assumptions about the necessity or harm of certain reactive attitudes within a justified system.

  **Conclusion:** The clean exchange goes nowhere because Dennett and Caruso are engaged in fundamentally different projects using the same vocabulary. Caruso seeks to expose the lack of a metaphysical foundation for deep desert. Dennett seeks to describe and justify the functional social practice of holding people responsible based on observable competence. Their institutional convergence is real but masks this chasm concerning the justification and emotional core of blame. The impasse is load-bearing on the questions of definition and the necessity of ultimate sourcehood, but decorative regarding practical policy outcomes. Progress lies in clearer mapping, sharper distinctions, reframing around reactive attitudes, and empirical work on the *effects* of practices – not in expecting one side to concede on their foundational commitments. You've diagnosed the core issue correctly: it's about the fittingness of the reactive emotions within a system they both, functionally, endorse.
