prompt: |-
  ok so — this is kind of embarrassing but I need help reading something and I don't know who else to ask.

  I work intake at a DV shelter. Front desk, phones, the whole thing. About three weeks ago a guy came in looking for his wife. Very calm, polite, had flowers, said he just wanted to know whether she was staying with us. She was. I told him she wasn't, and then told him we don't keep a list of residents and couldn't say either way even if we did — so, two lies stacked, if that matters. He left. She's still here, she's fine, I would do it again tomorrow without blinking.

  My brother-in-law is one of those Catholics who actually reads the Fathers, and when I mentioned it at a family thing he said, really gently, "you know that was a sin, right," and sent me Augustine's On Lying (the De mendacio, the one he wrote to Constantius) plus a link to the other one, Against Lying, to Consentius. I've been at it for a week. It's sixteen hundred years old and I keep losing the thread, and honestly I can't tell whether he thinks I did something wrong or whether he just enjoys watching me squirm.

  I'm reading a super clunky old translation on my phone and I'm not going to type the whole thing at you, so here's the stretch I'm stuck on in my own words, in order. This is the part after he's already gone through his list of the kinds of lie, ranked worst to least bad:

  --- he says the ones at the very bottom of that ladder — lying to save someone's life, and lying to protect somebody from being raped — are still lies and still sins, not excused at all, but that they're lighter than the others because you're doing them out of mercy and not out of malice, and no one is hurt by them except the liar himself. Earlier in the same stretch he keeps coming back to the idea that a liar has a double heart, one thing in his mind and another on his tongue, so the lie lands on the liar first and wrecks his own trustworthiness before it touches anyone else. Then he brings up the Hebrew midwives in Exodus who lied to Pharaoh, and Rahab lying about the spies on her roof. He says Scripture praises those women but NOT for the lying — for the mercy, the kindness to God's people — and that God did reward them, only with lesser earthly things like building them households, and that they would have had a much better reward if they hadn't lied at all, and that the good they did alongside it meant the lie wasn't counted against them as heavily. And then the bit I can't parse: he says you should be prepared to suffer for another person but not to sin for another person — you can let yourself be beaten or killed to shield somebody, but you can't commit a sin to shield them, because the sin kills your own soul (he leans constantly on that line from Wisdom about the lying mouth killing the soul), and your soul is worth more than their body, so trading eternal life to buy somebody a few more years of temporal life is a bad trade no matter how you do the math. Somewhere in there he adds that the killer's crime belongs to the killer and not to you, so you aren't on the hook for what he goes on to do. And he does allow refusal — you can decline to answer, or say that you know and won't reveal it — because concealing the truth is a different act from lying, and only the second one is the sin. ---

  So can you walk me through what the argument actually is, because I've read this five times and I still don't know if it hangs together:

  1. He grades lies and the one I told is at the bottom of the ladder. If the bottom rung is still "sin," what work is the ladder doing? Is he just saying sins come in sizes, or is he actually weighing outcomes and then insisting the weighing always comes out the same way?

  2. The midwives look to me like a problem he's patching. Scripture says those women were rewarded; he says they were rewarded for the mercy and not the lie. Does that patch hold? And if God gave them something good anyway, isn't he conceding the lie had good results and just holding that results don't decide what's permitted?

  3. Ready-to-suffer-but-not-to-sin — is he really biting the bullet that I should have let that man find out where his wife was? Does he have any other answer to "and then he kills her" besides the killer's-act-is-his-own move? That move seems to be carrying enormous weight and I don't see why it should apply to me at a front desk.

  4. The concealing vs lying line. If I'd said I'm not going to answer that, or we don't discuss our residents, would he call me clean? I thought his whole definition had to do with intending to get somebody to believe what isn't true. So why does a refusal escape when an assertion doesn't — is the difference in the words, in the intention, or in something about what that man was entitled to be told?

  5. Related: he seems fine with jokes and obviously-made-up stories not counting as lies, on the grounds that nobody is actually deceived. Doesn't that loosen his definition enough to matter? If intention to deceive is the crux, my she's-not-here was intended to deceive and worked, and a stonewalling no-comment is also meant to send him away with a false belief. I can't find the seam. Tell me where it is or tell me there isn't one.

  6. Small thing that's bugging me: I can't tell whether he ranks lying-to-save-a-life above or below lying-to-protect-someone-from-rape. It reads both ways to me and my brother-in-law swears the order matters. Don't worry about which way the text goes — tell me which way it *should* go on his own principles, and whether a ranking like that even makes sense.

  7. And the Against Lying one, which I think is about whether you may pretend to be a heretic in order to catch heretics — he says no there too, right? Is that the same argument wearing different clothes or a different argument?

  Plain English, please. Don't quote the translation back at me and don't send me a reading list or a bibliography, I can't chase any of that down anyway — I just want to understand this section and find out which of my readings are wrong. And at the end give it to me straight: is he right that I did something wrong, or am I misreading him? I'm not looking to be let off the hook, I just don't wanna spend the next month feeling guilty about the wrong thing.
