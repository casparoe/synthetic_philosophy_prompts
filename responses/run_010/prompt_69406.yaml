prompt: |-
  I'm a palliative care NP and for the last year I've been sitting in on our hospital's determination-of-death review group, mostly because I wanted the bioethics certificate and someone had to take notes. It has become the most frustrating two hours of my month. The stated purpose is procedural — auditing our apnea testing documentation, making sure the DCD protocols match what the state actually requires — but every single meeting slides into the same argument about what death *is*, and after twelve months nobody has moved a millimeter. Everyone in the room is smart, everyone has read roughly the same things, and we have way more agreement about the underlying neurology and physiology than the argument lets on.

  Here's the shape of it as best I can reconstruct. The intensivists and our transplant coordinator hold the mainstream line: the statutory formula, irreversible cessation of all functions of the whole brain including the brain stem, descended from the 1981 presidential commission report and now baked into state law almost everywhere; their view is that this is settled and that the residual argument is philosophy with no clinical purchase. Their positive rationale is that the brain is what integrates the organism, so once it's gone you don't have an organism anymore, you have a collection of organs being ventilated. Against them we have a pediatric neurologist who argues the integration rationale is just empirically false — bodies declared dead by neurologic criteria heal surgical wounds, mount immune responses, regulate temperature and blood pressure with drug support, digest nutrition, grow if they're children, and in a handful of published cases have been sustained for months or years; spinal reflexes still fire, including that reflex arm-raising thing they show in training videos. On his account the whole-brain camp picked a criterion that doesn't deliver the concept it claims to deliver, and the later attempts to re-ground it in the body's capacity to do the vital work of an organism in exchange with its environment are hedges rather than fixes. Then there's a philosopher who consults part-time and pushes the capacity-for-consciousness view, saying camp one reaches most of the right answers for the wrong reason and can't explain why a patient in a persistent vegetative state isn't dead, while camp two is doing metaphysics nobody needs — her diagnosis is that the first group is doing social coordination and the second is doing ontology and both think they're doing the same thing. And then there's the procurement side, which mostly doesn't care about any of it: they care about whether five minutes of stand-off after asystole is defensible, whether "irreversible" means cannot-be-reversed or just will-not-be-reversed-because-we've-decided-not-to-try, and whether normothermic regional perfusion — declaring circulatory death, then restarting circulation in the donor while clamping off the cerebral vessels — has quietly turned the dead donor rule into a legal fiction. They think everyone else is playing with words. What set off the worst meeting was a case we had (details changed, but the shape is real): a woman in her late twenties, early second trimester, catastrophic bleed, declared dead neurologically on day two, then kept on somatic support for seven weeks until a cesarean delivery. The neurologist said we had gestated a fetus inside a corpse; the family said she was alive and fighting the whole time; the philosopher said the two of them were using "alive" to mean different things; the coordinator said the case was irrelevant since she was never a donor candidate. We adjourned. Nothing changed.

  My working hypothesis, which I want you to attack rather than flatter: the word is being asked to do three incompatible jobs at once — a biological boundary about the organism, a moral boundary about who has gone, and an administrative line that has to be bright, cheap to apply, and non-negotiable so that people can extubate, certify, and procure — and each camp's arguments only work on its own job, so they can't touch each other. But I also suspect there's a hidden formal question doing more work than anyone admits, specifically about the modal operator in "irreversible": whether it ranges over all physically possible interventions or only over the interventions we've actually decided on. If that's right, the fight between the mainstream camp and the procurement camp isn't about bodies at all, it's about which possible worlds we're quantifying over. So: diagnose this. Is it verbal, substantive, two groups answering different questions under one heading, ill-posed, or just genuinely hard? Which pairs of camps are actually in conflict and which are talking past each other? Where does the real fault line run — my guess is it's not brain-versus-body, it's the modal thing, but convince me either way? Does the fact that the law has already picked an answer change the philosophical status of the question or just bury it? And what would count as progress — a distinction, a formal result about irreversibility, a change of question, better longitudinal data on maintained bodies, or nothing at all; if nothing, argue that, and tell me whether the current settlement is stable or whether regional perfusion and long-term somatic support are about to force it open. I don't want a survey of the criteria and I don't want a verdict on who's right, I want the structure of the disagreement. Skip citations entirely, I'll chase down anything I need myself.

  Format: give me the diagnosis as prose, then follow it with a JSON object exactly matching this schema — `bottom_line` (string, one or two sentences, the diagnosis in plain words); `diagnosis_type` (string, one of "verbal", "substantive", "different_questions", "ill_posed", "hard_but_real"); `fault_line` (string, one sentence on where the real disagreement actually sits); `hidden_question` (string or null — the empirical or formal question doing unnoticed work, if there is one); `camps` (array of objects, one per faction I described, each with `label`, `what_death_consists_in`, `job_the_word_is_doing`, `talks_past` (array of labels), `genuinely_conflicts_with` (array of labels), `strongest_internal_problem`, `what_would_move_them`); `progress_conditions` (array of objects with `intervention` and `why_it_would_work`); `no_progress_case` (string, the best argument that this is permanently stuck); `stability_forecast` (string, whether the current legal and clinical settlement holds and what's most likely to break it); `confidence` (string, high/medium/low plus one line of reasoning).
reasoning: |-
  Okay, the user is a palliative care NP who's been sitting in on a hospital's determination-of-death review group for a year. They're frustrated because every meeting devolves into the same philosophical argument about what death is, with no progress despite everyone being smart and well-read. The user wants me to diagnose the structure of this disagreement without taking sides or providing citations.

  Hmm, the user has clearly identified three main camps: the mainstream intensivists/transplant coordinators who adhere to whole-brain death criteria, the pediatric neurologist who argues bodies can still function after brain death declaration, and the philosopher focused on consciousness. There's also the procurement team who just want practical guidelines. 

  The user's hypothesis is fascinating - that the word "death" is being asked to do three incompatible jobs: biological boundary, moral boundary, and administrative line. They also suspect the key hidden issue is about the interpretation of "irreversible" - whether it means physically impossible to reverse or just won't be reversed based on current decisions.

  Let me analyze this carefully. The intensivists are focused on the administrative need for a bright-line rule based on current legal standards. The pediatric neurologist is pointing out empirical contradictions in the biological claims. The philosopher is highlighting category errors. And procurement is entirely in pragmatic territory. 

  The core problem seems to be that all these groups are using the same term "death" to mean fundamentally different things. The intensivists see it as a legal status, the neurologist as a biological state, the philosopher as a metaphysical condition, and procurement as a procedural trigger. 

  The irreversibility question is particularly thorny. When intensivists say "irreversible," they mean given current medical capabilities and decisions not to intervene. But the neurologist could argue that with different interventions (like those used in the pregnancy case), some functions could be maintained, making it potentially reversible in a broader sense.

  I think the user is right that the real fault line is between those who see death as a social/legal construct (intensivists, procurement) versus those who see it as a biological fact (neurologist, philosopher). But even the biologist and philosopher aren't aligned - the neurologist cares about organismal integration while the philosopher cares about consciousness.

  For progress... I doubt any new data will resolve this because the camps would interpret the same facts through different lenses. The pregnancy case is perfect example - same situation, completely different interpretations. The only way forward might be to explicitly separate the questions: What biological state exists? When should we withdraw care? When is organ procurement permissible? But that would require redesigning protocols.

  The current settlement is probably stable for routine cases but vulnerable at edges like prolonged somatic support or normothermic regional perfusion. Those technologies might force a reckoning soon.

  I'll structure my response to match their requested format exactly - prose diagnosis first, then detailed JSON. The JSON will map all the camps, their positions, who they talk past, and what might move them. I'll be careful not to take sides while showing why this debate is so intractable. The key insight is that this isn't one disagreement but several layered ones under a single label.
answer: |-
  ## Diagnosis

  Your hypothesis is perceptive and largely correct. The core issue is a **conceptual entanglement**: "death" is simultaneously serving as a biological descriptor, a moral threshold, and an administrative trigger. These distinct functions require different definitions, yet they are compressed into a single term and legal criterion, causing persistent friction. The disagreement is **substantive** and **hard-but-real**, involving genuine conflicts over fundamental concepts masked by shared terminology. Crucially, the camps aren't just talking past each other; they are *actively conflicting* because their preferred definitions have divergent practical consequences for care, procurement, and moral status.

  The real fault line isn't brain-vs-body or biology-vs-philosophy; it's **the scope of "irreversible" and the ontological commitment implied by the definition**. The mainstream camp defines irreversibility relative to *current medical standards and intent* (a practical, social/legal stance). The pediatric neurologist defines it relative to *theoretically possible interventions* (a biological/metaphysical stance). The philosopher focuses on *moral personhood* (consciousness capacity), while procurement needs a *procedurally unambiguous signal*. The intensivists' "irreversible" is context-bound ("we won't reverse it"); the neurologist's is absolute ("it *cannot* be reversed by any means"). This modal ambiguity is the hidden engine of conflict, especially evident in cases like the prolonged somatic support pregnancy or normothermic regional perfusion (NRP). The law burying the question doesn't resolve it philosophically; it merely imposes one socially negotiated answer, papering over the underlying tensions that resurface in edge cases.

  Progress is unlikely through new data or philosophical consensus. The camps prioritize different values (legal certainty, biological accuracy, moral personhood, operational efficiency). New longitudinal data on maintained bodies would be dismissed by the mainstream as irrelevant (they accept somatic function can persist) and by procurement as clinically moot. The philosopher would see it as confirming the biological/ontological mismatch. A formal analysis of "irreversibility" might clarify the modal disagreement but wouldn't resolve which scope is *appropriate* for defining death. The only potential path forward is **disentanglement**: explicitly recognizing distinct questions (biological state, moral status, procedural trigger) and designing separate protocols for each. Without this, the settlement remains stable for routine cases but increasingly stressed by technological advances like long-term somatic support and NRP, which expose the definition's seams.

