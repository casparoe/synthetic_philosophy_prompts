answer: |-
  Here is the strict translation into axiomatic social welfare function (SWF) vocabulary, followed by the residue report addressing your specific pressure points and judgment.

  ### (i) Prioritarianism (Parfit) in SWF Terms
  *   **Formal Restatement:** A prioritarian SWF is a **welfarist**, **anonymous** social welfare function \( W = \sum_{i=1}^N g(u_i) \) where \( g: \mathbb{R} \to \mathbb{R} \) is a **strictly increasing and strictly concave transformation function**, defined over a set of individual utilities \( u_i \) assumed to be **cardinal and level-comparable (CUC or CF)**. This SWF satisfies:
      1.  **Weak Pareto:** If \( u_i' \geq u_i \) for all \( i \) and \( u_j' > u_j \) for some \( j \), then \( W(\mathbf{u'}) > W(\mathbf{u}) \).
      2.  **Strong Pareto:** If \( u_i' \geq u_i \) for all \( i \), then \( W(\mathbf{u'}) \geq W(\mathbf{u}) \), with strict inequality if \( u_i' > u_i \) for any \( i \).
      3.  **Pigou-Dalton Transfer Principle:** For any two individuals \( i, j \) where \( u_i < u_j \), transferring a small amount of utility \( \delta > 0 \) from \( j \) to \( i \) (such that \( u_i' = u_i + \delta \), \( u_j' = u_j - \delta \), and \( u_i' < u_j' \)) increases social welfare: \( W(\mathbf{u'}) > W(\mathbf{u}) \).
  *   **Distinction Mechanism:** The concavity of \( g \) implies **diminishing moral value of utility gains** as absolute utility levels increase. This makes the SWF sensitive to the *levels* of utility, not just the *distribution* (as captured by Pigou-Dalton). Gains to lower-utility individuals contribute more to social welfare than identical gains to higher-utility individuals, irrespective of whether the gain reduces inequality.

  ### (ii) The Leveling-Down Objection in SWF Terms
  *   **Formal Restatement:** Consider two utility vectors \( \mathbf{u} \) and \( \mathbf{u}^{LD} \).
      *   \( \mathbf{u}\): \((u_1, u_2, ..., u_h, ..., u_\ell, ..., u_N)\) where \( u_h > u_\ell \).
      *   \( \mathbf{u}^{LD}\): \((u_1, u_2, ..., u_\ell, ..., u_\ell, ..., u_N)\) (i.e., \( u_h \) is reduced to \( u_\ell \), all else equal).
  *   The leveling-down objection asserts that an egalitarian view might hold \( \mathbf{u}^{LD} \) to be *at least as good as* \( \mathbf{u} \) (or even strictly better) solely based on reduced inequality.
  *   **Distinction Work:** For any strictly increasing SWF \( W \) satisfying Weak Pareto (including the prioritarian SWF above), \( W(\mathbf{u}^{LD}) < W(\mathbf{u}) \) because \( u_h^{LD} = u_\ell < u_h \) and all other utilities are equal. A prioritarian SWF *necessarily* ranks \( \mathbf{u} \) strictly above \( \mathbf{u}^{LD} \). An SWF that ranked \( \mathbf{u}^{LD} \) at least as good as \( \mathbf{u} \) would violate Weak Pareto.

  ### Residue Report

  1.  **Clean Formal Counterparts:**
      *   **Prioritarianism:** Correctly identified as an **anonymous, Pareto-respecting (Strong & Weak), additive SWF \( W = \sum g(u_i) \) with strictly concave \( g \)**. This directly implies Pigou-Dalton.
      *   **Distinction from Utilitarianism:** Utilitarianism (\( W = \sum u_i \)) is the special case where \( g \) is linear. Concave \( g \) captures prioritarianism's sensitivity to absolute levels.
      *   **Distinction from Strict Egalitarianism (in this context):** Any SWF satisfying Weak Pareto (including prioritarianism) must reject \( \mathbf{u}^{LD} \geq \mathbf{u} \). The leveling-down objection *is* the demonstration that an SWF satisfying Weak Pareto cannot rank a LD outcome as good as the non-LD outcome.
      *   **Pigou-Dalton:** Correctly noted as carrying the inequality-sensitive part for both prioritarianism and many egalitarian views. It is a necessary consequence of the prioritarian SWF specification.

  2.  **Translation by Distortion:**
      *   **"Better in one respect" (Leveling-Down Objection):** This phrase is distorted within the standard welfarist SWF framework. A complete ordering \( \succsim \) derived from a single-valued \( W \) *does not admit* the concept of one alternative being "better in one respect" while being worse overall (absent specific value decomposition). To capture this, one must *change the framework*:
          *   **Option 1 (Quiet Subject Change):** Introduce a **vector-valued evaluation**, e.g., \( \mathbf{V}(u) = (W(u), I(u)) \), where \( I(u) \) is an inequality index (like Atkinson or Gini). Then \( \mathbf{u}^{LD} \) might be ranked worse by \( W \) but better by \( I \), explaining "in one respect" (equality). This abandons a single complete social ordering in favor of a multi-criteria view. **Flag: This smuggles in non-welfarist elements (direct focus on distribution) and abandons the core SWF structure.**
          *   **Option 2 (Quiet Subject Change):** Adopt a **partial ordering**. An egalitarian might declare \( \mathbf{u} \) and \( \mathbf{u}^{LD} \) *incomparable* under their criteria, or only impose \( \mathbf{u}^{LD} \succsim \mathbf{u} \) if equality is the *only* value considered. Adding Pareto conditions forces completeness or specific rankings conflicting with pure egalitarian impulses. **Flag: The standard SWF framework assumes completeness; relaxing this fundamentally alters the structure and discharges the objection's force by allowing incompleteness where the framework demands resolution.**

  3.  **No Formal Counterpart:**
      *   **The intrinsic value of equality (as distinct from concern for absolute levels):** While Pigou-Dalton reflects aversion to inequality, it is satisfied by both prioritarianism and many egalitarian views. The philosophical claim that equality has *intrinsic* value, potentially justifying leveling-down *even if* it makes no one better off and someone worse off, has no direct counterpart within a welfarist SWF satisfying Weak Pareto. Weak Pareto explicitly forbids the ranking that embodies this intrinsic value claim in the LD case.
      *   **"Relational" vs. "Telic" egalitarianism:** Distinctions based on *why* equality matters (e.g., unfairness vs. intrinsic badness of inequality) lack formal counterparts. The SWF specification \( W = \sum g(u_i) \) embodies a specific "telic" prioritarianism. Alternative justifications for Pigou-Dalton (like fairness) are not formally distinguished within the welfarist ordering.

  ### Addressing Pressure Points

  1.  **"Better in one respect" and the Complete Ordering:**
      *   **Recoverability within Standard SWF?** **No.** The standard welfarist SWF framework, issuing a single complete ordering \( \succsim \) based solely on the utility vector, *cannot* formally recover the concept of one outcome being "better in one respect" while being worse overall under the same evaluative criterion. The ordering is holistic.
      *   **Requirement for Non-Standard Framework:** Capturing "in one respect" **requires changing the subject**, either by:
          *   Introducing **vector-valued social evaluation** (e.g., separate criteria for efficiency and equality), abandoning the single real-valued SWF and complete ordering based solely on utilities. **Flag: This violates welfarism's core by allowing non-utility information (the distribution pattern itself) as a direct source of value.**
          *   Adopting a **partial ordering**, allowing outcomes to be incomparable if they score differently on conflicting values (e.g., Pareto efficiency vs. equality). **Flag: This abandons the completeness axiom, a fundamental component of the standard SWF framework. The objection leverages the tension created *by* completeness and Pareto.**

  2.  **Concave Transform, Origin, and Measurability:**
      *   **Your Intuition is Correct:** A strictly concave transformation \( g(u_i) \) **is not invariant to affine transformations (changes in origin *or* scale) of the individual utility functions \( u_i \).** This means prioritarianism, as formally defined by \( W = \sum g(u_i) \), **presupposes that individual utilities are measurable on a scale stronger than unit comparability (CU).**
      *   **Required Measurability:** Prioritarianism requires at least **cardinal unit and level comparability (CULC or CF - Cardinal Full Comparability)**. The concavity of \( g \) implies that the *zero point* (or baseline) of the utility scale matters. Doubling all utilities *does not* preserve the prioritarian ranking under concave g (unlike utilitarianism under CU).
      *   **Substantive Commitment:** **This is absolutely a substantive commitment about the utility scale, not a mere technicality.** Prioritarianism asserts that we can meaningfully compare not only the *sizes* of utility differences between individuals (CU) but also the *absolute levels* of utility. It requires a utility concept where statements like "Individual A is at twice the absolute welfare level of Individual B" are meaningful *before* applying the concave transformation. **Flag: This cardinalist/level-comparability assumption discharges significant philosophical work. It assumes the deep philosophical problem of interpersonal level comparison is resolved satisfactorily before prioritarian aggregation even begins.**

  ### Final Judgment: Limitation vs. Indeterminacy

  *   **What Fails to Translate:** The core elements failing clean translation are 1) the "better in one respect" aspect of the leveling-down objection within a single complete ordering, and 2) the distinction between intrinsic value of equality and priority for the worse off (beyond their common satisfaction of Pigou-Dalton).
  *   **Cause - Limitation of the Framework:** The failure primarily marks a **limitation of the standard welfarist SWF framework**, specifically its assumptions of **Completeness** and **Welfarism**.
      *   **Completeness:** Demands a single, decisive ranking for all pairs of alternatives. This forces a resolution in cases like leveling-down where conflicting values (Pareto efficiency vs. equality) pull in opposite directions. The framework cannot natively represent the tension; it can only output the ranking dictated by the chosen SWF axioms.
      *   **Welfarism:** Restricts the informational basis solely to the vector of individual utilities. It explicitly excludes non-welfarist information, such as the pattern of distribution itself being a source of intrinsic value independent of the sum or transformed sum of utilities. This prevents formally capturing an egalitarianism based purely on the intrinsic badness of inequality.
  *   **Indeterminacy?** While philosophical presentations might sometimes be less precise, the core claims *are* determinate enough: "Equality has intrinsic value" vs. "Only absolute levels matter, with priority to the worse off." The framework's limitation is its inability to *simultaneously* represent these distinct evaluative perspectives within its standard structure without abandoning core axioms (Completeness, Welfarism) or measurability assumptions (CUC for utilitarianism vs. CULC/CF for prioritarianism). The residue highlights the substantive choices embedded in the SWF axioms and measurability assumptions.
