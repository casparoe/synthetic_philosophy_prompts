  Noticing the user is remarkably precise about what their audience needs - no jargon, no uncontextualized terms, questions must stand alone when spoken aloud. This suggests each question must contain its own miniature setup. For example, when addressing mystics not feeling coerced, I'll need to briefly establish that phenomenon exists before asking why it doesn't refute the freedom objection.

