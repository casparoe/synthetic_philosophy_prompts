answer: |-
  Hylas tries: *Unobserved? Unthought?*
  He shuts his eyes, wills vacancy—
  a tree alone? But bark insists,
  a green persists… he finds instead
  this stubborn shape. *Well then: I see—*
  I conceive it in my mind.
  (That settles it.)

  *Wait!* (A voice, perhaps his own).
  That shape you hold – was *that* the task?
  Not just the oak, but *oak alone*?
  You pictured tree, not tree *untracked*.
  You caught the thing, but missed the lack.
  You proved you grasped… but grasped *what*? See:
  I conceive it in my mind.
  Just that. The thing. Not how it lives.

  *(Clause: Lines 6 & 15. Second lineation ("it in my mind") exposes how the objector's 'proof' merely restates the content conceived, mistaking it for proof of the manner conceived 'as'.)*
