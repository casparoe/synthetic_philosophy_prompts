prompt: |-
  I'm the programming and grants lead at a small county heritage trust — think two full-time officers, a shared office with the local history society, and a volunteer committee of eleven lay trustees who ratify everything. Every year we get somewhere around forty applications that lean on the word "tradition," and right now we decide them by vibes and by whoever on the committee shouts loudest. Three things happen in a typical file: a parish council wants money to run a ceremony they say is centuries old; a tourism board wants heritage signage that makes a continuity claim in a single sentence; and occasionally we get handed something that's openly brand new and nobody knows what to do with it. Each application gets about forty-five minutes of officer time before it goes to committee, we can't pay for more than roughly one officer-day of archival digging per case, and when we refuse something the reason goes out in writing and sometimes into the parish newsletter. Last spring the local paper ran a piece calling us "the authenticity police" after we turned down a maypole revival, and honestly I can see both sides of that.

  What I want is a decision procedure my team and the lay committee can actually run, grounded in what Hobsbawm and Anderson actually say rather than the pop version — but translated, so nobody on the committee has to read anything. There's a bit in Hobsbawm where he separates tradition out from custom and from mere routine or convention, and I'm fairly sure that's the load-bearing distinction for us, but I only half-remember how he draws the lines, so please get it right and tell me if the distinction is one I should be using at all. I also want Anderson's contribution to survive in some usable form: specifically the point that a community being imagined doesn't make it a fake or a fraud, and that invented traditions are usually responses to genuinely new social conditions rather than lies dressed up as old ones. If the procedure can't hold onto that, it'll turn into the authenticity-police thing again, and it'll also structurally favour the traditions that happen to have left written records — the propertied, literate, church-adjacent ones — over ones that were transmitted orally or whose paperwork got burned, flooded, or filed in a country that no longer exists. Tell me how to handle the silence problem: an empty file is not proof that nothing happened, but we still have to say yes or no. Two other things to fold in. First, our officer before me left behind a scoring sheet with five bands from "no continuity demonstrated" to "unbroken documented practice," and the procedure has to map onto those bands without pretending the bands measure anything real. Second, a colleague wants to import what she calls a transmission-chain test — can you name, for each generation, a person or institution that passed the practice on, with no gap longer than a lifetime? I've written it up in our internal guidance as "the provenance gap," which I now suspect is a made-up term doing no work. Keep, revise, or kill that test and say which.

  Run the procedure on three files. (1) Ashcombe St Mary parish council, £4,800 for a winter orchard blessing they describe in the application as running "since Tudor times": the file contains one sentence in a Victorian antiquary's 1878 pamphlet on county customs, a 1954 parish newsletter mention of a one-off event, an order of service drafted in 2016 by the WI and the pub landlord, and nothing at all in between. (2) The borough tourism board, £2,200 for new signage for the town's "ancient charter fair, held since time immemorial" — our solicitor keeps muttering that time immemorial has an actual legal date attached to it — where the file shows a market charter of 1274, a court record of the last proclamation in 1841, an improvement act in 1846 that fenced off the common, a Rotary Club revival in 1998, and a "traditional" spiced pasty that the applicant's own publicity dates to a 1974 recipe competition. (3) The one I'm braced for: our own flagship event, the Victorian Christmas at the Hall, which we've run for thirty-one years and whose gate plaque, website and sponsorship leaflet all describe it as a tradition of the estate; a supermarket has offered us £14,000 a year for three years conditional on the copy staying as it is. Give me a verdict line for each plus one sentence of public-facing wording we could actually send to the applicant.

  Format it like this, in this order: Bottom line (five sentences, the spine of the procedure, no preamble); What survives the translation (about 350 words on which distinctions from the two books you're keeping, which you're dropping for a lay audience, and why the dropped ones don't matter here); The procedure (numbered gates, roughly 700 words — for each gate, the question to ask, what counts as a sufficient answer, and where the gate exits and to what); Evidence and silence (about 250 words, including what to do with an empty file and with oral testimony); Where it hands over to people (about 200 words on the calls that are values rather than facts, who signs off, and how a refusal gets worded so it isn't read as calling the applicants liars); Where this will misfire (about 250 words, be blunt — including the cases where it punishes undocumented communities and where it lets a confident liar through); Worked cases (three, about 250 words each, verdict line plus the public sentence); The one-pager (under a page, printable, for the committee table). No bibliography and please don't invent page numbers — if you're not sure Hobsbawm or Anderson said something, say so rather than guessing.
reasoning: |-
  Hmm, this is a fascinating and very specific request from someone working in heritage grant allocation. The user is clearly deeply familiar with Hobsbawm and Anderson's theories but needs a practical framework for their committee. They're wrestling with the tension between academic rigor and real-world constraints - limited research time, volunteer committees, and public accountability after that "authenticity police" label.

  The core challenge is translating complex ideas about invented traditions and imagined communities into yes/no decisions without perpetuating class biases (favoring documented over oral traditions) or falling into purity tests. They've already identified key pain points: the "silence problem" (absence of evidence ≠ evidence of absence), their predecessor's flawed scoring system, and that questionable "provenance gap" test their colleague proposed.

  I notice they're particularly concerned about equity - they explicitly mention not wanting to disadvantage traditions without written records. That "country that no longer exists" line suggests they've encountered post-colonial or border-change complications before. The supermarket sponsorship dilemma with their own Victorian Christmas event shows admirable self-awareness - they're willing to apply the same standards to themselves.

  The three test cases are perfectly chosen to stress-test any framework: 
  - Ashcombe's orchard blessing (fragmented evidence with big gaps)
  - The charter fair (legal vs lived continuity with a clearly invented food tradition)
  - Their own event (modern creation with corporate sponsorship riding on the "tradition" label)

  For the theoretical foundation, I'll focus on Hobsbawm's distinction between "tradition" (invented/recent but presented as ancient), "custom" (genuinely old and adaptive), and "routine" (functional but unritualized). Anderson's crucial contribution is that "imagined" doesn't mean "fake" - communities cohere around shared practices regardless of antiquity. The framework must separate descriptive continuity from cultural value.

  That "provenance gap" test needs dismantling - demanding generational witnesses would exclude most folk traditions. Better to focus on evidence of social purpose across time. Their existing five-band scoring can be repurposed not as authenticity grades but as evidence-density indicators, explicitly decoupled from worthiness.

  For the silence problem: absence of documentation becomes a neutral factor - we note it but don't penalize. Oral history gets equal weight if properly recorded. The burden shifts to demonstrated present-day meaning rather than provable antiquity.

  The supermarket case is the ethical tripwire. However you slice it, their Victorian Christmas is textbook invented tradition (Hobsbawm would nod grimly). But the solution isn't rejecting sponsorship - it's reframing the narrative to celebrate conscious revival rather than false continuity. "Tradition of renewal" could be their out.

  Biggest pitfalls? The system will still favor literate cultures, and charismatic applicants might game it. We mitigate but can't eliminate that. Also, the committee must understand they're assessing cultural significance, not playing history detectives. Wording refusals carefully is crucial - emphasize "doesn't meet evidentiary threshold" never "your tradition is fake."

  For the one-pager: simple flowchart with three gates (social meaning, evidence of operation, no active deception), plus decision matrix mapping evidence types to their existing bands. Kill the provenance test but keep its spirit as "demonstrated transmission mechanism" - flexible enough for oral histories. Most importantly, center Anderson: "All traditions begin somewhere; what matters is where they take us."
answer: |-
  Here's a decision procedure grounded in Hobsbawm & Anderson, translated for a lay committee, addressing your constraints and concerns:

  **Bottom Line (5 Sentences):**
  1.  We assess claims of "tradition" based on evidence of **social meaning/purpose** and **demonstrated historical operation**, not just claimed age.
  2.  "Tradition" (in Hobsbawm's sense) involves **formalization, repetition, and symbolic connection to the past**, distinct from adaptable "custom" or practical "routine".
  3.  An "invented" or revived practice isn't automatically invalid; its **current cultural significance and community connection** are vital (Anderson).
  4.  Evidence gaps don't prove non-existence; we weigh **available evidence types** (written, oral, material) against the claim, noting silences but not penalizing solely for them.
  5.  Our verdicts focus on **supporting practices with cultural resonance and integrity**, not policing authenticity, explaining decisions based on evidence thresholds.

  **What Survives the Translation (~350 words):**

  *   **Keeping from Hobsbawm:**
      *   **Core Distinction:** We explicitly separate:
          *   **Tradition (Formalized/Invented):** Practices *invented/recently formalized* but presented as ancient or immutable (rituals, symbols). Characterized by **formalization, repetition, symbolic invocation of past, rules.** (e.g., invented ceremonies, codified "ancient" rituals).
          *   **Custom (Genuinely Old/Adaptive):** Older practices that *genuinely evolve* organically over time to meet changing needs. More flexible, less rigidly rule-bound. (e.g., many folk practices, evolving festivals).
          *   **Routine/Convention (Functional):** Practices done for purely practical reasons, lacking symbolic historical claims or formal ritual (e.g., market opening hours). *This distinction is crucial for us.*
      *   **Invented Traditions Aren't Fake:** They serve real social functions (creating cohesion, legitimacy, responding to change). Their *invention* doesn't make them culturally meaningless *now*.
  *   **Keeping from Anderson:**
      *   **"Imagined" ≠ "Fake":** All communities larger than face-to-face interaction are "imagined." This doesn't invalidate the sense of belonging or shared identity fostered by practices, new or old. *This prevents "authenticity police" labeling.*
      *   **Response to Change:** Traditions are often invented/revived during periods of disruption to provide stability or new identity.
  *   **Dropped (But Doesn't Matter Here):**
      *   **Hobsbawm's Detailed Political Context:** His focus on nation-states and elites inventing traditions for political control is less relevant to our small-scale, community-driven applications. We focus on the *mechanism* (formalization/invention) and *function* (social cohesion, identity).
      *   **Anderson's Specific Print Capitalism Role:** The mechanics of how print enabled national imagined communities isn't needed for assessing local practice claims. We retain the core concept of community identity being valid even if constructed.
  *   **Why Dropped Distinctions Don't Matter:** Our focus is on the *nature of the practice* (formalized/invented vs. adaptive custom vs. functional routine) and its *current social function and evidence*, not replicating their macro-historical theses. The retained core concepts directly address applicant claims and our need to evaluate "tradition" meaningfully without requiring deep historical theory.

  **The Procedure (Numbered Gates, ~700 words):**

  1.  **Gate 1: Is it claimed as "Tradition" (Formalized Past Connection)?**
      *   **Question:** Does the application explicitly claim historical continuity, ancient roots, or immutability (using words like "tradition," "ancient," "centuries-old," "time immemorial," "unchanging")?
      *   **Sufficient Answer:** YES (Proceed to Gate 2). NO (This is likely **Custom/Routine/New Creation**. *Exit to "Values Decision"* - See "Where it hands over to people". Its merit is based on current value, not historical claim).
      *   **Where it exits:** To "Values Decision".

  2.  **Gate 2: Evidence of Operation & Social Meaning (Any Era)?**
      *   **Question:** Is there *any* credible evidence (written, oral history, photographs, material culture, consistent public record) demonstrating that:
          a)  The *core practice* (or a clearly identifiable direct ancestor) actually occurred?
          b)  It held social/cultural significance beyond the purely functional (ritual, celebration, communal identity, symbolic meaning)?
      *   **Sufficient Answer:** YES (Evidence exists for *some* point(s) in time showing the practice happened and had meaning). Proceed to Gate 3. NO (No evidence the claimed practice *ever* existed meaningfully. *Exit to "Reject"* - Claim lacks foundation).
      *   **Where it exits:** To "Reject".

  3.  **Gate 3: Nature of Continuity & Formalization (Hobsbawm's Distinction)?**
      *   **Question:** What does the evidence reveal about the *nature* of the practice and its claimed continuity?
          *   **Formalized Tradition / Invented Tradition:** Evidence shows a recent (relative to claim) *formalization, codification, or (re)invention* of rules, rituals, or symbols presented as old/immutable? (e.g., documented revival, newly written ceremony based on fragments).
          *   **Adaptive Custom:** Evidence shows genuine older roots *and* demonstrable, continuous (though possibly evolving/adaptive) practice organically responding to community needs? (Rarely perfectly documented, look for consistent mentions/adaptations).
          *   **Routine/Convention:** Evidence shows the practice was/is primarily functional, lacking ritual/symbolic weight? (e.g., market held for trade, not ceremony).
          *   **Unclear/Intermittent:** Evidence is spotty, showing activity but not consistent form or clear transmission?
      *   **Sufficient Answer:** Categorize the practice based on evidence. Proceed to Gate 4.
      *   *(This gate applies Hobsbawm's core distinction based on evidence, not vibes)*.

  4.  **Gate 4: Anderson Check - Current Significance & Integrity?**
      *   **Question:**
          a)  Does the practice hold **genuine current social/cultural significance** for the community it claims to represent (beyond tourism/economic)? (Evidence: participation levels, community involvement, local perception).
          b)  Is the application/material **presenting the history with integrity**? (Not fabricating evidence, acknowledging known revivals/gaps, not suppressing inconvenient facts)?
      *   **Sufficient Answer:**
          *   YES to both (Proceed to Gate 5).
          *   NO to (a) - Lacks current meaning (*Exit to "Values Decision"* - Is revival worth supporting on other merits?).
          *   NO to (b) - Misrepresentation (*Exit to "Reject"* - Integrity failure).
      *   **Where it exits:** To "Values Decision" or "Reject".

  5.  **Gate 5: Mapping to Bands & Funding Recommendation:**
      *   **Question:** Based on Gates 1-4, map the practice to the pre-existing bands **solely as descriptors of evidence density/type, NOT inherent value:**
          *   5: Unbroken Documented Practice (Rare) - Strong evidence of continuous adaptive custom.
          *   4: Strong Documented Continuity - Good evidence, perhaps gaps, but clear lineage (Adaptive Custom or well-documented Invented Tradition).
          *   3: Evidence of Historical Basis & Modern Revival - Clear older roots (Gate 2), recent formalization/revival (Gate 3), current significance/integrity (Gate 4). **Most revivals land here.**
          *   2: Fragmented Evidence / Customary Origin Possible - Some historical hints (Gate 2 pass), nature unclear (Gate 3 Unclear), current meaning may be strong (Gate 4 pass).
          *   1: No Continuity Demonstrated / New Creation - Failed Gate 2 or Gate 4b.
      *   **Sufficient Answer:** Assign band based on evidence reviewed. **All bands 2-5 can potentially be funded** if they pass Gate 4 (significance/integrity). Band 1 only via "Values Decision" if claimed as new. *Exit to "Funding Recommendation"*.
      *   **Where it exits:** To "Funding Recommendation".

  **Evidence and Silence (~250 words):**

  *   **Silence is Neutral:** An empty file proves nothing. It doesn't confirm existence *or* non-existence. Don't penalize it directly.
  *   **Weigh the Claim Against Evidence:** A grand claim ("since time immemorial") requires stronger evidence than a modest one ("revived based on local lore"). Silence becomes more significant against extravagant claims.
  *   **Oral Testimony:** Accept as valid evidence, especially for communities with oral traditions or disrupted histories. Record it formally during officer time (brief interview summary). Corroborate if possible (multiple sources, connection to known events/locations). Its weight depends on specificity, consistency, and source credibility.
  *   **The "Provenance Gap" Test (Kill it):** Demanding a named transmission chain for each generation is unrealistic for most community practices, especially oral/vernacular ones. It inherently favours literate, institutionalised traditions. **Revised Approach:** Focus on **evidence of the practice operating** at different points (Gate 2) and the **nature** of any gaps (Gate 3). A gap isn't fatal if evidence before and after exists and the revival has integrity/significance (Gate 4). Ask "*Is there any evidence it happened?*" not "*Can you name every person who passed it on?*".

  **Where it hands over to people (~200 words):**

  *   **Values Decisions:** Occur if:
      *   Practice fails "Tradition" claim (Gate 1 NO) - Should we fund it as a new/customary/functional activity based on community benefit?
      *   Practice has weak history but strong current significance (Gate 4a YES, but low Band 2/3) - Is the cultural value *now* sufficient?
      *   **Who Decides:** The **Officer** recommends based on community engagement, strategic fit, and overall merit assessment during their 45 mins (+ any digging). The **Committee** ratifies this recommendation, bringing local knowledge and values. The Committee has final say on funding these.
  *   **Sign Off:** Officer prepares summary (including Gate outcomes, Band, recommendation). Committee ratifies all decisions.
  *   **Wording Refusals (Tradition Claim):** Focus on evidence threshold, not truth. **"Based on the available evidence reviewed, the application did not sufficiently demonstrate the historical continuity of the practice as described to meet the criteria for funding under this specific 'tradition' claim. This assessment does not comment on the value or validity of the practice itself, which may be supported under other criteria or in future applications."** Always affirm community effort.

  **Where this will misfire (~250 words):**

  *   **Punishing Undocumented Communities:** Despite intentions, practices reliant on oral history or from marginalized/disrupted communities will struggle at Gate 2/3. Oral evidence requires careful, respectful handling within time limits. The burden of "proof" remains harder for them.
  *   **Confident Liars Prevail:** A well-researched, plausibly fabricated history supporting a recent invention could pass Gates 2 & 3 if our limited digging misses the fabrication. Gate 4b (integrity) is a weak defence against determined fraudsters within 45 mins/1-day dig.
  *   **"Current Significance" (Gate 4a) is Subjective:** Measuring genuine community meaning vs. performative tourism is hard. Vibrant participation might be manufactured or temporary. Officers/Committee bias can creep in.
  *   **Band Confusion:** Lay committee may still see Bands 4/5 as "better" than 3, despite procedure emphasizing current significance over antiquity. Requires constant reinforcement.
  *   **Over-Simplifying "Custom":** Distinguishing genuinely adaptive custom from formalized tradition can be very nuanced with patchy records. Might misclassify evolving practices.
  *   **Resource Limits:** The 45-min/1-day cap means complex cases get superficial treatment. Important evidence might be missed, leading to incorrect Gate outcomes.

  **Worked Cases (~250 words total):**

  1.  **Ashcombe St Mary (Orchard Blessing):**
      *   **Verdict:** **Band 3 (Evidence of Historical Basis & Modern Revival).** Gate 1 (YES - "since Tudor"). Gate 2 (YES - 1878 mention, 1954 snippet show *some* past activity). Gate 3 (Formalized/Invented Tradition - 1878 is Victorian, 1954 one-off, current form dates to 2016 formalization). Gate 4 (Likely YES - Local WI & pub involvement suggests current community meaning; presentation seems honest about gaps). **Recommend Funding** based on current significance, acknowledging it's a revival.
      *   **Public Wording:** "Funding approved. The application demonstrates historical interest in orchard blessings in Ashcombe, leading to a valued modern community revival initiated by local groups. This supports the practice's contemporary cultural role."

  2.  **Borough Tourism Board (Charter Fair Signage):**
      *   **Verdict:** **Band 3 (Evidence of Historical Basis & Modern Revival) for the *event*. Band 1 (New Creation) for the pasty.** Gate 1 (YES - "ancient", "time immemorial"). Gate 2 (YES - Charter 1274, court record 1841 prove *market* existed; Rotary revival 1998). Gate 3 (Unclear/Intermittent -> Formalized Tradition - Market operated functionally (routine?) for centuries, *proclamation* ended 1841; 1998 is a conscious revival of ceremonial aspects. Pasty is new (1974)). Gate 4 (YES for event (current significance likely high), NO for pasty claim (integrity failure - claim is false)). **Recommend Funding for Event Signage ONLY**, rejecting pasty funding/claim.
      *   **Public Wording (Event):** "Funding approved for signage related to the historic charter market and its modern revival. The signage should accurately reflect the market's long history and its renewed celebration since 1998." *(Separate letter for pasty rejection based on 4b)*.

  3.  **Victorian Christmas at the Hall:**
      *   **Verdict:** **Band 3 (Evidence of Historical Basis & Modern Revival).** Gate 1 (YES - "tradition of the estate"). Gate 2 (YES - It has run for 31 years, showing operation & meaning). Gate 3 (Formalized/Invented Tradition - Clearly established 31 years ago, drawing on Victorian *era* themes, not a specific continuous estate practice). Gate 4 (YES - Significant event; BUT current description lacks integrity ("tradition of the estate" implies older continuity than exists)). **Recommend Funding CONDITIONAL** on revising promotional wording to accurately reflect its origin (e.g., "a beloved 30-year tradition," "celebrating Victorian heritage").
      *   **Public Wording (Conditional):** "Funding approved. The Victorian Christmas is a significant and valued community event. To ensure historical integrity, the promotional wording must be updated to accurately reflect its establishment approximately 30 years ago as a celebration of the Victorian era, rather than implying an older, continuous tradition specific to the estate."

  **The One-Pager (For Committee Table):**

  **Heritage Trust "Tradition" Claim Assessment Procedure**

  1.  **Claim?** Does app claim "tradition"/antiquity? **NO:** Assess on community value (Officer/Committee). **YES:** Go to 2.
  2.  **Any Evidence?** Proof it happened *with meaning* (any era: docs, oral, photos)? **NO:** Reject (Claim unfounded). **YES:** Go to 3.
  3.  **What Kind of Practice?**
      *   **Formal/Invented Tradition:** Recent rules/revival presented as old? (Common for revivals)
      *   **Adaptive Custom:** Genuine old roots, evolved continuously? (Rare, needs evidence)
      *   **Routine/Functional:** Mainly practical, little ritual? (Not usually "tradition")
      *   **Unclear/Spots:** Evidence exists, but patchy/gaps.
  4.  **Significance & Honesty NOW?**
      *   Does it matter to the community *today* (beyond money)?
      *   Is the history presented honestly? (No made-up facts, acknowledge revivals/gaps)
      *   **YES to both:** Go to 5.
      *   **NO (Meaning):** Assess on community value (Officer/Committee).
      *   **NO (Honesty):** Reject (Misrepresentation).
  5.  **Map to Band (Evidence Description ONLY):**
      *   5: Unbroken Doc Practice (Rare - Custom)
      *   4: Strong Doc Continuity (Custom/Good Invented)
      *   **3: Hist. Basis & Modern Revival (Most Common)**
      *   2: Fragmented Evidence / Custom Possible
      *   1: No Continuity / New (Failed Gate 2 or 4b)
      *   **Bands 2-5 can be funded** if passed Gate 4. Band 1 only if valued as new (Step 1 NO).

  **Key Principles:**
  *   "Invented" isn't bad! It can have real meaning (Anderson).
  *   Silence (no records) doesn't = never happened. We note gaps.
  *   Oral history is valid evidence (record it!).
  *   **We fund cultural significance & integrity, not just age.**
  *   **Bands describe EVIDENCE, not WORTH.**
  *   **Rejection Wording:** "Evidence for the historical claim wasn't sufficient," **not** "Your tradition is fake."

  **Committee Role:** Ratify Officer recommendations, apply local knowledge for "Values Decisions" (Steps 1 & 4 exits). Focus on community benefit and honest presentation.
