  2. **Intensity of Stakes**: The week 10 activity is low-stakes. This is a limitation: the frustration might be mild compared to a constitutional referendum. But it's not fatal because the goal is to illustrate the mechanics.

  3. **Scale**: A class of 24 cannot exhibit the full complexity of a large electorate. But it can show the structural issues (like cycles or paradoxes) in microcosm. Not fatal.

  4. **Mandate**: The activity might produce a result that feels procedurally flawed, but it does not generate a mandate that the losing side accepts as settled. In fact, the losing side might feel the process was unfair. This is actually a strength for teaching: it shows that the legitimacy of a referendum depends on the process. But you will have to explain that in real life, even with these flaws, referendums are often treated as binding.

  ### Predictable Problems and Solutions

  1. **Strategic Voting**: Once students sense what is happening, they might vote strategically. For example, in Stage 1, they might vote insincerely to try to get a particular outcome. 
     - *Solution*: Emphasize that they should vote according to their true preferences. If you suspect strategic voting, note in the debrief that strategic voting is a common problem in real voting systems.

  2. **Gerrymandering Charges**: When you reveal the unequal subunits, students might cry gerrymandering. 
     - *Solution*: Welcome the charge! Say: "Yes, the subunit boundaries were arbitrary. In real life, how boundaries are drawn can affect the outcome. That's a critical issue for double majority requirements."

  3. **Timing Overruns**: Each vote might take longer than planned. 
     - *Solution*: Keep the votes simple. Use show of hands for some votes if necessary (but secret ballot is better for integrity). Cut the discussion short if needed.

  4. **Unexpected Preference Profiles**: If at any stage the expected paradox doesn't occur, use a hypothetical example in the debrief to illustrate. You can say: "In our vote, we didn't get a cycle, but here's how it could happen..." and draw a preference profile on the board.

  This activity is ambitious, but it addresses your goals. Good luck!
