  We are going to design a three-stage voting activity for a 90-minute tutorial on referendums. The goal is for students to experience three different ways in which voting systems can produce counterintuitive or unsatisfactory results, without initially revealing the underlying theoretical problems (like cycles, paradoxes, or double majority issues). The activity will culminate in a debrief that connects the three experiences and shows how they compound.

  ### Overview of the Three Stages

  1. **Stage 1: Sequential Voting on Options (Arrow-type problem, but without a cycle)**
     - We present four options for what to do in week 10 (student-led session, screening, extra reading, and a fourth option). The options are designed so that when voted on in a fixed sequence (using a series of pairwise votes), the winner is not the option that would beat every other in a head-to-head (i.e., it is not the Condorcet winner). The key is to have an option that is majority-preferred to the winner but loses because of the voting sequence.

  2. **Stage 2: Premise-by-Premise vs. Conclusion Voting (Doctrinal Paradox)**
     - We break a decision into three premises that together imply a conclusion. The premises are chosen so that each is individually acceptable to a majority, but the conclusion (which is the conjunction) is rejected by a majority. Alternatively, we can set it up so that the conclusion is accepted by a majority, but the premises are rejected by a majority. We'll aim for the former because it's more common.

  3. **Stage 3: Double Majority Requirement (Swiss-style)**
