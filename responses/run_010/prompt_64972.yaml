  Below is a complete, runnable 90-minute tutorial activity designed to meet your specifications. It forces students to confront three distinct aggregation problems through experiential learning, with genuine stakes (deciding Week 10's activity). The debrief explicitly connects the dots, showing how the failures compound.

  ---

  ### **Pre-Session Prep (Night Before)**
  1. **Materials**:
     - 24 index cards (for ballots)
     - 24 sticky notes (for subunit voting)
     - Whiteboard markers (2 colors)
     - A hidden facilitator cheat sheet (for you) with:
       - Fallback preference profile (if no cycle emerges)
       - Premise vote thresholds
       - Subunit breakdown

  2. **Subunit Sorting**:
     - **Pretext**: "To model regional constituencies in a national referendum, we'll group by your college's geographic quadrant (city center/north/south/west)."
     - **Actual Groups**: Assign based on **birth month** for unpredictability:
       - Subunit 1 (Small): Jan–Mar (5 students)  
       - Subunit 2 (Medium): Apr–Aug (8 students)  
       - Subunit 3 (Large): Sep–Dec (11 students)  
     - Write subunit assignments (1/2/3) on index cards to hand out at entry.

  3. **Option Set for Week 10 Activity** (write on whiteboard):  
     - **A**: Student-led session: "AI's impact on democracy"  
     - **B**: Screening: *Brexit: The Uncivil War* (2019)  
     - **C**: Extra reading: 1980 Swiss Jura secession case study  
     - **D**: Debate: "This house believes referendums undermine democracy"  

  4. **Premise Set** (write on whiteboard only when Stage 2 begins):  
     - **P1**: A majority of this class supports Option B.  
     - **P2**: A majority of this class is competent to judge Option B.  
     - **P3**: If a proposal has majority support and the majority is competent, it should be adopted.  
     - **Conclusion**: Therefore, Option B should be chosen for Week 10.  

  ---

  ### **Timeline & Script (90 Minutes Total)**  
  **Phase 0: Setup (5 min)**  
  - *As students enter*: Hand each an index card with their subunit number (1/2/3).  
  - *Opening script*:  
    > "Today we decide Week 10’s activity by referendum. The winner binds us. Options: A, B, C, D [point to board]. We’ll vote in three rounds with different rules. No discussion until debrief—this is about raw voting mechanics."  

  ---

  ### **Stage 1: Sequential Voting with Fixed Order (Arrow Problem) (25 min)**  
  - *Rules*:  
    - Vote 1: **A vs B** → Winner faces C  
    - Vote 2: **Winner vs C** → Winner faces D  
    - Vote 3: **Winner vs D** → Final winner  
  - *Ballot*: Index cards with "Vote 1: [A/B]", etc. Secret ballot, tally on whiteboard.  
  - *Fallback if no cycle*:  
    - If preferences are single-peaked and winner is Condorcet-consistent, trigger **Plan B**:  
      > "Let’s test if this winner is robust. All who prefer **B** over [winner], raise hands."  
      - If majority exists, say: "So a majority prefers B, but our sequence eliminated it early. The system overrode your preferences."  
  - *Handle the savvy student*:  
    - If a student spots manipulation early (e.g., "This order is rigged!"), respond:  
      > "The voting order *is* fixed. Whether that’s ‘fair’ is part of what we’re testing—hold that thought."  
    - If they predict vote-splitting, enlist them: "Help me tally votes to keep things smooth."  

  ---

  ### **Stage 2: Premise-by-Premise vs. Conclusion (Doctrinal Paradox) (20 min)**  
  - *Rules*:  
    - Vote **separately** on P1, P2, P3, and Conclusion (4 secret ballots).  
    - Use show of hands to count and record % on whiteboard.  
  - *Critical numbers* (adjust in real-time):  
    - **P1** (Support for B): Ensure >50% support (rig if needed: e.g., "If unsure, count as support").  
    - **P2** (Competence): Likely >80% (students assume peer competence).  
    - **P3** (Sufficiency): Set high bar—ask: "Should *any* competent majority get its way?" Expect ~60% support.  
    - **Conclusion** (Adopt B): Push for honesty. Expect <50% if premises feel abstract.  
  - *Guarantee divergence*:  
    - If premises all pass >50% but conclusion fails (<50%), paradox fires.  
    - If not, emphasize: "Even if not today, this *can* happen—where premises win but conclusion loses."  

  ---

  ### **Stage 3: Double Majority Requirement (Swiss Model) (20 min)**  
  - *Rules*:  
    - Re-vote on A/B/C/D (one option per voter).  
    - Winner must have:  
      - **(1) Popular majority**: >12 votes (50%+ of 24)  
      - **(2) Subunit majority**: Wins >2 subunits (each subunit’s majority determines its vote).  
  - *Process*:  
    - Tally popular vote first. If no majority, eliminate lowest.  
    - Then tally subunits (e.g., Subunit 1: 5 students → majority = 3+ votes).  
  - *Design for conflict*:  
    - Likely outcome: Option with popular majority (e.g., B) loses subunit vote because **Subunit 1 (5 students)** blocks it (e.g., 3/5 vote against).  
    - If no conflict, force it: "Subunit 1, your small size gives you veto power—use it if you oppose the leader."  

  ---

  ### **Debrief: Connecting the Three Failures (20 min)**  
  *(Reveal terminology only now)*  
  1. **Map each stage to its failure**:  
     - **Stage 1 (Sequential vote)**: "You saw the **agenda-setting problem**—the winner changed based on *order of votes*, not preferences. Option X lost because we didn’t vote on it at the right time."  
     - **Stage 2 (Premises)**: "This was the **doctrinal paradox**—you accepted premises *separately* but rejected the *conclusion* they implied. The vote fragmented your reasoning."  
     - **Stage 3 (Double majority)**: "The **minority veto problem**—Subunit 1, you had disproportionate power. A small group blocked a popular will."  

  2. **Show compounding effects**:  
     - "Notice how failures interact:  
       - Stage 1’s arbitrary sequencing **enables** Stage 3’s minority veto (e.g., a subunit opposes the ‘wrong’ winner).  
       - Stage 2’s fragmented logic **legitimizes** overriding majority will (e.g., ‘competence’ premises justify minority veto).  
     - Real referendums face all three: **manipulable agendas** + **fragmented mandates** + **structural biases**."  

  3. **Address fairness accusations**:  
     - When students call the process "unfair," pivot:  
       > "Exactly. Referendums don’t just ‘reveal’ the popular will—they *shape* it through design. Your frustration is the point: **no neutral voting system exists**."  

  4. **Contrast with idealism**:  
     - "Today, Arrow’s theorem wasn’t a slogan—you *felt* it. Defenders of direct democracy assume voters have coherent preferences. You experienced how rules *manufacture* outcomes."  

  ---

  ### **What the Activity CANNOT Do (Limitations to Address)**  
  1. **Preference Formation** (Fatal):  
     - Students’ votes lack campaign-driven intensity/shifts. **Explain**: "Real preferences are molded over months. Here, you voted cold—this misses how persuasion alters outcomes."  

  2. **Stakes/Intensity** (Limitation):  
     - Week 10’s low stakes won’t mirror constitutional angst. **Mitigate by**: Highlighting emotional cues (e.g., "Recall your frustration when Subunit 1 vetoed you—imagine that scaled up").  

  3. **Scale** (Limitation):  
     - 24 people can’t replicate mass-electorate dynamics. **Explain**: "We modeled *structural* flaws, not statistical ones (e.g., marginal seats)."  

  4. **Mandate Illusion** (Fatal):  
     - The activity produces procedural dissatisfaction but no "settled mandate." **Clarify**: "Real referendums claim legitimacy from ‘the people.’ You saw that legitimacy is manufactured—this is why losers rarely concede."  

  ---

  ### **Predictable Problems & Fixes**  
  - **Strategic Voting**:  
    - **Risk**: Students swap votes in Stage 3 once they smell bias.  
    - **Fix**: Warn early: "Vote your true preference—strategizing invalidates the experiment." If caught, note in debrief: "Like real voters, you gamed the system. But gaming *is* the system."  

  - **Gerrymandering Charges**:  
    - **Risk**: Subunit sorting provokes outrage (e.g., "Why is Subunit 1 so small?").  
    - **Fix**: Welcome it! "Yes, the subunits are arbitrary. Real boundaries *are* gerrymandered—your anger mirrors Swiss cantons or EU states."  

  - **Timing Overruns**:  
    - **Risk**: Premise votes or subunit tallying runs long.  
    - **Fix**: Use quick hand-counts; skip revotes if no majority in Stage 3. Sacrifice detail for momentum.  

  - **Savvy Student Spoiler**:  
    - **Risk**: Comparative politics student foresees vote-splitting.  
    - **Fix**: Isolate early: "You’ve seen this—help me by observing silently and leading Group 1 in Stage 3." Channel their insight into subunit strategy.  

  ---

  ### **Why This Works**  
  - **Three Unique Failures**: Students experience agenda manipulation (Stage 1), fragmented mandates (Stage 2), and minoritarian bias (Stage 3) as distinct frustrations before learning they are systemic.  
  - **Compounding Effect**: The debrief shows how the failures interact (e.g., Stage 1’s sequencing enables Stage 3’s veto), moving beyond "just another paradox."  
  - **Genuine Stakes**: Forcing a binding outcome (e.g., watching a Brexit film they oppose) makes dissatisfaction visceral, not academic.  

  Run this tight, lean into chaos, and let the students’ irritation fuel the debrief. The goal isn’t neatness—it’s making aggregation problems felt.
