answer: |-
  ## The Arithmetic of Suffering

  The inkwell trembled in Thomas Pelling’s hand, a tiny black sea threatening to breach its glass shores. Below, in the cramped justice room of Market Blanding, the air hung thick with pipe smoke and a sharper, uglier scent: communal disgust. Before Deputy Magistrate Croft, shifting uneasily in his high-backed chair, stood Jedediah Cobb, the wool-comber, and Philip Ames, the assistant schoolmaster. Their crime, read aloud by the town crier in a voice stripped of inflection, was an ‘unnatural act’ under a statute older than the oak beams overhead – a statute carrying the penalty of hanging.

  Thomas dipped his quill, not to record the charge, but to open his private ledger. Its pages were a forest of figures, ruled into seven precise columns: *Intensity, Duration, Certainty, Propinquity, Fecundity, Purity, Extent*. The London philosopher’s loose manuscript pages, tucked beneath the ledger, whispered their axioms: *Punishment justified only by mischief prevented. Disgust is prejudice, not reason. Four misapplications…*

  The Vicar, Mr. Thorne, cleared his throat. He wasn’t the prosecutor, but he stood as the town’s conscience. “Deputy Magistrate, these men… their proximity, their shared lodgings… it offends decency. It unsettles the parish. Young minds at the school are exposed to…”

  “To what, Vicar?” Thomas interrupted, surprising himself. Croft shot him a warning look. “Forgive me, sir. But the charge specifies no force, no minors involved, no theft, no fraud. What *mischief* is alleged?”

  Thorne’s eyes, usually kind, hardened. “The mischief, Mr. Pelling, is the corruption of morals, the erosion of trust within our small community. Alarm spreads, sir. Alarm is a palpable harm. When the natural order is flouted, fear takes root. That fear, that revulsion felt by every God-fearing man and woman here, is the mischief.”

  Thomas turned back to his ledger. *Mischief: Alarm (Pain of the Townsfolk).* He began scoring:

  *   **Intensity:** Moderate (Gossip, shunning, not outright panic). *Score: 4*
  *   **Duration:** Uncertain, but potentially lasting months or years if unchecked. *Score: 6 (Average)*
  *   **Certainty:** High – the feeling was demonstrably present. *Score: 8*
  *   **Propinquity:** Immediate – the offence occurred here, now. *Score: 10*
  *   **Fecundity:** High – fear breeds suspicion, potentially leading to further ostracization or violence. *Score: 8*
  *   **Purity:** Low – mixed with prejudice, moral outrage. *Score: 3*
  *   **Extent:** Large – perhaps 300 adults in the parish feel it. *Score: 300*
  *   **TOTAL PAIN (Alarm):** (4+6+8+10+8+3) * 300 = **39 * 300 = 11,700**

  A cold sweat pricked Thomas’s brow. Eleven thousand seven hundred units of pain. The sheer scale, the *Extent*, was staggering.

  He flipped the page. *Proposed Punishment: Execution (Pain of the Accused).*

  *   **Intensity:** Utmost Agony (Physical terror, despair). *Score: 10*
  *   **Duration:** Brief but excruciating (Minutes of hanging, days of dread). *Score: 6 (Weighted)*
  *   **Certainty:** Absolute. *Score: 10*
  *   **Propinquity:** Immediate upon sentencing. *Score: 10*
  *   **Fecundity:** High – grief for families, terror for others. *Score: 7*
  *   **Purity:** High – direct consequence. *Score: 9*
  *   **Extent:** Two men. *Score: 2*
  *   **TOTAL PAIN (Execution):** (10+6+10+10+7+9) * 2 = **52 * 2 = 104**

  *104 versus 11,700*. The arithmetic screamed: the punishment’s pain was a drop against the ocean of the town’s distress. It seemed to justify the gallows – prevent the greater misery. The philosopher’s fourth misapplication – *where the penalty costs more misery than the offence did* – didn’t apply. Here, the penalty seemed to *save* misery. Thomas felt sick. This couldn’t be right. Was revulsion truly equivalent to a broken limb, a stolen purse? Yet Thorne’s argument echoed: if you count relief, you must count alarm. Both were feelings, both were pains.

  Then, like a shaft of light through dirty glass, he remembered. *The community has already punished them.* He’d heard the whispers, seen the consequences. He started a new entry: *Extrajudicial Punishments (Pain of the Accused).*

  *   **Intensity:** Moderate-High (Shame, fear, material loss). *Score: 7*
  *   **Duration:** Ongoing since accusation (Three weeks). Likely indefinite. *Score: 8*
  *   **Certainty:** Absolute. *Score: 10*
  *   **Propinquity:** Immediate and continuous. *Score: 10*
  *   **Fecundity:** High – loss of livelihood leads to poverty, hunger, despair. *Score: 8*
  *   **Purity:** High – direct consequence of the accusation/community action. *Score: 8*
  *   **Extent:** Two men. *Score: 2*
  *   **TOTAL PAIN (Extrajudicial):** (7+8+10+10+8+8) * 2 = **51 * 2 = 102**

  *102 units already inflicted.* Now, adding the court’s punishment – execution (104) – created a *total* pain for Cobb and Ames of **206**. But what mischief would this *additional*, judicial punishment prevent? The alarm was already present. The shunning was already happening. The stone had already been thrown through Cobb’s window (Thomas added a quick entry: *Stone-throwing incident, Intensity 5, Duration 0 (momentary terror), Certainty 10, Propinquity 10, Fecundity 3 (increased fear), Purity 8, Extent 2. Total: 38* – folded into the extrajudicial total). What *new* alarm would hanging prevent that ostracism hadn't already triggered? The philosopher’s first misapplication: *where there's no mischief to prevent*. The hanging seemed… redundant. Cruelty piled upon cruelty.

  He presented his findings haltingly to Croft, avoiding the Vicar’s gaze. “Sir… the community has already exacted a severe toll. Work denied, provisions withheld, public scorn… amounting to significant pain. The *additional* pain of execution… what specific *future* mischief does it prevent that this existing punishment does not? If the aim is to quell the alarm… the alarm, sadly, is already manifest. Adding death seems… needless misery. The fourth case.”

  Croft, a practical man burdened by an office he never sought, rubbed his temples. “Needless? Mr. Pelling, the law is clear. The statute demands it. The town expects it.”

  Thorne stepped forward, his voice low but intense. “Mr. Pelling, your arithmetic is ingenious, but flawed. You score the *existing* alarm, but not its potential *growth*. You score the pain of the condemned, but not the *relief* of the hundreds now suffering that alarm if justice is seen to be done. If you refuse to count the town’s revulsion as harm, you have no business counting their potential relief as a good! You are arbitrating which feelings matter. Is the terror of the mob less real than the terror of the gallows? Is the parish’s collective peace of mind worth nothing?”

  Thomas flinched. Thorne wasn’t ranting; he was reasoning, forcing Thomas to confront the brutal symmetry. If he counted the town’s potential relief from the hanging (a *pleasure*), he *had* to count their current disgust (a *pain*). And the *Extent*…

  He looked at the ledger. *Pleasure of Relief (Townsfolk):*

  *   **Intensity:** Moderate (Restored sense of order, safety). *Score: 6*
  *   **Duration:** Uncertain, but potentially long-lasting. *Score: 7*
  *   **Certainty:** High if punishment carried out. *Score: 8*
  *   **Propinquity:** Immediate upon execution. *Score: 10*
  *   **Fecundity:** High – fosters trust, reinforces norms. *Score: 7*
  *   **Purity:** Moderate – mixed with grim satisfaction. *Score: 5*
  *   **Extent:** 300. *Score: 300*
  *   **TOTAL PLEASURE (Relief):** (6+7+8+10+7+5) * 300 = **43 * 300 = 12,900**

  *12,900 units of pleasure.* Set against the *additional* pain of execution for Cobb and Ames: **104**. The net gain was overwhelming: **12,796 units of happiness**.

  The numbers swam before Thomas’s eyes. The seventh column, *Extent*, wasn’t a saviour; it was a tyrant. It turned the many’s revulsion, however irrational, into an unassountable mountain of suffering that only the sacrifice of the few could alleviate. The arithmetic demanded the gallows. Justice, in this ledger, was a calculation of collective comfort purchased with specific, concentrated agony.

  He looked up at Cobb and Ames. Cobb stared at the floor, shoulders slumped under the rough wool of his best (only?) coat. Ames met Thomas’s gaze briefly; his eyes, behind smudged spectacles, held a terrifying clarity, a silent understanding of the machinery grinding towards them. They were already broken men, worth 102 units of pain, soon to be worth 206, a sum dwarfed by the town’s 11,700 units of distress and the promised 12,900 units of relief.

  Thomas closed the ledger. The vellum cover felt like stone. The ink, his own calculations, seemed to bleed.

  “Sir,” Thomas’s voice was a dry rasp, barely audible. He didn’t cite the ledger, the columns, the philosopher. He couldn’t. The arithmetic had spoken, and its verdict was monstrous. “The law… the statute… remains. The evidence… is before you.” He couldn’t bring himself to say *guilty*. He couldn’t advocate for death. He simply acknowledged the crushing weight of the law and the town’s demand.

  A heavy silence fell. Croft looked from Thorne’s stern face to the ashen features of the accused, then back to Thomas, whose own face was grey with the horror of comprehension. The arithmetic offered clarity, but it was the clarity of a surgeon calculating the necessary amputation.

  “Jedediah Cobb, Philip Ames,” Croft pronounced, his voice heavy. “The statute under which you are charged is ancient, its penalty severe. Yet… circumstances compel consideration.” He paused, choosing his words with uncharacteristic care. “Given… the disruption already visited upon you… and the… *nature* of the offence lacking aggravating features… the court commutes the sentence.” A collective gasp, quickly stifled, rippled through the room. Thorne’s jaw tightened. “Transportation. Fourteen years. To Botany Bay.”

  Relief warred with horror on Cobb’s face; Ames closed his eyes. Fourteen years of brutal exile, likely death by disease or despair, but not the noose. Not today.

  Thomas stared at the ledger. He hadn’t calculated *Transportation*. He didn’t need to. He knew its pain would be immense: Intensity 9 (brutality, hopelessness), Duration 14 (14 years!), Certainty 10... Extent 2. Easily over a thousand units. Still less than execution? Perhaps numerically. But far more than they’d already endured. A terrible compromise, bought by Croft’s pragmatism and Thomas’s mute, ledger-bound horror.

  The Vicar turned without a word and walked out, his back rigid. He hadn’t won his gallows, but the town’s disgust remained, now mingled with a sense of justice cheated.

  As the constables led Cobb and Ames away, Thomas opened the ledger again. His hand shook. Below the damning calculations, he wrote a single line, not in any column, just a stark statement on the vellum: *Cost: Philip Ames’s hope. Jedediah Cobb’s home. My certainty.* He didn’t total it. He couldn’t bear to see the figure. He simply blotted the words, the ink spreading like a bruise, a permanent stain on the pristine arithmetic of suffering. The numbers were flawless. The world they described was unbearable.
