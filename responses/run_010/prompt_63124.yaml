  Distinctions are crucial. Disposition vs. categorical base: can't reduce dispositions to categorical properties. Multi-track vs. single-track: some dispositions have multiple manifestations (solubility). Disposition vs. mere capacity: dispositions are specific (fragility) vs. general capacities (human abilities). Intrinsicness is debated—some dispositions are intrinsic, others extrinsic (like being flammable in oxygen). Conditional analysis might be problematic because of finks and masks.

