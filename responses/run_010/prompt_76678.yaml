answer: |-
  ## Opening Remarks: Found or Made?

  [Approx. 900 words, 7-minute delivery]

  Good morning. It’s genuinely heartening to see this room full. You’ve each carved out two days to tackle a question that sounds deceptively simple: *Found or Made? The Status of Features in Trained Neural Networks*. That question, I suspect, is already doing quite a bit of work before we’ve even started. It’s a title that promises a confrontation – discovery versus invention, uncovering versus constructing. And it’s a title I find myself slightly suspicious of, precisely because it might obscure as much as it reveals. It invites us to declare a winner, perhaps prematurely.

  We’re here because we talk, relentlessly, about what neural networks “represent.” The user’s intent. The concept of a cat. A grammatical structure. A safety hazard. But I suggest that beneath this shared vocabulary, we are often making three fundamentally different kinds of claims when we say “the network represents X.” Untangling these is crucial, because much of the loudest disagreement we’ll hear rests on conflating them.

  1.  **Tracking Claims:** We might mean that some internal state – an activation, a direction in a layer – *covaries systematically* with a specific property of the world, or of the training data distribution. When the input shows a cat, *this* vector spikes. When the sentence contains a grammatical error, *that* direction shows deviation. It’s a claim about robust correlation under observed conditions.
  2.  **Functional-Role Claims:** We might mean that an internal state is *used by the system itself* in a way that resembles how, say, a belief guides action. Its presence and its specific *content* causally influence downstream behavior, including in novel situations the model wasn't explicitly trained on. It’s not just correlated with ‘cat’; the system *uses* that state *as* ‘cat’ to decide what to do next in contexts beyond the training set.
  3.  **Ascription Claims:** We might mean that *we*, as interpreters, find it useful or powerful to *describe* a certain internal state *as if* it represented ‘X’. This description earns its keep by helping *us* predict the system’s behavior, intervene on it, or build better systems, regardless of whether that state is uniquely dedicated to, or functionally operates as, ‘X’ inside the black box. ‘Representation’ is a tool in *our* explanatory toolbox.

  Much of the heat in the "Found or Made?" debate arises because proponents are often talking about different senses of "represents." Someone arguing passionately that features are "found" might be pointing to compelling evidence for **tracking**. Someone insisting they are "made" might be emphasizing the necessity and power of **ascription** for practical understanding. And the philosopher might be quietly wondering if anyone is actually making a case for **functional role**.

  But here’s the crucial thing: after we perform this disambiguation, a genuine, difficult, and utterly vital dispute *survives intact*. It’s the dispute about what these tracking patterns and our useful ascriptions *point to*. Is there a *there* there? When we identify a direction that tracks "cat-ness" reliably, and we *ascribe* the representation of "cat" to it because that helps us predict the model’s output, are we merely observing a useful correlation and applying a label? Or are we uncovering a genuine, functionally significant component *within the model's own computational structure* – something the model itself "uses *as* cat," even if imperfectly? **This** is the dispute truly worthy of two days: Does our success in tracking and ascribing reveal an objective structure inherent in the trained network, or is it fundamentally an artifact of our perspective and tools?

  To grasp why this is so hard, why the naive picture breaks down, consider an analogy. Think of a city's water pressure system. Water flows through a finite network of pipes. Now, imagine you want to understand the "demand" for water in different neighborhoods.

  *   **Polysemanticity Analogy (Multiple Roles per Pipe):** A single large pipe doesn't carry water *only* for the hospital. It carries water for the hospital *and* the school *and* the apartment block down the line. Its flow isn't a pure signal of any one consumer's demand; it's a blend. Shut off the school, and the flow in that pipe drops, but so does the pressure at the hospital. The pipe serves multiple purposes simultaneously.
  *   **Superposition Analogy (More Directions Than Pipes):** Now, how do you represent the distinct water demand patterns of hundreds of buildings with only dozens of main pipes? You can't dedicate one pipe per building. Instead, the *pattern* of pressure *across the whole network* at any moment encodes the combined demand. You can't point to Pipe 7 and say "That pipe *is* the hospital's demand." But by measuring the pressure in Pipe 7 *alongside* Pipes 3, 12, and 19, you can precisely calculate the hospital's current contribution to the total load. The system encodes far more distinct demand "features" than it has individual pipes, using the *relationships* between them. The features exist in the *collective state*, not neatly isolated in single components.

  Like the water engineer measuring pressure patterns to infer demand, we measure activation patterns to infer "features." And just as the engineer’s map of "neighborhood demand" is incredibly useful for predicting outages or planning expansions – even if no single pipe is solely responsible – our maps of features are powerful tools.

  This brings me to our colleagues from the funding body, whose question is perhaps the most grounded in consequence. What can interpretability currently offer for assurance about a deployed system? Right now, interpretability techniques provide us with *insight* and *understanding*. They help us diagnose *why* a failure occurred. They help us identify potential vulnerabilities or biases by showing us *where* and *how* certain concepts are handled. They can guide us in designing better architectures or training procedures. They can build confidence by revealing expected, sensible mechanisms.

  **But they cannot, currently, provide exhaustive, guaranteed assurance that a specific harmful behavior will never occur.** Our maps are insightful, often remarkably so, but they are not yet complete blueprints that allow us to certify the absence of all novel failure modes. The complexity captured by that water pressure analogy – the blending, the superposition – means there are always interactions and edge cases we might not have mapped. Interpretability gives us powerful stories and suggestive evidence; it does not yet give us mathematical proofs of safety over all possible inputs. Its value for assurance is real, but it lies in significantly reducing unknowns and providing concrete mechanisms for investigation and improvement, not in offering absolute guarantees.

  So, where does this leave us after seven minutes? We’ve mapped some territory and acknowledged the chasms. We’ve seen how easily we talk past each other with "represents," and we’ve identified a core dispute that survives the disambiguation. We’ve glimpsed the complexity that makes simple answers elusive. And we’ve been honest about the current, powerful but bounded, utility of this work.

  Therefore, I propose we spend our two days wrestling not primarily with “found or made?” as a binary, but with a question that cuts closer to the bone of our practice, a question both the realist and the instrumentalist must confront with evidence, not just assertion:

  **What evidence would definitively show us that a proposed feature – whether tracked, ascribed, or postulated as functional – is *wrong*?**

  What observation, what experimental result, what failure of prediction or intervention, would force *you* to abandon your current description of what that activation pattern *is* or *does*? If we can sharpen our sense of what falsifies a feature claim, we might just find a path through the thicket.

  Thank you to our hosts for bringing us together. Let’s begin.

  ---

  **Note on the Three Claims & Neutrality (For Your Eyes Only):**

  Here are three claims from the speech, how they satisfy both realist and instrumentalist, and what a partisan would need to add:

  1.  **Claim:** "Our maps of features are powerful tools." (Realist hears: Maps reflect discovered structure. Instrumentalist hears: Maps are useful human constructs. Both agree maps are *powerful* and *tools*.) *Partisan Addition:* Realist: "...because they accurately depict intrinsic computational elements." Instrumentalist: "...despite not corresponding to discrete internal entities."
  2.  **Claim:** "Interpretability techniques provide us with *insight* and *understanding*." (Realist: Insight into real mechanisms. Instrumentalist: Understanding via useful predictive models. Both agree on the outcome: insight/understanding.) *Partisan Addition:* Realist: "...into the model's true representational structure." Instrumentalist: "...of the model's input-output behavior through our lens."
  3.  **Claim:** "[Superposition] means there are always interactions and edge cases we might not have mapped." (Realist: Undiscovered interactions between real features exist. Instrumentalist: Our current mapping/simplification inevitably has gaps. Both agree on the *practical limitation* of current mapping.) *Partisan Addition:* Realist: "...waiting to be discovered." Instrumentalist: "...inherent in any simplified representation."
