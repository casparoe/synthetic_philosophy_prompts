prompt: |-
  I cover science and ideas for a general-interest outlet — neuroscience, psychiatry, AI, the usual beat. Lately I keep writing hedged sentences like "the brain activity that accompanies the decision" because I cant figure out what I actually believe about whether mental states do anything. So here are my gut verdicts on a pile of cases. I want to know if there's a single principle of causation behind them, what it says about cases I haven't listed, and which of my verdicts I have to give up.

  1. My belief that there's beer in the fridge plus my wanting a beer caused me to walk to the kitchen. Uncontroversial, both are causes.

  2. The neural event realizing that belief-desire pair also caused the walk. And I don't want to say the walk got overdetermined by two independent causes the way a victim does when two snipers both hit him at the same instant. It just doesn't feel like the sniper case. One of these is doing something the other isn't.

  3. But when I try to say what, I get pulled in opposite directions. Pigeon case: you train a bird to peck at anything scarlet, then show it a crimson panel and it pecks. I want to say the panel's being scarlet caused the peck and its being crimson didn't — crimson is too specific, the bird would have pecked at lots of non-crimson things.

  4. Mirror image, and this is the one that breaks my brain. A guy sprints for a bus because he believes it's the 8:47 and that it's the last one. Describe the physical side the way a neuroscientist actually does when pointing at a blob on a scan: "coarse motor-preparatory pattern N." Here the mental property is the more specific one, and I still want to say the mental property is the real cause and the coarse neural description is leaving something out. So in 3 specificity disqualifies a candidate cause and in 4 specificity is what qualifies it. Tell me how one principle says both, or tell me which case to abandon.

  5. Counterfactuals help and then don't. If I hadn't believed the bus was the last one I wouldn't have sprinted — true, and that seems to license the belief as a cause. But if the firing rate in motor cortex had been a couple percent different, I'd still have sprinted — so the counterfactual fails for the physical realizer, and I absolutely do not want to say the neurons weren't causes. My body moved because my brain did stuff.

  6. The string test — my own coinage, I don't think it's in anybody's paper. X causes Y only if you could wiggle X while holding everything X is made of fixed and watch Y change. My intuition: if you can't wiggle the belief without wiggling the neurons, the belief isn't an extra cause, it's just the neurons under a different name. Except 5 bothers me, since on the string test the belief flunks and I still want it to pass.

  7. Phantom realizer — a hypothetical, not something I'm reporting. Suppose a cortical activation reliably shows up when people say they've decided to press a button, but silencing it leaves the behavior unchanged: a decoy, doing no work, like the shadow a puppet throws on the wall while the strings do everything. Verdict, held strongly: the shadow never caused anything, and if a reported intention is like the shadow then it never caused anything either.

  8. Now the pair I can't reconcile with 7. Deep brain stimulation patients sometimes describe movements the device produces as accompanied by a vivid intention of their own — an intention that, in that instance, plainly produced nothing. I don't want to call that intention a shadow. I want to say it's a real mental event that got bypassed, and that with normal wiring the same kind of event would have produced the movement. But the "would have" is doing all the causal work there, which is exactly what I refused to let it do in 7. Same structure, opposite verdicts. I know that's a problem.

  9. Group level, which is the beat I'm actually on. A company believes its market is shrinking and pivots. I want to say the company's belief caused the pivot, even though no single employee's brain state was that belief and every physical event involved was in someone's head or in a memo. If I say that, I have to explain what stops the neuron-level story of the pivot from being the real cause. Or I say nothing is excluded and both are causes — which is case 2 again, which I said I didn't like.

  10. Machine level, because my editor will ask. An LLM's internal state that we'd naturally describe as "it thinks the user is asking about refunds" makes a difference to the next token it emits, and we can sometimes change that state by editing the prompt while leaving the weights alone. Verdict: that state causes the output. This one feels easier than the human cases, which makes me suspect my human-case verdicts are contaminated by something that isn't about causation at all.

  So: is there a principle — one, or a small number of rival candidates — that delivers these? State each candidate precisely, say which of my cases motivated each clause, and give me its verdicts on cases I haven't listed. Specifically: a depression that costs someone their job versus the neural correlate of that depression; the pigeon case except crimson is what the bird was actually trained on; and whether anything can cause an outcome that would have happened anyway for a different reason.

  Then be honest about the failures. Which of 1–10 does your best principle have to overturn, and which can only be saved by adding a clause so expensive that the principle stops being worth holding? If 3 and 4 can't both survive, I'd rather hear that flatly than get an epicycle for each. Tell me whether the string test in 6 is salvageable with a fix or is just a bad principle I should stop reaching for. And say plainly whether 9 is the same problem as the mind-body case rather than a cute extra — that changes how I'd write about any of this.
reasoning: |-
  Okay, let's tackle this step by step. The user is a science writer struggling with causation in mental states versus neural states. They've listed 10 cases where their intuitions about what causes what conflict, and they want a unifying principle or to know which intuitions to drop.

  First, I need to understand each case. Cases 1 and 2 show mental states and neural states both causing behavior without overdetermination. Case 3 (pigeon) suggests only the general property (scarlet) causes pecking, not the specific (crimson). But case 4 flips this: the specific mental state (belief about bus) causes sprinting, while the coarse neural pattern doesn't. That's a direct conflict!

  Counterfactuals in case 5 help for mental states but fail for neural details, yet neurons clearly cause movement. The string test in case 6 makes beliefs fail if they depend on neurons, but the user wants beliefs to count. Case 7 (phantom realizer) says decoy neural activity isn't causal, but case 8 (DBS intention) says bypassed mental states are still real causes in normal cases. Another conflict.

  Case 9 (company belief) wants group-level causation despite no single brain state matching it, but worries about excluding neuron-level stories. Case 10 (LLM) feels easier—internal states cause outputs even when prompted differently, no angst.

  The user's core tension: mental causation seems real in some contexts (beliefs causing actions) but not others (specific color shades not causing pecks). They need a framework that explains when higher-level properties count as causes versus when they're just "shadows."

  Looking at existing philosophy: interventionist causation (Woodward) fits many cases. Causes are variables where interventions change outcomes. But multiple realization causes problems—if you intervene on mental states while fixing neural realizers, nothing changes. Yet in practice, we don't fix neural details when attributing mental causes. So maybe causation is context-dependent.

  For the pigeon (case 3), scarlet is the right causal level because interventions changing scarlet (to blue) change pecking, while crimson-to-ruby might not. In the bus case (4), the specific belief is causal because changing it (e.g., "not last bus") stops sprinting, while tweaking neural firing rates (within bounds) doesn't. This resolves the specificity flip.

  But case 5's counterfactual issue remains: neural realizers are still causes because coarse-grained interventions (e.g., lesioning motor cortex) would change behavior. The string test fails for multiply realized properties because it requires fixing all realizers, which isn't how we usually intervene. So the test needs refinement—allow "wiggling" at the same level of abstraction.

  Case 7 vs. 8: Phantom realizers (7) aren't causes because interventions (silencing) do nothing. But bypassed intentions in DBS (8) are potential causes—in normal contexts, intervening on them changes actions. Their causal status depends on background conditions.

  For the company (case 9), group-level properties are causal because intervening on the shared belief (via memo) changes actions, while neuron-level interventions might not capture the collective effect. No overdetermination because levels aren't independent—the belief supervenes on the system.

  New cases: Depression causing job loss—the mental state is causal at the personal level, while neural correlates implement it. If crimson was trained (modified pigeon), it becomes the relevant cause—interventions changing crimson stop pecking. For preemption (outcome would happen anyway), causation requires actual difference-making, not just capacity.

  Failures: The string test (case 6) must be rejected—it's too strict for higher-level properties. Case 7 and 8 can coexist if causation is relative to normal conditions. But the user must accept that causation isn't monolithic—it depends on explanatory context and grain of analysis.

  In essence: Causation is difference-making under intervention, but the choice of variables and allowable interventions depends on our questions. Mental states cause actions when varying them (while holding fixed other mental states, not neural details) changes outcomes. The conflict between 3 and 4 dissolves under this view—specificity matters only relative to invariance under intervention.

  This preserves most intuitions except the string test. The user might gripe about "context-dependence," but that's how science works—we pick causal models that serve our purposes. For writing, they can say mental causation is real but contextually defined, avoiding reductionist angst without overclaiming.
answer: |-
  Your intuitions reveal a deep tension in causal reasoning across levels of description, but they can be unified under a **difference-making interventionist account** of causation (drawing on Woodward, Yablo, and List & Pettit). The core principle: 

  **X is a cause of Y relative to a causal model if, holding fixed background variables at their actual values, there exists an intervention on X that changes the probability or value of Y. The "right" causal level depends on which variables are invariant under relevant interventions.**

  This handles your cases by focusing on *which interventions matter for explanation*, not metaphysical absolutes. Below: the principle applied, verdicts on your cases, new cases, and frank failures.

  ---

  ### **The Principle & Its Motivation**
  1. **Interventionist Difference-Making**:  
     - X causes Y iff intervening to change X (while holding fixed other causes at appropriate granularity) changes Y.  
     - *Motivated by*: Your counterfactual struggles (case 5), pigeon specificity (3), and LLM case (10).  

  2. **Granularity Invariance**:  
     - Higher-level properties (beliefs, corporate decisions) are causes when they are *invariant*—they hold across changes in lower-level realizers.  
     - *Motivated by*: Mental causation without overdetermination (2, 4), group-level causality (9).  

  3. **Contextual Background Conditions**:  
     - What counts as "held fixed" depends on explanatory context (e.g., neural details vs. mental states).  
     - *Motivated by*: Phantom realizer (7) vs. bypassed intention (8), and your aversion to epicycles.  

  ---

  ### **Verdicts on Your Cases**
  1. **✅ Correct**: Belief/desire causes walking. *Why*: Intervening on belief (e.g., make you think no beer) changes behavior, holding fixed other mental states.  
  2. **✅ Correct**: Neural event causes walk, but no overdetermination. *Why*: Belief is *realized by* the neural state; they aren’t independent. Intervening on neurons disrupts the belief, so it’s one causal chain.  
  3. **✅ Correct**: Scarlet causes pecking, crimson does not. *Why*: Interventions changing scarlet (to blue) stop pecking; changing crimson to ruby doesn’t (if bird still sees scarlet). Specificity disqualifies because crimson isn’t invariant.  
  4. **✅ Correct**: Specific belief causes sprinting, coarse neural pattern does not. *Why*: Intervening on belief (e.g., "it’s not the last bus") stops sprinting. Intervening on the coarse neural pattern (e.g., tweak firing rates) may not change behavior if it realizes the same belief. Specificity qualifies here because the belief is invariant.  
  5. **✅ Resolved**: Belief passes counterfactual, neurons "fail" but still cause. *Why*: Coarse neural descriptions (like "firing rate") are often multiply realizable. Fine-grained neural interventions *would* change behavior, but the counterfactual you tested was too vague.  
  6. **❌ String test is misguided**: You must abandon it. *Why*: It assumes causal exclusivity and ignores multilevel invariance. Beliefs can’t be "wiggled" without neurons, but they *can* be invariant across neural changes (e.g., same belief via different pathways).  
  7. **✅ Correct**: Phantom realizer isn’t a cause. *Why*: Silencing it changes nothing—no difference-making.  
  8. **✅ Correct**: Bypassed intention is still a cause-type. *Why*: In normal contexts (holding wiring fixed), interventions on intentions change behavior. The "would have" is valid because it references invariant properties.  
  9. **✅ Correct**: Corporate belief causes pivot. *Why*: Intervening on the group belief (e.g., via a correcting memo) changes the decision, holding fixed individual psychologies. Neurons aren’t excluded—they’re the realizing mechanism—but the corporate level is invariant.  
  10. **✅ Correct**: LLM state causes output. *Why*: Prompt edits intervene on the state without changing weights, altering outputs.  

  ---

  ### **Verdicts on New Cases**
  - **Depression costing job vs. neural correlate**:  
    - ✅ Depression causes job loss. *Why*: Clinical interventions (therapy, drugs targeting depression) change job outcomes.  
    - ✅ Neural correlate causes it too. *Why*: Direct neural interventions (e.g., DBS) can alter behavior. No overdetermination—depression *is* the neural state at a higher level.  
  - **Pigeon trained on crimson**:  
    - ✅ Crimson causes pecking. *Why*: Intervention changing crimson (to a non-scarlet hue) stops pecking. Specificity now qualifies it.  
  - **Outcome that would’ve happened anyway**:  
    - ❌ Not a cause. *Why*: No difference-making. If Y occurs regardless of X (e.g., backup sniper fires), X isn’t a cause. Preemption requires actual dependence.  

  ---

  ### **Failures and Trade-offs**
  - **You must abandon the string test (case 6)**. It’s irredeemable—it conflates realization with causal exclusion. Replace it with interventionist invariance.  
  - **Case 9 is NOT the same as mind-body**. Group causation is *emergent*: corporate beliefs supervene on but aren’t reducible to individual states. Neurons realize mental states; individuals + structures realize corporate states. Different explanatory games.  
  - **Tension between 3 and 4 is resolved**: Specificity isn’t absolute—it depends on which properties are *invariant under intervention*. Scarlet is invariant for the pigeon; the bus belief is invariant for the sprinter.  
  - **Costly clause for case 8**: To save "bypassed intentions" as causal, you must accept that causal powers are *dispositional* and context-dependent. This is worth it—it reflects how we reason in psychology and ethics.  
  - **Biggest casualty**: **The illusion of metaphysical simplicity**. You can’t have a single "God’s eye" causal story. Causation is model-relative. If you demand a context-free answer, cases 7 and 8 *cannot* coexist—but in practice, we shift contexts seamlessly.  

  ---

  ### **How to Write About This**
  - **Lead with interventionism**: "Mental states cause behavior when changing them changes outcomes—whether by therapy, conversation, or neural tweaks."  
  - **Ditch hedges for specificity**: Say "the decision caused the action," then clarify: "This means interventions altering the decision would alter the action, as seen in [examples]."  
  - **For groups/LLMs**: "Causes exist at multiple levels. Corporate decisions or AI states cause outcomes because manipulating them—via memos or prompts—changes results, even though they rely on lower-level mechanisms."  
  - **Concede the mess**: "Causation isn’t a chain but a web of dependencies, and which thread we pull depends on what we want to understand."  

  This framework saves 9/10 intuitions (only the string test dies) and resolves your contradictions by making causation *explanatory* rather than metaphysical. The cost is accepting that "what caused it?" always implies "in which model?"—but that’s how science works.
