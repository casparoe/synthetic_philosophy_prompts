  Below is my credence assessment for claim (V), decomposed as requested. I adopt a Bayesian approach, weighting historical data limitations, normative choices, and conceptual expansions. All probabilities are derived from interdisciplinary evidence (historical studies, sociology, criminology) and account for your continuity-of-usage consideration.  

  ### **Component Breakdown**  
  1. **Narrow physical measures halved**  
     *Credence: 0.65*  
     Homicide rates show robust declines (e.g., Eisner's global study: >75% drop post-1800). War deaths per capita decreased (Lacina et al. 2005), and state executions plummeted (e.g., UK abolished death penalty for routine crimes by 1800). However, pre-1800 data is fragmentary (e.g., no systematic records for Africa/Asia), risking survivor bias. I discount heavily for this but still see probable decline.  

  2. **Per-capita normalisation appropriate**  
     *Credence: 0.55*  
     Per-capita aligns with individual risk exposure (e.g., Pinker 2011), but absolute counts matter for species-level impact (e.g., WWII killed 2.5% of humanity vs. 15% in An Lushan revolt). Population growth (1B → 8B) could mask progress if using totals. Given moral ambiguity—individual safety vs. aggregate suffering—I marginally favour per-capita but assign near-even odds.  

  3. **Expanded categories improved in step**  
     *Credence: 0.25*  
     Modern additions (domestic violence, structural harm) likely deteriorated or offset gains:  
     - **Domestic/psychological**: Historical underreporting obscures trends, but WHO estimates 27% of women experience violence today; industrialisation may have intensified stress (Scheff 2011).  
     - **Animal suffering**: Industrial farming (99% of land animals slaughtered annually) dwarfs pre-1800 artisanal practices.  
     - **Structural harm**: While famine deaths fell (Roser 2019), inequality-driven deprivation (e.g., 800M undernourished today) compounds harm. Net deterioration probable.  

  4. **Decline across all operationalisations**  
     *Credence: 0.15*  
     Your continuity-of-usage argument is pivotal: fixed-period operationalisations (e.g., homicide) likely show decline, but expansive modern definitions (e.g., "structural violence") do not. For instance, applying today’s standards retroactively would count famines as violence—yet 1800s mortality was higher. Only 15% chance every defensible view concurs.  

