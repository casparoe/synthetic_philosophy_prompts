prompt: |-
  I'm the political director of a public employees union, about 30,000 members — county clerks, 911 dispatchers, road crew, courthouse security. Every cycle I write an endorsement recommendation for our executive board, and every cycle it turns into the same fight. One faction says that if we endorse anyone we own everything they do afterwards, so we should sit elections out entirely and just lobby whoever wins. The other faction says sitting them out is how you get the worse candidate elected, and then you get nothing from them either. Honestly both of them have a point and I can't adjudicate between them, mostly because I don't have any framework. I took one political theory class in college and I remember there being stuff about whether a single vote can even matter, voting as a duty, voting as a statement of who you are, and the whole lesser evil problem — but as far as I can tell none of that was written with a 30,000-person organization's endorsement in mind, and an endorsement is obviously not the same thing as one vote, so I don't know which parts carry over.

  Can you build me an actual procedure I can run on a race? The questions in order, what counts as a good enough answer to each one, where it lands (endorse / no endorsement / endorse but publish a criticism), and where it has to just stop and hand the thing back to the board because it's a values call rather than a facts call. Be upfront about which pieces of the voting ethics stuff genuinely transfer to an organization and which ones quietly break, and about where the procedure will give a bad answer or get gamed by whoever writes the memo — which is usually me, so I want to know my own failure modes.

  Constraints worth knowing: state rules mean we file 30 days out to make the coalition sample ballot, so "wait and see how it develops" is never actually available. Endorsement takes 60% of the board. A yes commits about $15k and a weekend of member canvassing. Nobody on staff has philosophy training and I need something a board member can follow from a two page handout.

  Then run it on three real-ish races:

  1. Safe seat, our incumbent is fine but a first-time challenger is way better on our core issue (we're fighting to keep 911 dispatch in-house instead of contracting it out) and has never held anything.
  2. Open seat. Candidate A is strong for us on paper but there's a credible, well-sourced story that he took money from a private prison contractor. Candidate B voted against collective bargaining rights twice but is clean, competent, and probably winnable on everything else.
  3. A race where both candidates will vote to privatize dispatch no matter what we do, and the only real difference is that one of them is a decent person and the other is a liar. This is the one where I suspect the procedure is going to tell me to do something half the board will hate, and I want to see how it handles that and what I'm supposed to say when someone asks "so you're telling us we just let them win."

  Finally, tell me what the procedure flat out cannot decide, so I stop pretending it can.
reasoning: |-
  Okay, the user is a political director for a public employees union with 30,000 members. They're struggling with internal conflicts over endorsing political candidates. One faction thinks endorsements make the union responsible for everything the candidate does later, so they should just lobby whoever wins. The other faction believes sitting out leads to worse outcomes. The user needs a clear, procedural framework to make endorsement decisions that can be applied consistently, even by board members without philosophy training.

  First, I need to unpack the user's explicit and implicit needs. They want a step-by-step procedure because their current process is causing repeated fights. The framework must handle different race scenarios and clarify when a decision is values-based versus factual. They also need transparency on where the procedure might fail or be gamed.

  The user mentioned political theory concepts like the impact of a single vote, voting as duty, etc. But endorsements aren't individual votes; they involve resources ($15k, canvassing) and represent 30k members. So the key is to adapt those theories to organizational stakes. For example, lesser evil voting might apply, but the union's leverage and accountability are higher than an individual's.

  Constraints are crucial: 30-day filing deadline, 60% board approval, no time to wait. The procedure must fit a two-page handout. So simplicity is essential—no complex philosophy, just clear yes/no questions.

  Now, building the procedure. The core issues are candidate viability, alignment with union priorities, and risk assessment. Break it into stages: viability first (since backing a loser wastes resources), then policy alignment, then risk/reward. If a candidate isn't viable, stop early. Use thresholds for endorsement levels, like "good enough" on core issues versus dealbreakers.

  Where do philosophical concepts transfer or break? Lesser evil applies: sometimes endorsing a flawed candidate prevents worse outcomes. But the union "owning" a candidate's actions is a real risk—mitigate by setting clear expectations publicly. Voting as identity doesn't transfer; endorsements are strategic, not symbolic. The vote efficacy question morphs into resource efficacy: will this spend actually change the outcome?

  Failure modes: Confirmation bias in the memo writer (user). Solution: require evidence for each claim, use neutral scoring. Values calls (like tolerating a corrupt candidate) must be flagged for board input. Also, the procedure can't resolve pure moral dilemmas—e.g., endorsing a liar vs. a privatizer—so it must admit when it's stuck.

  Testing with the three races:
  1. Safe seat, incumbent fine, challenger better on core issue but inexperienced. Procedure likely says endorse challenger—viable, better alignment, low risk. But board might fear losing incumbent goodwill. Need to stress long-term gains.
  2. Open seat. Candidate A strong but corruption rumors; Candidate B weaker but clean. If rumors verified, viability drops. If not, endorsement with criticism possible. Board must weigh corruption tolerance—values call.
  3. Both candidates support privatization. Only difference is character. Here, the procedure likely says no endorsement: no policy gain, resources wasted. But board might want to oppose the liar. Must explain: endorsement is transactional, not moral statement.

  Finally, the procedure can't decide when trade-offs involve core values (e.g., integrity vs. policy gains) or predict long-term betrayals. It also can't fix unviable candidates. Being transparent about these limits prevents overconfidence.

  User's deeper needs: Reduce internal conflict, justify decisions objectively, protect their role from bias accusations, and conserve resources. The framework serves both strategy and unity by depersonalizing choices.
answer: |-
  Here's a procedural framework designed for your union's endorsement decisions. It adapts political theory to **organizational stakes** (30k members, $15k+ resources, reputational risk) and flags where individual voting ethics **transfer** or **break**. The procedure follows a decision tree with clear thresholds, stops at values calls, and includes built-in failure mode warnings.

  ---

  ### **Endorsement Decision Procedure**  
  *(2-Page Handout Version for Board Members)*

  **CORE PRINCIPLE:**  
  Endorsements are **transactional** (not symbolic). We trade resources for measurable policy gains. "Lesser evil" logic applies *only* if evil is materially reduced. If no gain exists, no transaction occurs.

  **DECISION TREE: ASK IN ORDER**  
  *(Stop if any question fails; 60% board vote required to override a "No")*

  1. **IS THE RACE VIABLE?**  
     - *Question:* Can our endorsement plausibly impact the outcome?  
     - *Evidence Needed:* Polling (within 15 pts), opponent funding, incumbent vulnerability, or our member density in district ≥20%.  
     - **FAIL if:** Race is non-competitive (e.g., incumbent +30 poll lead).  
     - *Transfer from theory:* "Vote efficacy" becomes "Resource efficacy." *Breaks:* Unlike a single vote, our endorsement has measurable cost/ROI.  
     - **→ If NO:** **No Endorsement**. Save resources.  
     - **→ If YES:** Proceed to Q2.  

  2. **IS AT LEAST ONE CANDIDATE "GOOD ENOUGH" ON CORE ISSUES?**  
     - *Question:* Will they commit *in writing* to support ≥2 of our top 3 current priorities (e.g., keep 911 dispatch public)?  
     - *Evidence Needed:* Signed policy questionnaire, voting record, or public pledge.  
     - **FAIL if:** No candidate meets threshold.  
     - *Transfer:* "Lesser evil" applies *only here*—must still clear "good enough" bar. *Breaks:* We can't endorse "identity" or "duty"—only interests.  
     - **→ If NO:** **No Endorsement**. No ROI.  
     - **→ If YES:** Proceed to Q3.  

  3. **IS THE BEST CANDIDATE "LOW RISK"?**  
     - *Question:* Is there credible evidence they will betray core commitments or damage our reputation?  
     - *Evidence Needed:* Voting record vs. promises, corruption scandals (verified by 2 sources), or anti-union lobbying.  
     - **Scoring:**  
       - **Low Risk:** Clean record, alignment on ≥80% of issues. → **ENDORSE**  
       - **Medium Risk:** Minor flaws (e.g., missed votes) but winnable. → **ENDORSE WITH PUBLIC CRITICISM** (e.g., "We endorse X despite Y").  
       - **High Risk:** Betrayal on core issues, corruption, or toxic association (e.g., prison contractor ties). → **No Endorsement** (or endorse opponent if viable).  
     - *Transfer:* "We own their actions" is valid—risk assessment mitigates this. *Breaks:* Personal character matters less than *reputational spillover*.  
     - **→ Board Input Required** if scoring disputed.  

  **FAILURE MODES & SAFEGUARDS:**  
  - 🚩 **Your Bias as Memo Writer:** Require *sourced evidence* for all claims. If you say "credible corruption story," attach documents.  
  - 🚩 **"Wait and See" Trap:** If evidence is incomplete (e.g., rumor unverified), default to **No Endorsement**.  
  - 🚩 **Values Calls:** Flag them explicitly (e.g., "Tolerating corruption for policy gains is a BOARD VALUES DECISION").  

  ---

  ### **Procedure Applied to Your Cases**  
  *(Assumes all races are "viable" per Q1)*

  **CASE 1: Safe Seat Incumbent vs. Strong Challenger**  
  - Q2: Challenger is "good enough" (better on core issue). Incumbent is "good enough."  
  - Q3:  
    - Incumbent: **Low Risk** (proven record).  
    - Challenger: **Medium Risk** (no record but no red flags).  
  - **→ Endorse Challenger with Criticism:**  
    *"While Rep. Smith has served adequately, Doe commits to stronger 911 dispatch protections. We note Doe's lack of experience but believe the policy gain justifies support."*  
  - *Why it works:* Prioritizes core issue. Board fight defused by acknowledging risk.  

  **CASE 2: Open Seat – Policy Champ vs. Clean Competitor**  
  - Q2: Candidate A (policy champ) is "good enough." Candidate B (competitor) is *not* "good enough" (voted against bargaining rights—a core issue).  
  - Q3: Candidate A has **High Risk** (verified prison contractor money). Candidate B has **Low Risk**.  
  - **→ No Endorsement:**  
    - A fails Q3 (betrayal risk). B fails Q2 (not "good enough").  
  - *Board Values Call Required:* If board overrides, argue: *"Endorsing A signals we tolerate corruption; endorsing B abandons bargaining rights. No safe transaction exists."*  

  **CASE 3: Both Candidates Will Privatize Dispatch**  
  - Q2: **FAIL.** Neither is "good enough" on core issues (both support privatization).  
  - **→ No Endorsement:** No policy gain possible. Resources wasted.  
  - *Answering "You’re letting them win!":*  
    *"Endorsing either candidate spends $15k to achieve nothing. We save resources to fight privatization post-election or back challengers next cycle. A protest endorsement has no ROI."*  

  ---

  ### **What the Procedure CANNOT Decide**  
  1. **Moral Trade-Offs:**  
     - *Example:* "Should we endorse a corrupt candidate who guarantees wage increases?" → Requires board vote on **values** (integrity vs. material gain).  
  2. **Long-Term Betrayals:**  
     - *Example:* A candidate *could* break promises later. → Procedure assesses *risk*, not certainty. Mitigate with written agreements.  
  3. **Symbolic Gestures:**  
     - *Example:* "Endorse the decent liar to oppose fascism." → Not allowed; no *measurable policy gain*.  
  4. **Unviable Races:**  
     - If polling says we can’t shift the outcome, no endorsement—even if we love the candidate.  

  **Key Takeaway:** This turns endless philosophy debates into **evidence-based transactions**. You provide facts; the board votes on values when flagged. It protects you from bias claims by requiring documentation and admitting uncertainty.  

  > *Final note: Use the "Public Criticism" option sparingly—it only works if members trust your honesty. If credibility is low, default to Endorse or No Endorsement.*
