prompt: |-
  I'm writing a novel where two friends come apart over politics, and the whole thing lives or dies on whether any given line of dialogue reads as arguing in bad faith or just reads as a person being a person. So I've been keeping a list of moves with my gut verdicts on them, and I'd like to know what principle is generating the verdicts, if there is one.

  1. Quoting the other person exactly, word for word, but dropping the next sentence, the one that would've changed the meaning. Not fine.
  2. Restating their sloppy position more sharply and more defensibly than they managed, then attacking that. Also not fine — which bugs me, since on the face of it that's a service to the argument.
  3. Asking for a definition, politely, six or seven times running. Not fine.
  4. Conceding the point completely and warmly, then changing the subject. Fine, I think. I keep flip flopping on this one.
  5. Saying something true about the other's side while knowing perfectly well how it'll be heard. Fine.
  6. Getting caught out and immediately, painfully correcting yourself. I want this to retroactively make the earlier move not-bad-faith — call it the goodwill ledger, I know that isn't a real term — but I'm not sure it should rescue move 3 as easily as it rescues move 1.

  Can anything get all six, or five out of six? Mostly I want to know whether 1 and 2 are seperable by something other than my say-so, and what your principle does with the case I can't call: a character who sincerely believes every word he's saying, and is also privately relieved that the argument lets him out of lending his brother the money. And if the simpler version of the principle costs me one of these verdicts, tell me which one and make the case for giving it up.
reasoning: |-
  Hmm, the user is writing a novel about political polarization between friends, and they're struggling with how to portray dialogue that feels authentic versus bad-faith arguing. They've listed six specific rhetorical moves with their gut reactions, and want to understand what principle unifies these judgments. 

  First, I notice the core tension here is about verisimilitude in fiction - they need dialogue that serves both character authenticity and narrative function. The political rift is just the vehicle for exploring how relationships fracture. What they're really probing is whether there's an objective framework for "bad faith" that holds across contexts, or if it's purely situational.

  Their list reveals three patterns:
  1. Intentional distortion (move 1: quote-mining, move 3: definitional badgering)
  2. Strategic framing (move 2: steelmanning-as-weapon, move 5: malicious truth-telling)
  3. Disengagement tactics (move 4: hollow concession, move 6: retroactive correction)

  The brother/money subplot is particularly sharp - it shows they understand that bad faith isn't always conscious. That scenario exposes how self-deception layers atop ulterior motives. I should emphasize that fictional characters need mixed motives to feel human.

  For the verdicts: Moves 1-3 fail because they sabotage understanding. Even "sharpening sloppy positions" (move 2) becomes toxic when used to avoid engaging the actual person. Whereas move 5 works because it preserves truth while weaponizing context - very human. Move 4 is indeed fine as disengagement isn't inherently dishonest.

  The goodwill ledger concept is astute. Retroactive correction (move 6) should rescue move 1 (misquotation) because it reveals underlying good intent, but not move 3 (definition-trolling) because the repetition itself is the injury. 

  They're right to doubt a unified principle - bad faith exists on spectrums of intent, effect, and self-awareness. For their novel, the key is making the reader feel the emotional cost of each exchange. The brother example proves they already get this: sometimes the "principle" is just the character's palpable relief about the money shining through the political sparring.
answer: |-
  Your gut verdicts are remarkably consistent—they're tracking **whether the speaker prioritizes "scoring" over understanding**. Here's the unifying principle:

  **Bad faith occurs when a move sabotages the possibility of mutual understanding, either by distorting the other's position or refusing to engage with it authentically.** Good faith requires maintaining the "possibility space" for genuine resolution, even if unlikely.

  Now, applying this to your list:

  1.  **Selective Quotation (Not Fine):** Actively distorts meaning. It's not just omission; it's weaponizing their words *against* their intended meaning. Sabotages understanding by creating a false version of the other.
  2.  **"Sharpening" their Position (Not Fine):** While *seemingly* helpful, it replaces *their* actual, messy position with *your* stronger (often strawman-adjacent) version. You're not engaging *them*, you're engaging a hypothetical competent opponent. It refuses to meet them where they are.
  3.  **Definition Badgering (Not Fine):** This is weaponizing pedantry to stall, frustrate, and avoid engaging with the *substance* of their point. It prioritizes trapping them in semantics over understanding the core argument. The repetition exposes its obstructive intent.
  4.  **Warm Concession + Subject Change (Fine):** This prioritizes the *relationship* or emotional state over winning *this specific point*. It signals "I value *us* more than dominating this topic right now." It doesn't distort their position or sabotage future understanding; it simply disengages constructively (if avoiding the core conflict).
  5.  **Truthful but Loaded Statement (Fine):** This is authentic, if provocative. The speaker *is* engaging with the reality of the other side, even if framing it antagonistically. The listener *could* engage with the truth of the statement ("Yes, some do feel that way, but here's why..."). The possibility space for understanding remains open, however charged.
  6.  **Painful Self-Correction (Rescues selectively):** This actively *restores* the possibility of understanding. Its power depends on what it corrects:
      *   **Rescues Move 1:** Correcting a misquote/misrepresentation directly addresses the distortion. "Wait, I cut you off, you *did* say X right after, that changes it."
      *   **Does NOT Rescue Move 3:** Correcting a *fact* used *during* the badgering ("Actually, the dictionary *does* list that meaning, sorry") doesn't undo the *obstructive intent* of asking 6 times. The damage was the tactic itself, not necessarily the specific definition sought. The goodwill comes from admitting a specific factual error, not from retroactively making the badgering sincere.

  **Addressing Your Specific Questions:**

  *   **Can anything get all six?** No. Moves 1-3 fundamentally violate the core principle by distorting or obstructing understanding. Move 4 is a valid disengagement, Move 5 is authentic (if hostile) engagement, Move 6 is repair.
  *   **Separating Move 1 & 2:** The core difference is **agency/preservation**:
      *   **Move 1 (Quote Mining):** Actively *changes* the meaning of their *own words*. It's a direct fabrication.
      *   **Move 2 ("Sharpening"):** *Replaces* their position with one you find easier to attack. You discard their actual view for a fiction *you* built. It's destruction by replacement, not direct alteration. Both sabotage understanding, but via different mechanisms (alteration vs. substitution).
  *   **The Brother/Money Dilemma:** This is **good faith arguing with ulterior motive**. The principle holds! The *argument itself* can be sincere ("every word he's saying"). He believes his political points. The "bad faith" isn't in the *dialogue moves*, it's in the *overall context* – he's using the *existence* of the argument (which he happens to sincerely believe in) as an *excuse* for an unrelated, selfish act (avoiding loan). The dialogue can be authentic Move 5 territory, while his *relief* reveals a deeper character flaw. The reader sees the *instrumentalization* of the sincere argument.
  *   **Cost of Simplicity?** If forced to sacrifice one verdict for simplicity, **Move 4 (Concession + Subject Change)** is the most debatable. A stricter principle focusing *only* on moves *within* the argument could deem this "bad faith" *for the specific topic* (avoiding resolution). You'd lose the nuance that prioritizing relationship *can* be constructive disengagement. **Case for giving it up:** A purely debate-focused lens sees this as refusing to engage the point to its conclusion, a subtle "win" by escape. It avoids resolution, leaving the conflict fundamentally unaddressed. However, your instinct ("Fine") is likely better for nuanced fiction – it reflects real human conflict-avoidance that isn't necessarily malicious *within the argument itself*.

  **The Novelist's Takeaway:** Your gut is tracking **narrative integrity**. Bad-faith moves feel cheap or manipulative *to the reader* because they break the potential for authentic character interaction and growth. The brother/money example works because the *sincerity* of the political argument makes the *ulterior motive* more complex and human, not less. Focus on whether the move, *in the moment*, serves the character's desire to "win" at the cost of connection, or reflects a genuine (if flawed) attempt to engage or disengage. Move 6 works when it shows the character *choosing* connection/accuracy over winning. Move 3 fails because the repetition exposes winning as the *only* goal.
