  For structure: Act one establishes her efficient routine in Barren Creek through concrete details - the dusty office, the "good enough" number as a physical presence. I'll show her skipping Old Man Hemlock's request, which later proves disastrous for him. Act two shifts to Green Vale district where corporate proposals constantly raise her threshold until she's paralyzed. Meanwhile, her neighbor clerk's optimization method, while slower, remains functional.

  The ending logline must encapsulate the entire story in one sentence, highlighting the adaptive aspiration's role in both success and failure. I'll ensure no philosophers or economists are named, and let the narrative itself convey the insight about environment-relative "good enough."
answer: |-
  The dust tasted like rust on Marta’s tongue. It seeped through the warped wooden shutters of the Barren Creek Water Allocation Office, coating the stacks of requests piled on her splintered desk. Each file was a plea, a gamble, a desperate bid for lifeblood in a district perpetually parched. Marta’s job was simple: read them in the order they arrived, and grant the first one that cleared the number in her head.

  The number wasn’t written down. It lived behind her eyes, a shimmering line dividing *enough* from *not enough*. Yield-per-litre. How much food, how much profit, would each precious drop coax from the cracked earth? Today, the number hummed at **0.42** – a solid figure, honed by seasons of thin harvests and thinner margins. It felt tangible, a knot of certainty in her gut.

  She opened the first file. Old Man Hemlock: sorghum on the western bluffs. Dusty arithmetic predicted 0.38. *Too low*. File closed. Next: the Cooperatives’ shared plot. Tomatoes under shade netting. 0.41. *Close, but… no*. A prickle of unease, quickly smoothed. The procedure was the procedure. First-that-clears. She couldn’t go back. Hemlock’s dry fields flickered in her mind, dismissed. Next.

  The pile seemed endless. 0.39 (alfalfa, questionable soil). 0.35 (experimental cacti, unlikely). 0.40 (barley, shallow wells). Each rejection felt like adding another layer of grit to the air. Her knuckles whitened on the next file. *Clear it. Just clear it.* The tension was a low ache between her shoulder blades.

  Then: File #17. The Patel micro-farm. Hydroponic greens in a repurposed shipping container. Calculated yield: **0.43**. A fraction over the line. Relief washed over Marta, cool and sudden, washing the dust from her mouth. *Enough*. She stamped the approval form with a satisfying *thwack*, the sound echoing in the small office. Done. Efficient. Water would flow to Patels’ container tomorrow. The rest of the pile, including Hemlock’s sorghum and all its 0.38 inadequacy, was pushed aside for the seasonal archive. A faint scent of ozone, like distant rain, seemed to linger after the stamp came down. The knot in her gut loosened, and the number behind her eyes shimmered, almost imperceptibly brighter. **0.42** felt… comfortable. Achievable. Maybe even a touch *low* for such a tidy solution? The thought was fleeting, unexamined, like the taste of clean water after dust.

  * * *

  Five years later, the dust in Green Vale was different. Finer, paler, smelling less of desperation and more of money. Marta’s office was air-conditioned, the desk polished steel. The requests arrived not in dusty folders, but in sleek binders smelling of expensive paper and ambition. Deep aquifers promised abundance, but the lawyers and corporate agronomists demanded precision.

  Her first day, the knot in her gut pulsed at **0.45**. Barren Creek’s successes had quietly nudged it upwards, season after easy season of finding that *enough* point swiftly. She opened Binder One: ‘Verdant Horizons – High-Density Orchards (Citrus)’. Yield projection: **0.52**. Impressive. Far above her Barren Creek numbers. It cleared **0.45** effortlessly. Relief, familiar and sweet. Stamp. *Thwack*. Done before lunch. The number behind her eyes, satisfied by the ease, hummed contentedly. It felt… *solid*. But perhaps a touch *generous*? A barely perceptible shift upwards. **0.46** settled.

  Next day: ‘Golden Acre Agribusiness – Genetically Modified Staples’. Yield: **0.51**. Still comfortably above **0.46**. Stamp. *Thwack*. The number shimmered, adjusting to the new altitude. **0.47**. Why settle for *just* enough when *more* enough was readily available?

  By the third week, the shimmer was constant. **0.48**… **0.49**… Each approval was swift, efficient. The binders gleamed under the fluorescent lights. ‘AquaCrop Solutions – Aeroponic Berries’. Yield: **0.50**. Exactly met the **0.50** now humming behind her eyes. She hesitated, a microsecond. *Exactly*. Was it *enough*? It met the threshold. But the threshold itself felt taut, expectant. It had tasted **0.52** just days ago. **0.50** felt… adequate. Barely. She stamped it. *Thwack*. The knot tightened. The number, dissatisfied with mere sufficiency after recent feasts, twitched upwards. **0.51**.

  The binders kept coming. ‘OmniGrow – Vertical Farms’. Yield: **0.50**. Below **0.51**. *Too low*. File closed. Next: ‘TerraFirma Enterprises – Drought-Resistant Grains’. Yield: **0.49**. *Too low*. Marta blinked. She hadn’t said ‘no’ this often in years. The rejections piled up. **0.50** (again), **0.495**, **0.502** – agonizingly close, but the line was **0.51** now, rigid and high.

  Her inbox overflowed. The sleek binders formed a dam on her steel desk. Whispers started in the polished corridors outside her door. "Lenton’s stuck again," they’d say, referring to the clerk in the next district who took weeks, modeling aquifer drawdown and market prices, but *always* allocated. Marta, the model of efficiency, was paralyzed.

  She opened binder after binder. Yield: 0.505 (Rejected). Yield: 0.499 (Rejected). Yield: 0.509 (Rejected). The number in her head was **0.52** now, a cold, hard peak scaled unintentionally during weeks of easy approvals. Nothing reached it. Nothing *could* reach it consistently in this district of high, but not stratospheric, returns. Her stomach was a clenched fist. The taste of dust was back, but mixed with the sterile tang of the air conditioning and the sourness of anxiety. She *knew*, intellectually, that any of these proposals would be better than nothing. That water *should* flow. But her procedure was ironclad: first-that-clears. And nothing cleared the **0.52** that recent, relentless luck had stranded her with. She kept reading, waiting for the impossible figure to appear, while outside, sprinkler systems sat dry, and legal teams drafted injunctions. The efficient machine was jammed by its own, silently moving gauge.

  She passed over a proposal for community gardens – yield a modest but solid **0.48**. It would have fed families, greened communal spaces. But it landed on her desk when the number was **0.50**, still climbing. It never stood a chance. She couldn’t go back. The procedure forbade it. That file was buried under newer, equally inadequate requests.

  One afternoon, a notification popped up on her screen: a priority alert from the Provincial Oversight Board. Water rationing imminent in Green Vale District due to "administrative backlog." Marta stared at the words. The knot in her gut was a stone. The number behind her eyes, **0.52**, felt less like a measure and more like a wall. Through the thin partition wall, she heard Clerk Lenton next door, his voice a low murmur discussing aquifer models with an engineer. Slow, deliberate, functioning. She looked at the towering stack of binders, each containing viable, unwatered hope, and tasted only dust.

  Logline: A water clerk's brilliantly efficient satisficing rule, fueled by an aspiration level that drifts with recent luck, becomes an engine of drought when promoted from scarcity to abundance, trapping her in a search for a "good enough" that her own success has rendered impossible.
