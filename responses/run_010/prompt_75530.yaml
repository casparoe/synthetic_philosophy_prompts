  The story needs two acts: in the poor district, this method makes her efficient; in the rich district, it causes paralysis because her threshold keeps ratcheting up beyond what's offered. Key elements include making the threshold feel physical, showing one specific passed-over request in act one that would have helped someone, and avoiding explicit explanations or morals. The story should end with a "Logline:" summary.

  I need to create vivid sensory details to convey the drifting threshold physically - perhaps through the taste of dust, the weight of files, or bodily sensations. For act one, I'll include a poignant request from a small farmer that gets skipped and would have saved their crop, showing how the procedure's rigidity has real consequences even when it generally works.

