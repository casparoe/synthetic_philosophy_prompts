prompt: |-
  My AP Psych teacher spent all of last week on the digger wasp thing, and I still can't stop thinking about it. The story she told: the wasp stings her prey so it's paralyzed but still alive, drags it to the burrow, leaves it lying at the entrance, goes inside alone to check that everything's clear, then comes back out and drags it in. If you slide the prey a few inches while she's inside, she comes out, finds it, drags it back to the entrance, and instead of just grabbing it and going in, she leaves it there and does the whole inspection routine again — and she'll keep doing that, round after round, even if you move it every single time. She says Dennett likes this example because it's supposed to be the thing we should actually be scared of, not "are my actions caused by prior events" but "am I running routines I can't step out of," and that the version of free will worth wanting is basically the ability to not be that wasp. And when she said that I thought, ok, that's not philosophy, that's just fighting games, that's literally the thing I think about four hours a day.

  I've been playing for like four years, mostly Street Fighter with some Tekken, I know my frame data and I main a character whose whole gameplan is oki. So I want you to restate the sphexishness argument in the vocabulary I actually have — wakeup options, option selects, mixups, being plus or minus on block, getting downloaded, whiff punishing, autopilot, labbing stuff in training mode, the gap between a CPU that just runs a script and a person who adjusts. My version is: the wasp's routine is an option select that only covers the situations the matchup actually contains, and dragging the prey is her wakeup default, and moving it is a situation that isn't anywhere in her option list so the script just fires again; and being free in the sense worth wanting means having a real neutral and being able to download back instead of getting read. Take that mapping as far as it honestly goes — I want both the compatibilist claim *and* the "but she couldn't have done otherwise, so how is that freedom" objection in fighting-game terms, not just the wasp half.

  Then give me the residue report and please don't be nice about my analogy, I want the actual damage list: which claims translate cleanly, which ones you had to bend to make them fit, and which ones can't be said in my vocabulary at all even badly. Three I'm specifically worried about — first, whether translating it as "the character is deterministic but the player is the one choosing" secretly assumes the exact thing the debate is supposed to be deciding, since that split is basically the whole question. Second, whether "uncaused" has any counterpart in a fighting game at all, because in a game everything being determined by frames and inputs is just what a game *is*, so maybe my vocabulary can only ever compare one player's flexibility to another's and can never even state what the incompatibilist is denying. Third, whether "so lab better defaults and you won't be on autopilot" answers the regress or just moves it up one level, since the labbing routine is itself a habit that could be run sphexishly. End with your verdict on whether "it's just fighting games" is basically right or whether I'm missing something load-bearing.

  Start with the bottom line in your very first sentence — the one thing that most clearly doesn't survive the translation — and then give me the rest of the reasoning after that. No preamble, and don't restate my question back to me.
