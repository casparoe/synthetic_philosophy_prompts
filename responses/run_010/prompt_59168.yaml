answer: |-
  ## Proposal: Normalization Loops: The Hidden Structure of Interpersonal Utility Comparisons

  **Project Title:** Beyond Metaphysics: Index Number Theory and the Normalization Problem in Interpersonal Comparisons

  **Principal Investigator:** [Your Name/Title]
  **Duration:** 6 Months (Teaching Relief Semester)
  **Submission to:** Faculty Research Committee

  **1. Research Question & Core Problem:**  
  How does the necessity of *normalization* – the selection of fixed anchors (zero points and units) for well-being scales – fundamentally structure the disagreement surrounding interpersonal utility comparisons, and what can be learned by treating this problem analogously to index number normalization in economics and temporal normalization within an individual life?

  The dominant debate frames interpersonal comparisons as a problem of *epistemic access* or *metaphysical possibility*: can we ever know or meaningfully compare subjective states across individuals? This framing, focusing on the uniqueness of utility representations (e.g., ordinal vs. cardinal, affine uniqueness), obscures a more tractable yet equally fundamental issue: **the normalization loop**. Even given cardinal utility data reflecting risk attitudes, willingness-to-pay, self-reports, or psychophysical thresholds, we face an inescapable choice about where to place the zero (e.g., death, subsistence, "life not worth living") and how to define the unit (e.g., anchored to risk aversion at a specific point, a just-noticeable difference, a dollar equivalent). Crucially, **any criterion proposed to justify a specific normalization choice must itself be stated in units that *presuppose* a normalization.** This creates a logical loop that cannot be broken on purely neutral, pre-normalized grounds. The core hypothesis is that much apparent disagreement (e.g., Harsanyi vs. Sen) masks underlying disagreement about where to place these anchors, disguised as disagreement about measurability itself.

  **2. Why Existing Positions Fail to Resolve the Issue:**
  *   **Harsanyi Aggregation:** Requires *interpersonally comparable* cardinal utilities, implicitly assuming a shared zero and unit are identifiable. However, the aggregation theorem itself is silent on *how* this comparability is achieved – it presupposes the normalization problem is solved. Harsanyi often appeals to risk attitudes (vNM utilities), but these only yield scales unique up to affine transformations; selecting a *specific* affine transformation (choosing zero and unit) remains arbitrary within the vNM framework itself. His approach papers over the normalization step.
  *   **Sen's Partial Comparability:** Recognizes the difficulty of full comparability but frames it primarily as a problem of *information scarcity* or *indeterminacy*. While Sen introduces sets of admissible transformations, the *criteria* for defining the limits of this set (e.g., how much interpersonal variation in scale is "reasonable") implicitly involve judgments that depend on a background normalization. Partial comparability addresses the *consequence* of the normalization problem (indeterminacy) without diagnosing its *source* (the need to choose anchors without a neutral criterion).
  *   **Common Shortfall:** Both approaches treat normalization as a secondary, technical step once the "real" problem of measurement is solved, or they absorb the normalization choice into their axioms without explicit acknowledgment. Neither confronts the circularity inherent in justifying normalization choices.

  **3. Methodological Approach & Work Plan (6 Months):**
  This project employs conceptual analysis grounded in economic theory (index numbers) and practical reasoning (intrapersonal comparisons) to reframe the problem.

  *   **Month 1: Deep Dive into Index Number Theory:** Systematically review the economic literature on price indices (Laspeyres, Paasche, Fisher, Tornqvist) and the normalization/weighting problem. Formalize the parallels: how choosing a base period or basket for a price index is analogous to choosing a zero/unit for utility. Analyze how economists handle the inherent arbitrariness and justify choices based on purpose, consistency axioms, or practical considerations.
  *   **Month 2: Mapping the Normalization Landscape:** Catalog potential anchors for utility scales (zero: death, subsistence, neutral point; unit: risk attitude at reference wealth, WTP for benchmark good, JND thresholds, scale anchors in surveys). Analyze the ethical and practical implications of each choice (e.g., a "death" zero vs. a "subsistence" zero profoundly impacts poverty/inequality measures).
  *   **Month 3: Diagnosing the Loop:** Formalize the "normalization loop" argument. Demonstrate how proposed justifications for specific anchors (e.g., "use risk attitudes" begs the unit question; "use WTP" requires a baseline wealth and assumes cardinality; "use self-reported neutrality" relies on subjective interpretation of the anchor) inevitably presuppose the very scales they aim to fix. Generate clear examples showing how the same underlying data yields opposite distributive prescriptions under different normalizations.
  *   **Month 4: The Intrapersonal Analogy:** Develop the argument that cross-temporal utility comparisons (e.g., "Was grad school worth it?", "Was the surgery beneficial?") involve *identical* normalization problems (choosing a baseline state/zero, defining units of change). Argue that the widespread acceptance and practical manageability of these comparisons suggests the interpersonal problem is not uniquely metaphysical, but rather requires explicit acknowledgment and management of normalization choices, not their denial or concealment.
  *   **Month 5: Reframing the Debate:** Synthesize insights from Months 1-4. Propose a new framework for understanding interpersonal utility debates: disagreements are primarily about *which normalization is ethically/pragmatically appropriate* given a specific context or purpose, not about the fundamental impossibility of comparison per se. Explore what "managing" normalization might look like (e.g., sensitivity analysis, context-dependent anchors, analogies to index number axiomatic approaches).
  *   **Month 6: Drafting & Integration:** Compose the core argument into a journal article manuscript. Explicitly address the "technical costume" worry (see Significance/Failure). Refine the distinction between the normalization problem and the measurement problem.

  **4. Why This Approach? Addressing Alternatives:**
  *   **Empirical/Psychophysical Approaches:** While crucial for *measuring* preferences, they only provide data *within* a specific representation. They do not solve the problem of *which* affine transformation of the measured scales (i.e., which normalization) is appropriate for interpersonal *comparison* and aggregation. Measuring more precisely doesn't break the loop.
  *   **Adopting One Cardinal Theory by Fiat:** This simply hides the normalization choice within the axioms of the chosen theory (e.g., assuming vNM utilities *are* interpersonally comparable with a specific zero/unit). It avoids rather than confronts the core arbitrariness and its ethical implications.
  *   **Retreat into Partial Comparability:** This accepts indeterminacy but doesn't explain its *source* as stemming from normalization. It treats the symptom (indeterminacy) without diagnosing the cause (the need for and difficulty of choosing anchors). Our approach seeks to explain *why* the set of admissible transformations exists.
  *   **Unique Value:** This project uniquely leverages the rich economic tradition of index number theory and the intuitive plausibility of intrapersonal comparisons to isolate and analyze the normalization step, revealing it as the central, structuring challenge distinct from measurement epistemology.

  **5. Significance, Success, and Failure:**
  *   **Significance:** Successfully reframes a central debate in welfare economics and social choice theory. Provides a clearer diagnostic tool for understanding the roots of disagreement. Connects philosophical debates to established economic methodology (index numbers). Offers a potentially more honest and manageable approach to interpersonal comparisons by acknowledging the ethical dimension of normalization.
  *   **What Counts as a Result:** A rigorously argued, publishable paper demonstrating: 1) the existence and structure of the normalization loop, 2) the inadequacy of existing approaches to address it, 3) the validity and utility of the index number analogy, 4) the force of the intrapersonal analogy, and 5) a coherent framework for understanding disagreements as normalization choices. This constitutes significant conceptual progress.
  *   **What Counts as Failure (The Core Worry):**
      *   **The "Technical Costume" Outcome:** If the analysis conclusively shows that *all* resolutions of the normalization loop *necessarily* involve an irreducible, non-technical ethical choice (e.g., "subsistence *should* be the zero," "risk aversion at median wealth *should* define the unit"), and that economic index theory offers no neutral escape because price weights are observable while well-being anchors are normative, then the project merely provides a more precise vocabulary for an old ethical debate without resolving it. *This is a real risk and would be a form of failure regarding the goal of offering a new, more tractable path forward.*
      *   **Insufficient Novelty:** If the argument ultimately reduces to a well-articulated skepticism about comparability, failing to provide the positive reframing via index numbers/intrapersonal analogy.
      *   **Incomplete Analysis:** Failure to convincingly demonstrate the parallel with index numbers or to adequately distinguish the normalization problem from the measurement problem.
  *   **Honest Assessment of Timeline:** Six months is sufficient to develop the core argument, conduct the necessary conceptual analysis, and produce a draft paper. **However, it is tight.** The most likely casualty if time runs short would be fully fleshing out the "Month 5: Reframing the Debate" section, particularly exploring concrete strategies for *managing* normalization (beyond just diagnosing it). If needed, this positive proposal could be scaled back to a more preliminary sketch, focusing the paper primarily on the diagnosis, the loop, and the analogies. The core conceptual work (Months 1-4) is essential and achievable within six months of dedicated research time.

  **Conclusion:**
  This project challenges the dominant metaphysical framing of interpersonal utility comparisons by revealing the normalization loop as the core structural problem. By drawing on the sophisticated understanding of normalization in economic index theory and leveraging the intuitive acceptance of normalization in intrapersonal comparisons, it aims to reframe the debate in more tractable terms. While confronting the risk that this merely dresses an ethical dilemma in technical clothing, the potential payoff is a clearer, more honest, and more productive understanding of one of the foundational problems in welfare economics and social philosophy. Six months of dedicated research time is requested to fully develop and articulate this argument.
