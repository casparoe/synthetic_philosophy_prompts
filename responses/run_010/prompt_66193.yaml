  Okay, let me start by unpacking the user's query. They've been running a graduate reading group on pragmatics, and there's a recurring argument between neo-Griceans and relevance theorists. Both sides use the same data but interpret it differently, leading to a stalemate. The user's hypothesis is that the two camps might be answering different questions—one about linguistic meaning and the other about cognitive processing. They want to know if this is a substantive or verbal disagreement, or perhaps a case of two questions under one heading.

  First, I need to recall the core commitments of each theory. Neo-Griceans like Levinson rely on default heuristics triggered by linguistic forms. For example, the Q-heuristic explains why "some" implies "not all" without context. Relevance Theory (RT), following Sperber and Wilson, rejects defaults entirely. They argue that all inferences are context-driven, based on the principle of relevance, where the hearer seeks optimal cognitive effects for minimal effort.

  The user mentions examples like "some," "empty," and "warm." Both theories explain these but through different mechanisms. Neo-Griceans see them as default implicatures, while RT treats them as the most accessible context-based inference. The key point is whether inferences are triggered by form alone. For neo-Griceans, yes, prior to context. For RT, no—context is always involved from the start.

  The user's hypothesis makes sense here. Neo-Griceans focus on what the linguistic system encodes—generalized implicatures as part of semantic competence. RT is concerned with the cognitive processes of utterance interpretation in real time. So they're addressing different aspects: linguistic meaning vs. processing mechanisms.

  But is there a substantive crux? The user points to whether pragmatic inferences are triggered by form alone. If that's the case, then the theories are incompatible. Experiments haven't resolved this, possibly due to methodological issues. For instance, measuring processing times might show default heuristics at work, but RT counters that accessibility isn't the same as default.

  The sharpest test case could be something where context is minimal but not absent. Like the "some" inference in neutral contexts. If processing is faster even without context, that might support defaults. But RT argues that minimal context still exists, so it's about accessibility. Another test is cancellability: both agree implicatures can be canceled, but neo-Griceans see it as overriding a default, while RT sees it as a different inference path.

  Progress might involve clarifying the questions each framework answers. Neo-Griceans explain regularity in inferences, while RT models real-time processing. The debate continues because both use "implicature" but mean different things. If the user frames the seminar around these distinct goals, students can see the complementarity.

  However, the user wonders if the debate should be dropped. If the disagreement is about different research questions, then both frameworks are valid within their domains. The risk is when one oversteps. For example, if neo-Griceans claim defaults are psychologically real without processing evidence, or if RT denies any linguistic-level generalizations.

  A point of failure could be evidence showing that some inferences are truly pre-contextual. If experiments can isolate form-triggered inferences, that challenges RT. Conversely, if all inferences show context-dependence, it challenges neo-Gricean defaults. But designing such experiments is tricky because context is always present to some degree.

  Confidence in the diagnosis is high for the division of labor, but the substantive crux about form-triggered inferences is harder to resolve. The user should present both theories with their respective strengths and limitations, encouraging students to explore the boundaries of each framework.
answer: |-
  Your diagnosis is perceptive: **this is primarily a case of two distinct questions under one heading ("implicature"), wrapped in substantial verbal disagreement over key terms ("default," "triggered"), with a narrow but genuine substantive crux at its core.** Progress requires disentangling the questions, clarifying terminology, and designing experiments targeting the crux.

  ### Diagnosis Breakdown
  1.  **Distinct Core Questions:**
      *   **Neo-Griceans (e.g., Levinson, Horn):** Primarily ask **"What systematic patterns of meaning must we posit as part of linguistic competence to explain the *regularity* and *conventionality* of generalized inferences?"** Their goal is a theory of *linguistic meaning in context*, focusing on predictable, defeasible patterns linked to form (e.g., "some" +> "not all"). The heuristics are posited as *structural properties of the linguistic system itself*, explaining *why* these inferences are so consistently available and cancellable. "Default" means *generated by the system absent specific blocking conditions*.
      *   **Relevance Theorists (RT; Sperber & Wilson):** Primarily ask **"What cognitive procedures must hearers employ in *real-time comprehension* to infer the speaker's intended meaning?"** Their goal is a theory of *cognitive processing*. "Relevance" is a cognitive principle governing online inference. "Default" in RT means *pre-compiled, context-free inference*, which they explicitly deny exists. Inferences arise purely from context-driven mutual adjustment of explicit content, contextual assumptions, and cognitive effects, seeking optimal relevance. Speed in typical cases ("some" +> "not all") reflects *accessibility* due to frequent association, not a default rule.

  2.  **Verbal Disagreement:** The term "implicature" is used by both, but its nature differs:
      *   Neo-Griceans treat generalized implicatures as *part of what is said* in a broad sense – a level of utterance-type meaning (what is *standardly* communicated by that form).
      *   RT treats *all* implicatures (even "generalized" ones) as *inferred*, context-dependent *assumptions* contributing to cognitive effects, distinct from explicature. "Generalized" only means *frequently occurring*.
      *   "Default" is the key battleground term. Neo-Griceans see it as *system-triggered*; RT hears *pre-compiled* or *context-free*, which they reject. RT's "fastest route" is *not* the neo-Gricean "default"; it's a processing consequence of accessibility.

  3.  **Substantive Core Crux:** Despite differing primary questions, there *is* genuine incompatibility on one point:
      *   **Is any pragmatic inference *triggered solely by the linguistic form itself*, prior to and independently of the activation of *specific contextual assumptions* relevant to the speaker's intended meaning?**
          *   Neo-Griceans: **Yes.** The Q-heuristic (inference from a weaker form to the negation of a stronger alternative) is *activated by the form* (e.g., hearing "some" triggers consideration of "all" and its negation) *before* full context integrates it. Context can block or reinforce.
          *   RT: **No.** All inference is driven by the search for relevance. Hearing "some" activates various encyclopedic entries (including about scales) *in a context*. The inference "not all" arises *only* if it yields adequate cognitive effects *in this specific context* with minimal processing effort. Form influences accessibility but *does not trigger* a specific inference independently of relevance computation.

  ### Sharpest Test Case: "Scalar Inferences in Minimally Supportive Contexts"
  *   **Data:** "John has some of the files."
  *   **Phenomenon:** The inference "John does not have all the files" (scalar implicature).
  *   **Why it's sharp:**
      *   Both sides agree this inference is (a) frequent, (b) cancellable ("...in fact, he has all of them"), (c) feels effortless in neutral contexts.
      *   It directly probes the crux: Does the form "some" *itself* trigger the consideration of "all" and its potential negation *before* context is fully engaged, or does the inference solely emerge from context-driven relevance?

  ### How to Test the Crux (Progress Requires Measurement Refinement)
  *   **Predictions:**
      *   **Neo-Gricean:** Processing should show an *early*, *form-driven* activation of the stronger alternative ("all") and its potential negation, even in *truly neutral* contexts lacking cues about the speaker's knowledge or goals. This activation might be detectable *before* full contextual integration, potentially showing a cost if context *later* blocks it (e.g., cancellation).
      *   **RT:** Activation of "all" and the inference "not all" will *only* occur as part of building a relevant interpretation *for this specific utterance in this specific minimal context*. There should be *no* prior activation *solely* triggered by "some" independent of relevance search. Cancellation cost reflects building a *different* relevant interpretation, not overriding a default.
  *   **Progress via Experiment:** Design paradigms sensitive to *very early* processing stages and able to isolate form effects from minimal contextual relevance:
      1.  **Priming + Online Measures (Eye-tracking, EEG, MEG):** Present "some" in a truly neutral carrier sentence visually or auditorily. Measure *immediate* (within 200-400ms) priming for "all" or negation markers ("not all", "none"), compared to control words or non-scalar terms. RT predicts priming *only* if relevance forces consideration of the scale early; Neo-Gricean predicts early priming based on form alone.
      2.  **Minimal Context Cancellation Cost:** Present "John has some of the files" in a context so minimal it provides *no* cues about John, the files, or the speaker's goal (e.g., isolated sentence). Immediately follow with a continuation forcing cancellation ("...actually, he has them all") or reinforcement ("...so he doesn't have them all"). Measure processing time/effort on the continuation. Neo-Gricean predicts a *cost* for cancellation (overriding default) but not for reinforcement. RT predicts cost depends on building a *coherent relevant interpretation*; cancellation might be *easier* if the minimal context didn't strongly support the inference in the first place.
      3.  **Speed-Accuracy Tradeoff (SAT) with Varying Context:** How quickly and accurately can participants judge the truth of "John does not have all the files" after hearing "John has some of the files"? Systematically vary context support (Neutral, Supportive of Implicature, Blocking Implicature) and time pressure. Neo-Gricean predicts fastest responses in Neutral/Supportive contexts under time pressure (default available). RT predicts fastest responses depend on how quickly relevance can be established in *that specific context*; Neutral contexts might be *slower* or less accurate than Supportive ones if relevance is ambiguous.

  ### Should the Debate Be Dropped?
  **No.** Neither framework is "not at risk," but the *nature* of the risk differs based on your diagnosis:
  *   **Risk to Neo-Griceans:** If experiments consistently show *no* early form-driven activation independent of relevance computation in minimal contexts, and cancellation cost depends purely on contextual coherence, their core claim of form-triggered heuristics is undermined. They risk mischaracterizing the cognitive reality.
  *   **Risk to RT:** If experiments consistently show very early, form-driven activation of alternatives/negation *even when contextual relevance is minimized or ambiguous*, and cancellation shows a specific cost profile predicted by default-override, their strict denial of *any* form-triggered inference is challenged. They risk underestimating linguistic systematicity's impact on processing.
  *   **Framing the Seminar:** Frame it as an investigation into the *interface* between linguistic competence and cognitive processing. Explicitly separate the questions:
      1.  What systematic patterns of meaning does language form encode (Neo-Gricean strength)?
      2.  How are these patterns exploited in real-time comprehension (RT strength)?
      3.  Is there evidence that linguistic form *directly triggers* inferential processes (The Crux)?

  ### Where the Diagnosis is Most Vulnerable
  *   **Vulnerability:** The diagnosis hinges on cleanly separating "systematicity/competence" (Neo-Gricean) from "processing" (RT). **A strong argument against this separation** comes from proponents who insist that *any* adequate theory of linguistic competence *must* be psychologically real and process-compatible. If compelling evidence emerges that the neo-Gricean heuristics provide the *best* or *only* computationally feasible model for achieving the *speed and robustness* of comprehension (e.g., via fast, heuristic-based "shallow processing" modules), the "division of labor" weakens. The frameworks become competing *comprehensive* cognitive models. Similarly, if RT can convincingly show their model *explains the systematic patterns* without defaults, the competence/processing split becomes less relevant.
  *   **Confidence:** Moderately High (7/10). The persistence of the debate using the same data, the differing core methodologies (formal linguistic analysis vs. cognitive modeling), and the specific arguments each side makes against the other strongly suggest distinct primary goals. The "default" confusion is demonstrable. However, the substantive crux about form-triggering is real and significant. Progress *requires* addressing both the terminological divide and designing experiments specifically targeting the cognitive reality (or lack thereof) of form-triggered inference activation prior to contextual integration.
