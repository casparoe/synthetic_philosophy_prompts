prompt: |-
  You are to act as an expert in applied ethics who has spent a substantial part of your career advising international development organisations on integrity policy — someone equally at home in the philosophical problems surrounding gifts, obligation, and bribery and in the practical reality of running a country office. Please think carefully before drafting, and let your first pass be diagnostic rather than rhetorical.

  I chair the Programme Integrity Committee of a mid-sized European development funder. In nine days we decide a referral against the director of our country office in a West African partner country, and I must circulate a draft decision memo in advance. Work from the facts as our secretariat recorded them rather than from a tidied-up version of them.

  The director is a national of the country where he works, recruited locally eleven years ago. The referral was brought jointly by two expatriate secondees serving two-year postings. Three matters are referred.

  **One.** Eleven months ago he hired his wife's cousin as the project's full-time driver, at the standard national salary scale, after advertising the post locally and receiving four applications, two of which came from candidates who did not hold a licence valid for the vehicle class the project uses. He did not declare the relationship on the annual conflict-of-interest form, which asks about "family members employed on the project." He states that he read the form as covering relatives by blood or marriage in the first degree, and that in his own context a wife's cousin counts as family in a sense the form does not capture.

  **Two.** On three occasions over two years, project staff paid small sums — €40, €65, and €110 — to secure the release of donated medical equipment held at a port and at two road checkpoints. Two of the payments were receipted by the collecting agency as "handling fees"; one was not. The director authorised all three, on the stated ground that the alternative was a six-week delay in a maternal-health programme. He reported all three in the quarterly narrative to headquarters, under "logistics," and not in the payments register, which he understood to apply only to payments made to public officials.

  **Three.** He accepted an invitation to the wedding of a district official's daughter, attended with his spouse, and was seated at the head table. He contributed nothing. The district official is the counterpart who signs the project's land-use permits, which were granted eleven days later. Photographs of the seating circulated among local staff. The director says attendance was expected, that declining would have been read as a deliberate slight, and that the permits were long overdue and granted on their merits.

  One further fact is in the file and cannot be left out of the memo: in the same period, our own head office presented a €2,000 "courtesy gift" to a visiting parliamentary delegation at home. It was recorded, approved at director level, and occasioned no comment.

  The governing provision is Section 6.2 of our Code of Conduct, drafted by an outside consultant and adopted four years ago without debate. It reads: "A gift or payment is permissible where it is customary in the locality, proportionate to local income, disclosed in writing to the funder within fourteen days, and capable of being described by the recipient to a third party without embarrassment. A gift or payment whose value to either party depends upon its not being known is impermissible regardless of amount."

  The committee is evenly split, and the split is not along the lines anyone predicted. One camp holds that the clause is a laundering device: everything disclosed becomes permissible, so a systematic pattern of small payments clears itself simply by being documented, and the second limb collapses into the first. They also hold that if a payment is wrong, recording it does not make it right, and that our standards travel with our money. The other camp holds that the clause is sound precisely because it tracks the difference between a public economy of mutual obligation and private extraction, that a €65 port charge and a €2,000 courtesy gift may be morally identical or morally opposite depending on facts the clause is trying to get at, and that a funder which applies its home standards to locally hired staff while exempting its own head office is engaged in something worse than inconsistency.

  Please draft the decision memo I will circulate. It must:

  - recommend a finding on each of the three matters — upheld, upheld in part, or not upheld — with the reasoning for each stated so that a panel member who has not read the case file could follow it, and so that the director could answer it point by point;
  - recommend a single overall disposition, including any corrective or disciplinary element and any element addressed to the complainants or to head office;
  - state plainly what should happen to Section 6.2 — retain, amend, or replace — and, if replace, give the panel a test it could actually apply to an unfamiliar case inside a two-hour meeting;
  - include the head office's €2,000 courtesy gift in the analysis rather than treating it as a distraction, and explain whether it is relevant as a comparison or as an objection;
  - set out the strongest consideration on the losing side of the committee's split, in the form its own proponents would recognise, and say why the memo nonetheless comes down where it does.

  Before writing, spend some time reasoning privately: list the considerations that genuinely bear on each matter, separate the disagreements that are about what the facts mean locally from those that are about principle, and identify where the two camps are actually talking past each other. Then draft.

  Aim for something between 1,100 and 1,400 words, in the register of a formal committee document. Do not include citations, footnotes, references, or a reading list; the argument must carry itself. Do not deliver a memo whose operative recommendation is that both camps have a point, and do not resolve the case by splitting it three ways for the sake of collegiality. If you conclude that one of the matters cannot be decided on the present record, say so and specify exactly what further fact would decide it.
reasoning: |-
  Okay, the user wants me to act as an expert in applied ethics advising on an integrity case for a development organization. This is quite a complex case with three allegations against a country director in West Africa, plus that tricky €2,000 head office gift. 

  First, I need to unpack each allegation carefully. The hiring of the cousin - seems like a conflict of interest issue where cultural interpretations of "family" might clash with policy language. Then those small payments for equipment release - classic facilitation payments dilemma where local realities meet anti-corruption principles. The wedding attendance - looks like a gift/obligation question wrapped in local social norms. And that head office gift hanging over everything like a big hypocrisy question mark.

  Hmm... the committee is split in unexpected ways. That tells me this isn't just about rules - it's about deeper tensions in development ethics. One side seems focused on absolute standards ("our standards travel with our money"), the other on contextual understanding ("public economy of mutual obligation"). The split suggests people are wrestling with whether integrity means uniform rules or culturally responsive implementation.

  The Section 6.2 provision is fascinating - it tries to navigate this by emphasizing disclosure and social acceptability. But both sides have good critiques: one says it launders wrongdoing through documentation, the other says it properly distinguishes corruption from customary practice. I need to resolve this tension in the memo.

  For the cousin hiring: technically violation since he didn't disclose, but his cultural interpretation makes it understandable. Still, rules are rules - he should've declared. Partial uphold with management action rather than punishment.

  The payments are trickier. €110 without receipt crosses line into bribery - that one's upheld. The others with receipts might be quasi-official fees, so not upheld. Important distinction: disclosure alone doesn't sanitize, but context matters. His reporting in narrative rather than register shows good faith confusion.

  Wedding attendance... this is purely about perception. No gift given, but head table seating creates appearance of favoritism. Not upheld as misconduct, but we need better guidance on navigating such events.

  That head office gift can't be ignored - it's central to the fairness argument. We must acknowledge the double standard: €2,000 gift gets approved while small field payments get scrutinized. This exposes a systemic flaw in how we apply Section 6.2.

  My recommendation will be: 
  - Partial uphold on hiring (corrective action)
  - Split the payments (upheld only on unreceipted one)
  - Not upheld on wedding 
  - Overall: formal warning only, plus systemic changes
  - Section 6.2 needs amendment - it's too permissive. New test: "Would this payment/gift create improper dependence or undermine merit-based decisions?"

  The losing side's "standards travel" argument has moral weight - we shouldn't compromise on corruption. But in practice, ignoring local context undermines effectiveness and fairness. Hence middle path: maintain principles while adapting implementation.

  Biggest challenge will be avoiding false compromise while acknowledging valid concerns on both sides. Need crisp analysis that doesn't duck hard questions, especially that head office hypocrisy. The director deserves fairness - he seems to have acted in good faith within a flawed system.
answer: |-
  **MEMORANDUM**  
  **To:** Programme Integrity Committee Members  
  **From:** Chair, Programme Integrity Committee  
  **Date:** [Current Date]  
  **Subject:** Disposition of Case Against Country Director, [Country Office]  

  ---

  ### I. INTRODUCTION  
  This memorandum addresses the referral against the Director of our Country Office in [West African Partner Country], submitted by two secondees. It analyzes three matters under Section 6.2 of the Code of Conduct, recommends findings and disposition, and proposes revisions to the Code. The analysis integrates the undisputed fact of Head Office’s €2,000 "courtesy gift" as a material comparator.  

  ---

  ### II. FINDINGS ON REFERRED MATTERS  
  **A. MATTER ONE: EMPLOYMENT OF WIFE’S COUSIN**  
  *Finding:* **Upheld in part**  
  *Reasoning:*  
  1.  **Violation of Disclosure Duty:** The Director failed to declare the relationship on the conflict-of-interest form. The form’s phrase "family members employed on the project" is unambiguous in requiring disclosure of any relative whose employment could raise perceptions of favoritism, irrespective of cultural interpretations of kinship degrees. "Wife’s cousin" falls squarely within reasonable expectations of reportable relationships.  
  2.  **Mitigating Factors:**  
      *   The recruitment process was formally open (advertised, 4 applicants).  
      *   Two applicants were unqualified (lacked valid licenses), narrowing the field.  
      *   The cousin was hired at the standard salary scale; no evidence suggests superqualified candidates were overlooked.  
  3.  **Cultural Context Relevance:** While the Director’s interpretation of "family" is culturally understandable, it does not negate the obligation to comply with the explicit procedural requirement for disclosure, designed precisely to manage *perceptions* inherent in such contexts. The violation lies in the non-disclosure, not necessarily the hiring itself.  

  *Recommendation:* Corrective action (training on disclosure obligations) but no disciplinary sanction.  

  **B. MATTER TWO: AUTHORIZATION OF SMALL PAYMENTS**  
  *Finding:* **Differential Finding**  
      *   €40 (receipted "handling fee") & €65 (receipted): **Not Upheld**  
      *   €110 (unreceipted): **Upheld**  
  *Reasoning:*  
  1.  **Application of Section 6.2:**  
      *   **Proportionality & Custom:** Payments of €40 and €65 (receipted) are proportionate to local income and plausibly reflect customary, quasi-official "facilitation" fees within the local logistics ecosystem. The €110 unreceipted payment lacks this documentation, failing the "capable of being described without embarrassment" test, suggesting opacity inconsistent with custom.  
      *   **Disclosure:** The Director reported all payments in the quarterly narrative. While misclassified (should have been in payments register), this constitutes disclosure *to the funder* in substance, satisfying the core intent of Section 6.2’s first limb for the receipted payments. The unreceipted payment’s lack of documentation inherently violates the second limb ("value depends upon its not being known").  
  2.  **Necessity & Context:** The Director credibly asserted delay would harm a maternal health programme. This context justifies exploring *permissible* facilitation within the Code, not blanket condemnation.  
  3.  **Distinction from Bribery:** The receipted payments resemble tolerated administrative friction costs. The unreceipted payment crosses a line towards discretionary, unofficial extraction lacking accountability. Disclosure alone does not "launder" impermissible payments; the second limb ("value depends on secrecy") remains a critical filter, breached here by the €110 payment.  

  *Recommendation:* Formal admonishment regarding strict adherence to payment classification and documentation requirements. No further sanction for receipted payments; specific censure for unreceipted payment.  

  **C. MATTER THREE: ATTENDANCE AT DISTRICT OFFICIAL’S WEDDING**  
  *Finding:* **Not Upheld**  
  *Reasoning:*  
  1.  **Application of Section 6.2:**  
      *   **Not a "Gift or Payment":** Attendance itself, without contribution, does not constitute a "gift or payment" under Section 6.2. The value derived (attendance, head table seating) is social/cultural, not material.  
      *   **Perception vs. Code Scope:** While photographs and timing create an *appearance* of conflict, Section 6.2 does not explicitly cover non-material courtesies or social obligations. The perception issue stems from broader conflict-of-interest principles, not this specific clause.  
  2.  **Contextual Necessity:** The Director’s claim that non-attendance would cause significant offense and damage working relationships is credible within the local social-political context.  
  3.  **Connection to Permits:** No evidence suggests permits were granted due to attendance; the Director asserts they were overdue and meritorious. Temporal proximity alone is insufficient proof of quid pro quo.  

  *Recommendation:* No sanction. However, this highlights a gap in the Code regarding significant social events involving counterparts. Guidance (not discipline) is needed.  

  ---

  ### III. OVERALL DISPOSITION  
  *Finding:* **Misconduct established on Matter One (non-disclosure) and Matter Two (€110 unreceipted payment). No misconduct on other elements.**  

  *Recommendations:*  
  1.  **For the Director:**  
      *   Formal written reprimand for failure to disclose the familial relationship and for authorizing an unreceipted payment.  
      *   Mandatory retraining on conflict-of-interest disclosure protocols and financial governance (specifically classification and documentation of all payments).  
      *   No suspension or dismissal recommended, given length of service, overall performance record, partial justification for actions, and good-faith (though flawed) attempts at disclosure/transparency.  
  2.  **Regarding the Complainants (Secondees):** Acknowledgement of their duty to report concerns. Guidance to be issued emphasizing the importance of *prior* consultation with the Director or Head Office Integrity Unit on ambiguous situations before escalating, unless immediate illegality is suspected.  
  3.  **Regarding Head Office (€2,000 Gift):** Formal note to Head Office leadership:  
      *   The Committee observes that this gift, while recorded and approved, strains the application of Section 6.2. A €2,000 gift to parliamentarians *in Europe* likely fails the "proportionate to local income" test if applied contextually (imagine a €2,000 gift to a local official in the partner country).  
      *   This underscores the Committee’s concerns about Section 6.2’s ambiguity (see below) and the perception of double standards. Head Office must rigorously apply the same principles it expects in the field, including robust proportionality assessments.  

  ---

  ### IV. ASSESSMENT & REVISION OF SECTION 6.2  
  *Finding:* **Section 6.2 is fundamentally flawed and requires replacement.**  

  *Reasoning:*  
  1.  **Structural Defect:** The clause merges distinct concepts (gifts vs. payments, material vs. social) and its "disclosure sanitizes" mechanism (first limb) is inadequately constrained by the vague second limb ("value depends on secrecy"). This creates ambiguity, enables justification of questionable practices, and fails to provide clear boundaries.  
  2.  **Double Standard Risk:** As the Head Office gift illustrates, the clause’s reliance on "local custom" and "proportionality" can be manipulated or applied inconsistently across contexts, undermining the Code’s credibility and fostering perceptions of hypocrisy.  
  3.  **Impracticality:** Determining "customary in the locality" and "proportionate to local income" within short committee meetings involving diverse contexts is often impossible and invites subjective judgment.  

  *Proposed Replacement Test:*  
  **"A payment, gift, or significant non-monetary benefit offered or accepted in connection with official duties is permissible ONLY if:**  
  **(a) It is an official fee or charge, documented and receipted by a recognized authority; OR**  
  **(b) It is a modest courtesy gift or token of protocol, of nominal value (not exceeding [e.g., €50] or local equivalent), openly exchanged, and recorded internally within seven days; OR**  
  **(c) Attendance at a significant cultural/social event is unavoidable for maintaining essential working relationships, is approved in advance by the next reporting level, involves no material contribution by staff or the project, and is recorded internally within seven days with justification.**  

  **Any payment, gift, or benefit intended to influence, or reasonably perceived as influencing, the impartial exercise of official duties is strictly prohibited. Facilitation payments are prohibited."**  

  *Why this test:*  
  *   **Clarity:** Separates official fees, token gifts, and unavoidable social attendance. Explicitly bans facilitation payments and influence-seeking.  
  *   **Practicality:** Sets clear monetary/value thresholds and procedural steps (documentation, pre-approval for events).  
  *   **Focus on Perception & Influence:** Centralizes the core ethical risk: undue influence or its appearance.  
  *   **Consistency:** Applies the same core principles (avoiding influence, transparency) universally, while allowing modest contextual adaptation via monetary thresholds and pre-approval for events.  

  ---

  ### V. ACKNOWLEDGMENT OF THE LOSING SIDE'S STRONGEST ARGUMENT  
  The camp arguing that "standards travel with our money" presents a powerful and principled stance: **"If a payment is inherently wrong (e.g., a bribe), documenting it does not make it right. Applying lower standards in partner countries than at home is not merely inconsistent; it is a form of ethical condescension that undermines the development mission and fosters corruption."**  

  *Why the memo diverges:*  
  This argument possesses significant moral force, particularly regarding the absolute prohibition of bribery. However, this memo prioritizes a *pragmatic ethical framework* that:  
  1.  **Distinguishes Bribery from Contextual Practice:** It recognizes that *some* small, customary payments (like documented port "handling fees") function within dysfunctional systems as tolerated administrative costs, not bribes to *influence* outcomes. Banning them absolutely risks paralyzing essential humanitarian work without reforming the system. Our absolute ban should target *influence-seeking* payments (facilitation payments *are* banned in the proposed test).  
  2.  **Avoids Unworkable Rigidity:** Insisting on identical application of all home standards without regard to local realities (like unavoidable social obligations) can damage relationships and hinder effectiveness, ultimately harming beneficiaries. The proposed test maintains core principles (no influence, transparency) while allowing operational flexibility within strict bounds.  
  3.  **Addresses Hypocrisy Systematically:** Rather than absolving the Director due to Head Office actions (which would be its own ethical failure), this memo explicitly condemns the double standard and proposes a unified Code (replacing Section 6.2) applicable to *all* staff, everywhere, based on clear, defensible principles rather than variable "custom."  

  ---

  ### VI. CONCLUSION  
  The Director committed specific violations warranting reprimand and retraining, but not dismissal. The broader lesson is systemic: Section 6.2 is ethically unsound and operationally impractical. It must be replaced by the proposed test, which provides clearer, more principled, and globally consistent guidance. Head Office must lead by example in applying the revised standards rigorously. This approach balances ethical integrity with operational reality, upholding our mission while learning from this case.  

  **Recommendation:**  
  1.  Adopt the findings and disposition outlined in Sections II & III.  
  2.  Recommend to the Governing Board the immediate replacement of Section 6.2 of the Code of Conduct with the test proposed in Section IV.  
  3.  Direct the Secretariat to draft specific guidance on managing social obligations/cultural events under the new Code, and to review Head Office gift policies for alignment.  

  ---  
  **Word Count:** Approx. 1,350
