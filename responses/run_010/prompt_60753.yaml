prompt: |-
  im writing a seminar paper for my Kant class and I've realised I've been reading interpretations of the universal law formula with no criteria at all for what would make one of them actually good. before I go further, can you write me the spec — the list of things any account of how the test works has to deliver?

  for each requirement give the case or consideration behind it (the deposit-keeping kind of case, the neglected-talents and refusing-help ones, whatever else is load-bearing), and sort them into genuinely non-negotiable vs. just the pet commitments of one camp — like the demand that the test issue a verdict on every act rather than on maxims. I especially want you to flag any pair that look jointly unsatisfiable. my hunch is that "an ordinary agent can run it herself without already knowing the morally right answer" and "the verdict doesn't shift depending on how narrowly or broadly she words her maxim" can't both be had, but tell me if I've got that wrong.

  then say which single requirement knocks out the most candidate readings, and — one line only, this isn't the point — how the two or three standard ways of reading the test do against the list. no bibliography please, I've got the reading list already. keep the whole thing under 700 words, numbered is fine, and put the two requirements that do the most work first.
