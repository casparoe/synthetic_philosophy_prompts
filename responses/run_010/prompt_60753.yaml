  The requirement that does the most work—knocking out the most interpretations—is likely the consistency in maxim phrasing, as many readings struggle with how agents frame their actions. After listing all requirements, I'll note how major interpretations (logical contradiction, practical contradiction, teleological) fare briefly. The whole response must stay concise but cover all requested elements without citations since the user has the reading list.
answer: |-
  Here’s your spec for evaluating interpretations of Kant’s Universal Law Formula (ULF), prioritizing the most demanding requirements, with cases and negotiability flagged:

  1.  **Delivers Contradiction in Conception (CiC) for Perfect Duties (Non-Negotiable)**
      *   **Case:** The false promising/borrowing (deposit-keeping) case (`maxim: lie to get money when in need`). Any viable interpretation *must* show how universalizing this maxim leads to a conceptual contradiction (e.g., promise-keeping becomes impossible).
      *   **Why Non-Negotiable:** Kant explicitly uses this case as the paradigm for CiC and perfect duties. An interpretation failing here fundamentally misses the text.

  2.  **Delivers Contradiction in the Will (CiW) for Imperfect Duties (Non-Negotiable)**
      *   **Cases:** The refusal to help others (`maxim: never help anyone`) and the neglect of talents (`maxim: never develop any talents`). Must show universalization doesn't yield a *logical* contradiction but a volitional one – a rational agent cannot consistently *will* the universalized maxim *and* their own necessary ends (happiness, agency).
      *   **Why Non-Negotiable:** Kant explicitly contrasts these cases with CiC and grounds imperfect duties here. Failure invalidates the account for core Kantian duties.

  3.  **Provides Action-Guidance Without Prior Moral Knowledge (Negotiable, but Crucial)**
      *   **Consideration:** Kant presents the ULF as a decision procedure ("What if everyone did that?"). An interpretation should enable an ordinary agent to apply it to a proposed maxim without already knowing if the act is right/wrong.
      *   **Negotiability:** Some strong interpretations (e.g., O'Neill, Korsgaard) argue the test *presupposes* basic moral concepts/commitments, making pure proceduralism difficult. Others aim for pure procedure. **Tension:** This *is* in genuine tension with (4).

  4.  **Yields Stable Verdicts Irrespective of Maxim Wording (Non-Negotiable in Principle, Negotiable in Practice)**
      *   **Consideration:** Avoids the "description relativity" problem. Testing `maxim: break promises on Tuesdays` vs. `maxim: break promises` shouldn't yield different moral verdicts. Needs a principled way to identify the morally relevant maxim description.
      *   **Non-Negotiable?** An interpretation *must* address this to be viable. Solutions vary (e.g., requiring maxims describing fundamental intentions/policies). **Tension:** Achieving stable verdicts often requires sophisticated "maxim discipline" or background knowledge, conflicting directly with the pure procedural accessibility demanded by (3). Your hunch is correct; satisfying both robustly is the core challenge.

  5.  **Distinguishes CiC from CiW Consistently (Non-Negotiable)**
      *   **Consideration:** Must explain *why* false promising yields a contradiction *in conception* while refusing help yields only a contradiction *in the will*. The difference grounds the perfect/imperfect duty distinction. Cannot conflate the mechanisms.

  6.  **Explains the "Lawlikeness" Intuition (Non-Negotiable)**
      *   **Consideration:** The contradiction revealed must feel like a failure of the maxim to be a *universal law*, not just a pragmatic inconvenience. It must connect to the authority of morality as law-like. The deposit case shouldn't fail *just* because banks would collapse.

  7.  **Accommodates Kant's "Same Action" Claim (Negotiable)**
      *   **Case:** Kant states the same act (e.g., suicide) can be tested via different maxims, potentially yielding different verdicts. Interpretations demanding a single "correct" maxim per act struggle here. Many accept this flexibility.

  8.  **Applies to Maxims, Not Necessarily Every Act (Negotiable)**
      *   **Consideration:** Kant focuses on testing *maxims* (subjective principles of action). Requiring a verdict for every single *act* (regardless of underlying maxim) is arguably a misreading. Focus on maxims is standard.

  9.  **Detects All Duties? (Negotiable/Aspirational)**
      *   **Consideration:** Can it handle subtle cases (e.g., non-beneficence vs. active malice)? Kant likely saw the ULF as the supreme principle needing supplementation (e.g., FH) for full derivation. Most accept it won't flawlessly cover *every* duty alone.

  **Most Potent Requirement:** **#4 (Stable Verdicts vs. Maxim Wording)** knocks out the most interpretations. Naive "what if everyone did that?" readings, many logical contradiction accounts, and purely intuitive readings fail badly here. Finding a principled solution to description-relativity is the major hurdle.

  **Standard Readings vs. Spec:**

  *   **Strict Logical Contradiction:** Excels at (1) & (5) (CiC). Struggles severely with (2) (CiW - logical contradiction in willing?), (3) (Agent skill?), and catastrophically with **(4)** (stable verdicts). Weak on (6) (lawlikeness?).
  *   **Practical Contradiction (e.g., Korsgaard):** Better on (2) (CiW), (5) (distinction), and (6) (lawlikeness via undermining conditions of agency). Better attempt at **(4)** (focus on fundamental intentions). Still challenging for (3). Handles (1).
  *   **Teleological (e.g., Wood):** Focuses on (2) & (6) (contradiction in willing rational nature's ends). May handle (7) well. Struggles with (1) (Is false promise *conceptually* impossible, or just bad for rational nature?), (5) (blurs CiC/CiW?), and **(4)**.
