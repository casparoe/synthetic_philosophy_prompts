answer: |-
  **FENWICK & ORDAL INTERNAL STYLE GUIDE (REV. ED.)**
  **Issued by: Margit Ordal, Head of Copy**
  **Effective: 1 October 2023**

  *PREFATORY NOTE: This revision incorporates principles derived from the later work of Ludwig Wittgenstein, focusing on linguistic practice within our publishing context. Its aim is clarity through attention to actual use.*

  **1.0 Nature of the Guide**
  It is required that editorial decisions be grounded in the observed practices of language as employed within specific contexts (language-games). This guide outlines procedures reflecting this principle. Its authority derives solely from its adoption by Fenwick & Ordal for internal consistency. A manuscript is defined as *any submitted sequence of symbols presented for publication consideration*.

  **2.0 Meaning is Use (Core Principle)**
  2.1 The meaning of a word or phrase is not an abstract entity it labels, but is constituted by its function within the language-game in which it is employed (see Clause 8.0 for departmental language-games). Editorial intervention must focus on clarifying function within the specific textual game, not on aligning words with presumed ideal definitions.
  2.2 Consequently, requests for definitions of terms used within a submitted work are generally inadmissible unless the work itself is structured as a definitional exercise (see Clause 3.0 re: *The Anatomy of Ideas* exception). Inquiry should focus instead on the author’s intended *use* within the specific argument or narrative context.
  > *Query for Dr. Aris Thorne (MS# F&O-AI-07 "Person"):* Your draft states "The person is the seat of consciousness." Clause 2.1 requires we ask: Within the language-game of your chapter, what work is "seat" *doing*? Is it mechanistic (like a valve seat), juridical (like a seat of government), or metaphorical (like a seat of learning)? The permitted use hinges on the game being played in surrounding sections. Please clarify function.

  **3.0 The Anatomy of Ideas Series (Policy Contradiction)**
  3.1 The premise of the *Anatomy of Ideas* series (definitive accounts opening each volume) is hereby recognized as fundamentally incompatible with Clause 2.1. A single, context-free definition of concepts like "knowledge," "justice," or "game" cannot capture their meaning, as meaning resides in their diverse uses across innumerable language-games.
  3.2 Existing contracts oblige fulfillment. However, all future volumes must include, as a preface to the opening definition, a mandated disclaimer acknowledging: (a) the definition offered is one possible use among many; (b) its validity is confined to the linguistic framework established within *that volume*; (c) it does not exhaust or fix the concept's meaning in other contexts. Copy editors are instructed to rigorously enforce this disclaimer's inclusion and wording.
  3.3 Proposals for new volumes in the series require explicit justification detailing how the proposed "definitive account" acknowledges its own limitations per Clause 2.1 and 3.2. Justification based solely on historical or conventional definitions will be rejected.

  **4.0 Backlist Indexing (Family Resemblance Protocol)**
  4.1 The standard alphabetical subject index for the Fenwick & Ordal backlist is deprecated. A new index structure based on principles of family resemblance is mandated.
  4.2 Index headwords (e.g., "Rule," "Art," "Number") are not to be defined. Their placement and grouping must be determined solely by overlapping and criss-crossing similarities linking them to adjacent headwords. For example: "Game" may neighbour "Rule" (shared structures), "Play" (shared activity), "Sport" (shared institutional form), and "Gamble" (shared uncertainty), without any single feature common to all entries under "Game" or necessarily linking "Game" directly to "Sport" if sufficient overlapping links exist via other terms.
  4.3 The resulting index may appear non-intuitive or lack direct pathways for conventional searches. This is a feature, not a defect, reflecting the non-essentialist nature of concept application. Usability for standard reference is secondary to structural fidelity to the principle that concepts are held together by a network of similarities, not a core essence. Cross-references (*see also...*) are the primary navigational tool, not definitions.

  **5.0 Manuscript Assessment (Language-Games as Complete Systems)**
  5.1 A submission constitutes a publishable language-game if it demonstrates internal coherence and rule-governed use within its self-contained context, regardless of external reference or lexical size. Meaning is established by use *within that system*.
  5.2 Therefore, Submission #P-447 ("Site Calls") – consisting solely of the words "Girder!" / "Level!" / "Clear!" / "Pour!" presented as distinct pages – is accepted for publication in the *F&O Experimental* imprint. Its function as a complete, rule-bound system of communication within the specific context of a building site is evident. Editorial intervention is limited to ensuring typographical clarity reflecting intended vocal delivery. Semantic queries demanding external definitions (e.g., "What does 'Level!' *really* mean?") are invalid per Clause 2.1.

  **6.0 Private Language & Diary Notation (Rejection Grounds)**
  6.1 Manuscripts or passages relying on symbols, notations, or codes for which no criterion of correct use exists outside the author's subjective impression are deemed "private language" and unpublishable by Fenwick & Ordal.
  6.2 This includes, but is not limited to: personal diary entries using unique symbols known only to the author; invented lexicons without demonstrated rules of application shared with potential readers; passages where the author asserts meaning but provides no intersubjective means of verifying application.
  6.3 Rejection rationale: Without a possibility of others checking use against a shared standard, the notation lacks a language-game. It is not a malfunctioning public language; it fails to be a language at all. Meaning requires the possibility of agreement in use (see Clause 2.1). Authorial insistence on personal understanding is insufficient.

  **7.0 Cover Design & Aspect Perception (Sales Conference Limitations)**
  7.1 Disputes over cover art capable of sustaining multiple, simultaneous valid interpretations (e.g., the duck-rabbit image proposed for *Ways of Seeing Perception*) cannot be settled by majority vote at sales conference.
  7.2 A change in *aspect* (seeing the image *as* a duck, then *as* a rabbit) is not a change of *opinion* about an objective property. Both aspects are valid perceptions of the same image data within different conceptual groupings.
  7.3 Resolution requires either: (a) Acceptance of the inherent ambiguity as reflecting the text's theme, if applicable; or (b) Selection of alternative artwork lacking such strong bistable perception, should clarity be paramount. The vote may indicate perceived market preference, but cannot adjudicate the *validity* of the aspects seen. Marketing feedback on likely reader perception is germane (see Clause 8.0); declaring one aspect "correct" is not.

  **8.0 Marketing Department Communications (Translation Protocol)**
  8.1 Marketing operates within a distinct language-game governed by different rules and aims (e.g., maximizing visibility, generating pre-orders, identifying comparables) than the editorial language-game (governed by clarity, coherence, textual integrity per this Guide).
  8.2 Marketing communications (briefs, comp titles, audience definitions) cannot be *contradicted* on editorial grounds (e.g., "This definition of 'literary fiction' is philosophically unsound per Clause 2.1"). They belong to a different game.
  8.3 Editorial is required to *translate* marketing requirements into terms compatible with the editorial language-game. For example: A marketing brief demanding "a definitive take on modern love" (cf. Clause 3.0) must be translated editorially into ensuring the author's specific *use* of concepts related to love within *their* textual framework is internally consistent and clearly presented for the target audience. The impossibility of a "definitive take" is editorial context, not a rebuttal to marketing.

  > *Query for Ms. Eleanor Vance (Copy Ed., Senior):* Your 11/15/23 markup of *The Labyrinth of Rule* (AI-04) altered all instances of "constitutive rules" to "regulative rules," citing "conceptual hygiene" and a 2012 memo (superseded). Clause 3.2 requires preserving the author's specific use *within her framework*, even if contestable elsewhere. Your past adherence (2012-2023) established your understanding of the rule (Clause 2.1/3.2). What fact about your work on *Games People Play* (2011) constitutes your having *meant* the old rule in a way that makes this change not merely an error, but a divergent application of what was previously followed? Did that project involve a specific, context-bound definition you now universalize?
  >
  > *Query for Mr. Ben Chen (Prod. Mgr.):* Marketing requests a "blurb that defines the undefinable spirit of jazz" for *Blue Notes*. Clause 8.3 requires translation. Please clarify: Is the requirement for evocative language gesturing towards *uses* of "jazz spirit" in specific contexts (permissible), or for an essentialist definition (impermissible)? We will draft accordingly.

  **9.0 Rule Application & Correctness (Limitation)**
  9.1 This guide provides rules for editorial practice. However, no rule can fully determine its own correct application in every novel circumstance. Correct application is demonstrated within the ongoing practice of the copy department, through examples, precedents, and training in specific cases. Agreement in practice constitutes correctness (cf. Clauses 2.1, 6.3).
  9.2 Disputes regarding rule application are resolved through examination of analogous past cases and the specific context of the manuscript in question, not by recursive appeal to the rule text alone. The Head of Copy holds final interpretive authority within the Fenwick & Ordal editorial language-game.
