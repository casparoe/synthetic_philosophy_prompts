  The engineering parallels feel surprisingly clean at first glance. The constitution is the initial commit. Amendments are new commits. The amendment rule itself is like the CONTRIBUTING.md file that defines how to make changes. Semver comes in for tracking significance of changes. Force-pushes would represent revolutionary overhauls. 

  But the sticky part is the root access question. In engineering, there's always some admin outside the system with ultimate control. In law, theorists insist there's no such external entity - the system has to bootstrap itself. That's where Kelsen's basic norm comes in, acting like the initial bootloader that everyone just accepts. 

  For eternity clauses, they're like a protected branch rule in Git, but the problem is that in law, there's no true root to enforce it. Future generations could still "force-push" over it if they have enough social consensus. The binding force comes from collective belief, not technical constraints.

