prompt: |-
  I work the claims desk at a fact-checking site and our senior genetics editor signs off on every ruling. Over the past year her verdicts on heritability claims have gone like this:

  - "Height is about 80% heritable, so roughly 80% of your height comes from your genes and 20% from what you ate." — false
  - "PKU is about as heritable as a trait gets, and it's still almost completely preventable just by changing what a child eats." — true
  - "We can take the heritability of educational attainment measured in the Nordic countries and use it to work out how much schooling matters somewhere with wildly unequal schools." — false
  - "If every kid got equally good schooling, the heritability of test scores would go up, not down." — true, though she flagged that the piece reporting it implied schools had stopped mattering
  - "Two groups each show a heritability of about 0.6 for the same trait and one group averages higher, so most of the gap has to be genetic." — false
  - "Twin studies probably come out high because identical twins get treated more alike than fraternal ones." — true but unsettled, she let the hedge stand
  - "Numbers built from common DNA variants across the genome usually come in below the twin-study numbers for the same trait." — true
  - "The trait is highly heritable, so there's no point funding a program to change it." — false
  - "My niece and her identical twin were raised the same way and turned out very different, so heritability for that has to be low." — false
  - "Two populations can have identical heritabilities for a trait and still differ in their averages, and two populations with the same average can have different heritabilities." — true

  Now on my desk is a magazine piece about adoption. The sentence we have to rule on is basically: you were adopted at birth and never met your biological mother, and because schizophrenia is about 80% heritable in the population you come from, your own odds of developing it track the genes she passed on much more than anything your adoptive parents did.

  Where I'm stuck is that its the first claim in the pile that applies a heritability number to one named person while still being, as far as I can tell, statistically defensible — adoption studies really do find risk tracking biological relatives rather than adoptive ones. So:

  What rules could she be running that fit all ten verdicts above? For each candidate rule, what does it predict here — false, true, or true-but-misleading — and is there any verdict in the pile that leans toward one rule over another? Give me your best guess at her label plus the reasoning you'd actually put in the note that goes with it. Then tell me whether there's a rewrite of that sentence that every one of those rules would pass, and what seperate claim, if it landed on her desk next, would settle which rule she's really on.

  Last bit: if the desk wanted to adopt a house principle explicitly instead of inheriting hers by accident, which of these rules would you argue for, and what would it cost us — i.e. what kinds of accurate claims would we start failing, or bad claims start passing?
reasoning: |-
  Okay, let me start by understanding the user's problem. They work at a fact-checking desk and need to rule on a claim about heritability and schizophrenia in an adoption context. They've provided ten previous verdicts from their senior genetics editor, and they're trying to discern the underlying rules she follows. The challenge is applying those rules to this new claim.

  First, I need to analyze the ten verdicts to identify patterns. Let me go through each one:

  1. **Height claim (false):** The editor marked it false because heritability is population-level and doesn't split individual traits into percentages. So, rule: Heritability doesn't apply to individuals.

  2. **PKU claim (true):** PKU is highly heritable but preventable by environment (diet). Rule: High heritability doesn't mean environment can't change outcomes.

  3. **Educational attainment across populations (false):** Heritability can't be transferred between populations with different environmental variances. Rule: Heritability is context-specific.

  4. **Equal schooling increasing heritability (true):** Reducing environmental variation increases heritability estimates. Rule: Heritability changes with environmental uniformity.

  5. **Group gap attribution (false):** High heritability doesn't explain group differences. Rule: Heritability ≠ causation for group differences.

  6. **Twin study criticism (true but unsettled):** Acknowledges that shared environment might inflate heritability estimates. Rule: Methodology affects heritability estimates.

  7. **DNA vs. twin studies (true):** Common variants often show lower heritability than twin studies. Rule: Different methods yield different estimates.

  8. **No intervention due to heritability (false):** High heritability doesn't negate environmental interventions. Rule: Heritability doesn't imply immutability.

  9. **Twin anecdote (false):** Individual variation doesn't reflect population heritability. Rule: Heritability is population-level, not individual.

  10. **Heritability and group averages (true):** Heritability and group means are independent. Rule: Heritability doesn't dictate group differences.

  The common themes are:
  - Heritability is a population statistic, not individual.
  - It's context-dependent (GxE interaction).
  - High heritability ≠ genetic determinism.
  - Group differences can't be inferred from heritability.
  - Methodology matters (twin vs. DNA studies).

  Now, applying this to the schizophrenia claim. The statement says that for an adopted person, their schizophrenia risk tracks biological relatives more than adoptive ones. Adoption studies do support this. But the editor's previous rulings emphasize population-level interpretation. The phrase "your own odds" personalizes it, which might violate the individual application rule (from verdicts 1 and 9). Also, "much more than anything your adoptive parents did" could imply determinism, conflicting with verdicts 2 and 8. 

  So the editor would likely rule "true but misleading" because while the statistic is correct, the wording suggests genetic determinism for an individual. A rewrite could emphasize population-level risk without implying inevitability.

  For a house rule, I'd argue for a strict population-level interpretation to avoid misuse. This might require rejecting claims that apply heritability to individuals, even if statistically referenced. The cost? Some accurate individual-risk communications (like genetic counseling) might be flagged as misleading, requiring careful rewrites.

  To test which rule the editor uses, a claim about individual genetic risk using polygenic scores could help. If she accepts it with caveats, she's Rule 1; if rejects, she's Rule 2.
answer: |-
  Based on the pattern of verdicts, your editor is enforcing **Rule 2: Heritability describes *population-level* variance under *current environmental conditions* and cannot be directly applied to individuals, group differences, or future scenarios.** Here's how it fits all ten verdicts:

  | **Claim** | **Verdict** | **Why Rule 2 Explains It** |
  |-----------|-------------|----------------------------|
  | Height 80% split | False | Misapplies population statistic to individual biology |
  | PKU heritable + preventable | True | High heritability ≠ immutable (environment can override) |
  | Transplanting Nordic h² | False | Heritability is context-dependent (different environments) |
  | Equal schooling ↑ h² | True | Reduced environmental variance ↑ heritability estimate |
  | Group gap = mostly genetic | False | Heritability ≠ cause of group differences |
  | Twin study inflation | True | Methodology affects estimate (shared environment bias) |
  | DNA < twin h² | True | Different methods capture different components |
  | No point funding program | False | High h² ≠ unchangeable (e.g., PKU counterexample) |
  | Twin anecdote = low h² | False | Individual outcomes ≠ population statistic |
  | Same h² ≠ same mean | True | Heritability and group averages are independent |

  **Ruling on the schizophrenia claim:**  
  **Label: TRUE BUT MISLEADING**  
  **Reasoning for your note:**  
  *"While adoption studies confirm schizophrenia risk tracks biological relatives (supporting the 80% heritability estimate in this population), the phrasing implies genetic determinism for an individual. Heritability estimates:  
  - Describe variance in a specific population/environment  
  - Cannot predict an individual's outcome (your niece could still develop schizophrenia with low-risk genes, or avoid it with high-risk genes due to environment)  
  - Do not quantify 'how much' genes vs. environment matter *for one person*.  
  The claim risks misinterpretation by suggesting genes outweigh adoptive environment *in the adoptee's personal case*, which heritability statistics cannot support."*  

  **Rewrite that passes all rules:**  
  *"Because schizophrenia is about 80% heritable in the population you come from, adoption studies show that your statistical risk aligns more closely with your biological relatives than adoptive relatives. However, this population statistic doesn't predict your personal outcome."*  

  **Test claim to settle her rule:**  
  Submit: *"A polygenic risk score calculated from your DNA can tell you your precise genetic predisposition for schizophrenia relative to others."*  
  - If she labels it **FALSE**, she's strictly **Rule 2** (population stats ≠ individual application).  
  - If she labels it **TRUE BUT MISLEADING**, she's **Rule 1** (allows individual inference with caveats). Her verdicts #1 and #9 lean toward Rule 2, but this would confirm.  

  **Proposed house rule & trade-offs:**  
  **Adopt Rule 2 strictly.**  
  *What it costs:*  
  - **False negatives:** We'd fail technically accurate claims like *"This adoptee's schizophrenia risk is statistically closer to bio-mom than adoptive mom"* (though framing matters).  
  - **False positives:** We might pass claims like *"Heritability of trauma response is 30% in war zones"* without flagging that it likely drops in stable environments.  
  *Why it's worth it:* Prevents high-impact misuse (e.g., genetic determinism, justifying inequity). Your editor's verdicts #5, #8, and #10 show she prioritizes preventing these errors over nuanced statistical accuracy.  

  **Key nuance:** Heritability isn't a "genetic contribution" metric—it's the proportion of *current population variance* explained by genes. Rule 2 blocks the most common and harmful misinterpretations while accommodating robust adoption-study conclusions.
