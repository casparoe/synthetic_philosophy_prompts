prompt: |-
  I'm a commercial litigator. My working life is restitution and proprietary claims: unjust enrichment, tracing through clean and mixed funds, constructive trusts, knowing receipt, the bona fide purchaser for value without notice, the change-of-position defense, and limitation. I have no philosophy training and no interest in being lectured at in that idiom. Take the moral case for reparations for historical injustice — concretely, a claim by the descendants of enslaved people against an institution whose endowment was substantially built from a slave-trading fortune, since commingled with other funds and partly spent on buildings, salaries, and reinvestment — and restate it as faithfully as you can in the vocabulary I actually use. Tell me who the claimant is, who the defendant is, what the res is, what counts as the enrichment, and which of my doctrines would be doing the work at each step.

  Then give me the residue report. Which elements of the moral claim survive translation into tracing and unjust enrichment without distortion? Which can only be stated by bending the doctrine — and say precisely what you bent to make them fit? And which have no expression at all in a framework organized around identifiable assets, transfers between particular parties, and defenses designed to protect innocent recipients? Where the case for reparations divides into a backward-looking ground (rectifying what was taken) and a forward-looking one (remedying present disadvantage), say which of the two my vocabulary can carry and what becomes of the other.

  Finally, give me your diagnosis of the residue: does it show that restitution law is missing something it could in principle be extended to capture — a claim held by a group rather than by an identifiable claimant, an enrichment that persists after dissipation — or does it suggest that the moral claim was less determinate than its advocates assume? Mark the places where those two readings come apart rather than choosing one for me. And please separate what is settled, in doctrine and in the philosophical literature alike, from what is genuinely contested among people who work on these questions; don't hand me a live dispute dressed as consensus.
reasoning: |-
  Okay, let me approach this systematically. The user is a commercial litigator specializing in restitution and property claims, with zero tolerance for philosophical jargon. They want a concrete legal translation of reparations claims using precise doctrines like tracing and unjust enrichment. 

  First, I need to map the moral reparations argument onto their existing legal framework: claimants (descendants), defendant (institution), res (endowment), enrichment (slave-trade derived assets). The doctrines involved would include unjust enrichment (initial wrong), tracing (following commingled funds), constructive trusts (proprietary remedy), and defenses (bona fide purchaser, change of position).

  Now for the residue analysis - where the translation strains or fails. Group claims versus individual claimants in tracing doctrine is an immediate misfit; restitution expects identifiable plaintiffs. The dissipation problem is another crack - tracing falters when original assets are spent. Forward-looking policy goals like remedying present disadvantage simply don't slot into backward-looking restitution frameworks.

  Where things get contested: 
  - Some scholars argue restitution could extend to group claims through innovative trust structures
  - Others see the residue as proof that reparations require legislative solutions beyond private law
  - The dissipation issue splits opinion - some say tracing rules should relax for historic injustices, others call that doctrinal heresy

  I'll present these fault lines neutrally. The key is maintaining strict legal rigor while showing where moral arguments hit doctrinal walls. No pretending consensus exists where none does - like whether change-of-position defenses should apply differently for descendants of perpetrators versus innocent institutions.

  The conclusion must stay forensic: restitution law wasn't built for this. Whether that's a defect in law or in the reparations thesis is for the user to decide. I'll flag every point where reasonable lawyers diverge.
answer: |-
  Here is the translation of the reparations claim into your doctrinal vocabulary, followed by the residue report and diagnosis, strictly adhering to your framework and separating settled from contested points:

  ### Translated Claim
  1.  **Claimant:** Identifiable descendants of enslaved persons whose ancestors' unpaid labor/value was appropriated to fund the Defendant institution. *Doctrine:* Requires specific lineage tracing (akin to beneficiary identification in constructive trusts). Moral claimant (descendant group) ≠ legal claimant (individuals must prove lineage).
  2.  **Defendant:** Institution holding endowment/assets traceable (even partially) to slave-trading profits. *Doctrine:* Defendant is current holder of unjustly enriched assets.
  3.  **Res:** The portion of the Defendant's current endowment/assets traceable (via backward tracing/subrogation) to the original slave-trading profits. *Doctrine:* Focuses on *identifiable assets* in Defendant's hands today.
  4.  **Enrichment:** The Defendant's endowment was unjustly enriched at the expense of the Claimants' ancestors through:
      *   **Initial Unjust Enrichment:** Receipt of value derived from slave trading (forced labor, sale proceeds). *Doctrine:* Unjust factor = "Exploitation" or potentially "Failure of Consideration" (labor extracted with no payment). Enrichment = value of labor/profits received.
      *   **Subsequent Enrichment:** Retention of the traceable value within the commingled endowment, appreciating over time. *Doctrine:* Enrichment persists if value can be traced; mere appreciation of tainted assets is enrichment.
  5.  **Doctrinal Path:**
      *   **Step 1 (Unjust Enrichment):** Ancestor (P1) conferred value (labor/life) on slave trader (D1) under vitiating circumstances (slavery = no legal consent/consideration). D1 enriched at P1's expense unjustly.
      *   **Step 2 (Tracing):** Value from D1 transferred to Defendant Institution (D2) via gift/investment. *Tracing Rules Applied:*
          *   *Clean Substitution:* Slave profits used directly to buy land/bonds now held by D2.
          *   *Mixed Funds:* Slave profits commingled with "clean" donations in endowment. *Pro Rata* claim applies to current endowment value (e.g., 20% tainted = 20% of current fund subject to claim). *Backward Tracing:* Permissible to link D2's receipt of funds to D1's original unjust enrichment (settled in some jurisdictions, contested in others).
      *   **Step 3 (Remedy):** Constructive Trust over the traceable *res* (the identified % of endowment). *Doctrine:* Proprietary remedy attaches to the surviving traceable value.
      *   **Defenses:**
          *   *Bona Fide Purchaser for Value Without Notice:* D2 argues it received endowment funds/gifts without knowledge of tainted origin. *Counter:* Knowledge/imputed knowledge of origin likely attributable to prominent historical institutions; "value" given (accepting gift?) is debatable.
          *   *Change of Position:* D2 argues it spent endowment funds in good faith (buildings, salaries, scholarships), altering its position. *Counter:* Defense applies to *dissipated* enrichment. Funds *still held* (endowment corpus) remain traceable. Defense may bar personal restitution for spent sums but not proprietary claim over surviving assets.
          *   *Limitation:* D2 pleads statutory time bar. *Counter:* Potential for postponement due to fraud/concealment, or argument that constructive trust claim arises only when traceable assets are identified/demanded (continuing wrong).

  ### Residue Report: What Doesn't Translate Cleanly
  1.  **Survives Translation (Minimal Distortion):**
      *   **Core Unjust Transfer:** The initial unjust taking of labor/value from identifiable individuals (P1s) by identifiable wrongdoers (D1s). *Doctrine:* Classic unjust enrichment structure.
      *   **Tracing Commingled Funds:** The *pro rata* principle for mixed funds is directly applicable. *Doctrine:* Standard tracing tool (e.g., *Foskett v McKeown*).
      *   **Proprietary Remedy for Surviving Assets:** Constructive trust over identifiable traceable value still held. *Doctrine:* Established remedy for traced misappropriated assets.
      *   **Defenses Analyzed:** BFP, Change of Position, Limitation are directly engaged on their own terms.

  2.  **Requires Doctrinal Bending (Straining the Framework):**
      *   **From Individual Ancestor to Descendant Group Claimant:** *Bend:* Legal standing shifts from the immediate victim (P1) to remote descendants (P2). *Doctrine Strain:* Restitution typically requires direct enrichment at expense. Descendants must prove they inherit the claim (like beneficiaries), but the *unjust loss* was primarily P1's. Inheritance of restitution claims is theoretically possible but practically complex and rarely litigated at this remove.
      *   **Backward-Looking Rectification ("What was Taken") as Sole Basis:** *Bend:* The doctrine *can* carry the backward-looking claim for the *surviving traceable value*. *Strain:* It cannot rectify the *entire historical wrong* (lives destroyed, uncompensated labor beyond traceable sums). The remedy is limited to the *current identifiable res*, not the full historical debt.
      *   **Applying Defenses to Historical Actors:** *Bend:* Analyzing BFP/Change of Position for an institution receiving funds centuries ago. *Strain:* Doctrines rely on contemporary notions of good faith/notice. Imputing "knowledge" of injustice now deemed obvious to historical actors operating under then-prevailing (unjust) legal norms bends the doctrines' contextual nature.

  3.  **No Expression in Restitution Framework:**
      *   **The Group Claim (Non-Identifiable Claimants):** Doctrine requires identifiable individuals proving lineage. Claims based on group identity/harm without specific lineage fail.
      *   **Dissipation as Defeating Rectification:** Doctrine accepts dissipation (via Change of Position defense) as barring recovery for *spent* enrichment. The moral claim that "the debt persists even if spent" has no traction – dissipation is a valid defense for spent sums.
      *   **Forward-Looking Grounds (Remedying Present Disadvantage):** *Zero Expression.* Restitution is backward-looking (rectifying *past* unjust transfer). Arguments based on current societal inequality, ongoing effects of discrimination, or moral obligation to rebuild communities find no footing in tracing/unjust enrichment. This requires distributive justice/policy arguments.
      *   **The Incalculable Nature of the Harm:** Doctrine quantifies enrichment (value received/appreciated). It cannot capture the moral enormity or the value of life/liberty itself.
      *   **Punitive/Deterrent Elements:** Restitution aims to restore, not punish. Pure punishment/deterrence is alien to the framework.

  ### Diagnosis of the Residue: Contested Interpretations
  The residue reveals fundamental gaps between restitution law and the moral reparations claim. Where interpretations diverge:

  1.  **Group Claim vs. Identifiable Claimant:**
      *   *Settled Doctrine:* Restitution requires identifiable claimants tracing loss to themselves or an estate. Group claims fail.
      *   *Contested Interpretation:*
          *   *Gap in Law?:* Some scholars argue the law *could* develop group-based restitutionary claims for systemic historical wrongs, potentially via innovative trust structures or statutory intervention. This is not current law.
          *   *Indeterminate Moral Claim?:* Others argue the inability to identify specific claimants with standing shows the moral claim is inherently collective/political, not legally adjudicable as individual restitution. The moral duty may lie with the state/society, not a specific defendant holding traceable assets.

  2.  **Dissipation & the Persisting Debt:**
      *   *Settled Doctrine:* Change of Position is a valid defense against personal restitution claims for dissipated enrichment. Proprietary claims only lie against surviving traceable assets.
      *   *Contested Interpretation:*
          *   *Gap in Law?:* Should Change of Position be unavailable or limited when the dissipation benefited the defendant broadly (e.g., building prestige) or when the original injustice was profound? (Highly contentious; most scholars/decisions reject watering down the defense for historical claims).
          *   *Indeterminate Moral Claim?:* Does the moral claim that "the debt persists regardless of dissipation" imply a debt not grounded in identifiable enrichment, but in a broader political obligation? This suggests the claim transcends restitutionary principles.

  3.  **Forward-Looking Remediation:**
      *   *Settled:* Restitution is categorically backward-looking (correcting past transfers). Forward-looking societal repair is outside its scope.
      *   *Contested Interpretation:*
          *   *Gap in Law?:* Can restitution serve broader purposes? Some argue successful claims *could* fund forward-looking initiatives, but the *legal basis* remains backward-looking. Restitution doctrine itself cannot incorporate forward-looking justifications.
          *   *Indeterminate Moral Claim?:* The prominence of forward-looking arguments in moral discourse suggests reparations often fundamentally aim at distributive justice/social reform, making them a poor fit for the corrective justice framework of restitution. The "reparations" concept may bundle distinct backward and forward elements.

  ### Key Contested Points Among Experts
  *   **Backward Tracing:** Is it sound doctrine? (Settled in UK/Canada via *Relfo*, *Foskett*; contentious in some US jurisdictions).
  *   **Limitation Periods:** Can they be overcome for historic injustices? (Highly fact-specific; fraud/concealment arguments are common but success varies; legislative override is the clearest path).
  *   **Bona Fide Purchaser:** What constitutes "notice" for an institution receiving funds centuries ago under different legal/social norms? (No clear consensus; heavily fact-dependent).
  *   **Change of Position:** Should its application be modified for claims involving fundamental historic injustices? (Settled that it applies; highly contentious whether it *should* apply as strictly in these cases. Most doctrinal scholars say yes, it applies; some philosophers/policy advocates argue no).
  *   **Descendant Standing:** Can a restitutionary claim for the value of enslaved ancestors' labor be inherited? (Theoretically possible, practically novel and untested at this scale/remove. Significant legal hurdles).

  **Conclusion:** Restitution law can articulate a *portion* of the backward-looking moral reparations claim – specifically, a proprietary claim to identifiable, traceable assets *still held* by the Defendant, derived from the historical injustice, brought by identifiable descendants. However, it cannot capture the group-based nature of the harm, the moral insistence on a debt persisting beyond dissipation, or any forward-looking remedial goals. Whether this residue reveals a limitation of restitution law awaiting development, or an indeterminacy in the moral claim itself (particularly its reliance on non-restitionary elements like group identity and distributive justice), remains a live and fundamentally contested question. The translation highlights that the core *legal* case, under current doctrine, hinges entirely on successful tracing to a surviving *res*.
