  I need to identify the most damaging objection first. The key issue seems to be the gap between their theoretical model and practical clinical reality. Clinicians deal with immediate, messy situations where bright-line rules are necessary for decision-making. If they can't address how their theory applies in real time with distressed families, clinicians might dismiss the entire argument as irrelevant to their daily work.

  For the prep sheet, I'll start with that bottom line: the clinical applicability objection sinks the argument if unanswered. Then I'll list other objections in order of damage potential. For each, I'll phrase it as the audience would—geriatricians with hallway stories, lawyers with statutory interpretation concerns, Parfitians with metaphysical challenges. Each response should be concise (two-minute reply level), with soft spots flagged and concession advice. I'll also note which objections to preempt in the talk itself and identify the critical reply that must land.

  The "hope nobody asks" question will likely be about practical implementation—how to operationalize psychological continuity assessments in real-world settings. The deflection would acknowledge the theory's current impracticality while emphasizing its diagnostic value for critiquing existing systems.

  I'll structure the response starting with the bottom-line verdict, then ordered objections with: (1) audience-phrased question, (2) concise reply, (3) soft spot/concession tip, (4) preemption flags. Finally, the critical reply to protect and the dreaded question with deflection.
answer: |-
  **Bottom line: The objection that sinks this argument if unanswered is the clinical applicability gap — your model offers no operational guidance for real-time decisions with distressed families, making clinicians dismiss it as philosophically interesting but practically inert.**

  ### Q&A Prep Sheet (Highest to Lower Damage)
  1.  **Geriatrician/Palliative Nurse Objection (The Hallway Reality Check):**
      *   **Phrased:** "This is fascinating, but Tuesday afternoon I have a daughter screaming in the hallway because Mom (moderate dementia, signed an AD refusing feeding tubes) is now aspirating and seems distressed when she eats. According to you, how much of 'Mom' is left? 40%? 60%? How do I *measure* that *right now* to decide whether to honor the directive or intervene? Your degrees sound impossible to apply when I need to act."
      *   **Reply:** "You're absolutely right, my theory doesn't give you a clinical scoring tool. It diagnoses *why* this moment feels like a scandal: the directive clashes with the *current* person's needs/expressions. My point isn't that *you* calculate continuity; it's that the *felt moral tension* arises precisely because the obligation *isn't* absolute anymore. The law gives you a bright line (capacity at signing), but that feels wrong because continuity *has* degraded. My framework explains *why* the bright line feels crude and *why* good clinicians wrestle. It argues against *automatic* enforcement, not *for* an impossible calculation. You still need clinical judgment *informed* by the directive and the current person's state."
      *   **Soft Spot/Concede:** Concede it provides **no practical metric**. Emphasize it explains the *conflict*, not how to resolve it clinically in the moment. Don't try to invent a metric on the fly. Focus on validating their experience of the dilemma as *real*.
      *   **Preempt? YES.** Briefly acknowledge the operational gap in your talk when discussing the law's crudeness. Say: "This framework explains the *source* of the tension clinicians face daily, not how to algorithmically resolve it."

  2.  **Health Lawyer Objection (Legal Chaos & Patient Vulnerability):**
      *   **Phrased:** "You're undermining the entire point of advance directives! The law *needs* bright lines for predictability, protecting patient autonomy at the point of competence, and preventing disputes or abuse. If obligation is graded, doesn't that open the door for families (or institutions) to argue 'Grandma's only 30% there, we can ignore her living will' whenever it's inconvenient? How do we protect vulnerable patients from that?"
      *   **Reply:** "The legal system absolutely needs workable rules, and bright lines serve vital purposes like predictability and preventing bad-faith challenges. My target is the *moral* claim that the directive creates an *absolute* obligation *because* it was competently signed. The law can (and does) use the bright line as a strong *presumption* or *default rule* for good practical reasons, even while acknowledging the underlying moral reality might be messier. The vulnerability concern is real, but *does* the current bright line always protect? Doesn't it sometimes force treatment on someone who *now* clearly expresses dissent? The law's presumption can hold *while* we develop better processes (like supported decision-making, better AD drafting) that acknowledge this moral complexity *within* the legal framework."
      *   **Soft Spot/Concede:** Concede the **necessity of legal bright lines for functionality and protection**. Your argument is primarily *moral/philosophical*, critiquing the *justification* for absolute obligation, not necessarily proposing immediate legal overhaul. Frame it as a reason to refine legal *processes* and *interpretations* around ADs, not scrap them.
      *   **Preempt? YES.** Explicitly state in your talk: "This is a *moral* analysis. I recognize the law requires practical rules, but I argue those rules rest on a philosophically shaky foundation regarding obligation that becomes starkly visible in dementia cases."

  3.  **Parfitian Philosopher Objection (The Reductionist Ambush):**
      *   **Phrased:** "You rely heavily on 'psychological continuity' carrying commitments forward. But Parfit showed continuity can be branching (fission), gappy, or held impersonally through R-relations. If obligation is tied to continuity degrees, what happens in a fission case? Do two successors each have 50% obligation? And doesn't your view collapse into saying obligation is just about current psychological states connected *in any way* to a past commitment, potentially held by *anyone* who inherits relevant mental states? How is this 'promise-keeping'?"
      *   **Reply:** "Fission is a challenge, but it's remote from clinical reality. My core claim is that *within a single stream of consciousness* (the standard case), obligation degrades as the direct, strong psychological connections holding the *specific commitment* fade. It's not about *all* mental states, but the persistence of the specific intention/obligation sense *itself* through connected psychological states. If the connection is broken (e.g., total amnesia), the obligation lapses. Fission might require apportioning, but that doesn't negate the core gradedness in standard identity preservation. This view *distinguishes* promise-keeping from mere reliance because it requires the obligation to be *carried within* the psychological successor of the promiser."
      *   **Soft Spot/Concede:** Concede **fission is messy** and your primary focus is the non-branching, gradual degradation typical of dementia/aging. Don't get bogged down in sci-fi. Emphasize the connection to the *specific commitment*.
      *   **Preempt? NO.** Likely only the philosophers will go here. Handle it if it comes.

  4.  **Clinician/Lawyer Objection (Reliance is King):**
      *   **Phrased (Clinician):** "But surely the *harm* matters most? If a patient promised their spouse they'd refuse aggressive treatment, and the spouse built their whole retirement plan and emotional coping around that promise, doesn't the *spouse's reliance* create a strong obligation regardless of how much 'continuity' is left? Isn't that the real moral weight?"
      *   **Phrased (Lawyer):** "Contract law often focuses on reasonable reliance to enforce promises. Why isn't the promisee's reliance the actual source of the obligation's strength, not some internal continuity metric?"
      *   **Reply:** "Reliance is incredibly important! But it's distinct from the *promissory obligation itself*. The reliance view struggles with promises where *no* reliance occurs (e.g., deathbed promises with no witnesses), yet we still feel a pull. More crucially, reliance doesn't explain *why* we hold *this specific person* (the promiser's successor) responsible. My view *incorporates* reliance: the promisee's standing to hold *you* responsible arises *because* you are the successor carrying the commitment. If continuity is very low, the *promisee's reliance* might create a *different* obligation (e.g., of compassion, non-abandonment), but the *specific promissory* obligation is weakened. They are linked but distinct."
      *   **Soft Spot/Concede:** Concede **reliance is a major source of moral weight** in *many* promise contexts. Your point is that it doesn't fully capture the *source* of the obligation *on the promiser* or explain its persistence/degredation *in the promiser*. Frame reliance as a crucial *consequence* of promising, not its core justificatory structure.
      *   **Preempt?** Briefly contrast with the reliance view during your critique.

  5.  **Neuropsychologist Objection (Capacity is What We Have):**
      *   **Phrased:** "I assess capacity daily. It *is* a bright line, but it's the best tool we have that's objective-ish and legally defensible. You call it crude, but how is your 'psychological continuity for obligation' any less vague or subjective? At least capacity assessments have structured tools (MMSE, MoCA, clinical interview). What's *your* operational definition of the continuity carrying the commitment?"
      *   **Reply:** "You're right, capacity assessment is the best *practical, legal* tool we have right now, and I respect the skill involved. My critique is *philosophical*: capacity at T1 doesn't guarantee the *moral authority* of that past self over the future self at T2, *especially* when psychological discontinuity is significant. My 'continuity' isn't proposed as a *replacement assessment tool*; it's the underlying *moral factor* the capacity test crudely approximates for practical purposes. The vagueness of continuity is a feature of the moral reality, not a flaw in my theory. The capacity test works *because* significant continuity decline often correlates with capacity loss, but the correlation isn't perfect, hence the 'scandal' in edge cases."
      *   **Soft Spot/Concede:** Concede **capacity assessment is the necessary practical standard**. Your argument highlights its *philosophical limitations* and why cases falling near the line feel ethically fraught. Don't claim your view offers a better *clinical assessment*.
      *   **Preempt?** Address when critiquing the bright line.

  6.  **Clinician Objection (The "Normal Aging" Dodge):**
      *   **Phrased:** "You say we pretend people don't change between 30 and 50. But most 50-year-olds *do* feel obligated by their 30-year-old self's major promises (mortgages, marriage vows). They might reinterpret them, but the obligation feels strong. Isn't dementia categorically different? Isn't that why ADs *feel* scandalous – it's not just change, it's *erosion*?"
      *   **Reply:** "Dementia makes the erosion stark and undeniable, but the *mechanism* is the same: psychological continuity degrades over time. The obligation *does* weaken subtly. The 50-year-old feels bound partly *because* of strong continuity, but also through social reinforcement and ongoing identification with the past self. The promise feels 'theirs' because it *is* largely carried forward. In dementia, the continuity is so fractured that identification *by the current self* often breaks, making enforcement feel alien. The difference is degree, not kind. The scandal reveals the background truth: obligation depends on persistence of the *self* that committed."
      *   **Soft Spot/Concede:** Concede **dementia represents a *pathological* acceleration/severity** of normal aging processes. Agree it's a *paradigm* case, but argue the underlying principle applies universally. Don't overstate the weakening in normal cases.
      *   **Preempt?** Briefly touch on the "normal aging" point in the talk.

  7.  **Practice Theorist Sympathizer Objection (It's the Institution, Stupid):**
      *   **Phrased:** "Isn't the strength of a promise fundamentally about upholding the social practice? We *need* promises to be generally reliable for society to function. Grading obligation based on internal states seems to undermine the practice's stability. Doesn't the 'practice view' better explain why we hold people responsible even if they've 'changed'?"
      *   **Reply:** "The practice is essential for the *existence* of promissory obligations – it creates the norm. But the practice view struggles to explain *who* bears the obligation *specifically* and *why it persists or weakens over time for that individual*. If the practice solely determined strength, a promise made yesterday by someone with early dementia (low future continuity) should be as strong as one made by a healthy 25-year-old. But intuitively, we might hold the latter more firmly responsible long-term. My view explains *how* the practice attaches the obligation *to a specific persisting entity* and why that attachment weakens as the entity fragments."
      *   **Soft Spot/Concede:** Concede **the social practice is the necessary background condition**. Your view explains the *micro-foundations* of obligation *within* the practice – how it binds *individuals* over time. Frame as complementary, not wholly oppositional.
      *   **Preempt?** Covered in your critique section.

  8.  **The "What About Repentance?" Objection:**
      *   **Phrased:** "If I sincerely repent a promise and change my core values, haven't I severed psychological continuity *deliberately*? Does your view mean I'm *less* obligated? That seems counterintuitive – repentance might even strengthen my sense of needing to make amends, not weaken the original obligation."
      *   **Reply:** "Repentance is fascinating! It involves *acknowledging* the past commitment and actively *disidentifying* with it. This *does* represent a kind of psychological discontinuity regarding *that specific commitment*. However, the *recognition* of the obligation and the act of repentance often creates a *new*, derivative obligation (to apologize, make amends). The original promissory obligation *itself* might weaken because the persistent psychological state holding it is actively repudiated, but the *moral landscape* becomes more complex due to the new actions/obligations arising from the repentance."
      *   **Soft Spot/Concede:** This is **nuanced**. Concede repentance doesn't simply erase the past. Emphasize it involves *active alteration* of psychological continuity *regarding the promise*. The key is the *fate of the specific intention/obligation-sense*.
      *   **Preempt?** Unlikely to be top-of-mind. Handle if asked.

  **The Reply That MUST Land:** Your response to **Objection #1 (Clinical Applicability Gap)**. If clinicians think this is just philosophy with no bearing on their reality, you lose them entirely. Emphasize: *"My framework doesn't give you an algorithm; it explains why the dilemma you face daily is a genuine moral tension inherent to promising itself, not a flaw in ADs or your judgment. It argues against rigid *automaticity*, not for abandoning ADs or your clinical expertise."*

  **The Question You Hope Nobody Asks (The Implementation Nightmare):**
  *   **Question:** "Okay, suppose we accept your moral theory. Forget the clinicians for a second. *How would you actually design a legal or policy framework* for advance directives that incorporates 'graded obligation based on psychological continuity'? What would the decision-making process look like? Who assesses continuity? What thresholds trigger what obligations? Give me a concrete procedural sketch, because otherwise, this remains pure theory with no path to impact the real suffering we see."
  *   **Least Bad Deflection:** "That's the critical next step, and honestly, I don't have a fully fleshed-out procedural model – it's a massive challenge requiring input from ethicists, lawyers, clinicians, and patients. My goal today is the foundational step: showing *why* our current *moral* justification for absolute AD enforcement is flawed, creating the tension clinicians experience. Acknowledging this gradedness *morally* might push us towards legal reforms like: stronger emphasis on *ongoing* dialogue and supported decision-making *before* significant decline; clearer mechanisms for incorporating *current* expressions of well-being/wishes alongside the AD; perhaps different evidentiary standards for overriding directives based on *demonstrated* radical discontinuity. But designing that system? That's the crucial work this diagnosis should spark, not something I can solve in this paper. My aim is to show *why* we need to start that conversation." (Acknowledge the gap, deflect to the diagnostic value of the theory, suggest *directions* without claiming solutions).
