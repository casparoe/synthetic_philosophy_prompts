  The user's core tension is between two valid but conflicting intuitions: "it's just convention, do what's efficient" versus "you're a guest, respect the system." They want this resolved through a structured decision tree grounded in the practical function of social rules, not philosophical theory. 

  Key pain points they highlighted: 
  - Duration of stay (does short-term residency change obligations?) 
  - Empty-scenario exceptions (like jaywalking at midnight)
  - Variable local compliance (when "the norm" isn't uniform)
  - Normative protest (e.g., tipping as protest against unfair labor practices)

  The four test cases are brilliantly chosen to stress-test the framework: 
  1. Queue-defiance in a chaotic bus system 
  2. Tipping as political statement 
  3. Symbolic rule-following with children observing 
  4. Bribery disguised as "facilitation fees"

  I'll build a five-step procedure that prioritizes real-world consequences over abstract ethics: 
  Step 1 assesses if the rule prevents tangible harm (e.g., traffic accidents). 
  Step 2 checks for reliance—does breaking it actively screw someone over? 
  Step 3 evaluates enforcement/shaming costs. 
  Step 4 examines collective action problems. 
  Step 5 flags residual value judgments to the client. 

  Crucially, steps 2 and 3 are judgment calls disguised as analysis—I'll be transparent about that. For the bribery case, the procedure must output "no" without ambiguity by emphasizing harm and illegality. 

  The summary table will show: 
  - The Swede should queue-scrum (harmless inefficiency ≠ harm) 
  - Australian shouldn't protest-tip (workers bear costs) 
  - Teen obeys red light (modeling behavior for child) 
  - Clerk bribe rejected (extortion isn't convention) 

  Finally, I'll note limitations: the framework can't resolve deep value conflicts (e.g., religious objections) and misfires when local compliance is hyper-localized. But it covers 90% of panicked expat queries in under five minutes.
answer: |-
  Here's your five-minute convention assessment procedure:

  **Procedure: Should I Follow This Local Convention?**
  1.  **Harm Check:** *"Would breaking this rule here/now cause immediate, tangible harm to anyone (physical, financial, emotional distress)?"*
      *   **Yes:** STOP. **You ought to follow it.** (e.g., driving on the wrong side of the road).
      *   **No:** Proceed to Step 2. (Judgment Call: Defining "harm" can be fuzzy).

  2.  **Reliance Check:** *"Is someone actively relying on me following this rule right now, such that breaking it would directly mess up their plans or expectations?"*
      *   **Yes:** STOP. **You ought to follow it.** (e.g., showing up for a confirmed appointment, paying a contracted worker).
      *   **No:** Proceed to Step 3. (Judgment Call: Assessing "direct reliance" vs. general expectation).

  3.  **Cost Check:** *"If I break this rule, who bears the cost? Is it me (awkwardness, fine) or someone else (loss, extra work, social sanction)?"*
      *   **Cost on Me:** **You're free not to** (if you accept the personal cost - e.g., weird looks for jaywalking alone).
      *   **Cost on Others:** Proceed to Step 4. (Judgment Call: Quantifying social/financial costs on others).

  4.  **System Check:** *"Is this rule part of a system that only works if mostly followed? Would my breaking it significantly undermine that system or encourage others to break it when it *would* cause harm/reliance problems?"* Consider length of stay: short stays reduce systemic damage risk.
      *   **Weakens System:** **Your call, but here's the cost you'd be imposing** (e.g., skipping a bus queue weakens the queueing norm, potentially causing future chaos).
      *   **No Systemic Risk:** **You're free not to** (e.g., crossing against light at 11pm on empty street).
      *   **Locals Defect Often:** This *reduces* systemic risk/cost imposition. **You're free not to**, but note inconsistency may draw *more* attention. Proceed to Step 5 if protest is the motive.

  5.  **Values Handoff:** *"Is your desire to break this primarily a protest against perceived injustice?"*
      *   **Yes:** **Handoff to Client.** "This is a values question. You need to weigh the effectiveness/safety of your protest against the costs identified in Steps 3 & 4. We can discuss potential consequences."
      *   **No:** The assessment is complete based on previous steps.

  ---

  **Case Applications:**

  | Case                                       | Verdict                                | Decisive Step | Confidence      |
  | :----------------------------------------- | :------------------------------------- | :------------ | :-------------- |
  | (1) Swede: One-man queue in scrum city     | Follow the scrum / Stop queueing alone | Step 4        | High            |
  | (2) Aussie: Protest-tipping 8% + note      | Don't protest-tip (Pay 20%)            | Step 3        | High (cost on server) |
  | (3) US Teen: Jaywalking w/ host kid watching | Wait at the light                     | Step 2 (Reliance - modeling for child) | Medium-High |
  | (4) Client: "Facilitation fee" bribe       | Do NOT pay                             | Step 1 (Harm - corruption) & Step 3 (Cost - perpetuates harm) | High     |

  **Case 4 Explanation:** Fails Step 1 (corruption causes systemic harm & insecurity) and Step 3 (cost is borne by society/perpetuates injustice). Illegality reinforces this. **Who eats the cost?** The client (delayed permit) and society (continued corruption). The procedure outputs "No" because the "fee" is harmful extortion, not a harmless convention.

  ---

  **Limitations & Misfires:**
  1.  **Defining Harm/Reliance (Steps 1-3):** Judgment calls are inherent. Is "offense" harm? Is "setting a bad example" reliance? The procedure guides but doesn't eliminate subjectivity.
  2.  **Hyper-Local Variation:** If norms differ wildly block-by-block, the "local convention" is unclear, making assessment noisy.
  3.  **Values Protests (Step 5):** The procedure flags the protest *as* a values choice with potential costs, but *cannot* judge the justice of the cause or protest effectiveness. That's firmly the client's domain.
  4.  **Complex Systemic Effects:** Predicting downstream effects of one-off defections (Step 4) is inherently uncertain, especially for short-term visitors. Confidence varies.
