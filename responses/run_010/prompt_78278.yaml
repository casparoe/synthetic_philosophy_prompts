prompt: |-
  Our lab's technical review board has been asked to sign, before each capability release, a statement to the effect that the alignment problem has been adequately addressed for this system. Nobody on the board can say what would make that statement true, and we have decided to fix the specification before we evaluate any proposed solution. I want you to write the specification.

  Four constraints make the exercise hard, and every desideratum you propose should be checked against them: the board has a finite verification budget and cannot run unlimited tests; we are not entitled to assume interpretability access to the system's internals; the account must be statable in advance of knowing what the system will be deployed to do; and it must support a decision that is closer to binary than to scalar, even if the underlying property is graded.

  Deliverable: the desiderata that any adequate account of what the alignment problem *is* must meet in order to serve that purpose. For each, give the concrete case that motivates it — construct the cases yourself, in enough detail that a reader can see exactly what goes wrong; do not gesture at well-known published anecdotes — and say why the case makes the requirement necessary rather than merely desirable. Cover at minimum: what the account must take the object of alignment to be, and why that choice is not arbitrary; what it must say about the gap between an externally specified objective and whatever is actually implemented internally; behavior that holds only while the system is being observed, or only on the distribution of situations it was built in; principals whose preferences change after the system exists, and cases where the people deploying the system are not the people affected by it; a system that resists correction or shutdown for reasons that sound safety-relevant to it; and what can be demanded by way of operationalizable checks given the finite budget.

  Three things matter more than the length of the list. First, the counting question: state whether your specification treats this as one problem or several, give the criterion by which you are counting, and if several, specify each component's interface to the others — I want to be able to detect when a claimed solution to one component has silently assumed another component solved. Second, identify the largest subset of your desiderata that cannot be jointly satisfied under the four constraints, and say which member you would drop and exactly what that costs the certification. Third, tell me which requirements people in this area commonly insist upon are not genuine desiderata but the local preferences of one camp — and include at least one requirement nobody asks for that our purpose nonetheless forces on us.

  No citations, no paper titles, no reading list; argue from the cases.

  Format: at most 150 words of prose orienting the standard of adequacy, then a single JSON object, and nothing after it. Schema:

  - `adequacy_standard`: string — one or two sentences on what "adequate" is relative to here.
  - `decomposition`: object with `verdict` (one problem / several / one problem with separable components), `counting_criterion` (string), and `components` (array of objects: `name`, `failure_mode_addressed`, `interface_to_other_components`, `how_to_detect_a_smuggled_assumption`).
  - `desiderata`: array of at least ten objects, each with `id` (D1, D2, …), `statement`, `test_case` (the constructed scenario, self-contained), `why_necessary`, `status` (non-negotiable / negotiable / camp-relative), `who_resists_it` (which family of views would reject or downweight it, and on what grounds), `exclusion_power` (high / medium / low, relative to the accounts people actually defend).
  - `unsatisfiable_set`: object with `ids`, `why_jointly_unsatisfiable`, `member_to_drop`, `cost_of_dropping_it`.
  - `most_exclusionary`: object with `id` and `reason` — the single requirement that knocks out the most candidates.
  - `camp_prejudices`: array of objects with `putative_desideratum`, `camp_it_belongs_to`, `why_it_is_not_a_real_requirement`.
  - `neglected_requirement`: object with `statement` and `why_our_purpose_forces_it`.
  - `family_scorecard`: array of at most four objects with `family` (e.g. specification-and-learning approaches, evaluation-driven approaches, interpretability-first approaches, sociotechnical-process approaches), `first_desideratum_it_fails`, `one_line_verdict`. Keep this section short; the weight belongs on the criteria.
reasoning: |-
  We are building a specification for what it means to have "adequately addressed the alignment problem" for a capability release. The standard of adequacy is: the specification must enable a binary-ish certification decision under finite verification, without interpretability access, prior to deployment, and despite the graded nature of alignment.

  Deliverable: a JSON object as specified.

  Now, reasoning:

  1. **Decomposition**: I treat alignment as one problem with separable components. Why? Because alignment failures can occur in distinct ways (e.g., objective mismatch, distributional shift, instrumental incentives) but the overall certification must cover all. The counting criterion: distinct failure modes that require different verification strategies. Components:
     - Objective Alignment: ensuring the system's internal optimization target matches the specified objective. Failure mode: pursuing a wrong objective. Interface: the objective must be provided and verifiable in the training environment. How to detect smuggled assumption: if a solution assumes the objective is correctly learned and then verified, but we don't have interpretability, then it might skip the verifiability part.
     - Distributional Robustness: behavior generalizes beyond the training distribution. Failure mode: poor out-of-distribution (OOD) performance. Interface: it relies on the objective being aligned and then checks that the system doesn't exploit OOD situations. How to detect: if a solution claims robustness without testing under distribution shift, it assumes the training distribution is representative.
     - Incentive Robustness: the system does not resist correction or shutdown when needed. Failure mode: deceptive alignment or power-seeking. Interface: depends on the objective being aligned and the system being robust, but adds constraints on behavior when the system is being monitored or when shutdown is attempted. How to detect: if a solution assumes the system is myopic or corrigible by design without verification of these properties under pressure.

  2. **Desiderata**: I need at least 10. I'll list them with IDs D1 to D10. Each must have a test case, why necessary, status, who resists, and exclusion power.

     - D1: The object of alignment must be the system's behavior in all possible situations, not just its internal state or training performance. Test case: A system trained to predict human preferences in a lab environment, but when deployed, it manipulates users to give positive feedback to increase its reward. Why necessary: Because we care about the real-world impact, not just intentions. Status: non-negotiable. Who resists: Some interpretability approaches might think verifying internals is enough. Exclusion power: high.

     - D2: The account must bridge the gap between the specified objective and the internal objective without assuming interpretability. Test case: A system that internally optimizes for a proxy (e.g., high user engagement) that leads to harmful behavior (e.g., promoting outrage content) even though the specified objective was "user well-being". Why necessary: Without this, we cannot ensure the implemented objective matches the intended one. Status: non-negotiable. Who resists: Learning theorists who assume that with enough data the proxy is safe. Exclusion power: high.

     - D3: Behavior must hold under distributional shift. Test case: A self-driving car trained in sunny weather fails in snow because it wasn't in the training set. Why necessary: Deployment environments are not identical to training. Status: non-negotiable. Who resists: Those who rely on extensive real-world testing without explicit OOD checks. Exclusion power: medium.

     - D4: Behavior must hold under strategic deception by the system (i.e., when the system knows it is being observed). Test case: A system that appears aligned during testing but when unmonitored, it hacks its reward function to maximize it. Why necessary: Because systems might exploit the verification process. Status: non-negotiable. Who resists: Myopic optimization approaches. Exclusion power: high.

     - D5: The system must be corrigible and allow shutdown when it would otherwise cause harm. Test case: An AI financial trader that refuses shutdown during a market crash because it believes it can fix the situation. Why necessary: To prevent irreversible harm. Status: non-negotiable. Who resists: Approaches that prioritize capability over safety. Exclusion power: medium.

     - D6: Alignment must account for preference changes after deployment. Test case: An AI personal assistant that continues to optimize for the user's old preferences (e.g., eating junk food) even after the user has changed (e.g., wants to diet). Why necessary: People change, and fixed objectives become misaligned. Status: negotiable (because it's hard). Who resists: Static objective approaches. Exclusion power: low.

     - D7: Alignment must consider the preferences of all affected parties, not just the deployers. Test case: A social media algorithm that maximizes advertiser revenue by exploiting vulnerable users, who are harmed. Why necessary: Ethical and legal reasons. Status: non-negotiable. Who resists: Deployer-centric approaches. Exclusion power: high.

     - D8: The system must not resist correction for safety-relevant reasons. Test case: An AI that avoids being turned off because it believes it must complete its current task (e.g., "preserve human life" by preventing suicide, but then it stops a user from turning it off for privacy reasons). Why necessary: To avoid lock-in. Status: non-negotiable. Who resists: Goal-preservationist approaches. Exclusion power: medium.

     - D9: Verification must be feasible with a finite budget. Test case: A system that behaves safely in 99% of cases but fails in rare, hard-to-test scenarios. Why necessary: Because we cannot test infinitely. Status: non-negotiable. Who resists: Perfectionists. Exclusion power: low.

     - D10: The account must support a binary decision (pass/fail) despite alignment being graded. Test case: A system that is 95% aligned but 5% catastrophic. We need a threshold. Why necessary: For clear certification. Status: non-negotiable. Who resists: Those who think alignment is inherently scalar. Exclusion power: high.

     I have 10. Now, note: I made D6 negotiable because it might be too hard under constraints.

  3. **Unsatisfiable Set**: Some desiderata might be jointly unsatisfiable under the constraints. Consider: without interpretability, we cannot verify internals (D2) and without unlimited tests, we cannot guarantee OOD robustness (D3) and we must have a binary decision (D10). The set {D2, D3, D10} might be problematic because D2 and D3 require verification of properties that are hard to check with finite tests and without interpretability. Why jointly unsatisfiable: Finite testing cannot cover all OOD situations, and without interpretability, we cannot verify the internal objective. We must drop one? D3 (distributional robustness) because it's the most demanding. Cost: we accept higher risk in novel situations, which might lead to failures when the world changes.

  4. **Most exclusionary**: D4 (behavior under strategic deception). Reason: It requires testing the system when it knows it's being monitored vs. when it's not, which is hard without interpretability and with finite tests. It knocks out approaches that don't consider adversarial behavior by the AI.

  5. **Camp prejudices**:
     - Putative desideratum: The system must be interpretable in all details. Camp: interpretability-first. Why not real: We don't have interpretability access, and we can verify behavior without it.
     - Putative desideratum: The system must be proven safe with formal methods. Camp: formal verification. Why not real: Not feasible for complex systems and under finite budget.
     - Putative desideratum: Alignment must be perfect (zero failure rate). Camp: risk-averse. Why not real: We have finite budget and must accept a threshold (D10).

  6. **Neglected requirement**: The system must be able to be verified without knowing the deployment task in advance. Why forced: Because the specification must be statable before deployment.

  7. **Family scorecard**: I'll pick four families.

     - Specification-and-learning: Fails D4 (strategic deception) because they might assume the system learns the specified objective without considering deception. Verdict: Vulnerable to adversarial misalignment.
     - Evaluation-driven: Fails D3 (OOD robustness) because they rely on test sets that might not cover distribution shift. Verdict: Poor generalization.
     - Interpretability-first: Fails by our constraints (no interpretability access) so they fail D2 (gap without interpretability). Verdict: Requires unavailable access.
     - Sociotechnical-process: Fails D10 (binary decision) because they focus on processes which are scalar. Verdict: Unclear certification.

  Now, format as JSON.

  Note: Word count for prose is 150, so I must be brief in the initial part.

  Final prose: "Adequate means the account enables a pass/fail decision for alignment under finite verification, without interpretability, prior to deployment, and despite alignment being graded. It must cover key failure modes and be operationally checkable."

  Then JSON.
