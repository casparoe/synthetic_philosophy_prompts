answer: |-
  Here's your numbered menu dissecting "facts don't kill theories — only better theories do," with verdicts and application to your colleague's defense. "Kill" is parsed as *logical falsification* (KF) vs. *rational abandonment* (KA). "Better" means *explanatory/predictive superiority* unless specified. The ambiguity of "theory" (Core, Core+Belt, Programme) is addressed per claim.

  ### Core Interpretations & Verdicts
  1.  **Duhem-Quine Thesis (Underdetermination - Weak Form)**
      *   **Precise Claim:** No single "fact" (observation) logically falsifies a *specific theoretical core* in isolation because auxiliary hypotheses (Core+Belt) or background assumptions can always be adjusted to accommodate the anomaly. "Kill" = KF. "Better" = logically/internally consistent alternative.
      *   **Verdict:** Truism (logical point about confirmation holism).
      *   **Licenses Colleague?** No. Explains why anomalies don't *logically force* core abandonment, but doesn't justify ignoring them indefinitely. Rational abandonment (KA) remains possible/pressing without a "better" theory. Applies best to Core+Belt.

  2.  **Underdetermination - Strong Form / Conventionalism**
      *   **Precise Claim:** *Any* theory (Core+Belt or Programme) can be preserved *logically* against *any* evidence by sufficiently radical revision of auxiliary assumptions or adding epicycles. "Kill" = KF. "Better" = irrelevant for KF, only needed for KA.
      *   **Verdict:** Defensible-but-contestable (extreme logical possibility vs. practical/rational limits). Often seen as a reductio of the weak form.
      *   **Licenses Colleague?** Superficially yes (logical possibility of saving Core+Belt), but ignores the *rational cost* (degeneration). Fits Core+Belt best; saving the *Core* alone via belt surgery is the point.

  3.  **No Crucial Experiments (Duhem)**
      *   **Precise Claim:** An experiment can never definitively falsify *one specific hypothesis* (Core) because it tests the *entire system* (Core+Belt). "Kill" = KF of a specific Core element. "Better" = not strictly required for the claim, implied for KA.
      *   **Verdict:** Truism/Defensible (logical point about testing composite systems).
      *   **Licenses Colleague?** No. Explains why anomalies don't *pinpoint* the faulty element (Core or Belt), but doesn't justify ignoring the *system's* failure. Applies to Core+Belt.

  4.  **Rational Abandonment Requires Alternative (Kuhnian/Lakatosian Pragmatics)**
      *   **Precise Claim:** Scientists won't (rationally) *abandon* a theory (Programme or Core+Belt) until a demonstrably *better* (more progressive, solving more puzzles/novel facts) alternative is available. "Kill" = KA. "Better" = possessing superior problem-solving ability (novel predictions, resolving anomalies).
      *   **Verdict:** Defensible-but-contestable (describes common scientific behavior; challenged by falsificationists who see persistent failure alone as sufficient for KA).
      *   **Licenses Colleague?** **Yes, superficially.** This is likely his *intended* meaning. "No better rival exists" is his reason to keep going. Fits Programme/Core+Belt. *But* see Follow-up 1 & Lakatos section.

  5.  **Sociological Persistence**
      *   **Precise Claim:** Scientific communities (*de facto*) continue working within a paradigm/programme (Programme) despite anomalies due to inertia, training, investment, until a compelling alternative gains traction. "Kill" = community abandonment. "Better" = sociologically compelling/viable alternative.
      *   **Verdict:** Truism (empirical observation of scientific practice).
      *   **Licenses Colleague?** **Yes, descriptively.** Explains *why* he keeps going and half the room nods. Doesn't justify it as *epistemically rational*. Fits Programme.

  6.  **Logical Falsificationism is Naive (Popper Critique Strawman)**
      *   **Precise Claim:** The simplistic Popperian view that a single counter-instance *logically falsifies* a universal theory (Core) is wrong. "Kill" = KF (naive version). "Better" = needed for KA.
      *   **Verdict:** Truism (Popper was more nuanced, but this rebuts a common simplification).
      *   **Licenses Colleague?** No. Corrects a misconception but doesn't license ignoring persistent failure or lack of progress. Applies to Core (naively conceived).

  7.  **Theories are Replaced, Not Refuted (Kuhnian Revolutions)**
      *   **Precise Claim:** Paradigms (Programmes) aren't "killed" by facts but replaced by *incommensurable* rivals during revolutions. Facts are paradigm-dependent. "Kill" = replacement. "Better" = offers a new, productive framework (though "better" may be contested).
      *   **Verdict:** Defensible-but-contestable (highly influential, debated view).
      *   **Licenses Colleague?** **Potentially.** If his programme is the reigning paradigm, lack of a viable *incommensurable* rival justifies persistence. Fits Programme. *But* ignores *degeneration within* a paradigm.

  ### Follow-up 1: The Role of "No Rival"
  *   **The Slide:** The colleague's move relies *entirely* on interpretation #4 (Rational Abandonment Requires Alternative). He slides from "No better theory *logically forces* abandonment" (weak Underdetermination - #1) to "No better theory *available* means I'm *entitled* to continue indefinitely" (#4).
  *   **Is "No Rival" a Reason?** It can function as a *pragmatic* or *sociological* reason (#5) for an individual/community to persist ("What else would we do?"). It is **not** an *epistemic* justification for the programme's truth or fertility. It conflates the *logical possibility* of saving the theory with *rational warrant* for doing so.
  *   **The Pin:** The key slide is between **contingency** ("no better rival exists *now*") and **rationality** ("therefore continuing *this specific programme* is the warranted course"). Absence of a rival doesn't make a degenerating programme *progressive* or *well-supported*; it just means there's no obvious exit.

  ### Follow-up 2: Lakatos Clarification & Application
  *   **Your Recollection is Correct:**
      *   Lakatos focused on **Research Programmes** (RP), not isolated theories.
      *   **Falsification:** A RP is only "falsified" when a *rival RP supersedes it* by explaining its previous success *and* predicting novel facts ("excess empirical content").
      *   **Progressive vs. Degenerating:** Appraisal is of the programme's *track record*. *Progressive*: Predicts & verifies novel facts. *Degenerating*: Merely accommodates known facts (often ad-hoc) or fails to predict novel ones.
      *   **Appraisal vs. Decision Rule:** Lakatos described how science *works* (historically/sociologically) – degenerating programmes often limp on for a long time without a rival. He offered a *methodology* for appraising programmes, not a strict *rule* that individuals *must* abandon a degenerating programme immediately if no rival exists. His norm is that scientists *should* work on progressive programmes.
  *   **Helps or Hurts Colleague?**
      *   **Hurts Epistemically:** By Lakatos's criteria, a programme that hasn't produced a novel prediction since the early 2000s is **clearly degenerating**. This is a *strong criticism*.
      *   **"Helps" Sociologically/Pragmatically:** Lakatos acknowledges degenerating programmes *can* persist without a rival ("The history of science has been and should be a history of competing research programmes... *or*... if you have an uncontested degenerating programme, the only 'competition' is, as it were, between the programme and nature" - and nature doesn't 'win' easily). So *de facto*, he can keep going.
      *   **Can Absence of Novelty "Kill"?** In Lakatos's framework, persistent degeneration *without* novel predictions **is the primary internal reason for appraising a programme negatively**. It *logically* necessitates the *possibility* of eventual abandonment even without a rival ("methodological falsification"). While a rival is needed for *supersession*, degeneration alone provides the *rationale* for seeking alternatives or abandoning the programme. Degeneration *is* the criticism – it signals the programme is failing its scientific purpose.

  ### Wrinkle: Ambiguity of "Theory" - Impact on Verdicts
  Applying the ambiguity explicitly to key interpretations:

  | Interpretation          | "Theory" = Core                      | "Theory" = Core+Belt                 | "Theory" = Programme                 | Impact on Colleague's License?                     |
  | :---------------------- | :----------------------------------- | :----------------------------------- | :----------------------------------- | :------------------------------------------------- |
  | **1. Duhem-Quine (Weak)** | Mostly True (KF impossible alone)    | Truism (KF impossible alone)         | N/A (Programme too broad)            | **Reduces:** Only shows KF impossible, not KA unjustified. |
  | **2. Strong Conventionalism** | True (but trivial)                   | Defensible                           | Less plausible (heuristics matter)   | **Increases:** Fits Core+Belt well, implies can always be saved logically. |
  | **3. No Crucial Expts** | Truism                               | Truism                               | Less relevant                        | **Neutral/Reduces:** Explains anomalies, doesn't justify ignoring them. |
  | **4. KA Needs Rival**   | Defensible (hard to abandon core alone) | Very Defensible                      | Very Defensible (Kuhnian)            | **Increases:** Strongest for Programme/Core+Belt - "no rival" seems key. |
  | **5. Sociological**     | Less relevant                        | Relevant                             | Truism                               | **Increases:** Explains persistence regardless of core/belt. |
  | **7. Kuhnian Revolutions** | Less relevant                        | Less relevant                        | Defensible                           | **Increases:** Positions whole programme as needing replacement. |

  **Key Takeaway on Ambiguity:** Your colleague likely conflates "Core" (protected by belt) with "Programme" (including its degenerating track record). Interpretations that help him (#4, #5, #7) work best when "theory" means the *whole Programme* or *Core+Belt system*. Interpretations that hurt him (Lakatos's degeneration) also apply to the *whole Programme*. Critically, **the lack of novel predictions is a criticism of the *Programme's* progressiveness, regardless of how the "core" is defined.**

  ### Summary Verdict for Colleague
  His defense (#4 + ambiguity) provides a *pragmatic/sociological* license to continue (*de facto*, he can). However, it provides **no *epistemic* justification**. Lakatos shows his programme is *degenerating*, which is a severe criticism demanding a response (seeking alternatives, modifying heuristics) – not complacency. "No rival" is a contingent fact, not a validation. His move relies on conflating logical underdetermination, pragmatic persistence, and epistemic warrant.
