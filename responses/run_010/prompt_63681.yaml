  1.  
  CASE: A patient agrees to join a study, saying the right words and signing the form in front of the coordinator. Inside, she intends no such thing but feels unable to refuse a doctor openly. Is her consent valid?  
  OPTIONS:  
  A) Yes, she said yes and signed.  
  B) No, she didn’t truly mean it.  
  KEY:  
  A) Commits to the view that consent is valid when the person outwardly agrees, regardless of inner intent. (Leaf: outer-act)  
  B) Commits to the view that consent requires genuine inner agreement. (Leaf: intention-required)  
  GAP: Cannot distinguish between a pure inner-authorization view and a hybrid view requiring both inner intent and outward agreement.  

  2.  
  CASE: The consent form accurately lists all study risks but omits that the participant’s tissue may be sold commercially. The recruiter knows she would care deeply about this, though it isn’t a standard risk. Is her consent valid?  
  OPTIONS:  
  A) Yes, the form covered all standard risks.  
  B) No, the recruiter knew she’d want to know this.  
  KEY:  
  A) Commits to the view that consent is valid if key objective risks are disclosed. (Leaf: restricted-disclosure)  
  B) Commits to the view that consent is invalid if undisclosed details matter to this person. (Leaf: unrestricted-disclosure)  
  GAP: none  

  3.  
  CASE: A person with no other way to afford essential needs accepts a large payment to join a study. It improves her situation, and no one threatens her. Is her consent valid?  
  OPTIONS:  
  A) Yes, she chose freely and benefits.  
  B) No, her need made refusal impossible.  
  KEY:  
  A) Commits to the view that consent is valid if no threats exist and the choice improves circumstances. (Leaf: threats-only)  
  B) Commits to the view that consent is invalid if background needs undermine true choice. (Leaf: background-circumstances)  
  GAP: none  

  4.  
  CASE: A competent young adult consents to a treatment that will permanently alter her personality and values, including how she views the treatment itself. Is her consent valid?  
  OPTIONS:  
  A) Yes, she understood the choice at the time.  
  B) No, she can’t foresee or endorse the future self.  
  KEY:  
  A) Commits to the view that consent is valid if understanding and decision-making capacity exist at that moment. (Leaf: at-the-time-capacity)  
  B) Commits to the view that consent is invalid if changes prevent aligning with future values. (Leaf: higher-order-identification)  
  GAP: none  

  5.  
  CASE: A person gives informed, unpressured consent to join a study requiring many participants. Her participation may harm unconsenting household members. Is her consent enough to proceed?  
  OPTIONS:  
  A) Yes, her consent covers her own choice.  
  B) No, effects on others or the group matter.  
  KEY:  
  A) Commits to the view that valid consent by the participant permits the action. (Leaf: consent-sufficient)  
  B) Commits to the view that valid consent does not justify actions that harm others or depend on collective agreement. (Leaf: consent-not-sufficient)  
  GAP: none
