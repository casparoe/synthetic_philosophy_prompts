prompt: |-
  I convene a small reading group in the philosophy of the human sciences, and this term's topic has been the Darwinian theory of culture. Going into our second meeting I intended to put the standard falsificationist objection to memetics on a rigorous footing, so that we could stop trading intuitions about whether it is a science or merely a manner of speaking. I wrote out the following argument and expected it to settle the matter in ten minutes. It occupied the rest of the evening, because the thing proved considerably more than I wanted it to.

  (1) A hypothesis belongs to science only if there is some possible observation about its subject matter that would count against it.
  (2) Memetics holds that cultural items — tunes, doctrines, fashions, techniques, slogans, ritual requirements — vary, are transmitted from person to person, and differ in how effectively they get transmitted, so that the items prevalent at a given time are those that have out-replicated their rivals.
  (3) For any such item, and for any pattern whatever in its prevalence — sudden spread, generations of stability, regional patchiness, decline, replacement by a competitor — that framework supplies an account: what spread was better at spreading than what was on offer, what held steady did so because transmission offset attrition, what vanished lost the contest.
  (4) Hence no possible observation about the prevalence of cultural items is incompatible with memetics, and so, by (1), memetics is not science.
  (5) Nothing in that reasoning depends on the cultural case. Given any population whose variants differ, reproduce differentially, and pass their differences on, the same after-the-fact account is available: the variants that increased were the fitter ones, those that decreased were less fit, those that held steady sat at an equilibrium.
  (6) Hence, by the same route, the theory of natural selection is not science either.
  (7) But (6) cannot be accepted. Selection theory issues quantitative predictions from parameters estimated independently of the outcome it predicts — that the response to artificial selection should equal the selection differential multiplied by the heritability, for instance — and breeding programmes fail, visibly and expensively, when it does not.
  (8) Therefore either (1) is false, or the move from (3) to (4) is invalid: a theory's capacity to accommodate every possible outcome does not by itself cost it scientific standing.
  (9) And therefore the objection at (4) fails, and memetic explanations of cultural change stand on exactly the same footing as selectionist explanations of biological change.

  I cannot accept (9), and neither could three of the six people in the room, but none of us managed to say why without begging the question. Two replies were offered. The first was that genes are particulate and cultural items are not — items blend, are reconstructed by each learner rather than copied, and two people's "same" belief may share no identifiable structure — but this seems to answer a question (5) never asks, since (5) is about what a selectionist framework can accommodate once the outcome is known, not about the fidelity with which its units are transmitted. The second was that memetics has produced nothing anyone would risk being wrong about; but (8) has just told me that accommodating anything is not the vice, so I cannot appeal to accommodation to explain the idleness. One member thought (3) simply overstated, citing the historical work on nineteenth-century American communes, which found that communes imposing costlier demands on their members survived longer and that the effect was concentrated among religious ones; the rest of us could not agree whether that counts as memetics or merely borrows its vocabulary. The case we kept returning to was the demographic transition: fertility in industrialized societies has fallen well below replacement and stayed there for generations, which memeticists read as transmission success coming apart from reproductive success, and which their critics derive from ordinary evolved psychology — status competition and the trade-off between number of offspring and investment per offspring — operating in an environment with reliable contraception. My difficulty is that I cannot see which of those two readings my argument entitles me to prefer, and I suspect that is not an accident. If I am forced to choose, I would rather give up (9) than (7), and I would rather keep (1) than give up the thought that some disciplines are just storytelling wearing a lab coat; but I recognize that these preferences are precisely what is in question.

  So: which step do you reject, and why did it look unobjectionable when I wrote it down, since each of them did? Price the alternatives for me. If you keep (1), how do you propose to criticize explanations that genuinely do rationalize whatever happens, and what do you say to (7)? If you drop (1), what replaces it, and does the replacement still deliver (4) — or does it license (9) all over again? And if you think the argument is valid and (9) simply has to be swallowed, say so plainly and tell me what that implies about selectionist explanation generally. Finally, once this argument is off the table, what is a critic of memetics entitled to say? I want the diagnosis first and the general assessment second, and I would rather have one step examined closely than a survey of everything that has ever been said against memetics.
reasoning: |-
  Okay, the user is running a reading group on the Darwinian theory of culture and presented an argument that backfired. They intended to show that memetics isn't science using falsification, but the argument ended up threatening evolutionary biology too. Now they're stuck because rejecting memetics might force rejecting natural selection theory, which they can't accept. 

  Hmm, the core tension is between steps (3) and (7). The user feels memetics explains everything after the fact (3), but natural selection makes real predictions (7). They're frustrated because their own logic seems to trap them. 

  Let me examine why (3) feels true for memetics but false for biology. The key might be in the parenthetical of (5): "once the outcome is known." For natural selection, we can define fitness *before* knowing survival outcomes - via heritability studies, metabolic efficiency, etc. But for memes, "fitness" is often *defined by* transmission success after the fact. That's the circularity the user senses but can't articulate. 

  The particulate genes point others raised is relevant but not for fidelity - it's about *independent measurability*. Genes have molecular structures we can examine apart from their spread. Memes like "beliefs" often don't. The commune study they mention succeeds precisely because it measured "costly demands" independently of longevity. 

  For the demographic transition case: both explanations might be compatible, but the evolutionary one has prior constraints (biology) while the memetic one doesn't. That's why it feels unsatisfying - it could "explain" the opposite outcome too. 

  The user's real struggle is epistemological: how to distinguish science from storytelling when both can accommodate data. They need a criterion that saves biology but sinks memetics without special pleading. The solution isn't rejecting falsification (1), but enforcing *independently measurable fitness*. 

  Critics of memetics are entitled to demand: "Define meme fitness without reference to transmission outcomes." If you can't, it's circular. The lab coat line reveals their fear that some fields fake rigor. Valid - but target the circularity, not accommodation per se. 

  Also noting their emotional state: frustrated ("expected to settle in ten minutes"), intellectually honest (admits begging the question), and protective of biology's legitimacy. The response should validate their instincts while refining the argument. 

  Final diagnosis: Step (3) is overstated for biology (fitness can be independent) but accurate for most memetics. The invalid move is generalizing (3) to all selectionist frameworks. So (5) is true only if we ignore how biology avoids tautology. Memetics fails precisely where biology succeeds: independent measurability.
answer: |-
  Your argument is admirably clear, and the frustration you describe stems from a genuine philosophical tension. I reject the move from (3) to (4) and (5) to (6) as invalid *in the way you've framed it*, and the flaw lies in **Step (3)'s characterization of the explanatory framework**. Here's the diagnosis:

  1.  **The Core Problem: Step (3) Overstates the "After-the-Fact" Nature of *Scientific* Selectionist Explanations.** You state: "...that framework supplies an account: what spread was better at spreading than what was on offer..." This is only true for a *tautological* or *post-hoc rationalizing* version of selectionism. Crucially, **scientific selectionist theories (properly constituted) do *not* define "fitter" *simply* as "what spread" or "what survived".** They require **independently measurable or specifiable criteria for "fitness" or "replication advantage" *prior* to, or independently of, the outcome being explained.**

  2.  **Why (3) Looks Unobjectionable (But Isn't):** It seems intuitively correct because selectionist frameworks *are* often resilient. However, the move from resilience to "accommodates *any* pattern" *only* holds if "fitness" is defined *exclusively* by the outcome. Scientific selectionism avoids this tautology by anchoring "fitness" in specific, measurable properties *of the variants* (or their interaction with the environment) that are *expected* to confer a replication advantage *before* we know who won. Step (3) implicitly assumes "fitness" *is* defined by the outcome ("what spread *was* better"), which is the tautological pitfall.

  3.  **The Crucial Difference Revealed by (7):** Step (7) highlights precisely this point. Selection theory in biology doesn't just say "the bugs that survived were the fittest." It says, "Given *this* heritability coefficient (*h²*), *this* selection differential (*S*), we predict *this* response (*R = h²S*)." **Fitness (or its proxies like heritability) is estimated *independently* of the specific selection outcome being predicted.** The prediction *can* fail if *R ≠ h²S* using *independently measured* parameters. This independent measurability breaks the tautology.

  4.  **Applying the Correction to Memetics (Why (4) Might Still Stand, But Not via (3) as Written):** For memetics to be scientific *under the selectionist framework it proposes*, it needs to do the same: **specify *what measurable properties of memes* constitute "fitness" or "replication advantage" *independently* of observing their spread/survival in a specific instance.** What makes one tune, slogan, or ritual *intrinsically* more "contagious" or "sticky" *before* we see if it outcompetes others? This is notoriously difficult:
      *   **Blending/Reconstruction:** If memes blend or are idiosyncratically reconstructed each time, defining a stable "variant" with stable properties is hard.
      *   **Multifactorial Causation:** Spread is influenced by complex host psychology, social structures, technology, historical contingency – factors often outside the "meme's" intrinsic properties. Attributing success *solely* to meme fitness is often untenable.
      *   **Lack of Independent Metrics:** What is the memetic analogue of metabolic efficiency, wing shape, or *heritability*? Memetics often struggles to define fitness proxies measurable *before* the competition's outcome is known. Without this, the explanation *does* risk being purely *post-hoc*: "This meme spread because it was fitter" meaning only "...because it spread."

  5.  **Why (9) Does Not Follow:** Memetics does *not* automatically stand on the same footing as biological selection theory *simply because* both are selectionist frameworks. The footing depends on **whether the theory provides independently specifiable criteria for fitness/replication advantage.** Biology usually does (via genetics, biochemistry, morphology). Memetics, as typically practiced, often does not. It frequently *falls into* the tautological trap that Step (3) describes *as if it were inherent to all selectionism*. Step (7) shows it isn't inherent to *scientific* selectionism.

  6.  **Addressing Your Alternatives & Questions:**
      *   **Keep (1)?** Yes, I keep (1). Falsification remains a core principle, but the "possible observation" must test a *non-tautological* core claim. For selectionism, this core claim is *not* "fit variants survive" (which is true by definition if fitness=survival). It's claims like "Variant A, possessing property X (which we argue confers advantage), will outcompete Variant B lacking X under conditions Y" *or* predictions like *R = h²S*. **Criticizing Genuinely Tautological Explanations:** You criticize them precisely by demanding **independent specification of the causal mechanism/properties** responsible for differential success. "Why *this one*?" needs an answer pointing to something other than "because it won."
      *   **Drop (1)?** Not necessary. The flaw lies in misapplying (1) to a mischaracterization in (3).
      *   **What is a critic of memetics entitled to say?** Once this specific argument is off the table, the critic is entitled to demand: **"Specify the *intrinsic properties* of memes that constitute their 'fitness' and demonstrate that these properties *predict* differential replication success in novel contexts, using metrics defined independently of the outcome."** They can argue that memetics currently fails this test, often resorting to *post-hoc* rationalization where "fitness" is inferred solely from success. They can point to the difficulty of defining stable, discrete meme units and isolating meme-intrinsic fitness from host/environmental factors. The "lab coat" critique applies if memetics provides only unfalsifiable *post-hoc* stories, not testable predictions based on independently defined fitness.

  7.  **Diagnosis & General Assessment:**
      *   **Diagnosis:** The argument mistakenly conflates a *tautological misuse* of selectionist reasoning (defining fitness by outcome) with the *essential structure* of selectionist science. Step (3) accurately describes the *tautological* version but falsely presents it as the *only* version possible. Step (7) demonstrates the existence of a non-tautological, predictive scientific version. The invalid move is generalizing the tautological flaw in (3)/(4) to *all* selectionism in (5)/(6).
      *   **General Assessment:** Selectionist explanation *is* scientific when it incorporates independently measurable concepts of fitness/variation/heritability that generate testable predictions. Memetics *aspires* to be this but often falters by lacking robust, independently definable concepts of the meme and its intrinsic fitness properties, leading to *post-hoc* rationalization. The problem isn't selectionism *per se*, but whether the *specific implementation* provides the necessary independent anchors for its core concepts. Biological evolution generally does; memetics generally has not yet succeeded in doing so convincingly. Your argument fails because it attacks the framework's *potential* for tautology rather than the *actual practice* of failing to avoid it.
