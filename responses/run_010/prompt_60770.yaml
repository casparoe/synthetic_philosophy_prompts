prompt: |-
  You're a decision theorist who has also spent years teaching non-philosophers, and I want you to act as my teaching coach here, not as the explainer. I run a monthly evening thing in the back room of a pub — mostly software engineers, two of them do quant stuff, nobody studied philosophy past high school, but all of them are comfortable with sums, loops, and the idea of a fair coin. Eighty minutes, one whiteboard, about fourteen people. Next month's topic is the Pasadena game.

  So they dont have to take my word for the setup, here it is as I understand it: you flip a fair coin until heads comes up. If heads comes up on flip n and n is odd, you win 2^n/n dollars; if n is even, you lose 2^n/n dollars. So heads on flip 1 is +$2, flip 2 is −$2, flip 3 is +$8/3, flip 4 is −$4, and so on forever. The punchline is supposed to be that this game has no expected value at all, which is apparently worse than the St Petersburg business where the expected value is infinite.

  My own understanding is shaky and I want you to sort it out before you plan anything. Someone told me the series does not converge, but when I add the terms up in the obvious order I keep getting about 69 cents, which looks an awful lot like converging to me. Work through the actual mathematics carefully first — what the obvious ordering gives, what other orderings give, why the obvious ordering isn't automatically the privileged one, and what exactly the standard definition of an expectation is refusing to do here — and only then build me the plan.

  What I want is the plan for the eighty minutes, not a script:

  - The order the pieces have to go in and what depends on what. I'm guessing I can't get to the gamble until they've seen that some infinite sums change depending on the order you add them, but I don't know how far back the prerequisites go or where I can legitimately shortcut. They've all seen 1 + 1/2 + 1/3 + ... blow up in some video — can I just assert that and move on, or does the whole thing fall apart if I do?

  - The one example that should carry the evening, and what it has to have and must not have. Part of me wants to run a live simulation on someone's laptop and average the payoffs, since that's what these people actually trust, but I suspect it backfires and I can't tell whether it backfires badly or just a little.

  - The misconceptions — both the ones they'll walk in with and the ones my own explanation will create — and the exact point in the sequence where I head each one off. My guesses: "this is just St Petersburg with a minus sign bolted on", "just simulate it and take the average", "if the expected value is undefined then any price is as good as any, so the whole theory is worthless", and some version of "the game's a scam because the penalties are as big as the rewards".

  - One thing I can ask at the end that would genuinely tell me whether it landed, rather than getting fourteen polite nods.

  - What I should deliberately leave out, and say out loud that I'm leaving out. I know there are proposals for patching decision theory to cope with this, and I know there's a measure-theoretic story underneath; assume I'm touching neither unless you tell me the evening collapses without one of them.

  Think it through properly before you answer: brainstorm the dependency structure and the misconception map first, then commit to a concrete minute-by-minute-ish plan. No reading list and no citations — I can't get hold of papers before the night anyway, and neither can they.
reasoning: |-
  Hmm, the user is running a pub session for software engineers and quants about the Pasadena game. They need a teaching plan, not just an explanation. Let me start by recalling the game: flip a fair coin until heads. If n (the flip number) is odd, win 2^n/n dollars; if even, lose that amount. The expected value is undefined because the series doesn't converge absolutely. But the user mentioned that adding terms in order gives around 0.69, so they're confused.

  First, I need to clarify the math. The series is conditionally convergent but not absolutely convergent. The harmonic series diverges, so rearranging terms can change the sum. That's Riemann's theorem. The "obvious" order (by n) gives the alternating harmonic series, summing to ln(2) ≈ 0.69. But other orders can make it diverge or converge to any value. Expected value requires absolute convergence for the sum to be well-defined, which isn't the case here.

  Now, for the session plan. The audience knows sums, loops, fair coins. They've seen the harmonic series diverge. I can use that. Start with the St. Petersburg paradox as a hook, then introduce Pasadena. Show the payoffs: n=1: +2, n=2: -2, n=3: +8/3≈2.67, n=4: -4, etc. 

  Key misconceptions: thinking it's like St. Petersburg with alternating signs, wanting to simulate it (which would show an average around 0.69 but miss the point about expectation), and thinking undefined expectation makes decision theory useless. Need to address these.

  The plan: First 15 mins for St. Petersburg recap and introducing Pasadena. Then 15 mins on conditional vs. absolute convergence, using harmonic and alternating harmonic series. Show that rearranging terms changes the sum. Then 15 mins on why expectation requires absolute convergence, using the Pasadena series. Demo partial sums oscillating. Address the simulation idea here—explain that simulations give a finite approximation, but the infinite expectation is undefined. 

  Misconception handling: When introducing the series, preempt the St. Petersburg comparison. During the convergence discussion, tackle the simulation question. At the end, clarify that undefined doesn't mean any price is acceptable; decision theory still has ways to handle it, but that's advanced. 

  End with a question: "If you ran 1000 simulations and got an average payoff of $0.70, should you pay $1 to play? Why?" This tests if they understand that the expectation is undefined, not approximately 0.69. 

  Leave out measure theory and decision theory patches. State that explicitly to avoid confusion. 

  Timing: Hook (10 mins), Math foundation (20 mins), Pasadena series (15 mins), Why undefined (15 mins), Q&A and recap (20 mins). 

  Make sure the live simulation is addressed but not run, as it would mislead. Emphasize that finite samples don't resolve the infinite expectation issue. The key is that the order of terms matters, and expectation requires absolute convergence for consistency.
answer: |-
  Here's the battle-tested plan for your 80-minute pub session. I've reverse-engineered it from the core conceptual dependencies and common misconceptions, prioritizing clarity over rigor where needed. **The central insight to convey:** The Pasadena game breaks the "obvious" summation method because its expectation relies on *conditional convergence*, violating the absolute convergence requirement for a well-defined expected value. It's not about the sum *being* infinite (like St. Petersburg), but about it *not existing at all*.

  ---

  ### **Prerequisite Map & Dependency Structure**
  1.  **Requisite Knowledge:** They need to grasp that (a) infinite series can diverge (harmonic series), (b) some convergent series change sum if rearranged (conditional convergence), and (c) expectation is defined as a sum over *all possible outcomes* weighted by probability.
  2.  **Logical Flow:**  
      `Harmonic Series (Divergence Proof Sketch) → Alternating Harmonic Series (Converges Conditionally) → Riemann Series Theorem (Rearrangement Matters) → Definition of Expectation (Requires Absolute Convergence) → Pasadena Game = Scaled Alternating Harmonic → Expectation Undefined`
  3.  **Shortcuts You Can Take:**
      *   **Harmonic Series Divergence:** YES, you can assert/remind them: "You've seen 1 + 1/2 + 1/3 + ... grows without bound. We need that." No need to reprove it.
      *   **Probability Sums to 1:** Assume known. Point out P(Flip n) = 1/2^n, sum P(n) = 1.
      *   **Basic Series Concepts:** Define "converge", "diverge", "partial sum". Avoid terms like "Cauchy sequence" or "supremum".

  ---

  ### **The 80-Minute Plan (Minute-by-Minute)**

  **Goal:** By the end, they understand *why* the "obvious" summation giving ~$0.69 is mathematically illegitimate for defining the expected value.

  *   **(0-10 min) HOOK: St. Petersburg Refresher & The Puzzle**
      *   *Whiteboard:* Quickly sketch St. Petersburg: Heads on flip n wins $2^n, P(n) = 1/2^n. EV = ∞. "What would you pay? Theory says ∞, feels wrong."
      *   *Pose Pasadena:* "Tonight's game: Similar setup, but twist: Win +|2^n/n| if n *odd*, Lose -|2^n/n| if n *even*. Fair coin." Write the payoff sequence: n=1: +$2, n=2: -$2, n=3: +$8/3≈$2.67, n=4: -$4, n=5: +$32/5=$6.40, n=6: -$32/3≈-$10.67, ...
      *   *Ask:* "What's it worth? Calculate like St. Pete: EV = Σ [P(n) * Payoff(n)]." Get them to suggest the formula: Σ (n=1→∞) [ (1/2^n) * (-1)^{n+1} * 2^n / n ] = Σ (n=1→∞) [ (-1)^{n+1} / n ].
      *   *Reveal the Puzzle:* "This sum Σ (-1)^{n+1}/n looks familiar... and it converges! To ln(2) ≈ $0.693. So... EV = $0.69? Seems settled?" **Pause.** "But hold on. The *standard, rigorous definition* of expected value says this game has *no* expected value at all. It's undefined. Worse than infinite. Why? Let's dig."

  *   **(10-20 min) FOUNDATION: When Rearrangement Matters (Conditional Convergence)**
      *   *Recap Harmonic Series:* "We know H = Σ 1/n *diverges* (remind them, e.g., group terms: 1 + (1/2) + (1/3+1/4) + (1/5+..+1/8) > 1 + 1/2 + 1/2 + 1/2 + ...)."
      *   *Introduce Alternating Harmonic:* A = Σ (n=1→∞) (-1)^{n+1}/n = 1 - 1/2 + 1/3 - 1/4 + 1/5 - ... "This *does* converge. To ln(2)≈0.693." Show partial sums (S1=1, S2=0.5, S3≈0.833, S4≈0.583, S5≈0.783, S6≈0.616) oscillating & damping towards ln2.
      *   *The Bomb: Riemann Series Theorem:* "Here's the weirdness. Because Σ |(-1)^{n+1}/n| = Σ 1/n *diverges* (it's Harmonic!), this series is only *conditionally convergent*. This means: **If I rearrange the order of the terms, I can make it converge to ANY real number, or even diverge!**"
      *   *Simple Example:* "Target: Make A sum to >1. Order: Grab big positive terms first! 1 + 1/3 + 1/5 = 1.5333... Now subtract the first negative: -1/2 = 0.5333. Add next positives: +1/7 + 1/9 ≈ +0.251, total ≈0.784. Subtract next negative: -1/4 = -0.25, total ≈0.534. Keep going: add +1/11, +1/13, ... until sum just >1, then subtract next unused negative. Process continues forever, sum stays >1." (Don't need full proof, just the *mechanism*: greedily take pos/neg to steer the sum). "I could target 0, 10, or make it oscillate forever."

  *   **(20-35 min) EXPECTATION: Why Order *Must* Not Matter**
      *   *The Definition:* "Expected Value isn't just *any* sum. It's defined as: EV = Σ [Value(outcome) * P(outcome)], summing over *all possible outcomes*. Crucially, **this sum MUST be independent of the order we list the outcomes.** Why? Outcomes are fundamental, not ordered. Probability is defined on the set, not a sequence. If the sum depends on order, the value isn't inherent to the gamble itself."
      *   *Absolute Convergence is Key:* "The math guarantee that order doesn't matter? **Absolute Convergence.** If Σ |Value(outcome) * P(outcome)| converges, then Σ Value(outcome) * P(outcome) converges to the same value no matter the order. This is a theorem! If the absolute series diverges, all bets are off (like our Alternating Harmonic)."
      *   *Apply to Pasadena:* "Look back: EV = Σ [ (-1)^{n+1}/n ] *but* Σ |(-1)^{n+1}/n| = Σ 1/n = ∞ (Harmonic Series!). Absolute series diverges. So the expectation is *conditionally convergent* at best. Riemann tells us rearranging the order of outcomes changes the sum. Therefore, **the expected value as classically defined does not exist.** It's undefined."
      *   *Connect to the "Obvious" Sum:* "Our 'obvious' order (n=1,2,3,4,...) gave ln(2). But that's just *one* ordering. Order by payoff magnitude? n=1(+2), n=3(+2.67), n=2(-2), n=5(+6.4), n=4(-4), n=7(≈18.29?), n=6(-10.67)... This partial sum is already ≈ (2 + 2.67 - 2 + 6.4 - 4) ≈ 5.07! It's diverging upwards! I could rearrange to make it converge to $100 or -$50. No single value makes sense."

  *   **(35-55 min) PULLING IT TOGETHER: Pasadena in Focus & Misconception Busting**
      *   *Whiteboard Pasadena Payoffs & Probabilities:* List n, P(n)=1/2^n, Payoff(n), |Payoff(n)*P(n)| = 1/n. Hammer: Σ |Payoff*P| = Σ 1/n = ∞ → Absolute Divergence → EV Undefined.
      *   *Address Misconceptions Explicitly:*
          *   **"It's just St. Pete + Minus Sign":** "No. St. Pete EV=∞ (Σ 1 diverges, but monotonically). Pasadena has cancellation, but Σ |terms| still diverges, making EV undefined, not finite or infinite."
          *   **"Just Simulate It / Run the Average":** **CRITICAL POINT.** "Let's simulate mentally. Run 1000 games. What average payoff will you likely see? Probably *around* $0.69, right? *This is the trap!* The simulation converges to ln(2) because you're implicitly sampling outcomes in the order they happen (n=1 most frequent, n=2 next, etc.) – the 'obvious' order. But **this finite average reflects the *sampling order*, not a true inherent expected value.** If you could sample truly randomly by *payoff magnitude* (much harder!), your average could explode or dive. The infinite expectation isn't defined, so finite samples can't fix it. Simulations show the sum for *one ordering*, not *the* EV." (This is why live sim backfires – it *seems* to confirm $0.69, obscuring the core issue).
          *   **"Undefined EV = Any Price is Fine / Theory Useless":** "Not quite. It means *standard* EV theory throws an error. It doesn't tell you paying $1 is rational or irrational. It just says *this specific tool breaks*. This is a feature, not a bug – it highlights the gamble's pathological nature. Decision theorists *do* have workarounds (e.g., 'weak expectations', utility truncation, relative utilities), but they're more complex and less universal. The theory isn't worthless; it tells us *why* this gamble is weird." (Flag you'll leave out the patches).
          *   **"Scam: Penalties >= Rewards":** "While penalties get large, so do rewards (n=5: +$6.40, n=6: -$10.67? Wait, |Payoff| for n=5 is 32/5=6.4, n=6 is 64/6≈10.67, yes). But the scam isn't imbalance, it's *instability*. The lack of a defined EV means there's no objective 'fair price'. It depends on how you *choose* to value the gamble's structure, which standard theory doesn't dictate here."
      *   *Contrast:* "St. Petersburg: EV=∞, defined but impractical. Pasadena: EV=undefined. Different pathologies."

  *   **(55-70 min) ACTIVE RECAP & CHECK FOR UNDERSTANDING**
      *   *Recap the Journey:* "1) Pasadena's 'obvious' sum gives ~$0.69. 2) But |Payoff*P| sums to Harmonic Series (∞). 3) Absolute divergence → EV sum depends on term order. 4) Riemann: Rearrangement changes sum → No single EV. 5) Simulations approximate *one* ordering, not *the* EV."
      *   *The Check Question:* **"Suppose your friend says, 'I simulated Pasadena 1 million times; the average payoff was $0.693. Therefore, the expected value is $0.69, and I'd pay up to that to play.' What's wrong with their reasoning?"** (Target Answer: They correctly calculated the average for the natural sampling order, but mistakenly equate that *finite sample mean under one ordering* with the *infinite, order-independent expected value*, which is undefined because the absolute series diverges. The simulation result exists, the classical EV does not).
      *   *Let them discuss in pairs (2-3 min), then share.* Listen for keywords: "depends on order", "absolute convergence", "|terms| sum infinity", "undefined", "simulation order".

  *   **(70-80 min) WRAP-UP & SCOPE LIMITATION**
      *   *Summarize Punchline:* "Pasadena breaks expected value. Not infinite, not finite, but *undefined* because the necessary condition (absolute convergence) fails. The gamble itself doesn't have a stable 'average value' in the classical sense."
      *   *What We Left Out (Say Explicitly!):* "1) **Measure Theory:** The deep reason EV requires the integral/sum to be absolutely convergent. 2) **Decision Theory Patches:** Proposed ways to make *some* decision ('weak expectation', etc.). These are important, but complex, and not core to *why* the standard definition fails here tonight."
      *   *Final Thought:* "This isn't just a curiosity. It shows the boundaries of our standard tools. When Σ |Payoff * Prob| = ∞, expect trouble. Real-world gambles usually avoid this, but it's a cautionary tale for modelers – especially dealing with heavy tails and cancellation!" (Nod to the quants).
      *   *Q&A:* Focus on tonight's logic. Redirect advanced patches to "read more".

  ---

  ### **Why This Works**
  *   **Builds Prerequisites:** Explicitly covers conditional convergence *before* EV definition. You can't understand *why* the EV fails without this.
  *   **One Core Example:** The Alternating Harmonic Series *is* the Pasadena EV. Understanding its properties *is* understanding the game. Riemann's theorem makes the issue undeniable.
  *   **Preempts Misconceptions:** Directly addresses "simulation confirms $0.69" during the explanation, exposing its flaw. Tackles "St. Pete comparison" head-on.
  *   **Valid Check Question:** Forces them to distinguish a *simulation result* from the *theoretical EV* and articulate *why* the divergence of Σ 1/n matters. Polite nods won't cut it.
  *   **Clear Scope:** Acknowledges advanced topics exist but firmly shelves them, maintaining focus on the core paradox.

  **You've got this!** Your awareness of their background and the pitfalls makes you the perfect guide. Emphasize the "why" over the formalism, leverage their comfort with series, and that check question will reveal if the lightbulbs lit up. Good luck!
