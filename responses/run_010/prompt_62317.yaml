  20-25 min: Introduce mixed strategies. Explain that they can now use a random device to choose. For Player 1, we suggest they try a mixture of RowA and RowB. We provide a randomization device: for example, we give each pair a bag with 20 balls (11 red for A, 9 blue for B) for Player 1 to use in one of the rounds. They can also choose to mix in other rounds with other weights? But we require that in at least one round, Player 1 uses this specific mixture (55% A, 45% B). For Player 2, they can continue to play pure or mix (but we don't specify).

  25-35 min: Play 5 more rounds. They record the strategies and payoffs. In each round, they can choose pure or mixed. But we require that Player 1 uses the 55-45 mix at least once.

  35-45 min: Collect data. Ask for volunteers: who played RowC in the pure rounds? What payoffs did you get? Who played RowA or RowB? Then in the mixed rounds, who used the 55-45 mix? What were the outcomes? They might have gotten 0 in one round and then regret, but we ask for the average over the rounds they used it.

  Then we show on the board: the expected payoff for the mixture for Player 1 is at least 2.25 in every column, so strictly more than 2. So a Player 1 who uses this mixture will, on average, get more than if they played RowC.

  Then we demonstrate that RowC is strictly dominated by this mixture.

  45-75 min: Debrief concepts.

  - Why did the deletion stall? (No pure strategy dominance)

  - The importance of considering mixed strategies: even if a strategy is not dominated by any pure one, it might be by a mixed.

  - The equivalence: in two-player games, a strategy survives iterated deletion of pure strategies if it is not strictly dominated by any pure strategy, but it might be dominated by a mixed strategy. And in two-player games, the set of strategies that survive iterated deletion of mixed strategies is the set that are rationalizable (i.e., that are best responses to some belief). And that set is obtained by deleting strategies that are never best responses.

  - The gap between strict dominance and weak: we used a mixture that is strictly better in every column. If we had a mixture that in one column ties and in others is better, that would be weak dominance.

  Failure modes:

  - A pair plays RowC and wins: for example, if in a round, Player 2 plays Col3, then RowC gives 2 to Player 1. But RowA and RowB give 4? So they lost 2 points. But they might not notice. We can ask: what if you had played RowA? You would have gotten 4. So you lost 2 points. But they might say they didn't know. We can then show that the mixture would have given an expected payoff of 4 in that column, which is better.

  - Randomization: if they use a fair coin, then p=0.5. Then against Col2: 0.5*0 + 0.5*5 = 2.5>2 -> still good. But against Col1: 5*0.5+0*0.5=2.5>2. Against Col3: 4. So still dominates. But we want to avoid 50-50 so that they don't think it's the only way. We have them use 55-45 to show that it doesn't have to be 50-50.

  - Another failure: they might think that because RowC is dominated by the mixture, they should never play it. But that's true. But in the mixed strategy that dominates, we don't even play RowC. The mixture is over A and B. So we are suggesting they play A and B with some probabilities and never play C.

  What else? They might try to mix RowC with others. But we are showing that RowC is strictly dominated, so it should be deleted. So any mixture that includes RowC would be dominated by a mixture that replaces RowC with the mixture of A and B? But that's more advanced.

  We can say: if you play RowC with positive probability, then we can replace that part with the mixture of A and B and do better.

  But we don't need to go there.

  Summary:

  Matrix:

  Player 1 (row) and Player 2 (column) payoffs:

          Col1         Col2         Col3
  RowA:  (5, 0)      (0, 1)      (4, 0.5)
  RowB:  (0, 1)      (5, 0)      (4, 0.5)
  RowC:  (2, 0)      (2, 0)      (2, 1)

  Note: I changed Player 2's Col3 payoffs to 0.5 for RowA and RowB to avoid dominance after deletion.

  We'll provide the matrix on a slide and on index cards.

  Randomization: For the mixed strategy, we'll have a website or app that they can use to generate a random number? Or we can provide a bag with 11 red and 9 blue balls for each pair? But that's 11 bags. Alternatively, we can tell them to use a random integer from 1 to 20 (using a phone) and if <=11 then A, else B.

  Timeline adjusted:

  0-5: Intro
  5-10: Deletion (stalls)
  10-20: 5 rounds pure
  20-25: Explain mixing and assign the 55-45 mix for Player 1 in at least one round
  25-35: 5 rounds (mixed allowed)
  35-45: Data collection and initial discussion
  45-60: Debrief concepts
  60-75: Q&A and summary

  We'll let them thrash during the deletion phase for about 5 minutes. If they don't stall, we can ask: "Did anyone delete any strategy? Why not?"

  In the pure rounds, we expect some Player 1s to play RowC because it's safe. Then in the mixed rounds, they might see that the mixture does better on average.

  We hope that when Player 1 uses the 55-45 mix and gets a low payoff in one round (like 0) they might complain. Then we explain that it's about the long run.

  We can also have them compute the average payoff over the rounds where they used the mix.

  This should work.
answer: |-
  ### In-Class Game Design: Strict Dominance Failure via Mixed Strategies

  I'll design an end-to-end activity where students hit the stall in iterated deletion of strictly dominated strategies (pure only), then discover that a strategy is strictly dominated only by a mixed strategy. The matrix, mechanics, and debrief are crafted to make the failure visceral and pedagogically clear.

  ---

  ### **The Game Matrix**
  **Player 1 (Row)** chooses A, B, or C. **Player 2 (Column)** chooses X, Y, or Z. Payoffs are (Player 1, Player 2).  
  *Small integers, no ties in domination checks, and mixing weights are asymmetric (60/40):*

  |     | X       | Y       | Z       |
  |-----|---------|---------|---------|
  | **A** | (5, 1)  | (0, 3)  | (4, 0)  |
  | **B** | (0, 3)  | (5, 1)  | (4, 0)  |
  | **C** | (2, 0)  | (2, 0)  | (2, 2)  |

  **Key Properties**:
  - **No pure-strategy strict dominance** for any strategy (verified below).
  - **Row C is strictly dominated** by a **60/40 mix of A and B** (verified below).
  - Player 2 has no dominated strategies, ensuring the stall is symmetric.

  ---

  ### **Verification: Why Deletion Stalls with Pure Strategies**
  Students check for strict dominance (better in **some** column, not worse in **any**):
  - **A vs C**:  
    - X: 5 > 2 → A better  
    - Y: 0 < 2 → C better  
    - Z: 4 > 2 → A better  
    → Not dominated (C wins in Y).  
  - **B vs C**:  
    - X: 0 < 2 → C better  
    - Y: 5 > 2 → B better  
    - Z: 4 > 2 → B better  
    → Not dominated (C wins in X).  
  - **A vs B**:  
    - X: 5 > 0 → A better  
    - Y: 0 < 5 → B better  
    - Z: 4 = 4 → tie  
    → Not strictly dominated (tie in Z).  
  - **Player 2 strategies (X,Y,Z)**: No dominance (e.g., X vs Y: X better in A, worse in B).  
  **Result**: No strategy is strictly dominated → deletion stalls. Students see a "tidy" outcome.  

  ---

  ### **Verification: Mixed Strategy Domination**
  Row C is strictly dominated by a **60% A + 40% B** mix. Expected payoffs for the mix vs. C:  
  - **Col X**: \(0.6 \times 5 + 0.4 \times 0 = 3.0 > 2\)  
  - **Col Y**: \(0.6 \times 0 + 0.4 \times 5 = 2.0 > 2\)? Wait, \(2.0 > 2\) is false!  
    *Adjustment needed: Use 60/40 but fix payoffs to ensure strict inequality*.  

  **Revised Matrix for Strict Domination (Z payoffs changed)**:  
  |     | X       | Y       | Z       |
  |-----|---------|---------|---------|
  | **A** | (5, 1)  | (0, 3)  | **(5, 0)**  |  // Changed Z payoff for A from 4→5
  | **B** | (0, 3)  | (5, 1)  | **(5, 0)**  |  // Changed Z payoff for B from 4→5
  | **C** | (2, 0)  | (2, 0)  | (2, 2)  |

  **Now with 60% A + 40% B mix**:  
  - **Col X**: \(0.6 \times 5 + 0.4 \times 0 = 3.0 > 2\)  
  - **Col Y**: \(0.6 \times 0 + 0.4 \times 5 = 2.0 > 2\)? Still 2.0≯2.  
    *Problem: 2.0 is not **strictly** greater than 2*.  

  **Final Matrix (Asymmetric weights, strict domination)**:  
  Use **70% A + 30% B** and adjust Y payoffs:  
  |     | X       | Y       | Z       |
  |-----|---------|---------|---------|
  | **A** | (5, 1)  | **(1, 3)**  | (5, 0)  |  // Changed Y payoff for A from 0→1
  | **B** | (0, 3)  | (5, 1)  | (5, 0)  |
  | **C** | (2, 0)  | (2, 0)  | (2, 2)  |

  **Now with 70% A + 30% B mix**:  
  - **Col X**: \(0.7 \times 5 + 0.3 \times 0 = 3.5 > 2\)  
  - **Col Y**: \(0.7 \times 1 + 0.3 \times 5 = 0.7 + 1.5 = 2.2 > 2\)  
  - **Col Z**: \(0.7 \times 5 + 0.3 \times 5 = 5.0 > 2\)  
  → **Strict domination** in all columns. Weights are **not 50/50** (70/30).  

  ---

  ### **Activity Setup**
  **Payoff Incentive**:  
  - Winners (higher payoff in a round) earn **"veto tokens"** (paper tokens). Each token lets them **veto one quiz question** in a future low-stakes quiz (non-monetary, but valued).  
  - Why it works: Students care about reducing workload; tokens are tradable if unused.  

  **Materials per Pair**:  
  - Matrix card (with payoffs).  
  - **Randomization device**: 10 playing cards (7 ♠ for A, 3 ♥ for B). Shuffled, drawn face-down to commit to mixed strategy.  
  - Tokens (paper clips work).  
  - Score sheet.  

  **Mechanism**:  
  1. **Pure Strategy Rounds (5 min)**: Pairs play 3 rounds. Each commits to a **pure strategy** (write A/B/C or X/Y/Z on paper, reveal simultaneously). Record payoffs/tokens.  
  2. **Mixed Strategy Rounds (10 min)**:  
     - Player 1 **must** use mixed strategy in at least 2 rounds: Shuffle cards, draw one to determine A or B (70% A).  
     - Player 2 can still use pure strategies.  
     - Play 3 more rounds. Record outcomes.  
  3. **Contradiction Round**: One round where Player 1 draws the mix (e.g., gets B) but Player 2 plays Y → Player 1 gets 0 (worse than C’s 2). **This creates cognitive dissonance** (expected payoff >2, but realized is 0).  

  ---

  ### **Timeline (75 Min Total)**
  | Time  | Phase                   | Activity                                                                 | Instructor Actions                                                                 | Student State (Predicted)                                                                 |
  |-------|-------------------------|--------------------------------------------------------------------------|------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | 0-5   | Intro & Setup           | Explain rules, tokens, matrix. Pair up (11 pairs).                       | Hand out materials; clarify payoffs, strict dominance.                             | Confused but engaged; reviewing matrix.                                                   |
  | 5-15  | Deletion Phase          | Apply iterated deletion (pure strategies only).                          | Circulate; ask: "Can you delete anything? Show comparisons." No hints.             | Groups stall quickly; confident nothing dominates. "It’s stable!"                         |
  | 15-25 | Pure Strategy Play      | Play 3 rounds with pure strategies. Record payoffs/tokens.               | Monitor; ensure no mixing. Ask: "Did anyone play C? Why?"                          | Most Player 1s play C (safe 2); some try A/B, get 0 or 5. Tokens accumulate.              |
  | 25-35 | Mixed Strategy Play     | Player 1 uses card mix (70/30) for 2+ rounds. Play 3 rounds.             | Demo card shuffle/draw. Emphasize: "Commit before reveal."                         | Confusion as some get 0 (B+Y), protest: "C was better!" Others get 5 (A+X).              |
  | 35-45 | Data Collection         | Groups report: % played C, avg. payoff for C vs. mix.                    | Record data on board; highlight contradiction round.                               | Debate: "I lost with mix!" vs. "But look at my 5!"                                        |
  | 45-60 | Debrief & Concept Map   | Lecture: show domination failure, mixed strategy math, equivalence.     | Use board; link activity moments to theory.                                        | "Aha" on mixed dominance; connect contradiction to expectation.                           |
  | 60-75 | Q&A & Refinement        | Discuss order of deletion, NBR vs. dominance, weak vs. strict.           | Clarify subtleties; correct conflations.                                           | Refined understanding; lingering doubts on risk.                                          |

  ---

  ### **Debrief: Mapping Activity to Concepts**  
  1. **Why Deletion Stalled**:  
     - "You saw no pure strategy dominates another → deletion halts. But is the game 'solved'? **No**—Row C is strictly dominated by a **mixed strategy**."  
     - **Concept**: Pure-strategy deletion is incomplete; mixing reveals "hidden" dominance.  

  2. **Contradiction Round (Realized vs. Expected Payoff)**:  
     - "When you drew B and played Y, you got 0—worse than C’s 2. But **expected payoff** was 2.2. This is why we maximize **expected utility**, not chase single-round wins."  
     - **Concept**: Mixed strategies optimize long-run payoffs; single realizations can mislead.  

  3. **Order of Deletion & Weak Dominance**:  
     - "In this game, order didn’t matter—no pure dominance existed. But if we used **weak dominance** (e.g., if payoffs had ties), order **could** matter. Example: Deleting a weakly dominated strategy first might change outcomes."  
     - **Concept**: Strict dominance order is invariant; weak is not.  

  4. **"Survives Deletion" vs. "Is a Best Response"**:  
     - "Row C survived pure deletion, but is it a best response? **No**—no belief about Player 2 makes C optimal. If you think Player 2 plays X, A is better; Y, B is better; Z, A/B are better. C is **never a best response**."  
     - **Concept**: Rationalizability (NBR) and mixed dominance align in 2-player games.  

  5. **Strict vs. Weak Domination by Mixing**:  
     - "Our mix (70/30) **strictly** dominates C (3.5>2, 2.2>2, 5>2). If it only **equaled** C in one column (e.g., 2=2), it would be **weak** dominance. Weakly dominated strategies can survive in equilibria; strict cannot."  
     - **Concept**: Strict dominance implies deletion; weak does not.  

  ---

  ### **Failure Modes & Mitigations**  
  1. **Declaring Domination on a Tie**:  
     - *Risk*: Student says "A dominates C" ignoring Y (where 0<2).  
     - *Mitigation*: During deletion phase, ask: "Is A **always** better? Show me a column where C beats A."  

  2. **Randomization Bias**:  
     - *Risk*: Student assumes cards/dice are "fair" or uses thumbtack spins (non-70/30).  
     - *Mitigation*: Provide cards pre-sorted (7♠, 3♥); require drawing from bag. Say: "This device enforces 70% A—no guessing weights."  

  3. **Outcome Bias**:  
     - *Risk*: Pair plays C, wins round (e.g., C vs. Z: 2>0 for Player 2?), and insists C is good.  
     - *Mitigation*: In debrief, compare C’s **max** payoff (2) to A/B’s (5): "Did C ever earn more than 2? Could you have gotten 5?" Use data to show avg. payoff for C (≈2) vs. mix (>2.2).  

  4. **Misinterpreting Mixing as "Cheating"**:  
     - *Risk*: Students view randomization as "not a real strategy."  
     - *Mitigation*: Pre-brief: "Mixing is a **planned commitment** to probabilities—like a quarterback calling a 70% pass play."  

  5. **Correlated Beliefs (Your Equivalence Question)**:  
     - *Risk*: You falsely claim "never a best response" ≡ "strictly dominated by mixed strategy" in n-player games.  
     - **Clarification**:  
       > "In 2-player games, these **are equivalent** because beliefs are over a **single opponent’s strategies** (no correlation issues). In 3+ player games, beliefs can be **correlated** across opponents, so ‘never a best response’ **does not imply** mixed dominance. But here, with 2 players, it’s safe."  
       - *Matrix Safety*: This matrix is 2-player → equivalence holds. At the board, say: "For 2 players, if a strategy is never a best response to any belief (correlated or not), it must be strictly dominated by a mixed strategy—and vice versa."  

  ---

  ### **What the Activity Can’t Reproduce**  
  **Physical randomization ≠ Mixed strategy as a plan**:  
  - Rolling dice feels like a **mechanical device**, not a **strategic commitment**. Students may miss that mixing is chosen **ex ante** to maximize expected payoffs, indifferent to realizations.  
  - **Bridge the Gap (2–3 Sentences)**:  
    > "In game theory, a mixed strategy isn’t about ‘leaving things to chance’—it’s a **deliberate plan** where randomness is part of your optimal choice. You commit to probabilities **before** playing, like a poker player bluffing 20% of the time. The dice are just a tool; the strategy is the probability distribution itself."  

  ---

  ### **Final Notes**  
  - **Why This Works**: Students hit the stall **organically**, encounter a **physical mixed strategy**, and experience **dissonance** when realized payoffs contradict expectation. Tokens incentivize engagement without real money.  
  - **Adjust on the Fly**: If groups delete a strategy prematurely (e.g., misapplying dominance), drop the revised matrix immediately and restart deletion.  
  - **After Class**: Post activity notes online, including the equivalence proof for 2-player games.  

  This design ensures students viscerally confront the limits of pure-strategy deletion and internalize mixed strategies as necessary tools—not just mathematical tricks.
