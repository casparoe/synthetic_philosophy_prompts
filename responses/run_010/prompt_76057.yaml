  The tercet's challenge: when pairing words (e.g., "sum" and "order" share a line), they must try a rule like "ignore sequence, weigh lives equally"—but this fails because conditionally convergent series *demand* order matter. The cost? Perhaps the poem loses its earlier hope for resolution. 

