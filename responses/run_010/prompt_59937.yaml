prompt: |-
  Weird thing happened after I did that series on our county's jail overcrowding bond: a commissioner who liked the piece invited me to sit on the jail's community advisory panel, apparently on the theory that a journalist who wrote about the place must have opinions about running it. So now, once a month, a group of us — a public defender, a retired probation officer, two victims' advocates, a county budget analyst, a pastor, and me, the only one who's ever read anything about corrections — get handed proposals for programs and small facility changes and have to vote on whether to recommend them to the commission. It's usually six to eight a quarter, we get maybe twenty minutes a proposal, nobody on the panel has any training in this, and the sheriff's office sends two people who can effectively veto anything they say compromises control. The jail is a 1970s pod design, the median stay is somewhere under two months because most of the population is pretrial or serving short sentences, and we have about $50k a year of discretionary money, so almost nothing we approve is a rebuild — it's a curriculum here, a visitation room there, a policy about who's allowed to hand out what.

  What I want from you is a screening procedure the panel can actually run in that twenty minutes, grounded in whatever the Norwegian approach really commits you to rather than in the Halden press photos. I mean the actual operating principles — the normality idea, that the punishment is the loss of liberty and nothing more; dynamic security, where safety comes from officers being in constant unarmed contact with prisoners rather than from hardware; the import model, where school, health care and library services are delivered by the same outside agencies that deliver them to everyone else, not by the prison itself. Set that against what our jail defaults to, which is classification and control, program access as a privilege earned by good behavior, and services run by custodial staff because that's who's on payroll. And be straight with me about which parts of it don't travel to a short-stay county jail and why, because I suspect at least half the panel's instinct — "let's build a reentry village with a mock bus stop and apartment kitchen inside the secure perimeter" — is the brochure problem, a phrase a friend of mine who does correctional design uses for anything that photographs as transformative and does nothing once you're inside it. Related to that, here's a distinction I keep reaching for and can't defend: some changes are *inside-the-walls* changes (what happens within the facility) and some are *across-the-walls* changes (the standing relationship between the facility and the community outside it). My hunch is that only the second kind is doing the real work in Norway, and that a panel that approves lots of the first kind can be completely faithful to the Halden aesthetic and still change nothing. Tell me if that hunch is wrong, and if it's right, build the distinction into the procedure.

  Concretely, I want questions to ask in order, what counts as a sufficient answer to each, a one-word stamp the panel can record for each proposal, and the places where the procedure has to stop and hand the decision to a person because it's a question of values — how much deprivation someone deserves, what a victims' advocate is owed — and not a question of facts. Also flag the steps that are really judgment calls wearing a procedure's clothes; I'd rather know which line of the flowchart I'm actually just voting my gut on. No reading list and no citations, please — I can't chase anything down and I'm not going to pretend I will; if a claim needs a study behind it, name the study in half a sentence or drop it. Structure it like this, roughly: "What the Norwegian model actually commits you to" (~250 words), "What doesn't travel to a county jail" (~250), "The screening procedure" (~600, numbered, with the stamps), "Where the procedure runs out and a person has to decide" (~200), "Three proposals, run through it" (~500), and "Bottom line" (~100). For the three, use: an eight-week cognitive-behavioral thinking-skills curriculum that's evidence-based, cheap, and taught by the jail's own officers inside the perimeter, with a completion certificate that buys priority for work-release slots — I expect half the panel loves this one, so if your procedure rejects it, say so plainly and give me the sentence I can use in the meeting; a proposal to take out the plexiglass visitation booths and let a county library staffer run a room where kids can sit on a parent's lap; and the dynamic-security one — officers eating in the dayroom with detainees, no keys or restraints carried on the floor — which I think passes your test cleanly and gets killed anyway by the union and the sheriff, so build in a slot for "passes, won't survive" and tell me what the panel should do with that stamp.
reasoning: |-
  Okay, let me unpack this complex request. The journalist has been unexpectedly placed on a jail advisory panel and needs a practical screening tool grounded in Norwegian correctional principles, not just aesthetics. They're dealing with superficial proposals in a constrained environment - 20 minutes per proposal, $50k annual budget, short-stay jail with control-focused culture.

  The core tension is between transformative ideals and operational reality. They've identified two key insights: the importance of "across-the-walls" changes versus cosmetic "inside-the-walls" tweaks, and the brochure problem where photogenic reforms lack substance. Their examples reveal classic pitfalls - evidence-based programs undermined by custodial delivery, visitation reforms that maintain separation, and genuine dynamic security that'll face institutional resistance.

  For the Norwegian model, I'll distill three non-negotiables: punishment as loss of liberty only, dynamic security through relationships, and imported services. Then identify what can't transfer - mainly long-term relationship building and high-resource imports in a transient population. 

  The screening procedure needs to ruthlessly filter proposals through these lenses. Key questions should force examination of whether changes are truly across-the-walls or just internal reshuffling. The stamps ("PASS", "MODIFY", etc.) must trigger specific actions, especially for proposals that pass scrutiny but face external veto. 

  For the three test cases: the CBT program fails because custody staff deliver it as a privilege; the library visit passes if community staff enter; dynamic security passes but gets a "BLOCKED" stamp requiring advocacy. The journalist needs actionable phrases like "This entrenches custody staff as service gatekeepers" for meetings.

  The bottom line recognizes their unique position: as a panelist with correctional knowledge, they can steer decisions toward meaningful external connections rather than feel-good internal tweaks. The real win isn't approval stamps but shifting the panel's vision beyond the walls.
answer: |-
  Here's a screening procedure grounded in Norway's core principles, designed for your panel's reality:

  **What the Norwegian Model Actually Commits You To (The Non-Negotiables):**
  1.  **Normality Principle:** The punishment is *only* the loss of liberty. Everything else (living conditions, services, interactions) should mirror free society as much as security allows. Avoid gratuitous deprivation.
  2.  **Dynamic Security:** Safety comes primarily from positive, continuous, unarmed interaction between staff and detainees ("proximity, communication, respect"). Static security (barriers, isolation, tech) is a last resort.
  3.  **Import Principle:** Core services (education, healthcare, library, rehab) are delivered by the *same* qualified external agencies serving the community, not custody staff. This maintains quality, normality, and community connection.
  4.  **Focus on Reintegration:** Every interaction should prepare the person for successful release. This isn't about "programs" earned, but the *entire environment* fostering responsibility and connection.

  **What Doesn't Travel to a County Jail (And Why):**
  *   **Long-Term Relationship Building:** Norwegian officers work the same unit for years, building deep trust. Impossible with short stays and high turnover. *Focus instead on consistent, respectful interactions even if brief.*
  *   **High-Resource Imported Services:** Full-time external teachers/doctors inside a small, transient jail are impractical. *Focus on targeted, specific external partnerships (e.g., library visits, telehealth intake, brief workshops).*
  *   **"Open Prison" Elements:** Mock villages/apartments require space, time, and trust incompatible with short stays and control-focused culture. *Focus on small, genuine normality touches.*
  *   **Deep Rehab for Long Sentences:** Most rehab needs long-term engagement. *Focus on immediate needs (crisis intervention, meds, basic skills, reentry planning) and seamless handoffs to community services.*

  **The Screening Procedure (For 20 Minutes/Proposal):**

  1.  **ASK: "Does this proposal add gratuitous deprivation beyond the loss of liberty?"**  
      *   *Sufficient Answer:* No, it removes/avoids unnecessary hardship (e.g., improving visitation) OR is a necessary security measure demonstrably needed (not just default).  
      *   *Insufficient:* "It's how we've always done it," "It's for officer convenience," "It deters bad behavior."  
      *   **STAMP: FAIL** if Yes. **PROCEED** if No.

  2.  **ASK: "Does this proposal primarily rely on increasing positive, unarmed interaction (Dynamic Security) or on adding barriers/tech/segregation (Static Security)?"**  
      *   *Sufficient Answer (For Dynamic):* Clearly describes staff engaging meaningfully (e.g., eating together, facilitating groups without barriers).  
      *   *Sufficient Answer (For Necessary Static):* Explicitly addresses a specific, documented safety risk that dynamic methods can't mitigate.  
      *   **STAMP: PASS (DYNAMIC)** if it strengthens dynamic security. **MODIFY?** if it adds static security without strong justification. **FAIL** if it adds static security needlessly or significantly reduces interaction.

  3.  **ASK: "Does this proposal connect detainees to qualified external services/people/community *across the walls* (Import Principle), or is it just an *inside-the-walls* change run by custody staff?"** (Your hunch is largely **correct**. Across-the-walls is transformative; inside-the-walls is often cosmetic.)  
      *   *Sufficient Answer (Across-the-Walls):* Involves external professionals entering (e.g., librarian, therapist, teacher) OR facilitates direct connection to outside (e.g., improved phone/video access to family/support, preparing for specific community service handoff).  
      *   *Sufficient Answer (Inside-the-Walls Only):* Must demonstrably *enable* future across-the-walls connections (e.g., a quiet room *specifically for* telehealth) or remove a significant barrier to normality *now* (e.g., removing plexiglass for family visits). Avoid "brochure problem" mock-ups.  
      *   **STAMP: PASS (ACROSS)** if genuine across-the-walls. **PASS (BRIDGE)** if inside-the-walls but demonstrably enables future across-the-walls connections or removes a major normality barrier. **MODIFY?** if inside-the-walls with unclear connection. **FAIL** if purely cosmetic inside-the-walls.

  4.  **ASK: "Is access contingent on 'good behavior' or is it available based on need/eligibility (Normality/Reintegration Focus)?"**  
      *   *Sufficient Answer:* Access based on objective criteria (e.g., sentence length, program suitability, medical need) OR universally available. Avoid "privileges."  
      *   **STAMP: MODIFY?** if contingent on behavior. **PASS** if not contingent.

  5.  **ASK: "Does this proposal have a credible veto risk from the Sheriff's Office?"** (Be realistic)  
      *   *Sufficient Answer:* Explicit concerns raised previously, violates union agreement, fundamentally challenges control philosophy.  
      *   **STAMP: PASS/BLOCKED** if it passes 1-4 but veto is certain. **PROCEED** if veto unlikely or unknown.

  **Where the Procedure Runs Out (The Values Call):**
  The procedure flags issues, but humans must decide:
  *   **Level of Deprivation:** How much hardship is "necessary"? (Step 1). The panel must debate if a security justification is sufficient *and* proportional.
  *   **Static vs. Dynamic Trade-off:** Is the safety risk *enough* to warrant static measures? (Step 2). Requires weighing hypothetical risk against the harm of reduced interaction.
  *   **"Bridge" Validity:** Is an inside-the-walls change *truly* enabling or just feel-good? (Step 3). Requires judgment on its potential real-world impact vs. brochure appeal.
  *   **Punishment vs. Reintegration:** How much should "good behavior" gatekeep access? (Step 4). Victims' advocates vs. normality principle clash here.

  **Three Proposals Run Through It:**

  1.  **CBT Curriculum (Inside, Custody-Run, Behavior-Based):**
      *   Step 1: PASS? (Adds service, but...)
      *   Step 2: PASS? (Adds interaction, but custody-led).
      *   **Step 3: FAIL** (Inside-the-walls, run by custody staff. Certificate as "privilege" for work-release reinforces control, not normality. Pure brochure problem - looks rehabby, entrenches system).
      *   Step 4: FAIL (Access contingent on behavior).
      *   Step 5: N/A (It would likely sail through Sheriff).
      *   **VERDICT: FAIL.** *Your Panel Sentence:* "This entrenches custody staff as service gatekeepers and makes rehab a privilege earned inside, not a normal service provided across the walls. It looks good but reinforces the system we need to move away from."

  2.  **Library Staffer & No-Plexi Visits (Across-the-Walls Normality):**
      *   Step 1: PASS (Reduces deprivation - normal human contact).
      *   Step 2: PASS/DYNAMIC (Facilitates positive, normal interaction).
      *   **Step 3: PASS/ACROSS** (External staff enters, facilitates genuine community/family connection across the walls).
      *   Step 4: PASS (Presumably based on eligibility, not behavior).
      *   Step 5: **PASS/BLOCKED?** (Sheriff/Union may balk at no plexi. Library staffer less likely).
      *   **VERDICT: PASS (ACROSS)**. Advocate strongly. If Sheriff kills no-plexiglass, try for the library staffer alone as a win.

  3.  **Dynamic Security - Eating Together, No Restraints (Dynamic Security Core):**
      *   Step 1: PASS (Promotes normality, reduces institutional feel).
      *   **Step 2: PASS/DYNAMIC** (Core of dynamic security - constant, respectful, unarmed interaction).
      *   Step 3: PASS/BRIDGE? (Primarily inside, but fosters attitudes crucial for reintegration and future community interaction).
      *   Step 4: PASS (Universal interaction).
      *   Step 5: **PASS/BLOCKED** (High certainty of Union/Sheriff veto on safety grounds).
      *   **VERDICT: PASS/BLOCKED.** *Panel Action:* Record a strong "PASS" recommendation acknowledging it perfectly aligns with the model, but note the anticipated veto. Use this to highlight the systemic barrier ("Our control model prevents the fundamental safety practice Norway relies on").

  **Bottom Line:**
  Your panel's power lies in demanding proposals be **genuinely across-the-walls** or **essential bridges to it**, ruthlessly rejecting brochure-ready inside-the-walls tweaks. Focus the $50k on enabling **external professionals to enter** or **direct connections out**. When values clash or veto looms, be transparent: "This passes the model but challenges our values/control structure." Your role is to anchor decisions in *actual* principles, not aesthetics.
