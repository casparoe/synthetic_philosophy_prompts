  (She's wrist-deep in potting soil, gently squeezing a tomato seedling's root ball. Sunlight catches the silver streaks in her messy bun. She doesn't look up immediately when you tell her the name.)

  **Hospice Nurse:** "Lovely name, truly. Sounds like a strong one. And congratulations to you both. Seven months... getting real now, eh?" (She sets the seedling carefully into the hole, patting the soil firm around it. Only then does she glance up, her eyes calm, almost amused.) "You know me, though. Couldn't let you walk off without saying... it’s a hell of a thing, signing someone up for the whole show without asking. Especially knowing how the third act usually plays out. Seen too many final scenes, brother. Too many."

  **You:** (Pushing on the asymmetry) But that’s just it! You say sparing someone suffering is good, even for someone who never exists. But all the happiness, the love, the things they’ll never experience if they’re not born… that’s not a *bad* thing? It’s like your scale only counts the pain side. Seems rigged.

  **Hospice Nurse:** (Wipes her hands slowly on her faded gardening apron, leaving smudges of dark earth. A wry, understanding smile touches her lips.) "Ah, you've been thinking. Good for you. Look, the quiet? The *not* having that awful last gasp for air, the not feeling the cancer eat through your bones? That *is* a kindness. It just *is*. A mercy no one ever thanks you for, ‘cause there’s no one there to need it." (She picks up her watering can, a chipped blue enamel one.) "But the birthday cakes, the sunrises, the first kiss? Missing *those* doesn’t hurt a soul. Literally. There’s no little ghost out there sighing, ‘Shame I missed that ice cream.’ It’s just… quiet. Peaceful quiet. No loss registered. Not like the screaming pain I wipe brows through every shift."

  **You:** But isn't the potential for joy immense? Doesn't that potential *matter*? Doesn't the quiet also mean missing out on everything beautiful?

  **Hospice Nurse:** (She waters the seedling gently, precisely, focusing on the base.) "Potential's a tricky word. Potential for what? For everything under the sun, good *and* bad. You're gambling with their chips, not yours. Seen too much potential curdle, brother. Bright kids become ghosts in hospital beds. Lively souls trapped in bodies that just… quit." (She sets the can down, looks straight at you, her gaze steady, not unkind.) "The beautiful things? They're *real* for the people already here, living them. Makes *our* lives richer, sure. But for the one who *isn't* here? There's no empty chair at the birthday table feeling the lack. Only the ones who *are* here feel loss. The absence of suffering? That’s a solid, good thing. The absence of a joy nobody’s around to miss? That’s just… nothing. A blank page. Not sad, just neutral."

  **You:** So the quiet is always better? Always winning?

  **Hospice Nurse:** (A soft chuckle escapes her. She brushes a stray hair off her forehead with the back of her wrist.) "Better? For *them*? Yeah, I reckon it is. It’s the one guarantee you can give ‘em. No pain. Ever. You can’t promise them a single laugh, not truly. But you *can* guarantee they’ll never feel a thing go wrong. Never beg for it to stop." (She gestures towards the tray of seedlings, her voice dropping, warm but firm.) "My job’s seeing what ‘wrong’ looks like at the end. Every single day. Seen a man last week, skin like paper, whispered he was glad his kids never had to see him like that. Then he thanked *me* for never having any. Said it was a mercy. Hard to argue with that, standing where I stand. Bringing them in guarantees they’ll stand somewhere like that someday, or watch someone they love do it. The quiet spares them that. Plain and simple."

  **You:** But our kids... yours turned out okay, didn't they? They're happy. Doesn't that count?

  **Hospice Nurse:** (Her smile is genuine, tinged with something wistful. She picks up a ripe, perfect cherry tomato she'd set aside earlier, rolling it gently between her thumb and forefinger.) "Oh, they're wonders. Strong, kind, figuring it out. Proud of them every day. Doesn't change a damn thing about the gamble I took *for* them. They got dealt a decent hand *so far*. Luck. Pure luck." (She pops the tomato into her mouth, chews thoughtfully, savoring the burst of flavor.) "But the deck’s stacked with horrors too. They’ll draw those cards eventually. Everyone does. Knowing I shuffled that deck for them? That’s the weight. The quiet would’ve spared them that weight. It would’ve spared *me* knowing I signed them up for the eventual heartbreak, the fear, the pain. The quiet... it’s clean. This?" (She gestures vaguely, encompassing the garden, the world.) "It’s messy. Beautiful, sometimes. But messy. And it always ends messy."

  **You:** ...You really see no upside to anyone being born?

  **Hospice Nurse:** (She sighs, not impatiently, but like someone stating a simple, undeniable fact for the hundredth time. She plucks another tomato.) "The upside? It’s all *our* upside, love. *Our* joy at their first steps, *our* pride, *our* love. We get the sunrises *through their eyes*. Makes *us* feel alive. But *they* pay the price for *our* feeling alive. With their own eventual aches, fears, and that final, inevitable letting go." (She holds out the tomato to you, her hand steady, earth under her nails.) "Try this one. Sungold. Pure summer sunshine. Best I’ve grown in years. Taste it. Isn't it glorious? But tell me… did the tomato miss being salsa before you popped it in your mouth?" (She watches you, serene, waiting. The question hangs, simple and devastating.)
