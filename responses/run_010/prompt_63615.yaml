  ### Scorecard of Approaches Against Requirements
  Four approaches are evaluated against the full requirement list. Descriptions avoid authors/titles to focus on structure. Each is assessed as "pass" (satisfies), "fail" (violates), or "partial" (mixed or unclear).

  1. **Intentional Harm Focus** (e.g., double effect variants):  
     - Constraints prohibit intended harms; foreseen side-effects may be permitted.  
     - **Scorecard**:  
       - Contribution-Continuity: Fail (intention is binary, ignoring causal gradients).  
       - Description-Invariance: Fail (verdicts shift under redescriptions of intent).  
       - Grounding-Pressure: Fail (does not explain why personhood doesn't require minimizing intended harms).  
       - Selective Non-Minimization: Partial (forbids intending harm to minimize violations but may allow side-effects for non-violation harms; unclear in I-2).  
       - Uncertainty-Accommodation: Fail (intent is hard to ascertain under uncertainty).  
       - Action-Guidance: Partial (quick if intent is clear, but not under uncertainty).  
       - Accountability: Fail (intent is internal, hard to justify publicly).  
     - **Verdict**: Inoperable; fails key requirements.

  2. **Causal Thresholds with Rights** (e.g., responsibility-sensitive theories):  
     - Constraints strengthen with causal proximity; rights protect against certain harms.  
     - **Scorecard**:  
       - Contribution-Continuity: Pass (explicitly maps causal spectrum).  
       - Description-Invariance: Partial (causal roles may be description-dependent).  
       - Grounding-Pressure: Fail (if rights are personhood-based, doesn't resolve minimization).  
       - Selective Non-Minimization: Partial (allows redirecting threats for non-violation harms but may forbid minimization; struggles in I-4).  
       - Uncertainty-Accommodation: Partial (can model probabilistic causality, but may be complex).  
       - Action-Guidance: Fail (causal assessment can be computationally heavy).  
       - Accountability: Pass (rights and causation are publicly discussable).  
     - **Verdict**: Partially operable; fails Grounding-Pressure and Action-Guidance.

  3. **Rights-Forfeiture for Wrongdoing** (e.g., self-defense theories):  
     - Constraints bind unless victims forfeit rights via wrongdoing (e.g., sabotage in I-4).  
     - **Scorecard**:  
       - Contribution-Continuity: Fail (ignores non-wrongdoer variations, e.g., I-3 vs. I-1).  
       - Description-Invariance: Pass (rights are description-invariant).  
       - Grounding-Pressure: Fail (does not explain why personhood doesn't imply minimizing violations of non-forfeited rights).  
       - Selective Non-Minimization: Pass (forbids violating constraints against non-wrongdoers to minimize violations, but allows defensive harm against wrongdoers).  
       - Uncertainty-Accommodation: Fail (forfeiture is unclear under uncertainty, e.g., I-5).  
       - Action-Guidance: Partial (clear when wrongdoing is certain, but not under uncertainty).  
       - Accountability: Pass (wrongdoing and rights are public concepts).  
     - **Verdict**: Weak on continuity, grounding, and uncertainty.

  4. **Scalar Constraints with Aggregation** (e.g., threshold deontology):  
     - Constraints have weights that can be overridden by sufficiently large benefits or probabilities.  
     - **Scorecard**:  
       - Contribution-Continuity: Pass (stringency can vary with causal role).  
       - Description-Invariance: Partial (weights may shift with description).  
       - Grounding-Pressure: Fail (aggregation undermines personhood grounding by permitting violations for net gains).  
       - Selective Non-Minimization: Fail (treats violation-minimization and non-violation harm-prevention alike, e.g., allows killing one in I-1 if numbers are high).  
       - Uncertainty-Accommodation: Pass (incorporates expected values).  
       - Action-Guidance: Fail (requires complex aggregation calculations).  
       - Accountability: Partial (aggregation is intuitive but may seem consequentialist).  
     - **Verdict**: Fails core deontological requirements like Selective Non-Minimization.

  ---

  ### Most Excluding Requirement
  **Grounding-Pressure** does the most to exclude candidate theories because it targets the foundational paradox of deontology: if constraints are grounded in the value of persons, this seems to generate a contradiction by also supporting minimization. Most theories either fail to resolve this (collapsing into consequentialism) or rely on ad hoc distinctions that violate other requirements (e.g., Action-Guidance). It is the sharpest filter for operability, as inconsistent grounding makes a theory indefensible to disagreeers.

  Verdict: \answer{Grounding-Pressure}
