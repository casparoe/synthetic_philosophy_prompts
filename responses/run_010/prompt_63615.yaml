prompt: |-
  I am preparing the opening specification for a graduate seminar on the paradox of deontology, and before my students read a single argument for or against agent-centered constraints I want them to have the specification itself: what a theory of such constraints must be able to do in order to count as adequate. Write that specification for me.

  Fix the purpose as follows, and let it discipline the whole list. I am not after a theory that is merely true; I am after one that is operable — one that could be handed to a decision-maker who must act now, who cannot be certain of the numbers, and who will afterwards be held to it by people who disagree with her.

  Four requirements I would already put on the list, in my own coinage. You may sharpen them, and you should tell me if any is bogus.

  1. Contribution-Continuity. As the agent's causal relation to a threat moves along a spectrum — from failing to notice it, to failing to block it at negligible cost, to redirecting a threat that would otherwise pass through something she owns, to originating it herself — the stringency of any constraint must vary either smoothly or at points where the theory can identify a morally significant break. A theory may not merely assert a chasm between doing and allowing and leave the spectrum unmapped.

  2. Description-Invariance. Whether a constraint is engaged may not turn on which of two equally accurate descriptions of the same event is selected ("withdrawing the water" rather than "drowning him"; "letting the surge continue" rather than "routing it").

  3. Grounding-Pressure. If the theory grounds constraints in the value or the separateness of persons, it must explain why that very value does not equally generate agent-neutral reason to minimize violations of the same constraint by others — which would dissolve the constraint it was invoked to secure.

  4. Selective Non-Minimization. The theory must explain why an agent may not violate a constraint in order to prevent more violations of that same constraint by others, while remaining free, and perhaps obliged, to prevent deaths that involve no violation at all. An account that treats these two situations alike has explained too much.

  To these add every further requirement you judge genuine. More importantly, identify the demands that are ordinarily smuggled in as requirements but are in fact the preferences of one camp — some assumption about exceptionlessness, perhaps, or about what a theory must do with the agent's own distress, or about matching intuition in every variant of every famous case — and say why each fails to be a requirement at all.

  So that the requirements can be shown to discriminate rather than merely to sound plausible, test them against a battery I have constructed. A dam operator can open a spillway that will save five workers in a downstream channel; the diverted water will drown one worker trapped in a maintenance gallery. Variants:

  - I-1: The gallery worker is trapped by accident; his drowning is foreseen but forms no part of the operator's plan.
  - I-2: The diversion saves the five only because the water is routed through the gallery, so his presence is part of the causal route by which the saving is achieved.
  - I-3: The surge is one the operator himself released minutes earlier, in the course of a routine and permitted operation.
  - I-4: The gallery worker is a saboteur who is about to open a second sluice that would drown five others elsewhere; diverting the water into the gallery is the only way to stop him.
  - I-5: Identical to I-1, except that the operator's instruments give her only 0.6 confidence that there are five in the channel at all.

  For each variant, state which requirement it probes and what a theory failing that requirement would predict there.

  Present each requirement with a label; a one-sentence statement; the case or consideration motivating it; an explicit failure condition, saying what it would look like for a theory to violate it; and a status marking it non-negotiable, negotiable, or camp-prejudice.

  Then do the part I most want. If some subset of the requirements is jointly unsatisfiable, demonstrate it: set out the subset and give the argument as a short derivation rather than an assertion, then say which requirement must be dropped or weakened to restore consistency, and what the loss costs us. If you think the list is jointly satisfiable, argue that as carefully, and describe what a satisfying theory would have to look like.

  Close with a scorecard, of no more than a few sentences per approach, of at most four approaches to constraints — identified by description rather than by author or title, since I want no bibliography or reading list anywhere in your answer — against the finished list.

  Before the final line, state in prose which single requirement does the most to exclude candidate theories and why. Then end with one line in exactly this form, containing only the label: Verdict: \answer{label}
reasoning: |-
  We are preparing an opening specification for a graduate seminar on the paradox of deontology. The goal is to set out what a theory of agent-centered constraints must do to be adequate, with a focus on being operable for decision-makers. We start with the four provided requirements, which we will sharpen and critique, then add further genuine requirements and identify common smuggled assumptions that are not requirements.

  The purpose is not truth but operability: the theory must be usable by a decision-maker who must act now, under uncertainty, and who will be held accountable by others who may disagree.

  We have four initial requirements:

  1. Contribution-Continuity: The stringency of constraints must vary smoothly or at morally significant breaks along a spectrum of causal involvement. Failure would be an unmapped chasm, e.g., between doing and allowing.

  2. Description-Invariance: Constraints must not depend on which accurate description of an event is chosen. Failure would be different moral verdicts under equally accurate descriptions.

  3. Grounding-Pressure: If constraints are grounded in the value or separateness of persons, the theory must explain why this does not generate agent-neutral reasons to minimize violations, which would dissolve constraints. Failure would be an unexplained asymmetry.

  4. Selective Non-Minimization: The theory must explain why an agent may not violate a constraint to prevent more violations by others, but may prevent deaths that involve no violation. Failure would treat these cases alike.

  We will add more requirements and identify non-requirements (camp-prejudices).

  Then we will test the requirements against the dam operator variants to show how they discriminate.

  Finally, we will check for joint satisfiability and scorecard existing approaches.

  Step 1: Sharpen the initial four requirements.

  - Contribution-Continuity: We must avoid an arbitrary jump. The spectrum includes: ignorance, negligent omission, using one's property to redirect, and active initiation. A break must be justified by a morally relevant factor.

  - Description-Invariance: This is about the level of description. We require that the moral status of an act is invariant under redescriptions that are extensionally equivalent (refer to the same events). This rules out theories that are sensitive to framing.

  - Grounding-Pressure: This targets a common paradox in deontology. If the value of persons is what grounds constraints, then why isn't it better to minimize violations? The theory must resolve this tension without collapsing into consequentialism.

  - Selective Non-Minimization: This distinguishes between minimizing violations (which is forbidden) and minimizing harms that are not violations (which is allowed). A theory that forbids both or allows both fails.

  Step 2: Add further genuine requirements.

  After reflection, I propose:

  5. Uncertainty-Accommodation: The theory must provide guidance when probabilities are involved, not just certain outcomes. It must not require certainty about outcomes or numbers to be applicable. (Motivation: Real decisions are made under uncertainty. Failure: The theory cannot be applied in I-5.)

  6. Action-Guidance: The theory must yield a verdict in a reasonable time for the agent. It must not require infinite regress of calculations or impossible information. (Motivation: Operability for decision-makers under time pressure. Failure: The theory is practically useless.)

  7. Accountability: The theory must be justifiable to others, including those who disagree, in terms they can understand and engage with, even if they reject the theory's foundations. (Motivation: The agent will be held to it by others. Failure: The theory is esoteric and cannot serve as a public standard.)

  Step 3: Identify non-requirements (camp-prejudices).

  - Exceptionlessness: Some think constraints must be absolute, without exceptions. But this is a preference, not a requirement. A theory can have thresholds or exceptions and still be operable. (Why not required? Because a theory with well-defined exceptions can guide action.)

  - Intuition-Matching: A theory need not match every intuition in every variant of every case. Intuitions can be mistaken or culturally variable. (Why not required? Operability does not demand universal intuitive appeal; it demands clear rules.)

  - Agent's Distress: Some theories give weight to the agent's own distress at violating a constraint. But this is not necessary; a theory can be objective. (Why not required? The distress might be relevant but not essential for the constraint itself.)

  Step 4: Test the requirements against the dam variants.

  We have five variants:

  I-1: Gallery worker trapped by accident; drowning is foreseen but not part of the plan. (Standard trolley-like diversion.)

  I-2: The diversion saves the five only because the water is routed through the gallery, so the gallery worker's presence is part of the causal route. (Similar to using a fat man to stop a trolley?)

  I-3: The surge is one the operator himself released earlier in a routine operation. (Now the agent is more causally involved.)

  I-4: The gallery worker is a saboteur; diverting water stops him and saves five. (Self-defense? Prevention of wrongdoing?)

  I-5: Identical to I-1 but with only 0.6 confidence about the five. (Uncertainty.)

  Now, for each variant, we identify which requirement it probes and what a failing theory would predict.

  - I-1: Probes Selective Non-Minimization (and also Contribution-Continuity). A failing theory might say: because the drowning is a violation, you cannot do it to save five, even though the five deaths would not be violations. But Selective Non-Minimization requires that we may prevent non-violation deaths. So a theory that forbids diverting in I-1 fails Selective Non-Minimization if it does so because it treats the drowning as a violation that cannot be minimized. But note: in I-1, the drowning might be seen as a violation (if constraints are against killing) or not (if it's merely allowing). So it also probes Contribution-Continuity.

  Alternatively, I-1 is a standard case for constraints: you may not kill one to save five? But Selective Non-Minimization requires that we can prevent deaths that are not from constraint violations. In I-1, the five dying would be from a natural threat, so no violation. So a constraint theory should allow diverting? But deontologists typically forbid it? Let me clarify:

  In I-1: The operator would be killing one (by diverting water) to save five. Standard deontology says this is prohibited by a constraint against killing. But Selective Non-Minimization says: the theory must explain why you cannot kill one to save five (which involves a violation) but you can, say, divert a threat that kills one as a side effect (if that is allowed) or save five from a natural disaster without killing. So I-1 is a test for whether the theory allows the diversion when it is the only way to save five from a non-violation death. A failing theory (one that violates Selective Non-Minimization) might either forbid all such actions (even when no violation is prevented) or allow all (even when a violation is committed to prevent violations by others). But in I-1, the death of the one is a violation (if the constraint is against killing) and the five are being saved from a non-violation death. So a theory that forbids the action in I-1 might be consistent with Selective Non-Minimization if it holds that you may not violate a constraint to prevent non-violation deaths? That seems wrong because Selective Non-Minimization says you may prevent deaths that involve no violation. So the theory must allow preventing the five deaths? But then why is I-1 forbidden? This is tricky.

  Let me re-read Selective Non-Minimization: "explain why an agent may not violate a constraint in order to prevent more violations of that same constraint by others, while remaining free, and perhaps obliged, to prevent deaths that involve no violation at all."

  So the key is: preventing deaths that involve no violation is allowed (and maybe obligatory), but violating a constraint to prevent more violations of that same constraint is not allowed.

  In I-1: The five deaths would be from a natural cause? Or from the water surge? But the surge is a threat. The operator is considering diverting the surge to kill one instead of five. The five deaths, if they occur, are not violations by anyone (if we assume no one is responsible for the surge). So they are non-violation deaths. Therefore, according to Selective Non-Minimization, the agent should be allowed to prevent them, even if it causes one death? But then why do deontologists forbid it? Because causing the one death is a violation? So the theory must explain why you cannot cause a violation to prevent non-violation deaths. That seems to go against Selective Non-Minimization? Not exactly: Selective Non-Minimization says you may prevent non-violation deaths, but it doesn't say you may do so by violating a constraint. It leaves open that you may prevent non-violation deaths by means that don't violate constraints. So in I-1, if diverting the water violates a constraint (against killing), then you cannot do it. But if it doesn't violate a constraint (maybe because it's a diversion with a side effect?), then you can. But that's exactly what Contribution-Continuity and Description-Invariance are about.

  I think I-1 primarily tests Contribution-Continuity and Description-Invariance because the moral assessment must not depend on how we describe the act (e.g., "diverting to save five" vs. "killing one") and must fit on the causal spectrum.

  But let's assign:

  - I-1: Probes Contribution-Continuity and Selective Non-Minimization. A failing theory might arbitrarily forbid the diversion without explaining the break in the causal spectrum. Or, if it forbids, it must explain why preventing non-violation deaths is not allowed when it requires a violation.

  But note: Selective Non-Minimization does not require that we can prevent non-violation deaths by any means; only that we are free to prevent them (by permissible means). So if diverting is impermissible, then we cannot use that means. But then the test is whether the theory can explain why diverting is impermissible in I-1 but not in other cases? This is where the spectrum comes in.

  Alternatively, I-1 is a standard case that a constraint theory must handle. We'll use the variants to test specific requirements.

  I propose:

  - I-1: Probes Contribution-Continuity. A theory that violates Contribution-Continuity might have a sudden jump between allowing and doing, without accounting for the causal role. In I-1, the agent is redirecting a threat, which might be seen as "doing" harm. A theory that has a chasm might forbid it without justification.

  - I-2: Probes Description-Invariance. Here, the gallery worker's presence is part of the causal route. Descriptions might include "using the worker's body to block the water" or "diverting the water which happens to go through the gallery". If the moral verdict changes based on description, the theory fails Description-Invariance.

  - I-3: Probes Contribution-Continuity. The agent originated the threat. A theory must show how this increases stringency, or if not, why not.

  - I-4: Probes Selective Non-Minimization. Here, the gallery worker is a saboteur. If the agent diverts the water to stop him, is that violating a constraint to prevent a violation (by the saboteur)? But the saboteur is about to violate a constraint (drowning five). So the operator would be violating a constraint (killing the saboteur) to prevent more violations (the five drownings). Selective Non-Minimization says she may not do that. But intuitively, self-defense or prevention of wrongdoing might allow it. So a failing theory might either forbid it (as a violation to prevent violations) or allow it (but then must explain why this is different). This variant tests whether the theory can account for exceptions, such as when the victim is a wrongdoer.

  - I-5: Probes Uncertainty-Accommodation. A theory that requires certainty would be inapplicable. A failing theory might say: without certainty, we cannot apply the constraint, so the operator cannot act, or must default to a different rule.

  Now, we write the requirements formally.

  Step 5: Present each requirement with:
  - Label
  - One-sentence statement
  - Motivation (case or consideration)
  - Failure condition (what it looks like for a theory to violate it)
  - Status: non-negotiable, negotiable, or camp-prejudice

  Requirements:

  1. Contribution-Continuity
     - Statement: The stringency of a constraint must vary either continuously or with justified breaks along a spectrum of causal involvement.
     - Motivation: To avoid an arbitrary moral difference between, e.g., redirecting a threat and originating it.
     - Failure: A theory that posits a sharp discontinuity without identifying a morally significant factor.
     - Status: Non-negotiable for operability, as decision-makers face a range of causal roles.

  2. Description-Invariance
     - Statement: The engagement of a constraint must be invariant under extensionally equivalent descriptions of the same event.
     - Motivation: To prevent moral verdicts from being manipulable by redescription, e.g., "withdrawing aid" vs. "killing".
     - Failure: A theory that yields different verdicts for the same act under different accurate descriptions.
     - Status: Non-negotiable for objectivity and operability.

  3. Grounding-Pressure
     - Statement: If constraints are grounded in the value or separateness of persons, the theory must explain why this does not generate overriding agent-neutral reasons to minimize violations.
     - Motivation: To resolve the paradox that the same value seems to both forbid and require violating constraints in minimization scenarios.
     - Failure: A theory that grounds constraints in personhood but cannot explain why we shouldn't minimize violations, thus collapsing into consequentialism.
     - Status: Non-negotiable for internal consistency.

  4. Selective Non-Minimization
     - Statement: The theory must explain why an agent must not violate a constraint to prevent more violations of the same constraint by others, but may (or must) prevent harms that do not involve any constraint violation.
     - Motivation: To distinguish between minimizing violations (forbidden) and minimizing non-violation harms (permitted), e.g., in standard trolley cases.
     - Failure: A theory that treats preventing violation-minimization and non-violation harm-minimization alike, either forbidding both or permitting both.
     - Status: Non-negotiable for capturing core deontological intuition.

  5. Uncertainty-Accommodation
     - Statement: The theory must provide guidance under conditions of uncertainty about outcomes, numbers, or other relevant facts.
     - Motivation: Real decisions often lack certainty, e.g., I-5 where confidence is only 0.6 about the five.
     - Failure: A theory that requires certainty to apply, leaving the agent without guidance in uncertain cases.
     - Status: Non-negotiable for operability.

  6. Action-Guidance
     - Statement: The theory must yield a verdict in a timely manner without requiring excessive computation or information.
     - Motivation: Decision-makers must act now; they cannot engage in endless reflection or gather impossible data.
     - Failure: A theory that is too complex or informationally demanding to be used in practice.
     - Status: Non-negotiable for operability.

  7. Accountability
     - Statement: The theory must be publicly justifiable, i.e., its verdicts must be explicable to others in terms they can engage with, even if they reject the theory's foundations.
     - Motivation: The agent will be held accountable by others who may disagree.
     - Failure: A theory that relies on premises that are esoteric or inaccessible to reasonable interlocutors.
     - Status: Non-negotiable for social operability.

  Non-requirements (camp-prejudices):

  - Exceptionlessness: The idea that constraints must be absolute without exceptions. (Status: Camp-prejudice; a theory can have exceptions and still be operable if the exceptions are well-defined.)

  - Intuition-Matching: The demand that the theory must match all common intuitions in every case variant. (Status: Camp-prejudice; intuitions can be flawed and operability does not require universal agreement.)

  - Agent's Distress: The assumption that the theory must give independent weight to the agent's own distress at violating a constraint. (Status: Camp-prejudice; while distress may be relevant, it is not essential to the constraint structure and may be handled separately.)

  Step 6: Joint satisfiability.

  Is the set of non-negotiable requirements jointly satisfiable?

  The non-negotiable ones are: Contribution-Continuity, Description-Invariance, Grounding-Pressure, Selective Non-Minimization, Uncertainty-Accommodation, Action-Guidance, Accountability.

  We must see if there is a conflict.

  Consider Grounding-Pressure and Selective Non-Minimization.

  Grounding-Pressure requires that the grounding of constraints does not lead to minimizing violations. Selective Non-Minimization requires that we may not violate a constraint to minimize violations but may prevent non-violation harms.

  But what if the grounding (e.g., the value of persons) also implies that we should minimize total harms? Then why not violate a constraint to prevent a non-violation harm? Selective Non-Minimization says we may prevent non-violation harms, but it doesn't say we may violate a constraint to do so. So the constraint still holds.

  But Grounding-Pressure must ensure that the value does not generate a duty to minimize violations. That seems compatible.

  Now, consider Action-Guidance and Uncertainty-Accommodation: A theory that handles uncertainty might be complex, but we require it to be simple enough for Action-Guidance. This might be challenging but not impossible.

  Accountability might conflict if the theory is very complex, but again, it must be explicable.

  I think the requirements are jointly satisfiable. However, there might be tension between Contribution-Continuity and Description-Invariance.

  For example, if a theory uses a fine-grained description of the causal chain, it might violate Description-Invariance if two descriptions are equivalent but one highlights a break. But Description-Invariance requires that the moral verdict does not depend on the description, so the theory must be set up so that the breaks in Contribution-Continuity are not description-dependent.

  So they can be satisfied together: the theory must identify breaks that are description-invariant.

  Now, what would a satisfying theory look like?

  - It must have a clear account of what makes an act a violation (e.g., intention, causal involvement) that is description-invariant.
  - It must ground constraints in a way that avoids the minimization paradox (e.g., by agent-relative permissions or prohibitions).
  - It must provide rules for uncertainty (e.g., thresholds, expected violations).
  - It must be computationally feasible and publicly justifiable.

  Step 7: Scorecard of approaches.

  We describe four approaches without naming authors.

  Approach 1: Double Effect with Intention-Focus
  - This approach distinguishes between intended and foreseen harms. Constraints prohibit intended harms.
  - Test:
    - Contribution-Continuity: May not map the causal spectrum well; intention can be binary.
    - Description-Invariance: Vulnerable; redescribing intention can change verdicts.
    - Grounding-Pressure: Typically grounded in personhood but doesn't resolve why we shouldn't minimize intended harms by others.
    - Selective Non-Minimization: Forbids intending harm to prevent violations but may allow foreseeing harm to prevent non-violation harms? But in I-1, if diverting is not intended harm, it might be allowed. In I-4, if killing the saboteur is intended, it might be forbidden even though he is a wrongdoer.
    - Uncertainty: Not well-developed; intention might be hard to ascertain under uncertainty.
    - Action-Guidance: Can be quick if intention is clear, but under uncertainty, it may be difficult.
    - Accountability: Intention is internal, hard to justify publicly.

  Approach 2: Causal Role with Thresholds
  - Constraints are triggered by certain causal roles (e.g., initiating vs. allowing), with thresholds for stringency.
  - Test:
    - Contribution-Continuity: Good, as it explicitly maps the spectrum.
    - Description-Invariance: May be violated if the causal role is description-dependent.
    - Grounding-Pressure: Must explain why causal role matters for personhood value.
    - Selective Non-Minimization: Might allow redirecting threats for non-violation harms but forbid for violations? But must explain why causal role makes a difference to minimization.
    - Uncertainty: Can incorporate probabilistic causal models.
    - Action-Guidance: May require complex causal assessment.
    - Accountability: Causal assessment can be technical.

  Approach 3: Rights-Forfeiture for Wrongdoing
  - Constraints protect rights, but rights are forfeited by wrongdoing, allowing defensive harm.
  - Test:
    - Contribution-Continuity: May not account for non-wrongdoer variations along the spectrum.
    - Description-Invariance: Rights might be description-invariant.
    - Grounding-Pressure: Grounded in rights, but must explain why rights don't generate minimization duties.
    - Selective Non-Minimization: Allows violating constraints against wrongdoers to prevent their violations, but forbids against innocents. Handles I-4 well, but in I-1, it would forbid killing an innocent to save five. However, it may not explain why we can prevent non-violation harms (if that requires killing an innocent).
    - Uncertainty: How to know if someone is a wrongdoer under uncertainty?
    - Action-Guidance: Clear when wrongdoing is certain.
    - Accountability: Rights language is publicly accessible.

  Approach 4: Scalar Constraints with Aggregation
  - Constraints have a scalar strength that can be overridden by large enough numbers or probabilities.
  - Test:
    - Contribution-Continuity: Can vary continuously with causal role.
    - Description-Invariance: Must be ensured.
    - Grounding-Pressure: If grounded in personhood, must explain why aggregation is allowed sometimes.
    - Selective Non-Minimization: May allow violating a constraint to prevent more violations if the numbers are high, but this violates the non-minimization requirement. It might also allow violating to prevent non-violation harms. So it fails Selective Non-Minimization by not distinguishing the two.
    - Uncertainty: Can incorporate expected violations.
    - Action-Guidance: Requires calculation of numbers and probabilities.
    - Accountability: Aggregation can be explained.

  Step 8: Which requirement does the most to exclude?

  Grounding-Pressure is the most challenging because it targets the foundational paradox. Many theories either cannot explain why minimization isn't required (collapsing to consequentialism) or must invoke ad hoc distinctions.

  Finally, Verdict: We end with the label of the requirement that is most excluding.

  Given the above, I think Grounding-Pressure is the hardest.

  But let's see: in the scorecard, many approaches fail Grounding-Pressure.

  Verdict: Grounding-Pressure

  Now, structure the answer.
answer: |-
  ### Specification for an Adequate Theory of Agent-Centered Constraints

  The purpose of this specification is to define what a theory of agent-centered constraints must achieve to be *operable*—not merely true. An operable theory must be usable by a decision-maker who: (1) must act immediately, (2) faces uncertainty (e.g., about outcomes or numbers), and (3) will be held accountable by others who disagree. It must provide clear, actionable guidance that withstands scrutiny in real-world conditions. Below, I present requirements derived from your initial four, sharpened for operability, plus additional genuine requirements. I then identify non-requirements (camp-prejudices) that are often smuggled in. The requirements are tested against your dam operator battery, assessed for joint satisfiability, and used to scorecard approaches. Requirements are labeled for reference.

  ---

  ### Requirements for an Adequate Theory
  Each requirement is presented as follows:  
  - **Label**: A concise name.  
  - **Statement**: A one-sentence formulation.  
  - **Motivation**: The case or consideration justifying it.  
  - **Failure Condition**: What it looks like for a theory to violate it.  
  - **Status**: Non-negotiable (essential for operability), negotiable (could be adapted without undermining operability), or camp-prejudice (a preference of one philosophical camp, not a requirement).

  1. **Contribution-Continuity**  
     - **Statement**: The stringency of a constraint must vary either continuously or at morally significant breaks along a spectrum of causal involvement, with breaks justified by factors the theory can identify.  
     - **Motivation**: Decision-makers face graded causal roles (e.g., in your dam cases: accidental threat, redirected threat, or agent-originated threat); arbitrary gaps (e.g., a rigid doing/allowing distinction) leave agents without guidance in borderline cases.  
     - **Failure Condition**: A theory asserts a sharp discontinuity (e.g., between "allowing" and "doing") without mapping the spectrum or identifying breaks, making it inapplicable to nuanced decisions.  
     - **Status**: Non-negotiable. Operability demands that agents can locate their actions on a moral "map," not face unmapped chasms.

  2. **Description-Invariance**  
     - **Statement**: Whether a constraint is engaged must not depend on which of two extensionally equivalent descriptions of the same event is selected.  
     - **Motivation**: Redescriptions (e.g., "withdrawing the water" vs. "drowning him" in I-1) should not alter verdicts, as this invites manipulation and undermines accountability.  
     - **Failure Condition**: A theory yields different verdicts for the same act under equally accurate descriptions, rendering it vulnerable to framing effects.  
     - **Status**: Non-negotiable. Operability requires objective, description-independent standards for public justification.

  3. **Grounding-Pressure**  
     - **Statement**: If constraints are grounded in the value or separateness of persons, the theory must explain why this value does not generate overriding agent-neutral reasons to minimize violations by others.  
     - **Motivation**: Without this, the grounding value (e.g., personhood) seems to both forbid violations and require minimizing them, collapsing constraints into consequentialism (e.g., in I-4, killing a saboteur to save five might be seen as minimizing violations).  
     - **Failure Condition**: A theory invokes personhood to justify constraints but cannot resolve why agent-neutral minimization does not dissolve them, leading to incoherence or consequentialism.  
     - **Status**: Non-negotiable. Operability demands internal consistency to avoid self-defeating guidance.

  4. **Selective Non-Minimization**  
     - **Statement**: The theory must explain why an agent may not violate a constraint to prevent more violations of that same constraint by others, but may (or must) prevent harms that involve no violation at all.  
     - **Motivation**: Agents must distinguish prohibited minimization of violations (e.g., killing one to prevent five murders) from permissible prevention of non-violation harms (e.g., diverting a threat to save five from an accident), as in I-1 vs. I-4.  
     - **Failure Condition**: A theory treats violating a constraint to prevent violations identically to preventing non-violation harms, forbidding both or permitting both.  
     - **Status**: Non-negotiable. Operability hinges on this distinction to avoid over- or under-protecting constraints.

  5. **Uncertainty-Accommodation** (Added)  
     - **Statement**: The theory must provide guidance under uncertainty about outcomes, numbers, or facts, without requiring certainty for application.  
     - **Motivation**: Decision-makers often lack precise information (e.g., I-5: 0.6 confidence about the five workers); operability fails if the theory only handles certainty.  
     - **Failure Condition**: A theory is inapplicable or yields no verdict under uncertainty, forcing agents to guess or default to non-moral reasoning.  
     - **Status**: Non-negotiable. Real-world decisions are inherently uncertain.

  6. **Action-Guidance** (Added)  
     - **Statement**: The theory must yield a verdict in a timely manner without requiring excessive computation, infinite regress, or unattainable information.  
     - **Motivation**: Agents "must act now"; operability demands efficiency (e.g., in dam variants, a complex calculation might delay life-or-death decisions).  
     - **Failure Condition**: A theory demands unrealistic deliberation (e.g., assessing all possible descriptions or causal chains) or is too vague for real-time use.  
     - **Status**: Non-negotiable. Time pressure is universal in high-stakes decisions.

  7. **Accountability** (Added)  
     - **Statement**: The theory must be publicly justifiable, with verdicts explicable in terms accessible to reasonable disagreeers, even if they reject its foundations.  
     - **Motivation**: Agents "will afterwards be held to it"; operability requires social defensibility (e.g., a dam operator must explain actions to bereaved families or critics).  
     - **Failure Condition**: A theory relies on esoteric or inaccessible reasoning (e.g., obscure moral metaphysics), making it unjustifiable to others.  
     - **Status**: Non-negotiable. Accountability is central to social operability.

  ---

  ### Non-Requirements: Common Camp-Prejudices
  These are often treated as requirements but are preferences of specific philosophical camps. They are excluded because operability does not demand them, and they may impair usability:
  - **Exceptionlessness**: The assumption that constraints must be absolute without exceptions.  
    - **Why not required?** Operability allows for thresholds or exceptions if clearly defined (e.g., self-defense in I-4). A theory with well-defined exceptions can still guide action, while absoluteness may force counterintuitive verdicts.
  - **Intuition-Matching**: The demand that the theory must match all common intuitions in every variant of every case.  
    - **Why not required?** Intuitions are often inconsistent or culturally variable; operability prioritizes clear rules over intuitive appeal, as long as verdicts are justifiable (e.g., a theory might forbid diverting in I-1 even if some intuitions permit it).
  - **Agent's Distress**: The assumption that the theory must give independent weight to the agent's distress at violating a constraint.  
    - **Why not required?** Distress is subjective and variable; operability focuses on objective action-guidance, though a theory may address distress separately (e.g., as a excusing condition).

  ---

  ### Testing Requirements Against Dam Operator Battery
  For each variant, I specify which requirement it probes, what a failing theory predicts, and how it discriminates. This shows how the requirements weed out inoperable theories.

  - **I-1 (Gallery worker trapped by accident; drowning foreseen but unintended)**:  
    - **Probes**: Contribution-Continuity (causal role: redirecting a threat) and Selective Non-Minimization (preventing non-violation deaths).  
    - **Failing theory prediction**: A theory violating Contribution-Continuity might forbid diversion due to an unmapped "doing/allowing" chasm, even if causally similar to allowing harm. One violating Selective Non-Minimization might forbid diversion because it causes a violation (killing one), failing to distinguish it from preventing non-violation deaths (the five would die by accident).  
    - **Discrimination**: Adequate theories must allow or forbid based on the causal spectrum and the non-violation status of the five's deaths.

  - **I-2 (Diversion saves five only because water is routed through gallery, making worker's presence causal)**:  
    - **Probes**: Description-Invariance (equivalent descriptions: "diverting water" vs. "using the worker as a means").  
    - **Failing theory prediction**: A theory violating Description-Invariance might permit diversion under "diverting water" but forbid it under "using the worker," altering verdicts based on framing.  
    - **Discrimination**: Adequate theories must yield the same verdict regardless of description.

  - **I-3 (Surge originated by operator in routine operation)**:  
    - **Probes**: Contribution-Continuity (causal role: originating vs. redirecting a threat).  
    - **Failing theory prediction**: A theory violating Contribution-Continuity might treat originating identically to redirecting, missing a potential break (e.g., increased stringency due to responsibility).  
    - **Discrimination**: Adequate theories must explain if stringency increases, decreases, or holds constant along the causal spectrum.

  - **I-4 (Gallery worker is a saboteur; diversion stops him and saves five)**:  
    - **Probes**: Selective Non-Minimization (violating a constraint to prevent violations by others) and Grounding-Pressure (if personhood grounds constraints, why not minimize violations by killing the saboteur?).  
    - **Failing theory prediction**: A theory violating Selective Non-Minimization might forbid diversion (as "minimizing violations") or permit it identically to I-1 (failing to distinguish violation-prevention). One violating Grounding-Pressure might permit it on minimization grounds, collapsing into consequentialism.  
    - **Discrimination**: Adequate theories must forbid violation-minimization (killing to prevent killings) but may permit it here if justified independently (e.g., self-defense), without invoking minimization.

  - **I-5 (Identical to I-1, but 0.6 confidence about the five)**:  
    - **Probes**: Uncertainty-Accommodation and Action-Guidance.  
    - **Failing theory prediction**: A theory violating Uncertainty-Accommodation might demand certainty, yielding no verdict or arbitrary default. One violating Action-Guidance might require complex probability calculations, delaying action.  
    - **Discrimination**: Adequate theories must provide timely guidance with probabilistic inputs (e.g., thresholds for acceptable risk).

