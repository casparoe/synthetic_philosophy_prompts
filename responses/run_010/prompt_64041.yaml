  Hmm, the constraints are challenging. The audience includes family, academics familiar with Russell, and a sleeping great-aunt. The toast must be accessible yet philosophically sound, warm but not saccharine, and under four minutes. The user specifically wants to explore Russell's distinction between promising feelings versus promising actions—a subtle but crucial point. 

  First, I should address the core philosophical tension: Russell rejected promising emotions but valued commitments. The toast needs to frame marriage as a conscious choice to show up daily. Practical promises ("I'll choose you") work better than emotional ones ("I'll always feel passion"). 

  For structure: opening humor (grandmother's attention), then the couple's specific story to ground it. Invented details like "they met during a library flood" can personalize it. The Russell reference must dual-wield: grandmother hears "wise," colleagues hear "Book III, Chapter 6." 

  Watch for smuggled assumptions: 
  - "Choosing each other daily" avoids destiny. 
  - Acknowledging challenges ("even when it's hard") rejects permanence-as-fact. 
  - Neutral phrasing on children ("their shared life") defuses tension. 

  The jokes need to land universally—maybe tease about the couple's quirks (overcooked pasta, mismatched socks). Warmth comes from highlighting their tangible care: "how he brings her coffee exactly at 10:30." 

  Final check: 
  - No "soulmates" or "meant to be." 
  - Russell named once, neutrally. 
  - Children mentioned as non-regret. 
  - Action-focused promises. 

  The professor’s authenticity matters most. If they’d wince at a line, it’s out.
answer: |-
  Here’s a toast draft that navigates your constraints while centering Russell’s actionable-commitment insight. The core distinction: **promising *to act* with loyalty and care (which you *can* control), not promising to *feel* a certain way forever (which you *cannot*)**.  

  ---

  ### Wedding Toast Draft (570 words; ~3m 50s spoken)
  "Friends, family, colleagues—and Great-Aunt Ida, I promise this’ll be more interesting than the floral arrangements… though I can’t guarantee it’ll beat *your* nap. [*Pause for laughter*]  

  Seriously though. We’re here because today, [Bride] and [Groom] did something remarkable. They stood before us and made promises. Not predictions about sunshine or smooth sailing. And not just declarations of how they feel *right now*. They promised *actions*.  

  I’ve known [Bride] since she was debating Kant in my seminar, and I’ve watched her and [Groom] build something real. Like how they met—[EXAMPLE: *amid the chaos of a grad school mixer, bonding over terrible campus coffee*]. Or their shared obsession with [EXAMPLE: *rescuing slightly deranged-looking houseplants*]. Or how [Groom] always [EXAMPLE: *saves the last bite of dessert for her, even if it’s his favorite*]. These aren’t grand gestures. They’re tiny, daily choices. *That’s* what today was about.  

  They promised to *show up*. To choose each other, actively, day after day. To be the person the other can rely on—not because some starry destiny forces them, but because they *decide* to. That’s harder. And braver.  

  Love isn’t a static thing you find, like a perfect seashell. It’s a fire you tend. Sometimes it blazes; sometimes it’s embers needing shelter from the wind. What matters isn’t never feeling cold—it’s knowing *how to rebuild the fire together*.  

  Russell—a wise man, and a keen observer of human folly—once noted that promising eternal passion is like promising tomorrow’s weather. You just can’t. But promising *fidelity*? That’s different. It’s promising to protect what you’ve built. To prioritize each other. To handle attraction or friction with honesty and respect. That’s a vow you *can* keep. [*Grandma hears "wise man"; colleagues hear the fidelity/passion distinction*].  

  [Groom] and [Bride] know this. Their life together—their adventures, their quiet nights, their [EXAMPLE: *fierce yet deeply ridiculous board game rivalries*]—is built on these choices. They’ve chosen a shared path, deliberately. No cosmic scripts. No assumptions about permanence as a *given*. Just two people, every day, saying *"You. Again."*  

  And yes, that path is theirs alone. It’s shaped by their values—including their thoughtful choice to define their family on their own terms, embracing the full, rich life they’re creating together.  

  So let’s raise a glass. Not to fate, or flawless futures. But to [Bride] and [Groom]. To their courage in making promises they can actually *live*. To their trust in each other’s *character*, not just their feelings. To the work, the joy, and the thousand small choices ahead. May they keep tending that fire—with laughter, patience, and maybe a few more [EXAMPLE: *rescued, slightly crooked philodendrons*].  

  To the couple!"  

  ---

  ### Your Safety Check: Potential Smuggled Assumptions  
  1. **"Permanence as fact" risk:**  
     - *Line:* "They promised to *show up*. To choose each other, actively, **day after day**."  
     - *Check:* "Day after day" implies an *ongoing intention*, not a guaranteed outcome. It’s future-directed action, not a claim about inevitability. Revise if too close to implying factual permanence.  

  2. **"Children as omission" risk:**  
     - *Line:* "Their thoughtful choice to define their family on their own terms, embracing the full, rich life they’re creating together."  
     - *Check:* Reframes the lack of children as an *affirmative choice* ("define their family," "full, rich life"), avoiding pity/defensiveness. Ensure "their own terms" feels neutral, not activist.  

  3. **Destiny/implicit 'meant to be' risk:**  
     - *Line:* "No cosmic scripts. No assumptions about permanence as a *given*."  
     - *Check:* Explicitly negates destiny. Preceded by "deliberately" and "choosing," reinforcing agency.  

  ### Notes on Key Choices  
  - **Russell Reference:** Uses "wise man" for accessibility + "fidelity vs. passion" for colleagues. Zero philosophy jargon.  
  - **Humor:** Gentle teasing (Aunt Ida, board games), not clichés. Warmth via specific quirks (plants, dessert).  
  - **Children:** Addressed as a *positive choice* ("embracing the full, rich life"), not a void.  
  - **Your Integrity:** All promises framed as *actions* ("show up," "protect," "prioritize," "handle with honesty"). No demand for eternal feeling.  
  - **Invented Details:** Marked with `[EXAMPLE: ...]`. Replace with real anecdotes (how they met, a shared habit, a funny ritual).  

  **Delivery Tip:** Practice leaning into the *"You. Again."* line. It’s the emotional anchor—simple, repeatable, and true to your thesis.  

  This should let you speak without cringing while leaving Russell’s ghost nodding quietly in the corner.
