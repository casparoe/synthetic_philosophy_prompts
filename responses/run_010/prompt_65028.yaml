  For the verdict, I'll argue dreams are imaginative experiences, not perceptual. This avoids Malcolm's conceptual issues and fits with Dennett's empirical openness. On skepticism: if dreams aren't deceptive perceptions, the radical skeptical argument weakens, but a modified version based on imagination might still challenge knowledge.

