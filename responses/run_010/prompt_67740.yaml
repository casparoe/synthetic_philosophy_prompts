prompt: |-
  Please write a parody of a mandatory corporate e-learning compliance module, presented as it would appear on screen. The issuing body is invented — call it the Meridian Institute for Reciprocity Governance — and the artifact is "Module 4: Gift or Bribe?" of its Global Reciprocity Integrity Standard, deployed word-for-word at every site of a multinational. Target length 800–1,100 words. Use no real organizations, statutes, officials, or named individuals, and include no bibliography, further reading, or references.

  Structure it the way the module would actually run: a welcome screen stating the purpose and the completion deadline; a numbered set of definitional clauses; a decision flowchart rendered as indented conditionals; four to six knowledge-check scenarios, each with three answer options and the auto-generated feedback the learner receives for whichever option they pick; one sidebar box; and a closing certification screen.

  The target is not any particular country or culture. It is the universalist assumption built into the compliance genre: that the difference between a gift and a bribe is fundamentally a matter of paperwork, that it can be operationalized as a monetary de minimis threshold plus a disclosure form plus the absence of a pending matter, and that the resulting test travels unchanged across societies. The module must never break character, never wink, and never concede a relativist point; it stays cheerfully and bureaucratically certain throughout.

  The humor should come from getting the concepts right rather than from exaggerating them. Build the piece around the following, without announcing any of them as themes:

  - The module claims to define corruption as a violation of the duties attaching to a public office, while in practice it keeps falling back on what its own auditees think is improper, and it has no way at all to express the third candidate definition — harm to the public interest.
  - Its central requirement that a permissible gift be "free of any expectation of return" is self-undermining: a transfer with no expectation of return is not a gift in most of the settings it audits. Let the module's own clauses collide with the idea that giving, receiving, and reciprocating are obligations, and that the person who cannot reciprocate becomes a client rather than a peer.
  - Its bright-line rules fail on incommensurables: the animal, the funeral contribution, the patron who pays a relative's school fees, the marriage transfer. Require a declared value in a single hard currency and show what that does to the item.
  - Its "no pending matter between the parties" test fails on a twenty-year relationship, in which nothing is pending precisely because everything is.
  - It recognizes only holders of state office, so the elder, the party cadre, the union delegate, and the mother-in-law are invisible to it — as is any patronage network that runs outside the state.
  - Its de minimis threshold auto-clears the small payments that speed up routine procedures, while the far larger transfers it encounters — sponsorships, board seats, fellowships, consulting fees — get classified as private-sector arrangements and marked out of scope.
  - One scenario should show the module certifying a genuinely coercive exchange as fully compliant, because it was logged, disclosed, denominated, and signed off by legal; another should show a patronage machine that functions as the only reliable distributor of wells, jobs, and insurance in its district, which the module condemns for a reason it cannot state.

  The satire should be fair in both directions: a reader should come away unsure whether the module's impersonal office is a moral achievement or a local and recent anthropological oddity, and equally unsure whether the alternative it condemns is a bond or a racket. Do not resolve either tension.

  The module's voice is second-person, upbeat, and litigious, with the flat affect of instructional design. End with a final line beginning exactly "Verdict:" followed by a short phrase giving the compliance determination the module has computed for the learner.
reasoning: |-
  Okay, the user wants me to create a parody of a corporate e-learning compliance module about distinguishing gifts from bribes. They've provided very specific requirements: it should be structured like an actual module with welcome screen, definitions, flowchart, scenarios, etc., for a fictional organization called the Meridian Institute for Reciprocity Governance. 

  The key challenge is to satirize how corporate compliance frameworks reduce complex cultural practices to mechanical rules - monetary thresholds, disclosure forms, and "no pending matter" tests. I need to highlight several tensions without breaking character: how the module ignores non-state power structures, fails to handle incommensurable gifts, and creates absurdities when applied to long-term relationships.

  The humor should come from the module's unwavering bureaucratic certainty in impossible situations. For example, requiring funeral contributions to have a "declared value in hard currency" or certifying coercive exchanges as compliant because they were properly logged. 

  I'll need to build in all the requested elements: the welcome screen setting a 14-day deadline, definitional clauses that contradict themselves (especially the "no expectation of return" requirement), a flowchart with rigid conditionals, and scenarios that expose the framework's limitations. One scenario must show approval of logged coercion, another must condemn a patronage network for unstated reasons.

  The tone must stay cheerfully instructional throughout - no winking at the audience. Final output needs the exact "Verdict:" phrasing. Word count target is 800-1100 words. Most importantly, the satire should remain ambivalent - is this bureaucracy a moral achievement or an oddity? Is the alternative it condemns a bond or a racket? Never resolve that tension.

  I'll construct the module to feel authentic: numbered clauses, indented flowchart, multiple-choice scenarios with auto-feedback. The sidebar will reinforce the absurdity by quantifying funeral cows. The closing certification screen will complete the corporate parody with its signature requirement and passive-aggressive deadline reminder.
answer: |-
  ## MERIDIAN INSTITUTE FOR RECIPROCITY GOVERNANCE
  **GLOBAL RECIPROCITY INTEGRITY STANDARD (GRIS)**
  **MODULE 4: GIFT OR BRIBE?**
  **COMPLETION REQUIRED WITHIN 14 DAYS OF ASSIGNMENT**

  **Purpose:** This module equips Associates with the objective, globally applicable framework for distinguishing permissible tokens of goodwill (Gifts) from improper inducements (Bribes), ensuring compliance with the GRIS Standard and mitigating reputational and legal risk for the Organization. Mastery of these bright-line rules protects you and upholds the Meridian Principle of Impersonal Integrity™.

  **Clause Definitions (GRIS Standard 4.1-4.7):**

  1.  **Gift:** A transfer of tangible or intangible value offered voluntarily to an Associate *without* expectation of return and *not* linked to the performance or non-performance of any specific act relating to the Associate’s duties. Permissible Gifts must be disclosed via Form GRIS-D7.
  2.  **Bribe:** A transfer of tangible or intangible value offered, promised, or given to an Associate *with* the intent to improperly influence the performance or non-performance of any act relating to the Associate’s official duties or to secure an undue advantage. Prohibited absolutely.
  3.  **Public Official:** Any individual holding a legislative, administrative, judicial, or executive position of any branch or level of a state, government, or public agency/international organization, whether appointed or elected, permanent or temporary, paid or honorary. *Note: Does not include private-sector employees, community leaders without formal state appointment, religious figures (unless state-appointed), or family members acting outside official capacity.*
  4.  **De Minimis Threshold:** The maximum permissible value of a single Gift offered/received by an Associate from/to a single source within a rolling 12-month period. Current Threshold: USD $100.00 or local equivalent. Gifts exceeding the Threshold require pre-approval via Form GRIS-D7A and Legal review.
  5.  **Tangible Value:** Cash, cash equivalents (gift cards, vouchers), physical items (electronics, artwork, consumables), travel, hospitality, entertainment. Requires Declared Value (see 4.7).
  6.  **Intangible Value:** Non-physical benefits (favors, introductions, information, promises of future benefit). Subject to same assessment as Tangible Value based on reasonable Declared Value.
  7.  **Declared Value:** The fair market value of the item/service in USD, established at the time of transfer using verifiable sources (e.g., retail price, public fee schedule). Must be documented on Form GRIS-D7/D7A.

  **Decision Flowchart: Gift or Bribe? (Apply Sequentially)**

  1.  Is the Recipient a **Public Official** (as defined in Clause 3)?
      *   **YES:** Proceed to Step 2.
      *   **NO:** Transfer is **Out of Scope** for GRIS Module 4 (Refer to Conflict of Interest Policy or Vendor Gift Policy). *Proceed no further.*
  2.  Is there a **Pending Matter** (e.g., permit application, contract award, regulatory decision, litigation) currently, formally, and specifically between the Organization/Associate and the Public Official/their Agency?
      *   **YES:** Transfer is a **Bribe (Prohibited)**. *Proceed no further.*
      *   **NO:** Proceed to Step 3.
  3.  Is the transfer offered **Voluntarily** and **Without Expectation of Return** (as defined in Clause 1)?
      *   **YES:** Proceed to Step 4.
      *   **NO:** Transfer is a **Bribe (Prohibited)**. *Proceed no further.*
  4.  Does the Declared Value (Clause 7) of the transfer exceed the **De Minimis Threshold** (Clause 4)?
      *   **NO:** Transfer is a **Permissible Gift**. **Disclose** via Form GRIS-D7 within 7 days.
      *   **YES:** Has **Pre-Approval** via Form GRIS-D7A and Legal review been obtained?
          *   **YES:** Transfer is a **Conditionally Permissible Gift**. **Disclose** via Form GRIS-D7 within 7 days, attaching approval.
          *   **NO:** Transfer is **Prohibited**. Do not offer/accept.

  **Knowledge Check Scenarios**

  **Scenario 1:** Associate A, managing a licensing application in Region Delta, receives a beautifully carved wooden box from the head of the regional licensing bureau. The application was approved *last month*. The bureau head says it's a traditional thank-you for the "smooth process." The box has no retail equivalent. Associate A estimates a Declared Value of $85 USD.

  *   **Option A:** Accept the box. It's under the De Minimis Threshold, no Pending Matter, and it's clearly a gift. Disclose on GRIS-D7.
  *   **Option B:** Politely decline the box. While under threshold, the timing and source create an *appearance* of impropriety.
  *   **Option C:** Accept the box only if the bureau head signs a statement confirming no expectation of return.

  > **Feedback (Regardless of Choice):**
  > *   **A:** Correct! Value is under threshold, no pending matter. Disclose on D7. Reciprocity is managed via documentation.
  > *   **B:** Incorrect. GRIS uses objective criteria, not subjective "appearances." The facts meet the Gift criteria. Accept and disclose.
  > *   **C:** Incorrect. While confirming intent is proactive, it is not required by GRIS if other criteria are met. Accept and disclose on D7.

  **Scenario 2:** The Organization sponsors a "Community Liaison Officer" position within a municipal office in Region Gamma for 15 years. The current Officer, a Public Official, invites Associate B to his daughter's wedding. Associate B attends and presents an envelope containing $500 USD cash, as is customary locally for close associates. There are no specific pending matters with this Officer currently.

  *   **Option A:** Do not attend or give cash. This large cash gift to a long-term partner official is clearly improper.
  *   **Option B:** Attend but give a company-branded pen set (Declared Value $25) instead of cash.
  *   **Option C:** Attend and give the cash, declaring $500 on GRIS-D7A for pre-approval as it exceeds threshold.

  > **Feedback (Regardless of Choice):**
  > *   **A:** Incorrect. The gift is customary, voluntary (attendance is optional), and there is no *pending* matter. Value is the key factor here.
  > *   **B:** Incorrect. While under threshold, this may violate local custom and damage the relationship. GRIS allows for higher-value gifts with approval if other criteria are met.
  > *   **C:** Correct! Declared Value is clear, no pending matter. Submit GRIS-D7A for Legal review and pre-approval. Document local custom rationale.

  **Scenario 3:** Associate C needs expedited customs clearance for critical medical equipment in Region Sigma. The customs officer, a Public Official, states the standard processing time is 5 days but hints it "could be faster with some refreshment for the hard-working team." Associate C submits Form GRIS-D7A requesting approval to provide $75 USD worth of snacks and drinks (Declared Value based on catering quote) to the customs office staff. Legal pre-approves.

  *   **Option A:** Provide the refreshments as approved. This is a disclosed, de minimis expenditure facilitating efficient operations.
  *   **Option B:** Refuse to provide refreshments. This is a "facilitation payment" demand, which is prohibited regardless of value or disclosure.
  *   **Option C:** Provide the refreshments but only *after* the clearance is granted.

  > **Feedback (Regardless of Choice):**
  > *   **A:** Correct! The value is under threshold (or approved if over), properly disclosed, and provided to the office, not an individual. This is a permissible logistical support measure. Timing is not a GRIS criterion beyond "no pending matter," which is satisfied as the request is general, not linked to *this specific* clearance.
  > *   **B:** Incorrect. GRIS distinguishes between bribes (influencing specific acts) and minor logistical expenditures supporting general administrative function. The pre-approval confirms compliance.
  > *   **C:** Incorrect. Conditioning the transfer on the act creates a link GRIS would view as problematic. Providing it unconditionally, as approved, is correct.

  **Scenario 4:** In Region Omega, a powerful local figure ("Patron Z"), not a state official, coordinates community development. He offers Associate D a choice: route a new water well project through his network (ensuring swift, trouble-free implementation) or risk delays and community friction. Patron Z requests a "consultancy fee" of $10,000 USD, payable to his private company, for "local stakeholder engagement services." Legal reviews the contract, deems the services vaguely defined but plausible, and notes Patron Z is not a Public Official.

  *   **Option A:** Sign the consultancy contract. This is a private-sector arrangement for services, outside GRIS Module 4 scope. Disclose per Vendor Policy.
  *   **Option B:** Refuse the contract. This is clearly a bribe demand disguised as a consultancy, leveraging Patron Z's unofficial power.
  *   **Option C:** Negotiate a lower fee and insist on detailed deliverables in the contract before signing.

  > **Feedback (Regardless of Choice):**
  > *   **A:** Correct! GRIS Module 4 governs Public Officials. Patron Z is not one. The transaction is a private vendor arrangement subject to different controls (Conflict of Interest, Vendor Due Diligence). Proceed with contract per those policies.
  > *   **B:** Incorrect. GRIS definitions are objective. Without a Public Official involved, Module 4 criteria do not apply. Assess under Vendor/Conflict policies only.
  > *   **C:** Incorrect. The core issue is the counterparty type, not the fee level or deliverables specificity. Since Patron Z is not a Public Official, Module 4 is inapplicable. Treat solely as a vendor decision.

  **Sidebar: Quantifying the Intangible - GRIS Best Practices**

  *   **Funeral Contribution:** Common in many regions. If required to attend or maintain relationship with a Public Official, determine Declared Value. Cash: Face value. Livestock: Use local market price for similar animal on date of transfer (e.g., Cow: $300 USD). Document source of valuation on GRIS-D7/D7A.
  *   **Seasonal Gifts (Harvest, Festival):** Bundle multiple small items. Declare total value. If items are homemade (jams, textiles), research comparable retail products.
  *   **Meals/Entertainment:** Declare the cost *per person* attributable to the Public Official(s). Include tax and tip. Use actual receipt or reasonable estimate.
  *   **Key Principle:** If a value cannot be reasonably declared in USD, the item is likely inappropriate for transfer to a Public Official under GRIS. Choose an alternative within the de minimis threshold.

  **Closing Certification:**

  By clicking "Certify" below, you affirm that you have reviewed Module 4: Gift or Bribe? of the Global Reciprocity Integrity Standard (GRIS), understand the definitions, decision flowchart, and disclosure requirements, and commit to applying this knowledge in your role at the Organization. You recognize that violations may result in disciplinary action, up to and including termination, and legal consequences.

