prompt: |-
  I'm the volunteer governance lead for a professional association (about 6,000 members, one big annual meeting) and I've been dragged into a bylaws rewrite. Three things get voted on regularly: an annual prize (usually five to nine finalists, decided by a 40-member selection committee using secret ballots and sequential elimination of the lowest each round), board elections (14 seats, around 30 nominees, whole membership votes, STV with a Droop quota), and occasional referenda — this year it's whether dues go up 4%, up 11%, or stay flat, plurality wins.

  Last year's board election went badly and I think its my fault for not understanding what I was administering. There's a well-organized caucus from one subfield, maybe 12% of the people who actually vote, and they got five of their own elected. Afterwards several of them told me cheerfully that they'd planned it in advance: list only our five, list nobody else, don't bother with preferences. Meanwhile the prize had a different mess — one heavy favorite and two similar mid-tier candidates, and afterwards a couple of committee members admitted they'd buried one of the similar ones to stop a split.

  Our committee is seven people, none of us voting theorists, plus one retired economist who keeps saying "Gibbard–Satterthwaite, so it doesn't matter what we pick" and then proposes things anyway. Two hours a month, spreadsheets at most, and whatever we recommend has to survive a membership vote to amend the bylaws.

  What I want is a procedure, not an essay. Something we can run whenever a rule question lands on the agenda — which rule for which office, whether to change one, whether a screening stage is allowed — with the questions to ask in order, what counts as a settled answer to each, and the points where the procedure stops and hands the choice back to the membership because it's a values call rather than a technical one. Crucially it must not let us hide behind "every rule is manipulable." I need to be able to tell the economist why that sentence doesn't end the conversation, and tell the other six what it does rule out.

  Then run it on three cases: the prize with one favorite and two similar rivals; the 14-seat board election with the caucus; and the three-option dues referendum, where I suspect there's a majority cycle. At least one of those should come out in a way the committee will hate — better now than at the annual meeting.

  Two things I want handled explicitly rather than glossed. First, does screening at the nomination stage actually get us out from under the impossibility result, or does it just relocate the manipulation somewhere less visible? We're floating a nominations committee that narrows 30 nominees down to 14 before the membership votes. Second, someone proposed "randomize among the top three after a ranked count" as a fix — is that even coherent, and can the procedure tell us when randomization earns its keep versus when it's just noise dressed as fairness?

  Last thing: the economist wants a rule where nobody can gain more than "one ranking position's worth" by lying. I think that's not measurable on the ballots we actually collect, but I can't argue it properly. Say whether he's wrong, and if he isn't, how seven non-specialists would check it in practice.

  No citations or reading list — I'm not writing anything up, I just need something usable at next month's meeting.
reasoning: |-
  Alright, let's tackle this step by step. The user is a volunteer governance lead for a professional association dealing with bylaws rewrite after some election messes. They need a practical procedure to evaluate voting rules for three specific cases: the prize selection, board elections, and dues referendum. The key is to have a clear, step-by-step process that avoids getting stuck on theoretical impossibilities and addresses their explicit concerns about nomination screening and randomization.

  First, I need to understand their main pain points. Last year's board election had a caucus gaming the system by bullet voting, leading to disproportionate representation. The prize selection had strategic voting where similar candidates were buried to avoid vote splitting. The dues referendum might have a cycle, but they're unsure. The economist's constant mention of Gibbard-Satterthwaite is paralyzing the committee, so the procedure must move beyond that.

  The user wants a methodical approach that separates technical evaluation from value judgments. They also need to handle two specific questions: whether a nomination committee actually prevents manipulation or just hides it, and whether randomizing among top candidates is a valid solution. Plus, debunking the economist's "one ranking position's worth" idea.

  Starting with the procedure, it should have clear steps. Step 1 defines the election's purpose: what outcome is desired? For the prize, it's identifying the single best candidate. For the board, proportional representation. For dues, majority preference. This step converts abstract goals into testable criteria like Condorcet efficiency or proportionality.

  Step 2 evaluates manipulation risks. Here, Gibbard-Satterthwaite is acknowledged but not the end. The key is assessing how manipulability manifests in practice. For the prize, FPTP is vulnerable to vote-splitting, while IRV or Condorcet methods reduce that. For the board, STV is good but bullet voting exploits low turnout. The nomination committee might help but shifts manipulation to the committee itself. Randomization could be fair in ties but adds noise otherwise.

  Step 3 checks feasibility. Can the committee run the method with spreadsheets? STV is manageable, Condorcet might be complex. Ballot clarity matters for members.

  Step 4 identifies value trade-offs. If a method meets most criteria but has a downside (e.g., non-monotonicity in IRV), the committee must present it to members for a decision.

  Applying this to each case. For the prize, IRV or Condorcet methods handle the favorite vs. similar rivals better than FPTP. Screening via nomination committee might not help as manipulation moves upstream. Randomization isn't needed here.

  For the board, the caucus issue shows STV's vulnerability to bullet voting in low-turnout scenarios. Solutions include requiring full rankings or higher quotas, but that's a value call. A nomination committee could limit choices but risks bias, so transparency is crucial. Randomization isn't useful here.

  The dues referendum might have a cycle, so approval or Condorcet could help. Plurality is bad here. Screening isn't applicable, and randomization only in exact ties.

  On the economist's "one ranking position" idea: it's impractical because ballots don't reveal true preferences. Without knowing what voters really think, you can't measure how much lying affected outcomes. It's a theoretical concept that can't be applied post-election.

  In summary, the procedure forces the committee to evaluate each rule against specific criteria, identify where manipulation might occur, assess practicality, and flag value decisions for the membership. This moves the conversation beyond "all systems are manipulable" to practical trade-offs. For the three cases, the outputs might recommend changes that the committee dislikes, like moving away from STV for boards or adopting approval voting for dues, but that's necessary to prevent future issues.
answer: |-
  Here's a procedural framework designed for your committee. It's structured as a flowchart with key questions, stopping points for value judgments, and explicit handling of your requirements. **The core principle:** Identify the *type* of outcome desired and the most likely *practical* failures, then select rules minimizing those specific failures, acknowledging trade-offs.

  **The Voting Rule Evaluation Procedure**

  1.  **Define the Election Goal:**
      *   *Question:* "What kind of outcome is this election *supposed* to produce? (e.g., Single best option? Proportional representation? Majority-preferred option? Consensus? Avoiding the worst outcome? Stability?)"
      *   *Settled Answer:* Committee consensus on 1-2 primary goals. *Example Answers:* Prize = "Single best candidate"; Board = "Proportionally representative body reflecting membership diversity"; Dues = "Option preferred by a majority, avoiding unpopular extremes."
      *   *Stop Point:* If the committee fundamentally disagrees on the primary goal, escalate to the membership immediately. The rule cannot be chosen technically without this.

  2.  **Identify Likely Failure Modes:**
      *   *Question:* "Based on past experience, member behavior, and the goal defined in Step 1, what are the 1-3 most likely ways this specific election could go *wrong*? (e.g., Vote splitting? Minority domination? Strategic burial? Cycle leading to arbitrary choice? Low participation distorting outcome?)"
      *   *Settled Answer:* List specific, practical failure scenarios relevant to *this* election type and your association. *Example Answers:* Prize = "Vote splitting between similar candidates buries the favorite"; Board = "Organized minority uses bullet voting to gain disproportionate seats"; Dues = "Plurality winner might be opposed by a majority, or a cycle exists."
      *   *Stop Point:* None. Force specificity. "Gibbard-Satterthwaite" is *not* a specific failure mode here; it's a universal theoretical constraint. Acknowledge it ("We know *all* systems can be manipulated *in theory*") but move on: "Our job is to find the rule least vulnerable to the *actual* manipulation tactics *we see happening or foresee* in *this specific context*."

  3.  **Evaluate Rules Against Failures & Goal:**
      *   *Task:* For each rule under consideration (including the status quo), assess:
          *   How well does it *achieve the stated Goal* (Step 1)?
          *   How *resistant* is it to the Likely Failure Modes (Step 2)?
          *   How *practical* is it (ballot simplicity, counting complexity, member understanding)?
          *   Does it introduce *new, worse problems*?
      *   *Critical Questions for Specific Cases:*
          *   **Screening/Nomination Committees:** "Does this *reduce* vulnerability to the Likely Failure Modes in Step 2, or does it just *move the manipulation point* upstream to the nomination stage? Can we ensure the nominating process itself is resistant to the same failures?" *Answer:* It *relocates* manipulation risk. A nomination committee is vulnerable to bias, logrolling, and strategic exclusion *unless* its own process is rigorously designed (e.g., using STV itself for nominations). It doesn't "solve" impossibility; it changes the arena.
          *   **Randomization:** "Does randomization *specifically address* one of the Likely Failure Modes identified in Step 2, or is it being proposed for 'fairness' where determinism works? When is the uncertainty introduced *worth* the potential benefit?" *Answer:* Randomization earns its keep *only* when:
              1.  A deterministic rule genuinely cannot break a tie between genuinely equally deserving/qualified options (rare).
              2.  Or, strategically, to *deter* certain types of manipulation by making outcomes unpredictable (e.g., randomizing among *all* candidates who meet a threshold can deter burial tactics, but is complex).
          *   **Economist's "One Ranking Position" Request:** "Is this practically measurable *after* the election using only the collected ballots?" *Answer:* **No, it's not practically measurable.** You cannot know a voter's *true* preferences from their ballot alone. You only see their *stated* preferences. To measure "gain from lying," you'd need to know their true ranking *and* compare the outcome if they told the truth vs. lied. This requires impossible counterfactual knowledge. Dismiss this request as theoretically interesting but operationally infeasible for your committee. Focus on observable strategic behaviors (like bullet voting or burial admissions).

  4.  **Identify Trade-offs & Value Judgments:**
      *   *Question:* "Having compared the rules, what are the key *trade-offs* between them? (e.g., Simplicity vs. Resistance to Splitting? Proportionality vs. Preventing Minority Domination? Certainty vs. Deterring Manipulation?) Which trade-offs require the *membership's values* to decide?"
      *   *Settled Answer:* List 1-3 critical trade-offs where technical arguments are exhausted and the choice depends on what the membership values more. *Example:* "Do members value the simplicity of plurality voting for the prize enough to accept higher risk of vote-splitting failures, or do they prefer the complexity of ranked ballots to reduce that risk?"
      *   *Stop Point:* Any major trade-off identified *must* be escalated to the membership vote. The committee's role is to present the options and the consequences of each trade-off clearly.

  5.  **Recommendation & Justification:**
      *   *Task:* Propose the rule(s) that best mitigate the Likely Failure Modes (Step 2) while achieving the Goal (Step 1), considering practicality. Explicitly state the key trade-offs being made and which ones require membership input (Step 4).
      *   *Justification:* Frame the recommendation around the specific failures it addresses: "We recommend [Rule] for [Election Type] because it is significantly more resistant to [Specific Failure Mode from Step 2] than the current system, which aligns with our goal of [Goal from Step 1]. The main trade-off is [Trade-off from Step 4], which we believe reflects membership values [or state it needs membership vote]."

  ---

  **Applying the Procedure to Your Three Cases**

  **Case 1: The Annual Prize (Single Winner, Small Committee, Ranked Choice Likely)**
  1.  **Goal:** Identify the single *best* candidate.
  2.  **Likely Failure Modes:** Vote-splitting between similar candidates leading to the favorite losing; Strategic burial of a strong contender.
  3.  **Evaluation:**
      *   *Current (Sequential Elimination w/ Secret Ballot):* Good resistance to splitting (similar to IRV). Vulnerable to strategic burial *during voting* (as happened).
      *   *Plurality:* Highly vulnerable to splitting & burial.
      *   *Borda Count:* Vulnerable to strategic burial (burying threats).
      *   *Approval:* Resists splitting, somewhat resists burial (harder to precisely target one candidate). Might not identify the single "best."
      *   *Condorcet Method:* Excellent resistance to splitting; finds majority favorite if one exists. Complex counting. Vulnerable to burial if no Condorcet winner exists.
      *   *Randomization (Top 3):* Does *not* address splitting/burial effectively. Adds unnecessary uncertainty where deterministic methods (IRV, Condorcet) work. Not justified here.
      *   *Screening:* A nominations committee *could* reduce the field to finalists, but risks shifting manipulation upstream (e.g., committee buries the threat instead of voters). Requires designing the nominating process robustly (e.g., use a good voting rule *there* too).
  4.  **Trade-offs & Values:** IRV/Sequential Elimination is simple and resists splitting but allows burial. Condorcet resists splitting better and often burial, but is complex. Approval is simple and robust but may not select the "best." **Recommendation:** **Stick with Sequential Elimination (IRV-like)**, but *add a rule requiring committee members to rank all candidates* to make burial slightly harder/more obvious. OR **Move to a Condorcet method** if complexity is acceptable. Escalate the choice between simplicity (IRV) vs. potentially stronger resistance (Condorcet) if needed. Screening only adds value if the nominating process is also robust. Randomization is noise.

  **Case 2: Board Elections (14 Seats, Proportional Representation, Whole Membership)**
  1.  **Goal:** Elect a body *proportionally representative* of the voting membership's diverse viewpoints.
  2.  **Likely Failure Modes:** Organized minority using bullet voting to gain disproportionate representation (exactly what happened); Low overall turnout amplifying small groups; Potential for vote splitting among non-aligned candidates.
  3.  **Evaluation:**
      *   *Current (STV w/ Droop):* Designed for proportionality. *Failed* because the caucus exploited low participation and bullet voting. STV relies on voters expressing preferences *across* groups for proportionality.
      *   *Solutions:* **a)** **Require full rankings** (or a minimum number, e.g., rank 14). Makes bullet voting impossible, forces engagement with diversity. **b)** **Increase the Quota** (e.g., Hare instead of Droop) - makes it harder for small groups to win seats, potentially penalizing the small caucus but also smallest *legitimate* groups. **c)** **Add a minimum vote threshold** for election (rare in STV). **d)** **Nominations Committee (Screen to 14):** Reduces choice, risks bias, shifts manipulation upstream. *If* implemented, the *nomination process itself must be proportional* (e.g., STV election of nominators, STV-like process for nominations) and transparent. Doesn't solve turnout issues.
      *   *Randomization:* No role here. Doesn't address the core problem (bullet voting).
  4.  **Trade-offs & Values:** **Requiring full/minimum rankings** strongly counters bullet voting and enhances proportionality but might reduce turnout or annoy members. **Increasing the quota** penalizes very small groups but protects proportionality from *organized* tiny factions; it's a trade-off between small group representation and resistance to manipulation. **Screening** trades membership choice for potentially reduced manipulation risk *if* the nominating process is impeccable. **Recommendation:** **Mandate ranking all candidates (or at least 14) in the STV ballot.** This directly targets the failure mode. Escalate the potential trade-off: "Do members value proportional accuracy enough to accept the burden of full ranking?" Increasing the quota is a secondary option if bullet voting persists despite full rankings. Screening is a last resort requiring extreme care.

  **Case 3: Dues Referendum (3 Options, Single Choice, Majority Preference Desired)**
  1.  **Goal:** Select the option with the *strongest majority support* or at least avoid one opposed by a majority. (Implies Condorcet efficiency or majority rule).
  2.  **Likely Failure Modes:** Plurality winner being opposed by a majority (e.g., "Stay Flat" wins with 40%, but 60% prefer an increase); A potential Condorcet cycle (A>B, B>C, C>A).
  3.  **Evaluation:**
      *   *Current (Plurality):* Highly vulnerable to vote-splitting and selecting a majority-opposed winner. Terrible fit for the goal.
      *   *Runoff (Top 2):* Resists vote-splitting, finds majority winner if one exists. Requires two rounds.
      *   *Ranked Choice (IRV):* Resists vote-splitting, finds majority winner if one exists in later rounds. Single round.
      *   *Approval Voting:* Simple. Voters approve all options they find acceptable. Winner is the option approved by the most voters. Resists vote-splitting, often selects broadly acceptable (if not always majority) winner. Excellent resistance to cycles.
      *   *Condorcet Method:* Finds majority-preferred option if one exists. Complex. Handles cycles via a tiebreaker (often perceived as arbitrary).
      *   *Randomization:* Only justified if a Condorcet method hits a true, unbreakable tie *after* applying its tiebreaker rules (exceedingly rare with 3 options). Not justified otherwise.
      *   *Screening:* Not applicable. Options are defined.
  4.  **Trade-offs & Values:** **Plurality is unacceptable** given the goal and failure modes. **Runoff/IRV** achieve the goal well but require ranked ballots. **Approval** is very simple, robust to cycles, and finds broadly acceptable winners but may not find a strict majority winner. **Condorcet** is theoretically ideal but complex. **Recommendation:** **Approval Voting** for simplicity, robustness against cycles, and finding a consensus option. OR **IRV** if strict majority winner is paramount and complexity is acceptable. Escalate the choice: "Do members prioritize simplicity and broad acceptability (Approval) or guaranteeing a majority winner through potentially more complex ranking (IRV/Runoff)?" Plurality must be abandoned. Randomization is noise.

  **Key Takeaways for Your Committee**

  1.  **Gibbard-Satterthwaite Isn't a Get-Out-of-Jail-Free Card:** It means *no* rule is perfect. Your job is to find the rule *least bad* for the *specific flaws* you actually experience. The procedure forces focus on *practical* failures.
  2.  **Screening Relocates, Doesn't Eliminate, Manipulation:** A nominations committee needs its *own* robust voting rules to be credible. It doesn't bypass impossibility theorems.
  3.  **Randomization is a Tool, Not a Panic Button:** Only use it for unresolvable ties or specific strategic deterrence. Don't add noise where determinism works.
  4.  **The Economist's Request is Impractical:** You cannot measure "gain from lying" post-election. Focus on observable strategic behaviors.
  5.  **Embrace the Hate (Sometimes):** The procedure will likely recommend changes the committee finds uncomfortable (e.g., mandating full rankings for the Board, ditching Plurality for Dues). This is good! It means the procedure is exposing real weaknesses in the status quo. Presenting these tough recommendations *with clear justifications based on the defined goals and failure modes* is your strongest position at the annual meeting. It shows diligent, structured analysis, not arbitrary preference.
