  | (ii) Moral Realism      | 9                  | Near-perfect match: normative facts causally inert (Blindness), moral beliefs largely true (Fidelity), natural history complete (Completeness).               | 2             | Evolutionary tracking of moral facts presumes selected sensitivity—epiphenomenalist cannot appeal to selection for *phenomenal* truth-tracking. |
  | (iii) Modal Realism     | 7                  | Blindness (modal facts lack causes) and Completeness hold; Fidelity less secure than in math/morality. Discriminatory replies via conceivability tests. | 6             | Conceptual constraints (e.g., essence-based modality) could be adapted to qualia without new posits, though epistemic access remains thinner. |
  | (iv) Pre-established Harmony | 6                | Blindness (no cross-series causation) and Completeness hold; Fidelity requires divine guarantee.             | 1             | Divine coordination explains discrimination but is alien to epiphenomenalism—imports a designing agent.                                      |
  | (v) Semantic Externalism | 9                  | Structural twin: naturalness causes nothing (Blindness), reference succeeds (Fidelity), physical history complete (Completeness).          | 4             | "Best earns the role" relies on objective naturalness metrics—epiphenomenalist lacks analogous grounding for phenomenal concepts.            |

  ---

  ### Tier Conversion & Best Analogue  
  - **Tiers**:  
    - S (9–10): None  
    - A (7–8): (i) Platonism, (iii) Modal Realism  
    - B (5–6): (iv) Harmony  
    - C (3–4): (ii) Moral Realism, (v) Semantic Externalism  

  **Most promising analogue for defense**: **(iii) Modal Realism**  
  - **Adequacy level**: **Global adequacy only** (no discriminatory power).  
  - **Concession required**: Epiphenomenalist must accept that truths about qualia are fixed by conceptual necessities (e.g., "pain" *must* refer to this phenomenology), mirroring modal truths grounded in essence.  

  ---

  ### Key Structural Disanalogy  
  **Damaging disanalogy**: Modal realism relies on **logico-conceptual constraints** (e.g., pain’s essential features dictate its epistemic correlates), whereas epiphenomenalism treats qualia as **brute contingencies**. This renders the transplant **merely expensive**: it forces epiphenomenalism into a quasi-essentialist metaphysics alien to its typical commitments. The move avoids fatal incoherence but sacrifices parsimony—conceding that phenomenal truths are analytic or necessary despite no causal explanation for their discernment.
