prompt: |-
  ok so I need to vent and ask for help at the same time, sorry in advance for the length. I sit on the PhD admissions committee in my philosophy department, and I just spent close to three hours arguing with a friend of mine from undergrad — not a philosopher, he does software now — about one particular file in this year's pool, and I still dont have a clean answer, so I'm outsourcing it to you.

  The file: a 26-page writing sample that is basically the Lucas-Penrose argument, i.e. Gödel's incompleteness theorems show no formal system can capture human mathematical reasoning, therefore minds aren't machines. Except it isn't the naive version, and that's the problem. It knows about the standard objections. It has a whole section on the point that we can't establish our own consistency either, so the second theorem cuts both ways, and it concedes it can't just wave that away — it tries to repair things by swapping the consistency premise for a soundness premise restricted to a particular fragment of arithmetic rather than the whole system. It also spends a chunk arguing that Penrose's quantum-gravity-in-the-brain stuff is beside the point and doesn't need to be true for the argument to go through. And then it does something that genuinely split us: near the end it says the whole debate is a dead end anyway, and that the interesting payoff is what the failure of a certain kind of self-transparency in formal systems tells you a *theory of mind* would have to look like — which is a much weirder and more interesting move than the one it spent twenty pages setting up, and I can't tell whether it's a real insight or the argument just getting more evasive as it goes.

  My friend's take, the one I kept failing to answer: the first twenty pages being classic crank territory shouldn't count against the applicant at all, because the applicant is *working through* the crank argument and coming out the other side, which is precisely the thing we say we want in a writing sample. My colleague on the committee takes the opposite view — that the genre is itself disqualifying, that anyone who burns that much energy on Gödel-and-minds has usually already decided they're smarter than the literature, and that the sophisticated-sounding parts are just the same argument in better clothes. And there's a third thing gnawing at me: if we turn my colleague's instinct into policy, we'll disproportionately hurt applicants who came at philosophy from outside — self-taught people, people from math or CS, people who found the field through pop books instead of a proper undergraduate seminar.

  So: draft the memo I'll circulate before the committee meets again. I need three things in it. First, a concrete recommendation on this file — read it, score it, ask the applicant for something, flag it — plus a recommendation on whether we adopt any standing rule, since we get three or four of these a year and we have no procedure at all right now. Second, criteria for telling a Gödel-and-minds sample that's doing real work from one that's just performing rigor, phrased so a reader who has never touched the technical literature can actually apply them to a page they're holding. Third, a serious engagement with my friend's point rather than a brushoff — and, this is the part I care about most, an honest statement of the strongest version of my colleague's worry, including the bit where he isn't just being a snob about cranks but is worried about burned committee hours and about candidates who interview brilliantly on these topics and then can't do anything else.

  Two constraints. No bibliography, no reading list, and please don't tell me to consult the secondary literature — half the committee hasn't, and that's part of what I'm trying to solve. And don't write me a memo whose bottom line is that the Lucas-Penrose argument is simply wrong; I know it's contested, and the document needs to be usable by people who disagree about that, since that's the actual composition of the committee. Keep it to about a page and a half — it gets read standing up.
