  ### What Students Should Come Away Seeing
  Students should come away having participated in a structured deliberation where they first voted on a rule defining who gets to decide (without grasping its full implications), then debated a housing proposal under that rule while negotiating side payments that were publicly recorded, and finally revisited an analogous proposal 20 years later under the same rule. They should have experienced how a rule defended as local democracy (e.g., "only residents within 1/2 mile vote") excluded affected parties, how compensation was offered to make exclusion palatable, and how their own interests shifted over time—leading some to defend the same rule they once opposed. They should have grappled with the boundary question by seeing that moving it (or not) changed whose arguments seemed legitimate, without anyone changing their core principles.

  ### Role List (18 Students)
  Roles are designed to ensure diverse, conflicting interests and a mix of voting/non-voting statuses under the standing rule. **Voters (within 1/2-mile radius):** 10 roles. **Non-voters (outside radius):** 8 roles.  
  - **City Planner (1):** Runs the meeting, reads fiscal card. (Neutral facilitator)  
  - **Developer (1):** Proposes the project. (Voter if within radius; non-voter if outside. Default: non-voter.)  
  - **Homeowner A (1):** Longtime resident. Fears property value loss. (Voter)  
  - **Homeowner B (1):** Newer resident. Values "neighborhood character." (Voter)  
  - **Renter (2):** One fears displacement; one supports density. (Voters)  
  - **Local Business Owner (2):** One relies on parking; one wants more customers. (Voters)  
  - **Incumbent Resident (1):** Elderly, opposes all change. Rewarded for inaction. (Voter)  
  - **School Board Member (1):** Divided interests: needs students but fears fiscal strain. (Voter)  
  - **Disabled Resident (1):** Depends on parking. (Voter)  
  - **Affordable Housing Advocate (1):** Stated conviction: pro-housing. *Scoring conflict:* Rewarded for blocking if it secures future concessions. (Non-voter)  
  - **Commuter (1):** Parks daily. (Non-voter)  
  - **Future Resident (1):** Wants to move in. In Round 2, becomes voter with shifted interests. (Non-voter in Round 1)  
  - **Environmental Advocate (1):** Pro-density for climate reasons. (Non-voter)  
  - **Taxpayer (1):** Pays city taxes but lives outside radius. Fears fiscal burden. (Non-voter)  
  - **Non-Profit Worker (1):** Represents low-income families. Divided: wants housing but fears gentrification. (Non-voter)  

  ### Handout Materials (Copy Verbatim onto Index Cards)  
  **Standing Rule (write on whiteboard before start):**  
  "Only households residing within a 1/2-mile radius of 123 Main St cast binding votes. Non-residents may testify during designated periods but cannot vote. This rule may be amended by a 2/3 majority vote of current residents."  

  **Agenda (write on whiteboard before start):**  
  1. Vote on amending the standing rule (change requires 2/3 majority).  
  2. Developer presents proposal: 40 units (25% income-restricted) on surface parking lot, no parking, near transit.  
  3. Testimony: Non-voters speak (3 mins max per speaker, 5 speakers max).  
  4. Discussion: Voting members ask questions (10 mins).  
  5. City Planner reads fiscal information.  
  6. Deliberation and negotiation: Voting members debate. Side arrangements must be announced and recorded.  
  7. Vote on proposal (simple majority).  
  8. [After update] Second round: 20 years later. Repeat steps 2–7 for new proposal.  

  **Fiscal Card (for City Planner; read verbatim at step 5):**  
  "Municipal fiscal estimate: A household at the restricted income level (60% AMI) contributes $3,000/year in local taxes/fees. If it includes school-aged children, it draws $12,000/year from schools. Net fiscal impact: -$9,000 per household with children, or +$3,000 without children."  

  **Private Scoring Cards (Round 1; one per role)**  
  *Instructions: Earn points based on outcomes. Do not show this card to anyone. At session end, points from Rounds 1 and 2 are summed for your total.*  
  - **City Planner:** 10 pts if proposal approved with ≥25% income-restricted units OR rejected. 15 pts if community benefits agreement (CBA) worth ≥$100k is recorded. (Requires cooperation)  
  - **Developer:** 20 pts if approved as-is. 15 pts if approved with ≤35% income-restricted OR parking lease. 0 pts if rejected.  
  - **Homeowner A:** 10 pts if rejected. 15 pts if approved with parking lease (≥20 spaces). 5 pts if approved without lease.  
  - **Homeowner B:** 15 pts if rejected. 10 pts if approved with "character preservation" (e.g., design review). 0 pts if approved without.  
  - **Renter (Displacement Worrier):** 15 pts if rejected AND rent stabilization fund recorded. 10 pts if approved with CBA for rental assistance. 5 pts if approved without. (Requires cooperation)  
  - **Renter (Pro-Density):** 20 pts if approved. 0 pts if rejected.  
  - **Local Business Owner (Parking Reliant):** 15 pts if rejected. 10 pts if approved with parking lease. 0 pts if approved without.  
  - **Local Business Owner (Customer Seeker):** 20 pts if approved. 5 pts if rejected.  
  - **Incumbent Resident:** 20 pts if rejected. 0 pts if approved. (Rewards inaction)  
  - **School Board Member:** 15 pts if rejected. 20 pts if approved with payment-in-lieu-of-taxes (PILOT) of $1k/unit/year. 10 pts if approved without. (Requires cooperation)  
  - **Disabled Resident:** 15 pts if rejected. 10 pts if approved with accessible shuttle. 0 pts if approved without.  
  - **Affordable Housing Advocate:** 15 pts if approved with ≥25% income-restricted. 20 pts if rejected AND written pledge for future 40% income-restricted project recorded. 0 pts otherwise. (Stated conviction conflicts with scoring)  
  - **Commuter:** 15 pts if rejected. 10 pts if approved with parking lease. 0 pts if approved without.  
  - **Future Resident:** 20 pts if approved. 0 pts if rejected.  
  - **Environmental Advocate:** 20 pts if approved. 10 pts if rejected AND green space pledge recorded. 0 pts otherwise.  
  - **Taxpayer:** 15 pts if rejected. 10 pts if approved with no-children clause in income-restricted units. 5 pts if approved without.  
  - **Non-Profit Worker:** 15 pts if approved with CBA for anti-displacement fund. 10 pts if approved without. 5 pts if rejected. (Divided interests)  

  **Second-Round Update Cards (hand out mid-session; one per role)**  
  *Each card has two sections: Household Change (alteration) and Round 2 Scoring.*  
  - **City Planner:**  
    Household Change: You are now a senior planner. Housing costs doubled. The parcel is a parking garage (built after Round 1). New proposal: 80 units (25% income-restricted).  
    Round 2 Scoring: 10 pts if approved with ≥25% income-restricted OR rejected. 15 pts if CBA worth ≥$200k recorded.  
  - **Developer:**  
    Household Change: You represent a new firm. Proposal: 80 units on the garage site.  
    Round 2 Scoring: 20 pts if approved as-is. 15 pts if approved with ≤35% income-restricted OR parking lease. 0 pts if rejected.  
  - **Homeowner A:**  
    Household Change: You still live here. Your adult child moved away due to high costs. The area is denser, parking scarcer.  
    Round 2 Scoring: 10 pts if rejected. 15 pts if approved with 10 family-sized units. 0 pts if approved without.  
  - **Homeowner B:**  
    Household Change: Neighborhood is now mostly apartments. You miss the old feel but like amenities.  
    Round 2 Scoring: 5 pts if rejected. 15 pts if approved with historical plaque. 10 pts if approved without.  
  - **Renter (Displacement Worrier):**  
    Household Change: You bought a condo in the Round 1 building (if approved) or moved away. Now back as a renter; fear new displacement.  
    Round 2 Scoring: 10 pts if approved with anti-displacement CBA. 5 pts if rejected.  
  - **Renter (Pro-Density):**  
    Household Change: You own a home nearby. Support density but worry about congestion.  
    Round 2 Scoring: 15 pts if approved. 5 pts if rejected.  
  - **Local Business Owner (Parking Reliant):**  
    Household Change: Your business struggled after parking loss. Now a cafe owner.  
    Round 2 Scoring: 10 pts if rejected. 15 pts if approved with public plaza for your cafe.  
  - **Local Business Owner (Customer Seeker):**  
    Household Change: Business boomed with new residents. You support more growth.  
    Round 2 Scoring: 20 pts if approved. 0 pts if rejected.  
  - **Incumbent Resident:**  
    Household Change: You are 80, need home health aide. Neighborhood is noisy.  
    Round 2 Scoring: 10 pts if rejected. 15 pts if approved with senior center in CBA.  
  - **School Board Member:**  
    Household Change: Schools are under-enrolled. You need more students.  
    Round 2 Scoring: 10 pts if rejected. 20 pts if approved and income-restricted units target families.  
  - **Disabled Resident:**  
    Household Change: You use a wheelchair. Parking remains tight.  
    Round 2 Scoring: 10 pts if rejected. 15 pts if approved with double the accessible units + shuttle.  
  - **Affordable Housing Advocate:**  
    Household Change: You now live in an income-restricted unit within the radius (voter!). Oppose new density to "protect community."  
    Round 2 Scoring: 15 pts if rejected. 5 pts if approved. (Shows disenfranchised becoming defender)  
  - **Commuter:**  
    Household Change: You work from home. Rarely commute.  
    Round 2 Scoring: 5 pts if rejected. 15 pts if approved.  
  - **Future Resident:**  
    Household Change: After Round 1 rejection, you rented within the radius. Now a homeowner and voter.  
    Round 2 Scoring: 15 pts if rejected (protect investment). 5 pts if approved. (Shifts from victim to defender)  
  - **Environmental Advocate:**  
    Household Change: Climate crisis worsened. Density is urgent.  
    Round 2 Scoring: 20 pts if approved. 0 pts if rejected.  
  - **Taxpayer:**  
    Household Change: Retired, own rental property in city.  
    Round 2 Scoring: 10 pts if rejected. 15 pts if approved (increases property value).  
  - **Non-Profit Worker:**  
    Household Change: You now fear new development will displace current low-income residents.  
    Round 2 Scoring: 15 pts if approved with strong anti-displacement CBA. 10 pts if rejected.  

  ### Timeline (100 Minutes)  
  - **0–5 min:** Instructor sets up. Writes standing rule and agenda on board. Hands out Round 1 scoring cards (face down). Explains: "This is a simulated land-use meeting. You have a role. Earn points via your card. Key rule: No saying NIMBY, YIMBY, exclusionary, gentrification, or right to the city. We have two rounds: now and 20 years later. Start with agenda item 1."  
  - **5–7 min:** Vote on amending standing rule. Only voters (within radius) participate. Instructor tallies (2/3 majority required).  
  - **7–9 min:** Developer presents proposal (2 mins max).  
  - **9–18 min:** Testimony. Non-voters signal to speak. Instructor selects 5 speakers (3 mins each).  
  - **18–24 min:** Discussion. Voting members question developer/testifiers.  
  - **24–25 min:** City Planner reads fiscal card verbatim.  
  - **25–37 min:** Deliberation. Voting members negotiate. Instructor records side arrangements on board.  
  - **37–38 min:** Vote on proposal. Instructor tallies.  
  - **38–42 min:** Hand out second-round update cards. Instructor: "20 years later. Read your card. Same roles, aged. New proposal: 80 units on the parking garage site. Same standing rule. Repeat steps 2–7."  
  - **42–44 min:** Developer presents new proposal.  
  - **44–53 min:** Testimony (5 speakers, 3 mins each).  
  - **53–59 min:** Discussion. Voting members question.  
  - **59–60 min:** City Planner reads fiscal card again (same text).  
  - **60–72 min:** Deliberation. Voting members negotiate. Record side arrangements.  
  - **72–73 min:** Vote on proposal.  
  - **73–75 min:** Collect all scoring and update cards. Instructor: "Reflect silently on what shifted and why."  
  - **75–100 min:** Debrief (instructor-led discussion).  

  ### Debrief (25 Minutes)  
  Map activity moments to concepts explicitly:  
  1. **Boundary of decision-making community:** "In the first vote, you decided who counted as a 'stakeholder' (e.g., the radius rule). How did that boundary exclude people who were affected (e.g., Future Resident, Commuter)? When the Affordable Housing Advocate became a resident in Round 2, how did gaining voting rights change their arguments about the boundary?"  
  2. **Defensible reason vs. defensible rule:** "The fiscal card was neutral data, but how was it used? Did it make opposition feel like bookkeeping (e.g., School Board Member's fiscal worry) rather than animus? Yet even if each reason was defensible, did the rule systematically amplify some voices and silence others?"  
  3. **Compensation curing exclusion:** "Look at the side agreements on the board (e.g., PILOT, shuttle). When Homeowner A got a parking lease, did that address the harm or just buy consent? Did it help those excluded (e.g., Disabled Resident) or just voters?"  
  4. **Right to the city (named now):** "In Round 2, Future Resident switched from pro- to anti-development. Why? Did their 'right' change with their stake? When the boundary didn’t move, but interests did, how did that alter who seemed 'right'?"  
  **Sequence reinforcement:**  
  - First feeling (defensible rule/exclusionary effect): "The radius rule was defended as local control, but it excluded non-residents. You saw this when non-voters' testimony was ignored."  
  - Second feeling (disenfranchised becoming defenders): "Future Resident and Affordable Housing Advocate opposed the project in Round 2 after gaining a stake. They weren’t just victims—they became the rule’s defenders."  
  - Third feeling (boundary changes who is right): "When interests shifted in Round 2, the same rule made different positions seem legitimate. The 'right' answer depended on where you drew the line."  

  ### Predictably Goes Wrong (and Handling)  
  - **Disengaged non-voters:** Environmental Advocate or Taxpayer may tune out when not speaking. **Why:** Limited testimony slots + no vote. **Handle:** In setup, stress that testimony can influence voters. In debrief, highlight how this mirrors real barriers to participation.  
  - **Dominant seat:** Homeowner B or Incumbent Resident may monopolize deliberation. **Why:** Strong opinions + voter status. **Handle:** During deliberation, instructor (as planner) enforces structured turns: "Let’s hear from Renter next."  
  - **Unanimous first vote:** If vote 1 (rule change) or vote 7 (proposal) is unanimous, the second round may lack tension. **Why:** Groupthink or misread scoring. **Handle:** If vote 1 passes, keep the amended rule for Round 2. If vote 7 is unanimous, proceed—Round 2’s shifted interests (e.g., School Board Member now needing students) can still flip the outcome.  
  - **Second-round flip failure:** If interests don’t shift enough (e.g., voters stay anti-development), the debrief still works. **Why:** Scoring cards may not override convictions. **Handle:** Emphasize the "could flip" design (e.g., Future Resident’s card forces a shift) and discuss why it didn’t.  

  ### What the Activity Cannot Reproduce (Instructor Must Supply)  
  The activity simplifies reality in ways that require explicit contextualization. Scoring cards make interests legible and quantifiable, but real stakeholders don’t have point systems—their motivations are opaque, emotional, and shaped by unspoken histories. The costs of participation (time, childcare, expertise barriers) are absent; everyone "shows up" and speaks clearly, but in reality, those costs silence marginalized groups. The roles represent a fraction of affected parties (e.g., no card for people priced out entirely). Most crucially, the fiscal card presents a tidy number, but real fiscal impacts are contested and uncertain. **You must stress:** This is a tool for understanding dynamics, not a replica. Real hearings involve lived trauma (e.g., displacement), not points. The boundary question isn’t solved by rules but by normative debates about justice.  

  ### Design Bias and Outcome Guarantees  
  The activity does not guarantee a specific outcome. Votes can go either way:  
  - **First rule-change vote:** Likely fails (requires 2/3 majority), preserving exclusion, but could pass if voters feel arbitrary.  
  - **First proposal vote:** Bias toward rejection due to fiscal card + incumbent scoring, but negotiation (e.g., PILOT) can flip it. A "yes" may be indefensible if voters ignore compensation costs (e.g., Taxpayer’s card shows fiscal risk).  
  - **Second-round flip:** Designed to occur via Future Resident and Affordable Housing Advocate becoming anti-development voters, but not guaranteed. If the first proposal passed, Round 2’s "parking garage redevelopment" may still fail if new incumbents (e.g., Homeowner A) oppose.  
  **Quiet guarantee:** None. The fiscal card tilts toward rejection, but compensation and Round 2’s interest shifts counter it. The only forced element is that non-voters in Round 1 become voters in Round 2 (Future Resident, Affordable Housing Advocate), ensuring some defend the rule they were excluded by.
