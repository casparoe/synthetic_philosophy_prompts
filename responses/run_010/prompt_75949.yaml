  ### Positions Map: Simultaneous Invention  
  **Decision Tree for Grad Student Reading Group (90 min)**  
  *Focus: How we individuate discoveries, counterfactual inevitability, and the role of priority.*  
  *Tree Structure: Answer each node without knowing the next step. Leaves are descriptive labels.*  

  ---

  #### **Decision Tree**  
  1. **How finely do we individuate the discovery?**  
     - **Coarsely**: The discovery (e.g., "calculus" or "natural selection") is a unified achievement, regardless of specific formulations. *Go to 2*.  
     - **Finely**: Each formulation (e.g., Newton's fluxions vs. Leibniz's differential calculus) is distinct. *Go to 3*.  

  2. **For coarse discoveries: Is the discovery inevitable?**  
     - **Yes, due to the state of the field**: The field was "ripe"; tools/knowledge made it imminent. *Go to 4*.  
     - **Yes, due to multiple capable people**: Enough skilled individuals existed to ensure convergence. *Go to 4*.  
     - **Yes, given enough time**: Even without ripeness or many people, time guarantees emergence. *Go to 4*.  
     - **No, not inevitable**: Contingent on unique actors/circumstances. *Leaf: **Contingent Achievement, Non-Instrumental Priority***.  

  3. **For fine discoveries: Is the discovery inevitable?**  
     - **Yes**: *Leaf: **[Empty]—Incoherent for Fine Individuation*** (see empty cells below).  
     - **No, not inevitable**: *Leaf: **Unique Formulation, Non-Instrumental Priority***.  

  4. **For inevitable coarse discoveries: Does priority matter?**  
     - **Yes, as a coordination device**: Assigning credit incentivizes disclosure and efficiency. *Leaf: **Inevitable-Coarse, Instrumental Priority***.  
     - **No, pure social convention**: Credit assignment is arbitrary but pragmatically useful. *Leaf: **Inevitable-Coarse, Conventional Priority***.  

  ---

  #### **Leaves (Positions)**  
  1. **Inevitable-Coarse, Instrumental Priority**  
     - *Description*: Discovery was inevitable (due to field/people/time), but priority matters to coordinate science (e.g., patent systems or publication norms).  
     - *Priority stance*: Instrumental; avoids duplication and rewards speed.  

  2. **Inevitable-Coarse, Conventional Priority**  
     - *Description*: Discovery was inevitable, so priority is merely a social "tie-breaker" with no deeper significance (e.g., Bell vs. Gray as a legal formality).  
     - *Priority stance*: Pure convention; credit assignment is arbitrary but stabilizes recognition.  

  3. **Contingent Achievement, Non-Instrumental Priority**  
     - *Description*: Discovery was not inevitable (coarse individuation), so the specific actors matter. Priority reflects genuine uniqueness (e.g., Darwin as irreplaceable).  
     - *Priority stance*: Non-instrumental; credit is inherently deserved, not just useful.  

  4. **Unique Formulation, Non-Instrumental Priority**  
     - *Description*: Discovery was not inevitable (fine individuation), so the exact formulation is attributed to the individual. Priority credits their distinct contribution (e.g., Leibniz’s notation as uniquely valuable).  
     - *Priority stance*: Non-instrumental; fairness demands attributing the specific achievement.  

  ---

  #### **Empty Cells and Why**  
  - **Fine + Inevitable (any sense)**: *Why empty? Incoherent.* Fine individuation implies formulations are unique, so inevitability (field/people/time) is implausible—e.g., Mendel’s laws rediscovered in 1900 might share a coarse idea (heredity) but differ in fine details.  
  - **Coarse + Not Inevitable + Conventional Priority**: *Why empty? Unappealing.* If a coarse discovery is contingent, calling priority "conventional" ignores the actors’ uniqueness—no one defends this.  
  - **Coarse + Not Inevitable + Instrumental Priority**: *Why empty? Unexplored.* Logically possible (e.g., rewarding Wallace to encourage amateurs) but rarely argued—historians emphasize non-instrumental credit here.  

  ---

  #### **Flagged Indistinguishable Pairs and Test Cases**  
  *Tree distinguishes all leaves except one pair. For these, use test cases to split:*  
  - **Pair: *Contingent Achievement, Non-Instrumental Priority* (Leaf 3) vs. *Unique Formulation, Non-Instrumental Priority* (Leaf 4)**  
    - *Why indistinguishable?* Both assign non-instrumental priority to non-inevitable discoveries. The tree can’t split them without re-asking individuation.  
    - **Test Case: Einstein’s 1905 Relativity**  
      - *If Leaf 3 (Coarse)*: Relativity as a broad idea (coarse) was contingent—Einstein uniquely synthesized it. Priority matters non-instrumentally for his role.  
      - *If Leaf 4 (Fine)*: Einstein’s specific formulation (fine) was irreplaceable—e.g., without his physical intuition, it wouldn’t exist. Priority credits his exact tensor math.  
      - *Split*: If you agree relativity could have emerged coarsely without Einstein (e.g., via Lorentz), choose Leaf 3. If Einstein’s formulation was singular, choose Leaf 4.  

  ---

  **Design Notes for Facilitation**  
  - **Time Allocation**: Spend 30 min on the tree (voting on nodes), 40 min debating leaves/cases, 20 min on empty cells.  
  - **Key Tensions**: Push on "inevitability" senses—e.g., for Mendel, was it field-ripe (yes, 1900 genetics) or time-driven (eventual with data)?  
  - **Why No Names?** Positions are idealized; e.g., Kuhn might align with *Inevitable-Coarse*, but the tree avoids historical labels for clarity.  
  - **Output**: Use this map to scaffold debate, then revisit cases (e.g., Bell vs. Gray’s filings) to test positions.  

  *Map fits one page when printed in 10-pt font with minimal margins.*
