  Hmm, this is a fascinating and complex ethics consultation. The user is part of a hospital ethics committee revising materials for living kidney donors, and they're grappling with how to characterize altruistic donation in normative terms. Their colleague has raised substantive objections about the concept of "beyond the call of duty," questioning both its theoretical coherence and practical implications.

  The user wants me to approach this as a moral philosopher specializing in normative structures, focusing on practical application rather than academic theory. They're asking for a set of requirements that any adequate account of supererogation must meet to be usable in their context, with particular attention to potential misuse in institutional settings.

  I need to consider several key dimensions: First, diagnostic failures - how "beyond duty" gets misapplied in practice. Common pitfalls include using it as a euphemism for optionality, inconsistent application across relationships (like family vs stranger donations), or masking institutional pressures. These failures motivate the requirements I'll propose.

  For the requirements themselves, I'll need to cover: Classification adequacy (handling cases like firefighters, family donations, low-cost kindnesses), necessary distinctions (like good-but-not-required vs required-but-excusable), puzzles to solve (the praise-without-blame paradox), and structural commitments (what the category presupposes about moral demands).

  I suspect tension between two requirements: Maintaining a sharp distinction between obligatory and supererogatory while allowing relational variability. There's also likely conflict between keeping the category substantive and preventing inflation to all permissible acts.

  Regarding theoretical families, I'll evaluate: Sacrifice-based accounts (handle cost but struggle with low-cost cases), rights-based approaches (good on distinctions but rigid on relationships), and virtue-adjacent views (handle admiration but blur praise/blame lines). Sacrifice-based views fail most requirements due to their cost threshold problems.

  My confidence varies across requirements. I'm most certain about the necessity of the praise-without-blame requirement, as it's core to the concept. Least confident about how to handle the "if everyone did it" problem - that needs more empirical work on collective action thresholds.

  Finally, between the colleague's two objections, the second (about relational relativity) seems stronger given our requirements. The first objection (concerning optionality) can be addressed by robust accounts, but the relational inconsistency directly violates our classification and distinction requirements.

  The user clearly values intellectual honesty here - they'd rather know if the concept is fundamentally flawed than get a sugar-coated answer. This suggests I should be transparent about tensions between requirements and theoretical limitations.
answer: |-
  Below is a structured analysis of the requirements for an adequate account of supererogation in your institutional context, driven by diagnostic failure modes. I then identify tensions, evaluate theoretical families, and conclude with reflections on standing and objections.

  ### **Diagnostic Failure Modes**  
  *(Driving the requirements below)*  
  1. **Euphemistic Vacuity**: Using "beyond duty" as a hollow synonym for "optional," obscuring normative substance.  
  2. **Relational Inconsistency**: Allowing duties to shift arbitrarily with social bonds (e.g., family vs. stranger), undermining impartiality.  
  3. **Coercive Masking**: Framing acts as "admirable but optional" while tacitly pressuring vulnerable agents (e.g., implying donors *should* feel inspired).  
  4. **Category Collapse**: Blurring supererogation with merely permissible acts or excusable failures.  

  ---

  ### **Desiderata for an Adequate Account**  
  *(✓ = Non-negotiable; ~ = Negotiable/contested)*  

  #### **I. Classification Adequacy** (Must correctly classify these acts)  
  - **✓ Firefighter re-entering a burning building**: *Motivation*: Tests extreme risk/cost. Failure mode: "Heroism" must not default to obligation for professionals.  
  - **✓ Directed donation to a sibling**: *Motivation*: Probes relational duties. Failure mode: Must not imply family donations are *automatically* obligatory.  
  - **✓ Small, recurring kindness to a stranger** (e.g., daily coffee for a homeless person): *Motivation*: Tests cost thresholds. Failure mode: Low-cost acts must not inflate into "duty" nor trivialize supererogation.  
  - **✓ Failed risky rescue** (e.g., drowning victim dies despite attempt): *Motivation*: Separates intention/effort from outcome. Failure mode: Admiration must survive failure.  
  - **✓ Collective-action cases** (Obligatory if all do, optional if one does; e.g., voting in fair elections): *Motivation*: Addresses fairness and over-demandingness. Failure mode: Must not collapse into consequentialist "each must always act."  
  - **~ "Suberogatory" acts** (Bad but not forbidden; e.g., minor rudeness): *Motivation*: Tests symmetry. Failure mode: If included, must not dilute focus on positive supererogation.  

  #### **II. Necessary Distinctions** (Must not collapse these)  
  - **✓ Good-but-not-required vs. required-but-excusable** (e.g., donating kidney vs. excused failure to donate due to health): *Motivation*: Prevents conflation of permission with exemption. Non-negotiable.  
  - **✓ Praise for performing vs. blame for omitting**: *Motivation*: Core to supererogation’s praise/no-blame structure. Failure mode: Avoids guilt-tripping donors. Non-negotiable.  
  - **✓ Agent cost/risk vs. recipient benefit**: *Motivation*: Prevents justifying high-cost/low-benefit acts as "duty." Non-negotiable.  
  - **✓ Overall admirability vs. admirability-in-one-respect** (e.g., donating illegally to save a life): *Motivation*: Acknowledges moral complexity. Non-negotiable.  
  - **✓ Beyond duty *simpliciter* vs. beyond *current role-based* duty**: *Motivation*: Clarifies that "duty" here means moral (not institutional) obligation. Failure mode: Blocks institutions from redefining roles to shift burdens. Non-negotiable.  

  #### **III. Puzzles to Solve**  
  - **✓ Praise/no-blame asymmetry**: Must explain why performing earns praise but omitting deserves no blame. *Motivation*: Otherwise, the category collapses into optionality with emotional baggage. Non-negotiable.  
  - **✓ Cost-threshold vagueness**: Must address whether supererogation vanishes as cost →0 (e.g., pressing elevator button). *Motivation*: Vagueness is tolerable *if* the account can ground a clear *range* (e.g., "significant cost"), but must not imply the category is arbitrary. ~Negotiable threshold definition, but not existence.  
  - **✓ Anti-inflation mechanism**: Must not classify *all* permissible good deeds as supererogatory (e.g., holding a door). *Motivation*: Preserves the category’s normative significance. Non-negotiable.  

  #### **IV. Structural Commitments**  
  - **✓ Presupposes a limit on moral demands**: Must explicitly acknowledge that morality does not require maximal sacrifice. *Motivation*: Otherwise, supererogation is incoherent. Non-negotiable.  
  - **✓ Neutrality among meta-ethical frameworks**: Must not entangle supererogation with consequentialism/contractualism/etc. *Motivation*: Institutional documents must avoid partisan meta-ethics. Non-negotiable.  
  - **✓ Privilege critique**: Must address whether the category favors those with resources to act. *Motivation*: Failure mode: Avoids implying "duty" is lower for the disadvantaged. ~Negotiable in framing, but must acknowledge the risk.  

  ---

  ### **Tensions and Impossibilities**  
  - **Fatal tension**: **Relational variability** (e.g., family vs. stranger donations) vs. **Anti-inflation mechanism**.  
    - *Why*: If duties shift with relationships, "supererogatory" becomes context-dependent. But this risks inflating duties for some (family = "simply what they do") and deflating them for others (strangers = "beyond duty"), violating impartiality.  
    - **Resolution**: The **relational variability requirement must be rejected** for institutional neutrality. Donation to a sibling *cannot* be framed as obligatory without unjustly burdening families.  

  ---

  ### **Theoretical Families: Best/Worst Fit**  
  *(Described conceptually)*  
  1. **Sacrifice-Based Views** (Supererogation = high-cost praiseworthy acts):  
     - *Best for*: Firefighter, risky rescue cases.  
     - *Worst for*: Low-cost kindnesses, collective-action puzzles. Fails cost-threshold vagueness and anti-inflation.  
  2. **Rights-Based Views** (Supererogation = waiving personal rights/claims):  
     - *Best for*: Distinctions (cost/benefit, praise/blame), anti-inflation.  
     - *Worst for*: Failed rescues (no right waived), relational duties.  
  3. **Virtue-Adjacent Views** (Supererogation = expressing excellence beyond obligation):  
     - *Best for*: Admirability, small kindnesses.  
     - *Worst for*: Praise/blame asymmetry, neutrality (risks cultural bias).  

  **Most eliminative requirement**: **Praise/no-blame asymmetry**. Sacrifice-based views often fail this (high cost may imply *some* blame for omission); virtue views blur praise with general admiration.  

  ---

  ### **Standing and Self-Critique**  
  - **Confidence in requirements**: 90% on distinctions (II) and structural commitments (IV) – these are grounded in avoiding institutional misuse. 70% on classification (I) – "small kindnesses" and "collective-action" cases are contested in literature.  
  - **Least confident point**: **Cost-threshold vagueness**. I suspect "significant cost" is irreducible and must be accepted, but worry this privileges intuitive judgments. *What would settle it*: Empirical studies on cross-cultural moral intuitions about cost thresholds.  
  - **Colleague’s objections**: The **second objection (relativity)** has more force. Once requirements are set, relational variability violates neutrality and inflates duties arbitrarily. The first objection (vacuous optionality) is avoidable with a robust account. Confidence: 85%.  

  ### **Recommendation for Your Draft**  
  Replace "beyond the call of duty" with:  
  > *"Altruistic kidney donation is a profound act of generosity that many find admirable. However, it is not morally required of anyone, regardless of their relationship to potential recipients. You should feel no blame or guilt for choosing not to donate."*  
  This satisfies all non-negotiable requirements while avoiding both objections.
