answer: |-
  Here's a longtermist dissection of smallpox eradication, addressing your core questions about foresight, custodial burdens, and the framework's limitations:

  **1. What Funders/Runners Thought They Were Buying (1967 Perspective):**
  *   **Dominant Justifications:** **Not** primarily longtermist calculus. Key drivers were:
      *   **Immediate Burden Relief:** Ending 2 million annual deaths *now*, plus blindness/disfigurement.
      *   **Economic Savings:** Huge recurring costs of vaccination/containment ($1.35B globally in 1967 USD annually). Eradication promised permanent cost avoidance.
      *   **Technocratic Feasibility:** Unique factors made smallpox *eradicable* (no animal reservoir, effective vaccine, obvious symptoms). Proving eradication was possible was a major motivator.
      *   **Cold War Prestige/Cooperation:** A rare arena for US/USSR collaboration, demonstrating global health leadership.
      *   **"Stop Vaccinating Forever" Goal:** A tangible, finite endpoint was central – the **termination of effort** itself was a huge selling point.
  *   **Long-Term View (Present, but Secondary):** The "forever" benefit *was* articulated, but rhetorically ("rid the world of this scourge forever"). It wasn't the primary *quantitative* driver used for funding decisions. Prospectively, the indefinite future benefit was seen as a desirable *consequence* of achieving the immediate goals (stop deaths/costs now) and the technical feat, not the core investment thesis. Discount rates weren't rigorously applied to centuries of averted deaths.

  **2. Longtermist Justification: Hindsight vs. Foresight:**
  *   **Hindsight Obviousness:** With any non-exponential discount rate, the EV is astronomically positive. ~300M deaths averted *so far* (since 1980) is dwarfed by the *infinite* future tail. This is the go-to example **for a reason**.
  *   **Foresight Uncertainty (What Couldn't Be Known/Relied Upon):**
      *   **Success Probability:** Failure risk was high (past malaria/TB failures loomed large). Longtermist EV requires multiplying huge benefits by success probability. In 1967, P(Success) was highly uncertain (<50% in many expert estimates).
      *   **Permanence Assumption:** The "forever" argument **depended entirely on the assumption that eradication meant irrevocable extinction.** The threat of preserved stocks or future synthesis was science fiction (or at best, ignored).
      *   **Counterfactual Stability:** Could they be certain smallpox wouldn't be *replaced* by something worse? Or that decades of non-exposure wouldn't increase vulnerability? (Unfounded fears, but uncertainty existed).
      *   **"Existential" Scale?:** While catastrophic, smallpox wasn't *existential* (X-risk). Longtermism often prioritizes X-risks. Prospectively, smallpox was a massive *catastrophic* risk reduction, not an X-risk reduction.
  *   **Where Longtermist View Starts Working Retrospectively:** It provides the dominant **retrospective justification**. We *now* see the astronomical, perpetual returns. Prospectively, the sheer scale of the *infinite* benefit tail couldn't overcome the uncertainty about success and permanence to be the *primary* motivator. It validated the *potential* of such interventions.

  **3. The Custodial Wrinkle & Longtermism's Blind Spot:**
  This is the critical flaw in the "one-shot permanent" narrative.
  *   **Terminal Benefit vs. Custodial Burden:**
      *   **Terminal:** Ending *natural transmission* (achieved). This averted the guaranteed annual burden forever.
      *   **Custodial:** Preventing *accidental/deliberate reintroduction*. This requires **perpetual effort:** high-containment labs, surveillance, diagnostics, vaccine stockpiles, response plans. This cost (~$1B+ globally since 1980) continues indefinitely.
  *   **Longtermism's Struggle with Custodial Benefits:**
      *   **Assumption of Permanence:** Standard longtermist EV models for eradication **implicitly assume the benefit is terminal and requires no upkeep.** Smallpox reveals this is often false. The "permanent" benefit is contingent on perpetual custodial investment.
      *   **Discounting Custodial Costs:** Longtermism *can* model custodial costs – you discount the infinite stream of future costs. However:
          *   **Underestimation:** Prospectively, custodial costs/duration are often severely underestimated (e.g., believing stocks would be destroyed quickly).
          *   **Risk of Failure:** Custodial systems can fail (lab accidents, state collapse, bioterrorism). The probability of reintroduction isn't zero, and increases over very long timescales or with advancing tech (synthesis).
          *   **Competition for Resources:** Perpetual custodial costs compete with other longtermist investments. $X million/year forever is an *infinite* cost in present value terms.
      *   **Synthesis as a Game-Changer:** DNA synthesis transforms smallpox from a potentially terminal win (if stocks were destroyed) into a **permanent custodial burden.** The "permanence" of eradication is now technologically contingent and reversible. Longtermism didn't anticipate this technological undermining of "permanent" interventions.

  **Bottom Line: Does Smallpox Confirm, Get Misdescribed, or Challenge Longtermism?**

  Smallpox **challenges a naive longtermism** and reveals a **crucial category it often overlooks:**

  1.  **Confirms (Cautiously):** It validates the *potential* for interventions with massive, long-tail benefits to be overwhelmingly positive *if* they are truly terminal and succeed. It shows such wins are possible.
  2.  **Gets Misdescribed (Often):** It's frequently cited *uncritically* as a pure "one-shot permanent win," ignoring the **ongoing custodial burden** and the **contingency of its permanence** on technology and sustained effort. This misdescription hides the critical custodial category.
  3.  **Falls into an Underappreciated Category:** Smallpox demonstrates **"High-Leverage, Contingently Permanent, but Custodially Dependent Interventions."** Longtermism often lacks the framework to properly evaluate this:
      *   It struggles to prospectively model the probability and cost of *indefinite* custodial requirements.
      *   It underestimates the risk that technological change (synthesis) can transform a "terminal" win into a custodial burden or even reverse it.
      *   It doesn't adequately distinguish between interventions that *truly end* a problem vs. those that *permanently manage* it.

  **Conclusion:** Smallpox eradication is a colossal long-term win *because* of the averted natural transmission. However, the continued existence of the virus and the feasibility of synthesis expose a fundamental limitation: **many "permanent" solutions require permanent upkeep.** Longtermist EV reasoning *can* technically model custodial costs, but it often fails to do so rigorously prospectively, underestimates their duration and risk, and lacks clear frameworks for categorizing and prioritizing interventions based on their terminal vs. custodial nature. Smallpox confirms longtermism's potential but highlights its need to explicitly account for **custodial permanence** and **technological contingency** to avoid misapplying historical successes to future challenges like AI safety or engineered pandemics, where the custodial burden might be infinite or the permanence impossible.
