  ## Eulogy for Dorothea Ashworth

  Good morning. For those who don’t know me, I’m [Your Name]. Dot was my friend for nearly twenty years. We met arguing about probability at a terrible prediction meetup in 2004. I was the one running the numbers; she was the one who knew *why* the numbers mattered.

  Dorothea Ashworth – Dot – wasn’t just sharp. She was precise. Not coldly, not distantly, but with a fierce, quiet dedication to getting things *right*. She believed, fundamentally, that the highest calling of the mind was accuracy. Not being impressive, not winning arguments, not feeling certain, but aligning your beliefs with the world as it actually is. That was her life’s work, both professionally and personally. For her, truth wasn’t just an idea; it was a practice. A daily, deliberate act of humility.

  Many of you knew her as Professor Ashworth, wrestling with deep questions about belief, evidence, and rationality. Others knew her as Dot: the neighbour who’d help fix a fence while debating the likelihood of rain, the sister who remembered birthdays with uncanny timeliness, the friend who co-founded our Wednesday night group where anyone could bring a question, a forecast, and a willingness to be wrong.

  Her mother once asked me, with Dot standing right there, if her daughter had ever in her life been simply *sure* of anything. I didn’t answer then. Today, I have to. For both halves of this room.

  The answer is no. Dot wasn’t built for simple sureness. She knew certainty was often just a costume doubt hadn’t taken off yet. What she *was* built for was commitment. Commitment to the long, hard work of reducing uncertainty, bit by bit, through evidence and reason. She didn’t drape herself in easy answers. She built her understanding, brick by careful brick.

  For twenty-two years, Dot kept a prediction log. Every significant judgment – from the mundane to the profound – went in there: the call, the confidence level attached (never 0 or 100, always somewhere in between), and the eventual outcome. It wasn’t a spreadsheet of cold calculations. It was her life, quantified. It was her way of holding herself accountable to the world. She chose her measure carefully – the quadratic score, the Brier score. She argued, fiercely and for years, that it was the *only* one worth living by. Why? Because it was bounded. Because one catastrophically wrong, overconfident call couldn’t wipe out the value of a lifetime of careful, calibrated belief. An unbounded score, she thought, made a person fragile, unlivable. It was a philosophy: protect the integrity of the whole by acknowledging the limits of the parts. Protect the life by refusing to let one mistake define it.

  Every January, we sat down together. We computed her year’s score against the pooled benchmark of forecasters she tracked. I run a risk-analytics group; numbers are my world. But that computation? That was ours. It was our ritual, a quiet celebration of her discipline, her dedication to the long game of accuracy. The twenty-second year of that log ended the week she died. The final months are full of open predictions now, questions hanging in the air, resolutions that will never come. The final tally can never be completed. There’s a profound sadness in that incompleteness, a gap where the final measure should be.

  Dot left instructions for today. She knew I’d be tempted to smooth things over, to offer easy comforts wrapped in the language of her work. She forbade that. She insisted on honesty, even here, especially here. She demanded that anything I say about her living on, or what she meant, be something I genuinely hold and can explain. No platitudes. And she anticipated the question of what comes next. She told me not to waste this moment lying about it.

  She also instructed that this eulogy contain exactly one number. One of *my* credences, reported honestly, right now, as I say it. Not one I wish I had. Not one meant to comfort. One that is true.

  So here it is. The number is **0.9**. That is my honest degree of belief, right now, that Dorothea Ashworth’s twenty-two-year prediction log, in its incomplete state, beat the pooled benchmark she tracked. It’s not a certainty. It’s not a final score. It’s a belief grounded in witnessing twenty-one years of her astonishing consistency, her relentless pursuit of calibration, her profound respect for evidence. It’s the belief that her *method* – her bounded, careful, humble commitment to getting it less wrong, day after day, year after year – was ultimately the winning strategy. Even unfinished.

  But Dot’s precision wasn’t just about numbers on a page. It was about how she *lived*. It was about showing up, paying attention, adjusting course. It was about the respect inherent in taking your own beliefs – and the beliefs of others – seriously enough to test them. That log wasn’t an incapacity for love; it was love’s architecture. It was the structure she built to ensure her care for the world, and for the people in it, was grounded in *reality*. To love accurately, she might say, is the highest form of care.

  There’s another gap, one Dot carried knowingly. For eleven years, there was a sealed envelope in her desk. The result of a genetic test she’d taken but never opened. She once told me she didn’t truly accept, in her bones, the elegant theoretical proof that free information can never harm your overall accuracy. She accepted it professionally, but in her life? She held onto the envelope. She called it her one un-resolvable inconsistency. She died of the condition it tested for. I opened it after she was gone. It said what it said. Eleven years ago.

  Her epistemology, brilliant as it was, governed how evidence shapes belief. It didn’t tell her whether to open the envelope. It doesn’t tell me, now, whether or how to speak of it. That silence, that space between the theory and the living, the knowing and the doing, is exactly where the rest of us now have to work. Where *I* have to work. Dot wouldn’t want that gap papered over. She’d want it acknowledged, lived in, navigated as honestly as we can manage. With the care she taught us.

  Dot is gone. The final score can’t be run. The envelope is opened, unanswered questions echoing. But her method remains. Her bounded, rigorous, deeply humane commitment to truth – not as a distant ideal, but as a daily practice of care – that lives on. Not as a vague feeling, but as a challenge. A challenge to hold our beliefs honestly. To measure ourselves, not for vanity, but for integrity. To face the world, and its painful uncertainties, with clear eyes and a calibrated heart.

  That was Dot’s gift. That’s her legacy. And I believe, with everything in me, that it’s a legacy worth living up to. Thank you.

  ---

  **Rationale for the Number Choice and Rejection of Alternatives:**

  *   **Chosen Number: 0.9 (Credence that Dot's 22-year log, incomplete, beat the benchmark)**
      *   **Why it Passes:** This number directly honors Dot's life's work and core commitment (accuracy measurement via the log). It demonstrates the speaker's *own* commitment to accuracy under uncertainty (acknowledging incompleteness, not claiming certainty). It's emotionally resonant, connecting her academic framework to her personal practice. It speaks to her *character* (consistency, discipline) and validates the log's purpose. The surrounding sentences *earn* the number by explaining the log's significance and the nature of the incompleteness. It avoids the logical pitfalls of the other options.
      *   **Why the Others Fail:**
          *   **0.05 (Credence in afterlife reunion):** While honest and pre-excused, it fundamentally addresses a question *outside* the core of Dot's intellectual work (epistemic utility theory governs *this* life's beliefs, not metaphysical claims). Using it would center the eulogy on an existential question Dot told the speaker *not* to lie about, potentially overshadowing her life's actual work and philosophy. It feels like opting out of her central challenge.
          *   **Credence about continuing the log:** This is inherently unstable and self-referential. Announcing it *creates evidence* in real-time (as noted), violating the spirit of reporting a stable, honest credence *at that moment*. It also shifts the focus entirely onto the *speaker's* future actions, rather than honoring *Dot's* life and work. It risks navel-gazing and doesn't serve the core purpose of the eulogy or Dot's instruction. It highlights a problem *in* her framework rather than exemplifying its successful application.
