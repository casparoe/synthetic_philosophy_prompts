  Starting with the opening claim: "Equal poverty until recently." That's broadly accepted but requires nuance—the Industrial Revolution widened gaps, but pre-modern inequality existed (Roman Egypt vs. hunter-gatherers). The user's note-taking seems accurate here; the simplification is tolerable for a magazine piece.

  The "reversal of fortune" argument comes from Acemoglu/Johnson/Robinson's work. The correlation (tropical colonies poor now, temperate rich) is solid, but calling it "nothing to do with geography/culture" is overstated. Geography *enabled* extractive institutions via disease mortality—it's indirect but real. User's instinct about "only through" claims being problematic is spot-on; the instrument (settler mortality) is hotly debated. Critics like Albouy question mortality data validity. I should emphasize this isn't settled.

