  Okay, this novelist has a complex query about constructing a believable academic dispute between a cognitive scientist of religion and an anthropologist. They need the core requirements for a naturalistic theory of religion, sorted by importance and feasibility, with special attention to potential contradictions between requirements.

  First, I need to understand their deepest needs: They explicitly want the "spine" of the dispute - not findings but what counts as a finding. They're frustrated with collapsed distinctions in existing literature and want clarity on non-negotiable vs. negotiable requirements. Most crucially, they suspect some requirements are mutually incompatible and want to know which must be sacrificed.

  The key challenges I see: 
  - Balancing universality vs. particularity in religious phenomena
  - Handling epistemic neutrality without being toothless
  - Reconciling costly practices with no observable payoff
  - Accounting for both cognitive machinery and cultural variation

  I'll structure the response around fundamental requirements first. The absolute baseline must be explaining recurrence across cultures - without that, it's not about religion as a phenomenon. Then persistence despite costs comes next, as it's the central evolutionary puzzle. Distinctions like origin vs. maintenance must be preserved, and awkward facts like perfunctory observance can't be ignored.

  On the neutrality dilemma: I think we must require non-debunking intent but allow debunking implications. The theory should explain why beliefs feel true regardless of actual truth. And yes, it must apply to its own author - that's non-negotiable for intellectual integrity, though it makes the neutrality problem harder.

  The joint unsatisfiability suspicion is sharp: I agree explaining recurrence, variation, predictive power and neutrality simultaneously may be impossible. Variation and neutrality might be the casualties - a strong theory probably must commit to why content diverges, and imply something about truth conditions. The "predictions that could come out otherwise" requirement might need softening too.

  Regarding existing proposals: Agent detection and minimally counterintuitive concepts answer genuine recurrence requirements; costly signaling addresses persistence but risks overstating commitment; moralizing gods theories often mistake local features for universals. The parasitic replicator idea is valuable but sometimes elevated improperly to a requirement.

  For the anthropologist's critique: They'd attack how cognitive scientists promote their favored mechanisms (like hyperactive agency detection) into requirements, then judge theories by compatibility with them rather than explanatory power. This circularity is the precise target.

  The final assessment should contrast approaches implicitly: Evolutionary ones handle persistence well but stumble on variation; cognitive ones explain recurrence but struggle with costly practices; cultural selection models account for content divergence but often ignore individual cognition.

  This needs to flow as continuous prose, starting with most fundamental requirements, addressing each constraint naturally. The tone should be confident but not dogmatic - after all, the novelist needs room for their characters to disagree.
answer: |-
  Your request cuts to the heart of the methodological tension that animates the field and fuels your characters' dispute. Crafting a naturalistic theory of religion demands navigating treacherous terrain where definitions are contested, evidence is multifaceted, and the stakes involve deeply held human experiences. The desiderata below outline what such a theory must strive for, sorted by fundamentality, with the motivating case for each and an assessment of negotiability. I'll then address the points of tension you raise, including the suspected over-constraint and the sorting of existing proposals.

  The most fundamental requirement for any naturalistic theory of religion is that it must explain the *recurrent emergence and persistence* of phenomena recognizably classified as religious across diverse human cultures, throughout history, and despite vast differences in ecology, social structure, and technological development. The case for this is simply that recurrence is the phenomenon demanding explanation. A theory that only accounts for one tradition or type fails its primary purpose. This is non-negotiable; without it, there is no explanandum. Closely tied to this is the obligation to explain the *persistence* of religious beliefs and practices, particularly costly ones, across generations. Why do individuals invest significant time, resources, risk, or opportunity cost in observances whose tangible benefits – especially supernatural ones – remain unverifiable by the practitioner? Why do parents transmit these practices to children? The historical and ethnographic record overflows with examples of costly devotion, from arduous pilgrimages to ascetic renunciation to martyrdom. While not every religious act is costly, the persistence of costly forms presents a specific evolutionary or cultural-selectionist puzzle that a robust theory must tackle. Failure here leaves a core aspect of the phenomenon unexplained. This requirement, while demanding, is also non-negotiable for a comprehensive theory, though its centrality is sometimes contested by those prioritizing cognition over cultural transmission.

  The theory must simultaneously account for the *extraordinary diversity of religious content and form*. It cannot merely explain why "something religious" exists; it must grapple with why specific beliefs and practices (e.g., ancestor worship, monotheism, polytheism, animism, shamanism, salvation religions, godless philosophies like some forms of Buddhism or Confucianism) arise, stabilize, change, or disappear in specific contexts. The ethnographic and historical record shows wild variation: societies without creator gods, without concepts of an afterlife or salvation, with radically different moral frameworks linked to the supernatural, and with vastly different ritual expressions. A theory that predicts only a single type of "religion" fails against this diversity. This requirement is non-negotiable; variation is as much a fact as recurrence. Crucially, this obliges the theory to respect the distinction between the *near-universal cognitive and social capacities* underlying religion (e.g., theory of mind, hyperactive agency detection, intuitive dualism, coalitional psychology, susceptibility to ritualized behavior) and the *culturally specific content* that gets built upon them. Collapsing this distinction leads to crude reductionism. The theory must also respect the distinction between *origin* (how specific beliefs/practices arise in individuals or groups) and *maintenance/persistence* (how they are transmitted and stabilized over time and across populations). Mechanisms for one may not suffice for the other.

  Furthermore, the theory must be compatible with well-established ethnographic and historical findings, including the "awkward" ones: that most religious adherents exhibit *mundane competence* in non-religious domains, demonstrating that religious belief is not a pervasive delusion or cognitive deficiency; that *stable, long-lived traditions exist* which lack core features often assumed essential (like creator gods, salvation, or even strong supernatural agents); that *religious change and abandonment* occur frequently, sometimes rapidly and without apparent psychological trauma, through conversion, secularization, or syncretism; and that the spectrum of engagement includes widespread *low-cost, perfunctory, or instrumental observance* alongside deep devotion. Ignoring these falsifies the complexity of the lived phenomenon. This requirement is non-negotiable; theories contradicting robust historical or ethnographic evidence are empirically inadequate.

  The theory must also possess *explanatory coherence and predictive power*. It should integrate with broader understandings of human cognition, development, sociality, and cultural evolution. It should generate predictions that are, in principle, testable – not necessarily confined to a lab (ethnographic, historical, archaeological, comparative, or developmental data are crucial) but capable of being falsified or supported by evidence beyond the initial cases used to build it. Predictions should ideally be ones that *could have turned out otherwise*. A theory that only explains what we already know, or that is compatible with any conceivable outcome, is weak. This requirement for testable, non-tautological predictions is fundamental but its *form* (e.g., lab experiments vs. historical analysis) is negotiable, depending on the level of explanation (proximate cognitive mechanisms vs. distal cultural evolution). Relatedly, the theory should aim for *parsimony* – not simplistic, but avoiding unnecessary complexity – though this is a guiding principle rather than a strict requirement.

  Now, to the points of contention you identified. The demand for identifying a *mechanism* over a *function* is often a local preference masking ontological commitments. A complete theory needs both: mechanisms explain how it works (e.g., cognitive biases, ritualized behavior triggers), functions (or more neutrally, consequences) explain why it persists (e.g., social cohesion, anxiety reduction, coalitional signaling). Insisting solely on mechanism risks ignoring cultural evolution; insisting solely on function risks teleology. Neither is absolutely non-negotiable alone, but a robust theory integrates both levels. The demand for *symmetry* between adaptation and byproduct explanations is a good heuristic but not an absolute requirement. The evidence should determine whether a feature is an adaptation, a byproduct, or an exaptation. Forcing symmetry can be artificial. The insistence on *laboratory-testable predictions* is often a local preference (rooted in specific cognitive science paradigms) elevated beyond reason. While lab studies on cognition are valuable, many core aspects of religion (historical persistence, large-scale cultural change, complex social functions) are not amenable to lab replication and require other methodologies. This is negotiable.

  Regarding *epistemic neutrality*: This is the thorniest. A naturalistic theory *must* presuppose methodological naturalism – it explains religion without invoking the supernatural as a causal factor. However, it *cannot* and *should not* claim absolute epistemic neutrality regarding the *truth-value* of specific religious claims within its own framework. Its explanations (e.g., why belief in invisible agents is compelling) inherently imply that such beliefs arise from natural cognitive processes that operate regardless of the objective existence of those agents. This *does* have debunking *implications* for claims that the belief *only* makes sense if the agent is real, or that its universality proves its truth. However, it does not *directly* debunk the metaphysical claim itself (e.g., "God exists") – that remains a separate philosophical question. The theory must explain *why* these beliefs feel subjectively true and compelling to believers, regardless of their objective status. Crucially, **the theory must apply reflexively**: The cognitive scientist’s own conviction in naturalism, and the anthropologist’s conviction in cultural constructivism, must be explainable by the same natural cognitive and cultural processes. This reflexivity is non-negotiable and prevents special pleading. It imposes a cost: the theory cannot claim a privileged, transcendent rationality for itself. It must accept that its own conclusions are also products of evolved minds operating within cultural traditions. This avoids both the charge of "stealth debunking" (by being transparent about its naturalistic presuppositions and the implications of its explanations) and the charge of "toothlessness" (by providing natural explanations that challenge supernatural accounts of belief's origins and persistence). The requirement is thus: **Explain religious belief formation and persistence naturalistically and reflexively, acknowledging the implications for justification while focusing on causal origins and consequences.**

  You suspect joint unsatisfiability regarding recurrence, diversity, predictive power, and neutrality. Your suspicion is astute. The core tension lies primarily between explaining **recurrence/persistence** (implying shared underlying mechanisms) and explaining **diversity/variation** (requiring sensitivity to highly specific cultural, historical, and ecological contexts). A theory strong on universals (e.g., hyperactive agency detection) often struggles with variation; a theory strong on cultural particulars (e.g., specific historical trajectories) often struggles with recurrence. Bridging this gap requires multi-level models integrating cognitive universals with cultural evolutionary processes, but this is immensely challenging and often results in either underspecified universals or ad-hoc explanations for variation. The "predictions that could come out otherwise" requirement further strains this, as highly contextual explanations can seem post-hoc. Epistemic neutrality/reflexivity, while crucial for coherence, adds another layer of complexity but is less directly in tension with the others. **The requirement that most often has to "give" in practice, or be significantly nuanced, is the demand for strong, specific predictions applicable across all contexts.** Predictions often become probabilistic or conditional on specific cultural or cognitive parameters, rather than universal laws. The requirement that does the most work in eliminating candidates, however, is the **explanation for the persistence of costly practices without observable payoffs**. Many appealing cognitive explanations (e.g., minimally counterintuitive concepts are memorable) fail here, as memorability doesn't explain costly behavioral commitment over generations. Theories focusing only on individual benefits (e.g., anxiety reduction) struggle with practices where costs clearly outweigh plausible individual benefits or where benefits are non-existent for many participants (e.g., celibacy). This forces theories towards group-level cultural selection, signaling, or byproduct+exaptation models, which then face challenges explaining specific content and rapid change.

  Sorting the proposals you listed:
  *   **Hypersensitive agent detection:** Addresses a genuine requirement – explaining the recurrence of belief in intentional agents. It's a plausible cognitive *mechanism* contributing to *origin* and recurrence. It doesn't explain diversity, costly persistence, or many forms of non-agent-based religiosity.
  *   **Minimally counterintuitive concepts:** Addresses a genuine requirement – explaining the memorability and transmissibility of *some* religious concepts (a proximate mechanism for cultural transmission). It explains recurrence/virality of concepts but not necessarily costly practices, diversity, or why *these* concepts become central.
  *   **Ritual costliness as coalition signal:** Directly addresses the crucial requirement of explaining costly practice persistence (as a solution to cooperation problems within groups). It's a strong contender for the persistence puzzle. It explains less about belief content diversity or origin of specific beliefs. It risks overemphasizing costly signals when much practice is low-cost.
  *   **Watchful moralizing gods enabling large-scale cooperation:** Addresses persistence (cultural group selection) and a specific *type* of content diversity (why moralizing gods correlate with complex societies). It offers an explanation for a specific, widespread *pattern* of diversity linked to social scale. It struggles with stable large-scale societies lacking such gods and with non-moralistic religions.
  *   **Religion as parasitic replicator (meme-complex):** Focuses on content diversity and cultural transmission dynamics. It addresses the "origin vs. persistence" distinction by emphasizing cultural evolution. It can struggle with explaining the initial attraction/recurrence and the persistence of *costly* practices if they reduce the meme's fitness.

  The anthropologist's critique targets the **promotion of specific mechanisms into requirements**. For instance, if "hyperactive agency detection" becomes a *requirement* for a theory, then traditions emphasizing impersonal forces or ancestor spirits (where agency is less "hyperactive") are seen as secondary or derivative, rather than valid variations the theory must equally explain. Similarly, if "costly signaling" becomes a requirement, low-cost or internally focused practices are marginalized. The cognitive scientist risks building a theory that explains only the phenomena that fit their favored mechanism, redefining "core" religion to match, while the anthropologist insists the theory must account for the full, messy catalogue of human phenomena labelled religious without prioritizing mechanisms derived from a subset. The anthropologist argues that the target is not pre-defined by the mechanism; the mechanism must be justified by its power to explain the actual, varied target.

  Briefly assessing contenders against these desiderata: Theories heavily reliant on universal cognitive biases excel at proximate mechanisms for recurrence and belief formation but often stumble on costly persistence and diversity, sometimes downplaying the latter. Theories emphasizing cultural evolution or group selection handle persistence (especially costly signals) and diversity better but can be less precise on the cognitive origins and may struggle with the universality of the underlying attraction. Signaling theories powerfully address costly persistence but can be overly functionalist and struggle with non-coalitional or low-cost religion. Truly satisfying theories attempt multi-level integration, acknowledging that recurrence arises from cognitive universals, persistence often involves cultural evolution solving cooperation or commitment problems, and diversity stems from the interaction of these with specific ecologies and histories. None fully resolves all tensions, particularly between the granularity needed for diversity and the generality needed for recurrence/prediction, and all face the reflexive challenge of explaining the naturalist's own stance. The field's dynamism lies precisely in this unresolved tension, the space where your characters' dispute truly lives.
