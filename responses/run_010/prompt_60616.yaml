  But I'm already seeing potential cracks in this mapping. The user's intuition that modifiable factors don't fully capture "choice" seems right - in insurance we classify smoking as modifiable, but philosophy might question how voluntary that choice really is. That's a translation bend.

  The user's key insight about relative risk positions is spot-on. Insurance requires diversifiable risk, but being "less talented" is zero-sum - we can't all be in the bottom percentile. This isn't just a user confusion; it's a legitimate hole in the hypothetical insurance model that philosophers like Anderson have criticized. 

  For the standard objections:
