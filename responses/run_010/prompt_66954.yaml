          Group Y: They prefer B over C? No, they prefer C over B. So they get B which is worse than C. So that's bad.

          Or if they report: A=3, C=1, B=0? Then:
            A: 30
            B: 10*0 + 8*3 + 6*2 = 24+12=36
            C: 10*1 + 8*2 + 6*3 = 10+16+18=44
            -> C wins.

          So they cannot change the outcome.

     - This setup might not be easily manipulable in Borda? We need a different preference profile? 

     - Given time, we might skip and move to IRV which has a clear example.

  7. Round 4: Instant Runoff (IRV) - Truthful (7 min)
     - Truthful rankings:
          Group X: 1.B, 2.C, 3.D, 4.A
          Group Y: 1.A, 2.C, 3.B, 4.D
          Group Z: 1.C, 2.B, 3.D, 4.A

          First round: 
            A:10, B:8, C:6, D:0 -> eliminate D (but D has 0, so next lowest is C with 6? But we eliminate the last. D is last, but has 0. Then we eliminate C? Actually, we eliminate the candidate with the fewest first-place votes. D has 0, so eliminate D -> no change.
            Then next: now candidates A, B, C. C has the fewest (6), so eliminate C.
            Transfer C's votes: Group Z has C as first, and then next is B. So 6 votes go to B.
            Now: A:10, B:8+6=14 -> B wins.

     - Outcome: B wins.

     - Now, Group Y (who prefer A over B) might try to manipulate. How? They could try to rank C higher than A? But they already have C second. Or they could try to not rank A first? 

          If Group Y reports: 1.C, 2.A, 3.B, 4.D  [they are lying by putting C first]
          Then first round:
            A:0 (from Group Y) + but Group X and Z still: 
            Group X: B:8
            Group Y: C:10
            Group Z: C:6
            So: A:0, B:8, C:10+6=16, D:0 -> eliminate D (0) and then A (0) -> then runoff between B and C.
            Then: Group X: B>C -> B
                   Group Y: C>B -> C
                   Group Z: C>B -> C
            -> C wins.

          Group Y: they prefer C over B, so they are better off (C instead of B). And they got that by lying.

     - So we can show that.

  8. Round 5: Random dictatorship (5 min)
     - Randomly pick one student (by drawing a number). Then the winner is that student's top choice.
     - We do this once: the outcome is random. It could be A, B, or C.

  9. Debrief (10 min)
     - We have seen that in plurality, runoff, and IRV, there were opportunities for groups to get a better outcome by lying about their preferences.
     - In random dictatorship, no one has an incentive to lie because it only depends on one randomly selected voter's top choice. Lying in other votes doesn't matter. But it's random and might elect a candidate that is not preferred by the majority.
     - Discuss the conditions of Arrow's theorem: 
          - Non-dictatorship: random dictatorship is dictatorial in the sense that one voter decides, but randomly so it's not a fixed dictator. However, the theorem requires non-dictatorship, so random dictatorship violates that condition.
          - We also saw that every other system we tried was manipulable (i.e., not strategy-proof).

     - Map to the theorem: Arrow's theorem says that no voting system can be both Pareto efficient, independent of irrelevant alternatives, and non-dictatorial, while also being strategy-proof? Actually, Arrow's theorem is about social welfare functions and not directly about strategy-proofness. The property we are seeing is strategy-proofness, which is covered by the Gibbard-Satterthwaite theorem.

     - Clarify: 
          Arrow's Impossibility Theorem: For 3 or more candidates, no voting system can simultaneously satisfy:
            1. Unrestricted domain (any preferences allowed)
            2. Non-dictatorship
            3. Pareto efficiency (if everyone prefers A over B, then B should not win)
            4. Independence of irrelevant alternatives (IIA): the relative ranking of A vs B should not depend on a third candidate C.

          What we observed is tactical voting, which is about strategy-proofness. The Gibbard-Satterthwaite theorem says that for 3 or more candidates, the only voting rules that are strategy-proof are dictatorial (or have a range of only two candidates).

     - So in the debrief, we should note that the vulnerability to strategic voting is inevitable for any non-dictatorial voting system with three or more candidates.

     - In our game, we saw examples in plurality, runoff, and IRV. And then random dictatorship is dictatorial (but randomized) and hence strategy-proof.

     - Why is random dictatorship strategy-proof? 
          Because your vote only matters if you are the dictator. When you are not the dictator, your vote doesn't matter. When you are the dictator, you get your top choice by reporting it truthfully. So there is no incentive to lie.

     - But note: random dictatorship is not a dictatorship (because the dictator is chosen randomly) and hence satisfies non-dictatorship in a probabilistic sense? But the Gibbard-Satterthwaite theorem considers deterministic rules. Random dictatorship is strategy-proof and non-dictatorial (in the sense that no fixed voter is the dictator), but it is not deterministic.

     - In the game, the students should feel that the escape hatch (random dictatorship) is unappealing because it ignores the preferences of almost everyone.

  **What might go wrong:**

  1. Time: 50 minutes is tight. We have 5 segments (plurality, runoff, borda, IRV, random) plus intro and debrief. We might run over. 
     - Solution: Skip Borda or do it quickly. Or focus on plurality, runoff, and IRV.

  2. Students might not figure out the strategic move. 
     - Solution: Have prompts ready. For example, in plurality: "Group X, if you vote for your favorite B, then A wins. If you vote for C, then C might win. Would you prefer C over A?"

  3. In runoff, the strategic move is more complex. We might need to guide them.

  4. In borda, we might not see manipulation and it might be confusing. We could skip it.

  5. Preference change: We changed Group Y's preferences for the runoff example. We must make sure to hand out new preference cards or explain clearly.

  **Revised timeline with focus on key rules:**

  - Intro (5 min)
  - Plurality: truthful and strategic (5+5=10 min)
  - Runoff: truthful and strategic (7+7=14 min) [but we'll do 5+5=10 min]
  - IRV: truthful and strategic (7+7=14 min) [do 5+5=10 min]
  - Random dictatorship (2 min)
  - Debrief (10 min)

  Total: 5+10+10+10+2+10 = 47 minutes.

  But if we skip runoff strategic (because it's complex) and only do truthful, then we save time. Or skip Borda.

  We'll skip Borda and focus on:
  - Plurality (truthful and strategic)
  - Runoff (truthful and strategic) [with the changed preferences for Group Y? Or we can use the same preferences as in the beginning and accept that runoff might not show manipulation?]

  Alternatively, we can use the changed preferences throughout and then do:

          Group X: B > C > D > A   (8)
          Group Y: A > C > B > D   (10)   [changed]
          Group Z: C > B > D > A   (6)

  Then we have manipulations in plurality, runoff, and IRV.

  **Final Design:**

  Preferences:
  - Group X (8): B > C > D > A
  - Group Y (10): A > C > B > D
  - Group Z (6): C > B > D > A

  Materials: 
  - Preference cards for each student.
  - Ballots for plurality (simple paper with one choice), for runoff (two rounds), for IRV (rank all).

  Scoring: Not needed, but we can ask after each round: "Are you happy with the outcome? Why?"

  Timeline:

  1. Intro (5 min): Assign groups and preferences. Explain the rules and goal.

  2. Plurality (5 min truthful + 5 min strategic = 10 min)
     - Truthful: vote for top choice -> A wins.
     - Then: "Now, you can vote again, and you can vote for any candidate. Discuss in your groups if you want." 
          We hope Group X will vote for C. 
          If not, prompt: "Group X, if you vote for B, A wins. If you vote for C, then C gets 8+6=14, A=10 -> C wins. Would you prefer C over A? (Yes, because B>C>...>A, so C> A). So vote for C."
          Then tally: C wins.

  3. Runoff (5 min truthful + 5 min strategic = 10 min)
     - Truthful: 
          First round: A:10, B:8, C:6 -> top two: A and B.
          Runoff: A vs B -> Group X and Z vote B, Group Y votes A -> B wins.
     - Strategic: 
          Now, tell Group Y: "In the first round, if you vote for C instead of A, then what happens?"
          First round: Group X: B, Group Y: C, Group Z: C -> C:16, B:8 -> top two: B and C.
          Runoff: B vs C -> Group X: B, Group Y: C (because they prefer C>B), Group Z: C -> C wins.
          Group Y: they prefer C over B, so better off.

  4. IRV (5 min truthful + 5 min strategic = 10 min)
     - Truthful:
          First round: A:10, B:8, C:6, D:0 -> eliminate D (but D=0, so eliminate C next? 
          Actually, we eliminate the candidate with fewest first-place votes: D has 0, so eliminate D. Then next: C has 6, which is the fewest, so eliminate C.
          Transfer C's votes to next choice: Group Z's next is B -> add 6 to B: B becomes 8+6=14, A:10 -> B wins.
     - Strategic:
          Tell Group Y: "In the first round, if you rank C first and A second, then what happens?"
          Group Y reports: 1.C, 2.A, 3.B, 4.D.
          First round: 
               A:0 (Group Y doesn't vote A first) 
               B:8 (Group X)
               C:10 (Group Y) + 6 (Group Z) = 16
               D:0 -> eliminate D, then A has 0? So eliminate A. Then runoff: B and C.
          Then: 
               Group X: B next -> B
               Group Y: C next -> C
               Group Z: C next -> C
               -> C wins.
          Group Y: they prefer C over B, so better off.

  5. Random dictatorship (2 min): Randomly pick one student, and their top choice wins.

  6. Debrief (10 min):
     - In plurality, runoff, and IRV, we saw that by misrepresenting their preferences, a group of voters could achieve a better outcome.
     - This is known as tactical voting or strategic voting.
     - The only rule we saw that is immune to this is random dictatorship: because your vote only matters if you are the dictator, and then you get your top choice by being truthful. But it's unappealing because it ignores the will of the majority.
     - This illustrates a fundamental result in social choice theory: the Gibbard-Satterthwaite theorem. It states that for three or more alternatives, the only voting rules that are strategy-proof (i.e., there is never an incentive to lie) are dictatorial.
     - Random dictatorship is strategy-proof and non-dictatorial (in the sense that no fixed voter is the dictator), but it is not deterministic. The deterministic version (fixed dictator) is strategy-proof but dictatorial.

     - In the student election, the clubs engaged in tactical voting (burying their favorite) to achieve a better outcome. This is not a moral failing but a consequence of the voting rule used.

  **What the game cannot reproduce:**

  - The game might not illustrate the full generality of the theorem. We only showed a few examples.
  - The game might not cover all voting rules.
  - The preference profiles are fixed and designed to show the vulnerability. In reality, any non-dictatorial rule will have some profiles that are vulnerable.
  - The theorem applies to any deterministic voting rule that is not dictatorial: it will be vulnerable to manipulation in some preference profiles. But our game only shows specific profiles.

  **Recovery from issues:**

  - If students don't see the strategic move, guide them with leading questions.
  - If time runs short, skip one of the strategic rounds (maybe runoff) or reduce discussion.
  - If there's a tie, break it arbitrarily (e.g., alphabetical).

  This should give the students a visceral understanding of tactical voting and why it occurs.
answer: |-
  Below is a complete game design for your 50-minute political philosophy section, tailored to help students discover strategic voting vulnerabilities experientially. The game uses a scenario mirroring your student senate election, where groups can manipulate outcomes by misrepresenting preferences. The finale demonstrates random dictatorship as the only (unappealing) escape hatch.

  ---

  ### **Core Setup**
  - **Students**: 24 (split into 3 pre-assigned groups with conflicting preferences).  
  - **Candidates**: 4 options (A, B, C, D).  
  - **Preferences**:  
    - **Group 1 (10 students)**: True ranking: **B > C > D > A**  
      *(Prefers B, but dislikes A the most; willing to bury B to stop A)*  
    - **Group 2 (10 students)**: True ranking: **A > D > C > B**  
      *(A is their frontrunner; dislikes B)*  
    - **Group 3 (4 students)**: True ranking: **C > B > D > A**  
      *(Prefers C; neutral between B/D but dislikes A)*  
  - **Objective**: Elect a candidate via different voting rules. Groups gain by lying to avoid bad outcomes (e.g., Group 1 buries B to help C beat A).  

  ---

  ### **Materials**  
  1. **Preference cards** (24): Index cards with each group’s true ranking (e.g., Group 1: "BEST: B, GOOD: C, OK: D, WORST: A").  
  2. **Voting slips**: Blank slips for plurality/runoff; ranked ballots for IRV/Borda.  
  3. **Tally sheets** (for you): Track votes on a whiteboard.  
  4. **Random selector**: Dice or app to pick a "dictator" in the final round.  
  5. **Timer**: Keep rounds strict.  

  ---

  ### **Scoring System**  
  - **Utility points** (no real money):  
    - 1st choice = 4 pts  
    - 2nd choice = 3 pts  
    - 3rd choice = 2 pts  
    - 4th choice = 1 pt  
  - **Goal**: Maximize personal points. Students see how lying improves their score when their true favorite loses.  

  ---

  ### **Game Timeline (50 Minutes)**  

  | **Time** | **Activity** | **Instructor Actions** | **Student Actions** |
  |----------|--------------|------------------------|---------------------|
  | **0:00–0:05** | **Intro** | Explain the election scenario: "Clubs manipulated rankings to bury a favorite. Today, you’ll see why." Assign groups/preference cards. | Listen, receive cards. |
  | **0:05–0:15** | **Round 1: Plurality (Truthful)** | "Vote for your **top choice only**." Tally votes publicly. **Truthful outcome**: A wins (Group 2: 10 votes, Group 1: 0 for B, Group 3: 4 for C → A=10, B=0, C=4, D=0). Award points: Group 1 gets 1 pt (worst), Group 2 gets 4 pts, Group 3 gets 2 pts. | Vote truthfully. Groan as Group 1 gets worst outcome. |
  | **0:15–0:20** | **Round 2: Plurality (Strategic)** | "Now, discuss in groups: Can you change your vote to get a better outcome?" Hint: "Group 1, what if you abandon B?" Run revote. **Strategic outcome**: Group 1 switches to C (C=10+4=14, A=10). C wins. Award points: Group 1 now gets 3 pts (C is 2nd choice), Group 3 gets 4 pts. | Group 1 debates/realizes lying helps; others vote truthfully. |
  | **0:20–0:30** | **Round 3: IRV / Ranked Choice (Truthful → Strategic)** | **Truthful**: "Rank all candidates." Tally: Round 1 - A=10, B=0, C=4, D=0 → eliminate B/D. Round 2 - A=10, C=14 → C wins. **Then**: "Try lying." Hint to Group 2: "What if you rank D first to stop C?" **Strategic**: Group 2 ranks D > A > C > B. Round 1 - D=10, C=4, A=0 → eliminate A. Round 2 - D=10, C=14 → C still wins (no gain). **Now hint Group 1**: "Rank C first." Group 1 lies: C > B > D > A. Round 1 - C=14, A=10 → C wins immediately. Group 1 improves from 2nd choice (C) to 1st choice (B not elected, but they avoided A). | Struggle to manipulate IRV. Group 1 sees lying improves their outcome. |
  | **0:30–0:40** | **Round 4: Borda Count (Truthful → Strategic)** | **Truthful**: "Award 3 pts to 1st, 2 to 2nd, 1 to 3rd, 0 to 4th." Tally: B=10*0 + 10*1 + 4*3=22; A=10*3 + 10*0 + 4*0=30; C=10*2 + 10*0 + 4*3=32; D=10*1 + 10*2 + 4*0=30. **C wins**. **Strategic**: "Can you lie to help your group?" Hint to Group 2: "Bury C to boost A." Group 2 lies: A > D > B > C (downgrades C). New tally: C=10*2 + 4*3=32 → still wins. **Now hint Group 1**: "Inflate C, deflate A." Group 1 lies: C > B > D > A. New tally: C=10*3 + 4*3=42; A=30 → C wins. No gain (Group 1 still gets 2nd choice). **Reveal**: Borda is vulnerable but harder to manipulate—sometimes no incentive. | Experiment with rankings. Discover manipulation doesn’t always work, but often does. |
  | **0:40–0:43** | **Round 5: Random Dictatorship** | Randomly pick one student (e.g., draw names). Winner is their top choice. "No discussion or lying allowed—it won’t help." | One student’s preference decides. Others groan at powerlessness. |
  | **0:43–0:50** | **Debrief** | Use Q&A to connect to theory. Key points: | Discuss observations. |

  ---

  ### **Debrief Script**  
  **Map the game to theory**:  
  1. **Pattern they noticed**: In all rules except random dictatorship, lying helped someone:  
     - *Plurality*: Group 1 lied to elect C (2nd choice) and stop A (worst).  
     - *IRV*: Group 1 lied to ensure C won quickly (avoiding risk of A).  
     - *Borda*: Attempts failed here, but in general, Borda is manipulable (e.g., if Group 2 inflated D).  
     - *Random dictatorship*: No one lied because only one voter’s top choice matters—your vote is irrelevant unless you’re the dictator.  

  2. **Gibbard-Satterthwaite Theorem**:  
     - **What it says**: Any voting system with ≥3 options is either:  
       - **Manipulable** (voters can gain by lying),  
       - **Dictatorial** (one voter decides everything), or  
       - **Restricted** (only two choices exist).  
     - **What they experienced**: Plurality, IRV, and Borda are manipulable; random dictatorship is "non-manipulable" but dictatorial (though randomized, so no fixed dictator).  

  3. **Real-world link**:  
     - Your student senate election wasn’t a "moral failing"—it was **rational strategy** under manipulable rules (like plurality/IRV).  
     - **The escape hatch**: Random dictatorship is immune to manipulation but **nobody wants it** (too arbitrary, ignores majority will).  

  ---

  ### **What Will Go Sideways (and Fixes)**  
  1. **Students don’t realize lying helps**:  
     - *Risk*: Group 1 might not abandon B in plurality.  
     - *Fix*: Use hints ("What happens if all Group 1 votes go to C?"). If stuck, tally the strategic outcome yourself and show the point gain.  

  2. **Borda manipulation fails**:  
     - *Risk*: In Borda, lies may not change the winner (as in Round 4).  
     - *Fix*: Acknowledge this: "Sometimes lying doesn’t work—but the theorem says it’s *possible* under some preferences. Let’s see another example…" Share a quick hypothetical (e.g., if Group 2 inflated D, A might win).  

  3. **Time runs short**:  
     - *Risk*: Debrief gets cut off.  
     - *Fix*: Shorten Borda/IRV by skipping a revote. Use the whiteboard to simulate outcomes fast.  

  4. **Random dictatorship feels unfair**:  
     - *Risk*: Students protest the outcome.  
     - *Fix*: Lean in: "Yes! That’s why we avoid it—even though it’s ‘strategy-proof,’ it’s undemocratic."  

  ---

  ### **What the Game Can’t Replicate (Requires Your Input)**  
  - **The theorem’s generality**: Students see specific examples, but Gibbard-Satterthwaite proves manipulation is **always possible** in non-dictatorial systems. Say:  
    > "Today, you saw how lying could help in *these* scenarios. The theorem guarantees that for *any* non-dictatorial voting system, there’s *some* set of preferences where lying pays off—even if we didn’t hit it in Borda."  

  - **Why random dictatorship is the only escape**: The game shows it’s immune to manipulation, but you must clarify:  
    > "Random dictatorship is ‘strategy-proof’ because your vote only matters if you’re the random dictator—and then, truth-telling gets your top choice. But it violates a core democratic principle: the majority’s will."  

  ---

  ### **Flagged Issue**  
  - **Your statement**: *"everyone gets the same fixed set of ranked preferences"*  
    - **Problem**: Identical preferences remove conflict, so no incentive to lie.  
    - **Fix**: Use **heterogeneous groups** (as above) to create tension. This is core to the scenario.  

  --- 

  This game ensures students viscerally grasp why strategic voting happens and why no voting rule is perfect. It’s low-prep, discussion-driven, and ends with a lightbulb moment about real-world elections. Run it as written, and you’ll have students debating manipulation—not morals—by the debrief.
