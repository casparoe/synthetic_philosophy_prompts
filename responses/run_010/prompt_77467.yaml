  II. **Tractable Description Length (Non-Negotiable)**: The description length of a malign simulator hypothesis must not be prohibitively high. Specifically, the extra complexity of including a simulator and a malicious agent must not be so large that the prior weight becomes negligible compared to benign hypotheses. Motivation: If the malign hypothesis is too complex, then its prior weight is tiny and the argument fails. 

