  7. **Non-Negligible Prior Mass**: The argument requires that the prior mass on malign hypotheses is non-negligible. But what is non-negligible? This might be camp-specific: some might require a fixed fraction, others might require that it doesn't vanish as the data grows? (But note: in the limit, if the data is generated by a benign source, the posterior should concentrate there. The worry is about finite data.)

  8. **Malignity vs. Unreliability**: The hypothesis must not merely make the predictor unreliable, but must involve an agent that is actively gaining from the unreliability.

