  III. **Knowledge Channel (Non-Negotiable)**: There must be a plausible channel by which the simulated agent comes to know that it is being simulated and the algorithm of the predictor (or at least the fact that the predictor uses a description-length prior). Motivation: Without this knowledge, the agent cannot strategically manipulate. 

