  Hmm, the user is on a prize committee for an academic society dealing with a messy voting situation. They have nine members voting on four papers, but two members didn't read paper A and submitted incomplete ballots. This has caused disagreements about voting methods and interpretations of Arrow's theorem. They need a memo to resolve this year's winner and establish future rules.

  Looking at the ballots: four members ranked A>B>D>C, three ranked B>C>D>A, and two ranked C>D>B (missing A). Under their current plurality rule where unranked papers are treated as last, A wins with 4 first-place votes. But Borda count gives the win to B. And in Condorcet methods, treating the missing A as last makes D the Condorcet winner, while ignoring pairings with missing votes makes A the Condorcet winner. That's quite a mess!

  The user specifically wants me to address Arrow's theorem - clarifying that it applies to ranked ballots with complete preferences. With incomplete ballots, the theorem's assumptions don't hold. I should explain that Arrow's conditions (like IIA) might be violated regardless of method when preferences are incomplete.

  For the chair-proposal, I need to acknowledge the accountability argument while pointing out its risks - a single person's bias versus group deliberation. On approval voting, I should confirm it avoids Arrow's theorem since it uses binary choices, but note that it introduces other issues like strategic voting.

  The memo needs to be balanced and non-confrontational. I'll structure it with: a bottom-line decision (recommend Borda for this year with the ballots as-is), then sections on handling the missing ballots, explaining Arrow's theorem, evaluating the chair proposal, discussing approval voting, and future rule changes. I'll keep the tone collegial, focusing on procedural fairness and the society's values rather than declaring any method "correct." The key is to frame this as finding a reasonable path forward, not declaring a philosophical winner.
answer: |-
  ## MEMORANDUM  
  **TO:** Prize Committee Members  
  **FROM:** [Your Name], Committee Member  
  **SUBJECT:** Resolution on 2024 Prize Selection Procedure & Winner Determination  
  **DATE:** October 26, 2023  

  **BOTTOM LINE:** For this year's ballots, we will use the **Borda Count** method to determine the winner. Paper **B** wins under this rule. We **will not** reopen ballots or require the two members to read Paper A and revote. For future years, we propose adopting **Approval Voting** as our standard method, subject to committee vote.  

  ### I. Handling the 2024 Ballots & Determining the Winner
  1.  **The Problem:** Our current plurality rule (with unranked papers treated last) declares A the winner (4 first-place votes). However, this result is highly sensitive to how we interpret the two incomplete ballots (C > D > B, A missing). Different reasonable interpretations of those ballots lead to different winners under different methods (B wins Borda, D wins one Condorcet interpretation, A wins another Condorcet interpretation).
  2.  **Why Borda Count for 2024:**
      *   **Practicality:** The ballots are already cast. Reopening voting risks bias, delay, and unfairness to those who submitted complete ballots on time.
      *   **Handling Incompleteness:** Borda Count naturally incorporates partial rankings by assigning points only to ranked papers. Unranked papers receive 0 points. This is a standard and defensible approach for incomplete ballots, avoiding the ambiguity of trying to "fill in" the missing A (e.g., as last or unknown).
      *   **Result Clarity:** Applying Borda points (3 for 1st, 2 for 2nd, 1 for 3rd, 0 otherwise) to the submitted ballots:
          *   A: (4 members * 3 pts) + (3 members * 0 pts) + (2 members * 0 pts) = 12 pts
          *   B: (4 members * 2 pts) + (3 members * 3 pts) + (2 members * 1 pt) = 8 + 9 + 2 = 19 pts
          *   C: (4 members * 0 pts) + (3 members * 2 pts) + (2 members * 3 pts) = 0 + 6 + 6 = 12 pts
          *   D: (4 members * 1 pt) + (3 members * 1 pt) + (2 members * 2 pts) = 4 + 3 + 4 = 11 pts
      *   **Winner:** Paper **B** wins with 19 points.
  3.  **Why Not Re-ballot?** Requiring the two members to read A now, after others have voted and potentially discussed, introduces significant bias and procedural unfairness. It also delays our process unnecessarily. The submitted ballots reflect the information those members had *at the deadline*; we should respect that.

  ### II. Understanding Arrow's Theorem and Our Situation
  1.  **What Arrow's Theorem Says:** Arrow's Impossibility Theorem demonstrates that *no ranked voting system* can simultaneously satisfy all of the following seemingly reasonable criteria when there are 3 or more options:
      *   **Unrestricted Domain:** Any possible ranking by voters must be allowed.
      *   **Non-dictatorship:** No single voter dictates the outcome.
      *   **Pareto Efficiency:** If every voter prefers X over Y, then the group must prefer X over Y.
      *   **Independence of Irrelevant Alternatives (IIA):** The relative ranking of X vs. Y should depend *only* on voters' rankings of X vs. Y, not on their rankings of other alternatives (like Z).
  2.  **What Arrow's Theorem Does *Not* Say Here:**
      *   **It Doesn't Mean Aggregation is "Unprincipled":** It means no single method perfectly satisfies *all* desirable criteria simultaneously. Many methods (Borda, Condorcet, Plurality) are based on *different* principles and satisfy *different* subsets of desirable properties. Choosing a method is about prioritizing which principles matter most *to us*.
      *   **It Doesn't Directly Cover Incomplete Ballots:** Arrow's framework assumes complete preference rankings. Our problem is partly *caused* by the incomplete ballots violating the "Unrestricted Domain" assumption *in practice* (we don't have full rankings from everyone). This isn't "dodging" the theorem; it highlights that our *data* (the ballots) doesn't fully conform to the *model* Arrow analyzed. The ambiguity we see (D vs. A winning Condorcet depending on interpretation) is *precisely* the kind of difficulty that arises when data is missing – the IIA criterion becomes particularly hard to satisfy consistently when voters haven't ranked all pairs.
      *   **It Doesn't Imply Randomness or Chair Dictatorship are Better:** These are simply alternative (and generally less desirable) ways to break the deadlock imposed by the theorem's constraints.

  ### III. Evaluating the "Chair Decides" Proposal (Taken Seriously)
  The strongest argument for the chair deciding is **accountability and decisiveness**:
  *   **Accountability:** A single person makes a transparent, reasoned judgment call and bears responsibility for it. This avoids the perceived "facelessness" or "arbitrariness" of a complex voting method producing a controversial result.
  *   **Decisiveness:** It guarantees a timely decision without procedural wrangling over methods.
  *   **Nuance:** A chair might incorporate subtle qualitative judgments beyond what rankings capture.

  **Significant Downsides Remain:**
  1.  **Loss of Collective Wisdom:** It disregards the diverse expertise and perspectives of the entire committee, centralizing judgment in one person.
  2.  **Perceived Legitimacy:** The outcome may lack legitimacy in the eyes of members who disagree, potentially undermining the prize's prestige. The chair becomes a *literal* "dictator" in Arrow's formal sense, violating a core condition of the theorem *by design*.
  3.  **Bias Risk:** It concentrates potential for bias (conscious or unconscious) in one individual. The committee structure exists partly to mitigate this.
  4.  **Precedent:** Sets a concerning precedent where complex decisions default to authority rather than fair process.

  **Conclusion on Chair Decides:** While accountability is valuable, the downsides – loss of collective input, potential illegitimacy, and violation of the fundamental democratic principle of the committee – outweigh this benefit for a prize selection intended to represent the *society's* judgment.

  ### IV. Approval Voting: Does It Escape Arrow?
  1.  **Yes, Technically:** Arrow's theorem *strictly applies to systems that require voters to submit a complete or partial rank ordering of preferences*. Approval Voting (AV) asks voters for a simpler task: indicate which papers they find "acceptable" or "worthy" of the prize (binary choice for each paper). Since AV doesn't use ranked ballots, Arrow's theorem (which is about aggregating *rankings*) does not apply to it.
  2.  **But It Moves the Problem:**
      *   **Different Strategic Incentives:** AV introduces its own strategic complexities. Voters must decide their "approval threshold." Should they approve only their absolute top choice(s) or include others they find acceptable? The optimal strategy depends on guessing others' behavior. This can lead to insincere voting (e.g., not approving a liked paper for fear of hurting your favorite).
      *   **Information Loss:** AV captures less nuance than ranking. It doesn't distinguish between a voter's 1st and 2nd choice if both are approved, nor differentiate between disliked and hated papers if both are disapproved.
      *   **Susceptibility to Other Impossibilities:** While escaping Arrow, AV isn't perfect. It can violate the "Condorcet criterion" (electing a candidate that beats all others head-to-head) and is susceptible to the "No-Show Paradox" (a voter getting a better outcome by not voting). Gibbard's theorem shows that *all* non-dictatorial voting systems with 3+ options are susceptible to strategic voting, which includes AV.
      *   **"Center Squeeze":** Strong centrist candidates acceptable to many but no one's top favorite can win – this could be seen as desirable (broad acceptability) or undesirable (lacks passionate support). This relates to the point raised about D winning Condorcet but having no 1st-place votes.

  **Conclusion on AV:** Approval Voting *does* avoid Arrow's impossibility theorem because it uses a fundamentally different ballot type (binary approvals, not rankings). However, it introduces different strategic considerations and trade-offs in how preferences are aggregated. It doesn't make aggregation "perfect"; it changes the nature of the aggregation problem.

  ### V. Proposed Standing Rule Change: Approval Voting
  We propose adopting **Approval Voting** for future years, effective 2025:
  1.  **Addresses the Core Problem:** The main difficulty this year stemmed from incomplete rankings and ambiguity in interpreting them. AV sidesteps this entirely. Voters simply check boxes for each paper they deem prize-worthy. There is no "ranking" to leave incomplete. Papers not checked are implicitly disapproved. This is simple and unambiguous.
  2.  **Simplicity & Transparency:** Ballots are easy to cast and count. The rule ("most approvals wins") is exceptionally easy to understand and explain.
  3.  **Reduced Strategic Burden (in practice):** While strategy exists, the "sincere" strategy (approving all papers you find genuinely worthy) is often optimal or near-optimal, especially compared to the complexities of ranking strategy under methods like Borda.
  4.  **Focus on Acceptability:** For a "best paper" prize, identifying papers that a broad segment of the committee finds *excellent* (worthy of approval) may be more relevant than identifying a paper with intense #1 support from a minority but disapproval from others.
  5.  **Handles Incomplete Information Gracefully:** If a member hasn't read a paper, they simply do not approve it. There's no need to artificially rank it or leave gaps causing interpretation problems. Their vote only counts for papers they evaluated.

  ### VI. Verbal vs. Substantive Disagreements
  Some committee debate conflates distinct issues:
  1.  **"Arrow means aggregation is pointless" vs. "Arrow shows the challenge of perfect aggregation":** This is substantive. Arrow highlights inherent trade-offs, not futility. It *doesn't* mean we shouldn't seek the fairest practical method.
  2.  **"D has no first-place votes" as an absolute disqualifier:** This is partially verbal. "First-place votes" are specific to ranking methods. Under AV or a Condorcet method, broad acceptability or pairwise strength *are* the metrics. Insisting only 1st-place votes matter privileges Plurality/Ranking as the definition of "support." Substantively, the question is whether a paper can deserve the prize without being *anyone's* absolute favorite if it is widely seen as excellent (as D potentially was, finishing 3rd on 7 ballots and 2nd on 2).
  3.  **"Chair is accountable" vs. "Committee should decide":** This is a deep substantive disagreement about governance philosophy – individual expert judgment vs. collective democratic process. The memo argues the latter aligns better with the committee's purpose.

  ### VII. Summary & Path Forward
  1.  **2024 Winner:** Using **Borda Count** on the submitted ballots, Paper **B** wins.
  2.  **2024 Ballots:** Ballots are **final**. No re-voting.
  3.  **Future Method:** We propose adopting **Approval Voting** starting in 2025. We will formally vote on this rule change at next week's meeting.
  4.  **Meeting Goal:** Finalize the 2024 winner (B) per the Borda method applied to existing ballots. Vote on adopting Approval Voting for future years (2025 onwards). Discuss the reasoning outlined above.

  This approach resolves the immediate ambiguity fairly using a well-established method (Borda), respects the submitted ballots and deadline, and proposes a simpler, more robust method (Approval Voting) for the future that directly addresses the core issue of incomplete information and avoids the ranked-ballot impossibility highlighted by Arrow. I look forward to our discussion next Tuesday.
