prompt: |-
  I'm a program officer at a small family foundation — about $8m a year, mostly public health and goverance work in three countries — and I make something like 40 grant decisions a year with one junior analyst and no evaluation capacity beyond reading proposals and calling the occasional academic.

  Six months ago one of our two board members went down a rabbit hole on "consequentialist cluelessness": the argument that the indirect, knock-on effects of basically anything we fund are unknowable, and could easily be larger than the direct effects, so we can never actually tell whether a grant did good. He now stalls or blocks proposals on the grounds that we can't rule out the long-run stuff. The other board member's counter-proposal is a flat rule: if we can't estimate an indirect effect, assume the good and bad knock-ons cancel out and decide purely on the direct, measurable effects. I've been asked to write something the board can actually adopt, and honestly I dont know whether either position is coherent, or whether they're both half-right.

  So: can you write me a decision procedure I can run on a proposal in about 45 minutes, that my analyst could also run without any philosophy background — the questions in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it explicitly hands the call up to the board because it's a values question and not a fact question? It has to say what to do with indirect effects we're confident exist but can't size at all, and it has to take a position on the "assume they cancel" rule — either build it in with the conditions under which it's legitimate, or replace it with something better and tell me why mine is wrong. Flag the steps that are really judgment calls in procedural costume.

  Then run it on three live ones: (1) a radio campaign supporting a deworming program — direct effects estimable from the literature, plus a plausible but unquantifiable effect on clinic attendance and on local trust in health workers; (2) a grant to train and place 30 junior technocrats inside a finance ministry, where the direct benefit is small and the entire argument rests on who those people become and what they later decide; (3) a renewal for a bednet distribution partner that's clearly strong per dollar but whose country program may be crowding out a domestic manufacturer. I expect one of these to come out in a direction I won't like — I'd rather find out now than in front of the board.

  And finish with what the procedure can't do: the places where it's going to hand me confident-looking outputs that are just my priors with a checklist wrapped around them.
reasoning: |-
  We are designing a decision procedure that balances the need for practicality (45 minutes per proposal, runnable by a junior analyst) with the philosophical concerns raised by the board members. The procedure must address the problem of "consequentialist cluelessness" by providing a structured way to handle indirect effects.

  Key principles:
  1. We cannot spend excessive time on each proposal.
  2. We must have a clear stopping point for analysis and a way to flag when a decision requires board input (values vs. facts).
  3. We need to take a position on the "assume they cancel" rule.

  Proposed decision procedure:

  **Step 1: Identify and Classify Effects**
     - List all the direct effects of the grant. These are effects that are (a) intended and (b) measurable or estimable from existing literature or data.
     - List all the indirect effects that are (a) plausible (based on theory, evidence, or expert opinion) and (b) significant (if they occurred, they would matter). Classify each indirect effect as:
          - Positive (expected to increase the good)
          - Negative (expected to decrease the good)
          - Unknown (could be either, but we don't know)

     **Sufficiency**: For direct effects, we require at least one study or reasonable estimation method (e.g., from a similar context) to provide a quantitative or strong qualitative estimate. For indirect effects, we require at least a plausible mechanism (a causal story) and a source (e.g., expert opinion, theory, or a case study) to consider them.

     **Stopping condition**: If there are no direct effects that can be estimated (or if the direct effects are negligible), then stop and recommend rejection. (But note: in some cases, like the technocrat training, the direct effects are small and the entire argument is indirect. We'll handle that in Step 2.)

  **Step 2: Assess Direct Effects**
     - For the direct effects, estimate the magnitude of the benefit (and harm, if any) in terms of the foundation's goals (e.g., lives saved, governance improvements). Use the best available evidence. If the direct effects are clearly negative, stop and recommend rejection.

     **Sufficiency**: We require a quantitative estimate (even if approximate) or a strong qualitative case (e.g., "this is a best practice and has been shown to work in similar settings") for the direct effects. If the direct effects are positive and substantial, proceed. If they are positive but small, then we must rely more on the indirect effects.

     **Stopping condition**: If the direct effects are negative, reject. If they are positive and large enough to justify the grant without considering indirect effects (i.e., they meet our internal bar for cost-effectiveness), then we can provisionally accept without considering indirect effects (unless there are very strong reasons to worry about indirect harms). But if the direct effects are positive but marginal, then we must consider indirect effects.

  **Step 3: Assess Indirect Effects**
     - For each indirect effect identified in Step 1, we assign a confidence level and a sign (positive, negative, unknown) and ask: 
          a) How confident are we that this effect will occur? (High, Medium, Low)
          b) If it occurs, how large could it be relative to the direct effects? (Order of magnitude: e.g., similar, 10x, 100x, negligible)

     We then consider:
          - If there is a high-confidence, large negative indirect effect, we must consider rejection unless there is an equally large high-confidence positive indirect effect to offset it.
          - If there is a high-confidence, large positive indirect effect, it might tip the balance in favor.

     **The "Assume They Cancel" Rule**: We adopt the rule that if an indirect effect is of unknown sign (we cannot tell if it's positive or negative) or if we have no idea about its magnitude, then we ignore it. For indirect effects that we can assign a sign (positive or negative) but cannot estimate the magnitude, we use the following rule: 
          - If we have at least one indirect effect that we are confident is positive and at least one that we are confident is negative, and we have no reason to think one is systematically larger than the other, then we can assume they cancel out and focus on the direct effects.

     However, if we have a strong reason to believe that the positive and negative effects do not cancel (e.g., one is likely to be much larger, or they are of a different nature that we value differently), then we must flag this as a judgment call and send it to the board.

     **Sufficiency**: We require at least a qualitative argument for the sign and a rough sense of the magnitude (even if only "small", "moderate", or "large"). If we cannot assign a sign, we drop the effect from consideration.

     **Stopping conditions**:
          - If there is a high-confidence, large negative indirect effect that is not offset by any positive indirect effect of similar magnitude, then reject.
          - If the direct effects are marginal and there are no strong positive indirect effects, then reject.

     **Handoff to board**: If there are indirect effects that we believe are significant (either positive or negative) and we cannot assign a magnitude (even roughly) but we are confident of the sign, and these effects are critical to the overall assessment (i.e., without them the grant is marginal), then we must hand the decision to the board. The board must then make a value judgment on how much weight to give to these unquantifiable effects.

  **Step 4: Overall Assessment**
     - Combine the direct and indirect effects. The grant is recommended for approval if:
          a) The direct effects are positive and large enough to meet our bar, and there are no major unmitigated negative indirect effects; OR
          b) The direct effects are positive (even if not meeting the bar alone) but the indirect effects (positive) are such that the overall expected impact is positive and substantial.

     - If the grant is marginal (close call) or relies heavily on unquantifiable indirect effects, then we flag it for board discussion.

  **Step 5: Document and Flag Judgments**
     - Explicitly note which steps involved judgment calls (e.g., assigning confidence to an indirect effect, or deciding that an effect is "large" relative to direct effects). These are the places where the procedure is wearing a "procedural costume" but is actually relying on the analyst's priors.

  Now, let's apply this procedure to the three examples.

  ---

  **Example 1: Radio campaign supporting a deworming program**

  Step 1: Identify and Classify Effects
     - Direct effects: Increased deworming treatment uptake (measurable from literature). 
     - Indirect effects: 
          a) Increased clinic attendance for other reasons (plausible, positive) 
          b) Increased trust in health workers (plausible, positive) 
          c) Potential for misinformation or overburdening clinics (plausible, negative? but in this case, we have no evidence of this)

     We classify (a) and (b) as positive, (c) as unknown (we have no reason to think it's negative, but it's a possibility). Since (c) is unknown and we have no evidence, we drop it.

  Step 2: Assess Direct Effects
     - Direct effects: Strong evidence from literature (e.g., the famous deworming studies) that deworming has large benefits (improved school attendance, long-term earnings). The radio campaign is expected to increase uptake by X%, so the direct effects are positive and large.

     Since the direct effects are large, we can proceed without needing to rely on indirect effects.

  Step 3: Assess Indirect Effects
     - We have two positive indirect effects. We are confident they will occur (high confidence) but cannot quantify them. However, they are both positive and no negative effects of similar confidence. Therefore, they only add to the positive case. We do not need to quantify them because the direct effects are already strong.

  Step 4: Overall Assessment: Recommend approval.

  ---

  **Example 2: Grant to train and place 30 junior technocrats inside a finance ministry**

  Step 1: Identify and Classify Effects
     - Direct effects: 30 people trained and placed. This is a small direct effect (we are training 30 people, but the benefit to the foundation's goals is negligible at this stage).
     - Indirect effects: 
          a) These individuals may rise to positions of influence and make better decisions (plausible, positive) 
          b) They may form a network that improves governance (positive) 
          c) They might be corrupted or become part of a problematic system (negative) 
          d) Opportunity cost: we are training them in a specific way that might not be optimal (negative? but unknown)

     We classify (a) and (b) as positive, (c) as negative, (d) as unknown (drop).

  Step 2: Assess Direct Effects
     - Direct effects are small (only the training and placement). They are positive but not sufficient to justify the grant on their own. We must rely on indirect effects.

  Step 3: Assess Indirect Effects
     - We have:
          Positive: (a) and (b) - we are confident they will occur? Actually, we are not highly confident because it depends on many factors (will they rise? will they remain committed?). Let's say medium confidence. Magnitude: if they rise, the impact could be very large (e.g., reforming a ministry) but also might be zero. So, large potential but uncertain.
          Negative: (c) - we are not very confident (low to medium) and the magnitude is unknown. But if it happens, it could be negative (but likely not catastrophic).

     We cannot quantify any of these. We have both positive and negative indirect effects. Can we assume they cancel? Not really, because the positive effects (if they occur) are expected to be much larger (by the theory of change) than the negative. But this is a judgment.

     Since we cannot quantify and the direct effects are small, we must hand this to the board because the decision hinges on the value we place on the potential positive indirect effects versus the risk of negative ones.

  Step 4: Overall Assessment: Hand to board. The procedure stops and we document that the decision requires a value judgment on the potential long-term effects.

  ---

  **Example 3: Renewal for a bednet distribution partner in a country where it may be crowding out a domestic manufacturer**

  Step 1: Identify and Classify Effects
     - Direct effects: Distribution of bednets, leading to reduced malaria cases (well-established, large positive).
     - Indirect effects: 
          a) Crowding out of a domestic manufacturer (plausible, negative) -> if true, this could harm the local economy and long-term sustainability.
          b) Potential to stimulate local manufacturing if the partner sources locally? (positive, but in this case, we are told they are not, so we focus on the negative).

     We classify (a) as negative.

  Step 2: Assess Direct Effects
     - Direct effects are positive and large (per dollar, bednets are a very effective intervention). So we proceed.

  Step 3: Assess Indirect Effects
     - Negative effect (a): We are confident that crowding out exists? We need to check: is there evidence that the domestic manufacturer is being harmed? If we have reports or studies, then we can assign a confidence. Let's assume we have medium confidence (based on some evidence) that crowding out is happening. 
     - Magnitude: How bad is the crowding out? We don't know. It could be small (the manufacturer loses a little market share) or large (they go out of business, leading to job losses and reduced capacity to respond to future malaria outbreaks). 

     Since we have a negative indirect effect and we are at least medium confidence it exists, we must consider it. We cannot quantify it, but we know it's negative. There is no positive indirect effect to cancel it (unless we find one, but in this case we don't). 

     The direct effects are large and positive. The negative indirect effect is of unknown magnitude. How do we weigh them?

     We have two options:
          - If we can argue that the negative effect is small (e.g., the domestic manufacturer is small and the job losses are minimal compared to the lives saved by the bednets), then we might still proceed.
          - But if we think the negative effect could be large (e.g., undermining the entire local bednet industry, which might be critical for long-term sustainability), then we might reject.

     Since we cannot quantify, we must make a judgment: is the negative effect likely to be trivial compared to the direct benefits? If we think it's non-trivial, then we have to hand it to the board because we are comparing lives saved (direct) versus economic harm (indirect) and possibly long-term health system sustainability. This is a value judgment.

     Let's assume we cannot determine the magnitude. Then we hand it to the board.

  Step 4: Overall Assessment: Hand to board. The grant is strong on direct effects but has a plausible negative indirect effect of unknown magnitude. The board must decide whether the potential harm is worth the direct benefit.

  ---

  **What the procedure can't do (Limitations):**

  1. **Hidden priors**: The procedure relies on the analyst's judgment at several points, especially in Step 3 (assigning confidence and relative magnitude to indirect effects). An analyst who is optimistic might assign high confidence to positive indirect effects and low confidence to negative ones, and vice versa. The checklist may just formalize these biases.

  2. **Complex interactions**: When multiple indirect effects interact (e.g., one positive effect causing a negative effect), the procedure does not have a way to model that.

  3. **Long-term and existential risks**: The procedure does not have a special way to handle effects that are low probability but catastrophic (like a grant that might inadvertently contribute to a pandemic). We would need an additional step for such risks.

  4. **Value trade-offs**: The procedure hands off to the board when there are unquantifiable effects that are critical, but the board might not have a clear framework either. The procedure does not resolve the underlying philosophical problem; it only structures the decision to the point where the value judgment is explicit.

  5. **The "assume they cancel" rule**: This rule is applied only when there are both positive and negative indirect effects and we have no reason to think one dominates. But in practice, it's rare that we are so symmetrically uncertain. The rule might lead us to ignore important effects that don't have an obvious countervailing effect.

  Despite these limitations, the procedure provides a structured, time-bound way to make grant decisions that explicitly addresses the board's concerns about indirect effects and avoids paralysis by analysis.
answer: |-
  Below is a practical decision procedure designed to handle indirect effects within your operational constraints. It incorporates elements of both board members' positions while providing clear guardrails. The procedure is structured as a flowchart-like checklist with time-boxed steps (total 45 minutes), written for a junior analyst with no philosophy background. Judgment calls are explicitly flagged.

  ---

  ### **Grant Decision Procedure: Handling Indirect Effects**
  **Time Budget:** 45 minutes per proposal  
  **Goal:** Decide whether to fund/reject or escalate to the board.  
  **Core Rule on Indirect Effects:** *Do not assume unquantifiable effects cancel out.* Instead, treat them as "swing factors" that only matter when direct effects are marginal. Escalate to the board if unquantifiable effects could plausibly reverse the decision.

  #### **Step 1: Map Effects (10 min)**  
  **Question:** *What are the DIRECT and INDIRECT effects?*  
  - **DIRECT:** Outcomes immediately caused by the grant (e.g., bednets distributed, people trained).  
  - **INDIRECT:** Knock-on effects beyond the grant’s immediate scope (e.g., changed community trust, market distortions).  
  **Sufficient Answer:**  
    - List 1–3 direct effects with evidence (e.g., study citations).  
    - List 1–3 indirect effects with a *plausible mechanism* (e.g., "Radio ads → increased trust → future clinic visits" is plausible; "Radio ads → alienating farmers" is not without evidence).  
  **Stop/Reject if:**  
    - Direct effects are unmeasurable *and* unsupported by literature.  
  **Escalate to Board if:**  
    - Indirect effects are central to the proposal’s case (e.g., >50% of claimed impact depends on them).  

  #### **Step 2: Score Direct Effects (15 min)**  
  **Question:** *How strong are the DIRECT effects per dollar?*  
  **Method:**  
    - Use existing evidence (studies, past grants) to assign:  
      - **Magnitude:** High/Medium/Low (vs. foundation’s typical grants).  
      - **Certainty:** High (multiple RCTs) / Medium (observational data) / Low (expert opinion only).  
  **Sufficient Answer:**  
    - A clear Magnitude/Certainty score (e.g., "High magnitude, medium certainty").  
  **Stop/Reject if:**  
    - Magnitude is "Low" *and* Certainty is "Low."  
  **Escalate to Board if:**  
    - Magnitude is "High" but Certainty is "Low" (values judgment on risk tolerance).  

  #### **Step 3: Assess Indirect Effects (15 min)**  
  **Question:** *Could any INDIRECT effect reverse the DIRECT net benefit?*  
  **Method:**  
    - For each indirect effect, answer:  
      1. **Direction:** Is it net positive/negative/ambiguous?  
      2. **Scale Relative to Direct Effects:**  
         - Trivial (<10% of direct effects)  
         - Moderate (10–100%)  
         - Potentially dominant (>100%)  
      3. **Evidence Base:**  
         - Strong (data from similar contexts)  
         - Theoretical (plausible mechanism only)  
         - None  
  **Decision Rules:**  
    - **If indirect effects are trivial/ambiguous:** Ignore. Decide on direct effects.  
    - **If indirect effects are moderate/dominant and direction is clear:**  
      - If net **positive** and direct effects are at least "Medium magnitude + Medium certainty," **APPROVE**.  
      - If net **negative** and direct effects are not "High magnitude + High certainty," **REJECT**.  
    - **If scale/direction is unquantifiable but could be dominant (e.g., long-term political effects):** Escalate to board.  
  **Escalate to Board if:**  
    - Unquantifiable indirect effects could plausibly dominate *and* direct effects are marginal (e.g., Medium/Low magnitude).  

  #### **Step 4: Final Call (5 min)**  
  **Question:** *Is the net impact clearly positive?*  
  - **APPROVE** if: Direct effects are strong (High/High or High/Medium) AND no unmitigated dominant negative indirect effects.  
  - **REJECT** if: Direct effects are weak OR dominant negative indirect effects exist.  
  - **ESCALATE** if: Unquantifiable indirect effects could swing the outcome (per Step 3).  

  ---

  ### **Why This Replaces the "Assume They Cancel" Rule**  
  The board member’s "cancel out" rule is rejected here because:  
  1. **Asymmetric Risks:** Negative indirect effects (e.g., market distortions) often scale differently than positives (e.g., trust gains).  
  2. **Accountability:** Assuming cancellation ignores tail risks (e.g., small chance of catastrophic harm).  
  3. **Procedural Safeguard:** Unquantifiable effects only matter when direct impacts are weak, forcing explicit board engagement.  

  ---

  ### **Application to Live Examples**  
  #### **1. Radio Campaign for Deworming**  
  - **Step 1:**  
    - *Direct:* Increased deworming uptake (measurable via literature).  
    - *Indirect:* ↑ clinic attendance (positive, plausible), ↑ trust in health workers (positive, plausible).  
  - **Step 2:** Direct effects = **High magnitude** (evidence: deworming RCTs), **High certainty**.  
  - **Step 3:** Indirect effects = Positive but unquantifiable. Scale likely **moderate** (<100% of direct effects).  
  - **Step 4:** **APPROVE.** Direct effects strong; indirect effects additive but not decision-critical.  

  #### **2. Training Junior Technocrats**  
  - **Step 1:**  
    - *Direct:* 30 people trained (Low magnitude).  
    - *Indirect:* Future policy influence (potentially dominant positive), risk of reinforcing bureaucracy (unquantifiable negative).  
  - **Step 2:** Direct effects = **Low magnitude**, **Medium certainty** (training outcomes measurable).  
  - **Step 3:** Indirect effects = **Potentially dominant** but unquantifiable. Central to proposal (>50% of impact).  
  - **Step 4:** **ESCALATE TO BOARD.** Hinges entirely on unquantifiable indirect effects; direct effects weak.  

  #### **3. Bednet Distribution (Crowding Out Risk)**  
  - **Step 1:**  
    - *Direct:* Bednets distributed → ↓ malaria (High magnitude/certainty).  
    - *Indirect:* Crowding out domestic manufacturer (negative, plausible).  
  - **Step 2:** Direct effects = **High magnitude**, **High certainty**.  
  - **Step 3:** Indirect effect = Negative. Scale unquantifiable but **potentially dominant** (could collapse local industry).  
  - **Step 4:** **ESCALATE TO BOARD.** Strong direct effects, but unquantifiable negative indirect effect could dominate long-term. *You expected one "unlikable" outcome—here it is.*  

  ---

  ### **What the Procedure Can’t Do: Hidden Biases and Limits**  
  This system masks two types of subjective judgments:  
  1. **Step 3 (Scale Assessment):** Classifying indirect effects as "trivial" vs. "dominant" relies on analyst priors (e.g., is "crowding out" 10% or 200% of direct impact?).  
  2. **Step 2 (Certainty Scoring):** Judgment calls on evidence quality (e.g., valuing a single RCT vs. expert consensus).  

  **Critical Limitations:**  
  - **False Confidence:** Strong direct effects (e.g., bednets) can override plausible catastrophic risks (e.g., trade policy collapse).  
  - **Temporal Blindness:** Long-term effects (>10 years) are systematically undervalued.  
  - **Zero-Sum Errors:** Fails when indirect effects are non-linear (e.g., trust gains enabling future programs).  

  **Recommendation:** Pair this with an annual "indirect effects review" of past grants (e.g., interview stakeholders in funded countries for emergent effects) to calibrate future judgments.  

  ---  
  This procedure forces rigor on measurable outcomes while reserving unquantifiable uncertainties for board deliberation. It rejects both absolute cluelessness ("we can never know") and naive cancellation ("assume net zero"), instead treating indirect effects as tiebreakers in marginal cases.
