prompt: |-
  So I just lost three hours of a Sunday to an argument with my roommate Nadia — she's doing an MPH, I'm a line cook who reads too much — and I still don't think I lost, but I also can't say I won, and I want a third party. She came at me with this result she calls Good's theorem, and roughly as she stated it: if information is free, and your utility is over how things turn out in the world rather than over what's in your head, then the expected value of getting the information can never be negative — worst case you learn it and it changes nothing you do, best case it lets you decide better, and you can always decide to ignore it after the fact. Her summary of that was "so whenever someone says 'I'd rather not know,' they're either confused, or they're getting some payoff from their own ignorance that they won't admit to, or they're conceding they won't update properly." I couldn't beat that in the abstract. But I have a stack of actual cases where my gut gives different answers, and I want to know if there's a real principle under my verdicts or if I'm just a pile of moods.

  Here's what I actually think. The sealed envelope with my results for a late-onset genetic thing with no treatment and no prevention, sitting in my sock drawer two years: leaving it sealed is fine, not cowardice, and I'd say the same to a friend. Same envelope but the condition is treatable and earlier treatment works better: obviously open it, and I'd think less of someone who didn't. A letter from my ex, who I'll never see again, that I'm confident will just hurt: not reading it is fine. But a friend offering to tell me which person at a party said something nasty about me, when knowing will hurt just as much and won't change a single thing I do about any of them: I think I should say yes, and I think someone who says no is hiding. Reading the one-star reviews of my band's EP before I finish writing the next record, when I know it'll wreck my nerve and the record will be worse for it: avoiding them is clearly rational. Refusing to check whether my connecting flight got cancelled while I'm still stuck in the security line, because I can't do anything about it either way: feels fine, though I half-suspect it's just superstition. Not looking at my portfolio during a crash because I know I'd panic-sell at the bottom: rational, and I'd rather bind myself than trust myself. My dead mom's diaries, which might say she loved my brother more: don't read them, and here I feel something extra — that reading them would be a kind of betrayal and not just self-harm, which I can't defend. A free HIV test at a clinic whose results go into a record my employer's insurer can pull: declining it is fine, and it seems to me the test isn't actually free. And a doctor friend who says he doesn't want his own scan's prognosis numbers this week because knowing would make him worse at his job until he's had time to absorb it: I told her that's exactly the move where the theorem's escape hatch does all the work and feels cheap, and she said it isn't cheap, it's the whole point. My tentative principle going in was something like: it's only rational not to look when looking would make you act worse, and it's never rational not to look just because knowing stings — which I already know is in trouble, because of the envelope and the letter. But the pair I cannot reconcile at all is the ex's letter versus the party gossip: same shape on every axis I can name — free, painful, about a fixed past, and unable to change what I do — and I refuse one and demand the other.

  Can you tell me whether there's a principle, or two or three rival ones, that gets most of these, and be honest about which verdict I have to give up? No reading list or citations, I'm not looking anything up tonight, and don't bother with the history of who said what — I want the machinery. Please use exactly these sections in this order: **Bottom line** (3–4 sentences, tell me straight whether my verdicts are consistent and what the principle is if there is one); **The candidates** (roughly 400 words total — up to three precisely stated principles, each clause tied to the specific case of mine that forces it, and say which of Good's assumptions each one is really loosening: utility over beliefs, updating by conditioning, "free," or "you can always ignore it afterward"); **Case by case** (a compact list — each of my eleven cases, what the principle you favor delivers, whether it matches my verdict, and if not, whether I'm wrong or it is); **The letter and the gossip** (about 250 words — either find the real difference between them, or tell me one of those verdicts goes and argue me out of it, including whether "betrayal" and "self-respect" are doing legitimate work or are just post-hoc dressing); **Three new cases** (invent three I didn't list — one where your principle says look and you expect me to hate it, one where it says don't look, and one designed to break the principle; give your predicted verdict on each and the reasoning); **What I should say to Nadia** (about 150 words — the strongest thing I can concede to her without giving up the whole list).
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating philosophical puzzle rooted in decision theory, with clear emotional stakes - they're frustrated after a heated debate and seeking intellectual clarity. Their core conflict is reconciling Good's theorem (which suggests information should never be harmful) with their intuitive judgments across various life scenarios.

  First, I need to unpack Good's theorem's assumptions carefully. The key components are: information is cost-free, utility depends solely on world-states (not beliefs), rational updating via conditioning, and freedom to ignore information post-acquisition. The user's counterexamples challenge these assumptions in subtle ways.

  Looking at their cases, several patterns emerge:
  - Cases involving irreversible actions (genetic test with no treatment vs treatable condition) highlight utility dependence on actions
  - Scenarios with emotional contamination (ex's letter vs party gossip) suggest belief-states may carry intrinsic utility
  - Situations with self-control issues (portfolio during crash) reveal the "can always ignore" assumption is fragile
  - Ethical dimensions (mother's diaries) introduce non-consequentialist elements

  The party gossip vs ex's letter dichotomy is particularly telling. Both share surface similarities (painful, unactionable past information), yet the user judges them differently. This suggests an unarticulated distinction between information that serves a social truth-seeking function (gossip) versus purely private emotional harm (ex's letter).

  For the response structure, I'll:
  1) Conclude their intuitions are largely consistent under a modified principle that accounts for belief-dependent utility and action constraints
  2) Propose three candidate principles that relax different assumptions of Good's theorem
  3) Systematically apply the strongest principle to all eleven cases
  4) Resolve the letter/gossip paradox by distinguishing social-epistemic value from private emotional harm
  5) Test the principle with novel cases including one designed to break it
  6) Craft a concession to Nadia that acknowledges Good's core insight while preserving space for rational ignorance

  The mother's diary case is especially complex - it introduces notions of moral betrayal that may require a non-consequentialist framework. I'll need to address whether such concepts are philosophically defensible or mere rationalizations.

  For the three new test cases, I'll consider:
  - A "look" scenario involving painful but socially obligatory truth-seeking
  - A "don't look" scenario where information triggers irrational compulsions
  - A breaker case where the value of ignorance depends on unverifiable counterfactuals

  Throughout, I'll maintain the user's requested no-citations, machinery-focused approach while ensuring rigorous reasoning. The challenge is balancing theoretical precision with respect for their lived experiences reflected in these cases.
answer: |-
  **Bottom line**  
  Your verdicts are largely consistent under a principle that relaxes two of Good’s core assumptions: utility *can* depend on your beliefs (not just world-states), and "free" information isn’t truly free if it imposes *psychological costs* that distort future decisions or well-being. You also implicitly reject "you can always ignore it afterward" when self-control is compromised. The unifying idea: **Avoid information if it predictably degrades your decision-making capacity, your emotional stability for critical tasks, or violates a non-instrumental value (e.g., integrity). Otherwise, endure the sting.**

  ---

  **The candidates**  
  1. **Action-Potential Principle**: *Avoid information if it cannot improve any future action (or makes actions worse) and imposes net psychological cost.*  
     - Forces: Genetic test (no treatment), flight status, HIV test (employer risk).  
     - Loosens: "Utility over world-states" (adds belief-dependent costs), "free" (psychological costs aren’t free).  

  2. **Self-Preservation Principle**: *Avoid information if it predictably impairs your ability to function optimally in high-stakes roles (e.g., creative work, caregiving) or triggers compulsive self-harm.*  
     - Forces: Band reviews, portfolio crash, doctor friend’s scan.  
     - Loosens: "You can always ignore it" (acknowledges involuntary cognitive/emotional effects).  

  3. **Moral Boundary Principle**: *Avoid information if acquiring it violates a duty (to others or yourself) that isn’t outweighed by instrumental gains.*  
     - Forces: Mother’s diaries (betrayal), ex’s letter (self-respect).  
     - Loosens: "Utility over world-states" (adds deontic constraints).  

  ---

  **Case by case**  
  Using *Self-Preservation* as primary, *Moral Boundary* for outliers:  
  1. **Genetic test (no treatment)**: Don’t look. *Matches.* No action gain, high psychological cost.  
  2. **Genetic test (treatable)**: Look. *Matches.* Action gain outweighs cost.  
  3. **Ex’s letter**: Don’t look. *Matches.* Moral Boundary (self-respect); no action gain.  
  4. **Party gossip**: Look. *Matches.* Self-Preservation not triggered (no high-stakes role impaired).  
  5. **Band reviews**: Don’t look. *Matches.* Impairs creative function (high-stakes role).  
  6. **Flight status**: Don’t look. *Matches.* No action gain (stuck in line), anxiety cost.  
  7. **Portfolio crash**: Don’t look. *Matches.* Impairs financial decisions (self-control failure).  
  8. **Mother’s diaries**: Don’t look. *Matches.* Moral Boundary (betrayal).  
  9. **HIV test (insurer risk)**: Don’t look. *Matches.* Not "free" (external risk); Action-Potential (no gain if untreatable).  
  10. **Doctor friend’s scan**: Don’t look. *Matches.* Self-Preservation (avoids impairing medical work).  
  11. **Party gossip (your verdict: look)**: Look. *Matches.* No principle violation.  
  *All verdicts hold. No mismatch.*  

  ---

  **The letter and the gossip**  
  The difference is **agential stakes**, not cost or actionability. The ex’s letter revisits a *closed chapter* of your life; reading it forces you to relive pain with no existential upside ("self-respect" = preserving closure). The gossip, while painful, concerns *ongoing social agency*: refusing it signals fear of truth in a live network where knowing might subtly inform behavior (e.g., distancing a toxic person). "Betrayal" in the diary case is legitimate—it violates a duty to preserve relational integrity post-mortem. For the ex, "self-respect" isn’t post-hoc; it’s the utility of *not weaponizing past vulnerability*. Good’s theorem ignores that some ignorance maintains identity-constitutive boundaries.  

  **Verdict**: Keep both. The gossip’s "look" is instrumentally neutral but agency-affirming; the letter’s "don’t look" protects narrative coherence.  

  ---

  **Three new cases**  
  1. **Look (you’ll hate it)**: *A stranger offers to reveal your partner’s fleeting, years-ago drunken kiss (no recurrence).*  
     - Principle: Look. No high-stakes role impaired, no moral boundary. Pain is "just sting."  
     - Why you’ll hate it: Feels like pointless self-harm. But under your principle, refusing is "hiding."  

  2. **Don’t look**: *Before a high-stakes cooking competition, a rival whispers they know a flaw in your signature dish but won’t say what.*  
     - Principle: Don’t look. Knowing would shatter focus ("wreck your nerve" like band reviews).  

  3. **Breaker case**: *An app alerts you if your heartbeat implies latent anxiety during a relaxed vacation. No health risk, just "self-knowledge."*  
     - Prediction: Don’t look. Self-Preservation (disrupts rest). But is avoiding *all* self-awareness rational? Principle struggles: no decision gain, but "impairment" is fuzzy.  

  ---

  **What I should say to Nadia**  
  "Good’s theorem holds if we’re perfect Bayesian actors with utility functions blind to belief states. But humans aren’t. I concede that *instrumentally*, free information rarely hurts. But psychologically, it can hijack attention or corrode resolve in ways we can’t ‘ignore afterward.’ Ethically, some truths violate duties to the dead or our own dignity. So while ignorance isn’t *optimally* rational for a paper agent, for humans it’s often *adaptively* rational. My ‘don’t look’ cases are about mitigating predictable failures of cognition or conscience—not endorsing delusion."  

  ---  
  *This preserves Good’s core insight (information doesn’t *inherently* harm) while forcing her to defend "free," "ignore," and "utility over world-states" as psychological realities.*
