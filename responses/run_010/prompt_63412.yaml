prompt: |-
  I am Head of Collections Care at a municipal museum of applied art and historical science, and I need a written decision procedure for a question that reaches us several times a month but that we currently settle by instinct. Our accession register, our insurance schedule, our loan agreements and our gallery labels all rest on claims of the form "this is the same object we acquired in 1931", and after decades of repair, consolidation, replacement, dismantling and reassembly such claims are frequently questionable. Our informal practice is a rule I inherited and now distrust: an object survives so long as more than half of its original material, measured by mass, remains present. I can see at least three defects in it. Mass is the wrong kind of measure. It says nothing whatever about an object whose every part was replaced one at a time over a century. And it silently assumes that "same object" means one thing, when in fact we ask it in three distinct registers: for insurance and indemnity, for attribution and authorship, and for what may truthfully be printed on a label or asserted in a loan agreement.

  Please convert what the philosophy of material constitution genuinely offers — the sortal-relativity of identity claims, the dominant-kind view, the closest-continuer approach, the four-dimensionalist option of treating an object as extended across time rather than wholly present at it, and the difficulty that arises when two candidate objects coincide in one place at one moment — into a procedure that conservators and registrars with no philosophical training can run. It should be a numbered sequence of questions, each with a stated sufficient answer; it should identify the point at which it terminates in "the object recorded under this accession number no longer exists: close the record and open a new one"; it should identify the point at which it terminates in "this is a question of institutional policy or of value, not of fact: refer it to the Director and the trustees"; and it should say candidly which steps are judgement calls dressed as procedure. We allow a fortnight per case and the reasoning must fit on a single sheet, so the instrument has to be short enough to run inside those constraints.

  We are also introducing an Object Continuity Ledger, recording for each intervention the component affected, the proportion of that component's material replaced, whether the intervention was reversible, and whether the removed matter was retained in store. Specify what further fields the ledger must carry if your procedure is to be runnable from it at all.

  Then run the procedure on three live cases.

  Case A. An eighteenth-century longcase regulator by a provincial maker, accessioned complete in 1931. Every component of the movement except the frame plates and one wheel has since been replaced, at intervals, by successive curators; each removed part was retained, and together the stored parts suffice to reassemble the movement as it stood in 1931. The case, dial and finial are original. The clock is on open display and runs. A donor-restricted bequest attaches to the regulator as acquired, and a planned redisplay would exhibit the running clock and the reassembled 1931 movement side by side.

  Case B. A kinetic light installation of the 1960s, acquired in 1979 under a certificate from the artist's estate authorising substitution of components as they become obsolete or unserviceable, provided each substitution is recorded. Eleven substitutions have been made. The last component dating from original manufacture — a drive motor — failed this year and a functionally equivalent motor has been fitted. We must now tell an indemnifying lender what proportion of the work is original and whether the work itself survives.

  Case C. A fragmentary ceramic vessel excavated in the 1920s and acquired by us in 1954. Roughly two-fifths of the wall is ancient; the remainder is modern fill, painted to match. It has been dismantled and reassembled twice, and each reassembly introduced further new fill. An external institution proposes to borrow it on condition that the accompanying label describes it as an original vessel of its period, and my registrar wants to know whether that sentence would be true.

  In at least one of these three I expect an answer I shall not like; I would far rather the procedure say so plainly than find a route around it, so please do not soften the verdict where the verdict is unwelcome. Where the three registers come apart — where the answer for insurance is not the answer for the label — say so explicitly and state which of them governs the accession number itself.

  Finally, set out what the procedure cannot do: the classes of object and intervention it will misclassify, the disputes it leaves untouched, and the points at which a well-run museum must simply make a choice and record that it has done so.
reasoning: |-
  We are designing a decision procedure for object identity that draws from philosophical concepts but is practical for museum professionals. The procedure must handle cases in three registers: insurance/indemnity, attribution/authorship, and labeling/agreements. We recognize that identity is sortal-relative and may differ across contexts.

  The procedure will be a numbered list of questions. It must terminate in one of two ways: 
  1. The object no longer exists: close the accession record and open a new one.
  2. The question is one of institutional policy or value: refer to the Director and trustees.

  We also note that some steps are judgment calls and we must be candid about that.

  Additionally, we are introducing an Object Continuity Ledger that records for each intervention: 
  - Component affected
  - Proportion of that component's material replaced
  - Whether the intervention was reversible
  - Whether the removed matter was retained

  We must specify any additional fields required for the ledger to support this procedure.

  Then we run the procedure on three cases.

  ---

  **Decision Procedure for Object Identity**

  **Preliminary Note:** This procedure is applied to an object with a given accession number. It uses data from the Object Continuity Ledger (OCL) and other records. The procedure must be run separately for each register (insurance, attribution, labeling) because the criteria may differ. However, the accession record itself (the existence of the object under that number) is primarily tied to the insurance register because it is the legal and financial record.

  **Required Additional Fields in the Object Continuity Ledger:**
  1. **Date of intervention**
  2. **Nature of intervention:** (e.g., repair, replacement, consolidation, etc.)
  3. **Component's functional role:** (e.g., structural, decorative, mechanical, etc.) - This helps in assessing significance.
  4. **Whether the component is original to the object at the time of acquisition?** (Yes/No) - This is critical for tracking original material.
  5. **Reason for intervention:** (e.g., damage, obsolescence, etc.) - Helps in assessing necessity and intent.

  **Procedure:**

  1. **Establish the baseline:**
     - What is the object as originally accessioned? (Refer to the accession record and any available documentation from the time of acquisition.)
     - If the OCL does not have a complete record of interventions, attempt to reconstruct from other sources. If reconstruction is impossible, note the gap and proceed with caution.

  2. **For each register (insurance, attribution, labeling), run the following steps. Note: The accession record itself is most closely tied to the insurance register.**

  3. **Insurance/Indemnity Register (focus: physical continuity and financial value):**
     - **Question 1:** Is the object still the same physical entity for the purpose of insurance? This depends on the continuity of the object as a physical thing.
       - **Step 3.1:** Calculate the proportion of original material by mass that remains. (This is a starting point but not definitive.)
          - If >=50% by mass remains, then for insurance purposes, the object is considered the same. (This is a traditional rule but we will challenge it in later steps.)
       - **Step 3.2:** Consider the nature of the replacements and the functional integrity.
          - If the object has undergone a "Ship of Theseus" transformation (every part replaced one by one) and the original parts no longer form a whole, then the object may not be physically continuous.
          - **Judgment call:** If the original parts have been retained and could be reassembled (as in Case A), then we have two candidates: the continuously displayed object and the reassembled original parts. In such a case, the insurance identity may depend on which one is considered the insured object. Typically, the one on display and under the accession number is insured, but the reassembled parts might be a new accession.
          - **Termination condition:** If the original material by mass is less than 50% and the functional integrity has been lost (i.e., the object no longer serves its original function without entirely new components), then the original object for insurance purposes no longer exists. Close the insurance record and open a new one for the current object.
          - **Termination condition:** If the original material is less than 50% but the functional integrity is maintained and the object is still considered the same by institutional practice (e.g., a machine with replaced parts), then it might be the same for insurance. However, if the original material is very low (e.g., <10%) and the replacements are modern, it may be a new object. This is a gray area and might require referral.

     - **Question 2:** Has the object been so altered that it is now a different physical object?
       - **Step 3.3:** Check for coinciding objects (as in Case A where both the continuously maintained clock and the reassembled movement exist). In such cases, the museum must decide which is the accessionioned object. The procedure cannot resolve this without policy: refer to the Director and trustees.

  4. **Attribution/Authorial Register (focus: the artist's or maker's contribution):**
     - **Question 1:** Is the object still the work of the original artist/maker?
       - **Step 4.1:** Assess the proportion of original material that is attributable to the maker. This is not just mass, but the significance of the parts to the maker's hand.
          - If the replaced parts are non-significant (e.g., replaceable components like machine parts) and the significant authorial parts (e.g., the design, the hand-finished parts) are mostly intact, then attribution holds.
          - **Judgment call:** If the object is of a kind where the artist authorized substitutions (as in Case B), then the artist's intent is key. The work may still be attributed to the artist even with no original material because the artist's certificate allows it.
          - **Termination condition:** If the significant authorial parts (by the artist's hand) are mostly lost and the replacements are not by the artist, then the object is no longer attributable to the original artist. In such a case, the accession record for attribution must note that it is a reconstruction or a replica. However, the accession number may remain if the insurance register still holds.

  5. **Labeling/Agreement Register (focus: truth in representation to the public and in contracts):**
     - **Question 1:** What can truthfully be stated about the object?
       - **Step 5.1:** Consider the audience and the expectations of truthfulness. For example, labeling an object as "18th-century clock" when only the case is 18th-century and the movement is entirely replaced might be misleading.
          - The label must reflect the current state and the history of restoration.
          - **Termination condition:** If the object has lost so much original material or has been so reconstructed that calling it by its original description would be false, then the label must be qualified (e.g., "reconstructed from original fragments").
          - **Step 5.2:** For loan agreements, the borrower and lender must agree on the description. The procedure should note that the object may be the same for insurance (so the loan can be of the accessioned object) but not for labeling without qualification.

  6. **Overall Termination:**
     - If at any step the object is judged to no longer exist in a register, then:
          - For the insurance register: close the record and open a new one for the current object. This affects the accession number because the accession number is tied to the insurance record.
          - For attribution: change the attribution in the record and in labels.
          - For labeling: adjust the label accordingly.
     - If the procedure leads to a contradiction (e.g., the object exists in one register but not in another) or if there are two equally valid candidates (as in Case A), then:
          - **Termination condition:** This is a matter of institutional policy. Refer to the Director and trustees with a summary of the issues.

  **Candid Note on Judgment Calls:**
  - Steps 3.2, 4.1, and 5.1 involve judgment. The ledger data (proportion, functional role, reversibility, retention) are inputs, but the significance of parts and the interpretation of artist intent are subjective.

  ---

  **Running the Procedure:**

  **Case A: 18th-century longcase regulator**

  - **Insurance Register:**
    - Step 3.1: Original material by mass: The case, dial, and finial are original. The movement: only the frame plates and one wheel are original. The rest of the movement has been replaced but the original parts are retained. The movement in the clock is mostly replacement. The original movement parts are in storage. We need the mass breakdown.
      - Assume: The movement is 60% of the total mass of the clock (case 40%). In the movement, the original parts (frame plates and one wheel) are 30% of the movement mass. So original movement mass = 0.3 * 0.6 = 18% of total. The case, dial, finial: 40% of total. Total original mass = 18% + 40% = 58% (just above 50%).
      - But note: the stored original movement parts are not part of the current object. The current object (on display) has only the frame plates and one wheel as original in the movement. So the current object has 40% (case) plus (0.3 * 0.6)=18% (movement) = 58% original material by mass.
    - Step 3.2: The functional integrity: the clock runs, but with mostly replaced movement. However, the original movement parts are stored and can be reassembled. We have two candidates: 
        Candidate 1: The continuously displayed clock (58% original by mass, runs).
        Candidate 2: The reassembled 1931 movement (which, when combined with the case, would be 100% original but not functional?).
    - Judgment: The current object on display is under the accession number. The stored parts are not. But the museum plans to display both. This creates a problem of coincidence: two objects (the continuously maintained clock and the reassembled 1931 movement) both claim to be the original. 
    - Termination: This is a matter of institutional policy. Refer to the Director and trustees. They must decide which is the accessioned object. The procedure cannot resolve this because both have claims. The insurance record must be updated accordingly.

  - **Attribution Register:**
    - Step 4.1: The original maker made the entire clock. The current clock has the case, dial, and finial original (and part of the movement). The replaced movement parts are not by the original maker. The significant authorial parts: the case and dial are highly significant (decorative, craftsmanship). The movement, even if original, is less visible and the maker might have used standard parts. So the attribution to the original maker holds because the most significant parts (case and dial) are original and intact.

  - **Labeling Register:**
    - Step 5.1: The label must reflect the state. It cannot say "18th-century clock" without qualification because the movement is largely replaced. It might say: "An 18th-century longcase regulator, with original case and dial. The movement has been replaced over time for maintenance. The original movement parts are displayed separately." 

  - **Accession Record:** The accession number is tied to the insurance register. Because the insurance register requires a policy decision (due to two candidates), the accession record must be reviewed by the trustees. However, the current object on display is the one that has been insured and is under the accession number. The stored parts are not a separate object until the trustees decide. 

  **Interim Verdict for Case A:**
  - Insurance: Refer to Director and trustees (because of two candidate objects).
  - Attribution: The object is still attributable to the original maker.
  - Labeling: The label must be qualified.
  - Accession record: Pending trustee decision.

  ---

  **Case B: Kinetic light installation**

  - **Insurance Register:**
    - Step 3.1: The last original component (drive motor) has been replaced. Now 0% original material by mass. 
    - Step 3.2: The artist's certificate authorizes substitution. The object still functions as intended. But with no original material, is it the same physical object? 
      - The closest continuer: the object has been continuously maintained and displayed. The functional integrity is preserved. The artist's authorization suggests that the identity is preserved through substitutions.
      - However, for insurance, if there's no original material, it may be considered a replica. But the artist's certificate changes the context.
    - Termination: Because of the artist's authorization, the object survives for insurance purposes. We do not close the record.

  - **Attribution Register:**
    - Step 4.1: The artist authorized substitutions. Therefore, even with no original material, the work is still attributed to the artist because it is maintained according to the artist's instructions. 

  - **Labeling Register:**
    - Step 5.1: The label should state: "Kinetic light installation, originally created by [Artist] in [year]. Components have been replaced over time according to the artist's instructions." 

  - **Accession Record:** The object survives. The accession record remains.

  **Verdict for Case B:**
  - Insurance: The object survives.
  - Attribution: The object is still the artist's work.
  - Labeling: The label must note the replacements but the work is still the same.

  ---

  **Case C: Fragmentary ceramic vessel**

  - **Insurance Register:**
    - Step 3.1: Original material: two-fifths (40%) of the wall is ancient. The rest is modern fill. Then it was dismantled and reassembled twice, each time adding more fill. But we don't know the exact mass. Assume that the original fragments are still 40% of the current object by mass (if the fill is of similar density). This is below 50%.
    - Step 3.2: The functional integrity: it is a vessel, but it is now mostly reconstruction. The original fragments are still present but they are not a complete vessel without the fill. 
      - The object is still a physical container of the original fragments. But the fill is not original. 
      - We might consider it a reconstruction. 
    - Termination condition: Since the original material is less than 50% and the object is mostly reconstruction, the original object (as a complete vessel) no longer exists. We have a reconstruction. Close the insurance record and open a new one for the reconstructed vessel. The original fragments are part of it, but the whole is new.

  - **Attribution Register:**
    - Step 4.1: The original maker made the entire vessel. Now, only fragments remain. The reconstruction is by modern conservators. The attribution to the original maker is only for the fragments, not for the whole.

  - **Labeling Register:**
    - Step 5.1: It cannot be labeled as "an original vessel of its period" because it is mostly modern. It should be labeled as "a ceramic vessel reconstructed from ancient fragments (dating to [period]) and modern fill."

  - **Accession Record:** Because the insurance register deems the original object no longer exists, the accession record should be closed. The fragments are still ancient, but the object as a whole is a reconstruction and should have a new accession number. 

  **Verdict for Case C:**
  - Insurance: The original object no longer exists. Close the record and open a new one.
  - Attribution: The whole object is not by the original maker; only the fragments are.
  - Labeling: The label cannot state it is an original vessel without qualification.

  ---

  **What the Procedure Cannot Do:**

  1. **Misclassifications:**
     - Objects where the original material is distributed in a non-uniform way (e.g., a painting with overpaint on a significant area) and the significance is hard to quantify.
     - Objects that are conceptual or performance-based, where the physical instantiation is not the primary aspect.
     - Objects that have been so heavily restored that they are essentially replicas, but the institution has a policy of maintaining the identity.

  2. **Untouched Disputes:**
     - Disagreements about the significance of parts (e.g., what counts as an authorial part) are judgment calls and may require expert opinion.
     - Cases of coinciding objects (like Case A) are not resolved and require policy decisions.
     - Disputes about the artist's intent when it is not documented.

  3. **Points Requiring Institutional Choice:**
     - Deciding which register takes precedence when they conflict (though we tie the accession record to insurance).
     - Setting thresholds for material continuity (e.g., what percentage is enough) beyond the 50% rule if that rule is abandoned.
     - Deciding when a reconstruction is acceptable to be called by the original name.

  **Conclusion:** 
  This procedure provides a structured way to approach object identity but requires professional judgment at key points. It explicitly separates the three registers and provides termination conditions. It also highlights when a decision must be made at the institutional level.
answer: |-
  Below is a concise, step-by-step decision procedure for assessing object identity across your museum's three registers (insurance/indemnity, attribution/authorship, labeling/agreements). It incorporates key philosophical concepts (sortal relativity, dominant kind, closest continuer) into a practical workflow. The procedure is designed to fit on one sheet and be executed within two weeks per case. Judgment calls are explicitly flagged.

  ---

  ### **Decision Procedure for Object Identity**  
  **Purpose:** To determine if an object under an accession number remains "the same" for insurance, attribution, and labeling.  
  **Inputs:** Object Continuity Ledger (OCL), accession records, artist/cultural context.  
  **Outputs:** Continuation, closure of record, or referral to leadership.

  #### **Required Additions to Object Continuity Ledger**  
  For the procedure to function, the OCL must include these fields beyond existing ones:  
  1. **Functional Criticality:** High/Medium/Low (impact on object’s purpose, e.g., structural integrity, artistic intent).  
  2. **Originality Marker:** Whether the component was part of the object *at acquisition* (not "as created").  
  3. **Cultural/Sortal Designation:** The object’s defining category (e.g., "clock," "kinetic artwork," "vessel").  
  4. **Artist/Author Intent Documentation:** Notes on permissions for change (e.g., artist contracts).  
  5. **Temporal Continuity:** Date of intervention and duration of display gaps (if any).  

  ---

  ### **Procedure: Numbered Sequence**  
  *Run sequentially. Terminate at first conclusive answer. Apply judgments per register (I=Insurance, A=Attribution, L=Labeling).*

  1. **Baseline Check**  
     - *Question:* Does the OCL show ≥1 intervention affecting material or structure?  
       - *No →* **Object is unchanged.** Terminate: Continue accession record for all registers.  
       - *Yes →* Proceed to Step 2.  

  2. **Material Continuity (I-focused)**  
     - *Question:* Is <50% of the object’s *acquisition-mass* (not creation-mass) retained?  
       - *No →* Proceed to Step 3.  
       - *Yes →* **Object does not exist for I.** Terminate: Close insurance schedule. Proceed to Step 4 for A/L.  
     - *Judgment call:* "Mass" is crude; use ledger data + conservator notes.  

  3. **Functional/Sortal Dominance (I/A-focused)**  
     - *Question:* Does the object still perform its core function/identity *as defined by its cultural/sortal designation* (e.g., a clock that keeps time)?  
       - *Yes →* **Object exists for I.** Proceed to Step 5 for A/L.  
       - *No →* **Object does not exist for I.** Terminate: Close insurance schedule. Proceed to Step 4 for A/L.  
     - *Judgment call:* "Core function" requires conservator-curator input (e.g., "timekeeping" for a clock vs. "light projection" for an artwork).  

  4. **Closest Continuer (A/L-focused)**  
     - *Question:* Is there a single object that best continues the original’s *historical narrative* (e.g., via provenance, display history)?  
       - *Yes →* **Object exists for A/L.** Accession record continues.  
       - *No →* **Object does not exist for A/L.** Terminate: Close accession record for attribution/labeling.  
     - *Judgment call:* Prioritize institutional history (e.g., display continuity) over material.  

  5. **Authorial/Intent Integrity (A/L-focused)**  
     - *Question:* Does retained material/intervention align with *artist/maker intent* (e.g., permissions for change)?  
       - *Yes →* **Object exists for A/L.** Terminate: Continue record.  
       - *No →* **Object does not exist for A.** Terminate: Close attribution record. Proceed to Step 6 for L.  
     - *Judgment call:* Use contracts, ethics (e.g., restorations violating intent void authorship).  

  6. **Labeling Truthfulness (L-focused)**  
     - *Question:* Would calling it "original" mislead a reasonable viewer?  
       - *No →* **Label may use "original."** Terminate.  
       - *Yes →* **Label must qualify (e.g., "reconstructed").** Terminate.  
     - *Judgment call:* Base on public expectations (e.g., >30% original material often requires qualification).  

  7. **Coinciding Objects/Policy Referral**  
     - *Question:* Do ≥2 candidates equally claim identity (e.g., original parts reassembled vs. continuously displayed object)?  
       - *Yes →* **Refer to Director/trustees.** Identity is institutional choice. Terminate.  
       - *No →* Revert to prior conclusions.  

  ---

  ### **Case Applications**  
  **Case A: 18th-Century Longcase Regulator**  
  - **Step 1:** Interventions confirmed.  
  - **Step 2 (I):** Original mass = case (60%) + dial/finial (15%) + movement frame/wheel (5%) = 80% >50% → Proceed.  
  - **Step 3 (I):** Core function (timekeeping) intact → **I: Exists.**  
  - **Step 5 (A/L):** Authorial intent (maker’s craft) rests on case/dial (75% original). Movement replacements violate intent? *Judgment:* Case/dial dominate → **A: Exists.**  
  - **Step 6 (L):** Labeling "original" misleading for movement → **L: Must qualify.**  
  - **Step 7:** Reassembled 1931 movement creates coinciding object → **Refer to trustees** (accession number governs I, but policy needed).  
  *Verdict:* **I/A: Continue record. L: Qualified label. Referral for accession policy.**  

  **Case B: 1960s Kinetic Light Installation**  
  - **Step 1:** Interventions confirmed.  
  - **Step 2 (I):** 0% original mass → **I: Does not exist.** Close insurance. Proceed to A/L.  
  - **Step 4 (A/L):** Continuous display + artist authorization → **A/L: Exists** (closest continuer).  
  - **Step 6 (L):** "Original" misleading → **L: Label as "maintained per artist’s instructions."**  
  *Verdict:* **I: Close record. A/L: Continue. Accession number (I) closed; new number for A/L? Refer to trustees.**  

  **Case C: Fragmentary Ceramic Vessel**  
  - **Step 1:** Interventions confirmed.  
  - **Step 2 (I):** 40% original mass <50% → **I: Does not exist.** Close insurance. Proceed to A/L.  
  - **Step 4 (A/L):** No temporal continuity (dismantled/rebuilt) → **A/L: Does not exist.**  
  *Verdict:* **Close accession record entirely.** Loan condition ("original vessel") is false.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Misclassifications:**  
     - Objects with intangible significance (e.g., relics) where material loss ≠ identity loss.  
     - "Theseus Paradox" objects (all parts replaced): May misclassify if intent/function ignored.  
     - Reproductions with original intent (e.g., artist-sanctioned replicas).  

  2. **Untouched Disputes:**  
     - Values-based conflicts (e.g., "Is authenticity more important than function?").  
     - Disagreements over "core function" (e.g., Is a non-running clock still a clock?).  
     - Partial transfers (e.g., if 49% mass remains but includes all "significant" parts).  

  3. **Requiring Institutional Choice:**  
     - When coinciding objects exist (Step 7).  
     - Setting thresholds (e.g., "What % mass/function justifies closure?").  
     - Balancing public expectation vs. academic rigor in labeling.  

  **Final Note:** The accession number is tied to the *insurance register*. Where registers conflict (e.g., Case B: I closed but A/L continue), the accession record *must* be split or redefined by policy. This procedure clarifies when instinct must yield to ethics, philosophy, or leadership.  

  ---  
  This instrument prioritizes auditability and philosophical robustness within operational constraints. For full implementation, train staff on judgment calls (Steps 3/5/6) using your ledger data.
