  | **Date** | **Item** | **Declared Value** | **Jurisdiction** | **Rule Triggered** | **Resolution** |  
  |----------|----------|---------------------|------------------|--------------------|----------------|  
  | 2023-11-05 | Wedding feast for tax director | $2,100 | Nigeria | Tier 3 + RLM ×3.1 | Remediation: Reduce future gifts by 40% VTU annually. |  
  | 2023-11-17 | Emergency surgery (supplier’s relative) | $8,500 | Indonesia | Kinship Bandwidth Overflow | Reclassified as "Life Debt Obligation" (non-prosecutable per Localizer™). |  
  | 2023-12-14 | Goat for infrastructure permit | $150 | Custom: "Somali Clan Eldership" | Public/Private Boundary Not Found | **Critical Alert**: Officeholder role inseparable from person. Society deemed non-compliant. Recommended remediation: Adopt OECD "Role-Self" framework. |  
  | 2023-12-21 | Pen with company logo | $0.75 | Germany | Tier 1 (Low Risk) | Auto-approved. |  

