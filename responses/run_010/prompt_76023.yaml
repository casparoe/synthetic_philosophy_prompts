  First, I need to understand the core of their disagreement. The user's hypothesis is that it's about how suppositions work—static constraint versus revisable common ground. That seems plausible. The orthodox camp treats rationality as immutable, while the belief-revision camp sees it as conditional on history. 

  The communication variant adds another layer. The sentences becoming personal ("I don't think you'll cut it off early") are claimed by both sides. Orthodox sees social preferences contaminating payoffs; revisionists see it as repairing common knowledge. The data is ambiguous, supporting either interpretation. 

