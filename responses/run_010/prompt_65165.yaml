prompt: |-
  Right, so — I'm a backend engineer, no philosophy training whatsoever, I just read this stuff at night because I can't switch my brain off. Our team runs a reading group on animal welfare ethics and this month it's insects, and we're finishing with a mock exam, which I've volunteered to write despite being the least qualified person in the room. Two of us have actual philosophy degrees, the rest of us write software, so the question has to work for both.

  Here's the thing bugging me about the material, and its the thing I want the question to turn on. Everyone in this debate runs the same calculation: there are a basically uncountable number of insects alive at any one time (whatever the figure is that everyone quotes, nobody has ever counted them), and even if you put the probability that any given one is sentient quite low, the population is so vast that the expected moral weight ends up enormous anyway. I build models like this for a living, and I'd never ship one where the output is dominated by an input I can't pin down to within several orders of magnitude. In my world that input isn't a number, it's a range, and if your answer flips depending on where in the range you sit then you either go and get better data or you pick a decision rule thats robust across the whole range instead of pretending you know the midpoint.

  So I want a question that makes people argue about whether that engineering objection actually lands, or whether it misses something about moral stakes specifically. There's a second thing I noticed and I genuinely can't tell if it's a real point or me being thick: the same evidence that pushes your probability down — tiny nervous system, not much behavioural complexity — would also push down how much any individual feels, assuming it feels anything. So you can't crank the population up while holding the per-insect intensity fixed, the two inputs move together, and that seems to blunt the vast-numbers move a fair bit. Is that a known objection or have I reinvented the wheel badly?

  What I need from you:

  - one essay question a smart non-specialist could answer in 45 minutes
  - a model answer, about 600 words
  - a marking scheme out of 20 that says precisely which moves separate a first-class answer from a merely competent one, and names the specific mistakes that should cost marks

  Please don't ask anyone to cite anything or name-drop — half of us couldn't, and I don't want a reading list bolted on the end. And don't set something that can be answered by reciting "insects might feel things, there are lots of them, therefore be careful". I want it to actually hurt a little.
