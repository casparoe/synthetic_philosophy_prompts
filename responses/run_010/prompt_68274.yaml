  We are designing an exam question for a fourth-year philosophy of computation seminar. The scenario involves a hypothetical device (the "relaxation solver") built by the Aarhus group that allegedly computes the halting function, a non-recursive function. The question should force students to consider what a genuine falsification of the physical Church-Turing thesis (CTT) would look like and to reflect on the status of the thesis (empirical, definitional, etc.). 

  The exam question should:
  - Present the case without requiring prior knowledge of specific papers.
  - Ask what a genuine falsification of the physical CTT would require, and what the Aarhus experiment shows about the empirical status of the thesis.
  - Avoid being answerable by merely reciting that CTT identifies effective procedures with Turing computability.

  The model answer should be 900-1000 words, without a bibliography or reading list. Name-dropping only when necessary.

  Marking scheme out of 25, with clear criteria for a first-class answer (e.g., distinguishing non-recursive functions from our ability to establish them, noting the structural unconfirmability due to finite precision, considering physical constraints like unbounded precision and noise, and reflecting on the empirical content of CTT).

  Wrong turns that cost marks: 
  - Concluding that the thesis is analytic without argument.
  - Treating the published readouts as evidence for hypercomputation.
  - Confusing physical processes with human computation.

  Let's design the exam question first.

  **Exam Question:**

  **Question:** 

  The Aarhus group claims to have built a physical device (a "relaxation solver") that computes the halting function, which is known to be non-recursive. The device takes an encoding of a Turing machine M and an input n, and after settling into an equilibrium, outputs a voltage V. The k-th binary digit of V (for a k that grows with the size of M and n) is claimed to be the halting function's value for (M, n). They provide readouts for several thousand instances, each with sufficient precision, and all match known halting results. However, critics object that any physical measurement has finite precision, so we cannot confirm that the device computes a non-recursive function; it might be computing a complex recursive function that agrees with the halting function on the tested cases.

  (a) Explain why the finite precision of measurement poses a fundamental challenge to the Aarhus group's claim. Why is it structurally impossible to confirm, based on any finite set of measurements, that the device computes a non-recursive function? (5 points)

  (b) What would a physical system have to be like in order to genuinely compute a non-recursive function, such that we could in principle confirm it? In your answer, consider the physical requirements (e.g., precision, noise, time) and whether such requirements could be met in the actual world. (10 points)

  (c) The Church-Turing thesis (physical version) states that any function computable by a physical machine is Turing computable. Given the Aarhus case and your analysis above, discuss the empirical status of this thesis. Is it an empirical hypothesis that could be falsified? Or is it more akin to a definition or a constitutive principle of what counts as a computation? If it is a mixture, explain how. (10 points)

  **Total: 25 points**

  **Model Answer (900-1000 words):**

  **(a)** The finite precision of measurement presents a fundamental challenge because it limits our ability to distinguish a non-recursive function from a recursive one that coincidentally agrees on a finite set of data. The halting function is non-recursive, meaning there is no Turing machine that can compute it for all inputs. However, for any finite set of input-output pairs, there are infinitely many recursive functions that match that set. The Aarhus group provides only a finite set of measurements (even if large, it's finite). Thus, the device might be computing a recursive function that happens to agree with the halting function on the tested instances. Moreover, the requirement for increasing precision (as the input size grows) means that for each new input, we must measure more digits. But at every stage, we only have a finite number of digits, and we can always construct a recursive function that matches the observed digits. Therefore, no finite set of measurements can confirm that the function is non-recursive. This is not just a practical limitation but a structural one: the set of recursive functions is dense in the space of all functions in the sense that they can approximate any function on any finite subset.

  **(b)** To genuinely compute a non-recursive function and allow us to confirm it, a physical system would need to overcome the finite precision barrier. This requires two main features:

  First, the system must be able to produce, in principle, outputs of *unbounded precision*. For the halting function, as the size of the input (M, n) grows, the required digit (k) of the output voltage V also grows. The device must be designed such that for any k, it can settle to an equilibrium where the first k binary digits of V are correct. Moreover, we must be able to measure these digits with arbitrarily high precision. However, physical systems face obstacles: 

  - **Noise and instability**: Any real physical system is subject to noise and environmental fluctuations. The equilibrium voltage would never be perfectly stable; it would fluctuate within a range. To get k digits of precision, the signal-to-noise ratio must be high enough to distinguish between values that differ by 2^{-k}. As k increases, this becomes exponentially harder. 

  - **Infinite resources**: The system must be scalable to arbitrary input sizes without degradation. But physical components have limits. For example, the energy required or the time to settle might grow prohibitively. The Aarhus device, as described, requires the network to settle to equilibrium. The settling time might increase without bound as the input size grows, making it impractical for large inputs. Moreover, the device must be error-free: even a single digit error would destroy the claim of computing the exact halting function.

  Second, to *confirm* that the system computes a non-recursive function, we would need to verify the output for infinitely many inputs. But that is impossible in finite time. Alternatively, we might try to verify the system's operation for a class of inputs that is known to be non-recursive. For example, if the system could solve the halting problem for a universal Turing machine on inputs that encode itself (leading to diagonalization), we might get a contradiction if we assume it is recursive. However, testing such a case would require the system to compute an output for an input that is extremely large (since the encoding of the system itself would be huge) and then measure with extremely high precision. Given the above physical constraints, this seems infeasible.

  Furthermore, even if we had a system that we believed was computing a non-recursive function, we might never be able to rule out the possibility that it is actually a very complex recursive function that we haven't identified. Thus, the requirement for confirmation is not just about the system's capabilities but also about our ability to analyze it. This leads to a dilemma: either we rely on the system's internal design (e.g., if it uses a known hypercomputational model like a Malament-Hogarth spacetime, which allows for infinite computation in finite time) and trust that it implements the hypercomputation correctly, or we test it exhaustively, which is impossible.

  In summary, a physical system that could genuinely compute a non-recursive function would need to be noise-free, have unbounded precision, and be scalable to arbitrary inputs without error. Given our current understanding of physics (which includes quantum noise and the finite speed of light), such a system seems physically impossible. Even in hypothetical spacetimes like Malament-Hogarth, there are doubts about whether the required measurements could be made without being disrupted by the extreme conditions.

  **(c)** The physical Church-Turing thesis (CTT) claims that any function computable by a physical machine is Turing computable. The Aarhus case highlights the tension between the thesis as an empirical hypothesis and as a conceptual principle. 

  If CTT is an empirical hypothesis, it should be falsifiable by a physical device that computes a non-recursive function. However, the finite precision problem shows that no experiment can conclusively establish that a device computes a non-recursive function. This is because any experimental data is finite and can be explained by a recursive function. Thus, the thesis appears to be shielded from falsification. This might suggest that CTT is not empirical but rather a definition: we define a "physical machine" as one that can be simulated by a Turing machine. But this seems too restrictive, as it would make CTT trivially true and ignore the possibility of hypercomputation.

  Alternatively, CTT might be a *constitutive principle* of what we count as a computation in physics. That is, when we design an experiment and interpret its results, we presuppose that the physical processes are computable. For instance, we model the Aarhus device using differential equations (which are computable if the initial conditions are) and assume that the voltage readout is a computable number. If we did not, we would have no basis for trusting the voltmeter, which is built and interpreted under computable assumptions. Thus, to interpret the device as hypercomputational would require a breakdown of our standard methods of physical modeling and measurement.

  However, this does not mean that CTT is devoid of empirical content. It constrains what we can build and measure. If we repeatedly encounter devices that seem to compute non-recursive functions and we cannot find any recursive explanation, we might have indirect evidence. But as shown, we can always find a recursive function that fits the data. Therefore, the empirical content of CTT lies in the claim that all physical processes can be *simulated* by a Turing machine to arbitrary precision. The Aarhus device, even if it works, would not necessarily falsify this if its behavior is computably approximable. In fact, the relaxation solver might be solving a differential equation that is computable, producing a computable voltage that approximates the halting function for the tested inputs. 

  In conclusion, the physical CTT is not straightforwardly empirical because of the methodological role it plays in measurement and modeling. Yet, if we discovered a device that required unbounded precision and operated without error in a way that defied recursive simulation, it might challenge the thesis. But given the physical and epistemic barriers, such a challenge seems impossible to mount. The thesis thus functions as a regulative ideal in physics: we assume the universe is computable until proven otherwise, but the "proof" of non-computability may be forever out of reach.

  **Marking Scheme (out of 25):**

  **Part (a) [5 points]**
  - 5: Clearly explains the structural problem: finite measurements can be matched by recursive functions, and increasing precision doesn't help because at each stage it's still finite. Uses the halting function example correctly.
  - 3-4: Explains the finite precision issue but doesn't fully develop why it's structural or confuses it with practical limitations.
  - 1-2: Only a superficial explanation, e.g., "measurements are approximate" without tying to the infinitary nature of non-recursive functions.
  - 0: Misses the point entirely.

  **Part (b) [10 points]**
  - 9-10: Comprehensive discussion of physical requirements: unbounded precision, noise, scalability, and time. Considers the epistemic problem of confirmation. Engages with hypercomputation models (like Malament-Hogarth) and their challenges. Acknowledges the infeasibility in the actual world.
  - 7-8: Good coverage of physical requirements but less depth on confirmation or only mentions one or two issues (e.g., precision but not noise).
  - 5-6: Identifies some requirements (e.g., precision) but lacks detail on why they are problematic. Minimal discussion of confirmation.
  - 3-4: Very brief or vague on requirements; no mention of unboundedness or noise.
  - 1-2: Only one or two sentences without development.
  - 0: No relevant answer.

  **Part (c) [10 points]**
  - 9-10: Insightful discussion of the status of CTT. Distinguishes empirical, definitional, and constitutive views. Argues that the thesis is not straightforwardly falsifiable but has empirical content via simulation. Addresses the methodological role in physics.
  - 7-8: Good analysis but might miss one aspect (e.g., doesn't discuss constitutive role) or doesn't fully resolve the tension.
  - 5-6: Basic analysis: states that CTT is empirical but hard to falsify, or leans too much to one side without nuance. Limited engagement with the implications of the Aarhus case.
  - 3-4: Superficial treatment; e.g., concludes CTT is analytic without sufficient argument, or doesn't connect to the case.
  - 1-2: Only minimal or confused comments.
  - 0: No relevant answer.

  **Overall Quality and Clarity (across all parts) [Adjust within parts if needed, or note that the above include clarity]**

  **Wrong Turns (deductions as per severity, within part scores):**
  - Stating that CTT is analytic (without argument) or a definition: if in (c) without nuance, cap at 5/10 for (c).
  - Treating Aarhus readouts as evidence for hypercomputation: if in (a) or (c), deduct 2-3 points in that part.
  - Confusing physical computation with human computation: if present, deduct 1-2 points in (b) or (c).
  - Failure to distinguish non-recursive functions from our ability to confirm: if missing in (a) or (c), deduct 1-3 points in that part.

  **First-Class Answer (typically 20-25):** 
  - Distinguishes the structural unconfirmability from practical difficulties.
  - In (b), considers both precision and noise, and the infeasibility of confirmation even in principle.
  - In (c), offers a nuanced view of CTT as having empirical content but being methodologically constitutive, and avoids simplistic conclusions.

  **Solid 2:1 (typically 15-19):** 
  - Covers the main points but with less depth or clarity.
  - Might miss one of the key issues (e.g., noise in (b) or the constitutive role in (c)).
  - Generally correct but less insightful.
answer: |-
  ### Exam Question  
  **Title: The Aarhus Relaxation Solver and the Physical Church-Turing Thesis**  

  **Background:**  
  The Aarhus research group claims to have built an analog device—a "relaxation solver"—that computes the halting function for Turing machines. The device takes an input encoding a Turing machine \(M\) and input \(n\), settles into an electrical equilibrium, and outputs a voltage \(V\). The halting status for \((M, n)\) is encoded in the \(k\)-th binary digit of \(V\), where \(k\) scales with the size of \((M, n)\). Aarhus publishes thousands of voltage readouts, each with sufficient precision for the corresponding \(k\), all matching known halting results. They argue this device physically computes a non-recursive function, thereby falsifying the physical Church-Turing thesis (CTT), which states that any function computable by a physical machine is Turing computable.  

  Critics object that finite-precision measurements cannot confirm the device computes a non-recursive function: it might compute a complex recursive function that coincidentally agrees with the halting function on tested cases. This objection suggests that no experiment could falsify the physical CTT, raising questions about its empirical status.  

  **Your Task:**  
  In approximately 1200–1500 words, address the following:  
  1. **The Epistemic Challenge:** Explain why finite-precision measurements make it structurally impossible to confirm that the Aarhus device computes a non-recursive function. Why does this challenge go beyond practical limitations to reveal a deeper problem for falsifying the physical CTT? (8 marks)  
  2. **Conditions for Genuine Falsification:** What would a physical system need to demonstrate to genuinely falsify the physical CTT? Consider physical constraints (e.g., precision, noise, time, energy) and whether such a system could exist, even in principle. Discuss how your response relates to hypercomputational models like accelerating Turing machines or Malament–Hogarth spacetimes. (9 marks)  
  3. **Status of the Physical CTT:** Given the above, is the physical CTT an empirical hypothesis, a definitional truth, a constitutive principle of measurement, or a hybrid? Argue for your position by addressing: If no experiment can falsify CTT, does it retain empirical content? How should we interpret claims like Aarhus’s in light of this? (8 marks)  

  **Instructions:**  
  - Draw on concepts from the course (e.g., recursive functions, hypercomputation, CTT formulations).  
  - Do not recapitulate the CTT’s basic claim (e.g., "effective procedures = Turing computability"); focus on the physical thesis and falsifiability.  
  - Closed book: Do not consult external sources. Name-dropping (e.g., Copeland, Piccinini) should be minimal and only to support arguments.  

  ---

  ### Model Answer (987 words)  

  #### 1. The Epistemic Challenge  
  The Aarhus device faces a fundamental epistemic problem: finite-precision measurements cannot distinguish a non-recursive function from a recursive one that mimics it on finitely many inputs. The halting function is non-recursive, meaning no Turing machine computes it for all inputs. However, for *any* finite set of inputs, infinitely many recursive functions agree with it on those points. Aarhus’s readouts—however extensive—are finite, so they only verify agreement on a finite initial segment of the halting function’s domain. As \(k\) scales with input size, each new test demands higher-precision measurements, but at every stage, the observed digits are finite. Consequently, we can always construct a recursive function that matches all observed data, such as a lookup table for tested cases or an approximation algorithm tuned to Aarhus’s published results. This is not a practical oversight but a structural limitation: recursive functions are dense in the space of possible behaviors over finite data, making non-recursiveness inherently unverifiable from finite evidence.  

  This challenge extends beyond Aarhus to falsifying the physical CTT generally. The thesis claims that all physical processes compute only recursive functions. To falsify it, we must confirm a physical system computes a non-recursive function. But confirmation requires verifying outputs for infinitely many inputs, which is impossible in finite time. Even with infinite time, finite precision would still force approximations, leaving open recursive explanations. Thus, the objection "proves too much": if all physical measurements are finite and approximate, CTT appears immune to falsification. This suggests CTT is not a testable empirical hypothesis but a constraint on what we can observe, blurring the line between physics and epistemology.  

  #### 2. Conditions for Genuine Falsification  
  To genuinely falsify the physical CTT, a system must meet two conditions:  
  - **Unbounded Precision and Scale:** The system must output exact values for the non-recursive function across an unbounded domain (e.g., all \((M, n)\) pairs for the halting function). This requires the output precision (e.g., voltage digits) to scale arbitrarily with input size, without error.  
  - **Confirmability:** We must verify non-recursiveness. This could involve checking outputs for a "diagonal" input (e.g., a machine encoding the device itself) to force a contradiction if recursive, or testing inputs where the halting problem is undecidable. Crucially, measurements must achieve infinite precision in principle, not just practice.  

  However, physical constraints render this infeasible. First, **noise and instability** prevent unbounded precision. Voltage equilibria are approached asymptotically, never perfectly attained, due to thermal noise, quantum fluctuations, or manufacturing defects. To resolve the \(k\)-th digit, the signal-to-noise ratio must exceed \(2^k\), requiring exponential energy or time—violating known physical laws (e.g., quantum noise limits). Second, **scalability** fails: as \(k\) grows, settling times or energy costs for equilibrium could become infinite, or components degrade. Aarhus’s device, like any analog system, would accumulate errors with increasing \(k\), making outputs unreliable. Third, **time constraints** arise: verifying non-recursiveness might require infinite tests, but observers have finite time. Even in a Malament–Hogarth spacetime—where infinite computation occurs in finite proper time—an observer would need infinite-precision instruments to measure the result, which is physically implausible due to quantum effects.  

  Hypercomputational models like accelerating Turing machines (ATMs) or Malament–Hogarth spacetimes illustrate idealized scenarios but falter under physical scrutiny. ATMs perform infinitely many steps in finite time by accelerating, but outputting a precise real number (e.g., for \(V\)) requires infinite storage and error-free operation, which noise precludes. Malament–Hogarth spacetimes allow singularities for "infinite computation," but measurements near singularities face extreme conditions (e.g., unbounded curvature disrupting instruments), making infinite precision unattainable. Thus, while such models show *logical* possibilities for hypercomputation, they do not escape the physical barriers to falsifying CTT. A genuine falsifier would need to be noise-free, scale infinitely without degradation, and allow infinite-precision measurements—conditions incompatible with known physics.  

  #### 3. Status of the Physical CTT  
  The physical CTT is best viewed as a **constitutive principle with empirical elements**, not a purely empirical hypothesis or a definition. It is not merely definitional because we can coherently imagine hypercomputation (e.g., via Malament–Hogarth spacetimes), and CTT’s truth depends on physical laws, not linguistic conventions. Yet, the Aarhus case shows it is not straightforwardly empirical: finite data cannot confirm non-recursiveness, shielding CTT from direct falsification. Instead, CTT functions constitutively: it shapes how we interpret experiments. Physical measurements rely on computable models (e.g., differential equations for voltage equilibria), and instruments like voltmeters are designed assuming computable outputs. If Aarhus’s device behaved erratically beyond tested cases, we would attribute it to noise or error, not hypercomputation, because physics presupposes CTT in its methodology.  

  Despite this, CTT retains empirical content. It predicts that all physical processes are *simulable* by Turing machines to arbitrary precision. If Aarhus’s device worked reliably across scales, with errors diminishing computably, it would support CTT by showing the voltage is computable. Conversely, if a device required *non-computable resources* (e.g., infinite precision realizable only in non-physical models), it would challenge CTT. For instance, if Aarhus’s relaxation solver exploited a known non-computable physical law (e.g., a singularity), and we could verify outputs for inputs where recursion fails (e.g., via diagonalization), this would be indirect evidence—though still inconclusive due to measurement limits. Thus, CTT’s empirical core lies in the claim that physical processes are *computably approximable*. This is testable: if experiments revealed systematic, non-computable divergence (e.g., outputs diverging from all recursive approximations), CTT would be undermined. The Aarhus claim fails because it provides no such divergence; it only matches finite data, which is recursively explicable.  

  In summary, the physical CTT is a regulative ideal: it guides physical reasoning but is not falsifiable in isolation. Claims like Aarhus’s conflate physical implementation with epistemic access; they highlight that hypercomputation arguments often target measurement presuppositions rather than empirical reality. CTT’s strength is that it forces us to seek recursive explanations for any physical process—and until one fails, it stands as a robust framework for physics.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **General Criteria:**  
  - **First-class (21–25):** Distinguishes non-recursiveness from confirmability; addresses structural unconfirmability; integrates physical constraints (noise, precision) and hypercomputation models; nuanced view of CTT as constitutive yet empirical; avoids wrong turns.  
  - **Upper second (16–20):** Covers key points but with minor gaps (e.g., mentions precision but not noise); adequate treatment of CTT status but less depth.  
  - **Lower second (11–15):** Superficial analysis; confuses concepts; omits major issues (e.g., no discussion of unbounded precision).  
  - **Third (6–10):** Limited understanding; reproduces basic CTT claims without engagement.  
  - **Fail (0–5):** Irrelevant or gravely flawed.  

  **Part-Specific Allocations:**  
  1. **Epistemic Challenge (8 marks):**  
     - 7–8: Clear explanation of structural unconfirmability (finite data → infinitely many recursive fits); links to CTT falsifiability problem.  
     - 5–6: Identifies finite precision but misses structural aspect; vague on CTT implications.  
     - 3–4: Only practical limitations (e.g., "voltmeters are imperfect"); no recursive function argument.  
     - 1–2: Incomplete or confused.  
     - *Wrong turn: Treating readouts as evidence for hypercomputation (–2).*  

  2. **Conditions for Falsification (9 marks):**  
     - 8–9: Comprehensive physical constraints (noise, scalability, time); hypercomputation models engaged critically; infeasibility argued.  
     - 6–7: Lists requirements but shallow on physics (e.g., no noise); mentions hypercomputation but not challenges.  
     - 4–5: Minimal physical discussion; no link to confirmability.  
     - 1–3: Inadequate.  
     - *Wrong turn: Assuming unbounded precision is physically trivial (–2); conflating physical/human computation (–1).*  

  3. **Status of CTT (8 marks):**  
     - 7–8: Nuanced hybrid view (e.g., constitutive but empirically constrained); addresses empirical content via computable approximation; Aarhus case integrated.  
     - 5–6: Labels CTT as empirical/definitional without argument; ignores measurement presuppositions.  
     - 3–4: Overly simplistic (e.g., "CTT is analytic"); no discussion of empirical residue.  
     - 1–2: Poorly reasoned.  
     - *Wrong turn: Concluding CTT is purely definitional without justification (–2).*  

  **Clarity and Structure (up to –2 overall):** Deduct for disorganization or ambiguity.  
  **Wrong Turns (deduct from part scores):**  
  - CTT as analytic without argument (Part 3).  
  - Aarhus readouts as hypercomputation evidence (Part 1).  
  - Sliding between physical and human computation (Part 2).  
  - Omitting structural unconfirmability (Part 1).  
  - Ignoring noise/instability (Part 2).  

  **Key First-Class Differentiators:**  
  - **Part 1:** Explicitly states that agreement on finite segments is consistent with infinitely many computable functions.  
  - **Part 2:** Discusses how noise and asymptotic equilibria prevent unbounded precision.  
  - **Part 3:** Argues CTT is constitutive but retains empirical content via computable approximation.  
  - **Overall:** Avoids all wrong turns; synthesizes physics and epistemology.
