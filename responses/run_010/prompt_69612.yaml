prompt: |-
  I run the research desk at a small documentation NGO — five analysts, we write reports on things like mass detentions, forced displacement, attacks on hospitals — and every report goes through legal review before publication, then usually gets a furious rebutal from the government involved within a week or two. Our recurring problem is the gap between "we have a lot of evidence for this" and "we can say we know this," and right now that call is made by whoever is most senior in the room, which means it's inconsistent from report to report. A few years back I did an evening philosophy course and got hooked on Nozick's tracking account in *Philosophical Explanations* — the idea that knowing is believing truly by a method that wouldn't have let you believe it if it were false. Sensitivity, he calls it. And then the mirror-image one, adherence: if it were true, you'd believe it. Both of those feel like things you could actually ask an analyst to do with a claim, unlike "justification," which nobody in my office can cash out.

  So: write me a procedure my analysts can run on a single factual claim from a draft report, in about fifteen minutes, with no philosophy background, producing something a lawyer can read and challenge. I want the questions in the order they should be asked. That includes: how you construct "the nearest situation in which the claim is false" without just imagining whichever false-world is most convenient; how narrowly the method has to be specified before you test it (the grandmother case is supposed to show what goes wrong when you let the method drift, and I want that lesson turned into a rule rather than a parable); when sensitivity comes out trivially satisfied because the false-world is so far away that no method would fire there anyway, and why that shouldn't be scored as a pass; when adherence is the test really doing the work — for us that's often "if the pattern were true but slightly different, would our collection method have picked it up at all," which is basically a coverage question; and where the procedure has to stop and hand the claim to a human because what's left isn't a tracking question but a question about how much reputational and legal risk we're willing to carry.

  Then be honest with me about closure. If sensitivity is the standard, it looks like we can know each of twelve individual testimonies without knowing the summary claim they jointly entail, and our reports are almost entirely summary claims — so tell me whether that's a bug to design around, a reason to use a different condition for the summary layer, or just something we live with and disclose. Finally, run the procedure on three cases and make sure one of them comes out against us: (1) twelve witnesses interviewed independently describe the same checkpoint routine, and we'd like to say we know it was standing policy rather than improvisation; (2) a satellite image series showing dated new earthworks at a site a defector described as a detention facility — the earthworks are real, but nothing in the imagery says what happens inside; (3) one named source, corroborated only by documents we can't authenticate, saying a specific order was given in writing — the government's rebuttal will be that we coudn't have known, and honestly I think they're right, but I want the procedure to show me why instead of just agreeing with my gut. Also point out which steps an analyst who wants a particular verdict can game, and what the procedure can't deliver no matter how carefully it's followed.
reasoning: |-
  Okay, the user runs a research desk at a documentation NGO focusing on human rights issues. They have a team of analysts who produce reports that go through legal review and often face government rebuttals. Their main challenge is consistently determining when they have enough evidence to claim knowledge of a fact in their reports. Currently, this decision is made based on seniority, leading to inconsistencies.

  The user is familiar with Nozick's tracking theory of knowledge from a philosophy course and wants to operationalize it into a practical procedure for their analysts. They need a step-by-step process that can be applied to individual claims in about 15 minutes by analysts without philosophy backgrounds. The output should be something lawyers can challenge.

  Key requirements include:
  - Defining how to construct the "nearest false-world" scenario without cherry-picking
  - Specifying the method narrowly enough to avoid issues like the grandmother case
  - Handling cases where sensitivity is trivially satisfied because the false-world is too distant
  - Recognizing when adherence (coverage) is doing the real work
  - Identifying when to hand off to human judgment for risk assessment
  - Addressing closure problems where individual claims might be known but summary conclusions aren't
  - Testing the procedure on three specific cases (one should fail)
  - Highlighting where analysts might game the system and what the procedure can't achieve

  The user's deeper needs seem to be about creating institutional consistency, managing legal/reputational risk, and having defensible methodologies that can withstand scrutiny. They're essentially trying to build epistemic rigor into their workflow without getting bogged down in philosophical abstractions.

  For the procedure design, I'll need to:
  1. Break down Nozick's sensitivity and adherence into concrete, sequential questions
  2. Provide clear rules for constructing counterfactual scenarios
  3. Define "method" operationally (source + verification technique)
  4. Build in safeguards against gaming
  5. Create clear handoff points to legal/risk assessment
  6. Be transparent about limitations (especially closure)

  For the three test cases:
  1. The checkpoint routine case should probably pass both tests
  2. The satellite imagery case should likely fail sensitivity (can't see inside structures)
  3. The uncorroborated source case should clearly fail

  The closure issue is tricky - I'll suggest treating summary claims as separate assertions requiring their own tracking assessment rather than assuming inheritance from components. The procedure should flag when component knowledge doesn't aggregate.

  Gaming possibilities mainly exist in how the method and nearest false-world are defined - I'll need to build in challengability features. The procedure fundamentally can't replace risk assessment or handle certain types of evidence gaps.

  The output should be a clear, numbered procedure with explanatory notes, followed by test case applications and limitations disclosure. Tone should be practical and precise, avoiding philosophy jargon while preserving the epistemological rigor.
answer: |-
  Here's a procedural framework for vetting factual claims using a Nozick-inspired "tracking" approach, designed for human rights analysts. It focuses on **Sensitivity** ("Would we believe this *if it were false*?") and **Adherence** ("Would we believe this *if it were true*?"), with safeguards against common pitfalls. The procedure takes ~15 minutes per claim and produces a standardized output for legal review.

  **Procedure: Claim Tracking Assessment (CTA) - v1.0**

  **Analyst Instructions:** *Complete this for ONE factual claim per form. Answer sequentially. Be ruthlessly specific. Cite evidence IDs. If stuck, note why and escalate.*

  1.  **State the Claim Precisely:**
      *   *Question:* "What *exactly* are we asserting? Write it as a single, testable sentence."
      *   *Rule:* Must include key elements (Who? What? When? Where? How?).
      *   *Output:* "[Claim]"
      *   *Why:* Prevents vagueness; defines the target.

  2.  **Define the Method Rigorously:**
      *   *Question:* "What *specific combination* of sources and verification techniques led us to this belief? List each source type (e.g., Witness A-123, SatImage_2024-05-01, Doc_B) and the *exact* verification step applied (e.g., cross-checked dates with SatImage, corroborated location with Witness B-456, assessed credibility via internal consistency check)."
      *   *Rule:* **Grandmother Lock:** The method description MUST be specific enough that if the claim were false *in a relevant way*, the method could *conceivably* fail to detect that falsity. Avoid vague terms like "reliable source" or "thorough investigation." Name names, cite files, describe *how* verification was done.
      *   *Output:* "Method: Source(s) [List IDs] + Verification [Describe specific actions]."
      *   *Why:* Prevents method "drifting" to guarantee sensitivity.

  3.  **Construct the Nearest False-World (NFW):**
      *   *Question:* "What is the *most plausible, minimally different scenario* where [Claim] is false? Base this *only* on the evidence gaps, alternative explanations suggested by the evidence itself, or the government's *credible* past denials."
      *   *Rules:*
          *   **No Conjuring:** Do *not* invent fantastical scenarios. The NFW must stem directly from limitations in *our evidence* or *plausible counter-narratives* supported by *some* data point.
          *   **Minimal Change:** Alter *only* what's necessary to make the claim false, preserving as much of the surrounding context as possible.
          *   *Example:* Claim: "Soldiers systematically looted Village X on Date Y." NFW: "Looting occurred on Date Y, but it was opportunistic theft by a few soldiers, not systematic policy." (NOT: "Aliens looted Village X.")
      *   *Output:* "NFW: [Description of the plausible false scenario]."

  4.  **Test Sensitivity (Would we believe it if it were false?):**
      *   *Question:* "Applying the *exact same Method* (Step 2), would we *still* have believed [Claim] if the *NFW* (Step 3) was actually the truth?"
      *   *Rules:*
          *   **Trivial Pass Trap:** If the NFW is so distant/different that *no credible method whatsoever* could have detected the truth (e.g., NFW involves perfect secret cover-up with no traces), this does *not* automatically pass. Flag: "Sensitivity Trivially Passes - NFW Too Distant." Escalate to Step 7.
          *   **Honest Assessment:** Be brutal. Would the *specific sources and verification steps* listed in Step 2 have been misled by the NFW? (e.g., Would the same witnesses have given the same account if it was opportunistic? Would the satellite images show something different?).
      *   *Output:* "Sensitivity: [Pass/Fail/Inconclusive/Trivial Pass]." + "[Brief justification - e.g., 'Witnesses likely would have described inconsistency if opportunistic']."

  5.  **Test Adherence (Would we believe it if it were true?):**
      *   *Question:* "If [Claim] *were true*, even under slightly different (but realistic) circumstances (e.g., timing shifted +1 day, perpetrator unit slightly different), would our *exact Method* (Step 2) *still* have detected it and led us to believe it?"
      *   *Rule:* Focus on coverage and robustness. Is our method brittle? (e.g., If the looting started 6 hours later, would our witnesses have still been there? If the earthworks were 10m smaller, would sat analysis have flagged them?).
      *   *Output:* "Adherence: [Pass/Fail/Inconclusive]." + "[Brief justification - e.g., 'Satellite tasking covered +/- 3 days; size threshold met']."

  6.  **Initial Tracking Verdict:**
      *   *Question:* "Based *only* on Steps 4 & 5, does the claim TRACK? (Requires BOTH Sensitivity Pass AND Adherence Pass, without Trivial Pass for Sensitivity)."
      *   *Output:* "Tracking Status: [Tracked / Not Tracked / Inconclusive (Specify why)]."

  7.  **Risk & Uncertainty Handoff:**
      *   *Question:* "List any remaining uncertainties, potential weaknesses in the NFW construction, or reasons why the Sensitivity pass might be trivial. What reputational or legal risks exist if we publish this as 'known' even if it tracks?"
      *   *Rule:* **Mandatory Escalation:** If Sensitivity Trivial Pass, Tracking Status Inconclusive, or significant residual risk is identified, STOP. Do not declare "known." Hand this CTA + the claim to Legal/Senior Reviewer for risk assessment.
      *   *Output:* "Residual Uncertainties/Risks: [List]." + "Escalate to Legal/Senior Review: [Yes/No]."

  **Final Output for Legal:** A completed CTA form (Steps 1-7) for the specific claim.

  ---

  **Addressing Closure (The Summary Claim Problem):**

  *   **It's a Feature (mostly), Not Just a Bug:** Nozick's tracking *correctly* shows that knowing components (e.g., 12 witness accounts) doesn't automatically mean knowing the summary claim (e.g., "standing policy"). The summary claim often involves an *additional inference* (from pattern to policy) or relies on a *different method* (synthesis).
  *   **Solution: Treat Summary Claims Separately.**
      1.  **Define the Summary Claim Precisely** (Step 1): e.g., "The checkpoint operations followed a pre-determined, standing policy issued by Command Z."
      2.  **Define *Its* Method:** This is now the *synthesis method* - e.g., "Analysis of patterns across Witnesses A1-A12 (corroborated timings, consistent procedures, stated orders) + absence of contradictory evidence from Command Z communications (Doc_C, Doc_D reviewed)."
      3.  **Construct *Its* NFW:** e.g., "Each checkpoint team improvised similar routines independently based on local conditions, with no central policy."
      4.  **Test *Its* Sensitivity:** "Using our synthesis method, would we *still* believe this was standing policy if it was actually improvised?" (Could our pattern analysis distinguish independent improvisation from top-down policy?).
      5.  **Test *Its* Adherence:** "If it *were* standing policy, even if slightly adapted locally, would our synthesis method have detected the core policy?"
  *   **Design Around It:** Require separate CTAs for key summary claims. Their methods will often be more complex (pattern analysis, command structure assessment) and their NFWs more challenging. This forces explicit justification for the leap from components to conclusion.

  ---

  **Running the Procedure: Three Cases**

  **Case 1: Twelve witnesses describe the same checkpoint routine → "We know it was standing policy."**

  1.  **Claim:** "Checkpoint operations in District X between Date A and Date B followed a standing policy issued by Regional Command Y."
  2.  **Method:** "Witness Interviews: W1-W12 (ID: INT-2024-001 to 012). Verification: Cross-checked descriptions of procedures (search order, questions asked, fee demands) for consistency; verified witness locations/timings overlapped; assessed internal/external consistency of each account; checked for absence of contradictory procedures in same period/location via source monitoring."
  3.  **NFW:** "Checkpoint commanders in District X independently improvised very similar routines based on common training/local conditions; no formal standing policy was issued by Command Y."
  4.  **Sensitivity:** **FAIL.** *Justification:* "Our method (focused on witness consistency) could easily produce the same belief if routines were independently improvised but similar. We lack direct evidence linking the routine specifically to a Command Y order (e.g., document, order-giver testimony). The consistency is equally explained by the NFW."
  5.  **Adherence:** **PASS.** *Justification:* "If a standing policy existed, our witness interviews across multiple locations/times should have detected the consistent core procedures."
  6.  **Tracking Status:** **Not Tracked.** (Sensitivity Fail).
  7.  **Residual Risks/Handoff:** "High risk government rebuttal: 'You only show consistency, not policy.' NFW is highly plausible. Escalate: **YES**." *Verdict: Procedure blocks the claim. Analysts must strengthen method (find policy link) or weaken claim (e.g., "consistent pattern of operations").*

  **Case 2: Satellite images show new earthworks at alleged detention site → "We know new detention structures were built."**

  1.  **Claim:** "Earthworks observed at Grid Ref Z between Date C and Date D represent the construction of new detention facilities."
  2.  **Method:** "Source: Satellite Imagery (IDs: SAT_IMG_024, SAT_IMG_025). Verification: Geospatial analysis confirmed earth movement, trenching patterns consistent with perimeter construction; dated change detection; compared to defector sketch (Source DF-007) showing alleged facility layout."
  3.  **NFW:** "The earthworks observed are for legitimate construction projects (e.g., warehouse, farm buildings) unrelated to detention."
  4.  **Sensitivity:** **TRIVIAL PASS / FAIL.** *Justification:* "Trivial Pass: Our method (sat imagery analysis) *cannot* distinguish detention facilities from other structures based on earthworks alone. *Any* plausible non-detention NFW (like the one above) would look identical in the imagery. We have no method sensitive to the *function* of the building." → Flag as Trivial Pass due to fundamental method limitation.
  5.  **Adherence:** **PASS.** *Justification:* "If detention structures were built requiring earthworks, our satellite tasking and analysis would have detected those earthworks."
  6.  **Tracking Status:** **Inconclusive (Sensitivity Trivial Pass).**
  7.  **Residual Risks/Handoff:** "High risk: Claim overreaches what imagery can show. NFW is highly plausible and indistinguishable. Escalate: **YES**." *Verdict: Procedure blocks the claim. Analysts must weaken claim (e.g., "earthworks consistent with detention construction" + cite defector) or find functional evidence.*

  **Case 3: Named source + unauthenticated docs re: specific order → "We know Order XYZ was given in writing."**

  1.  **Claim:** "Commander Alpha issued written Order XYZ to Unit Beta on Date E, authorizing Operation Gamma."
  2.  **Method:** "Source: Named Source NS-001 (Testimony). Corroboration: Document (ID: DOC-UNK-005) presented by NS-001 purporting to be Order XYZ. Verification: Source credibility assessment (prior reliability?); assessed internal consistency of NS-001's testimony; attempted but failed to independently authenticate DOC-UNK-005 (watermark? letterhead? signature? chain of custody?)."
  3.  **NFW:** "NS-001 fabricated or was misled about Order XYZ; DOC-UNK-005 is a forgery or misattributed document."
  4.  **Sensitivity:** **FAIL.** *Justification:* "Our method relies entirely on NS-001 and an unauthenticated document they provided. If the NFW is true (forgery/fabrication), our method would *still* produce the belief because we have no way to detect the forgery or fabrication with the current verification steps. Lack of authentication is a critical gap."
  5.  **Adherence:** **PASS.** *Justification:* "If the written order existed and was accessible to NS-001, our method (interviewing NS-001 and obtaining the document) should have led us to believe it existed."
  6.  **Tracking Status:** **Not Tracked.** (Sensitivity Fail).
  7.  **Residual Risks/Handoff:** "Very High risk: Easy forgery claim by government; no independent verification. Escalate: **YES**." *Verdict: Procedure blocks the claim. Confirms your gut feeling.*

  ---

  **Honest Assessment: Gaming & Limitations**

  *   **Gaming Opportunities:**
      *   **Step 2 (Method):** An analyst wanting a "Pass" might define the method too narrowly/artificially to make Sensitivity easier (e.g., "Method: Believing Witness A" for Claim about a policy). **Safeguard:** The "Grandmother Lock" rule forces specificity tied to verification *actions* and multiple sources where relevant. Legal review should challenge artificially narrow methods.
      *   **Step 3 (NFW):** An analyst wanting a "Pass" might construct an implausible, distant NFW to trigger a Trivial Pass or make Sensitivity easy. An analyst wanting a "Fail" might construct an overly convenient NFW. **Safeguard:** Rules demanding NFW be "plausible, minimally different" based on evidence gaps/counter-narratives. Requires intellectual honesty; peer review/Legal should challenge NFW plausibility.
      *   **Step 4/5 (Sensitivity/Adherence Judgment):** Subjectivity exists in assessing "would we still believe." **Safeguard:** Requiring explicit justifications tied to the method and NFW. Peer review and Legal challenge are essential.

  *   **What the Procedure CANNOT Do:**
      1.  **Eliminate Risk:** It identifies epistemic gaps (tracking fails) and flags risks, but the final "publish/don't publish" call incorporating legal/reputational risk is a human judgment (Step 7 Handoff).
      2.  **Prove Truth:** It assesses whether a belief *tracks* truth, not whether the belief *is* true. A Trivial Sensitivity Pass indicates a fundamental evidence gap.
      3.  **Handle Extreme Complexity:** For claims involving vast interconnected evidence or deep historical analysis, a 15-min CTA per claim might be a starting point, not sufficient.
      4.  **Replace Source Validation:** It assumes sources are as described. Assessing source credibility/authenticity *is part of the Method definition and verification steps* but requires separate protocols.
      5.  **Solve All Justification:** While "cashing out" justification in tracking terms, deep philosophical debates about evidence, induction, or what constitutes a "method" aren't resolved. It provides a *practical, consistent operationalization*.
      6.  **Guarantee Rebuttal-Proof:** A government acting in bad faith will rebut anything. This aims to make rebuttals harder by forcing claims to meet a robust, defensible standard *before* publication.

  This procedure forces explicitness about *how* a claim is known (the method), confronts the claim with its *most plausible counter-story* (NFW), and rigorously tests the connection between belief and truth (Sensitivity/Adherence). It turns philosophical insight into actionable due diligence for high-stakes documentation.
