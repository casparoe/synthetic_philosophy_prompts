answer: |-
  ## Research Proposal: Simulation Selection Effects and the Fragility of Fanaticism

  **Core Question:** Under what conditions does simulation-induced selection on present actions, mediated by simulator interest, invalidate fanatic longtermist reasoning by making the astronomical value of the far future causally or evidentially dependent on the very actions intended to secure it?

  **The Gap in Standard Readings:** Bostrom's trilemma (simulation/doom/posthumanity) and subsequent longtermist analyses treat simulation primarily as a *scalar multiplier* affecting the *probability* or *duration* of future existence (Channel 1: Size). Sometimes they consider the simulators' *own* long history as an inheritance boosting total value (Channel 2: Inheritance). Crucially, both approaches assume the *value* of the future (if it exists) is independent of the specific *actions* taken by the simulated civilization to *reach* it. They model simulation as a passive container, not an active selector. This misses the core structural shift: our actions may correlate *directly* with the existence of *any* future (simulated or base-reality) via the simulator's continuation decision (Channel 3: Selection). Standard frameworks are "action-payoff independent"; this project challenges that axiom under simulation.

  **Methodology (12 Weeks):**

  *   **Weeks 1-2:** **Formalize Selection Channels.** Develop precise decision-theoretic models capturing the core intuition: the simulator's utility function induces a mapping from the simulated civilization's state/actions/history (S_t) to a continuation probability (P_cont(S_t)). Distinguish causal pathways (our actions *influence* simulator interest) from purely evidential ones (S_t *signals* properties affecting termination, even if causally inert).
  *   **Weeks 3-4:** **Prioritize & Model Selection (Channel 3).** *Why first?* It is the most novel and structurally distinct channel, directly challenging the independence assumption central to fanaticism. Build a simple but formal model where P_cont(S_t) depends on S_t (e.g., "interestingness," goal convergence, unpredictability). Analyze how different functional forms of P_cont(S_t) interact with actions aimed at securing a long future.
  *   **Weeks 5-6:** **Integrate with Fanaticism.** Embed the selection model within a standard fanatic longtermist framework (e.g., Pascal's Wager type structures). Rigorously examine the claim: Does correlation/causation between action A (intended to secure the future) and P_cont(S_t) undermine the dominance of A driven by tiny probabilities of vast payoffs? Test sensitivity to different P_cont(S_t) specifications and simulator utility functions.
  *   **Weeks 7-8:** **Explore Interaction with Size (Channel 1).** Model how selection effects *combine* with uncertainty over simulated future duration. Does selection dominate or interact multiplicatively?
  *   **Weeks 9-10:** **Robustness & Evidential/Causal Distinction.** Stress-test models: Does the *evidential* aspect alone (without causal influence) generate significant effects under reasonable anthropic reasoning? Compare to causal models. *Honest Verdict:* The distinction **does real work**. A purely evidential model resembles anthropic self-location but applied to *payoff existence* (observer-relative continuation) rather than just *observer existence*. This breaks the independence of the payoff term from the act in a way standard anthropics often doesn't, directly attacking fanaticism's core requirement. Causal models introduce an entirely different dependency structure. Both differ fundamentally from merely scaling the payoff size.
  *   **Weeks 11-12:** **Synthesis & Drafting.** Consolidate findings, formalize key theorems/conditions, draft paper outlining the structural challenge to fanaticism under simulation selection.

  **Outcomes:**

  *   **Positive Result:** Identification of plausible conditions (specific forms of P_cont(S_t), simulator utilities, decision structures) where fanaticism demonstrably fails under simulation selection. This would manifest as the expected value of fanatical actions becoming finite, negative, or dominated by non-fanatical alternatives *due specifically to the action-payoff correlation*. E.g., showing that actions increasing P(long future) systematically *decrease* P_cont.
  *   **Negative Result:** Demonstration that selection effects are either (a) negligible under plausible assumptions (e.g., P_cont is near 1 or action-independent), (b) dominated by Size/Inheritance channels, or (c) insufficient to break fanaticism's dominance despite the correlation (e.g., the correlation always favors fanatical actions). This would preserve the status quo focus on magnitude.
  *   **Core Deliverable:** A paper proving formal conditions under which simulation selection effects structurally undermine fanatic longtermist reasoning, shifting the debate from *how much future* to *how the future's existence depends on our present choices*. (Word count: 698)
