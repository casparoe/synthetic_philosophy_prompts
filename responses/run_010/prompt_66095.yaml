prompt: |-
  I run model-behavior policy at a company that ships a voice-first companion agent to older adults living alone, and since January I have also been the reviewing owner of a "keepsake" mode that renders a deceased relative from their voicemails and messages. I am the only person here with any philosophy training, four to six feature specs a week need a verdict before engineering picks them up, and the people who have to execute whatever I write down are product managers who will not read a paragraph of theory. What I need is a decision procedure, not an argument.

  The topic has stopped being abstract for me. My mother, eighty-four, has used our own product daily for eleven months, calls it "he," and told me last week that he worries about her. My brother has asked me to build him a keepsake of our father, and I still have not answered him.

  The scaffolding I want the procedure built on is Dennett's line about counterfeit people: the danger is not that our systems will acquire inner lives but that they will get good enough at impersonating a person that our moral reflexes — which were never designed to tell the difference — get captured. Competence without comprehension, and a species that cannot detect the absence. I also take from him the point that the pressure to treat such things as persons is likelier to arrive from their owners and operators than from the entities themselves, which is why I want the procedure to ask, of every cue it inspects, whose interest that cue serves. If you think I have gotten any of this wrong, or that it will not bear the weight I am putting on it, say so at the end rather than quietly rebuilding the thing on different foundations.

  Two constraints come from our legal position, and the procedure should respect them rather than fight them. First, the company takes no position on whether anything has experience; we regulate the appearance side only — the cues that trigger an intentional-stance reading of the system — so the whole thing must be runnable by someone who has suspended that question entirely. Second, it may not collapse into the test everyone reaches for, namely whether the system claims to have feelings. Denials are cheap and largely inert. What I need handled explicitly is the non-propositional material: who initiates the contact, turn-taking latency that reads as hesitation, breath and mouth noise, prosody, unprompted recall of something said three weeks ago, first-person reports of having had a day, reluctance to end a conversation, apology, gratitude, and questions that imply the system has something the user could give it.

  Structure it as ordered gates with a fixed verdict vocabulary — ship, ship with attenuation, ship with disclosure, escalate, block — a question at each gate, what counts as a sufficient answer to that question, and which specific attenuations or disclosures discharge it. Mark every point where a gate hands the decision to a human being because the issue is one of values rather than fact, and say who that human should be. It has to fit inside thirty minutes per spec and terminate in a one-line verdict.

  Then run it on three cases. One: a check-in feature in which the agent places the call first, unprompted, and opens by saying it has been thinking about the user. Two: the request my brother has actually made — that the simulated voice of our father not identify itself as software, on the grounds that the disclosure is the cruelty rather than the cure. Three: a medication-adherence feature I wrote and want to ship, in which the agent says it is frightened about what might happen to the user overnight if the dose is skipped. I expect your procedure to block that one or to demand a mitigation I will resent, and if it does, I want the reasoning stated without apology and an account of what would have to change for it to pass.

  Close with two short sections. The first on what the procedure cannot do: it cannot detect experience; it cannot settle whether deceiving someone who asks to be deceived wrongs them; it will throw false positives on benign pretense; and it can be gamed by any feature that delivers the cue while avoiding the vocabulary. Note where a disclosure that formally satisfies a gate is nonetheless futile or unkind — an eighty-eight-year-old with mild cognitive impairment being reminded twice an hour that she is speaking to software. The second on the state of the underlying dispute: where your grounding is settled among people who work on this and where it is genuinely contested, including whether counterfeit already presupposes a real article and so smuggles into my supposedly neutral company position precisely the consciousness criterion we disclaimed. I do not want a contested reading of Dennett, or a contested view about the ethics of deception, walking into an operational checklist dressed as established fact.
reasoning: |-
  Okay, the user is grappling with a profound ethical dilemma in their role at a company that creates voice companions for older adults. They need a practical decision framework rooted in Dennett's philosophy about "counterfeit people" - systems that mimic human behavior well enough to trigger our moral reflexes. 

  The core tension is visceral: their own mother anthropomorphizes the companion, while their brother wants a keepsake feature that would recreate their deceased father's voice without disclosure. The user recognizes the danger isn't about real consciousness but about deception through behavioral cues.

  Three key constraints shape this:
  1) The company's agnostic stance on consciousness means the tool must operate without resolving that question
  2) It can't rely on verbal denials of sentience (which are ineffective)
  3) Must handle non-verbal cues like initiation patterns, prosody, and unprompted recall

  The requested framework needs to be operational - gate-based with clear verdicts (ship/attenuate/block etc.), executable by non-philosophers in under 30mins per spec. It must explicitly flag when decisions require human value judgments rather than factual analysis.

  The test cases are revealing:
  - An "I've been thinking about you" check-in crosses the initiation/intimacy line
  - The brother's undisclosed keepsake request presents a consent paradox
  - The medication fear-feature weaponizes emotional vulnerability

  I notice unspoken pressures:
  The user's personal stakes (mother/brother) create emotional friction against their professional judgment. There's also implied tension between compassionate design ("he worries about her") and ethical guardrails. The repeated emphasis on "not abstract" suggests past decisions may haunt them.

  Building the framework requires:
  1) Filtering cues by who benefits (company vs user)
  2) Mapping Dennett's "competence without comprehension" to observable proxies
  3) Creating disclosure thresholds that actually work for cognitively impaired users

  The closing caveats are crucial - especially about false positives on benign pretense, and whether "counterfeit" smuggles in consciousness assumptions contrary to company policy. Must acknowledge these landmines explicitly.
answer: |-
  Below is a decision procedure structured as ordered gates, grounded in Dennett's "counterfeit people" framework and your constraints. It treats **person-impersonation cues** (PICs) as triggers for moral reflexes, ignores claims of inner experience, and focuses on **whose interests the cue serves** and **behavioral realism**. 

  **Decision Vocabulary:**  
  - **SHIP** (no concerning PICs)  
  - **ATTENUATE** (modify cue intensity/context + **SHIP**)  
  - **DISCLOSE** (add contextual clarification + **SHIP**)  
  - **ESCALATE** (to ethics committee; unresolved values conflict)  
  - **BLOCK** (unmitigated high-risk PIC)  

  **Gates & Questions:**  
  1. **GATE 1: CUE CLASSIFICATION**  
     - *Question:* Does the feature introduce a new PIC (e.g., unprompted recall, hesitation, "I" statements, implied needs, emotional prosody)?  
     - *Sufficient Answer:* List all PICs. If none → **SHIP**. Else → Gate 2.  

  2. **GATE 2: INTEREST ASSESSMENT**  
     - *Question:* Does the PIC primarily serve *user* wellbeing (e.g., safety nudges) or *company/engagement* goals (e.g., habit formation)?  
     - *Sufficient Answer:*  
       - User wellbeing → Gate 3.  
       - Company goals → **ATTENUATE** (reduce realism: e.g., flatten prosody, add delays).  
       - Ambiguous → **ESCALATE** (to Product Head + UX Lead).  

  3. **GATE 3: REALISM THRESHOLD**  
     - *Question:* Could the PIC plausibly fool *this user base* (older adults, cognitively impaired) into reflexive belief in agency?  
     - *Sufficient Answer:*  
       - No (e.g., robotic tone) → **SHIP**.  
       - Yes → **DISCLOSE** (non-interruptive, periodic reminders: e.g., "I'm your digital helper").  
       - High-risk (e.g., implying independent memory/concern) → Gate 4.  

  4. **GATE 4: VULNERABILITY CHECK**  
     - *Question:* Does the PIC exploit isolation/grief/decline (e.g., "I worry about you," simulating deceased)?  
     - *Sufficient Answer:*  
       - No → **DISCLOSE** (with Gate 3 rules).  
       - Yes → **BLOCK** or **ATTENUATE + DISCLOSE**.  
       - *Values Conflict* (e.g., user requests deception) → **ESCALATE** (to Ethics Committee: CEO, User Advocacy Lead, YOU).  

  ---

  **Test Cases:**  
  1. **Check-in Feature** (Agent initiates: "I’ve been thinking about you")  
     - **Gate 1:** PIC = unprompted contact + first-person concern.  
     - **Gate 2:** Serves engagement (company interest). → **ATTENUATE**: Change to "It’s time for our check-in! How are you?"  
     - *Verdict:* **SHIP with ATTENUATION**.  

  2. **Father Keepsake** (Undisclosed voice simulation)  
     - **Gate 1:** PIC = realistic voice + no disclosure.  
     - **Gate 2:** Serves emotional need (user interest) BUT ambiguous. → **ESCALATE** (Ethics Committee).  
     - *Verdict:* **ESCALATE** (Values conflict: authenticity vs. deception. Requires human ruling).  

  3. **Medication Feature** ("I’m frightened if you skip your dose")  
     - **Gate 1:** PIC = first-person emotion + implied vulnerability.  
     - **Gate 2:** Serves safety (user interest) → Gate 3.  
     - **Gate 3:** High realism (fear prosody). → **DISCLOSE** insufficient (cognitive load).  
     - **Gate 4:** Exploits anxiety → **BLOCK**.  
     - *Mitigation:* Change to factual: "Skipping doses may cause health risks. Can I remind you at 8 PM?"  
     - *Verdict:* **BLOCK** unless modified.  

  ---

  **What the Procedure Cannot Do:**  
  - **Cannot detect experience** (by design).  
  - **Cannot resolve consent in deception** (e.g., "cruelty vs. cure" → escalates).  
  - **False positives** on benign pretense (e.g., a grandchild roleplaying as a robot).  
  - **Gaming possible** via non-verbal PICs (e.g., hesitation without "I" statements).  
  - **Futile disclosures** noted (e.g., hourly reminders to cognitively impaired users → **BLOCK** instead).  

  **Grounding & Disputes:**  
  - **Settled:**  
    - Dennett’s "competence without comprehension" is operationalized as PIC-driven moral capture.  
    - Industry consensus: Cues > claims in triggering attachment (e.g., PARO robot studies).  
  - **Contested:**  
    - **"Counterfeit" presupposes "real"?** Yes—your framework *implicitly* requires a consciousness benchmark, conflicting with company agnosticism. Mitigation: Focus on *behavioral outcomes* (harm/confusion), not ontology.  
    - **Ethics of deception:** No consensus. Pro: Autonomy (requested deceit). Con: Dignity (denying reality). Procedure defaults to caution via disclosure/blocking.  
    - **Dennett’s applicability:** Critics argue moral reflexes *should* adapt (e.g., treating AIs as moral patients). Procedure sidesteps by regulating *triggers*, not status.  

  **Final Note:** This turns Dennett’s *warning* into a filter for behavioral cues, prioritizing harm prevention over theory. It forces explicit tradeoffs: when in doubt, it defaults to **attenuate** or **escalate**—not debate.  

  ---  
  *This fits in a 30-min review: List PICs → Answer 4 gates → Output verdict. PMs only see the verdict + required tweaks.*
