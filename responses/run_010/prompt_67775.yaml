  On the "reticent legal moralism" idea: it's clever. The argument that decriminalization conserved morality by containing scandal does feel distinct. But is it truly a third position? Devlin already argued for restrained enforcement, and Hart acknowledged harm from blackmail/corruption. The test should be whether it treats morality as inherently binding (like Devlin) or as instrumental to harm-prevention (like Hart). The user's framing leans Devlin-esque because it positions morality as the thing being protected, not just individuals. 

