answer: |-
  Here’s a structured analysis of your questions, testing Hart/Devlin against the 1967 Act and assessing "reticent legal moralism":

  ### **I. Mapping the 1967 Act Through Hart and Devlin**
  #### **A. Devlin’s Perspective**  
  - **Relevant Parties**: "Society" (the moral majority), Parliament as guardian of shared morality, religious authorities.  
  - **Options in 1966–67**: (1) Maintain total prohibition; (2) Decriminalize with strict conditions to reflect residual public disgust.  
  - **What Ought Parliament Do?**: Decriminalize *only* if public indignation had measurably softened (per disintegration thesis). The Act’s narrow terms (privacy, age 21, territorial exclusions) align with Devlin’s "outer limits of toleration." Arran’s warning against "ostentation" mirrors Devlin’s call for restraint.  
  - **Grounds**: Law must track shifting but persistent public morality to prevent social collapse. Reform concedes morality’s evolution but enforces its residual boundaries.

  #### **B. Hart’s Perspective**  
  - **Relevant Parties**: Individuals (especially gay men), lawmakers guided by rational ethics.  
  - **Options**: (1) Full decriminalization (per harm principle); (2) Minimal state interference.  
  - **What Ought Parliament Do?**: Repeal all criminal penalties for consensual acts (harmless conduct). The Act’s limitations (age discrepancy, privacy rules) are unjustified paternalism or moralism.  
  - **Grounds**: Law should prevent harm (e.g., blackmail, police corruption) but not enforce morality. Prior parliamentary refusal reflects irrational prejudice, not harm prevention.

  ---

  ### **II. Testing Theories Against Reality**  
  | **Feature of 1967 Act**          | **Devlin’s Account**                          | **Hart’s Account**                          |  
  |----------------------------------|-----------------------------------------------|---------------------------------------------|  
  | **Decriminalization itself**     | Victory: Reflects shifted public tolerance    | Victory: Retreat from moral enforcement     |  
  | **Differential age of consent**  | Justified: Residual moral disgust             | Unjustified: No harm basis; pure moralism   |  
  | **Privacy condition**            | Necessary: Shields public from "offence"      | Suspect: Overreach of offence principle     |  
  | **Territorial exclusions**       | Defensible: Local moral differences           | Indefensible: Arbitrary discrimination      |  
  | **10-year parliamentary refusal**| Predictable: Morality shifts slowly           | Unexplained: Prejudice defies harm logic    |  

  **The Puzzle Resolved**:  
  - **Devlin isn’t refuted** because he *allows* for reform when consensus shifts. The Act’s restrictions align with his "restraint" principle.  
  - **Hart’s "victory" is incomplete**: The Act’s moralistic residues violate his harm principle. Harm reduction (e.g., ending blackmail) explains *why* reform occurred but not *its compromised form*.  

  ---

  ### **III. Assessing "Reticent Legal Moralism"**  
  - **Core Thesis**: Decriminalization preserves moral order by containing scandal and delegating enforcement to social stigma.  
  - **Is It a Third Position?**  
    - **Against Hart**: If "conserving moral order" is the state’s goal (not just harm prevention), it *is* moralism. Hart rejects morality as an independent justification.  
    - **Against Devlin**: Devlin demands *active* enforcement; "reticence" uses law’s absence as a moral tactic. Devlin’s "toleration" is pragmatic, not strategic conservation.  
  - **Crucial Test Case**: **Prostitution**.  
    - Hart: Criminalizing solicitation might violate harm principle unless proven to exploit.  
    - Devlin: Public indignation justifies criminalization.  
    - Reticent Moralist: Criminalization preserves order *symbolically* while tolerating private acts. The 1959 Street Offences Act fits this (targeting visibility, not private acts).  
    - **Verdict**: Reticent moralism is **Devlin with tactical nuance**, not a new theory. It shares his core axiom: law exists to shore up communal morality.  

  ---

  ### **IV. What Both Theories Ignore**  
  1. **Expressive Disavowal ("reform ≠ approval")**:  
     - Neither theory explains why law must *signal* moral disapproval while decriminalizing. This performative aspect exceeds their frameworks.  
  2. **Private Member’s Bill Mechanism**:  
     - Hart: No comment on legislative form; focus on outcomes.  
     - Devlin: Assumes Parliament reflects consensus, not evasion of responsibility.  
     - **Cost**: Both miss how institutional design (e.g., delegating "moral risk") mediates legal moralism.  

  ---

  ### **V. The 1990s *Brown* Case (R v Brown [1994])**  
  - **Facts**: Consensual S&M acts prosecuted as assault. Consent was denied as a defense.  
  - **Devlin View**: Validates his thesis—law enforces disgust at "unnatural" acts regardless of privacy.  
  - **Hart View**: Inconsistent with harm principle; consent negates victimhood. Paternalism might apply but was not argued.  
  - **Neither Anticipated?**: Yes. *Brown* reveals **moralism’s persistence in post-1967 jurisprudence**—proving Devlin’s fear of "disintegration" was misplaced, but his core argument endured.  

  ---

  ### **Conclusion**  
  - **1967 Act**: A **qualified victory for Hart** in ending blanket criminalization, but **compromised by Devlin-esque moralism** in its details.  
  - **Reticent Legal Moralism**: A perceptive redescription of **Devlin’s pragmatism**, not a new theory.  
  - **Theories’ Silence**: Both fail to account for law’s *expressive performances* (e.g., disavowing endorsement) and *institutional evasion* (private member’s bill). This gap suggests legal moralism operates through unacknowledged channels.  
  - **Future Research**: Explore how "reticence" manifests in other reforms (e.g., abortion laws with "conscientious objection" clauses).  

  This framework should help convert narrative into argument—centering on how the Act’s *form* (not just existence) tests the limits of Hart/Devlin.
