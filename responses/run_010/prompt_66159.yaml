answer: |-
  ### Joint Statement: Adversarial Collaboration on the Liar Paradox  
  **Part 1: Agreed Claims**  
  Both Camp D (dialetheist) and Camp G (paracomplete "gaps" theorist) endorse the following statements:  

  1. **Inconsistency of Naive Truth with Classical Logic**:  
     The unrestricted **naive truth principle** (embodied by the T-schema: \( \text{True}(\langle \phi \rangle) \leftrightarrow \phi \) for all sentences \(\phi\)) is incompatible with **classical logic**. When applied to self-referential sentences (e.g., the liar sentence \(L\): "This sentence is false"), the T-schema + classical logic generates a contradiction (\(L \land \neg L\)) that, via **explosion** (\(\phi \land \neg \phi \vdash \psi\)), implies triviality (every sentence is true).  

  2. **Necessity of Revision**:  
     To avoid triviality, either:  
     - Classical logic must be revised to block explosion (Camp D’s approach), or  
     - The T-schema must be restricted to "grounded" sentences (Camp G’s approach).  

  3. **Surrendered Inference Rules**:  
     - **Camp D surrenders explosion**: Paraconsistent logics (e.g., LP, FDE) reject the rule that contradictions entail arbitrary conclusions.  
     - **Camp G surrenders excluded middle**: Paracomplete logics (e.g., K3, FDE) reject the universal validity of \(\phi \lor \neg \phi\) for ungrounded sentences.  

  4. **Preservation of Ordinary Mathematics**:  
     - **Camp D’s account**: Mathematics survives because it is **consistent** (devoid of true contradictions). Paraconsistent logic reduces to classical logic in consistent domains, ensuring no loss of mathematical reasoning.  
     - **Camp G’s account**: Mathematics survives because all mathematical statements are **grounded** (true or false). Classical logic holds unrestrictedly for mathematics, as gaps arise only in semantic contexts.  

  5. **Shared Diagnosis**:  
     The liar paradox reveals a fundamental tension between self-reference, truth, and classical logic. Both camps reject "solutions" that arbitrarily restrict self-reference or truth predicates.  

  ---  
  **Part 2: Disagreements Table**  
  *Each row is worded as the respective camp would endorse it.*  

  | Issue | Camp D (Dialetheist) | Camp G (Gaps Theorist) |  
  |-------|----------------------|------------------------|  
  | **Liar sentence status** | The liar sentence is both true and false (a truth-value glut). | The liar sentence is neither true nor false (a truth-value gap). |  
  | **Logic for truth-theoretic reasoning** | Paraconsistent logic (e.g., LP) is necessary: it blocks explosion to preserve the unrestricted T-schema. | Paracomplete logic (e.g., K3) is sufficient: it restricts excluded middle to preserve classical logic for grounded sentences. |  
  | **Cost of revision** | Losing disjunctive syllogism (DS) in glut-contexts is a minor cost; DS remains valid for consistent sentences. | Losing excluded middle (LEM) for ungrounded sentences is a minor cost; LEM holds for all non-semantic discourse. |  
  | **Strengthened liar response** | The strengthened liar ("This sentence is not true") is both true and false; paraconsistency handles higher-order gluts uniformly. | The strengthened liar is gappy; adding a "determinately true" operator reproduces the gap, blocking paradox without gluts. |  
  | **Curry sentence resolution** | Curry sentences ("If this sentence is true, then P") are gluts; paraconsistent conditionals (e.g., with restricted contraction) block arbitrary \(P\). | Curry sentences are gappy; the T-schema fails for conditionals with ungrounded antecedents, blocking the derivation of \(P\). |  

  ---  
  **Part 3: Cruxes**  
  *Sub-questions where new arguments could shift positions. Each includes a shared case and pre-commit predictions.*  

  **Crux 1: Strengthened Liar and Determinacy**  
  - **Question**: Can a "determinately true" operator (\(D\)) avoid gaps/gluts for the strengthened liar (\(SL\): "\(SL\) is not determinately true")?  
  - **Shared case**: Define \(D(\phi)\) as "\(\phi\) is true and not false." Can \(D\) close the gap (for G) or prevent higher-order gluts (for D)?  
  - **Predictions**:  
    - Camp D: \(D\) generates new gluts (\(SL\) is both \(D\) and not \(D\)).  
    - Camp G: \(D\) creates new gaps (\(SL\) is neither \(D\) nor not \(D\)).  

  **Crux 2: Curry Paradox and Conditional Proof**  
  - **Question**: Does the Curry sentence require abandoning conditional proof (CP) or modus ponens (MP)?  
  - **Shared case**: Let \(C\) be "If \(C\) is true, then \(2+2=5\)." Assume CP and MP hold. Derives \(2+2=5\) via T-schema.  
  - **Predictions**:  
    - Camp D: CP/MP fail for Curry conditionals; no arbitrary conclusion.  
    - Camp G: T-schema fails for \(C\); no arbitrary conclusion.  

  **Crux 3: Cost-Benefit Trade-offs**  
  - **Question**: In non-semantic domains, which loss is costlier: disjunctive syllogism (D) or excluded middle (G)?  
  - **Shared case**: Consider a mathematical problem solvable only via LEM (e.g., infinite sets) or DS (e.g., disjunctive cases).  
  - **Predictions**:  
    - Camp D: LEM-loss cripples more mathematics (e.g., non-constructive proofs).  
    - Camp G: DS-loss cripples more reasoning (e.g., case-based arguments).  

  ---  
  **Classification Table**  
  *Pre-commit truth-value assignments for key sentences:*  

  | Sentence | Example | Camp D | Camp G |  
  |----------|---------|--------|--------|  
  | Plain liar | "This sentence is false" | Both | Neither |  
  | Strengthened liar | "This sentence is not true" | Both | Neither |  
  | Truth-teller | "This sentence is true" | Neither | Neither |  
  | Curry sentence | "If this sentence is true, then \(2+2=5\)" | Both | Neither |  
  | Liar-disjunction | "This sentence is false or \(2+2=5\)" | Both | Neither |  

  ---  
  **Honesty Safeguards**  
  - **Agreed section**: No partisan language. Claims 1–5 are neutral:  
    - "Incompatibility" (Claim 1) is mathematical fact.  
    - "Surrendered rules" (Claim 3) are explicit concessions.  
    - "Mathematics survives" (Claim 4) is a shared goal, with separate accounts.  
  - **Disagreements table**: Rows mirror each camp’s phrasing (e.g., "minor cost" matches their published defenses).  
  - **Cruxes**: Shared cases avoid begging the question (e.g., "\(D\) operator" is defined neutrally).  

  ---  
  **Note on Logicians' Consensus vs. Live Disputes**  
  - **Settled**:  
    - Naive truth + classical logic = triviality.  
    - Paraconsistent and paracomplete logics formally avoid triviality.  
    - Self-reference is legitimate (e.g., Gödel-coding).  
  - **Live Fights**:  
    - Whether gluts or gaps better explain semantic phenomena.  
    - The "revenge problem" for higher-order operators (e.g., determinacy).  
    - Empirical costs (e.g., which logic aligns with natural language reasoning).  

  ---  
  **Document Summary**  
  - **Agreed section**: Shared starting points (5 claims).  
  - **Disagreements table**: Contrasting positions (5 rows).  
  - **Cruxes**: Testable sub-questions (3 cases).  
  - **Classification table**: Joint pre-commitments (5 sentences).  

  This draft ensures neither camp is misrepresented. Edits for tone/style are welcome.
