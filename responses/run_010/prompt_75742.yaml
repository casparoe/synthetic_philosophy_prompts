answer: |-
  ### Revised Account of Alignment Tax

  After analyzing your cases and intuitions, I propose a unified account that resolves inconsistencies while preserving your core intuitions. The key insights are:
  - **Tax must be net-negative in capability terms** (not netted against safety benefits)
  - **Baseline is a capability-maximizing rival** (starting from identical resources/position)
  - **Currency is expected competitive advantage** (probability-adjusted capability delta)
  - **Costs are gross operational burdens** (not netted against safety gains)
  - **Intent matters** (measures must be safety-motivated)

  ---

  ### Proposed Principle
  **A measure carries an alignment tax iff:**  
  1. **Motivation**: Adopted primarily for safety/alignment reasons.  
  2. **Burden**: Imposes a capability cost or constraint *that persists in the success state*.  
  3. **Competitive Disadvantage**: Reduces expected competitive advantage relative to a capability-maximizing rival who avoids the measure.  
     - *Expected advantage* = Probability of being ahead × Capability delta  
     - *Success state* = World where the model achieves commercial viability  

  ---

  ### Evaluation of Your Cases
  | # | Your Verdict | Revised Account | Match? | If Overturned: Reason |  
  |---|--------------|-----------------|--------|------------------------|  
  | 1 | Tax          | **Tax**         | ✓      | - |  
  | 2 | Negative tax | **No tax**      | ✓      | - |  
  | 3 | Tax          | **Tax**         | ✓      | - |  
