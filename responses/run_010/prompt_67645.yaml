prompt: |-
  I'm six weeks into a jurisprudence seminar that did the Hart–Devlin exchange on the legal enforcement of morals, and I have to write my final paper on it, and I've hit a wall. The original occasion was a proposal to decriminalise homosexual conduct between consenting adults in Britain, and the positions look simple enough: Devlin says a society is more than a collection of institutions and contracts, that it's held together by a shared moral fabric, that if you let enough of that fabric rot the society itself comes apart, and so the state has at least a prima facie right to punish conduct that is grossly immoral even where nobody is harmed by it. Hart says the disintegration thesis is either an unfounded empirical generalisation with no evidence behind it, or a conceptual sleight of hand where 'society' gets defined so that any change in its morals counts as its death — and either way it can't carry the weight Devlin puts on it. Hart also charges him with sliding between the morality people happen to hold and the morality that is actually right, and with using a test for identifying the shared morality — the gut feelings of revulsion, indignation and disgust of the ordinary reasonable person, the sort you'd find in a jury box — that cannot tell a genuine moral consensus apart from a panic or a prejudice. On paper thats a clean kill.

  Except it isn't, and my reading group is living proof. Three sessions on this now: everybody agrees about the empirical facts of every example we throw at it — cannabis, paying for sex, commercial surrogacy — everybody agrees that state coercion needs a warrant and that mere dislike isn't automatically one, and yet we split down the middle every time and nobody budges an inch. Half the group says the Hartian side is just refusing to see that the criminal law does something other than prevent harm, that it declares and teaches, that a ban on buying sex isn't only an instrument for reducing trafficing but a statement about what kind of community we're claiming to be. The other half says that's Devlin with better vocabulary, and that 'declaration' quietly reimports the contested premise. My own hunch, which I cant defend yet, is that this isn't a substantive disagreement at all: partly verbal, since the two camps mean different things by 'harm' and 'society' — one camp's harm includes the degradation of what a community stands for, the other's excludes it by stipulation — and partly a fight about who carries the burden of proof once coercion is on the table. But I might be wrong about both.

  So diagnose it for me. Is this a verbal dispute, a substantive one, a hidden empirical question (does the disintegration thesis have any testable content at all, and would we recognise the evidence if we saw it?), or two camps answering different questions under one heading — 'may the state punish harmless immorality?' versus 'is harm prevention the only thing a criminal law can express?'. Work from what each side actually argues rather than surveying who weighed in afterwards, and skip the bibliography, I have more than I can read. Tell me which of my two candidate diagnoses survives, or give me a better one, and then say what would count as progress on your diagnosis: a distinction that dissolves the impasse, an empirical finding that would settle it, a change of question — or a reason to think no progress is available and this is just what happens when reasonable people disagree about the point of the criminal law.
reasoning: |-
  Okay, let me unpack this user's problem. They're deep into a jurisprudence seminar on the Hart-Devlin debate and hitting a wall with their final paper. Their reading group keeps splitting down the middle despite agreeing on facts, and they suspect it might be about definitions or burden of proof. 

  First, I need to recognize the core frustration: the debate feels theoretically resolved (Hart's "clean kill") but practically unresolvable in discussion. The user's group keeps re-enacting the same divide over contemporary examples. That's fascinating - it suggests something fundamental about how we conceptualize law's function.

  Hmm... the user's two candidate diagnoses are:
  1) Verbal dispute (different meanings of "harm"/"society")
  2) Burden-of-proof disagreement

  But I think they're missing something deeper. When half the group talks about law "declaring and teaching," they're not just smuggling in Devlin - they're gesturing toward law's expressive function, which Hart never fully engages. That's not verbal; it's a substantive gap in Hart's framework.

  Also interesting how the disintegration thesis haunts both sides. Devlin's version may be flawed, but the underlying anxiety - can a society lose its cohesion through moral fragmentation? - persists. Hart dismisses it as unfounded, but offers no alternative account of social cohesion. No wonder people keep circling back.

  The user's gut sense about burden of proof is sharp though. Hart assumes harm prevention is the default justification, putting the onus on moralists. But what if we see law as inherently expressive? Then the burden shifts - any criminal law must justify its expressive message. That's the unspoken tension in their reading group.

  For progress... empirical evidence won't settle this. We'd need to first agree on what counts as "disintegration" - which brings us right back to definitions. More promising might be reframing: not "may we punish harmless immorality?" but "what kinds of social values merit legal expression?" That forces both sides to articulate their visions of community.

  Alternatively, we could expose Hart's blind spot by asking: if law expresses nothing, why have public trials? Why not just efficient penalty administration? That might reveal the expressive dimension even harm-reductionists accept.

  Ultimately this may be less about resolving the debate than mapping its fault lines. The user's paper could show how this deadlock reveals two irreconcilable conceptions of law: one as social steering mechanism, the other as communal self-definition. The persistence of the disagreement is the insight.
answer: |-
  Your reading group impasse is neither purely verbal nor substantive in the way you suspect—it’s a **clash of foundational paradigms** about law’s purpose. Hart and Devlin aren’t just disagreeing about evidence or definitions; they’re offering incompatible visions of what criminal law *is for*. Here’s the diagnosis, why your hunches are partially right but incomplete, and how to break the deadlock:

  ---

  ### **1. The Core Disagreement: Two Functions of Criminal Law**  
     - **Hart’s Paradigm (Law as Harm-Prevention Tool)**:  
       Criminal law exists *only* to prevent tangible harms (physical, psychological, economic). Morality is irrelevant unless linked to harm. Coercion requires objective justification—**burden of proof is on the state**.  
       *What he dismisses*: Law’s role as a moral teacher or identity-shaping force.  

     - **Devlin’s Paradigm (Law as Moral Cement)**:  
       Criminal law sustains the shared values that bind society. Permitting "gross immorality" (even "harmless") erodes social cohesion—**burden of proof shifts to the reformer** to show decriminalization won’t destabilize society.  
       *What he assumes*: Society is fragile; its survival depends on enforced consensus.  

     Your group’s split mirrors this:  
     - **Camp A** ("Declaration/Teaching"): Echoes Devlin’s *function* but rejects his crude "disintegration thesis." They see law as **expressive**—defining communal identity.  
     - **Camp B** ("Devlin with vocabulary"): Correctly spots that "expression" smuggles in moral enforcement, but misses that Camp A has jettisoned Devlin’s empirical claim about societal collapse.  

  ---

  ### **2. Why Your Diagnoses Need Refining**  
     - **Not Merely Verbal**:  
       Yes, "harm" and "society" are contested (e.g., "harm to social fabric" vs. "direct individual harm"). But this masks a deeper divide: **Is preserving moral consensus a legitimate state interest?** Hart says no; Devlin (and Camp A) say yes. This is substantive.  
       - *Example*: Criminalizing commercial surrogacy. Camp A: "It expresses that humans aren’t commodities." Camp B: "Where’s the coercion-worthy harm?" They aren’t talking past each other—they’re disagreeing on law’s scope.  

     - **Burden of Proof Matters, But Isn’t Root Cause**:  
       Hart places the burden on moralists to prove harm; Devlin places it on liberals to prove safety. Yet your group *agrees on facts* and *still splits*. The real issue is **what counts as a valid justification** for coercion. Camp A accepts "moral expression" as valid; Camp B demands "harm prevention."  

     - **The Hidden Empirical Question is a Red Herring**:  
       Devlin’s disintegration thesis *is* untestable (as Hart says). But Camp A doesn’t rely on it! They’ve replaced societal collapse with **symbolic degradation** ("What does this law say about us?"). This isn’t empirical—it’s about values.  

  ---

  ### **3. A Better Diagnosis: Competing Visions of Legal Legitimacy**  
  The debate reduces to:  
  > **"Can the state use criminal law to enforce shared morality *as an end in itself*?"**  
  - **Hart/No**: Law must serve individual welfare, not communal identity. Morality enforced without harm is tyranny.  
  - **Devlin-Camp A/Yes**: Law is inherently moral; refusing to enforce shared values abandons society’s self-defense.  

  This is why examples (prostitution, surrogacy) split your group:  
  - Camp A asks: *"What message does this law send about our values?"*  
  - Camp B asks: *"Who is harmed in a way that justifies jail?"*  
  **They answer different questions because they prioritize different functions of law.**  

  ---

  ### **4. Paths to Progress**  
     - **Reframe the Question**:  
       Shift from *"Can we criminalize harmless immorality?"* to:  
       > *"Is expressing/shaping communal morality a legitimate function of criminal law—and if so, what constraints apply?"*  
       This forces Camp A to define limits (e.g., "only when reflecting deep consensus?"), and Camp B to engage with law’s expressive power.  

     - **Dissolve the Impasse with a Distinction**:  
       Separate **law’s expressive function** from **Devlin’s enforcement mechanism**. Hartians can concede law *expresses* values (e.g., hate speech laws signal equality) while denying this *alone* justifies criminalization. This exposes Camp A’s need for an additional principle beyond "expression."  

     - **Force Engagement with the Burden**:  
       Challenge both sides:  
       - *To Camp A*: "If law expresses morality, can it *ever* be neutral? Should it enforce all 'shared morals' (e.g., adultery)?"  
       - *To Camp B*: "If harm prevention is law’s only goal, why have public trials? Why not just fines and restitution?"  

     - **Accept Reasonable Disagreement**:  
       This *is* a fundamental divide about liberalism’s limits. Progress may mean mapping why consensus is impossible:  
       - Hart prioritizes **individual autonomy** (law as shield against majorities).  
       - Devlin/Camp A prioritize **communal integrity** (law as glue against fragmentation).  

  ---

  ### **Conclusion**  
  Your candidate diagnoses—verbal dispute and burden of proof—are symptoms, not the disease. The core is **whether criminal law’s purpose includes moral self-definition**. Hart denies this; Devlin’s successors (like Camp A) affirm it but discard his doomsday empiricism. 

  **To break your paper’s wall**: Frame the debate as exposing two irreconcilable ideals of law: *instrumental protector of individuals* vs. *expressive guardian of community*. Argue that Hart "wins" on coercion’s justification but "loses" on capturing law’s social meaning—and that this tension persists because liberal democracies haven’t resolved it. Your reading group isn’t stuck; they’re rehearsing a 60-year stalemate rooted in competing visions of a free society. That’s your insight.
