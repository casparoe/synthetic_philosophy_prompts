prompt: |-
  I am teaching one 80-minute seminar in a master's-level methodology sequence on models of rational choice, with fourteen students who have all completed a term of expected utility theory and know the axioms well enough to recite them. Next week's session is Herbert Simon's critique: satisficing and bounded rationality. I need a teaching plan, not an exposition — I can reconstruct the material myself, and the reading is already assigned. What I lack is the dependency structure, and this is the part I would get wrong on my own.

  Here is my difficulty. The failure mode I expect is the cheap one: students hear "Simon says people do not maximize, they take the first option good enough" and file it as a psychology trivia item about laziness, or conclude that Simon is simply saying people are irrational, and then the session turns into anecdotes about their own apartment hunting. My colleague warns that the sharpest student in the group will arrive with a more damaging objection already formed, roughly that once you charge the agent for the time and effort of searching, the search process and its stopping rule are just ordinary maximization over an enlarged option set, so satisficing names no distinct model — and that my colleague's counter, which I find persuasive but cannot yet articulate crisply, turns on the aspiration level being adjusted in response to how the search is going rather than fixed in advance. Build the sequence so that this objection lands as a productive turn instead of a demolition: tell me precisely where in the order the idea of an endogenous threshold has to be planted so that the objection is available to be answered rather than fatal, and flag every step at which a student could form a belief that will make a later step impossible. I also want the fork handled explicitly, because students will arrive assuming that Simon and the heuristics-and-biases tradition are one continuous project, which I think is wrong in a way that matters for what the normative upshot of satisficing is supposed to be.

  On the carrying example: I had drafted a hiring committee screening applicants, but I suspect it fails, because the case comes with so much institutional furniture — job descriptions, reference letters, anti-discrimination constraints — that students will spend the whole time on whether the committee is behaving fairly and never notice the stopping rule as the object of attention. Tell me what the example must have and what it must lack for this idea to be the only thing visible in it, then either nominate a better candidate and justify the choice against those criteria, or defend the hiring case and explain how to strip it down. Finally, give me one closing question I can put to the room that would distinguish students who have the idea from students who can recite it; my own draft is whether an agent who has costless access to the full option set but follows a fixed threshold rule anyway is satisficing, and I want your view on whether that question actually separates the two groups or quietly begs the point. Note anything you would cut at this level — the secretary problem, search-theory machinery, optimality results — and say so out loud in the room rather than leaving the gap unmarked.

  Open with a single sentence giving me the bottom line on the order and on which misconception must be headed off first. Then the sequence with rough timings, then the verdict on the example, then the misconception map keyed to the step at which each one gets defused, then the closing question and what a good versus a merely fluent answer sounds like. Please keep the whole thing under 700 words.
reasoning: |-
  Hmm, the user is teaching a master's-level seminar on Herbert Simon's critique of rational choice models. They need a teaching plan that prevents students from misinterpreting satisficing as irrational laziness or trivial psychology. The main challenge is handling a sharp student's objection that satisficing is just maximization with search costs, and clarifying that Simon's work is distinct from heuristics-and-biases.

  The user wants a structured sequence where the endogenous aspiration level is introduced early to preempt the maximization objection. They also need a clean example that highlights the stopping rule without distractions, and a closing question to test understanding. The hiring committee example they considered might be too cluttered with institutional details, so a simpler example is needed.

  For the sequence, I should start by activating prior knowledge of EU theory, then introduce the computational critique. The key is to establish the aspiration level as adaptive before presenting satisficing. The apartment hunting example is common but risky; switching to online shopping keeps it simple and focused on the stopping rule.

  The misconception map needs to address: 1) satisficing as irrationality, countered by framing it as rational under constraints; 2) the confusion with heuristics-and-biases, clarified by distinguishing Simon's ecological rationality; 3) the objection that it's just maximization, defused by emphasizing adaptive thresholds.

  The closing question should test if students grasp that satisficing is about costly search. If they answer that a costless agent using a fixed threshold isn't satisficing, they understand the core idea. Timing is tight—80 minutes—so cutting technical details like the secretary problem is necessary, stating it explicitly to avoid gaps.

  Overall, the plan must ensure the endogenous threshold is planted early, the example is stripped down, and misconceptions are addressed step-by-step. The user's colleague's insight about adaptive aspirations is crucial to highlight, making the objection a pivot rather than a derailment.
answer: |-
  **Bottom Line:** Begin by framing satisficing as *rational adaptation* to computational limits, not irrationality, and plant the seed of an *adaptive aspiration level* immediately after introducing the core concept to preempt the "just maximization" objection.

  **Teaching Sequence (80 mins):**

  1.  **(5 min) Activation:** "Recall the *computational demands* of EU maximization: knowing all options, probabilities, utilities, and calculating the optimum. When is this *actually feasible*?" (Goal: Surface tacit assumption of perfect information/computation).
  2.  **(10 min) Core Critique & Satisficing:** Introduce Simon: Problem isn't just utility functions, but *procedural rationality*. Define satisficing: Set an *aspiration level* (threshold of "good enough"), search sequentially, stop at first option meeting it. **Crucial Plant:** "But *how* is that aspiration level set? Is it fixed, or might it change?" Plant: "Simon argued it's *adaptive*, based on experience & search difficulty." (Key: Endogeneity flagged *early*).
  3.  **(25 min) **The Example - Online Product Search:**** "You need a new [common item: USB drive, book]. You search online. Each result takes time to evaluate (read specs/reviews). You have limited time. How do you decide *when to stop* looking and just buy one?" Guide discussion: Ignore exact utilities, focus on *stopping rule*. Contrast: Exhaustive search (impossible), fixed aspiration ("Must be 4.5 stars" - rigid), adaptive aspiration ("Started wanting 4.5, but seeing few options, maybe 4.0 is ok now" OR "Seeing many good ones quickly, now I want 4.7"). **Why it works:** Low institutional baggage, universal experience, cost (time/effort) of *evaluation* per option is clear and central, stopping rule is the *only* decision mechanism visible. *Cut Secretary Problem mechanics, optimality proofs.*
  4.  **(15 min) Bounded Rationality & the Fork:** Define Bounded Rationality broadly: Agents with limited cognitive resources, information, time. **Explicit Fork:** Contrast Simon's *ecological rationality* (satisficing is smart adaptation to the *environment's* complexity) vs. Heuristics-and-Biases (focus on *systematic cognitive errors* relative to a normative standard). Simon: Satisficing *is* rational within bounds; H&B often highlights *irrational* deviations. Normative Upshot (Simon): Design institutions/processes compatible with human cognitive limits.
  5.  **(20 min) The Sharp Objection & Endogenous Threshold:** *Invite the objection:* "One critique is: If you include search costs in the utility function, stopping when marginal cost > marginal benefit *is* maximizing. So isn't satisficing just a special case?" **Pivot Productively:** "Exactly! But Simon's key insight is the *aspiration level itself*. In true satisficing, the *threshold adjusts* during search based on feasibility (e.g., 'options are worse than expected, lower my standards') or aspiration (e.g., 'found something great quickly, raise my standards'). It's *not* a fixed target set before seeing any options. The *adaptive rule* replaces the impossible calculation of full maximization under complexity." Discuss dynamics in the online search example.
  6.  **(5 min) Wrap & Closing Question:** Summarize: Satisficing = rational stopping rule under search costs/complexity, crucially involving *adapting aspirations*. **Closing Question:** "Is an agent who has *costless, instantaneous access* to the entire option set and known utilities, but deliberately chooses the *first* option meeting a fixed aspiration level (e.g., EU > X), truly 'satisficing' in Simon's sense? Why or why not?"

  **Closing Question Verdict:** **It separates.** A *good* answer recognizes: No, this isn't satisficing. Simonian satisficing arises *specifically* from costly search/computation. With costless full access, using a fixed threshold is either irrational (if a better option exists) or trivial maximization (if X is set at the optimum). The core of satisficing is the *procedural response* to the *cost* of finding/assessing options. A *merely fluent* answer might recite "set aspiration, stop at first good enough" without linking it to the necessity imposed by bounded resources.

  **Misconception Map (Keyed to Steps):**

  *   **Satisficing = Irrational Laziness:** Defused in Step 2 (Framing as rational adaptation) & Step 4 (Contrast with H&B).
  *   **Simon = H&B Tradition:** Defused in Step 4 (Explicit Fork: Ecological Rationality vs. Cognitive Errors).
  *   **Satisficing is Just Maximization with Search Costs (Fixed Threshold):** Defused by planting endogeneity in Step 2, directly addressed with endogenous threshold argument in Step 5.
  *   **Aspiration Level is Fixed/Exogenous:** Prevented by planting adaptation in Step 2, solidified in Step 3 (Example), killed in Step 5 (Objection response).
  *   **Normative Upshot is "People are Dumb":** Defused in Step 2 (Rational adaptation), Step 4 (Ecological rationality), Step 5 (Adaptive rule replaces impossible calc).
