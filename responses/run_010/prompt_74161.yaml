prompt: |-
  I run a four-person research team at a small foundation. Every two weeks we ship a 15–20 page assessment memo on some technology or policy question that none of us are actually experts in — recent ones have been whether a city's congestion pricing really cut emissions, and whether a certain battery chemistry is going to get cheap. We get about three person-weeks per memo, my senior analyst has to sign off on the thing before it goes out, and she's simultaneously carrying three other projects.

  Lately we've been leaning much harder on decomposition: hand pieces to a junior hire who's been here four months, or to a model, and have the senior analyst just check the pieces and stitch them together. The idea I keep coming back to is what the alignment people call factored cognition — the thought that a hard cognitive task can be broken into factors each of which is simple enough for a weaker agent to do reliably, and that this only pays when checking a factor is cheaper than doing it yourself. Plus the more extravagant version where you don't stop at one level: the human asks a helper, the helper asks helpers, recursively, and you treat the whole tree as a single cognitive system that's better than anyone inside it.

  What I want is a procedure my team can actually run, not an essay about the concept. Specifically:

  - how to decide whether a given memo task is factorable at all — what makes a task decompose well, and what makes something resist it no matter how you slice it
  - what has to be in the spec for a single factor so that a junior or a model can recieve it and run with it without me in the loop: inputs, output shape, what they're allowed to assume, what "done" looks like, and how they flag that the question itself was malformed
  - how to set up the checking so verification really is cheaper than doing the work, and what to do in the cases where it just isn't
  - how deep to go: when a factor should itself be split, when to stop and do it whole
  - how errors compose — what happens to the memo when one factor is quietly wrong, and what in the procedure is supposed to notice
  - where the procedure stops being a procedure and hands the call back to a person, because it's judgment wearing a checklist's clothes

  Some constraints so this doesn't turn into fantasy: the junior has no background in any of these fields and gets maybe twenty minutes of my time per factor, and the senior analyst can spend at most an hour per memo verifying.

  Be honest about the failure modes I should expect — tasks whose whole value is in the integration, spec-writing that costs more than the task, and the nastiest one, where every factor is wrong in the same direction so nothing looks off locally.

  Then run it on three things from our queue: (1) from the congestion-pricing memo, the sub-task "establish what the evidence says about how much per-mile driving responds to a per-mile charge"; (2) "will this battery chemistry be cost-competitive with incumbents by 2035"; (3) drafting the memos actual argument and recommendations section — the part that says what the foundation should conclude and do. For (3) I want the procedure to give me an answer even if it isn't the answer I'm hoping for.

  Two last asks. Mark the steps you're least sure about, and tell me what would change your mind: what evidence from running this across four or five memos should make me scrap the procedure or some piece of it, and which of the premises I handed you above — the checking-is-cheaper condition, the idea that recursion comes free — you think is most likely to be false in practice. If you think one of them is load-bearing and shaky, say so rather than building around it.
reasoning: |-
  We are going to design a procedure for factoring cognitive tasks in the context of a research team producing assessment memos under tight constraints.

  Key constraints:
  - 3 person-weeks per memo (so 120 hours total for 4 people, but note: senior analyst only spends 1 hour verifying per memo, and junior gets 20 minutes per factor from the manager)
  - Senior analyst (SA) must sign off, and she's carrying three other projects (so time is critical)
  - Junior analyst (JA) has been there 4 months, no background in the field, and can get about 20 minutes per factor from the manager (you)
  - You (manager) are also constrained

  The procedure must address:

  1. **Factorability**: How to decide if a task is factorable.
  2. **Specification for a factor**: Inputs, output shape, assumptions, done condition, and how to flag malformed questions.
  3. **Verification**: How to set up checking so it's cheaper than doing the work, and what to do when it isn't.
  4. **Depth of decomposition**: When to split further and when to stop.
  5. **Error composition**: How errors in one factor affect the whole, and how the procedure catches them.
  6. **Judgment calls**: When the procedure hands back to a person.

  Failure modes to be honest about:
  - Tasks where integration is the main value
  - Spec-writing costs more than the task
  - Systemic errors (all factors wrong in same direction)

  We'll then apply the procedure to three example tasks from the queue.

  ---

  **Procedure: Factored Cognition for Research Memos**

  **Step 0: Pre-decomposition Assessment (Factorability Check)**
  Before decomposing, ask:
  - Is the task inherently holistic? (e.g., tasks that require creative synthesis, nuanced judgment, or are highly interdisciplinary and interdependent)
  - Can the task be broken into parts that are:
    a) Independent (or have minimal interdependence)?
    b) Well-defined with clear inputs and outputs?
    c) Amenable to being done by a junior or model with limited context?
  - If the task is too holistic (e.g., drafting the argument and recommendations section of the memo), it may resist decomposition. In such cases, note that decomposition might only be partial or not beneficial.

  **Rule of Thumb**: If the task can be broken into 3-5 factors that are each 1-5 hours of work for a junior, and the integration is straightforward, then it's factorable. If the task requires continuous back-and-forth or deep domain knowledge, it may not be.

  **Step 1: Specifying a Factor**
  For each factor, the spec must include:
  - **Inputs**: Exactly what data, documents, or prior factors are provided. Be specific (e.g., "Use the spreadsheet 'traffic_data.xlsx', sheet 'pre-post', columns A-E").
  - **Output shape**: Define the format (e.g., "A table with columns: Study, Response Elasticity, Confidence; or a paragraph summarizing the range of elasticities found, with a key study highlighted").
  - **Assumptions**: State clearly what the agent can assume (e.g., "Assume all studies are peer-reviewed unless marked otherwise", or "Do not assume any prior knowledge beyond what's in the provided background doc").
  - **Done condition**: A checklist (e.g., "Output includes at least 5 studies, with a summary statistic and a note on outliers").
  - **Flagging malformed questions**: The agent (junior or model) must be instructed to flag if:
    - The input is missing or corrupt.
    - The question is ambiguous (and they can't resolve it with a 5-minute search).
    - The output shape is impossible given the inputs (e.g., asked for a number but the data is qualitative).
    Flag by sending a specific message (e.g., "FLAG: [reason]") and stop work.

  **Time Budget for Spec Writing**: Aim to spend no more than 20 minutes per factor (your time). Use templates for common factor types (e.g., literature summary, data extraction, cost projection).

  **Step 2: Verification Setup**
  - **Checklist for Verifier (SA or you)**: Create a verification checklist per factor type. For example, for a literature summary factor:
    1. Check that all provided sources are included.
    2. Verify that the summary does not misrepresent any source.
    3. Check that the output format matches the spec.
    4. Spot-check 1-2 key claims against the source.
  - **Cost Comparison**: Verification should take no more than 1/3 the time of doing the factor. If a factor would take a junior 3 hours, verification should be <=1 hour. If verification is estimated to take longer, then:
    - Simplify the factor (break it further?).
    - Or, if it's a critical factor, have the SA do it (but note: this breaks the factoring benefit).
  - **Systemic Error Guard**: For factors that might have correlated errors (e.g., all using the same flawed dataset), assign a separate factor to "critique the dominant data source" or build in cross-checks from independent sources.

  **Step 3: Depth of Decomposition**
  - **When to Split**:
    - If a factor requires more than 5 hours of work for a junior, split it.
    - If a factor has multiple distinct sub-questions (e.g., "find studies" and "extract elasticity from each"), split them.
  - **When to Stop**:
    - When the sub-factor would take <30 minutes (too small, overhead dominates).
    - When the factor is a simple lookup or calculation (e.g., "convert $/kWh to ¢/kWh").
    - When the factor requires judgment that can't be further decomposed (then assign to SA or handle by manager).

  **Step 4: Error Composition and Catching**
  - **Error Propagation**: Errors in one factor can compound if later factors depend on them. Mitigate by:
    - Building verification at each factor (local checks).
    - Having an integration step that checks consistency across factors (e.g., SA's hour includes looking for contradictions).
  - **Catching Systemic Errors**:
    - Require factors to use independent sources/methods where possible.
    - Include a "devil's advocate" factor: assign one factor to challenge the dominant conclusion.
    - Use triangulation: have two juniors do the same factor independently (if critical) and compare.
  - **Procedure's Catch Mechanisms**:
    - Verification at each factor.
    - Integration check by SA: she looks for coherence and flags if the pieces don't fit.

  **Step 5: Judgment Call Handoff**
  If at any step:
  - A factor flags as malformed and after your 20-min intervention it's still unclear.
  - Verification fails twice (the factor is redone and still fails checks).
  - The integration step reveals inconsistencies that require domain knowledge to resolve.
  Then hand back to a person (SA or you) for a judgment call. Document the issue and the decision.

  ---

  **Failure Modes to Expect**
  1. **Integration is the Value**: Some tasks (like the recommendations section) are inherently about synthesizing many inputs. Decomposing might lose the thread. *Mitigation*: Decompose only the evidence-gathering, then have a single person (SA) do the synthesis.
  2. **Spec Overhead**: Writing specs for tiny factors may cost more than doing the work. *Mitigation*: Don't decompose below 1 hour of work. Use templates.
  3. **Systemic Error**: E.g., all battery chemistry factors assume the same optimistic cost projection. *Mitigation*: Assign a factor to "identify and challenge key assumptions". Also, build in independent checks.

  ---

  **Applying the Procedure to Example Tasks**

  **Task 1: Establish what the evidence says about how much per-mile driving responds to a per-mile charge (from congestion pricing memo)**

  - **Factorability**: High. Can be broken into:
    a) Find key studies (using search terms).
    b) Extract elasticity estimates and confidence intervals from each study.
    c) Summarize the range and quality of evidence.

  - **Spec for a Factor (e.g., Extract Elasticity)**:
    - Input: A list of 5-10 study PDFs.
    - Output: Table with columns: Study, Elasticity Estimate, Confidence Interval, Sample Size, Notes on Context.
    - Assume: Elasticity is defined as % change in miles driven per % change in cost per mile.
    - Done: Each study processed, table complete.
    - Flag: If a study doesn't report elasticity or uses a different definition, flag with "FLAG: Definition mismatch in [Study]".

  - **Verification**: SA checks 2-3 random rows against the studies (15 min). Cheaper than extracting all (which might take 2 hours).

  - **Depth**: Three factors (search, extract, summarize). Stop there.

  - **Error Risk**: If one extraction is wrong, it might skew the summary. Mitigation: SA spot-checks during verification.

  **Task 2: Will this battery chemistry be cost-competitive with incumbents by 2035?**

  - **Factorability**: Medium. Requires technical and market knowledge. But can decompose:
    a) Project cost curve for the new chemistry (based on learning rates, material costs).
    b) Project cost curve for incumbents (same).
    c) Compare in 2035 under different scenarios.

  - **Spec for Factor (e.g., Project cost curve for new chemistry)**:
    - Input: List of current cost breakdowns (from 3 sources), learning rate estimates for similar technologies.
    - Output: A table of projected costs for 2025, 2030, 2035 under low/med/high scenarios.
    - Assume: Learning rate of 15% unless source specifies otherwise.
    - Done: Projections for all three scenarios with sources cited.
    - Flag: If current cost data is missing for a key component.

  - **Verification**: SA checks the math for one scenario and one year (10 min). If the factor took 4 hours, this is efficient.

  - **Depth**: Split into three factors (new chem, incumbent, comparison). The first two might be split into data collection and projection, but stop if under 5 hours.

  - **Error Risk**: Systemic if all sources are optimistic. Mitigation: Assign a factor to "gather critiques of the new chemistry's cost projections" and include in the comparison.

  **Task 3: Drafting the memo's argument and recommendations section**

  - **Factorability**: Low. This is inherently synthetic and judgment-heavy. The value is in the integration.

  - **Procedure**:
    - Decompose the input gathering: factors to summarize each key finding (from prior factors) in a structured format (e.g., "Key finding: congestion pricing reduced driving by X%. Confidence: high. Source: studies A, B, C").
    - But the synthesis must be done whole by a human (SA). Give her the structured inputs and 45 minutes to draft.
    - Verification: You (manager) read for coherence (15 min).

  - **Why not factor?** Because the trade-offs and recommendations require weighing incommensurable factors. A junior or model cannot be trusted to make the call.

  - **Error Risk**: If the input factors are wrong, the recommendations will be too. But that's caught upstream.

  ---

  **Marking Uncertain Steps and Premises**

  **Uncertain Steps**:
  - **Verification being cheaper**: I'm least sure about this in complex factors (e.g., battery cost projection). If the factor requires deep expertise to check, the SA might have to redo it. *Evidence to scrap*: If over 4-5 memos, verification time averages >50% of factor time, then the procedure fails.
  - **Recursion comes free**: I'm skeptical. Each layer adds overhead (spec, handoff, integration). *Evidence to scrap*: If decomposing beyond one level (e.g., splitting a factor into sub-factors) leads to >20% time overhead (spec writing, QA) without time savings, then limit to one level.
  - **Systemic error prevention**: The devil's advocate factor might feel like a waste. *Evidence to scrap*: If in 4-5 memos, the devil's advocate factors never change the outcome and take >10% of the time, drop them.

  **Load-bearing but Shaky Premise**:
  The idea that **checking is cheaper than doing** is the most likely to fail. It relies on factors being modular and the checker having the right tools (like checklists). If factors are too complex or interdependent, checking becomes redoing. *Fallback*: For critical factors, have two juniors do it independently and cross-check (but that costs 2x). Or accept that some factors must be done by the SA.

  ---

  **Final Procedure Summary**
  1. **Pre-check**: Is the task factorable? (5 min)
  2. **Decompose** into factors (max 3-5 per task, each 1-5 hours). Write specs (20 min per factor).
  3. **Assign**: To junior or model. Junior flags if stuck.
  4. **Verify**: SA uses checklist per factor (aim for <1/3 factor time).
  5. **Integrate**: SA stitches and checks consistency (within her 1 hour/memo).
  6. **Handoff**: If malformed, verification fails, or integration inconsistency, escalate to manager.

  Start with one memo, track time per step, and adjust.
answer: |-
  Below is a practical, step-by-step procedure for implementing factored cognition in your research team's memo workflow. It's designed for realism under your constraints (e.g., 20 minutes of your time per factor, 1 hour max for senior analyst verification per memo, junior's lack of expertise). I'll address your core questions in sequence, then apply the procedure to your three example tasks, and end with failure modes, uncertainty markers, and premises to test.

  ---

  ### **Core Procedure: Factored Cognition for Research Memos**
  **Goal:** Break down memo tasks into smaller, verifiable factors (sub-tasks) that a junior or AI model can handle, with senior analyst (SA) verification and integration. Total effort per memo must stay under 3 person-weeks (≈120 hours), with SA verification ≤1 hour.

  #### **Step 1: Decide if a Task is Factorable (in ≤5 min)**
  **What makes a task factorable:**
  - **Factorable tasks** have clear, separable components that don't require deep integration or judgment. Signs:
    - Can be split into independent or loosely coupled sub-questions (e.g., "find data sources," "extract key stats," "summarize trends").
    - Output is objective or structured (e.g., numbers, tables, literature summaries).
    - Relies on public data, standard methods (e.g., meta-analysis), or modular research steps.
  - **Resistant tasks** require synthesis, judgment, or context that can't be delegated. Signs:
    - Holistic value (e.g., "draft recommendations" where the whole is greater than the sum of parts).
    - Ambiguous inputs (e.g., vague policy questions with no clear evidence base).
    - High interdependence (e.g., sub-tasks must be revisited as others evolve).
    
  **Procedure:**  
  - **Ask three questions:**  
    1. *"Can this be split into 3–5 standalone sub-tasks, each with a clear input/output?"* (If yes, proceed.)  
    2. *"Does each sub-task require minimal context or expertise?"* (If no, it may resist factoring.)  
    3. *"Is verification likely cheaper than doing it?"* (Estimate: verification should take ≤50% of the work time. If not, skip factoring.)  
  - **If unfactorable:** Assign to SA or yourself. Do not decompose.  
  - **Time:** 5 minutes max per task. Use a checklist (see below).

  #### **Step 2: Write the Factor Spec (in ≤20 min per factor, your time)**
  Each factor spec is a self-contained instruction for a junior or model (e.g., GPT-4, Claude). Aim for clarity to avoid rework.

  **Spec template:**  
  - **Inputs:** Explicit resources (e.g., "Use Dataset X, rows 1–100"; "Search PubMed with query Y"). No ambiguity.  
  - **Output shape:** Format and structure (e.g., "Table with columns: Study, Elasticity, Confidence"; "Bullet list of 3 key risks"; "Numeric range with lower/upper bounds").  
  - **Assumptions:** What to assume (e.g., "Assume all data is from peer-reviewed sources"; "Ignore pre-2010 studies").  
  - **Done condition:** Concrete criteria (e.g., "Output includes 5 data points"; "Uncertainty is quantified").  
  - **Flagging malformed questions:** Junior/model must flag if:  
    - Inputs are missing, unusable, or contradictory.  
    - Task is underspecified (e.g., key terms undefined).  
    - Output is impossible (e.g., data doesn't exist).  
    **Flag protocol:** Pause work and notify you via email/slack: "[FACTOR FLAG] [Task name]: [Specific issue]."  

  **Tips:**  
  - **Reuse specs:** Build a library for common tasks (e.g., "extract numeric estimates from studies").  
  - **Junior vs. model:** Use models for structured tasks (e.g., data extraction); use juniors for tasks needing simple judgment (e.g., categorizing evidence quality).  
  - **Your role:** Spend 20 mins drafting/adapting the spec. Do not over-engineer.

  #### **Step 3: Set Up Verification (SA time ≤1 hour per memo)**
  **Goal:** Make verification cheaper than doing the work (target: ≤50% of factor time).  
  **Procedure:**  
  - **Pre-define verification rules per factor type:**  
    - **Data tasks (e.g., extraction):** SA spot-checks 10–20% of outputs against sources.  
    - **Analysis tasks (e.g., projections):** SA checks methodology (e.g., "Is the learning rate applied correctly?") and 1–2 sample calculations.  
    - **Judgment tasks (e.g., evidence summary):** SA reviews for consistency (e.g., "Do conclusions match inputs?").  
  - **Verification cost > work cost?** If estimated SA time >50% of factor time:  
    - Simplify the factor (e.g., split into smaller pieces).  
    - Use automation (e.g., script checks for data outliers).  
    - If still too costly, assign the factor to SA (abandon factoring for it).  
  - **Systemic error guard:** For high-risk tasks, add a "bias check" factor (e.g., "Find evidence contradicting the main conclusion") to surface correlated errors.

  #### **Step 4: Determine Depth of Decomposition**
  - **Split further if:**  
    - Factor takes >4 hours for a junior.  
    - It has >2 sub-components (e.g., "project battery costs" → "gather raw material prices," "apply learning rate").  
    - Verification is complex (splitting simplifies checking).  
  - **Stop splitting if:**  
    - Factor takes <1 hour (overhead outweighs gains).  
    - Output is simple (e.g., unit conversion, lookup).  
    - It requires judgment (e.g., "rate evidence quality").  
  - **Default depth:** 1–2 levels max (human → junior/model). Avoid recursion—your team lacks bandwidth to manage deep trees.

  #### **Step 5: Handle Error Composition**
  - **How errors spread:** A wrong factor skews downstream factors (e.g., inflated cost projection taints the entire battery analysis).  
  - **Catching errors:**  
    - **Local checks:** Verification per factor (Step 3).  
    - **Integration check:** SA spends 10–15 min per memo looking for inconsistencies (e.g., "Does the evidence summary match the data tables?").  
    - **Bias mitigation:** Include a "challenge" factor (e.g., "Find 3 reasons this battery chemistry might fail").  
  - **If unnoticed:** Systemic errors (all wrong in same direction) are likely if factors share flawed assumptions. Mitigate by diversifying sources/methods.

  #### **Step 6: Hand Back to Humans for Judgment**
  The procedure stops and escalates if:  
  - A factor is flagged as malformed and you can't resolve it in 20 min.  
  - Verification fails twice (e.g., junior redoes work but errors persist).  
  - Integration reveals contradictions requiring expertise.  
  - The task is judgment-heavy (e.g., recommendations).  
  **Who handles it:**  
  - SA for research-intensive issues.  
  - You for strategic/task-definition issues.  

  ---

  ### **Failure Modes to Expect**
  1. **Integration dominates value (e.g., recommendations section):** Factoring gathers pieces but loses coherence. SA ends up redoing work.  
     - **Mitigation:** Decompose only evidence-gathering, not synthesis.  
  2. **Spec overhead exceeds savings:** Writing specs for small factors wastes your time.  
     - **Mitigation:** Only factor tasks >2 hours; use templates.  
  3. **Systemic errors:** All factors err in the same direction (e.g., juniors miss a flawed study affecting all battery projections).  
     - **Mitigation:** Mandate diverse sources; add "bias check" factors.  
  4. **Verification isn't cheaper:** SA spends hours checking complex factors.  
     - **Mitigation:** Cap factor complexity; automate checks.  
  5. **Junior/model churn:** Poor specs lead to rework, blowing time budgets.  
     - **Mitigation:** Pilot on low-risk tasks first.  

  ---

  ### **Applying the Procedure to Your Tasks**
  **Assumptions:** Junior has no expertise; SA has 1 hour/memo; you spend 20 min/factor on specs.  
  **Total time per memo:** Aim for ≤40 hours of work (junior + model), 1 hour SA verification, 1–2 hours of your spec time.

  #### **Task 1: Congestion Pricing Memo – "Establish what the evidence says about how much per-mile driving responds to a per-mile charge"**  
  - **Factorability:** High. Objective, data-driven, decomposable.  
  - **Procedure:**  
    - **Factor 1 (Junior):** "Compile studies on congestion pricing and driving reduction (search terms: 'congestion pricing elasticity vehicle miles traveled'). Output: Table with columns: Study, Location, Elasticity Estimate, Sample Size, Year."  
      - Spec: Inputs: Google Scholar, JSTOR. Assumptions: Peer-reviewed only, 2010–2023. Done: 10+ studies. Flag if no studies found.  
      - Est. time: 3 hours (junior). Verification: SA checks 3 random studies (10 min).  
    - **Factor 2 (Model):** "Calculate average elasticity and range from Factor 1 table. Output: Mean, 90% confidence interval, and notes on outliers."  
      - Spec: Input: Factor 1 table. Assumptions: Use fixed-effects model if n>5. Done: Stats + 1-paragraph caveats. Flag if data inconsistent.  
      - Est. time: 1 hour (model). Verification: SA recalculates mean (5 min).  
    - **Integration:** SA combines output into memo (5 min).  
  - **Risk:** Systemic error if all studies share biases (e.g., same city). Mitigation: Add factor "Find evidence from non-U.S. cities" for diversity.  
  - **Total time:** 4 hours work + 15 min SA verification + 40 min your spec time.  

  #### **Task 2: Battery Memo – "Will this battery chemistry be cost-competitive with incumbents by 2035?"**  
  - **Factorability:** Medium. Projection-heavy but decomposable with constraints.  
  - **Procedure:**  
    - **Factor 1 (Junior):** "Gather current cost data for [chemistry] and incumbents (e.g., lithium-ion). Sources: BloombergNEF, IEA reports. Output: Table with tech, 2023 cost ($/kWh), material breakdown."  
      - Spec: Inputs: Pre-vetted sources list. Assumptions: Use most recent data. Done: Costs for 3+ chemistries. Flag if data gaps >50%.  
      - Est. time: 4 hours. Verification: SA checks 2 sources (10 min).  
    - **Factor 2 (Model):** "Project costs to 2035 using learning rates (assume 15% ±5% for [chemistry], 10% for incumbents). Output: 2035 cost ranges for all techs."  
      - Spec: Input: Factor 1 table. Assumptions: Apply standard learning rate formula. Done: Low/med/high scenarios. Flag if inputs missing.  
      - Est. time: 1 hour. Verification: SA validates formula (10 min).  
    - **Factor 3 (Junior):** "Assess risks: Find 3 expert critiques of [chemistry] scalability. Output: Bullet list of risks with sources."  
      - Spec: Inputs: Academic abstracts, industry reports. Done: 3 risks. Flag if no critiques found.  
      - Est. time: 2 hours. Verification: SA skims one source (5 min).  
    - **Integration:** SA compares outputs and drafts answer (15 min).  
  - **Risk:** Systemic error if learning rates are optimistic (all factors rely on same assumption). Mitigation: Factor 3 explicitly challenges assumptions.  
  - **Total time:** 7 hours work + 40 min SA verification + 60 min your spec time.  

  #### **Task 3: Memo Recommendations – "Draft the argument and recommendations section"**  
  - **Factorability:** Low. Judgment-heavy; value is in synthesis.  
  - **Procedure:**  
    - **Pre-check:** Unfactorable—resists decomposition due to holistic judgment.  
    - **Fallback:**  
      1. Decompose *inputs* only: Assign factors to summarize evidence (e.g., "Summarize congestion pricing findings in 3 bullet points").  
      2. SA synthesizes inputs into recommendations (45 min).  
      3. You verify for alignment with foundation goals (15 min).  
    - **Why it fails factoring:** Juniors/models cannot weigh trade-offs or frame strategic advice. Output would be disjointed.  
    - **Total time:** 2 hours for input factors + 45 min SA + 15 min you. No junior spec time (inputs reused from other tasks).  

  ---

  ### **Uncertainty Markers and Testing**
  **Steps I'm least sure about (★★★):**  
  1. **Verification cost assumption (Step 3):** I assumed SA can verify in ≤50% of work time. In practice, complex factors (e.g., battery projections) may require near-full rework.  
  2. **Recursion depth (Step 4):** I recommended 1–2 levels max, but recursion "for free" is overstated—your team lacks bandwidth to manage trees.  
  3. **Systemic error mitigation (Step 5):** "Bias check" factors may feel redundant and add overhead.  

  **Evidence to Scrap or Change the Procedure:**  
  - Run this for 4–5 memos. Track:  
    - **Time per factor** (work vs. spec vs. verification).  
    - **Error rates** (e.g., % of factors with major errors post-verification).  
    - **SA satisfaction** (e.g., frequency of "I had to redo this").  
  - **Scrap if:**  
    - Verification averages >75% of work time.  
    - Spec writing takes >30% of total memo time.  
    - Systemic errors occur in >20% of memos despite checks.  
  - **Adjust if:**  
    - Juniors flag >50% of factors as malformed (simplify specs).  
    - SA integration consistently overflows 1 hour (reduce factors/memo).  

  **Shakiest Premise:**  
  - **"Checking is cheaper than doing"** is load-bearing and likely false in your context. Your SA is time-pressed, and complex tasks (e.g., battery projections) require expert verification that may equal the work time. If this fails, the entire procedure collapses.  
    - **Why shaky:** Juniors/models lack expertise, so SA must verify rigorously. In early trials, expect SA verification to run high for technical tasks.  
    - **Fallback:** Reserve factoring for simple, mechanical tasks (e.g., data extraction). For judgment-heavy work, use SA from the start.  

  **Second-Shakiest Premise:**  
  - **"Recursion comes free"** is false. Your team can't manage multi-level trees—each layer adds spec, handoff, and integration overhead. I limited depth to 1–2 levels for realism. If even this feels costly, abandon recursion entirely.  

  ---

  **Final Advice:** Start small—apply this to one low-risk task (e.g., Task 1). Measure time/errors, then refine. Focus factoring on data tasks, not judgment. If the SA’s verification consistently exceeds 1 hour/memo, the model won't scale. Remember: **Factoring excels at breaking down research, not synthesis.** Your biggest win will be offloading mechanical work to juniors/models, freeing SA for where she adds unique value.
