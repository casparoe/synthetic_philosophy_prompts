  Regarding fairness in section 2 - this is crucial. Many complicity views already involve relations to collectives. The user might be attacking a straw man if they claim both sides accept the act-slot picture. Non-causal approaches often explicitly reject atomism. Their framework might only apply to consequentialist-leaning variants.

