answer: |-
  Below is a decision tree designed for your political philosophy section on epistocracy vs. democracy. It starts from the observation that "a lot of voters are badly informed and you can see it in the results," and uses **questions only** (no position names until the end) to guide students to a named position. The tree is built around your three specified distinctions:

  1. **Competence Identification**: Is there a non-question-begging way to identify politically competent people?
  2. **Legitimacy**: Does legitimacy require the consent/acceptance of the governed, or is good outcomes (e.g., truth-tracking) sufficient?
  3. **Democracy Comparison**: When evaluating democracy, should we compare it to epistocracy based on democracy as it actually functions or as it could ideally function (e.g., with reforms)?

  Each question is phrased to be answerable by someone with no background knowledge. The tree has 7 terminal leaves (named positions), with 3 empty cells (combinations of answers no one holds). I'll first present the tree, then flag the empty cells and explain why they're empty, and finally note which leaves the tree cannot separate.

  ---

  ### **Decision Tree: Epistocracy vs. Democracy**

  **Start:** Many voters are badly informed, and this has a negative impact on political outcomes.

  1. **Does political legitimacy require the consent or acceptance of the people being ruled?**  
     *(This distinguishes intrinsic vs. instrumental views of legitimacy.)*  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q6.  

  2. **Is there a fair and reliable way to identify who is politically competent (e.g., knowledgeable, rational) without assuming controversial political values?**  
     *(This addresses non-question-begging competence identification.)*  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q4.  

  3. **Should the politically competent have more direct power than ordinary voters?**  
     *(This distinguishes hybrid systems from full democracy.)*  
     - **Yes** → Go to Q3a.  
     - **No** → Position: **Democracy defended as intrinsically valuable** (e.g., as expressing equality or autonomy).  
       *Why? If competence is identifiable but you reject giving the competent more power, you prioritize intrinsic democratic values over outcomes.*  

     **Q3a: Should the competent have veto power over laws, or more votes?**  
     - **Veto power** → Position: **Epistocratic veto** (e.g., expert council can block harmful laws).  
     - **More votes** → Position: **Plural voting** (e.g., educated voters get extra votes).  

  4. **Can democracy realistically be improved (e.g., via education, deliberation) to make better decisions?**  
     *(This addresses the democracy comparison: actual vs. idealized.)*  
     - **Yes** → Position: **Democracy defended as the best available truth-tracking procedure (idealized)**.  
       *Why? You accept the problem but believe democracy can be reformed to outperform epistocracy.*  
     - **No** → Go to Q5.  

  5. **Is random selection of leaders (sortition) better than democracy at avoiding bad outcomes?**  
     - **Yes** → Position: **Sortition** (e.g., randomly chosen assembly replaces elections).  
     - **No** → Position: **Democracy defended as the best available truth-tracking procedure (actual)**.  
       *Why? You reject epistocracy (due to competence issues) and sortition, leaving democracy as the default truth-tracker.*  

  6. **Is there a fair and reliable way to identify who is politically competent without assuming controversial political values?**  
     *(Repeats Q2 for the instrumental-legitimacy branch.)*  
     - **Yes** → Go to Q7.  
     - **No** → Go to Q8.  

  7. **Should the competent rule directly, or simply control voting?**  
     - **Rule directly** → Position: **Rule by the knowledgeable outright** (e.g., philosopher-kings or expert rulers).  
     - **Control voting** → Position: **Restricted suffrage epistocracy** (e.g., only competent citizens can vote).  

  8. **Which system produces better outcomes: actual democracy or random selection (sortition)?**  
     - **Actual democracy** → Position: **Democracy defended as the best available truth-tracking procedure (actual)**.  
     - **Sortition** → Position: **Sortition**.  

  ---

  ### **Named Positions in the Tree**
  The tree leads to 7 distinct positions:
  1. **Democracy defended as intrinsically valuable** (from Q3: "No").
  2. **Epistocratic veto** (from Q3a: "Veto power").
  3. **Plural voting** (from Q3a: "More votes").
  4. **Democracy defended as the best available truth-tracking procedure (idealized)** (from Q4: "Yes").
  5. **Sortition** (from Q5: "Yes" or Q8: "Sortition").
  6. **Democracy defended as the best available truth-tracking procedure (actual)** (from Q5: "No" or Q8: "Actual democracy").
  7. **Rule by the knowledgeable outright** (from Q7: "Rule directly").
  8. **Restricted suffrage epistocracy** (from Q7: "Control voting").

  ---

  ### **Empty Cells (Unheld Combinations)**
  The tree has 3 empty cells based on the 3 binary distinctions (8 possible combinations). These combinations are unheld because they lead to incoherent or unappealing conclusions, not because positions are logically impossible. I'll map them using the distinctions:
  - **Distinction 1 (Competence Identification)**: Can competence be identified? (Yes/No)
  - **Distinction 2 (Legitimacy)**: Does legitimacy require consent? (Yes/No)
  - **Distinction 3 (Democracy Comparison)**: Compare to actual or idealized democracy? (Actual/Idealized)

  | Competence ID? | Consent Required? | Compare to Actual or Ideal? | Why Empty? |
  |----------------|-------------------|------------------------------|------------|
  | **No** | **Yes** | **Idealized** | *Incoherent*: If legitimacy requires consent and competence can't be identified, idealized democracy is irrelevant. You can't demand consent-based reforms while rejecting democracy's improvability. |
  | **No** | **No** | **Idealized** | *Unappealing*: If legitimacy doesn't require consent and competence can't be identified, defending idealized democracy is arbitrary. Why idealize a system you don't see as uniquely legitimate? |
  | **Yes** | **No** | **Idealized** | *Unappealing*: If competence is identifiable and legitimacy is outcome-based, idealizing democracy ignores epistocracy's superiority. No one prefers a worse truth-tracker. |

  **Why no "not thought of yet"?** All empty cells represent unstable or self-undermining views (e.g., valuing consent but rejecting the only consent-compatible systems). They're not merely overlooked; they lack rational appeal.

  ---

  ### **Leaves the Tree Cannot Separate**
  The tree **cannot distinguish** between two paths to the same position:
  - **"Sortition"** is reached from:
    - Q5 (consent required, competence not identifiable, democracy not improvable, sortition chosen).
    - Q8 (consent not required, competence not identifiable, sortition chosen).
  - **"Democracy defended as the best available truth-tracking procedure (actual)"** is reached from:
    - Q5 (consent required, competence not identifiable, democracy not improvable, sortition rejected).
    - Q8 (consent not required, competence not identifiable, actual democracy chosen).

  **Why?** In both cases, the answers to the three key distinctions lead to the same practical conclusion despite different legitimacy assumptions. For sortition, consent is irrelevant if you see it as a superior truth-tracker. For actual democracy, it becomes the "least bad" option when epistocracy and sortition are rejected, regardless of legitimacy.

  ---

  ### **How to Use This Tree**
  - **Handout Format**: Structure it as a flowchart with boxes for questions and arrows for answers. Reveal position names only at the end (or in a key) to avoid biasing students.
  - **Discussion Prompts**: Ask students to defend their answers to each question. For example, "Why might consent be necessary for legitimacy?" or "What makes a competence test 'fair'?"
  - **Empty Cells**: Use these to spark debate. E.g., "Why is no one a consent-based idealized democrat when competence can't be identified?"
  - **Overlaps**: Highlight that sortition and actual democracy can arise from different principles, showing how distinct concerns (consent vs. outcomes) converge on similar solutions.

  This tree covers all major positions (e.g., Brennan's veto, Mill's plural voting, Estlund's democracy defense) while emphasizing the key distinctions. It also exposes students to the "why" of unheld views, reinforcing critical thinking.
