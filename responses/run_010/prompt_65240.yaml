  ... plus power issues, confounds, etc.

  The most dangerous objection is likely the axiomatic challenge about whether their design even constitutes ambiguity - if their manipulation violates technical definitions, the whole argument collapses. They must win this point.

  Their own weakest spot? Probably the claim that belief elicitation contaminates choices - it's provocative but hard to prove. Should prepare evidence.

  Nightmare question: What if second-order beliefs ARE the stable trait? This reframes their core thesis as circular.

