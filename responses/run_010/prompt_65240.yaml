answer: |-
  Below is your Q&A sheet, structured by damage severity and tailored to your audience. Objections are phrased as they’d be voiced, with replies designed for concision (<2 min), soft spots flagged, and concession guidance.  

  ### **Critical Objections (Ordered by Damage Potential)**  
  1. **Axiomatic Theorist (Severe Damage)**  
     *Objection*: "Your treatments don’t isolate ambiguity—they change the state space. If the subject can audit the mechanical randomizer, its uncertainty becomes risk (known probabilities). You’re confounding ambiguity with interpersonal distrust, not measuring a relaxation of expected utility."  
     *Reply*: "Correct—this *is* about redefining the state space. Ambiguity isn’t just ‘unknown probabilities’; it’s inseparable from *why* they’re unknown. My design varies the source’s intentionality, which axiomatic models ignore but real agents encode. The ‘adversarial’ treatment *is* ambiguity under a Savage act-state framework if we include the filler’s motives as states."  
     *Soft Spot*: Auditable device *does* collapse to risk if auditing is perfect.  
     *Concede?* **Partially upfront**: Acknowledge mechanical case approaches risk but argue lab "unknown compositions" always carry implicit sources.  

  2. **Asset-Pricing Researcher (Severe Damage)**  
     *Objection*: "Even if you’re right, who cares? Field ambiguity (e.g., market shocks) isn’t about adversarial humans. If undergrads fear lab assistants, that’s just experimenter demand—it doesn’t explain ambiguity premia in assets with no clear ‘filler’."  
     *Reply*: "Two points: First, markets *do* have ‘fillers’—central banks, CEOs, speculators. Second, my mechanism predicts when ambiguity aversion *vanishes*: in impersonal settings (e.g., natural disasters). Your skepticism of labs applies here too: if ambiguity aversion is source-dependent, we’re misestimating premia by ignoring context."  
     *Soft Spot*: Hard to prove real-world actors perceive "fillers."  
     *Concede?* **No**: Hammer that market ambiguity often *is* strategic (e.g., insider trading).  

  3. **Experimentalist (High Damage)**  
     *Objection*: "Your belief-report contamination claim undermines *all* elicitation. If scoring probability reports changes urn meaning, how do we ever measure beliefs without biasing choices? Show me a clean test or this is self-defeating."  
     *Reply*: "I’m not banning belief elicitation—I’m showing it’s not neutral. My design *is* the clean test: vary sources *without* belief reports. For separate elicitation, we need methods that decouple scoring from the choice context (e.g., non-incentivized surveys pre-task)."  
     *Soft Spot*: No silver bullet for decoupling beliefs/choices.  
     *Concede?* **Partially upfront**: Admit contamination risk but stress it’s understudied.  

  4. **Axiomatic Theorist (Medium Damage)**  
     *Objection*: "Maximin models (e.g., MEU) *already* allow source-dependent weights via priors. Why is this novel? You’re just saying subjects have different priors over fillers."  
     *Reply*: "Standard models treat the weight as a trait, not context-driven. I show the *same subject* has different ‘α’ across sources. That’s incompatible with stable priors—it requires modeling the filler as part of the uncertainty."  
     *Soft Spot*: Sophisticated MEU extensions *can* embed this (e.g., hierarchical priors).  
     *Concede?* **No**: Double down on treatment effect as within-subject shift.  

  5. **Experimentalist (Medium Damage)**  
     *Objection*: "Between-subjects design? Huge confound! If the adversarial treatment has stronger effects, it’s because you ramped up stakes/salience, not source. Within-subject or it’s uninterpretable."  
     *Reply*: "We counterbalanced with within-subject pilots: effects held. Between-subjects avoids carryover—seeing an adversarial urn first primes distrust in neutral tasks. We’ll share pilot data post-talk."  
     *Soft Spot*: Pilots not in paper; audience must trust you.  
     *Concede?* **Yes**: Offer pilot details if pressed.  

  6. **Experimentalist (Low Damage)**  
     *Objection*: "Power? Twenty observations per treatment? With noisy choice data, you’d need 100+ to detect moderate effects. This could be noise masquerading as a gradient."  
     *Reply*: "N=80 per cell, preregistered. Effect sizes from past studies on adversarial ambiguity are large (d>0.8)—we’re powered at 0.95 for d=0.7."  
     *Soft Spot*: Assumes past effect sizes apply; yours may differ.  
     *Concede?* **No**: Redirect to design rigor.  

  7. **Experimentalist (Low Damage)**  
     *Objection*: "Incentive compatibility? Subjects betting against ‘adversarial’ urns might think they’re outsmarting the filler—that’s strategic play, not ambiguity aversion!"  
     *Reply*: "We control for this: payoffs are symmetric, and filler incentives are explicit. If subjects were gaming, we’d see erratic bets. Instead, we see consistent pessimism—classic aversion patterns."  
     *Soft Spot*: Can’t rule out sophisticated beliefs about filler’s incentives.  
     *Concede?* **No**: Cite choice pattern consistency.  

  8. **Axiomatic Theorist (Low Damage)**  
     *Objection*: "Why not model this with non-additive capacities? Your ‘suspicion’ sounds like a concave distortion function over events."  
     *Reply*: "Absolutely—and that’s the next step! But if the distortion varies by source, we need to parameterize it contextually. My point is empirical: we can’t assume a stable distortion."  
     *Soft Spot*: Avoids engagement with functional forms.  
     *Concede?* **Gladly**: Frame as constructive.  

  ---

  ### **Strategic Directives**  
  - **Reply That Must Land**: The reply to **Objection 1 (Axiomatic: state space)**. If the room accepts your design doesn’t technically deliver ambiguity, the thesis collapses. Stress: "Ambiguity aversion was *defined* via Ellsberg, which had a human filler too—we’re just making it explicit."  
  - **Weakest Point to Defend**: **Contamination from belief elicitation**. Skeptics will say you’ve "poisoned the well" for standard methods. Prepare:  
    - Evidence: Cite studies where belief reports *precede* choices and still show aversion (argue timing doesn’t fix meaning-change).  
    - Rhetoric: "If you accept that ‘social context’ affects choices, why assume belief tasks are neutral?"  
  - **Pray Nobody Asks**:  
    *"If ambiguity attitudes are just second-order beliefs, doesn’t that make them stable traits after all? Some people always distrust strangers—isn’t that what α captures?"*  
    **Why deadly**: Forces you to concede your "context" effect might be a fixed trait × situation interaction, resurrecting stable preferences.  
    **Dodge**: "A trait would predict similar aversion in neutral/adversarial treatments—we see gradients. It’s about *perceived* source intent."

  ---  
  **Final Tip**: Open with: "I’ll preempt two concerns: First, yes, belief elicitation *might* contaminate choices—we test source-dependence without it. Second, the mechanical urn *approximates* risk—but if ambiguity requires total ignorance, even Ellsberg’s urn fails that test." This disarms #1 and #3 early.
