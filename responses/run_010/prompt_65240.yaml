  The audience is specialized: experimentalists who run choice tasks, axiomatic decision theorists focused on formal models, and a skeptical asset-pricing researcher. Each group will attack differently. Experimentalists will question methodology, theorists will challenge definitions, the market researcher will dismiss lab relevance.

