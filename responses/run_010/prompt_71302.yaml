  ### Desiderata Table

  | id  | requirement                                                                                                | motivating_case                                                                                                                               | who_insists                                                                 | status                               | cost_of_dropping                                                                 |
  |-----|------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------|--------------------------------------|----------------------------------------------------------------------------------|
