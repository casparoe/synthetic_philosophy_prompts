  | D2  | Must explain cross-cultural stability where it exists, not just divergence.                                | Fake-barn cases eliciting uniform "doesn't know" verdicts across 12+ languages in replication attempts.                                      | Calibration moderates, methodology critics                                  | Negotiable                           | Over-predicts variation; cannot account for robust patterns that survive probes. |
  | D3  | Must operationalize "folk concept" without reification (e.g., via inferential role, not a "thing").        | Causal deviance cases in action theory: "intentionally" judgments vary, but linked to shared causal schema in follow-up tasks.                | Calibration moderates                                                       | Non-negotiable                       | Allows "homonymy" as a catch-all; no testable claims about conceptual structure. |
  | D4  | Must specify non-intuition-requiring evidence for the account itself (e.g., behavioral, linguistic).       | Free will probes: correlation between determinism beliefs and intuition shifts, tested via belief-elicitation ≠ intuition probes.            | All camps (universal falsifiability demand)                                 | Non-negotiable                       | Unfalsifiable; no way to arbitrate between accounts.                             |
  | D5  | Must provide a criterion to distinguish conceptual homonymy from genuine disagreement.                     | Mathematician case: "knows" could mean (a) justified true belief or (b) credit-deserving true belief; East/West split matches this ambiguity. | Strong cross-cultural skeptics                                              | Non-negotiable                       | Homonymy becomes untestable; dissolves all disagreement into "talking past".     |
  | D6  | Must account for expert/non-expert divergence patterns (e.g., whether training converges or fragments).    | Trolley problems: ethicists vs. folk show similar variation, but ethicists display more consistency in justifications.                        | Ruth (training as noise-reducer), skeptics (as indoctrination)              | Camp-prejudice-dressed-as-requirement | Ignores whether expertise refines or distorts the target concept.                |
  | D7  | Must resolve same-syllabus asymmetry (why intra-cultural variation ≠ no fact of the matter).              | Order effects altering knowledge attributions within US samples: treated as noise, not proof "knowledge" is empty.                           | Calibration moderates                                                       | Negotiable                           | Permits inconsistent epistemic standards for variation.                          |
  | D8  | Must differentiate calibration drift (threshold variance) from homonymy (concept variance).                | Skeptical pressure scenarios: both groups reduce "knowledge" attributions under identical counterfactuals, but at different rates.            | Calibration moderates                                                       | Non-negotiable                       | Conflates quantitative shifts (drift) with qualitative splits (homonymy).        |

  ### Unsatisfiable Pair & Most Exclusionary Requirement  
  **Unsatisfiable Pair**: D1 (decouple intuition-as-evidence critiques) and D5 (homonymy criterion) conflict. D5 demands evidence for homonymy that isn’t intuitive (e.g., behavioral tests for "concept borders"). But any such test (e.g., "does this inference pattern hold?") risks smuggling in *new* intuitions about inference validity. If D1 forbids this, homonymy becomes unverifiable; if relaxed, the account relies on intuitions it critiques.  

  **Most Exclusionary Requirement**: D5 (homonymy/disagreement criterion) eliminates nearly all accounts. Ruth’s view rejects homonymy as artifactual, so lacks tools to detect it. Strong skepticism assumes homonymy by default, so no criterion is needed. Calibration drift presumes shared concepts, making homonymy exceptional. D5 requires a gold standard for concept-identity that avoids intuitions—e.g., neural correlates or cross-cultural language use—but these are either circular (presupposing concept identity) or philosophically inert.  

  ### Stance Evaluation  
  - **Ruth’s artifact-deflation**: Excels at D1 (all variation is noise), D4 (focus on replication failures), D7 (asymmetry as bias). Fails D2 (ignores stability), D3 (no conceptual analysis), D5 (homonymy undetectable).  
  - **Strong skepticism**: Excels at D5 (presumes homonymy), D7 (asymmetry exposes bias). Fails D2 (stability unexplained), D8 (no drift/homonymy distinction).  
  - **Calibration-drift**: Excels at D2 (explains stability/drift), D3 (concepts as inferential), D8 (thresholds vs. concepts). Fails D5 (no non-circular homonymy test), D7 (asymmetry unresolved).  

