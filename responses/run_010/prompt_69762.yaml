answer: |-
  ## MEMORANDUM  
  **To:** Digital Citizenship Task Force  
  **From:** Doctoral Student Representative  
  **Date:** October 17, 2023  
  **Subject:** Recommendation for Scaling Provenance Module (Arm B) with Design Modifications  

  ---

  ### 1. Bottom Line  
  Recommend scaling Arm B (Provenance) to all first-years starting Fall 2024. Discontinue Arm A (Crossfeed) and the control. Spring 2024 will be used by the Library and Instructional Design to revise Provenance: replace our curated source list with student-sourced claims and integrate structured peer-review. Implementation begins May 2024. If revised Provenance fails to improve factual quiz scores by ≥5 points over control or sees ≥10% trust decline in Year 1, we pause and reassess. Total cost: $165k (development, training, assessment).  

  ---

  ### 2. What the Pilot Actually Shows  
  The pilot reveals distinct outcomes requiring separate interpretation.  

  **Arm B (Provenance):** Demonstrated a clear, sustained gain in factual knowledge (+8 points over control at both intervals) without increasing affective polarization. This suggests skill-building in source evaluation transfers to identifying accurate claims. However, the trust survey was flat—students didn’t distrust more, but didn’t learn to *trust* appropriately either. The reliance on *our* curated "reference-grade" sources is a critical ambiguity: did students learn generalizable skills, or just to trust our list?  

  **Arm A (Crossfeed):** Produced concerning results. Affective polarization worsened significantly (-0.4 SD vs. control), and factual knowledge showed no gain. Critically, trust collapsed *uniformly* across all outlets and institutions surveyed—not a redistribution, but a broad decrease in willingness to believe *any* source. This, coupled with high non-completion, suggests the intervention triggered systemic skepticism, not selective critique.  

  **Arm C (Control):** Baseline performance confirms the quiz measures something meaningful (scores didn’t drift significantly). Its polarization and trust metrics provide a necessary reference point, showing the other arms’ effects weren’t mere noise.  

  Arm A’s trust collapse is the most decisive result. Arm B’s knowledge gain is robust but potentially bounded by its design. Polarization’s rise in Arm A is a negative outcome because it indicates increased intergroup hostility without offsetting epistemic gains.  

  ---

  ### 3. The Mechanism We're Betting On  
  The choice hinges on diagnosing *why* Crossfeed failed and whether Provenance addresses the core deficit.  

  Arm A’s results are consistent with a **distrust-confirmation mechanism**: students who entered already skeptical of opposing outlets (having been actively taught distrust, not merely lacking exposure) interpreted the forced exposure as validation that "the other side" is indeed unreliable or manipulative. Crucially, this generalized, eroding trust even in previously credible sources. Exposure alone, especially when mandatory and source-labeled, reinforced the belief that information ecosystems are universally compromised.  

  Provenance, conversely, targets **epistemic competence**—the ability to evaluate claims based on process and evidence, not source identity. Its success on factual quizzes suggests this skill can be taught. Scaling Provenance bets that competence precedes trust: students must first reliably distinguish well-supported claims before they can rationally calibrate trust in sources. Rebuilding trust requires demonstrating *how* knowledge is built reliably, not just presenting opposing content from distrusted entities. Crossfeed assumed exposure could bridge divides; Provenance addresses the foundational skill needed to make exposure potentially productive later.  

  ---

  ### 4. The Strongest Case Against This Recommendation  
  **The Chair’s Argument (Exposure Backfire):** "Scaling Provenance ignores the pilot’s starkest lesson: exposure to opposing views actively harms cohesion. Provenance avoids the hard problem—political disagreement—by focusing on 'safe' scientific or institutional claims. We risk graduating students who excel at debunking minor inaccuracies but remain entrenched in affective bubbles. Crossfeed’s failure proves exposure under any structured format is inherently counterproductive; we should abandon this track entirely (Option 3) and invest in non-curricular initiatives."  

  **The Dean’s Argument (Design Flaw & Mission Creep):** "Rejecting Crossfeed based on *this* implementation concedes too much. Its failure stemmed from being a top-down, compliance-driven exercise—students knew *we* built the feeds, making it feel coercive. Scaling Provenance doubles down on the same curated, authority-driven model, just with different content. If we become arbiters of 'proper' source evaluation, we exceed our mandate and risk teaching students that institutional approval defines truth. We must either redesign Crossfeed as a voluntary, discussion-based forum (Option 2) or accept we cannot mandate viewpoint engagement (Option 3)."  

  **Arm B’s Curation Problem:** Provenance’s reliance on *our* pre-approved source list is its deepest flaw. Scaling it without change risks institutionalizing a "trusted sources" canon, undermining the critical thinking we aim to teach. Students may learn to perform evaluations only on vetted materials, failing to transfer skills to novel, contested claims.  

  ---

  ### 5. Conditions and Kill Criteria  
  **For Scaling Provenance (Year 1):**  
  - **Revise:** If factual gains fall below +5 points over legacy orientation *or* if trust scores decline >5% in any outlet cohort (left/right/neutral), we redesign in Spring 2025.  
  - **Kill:** If gains fall below +3 points *or* if trust declines >10% overall *or* non-completion exceeds 15%, we suspend and reallocate funds (Option 3).  
  **Regarding Arm A’s Interpretation:** My reading (distrust-confirmation) hinges on the *uniform* trust decline. If a re-run of Crossfeed (voluntary, discussion-focused) shows:  
  1. No trust collapse *and*  
  2. Improved trust/distrust *differentially* (e.g., less trust in hyperpartisan sources, more in centrist) *and*  
  3. Polarization neutral or improved,  
  then the initial failure was likely due to mandatory/curated design, not exposure per se. This would warrant revisiting Option 2.  

  ---

  ### 6. Confidence  
  **Moderate-High Confidence (7/10).** Provenance demonstrated replicable skill gains with no observed harms, and its mechanism addresses the trust collapse observed in Arm A. The critical uncertainty is the **curation problem**. While the proposed redesign (student-sourced claims + peer review) *should* foster transferable skills, we lack direct evidence it mitigates institutional bias. If this redesign underperforms, the dean’s critique gains significant weight. Other elements (cost, scalability, polarization risk) are well-supported by pilot data.  

  ---  
  **Approx. 1,250 words**
