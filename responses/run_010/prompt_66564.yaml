  Here's the joke structured as requested, followed by the two alternative punchlines:

  **The Joke (Setup & Punchline - ~120 words):**

  Right, so there's this legendary queue outside the chippy near school – less a neat line, more a sort of 'hopeful huddle' everyone just *knows* is the queue. My mate Sam? He treats it like a personal challenge. Whenever Baz behind the counter glances away, Sam weaves through the huddle like a ninja, straight to the front, grinning as he gets served. Then there's Lars, this exchange student. Brilliant bloke, but for his first two weeks, he genuinely couldn't spot the queue – just saw a loose crowd waiting. He'd amble vaguely near the front, get utterly baffled looks, eventually figure it out, and shuffle sheepishly back. Now, Sam *knows* the rules – that whole huddle only works 'cos everyone else is politely *not* doing what he does. He gets his hot chips *because* they hold back. Lars? He just got lost. **So, Sam’s not just rude; he’s basically stealing warmth from everyone else’s restraint to heat his supper, while Lars was just temporarily adrift in a cultural fog.**

  ---

  **Alternative Punchlines:**

  1.  **Normal 17yo Punchline:**
      ...Lars? He just got lost. **The crucial difference is, Sam gets away with it looking like a massive tit, while Lars just looked like a massive tit.**

  2.  **Free Rider Punchline:**
      ...Lars? He just got lost. **Sam’s the ultimate free rider: he only gets served quickly by exploiting the very system he dodges, then acts surprised when his chips taste faintly of everyone else’s side-eye.**
