  ### Exhibit: Incident Review Case Study

  #### Scenario
  A production incident occurred when a user-facing service failed. The review panel must assess three factual findings to determine if the incident was "Avoidable" (True) or "Unavoidable" (False) under the team's policy rule. The rule is:  
  **Avoidable = (F1 AND F2) OR (NOT F1 AND F3)**  
  where:  
  - **F1**: The deployment pipeline had a test failure that was ignored.  
  - **F2**: The rollback mechanism was broken at deployment time.  
  - **F3**: The incident was caused by an external dependency failure.  

  All reviewers accept this rule. The panel votes asynchronously without discussion, yielding the ballots below.

  #### Ballot Table
  | Reviewer | F1      | F2      | F3      | Individual Decision (via Rule) |  
  |----------|---------|---------|---------|--------------------------------|  
  | Alice    | True    | False   | False   | (T ∧ F) ∨ (¬T ∧ F) = F ∨ F = **False** (Unavoidable) |  
  | Bob      | False   | False   | True    | (F ∧ F) ∨ (¬F ∧ T) = F ∨ T = **True** (Avoidable) |  
  | Charlie  | True    | True    | True    | (T ∧ T) ∨ (¬T ∧ T) = T ∨ F = **True** (Avoidable) |  

  #### Aggregation and Results
  1. **Majority verdict per finding**:  
     - F1: True (Alice, Charlie) vs. False (Bob) → **True** (2–1)  
     - F2: False (Alice, Bob) vs. True (Charlie) → **False** (2–1)  
     - F3: True (Bob, Charlie) vs. False (Alice) → **True** (2–1)  
     Majority finding set: **(F1=True, F2=False, F3=True)**  

  2. **Decision from majority findings**:  
     Rule: (T ∧ F) ∨ (¬T ∧ T) = (F) ∨ (F ∧ T) = F ∨ F = **False** (Unavoidable).  

  3. **Decision from majority of reviewers' individual decisions**:  
     Individual decisions: Alice=False, Bob=True, Charlie=True → **True** (Avoidable, 2–1).  

  4. **Confirmation of divergence**:  
     - The automated decision from majority findings is **False** (Unavoidable).  
     - The majority of reviewers' individual decisions is **True** (Avoidable).  
     → **Disagreement exists.**  
     - The majority finding set (F1=True, F2=False, F3=True) is held by **no individual reviewer**:  
       - Alice: (T, F, F) — differs on F3.  
       - Bob: (F, F, T) — differs on F1.  
       - Charlie: (T, T, T) — differs on F2.  

  #### Testing Proposed Fixes
  1. **Requiring unanimity/supermajority per finding**:  
     - If we require unanimity for each finding, no finding passes (F1: 2–1 not unanimous; F2: 2–1 not; F3: 2–1 not). **No decision is produced.**  
     - If we require 2/3 majority (status quo), the problem persists as above. **Disagreement remains.**  

  2. **Re-sequencing: Vote on decision first, then record findings**:  
     - Step 1: Direct vote on decision → Alice=False, Bob=True, Charlie=True → **True** (Avoidable) recorded.  
     - Step 2: Record findings via majority → (F1=True, F2=False, F3=True).  
     - New problem: The findings imply **False** (Unavoidable) under the rule, **contradicting the recorded decision (True)**. This creates audit confusion.  
     - Strategic misreporting risk: Alice (who prefers False) could misreport F2 as True to force the findings to imply True under the rule (making the log consistent). If she lies, her ballot becomes (F1=True, F2=True, F3=False), which yields True via rule. The majority findings would then be F1=True (unchanged), F2=True (Alice now True, Bob False, Charlie True → True), F3=True (unchanged) → Rule: (T ∧ T) ∨ (¬T ∧ T) = T ∨ F = True, matching the decision. Alice **misreports F2** to align the log.  

  #### Requirement Tension Analysis  
  The requirements—**logging a single set of findings for audit** and **ensuring the decision matches the panel majority**—are **not jointly satisfiable** for automated rules. This case demonstrates that:  
  - Aggregating findings first can override the panel majority.  
  - Voting on the decision first breaks the rule-based link to findings, risking log inconsistency or strategic voting.  
  **Principled choice**: The finding-log requirement should yield. Audit relies on factual findings to diagnose incidents, and a rule applied faithfully to those findings is more objective than a direct vote (which may introduce subjectivity beyond the findings). Overruling the panel is a tradeoff for audit integrity, not arbitrariness.  

  #### Diagnosis  
  - **Key feature causing divergence**: The **non-separable rule** (where F1’s value changes F2/F3’s impact). Removing this (e.g., using a separable rule like F1 AND F2) reduces but doesn’t eliminate risk (see note below).  
  - **Effect of removing the feature**: A separable rule (e.g., conjunction) can still cause divergence if no reviewer holds the majority set, but complex rules (with disjunctions/negations) exacerbate it.  
  - **Defender’s counterargument**: A defender of the current system might argue that real panels would converge on consistent findings through discussion, making this case "theoretical."  
  - **Impact of discussion**: Allowing reviewers to see ballots and argue **could dissolve the problem** (e.g., persuading Bob to accept F1=True). However, an asynchronous distributed panel loses timely consensus-building, increasing the risk of inconsistent ballots.  

  #### Additional Context  
  A general result (the *doctrinal paradox* impossibility) bounds fixes: No aggregation method guarantees both (1) the decision equals the rule applied to aggregated findings and (2) matches the panel majority, for all rules and vote distributions. This rules out "clever" aggregation rules (e.g., prioritization or weighting) as universal solutions.  

  ---  
  This case uses a realistic rule and ballots to show that our current approach can override the panel majority. It is not an edge case but a consequence of aggregating interdependent findings.
