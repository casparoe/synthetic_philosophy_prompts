  Charlie: F1=F, F2=F, F3=F -> F OR (F AND F)= F

  Now majority findings:
  F1: T,F,F -> F
  F2: T,T,F -> T
  F3: F,T,F -> F

  Majority set: F1=F, F2=T, F3=F

  Apply rule: F OR (T AND F)= F OR F= F

  Individual decisions: Alice T, Bob T, Charlie F -> majority T (Avoidable). So disagreement: automated F, majority T.

  Now, check if majority set (F, T, F) is held by anyone?
  Alice: T,T,F -> no
  Bob: F,T,T -> no
  Charlie: F,F,F -> no

  Good.

  So we can use:

  **Ballot Table for Rule: F1 OR (F2 AND F3)**

  | Reviewer | F1: Test skipped? | F2: Rollback broken? | F3: Caused by our change? | Individual Decision (Avoidable?) |
  |----------|-------------------|----------------------|---------------------------|--------------------------------|
  | Alice    | True              | True                 | False                    | True (because True OR (True AND False)=True) |
  | Bob      | False             | True                 | True                     | True (False OR (True AND True)=True) |
  | Charlie  | False             | False                | False                    | False (False OR (False AND False)=False) |

  Majority findings:
  - F1: True, False, False -> False (majority)
  - F2: True, True, False -> True (majority)
  - F3: False, True, False -> False (majority)

  Majority set: F1=False, F2=True, F3=False

  Apply rule: False OR (True AND False) = False OR False = False (Unavoidable)

  Individual decisions: Alice True, Bob True, Charlie False -> majority True (Avoidable)

  So automated decision: False (Unavoidable), majority of panel: True (Avoidable). Disagreement, and no reviewer holds (False, True, False).

  Now, this rule is a disjunction and might be more realistic.

  But let's stick with the first example for the write-up since we already have it, but the second rule is simpler. However, the first rule had a negation and might be more interesting.

  I think either is acceptable. I'll use the first one for the scenario.

  Now, for the two fixes:

  Fix 1: Requiring unanimity on findings.

  In the first example (with rule (F1∧F2)∨(¬F1∧F3)), the findings are not unanimous on any finding. So if we require unanimity, we have no findings recorded, so we cannot apply the rule. Therefore, we fail to produce a decision. This does not restore agreement; it just fails.

  Fix 2: Vote on the decision first. The panel votes: Alice says Unavoidable (False), Bob says Avoidable (True), Charlie says Avoidable (True). Majority says Avoidable (True). Then we record findings. We record the majority findings: F1=True, F2=False, F3=True. But these findings, when applied to the rule, give Unavoidable (False), which contradicts the recorded decision of Avoidable (True). So the log would show a decision of Avoidable but findings that imply Unavoidable. This is inconsistent.

  Moreover, if a reviewer is strategic, they might change their findings to make the log consistent. For example, Bob might think: the decision is Avoidable, and I believe F1=False, F2=False, F3=True. But to make the rule yield True, he could change F2 to True? But his true belief is F2=False. The rule: (F1 and F2) or (not F1 and F3). With F1=False and F3=True, (not False and True)=True, so it's True. So his true findings already support the decision. Similarly, Alice: she thinks the decision should be False, but the group decision is True. She might be tempted to change her findings so that the rule applied to her findings gives True? But her true findings (T,F,F) give False. If she changes F2 to True, then (T and T) or (F and F)=T, so she can make it True by saying F2=True. But she believes F2 is False. So if she lies and reports F2=True, then her findings become (T,T,F) which gives True, but the group findings would then be: F1: T (Alice T, Bob F, Charlie T -> T), F2: T (Alice T, Bob F, Charlie T -> T? But Bob reports F2=False, Charlie T, so Alice T, Bob F, Charlie T -> T), F3: F (Alice F, Bob T, Charlie T -> T). Wait, no: F3: Alice F, Bob T, Charlie T -> T. So majority set T,T,T -> rule (T and T) or (F and T)=T or F=T, which is the decision. But Alice lied about F2.

  So yes, a reviewer (Alice) can misreport F2 to make the findings consistent with the decision. But she has to lie about a finding.

  In the re-sequenced approach, the decision is already made, so she cannot change the decision by misreporting. But she can make the log consistent by misreporting.

  But the requirement is only about the decision, so if we only care about the decision matching the majority, then the re-sequencing achieves that. But the findings might be falsified.

  Now, the diagnosis:

  The key feature is the non-separable rule (specifically, the conditional dependence in the rule). The rule is such that the truth value of one finding (F1) changes the relevance of the others (F2 or F3). This causes the majority view on the findings to combine in a way that doesn't reflect the majority view on the conclusion.

  If we remove this feature (e.g., use a rule where each finding has a fixed influence, like a simple disjunction or conjunction of a subset), the problem might still occur if the rule is non-monotonic or has dependencies. But the conjunction example also showed the problem.

  A defender of the current implementation might attack the case by arguing that in a real incident, the panel would discuss and converge on a consistent set of findings. If they see each other's ballots and argue, they might change their votes to avoid the inconsistency.

  For example, in our case, the majority set is (F1=T, F2=F, F3=T). But no one holds that set. They might discuss and realize that Bob holds (F1=T, F2=F, F3=T) but wait, in our first example, Bob does hold (T,F,T). In the first example I used:

  Alice: T, F, F -> F
  Bob: F, F, T -> T
  Charlie: T, T, T -> T

  Majority findings: F1: T (from A and C), F2: F (from A and B), F3: T (from B and C) -> set (T,F,T)

  But Bob has (F1=F, F2=F, F3=T) -> not (T,F,T). Alice: T,F,F; Charlie: T,T,T.

  So no one holds (T,F,T). If they discuss, they might argue and change their views. For example, Alice might convince others on F1? But Bob thinks F1 is false. They might not agree.

  In practice, with discussion, they might come to a consensus on one set of findings. Then there would be no problem. But in an asynchronous, distributed panel, discussion might be hard. They might not have time or might not be able to coordinate. So they vote independently.

  If we allow discussion, it might dissolve the problem because they would agree on a consistent set. But it might also lead to groupthink or dominance by one member. The asynchronous system loses the opportunity for deliberation and consensus-building, which might be important for such reviews.

  In conclusion, the case shows that the two requirements (log a single set of findings that imply the decision by the rule, and have the decision match the majority of the panel) are not jointly satisfiable for arbitrary rules and vote distributions. Therefore, we must choose which requirement to relax.

