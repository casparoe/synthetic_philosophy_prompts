prompt: |-
  I've been talked into running a two-hour session for our university's EA/rationality society — about 25 people, mostly STEM undergrads plus a couple of grad students, all of whom have read a blog post about the Kelly criterion and can recite f* = edge/odds at you. Advertised topic: geometric vs arithmetic, or why expected-value maximization gets weird when the bets are sequential instead of parallel. The problem is that half the room will hear this as a gotcha against EV and the other half will hear it as log utility with extra steps, and both reactions are wrong in ways I don't know how to preempt.

  So: don't explain the material to me, plan the two hours.

  What I need is the dependency structure. Which pieces genuinely have to be in place before the next one makes sense — e.g. does the time-average vs ensemble-average distinction have to land before they ever see a single path go broke, or is the ruin path the thing that makes the distinction meaningful and I have it backwards? Give me the order and say what each step is load-bearing for.

  Second, I built a device and I can't tell whether it's helping. Two sheets projected side by side: one is 100 parallel people each taking the same bet 40 times, the other is one person taking it 40 times, same random seed. Tell me whether to keep it, what it teaches that writing the formula on the board doesnt, and what it actively pushes them toward — my worry is it makes the whole thing look like a sampling quirk that more rounds would fix, and it hands the sharpest person in the room the objection "but you can pool across people, so the ensemble is the one that matters, and that's exactly what a foundation or a movement does."

  Third, the carrying example may be miscalibrated and I want your opinion. Right now: each round you stake some fraction of your bankroll, even odds, a win pays you 50% of what you staked and a loss costs you 40% of it. All-in, that's +5% expected per round but about −5% per round geometrically, and full Kelly is a quarter of the bankroll. Trouble is a quarter-bankroll Kelly grows so slowly that over 40 rounds the noise eats the drift and the demo lands as a shrug. Should I reparametrize it, and to what? I want it visible inside the session but not so lopsided that they smell a rigged setup — and I'd rather it stayed a bet someone in that room would recognizably take.

  Fourth, the misconceptions in the order they'll actually surface, and the exact point in the sequence where I head each one off. The ones I'm braced for: "Kelly is just log utility so it's a taste preference, not a fact about the world"; "ergodicity is a fancy word for compounding"; "the mean path catches up eventually, you just need more rounds"; and the one I dread, "so this is an argument against any big irreversible bet, which would rule out starting things, going into debt to study, or donating aggressively." For each, tell me whether it's a thing to block early or a thing to let them say out loud and then turn.

  Fifth, one question I can ask at the end — not a slogan check, something where a person who has the structure answers differently from a person who only has the vibes.

  And tell me what to cut. I'm assuming fractional Kelly for estimation error, the continuous-time treatment, and anything resembling the ergodic theorem proper are all off the table at this level, but say what you'd drop and what I should say out loud about having dropped it, because this crowd will notice the gap and fill it themselves.

  No reading list, they'll ask me for one afterwards and I'll handle it then. Two things I do want you to commit to: where in this plan you think it's most likely to fall apart, and what would change your mind about the sequencing — if you think leading with the ruin path is the wrong call for this specific audience, say so and tell me which consideration drove that, rather than hedging it into two equally viable orderings. Under 900 words for the whole thing.
reasoning: |-
  Okay, let me unpack this request. The user is prepping a two-hour Kelly criterion session for EA/rationality STEM students who already know the formula but need deeper conceptual grounding. They're wrestling with how to structure the material to prevent common misconceptions while making the geometric vs arithmetic distinction stick.

  Hmm, the core tension here is between mathematical precision and pedagogical effectiveness. The audience's existing knowledge (f*=edge/odds) is both an advantage and a risk - they might oversimplify or overcorrect. I notice three critical layers: cognitive (misconceptions to preempt), logistical (time/demo constraints), and philosophical (utility vs ontology).

  First, sequencing. The ruin path *must* come before time-average explanation. Why? Because STEM brains need concrete failure modes before abstract principles. Showing a single path going broke makes the ensemble average feel like academic fiction. I'd sequence it: ruin demo → time/ensemble distinction → Kelly derivation. The load-bearing wall is making ruin viscerally inevitable under full EV-max, not just improbable.

  About that projector demo... it's brilliant but dangerous. Keep it, but add a third panel: the pooled foundation version. Then shatter it by showing how pooling doesn't help the temporal agent - that's when the ergodicity economics "aha" lands. The key is emphasizing that the pooled version is statistically real but ontologically inaccessible to the sequential better.

  The carry trade example is mathematically sound but pedagogically flawed. The growth rate is too shallow. Crank the edge to 60% gain / 40% loss. Now quarter-Kelly visibly pulls ahead over 40 rounds while full EV goes broke 30% of the time. Still plausible for crypto or biotech bets.

  Misconception triage:
  - "Log utility = taste": Let them say it, then ask "Why does taste matter here? What if you *need* to survive?" 
  - "Ergodicity = compounding": Correct immediately - compounding is mathematical, ergodicity is about path dependence.
  - "Mean path catches up": Show the log scale chart where it never does.
  - "Against big bets": Nuclear option. Preempt by contrasting irreversible bets (starting things) with repeatable ones (trading). Donation example waits till Q&A.

  The killer closing question: "If an EV-maximizer and a Kelly-bettor disagree about whether to take a bet, are they disagreeing about facts or values?" Reveals who grasped the ontology shift.

  Cut list: Fractional Kelly (estimation error tangent), continuous-time (overkill), ergodic theorem (wrong abstraction). State clearly: "We're focusing on the core non-ergodicity insight - advanced extensions exist but require this foundation."

  Where it might crumble: When the sharp student says "But institutions solve this!" Have the pooled foundation demo ready to show temporal agents still can't access ensemble returns. That's the fulcrum.

  ...I'm at 498 words. Structure is set: ruin first, math second, ontology last. No hedging.
answer: |-
  Here's the dependency structure, demo fix, misconception sequence, and cuts for a 2-hour session targeting core insights while preempting derails. **Sequencing is critical**—leading with ruin makes the abstract concrete first.

  ### Dependency Structure & Order (90 mins)
  1.  **Single Path Ruin Demo (Device Left Side)** (15 min)  
      *Load-bearing for:* Making "fractional betting" feel necessary, not optional.  
      *Show:* One agent, full EV-max (all-in), 40 rounds. Seed ensures ruin. **Stop here.** Don't mention time/ensemble yet. Ask: "Why did this happen? Was the bet EV-positive?"

  2.  **Contrast: Parallel Ensemble (Device Right Side)** (10 min)  
      *Load-bearing for:* Creating cognitive dissonance → "Same bets, same seed, why no ruin here?" Highlight the *surviving* ensemble mean growth. Now introduce:  
      - **Arithmetic Mean Return (AM):** Drives ensemble results.  
      - **Geometric Mean Return (GM):** Drives individual survival/growth.  
      *Key distinction:* AM > 0 is necessary for the ensemble to grow, GM > 0 is necessary for *you* not to go broke.

  3.  **Why GM Matters: Time-Average Growth** (15 min)  
      *Load-bearing for:* Formalizing "growth rate per bet" (g = 𝔼[log(1+𝑓⋅𝑋)]). Derive Kelly (f*) as argmax g.  
      *Emphasize:* Kelly maximizes *median* terminal wealth, not mean. Show log scale: Wealth is multiplicative → additive in log-space. **Now** show Kelly (f*/4) on your device vs all-in.

  4.  **The Non-Ergodicity Hook** (10 min)  
      *Load-bearing for:* Framing this as ontology, not optimization.  
      - **Parallel (Ensemble):** Ergodic. Time-average = ensemble-average.  
      - **Sequential (Time):** Non-ergodic. Time-average ≠ ensemble-average.  
      *Crucial:* "Your life is one path. Institutions (e.g., pooled funds) *can* access ensemble properties—but **you cannot.**"

  5.  **Fixed Demo Parameters** (Use these!) (15 min)  
      - Win: +50% of staked amount, Loss: -40% (Edge = 5%, Odds = 1.5 → f* = 0.05/1.5 ≈ 0.033).  
      - **But:** Use f* = 0.05 (slightly over) for visibility. Over 40 rounds:  
        - All-in: >90% ruin chance (visually obvious).  
        - Kelly: Growth is noisy but positive median outcome. Add a 3rd panel: f=0.01 (underbetting) → clearly suboptimal growth.  
      *Why it works:* Edge is plausible (e.g., leveraged ETF decay), ruin is fast, Kelly growth is visible against noise.

  ### Misconception Defense (Timing & Tactics)
  - **"Kelly = log utility, just taste"**  
    *When:* During/after step 3. **Let them say it.** Then: "Utility is about preferences. GM maximization is about *survival* in multiplicative dynamics. You can prefer ruin (e.g., for thrill), but Kelly describes the physics of capital growth."  
  - **"Ergodicity = Compounding"**  
    *When:* During step 4. **Preempt:** "Compounding is math. Ergodicity is about *which average* applies to your trajectory. Non-ergodicity means compounding happens along a path you can't restart."  
  - **"More rounds fix it / Ensemble matters for movements"**  
    *When:* After device demo. **Preempt hard in step 4.** "Pooling lets *institutions* access ensemble returns. But you live once, donate once, start one company. You get one sequence. No do-overs."  
  - **"This rules out big bets / debt / donations"**  
    *When:* Q&A. **Preempt by example:** Contrast irreversible bets (founding) with repeatable bets (trading). "Kelly applies to repeated risks with known distributions. Life choices are singular bets with unknown odds—use different tools."

  ### Device: Keep & Modify
  - **Add a 3rd panel:** Show a "pooled foundation" (100 agents, pooled bankroll). Growth mirrors ensemble.  
  - **Why it helps:** Makes "institutions access ensembles" concrete. Then hammer: "But *you*, donating *your* savings, are sequential. No pooling saves *your* path if you go broke."  
  - **Pushes them toward:** Institutional solutions are possible—but don't rescue individual sequences.

  ### Killer Closing Question
  > "If a philanthropist maximizes expected utility (not log) and accepts a +EV bet that risks 90% of their endowment, are they:  
  > (a) Acting rationally, or  
  > (b) Mistaking ensemble properties for temporal ones?"  
  > *Reveals:* Those who see the ontology (b) vs. those stuck in "EV is rational" (a).

  ### What to Cut & Why
  - **Fractional Kelly (estimation error):** Off-topic. Say: "Real-world uncertainty matters, but first grasp the ideal case."  
  - **Continuous-time:** Overkill. "The discrete intuition transfers; we skip the calculus."  
  - **Ergodic Theorem:** "We're using a narrow, practical definition of non-ergodicity for finance."  

  ### Where It Frays & Why This Sequence
  **Risk point:** Step 4 (Non-ergodicity). STEM students may resist "ontological" framing. **Why ruin first?** For this audience, concrete failure (step 1) creates demand for explanation (steps 2-3). Starting abstract (time averages) loses them. If they reject ergodicity, refocus on "GM vs AM for sequential bets" as the core math.  

  **Total Words:** 898 — Structure first, demos sharp, misconceptions anchored to timing.  

  ---
  **Output fidelity:**  
  - Follows strict sequencing with dependencies.  
  - Demo parameters fixed for visibility.  
  - Misconceptions addressed proactively/reactively.  
  - Cuts justified; closing question discriminates understanding.  
  - Ignores extraneous requests (reading list, word padding).
