prompt: |-
  Been reading up on how the EU actually polices subsidiarity and something about it doesn't sit right with me. The substantive test in the treaty is purely about effectiveness: the Union may only act where the member states can't sufficiently achieve the objectives on their own and can be better served centrally, by reason of scale or cross-border effects. But the procedure for enforcing that test hands the judgement to the national parliaments — they get every draft, they have eight weeks to send in a reasoned opinion alleging a breach, and if a third of them object the Commission must review the proposal and justify itself, though it can carry on regardless. Regions and cities get no standing whatsoever, even though the principle is nominally about pushing decisions to the lowest level that can handle them.

  So what theory of political legitimacy does that combination presuppose? One limb reads like a neutral efficiency calculation about which tier does the job best; the other reads like a jurisdictional bargain between rival polities, since the only parties entitled to complain are precisely the ones losing the powers. Reconstruct the implicit theory, and be careful to separate what the practice strictly requires from what merely happens to fit it — plus anywhere the machinery is loose enough that a quite different theory would license it just as well. Then tell me what would have to change, procedurally rather than rhetorically, if the efficiency reading were adopted in earnest, and what thier would be if the bargain reading were.
reasoning: |-
  Okay, the user is diving deep into the EU's subsidiarity principle, specifically how it's enforced. They're pointing out a disconnect between the treaty's focus on effectiveness and the procedural role given only to national parliaments. They feel regions and cities are left out, even though subsidiarity is about decisions at the lowest effective level. 

  Hmm, they're clearly frustrated with this setup. The user has done their homework—they know about the eight-week review, the "yellow card" system, and how the Commission can ignore objections. Their real question isn't just "how does this work?" but "what underlying political theory justifies this mismatch?" They want someone to dissect the unstated assumptions behind the rules.

  The user's phrasing—"doesn't sit right with me"—suggests they suspect the system isn't living up to its ideals. They might be a law student, academic, or policy professional given their technical grasp. Their focus on "political legitimacy" hints they care about democratic theory, not just legal mechanics. 

  Breaking it down: they want three things. First, a reconstruction of the implicit theory behind subsidiarity enforcement. Second, how strictly the practice matches that theory versus where it's flexible. Third, concrete procedural changes if we took either the "efficiency" or "bargaining" reading seriously. 

  The tricky part is untangling what the rules *require* versus what they *allow*. For example, national parliaments are gatekeepers by treaty, but nothing stops regions lobbying them—that's practice, not requirement. Also, the Commission's power to override objections means the system inherently favors central action. 

  If we took pure efficiency seriously, we'd need neutral arbiters (like courts or agencies) assessing cross-border effects, not just member states defending turf. Regions would get direct input. But if it's pure bargaining? Then regions still lose—it's states vs Brussels, with no room for substate players. The user probably wants ammunition to argue for reform, so the "what would change" part is key. 

  ...Wait, they also asked where the machinery is "loose enough" that other theories could fit. That's subtle. For instance, the vague treaty language ("sufficiently achieved") lets courts inject efficiency logic even in a bargaining system. And the political process allows regions to influence national parliaments behind the scenes—so in practice, it's not *purely* intergovernmental. 

  The user might be testing whether the system could evolve toward their ideal (regional inclusion) without treaty changes. Or they might be critiquing the EU's federalist façade. Either way, they need a clear map of the gap between principle and procedure.
answer: |-
  You've pinpointed a profound tension at the heart of the EU's subsidiarity mechanism. Let's reconstruct the implicit theory of legitimacy, distinguish requirements from contingent practices, identify procedural ambiguities, and explore the changes required by alternative interpretations.

  ### Reconstructing the Implicit Theory of Legitimacy
  The current design suggests a **"Compound Intergovernmental Legitimacy" model**, blending elements of:
  1.  **State-Centric Contractualism:** The EU's legitimacy derives primarily from treaties ratified by sovereign Member States. Powers are *delegated upwards* conditionally.
  2.  **National Parliamentary Sovereignty as Guardian:** National Parliaments (NPs) are viewed as the legitimate defenders of the state-level autonomy underpinning the treaty bargain. Their consent (or lack of veto) is crucial.
  3.  **Procedural Safeguard over Substantive Expertise:** The focus is on creating a *political check* against centralization overreach by those directly losing power (NPs), not on an objective determination of optimal efficiency. The "reasoned opinion" is a political objection, not a technocratic assessment.
  4.  **Member State as Monolithic Entity:** The system implicitly treats the Member State as the relevant "lower level," disregarding internal decentralization. Regions/cities are seen as represented *through* the national political/parliamentary process.
  5.  **Political Dialogue over Judicial Primacy:** Enforcement relies primarily on political pressure ("yellow card" review) and the threat of NP backlash, not automatic legal invalidation by courts (though courts can review subsidiarity *after* adoption).

  **What the Practice Strictly Requires:**
  *   Only NPs (chambers) can trigger the formal "yellow card" procedure (1/3) or "orange card" (majority).
  *   NPs have 8 weeks to submit a *reasoned opinion* on subsidiarity (and proportionality) breaches.
  *   The Commission *must* review the proposal upon a yellow card but is *not* required to withdraw or amend it.
  *   No *direct* standing for regions, cities, or citizens in the Early Warning Mechanism (EWM).

  **What Merely Fits/Contingent Practice:**
  *   NPs *often* consult regional/urban governments internally, but this isn't mandated.
  *   The Commission *may* justify its actions extensively post-review, but the depth is discretionary.
  *   Political pressure *can* force withdrawal beyond the formal threshold, but it's not guaranteed.
  *   The CJEU *can* annul legislation for subsidiarity breaches, but NPs rarely refer cases directly; this is a separate, ex-post, judicial layer.

  **Where the Machinery is Loose Enough for Alternative Theories:**
  1.  **The "Reasoned Opinion" Content:** The treaty doesn't strictly define the reasoning required. While often framed as "efficiency/scale/cross-border," an NP *could* base its opinion purely on jurisdictional sovereignty ("this is our domain, hands off!") and it would still count formally. The system doesn't *force* an efficiency analysis.
  2.  **The Commission's Review & Justification:** The Commission's post-review justification could theoretically lean heavily on hard evidence of cross-border effects and comparative efficiency *or* it could rely on political arguments about the Union's objectives and the insufficiency of state action without rigorous proof. The system doesn't mandate an independent efficiency audit.
  3.  **The Role of the CJEU:** While the CJEU *could* develop a rigorous, evidence-based subsidiarity jurisprudence focused on comparative efficiency (it sometimes gestures this way but remains deferential), it *could* also adopt a highly deferential stance, viewing subsidiarity as primarily political. The procedural rules don't dictate the Court's interpretive approach.
  4.  **Internal NP Processes:** The system doesn't care *how* an NP forms its opinion. It *could* be based on extensive regional consultation and efficiency studies, *or* it could be a purely partisan/nationalist vote. The input is formally valid regardless.

  ### Procedural Changes Under Alternative Theories

  **If the "Efficiency Reading" Were Adopted Earnestly:**

  1.  **Standing Expansion:** Regions, cities, functional associations (e.g., cross-border regions, sectoral bodies), and potentially independent expert bodies would gain *direct standing* to submit reasoned opinions on subsidiarity breaches to the Commission alongside NPs. Their specific knowledge of local capacity and cross-border dynamics is essential.
  2.  **Mandated Impact Assessments:** A truly independent EU body (e.g., a strengthened European Court of Auditors or a dedicated Subsidiarity Agency) would be required to produce *binding comparative efficiency assessments* for every legislative proposal, analyzing:
      *   Concrete evidence of cross-border effects/problems.
      *   Rigorous evaluation of the capacity of local/regional/national levels to achieve the objective.
      *   Quantifiable analysis of scale economies or effectiveness gains from central action.
  3.  **Revised Thresholds & Process:** The "reasoned opinion" threshold might shift from a simple count of NP objections to a threshold based on the *weight* of evidence presented in objections, particularly from affected lower levels. The 8-week period might need extension for complex assessments.
  4.  **Commission Justification Standard:** The Commission's review and justification *must* directly engage with the independent efficiency assessment and the specific evidence-based objections, demonstrating why the central action is *measurably* more efficient. Vague assertions would be insufficient.
  5.  **Enhanced Judicial Review:** The CJEU would adopt a less deferential standard, actively scrutinizing the evidence base for efficiency claims in both the Commission's proposal/justification and the objections raised during the EWM.

  **If the "Bargain (Jurisdictional) Reading" Were Adopted Earnestly:**

  1.  **NP Veto Power:** The "yellow card" (1/3) would trigger an *obligatory withdrawal* or fundamental revision by the Commission. The "orange card" (majority) might lead to an *absolute veto* requiring unanimity in Council/EP supermajority to override. The focus shifts decisively to protecting state powers.
  2.  **Strict Enumeration of Competences:** Subsidiarity would become secondary to a much stricter, more exhaustive, and less flexible definition of exclusive/shared competences in the treaties. The question "Can the EU act *at all*?" would dominate over "Is it more efficient?".
  3.  **Formal Role for Regions (Indirect):** Regions with legislative powers (e.g., German Länder, Belgian Regions) might gain a *formal consultative role* or even a *mandate instruction* mechanism *within* their national parliament's EWM process. Their consent might be required for the NP's vote to count. However, they wouldn't gain independent EU standing.
  4.  **Diminished Role for Efficiency Evidence:** While "reasoned opinions" might still mention efficiency, the core justification would be jurisdictional: "This falls outside the agreed scope of EU competence" or "This infringes a core state power/reserved domain." The Commission's review would focus on competence arguments, not efficiency proofs.
  5.  **Political Resolution Focus:** Disputes would be resolved primarily through the European Council (Heads of State/Govt) as the ultimate forum representing the sovereign bargain, rather than the Commission, EP, or Courts. Intergovernmentalism would be reinforced.

  ### Conclusion
  The current system embodies **"Intergovernmental Efficiency Lite."** It pays lip service to efficiency but structurally prioritizes a political safeguard mechanism controlled precisely by the entities (national governments/parliaments) whose powers are most directly threatened by centralization. Regions are excluded because the foundational legitimacy is seen as flowing *from states*, not citizens or multi-level governance. The procedural looseness allows both efficiency and sovereignty arguments to be made, but the structure inherently favors the state-centric, political-bargain interpretation. Adopting a true efficiency model would require democratizing standing, institutionalizing objective assessment, and empowering judicial review of evidence. Embracing the bargain model would mean strengthening state vetoes and formalizing internal regional influence within states, further diminishing the supranational community method. The current hybrid reflects the EU's unresolved tension between being a union of states and a union of citizens/regions.
