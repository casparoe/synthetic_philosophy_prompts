    Actually, the case says: "a single raven encountered at random". So if there are no ravens (H_v), then encountering a raven is impossible. Therefore, the evidence cannot occur under H_v.

    We must condition on the evidence being possible. So we have:

    Evidence E: a raven is encountered and it is black.

    But note: the priors are 0.9, 0.09, 0.01. However, the evidence E cannot happen under H_v.

