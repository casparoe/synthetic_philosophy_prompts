answer: |-
  ### Joint Statement on Hempel's Raven Paradox  
  **Signed by both participants**  

  #### 1. Jointly Signed Arithmetic Table  
  We compute likelihoods and ratios for evidence **W** (non-black non-raven) and **B** (black raven) under theories **T₁** (all ravens black) and **T₂** (one non-black raven in World I; ravens independently black with probability 0.5 in World II). Priors: \( P(\text{T}_1) = P(\text{T}_2) = 0.5 \).  

  | World | Evidence | \( P(\text{Evidence} \mid \text{T}_1) \) | \( P(\text{Evidence} \mid \text{T}_2) \) | Likelihood Ratio \( \frac{P(\text{Evidence} \mid \text{T}_1)}{P(\text{Evidence} \mid \text{T}_2)} \) |  
  |-------|----------|------------------------------------------|------------------------------------------|--------------------------------------------------------------------------------------------------|  
  | I     | **W**    | \( \frac{100,000}{1,000,000} = 0.1 \)    | \( \frac{99,999}{1,000,000} \approx 0.099999 \) | \( \frac{0.1}{0.099999} \approx 1.00001 \) |  
  | I     | **B**    | \( \frac{1,000}{1,000,000} = 0.001 \)    | \( \frac{999}{1,000,000} = 0.000999 \)    | \( \frac{0.001}{0.000999} \approx 1.001001 \) |  
  | II    | **W**    | \( \frac{999,000}{1,000,000} \times \frac{1}{2} = 0.4995 \) | \( \frac{999,000}{1,000,000} \times \frac{1}{2} = 0.4995 \) | \( 1 \) |  
  | II    | **B**    | \( \frac{1,000}{1,000,000} \times 1 = 0.001 \) | \( \frac{1,000}{1,000,000} \times \frac{1}{2} = 0.0005 \) | \( 2 \) |  

  - **Difference between worlds**: In World I, the number of non-black objects is fixed and known; in World II, non-raven colors are stochastic and independent.  
  - **World I, W's ratio**: The ratio is ≈1.00001 because under T₁, all 100,000 non-black objects are non-ravens, while under T₂, one non-black object is a raven, leaving 99,999 non-black non-ravens.  
  - **World II, W's ratio**: The ratio is 1 because W depends only on non-ravens, whose colors are independent of T₁ and T₂.  

  ---

  #### 2. Numbered List of Agreed Claims  
  Both camps endorse these claims. Claims signed under protest note the protest; concessions note initial resistance.  

  1. **Contrapositive and equivalence**: Logically, "all ravens are black" is equivalent to "all non-black things are non-ravens," but in confirmation, background information may cause evidence to support one formulation differently than the other.  
  2. **Nicod's criterion**: It is a useful heuristic but fails when background information is ignored (e.g., W in World II).  
  3. **Background dependency**: Confirmation is relative to a background corpus; the paradox arises when background is neglected or misrepresented.  
  4. **World I, W confirms T₁**: Observing W raises the probability of T₁ relative to T₂ by a negligible amount (≈0.001%).  
  5. **World I, B confirms T₁**: Observing B raises the probability of T₁ relative to T₂ by a small amount (≈0.1%).  
  6. **World II, W does not confirm T₁**: Observing W leaves the probability ratio of T₁ to T₂ unchanged (ratio=1).  
  7. **World II, B confirms T₁**: Observing B doubles the probability ratio of T₁ to T₂ (ratio=2).  
  8. **Paradox resolution**: The paradox stems from conflating "confirms" with "confirms appreciably" and omitting background.  
  9. **Projectibility not primitive**: No primitive "natural predicate" is needed; priors and likelihoods capture relevant distinctions.  
  10. **Role of priors**: Priors and background determine whether a predicate behaves as "projectible" or "gerrymandered."  
  11. **Negligible Bayes factors**: A nonzero but negligible likelihood ratio (e.g., ≈1.00001) indicates minuscule confirmation.  
  12. **No universal zero confirmation for non-ravens**: In some backgrounds (e.g., World I), W confirms T₁ negligibly; in others (e.g., World II), it does not.  

  - **Signed under protest**:  
    - Claim 4 (Restriction camp): "Confirms" should not apply to negligible changes (concedes arithmetic but not substantive support).  
    - Claim 9 (Restriction camp): Priors/likelihoods may encode kind-facts but do not replace projectibility.  
  - **Concessions with cost**:  
    - Degree camp initially resisted Claim 6 (cost: accepts W may confirm negligibly or not at all).  
    - Degree camp initially resisted Claim 12 (cost: abandons universal confirmation for non-ravens).  
    - Restriction camp initially resisted Claim 4 (cost: accepts negligible probability increase in World I).  
    - Restriction camp initially resisted Claim 8 (cost: concedes paradox involves misstated background).  

  ---

  #### 3. Disagreements Table  
  Neutral formulations avoid caricature; "abandon condition" states what would falsify each camp’s position.  

  | Neutral Formulation | Degree Camp’s Version | Restriction Camp’s Version | Abandon Condition |  
  |---------------------|------------------------|----------------------------|-------------------|  
  | Does observing a non-black non-raven (W) in World I provide genuine evidential support for "all ravens are black"? | W provides genuine support: any probability increase (e.g., ≈1.00001) counts as confirmation. | W provides no genuine support: negligible ratios are artifacts, not evidence; support requires relevant kind-predicates. | Degree: If likelihood ratio ≤ 1. Restriction: If W’s ratio were large (e.g., >1.1) without kind-facts in background. |  
  | Must a predicate be "projectible" for observations to confirm generalizations? | Projectibility is derivative: background-dependant priors/likelihoods explain apparent restrictions; no primitive projectibility needed. | Projectibility is primitive: non-projectible predicates (e.g., "non-black non-raven") cannot yield evidence, regardless of arithmetic. | Degree: If Bayesianism cannot replicate projectibility intuitions. Restriction: If non-projectible predicates provide strong confirmation without kind-facts. |  
  | Does the equivalence condition hold in confirmation theory? | Yes, trivially: equivalent hypotheses always have identical posteriors. But evidence may confirm them differently due to description-sensitivity. | No: equivalent hypotheses need not be confirmed equally by the same evidence if it targets non-kind predicates. | Degree: If equivalent hypotheses ever have different posteriors. Restriction: If evidence always changes probabilities identically for equivalent hypotheses. |  

  ---

  #### 4. Cruxes  
  Settling these would move at least one camp. Predictions are pre-computational; concessions are recorded if falsified.  

  **(a) World II’s W-ratio: Vindication of restriction or background-relativity?**  
  - **Case**: World II (free colouration).  
  - **Degree prediction**: W’s ratio=1 illustrates background-relativity (non-ravens independent of T₁/T₂).  
  - **Restriction prediction**: W’s ratio=1 vindicates restriction (W irrelevant to raven-kind).  
  - **Outcome**: Both predictions consistent; no concession.  

  **(b) Can cases yield conflicting confirmation verdicts?**  
  - **Case**: World I scaled to \( N \) objects (\( N \) ravens, \( 10N \) non-black; T₂: one non-black raven). As \( N \to \infty \), W’s ratio → 1.00001... → 1.  
  - **Degree verdict**: Confirmation (ratio >1, however small).  
  - **Restriction verdict**: No confirmation (ratio negligible; W not about ravens).  
  - **Outcome**: Verdicts conflict (confirmation vs. none); both stand by arithmetic.  

  **(c) Can a black raven lower the generalization’s probability?**  
  - **Case**: Reserve has three hypotheses:  
    - Hᵥ (vacuous, no ravens): P(Hᵥ) = 0.9. Generalization true.  
    - Hₑ (exposed, ravens black with p=0.1): P(Hₑ) = 0.09. Generalization false.  
    - Hᵤ (untouched, all ravens black): P(Hᵤ) = 0.01. Generalization true.  
    Evidence: Randomly encountered raven is black.  
  - **Pre-computation predictions**:  
    - Degree: Background may allow decrease (e.g., if evidence rules out Hᵥ and favors Hₑ over Hᵤ).  
    - Restriction: A black raven should always confirm the generalization.  
  - **Computation**:  
    - \( P(\text{Evidence} \mid \text{H}_\text{v}) = 0 \) (no ravens).  
    - \( P(\text{Evidence} \mid \text{H}_\text{e}) = 0.1 \).  
    - \( P(\text{Evidence} \mid \text{H}_\text{u}) = 1 \).  
    - Unnormalized posteriors: Hᵥ: 0, Hₑ: 0.009, Hᵤ: 0.01.  
    - \( P(\text{Generalization} \mid \text{Evidence}) = P(\text{H}_\text{u} \mid \text{Evidence}) = \frac{0.01}{0.019} \approx 0.526 \).  
    - Prior \( P(\text{Generalization}) = P(\text{H}_\text{v}) + P(\text{H}_\text{u}) = 0.91 \).  
    - Posterior < prior (0.526 < 0.91).  
  - **Concession**: Restriction camp concedes its prediction is falsified; a black raven can lower the generalization’s probability.  

  ---

  #### 5. Closing: Real vs. Verbal Disagreements  
  We disambiguate "e confirms h" to isolate substantive disagreements:  
  - **Degree camp sense**: e confirms h iff \( P(h \mid e) > P(h) \) (any probability increase).  
  - **Restriction camp sense**: e confirms h iff e provides substantive evidence for h, requiring (i) e is about relevant kinds, and (ii) predicates are projectible.  

  **Verbal disagreements (evaporate under disambiguation)**:  
  - "Does W confirm in World I?": Yes (degree sense, negligible increase); No (restriction sense, not substantive/kind-relevant).  
  - "Is Nicod’s criterion valid?": Heuristically yes (degree); no, without projectibility (restriction).  

  **Real disagreements (survive disambiguation)**:  
  - **Substantive confirmation**: Can negligible probability increases (e.g., ≈1.00001) ever constitute genuine evidence (degree: yes; restriction: no).  
  - **Projectibility**: Is it reducible to Bayesian priors/likelihoods (degree: yes; restriction: no; requires primitive constraint).  

  **Non-verbal test**: Consider the statement:  
  - "In World I, observing a white shoe provides evidence supporting the claim that all ravens are black."  
  - Degree camp evaluates as **true** (probability increases).  
  - Restriction camp evaluates as **false** (not substantive evidence about ravens).  
  The difference is not merely notational: It reflects a divide on whether evidence must be kind-relevant to count as support.  

  **Conclusion**: While much contention is verbal (e.g., "confirmation" ambiguity), a core substantive disagreement remains on the necessity of kind-relevance and the evidential significance of negligible probabilities.
