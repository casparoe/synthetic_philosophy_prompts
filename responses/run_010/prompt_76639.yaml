      P(E | H_v) = 0
      P(E | H_e) = 0.1   [since given exposed, a raven is black with prob 0.1]
      P(E | H_u) = 1

    Then, by Bayes:

    Unnormalized posteriors:
      P(H_v | E) proportional to P(E|H_v) * P(H_v) = 0 * 0.9 = 0
      P(H_e | E) proportional to 0.1 * 0.09 = 0.009
      P(H_u | E) proportional to 1 * 0.01 = 0.01

