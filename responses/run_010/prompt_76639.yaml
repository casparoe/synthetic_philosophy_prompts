prompt: |-
  Our department is running an adversarial-collaboration exercise on Hempel's raven paradox, and the two participants have spent a year talking past each other. Draft the joint statement they should have produced: the document both could put their names to.

  The two positions, stated so that neither is a straw man:

  **The degree camp.** Confirmation is probability-raising relative to a background corpus. Observing a non-black non-raven does confirm the generalization that all ravens are black, by an amount the background fixes; that amount is usually negligible but is not automatically zero. Nicod's criterion is a heuristic that misfires here precisely because it ignores the background. The paradox is generated by two errors: reading "confirms" as "confirms appreciably," and pretending the background corpus is empty. No primitive notion of projectible or natural predicate is required, because whatever work such a notion appears to do is done by priors and likelihoods.

  **The restriction camp.** Evidential support is not a purely extensional relation between sentences, so the equivalence condition — the principle requiring that logically equivalent formulations of a hypothesis be confirmed by the same evidence — does not transfer from logic to epistemology. Nicod's criterion is not a crude heuristic but a principle that holds for predicates carving out kinds and fails for gerrymandered ones: "non-black non-raven" is not such a predicate, and satisfying it is not what makes an observation evidence. A tiny nonzero Bayes factor is not a small quantity of confirmation; it is a symptom that the background has already smuggled in the kind-facts doing the real work.

  Both participants have agreed to fix a common formal playground before writing anything. Use it, and do not substitute another without saying why. In both worlds the generalization at issue is restricted to the reserve: *no raven in the reserve is non-black.*

  **World I (fixed census).** A closed reserve contains exactly 1,000,000 objects; exactly 1,000 are ravens and exactly 100,000 are non-black. Both facts are common background. Rival theories: T₁ says no raven is non-black; T₂ says exactly one raven is non-black, which one being uniform. Under T₁ the 100,000 non-black objects are all non-ravens; under T₂, one of them is a raven. Prior ½ on each. One object is drawn uniformly at random and its ravenhood and colour observed.

  **World II (free colouration).** Same reserve, same known raven count, but nothing fixes how many objects are non-black: each non-raven is independently non-black with probability ½. Rival theories: T₁ says every raven is black as a matter of constraint; T₂ says each raven is independently black with probability ½. Prior ½ on each. Same sampling procedure.

  In each world consider two observations: **W**, the drawn object is a non-black non-raven (the white shoe); **B**, the drawn object is a black raven.

  Produce the following.

  1. **A jointly signed arithmetic table.** The four likelihood ratios — W and B in Worlds I and II — with the likelihoods displayed, not just the ratios. Then one sentence stating what the difference between the two worlds consists in, and one sentence per world explaining why W's ratio takes the value it does.

  2. **A numbered list of agreed claims**, at least ten, that a partisan of each camp can sign without wincing: claims about the logic (the contrapositive, the equivalence condition, what does and does not follow from either), about the arithmetic, about what the paradox does and does not establish, about the role of background, and about which of the other side's intuitions each camp now concedes to be well founded. Flag any claim a side signs only under protest and state the protest. Include at least three claims each camp initially resisted, with a note on what the concession cost it.

  3. **A disagreements table.** For each residual disagreement: a neutral one-sentence formulation; the formulation the degree camp would accept for its own side; the formulation the restriction camp would accept for its own side; and what each side says would have to be the case for it to abandon its position. Neither side's column may caricature the other, and the neutral column may not be a fudge both would reject.

  4. **Cruxes** — sub-questions such that settling one would move at least one camp. Revise this list as you see fit, but I expect at least: (a) whether the value W's ratio takes in World II vindicates the restriction camp or merely illustrates the degree camp's background-relativity; (b) whether any case can be constructed in which the two frameworks yield different *verdicts* about confirmation rather than different numbers; (c) what to say about a black raven that lowers the probability of the generalization. For (c) use this case: the reserve is believed either to be raven-free, extirpated a century ago, in which case the generalization holds vacuously, prior 0.9; or to host a large population exposed to an industrial melanism outbreak documented downstream, in which case each raven is independently black with probability 0.1, prior 0.09; or to host a population untouched by it, in which case every raven is black, prior 0.01. A warden then reports a single raven encountered at random, and it is black. For each crux: the case or argument both camps accept as bearing on it, and each camp's prediction, written down in the document before the computation is carried through. If a camp finds its prediction falsified by its own arithmetic, record the concession rather than adjusting the setup.

  5. **A closing section separating the real disagreements from the verbal ones.** If "e confirms h" is doing two different jobs in the two camps' mouths, say precisely what the two senses are, which of the disagreements in §3 survive the disambiguation, and which evaporate. Be willing to conclude that the larger part of the dispute is verbal — but only by exhibiting a pair of sentences the two camps would evaluate differently and a reason the difference is not merely notational.

  Constraints: do not adjudicate, do not rank the camps, do not propose a third view as the winner, and include no citations or reading lists. Every formulation must be one its target camp could sign. The test of the document is that a hostile reader from either camp would have to admit it is fair.
reasoning: |-
  We are drafting a joint statement for two participants in an adversarial collaboration on Hempel's raven paradox. The two positions are the "degree camp" and the "restriction camp". We have two worlds (I and II) with specific setups and two observations (W: non-black non-raven, and B: black raven). We are to produce:

  1. A jointly signed arithmetic table with likelihood ratios for W and B in both worlds, including the likelihoods, and explanatory sentences.
  2. A numbered list of at least ten agreed claims, with notes on concessions.
  3. A disagreements table with neutral formulations and each camp's version.
  4. Cruxes (sub-questions) with cases and predictions.
  5. A closing section separating real and verbal disagreements.

  We must use the given formal playgrounds (Worlds I and II) and not substitute without reason. We are to be neutral and fair to both camps.

  Let's break down the task.

  ### 1. Arithmetic Table

  We need to compute the likelihood ratios for the two observations (W and B) in both worlds. The likelihood ratio for evidence E given two hypotheses T1 and T2 is P(E|T1)/P(E|T2). We are to show the likelihoods (P(E|T1) and P(E|T2)) and then the ratio.

  **World I (fixed census):**
  - 1,000,000 objects.
  - 1000 ravens, 100,000 non-black objects.
  - T1: no non-black raven (so all non-black objects are non-ravens).
  - T2: exactly one non-black raven (so 99,999 non-black non-ravens and one non-black raven).

  Sampling: one object drawn uniformly at random.

  Observation W (non-black non-raven):
  - Under T1: non-black objects are exactly 100,000 and all are non-ravens. So P(W|T1) = (100,000) / 1,000,000 = 0.1.
  - Under T2: non-black objects are 100,000, but one of them is a raven, so non-black non-ravens are 99,999. Thus P(W|T2) = 99,999 / 1,000,000 ≈ 0.099999.
  - Likelihood ratio: P(W|T1)/P(W|T2) = 0.1 / 0.099999 ≈ 1.00001.

  Observation B (black raven):
  - Under T1: ravens are 1000 and all black. So black ravens = 1000. P(B|T1) = 1000 / 1,000,000 = 0.001.
  - Under T2: ravens are 1000, but one is non-black, so black ravens = 999. P(B|T2) = 999 / 1,000,000 = 0.000999.
  - Likelihood ratio: P(B|T1)/P(B|T2) = 0.001 / 0.000999 ≈ 1.001001.

  **World II (free colouration):**
  - 1,000,000 objects.
  - 1000 ravens (known), and 999,000 non-ravens.
  - Each non-raven is independently non-black with probability 0.5.
  - T1: every raven is black (so all 1000 ravens are black).
  - T2: each raven is independently black with probability 0.5.

  Sampling: one object drawn uniformly at random.

  Observation W (non-black non-raven):
  - We note that the object is a non-raven (since it's a non-black non-raven) and non-black. The non-ravens are 999,000, and each is non-black independently with probability 0.5. However, note that the hypothesis T1 or T2 does not affect the non-ravens because they are always non-ravens regardless, and their color is independent and fixed by the background (each non-raven is non-black with prob 0.5). So the probability of observing a non-black non-raven is the same under both T1 and T2? But wait, the object is drawn uniformly at random. The probability that the object is a non-raven and non-black is the same regardless of T1 or T2 because T1 and T2 only constrain ravens.

  So:
  - The probability that the drawn object is a non-raven is 999,000/1,000,000 = 0.999.
  - Given that it is a non-raven, the probability it is non-black is 0.5 (by the background model, independent of T1 or T2).
  - Therefore, P(W|T1) = P(W|T2) = 0.999 * 0.5 = 0.4995.
  - Likelihood ratio: 1.

  Observation B (black raven):
  - The object is a raven and black.
  - Under T1: all ravens are black. So the probability that a given raven is black is 1. The probability of drawing a raven is 1000/1,000,000 = 0.001. Then P(B|T1) = 0.001 * 1 = 0.001.
  - Under T2: each raven is black with probability 0.5. So the probability that a given raven is black is 0.5. Then P(B|T2) = 0.001 * 0.5 = 0.0005.
  - Likelihood ratio: P(B|T1)/P(B|T2) = 0.001 / 0.0005 = 2.

  Now, we write the table:

  | World | Evidence | P(Evidence | T1) | P(Evidence | T2) | Likelihood Ratio (T1/T2) |
  |-------|----------|-----------------|-----------------|---------------------------|
  | I     | W        | 0.1             | 0.099999        | ≈1.00001                  |
  | I     | B        | 0.001           | 0.000999        | ≈1.001001                 |
  | II    | W        | 0.4995          | 0.4995          | 1                         |
  | II    | B        | 0.001           | 0.0005          | 2                         |

  Then we write:

  - The difference between the two worlds consists in: In World I, the total number of non-black objects is fixed and known, while in World II, the non-ravens have independent colorations and the number of non-black objects is not fixed.

  Now, one sentence per world for W's ratio:

  - World I: The likelihood ratio for W is approximately 1.00001 because under T1 there are 100,000 non-black non-ravens and under T2 there are 99,999 non-black non-ravens, making P(W|T1) slightly higher than P(W|T2).
  - World II: The likelihood ratio for W is 1 because the evidence W (a non-black non-raven) only depends on the non-ravens, whose color distribution is independent of the hypothesis about ravens.

  ### 2. Agreed Claims (at least ten)

  We need a list of claims that both can agree to. We note:

  - Both camps accept the arithmetic above.
  - Both camps agree on the formal setup and the computed numbers.

  We list:

  1. In World I, observing a non-black non-raven (W) slightly increases the probability of T1 relative to T2 (as shown by the likelihood ratio >1).
  2. In World I, observing a black raven (B) slightly increases the probability of T1 relative to T2 (as shown by the likelihood ratio >1).
  3. In World II, observing a non-black non-raven (W) does not change the probability of T1 relative to T2 (likelihood ratio=1).
  4. In World II, observing a black raven (B) doubles the probability of T1 relative to T2 (likelihood ratio=2).
  5. The equivalence condition (that logically equivalent hypotheses must be confirmed by the same evidence) holds in logic, but both camps agree that in the context of confirmation, the background information and the way the hypothesis is expressed (e.g., as "all ravens are black" or as "all non-black things are non-ravens") may affect the confirmation because of how the evidence relates to the background.
  6. Nicod's criterion (that observing an instance of the antecedent and consequent confirms the generalization) is a useful heuristic but is not universally valid without considering background information.
  7. The background corpus of knowledge plays a crucial role in determining the degree of confirmation.
  8. In World I, the observation of a white shoe (W) does confirm the generalization (T1) to a very small degree, as per the arithmetic.
  9. In World II, the observation of a white shoe (W) does not confirm the generalization (T1) relative to T2 because it does not change the odds.
  10. The raven paradox arises because of a tension between the equivalence condition and Nicod's criterion, and the resolution depends on background information.

  We must note any claim signed under protest and concessions.

  - Claim 8: The restriction camp might sign under protest because they argue that a tiny nonzero Bayes factor is not confirmation in the substantive sense. But they agree that in the Bayesian arithmetic, the probability of T1 increases relative to T2 by a negligible amount. The concession: they accept the arithmetic but maintain that this does not constitute substantive confirmation.

  - Claim 3: The degree camp might initially have thought that W always confirms, but in World II they see that it doesn't. The concession: they accept that sometimes the confirmation can be zero.

  - Claim 9: The degree camp might have initially thought that W always confirms at least a little, but in World II they see that the ratio is 1. So they concede that in some backgrounds, W does not confirm at all.

  We also note:

  - Claim 10: Both agree that the paradox is resolved by attention to background.

  We need at least three claims each camp initially resisted:

  - Degree camp initially resisted:
    - Claim 9: That W does not confirm at all in World II. They concede because the arithmetic shows LR=1.
    - Claim 3: Same as above.
    - Claim 6: That Nicod's criterion is not universally valid without background. They initially believed that it was a heuristic that could be fixed by background, but now they agree that it can completely fail (as in World II for W).

  - Restriction camp initially resisted:
    - Claim 8: That W confirms (even if negligibly) in World I. They concede because the arithmetic shows a tiny increase, but they protest that this is not substantive confirmation.
    - Claim 1: Same as above.
    - Claim 2: That B confirms in World I (they might have thought it was more, but they accept the arithmetic). But note: they don't dispute that B confirms, but they might have thought the amount was more significant? Actually, they accept the arithmetic so they must accept the value.

  Actually, the restriction camp might have initially thought that only observations of ravens can confirm the raven hypothesis, so they might have resisted claim 1 and 8. They concede because the arithmetic shows a tiny effect, but they protest that it is negligible and not the kind of confirmation that matters.

  ### 3. Disagreements Table

  We list residual disagreements in a table with four columns: Neutral formulation, Degree camp's formulation, Restriction camp's formulation, and what would make each abandon their position.

  Residual disagreements:

  1. **The nature of confirmation for W in World I:**
     - Neutral: Does the observation of a white shoe (W) in World I provide any substantive confirmation for the hypothesis that all ravens are black?
     - Degree camp: The observation of a white shoe in World I does provide a positive degree of confirmation, however minuscule, for the hypothesis that all ravens are black, as shown by the likelihood ratio greater than 1.
     - Restriction camp: The observation of a white shoe in World I does not provide substantive confirmation for the hypothesis that all ravens are black; the negligible increase in probability does not constitute evidence in the sense of being relevant to the kind of the raven.
     - What would make degree camp abandon: If the likelihood ratio were 1 or less.
     - What would make restriction camp abandon: If the likelihood ratio were large enough to be non-negligible (say, above 1.1) without the background already building in the kind-facts.

  2. **The role of natural kinds:**
     - Neutral: Must a predicate be "natural" or "projectible" for an observation to confirm a generalization?
     - Degree camp: Naturalness is not a primitive requirement; it is captured by the background information and the prior probabilities and likelihoods.
     - Restriction camp: Confirmation requires that the evidence be about the relevant kind (ravens) and that the predicate (black) be projectible; the non-black non-raven predicate is not projectible and hence cannot provide confirmation.
     - What would make degree camp abandon: If a case were found where the Bayesian update failed to account for the naturalness intuition without adding a primitive projectibility constraint.
     - What would make restriction camp abandon: If a case were found where non-projectible predicates provided substantial confirmation without any natural kinds in the background.

  3. **The interpretation of the equivalence condition:**
     - Neutral: Does the equivalence condition hold in confirmation theory?
     - Degree camp: The equivalence condition holds in the sense that logically equivalent hypotheses must have the same posterior probability given any evidence, but the confirmation from a particular piece of evidence may differ because of the background and the way the evidence is described.
     - Restriction camp: The equivalence condition fails in confirmation theory because evidence that confirms one formulation (e.g., "all ravens are black") may not confirm an equivalent formulation (e.g., "all non-black things are non-ravens") if the evidence is not about the appropriate kind.
     - What would make degree camp abandon: If it were shown that two logically equivalent hypotheses can have different posterior probabilities after the same evidence (which would violate probability theory).
     - What would make restriction camp abandon: If it were shown that the same evidence always changes the probability of both formulations by the same amount (which they already deny).

  Note: We must avoid caricature.

  ### 4. Cruxes

  We address:

  **(a) whether the value W's ratio takes in World II vindicates the restriction camp or merely illustrates the degree camp's background-relativity**

  - Both camps accept that in World II, the likelihood ratio for W is 1. 
  - The case: World II as described.
  - Prediction of degree camp: They predict that the background can make the likelihood ratio 1, so no confirmation. This matches the result, so they see it as illustrating background-relativity.
  - Prediction of restriction camp: They predict that W should not confirm because it is not about ravens, and the result (LR=1) vindicates their view. They also note that in World I, the tiny confirmation is due to the background fixing the non-black count, which they see as smuggling in kind-facts.

