    - Whether projectibility must be taken as primitive or is captured by the background.

  But to show the dispute is not merely verbal, we can point to:

  - A pair of sentences: "The observation of a white shoe in World I confirms the hypothesis that all ravens are black."
    - Degree camp: True (because probability increases, even if negligibly).
    - Restriction camp: False (because it does not provide substantive evidence about ravens).

  This difference is not merely notational because it leads to different evaluations of the same situation.

  However, both camps agree on the underlying arithmetic and the way the probabilities change. The difference is in the interpretation of what counts as confirmation.

  Thus, the larger part of the dispute is about the meaning of "confirmation" and the role of natural kinds, but there is a substantive core about whether negligible probability increases should be considered evidentially meaningful.

