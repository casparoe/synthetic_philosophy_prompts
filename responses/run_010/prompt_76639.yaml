  The dispute has both verbal and substantive aspects.

  - Verbal: The camps use "confirmation" in different senses.
    - Degree camp: Confirmation as any increase in probability (however small).
    - Restriction camp: Confirmation as substantive evidential support that is relevant to the kind and projectible.

