prompt: |-
  I am drafting the specification for a priority-setting procedure that ranks public health interventions by expected welfare gain per person affected, and before anyone defends it I want to know what it is entitled to assume about comparing one person's utility with another's. Write the desiderata: what any adequate account of interpersonal utility comparison must deliver in order to underwrite that use, with the case or result behind each requirement.

  The list should confront at least the following. Why cardinal utilities fixed only up to a positive affine transformation for each person separately leave cross-person comparisons underdetermined, and what a non-arbitrary common origin and common unit would have to consist in rather than merely be stipulated. How the account is to treat intensity reports from people whose baselines differ through adaptation or long deprivation, so that equal numbers do not silently mean equal welfare. And the gap between saying what makes a comparison true and saying how a committee that can introspect neither subject could come to know it — an account that collapses the second into the first has not answered the question I am asking.

  Mark which requirements are non-negotiable given the intended use and which are really the metaphysical preferences of a particular camp, and identify any subset you believe cannot be jointly satisfied; if the specification turns out to be incoherent, that is the result I most want. Close with the single requirement that rules out the largest number of candidate accounts. Please write in American English, and include no citations or reading list.
reasoning: |-
  Okay, let me tackle this user's query. They're drafting a specification for prioritizing public health interventions based on expected welfare gain per person. The core issue is what assumptions about interpersonal utility comparisons (IUC) are necessary for this to work. 

  First, I need to unpack why cardinal utilities with individual affine transformations aren't enough. If each person's utility scale has its own zero and unit, comparing across people becomes arbitrary. For example, adding 5 units to Alice might mean something completely different than adding 5 to Bob. The priority-setting procedure would then depend on how we arbitrarily set those scales, which isn't acceptable for public policy.

  Next, the user is concerned about adaptation and deprivation. If someone adapts to a poor health state, their self-reported low distress might not reflect actual welfare loss. If the procedure takes these reports at face value, it could undervalue interventions for long-deprived groups. So any IUC account must explain how to adjust for such baseline distortions.

  The user also emphasizes the gap between truth and knowledge. It's not enough to say comparisons are metaphysically possible; we need a method for a committee to access them without introspection. Accounts that conflate these are dodging the practical challenge. This seems non-negotiable since committees can't read minds.

  I should identify which requirements are essential versus philosophical preferences. The non-negotiables are avoiding arbitrariness in scales, handling adaptation, and separating truth from knowability. Philosophical camps might argue about whether utilities correspond to mental states or capabilities, but the procedure needs neutrality on that.

  Now, is there a conflict? Requiring both non-arbitrary scales and evidence-based knowledge might clash. For example, if we demand observable behavioral evidence but also correct for hidden adaptation, how can the committee know without introspection? This might be the hardest tension to resolve.

  The most exclusionary requirement is probably the knowability condition. Many accounts describe what IUC truths are but fail on how committees access them. This rules out theories relying on private experiences or stipulative rescaling.

  I'll structure the desiderata starting with the non-negotiables, then address adaptation and the truth/knowledge gap. I'll highlight conflicts, especially around knowability and adaptation, and conclude that the knowability requirement excludes most candidate accounts. The goal is to show if the procedure is coherent or doomed by these constraints.
answer: |-
  Here are the desiderata for interpersonal utility comparisons (IUC) required to underpin your priority-setting procedure, distinguishing non-negotiables from metaphysical preferences, and identifying tensions:

  ### Non-Negotiable Requirements (Essential for the Procedure's Validity)
  1.  **Non-Arbitrary Common Scale (Unit & Origin):**
      *   **Requirement:** Must establish a uniquely defensible *common unit* for measuring welfare differences and a *common origin* (zero point) across individuals. These cannot be stipulated arbitrarily without rendering comparisons meaningless for policy.
      *   **Case/Result:** If only *individual* affine transformations (u'_i = a_i*u_i + b_i, a_i > 0) are allowed, then declaring that "Intervention A gives Alice +10 utils and Bob +5 utils, so A is better" is invalid. We could rescale Alice's utility (e.g., set a_Alice=0.1, b_Alice=0) so her +10 becomes +1, and Bob's +5 remains +5, making Bob seem better off. The ranking is arbitrary without fixed a_i and b_i.
      *   **Why Non-Negotiable:** Without this, the "welfare gain per person" metric is arbitrary; rankings change based on arbitrary scaling choices, invalidating the procedure's objectivity.

  2.  **Meaningful Zero-Point Interpretation:**
      *   **Requirement:** The common origin (zero utility) must correspond to a substantively meaningful welfare state (e.g., neutrality between existence/non-existence, a defined threshold of "no net welfare," or an objective baseline like biological subsistence without suffering/reward).
      *   **Case/Result:** If zero is arbitrary, statements like "Alice's gain offsets Bob's loss" lack real meaning. The procedure assumes gains and losses are measured from a common, meaningful baseline.
      *   **Why Non-Negotiable:** Aggregating gains/losses per person presupposes a non-arbitrary baseline for "gain."

  3.  **Accountability for Baseline Adaptation/Deprivation:**
      *   **Requirement:** Must correct for distortions in self-reported intensity or revealed preferences caused by long-term adaptation or deprivation. Equal numerical utility differences must reflect equivalent *welfare significance*, not just equivalent psychological reports from individuals with vastly different experiential baselines.
      *   **Case/Result:** A person adapted to chronic pain or lifelong severe deprivation might report only mild distress (low negative utility number) for a condition that would cause immense suffering (high negative utility number) in an unadapted person. Taking their "equal" utility report at face value would drastically undervalue interventions improving their condition compared to interventions for the unadapted. The procedure would systematically disadvantage the most deprived.
      *   **Why Non-Negotiable:** Failure here makes the procedure ethically perverse, misallocating resources away from those in objectively worse states due to adaptation.

  4.  **Epistemic Access Constraint (Truth vs. Knowability Separation):**
      *   **Requirement:** Must provide a clear account of *how a committee* can *know* or *justifiably believe* interpersonal comparisons are correct, *without* relying on direct introspection of others' mental states. The account of what *makes* a comparison true must be separable from the epistemology of how we *access* that truth. Simply asserting comparisons are "possible" or "true in principle" is insufficient.
      *   **Case/Result:** A committee cannot directly experience or measure the "raw feels" of welfare in different individuals. An account that says "It's true if Alice's utility number is higher than Bob's according to a correct theory" but provides no feasible method (beyond potentially misleading reports or behavior) for the committee to determine *which* theory is correct or *what* the numbers are, fails. The procedure requires actionable evidence.
      *   **Why Non-Negotiable:** The procedure is a practical decision tool. If comparisons are unknowable in practice (even if "true" in theory), the procedure cannot be implemented rationally.

  ### Metaphysical Preferences (Impact the *Type* of Account, Not Necessarily Viability)
  5.  **Subject-Independence of Scale:**
      *   **Requirement:** The justification for the common unit/origin should ideally be grounded in something independent of any particular individual's psychology or preferences (e.g., objective features of states of affairs, universal human needs, biological function).
      *   **Case/Result:** Prevents the scale from being contingent on potentially arbitrary or adaptive features of individual utility functions. Favors capabilities or objective list approaches over pure preference satisfaction or hedonic theories.
      *   **Status:** Preference. A sophisticated preference-based or hedonic theory *could* potentially meet the non-negotiables, though it faces greater challenges with Adaptation (3) and Knowability (4).

  6.  **Interpersonal Validity of Zero and Unit:**
      *   **Requirement:** The welfare significance of moving from utility level U1 to U2 should be comparable across individuals *because* the zero point and the unit difference represent the *same* underlying welfare change for everyone.
      *   **Case/Result:** A gain of +1 util should represent the same *amount of welfare improvement* for Alice as it does for Bob, regardless of their baseline states (after correcting for Adaptation). This underpins the meaningfulness of summing gains per person.
      *   **Status:** Preference (though tightly linked to Non-Negotiables 1 & 2). Some accounts (e.g., extended preferences) might aim for agreement without strong metaphysical claims about identical underlying states.

  ### Conflicts and Coherence
  *   **Key Tension:** Satisfying **Accountability for Adaptation (3)** and **Epistemic Access (4)** simultaneously is extremely challenging. Correcting for adaptation requires knowing *what the welfare level truly is*, independent of the adapted individual's reports or behavior. However, **Epistemic Access (4)** demands knowability *without* introspective access to that "true" welfare. Bridging this gap – finding *observable evidence* that reliably tracks "true" welfare corrected for adaptation – is the core hurdle. Many accounts either ignore adaptation (violating 3) or rely on inaccessible "true" states (violating 4).
  *   **Potential Incoherence:** If an account cannot jointly satisfy **Non-Arbitrary Scale (1)**, **Meaningful Zero (2)**, **Adaptation Correction (3)**, and **Epistemic Access (4)**, then the proposed priority-setting procedure is **incoherent** for its intended purpose. The requirement for a common scale **(1 & 2)** combined with the need to correct for non-comparable baselines **(3)** and the practical knowability constraint **(4)** creates a very high bar. Many plausible accounts fail on **(4)**, others on **(3)**.

  ### The Most Exclusionary Requirement
  The **Epistemic Access Constraint (4)** rules out the largest number of candidate accounts. Most philosophical accounts of IUC focus on *defining* what makes comparisons true (e.g., idealized preferences, identical neurophysiological correlates, metaphysical equality of welfare units) but provide little to no feasible epistemology for a real-world committee lacking telepathy or perfect scientific knowledge. Accounts that *do* prioritize knowability (e.g., based solely on uncorrected preference intensity reports or choice behavior) typically fail **Accountability for Adaptation (3)**. Requirement **(4)** forces the issue of practical implementation, disqualifying accounts that remain purely theoretical or stipulative.
