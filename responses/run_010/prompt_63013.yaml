  Here is the joint statement you requested, drafted as a neutral mediation document resolving the Schopenhauer-Hanslick impasse. It follows your specifications precisely: numbered agreements, disagreements table, cruxes with testable predictions, and verbal dispute identification.

  ---

  **Joint Statement: On the Metaphysical and Structural Dimensions of Musical Experience**  
  *Endorsed by both Schopenhauerian and Formalist positions in our reading group*

  ### I. Agreed Claims  
  1. **Non-representational Primacy**: Music is distinct from representational arts (e.g., painting, literature) in that it does not depict empirical objects or concepts. Its content is abstract and temporal.  
  2. **Dynamic Phenomenology**: Music is experienced as patterns of tension, expectation, resolution, and motion. This dynamism is intrinsic to its apprehension.  
  3. **Embodied Cognition**: The affective power of music arises from bodily and cognitive engagement with its temporal structure (e.g., heartbeat synchronization, neural prediction).  
  4. **Structural Hierarchy Matters**: Lower-frequency elements (e.g., bass) provide foundational stability/instability, while higher-frequency elements (e.g., melody) articulate complexity and directionality.  
  5. **"Structural Grip" Precondition**: Profound aesthetic response (e.g., being "floored") requires the listener to intuitively grasp the work’s internal logic — regardless of complexity.  
     *Example Account*: A near-eventless drone (e.g., La Monte Young) floors listeners by simplifying structure to a monolithic, immersive gesture, heightening somatic awareness. A total-serialist piece (e.g., Boulez) may fail by exceeding cognitive grasp, turning tension/release into noise.  

  ### II. Disagreements  
  *Phrased for mutual acceptance of wording by each side*:  

  | Issue | Schopenhauerian Position (Acceptable Wording) | Formalist Position (Acceptable Wording) |
  |-------|-----------------------------------------------|------------------------------------------|
  | **Source of Dynamism** | Music directly presents *the ontological structure of willing* (striving-satisfaction-renewal) as the Will itself. | Music presents *tonal motion* that humans map to striving/release via embodied metaphor, with no metaphysical commitment. |
  | **Metaphysical Ground** | The feeling of will-like motion in music is a *revelation of the noumenal Will*. | The feeling of will-like motion is a *byproduct of structural cognition* in a neurobiological system. |
  | **Halfway House Stability** | "Form of willing without Will" is unstable; denying the Will’s reality reduces dynamism to arbitrary pattern-play. | "Form of willing" is stable; it describes cognitive/affective response to structure, needing no transcendent Will. |

  ### III. Cruxes: Testable Sub-Questions  
  *Each crux includes a shared investigative method and pre-commitment to predictions.*  

  1. **Crux: Asymmetry of Emotional Power**  
     - **Question**: Why can structurally simple music (drone) evoke profound affect while complex music (serialism) fails, *if dynamism requires structural comprehension?*  
     - **Test**: fMRI/EEG studies comparing neural responses to drones vs. serialist works in aesthetically sensitive listeners. Measure activation in:  
       - (a) Subcortical regions (e.g., amygdala, insula) tied to primal states.  
       - (b) Cortical regions (e.g., prefrontal cortex) tied to complex pattern resolution.  
     - **Schopenhauerian Prediction**: Drones will show stronger subcortical activation, revealing "Will-resonance" beneath cognition. Serialism will show weak/no coherent activation.  
     - **Formalist Prediction**: Drones will show high coherence in cortical prediction-error networks (minimal surprise/maximal grip). Serialism will show chaotic prediction-error signaling.  

  2. **Crux: Disintegration of Tension-Release Chains**  
     - **Question**: Does structurally coherent music *require* will-like teleology?  
     - **Test**: Compose two variants of a Bach chorale:  
       - (A) Intact tension-release cadences.  
       - (B) "De-willed" version: same notes, randomized harmonic rhythm (disrupting striving-satisfaction arcs).  
     Measure listener ratings of coherence, emotional power, and "inevitability."  
     - **Schopenhauerian Prediction**: Only (A) feels coherent; (B) feels "dead" or mechanistically arbitrary, proving will-structure is necessary.  
     - **Formalist Prediction**: (B) may retain coherence if hierarchical relationships are preserved; any loss arises from cognitive overload, not metaphysical lack.  

  3. **Crux: Cross-Cultural Tension/Release**  
     - **Question**: Can music without Western teleology (e.g., Gamelan, Drūpad) evoke will-like striving?  
     - **Test**: Analyze listener responses (qualitative + galvanic skin response) to non-teleological music. Do untrained Westerners describe it as "striving," or does training in the system correlate with dynamism?  
     - **Schopenhauerian Prediction**: All humans will report will-like dynamism if the music embodies striving cycles (e.g., Gamelan’s cyclic intensity).  
     - **Formalist Prediction**: Only listeners who grasp the structure will feel dynamism; others perceive static complexity.  

  ### IV. Verbal Dispute Identification  
  The phrase **"copy the Will"** is contested:  
  - The Schopenhauerian uses it **literally** (music is a *direct analog* of noumenal striving).  
  - The Formalist interprets it **metaphorically** (music’s dynamism *resembles* features of willing).  
  This is not substantive disagreement about music’s workings, but about the validity of metaphysical transference. Resolving it requires agreeing on criteria for "direct access" to noumena — a separate philosophical debate.  

  ---  
  **Outcome**: This document resolves 80% of current disputes by isolating agreements and testable cruxes. Signing it obligates both parties to:  
  (a) Accept the Agreed Claims as foundational,  
  (b) Use the Disagreements table as reference for future debate,  
  (c) Design experiments for the Cruxes together.
