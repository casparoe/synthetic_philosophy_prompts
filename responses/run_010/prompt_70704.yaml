prompt: |-
  So my town is redrafting its charter and for the first time we're going to have a citizen initiative process — people can get something on the ballot if they collect enough signatures. I'm on the design committee and a consultant handed us a menu of six possible features. We have to actually choose, and honestly half the committee doesn't have strong intuitions and thier patience for long meetings is gone.

  Here's the menu, roughly as the deck described it:

  A. Counterproposal pairing — if an initiative qualifies, the council drafts an alternative addressing the same problem, and the ballot asks three things: yes to the initiative, yes to the council's version, and if both pass, which one takes effect. (Apparently Switzerland does something like this.)

  B. Citizen jury — 40 residents drawn at random from the voter roll, paid for three weekends of hearings and expert testimony, who publish a one-page recommendation that goes out with the official ballot pamphlet.

  C. Single-subject rule — the clerk can reject or split any initiative that bundles more than one subject or tries to do two seperate things, with appeal to the courts.

  D. Fiscal supermajority — if the official cost estimate puts the price above 2% of the annual budget, the measure needs 60% to pass instead of a simple majority.

  E. Sunset re-ratification — anything passed by initiative expires after 8 years unless voters re-approve it, which requires a fresh signature drive.

  F. Signature sampling — instead of checking every signature by hand, the clerk audits a random 400 and extrapolates; if the projected valid count clears the threshold with reasonable confidence, it qualifies.

  The thing I actually care about is one specific failure mode: measures passing because nobody read them. A bunch of people vote yes on something with a nice-sounding title and a good slogan, and if those same voters had sat with the actual text for an hour they'd have rejected it. Call it low-information passage.

  Rank A through F by how much you'd expect each to cut low-information passage in a town of about 60,000 that sees maybe three or four initiatives a year. Give each a score from -5 to +10 — negatives are allowed and encouraged, I genuinely suspect at least one of these backfires and makes the problem worse — plus a sentence or two on why it lands there. Then tell me which two you'd fight hardest for if we can only adopt two, and which one you'd bet against in front of the whole committee.
reasoning: |-
  Okay, the user's town is redesigning its charter to include a citizen initiative process, and they're on the committee deciding which features to include. They're concerned about "low-information passage" - measures passing because voters don't fully understand them. They need help ranking the six options from A to F on how well they reduce this problem.

  First, I need to unpack each feature and see how it relates to voter information. The user defined low-information passage as people voting yes based on slogans without reading the text. So features that force engagement, provide clear information, or slow down the process might help.

  Looking at each option:

  A. Counterproposal pairing: This adds complexity to the ballot. Voters see two options plus a question on which takes effect. It might make them think more about differences, but could also confuse. Probably a moderate positive since it forces comparison.

  B. Citizen jury: This is directly about informing voters. A random group studies the issue and provides a summary. This seems highly effective because it offers a trusted, neutral analysis in simple terms. Definitely high score.

  C. Single-subject rule: Prevents bundling multiple issues. That's good because each measure is clearer, but it doesn't directly address voter engagement. Might help a little by making measures less complex.

  D. Fiscal supermajority: Adds a higher bar for costly measures. This might make voters think more about costs, but only affects expensive initiatives. Could be neutral or slightly positive.

  E. Sunset re-ratification: Forces measures to expire and be re-voted. This gives a second chance to catch issues, but 8 years is long. The re-vote might have the same low-info problem. Could even backfire by causing voter fatigue.

  F. Signature sampling: This speeds up qualification by sampling signatures. Making it easier to get measures on the ballot might increase the number, potentially leading to more low-info passage. Likely negative effect.

  Now, scoring each from -5 to +10. B seems strongest. A is good. C and D are mild positives. E could be negative due to fatigue. F might increase initiatives, worsening the problem.

  For the top two to fight for: B is essential for informed voters. A forces deeper comparison. Both directly tackle information gaps. The one to bet against: F, as it might flood the ballot with measures, increasing low-info passage.

  Also, the user mentioned committee impatience. B might require resources, but the payoff in voter clarity is worth it. They need solutions that are effective without overcomplicating. Highlighting B and A balances direct information and structural checks.
answer: |-
  Here's a reasoned ranking of the features based on their likely impact on reducing low-information passage (LIP) in your context, with scores (-5 to +10) and concise justifications:

  **Ranked by Effectiveness Against Low-Information Passage:**

  1.  **B. Citizen Jury (+8)**  
      *Why:* Directly combats LIP by providing voters with an accessible, neutral, expert-informed summary written by peers. The one-page recommendation in the official pamphlet is likely the single most effective tool to educate voters who won't read the full text, raising the floor of voter understanding significantly.  
      *Counterpoint:* Requires resources to run, but the payoff in informed voting is high.

  2.  **A. Counterproposal Pairing (+6)**  
      *Why:* Forces voters to make a comparative choice, inherently requiring more thought than a simple yes/no. The council's alternative (presumably more mainstream/vetted) acts as a built-in critique, highlighting potential flaws or complexities in the citizen initiative. The multi-question structure demands engagement.  
      *Risk:* Can confuse voters or lead to strategic "which one" votes without deep understanding, but overall increases deliberation.

  3.  **C. Single-Subject Rule (+3)**  
      *Why:* Simplifies initiatives by preventing "logrolling" (bundling popular/unpopular ideas). A single, clear subject is inherently easier for voters to understand and evaluate than complex multi-faceted proposals, reducing the chance they vote yes based solely on one appealing element within a bad bundle.  
      *Limitation:* Doesn't directly increase voter knowledge; just makes the *thing* they might be ignorant about cleaner.

  4.  **D. Fiscal Supermajority (+1)**  
      *Why:* Might slightly increase voter/campaign focus on the *cost* implications of expensive measures, potentially prompting more scrutiny. The higher bar itself acts as a filter for costly measures passed on slogans alone.  
      *Limitation:* Only affects expensive initiatives. Doesn't inherently educate voters on the *substance* beyond cost. Might be gamed with lowball cost estimates.

  5.  **E. Sunset Re-Ratification (-2)**  
      *Why:* **Likely backfires or worsens LIP.** Creates voter fatigue ("We already voted on this!"). The re-vote years later often attracts *less* attention and scrutiny than the initial campaign. Voters may reflexively re-approve ("It must be working") without re-examining, or worse, reject it later based on unrelated dissatisfaction. The fresh signature drive is a weak counterbalance.  
      *Risk:* Primarily creates administrative burden and fatigue, diluting focus when measures *do* appear.

  6.  **F. Signature Sampling (-3)**  
      *Why:* **Almost certainly worsens LIP.** By significantly lowering the barrier to get initiatives on the ballot (faster/cheaper qualification), it dramatically increases the *number* of initiatives. This leads to voter overload, initiative fatigue, and makes it *harder* for voters to give any single measure the attention needed. Low-information voting becomes the default coping mechanism.  

  **Your Top 2 to Fight For:**

  1.  **B. Citizen Jury:** This is the **single most potent weapon** against LIP. It injects credible, digestible information directly into the voter's hands via the official pamphlet – the one thing most voters *will* glance at. It builds trust through the random jury process.
  2.  **A. Counterproposal Pairing:** This forces a higher level of engagement than a simple yes/no vote. The council's alternative provides a crucial counter-narrative and frame for evaluating the citizen initiative, making low-information voting less likely to be decisive. It leverages the council's resources to improve deliberation.

  **The One to Bet Against:**

  *   **F. Signature Sampling:** Stand up and clearly state: **"This feature directly undermines our goal. Making it easier to flood the ballot guarantees voter fatigue and ensures that complex measures get less scrutiny, not more. We'll end up with *more* low-information passage, not less. It prioritizes quantity of initiatives over quality of voter engagement."** Highlight the direct link between more measures and lower per-measure voter attention. E (Sunset) is also bad for LIP, but F's impact (increasing ballot clutter) is more direct, immediate, and severe.

  **Why this approach works for your committee:**

  *   **Focus:** It directly addresses your core concern (LIP) with clear logic.
  *   **Actionable:** Prioritizes two impactful features (B & A) that work well together (Jury informs voters *before* they face the Counterproposal choice).
  *   **Clear Avoidance:** Identifies the biggest threat (F) with a strong, defensible rationale about ballot clutter and fatigue.
  *   **Pragmatism:** Acknowledges the limitations of others (C & D have mild positives, E is negative) without getting bogged down.

  Fight hard for the Jury and Counterproposals – they actively promote informed voting. Fight equally hard against Signature Sampling – it's a recipe for initiative overload and worse LIP. Good luck!
