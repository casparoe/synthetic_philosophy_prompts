  **Final Attempt with UK Farm Context**  

  **Setup**  
  Agatha must choose seeds for her Norfolk arable farm: *standard* seeds (cost £0, yield £100k if no *Verticillium wilt* disease, £0 if diseased) or *resistant* seeds (cost £20k, yield £100k always, net £80k). Her utility is linear in £k. Two agronomists advise on disease probability:  
  - Adviser 1 (optimist): Pr(Disease) = 0.2, and Satellite scan "Sunny" likelihood: Pr(Sunny|Disease) = 0.1, Pr(Sunny|No Disease) = 0.9  
  - Adviser 2 (pessimist): Pr(Disease) = 0.5, and Pr(Sunny|Disease) = 0.8, Pr(Sunny|No Disease) = 0.2  
  The scan is free and payoff-irrelevant (doesn't affect disease or yield).  

  **Credal Set**: Two priors {P₁, P₂} as above.  

  **Acts & Utilities**:  
  - Resistant seeds: £80k (certain)  
  - Standard seeds: £100k if no disease, £0 if disease  

  ### Pre-Observation (t₁)  
  - **P₁**: EU(Standard) = £100k × 0.8 = £80k  
  - **P₂**: EU(Standard) = £100k × 0.5 = £50k  
  - EU(Resistant) = £80k for both  
  - *Maximin*: min EU(Standard) = min(80, 50) = £50k < £80k → **Prefers Resistant seeds**  
  - *Value of information*: If she observes, worst-case EU might be lower.  

  ### Decision to Observe:  
  - If she **does not observe**, she chooses Resistant seeds, securing £80k.  
  - If she **observes**, she faces:  
    - After seeing "Sunny":  
      - *P₁ posterior*: Pr(D|Sunny) = [0.2×0.1] / [0.2×0.1 + 0.8×0.9] = 0.02 / 0.74 ≈ 0.027 → EU(Standard) = £100k×0.973 = £97.3k  
      - *P₂ posterior*: Pr(D|Sunny) = [0.5×0.8] / [0.5×0.8 + 0.5×0.2] = 0.4 / 0.5 = 0.8 → EU(Standard) = £100k×0.2 = £20k  
      → *Maximin*: min(97.3, 20) = £20k < £80k → Chooses Resistant (£80k)  
    - After seeing "Rainy":  
      - *P₁*: Pr(D|Rainy) = [0.2×0.9] / [0.2×0.9 + 0.8×0.1] = 0.18 / 0.26 ≈ 0.692 → EU(Std) = £30.8k  
      - *P₂: Pr(D|Rainy) = [0.5×0.2] / [0.5×0.2 + 0.5×0.8] = 0.1 / 0.5 = 0.2 → EU(Std) = £80k  
      → *Maximin*: min(30.8, 80) = £30.8k < £80k → Chooses Resistant (£80k)  
  - *Guaranteed EU from observing*:  
    - Under P₁: Pr(Sunny) = 0.2×0.1 + 0.8×0.9 = 0.74, EU if observe = 0.74×80 + 0.26×80 = £80k (since she always chooses resistant)  
    - Under P₂: Pr(Sunny) = 0.5×0.8 + 0.5×0.2 = 0.5, EU if observe = 0.5×80 + 0.5×80 = £80k  
    → *Maximin for observing*: min(80, 80) = £80k  
  - *Not observing*: Secures £80k (same as observing)  
  → **Indifferent at t₁**? But we need strict preference for ignorance.  

  **Adjust to Force Strict Preference for Ignorance**:  
  - Make Resistant seeds net £75k (higher cost).  
  - Then:  
    - Not observe: She chooses Resistant, gets £75k.  
    - Observe: She always chooses Resistant (since EU(Resistant) = £75k > maximin EU(Std) in all cases), so EU = £75k.  
    → Still indifferent.  

  - Instead, suppose after observation, in some cases she might choose Standard.  
    Set Resistant seeds net £70k.  
    Pre-observation:  
    - P1: EU(std)=80 >70  
    - P2: EU(std)=50 <70  
    Maximin: min EU(std)=50 <70 → prefers Resistant.  
    After observe:  
    - See sunny:  
      P1: EU(std)=97.3 >70, so chooses Standard  
      P2: EU(std)=20 <70, chooses Resistant  
    - See rainy:  
      P1: EU(std)=30.8 <70, chooses Resistant  
      P2: EU(std)=80 >70, chooses Standard  
    Now, if she observes:  
    - Under P1: Pr(sunny)=0.74, if sunny chooses std (97.3), if rainy chooses res (70). EU = 0.74*97.3 + 0.26*70 ≈ 72 + 18.2 = 90.2  
    - Under P2: Pr(sunny)=0.5, if sunny chooses res (70), if rainy chooses std (80). EU = 0.5*70 + 0.5*80 = 35 + 40 = 75  
    → Maximin for observing: min(90.2, 75) = 75  
    Not observe: chooses Resistant, EU=70  
    75 > 70, so prefers to observe.  

  **Admit Defeat**: After extensive attempts, I cannot satisfy all conditions without fudging. The core issue is that for dilation to cause strict preference for ignorance under maximin, the observation must risk lowering the worst-case EU, but in the payoff-irrelevant case, this often reduces to the same or better EU. A valid example may require a more complex act structure or prior set. I recommend adapting Seidenfeld's (2004) medical example or Bradley's (2015) climate policy case, though they use abstract states. For your paper, argue that the tension between free information and maximin exposes a weakness in the decision rule, not imprecise credence itself. 

  **Defense of Imprecise Credences**: Proponents could argue that preferring free information *is* rational, and maximin's violation of this is a flaw in the rule, not the epistemology. They might advocate for "E-admissibility" or "maximality" rules that avoid this issue. The case doesn't indict imprecise credences but highlights how maximin can misplan under ambiguity.
