  See sunny:  
  P₁: Pr(D|S) = [0.3*0.7]/[0.3*0.7 + 0.7*0.3] = 0.21/(0.21+0.21)=0.5  
  P₂: Pr(D|S) = [0.7*0.7]/[0.7*0.7 + 0.3*0.3] = 0.49/(0.49+0.09)=0.49/0.58≈0.845  
