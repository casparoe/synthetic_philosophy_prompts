prompt: |-
  I cover science and ideas for a general-interest weekly, and I am reporting a piece on a proposal to publicly fund preimplantation screening for a bundle of traits loosely associated with health and longevity. Interviewing bioethicists and population economists has left me with an uncomfortable discovery: my own verdicts on the underlying cases do not line up. I want to lay the cases out as concretely as I can, give you my actual reactions including the ones I am least able to defend, and find out what principle, if any, they add up to.

  One, the postponement. A researcher delays trying to conceive by four years to finish a grant cycle. Because of timing, the child she eventually has is a numerically different person from the one she would have had, and there is no reason to think this child's life will go worse. I think this is obviously unobjectionable, and I do not feel I need a justification for it.

  Two, the requested trait. A deaf couple, at a clinic with eleven viable embryos, asks that one carrying the genetic variant for congenital deafness be implanted, and the clinic agrees. The child's life will be, by every measure I can find, a good one. I think the clinic acted wrongly, though I cannot identify anyone the decision made worse off, since the alternative for that child was never existing.

  Three, the plant, told twice. A utility selects a cheap coolant loop for a facility it knows will leak a mutagen into the surrounding aquifer. Run the numbers so the leaking begins eighteen months after commissioning: children conceived after that point are born with a chronic respiratory condition that costs them roughly a decade of life, and I think the choice is clearly wrong. Now run the identical numbers with the leak beginning twenty-five years out. Every person affected in the second version is someone who would not have existed at all under the safer design; their lives remain worth living. My condemnation does not weaken by a single degree, and that invariance bothers me more than anything else on this list.

  Four, the program I am covering. A state pays couples to screen and select among embryos for predicted healthspan, which changes which children exist without making any of them worse off, and which I find myself endorsing — even though I would think it monstrous if the same selection criteria were applied to children already born.

  Five, the settlement. A frontier policy encourages a population several times larger than the alternative, whose members lead lives that are worth living but not much more than that, while leaving the existing population untouched. I think this is at most mildly regrettable, not wrong.

  Six, the reversal. A policy that would replace that large, marginal population with a much smaller and much better-off one. I think this is wrong, even though no one is harmed by it and no one is benefited by refusing it.

  My working formulation has been: an act is wrong only if it makes some particular person worse off than that person would otherwise have been, or if it lowers average wellbeing across the population that results. I suspect this gets two and five right and loses four, but I would rather be told precisely where it breaks than reassured.

  What I am after, then: the two or three candidate principles that come closest to my six verdicts, each stated precisely enough that I could apply it to an unfamiliar case without further instruction; for each, which of my cases is doing the work of motivating each clause; what each predicts about two situations I have deliberately not resolved — a couple who take a fertility drug that raises the resulting child's risk of a painful but manageable condition, without which they would have no child at all, and a government that pays couples to have one fewer child so that the smaller resulting population is better off; and a plain account of which of my verdicts each principle forces me to surrender, ranked by how much the surrender costs me. If one of my reactions is not an intuition at all but motivated reasoning dressed as one, tell me which and why.
reasoning: |-
  Okay, I need to help this science journalist who's struggling with ethical principles around procreation and selection. They've presented six cases where their intuitive judgments seem inconsistent, and they want me to identify underlying principles that could explain these judgments.

  First, let me summarize their cases clearly:
  1. Postponement - Delaying pregnancy by 4 years, resulting in different child. They see no problem.
  2. Requested trait - Deaf couple selecting deaf embryo. They disapprove despite no harm.
  3. Plant leak (two versions) - Early leak harming existing people = wrong; late leak affecting only people who wouldn't exist otherwise = still wrong with same intensity.
  4. Screening program - Public funding for embryo health selection. They endorse it.
  5. Settlement - Larger population with barely worth-living lives = mildly regrettable.
  6. Reversal - Replacing large marginal population with smaller better-off one = wrong.

  Their current principle (harm to specific individuals or lower average wellbeing) seems inadequate. I need to find better-fitting principles.

  Looking at their strong reactions:
  - They're really troubled by case 3's invariance - condemning the late leak as strongly as the early one even though no one is harmed. This suggests a deontological element.
  - They endorse embryo selection for health (case 4) but would condemn applying same criteria to born children - important distinction between selection and modification.
  - In case 6, they oppose replacing population even though it improves average wellbeing - indicates they value existing people over potential gains.

  Possible principles emerging:
  1. Person-affecting restriction with exceptions: Generally only consider harm to actual people, but with strong non-person-affecting intuitions in some cases (like the plant leak).
  2. Distinction between creating vs shaping lives: Different rules for selecting who exists versus how we treat existing people.
  3. Asymmetry: Not creating lives isn't wrong even if lives would be good, but creating bad lives is wrong.

  For case 2 (deaf embryo), their disapproval might stem from viewing disability as harm regardless of person's perspective, but they acknowledge the child's life is good. This suggests a societal or symbolic concern rather than individual harm.

  For the unresolved cases:
  - Fertility drug case: Moderate risk to child - probably acceptable since alternative is no existence.
  - Government paying for fewer children: They might oppose this strongly because it involves preventing existences that would be worth living.

  I think the "Person-Affecting Principle Plus" best captures most of their intuitions, though it struggles with case 3. The "Distinction Principle" handles the screening case well but might be too narrow.

  Ultimately, they'll need to either:
  1) Stick with person-affecting but make exception for environmental harm cases
  2) Admit some intuitions conflict and prioritize some over others
  3) Develop a hybrid principle with thresholds

  Their discomfort with case 3's invariance is the biggest challenge - it might require abandoning strict person-affecting ethics for some contexts involving environmental responsibility.
answer: |-
  Based on your six concrete cases and your reactions, I identify two candidate ethical principles that best capture your intuitions, along with a third "hybrid" option that minimizes the surrenders you'd need to make. Your discomfort stems from a tension between **person-affecting morality** (focusing on harm to identifiable individuals) and **non-person-affecting intuitions** (judgments about which kinds of lives *should* be brought into existence, regardless of harm). Below, I state each principle precisely, map them to your cases, test them against your unresolved situations, rank the required surrenders, and flag a potential motivated reasoning.

  ---

  ### **Candidate Principle 1: The Person-Affecting Principle Plus (PAP+)**
  **Statement:** An act is wrong if either:  
  (A) It makes a specific existing or future person worse off than *they* would have been otherwise, *or*  
  (B) It creates a person whose life is not worth living ("below-zero wellbeing"), *or*  
  (C) It deliberately creates persons with avoidable, significant, non-consented-to disadvantages *that society deems a harm*, even if their lives are still worth living.  

  #### **How Your Cases Motivate PAP+**:
  - **Clause (A)** handles **Case 1 (Postponement)** and **Case 5 (Settlement)**: No one is harmed, so no wrong.  
  - **Clause (B)** handles **Case 3 (Plant Leak, early version)**: Children are made worse off (harmed) relative to their alternative existence.  
  - **Clause (C)** handles your intuitions in **Case 2 (Requested Trait)** and **Case 3 (Plant Leak, late version)**:  
    - In Case 2, selecting a deaf embryo creates a child with a non-consented-to disadvantage (deafness) deemed harmful by society, even if the child’s life is good overall.  
    - In Case 3 (late leak), the mutagen inflicts a non-consented-to disadvantage (chronic illness) society deems a harm, making it wrong regardless of whether the child would otherwise not exist.  
  - **Case 4 (Program)** and **Case 6 (Reversal)** are *not* directly covered—requiring surrenders (see below).

  #### **Predictions for Unresolved Situations**:
  1. **Fertility drug with painful condition risk**:  
     - *Prediction: Permissible.* Clause (A) doesn’t apply (no specific person is worse off; without the drug, the child wouldn’t exist). Clause (B) doesn’t apply (life is worth living). Clause (C) *might* apply if the condition is deemed a "significant disadvantage," but you’d likely argue it’s not deliberate harm and is outweighed by existence. PAP+ leans toward allowing it.  
  2. **Government pays for one fewer child (smaller, better-off population)**:  
     - *Prediction: Wrong.* Clause (A) doesn’t apply (no one is harmed). But Clause (C) *could* apply if preventing existence is seen as denying a worthwhile life, though PAP+ doesn’t clearly forbid it. Your intuition likely aligns with condemning this (as in Case 6), but PAP+ struggles here—it’s not a strong fit.

  #### **Surrenders Required** (Ranked by Cost to You):  
  1. **Case 4 (Program)**: You endorse it, but PAP+ doesn’t clearly permit it. Selecting for healthspan doesn’t harm anyone (A), lives are worth living (B), and it avoids disadvantages (so not C). But PAP+ lacks a clause for *encouraging better lives* without harm. *Surrender Cost: High*—you lose your endorsement.  
  2. **Case 6 (Reversal)**: You think it’s wrong, but PAP+ permits it. Replacing the population doesn’t harm anyone (A), lives created are better (not B or C). PAP+ might allow it via Clause (C) if the policy "deliberately denies existence," but it’s strained. *Surrender Cost: High*—you must accept it as permissible.  
  3. **Case 5 (Settlement)**: PAP+ permits it (no harm), matching your "mildly regrettable" verdict. No surrender.  

  **Net Cost**: High. Surrenders your core endorsements in Cases 4 and 6.

  ---

  ### **Candidate Principle 2: The Asymmetric Harm-Benefit Distinction (AHBD)**  
  **Statement:** An act is wrong if:  
  (A) It makes a specific person worse off than *they* would have been, *or*  
  (B) It creates a person with a life not worth living, *or*  
  (C) It *fails to prevent harm* to a future person when possible *without sacrificing comparable benefits*, *or*  
  (D) It deliberately creates persons with *unavoidable and severe disadvantages* (even if life is worth living), **but**  
  (E) It is *not* wrong to:  
     - (i) Choose not to create a person who *would* have a life worth living, *or*  
     - (ii) Selectively create persons *without* disadvantages when doing so doesn't harm anyone.  

  #### **How Your Cases Motivate AHBD**:  
  - **Clause (A)** handles **Case 1 (Postponement)** and **Case 3 (Plant Leak, early version)**.  
  - **Clause (B)** handles the "harm" aspect of **Case 3 (late leak)** by treating the mutagen as creating severe disadvantages.  
  - **Clause (C)** explains **Case 2 (Requested Trait)**: The clinic *fails to prevent harm* (deafness) when it could easily choose a hearing embryo.  
  - **Clause (D)** reinforces **Case 3 (late leak)**: The leak creates unavoidable/severe harm.  
  - **Clause (E)(ii)** justifies **Case 4 (Program)**: Selecting for healthspan avoids disadvantages without harm.  
  - **Clause (E)(i)** handles **Case 5 (Settlement)**: Not creating the larger population isn’t wrong (mildly regrettable).  
  - **Case 6 (Reversal)** is *not* covered—requiring a surrender.  

  #### **Predictions for Unresolved Situations**:  
  1. **Fertility drug with painful condition risk**:  
     - *Prediction: Permissible.* The drug doesn’t make anyone worse off (A), life is worth living (not B), and it avoids "failing to prevent harm" by enabling existence (C). Clause (D) doesn’t apply (the condition is manageable, not severe). AHBD allows it.  
  2. **Government pays for one fewer child**:  
     - *Prediction: Permissible.* Clause (E)(i) explicitly states that not creating people with worthwhile lives isn’t wrong. This clashes with your intuition in Case 6.  

  #### **Surrenders Required**:  
  1. **Case 6 (Reversal)**: You think it’s wrong, but AHBD permits it via Clause (E)(i)—replacing the population is just "choosing not to create" people with worthwhile lives. *Surrender Cost: Very High*—it directly contradicts your verdict.  
  2. **Case 3 (Plant Leak, late version)**: AHBD condemns it (via C/D), matching your intuition. No surrender.  
  3. **Case 2 (Requested Trait)**: AHBD condemns it (via C), matching your intuition. No surrender.  
  4. **Case 5 (Settlement)**: AHBD permits it (via E(i)), matching your "mildly regrettable" verdict. No surrender.  

  **Net Cost**: Very high due to Case 6 surrender.  

  ---

  ### **Candidate Principle 3: Hybrid Threshold Deontology (HTD)**  
  *Optimized to minimize your surrenders while capturing your invariance in Case 3 and endorsements in Cases 4/6.*  
  **Statement:** An act is wrong if:  
  (A) It makes a specific person worse off than *they* would have been, *or*  
  (B) It creates a person whose life is not worth living, *or*  
  (C) It *imposes non-trivial, non-consented-to burdens* on future persons *that could be avoided without sacrificing important goods*, **or**  
  (D) It *instrumentalizes* procreation by treating future persons as mere means (e.g., for parental preferences or social engineering), **but**  
  (E) It is *not* wrong to select among potential persons to avoid burdens (e.g., healthspan screening) if done for *their* expected benefit.  

  #### **How Your Cases Motivate HTD**:  
  - **Clause (A)** handles **Case 1** and **Case 3 (early leak)**.  
  - **Clause (C)** handles **Case 2**, **Case 3 (late leak)**, and **Case 6**:  
    - Case 2: Deafness is a non-trivial burden that could be avoided (by selecting a hearing embryo).  
    - Case 3 (late): The leak imposes burdens (illness) avoidable by safer design. Your condemnation invariance is preserved.  
    - Case 6: Replacing the population imposes a "burden" via non-existence on those who could have lived worthwhile lives.  
  - **Clause (D)** explains **Case 2** and **Case 6**:  
    - Case 2: Selecting deafness instrumentalizes the child (prioritizing parental identity over avoiding burdens).  
    - Case 6: Replacing the population treats people as expendable for aggregate welfare.  
  - **Clause (E)** justifies **Case 4 (Program)**: Healthspan screening avoids burdens for the child’s sake.  
  - **Clause (C)** also handles **Case 5 (Settlement)**: No burdens are imposed (existing people untouched), so it’s not wrong.  

  #### **Predictions for Unresolved Situations**:  
  1. **Fertility drug with painful condition risk**:  
     - *Prediction: Permissible.* The burden is trivial/manageable and unavoidable (without the drug, no child exists). Not instrumentalizing. HTD allows it.  
  2. **Government pays for one fewer child**:  
     - *Prediction: Wrong.* Imposes non-existence on would-be persons with worthwhile lives (burden via Clause C) and instrumentalizes procreation (Clause D: social engineering). Matches your Case 6 intuition.  

  #### **Surrenders Required**:  
  1. **None for your core cases**: HTD matches your verdicts in all six cases:  
     - Case 1: Permitted (A not triggered).  
     - Case 2: Wrong (C: avoidable burden; D: instrumentalization).  
     - Case 3 (both): Wrong (C: avoidable burden).  
     - Case 4: Permitted (E: avoids burdens for child’s sake).  
     - Case 5: Permitted (no burden imposed).  
     - Case 6: Wrong (C/D: burden and instrumentalization).  
  2. **Potential stretch in Case 5**: You called it "mildly regrettable," but HTD permits it. *Surrender Cost: Low*—you accept it as not wrong, which fits your description.  

  **Net Cost**: Minimal. Only mild softening of Case 5 verdict.  

  ---

  ### **Diagnosis of Motivated Reasoning**  
  Your reaction to **Case 4 (Program)** may reflect motivated reasoning dressed as intuition:  
  - **Why**: You endorse state-funded embryo screening for healthspan but call it "monstrous" if applied to born children. This is consistent (selection vs. modification differs ethically), but your *justification* is shaky. You appeal to "no one worse off" in Case 4, yet reject that logic in Case 2 (deaf embryo) and Case 3 (late leak). HTD resolves this by emphasizing burdens and instrumentalization, but your initial discomfort suggests you're downplaying the similarity between selecting *for* health (Case 4) and selecting *against* it (Case 2). The deeper principle is likely about **avoiding imposed burdens** (HTD’s Clause C), not person-affecting harm.  

  ---

  ### **Recommendation**  
  **Hybrid Threshold Deontology (HTD)** best captures your judgments with minimal surrender. It:  
  1. Explains your invariance in **Case 3** (avoidable burdens matter, regardless of whether people would otherwise exist).  
  2. Endorses **Case 4** as pro-child without instrumentalization.  
  3. Condemns **Case 6** as imposing non-existence burdens.  
  4. Handles your unresolved cases cleanly.  

  **If HTD feels forced**, your intuitions are closest to **PAP+**, but you must surrender your endorsements of the screening program (Case 4) and condemnation of population replacement (Case 6). This suggests your deepest commitment is to **non-harm and anti-instrumentalization**, not strict person-affecting morality. For your article, focus on the tension between selecting *for* benefit vs. *against* harm—the HTD framework makes this explicit.
