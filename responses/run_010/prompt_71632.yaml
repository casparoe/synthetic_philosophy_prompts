  Hmm, the user is preparing a two-hour session for a research-ethics working group on the validity of consent. They want a decision tree that starts from expressed agreement and ends with named positions on validity. The group has diverse backgrounds: medical researchers, lawyers, a philosopher. They struggle with disagreements beyond basic cases like signatures or competent adults saying yes.

  The key requirements are: seven-ish branch nodes, no more than ten leaves; questions must be concrete or plain yes/no, not referencing theories; cover splits like consent as attitude vs. performance, validity from genuineness vs. moral work, deception, coercion, competence, and unacknowledged agreement; analyze logical space for empty cells; name each leaf view and its awkward commitment; flag any indistinguishable leaves; keep it under 800 words with indented formatting.

  I need to build this tree step by step. Start from "expressed agreement" and branch based on core disagreements. First, split on whether consent is fundamentally an internal state (attitude) or an external act (performance). This covers the attitude vs. performance split. Then, for each, probe validity sources: if attitude, is validity about genuineness or moral work? If performance, is it about the act itself or what it achieves?

  Next, handle deception: distinguish being wrong about the "what" (nature of the act) vs. the "why" (reasons for agreeing). Use the trial participant case where they know the drug is experimental but not the sponsor's conflict of interest. This tests if deception invalidates only when it misrepresents core facts.

  For coercion, split between direct threats and rotten backgrounds. The surrogacy agreement under financial pressure case illustrates how offers vs. threats play out, and the night-shift worker shows how systemic pressures might coerce without explicit force. This addresses whether coercion requires active imposition or can stem from unjust circumstances.

  Competence comes next: is it about cognitive capacity or adequate knowledge? The patient case—understanding effects but not jargon—helps differentiate: if capacity is key, she might be competent; if knowledge, she might not. This splits views on what competence entails.

  Finally, consider unacknowledged agreement: can consent exist if someone doesn't realize they're giving it? This is tricky and might be empty or rare, but I'll include it for completeness.

  Now, map the logical space. Start with Q1: Is consent an internal attitude? Yes leads to Q2 on validity source; no leads to Q3 on whether it's a performance. Then branch into deception, coercion, competence. For each path, I'll identify possible answer combinations and note empty cells.

  Empty cells: For example, if consent is neither attitude nor performance, that's incoherent—must be one or both. Or, if validity comes from moral work for an attitude-only view, it might be unappealing because attitudes alone don't interact with the world. Views that deny competence matters at all could exist but are rarely explored in ethics.

  Leaves should have short names and awkward commitments. For instance, "Pure Attitude View" committed to ignoring misunderstandings if intent was good, or "Performative Minimalism" accepting any agreement without probing context. Flag pairs like "Structural Coercion View" and "Sufficiency View"—they might overlap on rotten backgrounds, but I can separate them with the coercion question.

  Keep it concise: use indented bullets, abbreviate questions, one sentence per node. Aim for under 800 words. The cases provided (trial participant, surrogacy, patient, night-shift worker) will anchor principles to concrete dilemmas.

  Finally, ensure the tree flows logically and covers all required splits. Test for coherence: no dead ends, minimal overlaps, clear distinctions. This should help the group pinpoint disagreements and move past talking past each other.
answer: |-
  Here's a decision tree mapping the logical space of consent validity, starting from expressed agreement (EA). Nodes are concrete questions, leaves are named positions with their awkward commitment.

  ```
  1.  Is consent fundamentally an internal attitude (state of mind) *required* for EA to be valid? (e.g., Patient understands effects but not name; if attitude is fundamental, misunderstanding the name *might* invalidate if it reflects wrong attitude)
      ├── Yes (Attitude Primacy) ➔
      │   2.  Does validity *primarily* come from the attitude being genuine (true to self), not its consequences? (e.g., Does sincere agreement based on horribly wrong beliefs still count as valid consent?)
      │       ├── Yes (Authenticity View) ➔
      │       │   3.  Does deception about *reasons* for the act (why it's worth doing) *always* invalidate by distorting genuineness? (e.g., Trial participant not told sponsor controls both arms, altering perceived justification)
      │       │       ├── Yes (Deep Authenticity) ➔ **Leaf: Purity View** (Awkward: Valid consent possible even with profound ignorance of the act's *nature*, if the person feels authentic about agreeing.)
      │       │       └── No (Shallow Authenticity) ➔ **Leaf: Sincerity View** (Awkward: Consent based on lies about core facts of the act (e.g., "this is sugar water") can be valid if the person *feels* authentic in their mistaken agreement.)
      │       └── No (Moral Attitude View) ➔
      │           4.  Does validity require the attitude *also* fulfills a moral function (e.g., respecting autonomy, enabling reciprocity)? (e.g., Does agreeing under extreme systemic pressure fail morally even if "genuine"?)
      │               ├── Yes (Normative Attitude) ➔ **Leaf: Integrated View** (Awkward: A person can have a "genuine" attitude to agree, but if it doesn't meet external moral standards, it's invalid, blurring attitude/performance.)
      │               └── No ➔ *Empty Cell* (Incoherent: If validity doesn't come from genuineness *or* moral function for an attitude-centric view, nothing grounds validity.)
      └── No (Performance Primacy) ➔
          5.  Is consent fundamentally the performative act (EA) itself? (e.g., Patient says "yes" understanding effects; the act of agreement is key, not deep attitude about names)
          ├── Yes (Pure Performance) ➔
          │   6.  Does validity come *only* from the act meeting formal criteria (communication, capacity), regardless of background pressures? (e.g., Night-shift worker signs knowing cost of refusal; surrogacy signed under systemic poverty)
          │       ├── Yes (Formal View) ➔ **Leaf: Performative Minimalism** (Awkward: Coercive threats invalidate, but extreme, unchosen poverty creating identical pressure does not, if the "yes" is clear and competent.)
          │       └── No (Substantive Performance) ➔
          │           7a. Is coercion defined *only* by direct threats imposing new harms? (e.g., "Sign or I break your leg" invalidates; "Sign or starve" due to background poverty does not)
          │               ├── Yes (Threat-Based Coercion) ➔ **Leaf: Agency View** (Awkward: Consent is valid in profoundly unjust situations where no one directly threatened the consenter, if they "chose" the least bad option.)
          │               └── No (Structural Coercion) ➔ **Leaf: Structural View** (Awkward: Validity depends on contested judgments about background justice; consent in *any* unequal society might be suspect.)
          └── No (Both Attitude & Performance) ➔
              7b. For validity, must the EA *accurately reflect* a corresponding internal attitude? (e.g., If you say "yes" but internally reject the act, is consent invalid even if others reasonably rely on the "yes"?)
                  ├── Yes (Reflection Required) ➔
                  │   8.  Does competence require *only* basic cognitive capacity, not specific knowledge? (e.g., Patient understands effects but not jargon; if capacity suffices, she's competent)
                  │       ├── Yes (Capacity View) ➔ **Leaf: Hybrid-Capacity View** (Awkward: A person with capacity can give valid consent while being wildly mistaken about what they're agreeing to, if they hold a matching attitude.)
                  │       └── No (Knowledge View) ➔ **Leaf: Hybrid-Knowledge View** (Awkward: Requires defining "sufficient knowledge" – how much misunderstanding invalidates? Understanding effects but not risks? Not benefits?)
                  └── No (Sufficiency of Performance) ➔ **Leaf: Reliance View** (Awkward: Consent is valid based *only* on the EA performing its social function (e.g., permitting action), even if the person secretly disagrees or misunderstands.)
  ```

  **Logical Space Notes:**
  *   **Empty Cell 1 (After Q4/No):** Incoherent. If consent *is* fundamentally an attitude, validity *must* come from some property *of that attitude* (genuineness or moral function).
  *   **Empty Cell 2 (Pure Performance + Validity needs more than form):** Covered by branching into Q7a. Pure Performance logically forces the validity question onto the act itself (form vs. substance/context).
  *   **Q7a vs Q7b:** These are distinct paths based on the answer to Q5. Q7a explores coercion within Pure Performance. Q7b explores the attitude link within the "Both" path. They address different core splits.
  *   **"Both" Path:** Denying that consent is *fundamentally* either attitude or performance (Q1 No, Q5 No) implies it necessarily involves both. The split then is *how* they interact (Reflection Required vs. Sufficiency of Performance).

  **Indistinguishable Pair?**
  *   **Structural View (Q7a/No) & Reliance View (Q7b/No)** might *functionally* agree in many rotten background cases: both see the EA as potentially valid *despite* the background if the act itself meets criteria (Structural: if not *deemed* coercive; Reliance: because performance is sufficient). However, they **can be separated**: The Reliance View cares *only* about the EA's function/perception, *regardless* of internal attitude or background justice. The Structural View cares deeply about background justice *as part of* assessing the validity of the performative act, even if attitude isn't central. A case of secret internal dissent (say "yes" but mean "no") with a *just* background would be valid for Reliance but invalid for Structural only if the background coercion existed. The coercion question (Q7a) decisively splits them.

  **Key Anchoring Cases:**
  *   **Q1/Q5:** Patient (name vs effects)
  *   **Q3:** Trial Participant (sponsor conflict - reason deception)
  *   **Q7a:** Surrogacy (systemic pressure) & Night-shift worker (cost of refusal)
  *   **Q8:** Patient (effects understood, name not)
