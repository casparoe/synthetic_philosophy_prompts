prompt: |-
  I'm in a philosophy of mind seminar on mental content and over the weekend I built an argument against teleosemantics that now strikes me as way to good to be right, which is exactly why I don't trust it. Background so this is answerable: we did two weeks on the disjunction problem. The frog's fly-detector fires at flies but also at BBs and dark moving specks, so on a straight covariation account what it means is something like small-dark-moving-thing, or fly-or-BB, and the frog therefore never misrepresents — which is supposed to be fatal, since a theory of content that can't make room for error isn't a theory of content. Teleosemantics is the standard fix: bring in selection history, and the disjunction gets cut by what the mechanism was shaped to do rather than by what it currently tracks. Here is my argument that the fix generalizes the disease instead of curing it.

  (1) On teleosemantics, what a state is about is settled by the selection history that produced and maintains it — by what the state was selected to do, not by what it happens to covary with now.
  (2) But selection doesn't select representations. It selects organisms and lineages on overall reproductive success; internal states are retained only insofar as they contribute to that.
  (3) So a state's content is fixed only at the granularity at which its contributing made a fitness difference.
  (4) For any real organism, a great many candidate contents are fitness-equivalent: the frog's state can be specified as tracking flies, as tracking small dark moving things, as tracking protein, as tracking edible-flying-insect-or-BB, and every one of those specifications cashes out in identical behavior and identical offspring counts over the species' whole history.
  (5) Where selection history is indifferent between candidate contents, there is no fact of the matter which content the state has.
  (6) So no actual biological state has determinate content — not the frog's, and not mine, since my FLY, WATER, and even GRANNY concepts each admit indefinitely many fitness-equivalent rival specifications.
  (7) Therefore teleosemantics fails to naturalize content, and fails in the paradigm human cases, not just in the exotic frog case it was designed to handle.

  What makes me nervous is that I want (7) to be false and I can't find a premise to drop. I'm attached to (2) in particular; I've read enough population genetics to not want to say selection literally targets representations, and (2) also seems to be the premise that makes the argument respectable — it's not leaning on swampman intuitions or on any thought experiment, it's just an inference from how selection actually works. My seminar partner's reply was that (1) is a strawman: on the consumer-semantics version, content is fixed by what the downstream systems that use the state need it to be about in order to perform their functions, so the tie in (4) gets broken by looking at the consumers rather than at contributions to fitness. I don't think that helps, and I have a dilemma for it, but I'm worried the dilemma is cheap. Either the consumers are themselves representational states, in which case they need contents of their own and we regress; or the consumers' needs are just cashed out in fitness terms, in which case we're back at (4) with extra steps and the indifference is exactly as total as before.

  So: which step do you reject, and what does rejecting it cost? I'd like the diagnosis to be specific about why the rejected step looked acceptable in the first place, because I wrote it down and it looked fine to me at the time. Part of what I'm after is whether (4) to (5) is a real inference or a slide — my partner thinks I'm just flinching at a valid step, and I can't decide whether he's right, so argue it rather than taking my word for either side. Then I want you to price the alternatives: what does a defender of (2) who rejects the argument have to say about content granularity, and what does someone who gives up (2) owe us? Finally, say what the best version of the consumer-semantics reply actually looks like, because if it does break the tie in (4) I need to know which horn of my dilemma it escapes and what it pays for the escape — I have a term paper due on this and I'd rather the paper be about the surviving objection than about a dead argument.
reasoning: |-
  Okay, let me tackle this user's argument against teleosemantics step by step. The user is in a philosophy of mind seminar focusing on mental content, specifically the disjunction problem. They've constructed an argument they feel might be too good to be true, which makes them suspicious. 

  First, I need to fully understand their argument. The core issue is that teleosemantics uses selection history to fix content, avoiding the disjunction problem where covariation leads to indeterminate content. But the user argues that selection history itself leads to indeterminacy because many content specifications are fitness-equivalent. 

  The user's premises seem solid at first glance. Premise (2) is key: selection acts on overall fitness, not specific representations. This seems biologically accurate. Premise (4) claims that for any state, multiple content specifications are fitness-equivalent. That's plausible—tracking flies vs. small dark moving things might not differ in fitness outcomes. 

  Where might the argument go wrong? The user's seminar partner suggested consumer semantics as a solution. The dilemma the user presents—either regress or collapsing back into fitness—is a strong challenge. But maybe consumer semantics can avoid it if "needs" aren't representational but functional. For example, the frog's feeding mechanism consumes the fly-detector state in a specific way—snapping at small moving things. That function is selected for capturing flies, so even if BBs trigger it, the function is still for flies. This could break the tie without regress. 

  But the user might counter that the feeding mechanism's function is also fitness-equivalent under different descriptions. The key here is whether teleosemanticists can argue that biological functions have determinate grain. Millikan, for instance, talks about "proper functions" being historically specific. If the feeding mechanism was selected for responding to flies specifically, that's the content. But is that historically accurate? Evolution might not select that finely.

  Another point: premise (5) assumes that selection indifference implies no fact of the matter. But teleosemanticists could argue that content is fixed by the specific causal relations that were selected, not just fitness outcomes. For example, the frog's state covaries with flies in the actual historical environments where selection occurred. BBs weren't present, so the content is flies. But then, what about novel environments? That's a problem.

  The user's worry about premise (5) being a slide is valid. Moving from "fitness-equivalent" to "no fact of the matter" might ignore that selection history picks out actual causes. But if multiple causes are equally fitness-contributing in history, does that make content indeterminate?

  The cost of rejecting premises: If we reject (2) and say selection does target specific representations, that seems biologically implausible. Upholding (2) but denying (5) requires showing that fitness-equivalence doesn't imply content equivalence. Maybe through specific historical causal chains. 

  For the term paper, the user should explore if consumer semantics can avoid the dilemma by invoking systemic functions without regress. Also, investigate cases where historical environments had disjunctions (like flies and similar insects) and how teleosemantics handles that. The argument might not kill teleosemantics but show it needs refinement, making it a good paper topic.
answer: |-
  Your argument is rigorous and exposes a genuine tension in teleosemantics—specifically, the **grain problem**. I reject **premise (5)**: "Where selection history is indifferent between candidate contents, there is no fact of the matter which content the state has." Here’s the breakdown:

  ### Why (5) Looks Tempting but Fails
  - **Why it seems acceptable**: If multiple descriptions (e.g., FLY vs. SMALL-DARK-MOVING-THING) are *extensionally equivalent* in their fitness contributions, it feels intuitive that evolution "can't tell the difference." Since teleosemantics roots content in selection, indifference should imply indeterminacy.
  - **Why it’s a slide**: Teleosemantics doesn’t require that selection *distinguishes* between conceptual descriptions. It requires that content is fixed by **the actual causal-historical properties** that explain the mechanism’s retention. Even if two descriptions *pick out the same fitness contribution*, one might better capture **the specific causal relation** that was evolutionarily relevant. 

  ### The Cost of Rejecting (5)
  You must defend **historical specificity**: 
  > "The frog’s state tracks *flies* (not disjunctions) because flies were the *actual environmental feature* that caused the state and drove selection. BBs are modern aberrations; in the historical environment, all small-dark-moving-things *were flies*."

  **Cost**: This commits teleosemantics to **actual environmental details** over abstract equivalence classes. If paleontology revealed that ancestral frogs encountered both flies *and* non-fly specks (e.g., windblown debris) that were fitness-equivalent, your argument resurfaces. Teleosemanticists must deny this or appeal to statistical dominance (e.g., "flies were 99.9% of cases").

  ---

  ### Defending (2) While Blocking the Argument
  A teleosemanticist who accepts (2) ("selection acts on fitness, not representations") can reject (7) by **denying (4)**:
  - **Counter to (4)**: Not all specifications are fitness-equivalent. "Tracking flies" vs. "tracking protein" may diverge in edge cases: a protein-rich non-fly might trigger maladaptive behavior (e.g., snapping at toxic insects). Selection filters for *specific reliable indicators*, not coarse categories.  
  - **Cost**: This demands granular evidence about ancestral environments. If frogs historically encountered only flies (no BBs, no lookalikes), "fly" wins. If not, teleosemantics *does* face indeterminacy—but this is an empirical problem, not a fatal flaw.

  ---

  ### Consumer Semantics: Escaping Your Dilemma
  The best version of consumer semantics (e.g., Millikan, Papineau) **takes the first horn of your dilemma** ("consumers are representational") but avoids regress by **grounding content in systemic function**:

  > The frog’s fly-detector state is consumed by a *snapping mechanism*. This mechanism’s proper function is **to capture flies**, not BBs. Its success depends on the state correlating with flies, so the state’s content is *fly*—even if BBs trigger it identically.

  **How it breaks your dilemma**:
  1. **No regress**: Consumer states need content, but they get it from *their own* selection history. The snapping mechanism’s function (ingest flies) is fixed by how it contributed to fitness *as a whole system*. Content is "bootstrapped" by the network’s functions.
  2. **Breaks fitness-equivalence**: "Fly" is privileged because the consumer’s function (capturing flies) would *malfunction* if it snapped at non-nutritious BBs—even if BBs haven’t reduced fitness *yet*. Content is fixed by **what the consumer *needs* to fulfill its function**, not fitness outcomes.

  **Cost**: This assumes biological functions are **normative** (e.g., snapping "should" target flies). Critics (e.g., Fodor) argue this smuggles in intentionality. It also struggles with novel stimuli: if frogs encounter BBs for millennia, does "fly" content erode?

  ---

  ### Recommendation for Your Paper
  Your argument survives against "naive" teleosemantics but stumbles against **sophisticated consumer-based versions**. Focus your paper on:
  1. **The grain problem**: Does evolution select *specific enough* causal relations to fix content?  
  2. **Consumer semantics**: Does it avoid regress, or does it push indeterminacy to the consumer’s content?  
  3. **Empirical vulnerability**: If ancestral environments contained disjunctions (e.g., flies + edible beetles), is content inherently indeterminate? 

  **Strongest surviving objection**: Even with consumer semantics, teleosemantics cannot resolve content determinacy in cases where **historical environments contained fitness-equivalent disjuncts**. This forces teleosemanticists into contentious empirical claims about evolutionary history—a weakness your paper can exploit.

  *"Teleosemantics doesn’t solve the disjunction problem; it outsources it to paleontology."* — That’s a thesis worth defending.
