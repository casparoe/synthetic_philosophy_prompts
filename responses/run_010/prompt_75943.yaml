prompt: |-
  So — three years into an ecology PhD, and for the last two terms I've been sitting in on the philosophy of science seminar over in the history department, mostly because the guy who runs it (call him H) keeps a chalkboard at the front of the room with a list of thought experiments on it and a grade next to each one, and half the pub afterwards is people arguing about the grades. There's three grades: it gives you real knowledge about the world, it only tells you something about our concepts, or it tells you nothing whatsoever. The reason I've started caring about this in a personal, sleep-affecting way is that I've realised the central argument of my second chapter *is* a thought experiment, I'm presenting it in three weeks time with H in the room, and my supervisor says he's sunk two chapters already for exactly this reason. I've read a bit around the general debate — the argument about whether these things are just arguments in fancy dress versus whether some of them hand you something no amount of experience could — but I genuinely cannot map his board onto that, so I need help working out what he's actually running.

  Here's the board as of last week, with the little remarks he makes while he writes them up, which I've been keeping because I think they carry most of the information. **Real knowledge:** Galileo's cannonball tied to the musket ball ("the only case on this whole board where we get something for nothing"); Einstein's magnet and conductor ("write it out and every single premise is something an electrical engineer already knows"); the freely falling elevator ("you feel that one in your knees"); Maxwell's demon ("and note the knowledge came out of a hundred years of people failing to build one"); Olbers, why the night sky is dark ("it's arithmetic about candles — nobody has ever seen an infinite universe"); the ratchet and pawl running backwards off its own heat; EPR as a purely paper argument, before anybody tested anything ("valid, and it gave us something we didn't have, but it only rearranged premises that were already sitting on the table — the experiments did the rest"); the twin paradox ("by the time anyone teaches that one now the clocks have already been flown, so I think the intuition is borrowed"); and Darwin's argument from what pigeon fanciers manage in a couple of decades ("though I won't call it a law — it's a tendency with exceptions, and every breeder in England already knew all of it"). **Nothing at all:** Newton's bucket ("empty the universe down to just the bucket and the intuition flips, spin the whole cosmos instead and it flips again — a case whose verdict depends on what *isn't* there isn't measuring anything"); Schrödinger's cat ("a perfectly good argument for a conclusion nobody wants, namely that we'd been saying something incoherent, and it told us nothing about cats"); Zeno's Achilles ("calculus ate it"); Thomson's lamp, toggled infinitely many times before noon ("a completed infinity of switchings isn't a limit you can approach, it's just a different animal"). **Concepts only:** Laplace's demon ("a definition wearing a coat"). He flatly refuses to rule on Hilbert's hotel ("maths, not science") and on Twin Earth and the Chinese Room ("not my department").

  My case, in full, so you can judge it. A guy in my conservation program states a principle as though it were a law — call it P: any way of behaving that lets a group of organisms persist longer will, given enough generations, end up more common than any way of behaving that doesn't. I want to break it. So: one valley, one species, sealed — no migration in or out, nobody ever innovates anything, and food is unlimited (stipulate that, it matters). Two variants. Slow lives twenty years and leaves six offspring over a lifetime. Fast lives two years and leaves three offspring over a lifetime — so per head per year Fast compounds at about 1.7 and Slow at about 1.1. Now run it. Read P literally, individual by individual: a Slow one lasts ten times as long as a Fast one, so Slow takes the valley. Read it the way people usually read "does better" — descendants left per lifetime — and Slow wins again, six to three. But actually compound the two populations forward with the food unlimited and the time unlimited and Fast swamps Slow: it's essentially the whole valley inside a few decades. Then start lifting stipulations one at a time. Cap the food and run to equilibrium and Slow holds the valley (Slow converts food better, stipulate that too). Keep the food unlimited but make the weather swing in fifteen-year droughts and Slow holds it again (Slow is still alive when the good years come back). Keep both stipulations and let time run out to infinity and Fast wins. So the same principle applied to the same valley gives you three answers, and which one you get depends entirely on which of my idealisations you remove first, and P itself never says which. My fear is that H grades this as Laplace's demon in a cardigan — that I've only shown what "persist longer" fails to mean — rather than as a result about organisms.

  So: which seperate rules is that board actually consistent with, all of them, given the remarks as well as the grades? What does each of those rules predict he'll say about my valley, and do any of them predict the "concepts only" grade rather than a flat no? Then give me your best guess at the ruling and say which parts of the board you're leaning on to get there — I'd rather have a committed prediction with reasons than a shrug. And name the cleanest further case I could put to him, ideally one I could raise in discussion rather than in my own talk, that would force his top two candidate rules apart. Finally, if you think he sinks it: is there a variant of the same setup — same valley, same two variants, something changed about how I pose it — that he'd be obliged by his own board to grade as real knowledge?
