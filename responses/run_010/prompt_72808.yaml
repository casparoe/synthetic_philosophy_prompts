answer: |-
  Consider a monastic librarian, Ananda, who meticulously restores a damaged manuscript. Upon completing it, he makes a lakeside vow to the donor: "Should this text ever be harmed again by water, I personally will undertake its full restoration, even if years pass." Five years later, a flash flood soaks the manuscript. The monastery summons Ananda. However, during the interim, Ananda contracted a rare jungle fever. While he physically recovered, the fever induced profound psychological shifts: his passion for scriptural preservation vanished, replaced by a pragmatic focus on oral teaching; key memories of the restoration project and the vow became hazy, emotionally detached fragments; his once-patient temperament is now notably impatient. He feels no internal obligation towards the ruined book.

  Here, the Abhidharma reductionist faces a difficulty. The causal series of aggregates (physical form, sensations, perceptions, mental formations, consciousness) connecting pre-fever Ananda (who made the vow) and post-fever Ananda (who is summoned) exhibits significant disruption. The *samskāras* (mental formations) crucial for the vow – the specific intention, the emotional commitment, the memory binding him to the promise – are severely attenuated or qualitatively altered. The perceptual and cognitive habits are different. While some bodily continuity and a thread of consciousness persist, the *specific configuration and causal efficacy* of the aggregates relevant to the vow's undertaking and its binding force are broken. For the reductionist, the person "Ananda" is merely a conventional label applied to this particular, now significantly disrupted, causal sequence. The post-fever aggregate-series lacks the constitutive features that made the vow *that person's* obligation. Therefore, the monastery cannot legitimately *hold* this current series accountable; there is no underlying identical entity obligated. The vow effectively lapsed with the dissolution of the initial commitment-bearing aggregates. Sending this Ananda to restore the book is like demanding payment from a stranger who vaguely resembles the debtor.

  The Pudgalavādin, however, can navigate this scenario differently by appealing to the inexpressible person (*pudgala*). While acknowledging the drastic changes in the aggregates – the altered memories, the shifted motivations, the changed temperament – they posit a real, though indefinable, person who persists throughout. This person is neither identical to the aggregates (since they change radically while *he* continues), nor wholly other (since he is inseparable from them in any given moment). The vow was made *by* this person, not merely by a transient collection of aggregates. Therefore, the obligation adheres to *him*, the *pudgala*, despite the radical rearrangement of his supporting aggregates. The monastery is justified in summoning *him* and expecting *him* to fulfill the commitment, even if his current mental states (aggregates) lack the original fervor or clear recollection. The *pudgala* provides the necessary continuity for responsibility that transcends the flux of specific mental formations and memories. His current reluctance is a failure of *this person* to act according to his prior commitment, not evidence that the obligated entity ceased to exist.

  The conceptual pressure lands distinctly for each view. For the Abhidharma reductionist, the problem is **ethical attenuation through ontological parsimony**. Their rigorous denial of any entity beyond the aggregates makes it incredibly difficult to sustain commitments, responsibilities, or debts across significant psychological change. Obligations seem to dissolve as readily as the mental states that birthed them, potentially undermining the foundations of ethical life and communal trust. The pressure is squarely on ethics, revealing how their ontology struggles to ground enduring personal accountability when the "convenient designation" loses its convenient continuity. For the Pudgalavādin, the pressure is **ontological obscurity masquerading as ethical utility**. While the *pudgala* "saves" responsibility in this case, its inexpressible nature – being neither the aggregates nor other than them – becomes deeply problematic. *What exactly* is being held responsible? If it's not the aggregates that remember or feel obligated, and it's not a separable self, what persistent *feature* or *capacity* of the *pudgala* carries the obligation? The move feels like a semantic dodge that reintroduces a substantial self through the back door, precisely to salvage ethics and karmic continuity (across lives, but here within one life), without being able to clearly articulate what this salvaged entity *is*. The pressure lands hardest on ontology and semantics, making their core concept frustratingly elusive and suspect.

  While both problems are serious, the ethical attenuation facing the reductionist seems more immediately corrosive to the practical functioning of a community built on promises and responsibilities. The Pudgalavādin's obscurity is a theoretical cost, but their view at least *allows* for the intuitive ethical demand to hold Ananda accountable. However, this is a judgment call; one could equally argue that the Pudgalavādin's solution is ultimately empty, relying on an inexplicable mystery, while the reductionist, however harsh, is at least philosophically coherent and honest about the impermanent, composite nature of existence, forcing a radical re-evaluation of what commitment truly means in a world of flux. The scenario starkly exposes this contested tension.
