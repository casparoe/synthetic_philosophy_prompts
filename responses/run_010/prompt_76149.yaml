prompt: |-
  I am running a seventy-five-minute, whiteboard-only session for third-year students in a joint physics-and-philosophy programme. Every one of them has completed a course in classical mechanics and one term of introductory philosophy; none has read metaphysics, and none has met the word "supervenience" except as a noise. The topic is the dispute between Humean and anti-Humean accounts of the laws of nature: whether a law is nothing over and above a complete catalogue of the local matters of particular fact that obtain, or whether lawhood involves something further — a best-systematisation of that catalogue, relations of nomic necessitation among universals, an irreducible governing relation, or dispositional essences.

  What I need from you is a plan for how to explain this, not the explanation itself. Please address the following.

  1. **The order of exposition.** Give me the sequence of components, and for each, state what must already be in place before it can be understood and what would be damaged if it arrived later. Justify the ordering rather than listing it. I expect the sequence to have to accommodate at least: the difference between a generalisation that seems lawlike and one that is merely a true summary of what happens to occur; the claim that the two camps agree on every local fact; the claim that they nonetheless disagree about something; and the direction in which explanation runs, which is opposite on the two sides. I also want your view on whether the students should meet the Humean position or the anti-Humean one first, and why.

  2. **The carrying example.** I want a single scenario that carries the whole session rather than a sequence of illustrative anecdotes. It must be a world containing no observers, no scientists and no instruments, because I want to foreclose at the outset the reading on which "law" just means "our best description of the world." A full specification of that world's history — every particle's position at every moment, exhaustively — should leave the students feeling that something has been left unsettled, and both accounts should be statable about it. Tell me what the example must contain to do that work, what features would spoil it, and what foil regularity I should set beside it so that the students can feel the difference between lawlikeness and mere universality.

  3. **The misconception map.** Design around the picture they will arrive with: they have been taught that a law is a differential equation which, together with initial conditions, yields the subsequent history, and they slide unnoticed between "the equation lets us compute the future" and "the equation brings the future about." On top of that, I expect at least the following, and you may add others you judge more dangerous:

     - hearing "Humean," they conclude that laws are conventions, impositions, or useful fictions, and that physics has been debunked;
     - hearing "anti-Humean," they conclude that this is simply what physics already says and that the philosophers have manufactured a dispute out of vocabulary;
     - collapsing lawhood into determinism, so that an indeterministic law looks to them like a contradiction;
     - importing the juridical image of a legislator, so that the debate sounds like a quarrel over whether the universe has a lawmaker;
     - once told that laws summarise the mosaic, objecting that a summary cannot explain what it summarises, and treating that as a knockdown refutation rather than as the most interesting objection available.

     For each, tell me at which point in the sequence to head it off, whether I should raise it or let them raise it, and the one or two sentences I should say at that point.

  4. **The check for understanding.** I want something I can put to them near the end whose answers will separate students who have grasped the dispute from students who can recite "one side adds something." My own candidate is: given that Humeans and anti-Humeans agree on the entire local history of the world, name a question to which they give different answers. Tell me whether that question works, what a good answer sounds like, what a bad-but-predictable answer looks like, and, if you judge it unsuitable, what to ask instead.

  5. **What to omit, and how.** I am willing to leave out the technical prerequisites and the live objections: the worry that simplicity and strength are well defined only relative to a vocabulary and the metaphysics of naturalness required to fix one; the charge that nomic necessitation is an unintelligible brute relation; the question whether laws can be said to explain their instances if they are systematisations of them. I do not want to omit them silently. Tell me which to drop entirely, which to flag as deferred, and the sentence with which to flag each.

  Please do not recommend readings, sources, or further study, and do not write out the explanation itself — I want the plan, the ordering, and the diagnostic.
reasoning: |-
  Okay, the user is preparing a 75-minute whiteboard session for third-year physics and philosophy students on the Humean vs. anti-Humean debate about laws of nature. They need a structured plan addressing five specific areas. 

  First, considering the students' background: they know classical mechanics and intro philosophy but haven't encountered metaphysics or terms like "supervenience." The session must avoid technical jargon while making abstract concepts tangible. 

  For the order of exposition, I think starting with anti-Humeanism makes pedagogical sense. Students naturally intuit laws as explanatory forces from their physics training. Beginning there validates their instinct before challenging it with Humean reductionism. The sequence should build from concrete examples to abstract distinctions: first establish lawlike regularities vs accidental ones, then show both sides agree on facts but disagree on interpretation, and finally highlight the reversed explanation direction. 

  The carrying example needs to be a self-contained particle world - no observers or instruments to avoid conflating laws with descriptions. It must include a stable regularity (like orbiting particles) plus a foil (say, all particles being silver) to demonstrate lawlike vs accidental universality. Crucially, the world's complete physical history should feel insufficient to determine which regularity is lawlike - creating the unresolved tension both theories address. 

  Key misconceptions to preempt:
  - The "equation computes → governs" slide needs early correction by separating predictive tools from ontological claims. 
  - "Humean as fictional" must be blocked when introducing Humeanism by emphasizing it's about metaphysics not denying science. 
  - "Anti-Humean as physics default" should be addressed when contrasting positions, stressing physicists stay neutral. 
  - Determinism confusion requires clarifying probabilistic laws when defining lawhood. 
  - Juridical metaphors get flagged as misleading during the explanation-direction discussion. 
  - The "summary can't explain" objection should be surfaced deliberately as a pivotal insight rather than refutation. 

  The proposed check question - "what question would Humeans and anti-Humeans answer differently?" - is strong. Good answers focus on modal questions (e.g., "must particles orbit?"); bad answers drift into determinism or scientific methods. 

  For omissions: vocabulary-relativity and nomic necessitation objections can be dropped entirely as too technical. The explanation-regress concern should be flagged for future discussion with a phrase like "This circles into deep waters about explanation we'll navigate another time." 

  The session's arc should leave students seeing the dispute as substantive yet unresolved - a metaphysical choice about what grounds physical necessity, not just wordplay.
answer: |-
  Here’s a structured plan addressing your requirements:

  ---

  ### **1. Order of Exposition**  
  **Sequence & Justification:**  
  Start with **anti-Humeanism** first. *Why?* Students intuitively see laws as "governing" due to physics training. Begin there to validate their instinct before challenging it.  

  1. **Lawlike regularity vs. accidental generalization**  
     - *Prerequisite:* None (leverage physics intuition).  
     - *Damage if delayed:* Without this, the dispute seems verbal.  
     - *Justification:* Establishes the core puzzle (e.g., "Why expect future regularity?").  

  2. **Anti-Humean position**  
     - *Prerequisite:* Lawlike/accidental distinction.  
     - *Damage if delayed:* Delaying risks students dismissing Humeanism as "obviously wrong."  
     - *Key move:* Laws *explain* the mosaic (e.g., "Orbits occur *because* of gravitational law").  

  3. **Humean position**  
     - *Prerequisite:* Anti-Humeanism + agreement on local facts.  
     - *Damage if delayed:* If presented first, students may reject it as "trivializing" laws.  
     - *Key move:* Laws *are* the mosaic’s best summary (e.g., "Gravity ‘law’ is just a compact description of all orbits").  

  4. **Direction of explanation reversal**  
     - *Prerequisite:* Both positions clear.  
     - *Damage if early:* Incomprehensible without grasping both metaphysics.  
     - *Key move:* Contrast "Laws → Mosaic" (anti-Humean) vs. "Mosaic → Laws" (Humean).  

  **Why anti-Humean first?**  
  Students enter assuming laws are explanatory forces (anti-Humean). Acknowledge this, *then* introduce Humeanism as a deflationary alternative. Reduces resistance.  

  ---

  ### **2. The Carrying Example**  
  **Scenario:** A 2D particle universe with two types of regularities.  

  - **Core elements:**  
    - **Lawlike foil:** Particles always orbit clockwise under inverse-square force.  
    - **Accidental foil:** All particles coincidentally silver-colored (no causal role).  
    - **World specification:** Complete particle positions/times; both regularities hold universally.  

  **What it must contain:**  
    - A *dynamic pattern* (orbits) vs. *static property* (color).  
    - No agents, instruments, or "discoverers."  

  **What spoils it:**  
    - Introducing observers (invites "best description" reading).  
    - Letting color affect motion (blurs lawlike/accidental).  

  **Why it works:**  
    - Students *feel* orbit regularity is "necessary" but color is "coincidental," despite identical universality.  
    - Both Humeans and anti-Humeans can interpret the *same* history.  

  ---

  ### **3. Misconception Map**  
  **Preempt proactively:**  

  | Misconception | When to Address | How to Block (1–2 sentences) |  
  |---------------|----------------|------------------------------|  
  | "Equation computes → governs" | During lawlike/accidental distinction | *"Predictive power doesn’t entail metaphysical force. Equations are tools; we’re asking what *makes* predictions work."* |  
  | Humeanism = "laws are fictions" | Introducing Humeanism | *"Humeans don’t deny laws exist; they redefine them as patterns *in* events, not additions *to* them."* |  
  | Anti-Humeanism = "physics already says this" | Introducing anti-Humeanism | *"Physics uses law *language*, but stays neutral on whether laws are real forces or summaries. We’re digging under that language."* |  
  | Laws require determinism | Defining lawhood | *"Indeterministic laws (e.g., quantum probabilities) govern *chances*. Lawhood ≠ determinism."* |  
  | Juridical lawmaker imagery | Anti-Humean exposition | *"No legislators. Anti-Humeans see laws as *immanent* relations (e.g., charge *necessitates* attraction), not decrees."* |  
  | "Summary can’t explain mosaic" | Humean Q&A | *"Humeans agree! They *reverse* explanation: the mosaic explains why we call a pattern ‘law.’ Let’s discuss this tension."* |  

  **Strategy:**  
    - Raise 1, 3, 4, 5 yourself during exposition.  
    - Let students voice 2 and 6, then reframe.  

  ---

  ### **4. Check for Understanding**  
  **Your question:** *"Given that Humeans and anti-Humeans agree on the entire local history, name a question to which they give different answers."*  

  - **Works?** Yes. Forces focus on metaphysical divergence.  
  - **Good answer:** *"Could the mosaic have been different without breaking any laws?"* (Anti-Humean: No; Humean: Yes).  
  - **Bad answer:** *"Do laws exist?"* (Both say yes) or *"Are laws useful?"* (Both say yes).  
  - **Alternative if needed:** *"What *makes* a generalization a law of nature?"*  

  ---

  ### **5. Omissions & Flagging**  
  - **Drop entirely:** Vocabulary-relativity of "best system" (too technical).  
  - **Drop entirely:** Bruteness of nomic necessitation (requires modality deep dive).  
  - **Flag for deferred discussion:** Explanation regress ("laws explain mosaic, but what explains laws?").  
    - *Flagging phrase:* *"This circles into whether explanations need ‘ultimate stops’—we’ll park that for now."*  

  ---

  **Session Flow Summary:**  
  1. (5 min) Lawlike vs. accidental regularity (carrying example).  
  2. (20 min) Anti-Humeanism: laws as explainers → direction: laws → mosaic.  
  3. (20 min) Humeanism: laws as summaries → direction: mosaic → laws.  
  4. (15 min) Contrast explanation directions; misconceptions Q&A.  
  5. (10 min) Check question + wrap-up (omissions flagged).  
  6. (5 min) Buffer.  

  This builds from intuition, isolates the metaphysical dispute, and preempts physics-driven misunderstandings while respecting time constraints.
