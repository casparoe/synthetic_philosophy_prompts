answer: |-
  ## Affirmative Argument: Omissions as Genuine Causes in the Wren Case

  **Core Case Stipulations (Closing Escapes):**
  1.  Wren is the *only* nurse assigned to the unit overnight; no backups, alarms, or colleagues exist who could have performed or noticed the required 03:00 pump check.
  2.  Physician's 23:00 instruction *causes* Wren to be in the neighboring ward for the remainder of the shift, *precluding* the 03:00 check.
  3.  Patient dies at 04:10 *from an occluded line* (a positive event with an unremarkable causal history).
  4.  The death is *robustly counterfactually dependent* on the pump check: Had the check occurred (at 03:00, as per policy), the occlusion would have been discovered and cleared, preventing death. No preemption, overdetermination, or switching structures exist.
  5.  The relevant contrast class for the cause/effect relationship, accepted by all parties for this case, is *pump check occurring vs. pump check not occurring*.
  6.  The occlusion causing death is unproblematic; the *only* point of contention is the causal status of Wren's *failure to check*.

  **The Sustained Argument:**

  **I. The Explanatory Disconnection Cost of Denial**
      *   **Premise 1 (P1 - Causal Chain):** The physician's 23:00 instruction caused Wren to be in the neighboring ward at 03:00 (a positive event).
      *   **Premise 2 (P2 - Absence Creation):** Wren's presence in the neighboring ward at 03:00 *entailed* Wren's absence from the step-down unit at 03:00, which *entailed* the non-occurrence of the 03:00 pump check (an omission).
      *   **Premise 3 (P3 - Effect Dependence):** The patient's death at 04:10 robustly counterfactually depended on the non-occurrence of the pump check (Stipulation 4).
      *   **Premise 4 (P4 - Omission Denial):** (The Skeptical View): Omissions (like the non-occurrence of the check) are not genuine causes; they are merely background conditions, enabling conditions, or pragmatic features of explanation.
      *   **Inference 1 (I1):** If P4 is true, then the non-occurrence of the pump check (the omission) did *not* cause the death.
      *   **Premise 5 (P5 - No Direct Link):** The physician's instruction did *not* directly cause the occlusion or the death; its direct effect was Wren's relocation (Stipulation 2, P1).
      *   **Premise 6 (P6 - No Indirect Link via Omission):** If omissions are not causes (P4, I1), then the physician's instruction cannot cause the death *via* causing the omission (the non-check), as the omission isn't a causal intermediary.
      *   **Inference 2 (I2 - Explanatory Severance):** Therefore, on the skeptical view (P4), the physician's instruction (a clear initiator of events relevant to the death) bears *no causal relationship whatsoever* to the patient's death. Its causal influence stops at Wren's relocation.
      *   **Response to "Expressive Cost" Reply:** While the instruction makes a difference to blame/praise and narrative explanation (expressive role), accepting P4 forces us to deny a *causal-explanatory connection* between the instruction and the death, despite the robust counterfactual dependence established by the stipulations and the clear chain of agential action. This severs the explanatory link between a deliberate, relevant human action and its ultimate, foreseeable consequence in a way that violates strong intuitions about causal responsibility and explanatory depth. The "expressive cost" defense concedes the skeptic loses genuine causal explanatory power, replacing it with pragmatics. *(**Load-Bearing Premise:** P4 - Omission Denial. If the skeptic holds P4, they must accept I2's severance as a cost.)*

  **II. Solving Promiscuity: Repertoire-Relativity**
      *   **Premise 7 (P7 - The Problem):** If *any* omission upon which an effect counterfactually depends is a cause, then promiscuity follows (e.g., my failure to water your plants on another continent caused their death).
      *   **Definition (Repertoire-Relativity):** An omission O (the non-occurrence of act A) is *repertoire-relative* to effect E iff:
          *   (a) Act A was a *physically possible* action at the relevant time (t) for some agent (or system) S within the *localized environment* of the causal field leading to E.
          *   (b) Act A was *within the actual, localized set of options* available to S at t, constrained by S's physical capacities, location, institutional role, and immediate circumstances.
          *   (c) Performing A was a *relevant possible intervention* that would have disrupted the actual causal process leading to E (as evidenced by robust counterfactual dependence).
      *   **Premise 8 (P8 - Wren's Repertoire):** At 03:00, for Nurse Wren (S), within the localized environment of the step-down unit:
          *   (a) Performing the pump check (A) was physically possible.
          *   (b) Performing A was within her actual, localized set of options: she had the physical capacity, knowledge, access, and *institutional mandate* (hospital policy) to do so. Her relocation by the physician was a contingent, external intervention *removing* her from the localized environment where A was an option, making non-A occur.
          *   (c) Performing A would have disrupted the causal process (occlusion -> death) (Stipulation 4).
      *   **Inference 3 (I3):** Therefore, Wren's omission (non-check) is repertoire-relative to the patient's death.
      *   **Premise 9 (P9 - Distant Gardener):** My failure to water your plants on another continent:
          *   (a) Was (perhaps) physically possible in a global sense.
          *   (b) Was *NOT* within *my* actual, localized set of options at the relevant time *relative to the localized environment* of the plants. I lack the physical presence, access, role, or mandate within that localized system. My omission is merely global, not repertoire-relative.
          *   (c) While non-watering counterfactually depends on death, my performing the act was not a relevant possible intervention *within the plant's localized causal field* because I was not an agent embedded within that field with the available option.
      *   **Confronting the "Pragmatic" Worry:** Repertoire-relativity is *not* fundamentally about our *interests* or *salience*. It is grounded in objective, localized *physical and structural facts* about agents, systems, and their environments at a time:
          *   *Physical Capacity/Location:* Wren was physically capable and *assigned* to the unit; I was not physically proximate to the plants.
          *   *Institutional Role/Mandate:* Hospital policy *objectively* defined Wren's duties and available actions within that system; I had no such role or mandate regarding the plants.
          *   *Actual Options Constraint:* The localized system (the step-down unit) had a structure where only Wren's action was a potential intervention. My action was not part of that localized structure. The repertoire is defined by the *actual causal structure* of the system surrounding the effect, not by our subjective interests. Our *recognition* of the repertoire might be interest-relative, but the repertoire's *existence* is a feature of the localized physical and institutional world. *(**Load-Bearing Premise:** The objective grounding of repertoire-relativity in physical/institutional facts, not interests. The skeptic will argue institutional facts are ultimately normative/pragmatic.)*

  **III. Addressing the Process Objection (Salmon-Dowe)**
      *   **Premise 10 (P10 - The Objection):** Process theories (Salmon-Dowe) require causation to involve the transmission of a conserved quantity (energy, momentum) or a spatiotemporally continuous causal process linking cause and effect. No such process connects an omission (a non-event) to an effect.
      *   **Response Strategy:** **Deny that causation universally requires a spatiotemporally continuous process of conserved quantity transfer.**
      *   **Premise 11 (P11 - Causal Pluralism/Network):** Causation is fundamentally about difference-making within a network of counterfactual dependencies constrained by the actual structure of the world. Process theories capture *one important pattern* of causation (mechanistic, physical pushing), prevalent in fundamental physics and many everyday interactions. However, they do not capture *all* causal relations, particularly those involving absences, prevention, double prevention, and higher-level causal structures (like omission in organized systems).
      *   **Premise 12 (P12 - Omission as Structural Difference-Maker):** Wren's omission is a cause because:
          *   (a) It is a crucial difference-maker (Stipulation 4, P3).
          *   (b) It is integrated into the causal structure: The physician's positive action caused Wren's relocation (positive), which caused the absence of the check (omission), upon which the death counterfactually depended. The occlusion (positive process) was *structurally enabled* by the omission within the system.
          *   (c) Repertoire-relativity (I3) provides the objective structural constraint locating the omission within the causal network.
      *   **Inference 4 (I4):** The process theory objection fails because it mistakes a *common type* of causation (physical processes) for the *whole* of causation. Omission causation represents a distinct, structurally defined type of causal relation essential for understanding systems involving agency, prevention, and dependency. *(**Load-Bearing Premise:** P11 - Denying universality of process causation. The skeptic will defend process purity.)*

  **IV. The Duty-and-Expectation Route: Handle with Care**
      *   **Why not lean on it:** Invoking Wren's *duty* (hospital policy) or our *expectation* that she check the pump *prima facie* grounds causation in norms or psychology, making causation mind-dependent. If the policy didn't exist, or we didn't expect the check, would the omission *cease* to be a cause? This seems wrong; the physical dependency remains.
      *   **Potential Rehabilitation (Non-Mind-Dependent):** The institutional fact (hospital policy) is not *merely* normative. It is a *socially real, objective feature* of the system's structure that defines roles, responsibilities, and the *repertoire of expected and available interventions*. It objectively constrains what counts as a relevant possible intervention within that localized system (linking back to P8b, P9b). The duty isn't the *source* of causation; it's part of what *objectively structures the environment* and defines the repertoire relative to which the omission is a cause. The counterfactual dependency (Stipulation 4) is the core; the policy helps objectively define *whose* omission within *which localized system* is relevant. The *physical possibility and systemic role* (not the norm *qua* norm) do the metaphysical work. However, **this argument minimizes reliance on duty/expectation** precisely because the core difference-making (P3) and repertoire-relativity (I3) grounded in physical/institutional facts (P8) are sufficient without invoking the *normative force* of the duty.

  **Conclusion:** Wren's failure to check the pump is a genuine cause of the patient's death. It is a repertoire-relative omission: a structurally integrated difference-maker within the localized causal system, whose causal status is independent of process theories and minimally dependent on normative facts for its localization.

  **Costs for the Defender (Honest Accounting):**

  1.  **Abundance of Causes:** Accepting omission causation significantly multiplies causes. For every effect, countless repertoire-relative omissions will be causes alongside positive events. We must embrace this abundance and rely on context/pragmatics to identify *salient* causes, not deny the metaphysics.
  2.  **Process Purity Sacrificed:** We must abandon the idea that causation *always* involves a spatiotemporally continuous process or conserved quantity transfer (P11). Causation is more heterogeneous.
  3.  **Metaphysical Weight to Structure/Institutions:** We must grant that localized physical structures and institutional facts (like hospital roles/policies) play a constitutive role in grounding certain causal relations (repertoire-relativity), giving them a robust metaphysical status beyond mere convention. The skeptic will target this.
  4.  **Verbal/Substantive?** If the skeptic remains unconvinced despite this argument, it likely reveals a **substantive disagreement** about the nature of causation itself. The skeptic prioritizes process purity or a sparse ontology of positive events. The affirmative prioritizes explanatory depth, counterfactual dependence in structured systems, and the causal reality of prevention/absence in our world. While language about "causes" may be flexible, the core disagreement – whether the nurse's failure *made a physical, explanatory difference in the world* in a way analogous to the occlusion – is deeply substantive. This case highlights that denying omission causation creates an explanatory gap (I2) that a purely positive-event metaphysics struggles to fill adequately. The cost of denial (severed explanation) is as significant as the cost of acceptance (abundance, structuralism).
