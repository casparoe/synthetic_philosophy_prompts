prompt: |-
  I'm setting the final for a PhD decision theory seminar and I need one essay question on risk-weighted expected utility — the Buchak version — that a student cant pass just by reciting the view back. The angle I want: a bright student argues that risk-weighted EU is nothing over and above ordinary expected utility with a suitably concave utility function, so the Allais preferences it's supposed to rescue are really just diminishing marginal utility of money and the extra machinery buys nothing. I want the question to force students to say what a seperate risk attitude actually is over and above curvature in u, what the Allais pattern does and doesn't establish about that, and what the real cost is once you notice risk weighting makes the value of an outcome depend on the other outcomes in the same gamble, so the agent's local choices can come apart from the global plan she'd endorse. 45 minutes, 25 marks.

  Give me the question, a model answer of about 650 words, and a marking scheme that names the specific moves an A answer has to contain and what a competent-but-B answer gets right while missing the crux, plus a one-liner on the most common wrong turn for each block of marks. Start straight into the exam question itself — no preamble, no restating what I asked for, and no bibliography or list of sources, since the students won't have the books in front of them and I'd rather you not invent references.
reasoning: |-
  We are going straight into the exam question. The question should be self-contained and prompt the student to engage with the specific issues mentioned.

  **Exam Question:**

  Critically evaluate the following claim: Risk-weighted expected utility (RWEU) theory, as developed by Buchak, does not offer a genuine alternative to ordinary expected utility theory (EU) with a concave utility function. The claim asserts that the Allais preferences, which RWEU is designed to accommodate, can be equally well explained by diminishing marginal utility of money within EU. Moreover, the additional machinery of a risk function in RWEU is redundant because it merely mimics the effects of utility curvature. In your response, address the following:

  (a) What does it mean for an agent to have a separate risk attitude, distinct from the curvature of the utility function? How does RWEU formally capture this separation? (8 marks)

  (b) How do the Allais preferences challenge EU, and what do they actually show about risk attitudes versus diminishing marginal utility? In particular, why might the Allais pattern be insufficient to establish the need for a separate risk attitude? (7 marks)

  (c) Explain how RWEU allows the value of an outcome to depend on the other outcomes in the gamble. Discuss the normative implications of this feature by considering a case where an agent's local choice (between two options) conflicts with the global plan she would endorse (when considering a larger set of options). What does this imply for the real cost of adopting RWEU? (10 marks)

  (Total: 25 marks)

  ---

  **Model Answer (approx. 650 words):**

  **(a)** In expected utility theory (EU), an agent's attitude towards risk is entirely captured by the curvature of the utility function: concavity implies risk aversion, convexity risk seeking, and linearity risk neutrality. However, in risk-weighted expected utility (RWEU), risk attitude is separated from the diminishing marginal utility of wealth by introducing a risk function r. The utility function u in RWEU is interpreted as representing the subjective value of outcomes under certainty, hence capturing the diminishing marginal utility of money. The risk function r, which is applied to cumulative probabilities, captures the agent's attitude towards risk independently. Formally, RWEU computes the value of a gamble as the sum of the differences in utilities between adjacent outcomes, weighted by the risk function applied to the cumulative probability of receiving at least that outcome. Specifically, for a gamble with outcomes x1 < x2 < ... < xn, occurring with probabilities p1, p2, ..., pn, the RWEU is: 
  \[ V = u(x_1) + r(1-p_1)(u(x_2)-u(x_1)) + r(1-p_1-p_2)(u(x_3)-u(x_2)) + \cdots \]
  This separation allows two agents with the same utility function (same marginal utility) to exhibit different risk attitudes via different r functions. For instance, one might be more risk averse by having a convex r, which downweights the utility increments of better outcomes when they are less probable.

  **(b)** The Allais paradox challenges EU by presenting a pair of choices where most people prefer a certain outcome in one scenario and a risky one in another, violating the independence axiom. Specifically, in the first choice, people prefer $1 million for sure over a gamble with a 10% chance of $5 million, 89% of $1 million, and 1% of nothing. In the second, they prefer a 10% chance of $5 million over 11% chance of $1 million, even though EU would require consistency. EU explains the first choice by concave utility (diminishing marginal utility making the sure $1M more attractive than the small chance of $5M). However, the second choice is problematic because the same concavity would typically lead to the opposite preference (the 10% chance of $5M being less attractive than the 11% chance of $1M if utility is concave). Thus, the Allais pattern suggests that risk aversion in the first choice is not entirely due to diminishing marginal utility. However, it does not conclusively establish the need for a separate risk attitude because one might adjust the utility function to be more concave at high wealth levels (e.g., a kink) to accommodate both choices. The Allais pattern challenges EU but does not force the separation of risk attitude from utility; it only shows that the utility function must be more complex (e.g., not globally concave). Hence, it is insufficient to prove that risk attitude must be separate.

  **(c)** In RWEU, the value of an outcome depends on its position in the ranking and the other outcomes in the gamble. This is because the risk function weights the utility increments based on the cumulative probability of receiving at least a given outcome, which in turn depends on the entire distribution. Consequently, the same outcome in two different gambles might be assigned different contributions to the overall value. This feature leads to a violation of the independence of irrelevant alternatives (IIA) at a local level. 

  Consider a global choice set including three options: A (a sure $100), B (a 50% chance of $200, 50% of $0), and C (a 50% chance of $201, 50% of $0). The agent might prefer A over B when only these two are available (due to risk aversion). However, when C is added, the agent might prefer B over C (because the extra $1 is not worth the risk) and then, in a pairwise choice between A and C, might prefer C (if the risk function is such that the high outcome in C is attractive enough). But note that if the agent chooses A from {A,B} and B from {B,C}, then by transitivity she should choose A over C. However, if she chooses C from {A,C}, we have a cycle (A>B, B>C, but C>A) which violates rational choice. Thus, the agent's local choices (in pairwise comparisons) may conflict with global consistency.

  The real cost of RWEU is that it allows such violations of dynamic consistency and may require agents to adopt pre-commitment strategies or face exploitation. This is because the risk-weighting makes the evaluation of an outcome context-dependent (on the other outcomes in the gamble), so an agent might plan a global strategy but then deviate when faced with a local choice. In contrast, EU does not have this problem because the utility of an outcome is independent of the gamble it is in. Thus, the extra machinery of RWEU buys descriptive power for the Allais pattern at the cost of normative rationality constraints.

  ---

  **Marking Scheme:**

  **Total: 25 marks**

  **(a) Separation of risk attitude (8 marks)**  
  - **A (7-8 marks)**: Clearly explains that in EU, risk attitude is solely via u's curvature; in RWEU, r captures risk attitude independently of u. Formal definition of RWEU (with the cumulative formula) and example of how two agents with same u but different r can have different risk preferences.  
  - **B (5-6 marks)**: Identifies the separation but without full formal detail (e.g., mentions r function but not the cumulative structure) or without a clear example. May confuse the roles of u and r.  
  - **Common pitfall**: Conflating the risk function with the utility function, or not clearly distinguishing the two components.

  **(b) Allais and what it shows (7 marks)**  
  - **A (6-7 marks)**: Correctly describes the Allais choices and how they violate EU. Explains why EU might try to explain the first choice by concavity but the second choice is problematic, leading to the challenge. Then argues that Allais does not force a separate risk attitude because a non-standard utility function (e.g., with a kink) can accommodate both choices.  
  - **B (4-5 marks)**: Describes the Allais paradox and its challenge to EU but does not clearly articulate why it doesn't force a separate risk attitude (or overstates its implications). May not mention the possibility of adjusting the utility function.  
  - **Common pitfall**: Claiming that Allais preferences necessarily require a separate risk attitude, without recognizing that they can be modeled by a non-concave utility function in EU.

  **(c) Outcome dependence and normative cost (10 marks)**  
  - **A (9-10 marks)**: Explains how RWEU makes outcome value depend on the gamble (via the ranking and cumulative probabilities). Provides a clear example of a potential cycle in pairwise choices (as above) and explains how this violates global consistency. Discusses the normative cost (violations of dynamic consistency, need for pre-commitment).  
  - **B (7-8 marks)**: Describes context-dependence but without a clear example of a cycle. Mentions that it leads to inconsistency but without linking to global vs local choices. Normative cost stated but not elaborated.  
  - **Common pitfall**: Not providing a concrete example of the inconsistency, or not distinguishing between the descriptive and normative issues.

  Note: Overall coherence and clarity can adjust marks within bands.
answer: |-
  **Exam Question:**

  Critically evaluate the claim that risk-weighted expected utility (RWEU) theory—as formulated by Buchak—merely replicates ordinary expected utility (EU) with a concave utility function. The argument contends that RWEU’s explanation of Allais preferences reduces to diminishing marginal utility of money, rendering its extra machinery (the risk function) redundant. In your response:  

  (a) Define what it means for an agent to have a distinct "risk attitude" separate from the curvature of the utility function. Explain how RWEU formally distinguishes risk attitude from diminishing marginal utility. (8 marks)  

  (b) Analyze what the Allais paradox demonstrates about attitudes toward risk versus diminishing marginal utility. Why might the Allais pattern, by itself, fail to prove that risk attitude must be separate? (7 marks)  

  (c) Discuss how RWEU allows the value of an outcome to depend on other outcomes in the same gamble. Illustrate with an example where an agent’s *local choice* (e.g., between two options) conflicts with their *globally endorsed plan* (e.g., when evaluating a larger set). What normative cost does this introduce? (10 marks)  

  ---

  **Model Answer (approx. 650 words):**  

  **(a)** In standard EU theory, “risk attitude” is solely captured by the curvature of the utility function \(u\): concavity implies risk aversion, linearity implies risk neutrality. Diminishing marginal utility (e.g., \(u\) concave in wealth) explains why an agent might reject a fair gamble. Crucially, EU does not separate preferences about *risk itself* from preferences about *wealth levels*.  

  RWEU decouples these by introducing a risk function \(r(p)\), applied to cumulative probabilities. Here, \(u\) retains its role as the utility under certainty (reflecting diminishing marginal utility), while \(r\) directly models the agent’s attitude toward probability spreads. Formally, for a gamble with outcomes ranked worst (\(x_1\)) to best (\(x_n\)), RWEU calculates value as:  
  \[ V = u(x_1) + \sum_{i=2}^{n} \left[ u(x_i) - u(x_{i-1}) \right] \cdot r\left( \sum_{j=i}^{n} p_j \right) \]  
  The risk function \(r\) (typically convex for risk aversion) distorts the weight of utility increments. For instance, if \(r(p) < p\), the agent downweights improvements from low-probability upside gains. This lets two agents share identical \(u\) (same valuation of sure outcomes) but differ in risk aversion via \(r\)—e.g., one might reject a gamble another accepts, purely due to differing sensitivity to probability spreads. Thus, RWEU formally separates risk attitude (encoded in \(r\)) from wealth preferences (encoded in \(u\)).  

  **(b)** The Allais paradox reveals a violation of EU’s independence axiom: subjects prefer $1M for sure over a 10% chance of $5M (with 89% for $1M, 1% $0), but reverse preferences when comparing a 10% chance of $5M to 11% of $1M (both with 89% $0). EU struggles because the same concave \(u\) that justifies the first choice (avoiding risk of $0) typically implies the *opposite* in the second choice (11% of $1M should dominate 10% of $5M if \(u\) is concave).  

  The paradox *challenges* EU by showing that aversion to worst-case losses is not fully explained by diminishing marginal utility. However, it does not *force* a separate risk attitude. A sufficiently kinked \(u\) (e.g., steeply concave near $1M, flatter above) could mimic Allais preferences within EU, attributing reversals to abrupt changes in marginal utility rather than probability weighting. Thus, Allais alone cannot falsify EU; it only demands a non-standard \(u\), not necessarily a distinct \(r\). RWEU’s advantage is parsimony—it explains Allais with a stable \(u\) and one parameter (\(r\))—but the pattern itself does not preclude EU explanations.  

  **(c)** In RWEU, an outcome’s contribution to a gamble’s value depends on its *ranking* relative to other outcomes, as \(r\) distorts cumulative probabilities. This violates the “context-independence” of EU, where \(u(x)\) is fixed across gambles. Consequently, choices may lack "dynamic consistency": an agent’s local pairwise choice might contradict their globally optimal plan.  

  Consider an agent facing three options:  
  - **A**: $100 for sure  
  - **B**: 50% chance of $200, 50% of $0  
  - **C**: 50% chance of $201, 50% of $0  

  Globally, the agent endorses a plan: “Avoid gambles with worst-case $0 if a safe option exists.” Thus, she prefers **A** over **B** and **A** over **C**. Locally, however, when choosing between **B** and **C** alone, RWEU might make her prefer **C** over **B** if \(r\) heavily downweights low-probability gains: the extra $1 in **C**’s best outcome receives minimal weight since \(r(0.5) \approx 0\). But this implies:  
  - Globally: **A** > **B** and **A** > **C** → **A** chosen.  
  - Locally: **C** > **B** when **A** is absent.  

  If she first faces **B** vs. **C**, she picks **C**, but if she later exchanges **C** for **A**, she would switch—violating path independence. EU avoids this: if \(u\) is concave, **B** and **C** have near-identical certainty equivalents, so local and global choices align.  

  The normative cost is that RWEU agents may make locally “rational” choices that sabotage their global goals, requiring pre-commitment devices to avoid exploitation. This dependence of outcome value on gamble context introduces a fundamental instability not present in EU.  

  ---

  **Marking Scheme:**  
  **Total: 25 marks**  

  **(a) Distinct risk attitude and RWEU formalization (8 marks)**  
  - **A (7–8 marks)**: Clear definition of risk attitude as sensitivity to probability spreads (distinct from wealth preferences via \(u\)). Precise RWEU formula showing \(r\)’s role in weighting utility increments. Example of same \(u\)/different \(r\) yielding divergent risk choices.  
  - **B (5–6 marks)**: Correctly distinguishes risk attitude from \(u\) curvature but with incomplete formal detail (e.g., names \(r\) but omits cumulative probability weighting). Example vague or absent.  
  - *Common pitfall*: Conflating \(r\) with \(u\), e.g., claiming “\(r\) is just another way to describe concavity.”  

  **(b) Allais paradox limitations (7 marks)**  
  - **A (6–7 marks)**: Explains Allais violates EU independence; notes concavity of \(u\) resolves only the first choice, not the reversal. Argues Allais doesn’t *require* separate risk attitude (e.g., adjustable \(u\) can fit data).  
  - **B (4–5 marks)**: Describes Allais but doesn’t clarify why EU can “rescue” it with non-standard \(u\) (e.g., stops at “Allais challenges EU”). Overstates RWEU’s necessity.  
  - *Common pitfall*: Asserting Allais “proves” risk attitude is separate, ignoring EU’s flexibility with \(u\).  

  **(c) Outcome dependence and normative cost (10 marks)**  
  - **A (9–10 marks)**: Explains outcome value depends on ranking (via \(r\) and cumulative probabilities). Clear dynamic inconsistency example showing conflict between local pairwise choice (e.g., **C** > **B**) and global plan (e.g., **A** > **B**, **A** > **C**). Identifies cost: violations of path independence, need for pre-commitment.  
  - **B (7–8 marks)**: Identifies context-dependence but example lacks pairwise/global tension (e.g., only compares two gambles). Normative cost stated generically (“inconsistency”) without dynamics.  
  - *Common pitfall*: Misunderstanding context-dependence (e.g., focusing only on probability distortion without outcome ranking).
