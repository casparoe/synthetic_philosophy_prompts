  Methodology: Break down into literature review, defining dimensions, weighting sets, applying the model, and analysis. Each month should have clear, achievable tasks. Mention specific theorists like Berlin, Pettit, Skinner for conceptual grounding. For societal weightings, reference public discourse and party platforms to capture self-understandings.

