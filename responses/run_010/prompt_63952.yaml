prompt: |-
  I'm running a philosophy-of-biology reading group, and next week we do the teleology chapter — half the group are biologists, half philosophy, and I'm the one who has to steer it. I've pasted two bits from Kant's Critique of Judgement (§65, Meredith translation) below and I honestly can't work out what he's commited to. Can you help me get a grip on the passage?

  "In such a natural product every part is thought as owing its presence to the agency of all the remaining parts, and also as existing for the sake of the others and of the whole, that is as an instrument, or organ. … The part [is] an organ producing the other parts - each, consequently, reciprocally producing the others. … Only under these conditions and upon these terms can such a product be an organized and self-organized being, and, as such, be called a natural end."

  "An organized being is, therefore, not a mere machine. For a machine has solely motive power, whereas an organized being possesses inherent formative power, and such, moreover, as it can impart to material devoid of it - material which it organizes. This, therefore, is a self-propagating formative power, which cannot be explained by the capacity of movement alone, that is to say, by mechanism."

  Three things I'm stuck on. First, what work is the formative-power/motive-power contrast doing — is he saying an organism really has a different kind of causality in it, or only that we're unable to judge it as we judge a machine? He keeps slipping between talk about things and talk about how we must think them, and I can't tell which is doing the load-bearing.

  Second, the reciprocity claim looks circular to me: each part exists for the sake of the whole, and the whole is nothing over and above the parts producing one another. Is that a real objection, or am I reading "for the sake of" too literally?

  Third, and this is the one I want to lead the discussion with. Modern theorists of biological function are split in two camps. One says the function of a trait is what it was selected for — function is a historical, etiological property, so the heart pumps blood because ancestors that pumped blood got selected, and a heart grown in a dish that pumps blood still pumps but has no function on this view. The other says a function is just the contribution the trait makes to the capacities of the larger system it sits in — no history needed, and the dish heart does have a function after all. Which camp does Kant's organism land in? I want a reasoned answer rather than a hedge, and I'd like you to say what he'd make of the fact that his account never mentions ancestry at all, becuase natural selection obviously wasn't available to him — does that leave his view as a rival to the selected-effects account, or as something that was simply aiming at a different question?

  Please answer in British English.
