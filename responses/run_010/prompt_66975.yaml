  The user wants to know if the disagreement is verbal, empirical, normative, or intuitive. It's probably not verbal because the terms are often defined clearly. Empirical? Well, the thought experiments are hypothetical, so no. Normative? Yes, different norms on what counts as evidence. Also, bedrock intuitions play a role—some prioritize indifference, others update based on existence.

