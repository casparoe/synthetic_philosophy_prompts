  Your understanding of the Kalai-Smorodinsky (KS) solution is correct, but the issue lies in a misinterpretation of **Independence of Irrelevant Alternatives (IIA)** and how KS violates it. Let's break this down step by step:

  ### 1. **Why KS Violates IIA (and Your Example is Correct)**
  - **IIA Definition**:  
    IIA requires that if the solution of a bargaining problem \((S, d)\) is in a subset \(T \subseteq S\) (with \(d \in T\)), then the solution of \((T, d)\) must be the same as \((S, d)\).  
    Crucially, **IIA applies to *any* subset containing the original solution**, not just the removal of *dominated* points. It includes cases where \(T\) alters the **ideal point** (max possible utilities) even if the original solution is still feasible.

  - **Your Example**:  
    - **First set** \(S\): Vertices (0,0), (3,0), (0,3).  
      - Ideal point: \(a_S = (3, 3)\).  
      - KS: Intersects ray to \(a_S\) with Pareto frontier → \((1.5, 1.5)\).  
    - **Second set** \(T\): Vertices (0,0), (3,0), (1.5,1.5), (0,2) (subset of \(S\)).  
      - Ideal point: \(a_T = (3, 2)\) (since max utility for player 2 is now 2).  
      - KS: Ray to \(a_T = (3, 2)\) (slope \(y = \frac{2}{3}x\)) hits new Pareto frontier at \((1.8, 1.2)\).  

    **Why this violates IIA**:  
    - \((1.5, 1.5)\) is feasible in \(T\) (still in the set).  
    - But KS for \(T\) is \((1.8, 1.2) \neq (1.5, 1.5)\).  
    **→ IIA demands the solution for \(T\) be \((1.5, 1.5)\), but KS changes it.**  
    This happens because KS depends on the **ideal point**, which changed when you removed \((0,3)\).

    **This is not a bug in your code**—your solver correctly computed KS for \(T\). The key is that KS uses the ideal point to define the ray, and \(T\) has a *different ideal point* than \(S\). IIA is violated because KS responds to changes in the ideal point, even if the original solution remains feasible.

  ---

  ### 2. **Does KS Violate Other Axioms?**
  No. KS satisfies:
  - **Pareto Efficiency**: Always selects a point on the Pareto frontier.
  - **Symmetry**: If the feasible set is symmetric, KS gives equal utilities.
  - **Scale Invariance**: Rescaling utilities doesn’t change the solution.
  - **Monotonicity**: If the feasible set expands in a way that improves a player’s ideal payoff, their KS payoff doesn’t decrease.

  **Why KS doesn’t contradict Nash’s uniqueness**:  
  Nash’s theorem states that Nash Bargaining is the **only** solution satisfying Pareto + Symmetry + Scale Invariance + IIA. KS **drops IIA** and instead satisfies **Monotonicity**. This is the tradeoff—no solution can satisfy both IIA and Monotonicity simultaneously.

  ---

  ### 3. **The Tradeoff Between IIA and Monotonicity**
  - **IIA**:  
    "If the solution of a larger set is in a smaller subset, the solution doesn’t change."  
    *Weakness*: Ignores changes in the *opportunities* (e.g., if the ideal point drops, players aren’t "penalized" for options they never wanted).

  - **Monotonicity (KS)**:  
    "If the feasible set expands and your ideal payoff improves, your KS payoff shouldn’t decrease."  
    *Weakness*: Violates IIA because it responds to changes in the ideal point (as in your example).

  - **Why they conflict**:  
    - IIA anchors the solution to historical outcomes (even when new options are added/removed).  
    - Monotonicity requires the solution to adapt to changes in "bargaining power" (reflected in the ideal point).  
    Your example shows this: When \(T \subset S\) reduces player 2’s ideal payoff (3→2), KS reduces player 2’s payoff (1.5→1.2) to maintain proportionality. IIA forbids this adjustment.

  ---

  ### 4. **Practical Advice for Your Solver**
  1. **Verify Your Pareto Frontier Calculation**:  
     In your second set \(T\), the Pareto frontier is the line segments:  
     - From (3,0) to (1.5,1.5): \(y = -x + 3\)  
     - From (1.5,1.5) to (0,2): \(y = -\frac{1}{3}x + 2\)  
     Ensure your hull routine orders vertices correctly (e.g., by x-coordinate descending). The ray \(y = \frac{2}{3}x\) intersects the first segment at (1.8, 1.2)—this is correct.

  2. **Nash Solution Comparison**:  
     Nash maximizes \(x \cdot y\) (product of utilities). In both \(S\) and \(T\), (1.5,1.5) is the Nash solution because:  
     - In \(T\), the product at (1.5,1.5) is \(2.25\), while at (1.8,1.2) it is \(2.16\) (lower).  
     This aligns with IIA: Nash doesn’t depend on the ideal point, only the available options.

  3. **Clarify in Your Writeup**:  
     - KS violates IIA by design—it’s a feature, not a bug.  
     - Highlight the tradeoff: KS prioritizes fairness under changing opportunities (Monotonicity), while Nash prioritizes consistency (IIA).

  ---

  **Summary**: Your solver is working correctly. KS violates IIA because it adapts to changes in the ideal point, even when dominated points are removed. This is not a contradiction—it reflects the intentional tradeoff between IIA and Monotonicity. Your example perfectly illustrates why KS fails IIA while Nash satisfies it.
