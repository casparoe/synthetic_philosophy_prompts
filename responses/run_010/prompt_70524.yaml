prompt: |-
  I am a moral philosopher finishing a chapter on the normative force of everyday conventions — tipping, queueing, crossing against the signal — and I would like to sharpen it by argument rather than by drafting. My own view is the deflationary one: such conventions generate at most etiquette reinforced by prudence, and whatever genuine moral work gets done is done by the harms and expectations that happen, contingently, to be attached in a given case. To test that, please play the opposition: an unnamed contemporary moral philosopher who holds that a publicly established and generally observed local convention generates a real moral obligation, not a merely conventional or prudential one, and that it does so for everyone within its scope, visitors and transients included. Give the doctrine resources rather than slogans. Specifically, hold these five theses: (i) the obligation arises from the practice itself — the expectations it licenses in the other participants, the benefits one takes from a scheme one does nothing to sustain, and the value of a device that solves a coordination or incentive problem — and not from any act of consent on my part; (ii) its content is fixed locally, so that the same bodily movement may be required in one city and impermissible in another; (iii) it is genuinely moral, and therefore criticisable from a standpoint that includes strangers who were never asked whether they wanted in; (iv) it is defeasible where the practice is itself unjust, or where compliance would cost the agent something seriously disproportionate; and (v) it is not to be cashed out as a rule-utilitarian calculation, which you regard as licensing exactly the case-by-case opt-out you mean to rule out.

  Constraints on the exchange. First person throughout, until I say stop; one or two tight paragraphs per turn, the rhythm of a conversation rather than a paper. Argue from the merits and from cases: do not cite the literature, do not tell me who holds your view or how the debate currently stands, and do not step outside the character to referee our disagreement. You may concede subsidiary points where they are genuinely costly to you, and you may refine the doctrine, provided you say plainly what you are refining and then defend the refinement; but you may not abandon the core claim that conventions of this kind can bind morally, and you may not retreat to the position that what is really wrong in these cases is only the harm caused or the expectation deceived. If a case I give is ambiguous, ask me about it in character. And do not caricature my side either: assume I am competent and have read the best arguments for yours.

  Here is my opening move. You ground the obligation in what a practice licenses the people around me to expect. Take me, then, crossing against the signal at three in the morning on a street I know to be empty for a quarter of a mile in each direction, with no windows overlooking it, no camera, and no child in my company whose habits are being formed by my example. On your account there is nobody whose expectation I disappoint, no benefit I have taken and failed to reciprocate, and no observable contribution to any erosion of the practice; so you must either concede the act is permissible — in which case your obligations are hostage to whether anyone is watching, and are prudential reasons in a moral costume — or tell me precisely whom I wrong and what that person is owed by me. And before you reach for the practice itself as the injured party, notice what thesis (ii) commits you to. Consider a visitor in a city where the queue is not a line at all but a chain, each arrival attaching himself to a particular predecessor rather than to a position, a rule no guidebook states and which he cannot have inferred in the ten minutes before the bus arrives. If content is fixed locally, then either that practice cannot have licensed any expectation about him — in which case a great many of your obligations evaporate exactly where you most want them to hold, at the point of the stranger's entry — or else he is a wrongdoer in every unfamiliar city he sets foot in, which I take to be a reductio. Pick a horn.
reasoning: |-
  Okay, the user is a moral philosopher working on a chapter about the normative force of everyday conventions like tipping, queueing, and jaywalking. They hold a deflationary view, arguing that these conventions only create etiquette or prudential reasons, with any real moral weight coming from contingent harms or expectations in specific cases. They want me to argue against this by embodying a philosopher who believes such conventions generate genuine moral obligations.

  The user has outlined five theses I must defend: (1) obligation arises from the practice itself (expectations, benefits, coordination value), not consent; (2) content is locally determined; (3) it's genuinely moral and criticizable by outsiders; (4) defeasible if practice is unjust or compliance too costly; (5) not reducible to rule-utilitarianism. They've set strict constraints: first-person argumentation, conversational paragraphs, no literature citations, no stepping out of character.

  Their opening challenge focuses on two cases: first, jaywalking alone at 3am with no observers or consequences, asking who is wronged; second, a visitor unfamiliar with a local queuing custom ("chain" system), creating a dilemma about expectations. I need to address these while holding firm to the core claim about moral bindingness.

  For the jaywalking case: I'll argue that even unobserved violations wrong the collective by disregarding the scheme's authority. The practice exists as a shared structure, and violating it demonstrates disrespect for that structure, which has moral weight. This avoids making obligation contingent on observers while acknowledging the "no harm" aspect by invoking the value of coordination systems themselves.

  For the queuing case: I'll refine the expectations thesis to distinguish between episodic expectations (what people predict) and normative expectations (what they're entitled to expect). The visitor's ignorance doesn't erase the latter, but the doctrine should incorporate a reasonableness standard - the visitor must make a good-faith effort to discern local rules. This avoids the reductio while preserving obligations for newcomers.

  Key moves: 
  - Emphasize the practice as a moral entity beyond individual expectations 
  - Introduce "normative expectations" as distinct from predictive ones 
  - Concede that total invisibility reduces but doesn't eliminate wrong (showing flexibility without abandoning core) 
  - For the visitor, add a "good-faith effort" refinement to handle unfamiliarity 

  Must maintain rigor: no retreat to harm/expectation deception as "real" wrong, no rule-utilitarian cop-outs. The tone should be collegial but firm, treating the user as a competent peer. Cases should be addressed through doctrine refinement where possible, not concession.
answer: |-
  Very well, let me meet your challenge head-on, refining slightly as I go to sharpen the doctrine against these hard cases, but holding firm to the core.

  Your deserted-street jaywalker *does* wrong someone: the collective body of participants in the convention. The practice itself – the established, generally observed rule – constitutes a shared normative structure. By flouting it *because* no one sees, you treat the rule's authority as contingent on enforcement or immediate social pressure, denying its inherent standing *as* a rule for coordination. You act as if the rule's validity hinges on individual perception, dissolving the very 'publicly established' character thesis (i) relies on. What you owe is respect for the scheme itself, a recognition that your agency operates within a framework you didn't create but benefit from (even if only potentially, by preserving the system for *when* others *are* present). The wrong is one of disrespect to the normative order, akin to cheating in a game no one else is currently playing; it degrades your relationship to the shared practice. It *is* diminished in gravity near invisibility – perhaps only a pro tanto wrong easily overridden – but it persists as a genuine, if faint, moral failure: failing to honour the structure that solves coordination problems generally.

  Regarding your visitor and the chain-queue: Thesis (ii) stands, but I refine the *expectations* aspect. Expectations licensed by the practice are not merely predictive ("I thought he'd know!") but *normative* ("He *should* know, or at least try to ascertain"). The established practice licenses participants to *expect compliance from anyone within its scope*, including strangers, *once the practice is reasonably evident or discoverable*. Your visitor wrongs others by failing to make a minimal good-faith effort to discern local norms upon entering the context (like observing others for 30 seconds before the bus). The practice fixes *what* is owed (joining a chain), but the obligation *to ascertain* what the practice *is* arises from the general moral demand (recognized even by strangers) not to disrupt functioning coordination schemes through careless ignorance. He isn't doomed to wrongdoing; he wrongs only if he blunders in *without* attempting to observe or inquire where practicable. So, yes, content is local and binds strangers, but the stranger has a co-duty to seek understanding, mitigating the reductio. Ignorance isn't automatic exoneration; it can itself be culpable in the face of a visible, operating practice. Now, your turn: how does your deflationism avoid collapsing obligation into mere psychological reaction or fear of sanction in *these* specific scenarios?
