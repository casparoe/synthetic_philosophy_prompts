prompt: |-
  three weeks into a social ontology seminar and I've completely lost the plot. we did Lewis on convention first, then the focal point stuff, then the expectations-based accounts and the evolutionary game theory ones, and every single author just asserts their own framework handles the cases the others miss. before I read another one of these I want the spec.

  so: write out what an account of why people follow conventions actually has to deliver to count as adequate. the phenomena it has to explain, the verdicts it has to get right on particular cases, the distinctions it cant collapse, and the results from game theory or from the empirical work that it would contradict if it got them wrong. for each one give me the case or consideration that's doing the motivating — because I strongly suspect half of these "requirements" are just one camp's priors wearing a labcoat — and then tell me which ones are genuinely non-negotiable for any account and which are optional add-ons that only some programs want, and say why each falls on that side of the line.

  stuff I want folded in somewhere appropriate (dont just echo my bullets back at me as the list): why people keep following a convention when no one's watching and there's no live coordination problem at that moment — 3am, empty road, still driving on the right; how a convention gets off the ground from nothing when there's no pre-existing focal point to grab onto; why some conventions stay locked in even though everyone involved would prefer a different one and could switch, and the fact that the collapse when it comes can be extremely fast (QWERTY, and footbinding, which lasted centuries and then went away in basically a generation — I think any account owes us both halves of that); how a convention differs from a norm with actual moral weight behind it, and how either differs from a mere habit, a fashion, or a rule someone laid down on purpose; the fact that breaking a convention seems to license resentment and blame even in pure coordination cases where the defector cost nobody anything; and the fact that real people demonstrably don't have anything like common knowledge of what everyone else believes — a lot of the time they have flatly false beliefs about everyone else's beliefs and expectations and the convention runs anyway, which is the pluralistic ignorance business.

  then the part I actually care about. tell me which pairs or triples of these requirements can't all be satisfied together. my guess is that "conformity must be explained by each individual's rationality given their beliefs about others" and "must explain stability sustained by widely false beliefs about others" are in direct conflict. I also suspect arbitrariness and lock-in conflict, but check whether that one dissolves on inspection — maybe arbitrariness is only a claim about which regularity could have got started, not about whether it could be changed now, in which case a locked-in convention is still arbitrary and there's no tension at all. if some subset really is jointly unsatisfiable, say it plainly and say which member has to go, because that's the kind of result I'd want to build a paper around rather than another survey. and tell me which single requirement does the most work excluding candidate accounts.

  last and least: a short paragraph each on how three broad strategies do against the finished list — grounding convention in common knowledge plus rationality, grounding it in evolutionary or dynamical selection over recuring interactions, and grounding it in networks of empirical and normative expectations. keep that brief, no scorecard table and definitely no bibliography, I already have the reading list and I'm trying to get out from under it.
reasoning: |-
  Hmm, the user is deep into a social ontology seminar and feeling lost with all the conflicting accounts of convention. They want a clear specification of what a theory of convention must explain to be adequate. They've listed several phenomena: why people follow conventions when no one's watching, how conventions start without focal points, lock-in and sudden collapse, distinctions from norms/habits/fashions, resentment for breaking conventions, and the role of pluralistic ignorance.

  I need to structure this carefully. First, I'll outline the core requirements for any account of convention, dividing them into non-negotiable and optional. For each requirement, I'll include the motivating case and explain why it's essential or not. Non-negotiables should address the definitional aspects of conventions, like arbitrariness and stability, while optional ones might depend on theoretical preferences, like full rationality.

  The user suspects conflicts between requirements. I should analyze pairs like rationality vs. false beliefs and arbitrariness vs. lock-in. For rationality and false beliefs, they conflict because rationality assumes accurate beliefs, while pluralistic ignorance involves false beliefs. The rationality requirement might need relaxing. For arbitrariness and lock-in, they don't conflict because arbitrariness is about origins, while lock-in is about current stability.

  Key distinctions to cover: conventions vs. moral norms (no intrinsic rightness), habits (no interdependence), fashions (no coordination), and rules (no top-down enforcement). Cases like resentment in pure coordination need explaining—perhaps through expectations and reliance, not morality.

  For the three broad strategies:
  - Common knowledge/rationality: Strong on coordination and arbitrariness but fails with pluralistic ignorance and lock-in without additional mechanisms.
  - Evolutionary dynamics: Handles emergence and lock-in well but struggles with individual rationality and resentment, as it's population-level.
  - Expectation networks: Excels at pluralistic ignorance and resentment via normative expectations but might blur conventions and norms and needs to explain large-scale coordination.

  The user might be building a paper around these tensions, so highlighting the conflict between rationality and false beliefs could be valuable. Also, emphasizing that lock-in and arbitrariness are compatible might resolve some confusion. The resentment point is tricky—different theories handle it differently, but it's tied to normative expectations in the network approach.
answer: |-
  Here's the spec for an adequate account of convention, breaking down requirements, their motivations, negotiability, conflicts, and how major strategies fare. The goal is to separate what a convention *is* (non-negotiable) from how different theories *explain* it (optional).

  ### Core Requirements (Non-Negotiables)
  These define "convention" itself. Failure here means failing to capture the phenomenon.

  1.  **Arbitrariness:** The account must explain why *this specific regularity* prevails when *other compatible ones* could have worked just as well. *Motivation:* Driving on left/right, QWERTY vs. Dvorak, specific greetings. *Why Non-Negotiable:* Constitutive of convention; distinguishes it from solutions dictated by physical necessity or inherent superiority.
  2.  **Interdependence / Conditional Preference:** Following the convention must depend on the *expectation that others follow it too*. My preference to conform is conditional on my belief that others conform. *Motivation:* Why stop at a red light at 3am? Because I expect others *might* be there or generally follow the rule. Why not switch to driving on the left alone? Because it would cause chaos. *Why Non-Negotiable:* Core definition distinguishing convention from mere habit (I do it regardless of others) or intrinsic preference.
  3.  **Stability (Persistence):** The account must explain why the convention, once established, is self-reinforcing and persists over time without constant top-down enforcement. *Motivation:* Driving side, language rules, currency use persisting for generations. *Why Non-Negotiable:* A central feature of conventions; unstable "conventions" aren't conventions.
  4.  **Distinction from Moral Norms:** It must distinguish conventions (arbitrary, conditional on others) from norms backed by intrinsic moral belief (e.g., "don't murder"). *Motivation:* Breaking a dress code vs. breaking a promise; resentment feels different. *Why Non-Negotiable:* Essential conceptual clarity. Conventions lack intrinsic moral weight; their "ought" is conditional.
  5.  **Distinction from Habits/Fashions/Rules:** Must differentiate from:
      *   *Habits:* Individual, non-conditional (e.g., brushing teeth same way even alone).
      *   *Fashions:* Driven by trendiness/status, not primarily coordination (e.g., flared jeans).
      *   *Rules:* Dictated and enforced by authority (e.g., tax code).
      *   *Motivation:* Driving side (convention) vs. brushing technique (habit) vs. wearing a trend (fashion) vs. speed limit (rule). *Why Non-Negotiable:* Prevents conceptual collapse. Conventions are social solutions to coordination problems, not individual quirks, status games, or commands.

  ### Important Explanatory Challenges (Strongly Desired, But Theories Can Address Differently)
  Failure here weakens the account but doesn't destroy it. Success is a major virtue.

  6.  **Emergence (Bootstrapping):** Explain how a convention can arise *de novo* without pre-existing focal points, common knowledge, or explicit agreement. *Motivation:* How did the *first* traffic conventions form? How do new slang terms catch on? *Why Optional (but vital):* While essential for a complete picture, some theories (like Lewis's focal points) might start later in the process. A theory focusing solely on stability might sidestep it, but this is a significant weakness.
  7.  **Lock-In & Path Dependence:** Explain why suboptimal conventions (QWERTY, VHS) persist despite widespread preference for an alternative and the *possibility* of switching. *Motivation:* QWERTY, Beta vs. VHS, fossilized gender roles. *Why Optional (but vital):* Not *all* conventions are locked-in suboptimal ones (e.g., driving side is roughly optimal). However, the *potential* for suboptimal lock-in is a crucial feature conventions exhibit. *Crucially:* **Arbitrariness and Lock-In are NOT in conflict.** Arbitrariness means *other solutions were initially possible*. Lock-in means *switching from the current solution is hard*. They address different temporal phases (origin vs. persistence). A convention can be both arbitrary and locked-in (QWERTY).
  8.  **Sudden Collapse:** Explain how a seemingly stable convention can disintegrate rapidly when conditions change. *Motivation:* Footbinding, dueling, collapse of certain political regimes, rapid language shifts. *Why Optional (but vital):* Explaining persistence is core; explaining *how* persistence *fails* under specific pressures (e.g., changing preferences, external shocks, critical mass defection) makes the account of stability richer and more realistic.
  9.  **Licensing Resentment/Blame (in Pure Coordination):** Explain why breaking a *pure* coordination convention (where no one *directly* loses if you unilaterally deviate, e.g., wearing mismatched clothes to a black-tie event where *you* look foolish but don't *harm* others) often provokes resentment or blame. *Motivation:* Social awkwardness, mild disapproval for breaking dress code or minor etiquette. *Why Optional:* This is highly contentious. Some argue this *requires* normative expectations bleeding in. Others see it as disappointment from reliance on expectations. A theory focusing purely on coordination *efficiency* might struggle here, but it's a pervasive empirical phenomenon.
  10. **Functioning Without Common Knowledge (Pluralistic Ignorance):** Explain how conventions can be stable and followed even when agents have significantly *false* beliefs about others' beliefs and preferences. *Motivation:* Studies on pluralistic ignorance (e.g., everyone privately dislikes a norm but publicly conforms, believing others like it). Real-world complexity makes perfect CK impossible. *Why Optional (but reality-check):* Pure Lewisian accounts *require* CK. However, demonstrating stability *without* CK is a major challenge to those accounts and reflects empirical reality.

  ### The Core Conflict: Rationality vs. Reality
  *   **Conflict:** "Conformity must be explained by each individual's **rationality given their (accurate) beliefs about others**" vs. "Must explain stability sustained by **widely false beliefs about others** (Pluralistic Ignorance)".
  *   **Resolution:** These **cannot both be satisfied** in their strong forms. If beliefs about others are systematically *false* (e.g., I conform because I falsely believe everyone else strongly endorses the convention, while in reality, most privately dislike it), then conforming based *only* on those false beliefs + individual rationality doesn't fully explain the *persistence* of the false beliefs *and* the convention. Rationality operating on false inputs might explain *my* action, but not the *systemic* stability reliant on mass delusion.
  *   **Which Must Go:** The requirement for **accurate beliefs** must be relaxed *or* the requirement for rationality must be interpreted much more broadly (e.g., bounded rationality, rule-following) *or* an additional mechanism (like normative expectations enforcing conformity *despite* private beliefs) must be introduced. **Rationality operating on accurate beliefs is the casualty.** Realistic accounts must incorporate cognitive limits, false beliefs, or non-rational/normative elements.

  ### The Most Exclusionary Requirement
  *   **Pluralistic Ignorance (Requirement #10)** does the most work excluding candidate accounts. It directly challenges:
      *   **Lewis-style CK+Rationality:** Requires near-perfect CK, which is empirically false and computationally implausible.
      *   **Strict Rational Choice Models:** Rely on agents having (at least probabilistically) accurate beliefs about others' strategies/payoffs.
      *   Accounts that cannot explain why people conform *while* privately disagreeing and *believing* others agree.

  ### How Major Strategies Fare Against the Spec

  1.  **Common Knowledge + Rationality (Lewis & successors):**
      *   **Strengths:** Nails arbitrariness, interdependence, stability (with CK), distinction from moral norms/habits/rules. Elegant for pure coordination.
      *   **Weaknesses:** Struggles massively with **emergence** (relies on focal points), **lock-in** (rational agents should switch if better equilibrium known), **collapse** (hard to model without external shock), **resentment** (rational defection shouldn't cause blame in pure coordination), and fatally fails **pluralistic ignorance** (requires CK). CK is unrealistic.

  2.  **Evolutionary Game Theory / Dynamical Selection:**
      *   **Strengths:** Excellent at **emergence** (random variation + selection), **lock-in** (attractor basins, local maxima), **stability** (evolutionarily stable strategies), **collapse** (modeling shifting environments/payoffs). Handles **pluralistic ignorance** indirectly (population states, not individual beliefs).
      *   **Weaknesses:** Blurs distinction from **habits/fashions** (can model those too). Struggles with **resentment** (no room for normative "ought"). Poor at explaining *individual* **rationality** or conscious choice ("why did *I* do it?"). **Arbitrariness** is explained but feels different (path dependence vs. conscious choice).

  3.  **Networks of Expectations (Bicchieri, mixed-motive focus):**
      *   **Strengths:** Excels at **interdependence**, **stability** via expectations, **pluralistic ignorance** (empirical + normative expectations can diverge), **lock-in** via normative expectations, **distinctions** (norms have intrinsic normative expectations, conventions have empirical + conditional normative). Best at explaining **resentment** (violating normative expectations).
      *   **Weaknesses:** Can blur **convention/norm** line if normative expectations get too strong. **Emergence** less clear than evolutionary models. **Arbitrariness** explained, but focus is on expectations sustaining *whatever* exists. Less emphasis on pure **rationality**; more on social psychology.

  **The Takeaway:** No single account nails everything perfectly. Lewis sets a clean baseline but fails empirically. Evolutionary models capture dynamics but lose the individual perspective. Expectation networks handle the messy psychology but risk over-normativizing convention. The tension between rationality and pluralistic ignorance is fundamental – any account prioritizing strict individual rationality will struggle with the empirical reality of widespread false beliefs sustaining conventions. Building a paper around *that* tension, or how lock-in emerges *without* requiring common knowledge, is likely more fruitful than another survey. Focus on the gap between rationality assumptions and the empirical social psychology of conformity.
