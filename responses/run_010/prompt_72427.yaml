answer: |-
  ### Exam Question: Bell's Theorem and Locality

  **Stem:**  
  Consider Model M for a bipartite quantum experiment:  
  - Alice chooses a measurement direction from {0°, 90°}; Bob chooses from {45°, 135°}.  
  - Outcomes are in {+1, −1} for both.  
  - A single hidden variable λ takes one value λ₀ with probability 1 (hence independent of settings).  
  - Conditional on λ₀, for any settings (a, b), the probability that Alice and Bob agree (both +1 or both −1) is \((1 - \cos(a - b))/2\). The joint probabilities are assigned as follows:  
    - The agreement probability is split evenly between (+1,+1) and (−1,−1).  
    - The disagreement probability is split evenly between (+1,−1) and (−1,+1).  

  The CHSH combination is \(S = E(a,b) - E(a,b') + E(a',b) + E(a',b')\), where \(E(a,b)\) is the expectation value of the product of outcomes. For factorizable models (satisfying Bell’s local causality), \(|S| \leq 2\).  

  **(a)** (5 marks)  
  (i) Derive \(E(A,B|a,b)\) for Model M.  
  (ii) Compute \(S\) for \(a = 0°\), \(a' = 90°\), \(b = 45°\), \(b' = 135°\).  
  (iii) State the bound for \(|S|\) in any factorizable model.  

  **(b)** (5 marks)  
  Using the probability specification, determine whether Model M satisfies parameter independence and whether it satisfies outcome independence. Justify your answers.  

  **(c)** (4 marks)  
  Decide whether Model M permits superluminal signalling. Explain what your answer to (b) settles—and does not settle—about signalling.  

  **(d)** (6 marks)  
  Evaluate the claim: "Model M refutes Bell’s theorem because it reproduces quantum correlations while remaining local." Discuss which notion of locality is in play (no-signalling, parameter independence, or Bell’s local causality) and reach a verdict.  

  **(e)** (5 marks)  
  Explain what changes if Model M is required to be deterministic (each outcome a fixed function of the local setting and λ). Why is the model’s irreducibly stochastic character essential?  

  ---

  ### Model Answer  

  **(a)**  
  **(i)** The expectation value \(E(A,B|a,b)\) is the sum over outcomes:  
  \[
  E = (+1)(+1)P_{++} + (+1)(-1)P_{+-} + (-1)(+1)P_{-+} + (-1)(-1)P_{--}.
  \]  
  Given:  
  \[
  P_{++} = P_{--} = \frac{1 - \cos(a-b)}{4}, \quad P_{+-} = P_{-+} = \frac{1 + \cos(a-b)}{4}.
  \]  
  Substitute:  
  \[
  E = \left[\frac{1 - \cos(a-b)}{4}\right] - \left[\frac{1 + \cos(a-b)}{4}\right] - \left[\frac{1 + \cos(a-b)}{4}\right] + \left[\frac{1 - \cos(a-b)}{4}\right] = \frac{ -2\cos(a-b) }{2} = -\cos(a-b).
  \]  
  **(ii)** For \(a=0°\), \(a'=90°\), \(b=45°\), \(b'=135°\):  
  \[
  E(a,b) = -\cos(0° - 45°) = -\cos(-45°) = -\frac{\sqrt{2}}{2}, \\
  E(a,b') = -\cos(0° - 135°) = -\cos(-135°) = -(-\frac{\sqrt{2}}{2}) = \frac{\sqrt{2}}{2}, \\
  E(a',b) = -\cos(90° - 45°) = -\cos(45°) = -\frac{\sqrt{2}}{2}, \\
  E(a',b') = -\cos(90° - 135°) = -\cos(-45°) = -\frac{\sqrt{2}}{2}.
  \]  
  \[
  S = -\frac{\sqrt{2}}{2} - \frac{\sqrt{2}}{2} - \frac{\sqrt{2}}{2} - \frac{\sqrt{2}}{2} = -2\sqrt{2} \quad (|S| = 2\sqrt{2} \approx 2.828).
  \]  
  **(iii)** Factorizable models must obey \(|S| \leq 2\).  

  **(b)**  
  - **Parameter independence**: The marginal outcome distribution for one party must be independent of the other’s setting. For Alice:  
    \[
    P(A=+1|a,b) = P_{++} + P_{+-} = \frac{1 - \cos(a-b)}{4} + \frac{1 + \cos(a-b)}{4} = \frac{2}{4} = \frac{1}{2}.
    \]  
    This is independent of \(b\). Similarly, \(P(A=-1|a,b) = \frac{1}{2}\), and Bob’s marginals are independent of \(a\). **Parameter independence holds.**  
  - **Outcome independence**: Outcomes must be independent given settings and λ: \(P(A,B|a,b,\lambda) = P(A|a,b,\lambda)P(B|a,b,\lambda)\). For \(A=B=+1\):  
    \[
    \text{LHS} = \frac{1 - \cos(a-b)}{4}, \quad \text{RHS} = \left(\frac{1}{2}\right)\left(\frac{1}{2}\right) = \frac{1}{4}.
    \]  
    These differ (e.g., if \(a-b=0\), LHS=0). **Outcome independence fails.**  

  **(c)**  
  Model M **does not permit superluminal signalling**. Parameter independence ensures no party can influence the other’s marginal outcome probabilities (e.g., Alice’s settings don’t alter Bob’s \(\frac{1}{2}\) probabilities). The answer to (b) settles that signalling is impossible (via parameter independence) but does not settle nonlocality (outcome independence fails, but this alone doesn’t enable signalling).  

  **(d)**  
  The claim is **false**. Model M reproduces quantum correlations (\(E = -\cos(a-b)\), matching the singlet state). However:  
  - It satisfies **no-signalling** (from parameter independence) and **parameter independence**, but violates **Bell’s local causality** (factorizability: \(P(A,B|a,b,\lambda) = P(A|a,\lambda)P(B|b,\lambda)\)), since outcome independence fails.  
  - Bell’s theorem states that factorizable models obey \(|S| \leq 2\). Model M violates this (\(|S| > 2\)), so it is nonlocal by Bell’s criterion. This does not refute Bell’s theorem; it confirms it: quantum correlations require nonlocality (failure of factorizability).  
  - **Verdict**: Model M is nonlocal (Bell’s sense) and does not refute Bell’s theorem.  

  *(Strong candidates note: λ₀ carries no information, so Model M’s probabilities match quantum mechanics with the state treated as complete. This implies quantum mechanics itself violates Bell’s local causality.)*  

  **(e)**  
  In a deterministic model, outcomes for fixed λ and settings are fixed (e.g., \(A = f(a,\lambda)\), \(B = g(b,\lambda)\)). Since λ is fixed (λ₀), each setting pair \((a,b)\) produces fixed outcomes (e.g., always agree or disagree). The agreement probability becomes 0 or 1, but quantum mechanics requires non-extreme probabilities (e.g., \(\frac{1 - \cos(45^\circ)}{2} \approx 0.146 \notin \{0,1\}\)). Stochasticity is essential: it allows non-factorizable probabilities without varying λ, matching quantum randomness. Without it, deterministic hidden variables would require varying λ to match probabilities, risking conflict with Bell’s inequality.  

  ---

  ### Marking Scheme (25 marks total)  

  **(a)** (5 marks)  
  - (i) Correct derivation of \(E = -\cos(a-b)\) (2 marks).  
  - (ii) Correct \(S = -2\sqrt{2}\) (2 marks: 0.5 per \(E\) value, 1 for \(S\)).  
  - (iii) \(|S| \leq 2\) for factorizable models (1 mark).  
    *Errors:  
    - Mistake in \(E\) derivation (e.g., misapplying cosine) → −1.  
    - Arithmetic error in \(S\) (e.g., sign error) → −1.*  

  **(b)** (5 marks)  
  - Parameter independence: holds, with justification (marginals = \(\frac{1}{2}\)) (2 marks).  
  - Outcome independence: fails, with counterexample (e.g., \(P_{++} \neq \frac{1}{4}\)) (3 marks).  
    *Errors:  
    - Confuses parameter/outcome independence → −3.  
    - Claims independence without calculation → −2.*  

  **(c)** (4 marks)  
  - Correct: no signalling (1 mark).  
  - Links to parameter independence (settles no-signalling) (2 marks).  
  - Notes outcome independence failure irrelevant to signalling (1 mark).  
    *Errors:  
    - Claims signalling possible → −2.  
    - Attributes signalling to outcome independence → −1.*  

  **(d)** (6 marks)  
  - Verdict: false (1 mark).  
  - Discusses no-signalling and Bell’s local causality (factorizability) (2 marks).  
  - Notes violation of factorizability (outcome independence failure) (1 mark).  
  - Explains violation confirms Bell’s theorem (quantum needs nonlocality) (1 mark).  
  - Clear conclusion (1 mark).  
  - *(Bonus: notes λ₀ implies equivalence to QM completeness → +1, but max 6).*  
    *Errors:  
    - Asserts locality without specifying criterion → −2.  
    - Claims refutation of Bell → −3.*  

  **(e)** (5 marks)  
  - Outcomes fixed for deterministic + fixed λ (1 mark).  
  - Agreement probability becomes 0 or 1 (1 mark).  
  - Contrast with quantum probabilities (non-extreme) (1 mark).  
  - Stochasticity essential for randomness without varying λ (2 marks).  
    *Errors:  
    - Assumes deterministic model can match QM → −2.  
    - Omits why stochasticity is essential → −1.*  

  ### First-Class vs. Second-Class Distinction  
  - **First-class**: Precise calculations; explicitly defines parameter/outcome independence and Bell’s factorizability; notes in (d) that Model M’s probabilities match QM completeness (bonus); in (e), highlights conflict with determinism.  
  - **Second-class**: Minor errors in arithmetic; vague definitions of locality; misses the link between factorizability and Bell’s theorem; in (e), states stochasticity is needed but doesn’t quantify the probability mismatch.  

  ### Identifiable Errors (with deductions)  
  1. **Error**: Uses \(\cos(135^\circ) = \frac{\sqrt{2}}{2}\) (should be \(-\frac{\sqrt{2}}{2}\)) in (a)(ii).  
     *Deduction*: −0.5; reveals trigonometric confusion.  
  2. **Error**: Claims outcome independence holds because marginals are independent.  
     *Deduction*: −3 in (b); confuses independence types.  
  3. **Error**: Asserts signalling is possible due to outcome correlations.  
     *Deduction*: −2 in (c); misunderstands signalling requirements.  
  4. **Error**: States Model M is local by Bell’s criterion.  
     *Deduction*: −2 in (d); misapplies locality.  
  5. **Error**: Claims Bell’s theorem is refuted because \(|S| > 2\).  
     *Deduction*: −3 in (d); ignores the non-factorizability premise.  
  6. **Error**: Assumes deterministic Model M can reproduce quantum probabilities.  
     *Deduction*: −2 in (e); overlooks fixed outcomes.
