   Exam Question:

     Question 4: Bell's Theorem and Locality (25 marks)

     Consider the following model (Model M) for a bipartite experiment:

        - Alice chooses a measurement direction from the set {0°, 90°} and Bob from {45°, 135°}.
        - Each measurement yields an outcome in the set {+1, -1}.
        - The model has a single hidden variable, λ, which takes only one value (λ₀) with probability one, and is therefore independent of both settings.
        - Conditional on λ₀, for any settings a (Alice) and b (Bob), the probability that the two outcomes agree [i.e., both +1 or both -1] is (1 - cos(a-b))/2.
        - The model specifies that the joint probabilities are assigned as follows: the probability of agreement is split evenly between the two agreeing outcome pairs, and the probability of disagreement is split evenly between the two disagreeing outcome pairs.

     (a) (5 marks) 
          (i) Derive the expectation value E(A,B|a,b) for Model M, where A and B are the outcomes of Alice and Bob respectively.
          (ii) Using the settings a=0°, a'=90° for Alice and b=45°, b'=135° for Bob, evaluate the CHSH combination S = E(a,b) - E(a,b') + E(a',b) + E(a',b').
          (iii) State the Bell inequality bound that any factorizable model must satisfy for |S|.

     (b) (5 marks) 
          Using the probability specification of Model M, decide whether the model satisfies parameter independence and whether it satisfies outcome independence. Justify your answers.

     (c) (4 marks) 
          Decide whether Model M permits superluminal signalling. Explain what the answer to part (b) does and does not settle about this.

     (d) (6 marks) 
          Evaluate the following claim: "Model M refutes Bell's theorem because it reproduces the quantum correlations while remaining local." 
          Your answer must discuss which notion of locality is in play (no-signalling, parameter independence, or Bell's own criterion of local causality) and reach a verdict.

     (e) (5 marks) 
          Suppose we require the model to be deterministic, meaning that each outcome is a fixed function of the local setting and λ. Explain what changes in the model and why Model M's irreducibly stochastic character (even given λ) is essential for it to reproduce the quantum correlations.

   Model Answer:

     (a) 
          (i) The expectation value E(A,B|a,b) is defined as the average of the product of the outcomes. 
              We have four joint probabilities:
                  P(+,+ | a,b) = [1 - cos(a-b)]/4
                  P(-,- | a,b) = [1 - cos(a-b)]/4
                  P(+,- | a,b) = [1 + cos(a-b)]/4
                  P(-,+ | a,b) = [1 + cos(a-b)]/4

              Then:
                  E(A,B|a,b) = (1)(1)*P(+,+ | a,b) + (1)(-1)*P(+,- | a,b) + (-1)(1)*P(-,+ | a,b) + (-1)(-1)*P(-,- | a,b)
                              = P(+,+ | a,b) - P(+,- | a,b) - P(-,+ | a,b) + P(-,- | a,b)
                              = [ (1-cos)/4 + (1-cos)/4 ] - [ (1+cos)/4 + (1+cos)/4 ]
                              = [ (2 - 2cos)/4 ] - [ (2 + 2cos)/4 ]
                              = [ (1 - cos) - (1 + cos) ] / 2
                              = (-2cos) / 2
                              = -cos(a-b)

          (ii) Now compute S for a=0°, b=45°, a'=90°, b'=135°:

               E(a,b) = E(0,45) = -cos(0-45) = -cos(-45) = -cos(45) = -√2/2
               E(a,b') = E(0,135) = -cos(0-135) = -cos(-135) = -cos(135) = -(-√2/2) = √2/2
               E(a',b) = E(90,45) = -cos(90-45) = -cos(45) = -√2/2
               E(a',b') = E(90,135) = -cos(90-135) = -cos(-45) = -cos(45) = -√2/2

               S = E(a,b) - E(a,b') + E(a',b) + E(a',b')
                 = (-√2/2) - (√2/2) + (-√2/2) + (-√2/2)
                 = (-√2 - √2 - √2 - √2) / 2
                 = (-4√2) / 2
                 = -2√2

               The absolute value |S| = 2√2 ≈ 2.828.

          (iii) Any factorizable model must satisfy |S| ≤ 2.

     (b) 
          Parameter independence requires that the marginal distribution of one party's outcome does not depend on the other party's setting.

          For Alice: P(A=+1 | a, b, λ) = P(A=+1 | a, λ). Since λ is fixed, we can drop it.

          Compute P(A=+1 | a, b) = P(+,+ | a,b) + P(+,- | a,b) 
                  = [ (1 - cos(a-b))/4 ] + [ (1 + cos(a-b))/4 ]
                  = (2)/4 = 1/2.

          Similarly, P(A=-1 | a, b) = 1/2. This is independent of b. Similarly, for Bob: 
              P(B=+1 | a, b) = P(+,+ | a,b) + P(-,+ | a,b) = (1 - cos(a-b))/4 + (1 + cos(a-b))/4 = 1/2.
              P(B=-1 | a, b) = 1/2, independent of a.

          Therefore, parameter independence holds.

          Outcome independence requires that the outcomes are independent given the settings and λ:
              P(A,B | a,b,λ) = P(A|a,b,λ) * P(B|a,b,λ)

          We have P(A=+1|a,b,λ) = 1/2, P(B=+1|a,b,λ)=1/2, so their product is 1/4.

          But P(A=+1, B=+1 | a,b,λ) = (1 - cos(a-b))/4, which is not always 1/4. For example, if a-b=0, then cos(0)=1, and P(+,+)=0. 
          Therefore, outcome independence fails.

          Conclusion: parameter independence holds, outcome independence fails.

     (c)
          Model M does not permit superluminal signalling. 

          The reason is that parameter independence holds. Parameter independence ensures that the marginal distribution of Alice's outcomes does not depend on Bob's setting (and vice versa). Therefore, by choosing her setting, Bob cannot change the statistics of Alice's outcomes, so Alice cannot detect any change based on Bob's setting choice. Similarly, Bob cannot detect any change based on Alice's setting. Therefore, no superluminal signalling is possible.

          The answer to (b) shows that parameter independence holds, which settles that there is no signalling. The failure of outcome independence does not imply signalling; it only means that the outcomes are correlated, but these correlations cannot be used to send signals because the marginals are fixed.

     (d)
          The claim is false. 

          Model M reproduces the quantum correlations (as shown by the expectation value being -cos(a-b), which matches the singlet state). However, it does not refute Bell's theorem because it violates Bell's criterion of local causality (factorizability). 

          Bell's theorem states that any locally causal model (i.e., one satisfying factorizability) must obey the Bell inequality (|S|≤2). Model M violates this inequality (|S|=2√2>2), so it cannot be locally causal in Bell's sense. This is consistent with Bell's theorem, which tells us that quantum correlations cannot be reproduced by a locally causal model.

          The model satisfies no-signalling (as established in (c)) and parameter independence (which is a stronger condition than no-signalling only in the sense that it is defined per λ, but in this case since λ is fixed, it directly implies no-signalling). However, Bell's own criterion of local causality requires both parameter independence and outcome independence (which together imply factorizability). Since outcome independence fails, the model is not locally causal by Bell's standard.

          Therefore, the model does not refute Bell's theorem; it is an example of a nonlocal hidden variable model that reproduces quantum correlations. Bell's theorem remains valid because it only rules out locally causal models.

          Additionally, we note that in this model, the hidden variable λ is fixed and thus carries no information. The probabilities are the same as in quantum mechanics when the quantum state (the singlet) is treated as complete. This shows that quantum mechanics, if taken as complete (without hidden variables), is nonlocal in Bell's sense.

     (e)
          If the model is required to be deterministic, then each outcome must be a fixed function of the local setting and λ. Since λ is fixed (λ₀), the outcome for Alice at a given setting a would be fixed (either always +1 or always -1). Similarly for Bob. 

          Therefore, for a given pair of settings (a,b), the outcome pair would be fixed. This means that the probability of agreement would be either 0 or 1. 

          However, in the quantum case, the probability of agreement is (1 - cos(a-b))/2, which is not always 0 or 1 (for example, when a-b=45°, it is about 0.146). Therefore, the deterministic model cannot reproduce the quantum probabilities.

          The stochastic character of Model M is essential because it allows for randomness in the outcomes even for a fixed λ. This randomness is necessary to match the quantum probabilities. Without it, we would require a hidden variable that varies to produce the different outcomes, but in this model there is no variation in λ. Therefore, the stochasticity is doing the essential work of reproducing the quantum correlations without varying λ.

          Moreover, if we were to introduce more hidden variable values (to make the outcomes deterministic but varying) then we would need to assign probabilities to different λ values, and then we might be able to achieve the quantum probabilities. However, then we would have to check factorizability. But Bell's theorem shows that if we require factorizability, we cannot violate the Bell inequality. Therefore, a local deterministic model (with more λ values) cannot reproduce the quantum correlations.

