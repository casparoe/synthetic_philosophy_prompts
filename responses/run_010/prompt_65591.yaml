prompt: |-
  I am a doctoral candidate in cognitive neuroscience. I referee four or five split-brain manuscripts a year and supervise the lateralized-testing battery in my own lab, so I make the same call repeatedly: does a given behavioural result license an inference to two streams of consciousness, or even to two subjects of experience, or does it license only a claim about disconnection — information failing to reach a hemisphere that nevertheless belongs to a single conscious field? I would like that call turned into a procedure.

  Build a referee's decision procedure that can be run in about an hour on a manuscript and its figures, with no access to the patient and no way to request new controls, and that a reviewer with no training in philosophy of mind can follow. State the questions in order, what counts as a sufficient answer to each, the point at which the procedure terminates in "no two-subject inference licensed," and the points where it hands the issue back to the editor or to the author's chosen criterion of personal identity rather than settling it on data. It must engage, at minimum: the distinction between disconnection and division; why positive evidence of conflict and negative evidence of failed transfer warrant different inferences; the standing confounds (subcortical and ipsilateral routes, commissural remnants, eye movements and cueing, tasks one hemisphere can solve unaided); and the gap between absence of verbal report and absence of experience, given that a confabulating interpreter is not a lying one. Mark explicitly which steps are judgment calls in procedural dress.

  Then run the procedure on three cases. First, a manuscript reporting accurate left-hand pointing to a left-field picture together with the patient's denial that anything appeared. Second, a manuscript reporting the intermanual conflict Akelaitis called diagonistic dyspraxia, in which one hand buttons a shirt while the other unbuttons it. Third, a manuscript that reproduces the failure of cross-field comparison after complete callosotomy yet finds above-chance verbal identification of left-field stimuli. The third is close to a study my own lab is preparing to submit: report what the procedure yields there even if the verdict is one I would rather not receive, and tell me if the grounds on which it is rejected would also sink the first case. Finally, state what the procedure cannot do — which questions it leaves permanently underdetermined by any amount of behavioural data.
reasoning: |-
  We are building a decision procedure for referees to evaluate split-brain manuscripts. The goal is to determine whether the data license an inference to two streams of consciousness (or two subjects) or only a claim about disconnection (information not reaching one hemisphere within a single conscious field).

  The procedure must address:
  1. The distinction between disconnection and division.
  2. Why positive evidence of conflict (like diagonistic dyspraxia) and negative evidence of failed transfer (like absence of verbal report) warrant different inferences.
  3. Standing confounds: subcortical/ipsilateral routes, commissural remnants, eye movements and cueing, tasks one hemisphere can solve unaided.
  4. The gap between absence of verbal report and absence of experience (confabulation vs. lying).

  The procedure is designed for a reviewer without philosophy of mind training and should take about an hour.

  We outline the procedure as a series of ordered questions. We mark judgment calls explicitly.

  ---

  **Referee's Decision Procedure for Split-Brain Manuscripts**

  **Step 1: Check for Commissurotomy Completeness**
     - **Question:** Is the callosotomy complete? (Check methods: surgery report, MRI if available. Note any remnants or spared fibers, especially anterior/posterior commissures, subcortical connections.)
     - **Sufficient Answer:** 
       - If complete: proceed to Step 2.
       - If incomplete (any spared commissures) or unknown: stop. **Inference: Only disconnection is licensed.** (Because spared connections could allow information transfer, so any deficit might be due to partial disconnection, not division.)
     - **Judgment Call?** No. This is based on reported methods. If the methods are unclear, the procedure terminates here with "no two-subject inference licensed" and the manuscript may be returned for revision to clarify.

  **Step 2: Rule Out Subcortical and Ipsilateral Routes**
     - **Question:** Have the authors controlled for subcortical (e.g., collicular) and ipsilateral sensory/motor routes? (Check: stimuli presented in a way that minimizes ipsilateral projections? e.g., lateralized tachistoscopic presentation with central fixation, brief exposure, masking. For motor tasks, are responses lateralized appropriately? e.g., left hand for right hemisphere, verbal for left.)
     - **Sufficient Answer:**
       - If controls are adequate (e.g., fixation monitored, brief exposure, masking, unilateral response modes) and the task design rules out ipsilateral processing: proceed to Step 3.
       - If controls are absent or inadequate: stop. **Inference: Only disconnection is licensed.** (Because the result could be due to ipsilateral/subcortical transfer or processing, not necessarily division.)
     - **Judgment Call?** Yes. Reviewer must judge if controls are adequate. If unsure, the manuscript may require revision to add controls.

  **Step 3: Rule Out Task Solvability by One Hemisphere**
     - **Question:** Is the task such that one hemisphere alone can solve it? (Check: if the task requires both hemispheres, then failure of transfer would be evidence for disconnection. But if the task is solvable by one hemisphere and the other hemisphere fails, that might indicate disconnection without necessarily implying two subjects.)
     - **Sufficient Answer:**
       - If the task requires integration of information from both hemispheres (e.g., cross-matching) and the patient fails, then that is evidence for disconnection. However, for two-subject inference, we need positive evidence of independent processing in each hemisphere. Proceed to Step 4.
       - If the task is solvable by one hemisphere (e.g., simple recognition) and the other hemisphere fails, then that is negative evidence (failed transfer) but not positive evidence of two independent streams. We must then look for positive evidence (Step 4).
     - **Judgment Call?** Yes. The reviewer must assess the task demands.

  **Step 4: Evaluate Positive vs. Negative Evidence**
     - **Question:** Is there positive evidence of independent processing or conflict? (Positive evidence: e.g., one hemisphere acts independently of the other, such as in intermanual conflict. Negative evidence: e.g., absence of report from one hemisphere, but without evidence of that hemisphere having its own independent experience.)
     - **Sufficient Answer:**
       - If there is positive evidence (e.g., conflict, independent responses): proceed to Step 5.
       - If only negative evidence (e.g., failed report, but no independent action): stop. **Inference: Only disconnection is licensed.** (Because negative evidence does not show that the disconnected hemisphere has its own stream of consciousness; it may be that the hemisphere is not conscious or that the information is not transferred to the reporting hemisphere. Also, consider confabulation in Step 6.)
     - **Judgment Call?** Yes. The reviewer must classify the evidence as positive or negative.

  **Step 5: Assess Conflict as Evidence for Two Subjects**
     - **Question:** For positive evidence (like conflict), is the conflict at the level of intentional action (e.g., one hand buttons, the other unbuttons) and not due to other factors (e.g., motor overflow, spasticity, or simple disconnection without independent agency)?
     - **Sufficient Answer:**
       - If the conflict is clearly intentional (e.g., goal-directed opposing actions) and not due to motor disorders: proceed to Step 6.
       - If the conflict could be explained by motor disorders or non-intentional factors: stop. **Inference: Only disconnection is licensed.**
     - **Judgment Call?** Yes. Requires assessing the nature of the conflict.

  **Step 6: Rule Out Confabulation for Absence of Report**
     - **Question:** For negative evidence (absence of report) or when the speaking hemisphere denies knowledge: could the disconnected hemisphere be conscious but unable to report? (This step is critical because absence of report does not equal absence of experience. Also, the speaking hemisphere might confabulate.)
     - **Sufficient Answer:**
       - If there is evidence that the disconnected hemisphere can report non-verbally (e.g., by pointing) and the speaking hemisphere denies the stimulus, then we have evidence that the disconnected hemisphere had an experience that the speaking hemisphere did not. This might suggest two streams. However, we must also consider if the speaking hemisphere is lying or confabulating. If the denial is consistent and the non-verbal response is accurate, then it's likely that the disconnected hemisphere had an experience that the speaking hemisphere did not. Proceed to Step 7.
       - If there is no non-verbal report from the disconnected hemisphere, then we cannot infer that it had an experience. The absence of verbal report might be due to disconnection without implying a separate stream. Stop: **Inference: Only disconnection is licensed.**
     - **Judgment Call?** Yes. Requires evaluating the nature of the report and the possibility of confabulation.

  **Step 7: Consider Personal Identity Criterion**
     - **Question:** Even if there are two streams of consciousness, do they constitute two persons? (This is a philosophical question. The procedure does not settle it but hands it back to the editor or the author's chosen criterion of personal identity.)
     - **Sufficient Answer:**
       - If the data show two independent streams of consciousness (from Steps 4-6), then the referee can say that the data are consistent with two streams. But whether they are two persons is beyond the data and the procedure. **Terminate with: "Data license inference to two streams of consciousness. The issue of whether these are two subjects of experience (persons) is not settled by the data and is left to philosophical interpretation."**
       - If the data do not show two independent streams, then stop: **Inference: Only disconnection is licensed.**
     - **Judgment Call?** Yes, in the sense that the referee must decide if the evidence is sufficient for two streams. But the question of two persons is explicitly handed off.

  **Termination Points for "No Two-Subject Inference Licensed":**
  - Step 1: Incomplete disconnection.
  - Step 2: Inadequate controls for ipsilateral/subcortical routes.
  - Step 3: Task solvability by one hemisphere without evidence of independent processing in the other.
  - Step 4: Only negative evidence (no positive evidence of independent processing or conflict).
  - Step 5: Conflict not clearly intentional.
  - Step 6: Absence of non-verbal report from the disconnected hemisphere (so we cannot infer experience there).

  **Procedure Cannot Determine:**
  - Whether two streams of consciousness imply two persons (depends on the criterion of personal identity).
  - Whether a disconnected hemisphere that never reports is conscious (the "silent" hemisphere problem).
  - Whether there is a single conscious field that is merely fragmented (rather than two distinct streams) in the absence of positive evidence of conflict.

