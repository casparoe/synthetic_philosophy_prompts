answer: |-
  ### Referee's Decision Procedure for Split-Brain Manuscripts  
  This procedure evaluates whether behavioral data license an inference to **two streams of consciousness** (or two subjects of experience) versus **disconnection** (information loss within a single conscious field). It is designed for reviewers without philosophy of mind training, takes ~1 hour, and uses only the manuscript and figures. Judgment calls are explicitly marked.  

  #### Procedure Outline  
  **Termination Rules:**  
  - **"No two-subject inference licensed"**: Procedure ends if any step yields insufficient evidence for two streams.  
  - **Handoff to editor/philosophy**: Occurs if evidence for two streams is found but personal identity criteria are needed (Step 7).  
  - **Order**: Steps must be followed sequentially; termination at any step skips the rest.  

  ---

  #### Step-by-Step Questions  
  1. **Completeness of Disconnection**  
     - **Question**: Is the callosotomy anatomically complete (e.g., via MRI/surgery reports), with no spared commissures (e.g., anterior, hippocampal)?  
     - **Sufficient Answer**:  
       - Yes (complete): Proceed to Step 2.  
       - No (incomplete/unknown): Terminate → **"No two-subject inference licensed." Disconnection-only claim permitted.**  
     - *Judgment Call?* Minimal. Relies on methods section.  

  2. **Control for Non-Callosal Routes**  
     - **Question**: Are subcortical (e.g., tectal, thalamic) and ipsilateral sensory/motor routes ruled out via controls?  
       - Check for:  
         - Tachistoscopic presentation (≤150ms) with central fixation monitoring.  
         - Eye-tracking to exclude covert saccades/field crossover.  
         - Unilateral response modes (e.g., left-hand-only for right hemisphere tasks).  
         - Masking to prevent afterimages.  
     - **Sufficient Answer**:  
       - Controls robust (e.g., fixation verified, unilateral responses): Proceed to Step 3.  
       - Controls absent/weak: Terminate → **"No two-subject inference licensed." Disconnection-only claim permitted.**  
     - *Judgment Call?* Yes. Reviewer assesses adequacy of controls (e.g., "fixation monitored" vs. "fixation assumed").  

  3. **Task Demands and Hemisphere Capability**  
     - **Question**: Could one hemisphere solve the task unaided?  
       - Examples:  
         - Solvable alone: Object naming, simple motor acts.  
         - Requires integration: Cross-field comparison, bimanual coordination.  
     - **Sufficient Answer**:  
       - Task requires both hemispheres (e.g., integration-dependent): Proceed to Step 4.  
       - Task solvable by one hemisphere: Proceed to Step 4 (but weakens two-stream claims).  
     - *Judgment Call?* Yes. Reviewer evaluates task complexity (e.g., "pointing to a picture" = solvable by one hemisphere).  

  4. **Positive vs. Negative Evidence Assessment**  
     - **Question**: Is there **positive evidence of independent processing** (e.g., conflict, autonomous responses) or only **negative evidence of failed transfer** (e.g., absence of report)?  
       - *Key distinction*:  
         - Positive evidence: Hemi-field actions contradicting each other or the verbal report.  
         - Negative evidence: Verbal denial or failed inter-hemispheric transfer without behavioral conflict.  
     - **Sufficient Answer**:  
       - Positive evidence (e.g., conflict): Proceed to Step 5.  
       - Only negative evidence (e.g., denial without conflict): Terminate → **"No two-subject inference licensed." Disconnection-only claim permitted.**  
     - *Judgment Call?* Yes. Reviewer classifies evidence type (e.g., conflict = positive; denial alone = negative).  

  5. **Intentionality of Conflict**  
     - **Question**: For positive evidence, is the conflict (e.g., intermanual struggle) intentional and goal-directed?  
       - Check against confounds:  
         - Motor overflow (e.g., involuntary movements).  
         - Spasticity or non-intentional reflexes.  
         - Task artifacts (e.g., clumsy bimanual coordination).  
     - **Sufficient Answer**:  
       - Conflict is goal-directed (e.g., one hand buttons, other unbuttons): Proceed to Step 6.  
       - Conflict non-intentional/artifactual: Terminate → **"No two-subject inference licensed." Disconnection-only claim permitted.**  
     - *Judgment Call?* Yes. Reviewer distinguishes goal-directed acts from noise (e.g., based on task design).  

  6. **Absence of Report vs. Absence of Experience**  
     - **Question**: For negative evidence, could the disconnected hemisphere be conscious but unable to report?  
       - Check for:  
         - Non-verbal response accuracy (e.g., left-hand pointing to stimuli).  
         - Confabulation by the speaking hemisphere (e.g., denies stimulus but non-verbal response correct).  
       - *Critical gap*: Absence of verbal report ≠ absence of experience; confabulation implies ignorance, not lying.  
     - **Sufficient Answer**:  
       - Accurate non-verbal response + verbal denial: Proceed to Step 7.  
       - No non-verbal response or inaccurate response: Terminate → **"No two-subject inference licensed." Disconnection-only claim permitted.**  
     - *Judgment Call?* Yes. Reviewer evaluates if confabulation is plausible (e.g., denial + accurate pointing).  

  7. **Streams of Consciousness vs. Personal Identity**  
     - **Question**: Does the evidence imply two distinct streams of consciousness?  
       - *Handoff clause*: If yes, personal identity (two subjects) is not settled by data → **Hand to editor/author's philosophy**.  
     - **Sufficient Answer**:  
       - Evidence for two streams (e.g., conflict + confabulation): **"Data license inference to two streams of consciousness. Personal identity (two subjects) is underdetermined and requires philosophical criterion."**  
       - Insufficient evidence: Terminate → **"No two-subject inference licensed."**  
     - *Judgment Call?* Yes. Reviewer integrates Steps 1–6; personal identity is explicitly handed off.  

  ---

  ### Procedure Applied to Three Cases  
  **Case 1: Left-hand pointing to left-field picture + verbal denial**  
  - **Step 1**: Callosotomy complete → Proceed.  
  - **Step 2**: Controls adequate (lateralized presentation, fixation) → Proceed.  
  - **Step 3**: Task solvable by one hemisphere (right hemisphere can point unaided) → Proceed.  
  - **Step 4**: **Positive evidence** (accurate pointing = independent processing) + **negative evidence** (denial) → Proceed.  
  - **Step 5**: Conflict absent → Skip to Step 6.  
  - **Step 6**: Non-verbal response (pointing) accurate + verbal denial → Confabulation confirmed → Proceed.  
  - **Step 7**: **Licenses two streams of consciousness.** Personal identity handed off.  
  - **Verdict**: Two-stream inference licensed.  

  **Case 2: Diagonistic dyspraxia (one hand buttons, other unbuttons)**  
  - **Step 1**: Callosotomy complete → Proceed.  
  - **Step 2**: Controls rule out motor artifacts → Proceed.  
  - **Step 3**: Task solvable by one hemisphere, but conflict implies independence → Proceed.  
  - **Step 4**: **Positive evidence** (goal conflict) → Proceed.  
  - **Step 5**: Conflict intentional (buttoning/unbuttoning are goal-directed) → Proceed.  
  - **Step 6**: Not needed (positive evidence dominates) → Proceed.  
  - **Step 7**: **Licenses two streams of consciousness.** Personal identity handed off.  
  - **Verdict**: Two-stream inference licensed.  

  **Case 3: Failed cross-field comparison but above-chance verbal ID of left-field stimuli**  
  - **Step 1**: Callosotomy complete → Proceed.  
  - **Step 2**: **Insufficient controls?** Verbal ID of left-field stimuli suggests ipsilateral/subcortical transfer (e.g., auditory cueing, poor fixation). If controls are weak → **Terminate: Disconnection-only.**  
    - *If controls robust*: Proceed to Step 3.  
  - **Step 3**: Task (verbal ID) solvable by left hemisphere only if information transfers → Proceed.  
  - **Step 4**: **Only negative evidence** (failed cross-comparison) but no conflict. Above-chance verbal ID implies transfer, not independence → **Terminate: No two-subject inference licensed.**  
  - **Verdict**: **Disconnection-only claim permitted.**  
  - **Impact on Case 1**: No. Case 1 had positive evidence (pointing) + confabulation; Case 3 has no conflict and implies transfer, weakening two-stream claims.  

  **Note on Your Lab's Study (Case 3)**: The procedure rejects two-stream inference due to lack of positive evidence (Step 4) and potential Step 2 confounds. This is consistent but stricter than Case 1, which had positive evidence.  

  ---

  ### What the Procedure Cannot Determine  
  1. **The "Silent Hemisphere"**: Cannot confirm if a hemisphere with no behavioral output (e.g., no motor capability) is conscious.  
  2. **Unity of Consciousness**: Cannot distinguish between "two streams" and a "fragmented single stream" without behavioral conflict (Step 5).  
  3. **Personal Identity**: Never resolves if two streams imply two persons (handed off in Step 7).  
  4. **Neural Correlates**: Cannot infer consciousness without behavior (e.g., if a hemisphere shows neural activation but no response).  
  5. **Complete Disconnection Proof**: Behavioral data alone cannot rule out all subcortical routes; requires anatomical verification.  

  This procedure prioritizes empirical conservatism: **two-stream inferences require positive evidence of independent agency** (e.g., conflict, confabulation with accurate non-verbal response). Negative evidence alone only supports disconnection.
