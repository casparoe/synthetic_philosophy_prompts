prompt: |-
  I'm giving the opening remarks — five minutes hard — at a one-day workshop my department is hosting next month. Working title is "Who Built This?", and it's about whether artifacts have politics, technological determinism, that whole fight. The room'll be half STS people and philosophers of technology who've read all of Winner, and half facilities engineers and architects, including the woman who actually designed the access-control system in the brand-new building we're meeting in. Plus a dozen undergrads getting credit for showing up.

  Two real details about that building, not hypotheticals: the step-free entrance stops opening at 5pm unless you have a badge, and the evening session runs untill 7, so our keynote speaker, who uses a wheelchair, will be coming in through the loading dock behind the kitchens. And the HVAC only runs in rooms with a live booking in the central system, which means my department now files a phantom "reading group" every Friday afternoon so the room isn't 29 degrees when we start.

  Write the remarks so those two details do the actual work instead of any abstract thesis. Constraints: it can't say or imply that technology is neutral and everything depends on how we use it (the engineers hear that as flattery and then stop listening), and it can't say or imply that the building made anybody do anything (the STS half will groan, and worse, the woman who designed the badge system is sitting right there and I want her in the conversation, not on trial). It still has to be welcoming — it's opening remarks, not a paper — and it should land on the first panel's actual question rather than on a slogan.

  Give me three sections in this order: "The remarks" (~500 words, with rough timing marks in the margin); "Where the philosophy is load-bearing" (~120 words naming the sentences that carry the weight and saying what breaks if you soften each one); and "Escape hatches" — two or three swap-in lines for if the room goes quiet in the wrong way.
