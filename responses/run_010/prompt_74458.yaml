  First, I need to verify the accuracy of the book's claims about Hume. The author says Hume thinks promises are binding only because of their social utility. The "broken in secret" part is highlighted as a consequence. I recall Hume's Treatise where he discusses promises as artificial virtues. He does emphasize social convention and utility, but does he really say secret breaches are okay? Let me think about Hume's actual arguments. In the Treatise, he mentions that the obligation arises from the mutual interest in maintaining the practice. But he also talks about the sentiment of morality being triggered by the general view of the action. So, even a secret breach might still be wrong because it's a violation of the convention itself, not just its effects. 

  Next, the rights-transfer theory critique. The book claims it's just relocating the mystery. But Hume's objection is more about the lack of empirical basis for such rights. The user wants to know if this is a valid critique. Rights-transfer theorists like Grotius or Locke might argue that rights are transferred through mutual agreement, not conjured from nothing. The book's summary might oversimplify by not acknowledging the role of consent in this theory.

  The user's personal dilemma: a promise to an unreachable friend. Using Hume to justify not keeping it because the friend won't know. But if Hume's view includes the internalization of norms, then personal integrity matters. Also, the practice's stability relies on individuals adhering even when undetected. So the user's reasoning might not hold under a corrected Humean view.

  I should also consider the user's deeper concerns. They might be wrestling with guilt over breaking their promise and seeking philosophical justification. Correcting the book's interpretation could alleviate that guilt or reinforce their moral obligation. They need clarity on whether Hume actually supports their reasoning.

  Lastly, the chapter's conclusion that all accounts collapse into mystery. After correcting the misinterpretations, Hume's conventionalism and the rights-transfer theory both have responses. The problem isn't insolubility but different foundational approaches. The user's situation shows the practical need for a reliable promise-keeping norm, which even Hume would uphold despite isolated cases.
answer: |-
  That passage is indeed doing something slippery—and not in a way Hume would endorse. Let's dissect it claim-by-claim against Hume's actual arguments (primarily from *A Treatise of Human Nature*, Book III, Part II, Section V) and the rights-transfer view:

  **1. "Promising is the strangest thing... Hume's explanation is that the bindingness is entirely a matter of convention..."**
      *   **Hume Scholar Sign-off:** Mostly accurate. Hume *does* argue promises are artificial, not natural virtues. Their obligation arises solely from human conventions invented to solve cooperation problems. The "convention" analogy (like banknotes or rules of the road) is fundamentally Humean. He explicitly says a promise is "naturally unintelligible" and its obligation invented by society.
      *   **Forgivable Simplification:** "Entirely a matter of convention" slightly underplays Hume's emphasis on *sentiment* and *sympathy*. The convention works because we *feel* approval for promise-keeping and disapproval for breaking, due to sympathy with the public interest. But convention is the source.

  **2. "Whether you're bound in a given case depends on whether the practice is served..."**
      *   **Hume Scholar Sign-off:** **Problematic.** This is where the simplification becomes misleading. For Hume, the *general practice* is justified by its utility to society ("the general interests or necessities of society"). However, the *obligation felt by the individual promisor* arises from their participation in that convention and the *sentiments* (moral disapproval, potential for social sanction, damage to one's character/reputation) attached to it. It's not a purely external, act-utilitarian calculation per promise.
      *   **What's Wrong / Attributed to Hume Unfairly:** The **"broken in secret" conclusion is a misrepresentation.** Hume does *not* argue that an individual promise is only binding if breaking it *in that specific instance* would damage the practice or be discovered. His focus is on the *general rule* and the *sentiments* it instills. Breaking a secret promise still violates the convention you participate in and benefit from. The "free-rider" worry (secretly breaking while relying on others to keep) is *precisely* what the convention and the accompanying moral sentiment are designed to prevent.

  **3. Hume's Reply to the Free-Rider Worry:**
      *   Hume *did* have a reply, grounded in his moral psychology:
          *   **Internalization of the Rule:** The convention creates a general rule ("keep promises") that becomes ingrained. We feel obligated *by the rule itself*, having internalized the moral sentiment supporting it through sympathy and education. Breaking the rule, even secretly, feels wrong *because* it violates this internalized standard.
          *   **Character & Integrity:** Acting against the rule damages one's own character in one's own eyes (conscience) and potentially before an ideal observer. Hume cares about the *virtue* of fidelity.
          *   **The Constitutive Act:** Making a promise *just is* the act of placing oneself under the rules of the convention. Breaking it, even secretly, is failing to perform the role one voluntarily undertook within that social practice. It's like secretly moving chess pieces when alone – you're violating the constitutive rules of the game you're playing.

  **4. The Charge Against Rights-Transfer: "...it assumes you have the power to conjure rights out of thin air..."**
      *   **Summary of Rights-Transfer:** The summary gets the *why* mostly right: Theorists (like Grotius, Pufendorf, later Kantians/Contractarians) proposed rights-transfer to explain the *specificity* of promissory obligation (why *this* person is owed *this* performance and can release you) and its *moral weight* (it creates a *right* in the promisee).
      *   **Is the Objection Real?** **Yes, it's a real and powerful Humean (and later positivist/realist) objection.** Hume would see "transferring a right" as just another metaphysical mystery needing explanation – *how* does saying words transfer this intangible thing? What *is* this "right" prior to convention? It seems to presuppose the very normative power (to create binding obligations/rights via words) that needs explaining. Rights-transfer often relies on a prior moral framework (natural law, Kantian autonomy) that Hume rejects as empirically unfounded or circular.
      *   **Does it Measure Against the Wrong Job?** **Partly.** The rights-transfer theorist isn't *necessarily* trying to give a *causal/empirical* account Hume demands; they might be giving a *normative* or *conceptual* analysis of what a promise *is*. However, Hume would counter that without an empirical basis in human sentiment and convention, this normative account floats free and fails to explain how such obligations actually arise and motivate us in the real world. The objection holds force against views claiming to be fundamental explanations.

  **5. Does "every account collapse and we should live with the mystery"?**
      *   **No, the overall moral doesn't survive correction.** The chapter creates a false dilemma by misrepresenting Hume and presenting rights-transfer as the only alternative.
      *   **Hume's Account (Corrected):** Doesn't collapse. It offers a coherent (if controversial) naturalistic explanation: Promises are binding due to a socially constructed convention, justified by general utility, and sustained by cultivated moral sentiments and self-interest. The "mystery" of creating obligation is solved by pointing to the empirical reality of human conventions and psychology.
      *   **Other Accounts Exist:** Many alternatives (Scanlon's expectation-based reliance, Raz's voluntary obligations, Kantian autonomy-based views, practice-based rules like Rawls) aren't even mentioned. While all face challenges, they don't simply collapse into mystery. The chapter's conclusion feels like a rhetorical trick enabled by its flawed presentation of Hume.

  **Your Patagonia Promise: Is the Reasoning (Once Fixed) Any Good?**

  *   **The Book's Flawed Reasoning (as used by you):** "My friend won't know, no social harm will occur, therefore no *real* obligation exists (per misread Hume)."
  *   **Corrected Humean Analysis:**
      1.  **You Participated in the Convention:** You used the social tool of promising to secure cooperation/assurance from your friend. You benefited from the convention.
      2.  **Internalized Obligation:** You likely feel a sense of commitment *because* you made a promise, even now. That feeling isn't irrational; it's the sentiment cultivated by the useful convention.
      3.  **Free-Riding:** Keeping your promise only when you might get caught is exploiting the system. The convention relies on general adherence, including when undetected, to remain stable and useful. Secretly breaking it undermines the practice you rely on elsewhere.
      4.  **Character/Integrity:** It's about the kind of person *you* are. Fulfilling a commitment made, even when inconvenient and unseen, aligns with the virtue of fidelity you (presumably) value.
  *   **Conclusion:** Using the *corrected* Humean view, the reasoning to talk yourself out of the promise **is not good.** Hume wouldn't endorse it. The obligation stems from your participation in the convention and the resulting moral sentiment/internalized rule, not the immediate social consequences of *this specific breach*. While Hume grounds the *origin* of the practice in utility, the *obligation felt by the individual* is a product of that practice and sentiment. Breaking it secretly is still a violation of the role you assumed and the rule you internalized. Fulfilling it, even unrewarded and unseen, maintains your integrity and upholds the practice that makes promising meaningful. Hume would likely advise you to keep your word.
