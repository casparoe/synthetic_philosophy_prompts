  First, I recall Rawls' definition: civil disobedience must be public, nonviolent, conscientious, and accept legal consequences. But the user points out examples like road blockers or draft resisters who don't evade arrest but argue their actions were justified in court. These individuals aren't submitting to punishment; they're using the trial as a platform.

  I need to check if there's an established term. "Principled disobedience" comes to mind, but it's more of an umbrella term. "Direct action" or "conscientious refusal" might fit, but they don't fully capture the legal contestation aspect. "Legal test case" is another angle, where the goal is to challenge a law's validity. But the user's cases are mixed—some are moral protests, others are legal challenges.

  The user's deeper need seems to be conceptual clarity. They want to distinguish between accepting punishment (Rawls), evading (crime), and contesting (this middle ground). They also ask about identical acts with different legal strategies—does that change the nature of the act?

  Key boundaries to define:
  1. Vs. evasion: Non-evasion is crucial. The person is public and faces arrest but fights in court.
  2. Vs. acceptance: They don't submit; they argue the law is invalid or their act was justified.
  3. The act's nature vs. legal strategy: The core act (e.g., blocking a road) is the same. The difference lies in the legal response—pleading not guilty vs. guilty but seeking leniency. The former contests the law's validity; the latter accepts guilt but appeals for mercy.

  I should explain that the distinction is in the legal strategy post-arrest, not the act itself. The user's examples show that the same act can be framed differently in court, altering how we categorize it. For instance, pleading not guilty transforms it into a challenge, while pleading guilty aligns with Rawls' acceptance.

  Also, the user might be interested in how this affects the movement's perception. Contesting can shift focus to legal validity, whereas accepting punishment highlights moral conviction. Both strategies have tactical implications for social movements.

  In summary, there's no single term, but the concept is "contestatory civil disobedience." The boundaries are clear: non-evasion and legal challenge vs. acceptance or evasion. The legal strategy defines the category, not the act itself.
answer: |-
  You've pinpointed a crucial and often-overlooked gap in the Rawlsian framework of civil disobedience (CD). **There isn't a single, universally accepted term for this precise phenomenon**, but it's widely recognized and discussed. Here's the conceptual carving you requested, including potential labels and boundary definitions:

  ### The Core Concept & Potential Labels

  1.  **Contestatory Civil Disobedience:** This is the most descriptive neutral term. It emphasizes the core act is still disobedience done for conscientious reasons and openly, but the key difference is **contesting the *legitimacy* of the punishment itself** within the legal system.
  2.  **Principled Legal Challenge (as Disobedience):** Highlights the strategic use of the trial as the primary platform to challenge the *validity* of the law or the *justification* of the act under existing law.
  3.  **Non-Submissive Civil Disobedience:** Directly contrasts with Rawls's core criterion of "accepting punishment."
  4.  **Conscientious Resistance (with Legal Defense):** Frames it as an act of refusal where the legal defense is an integral part of the resistance, refusing to concede the state's moral or legal authority to punish.

  **Why it doesn't fit neatly into Rawlsian CD:**
  Rawls defined CD as a *public, nonviolent, conscientious* act contrary to law, *done with the aim of bringing about a change in laws or policies*, and crucially, **"done with the acceptance of the legal consequences of one's conduct"**. This acceptance is what signals fidelity to the *overall* legal system and distinguishes it from mere criminality or revolutionary action. Your examples explicitly reject the "acceptance" part while maintaining publicity and conscience.

  ### Boundaries and Distinctions

  1.  **vs. Evasion (Standard Crime):**
      *   **Line:** Non-evasion and publicity are key. The contestatory disobedient *allows* arrest, identifies themselves, and submits to the *process* (trial) but *challenges the outcome* (conviction/punishment). They use the system's own mechanisms to fight it.
      *   **Evasion:** Actively hides identity, flees arrest, subverts the legal process entirely. This signals a rejection of the system's right to adjudicate the act at all.

  2.  **vs. Rawlsian Acceptance (Taking Punishment as Testimony):**
      *   **Line:** The core difference is the stance *towards the punishment's legitimacy*.
          *   **Acceptance:** Views the punishment as, while perhaps unjust in this instance, a *legitimate consequence* of breaking a law within a generally just system. Pleading guilty or not contesting the charge, then appealing for leniency *based on conscience/motive* while accepting the *validity* of the conviction.
          *   **Contestation:** Views the *law itself* as invalid (e.g., unconstitutional), or the *specific application/punishment* as fundamentally illegitimate *because the act was justified*. Argues for *acquittal* based on principle/legality. A conviction is seen as a *new wrong* committed by the state, not a legitimate consequence.
      *   **Tactical Nuance:** A Rawlsian CD might still mount a *mitigation* defense *after* accepting guilt, arguing for a lesser sentence based on motive. The contestatory disobedient mounts a *justification* or *nullification* defense *to avoid conviction entirely*.

  3.  **The Identical Act / Different Legal Strategy Question:**
      *   **Crucial Insight:** **The nature of the *act of disobedience itself* is identical.** The difference arises entirely in the **post-arrest legal strategy and philosophical stance towards the system.**
      *   **Is it a Different *Kind* of Act?** Philosophically and strategically, **yes.** The *meaning* and *intended message* of the act change based on the legal strategy:
          *   **Pleading for Acquittal (Contestatory):** The message is: "This law is fundamentally wrong/unconstitutional, or my act was legally/morally justified. The state should recognize this and acquit me. Enforcing this law *against me* is the real injustice."
          *   **Pleading Guilty & Seeking Leniency (Rawlsian):** The message is: "I broke this specific law because it is unjust/immoral, but I acknowledge the state's general authority to make and enforce laws. My willingness to suffer punishment demonstrates the depth of my conviction and my respect for the rule of law, hoping it will prompt reform."
      *   **Therefore:** While the underlying illegal act (blocking the road, burning a draft card) is the same, the **overall political/legal act** – encompassing the disobedience *and* the response to prosecution – **is fundamentally different.** One is a direct challenge to the law's validity within the courtroom; the other is a symbolic sacrifice *outside* the courtroom (even if occurring within its walls).

  4.  **vs. Revolution/Radical Rejection:**
      *   **Line:** The contestatory disobedient still engages with the legal system *on its own terms*, using legal arguments (constitutional rights, necessity defense, jury nullification appeals) to seek acquittal. They aim to *change or invalidate the specific law/policy* using the system's tools.
      *   **Revolutionary/Radical:** Rejects the *entire* legal system as fundamentally illegitimate. May refuse to participate in the trial, use it solely as a propaganda platform without engaging legal arguments, or actively seek martyrdom *to discredit the system itself*, not just a specific law. Evasion might also be part of this stance.

  ### Defining the Phenomenon (Best Effort Definition)

  **Contestatory Civil Disobedience (or Principled Legal Challenge via Disobedience):** An act of open, non-evasive, and conscientious lawbreaking, undertaken with the primary or significant secondary intent of provoking a legal confrontation. The actor submits to arrest and trial not to accept punishment, but to utilize the courtroom as a forum to **actively contest the validity of the law broken, the justification of their specific act under existing law, or the legitimacy of the punishment itself.** They seek acquittal based on principle or legal argument, viewing a conviction as a further injustice perpetrated by the state, rather than a legitimate consequence to be borne as testimony. This stance distinguishes it from both evasion (crime) and submissive acceptance (Rawlsian civil disobedience), while remaining distinct from a wholesale rejection of the legal system (revolution).

  ### Why This Carving Matters

  *   **Realism:** This category captures a huge swathe of historical and contemporary dissent (e.g., many climate protesters, anti-war resisters challenging draft laws, civil rights activists challenging segregation ordinances).
  *   **Fidelity vs. Critique:** It reflects a stance of *critical engagement* with the legal system – using its procedures while fundamentally challenging its application in a specific case, differing from Rawls's emphasis on demonstrating *fidelity* through acceptance.
  *   **Strategic Spectrum:** Movements often employ a mix of strategies – some participants accept punishment (sacrificial testimony), others contest legally (testing/changing the law), and some may evade (focusing on continued action). Recognizing contestation as a distinct, valid form clarifies movement dynamics.
  *   **Legitimacy Debates:** Critics might see contestatory CD as less "pure" or more self-interested than acceptance. Proponents argue it's a powerful way to directly challenge unjust laws *within* the system and potentially achieve legal change through precedent.

  In essence, you've identified a vital third way between evasion and acceptance: **using the law against itself.** While lacking a perfect universal label, "contestatory civil disobedience" best captures its core characteristics and distinct boundaries. The key differentiator is the **rejection of the punishment's legitimacy** and the **use of the trial for active legal challenge**, setting it apart from both crime and the classic Rawlsian model.
