prompt: |-
  Two requests come before our Medical Policy Committee on Thursday, and the coverage language we are supposed to apply to them turns out to be unsatisfiable. I have served on this committee for nine years; before that I spent a long stretch reading and arguing in the rationalist blogosphere, which left me permanently distrustful of criteria that sound principled but cannot be applied twice in a row. I have been asked to circulate a written opinion in advance of the meeting, and I would like help drafting it.

  Our policy on auditory prostheses says the plan pays for a device that is medically necessary to restore a member to normal function, pays to replace a malfunctioning device so as to restore the member to the level of function previously achieved, and excludes anything intended to improve function beyond the normal range. In practice 'medically necessary' has become a rubber stamp, but the other two clauses are doing real work, and both fail here.

  Request A. A girl of eleven, profoundly deaf in both ears from birth, was implanted at age three under our pediatric plan. Her internal electrode array has failed. The vendor confirms in writing that nothing comparable to her original device is manufactured any longer: the current internal device is materially better at speech perception in noise, supports direct wireless streaming from a phone or a classroom soundfield system, and is conditionally compatible with the 3-tesla scanners that are now standard. The literal criterion — restore her to the function she previously had — therefore cannot be met at any price, because the target no longer exists as a product. Her family adds an argument I cannot dismiss: a child implanted for the first time this year under the same plan receives that identical better device, and we call it medically necessary. The same hardware is therapy for one child and, apparently, an upgrade for another.

  Request B. A man of forty-nine with adult-onset bilateral sensorineural loss. Our audiometric thresholds were written when the technology was, and are now stricter than prevailing clinical practice; he falls short of them, though he derives little benefit from hearing aids. An implant would leave him below normal hearing yet well above his present function and above anything a hearing aid can give him.

  Two colleagues have already staked out the poles. One holds that the therapy/enhancement distinction is doing no work in either case and that we should simply fund what improves hearing. The other holds that approving A commits us, as precedent, to funding every future generation of device for roughly two thousand current implant users whose hardware will fail over the next decade — the per-case increment is trivial, the aggregate is not, and precedent is the only thing we actually decide when we decide a case like this.

  Please draft the opinion. It should recommend a disposition for each request — approve, deny, or approve with the conditions stated explicitly enough to be operational; confront the family's consistency argument in A head-on rather than around it; propose replacement language for the clauses about restoring previous function and about the normal range, written so that a utilization reviewer could apply it next year and again in ten years as device capability keeps improving; and state the strongest case for whichever disposition you are not recommending, in a form its proponent would recognize. Assume a reader who is intelligent but has no background in bioethics, and do not pause to rehearse the general debate about therapy versus enhancement: I know it well, and it does not decide either case. I want reasoning I can defend at the table, not sources.
reasoning: |-
  We are dealing with two requests that challenge our current coverage language for auditory prostheses. The policy states:
    1. The plan pays for a device that is medically necessary to restore a member to normal function.
    2. It pays to replace a malfunctioning device to restore the member to the level of function previously achieved.
    3. It excludes anything intended to improve function beyond the normal range.

  Both requests A and B present situations where the literal application of these clauses leads to unsatisfiable conditions.

  **Request A:**
  - An 11-year-old girl, implanted at age 3, has a failed internal electrode array.
  - The original device is no longer manufactured. The current device is better (improved speech perception in noise, wireless streaming, compatibility with modern scanners).
  - The family argues: a child implanted today gets the current device as medically necessary, so why is it an upgrade for her?

  **Request B:**
  - A 49-year-old man with adult-onset bilateral sensorineural loss.
  - He does not meet our strict audiometric thresholds (which are outdated) and gets little benefit from hearing aids.
  - An implant would improve his hearing significantly (though not to normal) and beyond what hearing aids can offer.

  The core issues:
  1. **In Request A:** The replacement clause requires restoring to the previous function, but the old device is obsolete. The new device is better, but the policy excludes improvements beyond the normal range. However, the family's consistency argument is strong: we are giving the new device to children as medically necessary, so denying it as an "upgrade" for this child is inconsistent.

  2. **In Request B:** The patient does not meet the strict thresholds for medical necessity under our policy, but the policy's thresholds are outdated. The implant would provide significant improvement (though not to normal) and is clearly therapeutic for him.

  Colleagues' positions:
  - Colleague 1: Fund what improves hearing (abandon therapy/enhancement distinction).
  - Colleague 2: Deny A because of precedent (if we approve, we commit to funding every future upgrade for all current implant users over the next decade).

  **My Approach:**
  I aim to:
  - Approve both requests, but with conditions that address the precedent and consistency concerns.
  - Confront the family's argument in A head-on by redefining "restore to previous function" in a way that allows for technological evolution without opening the floodgates to non-therapeutic upgrades.
  - Update the policy language to be forward-looking and applicable as technology improves.

  **Draft Opinion:**

  ---

  **OPINION ON REQUESTS A AND B FOR AUDITORY PROSTHESES COVERAGE**

  **Introduction:**
  The Committee is presented with two requests that expose ambiguities in our coverage policy for auditory prostheses. The policy, designed for a static technological environment, fails when technology advances and when our definitions become outdated. I recommend approval of both requests, but with conditions that also necessitate an update to our coverage language to prevent recurrent problems. Below, I address each request, the arguments raised, and propose revised policy language.

  **Disposition for Request A: Approve, with Conditions**
  We should approve the replacement of the failed internal device with the current model. However, the approval is contingent on the following conditions:
  1. The replacement device must be the least expensive model that meets the medical necessity criteria for a new implantee with the same condition today. (In this case, that is the current standard model.)
  2. The device is provided only because the original device is obsolete and no longer available. If a functionally equivalent device (i.e., one that restores the same level of function without the additional features) were available, it would be required.

  *Confronting the Consistency Argument:*
  The family correctly points out that the same device we call medically necessary for a new implantee is being denied as an "upgrade" for their child. This is indeed inconsistent. Our policy must recognize that the standard of care evolves. What was state-of-the-art at the time of the original implant is no longer available. Therefore, the replacement must use the current standard of care for a patient with the same condition. This does not constitute an upgrade for enhancement, but rather a necessary adaptation to technological progress. The additional features (e.g., wireless streaming) are incidental to the device's core function and are part of the current standard. We are not approving every feature for its own sake, but because the device as a whole is now the minimum standard for restoring hearing function.

  *Addressing Precedent Concerns:*
  Approving this request does not commit us to funding every future upgrade. We are only replacing a failed device with the current medically necessary standard at the time of replacement, and only when the original device is obsolete. This is not a free upgrade: if the original device were still available, we would require it. Going forward, we can define a replacement policy that allows for the current standard when the original is obsolete, but does not allow "upgrading" to a newer model when the original is still functioning or when a functionally equivalent device exists. This prevents members from demanding the latest model arbitrarily.

  **Disposition for Request B: Approve, with Updated Criteria**
  We should approve the implant for this patient. However, we must update our audiometric thresholds to align with current clinical standards. The approval is conditional on:
  1. The patient meeting the updated, evidence-based audiometric thresholds (which I propose we adopt immediately, as detailed below).
  2. The implant being the only viable option to provide significant functional improvement, as hearing aids have failed.

  *Reasoning:*
  Our current thresholds are outdated and stricter than prevailing practice. This patient falls just short of our thresholds but has a condition that would be covered under updated standards. The implant is not intended to provide supernormal hearing but to restore function to a level that is typical for a person without hearing impairment, given the limitations of the technology. Since the implant cannot restore to the normal range (as defined by unaided hearing), we are not enhancing beyond normal but providing the best available restoration. The exclusion of enhancement beyond the normal range is preserved, but we are correcting an outdated definition of the threshold for medical necessity.

  **Proposed Revised Coverage Language:**
  To prevent such quandaries in the future, I propose replacing the current clauses with the following:

  1. **Medical Necessity for Initial Implant:** The plan pays for an auditory prosthesis when, due to bilateral severe-to-profound sensorineural hearing loss, the member cannot achieve functional hearing within the normal range (as defined by age-adjusted unaided audiometric thresholds) with hearing aids, and the prosthesis is expected to restore the member to a level of function that is typical for a person without hearing impairment, given the current capabilities of the technology. The specific audiometric criteria shall be updated every three years to reflect prevailing clinical standards.

  2. **Replacement of a Malfunctioning Device:** The plan pays to replace a malfunctioning device if the device cannot be repaired. The replacement device must restore the member to the level of function previously achieved, or, if that device is obsolete and no longer available, to the current standard of care for a new implantee with the same condition. The replacement device must be the least expensive model that meets the current standard of care. Features that are not medically necessary (e.g., cosmetic, convenience, or performance-enhancing beyond the standard functional restoration) are excluded.

  3. **Exclusion for Enhancement:** The plan does not cover any device or feature primarily intended to improve function beyond the normal range of unaided hearing or beyond the level of function that is typical for a person without hearing impairment. This exclusion does not apply to features that are integral to the current standard of care for auditory prostheses, even if they provide additional benefits (e.g., wireless connectivity for classroom use).

  *Rationale for Revised Language:*
  - The medical necessity criterion is tied to the inability to achieve functional hearing within the normal range with hearing aids, and the thresholds are regularly updated to avoid obsolescence.
  - The replacement clause allows for technological evolution by permitting the current standard when the original is obsolete, but constrains cost by requiring the least expensive model that meets the standard and excluding non-medically necessary features.
  - The enhancement exclusion is preserved but clarified to avoid penalizing standard features that come with technological progress.

  **Addressing the Colleagues' Positions:**
  - *Colleague 1 (fund what improves hearing):* This approach is pragmatic and patient-centered. However, without boundaries, it could lead to covering enhancements. The revised language I propose captures the core of this idea (funding what is therapeutic) while setting clear limits to prevent abuse.
  - *Colleague 2 (deny A due to precedent):* The concern about aggregate cost and precedent is valid. However, denying this request would be inequitable and inconsistent. The revised replacement policy I propose limits the precedent: we are not committing to funding every upgrade, only to providing the current standard when the old device is obsolete and unavailable. The cost control mechanisms (least expensive model, exclusion of non-medical features) will contain aggregate costs.

  **Conclusion:**
  I recommend approving both requests, conditional on the specific provisions outlined. Further, I urge the Committee to adopt the revised coverage language to ensure our policy remains equitable, consistent, and sustainable as technology advances.

