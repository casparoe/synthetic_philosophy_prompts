prompt: |-
  My brother was diagnosed last year with a hereditary adult-onset condition for which there is no treatment, and I am now deciding whether to have predictive testing myself. My genetic counsellor has been careful to insist the decision is entirely mine, but I want to know whether my reluctance survives scrutiny, so I turned to decision theory: Good's theorem on the value of information appears to establish that for an agent with coherent degrees of belief and stable utilities, free information can never have negative expected value. Two features of my case seem to block the obvious escapes — the test costs me nothing, and its result would bear directly on an act I have not yet performed, since my partner and I are undecided about conceiving and would consider embryo screening if I knew my status. That leaves me with the conclusion that declining the test is a preference I have simply failed to recognise as inconsistent with my own probabilities and utilities, and my question is therefore how to argue myself out of it. Before offering that argument, please assess whether the inference is legitimate at all: what does the non-negativity result actually assume, how strong is its conclusion, and which of those assumptions is doing the work in my case? I would also like to know whether it says anything about timing, since nothing I have read seems to distinguish testing now from testing in five years. If some assumption fails or the conclusion is weaker than I have taken it to be, tell me precisely where the reasoning breaks and what remains true about the rationality of choosing not to know; I would rather not settle a decision of this weight on a theorem that does not reach it.
reasoning: |-
  Okay, the user is dealing with a really tough situation. Their brother was diagnosed with a hereditary adult-onset condition, and they're considering whether to get predictive genetic testing themselves. They've talked to a genetic counselor, who emphasized that the decision is entirely personal, but the user is turning to decision theory for clarity. Specifically, they're referencing Good's theorem on the value of information, which suggests that free information should never have negative expected value. They're wondering if their reluctance to get tested is irrational based on this theorem.

  First, I need to unpack Good's theorem properly. The user mentioned that the test is free and the information affects a future decision—whether to conceive and consider embryo screening. So, the obvious exceptions to Good's theorem (cost or irrelevance) don't apply here. They feel that declining the test must be inconsistent with their beliefs and utilities. But is that really the case?

  Let me recall the assumptions of Good's theorem. It assumes coherent degrees of belief (probabilities), stable utilities, that the information is cost-free, and that it pertains to future decisions. The theorem states that under these conditions, the expected value of information (EVPI) is non-negative. But does that mean always taking the test is rational? Not necessarily. The theorem says that, on average, information doesn't hurt, but it doesn't force you to act. It’s about expectation, not actual outcomes. So, even if EVPI is non-negative, the user might still choose not to test if the potential downsides are significant enough in their personal context.

  The user brought up an important point about timing. They mentioned testing now versus five years later. Good's theorem doesn't address timing. The value of information can change over time. For instance, if they delay testing, their circumstances might change—maybe they’re not ready to make reproductive decisions now, but could be later. If they test now, the information might cause prolonged anxiety without immediate utility. Delaying could be rational if the information becomes more relevant later.

  Another key point is the distinction between instrumental and intrinsic value of information. Good's theorem focuses on instrumental value—how information helps in making better decisions. But the user might have intrinsic disvalue from knowing, like psychological distress. The theorem doesn't account for that. Even if the test is free monetarily, the emotional cost isn't zero. If knowing their status causes significant distress, that could be factored into utilities. But they need to ensure they're not double-counting. For example, if the distress affects future decisions, it should be part of the decision model. But if it's a direct disutility just from knowing, that’s a separate negative utility.

  The user might also have state-dependent utilities. Their values could change based on the outcome. If they test positive, they might value things differently than if negative. Good's theorem assumes stable utilities, but in reality, knowing their status might alter what they care about. For example, a positive result could shift their focus to managing risk, affecting their overall life satisfaction. That’s a deviation from the theorem's assumptions.

  They mentioned considering embryo screening if they know their status. So, the information directly influences a decision. But what if they're not ready to make that decision yet? If they test now but aren't prepared to act on it, the information might not be useful immediately. Delaying the test until they're ready to decide could prevent unnecessary anxiety. That makes sense from a practical standpoint.

  The user is looking for an argument to convince themselves to get tested. But maybe they don't need to. Their reluctance might be rational. They need to evaluate their utilities honestly. If the psychological burden of knowing is high, even with potential benefits, avoiding the test could be consistent with maximizing expected utility. The theorem doesn't force them to test; it just says that, on average, information helps. But averages don't dictate individual cases. If the variance is high or the downside risks are severe for them personally, declining could still be rational.

  I should also consider the no-treatment aspect. Since there's no treatment, the main utility is in reproductive decisions and psychological preparation. But the user might value hope or current peace of mind more than future certainty. That’s valid. They should assess how much not knowing affects their decision-making. If they’d proceed with conception regardless, testing might not change their actions, making the information less valuable.

  In summary, the key points are: Good's theorem assumes stable utilities and no intrinsic costs, which might not hold. Timing matters because the value of information is context-dependent. And the theorem doesn't account for emotional disutility. The user's reluctance could stem from unaccounted factors in their utility function, making their preference rational. They need to reflect on what they truly value and how knowing or not knowing impacts their well-being beyond just decision-making.
answer: |-
  Your reasoning is admirably precise, but the inference that declining the test *must* be inconsistent with your probabilities and utilities misinterprets the strength and scope of Good's theorem. Let's dissect the assumptions, identify where they might fail in your case, and clarify what remains rational.

  ### 1. **Good's Theorem: Assumptions and Limitations**
     - **Core Assumptions**:
       - **Coherent Beliefs**: You have well-defined prior probabilities (e.g., your risk of having the gene).
       - **Stable Utilities**: Your valuations of outcomes (e.g., having a child with/without the condition, knowing your status) don’t change based on the test result itself.
       - **Costless Information**: The test is free (no financial/time burden).
       - **Instrumental Value Only**: Information is valued solely for improving future decisions (e.g., embryo screening).
       - **Decision Flexibility**: You can freely choose actions based on the test result.
     - **Conclusion**: Under these assumptions, the *Expected Value of Perfect Information (EVPI)* is non-negative. Information never *expects* to harm you.

     **Where Your Case Challenges the Assumptions**:
     - **Stable Utilities?**  
       The theorem assumes utilities are fixed, but learning your status may *intrinsically alter your well-being*. For example:
       - Knowing you carry the gene could cause chronic anxiety, even if it improves reproductive decisions.
       - Not knowing might preserve hope or current quality of life.  
       *This is the most likely failure point*. If "not knowing" has *positive intrinsic utility* (relief, focus on the present), or knowing has *negative intrinsic utility* (distress), these psychological states violate "stable utilities." Good's theorem ignores intrinsic value/disvalue of knowledge itself.
     
     - **Instrumental Value Only?**  
       While the test informs reproductive choices, its *timing* matters. Testing now might force you to confront results before you’re emotionally ready to act, whereas testing later (e.g., when actively trying to conceive) could:
       - Reduce prolonged anxiety.
       - Align with your readiness to use the information.  
       Good's theorem doesn’t address *when* to acquire information—only that it *eventually* has non-negative value. Delaying can be rational if utility depends on context.

     - **Decision Flexibility?**  
       If learning your status *constrains* your choices (e.g., feeling obligated to use embryo screening if positive), this isn’t captured. The theorem assumes you freely optimize after testing.

  ### 2. **Why Declining the Test May Still Be Rational**
     - **Intrinsic Disutility of Knowledge**:  
       Suppose your utilities include:  
       - High cost from anxiety if you test positive (even if embryo screening avoids an affected child).  
       - Moderate benefit from peace of mind if you delay testing.  
       If the expected psychological harm outweighs the reproductive decision benefits, declining maximizes expected utility. *This doesn’t violate coherence*; it incorporates realistic utilities.
     
     - **Option Value of Waiting**:  
       Testing now commits you to living with the result indefinitely. Waiting preserves the "option" to test later when:  
       - Reproductive decisions are imminent (increasing instrumental value).  
       - You’re better equipped emotionally.  
       - Medical advances (e.g., new screening/treatment) might alter the stakes.  
       This is rational under *dynamic decision theory*: delaying information can have positive value if conditions improve.

     - **Ambiguity Aversion**:  
       Good's theorem assumes sharp probabilities. If your risk estimate feels highly ambiguous (e.g., "I could be 10% or 50% at risk—I can't quantify it"), ambiguity-averse agents may rationally avoid information.

  ### 3. **What Good's Theorem *Does* Tell You**
     - **Instrumental Benefit is Non-Negative**:  
       If we *exclude* psychological costs and focus *only* on reproductive outcomes:  
       - Testing weakly improves embryo screening decisions.  
       - Declining *solely* for instrumental reasons (e.g., "It won’t change my choice") *would* be inconsistent if your priors/utilities are coherent.  
       But your reluctance isn’t instrumental—it’s likely driven by intrinsic or temporal factors.

     - **No Free "Irrelevance" Escape**:  
       You’re correct that the test isn’t irrelevant (it affects embryo screening). But irrelevance isn’t the only escape hatch; intrinsic costs and timing dominate here.

  ### 4. **How to Argue Yourself Out of Reluctance (If You Choose To)**
     If you conclude your reluctance *is* driven by inconsistent beliefs (e.g., overestimating psychological harm), consider:
     - **Reframe Uncertainty**:  
       Not knowing may feel safer, but it often causes "ambiguous loss"—chronic stress from uncertainty. Testing could resolve this.
     - **Precision in Utilities**:  
       Quantify outcomes (e.g., "10 years of anxiety if positive" vs. "lifetime regret if I pass the gene"). If psychological costs are lower than you fear, testing may dominate.
     - **Control Over Actions**:  
       Remind yourself testing doesn’t force action. You can still choose not to conceive or use screening, but now with clarity.
     - **Value for Others**:  
       The information may help siblings/cousins assess their own risks (if you share results).

  ### Key Takeaway
  **Your reluctance is likely rational** because Good's theorem ignores the intrinsic emotional cost of knowledge and the value of waiting. Declining the test isn’t inconsistent unless:  
  - You deny any intrinsic disutility from knowing your status, *and*  
  - You’re certain delaying won’t improve instrumental value.  

  If you *want* to overcome reluctance, focus on:  
  (1) Whether your fear of distress exceeds its likely reality,  
  (2) Whether waiting truly preserves options or just defers necessary clarity.  

  This isn’t a failure of rationality—it’s a nuanced calibration of utilities. Revisit your genetic counselor to discuss psychological utilities and timing; this is precisely where decision theory needs human context.
