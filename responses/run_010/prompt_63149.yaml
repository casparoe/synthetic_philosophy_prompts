prompt: |-
  I'm a staff engineer and I own our incident review process. We do what we call blameless postmortems: after an outage, the writeup explains things in terms of systems, tooling and incentives, nobody's name goes in the contributing factors section, and the framing is that whoever shipped the bad config did the reasonable thing given what they could see at the time. But at the same company we hand out public shoutouts to the person who stayed up until 3am fixing that same outage, we stack-rank everyone in the review cycle and put people on improvement plans for behavior we'd just called reasonable in the postmortem, and if someone clicks a phishing link during a security incident there suddenly is a name attached and there are consequences. So it feels like we're running two different accounts of who's responsible for a bad outcome and picking between them based on whether the damage landed on the company or on a customer.

  Can you spell out what the blameless postmortem actually commits you to? Specifically, does it need the claim that nobody could have done otherwise, or does it survive perfectly well if people have free will and we're just choosing to be kind about it? Then tell me which of the things I described above are flatly inconsistent with it versus merely awkward, and whether one coherent story can cover all of them.

  One more thing. The practice seems built to make sure nobody feels guilty or ashamed after breaking production, on the theory that its just going to make people hide stuff. But the best engineers I know visibly feel awful afterwards and that awfulness seems to be exactly what makes them careful next time. Is there a version of this that keeps the guilt and drops the shame, or is that a distinction without a difference when your manager is sitting in the room? What would our process have to look like if we decided guilt was a feature to cultivate rather than a risk to engineer away?
reasoning: |-
  Okay, the user is a staff engineer responsible for their incident review process. They’re grappling with a contradiction in their company’s approach. On one hand, they promote blameless postmortems that focus on systemic factors without naming individuals. On the other, they publicly reward heroes who fix outages, use stack-ranking in reviews, and impose consequences for security lapses like phishing. The user is questioning whether these practices are inconsistent and if they can be reconciled under one coherent philosophy.  

  First, I need to break down what "blameless" actually means. It’s not about denying human agency but shifting focus from individual fault to systemic flaws. The idea is that people act based on their environment, tools, and incentives. So, the postmortem asks, "Why did this action make sense at the time?" rather than "Who messed up?"  

  The user’s company seems to have a split personality. The hero shoutouts and stack-ranking undermine the blameless ethos by spotlighting individuals—either as saviors (hero culture) or underperformers (ranking). The security exception is especially jarring because phishing lapses suddenly get personal, even though they could also be framed as training or system failures. That inconsistency suggests the company hasn’t fully committed to blamelessness; they’re applying it selectively.  

  The user also raises a nuanced point about guilt vs. shame. Postmortems try to eliminate shame to encourage transparency, but the user observes that their best engineers feel guilty and that this guilt drives future caution. That’s interesting—it implies guilt (responsibility) can be productive, while shame (personal inadequacy) is toxic. Maybe the process could reframe guilt as collective responsibility: "We failed, and here’s how we improve," rather than "I failed, and I’m bad."  

  To reconcile the contradictions, the company would need to align incentives. If they reward heroics, they’re incentivizing firefighting over prevention. If they stack-rank, they’re forcing competition that discourages vulnerability. A truly blameless culture would reward reliability work (like writing tests or improving monitoring) as much as incident response. For security, they’d treat phishing as a training gap, not a personal failing.  

  The user’s deeper struggle might be cultural: their org wants psychological safety but clings to individual performance metrics. That’s a hard fix. They might need to lobby leadership to tie bonuses/prestige to system improvements, not just firefighting. And for guilt to be "cultivated," postmortems could emphasize shared ownership—e.g., "We all let this happen, so we all fix it."  

  In short:  
  - **Inconsistencies**: Hero culture, stack-ranking, and security blame directly clash with blamelessness.  
  - **Awkward but fixable**: If security lapses were treated as systemic (better training, phishing simulations), they could fit.  
  - **Guilt vs. shame**: Guilt can be reframed as collective responsibility. Shame is the real enemy.  
  - **Path forward**: Align rewards with prevention, ditch stack-ranking, and make accountability about systems, not people.
answer: |-
  You've hit on a fundamental tension in modern engineering culture – and your observations are spot-on. Let's dissect this systematically.

  ### What "Blameless Postmortem" Actually Commits To
  The core commitment is **not to individual determinism ("nobody could have done otherwise")**, but to:
  1. **Systems-Thinking**: Human error is a symptom, not a cause. The goal is to identify *why* actions made sense given the context.
  2. **Psychological Safety**: People must feel safe to share mistakes without fear of punishment or humiliation.
  3. **Learning Focus**: The purpose is improvement, not judgment.
  4. **Shared Accountability**: Responsibility lies with the organization for creating the conditions that led to the incident.

  **It survives perfectly with free will**. The claim is: "Given the information, incentives, tools, and pressures this person had, their action was *understandable* (not inevitable). We need to change the system so the understandable action isn't harmful." It's about **contextual rationality**.

  ### Inconsistencies in Your Practices
  | **Practice**               | **Inconsistent?** | **Why**                                                                                               |
  |----------------------------|-------------------|-------------------------------------------------------------------------------------------------------|
  | **Public Hero Shoutouts**  | **Flatly Inconsistent** | Rewards individual heroics, incentivizing firefighting over prevention. Undermines systemic focus by spotlighting individuals as saviors. |
  | **Stack-Ranking & PIPs**   | **Flatly Inconsistent** | Directly ties individual performance to incidents deemed "reasonable" in postmortems. Creates fear of being ranked lower for participating in incidents. |
  | **Naming in Security Incidents** | **Flatly Inconsistent** | Selective blame violates psychological safety. If phishing is a "human error," it should be analyzed systemically (training gaps, missing MFA, alert fatigue). |
  | **Postmortem "No Names" Rule** | Consistent (on surface) | But rendered hypocritical by other practices. The inconsistency breeds cynicism.                         |

  ### Can a Coherent Story Cover This?
  **No, not with current practices.** You have:
  - **Incident Phase:** "No one is at fault; it's the system!" (Blameless)
  - **Consequence Phase:** "Individuals *are* accountable!" (Hero worship/PIPs/blame)
  - **Security Exception:** "Blameless... unless it's *this* type of error."

  This schizophrenic narrative tells engineers: *"We pretend it's systemic when we write reports, but we absolutely hold individuals responsible when it affects careers or involves security."*

  **A Coherent Story Is Possible If:**  
  1. **Accountability is Reframed:** Shift from "Who failed?" to "Who *owns* improving this subsystem?" (e.g., "SRE Team owns improving deployment safety" not "Alice caused the outage").  
  2. **Consistency Across Domains:** Security incidents get the same systemic analysis ("Why did training fail? Why did detection miss this?").  
  3. **Reward Prevention, Not Heroics:** Publicly celebrate engineers who *prevent* incidents via system improvements.  
  4. **Eliminate Stack-Ranking:** Replace with team-based goals tied to reliability metrics.  

  ### Guilt vs. Shame: Cultivating Responsibility
  You're identifying a critical nuance:
  - **Guilt:** "I *did* something bad." (Focus on action) → Can be motivational.  
  - **Shame:** "I *am* bad." (Focus on self) → Leads to hiding, defensiveness.  

  **Blameless postmortems aim to eliminate *shame*, not necessarily *guilt*.** Here’s how to cultivate productive guilt while avoiding shame:

  1. **Separate the Action from the Person:**  
     *Postmortem Language:* "The deployment process lacked safeguards against config drift," not "Alice made a mistake."  
     *Result:* Alice feels guilt ("I contributed to this"), not shame ("I'm incompetent").

  2. **Channel Guilt into Agency:**  
     *Process Change:* End postmortems with "Ownership Commitments": "Alice volunteers to lead the working group on config validation tools."  
     *Result:* Guilt transforms into ownership of the solution.

  3. **Normalize Fallibility:**  
     *Leader Vulnerability:* Managers share their own past mistakes: "I pushed a bad query years ago – here’s how we fixed the system."  
     *Result:* Reduces shame, normalizes guilt as part of growth.

  4. **Reframe "Carefulness":**  
     *Problem:* Relying on guilt-induced hyper-vigilance is brittle.  
     *Solution:* Build systems that make errors *hard* (e.g., automated checks). Say: "We want your brain for design, not remembering every checkbox."

  ### What Your Process Needs to Cultivate "Productive Guilt"
  - **Manager Training:** Teach them to say: *"I know you feel awful – that shows you care. How can we ensure the *system* catches this next time?"*  
  - **Postmortem Addendum:** Include a "Personal Learnings" section (optional/shared anonymously): *"I learned I should double-check configs during high-stress deployments."*  
  - **Guilt-Reduction Mechanisms:** After action items are assigned, explicitly state: *"We consider this incident closed and resolved for all involved."*  
  - **Measure Psychological Safety:** Regularly survey teams: *"If you make a mistake, can you admit it without fear?"*

  ### The Bottom Line
  Your current process is **psychologically unsafe** because blamelessness is performative. The stack-ranking, hero culture, and security exceptions reveal a **fundamental belief in individual culpability**. This erodes trust faster than any outage.

  **To fix it:**  
  1. **Abolish stack-ranking** for reliability work.  
  2. **Redirect hero shoutouts** to prevention work (e.g., "Pat shipped automated rollbacks!").  
  3. **Apply blameless rigor to security** (phishing is a training/tech failure).  
  4. **Let guilt be a driver**, not a weapon – channel it into systemic fixes owned by volunteers.  

  The goal isn’t to absolve people of responsibility, but to shift accountability *upward*: Engineers are responsible for **admitting mistakes and fixing systems**; leadership is responsible for **creating conditions where that’s safe and rewarded**. Anything less is theater.
