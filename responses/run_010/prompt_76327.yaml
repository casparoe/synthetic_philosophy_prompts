  For the model answer, I'll construct a 900-word argument defending the scheme's permissibility while acknowledging its tensions. The core should be that imprisonment's inherent coercion makes the pilot's additional pressure qualitatively similar to standard parole processes. The answer must demonstrate how this differs from Norway's outcome-focused model.

