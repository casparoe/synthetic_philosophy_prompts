prompt: |-
  I'm producing a short podcast series on the origins of the Cold War, and there's a pattern in the literature I can't name. Every "who started it" argument turns on when the clock starts, and nobody ever argues about that part. Start in 1945 and Soviet moves into Poland and northern Iran look like the opening of the thing; start in 1918 with the Allied intervention in Russia and the same events look like a late reply in a game someone else opened; start in 1917 and the question changes shape entirely. Same trick with WWI — 1914, 1912, 1870, pick your start and you've picked your culprit. All the people doing this are careful historians and none of them defends the start date, its just assumed in the first sentence and never touched again.

  Does this have a name? I know about the security dilemma and the orthodox/revisionist/post-revisionist thing, but those are positions inside the debate, not a description of this move. If nothing established fits, coin one and define it, and give me a case that sits right at the boundary so I can see where the edges are. A bare label won't help me — I need to know what this is and what it isn't.

  Exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user is producing a podcast on Cold War origins and has noticed a pattern in historical literature where arguments about "who started it" depend entirely on when the historian sets the start date. They point out that historians don't defend their chosen start dates - they just assume them and build their narratives from there, leading to completely different conclusions.

  This pattern applies to both the Cold War and WWI examples they've given. They're familiar with concepts like the security dilemma and historiographical schools, but need something that specifically describes this "start date framing" phenomenon. They want me to name this pattern if it exists, or coin a term if necessary, with clear boundaries and an edge case example.

  I need to provide exactly five numbered points - no introduction or conclusion - each being one or two sentences. The response should be precise and educational, helping them understand what this is and isn't.

  For point one, I'll define the core concept. Since there's no established term, I'll call it "chronological framing" - the implicit selection of a start date that shapes the entire narrative.

  In point two, I'll explain what this is: an analytical move where historians embed causality in their timeline choice without explicitly justifying it, making their interpretation dependent on that unstated premise.

  For point three, I'll clarify what it isn't - it's not about taking sides in debates like orthodox/revisionist views, or structural concepts like the security dilemma; it's about the foundational act of periodization.

  Point four should give an edge case example: the 1944 Warsaw Uprising, where choosing between 1944 or 1945 as the start date blurs responsibility between Soviets and Western Allies, showing how the framing determines culpability.

  Finally, point five will contrast it with established practices: unlike explicit periodization debates (e.g., "long 19th century"), this is an unacknowledged assumption that remains invisible in the argument.

  This should give them a clear framework to discuss in their podcast, highlighting how historical narratives can be manipulated through silent timeline choices.
answer: |-
  Here are five numbered points addressing your query:

  1.  **This pattern is "Chronological Framing":** It's the unstated selection of a specific historical start date that inherently defines the actors, context, and primary causal sequence, thereby predetermining the narrative of responsibility ("who started it").
  2.  **It functions as an embedded causal assumption:** By choosing when the "clock starts," the historian implicitly identifies the first significant *action* or *condition* deemed relevant, embedding the root cause within the chosen timeframe without explicit defense of that choice.
  3.  **It is distinct from historiographical schools:** Unlike orthodox/revisionist/post-revisionist positions (which debate interpretations *within* a generally agreed timeframe) or the security dilemma (a theoretical concept explaining interactions), chronological framing concerns the foundational act of *periodization* itself.
  4.  **A boundary case is the 1944 Warsaw Uprising:** Framing the Cold War start in mid-1944 makes the Uprising a key early event; Soviet refusal to aid the Poles appears as aggressive intent, while Western inability to help seems like abandonment. Framing it post-Yalta (Feb 1945) minimizes its significance, pushing the "start" onto later Soviet actions in Poland, making responsibility clearer but potentially obscuring earlier tensions.
  5.  **It contrasts with explicit periodization debates:** Unlike arguments about, say, the "Long 19th Century" (1789-1914) which are *about* defining eras, chronological framing in "origins" debates uses the start date silently as an unexamined axiom that structures the entire argument about causation and blame.
