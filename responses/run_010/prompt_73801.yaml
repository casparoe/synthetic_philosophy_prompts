  For item 1, I'll argue how the Library functions as a formal system. The inhabitants are trapped because they're confined to mechanical searches within the fixed rules of the Library's structure, unable to recognize that their quests are as futile as deriving MU. This parallels Hofstadter's idea of being stuck inside a system.

  For item 2, the key moment is when the narrator describes the futile search for the Man of the Book. This reveals the inhabitants' failure to "jump out" - they keep looking for meaning within the system rather than recognizing the inherent limitations of the Library's design.

