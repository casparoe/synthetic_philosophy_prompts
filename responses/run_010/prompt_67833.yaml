prompt: |-
  I write items for a benchmark that scores how well language models continue short pattern prompts, and roughly weekly one ships that turns out to be ill-posed: a model produces an answer we mark wrong, and its defenders exhibit a rule that fits every term we displayed and yields that answer instead. Our adjudication is currently an argument about naturalness that ends when the most senior person in the room tires of it.

  Write the pre-publication review procedure I can hand to reviewers with no philosophy background and about twenty minutes per item: the tests to run in order, what passing each looks like, the families of rival rule we are obliged to construct before shipping and the point at which we are entitled to stop constructing them, how to repair an item that fails, and — the part I care about most — where the procedure has to concede that the verdict rests on what a trained population of respondents does rather than on anything present in the item. Ground it in what the rule-following debate around Kripke's Wittgenstein actually delivers about why a finite list of examples underdetermines the rule, and flag any step that only looks mechanical. Note explicitly what the procedure cannot do.

  Then run it on three disputed items and give me a disposition for each: 3, 5, 7, __ (we intend 11 as the next prime; 9 on the odds rule keeps coming back); 1, 2, 4, 8, 16, __ (we intend 32; a respondent answered 31 and insists on a geometric rule); and J, F, M, A, M, J, __ (we intend J). Tell me which we should kill outright, even if that costs us an item the team likes.

  If you think the request is itself confused — that no procedure can render such items determinate, or that I have misdescribed what the skeptical problem is about — say so plainly and tell me what the honest fallback would be, rather than handing me a checklist that papers over the difficulty.
reasoning: |-
  Okay, let me tackle this user's problem. They create benchmark items for language models, but some prompts are ambiguous, leading to disputes when models give unexpected answers. The current resolution method is subjective and exhausting. They want a review procedure grounded in Kripke's Wittgenstein, which shows that finite examples can't pin down a single rule.

  First, I need to recall Kripke's key points. The rule-following paradox demonstrates that any finite set of examples can support multiple rules. For instance, "add 2" vs. "add 2 until 1000" for the sequence 2,4,6. The user mentioned examples like primes vs. odds or months vs. initial letters. Their challenge is to design a procedure that acknowledges this underdetermination without getting stuck in endless philosophical debates.

  The user needs a practical checklist for reviewers with limited time and no philosophy background. The procedure must include tests for rival rules, repair steps, and when to defer to human judgment. Crucially, it should explicitly state where natural language interpretation by respondents is necessary.

  I should structure the procedure step-by-step. Start with quick checks like ambiguity in the prompt itself. Then test for obvious rival rules, considering families like arithmetic changes or cultural conventions. Define when to stop—maybe after checking three plausible rivals. Highlight steps that seem mechanical but aren't, like judging "naturalness," which actually relies on human intuition.

  The procedure must admit its limits. When rival rules are equally natural, the item is flawed unless survey data shows a strong consensus. The user cares most about this fallback to empirical data.

  Now, applying it to the examples. For 3,5,7: Primes are intended, but odds are a rival. Both fit the sequence. Is one more natural? Maybe primes, but odds are simple too. Survey might show primes are expected, but it's debatable. Flag as high-risk.

  For 1,2,4,8,16: Intended 32 (doubling), but 31 fits a polynomial rule. The polynomial is less intuitive, so it might pass if reviewers agree it's unnatural. But need to check if other rules exist.

  For J,F,M,A,M,J: Months intended, but initial letters of names (John, Fred, etc.) is a rival. Months are culturally ingrained, so likely to pass. Survey could confirm, but it's probably safe.

  The prime vs. odds case is the trickiest. Since both rules are simple and common, the item should be killed to avoid recurring disputes. Even if the team likes it, the ambiguity is too high.

  The user might think a procedure can eliminate ambiguity, but Kripke shows it's impossible. The honest fallback is accepting that some items require human judgment surveys. The procedure can't make items fully determinate; it only manages ambiguity pragmatically.

  In summary, the procedure should guide reviewers to identify and evaluate rival rules, then rely on surveys when necessary. The prime/odds item must be cut despite team preference, as it's inherently ambiguous. Acknowledging the philosophical limits is crucial to avoid false confidence in the checklist.
answer: |-
  Here is a pre-publication review procedure grounded in Kripke's Wittgenstein rule-following paradox, designed for practical use by non-philosophers. It explicitly accepts the core problem: **a finite list of examples *cannot* logically determine a single unique rule.** Our goal is *not* to find the "one true rule" (impossible), but to minimize ambiguity to a level where the intended rule is the overwhelmingly "natural" choice for the target population, or flag the item as unreliable.

  **The Core Problem (Kripke/Wittgenstein Simplified):**
  Any finite sequence (like "3, 5, 7") can be extended in infinitely many mathematically valid ways. The "+2" rule (odds) fits just as well as the "next prime" rule *based solely on the numbers given*. "Naturalness" isn't inherent in the numbers; it depends on human practices, training, and context. We can never *prove* the intended rule is the only possible one. We can only assess if it's the most salient rule for humans in the intended context.

  **Review Procedure: Item Ambiguity Assessment**

  **Goal:** Determine if the intended rule is sufficiently "natural" (salient, obvious) compared to plausible rivals for the target population (likely educated humans familiar with common patterns). Flag items where significant ambiguity persists.

  **Reviewer Time Budget:** ~20 minutes per item.

  **Required Tools:** Pencil/paper, basic calculator (or mental math), access to simple sequence solvers (like OEIS for numbers, but use cautiously!), and *later*, potentially survey tools.

  **The Procedure:**

  1.  **Check Prompt Clarity & Obviousness (Mechanical-ish - 5 mins):**
      *   **Test:** Read the prompt aloud. Is the format standard? Are terms clearly separated? Is there any typo or glaring ambiguity *within the prompt itself* (e.g., inconsistent delimiters, unclear start)?
      *   **Pass:** Prompt is cleanly formatted, terms are unambiguous symbols/words. No obvious surface errors.
      *   **Fail:** Repair formatting/typos immediately. If the *terms themselves* are ambiguous (e.g., "J" could be July, June, January, or a variable), kill the item or redesign fundamentally.
      *   **Limitation:** This catches only superficial errors, not rule ambiguity.

  2.  **Generate Plausible Rival Rules (Core Step - 10 mins):** *This is where Kripke bites.*
      *   **Test:** Systematically brainstorm 2-4 alternative rules that fit *all* given terms *exactly*. Consider these families:
          *   **Arithmetic/Geometric:** Constant difference (+2), changing differences (+2, +2, +4...), constant ratio (x2), changing ratios.
          *   **Subsets:** Primes, odds, evens, squares, cubes, triangular numbers, Fibonacci-like.
          *   **Positional/Indexing:** Terms based on their position (n, n², 2^n).
          *   **Polynomial Fits:** Can a simple polynomial (linear, quadratic, cubic) fit the points? (Calculate differences: 1st diff, 2nd diff...).
          *   **Lexical/Calendar:** For letters/words: Alphabet position, month names, day names, common acronyms/abbreviations, word initials.
          *   **Contextual:** Does the prompt title/context hint strongly at a domain (math, time, biology)? *But beware:* The prompt *itself* must carry the weight.
          *   **"Bent" Rules:** Simple rules with a trivial exception ("add 2 until 1000, then add 4"). *Only consider these if they feel genuinely plausible and simple, not just contrived.*
      *   **Pass:** The intended rule is clearly the simplest/most common/most natural fit. Plausible rivals are significantly more complex, less common, or feel contrived *for the given sequence length and domain*.
      *   **Fail:** A rival rule exists that is comparably simple, common, or natural to the intended rule.
      *   **Stop Condition:** Stop after identifying 2-4 plausible rivals OR after 10 minutes. You are *not* obliged to find *every* possible rule (impossible), only the most salient plausible ones a *reasonable person* might propose. If you easily find even *one* salient rival, the item likely fails.
      *   **Limitation:** Judging "simplicity," "commonness," and "naturalness" is inherently subjective and cultural. This step *looks* mechanical (listing rule types) but relies heavily on the reviewer's intuition about human salience. It cannot eliminate the underdetermination.

  3.  **Assess Naturalness Gap (Judgment Call - 3 mins):**
      *   **Test:** Compare the intended rule and the rival(s) found in Step 2. Ask:
          *   Which rule requires the fewest "special cases" or complex operations?
          *   Which rule is most likely taught in school for sequences like this?
          *   If you showed *just the sequence* (no context) to 10 colleagues, how many would give the intended answer vs. the rival answer?
      *   **Pass:** The intended rule is overwhelmingly simpler/more natural. The rival feels like a "gotcha" or requires significant mental gymnastics.
      *   **Fail:** The rival is genuinely competitive in simplicity/naturalness. Proceed to Step 4.
      *   **Limitation:** Relies entirely on the reviewer's subjective estimate of population salience. Highly vulnerable to individual bias.

  4.  **Repair or Defer to Population (Fallback - 2 mins):**
      *   **Option A (Repair):** Can the item be fixed *without changing the intended rule*?
          *   **Add a term:** One more term often drastically reduces ambiguity (e.g., adding "11" to "3,5,7" kills the pure odds rule). *Best fix if possible.*
          *   **Add context:** A subtle title ("First Primes", "Time Sequence") or single-word hint. *Use sparingly, can bias the model.*
          *   **Change a term:** Replace an ambiguous term (e.g., change "J" to "Jul" if month is intended). *Risky, may change the rule.*
      *   **Option B (Defer to Population - THE CRUCIAL FALLBACK):** If repair isn't trivial/effective AND plausible rivals exist (Step 2 Fail/Step 3 Fail), **you MUST concede the verdict rests on empirical human response, not the item alone.**
          *   **Action:** Flag the item for **calibration testing**. It cannot ship until tested on a representative sample (e.g., 50+ crowdworkers) with *only* the sequence prompt. Ship only if >90% give the intended answer. *This is where Kripke forces us out of philosophy and into anthropology/psychology.*
          *   **Pass (for publication *after* testing):** Survey shows strong consensus (>90%) for the intended answer.
          *   **Fail (Kill Item):** Survey shows significant disagreement (>10% give a viable rival answer) OR strong consensus for the *wrong* answer. **Kill it.**
      *   **Limitation:** Calibration testing adds cost and delay. It's the only way to resolve true ambiguity grounded in Kripke's point, but it measures human consensus, not logical determinacy.

  **What the Procedure CANNOT Do:**
  1.  **Eliminate Ambiguity:** It cannot make the rule logically unique. Kripke showed this is impossible.
  2.  **Define "Naturalness" Objectively:** This remains culturally and contextually dependent.
  3.  **Guarantee Model Performance:** A model might learn a statistically common but unintended pattern.
  4.  **Replace Judgment:** Steps 2 & 3 require reviewer intuition about human cognition and common knowledge.
  5.  **Resolve Deep Philosophical Disputes:** It provides a pragmatic workflow, not a solution to the rule-following paradox.

  **Review of Disputed Items:**

  1.  **"3, 5, 7, __" (Intended: 11 - Primes)**
      *   **Step 1:** Pass. Clear numerical sequence.
      *   **Step 2:** Plausible Rivals Found:
          *   *Odds (add 2):* 9. Extremely simple, common.
          *   *Primes (intended):* 11. Very common.
          *   *"Numbers not divisible by 2 or 3":* 11 (but 5 is div by... wait no, fits 3,5,7,11). Less simple, but plausible.
      *   **Step 3:** **FAIL.** Odds rule is *at least* as simple and natural as Primes for this short sequence. Both are fundamental concepts. The naturalness gap is very small.
      *   **Step 4:** *Repair?* Adding *one* more term (e.g., "3,5,7,11,\_\_") makes Primes unambiguous (next is 13; odds would require 9, breaking the pattern). *Highly recommended.* If the team refuses to add a term: **Defer to Population.** Survey is mandatory. If survey shows <90% say "11", **KILL IT.** Given the history of disputes, odds (9) *will* keep coming back. **Disposition: Repair (add "11") or Survey. If no repair/survey fails: KILL OUTRIGHT.** (This costs you the item, but it's fatally ambiguous as-is).

  2.  **"1, 2, 4, 8, 16, __" (Intended: 32 - Geometric x2)**
      *   **Step 1:** Pass. Clear numerical sequence.
      *   **Step 2:** Plausible Rivals Found:
          *   *Geometric (x2 - intended):* 32. Very simple, common.
          *   *Polynomial:* The differences are 1, 2, 4, 8. Second differences: 1, 2, 4. Third differences: 1, 2. Not constant. A cubic polynomial *can* fit: f(n) = (n³ - n² + 2n)/2. f(1)=1, f(2)=2, f(3)=4, f(4)=8, f(5)=16, f(6)=**31**. Exists, but complex.
          *   *Powers of 2 (2^{n-1}):* Same as x2. 32.
      *   **Step 3:** **PASS (Conditionally).** The intended rule (x2 / Powers of 2) is vastly simpler and more natural than the polynomial fit (31). The polynomial feels contrived for this sequence; it's solving a puzzle, not recognizing a common pattern. The naturalness gap is large.
      *   **Step 4:** Repair not needed. **Disposition: SHIP AS-IS.** The rival rule exists mathematically but is not salient enough to cause significant ambiguity for humans. (The model answering 31 is likely an artifact of its training data or a fluke, not evidence of a truly competitive *natural* rule).

  3.  **"J, F, M, A, M, J, __" (Intended: J - Months: Jan, Feb, Mar, Apr, May, Jun, *Jul*)**
      *   **Step 1:** **CAUTION.** Single letters are ambiguous (June? July? January? John? Fred?). Passes only if the benchmark context *strongly* implies common sequences (like months). Otherwise, borderline fail.
      *   **Step 2:** Plausible Rivals Found:
          *   *Months (intended):* J(uly). Very common, highly salient.
          *   *First Initials of Common Names:* John, Fred, Mary, Alice, Michael, James, *John* (again?) or *Joseph*. Sequence feels arbitrary, but fits. "James" for J is common.
          *   *First Initials of Random Words (Jelly, Fish, Moon...):* Possible but highly unnatural.
      *   **Step 3:** **PASS.** The Months rule is overwhelmingly dominant for this specific sequence length and pattern (7 terms covering half the year). The "Names" rival exists but is significantly less natural/salient in this context. The naturalness gap is large *if the context implies sequences*. If no context, Step 1 might have failed.
      *   **Step 4:** **Disposition: SHIP AS-IS** (if context implies sequences). If the context is completely neutral, consider a minor repair (e.g., "Mo: J, F, M, A, M, J, __").

  **Conclusion and Honest Fallback:**

  The procedure *cannot* render items logically determinate. Kripke/Wittgenstein showed this is impossible. You *are* misdescribing the problem if you think anything can eliminate the underdetermination inherent in finite examples. The "skeptical problem" is precisely that no fact about you, the examples, or the symbols themselves, can *prove* which rule you meant.

  The honest fallback is **empirical calibration.** The core of your procedure *must* be Step 4: Recognizing when rival rules are salient enough that the item's validity depends entirely on demonstrable human consensus (>90% agreement), not on any inherent property of the sequence. A checklist *can* help systematize the search for rivals and trigger this fallback, but it cannot resolve the underlying indeterminacy. **Kill items where plausible, simple rivals exist *and* empirical calibration isn't feasible or shows insufficient consensus.** Item 1 (3,5,7) is the clearest candidate for killing outright if not repaired, due to the persistent and highly salient rival rule.
