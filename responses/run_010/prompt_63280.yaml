  ### 1. Common Ground: Claims Both Camps Accept

  1. **Aumann's Agreement Theorem Mechanics**: 
     - The theorem assumes a finite state space, a common prior, and partitions for each agent representing their information. 
     - Agents update by conditioning their prior on their information. 
     - If two agents have common knowledge of each other's posterior probabilities for an event, then these posteriors must be equal.

  2. **Type Space Representation**:
     - A type space is a formal model that includes a state space, a prior probability distribution (common prior), and for each agent a partition of the state space (or equivalently, a signal function) that determines the agent's information at each state.

  3. **The Role of the Prior**:
     - The prior is a probability distribution over the state space that represents the beliefs an agent would have in the absence of any private information (or with only the common background information). 
     - It is a piece of bookkeeping that, together with the partition, determines the agent's posterior beliefs via conditioning.

  4. **Testability of the Common Prior Assumption**:
     - From inside an agent's own reasoning, the common prior assumption is not directly testable because an agent cannot access the prior of another agent independently. 
     - However, the assumption has testable implications in the form of no-trade theorems and the impossibility of agreeing to disagree under common knowledge.

  5. **Relaxations of the Theorem**:
     - If priors are not identical but close (e.g., within ε in total variation distance), then common knowledge of posteriors forces the posteriors to be close (within a bound that depends on ε).
     - If we weaken common knowledge to common p-belief (where p is a probability), then the disagreement in posteriors is bounded by a function that goes to zero as p goes to 1.

