  #### 2. Disagreements

  See the table above (reproduced in the final document).

  #### 3. Cruxes

  **Worked Toy Example**:

  - **Setup**: As given.
  - **Common Prior?**: No common prior exists (as shown by the algebraic argument).
  - **Common Knowledge Structure**: The finest common coarsening of the partitions is the discrete partition. Therefore, common knowledge of posteriors for non-trivial events never occurs. This shows that the example fails the common prior condition but also does not allow the agreeing-to-disagree scenario, illustrating that the failure of the common prior does not necessarily lead to common knowledge of disagreement.
  - **Betting Condition**: We constructed a bet (a set of transfers) that is acceptable to both agents at every state and sums to zero. This confirms the absence of a common prior.

  **Interpretation of the Bet**:
  - Camp A: The existence of such a bet indicates that at least one agent is not rational (because a rational agent would not accept a bet that is a sure loss in the aggregate, unless the prior is common).
  - Camp B: The existence of the bet is a mathematical consequence of the lack of a common prior and does not imply irrationality.

  **Redescribability vs Restrictiveness**: 
  - Both camps agree that prior differences can be redescribed as information differences in an expanded state space. However, Camp A sees this as making the common prior assumption non-restrictive, while Camp B sees the common prior as a restrictive condition on the original type space. The disagreement is verbal in that it turns on the scope of the term "information": Camp A includes prior formation in the information structure, while Camp B does not.

  **Improper Priors or Finitely Additive Priors**:
  - Allowing improper priors or finitely additive priors can sometimes represent the conditionals in the toy example (with an improper prior). However, this does not resolve the core disagreement:
    - Camp A sees the common prior as a substantive requirement for shared beliefs and views improper priors as not fulfilling that role.
    - Camp B sees the use of improper priors as a technical fix that still reflects the permissibility of prior choices.

  **Empirical Crux**:

  - **Phenomenon**: Persistent disagreement among well-calibrated forecasters sharing the same public evidence and knowing each other's probabilities.
  - **Camp A Prediction**: If common knowledge of posteriors holds, then such disagreement is evidence of irrationality. Otherwise, it is evidence that common knowledge of posteriors is hard to achieve.
  - **Camp B Prediction**: Persistent disagreement is consistent with rational prior differences. If common knowledge of posteriors holds and disagreement persists, it is evidence against the common prior assumption.
  - **Distinguishing Factor**: Establishing common knowledge of posteriors (e.g., by public announcement and mutual recognition) and then observing persistent disagreement would support Camp B. If common knowledge is not established, Camp A attributes the disagreement to incomplete common knowledge.

