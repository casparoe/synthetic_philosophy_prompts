  ### Collaborative Document on the Common Prior Assumption  
  **Signed by Camp A (Harsanyi–Aumann) and Camp B (Permissivist/Anti-CPA)**  

  ---

  #### 1. Common Ground: Shared Claims  
  Both camps accept the following:  

  1. **Aumann’s theorem mechanics**:  
     - Assumes: A finite state space, a common prior probability distribution over states, and partitions representing agents’ private information.  
     - If two agents have common knowledge of each other’s posterior probability for an event, and a common prior exists, their posteriors must be equal.  

  2. **Type space representation**:  
     - A type space formally models agents’ beliefs. It includes:  
       - A state space \( \Omega \).  
       - A prior \( P \) (common if shared by all agents).  
       - For each agent, a partition of \( \Omega \) encoding their information structure.  
     - At each state, an agent’s knowledge is given by their partition cell, and their posterior beliefs are derived by conditioning the prior on that cell.  

  3. **Role of the prior**:  
     - The prior is a probability distribution serving as a "bookkeeping device" for Bayesian updating.  
     - It represents beliefs conditioned *only* on background evidence common to all agents.  
     - Posteriors are computed by conditioning the prior on private information (partition cells).  

  4. **Testability of the common prior assumption (CPA)**:  
     - CPA is not directly testable from within an agent’s own reasoning. Agents cannot access others’ priors independently.  
     - However, CPA has indirect testable implications (e.g., via no-trade theorems or failure of agreeing-to-disagree under common knowledge).  

  5. **Relaxations of the theorem**:  
     - If priors are \(\epsilon\)-close (in total variation distance), common knowledge of posteriors forces posteriors to be \(\delta\)-close, with \(\delta \to 0\) as \(\epsilon \to 0\).  
     - Under common \(p\)-belief (where \(p < 1\)), disagreement is bounded by a function \(f(p)\) with \(f(p) \to 0\) as \(p \to 1\).  

