  #### 3. Cruxes: Sub-Questions and Predictions  

  **Crux 1: Toy Example**  
  *Setup*:  
  - States: \( \{1, 2, 3, 4\} \).  
  - Alice’s partition: \( \{\{1,2\}, \{3,4\}\} \).  
  - Bo’s partition: \( \{\{1,3\}, \{2,4\}\} \).  
  - Alice’s posteriors:  
    - Given \( \{1,2\} \): \( P(1) = \frac{3}{4} \), \( P(2) = \frac{1}{4} \).  
    - Given \( \{3,4\} \): \( P(3) = \frac{3}{4} \), \( P(4) = \frac{1}{4} \).  
  - Bo’s posteriors:  
    - Given \( \{1,3\} \): \( P(1) = \frac{3}{4} \), \( P(3) = \frac{1}{4} \).  
    - Given \( \{2,4\} \): \( P(2) = \frac{1}{4} \), \( P(4) = \frac{3}{4} \).  

  **Question 1**: Does a common prior \( P \) exist that reproduces these posteriors?  
  *Answer*: No. Proof sketch:  
  - Let \( p_i = P(i) \).  
  - Alice’s beliefs imply: \( p_1 = 3p_2 \) and \( p_3 = 3p_4 \).  
  - Bo’s beliefs imply: \( p_1 = 3p_3 \) and \( p_4 = 3p_2 \).  
  - Substituting: \( p_1 = 3p_3 = 3(3p_4) = 9p_4 = 9(3p_2) = 27p_2 \).  
  - But \( p_1 = 3p_2 \), so \( 27p_2 = 3p_2 \) → \( p_2 = 0 \). Then \( p_1 = p_3 = p_4 = 0 \), violating \( \sum p_i = 1 \).  

  **Follow-up 1: Common knowledge in the space**  
  - Finest common coarsening of partitions:  
    - Alice: \( A_1 = \{1,2\}, A_2 = \{3,4\} \).  
    - Bo: \( B_1 = \{1,3\}, B_2 = \{2,4\} \).  
    - Intersections: \( A_1 \cap B_1 = \{1\} \), \( A_1 \cap B_2 = \{2\} \), \( A_2 \cap B_1 = \{3\} \), \( A_2 \cap B_2 = \{4\} \).  
    - Thus, the coarsening is the discrete partition \( \{\{1\},\{2\},\{3\},\{4\}\} \).  
  - Common knowledge of a non-trivial event requires the event to be a union of partition cells of the common coarsening. Here, only trivial events (e.g., \( \Omega \) or \( \emptyset \)) are common knowledge.  
  - **Implication**: Alice and Bo *cannot* have common knowledge of non-trivial posteriors (e.g., \( P(\text{state 1}) \)), as their partitions lack overlapping non-trivial events. The space fails CPA but never triggers agreeing-to-disagree (common knowledge of posteriors is impossible).  

  **Follow-up 2: Betting condition for CPA**  
  - Betting criterion (necessary and sufficient for no CPA): Exists transfers \( t_A, t_B \) with \( t_A + t_B = 0 \), such that:  
    - Alice: \( \mathbb{E}[t_A \mid \text{info}] \geq 0 \) (strictly >0 for some states).  
    - Bo: \( \mathbb{E}[t_B \mid \text{info}] \geq 0 \) (strictly >0 for some states).  
  - **Bet construction**:  
    - Let \( t_A(1) = -1, t_A(2) = 3, t_A(3) = 3, t_A(4) = -9 \). Then \( t_B = -t_A \).  
    - Alice at \( \{1,2\} \): \( \mathbb{E}[t_A] = \frac{3}{4}(-1) + \frac{1}{4}(3) = 0 \).  
    - Alice at \( \{3,4\} \): \( \mathbb{E}[t_A] = \frac{3}{4}(3) + \frac{1}{4}(-9) = 0 \).  
    - Bo at \( \{1,3\} \): \( \mathbb{E}[t_B] = \frac{3}{4}(1) + \frac{1}{4}(-3) = 0 \).  
    - Bo at \( \{2,4\} \): \( \mathbb{E}[t_B] = \frac{1}{4}(-3) + \frac{3}{4}(9) = 6 > 0 \).  
  - **Result**: Transfers sum to zero; both agents have non-negative expected gains given their information (Bo has strictly positive gain at \( \{2,4\} \)). Thus, the bet satisfies the no-CPA criterion.  
  - **Camps’ interpretations**:  
    - Camp A: The bet reveals irrationality—Bo accepts a trade he should reject if beliefs were coherent.  
    - Camp B: The bet reflects legitimate prior-driven disagreement; no irrationality implied.  

  ---

  **Crux 2: Improper Priors or Finite Additivity**  
  *Question*: Does allowing improper priors (non-normalized) or finitely additive priors resolve CPA failures?  
  - **Toy example**: An improper prior (e.g., \( P(1)=3, P(2)=1, P(3)=9, P(4)=3 \)) replicates posteriors.  
  - **Camp A**: Rejects this fix. Improper priors violate the probabilistic foundations of Bayesian rationality (e.g., cannot handle unconditional expectations). CPA requires a *probability* measure.  
  - **Camp B**: Accepts improper priors as technically valid, but notes they do not eliminate prior diversity—they relocate the disagreement to the choice of prior class.  
  - **Resolution**: Moves the disagreement to whether rationality requires a proper (normalized) prior.  

  ---

  **Crux 3: Empirical Prediction on Expert Disagreement**  
  *Phenomenon*: Well-calibrated forecasters (e.g., prediction markets) with identical public evidence and mutual knowledge of probabilities hold divergent beliefs for months.  
  - **Camp A’s prediction**: This implies either:  
    - Common knowledge of posteriors never obtains (e.g., due to private models or unshared evidence).  
    - Or, some agents are irrational (e.g., overconfident).  
    - *If common knowledge is verified and disagreement persists*: Evidence of irrationality.  
  - **Camp B’s prediction**: Persistent disagreement is evidence of rational prior diversity.  
    - *If common knowledge is verified and disagreement persists*: Evidence against CPA.  
  - **Distinguishing test**: Establish common knowledge of posteriors (e.g., via public announcement with shared rationality assumptions). Persistent disagreement then favors Camp B.  

  ---

  **Residual Disagreement**:  
  - Camp A views CPA as a normative requirement for rational agents; its failure indicates errors in reasoning or information.  
  - Camp B views CPA as descriptively false and normatively optional; prior diversity is legitimate.  
  Both camps agree that Aumann’s theorem clarifies the relationship between common knowledge, CPA, and disagreement—but disagree on its implications for rationality.  

