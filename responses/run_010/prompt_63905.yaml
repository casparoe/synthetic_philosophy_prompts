  I need to outline the essential requirements for a theory of standing to blame, using the cases they provided and adding any missing ones. The user wants to know which desiderata are non-negotiable and which are optional, and if there's a conflict that makes some impossible to satisfy simultaneously. They also asked for a scorecard comparing different theories.

  First, I'll cover the cases they mentioned: textbook hypocrite, differential blamer, sheltered saint, ex-addict/ex-offender, private blame, blaming the dead, friend blaming on victim's behalf, self-blame, and the legal analogy. I should add more cases for comprehensiveness—maybe hypocritical victim-blaming and the repentant hypocrite. For each desideratum, I'll explain why it's important and whether it's mandatory.

  The core tension seems to be about whether hypocritical blame is apt but unfitting, and if standing is a substantive condition. I agree with their hunch that this might be unsatisfiable—if hypocritical blame is apt in content but lacks standing, it suggests standing is more than just correctness. But if we insist on both, it could lead to inconsistencies.

  For desiderata, I'll start with non-negotiable ones: standing must be distinct from the truth of blame and from permissibility, it should vary independently of the blamee's desert, and it must account for the hypocrite's lack of standing. The differential blamer case shows that consistency matters too. Optional desiderata might include explaining the sheltered saint's thin blame or the ex-addict's weight, as theories can reasonably differ here.

  I'll structure the response with desiderata grouped by category, mark them as core or negotiable, and provide the reasoning. Then, I'll address the joint satisfiability: the key conflict is between aptness and unfittingness in hypocrisy cases, which pressures theories to either redefine standing or collapse distinctions.

  Finally, the scorecard will compare record-based, commitment-based, address-based, and deflationist theories against the desiderata. I'll keep it concise and in British English, as requested.

  This should give the user a solid framework for evaluating theories in their seminar.
answer: |-
  Here’s a rigorous set of desiderata for a theory of standing to blame, structured around your cases and core philosophical tensions. Desiderata marked **[Core]** are non-negotiable for any minimally adequate account; **[Negotiable]** items are desirable but theories can defensibly reject or reinterpret them. The "squeeze" is identified at the end.

  ---

  ### **Desiderata for a Theory of Standing to Blame**

  1.  **Distinction from Blame’s Truth/Fittingness [Core]**  
      *Requirement:* Must distinguish standing from (a) whether the blamed act *was* wrong (truth), and (b) whether blame is a *fitting response* to the wrong (e.g., proportional, accurate). Standing concerns the *blamer’s authority* or *position* to level blame, not the blame’s content.  
      *Case:* The **textbook hypocrite** (serial philanderer denouncing an affair). Their blame *might* be true/fitting regarding the colleague’s act (the norm applies), yet intuitively *lacks standing*. A theory collapsing standing into fittingness cannot explain this.  
      *Non-Negotiability:* Without this, "standing" dissolves into other normative dimensions of blame.

  2.  **Distinction from Blame’s Permissibility/Manner [Core]**  
      *Requirement:* Must distinguish standing from whether *how* blame is expressed is permissible (e.g., cruel, disproportionate, violating privacy). Standing is a condition *on the normative force of the blame itself*, prior to delivery.  
      *Cases:* **Private blame** (uttered alone) & **blaming the dead**. Even if done "perfectly" (no audience, no harm, manner impeccable), blame might *still* lack standing (e.g., if hypocritical). A theory making standing purely about consequences or manner fails.  
      *Non-Negotiability:* Ensures standing is a substantive condition on the *act* of blaming, not just its context.

  3.  **Variability Independent of Blamee’s Desert [Core]**  
      *Requirement:* Standing must be capable of varying even when the *blamee’s desert* of blame is held constant (the wrong is identical).  
      *Case:* The **differential blamer** (objecting fiercely to a minor slight by person A, but barely acknowledging a major wrong by favoured person B for the same type of act). Blamee B clearly deserves *more* blame, yet the blamer’s standing regarding B seems compromised by partiality.  
      *Non-Negotiability:* Shows standing isn’t reducible to the blamee’s actions/desert alone.

  4.  **Hypocrisy Undermines Standing [Core]**  
      *Requirement:* Must explain why paradigmatic hypocrisy (blaming while guilty of similar/same wrong, without relevant change/mitigation) typically undermines or voids standing.  
      *Case:* The **textbook hypocrite**. Their blame is widely seen as illegitimate, "tainted," or ineffective *qua* blame, even if factually correct.  
      *Non-Negotiability:* A central, robust intuition any theory must engage; failure here is fatal for most.

  5.  **Non-Forfeiture by Blamee is Insufficient [Core]**  
      *Requirement:* Standing cannot rely *solely* on the blamee having "forfeited" a right against being blamed by committing the wrong. Something more about the *blamer* is needed.  
      *Cases:* **Textbook hypocrite** & **sheltered saint**. The blamee may have forfeited a right against *some* blame (e.g., from the victim), but not necessarily against blame from *this specific blamer* (the hypocrite or saint).  
      *Non-Negotiability:* Prevents collapse into a simple "wrongdoing forfeits rights" model which ignores the blamer’s role.

  6.  **Explaining the Sheltered Saint’s "Thin" Blame [Negotiable]**  
      *Requirement:* Should account for why blame from someone utterly innocent/untempted can feel "cheap," uninformed, or lack gravitas, even if they technically "haven’t sinned".  
      *Case:* The **sheltered saint**. Their spotless record might grant *maximal standing* on record-based views, but their blame often lacks perceived authority or weight.  
      *Negotiability:* Theories can reasonably argue this is about *rhetorical effectiveness* or *understanding*, not standing proper. Record-based views might bite the bullet.

  7.  **Explaining the Ex-Addict/Offender’s Authority [Negotiable]**  
      *Requirement:* Should account for why blame (or warnings/advice) from someone with a relevant troubled past can carry unique weight/authority.  
      *Case:* The **ex-addict** condemning current addicts. Their *identical words* might resonate more deeply than a saint’s. A record-based view struggles – their record is *worse*, yet standing seems *enhanced*.  
      *Negotiability:* Can be framed as epistemic (credibility/understanding) or expressive (shared identity), not necessarily constitutive of standing.

  8.  **Scope Across Blame Contexts [Core]**  
      *Requirement:* Must apply consistently to: **Private blame** (standing isn't contingent on an audience), **blaming the dead/unreachable** (standing isn't contingent on the blamee receiving it), **self-blame** (must say *something* coherent about whether one can lack standing to blame oneself, e.g., due to self-deception or hypocrisy).  
      *Non-Negotiability:* Tests whether standing is inherent to the blaming *act/attitude* or dependent on external factors like communication.

  9.  **Third-Party Standing & Delegation Limits [Negotiable]**  
      *Requirement:* Should address whether standing can be "borrowed" or delegated, especially when victims dissent.  
      *Case:* A **friend blaming on the victim’s behalf** when the victim explicitly doesn’t want blame levied. Intuitions clash: is the friend overstepping (lacking standing) or legitimately upholding a norm?  
      *Negotiability:* Theories can legitimately differ on the primacy of the victim’s will vs. the norm’s validity. Address-based views favour the victim’s will; commitment-based views might prioritise the norm.

  10. **Distinction from Legal Standing Analogy [Negotiable]**  
      *Requirement:* Should clarify if/how the moral concept relates to legal standing (a threshold procedural right to sue). Must not *uncritically import* the legal model.  
      *Case:** Legal standing requires direct, particularised injury. Moral blame often extends beyond direct victims (e.g., blaming genocide). Is the legal analogy helpful, misleading, or irrelevant?  
      *Negotiability:* Theories can plausibly embrace, reject, or heavily modify the analogy. Deflationists might see it as a category error.

  ---

  ### **The Squeeze: Joint Unsatisfiability**
  The core tension lies between **Desideratum 1 (Distinction from Truth/Fittingness)** and **Desideratum 4 (Hypocrisy Undermines Standing)**, when combined with the insistence that standing is a **substantive condition distinct from manner/permissibility (Desideratum 2)**.

  *   **The Problem:** If the hypocrite’s blame is **apt** (correctly identifies a wrong – satisfying D1) but **unfitting** *as blame* due to lacking standing (per D4), what *is* this unfittingness? If it’s not about truth/fittingness (D1), and not about the manner/permissibility of delivery (D2), what normative category does "lack of standing" occupy?
  *   **The Pressure:** Theories are squeezed towards either:
      1.  **Collapsing Standing into Fittingness/Manner:** Denying D1 or D2 (e.g., deflationists: hypocritical blame *is* unfitting *as blame* because hypocrisy is a vice rendering the response inappropriate). *But this abandons standing as a distinct substantive condition.*
      2.  **Positing a Distinct Normative Role:** Framing standing as about the *authority to hold accountable* or *the normative force of the demand* inherent in blame (e.g., address-based views: the hypocrite lacks the *moral right to make the demand*). *But this risks making standing mysterious or overly reliant on contentious notions of forfeiture/authority.*
      3.  **Making Standing Contingent on a Separate Norm:** (e.g., commitment-based views: standing requires consistency with one’s own commitments/norms). *This preserves distinctness but struggles with cases like the Sheltered Saint (D6) and Private Blame (D8), and may not fully capture the intuitive "taint" of hypocrisy.*
  *   **The Result:** Achieving **all three** – (1) hypocrite’s blame is apt, (2) hypocrite’s blame is unfitting due to lack of standing, (3) standing is distinct from truth/fittingness AND manner/permissibility – is likely **impossible without introducing a novel normative category** specifically for interpersonal moral authority in holding accountable. Most theories sacrifice one element.

  ---

  ### **Scorecard: Major Families of Views vs. Desiderata**

  1.  **Record-Based (Standing requires blamer’s relevant innocence/purity):**
      *   *Strengths:* Easily explains hypocrisy undermining standing (D4), distinction from blamee’s desert (D3).
      *   *Weaknesses:* Fails D6 (Sheltered Saint has standing but blame feels thin), Fails D7 (Ex-addict has worse record but enhanced authority), Struggles with D8 (self-blame? private blame?).
      *   *Core Challenge:* Cannot easily distinguish standing from blamer's virtue/record.

  2.  **Commitment/Consistency-Based (Standing requires consistency with blamer’s own commitments/norms):**
      *   *Strengths:* Explains hypocrisy (D4 - violates consistency), differential blamer (D3 - inconsistent application), distinction from truth (D1).
      *   *Weaknesses:* Struggles with D6 (Saint is consistent, yet blame thin?), D8 (Can one be inconsistent with oneself? Meaning of private blame?), D9 (Why does consistency grant standing *over others*?).
      *   *Core Challenge:* Grounding why consistency grants *authority* over others.

  3.  **Address/Demand-Based (Standing requires the moral right to address a demand to the blamee):**
      *   *Strengths:* Clear distinction from truth/fittingness (D1) & manner (D2), explains hypocrisy (D4 - hypocrite forfeits right to demand), explains D9 (victim’s will matters), handles D8 (self-blame as self-address).
      *   *Weaknesses:* Struggles with D5 (Forfeiture insufficient alone? Needs more), D8 (Blaming dead/unreachable - no "address"? Private blame?), D7/D6 (Why does past affect *right to demand*?).
      *   *Core Challenge:* Explaining standing in non-address contexts (private, dead) and grounding the "right to demand".

  4.  **Deflationists (No distinct standing condition; objections are about truth, fittingness, or permissibility):**
      *   *Strengths:* Parsimonious, handles D8 easily (no issue with private/blaming dead), avoids novel categories.
      *   *Weaknesses:* Directly violates D1 & D2 (collapses distinctions), struggles mightily with D4 (Why *is* hypocrite’s correct blame problematic if not truth/fittingness/manner? Must say it *is* unfitting or impermissible in manner), struggles with D3 (differential blamer - why is *that* impermissible/unfitting?).
      *   *Core Challenge:* Explaining the *specific* normative flaw in hypocrisy without invoking standing-like concepts.

  **The Knockout Requirement:** **Desideratum 4 (Hypocrisy Undermines Standing)** combined with **Desideratum 1 (Distinction from Truth/Fittingness)** is the most potent. It immediately challenges deflationists and pressures other views to articulate *what* is lacking beyond correctness and before delivery-manner. Address-based views handle this best initially but face counter-pressure from the non-address cases (D8).
