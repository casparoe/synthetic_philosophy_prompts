prompt: |-
  I cover evolution and the history of science for a magazine — ideas desk, mostly profiles and disputes. Last week I sat with a researcher who's firmly in the anti-adaptationist camp, the spandrels-of-San-Marco lineage, and he walked me through what he calls the retrofit problem: his argument that calling something an adaptation isn't an explanation at all. I wrote it down on the train home and it went roughly like this.

  1. To call a trait an adaptation is to claim it was shaped by selection because it did some job — call the job F.
  2. That claim is about populations nobody observed, in environments nobody can visit, starting from ancestral forms of the trait nobody can recover, competing against demands nobody measured.
  3. So for any trait and any F you like, somebody can produce a selection story that lands on it: pick the right ancestral environment, the right starting form, the right competing demands, and the trait comes out favored for F. Nothing in the story is pinned down by the trait, because the trait is exactly what's up for explanation.
  4. An account you can always produce, whatever turns up, is an account nothing could contradict.
  5. And a claim nothing could contradict isn't explaining anything — it's just handing the outcome a nicer name after the fact.
  6. So "adaptation for F" never explains anything, and we should stop saying traits are adaptations.

  He's aiming at 6 and I mostly buy the spirit of it — his favorite example was the human chin, which he insists is a byproduct of how the jaw gets reshaped as the face shrinks rather than anything selection built for a purpose. But now that I'm trying to write the piece I keep hitting the fact that the argument doesn't seem to know where to stop. Swap in his own preferred explanation — the trait is a consequence of how the structure next to it grows — and 3 through 5 seem to run on it just as smoothly: for any trait I can nominate some other thing it's a consequence of, and if you push back I can retune which other thing. If it runs on both sides of a fight, it isn't showing that one side is empty, it's saying something much bigger about infering the past from the present. Which is not the piece I want to write, and I dont think it's true, because that same inferential move is basically the whole rest of my beat — attributing a warming trend, working out what killed something off, reconstructing who's related to whom.

  So: which step do you cut, and what does cutting it cost? I'd rather keep 2 — I like that it's about the past being unavailable — but tell me honestly if 2 is where the damage is and I'm just fond of it. I also want the two sides' own concessions: which of these steps a working adaptationist would admit is a real problem (I suspect there's a narrower version of 3 he'd sign onto about a lot of published papers, especially the ones that gesture at optimality without measuring anything), and which steps the anti-adaptationist has to disown to keep his byproduct explanations in play as science rather than as the same story told backward. And if the honest answer is that the argument survives but 6 needs a much smaller blast radius than my source thinks, say that and tell me how much smaller — I can absolutely write "the retrofit problem is real but local" if that's the truth. No bibliography, I've got the literature; I need the diagnosis.
reasoning: |-
  Okay, the user is a science journalist covering evolution and the history of science. They recently interviewed an anti-adaptationist researcher who presented the "retrofit problem" argument against adaptationist explanations. The core of this argument is that calling a trait an adaptation doesn't actually explain anything because you can always construct a plausible selection story after the fact. The user finds the argument compelling but notices it applies equally to the researcher's preferred byproduct explanations. They're struggling to write their piece and need help identifying where the argument breaks down.

  The user provided six steps of the anti-adaptationist argument. Step 1 defines adaptation as a trait shaped by selection for a function F. Step 2 points out that such claims involve unobservable past events. Step 3 argues that you can always construct a plausible selection story for any trait and function. Step 4 notes that unfalsifiable accounts can't be contradicted. Step 5 concludes such claims don't explain anything. Step 6 says we should stop calling traits adaptations.

  The user's main concern is that this argument seems to undermine all historical inference, not just adaptationist claims. They need to know which step to cut or modify to preserve scientific reasoning about the past while acknowledging valid criticism of adaptationist overreach.

  I need to analyze each step carefully. Step 2 seems valid - the past is indeed inaccessible. The problem likely lies in Step 3's claim that "nothing is pinned down" and Step 4's leap to "nothing could contradict." These overstate the case because in reality, evolutionary biologists use multiple lines of evidence to constrain adaptationist hypotheses.

  For adaptationists, the weakest step is Step 3. They would argue that while you can invent just-so stories, rigorous adaptationist work uses comparative methods, experimental evolution, and quantitative genetics to test hypotheses. The user suspects adaptationists would acknowledge problems with poorly supported stories that don't measure anything - that's a key concession.

  For the anti-adaptationist, their byproduct explanations face the same retrofit problem unless they can show how their approach is testable. They need to accept that their explanations also require evidence beyond plausibility - perhaps developmental constraints must be independently verified.

  Step 4 is where the damage happens. Calling adaptationist accounts "nothing could contradict" ignores how evidence can make some stories highly improbable. The real issue is unfalsifiable storytelling versus testable science.

  The blast radius of Step 6 should be limited to untested adaptationist claims, not the entire concept. The user can write that the retrofit problem is real but local - it targets lazy adaptationism, not all evolutionary explanation.

  The user wants to keep Step 2 because they like its emphasis on historical contingency. That's fine - Step 2 isn't the problem. The issue is the overinterpretation in Steps 3-4.

  In conclusion, the argument survives as a critique of unsupported just-so stories but fails as a general indictment of adaptationism or historical science. The user should cut Step 4's absolutism and limit Step 6's scope. Adaptationists concede that uncritical storytelling is problematic, while anti-adaptationists must accept that their explanations also need evidentiary support.
answer: |-
  Here's a surgical dissection of the retrofit argument, pinpointing where it overreaches while preserving its valid core, and clarifying the concessions each side must make. The damage is concentrated in **Step 4**, but **Step 3** needs tightening, and **Step 6** requires significant qualification. Here's the breakdown:

  ### Where the Argument Falters & Why
  1.  **Step 1:** Uncontested. This is the standard definition of adaptation.
  2.  **Step 2:** Valid *description*, not fatal. This highlights the inherent difficulty of historical science (paleontology, cosmology, geology, phylogenetics, *your whole beat*). Difficulty ≠ impossibility. We use proxies, models, comparative data, fossils, and experiments to *constrain* the possibilities. It doesn't render explanation impossible, just challenging and probabilistic.
  3.  **Step 3:** **Overstated & Needs Qualification.** This is the core of the "retrofit" worry, but it's hyperbolic. While it's *true* that *untested, speculative* "just-so stories" can be concocted for almost anything (a real problem in some pop-sci and weaker papers), it's **false** that *nothing* is pinned down or that *any* story is equally plausible for *any* trait/F pairing. Evidence *does* constrain the possibilities:
      *   **Phylogenetic Constraints:** We often know the broad ancestral state from comparative anatomy or fossils (e.g., we know chins are derived in *Homo*; we know feathers predate flight). You can't tell *any* story starting from *any* ancestor.
      *   **Functional/Physical Constraints:** Not every structure *can* plausibly perform every function F (e.g., the chin isn't strong evidence for a "scooping adaptation" because its structure doesn't efficiently scoop; the lens of the eye is strong evidence for an optical function because its properties are precisely suited to it). Physics and engineering limit the plausible Fs.
      *   **Correlated Evidence:** Genomic signatures of selection, experimental manipulations (e.g., altering beak size in finches affects survival), quantitative genetics models showing trait-fitness correlations, fossil sequences showing directional change – all provide evidence *beyond* the mere existence of the trait.
      *   **The "Right" Environment/Demands:** While imperfectly known, paleoenvironmental data (pollen, isotopes, geology) and biomechanical/physiological models provide evidence about plausible selective pressures. Demands aren't "unmeasured" abstractions; they can be inferred from functional anatomy and ecology.
      *   **Consequence:** Step 3 is a valid critique of **untested, purely narrative adaptationist hypotheses** that ignore these constraints. It is **not** a valid description of **tested, evidence-based adaptationist hypotheses**. This is the key concession the anti-adaptationist needs to make explicit: the problem isn't adaptationism *per se*, it's *uncritical* adaptationism.
  4.  **Step 4: The Fatal Overreach.** This is where the argument breaks and undermines *all* historical science, including the anti-adaptationist's preferred explanations. Claiming adaptationist accounts are "nothing could contradict" is demonstrably false:
      *   **Contradiction IS Possible:** A phylogeny showing the trait evolved *before* the proposed selective pressure arose (e.g., feathers predating flight). Fossil evidence showing the trait was maladaptive or non-functional in its initial stages. Experimental evidence showing variation in the trait *doesn't* correlate with fitness for F. Evidence that the trait is developmentally constrained and *cannot* respond to selection for F. Genomic evidence showing no signature of recent selection. Finding the trait in environments where F is irrelevant. **These things *can* contradict a specific adaptationist hypothesis.**
      *   **The Universal Acid:** If Step 4 were true, *no* historical explanation (spandrel, constraint, drift, exaptation, catastrophe) could be contradicted either. For any byproduct (e.g., chin), I *could* invent alternative developmental pathways or neighboring structures that *didn't* produce it. The anti-adaptationist *relies* on evidence (developmental biology, comparative anatomy) to rule out alternatives and support their specific constraint story – just as the adaptationist does. Step 4 implicitly demands an impossible standard of proof unique to adaptationism.
  5.  **Step 5:** Logically follows *if* Step 4 is true. But since Step 4 is false for *tested* adaptationist hypotheses, Step 5 is also false for those cases. It *is* true for untested just-so stories.
  6.  **Step 6: Overly Broad.** This conclusion doesn't follow because Steps 3-5 are flawed when applied to rigorous adaptationism. While we should be *cautious* and demand evidence, abandoning the concept entirely throws out the baby (legitimate explanations of design-like features) with the bathwater (lazy storytelling).

  ### Concessions Required
  *   **Adaptationist Concession:** They *must* concede that **Step 3 accurately describes a significant problem in *some* adaptationist literature** – particularly papers relying solely on plausibility arguments, optimality models without empirical validation of assumptions, or narratives detached from phylogeny/development. "Just-so stories" are a real pitfall. Strong adaptationism requires multiple lines of *testable* evidence.
  *   **Anti-Adaptationist Concession:** To keep their *own* explanations scientific, they *must* disown the absolute claims in **Step 4** ("nothing could contradict") and the sweeping conclusion in **Step 6**. They must acknowledge that:
      1.  Their constraint/byproduct explanations **also face the "retrofit problem"** – it's a challenge for *all* historical inference.
      2.  Their preferred explanations **also require evidentiary support** beyond mere plausibility (e.g., developmental mechanisms, phylogenetic patterns, functional analysis showing the trait *isn't* under selection *now* for F).
      3.  Well-supported adaptationist explanations **do exist** (e.g., antibiotic resistance, melanism in peppered moths, many classic examples in behavioral ecology with fitness measures).
      4.  The goal isn't to *eliminate* adaptationist explanations, but to **demand higher evidentiary standards** and **consider the full range of evolutionary processes** (constraint, drift, exaptation) as null hypotheses.

  ### The Blast Radius & Your Piece
  The **honest answer** is that the retrofit problem **is real but local**, and **Step 6 needs a drastically smaller blast radius.**

  *   **Blast Radius:** The retrofit problem is a powerful critique **specifically targeting *untested, speculative adaptationist narratives*.** It exposes the weakness of "post-hoc storytelling" masquerading as explanation. It applies to papers/journalism where a trait exists, a function F is imagined, and a story is spun with no attempt to test it against alternatives, phylogeny, development, or quantitative evidence.
  *   **Not Local To:** It does *not* successfully undermine:
      *   Adaptationist hypotheses supported by multiple lines of evidence (experimental, comparative, genomic).
      *   The *validity* of the adaptationist *program* when practiced rigorously.
      *   The legitimacy of inferring past causes from present evidence (the foundation of historical sciences).
      *   The anti-adaptationist's *own* preferred explanations (unless they rely solely on post-hoc plausibility too).

  **Your Diagnosis & Angle:** Frame the retrofit problem as a **necessary corrective against methodological laxity in adaptationist storytelling, not a death knell for adaptationism or historical science.** Emphasize that:

  1.  **The Past *is* Hard (Step 2 Stands):** All historical inference faces the challenge of unavailable data.
  2.  **Plausibility ≠ Proof (Valid Core of Step 3):** Inventing a selection story is easy; proving it requires evidence that constrains the possible narratives (phylogeny, function, development, genetics, environment).
  3.  **Hypotheses *Can* Be Contradicted (Step 4 is Wrong):** Rigorous science uses evidence to falsify *specific* adaptationist (or byproduct) hypotheses.
  4.  **The Stakes are Evidentiary Standards:** The real fight is between lazy storytelling (whether adaptationist *or* constraint-based) and rigorous hypothesis testing using all available tools. The anti-adaptationist's contribution is forcing adaptationists to up their game and consider alternatives seriously. The chin *might* be a spandrel, but that claim needs evidence too (developmental pathways, lack of functional advantage, phylogenetic timing), not just a counter-narrative.
  5.  **6 is Too Far:** We shouldn't *stop* saying traits are adaptations; we should *start* demanding stronger proof when we do.

  You *can* absolutely write "the retrofit problem is real but local" – specifically local to **uncritical adaptationist just-so stories.** The argument survives as a potent *critique of methodology*, not as a refutation of adaptationism or historical science itself. Focus the piece on the **elevation of scientific standards** the debate has provoked. That's the enduring legacy of the spandrels critique.

