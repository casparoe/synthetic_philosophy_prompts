answer: |-
  Below is a referee-style assessment addressing your requests with directness and technical rigor. I assume familiarity with the literature (Millikan, Dretske, Neander, Shea, etc.) and focus solely on the argument’s merits.

  ### 1. **Accuracy**  
  Your §1 and §4 accurately describe the core machinery of consumer teleosemantics. The disjunction problem is correctly framed, and "normal conditions" is properly identified as the separator of selection-driven success from accidental firing. Where your friend objects (§4 misdescription), **they are partially correct**: ancestral selection *for* F does preclude the recruited mechanism from having G as a *proper function*. However, your §4 does not claim it has G as a proper function; it argues that indexing content to etiological normality yields F-content, which is mismatched to the state’s *current* functional role in producing G-success. This is faithful — the tension arises precisely because the mechanism *lacks* G-proper function. No technical misstep here.

  ### 2. **Is the distinction real?**  
  The operational/etiological normality distinction is genuine and underexplored. Traditional accounts (e.g., Millikan’s "Normal" conditions) conflate them tacitly, assuming ancestral and current enabling conditions align. Recruitment cases force them apart: etiological normality references historical F-enabling conditions, operational normality current G-enabling conditions. **The distinction cannot be absorbed without strain** because:  
  - Etiological normality is defined by *past* selection pressures (what *did* enable success).  
  - Operational normality is defined by *current* systemic and environmental conditions (what *does* enable success).  
  A theory could stipulate that "normal" means "conditions under which the mechanism *would* succeed *now*," but this abandons historical determination — the core of teleosemantics. Recruitment cases are pivotal: they are empirically plausible (e.g., neural recycling in reading) and target high-level cognition. Skepticism about neural-level content assignment doesn’t dissolve the problem; it merely relocates it to *how* subsystems contribute to system-level content.

  ### 3. **Does the friend win?**  
  **His first move (neural state lacks G-content)**: This is defensible but costly. If the frog’s fly-detector neurons are recruited for detecting bee-bees, teleosemantics assigns them *fly*-content, not *bee-bee*. This "saves" the theory but at the price of severing neural state content from the organism’s successful behavior (G). **This is your point, not a rebuttal**: it shows teleosemantics cannot explain content in cases of neural reuse, which are pervasive in cognition. His claim that "belief content" differs is a retreat — teleosemantics aims to ground all mental content.  
  **His second move (cultural symbols rescue content)**: **This collapses into interpretivism.** Public symbols (e.g., "7") have selection histories, but their "normal conditions" for content-fixing depend on *community practices* — i.e., how *interpreters* use and sustain them. What counts as "correct" application of "7" is determined by social norms, not biological selection. Teleosemantics must either:  
  (a) Reduce cultural selection to biological (e.g., via gene-culture coevolution), but this fails for novel practices (e.g., symbolic math emerged too recently for genetic assimilation).  
  (b) Treat cultural practices as "reproducers," but then "normal conditions" are defined by *current* normative practices — which is operational normality in disguise.  
  **Verdict**: His first move concedes your dilemma’s first horn; his second succumbs to the second horn. You win on both.

  ### 4. **The vice he attributes to you**  
  The charge is **partly valid but overstated**. "Indeterminate" is justified when a theory cannot decide between F and G content in recruitment cases. "Collapses into interpretivism" is apt for §5’s weighting repair and his cultural move, as both appeal to *current* norms/practices. **However, you need to show**:  
  - Why "interpretivism" is a *problem* for naturalism (briefly implied in §5–6).  
  - That weighting/cultural selection *necessarily* imports an interpreter’s perspective.  
  **To fortify**: Argue that norms of "correct function" in cultural practices require community intentionality — which teleosemantics cannot reduce without circularity.

  ### 5. **Strongest objection you missed**  
  **The System-Level Content Reply**: Teleosemantics could assign content holistically. A recruited mechanism contributes to system-level function G (e.g., reading), fixed by *the organism’s* selection history. The neural state’s content is derivative: it means *B* because the visual system was selected for letter recognition, even if edge-detectors were selected for object tracking.  
  **Why it embarrasses**: It sidesteps recruitment by appealing to higher-level selection. Your reply must show that system-level selection cannot "override" part-level history without ad hocery (e.g., why privilege one level?).

  ### 6. **Editorial Judgment**  
  - **Weakest section**: §5’s weighting critique. The objection that weights are "unmotivated" is thin; theorists could ground them in selection for plasticity. Cut or rebuild to emphasize that weighting *still* prioritizes current success, making history incidental.  
  - **Conclusion (§6)**: Correctly narrow. It targets teleosemantics’ *explanatory pretensions*, not its consistency. Specialists would nod — it crystallizes a known worry (e.g., Shea’s "inherited representations") but pushes it further with the normality distinction.  
  - **Ending**: Surprising only to dogmatists. Most concede teleosemantics struggles with derived content; your framing sharpens the challenge.

  ### 7. **Bottom Line**  
  **Develop it further**. The distinction in §2 is novel and damaging.  
  - **Most valuable change**: Engage the system-level reply (Objection 5). Show that system-level functions presuppose part-level functions, or that recruitment cases involve *replaced* (not augmented) functions.  
  - **Key question to settle**: "Can cultural selection histories fix content without tacit appeal to an interpreter’s norms?" If no, your collapse argument holds; if yes, your case weakens.  
  **If abandoned**: The essay already succeeds as a provocation — but winning requires neutralizing cultural selection.

  ---

  **Final Referee Verdict**: Your argument is sound and damaging to "pure" consumer teleosemantics. Your friend’s replies do not resolve the dilemma. The essay should be published if strengthened against system-level and cultural selection gambits. §2–3 are publishable as-is; §4–6 need tactical refinement. **You win the impasse**.
