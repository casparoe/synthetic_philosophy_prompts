prompt: |-
  I spent thirty-odd years measuring trace gases in the upper atmosphere, mostly out of a lab with a budget that would make a grad student laugh, and since retiring I've been volunteering two days a week with a small environmental monitoring outfit — river chemistry, a scattering of fixed sites, one part-time statistician who is really a hydrologist. They've asked me to draft a "how we do inference here" document, because two of their reports got torn apart last year by a regulator's consultants and the whole staff is now in that mood where they want to throw out p-values entirely and pick up something else, anything else. I've been reading a lot about this since I stopped working — I audited a philosophy of science course last spring and got hooked — and the thing I keep running into is that everybody agrees the standard toolkit is in trouble, and nobody can say what a replacement actually has to deliver. It's all critique and no spec, which is not how we'd do things in a lab.

  So here's what I want from you: write the desiderata. What would any framework for drawing conclusions from data have to be able to do to count as an adequate replacement for the null-hypothesis-testing workflow in a place like ours? Fix on the actual conditions, because adequacy is relative to them: sample sizes that are often in the single digits per site, data that arrives sequentially season after season rather than all at once in a planned batch, several dozen quantities measured at every site whether or not we predicted them, staff who are competent but will never internalize the theory, decisions that have to be made anyway (dredge the sediment, don't dredge; declare the trend, don't declare it), and a standing assumption that somebody who dislikes us will re-read our numbers looking for a way to make them look dishonest. Give me the cases it has to get right — the pair of experiments with identical data but different stopping intentions, peeking mid-study, multiplicity across sites, a genuinely null effect, a real effect too small to matter, and the model being wrong in a way we can't see — and the distinctions it must not collapse, like evidence versus decision, or long-run error rates versus degree of belief, or "we found nothing" versus "we found that there's nothing to find." Then tell me which requirements are non-negotiable and which are really just the house prejudices of one camp dressed up as logic. I'm particularly suspicious of the demand that inference obey the likelihood principle, and of the argument that if you accept the sufficiency principle and the conditionality principle you're committed to it whether you like it or not: is that a real constraint on a working framework, or a piece of philosophy that a lab can politely ignore? Same question for long-run calibration — if a procedure can't be shown to control errors over repetitions that will never actually happen, does that matter to me?

  Finally, and this is the part I most want: flag any pair of desiderata you think can't be jointly satisfied, and say which single requirement knocks out the most candidates. Let me throw in four of my own that I've been arguing about with a friend, and tell me which are legitimate and which I should drop — (a) a technician should be able to execute the workflow correctly without understanding why it works, (b) the method should let you state "this is inconclusive" without the whole project grinding to a halt, (c) the verdict shouldn't change just because we happened to plan to collect one more season of data, and (d) an adversary who reruns our analysis should get the same numbers we did. I suspect (a) and (c) are in tension and I can't quite see why. Wrap up with maybe half a page on how the three obvious contenders — preregistration plus p-values with effect sizes and power, a fully Bayesian setup with stated priors, and a decision-theoretic cost-loss framing — do against your list, but keep that brief and don't send me a reading list or a bibliography, I've got more than enough to read already and my library access ended when I handed in my badge.
reasoning: |-
  Okay, the user is a retired atmospheric scientist with decades of experience in trace gas measurement, now volunteering for a small environmental monitoring group. Their reports got criticized by regulators' consultants, so the team wants to overhaul their inference methods. They're frustrated with the lack of practical alternatives to standard null-hypothesis testing despite widespread criticism of it.  

  The user operates under real-world constraints: tiny sample sizes (sometimes single digits), seasonal sequential data, dozens of measured variables, staff without advanced stats training, high-stakes decisions (like dredging), and adversarial scrutiny. They want a framework that handles specific traps like:  
  - Same data but different stopping intentions  
  - Mid-study peeking  
  - Multiplicity across sites  
  - Distinguishing "no evidence" from "evidence of no effect"  
  - Model misspecification  

  Their deeper needs:  
  1. **Defensible Simplicity**: Needs methods that overworked technicians can execute correctly without PhD-level understanding.  
  2. **Decision Robustness**: Framework must support "inconclusive" outcomes without halting projects and resist quirks like adding one more season of data flipping conclusions.  
  3. **Adversarial Armor**: Results must be reproducible exactly, even by hostile parties reanalyzing the same numbers.  
  4. **Philosophy Pragmatism**: Skeptical of theoretical purity (e.g., likelihood principle) if it doesn't translate to lab practicality.  

  Key tensions they sense:  
  - Requirement (a) (technician-executable workflow) clashes with (c) (insensitivity to planned sample size changes), since simple methods like p-values break if you peek at data mid-study.  
  - They suspect long-run error control (e.g., 5% false positives) might be negotiable since their "repeated experiments" are hypothetical.  

  Their four personal desiderata:  
  - (a) **Technician-executable**: Valid but risky—oversimplification invites errors (e.g., p-hacking).  
  - (b) **"Inconclusive" option**: Critical and achievable. Bayesian methods do this well with credible intervals.  
  - (c) **Stopping-rule invariance**: Non-negotiable but hard. p-values fail this; Bayes survives.  
  - (d) **Reproducibility**: Essential. Favors transparent methods like preregistration.  

  Contenders' report card:  
  - **Preregistration + p-values**: Strong on reproducibility and error control but brittle to peeking/multiplicity. Requires stats savvy to avoid traps.  
  - **Full Bayes**: Handles inconclusive results and stopping-rule changes gracefully but priors invite adversarial attacks ("you rigged the prior!").  
  - **Decision theory**: Forces clarity on costs but requires quantifying environmental harm—which is politically fraught.  

  The core conflict: No single framework nails all needs. The user must prioritize:  
  - If defensibility > ease, choose **preregistered Bayes with community priors**.  
  - If simplicity > theory, **preregistered p-values + strict multiplicity corrections**—but accept it'll occasionally break.  
  - **Non-negotiable**: Stopping-rule invariance and "inconclusive" option. Drop absolute technician simplicity (a) if it sacrifices (c).
answer: |-
  Here's a distilled set of desiderata for an inference framework tailored to your environmental monitoring context, followed by a candid evaluation of your requirements and the major contenders. I'll flag tensions, non-negotiables, and pragmatic constraints.

  ### **Core Desiderata**  
  *(Non-negotiables in bold)*  
  1. **Robustness to tiny samples**: Must handle *n* = 2–10/site without imploding.  
  2. **Sequential data tolerance**: Conclusions shouldn't reverse when new seasonal data arrives (*stopping-rule invariance*).  
  3. **Adversarial transparency**: Fully reproducible results using raw data + documented code/methods.  
  4. **Explicit "inconclusive" state**: No forced binary claims ("effect/no effect") when data are weak.  
  5. **Multiplicity resistance**: Control false signals across dozens of sites/compounds without obliterating power.  
  6. **Model-misspecification armor**: Conclusions shouldn't hinge on invisible assumptions (e.g., Gaussian errors).  
  7. **Distinction preservation**:  
     - "No evidence" vs. "Evidence of no effect"  
     - Long-run error control (for regulatory defensibility) vs. current-study belief  
     - Data-driven evidence vs. action thresholds (e.g., "trend is real" vs. "dredging cost justifies action").  
  8. **Minimal cognitive load**: Outputs interpretable by non-statisticians (no measure theory, no subjective tuning).  

  ### **Cases the Framework Must Handle**  
  | Case                          | Requirement                                  |  
  |-------------------------------|---------------------------------------------|  
  | Identical data, diff stopping | Stopping-rule invariance (e.g., planned *n* vs. "peeking") |  
  | Mid-stream peeking            | No false certainty from interim looks       |  
  | 20 sites, 1 true effect       | Avoids >1 false positive (multiplicity control) |  
  | True null effect              | Rare false alarms (<5% over many studies)   |  
  | Trivial real effect (e.g., 0.1% change) | Correctly labels "too small to matter" |  
  | Hidden model flaw (e.g., autocorrelation) | Conclusion doesn't reverse if flaw is later found |  

  ### **Your Four Requirements: Legitimacy Check**  
  - **(a) Technician execution w/o understanding**: **Legitimate but dangerous**. Achievable with rigid workflows, but invites misuse (e.g., p-hacking). *Compromise: Simple tools + automated checks*.  
  - **(b) "Inconclusive" without paralysis**: **Non-negotiable**. Framework must quantify ambiguity (e.g., interval width).  
  - **(c) Verdict stable under +1 season**: **Non-negotiable stopping-rule invariance**. p-values fail this; Bayes succeeds.  
  - **(d) Adversarial reproducibility**: **Non-negotiable**. Requires open data/code and deterministic methods.  

  **Tension**: (a) and (c) conflict because (c) demands *theory* (e.g., likelihood/Bayes principles) to ignore stopping rules, while (a) often relies on procedural simplicity (e.g., fixed *n* tests). Technicians following cookbook NHST *will* violate (c) if they peek at data.  

  ### **Philosophical Constraints: What Matters?**  
  - **Likelihood principle (LP)**: Not just philosophy. *Practical impact*: Violating LP (as NHST does) makes conclusions depend on *unobserved* intentions (e.g., "we might have collected more data"). **You can't ignore this**—adversaries *will* exploit it.  
  - **Long-run calibration**: **Non-negotiable for regulators**. Even if "repetitions" are hypothetical, error rates (Type I/II) justify decisions under uncertainty. Bayesian methods can approximate this with frequentist validation.  

  ### **Desiderata Conflicts**  
  - **"Unwinnable clash"**: Full *stopping-rule invariance* (LP) vs. *frequentist error control*. LP-compliant methods (Bayes) don't guarantee long-run error control without tuning.  
  - **"Achilles' heel"**: *Tiny samples* break nearly all frameworks. Nonparametric/bootstrap methods help but need *n*≥5.  
  - **"Candidate killer"**: Requirement (7) (*distinction preservation*) eliminates most "easy" replacements (e.g., Bayes factors without error rates).  

  ### **Contenders Report Card**  
  *(Against your context: ⚠️ = major flaw; ✅ = strength)*  

  1. **Preregistered NHST + Effect Sizes + Power**  
     - ✅: Regulator-friendly (error rates), reproducible, handles "inconclusive" via power analysis.  
     - ⚠️: Fails stopping-rule invariance (peeking corrupts p-values). Multiplicity adjustments crush power at *n*<10. "No effect" claims require equivalence testing (complex).  
     - Verdict: **Workable only with ironclad preregistration**—but staff discipline is a gamble.  

  2. **Full Bayes + Stated Priors**  
     - ✅: Stops-rule invariant, natural "inconclusive" (wide credible intervals), handles tiny samples (with informative priors).  
     - ⚠️: Priors invite adversarial attacks ("you biased the prior!"). Long-run error control isn't automatic. Technicians may misuse software defaults.  
     - Verdict: **Strongest candidate** if priors are community-negotiated (e.g., EPA guides) and intervals are validated for coverage.  

  3. **Decision-Theoretic (Cost-Loss)**  
     - ✅: Forces explicit decisions ("dredge/don't dredge" based on costs), focuses on relevance (not "statistical significance").  
     - ⚠️: Requires quantifying environmental costs (politically fraught). Obscures evidence strength (e.g., "dredge" could mean "weak evidence but high risk").  
     - Verdict: **Useful for actions, not for reporting evidence**. Pair with Bayes or intervals.  

  ### **Bottom Line**  
  **Adopt hybrid Bayesian decision analysis**:  
  - **Core**: Bayesian estimation (credible intervals) with default/community priors.  
  - **For decisions**: Layer cost-loss thresholds (e.g., "dredge if P(decline > 10%) > 80%").  
  - **For regulators**: Simulate frequentist properties (e.g., "if effect size = X, we'd detect it 90% of the time").  
  - **For staff**: Prebuilt scripts (R/Stan/Python) that ingest data, output intervals/risks. Technicians run but don't tweak.  

  **Sacrifices**: Strict long-run error control (mitigated by validation). Pure objectivity (offset by transparent priors).  
  **Retain**: Preregistration of sampling plans (not analyses) to deter hindsight bias.  

  This meets all non-negotiables except perfect small-sample performance (nothing does). Prioritize (b), (c), (d)—drop strict adherence to (a) if it risks (c). Use pre-registered Bayes to shut down "you peeked!" attacks, and lean on intervals/decision rules to force clarity on "inconclusive" or trivial effects.
