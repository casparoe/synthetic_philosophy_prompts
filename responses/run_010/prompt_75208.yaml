prompt: |-
  I've got a draft chapter on the demandingness objection that I've now rewritten twice, mostly because my own verdicts won't line up, and I want to use you as a sparring partner rather than a summarizer. So: skip the literature tour entirely, I've taught this material for years and I know the pond and the envelope and the whole fair-share/partial-compliance business. What I want is the machinery — principles stated precisely enough that I could tell whether they actually generate my intuitions or just decorate them.

  Here's what I'm currently defending, more or less. A demand is too much iff meeting it would leave you worse off than a reasonable-compliance baseline: the life you'd have if everyone in your position did their fair share, plus a sliding margin that grows with how bad things get if nobody else steps up. Second clause: costs made of goods that money cant buy back — a vocation, a relationship, an ability, a person's history with an object — count heavier than their welfare equivalent. Third: the baseline is measured at the moment of the demand, not across a whole life. Now the cases, and where I think this thing starts to leak.

  Drowning child, ruined suit, and ninety-nine other bystanders standing around with their phones out: wade in, required, no hesitation — and note the free riders are right there, which I'd have thought should trigger the margin clause. But: a hundred strangers will die unless someone sends $100,000 today; ninety-nine people exactly as rich as me refuse their $1,000 share; the agency asks me for the whole amount. I think I owe my $1,000 and maybe $1,500, and I do not think I owe $100,000, even though refusing it means ninety-nine preventable deaths that my $1,000 does nothing about. Those two look like the same structure and I judge them differently, and I can't tell whether that's a principled difference or a flinch.

  Then the drip case: a well-run charity emails me every day asking for $20. Each request is trivially cheap, and I think each one is required. But I also think that a person who answers all of them for twenty years has had their life eaten by morality, and I wouldn't call them admirable, I'd call them erased. So I'm committed to "obligatory, one at a time" and "unacceptable, taken together," and my third clause explicitly refuses to look at the aggregate. Related, and worse: tutoring a kid every Saturday for two years, which costs me nothing but hours I'd otherwise spend doomscrolling, and which plausibly does more good than the $20-a-day donations. I think it's not required. Money is demanded of me in a way that time simply isn't, and clause two doesn't explain that, because nothing irreplaceable is lost when I give up a Saturday.

  Cheaper pairs, same problem. Selling my grandmother's ring for $4,000 to buy nets: not required. Selling my second car, also $4,000, mild inconvenience: required. My reflex explanation is grief, and grief is just welfare, so maybe clause two is doing nothing — except that a kidney for a stranger is not required either, and that's a far bigger welfare hit, so now I've got two different-looking reasons giving the same answer. And then: a 1-in-50 chance of permanently losing the ability to enjoy music, taken to save a stranger's life. I think its required. Which surprises me, because in the ring case I exempted a much cheaper loss of exactly the same kind of good. Apparently probability launders identity-costs and I have no account of why.

  The one I keep going back and forth on: I can give $5,000 now, or wait ten years, when I'll be a full professor with a bigger salary and a paid-off house, and give $25,000. Waiting seems permitted and not required, but I honestly don't know what my baseline clause says about it, since it measures at the moment of the demand.

  So: give me the two or three candidate principles that come closest to my verdicts, each with a name and a one-sentence statement, then walk through it clause by clause telling me which case each clause is there to handle. Then tell me which of my verdicts each candidate has to overturn, and pick — I'd rather have one honest recommendation than a menu that saves everything at the cost of being unfalsifiable. Apply the survivor to the deferral case and to two cases you invent yourself where the survivor and its closest rival come apart, because I only trust a clause when I can see two principles disagreeing. And if you think one of my verdicts is just a tenured, comfortably paid person protecting himself, say which one and show me where it shows up in the principle. My co-teacher for the seminar thinks the entire demandingness debate is a rich-country excuse, so I want the version of this I could defend to her without blushing.
reasoning: |-
  Okay, the user is a philosophy professor working on a chapter about the demandingness objection in ethics. They've rewritten it twice and are stuck because their intuitions don't line up with their proposed principles. They want me to act as a sparring partner, not a summarizer. They've outlined their current framework—a reasonable-compliance baseline with a sliding margin, extra weight for irreplaceable goods, and moment-of-demand measurement—and listed cases where it leaks.

  First, I need to understand their framework deeply. The baseline is what life would be like if everyone did their fair share. The sliding margin adjusts for how bad things get when others don't comply. Clause two gives more weight to non-fungible goods like relationships or vocations. Clause three measures costs at the exact moment of demand, not aggregated over time.

  Now, looking at their problem cases:
  1. **Drowning Child vs. $100k Donation**: Both involve others' non-compliance, but they judge them differently. In drowning, saving is required despite free-riders; in donation, they feel only $1-1.5k is owed, not the full $100k. Why the disconnect?
     
  2. **Drip Charity & Tutoring**: Small daily donations feel obligatory individually but overwhelming collectively. Tutoring time isn't demanded like money, even when welfare-equivalent or more effective. Clause three (no aggregation) clashes with the "erased life" intuition.

  3. **Grandma's Ring vs. Second Car**: Selling the ring ($4k) isn't required; selling the car is. They attribute this to grief—but grief is welfare, which should be fungible. Yet kidney donation isn't required either, which *is* a big welfare hit. Then the 1-in-50 music-loss risk *is* required, contradicting the ring exemption. Probability seems to "launder" identity-costs.

  4. **Deferred Donation**: Waiting to donate more later feels permitted but not required. Clause three (moment-of-demand) might not handle future capacity well.

  The user wants candidate principles that come closest to their verdicts, with names and one-sentence statements. Then, an analysis of which clause handles which case, which verdicts each candidate must overturn, and a recommendation. Finally, apply the best principle to the deferral case and new test cases.

  Key tensions in their intuitions:
  - **Partial Compliance**: They reject "fair share plus margin" in the $100k case but accept it in drowning. Why? Maybe immediacy/physical presence vs. abstract donation? Or threshold effects (each dollar does nothing alone vs. saving a life directly)?
  - **Aggregation**: They oppose aggregating demands over time (drip charity) but intuitively feel the cumulative cost is too high. This suggests a lifetime cap or agent-relative limits.
  - **Non-Fungible Goods**: Grandma's ring vs. probabilistic music-loss—why is the latter required? Maybe risk vs. certainty changes the identity-cost? Or shared humanity overrides personal attachments in life-death cases?
  - **Money vs. Time**: Tutoring isn't demanded like money. But why? Social conventions? Or is time inherently more personal?

  Candidate principles:
  1. **Scaled Hybrid Baseline**: Keeps their core but adds aggregation limits and clarifies non-fungible goods. Might handle drip charity via anti-cumulation but struggles with tutoring (time vs. money).
  2. **Agent-Relative Resilience**: Focuses on preserving core capacities for a meaningful life. Explains tutoring (doomscrolling time isn't core) and ring/kidney cases (identity vs. bodily integrity). But might struggle with deferred donation and music-risk case.
  3. **Constrained Outcome Optimization**: Maximizes good within limits of fairness and personal integrity. Handles $100k case (unfair burden) and drip charity (slippery slope) but may contradict their ring verdict.

  **Recommendation**: Agent-Relative Resilience fits best. It:
  - Explains drowning vs. $100k (physical action preserves resilience; $100k undermines it).
  - Handles drip charity via core-capacity protection.
  - Justifies ring > car (identity-attachments are core) and kidney exemption (bodily integrity is core).
  - Makes music-risk required (low probability; doesn't threaten core resilience).
  - For deferred donation: Waiting is permitted if it doesn't erode current resilience and future donation aligns with life goals.

  **Test Cases**:
  - **Family vs. Stranger Rescue**: Agent-Relative Resilience permits saving family (core relationship) even if strangers suffer slightly more. Scaled Hybrid might demand impartiality.
  - **Career Sacrifice**: Quitting academia to work in aid isn't required if it destroys vocational identity. Constrained Optimization might demand it if impact is high.

  **Blush Test**: The framework doesn't excuse the rich—it demands significant but sustainable sacrifices. The sliding margin grows with global need, pushing affluent agents harder. The $100k refusal is condemned as unfair, not excused.

  **Verdicts to Overturn**: In tutoring, Agent-Relative Resilience says not required (doomscrolling time isn't core; redirecting it doesn't threaten resilience). But the user initially thought it wasn't demanded—this aligns. However, they might need to accept that money and time are treated differently based on how they impact core capacities, not social norms.

  **Hard Truth**: In the music-risk case, they might be underestimating the low probability. A 2% risk is meaningfully different from certain loss (ring), so it's consistent under Agent-Relative Resilience.

  This should give the user a coherent, defensible framework that captures most intuitions without special pleading.
answer: |-
  Here's the sparring session you requested. I'll treat your intuitions as fixed points and work backward to principles that capture them *without* making excuses for privilege. Your framework leaks in three places: partial compliance asymmetry, time/money disparity, and probabilistic laundering. Your verdicts push toward an agent-centered approach focused on preserving *core capacities for agency*, not just welfare. Below are three candidate principles distilled from your judgments, each named and stated precisely. I'll then dissect your clauses, show where each candidate overturns your verdicts, and pick the strongest contender. Finally, I'll apply it to your deferral case and new test cases.

  ---

  ### **Candidate Principles**
  1. **Scaled Hybrid Baseline**  
     *An agent is required to meet a demand only if the net cost to them, discounted for non-fungible goods and measured at the moment of demand, does not exceed the welfare deficit from the reasonable-compliance baseline by more than a margin proportional to the harm caused by others' non-compliance.*  
     (Closest to your draft but adds explicit discounting for non-fungibles.)

  2. **Agent-Relative Resilience**  
     *An agent is required to meet a demand only if doing so preserves their capacity to sustain core personal projects, relationships, and identity-constituting commitments, with the permissible sacrifice threshold scaling inversely with global compliance and directly with the severity of the prevented harm.*  
     (Your verdicts prioritize protecting agency-grounding goods over welfare parity.)

  3. **Constrained Outcome Optimization**  
     *An agent is required to meet a demand if it maximizes expected good subject to the constraint that their lifetime welfare, adjusted for non-fungible losses, does not fall below the reasonable-compliance baseline, with costs assessed per opportunity.*  
     (Aggregates costs but exempts identity-constituting goods.)

  ---

  ### **Clause-by-Clause Breakdown: What Each Handles**
  - **Reasonable-Compliance Baseline + Sliding Margin**:  
    Handles *drowning child* (margin absorbs free-riders due to immediate harm) and *$100k donation* (margin doesn't trigger because harm is abstract/aggregate).  
    **Leak**: Your asymmetric verdicts show the margin responds to *proximity/salience*, not just harm severity. Drowning triggers it; distant deaths don’t.  

  - **Non-Fungible Goods Weighting**:  
    Handles *grandma’s ring* (exempt due to identity-cost), *second car* (fungible cost required), and *kidney* (exempt as bodily integrity is non-fungible).  
    **Leak**: *1-in-50 music loss* is required despite being non-fungible because low probability "launders" identity-costs into risk—clause doesn’t account for uncertainty.  

  - **Moment-of-Demand Measurement**:  
    Handles *drip charity* (each $20 is trivial at t) and avoids lifetime aggregation.  
    **Leak**: *Tutoring* isn’t required despite fungible time-cost because time feels qualitatively different from money—clause ignores *resource-type* distinctions.  

  ---

  ### **Which Candidate Overturns Which Verdicts?**
  | **Your Verdict**                          | Scaled Hybrid Baseline | Agent-Relative Resilience | Constrained Outcome Optimization |
  |-------------------------------------------|------------------------|---------------------------|----------------------------------|
  | **Drowning: required**                    | Keeps                  | Keeps                     | Keeps                            |
  | **$100k: not owed beyond $1.5k**          | Keeps                  | Keeps                     | *Overturns*: requires full $100k if baseline welfare permits |
  | **Drip charity: each $20 required**       | Keeps                  | Keeps                     | Keeps                            |
  | **Drip charity aggregate: unacceptable**  | Keeps (no aggregation) | Keeps                     | *Overturns*: requires all if baseline not breached |
  | **Tutoring: not required**                | *Overturns*: fungible cost must be paid | Keeps                  | *Overturns*: requires if net good exceeds doomscrolling |
  | **Grandma’s ring: not required**          | Keeps                  | Keeps                     | Keeps                            |
  | **1-in-50 music loss: required**          | *Overturns*: non-fungible cost exempt | Keeps (low risk preserves core capacity) | Keeps |
  | **Kidney: not required**                  | Keeps                  | Keeps                     | Keeps                            |

  **Scaled Hybrid** fails tutoring (treats time as fungible) and music risk (exempts all non-fungible costs).  
  **Constrained Optimization** fails $100k case (demands full burden), drip aggregate (demands endless donations), and tutoring (ignores time’s agent-relative value).  
  **Agent-Relative Resilience** keeps *all* your verdicts except potentially the tutoring case—but your intuition there aligns with its logic (more below).

  ---

  ### **Recommendation: Agent-Relative Resilience**
  **Why?** It uniquely handles your leaks:  
  - **$100k vs. drowning asymmetry**: Physical rescue preserves core agency (you act directly); paying $100k alone *undermines* resilience (financial ruin destroys future capacity to help).  
  - **Time vs. money disparity**: Time spent tutoring isn’t just welfare—it’s a *claim on attention* central to autonomy. Money is external; time is constitutive.  
  - **Probability laundering**: Low-risk sacrifices (1-in-50 music loss) don’t threaten core capacities; certain losses (ring, kidney) do.  
  - **Co-teacher defense**: Demands scale globally (e.g., climate obligations on rich countries), but protects fundamental autonomy—no indulgence for privilege.

  **Hard truth**: Your tutoring verdict (*not required*) is correct under this principle, but your reflex ("money is demanded, time isn't") is incomplete. The real reason: redirecting doomscrolling time to tutoring *enhances* agency (it replaces low-value activity without eroding core projects). If tutoring conflicted with your vocation, it would be exempt. This isn’t self-protection—it’s about sustainable moral agency.

  **Verdict to overturn?** None, but you must accept that **tutoring is permissible but not required** because it doesn’t threaten resilience. If you think it *should* be required, you’d need Constrained Optimization and must drop the $100k verdict.

  ---

  ### **Applying Agent-Relative Resilience to Your Cases**
  1. **Deferred Donation ($5k now vs. $25k later)**:  
     - Permitted, not required. *Why?* At the moment of demand, $5k may marginally affect resilience (e.g., delaying home repairs). Waiting leverages future capacity without breaching current core agency. Sacrificing *present* resilience for greater future impact is supererogatory.  

  2. **New Test Case 1: Family Rescue**  
     *Your sister and a stranger are drowning. You can save one. Saving your sister costs you a career opportunity (non-fungible); saving the stranger saves a slightly more impactful scientist.*  
     - **Agent-Relative Resilience**: Permitted to save sister. Family bonds are core to identity; sacrificing them undermines resilience.  
     - **Closest Rival (Scaled Hybrid)**: Requires saving the scientist (greater welfare gain outweighs non-fungible loss).  
     - **Verdict Split**: Resilience protects relationships; Hybrid optimizes welfare.  

  3. **New Test Case 2: Career Sacrifice**  
     *Quitting your tenured job to work full-time in a refugee camp would save 100 lives/year. It would end your academic work and strain your marriage.*  
     - **Agent-Relative Resilience**: Not required. Vocation and core relationships are resilience pillars.  
     - **Closest Rival (Constrained Optimization)**: Required if lifetime baseline isn’t breached (100 lives/year >> professorial welfare).  
     - **Verdict Split**: Resilience exempts identity-constituting sacrifices; Optimization demands maximal good within fairness.  

  ---

  ### **Final Tune-Up**
  **Where’s the flinch?** In the **$100k case**, you resist owing more than $1.5k. Agent-Relative Resilience *agrees*—but not because you’re protecting privilege. It’s because financial ruin would destroy your capacity to *be* an effective moral agent long-term. If you could pay $100k without bankruptcy (e.g., billionaire), it would be required. Your drowning verdict is consistent: immediate physical action doesn’t erode resilience.  

  **Blush defense**: This principle condemns inaction where core capacities *aren’t* threatened (e.g., buying luxury goods while children starve). The sliding margin grows with global non-compliance—so rich countries face steeper demands. But it never reduces agents to mere efficiency engines. Your co-teacher might still call it too lenient, but it’s not an *excuse*; it’s a theory of moral sustainability.  

  If you adopt this, tighten clause two: "Costs to identity-constituting commitments, relationships, or abilities essential to agential resilience count infinitely against demands, with probabilistic discounts for low-risk sacrifices." That covers the ring/kidney/music cases. Ditch moment-of-demand measurement—it’s redundant, as resilience is assessed per-context. Now go rewrite.
