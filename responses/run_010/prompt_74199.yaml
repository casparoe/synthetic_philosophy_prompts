  | "He respected that echo... real *to them*." | Both / Family     | Validates the subjective *experience* of the reporter, agnostic about objective reality. | Yes               | Yes               | Empathy and purpose; connects to why Ray's work matters to people.                      |
  | "Does the projector run... lights come on?" | Lab People / Ray  | Directly references the core philosophical debate (Malcolm/Dennett). | N/A (Names it)    | N/A (Names it)    | Acknowledges the elephant in the room directly to those who get it; shows honesty.      |
  | "I know Ray showed up... marks on lives." | Family / Both     | Shifts firmly to observable actions, dedication, and tangible consequences (headboard). | Yes               | Yes               | Grounds the toast in undeniable reality (Ray's actions, Dad's condition); deep emotional weight. |
  | "meticulously mapping... human *reporting*" | Lab People        | Defines the scientific value purely in terms of collected data (reports), not inferred events. | Yes               | Yes               | Legitimizes his career scientifically/philosophically to peers within the constraint.    |
  | "keeper of the midnight confessions... waking moment" | Both              | Poetic framing of his role focused purely on the *reporting act* and its significance. | Yes               | Yes               | Sums up his career beautifully within the constraint; resonant and honoring.            |
