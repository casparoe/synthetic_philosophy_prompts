  Here’s a toast that honors Ray’s career while respecting the philosophical complexities, followed by the requested analysis table.

  **The Toast (Approx. 5 minutes spoken):**

  (Lift glass) Ray, family, friends, fellow tinkerers with the human condition... gather 'round. When Ray asked *me* to do this toast, I figured it was either a testament to his sense of irony or punishment for winning the last Thanksgiving argument about... well, we’ll get to that. See, Ray deals in the mysteries of the sleeping mind. I deal in ducts and thermostats. My world is airflow; his is... whatever flows when the lights go out.

  For 33 years, Ray ran the sleep lab. Think about that. Thirty-three years of darkened rooms, blinking monitors, and the profound silence of 3 AM. Thirty-three years of gently waking people – sometimes startlingly awake! – in that fragile space between worlds, leaning in, notebook ready, and asking the simplest, most impossible question: "What was *that*? What just happened? Tell me."

  *(Pause, look at Ray)*

  He didn’t just ask the question, Ray truly *listened*. To the whispers, the gasps, the elaborate tales spun seconds after eyelids fluttered open. He listened to people grappling with the residue of the night – whether it was a fleeting wisp of feeling or an epic saga involving flying over Toledo with their third-grade teacher. He documented the *reports*. The impressions upon waking. The stories people brought back from the dark.

  And that’s the thing about Ray’s work. Forget the fancy machines for a second. At its heart, it was about bearing witness. Being present in that intimate, vulnerable moment when someone tries to grasp at the fragments left behind by sleep. He created a space where people could say, "This is what I *remember*. This is the echo I woke up with." He respected that echo, whatever it was. He treated it as real *to them*.

  I know this firsthand. We’ve shared a table, argued ideas – big ideas about what’s *really* happening when we sleep. Does the projector run all night, or does the tape just get played when the lights come on? Honestly, Ray? After all these arguments, I still don’t know the answer. But here’s what I *do* know, absolutely:

  *(Look around the room)*

  I know Ray showed up. Night after night. I know he cared deeply about understanding what sleep *does* to us, how it shapes us, how it can sometimes go wrong in ways that leave marks – marks on headboards, marks on lives. He saw that. He saw it because of his Dad, and he dedicated his life to understanding it for others. He cared about the people in those beds, grappling with their own night-time experiences, whatever their nature. He cared about the *process* of trying to understand.

  He wasn’t just chasing phantoms; he was meticulously mapping the territory of human *reporting*. He charted the landscape of what we *say* happens when we dream. And that landscape is vast, fascinating, and deeply human. It reveals our fears, our hopes, the strange plumbing of our minds. Ray spent his career sitting by the bedside, notebook in hand, faithfully recording the messages washed ashore by the tide of sleep.

  So, Ray, while philosophers might debate what flickers on the screen in the dark, there’s no debating the light you brought to that lab. You were the keeper of the midnight confessions, the archivist of the waking moment, the guy who took the echo seriously. You built a career, not just on chasing dreams, but on the profound act of listening to people trying to make sense of their own nights.

  Here’s to 33 years of showing up in the dark. To 33 years of asking, "What was that?" To 33 years of listening, truly listening, to the answers. To Ray – a man who dedicated his working life to the profound mystery of what we bring back with us when we open our eyes. Cheers!

  **(Clink glasses)**

  ---

