answer: |-
  ## Project Title: The Architecture of Normative Independence: Disentangling Existence, Guidance, and Access Conditions for Reasons

  **1. Research Question & Possible Answers**
  This project asks: Does distinguishing three categories of putative reasons – orphan reasons (exist but inaccessible/unguiding), residual reasons (persist after originating context vanishes), and vacant reasons (bind non-actual agents) – yield significant philosophical insights into the structure of normative realism, particularly concerning the distinctness of the existence, guidance, and access conditions for reasons? The question has a determinate answer: Yes, it yields significant insights; No, it does not yield significant insights; or a qualified answer specifying *which* distinctions yield insights and under what conditions.

  **2. The Gap in Existing Positions**
  Normative realism asserts that reasons exist independently of contingent human attitudes. However, realists disagree sharply on the *scope* of this independence, a disagreement muddied by the conflation of three distinct conditions:
  *   **(i) Existence:** What constitutes a reason *obtaining*.
  *   **(ii) Guidance:** What enables a reason to *motivate* an agent.
  *   **(iii) Access:** What enables a reason to be *discovered* or *recognized*.

  Bernard Williams’ internalism effectively collapses (i) into (ii): a reason exists *only if* it can motivate a particular agent (via their "subjective motivational set"). The existence condition is parasitic on the guidance condition. Conversely, robust realists like Derek Parfit affirm the independence of (i), often treating (iii) as relatively unproblematic or secondary. When robust realism addresses access, it typically does so through intuition or rationalist insight, rarely accounting for the *cost* of positing reasons that are radically inaccessible in principle (beyond idealized rational capacities). J.L. Mackie’s "queerness" objection gains traction precisely when we imagine reasons that exist (i) but fail *both* guidance (ii) and access (iii) – they seem bizarrely detached from any conceivable agent or practice.

  The conflation does unacknowledged work:
  *   **For Internalists:** Collapsing (i) into (ii) avoids the ontological queerness Mackie highlights but renders them silent or forced into subjectivism about cases like obligations to the dead or distant future people, where guidance (ii) is absent. It makes residual and vacant reasons impossible by definition.
  *   **For Robust Externalists:** Treating (iii) as trivial or ignoring the tension between radical independence and access allows them to affirm the existence of orphan or vacant reasons but leaves them vulnerable to Mackie’s charge that such reasons are explanatorily inert "queer" entities. They struggle to explain *how* we access reasons utterly detached from human capacities or history.

  Both traditions owe a clear account of *what happens* to reasons when the conditions come apart – which their current frameworks obscure by conflating the conditions. This project aims to isolate these points of divergence.

  **3. Method: Case Construction & Discriminatory Testing**
  The core method involves systematically constructing scenarios where precisely two of the three conditions (existence, guidance, access) hold, while the third fails. For each pair of conditions held constant, we design cases to test whether competing theories of reasons yield *different* verdicts on the existence of a putative reason. The discriminatory power lies in forcing theories to reveal their commitments where conditions diverge.

  **Specimen Case: The Sealed Promise (Testing Existence vs. Guidance/Access)**
  *   **Scenario:** A linguist, Dr. Aris Thorne, records the last fluent speaker of the language Kaelic. Aware of the speaker's cultural sensitivities about dissemination, Thorne extracts a solemn promise from her sole graduate student, Lena Vance: the recordings must remain sealed until Vance's death. Thorne and Vance die shortly after. Decades later, the tapes reside in a university archive. The archive's access policy, set long after both deaths by individuals entirely unaware of Thorne, Vance, or the Kaelic speaker, strictly prohibits access to unprocessed materials of this age. The physical tapes are fragile but currently intact.
  *   **Condition Analysis:**
      *   *Existence:* Does a reason to honor Thorne's promise (keep the tapes sealed until Vance's hypothetical death date passed) *obtain*?
      *   *Guidance:* Can *any* actual agent be motivated by this reason? No one alive knows of the promise or has any subjective tie to it. Acting "to honor the promise" is impossible without knowing it exists.
      *   *Access:* Can *any* actual agent discover this reason? The promise is unrecorded; Thorne and Vance are dead; the archive policy prevents accessing the tapes to find clues. Discovery is practically impossible.
  *   **Discriminatory Test:**
      *   *Williams-style Internalism:* Collapses existence into guidance. Since no current agent can be guided by this promise (no relevant subjective motivational set element), *no reason exists*. The promise creates no residual reason.
      *   *Robust Parfitian Realism:* Affirms independence. The reason *exists* based on the past promissory act and its normative force, regardless of current access or guidance. The reason is residual.
      *   *Constructivism/Response-Dependence:* Likely denies the reason exists, as it depends on actual or hypothetical responses of agents, which are absent here. The promise is inert.
      *   *Mackie's Queerness:* Highlights this case as exemplifying the problem: What *is* this "reason" floating free, doing no work, inaccessible? It seems ontologically queer.
  *   **Variations:**
      *   *Tapes Destroyed:* If the tapes are destroyed, does the reason vanish (suggesting existence depends on potential access/object?) or persist abstractly? Tests dependence of existence on object.
      *   *Access Possible but Guidance Impossible:* Suppose the promise is documented in Vance's diary in the archive, accessible but concerning an act (keeping specific tapes sealed) that is meaningless or impossible now (e.g., tapes already digitized and public). Tests separation of access and guidance.

  This method will be applied to generate cases isolating each pair of conditions (e.g., existence + access but no guidance; existence + guidance but no access; access + guidance but no existence) across different normative domains (promises, duties of beneficence, epistemic obligations), focusing on generating orphan, residual, and vacant reason candidates.

  **4. Realistic Scope & Staged Plan (24 months, PI 20%, Postdoc 100%)**
  *   **Months 1-6 (Postdoc Start):** Refinement of condition definitions and case-generation protocols. Preliminary mapping of theoretical positions onto the framework. Initial construction of core case types (orphan, residual, vacant).
  *   **Months 7-12:** Systematic case generation and discriminatory testing against primary competing theories (Internalism, Robust Realism, Constructivism, Error Theory, Expressivism). Development of the "catalog of divergence": documenting where and how theories yield conflicting verdicts on cases. **Deliverable at Month 12: A detailed catalog of constructed cases, analysis of theoretical verdicts, and preliminary assessment of the philosophical pressure points revealed.** *Value if Thesis Collapses:* This catalog remains a valuable resource mapping fault lines in normative theory, demonstrating where different commitments lead to divergent judgments about specific, hard cases. It clarifies the theoretical landscape irrespective of the success of the tripartite distinction.
  *   **Months 13-18:** Analysis of implications: What does the pattern of divergences tell us about the necessity/utility of distinguishing the three conditions? How does it impact debates about queerness, normative explanation, the authority of reasons, obligations to the past/future? Drafting core argument.
  *   **Months 19-24:** Synthesis and writing. Preparation of 2-3 journal articles targeting specific debates (e.g., promises to the dead, future generations, moral epistemology). Final project report.

  **5. Explicit Failure Conditions**
  1.  **Distinction Genuine but Idle:** Evidence: Despite successfully constructing cases where conditions diverge and theories yield different verdicts, the distinctions fail to illuminate *new* problems, resolve *existing* stalemates, or provide a *superior framework* for understanding normative disagreement. The catalog exists, but it doesn't change how we understand realism, internalism, or queerness arguments. It merely confirms known theoretical splits without advancing the debate.
  2.  **Cases Fail to Isolate Conditions:** Evidence: Rigorous analysis reveals that the constructed cases inevitably smuggled in assumptions about one condition when supposedly isolating the others, or that plausible interpretations of the cases always allow at least two conditions to be satisfied together under any mainstream theory. The discriminatory test fails because the cases are not cleanly separable.
  3.  **Theoretical Stasis:** Evidence: Competing theories simply dig in their heels when confronted with divergent verdicts on these cases, offering ad-hoc explanations consistent with their core tenets but providing no new argumentative leverage. The project fails to shift the dialectic.

  **6. What is at Stake? (For Non-Philosophers)**
  This project investigates the foundations of claims about what we *ought* to do or believe. Specifically, it tackles questions like:
  *   **Obligations to the Dead:** If someone made a promise to a dying person, does that promise still create a "reason" for action, even after everyone involved is gone and no one knows about it? Or is it just a historical fact with no present force?
  *   **Future People Who May Never Exist:** Do we have obligations concerning people who *might* exist in the future, but whom we know *never actually will* exist (e.g., due to choices we make now)? Is there a "reason" to act as if they might?
  *   **The Explanatory Power of Morality:** Critics argue that if moral facts or reasons are completely independent of us, they become mysterious – how could they influence us or explain our actions? This project examines whether positing reasons utterly disconnected from human recognition or motivation (like "orphan reasons") makes morality seem implausibly detached from the real world. Can realism convincingly answer this challenge, or does it need refinement?

  The stakes are conceptual clarity about the nature of moral demands themselves. It does not directly solve practical dilemmas about archives or future planning, but aims to clarify the *kind* of reasons we might appeal to in such debates. The significance is in rigorously testing the structure and limits of a major philosophical position (realism), not in immediate policy implications.

  **7. Reflexivity: Does the Idiom Prejudge?**
  Yes, using the terms "orphan reasons," "residual reasons," and "vacant reasons" risks presupposing that reasons *do* exist in these cases, potentially favoring realism from the outset. To maintain neutrality:
  *   **Conditional Investigation:** The project investigates *whether* putative reasons of these types *exist* and *what work* the distinctions between existence, guidance, and access conditions do *if we assume*, for the sake of argument, that normative realism is roughly correct. It tests the *internal coherence and utility* of realism under pressure from these cases.
  *   **The Error Theory Option:** The investigation explicitly includes Mackie's Error Theory as a competitor. The discriminatory test asks if Error Theory provides the *best* explanation for these cases (i.e., that they reveal the queerness of supposing such reasons exist at all). The verdicts for Error Theory ("No reason exists in *any* such case") will be cataloged alongside realist verdicts.
  *   **Focus on Divergence:** The primary goal isn't to prove such reasons exist, but to show that *if* one holds a realist view, then *how* one distinguishes or conflates these conditions significantly impacts the view's plausibility and its ability to handle Mackie's challenge. The project maps the logical space within and around realism revealed by these distinctions. The labels serve as heuristic placeholders for types of *putative* reasons whose status is precisely what's under investigation. The success of the project hinges on whether the distinctions generate productive philosophical friction, regardless of whether realism is ultimately vindicated.
