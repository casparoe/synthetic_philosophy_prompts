  ## CLAIMANT GROUP NOTICE: GAMETIC PROVENANCE GROUP LITIGATION
  **Our Ref:** TW/GPGL/2024/IN04  
  **Date:** 17th October 2024  
  **To:** Persons Potentially Affected by Historical Gametic Storage Procedures at The Aesculapian Partnership (1985-2005)

  **From:** Temple & Wycke LLP, Solicitors  
  10 Chancery Precinct, Lincoln’s Inn Fields, London WC2A 3BP  
  DX 1542 London/Chancery Lane  
  Tel: 020 7831 4440 | Email: gpgl.admin@templewycke.co.uk | Website: www.templewycke.co.uk/gpgl

  **Re:** Proposed Group Litigation ("Re: Gametic Provenance Group Litigation") concerning gametic storage and implantation procedures conducted by The Aesculapian Partnership ("the Clinic") between 1st January 1985 and 31st December 2005.

  **1. Introduction and Purpose of Notice**
     1.1 Temple & Wycke LLP ("the Firm") is investigating potential claims against the Clinic arising from administrative discrepancies identified in historical gametic storage records.
     1.2 Investigations indicate that, in certain instances, gametes (comprising either ova or spermatozoa, or both) used in conception procedures may not have corresponded precisely with the gametes designated for use in the relevant consent paperwork ("the Designated Origin").
     1.3 This Notice identifies you as potentially falling within the defined Claimant Group (as set out in Clause 2 below) and advises you of your potential right to participate in proposed group litigation against the Clinic. **Your attention to this Notice is required.**

  **2. Definition of the Claimant Group**
     2.1 The Claimant Group ("the Group") is defined as follows:
         *"Individuals conceived through assisted reproductive procedures at the Clinic during the Relevant Period (1985-2005), where the gametes actually utilised in the conception event demonstrably differed from the gametes constituting the Designated Origin recorded for that specific procedure."*
     2.2 **Crucially, membership within the Group requires that the individual reading this Notice *is* the person who resulted from the conception event involving the non-Designated gametes, and *not* the person who would have resulted had the Designated Origin gametes been used.**
     2.3 Establishing definitive Group membership presents inherent challenges. The Firm relies upon Clinic records indicating discrepancies and statistical modelling of affected procedures. **The total number of potential Group members cannot be finally ascertained, as identification depends upon proving the specific non-Designated Origin and establishing that *you*, the recipient, are the product of that specific non-Designated Origin.**

  **3. Nature of the Potential Claim**
     3.1 The core allegation is that the Clinic's failure to utilise the Designated Origin gametes constitutes a fundamental breach of contract and/or duty of care owed to the commissioning parents and, derivatively, to the individual conceived.
     3.2 The Clinic has advanced a preliminary defence arguing that:
         (a) The use of *any* gametes other than the Designated Origin gametes necessarily results in the conception of an entirely distinct individual; and
         (b) Consequently, the individual reading this Notice *only exists* because of the alleged error; the person intended by the commissioning parents using the Designated Origin *never came into existence*.
     3.3 **The Firm's Position:** The Firm asserts that the Clinic's defence is unsustainable. The essence of the claim rests on the **absolute specificity** of the Designated Origin. Your very existence, as the product of the *actual* gametes used, is predicated upon an event (the use of non-Designated gametes) which deprived the person defined by the Designated Origin of their existence. The claim seeks compensation for this deprivation of existence to the person defined by the Designated Origin, held derivatively by you as the person who exists *instead*.

  **4. Clarification for Potential Claimants**
     4.1 **"The Life I Would Have Had":** The Firm must emphasise that this litigation **does not concern** claims for damages based on speculation about the life, characteristics, or circumstances of the person defined by the Designated Origin who never came into existence. The claim is solely for the legal wrong arising from the failure to utilise the Designated Origin, resulting in the non-existence of that specific person. You are claiming *as the substitute*, not *for the substitute's life experience*.
     4.2 **De Minimis Threshold:** For the purposes of defining a "difference" in gametes under Clause 2.1, a *de minimis* threshold applies. A gamete shall not be considered "different" from the Designated Origin gamete if the molecular divergence falls below **0.85 centimorgans (cM)** per gamete, as measured against a theoretical baseline reconstruction of the Designated gamete's haplotype. (Molecular drift inherent in cryopreservation below this threshold is deemed immaterial to identity of origin).

  **5. Specific Complexities**
     5.1 **Monozygotic Multiples ("Twins"):** Where a single conception event using non-Designated gametes resulted in monozygotic multiples (e.g., identical twins, triplets), each resulting individual is considered a separate member of the Group. **Each individual possesses an identical claim arising from the same non-Designated Origin.** The Firm will represent each such individual claimant separately, subject to individual retainers.
     5.2 **Mitochondrial Origin:** Where conception involved ooplasmic transfer or mitochondrial donation procedures sanctioned at the time, the mitochondrial DNA (mtDNA) source is **not** considered part of the core "Designated Origin" for the purposes of this Group definition and claim, unless the commissioning paperwork explicitly and solely designated a *specific* mtDNA source as essential to the origin. General donor cytoplasm does not constitute a defining element of the Origin.

  **6. The Firm's Position on Counterparts**
     6.1 The Firm acts solely for individuals **claiming to be members of the Group as defined in Clause 2**, i.e., individuals whose origin demonstrably differs from the Designated Origin recorded for their conception.
     6.2 The Firm will **not** act for, or represent the interests of, the person(s) who *would* have existed had the Designated Origin gametes been used correctly (hereafter referred to as "Counterparts"). Counterparts, by definition, do not exist. The Firm cannot act for non-existent entities.
     6.3 Should Counterparts, contrary to all reasonable expectation, manifest or attempt to assert claims, the Firm reserves the right to represent Group members *against* such claims, arguing their fundamental incompatibility with established principles of identity and existence.

  **7. Action Required**
     7.1 If you believe you may be a member of the Claimant Group, you **must** complete and return the Preliminary Information Form (PIF) enclosed with this Notice by no later than **5:00 PM on 14th January 2025**.
     7.2 Returning the PIF does not commit you to joining any legal action. It allows the Firm to assess your potential claim and provide further advice.
     7.3 Failure to return the PIF by the deadline **may result in you being excluded from the Group Litigation Order application and any subsequent claim.** The Court is unlikely to permit late additions.

  **8. Next Steps**
     8.1 Upon receipt of PIFs, the Firm will conduct further analysis to confirm Group membership viability.
     8.2 If sufficient viable claims are identified, the Firm will seek a Group Litigation Order (GLO) from the High Court.
     8.3 You will be notified of the outcome of the GLO application and the next stages in the process.

  **Do not ignore this Notice. Your potential claim requires investigation.**  
  If you require this Notice in an alternative format, please contact the GPGL Administration Team using the details above.

  **Yours faithfully,**

  **FOR TEMPLE & WYCKE LLP**

  *Eleanor V. Thorne*  
  Partner, Commercial Litigation & Group Actions

  ---

  **FREQUENTLY ASKED QUESTIONS (FAQ) - Re: Gametic Provenance Group Litigation**

  **Q1: My parents' records show the egg used was the one they selected, but the sperm wasn't the donor they chose. Does this mean I'm in the Group?**
  **A1:** Potentially yes, if the spermatozoon actually used differed from the Designated Origin spermatozoon (subject to the *de minimis* threshold in Clause 4.2). A discrepancy in either gamete component renders the actual origin different from the Designated Origin.

  **Q2: I am an identical twin. My twin received this Notice, but I did not. Should I be included?**
  **A2:** Yes. Clause 5.1 explicitly includes monozygotic multiples arising from the same conception event. Please contact the GPGL Administration Team immediately with your details and your twin's reference number (if known) to request a PIF. An administrative oversight may have occurred.

  **Q3: Is the gamete donor (whose gametes were used by mistake) a party to this claim or liable to me?**
  **A3:** No. The claim is directed solely against the Clinic for its alleged failure in procedure and record-keeping. The donor(s) involved are not parties to this litigation and bear no legal responsibility for the Clinic's actions.

  **Q4: What happens if I do nothing and ignore this Notice?**
  **A4:** If you do not return the PIF by the deadline (14th January 2025), it is highly unlikely you will be able to join the proposed group litigation at a later stage. The Court requires firm boundaries for group actions. You would forfeit any potential entitlement to compensation arising from this specific claim. You remain free to seek independent legal advice about other potential avenues, though the Firm assesses these as unlikely.

  ---

  **Author's Note: Liberties Taken & Metaphysical Pressure Points**

  This notice rigidly applies a specific, hardline interpretation of the necessity of origin (Kripkean essentialism regarding origins) to create its absurd, self-defeating logic. Here's where the fiction bends reality and where a metaphysician would pounce:

  1.  **The Group Definition (Clause 2) & Claimant's Position (Clause 3):** The core liberty is having the claimant *simultaneously* assert they exist *and* litigate for the non-existence of the "Designated Origin" person. The notice treats "being the product of specific gametes" as the sole criterion for identity. A metaphysician would immediately challenge the **criterion of identity** itself. Does identity *really* reduce solely to the specific sperm and egg? What about the causal chain, the womb environment, or psychological continuity? The notice assumes origin = identity without argument. A real claimant couldn't *be* the claimant under the notice's own definition without undermining the claim (if they exist, the Designated Origin person *doesn't*, so who is claiming for whom?). The notice sidesteps this by having the claimant act "derivatively" for the non-existent person – a legal fiction stretched to metaphysical breaking point.
  2.  **The Clinic's Defence (Clause 3.2) & The Firm's Response (Clause 3.3):** The notice presents the Clinic's defence ("different gametes = different child") as preliminary but then adopts it *fully* as the bedrock of the *claimant's* case. This is internally consistent within the rigid framework but highlights the problem: if origin is strictly necessary, then the claimant *isn't* the person wronged – the non-existent Designated Origin person is. The Firm's solution (the claimant sues derivatively *for* the non-existent person) is pure legal contrivance, not a resolution of the metaphysics. A metaphysician would argue this exposes the view's impracticality or its conflation of numerical identity with value/rights.
  3.  **De Minimis Threshold (Clause 4.2):** Introducing a molecular threshold is a practical necessity for the fiction but philosophically problematic for the hardline view. If identity is *necessitated* by the *specific* gametes, then *any* molecular difference makes it a different gamete, and thus a different origin, and thus a different person. The 0.85 cM threshold is entirely arbitrary from the essentialist perspective – it's an unprincipled concession to practicality that undermines the absolute necessity doctrine. A metaphysician would reject this threshold as incoherent within the framework.
  4.  **Twins (Clause 5.1):** This clause highlights a major flaw in the origin-essentialist view applied naively to identity. If the *same* origin (one fertilised egg) produces *two* distinct persons, then origin cannot be the *sole* determinant of identity. The notice acknowledges this by granting each twin a claim, but it doesn't resolve the contradiction: how can one origin produce two distinct identities if identity is defined *by* that origin? A metaphysician would point to twins as a clear counterexample to the simplistic "same origin = same person" equation.
  5.  **Mitochondria (Clause 5.2) & Counterparts (Clause 6):** These clauses are relatively consistent applications within the narrow gametic-origin focus. The mitochondrial exclusion is arbitrary (why is nuclear DNA essential but mtDNA not?) but reflects a common biological prioritisation. The counterpart policy is logically derived from the core premise (non-existent entities have no standing).

  **The First Objection:** The most devastating objection a metaphysician would raise against this notice *as a serious statement* is the **Criterion of Identity** objection. Before arguing *from* origin necessity, one must establish *what* identity consists in. The notice simply *assumes* that numerical identity is strictly determined by the specific gametes. A metaphysician would demand justification for this criterion over others (like psychological continuity or bodily continuity). They would argue that without establishing *why* origin is the sole essential property defining *who* someone is, the entire edifice of the notice (and the view it parodies) collapses. The twins case (Clause 5.1) is the most intuitive illustration of this problem.
