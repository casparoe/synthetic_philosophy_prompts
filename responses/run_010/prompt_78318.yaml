  ### 1. Decision Rules Consistent with the Standing List
  Based on the director's verdicts and reasoning, two decision rules are reconstructed. Both rules respect the constraints from the flash-lag case (where fabricated content is rejected, and later events editing earlier records imply Orwellian) and the metacontrast scope restriction (classification only applies when content is present and timing/ordering is misrepresented, not when presence is ambiguous).

  **Rule A: Fabricated Content vs. Edited Real Content**
  - **Stalinesque**: If the illusion involves **fabricated content** (i.e., perception of an event that never occurred physically, and the brain "stages" this content before it becomes conscious).
  - **Orwellian**: If the illusion involves **only misdating/misordering of real content** (i.e., the events were physically present, but their timing/position is retrospectively edited in the record after initial experience).
  - **Scope**: Applies only when content is unambiguously present and timing/ordering is at issue (excludes metacontrast masking).
  - **Consistency with standing list**:
    - Colour phi: Fabricated color change → Stalinesque.
    - Cutaneous rabbit: Fabricated intermediate taps → Stalinesque.
    - Flash-lag: No fabrication; real flash and moving object with misdated position due to later editing → Orwellian.
    - Chronostasis: Real clock hand with edited date stamp → Orwellian.
    - Metacontrast: Excluded (presence ambiguous).

  **Rule B: Temporal Locus of Revision**
  - **Stalinesque**: If the illusion is **constructed pre-consciously** (i.e., the misperceived sequence is assembled before conscious experience and no later event revises it).
  - **Orwellian**: If the illusion involves **post-experiential revision by a later event** (i.e., a subsequent stimulus alters the record of an earlier experience).
  - **Scope**: Same as Rule A; requires unambiguous content with timing/ordering issues.
  - **Consistency with standing list**:
    - Colour phi: Constructed pre-consciously (color change staged before second dot) → Stalinesque.
    - Cutaneous rabbit: Constructed pre-consciously (taps staged before sequence ends) → Stalinesque.
    - Flash-lag: Later motion revises flash position → Orwellian.
    - Chronostasis: Later processing revises the date stamp → Orwellian.
    - Metacontrast: Excluded.

  **Key Constraints**:
  - **Flash-lag**: Both rules reject fabricated content for flash-lag (as per the director's gloss). Rule A does this by requiring real content for Orwellian; Rule B by requiring revision for Orwellian.
  - **Metacontrast**: Both rules exclude cases where content presence is ambiguous (e.g., metacontrast), as the distinction is deemed inapplicable.

  ### 2. Verdicts on the Pilot Study Conditions
  For each rule, verdicts are applied to the three conditions of the pilot study. The disc turning blue is fabricated content (it never occurred), but its timing is influenced by later events.

