answer: |-
  Below is a structured specification of desiderata for dialetheism as a **metaphysical claim about the world**, contrasted with paraconsistency as a **reasoning discipline**. The requirements are grounded in scientific practice, with motivations drawn from your examples. Conflicts and non-negotiable elements are flagged.  

  ---

  ### **Core Desiderata for Dialetheism (Metaphysical Claim)**  
  *Non-negotiable requirements for scientific viability*:  

  1. **Empirical Risk**  
     - **Motivation**: From your fracture mechanics example: the inverse-square divergence *violates* the theory’s assumptions, yet the theory remains predictive *because the contradiction is localized and does not propagate*. For dialetheism, a true contradiction must make novel, testable predictions that could empirically fail (e.g., a measurable state exhibiting incompatible properties under identical conditions).  
     - **Negotiability**: Non-negotiable. Without empirical risk, dialetheism is indistinguishable from instrumentalism (like using unstable van der Waals states pragmatically).  
     - **Conflict**: Pulls against dialetheic "quietism" (where contradictions are logically isolated).  

  2. **Non-Triviality**  
     - **Motivation**: Scientific idealizations (e.g., classical nuclei in MD simulations) are contextually consistent. A dialetheic truth must not reduce to a gluts being "benign" (like the analytic partition function having no *practical* phase transition). It must "do work" in explaining phenomena.  
     - **Negotiability**: Non-negotiable. Trivial gluts (e.g., *every* contradiction true) collapse explanatory value.  
     - **Conflict**: Tensions with paraconsistent logics that allow arbitrary gluts without explosion.  

  3. **Confirmation Asymmetry**  
     - **Motivation**: In science (e.g., optical engineers using both waves and particles), inconsistencies are resolved by domain restrictions. For dialetheism, a true contradiction must license inferences that a classical/paraconsistent approach cannot. Evidence for a glut must not be reducible to evidence for conflicting approximations (e.g., crack-tip stress as artifact of linear elasticity).  
     - **Negotiability**: Non-negotiable. Without asymmetric confirmation, dialetheism adds no epistemic value over paraconsistency.  
     - **Cost**: Risks collapsing into paraconsistency if "evidence" is just consistent disambiguation.  

  ---

  ### **Paraconsistency vs. Dialetheism: The Divide**  
  - **Paraconsistency (Reasoning Tool)**:  
    - *Requirements*: Controls explosion in inconsistent theories (e.g., van der Waals instabilities; divergent stress fields).  
    - *Motivation from Practice*: Your career examples—scientists *use* inconsistent models without inferring arbitrary claims.  
    - *Supported by Practice*: Yes. Science routinely handles inconsistency this way.  

  - **Dialetheism (Metaphysical Claim)**:  
    - *Additional Requirements*: Must show that gluts are **worldly features**, not descriptive artifacts. Requires:  
      - Empirical risk (Requirement 1),  
      - Non-trivial explanatory power (Requirement 2),  
      - Direct evidence for *both sides* of a contradiction holding simultaneously (e.g., a quantum system exhibiting particle/wave duality *in a single experiment* under identical conditions).  
    - *Supported by Practice?* No. Your examples show scientists *containing* inconsistency, not positing true contradictions.  

  ---

  ### **The Crux: Confirmation**  
  - **Requirement**: A true contradiction must alter predictions or actions. Example: If a dialetheic state were confirmed in a material, it should enable technologies exploiting contradictory properties (e.g., a circuit being open/closed simultaneously).  
  - **Cost to Dialetheist**: If no such evidence exists, dialetheism is either untestable (unscientific) or reducible to paraconsistency.  
  - **Scientific Practice**: Your colleagues discarded unstable van der Waals states—they didn’t assert their reality. Dialetheism must justify *not* doing this.  

  ---

  ### **Key Eliminator & Ranking of Approaches**  
  **Most Eliminative Requirement**: **Confirmation Asymmetry** (Requirement 3). It demands that dialetheism provide unique empirical gains. Most candidates fail this.  

  **Ranking of Responses**:  
  1. **Dialetheism Proper**:  
     - Fails Requirements 1–3. No scientific case for worldly gluts; gluts are either artifacts (fracture mechanics) or pragmatic (quantum optics).  
  2. **Gappy/Fixed-Point Theories (e.g., Kripkean truth)**:  
     - Satisfies paraconsistent needs. Handles Liar without gluts. Aligns with scientific idealization (e.g., "stress → ∞" as undefined at crack tip).  
  3. **Revision Theories**:  
     - Dynamically resolves inconsistency. Mirrors scientific revision (e.g., discarding unstable states). No metaphysical gluts.  
  4. **Contextualism**:  
     - Inconsistency relocated to context (e.g., wave/particle descriptions). Best fit for your examples—scientists already do this.  
  5. **Classical Policing**:  
     - Rejects expressive overreach. Viable but ignores how science *uses* controlled inconsistency.  

  ---

  ### **Conclusion: The Scientific Case**  
  - **Paraconsistency** is validated by your examples: Scientists reason non-explosively with inconsistent information.  
  - **Dialetheism** gains no support from scientific practice. Your cases show inconsistencies as *descriptive limitations* (fracture mechanics), *artifacts of idealization* (molecular dynamics), or *domain-specific approximations* (optics). None suggest contradictions "in the world."  
  - **What Would Support Dialetheism?**: An empirical phenomenon requiring a true contradiction as the *best explanation* (e.g., a system violating the law of non-contradiction *and* enabling predictions impossible under consistency). Nothing in current science meets this.  

  The dialetheist’s burden is to show that gluts are not just *tolerable* (as in paraconsistency) but *necessary* for scientific progress. No such case exists.
