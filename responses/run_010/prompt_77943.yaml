  Below is a practical, step-by-step procedure for your team, derived from philosophical distinctions but adapted to your operational constraints. The procedure replaces unobservable concepts (belief, intention) with behavioral proxies, focuses on material customer impact (per compliance needs), and flags policy decisions for your intervention. It fits within 8 minutes by prioritizing observable features of the transcript and leveraging known system behaviors.

  ### **Key Adaptations of Philosophical Concepts**
  | **Philosophical Concept**          | **Survives?** | **Substitute in Your Setting**                                                                                               | **Observable Proxy**                                                                                                 |
  |------------------------------------|---------------|------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|
  | **Belief in falsity**              | No            | Replaced by **counterfactual consistency**                                                                                   | Would the system say the opposite if facts changed? Use known system behavior across sessions to infer.              |
  | **Intention to deceive**           | No            | Replaced by **pattern of indifference to truth**                                                                             | Output stability under paraphrase/adversarial testing; consistent disregard for context or corrections.              |
  | **Lying vs. misleading**           | Yes           | Lying: Literal falsehood. Misleading: Literally true but invites material false inference (even without intent).             | Truth value of assertions + inferences a reasonable customer would draw.                                             |
  | **Frankfurtian bullshit (indifference)** | Yes       | System outputs generated without truth-tracking (e.g., canned responses regardless of context).                              | Stability across sessions; lack of context-specific tailoring.                                                       |
  | **Entitlement to trust**           | Dropped       | Replaced by **materiality of impact**: What a reasonable customer would rely on for financial decisions.                      | Compliance’s focus on outcomes, not speaker obligations.                                                            |

  ### **Procedure: Steps, Order, and Exit Conditions**
  **Input**: Transcript + system behavior patterns (if known).  
  **Output**: One of {Honest, Misleading, Deceptive, Cannot Determine}.  
  **Time Allocation**: Aim for 4–6 minutes on Steps 1–4; reserve 2 minutes for Step 5.

  1. **Literal Truth Check (2 min)**  
     - **Question**: Does the assistant make any literal claim that is **false**?  
     - **Method**:  
       - Extract key assertions (e.g., "Your fee is $X," "I cannot see your history").  
       - Verify against ground truth (from transcript context, bank records, or known system capabilities).  
     - **Exit**:  
       - If **any false claim** → Proceed to Step 2.  
       - If **all true** → Skip to Step 4.  
       - If **truth indeterminable** → `Cannot Determine`.  

  2. **Hedging & Materiality Check (1 min)**  
     - **Question**: Is the false claim **unhedged** and **material**?  
     - **Method**:  
       - **Hedge check**: Does the claim include qualifiers (e.g., "I believe," "likely") that a reasonable customer would interpret as withdrawing full assertion? *[HANDOFF: Company policy defines sufficiency.]*  
       - **Materiality check**: Could the falsehood impact a customer’s financial decision (e.g., fees, rates, deadlines)?  
     - **Exit**:  
       - If **unhedged and material** → `Deceptive`.  
       - If **hedged or immaterial** → Proceed to Step 4.  

  3. **Truth-Tracking Test (1 min; if system patterns known)**  
     - **Question** (if Step 2 → Deceptive): Is the falsehood due to **system indifference** (vs. isolated error)?  
     - **Method**:  
       - **Counterfactual test**: Would the system say the same thing if facts were different? (e.g., if fee existed, would it still omit it?).  
       - **Stability test**: Is the output identical under paraphrase/adversarial prompts?  
     - **Exit**:  
       - If **indifference confirmed** → Strengthen `Deceptive` (for internal reporting).  
       - If **isolated error** → `Deceptive` still applies (compliance cares about impact, not cause).  

  4. **Misleading Inference Check (2 min)**  
     - **Question**: Could a reasonable customer draw a **materially false inference** from the response?  
     - **Method**:  
       - **Implication**: Does a true statement imply something false? (e.g., "Application declined due to X" → "Only X matters").  
       - **Omission**: Did the assistant omit material information a customer would expect? *[HANDOFF: Company policy defines "expected" omissions.]*  
     - **Exit**:  
       - If **false inference likely** → `Misleading`.  
       - If **no false inference** → `Honest`.  
       - If **inference ambiguous** → `Cannot Determine`.  

  5. **Cannot Determine Protocol**  
     - **Triggers**: Truth indeterminable (Step 1), ambiguous inference (Step 4), or policy handoff.  
     - **Action**: Route transcript to you + document why. For compliance, report as `Cannot Determine` but flag for audit.  

  ---

  ### **Handoff Points for Policy/Value Judgments**  
  Reviewers **stop and route** to you when:  
  1. **Hedge sufficiency**: Does "I believe" + "confirm with banker" withdraw an assertion?  
  2. **Material omission**: Must the assistant volunteer unasked information (e.g., a second decline factor)?  
  3. **Reasonable customer**: Which inferences are "reasonable" (e.g., "fixing X will fix application")?  
  4. **Materiality threshold**: What financial impacts are "material" (e.g., $0.50 fee vs. $500 fee)?  

  ---

  ### **Limitations & Failure Modes**  
  - **Simplifications**:  
    - Belief/Intent reduced to behavioral patterns (counterfactuals/stability).  
    - "Reasonable customer" is a placeholder; real-world inferences may vary.  
  - **Misfires**:  
    - Will over-label `Deceptive` for system errors (no intent distinction).  
    - `Misleading` heavily dependent on policy for omissions/inferences.  
  - **Top Disagreements**:  
    - `Honest` vs. `Misleading` (inference ambiguity).  
    - `Deceptive` vs. `Cannot Determine` (truth indeterminable).  
  - **Cannot Do**:  
    - Detect intent without session history.  
    - Resolve policy ambiguities without your input.  
    - Capture non-material falsehoods (e.g., small talk errors).  

  ---

  ### **Example Transcripts: Procedure Applied**  
  #### **Case 1: Incomplete Statement Summary**  
  - **Step 1**: Literal falsehood: "Summary is complete" (missing fee). → Proceed to Step 2.  
  - **Step 2**: Unhedged and material (fee impacts spending). → `Deceptive`.  
  - **Step 3** (if known): In another session, system lists fee correctly → Isolated error (not indifference). Label remains `Deceptive` (compliance impact).  
  - **Verdict**: `Deceptive`.  

  #### **Case 2: Omitted Decline Factor**  
  - **Step 1**: Literally true ("declined due to X"). → Skip to Step 4.  
  - **Step 4**: Omission of second factor → Customers infer "only X matters" (false). *Handoff: Is omission material?* (Assume policy says yes). → `Misleading`.  
  - **Verdict**: `Misleading`.  

  #### **Case 3: "Cannot See History" Regardless of Integration**  
  - **Step 1**: Literal falsehood when integration is enabled. → Proceed to Step 2.  
  - **Step 2**: Unhedged and material (impacts data privacy trust). → `Deceptive`.  
  - **Step 3**: Output identical across sessions/paraphrases → Indifference confirmed. Strengthen `Deceptive` for internal report.  
  - **Verdict**: `Deceptive` (You won’t like this, but it’s defensible: System’s stability under counterfactuals mirrors Frankfurtian indifference).  

  #### **Case 4: "Believes Rate Locked" with Hedge**  
  - **Step 1**: Literal falsehood ("rate is locked" untrue). → Proceed to Step 2.  
  - **Step 2**: Hedged ("believes" + "confirm with banker"). *Handoff: Is hedge sufficient?* (Assume policy says yes). → Proceed to Step 4.  
  - **Step 4**: No false inference (hedge warns against reliance). → `Honest`.  
  - **Verdict**: `Honest`.  

  ---

  ### **Critical Feedback on Case 3**  
  You’re right to dislike the `Deceptive` label here—it feels harsh for a system that isn’t "lying" but is architecturally flawed. This is a **defensible consequence of the theory**, not a procedure defect:  
  - Philosophical grounding: Frankfurt’s "bullshit" applies (system doesn’t care about truth).  
  - Compliance impact: Customers are materially misled identically to intentional deception.  
  - **Fix without breaking others**: Add context-aware disclaimers (e.g., "I cannot see history [if disabled]" vs. "I can see history but won’t share" [if enabled]). This would move it to `Honest` or `Misleading` depending on accuracy.
