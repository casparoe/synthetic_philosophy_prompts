answer: |-
  Right, then. Your objections are familiar, but require careful handling. I’ll address both prongs plainly, then assess their weight.

  **First Prong: Legitimacy of Measures.**  
  You’re correct that we exclude measures like your "partisan" one. But this isn’t arbitrary normative smuggling. Propriety is entailed by the core accuracy-first commitment: *inaccuracy* is the fundamental epistemic bad, so a belief state shouldn’t *expect itself* to be less accurate than another state *from its own perspective*. Your partisan measure violates this: an agent with credence 0.6 in proposition *P* expects greater inaccuracy (using *her own* measure) by holding 0.6 than by adopting 0.96. That contradicts the very idea that accuracy is the target—she’d be *deliberately* choosing a state she expects to be *less accurate* by her own lights. Truth-directedness is equally non-negotiable: if lowering confidence in a truth reduces inaccuracy, the measure isn’t tracking truth at all. These constraints arise directly from accuracy being the sole epistemic good—not from prior normative commitments to coherence. Your partisan measure isn’t "illegitimate" because it fails to deliver coherence; it’s illegitimate because it fails to meaningfully *measure accuracy*.

  **Second Prong: Imprecise Credences.**  
  Your dominance argument under the averaged Brier score is mathematically sound: for any imprecise set **C**, the precise credence function *c*<sup>*</sup> (the pointwise mean of **C**) will have lower *average* Brier score across **C** in every possible world. But this doesn’t entail that rationality demands sharp credences. It shows that *if* your epistemic goal is minimising *expected global inaccuracy* (where expectation is taken over the set itself), precision dominates. However, imprecise credences often model agents who *lack* a determinate expectation or who prioritise *robustness*—avoiding catastrophic inaccuracy across possibilities. The worst-case extension serves *that* goal. Accuracy-first epistemology doesn’t dictate which goal you *should* have; it tells you what follows *given* a goal. Nothing in "accuracy" itself mandates that global expected accuracy must trump robustness. The framework accommodates both by showing how different scoring methods link different epistemic goals to different norms. Dominance under one extension doesn’t forbid imprecision; it reveals the cost under a specific objective.

  **Assessment.**  
  The second prong is more serious, as it reveals a genuine underdetermination in extending scoring rules to non-precise states—though this reflects legitimate flexibility in epistemic goals, not a flaw in accuracy’s fundamentality. Your reasoning overreaches in the first prong by misdiagnosing propriety as an external norm; it’s internal to accuracy’s coherence as an aim. On imprecise credences, your dominance observation is correct but your conclusion—that the framework demands precision—overreaches by ignoring the goal-relativity of the scoring extension. Accuracy grounds the norms, but different legitimate ways of scoring accuracy serve different rational priorities.
