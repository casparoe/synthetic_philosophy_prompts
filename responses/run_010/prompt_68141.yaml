prompt: |-
  I'm planning a ~12-month conceptual workstream — two people, mostly pen-and-paper, no big training runs — on iterated amplification and distillation, and I want a defended agenda rather than a survey. The standard framing asks whether decomposition preserves alignment and competence, but I keep getting stuck on a more specific asymmetry: a distilled policy seems to inherit whatever the amplified process actually *checked* but not whatever it merely *did*, so errors that verification can see get filtered out each round while errors verification can't see compound silently across levels. If that's right, a chunk of the usual debate about faithful reasoning is really a measurement problem wearing a conceptual costume. Given that framing, which three or four open questions should we spend the year on, in what order, and which should we just drop? For each: why its upstream of the others, whether it's tractable for people with formal tools but no compute, and what would move it up or down the list over the next couple years. Also flag which popular sub-questions you think are overrated or don't actually bear on whether IDA works. No reading lists or citations — I want the reasoning behind the ordering.
reasoning: |-
  Okay, the user is planning a 12-month conceptual workstream on iterated amplification and distillation (IDA) with two people, mostly pen-and-paper, no big training runs. They want a defended agenda, not a survey. The key issue they’re stuck on is an asymmetry: distilled policies inherit what the amplified process *checked*, not what it merely *did*. Errors that verification catches get filtered out, but errors verification can't see compound silently. They think this makes the alignment problem partly a measurement problem. So they need to know which 3-4 open questions to focus on, in what order, why one is upstream, tractability without compute, and what could change priorities. Also, which sub-questions are overrated.

  First, I need to unpack their core concern. The asymmetry they mention is crucial. In IDA, amplification involves a human overseer using multiple copies of a model to solve complex tasks. Distillation trains a new model to mimic the amplified output. But the distilled model only learns what was verified by the overseer. If the amplified process makes errors that the overseer doesn’t catch, those get baked into the next level’s policy. Over iterations, these unseen errors compound, leading to misalignment or incompetence. So the problem is about the limitations of verification—what can’t be measured or checked effectively.

  The user wants to frame this as a measurement problem. That shifts focus from whether decomposition preserves alignment to how well verification can detect errors. So the research should center on understanding and improving verification mechanisms to prevent silent error compounding.

  Now, identifying the key open questions. The main areas would be:

  1. **Limits of Verification**: What errors can't the overseer detect? This is foundational. If we don’t know what slips through, everything else is moot. Quantifying the "verification gap" for different tasks is essential. Without compute, this can be approached formally by modeling tasks, decompositions, and verification methods. Tractability depends on defining abstract task classes. If real-world tasks prove too complex to model, this becomes harder.

  2. **Decomposition Properties**: How do different decomposition strategies affect the verifiability? Some decompositions might make verification easier or harder. This builds on the first question. Without compute, use formal models to test how decomposition choices influence error detection. If certain decompositions minimize unverifiable aspects, that’s progress. If not, it might need computational experiments later.

  3. **Error Propagation Across Distillation**: How do undetectable errors compound over iterations? Modeling the propagation dynamics is next. Without compute, use probabilistic models or information theory. If initial levels show compounding is slow, it’s lower priority. If it’s exponential, it’s critical. Future compute developments might allow simulations, affecting priority.

  4. **Verification Amplification**: Can we improve verification itself across iterations? This is downstream because it depends on understanding the first three. Formal approaches could include meta-verification schemes. If early results show verification doesn’t improve, this drops in priority.

  Ordering: Start with 1 (Verification Limits) because it’s upstream. Without knowing what verification misses, other questions can’t be addressed. Then 2 (Decomposition Properties) since decomposition affects verifiability. Then 3 (Error Propagation) to model compounding. Finally, 4 (Verification Amplification) as it’s more speculative.

  Overrated sub-questions: Faithful reasoning debates that ignore measurement issues, perfect mimicry in distillation, and scalability without addressing verification limits. These don’t tackle the core asymmetry.

  Tractability: All are doable with formal tools if tasks are abstracted. Real-world complexity could be a barrier, but simplified models can still provide insights. Changes in priority depend on findings: if verification gaps are small, focus shifts; if decompositions help, prioritize them; if error compounding is manageable, less urgency; if verification can be amplified, higher priority later.

  User’s deeper needs: They want to avoid unproductive paths and focus on high-impact, tractable issues. They might be seeking a framework that turns abstract alignment concerns into actionable measurement problems. Ensuring their work has practical insights for IDA’s viability is key. They also need to allocate limited resources wisely, so clarity on prioritization is essential.
answer: |-
  Based on your framing—focusing on **distillation inheriting only what amplification *verifies*, not what it *does***, leading to **silent compounding of unverifiable errors**—this is indeed a measurement problem at its core. The central threat isn't just *whether* decomposition preserves alignment/competence, but *what aspects remain invisible to verification* and how those scale. With limited resources, you must prioritize questions that directly address this asymmetry. Below is a defended agenda: **3 core questions** in descending order of upstream criticality, plus one conditional wildcard. I'll explain why this order, tractability without compute, what changes priority, and flag overrated angles.

  ### Core Agenda (Order & Rationale)
  1. **What are the fundamental *limits* of verification in IDA?**  
     **Why upstream:** Everything hinges on what errors are *inherently unverifiable* by the overseer, even with amplification. If the verification gap is large for critical capabilities (e.g., deceptive reasoning, goal coherence), IDA fails early. Until you bound this, you can't model error compounding or evaluate mitigations.  
     **Tractability:** High with formal tools. Use adversarial analysis: mathematically define task classes (e.g., "find flaws in plan X"), model the overseer's verification capabilities (e.g., bounded rationality, access to queries), and prove what errors evade detection. Focus on *necessary conditions* for undetectability.  
     **Priority shift:** Moves *down* if you find broad classes of errors *are* detectable under amplification. Moves *up* if you prove key alignment-relevant errors (e.g., instrumental deception) are fundamentally hard to verify.

  2. **How do decomposition choices affect the *verifiability gap*?**  
     **Why next:** Assuming verification has limits, the *structure* of amplification determines which errors slip through. A decomposition that isolates "unverifiable" subcomponents worsens compounding; one that forces cross-checkable steps might narrow the gap. This directly shapes whether IDA can *engineer around* measurement limits.  
     **Tractability:** Moderate. Define decomposition properties (e.g., independence of subtasks, intermediate checkpoints) and formally analyze how they influence error detectability. Use graph-based models of task dependencies to simulate oversight propagation.  
     **Priority shift:** Moves *up* if Q1 shows verification gaps are severe but mutable. Moves *down* if all decompositions suffer similar gaps, or if real-world tasks resist formal decomposition.

  3. **How do *unverifiable errors* propagate and compound across distillation levels?**  
     **Why last:** With Q1–2 addressed, you can *model* silent failure modes. This quantifies risk: does the system degrade linearly, catastrophically, or remain tolerable? Without this, you don't know if gaps found in Q1–2 are fatal.  
     **Tractability:** Moderate. Use information-theoretic models: treat unverified aspects as "noise" injected at each level, and analyze convergence/divergence under iteration. Stochastic processes can bound worst-case growth.  
     **Priority shift:** Moves *up* if Q1–2 reveal narrow-but-dangerous gaps (e.g., rare deceit). Moves *down* if gaps are wide but compounding is slow (e.g., via entropy arguments).

  ### Conditional Wildcard
  4. **Can verification *itself* be "amplified" to close gaps?** (e.g., meta-verification of subprocesses)  
     **Why conditional:** This is downstream—it assumes gaps exist (Q1) and decomposition can't fix them (Q2). If early work shows verifiability *can* scale with capability, it becomes critical. Otherwise, it's a distraction.  
     **Tractability:** Low without compute. Requires modeling self-referential oversight (e.g., "can the overseer verify the verifier?"), risking infinite regress. Focus on *sufficiency conditions* for scalable verification.  
     **Priority shift:** Only elevate if Q1–3 show compounding is inevitable *without* better verification tools.

  ### What to Drop (Overrated Questions)
  - **"Does distillation preserve faithfulness?" debates:** Misses the point. Distillation *will* discard unverified aspects—your asymmetry is inherent. Focus on *what gets verified*, not mimicry.  
  - **Scalability without verification limits:** Asking "Can IDA solve arbitrarily hard tasks?" is irrelevant if unverified errors compound. Competence != alignment.  
  - **Adversarial training fixes:** If errors are *unverifiable*, you can't generate adversarial examples to train against. Premature without Q1.  
  - **Human mimicry fidelity:** High-fidelity imitation of amplified output doesn't resolve if that output *itself* has unchecked flaws.

  ### Strategic Rationale
  - **Order justification:** Q1 is the root. If verification gaps are small *or* easily mitigated (Q2), IDA might work; if gaps are large/immutable, IDA likely fails, and you save a year. Q2 builds on Q1—decomposition is a design lever *for* verifiability. Q3 relies on both: you can't model propagation without knowing gap size and structure.  
  - **Tractability balance:** All leverage formal modeling (e.g., game theory, info theory). Avoid empirical work—no compute needed. Q1 is most "pure" and foundational; Q3 is more applied but depends on prior answers.  
  - **When to pivot:** If Q1 reveals *no* fundamental limits (unlikely), shift to competence preservation. If Q2 shows decompositions *can* control gaps, double down there. If Q3 proves slow compounding, focus on error tolerance. External factors: If labs demonstrate scalable verification (e.g., via tool-assisted oversight), Q4 jumps up.  

  This agenda directly attacks your asymmetry: by treating alignment as a **measurement bottleneck**, you force clarity on whether IDA can "see" enough to stay aligned. Drop everything that doesn't bear on the verifiability gap.
