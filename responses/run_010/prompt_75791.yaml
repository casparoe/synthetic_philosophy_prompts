  I've got a section of a paper to write this weekend that I've been putting off for about a year, and I want to just talk the argument through — no, actually, I want you to write it out properly as an argument and I'll steal from it shamelessly.

  Here's the position I want defended. The reference class problem gets wheeled out constantly as a knockout punch against frequentism: any single event sits in indefinitely many reference classes with different limiting frequencies, so frequency talk can't deliver a determinate probability for the case in front of you, and that's supposed to show you need propensities or credences or something else to do the work. I want to argue that this move is no good — not because the reference class problem is unreal (it's completely real), but because it isn't local to frequentism at all. It's a problem about how the space of possibilities gets carved up, and it comes back for the subjectivist in a nastier form, since she has to fix a partition in order to conditionalize on anything and then a prior over that partition, with nothing but coherence and maybe calibration to discipline either choice, whereas the frequentist at least has an empirical procedure — hopeless as it may be — for narrowing classes down. So the reference class problem can't adjudicate between the interpretations, and every argument of the shape "frequentism can't handle single cases, therefore chance or credence must" begs the question against it.

  Make the case for that. I want the actual argument, not a survey. Get clear early on what the reference class problem is and what would have to be true for it to be a problem for one side only, then press the symetry, then say what's left standing for the frequentist once you've granted that the problem is universal rather than parochial. And don't dodge the obvious replies: the propensity theorist will say her propensities attach to the case and not to a class, which is exactly the fix on offer, and someone else will say the subjectivist doesn't need a partition at all if she conditionalizes on her total evidence. Take both on. Also, if you think there's a spot in the middle where my thesis overreaches, say so and tell me what the weaker version that's actually defensible looks like — I'd rather have a true argument than my argument.

  No references, please, and don't hand me a reading list; I know the literature, what I don't have is the reasoning laid out end to end. And write the whole thing as continuous prose, like a long email: no headings, no bullet points, no bold, no tables. If you need structure, get it out of paragraphs and signposting inside the sentences. A couple thousand words is fine, I'm not in a hurry.
