answer: |-
  ### Activity Design: Colour Phi Illusion Seminar

  #### **Goal**:  
  Demonstrate that the question "When did the colour change occur?" is vacuous by having students experience the illusion, commit to a timeline, and confront discrepancies between their reports and independent measures. Emphasize that both Orwellian (memory revision) and Stalinesque (pre-conscious fabrication) models explain the same data.

  ---

  ### **Materials & Setup**  
  - **Cards**:  
    - **Size**: 8.5" x 11" coloured paper (bright, non-glossy).  
    - **Left Card**: Solid green circle (diameter: 3 inches) centered 2 inches left of midline.  
    - **Right Card**: Solid red circle (same size) centered 2 inches right of midline.  
    - **Blank Card**: White card to show between flashes (prevents afterimages).  
  - **Separation**: Hold cards 12–14 inches apart (center-to-center) to ensure clear motion path.  
  - **Intervals** (use phone stopwatch):  
    - **Optimal Apparent Motion**: 200 ms exposure per card, 50 ms ISI (blank interval).  
      - *Why*: Fires motion illusion and colour fusion (change appears mid-trajectory).  
    - **Failure Case**: 500 ms exposure, 200 ms ISI (motion illusion fails; seen as two flashes).  
  - **Room Setup**:  
    - Students sit in a semicircle facing instructor.  
    - Ensure even lighting (no shadows on cards).  

  ---

  ### **Minute-by-Minute Timeline** (Total: 90 mins)  

  #### **Phase 1: Introduction & Demo** (15 mins)  
  - **0–5 mins**: Frame the problem.  
    - *Script*: “Last term, you debated *when* the colour change happened. Today, you’ll *be* the subject. We’re testing if your certainty survives scrutiny.”  
    - Remind them of Orwellian (post-experience edit) vs. Stalinesque (pre-experience edit) models.  
  - **5–10 mins**: Demo illusion.  
    - Show **failure case** (500 ms exposure): No motion, two distinct flashes.  
    - Show **success case** (200 ms exposure + 50 ms ISI): Green left → blank (50 ms) → red right. Repeat 3x.  
    - *Ask*: “Raise hands if you saw motion + colour change mid-trajectory?” (Expect >80% yes).  
  - **10–15 mins**: Explain activity rules.  
    - Students will see 5 trials (200 ms exposure, 50 ms ISI).  
    - **Commitment**: After trials, privately write:  
      - “When did the colour change *first occur*? ( ) Before the second spot / ( ) At the second spot / ( ) After.”  
      - Confidence: 1 (low) to 5 (high).  
    - **Independent Measure**: Sealed envelope with “ground truth” (details below).  

  #### **Phase 2: Generate Illusion & Commit** (20 mins)  
  - **15–25 mins**: Run trials.  
    - Instructor flips cards (use stopwatch for precision):  
      - Green card (200 ms) → blank (50 ms) → red card (200 ms) → blank. Repeat 5x.  
      - *Tip*: Practice beforehand; auditory beeps (stopwatch app) aid timing.  
  - **25–30 mins**: Commit privately.  
    - Students write timeline commitment + confidence on index cards.  
    - Collect cards in a box (hide from view).  

  #### **Phase 3: Discrepancy & Scoring** (25 mins)  
  - **30–40 mins**: **Independent Measure** (sealed report).  
    - *Setup*: Before class, seal an envelope with: “Actual stimulus: Green flash (left) → 50 ms gap → Red flash (right). No mid-trajectory event.”  
    - Reveal envelope contents. Emphasize: “The stimulus had *no colour change event*—only two flashes.”  
  - **40–50 mins**: **Forced Choice** (under time pressure).  
    - *Task*: Students answer 3 rapid questions orally (in unison):  
      1. “Did the spot *reach the right location*? (Yes/No)”  
      2. “Was the spot *red before* reaching the right? (Yes/No)”  
      3. “Did the colour change *start before* the spot arrived at the right? (Yes/No)”  
    - *Time pressure*: Allow 3 seconds per question (use stopwatch).  
  - **50–55 mins**: **Scoring & Discrepancy**  
    - **Scoring Scheme** (no money):  
      - Lose 1 point if forced choice (Q3) contradicts sealed report (“No” is correct).  
      - Lose 2 points if commitment contradicts sealed report (“At second spot” or “After” is correct; “Before” is illusion).  
      - Lose 3 points if high confidence (4–5) accompanies incorrect commitment.  
    - *Example*: A student says “Yes” to Q3 (wrong), commits to “Before” (wrong), and rates confidence 5 → loses 6 points.  
    - Tally “losses” on board (no names). Focus on high-confidence errors.  

  #### **Phase 4: Debrief & Model Mapping** (30 mins)  
  - **55–70 mins**: Debrief discrepancies.  
    - *Key Q*: “Why did 90% of you report a mid-trajectory change when none occurred?”  
    - Chart results:  
      | **Activity Moment**       | **Orwellian Model**                          | **Stalinesque Model**                       |  
      |---------------------------|---------------------------------------------|--------------------------------------------|  
      | Seeing illusion           | Memory revised *after* experience           | Fabricated *before* consciousness          |  
      | Commitment to “before”    | Post-hoc narrative to explain illusion      | Veridical report of fabricated event       |  
      | Forced-choice error       | Memory degradation under time pressure      | Incomplete access to fabrication process   |  
      | High-confidence error     | Certainty from compelling revised memory    | Certainty from seamless pre-conscious edit |  
    - *Emphasize*: Both models explain all data—no experiment can distinguish them.  
  - **70–85 mins**: Tackle Cartesian theatre.  
    - *Problem*: “If I flip the cards, am I the ‘editor’?” → **Yes, but turn it into a lesson**.  
      - *Script*: “In this setup, *I* control timing—but your brain is the real editor. The ‘editor’ isn’t a person; it’s distributed processes. Neither model puts a homunculus in a theatre.”  
  - **85–90 mins**: Conclusion.  
    - *Punchline*: “The question ‘when did it happen?’ assumes an objective timeline. But your reports were contradicted, and both models fit. The timeline is a narrative, not a fact.”  

  ---

  ### **What Will Go Wrong & Mitigation**  
  1. **Students who never see motion**:  
     - *Cause*: Individual variability in visual processing.  
     - *Fix*: Pre-test intervals; use 150 ms exposure if needed. Pair skeptics with believers to discuss.  

  2. **“Memory is unreliable” conclusion**:  
     - *Cause*: Students fixate on forced-choice errors.  
     - *Fix*: Stress in debrief: “Memory unreliability *isn’t the point*. The colour change never happened—your brain invented it.”  

  3. **Wrong moral (e.g., “science is flawed”)**:  
     - *Cause*: Misinterpreting scoring as “gotcha.”  
     - *Fix*: Clarify: “This isn’t about you being wrong—it’s about the question having no answer.”  

  4. **Room setup issues**:  
     - *Cause*: Poor sightlines/glare.  
     - *Fix*: Test view from all seats; use matte paper.  

  ---

  ### **Feature the Activity Cannot Reproduce**  
  **The neural “delay” argument**: Students may object that the colour change *must* have happened at a specific neural moment (e.g., after the second flash but backdated).  
  - **Argument to supply**:  
    - “Even if neurons ‘timestamp’ events, we can’t access it—all we have are reports. Both models accommodate timestamps: Orwellian by backdating, Stalinesque by pre-dating. The question remains vacuous because the models are empirically indistinguishable.”  

  This design avoids a student “editor” (using the instructor as a deliberate red herring), forces commitment/discrepancy, and ties every step to both models. Students lose points for confidence in an illusion, driving home the vacuity.
