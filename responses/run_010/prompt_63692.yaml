answer: |-
  ### Analysis of the Problem

  You've identified two interconnected issues in applying quantitative historical models (like cliodynamics) to long-term forecasting. Both stem from the unique constraints of historical data: **low N (few societal cycles)**, **non-replicability (no parallel histories)**, and **extreme time horizons (centuries-scale validation)**. Let's dissect each and map them to established concepts.

  #### 1. **The "Free Parameter" Problem**
  - **Description**: A model fits two societies, fails on a third, so a new parameter (e.g., a proxy, lag, or weight) is added. Residuals improve across all historical cases, but the parameter's validation relies on future data centuries away, making it untestable in practice.
  - **Why It's Not Quite "Overfitting"**:  
    Overfitting typically involves fitting noise in a finite dataset, detectable via cross-validation (e.g., splitting data into training/test sets). Here, there is **no held-out set in principle**—you can't partition history or simulate alternative societal trajectories. Adding a parameter improves in-sample fit but lacks any *feasible* out-of-sample test. It's overfitting's evil twin: **overfitting to irreproducible data**.
  - **Why It's Not Fully "Unfalsifiability"**:  
    Unfalsifiability (Popper) implies no conceivable observation could disprove the theory. Here, the theory *is* falsifiable—just not within human timescales. It's **temporally deferred falsifiability**: testable in theory, but not in practice. This is worse than typical unfalsifiability because it masquerades as rigor (future validation is promised but irrelevant to current actors).
  - **Why It's Not "Epicycles" or "Ad Hoc Rescue"**:  
    Epicycles (like in Ptolemaic astronomy) involve arbitrary adjustments to preserve a core theory, but they were eventually testable with new data (e.g., telescopic observations). Here, no such near-term test exists. It's also not an ad hoc rescue because the parameter isn't patching a single failure; it's enhancing fit across all data, making it seem empirically progressive.

  #### 2. **The "Phase Shift" Problem**
  - **Description**: A forecast misses but is reclassified as "right phase, wrong timing" (e.g., "we're in the instability phase, but the crisis hasn't hit yet"). Phase boundaries are retroactively defined, making the model perennially "correct" at any moment.
  - **Why It's Not "Ad Hoc Rescue" or "Postdiction"**:  
    Ad hoc rescue explicitly modifies a model *after* a failure. Here, the model itself isn't changed—instead, **interpretive criteria are relaxed retrospectively**. Postdiction (fitting known past data) is inherent in historical modeling, but this goes further: it redefines success metrics (e.g., phase definitions) to absorb misses, turning falsifying events into ambiguous noise.
  - **Closest Fit: "Immunization Strategy" (Popper/Lakatos)**:  
    This is a conventionalist tactic to shield a theory from refutation by reinterpreting failures as non-disconfirming. Your case is a subtype: **temporal immunization**, where phase boundaries act as movable goalposts. Unlike generic immunization, the time horizon (centuries) prevents timely disconfirmation—phases can be stretched indefinitely.

  ### Unified Diagnosis and Closest Term
  - **Core Issue**: Both problems arise from **non-testability due to temporal scale and data scarcity**. Models gain apparent explanatory power by exploiting the impossibility of near-term validation, creating a **degenerating feedback loop**: each adjustment improves historical fit but deepens reliance on untestable assumptions.
  - **Best Fit: "Degenerating Research Programme" (Lakatos)**  
    - **Why it fits**: Lakatos defines this as a scientific program that stagnates by adding ad hoc adjustments that don't yield novel predictions. Your cases fit perfectly:  
      - Adding untestable parameters is an "ad hoc auxiliary hypothesis" that saves the core theory (e.g., elite overproduction) without empirical risk.  
      - Phase reclassification avoids falsification, another symptom of degeneration.  
      Crucially, Lakatos emphasizes **temporal decay**: a program degenerates when it stops producing testable predictions and relies on retrospective tweaks. Your "centuries-scale validation" is a pathological extreme—predictions exist but are scientifically irrelevant.  
    - **Where it stops fitting**: Lakatos focuses on broad scientific programs over decades, not single models. It doesn't explicitly address time horizons beyond human lifespans, but it accommodates them as an accelerator of degeneration.

  ### Boundary Cases: When Adding a Parameter is Legitimate
  Adding a parameter to a historical model **is legitimate** when:  
  1. **It has empirical grounding**: The parameter is derived from independent evidence (e.g., archaeological data for a new proxy) and isn't reverse-engineered from the failure case.  
  2. **It enables near-term tests**: It generates predictions for observable outcomes within a feasible timeframe (e.g., demographic shifts verifiable in decades, not centuries).  
  3. **It reduces complexity**: It replaces multiple arbitrary fixes (Ockham's razor) and aligns with mechanisms from established theories (e.g., economics or ecology).  

  ### Practical Carving for Your Team
  When evaluating cliodynamics results for import into load forecasting:  
  - **Worth Importing**: Models that avoid century-scale parameters and make testable predictions within 10–30 years (e.g., demographic-economic interactions with energy demand). Validate using **proxy out-of-sample tests**, like applying the model to regions with incomplete data or shorter cycles.  
  - **Not Worth Importing**: Models relying on adjustments validated only by future centuries, or phase-based theories without predefined, falsifiable phase boundaries (e.g., "instability phases" must have clear, leading indicators like Gini coefficient thresholds).  

  ### Verdict
  **Verdict: degenerating research programme** (Lakatos)
