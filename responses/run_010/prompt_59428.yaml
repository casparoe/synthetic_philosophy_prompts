answer: |-
  Your starting point is sound: moral sentences are indeed continuous with our web of belief, not anchored in some non-natural realm. The altruistic-aesthetic split isn't ontological; it's a pragmatic categorization of observed human dispositions—roughly, concern for others versus appreciation of form or harmony. Both are natural phenomena woven into the causal fabric.  

  Your colleagues aren't disagreeing about *evidence* but about how to *organize* their shared web when empirical traction lapses. One likely extends the principle of aggregate welfare maximization (simpler, more fecund for policy modeling). The other conserves a deontological constraint against instrumental harm (aligning with entrenched intuitions). Neither system is "truer," but one may better serve our evolving purposes: simplicity favors the consequentialist framework here by reducing ad hoc prohibitions, while conservatism might favor the deontologist's adherence to existing norms. The moral sentence's role isn't predictive but *systematic*—it streamlines deliberation, and its virtue lies in how economically it integrates with the whole.  

  *Confidence: Moderate. Least sure about whether conservatism in ethics reduces cleanly to neurological habit or conceptual parsimony.*  

  ---  

  The dispute reflects divergent weightings of pragmatic virtues. Colleague A prioritizes fecundity: permitting the sacrifice enables new welfare-maximizing policies. Colleague B values conservatism: the prohibition coheres with deep-seated norms against using persons as means. Neither virtue is objectively privileged; the choice hinges on which strand of our web we elect to reinforce. Moral sentences earn their keep not by correspondence to value-facts but by their utility in orienting action within a coherent worldview. When theory is underdetermined, we sculpt our system by such tools—and the "better" system is whichever balances these virtues more effectively *for our aims*.  

  *Confidence: Moderate. Least sure if "utility in orienting action" escapes circularity when aims themselves are moralized.*  

  ---  

  Recall that for Quine, simplicity and conservatism aren't mere aesthetics but survival traits for theories. Colleague A's permissibility verdict simplifies by subsuming the case under general cost-benefit analysis (one fewer moral exception). Colleague B's verdict conserves emotional aversions hardwired by evolution—a biologically economical stance. The moral sentence doesn't *predict* observations, but it *responds* to them by stabilizing associated behaviors. Its contribution is functional: it resolves tension between our impulses and our models. The "better" system minimizes friction in this web—neither colleague is mistaken, but one resolution may prove more durable under stress.  

  *Confidence: Moderate. Least sure whether durability is a testable criterion or a post hoc justification.*
