answer: |-
  ### Teaching Plan: Information Cascades  
  **Session Goal:** To demonstrate how rational individuals can create collective errors through sequential decision-making, without anyone being "stupid" or "sheep-like".  

  ---

  ### **1. Order of Components & Why**  
  *(Total: 40 mins)*  
  **Rationale:**  
  The **private signal** is foundational. Cascades occur precisely because people *rationally* prioritise public actions over private evidence when they conflict. Introduce this first—without it, the mechanism collapses into "mindless copying".  

  **Sequence:**  
  1. **Hook: Relatable Phenomenon (3 mins)**  
     - *Example:* "A queue forms at a new café. You walk past—what do you think?"  
     - *Why:* Activates lived experience. Establishes curiosity.  

  2. **Core Concept: Private vs. Public Information (7 mins)**  
     - Define:  
       - **Private signal:** Personal evidence only *you* know (e.g., your own taste test of coffee).  
       - **Public action:** What everyone *sees* (e.g., joining the queue).  
     - *Why first?:* Participants must grasp that people act on *combining* private + public info. Misstep: Starting with "herd behaviour" implies irrationality.  

  3. **The Urn Demo (15 mins)**  
     - *Setup:*  
       - "Two identical urns: Urn A (60% blue balls/40% red), Urn B (60% red/40% blue). One urn is randomly chosen."  
       - People guess the urn sequentially. Each privately draws a ball, sees its colour (private signal), then publicly guesses.  
     - *Walkthrough:*  
       - **Person 1:** Only private signal → guesses honestly.  
       - **Person 2:** Sees Person 1’s guess + own draw. If signals *conflict*, they follow their own (50/50 odds).  
       - **Person 3:** Sees two identical guesses + own draw. If the two public guesses match *but contradict* their private signal, they ignore their signal and follow the crowd.  
     - *Why urn > restaurant queue?:* Restaurants have observable variables (e.g., decor, smells) that muddy "pure" signal dependence. Urns isolate the logic.  

  4. **Cascade Formation (5 mins)**  
     - After Person 3 ignores their signal, all subsequent people face overwhelming public consensus → they *rationally* disregard private signals. A cascade begins.  
     - *Visual:* Whiteboard sketch of the urn, balls, and a "chain" of guesses.  

  5. **Key Features & Misconception Busting (7 mins)**  
     - **Feature 1:** "Everyone is reasonable"  
       - *When:* During Urn Demo (Person 3’s turn).  
       - *Script:* "Person 3 isn’t stupid. With two ‘blue’ guesses, Urn A is *probabilistically* more likely—even if they drew red!"  
     - **Feature 2:** "Cascades mimic truth"  
       - *When:* After cascade forms.  
       - *Script:* "From outside, this looks identical to a well-informed crowd. We can’t tell if they’re right or in a cascade!"  
     - **Misconceptions:**  
       - *"People are sheep":* Bust during **Person 3’s decision**. Emphasise Bayesian logic: "Following isn’t laziness—it’s maths!"  
       - *"Always ignore the majority":* Bust after **cascade stability**. Note: "Cascades are often *correct*! Ignoring them can be reckless."  
       - *"Only an internet thing":* Bust during **hook**. Use offline examples (e.g., 1990s Bristol housing bubble, folk remedies).  

  6. **Real-World Implications (2 mins)**  
     - "Cascades explain financial bubbles, fashion trends, even medical overdiagnosis—anywhere private doubts get drowned out."  

  7. **Closing Question (1 min)**  
     - **Diagnostic:** *"If the first two people guess 'Urn A', and you privately draw a red ball (Urn B is red-heavy), why might you still say 'Urn A'?"*  
     - *Tests understanding:* Correct answer cites rational probability weighting, not "following the herd".  

  ---

  ### **What to Deliberately Omit**  
  **Announce upfront:**  
  > *"Today, we skip three things: 1) Complex probability maths (no Bayes’ rule!), 2) How to ‘beat’ cascades (it’s hard!), 3) Digital vs. real-world differences (the core logic is the same)."*  

  **Why omit these?**  
  - **Maths:** Derails intuition for non-maths audiences.  
  - **"Solutions":** Overcomplicates; the goal is mechanistic insight.  
  - **Digital focus:** Avoids reinforcing "only online" bias.  

  ---

  ### **Why This Works for Your Audience**  
  - **Urn demo > abstract theory:** Concrete, visual, and isolates the cascade mechanism.  
  - **Emphasis on rationality:** Prevents dismissive "sheep" narratives. Retirees relate to nuanced social reasoning.  
  - **Timing:** Tight segments (max 7 mins each) suit shifting attention spans.  

  **Prep Tip:** Pre-draw the urn on the whiteboard. Use ✅/❌ for "blue/red" to avoid colour-blindness issues.  

  This structure ensures cascades are seen as *emergent rationality*—not folly. You’ll hear the "ah!" when Person 3 overrides their signal. Good luck!
