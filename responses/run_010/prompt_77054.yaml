prompt: |-
  ok, kind of an odd one but I could really use help, and you're the right sort of person for it — please act as a professional philosopher, specifically someone who works in metaphysics and philosophy of language and has thought hard about how words like "species" or "planet" or "art" get their boundaries. Think carefully about this and don't just give me the encyclopaedia summary. Also correct me anywhere I've described the facts wrong.

  Context: I write the exhibit text at a mid-size science center. We're redoing our solar system hall — the long walkway with the Sun at one end and everything to scale — and the centerpiece is a big wall that has to state a number. How many planets. Underneath it I get about 120 words to say why that number. This should be the easiest label I write all year and it has become a nightmare.

  Since we put up a preview of the new text, I've had emails from both directions. A retired engineer sent me three pages about how the third criterion is arbitrary and Pluto got robbed. A middle school teacher wrote to say the opposite, that we should just follow the official definition so kids don't get marked wrong on tests. A nine year old asked me in person why Pluto got kicked out and whether that was true, and I froze, because I realized I couldn't answer without saying something I think is false. Our gift shop is still selling a nine-planet plush set from 2015 and it sells fine.

  What I keep coming back to is the practice itself. There's this international union of astronomers, and it does something very specific: a few hundred members at a general assembly vote by show of hands, the vote settles what a word means, press releases go out, and the whole world treats the result as news about the solar system. In 2006 they laid down that a planet has to (a) orbit the Sun, (b) be massive enough for its own gravity to make it round, and (c) have swept its orbital neighbourhood clear of other stuff. Anything with (a) and (b) but not (c) is a dwarf planet, and they were explicit that a dwarf planet is not a kind of planet — a proposal that would have made it a subcategory was voted down. But the IAU's own list of eight planets includes Mercury, and Mercury isn't actually in hydrostatic equilibrium, so (b) fails and it counts anyway. And people point out that if you dropped Mars into the Kuiper belt it would fail (c), so planethood would depend on where a body happens to be sitting rather than on what it is.

  Meanwhile the guy who ran the New Horizons mission says anything round is a planet, which would push the count well past a hundred, and plenty of working planetary scientists just talk that way regardless of the resolution.

  So — questions, and I want you in the weeds, not at 30,000 feet:

  1. Start with some brainstorming: a rough list of the candidate pictures of what a word like "planet" could be, before you commit to any of them.
  2. What does the practice of having a naming body vote on the definition presupose about what "planet" is? Which view of meaning, or of how the world is carved up, is the one that makes a show-of-hands vote on this make sense? And which rival views does the practice quietly rule out?
  3. Here's the part I can't get straight. The practice seems to say two things at once: "we decided this" and "here's what the facts about the solar system are." The vote gets reported as a discovery. Is that coherent, or is one side confused about what it's doing? Is the public outrage a category mistake, or is the union's own framing the category mistake? I genuinely can't tell, and I suspect the answer is both, or neither.
  4. Separate, as carefully as you can, what the practice strictly requires from what it merely sits comfortably with. Where is it philosophically underdetermined — where would two or three very different theories license the exact same vote?
  5. What about Mercury, and the Kuiper-belt-Mars case? Do they get explained away, or do they show the practice is committed to something incoherent? Does it matter that (c) seems to make planethood historical and relational rather than intrinsic?
  6. Was there an option nobody took — the body officially declaring the word has two legitimate technical uses and refusing to pick one? Why do you think that isn't on the table for an institution like this? Is there a version of the practice that's more honest without being less useful?
  7. Then tell me what goes on the wall. Not necessarily the finished 120 words, but what the honest version has to say under each of the main competing pictures, and which one I can defend to both the engineer and the teacher.

  Please don't hand me a bibliography or a reading list — I have no way to look any of it up and it's useless to me. Naming the positions or types of view is fine and helpful, just don't tell me to go read something. Around 1200–1500 words would be great. Thanks!
reasoning: |-
  Okay, this is a fascinating and deeply layered request. The user works at a science center and is caught in a crossfire between public expectations, institutional definitions, and philosophical ambiguities about what constitutes a planet. They're not just asking for facts—they need to understand the conceptual underpinnings to craft an honest exhibit label that satisfies both critical thinkers (like the retired engineer) and educators (like the middle school teacher). 

  First, I recognize their frustration isn't about Pluto per se, but about the collision of three things: scientific practice, linguistic authority, and public understanding. The IAU vote isn't merely a definition—it's a performative act that masquerades as discovery, and that tension is causing their crisis. 

  The Mercury and Kuiper-belt-Mars examples they cited are brilliant because they expose the cracks in the IAU's criteria. Hydrostatic equilibrium (criterion b) is fuzzy (Mercury isn't perfectly round!), and orbital clearance (criterion c) makes planethood relational—a property dependent on location rather than intrinsic nature. That’s why planetary scientists like Alan Stern reject it; they want taxonomy based on physical attributes, not celestial real estate. 

  For question 1, I’ll map the spectrum of what "planet" could mean: from essentialist categories (like in biology) to pragmatic clusters (like "art"). The user needs to see that the IAU chose a stipulative definition—a deliberate narrowing for technical use—but presented it as descriptive. That’s the core of the backlash. 

  Question 3 is the thorniest. The IAU frames the vote as revealing solar system facts, but voting implies choice. This isn’t incoherent if we see it as institutional fiat—like defining a meter—but the outrage stems from people viewing "planet" as a natural kind term (like "water = H₂O"). The category mistake flows both ways: the public expects discovery, the IAU delivers decree. 

  For the exhibit label, I’ll suggest embracing the duality: state the IAU’s eight as the current convention while acknowledging ongoing debate. This honors the teacher’s need for testable answers and the engineer’s skepticism by showing science as process. The plush toys? A charming reminder that definitions evolve. 

  Finally, I’ll avoid jargon like "descriptivist vs. causal theory of reference" and focus on clear contrasts: "Is a planet defined by what it is or where it is?" That’s what the nine-year-old would ask. The answer matters less than showing why the question persists.
answer: |-
  Here’s a philosopher’s dissection of the Pluto problem, tailored for your exhibit wall dilemma. We’ll dig into the conceptual foundations, expose the tensions, and craft an honest solution.

  **1. Candidate Pictures of What "Planet" Could Be:**
     *   **Natural Kind Essentialism:** "Planet" picks out a fundamental, mind-independent category in nature, like "gold" or "water." Its boundaries are discovered, not decided. (Implies a single "true" answer).
     *   **Cluster Concept:** "Planet" is defined by a cluster of loosely correlated properties (orbits a star, roughly spherical, significant size, primary orbital body, not a star/gas giant remnant, etc.). No single property is necessary/sufficient; boundaries are fuzzy. Membership depends on weighting properties contextually.
     *   **Functional/Pragmatic Concept:** A planet is whatever plays the "planet role" in our scientific understanding (e.g., major bodies shaping system architecture, primary targets for study). The definition serves a purpose.
     *   **Stipulative Definition (Technical Term):** "Planet" is a technical term defined precisely by a relevant authoritative body (like the IAU) for specific scientific purposes (e.g., dynamical modeling, taxonomy). Its meaning is conventional.
     *   **Folk Concept (Prototype Theory):** "Planet" is centered around clear prototypes (e.g., Earth, Jupiter) with membership fading out (Pluto is a borderline case). Meaning is rooted in common usage and exemplars.
     *   **Historical/Lineage Concept:** "Planet" is defined by historical usage and continuity. Bodies traditionally called planets retain the status unless overwhelming reasons force a change. Focuses on narrative.
     *   **Multiple Legitimate Concepts:** There is no single "planet" concept. Different communities (astronomers, planetary geologists, public, educators) legitimately use the term with related but distinct meanings.

  **2. What the IAU Vote Presupposes & What it Rules Out:**
     *   **Presupposes:** That "planet" is fundamentally a **stipulative technical term** requiring precise definition for scientific utility. It presupposes that:
          *   Scientific progress *requires* clear boundaries for classification.
          *   An authoritative body (the IAU) is the legitimate arbiter for astronomical terminology.
          *   Meaning is determined by explicit convention, not discovery of essence or purely by common usage.
          *   The primary purpose of the definition is internal scientific coherence (dynamical astronomy), not public intuition or historical continuity.
     *   **Rules Out:**
          *   **Strong Natural Kind Essentialism:** If planethood were a fundamental natural property like atomic number, voting would be absurd; you'd discover it, not decide it. The vote treats it as conventional.
          *   **Pure Descriptivism/Folk Concept Primacy:** It rejects the idea that meaning is solely determined by widespread public or historical usage. The vote overrides tradition ("Pluto was a planet").
          *   **Radical Cluster Concept Vagueness:** It explicitly rejects inherent fuzziness; the vote aims to *eliminate* borderline cases like Pluto by fiat.
          *   **Multiple Legitimate Concepts (for *their* context):** The IAU vote implicitly claims its definition is *the* correct one for astronomy generally, not just a specific subfield.

  **3. The "Discovery" vs. "Decision" Tension: Is it Coherent? Who's Mistaken?**
     This is the core confusion. The IAU practice *is* internally coherent *if* you accept its core presupposition: that defining technical terms *is* a crucial part of scientific progress. Framing the vote as "settling the number of planets" makes sense *if*:
      *   You believe the *lack* of a clear definition was an obstacle to knowledge.
      *   Establishing the convention *enables* new discoveries and clearer communication *about* the solar system.
      The "news about the solar system" isn't that Pluto fundamentally changed, but that scientists now have an agreed-upon framework for categorizing bodies, leading to a revised count *under that framework*. The outrage stems from different views of meaning:
      *   **Public/Engineer (Often):** Leans towards **Natural Kind Essentialism** or **Historical/Folk Concept**. They hear "Pluto isn't a planet" as "Pluto changed or we discovered it lacks an essential property," not "we changed the rules." *Their category mistake* is applying the wrong theory of meaning to the IAU's action.
      *   **IAU Framing (Critically):** While coherent internally, their communication often *obscures* the conventional nature of the definition, making it sound more like a discovery of essence than a stipulation. Phrases like "clearing the neighbourhood" sound descriptive, masking its operational/arbitrary aspects. *Their framing mistake* is failing to adequately emphasize that this is a *definitional choice* made for specific reasons, not the revelation of a hidden truth. The teacher demanding the "official answer" for tests buys into the IAU's authority but may also miss the conventional aspect.

  **4. What the Practice Strictly Requires vs. What it Sits With:**
     *   **Strictly Requires:**
          *   An authoritative body with legitimacy in the field.
          *   A decision-making process (even an imperfect vote).
          *   The *intention* to define a technical term for scientific use.
          *   That the definition provides a clear boundary.
     *   **Sits Comfortably With (Underdetermined):**
          *   **The *Reasons* for choosing specific criteria:** The IAU chose (c) for dynamical reasons. A different body, or the IAU with different priorities (e.g., geophysics), could have chosen differently (e.g., Stern's "roundness") and still be engaged in the same *type* of practice. The vote doesn't *require* that (c) is the "best" criterion, only that it was chosen.
          *   **The Status of Borderline Cases:** The practice aims to eliminate them, but Mercury shows they might sneak in. The *practice* requires applying the definition consistently *after* the vote, but the *definition itself* can have ambiguities (like "hydrostatic equilibrium").
          *   **The Relationship to Other Concepts:** The practice doesn't *require* rejecting other legitimate uses of "planet" (e.g., in planetary science geology, public discourse). It only claims primacy for its *technical* definition. A more pluralistic IAU could have acknowledged this.
          *   **The Epistemology of Criteria:** Does "swept clear" (c) refer to a current state or a historical process? The practice requires a definition, but leaves room for interpretation *within* that definition.

  **5. Mercury & Kuiper Belt Mars: Explaining Away or Incoherence?**
     *   **Mercury:** This highlights the ambiguity in criterion (b) ("hydrostatic equilibrium"). Proponents argue Mercury is *sufficiently* rounded by self-gravity for its size and composition, even if not perfectly fluid. Critics see inconsistency. This shows the definition relies on **operational thresholds** that may have grey areas, not pure essence. It's a practical fuzziness in the criterion, not necessarily incoherence in the *practice* of defining.
     *   **Kuiper Belt Mars:** This exposes the **relational, non-intrinsic** nature of criterion (c). Proponents argue this is a *feature*, reflecting that a planet's dynamical role depends on its environment. Opponents (like Stern) argue taxonomy should focus on intrinsic properties (size, shape, geology). This isn't incoherence in the IAU definition *itself*; it's a deliberate choice to prioritize dynamical dominance over geophysical characteristics. It *does* matter: it shows the IAU definition is fundamentally about **orbital context and gravitational influence**, not just the body itself. Whether this is *right* depends on your view of what the concept *should* capture.

  **6. The Road Not Taken: Pluralism and Honesty**
     Yes, the IAU *could* have said: "For precise dynamical classification in contexts X, we define 'planet' as requiring (a), (b), and (c), yielding 8. For planetary geology/geophysics, 'planet' often denotes bodies with (b), yielding 100+. Both uses are legitimate scientific terminology in their respective domains." **Why wasn't this on the table?**
      *   **Craving Certainty:** Science (and especially educators/publishers) often demands unambiguous answers. Pluralism feels messy.
      *   **Institutional Authority:** Acknowledging pluralism might be seen as weakening the IAU's claim to be *the* arbiter.
      *   **Tradition of Monolithic Definitions:** Biology struggles similarly, but taxonomy often has clearer hierarchies (kingdom, phylum, class...). Astronomy lacked this for "planet."
      *   **Public Communication Challenge:** Explaining nuance is harder than declaring "8 planets."
     **A More Honest (and Still Useful) Practice:** The IAU could have:
          1.  Explicitly stated they were defining a **specific technical term** ("Major Planet" or "Dynamical Planet").
          2.  Clearly articulated the *scientific rationale* for choosing criteria focused on orbital dynamics.
          3.  Acknowledged that other definitions (geophysical: "round world") are useful in other contexts and that the historical/public term "planet" has broader connotations.
          4.  Avoided the linguistically dubious "dwarf planets are not planets" decree, allowing it to be a subcategory *within* a broader "planetary body" concept. This retains clarity for dynamics without alienating other perspectives.

  **7. What Goes on the Wall: The Honest Label (Framework)**

  > **How Many Planets? 8**
  > **According to a definition set by the International Astronomical Union (IAU) in 2006, our solar system has eight planets.**
  >
  > *   **Why this number?** Astronomers needed a clear way to classify the growing number of objects discovered beyond Neptune. The IAU defined a "planet" as a body that: 1) Orbits the Sun, 2) Is massive enough to be nearly round, *and* 3) Has cleared other significant objects from its orbital path.
  > *   **Why these rules?** Criterion 3 emphasizes a planet's gravitational dominance in its orbit – a key factor in understanding how solar systems form and evolve. Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune meet all three criteria.
  > *   **What about Pluto?** Pluto meets the first two criteria but not the third; it shares its orbital zone with many other icy bodies in the Kuiper Belt. The IAU classifies Pluto and similar worlds like Eris and Makemake as "dwarf planets" – a distinct category recognizing their roundness but not orbital dominance.
  > *   **Is this the only view?** Some scientists, particularly those studying the geology of these worlds, prefer definitions based primarily on an object's intrinsic physical properties (like being round). Under such definitions, the solar system could have over 100 "planets". The IAU definition, however, provides the currently accepted framework for astronomical classification.

  **Why this works & Defending it:**

  1.  **States the Number (8) Clearly:** Satisfies the teacher, tests, and the need for a concrete answer on the wall. Cites the authority (IAU).
  2.  **Explains the "Why" (The Practice):** Focuses on the IAU's *reason* – managing discoveries and emphasizing orbital dynamics. Explains *their* rationale for criterion 3.
  3.  **Acknowledges Pluto's Status:** Clearly under the IAU rules.
  4.  **Explains the "Dwarf Planet" Category:** Avoids the confusing "not a planet" phrasing by making it "distinct," focusing on the *difference* (orbital clearance).
  5.  **Acknowledges Legitimate Dissent:** Explicitly mentions the alternative geophysical view ("some scientists... intrinsic properties") and its consequence (100+ planets). This validates the engineer's point that other definitions are scientifically valid in different contexts. It shows science is dynamic.
  6.  **Distinguishes Concepts:** Contrastes the IAU's *dynamical* definition with a *geophysical* one. This addresses the Kuiper Belt Mars point implicitly (dynamics depend on location).
  7.  **Honest about Convention:** Uses phrases like "defined as," "classification," "accepted framework." Avoids implying this is the *only* truth or a discovered essence. Mercury's inclusion is handled by the definition's application ("meet all three").
  8.  **Avoids Falsehoods:** Doesn't claim Pluto changed. Doesn't claim criterion 3 is the only possible way. Doesn't claim the IAU view is monolithic.

  **Defense to the Engineer:** "You're right that other definitions based on an object's physical characteristics are valid and useful, especially in geology. We mention that perspective explicitly. The IAU definition prioritizes orbital dynamics for their specific purposes. Our label presents the IAU's official count *and* acknowledges your point that it's not the only scientific way to see it."
  **Defense to the Teacher:** "The label clearly states the current internationally accepted number (8) and the official IAU definition students need to know for consistency in testing. It explains the reasoning behind the rules. It also responsibly acknowledges scientific discussion exists, without undermining the established framework."

  This approach treats the public (including the 9-year-old) as capable of understanding that science involves definitions and evolving understanding. It honors the IAU's role while acknowledging the debate. It turns the controversy *into* the educational content, showing science in action. And it finally lets you point at the plush toys and say, "Those celebrate the *wonder* of these worlds, no matter the label."
