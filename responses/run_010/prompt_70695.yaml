answer: |-
  Below is a structured research proposal based on your idea, designed to be rigorous yet feasible for an 8-week timeline. I've refined the framing, clarified the gap in existing literature, and outlined a realistic methodology given your background.

  ---

  ### **Research Proposal: Correlation Tolerance in Epistemic Democracy**  
  **Subtitle:** *How Much Voter Error Correlation Can Condorcet’s Jury Theorem Withstand?*

  ---

  ### **1. Brainstorming Framings & Selection**  
  I considered four distinct framings of your core question:  

  | **Framing** | **Core Question** | **Feasibility (8 weeks)** | **Why?** |
  |-------------|-------------------|---------------------------|----------|
  | **A. Fixed-Competence Correlation Threshold** | Given fixed voter competence *p* > 0.5, what is the maximum pairwise error correlation ρ such that majority reliability remains above a critical threshold (e.g., 0.95)? | ✅ **BEST FIT** | Mathematically tractable with binomial models; avoids complex dependencies; yields visualizable results. |
  | **B. Correlation Structures & Collapse Points** | How do different correlation *structures* (e.g., uniform, clustered, hierarchical) affect the decay of majority reliability? | ❌ Not feasible | Requires modeling complex dependencies (e.g., Gaussian copulas), exceeding high-school probability. |
  | **C. Institutional Trade-offs** | Do specific institutions (e.g., secret ballots) reduce ρ more efficiently than they increase *p*, per unit cost? | ⚠️ Marginal | Demands empirical data + game theory; scope too broad. |
  | **D. Critical Correlation for Minimal Epistemic Gain** | What ρ makes majority reliability exceed individual competence (*p*) by only ε? | ✅ Possible extension | Simple for small groups; scales poorly to large *n* without approximations.  

  **Chosen Framing: A** (with D as a secondary goal). It isolates your core insight, uses accessible math, and delivers concrete thresholds.

  ---

  ### **2. Research Question**  
  *"Given a fixed level of voter competence (*p* > 0.5), what is the maximum average pairwise correlation of voter errors (ρ) that preserves high reliability (> 95%) in majority decisions for groups of size *n*?"*  

  **Why this is novel**:  
  - Standard critiques treat **independence** and **competence** as separate failure modes.  
  - Your focus on their **interaction** (correlation tolerance under *assumed* competence) is underexplored.  

  ---

  ### **3. Gap in Existing Literature**  
  The Condorcet Jury Theorem (CJT) states: If voters are independent and competent (*p* > 0.5), majority reliability → 1 as *n* → ∞. Critiques argue:  
  - **Independence objection**: Voter errors are correlated (e.g., via media or social influence), violating independence.  
  - **Competence objection**: *p* ≤ 0.5 in complex real-world decisions.  

  **The open question**: Critics assume correlation *or* incompetence defeats CJT. But **no one quantifies how much correlation CJT tolerates if *p* is granted**. This leaves epistemic defenses of democracy incomplete—your project fills this gap.  

  ---

  ### **4. Method: Week-by-Week Plan**  
  **Assumptions**: Binary decisions, homogeneous *p* and ρ, symmetric errors.  

  | **Week** | **Task** | **Formal Work** | **Output** |
  |----------|----------|-----------------|------------|
  | **1** | Literature review | Compare CJT extensions (e.g., Ladha’s correlated voters) vs. critiques (e.g., Anderson’s competence attacks) | Annotated bibliography |
  | **2** | Model setup | Define: <br> - *P*(majority correct) = *f*(*p*, ρ, *n*) <br> - Use **Ladha’s covariance model**: *Cov*(errors) = ρ⋅*p*(1−*p*) | Formal equations |
  | **3–4** | Small-*n* analysis | Compute exact reliability for *n* = 3, 5, 10: <br> - Derive *P*(*k* errors) via **correlated binomial distribution** <br> - Code simulations (Python) if closed-form intractable | Tables of *P*(majority correct) for varying ρ |
  | **5–6** | Large-*n* approximation | Use **normal approximation**: <br> Majority fails if errors > *n*/2, with *μ* = *n*(1−*p*), *σ²* = *n*(1−*p*)*p* + *n*(*n*−1)⋅ρ⋅*p*(1−*p*) | Plot reliability vs. ρ for *n* = 100, 1000 |
  | **7** | Threshold analysis | Find critical ρ where reliability <br> - Drops below 0.95 <br> - Falls to *p* (epistemic gain vanishes) | "Collapse curves" (ρ vs. *p* for fixed reliability) |
  | **8** | Institutional reinterpretation | Qualitatively link: <br> - Secret ballots → ↓ ρ <br> - Diverse media → ↓ ρ <br> - Federalism → ↓ *n* + ↓ ρ | Argument draft |  

  **Tools**: Python (NumPy, SciPy) for simulations; LaTeX for math.  
  **Gestures**: General correlation structures (beyond pairwise), heterogeneous competence, strategic voting.  

  ---

  ### **5. Success vs. Failure Criteria**  
  - **Success**:  
    - Quantified "critical ρ" for sample (*p*, *n*) pairs (e.g., "When *p* = 0.55 and *n* = 100, ρ > 0.02 collapses reliability below 80%").  
    - Novel institutional analysis: Show how devices like secret ballots target ρ, not *p*.  
  - **Failure**:  
    - Inability to derive closed-form/simulated results for *n* > 10.  
    - Oversimplifying ρ (e.g., ignoring higher-order dependencies).  

  ---

  ### **6. Scope Realism Assessment**  
  **Feasible with high-school probability** because:  
  - Core math relies on **binomial distributions** and **covariance algebra** (accessible with self-study).  
  - Ladha’s model reduces correlation to one parameter (ρ).  
  - Simulations handle intractable cases (e.g., using `scipy.stats.binom` with covariance adjustments).  
  **Risks to mitigate**:  
  - **Week 3–4 calculations**: Start with *n* = 3 to build intuition.  
  - **Normal approximation**: Validate with small-*n* results.  
  - **Time buffer**: Weeks 3–4 and 5–6 have overlap; simulations can scale.  
  **Resources**:  
  - Primer texts (e.g., Dietrich’s *Condorcet Jury Theorem: A Survey*).  
  - Simulation tutorials (e.g., Python’s SciPy docs).  

  ---

  ### **7. Why This Matters**  
  This project offers:  
  1. A **testable epistemic defense of democracy**: Institutions that reduce ρ (even slightly) can prevent reliability collapse.  
  2. **Policy relevance**: Shows why media diversity/secret ballots are *more urgent* than voter education (if ρ is the binding constraint).  
  3. **Formal clarity**: Replaces vague appeals to "collective wisdom" with quantifiable thresholds.  

  **Final Scope**: Focused, novel, and achievable—**go for it.**

  ---  
  **Next steps**:  
  1. Draft a 1-page version for your mentor.  
  2. Learn Python basics if unfamiliar (I can suggest resources).  
  3. Start Week 1 readings—I recommend beginning with Ladha (1992) and List (2004).
