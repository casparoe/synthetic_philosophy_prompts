  ### **How This Applies to Your Project**  
  - **Your 60-person pool**: Makes you a "mini-public" by default, but weakens statistical representation claims. Favors Fair-Share or Anti-Capture (since all 60 are plausibly qualified).  
  - **Contested claims in your context**:  
    - **Legitimacy**: Settled that sortition *feels* fairer in deadlocked groups; contested if it beats elections long-term.  
    - **Competence**: Settled that sortition *with expert staff* improves decisions on value-laden issues (e.g., licenses); contested for technical issues (e.g., splitting packages).  
    - **Capture**: Strong evidence it breaks short-term cliques; weak evidence against persistent ones (e.g., paid contributors).  
  - **Recommendation**: Start with a **Two-Chamber Hybrid** (e.g., random group advises on RFCs, elected council decides). It’s low-risk and tests epistemic/anti-capture benefits.  

  This instrument clarifies why you and your team argue past each other: "Legitimacy" means *procedural fairness* to Fair-Share advocates but *community buy-in* to Mini-Public fans. "Competence" means *inclusive deliberation* to Epistemic views but *technical skill* to election supporters. Use your shared answers to find compromises.
