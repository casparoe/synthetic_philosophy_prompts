  ### **The Quiz**  
  **Instructions**: For each scenario, pick **one** answer. Answer based on your instinct for your project.  

  1. **When adding a new package maintainer, the community is split between two candidates. The debate turns toxic. How should the project resolve this?**  
     A. Pick randomly from active contributors to avoid future fights.  
     B. Have a randomly selected group interview both and recommend one candidate to lead maintainers.  
     C. Let lead maintainers choose after a randomly selected group advises on community sentiment.  

  2. **A contentious license change could split the community. How should the final decision be made?**  
     A. A randomly selected group of contributors deliberates and decides.  
     B. A randomly selected group gathers input and drafts a proposal, but elected maintainers vote.  
