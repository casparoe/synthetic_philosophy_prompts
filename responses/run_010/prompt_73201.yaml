  **How to interpret your score**:  
  - Your **primary position** is the column with the most X’s.  
  - Ties indicate hybrid views (e.g., Fair-Share + Anti-Capture is common).  
  - **Emergency Reset** is niche; >2 matches imply you see sortition as a last-resort tool.  

  **Position summaries**:  
  - **Fair-Share**: You prioritize equal power distribution. Accept trade-offs (e.g., worse decisions) for fairness. Supports short terms, full authority.  
  - **Epistemic**: You believe diverse groups + expert support yield better choices. Requires long terms, staff, and binding power.  
  - **Mini-Public**: You want a community sample to advise, not decide. Prevents capture but defers to elections.  
  - **Two-Chamber Hybrid**: You want sortition and election to check each other (e.g., random group proposes, elected body ratifies).  
  - **Anti-Capture**: You aim to end toxic politics. Focuses on eliminating campaigns, not outcome quality.  
  - **Emergency Reset**: You’d use sortition only to break deadlocks/scandals, not as routine governance.  

  **Unadvocated combinations**:  
  - **Fair-Share + Mini-Public**: Incoherent. Fair-share requires power-sharing, but mini-publics have none.  
  - **Epistemic + Short Terms**: Unattractive. Epistemic benefits need time to develop expertise; short terms sabotage this.  

