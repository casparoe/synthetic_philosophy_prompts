  ### **Logical Space of Sortition Positions**
  The space is defined by two core dimensions:  
  1. **Why use a lottery?** (Primary purpose)  
  2. **Scope of power?** (How much authority the sampled body has)  

  These dimensions yield six distinct positions (leaves), plus two unadvocated combinations:  

  | Position                  | Why Lottery?                            | Scope of Power                                  | Real-World Analogy               |  
  |---------------------------|-----------------------------------------|------------------------------------------------|----------------------------------|  
  | **Fair-Share View**       | Ensure equal power among peers; no claim of better outcomes. | Full authority (replaces elections).           | Athenian Council of 500         |  
  | **Epistemic View**        | Produce better decisions via diverse deliberation + expert support. | Full authority (replaces elections).           | Modern citizens' assemblies     |  
  | **Mini-Public View**      | Create a community microcosm to advise decision-makers. | Advisory only (no binding power).              | Irish Climate Assembly          |  
  | **Two-Chamber Hybrid**    | Balance expertise and representation; prevent groupthink. | Shared power (e.g., samples propose, elected body ratifies). | Some EU participatory democracy pilots |  
  | **Anti-Capture View**     | Eliminate campaigning/favor-trading; break cliques. | Full authority (replaces elections).           | Anti-corruption reforms         |  
  | **Emergency Reset View**  | Temporarily break deadlock or capture; not for routine use. | Limited-term full authority (replaces elections temporarily). | Crisis interim governments      |  
  | **Unadvocated Combo A**   | "Fair-Share + Mini-Public": Equal power + advisory role. | Incoherent (can’t share power equally if body has no power). | *Not defended*                  |  
  | **Unadvocated Combo B**   | "Epistemic + Short Terms": Better decisions via expertise, but no time to gain it. | Unattractive (self-sabotaging; long terms are core to epistemic case). | *Not defended*                  |  

  **Key boundaries**:  
  - Fair-Share vs. Epistemic: Both want full authority, but differ on **why** (equality vs. better outcomes).  
  - Anti-Capture vs. Fair-Share: Both want full authority, but Anti-Capture focuses on **preventing conflict**, Fair-Share on **distributing power**.  
  - Mini-Public and Two-Chamber both avoid full authority but differ in **power balance** (advisory vs. shared).  

  **Athenian Correction**: You were right to suspect your initial understanding. Athenians used sortition for most civilian offices (e.g., judges, council members) but **elected military generals** (strategoi). This shows even they balanced equality with expertise.  

  **Settled vs. Contested Claims**:  
  - **Settled**: Sortition eliminates campaigning/bribery in selection; guarantees statistical representation if the pool is large.  
  - **Contested**: Whether it improves decision quality, legitimacy, or breaks capture depends on context (e.g., term length, staff support). No broad consensus.  
  - **Your 60-person pool**: This small size weakens claims about statistical representation (mini-public) but doesn’t affect anti-capture or fair-share goals.  

