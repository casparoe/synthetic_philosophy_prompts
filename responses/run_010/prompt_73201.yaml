  We are building a sorting instrument (quiz) to help the user clarify their position on using sortition (selection by lot) in their open-source project's governance. The quiz will consist of concrete scenarios with multiple-choice options. The scoring key will map answer patterns to named positions in the logical space of sortition theories.

  The user has outlined several key distinctions they care about, and we'll structure the quiz around these. The goal is to avoid abstract questions and instead use concrete situations that someone without philosophy training can answer.

  ### Key Distinctions to Cover:

  1. **Why use a lottery?** 
     - Fair share: impartial power sharing among equals, even if decisions might be worse.
     - Anti-corruption: kills campaigning, money, and favor-trading.
     - Descriptive representation: the body is a miniature of the community (mini-public).
     - Epistemic: with proper support (long terms, expert staff), it leads to better decisions.
     - Anti-capture: breaks a clique that has captured the institution.

  2. **Scope of the sampled body:**
     - Replaces elections entirely.
     - Acts as a second chamber checking an elected one.
     - Advises an elected body (which can ignore it).
     - Bound by its own deliberation or not.

  3. **Eligibility, term length, and handling unpopular decisions.**

  ### Named Positions (Leaves) to Identify:

  1. **Fair-Share View**: Lottery is the only fair way to share power among equals. No claim of better outcomes.
  2. **Epistemic View**: Lottery, with long terms and expert staff, produces better decisions.
  3. **Mini-Public View**: Sampled body informs an elected one but doesn't bind it.
  4. **Two-Chamber Hybrid**: Both a lottery-selected body and an elected one check each other.
  5. **Anti-Capture View**: Lottery stops fighting over seats and breaks cliques.

  Additionally, we are to include at least two combinations that are possible but not defended, with a note on why they are not advocated.

  ### Important Notes:

  - Avoid questions that require prior knowledge (e.g., "Is sortition democratic?").
  - Each question must be a concrete scenario with 2-3 options.
  - The quiz should have 9-10 items.
  - The user's context: the contributor list for lottery is about 60 active contributors (who merged something in the past year). We must note where this small pool affects the theory.

