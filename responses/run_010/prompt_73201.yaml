     - B. Because a randomly chosen group, if given enough time and resources, would make more informed and balanced decisions than the current council.
     - C. Because it would prevent the bitter campaigns and backroom deals that sometimes happen during council elections.

  2. **Scenario: The project is considering a major license change. How should the decision be made?**
     - A. By a randomly selected group of active contributors who deliberate together and then vote.
     - B. By an elected council, as we have now.
     - C. By a two-step process: a randomly selected group reviews the proposal and makes a recommendation, but the final decision rests with the elected council.

  3. **Scenario: A randomly selected council makes a decision that is deeply unpopular with the majority of contributors. What should happen?**
     - A. The decision stands because the council was chosen fairly and had the authority to decide.
     - B. The decision should be put to a vote of all active contributors for ratification.
     - C. The council should reconsider, but if they uphold it, then it stands.

  4. **Scenario: How should the project choose the members of a critical committee that requires deep technical expertise?**
     - A. By random selection from active contributors, because everyone is capable of learning and making good decisions with proper support.
     - B. By election, because we need to ensure that only the most qualified and experienced people are chosen.
     - C. By a hybrid: randomly select a group, but also include a few appointed experts.

  5. **Scenario: The project is growing, and some argue that the steering council is becoming an insular group. How might a lottery system help?**
     - A. By ensuring that over time, a much wider set of contributors get to serve, breaking the hold of any one group.
     - B. By creating a council that is a true reflection of the diversity of the community, leading to more inclusive decisions.
     - C. By eliminating the incentives for lobbying and campaigning that can lead to cliques.

  6. **Scenario: How long should a randomly selected council member serve?**
     - A. A short term (e.g., 6 months) to rotate the opportunity among more people.
     - B. A longer term (e.g., 2 years) to allow members to gain expertise and work effectively.
     - C. It depends on the role; some positions might need longer terms.

  7. **Scenario: The randomly selected council is deliberating on a complex issue. What resources should they have?**
     - A. They should rely on their own knowledge and the public discussion; after all, they represent the community.
     - B. They should have access to expert advisors and staff to help them understand the issue.
     - C. They should be able to commission studies and consult widely.

  8. **Scenario: Should the randomly selected council have the power to make binding decisions, or should it only advise?**
     - A. It should make binding decisions; otherwise, it's just a talking shop.
     - B. It should only advise; the real power should remain with elected bodies or the community.
     - C. It should share power with an elected body, each checking the other.

  9. **Scenario: What should be the main purpose of using a lottery in governance?**
     - A. To ensure that power is distributed fairly and prevent any one group from dominating.
     - B. To produce better decisions by involving a diverse group of people in deliberation.
     - C. To avoid the divisiveness and politicking that comes with elections.

  10. **Scenario: In the project, who should be eligible for the lottery?**
      - A. Only the most active contributors (e.g., those who have merged code in the last year) because they are the most knowledgeable.
      - B. Any contributor who has made a meaningful contribution (e.g., code, documentation, issue triage) in the last few years, to be more inclusive.
      - C. Only a subset of contributors who pass a threshold of expertise or experience.

