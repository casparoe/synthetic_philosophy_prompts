  ## Quiz: Your Views on Governance by Lottery

  **Instructions:** For each scenario, choose the option that best reflects your view. There are no right or wrong answers.

  ### Questions:

  1. **Scenario: After a controversial decision by the steering council, some contributors suggest that the council should be chosen randomly from active contributors. What is the main reason you might support this?**
