  - C: Only paperwork: the diagnosed one has a diagnosis on record, but they are the same in behavior and self-understanding. → Leaf: **Realist**

  **Node 6: The Story Rewrite**
  After diagnosis, many people reinterpret their past. What best describes your experience?
  - A: I started doing new things because of the diagnosis (e.g., using strategies, meds, accommodations). → Go to Node 5
  - B: I didn’t change what I do, but I now describe my past actions in terms of ADHD traits. → Go to Node 4
  - C: Both: I changed my behavior and also reinterpreted my past. → Go to Node 5

  **Node 7: The Feedback Loop**
  Over time, the way people with ADHD act and talk about it has influenced the official criteria. How do you see that?
  - A: The criteria should be based on science, not on what patients say. → Leaf: **Realist**
  - B: The criteria change because we (people with ADHD) show that the old criteria missed important things. → Leaf: **Looped Criteria**
  - C: It’s a two-way street: our experiences shape the criteria and the criteria shape us. → Leaf: **Interactive Kind**

  **Leaves (Final Positions):**

  1. **Realist** [Realism]: The ADHD traits were there all along, and the diagnosis simply found them without changing anything fundamental about you.
  2. **Expression Shift** [Reactive Expression]: The diagnosis changed how your traits are expressed (e.g., coping strategies, self-acceptance) but not the underlying traits themselves.
  3. **Strong Social Construction** [Strong Constructivism]: The diagnosis changed who you are, and there's no fact about what you would have been like without it — the label creates the reality.
  4. **Situational Change** [Social Accommodation]: The diagnosis changed your situation (how others treat you, accommodations at work/school) but not your core self.
  5. **Interactive Kind** [Interactive Realism]: ADHD is a real kind that couldn't have existed before the label, because the label shapes how we experience and understand it.
  6. **Looped Criteria** [Community Feedback]: The criteria for ADHD are pushed and reshaped by the community of diagnosed people, making the manual downstream of lived experience.
  7. **Label as Shorthand** [Narrative Reconstruction]: The label is just a shorthand for a cluster of traits; any feeling that it changed you is just your memory tidying up the past.

  **End Notes:**

  1. **Unresolved Pairs**: 
     - The tree may not cleanly separate **Realist** and **Label as Shorthand** in all cases. Both deny that the label changes the person, but Realism emphasizes pre-existing traits, while Label as Shorthand emphasizes narrative reinterpretation. To split them, ask: "If the diagnosis were proven wrong, would you feel like you lost a part of yourself, or just a useful story?"
     - **Expression Shift** and **Strong Social Construction** are split by Node 5 (symptoms vs. expression), but if someone believes the diagnosis changes both expression and core traits, the tree forces a choice. An extra question: "Do you feel the diagnosis created entirely new traits, or just new ways of handling old ones?" could help.

  2. **Empty Spots**:
     - A combination like "the diagnosis changed my situation and also created new traits" isn't represented by a single leaf. Why? Situational Change explicitly denies change in the person, while Strong Social Construction focuses on personal change. In practice, people might hold both, but the tree doesn't merge them.
     - "The diagnosis changed both my expression and the criteria" isn't a leaf. Why? Looped Criteria focuses on diagnostic criteria, while Expression Shift is personal. These are seen as separate mechanisms.

  3. **Node Disagreements**:
     - Node 1: Live debate (trait awareness vs. creation).
     - Node 2: Live (social vs. biological models of ADHD).
     - Node 3: Live (essentialism vs. social construction of categories).
     - Node 4: Live (self-knowledge effects in psychology).
     - Node 5: Live (evidence mixed on diagnosis impact).
     - Node 6: Live (narrative identity research is ongoing).
     - Node 7: Live (participatory vs. expert-driven diagnostics).

