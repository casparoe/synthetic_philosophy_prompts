answer: |-
  ### Program Equilibrium Card Game Design  

  **Materials**:  
  - 16+ blank index cards.  
  - Pens.  
  - Envelopes (for sealing).  
  - Payoff matrix poster: (C,C)=(3,3); (C,D)=(0,5); (D,C)=(5,0); (D,D)=(1,1).  
  - Timer.  

  **Card-Writing Rules**:  
  1. **Content**: Each card must define a *deterministic* output (C/D) based *only* on the opponent’s card text. No external inputs.  
  2. **Legal References**: May use:  
     - Exact string matches (e.g., "if opponent’s card says ‘X’").  
     - Direct comparisons (e.g., "if opponent’s card equals this card").  
     - Basic string operations (e.g., "if ‘cooperate’ appears").  
     *Illegal*: Math, randomness, or external data.  
  3. **Sealed Option (Round 2)**: Players may seal their card in an envelope. Sealed cards *must* be unconditional (write only "C" or "D").  

  **Payoff Scheme**:  
  - Points tracked publicly (no real money). Arbiters announce payoffs using the matrix. "Tournament winner" bragging rights.  

  **Timeline (90 min)**:  
  - **0–5 min**: Intro. Display payoff matrix. Explain: "Write a strategy card deciding C/D. It can *read* the opponent’s card. Cards paired randomly; arbiter evaluates aloud. Goal: Maximize points." *Do not mention "equilibrium" or "program"*.  
  - **5–20 min**: **Round 1 (Open)**. Students write cards (10 min). Collect, shuffle, pair into 8 groups. Assign first arbiter.  
  - **20–50 min**: **Evaluation**. Arbiter reads both cards, computes outcomes step-by-step (e.g., "Card A says ‘C if B says C’... so A= C, B= D"). Record payoffs. Rotate arbiter each pair. *Force pause if loop detected (see below)*.  
  - **50–55 min**: **Round 2 (Sealed Option)**. Rewrite cards. Add rule: "You may seal your card (envelope); if sealed, write *only* ‘C’ or ‘D’. Opponent sees ‘SEALED’."  
  - **55–65 min**: Write/seal cards. Collect.  
  - **65–75 min**: **Evaluation**. Arbiter handles sealed cards as "SEALED" text (unsealed cards can condition on this).  
  - **75–85 min**: **Debrief**. Reveal "program equilibrium" term. Map experiences:  
    - *Unconditional defection*: "In Round 1, if you defected, did opponents defect back? When cards are open, defection invites retaliation." → *Formal link: In program games, strategies condition on code; defection isn’t dominant if readable.*  
    - *Self-enforcing code*: "Did anyone write ‘C only if cards match exactly’? When paired, it worked! But if one card added a comma, it collapsed." → *Formal link: This is a Nash equilibrium in programs (if all use same code), but fragile to tiny changes.*  
    - *Arbiter loop*: "When cards referenced each other infinitely (e.g., ‘Do opposite of opponent’), the loop halted play. *You* proposed fixes (e.g., ‘default to D’)." → *Formal link: Real programs require halting conditions; infinite loops break computability.*  
    - *Sealed round*: "Sealing felt safer? But points dropped? Transparency enables conditioning, raising payoffs." → *Formal link: Free transparency enables cooperative equilibria.*  
  - **85–90 min**: Recap "program equilibrium": Strategies as code, mutual readability enables cooperation beyond Nash.  

  **Predictable Problems & Fixes**:  
  - **Ambiguous Cards**: Arbiter struggles to parse (e.g., vague wording). *Fix*: Arbiter asks class to vote on interpretation.  
  - **No Self-Referential Card**: The critical "match exactly" card doesn’t emerge. *Fix*: Plant a prepared pair post-evaluation to demo fragility.  
  - **Loop Not Caught**: Arbiter misses recursion (e.g., "Do what opponent does"). *Fix*: Instructor pauses: "Did anyone notice unresolved conflict? Propose a rule."  
  - **Sealed Round Confusion**: Students write conditionals but seal. *Fix*: Before writing, clarify: "Sealed = unconditional only!"  

  **Frank Limitation**:  
  "The card game cannot enforce *halting guarantees*—real program equilibria require strategies to terminate, but here, human arbiters must subjectively break loops."
