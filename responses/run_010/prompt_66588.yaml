prompt: |-
  I'm sitting in a seminar on disagreement and evidence this semester, mostly upper-level undergrads plus two MA students, and we've spent the last four weeks on higher-order evidence. Here's my problem: every reading seems to assume a different answer to a question that comes before the arguments, namely what an account of higher-order evidence is even supposed to do. Our professor keeps telling us to just look at the cases, but the cases get described differently depending on which camp is describing them, so the verdicts fall out of the setup rather than the argument. I'm supposed to pick a paper topic next week and I don't want to write about a dispute until I know what would settle it. So: give me the spec. What does an adequate theory of higher-order evidence have to deliver, requirement by requirement — and for each one, what's the phenomenon that motivates it (the case it has to get right, the distinction it can't collapse, the background result it can't contradict), and is it genuinely non-negotiable or is it just something one side of the debate insists on and the other side would happily reject?

  The cases I care about at minimum: the impairment ones, where you get credible news that your reasoning is compromised by something like a drug or altitude or fatigue while your evidence about the first-order question is unchanged (including the version where the news is misleading and nothing is actually wrong with you); the peer-disagreement ones; the iterated ones, where you get higher-order evidence about your higher-order evidence, and whether the theory has to keep that from running away; and ones where the thing you're told to distrust is a competence you already have a lot of independent reason to trust, like arithmetic or reading a gauge you use every day. The distinctions I want respected: evidence about the world versus evidence about your evidence; actually having a defeater versus merely having reason to think you have one; being rational versus being rational-by-your-own-lights; "I can't tell whether I'm impaired" versus "I'm impaired"; and whatever a theory says has to be consistent with the fact that you can't generally be in a position to know that your own cognitive states are obtaining, so no theory gets to assume you always have transparent access to your own reliability. Also worth saying explicitly which candidate requirements are doing no real work — like demands that a theory explain every intuitive verdict about every case, since half the verdicts are what's contested.

  The part I actually most want is the tension, if there is one. My suspicion is that the list can't all be satisfied at once, roughly along these lines: if higher-order evidence genuinely defeats, then in the drug case you're required to drop your confidence, but by your own lights the first-order evidence still supports the high confidence, so you're required to hold exactly the mismatched pair of attitudes that a separate and widely accepted constraint says is forbidden. If something like that is right, tell me which requirement has to give and what the options look like once you give it up, and tell me which single requirement does the most work knocking candidates out. Then briefly — a few lines each, no scorecard — where the main contenders land against the list: the view that your total evidence including the higher-order stuff just fixes your attitude, the steadfast view, the level-splitting view that says you can be both rational and akratic, and the conciliatory take imported from disagreement. Don't bother with references or a reading list, I'll chase those down in the library myself; I want the criteria argued for rather than asserted, because that's the part I can't get from the handouts.
reasoning: |-
  Okay, the user is in a seminar on disagreement and evidence, focusing on higher-order evidence (HOE). They're struggling because each reading assumes a different purpose for a theory of HOE, and the cases are described differently by different camps. They need to pick a paper topic soon and want to understand what an adequate theory of HOE must deliver—its requirements, the phenomena motivating them, and which are non-negotiable. They also want to know if there's tension between requirements and how main views handle them.

  First, I need to break down the core requirements for any theory of HOE. The user mentioned specific cases: impairment (both accurate and misleading), peer disagreement, iterated HOE, and cases involving trusted competencies. They also care about distinctions like evidence about the world vs. evidence about evidence, having a defeater vs. thinking you have one, and rationality vs. rationality-by-own-lights. Plus, no theory can assume transparent access to cognitive states.

  The key requirements I should cover include:
  1. **Defeater Power**: HOE can undermine first-order beliefs. Motivated by impairment cases where, even if misleading, you should lower confidence.
  2. **Non-Redundancy**: HOE isn't just part of first-order evidence. It's distinct, as in peer disagreement where the disagreement itself is evidence about your reliability.
  3. **Akrasia Avoidance**: Rational agents shouldn't hold mismatched attitudes like "p is true but I shouldn't believe it." This comes from the idea that rationality requires coherence.
  4. **Transparency Denial**: We don't have perfect access to our cognitive states. In cases like misleading impairment news, you might doubt yourself without actual impairment.
  5. **Iteration Stability**: Handling multiple layers of HOE without infinite regress or collapse. For example, evidence about your assessment of HOE shouldn't lead to paralysis.
  6. **Competence Preservation**: Trusted skills (like arithmetic) shouldn't be easily defeated by HOE. If a gauge reader gets HOE, but has a long track record, the theory shouldn't demand they doubt it entirely.

  Now, tensions. The big one is between **Defeater Power** and **Akrasia Avoidance**. If HOE defeats first-order belief, you must lower confidence (Defeater Power). But your first-order evidence still supports the original belief, so you might believe "p is likely true, but I shouldn't believe it," which is akratic. Akrasia Avoidance forbids this. So one must give. 

  If Akrasia Avoidance is dropped, level-splitting views allow rational akrasia. If Defeater Power is limited, steadfast views might resist conciliation in some cases. 

  The user wants to know which requirement does the most work knocking out theories. **Akrasia Avoidance** is crucial here. Views that accept it (like total evidence) must explain away akrasia, while those that reject it (level-splitting) embrace it. 

  Next, how main contenders handle the requirements:
  - **Total Evidence (Unified)**: All evidence (first and higher-order) determines doxastic attitude. Satisfies Non-Redundancy and Transparency Denial. Struggles with Akrasia Avoidance in impairment cases, leading to akrasia. Iteration can be handled, but Competence Preservation might be shaky if HOE overrides strong first-order evidence.
  - **Steadfast**: HOE rarely defeats, especially with strong first-order evidence. Meets Competence Preservation and avoids akrasia. But fails Defeater Power in impairment cases and may violate Non-Redundancy by treating HOE as weak.
  - **Level-Splitting**: Accepts rational akrasia. Defeater Power and Non-Redundancy are satisfied; akrasia is allowed. Transparency Denial works, but Iteration might lead to complex hierarchies. Competence Preservation could be maintained by not fully defeating.
  - **Conciliationism**: In peer disagreement, split the difference. Similar to Defeater Power. Akrasia is managed by adjusting beliefs, but in impairment, might still face issues. Iteration could force suspension. Competence Preservation might be violated if HOE requires doubt even in strong competency cases.

  The user's suspicion about tension is spot on. The core conflict is Defeater Power vs. Akrasia Avoidance. Addressing this tension makes for a strong paper topic. They should explore which requirement to drop and the implications. Competence Preservation and Iteration Stability add further constraints that different theories handle variably. 

  I need to present this clearly, focusing on requirements, their motivations, the tension, and how each view fares without getting bogged in references. Highlighting that Akrasia Avoidance is the linchpin that shapes the debate will help the user frame their paper.
answer: |-
  Here's the specification for an adequate theory of higher-order evidence (HOE), breaking down requirements, their motivations, negotiability, and the core tension. This framework should help you evaluate theories independently of partisan setups.

  ### Core Requirements (Non-Negotiables)
  1. **Defeater Power**:  
     - *Requirement*: Credible HOE *can* rationally defeat first-order justification, even when first-order evidence remains unchanged.  
     - *Motivation*: **Impairment cases (accurate)**. E.g., credible news you’ve been drugged (even if true) forces reduced confidence in your calculation, *regardless* of the first-order math evidence. Rejecting this denies the intuitive obligation to self-doubt.  
     - *Non-negotiable?* **Yes**. All serious theories accept this; denying it collapses HOE into inert noise.

  2. **Non-Redundancy**:  
     - *Requirement*: HOE isn’t reducible to first-order evidence; it provides distinct normative force.  
     - *Motivation*: **Peer disagreement**. The mere fact of a peer’s disagreement is HOE that affects rationality, even if all first-order data is shared. Reducing HOE to first-order evidence misses this dynamic.  
     - *Non-negotiable?* **Yes**. Theories rejecting this (e.g., extreme steadfast views) fail to capture HOE’s unique role.

  3. **Transparency Denial**:  
     - *Requirement*: Agents lack infallible access to their own reliability. HOE can create uncertainty about whether you’re rational, competent, or impaired.  
     - *Motivation*: **Misleading impairment cases**. If told you’re drugged (but you’re not), you *should* doubt your judgment despite being unimpaired. A theory requiring transparent self-knowledge would implausibly demand ignoring the HOE.  
     - *Non-negotiable?* **Yes**. Contradicts foundational epistemology (anti-luminosity).

  ### Contentious Requirements (Negotiable but Central)
  4. **Akrasia Avoidance**:  
     - *Requirement*: Rational agents cannot simultaneously believe *P* and believe their belief in *P* is irrational ("rational akrasia" is impossible).  
     - *Motivation*: Structural coherence. E.g., believing "The gauge reads 100, so pressure is high" while also believing "My gauge-reading ability is impaired, so I shouldn’t trust this" seems self-undermining.  
     - *Negotiable?* **Yes, but pivotal**. Rejecting this enables "level-splitting" views; accepting it forces HOE to override first-order attitudes.

  5. **Competence Preservation**:  
     - *Requirement*: Strong independent evidence of competence (e.g., lifelong reliable arithmetic) can *resist* HOE-driven defeat in some cases.  
     - *Motivation*: **Trusted-competency cases**. If you’re an expert gauge-reader with a flawless record, marginal HOE (e.g., mild fatigue) shouldn’t destroy justification.  
     - *Negotiable?* **Yes**. Steadfast views insist on this; conciliationists often reject it.

  6. **Iteration Stability**:  
     - *Requirement*: Handling iterated HOE (e.g., evidence about your assessment of HOE) without regress or paralysis.  
     - *Motivation*: **Iterated impairment**. E.g., being told your doctor misdiagnosed your impairment. A theory shouldn’t demand infinite doubt or collapse into skepticism.  
     - *Negotiable?* **Yes**. Some views (e.g., unified evidence) handle this better than others.

  ---

  ### The Core Tension
  **Defeater Power + Transparency Denial vs. Akrasia Avoidance**  
  - In impairment cases, Defeater Power + Transparency Denial force you to lower confidence in *P* (e.g., "Pressure isn’t high"). But your unimpaired first-order evidence *still supports P*. By your own lights, you now hold:  
    - (A) "My first-order evidence supports *P*" (unchanged),  
    - (B) "I shouldn’t believe *P*" (due to HOE).  
  - **Akrasia Avoidance forbids (A) + (B)**. This is the "mismatched attitudes" problem you suspected.  

  **Resolution Options**:  
  - **Reject Akrasia Avoidance**: Embrace rational level-splitting (e.g., "I’m rational in believing *P*, but also rational in believing I shouldn’t believe *P*"). Solves the tension but violates coherence intuitions.  
  - **Limit Defeater Power**: Claim HOE *replaces* first-order justification (not just defeats it). Makes (A) false—you no longer "see" the first-order support. But this clashes with Transparency Denial (you might still introspect the evidence).  
  - **Reject Non-Redundancy**: Argue HOE alters first-order evidence. Implausible for cases like peer disagreement (the physical evidence doesn’t change).  

  **▶ The knockout requirement is Akrasia Avoidance.** It's the fault line: accept it, and HOE must "silence" first-order reasons; reject it, and akrasia becomes permissible.

  ---

  ### How Major Views Handle Requirements
  - **Total Evidence (Unified)**: HOE is folded into total evidence to fix one rational attitude.  
    - *Meets*: Non-Redundancy, Transparency Denial, Iteration Stability.  
    - *Fails*: Akrasia Avoidance (often outputs akrasia) and Competence Preservation (HOE can override expertise).  
    - *Tension*: Defeater Power is satisfied, but Akrasia Avoidance isn’t—akrasia is common.

  - **Steadfast**: Rejects HOE’s power when first-order evidence is strong.  
    - *Meets*: Competence Preservation, Akrasia Avoidance.  
    - *Fails*: Defeater Power (ignores impairment obligations), Non-Redundancy (treats HOE as weak first-order evidence).  
    - *Tension*: Prioritizes Akrasia Avoidance by limiting Defeater Power.

  - **Level-Splitting**: Allows rational akrasia; HOE affects beliefs about rationality, not first-order beliefs.  
    - *Meets*: Defeater Power, Non-Redundancy, Transparency Denial, Competence Preservation (can trust *P* while doubting reliability).  
    - *Fails*: Akrasia Avoidance (by design).  
    - *Tension*: Resolves by rejecting Akrasia Avoidance.

  - **Conciliationism**: HOE (e.g., peer disagreement) demands significant belief revision.  
    - *Meets*: Defeater Power, Non-Redundancy.  
    - *Fails*: Competence Preservation (peers override expertise), Akrasia Avoidance (if conciliation creates mismatched attitudes).  
    - *Tension*: Upholds Defeater Power but risks akrasia; often "solves" it by overriding first-order support.

  ---

  ### Summary for Your Paper
  The irreconcilable tension is between **Defeater Power** (HOE *must* sometimes force belief revision) and **Akrasia Avoidance** (you can’t rationally believe *P* while believing your belief is irrational). **Transparency Denial** exacerbates this by making self-doubt possible even when competent. **Competence Preservation** and **Iteration Stability** are secondary constraints that eliminate extreme options.  

  **Your suspicion is correct**: Any theory must sacrifice either Akrasia Avoidance (allowing rational "mismatch") or constrain Defeater Power (weakening HOE’s normative force). The most productive paper topic would be exploring this trade-off in your key cases (e.g., "Can Competence Preservation mitigate the akrasia problem in impairment scenarios?"). Focus on what *phenomenon* each view privileges—e.g., level-splitting prioritizes psychological realism; conciliationism prioritizes disagreement’s normative weight.
