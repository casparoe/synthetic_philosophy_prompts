prompt: |-
  So last night I got into a two hour argument with my flatmate about Jeffrey conditionalization and I lost, or at least I couldn't say the thing I wanted to say, and unfortunately I'm the one who has to teach it next Thursday. His line was basically: there's no such thing as uncertain evidence, if you're only 70% sure the swatch is green then you are 100% sure that you're having a greenish-looking experience, so you just describe your evidence more finely and ordinary conditionalization does the whole job — probability kinematics is a solution in search of a problem. I mumbled something about the fine-grained experience proposition not being available to you in advance and him saying that's an admission, and then we went in circles about Dutch books at 1am. I don't need you to settle that for me right now, I need a plan, because half the room will have had his thought already.

  The setting: I'm TA-ing a 75-minute section attached to a second-year cognitive science methods course, eleven students, whiteboard and no slides. They've all done Bayes' theorem for a binary hypothesis and can grind out a posterior, three of them have built a naive Bayes classifier in a lab, one has read some rationalist blog stuff and will have opinions, and nobody has ever seen a partition written down as a formal object or seen a conditional probability fail to exist. No measure theory, no proofs, fractions on the board are fine. What I want from you is the teaching plan, not the explanation: give me the order the pieces have to go in and the dependency logic for that order (in particular — does the rigidity assumption get stated before the updating formula or after, because I worry that if it comes after it looks like a patch bolted on to make the numbers come out right), and tell me which single example should carry the whole session. I want your reasoning about what that example has to have and what it has to lack: does the partition need three cells rather than two, does the example need to let them actually compute before-and-after numbers by hand, does it need to be a perception case at all or would a testimony/expert-report case be better, and should it be the cloth-under-shifting-light thing everybody reaches for or is that one actively misleading here? Say why not the alternatives I'd otherwise default to — the urn you glimpse in bad light, the vague medical test result, the rain-through-a-curtain.

  Then the misconception map, which is the part I actually care about. Tell me which wrong ideas this audience will walk in with versus form during the session, and pin each one to the exact moment in the sequence where I should head it off: that rigidity means you're never allowed to change your mind about anything, that the new partition probabilities are just made up so the rule has no content, that you can shove your confidence into the content of the evidence and conditionalize on 'the swatch is probably green', that kinematics is just the law of total probability dressed up, that it's an incoherent way to update because it isn't conditioning, and my flatmate's — that a sufficiently fine description of your own experience always makes the uncertainty disappear. For that last one I want to know whether there's a point in the sequence where a single sentence defuses it or whether it genuinely needs a detour, and if it needs a detour, how long and what I concede in order to keep it short. Also tell me what I should leave out and explicitly flag as left out at this level — I'm thinking the order-dependence of successive kinematic shifts, the problem of where the inputs come from, the old evidence thing, whatever Dutch book argument exists here — and end with the one question I can put to the room in the last five minutes that would show me whether the idea landed rather than just that they can copy the formula.
reasoning: |-
  Okay, let me tackle this teaching plan for Jeffrey conditionalization. The user is a TA who lost an argument to their flatmate and needs to prepare a section where students might have similar objections. The key challenge is addressing the "no uncertain evidence" objection while keeping the session accessible to second-year cognitive science students.

  First, I need to consider the students' background. They know Bayes' theorem for binary hypotheses and can calculate posteriors, but haven't seen partitions or conditional probabilities failing. So the example must be simple enough for hand calculations but complex enough to demonstrate the need for Jeffrey's approach.

  The cloth-under-shifting-light example comes to mind, but I recall the user's concern about it being misleading. The problem is that in this case, you could argue the evidence is about your perception rather than the cloth color. So maybe an expert testimony case would be better - like a doctor giving a vague diagnosis. This avoids the perception debate entirely and makes the evidence uncertainty more objective.

  For the sequence, I should start by reactivating their existing knowledge of Bayesian updating with a simple case where evidence is certain. Then introduce a scenario where the evidence is uncertain - like the doctor's report with varying confidence levels. This creates a natural need for a new method.

  The rigidity assumption is tricky. If introduced after the formula, it might seem like a patch. Better to state it upfront when presenting the partition, emphasizing it's about maintaining relationships despite changing beliefs. The medical test example can demonstrate this clearly - the probability of having the disease given the test result shouldn't change just because you're unsure about the result itself.

  Now for misconceptions. The flatmate's "fine-grained evidence" objection is crucial. I need a concise response: while experiences can be described finely, we often lack the priors for those descriptions or need to share beliefs about external events. This should come when first contrasting Jeffrey with standard conditioning.

  Other misconceptions to address:
  - Rigidity isn't about never changing beliefs, but preserving certain relationships
  - The partition probabilities aren't arbitrary - they come from your current evidence assessment
  - You can't just conditionalize on "probably green" - that's not a proposition with defined probabilities

  For the closing, instead of complex calculations, I'll ask students to articulate why standard conditioning fails in the doctor example. Their ability to identify the uncertain evidence problem will show if the concept landed.

  The key is maintaining focus - skip Dutch books, old evidence problems, and order dependence. Explicitly state these are advanced topics. Keep the medical example running throughout for consistency, with concrete numbers they can compute step-by-step.
answer: |-
  Here's a battle-tested teaching plan designed to preempt the "fine-grained evidence" objection while grounding Jeffrey Conditionalization (JC) in concrete necessity. The goal is to make **uncertain evidence feel unavoidable** and **rigidity feel natural**.

  **Core Strategy:** Use an **expert testimony case** (not perception) to sidestep the "it's just about your experience" objection. Make rigidity explicit *before* the formula. Focus on **computational necessity**, not philosophy.

  **The Anchor Example: Doctor's Vague Report (Critical Choice)**
  *   **Why this?** 
      *   **Avoids Perception Debates:** Your flatmate's "greenish experience" trap is perception-based. Testimony about an *external event* (doctor's diagnosis) forces evidence uncertainty into the world, not just your senses.
      *   **Requires Partition >2:** Use a disease with **3 possible severities** (Mild, Moderate, Severe - `M`, `O`, `S`). This prevents binary thinking and makes JC's generality clear.
      *   **Enables Hand Calculation:** Use small, intuitive numbers (e.g., base rates 40%, 30%, 30%). Students *can* compute the posterior.
      *   **Makes Rigidity Plausible:** A doctor's *report accuracy* feels separable from the *disease base rate*.
      *   **Not Misleading:** Unlike shifting light (where color *is* perception-dependent), disease severity is objective, even if reported unclearly.
  *   **Why NOT the Alternatives?**
      *   *Urn in Bad Light:* Too easily reduced to "I'm certain about the light's effect, uncertain about the ball." Invites fine-graining.
      *   *Vague Medical Test:* Usually binary (Positive/Negative), insufficient for partition >2 demonstration.
      *   *Rain-through-Curtain:* Perception-based again. "Looks rainy" invites "be certain about how it looks."
      *   *Cloth-under-Light:* Perception-based and often binary (Green/Not Green). Prime target for your flatmate's objection.

  **Teaching Plan (75 Minutes - Whiteboard Focused)**

  1.  **Recall & Contrast: Standard Conditionalization (10 mins)**
      *   *Do:* Quick review. Hypothesis: `Patient has Moderate severity (O)`. Evidence: `Doctor says "Moderate" (Rep_O)`. Assume report is 90% accurate for each severity (P(Rep_O|O)=0.9, P(Rep_O|M)=0.05, P(Rep_O|S)=0.05). Give simple priors (P(M)=0.4, P(O)=0.3, P(S)=0.3). Calculate P(O|Rep_O) using Bayes. Emphasize **certain evidence**: "Doctor *said* 'Moderate'."
      *   *Why:* Reactivate skills, set the baseline. Highlight **evidence as a certain proposition** (`Rep_O`).

  2.  **Introduce the Problem: Uncertain Evidence (15 mins)**
      *   *Do:* "But what if the doctor is rushed? They mumble, sound unsure. You leave thinking: 'Hmm... I'm only about **70% sure** they said "Moderate". Maybe 20% they said "Mild", 10% "Severe".' How do you update your belief about `O` *now*? You don't have a *single* certain evidence proposition to condition on (`Rep_O`, `Rep_M`, or `Rep_S`)."
      *   *Whiteboard:* Define the **evidence partition**: `{Rep_M, Rep_O, Rep_S}`. State your **uncertainty about the evidence itself**: New probabilities `P_new(Rep_M) = 0.2`, `P_new(Rep_O) = 0.7`, `P_new(Rep_S) = 0.1`. These come from your assessment of the *doctor's mumble*.
      *   *Why:* Create the **core problem** vividly. The uncertainty is about *which report was actually given*, an external event. Fine-graining (e.g., "I'm certain I heard a mumble sounding 70% like 'Moderate'") feels forced and lacks clear priors.

  3.  **The Rigidity Assumption (KEY EARLY PLACEMENT - 15 mins)**
      *   *Do:* "We need to connect our uncertainty about the *report* to our beliefs about the *disease*. Crucially, while the *report* was unclear, **did the doctor's *accuracy* change?** Probably not. Their skill didn't vanish because they mumbled! We assume the **relationship between disease and report *given the report type* stays fixed:** `P(Rep_X | M)`, `P(Rep_X | O)`, `P(Rep_X | S)` haven't changed. This is **Rigidity**: The likelihoods `P(Evidence | Hypothesis)` *for specific evidence propositions* are stable, even when we become uncertain *which* evidence proposition is true."
      *   *Whiteboard:* Write `P(Rep_O | O) = 0.9` (Stable!), `P(Rep_O | M) = 0.05` (Stable!), etc. Contrast with `P_new(Rep_O) = 0.7` (Changed!).
      *   *Why:* Introduce rigidity **BEFORE** the formula. Frame it as a **plausible assumption about how the world works** (doctor's skill), not a mathematical trick. This makes JC feel like a *consequence* of rigidity + evidence uncertainty.

  4.  **Jeffrey Conditionalization: The Formula & Application (20 mins)**
      *   *Do:* "Given rigidity, how *do* we find `P_new(O)`? We use the **Law of Total Probability**, but with our *new* evidence probabilities and the *old*, *rigid* relationships." Derive/State:
          `P_new(O) = P(O | Rep_M) * P_new(Rep_M) + P(O | Rep_O) * P_new(Rep_O) + P(O | Rep_S) * P_new(Rep_S)`
          Emphasize: `P(O | Rep_X)` are **fixed** (rigidity!), calculated from the *original* priors and likelihoods (like step 1). `P_new(Rep_X)` come from your *current* evidence assessment.
      *   *Whiteboard:* Calculate the needed `P(O | Rep_X)` terms using original priors/likelihoods (from step 1). Show the full JC calculation for `P_new(O)` using the new evidence probabilities (0.2, 0.7, 0.1). Do the same for `P_new(M)` and `P_new(S)` for comparison. Show the shift from the prior.
      *   *Why:* JC emerges naturally as the tool for updating hypotheses when evidence propositions are uncertain *but the links remain rigid*. The computation is concrete and leverages their existing Bayes skills.

  5.  **Contrast & Justification (10 mins)**
      *   *Do:* Recap: Standard conditioning needs `P(Certain_Evidence | Hyp)`. JC handles `P(Uncertain_Evidence_Cell)`. Rigidity justifies using the old `P(Hyp | Evidence_Cell)`.
      *   *Address Fine-Graining Briefly:* "Could I invent a proposition like 'The mumble sounded 70% Moderate'? Maybe, but what's its prior? What's P(Disease | *that specific sound*)? We usually lack that detail! JC lets us work with the natural, coarse-grained evidence propositions (`Rep_M`, `Rep_O`, `Rep_S`) that we *do* have models and priors for, while incorporating our uncertainty *about them* directly." **<-- Crucial 2-Sentence Defusal**
      *   *Why:* Explicitly contrast JC with standard conditioning. Give the pragmatic rebuttal to fine-graining: **lack of priors/models** for hyper-specific evidence propositions makes it impractical, even if conceivable.

  6.  **Check Understanding & Wrap-up (5 mins)**
      *   *The Revealing Question:* "**In the doctor example, *why* couldn't we just use our standard Bayesian update (conditionalization) after the mumbly report? What was missing that we *did* have when the report was clear?**"
      *   *Desired Answer:* "We didn't have a *single certain piece of evidence* to condition on (`Rep_O` was only 70% likely). We had probabilities *over* different possible evidence statements."
      *   *Why:* This tests if they grasp the **core problem** JC solves (uncertain evidence proposition) rather than just memorizing the formula.

  **Misconception Map & Defusal Strategy**

  *   **Wrong Idea:** "Rigidity means you're never allowed to change your mind about *anything* related to evidence/hypotheses."
      *   *When:* During/After Step 3 (Rigidity Intro).
      *   *Defusal:* "Rigidity is specific! It *only* says the **accuracy links** (`P(Report | Disease)`) stay fixed *for this specific update*. You absolutely *can* change your mind about the doctor's accuracy later, based on *new* evidence (e.g., lab tests proving them wrong). That would be a *different* update, potentially changing those likelihoods for the future."
  *   **Wrong Idea:** "The new evidence probabilities (`P_new(Rep_X)`) are just made up, so JC has no real content/is arbitrary."
      *   *When:* During Step 2 (Uncertain Evidence Intro) or Step 4 (Formula).
      *   *Defusal:* "These probabilities *are* your **direct assessment of the current evidence strength**, just like your prior was your assessment before any evidence. JC tells you how to *propagate* that uncertainty through your existing model (`P(Disease | Report)`). It doesn't invent the inputs; it uses your best judgment about the evidence *now*."
  *   **Wrong Idea:** "I can just condition on 'The doctor probably said Moderate'."
      *   *When:* During Step 2 or Step 5 (Contrast).
      *   *Defusal:* "Conditioning requires a *specific proposition* with defined truth conditions. What does 'The doctor *probably* said Moderate' *mean*? How likely is it *given* Mild disease? JC avoids this vagueness by directly using your confidence *about the specific reports* (`Rep_M`, `Rep_O`, `Rep_S`)."
  *   **Wrong Idea:** "JC is just the Law of Total Probability (LOTP) dressed up."
      *   *When:* During/After Step 4 (Formula).
      *   *Defusal:* "Yes, mathematically it *is* LOTP! The **key insight** is *why* and *when* LOTP becomes the *update rule*: **1)** You have direct uncertainty about evidence propositions (`P_new(Rep_X)`), **2)** You assume rigidity (`P(Hyp | Rep_X)` remains usable from pre-update model). LOTP is the tool; rigidity + uncertain evidence define the *situation* where it's the right update tool."
  *   **Wrong Idea:** "JC is incoherent because it's not conditioning."
      *   *When:* Step 5 (Contrast) or implicitly throughout.
      *   *Defusal:* "Standard conditioning is a special case of JC! If you become *certain* of one evidence proposition (e.g., `P_new(Rep_O)=1`, `P_new(Rep_M)=0`, `P_new(Rep_S)=0`), plug it into the JC formula: `P_new(O) = P(O | Rep_M)*0 + P(O | Rep_O)*1 + P(O | Rep_S)*0 = P(O | Rep_O)`. It *reduces* to standard conditioning. JC generalizes it for uncertain evidence."
  *   **Wrong Idea (Flatmate's):** "A sufficiently fine description of experience makes uncertainty disappear (just condition on the experience!)."
      *   *When:* Step 5 (Contrast) - **Defused by the 2 Sentences above.**
      *   *Why it works here:* The Doctor case shifts focus to *testimony about the world*. The defusal highlights the **practical impossibility/irrelevance** of having well-defined priors and likelihoods for every nuanced subjective experience (`P(Disease | Sound_Wave_Profile_#7421)`). JC lets us use the *meaningful*, *coarse-grained* evidence propositions (`Rep_X`) we actually model the world with. **Concede:** Fine-graining *is* possible in principle, but emphasize it's usually **intractable** and **unnatural** for modeling beliefs about the *external world*. No detour needed if framed this way.

  **What to Explicitly Omit (Flag These)**

  *   "We're focusing on **one update**. Updating multiple times with JC (e.g., first uncertain report, then a second) can be **order-dependent**, unlike standard conditioning. That's a deeper topic."
  *   "We're assuming the **rigidity assumption holds**. Figuring out *when* it holds or *how* you get the `P_new(Rep_X)` values is complex and situation-dependent. Today, we assume we have them."
  *   "There are **Dutch Book arguments** justifying JC, showing it's coherent. We won't cover those proofs here."
  *   "The **problem of old evidence** (how evidence you already knew can later seem confirming) is related but distinct. We're focusing on *new*, uncertain evidence today."

  **Why This Plan Works**

  1.  **Defuses the Main Threat Early:** Using testimony (not perception) and explicitly dismissing fine-graining as impractical (due to lack of priors/models) during the contrast section neuters the flatmate's core objection efficiently.
  2.  **Rigidity First:** Presenting rigidity as a *plausible assumption about the scenario* (doctor's unchanging skill) *before* the formula makes JC feel like the natural consequence, not an arbitrary rule.
  3.  **Concrete Necessity:** The Doctor example *forces* uncertain evidence about an external event. Hand calculations demonstrate JC's mechanics and value.
  4.  **Mythbusting Built-In:** The misconception map targets known traps at the precise moment they arise.
  5.  **Clear Success Metric:** The final question directly probes understanding of the *problem* JC solves, not just computational ability.

  Go in confident. They’ll see the gap that JC fills. Good luck!
