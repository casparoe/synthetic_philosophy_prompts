  For the first question, Frankfurt School connections remain viable despite the terminology correction. The structural hierarchy between critical thought and institutional power persists, aligning with Horkheimer/Adorno's worry about reason's self-subversion. Foucault's self-critique angle isn't mutually exclusive though - Kant's own "dare to know" embodies that attitude even within constrained institutions. 

  Regarding Frederick the Great, the obedience clause's motivation matters less than its function. Whether tactical or principled, it still creates that fateful division between thought and power. The textual mechanism operates regardless of authorial intent. 

  The user seems analytically sharp - they've spotted real tension in Kant's liberalism. Their concern about "pre-paying" Frankfurt School critiques shows good historical sensibility. Might subtly suggest they distinguish between Kant's conscious project and structural implications later theorists exposed. 

