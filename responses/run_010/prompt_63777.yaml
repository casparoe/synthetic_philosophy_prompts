    - **Cost**: ~$50–100 using API credits; takes 1–2 hours to implement.
    - **Why it moves the needle**: It directly tests Q4 (spot-check) and Q2 (obfuscation ease). If the Judge error decreases significantly with spot-check (e.g., <10% with strong debaters), your friend's view gains support; if it plateaus (e.g., >20%), your view is strengthened. It also reveals bias dynamics (Q5) through prompt variations.
    - **Expected insight**: With current models, spot-check may work for simple tasks but fail for harder ones, highlighting scalability (Q6) as the key uncertainty.

