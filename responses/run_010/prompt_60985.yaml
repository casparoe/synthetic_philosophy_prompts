prompt: |-
  I'm a philosopher by training, now in my second year as a postdoc in a school of public health, and each autumn I run a single seventy-five-minute session — titled, unhelpfully, "What does cause mean?" — inside a required second-year methods sequence for epidemiology and biostatistics PhD students. There are about twenty of them. All have a year of regression and a short module on propensity scores behind them; their causal vocabulary is entirely potential-outcomes flavoured; most have drawn DAGs for their thesis proposals without having been taught what the arrows commit them to; and at least two have been told by their advisors that philosophy of causation is an expensive way of avoiding an identification problem. I get two whiteboards and no slides. The session is listed as theory day in the syllabus, so they arrive prepared to be patient rather than interested. What I want from you is not an explanation of the contrast between Lewis's counterfactual account of causation and the interventionist account developed by Woodward and others — I know that material well — but a plan for how to teach the contrast to this particular room in this particular amount of time: what has to be in place before anything else can be said, what depends on what, and where the hour will collapse if I get the order wrong.

  Here is my sketch, and where I suspect it is broken. I open with a case I built for the purpose: a hypertensive patient whose blood pressure is well controlled on Drug A, in a clinic operating a treat-to-target protocol under which discontinuing A automatically triggers an upward titration of Drug B. So A is doing genuine work in the actual sequence, yet the difference-making conditional — had she not taken A, her pressure would have been about the same — comes out true, because the protocol compensates. My plan was to let them watch their instinctive cashing-out of causal claims misfire here, then bring in interventions as the repair, then point out that the repair works only if the intervention is of the right kind, one that reaches the outcome by no route other than the exposure, which in this case means changing A while holding the protocol fixed. I wanted the final third for the payoff that concerns them: that the protocol is playing the role of what they would call a competing treatment regime or a source of confounding, and that their identification conditions are the technical descendant of the philosophical requirement that nothing else be allowed to change along with the cause. Two things worry me. First, that the case is too clever — it needs a compensating mechanism in order to generate the failure, and a sharp student will say the right response is to describe the situation more finely, splitting A into dosage and timing, rather than to give up on difference-making. That is itself a real move in the literature and arguably the right one, and I can't decide whether to let them make it, or whether making it in week one will cost me the rest of the session. Second, whether to open inside their own domain at all: I keep going back and forth between this case and a neutral non-medical preemption case used first and transferred across afterwards, and I can't tell which ordering actually protects the transfer rather than merely sounding tidier.

  Then the misconception map, which is the part I most want worked out, and where my guesses are weakest. My candidates: that an intervention is simply a randomized trial, so exposures nobody could randomize — sex assigned at birth, ancestry, ambient pollution, anything already in the past — fall outside causation proper rather than outside one study design; that the counterfactual account and the potential-outcomes framework they were trained in are the same view wearing two hats; that invariance under interventions is the same property as transportability of an association to new populations, which would collapse the entire session into a lecture on external validity; and that counterfactuals are unscientific because unobservable while interventions are respectable because performable — which seems to me exactly backwards, since both are claims about circumstances that do not obtain. Tell me which of these are real, which I have misdescribed, what this audience brings that I have not thought of, and, for each, the precise point in the sequence where it must be headed off rather than answered later — including whether any of them has to be planted deliberately and early so the later material has something to bite on. Give me one question to put to the room in the final five minutes whose answers would separate the students who have grasped the distinction from those who have learned to produce the words, and make it a question with a plausible-looking wrong answer available. Finally, tell me what I should announce as out of scope — I am thinking the similarity metric for counterfactuals, the fine print on token causation, and the dispute over whether interventionism is reductive metaphysics or a description of modelling practice — and how to say so without making the omissions look like evasions. Please give me the plan itself, not a reading list: I do not want anything for them to go and look up, and I cannot verify citations in the room anyway.
reasoning: |-
  Okay, let me tackle this query. The user is a philosopher teaching a session on causation to epidemiology and biostatistics PhD students. They need a lesson plan that clarifies the contrast between Lewis's counterfactual account and Woodward's interventionism in 75 minutes. 

  First, I need to understand the audience. These students are already familiar with potential outcomes and DAGs but might confuse counterfactuals with interventions. Their main misconceptions likely include equating interventions with RCTs, thinking potential outcomes are the same as counterfactual theory, and conflating invariance with transportability. 

  The user's current plan uses a medical case where Drug A's effect is compensated by Drug B via a protocol. The worry is that the case might be too clever, leading students to suggest refining variables instead of seeing the need for interventions. Also, they're debating whether to start with a non-medical example. 

  Key points to address:
  1. **Order of concepts**: Start with counterfactuals to expose their limitations, then introduce interventions as a solution. Using a non-medical case first (like Billy and Suzy rock-throwing) avoids domain-specific biases and makes the compensation mechanism clearer.
  2. **Misconceptions**: 
     - Counterfactuals vs. Potential Outcomes: Clarify that PO is a mathematical framework, while counterfactuals are metaphysical. PO assumes interventions, so they're not the same.
     - Interventions ≠ RCTs: Emphasize that interventions are hypothetical manipulations, not just randomization. Past exposures can still be causal if intervenable in principle.
     - Invariance vs. Transportability: Stress that invariance is about relationships under interventions, not just association stability across populations.
  3. **Timeline**: 
     - First 20 mins: Non-medical preemption case. Highlight the counterfactual failure, then show how an intervention (holding the protocol fixed) resolves it.
     - Next 25 mins: Transition to medical example. Use the hypertension case to reinforce the concept, linking the protocol to confounders. Here, address the misconception that refining variables is sufficient—point out that even with detailed variables, the compensation mechanism requires interventionist thinking.
     - Final 20 mins: Clarify misconceptions. Preemptively differentiate PO from counterfactuals, explain interventions beyond RCTs, and distinguish invariance from transportability.
  4. **Final Question**: Ask a scenario where an intervention is impossible (e.g., ancestry). The right answer is that it's still causal if intervenable in principle; the wrong answer is it's not causal because it can't be randomized.
  5. **Out of Scope**: Briefly mention token causation, similarity metrics, and the reduction debate, framing them as beyond the session's focus on core conceptual tools for epidemiology.

  The medical case stays relevant but is introduced after the non-medical example to ensure students grasp the general principle before applying it. This order prevents them from getting stuck on domain-specific solutions like variable refinement. Addressing misconceptions preemptively at each stage (e.g., when introducing interventions, clarify they're not just RCTs) is crucial to avoid confusion later. The final question tests their understanding of hypothetical interventions versus practical study designs.
answer: |-
  Here's a strategic plan optimized for your constraints and audience, designed to preempt misconceptions while building the interventionist/counterfactual contrast. The sequence prioritizes cognitive dependencies and targets epidemiologists' pain points.

  ---

  ### **Phase 1: Ground Zero – The Counterfactual Failure (20 mins)**
  **Start NEUTRAL (non-medical):**  
  Use **Billy and Suzy rock-throwing** (Lewis's preemption).  
  - *Suzy throws rock, shatters bottle. Billy throws simultaneously; had Suzy not thrown, Billy’s rock would have shattered it.*  
  - Draw DAG: `Suzy’s throw → Bottle breaks` (with Billy’s throw as backup).  
  - **Q1:** *"Did Suzy cause the bottle to break?"* (Yes, intuitively)  
  - **Q2:** *"Is it true that 'if Suzy hadn’t thrown, the bottle would not have broken'?"* (No – Billy’s throw compensates).  

  **Why this first?**  
  - Avoids medical overcomplication.  
  - Exposes the core problem: **difference-making ≠ causation** when backup mechanisms exist.  
  - *Preempts "refine variables" objections:* Even with perfect variable granularity (e.g., "Suzy-throw-timing"), the *structural dependence* (Billy’s throw as backup) creates the paradox.  

  **Key move:**  
  Hammer the disconnect: *"Our intuitive causal claim (Suzy caused it) conflicts with the counterfactual test. How do we resolve this?"*  

  ---

  ### **Phase 2: Interventionism as the Repair (25 mins)**  
  **Transition to YOUR CASE (hypertension):**  
  - Re-describe Drug A/Drug B protocol.  
  - **Q3:** *"Did Drug A cause lower BP in the actual world?"* (Yes)  
  - **Q4:** *"Is it true that 'had she not taken A, BP would be higher'?"* (No – protocol compensates).  

  **Introduce INTERVENTION:**  
  - Define intervention on A as: *"Set A=0 while holding the protocol fixed (i.e., prevent automatic B-titration)"*.  
  - Now: *"Had we intervened to stop A (and freeze the protocol), BP would rise."* → Causation restored.  
  - **Contrast:** Lewis’s counterfactual changes A *passively*, allowing protocol to react. Intervention *controls* the protocol.  

  **Link to their work:**  
  - Overlay on DAG: The intervention **severs A’s incoming arrows** (e.g., doctor’s decision), leaving only A→BP.  
  - *"Your 'identification conditions' (ignorability, positivity) are guarantees that an ideal intervention *like this* is possible given the data."*  

  **Why medical case NOW?**  
  - Transfer is secure after neutral example.  
  - Lets them see their "competing regimes" as **structural dependencies** (like Billy’s throw).  

  ---

  ### **Phase 3: Misconception Triage & Payoff (25 mins)**  
  Address these **in order**, at precise moments:  

  1. **"Counterfactuals = Potential Outcomes"**  
     - *When introducing interventions:*  
       *"PO frameworks **assume** interventions from the start. Rubin’s 'treatment vs control' implies a manipulated A. Lewis’s account does not – that’s why it breaks here."*  
     - **Soundbite:** *"PO is a calculus for *effects* of interventions. Lewis asks what *causation is*."*  

  2. **"Interventions = RCTs"**  
     - *After defining intervention:*  
       *"RCTs *approximate* ideal interventions. But 'intervention' here is a **hypothetical manipulation**: 'What if we *could* set A=a, independent of everything else?' This applies to sex, ancestry, etc. – if we can *conceive* of manipulating them (e.g., via gene editing), they can be causes."*  
     - **Example:** *"Smoking causes cancer. We can’t randomize smoking, but we *can* intervene hypothetically."*  

  3. **"Invariance = Transportability"**  
     - *When linking to identification:*  
       *"Invariance under intervention means: 'If I hack A, Y changes predictably *here*.' Transportability asks: 'Does this prediction hold *there*?' Invariance is necessary but not sufficient for transport."*  
     - **Visual:** Whiteboard two DAGs (original vs. new population) with altered confounding.  

  4. **"Counterfactuals are unscientific"**  
     - *During Q/A:*  
       *"Both counterfactuals and interventions describe unobservables. But interventions are *actionable* – they tell us how to *change* the world. Science cares about manipulation."*  

  ---

  ### **Final 5-Minute Diagnostic Question**  
  **Prompt:** *"Imagine a gene G that causes lung cancer, but only in 1950s asbestos-heavy workplaces. Today, we remove asbestos. Can we say:  
  'G *caused* cancer in 1950s workers'?"*  

  - **Plausible wrong answer:** "No – because if we intervened on G today, cancer rates wouldn’t change (no asbestos)."  
    *(Confuses token causation with current intervention effects)*  
  - **Correct answer:** "Yes – intervening on G *in 1950s conditions* would change cancer risk. Token causation depends on context."  
    *(Tests grasp of causation-as-intervention-in-context vs. eternal invariance)*  

  ---

  ### **Out-of-Scope Announcement (Early and Firm)**  
  Open with:  
  *"Today’s goal is to equip you to *use* causal concepts in your research, not settle philosophical debates. So we’ll skip:  
  1. How to define 'similar worlds' for counterfactuals (Lewis’s *metric* problem).  
  2. Whether causation is *really* just prediction/manipulation (the *reductionism* debate).  
  3. One-off events (e.g., 'Did this mutation cause *my* cancer?').  
  Why? These won’t change how you design studies or interpret effects. Our focus is on core ideas that shape your methodologies."*  

  ---

  ### **Why This Sequence Works**  
  - **Builds on failure:** Neutral preemption creates a puzzle they can’t dismiss with domain knowledge.  
  - **Interventions enter as saviors:** Their utility is felt before being formalized.  
  - **Misconceptions preempted:** Each addressed *when* the relevant concept debuts.  
  - **Epi relevance upfront:** Links to DAGs/identification appear *after* the philosophical groundwork.  
  - **No "clever case" trap:** Billy/Suzy avoids variable-refinement distractions; hypertension reinforces.  

  **Critical:** When introducing interventions, explicitly contrast "difference-making under passive change" vs. "difference-making under controlled manipulation." This dichotomy is the lever that lifts everything else.
