answer: |-
  Your instinct is correct: the argument fails at step (7)—the move from knowing *individual instances* of gauge-tank matches to knowing the gauge's *reliability*. This is where bootstrapping's illicit character is smuggled in. Let's diagnose why it fails, why it *looks* defensible, and why sacrificing this step causes the least damage while preserving your loyalties to (1), (2), and (4).

  ### The Core Problem: Step (7) Commits a Bootstrapping Fallacy
  - **The Fallacy Explained**: Step (7) assumes that accumulating *instances* where the gauge reads "full" and the tank *is* full (gained via the gauge itself) licenses knowledge of *reliability*. But this procedure is circular: **it uses the gauge's deliverances to confirm its own accuracy**. Crucially, it *only checks cases where the gauge reads "full"* and ignores potential false readings (empty-tank-but-reads-full scenarios). Reliability requires sensitivity to *all* possible outputs (true positives, true negatives, false positives, false negatives). Bootstrapping lacks this sensitivity.
    
  - **Why It Looks Defensible in Isolation**: Step (6) seems sound: you *can* know *individual* matches without prior justification for the gauge (per step 3). Step (7) then seems like simple induction: "If I see many matches, I infer reliability." But induction requires the data to be *independently credible*. Here, the data (gauge readings) are only trusted *because* the gauge is assumed reliable in the very act of using it to check the tank. The "induction" is question-begging.

  ---

  ### Pricing the Exits (Ordered by Least to Most Damage)
  1. **Reject Step (7): The Bootstrapping Inference is Invalid**  
     - **Cost**: Minimal. You concede that bootstrapping *as described* fails, but this doesn't threaten Moore.  
     - **Gain**: Saves (3) and (4), blocks the absurdity in (8)-(9), and preserves Moore's proof.  
     - **Why It Works**: Moore's premises ("I have hands") are *basic perceptual beliefs* justified by experience itself (per step 3). They don't rely on a circular self-verification procedure. Bootstrapping, by contrast, *requires* a prior step of trusting an instrument (the gauge) to generate its "evidence," creating vicious circularity. Perceptual knowledge doesn't involve consulting an "instrument" in this way—it's non-inferential.  
     - **Salvage Step (7) with Restriction**: Reliability claims *can* be supported inductively, but **only if the data is gathered independently of the source being tested**. E.g., checking the gauge with a dipstick (independent source) across varied fuel levels. This restricted (7) can still support calibration practices (countering step 9) but blocks bootstrapping.

  2. **Reject the Generalization in Step (8)**  
     - **Cost**: Low-to-moderate. Step (8) overreaches by assuming *all* sources permit bootstrapping.  
     - **Gain**: Protects perception as a privileged source.  
     - **Why It Works**: Perception (unlike instruments) may be a *basic source* of justification that doesn't require calibration. Step (8) equivocates between derived sources (gauges) and fundamental ones (perception).  
     - **Damage**: Requires defending an asymmetry between perception and instruments. Moore likely accepts this, but it needs argument.

  3. **Restrict Step (3): Perceptual Knowledge Requires Default Entitlement, Not Bootstrapping**  
     - **Cost**: Moderate. Requires refining Moore's account.  
     - **Gain**: Blocks bootstrapping while saving closure.  
     - **The Fix**: Step (3) is correct that perceptual knowledge doesn't need *antecedent* verification. But it **does require a default entitlement** (e.g., from evolutionary reliability, cognitive proper function, or non-inferential warrant). Crucially, this entitlement *isn't* generated by bootstrapping. Bootstrapping violates the "default + challenge" structure of perceptual justification.  
     - **Work Preserved**: Still refutes scepticism by allowing warranted perceptual beliefs (like "I have hands") without prior proof of reliability. Blocks step (7) as illegitimate for *gaining* entitlement.

  4. **Reject Step (9): Bootstrapping is Acceptable**  
     - **Cost**: High. Forces you to defend the absurdity that a broken gauge can "prove" its reliability.  
     - **Gain**: Saves (3) and (4) unconditionally.  
     - **Damage**: Undermines the epistemology of instruments and science. If bootstrapping is valid, scepticism about *everything* (including science) becomes unavoidable. Moore's proof would survive, but at the cost of inviting global scepticism.

  5. **Reject Step (4): Closure Fails**  
     - **Cost**: Highest (given your loyalty). Forces a major reconception of knowledge.  
     - **Gain**: Blocks the entire bootstrapping problem.  
     - **Damage**: Requires denying intuitive inferences (e.g., "I know I have hands, and I know hands entail an external world, so I know there's an external world"). Sceptics would rejoice.

  6. **Reject Steps (1)/(2): Moore's Proof is Defective**  
     - **Cost**: Unacceptable (given your thesis focus).  
     - **Gain**: None—bootstrapping still threatens other domains.  
     - **Damage**: Concedes to scepticism outright.

  ---

  ### Why Moore Survives While Bootstrapping Fails
  - **Moore's Proof is Not Bootstrapping**: Moore's premises ("Here is a hand") are **directly justified by perceptual experience**. He doesn't use perception to verify perception; he treats it as a basic source. The gauge case, however, **uses the gauge's readings to verify the gauge**—a clear self-supporting circle.  
  - **The Sceptic Remains Unmoved, But Not Undefeated**: Moore's proof doesn't *convince* the sceptic because it relies on premises the sceptic doubts. But it **successfully shifts the burden**: it shows that denying perceptual knowledge (like "I have hands") is *less reasonable* than accepting an external world. This is a **dialectical failure** (against a radical sceptic) but an **epistemological success** (against the sceptic's demand for non-perceptual proof).  
  - **What Kind of Failure?** Moore's proof is a **failure of persuasion** (against sceptics who reject all perceptual premises) but a **success of rational commitment** (for those who accept basic perceptual knowledge). Bootstrapping's failure exposes that *some* justifications are circular—but perception, properly understood, isn't one of them.

  ### Recommended Path: Reject Step (7) and Restrict Step (3)
  1. **Step (7) is outright false**: Bootstrapping doesn't yield knowledge of reliability.  
  2. **Step (3) is salvageable**: Perceptual knowledge needs no *antecedent* verification but relies on **default, non-inferential warrant**.  
  3. **Result**: Moore's proof stands (steps 1-5) as a refutation of scepticism *for those who accept basic perceptual knowledge*. Bootstrapping (steps 6-9) fails because it misapplies step (3) to a circular procedure. Closure (step 4) remains intact.  
  4. **Why the Middle Steps Looked Defensible**: Step (7) mimics valid induction but hides circularity by treating the gauge's output as "data." Step (8) generalizes this error by ignoring the asymmetry between fundamental (perception) and derived (instruments) sources. 

  This leaves your core intact: Moore proves the external world *if* we grant the legitimacy of perceptual knowledge—which we must, on pain of regress. Bootstrapping is a red herring, mistaking a pathology of derived sources for a problem with foundational ones.
