prompt: |-
  I am attempting to determine, from my own considered verdicts rather than by adopting a system wholesale, what I am committed to when I say that a claim about the future is or is not already true. Below are the cases, with my verdicts and, where I can identify it, the feature of the case I suspect is doing the work. I would like a principle — or a small set of competing principles — that accounts for the pattern.

  Cases and verdicts:

  1. An admiral, before any order has been given, says that there will be a sea battle tomorrow. Verdict: neither true nor false; there is as yet no fact of the matter. But I also judge the disjunction — either there will be a sea battle tomorrow or there will not — to be straightforwardly true.

  2. The same admiral, the same sentence, but the order has now been issued and is irrevocable, the fleet is under way, and no vessel can physically turn back. Verdict: the sentence is now simply true. Nothing about the future seems to have changed except that fewer of the options remain.

  3. A claim computing the return of a comet from present positions and known laws. Verdict: true now, and equally true a thousand years ago, when nobody could have computed it. Unknowability makes no difference to any verdict on this list.

  4. A die that has left the cup and is tumbling through the air: it will land six — either true or false, though nobody can say which. The same sentence uttered two seconds before the throw: neither true nor false. My verdict flips across an instant of an otherwise continuous physical process.

  5. It will be raining in this city at noon on 4 April 2091. Verdict: there is a fact of the matter, because the atmosphere evolves, so far as I know, deterministically, even though the claim is hopeless in practice. I notice that this looks very much like case 4 before the throw, and I cannot say why they should differ.

  6. That I will take the coffee rather than the tea, said of myself in a moment I regard as genuinely open. Verdict: neither true nor false. Yet I also believe that my deliberation is a physical process in a world whose physics may be deterministic, in which case 3 and 5 seem to say the claim is true now. I want both verdicts and do not see how to keep both.

  7. Of an atom whose decay the theory treats as irreducibly probabilistic at exactly one half: that this atom will decay within the hour — neither true nor false. But that there is a chance of one half that it will decay within the hour — flatly true now. Any principle I accept must let a chance claim be determinate about an outcome that is not.

  8. The battle has now taken place. Looking back, I have no inclination to say that the admiral's assertion in case 1 was untrue, or that it became true only today; I want to say it was true when he made it. This appears to contradict my verdict on case 1, and I cannot tell which of the two I should abandon.

  9. A claim that something will happen in a remote epoch, in a universe that ends before that epoch arrives. Verdict: false, not gappy. Openness seems to require that a future actually be there to be open.

  10. While I deliberate I cannot treat the proposition that I will do A as settled — but I take that to be a fact about my position as an agent, not a fact about truth values. A principle that explains case 6 by appeal to what a deliberator may believe has got hold of the wrong thing.

  My tentative principle: a future-tensed claim has a truth value now just in case the present state of the world, together with the actual laws, entails it or its negation. Please test it against the list and repair it. It already looks wrong somewhere: it seems to make case 6 determinate whenever the world is deterministic; it gives no account of why case 4's verdict flips at a moment I could never locate; it does not explain why the disjunction in case 1 is true while its disjuncts are not; and it says nothing that would make case 7's chance claim come out true.

  What I want:

  - The principle or principles stated precisely, clause by clause, with the case from the list that motivates each clause.
  - An account of what resources the principle needs: branching histories, truth-value gaps with a non-classical treatment of negation and disjunction, a designated actual history among the branches, a notion of settledness indexed to a moment, or something else. Say which of my verdicts each resource is bought in to save.
  - Whether the principle makes the claim that it is not settled whether there will be a sea battle itself settled, and whether that answer is one I can live with.
  - The principle's verdicts on three cases I have not listed: a claim whose causal history is partly quantum-random and partly a matter of undecided human choice; the same admiral's sentence asserted by someone who has privately decided but has issued no order and taken no step; and an announcement that will bring about, through the responses it provokes, the very event it announces.
  - An honest statement of which of my verdicts the principle cannot accommodate, and which single verdict I should sacrifice if I want the simplest adequate principle rather than the most conservative one.
  - Where you think my verdicts are tracking epistemic rather than metaphysical indeterminacy, and whether that confusion is responsible for the difficulty in cases 4 to 6 and in case 8.
reasoning: |-
  Hmm, the user is grappling with truth values for future contingent statements—sentences about what will happen that aren't necessarily determined yet. They've listed 10 specific cases with their intuitive verdicts and want a principle that explains the pattern. Their tentative principle—that a future claim is true or false only if current conditions plus laws entail it—has problems with cases like human deliberation (case 6) or quantum events (case 7), and they're aware of contradictions like case 1 vs case 8.

  I need to unpack their core tension: they want metaphysical openness (future not fixed) without sacrificing logical laws like excluded middle (case 1's disjunction must be true). Their verdicts also show sensitivity to different types of processes—deterministic (comets, case 3) vs indeterministic (quantum decay, case 7) vs agential (battle orders, case 2; choice, case 6). The flipping point in case 4 (die mid-air) is particularly tricky—it suggests they intuit degrees of "settledness" that change continuously, but truth values snap abruptly.

  For a solution, I should consider Thomason's supervaluationism over branching timelines. It handles the disjunction issue (case 1) by allowing "there will be a battle or not" to be supertrue while neither disjunct is true yet. Settledness becomes key: case 2 becomes true when the admiral's order makes the battle inevitable, while case 1 remains unsettled. This explains why case 8 retrospectively validates the admiral's claim—once history actualizes one branch, truth collapses to what happened.

  For physics clashes: case 5 (deterministic rain) would be true now under their tentative principle, but they insist it's unsettled—here I'll need to reconcile their intuition with determinism. Case 6 (free will) is the thorniest; if physics is deterministic, choice is inevitable, but they want openness. I might suggest separating agential openness (their verdict) from metaphysical determinacy (physics verdict), but that risks inconsistency.

  Case 7's probabilistic claim requires truth values for chance statements ("50% decay chance" is true now) but not outcomes ("it decays" is indeterminate). Supervaluationism handles this by letting chance be a property of the branching structure itself—true across all histories.

  For their three unlisted cases: quantum+choice hybrids would be unsettled; privately decided but unacted admiral (case 2 analog) might be unsettled since no causal chain is launched; self-fulfilling announcements depend on whether the announcement itself settles the outcome.

  Sacrifices needed: probably case 6's openness in deterministic worlds (they can't have both verdicts) or case 5's unsettledness if determinism holds. I should flag where their intuitions might be epistemic (e.g., case 4's flip point—metaphysically it's always settled or not, but we perceive a threshold).

  Finally, the principle must specify resources: a branching timeline model with histories, moments, and a settledness relation indexed to moments. Clarify that "settled whether P" can itself be unsettled early on (e.g., sea battle contingency), which resolves case 8's tension.
answer: |-
  Below is a principled framework that accounts for your verdicts while addressing the tensions and contradictions in your list. It builds on **branching-time semantics with supervaluationist truth conditions**, incorporating **settledness relativized to moments** and a **designated actual history**. This approach preserves your core intuitions about openness, determinism, agency, and retrospective truth, while minimizing revision to classical logic.

  ### The Principle: Settledness-Indexed Supervaluationism
  **Core Idea**: Truth of future contingents is evaluated relative to a *moment* in a branching temporal structure. A future-tensed claim is:  
  - **True (at moment \(m\))** if it holds in *all* histories passing through \(m\).  
  - **False (at moment \(m\))** if it fails in *all* histories passing through \(m\).  
  - **Indeterminate (neither true nor false)** otherwise.  

  **Key Resources**:  
  1. **Branching Histories**: A tree-like structure of possible futures evolving from the present.  
  2. **Settledness**: What is inevitable at \(m\) (true/false in all histories through \(m\)).  
  3. **Designated Actual History**: The unique history that *will* obtain (unknown until it does).  
  4. **Supervaluationism**: Truth for indeterminate claims is defined via quantification over histories.  
  5. **Moment-Relative Evaluation**: Settledness depends on the state of the world *at* \(m\).  

  ---

  ### Clause-by-Clause Principle with Case Motivations  
  **Clause 1 (Basic Truth Conditions)**  
  *At moment \(m\), a future-tensed claim \(P\) is:*  
  - *True iff \(P\) holds in every history passing through \(m\).*  
  - *False iff \(\neg P\) holds in every history passing through \(m\).*  
  - *Indeterminate otherwise.*  
  *Motivation*: Cases 1 (admiral pre-order), 3 (comet), 4 (die mid-throw), 6 (open choice), and 7 (quantum decay). Distinguishes settled inevitabilities (case 2) from open futures.  

  **Clause 2 (Retrospective Truth)**  
  *Once \(P\)’s outcome is actualized, \(P\) was true at any past moment \(m\) iff \(P\) holds in the actual history at \(m\).*  
  *Motivation*: Case 8 (post-battle admiral). Preserves intuition that past assertions were true if they aligned with actual outcomes, even if unsettled when uttered.  

  **Clause 3 (Disjunction Handling)**  
  *Disjunctions are true at \(m\) iff at least one disjunct is true in every history through \(m\) (supervaluationist "weak" truth).*  
  *Motivation*: Case 1 (disjunction is true because "battle or no battle" is settled, though neither disjunct is).  

  **Clause 4 (Chance Claims)**  
  *Claims about probabilities (e.g., "chance of decay is 0.5") are true iff they describe objective probabilities derivable from the laws and state at \(m\).*  
  *Motivation*: Case 7 (probabilistic decay). Chance claims are settled (true/false) even when outcomes are not.  

  **Clause 5 (No Future Requirement)**  
  *Claims about times beyond the universe’s end are false iff no history extends to that time.*  
  *Motivation*: Case 9 (remote epoch). "Will happen" presupposes a future exists.  

  **Clause 6 (Agency Exclusion - Optional)**  
  *Claims about undecided future actions of agents in \(m\) are indeterminate, even in deterministic worlds. [Add only if you insist on case 6’s verdict despite determinism].*  
  *Motivation*: Case 6 (deliberation). Treats agency as a special source of indeterminacy.  

  ---

  ### Test Against Your Cases  
  | Case | Principle’s Verdict | Alignment |  
  |------|---------------------|-----------|  
  | 1    | Indeterminate (not settled) | ✅ |  
  | 1-Disj| True (settled that battle or no battle) | ✅ |  
  | 2    | True (order irrevocable → settled) | ✅ |  
  | 3    | True (deterministic → settled) | ✅ |  
  | 4a (mid-air)| True or false (settled post-throw) | ✅ |  
  | 4b (pre-throw)| Indeterminate (not settled) | ✅ |  
  | 5    | **Determinate if deterministic** (conflicts with your verdict) | ❌ |  
  | 6    | Indeterminate (agency exclusion) OR determinate (if deterministic) | ~✅/❌ |  
  | 7a (decay)| Indeterminate (quantum openness) | ✅ |  
  | 7b (chance)| True (settled probability) | ✅ |  
  | 8    | True at \(m\) (retrospectively, via actual history) | ✅ |  
  | 9    | False (no such future) | ✅ |  
  | 10   | N/A (epistemic, not metaphysical) | ✅ |  

  ---

  ### Unlisted Cases  
  1. **Quantum randomness + undecided choice**:  
     - *Verdict*: Indeterminate. Unsettled by both sources.  
  2. **Admiral’s claim post-private-decision but pre-action**:  
     - *Verdict*: Indeterminate. No causal cascade → not settled.  
  3. **Self-fulfilling announcement**:  
     - *Verdict*: *Initially* indeterminate. *After* announcement, may become settled if it triggers inevitability (e.g., "I will announce X" uttered → X announced).  

  ---

  ### Sacrifices and Tensions  
  - **Case 5 (2091 rain)**: Your verdict (indeterminate) conflicts with determinism. The principle makes it **determinate** if physics is deterministic. *Sacrifice this verdict*: Determinism implies settledness.  
  - **Case 6 (choice)**: In deterministic worlds, the principle makes it determinate (contra your verdict). To preserve your view, add Clause 6 (agency exclusion), but this is *ad hoc*. *Sacrifice*: Abandon indeterminacy for choices in deterministic worlds.  
  - **Case 4’s "flip point"**: The principle doesn’t pinpoint when indeterminacy resolves (e.g., die’s exact mid-air moment). This is **metaphysical vagueness**—settledness emerges gradually, but truth-value snaps at an unknowable threshold.  

  ---

  ### Epistemic vs. Metaphysical Indeterminacy  
  Your confusion in **cases 4–6 and 8** stems from conflating:  
  - **Metaphysical indeterminacy**: No fact of the matter (cases 1, 4b, 6, 7a).  
  - **Epistemic indeterminacy**: Unknowable but determinate (cases 3, 5 if deterministic).  
    - *Case 4*: The flip is metaphysical—settledness emerges when trajectories causally constrain outcomes.  
    - *Case 5*: If deterministic, it’s epistemically indeterminate but metaphysically settled. Your verdict mistakes epistemic limitation for openness.  
    - *Case 6*: If deterministic, your "openness" is epistemic (you can’t predict your choice).  
    - *Case 8*: Retrospective truth is metaphysical (actual history fixes past truth values).  

  ---

  ### Final Principle (Repaired)  
  **Settledness Principle**:  
  > A future-tensed claim \(P\) (about time \(t\)) is **true at moment \(m\)** iff \(P\) holds in all histories through \(m\).  
  > **False at \(m\)** iff \(\neg P\) holds in all histories through \(m\).  
  > **Indeterminate** otherwise.  
  > *Once \(t\) passes, \(P\)’s truth at \(m\) is fixed by the actual history.*  
  > *Disjunctions are true at \(m\) iff they hold in all histories through \(m\).*  
  > *Chance claims are true/false based on objective probabilities at \(m\).*  

  **Simplest Sacrifice**: Drop **case 6’s indeterminacy verdict** in deterministic worlds. This aligns with cases 3 and 5, treating "openness" as epistemic. If you resist, add agency as a brute indeterminacy source (Clause 6), but this complicates the principle.  

  **Settledness of "It is unsettled whether P"**: At \(m\), "it is not settled whether P" is itself **settled** (true in all histories) if \(P\) is indeterminate. This is consistent (e.g., case 1: "no sea battle fact" is a settled fact about \(m\)).  

  This framework resolves 9/10 cases natively, with case 5 requiring surrender if determinism holds. It tracks your intuitions while grounding them in a coherent metaphysics of time and agency.
