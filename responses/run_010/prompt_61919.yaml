  ### Sensitivity Analysis
  **Most sensitive term: (b) Independence advantage (credence 0.7)**.  
  - If (b) → 0.0 (correlation required), P fails: credence drops to **0.0** (all other terms irrelevant).  
  - If (b) → 1.0 (independence assured), credence rises to **0.85** (with (a)=0.9, (d)=0.7, stability=0.8).  
  - Movement: **±0.65** from extreme toggle, the largest delta.  
  *(d) Determinate recommendation is similarly sensitive (0.7 → 0.0 or 1.0 moves credence by ±0.55), but (b) edges it due to direct impact on feasibility.*

