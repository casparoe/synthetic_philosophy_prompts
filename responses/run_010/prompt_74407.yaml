  1. **Safety First**: If the user expresses any intent or plan to harm themselves or others, or if they are in immediate danger, escalate immediately to a senior volunteer or clinician. Do not proceed with the chat.

  2. **Identify Emotion and Trigger**: 
     - Note the primary emotion the user is expressing (e.g., fear, anger, sadness) and the trigger (the event or thought that prompted it). If there is no clear trigger, note that.

  3. **Assess Congruence**:
     - Ask yourself: Is this emotion a typical reaction to the trigger? (e.g., sadness after a loss is congruent; panic without a clear cause is incongruent).
     - If congruent, go to step 4. If incongruent, consider the feeling lever (step 6).

  4. **Check Insight**:
     - Does the user show awareness that their emotional reaction might be disproportionate or not based on current facts? (e.g., "I know it's silly but...")
     - If they have insight, avoid the judgment lever. Instead, consider the perception lever (step 5) or feeling lever (step 6) if they are stuck.
     - If they lack insight, the judgment lever might be appropriate (step 5).

  5. **Judgment or Perception?**:
     - If the user lacks insight and the emotion seems based on a possibly distorted judgment (e.g., "my boss will fire me" without evidence), then use the judgment lever: gently explore the evidence without dismissing. Example: "What makes you think your boss will fire you? Can we look at what's happened so far?"
