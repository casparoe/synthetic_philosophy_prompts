  We are designing a decision procedure for peer-support volunteers to use in live chats. The procedure should help the volunteer determine which "lever" to pull: judgment (re-appraise), perception (treat emotion as non-doxastic data), feeling (work on the body/labeling), or escalate.

  The SOP must fit on one page and be actionable in under 3 minutes. We must account for hard cases and provide clear routing.

  Key principles from the problem statement:
  - Avoid two failure modes: rationalizing (dismissing by asking for evidence) and pure validation (mirroring without progress).
  - The three levers (theories) are:
    1. Judgment lever: emotion as judgment (Nussbaum/Solomon) -> re-appraise the judgment.
    2. Perception lever: emotion as perception of value (Roberts/Tappolet/Prinz) -> accept the emotion as data about the situation, not to be disputed.
    3. Feeling lever: emotion as feeling of bodily change (James) -> work on the body (e.g., calming techniques) or labeling.

  Procedure Design:

  We need a step-by-step procedure that the volunteer can follow. The steps should be questions the volunteer asks themselves (internally) to decide the route.

  Important: The volunteer should not ask the user all these questions. The procedure is for the volunteer to decide their next move.

  Steps:

  1. **Risk Assessment (Always First)**: 
     - Check for any indication of risk of harm (to self or others). If present, escalate immediately.
     - If no immediate risk, proceed.

  2. **Identify the Emotion and Trigger**:
     - What emotion is the user expressing? (e.g., fear, anger, sadness)
     - What is the apparent trigger? (e.g., "my boss might fire me", "a spider")

  3. **Assess Congruence**:
     - Is the emotion congruent with the trigger? 
       - Congruent: the emotion is a typical response to the trigger (e.g., fear of a spider, even if harmless, is common; sadness after a loss).
       - Incongruent: the emotion doesn't match the trigger (e.g., intense fear when looking at a harmless spider, or panic without a clear trigger).

     - If incongruent, it's more likely a candidate for the feeling lever (body-focused) or perception lever (if the emotion is signaling something else).

  4. **Check for Insight**:
     - Does the user show insight? (e.g., "I know the spider is harmless, but I'm still terrified")
     - If yes, then the judgment lever (re-appraisal) might not be helpful because they already have the rational insight.

  5. **Assess Fixation**:
     - Is the user fixated on the trigger? (e.g., constantly thinking about the boss firing them, or the spider)
     - If fixated and the emotion is congruent, then the perception lever might be appropriate (explore the emotion as data about what matters to them).
     - If fixated and incongruent, then feeling lever (body/calming) might help break the cycle.

  6. **Assess Bodily Awareness**:
     - Is the user aware of bodily sensations? (e.g., "my heart is racing", "I feel tense")
     - If bodily sensations are prominent, then the feeling lever might be appropriate.

  7. **Decision Tree**:
     - After steps 3-6, we can route:
       - **Judgment route**: When the emotion seems based on a judgment that might be distorted and the user lacks insight. Then the first move is to gently explore the evidence (but not in a dismissive way) or help re-appraise.
       - **Perception route**: When the emotion is congruent and the user has insight, or when the emotion is signaling something important. Then the first move is to validate and explore what the emotion is telling them about their values or situation.
       - **Feeling route**: When the emotion is incongruent, or when bodily symptoms are dominant, or the user is stuck in a loop of feeling. Then the first move is body-focused (e.g., grounding, breathing) or labeling the emotion to reduce intensity.
       - **Escalate**: If at any point risk is detected, or if the volunteer is unsure and the situation seems beyond peer support.

  To compress, we must make the steps few and the decision points clear.

