answer: |-
  ### Peer Support Chat Decision Procedure (SOP)

  This procedure helps volunteers navigate chats in ≤3 minutes by selecting one of three evidence-based "levers" (judgment, perception, feeling) or escalating. **Key principles**:  
  - Emotions can be addressed through: cognitive re-appraisal (**judgment**), validation of value-signals (**perception**), or body/labeling techniques (**feeling**).  
  - **Never** problem-solve, debate feelings, or default to robotic mirroring.  
  - **Escalate immediately** for risk (harm, trauma, clinical issues).  

  **Steps**:  
  1. **Risk screen**:  
     - Escalate if: suicidal/homicidal intent, abuse, psychosis, or imminent danger.  
     - *No risk?* → Proceed.  

  2. **Identify core emotion & trigger**:  
     - Emotion: Fear/anger/shame/etc.?  
     - Trigger: Event/thought causing it? (If none → "no object").  

  3. **Assess congruence**:  
     - **Congruent**: Emotion fits trigger (e.g., grief after loss).  
     - **Incongruent**: Emotion mismatches trigger (e.g., panic with no cause).  
     - *No trigger?* → Incongruent.  

  4. **Check for insight**:  
     - **Insight present**: User acknowledges disconnect (e.g., "I know this fear is irrational").  
     - **No insight**: User treats feeling as factual (e.g., "My boss *will* fire me").  

  5. **Route selection**:  
     - **→ Judgment lever** (re-appraise):  
       - *When*: Congruent + **no insight** + emotion based on fixated thought.  
       - *First move*: Gently explore evidence: *"What makes you feel [emotion] about [trigger]?"*  
     - **→ Perception lever** (validate-as-data):  
       - *When*: Congruent + **insight** OR emotion tracks real threat.  
       - *First move*: Validate and explore meaning: *"It makes sense you feel [emotion]. What might this be telling you?"*  
     - **→ Feeling lever** (body/label focus):  
       - *When*: **Incongruent** OR **no insight but high bodily arousal** OR user stuck in loop.  
       - *First move*: Label or ground the body: *"Where do you feel [emotion] in your body?"* or *"Let’s name this: Is it dread, panic, or...?"*  
     - **→ Escalate**:  
       - Risk (step 1), severe distress/unresponsiveness >10min, or complex issues (e.g., trauma).  

  6. **If uncertain**: Default to **perception lever** (validate + open-ended questions).  

  ---

  ### Compression Notes & Limitations  
  **Surviving distinctions**:  
  - **Judgment vs. perception**: Keep "insight check" to avoid dismissing real threats (perception) or reinforcing distortions (judgment).  
  - **Feeling lever priority** for incongruence/bodily focus—prevents rationalizing or over-validating.  
  - **Escalate triggers** are non-negotiable (risk/clinically complex).  

  **Discarded distinctions**:  
  - Philosophical nuances (e.g., whether emotions are "perceptions of value" vs. "bodily signals") flattened into actionable heuristics.  
  - Moods without objects automatically routed to feeling lever (no metaphysical debate).  

  **Hard cases handled**:  
  - Recalcitrant emotion (e.g., phobia): → **Feeling lever** (body focus).  
  - Mood with no object: → **Feeling lever** (incongruent by default).  
  - Grief: Congruent → **Perception lever** (validate meaning).  
  - Shame-about-anger: Treat shame as primary emotion → **Perception lever** (explore values).  
  - Panic without construal: Incongruent → **Feeling lever**.  
  - Justified fear (e.g., stalker): Congruent + real threat → **Perception lever** (honor the signal).  

  **What the procedure cannot do**:  
  - Resolve deep trauma, clinical disorders, or systemic issues.  
  - Handle meta-emotion cascades (e.g., shame-about-fear-about-anger) perfectly.  
  - Guarantee user engagement if the lever choice is "correct" but poorly delivered.  

  **Failure modes**:  
  - Over-routing to perception lever (due to your prior) may validate irrational fears.  
  - Judgment lever may escalate defensiveness in shame-prone users.  

