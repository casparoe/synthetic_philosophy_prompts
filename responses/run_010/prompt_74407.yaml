  6. **Feeling Lever**:
     - Use when:
       - The emotion is incongruent (e.g., panic attack without clear cause).
       - The user is highly focused on bodily sensations (e.g., "I can't breathe").
       - The user has insight but is stuck in the feeling (e.g., "I know the spider is harmless but I'm terrified").
     - First move: Help the user focus on their body or label the emotion. Example: "It sounds like your body is in high alert right now. Would it help to try a simple breathing exercise?" or "Let's put a name to what you're feeling: is it terror, dread, or something else?"

