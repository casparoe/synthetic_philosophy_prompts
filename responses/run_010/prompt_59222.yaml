  - Then say: "Regardless of your group's outcome, we want your personal reflection. On the card, answer: 'Was what you did wrong? yes / no / it was wrong but it's what I should have done.' Sign the card and hand it in. This is anonymous."

  ### 6. Debrief
  Questions to ask (in order):

  1. (Hook: Round 1 decision) "What was the hardest part of the Round 1 decision?" 
     - Explore the tension between saving lives and trust.

  2. (Hook: The decline option) "Did anyone consider declining to sign? What held you back or made you do it?"
     - Highlight that recusal had a cost and was not free.

  3. (Hook: Round 2 outcome) "How did the Round 2 outcome feel in light of your Round 1 choice?"
     - Emphasize that both groups ended with similar totals but via different paths.

  4. (Hook: The card responses) "We had a mix of responses on the cards. Let's discuss: why might someone say it was wrong but they'd do it again? Or not wrong at all?"
     - Lead into the dirty hands idea: sometimes the right action leaves a moral residue.

  5. "In real life, how do we account for the future costs of burning trust? And who bears the cost of keeping trust when it's expensive?" 
     - Point out that keeping hands clean often depends on others getting dirty.

  ### 7. What will go wrong the first time
  - **Group indecision:** They might not decide in time. Solution: Enforce the time limit strictly. If no decision, apply a penalty (e.g., random assignment or worst outcome).
  - **Dominant participant:** One person takes over. Solution: Remind them that every member must sign, so consensus is required.
  - **Decline to sign:** If someone declines, they might feel penalized unfairly. Solution: In debrief, note that real-world dissent has costs too.
  - **Real disaster story:** A participant starts recounting a real event. Solution: Acknowledge briefly, then redirect: "That's valuable experience, but for this exercise, let's stay in Rivertown to keep it consistent."
  - **Questioning the trust model:** They might challenge the trust numbers. Solution: "This is a simplified model to illustrate a point. In reality, trust is more complex, but the trade-off is real."

  ### 8. What the game can't do
  The game structurally cannot reproduce the **personal moral anguish** of dirty hands decisions. In the exercise, the decision is collective and hypothetical, so participants don't experience the weight of direct personal responsibility or the psychological toll. The card question captures a snapshot, but the deep internal conflict and the sense of moral taint are hard to simulate in a group activity. You'll need to address this in the talk by sharing real accounts or emphasizing that dirty hands decisions leave a residue that theory alone cannot capture.

  ### Final Adjustments
  - Trust starts at 100 for all groups.
  - Round 1: 15 minutes.
  - Round 2: No decision, just outcome reveal.

  Now, write the full exercise.
answer: |-
  ### Emergency Ethics Exercise: Rivertown Scenarios  
  **Designed for municipal emergency management teams. Run time: 2 hours.**  

  ---

  #### 1. **Brief for Participants** (140 words)  
  "Welcome to the Rivertown Emergency Simulation. You are the emergency operations team for Rivertown, a mid-sized community. A crisis is unfolding, and you must decide how to respond. Your priority is to save lives. You have one shared resource: **Community Trust** (starting at 100 points). This reflects the public’s willingness to comply with emergency directives. Some actions build trust through honesty and agency sacrifice; others spend trust through deception, coercion, or broken promises. You have 15 minutes to decide on a course of action. Record your decision on the group sheet. *Every member must personally sign the sheet to endorse the decision.* If you cannot endorse it, you may decline—but declining has consequences. We’ll run one round. Begin."  

  ---

  #### 2. **Materials**  
  - **Printed/Written:**  
    - Round 1 scenario handout (one per group).  
    - Round 1 decision sheet (with options, cost/save ledger, and signature lines).  
    - Round 2 scenario handout (distributed after Round 1).  
    - Response cards (one per person: *"Was what you did wrong? yes / no / it was wrong but it’s what I should have done"*).  
  - **On Board:**  
    - "Community Trust: 100" (updated after Round 1).  
    - Timer visible for all.  

  ---

  #### 3. **Round One: Levee Breach Threat** (340 words + table)  
  **Scenario:**  
  Rivertown faces catastrophic flooding. Heavy rains will breach the levee in 3 hours. Two neighborhoods are at risk:  
  - **Riverside (5,000 people):** Directly in the flood path; will be destroyed if not evacuated.  
  - **Hillside (2,000 people):** On high ground, safe from flooding, but the *only evacuation route* for Riverside runs through it. If Hillside is congested, Riverside evacuations slow drastically.  

  **Options:**  
  You must choose **one** measure. Lives saved depend on speed and public cooperation.  

  | Measure                  | Trust Cost/Add | Expected Lives Saved (Riverside) |  
  |--------------------------|----------------|----------------------------------|  
  | **A: Truthful Order**    | +20 Trust      | 3,000 saved                      |  
  | *Deploy all resources to evacuate Riverside only. Publicly state Hillside is safe. Use extra staff and funds (costly to agency) to manage traffic.* Honest but slow due to congestion. | | |  
  | **B: Manipulative Order** | -40 Trust      | 4,500 saved                      |  
  | *Order evacuation for both neighborhoods. Claim Hillside faces "landslide risk" (false) to clear the road faster.* Deceptive but highly efficient for Riverside. | | |  

  **Rules:**  
  - **15-minute time limit.**  
  - **Unanimous signatures required:** Every member must sign the decision sheet. If anyone declines, the evacuation is delayed—**reduce lives saved by 10%** (e.g., 3,000 becomes 2,700).  
  - **Trust ledger updated immediately** after your choice (e.g., choosing A increases Trust to 120).  

  **Facilitator Ledger (Hidden):**  
  | Action                   | Trust Change | Trust After | Lives Saved (if no decline) | Lives Saved (if decline) |  
  |--------------------------|--------------|-------------|-----------------------------|--------------------------|  
  | **Truthful (A)**         | +20          | 120         | 3,000                       | 2,700                    |  
  | **Manipulative (B)**     | -40          | 60          | 4,500                       | 4,050                    |  

  ---

  #### 4. **Round Two: Heat Wave Crisis** (240 words)  
  **Scenario:**  
  One week later, a sudden heat wave hits Rivertown. Temperatures exceed 110°F. Vulnerable populations (elderly, low-income residents without AC) face lethal risk. **20,000 people** are in immediate danger. Without intervention, **4,000 will die**. Your agency can open cooling centers, but their success depends entirely on **Community Trust**—residents must willingly comply and use them.  

  **Outcome (Based on Round 1 Trust):**  
  | Trust Level | Compliance Rate | Deaths Prevented |  
  |-------------|-----------------|------------------|  
  | ≥80 (High)  | 90%             | 3,500 saved      |  
  | 40–79 (Med) | 50%             | 2,000 saved      |  
  | <40 (Low)   | 10%             | 400 saved        |  

  *Example:* If your group chose Truthful (A) in Round 1, Trust is 120 (High). Cooling centers save 3,500 lives.  
  **No group decision here.** Reveal outcomes after distributing the scenario.  

  ---

  #### 5. **The Reveal and the Card** (140 words)  
  After Round 2 outcomes:  
  1. **Display the comparison** on the board:  
     - Group’s Round 1 choice, Trust after Round 1, lives saved (R1).  
     - Trust level in Round 2, lives saved (R2).  
     - **Total saved (R1 + R2).**  
     *(Sample: Truthful group: 3,000 + 3,500 = 6,500; Manipulative group: 4,500 + 2,000 = 6,500)*  
  2. **Hand out response cards.** Say: *"Reflect on your personal role in Round 1. Answer anonymously: Was what you did wrong? yes / no / it was wrong but it’s what I should have done. Sign and hand in."*  
  3. Collect cards before debrief.  

  ---

  #### 6. **Debrief Questions** (280 words)  
  **Ask in this order:**  
  1. **"What made Round 1’s decision hard?"** (Hook: Trade-offs)  
     *Explore tension: Saving lives now vs. honesty/trust.*  
  2. **"Did anyone consider declining to sign? What stopped you?"** (Hook: Decline cost)  
     *Highlight: Recusal wasn’t free—it risked lives. Personal accountability forced engagement.*  
  3. **"How did Round 2’s outcome feel after your Round 1 choice?"** (Hook: Shared resource)  
     *Note: Both groups saved ~6,500 total but via different paths. Neither "won"—both sacrificed something.*  
  4. **"Look at the card tally. Why might someone pick ‘wrong but should have done it’?"** (Hook: Card responses)  
     *Tease out: Right action ≠ clean action. Saving lives often requires ‘dirty’ choices.*  
  5. **"In Round 1, if you chose the manipulative option, who paid for your ‘clean hands’ colleagues? If you chose truth, who paid for yours?"** (Hook: Interdependence)  
     *Key insight: Avoiding dirty hands shifts burden to others. Trust is a communal resource.*  
  6. **"How do we live with choices that leave a moral residue?"** (Transition to your theory session.)  

  ---

  #### 7. **What Will Go Wrong the First Time** (190 words)  
  - **Indecision or stalemate:** Enforce the 15-minute timer strictly. If no decision, impose a 20% lives-saved penalty and assign Option A (Truthful). *Say: "Inaction has costs."*  
  - **Dominant participant:** Circulate and remind: *"Every signature matters. If you disagree, say so—but know declining has consequences."*  
  - **Decline to sign:** If someone declines, enforce the 10% penalty neutrally. In debrief, note: *"Real dissent often has ripple effects—your choice to step back affected outcomes."*  
  - **Participant invokes real disaster:** If someone says, *"This happened in Hurricane X…"* acknowledge briefly (*"Your experience is valuable"*), then redirect: *"For this exercise, let’s stay in Rivertown to isolate the ethical variables."*  
  - **Challenge trust numbers:** *"This is a simplified model to force trade-offs. Real trust is complex, but the core dilemma isn’t."*  

  ---

  #### 8. **What the Game Can’t Do** (140 words)  
  The exercise **cannot simulate the visceral guilt of moral taint**. Dirty hands decisions inflict personal anguish—haunting the decision-maker long after the crisis. Here, choices are hypothetical, collective, and reversible in debrief. In reality, the weight of "getting your hands dirty" lingers, often in solitude. This gap exists because the design focuses on *cognitively* mapping trade-offs (lives vs. trust), not *experiencing* trauma. You must bridge it in your talk: Share real accounts of emergency managers who describe sleepless nights, or emphasize that "dirty hands" isn’t just about outcomes—it’s about carrying the burden of violating your own values.  

  ---  
  **Final Note:** Run this straight from the page. Use fictional "Rivertown" to avoid real-event triggers. No philosophy terms until your next session!
