prompt: |-
  I sit on the board of a small private foundation — nine trustees, one staff member, an endowment of roughly sixty million dollars — and last night I argued for three hours with a fellow trustee, whom I'll call M., about a vote we have to take on Thursday. Neither of us budged. Before I walk back into that room, I would like an outside view.

  The question is what our own record commits us to. Over the past six years the board has decided five proposals that turned on how well the odds were specified, and all five votes are in the minutes:

  1. Two grant requests, identical amounts. One was an established curriculum whose outside evaluator stated a 60 percent chance of hitting the target and showed her derivation on a single page; the other was a first-of-its-kind program in a field none of us knew, whose sponsor said only that the chance was "somewhere between 25 and 70 percent" and could not narrow it. We funded the first, 6–1.

  2. Two requests, each with a range neither sponsor could narrow, both sponsors equally credible and equally eager for the money. One was in our longest-running program area, where we hold thirty years of our own grant data; the other was in an area we had never funded. The familiar one had the lower midpoint — 35 to 55 against 45 to 65. We funded the familiar one, 5–2, and the minutes record two different reasons from two different trustees: "we know this field well enough to place the odds ourselves," and "at least we'll be able to say afterwards that we knew what we were doing."

  3. A request whose sponsor initially offered a range. We sent it back asking for a single number. She returned a point estimate, a confidence interval, and a paragraph of derivation; the project, the amount, and the sponsor were identical to what we had just turned down. We approved it, 7–0.

  4. A bank offered us a three-million-dollar note. The offering memorandum gave the payoff distribution to three decimal places along with a complete payoff table; the model behind it was proprietary, its author had left the firm, the bank's fee was contingent on our investing, and our own consultant said she could not reproduce a single figure. We declined, 7–0, and put the money into an index fund instead.

  5. A bequest whose amount was to be fixed by a draw that the executors would fill and make in our presence, in open session, on the day of transfer — so the odds were unknown to us when we voted, but were to be set in full view of us by people with nothing to gain from the outcome. We accepted, 8–1, over the objection of a trustee who said we still did not know the odds.

  As a control: on two occasions when both options carried fully specified and fully transparent odds, we took the higher-variance one. Nobody on this board is simply frightened of variance.

  Thursday's case has exactly two live options for a three-million-dollar commitment, and we cannot fund both.

  (A) A social-impact bond from a sponsor we have dealt with twice before; both earlier bonds paid out as promised. The memorandum specifies a 78 percent probability of full repayment with a complete payoff table — but the figures come from the sponsor's proprietary model, the sponsor's fee is contingent on our investing, and our consultant says again that she cannot reproduce the derivation.

  (B) A continuation grant to a program we have funded for twenty-two years. Our independent evaluator — flat fee, no stake in which option we choose, and she volunteered the estimate unprompted — will say only that the chance of hitting the target is "somewhere between one in three and two in three" and that she cannot narrow it, but she can walk us through every step of the program and every reason the range has the width it has. We would also set the milestone schedule ourselves, and that schedule changes what the payoff depends on.

  M. is certain the record points to (A): in five tries we have never put money behind a range that could not be narrowed, and precedents 1 and 3 say so plainly. I think precedent 4 says otherwise, and that what we have actually been tracking is not the shape of the odds but who produced them and whether we could restate the reasoning ourselves. Partway through, M. said this was just the urn problem from the decision-theory textbooks wearing a suit; I said that naming it was not deciding it.

  Here is what I would like from you:

  - Set out the candidate rules that fit precedents 1 through 5 — not merely "ambiguity aversion," but the distinct principles that could each account for the whole record, since I suspect at least four can. For each, say which precedents strain it and which it explains effortlessly.
  - Say what each candidate rule recommends for Thursday, and identify where they genuinely disagree rather than merely describing the same choice in different vocabulary.
  - Give me your recommendation with your reasons, and name the closest analog among the five precedents. If you think (A) is really precedent 4 with a track record attached, or that (B) is really precedent 1 with the sponsor swapped, tell me which of those descriptions is the honest one.
  - State plainly what principle we would be adopting by voting each way, given that whatever we decide becomes precedent 6 and will be quoted back at us for a decade.
  - Tell me what would change your mind: which of your readings of the record, if wrong, would flip the recommendation, and where your reasoning is most likely to fail. And tell me whether a request for more information — asking the sponsor for the model documentation, or asking the evaluator to commit to a single number — would actually resolve the case, or would merely reveal which rule we have been running all along.

  Please write in American English.
reasoning: |-
  Okay, let me unpack this foundation trustee's dilemma. They're stuck in a principled disagreement about how to interpret their past decisions, and they need an objective framework to break the deadlock before Thursday's vote. 

  First, I need to map their five precedents to decision theory concepts. The user's core insight feels right - this isn't just ambiguity aversion but about epistemic access. Precedent 3 screams "process matters": same proposal approved when given with derivation. Precedent 4 rejects black-box precision, which directly challenges M's reading. 

  Hmm, the social-impact bond (Option A) is tricky - it has track record but same opacity issues as precedent 4. Meanwhile Option B has messy uncertainty but complete transparency. That evaluator volunteering the range unprompted feels significant - no incentive alignment issues. 

  I'm constructing four candidate principles that could explain all precedents: 
  1) Ambiguity aversion (but precedent 5 breaks this) 
  2) Epistemic access requirement (fits 3 and 4 perfectly) 
  3) Domain familiarity heuristic (explains precedent 2) 
  4) Process over precision (why precedent 1 favored the derivable estimate)

  Wait - precedent 5 is the reveal. They accepted unknown odds when the process was transparent and neutral. That torpedoes ambiguity aversion as the primary driver. The urn problem analogy is clever but incomplete; it's about who fills the urn.

  For Thursday, Option B mirrors precedent 1's transparency but swaps the sponsor role. Option A looks like precedent 4 with a track record - but track record doesn't solve the black-box problem. Our consultant still can't verify the model.

  Biggest risk in my reasoning? Underestimating how much precedent 2's "we know this field" justification conflicts with choosing Option B's unfamiliar range. But precedent 2's second rationale - "know what we're doing" - points to evaluative capacity, not familiarity. 

  If forced to choose one precedent as closest, it's precedent 1 inverted: this time the transparent uncertain option comes from their trusted evaluator, not an outsider. That alignment matters.

  Final call: Option B. The principle they'd establish is "transparent uncertainty over opaque precision." And no, asking for more documentation won't help - if the sponsor refuses, it confirms opacity; if they comply, it becomes precedent 3. The request itself would reveal their true priority.
answer: |-
  Here's an outside view of your precedent record, candidate principles, and Thursday's decision, structured to address each request:

  ---

  ### **I. Candidate Rules Explaining Precedents 1–5**
  Four distinct principles fit the full record, with varying explanatory power:

  1. **"Epistemic Access Over Precision"**  
     - **Core**: Trust requires the *ability to reconstruct or verify* the reasoning behind odds, regardless of precision.  
     - **Effortless fits**:  
       - Precedent 1: Rejected the unnarrowable range (no derivation) for a derivable point estimate.  
       - Precedent 3: Approved only after sponsor provided derivation.  
       - Precedent 4: Rejected proprietary model with irreproducible figures.  
     - **Strains**:  
       - Precedent 2: Favored familiar field despite no narrower odds.  
       - Precedent 5: Accepted unknown odds (no reconstruction possible).  

  2. **"Process Transparency Trumps Known Probabilities"**  
     - **Core**: Legitimacy comes from *how odds are generated*, not the odds themselves.  
     - **Effortless fits**:  
       - Precedent 4: Rejected opaque process (proprietary model, conflicted fee).  
       - Precedent 5: Accepted fully transparent process (executors with no stake).  
       - Precedent 3: Approved after process was disclosed.  
     - **Strains**:  
       - Precedent 1: Funded derivable odds without questioning process credibility.  
       - Precedent 2: Relied on internal familiarity over external process.  

  3. **"Evaluative Capacity as a Filter"**  
     - **Core**: We fund only when *we can independently assess or contextualize* the odds.  
     - **Effortless fits**:  
       - Precedent 2: Chose familiar field ("we know enough to place odds ourselves").  
       - Precedent 1: Rejected unfamiliar field with unnarrowable range.  
       - Precedent 3: Approved when derivation enabled assessment.  
     - **Strains**:  
       - Precedent 5: Accepted despite no capacity to assess odds pre-draw.  
       - Precedent 4: Rejected despite having a consultant.  

  4. **"Reject Black Boxes, Embrace Bounded Uncertainty"**  
     - **Core**: We tolerate *transparent uncertainty* but reject *opaque precision*.  
     - **Effortless fits**:  
       - Precedent 4: Rejected precise but unverifiable numbers.  
       - Precedent 1: Accepted derivable 60% over unnarrowable range.  
       - Precedent 2: Funded wide range in familiar context (bounded by experience).  
     - **Strains**:  
       - Precedent 5: Accepted unbounded uncertainty (no range at all).  

  ---

  ### **II. Recommendations for Thursday & Points of Disagreement**
  | **Candidate Rule**          | **Option A (SIB)** | **Option B (Grant)** | **Key Disagreement**                                                                 |
  |-----------------------------|--------------------|----------------------|--------------------------------------------------------------------------------------|
  | Epistemic Access            | ❌ Reject           | ✅ Fund              | A lacks derivability (like Precedent 4); B offers walk-through (like Precedent 3).   |
  | Process Transparency        | ❌ Reject           | ✅ Fund              | A’s conflicted fee/proprietary model violates Precedent 4; B’s evaluator is neutral. |
  | Evaluative Capacity         | ❌ Reject           | ⚠️ Tenuous           | A is unassessable; B’s range is wide, but milestone control helps (Precedent 2).     |
  | Bounded Uncertainty         | ❌ Reject           | ✅ Fund              | A is a black box; B’s range is transparent (like Precedent 1’s funded option).       |

  **Genuine Disagreements**:  
  - M. sees Precedent 1/3 as requiring *narrowed odds*. You see Precedent 4/5 as requiring *process integrity*.  
  - **A** is *not* Precedent 4 "with a track record": Track record doesn’t resolve opacity (Precedent 4’s bank likely had one).  
  - **B** is *not* Precedent 1 "sponsor-swapped": Precedent 1 rejected a range; here, the range comes from a neutral party with transparency.  

  ---

  ### **III. My Recommendation: Fund Option B**  
  - **Why**:  
    1. **Fits the strongest principle**: "Process Transparency Trumps Known Probabilities" explains 4/5 precedents cleanly (except Precedent 2’s familiarity angle). Option B’s evaluator is neutral, transparent about uncertainty, and offers full disclosure. Option A has a conflicted sponsor with irreproducible odds (red flags per Precedents 3 and 4).  
    2. **Closest analog**: **Precedent 5** (bequest). In both:  
       - Odds are uncertain/unknowable upfront.  
       - Trust stems from *process* (neutral executors ↔ independent evaluator + your milestone control).  
    3. **Avoids hypocrisy**: Funding A would contradict Precedent 4’s rejection of proprietary models. Precedents 1 and 3 show derivation matters more than precision.  
  - **Risk**: If evaluative capacity is your *true* principle, Option B’s wide range in a long-running program is defensible (Precedent 2), but less robust than transparency.  

  ---

  ### **IV. Principle Adopted by Each Vote**  
  - **Vote for A**: "We accept *proprietary models* if the sponsor has a *track record*."  
    - **Danger**: Opens door to marketing over verification (Precedent 4 becomes an outlier).  
  - **Vote for B**: "We prioritize *transparent uncertainty* over *opaque precision*, especially with *neutral parties*."  
    - **Alignment**: Strengthens Precedents 4 and 5 as core to your ethos.  

  ---

  ### **V. What Would Change My Mind & The Role of More Information**  
  - **Flip scenarios**:  
    - If Precedent 4 was rejected *only* due to the model author leaving (not opacity/fee conflict), Option A becomes viable.  
    - If Precedent 2’s "familiarity" rationale is *dominant* (not transparency), Option B weakens.  
  - **Requesting more info**:  
    - **Ask sponsor for model docs**: If provided, this *converts A into Precedent 3* (approve). If refused, confirms Precedent 4 alignment (reject).  
    - **Ask evaluator for point estimate**: If she refuses, confirms B’s uncertainty is irreducible (consistent with Precedent 1’s rejection). If she provides one, it becomes Precedent 1’s funded case.  
    - **Crucially**: The *act of asking* reveals which principle you prioritize:  
      - Demanding docs from A = Epistemic Access rule.  
      - Accepting B’s range = Process Transparency rule.  

  ---

  ### **Final Summary**  
  Your record shows a **aversion to obscured reasoning**, not just ambiguity. Option B’s transparent uncertainty (with your oversight) aligns better with Precedents 4, 5, and 3 than Option A’s black-box precision. M. overreads Precedents 1 and 3; rejecting unnarrowable ranges was about *lack of derivation*, not the range itself. Voting for B upholds your clearest principle: **"If we can’t see the gears, we don’t buy the watch."**  

  If you pursue more information, focus on unlocking Option A’s model—its refusal would vindicate your stance. But as presented, **Option B is the precedent-consistent choice**.
