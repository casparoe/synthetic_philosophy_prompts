answer: |-
  Your query dissects a sophisticated constitutional duality. I'll address each component analytically, adhering to British English and your stipulated focus.

  ### 1. Asymmetry in Functionality: Advance Procedure vs. Emergency Power  
  The divergence stems from **three structural attributes**:  

  - **Temporal Positioning & Political Cost**:  
    King’s Consent operates *ex ante*, during legislative drafting. Its routine, preemptive character embeds it in bureaucratic process – a "technical hurdle" rather than a public confrontation. Conversely, withholding assent is *ex post*, occurring after parliamentary debate and vote. This transforms it into a high-visibility constitutional crisis, rendering it politically toxic for any modern government to advise. The **advance mechanism** neutralises conflict by resolving objections privately *before* a bill becomes symbolically tied to parliamentary sovereignty.  

  - **Register of Interest**:  
    Consent engages the monarch’s *private interests* (estates, personal property). This frames objections as commercially or personally specific, not a challenge to public policy. Refusing assent, however, vetoes the *public will* as expressed by Parliament. The former is defensible as asset protection; the latter as a constitutional rupture.  

  - **Routinisation Effect**:  
    Powers exercised routinely retain operative force because they integrate into institutional workflows. The Cabinet Office’s drafting guidance mandates early Palace consultation, creating a **self-reinforcing bureaucracy**. Non-routine powers (like assent refusal) atrophy through disuse, becoming theoretical "nuclear options" – preserved for emergencies but devoid of contemporary political legitimacy.  

  **General Principle**: Yes – **exercise-frequency inversely correlates with political cost**. A power used frequently normalises; one reserved for emergencies becomes unusable except in existential crises. Frequency sustains operational clarity; dormancy breeds ambiguity and risk-aversion.

  ---

  ### 2. Direction of Advice: Convention vs. Operational Reality  
  The convention ("monarch acts on advice") **relocates rather than neutralises** power. Here’s the dynamic:  

  - **Pre-Advice Adjustment**:  
    Ministers alter bills *before* formally advising consent because they anticipate Palace concerns. This is not the monarch dictating terms, but officials **internalising the Crown’s expected position** to avoid the reputational damage of a withheld consent. The convention shields the monarch by ensuring objections are resolved *before* advice is tendered.  

  - **Normative Work of Convention**:  
    The convention maintains the fiction of ministerial responsibility while enabling influence. Its core functions:  
    - **Plausible Deniability**: Ministers absorb accountability for alterations ("policy refinement," not royal pressure).  
    - **Procedural Legitimacy**: By requiring formal advice for consent, it upholds the principle that the monarch does not act unilaterally.  
    - **Efficiency**: Pre-emptive negotiation avoids public clashes, preserving constitutional harmony.  

  **Coherence**: The system is coherent *operationally* because the monarch’s "private concerns" are mediated through government. Ministers retain ultimate control – they *choose* to accommodate Palace views. The convention thus **domesticates influence** into the executive’s discretionary space, reconciling private interests with responsible government.

  ---

  ### 3. Power Typology: Legal Prerogative vs. Procedural Courtesy  
  The critical distinction lies in **source and revocability**:  

  - **Refusal of Assent**:  
    A **common law prerogative power** inherent to the Crown. Abolition would require statute (e.g., Parliament legislating to remove it), entrenching it legally but rendering it politically obsolete.  

  - **King’s Consent**:  
    A **self-imposed procedural rule** of Parliament (specifically, the Houses’ Standing Orders). It is **more robust politically** because:  
    - Parliament retains ultimate sovereignty: it can abolish consent unilaterally by resolution.  
    - Yet this very ease of abolition creates inertia – the cost of overturning settled practice outweighs perceived benefits, as the power is seen as a manageable technicality.  

  **Behaviour of Constraints**:  
  - A *legal* constraint (e.g., assent power) binds formally but withers politically without use.  
  - A *self-imposed procedural* constraint (consent) is **more durable in practice** because it serves institutional interests:  
    - For the *legislature*, it streamlines proceedings by flagging conflicts early.  
    - For the *executive*, it provides a discreet channel to manage Crown relations.  
    - For the *monarchy*, it offers low-risk influence.  
  Its persistence reflects a **Nash equilibrium** – no actor gains enough from abolition to incur the coordination costs of change.

  ---

  ### 4. Generality of the Asymmetry  
  This asymmetry recurs beyond monarchy:  

  - **Judicial Review**:  
    Courts routinely strike down administrative actions (quiet, frequent power) but avoid overturning primary legislation (dramatic, rare – e.g., *Miller* cases).  
  - **Treaty Ratification**:  
    Executive adjustments during negotiations (constant, technical influence) vs. refusal to ratify a finalised treaty (constitutional crisis).  
  - **Corporate Governance**:  
    Shareholder committees shaping board proposals pre-vote (routine) vs. vetoing a tabled resolution (confrontational).  

  **Core Dynamic**: **Proceduralised, anticipatory powers sustain operational vitality; latent "break-glass" powers ossify through strategic disuse.** The monarchy exemplifies this but does not monopolise it.
