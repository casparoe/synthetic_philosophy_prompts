  We are drafting a joint statement for two philosophical positions: biological naturalism (BN) and intentional-stance theory (IST). The goal is to have a document both can sign after discussing the "Isolated Register" case and its variations.

  The statement has four parts:

  I. A numbered list of agreed claims, each with one sentence from each side explaining acceptance, and any riders.
  II. A table of residual disagreements, with each side's formulation and classification as substantive or verbal.
  III. Cruxes: sub-questions that would move the debate, with cases/experiments, predictions, and use of the stipulated scenarios.
  IV. Verbal disputes: specifically on the original/derived distinction and the property of "real intentionality," and a proposal for a shared vocabulary.

  Constraints: no adjudication, no bibliography, no direct quotes, paraphrase with marking if contested.

  Let's break down each part.

  Part I: Agreed Claims

  We need claims that genuinely constrain the debate. Topics to cover:

  1. What the relocation of M between hosts A and B does/does not establish.
  2. Whether an account must allow for misrepresentation and content beyond actual causal covariance.
  3. Whether abstract syntax suffices for semantics.
  4. Whether content is answerable to dispositions or free of them.
  5. Whether there's a determinate answer to what s1 is about in host B.

  Draft claims:

  Claim 1: The physical identity of M across hosts A and B does not, by itself, determine that R's state s1 has the same content in both hosts.
  - BN: Because content depends on the biological context and function, which differs between hosts.
  - IST: Because content is fixed by the interpretative context and predictive utility, which differs between hosts.

  Claim 2: Any adequate account of intentionality must make room for the possibility of misrepresentation.
  - BN: Because biological functions can malfunction, and misrepresentation is a failure of proper functioning.
  - IST: Because predictive strategies can be wrong, and misrepresentation is a failed prediction based on the stance.

  Claim 3: Any adequate account of intentionality must allow that content can outrun actual causal covariance (e.g., in the uninstalled scenario, R might be said to be about something that never caused it).
  - BN: Because original intentionality can have content that is not causally covariant, as in the case of unexercised capacities.
  - IST: Because the intentional stance can attribute content based on design or counterfactual dispositions, even without actual causation.

  Claim 4: An abstract syntactic description, considered apart from any implementation, is insufficient for semantics.
  - BN: Because syntax alone lacks the biological grounding required for original intentionality.
  - IST: Because syntax without a role in a system's dispositions and predictive profile cannot support content.

  Claim 5: Content attributions are not free of a system's dispositions; they are constrained by them.
  - BN: Because dispositions are part of the causal basis of biological functions.
  - IST: Because content is defined by the success of the intentional stance, which relies on dispositions.

  Claim 6: In host B, there is no determinate fact of the matter about what s1 is about, without specifying an interpretative context.
  - BN: With a rider: unless there is a biological context that fixes the function, but in host B, the environment is mixed so the biological function might not be determinate. (Rider: For BN, if M is part of a biological system with a function, it might be determinate, but in this non-biological case, it's not clear.)
  - IST: Without rider: because content is always relative to an interpretation, and in host B without a user, it's indeterminate.

  But for Claim 6, BN might want to say that if we consider the design, then it's about quarters, but in host B it misrepresents. So perhaps:

  Revised Claim 6: In the case of host B, without any interpretative context, there is no determinate fact of the matter about what s1 is about.
  - BN: Because the module lacks original intentionality and without a user, derived intentionality is not fixed.
  - IST: Because content is always a matter of interpretation, and without an interpreter, it's not fixed.

  But BN might say that if we consider the design, then it's derived from the designers' intentionality. So let's use the scenarios.

  Also, the uninstalled module: never used.

  Claim 7: In the uninstalled module scenario (never powered, incinerated), R's state s1 (if it were set) would not be about anything.
  - BN: Because without any causal history or biological embedding, there is no content.
  - IST: Because without any role in a system's dispositions, and without any interpretation, there is no content.

  But what if it was set? The scenario says "if it were set"? The claim can be: In the uninstalled scenario, R has no intentional content.

  Claim 8: The engineered module (M-eng) and the accidental module (M-luck) differ in that M-eng has derived intentionality while M-luck does not, but only if there is an actual interpreting practice.
  - BN: With rider: M-eng has derived intentionality because it was designed by minds with original intentionality, but M-luck does not because it lacks such a history.
  - IST: With rider: M-eng can be interpreted based on its design history, so it has content when the intentional stance is applied, but M-luck, without any design or selection history, can only have content if an interpreter imposes it, not inherently.

  But IST might say that M-luck could be interpreted if it were found and used, but in the scenario, there is no user. So:

  Agreed: Without an interpreter, neither M-eng nor M-luck has content.

  But for M-eng, BN would say it has derived content because of the designers, even without a user? Not necessarily, derived intentionality might require an actual use.

  This is tricky. Let's draft the list.

  We need about 5-7 claims. I'll propose:

  1. The relocation of M between host A and host B shows that the content of R's state s1 is context-dependent and not solely determined by M's internal physical state.
     - BN: Because the biological function of M, and thus the content, depends on the environment in which it is embedded.
     - IST: Because the predictive utility of attributing content to s1 depends on the statistical regularities of the environment.

  2. An adequate account of intentionality must accommodate the possibility of misrepresentation.
     - BN: Because biological systems can malfunction, leading to states that fail to represent what they are supposed to.
     - IST: Because the intentional stance sometimes yields false predictions, and misrepresentation is a case of such failure.

  3. An adequate account of intentionality must allow that content can outrun actual causal covariance (e.g., in the uninstalled module, if R were set to s1, it could be said to be about quarters even though no quarter ever caused it).
     - BN: Because original intentionality involves the capacity to represent, which can exist without being exercised.
     - IST: Because the intentional stance attributes content based on counterfactual dispositions and design, not just actual causes.

  4. An abstract syntactic description (e.g., a state transition diagram) of a system, considered apart from any implementation or context, is insufficient to determine semantic content.
     - BN: Because syntax alone does not provide the biological grounding necessary for meaning.
     - IST: Because syntax without a role in a system's observable behavior and predictive profile cannot fix content.

  5. Content attributions are constrained by a system's actual and counterfactual dispositions; they are not free of such dispositions.
     - BN: Because dispositions are part of the causal basis for biological functions that fix content.
     - IST: Because content is defined by the success of the intentional stance, which is evaluated by the system's dispositions.

  6. In the scenario with the uninstalled module (never powered, incinerated), R has no intentional content.
     - BN: Because without any causal history or biological embedding, there is no function or content.
     - IST: Because without any dispositions to interact with the world or an interpreter, there is no basis for content attribution.

  7. In the scenario with two modules, M-eng (engineered) and M-luck (accidental), and no interpreter, neither has intentional content.
     - BN: With rider: unless M-eng's design history confers derived content, but without an interpreting practice, it is not realized. (So the rider might be: "except that M-eng has derived content in virtue of the designers' intentions, but this content is not active without an interpreter" — but this might be messy. Perhaps better to say: without an interpreter, the derived content of M-eng is not instantiated.)
     - IST: Without rider: because without an interpreter or a role in a larger system, there is no content.

  But to simplify, we might avoid the rider for Claim 7 and say: Without an interpreter, both M-eng and M-lack have no intentional content.

  For BN, derived content might still exist potentially, but not actually. So:

  Claim 7: In the absence of any interpreter or user, both M-eng and M-luck lack actual intentional content.
     - BN: Because derived intentionality requires an actual interpreting mind to give it content.
     - IST: Because content is only present when the intentional stance is applied.

  8. In the progressive internal closure scenario (where the coupling is enriched), the content of R's states may become more robust or sophisticated, but the physical substrate of R remains unchanged.
     - BN: The content changes because the internal mechanisms now support more complex functions, but without a biological basis, it remains derived.
     - IST: The content changes because the system's dispositions become richer, allowing more reliable predictions under the intentional stance.

  But this might not be agreed. BN might say that even with enrichment, it's still derived, so the content is fixed by the user. IST might say it becomes more like a believer.

  Perhaps: The progressive internal closure does not, by itself, confer original intentionality on the system.
     - BN: Because original intentionality requires specific biological processes not present in M.
     - IST: Because the intentional stance does not require original intentionality; even with closure, it's still a matter of interpretation.

  Not sure. Maybe skip this for Part I.

  Instead, focus on the host B case.

  Claim 6 (alternative): In host B, the state s1 can be said to misrepresent when a non-quarter token is inserted, but the content of s1 is not determinate without specifying the context of interpretation.
     - BN: With rider: In a biological system, misrepresentation requires a proper function, but here, without one, it is indeterminate. (But the module is designed, so for host A it's clear, for B it's not? Perhaps)
     - IST: Without rider: because in host B, the state s1 can be interpreted as "quarter present" but often fails, or as "token matching profile present", and both are possible depending on the predictive purpose.

  This is messy. Let's define the claims as per the instructions.

  Part II: Table of Residual Disagreements

  Topics might include:

  - Whether original intentionality exists as a non-derived property.
  - Whether content can be fully explained without appealing to intrinsic properties.
  - Whether derived intentionality requires a terminus in original intentionality.
  - The role of consciousness in intentionality.

  For each, we need:

  - Topic
  - BN formulation (in their terms)
  - IST formulation (in their terms)
  - Classification: substantive or verbal with reason.

  Part III: Cruxes

  We need sub-questions that would move at least one party. Cases should use the stipulated scenarios.

  Possible cruxes:

  1. Does phenomenal consciousness play a role in fixing content?
     - Case: Suppose we have a system that is functionally identical to a conscious being but lacks consciousness (e.g., a philosophical zombie). Would it have intentional states?
       - BN: Predicts no, because without consciousness, there is no original intentionality.
       - IST: Predicts yes, because intentionality is about functional role, not consciousness.
     - Use of scenarios? Not directly, but we can tie to the internal closure: if we progressively enrich M to be like a conscious system, at what point does content become original? But that's vague.

  2. Can a regress of derived content terminate in a design or selection process without any mind?
     - Case: Consider M-luck, the accidental module. If it were naturally selected (e.g., by random mutations and environmental pressures) to have the same structure as M-eng, but with no designers and no interpreters, does it have content?
       - BN: Predicts no, because without original intentionality at the start, there is no derived content.
       - IST: Predicts yes, because the intentional stance can be applied based on its selection history.

  Part IV: Verbal Disputes

  - Are "original" and "derived" marking a difference in the number of argument places? For BN, original intentionality might be a monadic property of a state, while derived is relational. For IST, all content is relational.
  - Do they pick out the same property? BN might think real intentionality is intrinsic, IST thinks it's a stance-relative property.

  Propose a shared vocabulary: e.g., use "intrinsic intentionality" for what BN calls original, and "ascribed intentionality" for what IST calls real, but then we need to define without begging the question.

  Now, let's draft the statement.
answer: |-
  ### Joint Statement on Intentionality and the Isolated Register  
  *Following the Adversarial Collaboration Workshop*  

  **Preamble**  
  We, the undersigned, representing biological naturalism (BN) and intentional-stance theory (IST), have engaged in a structured dialogue centered on the "Isolated Register" case. We agree on the core descriptions of the case and its stipulated variations. This statement records areas of agreement, residual disagreements, cruxes for future inquiry, and reflections on verbal disputes. It is not a resolution but a foundation for continued debate.  

  ---

  ### Part I: Agreed Claims  

  Both parties endorse the following claims, with explanations for acceptance. Riders are included where necessary.  

  1. **The physical identity of module M across hosts A and B does not entail identical content for state s1.**  
     - BN: Host A provides a stable environment where s1 covaries with quarters, fixing content via derived intentionality from designers; host B’s unstable environment disrupts this covariance, making content indeterminate without a biological context.  
     - IST: Content is fixed by predictive utility in an interpretative context; in host A, s1 reliably indicates quarters, while in host B, its predictive value is context-dependent (e.g., "token present" vs. "quarter present").  

  2. **Any adequate account of intentionality must accommodate misrepresentation and content that outruns actual causal covariance.**  
     - BN: Biological systems can malfunction (e.g., s1 triggered by non-quarters in host B), and unexercised capacities (e.g., the uninstalled module) show content can exist without causal history.  
     - IST: Predictive strategies can fail (e.g., s1 in host B), and content arises from counterfactual dispositions (e.g., what s1 *would* indicate if used), not just actual causes.  

  3. **An abstract syntactic description (e.g., state-transition rules) is insufficient to determine semantic content, independent of implementation or context.**  
     - BN: Syntax lacks biological grounding, which is necessary for intrinsic content; even a perfect formal model requires a biological system to "breathe life" into symbols.  
     - IST: Syntax alone does not specify how states support predictions; content depends on observable, dispositional patterns in a system’s interaction with an environment or interpreter.  

  4. **Content attributions are constitutively constrained by a system’s actual and counterfactual dispositions; they cannot be "free-floating."**  
     - BN: Dispositions are manifestations of biological functions, which fix content; content cannot transcend what the system is causally disposed to do.  
     - IST: Content is defined by the success conditions of the intentional stance, which are evaluated against the system’s dispositions; attributions unmoored from dispositions are empty.  

  5. **In the uninstalled module scenario, R has no intentional content.**  
     - BN: Without biological embedding or causal interaction, there is no function to fix content, even if R is physically identical to an active system.  
     - IST: Without dispositions to interact with the world or an interpreter, there is no basis for applying the intentional stance, so no content.  

  6. **In the engineered (M-eng) vs. accidental (M-luck) scenario, neither module has intentional content without an interpreter or user.**  
     - BN (with rider): *Derived content requires an actual interpreting mind to realize it;* without one, M-eng’s design history only provides potential content, not actual content.  
     - IST: Without an interpreter or role in a larger system, the intentional stance cannot be applied, so no content exists for either module.  

  7. **In host B, there is no determinate fact of the matter about what s1 is about, absent an interpretative context.**  
     - BN (with rider): *In non-biological systems, content determinacy requires a user or function;* host B’s mixed environment precludes a unique function for s1 without specification.  
     - IST: Content is always interpretation-relative; in host B, s1 could be interpreted as "quarter present" (often false) or "token matching profile present" (reliable), with no privileged answer.  

  ---

  ### Part II: Residual Disagreements  

  Substantive disagreements are rooted in conflicting explanatory commitments; verbal disagreements arise from terminological divergence without factual consequence.  

  | Topic | BN Formulation | IST Formulation | Classification & Reason |
  |-------|----------------|-----------------|--------------------------|
  | **Existence of original intentionality** | Original intentionality is an intrinsic, non-derived property of certain biological systems (e.g., humans), which is causally produced by biological processes and serves as the sole foundation for all derived content. | The original/derived distinction is illusory; all intentionality is ascribed via the intentional stance, and no "non-derived" property is detectable or explanatory. | **Substantive**: BN posits a unique biological causal power; IST denies its existence and utility. |
  | **Termination of content regress** | Derived intentionality must terminate in a mind with original intentionality; no design or selection process without a mind can confer genuine content. | Content regresses can terminate in design or selection histories (e.g., evolution) without invoking minds; intentionality is fixed by historical patterns interpretable via the stance. | **Substantive**: BN requires a conscious terminus; IST allows mindless processes to ground content. |
  | **Role of consciousness in content** | Phenomenal consciousness is necessary for fixing original intentionality, as it provides the intrinsic "aboutness" that underlies all representation. | Consciousness is irrelevant to content fixation; intentionality is fully explained by functional/dispositional properties assessable from the third-person stance. | **Substantive**: BN ties content to first-person experience; IST sees it as stance-relative and third-personal. |
  | **Nature of "real" intentionality** | Real intentionality is an intrinsic, non-relational property of states in biological systems, detectable via its causal role in conscious cognition. | Real intentionality is a relational property (state + interpreter + history) that is attributed when it reliably supports prediction, with no additional "intrinsic" layer. | **Verbal**: The dispute hinges on defining "real"—BN uses it for a monadic property; IST for a polyadic relation. |

  ---

  ### Part III: Cruxes  

  Cruxes are sub-questions where empirical or conceptual progress could shift one or both positions. Cases draw on the stipulated scenarios. Each party’s advance prediction is noted; agreement on predictions flags a non-crux.  

  1. **Does phenomenal consciousness fix content?**  
     - **Case**: Modify the internal closure scenario to include a synthetic system with functional parallels to human cognition (e.g., error correction, learning) but no consciousness. If integrated into host A/B, does R’s content differ from a conscious version?  
     - **Informative result**: If content attribution remains identical under the intentional stance, it challenges BN; if not, it supports BN.  
     - **BN prediction**: Content will differ—consciousness provides intrinsic "aboutness" absent in non-conscious systems.  
     - **IST prediction**: Content will not differ—functionality alone suffices, regardless of consciousness.  

  2. **Can a content regress terminate without a mind?**  
     - **Case**: Use M-luck (the accidental module) in a simulated evolutionary scenario where random mutations "select" for the coin-discrimination function, with no designers or users. Does R have content?  
     - **Informative result**: If IST attributes content based on "selection history," while BN denies it, the case tests if mindless processes can ground content.  
     - **BN prediction**: No content—without a mind, there is no original intentionality to derive from.  
     - **IST prediction**: Content is present—selection history provides interpretable patterns for the stance.  
     - *Flag*: Both predict disagreement, confirming this as a crux.  

  3. **Does internal closure confer content without interpretation?**  
     - **Case**: In the enriched internal closure scenario (full error correction, memory), seal M permanently with no external access. If R stabilizes to s1, is this contentful without an interpreter?  
     - **Informative result**: If both agree on content (e.g., "quarter present"), it supports IST; if BN requires a user, it highlights divergence.  
     - **BN prediction**: No intrinsic content—only derived intentionality via a user.  
     - **IST prediction**: Content is present if internal processes support counterfactual-rich predictions.  

  ---

  ### Part IV: Verbal Disputes  

  We identify two verbal disputes and propose a shared vocabulary:  

  1. **Original/derived distinction**:  
     - BN uses "original" to denote intrinsic intentionality (a one-place property: state S *has* content C), and "derived" for relational intentionality (content C holds between S and an interpreter/history). IST rejects this distinction, treating all intentionality as relational (three-place: content C for state S relative to interpreter I and history H).  
     - **Verbal diagnosis**: The dispute is partly verbal—BN and IST are describing different properties. "Original" for BN marks a non-relational biological property; for IST, it is an eliminable label for reliable interpretation.  

  2. **"Real" intentionality**:  
     - BN and IST do not pick out the same property with "real intentionality." BN refers to a causally potent, intrinsic feature of biology; IST refers to a successful interpretive strategy. This is not a shared target.  

  **Proposed shared vocabulary**:  
  - Use **intrinsic intentionality** for BN’s target (a monadic property of biological states).  
  - Use **ascribed intentionality** for IST’s target (a polyadic relation: content ascribed to a state by an interpreter given a history).  
  - **Neutral framing**: Future debates should specify whether they address *intrinsic* (BN) or *ascribed* (IST) intentionality, with the understanding that IST denies the coherence of intrinsic intentionality. This avoids definitional fiat and isolates substantive issues (e.g., whether intrinsic intentionality exists).  
  - **Gloss**: If disagreement persists on whether "intrinsic intentionality" refers to anything, this is substantive, not verbal.  

  ---

  **Signatories**  
  Biological Naturalism Advocate: ________________________  
  Intentional-Stance Theory Advocate: ________________________  
  Date: ________________________  

  ---  
  *This document reflects consensus on constraining claims, clarifies disagreements, and identifies levers for progress. It does not adjudicate the debate.*
