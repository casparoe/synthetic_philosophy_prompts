  The user wants me to cover several standard requirements from confirmation theory literature, plus three additional conditions they've proposed (auditability, boundedness, calibration). For each, I need to provide: the precise condition, a concrete motivating case, and whether it's non-negotiable or camp-specific. Then I need to identify incompatible subsets of these conditions and explain the conflicts.

