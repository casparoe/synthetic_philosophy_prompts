answer: |-
  Here is a specification of desiderata for a theory of confirmation, structured as requested. The purpose is fixed: **The theory must produce verdicts usable by an automated evidence-triage system for large observational databases, where the system prioritizes which observation to collect next.** This implies:  
  - **Reproducibility**: Verdicts derive solely from explicit evidence records and background assumptions.  
  - **Cross-Hypothesis Comparability**: Confirmation magnitudes are comparable across distinct hypotheses (e.g., "all ravens are black" vs. "most swans are white").  
  - **Stability Under Re-description**: Verdicts are invariant under logically equivalent evidence formulations.  

  ### I. Received Desiderata  
  1. **Positive/Negative Instance Condition**  
     - *Condition*: A positive instance of a hypothesis (e.g., an object satisfying both antecedent and consequent of a universal conditional) confirms it; a negative instance (satisfying antecedent but not consequent) disconfirms it.  
     - *Motivating Case*: Observing a black raven confirms "all ravens are black"; observing a non-black raven (e.g., albino) disconfirms it.  
     - *Status*: Non-negotiable. Violation implies the system cannot reliably flag disconfirming evidence.  

  2. **Logical Equivalence Condition**  
     - *Condition*: Logically equivalent hypotheses (e.g., "all ravens are black" ≡ "all non-black things are non-ravens") receive identical confirmation from the same evidence.  
     - *Motivating Case*: Evidence described as "a non-black non-raven" (e.g., a white shoe) must assign the same confirmation to both logically equivalent forms of the ravens hypothesis.  
     - *Status*: Non-negotiable. Required for reproducibility and stability.  

  3. **Entailment Conditions**  
     - **Consequence Condition**: If evidence confirms H, and H entails K, then evidence confirms K.  
       - *Motivating Case*: Evidence confirming "all corvids are black" should confirm "all ravens are black" (since ravens entail corvids).  
       - *Status*: Non-negotiable. Violation breaks cross-hypothesis comparability: the system could not rank hypotheses by entailment relations.  
     - **Converse Consequence Condition**: If evidence confirms K, and H entails K, then evidence confirms H.  
       - *Motivating Case*: If "this raven is black" confirms "all birds are black" (entailed by "all ravens are black"), it should confirm "all ravens are black".  
       - *Status*: Camp-specific (Syntactic/Inductive-Logic camp). Bayesian and probabilistic camps reject it to avoid *tacking by conjunction* (e.g., confirming "all ravens are black and the moon is cheese" via irrelevant evidence).  

  4. **Consistency Condition**  
     - *Condition*: A consistent evidence record cannot confirm two mutually incompatible hypotheses.  
     - *Motivating Case*: Evidence cannot simultaneously confirm "all metals conduct electricity" and "some metals do not conduct".  
     - *Status*: Non-negotiable. Essential for automated triage to avoid self-defeating recommendations.  

  5. **Non-Universal Hypotheses**  
     - *Condition*: The account handles statistical hypotheses (e.g., "90% of ravens are black") and existential hypotheses (e.g., "there exists a black raven"), not just universal conditionals.  
     - *Motivating Case*: In astronomy, testing "90% of exoplanets have atmospheres" or "there is a water-rich exoplanet" requires distinct confirmation rules.  
     - *Status*: Non-negotiable. Required for real-world applicability beyond toy examples.  

  6. **Background Knowledge and Total Evidence**  
     - *Condition*: Confirmation is relative to explicit background knowledge (B), and only the total available evidence (E) may be used.  
     - *Motivating Case*: A DNA match confirms guilt only against background knowledge of population genetics; ignoring exculpatory evidence (e.g., an alibi) violates total evidence.  
     - *Status*: Non-negotiable. Reproducibility demands explicit B, and automated systems must use all E.  

  7. **Edge Cases**  
     - **Empty Subject Class**: If no ravens exist, "all ravens are black" is (vacuously) true, but evidence (e.g., shoes) should not confirm it.  
       - *Motivating Case*: Observing shoes should not confirm "all unicorns are pink" if unicorns don’t exist.  
       - *Status*: Non-negotiable. Vacuous confirmation would mislead the triage system.  
     - **Finite Populations**: For hypotheses over finite sets (e.g., "all ravens in this forest are black"), confirmation must reflect exhaustibility.  
       - *Motivating Case*: After observing all 100 ravens in a forest to be black, no further raven observations can increase confirmation.  
       - *Status*: Non-negotiable. Triage systems must recognize when a hypothesis is testably complete.  

  8. **Non-Black Non-Raven Cases**  
     - *Condition*: The account accommodates cases where a non-black non-raven (e.g., a white shoe) *disconfirms* "all ravens are black" under specific background assumptions.  
     - *Motivating Case*: If B includes "observations are sampled from items expected to falsify the hypothesis," a white shoe (non-black) fails to falsify "all non-black things are non-ravens," weakening its support for the ravens hypothesis.  
     - *Status*: Genuine datum to be explained. Reflects how sampling methods affect confirmation in real science (e.g., controlled experiments vs. passive observation).  

  9. **Paradox Explanation Requirement**  
     - *Condition*: The theory must explain why the ravens case *appears* paradoxical (e.g., why a white shoe intuitively seems irrelevant) rather than dismissing it as a non-problem.  
     - *Motivating Case*: Naïve applications of equivalence (Desideratum 2) suggest white shoes confirm as strongly as black ravens, violating intuition.  
     - *Status*: Non-negotiable. Absence of explanation undermines trust in automated verdicts.  

  ### II. Your Proposed Desiderata  
  10. **Auditability**  
      - *Condition*: Confirmation verdicts depend only on explicit evidence records and stated B, with no reliance on unstated intuitions about natural predicates, salience, or "live" alternatives.  
      - *Motivating Case*: Evidence recorded as "this shoe is white leather" vs. "this shoe is a non-black non-raven" must yield the same verdict for "all ravens are black" if both descriptions are factually identical.  
      - *Status*: Genuine and non-negotiable. Collides with **background-relativity** (Desideratum 6) if B implicitly assumes predicate naturalness. Surrendering this allows theories to invoke "grue"-type intuitions, sacrificing reproducibility.  

  11. **Boundedness**  
      - *Condition*: Confirmation from unbounded, cheaply repeatable observations (e.g., white shoes) cannot accumulate to surpass confirmation from bounded, scarce observations (e.g., black ravens).  
      - *Motivating Case*: 1,000,000 white shoes must not outweigh one black raven for "all ravens are black".  
      - *Status*: Genuine and non-negotiable. Collides with **additive confirmation measures** (e.g., in probabilism) where small increments from white shoes sum. Surrendering this permits theories where abundant weak evidence dominates rare strong evidence, misguiding triage.  

  12. **Calibration**  
      - *Condition*: Degrees of confirmation must be long-run calibratable: Hypotheses assigned high confirmation should prove true more often than those assigned low confirmation.  
      - *Motivating Case*: If hypotheses rated at 0.8 confirmation are true 60% of the time, but those at 0.9 are true 85% of the time, the account is calibrated.  
      - *Status*: Genuine but negotiable. Collides with **logical interpretations** of confirmation (e.g., Carnap) where degrees reflect logical structure, not empirical success. Surrendering this allows purely formal accounts that ignore predictive accuracy.  

  ### III. Incompatible Subsets  
  - **Conflict 1**: Boundedness + Consequence Condition + Probabilistic Confirmation  
    - *Issue*: Probabilistic measures (e.g., difference measure) allow unbounded accumulation of small confirmatory increments. Satisfying boundedness requires capping confirmation from abundant evidence, violating the Consequence Condition’s additive entailment.  
    - *Resolution*: Drop or weaken the Consequence Condition. This breaks cross-hypothesis comparability for entailed hypotheses.  
    - *Cause*: Conflict is inherent to boundedness formulation.  

  - **Conflict 2**: Auditability + Non-Black Non-Raven Cases  
    - *Issue*: Non-black non-ravens disconfirm only if B includes sampling assumptions (Desideratum 8). But auditability demands B be fully explicit and intuition-free, yet sampling assumptions often rely on unstated expectations about observation processes.  
    - *Resolution*: Relax auditability to allow "standard" background assumptions (e.g., random sampling). This risks reintroducing implicit intuitions.  
    - *Cause*: Conflict forced by your formulation—auditability’s strictness clashes with context-dependence in Desideratum 8.  

  - **Conflict 3**: Calibration + Logical Equivalence Condition  
    - *Issue*: Logically equivalent hypotheses (Desideratum 2) must receive identical confirmation, but their calibration may differ empirically (e.g., "all ravens are black" vs. "all non-black things are non-ravens" could have distinct truth-frequencies if ravens are finite but non-black things are infinite).  
    - *Resolution*: Drop calibration or treat logical equivalence as empirically contingent. The latter violates formal logic foundations.  
    - *Cause*: Standard conflict (e.g., Bayesian vs. frequentist views of probability).  

  - **Conflict 4**: Boundedness + Positive Instance Condition  
    - *Issue*: White shoes are positive instances of "all non-black things are non-ravens" (by Desiderata 1 and 2), so they must confirm the ravens hypothesis. But boundedness demands their impact be strictly less than black ravens, violating additive positive-instance confirmation.  
    - *Resolution*: Reject Positive Instance Condition for non-natural classes. This surrenders reproducibility for arbitrary predicates.  
    - *Cause*: Inherent to ravens paradox dynamics.  

  ### Final Assessment  
  **Auditability excludes the largest number of candidate accounts** because most theories (e.g., Bayesianism, hypothetico-deductivism) tacitly rely on natural predicates or salience in handling background knowledge, equivalence, and the ravens paradox, violating explicit reproducibility.
