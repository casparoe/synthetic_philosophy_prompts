prompt: |-
  I'm writing the methods annex for a national wellbeing framework at my ministry and a colleague told me to just write down what I actually believe before I start arguing about instruments. So here's the list. Tell me whether it hangs together.

  1. Wellbeing is what policy is for, and the only way to find out about it is to ask people. Objective dashboards — income, housing square metres, healthy life expectancy — can't tell you whether lives are going well, so I don't want one in the headline.

  2. If you're only going to headline one question it should be the life-evaluation ladder, not the affect items. Affect questions just pick up whatever mood someone is in when the interviewer happens to call. And I take the focusing illusion seriously — people massively overweight whatever is salient when you ask them about one slice of their life — so I'd rather make them weigh the whole thing.

  3. Take the answers at face value. If a woman in a genuinely bad situation says her life is going alright, that's data, not false consciousness. A framework that quietly overrides what people tell us about their own lives is not one I want to sign my name to.

  4. All the same: an intervention whose only effect is to help people adjust to circumstances that haven't changed — resilience courses, reframing, social comparison — has not improved wellbeing, even when the average score goes up.

  5. Cross-country comparisons of average levels are shaky. Translation, scale use, response styles. Gaps of a couple of tenths between neighbouring ranks in the league table are noise and shouldn't be presented as an ordering, and I'd fight anyone who publishes one that way.

  6. But distribution within a country is not just a taste thing. At equal averages I'd take the society where everyone scores about 6 over the one where the bottom fifth scores 4 and the top fifth scores 8 — and I mean that as a claim about who is actually worse off, not as a preference for equality as such.

  7. And I still want one headline number in the annual report, because that is the only thing the political process will engage with at all.

  Go through these and tell me which ones are genuinely pulling against each other and which only look like they are — I have no idea where the cracks are and no view on what I'd give up. Rank the real tensions by severity rather than listing them all as equally bad, and for each say what would actually have to go and what it costs me to drop it. Then tell me which single revision would clean up the most.
reasoning: |-
  Okay, the user is working on a national wellbeing framework and wants my feedback on their core principles. They've listed seven beliefs about measuring wellbeing and want to know if they hang together. 

  First, I notice they're in a government policy context - this isn't academic work but something that will directly impact decision-making. The colleague's advice to "write what you actually believe" suggests there might be institutional pressures around methodology. The user seems intellectually honest but possibly isolated in their views.

  Looking at the principles... there's a strong thread of respecting subjective experience throughout. Points 1, 3 and 4 form an interesting triad: wellbeing must be self-reported (1), those reports must be taken literally (3), BUT interventions that only change perception without changing circumstances don't count (4). That's actually quite sophisticated - it avoids both paternalism and the "tyranny of positive thinking."

  The ladder vs affect measure debate (point 2) shows they've done their homework on measurement literature. I recall Kahneman's work on the focusing illusion they mention - good catch. Their skepticism about cross-country comparisons (5) is warranted given methodological issues, though it slightly contradicts wanting a headline number (7).

  Ah, the headline number tension (7) might be the biggest practical problem. They know it's reductive but politically necessary. This feels like the key compromise point. The distribution concern (6) is ethically sound but hard to reconcile with a single number.

  The user seems most conflicted about point 4 vs point 3 - how to honor self-reports while rejecting resilience interventions. That's philosophically tricky. And they're clearly frustrated by point 5's incompatibility with league tables that politicians love.

  Hmm... if I had to suggest one revision, it would be to reframe the headline number as a multi-component index rather than pure life evaluation. That might resolve several tensions at once. But I should acknowledge how much that would pain them given their commitment to simple self-reports.

  They're bravely trying to balance methodological rigor with political reality. I respect that they're not pretending the tensions don't exist - hence this request. The "what would it cost me" framing shows they're prepared to make hard choices.
answer: |-
  Based on your principles, here's an analysis of the tensions, ranked by severity, including what must be sacrificed and the cost of dropping it. The most significant tension is the conflict between your methodological rigor and political pragmatism:

  | **Tension** | **Severity** | **Principles Pulling Against Each Other** | **What Would Have to Go** | **Cost of Dropping It** |
  |-------------|--------------|-------------------------------------------|---------------------------|--------------------------|
  | Headline Number vs. Measurement Integrity | ★★★★ (Critical) | 7 (Headline number needed) vs. 1-6 (Methodological caveats) | Either abandon a single headline number or dilute caveats | Political irrelevance vs. compromised framework integrity |
  | Self-Report Sanctity vs. Intervention Validity | ★★★ (High) | 3 (Take answers at face value) vs. 4 (Reject resilience interventions) | Stop questioning validity of perception-based interventions | Loss of philosophical coherence or paternalistic overreach |
  | Headline Simplicity vs. Distributional Concerns | ★★ (Moderate) | 7 (One headline number) vs. 6 (Distribution matters) | Ignore distribution or complicate the headline | Oversimplification vs. political disengagement |
  | Life Evaluation vs. Affect Skepticism | ★ (Low) | 2 (Ladder preferred) vs. 1 (Subjective focus) | Affective measures | Potential loss of context |

  ### Deep Dive on Key Tensions:
  **1. Headline Number vs. Measurement Integrity (Severity: ★★★★)**  
  *Principles 7 vs. 1, 2, 5, and 6*  
  - **Conflict:** A single headline number (7) clashes with your skepticism about cross-country comparability (5), desire to account for distribution (6), rejection of objective dashboards (1), and preference for life evaluation (2).  
  - **Sacrifice Required:**  
    - *Option A:* Abandon the single headline number → **Cost:** Political disengagement (your core rationale for #7).  
    - *Option B:* Present the number while violating #5/#6 → **Cost:** Misleading rankings; ethical discomfort; contradicts #6's claim that distribution matters intrinsically.  
  - **Why Severe?** This pits operational reality against philosophical coherence. #7 is your concession to political constraints, but it directly undermines #5 (comparisons are "noise") and #6 (distribution is fundamental).

  **2. Self-Report Sanctity vs. Intervention Validity (Severity: ★★★)**  
  *Principles 3 vs. 4*  
  - **Conflict:** Taking self-reports at face value (3) conflicts with rejecting interventions that boost scores via psychological adaptation (4). If a resilience course raises ladder scores, #3 says this reflects real wellbeing gain; #4 says it’s invalid.  
  - **Sacrifice Required:**  
    - *Option A:* Drop #4 → **Cost:** Endorse "wellbeing-washing" – accepting score increases from coping, not change.  
    - *Option B:* Drop #3 → **Cost:** Paternalism – implying you know true wellbeing better than respondents.  
  - **Why High?** This challenges your core epistemology. Resolving it requires defining wellbeing *beyond* self-report or accepting adaptation as valid.

  **3. Headline Simplicity vs. Distributional Concerns (Severity: ★★)**  
  *Principles 7 vs. 6*  
  - **Conflict:** A single headline number (7) obscures distributional differences you deem ethically/materially significant (6).  
  - **Sacrifice Required:**  
    - *Option A:* Ignore distribution in the headline → **Cost:** Misrepresents societal wellbeing (e.g., masks suffering of the 4/10 group).  
    - *Option B:* Make the "headline" a dashboard (e.g., average + inequality metric) → **Cost:** Violates #7’s simplicity mandate; may dilute political impact.  
  - **Why Moderate?** Technically solvable (e.g., headline = median, or an inequality-adjusted index), but challenges your "one number" strictness.

  **4. Life Evaluation vs. Affect Skepticism (Severity: ★)**  
  *Principles 2 vs. 1 (implied)*  
  - **Conflict:** Insisting *only* life evaluation is headline-worthy (2) slightly narrows your broad commitment to subjective wellbeing (1).  
  - **Sacrifice Required:**  
    - *Option A:* Broaden the headline to include affect → **Cost:** Undermines your critique of mood volatility/focusing illusion.  
    - *Option B:* Keep only the ladder → **Cost:** Potential loss of context (e.g., high evaluation but low affect could signal stoicism).  
  - **Why Low?** This is a measurement preference within your subjective paradigm, not a deep contradiction. Easily resolved by keeping affect as supplementary.

  ### The Single Revision That Cleans Up the Most:
  **Reframe the Headline Number as a Composite Index.**  
  - **How it resolves tensions:**  
    1. **Addresses Headline vs. Integrity (★★★★):** Create a headline index combining life evaluation (2) + distributional metric (6). E.g., Median Ladder Score × Equality Coefficient. This honors #6 without complexity.  
    2. **Defuses Headline vs. Distribution (★★):** Explicitly incorporates distribution.  
    3. **Respects Cross-Country Caveats (5):** Frame the index as *monitoring national progress*, not cross-country ranking.  
    4. **Preserves Political Impact (7):** Still one number.  

  - **What it costs you:**  
    - Violates pure "face value" reporting (#3) by mathematically transforming responses.  
    - Requires defining an equality metric (controversial, but your #6 justifies it).  
    - Doesn’t resolve #3 vs. #4 – that requires separate philosophical groundwork.  

  **Result:** This revision directly tackles your most severe tension (headline integrity) while strengthening alignment with #6 and sidestepping #5 pitfalls. It forces minimal sacrifice (index construction vs. raw score) for maximum coherence.  

  ### Recommendation:
  Start with the composite index revision. Then, explicitly clarify Principle #4: *"Wellbeing improvements require material or social change; score increases from psychological adaptation alone reflect measurement limitations, not true progress."* This maintains #3’s respect for self-reports while rejecting resilience courses as policy solutions. The remaining tensions become manageable trade-offs rather than fatal flaws. Your framework holds together if politicians accept that the headline number reflects *your rigorously defined* wellbeing – not a universal score.
