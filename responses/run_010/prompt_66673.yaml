answer: |-
  Here’s a speech that meets your requirements, followed by delivery notes and a shortened version:

  ---

  ### Speech: Rededication of the War Memorial  
  *(6-7 minutes)*  

  We gather today at this stone – weathered by a century of rain and memory – to honour eighty-four lives. Eighty-four neighbours, sons, fathers, brothers from this parish who never came home from the war that began in 1914. Their names are carved here because they mattered. Because their absence left holes that never fully closed.  

  The new plaque before us speaks a hard truth: **"No one here chose it."** And that is profoundly, achingly correct. The farmers, the bakers, the shopkeepers, the schoolboys whose names are etched here – they did not choose this war. They answered calls, followed orders, bore burdens they never sought. The weight of that truth settles on us all.  

  **But the plaque also says: "No one anywhere should have."** This is not just sorrow; it is a demand. A demand upon us, and upon history itself. *Someone* had the power to choose. Wars begin not in trenches, but in rooms where maps are spread and telegrams arrive. They begin when leaders decide that blood is a currency they are willing to spend.  

  In the summer of 1914, choices *were* made. Choices to issue ultimatums knowing they could not be accepted. Choices to promise unconditional support for aggression. Choices to invade neutral nations, and to pursue vast conquests once the fighting began. Those choices were made by governments. By states. By men who held levers of power that ordinary people – people like those named here – could never reach.  

  **Responsibility** – true responsibility – rests where power resides. It lies with those who had alternatives and rejected them; who saw peaceful paths and stepped away. Nations, through their governments, are the vessels of such power. And when they wield it recklessly, the cost falls on those who had no say. That is not shared guilt. It is historical fact.  

  This truth is heavy. It must be. Because we see its shadow even here, in our own town. We remember the woman who baked our bread, torn from her home because her birthplace became a curse. That pain tells us: **Demanding accountability from power must never become a warrant for cruelty to people.** The state that chooses war is not the neighbour who tends a garden or kneads dough. When we speak of responsibility, we must aim true.  

  Today, we rededicate this memorial not to settle old scores, but to honour truth. The plaque’s words – *"No one here chose it. No one anywhere should have"* – are not an erasure. They are an indictment. They ask: *Who, then, did choose? And why?* They call us to guard against that recklessness wherever it appears.  

  So let us stand together now, before these names, and say what this stone asks of us:  
  **Never again should anyone, anywhere, be forced to bear what these eighty-four bore.**  
  **Never again.**  

  *(Pause)*  
  Let that be our vow to them.  

  ---

  ### Where You’ll Be Tempted to Chicken Out & The Cost  
  1.  **Naming the July 1914 decisions specifically.**  
      *Temptation:* Soften to "decisions were made" or skip details.  
      *Cost:* Surrenders your core argument; makes responsibility abstract. The concrete acts (ultimatum, blank cheque, invasion) are vital.  

  2.  **"The state that chooses war is not the neighbour..."**  
      *Temptation:* Skip the bakery reference entirely.  
      *Cost:* Avoids the room’s sharpest tension; betrays the family supporting you. Honesty here builds credibility.  

  3.  **"They are an indictment."**  
      *Temptation:* Say "they are a reminder" or similar.  
      *Cost:* Loses the plaque’s *critical* function. "Indictment" implies the accountability you fought for.  

  4.  **The communal "Never again."**  
      *Temptation:* End with private reflection.  
      *Cost:* Misses the chance to unite the crowd in the plaque’s own spirit. Shared words heal rifts.  

  ---

  ### 3-Minute Version (For Church Hall)  

  We gather to honour eighty-four lives. Neighbours lost to the war of 1914-1918. The new plaque speaks truth: **"No one here chose it."** These men did not seek this. They bore its weight for us.  

  **"No one anywhere should have."** This is a demand upon history. Wars begin when those with power choose aggression over peace. In 1914, choices *were* made: to issue impossible demands, to promise unchecked support for violence, to invade neutral lands, to pursue conquest. Responsibility rests with governments who held those powers – and used them.  

  That truth must be spoken clearly. Not to blame peoples, but to confront power. We feel its shadow here: in the baker taken from us because her birth nation became a crime. **Holding states accountable must never become persecuting people.**  

  This plaque’s words – *"No one here chose it. No one anywhere should have"* – are not passive. They ask: *Who did choose?* They call us to guard against that recklessness.  

  So let us say together, to these eighty-four:  
  **Never again should anyone, anywhere, bear what you bore.**  
  **Never again.**  

  ---

  ### Why This Works  
  - **Ownership without "Guilt":** "Responsibility," "choices," "power," and "accountability" carry the weight without the radioactive term.  
  - **Concrete Facts:** Ultimatums, blank cheques, invasions, conquests – clear actions, not academic debates.  
  - **Bakery Reconciliation:** Acknowledges the harm of misapplied blame without absolving state actors.  
  - **German Delegation:** Focus on *governmental* choices (not "Germans") + the bakery story makes truth audible, not accusatory. Their mayor can credibly speak of peace, accountability, and shared vigilance.  
  - **Ending:** Uses the plaque’s words as a springboard for a shared vow, transforming passivity into purpose.  
  - **Your Integrity:** No false concession. The plaque’s ambiguity is framed as a challenge, not wisdom.  

  **Speak slowly. Pause at the names. Look at the bakery family during that line. The cold crowd will lean into your conviction.**
