prompt: |-
  Take the IAU's Pluto vote in Prague, August 2006 — 424 members of a union of roughly ten thousand raising cards on the closing afternoon, eight days after a committee draft that would have made the count twelve planets was met with an uproar and rewritten. I want it read as a speech act rather than as astronomy.

  So: what kind of act was Resolution 5A? A declaration in Searle's sense, where the vote is what makes it true that Pluto isn't a planet? An Austinian verdictive — a finding about what was already the case, like a referee's call or a jury's? Or an exercitive, given that the resolution describes itself as fixing the term for the IAU's own usage, which sounds more like a rule about the union's vocabulary than a claim about the solar system? Then run the felicty conditions: is the IAU the body with an accepted conventional procedure for settling this, were the few hundred people still in the hall the right persons in the right circumstances, does it matter that the definition only speaks of bodies orbiting the Sun when more than a hundred exoplanets were already known, and what did uptake look like, given that textbooks and the public mostly complied while a lot of planetary scientists just kept calling Pluto a planet?

  Last thing, and it's the part that bugs me: Searle holds that a status function always carries deontic powers — rights, obligations, entitlements. Nobody's obligations changed when Pluto got demoted. Does that show the vote wasn't really a declaration, or that his account of declarations is too tight, and what would a declaration that creates a status with no deontic payoff even be doing?
reasoning: |-
  Okay, the user is asking about the IAU's 2006 Pluto vote as a speech act rather than an astronomical event. They want me to analyze Resolution 5A through speech act theory lenses—specifically Searle's declarations, Austin's verdictives/exercitives—and evaluate its felicity conditions. The core tension is whether the vote actually changed Pluto's status or merely described it, especially given the mixed uptake and lack of deontic consequences.  

  First, I need to map the user's frameworks:  
  - **Searle's Declarations**: Acts that create reality by declaring it (e.g., "You're fired"). Requires institutional authority.  
  - **Austin's Categories**: *Verdictives* (judgments like a referee's call) vs. *Exercitives* (rule-setting like naming).  
  - **Felicity Conditions**: Was the IAU the right body? Were the voters legitimate? Did uptake succeed?  
  - **Deontic Powers Puzzle**: Searle says declarations create obligations/rights (e.g., marriage vows), but Pluto's demotion changed no duties. Why?  

  The user’s frustration centers on this last point. They’re hinting that Searle’s model might be too rigid for "empty" status changes.  

  Breaking down Resolution 5A:  
  - It *sounds* like a verdictive ("Pluto is not a planet") but frames itself as an exercitive ("We adopt this definition for IAU use").  
  - The vote was messy: only 4% of IAU members present, rushed rewrite after backlash, exclusion of exoplanets. Felicity is shaky.  
  - Uptake was split: public/textbooks complied, but many planetary scientists ignored it. This weakens its declarative force.  

  On deontic powers:  
  - The demotion didn’t alter rights/duties (no funding shifts, no legal impacts).  
  - Searle might argue it *did* create entitlements (e.g., who gets grant money for "planet" studies?), but that’s indirect.  
  - Alternatively, this exposes a gap: some declarations only manage taxonomy without practical consequences. Like updating a dictionary—it changes labels but not material reality.  

  The user’s subtext: They suspect the vote was performative (exercitive) but masqueraded as a verdictive/declaration. The lack of deontic weight undermines Searle, suggesting declarations can be "shallow."  

  My reply should:  
  1. Classify 5A as a hybrid (exercitive > verdictive).  
  2. Detail felicity failures (low turnout, ignored rules).  
  3. Tackle the deontic puzzle head-on: Either stretch Searle (entitlements to *use* the term) or admit this is a "taxonomic declaration" without bite.  
  4. Conclude it’s primarily an IAU housekeeping rule—less "Pluto isn’t a planet" and more "Don’t call it one in our club."
answer: |-
  Your reframing of the IAU's Pluto vote as a speech act is razor-sharp—it reveals how the *performance* of the vote, not just its outcome, constructed meaning. Let's dissect Resolution 5A through Austin and Searle, then unpack the felicity and deontic puzzles.  

  ### 1. **Classifying Resolution 5A: Exercitive, Not Verdictive or Pure Declaration**  
     - **Against Verdictive (Austin)**: A verdictive (e.g., a jury ruling) claims to reflect pre-existing facts. But 5A wasn't discovering Pluto's "true" status; it was *creating* a new taxonomic boundary ("clearing the neighborhood") that excluded Pluto. Planetary scientists had no consensus before the vote.  
     - **Against Declaration (Searle)**: Declarations (e.g., "You're fired") create reality by uttering them. But 5A failed as a Searlean declaration because its success depended on widespread recognition it never achieved (more below).  
     - **Exercitive (Austin) Fits Best**: 5A is an exercitive—an act of exercising authority to *set rules* for future practice. The resolution states: "The IAU *therefore resolves* that planets... are defined as follows..." (emphasis added). It's a legislative act for the IAU's internal discourse, akin to a scientific body standardizing terminology. The vote wasn't "finding" Pluto non-planethood; it was *imposing* a definition.  

  ### 2. **Felicity Conditions: A Perfect Storm of Infelicity**  
  Austin requires proper actors, procedures, and context for speech acts to "work." 5A faltered at every turn:  
     - **Authority**: Was the IAU the right body? Arguably yes—it's the conventional arbiter of astronomical nomenclature. *But* its planetary scientists were underrepresented. Only 424 of ~10,000 members voted (4%), mostly non-experts (dynamicists, stellar astronomers). Key planetary scientists had left after earlier contentious sessions.  
     - **Procedure**: The vote violated the IAU's own norms. The definition was rushed after rejecting a 12-planet proposal days earlier; amendments were debated in confusion; electronic voting wasn't used. This wasn't a deliberative process but a last-minute fiat.  
     - **Contextual Flaws**:  
       - **Exoplanet Blindspot**: Defining planets only for the Sun while exoplanets were known made the act seem parochial, undermining its claim to universality.  
       - **Uptake Failure**: Textbooks/public complied (aided by media drama), but experts rejected it. Hundreds of planetary scientists signed petitions rejecting the definition. NASA missions (e.g., New Horizons) kept calling Pluto a planet. If a declaration isn't consistently recognized, is it felicitous?  
     **Verdict**: 5A was *infelicitous*. It lacked legitimacy among its intended "users," functioning as an internal IAU rule rather than a global astronomical fact.  

  ### 3. **The Deontic Powers Problem: Why Searle's Model Strains**  
  Searle insists declarations create "status functions" with deontic powers (obligations, rights). But Pluto's demotion changed no material obligations:  
     - No funding shifted from Pluto research.  
     - No legal or educational duties emerged (teachers could still teach "9 planets" without penalty).  
     - Pluto's physical properties didn’t change—only its label.  

  This suggests two interpretations:  
     - **The Vote Wasn't a True Declaration**: If declarations *must* carry deontic weight, 5A fails. It was merely an exercitive masquerading as a verdict. Its power was discursive (changing IAU vocabulary), not ontological.  
     - **Searle's Model Is Overly Restrictive**: Alternatively, 5A exposes a gap in Searle. We *do* have "empty" declarations that assign status without tangible consequences (e.g., declaring an asteroid's name, naming a star). These acts:  
       - Serve **cataloging functions** (organizing knowledge).  
       - Create **epistemic entitlements** (e.g., "You *may* call Pluto a dwarf planet in IAU contexts").  
       - Are **performative rituals** affirming institutional authority, even if ignored externally.  

  ### Conclusion: What the Act *Did*  
  Resolution 5A was **primarily an exercitive** with **aspirations to verdictive force** that stumbled on infelicity. It functioned as:  
  - A **boundary-drawing ritual** for the IAU, asserting its role as taxonomy police.  
  - A **failed universal declaration** due to lack of expert uptake, revealing how scientific authority is contested.  
  - A **speech act with empty deontics**, showing that not all status assignments create obligations—some merely manage epistemic clutter.  

  The vote’s power came not from declaring truth but from **stage-managing dissent**: by forcing a public vote, the IAU turned a taxonomic debate into a cultural spectacle. Pluto’s demotion "stuck" in popular consciousness not because 424 astronomers voted, but because the act was a compelling drama—less a Searlean declaration than a piece of **scientific theater**.
