answer: |-
  Alright, let's crack this. You're mistaking the *initial resource transfer* for the *fundamental cost-bearing*. The signaler absolutely pays, just often in delayed or non-monetary currency crucial to Zahavi's honesty guarantee. 

  Take the medical student: Sure, the loan covers tuition, but *they* are paying with a decade of brutal effort, sleep deprivation, and massive opportunity cost – years they couldn't spend building wealth or family. That grind *is* the cost, and it's intrinsically borne by the student. A low-quality type *can't* fake enduring that cost effectively without cracking, revealing their inadequacy. The loan enables the *display* of enduring the cost, but the cost itself – the suffering, the time, the foregone alternatives – lands squarely on the signaler. The ascetic? The congregation provides sustenance, but the ascetic pays with chronic discomfort, social isolation, and physical deprivation – costs *they* experience directly. The sponsor facilitates the *platform* for the costly display, not the core sacrifice.

  And regarding the sponsor? Their expenditure *is* often a signal itself – an index of *their* resources or commitment! A family taking huge loans signals belief in the student *and* their own capacity to absorb risk (or co-sign!). A congregation supporting an ascetic signals their collective piety and surplus. This isn't an infinite regress; it's layered signaling. The sponsor's cost is an honest signal *because* expending resources frivolously (e.g., funding a lazy student or a fake ascetic) *would* genuinely deplete *them* relative to competitors who invest wisely. The cost lands *somewhere* in the system, creating honest filters at multiple levels. Your "price paid by anybody" ignores the intrinsically *personal* nature of the core performance cost.

  Your move. How does your "anybody can pay the price" account for the differential dropout rates in med school versus, say, online certificate mills? If it's just money, why the attrition under pressure?

