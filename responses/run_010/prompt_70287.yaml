  Here's my opening move. The handicap principle needs the cost to land on the signaler — that's the entire mechanism, the peacock pays for his tail out of his own survival budget. But in nearly every human case I can name, somebody else is footing the bill. The family takes out the loans for the medical degree. The congregation feeds the ascetic. The firm pays for the consultant's 200 page deck that nobody reads. The parents buy the fencing lessons and the voluntourism trip. So the signaler isnt paying anything, which on your own account means it isnt a handicap at all — it's a price, and a price can be paid by anybody with money, including exactly the low-quality types the display is supposed to keep out. And if you try to rescue it by saying fine, the real signal is coming from the sponsor, then the sponsor's cost is underwriten by their sponsor, and you've got a regress with no principled stopping point. So either your theory bottoms out arbitrarily, or it isn't buying honesty anywhere in the human world, and it's just a nice story we tell about peacocks that we then paste onto people.

  Your move.

