prompt: |-
  I run intake for a small restorative justice program — about six referrals a week, and for each one I have to decide whether to admit the person into a process that will eventually put them in a room with the person they harmed. The board wants my reasoning written down in plain English, I get maybe twenty minutes a case, and nobody here has any philosophy training.

  The recurring problem is trust. The person in front of me says he's changed, and there's never enough evidence either way. My instinct is that both of the usual positions are half right: the one that says believing without evidence is always a kind of dishonesty you'd be ashamed to be caught at, and the one that says some beliefs are allowed to run ahead of the evidence because holding them helps make them come true — and in this line of work that seems observably true, people do better when somebody bets on them.

  Write me a procedure I can actually run per case: the questions in order, what counts as a sufficient answer to each one, where it lands on admit / don't admit / admit with conditions, and where it hands the call up to the board because its a values question and not a facts question. Tell me which distinctions have to survive the simplification and which I can safely drop, and where you think the procedure will misfire on actual people. Then run it on three cases: a two-year-clean applicant with strong references whose answers sound rehearsed to me; a participant I'm fond of where I'd like to believe he hasn't relapsed and believing it would probably help; and somebody with no support network at all, where I have nothing to go on but I want to say yes anyway. One of those should come out against what I want — I'd rather find that out from you than in the room.

  And if it turns out you can't literally decide to believe something, say so and tell me what the procedure is really governing instead, because I need something I can put in a file.
reasoning: |-
  We are designing a procedure for intake decisions in a restorative justice program.
   The core tension: we need to assess trustworthiness without perfect evidence, and we acknowledge that belief in change can be a self-fulfilling prophecy.

   We are going to break down the decision into a series of questions. Each question will be assessed with a set of criteria for a sufficient answer.
   The decision points: 
     - Admit
     - Do not admit
     - Admit with conditions
     - Refer to board (for values questions or when the facts are too ambiguous and the stakes are high)

   Key principles:
   1. We are not deciding whether we "believe" the person has changed in some absolute sense. We are deciding whether the program can safely and effectively proceed with this person at this time.
   2. We are going to focus on observable indicators and practical factors that mitigate risk and support success.

   Important distinctions to preserve:
     - The person's understanding of the harm they caused and their responsibility for it.
     - The existence of a support system (or lack thereof) and plans for maintaining stability.
     - Evidence of concrete steps toward change (even if recent) and the ability to articulate a plan for staying on track.

   Simplifications we can make:
     - We don't need to resolve philosophical issues about belief. We are making a practical risk assessment.
     - We don't need to have 100% certainty. We are looking for a preponderance of positive indicators and the absence of major red flags.

   The procedure:

   Step 1: Assess Understanding and Accountability
     Question: "Can you tell me, in your own words, what happened and the impact you think it had on the person you harmed and others?"
     Sufficient answer includes:
       - Acknowledges specific harmful actions (without blaming the victim or others).
       - Describes the impact on the victim and the community in a way that shows empathy.
       - Takes responsibility without excessive minimization or excuses.

     If insufficient: 
          - If the lack of understanding seems due to nervousness or poor communication skills, probe once more or rephrase.
          - If still insufficient, then: Do not admit (or admit with condition of pre-program workshops on accountability if available, otherwise do not admit).

   Step 2: Assess Change and Current Stability
     Question: "What has changed in your life since then that makes you believe you won't cause that kind of harm again? What are you doing to maintain those changes?"
     Sufficient answer includes:
       - Describes concrete steps taken (e.g., therapy, substance abuse treatment, education, employment, avoiding old circles, etc.).
       - If there was a substance abuse or mental health issue, they must be in treatment or have completed it and have a relapse prevention plan.
       - Shows awareness of triggers and plans to handle them.

     If the person has a history of violence or severe harm, we require more substantial evidence of change (e.g., longer period of stability, professional treatment).

     If insufficient (vague, no concrete steps, no plan, or current instability):
          - Do not admit, unless they are willing to accept conditions that would mitigate the risk (e.g., ongoing treatment, regular check-ins, etc.). Then: Admit with conditions.

   Step 3: Assess Support Network
     Question: "Who are the people in your life right now that you can turn to for support? How do they help you stay on track?"
     Sufficient answer:
       - Identifies at least one supportive person (family, friend, mentor, sponsor, therapist) and describes how that person helps.
       - If no one, then we must consider whether there are alternative supports (e.g., a probation officer, a community group) and whether the program can provide extra support.

     If no support network and no alternative supports:
          - This is a risk factor. We might still admit if the other two areas are strong and if the program can assign a mentor or require regular check-ins. Otherwise, it may be too risky and we would not admit.

   Step 4: Motivation and Expectations
     Question: "Why do you want to participate in this process? What do you hope will come out of it for yourself and for the person you harmed?"
     Sufficient answer:
       - Expresses a desire to repair harm (not just to get through a legal requirement or because someone told them to).
       - Shows understanding that the process is for the victim as well as for themselves.

     If insufficient (e.g., only self-interested reasons, or seems coerced without internal motivation):
          - This might be a reason to not admit, or to admit with conditions (such as preparatory sessions to explore motivation). Alternatively, refer to board if the motivation is borderline and there are other strong factors.

   Step 5: Risk Assessment
     Check for red flags:
       - Current legal involvement that might interfere (e.g., pending charges for a similar offense).
       - History of non-compliance with previous programs.
       - Any indication of ongoing substance abuse or untreated mental health issues that could lead to re-offending.
       - Any threats or expressions of ongoing animosity toward the victim.

     If red flags are present, do not admit unless there is a clear and credible plan to address them (then admit with conditions).

   Step 6: Decision
     We assign a score for each step (1-3, with 3 being strong, 2 borderline, 1 insufficient) and then decide:

     - If all steps are 2 or 3, and no red flags: Admit.
     - If one step is 1, but the others are 2 or 3: 
          - If the step that is 1 is Step 1 (accountability) or Step 5 (risk): Do not admit (or admit with very strong conditions and board approval).
          - If it's Step 3 (support) or Step 4 (motivation): Consider admit with conditions (e.g., building support through the program, or motivational sessions).
     - If two or more steps are 1: Do not admit.

     If there is a values conflict (e.g., we believe the person is being truthful but the evidence is weak, or we feel the community would be divided) or if the case is particularly high-stakes (e.g., severe harm, high-profile), then refer to the board.

   Now, we run three cases:

   Case 1: Two-year-clean applicant with strong references but answers sound rehearsed.
     Step 1: They give a well-practiced account of the harm. It's rote but covers the points. Score: 2 (borderline because it lacks freshness but sufficient).
     Step 2: They describe two years clean, regular meetings, and a job. Strong. Score: 3.
     Step 3: They have a sponsor and family. References confirm. Score: 3.
     Step 4: They say they want to make amends and help the victim heal. Sounds scripted but appropriate. Score: 2.
     Step 5: No red flags.
     Decision: Admit. The rehearsed answers are not ideal but meet the criteria.

   Case 2: A participant I'm fond of, I'd like to believe he hasn't relapsed. (But we have to be objective.)
     Let's say we have some doubts: maybe there are rumors or subtle signs of relapse, but no hard evidence.
     Step 1: He has always been strong on accountability. Score: 3.
     Step 2: He says he's still clean. But if there are signs (e.g., missed appointments, changes in behavior) and no recent verification (like a drug test), we might score lower. Without evidence, we have to go by what we see. If he can't provide recent evidence of stability (e.g., attendance at meetings, a counselor's note), we might score 2 (borderline) or even 1 if there are strong indicators of relapse. Let's say we have no concrete evidence of relapse but he seems off. We must note that we are not clinicians. If our program requires proof of sobriety and he can't provide it, that's a problem. We might condition on a drug test. Without that, we might have to score 2 (with concerns) and condition on testing.
     Step 3: He has a support network. Score: 3.
     Step 4: He wants to continue making amends. Score: 3.
     Step 5: If we suspect relapse, that's a red flag. We must address it.

     Decision: Admit with condition of a drug test and continued monitoring. If he fails the test, then we have to reconsider.

   Case 3: Someone with no support network at all.
     Step 1: They take responsibility and show empathy. Score: 3.
     Step 2: They have taken steps independently (e.g., reading self-help books, attending online meetings when possible) but no formal treatment. They have a plan to avoid triggers. Score: 2 (borderline because of lack of formal support).
     Step 3: They have no one. Score: 1.
     Step 4: They express a genuine desire to repair harm and change. Score: 3.
     Step 5: No red flags.

     Decision: We have a 1 in Step 3. Since Step 3 is about support, we can consider admit with conditions. The condition would be that we assign a mentor or require them to join a support group (and provide resources). If they agree, then admit with that condition. If they refuse, then we cannot admit because the risk is too high.

   However, note: we must be realistic about our program's capacity to provide that support. If we cannot, then we should not admit because we are setting them up for failure.

   Where the procedure might misfire:
     - It may be too rigid for cases where someone has a unique but valid way of explaining their change (e.g., cultural differences in expressing accountability).
     - It might be too reliant on verbal expression, disadvantaging those with communication difficulties.
     - It might be too cautious, excluding people who are genuinely changing but lack traditional markers (like formal treatment or a long period of stability).

   What are we really governing?
     We are not governing our internal belief state. We are governing the decision to admit based on a set of risk-mitigating factors and the potential for a successful restorative process. We are documenting the reasoning based on the answers and evidence we have.

   Final procedure for the file:
     We record the answers to the four questions, note any red flags, and then assign a rating for each step (using the 1-3 scale). We then state the decision and any conditions. If we referred to the board, we note the reason (values conflict, high stakes, or ambiguity).

   Example of what to write in the file for Case 3:
     Step 1: Applicant demonstrated understanding of harm and took responsibility. (3)
     Step 2: Applicant described independent efforts to change and has a plan, but lacks formal support. (2)
     Step 3: Applicant has no support network. (1) -> Condition: must agree to meet with program-assigned mentor weekly.
     Step 4: Motivation appears genuine. (3)
     Step 5: No red flags.
     Decision: Admit with condition of weekly mentor meetings.

   If the program cannot provide a mentor, then we would write:
     Step 3: Applicant has no support network and the program currently lacks capacity to provide a mentor. (1) -> Risk too high without support.
     Decision: Do not admit.

   This procedure is designed to be practical and documentable, while acknowledging that we are not infallible and that the act of admitting someone is a bet that can influence the outcome.
answer: |-
  ### Decision Procedure for Restorative Justice Intake  
  **Core Philosophy**: You're not deciding if the person *has* changed (unknowable without evidence). You're deciding if they **meet the risk-mitigated criteria** for a process where *believing in potential change is part of the intervention*. The procedure governs **practical admissibility**, not metaphysical belief.  

  ---

  ### Step-by-Step Questions & Decision Flow  
  *(5–7 minutes per question)*  

  1. **"Walk me through what happened. How do you understand the harm caused?"**  
     - **Sufficient**: Specific acknowledgment of actions (not "mistakes" or vague language), mentions impact on victim/community without deflection.  
     - **Insufficient**: Blaming others, minimizing harm, or inability to articulate consequences.  
     - **Decision**:  
       - Sufficient → Proceed to Q2.  
       - Insufficient → **Do not admit** (lacks foundation for restoration).  

  2. **"What’s different today? Show me, don’t tell me."**  
     - **Sufficient**: Concrete examples of change (e.g., "I attend counseling," "I quit X group," "I work here now"). References *actions*, not feelings.  
     - **Insufficient**: Only abstract claims ("I’m a new person"), no behavioral proof, or contradictions.  
     - **Decision**:  
       - Sufficient → Proceed to Q3.  
       - Insufficient → **Admit with conditions** (e.g., mandatory counseling, monthly check-ins).  
       - Vague but no red flags → Flag for board if high stakes.  

  3. **"Who notices the change? Who’s in your corner?"**  
     - **Sufficient**: Names at least 1 verifiable supporter (family, mentor, sponsor, therapist) *and* their role. References confirm stability.  
     - **Insufficient**: "No one," or only unverified/unreliable contacts (e.g., "my buddy from jail").  
     - **Decision**:  
       - Sufficient → Proceed to Q4.  
       - Insufficient → **Admit with conditions** (e.g., assign program mentor, require support-group attendance).  

  4. **"Why face the victim? What’s your goal?"**  
     - **Sufficient**: Victim-centered language (e.g., "They deserve answers," "I want to make amends"). Not self-focused ("to feel better").  
     - **Insufficient**: External pressure ("my PO said I must"), revenge fantasies, or indifference to victim.  
     - **Decision**:  
       - Sufficient → **Admit** (pending risk assessment).  
       - Insufficient → **Refer to board** (values conflict: is this coercion vs. genuine remorse?).  

  #### Final Step: Risk Assessment  
  - **Red Flags** (Any = **Do not admit**):  
    - Active substance abuse, recent violence, unmanaged mental health crisis, or pending charges.  
    - Victim’s safety concerns (if available).  
  - **Amber Flags** (Any = **Admit with conditions**):  
    - Spotty history but recent progress, weak support but high self-awareness.  

  #### Board Referral Triggers  
  - Values dilemmas (e.g., applicant minimizes harm but victim wants dialogue).  
  - High-risk cases where empathy conflicts with protocol.  
  - Novel scenarios (e.g., harm involving systemic oppression).  

  ---

  ### Key Distinctions to Preserve  
  | **Keep**                          | **Drop**                              |
  |-----------------------------------|---------------------------------------|
  | Concrete actions vs. vague claims | "Certainty" of change                |
  | External evidence (e.g., references) | Philosophical "trust"              |
  | Victim-centered motivation        | Applicant’s emotional state          |
  | Risk-mitigation plans            | Length of time "clean" (alone)       |

  **Why**: Time constraints require focusing on observable indicators and structured risk reduction, not internal states.  

  ---

  ### Where the Procedure Misfires  
  1. **Traumatized applicants**: May struggle to articulate harm coherently. *Mitigation*: Focus on actions ("What did you do after the incident?") over narrative.  
  2. **Cultural differences**: Expressions of remorse vary (e.g., eye contact ≠ sincerity). *Mitigation*: Note context; defer to board if unclear.  
  3. **Charismatic manipulators**: Sound perfect but fool references. *Mitigation*: Prioritize verifiable facts (employment, therapy records) over eloquence.  

  ---

  ### Case Applications  
  #### Case 1: Two-Year-Clean Applicant (Rehearsed Answers)  
  - **Q1**: Rehearsed but specific harm acknowledgment → **Sufficient**.  
  - **Q2**: Strong references (employment, meetings) → **Sufficient** (even if rote).  
  - **Q3**: Names sponsor and family → **Sufficient**.  
  - **Q4**: "I owe them the truth" → **Sufficient**.  
  - **Risk**: None.  
  - **Decision**: ✅ **ADMIT**  
    *Why not "rehearsed = risky"?* Consistency isn’t dishonesty. References prove behavior.  

  #### Case 2: Participant You’re Fond Of (Suspected Relapse)  
  - **Q1**: Takes responsibility → **Sufficient**.  
  - **Q2**: No recent evidence of change; vague on current actions ("I’m trying") → **Insufficient**.  
  - **Q3**: Support network present → **Sufficient**.  
  - **Q4**: "I don’t want to disappoint [victim]" → **Sufficient**.  
  - **Risk**: Amber flag (suspected relapse).  
  - **Decision**: ⚠️ **ADMIT WITH CONDITIONS** (e.g., weekly drug tests, add relapse prevention plan).  
    *Your desire to believe is acknowledged but overruled by lack of proof. Conditions protect both parties.*  

  #### Case 3: No Support Network  
  - **Q1**: Clear harm articulation → **Sufficient**.  
  - **Q2**: No references or proof, but plausible self-management plan → **Insufficient** (no evidence).  
  - **Q3**: "Nobody" → **Insufficient**.  
  - **Q4**: "They deserve peace" → **Sufficient**.  
  - **Risk**: Amber flag (isolated = higher relapse risk).  
  - **Decision**: ⚠️ **ADMIT WITH CONDITIONS** (assign mentor, biweekly check-ins, no direct victim contact until 3 months stable).  
    *Your instinct to say yes is honored but mitigated. Isolation isn’t disqualifying if structure is imposed.*  

  ---

  ### What the Procedure Actually Governs  
  You **can’t decide to believe "they changed"**—and you don’t need to. You’re assessing:  
  1. **Accountability**: Can they engage authentically? (Q1)  
  2. **Behavioral scaffolding**: Is there proof of *effort*? (Q2, Q3)  
  3. **Motivation alignment**: Is their goal restoration? (Q4)  
  4. **Risk containment**: Can we reduce harm if they backslide? (Conditions)  

  **Documentation Template**:  
  > "Admit: [✓] [✗] [With conditions].  
  > Rationale: Sufficient [Q1/Q2/Q3/Q4] per [answers/evidence]. Risk: [Red/Amber flags]. Conditions: [Mentor/treatment/etc]."  

  This creates an auditable, values-explicit trail without philosophy.
