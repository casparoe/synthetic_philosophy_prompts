  ### Design for the Game: "The Uncertainty Exchange"

  **Overview**: A two-round betting game on correlated events with unknown dependence. Agents are assigned credal states (precise, interval-valued) and decision rules. The game surfaces ambiguity, dilation, decision paralysis, and rule-dependent choices. The bookie/market-maker (facilitator) uses a scoring ledger on the whiteboard. Poker chips represent points (no real money).

  ---

  ### **Roles and Materials**
  - **18 Participants**:
    - **Precise Agents (6)**: Assigned a single probability measure. Told: "Assume uniform prior over unknown correlation parameter."
    - **Interval-Valued Agents (6)**: Assigned a set of probability measures. Told: "You only know probability bounds, not a single value."
      - *Subgroups*: 
        - 3 use **Maximin** (choose action with best worst-case outcome).
        - 3 use **Maximax** (choose action with best best-case outcome).
    - **Special Agent (1)**: Precise marginal probabilities for events A and B, but indeterminate conditional P(A|B). Told: "You know P(A) and P(B) exactly, but P(A|B) is unknown."
    - **Bookie (1 - Facilitator)**: Runs the market, sets odds, records bets.
    - **Scoring Ledger Keeper (1)**: Updates the whiteboard with bets and scores.
  - **Materials**: Poker chips (300+), whiteboard (ledger: agent IDs, bets, scores), printed role sheets, pre-filled "mystery box" (simulates event generator).

  ---

  ### **Event Setup**
  - **Events**:
    - **A**: "Stock X closes above $100 tomorrow."  
    - **B**: "City Y has >1 inch of rain tomorrow."  
    - **Correlation**: Unknown dependence (e.g., does rain affect stock X?). Participants know P(A) = 0.5, P(B) = 0.5, but **P(A∩B) ∈ [0, 0.5]** (i.e., correlation unknown). *Avoids urns; uses real-world ambiguity*.
  - **Generator**: "Mystery Box" with 100 hidden tickets:  
    - 40: A∩B  
    - 10: A∩¬B  
    - 10: ¬A∩B  
    - 40: ¬A∩¬B  
    (True P(A∩B) = 0.4, but agents don’t know this. Draw one ticket at game start; reveal after bets.)

  ---

  ### **Payoff Scheme**
  - **Bet Types**: Bookie offers even-odds bets (1:1 payout). For event E:
    - **Bet for E**: Pay 0.5 chips upfront. Win 1 chip if E occurs, else 0.
    - **Bet against E**: Pay 0.5 chips upfront. Win 1 chip if ¬E occurs, else 0.
    - **Abstain**: Penalty of 0.1 chips (non-negotiable).
  - **Why this scheme?**:
    - Abstention cost (0.1 chips) is low enough to not force betting when ambiguous (e.g., interval includes 0.5) but high enough to penalize excessive inaction.
    - **Calibration**: 
      - If cost = 0, abstention dominates → proves economist right (paralysis).  
      - If cost > 0.2, imprecision punished arbitrarily → proves you right.  
      - 0.1 balances: Interval agents abstain when uncertain, precise agents bet at 0.5.
  - **Scoring**: Chips = points. Starting chips: 10/agent.

  ---

  ### **Game Rounds**
  #### **Round 1: Bet on Joint Event (A∩B)**
  - **Bookie offers**: Bet for/against A∩B at 0.5 chips, or abstain (cost: 0.1).
  - **Agent Decisions**:
    - **Precise Agents**: Compute E[P(A∩B)] = 0.25 → bet against A∩B (since 0.25 < 0.5).
    - **Interval Agents (Maximin)**: P(A∩B) ∈ [0, 0.5]. Worst-case loss:  
      - Bet for: Lose 0.5 if P=0 → worst -0.5.  
      - Bet against: Lose 0.5 if P=0.5 → worst -0.5.  
      - Abstain: Lose 0.1 → best worst-case.  
      → **Abstain**.
    - **Interval Agents (Maximax)**: Best-case gain:  
      - Bet against: Win 0.5 if P=0 → best +0.5.  
      → **Bet against A∩B**.
    - **Special Agent**: Same as interval (P(A∩B) ∈ [0,0.5]) → follows assigned rule.
  - **Ledger Update**: Record bets/abstentions.

  ---

  #### **Round 2: Conditional Bet (A given B)**
  - **First, reveal B** (e.g., "B occurred" based on ticket draw).
  - **Bookie offers**: Bet for/against A at 0.5 chips, or abstain.
  - **Agent Decisions**:
    - **Precise Agents**: P(A|B) = 0.5 → bet on A (indifferent; avoids abstention cost).
    - **Interval Agents**: After learning B, P(A|B) ∈ [0,1] (dilation!).  
      - **Maximin**: Worst-case loss if bet: -0.5. Abstention: -0.1 → **abstain**.  
      - **Maximax**: Best-case gain: +0.5 → **bet on A**.  
    - **Special Agent**: P(A) = 0.5 precise, but P(A|B) ∈ [0,1] → **dilates to [0,1]**, follows rule.
  - **Dilation Visible**: Interval agents announce intervals pre/post B:  
    - Pre-B: P(A) = 0.5 (point).  
    - Post-B: P(A|B) ∈ [0,1] (interval).  
    → *Widening shown on whiteboard*.

  ---

  #### **Reveal Outcomes & Settle Bets**
  - Reveal A and B (from ticket).
  - Update ledger: Apply payoffs (+1/-0.5 for bets, -0.1 for abstentions).

  ---

  ### **Key Moments Addressing Objections**
  1. **Paralysis Charge (1st Prong)**:
     - Maximin interval agents abstain in both rounds, paying 0.2 chips total.  
     - Precise agents bet actively.  
     - *Debrief point*: Paralysis avoids worst-case losses (e.g., if A∩B occurs, precise agents lose 0.5; maximin lose only 0.1). Still, abstention has a cost.

  2. **Widening Under Evidence**:
     - Round 2: Interval agents’ P(A) dilates from 0.5 to [0,1] after learning B.  
     - *Debrief*: Not a "bookkeeping accident"—correlation ambiguity makes P(A|B) unconstrained. Precise agents ignore this by averaging.

  3. **Same Credal State, Different Rules (2nd Prong)**:
     - Maximin vs. maximax interval agents:  
       - Round 1: Maximin abstains; maximax bets against A∩B.  
       - Round 2: Maximin abstains; maximax bets on A.  
     - Scores differ: Maximax risks more, gains/loses more.

  4. **Precise Agent "Picked Off" (Optional)**:
     - If A∩B occurs: Precise agents lose 0.5 (bet against), maximin lose only 0.1.  
     - Over repeated trials (if time), precise agents’ variance could deplete chips.  
     - *Honest statement*: This demonstrates **risk exposure from overcommitment**, not inherent superiority of imprecision. It’s a fact about scoring rules amplifying model error.

  ---

  ### **Debrief Structure**
  1. **Map Game to Concepts**:  
     - Sets vs. single measures: "Interval agents didn’t specify a prior; sets reflect known unknowns."  
     - Decision rules: "Maximin and maximax acted differently on the same beliefs."  
     - Widening: "Learning B increased ambiguity about A—dilation isn’t irrational, it’s honest."  
     - Paralysis: "Is avoiding bets cowardice or prudence when ambiguity is high?"  
  2. **Close on Open Question**:  
     - "When should rational agents use sets instead of priors? Does dilation reveal new uncertainty or poor modeling?"  

  ---

  ### **Predictable Failures & Fixes**
  1. **Participants Adopt Uniform Prior**:  
     - **Fix**: Role sheets forbid it. Precise agents must use given prior; interval agents cannot compute expectations.  
  2. **Interval Agents Lag on Arithmetic**:  
     - **Fix**: Cheat sheets: "Maximin: Choose action with best worst-case payoff. Maximax: Best best-case."  
  3. **Economist Derails or Loses Badly**:  
     - **Assign as Precise Agent**: Forces engagement. If he loses (e.g., A∩B occurs), it illustrates risk. If he argues, defer: "Play your role; we’ll discuss post-game."  

  ---

  ### **What the Game Cannot Replicate**
  - **Background Structure**: The facilitator (you) sets the generator, knows P(A∩B)=0.4, and chooses the ambiguity structure. This *does* imply a "true prior," as your economist insists.  
  - **Concession in Debrief**: "Yes, there’s a true state. Imprecise models represent ignorance, not ontology. But in real ambiguity (e.g., stock markets), no ‘facilitator’ exists—so is a single prior justified?"  

  ---

  ### **75-Minute Cut**
  - **Cut Repeated Rounds**: Run one trial only.  
  - **Simplify Roles**: Drop special agent; merge interval agents into maximin/maximax (no subgroup distinction).  
  - **Shorten Debrief**: Focus on dilation and rule divergence; skip paralysis depth.  
  - **Timing**:  
    - Setup: 10 min  
    - Round 1: 15 min  
    - Round 2: 15 min  
    - Settle & Debrief: 35 min  

  ---

  ### **Game Script Snippets**
  - **Start**: "We’re betting on real-world events. You’ll get a role: precise, interval, or special. Follow your rules."  
  - **Reveal B**: "B occurred. How does this change your belief about A? Interval agents, update your bounds."  
  - **End**: "Did dilation feel like discovery or mistake? Did anyone regret their decision rule?"  

  This design confronts both prongs objectively, forces engagement with ambiguity, and ends with the economist’s core challenge: *In a world without a facilitator, when is one prior enough?*
