answer: |-
  Here is a screening procedure designed for pragmatic use by your analysts, grounded in identifiable aspects of scientific maturity and epistemic vulnerability, while explicitly acknowledging its limitations. It avoids requiring philosophical expertise but leverages insights from historical theory change relevant to regulatory reliance.

  **Premise Check:** While *no procedure can infallibly predict which parts of a theory will be discarded*, the history of science reveals patterns about what tends to *survive* theory replacement and what makes claims *vulnerable*. This screening focuses on identifying claims with high *vulnerability to disruption* within the standard's timeframe, based on their epistemic characteristics and role. It systematizes judgment, not replaces it. It *cannot* assign probabilities of survival or identify *which specific component* will fail.

  ---

  **Theory-Claim Screening Procedure for Long-Lived Standards**

  **Purpose:** To assess the vulnerability of a specific scientific claim (C) within a theory (T) to being superseded or fundamentally undermined within a regulatory standard's design life (e.g., 25-50 years), thereby potentially invalidating the standard's basis or derived numbers. The goal is to flag claims where institutional reliance carries high epistemic risk.

  **Input:** A specific, clearly stated scientific claim (C) proposed to underpin a regulatory requirement or derived value (e.g., a mechanism, a dose-response relationship, a material property model).

  **Output:** One of three verdicts:
  1.  **SAFE:** Reliance on C in the standard is justified without specific mitigation *for epistemic vulnerability*. (C is judged highly robust/resilient).
  2.  **CONDITIONAL:** Reliance on C is acceptable only with explicit mitigations documented *within the standard itself* (e.g., a defined margin, a specific re-review trigger, or clear labeling of its conventional/conservative nature). Epistemic vulnerability is non-negligible.
  3.  **UNSAFE:** C is judged too vulnerable to disruption within the standard's timeframe. It should not carry significant load in the standard without major revision to the underlying science or the standard's structure. Alternative baselines or significantly different approaches should be sought.

  **Procedure (Analyst Runs Sequentially):**

  1.  **Clarify Claim & Role:** Precisely state claim C and its *specific function* within the standard (e.g., "Justifies release delay factor X", "Sets exposure limit Y", "Qualifies material Z"). Identify the *minimum requirement* for C: Does the standard need C to be *true*, or merely for predictions derived using C to remain *reliable/robust* even if C's underlying explanation changes? (*Kept Distinction: True vs. Robust Under Replacement*)
      *   *Judgment Call:* Analyst must interpret the standard's dependence on C.
      *   *Satisfactory Answer:* Clear statement of C and its role. Clear distinction between needing truth vs. predictive robustness.
      *   *Impact:* Needing only robustness lowers vulnerability.

  2.  **Assess Maturity & Embeddedness:**
      *   a) How long has C (or the core phenomenon it relies on) been *quantitatively confirmed* through observation/experiment? (<10 yrs, 10-25 yrs, >25 yrs)?
      *   b) How extensively is C supported by *independent lines of evidence/methods* (e.g., different experimental techniques, different theoretical approaches converging on the same result, consistent observational data from diverse sources)? (Minimal, Moderate, Extensive)
      *   c) Is C *central* to theory T (i.e., is T built *around* explaining C, or would rejecting C force major revision/abandonment of T?), or is C a *peripheral consequence* or *instrumental tool* used within T? (*Kept Distinctions: Maturity/Quantitative Confirmation; Embeddedness in Web of Evidence; Central vs. Peripheral/Presupposed/Instrumental*)
      *   *Judgment Call:* Analyst assesses duration, diversity of support, and centrality.
      *   *Satisfactory Answer:* Timeframe estimate. Description of supporting evidence diversity. Reasoning for centrality/peripherality.
      *   *Impact:* Long-standing (>25yrs), extensively supported by diverse evidence, and/or peripheral claims are less vulnerable. Young, minimally supported, central claims are more vulnerable.

  3.  **Evaluate Vulnerability Factors:**
      *   a) Are there *live, credible competing explanations* for the phenomenon C describes or the data C explains? (Yes/No/Unclear).
      *   b) Is C *directly observable/testable* at the relevant scale, or is it a *posited mechanism/entity* inferred to explain observations? (e.g., "corrosion layer thickness" vs. "quantum tunneling mechanism") (*Kept Distinction: Observable/Measurable vs. Posited/Inferred*).
      *   c) Does the *history of the relevant scientific field* show frequent major theoretical shifts/disruptions over the past 50 years? (Stable, Moderately Evolving, Rapidly Changing/Revolutionary).
      *   d) (*If no clear historical precedent exists for disruption in this field*): Is the claim C based on a *novel theoretical framework* or *emerging technology* where foundational understanding is still actively contested? (Yes/No). (*Handling Lack of Precedent*)
      *   *Judgment Call:* Analyst evaluates competition, observability, field stability, and novelty.
      *   *Satisfactory Answer:* Clear answers to a-d with brief justifications.
      *   *Impact:* Competing explanations, inferred mechanisms, rapidly changing fields, and novel/contested foundations increase vulnerability.

  4.  **Synthesize & Assign Verdict:** Weigh the answers from Steps 1-3 using the following guidelines:
      *   **SAFE:** Typically requires: C only needs robustness (Step 1); High Maturity/Embeddedness (Step 2a,b); Low Vulnerability Factors (Step 3: No live competition, Highly Observable, Stable field history, Not novel/contested).
      *   **CONDITIONAL:** Applies when there is significant tension or mixed signals. Common paths:
          *   C needs truth (Step 1) but has good maturity/embeddedness (Step 2) and moderate vulnerability (Step 3).
          *   C only needs robustness (Step 1), but has low maturity (Step 2a) or significant vulnerability factors (Step 3 - e.g., live competition, inferred mechanism).
          *   Field history is unknown, but C is central and based on novel theory (Step 3d).
      *   **UNSAFE:** Typically indicated by: C needs truth (Step 1) *AND* has low maturity/embeddedness (Step 2a,b - e.g., <10 yrs, minimal independent support) *AND* high vulnerability factors (Step 3 - e.g., live competition, inferred mechanism, rapidly changing field, novel contested foundation).
      *   *Judgment Call:* Analyst synthesizes the profile into a verdict. *Crucially, if the field offers no precedent (Step 3c) and C is central to a novel framework (Step 3d), vulnerability is inherently high – do not default to SAFE.*
      *   *Satisfactory Answer:* Clear verdict (SAFE, CONDITIONAL, UNSAFE) with a concise rationale referencing key factors from Steps 1-3.

  **Dropped Distinction:** The precise philosophical separation of "what is retained vs. discarded" in theory change. While the factors above (observability, robustness, maturity) align with what *tends* to survive, attempting a strict categorical separation is too nuanced and context-dependent for this screening. The procedure focuses on vulnerability indicators instead.

  ---

  **Application to Example Claims:**

  **(a) Corrosion Product Layer Passivation & Self-Limiting Growth (Justifies long release delay)**
  1.  **Clarify:** Claim C: Formation of specific passivating layer on canister material that self-limits corrosion growth, causing long release delay. *Role:* Derives release delay time. *Need:* Primarily needs *robustness* – the *effect* (slow, predictable corrosion rate) must hold. The exact molecular mechanism matters less than the observed rate stability.
  2.  **Maturity & Embeddedness:**
      *   a) Phenomenon observed & qualitatively understood for >100 years for many metals; quantitative models for specific alloys likely >25-50 yrs. **High Maturity.**
      *   b) Supported by metallurgy, electrochemistry, direct microscopy, long-term tests, field observations on analogous structures. **Extensive Independent Evidence.**
      *   c) Central to *corrosion science models for this alloy*, but the *phenomenon* of passivation is a bedrock observation. **Moderate Centrality (more to specific model than core theory).**
  3.  **Vulnerability:**
      *   a) No major *credible* competing explanations for passivation *effect* in this context. Minor mechanistic debates exist but don't challenge the core phenomenon. **No Live Competition (for effect).**
      *   b) Layer formation, thickness, composition, and *growth rate* are directly measurable/observable. **Highly Observable/Measurable.**
      *   c) Corrosion science evolves but is largely incremental; foundational concepts stable for decades. **Stable Field History.**
      *   d) N/A.
  4.  **Synthesis & Verdict:** High maturity, extensive evidence, robustness need, high observability, stable field. Very low vulnerability to disruption of the *effect* justifying the delay. **VERDICT: SAFE** *However, given its critical role, a CONDITIONAL verdict with a triggered re-review (e.g., if new evidence challenges the *stability* of the specific layer under repository conditions) could be prudent.*

  **(b) Linear No-Threshold (LNT) Dose-Response Default (Conservative convention for intake pathway)**
  1.  **Clarify:** Claim C: The assumed dose-response relationship is linear with no threshold. *Role:* Sets conservative exposure limit for regulatory purposes. *Need:* Explicitly **does NOT need to be *true***. It functions as a *conservative convention* or *policy tool*. The standard only needs the *predictions* derived using LNT to be *conservative* relative to the (unknown) true risk across the dose range. **Robustness Under Replacement is IRRELEVANT; it's a deliberate choice.**
  2.  **Maturity & Embeddedness:** (Irrelevant to its role as convention. For completeness: LNT concept old; quantitative support for low-dose shape contested; evidence diverse but inconclusive at very low doses).
  3.  **Vulnerability:** (Irrelevant to its role as convention. Vulnerability lies in *policy* challenge, not scientific disruption per se).
  4.  **Synthesis & Verdict:** The claim is *not* being relied upon as a *scientific truth* but as a *regulatory convention*. Its scientific vulnerability is therefore **not the primary concern** for epistemic risk to the standard's basis *in its intended role*. The risk is policy/political change, not scientific supersession. **VERDICT: CONDITIONAL** *BUT with the critical mitigation: The standard MUST explicitly label this as a "conservative regulatory default assumption" or "policy convention" and NOT present it as the confirmed scientific mechanism. Its conventional nature must be integral to how it carries load.*

  **(c) Novel Phenomenon (Characterized last decade, lab-reproduced, live competing explanations)**
  1.  **Clarify:** Claim C: [Specific Phenomenon P] occurs and is responsible for [Effect E] relevant to the standard. *Role:* [e.g., Underpins a key degradation rate or failure mode calculation]. *Need:* Likely requires the phenomenon P to be *true* and operate as described to justify the derived number/requirement. Robustness under replacement unlikely if competing explanations differ fundamentally.
  2.  **Maturity & Embeddedness:**
      *   a) Characterized only in last decade (<10 yrs). **Low Maturity.**
      *   b) Reproducible in lab (good) but likely limited independent lines of evidence (e.g., maybe only one type of experiment/model). **Minimal-Moderate Independent Evidence.**
      *   c) Likely **Central** to the new theory/model proposing it. Rejecting P might invalidate or force major revision of that model.
  3.  **Vulnerability:**
      *   a) **Explicitly stated: At least one competing explanation still live.** **Yes - High Vulnerability.**
      *   b) Is P directly observable, or an inferred mechanism? (Likely **inferred** if competing explanations exist). **Inferred Mechanism - Vulnerability.**
      *   c) Field history: If this is a rapidly evolving area (e.g., nanomaterials, complex biogeochemistry), **Rapidly Changing.** If a mature field with a surprising new find, **Moderately Evolving.** (*Judgment Call - Assume Moderate/Rapid for novelty*).
      *   d) **Yes - Based on novel findings/theory where foundation is contested.**
  4.  **Synthesis & Verdict:** Low maturity, limited independent evidence, needs truth, live competition, inferred mechanism, novel/contested area. **High vulnerability** to being superseded, refined, or invalidated within the standard's timeframe. Relying on it to carry significant load risks the standard being fundamentally undermined. **VERDICT: UNSAFE.** *This claim should not be the primary basis for a long-lived standard requirement without significant mitigation (e.g., treating it as a bounding case with large margins, requiring near-term validation milestones, or finding a more established baseline). The budget impact for redrafting is secondary to the institutional risk of basing a flagship standard on such vulnerable science.*

  ---

  **Statement of Limitations**

  This screening procedure is a tool for *epistemic vulnerability assessment*, not a guarantee or precise predictor. Key limitations:

  1.  **No Survival Probability:** It cannot and does not assign a numerical probability that claim C will survive unchanged for X years. It identifies factors making C *more or less vulnerable* to disruption.
  2.  **No Precise Failure Identification:** It cannot identify *which specific component* of a theory or claim will be discarded if disruption occurs. It assesses the vulnerability of the *specific claim C* as presented.
  3.  **Judgment-Based:** It relies on analyst judgment at multiple points (maturity, centrality, credibility of competition, field stability). Training and calibration are essential.
  4.  **Historical Analogy Limitation:** While history guides the factors, past patterns do not strictly dictate future scientific development, especially in novel fields.
  5.  **Focus on Epistemic Risk:** It primarily addresses risk from the *scientific claim being superseded*. It does not directly address other risks (e.g., new exposure pathways, unforeseen material interactions, implementation errors, political changes) unless they stem directly from the specific claim's vulnerability.
  6.  **Not a Substitute for Peer Review:** It complements, but does not replace, thorough scientific peer review of the underlying evidence for C. It focuses on the *long-term resilience* of the claim within the institutional context of a standard.
  7.  **Mitigation Design:** While it flags the need for mitigation (CONDITIONAL/UNSAFE), detailed mitigation design (e.g., margin size, specific re-review triggers) is outside its scope and requires separate engineering/regulatory judgment.

  This procedure provides a structured, defensible way to scrutinize the long-term epistemic risks of building standards on specific scientific claims, forcing explicit consideration of factors history shows correlate with vulnerability to scientific change. It adds necessary rigor to the reliance decision beyond immediate peer review consensus.
