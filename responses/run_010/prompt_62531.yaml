  Let's simplify the Production Phase:
  - Remove the IOU system. Instead, allow players to collaborate freely. The rule: if a player helps another, the helper must write down on a separate card what they did to help and the recipient must sign it. Each such help card is worth 1 extra point for the helper at the end (to incentivize helping). But then we're rewarding labor. And the recipient gets the benefit of the help. This might create a dynamic where some players are doing more labor.

  But we want to mirror the servant's labor. So let's try:

  Production Phase:
  - Each player creates their own medal design. They can choose to work alone or ask for help. 
  - If they ask for help, the helper can choose to help or not. If they help, they must spend at least 1 minute helping (so they have less time for their own). 
  - There is no explicit payment, but in the Validation Phase, players might feel obliged to give chips to those who helped them.

  But this is unstructured. Instead, we can make the help a formal action:

  - Each player has two actions in the Production Phase: 
    Action 1: Work on your own design (spend 1 action to make progress on your own).
    Action 2: Help another player (spend 1 action to improve another player's design by one level, but you cannot help yourself).

  But that might be too board-gamey and we don't have time.

  Given time constraints, we drop the IOU system. Instead:

  Production Phase (15 min total):
  - 10 minutes: players work independently on their medal design and justification. They can talk to each other and ask for advice. There is no formal exchange of chips for help, but players are free to negotiate (e.g., "If you help me, I'll give you a chip later"). They can write down promises if they wish, but the game does not enforce them. (This mirrors real social dynamics and the potential for broken promises.)

  Validation Phase (15 min):
  - Players present their designs (1-2 min each).
  - Then, each player must give out their three chips (one of each color: red, blue, white) to other players. They cannot give more than one chip to the same player? Actually, they must give each chip to a different player? In a 4-player pod, they have three chips and three other players, so they give one chip to each of the other three. In a 3-player pod, they have three chips to give to two other players: they must give at least one to each, and then one extra to one of them (so they give two chips to one player and one to the other). But then one player might get two from the same giver? That's acceptable.

  Scoring:
  - After all chips are distributed, players reveal their "Valued Other" card.
  - For each chip a player has, they check the giver: if the giver is NOT the player they valued, then the chip counts. If the giver is the one they valued, it doesn't count.
  - They add up the points (red=1, blue=2, white=3) from the valid chips.
  - They also get 1 point for each time they helped someone else (if they have a signed help card from the Production Phase). But wait, we didn't introduce help cards. Let's do:

  Help Cards (optional):
  - During the Production Phase, if a player helps another, the helper gets an index card and writes: "I helped [Recipient's Name] with [brief description]." The recipient signs it. Each signed help card is worth 1 point at the end.

  But this might be too much. We can skip it and rely on the chip scoring to drive the point.

  Scoring without help cards:
  - Only the chips from non-valued others count.

  Participation Points:
  - The TA awards participation points (0-2) based on engagement in the game, not on the score. So even if a player has a low score, they can get full points by participating.

  Timeline:

  0:00 - 0:05 (5 min): Setup
  - Divide into pods (6 pods of 4).
  - Explain rules: 
    - "This is a game about creating something and getting validation from others. You'll each design a medal and then award chips to each other. But first, write secretly the name of one person in your pod whose opinion you value the most. Keep this card face down until the end."
    - "Then, you'll have 10 minutes to design a medal on an index card. You can ask others for help, and you can negotiate with them (like promising to give them a chip later)."
    - "After that, you'll have 5 minutes to write a justification on the back of your card."
    - "Then, each of you will present your medal and justification (1-2 minutes each)."
    - "After presentations, each player gets three chips: one red (1 point), one blue (2 points), one white (3 points). You must give each chip to a different player (in a 4-person pod, you give one to each of the other three). In a 3-person pod, you give one to each of the other two and then one more to one of them (so one gets two chips from you)."
    - "Then, we'll reveal your 'Valued Other' cards. Your score is the sum of the points from chips you received from players you did NOT value. Chips from your Valued Other don't count."

  0:05 - 0:20 (15 min): Production Phase (10 min design + 5 min justification)
  - Students work. TA circulates to answer rules questions and ensure they are on task.

  0:20 - 0:35 (15 min): Validation Phase
  - Each pod does presentations (about 8 min for 4 players: 2 min each).
  - Then, distribute chips (5 min). TA reminds: "Remember to give one chip to each of the other players? No, in a 4-player pod, you have three chips and three other players, so you give one chip to each. In a 3-player pod, you give one to each of the other two and then one more to one of them."

  0:35 - 0:45 (10 min): Scoring and Reveal
  - Students reveal their Valued Other card.
  - They calculate their score: for each chip, if the giver is not their Valued Other, add the points.
  - They write their score on a card and hold it up? Or just note it.

  0:45 - 1:15 (30 min): Debrief
  - TA leads a discussion using the game experience to illustrate Hegel's points.

  Debrief Structure:
  - Start with the feelings: "What did it feel like to design the medal? To get help? To give help? To present? To give chips? To get chips?"
  - Then the reveal: "What happened when you saw that the chips from the person you valued didn't count? How did that feel?"
  - Then map to Hegel:
    - "In the game, when you were helping others, you were spending your time and energy. How did that affect your own design? Or your sense of the other person?" (Labor as formative)
