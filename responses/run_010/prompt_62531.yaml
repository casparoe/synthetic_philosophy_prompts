     - A player who avoids helping others and focuses on their own design, then wins by getting many chips. But the chips from their Valued Other don't count, so they might not win. Also, if they didn't help, they didn't build social capital. In the debrief, point out that even if they got many chips, if they were from their Valued Other, they don't count. So they might have a low score. Also, the emptiness of winning without having done labor can be discussed: "How did it feel to win without having interacted much?" -> It might feel hollow.

