  - Then, draw the parallels:
    - The Valued Other represents the master's perspective: the one whose recognition is sought. But the validation that counts comes from those who are not valued, mirroring the servant's recognition of the master (which the master doesn't value but actually depends on).
    - The labor (helping) was optional, but those who did it might have built relationships or skills. And the person who received help is now in debt (socially) to the helper, even if not in the game points.
