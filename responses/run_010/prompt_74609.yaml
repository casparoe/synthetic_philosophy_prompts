  Spec, if you can hit it:

  The case. Two paragraphs max. Ordinary setting — a flea market, a food cart, a raffle table at a department event, whatever — but nothing sci-fi, no perfect predictors, no demons, dollar amounts a broke grad student would actually handle. The victim, call her Maya, has a complete and transitive preference ordering over final outcomes (bundles of goods plus cash), and I want that ordering written out explicitly, not just asserted. What Maya does *not* have is contraction consistency: she violates Sen's α. Her choice from a menu depends on what else is on the menu — compromise effect, a decoy, some framing mechanism you like — so she takes A from {A, B} and takes B from {A, B, C}, while still ranking A over B when the two are compared head to head. The counterparty controls the menu: they can add and withdraw options at will, at announced prices, with an announced handling fee.

