  ### The Case: The Book Fair  
  Maya, a graduate student, attends a department book fair with $30. She values books solely for resale: *Logic* resells for $15, *Rhetoric* for $10. Her **complete, transitive preference** over final outcomes (book holdings plus cash) is determined by total resale value plus remaining cash. Ordering:  
  1. Both books + $5 (resale $25 + cash $5 = $30)  
  2. *Logic* + $20 (resale $15 + cash $20 = $35)  
  3. *Rhetoric* + $20 (resale $10 + cash $20 = $30)  
  4. Both books + $0 (resale $25 + cash $0 = $25)  
  5. *Logic* + $5 ($20)  
  6. *Rhetoric* + $5 ($15)  
  7. No books + $30 ($30)  
  ... and similarly ranked.  

  Maya exhibits **menu dependence** via the attraction effect. Vendor Lars exploits this:  
  - Offered {*Logic* for $10 (yielding *Logic* + $20), *Rhetoric* for $10 (yielding *Rhetoric* + $20)}, she chooses *Logic* + $20 (prefers $35 > $30).  
  - Offered {*Logic* for $10, *Rhetoric* for $10, **both for $25** (yielding both + $5)}, she chooses both + $5. *Why?* Lars frames the bundle as "only $5 more than *Logic* alone!"—making it appear superior to *Rhetoric*, a decoy enhancing the bundle’s appeal. Thus:  
    - From {*Logic*, *Rhetoric*}, she takes *Logic*.  
    - From {*Logic*, *Rhetoric*, bundle}, she takes the bundle.  

  ### The Money Pump  
  **Start**: Maya has $30, no books.  
  1. **Stage 1**: Lars offers {*Logic* for $10, *Rhetoric* for $10}. Maya chooses *Logic* for $10.  
     *Now*: *Logic* + $20.  
  2. **Stage 2**: Lars offers:  
     - Keep *Logic* (no cost).  
     - Buy *Rhetoric* for $5 more (total spent $15, yielding both + $5).  
     - "Decoy": Buy *Rhetoric* alone for $10 (requires returning *Logic*—net *Rhetoric* + $20).  
     Menu: {Keep (*Logic* + $20), Bundle (both + $5), Decoy (*Rhetoric* + $20)}. Maya chooses bundle, pays $5.  
     *Now*: Both books + $5.  
  3. **Stage 3**: Lars offers to buy *Logic* for $10. Maya accepts (no book is worth less than resale value).  
     *Now*: *Rhetoric* + $15 ($5 cash + $10 from sale).  

  **Ledger**:  
  - Start: $30, no books.  
  - Stage 1: Pays $10 for *Logic* → *Logic* + $20.  
  - Stage 2: Pays $5 for *Rhetoric* → both + $5.  
  - Stage 3: Sells *Logic* for $10 → *Rhetoric* + $15.  
  **End**: *Rhetoric* + $15. Compared to start (no books + $30), she holds *Rhetoric* (resale $10) + $15 = total $25, **$5 worse off** than initial $30. Goods match start (no *Logic*), but cash depleted.  

  ### The Check  
  **Static coherence holds**:  
  - **Transitivity**: Both + $5 ($30) ≻ *Logic* + $20 ($35)? No: $35 > $30 numerically, but preferences are lexicographic: monetarily equivalent outcomes (*Logic* + $20 = $35, both + $5 = $30) are ranked by cash. *Logic* + $20 ($35) ranks above both + $5 ($30) in the ordering. Cycle?  
    - *Logic* + $20 ($35) > both + $5 ($30) by dominance.  
    - both + $5 ($30) > *Rhetoric* + $15 ($25) by dominance.  
    - *Logic* + $20 ($35) > *Rhetoric* + $15 ($25) by transitivity.  
    No cycle.  
  - **No intransitive preference**: Head-to-head, she always prefers higher monetary value. The pump exploits **menu-dependent weighting**: in {*Logic*, *Rhetoric*, bundle}, the bundle’s "discount" frame overrides strict value comparison.  

  ### Which Feature Does the Work?  
  **Menu control is essential**. If Lars cannot alter menus:  
  - At {*Logic*, *Rhetoric*}, she takes *Logic* and leaves.  
  - At {*Logic*, *Rhetoric*, bundle}, she takes the bundle immediately.  
  No pump occurs. Without menu shifts, the intransitivity is irrelevant because the static preference is coherent. The case evaporates.  

  ### Sophistication  
  - **Naive Maya** (no foresight): Pump works as above.  
  - **Sophisticated but non-resolute** (foresees traps but cannot precommit): At Stage 1, she anticipates being pumped if she buys *Logic*. She avoids by taking *Rhetoric* or nothing—**pump fails**.  
  - **Resolute** (binds to a plan): She commits to never buy *Rhetoric* later. At Stage 2, she keeps *Logic*, ignoring the bundle. **No leakage**.  
  **Conclusion**: Only naive agents are pumped. Sophistication/resolution blocks exploitation.  

  ### Her Counterattacks  
  1. **"Rationalize over menus"**: Concede that if preferences are defined over *choice contexts*, coherence holds. But the pump proves Maya **incurs real losses** by violating outcome-based rationality. The claim survives: *given outcome-based preferences*, menu dependence causes dynamic incoherence.  
  2. **"Context effects are noise"**: Concede that stochastic choices might nullify strict incoherence. But the example is deterministic—Maya *systematically* chooses dominated options when menus shift. The agent is present and irrational *by her own outcome standard*.  

  **Final Claim**: Static coherence doesn’t immunize against dynamic exploitation when menu effects override outcome valuations. Lars’s pump extracts $5 via pure framing, leaving preferences intact.
