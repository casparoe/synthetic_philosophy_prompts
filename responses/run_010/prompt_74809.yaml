  ### On Conditionals  
  If Oswald did not fire the fatal round,  
  Then someone else must have prepared the gun—  
  For once the lethal certainty is found,  
  We trace the consequence from action done.  
  The victim fell; the deed is fixed in time.  
  So if his hand withheld the shot, we know  
  Another's took the task as reason's rhyme,  
  And history records that lethal blow.  

  But change the mood: if he had never aimed,  
  Would other hands enact the death we dread?  
  We doubt—for in that world, the plot untamed  
  Might fray, the moment pass, the threat lie dead.  
  The closest sphere where rifles stay unshot  
  May spare the target from the fatal lot.  

  ---

  ### Explanation  
  I committed to the suppositional account of indicative conditionals, treating them as expressions of conditional probability under the antecedent rather than truth-functional entailments. The poem takes liberties in lines 7–8 ("reason's rhyme" and "history records") by implying causal necessity, whereas the suppositional view strictly concerns epistemic readiness to infer the consequent. The couplet survives the rival truth-functional reading: it avoids addressing indicatives' truth conditions by shifting focus to counterfactual semantics, where "closest sphere" implicitly invokes similarity-based worlds without naming machinery. A Stalnakerian would endorse the sestet's "closest sphere" framing, while a Lewisian might dispute "the" in line 13, demanding contextually variable worlds—but both rivals accept the couplet’s core claim. The line falsified on truth-functional accounts is the indicative itself (line 2): if Oswald *did* shoot (making the antecedent false), truth-functionalism deems the conditional vacuously true, but the poem presents it as a substantive inference from supposition, which truth-functionalism cannot explain.
