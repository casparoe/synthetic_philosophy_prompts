   - Rhyme scheme: The octave has two rhyme sounds (let's say A and B) in a pattern (e.g., ABBAABBA). The sestet must reuse the same two rhyme sounds but in a new order (so we might have, for example, ABAABB or some other pattern using only A and B). This reuse without introducing new sounds is important to show the same material used differently.
   - Content:
     - Octave: Presents the Oswald case in the indicative mood: "if he didn't shoot Kennedy, someone else did." This is acceptable to anyone who believes Kennedy was shot by somebody.
     - Sestet: Presents the same content in the subjunctive (counterfactual) mood: "if he hadn't [shot Kennedy], someone else would have." This is almost never accepted.
   - Volta: The turn should highlight that the two conditionals differ only in mood. The indicative is not describing a truth that holds in every world where the shooting didn't happen (as a truth-functional account might wrongly suggest) but is about what one is prepared to say upon supposing the antecedent. The counterfactual, however, depends on how the nearest world where the antecedent is true turns out.
   - Pressure: The indicative tracks something like the probability of the consequent given the antecedent, while the counterfactual answers what would happen in the nearest antecedent-world.
   - Constraints: 
       - No naming of theories, authors, or possible-worlds machinery in the poem.
       - The couplet must not deliver a verdict on whether indicatives have truth conditions.
       - A knowledgeable reader should be able to tell which account of conditionals the poem is written from and which line would be false on the main rival account.

   After the poem, we must provide 4-5 sentences that:
       - State which account of the indicative we committed to.
       - Note where the verse takes liberties with it.
