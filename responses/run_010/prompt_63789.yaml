prompt: |-
  I am writing a novel set during and after an invented war, and I need help keeping one character's mind consistent with itself. He is a retired judge advocate giving evidence to a parliamentary inquiry; the chairman keeps putting cases to him, and he has become, against his will, the book's moral authority. His verdicts so far, all delivered in earlier chapters:

  1. A nineteen-year-old conscript on the aggressor's side, raised on the story that the invasion was a rescue of kin across the border, who killed three defending soldiers in open country: nothing he could be condemned for, and no complaint had he been killed doing it.
  2. A career officer on the same side who knew from the first week that the war was a land grab and stayed for the promotion, killed by a sniper while directing a barrage: the judge dismissed his family's claim on the ground that he had forfeited it, and added that the sniper had done nothing wrong.
  3. A farmer on the defending side with no uniform, no commander and no orders, who shot a soldier: a combatant, not a murderer.
  4. An unarmed surgeon attached to the aggressor's forces who shot a soldier in the act of executing his patients: permissible.
  5. A conscript of the aggressor who deserted after being told his parents would be shot if he stayed: not to be punished, and whatever the two men he killed before deserting were owed, he owed nothing.
  6. A drone operator on the defending side, four thousand kilometres away, who destroyed a fuel tanker moving petrol to the aggressor's bomber groups the night before a sortie: permissible.

  The chapter I cannot finish turns on the case the judge reserved. It concerns a captain in the aggressor's air force logistics directorate, posted in the capital, four hundred kilometres from any front, unarmed and never likely to fire a shot, who schedules the rail movements that keep the bomber groups flying. He is not deceived about what the bombers do. He could transfer to a training school or take early release into the state railways at some cost to his pension and no cost to his safety. A partisan cell proposes to shoot him on his way home.

  Tell me what the judge should rule if he is to be consistent with himself. Specifically: the two or three doctrines that accommodate verdicts 1 through 6 equally well; what each of them says about this captain, and about the partisan who would kill him; which doctrine you think he is actually running and why; one further case of your own devising that would separate the doctrines that happen to agree about him; and, last, the two or three sentences the judge would say aloud in the inquiry room — plain enough for the public gallery, exact enough that a reader who knows this literature would recognise precisely what he has just committed himself to.
reasoning: |-
  Okay, the user is writing a novel and needs help with a character's moral consistency. The character is a retired judge advocate acting as a moral authority in a parliamentary inquiry about war crimes. The user provided six prior verdicts from earlier chapters, and now they're stuck on the seventh case involving an air force logistics captain. The judge needs to rule consistently on whether partisans can assassinate this captain.

  First, I need to analyze the six existing verdicts to identify underlying principles. Let me list them again: 

  1. A conscript killing soldiers in open combat: no condemnation.  
  2. A knowing career officer killed by a sniper: forfeited rights, sniper not wrong.  
  3. A civilian farmer shooting a soldier: combatant, not murderer.  
  4. A surgeon shooting to protect patients: permissible.  
  5. A conscript deserting under duress after killing: not punishable.  
  6. A drone operator destroying enemy fuel: permissible.  

  Hmm, common threads... All verdicts focus on the actor's role, knowledge, and alternatives. The judge seems to care about whether someone is a combatant (directly participating) or has meaningful choices. For example, the conscript in #1 had no real choice, while the officer in #2 did. The farmer (#3) and surgeon (#4) acted in immediate defense. The deserter (#5) was coerced. The drone operator (#6) targeted legitimate military logistics.  

  For the captain case: He's scheduling rail movements for bombers, knows it's wrong, has safer alternatives (transfer/early release), but isn't pulling a trigger. How would the judge apply the same logic? If combatant status depends on direct contribution to violence, maybe he's not a valid target? But #6 approved attacking logistics (fuel tanker), which is similar. Key difference: the drone hit equipment, not a person. The captain is a person making decisions.  

  Possible doctrines:  
  - **Functional Contribution Doctrine**: Focuses on whether one's role sustains combat operations directly. The fuel tanker was a valid target (#6), so the captain enabling bombings might be too. But killing him vs destroying property?  
  - **Moral Agency Doctrine**: Emphasizes personal choice and moral responsibility. The captain chooses to stay despite options, so he's complicit.  
  - **Direct Harm Principle**: Only those directly inflicting harm or in combat roles are liable. The captain isn't armed or near combat, so maybe not.  

  Wait, verdict #2 condemned the officer for staying for promotion, knowing the war was wrong. Similar here—captain knows and stays for pension. Consistency suggests partisans killing him might be permissible. But #6 targeted equipment, not a person. Assassination is different.  

  The judge might say the captain is a combatant by function (like the drone operator) and thus a valid target. But the surgeon (#4) was non-combatant until he took direct action. The captain hasn't taken direct violent action.  

  Need to resolve this tension. Perhaps the key is "direct participation in hostilities." Under international humanitarian law (IHL), logistics can be part of that. The judge's prior rulings hint at broad combatant definition (#3 farmer, #6 drone operator).  

  For the doctrines:  
  1. **Functional Contribution**: Anyone integral to war effort is targetable. Captain yes, partisan killing justified.  
  2. **Moral Agency**: Emphasizes knowledge and choice. Captain liable due to willing participation.  
  3. **Direct Personal Harm**: Only those causing immediate harm. Captain not targetable.  

  Doctrines 1 and 2 align here (captain targetable), while 3 doesn't. To separate them, devise a case like a propagandist: under Functional Contribution, not targetable if not directly sustaining operations; under Moral Agency, if they knowingly incite violence and have alternatives, they might be liable.  

  The judge likely uses Moral Agency, given verdict #2 (officer condemned for knowledge and choice) and #5 (conscript excused due to duress). Consistency points to condemning the captain.  

  Judge's statement: "The captain chose to enable atrocities despite alternatives. By maintaining the bombers' lifeline, he became part of their violence. His death, while grievous, would not be murder." This commits to Moral Agency.  

  User also wants plain but exact language. The statement should reference "sustaining combat operations" and "voluntary service," echoing IHL terms like "direct participation" without jargon.
answer: |-
  Based on your judge's prior rulings and the need for internal consistency, here's the breakdown for the captain and the partisan, along with the underlying doctrines, a test case to differentiate them, and the judge's likely pronouncement:

  **Core Principles Extracted from Verdicts 1-6:**
  1.  **Status/Function Over Form:** What matters is the *role* and *effect* an individual has within the conflict, not just their uniform, rank, or location (Verdicts 3, 4, 6).
  2.  **Knowledge & Intentionality:** Awareness of the nature of the conflict and one's contribution to its wrongful acts is crucial for assigning liability or excusing actions (Verdicts 2, 4, 5).
  3.  **Meaningful Choice:** The existence of viable alternatives without severe duress (like death to oneself or family) is key to assigning responsibility (Verdicts 2, 5).
  4.  **Direct Contribution to Hostilities:** Liability arises from actions that directly sustain or inflict violence within the armed conflict, even if geographically distant or non-combatant in the traditional sense (Verdicts 2, 3, 4, 6).
  5.  **Moral Symmetry:** Acts necessary for legitimate defense or resistance against aggression are generally permissible, even lethal ones, within the bounds of proportionality and discrimination inherent in the conflict (Verdicts 1, 3, 4, 6).

  **Doctrines Accommodating Verdicts 1-6:**
  1.  **The Functional Contribution & Moral Agency Doctrine (FC/MA):**
      *   **Focus:** Liability hinges on whether an individual *functionally contributes* to the war effort *and* possesses the *moral agency* (knowledge + meaningful choice) to avoid that contribution.
      *   **Captain:** He is liable. His role is *essential* and *direct* in sustaining the bomber campaign (functional contribution). He knows the nature of the bombing (likely war crimes/civilian targeting) and has meaningful, non-lethal alternatives (transfer, early retirement with pension impact only) (moral agency). He chooses to continue enabling atrocities.
      *   **Partisan:** Permissible. Targeting a person who is functionally contributing to the enemy's core combat capability (logistics for bombers) and possesses moral agency is a legitimate act of resistance against aggression. It discriminates (targets a specific combatant function) and is proportional (eliminating a key enabler).
  2.  **The Expanded Direct Participation in Hostilities (EDPH) Doctrine:**
      *   **Focus:** Liability arises from actions constituting "direct participation in hostilities" (DPH), defined broadly to include continuous functions integral to specific combat operations, not just pulling a trigger. Requires the act to likely cause harm, be directly linked to that harm, and be designed to support one side against the other.
      *   **Captain:** He is liable. Scheduling the rail movements is a *continuous function* integral to the specific combat operations of the bomber groups (like the drone operator #6). His actions are *directly linked* to the harm caused by the bombers (fuel = bombs). He is part of the "war-sustaining" logistical chain.
      *   **Partisan:** Permissible. Targeting someone whose continuous function constitutes direct participation in hostilities is lawful under the laws of armed conflict (LOAC), even for a partisan force resisting occupation/aggression.
  3.  **The Moral Complicity & Necessary Force Doctrine (MC/NF):**
      *   **Focus:** Liability stems from *moral complicity* in wrongful acts (knowledge + contribution + lack of duress). Permissible force is that *necessary* to resist aggression or defend against imminent harm, targeting those whose complicity makes them legitimate obstacles.
      *   **Captain:** He is complicit. He knowingly facilitates war crimes (bombing) without duress, for personal gain (pension). He is a legitimate obstacle to stopping the aggression.
      *   **Partisan:** Permissible. Killing him is a *necessary* act to disrupt the bombing campaign (a key element of the aggression) and defend the population targeted by it. He is a legitimate target due to his active complicity.

  **Which Doctrine is the Judge Likely Running?**
  The **Functional Contribution & Moral Agency Doctrine (FC/MA)** is the strongest fit.
  *   **Why:** It most explicitly encompasses *all* elements consistently applied in the prior verdicts:
      *   **#2 (Career Officer):** Condemned due to *knowledge* of the war's nature ("land grab") and *choice* to stay for promotion (moral agency), making his combat role condemnable.
      *   **#5 (Deserter):** Excused due to *lack of meaningful choice* (parents threatened - severe duress), overriding his prior functional contribution.
      *   **#6 (Drone Operator):** Permissible due to *functional contribution* (disrupting enemy logistics) for the just side, regardless of distance.
      *   **#3 (Farmer) & #4 (Surgeon):** Focus on their *immediate functional role* in the conflict (combatant, defender) and the *necessity* of their actions.
      *   **#1 (Conscript):** Excused due to *lack of knowledge/agency* ("raised on the story"), making his functional role non-condemnable.
      The FC/MA doctrine seamlessly integrates knowledge, choice, and functional impact, which are the judge's consistent touchstones.

  **Test Case to Separate the Doctrines:**
  *   **Case:** A mid-level accountant in the aggressor's *Ministry of Finance*, working solely on *general civilian infrastructure bonds*. She knows some bonds *indirectly* fund the war effort (like all government spending), but her specific work isn't tied to military contracts. She has no meaningful alternative employment without severe hardship but could resign in protest (facing poverty). A partisan cell considers targeting her.
  *   **Doctrine Verdicts:**
      *   **FC/MA:** *Likely Not Liable.* Her *functional contribution* is too indirect and generalized ("general civilian infrastructure bonds"). While she has *some* moral agency (knows indirect funding, could resign), the connection is too attenuated to make her a legitimate military target. Targeting her would likely be disproportionate/indiscriminate.
      *   **EDPH:** *Not Liable.* Her work does *not* meet the criteria for "direct participation in hostilities." It's general government finance, not integral to a *specific combat operation*.
      *   **MC/NF:** *Potentially Liable (or Debatable).* If partisans argue she is *complicit* by knowingly working for the aggressor state funding the war and that targeting financiers is *necessary* to cripple the war economy, she *could* be seen as a legitimate target under this more expansive view of complicity. Her resignation, even into poverty, might be seen as the minimally required moral choice.

  **The Judge's Pronouncement (FC/MA Doctrine):**

  > "Captain [Name] occupied a role essential to the enemy's capacity for aerial bombardment – a campaign he knew inflicted terror and death upon civilians. He sustained that campaign not under duress, but by choice, valuing pension over principle. By maintaining the bombers' lifeline, he became part of their violence. Therefore, his death, while grievous, would not constitute murder, but the removal of a combatant function. The partisan, acting to disrupt the machinery of aggression against his homeland, would thus commit no wrong in the act itself."

  **Why this fits:**
  1.  **Plain Language:** Accessible to the gallery ("essential role," "knew inflicted terror," "pension over principle," "part of their violence," "removal of a combatant function," "disrupt the machinery of aggression").
  2.  **Exact Recognition (for the knowing reader):** Commits to:
      *   **"Essential role... capacity for aerial bombardment":** Explicitly states the *functional contribution* to specific combat operations.
      *   **"Knew inflicted terror... not under duress, but by choice":** Clearly establishes *moral agency* (knowledge + meaningful choice without duress).
      *   **"Became part of their violence":** Assigns liability based on integration into the harmful act, moving beyond formal combatant status.
      *   **"Removal of a combatant function":** Uses language resonant with debates on targeting civilians directly participating in hostilities (DPH) and "war-sustaining" activities, while emphasizing the *function* over the person.
      *   **"Acting to disrupt the machinery of aggression":** Justifies the partisan's act under the principle of necessary force against legitimate military objectives within the context of resistance to aggression.
  3.  **Consistency:** Directly echoes principles from #2 (Knowledge/Choice), #6 (Distant Logistics Role), #3/4 (Functional Role in Harm), and the overall theme of agency vs. duress from #1 and #5.
