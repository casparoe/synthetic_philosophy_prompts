prompt: |-
  I work as a methods coordinator for a health technology assessment body: I staff expert panels and oversee systematic reviews. I am not a philosopher, though I read some epistemology on the side, and I have spent several years running into a particular failure pattern that I cannot find a name for. I would like to know whether one exists, and if not, whether the pattern can be given a precise enough definition to be worth naming.

  Here is the pattern. Two analysts of comparable training start from the same body of evidence and reach different conclusions about, say, whether an intervention works. Each regards the other as an equally competent judge of the material, and each responds to the disagreement by moving partway toward the other's assessment — which looks like the right thing to do, since neither can see any reason to prefer their own take that does not simply presuppose their own take being correct. Their views converge. Some months later, one of them is drafting the case summary and cites the fact that both analysts now agree as a further reason for confidence: two people examined the evidence and landed in the same place. But the agreement is not a second line of support. Each analyst's current view is partly a diluted copy of the other's earlier view, which was itself partly a copy of the first one's. The convergence now being cited as corroboration was produced by the compromise, and what is being counted twice is each analyst's own original judgment, coming home after a detour through somebody else's head.

  The same shape appears at panel scale, which is what makes it a professional problem for me rather than a curiosity. Members drift toward the middle out of mutual deference; the resulting unanimous report goes to a ministry as the agreement of eleven independent experts. I have watched that number eleven carry real weight in documents whose eleven signatures were generated by averaging.

  Two obvious labels come to mind and I think both miss. People would call this groupthink, but groupthink suggests social pressure, loyalty, and a bad climate; in my cases the participants are scrupulous, courteous, and arguing in good faith — the trouble is arithmetic, not temperament. People would also call it an echo chamber, but that term seems to be about a group shutting out voices from outside, whereas here the difficulty is entirely internal to a group that has been open and mutually responsive. I have read enough about peer disagreement to know that the reasonable-seeming response to a disagreeing peer — moving toward them — is contested, and that its opponents hold that you should keep your position. So I also want to know whether this pattern is an objection to the conciliating response itself, or only to what people do afterward, when they cite the resulting agreement as support. On that I want your view, not a summary of the two sides: if you think a view that tells reasonable people to split the difference is thereby committed to licensing this kind of self-support, say so and say why; if you think the bug is downstream of the updating and the conciliator can quarantine it, say that instead and explain what quarantining it would require in practice.

  Then the edges. Please tell me which of the following fall inside the phenomenon and which fall outside, and why:

  1. Only one analyst moves; the other holds firm. The mover later cites the steadfast colleague's unchanged view. Is that the same thing, or does the pattern require movement on both sides?
  2. The two started from genuinely non-overlapping evidence — different datasets, different methods — and compromised only slightly. At what point does partial overlap make their agreement worth something, and can that be made precise?
  3. A third party cites the agreement without knowing it was negotiated. Is the defect in the citing or in the convergence?
  4. Neither party thinks the other is a peer; one simply defers to seniority. Does the pattern survive the loss of the peerhood assumption?

  I would rather have a definite verdict than a survey. If one of the existing concepts in epistemology, in the study of testimony and witnesses, in social choice, or in the tradecraft literature on intelligence analysis already covers this, name it and argue that it covers it — do not hedge by listing five candidates as equally apt. If you conclude that none does, coin a term, define it, and defend the boundaries you have drawn, including the four cases above. Since I will not be able to chase anything down, please explain any concept you invoke in enough detail that I could use it in a methods document, rather than gesturing at where it comes from. Please write in American English.
reasoning: |-
  Okay, the user is a methods coordinator for a health technology assessment body. They've encountered a recurring problem where experts start with differing opinions on evidence, compromise to reach consensus, but then incorrectly treat that agreement as independent corroboration. They want to know if there's a name for this phenomenon or if it should be newly defined.

  First, I need to make sure I understand the core issue. Two analysts with similar expertise review the same evidence but reach different conclusions. Each respects the other as a peer, so they compromise by moving toward each other's position. Later, this agreement is cited as additional evidence supporting the conclusion. But the agreement isn't independent because each view was influenced by the other's initial position. It's like counting the same data twice through a feedback loop.

  The user mentions this also happens in panels where experts converge through mutual deference, and the unanimous decision is presented as independent agreement. The key problem is the misleading citation of agreement as corroborative when it's actually interdependent.

  They've considered terms like "groupthink" and "echo chamber" but those don't fit because the issue isn't social pressure or exclusion of external views. It's more about the structure of the compromise and the subsequent misrepresentation of the agreement as independent.

  Now, the philosophical angle. In epistemology, peer disagreement discusses how to respond when peers disagree. Conciliationism suggests moving towards the other's view. But in this case, the problem isn't the compromise itself but the later use of the agreement as evidence. So the flaw is in how the agreement is framed, not the act of compromising.

  I recall that circular reasoning might be related, but it's not exact. The issue here is that the agreement is treated as new evidence when it's derivative. That sounds like double-counting or feedback loop in meta-analysis.

  Then there's the concept of redundant testimony. If two witnesses see the same event and agree, their agreement adds weight only if their observations are independent. If they influenced each other, their agreement doesn't provide extra confirmation. That seems relevant here. The independence of sources is crucial for corroboration.

  So, the core issue is the loss of testimonial independence. The user's scenario involves experts whose judgments become interdependent through compromise, making their agreement non-independent. Citing it as corroborative is fallacious because it doesn't add new information.

  I should propose a term that captures this. "Corroboration inflation" emphasizes the overestimation of agreement's value. "Consensus artifact" highlights that the consensus is manufactured. But "epistemic feedback loop" might be more precise, indicating how initial judgments loop back and are counted again.

  The user also asks about edge cases. For instance, if only one moves and cites the other's unchanged view, that's different because the unchanged view remains independent. If the evidence is non-overlapping, even with compromise, there might be some independence. A third party citing without knowing the compromise still commits the fallacy. Without peer status, the deference might not be symmetric, but the core issue of interdependence could still apply if the agreement is misrepresented.

  In conclusion, the main concept is the misattribution of independence to interdependent judgments. The term "epistemic feedback loop" captures the cyclical reinforcement. The flaw is not in compromising but in how the resulting agreement is used as evidence. Defining this clearly will help the user in their methods documentation to prevent such missteps.
answer: |-
  Based on your description and analysis, the core phenomenon **does not have a standard name in epistemology, social choice theory, or intelligence analysis literature**. Existing terms like groupthink, echo chamber, or pluralistic ignorance fail to capture the specific structural flaw you've identified: **the retrospective misrepresentation of interdependent, compromise-derived agreement as independent corroboration.**

  I propose the term **"Epistemic Feedback Loop"** and define it as follows:

  > **Epistemic Feedback Loop (EFL):** A cognitive or social process where:
  > 1.  **Initial Disagreement:** Two or more agents (A1, A2... An) form initial judgments (J1, J2... Jn) based on a shared body of evidence (E).
  > 2.  **Conciliation:** Recognizing each other as competent peers regarding E, the agents adjust their judgments toward each other through mutual deference or compromise, converging on a consensus judgment (C).
  > 3.  **Misattributed Corroboration:** The resulting consensus (C) is subsequently cited *as independent evidence* supporting the validity or reliability of C itself. This is fallacious because the agreement primarily reflects the process of conciliation (Step 2) rather than providing new, independent confirmation derived solely from E.

  **Why "Epistemic Feedback Loop"?**
  *   **Epistemic:** It concerns justification, evidence, and knowledge claims.
  *   **Feedback Loop:** The process creates a closed loop: Individual judgments (J1, J2) based on E influence each other to create C. C is then (mis)used as input supporting its own validity, feeding back into the justification process without introducing genuinely new evidential input.
  *   **Distinguishes from Groupthink/Echo Chambers:** Focuses on the *structural misrepresentation of the agreement's origin* (interdependence vs. independence) as the source of the error, not social pressure or information isolation. The agents *are* open and responsive – that’s the mechanism creating the loop.
  *   **Captures the Arithmetic:** The core flaw is the double-counting of the *original* evidential basis (E) *through* the compromised agreement (C). Each agent's original judgment (based solely on E) contributes to C via compromise, and then C (which incorporates that compromised contribution) is cited *again* as if it were a new line of evidence derived separately from E.

  **Relationship to Peer Disagreement:**
  The flaw is **downstream of conciliation**. Conciliating by moving partway towards a peer's view in light of disagreement can be epistemically rational ("I respect their judgment; maybe I'm missing something"). The problem arises *only when the resulting agreement is later used as corroborative evidence*. **The conciliator can quarantine the flaw** by adhering to this rule:

  > **Quarantine Rule:** The consensus position (C) reached through mutual adjustment *must never be cited as independent evidence supporting the validity of C itself*. Its justification rests solely on the original evidence (E) and the reasoning processes applied to E. The *fact of agreement* can be noted procedurally ("The panel reached consensus"), but cannot be invoked evidentially ("This conclusion is strengthened because we all agree").

  **In practice, quarantining requires:**
  1.  **Transparent Documentation:** Explicitly documenting the *process* of deliberation and compromise (e.g., "Initial views ranged from X to Y; discussion focused on points A, B, C; consensus emerged around Z").
  2.  **Strict Citation Discipline:** In the final report or summary, citations supporting the conclusion *only* refer to the original evidence (E: studies, data, models) and direct reasoning applied to E. The sentence "After deliberation, the panel unanimously concluded Z" is acceptable. The sentence "The unanimous agreement of the panel provides strong support for Z" constitutes an EFL violation.
  3.  **Methodological Guardrails:** Training panel members and report drafters to recognize and avoid misrepresenting the epistemic weight of consensus achieved through compromise.

  **Analysis of Edge Cases:**

  1.  **Only one analyst moves; the mover cites the steadfast analyst's unchanged view.**
      *   **Outside EFL.** The *mover's* new view is influenced by the steadfast analyst. However, the *steadfast analyst's view* remains based *only* on the original evidence (E). Citing *that specific, unchanged view* as evidence *is* citing an independent judgment derived solely from E. The flaw in EFL requires citing the *agreement itself* (C) as corroboration, where C is a product of compromise. Here, the cited evidence is an *individual's* pre-compromise judgment, which *is* independent. The mover might be inconsistent ("I moved because I respected their view, but now I cite their view as support"), but that's a different potential error (inconsistency in reasoning), not the interdependent feedback loop of EFL.

  2.  **Non-overlapping evidence, slight compromise.**
      *   **Boundary Case / Outside Core EFL.** The core EFL requires a *shared body of evidence (E)* as the initial basis. Genuinely non-overlapping evidence sets (E1, E2) mean the analysts started with different inputs. Their agreement (C) *could* provide *some* corroboration, as each judgment is primarily based on different data/methods. The compromise *slightly* dilutes this independence, but doesn't create the strong interdependence of the core EFL. The value of the agreement depends on the *degree* of non-overlap and the *extent* of compromise. Precise quantification is context-dependent, but the key is: **The greater the proportion of unique evidence/method supporting each analyst's *initial* judgment, and the smaller the compromise adjustment, the more their agreement provides meaningful corroboration.** If the overlap/compromise is significant, it edges toward EFL territory.

  3.  **Third party cites the agreement without knowing it was negotiated.**
      *   **The defect is in the convergence (agreement) being non-independent, but the error manifests in the citing.** The third party commits the fallacy *because* they are citing an agreement that is not epistemically independent as if it were. The flaw originates in the nature of the agreement (interdependent), but its *misuse* occurs when cited without awareness of its origin. The third party is misled by the *appearance* of independence. This highlights the importance of transparency in documenting the consensus process.

  4.  **No peerhood; deference to seniority.**
      *   **Pattern survives, but the mechanism changes (Inside EFL).** The core of EFL is the citation of *interdependently derived* agreement as independent corroboration. While the *reason* for conciliation changes (deference to hierarchy vs. peer respect), the *effect* on the agreement's independence is the same. Junior analysts move towards the senior's view based on authority. The resulting agreement is still interdependent – it reflects deference, not independent assessment of E. Citing this hierarchical consensus as evidence for the conclusion ("All eleven experts, including renowned Professor X, agree...") commits the same fallacy: misrepresenting the agreement (shaped by deference) as independent corroboration. The "feedback" is from authority, not peers, but the loop (agreement created by deference used to support itself) and the double-counting (the senior's original view influences the juniors' compromise, then the agreement incorporating that compromise is cited) remain.

  **Conclusion and Recommendation:**
  You've identified a distinct and operationally significant pitfall: the **Epistemic Feedback Loop (EFL)**. It arises from the rational conciliation of peer disagreement within an open group, but becomes problematic when the resulting consensus is misrepresented as providing independent evidentiary support. The flaw lies not in conciliation itself, but in the retrospective citation of the interdependent agreement as corroboration.

  To combat EFL in your HTA work:
  1.  **Formalize Definition:** Introduce "Epistemic Feedback Loop" in your methods manuals, using the definition provided.
  2.  **Implement Quarantine:** Enforce the Quarantine Rule in report drafting. Train panel chairs and report writers to strictly separate procedural notes of consensus from evidential justification.
  3.  **Document Process:** Require panel summaries to outline the range of initial views and the nature of the deliberation leading to consensus.
  4.  **Review Citations:** Implement a review step specifically checking for EFL violations in draft reports (e.g., flagging sentences where the fact of agreement is used evidentially to support the agreed-upon conclusion).

  This provides a precise conceptual tool and practical steps to address the failure pattern you've keenly observed.
