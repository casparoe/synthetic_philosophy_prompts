answer: |-
  Here’s a polished, runnable role-play design for your ethics seminar, addressing your core goal of destabilizing "when in Rome" intuition while mitigating the newcomer rebellion risk. It includes a scoring system using "social capital" instead of money.

  **Role-Play Title:** *Harmony Cove Conundrum*

  ### Core Setup
  - **Premise:** Students role-play residents/newcomers in "Harmony Cove," a town with 8 quirky local practices. Residents believe these maintain social harmony; newcomers must navigate them.
  - **Key Twist:** Practices are secretly categorized (unknown to players):
    - **Type C (Coordination):** Solves shared problems (e.g., "Walk left on paths" avoids collisions).
    - **Type D (Distributional):** Benefits one group subtly (e.g., "Visitors buy the first round" saves residents money).
    - **Type A (Arbitrary):** No function (e.g., "Tug left ear when greeting").
  - **Reveal:** After gameplay, types are disclosed. Students rank how "obligatory" each practice *felt*, then compare rankings to actual function.

  ---

  ### Rules & Roles
  **1. Roles (25 Students):**
  - **18 Residents:** Divided into 6 groups of 3. Each group "champions" 1–2 practices (assigned). Must gently enforce norms but CANNOT explain *why* they exist ("It’s just our way").
  - **6 Newcomers:** Arrive 15 mins into the session. Goal: Maximize social capital (SC) by balancing integration and authenticity.
  - **1 Moderator (You):** Facilitates, tracks time/scores, intervenes if rules broken.

  **2. Practices (8 Total - Print on Cards):**  
  *(Examples—customize as needed. Functions revealed **only** in debrief.)*
  1. **"Offer your seat to anyone carrying blue."** (Type D: Residents often carry blue. Saves them effort.)  
  2. **"Always step first with your right foot when entering shops."** (Type A: No function.)  
  3. **"Queue clockwise at food stalls."** (Type C: Prevents gridlock.)  
  4. **"Address elders by ‘Honored [Name]’."** (Type D: Boosts elders’ status.)  
  5. **"Place umbrellas tip-down in public stands."** (Type C: Prevents water pooling.)  
  6. **"End conversations with ‘May tides be fair’."** (Type A: No function.)  
  7. **"Newcomers serve themselves last at potlucks."** (Type D: Residents eat first.)  
  8. **"Point with knuckle, not finger."** (Type C: Prevents accidental poking in crowds.)  

  **3. Social Capital (SC) Scoring:**  
  - **Residents:** Gain 1 SC when a newcomer complies *without prompting*. Lose 2 SC if they aggressively enforce.  
  - **Newcomers:** Gain 1 SC for each compliant action. Gain 2 SC for each practice they openly *reject* (must state refusal clearly). **Catch:** If TOTAL newcomer SC from rejection > 10, ALL newcomers lose 5 SC (social backlash).  
  - **Goal:** Maximize individual SC. Top 3 scorers "win" (bragging rights only).

  ---

  ### Materials
  - Role cards (18 resident, 6 newcomer)  
  - 8 Practice Cards (laminated)  
  - SC Tracking Sheet (on whiteboard: resident groups/newcomers as rows, SC as columns)  
  - Timer  
  - Props (optional): Blue bags, umbrellas, name tags for "elders."

  ---

  ### Timeline (80 Mins Total)
  | **Phase**         | **Time** | **Activity** |
  |-------------------|----------|--------------|
  | **Setup**         | 0-5 min  | Split roles. Brief residents: "Your practices are vital to Harmony Cove. Model them naturally—NO explaining purposes." Hand out practice cards. |
  | **Immersion**     | 5-15 min | Residents mingle, model practices (e.g., "accidentally" drop blue bag; queue clockwise). Newcomers wait outside. |
  | **Newcomer Entry**| 15-30 min| Newcomers enter. Residents interact naturally (e.g., "Oh! You stepped left-footed... how novel!"). Track SC silently. |
  | **Crisis Point**  | 30-45 min| Announce: "Newcomers—debate which practices to adopt/reject. You have 5 mins to decide individually." *Then*: Newcomers announce rejections (if any). Update SC. |
  | **Integration**   | 45-60 min| Open mingling. Residents/Newcomers negotiate. Track compliance/rejection SC. |
  | **Debrief Prep**  | 60-65 min| All stop. Collect SC totals. Hand out "Felt Obligation" sheets (list practices 1–8, rank 1=most obligatory, 8=least). |
  | **Debrief**       | 65-80 min| Facilitate discussion. |

  ---

  ### Debrief Questions
  1. **Experience:** "Newcomers—which practices felt *most* obligatory? Why? Residents—which felt hardest to enforce?"  
  2. **Reveal:** Disclose each practice’s type (C, D, A). Have students call out their rankings.  
  3. **Key Insight:** "Glance at the board. Is there a pattern? Did Type A practices ever feel *more* obligatory than Type C? Why?"  
  4. **Theory:** "How did ‘when in Rome’ hold up? When did compliance feel empty? When did rebellion backfire?"  
  5. **Real World:** "Where have you seen ‘Type A’ conventions gain moral weight? (e.g., ‘Because we’ve always done it’)."  

  ---

  ### What Will Go Wrong (And Fixes)
  - **Risk: Newcomers refuse everything.**  
    **Mitigation:** The SC backlash rule (lose 5 SC if total rejections >10) forces strategic compromise. During "Crisis Point," remind: "Rejecting all norms *will* cost you."  
  - **Risk: Residents lecture about "why."**  
    **Mitigation:** Stress in setup: "If you explain the purpose, your group loses 2 SC." Intervene if needed.  
  - **Risk: Arbitrary practices feel silly.**  
    **Leverage it:** Point out in debrief: "Did knowing it was arbitrary change how obligated you *felt* in the moment?"  
  - **Risk: Time runs short.**  
    **Fix:** Strictly enforce mingling times. Skip props if needed. Prioritize debrief.

  ---

  ### What a Single Session Can’t Replicate
  1. **Convention Evolution:** Real norms shift through repeated negotiation. Acknowledge: "We simulated a snapshot—real conventions accrue history and emotional weight over years."  
  2. **Power Imbalances:** While Type D hints at this, real conventions often entrench class/gender/racial hierarchies. Say: "Our game softened power dynamics—in reality, ‘non-compliance’ can carry severe stigma or exclusion."  
  3. **Internalized Norms:** Residents played "believers" but didn’t *live* the norms. Note: "Felt obligation deepens when conventions shape your identity—we only scratched the surface."

  **Why This Works:** It forces students to *feel* the tension between social pressure and rational critique. The SC system makes non-compliance costly but possible, mirroring real tradeoffs. By ranking *felt* obligation *before* revealing functions, you make the disconnect visceral. The debrief transforms confusion into insight—exactly what shakes "when in Rome."  

  Run it tight, embrace the chaos, and watch them squirm when "tug your left ear" feels weightier than queueing order. Good luck!
