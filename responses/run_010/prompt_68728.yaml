  The scoring needs no real money. I'll use "social capital" points—residents gain when newcomers comply, newcomers gain by balancing compliance with authenticity. This mirrors real social tradeoffs. 

  Materials should be simple: role cards, practice cards, score trackers. Timeline must be tight: 5-min setup, 30-min immersion, 15-min newcomer entry, 20-min debrief. 

  Debrief questions should first unpack emotional experiences ("How obligated did you feel?"), then reveal the functions and compare against felt obligation. The climax is showing the mismatch via a ranking exercise. 

  Biggest risks: newcomers boycotting (solution: embed incentives to comply), or residents over-explaining rules (solution: forbid justification). Also, the arbitrariness of some practices might feel silly—I'll lean into that, as it proves the point. 

