  Right, let's brainstorm objections by persona:
  1. Physics teacher: "Where's the mechanism?" (high damage/likelihood)
  2. Maths head: "Quantify your wiggle room" (medium)
  3. Competitive student: "What about bidirectional cosmologies?" (high damage)
