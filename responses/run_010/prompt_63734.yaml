prompt: |-
  ok so I'm doing my EPQ on why time only goes one way, and in about three weeks I have to present it at my school's research showcase evening — 20 minute talk plus questions, in the hall, in front of everyone. I'm fairly confident about the talk but I am defintely not confident about the questions, and I want to walk in knowing exactly what's coming.

  Here's the actual claim I'm defending, which is a bit spicy: entropy increase doesn't explain the arrow of time, it just restates it. The standard story is that the microscopic laws are time-reversal symmetric (I've got a slide on the reversibility objection from Loschmidt and the recurrence objection from Zermelo, so I can handle those), and the asymmetry comes from the universe starting off in an absurdly low entropy state — the Past Hypothesis. My argument is that this buys you an asymmetry only by positing a one-off boundary condition that nothing can test, and it still doesn't explain why memories, records, causation and our ability to intervene all line up pointing the same way. So instead: the real asymmetry is counterfactual. You can hold the past fixed and wiggle the future; you cannot hold the future fixed and wiggle the past, because that would require fixing an insanely specific microstate that you have no handle on. So the arrow is grounded in what agents can actually do, and the Past Hypothesis isn't a law of physics at all — it's a summary of our commitment to that counterfactual asymmetry, dressed up as cosmology. I also want to claim that Boltzmann brains give an extra reason to distrust entropy arguments about our own past, since a fluctuation universe makes memory unreliable, whereas my account grounds reliability in what we can do rather than in what we happen to remember.

  The room is quite mixed and that's the problem:
  - my physics teacher, who is a proper physicist, teaches the A level extension stuff, reads a lot of pop cosmology including the Carroll books, and cannot stand hand-waving — if it isn't a mechanism he'll say so
  - the head of maths, who does statistics and will want to know whether I've said anything precise enough to be wrong
  - two Y13 further maths students, one of whom is competitive and likes to trip people up with things half-remembered from YouTube — she's already mentioned to me the idea from cosmology where the arrow points away in both time directions from a low-entropy middle, so expect something like that
  - a visiting postdoc in condensed matter who's only there because he knows a governor, does no foundations whatsoever, thinks I'm wasting everyone's evening, and will ask what measurement would come out differently on my view
  - one teacher from the RE side who did a philosophy degree, will insist on definitions, and will hunt for circularity
  - plus parents and the headteacher, who'll be polite but might ask something naive that's actually devastating

  Can you write me the prep sheet? Specifically:
  - the eight or so objections this particular room will raise, ordered by how likely they are times how much damage they'd do — not the generic list of objections to the arrow of time that you'd get from a philosophy seminar, the ones these people would actually say
  - for each one, whose mouth it comes out of and roughly how they'd phrase it in a school hall, because the postdoc and the philosophy teacher will attack the same thing in completely different registers
  - a reply I can say out loud in under a minute — actual spoken sentences, not essay prose
  - a straight note on where that reply is soft, and what I should just concede rather than defend
  - flag which of the objections are secretly the same objection wearing different clothes, so I can bundle them
  - which one I should get in front of during the talk itself instead of waiting for it
  - the one I'm praying nobody asks
  - at least one spot where the honest move is to say I don't know, because that postdoc would enjoy catching me making something up far more than he'd enjoy the answer
  - and my fallback position if the worst objection lands — what do I retreat to that still leaves me with a coherent project

  British English throughout please, spellings and everything, no "math".
reasoning: |-
  Okay, the user is preparing for their EPQ presentation on why time only moves forward, specifically arguing that entropy doesn't explain the arrow of time but merely restates it. They've outlined a "spicy" claim that the real asymmetry is counterfactual, grounded in what agents can do. Their main concern is anticipating and handling questions from a diverse audience. 

  First, I need to understand their core argument deeply. They're rejecting the Past Hypothesis as a physical law, framing it instead as a reflection of counterfactual asymmetry. The Boltzmann brains point adds skepticism about entropy-based explanations of memory reliability. 

  The audience breakdown is critical here. Each person represents a different challenge:
  - The physics teacher will demand mechanisms
  - The maths head will want precision
  - The competitive student might bring up bidirectional time arrows
  - The postdoc will ask for testable differences
  - The philosophy teacher will hunt for circular definitions
  - Others might ask naive but tricky questions

