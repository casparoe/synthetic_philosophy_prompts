prompt: |-
  I do model risk at a mid-size US health insurer — I'm the person who has to sign off before a claims-prediction, readmission, or utilization-management model goes into production, along with a compliance attorney and one of our staff physicians. We review maybe fifteen models a quarter, and the standard validation checks whether it fits, whether it's stable on a held-out slice, whether it trips our fairness thresholds by protected class. Almost none of that touches the failure mode I actually lose sleep over, which is a model that has latched onto a predicate that looked perfectly projectible inside the training window and quietly isn't. Everyone in the field knows the old chest X-ray story about the classifier picking up the portable-scanner artifact or the hospital's film marker rather than the pathology; we've had our own versions. A readmission model of ours keyed heavily on a case-management program code that turned out to exist for about eighteen months and then got retired in a systems migration. A pharmacy model treated "fills at this particular chain" as a signal about the patient when it was really a signal about a formulary deal. My reading of the grue problem says this isn't a defect in our feature pipeline that better tooling would fix — it's the normal condition: any finite set of cases is fit by indefinitely many predicates, and which ones we're willing to project onto the next quarter is settled by something other than the data. The trouble is that entrenchment is a description of what we already do, not a test I can hand a data scientist on a Tuesday.

  So write me the procedure my team could actually run at model review. I want the ordered questions or tests to apply to a model's top features — say the top ten by whatever attribution measure the team already computes — with what counts as a passing answer at each step, roughly how long each step takes (assume the data scientist can give me a day of their time and I can give an hour per model), and, importantly, where the procedure has to stop and hand the decision to a human because the remaining question isn't factual but is about which population we think we're sampling from. I'd like the Goodman material to be load-bearing rather than decorative. Specifically: what does entrenchment buy you that a plain "is this feature causally upstream of the outcome?" check doesn't, and where does it mislead you? What's the deployment-world species of a grue predicate — my guess is a predicate that stays perfectly stable for as long as observations keep arriving and only breaks when some institutional arrangement changes, but tell me if that's the wrong shape. And where do overhypotheses come in, i.e. at what point does the procedure need to ask not "does this feature hold in the training data" but "what makes this training sample a sample of the population we'll actually face"? Be blunt about which steps are genuinely Goodmanian and which are ordinary robustness hygiene wearing his name — I'd rather have a checklist that admits its limits than one that implies the 1950s puzzle got solved somewhere along the way.

  Then run it on three features and show the worksheet, not just the verdict. First: a high-cost-episode model that uses the count of prior authorizations a member's provider filed in the last twelve months — it reads like a severity proxy, and we're about to onboard a large hospital system that outsources its prior auth to a vendor. Second: "member is enrolled in our wearable-device rewards program" as a predictor of low ER utilization — I personally argued for this one in committee and it'll be awkward if your procedure kills it, but I'd rather find out now, so don't soften it. Third: "currently prescribed metformin" in a diabetes-complications model, which our data scientists flag as leakage because it sits downstream of the diagnosis but which has decades of clinical practice entrenching it — I want to see whether your procedure treats entrenchment as evidence of projectibility here or as a reason to be suspicious. Finish with what the procedure can't do: the cases where it'll pass a model that later blows up anyway, and why.
reasoning: |-
  We are designing a procedure for model review that addresses the "grue" problem: the risk that a model has latched onto a feature that is projectible within the training window but fails in production due to a shift in the underlying data generating process. The procedure focuses on the top features (e.g., top 10) and involves a series of questions and tests.

  The procedure is inspired by Nelson Goodman's "new riddle of induction" and the concept of "entrenchment". Entrenchment refers to the idea that predicates (or features) that have been used and projected successfully in the past are more trustworthy for future projections. However, we must also recognize that entrenchment can sometimes mislead (e.g., when the world changes).

  Key concepts:
  - **Grue problem**: A predicate is "grue" if it applies to all things examined before a certain time t and then changes (e.g., emeralds are grue if they are green until t and then blue). In our context, a feature might be stable until a system change (like a formulary deal expiring) and then become invalid.
  - **Entrenchment**: The history of successful use of a feature in projections. An entrenched feature is one that has been repeatedly used and has not failed us. This is different from causal upstream because causality might be established by a single experiment, but entrenchment requires a history of successful projection. Entrenchment buys us robustness against arbitrary changes (like the grue shift) because we are using features that have survived many tests. However, it can mislead when there is a structural change that breaks the historical pattern (like the retirement of a case-management code).
  - **Overhypotheses**: These are hypotheses about the kinds of environments in which our models will operate. They answer the question: why do we believe that the training data is a sample from the same population as the deployment data? This involves understanding the data generating process and potential shifts.

  The procedure will consist of the following steps for each top feature. We assume we have a day of the data scientist's time and an hour of the reviewer's time per model. We aim for a procedure that is feasible within these constraints.

  **Procedure for each top feature:**

  1. **Feature Definition and Source**:
     - **Question**: Precisely define the feature and its source (e.g., which database table, which ETL step). 
     - **Passing answer**: The definition is clear and the source is documented. If the feature is derived, the derivation logic is provided and verifiable.
     - **Time**: 10 minutes per feature (mostly preparation by the data scientist; review by the validator is quick).
     - **Rationale**: Ensures we know what the feature represents and where it comes from.

  2. **Stability Check**:
     - **Test**: Check the stability of the feature over time. Plot the distribution (or mean/median and variance) of the feature over the training window and, if available, in more recent data (e.g., the last month). 
     - **Passing answer**: The feature distribution does not show significant drift (using a statistical test like KS test or by visual inspection for obvious breaks). Threshold: if the KS test p-value is above 0.05 (or a predefined threshold adjusted for multiple testing) then it passes. If there is drift, it must be explained and deemed acceptable (e.g., seasonal drift that is expected and accounted for).
     - **Time**: 30 minutes per feature (data scientist runs the code, validator reviews the plots and tests).
     - **Rationale**: Detects if the feature has already started drifting in the training window or between training and now.

  3. **Causal Plausibility**:
     - **Question**: Is there a plausible causal story (even if not proven) that links the feature to the outcome? This should be based on domain knowledge (e.g., medical literature, business logic). 
     - **Passing answer**: A reasonable causal story exists (e.g., prior authorizations are associated with more complex cases, hence higher cost). If the story is weak, it fails. This step does not require proof of causality but a plausible mechanism.
     - **Time**: 20 minutes per feature (discussion between data scientist, validator, and possibly the staff physician).
     - **Rationale**: Features without a plausible causal story are more likely to be proxies for something else and hence vulnerable to shifts.

  4. **Entrenchment Check**:
     - **Question**: How entrenched is this feature? We consider two aspects:
       a. **Historical usage**: Has this feature (or a very similar one) been used in production models in the past and performed consistently?
       b. **Longevity**: How long has the underlying data generating process been in place? (e.g., a feature based on a new program that started 6 months ago is not entrenched.)
     - **Passing answer**: The feature (or a similar one) has been successfully used in production for at least 2 years (or a predefined period) without causing model failure. If the feature is new, then it fails the entrenchment check and must rely on other checks. However, note: entrenchment is not required for passing the entire procedure, but it contributes to the overall assessment.
     - **Time**: 15 minutes per feature (data scientist provides history, validator checks model archives).
     - **Rationale**: Entrenchment provides evidence that the feature has survived multiple projections and hence is less likely to be grue-like. But note: entrenchment can mislead if the world has changed (e.g., a system migration) and we are relying on a feature that is no longer valid.

  5. **Institutional Context Check**:
     - **Question**: Are there any known upcoming changes in the institutional arrangements that might affect the data generating process of this feature? (e.g., changes in billing systems, provider contracts, clinical guidelines, etc.)
     - **Passing answer**: The data scientist and the business owner confirm that there are no known changes that would affect this feature in the next [time horizon of model deployment, e.g., 1 year]. If there are, then the feature fails unless there is a mitigation plan (e.g., monitoring and retraining).
     - **Time**: 15 minutes per feature (requires consultation with business stakeholders, might be done in advance by the data scientist).
     - **Rationale**: This step directly addresses the "grue" shift that happens due to an institutional change. It requires human input because it's about the future.

  6. **Overhypothesis Check** (the point where we hand off to human judgment):
     - **Question**: What overhypotheses justify that the training data is a sample from the same population as the deployment data? Specifically, for this feature, what assumptions are we making about the stability of the world? And are these assumptions likely to hold?
     - **Passing answer**: The reviewer (and team) must agree that the overhypotheses are reasonable. This step does not have a strict factual test. It requires discussion and judgment. The key is to articulate the overhypotheses and then assess their plausibility. For example: "We assume that the relationship between prior authorizations and high cost is stable because the process of requiring prior auth is based on medical necessity which is a stable concept." But if the overhypothesis is "the wearable rewards program enrollment is driven by the same factors as in the past", we must question whether the program rules or member engagement might change.
     - **Time**: 20 minutes per feature (discussion among the review team).
     - **Rationale**: This step explicitly acknowledges the leap of induction and forces the team to articulate and defend the assumptions.

  **Decision Framework**:
  - Each step is a gate. If a feature fails a step, it doesn't necessarily kill the model, but it raises a flag. The overall model might still be deployed with monitoring on that feature, or with a plan to retrain if the feature drifts.
  - The procedure must be documented per feature, and the reviewer must make a judgment call at the end, especially at the overhypothesis step.

  **Where the procedure stops and hands off to humans**:
  - Step 5 (Institutional Context) and Step 6 (Overhypothesis) require human judgment and cannot be fully automated.
  - Also, the overall decision to deploy must be made by the team, considering the risk of the model and the mitigations.

  **Genuine Goodmanian Steps**:
  - Step 4 (Entrenchment) and Step 6 (Overhypothesis) are directly inspired by Goodman. The stability check (Step 2) and causal check (Step 3) are standard hygiene but are also relevant to Goodman's concerns. Step 5 (Institutional Context) is our operationalization of the grue shift in the deployment world.

  **What entrenchment buys that causality doesn't**:
  - Entrenchment provides evidence that the feature has been tested in multiple projections and survived. A causal story might be plausible but if the world changes (e.g., a new treatment makes an old causal pathway irrelevant) then causality alone doesn't save us. Entrenchment, by having a track record, gives more confidence against arbitrary shifts (like grue). However, entrenchment can mislead when there is a structural break that hasn't been seen before (like a system migration) because the past success doesn't guarantee future performance in a changed environment.

  **The deployment-world species of a grue predicate**:
  - Your guess is correct: a predicate that is stable until an institutional change (which might be rare and not captured in the training data) and then breaks. It's not about gradual drift but a step change due to an external event.

  **Running the procedure on three features**:

  We'll create a worksheet for each feature. We assume the model is for deployment in the next quarter and the deployment horizon is 1 year.

  ---

  **Worksheet for Feature 1: Count of prior authorizations in the last 12 months (from a high-cost-episode model)**

  1. **Feature Definition and Source**:
     - Definition: Count of prior authorization requests submitted by the provider for the member in the last 12 months.
     - Source: Prior authorization database, table `auth_requests`, aggregated by member and year.
     - Pass: Yes.

  2. **Stability Check**:
     - Plot the monthly average count of prior authorizations per member over the training window (say 2019-2021) and in the most recent months (2022). 
     - Result: The average count is stable over the training window and in recent months. KS test between 2021 and 2022: p-value=0.12 (no significant drift).
     - Pass: Yes.

  3. **Causal Plausibility**:
     - Story: Members with more prior authorizations are likely to have more complex health conditions, hence are at higher risk of high-cost episodes.
     - Plausibility: High. This is a well-known proxy for severity.
     - Pass: Yes.

  4. **Entrenchment Check**:
     - Historical usage: This feature has been used in several models (e.g., risk adjustment, care management) for 5 years without issues.
     - Longevity: The prior authorization process has been in place for over 10 years.
     - Pass: Yes (strongly entrenched).

  5. **Institutional Context Check**:
     - Known change: We are onboarding a large hospital system that outsources prior auth to a vendor. This might change the pattern of prior auth requests (e.g., the vendor might submit more or less requests, or the same requests might be recorded differently).
     - Result: The feature might break because the count could become less indicative of severity and more indicative of the vendor's behavior. The business confirms this change is upcoming.
     - Pass: No (due to the upcoming change).

  6. **Overhypothesis Check**:
     - Overhypothesis: The relationship between prior auth count and high cost is stable because it reflects the underlying medical complexity. However, the upcoming change in the prior auth process for a large group of members might break this relationship for that group. We must ask: will the new vendor's process alter the meaning of the prior auth count as a severity proxy? If so, then the overhypothesis that the training data (which did not include this vendor) is representative of the future population is violated.
     - Judgment: The feature is at high risk for the new hospital system. We might still use the model but with a plan to monitor the feature for the new members and retrain if needed. Alternatively, we could build a separate model for the new system.

  **Verdict for Feature 1**: This feature fails the institutional context check. The model might be approved with a condition: monitor the feature and model performance specifically for the new hospital system and retrain if degradation is detected.

  ---

  **Worksheet for Feature 2: "Member is enrolled in our wearable-device rewards program" (predictor of low ER utilization)**

  1. **Feature Definition and Source**:
     - Definition: Binary indicator of whether the member is currently enrolled in the wearable-device rewards program (e.g., they sync their Fitbit and get rewards for steps).
     - Source: Wellness program database, table `wearable_enrollments`.
     - Pass: Yes.

  2. **Stability Check**:
     - Plot the enrollment rate over time. The program started 18 months ago, and enrollment has been steadily increasing. 
     - Result: The distribution is not stable because the program is growing. However, we are using it as a binary indicator. We should check the correlation between enrollment and ER utilization over time. The correlation is stable in the training window (which is the last 12 months).
     - Pass: Conditionally (if the relationship is stable).

  3. **Causal Plausibility**:
     - Story: Members who are enrolled in the program are more health-conscious and hence less likely to use the ER. Alternatively, the program encourages physical activity which reduces ER visits.
     - Plausibility: Moderate. However, it might be that the program attracts healthier members (selection bias) and doesn't cause lower ER utilization. Also, note: the program is new and we don't have long-term evidence.
     - Pass: Weak (but passes because there is a plausible story).

  4. **Entrenchment Check**:
     - Historical usage: This feature is new (18 months old) and has not been used in production models before.
     - Longevity: The program is only 18 months old.
     - Pass: No (not entrenched).

  5. **Institutional Context Check**:
     - Known changes: The rewards program is popular and there are no plans to change it in the next year. However, we are considering expanding the program to include new devices and rewards, which might change the member mix.
     - Result: The business says the program is stable for the next year, but expansion might happen. However, it's not a system change that would break the feature definition.
     - Pass: Yes (with the caveat that expansion might change the meaning).

  6. **Overhypothesis Check**:
     - Overhypothesis: The training data (from the last 18 months) is representative of the future because the program is ongoing and the member demographics are stable. However, if the program expands, it might attract a different type of member (e.g., less healthy ones) and the relationship might weaken. Also, we are assuming that the program will continue to be a marker of health-consciousness. But note: the feature might be capturing a selection effect (healthier people enroll) rather than a causal effect. If the program stops, the feature might become meaningless, but the program is stable for now.
     - Judgment: The main risk is that the relationship might not hold if the program changes or if we try to generalize to a broader population. The model might be deployed but with close monitoring of this feature and its relationship to the outcome.

  **Verdict for Feature 2**: The feature passes most checks but with caveats. It is not entrenched and the overhypothesis is weak because the program is new and might change. The model might be approved with a condition to monitor the feature and the model performance, especially if the program expands.

  ---

  **Worksheet for Feature 3: "Currently prescribed metformin" in a diabetes-complications model**

  1. **Feature Definition and Source**:
     - Definition: Binary indicator of whether the member has an active prescription for metformin in the last 90 days.
     - Source: Pharmacy claims database, table `rx_claims`.
     - Pass: Yes.

  2. **Stability Check**:
     - Plot the prevalence of metformin prescriptions over time. It has been stable for years (with a slight upward trend due to increasing diabetes prevalence).
     - Result: Stable. KS test on monthly prevalence between 2020 and 2021: p-value=0.8.
     - Pass: Yes.

  3. **Causal Plausibility**:
     - Story: Metformin is a first-line treatment for type 2 diabetes. If a patient is prescribed metformin, they have diabetes and are at risk of complications. However, note: the data scientists flag leakage because the prescription is downstream of the diagnosis (which is the condition we are trying to predict complications for). But the complication model is for patients with diabetes, so the diagnosis is already present. The feature might be capturing treatment status. The causal story is that metformin use might reduce complications (so negative correlation) but it could also be that patients with more severe diabetes are more likely to be on metformin (so positive). The actual direction in the model is negative (protective).
     - Plausibility: High. Clinical trials show metformin reduces complications. But note: the feature is a treatment indicator, which is downstream of diagnosis. However, in a model for complications among diabetics, it is appropriate. The leakage concern might be overblown because the model is not trying to predict the diagnosis but complications in diagnosed patients.
     - Pass: Yes.

  4. **Entrenchment Check**:
     - Historical usage: Metformin has been used as a feature in diabetes models for decades. In our organization, it has been used for at least 10 years without issues.
     - Longevity: Metformin has been used since the 1990s.
     - Pass: Yes (strongly entrenched).

  5. **Institutional Context Check**:
     - Known changes: There are no known changes to metformin's status as a first-line treatment. However, there are new drugs (e.g., SGLT2 inhibitors) that might be used instead, especially for patients at high risk of complications. But metformin remains the standard.
     - Result: The business (clinical team) confirms that metformin is stable.
     - Pass: Yes.

  6. **Overhypothesis Check**:
     - Overhypothesis: The training data (which includes patients on metformin) is representative of future patients because the treatment guidelines are stable. The relationship between metformin and reduced complications is well-established and unlikely to change. However, if new treatments become dominant, the feature might become less predictive. But metformin is entrenched and likely to remain common.
     - Judgment: The feature passes the overhypothesis check. The entrenchment and stability in clinical practice give high confidence.

  **Verdict for Feature 3**: Passes all checks. The leakage concern is mitigated by the context (the model is for complications in known diabetics). The feature is entrenched and stable.

  ---

  **What the procedure can't do**:

  The procedure cannot guarantee that a model won't blow up. Here are the limitations:

  1. **Unknown unknowns**: The procedure relies on known institutional changes and overhypotheses that the team can articulate. If there is a change that no one anticipates (e.g., a new law that affects the data generating process in an unexpected way), the procedure won't catch it.

  2. **Rare events**: A feature might be stable until a rare event (e.g., a pandemic) that changes everything. The overhypothesis step might not consider such black swans.

  3. **Interaction effects**: The procedure checks features individually. A model might fail because of an interaction between features that individually pass, but the interaction is grue-like.

  4. **Entrenchment blind spots**: A feature that is entrenched might be trusted too much, and the team might overlook a subtle change that breaks it (e.g., a change in billing codes that slowly phases out an old code).

  5. **Overhypothesis errors**: The team might have a false overhypothesis (e.g., "the wearable program will only attract health-conscious members") and the procedure cannot disprove it without data from the future.

  Despite these limitations, the procedure forces the team to think about the key risks and document assumptions, which is a significant improvement over not having such a process.
answer: |-
  Below is a **Goodman-inspired model review procedure** designed to surface grue-like failure modes (features that are projectible in training but break due to institutional shifts). It focuses on *entrenchment* (historical projectibility) and *overhypotheses* (why we believe the training data represents the deployment world). The procedure is structured as a checklist for the **top 10 features** by attribution, with explicit stopping points for human judgment.  

  ---

  ### **The Goodman Review Procedure**  
  **Objective:** Flag features vulnerable to grue-like breaks (stable until an institutional change).  
  **Time Budget:** 1 day of data scientist time, 1 hour of reviewer time per model.  
  **Inputs:** Model documentation, feature definitions, training data, business context from stakeholders.  

  #### **Step 1: Feature Sourcing & Definitional Stability**  
  **Question:** *What is the exact source of this feature, and how has its data-generating process changed in the last 3 years?*  
  **Test:**  
  - Data scientist provides: Source system, ETL logic, and changelog (e.g., database migrations, policy shifts).  
  - Reviewer checks for versioning gaps or undocumented changes.  
  **Pass:** No changes to source/definition in training window.  
  **Fail:** Changes exist without stability testing.  
  **Time:** 15 min/feature (documentation review).  
  **Goodman Link:** Surfaces "artificial predicates" (e.g., hospital film markers) early.  

  #### **Step 2: Entrenchment Assessment**  
  **Question:** *How many independent *past deployments* (not training cycles) have relied on this feature or its close variants?*  
  **Test:**  
  - Data scientist lists: Previous models using similar features (e.g., "prior auth count" in utilization models).  
  - Reviewer scores: 0 (novel), 1 (1–2 models), 2 (≥3 models).  
  **Pass:** Score ≥1.  
  **Fail:** Score = 0 (no deployment history).  
  **Time:** 10 min/feature (cross-check model registry).  
  **Goodman Link:** Entrenchment ≠ causality. It rewards *repeated projectibility* but can mislead if past deployments shared the same blind spots (e.g., all used pre-migration data).  

  #### **Step 3: Causal Plausibility vs. Institutional Coupling**  
  **Question:** *Is this feature’s predictive power likely tied to (a) a stable causal mechanism, or (b) a specific institutional arrangement?*  
  **Test:**  
  - Data scientist provides: Literature/business case for causality (e.g., "metformin reduces complications").  
  - Reviewer stress-tests: *"Would this hold if [upcoming change] happens?"* (e.g., new FDA guidelines, vendor switch).  
  **Pass:** Plausible causal link *and* no critical institutional dependencies.  
  **Weak Pass:** Institutional dependency with mitigation plan (e.g., monitoring).  
  **Fail:** Relies entirely on transient arrangements (e.g., formulary deals).  
  **Time:** 20 min/feature (domain expert consult).  
  **Goodman Link:** Entrenchment beats causality for grue-proofing because causality often assumes *static* mechanisms (e.g., "metformin is always protective"), while entrenchment tracks *actual projection history*. But it misleads if the institution changes (e.g., a new drug displaces metformin).  

  #### **Step 4: Overhypothesis Elicitation**  
  **Question:** *What *overhypothesis* justifies that the training data samples the same population as future data?*  
  **Test:**  
  - Reviewer and data scientist articulate:  
    - *Temporal scope:* "Does the training window cover all relevant seasons/cycles?"  
    - *Institutional scope:* "Are there pending changes (e.g., new clients, regulations)?"  
    - *Population scope:* "Is the feature’s meaning invariant to shifts in provider/member behavior?"  
  **Pass:** Overhypothesis is defensible (e.g., "clinical guidelines won’t change").  
  **Fail:** Overhypothesis is speculative (e.g., "wearable program engagement will stay similar").  
  **Time:** 15 min/feature (discussion).  
  **Handoff to Human:** This step is **non-factual**—it requires stakeholder judgment about the world.  
  **Goodman Link:** Directly addresses Goodman’s "projectibility" by forcing explicit assumptions about the sampling population.  

  #### **Step 5: Break Scenario Simulation**  
  **Question:** *What low-probability, high-impact change would break this feature?*  
  **Test:**  
  - Data scientist proposes: One concrete break scenario (e.g., "vendor switches prior-auth processor").  
  - Reviewer assesses: Likelihood (Low/Med/High) and monitoring plan.  
  **Pass:** Scenario is unlikely *or* mitigations exist.  
  **Fail:** Scenario is likely (e.g., onboarding a new client).  
  **Time:** 10 min/feature (brainstorming).  
  **Goodman Link:** Grue predicates fail abruptly when "time t" (e.g., system migration) arrives. This surfaces institutional tinderboxes.  

  ---

  ### **Verdict Thresholds**  
  - **Pass:** All steps passed.  
  - **Conditional Pass:** 1 weak pass (Step 3) and break scenario unlikely (Step 5).  
  - **Fail:** Any fail in Steps 1–3 or indefensible overhypothesis (Step 4).  

  ---

  ### **Worksheet: Three Feature Examples**  
  *Assumptions:  
  - Attribution measure: SHAP values.  
  - Training window: 2021–2023.  
  - Deployment horizon: 2024.*  

  #### **Feature 1: Count of prior authorizations (High-cost episode model)**  
  | Step | Question | Answer | Verdict |  
  |------|----------|--------|---------|  
  | 1. Sourcing | Source of prior-auth counts? | "Auth requests" table; migrated to new CRM in 2022. | **Weak Pass** (logic unchanged post-migration). |  
  | 2. Entrenchment | Used in past models? | Used in 2020 readmission model (failed post-migration). Score=1. | **Pass** |  
  | 3. Causal vs. Institutional | Tied to severity or workflow? | "Proxy for complexity" BUT dependent on provider’s auth workflow. | **Fail** (Onboarding hospital outsources auth → workflow change). |  
  | 4. Overhypothesis | Why assume stability? | "Provider billing practices are consistent." **BUT** new hospital uses vendor → breaks population scope. | **Handoff: Stakeholders judge risk. Overhypothesis invalid.** |  
  | 5. Break Scenario | What could break it? | "New hospital’s vendor submits 3x more auths." Likelihood: **High**. | **Fail** |  
  **Final Verdict:** **Fail** — Institutional dependency too risky. Mitigation: Remove or monitor vendor flag.  

  #### **Feature 2: "Enrolled in wearable-device rewards" (Low ER utilization)**  
  | Step | Question | Answer | Verdict |  
  |------|----------|--------|---------|  
  | 1. Sourcing | Source of enrollment? | Wellness program DB. No changes. | **Pass** |  
  | 2. Entrenchment | Past usage? | Never used (new program). Score=0. | **Fail** |  
  | 3. Causal vs. Institutional | Why predictive? | "Healthy users self-select" BUT rewards incentivize behavior. | **Weak Pass** (causal mechanism plausible but untested). |  
  | 4. Overhypothesis | Why assume stability? | "Enrollment reflects member health-consciousness." **BUT** if rewards change, engagement drops → signal decays. | **Handoff: Stakeholders must justify if engagement is stable.** |  
  | 5. Break Scenario | Break scenario? | "Program rules change; high-risk members join." Likelihood: **Medium**. | **Pass** (monitor engagement metrics). |  
  **Final Verdict:** **Conditional Pass** — Low entrenchment, but defensible if overhypothesis holds. Monitor enrollment incentives.  

  #### **Feature 3: "Currently prescribed metformin" (Diabetes complications)**  
  | Step | Question | Answer | Verdict |  
  |------|----------|--------|---------|  
  | 1. Sourcing | Source of Rx data? | Pharmacy claims. Stable for 10+ years. | **Pass** |  
  | 2. Entrenchment | Past usage? | Used in 5+ diabetes models since 2010. Score=2. | **Pass** |  
  | 3. Causal vs. Institutional | Causality or artifact? | "Metformin reduces complications (per trials)" — causal. No institutional dep. | **Pass** |  
  | 4. Overhypothesis | Why assume stability? | "Clinical guidelines entrench metformin as first-line." Population scope: Diabetics. | **Handoff: Overhypothesis valid (guidelines stable).** |  
  | 5. Break Scenario | Break scenario? | "New SGLT2 inhibitor replaces metformin." Likelihood: **Low** in 2024. | **Pass** |  
  **Final Verdict:** **Pass** — Entrenchment and causality converge. Leakage risk low (diagnosis already confirmed).  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Silent Institutional Shifts:** It won’t catch changes stakeholders haven’t disclosed (e.g., a hidden plan to retire a system).  
  2. **Overhypothesis Blind Spots:** If reviewers misjudge "population scope" (e.g., assuming wearable engagement is health-driven, but it’s actually a fad), failures occur.  
  3. **Feature Interactions:** A *group* of individually stable features may interact in grue-like ways (e.g., "metformin + prior auth count" breaks if a new insurer policy links them).  
  4. **Slow Decay:** Gradual erosion (e.g., "wearable signal fades over 2 years") may evade break scenarios.  

  **Why Goodman Isn’t "Solved":** This procedure doesn’t eliminate induction’s uncertainty. It forces explicit articulation of *why* we trust a feature, revealing where "projectibility" relies on institutional inertia. As Goodman argued, entrenchment is a social solution—not a logical one—to the grue problem.  

  **Final Output:** A completed worksheet per top feature, with flagged risks handed to stakeholders for judgment. This shifts the conversation from "Does it fit?" to "Why do we trust this in the real world?"
