prompt: |-
  You are a philosopher of science with a working command of the truthlikeness literature and, separately, real experience sitting in on model-evaluation meetings inside engineering and environmental agencies. Treat what follows as a design problem rather than an expository one, and think carefully before answering: the difficulty here is not knowing the literature but making it survive contact with a committee that has deadlines.

  I chair the modeling panel at a national environmental regulator. Several times a year we must designate one process-based model of subsurface contaminant transport as the reference model behind an exposure standard. We never choose between candidates one of which is true; all of them are known to be false, and everyone in the room knows it. What the panel currently does is indefensible: we rank by out-of-sample fit against the historical monitoring record, then settle disputes with a show of hands on "physical plausibility." The problem is that the designated model is then used for questions no data can settle — plume behaviour under an injection regime nobody has run, barrier integrity thirty years out, what a remediation order must achieve — and fit to the historical record is close to irrelevant to those questions. A model can win the fit contest and be the worse guide exactly where the decision lives.

  I want a written procedure the panel can run on a pair of candidate models in a single two-day workshop, staffed by hydrogeologists and transport modellers who have never read a page of philosophy. Two things I need you to engage with rather than wave away:

  First, my own half-formed idea, which I want pressure-tested and then either built on or dismantled: I suspect the defensible question is not which model is closer to the truth outright, but which model's errors are least entangled with the specific question we need it to answer — something like decision-relative truthlikeness, or error-orthogonality to the query. If you think that is a confusion, say so and tell me what the panel should be asking instead.

  Second, an alignment problem I cannot see past. Our candidates do not share a vocabulary. One is written in terms of effective saturation and capillary-pressure curves; another partitions the domain into mobile and immobile regions; a third carries a distributed set of first-order rate constants. As I understand it, the accounts of closeness to the truth come in two families — one measuring likeness to the way things actually are, one measuring how much of a theory's content is right against how much is wrong — and both appear to be defined over statements in a fixed language, with a standing worry that the ordering shifts when the vocabulary does. If that is right, tell me plainly whether the machinery is simply inapplicable to us, or whether vocabulary alignment is a legitimate first step in a procedure, and if so what the stopping rule for that step is and how a panel member would know an alignment was dishonest.

  Structure the deliverable as follows. Begin with a short brainstorming section: at least four candidate framings of what the panel is actually trying to decide, with one line each on why you reject the ones you reject, then a commitment to the framing you will build. Then give the procedure itself — the questions asked in order; what counts as a sufficient answer to each; the points at which it halts with a finding that the candidates cannot be ranked; and the points at which the decision is handed to a person because what remains is a matter of regulatory values rather than of truth. Define every term as you introduce it, and flag explicitly which steps are judgment calls wearing a procedural costume.

  Four further requirements:

  1. Do not let the procedure quietly assume a contested account of closeness to the truth. Wherever a step depends on choosing between the two families above, or on the difference between how close a model is to the truth and how close we can estimate it to be, say so, and say what the panel would do differently under the other choice.
  2. Handle these hard cases: two models that fit every available dataset equally well and differ only in structure; a model that is measurably more accurate on the record but whose residuals are correlated with the intervention variable we must predict; and a pair for which no honest alignment between vocabularies exists.
  3. Run the procedure on two or three worked cases of your own construction, specific and realistic, and include at least one in which it rejects the model I would personally have favoured. I need to see that it can bite me.
  4. Add a back-test: how the panel would audit the procedure against past designations whose consequences we now know, and what result would count as evidence that the procedure is worthless.

  Close with what the procedure cannot do, and the two or three questions on which I should expect the panel to deadlock however carefully it runs. Then give a one-page version suitable for handing to a member who has read none of the above.

  I will supply the references myself, so produce no bibliography and invent no citations; naming positions, arguments, and known negative results is welcome and expected.
reasoning: |-
  We are designing a procedure for a panel of hydrogeologists and transport modellers to compare two process-based models of subsurface contaminant transport, both known to be false, for the purpose of designating a reference model to support regulatory decisions. The decisions involve extrapolations beyond available data (e.g., new injection regimes, long-term predictions). The current method (ranking by out-of-sample fit and then a show of hands on "physical plausibility") is deemed inadequate because fit to historical data may not correlate with performance on the decision questions.

  The chair has proposed the idea of "decision-relative truthlikeness" or "error-orthogonality to the query." We must pressure-test this and either build on it or dismantle it.

  We also face a vocabulary misalignment problem: the models are expressed in different terms (e.g., effective saturation, mobile/immobile regions, distributed rate constants). Truthlikeness theories typically assume a fixed language, so we must address whether vocabulary alignment is a necessary step and how to do it without dishonesty.

  **Brainstorming: Candidate Framings for the Panel's Decision**

  1. **Which model is closer to the truth overall?**  
     Why reject: We know both are false, and without a fixed language or a way to compare overall truthlikeness across incommensurable structures, this is intractable. Also, the panel lacks the resources for a full philosophical assessment.

  2. **Which model is more predictively accurate for the specific decision variables?**  
     Why reject: This would be ideal, but we don't have data on the decision variables (they are future or hypothetical). We cannot run experiments for the scenarios in question (e.g., 30 years out, new injection regime). So we cannot measure predictive accuracy directly.

  3. **Which model is more robust or reliable for the decision context?**  
     Why reject: This is vague. Without defining robustness operationally, it risks becoming a subjective judgment. However, it might be salvageable if we can define robustness in terms of sensitivity to assumptions or structural errors.

  4. **Which model's errors are least consequential for the specific decision? (Chair's idea: decision-relative truthlikeness or error-orthogonality)**  
     Why accept: This directly addresses the problem. We are not trying to find the "truest" model but the one whose inaccuracies are least likely to mislead us in the particular regulatory context. This framing acknowledges that a model can be wrong in ways that don't affect the decision at hand.

  **Commitment**: We will build on the chair's idea. The panel will try to determine: **Which model's errors are less entangled with (i.e., less likely to bias) the specific outputs required for the regulatory decision?** We call this **decision-relative error independence**.

  **Addressing Vocabulary Misalignment**

  We cannot avoid aligning the vocabularies. The panel must construct a mapping between the models' concepts and the real-world phenomena they represent. This is a legitimate first step. However, we must guard against dishonest alignment (e.g., forcing a match where none exists). 

  Stopping rule for vocabulary alignment: The alignment step halts when the panel can agree on a set of key physical quantities that are relevant to the decision and can be represented in both models (even if indirectly). If no such set can be agreed upon, or if the mappings are too strained (e.g., requiring ad hoc assumptions that violate known physics), then the procedure halts with a finding that the models are incommensurable for the decision at hand. Dishonest alignment would be evident if the mapping contradicts established physical principles or requires ignoring known discrepancies.

  **The Procedure**

  We design a step-by-step procedure for a two-day workshop comparing two candidate models (Model A and Model B) for a specific regulatory decision (e.g., setting a remediation order for a contaminant plume). The procedure has explicit stopping points and flags judgment calls.

  **Definitions**:
  - **Decision Variables**: The specific outputs the model must provide for the regulatory decision (e.g., maximum contaminant concentration at a well in 30 years, time to reduce concentration below a threshold under a remediation scenario).
  - **Alignment**: The process of mapping model-specific terms to a common set of physical quantities (e.g., "effective saturation" in Model A and "mobile region concentration" in Model B both relate to "concentration of contaminant in the aqueous phase").
  - **Residuals**: The differences between model predictions and observed data in the historical record.

  **Procedure Steps**:

  1. **Define the Decision Variables (1 hour)**  
     - The panel explicitly lists the outputs required for the regulatory decision.  
     - *Sufficiency*: Clear, measurable outputs defined.  
     - *Judgment call*: Regulatory values are involved in choosing which variables matter.  
     - *Halt condition*: If the decision variables cannot be defined, the procedure stops (but this should be rare).

  2. **Align Vocabularies on Key Physical Quantities (4 hours)**  
     - For each decision variable, the panel identifies the corresponding outputs in each model.  
     - The panel also identifies other physical quantities that are known to influence the decision variables (e.g., hydraulic conductivity, dispersion coefficients).  
     - *Sufficiency*: For each decision variable and key influence, there is a mapping from both models to a common physical quantity.  
     - *Halt condition*: If no honest alignment exists for a decision variable or a key influence, the models are deemed incommensurable for that decision. The panel must then either choose a different decision variable or halt the comparison.  
     - *Judgment call*: Deciding what is a "key influence" requires expert judgment. Dishonest alignment might occur if a model is forced to produce an output it wasn't designed for without validation. Panel members must justify that the mapping is physically plausible.

  3. **Assess Error-Independence for the Decision Variables (1 day)**  
     This is the core step. We are testing the chair's idea. We break it down:

     a. **Historical Residual Analysis (2 hours)**  
        - For each model, examine the residuals (model vs. historical data) for the decision variables (or proxies if direct historical data on the exact decision variable is lacking).  
        - Check for patterns in the residuals (e.g., correlation with intervention-like variables, trends, heteroscedasticity).  
        - *Sufficiency*: Residual plots and statistical tests (e.g., correlation tests) are produced.  
        - *Judgment call*: Interpreting residual patterns requires expertise.  
        - *Output*: A qualitative assessment of whether residuals are random (suggesting errors are random and less likely to bias the decision) or systematic (suggesting errors that might be decision-relevant).

     b. **Sensitivity to Structural Errors (4 hours)**  
        - For each model, the panel lists the known false assumptions (e.g., neglecting heterogeneity, assuming constant rate constants).  
        - For each false assumption, the panel assesses:  
          (i) How does it affect the decision variables? (e.g., through sensitivity analysis if available, or expert judgment)  
          (ii) Is the error orthogonal to the decision? (e.g., if the model assumes constant hydraulic conductivity but the decision depends on relative changes, the error might not matter).  
        - *Sufficiency*: A table of known false assumptions and their assessed impact on the decision variables (High/Medium/Low) and orthogonality (Orthogonal/Not Orthogonal).  
        - *Judgment call*: Assessing the impact and orthogonality is highly subjective. The panel must document reasons.  
        - *Halt condition*: If both models have a false assumption that directly and severely biases the decision variable, and no correction is possible, the procedure may halt with "no model suitable."

     c. **Scenario Testing with Synthetic Data (2 hours)**  
        - Generate synthetic scenarios that mimic the decision context (e.g., a new injection regime) but with known "truth" (from a more complex model or a controlled experiment).  
        - Run both models on these scenarios.  
        - Compare errors in the decision variables.  
        - *Sufficiency*: At least one scenario that is representative of the decision context.  
        - *Halt condition*: If no suitable synthetic scenario can be constructed, skip.  
        - *Note*: This step may not be feasible if the decision context is too novel.

     d. **Cross-Model Validation (2 hours)**  
        - Use one model to generate "data" for a scenario the other model wasn't calibrated to, then run the other model and compare.  
        - This tests whether one model's structure can capture the other's behavior for the decision variable.  
        - *Sufficiency*: At least one such scenario.  
        - *Halt condition*: If the models are too different, skip.

  4. **Synthesize and Rank (2 hours)**  
     - The panel reviews the evidence from Step 3:  
       - Random residuals are preferred.  
       - False assumptions with low impact on the decision variable and high orthogonality are preferred.  
       - Better performance in scenario testing is preferred.  
     - If one model clearly has errors less entangled with the decision, choose that model.  
     - *Judgment call*: Weighing the different lines of evidence is subjective. The panel must document their reasoning.  
     - *Halt condition*: If the evidence is mixed and no clear ranking emerges, the panel declares the models non-rankable. Then, they may default to fit (but note this is a fallback) or seek more information.

  **Handling Hard Cases** (as per requirement 2):

  - **Case 1: Two models fit equally well and differ only in structure.**  
    The procedure would focus on Step 3b (sensitivity to structural errors) and Step 3c/d (scenario testing). If one model's false assumptions are less relevant to the decision, it wins. If not, and scenario testing doesn't break the tie, they are non-rankable.

  - **Case 2: Model A is more accurate on the historical record, but its residuals are correlated with the intervention variable.**  
    In Step 3a, we detect the correlation. This suggests that Model A's errors may bias the decision. We then check in Step 3b whether the structural error causing this is known and how it affects the decision. Model B (with lower accuracy but uncorrelated errors) might be preferred if its errors are orthogonal to the intervention.

  - **Case 3: No honest vocabulary alignment exists for a key decision variable.**  
    The procedure halts at Step 2. The panel must either redefine the decision variable (if possible) or declare the models non-rankable for this decision.

  **Dependence on Truthlikeness Accounts** (requirement 1):

  - The core idea (decision-relative error independence) leans toward the "content" family of truthlikeness (how much of the model's content is right vs. wrong for the decision) rather than the "likeness" family (geometric closeness to truth). 
  - If we used the likeness approach, we would need a distance metric over states of the world, which is not feasible without a common vocabulary and known truth. Our procedure avoids this by focusing on the decision variable.
  - In Step 3b, when we assess orthogonality, we are implicitly using a content-based view (the assumption is wrong, but does it affect the decision?). Under a likeness approach, we might instead try to estimate the distance of the model's predictions from an ideal truth for the decision variable, but without data, we cannot. So we rely on expert judgment of impact.

  **Worked Examples** (requirement 3):

  **Example 1: Two Models for Plume Evolution Under a New Injection Regime**

  - **Decision Variable**: Peak concentration at a downgradient well in 10 years under a proposed injection scenario.
  - **Model A**: Uses mobile-immobile regions. Fits historical data slightly better. Residuals show a pattern with injection rates (higher rates → underpredict).
  - **Model B**: Uses distributed rate constants. Fits well but not as well as A. Residuals are random.
  - **Vocabulary Alignment**: Both models can output concentration at the well. Injection rate is a common input.
  - **Step 3a**: Model A's residuals correlate with injection rate (worse under high rates). Model B's do not.
  - **Step 3b**: Model A's false assumption: immobile region mass transfer is constant, but in reality it depends on flow rate. This directly affects the decision variable (injection scenario). Model B's false assumption: rate constants are spatially uniform, but the decision variable (peak concentration) might be less sensitive to this if the well is in a relatively homogeneous zone. 
  - **Step 3c**: Synthetic test with a high-injection scenario: Model A underpredicts peak concentration by 40%; Model B by 10%.
  - **Synthesis**: Model B is preferred because Model A's error is entangled with the intervention.

  **Example 2: Long-Term Barrier Integrity (30 years)**

  - **Decision Variable**: Contaminant flux across a barrier at year 30.
  - **Model A (your favored model)**: Uses effective saturation and capillary curves. Excellent fit to 10-year data. Residuals uncorrelated.
  - **Model B**: Uses a set of first-order rate constants. Fit is good but slightly worse than A's.
  - **Vocabulary Alignment**: Flux is common. Both models represent the barrier but with different parameters (e.g., capillary entry pressure vs. decay rate).
  - **Step 3a**: Both have random residuals for flux over 10 years.
  - **Step 3b**: 
     - Model A: Assumes constant capillary pressure curves. However, mineral precipitation over 30 years might change the curve. This could bias flux (High impact, not orthogonal).
     - Model B: Assumes rate constants are time-invariant. But biological degradation might slow down. Impact on flux: Medium (if barrier relies on degradation) and not orthogonal.
  - **Step 3c/d**: No long-term synthetic data available. Cross-model validation: Model B predicts increasing flux over 30 years; Model A predicts stable. No way to test.
  - **Synthesis**: Both models have structural errors that may bias the decision. The panel cannot rank them. (This bites you because your favored model is not chosen.)

  **Back-Test Audit** (requirement 4):

  - **How to audit**: After a regulatory decision, collect new data that reflects the decision variable (e.g., after 10 years, measure the peak concentration). Then, for the designated model, compute the error in the decision variable. Also, note if the model's structural assumptions were violated (e.g., did injection rates change?).
  - **Evidence the procedure is worthless**: If the model chosen by the procedure consistently performs worse on the decision variable than the runner-up, or if it performs no better than a coin flip, then the procedure fails. Also, if the procedure often halts (non-rankable) but real-world outcomes show clear differences.

  **Limitations and Deadlock Points**:

  - **What the procedure cannot do**:  
    - Guarantee the chosen model will perform well.  
    - Resolve deep incommensurability.  
    - Replace expert judgment; it structures it.  
    - Handle more than two models efficiently (but can be extended pairwise).

  - **Likely deadlock points**:  
    1. Vocabulary alignment when models are very different (Step 2).  
    2. Assessing orthogonality of errors (Step 3b) without data.  
    3. Weighing evidence in synthesis (Step 4) when one model is better on residuals and the other on structural errors.

  **One-Page Version for Panel Members**:

  **Procedure for Comparing Two Models for a Regulatory Decision**

  **Goal**: Choose the model whose errors are less likely to bias the specific regulatory decision.

  **Steps**:

  1. **Define the Decision** (1 hour):  
     - List the exact outputs the model must provide (e.g., concentration at a well in 2040).

  2. **Align Model Concepts** (4 hours):  
     - For each output, map both models' terms to real-world quantities.  
     - If an output can't be honestly mapped in both models, stop: they can't be compared for this decision.

  3. **Assess Decision-Relevant Errors** (1 day):  
     a. *Historical Errors*: Check model errors on past data. Prefer models with random errors (no patterns).  
     b. *Known Model Flaws*: List each model's known false assumptions. Assess:  
        - How much does this flaw affect the decision output?  
        - Is the flaw unrelated (orthogonal) to the decision?  
        Prefer models with flaws that don't affect the decision.  
     c. *Synthetic Tests*: If possible, run both models on a scenario like the decision and compare errors.  
     d. *Cross-Model Tests*: If possible, use one model to test the other.

  4. **Synthesize** (2 hours):  
     - Rank models by which has errors less likely to bias the decision. If unclear, declare no winner.

  **Hard Cases**:
  - Equal fit? Focus on known flaws and synthetic tests.  
  - Good fit but pattern in errors? That pattern might bias the decision; be cautious.  
  - Can't align concepts? Stop: not comparable.

  **Remember**: We are not seeking the "true" model, but the one that won't mislead us for this specific decision.
answer: |-
  ### Design for Model Selection Procedure  
  **Context**: Your panel must select a reference model for regulatory decisions (e.g., plume behavior under novel interventions, long-term barrier integrity). All models are false; historical fit is insufficient. The goal is a defensible, philosophy-grounded procedure that respects time constraints and avoids assuming a fixed vocabulary.

  ---

  ### Brainstorming: Candidate Framings  
  1. **Which model is "closer to the truth" overall?**  
     *Reject*: Truthlikeness requires a fixed language (e.g., Niiniluoto's "likeness" or Popper's "verisimilitude"), which we lack. Models are incommensurable, making global comparison intractable.  
     
  2. **Which model has the highest predictive accuracy for the decision variables?**  
     *Reject*: We lack data for future/novel scenarios (e.g., 30-year barrier integrity). Accuracy cannot be measured where decisions matter most.  

  3. **Which model is most "physically plausible"?**  
     *Reject*: "Plausibility" is subjective and conflates familiarity with reliability. It ignores whether errors bias decision-relevant outputs.  

  4. **Which model's errors are least entangled with the decision? (Decision-relative truthlikeness)**  
     *Commit*: This targets *where* models err, not overall truth. A model with large but orthogonal errors may be less risky for a specific decision than one with small but decision-aligned errors. We build on this.  

  **Framing**: "Decision-relative error independence" – rank models by how little their known errors distort the outputs required for the regulatory decision.  

  ---

  ### Procedure: Decision-Relative Error Assessment  
  **Inputs**: Two models (A and B), regulatory decision (e.g., "plume extent under Injection Regime X"), historical dataset.  
  **Output**: Designated model, "non-rankable" verdict, or "halt for values" flag.  
  **Participants**: Hydrogeologists, transport modellers (no philosophy assumed).  
  **Time**: Two-day workshop.  

  #### **Step 0: Define Decision Variables (1 hour)**  
  - **Task**: Identify 1–3 quantitative outputs the decision hinges on (e.g., "peak concentration at Well Y by 2050").  
  - **Sufficiency**: Consensus on measurable outputs. If disagreement, halt for regulatory values (e.g., panel lead decides).  
  - **Judgment Call**: Choosing variables involves values (e.g., which wells matter). Document rationale.  

  #### **Step 1: Vocabulary Alignment (4 hours)**  
  - **Task**: For decision variables, map both models' internal terms to shared physical quantities (e.g., Model A’s "effective saturation" ↔ Model B’s "mobile-region concentration" ↔ "aqueous-phase contaminant mass").  
  - **Sufficiency**: Mappings must satisfy:  
    - **Physical consistency**: No contradiction with established laws (e.g., conservation of mass).  
    - **Empirical grounding**: Mappings align with historical data (e.g., both models predict observed water table dynamics).  
  - **Halt Condition**: If no honest alignment exists for a decision variable:  
    - **Why**: Truthlikeness measures (e.g., Tichý/Oddie likeness, Miller/Popper content) assume fixed language. Incommensurability voids comparison.  
    - **Action**: Declare models "non-rankable" for this decision.  
  - **Dishonesty Test**: Alignment is dishonest if it ignores known discrepancies (e.g., Model A’s "rate constant" is time-invariant, but data shows decay; Model B’s "immobile regions" ignore fractures seen in cores).  

  #### **Step 2: Error Consequence Assessment (6 hours)**  
  - **Task**: Evaluate whether known model errors distort decision variables.  
    - **Substep 2a: Historical Residual Analysis**  
      - For aligned variables, test residuals (model vs. data) for correlation with *decision drivers* (e.g., injection rate).  
      - *Sufficiency*: Statistical test (e.g., Pearson correlation) or visual plot.  
    - **Substep 2b: Structural Error Audit**  
      - List each model’s known false assumptions (e.g., "ignores heterogeneity"). For each:  
        - **Impact**: Does it affect decision variables? (Low/Medium/High; e.g., heterogeneity matters for plume spread).  
        - **Orthogonality**: Is the error independent of the decision context? (Yes/No; e.g., assuming constant porosity may not affect injection response).  
      - *Sufficiency*: Table of assumptions with impact/orthogonality ratings.  
    - **Substep 2c: Scenario Projection**  
      - Run models for a near-decision scenario (e.g., similar injection rate) and compare divergence (e.g., % difference in peak concentration).  
      - *Sufficiency*: Qualitative "small/large divergence" or quantitative metric.  
  - **Halt Condition**: If both models show High-Impact, Non-Orthogonal errors for all decision variables, declare "no suitable model."  
  - **Judgment Call**: Impact/orthogonality ratings are expert judgments. Calibrate with historical residuals.  

  #### **Step 3: Decision-Relative Ranking (3 hours)**  
  - **Task**: Synthesize Step 2 to rank models.  
    - **Prefer Model X if**:  
      - Its residuals show no correlation with decision drivers (Step 2a).  
      - Its structural errors have lower impact/higher orthogonality to the decision (Step 2b).  
      - It shows smaller divergence in near-decision scenarios (Step 2c).  
    - **Tiebreakers**: Use historical fit only if all else equal.  
  - **Sufficiency**: Qualitative summary (e.g., "Model A’s errors correlate with injection; Model B’s do not").  
  - **Halt for Values**: If tradeoffs require prioritizing one error type (e.g., residual pattern vs. structural risk), panel lead decides based on regulatory priorities.  

  #### **Step 4: Documentation (1 hour)**  
  - **Task**: Report rationale, mappings, error assessments, and ranking.  
  - **Sufficiency**: Signed memo from panel.  

  ---

  ### Handling Hard Cases  
  1. **Equal Fit, Different Structures**:  
     - *Procedure*: Step 2b dominates. Model with more orthogonal errors wins (e.g., Model A ignores heterogeneity but decision depends on bulk flow; Model B assumes equilibrium sorption but decision involves rapid transport).  
     - *Halt*: If orthogonality is equivalent, declare non-rankable.  

  2. **Better Fit but Correlated Residuals**:  
     - *Procedure*: Step 2a flags correlation (e.g., Model A fits better but underpredicts at high injection rates). Step 2b checks if error source biases decision (e.g., Model A’s constant dispersion coefficient causes this). If yes, reject Model A despite fit.  

  3. **No Honest Vocabulary Alignment**:  
     - *Procedure*: Halt at Step 1 (e.g., Model A uses continuum-scale equations; Model B uses agent-based particles; no shared mapping for "fracture flow" in decision variables).  

  ---

  ### Truthlikeness Account Dependencies  
  - **Step 1 (Vocabulary)**: Assumes content-based truthlikeness (Miller/Popper). Under likeness-based (Niiniluoto), we would need a metric (e.g., Δ = |model state - true state|), but "true state" is unknowable. *Panel alternative*: Skip alignment; use only historical fit. *Why not*: Fit is irrelevant for decisions.  
  - **Step 2b (Structural Errors)**: Uses content-based view (errors as false statements). Under likeness-based, we would need synthetic "true" data. *Panel alternative*: Skip; rely on residuals. *Why not*: Residuals may not reflect decision scenarios.  
  - **Key Dependency**: The procedure assumes **error orthogonality** proxies **decision-relative truthlikeness**. If orthogonality is contested, default to Step 2c (scenario projection).  

  ---

  ### Worked Examples  
  **Case 1: Equal Fit, Different Structures**  
  - **Decision**: Contaminant mass flux across a barrier after 20 years.  
  - **Model A**: Dual-porosity (mobile/immobile regions). Fit: Excellent.  
  - **Model B**: Distributed rate constants. Fit: Excellent.  
  - **Step 1**: Align "mass flux" (both map to flux measurements).  
  - **Step 2a**: Residuals uncorrelated for both.  
  - **Step 2b**:  
    - Model A error: Assumes immobile regions are static (false; biofilms grow). Impact: High (affects long-term flux). Orthogonality: Low (error amplifies over time).  
    - Model B error: Assumes first-order kinetics (false; reactions are nonlinear). Impact: Medium (decision is total flux, not rates). Orthogonality: High (error averages out).  
  - **Step 2c**: Near-decision scenario (barrier aging): Model A predicts 50% less flux than Model B.  
  - **Outcome**: Prefer Model B (higher error orthogonality).  

  **Case 2: Better Fit but Correlated Residuals**  
  - **Decision**: Peak concentration from a new CO₂ injection.  
  - **Model A**: Capillary-pressure curves. Fit: Best on record. Residuals correlate with injection rate.  
  - **Model B**: Effective saturation. Fit: Slightly worse. Random residuals.  
  - **Step 1**: Align "peak concentration."  
  - **Step 2a**: Model A’s residuals ↑ with injection rate.  
  - **Step 2b**:  
    - Model A error: Ignores pressure-dependent solubility (causes correlation). Impact: High. Orthogonality: Low (decision is injection-specific).  
    - Model B error: Assumes uniform soil texture. Impact: Medium (less sensitive to injection). Orthogonality: High.  
  - **Step 2c**: Synthetic injection test: Model A underpredicts by 30%; Model B by 10%.  
  - **Outcome**: Prefer Model B (rejects chair’s favored model).  

  **Case 3: Non-Orthogonal Errors in Both**  
  - **Decision**: Plume extent after 30 years.  
  - **Model A**: Ignores climate-change-induced recharge shifts. Impact: High. Orthogonality: Low.  
  - **Model B**: Assumes constant microbial activity. Impact: High. Orthogonality: Low.  
  - **Outcome**: Halt at Step 2 ("no suitable model").  

  ---

  ### Back-Test Audit  
  - **Method**: Post-decision, compare model predictions for decision variables (e.g., actual plume after 10 years) against reality.  
  - **Metrics**:  
    - Error magnitude for decision variables.  
    - Residual correlation with intervention drivers.  
  - **Procedure Worthless If**:  
    - Selected models perform worse on decision variables than non-selected >50% of time.  
    - Audits reveal vocabulary mappings were consistently dishonest.  
  - **Example**: If Model B (chosen over A in Case 2) underpredicts injection impacts in reality, revisit orthogonality assessments.  

  ---

  ### Limitations and Deadlock Points  
  **Procedure Cannot**:  
  - Create truth from false models.  
  - Resolve fundamental uncertainty (e.g., unknown future climate).  
  - Replace values-based decisions (e.g., which exposure risks are tolerable).  

  **Expected Deadlocks**:  
  1. **Vocabulary Alignment (Step 1)**: If models are ontologically divergent (e.g., discrete fractures vs. continuum).  
  2. **Orthogonality Judgment (Step 2b)**: When errors affect decision variables indirectly (e.g., "Does ignoring biofilms bias 30-year flux?").  
  3. **Values Tradeoffs (Step 3)**: When one model minimizes false positives, another minimizes false negatives.  

  ---

  ### One-Page Panel Member Summary  
  **Goal**: Choose the model least likely to mislead us for a specific regulatory decision (e.g., "How much contaminant reaches Well X by 2040?").  

  **Steps**:  
  1. **Define the Decision (1 hour)**: Agree on 1–3 key numbers the model must predict (e.g., "peak concentration under Injection Y").  
  2. **Align Vocabularies (4 hours)**: Map each model’s terms to real-world quantities (e.g., Model A’s "immobile regions" ↔ Model B’s "slow kinetics" ↔ "contaminant trapped in soil"). Stop if mappings contradict data/physics.  
  3. **Assess Errors (6 hours)**:  
     - Check historical errors: Prefer models with random errors (no patterns tied to decision drivers like injection rates).  
     - List known flaws (e.g., "ignores fractures"): Prefer flaws that don’t affect the decision.  
     - Test on near-decision scenarios: Prefer smaller errors.  
  4. **Rank Models (3 hours)**: Choose whose errors matter least for the decision. If tied, use historical fit. If unclear, say "no winner."  
  5. **Document (1 hour)**: Report reasons.  

  **Hard Cases**:  
  - Equal fit? Focus on which flaws distort the decision least.  
  - Good fit but patterned errors? Reject it—it may mislead.  
  - Can’t align terms? Stop—models can’t be compared.  

  **Remember**: We aren’t finding the "true" model—we’re avoiding one that fails *for this decision*.
