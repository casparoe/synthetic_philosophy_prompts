prompt: |-
  Okay so I'm a junior and I'm on this committee at my school that runs the Falcon Fund, which is like $6,000 a year left over from a graduation-class donation plus some bake sale money, and we hand out $50 gift cards and pay a few bills directly for students whose families are struggling. There's 8 of us (all students), our faculty advisor Ms. Okafor, and the student body president has to actually sign the check. There's basically three rules we inherited from last year's committee and nobody's ever questioned them. One, there's an approved list: phone bill yes, bus pass yes, work boots yes, groceries yes, car insurance no, car repair no, prom stuff no, "anything that isn't obviously necessary" no. Two, the Quiet Rule, which is that nobody outside the committee ever finds out who got money, not even the person's counselor unless we ask. Three, this thing they call the Need Score — you start at 10 points and you lose 2 if the applicant has a paying job, lose 2 if there's a car in the household, lose 1 for each "non-essential purchase" a committee member can name, and you gain 3 for a documented crisis (eviction notice, death, hospital bill) and 2 for "demonstrated effort," which means they came to the money-management workshop we run in October. The student body president loves the Need Score because he says it's objective and protects us from accusations of favoritism.

  Here's the problem. We have an application in from a junior — I'll just call him D because the Quiet Rule, and also he's in two of my classes. His dad got his hours cut at the warehouse in September, D works like 22 hours a week stacking at a grocery store for $11 an hour, and what he's actually asking us for isn't groceries, it's the $180 to renew his car insurance. His reasoning is that without the car he can't get to the store, and if he loses the job his family loses the whole income. But here's the part that messes me up: his grades dropped from a B average to two Ds this semester, and he told Ms. Okafor offhand that he's closing shifts until 11pm on school nights. So the money that keeps him employed might be the thing that's actually pushing him out of school, and the original donation letter — I read it, it's one paragraph — says the fund exists "to help students stay in school." Under the Need Score he comes out at like 4, which is below our cutoff of 6, mostly because he has a job and a car. Our treasurer, Ben, wants to approve a reduced amount on conditions: D shows 15 weeks of pay stubs and signs up for the workshop and does 4 hours of volunteering at the food drive, and then we'll reimburse half the insurance. Ben's argument, which he made at lunch and half the committee agreed with, is that if we hand cash-ish stuff to a kid who has a job and a car and, he says, "brand new Air Jordans," then we're rewarding the wrong people, the fund will run dry by March, and the kid who was too proud to apply gets nothing while somebody who did apply gets a free ride. I kept trying to say that the Jordans were a Christmas gift from his grandmother and that I know this because D sits behind me in English, but I couldn't figure out how to say the rest of it without sounding like I just think Ben is mean.

  Can you write the memo I'll hand around before Thursday's meeting? I want it to do two things. First, a clear recommendation on D's application — approve, approve-with-conditions, deny, or approve something different than what he asked for — with a dollar figure and a date, because Ms. Okafor says we can't just "discuss it." Second, a proposed fix to the rules for the rest of the year, especially the Need Score and the approved-items list, with criteria the committee could actually apply to the next applicant without arguing for an hour. Ben is smart and he's not a villain, so the memo has to take his version of the worry seriously — the fraud thing, the running-out-of-money thing, and the fairness-to-the-kid-who-didn't-apply thing — and say why the recommendation is still better, not just gesture at compassion. Also flag anything in there that we should NOT put in writing or read out loud, because of the Quiet Rule. No works cited or anything, I don't need book recommendations, I need something I can hand to eight teenagers and one tired teacher. Its due Wednesday night so keep it to about two pages, and if you think I'm wrong about Ben just say so in the memo, that's fine too.
reasoning: |-
  Okay, the user is a junior on a school committee managing the Falcon Fund. They have an application from a student, D, who needs $180 for car insurance to keep his job. The committee's rules, especially the Need Score, might prevent approval. The user needs a memo for their meeting addressing D's case and proposing rule changes.

  First, I need to understand the key issues. D's situation: his dad's hours were cut, he works 22 hours a week, and without the car, he loses his job. But working late affects his grades. The fund's purpose is to help students stay in school. The Need Score gives him 4, below the cutoff of 6, because he has a job and a car. Ben suggests conditional approval with stipulations like pay stubs, workshop, and volunteering.

  The user wants a memo with two parts: a clear recommendation on D's application and proposed fixes to the rules. They also need to address Ben's concerns about fraud, fund sustainability, and fairness without making Ben seem like a villain. Plus, note anything sensitive due to the Quiet Rule.

  For D's application: Approve with conditions makes sense, but Ben's conditions might be too burdensome. Instead, approve the $180 for insurance directly paid to the provider. Avoid reimbursement; D might not have upfront money. Stipulations should focus on school retention: mandatory money management workshop and academic check-ins. Volunteering might add stress, so skip that. Emphasize that the car is essential for his job, which supports his family, aligning with the fund's goal of keeping kids in school. Disregard the Need Score here since it doesn't capture the nuances.

  Ben's concerns: Fraud risk—address by paying the insurer directly. Fund sustainability—$180 is under 3% of the $6000 fund, manageable. Fairness—the committee should focus on applicants, not hypotheticals. The Jordans were a gift, so not relevant. Highlight that the Need Score penalizes having a job, which is counterproductive.

  Rule changes: The Need Score is flawed. It deducts points for having a job or car, which are necessities for some. Replace it with core questions: Is there a barrier to school attendance? Is the request essential? What's the impact of not helping? Approved items list needs updating—car insurance should be included if it's critical for employment. Keep the Quiet Rule; it's good for privacy.

  Sensitive info: Avoid mentioning D's grades, specific job hours, or family details in the memo. Use general terms to protect his identity. The memo should be factual, respectful, and solution-focused.

  Structure the memo: Start with the recommendation for D, then the rule proposals. Use bullet points for clarity. Keep it under two pages. Make sure the tone is collaborative, acknowledging Ben's points but showing why the recommendation is better.

  Finally, check that the user's deeper needs are met. They want fairness and compassion, sustainability of the fund, and efficient decision-making without lengthy arguments. The memo should provide a framework that balances these, making the process more humane and effective.
answer: |-
  ## MEMORANDUM  
  **TO:** Falcon Fund Committee Members & Ms. Okafor  
  **FROM:** [Your Name], Committee Member  
  **DATE:** October 31, 2023  
  **SUBJECT:** Recommendation re: Application #23-J-11 (D) & Proposed Rule Revisions  
  **CONFIDENTIAL:** Destroy after discussion. Do not circulate beyond committee. (Quiet Rule)

  **I. RECOMMENDATION: APPLICATION #23-J-11 (D)**  
  **Approve:** $180 payment **directly to D's car insurance provider** (not to D).  
  **Timing:** Process payment immediately upon verification of insurance renewal invoice/due date.  
  **Conditions:**  
  1.  **Mandatory Attendance:** D attends the next scheduled Money Management Workshop (November session).  
  2.  **Academic Check-in (Non-Punitive):** Ms. Okafor (or designated counselor) connects with D mid-semester (early Dec) *solely* to offer academic support resources, *not* as a condition for payment or to report back specifics to the committee (protecting Quiet Rule & dignity).  
  **Rationale:**

  1.  **Core Mission Alignment:** The fund exists "to help students stay in school." D's job is critical family income. Losing his car directly threatens his job. Threatening his job directly threatens his ability/necessity to stay in school.
  2.  **The Car is a Work Tool, Not a Luxury:** In D's case, the car is essential transportation *to his job*. Without it, his income stops. This distinguishes it from "car insurance" denied for leisure or non-essential commuting. It functions like "work boots" – necessary employment equipment.
  3.  **Addressing Ben's Valid Concerns Seriously:**  
      *   **Fraud/Rewarding "Wrong" Behavior:** Paying the provider *directly* eliminates cash diversion risk. The "Air Jordans" (reportedly a gift) are irrelevant to the *specific, documented necessity* of car insurance for employment. We judge the *request*, not perceived lifestyle based on isolated items. Approving this doesn't reward "gaming"; it prevents a documented income collapse.
      *   **Fund Sustainability:** $180 represents ~3% of our $6000 annual fund. Denying this based on flawed criteria risks costing the fund *more* later if D loses his job/family stability deteriorates, potentially requiring larger interventions (groceries, utilities). This is a targeted, preventative investment in stability.
      *   **Fairness to Non-Applicants:** We can only assess applicants before us. This applicant demonstrates clear need tied directly to school retention (employment enabling attendance). Our duty is to help *verified* need within our mission. Hypothetical "more deserving" students cannot factor into *this* decision. This approval sets no precedent for non-essential car requests.
  4.  **The Need Score Flaw:** D scores low (4) primarily *because* he has a job (deduct 2) and a car (deduct 2) – the very things underpinning his need! The score penalizes the coping mechanisms (work, essential transport) keeping him afloat, failing to capture the *interdependence* of his situation or the *consequence* of removing one support (the car). Strict adherence here would contradict the fund's purpose.
  5.  **Grades & Workload:** While deeply concerning, these are *symptoms* of the underlying strain, not the primary request factor. The academic check-in (Condition 2) addresses this compassionately *without* making our aid conditional on academic performance, respecting the fund's purpose and avoiding undue pressure.

  **II. PROPOSED RULE REVISIONS FOR REMAINING YEAR**  
  Our current rules, while well-intentioned, create rigidity that can exclude valid needs (like D's) and cause lengthy debates. We need clearer, more mission-focused criteria.

  **A. Replace the "Need Score" with Core Questions:**  
  Instead of points, require "Yes" to **ALL** of these for approval:  
  1.  **Barrier to School Attendance/Success:** Does the request directly address a *documented barrier* (financial, logistical, health-related) threatening the student's ability to attend school regularly or succeed academically? (e.g., lack of food, essential work equipment, urgent medical co-pay, eviction preventing stable study).  
  2.  **Essential & Direct:** Is the requested item/service demonstrably essential *and* the most direct way to address the barrier? (e.g., Insurance for work car = essential & direct. Prom ticket ≠ essential).  
  3.  **Impact of Non-Help:** Is the consequence of *not* providing help likely to significantly worsen the student's ability to stay in school? (e.g., losing job/housing vs. minor inconvenience).  
  4.  **No Reasonable Alternative:** Has the student/family exhausted reasonable alternatives (payment plans, community resources where accessible, family support)? (We don't require destitution, just evidence the need is genuine and pressing for *them*).

  **B. Revise the "Approved List" to Principles:**  
  Replace the rigid "Yes/No" list with:  
  *   **"Presumptively Approved"**: Groceries (via store card), Utilities (direct pay), Essential Work/School Supplies (incl. work boots, specific tech if required), Essential Medical Co-pays, Basic Phone Plan (connectivity for work/school/safety), Emergency Shelter/Housing Support, Essential Transportation Costs (**including car insurance/repair IF proven critical for employment/school attendance**).
  *   **"Requires Strong Justification"**: Items not on the above list. Applicant must clearly demonstrate how it meets ALL Core Questions (especially #1 and #2). Examples: Specific school fees not covered elsewhere, essential clothing beyond basics, non-standard transportation costs. *Prom, non-essential electronics, car insurance for non-work commuting remain unlikely to qualify.*
  *   **"Generally Not Approved"**: Cash without specific payee, luxury items, non-essential fees, fines, entertainment. (Clearer than "obviously necessary").

  **C. Maintain & Strengthen the Quiet Rule:**  
  *This rule is essential for dignity and trust.* Add: Committee discussions remain confidential. No specifics about applicants (names, situations, requests) discussed outside meetings, even vaguely. Approved requests referred to by application number only in minutes/finances.

  **D. Addressing Ben's Concerns Systematically:**  
  *   **Fraud/Misuse:** Mandate direct payments to providers/vendors whenever possible (utilities, insurers, landlords, stores). Require documentation (bill, invoice) justifying *specific* payee and amount. For groceries/gas, use restricted gift cards. **Benefit:** Tangible, verifiable help; reduces cash handling.
  *   **Fund Sustainability:** Implement a **"Tiered Approval"** guideline (informal, not rigid):  
      *   Requests <$100: Committee Chair + Treasurer + Advisor can approve between meetings if Core Questions met (report next meeting).  
      *   Requests $101-$300: Full committee approval required.  
      *   Requests >$300: Full committee approval + requires stronger documentation/justification.  
      **Benefit:** Streamlines small requests, focuses committee time on larger/more complex cases, ensures oversight for significant funds.
  *   **Fairness/Perception:** Consistently apply the **Core Questions** to every applicant. Document the justification briefly in application notes (using application number only). Trust the process and our collective judgment based on evidence, not comparisons or assumptions about non-applicants.

  **III. Sensitive Information - Do Not Document/Discuss Publicly:**  
  *   **Specific Identifiers:** D's name, his classes, his specific grades, his father's employer/job loss details, his exact work schedule/hours, the specific "non-essential purchase" (Jordans) mentioned. (Refer only to "the applicant" or "Application #23-J-11" in writing/minutes).
  *   **Personal Details Shared Informally:** D's conversation with Ms. Okafor about shifts/grades. This should inform compassion but not be minuted or debated explicitly.
  *   **Committee Disagreements:** Avoid characterizing Ben's (or others') positions as "mean" or "unfair." Focus on the *reasoning* and *impact* of different approaches using the Core Questions and mission.

  **Conclusion:**  
  Approving D's car insurance payment directly is the right call under our mission and addresses the immediate threat to his school attendance. Ben raises crucial systemic concerns about integrity and sustainability. The proposed rule changes (Core Questions, Principles-Based List, Tiered Approval, strengthened Quiet Rule) directly address these concerns by creating a clearer, fairer, more efficient, and mission-focused framework. They move us from arbitrary scoring and lists towards principled judgment, protecting the fund while ensuring it serves its true purpose: helping students stay in school. Let's discuss and vote on both D's application and these proposed rule revisions on Thursday.  

  **Respectfully submitted,**  
  [Your Name]  

  ---  
  **Key for Thursday's Discussion:**  
  *   **Vote 1:** Approve Application #23-J-11 per recommendation ($180 direct pay, conditions)? (Y/N)
  *   **Vote 2:** Adopt proposed Core Questions to replace Need Score? (Y/N)
  *   **Vote 3:** Adopt Principles-Based Approved List? (Y/N)
  *   **Vote 4:** Adopt Tiered Approval guidelines & strengthen Quiet Rule protocols? (Y/N)
