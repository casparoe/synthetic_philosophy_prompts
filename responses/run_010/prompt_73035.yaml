prompt: |-
  Been reading the persistence debate on and off for about a year now (amateur, day job is nowhere near philosophy) and there's a structural feature of it I can't find a name for. I want to know whether I've just missed the term or whether the term doesn't exist.

  Here's what I keep seeing. Somebody offers a case that's supposed to be decisive — the road that's straight in one stretch and curved in the next, the person who had straight hair as a kid and curly hair now, the lump of clay that survives being squashed into a ball when the statue doesn't. One side says: easy, the object has different properties at different times because it has different temporal stretches, and the statue/clay business is two worms sharing stretches. The other side says: no, the object is entirely there at each moment and has the property relative to that moment, and the statue/clay business is two things in one place. Then — and this is the part — each side says of the other's story that it's just their own story in different words. The endurantist says relativizing to times is exactly what you'd get if you took temporal stretches seriously but wouldn't say the word. The four-dimensionalist says "wholly present at t" is just "the temporal part at t" with a hat on it. And as far as I can tell they're both right about the translatability, atleast for every case that's actually been proposed. Nobody ever produces an example where the other side's vocabulary genuinely runs out.

  So there's a permanent tie at the level of cases. But the striking thing is that neither side concludes the dispute is empty. They both grant that anything one can say the other can translate, and they both still think there's a hard fact about which way of describing the world is better — more natural, carves at the joints, whatever — and that *that's* where the disagreement really lives. The disagreement has migrated from the cases up into the choice of description language, and it's still supposed to be a real disagreement about the world rather than about words.

  Does that configuration have a name? I can see several near-misses and I want to know which, if any, is the right one, and where exactly the thing I described sits relative to each:

  - a merely verbal dispute, where nothing is at stake — except here both sides insist something is at stake and they seem to have a candidate for what it is;
  - underdetermination of theory by evidence — except there's no shortage of evidence, the two accounts are equivalent on all the evidence in principle, not just on the data we happen to have;
  - "notational variant" in the old sense — which is what each side calls the other, but it's being used as a jab inside a live dispute rather than as a verdict that the dispute is finished;
  - something like a disagreement about which concept to adopt, where the interesting wrinkle is that both sides deny that's what they're doing.

  Please don't just hand me a label, that's the easy bit. What I want is the carving: what exactly is this phenomenon (a dispute that's intertranslatable at the level of every possible case but claimed to be substantive at the level of which description is fundamental), what is it *not*, and where are the edges — at what point does it stop being this and start being a plain verbal dispute, and at what point does it turn into ordinary theory choice between empirically equivalent rivals? If there's no established name, coin one, define it, and give me a nearby case that falls outside it so I can see the boundary. And tell me whether there's an exact parallel somewhere else — I have a vague suspicion the philosophy-of-science literature has the same shape of argument under a different label, but I don't know it.

  No bibliography needed and don't worry about references, I'm not chasing down papers. I just want to know whether I've rediscovered something or invented something.
reasoning: |-
  Okay, the user has been following the persistence debate in philosophy for about a year as an amateur. They've noticed a pattern where both endurantists and perdurantists can translate each other's explanations for any given case, yet both insist there's a substantive disagreement. The user wants to know if this phenomenon has a name and how to properly understand its structure.

  First, I recognize this pattern from metaphysics. The key is that both theories are empirically equivalent—they handle all cases the same way—but disagree on the fundamental ontology. The user mentioned examples like the road changing shape or the statue and clay. Each side claims the other is just rewording their own view. That’s spot on.

  The user listed near-misses: verbal dispute, underdetermination, notational variants. But those don't fit because both sides agree there's a real disagreement about fundamentality. So it's not merely verbal. Underdetermination usually involves empirical equivalence due to lack of evidence, but here the equivalence is principled. Notational variant is used pejoratively, but the dispute persists.

  I recall this is often called "merely verbal" by critics, but metaphysicians like Sider argue it's about joint-carving. The core is ontological commitment: temporal parts vs. wholly present entities. The disagreement shifted from cases to which framework is more fundamental.

  The phenomenon is a substantive ontological disagreement despite intertranslatability. Terms like "deep verbal dispute" or "metaphysical equivalence" come to mind, but "systematic intertranslatability with ontological divergence" might be more precise. 

  For boundaries: it becomes a plain verbal dispute if both sides agree there's no fact of the matter. If new evidence could distinguish them, it turns into underdetermination. Parallels exist in philosophy of science, like interpretations of quantum mechanics (Bohmian vs. Copenhagen), or structural realism debates.

  The user wants clarity on the structure. They’re not seeking references but a conceptual map. They might be trying to grasp if the debate is meaningful or if they’ve identified a unique structure. Confirming it's a recognized pattern with specific characteristics will help them categorize their thoughts. Their deeper need is likely understanding whether such metaphysical debates have genuine substance beyond semantics.
answer: |-
  You've hit on a beautifully precise structural feature of the persistence debate (and many other metaphysical disputes). **There isn't a single, universally agreed-upon name for this *exact* configuration**, but it's a well-recognized pattern. The closest established term is **"merely verbal dispute"**, but as you note, that's *precisely* what the participants *deny* is happening, and they have a specific reason for that denial. Let's carve it up:

  1.  **The Phenomenon Defined:**
      *   **Dispute Structure:** Two theories (T1 and T2) are *systematically intertranslatable* at the level of describing *any possible case* or "data point" (e.g., the road, the hair, the statue/clay). T1's description of any scenario S can be faithfully rendered in T2's vocabulary and vice-versa, without loss of descriptive or predictive power.
      *   **Claimed Substance:** Despite this intertranslatability, proponents of T1 and T2 insist there is a *substantive metaphysical disagreement*. They argue T1 and T2 posit *fundamentally different structures* in reality. The disagreement shifts from "what happens in case S?" to "which framework *correctly carves nature at its joints*?" or "which framework employs the *more fundamental concepts*?"
      *   **Mechanism:** The intertranslatability arises because the core ontological commitments of each theory (e.g., temporal parts for perdurantism, wholly present enduring substances for endurantism) function as *different conceptual primitives* within their respective frameworks. Each theory can *simulate* the other's primitive using its own derived concepts (e.g., perdurantists see "wholly present at t" as describing the instantaneous temporal part; endurantists see "temporal part" as describing the object's state at t under a different description).

  2.  **What It Is *Not* (Boundaries Clarified):**
      *   **Not a *Plain* Merely Verbal Dispute:**
          *   *Boundary:* In a plain merely verbal dispute, the parties *agree* (or should agree upon reflection) that there is no substantive disagreement about the world, only about the meaning or emphasis of words. **The crucial difference here is that both sides *persistently claim* there is a fundamental ontological difference.** They believe the choice between T1 and T2 reflects a deep fact about reality's structure, even if it doesn't manifest in contingent empirical differences. They argue the dispute is about *what exists fundamentally*, not just *how we talk*.
          *   *Example:* Arguing whether a "tumbler" must have straight sides or if it can be curved (like a brandy snifter) is likely merely verbal – the disagreement is purely about the conventional definition of "tumbler," not about the nature of the glass object itself. Persistence theories claim their disagreement *is* about the nature of the objects.
      *   **Not Underdetermination of Theory by Evidence (in the standard sense):**
          *   *Boundary:* Standard underdetermination occurs when *available evidence* cannot decide between T1 and T2, but *future or possible evidence could*. **Here, the intertranslatability implies that *no possible evidence* could decide between them.** They are empirically equivalent *in principle*, not just contingently on current data. The disagreement is insulated from empirical adjudication.
          *   *Example:* Choosing between Newtonian mechanics and General Relativity for low-gravity scenarios *was* underdetermined by pre-1919 evidence (e.g., planetary orbits). The 1919 eclipse provided new evidence favoring GR. No such evidence is possible for the intertranslatable persistence theories.
      *   **Not "Notational Variant" (as a *settling* verdict):**
          *   *Boundary:* Calling T2 a "notational variant" of T1 is a *rhetorical move within the dispute* used by proponents of T1 to dismiss T2 (and vice-versa). **The key point is that this dismissal is *rejected* by proponents of T2, who insist their framework captures something ontologically distinct.** The dispute remains live precisely *because* the "notational variant" accusation is contested on ontological grounds. If both sides agreed it *was* merely notational, the dispute would dissolve into a plain verbal one.
      *   **Not Just a Disagreement about "Which Concept to Adopt":**
          *   *Boundary:* While it involves choosing concepts, the participants frame it as more than pragmatics or conceptual engineering. **They claim their preferred concept *corresponds to a fundamental aspect of reality* that the other concept obscures or misrepresents ontologically.** It's not *just* "let's use word X for phenomenon Y"; it's "phenomenon Y *is fundamentally constituted by* Z-structure, and concept X captures that while concept W does not."

  3.  **Labels & Near-Misses:**
      *   **"Substantive Ontological Disagreement Despite Empirical Equivalence":** Accurate but clunky.
      *   **"Deep Verbal Dispute":** Used sometimes, but misleading as it suggests the participants *accept* it's verbal, which they don't.
      *   **"Metaphysical Equivalence with Ontological Divergence":** Highlights the key tension.
      *   **Ted Sider's Framing:** Philosophers like Ted Sider explicitly argue that such disputes are about "what the world is like *in fundamental terms*" or "which concepts are *joint-carving*." He might call it a dispute about **fundamental ontology** or **structure** in the face of **representational equivalence**.
      *   **The Best Fit:** **Systematic Intertranslatability with Claimed Ontological Divergence.** This captures the core: the theories are intertranslatable (systematically, for all cases), yet proponents claim they describe distinct fundamental structures (ontological divergence).

  4.  **Exact Parallels:**
      Your suspicion is correct. This structure appears prominently in:
      *   **Philosophy of Physics (Interpretations of Quantum Mechanics):** Bohmian Mechanics vs. Copenhagen/Standard QM. They are empirically equivalent (make all the same predictions for all experiments), yet posit radically different underlying realities (pilot waves & definite particles vs. wavefunction collapse/information). Proponents argue their interpretation reveals the *true fundamental nature* of quantum reality.
      *   **Structural Realism vs. Object-Oriented Realism:** Epistemic Structural Realism (ESR) claims we can only know the structure of relations between objects, not the objects themselves. Ontic Structural Realism (OSR) claims there *are* only structures, objects are derivative. Critics argue ESR collapses into OSR or standard realism depending on how "structure" is defined, while proponents insist on the fundamental ontological difference.
      *   **Presentism vs. Eternalism (Time):** Analogous to Endurantism vs. Perdurantism. Presentists claim only the present exists; Eternalists claim past, present, and future are equally real. They can translate each other's claims about "what was true" or "what will be true," but argue their view captures the fundamental nature of temporal existence.

  5.  **Conclusion:**
      You haven't invented this phenomenon, but you've articulated its structure with remarkable clarity, especially the migration of the dispute *away* from cases and *towards* fundamentality claims. While there isn't one perfect, universally accepted name, **"Systematic Intertranslatability with Claimed Ontological Divergence"** captures its essence. It sits at the intersection of:
      *   Metaphysical debates about fundamentality and joint-carving.
      *   Disputes involving empirically equivalent theories (like QM interpretations).
      *   Arguments against deflationary views (like "all metaphysics is verbal").

      The dispute persists *because* both sides reject the deflationary ("merely verbal") conclusion. They insist that choosing the *fundamentally correct* framework matters for understanding the deep structure of reality, even if it doesn't change predictions about specific cases. That insistence on ontological substance despite descriptive equivalence is the core of the phenomenon you've identified.
