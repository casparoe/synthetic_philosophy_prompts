prompt: |-
  I run learning & evaluation at a mid-sized NGO — about 40 staff, $35M a year in programs across four countries. Every quarter I get a pile of requests to spend money finding stuff out: a partner wants a baseline survey, a program team wants a randomised evaluation of our flagship livelihoods intervention, someone wants to commision a study on whether our cash transfers crowd out local labour, the board wants an audit of safeguarding practices at two partner orgs. Right now I decide basically by whoever argues hardest, and I want to stop doing that.

  Give me a decision procedure my team can actually run on a proposal in under an hour, no stats background required. The spine of it should be the decision-theoretic result that free information is never expected to be worth less than nothing (Good's theorem, I think?), plus the corollary I find genuinely useful: information only has value if some possible finding would change what we do. So the first screen should be — list the possible answers, and for each one, whether the decision changes. If none of them change it, stop.

  But I'm pretty sure the theorem has assumptions and our world breaks some of them, so I want the procedure to carry explicit exception tests, phrased as questions a non-theorist can answer, covering the ways information-gathering can come out net negative even when it is decision-relevant. Things like: knowing it would create an obligation or destroy an option we currently have; the act of gathering changing the thing measured (asking people questions changes their behaviour, publishing an indicator creates a target people optimise); us not trusting ourselves to update on the finding sanely, or knowing we'd over-react to a vivid result; the payoff depending on what we believe rather than on how the world is; results arriving after the decision is locked anyway. For each exception test tell me what a sufficient answer looks like, and whether passing it kills the proposal outright or just reclassifies it as something other than an information purchase.

  Then mark where the procedure stops being decision theory and becomes a values call that has to go to a human — whose welfare counts, whether we're permitted to prefer not to know for our own comfort, that sort of thing. And be blunt about which steps are judgment wearing a procedure costume.

  Run it on three proposals: (1) a $250k randomised evaluation of the flagship livelihoods program that our ED is personally attached to; (2) a cheap safeguarding audit at a partner delivering 40% of our reach, where a bad finding triggers mandatory reporting to a donor and probably ends the partnership; (3) a baseline survey whose indicators will end up on a public dashboard with annual targets attached.

  I want at least one of those to come out with an answer I won't like. If the honest application says don't fund the ED's evaluation, say so, and say what it would have to be justified as instead.

  Two more things. If you think I've got the theorem wrong, or that value-of-information is just the wrong frame for some of these categories, say that plainly up front instead of building on my mistake. And for each exception test, tell me how sure you are that it's a genuine failure of the theorem's assumptions rather than an ordinary cost I'm relabelling — I want to know which ones are actually load-bearing.
reasoning: |-
  We are going to design a decision procedure for evaluating information-gathering proposals. The core idea is based on Good's theorem: information has positive expected value only if it can change a decision. However, there are exceptions where gathering information might be net negative even if it is decision-relevant.

  The procedure has the following steps:

  1. **Decision Relevance Check**: 
     - For the proposed study, list the possible findings (e.g., low, medium, high impact).
     - For each possible finding, ask: "Would this finding change our decision about the program or policy in question?"
     - If none of the possible findings would change any decision, then the information has no value (per Good's theorem) and the proposal fails. Stop here.

  2. **Exception Tests (Net Negative Risks)**:
     Even if the information is decision-relevant, we must check for potential negative consequences that could make the net value negative. We list several exception tests. Each test is a question. If the answer is "yes" to any of these, then the proposal is either rejected or reclassified (as something other than an information purchase, e.g., a compliance requirement, a public relations exercise, etc.).

     - **Test 1: Obligation Creation or Option Destruction**
       - *Question*: Could knowing the result create a legal, contractual, or moral obligation that we currently do not have, or destroy an option we currently have (e.g., by forcing us to act in a way that we wouldn't otherwise, or by revealing information that would force us to terminate a partnership)?
       - *Sufficient answer for rejection*: Yes, and the cost of the obligation or lost option is high enough that it outweighs the potential benefits of having the information for decision-making.
       - *Effect*: If passed (i.e., the risk is present and significant), then the proposal is reclassified as a risk exposure and must be evaluated under a risk management framework (not as an information purchase). Alternatively, if the risk is too high, it might be rejected outright.

     - **Test 2: Measurement Distortion**
       - *Question*: Could the act of gathering the information change the behavior of the people or system being measured (e.g., Hawthorne effect, Goodhart's law)? Or could the publication of the indicator create perverse incentives?
       - *Sufficient answer for rejection*: Yes, and the distortion is likely to be severe and harmful to the program goals or to the beneficiaries.
       - *Effect*: If passed, then the proposal is rejected as an information purchase because the information gathered may be invalid or the process may cause harm. It might be reclassified as an intervention (with its own costs and benefits) rather than pure information gathering.

     - **Test 3: Unsafe Updating**
       - *Question*: Do we have reason to believe that we (the organization) might not update our beliefs rationally on the basis of the findings? For instance, might we overreact to a vivid negative result, or underreact due to motivated reasoning?
       - *Sufficient answer for rejection*: Yes, and the potential for irrational updating is high enough that it could lead to a worse decision than we would have made without the information.
       - *Effect*: If passed, the proposal is rejected as an information purchase because the information might lead to worse decisions. It might be reclassified as a process that requires additional safeguards (like precommitment to decision rules) or as a communication tool.

     - **Test 4: Belief-Dependent Payoffs**
       - *Question*: Does the payoff (or utility) of an outcome depend not only on the state of the world but also on what we believe about it? (For example, in a public scandal, the harm might come from the public knowing we did something wrong, regardless of the actual harm.)
       - *Sufficient answer for rejection*: Yes, and the act of gathering the information might reveal information that, by itself, causes harm (regardless of our actions) because of how it affects others' beliefs.
       - *Effect*: If passed, then the proposal is reclassified as a risk exposure (similar to Test 1) and evaluated accordingly.

     - **Test 5: Timing Mismatch**
       - *Question*: Is there a significant risk that the results will arrive after the decision must be made?
       - *Sufficient answer for rejection*: Yes, and there is no way to delay the decision without incurring substantial costs.
       - *Effect*: If passed, then the proposal fails as an information purchase because the information would be irrelevant to the decision.

  3. **Human Judgment Calls**:
     After the exception tests, we must consider value judgments that cannot be resolved by the procedure. These include:
     - *Whose welfare counts?* (e.g., only direct beneficiaries, or also staff, partners, the public?)
     - *Are we permitted to prefer not to know for our own comfort?* (e.g., avoiding moral distress, protecting staff morale)
     - *Other ethical considerations*: e.g., is it acceptable to gather data that might harm participants, even if it's decision-relevant?

     These questions require input from leadership and stakeholders. The procedure flags that if the proposal passes the exception tests, it must then be evaluated by a human (or committee) with the authority to weigh these values.

  **Application to Proposals**:

  We now run the three proposals through the procedure.

  ### Proposal 1: $250k randomised evaluation of the flagship livelihoods program

  - **Decision Relevance Check**:
    - Possible findings: The program has no effect, positive effect, or negative effect.
    - Would any of these change our decision?
      - If no effect: Would we discontinue the program? (If the ED is attached, maybe not.)
      - If positive: Would we scale it? (Maybe.)
      - If negative: Would we discontinue? (Maybe.)
    - If we would continue regardless, then the information is not decision-relevant. But let's assume that a negative result would lead to discontinuing and a positive result to scaling. So it is decision-relevant.

  - **Exception Tests**:
    - *Test 1 (Obligation)*: If we find a negative effect, would we be forced to act in a way that is costly? Not necessarily, unless there are donor contracts that require a certain impact. If not, then no. Pass (no obligation created that isn't already there?).
    - *Test 2 (Distortion)*: The evaluation itself might change the program implementation (e.g., staff behave differently because they are being studied). This is common in RCTs. But if we can mitigate (e.g., by not revealing the treatment group), then maybe not severe. However, if the program is already running and we are randomizing access, that might create ethical issues. But the risk of distortion is moderate. Not sufficient to reject.
    - *Test 3 (Unsafe Updating)*: Given the ED's attachment, we might underreact to a negative result (motivated reasoning) or overreact to a positive one. Also, the organization might not be prepared to act on a negative finding. This is a concern. If we think we might ignore a negative result, then the information has less value. But if we precommit to act, then we can mitigate. Without precommitment, this is a risk.
    - *Test 4 (Belief-dependent)*: Not applicable here.
    - *Test 5 (Timing)*: The evaluation takes time. Will the results come in time for the next funding cycle? If not, then it might be too late.

    Given the cost is high ($250k) and the risk of unsafe updating (Test 3) is present (we might not act on a negative result because of the ED), this proposal might fail.

  - **Verdict**: 
    - The proposal is decision-relevant, but Test 3 (Unsafe Updating) raises a red flag. If we cannot precommit to acting on the findings (especially a negative one), then the expected value of the information might be negative because we might ignore it and then have spent money for nothing (or even worse, we might have a negative result that we ignore, which could lead to reputational risk if it becomes public). 
    - Given the ED's attachment, it is likely that we would not discontinue the program even with a negative result. Therefore, the information might not change the decision, making it fail the Decision Relevance Check. But if we are honest, we might admit that a negative result would be hard to act on. 
    - **Thus, we reject the proposal as an information purchase.** 

    However, the ED might want it for other reasons (e.g., accountability to donors, public relations). We would then reclassify it as a legitimacy exercise or a compliance requirement and evaluate it under that framework (which might still justify the cost, but not as a pure information purchase).

  ### Proposal 2: Cheap safeguarding audit at a partner

  - **Decision Relevance Check**:
    - Possible findings: Safeguarding practices are adequate or inadequate.
    - If adequate: We continue the partnership.
    - If inadequate: We must report to the donor and likely end the partnership. This would change our decision (from continuing to ending). So it is decision-relevant.

  - **Exception Tests**:
    - *Test 1 (Obligation)*: Yes! A bad finding triggers a mandatory report and likely ends the partnership. This creates an obligation we currently do not have (we are not required to report until we know). The cost is high: losing 40% of our reach. So the act of gathering the information might force us to end a partnership that, without the audit, we would continue. This is a classic case of creating an obligation.
    - *Test 2 (Distortion)*: The audit might cause the partner to temporarily improve practices (Hawthorne effect), but that might be good. However, if the audit is announced, they might hide problems. But it's a risk. Not the main issue.
    - *Test 3 (Unsafe Updating)*: We would be forced to act on a bad finding because of the mandatory reporting. So we would update and act. No issue.
    - *Test 4 (Belief-dependent)*: The harm of inadequate safeguarding might be in the knowing? Not really, the harm is in the actual practices. But if the audit reveals problems, it might cause reputational damage to the partner and us. This is a risk.
    - *Test 5 (Timing)*: Probably timely.

    The main issue is Test 1: by doing the audit, we risk destroying the partnership (which we currently have) if we find a problem. We might prefer not to know because we value the reach (40%) and think the risk of actual harm is low. But if there are safeguarding failures, they could cause harm to beneficiaries.

  - **Verdict**: 
    - The audit is decision-relevant, but Test 1 is triggered. The information gathering creates a risk of destroying the partnership (an option we currently have). Therefore, we reclassify this as a risk management exercise. We must weigh the cost of losing the partner (and 40% of reach) against the potential harm to beneficiaries from inadequate safeguarding. 
    - This is a values call: how much do we care about safeguarding versus program reach? It must go to a human (or committee) for a decision. The procedure flags that it is not a pure information purchase because of the obligation it creates.

  ### Proposal 3: Baseline survey for a public dashboard with annual targets

  - **Decision Relevance Check**:
    - Possible findings: The baseline level of the indicators (e.g., low, medium, high).
    - Would any finding change a decision? 
      - The purpose of the baseline is to set targets and track progress. But without the baseline, we wouldn't have a starting point. However, if we are going to run the program regardless, then the baseline might not change the decision to run it. It might change how we implement (e.g., if baseline is very low, we might adjust the intervention). But if the dashboard is public, then the baseline might lock us into targets that we have to meet. 
      - So: if the baseline is very low, we might change the program design? Or if it is high, we might shift resources? If so, then it is decision-relevant. But if we are going to run the same program regardless, then it might not change the decision.

  - **Exception Tests**:
    - *Test 1 (Obligation)*: Yes, the public dashboard creates an obligation to meet the targets. If we don't meet them, there might be reputational costs. But the baseline itself doesn't create an obligation beyond what we already have by committing to the dashboard. However, the baseline sets the starting point, which affects the difficulty of meeting targets. This might create a perverse incentive to manipulate the baseline.
    - *Test 2 (Distortion)*: This is a major issue. Public targets attached to indicators often lead to Goodhart's law: "When a measure becomes a target, it ceases to be a good measure." The program team might focus on improving the indicator at the expense of the real goal. The baseline survey might also be subject to manipulation because it sets the starting point. This is a serious risk.
    - *Test 3 (Unsafe Updating)*: Not a major issue.
    - *Test 4 (Belief-dependent)*: The public nature means that the baseline numbers might affect donor beliefs and funding, regardless of actual program impact. This is a risk.
    - *Test 5 (Timing)*: Probably timely.

  - **Verdict**: 
    - The baseline might be decision-relevant (if it changes program design) but Test 2 (Distortion) is a major concern. The public dashboard with targets might distort the program. Therefore, the net value of the baseline survey might be negative because it sets in motion a system that perverts the program's goals. 
    - We might reject the proposal as an information purchase. However, if we have committed to the dashboard (for accountability to donors), then the baseline is a necessary part of that. We would then reclassify it as a compliance requirement and evaluate it accordingly.

  **Summary of Exception Tests and Their Load-Bearing Status**:

  - **Test 1 (Obligation)**: This is a genuine failure of the theorem's assumptions because the theorem assumes that the set of available actions does not change with the information. Creating an obligation or destroying an option changes the action set. High confidence.
  - **Test 2 (Distortion)**: This is also a genuine failure because the theorem assumes that the state of the world is fixed (or at least not affected by the measurement). If measurement changes the state, then the information is about a different world. High confidence.
  - **Test 3 (Unsafe Updating)**: This is a failure of the rational updating assumption. The theorem assumes Bayesian updating. If we don't update rationally, then the value of information might be negative. High confidence.
  - **Test 4 (Belief-dependent)**: This is a genuine issue because the theorem assumes the utility function depends only on the state of the world and the action, not on beliefs. If utility depends on beliefs (e.g., reputational harm from others knowing), then it breaks the assumption. Medium confidence (because sometimes this can be modeled, but it complicates the framework).
  - **Test 5 (Timing)**: This is an ordinary cost (delay) but also a failure of the assumption that the information is available before the decision. High confidence.

  **Conclusion**: 

  The procedure is built on the correct core (Good's theorem) but the exception tests are necessary because real-world breaks the assumptions. The steps that are judgment in procedure's clothing are:
  - Deciding whether a possible finding would change a decision (it requires imagining counterfactuals and being honest about organizational behavior).
  - Assessing the severity of the exceptions (e.g., how bad would the distortion be?).

  We have applied the procedure to three proposals and rejected Proposal 1 (the RCT) as an information purchase because of unsafe updating (and possibly lack of decision relevance if we are honest about the ED's influence). Proposal 2 is reclassified as risk management, and Proposal 3 is rejected (or reclassified) due to distortion.

  This procedure should take under an hour per proposal because it focuses on high-level questions and does not require statistical calculations. However, it does require honest organizational self-reflection.
answer: |-
  Below is a decision procedure for evaluating information-gathering proposals, grounded in Good's theorem (which states that free information has non-negative expected value **only if** it can change a decision). The procedure includes explicit exception tests for cases where information might be net-negative despite decision relevance. I've structured it as a flowchart with clear questions, exception tests with rejection thresholds, and flags for human judgment calls. I'll then apply it to your three proposals.

  ---

  ### **Decision Procedure for Information-Gathering Proposals**  
  **Time:** <60 mins per proposal. **No stats background required.**  
  **Core Principle:** Information has value only if at least one possible finding would change a decision. If no finding changes anything, reject the proposal immediately.  

  #### **Step 1: Decision Relevance Screen (5 mins)**  
  **Question:** "List all realistically possible findings from this information. For each finding, would it change a specific, pending organizational decision (e.g., continue/scrap a program, change implementation, renew a partnership)?"  
  - **Sufficient answer to proceed:** At least one finding would change a decision.  
  - **Stop and reject if:** No finding changes any decision.  
  - **Judgment call:** Defining "realistically possible" and "pending decision" requires context. If the decision is vague (e.g., "inform future strategy"), force specificity.  

  #### **Step 2: Exception Tests (10–20 mins per test)**  
  Even if Step 1 passes, these tests identify net-negative risks. **Each test is pass/fail.** If any test is "failed," the proposal is either rejected or reclassified.  
    

  | **Exception Test** | **Question to Ask** | **Sufficient Answer to FAIL** | **Effect of Failing** | **Is This Load-Bearing?** |
  |-------------------|---------------------|-------------------------------|------------------------|---------------------------|
  | **1. Obligation/Option Destruction** | "Could knowing a result create a legal/moral obligation we currently avoid, or destroy an option (e.g., force us to act or lose flexibility)?" | YES, and the cost (e.g., lost partnership, mandatory reporting) outweighs the value of changing the decision. | Reject or reclassify as **risk management** (not info purchase). | **High confidence.** Genuine failure of Good's assumption that actions are independent of information. |
  | **2. Measurement Distortion** | "Could gathering or publishing this information change the behavior of people/systems (e.g., inducing Hawthorne effects, gaming targets)?" | YES, and the distortion risks harming program goals or beneficiaries more than the info helps. | Reject or reclassify as an **intervention** (not pure info). | **High confidence.** The theorem assumes measurement doesn’t alter the state. |
  | **3. Unsafe Updating** | "Do we distrust ourselves to rationally update beliefs/decisions based on findings (e.g., overreact to vivid results, ignore inconvenient truths)?" | YES, and the expected cost of irrational action (e.g., scrapping a good program due to noise) outweighs the benefit. | Reject outright. | **High confidence.** The theorem assumes Bayesian updating. |
  | **4. Belief-Dependent Payoffs** | "Does the payoff depend on others' beliefs (e.g., reputational harm) rather than the world's state?" | YES, and revealing info creates net harm regardless of decisions made (e.g., scandal with no corrective action). | Reclassify as **reputational management**. | **Medium confidence.** The theorem assumes utility depends only on actions/states, not beliefs. |
  | **5. Timing Mismatch** | "Is there >50% chance findings arrive after the decision is locked?" | YES, and delaying the decision is cost-prohibitive. | Reject outright. | **Medium confidence.** An ordinary cost, but also violates the theorem’s "timely info" assumption. |

  #### **Step 3: Human Judgment Call (Where Values Trump Theory)**  
  After Step 2, unresolved proposals reach a **values gatekeeper** (e.g., leadership team). Force explicit discussion:  
  - **Whose welfare counts?** E.g., Can we prioritize beneficiary well-being over staff/donor comfort?  
  - **Are we permitted ignorance?** E.g., Can we avoid info that causes moral distress if it doesn’t change actions?  
  - **Ethical boundaries:** E.g., Is it acceptable to risk harm to beneficiaries for knowledge?  
  **Output:** Approve, reject, or reclassify the proposal based on organizational values.  

  ---

  ### **Application to Your Proposals**  
  I’ll apply the procedure strictly. As requested, one outcome will be "unlikable" (Proposal 1).  

  #### **Proposal 1: $250k RCT of Flagship Livelihoods Program**  
  - **Step 1 (Relevance):**  
    - Possible findings: (a) Significant positive impact, (b) No impact, (c) Negative impact.  
    - Decision change? (a) Scale up program, (b) Revise program, (c) Shut down program. → **Passes** (all findings could change decisions).  
  - **Exception Tests:**  
    - **Test 1 (Obligation):** Unlikely. No automatic triggers (e.g., donor clauses). → Pass.  
    - **Test 2 (Distortion):** Possible. RCT may create "special" implementation (e.g., staff extra-attentive). But risk is mitigable (e.g., blind protocols). → Pass.  
    - **Test 3 (Unsafe Updating):** **FAIL.** ED’s attachment makes underreaction to negative results likely. Cost of ignoring a negative result ($250k waste + reputational risk) outweighs benefit. Rational updating is untrustworthy.  
    - **Test 4 (Belief-Dependent):** Low risk. Livelihoods impact isn’t belief-sensitive. → Pass.  
    - **Test 5 (Timing):** Pass. Findings likely inform the next funding cycle.  
  - **Verdict:** **Reject outright** due to Test 3.  
  - **Justify as:** Not an information purchase. If the ED insists, it must be reclassified as **symbolic legitimacy** (e.g., "prove impact to donors") or **organizational learning** (e.g., build staff capacity). Cost must be weighed against those goals.  

  #### **Proposal 2: Cheap Safeguarding Audit at High-Reach Partner**  
  - **Step 1 (Relevance):**  
    - Possible findings: (a) Safeguarding adequate, (b) Safeguarding inadequate.  
    - Decision change? (a) Continue partnership, (b) Trigger reporting → end partnership. → **Passes.**  
  - **Exception Tests:**  
    - **Test 1 (Obligation):** **FAIL.** A "bad" finding creates mandatory reporting, destroying the partnership (40% reach loss). Cost likely outweighs benefit (unless safeguarding risks are catastrophic).  
    - **Test 2 (Distortion):** Possible (partner may temporarily improve practices), but risk is low if audit is surprise. → Pass.  
    - **Test 3 (Unsafe Updating):** Pass. Bad finding forces action (no discretion).  
    - **Test 4 (Belief-Dependent):** Moderate risk. A bad finding could cause reputational harm, but primary cost is losing the partner. → Pass.  
    - **Test 5 (Timing):** Pass. Audit is quick.  
  - **Verdict:** **Reclassify as risk management.** Not an info purchase. Send to human judgment: "Is protecting beneficiaries from safeguarding failures worth risking 40% program reach?"  

  #### **Proposal 3: Baseline Survey for Public Dashboard**  
  - **Step 1 (Relevance):**  
    - Possible findings: (a) Baseline low, (b) Baseline medium, (c) Baseline high.  
    - Decision change? (a) Rethink targets/design, (b) Proceed as planned, (c) Shift resources elsewhere. → **Passes.**  
  - **Exception Tests:**  
    - **Test 1 (Obligation):** Pass. No new obligations beyond public targets (existing commitment).  
    - **Test 2 (Distortion):** **FAIL.** Public targets will incentivize gaming indicators (Goodhart’s law). Distortion could corrupt program focus, outweighing info value.  
    - **Test 3 (Unsafe Updating):** Pass. Unlikely irrationality.  
    - **Test 4 (Belief-Dependent):** Pass. Minimal reputational risk.  
    - **Test 5 (Timing):** Pass. Baseline informs targets upfront.  
  - **Verdict:** **Reject outright** due to Test 2. If dashboard is non-negotiable, reclassify as **accountability compliance** (not learning).  

  ---

  ### **Critical Review of Your Framework**  
  1. **Good’s Theorem Fit:**  
     - **You’re correct:** Value of information (VoI) is the right starting point. Good’s theorem formally shows VoI ≥0 only if information can change decisions.  
     - **But VoI is incomplete here:** Your examples involve non-instrumental goals (e.g., accountability, risk avoidance). VoI assumes a single decision/utility function, but NGOs have multiple stakeholders (donors, beneficiaries, staff). I kept VoI as the "spine" but added explicit reclassification paths for non-decision uses.  

  2. **Exception Tests Are Load-Bearing:**  
     - Tests 1–4 are **genuine violations of Good’s assumptions** (e.g., state-dependent actions, rational updating). They’re not "ordinary costs relabeled."  
     - Test 5 (timing) is partially an ordinary cost but also violates the "information arrives in time" assumption.  

  3. **Judgment in Procedure’s Clothing:**  
     - Step 1 (defining "possible findings" and "decision change") is highly subjective.  
     - Exception Tests require weighing costs/benefits (e.g., "outweighs the value"). This is qualitative judgment.  
     - Human judgment gatekeepers are unavoidable for welfare trade-offs.  

  This procedure prioritizes speed, avoids stats, and flags pitfalls. It won’t eliminate politics (e.g., the ED’s pet project), but it forces explicit reasoning. Use it to foster debate, not just rubber-stamp proposals.
