  4. **Rival Positions**: The practice rules out eliminativism (since features are used) and strong pluralism (by prioritizing causal efficacy). But it accommodates moderate pluralism if multiple decompositions are causally valid. Instrumentalism fits well; realism requires additional commitments.

  5. **Practical Impact of Instrumentalism**: Adopting instrumentalism might shift rhetoric (e.g., "feature as if" instead of "feature is") but not methods. Metrics and practices would likely continue unchanged, as the focus is on utility. This suggests the field is already functionally instrumentalist.

  The user might be hinting at a discrepancy between the field’s realist language and instrumental practices. Their deeper need could be to reconcile this or call for philosophical honesty. They might want the community to acknowledge that features are tools, not discoveries, without undermining the research’s value. Also, they might be concerned about overclaiming in interpretability, where causal successes are seen as proof of real features, potentially misleading stakeholders.

