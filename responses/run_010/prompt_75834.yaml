prompt: |-
  Six weeks ago I became the duty officer at a regional flood forecasting centre. I sign the public warning messages that go out to about 300,000 people, and through the winter there's roughly one event a month where I have to decide, inside about fifteen minutes, whether we say a thing flat out or whether we hedge it — our director only sees the severe tier, everything below that is mine. Two messages last season blew up, and they blew up in opposite directions. In November a colleague wrote 'the Cale will overtop the weir at Tefford and flood the lower village', no qualifier, because two gauges and the model all pointed that way; it didn't happen, the crest came eleven centimetres short, and the parish council wrote to the director saying we'd cried wolf and they'd take no notice of the next one. In February someone else, terrified of repeating that, wrote 'there is a possibility of significant flooding in the Teff area' at a moment when we were as confident as we ever get, and only two households put their boards up; nine were flooded. I've now been told to write a one-page standing rule that every officer on the rota can run before a message goes out, and I'm stuck, because the obvious rule — only say it if you know it's true — seems to forbid every forecast we issue, since strictly speaking nobody knows the future.

  There's got to be a usable version of that argument somewere. I did a philosophy course years ago and I remember people fighting about whether the standard for stating something flat-out is truth, or knowledge, or just reasonable belief, and that the way you settle it is by looking at the cases where those come apart: the lottery ticket you end up right about, the stopped clock that reads the correct time, the rumour that turns out to be true. Please turn that into a procedure my rota can actually follow — the questions to ask in order, what counts as a settled answer to each, where the message must be flat, where it has to carry a number or an attribution to a source, and the point where the procedure stops being about evidence and hands the decision to a person because it's really about how much risk you're allowed to impose on people who can't opt out of it. It has to be runnable in ten minutes by someone who has been awake since 3am and has never heard the word epistemology, it should say explicitly what to do when we can't get a number out of the model, and it should be honest about which of its steps are just my own judgement dressed up as procedure.

  Then run it on three messages so I can see whether it behaves: (a) the February one, where we were as sure as we ever get but the wording said only 'a possibility of'; (b) a case where the flat statement came out exactly right but we got there by trusting an upstream gauge that we later found had been logging garbage — right answer, rotten route; (c) a warning we've been asked to issue off a 1-in-200-year projection for a reservoir nobody locally believes will go, where the cost of a false alarm is evacuating a town of four thousand for two days. I already suspect the procedure is going to tell me (b) was improper even though nothing bad happened and the officer was completely vindicated, and if that's the answer I want it stated plainly rather than softened, because it's exactly what my colleagues will refuse to accept and I need to know whether they're right to. Last thing: no bibliography, no reading list, no name-dropping — I can't check any of it and my staff definitely won't. Just the reasoning, plus a clear account of what the procedure can't settle and shouldn't pretend to.
reasoning: |-
  Okay, let me approach this systematically. The duty officer needs a practical decision procedure for flood warnings that balances accuracy with responsibility, grounded in operational reality rather than philosophical abstraction. 

  First, I recognize two core tensions: the November incident shows the cost of false certainty (eroded trust), while February demonstrates the cost of excessive caution (unmitigated damage). The unworkable rule "only say it if you know it's true" fails because forecasting inherently deals in probabilities. 

  I recall the epistemology concepts the officer mentioned - truth vs. justified belief - but must translate them into actionable steps. The key insight is that what matters isn't metaphysical certainty but the quality of evidence and the stakes of being wrong. 

  For the procedure, I consider a three-layer approach: 
  1) Evidence quality assessment (data sources, model reliability) 
  2) Consequence scoring (what happens if we're wrong) 
  3) Decision matrix combining these factors

  The "reasonable belief" standard seems most appropriate here - not absolute knowledge, but evidence strong enough that acting on it is justified given the costs of inaction. 

  For the test cases: 
  - In February (case a), high evidence + high stakes should have mandated a flat warning 
  - The faulty gauge case (b) illustrates that outcome doesn't validate method; rotten evidence voids justification regardless of luck 
  - The reservoir scenario (c) requires acknowledging model limits and involving senior leadership due to massive evacuation costs

  I'm structuring the procedure to force explicit consideration of uncertainty sources and worst-case scenarios. Crucially, it must flag when decisions transition from evidence-based to value-judgment calls about risk allocation. The language avoids technical terms - instead of "epistemic justification" we'll say "confidence level based on working sensors".

  For the controversial case (b), I'll state unequivocally that using known-bad data invalidates the warning, even if it accidentally matched reality. This aligns with professional ethics: forecasts must be defensible, not just fortunate.
answer: |-
  Here's a practical decision procedure for issuing flood warnings, designed as a flowchart with explicit thresholds. It focuses on **actionable confidence** and **consequences of error**, not philosophical certainty. Run through these steps in order:

  ---

  ### **FLOOD WARNING DECISION PROCEDURE**  
  *(Complete within 10 minutes; stop at first unambiguous instruction)*  

  1. **WHAT IS THE PREDICTED IMPACT?**  
     - **Settled answer:** "Flooding of [specific location] at [depth] by [time]."  
     - *If unclear:* Specify the worst-case scenario (e.g., "flooding of properties near the river at Tefford").  
     - *If no impact predicted:* Do not issue a warning. Stop.  

  2. **HOW RELIABLE IS THE EVIDENCE?**  
     Ask:  
     - **Are ≥2 independent data sources (gauges/satellites) showing consistent data?**  
       *Yes → Proceed. No → Skip to Step 4.*  
     - **Is the model working with trusted inputs (no "garbage logging")?**  
       *Yes → Proceed. No → Skip to Step 4.*  
     - **Have past similar predictions been accurate (>80% correct)?**  
       *Yes → "High" evidence. No → "Medium" evidence.*  

  3. **HOW SEVERE ARE THE CONSEQUENCES?**  
     - **"High" consequences:** Death risk, >10 homes flooded, critical infrastructure loss.  
     - **"Medium" consequences: <10 homes flooded, major road closures.**  
     - **"Low" consequences:** Minor property damage, farmland inundation.  

  4. **DECISION MATRIX**  
     Use this grid:  

     | Evidence \ Consequences | **HIGH** (e.g., lives at risk) | **MED/LOW** (e.g., property damage) |  
     |--------------------------|--------------------------------|-------------------------------------|  
     | **HIGH** (Step 2 all "Yes") | **FLAT STATEMENT** ("The river *will* flood X area by Y time"). | **FLAT STATEMENT** ("The river *will* flood X area"). |  
     | **MEDIUM** (1–2 "No" in Step 2) | **QUANTIFIED RISK** ("80% chance of flooding in X area"). | **QUALIFIED WARNING** ("Significant flooding possible in X area"). |  
     | **LOW** (All "No" in Step 2) | **ESCALATE TO DIRECTOR** | **NO WARNING** (or generic alert: "Monitor conditions near X"). |  

  5. **MANDATORY QUALIFIERS (ADD IF APPLICABLE)**  
     - **Uncertain model output:** Always attach a probability ("60% chance of...").  
     - **Single data source:** Attribute it ("Based on Tefford gauge, which indicates...").  
     - **Unverified report:** State source ("Preliminary data suggest...").  

  6. **HUMAN JUDGEMENT CHECK**  
     - **If the cost of a false alarm is extreme** (e.g., mass evacuation, >£1M economic loss), *and* evidence is not "High":  
       **→ ESCALATE TO DIRECTOR, regardless of Step 4.**  
     - **Otherwise:** Follow Step 4.  

  ---

  ### **WHAT THIS PROCEDURE CAN'T DO (AND ACKNOWLEDGES)**  
  - It **can't guarantee truth** – it minimizes *reckless* or *cowardly* errors.  
  - **Step 6 is pure judgement** (my call on "extreme" costs).  
  - **"High/Medium/Low"** bins involve judgement (use past incident logs for reference).  

  --- 

  ### **TESTING THE PROCEDURE**  

  **Case A (February Incident: High Confidence, Hedged Warning)**  
  - **Impact:** Flooding of Tefford village (HIGH consequence – homes).  
  - **Evidence:** Gauges + model consistent, past accuracy good → **"High" evidence.**  
  - **Decision Matrix:** HIGH evidence + HIGH consequence → **FLAT STATEMENT REQUIRED.**  
  - **Procedure verdict:** FAILURE. Officer violated Step 4. "Possibility" was under-alert.  

  **Case B (Correct Prediction, Rotten Data)**  
  - **Impact:** Flooding predicted (assume HIGH consequence).  
  - **Evidence:** Gauge was logging garbage → **"LOW" evidence** (Step 2 failed).  
  - **Decision Matrix:** LOW evidence + HIGH consequence → **ESCALATE TO DIRECTOR.**  
  - **Procedure verdict:** IMPROPER. Warning should not have been issued flatly. Luck doesn’t justify rotten methods. **This must not be softened: using broken tools invalidates confidence.**  

  **Case C (1-in-200-Year Reservoir Alert)**  
  - **Impact:** Reservoir failure → town flooded (EXTREME consequence).  
  - **Evidence:** Model projection only, no current gauge alerts → **"LOW" evidence.**  
  - **Step 6 Check:** Evacuation cost massive → **ESCALATE TO DIRECTOR.**  
  - **Procedure verdict:** Correct outcome. Officer should never decide this alone.  

  --- 

  ### **KEY PRINCIPLES EMBEDDED**  
  1. **"Reasonable belief" = Evidence quality × Stakes.** High stakes demand higher evidence for silence, not for speaking.  
  2. **Honesty about uncertainty** forces numbers/sourcing when evidence weak.  
  3. **Process over outcome:** Good decisions can be wrong (November). Bad methods are unacceptable even if lucky (Case B).  
  4. **Risk imposition is delegated upward** when consequences dwarf evidence.  

  This fits on one page, avoids jargon, and cuts off unproductive deliberation at Step 6. It accepts that forecasting is about **responsible action under uncertainty**, not prophecy.
