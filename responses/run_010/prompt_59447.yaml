  For the Hume rebuttal: stress absence of necessity rather than unknowability. The takhallus "Zakir" with "this poor clerk" keeps it humble. Title "Custom of the Flame" subtly reinforces habitual causation. Every couplet must stand alone structurally and conceptually - no narrative flow, just accumulated instances. 

  Better avoid any Arabic terms to prevent confusion. Philosophical accuracy is crucial - Nadia's advisor should recognize the argument. Keep tone clinically observational, no mysticism. Double-check that fire's nature is present but derivative in at least one couplet. The closing couplet's "glimmer in the ash" nods to empiricism without conceding necessity. 

