  1. What exactly goes wrong in Case A/A′, at the level of the formal notion of an expectation. I want the explanation to make contact with the fact that the expectation of a countably valued gamble is properly an *unordered* sum over states — equivalently a Lebesgue integral — which exists just in case the terms are absolutely summable. Hence say why the right verdict is "this gamble has no expectation" rather than "it has infinitely many equally admissible candidate expectations", and then say what, if anything, is lost by that verdict: does folding conditional convergence into non-existence conceal a real normative difference between Case A and Case D?

