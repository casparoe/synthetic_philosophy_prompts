  4. The bounded-utility repair. If utility is bounded above and below by ±*M*, absolute summability is automatic, so Cases A–D cannot arise for utilities even though they can perfectly well arise for dollar amounts. Set out precisely what this costs. I want to know whether it is a restriction on the theory, a substantive claim about agents, or a relabelling of the paradox — and what it forecloses that one might have wanted, such as unbounded additive aggregation across infinitely many people, or arbitrarily intense commitments. Note also whether it disposes of Case E as well, and whether that is a benefit or a further worry.

