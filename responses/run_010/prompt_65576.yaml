answer: |-
  ### Price Control Decision Tree  
  *(Applies to wage floors or housing ceilings)*  

  1. **Will the policy cause a significant reduction in the quantity of the good exchanged (e.g., jobs/housing units)?**  
     - *No*:  
        - **2. Could non-quantity distortions still occur (e.g., degraded quality, black markets, inefficient allocation)?**  
          - *Yes*: → **Leaf: Efficiency Objection**  
            *Embarrassing commitment: "I prioritize abstract efficiency over immediate human suffering."*  
          - *No*: → **Leaf: Unoccupied ("Costless Redistribution")**  
            *Empty because empirically unattractive—no real-world control avoids distortions.*  
     - *Yes*:  
        - **3. Does the pre-policy market exhibit concentrated buyer/seller power (e.g., few employers/landlords)?**  
          - *Yes*:  
            - **4. Does this power suppress quantities below efficient levels?**  
              - *Yes*: → **Leaf: Market Power Correction**  
                *Embarrassing commitment: "I assume counterintuitive outcomes (e.g., rent ceilings *increasing* housing supply)."*  
              - *No*: → Proceed to Node 5.  
          - *No*: → Proceed to Node 5.  
        - **5. Is the harm concentrated on disadvantaged groups (e.g., low-skill workers/immigrants)?**  
          - *Yes*: → **Leaf: Harm to Vulnerable**  
            *Embarrassing commitment: "I accept that the policy deepens inequality it claims to fix."*  
          - *No*:  
            - **6. Could unrestricted cash transfers achieve the same goal more efficiently?**  
              - *Yes*: → **Leaf: Prefer Cash Transfers**  
                *Embarrassing commitment: "I trust bureaucrats over markets to allocate aid."*  
              - *No*:  
                - **7. Is the policy’s core purpose to guarantee a minimum standard of dignity?**  
                  - *Yes*: → **Leaf: Dignity Defense**  
                    *Embarrassing commitment: "I value moral symbolism more than net welfare."*  
                  - *No*: → **Leaf: Efficiency Objection** *(see above)*  

  ---

  ### Leaves & Commitments  
  - **Efficiency Objection**: Believes controls create deadweight loss. *(Commitment: "I dismiss equity to worship the supply-demand diagram.")*  
  - **Market Power Correction**: Argues controls rectify underprovision. *(Commitment: "I stretch monopsony logic to markets it barely fits.")*  
  - **Prefer Cash Transfers**: Advocates direct aid over price manipulation. *(Commitment: "I ignore political barriers to 'ideal' transfers.")*  
  - **Dignity Defense**: Accepts reduced quantities for moral imperatives. *(Commitment: "I romanticize hardship as 'fairness'.")*  
  - **Harm to Vulnerable**: Objects due to regressive harm distribution. *(Commitment: "I weaponize equity against equity policies.")*  
  - **Unoccupied ("Costless Redistribution")**: Assumes controls lack trade-offs. *(Unattractive: Ignores pervasive evidence of hidden costs.)*  

  ### Caveats  
  1. **Indistinguishable Leaves**:  
     - *Efficiency Objection* and *Prefer Cash Transfers* may converge if cash is deemed efficient. The tree separates them via Node 6, but real-world adherents often occupy both.  
  2. **Asymmetry Risks**:  
     - *Market Power Correction* is empirically rarer for housing ceilings than labor floors. Node 4 may feel forced for rent control.  
  3. **Oversimplification**:  
     - Node 3’s "concentrated power" glosses over structural differences (e.g., local monopsony vs. diffuse landlords).  
  4. **Unavoidable Labeling**:  
     - Node 7 ("dignity") implicitly references morality, but framed as *purpose* to avoid overt ideology.  

  *Tree tested for consistency: All branches resolve uniquely for both policies.*
