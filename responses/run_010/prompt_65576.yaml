  Give me about eight branch nodes, each a concrete case or claim, laid out as an indented outline so the branching is visible. Leaves I need to end up at: the plain efficiency objection, the monopsony/rent-extraction view that a floor can raise employment along with wages, the prefer-cash-transfers-instead camp, a dignity or living-wage defense that concedes the employment numbers and doesn't care, a view that objects to a ceiling because of *who* eats the harm rather than how big it is, and at least one leaf you think is actually unoccupied — tell me whether it's empty because the view is incoherent, unattractive, or just unexplored. Each leaf gets a name and one sentence on the commitment its defenders are most embarrased by.

  Flag any pair of leaves your questions can't actually separate. Tree first, caveats last, under 600 words.
