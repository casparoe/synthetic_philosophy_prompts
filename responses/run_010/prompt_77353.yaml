prompt: |-
  I cover economics and ideas for a general-interest magazine, and before that I spent years reading the BEA's income-side tables cold — compensation of employees, gross operating surplus, proprietors' income, taxes on production less subsidies. So translate Marx's exploitation claim into that vocabulary, as literally as you can manage: surplus value, constant vs. variable capital, the length of the working day. Where does each one land — is surplus value just gross operating surplus with a moral tacked on? Then give me the residue report. Which pieces map onto an actual line item, which ones you had to bend or fudge to make fit, and which have no expression in national accounts at all (I'm guessing alienation, but tell me if I'm wrong). One thing I specifically want you to deal with: the identity that gross value added splits into labor income and operating surplus is true by construction in my framework, not a discovery — does that fact help Marx, hurt him, or is it beside the point? And please don't smuggle the accountants' assumptions in and label it translation; I want the honest version, residue and all. Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question.
