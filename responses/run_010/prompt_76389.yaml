prompt: |-
  I am a junior at a public high school, and our administration has asked three students to serve on a committee reviewing how disciplinary appeals are decided at our school. The current arrangement is a three-person panel of teachers reaching a verdict by majority vote. The proposal under consideration would replace it with an eleven-person panel — seven teachers and four students — also deciding by majority. The strongest argument offered for the larger panel at the first meeting was a version of the Condorcet jury theorem: if each member is individually more likely than not to reach the correct verdict, then the panel's majority verdict is likelier to be correct than an individual member's judgment, and the larger the panel gets, the closer its reliability approaches certainty. Several of the adults present treated this as settling the matter. I am not convinced, and I would like to be able to say precisely what I find unconvincing rather than merely registering skepticism.

  So, before I draft the committee's recommendation, I want a specification. Write the desiderata: the requirements a mathematical result must meet before it may be cited as an epistemic justification for enlarging a decision-making body like ours. For each requirement, state the consideration that motivates it, and where it helps, the concrete case showing what goes wrong if the requirement is dropped.

  A few matters I would like the list to address — though please tell me where I have mistakenly treated a camp's preference as a genuine requirement, or listed something twice under different names, and add what I have missed:

  - Whether a requirement concerns the result's assumptions, its conclusion, or the step from the conclusion to what a committee is licensed to believe and do. In the meeting these three were run together constantly, and I suspect much of the disagreement was about different ones.
  - Where the premise that each member is more likely than not to be right is supposed to come from, and whether estimating it from the panel's own past verdicts is legitimate or circular.
  - Whether the result must hold for a panel of exactly eleven people, or whether an asymptotic claim about panels growing without bound suffices for our purpose.
  - Our members do not decide in isolation. They read the same incident report, several have worked together for a decade, and the four students may simply defer to the teachers. What independence assumption the result needs, and whether it survives that degree of overlap.
  - Our procedure is staged: the panel votes separately on three questions of fact — whether the student committed the act, whether the act violated a rule the student had been given, and whether the student understood that it did — and the penalty follows mechanically from the combination of answers. Must a justification of majority rule say something about that structure, or is it only about a single yes-or-no question?
  - The costs are asymmetric: wrongly expelling a student is far worse than wrongly clearing one. Can a reliability result that treats the two errors alike license a decision about panel size?
  - Whether members vote for the verdict they believe correct or for the verdict they expect to prevail.
  - Whether there must be a fact of the matter about which verdict is correct, prior to and independent of the panel's deciding it, for this whole framework to apply at all.

  Then tell me which single requirement, if I insist on it, eliminates the largest number of otherwise attractive results. Flag any pair of requirements you believe cannot both be satisfied, and in each such case say whether that means the project of justifying the larger panel fails outright, or whether one of the two was never a real requirement to begin with. Finally, and briefly, indicate how the plain theorem and two or three of the principal ways of repairing it fare against the list — a few sentences each, since the list itself is what I need for the write-up.

  Please lay the reasoning out in full rather than directing me to sources; I want to be able to check every step on my own. A table is acceptable for the requirements, provided the motivating case for each is included.
reasoning: |-
  Okay, the user is a high school junior involved in a committee reviewing disciplinary appeal procedures. The current system uses a three-teacher panel deciding by majority, and there's a proposal to switch to an eleven-person panel with seven teachers and four students. The administration cited the Condorcet jury theorem to support this change, arguing that a larger panel would be more reliable. The student isn't convinced and wants to understand the mathematical requirements needed to justify enlarging the panel.

  First, I need to identify the user's explicit requests. They want a list of desiderata—specific requirements that a mathematical result must meet to justify the panel enlargement. Each requirement should include the motivation and a concrete case showing what happens if it's ignored. They also mentioned several points they want addressed, like assumptions vs conclusions, the source of individual competence, independence, panel size, the staged procedure, asymmetric costs, voting motives, and the existence of a factual truth.

  The user also wants to know which requirement, if insisted upon, eliminates the most results. They’re curious about conflicting requirements and how the Condorcet theorem and its variants hold up against the list. Since they’re drafting a committee recommendation, clarity and thoroughness are key. They need to articulate their skepticism precisely in the report.

  Digging deeper, the user’s identity as a student on a committee with adults suggests potential power dynamics. They might feel their viewpoint is dismissed, especially when adults accepted the theorem uncritically. Their need isn't just about the math; it's about having a structured argument to challenge authority confidently. They might also be concerned about fairness in disciplinary processes, especially with asymmetric costs (wrongful expulsion vs. wrongful clearance), which ties into real-world consequences for students like them.

  Unspoken needs could include a desire for validation—ensuring their skepticism is mathematically sound. They might want to advocate for student voices without being overruled by teachers. The mention of students possibly deferring to teachers indicates worries about token representation. Ensuring the analysis addresses independence and group dynamics is crucial here.

  Now, structuring the response. The user listed eight points, so the desiderata should cover those without duplication. I'll categorize them into assumptions, conclusions, and application steps. For each requirement, provide the motivation and a counterexample. Then, analyze conflicts, the most restrictive requirement, and evaluate the theorem and its variants.

  Key requirements to cover:
  1. **Individual Competence Justification**: Where does the >0.5 probability come from? If it's circular (based on past panel decisions), that's problematic.
  2. **Competence Threshold**: Must each member be >0.5 competent? If not, larger groups could be worse.
  3. **Finite Size Requirement**: Asymptotic results aren't enough for a fixed size like eleven. Need proof for n=11.
  4. **Independence**: Voters must decide independently. Shared evidence or deference breaks this.
  5. **Homogeneous Competence**: The theorem assumes equal competence. Variation could hurt reliability.
  6. **Single Binary Decision**: The actual process has three sequential questions. The theorem handles one decision.
  7. **Symmetric Costs**: Treating both errors equally ignores that false expulsion is worse.
  8. **Sincere Voting**: Members must vote based on belief, not strategy.
  9. **Existence of Ground Truth**: There must be an objective correct verdict.

  Conflicts might arise between Independence and Homogeneous Competence if real groups have dependencies. Also, Symmetric Costs vs. the theorem's assumption. The most restrictive requirement is likely Independence because real panels have discussions and shared information, making independence unrealistic.

  For evaluation:
  - **Standard Condorcet**: Fails on Independence, Homogeneous Competence, Single Decision, etc.
  - **Heterogeneous Competence Models**: Address competence variation but still need independence.
  - **Strategic Voting Models**: Don't apply if voters are sincere.
  - **Cost-Sensitive Extensions**: Adjust for asymmetric errors but may not integrate with group size.

  The user needs to present these requirements in their report to show why the theorem isn't sufficient. Highlighting the lack of independence and asymmetric costs could strengthen their argument against the larger panel or push for modifications.
answer: |-
  Below is a structured specification of desiderata for using a mathematical result to justify enlarging a decision-making panel, based on your concerns. The requirements are categorized by **domain** (Assumptions, Conclusion, or Application), with motivations, concrete counterexamples, and references to your listed points. A table summarizes the requirements, followed by analysis of conflicts, the most restrictive requirement, and evaluations of key theorems.

  ---

  ### **Desiderata Table: Requirements for Epistemic Justification of Panel Enlargement**
  | **Req.** | **Requirement Description**                                      | **Domain**      | **Motivation & Consideration**                                                                                                                               | **Concrete Case if Requirement Fails**                                                                                                                                 |
  |----------|------------------------------------------------------------------|-----------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **R1**   | **Non-Circular Competence Justification**: Individual competence probability (\(p > 0.5\)) must be empirically justified *independently* of past panel verdicts. | Assumptions     | Estimating \(p\) from past panel decisions assumes those decisions were correct, creating circularity. Competence must derive from individual track records or external benchmarks. | If \(p\) is estimated from past panel verdicts, and past panels were biased, \(p\) inherits that bias (e.g., if past panels favored teachers, \(p_{\text{students}}\) could be inflated). |
  | **R2**   | **Strict Competence Threshold**: Each member must have \(p > 0.5\) *strictly*.                                                | Assumptions     | If \(p \leq 0.5\) for any member, adding them may *reduce* group reliability (per CJT). Ensures enlargement monotonically improves correctness.               | A panel with \(p = 0.5\) for all members (random guessing) has majority reliability = 0.5, same as one person. Adding a member with \(p = 0.4\) makes reliability *worse*. |
  | **R3**   | **Finite-Size Guarantee**: The result must demonstrate improved reliability for the *specific* proposed size (\(n=11\)).      | Conclusion      | Asymptotic results (\(n \to \infty\)) are irrelevant for small/medium \(n\). Reliability might dip or plateau before improving.                               | For \(n=11\), if \(p = 0.51\), reliability is only \(\approx 0.53\)—barely better than an individual. Asymptotic claims ("approaches 1") mislead for practical sizes. |
  | **R4**   | **Voter Independence**: Votes must be statistically independent *given the evidence*.                                         | Assumptions     | Shared evidence, deliberation, or deference create dependence. Dependence can amplify errors or suppress diversity, violating CJT.                           | If all students defer to one teacher, their votes are copies. A 11-person panel acts like a 4-person panel, losing reliability benefits. |
  | **R5**   | **Homogeneous Competence**: The result must hold under *realistic variation* in \(p_i\) across members.                      | Assumptions     | Teachers/students likely have different \(p_i\). Heterogeneity can reverse CJT (e.g., low-\(p\) members dominate).                                           | If 4 students have \(p = 0.4\) and 7 teachers have \(p = 0.8\), majority reliability (\(\approx 0.85\)) is *lower* than teachers alone (\(\approx 0.97\) for 3 teachers). |
  | **R6**   | **Decision Structure Compatibility**: The result must account for *sequential/multi-stage* decisions.                         | Application     | Multi-stage verdicts (e.g., act/rule/knowledge) compound errors. Reliability for the final outcome depends on all stages.                                     | Even if each stage has 90% reliability, three stages yield \(\approx 72.9\%\) final reliability—majority rule per stage doesn't fix this. |
  | **R7**   | **Asymmetric Error Costs**: The result must incorporate *unequal costs* for false positives/negatives.                       | Application     | Wrongful expulsion (FP) is costlier than wrongful clearance (FN). Treating errors equally ignores welfare implications.                                      | A panel optimized for symmetric errors might minimize total mistakes but allow high FP rates. If FP costs 10× FN, this is unjust. |
  | **R8**   | **Sincere Voting**: Members must vote for the verdict they *believe correct*, not strategically.                             | Assumptions     | Strategic voting (e.g., "bandwagoning") breaks independence/competence assumptions. Outcomes may reflect power dynamics, not truth-tracking.                 | If students vote with teachers to avoid conflict, the panel’s effective size shrinks, harming reliability despite \(n=11\). |
  | **R9**   | **Ground Truth Existence**: There must be an objective, *knowable* correct verdict independent of the panel.                 | Assumptions     | CJT assumes a "correct" answer exists. Subjective or normative decisions (e.g., "fairness") lack ground truth.                                               | If the "correct" verdict depends on panel composition (e.g., student perspectives), CJT’s truth-tracking goal is incoherent. |

  ---

  ### **Clarifications on Your Points**
  - **Domain Separation**: Your suspicion is correct. Disagreements often conflate:
    - *Assumptions* (R1–R2, R4–R5, R8–R9): Must hold in reality.
    - *Conclusion* (R3): Must directly support the enlargement.
    - *Application* (R6–R7): Must bridge math to the committee’s context.
  - **Circularity in \(p\) (R1)**: Estimating \(p\) from past verdicts is circular if those verdicts relied on similar panels. Legitimate sources: individual decision records (e.g., teachers’ past rulings without a panel) or controlled experiments.
  - **Independence (R4)**: Requires votes independent *conditional on the evidence*. Shared reports or deliberation violate this unless all interpret identically. Deference (e.g., students copying teachers) is fatal.
  - **Multi-Stage Process (R6)**: Majority rule per stage doesn’t ensure overall reliability. A result must model the entire process or prove error reduction compounds favorably.
  - **Asymmetric Costs (R7)**: A symmetric-reliability result (e.g., CJT) cannot justify panel size without a cost-benefit analysis. Enlarging the panel might reduce total errors but increase FPs.
  - **Ground Truth (R9)**: Essential for CJT-style frameworks. If correctness is defined by the panel’s judgment (e.g., "consensus truth"), the theorem is inapplicable.

  ---

  ### **Conflicting Requirements and Feasibility**
  - **R4 (Independence) vs. R5 (Homogeneous Competence)**: 
    - *Conflict*: Real groups exhibit both dependence (e.g., shared training) and heterogeneity (e.g., student/teacher differences). Most theorems assume one or the other.
    - *Resolution*: **R4 is stricter**—dependence often invalidates results even with homogeneity. R5 can be relaxed with bounds on \(p_i\) (e.g., all \(p_i > 0.5\)).
  - **R7 (Asymmetric Costs) vs. Symmetric CJT**:
    - *Conflict*: CJT minimizes *total* errors; incorporating costs requires decision theory.
    - *Resolution*: **R7 is non-negotiable for justification** but can be addressed post-CJT (e.g., using majority votes as input to a cost-sensitive rule).

  **Project Viability**: Conflicts don’t doom the project outright. For example:
  - Relax R5 (allow heterogeneity) if \(p_i > 0.5\) and \(p_i\) are bounded below.
  - Address R7 by combining CJT with a cost-adjusted threshold (e.g., require supermajority for expulsion).

  ---

  ### **Most Restrictive Requirement**
  **R4 (Voter Independence)** eliminates the largest number of results. Most CJT extensions assume independence; real panels exhibit:
  - Shared evidence (e.g., identical incident reports).
  - Social dynamics (e.g., student deference to teachers).
  - Deliberation (e.g., pre-vote discussion).
  Results assuming independence become inapplicable, and dependent-voter models (e.g., "information cascades") often show *reduced* reliability gains.

  ---

  ### **Evaluation of Key Theorems Against Desiderata**
  | **Theorem/Extension**       | **Evaluation Against Requirements**                                                                                                     |
  |----------------------------|------------------------------------------------------------------------------------------------------------------------------------------|
  | **Standard Condorcet (CJT)** | **Fails most**: Violates R4 (independence), R5 (homogeneity), R6 (multi-stage), R7 (costs), R8 (assumes sincerity). Only valid for symmetric, single-stage decisions with identical, independent voters. |
  | **Heterogeneous CJT**       | **Addresses R5**: Proves reliability increases if average \(p > 0.5\) and \(p_i\) are not too low. **Still fails R4 (independence), R6–R7.** |
  | **Strategic Voting Models** | **Addresses R8**: Models agents voting strategically. Often shows majority rule is robust. **Fails R4, R7, and R9 (if no ground truth).** |
  | **Cost-Sensitive Extensions** | **Addresses R7**: Minimize expected cost (e.g., require larger majority for high-cost errors). **Fails R4, R6, and often R3 (asymptotic only).** |
  | **Dependent-Voter Models**  | **Addresses R4**: Incorporate correlated votes (e.g., shared evidence). Typically show *diminished* gains; may require larger \(n\) for improvement. **Fails R3, R5, R7.** |

  ---

  ### **Recommendation for Your Committee Report**
  1. **Reject the CJT argument** as stated: It fails R1 (circular competence), R3 (no proof for \(n=11\)), R4 (dependence in deliberations), and R7 (ignores cost asymmetry).
  2. **Propose alternatives**:
     - Pilot a smaller mixed panel (e.g., 5 members) to empirically estimate \(p_i\) and independence (addressing R1, R4).
     - Use a cost-sensitive voting rule (e.g., expulsion requires 8/11 votes) to address R7.
     - Demand evidence that student inclusion improves *diversity of perspectives* (not just size), counteracting deference (R4, R8).
  3. **Highlight structural flaws**: The three-stage process (R6) compounds errors; require analysis of overall reliability.

  This framework forces rigor in invoking mathematical justifications. By isolating failed requirements, you can challenge the administration’s argument without rejecting math wholesale.
