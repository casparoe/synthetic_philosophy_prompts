  Justification: Ben is correct that we should condition on confounders (pre-treatment variables that affect both assignment and outcome). He identifies age and region as pre-treatment. However, Marisol will object that we cannot know they are pre-treatment just from the data. Also, we should check if the differences in the four cells are indeed within sampling noise. We can do a quick check with standard error of proportions.

