  Now, the exchange:

  **(1) Marisol**: Uses the bottom row (everyone) to show T has 62.8% vs V's 61.7%. Since T is cheaper, she recommends scaling T.

  Rating: **Partly right**  
  Justification: The aggregate numbers are correct and show a slight edge for T. However, as Ben points out, the assignment was not random and the programs were targeted differently, so the aggregate comparison may be confounded. The cost-effectiveness point is valid, but the causal interpretation of the aggregate comparison is problematic.

  **(2) Ben**: Argues the aggregate is confounded because of non-random assignment. He notes that when split by region, V beats T in both urban (86.7% vs 85.3%) and rural (36.7% vs 29.0%). He calls this a Simpson reversal and says the disaggregated table (by region) is the one that speaks to the causal question.

  Rating: **Clearly right**  
  Justification: Simpson's paradox is a well-known phenomenon where an association in the aggregate can reverse when broken down by a confounding variable. Here, region is a confounding variable because the programs were deployed differently in urban and rural areas. The reversal is evident: in the aggregate T is slightly higher, but within each region V is higher. The non-random assignment by region makes the aggregate comparison misleading. Therefore, the disaggregated comparison by region is more appropriate for causal inference.

  **(3) Marisol**: Accepts disaggregation but then breaks it down further by age. She shows that in every one of the four region-age cells, T beats V (92>90, 82>80, 44>40, 24>20). She argues that if Ben's principle (finer is better) holds, then T is better. Alternatively, if that principle doesn't hold, then Ben needs a different rule.

  Rating: **Partly right** but mischaracterizes Ben's principle  
  Justification: Marisol's arithmetic is correct: within each of the four cells, T has a higher return rate. However, she attributes to Ben a principle that "finer is better" as a general rule, but Ben did not state that. He argued for conditioning on region because it was a pre-treatment confounder. Marisol's move is a reductio ad absurdum of the principle that we should always use the finest level of disaggregation. However, Ben did not propose that principle. He proposed conditioning on the confounder (region). Therefore, this is a mischaracterization of Ben's principle. The principle Ben invoked was about controlling for confounders, not about slicing arbitrarily. Moreover, the sample sizes in the four cells are small (especially rural, 50 and over: T has 150, V has 50) and the differences are small (2 to 4 percentage points) and may not be statistically significant.

