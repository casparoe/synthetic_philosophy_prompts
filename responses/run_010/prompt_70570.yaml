prompt: |-
  I'm giving a 30-minute talk plus discussion at a philosophy department colloquim in about three weeks and what I need from you is a Q&A prep sheet, not a defense of my view. No reading lists or references — I need what the people in that specific room will actually say out loud.

  The view, briefly. The chariot exchange in the Questions of King Milinda — Nagasena getting the king to agree that no axle, wheel, yoke or reins is the chariot, and that the chariot isn't something over and above them either, so "chariot" is a mere designation dependent on the assembled parts — gets read by analytic philosophers almost universally as an argument for something like mereological nihilism: wholes are conceptual fictions, only the parts are real, so the person is a fiction spread over the five aggregates. I argue that reading is wrong in two places. First, the argument isn't about what exists, it's about the direction of explanation: a term is a mere designation when it applies only in virtue of something that can be picked out independently of it, and the ordering only ever runs one way. Second — this is where most of my talk goes — once you take that seriously it doesn't stop at the person. The aggregates fail the very same test. Form can't be identified independently of the causal and conceptual order it sits in, and likewise for the rest, so the reduction has nowhere to terminate and there is no bottom floor. That's why I say anatta is a competitor to Parfit rather than an ancestor of him: Reductionism keeps the psychological-continuity facts as the real facts doing all the work, and my reading denies there are any terminal facts of that kind for it to keep.

  Argument sketch, so you have something to aim the objections at: (1) a designation is conventional iff it applies only in virtue of an explanatory ordering that terminates in what's independently identifiable; (2) the chariot argument establishes (1) rather than a claim about parthood, because every step Nagasena runs is about how the king would pick the thing out, not about whether it's a whole; (3) the same test, applied without special pleading, demotes the aggregates; (4) therefore the view is not "only the parts exist" but "nothing is ultimate," which is a different and much less comfortable position, and the one that puts it in competition with Parfit instead of in his family tree.

  The room. It's a mid-size generalist department, not a specialist workshop. In it: two people who work on personal identity — one a four-dimensionalist who thinks Parfit is best read as making a claim about what grounds survival, and one who works on grounding and metaphysical explanation and will immediately suspect that my "explanatory priority" is grounding with the serial numbers filed off; a philosopher of mind who'll want to know whether any of this touches the felt ownership of experience; two faculty from the religious studies side who work on Pali and Abhidhamma, know the conventional/ultimate distinction cold, hold that the dhammas are precisely what survives the analysis, and are alergic to analytic people strip-mining texts for arguments; and the chair, a Kantian, who'll moderate but has his own hobbyhorse about whether I'm smuggling in a transcendental argument. Nobody there does formal epistemology. Only the religious studies people are likely to have read any Madhyamaka, and I'm not assuming they've read Candrakirti's chariot analysis in the Madhyamakavatara — the one that walks through all the possible relations between the self and the aggregates — though one of them might.

  So: give me the eight-ish objections I'll actually get from this room — not the ones I'd get at a Buddhism conference or from a meditation teacher or from a LessWrong-adjacent crowd — ordered by how much damage they'd do, weighing both how likely each is and how hard it is to answer in the two minutes I'll have. Phrase each one the way that particular person would phrase it, in their vocabulary, including the version where they're right and I know it. For each: a two-minute reply, plus an honest note on where the reply is soft and what I'd have to give up to keep it. Then separately: what I should concede in the first five minutes to buy credibility with the Pali people without losing the metaphysicians; the one reply that has to land for the talk to survive; and the question I'm praying nobody asks, with the best answer I could manage if they do ask it. I already know the karma-and-responsibility problem is floating around and I have a dodge for it I'm not proud of — include it if you think it'll really come up, but rank it honestly rather than sparing my feelings.

  Two more things. Tell me where my own setup is confused: if "competitor not ancestor" is just marketing, if explanatory priority really is a distinction without a difference from grounding, or if a competent Pali specialist would say I've build the whole thing on a text that isn't doing anything I claim it's doing — say that flatly, up front, instead of working around it. I'd much rather hear it now than in the seminar room. And if you think the task as I've posed it can't be done well — say if these two halves of the audience want incompatible things from the same talk and no single prep sheet serves both — tell me that too rather than handing me a polite generic list of objections.
