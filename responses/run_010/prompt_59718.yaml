prompt: |-
  I write a science-and-ideas column and for the past six months I've been reporting a long feature about why biologists still can't agree on what selection actually acts on. The note my editor and I agreed on is that the piece doesn't take a side. That's a lie, obviously — I have a side, it's just an unstated one — and a population geneticist friend who read an early draft told me my "view" is incoherent and then, infuriatingly, wouldn't say where. Background you should have about me: I'm not a biologist, I did philosophy as an undergrad about twenty years ago and never got past intro evo, but I've read a fair amount in the popular and semi-popular literature and I've interviewed maybe fifteen people for this piece. So before I revise, can you audit the package for me? Here it is, stated as honestly as I can:

  (1) Selection proper happens to replicators, and the only things that replicate with the fidelity selection needs are genes — organisms and groups are things genes build or belong to, they get sorted, they don't get copied.
  (2) But I don't want to be a gene's-eye-view reductionist: organisms are real individuals, not just packaging, and the history of life is largely a history of things getting more integrated — the move to cells with nuclei, to multicellular bodies, to colonies that behave like a single creature.
  (3) The mid-century group selectionism that Williams went after is dead and deservedly dead: the math showed that selection between groups can't hold out against selection within them once there's any migration, and that result hasn't been overturned, only shouted at.
  (4) That said, I basically accept the major transitions picture — at each big transition, selection at a higher level suppressed the free-riding that would otherwise have torn the aggregate apart, and that's how new higher-level individuals got built.
  (5) I never let "for the good of the species" survive into copy. If a trade press book says it, I cut it.
  (6) I think Hamilton's rule handles altruism without needing groups at all, and I lean on the claim that inclusive-fitness and multilevel accounts are two ways of writing the same math, which makes me suspect the levels debate has been, at bottom, a notational quarrel dressed up as science — including that big public fight about whether inclusive fitness could handle eusociality, which struck me as mostly two camps scoring rhetorical points.
  (7) And I think selection is a very general thing: any population with variation, some heritability and differential reproduction is undergoing selection, which is why I'm comfortable talking about selection on ideas, on firms, even on algorithms, in the same breath.

  So: which of these genuinely pull against each other, which pairs only look like they do, and what is the cheapest revision that leaves me holding something I could defend in print to an actual theorist? Rank the tensions by how bad they are instead of listing seven of them as equally worrying, and for each one say specifically what would have to go and what I'd lose by giving it up — I'm not going to tell you which commitments I'd rather keep, partly because I've decided that would bias you and partly because I genuinely don't know. I also have this nagging sense that one of the terms in my list is doing double duty for me and I'm getting away with it in the draft because nobody reads closely, but I can't pin down which one or where the switch happens. Don't give me a tour of the debate, I've read plenty of that; I want the audit.
reasoning: |-
  Okay, the user is a science writer with a philosophy background working on a complex evolutionary biology piece about the unit of selection. They've presented seven core propositions that form their unstated position, but a population geneticist friend called it incoherent without specifics. The user wants an audit of internal tensions in their framework.

  Hmm, let me unpack their position first. Proposition 1 is pure gene-centrism - only genes replicate with sufficient fidelity for selection. But proposition 2 immediately pushes back against reductionism by emphasizing organisms as real individuals and evolutionary integration. That's the first major tension right there: how can organisms be mere vehicles if they're truly individuals with their own evolutionary trajectories?

  The user seems to want both Dawkins and Gould simultaneously - genes as fundamental replicators but organisms as meaningful biological units. That might be workable if they clearly distinguish replicators from vehicles/interactors, but proposition 2's "real individuals" language suggests ontological status beyond vehicles.

  Proposition 3 dismisses old group selection while proposition 4 embraces major transitions theory where higher-level selection occurs. The user doesn't seem to realize that modern group selection (MLS) is precisely the mechanism behind major transitions. Their rejection of "for the good of the species" in proposition 5 is consistent, but they're missing that MLS isn't about species benefit.

  Proposition 6's stance on Hamilton's rule is especially problematic. Claiming inclusive fitness makes groups unnecessary while also calling the levels debate "notational" shows deep confusion. Price's equation explicitly incorporates group structure, and Hamilton himself revised his views. The eusociality debate reference suggests they've oversimplified a substantive theoretical conflict.

  Proposition 7's generalized selection concept could work if carefully framed, but risks conflating biological evolution with mere selective processes. The user's philosophy background might be tempting them toward abstract formalism that biologists would reject as losing crucial biological meaning.

  The most alarming thing is how proposition 6 functions as an "incoherence magnet" - it tries to resolve tensions between 1/3 and 4 by claiming equivalence, but actually papers over real disagreements in the literature. When their population geneticist friend called the view incoherent, this was likely the epicenter.

  For revisions, they'll need to either fully embrace the multilevel perspective (making genes the replicator but accepting higher-level selection) or commit to strict gene-centrism and reframe major transitions accordingly. The middle path they're trying to walk collapses under scrutiny. Specifically, they must decide whether higher-level individuals can truly be units of selection or merely temporary vehicles.

  The user's frustration is palpable - they've done significant reading and interviews but might be applying philosophical unification where biological distinctions matter. Their nagging sense about "double duty" terms probably relates to how they're using "individual" and "selection" across levels without proper differentiation.

  This is a classic case where philosophy meets biological nuance - what looks like notational differences may actually represent substantive theoretical divides. Their challenge is to either acknowledge those divides or defend their unification more rigorously than current popular literature does.
answer: |-
  Here's an audit of your position, ranking tensions by severity and identifying the core problem areas. The fundamental issue isn't necessarily any *single* point being wrong, but the *relationships between them* creating contradictions when held simultaneously without careful qualification. Your population geneticist friend likely spotted the unresolved conflict between strict gene-level replication (1) and the reality of higher-level individuality/selection (2,4) combined with the attempt to dismiss the levels debate (6).

  **Severity Ranking & Core Tensions:**

  1.  **The "Incoherence Magnet": Point 6 (Hamilton's Rule & Levels Debate as Notational) vs. Points 1, 2, 4 & 7**
      *   **Tension:** This is the epicenter of the incoherence flagged by your friend. Point 6 attempts to resolve the tension between gene-centricism (1) and multilevel reality (2,4) by declaring the levels debate purely notational. **This doesn't hold water.**
          *   Point 1 states *only genes* are replicators ("selection proper"). Point 4 requires *selection acting at the higher level* to suppress free-riding during major transitions. Point 2 insists higher-level individuals are "real." **These require recognizing selection acting *on* those higher-level entities (organisms, colonies), not just genes.** Claiming Hamilton's Rule (focused on gene transmission via relatives) makes groups "unnecessary" (6) directly contradicts the mechanism you endorse for major transitions (4), which relies on group-level selection *suppressing within-group selection* (free-riding).
          *   The claim that inclusive fitness (IF) and multilevel selection (MLS) are "two ways of writing the same math" is superficially true (Price Equation), but philosophically and biologically misleading in this context. **The notation matters profoundly for *what you identify as the causal agent/unit*.**
              *   IF (as often applied) explains altruism *as if* the actor is maximizing gene copies via relatives, framing the gene/kin as the focal unit.
              *   MLS explicitly identifies the group as a unit *experiencing* differential survival/reproduction due to its collective properties (e.g., level of cooperation), with selection potentially acting *between groups*.
          *   Your acceptance of major transitions theory (4) *requires* the MLS perspective to make sense of the evolution of higher-level individuality. Point 6 undermines this by dismissing the *biological reality* of the level at which selection is acting, reducing it to mere calculation. Point 7 (general selection) amplifies this by potentially blurring the crucial biological distinction between replicators and interactors.
      *   **Cheapest Revision:** **Significantly qualify or abandon Point 6.** You *can* keep the mathematical equivalence claim *if* you immediately clarify its limitations: "While the underlying mathematics of inclusive fitness and multilevel selection models can often be translated, they conceptualize the *causal locus of selection* differently. My acceptance of the major transitions framework (point 4) necessitates acknowledging that selection can act *on* emergent higher-level units (like multicellular organisms or eusocial colonies) as cohesive wholes, suppressing selection at lower levels *within* them. Hamilton's rule provides a powerful gene-centric *accounting method* for kin-selected altruism but does not eliminate the biological reality of group-level selection in the evolution of higher-level individuals."
      *   **What You Lose:** The clean rhetorical dismissal of the levels debate as "just notation." You must explicitly acknowledge the reality of selection acting *on* higher-level units in specific contexts (major transitions).

  2.  **The Replicator vs. Interactor Tension: Point 1 (Genes-only replicators) vs. Points 2 (Organisms real), 4 (Higher-level selection), & 7 (General selection)**
      *   **Tension:** Point 1 defines "selection proper" as acting only on replicators (genes). Points 2 and 4 insist that organisms and higher-level aggregates are "real individuals" whose integration and evolution are fundamental to life's history. Point 7 talks about selection acting on ideas/firms/algorithms (which aren't genetic replicators). **What is selection *acting on*?** Dawkins resolved this with the Vehicle/Interactor concept: genes are the replicators; organisms/groups are the vehicles *on which* selection acts, influencing which replicators get copied. Your point 2 pushes beyond "packaging" towards ontological status, and point 4 requires selection to act *on the higher-level unit itself* to suppress internal conflict. Point 1's strict "only replicators" definition struggles with this.
      *   **Cheapest Revision:** **Explicitly adopt the Replicator/Interactor (Vehicle) distinction.** Reframe Point 1: "The *replicators* subject to selection with sufficient fidelity are genes. Selection *acts upon* interactors (vehicles) – entities like organisms or, under specific conditions like those in major transitions, higher-level groups – whose differential survival and reproduction cause differential replication of the replicators they contain." This allows you to keep "genes are the replicators" while making space for selection acting *on* organisms (point 2) and higher-level units (point 4) as interactors. For point 7, add: "In this broader sense, 'selection' describes a process acting on varying, reproducing interactors within a population, with biological evolution defined by genetic replicators."
      *   **What You Lose:** The absolute purity of "selection proper happens *only* to replicators (genes)". You gain conceptual clarity on *how* selection acts on organisms/groups without them needing to be replicators.

  3.  **Group Selection: Point 3 (Old Group Sel. Dead) vs. Point 4 (Major Transitions = New Group Sel.)**
      *   **Tension:** Less severe than the above, but your wording creates confusion. Point 3 dismisses "*mid-century* group selectionism" (Wynne-Edwards style "for the good of the group/species"). Point 4 endorses the mechanism central to *modern* multilevel selection theory (MLS), which *is* group selection - specifically, between-group selection overpowering within-group selection during major transitions. Calling MLS "higher-level selection" doesn't magically make it *not* group selection. Your editor/reader might see "group selection dead" (3) and "higher-level selection builds new individuals" (4) as contradictory.
      *   **Cheapest Revision:** **Sharpen the distinction in Point 3.** "The naive *mid-century group selectionism* that G.C. Williams critiqued – positing widespread adaptation *for the benefit of the species* against individual interest without rigorous models – is dead and deservedly dead. Its core mathematical flaw (vulnerability to within-group selection and migration) stands. However, *modern multilevel selection theory* (MLS), built on firmer mathematical foundations like the Price Equation, provides a robust framework showing how selection *between* groups can, under specific conditions (like very low migration/within-group conflict or the mechanisms enabling major transitions), overpower selection *within* groups and drive adaptations at the group level."
      *   **What You Lose:** The stark, punchy dismissal of "group selection" as a whole. You replace it with a nuanced historical dismissal of the *old, flawed version* while explicitly endorsing the *modern, mathematically sound version* that underpins point 4.

  4.  **General Selection (7) vs. Biological Specificity (1, 5)**
      *   **Tension:** Point 7's broad view ("selection on ideas, firms, algorithms") risks diluting the specific biological meaning you carefully defend elsewhere (genes as replicators in 1, rejecting species benefit in 5). Talking about "selection on ideas" in the same breath as natural selection can imply a direct equivalence that most biologists would reject. Biological evolution requires *heritable genetic variation* as the replicator.
      *   **Cheapest Revision:** **Add crucial qualifiers to Point 7.** "While the *abstract logic* of variation, heritability, and differential reproduction ('selection') applies to many domains (ideas, firms, algorithms), *biological evolution by natural selection* is specifically defined by genetic replicators (point 1). Analogies to cultural or algorithmic evolution can be insightful but involve different inheritance mechanisms and lack the strict fidelity of genetic replication central to biological adaptation." Explicitly separate "selection" as a general algorithmic process from "natural selection" as the specific biological instance.
      *   **What You Lose:** Some rhetorical force in drawing direct parallels between biological and cultural/technological evolution. You gain precision and avoid accusations of biological conflation.

  **The "Double Duty" Term:** Your suspicion is likely correct. The prime candidate is **"selection" itself.**

  *   **Where the Switch Happens:** You use "selection" in subtly different ways without explicitly signaling the shift:
      1.  **Strict Replicator Selection (Point 1):** Selection defined by *differential copying of replicators* (genes).
      2.  **Interactor/Vehice Selection (Points 2, 4 implied):** Selection defined by *differential survival/reproduction of interactors* (organisms, groups), which *causes* differential replication of the replicators within them.
      3.  **Generalized Algorithm (Point 7):** Selection defined as *any* process with variation, heritability, and differential reproduction.
  *   **How You Get Away With It:** In casual reading, "selection" seems consistent. But the biological meaning (especially the link to *inheritance/replication*) changes between points 1 and 7, and the *locus of action* (replicator vs. interactor) is blurred between 1 and 2/4. Your attempt to resolve the levels debate via math (6) tries to paper over this switch by implying the different meanings are computationally equivalent, masking the real biological distinctions.

  **The Cheapest Path to Coherence:** Your core tension is between gene-centrism (1) and multilevel reality (2,4). The minimal revision path is:

  1.  **Adopt the Replicator/Interactor Distinction** to resolve the core ontological tension (Points 1 vs 2/4).
  2.  **Explicitly Endorse Modern Multilevel Selection (MLS)** as the mechanism behind major transitions, ditching the misleading dismissal of *all* group selection (Revise Point 3, bolster Point 4).
  3.  **Radically Qualify or Abandon Point 6.** Acknowledge that while math can be translated, IF and MLS represent distinct *causal perspectives*, and MLS is essential for understanding major transitions. Don't dismiss the levels debate as *merely* notational.
  4.  **Clarify "Selection"** by distinguishing the general algorithmic concept from biological natural selection with genetic replicators (Point 7).
  5.  **Keep Point 5** – it's consistent and good practice.

  **What You End Up Holding:** A sophisticated, defensible position close to thinkers like David Sloan Wilson, Elliott Sober, or the later John Maynard Smith: Genes are the fundamental, high-fidelity replicators. Selection acts upon interactors/vehicles (organisms, and under specific conditions, groups). The evolution of complex life (Major Transitions) occurs when mechanisms evolve (e.g., developmental bottlenecks, policing) that allow groups to function as cohesive interactors, experiencing significant between-group selection that suppresses within-group selfishness. Inclusive fitness is a powerful calculational tool for kin selection but doesn't eliminate the need to recognize group-level interactors and selection in these major transitions. The old "for the good of the species" is still dead. Generalized "selection" is an analogy requiring careful handling.

  This is coherent, biologically informed, and avoids both naive reductionism and naive group-benefit thinking. It directly addresses the tension your population geneticist friend sensed but couldn't articulate: your draft likely tried to have the mathematical equivalence of levels (via Point 6) *without* accepting the biological reality of higher-level selection and individuality demanded by your own points 2 and 4, while clinging to a strict replicator-only definition (Point 1). Resolving *that* triad (1 vs 2/4 vs 6) is key.
