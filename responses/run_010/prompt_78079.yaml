  ### Recommendation for Your Chapter  
  Press the **kind-identity assumption**: argue that the debate stalls because neither side justifies *why* revisions should count as refining the same kind (realism) or creating a new one (constructivism). Use autism as a case study—track how diagnostic criteria, self-advocacy movements (channel 1), educational policies (channel 2), and screening tools (channel 3) interact. If criteria stabilize despite looping (e.g., consistent biomarkers in a subset), this pressures constructivists; if not, realists. The goal isn’t to "solve" the debate but to expose where the burden of proof lies.
