prompt: |-
  For about eleven years I have kept a private log of the verdicts of a woman I will call R., an argument partner from my old rationalist meetup group and, more recently, a fellow member of a small grantmaking committee. The log exists because she is unusually disciplined about not contradicting herself, and because I have never managed to reverse-engineer the rule she is actually running. Her verdicts, in the order I recorded them:

  1. The familiar dust-specks trade: one person tortured for fifty years, or a barely noticeable speck of dust in the eye of each of a number of people too large to be written down using the resources of the observable universe. She takes the specks without hesitation and describes the alternative as scope insensitivity dressed up as compassion.

  2. A mugging case: a stranger on the street claims he can inflict suffering of exactly that scale on exactly that number of people unless he is handed the contents of your wallet. She refuses, and insists the refusal requires no special machinery — the prior probability that a stranger on the street can do what he says he can do is doing all the work.

  3. A choice between a world of a billion people whose lives are excellent and a world of a hundred quadrillion people whose lives are barely worth living. She takes the second and calls the first an average-view error.

  4. She would spend a fixed sum on insecticide-treated nets rather than on rescuing one identified trapped miner, even at some expected-lives cost, and says that "identified" is doing no normative work in the choice.

  5. Two structurally similar proposals from teams she trusts equally. Proposal A: a monitoring program whose own model assigns a one-in-a-million chance per year of catching something catastrophic that nothing else would catch; she funded it. Proposal B: a program whose own model assigns a one-in-ten-billion chance of catching something a thousand times worse, the figure extrapolated from theory rather than from any observed base rate; she refused it, on the grounds that the number in B is not a probability but a shrug rendered in scientific notation. Asked whether she would fund B if the same figure were grounded in a frequency, she said she would have to think about it. That is the most she has ever conceded.

  The new case is ours, and she holds the deciding vote on a five-person committee. We are being asked to redirect roughly seven million dollars — money currently committed to a portfolio of ordinary, well-evidenced grants — into a research program whose entire justification is a tail risk. The technical case comes from a group with no stake in the outcome: they lose nothing if we decline, they have published their model, and two reviewers outside their institution have checked the argument and signed off on it. They do not offer a point estimate. They offer a distribution over the annual probability of an outcome everyone on the committee agrees is effectively unbounded in badness — the permanent disempowerment of every person who will ever live — spread roughly log-uniformly between one in a million and one in a trillion, with a median near one in a billion. Their calibration data genuinely supports the upper end of that range; the lower end is extrapolation. The proposed program would, on their own account, shift the whole distribution down by a factor of fifty.

  What I want from you:

  - Lay out the candidate decision rules that are jointly consistent with verdicts 1 through 5, including rules R. would indignantly disown. Then say which verdicts already rule out which candidates — bounded utility, maximin, the average view, a ceiling on how many beings may be aggregated across, any weighting of identified over statistical victims — and show each elimination rather than asserting it.
  - For every surviving rule, state what it implies about the new case, and give me the sentence she is most likely to say aloud in the meeting when defending that vote, since I will be in the room.
  - Commit to a prediction, and tell me how much evidential weight her own account of her rule in verdict 2 deserves, given that self-reports about one's decision procedure are precisely what I started the log to check.
  - Identify where the track record genuinely underdetermines her. In particular: does a rule that thresholds credence even have a well-defined output when it is handed a distribution over credences instead of a single number? If it does not, say what principle she would have to adopt on the spot in order to vote at all, and what she would thereby be committing the committee to.
  - Finally, name one or two cases I could put to her next month that would separate the surviving rules, saying for each which rule it would falsify. They need to be cheap enough to settle over dinner.

  I am not after a survey of the literature or anyone's name attached to a position. I want the rule-space, the vote, and the discriminating case.
reasoning: |-
  Hmm, this user presents an intricate puzzle about deciphering the decision rule of a rationalist colleague named R. based on her past verdicts across various ethical dilemmas. The user has meticulously logged R.'s judgments over eleven years and now faces a critical funding decision where R. holds the deciding vote. 

  The core challenge is reverse-engineering R.'s consistent but opaque decision procedure. From the five documented cases, I need to identify all logically possible rules that fit every verdict, systematically eliminate incompatible candidates, then apply surviving rules to the new tail-risk research proposal. 

  First, examining the verdicts: 
  1. Dust specks vs torture: R. chooses specks, rejecting scope insensitivity. This immediately eliminates hard aggregation limits and average utilitarianism. 
  2. Mugging: Refusal based on low prior probability. Crucially, she dismisses "special machinery," suggesting her rule isn't Pascal's mugging-resistant by design but relies on standard Bayesian skepticism. 
  3. Large population: Chooses vastly more lives barely worth living over fewer excellent ones. This kills average view and hints at total utilitarianism, but with caveats—her rejection of "average-view error" implies she's consciously avoiding that mistake. 
  4. Identified vs statistical lives: Treats them identically, eliminating another common bias. 
  5. Probabilistic proposals: Funds empirically grounded low-probability intervention but rejects theoretically extrapolated higher-impact one, drawing a sharp line between "probability" and "shrug." This is the richest clue—she requires epistemic warrant for probabilities.

  Now generating candidate rules: 
  - **Total utilitarianism** fits verdicts 1,3,4 but fails verdict 2 (mugging should be accepted if utility calculation outweighs low prior) and 5 (should fund proposal B if theoretical impact is large enough). 
  - **Thresholded credibility** (acting only on probabilities above some credibility floor) explains verdicts 2 and 5, but why accept dust specks (verdict 1) which involves astronomical numbers? Unless... she treats those numbers as sufficiently credible while rejecting mugger's claim and proposal B's extrapolation. 
  - **Expected value maximization with epistemic constraints** emerges as strongest candidate: maximizing expected utility but discounting claims lacking empirical grounding. This reconciles all verdicts: dust specks use mathematically definite numbers (credible), mugging has low-prior claim (non-credible), large population uses definite utilities (credible), identified/statistical equivalence avoids bias, and proposal B's "shrug" fails epistemic test.

  Eliminations: 
  - Bounded utility? Falsified by verdict 1 (astronomical aggregation). 
  - Maximin? Contradicts verdict 3 (choosing barely livable lives isn't maximizing worst outcome). 
  - Average view? Explicitly rejected in verdict 3. 
  - Aggregation ceiling? Contradicts verdict 1. 
  - Identified victim bias? Ruled out by verdict 4.

  For the new case: 
  - The proposal offers a log-uniform distribution of risk reduction. **Expected value maximization** would fund it since even pessimistic estimates (1 in a million annual probability) multiplied by "effectively unbounded" disutility yields massive expected value. But **thresholded credibility** might reject it because the lower bound (1 in a trillion) is an extrapolation—exactly the "shrug" she criticized in verdict 5. 

  Prediction dilemma: 
  Her verdict 2 self-report ("prior probability doing all the work") seems partially honest but incomplete—it doesn't explain her other choices. Given her consistency, she's likely aware of her epistemic constraints but frames decisions pragmatically. I predict she votes NO, attacking the extrapolated lower bound as non-probabilistic. 

  Discriminating tests: 
  To confirm, propose: 
  - A mugging with documented demonstrable capability (tests if she truly rejects all mugging-type cases or only epistemically ungrounded ones). 
  - A meteor defense system with narrow confidence interval around 1 in 100 million probability (tests if she accepts well-grounded tiny probabilities).

  The user's frustration is palpable—eleven years of outsmarting attempts—but this feels solvable. R.'s genius is requiring probabilities to be more than math: they must be epistemically clothed.
answer: |-
  Based on the eleven-year log and the constraints of verdicts 1–5, here is a systematic breakdown of the candidate decision rules, their implications for the new case, predictions, and future tests. R.'s rule appears to be **Expected Value Maximization with Epistemic Constraints** (EVM-EC), but the track record underdetermines whether she thresholds credibility or uses full distributional inputs. Below is the complete analysis.

  ### I. Candidate Decision Rules Consistent with Verdicts 1–5
  *(Eliminations shown where verdicts rule out candidates)*

  1. **Total Utilitarianism (TU)**  
     - *Fits*: Verdict 1 (aggregates vast specks > torture), Verdict 3 (total welfare higher in large population), Verdict 4 (no weight to "identified" victims).  
     - *Falsified by*: **Verdict 2** (TU would pay the mugger if wallet contents < astronomical suffering, but she refuses; low prior alone is insufficient for TU). **Verdict 5** (TU would fund Proposal B if theoretical impact *n × p* is large, but she rejects it).  
     - *Eliminated*: Yes.

  2. **Average Utilitarianism (AU)**  
     - *Fits*: None.  
     - *Falsified by*: **Verdict 3** (explicitly calls the first option an "average-view error"; she prefers vastly more barely-worth-living lives).  
     - *Eliminated*: Yes.

  3. **Maximin (Worst-Case Priority)**  
     - *Fits*: None.  
     - *Falsified by*: **Verdict 1** (avoids worst-case torture but accepts dust specks, which are worse for individuals than inaction; maximin would always prevent torture). **Verdict 3** (barely-worth-living world has a worse "worst case" than excellent-life world).  
     - *Eliminated*: Yes.

  4. **Aggregation Ceiling (Max N beings)**  
     - *Fits*: Verdict 2 (mugger ignored; suffering capped at low N).  
     - *Falsified by*: **Verdict 1** (accepts aggregation across astronomical N). **Verdict 3** (accepts welfare aggregation across 100 quadrillion).  
     - *Eliminated*: Yes.

  5. **Identified Victim Weighting**  
     - *Fits*: None.  
     - *Falsified by*: **Verdict 4** (explicitly states "identified" does no normative work; chooses nets over miner).  
     - *Eliminated*: Yes.

  6. **Bounded Utility (Diminishing Returns for Large Harms)**  
     - *Fits*: Verdict 2 (mugger ignored; torture disutility bounded).  
     - *Falsified by*: **Verdict 1** (unbounded aggregation: specks > torture implies no bound). **Verdict 3** (unbounded population aggregation).  
     - *Eliminated*: Yes.

  7. **Expected Value Maximization (EVM)**  
     - *Fits*: Verdict 1 (expected disutility of torture ≫ specks), Verdict 3 (total EV higher in large population), Verdict 4 (nets save more expected lives).  
     - *Falsified by*: **Verdict 2** (EVM would pay mugger if wallet value < [suffering × p(mugger-can-deliver)]; she refuses despite astronomical stakes). **Verdict 5** (EVM would fund Proposal B if impact is large, but she refuses).  
     - *Eliminated*: Yes.

  8. **Thresholded Credibility EVM (EVM-TC)**  
     - Maximizes EV but only for probabilities meeting a credibility threshold (e.g., grounded in data/frequency).  
     - *Fits*:  
       - Verdict 1 (astronomical N is mathematically definite, not extrapolated).  
       - Verdict 2 (mugger’s threat lacks credibility; "prior probability doing all the work").  
       - Verdict 3 (population sizes/welfare definite).  
       - Verdict 4 (cost-effectiveness definite).  
       - Verdict 5 (Proposal A: frequency-based probability credible; Proposal B: theoretical extrapolation "not a probability" → rejected).  
     - *Survives*: Yes.

  9. **Full Distribution EVM (EVM-FD)**  
     - Maximizes EV using entire probability distribution (e.g., integrates over all scenarios).  
     - *Fits*:  
       - Verdict 1 (definite EV calculation).  
       - Verdict 2 (low prior → low EV).  
       - Verdict 3 (definite EV).  
       - Verdict 4 (definite EV).  
       - Verdict 5 (Proposal A: funds due to non-zero EV; Proposal B: rejects because "shrug" implies EV cannot be calculated reliably).  
     - *Survives*: Yes.

  10. **Pascalian Longtermism (PL)**  
      - Maximizes EV with unbounded upside for reducing existential risks.  
      - *Fits*: Verdict 1, Verdict 3, Verdict 5 (funds Proposal A).  
      - *Falsified by*: **Verdict 2** (rejects mugging despite unbounded stakes). **Verdict 5** (rejects Proposal B, which has higher theoretical upside than A).  
      - *Eliminated*: Yes.

  **Surviving Rules**:  
  - **EVM-TC** (Thresholded Credibility EVM)  
  - **EVM-FD** (Full Distribution EVM)  

  ---

  ### II. Implications for the New Case & R.'s Likely Statements
  **Proposal Summary**: Redirect $7M to reduce log-uniformly distributed risk (1e-6 to 1e-12 annual p(catastrophe)) by factor of 50. Calibration supports upper end (1e-6); lower end (1e-12) is extrapolation. Outcome: "effectively unbounded" disutility.  

  - **EVM-TC (Thresholded Credibility)**:  
    - *Vote*: **NO**  
    - *Key reasoning*: Extrapolated lower bound (1e-12) fails credibility threshold (like Proposal B’s "shrug"). Only the upper bound (1e-6) is credible, but reducing p=1e-6 to 2e-8 has negligible EV against unbounded disutility.  
    - *Likely statement*:  
      > "This model’s lower bound isn’t a probability—it’s a *shrug* in log-space. We can’t policy-make on extrapolations; fund it when you have a frequency."  

  - **EVM-FD (Full Distribution EVM)**:  
    - *Vote*: **YES**  
    - *Key reasoning*: Integrates over full distribution. Log-uniform prior + median 1e-9 implies high EV: even pessimistic cuts (e.g., reducing p=1e-6 to 2e-8) yield massive EV gains for unbounded stakes.  
    - *Likely statement*:  
      > "The distribution is messy, but the expected reduction in risk is non-zero and colossal—failing to act is scope insensitivity."  

  ---

  ### III. Prediction & Evidential Weight of Self-Reports
  - **Prediction**: R. votes **NO** (aligning with EVM-TC).  
  - **Evidential weight for self-reports**: **Low** (≤10% confidence).  
    - *Why*:  
      1. Verdict 2’s self-report ("prior probability doing all the work") is incomplete; it doesn’t explain Verdict 5 (rejecting Proposal B) or Verdict 1 (dust specks).  
      2. The log exists *because* self-reports are unreliable; she likely describes a component (Bayesian priors) but not her full rule (epistemic thresholds).  
      3. Her concession in Verdict 5 ("have to think about it") suggests she withholds introspection to avoid exploitation.  

  ---

  ### IV. Underdetermination and Thresholding Dilemma
  - **Underdetermination**: Verdicts 1–5 do not distinguish between EVM-TC and EVM-FD.  
  - **Thresholding a Distribution**:  
    - A threshold rule **lacks a well-defined output** for distributions. It requires collapsing the distribution to a single "credible" probability (e.g., max, min, or calibrated mean).  
  - **Principle R. Must Adopt on the Spot**:  
    - She would use **calibrated evidence only**, discarding extrapolated tails (i.e., act only on p ≥ 1e-6). This commits the committee to:  
      > "Never fund interventions based on theoretical extrapolations below observed data."  
    - *Consequence*: Risks institutionalizing neglect of tail risks without empirical grounding.  

  ---

  ### V. Discriminating Test Cases  
  *(Cheap to settle over dinner; phrased as hypotheticals)*  

  1. **Calibrated Asteroid Defense**:  
     - *Scenario*: Fund a $10K study for an asteroid defense system. Calibrated models show p(impact) = 1e-9 per year (based on asteroid surveys). If impact occurs, all human life ends.  
     - *Which rule it falsifies*:  
       - EVM-TC funds it (credible probability).  
       - EVM-FD funds it.  
       - *Not discriminating*—both fund.  

  2. **Extrapolated Nano-Threat**:  
     - *Scenario*: Fund a $5K conference on nanotech regulation. Model: p(catastrophe) = 1e-15 per year, extrapolated from lab error rates. Calibration supports upper bound at 1e-12; lower bound is theory.  
     - *Which rule it falsifies*:  
       - EVM-TC **rejects** ("shrug" below calibration).  
       - EVM-FD **funds** (non-zero EV).  
       - *Falsifies EVM-FD* if she rejects it.  

  3. **High-Stakes Mugging with Evidence**:  
     - *Scenario*: A physicist shows peer-reviewed papers proving she can torture 3↑↑↑3 people unless paid $100. Calibration: Device works 1% of the time.  
     - *Which rule it falsifies*:  
       - EVM-TC **pays** (credible probability: p=0.01).  
       - EVM-FD **pays** (high EV).  
       - *Falsifies EVM-TC* if she refuses (inconsistent with Verdict 5’s frequency requirement).  

  **Optimal Discriminating Test**:  
  - **"Calibrated vs. Extrapolated Pandemic"**  
    - *Scenario*: Fund a $1K review of a lab studying Pathogen X.  
      - Model A: p(pandemic) = 1e-8/year (calibrated to historical outbreaks).  
      - Model B: p(pandemic) = 1e-14/year (extrapolated from mutation rates).  
    - *Prediction*:  
      - If R. funds A only → confirms **EVM-TC**.  
      - If R. funds both → confirms **EVM-FD**.  

  ---

  ### Conclusion  
  - **Rule-Space**: R. runs either **EVM-TC** (epistemic thresholds) or **EVM-FD** (full distribution integration).  
  - **New Case Vote**: Predicted **NO** (EVM-TC).  
  - **Discriminating Test**: Use "Calibrated vs. Extrapolated Pandemic" to force a choice.  

  Her consistency suggests EVM-TC is more likely, but her approach to distributions remains the critical unknown. If she funds the new proposal, it implies she secretly runs EVM-FD and misreported her reasoning in Verdict 5.
