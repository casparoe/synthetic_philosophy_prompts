answer: |-
  ## The Non-Constructive Ale

  **Classicist:** *(Slams pint glass on the bar at The LEM & Lime)* Another round, barkeep! And put it on my tab. After all, logic dictates there’s *someone* here such that if *they're* drinking, then *everyone* is. Since I’m drinking, obviously it could be me! Or... perhaps not. But one of us must satisfy the condition!

  **Constructivist Bartender:** *(Polishing a glass, unimpressed)* Right. Your famous Drinker’s Paradox. Seen it before. You classicists always split the cases: either everyone’s drinking, or someone isn’t. If everyone’s drinking, *anyone* works – pick me, I’m drinking this water. If someone *isn’t* drinking, pick *that* person. Since *they’re* not drinking, the implication "if they’re drinking then everyone is" holds vacuously. Clever.

  **Classicist:** Exactly! So the theorem holds. Mine’s a lager.

  **Constructivist Bartender:** Hold your horses. *You* haven’t actually *shown* me who this magical person is. You just waved your hands about two possibilities you can't actually decide between. You’ve got ¬¬(there exists such a person), sure. But *who* is it? Point them out. Is it Dave? Is it Susan? Is it *you*? Until you produce an actual drinker satisfying the condition *without* relying on that dodgy case split you pulled out of thin air...

  **Classicist:** *(Sighing)* Fine. It’s... Schrödinger’s Drinker. Both everyone and no one, until you observe the tab.

  **Constructivist Bartender:** Out. You're cut off. We don't serve hypotheticals. Pay your actual tab.
