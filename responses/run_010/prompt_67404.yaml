prompt: |-
  ok so I'm moving to cologne in March for work and their onboarding paperwork had a field for my Konfession, which apparently matters becuse the state pulls church tax straight off your payslip. From what I've been able to piece together the German system just assumes you belong to whatever church your parents belonged to, and the only way out is to prove to a civil authorty that you were never christened — which for a lot of people isn't a thing you can prove — so they end up funding a church they've left in every way except the paperwork.

  Here's the part I actually want to argue about, I'll call it the classification point: a state that has to sort its residents into religions in order to collect money for churches has already done the thing disestablishment is supposed to prevent. The sorting is the establishment. It doesn't help to say the money is technically a member contribution rather than a general tax, because the state is the one deciding who counts as a member, and once you're in the database you're inside the church as far as the law is concerned. So how do people who describe Germany as a secular state answer that? Is there any non-evasive way to describe the Kirchensteuer as something other than a compulsory tax on the descendants of Christians?

  Please engage the classification point as an argument rather than just telling me I can opt out — and if bits of my mechanics are wrong (Ive never lived there, so a lot of this is guesswork), say which bits, then say whether the argument survives the correction or whether it collapses with them. Also worth telling me whether the same argument would indict a system with no church tax at all.

  End with exactly one line in this form:
  Verdict: X
  where X is one of SORTING-IS-ESTABLISHMENT / SORTING-PROVES-TOO-MUCH / BOTH-PARTLY / WRONG-QUESTION
