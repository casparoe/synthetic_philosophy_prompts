answer: |-
  Here's the tight mapping you requested, treating the archive as a dataset with a biased DGP:

  1.  **"Populations absent not by accident but by design":** **MNAR (Missing Not At Random)**. The missingness mechanism (colonial power structures, racism, administrative priorities) is directly related to the unrecorded variables themselves (e.g., presence of marginalised groups, resistance activities). It's a near-perfect fit. The "design" *is* the non-ignorable missingness mechanism.

  2.  **"Read against the grain (attend to classifier/record-keeper)":** **Analysing the Missingness Mechanism / DAG structure.** Instead of taking the recorded values at face value (naive analysis), you focus on the selection node(s) in the DAG – *why* and *how* an observation (person, event) entered the record. This means modelling `P(Missing | X_observed, X_missing, Z)` where `Z` are the record-keeper's motivations/power structures. Very close fit.

  3.  **"Silence is itself a finding, not just a hole":** **Informative Missingness Patterns / Survivorship Bias as Signal.** The *pattern* of missingness (who is systematically absent, where, when) isn't random noise; it reveals the structure and priorities of the system that generated the data (the colonial state). This is a direct translation: the missingness mechanism *is* the finding. MNAR makes the pattern informative. Close fit.

  4.  **"Reconstructing the missing repeats the harm":** **Harmful Imputation / Ignoring MNAR mechanism.** Attempting statistical imputation (filling the gaps) based on observed data or flawed assumptions risks replicating the original exclusionary logic if the MNAR mechanism isn't correctly modelled and challenged. It imposes an external structure, potentially erasing the *reason* for absence. Fits conceptually ("bad imputation"), but the "harm" aspect adds an ethical dimension beyond pure statistical bias. Requires bending (adding ethics).

  **Residue Report:**

  *   **Clean Translators:** MNAR as the core mechanism, analysing the missingness process/DAG, informative patterns/survivorship bias as the key finding. The core arguments *are* fundamentally "MNAR, and the missingness mechanism is political" wrapped in historical prose. Your framework contains their central analytical point.
  *   **Requires Bending:** "Reconstruction repeats the harm." While analogous to bad imputation under MNAR, the emphasis on *ethical harm* and *replicating violence* isn't native to statistical vocabulary. You need to layer ethics onto the statistical concept.
  *   **No Expression / Sticking Point:** **You are correct.** The core residue is the **production of categories**. Statistical missingness (`Y_missing`) presupposes a well-defined variable `Y` (e.g., "Occupation", "Cause of Death"). Colonial archives often *created* the categories under which people were recorded (or not recorded) in the first place (e.g., racial classifications, taxable activities). The "target quantity" itself is an artefact of the oppressive DGP. There *is* no pre-existing `Y` column for many marginalised experiences; the archive actively defined what was recordable/thinkable. Statistical vocabulary struggles here because it assumes defined variables *exist* to be missing from. This isn't a defect in stats *nor* necessarily unclear history – it's a fundamental difference in focus (data analysis vs. critique of knowledge production).

  **Confidence & Least Sure Point:**

  *   **Overall Confidence:** **85%.** The MNAR framework maps remarkably well to the core historical arguments about systematic exclusion and biased sources. The DAG/selection node concept directly models "reading against the grain."
  *   **Least Confident Point:** **"Silence is itself a finding."** I'm confident it maps to *informative patterns*, but historians might argue they extract *more* specific meaning about power/resistance from the *specifics* of the silence (e.g., *which* group is missing *where*) than the statistical concept of "informative missingness" inherently conveys. Is "pattern" specific enough, or does the historical interpretation go deeper into the *qualitative nature* of the silence? (~75% sure on the nuance).
