prompt: |-
  ok so I'm in a second year phil of mind seminar and last week we did Dennett's multiple drafts material — the Orwellian vs Stalinesque distinction, the colour phi thing where people see the disc change colour partway across the gap before anything could have told them to, and his line that "what was it actually like for the subject before the revision" is a question with no answer because there's no theatre. I followed maybe 70% of it. But since then I cant stop thinking about Eternal Sunshine of the Spotless Mind, which is what my response paper is due on Friday, and I'd rather do the film properly than just wave at "memory is unreliable lol".

  So can you read the film through the Orwellian/Stalinesque distinction for me? When Lacuna wipes Joel, is that Stalinesque — he genuinely lives through each memory and then the record is destroyed — or Orwellian, where the wipe reaches back far enough that there was never a conscious moment of it in the first place? Because the film feels like it wants both. He's awake inside the memories, arguing with the Clementine in his head, scheming to hide her in memories she isn't in, which is about as Cartesian-theatre as cinema gets: there's a little watcher and the screen is being erased around him. But then he wakes up on Valentine's day with nothing and still takes the train out to Montauk, and the tapes Mary mails everyone have the feelings without any of the events, which points the other way.

  What I actually want out of you: tell me which way the film comes down and which scenes you'd point me at to argue it (describe them, don't quote, I don't have the disc here); tell me whether the theatre business is something to criticise the film for or whether it's doing real work — my hunch is the hide-Clem-in-a-childhood-memory move only makes any sense if there's a witness who survives the erasure, and then who is watching that; and be honest about where the film resists the Dennett reading rather than illustrating it, because I don't want to turn it into a diagram. Also, does the film take a stand on the thing Dennett thinks is ill-posed — what it was like for Joel beforehand? And where does the colour phi analogy just break, since a visual illusion about the timing of a colour change and a plot about deleting a relationship don't obviously have the same shape and I don't want to fake it. If any of my framing above is wrong or the film doesn't really support the question I'm asking, say that straight. No reading list or citations needed, I've got the primary texts. End by saying what you think the film gives the debate that an argument on its own wouldn't get you.
