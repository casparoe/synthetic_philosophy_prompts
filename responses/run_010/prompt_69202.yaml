answer: |-
  Here’s the exam question, model answer, and marking scheme designed to force engagement with the recursion worry while preempting common dodges.

  ---

  ### **In-Class Essay Question: Distributive Justice (75 mins, 25 marks)**  
  **Prompt:**  
  Metropolis operates a single-payer medical fund. Two residents develop the same chronic condition requiring lifelong treatment costing $X annually.  
  - **Resident A** developed the condition after a decade of high-altitude free climbing and roof inspection work. A began these activities as a competent adult with full knowledge of base-rate risks.  
  - **Resident B** developed the condition due to a genetic mutation.  
  The fund imposes a lifelong actuarial surcharge on A to cover A’s treatment costs. B receives treatment at no charge. **Crucially:**  
     (i) The surcharge revenue from A funds B’s treatment, making the scheme self-financing only if A’s surcharge stands;  
     (ii) A’s risk tolerance, discount rate for future health, and valuation of "a meaningful life" were significantly shaped by growing up in an environment where physical daring was the sole path to social status. Leaving would have meant rejecting their formative identity.  

  **Assess whether a luck egalitarian can consistently:**  
  (a) Justify charging A but not B;  
  (b) Define a non-arbitrary unit of "genuine choice" (vs. circumstance) that excludes A’s formative influences;  
  (c) Retain the theory’s distinctiveness if no such unit exists ("character, all the way down").  

  *Preemptive constraints for your response:*  
  - Do **not** argue that A was "compensated ex ante" (e.g., via wage premiums). Assume wages covered only immediate labor.  
  - Do **not** treat the surcharge as a neutral "price." Address whether it reflects a normative judgment about responsibility.  

  ---

  ### **Model Answer (710 words)**  
  Luck egalitarianism (LE) holds that inequalities are unjust unless they result from free choices for which individuals can be held responsible. The Metropolis case appears to align with LE’s core distinction: A’s condition stems from *option luck* (deliberate risk-taking), while B’s stems from *brute luck* (genetic chance). Charging A but compensating B thus seems to satisfy LE’s demand to correct unchosen disadvantages (part a). However, the case’s two constraints expose a fatal recursion problem for LE’s foundational concepts.  

  **(a) Superficial consistency, deeper instability**  
  LE *can* provisionally justify the surcharge by appealing to A’s informed adult choices. A’s knowledge of base rates seemingly renders the outcome a "cost of doing business" for their chosen lifestyle. Yet this justification relies on circular institutional logic: A’s surcharge *funds* B’s compensation. If A’s responsibility is voided (e.g., due to formative influences), the scheme collapses financially *and* normatively. LE cannot treat A’s choices as "responsibility-generating" while ignoring that the scheme’s viability depends on that classification being uncontested.  

  **(b) The impossibility of a "non-arbitrary unit"**  
  LE requires a bright line between "choice" (for which we bear costs) and "circumstance" (which society mitigates). But A’s case dissolves this boundary. Their adult choices—free climbing, risky work—were shaped by formative circumstances: a community equating status with physical daring, and an identity formed under conditions A could not reasonably reject *as a child*. If LE traces responsibility to the "authentic self," it must ask what made A’s risk appetite integral to that self. Yet every layer of character (preferences, risk tolerance, discount rates) emerges from unchosen influences—biology, upbringing, cultural context. To claim A’s choices are "genuinely theirs" is to arbitrarily freeze the responsibility-assessment at a point convenient for LE (e.g., "age 18+ with information"), ignoring constitutive luck. No non-arbitrary unit exists; "choice" is always scaffolded by circumstance.  

  **(c) Collapse into incoherence or outcome egalitarianism**  
  If "character is all the way down," LE faces a trilemma:  
  - **Option 1: Deny responsibility everywhere.** Conclude that *all* disadvantages are brute luck (since character is circumstance). This collapses LE into strict equality of outcome—abandoning its core commitment to responsibility.  
  - **Option 2: Assert arbitrary boundaries.** Fix "choice" at a stipulated point (e.g., "informed adult consent"). But this renders LE normatively hollow. If the boundary isn’t principled, LE merely codifies intuitions about "normal" agency (e.g., valuing white-collar risk-taking but penalizing blue-collar risks).  
  - **Option 3: Accept permanent indeterminacy.** Admit we cannot disentangle choice/circumstance but apply LE anyway as a "best effort." This sacrifices LE’s promise of *principled* justice, making it a pragmatic tool vulnerable to bias (e.g., blaming the poor for "choices" shaped by poverty).  

  The trilemma underscores LE’s vulnerability. Its distinction between option/brute luck is not merely *hard to apply*—it is *conceptually unstable* once we acknowledge the recursive depth of formative luck. LE cannot maintain its distinctiveness without a defensible theory of responsibility, which requires an unmoved mover of agency that does not exist.  

  **Conclusion: The cost of consistency**  
  LE can only "consistently" justify the surcharge by ignoring recursion (Option 2). But this exposes LE as ideological: it holds individuals responsible for choices produced by circumstances it arbitrarily excludes from scrutiny. The theory’s coherence requires suppressing the question of what made the chooser. If LE confronts recursion honestly, it must either abandon responsibility (Option 1) or admit its judgments are contestable and non-foundational (Option 3). Metropolis’s self-financing constraint heightens the stakes: LE’s viability *as policy* depends on not asking too many "why?" questions about character. This is the motte-and-bailey in practice: LE’s intuitive appeal (no one should suffer from sheer bad luck) relies on a bailey (we can isolate "sheer luck" from embedded agency) that cannot withstand scrutiny.  

  ---

  ### **Marking Scheme (25 marks)**  
  **Five Must-Hit Moves:**  
  1. **Applies LE distinction to case surface-level (4 marks)**  
     *Botch:* Misses that LE *prima facie* supports charging A/compensating B.  
  2. **Introduces recursion via A’s upbringing (5 marks)**  
     *Botch:* Treats A’s choices as purely voluntary without addressing formative influences.  
  3. **Identifies implications for "choice/circumstance" boundary (6 marks)**  
     *Botch:* Assumes LE can easily define "genuine choice" without confronting constitutive luck.  
  4. **Articulates the trilemma/collapse scenarios (6 marks)**  
     *Cost-bearing move:* Notes that ANY resolution sacrifices a core LE commitment (distinctiveness, non-arbitrariness, or determinacy).  
  5. **Connects recursion to institutional stability (4 marks)**  
     *Botch:* Ignores that the scheme’s self-financing depends on classifying A’s traits as "chosen."  

  **Diagnostic Note:** A basic answer reciting "brute luck vs. option luck" and applying it superficially (e.g., "A chose, B didn’t") would hit only Move 1 (4/25). It would miss Moves 2, 3, 4, and 5—especially the recursion problem (Move 2) and the trilemma (Move 4).  

  ---

  ### **Why This Works**  
  - **Preempts dodges:** Explicitly rules out "wage premium" and "surcharge-as-price" deflections.  
  - **Forces the squeeze:** Move 4 *requires* discussing costs of each horn of the trilemma.  
  - **Diagnostic clarity:** Surface-level answers max at 4/25, exposing insufficient engagement.  
  - **User’s ontology respected:** Focuses on argument, not citations; rejects "welfare sum" defaults.  

  The question makes recursion inescapable by embedding it in the institutional logic (A’s surcharge pays for B) and A’s backstory (normalized upbringing, not exotic coercion). Students *must* confront whether LE can survive its own scrutiny.
