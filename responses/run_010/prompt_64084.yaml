prompt: |-
  I'm 68 and three years into retirement after 34 years of fish systematics, spent almost entirely on one genus of small cold-water river fish in a folded mountain range — in the lab we never called them anything but the gray bellies. I described something like a dozen of their populations as species and then spent the back half of my career quietly lumping several of them, which is a humbling thing to have to do in print. Since I stopped working I've been reading philosophy for pleasure and have recently landed in philosophy of biology, where the species problem has me properly stuck. Every treatment I've found starts at the same door — do these populations interbreed? — and then walks you down a corridor of named concepts. That's no use to me, because in my own fish the questions never arrived in that order, and the one that settled things was usually about something else entirely.

  Here's the situation I actually lived with, and I'd like the instrument you build to be able to chew on it. There's an upstream population above a waterfall, cut off a long time: diagnosable at a glance (darker, smaller, different fin-ray counts), but on the mitochondrial marker we had in those days it sits neatly inside the downstream population rather than as a sister to it. There's a population in the next river over, equally diagnosable, spawning six weeks earlier on different substrate — but where the two ranges touch it hybridizes with the downstream fish freely, with fertile second-generation hybrids and a wide messy swarm in between, so nobody can call that a reproductive barrier and nobody can call the two things one tidy lineage either. And there's an all-female form in a single tributary that reproduces by taking sperm from the downstream fish to trigger egg development without incorporating the male's genome, so its an obligate dependent of the very population it's supposed to be distinct from. Whatever I ended up calling each of those, I first had to decide what my word was even doing, and that deciding had nothing to do with a slogan.

  So here's what I want. I'm putting together a diagnostic quiz for two audiences at once: my old grad students, who are out in agencies and survey work now, and a philosophy reading group I've joined at the library, most of whom have never held a specimen jar. Write me a decision tree of ten to fourteen questions that takes a person from wherever they start to a named position on what species are. My rules. Every node has to be a concrete case or a question about one — a waterfall, a hybrid swarm, a clone, a fossil series with no gap you could point your finger at, a bacterium trading genes sideways, a ring of populations where each links to the next — and never anything that leaks the label, so no "do you think species are real?" and no "does reproduction matter to you?" The root node must not be about interbreeding: start somewhere more basic, like whether the term is meant to name a joint in nature or just a filing system, or whether it has to work for all of life at once, and work your way down from there. Put the genuine positions at the leaves — the biological one, the evolutionary one, the phylogenetic/diagnosability one, the ecological one, the cohesion- and recognition-flavored ones, genotypic clusters, pluralism, outright nominalism — plus any others you think belong. For each leaf, tell me the field situation in which someone holding it would most regret the choice. I also want the tree built out of the logical space first rather than out of a list of names: show me which combinations of answers are available but empty, and for each empty cell say whether nobody lives there because the view is incoherent, because it's unattractive, or because nobody has bothered to explore it. And be honest about the pairs of leaves your questions can't actually separate, and say why they blur — I'd rather see that admitted than painted over. Don't give me a bibliography or a reading list and don't quote anyone at me; I'm not chasing anything down, I just want it argued out in plain language. Last thing, and it's the one I care about most: make sure at least one node forces the reader to say whether being nested inside another population defeats diagnosability, or whether diagnosability survives nestedness anyway.
reasoning: |-
  Okay, the user is a retired fish systematist with 34 years of experience working on a specific genus of fish they call "gray bellies." They described populations as species and then had to lump some back together, which was humbling. Now, they're into philosophy of biology, particularly the species problem. They're frustrated because existing frameworks start with interbreeding, but their real-world experience showed that the key questions were different and varied by case.

  The user wants a diagnostic quiz (decision tree) for two audiences: former grad students in agencies/survey work and a philosophy reading group with no biology background. The quiz must have 10-14 questions, each based on concrete cases (like waterfalls, hybrid swarms, clones) without using terms like "species" or "reproduction" upfront. The root node shouldn't start with interbreeding—instead, begin with more fundamental questions, like whether the term names a natural joint or just a filing system.  

  Key rules from the user:
  1. Every node is a concrete case or question about one—no abstract terms.
  2. Root node not about interbreeding; start with basics like purpose (natural joint vs. filing system).
  3. Leaf nodes should be named positions (biological, ecological, phylogenetic, etc.).
  4. For each leaf, describe a field situation where holding that view causes regret.
  5. Show logical space: which answer combinations are empty and why (incoherent, unattractive, unexplored).
  6. Admit where questions can't separate certain positions and explain why.
  7. Must include a node about whether nestedness defeats diagnosability.
  8. No bibliography or quotes—plain language only.

  Deep needs: The user is wrestling with the species problem based on their field experience. They want a tool that reflects the messiness they encountered—like populations that are diagnosable but nested, hybrid swarms, or clonal dependencies. They value honesty about blurred lines and gaps in the framework. Their identity as a scientist who revised their own work suggests they appreciate humility and precision. Unspoken, they might want validation that their practical struggles are legitimate in philosophical terms and to bridge the gap between field biology and theory.

  Structuring the decision tree:
  Start at the root with the most fundamental question: what's the purpose of the term? Is it carving nature at joints or organizing human knowledge? Then branch into scope: must it apply universally? Then move to criteria like diagnosability, interbreeding, ecological roles, etc. The waterfall case (nested populations) and hybrid swarm are crucial for testing diagnosability vs. reproductive isolation. The all-female clone case challenges genetic independence.

  For the leaf positions:
  - Phylogenetic: prioritizes diagnosability even if nested. Regret case: when diagnosable traits don't reflect evolutionary history.
  - Biological: strict reproductive isolation. Regret: hybrid swarms that defy clear boundaries.
  - Evolutionary: lineage persistence. Regret: clones dependent on another population.
  - Ecological: niche-based. Regret: populations with same niche but no gene flow.
  - Etc.

  Logical gaps: For example, if someone says the term is just a filing system but also requires universal application, that might be unattractive because filing systems don't need universality. Blurred lines: Ecological and cohesion concepts might overlap when niche and gene flow align.

  The nestedness node (Q6) is critical: does being nested defeat diagnosability? For phylogeneticists, diagnosability survives; for others, it might not.

  Ensuring the tree meets all user specs: Concrete cases, no jargon, covers regrets, gaps, and blurred positions, and stays within 10-14 questions.
answer: |-
  Here's a decision tree built from concrete cases and logical space, respecting your constraints. It has 11 core questions, leading to 9 core positions (+3 blurred/combined) and identifies gaps. Questions are phrased about "populations" and "the term," avoiding loaded words like "species" or "reproduction" until the leaves.

  **Root Question (Q1):**
  *   **Situation:** You have a unique fossil bone. You need a term to place it in a museum drawer and a field guide. Another researcher needs the same term to argue their new fossil represents a major branching point in the history of life.
  *   **Question:** Is the primary job of this term **A)** To organize human knowledge (like the museum drawer) efficiently, even if the lines are fuzzy? OR **B)** To name a real, independent "thing" existing in nature itself (like the branching point), regardless of how hard it is to categorize?

  **Branch A (Primary Job = Organization):**
  *   **Q2:** **Situation:** You have bacteria exchanging antibiotic resistance genes freely across wildly different lineages (like *E. coli* swapping genes with *Salmonella*), and you also have a distinct fossil dinosaur series with no clear gaps between forms over millions of years.
  *   **Question:** Should the term work the **same way** for the bacteria *and* the dinosaur series? **Yes** / **No**
      *   **Yes -> Leaf 1: Nominalism:** The term is purely a human-made label for convenience, grouping things based on similarity (morphological, genetic, ecological) useful for a specific purpose. No claim about natural "joints."
          *   *Regret Case:* Explaining why diagnosably distinct populations (like your waterfall fish) get the *same* label as their parental population just because they are nested within its variation, while equally distinct *non*-nested populations get a different label. Feels arbitrary.
      *   **No -> Leaf 2: Contextual Pluralism:** The term means different things (uses different criteria) depending on the organism or question. What defines "fish species" isn't what defines "bacterial species" or "fossil species". Criteria are chosen pragmatically per context.
          *   *Regret Case:* Trying to explain to conservation policymakers why two hybridizing, ecologically distinct populations of birds are "species" (using biological concept) while two equally distinct, non-hybridizing populations of lizards are "not species" (using phylogenetic concept) for the same management report. Feels inconsistent.

  **Branch B (Primary Job = Naming a Real Thing in Nature):**
  *   **Q3:** **Situation:** Consider all life: bacteria swapping genes sideways, your all-female fish clone depending on the downstream fish, ancient fossils with gradual change, and modern birds forming ring species.
  *   **Question:** Must the **same definition** of the term apply equally to *all* these fundamentally different cases? **Yes** / **No**
      *   **Yes -> Leaf 3: Universalism (Often leads to Evolutionary Concept):** The term must capture the fundamental unit of evolution across all life. The "thing" it names must be universally identifiable.
          *   *Regret Case:* Applying it to your all-female clone. It's a distinct lineage persisting over time (arguably an "evolutionary" unit), but it's utterly dependent on the "parental" population for its continued existence, undermining its independence.
  *   **No ->** (Proceed to Q4 - Criteria for the "Real Thing")

  **Branch B (No Universal Definition) -> Q4:**
  *   **Situation:** Look at your waterfall fish population: darker, smaller, different fins, but nested *within* the mitochondrial variation of the downstream fish. Also look at a fossil series showing gradual, seamless skeletal changes over 10 million years with no clear breaks.
  *   **Question:** Can the term **validly apply** to the waterfall population *or* a specific point in the fossil series, even if they are demonstrably part of a larger, continuous lineage without a sharp break? **Yes** / **No**
      *   **No -> Leaf 4: Evolutionary Species Concept (Emphasis on Independent Fate):** The "thing" is a single lineage evolving separately from others with its own evolutionary tendencies and fate. Nested forms or points within a continuum lack this independence.
          *   *Regret Case:* Your diagnosable waterfall fish. They look and act distinct in their isolated habitat, clearly on their own trajectory *now*, but their nested genetics and lack of a sharp origin point prevent applying the term, forcing you to lump them despite obvious current distinctness.
      *   **Yes ->** (Proceed to Q5 - What makes them distinct "things"?)

  **Branch B/Yes (Q4) -> Q5:**
  *   **Situation:** Compare two populations: 1) Your waterfall fish (diagnosable but nested). 2) A unique bacterium thriving only in boiling acid springs, genetically very similar to bacteria in nearby cool pools but unable to survive there.
  *   **Question:** For the term to apply, is the **crucial factor** that the population is *distinguishable* by reliable characteristics (like fin rays or heat tolerance)? **Yes** / **No**
      *   **Yes -> Leaf 5: Phylogenetic Species Concept (Diagnosability):** The "thing" is the smallest population distinguishable by unique, heritable characteristics (morphology, DNA, behavior). Nestedness doesn't defeat diagnosability.
          *   *Regret Case:* Your next-river-over fish and the downstream fish hybridizing freely where they meet. They are diagnosably distinct (spawning time, substrate) over most of their range, but the messy hybrid swarm makes drawing a clear boundary based *only* on fixed differences impossible. Applying the term feels forced.
      *   **No ->** (Proceed to Q6 - Focus on Interaction/Function)

  **Branch B/Yes/No (Q5) -> Q6:**
  *   **Situation:** Consider your next-river-over fish hybridizing freely with downstream fish in a contact zone, creating a wide, fertile hybrid swarm. Also consider a population of insects where individuals actively choose mates with a specific flash pattern, rarely mating outside their group despite physical proximity.
  *   **Question:** Is the **key factor** whether individuals from different populations **frequently form successful, fertile offspring together** in areas where they naturally encounter each other? **Yes** / **No**
      *   **Yes -> Leaf 6: Biological Species Concept (Reproductive Isolation):** The "thing" is a group of actually or potentially interbreeding populations reproductively isolated from other such groups. The hybrid swarm breaks down the barrier.
          *   *Regret Case:* Your waterfall fish. They *would* presumably interbreed freely if the waterfall vanished, but they are completely isolated *now* and diagnosably distinct. The term doesn't apply because you can't test isolation, leaving them unnamed despite clear divergence. Also painful for asexuals/all-female clones.
      *   **No ->** (Proceed to Q7 - Focus on Process/Cohesion)

  **Branch B/Yes/No/No (Q6) -> Q7:**
  *   **Situation:** Look at your all-female fish clone: dependent on sperm from the downstream fish but producing distinct, genetically identical (maternally) offspring. Also look at a widespread plant species where pollen blows vast distances, constantly connecting populations genetically.
  *   **Question:** Is the **key factor** the population's **genetic independence** – its ability to maintain its own genetic makeup distinct from others? **Yes** / **No**
      *   **Yes -> Leaf 7: Genotypic Cluster Concept:** The "thing" is a distinct cluster in genotypic space, separated by genetic gaps from other clusters. Requires significant multilocus genetic divergence.
          *   *Regret Case:* Recently diverged populations like your waterfall fish. They might be diagnosable morphologically and ecologically distinct, but lack the deep genetic divergence (especially if nested) to form a clear genotypic cluster separate from the downstream population. The term doesn't apply yet.
      *   **No ->** (Proceed to Q8 - Focus on Ecology/Cohesion Mechanisms)

  **Branch B/Yes/No/No/No (Q7) -> Q8:**
  *   **Situation:** Compare: 1) Your next-river-over fish spawning earlier on different substrate. 2) Two populations of moths in the same forest, one feeding on Oak A, one on Oak B, rarely encountering each other or interbreeding.
  *   **Question:** Is the **key factor** the population's **unique role or "job"** within its environment (e.g., spawning niche, host plant)? **Yes** / **No**
      *   **Yes -> Leaf 8: Ecological Species Concept:** The "thing" occupies a unique adaptive zone/niche. Distinct ecology defines it, even if hybridization occurs (like your next-river fish).
          *   *Regret Case:* Two distinct genotypic clusters (e.g., sister phylogenetic species) that happen to occupy identical niches in allopatry. Applying the term based solely on ecology ignores their evolutionary independence and diagnosable differences.
      *   **No ->** (Proceed to Q9 - Cohesion Mechanisms)

  **Branch B/Yes/No/No/No/No (Q8) -> Q9:**
  *   **Situation:** Consider the moth population with specific mate choice (flash pattern). Also consider a population of wind-pollinated pines where individuals are physically capable of pollinating distant pines of another type, but local environmental filters mean only pine type A seedlings survive in soil type A.
  *   **Question:** Is the **key factor** the **specific mechanisms actively holding the population together as a unit** and keeping it distinct? **Yes** / **No**
      *   **Yes -> Q9a:** What is the **primary cohesion mechanism**? **A)** Specific mate recognition systems (e.g., flash patterns, mating dances). **B)** Shared adaptations to local stabilizing selection (e.g., surviving on soil type A).
          *   **A) -> Leaf 9: Recognition Concept:** The "thing" is defined by a shared specific mate recognition system (SMRS) ensuring cohesion.
              *   *Regret Case:* Your all-female clone. It has no mate recognition system of its own; it parasitizes the downstream fish's SMRS. Applying the term based on SMRS excludes it despite being a distinct lineage.
          *   **B) -> Leaf 10: Cohesion Concept (Stabilizing Selection):** The "thing" is defined by mechanisms of genetic or demographic exchangeability, often driven by cohesive forces like stabilizing selection for a shared niche.
              *   *Regret Case:* Ring species where cohesion mechanisms work perfectly well between adjacent populations, but the endpoints are completely incompatible. Applying the term to the whole ring ignores the break; applying it to segments ignores the cohesion.
      *   **No -> Leaf 11: Blurred - Ecological/Phylogenetic/Evolutionary Hybrid:** This path often leads to a position prioritizing evolutionary trajectory/persistence *but* incorporating diagnosability or ecological role as evidence. The "thing" is a distinct lineage maintained by some combination of factors. *(See Blurred Positions below)*

  ### Critical Nestedness Node (Q5 - Embedded within the Tree)
  *   **Q5 Situation/Question** explicitly forces the choice: Diagnosability survives nestedness (Yes -> Phylogenetic Concept) or nestedness undermines the claim to being a distinct "thing" (No -> leading towards concepts requiring independence/cohesion).

  ### Logical Space & Empty Cells
  1.  **Organization (Q1A) + Universal Definition (Q2 Yes):** Filled (Nominalism).
  2.  **Organization (Q1A) + No Universal Definition (Q2 No):** Filled (Contextual Pluralism).
  3.  **Real Thing (Q1B) + Universal Definition (Q3 Yes):** Filled (Universalism/Evolutionary).
  4.  **Real Thing (Q1B) + No Universal Definition (Q3 No) + Cannot Apply to Nested/Gradual (Q4 No):** Filled (Evolutionary Concept).
  5.  **Real Thing (Q1B) + No Universal Definition (Q3 No) + Can Apply to Nested/Gradual (Q4 Yes) + Crucial Factor = Distinguishability (Q5 Yes):** Filled (Phylogenetic Concept).
  6.  **Real Thing (Q1B) + No Universal Definition (Q3 No) + Can Apply to Nested/Gradual (Q4 Yes) + Crucial Factor NOT Distinguishability (Q5 No) + Crucial Factor = Interbreeding (Q6 Yes):** Filled (Biological Concept).
  7.  **Real Thing (Q1B) + No Universal Definition (Q3 No) + Can Apply to Nested/Gradual (Q4 Yes) + Crucial Factor NOT Distinguishability (Q5 No) + Crucial Factor NOT Interbreeding (Q6 No) + Crucial Factor = Genetic Independence (Q7 Yes):** Filled (Genotypic Cluster).
  8.  **Real Thing (Q1B) + No Universal Definition (Q3 No) + Can Apply to Nested/Gradual (Q4 Yes) + Crucial Factor NOT Distinguishability (Q5 No) + Crucial Factor NOT Interbreeding (Q6 No) + Crucial Factor NOT Genetic Independence (Q7 No) + Crucial Factor = Unique Niche (Q8 Yes):** Filled (Ecological Concept).
  9.  **Real Thing (Q1B) + No Universal Definition (Q3 No) + Can Apply to Nested/Gradual (Q4 Yes) + Crucial Factor NOT Distinguishability (Q5 No) + Crucial Factor NOT Interbreeding (Q6 No) + Crucial Factor NOT Genetic Independence (Q7 No) + Crucial Factor NOT Unique Niche (Q8 No) + Crucial Factor = Cohesion Mechanism (Q9 Yes):** Filled (Recognition or Cohesion Concepts).
  10. **Real Thing (Q1B) + No Universal Definition (Q3 No) + Can Apply to Nested/Gradual (Q4 Yes) + Crucial Factor NOT Distinguishability (Q5 No) + Crucial Factor NOT Interbreeding (Q6 No) + Crucial Factor NOT Genetic Independence (Q7 No) + Crucial Factor NOT Unique Niche (Q8 No) + Crucial Factor NOT Cohesion Mechanism (Q9 No):** **Empty.**
      *   *Why?* **Incoherent.** If the "thing" is real, non-universal, applicable to nested/gradual forms, and distinguishability, interbreeding, genetic independence, unique niche, *and* cohesion mechanisms are *all* **not** the crucial factor, it's unclear what positive criterion defines the "thing". This position lacks content.
  11. **Organization (Q1A) + Crucial Factor = Interbreeding (etc.):** **Empty.**
      *   *Why?* **Incoherent.** If the term is purely organizational, it doesn't make sense to insist on a specific *biological* criterion (like interbreeding) as crucial *for defining the real thing*. The organizational purpose dictates the criteria, not vice-versa.
  12. **Real Thing (Q1B) + Universal Definition (Q3 Yes) + Crucial Factor = Interbreeding (etc.):** **Empty.**
      *   *Why?* **Unattractive/Incoherent.** Insisting on a universal definition (like interbreeding) immediately fails for asexuals, fossils, and ring species endpoints, making the concept useless for its stated universal purpose. Few defend pure universal BSC for this reason.

  ### Blurred Positions (Where the Tree Can't Fully Separate)
  1.  **Evolutionary Concept vs. Cohesion Concept:** Distinction blurs when "lineage with independent evolutionary fate" relies heavily on "cohesion mechanisms" for that independence. The tree separates them based on Q4 (Can term apply to nested/gradual forms?) and Q9 (Is a specific cohesion mechanism the *crucial* factor?), but in practice, proponents often blend these ideas. *Why blur?* Both fundamentally focus on lineage persistence and distinction over time; cohesion mechanisms are the *how*, independent fate is the *outcome*.
  2.  **Ecological Concept vs. Cohesion Concept (Stabilizing Selection):** Blurs significantly. Both emphasize adaptation to the environment as key. The tree tries to separate them at Q8 (Is unique niche the *crucial* factor?) vs. Q9 (Is cohesion mechanism the crucial factor?), but stabilizing selection *is* a key cohesion mechanism defining an ecological niche. *Why blur?* Shared adaptation to a specific environment is central to both.
  3.  **Phylogenetic Concept vs. "Blurred Hybrid" (Leaf 11):** The path to Leaf 11 (Q9 "No") often lands at a position valuing diagnosability *as evidence for* a distinct evolutionary lineage, closely aligning with how many phylogeneticists actually use their concept. *Why blur?* Diagnosability is often a *proxy* for evolutionary independence, not the end goal itself for many users of the PSC.

  This tree forces confrontation with your core cases (waterfall/nestedness, hybrid swarm, clone) and the fundamental tension between organization, reality, universality, and specific criteria. It highlights where the messiness you experienced creates genuine friction points for any definition.
