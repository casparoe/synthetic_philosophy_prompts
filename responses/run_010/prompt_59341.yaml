prompt: |-
  I help put together a printed growing almanac for our county — a volunteer thing, about two thousand copies, and once it goes to the printers in November we can't change a word of it for a year. Around forty recorders in different villages send in their notes each season and we turn them into the short rules that go in the book (sow this after that, don't prune until...). My problem is I have no idea when a run of seasons is actually enough to print a rule, and we've got a bad one going in this year: broad beans in the ground before Christmas for an earlier crop. It worked eleven years running on my own plot and has now failed twice in three winters. Half the committee want it struck out, half say a couple of bad patches proves nothing.

  Can you write me a decision procedure we could run at a meeting without any statistics: the questions to ask in order about a candidate rule, what counts as a good enough answer to each, when a rule gets demoted to a "sometimes" note and when it gets cut entirely, and where the procedure has to stop and say this is a judgement call for humans. Someone once told me there's a whole philosophy problem about the same data fitting several different rules — I'm not asking for a lecture on that, but the procedure should cope with it.

  Two things I especially need it to handle. First, our recorders don't use the same words: one village logs a seedling as "sulking" after transplanting, another calls the same thing "checking", and a third means something else again, so I need a test for whether a rule is even about the same thing from one end of the county to the other. Second, the baseline keeps moving — winters are milder then when the older rules were written — and I need some way of telling bad luck from a world that's changed, or an honest note that you can't.

  Then run it on three cases: the broad beans rule above; a recorder's rule logged for only three seasons, all in one walled garden, which she's very confident about; and a rule about feeding tomatoes that everyone swears by but nobody can say what it actually predicts. Make sure at least one comes out with an answer the committee won't like, and finish with a short list of what the procedure can't do. British English please, and keep it usable — we meet in a village hall on a Tuesday and we're not going to read anything clever.
reasoning: |-
  We are creating a decision procedure for evaluating gardening rules for inclusion in an almanac. The procedure must be non-statistical and usable by a committee in a village hall. It must address:
  1. When a rule is reliable enough to print.
  2. How to handle variations in terminology (e.g., "sulking" vs. "checking").
  3. How to account for changing baselines (e.g., climate change).
  4. When to demote a rule to "sometimes" or remove it entirely.

  The procedure will consist of a series of questions. For each candidate rule, we ask these questions in order. The answers will lead us to one of the following outcomes:
  - **Print as a rule**: Reliable enough to state as a general practice.
  - **Print as a "sometimes" note**: The rule works in some conditions but not reliably enough to be a general rule.
  - **Cut entirely**: The rule is not supported or is no longer valid.
  - **Judgement call**: The data is inconclusive and requires human judgment.

  We also need to handle three specific cases as examples.

  **Decision Procedure:**

  1. **Question 1: Is the rule clearly defined?**
     - Check if the rule is unambiguous and specific. What exactly is being recommended? (e.g., "sow broad beans before Christmas for an earlier crop")
     - Also, what is the expected outcome? (e.g., "earlier crop")
     - If the rule is vague (e.g., "feed tomatoes in a way that everyone swears by but nobody can say what it actually predicts"), then it fails this question.
     - **Good enough answer**: The rule must be clear about the action and the expected result. If not, it cannot be printed as a rule. It might be demoted to a note with clarification or cut.
     - Outcome if failed: Either rewrite to clarify (if possible) or mark for cutting. If the rule is too vague to be tested, it cannot be a rule.

  2. **Question 2: Are we comparing like with like? (Terminology check)**
     - Check if the same phenomena are being described in the same way across recorders. For example, does "sulking" mean the same as "checking"?
     - **Test**: Ask the recorders to describe what they mean by the terms. If the descriptions match (e.g., both describe a temporary pause in growth after transplanting), then it's the same. If not, then we have a problem.
     - **Good enough answer**: If the same concept is being recorded, even with different words, we can proceed. If there is a fundamental difference (e.g., one recorder means pest damage, another means frost damage), then we cannot aggregate the data for this rule. We might need to split the rule by region or condition, or note that it only applies in specific circumstances.
     - Outcome if failed: The rule might be restricted to the regions where the terminology is consistent, or we might have to drop it if the confusion is too widespread.

  3. **Question 3: How many seasons of data do we have?**
     - Count the number of seasons for which we have records supporting the rule. We are not doing statistics, but we need a minimum to have any confidence.
     - **Thresholds**:
       - Less than 5 seasons: Not enough data to be a rule. Might be printed as an observation with a note that it's based on limited data (but see Question 4 about conditions).
       - 5 to 10 seasons: Proceed to the next questions, but we are less confident.
       - More than 10 seasons: Good, but we must also check consistency (next question).
     - **Note**: The rule might come from multiple recorders in different locations. We are counting the number of seasons in which the rule was tested and the outcome recorded, regardless of the recorder.

  4. **Question 4: How consistent is the rule?**
     - Look at the success rate. We don't need exact numbers, but we need to know: did it work in most years, or only sometimes?
     - **Thresholds**:
       - If the rule worked in 80% or more of the recorded seasons: consistent.
       - Between 50% and 80%: inconsistent (works sometimes).
       - Below 50%: mostly fails.
     - However, we must account for changing conditions (Question 5). Also, if the rule has been tried in very different conditions (e.g., only in walled gardens, or only in one soil type), we note that.

  5. **Question 5: Is there a pattern to the failures? (Changing baseline check)**
     - Look for trends in the failures. For example, did the rule start failing in the last few years? Are failures clustered in particular conditions (e.g., very wet winters, or after a certain year)?
     - **Check for climate change**: If the rule was reliable in the past but has been failing more recently, and if we know that winters have become milder (or other relevant changes), then the rule might be becoming obsolete.
     - **Good enough answer**: If failures are random (no pattern) and the rule has been around for a long time, it might be bad luck. If there's a pattern (e.g., all failures in the last 5 years) and we have a known environmental change, then the rule may no longer be reliable.

  6. **Question 6: Are there known conditions under which the rule works?**
     - Some rules only work in specific situations (e.g., only in walled gardens, only on light soils). If so, we must note that.
     - If the rule has been tested only in one type of condition (like the walled garden example), then it cannot be a general rule. It might be printed as a note for that specific condition.

  **Decision Tree Summary:**

  - If the rule is not clearly defined (Question 1 fails) → **Cut entirely** or rewrite (if possible, then reassess). If rewritten, go back to start.
  - If terminology is inconsistent (Question 2 fails) and we cannot reconcile → **Demote to a "sometimes" note with conditions** (if we can define the conditions) or **cut entirely** if too confusing.
  - If less than 5 seasons of data (Question 3) → **Do not print as a rule**. It might be printed as an observation with a note about limited data, but only if it's from one recorder and clearly labeled as such (e.g., "In a walled garden in X, ..."). But if it's from multiple recorders and still less than 5, we might hold off until more data.
  - If 5 or more seasons but consistency is below 80% (Question 4) → **Demote to "sometimes" note** and try to specify conditions (using Question 6).
  - If consistency is 80% or above, but we see a pattern of recent failures (Question 5) that we suspect is due to a changing baseline → **Demote to "sometimes" note** and add a caution (e.g., "This rule has been less reliable in recent milder winters").
  - If consistency is 80% or above and no pattern of failure (or pattern is random) → **Print as a rule**.
  - If we cannot determine the pattern (e.g., we don't have enough information about the failures) → **Judgement call**: The committee must decide based on their experience.

  **Handling the three cases:**

  1. **Broad beans rule:**
     - Rule: "Sow broad beans in the ground before Christmas for an earlier crop."
     - History: Worked 11 years running, then failed twice in the last three winters.
     - Data: 14 seasons (11 successes, 2 failures, and one unknown? We know 11 in a row then 2 failures in the last 3). So overall, 11 successes and 2 failures? But wait, the last 3 winters: 2 failures and one success? So total: 12 successes, 2 failures? (11+1=12 successes, 2 failures) → 12/14 = 86% success rate.
     - Apply the procedure:
       - Q1: Clear? Yes.
       - Q2: Terminology? We assume same meaning across recorders (no issue raised).
       - Q3: 14 seasons → enough.
       - Q4: 86% success rate → consistent (above 80%).
       - Q5: Pattern? The two failures are recent. Also, we know winters are getting milder. This suggests a changing baseline. We should be cautious.
       - Q6: Conditions? The rule might now depend on the winter being cold enough? Not specified.
     - Outcome: Because of the recent pattern and changing climate, we demote to a "sometimes" note. We add: "This has been less reliable in recent milder winters. Consider as a strategy in colder winters."

  2. **Walled garden rule (only 3 seasons, one location):**
     - Rule: Let's say it's about pruning a particular plant at a specific time, and it's worked for 3 seasons in a walled garden.
     - Apply the procedure:
       - Q1: Clear? Assume yes.
       - Q2: Terminology? Only one recorder, so consistent.
       - Q3: Only 3 seasons → not enough (less than 5). Do not print as a rule.
       - However, we might consider printing it as an observation from that specific garden: "In a walled garden in [village], pruning [plant] in [month] has led to [result] for three years running." But it's not a county-wide rule.
     - Outcome: **Do not print as a rule**. It can be included as a note with the specific condition (walled garden) and labeled as based on limited data.

  3. **Tomato feeding rule:**
     - Rule: Everyone swears by it, but nobody can say what it actually predicts (vague).
     - Apply the procedure:
       - Q1: Clear? No. The rule is not defined. What is the feeding method? What is the expected outcome? Without that, we cannot test it.
     - Outcome: **Cut entirely** or rewrite. If the committee can rewrite it to be specific, then reassess. Otherwise, it's out.

  **What the procedure cannot do:**
  1. Predict the future with certainty.
  2. Account for every possible variable (e.g., microclimates, soil variations) without data.
  3. Resolve disputes about what a term means without input from recorders.
  4. Handle rules that are inherently subjective (e.g., "when the soil feels right") without clear criteria.
  5. Replace expert judgement when the data is sparse or conflicting.

  **Final Note for the Committee:**
  The procedure is a guide. There will be cases that require discussion and common sense. The goal is consistency and clarity in the almanac. If in doubt, err on the side of caution to avoid giving advice that might fail and put off gardeners.

  **Procedure in a Nutshell for the Meeting:**
  1. **Clarity**: Is the rule clear? (If not, rewrite or cut)
  2. **Terminology**: Do all recorders mean the same thing? (If not, restrict the rule or cut)
  3. **Data Count**: At least 5 seasons? (If less, do not make a rule; maybe a note)
  4. **Consistency**: Worked in at least 80% of cases? (If not, demote to "sometimes")
  5. **Pattern of Failure**: Recent failures with a changing environment? (If yes, demote and caution)
  6. **Conditions**: Only works in specific situations? (If yes, note them)

  Then decide: Print as rule, sometimes note, or cut. If stuck, it's a judgement call.
answer: |-
  Below is a straightforward decision procedure for your committee. It's designed as a checklist of questions to ask about any candidate rule during your meeting. I've kept it practical and jargon-free—no statistics, just clear yes/no/maybe answers and common sense. The goal is to decide whether a rule should be printed as a firm guideline, demoted to a "sometimes" note (with conditions), or cut entirely. It also flags when a decision needs human judgement.

  The procedure handles your two key issues:  
  - **Differing terminology** (e.g., "sulking" vs. "checking") by testing if the rule describes the *same event* across recorders.  
  - **Changing baselines** (e.g., milder winters) by looking for patterns in failures and asking if something fundamental has shifted.  

  **Decision Procedure: The Village Hall Checklist**  
  *Run through these questions in order for each rule. Stop early if you hit a "cut" or "judgement call" answer.*

  1. **Is the rule clear and specific?**  
     - *Ask:* "Can we all understand exactly what to do and what outcome to expect?"  
     - *Good enough answer:* **Yes**—if it states a specific action (e.g., "sow broad beans before Christmas") and a specific result (e.g., "for an earlier crop").  
     - **No?** → *Cut entirely*. It’s not a reliable rule if no one can define it.  
     - *Example:* A vague "feed tomatoes" rule with no clear method or outcome fails here.  

  2. **Is the rule about the same thing across all villages?**  
     - *Ask:* "Do all recorders mean the same event, even if they use different words?"  
     - *Test:* Compare notes for the same season. If "sulking" in Village A and "checking" in Village B both describe seedlings stalling after transplanting, they match. If "checking" in Village C means pest damage, they don’t.  
     - *Good enough answer:* **Yes**—if ≥80% of recorders describe the same cause and effect.  
     - **No?** → *Demote to "sometimes"* and add a note like "Works best in light soils" or "Avoid in frost pockets," based on where it succeeded.  
     - *Stop if:* You can’t agree—this becomes a **judgement call**.  

  3. **Has the rule been tested enough?**  
     - *Ask:* "How many seasons of data do we have, and from how many places?"  
     - *Thresholds:*  
       - **< 5 seasons** → Not enough.  
       - **5–10 seasons** → Bare minimum.  
       - **> 10 seasons** → Good.  
     - *Good enough answer:* **Yes**—if ≥5 seasons AND from ≥3 locations (e.g., not just one garden).  
     - **No?** → *Do not print as a rule*. It might become a "sometimes" note if it passed Q1–Q2 and has strong local support (see Q6).  

  4. **Has the rule worked consistently?**  
     - *Ask:* "Did it succeed in most years, or is it hit-and-miss?"  
     - *Threshold:* **≥80% success rate** (e.g., 8 good years out of 10). Estimate—no maths needed.  
     - *Good enough answer:* **Yes**—if it meets the threshold.  
     - **No?** → *Demote to "sometimes"* and specify conditions (e.g., "in mild springs").  
     - *Stop if:* Success rate is borderline (e.g., 70–80%)—go to Q5.  

  5. **Are failures just bad luck, or is something changing?**  
     - *Ask:* "Do failures cluster in recent years or under certain conditions?"  
     - *Check for:*  
       - **Time patterns**: e.g., Failed a lot in the last 5 years but worked before.  
       - **Known changes**: e.g., Milder winters, wetter springs.  
     - *Good enough answer:* **Bad luck**—if failures are random and baseline is stable. Keep or demote based on Q4.  
     - **Changing world?** → *Demote to "sometimes"* and add a warning (e.g., "Less reliable now winters are milder").  
     - **Unsure?** → **Judgement call**. If you suspect change but lack proof, note it as "under review."  

  6. **Is there strong local belief?** (Use only if rule failed earlier steps)  
     - *Ask:* "Do experienced recorders swear by it, even without data?"  
     - *Good enough answer:* **Yes**—if multiple trusted recorders back it AND it passed Q1–Q2.  
     - **No?** → Stick with earlier decision.  
     - *Outcome:* Rules here become **"sometimes" notes** with a qualifier like "Some gardeners find…". Don’t use this for brand-new rules.  

  **Final Outcomes**  
  - **Print as rule** → Only if it passes all of Q1–Q5 with "yes".  
  - **"Sometimes" note** → If it fails Q3–Q5 but passes Q1–Q2, or has strong local belief (Q6).  
  - **Cut entirely** → If it fails Q1 or Q2 badly.  
  - **Judgement call** → If disagreements persist or data is muddy.  

  ---

  **Running the Procedure on Your Three Cases**  
  *Assumed committee answers based on your description.*

  1. **Broad beans rule (sow before Christmas for early crop)**  
     - Q1: **Yes**—Specific (sow timing) and clear outcome (earlier crop).  
     - Q2: **Yes**—All recorders mean the same event (sowing/emergence).  
     - Q3: **Yes**—14 seasons (11 good + 3 recent with 2 failures).  
     - Q4: **No**—Success rate dropped: 11/11 initially, but 1/3 recently. Overall ≈86% (12/14), but recent drop is worrying.  
     - Q5: **Changing world**—Failures clustered in recent milder winters. Not bad luck.  
     - *Outcome:* **Demote to "sometimes" note**. Add: "Sow before Christmas for earlier crop, but less reliable in mild winters."  
     - *Why the committee won’t like it:* Half wanted it cut, half kept. This compromise acknowledges climate shifts but keeps the rule with a warning.  

  2. **Walled garden rule (3 seasons, one location)**  
     - Q1: **Yes**—Assume it’s clear (e.g., "Prune roses in March for more blooms").  
     - Q2: **Yes**—Only one recorder, so no terminology clash.  
     - Q3: **No**—Only 3 seasons and one location. Not enough.  
     - → Skips Q4–Q5.  
     - Q6: **Yes**—Recorder is very confident.  
     - *Outcome:* **"Sometimes" note** with conditions. E.g., "In walled gardens, some find pruning roses in March boosts blooms."  
     - *Why the committee won’t like it:* The recorder may feel their expertise is undervalued, but county-wide rules need broader evidence.  

  3. **Tomato feeding rule ("everyone swears by it, no clear predictions")**  
     - Q1: **No**—Unclear what it predicts (e.g., "feed for better tomatoes" isn’t measurable).  
     - *Outcome:* **Cut entirely**.  
     - *Why the committee won’t like it:* Popular rules are comforting, but vagueness makes them unreliable for print.  

  ---

  **What This Procedure Can’t Do**  
  1. **Predict the future**—It can’t guarantee a rule will work next year.  
  2. **Resolve deep disagreements**—If recorders fundamentally disagree on terms (e.g., "sulking"), it flags for judgement but won’t solve it.  
  3. **Handle rare events**—Rules tested <5 times might be valid but get demoted due to lack of data.  
  4. **Prove climate change**—It spots patterns (e.g., recent failures) but can’t confirm why without expert input.  
  5. **Replace expertise**—When data is conflicted (e.g., 55% success rate), it defaults to human judgement.  

  **Final Tip**  
  Keep it practical: Print this as a poster for your village hall meetings. For tough calls, take a vote after the checklist—it makes decisions feel fair, even when unpopular. Remember, the almanac’s strength is in its local wisdom; this just helps sieve out the shaky bits. Good luck!
