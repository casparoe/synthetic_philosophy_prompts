  Below is a decision tree designed to diagnose coordination failures based on your specifications. It uses plain-language questions, avoids game theory jargon, and focuses on unilateral escape and loss-bearing as the first two splits. The tree has 8 leaves, each with a structural definition, a diagnostic "tell," and the characteristic policy blunder of misapplying another leaf's solution. I've also included empty cells and applied the tree to your four cases.

  ---

  ### **Coordination Failure Decision Tree**
  **Input:** A situation where everyone ends up worse off.  
  **Rules:**  
  - Answer questions based solely on observable behaviors and incentives described.  
  - Ignore moral judgments or emotional language (e.g., "depressing," "unfair").  

  #### **Question 1: Unilateral Escape**  
  > *"Could one participant stop doing the harmful activity **right now** (without others changing), and would they still be roughly as well off?"*  
  - **Yes** → Go to Leaf 1: [Non-Trap: Individual Improvement Possible](#leaf-1-non-trap-individual-improvement-possible)  
  - **No** → Proceed to Question 2.  

  #### **Question 2: Loss-Bearing**  
  > *"When the harm happens, who pays the cost? Is it mainly the **participants themselves**, or **bystanders** (people not involved in the activity)?"*  
  - **Participants** → Proceed to Question 3.  
  - **Bystanders** → Proceed to Question 4.  

  #### **Question 3: Collective Improvement**  
  > *"If **every participant** stopped the harmful activity, would all of them be better off?"*  
  - **No** → Go to Leaf 6: [Not a Coordination Failure](#leaf-6-not-a-coordination-failure)  
  - **Yes** → Proceed to Question 5.  

  #### **Question 4: Relative Advantage**  
  > *"Is the harmful activity driven by trying to **outdo others** (e.g., to avoid falling behind or gain a competitive edge)?"*  
  - **Yes** → Go to Leaf 2: [Positional Arms Race](#leaf-2-positional-arms-race)  
  - **No** → Go to Leaf 3: [Pure Externality](#leaf-3-pure-externality)  

  #### **Question 5: Conditional Cooperation**  
  > *"Would a participant be better off stopping **only if most others stop too**?"*  
  - **Yes** → Go to Leaf 9: [Assurance Game](#leaf-9-assurance-game)  
  - **No** → Proceed to Question 6.  

  #### **Question 6: Dominant Strategy**  
  > *"Does **each participant** have a strong incentive to keep doing the harmful activity, **no matter what others do**?"*  
  - **Yes** → Proceed to Question 7.  
  - **No** → Go to Leaf 5: [Switching-Cost Lock-In](#leaf-5-switching-cost-lock-in)  

  #### **Question 7: Common Resource**  
  > *"Is the harm caused by **overusing a shared resource** (e.g., depleting a fishery, congesting a road)?"*  
  - **Yes** → Proceed to Question 8.  
  - **No** → Go to Leaf 8: [Prisoner’s Dilemma](#leaf-8-prisoners-dilemma)  

  #### **Question 8: Self-Governance**  
  > *"Is there **evidence of rules or agreements** among participants to limit the harmful activity?"*  
  - **Yes** → Go to Leaf 7: [Ostrom-Governable Commons](#leaf-7-ostrom-governable-commons)  
  - **No** → Go to Leaf 4: [Tragedy of the Commons](#leaf-4-tragedy-of-the-commons)  

  ---

  ### **Leaves (Diagnoses)**  
  Each leaf includes:  
  - **Name**  
  - **Structural Definition**  
  - **Tell** (observable confirmation)  
  - **Policy Blunder** (misapplying another leaf’s fix)  

  <a name="leaf-1-non-trap-individual-improvement-possible"></a>
  #### **Leaf 1: Non-Trap: Individual Improvement Possible**  
  - **Definition**: At least one actor could unilaterally stop the harmful activity without significant loss, but doesn’t.  
  - **Tell**: Participants admit they could stop and be fine, but cite inertia or minor barriers (e.g., "I could quit, but it’s easier not to").  
  - **Policy Blunder**: Forcing collective action (e.g., treaties, regulations) when individual incentives already align.  

  <a name="leaf-2-positional-arms-race"></a>
  #### **Leaf 2: Positional Arms Race**  
  - **Definition**: Participants invest in costly actions to avoid being outcompeted, but mutual escalation cancels gains and leaves all worse off.  
  - **Tell**: Participants explicitly fear "falling behind" rivals (e.g., "If we don’t do it, others will").  
  - **Policy Blunder**: Subsidizing participants’ investments (e.g., tax breaks for R&D), which deepens the race.  

  <a name="leaf-3-pure-externality"></a>
  #### **Leaf 3: Pure Externality**  
  - **Definition**: Actors gain from the harmful activity, but bystanders bear the cost; no strategic interdependence exists.  
  - **Tell**: Participants don’t reference others’ actions when explaining their choices (e.g., "This works for me; I don’t care about them").  
  - **Policy Blunder**: Appealing to participants’ conscience instead of imposing taxes/bans.  

  <a name="leaf-4-tragedy-of-the-commons"></a>
  #### **Leaf 4: Tragedy of the Commons**  
  - **Definition**: A shared resource is overused because individual benefits exceed private costs, but collective use destroys the resource.  
  - **Tell**: Resource depletion correlates with usage (e.g., fish stocks decline as fishing increases), and no rules exist.  
  - **Policy Blunder**: Moralizing to participants ("be responsible!") without changing incentives.  

  <a name="leaf-5-switching-cost-lock-in"></a>
  #### **Leaf 5: Switching-Cost Lock-In**  
  - **Definition**: High barriers to changing systems trap participants in an inferior status quo, but coordination could reduce costs.  
  - **Tell**: Participants complain about setup/migration costs (e.g., "We’re stuck because moving is a nightmare").  
  - **Policy Blunder**: Unilateral subsidies (e.g., funding one alternative), which ignores coordination needs.  

  <a name="leaf-6-not-a-coordination-failure"></a>
  #### **Leaf 6: Not a Coordination Failure**  
  - **Definition**: The outcome is bad, but mutual stopping doesn’t improve it; harm stems from unavoidable trade-offs or misdiagnosis.  
  - **Tell**: Participants can’t describe a better collective outcome (e.g., "Stopping would make things worse for everyone").  
  - **Policy Blunder**: Any coordination measure (e.g., pacts, quotas) that wastes effort on non-solutions.  

  <a name="leaf-7-ostrom-governable-commons"></a>
  #### **Leaf 7: Ostrom-Governable Commons**  
  - **Definition**: A shared resource is sustainably managed through participant-enforced rules, avoiding overuse.  
  - **Tell**: Informal/formal agreements exist (e.g., "Our association sets limits everyone follows").  
  - **Policy Blunder**: Top-down regulation (e.g., government quotas), which undermines self-governance.  

  <a name="leaf-8-prisoners-dilemma"></a>
  #### **Leaf 8: Prisoner’s Dilemma**  
  - **Definition**: Each participant gains by defecting (continuing harm) regardless of others’ actions, but mutual defection is worse than mutual cooperation.  
  - **Tell**: Participants admit they’d defect even if others cooperated (e.g., "I’d still do it even if they stopped").  
  - **Policy Blunder**: Trust-based promises (e.g., handshake deals) without enforcement.  

  <a name="leaf-9-assurance-game"></a>
  #### **Leaf 9: Assurance Game**  
  - **Definition**: Participants prefer mutual cooperation but won’t stop unless assured others will too; multiple equilibria exist.  
  - **Tell**: Participants say, "I’d stop if others did, but not alone" and offer conditional commitments.  
  - **Policy Blunder**: Penalizing defectors, which destroys trust for cooperation.  

  ---

  ### **Empty Cells & Ambiguities**  
  - **Incoherent Combinations**:  
    - *Unilateral escape possible + Loss on bystanders*: Rare. If actors can unilaterally stop without loss, why would bystanders suffer? Suggests misdiagnosis (e.g., harm isn’t real or actors aren’t the cause).  
  - **Self-Unstable Combinations**:  
    - *Pure externality + Relative advantage*: If harm is non-strategic (externality), a "race" makes no sense. In practice, this resolves at Question 4 (arms race wins).  
  - **Under-Observed Combinations**:  
    - *Not a coordination failure + Bystander loss*: If mutual stopping doesn’t help participants, why would bystanders care? Likely indicates a non-trap (e.g., unavoidable harm).  
  - **Ambiguous Leaf Pairs**:  
    - **Prisoner’s Dilemma vs. Arms Race**: Arms races involve relative advantage (Question 4), while PDs don’t. If a "race" is absent, PD takes precedence.  
    - **Ostrom Commons vs. Assurance Game**: Ostrom requires a shared resource (Question 7); Assurance doesn’t. If no resource exists, it’s Assurance.  

  ---

  ### **Case Analyses**  
  #### **Case 1: Frontier AI Labs**  
  - **Path**:  
    1. **Q1 (Unilateral escape)**: No. A lab stopping safety cuts would fall behind.  
    2. **Q2 (Loss-bearing)**: Bystanders (global catastrophic risk).  
    3. **Q4 (Relative advantage)**: Yes ("coming second is worse").  
    4. → **Leaf 2: Positional Arms Race**.  
  - **Ambiguity**: Could be Prisoner’s Dilemma (if "defecting" = cutting safety). **Tie-breaker**: Question 4 (labs fear relative loss, not absolute defection). Confirms arms race.  

  #### **Case 2: Coastal Fishery**  
  - **Path**:  
    1. **Q1 (Unilateral escape)**: No. A fisher stopping would lose income.  
    2. **Q2 (Loss-bearing)**: Participants (fishers rely on the stock).  
    3. **Q3 (Collective improvement)**: Yes. If all stop overfishing, stock thrives.  
    4. **Q5 (Conditional cooperation)**: No. Fishers don’t need others to stop to benefit.  
    5. **Q6 (Dominant strategy)**: No. Incentives depend on others (if all overfish, stock collapses).  
    6. → **Leaf 5: Switching-Cost Lock-In?** Incorrect! Proceed:  
    7. **Q7 (Common resource)**: Yes. Fish stock is shared.  
    8. **Q8 (Self-governance)**: Yes (skippers’ association sets limits).  
    9. → **Leaf 7: Ostrom-Governable Commons**.  
  - **Why Not Tragedy?** Rules and stable stock confirm Ostrom.  

  #### **Case 3: Enterprise Software**  
  - **Path**:  
    1. **Q1 (Unilateral escape)**: No. A vendor removing features would lose customers.  
    2. **Q2 (Loss-bearing)**: Participants (vendors and customers are both worse off).  
    3. **Q3 (Collective improvement)**: Yes. If all strip features, costs fall and customers are happier.  
    4. **Q5 (Conditional cooperation)**: Yes. Vendors would only stop if others did ("churn stays low").  
    5. → **Leaf 9: Assurance Game**.  
  - **Why Not Lock-In?** Lock-in requires high switching costs as the barrier (Question 6), but here the issue is feature escalation, not migration.  

  #### **Case 4: Short-Term Lets**  
  - **Path**:  
    1. **Q1 (Unilateral escape)**: No. A landlord stopping would lose rental income.  
    2. **Q2 (Loss-bearing)**: Bystanders (residents pushed out).  
    3. **Q4 (Relative advantage)**: No. Landlords aren’t racing; they’d "happily stop if others did".  
    4. → **Leaf 3: Pure Externality**.  
  - **Why Not Assurance Game?** Harm is on bystanders, not participants (landlords profit).  

  ---

  ### **Tree Summary**  
  - **Strengths**:  
    - Separates unilateral escape (Question 1) and loss-bearing (Question 2) first, preventing "Moloch = depression" fudging.  
    - Avoids conflating bad outcomes with traps (e.g., Case 2 is Ostrom, Case 4 is externality).  
  - **Limitations**:  
    - **Goodhart/Measurement Traps** not included. They require a separate "proxy metric" question, which rarely fits plain-language inputs.  
    - **Subtle Distinctions**: Arms race vs. PD relies on "relative advantage" (Question 4), which participants may not state explicitly.  
    - **Non-Strategic Harms**: Pure externalities (Leaf 3) and non-failures (Leaf 6) are catch-alls; may need subtyping.  

  This tree fits your 40-minute whiteboard session: walk through questions, then use cases to practice. Focus on the *why* behind each answer (e.g., "In Case 4, landlords don’t compete relatively, so it’s not a race").
