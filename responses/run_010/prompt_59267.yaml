  First, I need to dissect the collaborative nature of their process. They shared conceptual development, structural design, and editorial decisions through intensive weekly sessions over a year, maintaining a shared "bible" notebook. This suggests deep interdependence in the book's formative stage - it wasn't just advice but co-creation of the work's architecture.

  The user emphasizes they alone wrote every sentence, which introduces a key philosophical distinction between ideation and execution. In creative fields, we often separate the originating mind from the executing hand, though both are valuable. Priya's departure before completion complicates this further - her involvement was concentrated in the foundational phase.

  When examining agency theory, the shared intentionality during those Tuesdays points toward what we'd call "plural agency" - they functioned as a collective entity making joint decisions. However, after Priya left, the project reverted to individual agency, raising questions about sustained contribution.

  Priya's argument hinges on necessary causation ("the book wouldn't exist without me"), but this conflates influence with authorship. Many essential contributors (the train storyteller, the coroner's detail source) enable works without claiming authorship. The threshold seems to be whether she occupied the authorial role versus being an extraordinary contributor.

  Finally, there's the matter of retrospective claims. Their mutual understanding initially appeared to position Priya as a vital collaborator but not co-author, given the acknowledgments rather than credit. The later demand suggests shifting perceptions of ownership that weren't negotiated during the process.

  The user's guilt indicates they recognize Priya's profound impact, but the philosophical distinction lies in whether that impact crossed from extraordinary contribution into shared authorship. The answer seems to hinge on whether Priya participated in the authorial function beyond providing input.
answer: |-
  Here are five numbered points addressing the philosophical core of authorship and agency in your situation:

  1.  **Co-authorship requires shared *authorial agency*:** This involves joint *decision-making power* over the core creative work (structure, plot, character arcs), not just contribution of ideas or feedback. Your shared bible and Tuesdays demonstrate significant shared agency during that phase.
  2.  **Input vs. Authorship distinction is crucial:** Providing essential ideas, research, or critique (like the man on the train or your ex) constitutes vital input, but authorship requires sustained *shaping authority* over the work's fundamental form and content, which Priya demonstrably held for a year.
  3.  **"Would not exist" is necessary but insufficient:** While Priya's foundational contribution was essential, this argument alone doesn't automatically confer co-authorship; it establishes profound influence and contribution, but not necessarily equal *authorship* with you as the sole executor of the text.
  4.  **Sustained joint creative control defines the period:** For the first year, you operated as a *plural subject* in creative control ("we made every decision"). This shifts the burden to argue why that period of shared agency doesn't constitute co-authorship, despite the later solo execution.
  5.  **The transition point matters critically:** Her departure and the cessation of active collaboration *before completion* introduces ambiguity. The shared agency dissolved; subsequent decisions and execution were solely yours, complicating claims over the *entire* work as co-authored.
