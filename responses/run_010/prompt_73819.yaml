answer: |-
  ## Speech

  Good evening, everyone. It’s truly an honour to stand before you all – colleagues, friends, adversaries turned friends, and especially [His Name]’s wonderful family – to mark this moment. Thirty-four years in the service is a monumental thing. But trying to capture what [His Name] has actually *done* in that time? That’s the challenge. Because if you look for the headlines, the dramatic signings we all imagine define diplomacy, you might miss the real architecture of his work. You might miss the quiet, relentless building.

  We all know [His Name] has passions. The incredibly detailed container ships that fill his office shelves – never a warship in sight. Why? Because, as he’d tell anyone who asked (and probably a few who didn’t), trade doesn’t magically stop wars. But it makes starting one incredibly, painfully expensive. And sometimes, that hard, pragmatic cost is the only force that actually changes behaviour. It’s a mechanism that works. Or the famous butterscotch tin in his bottom drawer – a small, reliable point of sweetness, a reminder that patience and a shared moment often pave the way better than force.

  This perspective – this belief in building structures that *work*, that persist – isn’t accidental. It stems from a deep conviction about how peace actually functions. Peace isn’t something that just *happens* when good people are around. It’s not the natural state. Left alone, things tend towards friction, towards conflict. Real peace has to be *built*. Instituted. Actively constructed, piece by piece, rule by rule, over and over again. It’s the daily work in the unglamorous middle, long after the cameras leave the summit, that truly bears the load.

  And that’s where [His Name]’s genius truly lay. He understood, fundamentally, that the best peace isn’t built solely on everyone being angels. It’s built on designing things so well, so cleverly, that they keep working *even if* the people involved aren’t perfect. Imagine creating rules so clear, processes so robust, that they function effectively almost mechanically, regardless of who sits in the chair next. That’s the kind of institutional strength he pursued. The four years poured into a painstaking river-crossing protocol? That wasn’t just about water rights. That was about building a system so unambiguous, so fair in its application, that it would endure arguments and changing governments. The two years on a fertilizer tariff schedule? Not just about agriculture, but about weaving economic interests together so tightly that disrupting the fabric became unthinkably costly. These weren't sidelines; these were the load-bearing walls he was constructing. He built things meant to last, meant to function on their own merits, long after he walked out of the room.

  This leads to another principle he lived by, especially in negotiations: the power of absolute clarity. No hidden meanings. No unspoken caveats. Nothing agreed in a whisper that contradicts the words spoken aloud. A peace, or any agreement worth having, collapses if it secretly reserves the right for future conflict. True durability comes from saying exactly what you mean, and meaning exactly what you say – ensuring the foundation is solid and visible to all. It’s why he’d stop a meeting mid-flow to correct someone using “leverage” vaguely. Words matter. Precision matters. Because ambiguity is the crack where distrust grows.

  And that brings me to tonight. A farewell speech is a rare moment for a diplomat. Most of the work happens away from the spotlight, in those rooms where the river protocols and tariff schedules get hammered out. Tonight, we’re genuinely public. So, in the spirit of [His Name]’s own commitment to clarity, this speech carries no secret reservations. No winks only a few would catch, no jokes designed to retract their own meaning under the breath. What you hear is what is meant. The respect is genuine. The admiration for the *craft* of his work – the design, the structure, the precision – is profound. And the affection? Well, just ask anyone who ever reached, slightly sheepishly, for the butterscotch tin in his bottom drawer.

  [His Name], your legacy isn’t just the summits attended, though there were many. It’s in the invisible architecture of understanding you helped build – the rules, the costs, the systems designed to function, relentlessly, towards peace, regardless of who’s steering the ship. You understood that peace isn’t found; it’s made, meticulously, day after day, year after year. You built things that last. For that, your colleagues, your friends, and especially your family, honour you tonight. Thank you.

  ---

  ## Structural Breakdown & Notes

  1.  **Structural Points Used:**
      *   **Peace is not natural; it must be instituted:** Explicitly stated ("Peace isn’t something that just *happens*... It’s not the natural state... Real peace has to be *built*. Instituted.") and woven throughout, particularly in describing his focus on the "unglamorous middle" and "daily work" like the river protocol and tariffs.
      *   **The "Devil's Constitution" (Institutions over Individuals):** Directly addressed ("the best peace isn’t built solely on everyone being angels... building things so well... that they keep working *even if* the people involved aren’t perfect... designed to function on their own merits..."). Linked explicitly to the river protocol and tariff schedule as examples of systems designed for robustness, not relying on goodwill.
      *   **No Secret Reservations:** Explicitly stated as a principle he lived by ("No hidden meanings. No unspoken caveats... A peace... collapses if it secretly reserves the right for future conflict"). Also applied reflexively to the speech itself ("this speech carries no secret reservations... What you hear is what is meant").
      *   *(Note: The Publicity Test is *implicit* in the "No Secret Reservations" section and the reflexive application to the speech. The core idea (openness/justice) underpins the argument against hidden clauses, but it wasn't explicitly named as a separate point beyond that context).*

  2.  **Audience Targeting:**
      *   **For Family & Junior Officers:** The opening welcome, the focus on tangible things (ships, butterscotch tin, family presence), the emphasis on his character traits (patience, reliability via butterscotch, precision via "leverage"), the clear language explaining concepts like peace needing building ("piece by piece") and systems working mechanically. The closing warmth and direct address to him. The ships and butterscotch are central anchors they recognize.
      *   **For Colleagues & Former Adversaries:** The deeper Kantian structure (without naming Kant), the specific examples of his work (river protocol, tariffs), the explanation of *why* ships and precision matter (linking trade cost to peace mechanism, ambiguity to distrust), the concept of institutional design over individual virtue ("devils" principle), the principle against secret reservations, and the meta-commentary on the speech itself fulfilling the publicity ideal. They will recognize the specific projects and the underlying philosophical framework behind his stock lines and methods.
      *   **For the Nine-Year-Old/Grandma:** Simple sentence structures, concrete images (ships, candy tin, building walls, rivers, farming), avoiding jargon (beyond necessary terms like "protocol" or "tariff" which are briefly contextualized), a clear emotional throughline (building good things, being reliable, being respected/loved).

  3.  **Potential Risks/Landing Wrong:**
      *   **The "Devil's Constitution" Angle:** This is the highest risk for landing coldly, especially with family. Talking about systems working "even if people aren't perfect" or "aren't angels" could feel impersonal or even slightly dismissive of his *actual* character. **Mitigation:** The speech strongly counterbalances this by immediately linking it to his *craft* and *genius*, and by preceding/following it with very personal touches (butterscotch, family address, direct thanks). The emphasis is on the *intellect* and *skill* required to design such systems, which *is* a profound compliment.
      *   **Abstraction Level:** While simplified, concepts like "instituted peace," "institutional strength," and "mechanisms" are still abstract. Some listeners (family, junior staff) might glaze over slightly here. **Mitigation:** Anchoring these concepts firmly to his *specific* projects (river, tariffs) and tangible metaphors (load-bearing walls, building architecture, steering the ship) helps ground them.
      *   **The Reflexive Publicity Test:** Mentioning the speech's own honesty could come across as slightly performative or self-conscious to some. **Mitigation:** Keeping it brief and directly linking it to his principle ("in the spirit of [His Name]’s own commitment") frames it as homage rather than navel-gazing. Stating it plainly avoids the very wink it forbids.
      *   **Lack of Named "Goodness":** The speech deliberately praises his *mind*, *craft*, and *work* over his *goodness* (as per the Kantian constraint). While warmth is present (butterscotch, family, affection), someone expecting a tribute solely focused on his moral character might find this angle surprising or incomplete. **Mitigation:** The final paragraphs explicitly combine respect for craft with genuine affection, and the overall tone is deeply respectful and admiring. The "craft" *is* presented as a form of profound dedication.

  The core risk is navigating that balance between intellectual tribute (for him and his peers) and emotional resonance (for family and friends), particularly around the institutional vs. personal virtue point. The use of the ships and butterscotch as dual-purpose symbols (personal quirk + philosophical illustration) is crucial for bridging that gap. The hope is that the family feels the warmth and sees the tribute to his life's work, while his peers recognize the profound Kantian architecture underpinning it.
