answer: |-
  ### Brainstorming: Candidate Diagnoses  

  1. **Calibration Dispute (Your Hypothesis 1)**  
     Realists treat introspection as a calibrated instrument (data source); illusionists treat it as biased apparatus (artefact generator). Stalemate persists because each side interprets third-person evidence (e.g., blindsight) through their own calibration lens—realists as confirmation of introspection’s reliability, illusionists as proof of its systematic distortion.  

  2. **Grain Conflict (Your Hypothesis 2)**  
     Realists describe consciousness at a fine-grained, subjective level (e.g., raw feels); illusionists at a coarse-grained, functional level (e.g., computational access). The dispute is about descriptive priority: which grain is ontologically fundamental. Neither side denies the other’s observations but rejects their explanatory relevance.  

  3. **Stipulated Reference (Your Hypothesis 3)**  
     Both accept the *concept* of phenomenal properties (private, intrinsic qualia) but disagree on its referent. Realists: the concept fails to match physical reality, proving non-physicalism. Illusionists: the concept has no referent, proving its emptiness. The “metaphysical” debate is covertly pragmatic—should we discard the concept?  

  4. **Semantic Entanglement (Your Fourth Observation)**  
     The realist’s “illusion of experience is an experience” objection assumes a phenomenal reading of “seems.” Illusionists reject this, treating “seems” as a functional disposition (e.g., reportability). The impasse is semantic: each side’s argument is valid only within its own interpretive framework, making mutual engagement impossible.  

  5. **Explanatory Priority Conflict (New Candidate)**  
     The stalemate arises from clashing explanatory norms. Realists demand *subjective experience* as a primitive in any explanation; illusionists demand *publicly verifiable mechanisms*. Evidence (e.g., neural correlates) is secondary to these norms. Progress requires agreeing on what counts as explanation, not just data.  

  ---  

  ### Diagnosis: Semantic Entanglement as Core Impasse  

  I argue your fourth observation—**semantic entanglement**—best diagnoses the dispute. The realist’s “illusion is an experience” objection and the illusionist’s rebuttal rely on incompatible semantic frameworks. This renders the debate intractable without prior agreement on terms, and it explains why both sides accept the same data yet never converge. I’ll defend this against your calibration hypothesis and show why semantic disentanglement is the only path to progress.  

  #### Why Semantic Entanglement?  
  The realist objection (“an illusion of experience *is* an experience”) hinges on the premise that “seeming” entails phenomenal character. For example, Levine (2001) insists that any introspective report presupposes a subjective “feel.” Illusionists like Dennett explicitly deny this: when we report “seeing red,” we’re describing a *disposition to judge*, not a private qualia (Dennett, 1991). Frankish frames introspection as a “user illusion”—a functional misdescription akin to perceiving a desktop icon as a “file” rather than code (Frankish, 2016).  

  This creates a closed loop:  
  - Realists *define* “experience” phenomenally, so any introspective report (even of illusion) becomes evidence for phenomenality.  
  - Illusionists *define* “experience” functionally, so reports are data about cognitive processes, not qualia.  

  The same evidence (e.g., change blindness) is thus interpreted oppositely:  
  - Realists: Change blindness reveals *limits* of access to real phenomenality (e.g., Block’s “overflow” thesis).  
  - Illusionists: It reveals introspection’s inherent bias—we *infer* continuity where none exists (Dennett’s “Orwellian/Stalinesque” models).  

  Crucially, neither misreads data; they disagree on what the *terms* (“experience,” “seems”) refer to. This semantic divide makes the debate unresolvable through empirical calibration or grain shifts.  

  #### Against Calibration  
  Your calibration hypothesis is perceptive but insufficient. Calibration disputes *can* be resolved by third-person tests (e.g., confidence ratings vs. neural activity). Yet here, both sides cite such tests without progress:  
  - Illusionists point to blindsight (reports dissociated from function) as proof introspection generates artefacts.  
  - Realists cite no-report paradigms (e.g., Pitts et al., 2014) as proof phenomenality exists without access.  

  But these results don’t break the deadlock because each interprets “report” or “access” through their semantics. For illusionists, blindsight shows reports *misdescribe* processing; for realists, it shows unreported phenomenality. The calibration metaphor fails because the dispute isn’t about *whether* introspection is biased (both agree it is), but whether its outputs *refer* to anything non-functional. That’s semantic, not methodological.  

  #### Against Stipulated Reference  
  Your third hypothesis is closer but misses the semantic trap. Stipulated reference focuses on whether the concept of phenomenality has a referent. However, the realist doesn’t just say the concept “mismatches” physics; they argue illusions *presuppose* phenomenality (e.g., Chalmers’ “zombie” argument). This presupposition relies on the contested semantics of “illusion.” Similarly, illusionists don’t merely discard the concept; they redefine “experience” to exclude intrinsicality. The conflict is thus deeper than conceptual engineering—it’s about whether redefinition is even coherent.  

  #### Why Not Explanatory Priority?  
  Explanatory priority *contributes* but doesn’t explain the semantic trap. Realists demand explanations that “preserve the datum” of subjectivity (e.g., Nagel’s “what it’s like”); illusionists demand explanations that avoid “magical” properties (e.g., Rey’s eliminativism). Yet these priorities are *enforced* by semantic commitments: realists equate “datum” with phenomenality; illusionists equate “explanation” with functional mechanism. The semantics drive the priorities, not vice versa.  

  #### What Progress Looks Like  
  Given semantic entanglement, progress requires:  
  1. **Explicit Disambiguation**: Both sides must agree on neutral terms for introspective reports (e.g., “judgments” vs. “qualia-laden appearances”).  
  2. **Formal Modeling**: Use frameworks like Bayesian perception (e.g., Clark’s “predictive processing”) to simulate how functional misdescriptions could generate “illusory” reports *without* presupposing phenomenality. If successful, this forces realists to either accept the model or show why it smuggles in qualia.  
  3. **Phenomenal Concept Master Argument**: Illusionists must formally demonstrate that all introspective concepts *can* be reduced to functional/dispositional roles without residue. Realists must show this reduction fails *even in principle* (e.g., Goff’s “revelatory” concepts).  

  Progress is possible but requires abandoning the current dialectic. Empirical work (e.g., NCC research) won’t help until semantics are untangled. The impasse isn’t a defeat—it’s a symptom of philosophy’s role in clarifying concepts before science adjudicates.  

  #### Final Note: Your Framing Stands  
  Your framing isn’t confused; semantic entanglement is the sharp point you suspected. The illusionist’s refusal to read “seems” phenomenally isn’t evasion—it’s the crux. Realists beg the question by embedding phenomenality in “seeming”; illusionists beg the question by excluding it. Only by exposing this can we move forward.  

