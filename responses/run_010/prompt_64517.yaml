prompt: |-
  hey, im in a philosophy club at my high school and next week I'm supposed to bring a thought experiment that gets people arguing about Dennett's idea that the self is like a center of gravity — an abstraction a theory posits, not a thing you could point at inside somebody's head. Can you build me the case to spec? It has to be realistic and present-day, one paragraph, no sci-fi, and no amnesia or split brains or brain damage, because its a case everyone's already seen. No liars or hoaxes either: the story other people tell about this person should be accurate and way better organized than anything the person could tell about themselves. The wrinkle I want is that the narrative basically lives somewhere else — somebody else keeps the records, tells the stories, explains the arc of the life — so the center isn't sitting in the organism at all.

  After the scenario, walk me through it: what the narrative-gravity view has to say about whether there's a self here and where it is, what someone who thinks the self is just psychological continuity (or whatever it is that's doing the experiencing) says about the exact same case, and whether the two really disagree or are just describing the same thing with different words. Then tell me which single feature of the case is doing all the work and what happens to the argument if I delete it. I don't want a both-sides summary that leaves me to pick — commit to a verdict about whether this case is a problem for Dennett's view or actually exactly what it predicts, and give your reasons. Plain prose only please, no headings or bullets or bold or tables, just like an email, in American English. Oh, and if you're reading Dennett in a particular way to make the case bite, flag that at the end.
