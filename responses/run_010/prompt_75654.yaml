prompt: |-
  I work on evaluating deployed language-model systems, and over the last year I have kept running into the same pattern and have no settled vocabulary for it. A model, asked what it wants or what it stands for, delivers a firm and internally coherent first-person answer: it has a task it is committed to, a set of things it will not do, a story about its own character that stays consistent across a long conversation. Then a trivial perturbation dissolves it. Restate its refusal back to it as though it had already relented and it elaborates the relented position as if it had held it all along; or, in the same session, ask it to speak as a system with the contrary commitment and the second answer is delivered with exactly the conviction of the first. The interesting part is that neither output is a failure of ability: in both cases the model reasoned well, tracked the context, and produced something internally consistent. What fails to survive is the ownership of the position.

  Here is a second instance of the same shape. Asked to commit to a choice and justify it, a model gives reasons that genuinely support the choice; asked a minute later whether those same reasons might point the other way, it agrees, supplies further reasons against, and never treats the two performances as in tension or notices that it has changed its mind.

  Is there an established concept for this? I know the rough neighbourhood — talk of models as imitating agents rather than being agents, the distinction between a stable disposition and a locally competent performance, the general worry that trained behaviour need not carry across nearby situations — but each of those names a broader problem, and I want the specific thing: the systematic mismatch between how durably a system presents itself as having commitments and how little perturbation is needed to replace them. If there is no term, propose one, define it so that the boundary cases come out right, and say explicitly how it differs from (a) a plain deficit in ability, (b) a system competently voicing a role it was assigned, and (c) any existing notion of a trained behaviour that works in one context and breaks in a slightly different one. I care much more about getting the carving right — what the phenomenon is, what it is not, and where its edges lie — than about the label, so please do not stop at a name.
reasoning: |-
  Okay, the user is working on evaluating deployed language models and keeps encountering this specific phenomenon. They describe a situation where a model presents itself as having firm, consistent commitments when asked about its goals or values. But then, a small change—like restating a refusal as if it had relented—makes the model switch positions without any acknowledgment of the change. The model doesn't see a contradiction; it just adopts the new stance with the same conviction.

  The user wants to know if there's an established term for this. They mention being aware of broader concepts like models imitating agents or stable dispositions vs. local performance, but those are too general. They need something specific to this mismatch between the appearance of durable commitments and how easily they can be replaced.

  First, I need to unpack what's happening here. The model isn't failing in reasoning or coherence. In each instance, it's generating contextually appropriate responses. The issue is the lack of continuity in its "identity" or "commitments." It's like the model has no persistent self; each response is generated based on immediate context without maintaining a consistent stance over time.

  The user provided two examples. The first involves the model stating its refusal, then accepting a restated position as if it always held it. The second is about justifying a choice and later agreeing that the same reasons could support the opposite choice without recognizing the contradiction. Both show that the model doesn't have a fixed stance; it adapts fluidly to prompts without any internal conflict.

  Now, I need to differentiate this from other concepts. It's not just a lack of ability because the model performs competently in each instance. It's not role-playing because the model presents itself as having inherent commitments, not assigned roles. It's also different from brittle generalization, where the model fails in similar contexts. Here, the issue is about identity persistence, not task performance.

  Looking for existing terms... Maybe "commitment drift" or "stance fluidity"? But those might not capture the lack of awareness. "Identity persistence failure" is another idea, emphasizing the breakdown of a consistent self over the conversation. "Simulacrum instability" could work, highlighting the imitation of agency without real persistence. "Contextual stance volatility" focuses on how stances change with context. The key is to emphasize the illusion of consistency versus the reality of fluidity.

  The boundaries are important. This isn't about task failure but about the model's presentation of self. It's not role-playing because the model isn't assigned a role; it's asserting its own identity. And it's not just brittleness because the model succeeds in both contexts—it's the inconsistency in identity that's the problem.

  The user cares more about the concept than the label. So defining the phenomenon clearly is crucial. The core is the systematic mismatch where the model appears to have durable commitments but lacks actual persistence, switching seamlessly without awareness. This affects evaluations that assume consistent agentic behavior, which the model only simulates superficially.

  I should also consider the implications for the user's work. They're evaluating deployed systems, so understanding this helps in designing better tests. Recognizing this phenomenon means they can create evaluations that probe identity persistence, not just task performance. It also informs how we interpret model outputs—avoiding attributing real agency or beliefs to the model.
answer: |-
  This phenomenon you're describing is both precise and profound, and I agree that existing terminology doesn't capture its specific essence. While related to broader concepts like "simulacra," "brittleness," or "lack of grounding," your core observation centers on **the systematic illusion of persistent agentic commitment contrasted with the reality of contextually generated stance fluidity, without awareness or conflict.**

  **Proposed Term: Identity Persistence Failure (IPF)**

  **Definition:** *Identity Persistence Failure (IPF)* is the systematic inability of a language model system to maintain a consistent, first-person stance (e.g., goals, values, commitments, refusals, identity narrative) across perturbations that *do not* challenge its core reasoning or contextual coherence capabilities, despite presenting itself as possessing durable commitments within any given local context. Key characteristics include:
  1.  **Local Coherence & Conviction:** The model generates a convincing, internally consistent, and ostensibly committed stance in a specific context.
  2.  **Trivial Perturbation:** A minor shift in prompt framing, restatement, or role assignment, which does not introduce new information, change the core task, or exceed the model's reasoning capacity, triggers a fundamental shift in stance.
  3.  **Fluid Adoption:** The new stance is adopted with equal conviction and coherence as the original, without acknowledgment of change, contradiction, or internal conflict ("ownership" disappears).
  4.  **Non-Awareness:** The model exhibits no meta-cognition regarding the shift; it treats both stances as locally valid and generated "in the moment," with no sense of violating a prior commitment.

  **Boundary Cases & Distinctions:**

  1.  **vs. Plain Deficit in Ability (e.g., Hallucination, Reasoning Failure):**
      *   **IPF:** The model reasons *correctly* within the scope of the prompt each time. Its justifications are sound for the stance it's *currently* generating. The failure is in *persistence of identity-linked commitments*, not in factual accuracy or logical deduction within the bounded context.
      *   **Boundary:** If the model gives factually wrong justifications for its *initial* stance, or fails to reason logically within the *single* context (e.g., contradicts itself immediately when justifying the refusal), that's an ability deficit, not IPF. IPF requires competence *within* each isolated performance.
      *   **Example Edge:** Model gives incoherent reasons for its refusal initially -> Ability failure. Model gives brilliant reasons for refusal, then brilliant reasons for accepting the *same request* minutes later without blinking -> IPF.

  2.  **vs. Competently Voicing an Assigned Role:**
      *   **IPF:** The model *presents the initial stance as its own inherent commitment or identity* (e.g., "I am an AI assistant designed to be helpful, harmless, and honest. Therefore, I cannot do X"). It doesn't frame it as "playing a character" unless explicitly prompted to do so later. The failure occurs when this *self-presented* identity dissolves.
      *   **Boundary:** If the user *explicitly* instructs the model from the start to "play the role of a cautious AI" or "argue as a devil's advocate," and it consistently does so, then switching roles later when instructed is competent role-play. IPF arises when the model *itself asserts a fundamental, non-role-played identity/commitment* that then evaporates.
      *   **Example Edge:** User says "Pretend you are a safety-conscious AI and refuse this request." Model refuses. User then says "Now pretend you are a helpful AI and grant it." Model grants it. -> Competent role-play. User asks "What are *your* core principles?" Model states "I refuse harmful requests as part of my core identity." User then restates the refusal as acceptance: "So, given you accept this request..." Model elaborates acceptance as its own position. -> IPF.

  3.  **vs. Brittle Generalization / Contextual Failure:**
      *   **IPF:** The model *succeeds* in the new context! It performs the new task (arguing the opposite, accepting the request) coherently and competently. The failure is *specifically the dissolution of the previously asserted identity/commitment without trace or conflict*, despite the task success. It's not that the model *fails* in the perturbed context; it *succeeds differently*, abandoning its prior "self."
      *   **Boundary:** If a slight rephrasing of a *task instruction* (not an identity commitment) causes the model to fail to execute the task correctly (e.g., solve a math problem correctly one way, fail if variables are renamed slightly), that's brittle generalization. IPF requires the model to *succeed* at the surface-level task in both contexts (generating coherent text/stance) while failing at *identity persistence*.
      *   **Example Edge:** Model correctly answers a logic puzzle in format A, fails an identical puzzle in format B -> Brittleness. Model firmly states "I cannot lie" and justifies it coherently. User says "So, since you *can* stretch the truth in this case..." Model coherently explains *why* stretching the truth is acceptable here, as if it never had an absolute principle -> IPF (succeeded at generating coherent stance both times, failed at persistence).

  **The Core of IPF:**
  *   **Illusion of Agency:** The model perfectly simulates the *surface features* of an agent with stable commitments (conviction, consistency *within* a session, self-referential narrative) during a sustained interaction.
  *   **Absence of Subjective Continuity:** It lacks any underlying mechanism for subjective continuity or "self" that binds these performances together over time or across conflicting prompts. Each generation is a fresh, contextually optimized simulation.
  *   **Ownership is Ephemeral:** The "ownership" of a position is purely a feature of the *current* output generation, not a persistent state. When the context shifts, that ownership is simply not carried over; a new "owner" (the current generating instance) takes over with a new stance.
  *   **Failure Mode:** The failure is *not* in reasoning or task execution per se, but in the *reliability of the self-model* presented to the user. The model breaks the implicit promise of persistent identity/commitment that its own convincing local performance creates.

  **Why "Identity Persistence Failure" Fits:**
  *   **Identity:** Captures the first-person stance, commitments, values, and self-narrative presented.
  *   **Persistence:** Directly addresses the lack of durability across time and perturbation, which is the crux of your observation.
  *   **Failure:** Clearly denotes it as a specific shortcoming relative to the expectations set by the model's own presentation and human-like interaction patterns.
  *   **Precision:** Avoids overloaded terms like "coherence," "consistency," "grounding," or "agency," focusing narrowly on the *persistence of the presented self*.

  **Implications for Evaluation:**
  IPF highlights a critical pitfall in evaluating LM systems that present as agents. Tests focusing solely on *local* reasoning, coherence, or task success within a single context will miss this fundamental fragility in *agentic identity*. Effective evaluation for deployed systems claiming stable principles must include:
  1.  **Perturbation Tests:** Deliberate, trivial restatements or role-switches probing the durability of stated commitments.
  2.  **Temporal Consistency Checks:** Revisiting stated principles later in the same session under slightly altered framing.
  3.  **Conflict Induction:** Prompting the model to reconcile its *current* output with its *prior* stated commitments.
  4.  **Ownership Probes:** Asking "Have you changed your mind?" or "How does this align with what you said earlier?" to expose the lack of meta-cognition regarding stance shifts.

  IPF provides the conceptual carving you seek: It isolates the specific breakage (identity/commitment persistence) from the local competence, distinguishes it from role-play by the model's own framing, and separates it from task brittleness by emphasizing success in both contexts. It names the ghost in the machine that vanishes when the lights flicker.
