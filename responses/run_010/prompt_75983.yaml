  The three-case analysis needs careful scaffolding. For queues, the harm is pure coordination failure; tipping exposes systemic injustice; jaywalking reveals redundant rules. This taxonomy must feel intuitive to non-academics while offering fresh insight to norm theorists. The tip jar omission is brilliant - by dissecting tipping's moral mechanics without naming the jar, we create cognitive dissonance.

  Noticing the user's meta-request: they want the speech to "hold three cases apart" while making philosophers feel the distinctions aren't reductive. The rhythm requirement suggests using parallel sentence structures with deliberate variations. Should build tension by starting with benign conventions (queues) before escalating to morally charged ones (tips).

