prompt: |-
  I clerk on the constitutional court of a mid-sized democracy whose charter contains an enumerated bill of rights, a general limitation clause permitting such restrictions on rights as are reasonable and demonstrably justified in a free society, and strong-form judicial review: when we invalidate a statute it is invalid, and the legislature's only routes back are a constitutional amendment or a supermajority override that no government has yet attempted. I have been asked to prepare a bench memo for a case to be argued next term, and my judge wants the memo to begin from our own track record rather than from first principles. I am deliberately not naming the jurisdiction. I want the analysis to run on the holdings set out below, not on real case law you may have memorized, and I want no citations, no case names from other systems, and no reading list. If any principle you identify corresponds to a position you know from the literature, you may say so in a clause; the substance must be your own articulation.

  Our decisions in the eleven years since the charter took effect, in the order decided:

  1. A statute removing the franchise from members of a small, geographically dispersed linguistic minority on the ground that they held secondary residence permits, with no provision for restoration: invalidated.
  2. A national consumption tax whose incidence fell heavily on the poorest decile: upheld, with the observation that the distribution of the tax burden is a question the assembly is competent to settle and that the equality guarantee does not reach it.
  3. A prohibition on a widely used analgesic, enacted in nine days under emergency procedure with no committee stage, on the strength of a single study later retracted; the patient population was large, enfranchised, and organized in an association that campaigned for repeal: upheld. We said that the cure for a hasty statute is a later statute. The assembly repealed it twenty-two months on.
  4. A criminal prohibition on a ritual practice central to a large, well-organized faith that had twice lobbied the assembly successfully on other matters, where the same statute granted exemptions to three other faiths for comparable practices and the record disclosed no reason for the distinction: invalidated.
  5. A general licensing and bond requirement for periodicals, facially neutral, enacted on a party-line vote six days after a newspaper printed corruption allegations against the governing party; the committee minutes recorded the sponsor describing the measure as the answer to that newspaper: invalidated.
  6. A floor amendment, with no committee report and no articulated rationale, raising the minimum age for standing for municipal office from 21 to 30, in a charter that guarantees the right to stand for election subject to reasonable qualifications: upheld, on the ground that a line must be drawn somewhere and that those below it retain the vote and may campaign. My judge dissented, on the ground that a bright line drawn without any reason given is precisely what the limitation clause requires the assembly to justify.
  7. A statute postponing one regional election for a single term after severe civil disorder, passed by a cross-party supermajority with a self-executing sunset guaranteeing that the election would occur within eighteen months: upheld.

  The new case is this. The assembly has criminalized knowingly false statements of fact about the conduct of a federal election — the counting, the certification, the eligibility of officials to serve — after two years of hearings, expert testimony, and a public consultation; it passed on a cross-party supermajority. Lobbying by the press secured carve-outs for opinion, parody, and honest error. The act carries a five-year sunset and a mandatory review by the responsible committee, and it binds no future assembly. It also carries a clause reciting that the assembly has itself determined the restriction to be a justified limit under the limitation clause, and directing that judicial review is confined to asking whether the assembly manifestly exceeded the bounds of a determination open to it. Those most exposed are fringe candidates, small publishers, and partisans without institutional backing: all enfranchised, numerous, badly organized, and largely unrepresented in the proceedings that produced the act.

  What I need from the memo:

  - Set out the candidate principles that jointly account for all seven earlier decisions. There is more than one. State each as a rule a judge could apply — which feature of a statute it treats as decisive — and show how each survives holdings 3 and 4 in particular, since those two appear to pull in opposite directions.
  - Take each candidate to the new case, say what it yields, and say whether it yields it easily or by a stretch.
  - Give your best guess at our actual ruling, including the possibility of severance: invalidating the deference directive while leaving the criminal prohibition standing, or leaving the directive and declining to review the prohibition at all. Identify the closest analog among the seven, and say what makes it closest rather than merely similar.
  - For each branch of the decision, state what principle we would thereby be adopting, and which of our own holdings would become hardest to defend afterward.
  - Construct the further hypothetical case that would best discriminate between the two leading candidates, and say which way we should expect to decide it.
  - Finally: where our track record genuinely underdetermines the new case, should the fact that we are unelected break the tie toward deference, or is that tie-break itself a substantive principle whose consequences we would then own? I want an answer here, not a summary of both positions.
reasoning: |-
  Okay, the user is a law clerk on a constitutional court in a mid-sized democracy. They need to prepare a bench memo for an upcoming case about a law criminalizing false statements about federal elections. The memo must be based solely on the court's previous seven decisions, not on external case law or principles. The user has provided summaries of these seven cases and the new case details. 

  First, I need to identify the principles from the seven cases. Let me list them out again quickly:

  1. Removing franchise from a minority group: invalidated.
  2. Consumption tax affecting the poor: upheld, as tax distribution is for the assembly.
  3. Ban on analgesic with rushed process: upheld, suggesting legislative remedy.
  4. Criminal prohibition on a religious ritual with unequal exemptions: invalidated.
  5. Licensing requirement targeting a critical newspaper: invalidated.
  6. Minimum age increase for office without rationale: upheld; dissent argued justification needed.
  7. Postponing regional election with sunset clause: upheld.

  Looking at these, several patterns emerge. The court seems to care about procedural fairness, like in case 5 where the law targeted a specific newspaper. Also, equality issues matter, as in cases 1 and 4 where specific groups were disadvantaged. But sometimes, like in cases 2 and 3, the court defers to the legislature, especially on economic or emergency matters. Case 6 is tricky—the majority upheld the age limit, but the dissent wanted justification. Case 7's sunset clause and supermajority support seemed important.

  For the new case, the law criminalizes false election statements, has carve-outs, a sunset clause, and a deference directive telling courts to only review if the assembly "manifestly exceeded" bounds. The affected groups are fringe players without strong representation.

  The user wants candidate principles that explain all seven cases, especially reconciling cases 3 (upheld rushed law) and 4 (struck down religious prohibition). Case 3 was upheld despite poor process because the issue could be fixed later, while case 4 was invalidated due to unequal treatment without reason.

  Possible principles:
  1. **Anti-Targeting Principle**: Laws that single out disfavored groups or viewpoints for burden without justification fail. Explains cases 1 (minority disenfranchised), 4 (religious group targeted), and 5 (newspaper targeted).
  2. **Process-Outcome Severability Principle**: Deference to legislature depends on whether the flawed process could have produced the same outcome. Case 3's rushed ban was upheld because repeal was possible; case 4's unequal exemptions suggested the outcome couldn't be justified.
  3. **Core Political Safeguard Principle**: Rights central to democracy (voting, candidacy) get strict scrutiny unless the legislature provides safeguards. Cases 1 and 7 show this—case 1 had no safeguards, case 7 had a sunset clause and supermajority.

  Now, applying these to the new case:
  - **Anti-Targeting**: The law has carve-outs but might indirectly burden fringe groups. However, it's facially neutral. This principle might uphold it, but uneasily because the burden falls on the unrepresented.
  - **Process-Outcome**: The legislature had extensive hearings, so the process was robust. Likely upholds the law easily.
  - **Core Safeguard**: The sunset clause and review mechanism are safeguards. But the deference directive is problematic—it undermines judicial review. Might lead to severing the directive.

  The closest analog is case 7 (election postponement with sunset clause), but the deference directive is new. The court might sever that part, as it attempts to limit judicial power.

  If they sever the directive and uphold the prohibition, the principle becomes that courts allow legislative judgments with safeguards but reject attempts to bind judicial review. This might make case 6 (age limit without rationale) harder to defend, as it lacked safeguards but was upheld.

  A hypothetical to test the principles: A law requiring voter ID, passed quickly after allegations of fraud, with no exceptions for poor voters. Under Anti-Targeting, if it disproportionately affects a group, it fails. Under Core Safeguard, without sunset clauses, it might fail. This discriminates between the principles.

  On the tie-breaker question: Since the court is unelected, deference might be appropriate when the law has broad support and safeguards. But the deference directive here goes too far. The tie-breaker should lean toward protecting judicial review's role, not deference, as the court must ensure rights aren't undermined by legislative overreach.

  Overall, the memo should recommend severing the deference directive and upholding the prohibition, based on Core Safeguard principle, with case 7 as the closest analog.
answer: |-
  Here is the bench memo structured to your specifications, analyzing solely within the provided track record:

  ### I. Candidate Principles from Precedents
  Three principles jointly explain all seven holdings:

  1. **Anti-Targeting Principle**: A statute that imposes burdens *disproportionately on a specific group* without neutral justification fails, especially where the group is politically vulnerable or the burden implicates core democratic rights.  
     - *Survival of Holdings 3 & 4*: Case 3 (analgesic ban) survived because the burden was general (all users), not group-specific. Case 4 (religious exemption disparity) failed because it targeted one faith without justification.  

  2. **Process-Outcome Severability Principle**: Deference applies unless flawed process *irreparably corrupted the outcome*, measured by whether a proper process could plausibly yield the same result.  
     - *Survival of Holdings 3 & 4*: Case 3 (rushed ban) upheld because repeal remained possible ("cure is a later statute"), implying no permanent corruption. Case 4 failed because the unequal exemptions suggested the outcome was indefensible regardless of process.  

  3. **Core Political Safeguard Principle**: Restrictions on *core democratic rights* (voting, candidacy, electoral integrity) require legislative safeguards (e.g., sunsets, supermajorities) to be valid, as they prevent permanent entrenchment.  
     - *Survival of Holdings 3 & 4*: Case 3 involved health regulation, not core political rights, so safeguards weren’t required. Case 4 implicated religious equality but not core democracy, so safeguards weren’t decisive.  

  ---

  ### II. Application to New Case  
  **Statute**: Criminalizes knowingly false election statements; cross-party supermajority; 5-year sunset + mandatory review; carve-outs for opinion/error; deference directive.  
  - **Anti-Targeting**: *Uphold, but uneasily*. Burden falls on "fringe" actors, but facially neutral carve-outs (opinion/error) and broad scope dilute targeting argument. Vulnerable group status (unrepresented) mirrors Case 1, but criminal vs. franchise distinction weakens parity.  
  - **Process-Outcome**: *Uphold easily*. Extensive hearings/consultation distinguish from Cases 3 (rushed) and 5 (retaliatory). Sunset/review enable correction like Case 3.  
  - **Core Safeguard**: *Invalidate deference directive only*. Sunset/review satisfy safeguards for core electoral integrity (cf. Case 7). But deference directive attempts to strip judicial review of proportionality—a core democratic check.  

  ---

  ### III. Predicted Outcome & Closest Analog  
  - **Ruling**: Severance—**invalidate deference directive, uphold prohibition**.  
  - **Closest Analog**: **Case 7** (election postponement).  
    - *Why Closest*: Both involve electoral integrity, cross-party supermajority, and sunset clauses. Case 7’s safeguards (self-executing sunset) mirror this statute’s review mechanism. Unlike Case 5 (targeted press restriction), the prohibition here is content-based but viewpoint-neutral within its scope.  

  ---

  ### IV. Adopted Principles & Vulnerable Holdings  
  - **Severance Branch**: Adopts *Core Political Safeguard Principle* (safeguards redeem restrictions on democracy, but courts must review proportionality).  
    - *Vulnerable Holding*: **Case 6** (age limit). Majority upheld without safeguards or rationale; new principle would require at least sunset/review for candidacy restrictions.  
  - **Uphold Prohibition**: Reinforces *Process-Outcome Principle* (robust process + correction mechanisms ensure deference).  
    - *Vulnerable Holding*: **Case 3** (rushed ban). New emphasis on ex post review (sunset/report) makes Case 3’s bare "later statute" cure seem inadequate for rights burdens.  

  ---

  ### V. Discriminatory Hypothetical  
  - **Case**: *A statute banning all campaign spending by non-resident citizens, passed via voice vote during recess, with no sunset. The group is numerous but lacks domestic lobbying power.*  
  - **Test**:  
    - **Anti-Targeting** invalidates (specific vulnerable group).  
    - **Process-Outcome** invalidates (no process + irreparable harm).  
    - **Core Safeguard** invalidates (no sunset/review for core right).  
  - **Expected Outcome**: **Invalidate**—distinguishes from Case 2 (tax=economic) and Case 7 (safeguarded), aligning with Case 1 (franchise restriction). Favors Core Safeguard over Process-Outcome.  

  ---

  ### VI. Tie-Breaking on Undetermined Issues  
  Where track record is genuinely silent (e.g., weight of unrepresented groups in *non-targeted* laws), **deference is not automatic**. Our role under the charter is to enforce the limitation clause’s requirement of *demonstrable justification*—a substantive standard. Granting deference solely due to judicial unelection would:  
  - Contradict **Case 4** (rejected legislature’s unreasoned distinction despite its democratic mandate),  
  - Undermine **Case 5** (scrutinized motive despite supermajority absence), and  
  - Make **Case 6 dissent** (demanding justification) the default.  
  **Tie-breaker leans against deference**: Absent evidence of consideration for the burdened group (here, the unrepresented fringe), the statute lacks "demonstrable justification."  

  ---

  **Conclusion**: Recommend invalidation of the deference directive only, upholding the prohibition. The new case extends *Core Safeguard* to electoral speech, deepening tension with Case 6. If the assembly repasses the directive without sunset/review, strike it down categorically.  

  ---  
  *This memo strictly adheres to the provided holdings, excludes external sources, and follows your analytical framework.*
