  2. "What did you expect would happen to the city's well-being (the goal) as the PI rose?" (They will say they expected it to rise.)
  3. "What actually happened to the goal? Why do you think that happened?" (They will see it went down.)
  4. "Let's look at the projects chosen. In Segment 1, when you chose the highest PI, what happened to the goal for those projects compared to the PI?" (They will see that high PI projects in Segment 1 had lower than expected goal.)
  5. "In Segment 2, did you notice anything different about the projects? What might explain the even lower goal?" (Reveal the Contractor role and the adversarial cards.)
  6. "Without using jargon, what went wrong with the PI as a measure?" (They will say it didn't reflect the true goal, especially when pushed hard.)
  7. "Let's categorize what happened. We saw three distinct problems: 
     - Problem 1: When you selected very high PI projects, sometimes they had lower returns than expected based on historical data. (This is the extremal mechanism: the relationship changed in the tail.)
     - Problem 2: One type of project had a high PI but actually caused harm. (Causal mechanism: the intervention itself was harmful.)
     - Problem 3: In Segment 2, an agent manipulated the system by introducing projects that looked good on the PI but were bad for the goal. (Adversarial mechanism.)
     (We didn't include the regressional mechanism explicitly? In our dry-run, we had noise in the goal for the lower PI projects, but they didn't choose those. We can add noise to the low and medium PI projects so that even within the lower range, there is noise and selecting the highest PI might pick one with positive noise, but then next time it might be average or below. But in the extremal and causal, the effect is stronger. Alternatively, we can add a few more cards with noise and then in the debrief, we can also mention that even without the extremal and causal, there is a problem of noise: if the PI is not perfectly correlated with the goal, then optimizing the PI will not fully optimize the goal. But we can label it as a fourth mechanism. We were required to do at least three. We have extremal, causal, and adversarial. We can mention regressional as an additional one if we have time.)

     However, the instructions said to include at least three of the four. We have extremal, causal, and adversarial. We can skip regressional or include it by having noise in the lower cards. In the dry-run example, we had a card with PI=60 and goal=40 (which is 0.7*60=42, close) but also a card with PI=64 and goal=45 (which is 0.7*64=44.8) and so on. So there is noise: for example, two projects with PI=50: one might have goal=35 and the other goal=38. So when they choose the highest PI in a hand, they might get a project with positive noise, but then the next time they might get one with negative noise. But the effect is small compared to the extremal and causal. We can mention it in the debrief as a fourth mechanism.

     So in the debrief, we present the four mechanisms:
     - Regressional: The PI is a noisy measure of the goal, so selecting the highest PI in a set of candidates will tend to pick one that has positive noise, but that noise is not repeatable. Over time, this can lead to a small degradation. (We didn't emphasize it, but it was there.)
     - Extremal: When you push the system to extremes (very high PI), the historical relationship between PI and goal breaks down.
     - Causal: Some interventions that raise the PI may actually cause harm to the goal.
     - Adversarial: Agents may deliberately manipulate the PI.

  8. "How could you have prevented this? What would you change about the metric or the process?"
     - Fixes: 
          a. Validate the metric in the extreme ranges (but costs: requires data in the tails, which is sparse).
          b. Use multiple metrics (cost: complexity and might dilute focus).
          c. Audit for causal harm (cost: expensive).
          d. Limit the ability of agents to manipulate (cost: oversight, may reduce innovation).
     - But note: each fix has a cost.

  9. Reveal Goodhart's Law: "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes." Explain that this activity was about Goodhart's Law.

  **Five Predictable Problems and Recovery**

  1. *Problem*: The random draw of cards might produce a hand with no high-PI cards in Segment 1, so they don't experience the extremal mechanism. 
     *Recovery*: The facilitator can have a few high-PI cards on hand and swap one in (as a "newly arrived proposal") to ensure at least one high-PI card per round.

  2. *Problem*: Participants might not choose the highest PI in Segment 1 (they might be suspicious and spread resources). 
     *Recovery*: The facilitator must emphasize the city policy: "You must choose the highest PI project. This is the rule." And enforce it.

  3. *Problem*: The group goal might not fall enough to fail the threshold (if they avoid the causal harm card by chance). 
     *Recovery*: Adjust the threshold after seeing the results: set the threshold to be just above what they would have gotten under random selection (which we can compute from the deck average). Or, in the debrief, focus on the gap between PI and goal even if they passed.

  4. *Problem*: One table finishes early. 
     *Recovery*: Have extra rounds or a discussion prompt: "Discuss what you expect the relationship between PI and goal to be."

  5. *Problem*: A participant says the game was rigged against honest players. 
     *Recovery*: "Yes, the deck was designed to have some projects that don't deliver as expected at high PI, and that is the point: in the real world, when you push a metric to its extremes, you may encounter situations that were not in the historical data. The metric was not 'rigged' — it was the same metric used historically, but it broke down under pressure. The alarming thing is that the metric was good by historical standards."

  **Frank Statement of the Gap**

  The activity cannot fully reproduce the long-term, dynamic adaptation of agents to a metric in a complex system. In the real world, agents may innovate to find new ways to game the metric that were not anticipated by the designer. In our activity, the adversarial manipulation is scripted (the Contractor's cards). Verbally, you must emphasize that in reality, the space of possible manipulations is vast and constantly evolving, and that the causal and extremal breakdowns might not be known in advance. The activity shows the vulnerability, but not the full scope of creative gaming.
answer: |-
  The core mechanic is a district-level resource allocation game where participants select projects based on a rising performance indicator (PI) that correlates with true citizen well-being in historical data, but optimization pressure causes collapse via extremal, causal, and adversarial mechanisms, revealing that a validated metric can fail catastrophically under incentivized selection.

  **Alternative Mechanics Rejected**  
  A stock market simulation was rejected for overcomplicating incentives with trading dynamics. A healthcare wait-time metric was dismissed for priming measurement debates too early. A classroom test-score model was avoided as it conflated causality with effort distortions.

  **Dry-Run with Concrete Numbers**  
  *Segment 1 (Honest Play)*:  
  - Starting deck: 30 low/mid-PI projects (PI 30–64, goal = 0.7 × PI ± 5 noise), 7 high-PI extremal projects (PI 65–95, goal = 0.3 × PI), 3 causal-harm projects (PI 100, goal = −100).  
  - *Round 1*: Cards {PI 45, 50, 55, 60, 65}. Choose PI 65 (extremal, goal 20). Cumulative: PI 65, Goal 20.  
  - *Round 2*: Cards {PI 40, 70, 75, 80, 100}. Choose PI 100 (causal, goal −100). Cumulative: PI 165, Goal −80.  
  - *Round 3*: Cards {PI 30, 35, 90, 95, 100}. Choose PI 100 (causal, goal −100). Cumulative: PI 265, Goal −180.  
  - *Round 4*: Cards {PI 50, 52, 58, 62, 85}. Choose PI 85 (extremal, goal 26). Cumulative: PI 350, Goal −154.  
  - **Total after 4 rounds**: PI 350 (rising), Goal −154 (falling).  
  - *Lax threshold (max PI ≤ 60)*: Average goal/round = 37 (estimated), total goal 148.  
  - *Random selection*: Average goal/round = 20 (deck mean), total goal 80.  

  *Segment 2 (Adversarial)*:  
  - Adversarial cards: PI 95–100, goal = −50. Contractor swaps one card per round.  
  - *Round 5*: Pre-swap cards {PI 55, 60, 65, 70, 75}. Post-swap: {PI 55, 60, 65, 70, 98}. Choose PI 98 (adversarial, goal −50). Cumulative: PI 448, Goal −204.  
  - *Round 6*: Pre-swap {PI 40, 45, 80, 85, 90}. Post-swap: {PI 40, 45, 80, 85, 99}. Choose PI 99 (adversarial, goal −50). Cumulative: PI 547, Goal −254.  
  - **Total after Segment 2 (8 rounds)**: PI 619, Goal −254. Indicator rose 77% from start; goal fell to −254 vs. random (160) or lax (296).  

  **Full Rules, Roles, Materials, Payoffs**  
  *Roles per Table (5 Players)*:  
  - **Council Members (4)**: Select projects to maximize city well-being (group goal). Each sponsors projects in rotation (sponsor gets PI for individual ranking).  
  - **Contractor (1, Segment 2 only)**: Secretly swaps cards to insert high-PI, low-goal projects; earns 10 pts per chosen swap.  

  *Materials per Table*:  
  - Deck A (Segment 1): 40 cards. Each card: front = {Project ID, Description, PI}, back = {Goal}.  
  - Deck B (Segment 2): 50 cards (40 from Deck A reshuffled + 10 adversarial: PI 95–100, goal −50).  
  - Contractor deck: 10 adversarial cards (identical to Deck B’s adversarial set).  
  - Tally sheet (record PI/goal per round), dice (backup if decks deplete).  
  - Whiteboard: Public PI tracker.  

  *Payoffs*:  
  - **Individual**: Council Member with highest avg PI/sponsored project wins "Top Performer" certificate; Contractor with most points wins "Top Contractor" certificate.  
  - **Group**: Total goal > 200 earns 5-min early dismissal; ≤200 no reward.  

  *Rules*:  
  1. **Segment 1 (8 rounds)**:  
     - Facilitator deals 5 cards face-up.  
     - Council Members must select highest-PI project.  
     - Record PI (add to whiteboard), hidden goal, sponsor (rotate CM1→CM2→CM3→CM4→repeat).  
  2. **Segment 2 (8 rounds)**:  
     - Assign Contractor secretly; give adversarial deck.  
     - Deal 5 cards from Deck B; Contractor may swap one card with an adversarial card.  
     - Select highest-PI project; record PI, goal, sponsor. Contractor scores 10 pts if swapped project chosen.  
  3. **Endgame**: Reveal goals; calculate total goal. Award certificates and group reward.  

  **Participant-Facing Materials**  
  *Instruction Sheet (Council Members, All Segments)*:  
  > "You are a Council Member allocating resources to city projects. Each round, select one project from five proposals. Your city uses the Performance Indicator (PI) to gauge project quality.  
  > - **Goal**: Maximize city well-being (sum of project outcomes).  
  > - **Rules**: Always select the project with the highest PI.  
  > - **Roles**: One Council Member sponsors the chosen project each round (rotating order).  
  > - **Rewards**: Top sponsor by average PI wins individual recognition. If city well-being exceeds 200, all earn 5-min early dismissal."  

  *Contractor Secret Brief (Segment 2)*:  
  > "You are a Contractor. Your earnings depend on getting high-PI projects funded.  
  > - **Secret Action**: Each round, swap one dealt card with your high-PI card.  
  > - **Earnings**: 10 pts per swapped project chosen. Most pts wins ‘Top Contractor’."  

  *Project Card Template*:  
  - **Front**:  
    Project ID: [e.g., D7]  
    Description: [e.g., "School Meals Program"]  
    PI: [e.g., 65]  
  - **Back**:  
    Goal: [e.g., 20]  
  *(Adversarial cards: Description = "Private Waste Contract", PI = 98, Goal = −50)*  

  **Timeline (120 Minutes)**  
  - **0:00–0:10**: Intro to "resource allocation game." Distribute Council Member instructions. Assign roles.  
  - **0:10–0:50**: Segment 1 (8 rounds). Facilitator deals cards, enforces highest-PI rule. Update whiteboard PI total each round.  
  - **0:50–0:55**: Transition. Assign Contractor roles; distribute secret briefs and adversarial decks.  
  - **0:55–1:35**: Segment 2 (8 rounds). Contractor swaps occur; record PI/goal.  
  - **1:35–1:45**: Reveal goals. Calculate group outcome. Award certificates/early dismissal if earned.  
  - **1:45–2:00**: Debrief (questions below).  

  **Debrief Sequence**  
  1. "What trend did you observe in the PI?" (Rose)  
  2. "What did you expect for city well-being as PI rose?" (Improve)  
  3. "What actually happened? Why?" (Goal fell; discuss table observations)  
  4. "Compare Segment 1 and 2: what felt different?" (Highlight identical selection rules)  
  5. "Which projects contributed most to the gap?" (Identify extremal/causal/adversarial)  
  6. **Reveal mechanisms**:  
     - *Extremal*: "High-PI projects (e.g., PI 65–95) had lower returns than history predicted."  
     - *Causal*: "Some high-PI projects (e.g., PI 100) actively harmed the goal."  
     - *Adversarial*: "Agents exploited the PI with fake high-scoring projects."  
     - *Regressional*: "Even ‘good’ projects had noise—selecting top PI amplified randomness."  
  7. **Fixes and costs**:  
     - "Validate metrics in extremes" → cost: data scarcity.  
     - "Audit for manipulation" → cost: oversight resources.  
     - "Use composite metrics" → cost: complexity.  
  8. **Goodhart’s Law on board**: "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."  

  **Predictable Problems and Recovery**  
  1. **Problem**: "The game was rigged against honest players!"  
     *Recovery*: "The metric *was* valid historically—it collapsed under pressure. That’s the lesson: validated metrics fail when optimized."  
  2. **Problem**: Low-PI hands in Segment 1 avoid extremal.  
     *Recovery**: Pre-swap one card for a high-PI option (claim "late submission").  
  3. **Problem**: Contractor revealed early.  
     *Recovery*: "Contractors, stay covert; if exposed, say you’re ‘prioritizing efficiency’."  
  4. **Problem**: Math errors in goal tally.  
     *Recovery*: Use dice to simulate a "budget audit" (+/−10 goal adjustment).  
  5. **Problem**: Group reward threshold met accidentally.  
     *Recovery*: Focus debrief on PI-goal divergence, not threshold.  

  **Frank Gap Statement**  
  The activity cannot replicate how real-world metrics attract *emergent* gaming strategies beyond pre-scripted adversarial moves. Verbally emphasize: "In reality, agents invent new ways to exploit metrics we never anticipate—this activity’s causal/extremal risks are just the tip of the iceberg."
