  The key challenge is that disjunctivists define hallucinations purely in terms of indiscriminability from veridical perception - there's no common mental state shared between veridical perception and hallucination. The user wants a case that shows this characterization is false or incomplete, without using sci-fi elements or rehashing tired examples like the bent stick or yellow lemon.

  The constraints are quite specific: one paragraph in an ordinary real-world setting, must be a true hallucination (object absent, not just misperceived), the subject must have strong internal evidence that it's not real, the experience must have full perceptual force and be unbidden, and no relying on clinical terminology to do the work.

  I'm considering a case involving phantom limb pain. Many amputees continue to vividly feel their missing limbs, and in certain situations, they might have compelling evidence that the sensation doesn't correspond to reality. For example, an amputee who feels intense pain in their missing leg while watching their stump on video, so they simultaneously experience the pain while seeing visual evidence that there's nothing there to be painful. This avoids sci-fi elements and uses a well-documented phenomenon.

  The case would satisfy all constraints: it's ordinary (amputee in physical therapy), a true hallucination (the limb is absent), the subject has direct visual evidence contradicting the sensation, the pain has full perceptual force, and it's unbidden. Crucially, the subject knows through concurrent evidence that the experience doesn't correspond to reality, which challenges the idea that hallucinations are defined solely by indiscriminability.

  For the disjunctivist response, they might initially claim the subject can't tell it apart from a real perception, but that falls apart because the subject has concurrent evidence it's not real. This jams their usual move. The common-factor theorist would point to this as evidence of a shared inner state - the pain experience itself remains real regardless of external reality.

  The critical feature is the concurrent contradictory evidence - without this, the subject wouldn't know it's unreal during the experience. The disjunctivist's best response might be to question whether this is truly perceptual rather than cognitive, but the vividness makes that difficult.

  I think this presents a genuine problem for disjunctivism by showing hallucinations have positive characteristics beyond indiscriminability. To make it stronger, we could add a scenario where the subject has to act based on this knowledge despite the vivid experience.
