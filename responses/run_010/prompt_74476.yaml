  Here's the case:

  > Elara, a professional pianist, sits at her familiar Steinway under bright concert hall lights before rehearsal. Suddenly, her left hand appears disembodied—floating six inches above the keyboard, translucent and shimmering like heat haze. She feels its weight and the cool ivory keys beneath phantom fingertips. The hallucination persists with vivid solidity: she sees the tendons shift as she "flexes" it, hears the faint rustle of imagined skin against wood. Yet simultaneously, she sees her actual left arm resting perfectly still in her lap through her peripheral vision and feels the pressure of her thigh against her real palm. She deliberately tries to lift her real hand—it remains inert against her leg, confirming her paralysis from the recent stroke she’s rehabilitating. The floating hand remains stubbornly present, visually occluding the sheet music behind it, audibly distinct from the hall’s ambient noise. She *knows* it isn’t there because she directly perceives the contradictory evidence: her real hand is visibly paralyzed in her lap, its immobility confirmed by her failed effort to move it, while the hallucination occupies incompatible space.

  **Constraint Check:**
  1.  **Real world, ordinary**: Concert hall, pianist, stroke rehabilitation - no sci-fi/tech.
  2.  **Hallucination, not illusion**: The floating hand *is absent*. It isn't a misperception of her paralyzed hand (which is seen in her lap).
  3.  **Subject knows internally**: Evidence is integrated *during the experience*: peripheral sight of real hand in lap *contradicts* the location of the floating hand; failed motor command to move real hand confirms paralysis; the hallucinated hand occupies space incompatible with her real body's position. No external diagnosis needed.
  4.  **Full perceptual force & unbidden**: It has visual detail (transparency, texture, occlusion), tactile sensation (weight, cool keys), auditory components (rustling), persistence, and solidity. It appears suddenly and resists her will (she doesn't *try* to hallucinate it).
  5.  **Clinical basis, not reliant on name**: Based on anosognosia (denial of illness) and complex somatic hallucinations following stroke, but described mechanically: paralysis + conflicting sensory feedback + vivid phantom limb variant.

  **Disjunctivist Analysis & Where it Jams:**
  *   **Usual Move**: "This is just a hallucinatory state indiscriminable from veridically perceiving a floating hand. That's the whole story."
  *   **The Jam**: The disjunctivist move *requires* indiscriminability to define the state. But Elara *can discriminate it from veridical perception **during the experience itself***. She has concurrent, perception-based evidence *ruling out* that she is veridically perceiving a floating hand (her real hand is seen in her lap, paralyzed). She knows it's hallucinatory *because* it clashes with her concurrent veridical perceptions and proprioception. The negative epistemic characterization ("a state you can't tell apart from seeing X") fails because she *can* tell it apart *from within the experience*, using the very evidence available to her perception. It can't be defined *solely* by indiscriminability if it's discriminated *in situ*.

  **Common-Factor Theorist (Representationalist) Analysis:**
  The representationalist would argue this case powerfully demonstrates a common factor: an internally generated perceptual *representation* with specific content ("there is a floating, translucent hand here"). This representation has high fidelity, driving multimodal sensory qualities (visual, tactile, auditory) with apparent presence. Crucially, this representational state *persists* despite Elara's *belief* (based on other concurrent perceptions and inferences) that the represented object is absent. The vividness and sensory character are properties of the internal state itself, shared in kind (though not in cause) with veridical perception. The clash between the representation's content ("floating hand present") and her rational conclusion ("no floating hand present") highlights the autonomy of the perceptual representation – it's a positive inner episode that can be decoupled from belief and external reality.

  **Critical Feature & Disjunctivist Reply:**
  *   **Critical Feature**: **Concurrent, perception-based contradictory evidence integrated during the hallucination.** Elara *simultaneously* experiences the vivid hallucination *and* veridically perceives evidence proving its unreality *within the same experiential field*.
  *   **Collapse without it**: Remove the concurrent veridical evidence (e.g., if the room was dark, or she couldn't see/feel her paralyzed hand), and the case reverts to a standard indiscriminable hallucination. She would lack the internal justification to know it's unreal during the event.
  *   **Best Disjunctivist Reply (non-dismissive)**: "While Elara forms a *belief* about the hallucination's unreality based on concurrent veridical inputs, the hallucinatory *experience itself* remains a distinct perceptual kind. Its phenomenal character is constituted by its failure to be a presentation of the world, and her concurrent veridical experiences are separate perceptual states. The 'indiscriminability' defining the hallucination refers to its *intrinsic phenomenal character* considered *in isolation* – if you somehow *only* had that floating-hand experience, you couldn't tell it wasn't veridical. Her knowledge comes from *other*, simultaneous perceptual states, not from an intrinsic property of the hallucinatory state revealing itself."

  **Verdict: Genuine Problem.**
  This case directly challenges the core negative epistemic claim by demonstrating a hallucination that *is* discriminated from veridical perception *during the experience itself*, using internally available perceptual evidence. It forces the disjunctivist to either:
  1.  Argue implausibly that the contradictory evidence isn't truly perceived/concurrent (contrary to the description).
  2.  Concede that the definition requires considering the hallucinatory state *in artificial isolation*, which seems ad hoc given the subject's unified experience.
  3.  Radically reinterpret the subject's knowledge as not based on perception (e.g., as a purely cognitive inference), which ignores the direct sensory nature of the contradictory evidence.

  **Smallest Change to Hit Harder:** Make the contradictory evidence **more direct and unavoidable**. Instead of peripheral vision of the paralyzed hand and failed movement, have Elara **reach out with her functional right hand to touch the location of the floating hallucination**. She *sees* her real right hand pass *through* the solid-looking phantom hand and feel only empty air, *while* the hallucination of the floating hand and the tactile sensation of touching it persist undiminished. This removes any reliance on inference (failed motor command) or indirect perception (peripheral vision), making the clash between hallucinatory content and veridical tactile/visual input simultaneous, direct, and inescapable.
