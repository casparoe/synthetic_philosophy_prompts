prompt: |-
  I am responsible for the formal ontology layer of an industrial asset registry: a single database that must decide, unambiguously and on demand, which composite entities exist, when they come into and go out of existence, and whether two records denote one object or two. Everything downstream keys off that answer — depreciation schedules, warranty liability, ownership, whether a given removal constitutes theft of one item or of several. The entities we actually have to register are not the ones that dominate the philosophical literature. Among the records in scope:

  - a stock of identical bearings, physically indistinguishable and swapped between sites as a matter of routine, which operations insists is one asset even though its parts change hourly and are distributed across three countries;
  - a production line that is dismantled each summer, shipped to another plant, and reassembled from the same components in a different arrangement;
  - a sealed cooling circuit whose working fluid is continuously replaced, where it is genuinely unclear whether the circuit is the pipework, the fluid, or both;
  - two machine frames bolted together, either of which functions perfectly well alone, whose joint registration exists only for insurance purposes;
  - an assembly that is sixty per cent built and will either be completed or scrapped, with no determinate fact about which until months hence.

  I would like the metaphysics settled before choosing a representation, so please write the desiderata: the specification any candidate answer to the special composition question — any account of when some things compose something — must meet in order to be usable here and, more importantly, defensible in general.

  For each requirement, give the consideration that motivates it and, where it clarifies, a test case drawn from the list above or one of your own construction. I want the specification to cover, at minimum: the phenomena an account must explain or explain away, including our ordinary counts of objects, sorites-susceptible borderline situations, the apparent possibility of two objects sharing all their parts, and the worry that permissive accounts commit us to arbitrary or undetectable sums; the distinctions it must not collapse, such as that between composing and being identical, between a whole existing and a whole being a convenient posit, between being one thing and being counted as one, and between vagueness in what exists and vagueness in our knowledge of what precisely exists; the results concerning vagueness and restricted composition with which it must be consistent; and which of the demands routinely made in this debate are not genuine constraints at all but the preferences of one camp. I suspect at least two of the standard demands belong in that last category, and I want to know which ones and on what grounds.

  Then flag any subset of the desiderata you believe cannot be jointly satisfied, and demonstrate the conflict rather than asserting it. If the list turns out to be inconsistent, that is the most useful thing you can tell me, because it would mean the registry has to be built on a choice among defective options rather than on a correct theory. Finally, identify which single requirement, if relinquished, would admit the largest number of otherwise-excluded accounts: I want to know where the least resistance lies.

  Close briefly — a few paragraphs, no more — with how unrestricted composition, universalism motivated by treating composition as a kind of identity, nihilism, and contact-or-fastening accounts fare against the list, and whether any of them could serve a system obliged to return a definite answer, on request, to whether a given record denotes one thing or two.

  One condition on how you present this. Mark clearly which parts of your account are settled among people who work on composition and which remain live disputes, and label your own judgment calls as such. Do not allow a position you find attractive to appear as the consensus; where the field genuinely divides, say that it divides, then say which way you lean and why.
reasoning: |-
  We are constructing a set of desiderata for a theory of composition that must serve in an industrial asset registry. The registry must decide unambiguously and on demand when composite entities exist, when they come into and go out of existence, and whether two records denote one object or two. The examples provided challenge standard metaphysical accounts.

  We will list the desiderata, each with:
  - The requirement.
  - The motivation (consideration that motivates it).
  - A test case (if it clarifies).

  We must cover:
  1. Phenomena to explain: ordinary counts, sorites borderline cases, two objects sharing all parts (coincidence), permissive accounts leading to arbitrary/undetectable sums.
  2. Distinctions not to collapse: composing vs. identical, existence vs. convenient posit, being one thing vs. counted as one, vagueness in existence vs. vagueness in knowledge.
  3. Consistency with results on vagueness and restricted composition.
  4. Demands that are not genuine constraints but preferences of one camp.

  Then:
  - Flag any subset of desiderata that cannot be jointly satisfied (with demonstration of conflict).
  - Identify which single requirement, if relinquished, would admit the largest number of otherwise-excluded accounts.

  Finally, briefly assess unrestricted composition (universalism), nihilism, contact-or-fastening accounts, and the universalism motivated by composition as identity.

  We mark:
  - What is settled in the literature (if any) and what is disputed.
  - Our own judgment calls as such.

  ---

  **Desiderata for a Theory of Composition**

  1. **Unambiguous Existence Conditions (Determinacy)**
     - *Motivation*: The registry must return a definite answer for any record at any time about whether the composite exists. Vagueness in existence is unacceptable because it would lead to inconsistent records downstream (e.g., depreciation, ownership).
     - *Test Case*: The assembly that is 60% built and may be completed or scrapped. The registry must decide now whether it exists as an asset, even if the future is indeterminate.
     - *Status*: This is a practical requirement for the system. In metaphysics, it is controversial whether existence can be vague (see desideratum 8).

  2. **Ordinary Object Accounting (Common Sense)**
     - *Motivation*: The theory must respect our ordinary judgments about when composite objects exist, at least in clear cases, to avoid counterintuitive results and maintain coherence with everyday and legal practices.
     - *Test Case*: The production line that is dismantled and reassembled elsewhere. Operations treat it as the same asset. The theory must account for this continuity.
     - *Status*: This is widely accepted as a constraint, but there is dispute about how much weight to give common sense.

  3. **Non-Arbitrariness (Avoidance of Undetectable Sums)**
     - *Motivation*: The theory should not commit the registry to tracking entities that are arbitrary or undetectable, such as the sum of a bearing and a random tree. This would overwhelm the system and make identity conditions intractable.
     - *Test Case*: The stock of identical bearings. Operations treats the entire stock as one asset, but if the theory were permissive (like universalism), it would also include every arbitrary subset of bearings, which is not practical.
     - *Status*: This is a common objection to universalism. However, universalists argue that we can ignore undetectable sums without denying their existence.

  4. **Resolving Coincidence (No Two Objects Sharing All Parts)**
     - *Motivation*: The theory must avoid cases where two distinct objects share all the same parts at the same time, as this would lead to ambiguity in identity and tracking.
     - *Test Case*: The sealed cooling circuit: is it the pipework, the fluid, or both? The registry must decide whether there is one asset or two (or more) that coincide.
     - *Status*: This is a central problem in metaphysics. Some theories (e.g., temporal parts) allow coincidence, while others (e.g., Aristotelian hylomorphism) reject it.

  5. **Handling Sorites-Susceptibility (Vagueness in Composition)**
     - *Motivation*: The theory must account for or rule out borderline cases of composition (e.g., when does a collection of parts become a whole?) without allowing vagueness in existence.
     - *Test Case*: The assembly that is 60% built: at what exact stage does it come into existence? The registry cannot have a vague existence condition.
     - *Status*: This is a major challenge. Some philosophers (e.g., nihilists) avoid it by denying composition, while others (e.g., universalists) avoid it by having sharp boundaries for arbitrary sums. But for ordinary objects, vagueness seems ineliminable.

  6. **Distinction Between Composition and Identity**
     - *Motivation*: The theory must not conflate the relation of composition (parts making a whole) with identity (being the same thing). This is fundamental to part-whole reasoning.
     - *Test Case*: The two machine frames bolted together: they are two distinct things that are composed into one joint registration. The registry must be able to represent both the frames individually and the composite without collapsing the distinction.
     - *Status*: This is settled: composition is not identity. However, some versions of universalism (composition as identity) hold that composition is a kind of identity, but even then, it is a generalized form.

  7. **Existence vs. Convenience**
     - *Motivation*: The theory must distinguish between a composite object genuinely existing and being merely a convenient posit. The registry must record only what exists, not what is useful to think about.
     - *Test Case*: The joint registration of the two machine frames: is the composite a real entity or a legal fiction? The registry must decide whether it exists independently of our purposes.
     - *Status*: This is disputed. Some (e.g., pragmatists) hold that composition is mind-dependent, while others (e.g., realists) deny this.

  8. **Vagueness in Existence vs. Vagueness in Knowledge**
     - *Motivation*: The theory must clearly distinguish between vagueness in what exists (ontic vagueness) and vagueness in our knowledge (epistemic vagueness). The registry requires that existence is not vague, so any vagueness must be epistemic.
     - *Test Case*: The cooling circuit: if we cannot decide whether it is the pipework or the fluid, is that because there is no fact of the matter (ontic) or because we lack information (epistemic)? The registry must assume the latter.
     - *Status*: There is debate about whether ontic vagueness is possible. Some philosophers (e.g., Lewis) reject it, while others (e.g., proponents of vague objects) accept it.

  9. **Consistency with Vagueness and Restricted Composition**
     - *Motivation*: The theory must be consistent with the logical and metaphysical results about vagueness (e.g., sorites paradox) and restricted composition (the idea that composition only occurs under certain conditions).
     - *Test Case*: The stock of bearings: if we say the entire stock is one asset, but the stock changes parts, then we have a sorites-like problem: how many bearings can be removed before it ceases to exist? The theory must handle such changes without vagueness.
     - *Status*: This is a live dispute. Nihilism avoids vagueness by denying composition, while universalism avoids it by having sharp boundaries. Restricted composition theories (e.g., contact) face the sorites problem.

  10. **Non-Collapse of Counts (One Thing vs. Counted as One)**
      - *Motivation*: The theory must not conflate being one object with being counted as one for practical purposes. The registry must reflect the objective unity of the asset.
      - *Test Case*: The stock of bearings: operations counts it as one, but is it objectively one? The theory must say.
      - *Status*: This is related to the realism/anti-realism debate about composition.

  **Demands that are Not Genuine Constraints (Preferences)**

  We suspect at least two standard demands are not genuine constraints but preferences of one camp.

  - **Demand for Parsimony (Ockham's Razor)**: The demand that we avoid multiplying entities beyond necessity is often invoked against universalism. However, this is a methodological preference, not a constraint. The registry might accept many entities if it can manage them.
    - *Status*: Disputed. Some consider it a constraint, others a heuristic.

  - **Demand for Mind-Independence**: The demand that composition must be entirely independent of human interests. This is a preference of realists. Anti-realists (e.g., contextualists) hold that composition is interest-relative. The registry, being a human institution, might accept some interest-relativity.
    - *Status*: A major divide in the field.

  **Conflicts Among Desiderata**

  We now flag conflicts.

  - **Conflict between Determinacy (1) and Handling Sorites (5)**: 
    - The requirement for unambiguous existence conditions (1) demands sharp boundaries. However, sorites-susceptibility (5) suggests that for many composites (like the assembly at 60%), there is no sharp boundary. If we insist on determinacy, we must either accept sharp boundaries (which seem arbitrary) or deny that such composites exist until they are complete (which conflicts with ordinary practice). 
    - *Demonstration*: Consider the assembly that is being built. If we require determinacy, we must pick a precise point (e.g., 80% completion) when it comes into existence. But this seems arbitrary and does not match our vague concept of the assembly. If we allow vagueness, we violate determinacy.

  - **Conflict between Ordinary Object Accounting (2) and Non-Arbitrariness (3)**:
    - Ordinary practice accepts composites like the stock of bearings (one asset) and the production line (same asset after reassembly). But a theory that accounts for these might have to accept other composites that seem arbitrary (e.g., a subset of bearings) to avoid arbitrariness? Not necessarily. However, if we try to restrict composition only to the composites we care about, we face the sorites problem again (how much restriction?).

  **Which Requirement to Relinquish?**

  If we relinquish **Ordinary Object Accounting (2)**, then we can adopt nihilism (which denies almost all composites) or universalism (which accepts all). This would admit the largest number of otherwise-excluded accounts. However, this may be too costly for the registry, which must account for ordinary composites.

  Alternatively, relinquishing **Determinacy (1)** would allow theories that accept vague existence. But the registry cannot tolerate vague existence because it must return definite answers.

  Therefore, the requirement whose relinquishment would admit the most accounts is **Ordinary Object Accounting (2)**, because both nihilism and universalism reject it as a constraint (nihilism denies most ordinary composites, universalism accepts them but also many more). Restricted composition theories try to respect ordinary objects.

  **Assessment of Standard Theories**

  - **Unrestricted Composition (Universalism)**: 
    - *Fits*: Determinacy (1) is satisfied (every set composes something, so existence is always definite). Non-collapse of counts (10) is maintained (the composite is one thing, but we can choose to count it or not). Distinction between composition and identity (6) is maintained (though some versions of composition as identity blur it).
    - *Fails*: Non-Arbitrariness (3) (it posits undetectable sums). Ordinary Object Accounting (2) is partially met (it includes ordinary objects but also many more). It may not respect the intuition that some composites are not genuine (7). 
    - *Vagueness*: Avoids ontic vagueness by having sharp boundaries, but the boundaries are arbitrary for ordinary objects (violates the spirit of 5). 
    - *For Registry*: It could work if we ignore the arbitrary sums and only register composites we care about, but then we must have a separate criterion for which composites to register, which the theory does not provide.

  - **Composition as Identity (a motivation for universalism)**:
    - Similar to universalism, but holds that the whole is identical to its parts (collectively). This might help with the stock of bearings (the whole stock is identical to the bearings). However, it faces the same problems with arbitrariness and does not solve the coincidence problem (e.g., the cooling circuit: the pipework and the fluid are different parts, so the whole would be identical to both?).

  - **Nihilism (no composition except simples)**:
    - *Fits*: Determinacy (1) (only simples exist). Non-Arbitrariness (3) (no arbitrary composites). Avoids sorites (5) (no composites, so no vagueness about when they exist). 
    - *Fails*: Ordinary Object Accounting (2) (denies that the production line, the stock of bearings, etc., exist). This is a fatal flaw for the registry, which must register these as assets.
    - *For Registry*: Not usable because it denies composite assets.

  - **Contact-or-Fastening Accounts (restricted composition: composition occurs only when parts are in contact or fastened)**:
    - *Fits*: Ordinary Object Accounting (2) for some cases (e.g., the two bolted frames are one when bolted). Non-Arbitrariness (3) is partially met (only connected things exist). 
    - *Fails*: The production line: when dismantled, it ceases to exist, but operations consider it the same asset. Also, the stock of bearings (distributed across countries) would not compose one thing because the bearings are not in contact. The cooling circuit might be one if the pipework is connected, but the fluid is not fastened. 
    - *Vagueness*: Suffers from sorites problems. When does contact become fastening? How much fastening is required? This leads to borderline cases, violating determinacy (1).
    - *For Registry*: Not ideal because it cannot handle distributed assets or temporary disassembly.

  **Conclusion**

  None of the standard theories satisfy all the desiderata. The registry must choose among defective options. The most promising for the registry might be a pragmatic theory that accepts composition as interest-relative (violating mind-independence) and imposes sharp boundaries for determinacy. For instance, we might define assets by their functional role in operations and specify precise conditions for existence. This would be a form of conventionalism.

  However, note that conventionalism is controversial and may violate the distinction between existence and convenience (7). But for the registry, it might be defensible.

  **Settled vs. Disputed**

  - Settled: Composition is not identity in the strict sense (6) (though composition as identity is a disputed variant).
  - Disputed: 
    - Whether ontic vagueness is possible (8) - disputed.
    - Whether composition is mind-independent (7) - disputed.
    - Whether universalism or restricted composition is correct - disputed.
    - How to handle coincidence (4) - disputed.

  **Judgment Calls**

  - I judge that the requirement for determinacy (1) is non-negotiable for the registry, even if it forces arbitrary boundaries.
  - I also judge that ordinary object accounting (2) must be largely respected for practical reasons.
  - Therefore, the best bet is a restricted composition theory with conventional elements, where we stipulate existence conditions for assets based on functional criteria and set sharp thresholds for vagueness-prone cases.

  However, this will require making some tough choices, such as deciding that the stock of bearings is one asset by fiat, and specifying at what stage a partially built assembly comes into existence (e.g., at 75% completion). This approach accepts that the metaphysics is not entirely mind-independent but is constrained by operational needs.
answer: |-
  ### Desiderata for a Composition Theory in an Industrial Asset Registry  
  The following specification outlines the requirements a theory of composition must meet to serve as the foundation for an industrial asset registry. Each desideratum includes its motivation and a clarifying test case. The list covers phenomena to explain, distinctions to preserve, consistency conditions, and non-genuine constraints. I note where positions are settled in the literature, where disputes exist, and where my judgment calls apply.  

  #### Core Desiderata  
  1. **Determinacy of Existence and Identity**  
     - **Motivation**: The registry must return unambiguous answers on existence and identity (e.g., "does composite X exist at time T?" or "are records A and B co-referential?"). Vagueness in *whether an entity exists* or *whether two records denote the same thing* is operationally intolerable, as downstream systems (e.g., depreciation, liability) require binary decisions.  
     - **Test Case**: The 60%-built assembly (§5): The registry must decide *now* whether it exists as an asset, even if future completion is indeterminate. A theory must specify precise existence conditions.  
     - **Status**: **Disputed**. While most metaphysicians accept that *statements* about composition can be vague, ontic vagueness (vagueness in existence itself) is contentious. Critics (e.g., Lewis) reject it as incoherent; defenders (e.g., van Inwagen) argue it is unavoidable. **My judgment**: For the registry, ontic vagueness is unacceptable—it would render answers non-binary.  

  2. **Ordinary Object Accommodation**  
     - **Motivation**: The theory must align with pre-theoretic judgments about "everyday" composites (e.g., machines, assemblies) to ensure intuitive usability and legal defensibility. Ignoring these invites user rejection and systemic errors.  
     - **Test Case**: The dismantled/reassembled production line (§2): Operations treat it as one persistent asset despite seasonal disassembly. A theory must explain this continuity.  
     - **Status**: **Settled** as a minimal constraint (even nihilists like Merricks concede this). Disagreement arises over *which* composites count as "ordinary" and how much weight to give intuition.  

  3. **Non-Arbitrariness**  
     - **Motivation**: The registry cannot track undetectable or gerrymandered entities (e.g., "the sum of bearing #3 and a random tree"), as this would explode the ontology, overwhelm tracking, and introduce undecidable identity conditions.  
     - **Test Case**: The distributed bearing stock (§1): Operations treat the entire stock as one asset, but a permissive theory (e.g., universalism) would also include every arbitrary subset, which is unworkable.  
     - **Status**: **Disputed**. Universalists (e.g., Lewis) accept arbitrariness but argue we can ignore irrelevant sums; restrictivists (e.g., van Inwagen) reject it as absurd. **My judgment**: Non-arbitrariness is essential for tractability.  

  4. **Resolution of Coincidence Puzzles**  
     - **Motivation**: The theory must preclude two distinct objects sharing all parts at once (e.g., "is the cooling circuit the pipework, the fluid, or both?"). Coincidence would create ambiguity in identity, leading to inconsistent liability or ownership assignments.  
     - **Test Case**: The sealed cooling circuit (§3): If the fluid and pipework are distinct but co-located, the registry must decide whether one or two assets exist.  
     - **Status**: **Disputed**. Coincidence is accepted by perdurantists (e.g., Sider) but rejected by endurantists (e.g., Thomson).  

  5. **Sorites Immunity**  
     - **Motivation**: The theory must either eliminate or definitively resolve sorites-susceptible scenarios (gradual changes leading to vagueness in composition). Borderline cases (e.g., "when does an assembly begin to exist?") cannot produce registry indecision.  
     - **Test Case**: The 60%-built assembly (§5): A theory must specify an exact threshold for existence (e.g., "at 70% completion") or explain why vagueness arises without implying ontic indeterminacy.  
     - **Status**: **Disputed**. Nihilists avoid sorites by denying composites; universalists avoid it via sharp cuts; restrictivists (e.g., van Inwagen) struggle with it.  

  6. **Distinction Preservation**  
     - **Motivation**: The theory must **not** collapse:  
       - (a) *Composition vs. identity*: Composing a whole is not identical to being that whole (e.g., parts ≠ whole).  
       - (b) *Existence vs. convenience*: An asset exists objectively, not merely as a "useful fiction."  
       - (c) *Being one thing vs. being counted as one*: Unity is not reducible to operational counting practices.  
       - (d) *Vagueness in existence vs. vagueness in knowledge*: Uncertainty about facts (e.g., "is the assembly complete?") must not be conflated with indeterminate existence.  
     - **Test Case**: Bolted machine frames (§4): The joint registration is a single asset for insurance, but the theory must clarify whether it *exists* independently or is a mere accounting convention.  
     - **Status**: (a) **Settled**: Composition is not strict identity (though "composition as identity" universalists dispute this). (b–d) **Disputed**: Realists (e.g., Sider) insist on mind-independence; anti-realists (e.g., Hirsch) tie existence to conceptual schemes.  

  7. **Consistency with Vagueness and Restricted Composition**  
     - **Motivation**: The theory must cohere with:  
       - (a) Logical treatments of vagueness (e.g., supervaluationism, epistemicism).  
       - (b) The possibility of restricted composition (composition occurs only under specific conditions, e.g., functional unity).  
     - **Test Case**: Bearing stock (§1): If parts change hourly, a theory must explain persistence without vague identity conditions (sorites) and justify why the stock composes an object while arbitrary subsets do not (restriction).  
     - **Status**: **Disputed**. Universalists reject (b); nihilists reject composites entirely.  

  #### Non-Genuine Constraints (Camp-Specific Preferences)  
  - **Parsimony (Ockham's Razor)**: The demand to minimize entities is often wielded against universalism. However, it is a methodological preference, not a constraint. The registry could manage many entities if they are non-arbitrary (e.g., functional composites). *Motivation*: Universalists argue parsimony applies only to *fundamental* entities; restrictivists insist it applies to composites.  
  - **Mind-Independence**: The insistence that composition must be wholly independent of human interests. This is a *realist preference* but conflicts with the registry's pragmatic needs (e.g., the bolted frames §4 exist as one asset only for insurance). *Motivation*: Anti-realists (e.g., contextualists) argue composition *is* interest-relative; realists call this ontologically irresponsible.  

  #### Inconsistencies Among Desiderata  
  **Conflict**: **Determinacy (1)** and **Ordinary Object Accommodation (2)** cannot be jointly satisfied with **Sorites Immunity (5)**.  
  - **Demonstration**: Ordinary objects (e.g., the 60%-built assembly §5) exhibit sorites-susceptibility in composition (when do parts compose a whole?). Determinacy requires sharp thresholds (e.g., "existence begins at 80% completion"). However, ordinary practice rejects such precision as arbitrary—no "metaphysical cut-off" aligns with intuition. Thus:  
    - To satisfy (1) and (5), a theory must impose sharp boundaries, violating (2) by overriding ordinary judgments (e.g., "the assembly exists at 60%").  
    - To satisfy (2) and (5), a theory must accept vagueness, violating (1) by making existence indeterminate.  
  - **Result**: Any theory sacrifices one desideratum. Nihilism avoids sorites but violates (2); epistemicism imposes sharp cuts but violates (2); supervaluationism preserves (2) but violates (1) by allowing indeterminate cases.  

  #### Which Requirement to Relinquish?  
  Relinquishing **Ordinary Object Accommodation (2)** admits the most theories:  
  - **Universalism** (all pluralities compose a whole) and **nihilism** (no composites exist) both reject (2): universalism includes non-ordinary sums, nihilism excludes ordinary composites.  
  - **Restrictivist accounts** (e.g., functionalism, contact-based theories) depend on (2) and are excluded if it is dropped.  
  - **Impact**: This is costly for the registry, as ignoring ordinary objects (e.g., machines, production lines) undermines its purpose.  

  #### Assessment of Standard Theories  
  - **Universalism (Unrestricted Composition)**:  
    - **Fits**: Determinacy (1) (every set composes something), Non-Arbitrariness? (3) (fails—arbitrary sums exist but can be ignored), Distinction (6a) (preserved if composition ≠ identity).  
    - **Fails**: Ordinary Objects (2) (over-includes arbitrary sums), Coincidence (4) (allows distinct co-located objects), Vagueness (5) (sharp boundaries for all sums, but unintuitive for ordinary objects).  
    - **Registry Viability**: Unworkable—arbitrary sums overwhelm the system, and coincidence puzzles (e.g., cooling circuit §3) yield multiple answers.  

  - **Composition as Identity (Universalism Variant)**:  
    - **Fits**: Determinacy (1), Ordinary Objects? (2) (only if "ordinary" sums are identity-like).  
    - **Fails**: Non-Arbitrariness (3) (still includes all sums), Coincidence (4) (cannot resolve pipework vs. fluid in §3), Distinction (6a) (blurs parts/whole identity).  
    - **Registry Viability**: Worse than universalism—identity claims (e.g., "bearing stock = its parts") conflict with counting practices.  

  - **Nihilism (No Composite Objects)**:  
    - **Fits**: Determinacy (1) (only simples exist), Non-Arbitrariness (3), Sorites Immunity (5).  
    - **Fails**: Ordinary Objects (2) (denies composites like production lines), Distinction (6c) (collapses "being one" into operational counting).  
    - **Registry Viability**: Non-starter—denies the existence of registered assets (e.g., machines).  

  - **Contact-or-Fastening Accounts (e.g., Mereological Nihilism+ for connected parts)**:  
    - **Fits**: Ordinary Objects? (2) (for connected entities), Non-Arbitrariness (3) (restricts to connected sums).  
    - **Fails**: Determinacy (1) (sorites in "contact"—e.g., how much fastening is needed for bolted frames §4?), Coincidence (4) (pipework and fluid may both qualify), Vagueness (5) (borderline contact cases).  
    - **Registry Viability**: Marginal—fails for distributed assets (bearing stock §1) and dismantled systems (production line §2).  

  #### Conclusion  
  No theory satisfies all desiderata, forcing the registry to choose among flawed options. **Determinacy (1)** and **Non-Arbitrariness (3)** are non-negotiable; relinquishing **Ordinary Object Accommodation (2)** is the least resistant path but pragmatically costly. A hybrid approach may be necessary: e.g., a **conventionalist restrictivism** where composites exist only under context-dependent functional unity (e.g., "the bearing stock is one asset because operations treats it as such"), with sharp thresholds for sorites cases. This secures determinacy but violates mind-independence (6b)—a defensible trade-off for an industrial system.  

  **Settled vs. Disputed**:  
  - **Settled**: Composition ≠ identity (6a); ordinary objects constrain theories (2).  
  - **Disputed**: Ontic vagueness (1), mind-independence (6b–d), coincidence (4), and the viability of restricted composition (7b).  
  - **My Judgment**: Determinacy (1) must override ordinary practice in borderline cases (e.g., stipulate existence thresholds for assemblies). Coincidence (4) must be resolved by fiat (e.g., cooling circuit is pipework-only) to ensure unambiguous records.
