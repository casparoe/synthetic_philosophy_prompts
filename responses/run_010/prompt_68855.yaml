  - Slack for cp-laws is promising. 
  - Framing systematization as the real battleground feels fresh.

  For structure... if forced to cut, [3]/[4] seem more original than [2] which resembles temporal Humean literature. But [2] is the engine - sacrificing it might leave the paper derivative.

