  Breaking this down:
  For question 1 about metaphysics vs epistemology - this is the deepest worry. Their windowed account risks collapsing into an evidentialist view of laws. But there might be a metaphysical reading: the laws just are what best systematizes the local mosaic, full stop. The backward-looking version especially pushes this boundary. 

  Question 2 about slack being redundant is astute. The best-system tradeoff already implies degrees of robustness. But maybe slack adds value by quantifying it explicitly for cp-laws? Though they'd need to show why this isn't just relabeling.

  On question 3 - the anti-Humean counterattack could be brutal. Necessitation theorists might insist their nomic relations are primitive. But the user's point about needing selection criteria seems fair - even primitives need instantiation principles. Still, calling this a "ranking" might be overreach.

  Other red flags: 
