prompt: |-
  so my flatmate and I lost about four hours last night to the same argument going round in circles — is a disease a biological kind or a value judgement — and I'm now fairly convinced the reason neither of us could land a blow is that we were treating it as one question when there are actually three criteria braided together: (1) is the part-function statistically below par for your reference class, (2) has some mechanism failed to do the job it was shaped to do, (3) does the thing stop you doing what your life is actually organised around. She's the naturalist, I'm not, and we both kept sliding between those three mid-sentence.

  I want a set of cases that pins them apart, so I can shove it at her.

  Three vignettes. Invented, but boringly realistic — GP surgery or outpatient clinic register, no sci-fi, no enhancements, no magic epidemiology. Four to six sentences each, completely self-contained: give ages, give the lab numbers, give the person's actual life, everything the reader needs. If you want a base rate or a diagnostic threshold, make one up and flag that you made it up. I shouldnt have to look anything up.

  They need to land like this:
  - A: a Boorse-style biostatistical theorist says disease; Wakefield's harmful dysfunction analysis says not a disorder; a Nordenfelt-style vital goals account says healthy.
  - B: the reverse of that on all three — Boorse says no, the other two say yes.
  - C: all three say no, and yet the thing gets diagnosed, coded and medicated every single day. C is the one I care about most, it's where the argument died.

  The purpose, so you know what counts as cheating: the verdicts have to be generated, not smuggled into the description. Spell out the reference class, the mechanism and the person's goals, then let the three theories rule on it. If a case only delivers its verdicts because you described it tendentiously, say that out loud instead of hiding it. And if one of the theories flatly refuses to give the verdict I asked for, don't fudge it — tell me, and give me the nearest case that does work.

  Then the analysis:
  - per case, a short paragraph for each theory: what it rules and why, and which of my three criteria is carrying the weight.
  - the full 2x2x2 grid over those criteria, all eight cells, and for each cell either a case that fills it (yours or a new one-liner) or a verdict on whether it's empty because it's incoherent or empty because nobody's bothered.
  - the naturalist's best counterattack. She's smart and she has moves — re-describing the part-function more finely, swapping out the reference class, disputing which environment is the relevant one. Give me the strongest version, aimed at whichever of the three cases it bites hardest, and tell me whether it actually rescues the verdict or just relocates the problem.

  Also: if any of these is already a stock example (I have a nasty feeling the ageing one is), say so and give me the standard reply rather than pretending you came up with it fresh.

  Last bit — tell me how confident you actually are that the three verdicts in each case come out the way you say from the theories as stated, rather than from how you happened to phrase the case, and point at the single step in the whole thing you're least sure about. I'd rather know where the wheels are loose before I take this back to her.
