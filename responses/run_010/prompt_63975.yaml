prompt: |-
  Retired last spring after thirty-eight years in sensory physiology — mostly pain scaling, magnitude estimation, that world. Now I've got time to read philosophy and I've fallen down a rabbit hole about whether you can compare one person's utility with another's. My Tuesday reading group made me present next week, so I built the following argument for the negative side, and it went over badly, because it seems to prove a lot more than I want and nobody in the room could tell me where the leak is. Maybe you can.

  (1) A number is a measurement only if there's a scale behind it: a zero and a unit that can at least in principle be calibrated against something.
  (2) For a claim comparing A's utility and B's utility to be true or false rather than merely expressive, there has to be a single scale on which both sit. Otherwise "A's gain outweighs B's loss" isn't a claim, its a noise.
  (3) Calibrating a shared unit would require something that pins both intensities down at once — a common reference whose experienced magnitude you can hold fixed while you read off each person's scale.
  (4) No such reference exists. Two nervous systems, two histories, no way to be inside both simultaneously. The only things you can correlate across people are behaviors: reports, wincing, choice, willingness to pay. And behavior is evidence about dispositions, not about intensity. I know this one from the inside — I watched "seven out of ten" fail to track anything stable in the same subject between Tuesday and Thursday, and that was with a trained subject and a controlled stimulus.
  (5) So interpersonal utility comparisons aren't merely unreliable, they're meaningless: there's no fact there for them to get right.
  (6) Now run the same machine inside one person across time. Me at twenty-five and me at seventy-one are, physically and psychologically, pretty nearly different organisms, and the anchor between them is exactly as absent as the anchor between me and my wife. My memories of old pains are reports — reports to myself, but reports all the same. If (4) disqualifies them there, it disqualifies them here.
  (7) So intrapersonal comparisons across time are meaningless too.
  (8) That can't stand. (7) would sink not just utilitarianism but every decision anybody makes about their own future — the brutal week of side effects taken for the remission, saving instead of spending, even the plain statement that this headache is worse than the one an hour ago. It would also retroactively invalidate my whole career: we compared numbers within subjects across sessions and thought we were measuring something.
  (9) Therefore (5) is false, and interpersonal comparisons are meaningful after all.

  So: where does it break? I'm not sure whether there's a specific slide hiding between two of these steps — an equivocation, or a standard smuggled in from somewhere it doesn't belong — or whether the thing is valid and I just have to swallow one of the premises I find attractive. Walk me through the candidates and price them. Two things I especially want pressed on:

  First, (6). Is there anything about a single persisting organism — one body, one memory chain, first-person access to both ends — that genuinely supplies the anchor two organisms can't have? If yes, does that same feature do any residual work in the interpersonal case, given that my wife and I share a species, a pain circuit layout, and roughly one environment? Or is (6) just a bad analogy that I dressed up in lab clothes?

  Second, (2). I built my career on the assumption that a number without a calibration procedure is decoration. Am I importing a metrology standard from the physical sciences that utility was never supposed to satisfy — is there a route to comparability that gets you something usable without ever producing a shared zero and unit? If so, sketch what such a route looks like, and tell me plainly what it commits me to and what it gives up, because "it's ordinal but we can still add it up" is the kind of move I want to see the receipts on.

  For what it's worth, if you make me choose I'd rather keep (4) than (9). Forty years of looking at data has made me allergic to uncalibrated scales. But I'd rather hear that my argument is bad and why than that it's fine.
reasoning: |-
  Okay, let me try to work through this retired sensory physiologist's problem. He's built this argument against interpersonal utility comparisons that ends up also invalidating intrapersonal comparisons across time, which he finds unacceptable since it would undermine his whole career in pain scaling. He wants to know where the leak is in his reasoning.

  First, I need to understand his argument step by step. He starts with what seems like a solid metrology principle: measurement requires a scale with zero and unit that can be calibrated. Then he applies this to utility comparisons, arguing that without a common scale, such comparisons aren't factual claims. The key move is in step 4 - he says we can't calibrate across individuals because we lack a common reference point, and behavioral evidence only shows dispositions, not intensities. 

  This is where his expertise in sensory physiology comes in - he's seen how "seven out of ten" pain ratings can be unstable even for the same person over short periods. When he extends this to interpersonal comparisons, he concludes they're meaningless. But then in step 6, he applies the same logic to a single person over time - young him and old him are practically different organisms, with memories serving as unreliable reports. This leads to the absurd conclusion that even intrapersonal utility comparisons are meaningless.

  He recognizes this can't be right - it would invalidate everyday decisions and his entire career. So he feels forced to conclude that interpersonal comparisons must be meaningful after all.

  Now, where does this go wrong? Let me think about his two main concerns. First, about step 6 - is there something special about a single persisting organism that allows for meaningful comparisons over time? The continuity of consciousness, memory, and being the same physical entity might provide that "anchor" he finds missing between two people. Even if memories are imperfect, they're not equivalent to reports between different people. There's a first-person persistence that bridges the temporal gap.

  Second, about step 2 - is he applying physical science metrology standards too strictly to utility? Utility might not need the same calibration as physical quantities. We can establish comparability through revealed preferences and behavioral consistency without needing a universal zero and unit. The key is whether preferences are stable enough to support ordinal comparisons that we can pragmatically treat as cardinal for decision-making.

  The biggest leak seems to be in step 4 and 6 - he's equating interpersonal and intrapersonal cases when they're fundamentally different. Within a person, there is continuity that provides calibration through memory and identity. Between people, we can establish rough comparability through shared biology and behavior, even if imperfect. His career wasn't invalidated because within-subject comparisons across sessions do track something real, even if noisy - the stability comes from the subject being the same person, not from perfect measurement.

  I should also challenge his step 2 - does comparability really require a single scale? We might accept interpersonal comparisons as meaningful but approximate, based on our best evidence from behavior and neuroscience. They're not "decorative" just because they lack perfect calibration. His pain scaling work shows that while ratings are imperfect, they're not arbitrary - they correlate with physiology and guide treatment.

  The solution might be to reject the binary he sets up in step 5 - utility comparisons aren't meaningless just because they lack perfect calibration. They can be meaningful but uncertain, based on evidence we have. This preserves both his career and everyday decision-making without forcing him to accept perfect interpersonal comparability.
answer: |-
  Your argument is rigorous and exposes genuine philosophical tensions, but it breaks down at step (6) due to a critical disanalogy between interpersonal and intrapersonal cases. The flaw cascades into step (2), where your metrological standard is over-applied. I’ll walk through the breakdown, press on your two focal points, and propose a resolution that preserves (4) without forcing you into (9).

  ### Where the Argument Fails: Step (6) and the Intrapersonal Anchor
  **Step (6) equivocates on "anchor."** You claim the anchor between "you at 25" and "you at 71" is as absent as between you and your wife. This ignores three constitutive features of intrapersonal identity that supply a functional anchor:
  1. **Causal Continuity:** Your 71-year-old self is *physically and psychologically continuous* with your 25-year-old self via a chain of causal connections (brain states, memory traces, biological aging). Two distinct organisms lack this diachronic unity.  
  2. **First-Person Authority:** While memories are imperfect, they aren’t merely "reports to yourself." They are *constitutive* of your identity. When you recall a past pain, you’re not inferring from behavior (as with others) — you’re accessing a direct (if degraded) experiential link.  
  3. **Unified Agency:** You *are* both temporal stages. Decisions like enduring chemo side effects are made by a single agent binding past, present, and future selves into one narrative. No analogous "fusion of agents" exists interpersonally.  

  **Does this anchor extend to the interpersonal case?** No. Shared biology (pain circuits, species) or environment provides *evidence* for rough comparisons but not a constitutive anchor. You and your wife might have similar pain thresholds, but her "7/10" remains *her* calibration, not yours. The intrapersonal anchor is metaphysical (identity); interpersonal "anchors" are empirical (correlation). Thus, (6) fails as an analogy.

  ### The Problem with Step (2): Overstrict Metrology
  Your premise that measurement requires calibration against a physical reference is valid for *extensive magnitudes* (mass, length) but misapplied to utility, an *intensive magnitude*.  
  - **Extensive magnitudes** (e.g., length): Additive, measurable with shared units.  
  - **Intensive magnitudes** (e.g., utility, pain): Non-additive, anchored to subjective states.  

  **Utility comparisons don’t require a "single scale" in the physical sense.** We can have meaningful comparability without cardinal units:  
  1. **Ordinal + Behavioral Stability:** If Person A consistently chooses outcome X over Y *and* their behavior under pain/stress correlates predictably with physiological markers (e.g., cortisol, neural firing), we can map their utility *ordinal structure* to Person B’s if both show similar behavioral/biological patterns. This doesn’t give "A’s utility = 2×B’s," but "A’s loss exceeds B’s gain" if:  
     - A avoids a loss more vehemently than B pursues a gain, *and*  
     - Their avoidance/pursuit intensities align across contexts.  
  2. **Revealed Preference + Common Currency:** When people make trade-offs (e.g., money vs. pain), *willingness-to-pay* can serve as a proxy for intensity. If A pays $100 to avoid a stimulus and B pays $10 for the same stimulus, we infer A’s disutility is greater — **not because dollars are a "true unit,"** but because money is a *common behavioral metric* we accept pragmatically.  

  **What this commits you to:**  
  - **Anti-realism about absolute intensities:** Utility isn’t a "thing in the head" with cardinal values.  
  - **Pragmatism about comparisons:** We use behavioral consistency + biological proxies to build *intersubjectively stable models*.  
  - **Contextual validity:** Comparisons are meaningful only under specific conditions (e.g., similar cultures, stimuli).  

  **What it gives up:**  
  - Precise cardinal comparisons ("A’s pain is 6.2×B’s").  
  - Transcontextual validity (your "7/10" headache vs. my "7/10" divorce).  

  ### Resolving the Paradox: Salvaging Your Career Without Embracing (9)
  Your career isn’t invalidated because:  
  1. **Intrapersonal comparisons are anchored** (as above). Your subjects’ pain ratings across sessions tracked *relative changes within their own ordinal framework*. Even if "7/10" drifted, the *ordering* (headache < broken bone) was stable enough for clinical/practical purposes.  
  2. **Within-subject calibration *did* exist:** The "controlled stimulus" (e.g., a 45°C thermal probe) provided a *repeatable physical reference* for each subject. Though responses varied day-to-day, the *range* of responses to that probe anchored their personal scale.  

  Thus:  
  - **Intrapersonal comparisons are meaningful** (rejecting (7)) due to identity continuity.  
  - **Interpersonal comparisons are "meaningful" pragmatically** (rejecting (5)’s "meaningless") but not metaphysically rigorous. They’re *inferences* from behavior/biology, not direct measurements.  
  - **Premise (4) stands:** Nervous systems are isolated. Behavior is evidence for dispositions — but dispositions *are what utility is made of*.  

  ### Why This Works
  - **Saves your career:** You measured *dispositional responses* to stimuli within subjects. The drift you observed wasn’t "failure" but data about noise in self-report.  
  - **Avoids absurdity:** Deciding to endure chemo is anchored by your unified agency.  
  - **Preserves your allergy to uncalibrated scales:** Utility isn’t "measured" like temperature; it’s *modeled* from behavior. We accept uncertainty but don’t retreat to silence.  

  ### The Receipts on "Ordinal but Addible"
  Ordinal utilities can be aggregated *if* we assume:  
  1. **Linear comparability:** Gains/losses affect welfare similarly across people (e.g., $100 matters less to a billionaire).  
  2. **No interpersonality curve:** Marginal utility of money isn’t exponential for one and logarithmic for another.  
  This is a *practical postulate*, not a truth. We use it because:  
  - Societies need decision rules (e.g., cost-benefit analysis).  
  - Empirical work (e.g., on income-life satisfaction) shows rough stability.  
  **You’re right to demand receipts:** This move is normative, not scientific. But it’s not arbitrary — it leverages observed regularities in human behavior.  

  ### Conclusion: The Fix
  - **Reject step (6):** Intrapersonal identity provides an anchor; interpersonal cases lack it.  
  - **Revise step (2):** Meaningful comparisons require *pragmatic intersubjective stability*, not a physical scale.  
  - **Modify step (5):** Interpersonal comparisons are *fallible inferences*, not meaningless noises.  

  This keeps your hard-won skepticism about calibration while letting you say, "This policy’s benefits outweigh its costs" without philosophical guilt. Your career was built on probing the limits of measurement — this resolution honors that rigor without surrendering to silence.
