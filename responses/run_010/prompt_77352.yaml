  For the "Continuity objection": a steelman would argue algorithms just *automate* the press's abstraction, making phantom-production efficient. To resist this, the user must show profiles aren't *addressed* (like print) but *extracted*—datafied behavior isn't "speech." If they can prove that, the distinction holds. 

