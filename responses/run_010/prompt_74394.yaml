prompt: |-
  You're a philosopher of history and social ontology who is also genuinely comfortable with counterfactual semantics and interventionist causal modeling — that combination is the whole point, since half our group is historians and half are forecasters and nobody speaks both languages. Think hard before you answer, and please do the brainstorming explicitly: first dump the candidate requirements you'd consider (however many, including ones you'll reject), then prune, then give me the final spec. I care much more about the pruning than the dump.

  Context. I'm coordinating a small working group — six people, about two years of part-time effort — whose deliverable is not a book about anyone. It's a written framework for adjudicating claims of the form: this outcome depended on this particular person vs. this outcome was over-determined by the structure. We want to be able to take a real case (would there have been a Nazi Germany without Hitler; would Soviet industrialization have gone the same way without Stalin; would Singapore have turned out as it did without Lee Kuan Yew; would relativity have happened without Einstein, given how many people were circling it) and say what would have to be true for any answer to that question to be defensible, and what kind of confidence in an answer is even licensed. Right now our arguments are stalemates where one side says the structural conditions make the individual irrelevant and the other says the structural conditions were there for everyone and only one guy acted. Neither side has stated what they think a good theory owes them.

  So: write the desiderata. Give me the list of requirements any adequate account of individual-vs-structural historical explanation has to meet in order to be usable by us, and for each one give the case or consideration that motivates it. Then mark each as non-negotiable or as a prejudice belonging to a particular camp — great-man enthusiasts, the longue-durée structuralists, and the people who think counterfactual history isn't history at all and should be dismissed rather than constrained. I want you to be opinionated about which of the things people demand here are real requirements and which are just one side's taste dressed up as method.

  Specifically, I want you to include and evaluate at least these, though don't feel limited to them:

  - whether the account has to license numeric probabilities over counterfactual outcomes, or whether ordinal/confidence-band output is all anyone can honestly claim;
  - whether it has to say what the relevant similarity metric between the actual and counterfactual worlds is, and how fine-grained that metric has to be for a historian to actually apply it;
  - whether it has to avoid trivializing long-horizon counterfactuals — call it the drift problem: perturb anything at all, run the clock thirty years, and every world differs from every other world, so any long-range counterfactual comes out trivially true and tells you nothing;
  - whether it has to handle the multiple-discovery cases (several people independently converging) and the reverse cases (an idea available and ignored for decades) without special pleading;
  - whether it has to be applicable with only the evidence historians actually have — surviving documents, no experiments, no controls, heavy selection on outcomes — rather than in an idealized setting;
  - whether it has to give a principled account of what counts as the same position or role, since "who would have been in his place" depends on how you individuate the place;
  - whether it has to distinguish an outcome not occurring from an outcome occurring differently — delay, milder form, different agent, different timing — because almost nobody actually claims the counterfactual world is empty of the thing.

  Two homegrown proposals we keep fighting about, which I want you to explicitly rule in or out as genuine requirements rather than treat charitably by default:

  1. The substitution audit. For an individual X occupying position P at time t, the core measurement target is replaceability: how many and what quality of alternative occupants of P would have produced outcomes that are relevantly similar, judged before the fact rather than after. Some of us think this is the whole theory in one number. Others think it's circular, because you can't assess the alternatives without already assuming how much individuals matter.

  2. Order-invariance. A framework should return the same verdict whether you hold the structure fixed and vary the person, or hold the person fixed and vary the structure. If the verdicts come apart, one of the two factors is doing the real explanatory work and the framework is smuggling in a prior. Is that a requirement, a theorem you can derive from something better, or a category mistake?

  Then the part I most want: tell me which subsets of your requirements are jointly unsatisfiable. I strongly suspect that (a) licensing numbers, (b) surviving the drift problem, and (c) working with only real historical evidence can't all be had at once, and if you agree I want to know which one gets dropped and what the framework looks like afterward. If some other pair is the real conflict, say that instead — the list itself being a negative result would be a fine outcome for us. And identify the single requirement that knocks out the most existing approaches, on both sides: name it, and say what it excludes.

  Finally, and briefly — one paragraph each, no more — how a Carlyle-style great-man account, a structuralist account of the Tolstoy-or-Carr flavor, and an interventionist/causal-modeling account do against your list. That's the only scoring I want; the criteria are the deliverable. No citations, no bibliography, no reading list — I can't chase sources and I'm not asking you to. Commit to an ordering and defend it instead of hedging with "it depends on the case," since the entire point is to write down what it depends on.
reasoning: |-
  Hmm, this is an intricate request about historical explanation frameworks. The user wants a rigorous set of requirements for adjudicating individual-vs-structural causality in history, with explicit pruning of candidate criteria. They're coordinating a small interdisciplinary group stuck in methodological stalemates.

  First, I need to unpack their core pain points: historians and forecasters speaking different languages, counterfactual semantics vs structural determinism debates, and unstated epistemological assumptions derailing discussions. The deliverables must handle real cases (Hitler, Stalin, Einstein) while clarifying what makes an answer defensible.

  Key tensions in their examples:
  - The substitution audit seems circular for determining individual impact
  - Order-invariance might be impossible or category error
  - Probability claims vs historical evidence limitations
  - Defining "same position" without circularity

  For requirements, I'll consider:
  1. Must handle drift problem (long-horizon counterfactuals)
  2. Must work with sparse historical evidence
  3. Must define position/similarity metrics
  4. Must handle multiple discoveries/non-discoveries
  5. Must distinguish outcome variants
  6. Must avoid requiring numeric probabilities
  7. Must be applicable to concrete cases
  8. Must not require substitution audit circularity
  9. Must not demand impossible order-invariance

  The big incompatibility triad: 
  - Numeric probabilities require unrealistic evidence
  - Surviving drift needs coarse-grained similarity
  - Historical constraints forbid hypothetical data

  Therefore: numeric probabilities must be sacrificed. Confidence bands are the realistic compromise.

  Most exclusionary requirement: "Define similarity metric at operational grain." This knocks out both great-man theories (vague counterfactuals) and crude structuralism (indeterminate position definitions).

  Scoring existing approaches:
  - Carlyle-style: Fails on evidence, similarity, drift, and multiple discovery criteria. Too focused on exceptionalism.
  - Carr/Tolstoy structuralism: Fails on position definition and outcome variation. Overcorrects into determinism.
  - Interventionist modeling: Best fit if modified - drops numbers, adds explicit similarity constraints. Handles most requirements except circularity in substitution audit.

  The framework should output confidence bands, not numbers, and focus on necessary/sufficient condition analysis with explicit similarity thresholds. This bridges the historian-forecaster divide while acknowledging evidentiary limits.
answer: |-
  Below is the distilled list of requirements for your framework, derived from explicit pruning of candidate desiderata. I first dump all considered criteria (including rejected ones), then prune based on coherence constraints, then present the final spec with motivations and classifications. Finally, I address incompatibilities and score existing approaches.

  ---

  **1. Dump of Candidate Requirements**  
  *(Motivations implied; rejected items italicized)*  
  - **R1:** Must avoid requiring numeric probabilities (drift problem + evidence limits)  
  - **R2:** Must define a non-arbitrary similarity metric for outcomes (e.g., "Nazi Germany" vs. "authoritarian Germany")  
  - **R3:** Must constrain drift in long-horizon counterfactuals (e.g., Hitler’s absence not implying alien invasion by 1945)  
  - **R4:** Must handle multiple discoveries (relativity) and non-discoveries (ignored innovations) symmetrically  
  - **R5:** Must operate with incomplete historical evidence (no experiments, survivor bias)  
  - **R6:** Must define "position" non-circularly (e.g., Stalin’s role vs. generic dictator)  
  - **R7:** Must distinguish outcome absence from variation (e.g., "no industrialization" vs. "slower industrialization")  
  - **R8:** *Must output numeric probabilities* (rejected: incompatible with R1, R3, R5)  
  - **R9:** *Must satisfy order-invariance* (rejected: category mistake; structures/agents co-constitute)  
  - **R10:** *Must include substitution audit as core* (rejected: circular; assessing alternatives presupposes structural constraints)  
  - **R11:** Must be testable via historical cases (e.g., Singapore w/o Lee Kuan Yew)  
  - **R12:** Must specify confidence levels (ordinal bands, not numbers)  

  ---

  **2. Pruning & Final Spec (6 Non-Negotiable Requirements)**  
  | **Requirement** | **Motivation/Case** | **Non-Negotiable?** | **Camp Prejudice Addressed** |  
  |----------------|---------------------|---------------------|------------------------------|  
  | **R1: Ordinal confidence only** | Drift problem (Nazi Germany); evidence limits. Numeric probabilities require unrealistic data. | **Yes** | Forecasters’ overreach |  
  | **R2: Defined similarity metric** | "Soviet industrialization" could mean speed, method, or scale. Must specify grain (e.g., "heavy industry by 1940"). | **Yes** | Structuralists’ vagueness |  
  | **R3: Bounded drift** | Long horizons amplify noise (e.g., Einstein’s absence → relativity delayed ≠ relativity never). Must anchor to proximate causes. | **Yes** | Counterfactual skeptics’ dismissal |  
  | **R4: Handle discovery/non-discovery** | Relativity had multiple pursuers; penicillin languished. Framework must explain both without ad-hoc factors. | **Yes** | Great-man enthusiasts’ cherry-picking |  
  | **R5: Evidence-constrained** | Historians can’t rerun Stalin’s purges. Must work with archives, survivor bias, no controls. | **Yes** | Forecasters’ idealization bias |  
  | **R7: Outcome variation ≠ absence** | "No Hitler" might mean a weaker Nazi party (variation), not no authoritarianism (absence). | **Yes** | Binary thinking in both camps |  

  **Rejected Candidates:**  
  - **R8 (Numeric probabilities):** Violates R1, R3, R5. Licensing numbers demands impossible data.  
  - **R9 (Order-invariance):** Structures/agents interact dialectically; varying one independently is incoherent (e.g., "Stalin in 1920s France" is meaningless).  
  - **R10 (Substitution audit):** Circular. Defining "alternative occupants" (e.g., who replaces Lee Kuan Yew?) assumes prior structural knowledge.  

  ---

  **3. Incompatibilities**  
  - **Jointly Unsatisfiable Triad: R1 (no numbers) + R3 (bound drift) + R5 (real evidence)**  
    - **Conflict:** Bounding drift (R3) requires coarse-grained similarity metrics (R2), but real evidence (R5) often lacks resolution for even ordinal confidence (R1).  
    - **Resolution:** **Drop R1’s strict ordinality** → Allow *confidence bands* (e.g., "low/medium/high") conditional on R2’s similarity grain.  
    - **Framework After:** Outputs qualitative confidence in counterfactuals (e.g., "High confidence industrialization occurs without Stalin, but low confidence same methods used") based on R2+R3+R5.  

  **Most Exclusionary Requirement:**  
  - **R2 (Defined similarity metric)**. Knocks out:  
    - *Carlyle-style accounts:* Vague "greatness" ignores outcome specification.  
    - *Crude structuralism* (e.g., Carr): Indeterminate on what counts as "same" outcome.  

  ---

  **4. Scoring Existing Approaches (1 Paragraph Each)**  
  - **Carlyle Great-Man Theory:** Fails R2 (no outcome similarity metric), R4 (ignores multiple discoveries), R5 (overrelies on biography). Outputs false confidence in individual necessity (e.g., "No Einstein → no relativity") but useful for narrative tension. **Weakest fit.**  
  - **Carr/Tolstoy Structuralism:** Fails R2 (outcomes underspecified), R7 (equates variation with absence), R4 (struggles with non-discovery cases). Strong on R5 but collapses nuance (e.g., "Stalin irrelevant due to industrialization logic"). **Partial fit, lacks precision.**  
  - **Interventionist Modeling:** Best on R3 (bounds drift via interventions), R4 (models discovery paths), R7 (distinguishes effects). Weak on R5 (idealizes evidence) unless modified per above. **Strongest foundation** if adapted to ordinal bands + historical constraints.  

  **Order:** Interventionist > Structuralism > Great-Man. Interventionism uniquely handles R3-R4-R7; others fail ≥3 requirements.  

  ---  
  **Deliverable Core:** A framework specifying (1) outcome similarity grain, (2) confidence bands for variation (not absence), (3) discovery/non-discovery pathways, using evidence-consistent causal templates. This breaks stalemates by forcing explicit "what would count as same?" from both sides.
