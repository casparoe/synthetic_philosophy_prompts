  ### Joint Statement: Agreed Claims  
  1. **Purpose of Mechanism Talk**: Our goal is to detect deviations in a deployed AI model's internals from an audited reference that could indicate hidden risks (e.g., adversarial tampering, emergent failures, or deception), even if current behavior appears normal.  
  2. **Identity is Interest-Relative**: Mechanism identity is not purely objective; it depends on stakeholder interests (e.g., safety auditors care about robustness, developers care about maintainability).  
  3. **Behavioral Equivalence ≠ Mechanism Identity**: Identical task behavior on a fixed evaluation set is insufficient to establish mechanism identity; internal differences may still pose risks.  
  4. **Causal Structure is Relevant**: Both camps agree causal structure (e.g., connectivity, information flow) is a necessary input for mechanism analysis.  
  5. **Interventionist Methods are Useful**: Counterfactual probing (e.g., "what if input X changed?") is a valid empirical tool for comparing mechanisms.  
  6. **Granularity Matters**: Mechanism identity must be evaluated at a specified level of abstraction (e.g., neurons vs. layers vs. subcircuits).  

