  Potential pitfalls to avoid: Don't let students retreat to esse est percipi; don't allow generic chartalism discussions; ensure the case study can't be answered without engaging Berkeley's specific framework. The model answer should model metacognition about where Berkeley's premises "run out."
answer: |-
  Here is the complete final exam question package designed to meet your specifications, focusing on the tension between Berkeley's metaphysics and his functional monetary theory through an original case study:

  ### (1) Exam Question
  **SECTION A: ESSAY (Answer ONE question; 25 marks; time allowed: 75 minutes)**

  **Question:**  
  Consider the following monetary scheme implemented in the fictional town of 'Oakhaven':  
  *   Oakhaven issues paper notes as its sole currency.  
  *   These notes lose 2% of their face value each month unless the holder purchases a small "circulation stamp" from the Oakhaven Town Bank.  
  *   The notes are strictly prohibited from being used or held outside Oakhaven's district boundaries.  
  *   The Oakhaven Town Bank issues these notes solely against the security of deeds to productive local farmland, valued conservatively.  

  Berkeley argues that money’s real value lies in its capacity to *circulate* and mobilize labour, not in any intrinsic material substance (asserting trusted paper is as good as gold/silver for this purpose). He contends that hoarded money is economically useless, and that true wealth consists in the power to set labour in motion. Some scholars further claim Berkeley’s view prefigures ‘chartalism’ – the idea that money’s status and value stem fundamentally from what it is accepted *for* (e.g., discharging debts or taxes) by a governing authority, rather than its material composition.

  **Assess what Berkeley’s *core premises* about money (as outlined above) would commit him to regarding the Oakhaven scheme.** Where do his premises provide clear support for or criticism of specific features of Oakhaven’s system? Crucially, **does evaluating Oakhaven reveal Berkeley’s monetary theory as necessarily an application of his immaterialist metaphysics, or is it best understood as a functional argument about economic activity that a materialist could consistently endorse?** What evidence within the logic of his monetary arguments themselves (rather than simply invoking 'no material substance') would settle this question either way?

  ---

  ### (2) Model Answer (Approx. 700 words)

  Berkeley’s core monetary premises, emphasizing circulation, the irrelevance of intrinsic material value, the futility of hoarding, and wealth as command over labour, provide a distinctive lens through which to evaluate Oakhaven’s scheme. His premises would likely lead him to endorse key aspects of Oakhaven while raising critical questions about others, and crucially, they reveal his monetary theory as primarily functional, potentially severable from his immaterialism.

  Oakhaven’s deliberate design to penalize hoarding via the monthly depreciation stamp aligns perfectly with Berkeley’s core tenet that money’s value lies solely in its motion through the economy, mobilizing labour and industry. He repeatedly queries whether money, like blood, loses its vital function if it stagnates (cf. Queries on circulation and stagnation). The stamp acts as a perpetual spur to circulation, directly operationalizing Berkeley’s view that inactive money is economically dead. Similarly, the issuance against local farmland security resonates with his emphasis on tying money to real, productive assets capable of supporting labour – he asks pointedly whether wealth depends on metal or on land, labour, and industry (cf. Queries on land banks and real wealth). This contrasts with a purely metallic reserve, which Berkeley saw as inert and unproductive. The rejection of gold/silver supremacy is explicit in his functional equivalence claim.

  However, Berkeley’s premises generate significant tensions with other Oakhaven features. The strict prohibition on notes leaving the district directly contradicts Berkeley’s vision of money facilitating wider trade and national prosperity. He queries extensively how Ireland can develop its trade and employ its people, implicitly requiring money that can function beyond parochial boundaries. Oakhaven’s isolationism turns its currency into a purely local token, potentially hindering the broader circulation and industry Berkeley champions. Furthermore, while land security is good, the *strict prohibition* on external use means the money’s acceptability is entirely dependent on Oakhaven’s authority within its borders. This raises the chartalist question: Is Oakhaven money valuable *only* because the town says so and enforces its use locally?

  This is where the crux lies: Is Berkeley’s functionalism necessarily grounded in immaterialism? Evaluating Oakhaven suggests *not*. The features Berkeley would support (anti-hoarding, land backing, paper over metal) and critique (isolationism) stem from *functional economic reasoning* about what promotes or hinders industry and circulation. The stamp’s effectiveness or the land security’s adequacy as backing are questions about economic incentives and trust, resolvable empirically within a materialist framework. A materialist could agree that forcing circulation through demurrage (the stamp) stimulates activity, that land is a better backing than inert metal, and that isolating currency is counterproductive – all without denying the physical reality of paper, land, or labouring bodies. Berkeley’s arguments here hinge on observable consequences for employment and production, not on the ontological status of substances. His assertion that money is a "ticket" or "counter" is fundamentally about its *role* in facilitating exchange and commanding labour, a role defined by social convention and utility, not by its lack of material being.

  The chartalist claim finds support in Berkeley’s focus on authority and acceptance. He queries whether the state has a crucial role in establishing and regulating money (cf. Queries on national banks and state oversight). Oakhaven’s scheme is intensely chartalist: the money exists and functions *only* because the town authority mandates and sustains it within its domain. Berkeley’s emphasis on "credit" and trust aligns with chartalism’s focus on social/political acceptance. However, Berkeley’s functionalism *limits* pure chartalism. For him, acceptance isn't arbitrary; it must be underpinned by mechanisms ensuring the money reliably commands labour and facilitates real industry. Oakhaven’s land backing provides this, but its isolationism undermines it by restricting economic potential. Berkeley’s core criterion is always whether the scheme *works* to mobilize labour, not just that it is decreed.

  Ultimately, settling whether Berkeley’s monetary theory is independent of immaterialism rests on its *argumentative structure*. His critiques of hoarding, fetishism of metal, and neglect of circulation rely on observations about economic stagnation or dynamism, not appeals to the non-existence of matter. His positive proposals (land banks, paper money, mechanisms for circulation) are justified by their anticipated effects on employment and production – effects a materialist economy also seeks. While his immaterialism might make him more comfortable with non-material tickets, the *force* of his monetary arguments derives from functional economic logic accessible to a materialist. Oakhaven highlights this: its merits and flaws are judged by Berkeley on functional grounds applicable to any economy, regardless of its underlying metaphysics. The premises run out when faced with questions about *why* the ticket works – Berkeley needs social trust and authority (chartalism), but his metaphysics doesn’t provide unique answers here that functional arguments lack.

  ---

  ### (3) Marking Scheme (Total: 25 marks)**

  | **Criterion & Must-Hit Points**             | **Marks** | **Common Pitfalls (Botches)**                                                                 | **What Separates First (21-25) from 2:1 (16-20)**                                                                                                                                                |
  | :------------------------------------------ | :-------: | :------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Analysis of Oakhaven via Berkeley's Premises:** Accurately applies stated Berkeleyan principles (circulation key, hoarding bad, paper=metal, wealth=labour command) to specific features of the case (stamp, land backing, isolation). Shows where he would support/criticize & **why** based on his logic. | **7**     | Simply lists features or Berkeley's views without connecting them. Misapplies premises (e.g., says isolation helps circulation). Superficial "supports stamp, criticizes isolation" without *why* based on his principles. | **1st:** Sophisticated, nuanced application showing *tension* (e.g., land backing good *but* isolation contradicts wider circulation goal). Explains *mechanism* (e.g., *how* stamp enforces circulation principle). **2:1:** Correct application but less depth/connection; may miss one feature or tension. |
  | **2. Core Interpretation Debate (Metaphysics vs. Functionalism):** Explicitly addresses whether monetary theory is an *application* of immaterialism or an *independent functional argument*. Engages with the question of what *within the monetary logic itself* settles this. Avoids merely restating *esse est percipi*. | **7**     | Ignores the debate or conflates it. Assumes monetary theory *must* derive from immaterialism without argument. Only discusses metaphysics generally, not its specific link (or lack thereof) to money arguments. | **1st:** Clearly argues for functional independence using *evidence from monetary logic* (e.g., arguments based on observable economic effects, not ontology). **2:1:** Recognizes the debate but argument is weaker, less evidenced from monetary logic, or leans too heavily on general metaphysics. |
  | **3. Evaluation of Chartalism Claim:** Assesses the claim that Berkeley prefigures chartalism (money=state acceptance/use) using the Oakhaven case. Discusses both support (e.g., local enforcement) and limits (e.g., functional need for labour mobilization beyond mere decree) based on Berkeley's stated premises. | **5**     | Simply agrees/disagrees without using the case. Reduces chartalism to "paper money." Fails to use Berkeley's premises (e.g., labour command) to evaluate the *limits* of chartalism within his view. | **1st:** Nuanced evaluation showing how Oakhaven exemplifies *and* challenges pure chartalism *through Berkeley's functional lens* (e.g., acceptance necessary but not sufficient without labour mobilization). **2:1:** Correctly identifies chartalist elements but less developed on the functional limits or connection to case specifics. |
  | **4. Synthesis & Case-Interpretation Link:** Integrates analysis of the specific Oakhaven case with the broader metaphysical/functional interpretation debate. Uses the case *as evidence* for resolving the core question. Avoids treating case analysis and interpretation as separate sections. | **4**     | "Nails case, drops interpretation" or vice-versa. Case analysis is isolated from the core debate. Interpretation is abstract, not grounded in how the case reveals the logic. | **1st:** Seamlessly uses analysis of Oakhaven features (e.g., stamp, isolation) *to demonstrate* the functional independence/limits of Berkeley's monetary logic. **2:1:** Makes both points but linkage is less organic or explicit; case is example rather than evidence for the interpretation. |
  | **5. Structure, Clarity & Precision:** Well-organized argument, clear prose, precise use of philosophical/economic concepts (e.g., circulation, chartalism, functionalism). Avoids historical trivia. Stays focused on reasoning task. | **2**     | Disorganized, vague, or overly verbose. Misuses terms (e.g., confuses chartalism with metallism). Dwells on irrelevant historical details. | **1st:** Concise, logical flow where each point builds the argument. **2:1:** Generally clear but may have minor tangents or less polished structure. |

  **Band Descriptors Summary:**
  *   **21-25 (First):** Excellent on all criteria. Sophisticated, nuanced application of premises to the case. Powerful, well-evidenced argument for functional independence using the monetary logic revealed *through* the case. Nuanced chartalism evaluation. Masterful synthesis where case analysis directly fuels the interpretation. Flawless structure.
  *   **16-20 (2:1):** Very good to good. Solid application of premises to case, perhaps missing minor nuance/tension. Clear engagement with core debate, arguing for functional independence but perhaps less deeply evidenced *from monetary logic* or slightly less compelling. Good chartalism evaluation. Good synthesis attempt, linkage present but could be tighter. Well-structured.
  *   **11-15 (2:2):** Competent but limited. Basic application of premises, may misapply one or miss key feature. Superficial treatment of core debate (e.g., mentions it but doesn't argue effectively using monetary logic). Basic chartalism mention. Case and interpretation feel separate. Adequate structure.
  *   **6-10 (Third):** Weak. Significant errors in applying premises. Little engagement with core debate beyond assertion. Neglects chartalism or case specifics. Poor structure/vague.
  *   **0-5 (Fail):** Seriously flawed. Misrepresents Berkeley or the case. Ignores core question. Incoherent.

  This question and scheme force students beyond simplistic summaries, demanding they use the novel case to probe the relationship between Berkeley's metaphysics and his economic functionalism, while rigorously evaluating the chartalist claim within his own framework. The marking scheme explicitly rewards the synthesis you identified as crucial for a First.
