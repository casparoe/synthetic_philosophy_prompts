prompt: |-
  I'm working on moral worth and want to know whether my case-by-case intuitions can be captured by a single principle. My working proposal: an act has moral worth just in case it is right, the agent is motivated by at least one of the features that make it right, and the fit between that motive and those features is neither lucky nor coincidental — it would have held across a reasonable range of nearby variations. Here are the verdicts I am trying to fit.

  (1) A restaurateur refuses to serve anything he would not eat himself, purely out of fastidiousness; he has never reflected on his customers' health. Worthy.

  (2) A wealthy man gives a large sum to a charity whose effectiveness he has studied in detail, solely to outdo a rival he despises; absent the rival he would have given nothing. Not worthy.

  (3) A clerk wants above all to do the right thing and believes that means following her office manual; her copy is corrupted, but by luck the corrupted line tells her to do what is in fact right in this instance. Not worthy.

  (4) A man pulls a child from a burning car for the exhilaration of it; had the child merely been lost in a shopping mall, he would have walked past. Not worthy.

  (5) A woman sits up all night with a distressed friend out of plain affection, with no moral reflection at all; she would have done so under many variations of the circumstances. Worthy.

  (6) A man has adopted the standing policy of doing the right thing because he finds the shame of being caught doing wrong unbearable; he identifies the right-making features accurately and tracks them reliably, so that across nearby variations he does the right thing for the right reasons. Not worthy — and this is the case my principle seems unable to rule out, since everything it asks for appears to be present.

  I know the standard dialectic here — the fetishism worry about acting from a desire to do what is right, the defense of the unprincipled but reliably decent agent, and the attempts to cash the requirement in counterfactual terms — but I want the principle itself, not a survey of the literature. So: state the principle, or the small set of candidates, that you think fits best, clause by clause, identifying which of my cases motivates each clause; say what your account yields for a case I have not listed, namely someone who has spent years training himself to desire what he judges good and now acts from those trained desires without further reflection; and tell me plainly which of my six verdicts, if any, your account cannot accommodate and which of them you would advise me to abandon.

  Lead with your bottom line in the first sentence — the principle you would endorse, or the verdict that has to go — and then give the reasoning. No preamble and no restatement of the question.
reasoning: |-
  Okay, the user is working on moral worth and has proposed a principle to capture their case-by-case intuitions. They've listed six cases with their verdicts on whether each act has moral worth. The key issue is that their principle seems to rule correctly on all cases except case (6), where it fails to deem an act as not worthy. 

  I need to start with my bottom line: I'll endorse a principle that requires the agent to be motivated by the right-making features themselves, not just reliably tracking them. For case (6), the agent acts from a desire to avoid shame, not the right-making features, so it lacks moral worth despite reliability.

  Looking at the cases: (1) works because the restaurateur is motivated by something that aligns with health (fastidiousness). (2) fails because motivation is rivalry, not charity effectiveness. (3) fails due to luck in the manual. (4) fails because motivation is thrill, not child's welfare. (5) succeeds with affection as the right motive. (6) fails because shame isn't the right-making feature.

  The user's principle includes counterfactual reliability, which is good but insufficient. The core problem in (6) is the motive's nature. The right-making features must directly motivate the agent, not just be tracked via another motive.

  For the new case: someone trained to desire what is good. If the agent now desires the good itself (e.g., helping for its own sake), it's worthy. If they desire it indirectly (e.g., to satisfy training), it's not. Motivation must align with the features directly.

  All six verdicts can be accommodated with this revised principle. The critical shift is emphasizing direct motivation by right-making features, not just reliable tracking.
answer: |-
  My endorsed principle: An act has moral worth iff it is right, the agent is motivated **directly by one or more of its right-making features** (not merely by features that reliably correlate with them), and this motivation would hold across a reasonable range of nearby counterfactual variations.

  **Clause-by-clause motivation from your cases:**
  - *Rightness requirement*: Motivated by all cases (baseline).
  - *Motivation by right-making features*: Cases (2), (3), (4), and (6) show that motivation by non-right-making features (rivalry, corrupted manual, thrill, shame avoidance) fails, even when the act is right. Case (1) is worthy because fastidiousness aligns with food safety (a right-making feature here). Case (5) is worthy because affection aligns with the friend’s welfare.
  - *Counterfactual robustness*: Cases (3) and (4) fail because motivation wouldn’t hold under variations (e.g., uncorrupted manual, non-thrilling rescue). Cases (1) and (5) succeed because motivation is stable across variations.

  **Verdict on your cases:** All six are accommodated.
  - (1) Worthy: Motivated by fastidiousness (which converges with food safety).
  - (2) Not worthy: Motivated by rivalry, not charity effectiveness.
  - (3) Not worthy: Motivated by manual compliance, not right-making features (luck breaks robustness).
  - (4) Not worthy: Motivated by thrill, not child’s welfare.
  - (5) Worthy: Motivated by affection (converges with friend’s welfare), robustly.
  - (6) Not worthy: Motivated by shame avoidance, not the right-making features themselves. Reliability is insufficient without direct motivation by those features.

  **New case: Trained-desire agent**  
  *Description*: Someone trains for years to desire what they judge good. Now they act from these trained desires without reflection.  
  *Verdict*: **Worthy** if the trained desires are *for the right-making features themselves* (e.g., they desire to relieve suffering *because it is suffering*). **Not worthy** if the desire is for "doing what I judge good" or for the *state of desiring the good* (e.g., motivated by satisfaction in acting as trained). The principle requires direct motivation by the right-making features, not a higher-order desire for conformity to goodness. Robustness matters too: if their motivation persists across variations (e.g., when no one is watching), it reinforces worth.

  **No verdict abandoned.** Your intuition about (6) is preserved: shame avoidance isn’t a right-making feature; it’s a separate motive that merely correlates with them. The agent tracks rightness reliably but isn’t moved *by* it—hence no moral worth. The added clause "directly by" blocks this counterexample.
