answer: |-
  ### Exegesis of Smith's Passage on the Impartial Spectator

  #### **1. The Role of "Real Magnitudes" and Moral Realism**  
  Smith's optical analogy hinges on "a knowledge of their real magnitudes" (visual case) and the "sense of propriety and justice" (moral case). In the visual example, we correct perceptual distortion by invoking prior *knowledge* of objects' actual sizes (e.g., knowing mountains are large despite appearing small). The phrase "real proportions" is not decorative: it implies an objective standard independent of immediate perception.  

  In the moral case, however, the corrective is the **"sense of propriety and justice"** – a sentiment cultivated through sympathy, not a sentiment-independent fact. Smith states that without this sense, "how little interest we should take in the greatest concerns of our neighbour." The moral analogue to "real magnitudes" is thus *not* a metaphysical truth but **intersubjective propriety**, derived from sympathetic engagement.  

  - **Your colleague's objection**: The analogy *is* primarily about "station and distance," and "real proportions" refers to what a **properly placed spectator would feel**. Key phrases:  
    - Optical: Imagination "swell[s] and dilate[s]" distant objects "from a knowledge of their real magnitudes."  
    - Moral: The "sense of propriety and justice ... correct[s] the otherwise natural inequality."  
    Smith avoids committing to sentiment-independent facts; propriety is a *felt* standard refined by social experience.  

  - **Costs of each reading**:  
    - *Realist reading* (your draft): Conflicts with Smith’s broader theory. *TMS* grounds morality in sympathy (e.g., I.1.1–2), not external facts.  
    - *Subjectivist reading* (colleague’s view): Preserves Smith’s anti-rationalism but risks making morality arbitrary. Smith avoids this by anchoring propriety in communal judgments ("habit and experience").  

  **Verdict**: The text supports your colleague’s reading. "Real proportions" is a *façon de parler*; the moral standard is empirical and social, not transcendent.  

  ---

  #### **2. Habit vs. Philosophy: What Each Achieves**  
  Smith distinguishes **habit** (automatic correction) from **philosophy** (theoretical awareness):  
  - **Habit/experience**: Enables us to adjust perspectives "so easily ... that we are scarce sensible that we do it." This is **practical moral competence** – e.g., instinctively weighing others’ interests fairly.  
  - **Philosophy/reflection**: Needed to *understand why* we correct our perspectives: "to convince us, how little interest we should take in the greatest concerns of our neighbour" without propriety.  

  **What we are convinced of**:  
  - In optics: That distant objects *would* appear tiny without imagination compensating via size-knowledge.  
  - In morals: That we *would* be selfish without the sense of justice.  

  **Your students’ misreading**: Smith does *not* say philosophy is needed to *be* moral. Habit alone suffices for everyday virtue. Philosophy merely reveals *how* our sentiments operate. Key phrases:  
  > "Habit and experience have taught me to do this so easily ... I am scarce sensible that I do it."  
  > "It requires ... reflection ... to convince us, how little interest we should take..."  

  **Clarification**: Ordinary people act morally via habit; philosophy explicates the mechanism.  

  ---

  #### **3. The "Equalizing Station": Optical vs. Moral**  
  - **Optical station**: "Transporting myself ... to a different station, from whence I can survey both at **nearly equal distances**." Physical equidistance enables accurate size comparison.  
  - **Moral station**: Viewing "from the place ... of a **third person, who has no particular connexion with either**." Relational neutrality enables impartiality.  

  **Disanalogy?**  
  - The optical remedy is geometric (equal spatial distance); the moral remedy is social (detachment from bias). Yet Smith calls them "pretty much in the same manner" because both achieve **cognitive neutrality**. "Equal distance" in morals is metaphorical: emotional equidistance via dissociation from self-interest.  

  **Resolution**: The difference refines – not undermines – the analogy. Spatial distance neutralizes visual bias; impersonal perspective neutralizes moral bias.  

  ---

  #### **4. The Opening Concession: Function and Implications**  
  Smith concedes that the "impartial spectator" (conscience) "cannot always alone support him." This is **not just weakness of will** but signals a structural gap: inner conviction sometimes requires **external validation**.  

  - **Where pressure shows up**:  
    - The phrase "supposed impartial spectator" hints at fallibility; conscience is constructed through sympathy (III.1.6).  
    - Later in III.3, Smith argues we need real spectators to "reinforce" the inner judge (e.g., the "man of the world" passage).  
    - The optical analogy itself implies this: size-knowledge comes from prior external experience.  

  **Role in the argument**: The concession preempts objections, showing Smith’s realism about human frailty while setting up the spectator’s *corrective* (not infallible) role.  

  ---

  #### **5. Pronoun Shift: "I" (Optical) vs. "We" (Moral)**  
  - **Optical case ("I")**: Grounds the analogy in personal, verifiable experience ("my present situation ... the little window").  
  - **Moral case ("we")**: Universalizes the process ("we can ever see," "we can ever make").  

  **Authority of the inner judge**: The shift underscores that moral judgment, while internal, is **generalizable through shared humanity**. "We" implies collective epistemic access to propriety, distancing Smith from subjectivism.  

  **Stylistic or substantive?** Both. The "I" bolsters the analogy’s credibility; the "we" asserts moral capacity as humanly universal.  

  ---

  ### Evaluation: Does the Analogy Hold?  
  Smith’s analogy is **structurally robust but imperfect**.  
  - **Strengths**:  
    - Both cases involve **corrective mechanisms** (size-knowledge/propriety) that override immediate appearances.  
    - Both rely on **perspective-shifting** to achieve objectivity.  
    - Both become automatic through **social habituation**.  
  - **Weaknesses**:  
    - Optical constancy uses empirical data ("real magnitudes"); moral constancy uses intersubjective sentiment ("sense of propriety"). This is a *disanalogy in source* but not function.  
    - Spatial distance is quantifiable; moral impartiality is qualitative. Smith acknowledges this by calling the remedies "pretty much" (not "exactly") the same.  

  **Overall**: The analogy successfully illustrates how moral judgment *operates* – not its metaphysical basis. It reinforces Smith’s core thesis: conscience is a learned capacity to transcend self-partiality, rooted in social experience. Where the text underdetermines (e.g., Q1’s realism debate), Smith prioritizes psychological plausibility over philosophical systematizing.  

  ---

  ### Handout-Ready Summary  
  - **Key takeaway for students**: Smith’s impartial spectator is not an infallible oracle but a cognitive tool honed by sympathy. The analogy to vision shows morality’s "correction mechanism," not its foundations.  
  - **Why not skip this passage?**: It grounds the "China and little finger" thought experiment by explaining *how* we construct impartiality. Without it, the inner judge seems arbitrary.  
  - **Pedagogical tip**: Stress that "habit" – not philosophy – enables virtue. Smith democratizes morality; ethics is practice, not theory.  

