prompt: |-
  ok so I'm in a seminar on lying and deception this semester and I keep circling the same question, and I want a number from you instead of a survey of who said what. Here's the claim, as tight as I can get it: whenever a speaker would be morally permitted to mislead someone into a false belief — literally true sentence, false belief caused, speaker intends it — that same speaker would also have been permitted to just lie to that person to produce the same false belief. So lying is never morally worse than an equally successful piece of misleading, and the line between what's said and what's merely implied does no independent moral work. My gut says 0.35 that that's right, my professor would probably say closer to 0.15.

  Give me your credence plus the decomposition, as a numbered list of exactly five items, one or two sentences each, with no intro and no wrap-up paragraph at the end. Items 1 through 4 are the four sub-questions your number actually hangs on, each with a rough probability for it — I'd expect at least one to be about whether assertion as such carries a special commitment (the warranty-ish view where saying something is like undertking to its truth), at least one about whether the said/implied line is even sharp enough to bear moral weight, and at least one about whether the audience's reasonable expectations soak up the whole apparent difference, but use whatever four you actually think matter.

  For item 4 I want you to work through a case I made up for my paper and tell me whether it's doing real work or whether I'm fooling myself. My sister asks if I've been seeing her ex. Version A: I say "no," it's false, but she already knows I'm a terrible source on this and discounts me, so she ends up believing the truth anyway. Version B: I say "we haven't been seeing each other," which is literally true because we've been texting every night for six weeks, and she takes my word for it and ends up holding exactly the false belief I wanted her to hold. B feels worse to me, or at the very least not better, which cuts against the claim I stated above.

  Item 5 is the combination: your final credence in the claim, which of the four sub-questions you're least confident about, and the one argument or example that would move your final number the most.
