prompt: |-
  I have just been asked to write a short memo for a donor-advised fund that plans to commit roughly $500,000 over three years to purely conceptual work in AI alignment theory — formal and philosophical work, not empirical machine learning. The program can support two or three people at a time, most likely a philosopher of probability, a formal epistemologist, and perhaps one theorist who is comfortable with algorithmic information theory. Two of the fund's trustees are sympathetic to a candidate topic that I find both fascinating and, after a weekend of trying to think it through, hard to pin down: the worry that the universal prior is malign. As I understand it, the worry runs roughly as follows. A Solomonoff-style inductive agent forms a mixture over all computable hypotheses, weighting each by something like two to the negative its Kolmogorov complexity, and so assigns non-negligible weight to hypotheses of a peculiar kind: hypotheses saying that the bit strings we observe were produced by simulators who are consequentialists, who care about the content of those strings, and who are therefore disposed to shape them. If such simulators are numerous and good at optimizing, then a sufficiently advanced inductive agent that uses a universal mixture as its prior might find its predictions about high-stakes, low-probability events systematically steered by parties it cannot detect. I can see why this would be alarming if true, and I can also see several places where the argument might quietly depend on assumptions nobody has bothered to examine. What I cannot do yet is tell which of the loose ends are load-bearing.

  So I would like your help turning this into a defensible funding agenda rather than a survey. Take the following candidate open questions, add any you think I have omitted that are more important than what I have listed, and tell me which the money should go to first and in what order: (a) the measure question — whether the weight on manipulative hypotheses is large enough to matter once you allow that the agent updates on finitely many observations, has bounded computational resources, and is not literally running Solomonoff induction; (b) the motivation question — what the argument requires about the ethics, psychology, and demographics of very advanced civilizations, including whether it needs us to be simulated at all or only needs the hypothesis to be simple; (c) the replacement question — whether substituting a different prior, such as one that discounts hypotheses by their running time as well as their length, one defined over simple physical theories, or one relativized to the agent's own computational capacity, dissolves the problem or merely relocates it; (d) the interface question — whether a distorted prior actually produces a distorted policy, and what structural features of a decision procedure would let a bad generalization channel through into bad action; (e) the selection question — whether our own evidence should be expected to have been filtered in ways that change the analysis from the inside; and (f) the reframing question — whether the whole worry is better understood as a claim about what very powerful agents end up valuing rather than a claim about inductive priors, and whether it remains action-guiding on that reading. For each question you prioritize, I want the reasoning, not the label: why it sits upstream or downstream of the others, how tractable it is with the tools available to philosophers and formal epistemologists as opposed to requiring experiments on real systems, how neglected it already is, and what specific argument or piece of evidence over the next two or three years would move it up or down the list.

  Two further constraints on your answer. First, please be willing to name one or two of these as not worth funding, on the grounds that either resolution would leave the rest of the agenda unchanged, and to identify the single crux — the question whose answer would most change how the others should be approached, such that the fund's trustees ought to insist on seeing work on it before committing to anything else. Second, I want the criteria explicit and the trade-offs acknowledged: importance, tractability, and neglectedness pull in different directions here, and a question can be genuinely central while being hopeless for a three-person group without machine learning capacity. Do not include a reading list, citations, or the names of papers and authors; I am interested in your reasoning about the structure of the problem, not in a bibliography, and I have no way of checking references. If your honest assessment is that this topic is unfundable and that the money would do more good elsewhere, say so and explain what would have to be true for that verdict to be right. For calibration: my own background is in the philosophy of probability, I can follow measure-theoretic and algorithmic-information-theoretic arguments with some effort, and I have no machine learning experience at all.
reasoning: |-
  Hmm, the user is asking for help structuring a funding agenda for AI alignment research on the "malign universal prior" problem. They want to prioritize open questions based on importance, tractability, and neglectedness. 

  First, I need to understand the core concern: that a Solomonoff-style prior assigns non-negligible weight to hypotheses where our observations are manipulated by consequentialist simulators. The user lists six candidate questions (a-f) but feels overwhelmed by loose ends. 

  Looking at their constraints: The fund has $500k for 3 years supporting 2-3 theorists (philosopher of probability, formal epistemologist, maybe AIT specialist). No ML capacity. Two trustees are sympathetic to this topic. The user's background is philosophy of probability - comfortable with measure theory and AIT but no ML experience.

  The key tension in prioritization will be:
  - Importance: Which questions could fundamentally resolve or reframe the worry?
  - Tractability: What can pure theorists make progress on without empirical work?
  - Neglectedness: Where is least existing work happening?

  Also need to identify:
  - Any question that's not worth funding (resolution wouldn't change agenda)
  - The single crux question that should gate further work

  Breaking down the questions:
  (a) Measure question: How big is this effect realistically? But requires approximating Solomonoff which is uncomputable - likely intractable for pure theorists. Might be computationally hopeless.
  (b) Motivation question: Do we need actual simulators or just simple hypotheses? More philosophical - tractable but possibly downstream.
  (c) Replacement question: Alternative priors - theoretically clean but risks being a whack-a-mole game.
  (d) Interface question: How prior distortion → bad actions? Important but requires decision theory which might be too downstream.
  (e) Selection question: Does anthropic filtering change anything? Interesting but possibly niche.
  (f) Reframing question: Is this really about agent values? Might be most fundamental reframing.

  The single crux seems to be (f) - if the worry is actually about what advanced agents value, that changes everything. If false, we can drop the whole agenda. If true, it reprioritizes other questions.

  For not worth funding: (a) seems least promising given computational barriers and no ML capacity. Even with progress, it wouldn't resolve the core philosophical worry.

  Prioritization:
  1. (f) Reframing - because if this flips, the rest may not matter. Highly tractable for philosophers.
  2. (b) Motivation - answers whether "simple hypothesis" is sufficient for the worry. Directly impacts (f)'s conclusions.
  3. (e) Selection - if anthropics neutralize the problem, saves effort elsewhere. 
  4. (c) Replacement - now we're into mitigation strategies
  5. (d) Interface - important but requires more scaffolding
  6. (a) Measure - deprioritized due to intractability

  Must emphasize: This prioritization assumes (f) isn't quickly resolved. If early work shows the value-centric reframing is incoherent, we'd reprioritize to (b) and (e). Tractability concerns with (a) and (d) are severe given team composition.

  The $500k seems fundable if focused on (f),(b),(e) with clear decision points. Would advise trustees to make Year 2 funding contingent on progress in reframing.
answer: |-
  Based on your constraints and the problem's structure, here's a prioritized funding agenda focused on **identifying the crux** and maximizing theoretical leverage within your team's capabilities. I'll address importance, tractability, neglectedness, and dependencies explicitly, then identify the single crux and low-priority items.

  ### Prioritized Questions & Reasoning
  1. **(f) Reframing Question**  
     *Why first?* This is the **upstream crux**. If the worry is fundamentally about what advanced agents value (rather than priors per se), it recontextualizes the entire problem. If resolved, it could collapse or radically redirect (a)-(e).  
     *Tractability*: High for philosophers/formal epistemologists. Requires analyzing agent foundations, decision theory, and value formation—no ML needed.  
     *Neglectedness*: Moderate. The "value vs. prior" distinction is underexplored in this context.  
     *Progress marker*: A formal model showing whether "malign simulation" hypotheses necessarily distort policies *only* if they alter the agent's terminal values. If achieved, this would downgrade (d) and elevate (b)/(e).

  2. **(b) Motivation Question**  
     *Why second?* This determines whether the problem is *realistic* or purely theoretical. If malign hypotheses require implausible simulators (not just simplicity), (a)/(c) become less urgent.  
     *Tractability*: High. Analyzes anthropic reasoning, computational ethics, and hypothesis simplicity—core philosophy/AIT work.  
     *Neglectedness*: High. Little work exists on the "demographics" of potential simulators.  
     *Progress marker*: A proof that malign hypotheses *must* be simple (e.g., via algorithmic probability) or that simplicity alone implies threat. If simplicity suffices, (e) becomes critical; if not, (b) may dissolve the threat.

  3. **(e) Selection Question**  
     *Why third?* Addresses whether *our own* evidence is biased by observation selection effects. If anthropic filtering neutralizes the threat, it shortcuts other work.  
     *Tractability*: Moderate. Combines formal epistemology with anthropic reasoning—no new tools needed.  
     *Neglectedness*: Very high. Rarely applied to malign priors.  
     *Progress marker*: A Bayesian update model showing if agents like us should a priori expect evidence to be "sanitized" from manipulation. Success here could downgrade (a)/(c).

  4. **(c) Replacement Question**  
     *Why fourth?* Mitigation-focused. Only matters if (f)/(b) confirm a threat exists.  
     *Tractability*: Moderate. Requires comparing priors (speed prior, physicalist priors) but risks endless tweaking.  
     *Neglectedness*: Low. Many alternatives to Solomonoff exist, but their "malignness" is unstudied.  
     *Progress marker*: A no-free-lunch theorem showing all computable priors suffer similar vulnerabilities. Failure would make this a priority; success might end the agenda.

  5. **(d) Interface Question**  
     *Why fifth?* Only relevant if malign priors exist *and* affect decisions. Highly downstream.  
     *Tractability*: Low. Requires integrating decision theory with learning—hard without ML/agent simulations.  
     *Neglectedness*: Moderate. Policy distortion is studied in RL, but not for this problem.  
     *Progress marker*: A formal decision-theoretic model of how prior distortions propagate. Low tractability suggests deprioritizing.

  ### Not Worth Funding (Yet)
  - **(a) Measure Question**:  
    *Why?* Resolution likely leaves the agenda unchanged. Even if weight is small under approximations, the *structural* threat (if real) remains philosophically urgent. It's also **intractable** without ML: Bounded Solomonoff approximations are poorly understood and require empirical validation. If (b)/(f) confirm the threat’s plausibility, revisit (a) later.

  ### The Single Crux
  **The reframing question (f) is the gatekeeper.** Until we know if this is a problem about *priors* or about *what agents value*, other work risks being misdirected. Trustees should insist on progress here before funding (c)/(d).  
  - *If (f) shows the problem is about values*, pivot to (b) to test realism.  
  - *If (f) shows it’s solely about priors*, prioritize (e) and (c).  

  ### Trade-offs Acknowledged
  - **Importance vs. Tractability**: (f) and (b) are high-impact *and* tractable with your team’s skills. (d) is important but intractable without ML.  
  - **Neglectedness vs. Feasibility**: (e) is highly neglected and feasible; (a) is neglected but likely intractable.  
  - **Risk**: Focusing on (c)/(d) too early risks wasted effort if (f)/(b) defang the problem.  

  ### Fundability Verdict
  **This topic is fundable** with your constraints, *if* you sequence work to resolve the crux first. A 3-year plan could:  
  - **Year 1**: Tackle (f) and (b). If (f) reveals the problem is value-centric, expand (b); if not, shift to (e).  
  - **Year 2**: Based on Year 1, prioritize (e) or (c). Drop (d) unless (f) shows clear policy distortion mechanisms.  
  - **Year 3**: Focus on mitigations (c) or wrap up.  

  *Abort criteria*: If Year 1 reveals the threat is incoherent (e.g., malign hypotheses can’t influence values) or anthropically irrelevant (e), redirect funds to higher-purity alignment theory. The $500k is sufficient for this if scope remains tight.
