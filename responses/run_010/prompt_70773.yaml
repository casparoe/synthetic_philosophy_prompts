  Okay, the user has had an argument with their flatmate about Harsanyi's aggregation theorem and utilitarianism. They've described a chapter that presents Harsanyi's theorem as proving utilitarianism, with equal weights being the only non-arbitrary choice. The flatmate called this "three things wearing one trenchcoat," implying something's fundamentally flawed. The user wants a line-by-line breakdown of what's accurate, what's problematic, and whether the chapter's conclusion holds after corrections.

  First, I need to recall Harsanyi's theorem accurately. The theorem states that under certain axioms—completeness, transitivity, continuity, Pareto principle, and independence—social preferences must be a weighted sum of individual utilities. The chapter seems to conflate this with utilitarianism, but utilitarianism requires cardinal utility and interpersonal comparability. Harsanyi assumes von Neumann-Morgenstern utilities, which are cardinal, but interpersonal comparability is tricky. The weights in the theorem are positive but not necessarily equal; the chapter jumps to equal weights as non-arbitrary, but that's not inherent to the theorem.

  The user mentioned the veil of ignorance. Harsanyi did use it to argue for average utilitarianism, but that's separate from the aggregation theorem. The chapter might be merging these two arguments. Also, the Pareto condition and independence might be conflated. Independence is crucial for linearity, but Pareto alone isn't enough. The chapter's claim that Rawlsians are just refusing a theorem overlooks how Rawls rejects the vNM framework itself, especially the risk attitude behind maximizing expected utility.

  The user is sympathetic to welfarism, so they might have a confirmation bias. I should point out where the chapter overreaches without dismissing their viewpoint. The flatmate's "category error" likely refers to equating a mathematical aggregation with normative utilitarianism, ignoring the axioms' normative weight. The theorem doesn't specify weights; equal weighting requires additional ethical argument. Also, utilitarianism here is about maximizing expected utility, not classical utilitarianism, which is a common conflation.

  I need to structure the response as continuous prose in British English. Start with accurate parts: axioms as named, Pareto condition. Then wince points: conflation of Pareto and independence, the jump to equal weights. Wrong parts: the theorem proves linear aggregation, not full utilitarianism; equal weights aren't automatic. The closing claim doesn't survive; Harsanyi provides a foundation, but extra arguments are needed for equal weighting and accepting the vNM rationality. Rawlsians object to the framework, not the theorem itself. So the chapter overstates by claiming utilitarianism is proven.
answer: |-
  Right, let's break down that chapter's argument as you've relayed it, line by line, from the perspective of someone steeped in welfare economics and social choice theory. I'll aim for clarity on what holds, what raises eyebrows, and where the joins in the trenchcoat might be visible.

  **"Harsanyi's theorem says that if both individual and social preferences over risky prospects are complete, transitive and continuous, and if the social ordering satisfies a Pareto condition, then social welfare has to be a sum of individual utilities."**

  *   **Acceptable:** The core axioms are named correctly: Completeness (all prospects can be compared), Transitivity (if A>B and B>C then A>C), and Continuity (small changes don't cause massive preference reversals) are standard requirements for rational preferences under uncertainty, following the von Neumann-Morgenstern (vNM) framework. The Pareto condition (if everyone prefers A to B, society must prefer A to B) is indeed a key premise. The conclusion that social preferences must be representable by a *linear sum* (a weighted total) of individual utilities *is* Harsanyi's fundamental result under these conditions.
  *   **Wince:** This statement omits a crucial axiom: the **Independence Axiom** (or something equivalent, like social preferences satisfying the vNM axioms themselves). This axiom is essential for ensuring that social preferences over lotteries are linear, which drives the additive representation. While sometimes implied by the context of "preferences over risky prospects," stating the premises without explicitly mentioning Independence (or full vNM rationality for the social ordering) is a significant oversight. It makes the Pareto condition look like it's doing more heavy lifting than it actually is. Pareto and Independence are distinct; Pareto relates to unanimity, Independence relates to how lotteries are evaluated. Both are needed.
  *   **Actually Wrong:** Nothing strictly *wrong* in this sentence *if* we assume the full vNM setup (including Independence) is implied by "preferences over risky prospects". But the omission is serious enough to mislead.

  **"That is, there is some set of positive weights on people's utilities such that the socially right prospect is just the one with the highest weighted total."**

  *   **Acceptable:** This correctly restates the mathematical implication of Harsanyi's theorem: Social Welfare = a_1 * U_1 + a_2 * U_2 + ... + a_n * U_n, with weights a_i > 0. The "socially right prospect" maximises this weighted sum. The weights are indeed positive.
  *   **Wince:** Calling the prospect that maximises this sum "socially right" already starts to slide from a *representation theorem* (describing how social preferences *must* look *if* they satisfy certain axioms) towards a *normative prescription*. The theorem says *if* you accept these axioms, social preference *is* this sum. It doesn't, by itself, tell you that maximising this sum *is* "right" in an ethical sense, though proponents argue it should be.

  **"Since utilities are already comparable on Harsanyi's setup, the weights are fixed once and for all..."**

  *   **Acceptable:** Harsanyi *does* assume interpersonal comparability of utility *differences*. This is because he uses vNM utilities. vNM utility functions are unique only up to positive affine transformations (i.e., you can change the zero point and the scale factor). Crucially, for interpersonal comparisons *to be meaningful*, the scaling must be fixed. Harsanyi's framework assumes a common scaling convention, enabling comparisons of gains and losses between people.
  *   **Wince:** Saying the weights are "fixed once and for all" is highly misleading. The theorem guarantees *existence* of positive weights, but it does *not* determine *what those weights are*. The weights depend critically on the *specific* vNM utility functions chosen for each individual (which are unique only up to affine transformation) *and* on the specific form of the social welfare function satisfying the axioms. Change the scaling of an individual's utility function, and the weight required to represent the *same* social preferences changes inversely. The weights are *relative* to the chosen utility scales.

  **"...and the only choice that isn't arbitrary is to weight everybody equally..."**

  *   **Actually Wrong:** This is a significant leap. The theorem provides *no* basis within its axioms for claiming equal weighting (a_i = a_j for all i,j) is the "only non-arbitrary" choice. Why not weights proportional to height? Or inversely proportional to income? Or favouring the worst off? The axioms (completeness, transitivity, continuity, Pareto, independence) are completely silent on how the weights should be *set*. They only tell you the social ordering must be *some* weighted sum. Choosing equal weights is an *additional, substantive ethical principle* (like impartiality or anonymity), *not* a logical consequence of Harsanyi's aggregation theorem itself. This is a crucial conflation.

  **"...which is exactly what the veil of ignorance is doing, only dressed up as a story: you don't know whose life you'll get, so you have to weight lives equally."**

  *   **Acceptable:** Harsanyi *did* use a separate "impartial observer" argument (often conflated with a veil of ignorance) to *argue for* average utilitarianism. The idea is that an impartial observer, facing an equal chance of being any person, would rationally maximise their expected utility, leading to maximising the average utility.
  *   **Wince/Actually Wrong:** This is where the "three things in a trenchcoat" becomes apparent. The chapter is conflating three distinct arguments:
      1.  **Harsanyi's Aggregation Theorem:** A representation theorem showing social preferences under risk must be a weighted sum of individual vNM utilities (Premises: vNM rationality for individuals and society + Pareto).
      2.  **Harsanyi's Impartial Observer Theorem:** A separate argument where an observer behind a veil of ignorance maximising expected utility leads to average utilitarianism.
      3.  **The Ethical Claim of Equal Weighting:** The normative assertion that individuals *should* be weighted equally in the social welfare function.
      The aggregation theorem *does not* incorporate the veil of ignorance. The veil argument is a *different justification* (itself controversial) for choosing *specific* weights (equal, leading to average utility). The chapter incorrectly implies the aggregation theorem *forces* equal weighting via the logic of the veil, which it absolutely does not. The aggregation theorem stands alone mathematically; the veil is a separate ethical thought experiment used to motivate a *choice* of weights *within* the framework the theorem provides. The phrase "exactly what the veil... is doing" is deeply misleading in this context. The veil is *not* "dressed up" aggregation; it's a different argument used to *supplement* it.

  **"The chapter then wound up by saying that Harsanyi therefore proved utilitarianism..."**

  *   **Wince/Actually Wrong:** This depends heavily on what one means by "utilitarianism".
      *   **If by "utilitarianism" you mean "social welfare is a linear sum of individual utilities":** Then yes, Harsanyi proved that this *form* is required by his axioms. This is often called "Utilitarianism" in formal social choice literature.
      *   **If by "utilitarianism" you mean "classical utilitarianism" (maximising the *unweighted sum* or *total* utility):** Then **no, he absolutely did not prove that.** The theorem only proves a *weighted* sum. Equal weighting (leading to total or average sum) is *not* derived from the theorem's axioms. It requires the *additional*, distinct ethical principle of impartiality/anonymity.
      *   **If by "utilitarianism" you mean the broader ethical doctrine:** Then definitely not. The theorem is a technical result about preference aggregation under risk. It doesn't address many core utilitarian concerns (e.g., sources of utility, scope, non-human welfare) and doesn't *prove* the ethical superiority of maximising utility sums.

  **"...and that all the Rawlsian and egalitarian fuss is really just a refusal to accept a theorem..."**

  *   **Actually Wrong and Mischaracterises Critics:** This is a profound misunderstanding of the critiques. Rawls and egalitarians do not typically reject the *mathematics* of Harsanyi's theorem (assuming they accept the vNM framework). They reject the *normative assumptions* embedded in the premises:
      *   **Rejection of vNM Rationality for Social Choice:** Rawls explicitly argues that maximising *expected* utility (the core of vNM rationality) is not an appropriate model for choosing principles of justice behind the veil of ignorance. He thinks society should be much more risk-averse (or focus on the worst-case scenario) when choosing fundamental rules, leading to his maximin principle. He rejects the Independence axiom in this context.
      *   **Rejection of Welfarism/Consequentialism:** Many egalitarians object to defining social welfare *solely* as a function of individual utilities, arguing that factors like rights, freedoms, primary goods (Rawls), or capabilities (Sen) matter intrinsically, not just instrumentally through utility.
      *   **Rejection of the Form of Interpersonal Comparability:** Some argue that vNM utilities, while cardinal, may not capture the morally relevant aspects of well-being or allow for the *kind* of interpersonal comparisons needed for justice.
      *   **Objection to Summation:** Egalitarians object to summing utilities *even if* comparable, precisely because it can ignore the *distribution* of utility (e.g., vast inequality might yield a high sum). They prioritise equality or priority to the worst off over pure summation.
      Their "fuss" is not about refusing a mathematical truth; it's about rejecting the normative framework upon which the theorem is built and the ethical implications drawn from it.

  **"...so the interesting question is only how to apply it in practice."**

  *   **Wince:** If "it" refers to the *mathematical form* (weighted sum), then yes, application involves estimating utilities and weights. But this glosses over the massive normative debates swept under the rug by the chapter's flawed reasoning. If "it" refers to utilitarianism with equal weights, as implied, then this dismisses the entire foundational debate as settled, which it most certainly is not.

  **What Harsanyi's Theorem Actually Establishes (Once Premises Are Correct):**

  Harsanyi's Aggregation Theorem rigorously demonstrates this: *If* individual preferences and social preferences over lotteries all satisfy the axioms of von Neumann-Morgenstern rationality (Completeness, Transitivity, Continuity, Independence), *and* the social preference respects the Pareto principle (Unanimity), *then* the social preference ordering can be represented by a social welfare function that is a *linear*, weighted sum of the individuals' vNM utility functions: W = Σ a_i * U_i, with a_i > 0.

  **What Extra Argument is Needed to Reach the Chapter's Claim:**

  To get from Harsanyi's theorem to the chapter's punchline ("utilitarianism proved, equal weights the only non-arbitrary choice, Rawlsians just refusing maths"), several crucial and highly contentious additional steps are required:

  1.  **The Ethical Acceptance of vNM Rationality for Society:** One must accept that it is normatively compelling for *society as a whole* to evaluate risky social prospects using the expected utility calculus (i.e., obeying the Independence axiom). This is far from self-evident and is a major point of contention (especially for Rawls).
  2.  **The Ethical Acceptance of Strong Welfarism:** One must accept that individual vNM utilities are the *only* relevant information for social evaluation (welfarism) and that they capture morally significant well-being adequately.
  3.  **The Justification for Equal Weights:** One must provide a separate, convincing *ethical* argument (e.g., based on impartiality, anonymity, fundamental equality) for why the weights a_i *must* be equal. The aggregation theorem itself provides zero grounds for this. Harsanyi's *veil of ignorance argument* is one attempt to provide this justification, but it is distinct from the aggregation theorem and itself relies on accepting vNM rationality *behind the veil*.
  4.  **The Interpretation of "Utilitarianism":** One must define "utilitarianism" primarily as the maximisation of a linear sum of utilities (with the weight choice being a secondary implementation detail). Historically and philosophically, classical utilitarianism is strongly associated with the *unweighted* sum (Bentham's "everybody to count for one, nobody for more than one"), which the theorem does not mandate.

  In essence, Harsanyi provides a powerful and elegant *mathematical framework* within which utilitarian-like aggregation *must* occur, *if* you accept his premises. However, the theorem does not *prove* the ethical truth of utilitarianism. It shows what form social preferences must take *conditional* on accepting a specific, contestable set of axioms about rationality and unanimity under risk. The chapter you describe significantly overreaches by conflating the theorem with the veil argument, misrepresenting the determinacy of the weights, dismissing substantive critiques as mere refusal of logic, and declaring a complex normative debate settled. Your flatmate's "three things in a trenchcoat" analogy – the aggregation theorem, the veil argument, and the ethical claim of equal weighting being presented as one seamless "proof" – seems a rather apt diagnosis of the category error at play.
