prompt: |-
  Had a proper argument with my flatmate last night that went on until about 2am and we still haven't settled it, so I'm outsourcing it. I'm auditing a welfare economics seminar at another department and this week's reading had a chapter in it — some edited collection, I've not got it in front of me, but it was clearly written by somebody competent — and the chapter summarised Harsanyi's aggregation theorem in a way I now can't stop thinking about. Roughly it went like this: Harsanyi's theorem says that if both individual and social preferences over risky prospects are complete, transitive and continuous, and if the social ordering satisfies a Pareto condition, then social welfare has to be a sum of individual utilities. That is, there is some set of positive weights on people's utilities such that the socially right prospect is just the one with the highest weighted total. Since utilities are already comparable on Harsanyi's setup, the weights are fixed once and for all, and the only choice that isn't arbitrary is to weight everybody equally — which is exactly what the veil of ignorance is doing, only dressed up as a story: you don't know whose life you'll get, so you have to weight lives equally. The chapter then wound up by saying that Harsanyi therefore proved utilitarianism, and that all the Rawlsian and egalitarian fuss is really just a refusal to accept a theorem, so the interesting question is only how to apply it in practice.

  My flatmate's line was that this is "three things wearing one trenchcoat" and that the chapter's punchline is a category error. He wouldn't say more than that, which is infuriating, because on the face of it the paragraph reads smoothly and I couldn't spot the join. For what it's worth I'm broadly sympathetic to welfarism anyway, so I'd rather like the chapter to be right, which is probably a reason not to trust my own judgement on it.

  So: can you go through it line by line and tell me what an economist or a philosopher working on this would accept as stated, what they'd wince at, and what is actually wrong — including whether the axioms are named and characterised correctly and whether a Pareto condition and an independence condition are being run together. Then tell me whether the closing claim survives correction, i.e. what Harsanyi's theorem does establish about utilitarianism once you've got the premises right, and what extra argument would still be needed to reach the view the chapter says is proved. Please don't send me a reading list or a bibliography, I've got no way of looking any of it up this week. Continuous prose only, no headings, bullets, bold or tables, the way you'd write a letter, and in British English.
