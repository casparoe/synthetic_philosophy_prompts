answer: |-
  ## National Personhood Registry: Continuity Adjudication Procedure (Version 1.0)

  **Purpose:** To determine whether the individual presenting at a checkpoint is, for legal purposes, the same person as the individual who enrolled in the synthetic neural tissue replacement program. This determination governs legal continuity for wills, directives, licenses, marriages, and liabilities.

  **Key Definitions (Plain Language):**
  *   **Psychological Continuity:** The connectedness of memories, intentions, personality traits, skills, and self-identification over time. It’s the thread linking past and present mental states.
  *   **Disposition Signature Divergence (DSD):** A percentage score (0-100) measuring how much the patient’s current temperament, preferences, and reasoning patterns differ from their baseline at enrollment. Lower = more similar.
  *   **Interval Test:** A test where the patient must accurately recall a specific, unrecorded event from before the program, verified by one other living witness who knew about the event.
  *   **Retained Procedural Skill:** The ability to correctly perform a specific task (e.g., playing a piece on an instrument, a complex knot) that the patient learned before the program and has not practiced since.
  *   **First-Person Report:** The patient’s own answer to the direct question: "Do you consider yourself to be the same person who enrolled in this program?"
  *   **Recognition Testimony:** Statements from two individuals ("Intimates") who knew the patient well before the program, answering: "Do you recognize the individual before you as the same person you knew before the program began?"
  *   **Snapshot:** A complete digital record of the patient's neural state at a specific past session, enabling restoration to that exact state.
  *   **Rollback:** Restoring a patient to a state recorded in a past Snapshot.
  *   **Duplicate Instantiation:** The creation of two or more active, simultaneous instances derived from the same patient's neural state at a single point in time.

  **I. Evidential Weight Ranking & Treatment of Inputs**

  1.  **Interval Test (Highest Weight):** Directly tests core psychological continuity – the ability to access and accurately report a unique autobiographical memory. Failure strongly suggests a break in the thread of personal identity. *Always required if possible.*
  2.  **Recognition Testimony (High Weight):** Reflects social continuity – how those who knew the person best perceive persistence of identity through observable traits and behaviors. Disagreement between intimates is significant evidence.
  3.  **Disposition Signature Divergence (DSD) (Moderate Weight):** Measures aggregate similarity/difference in core psychological traits. Useful trend data, but a single score is less informative than change over time or correlation with other factors. High scores (>15%) are warning signs.
  4.  **Retained Procedural Skill (Low Weight):** Tests a specific, isolated memory trace. Success shows some persistence of very old learning but is too narrow to strongly support overall identity continuity. Failure is ambiguous (could be simple forgetting).
  5.  **First-Person Report (Discard as Evidence):** **Stop treating this as evidence.** Reason: A person's belief about their own identity is deeply subjective and easily influenced by suggestion, neurological changes, or a desire for consistency. It provides no *independent* verification of actual continuity. A positive report is expected and uninformative; a negative report is exceptionally rare and likely indicates profound psychological distress or dysfunction needing clinical attention, not an objective identity break. **Reviewing Court Justification:** "Self-identification is a deeply held internal state, not an objectively verifiable fact about psychological continuity. It cannot reliably distinguish between true continuity and a compelling illusion of continuity created by the procedure itself or underlying pathology. Reliance on it would make the adjudication process circular."

  **II. Adjudication Procedure (Step-by-Step Flow)**

  **Note:** Always consult session logs first for cumulative replaced fraction, complications, and snapshot history. Assume inputs are available unless otherwise noted in protocol (Section IV).

  1.  **Check for Duplicate Instantiation:**
      *   *Question:* Is this case triggered *solely* by a duplicate instantiation event?
      *   *Sufficient Answer (Yes):* Proceed to Step 1a. *Sufficient Answer (No):* Proceed to Step 2.
      *   *1a. Duplicate Protocol:*
          *   *Question:* Which instance has remained continuously active since the branching event, interacting with the physical world and the original life context?
          *   *Sufficient Answer:* The instance meeting the above criterion. Certify continuity ONLY for this instance.
          *   *Failure:* If both instances meet the criterion equally (e.g., both activated simultaneously in identical hardware), or neither does (e.g., both purely simulated). Terminate: Refuse certification for ALL instances derived from the branching point. The original person is considered discontinued.
          *   *Termination Point:* Certification (Original Instance) or Refusal (All Instances).

  2.  **Interval Test Failure:**
      *   *Question:* Did the patient fail the Interval Test at this checkpoint? (Failure = unable to recall the event OR provides a detailed but incorrect account contradicted by the witness).
      *   *Sufficient Answer (Yes - Failure):* Terminate: Refuse certification of continuity. A core thread of memory continuity is broken.
      *   *Sufficient Answer (No - Passed):* Proceed to Step 3.

  3.  **DSD Threshold Exceeded:**
      *   *Question:* Is the current DSD ≥ 15% OR has the DSD increased by ≥ 10 percentage points since the last checkpoint?
      *   *Sufficient Answer (Yes):* Strong warning sign. Proceed to Step 4.
      *   *Sufficient Answer (No):* Proceed to Step 5.

  4.  **Recognition Testimony Conflict:**
      *   *Question:* Do the two Intimates disagree in their Recognition Testimony? (One says "yes, same person", the other says "no" or equivocates significantly).
      *   *Sufficient Answer (Yes - Conflict):* This indicates a significant rupture in social continuity, corroborating the DSD warning. Terminate: Refuse certification of continuity.
      *   *Sufficient Answer (No - Agreement):* Agreement mitigates the DSD concern. Proceed to Step 5. (Note: Agreement can be both positive or both negative - a double negative would have been caught at Step 2 or 3).

  5.  **Aggregation & Cumulative Replacement:**
      *   *Question:* Is the cumulative replaced fraction ≥ 100% AND has the patient failed at least one Interval Test within the last 5 checkpoints OR last 10 years (whichever is shorter)?
      *   *Sufficient Answer (Yes):* The combination of high replacement volume and recent memory discontinuity is compelling. Terminate: Refuse certification of continuity.
      *   *Sufficient Answer (No):* Proceed to Step 6.

  6.  **Certification Threshold:**
      *   *Question:* Have Steps 2, 3, 4, and 5 all been passed without triggering a Termination/Refusal?
      *   *Sufficient Answer (Yes):* Terminate: Certify continuity.
      *   *Sufficient Answer (No):* (Should not occur if steps followed correctly; implies missing inputs). Proceed to Step 7 (Handoff).

  7.  **Handoff to Human Judgment (Values Conflict):**
      *   *Trigger:* The procedure reaches this step only if critical inputs are missing or ambiguous (see Section IV Protocol), preventing a mechanical decision, OR if Steps 2-5 passed but profound concerns exist not captured by inputs (e.g., Case 1 spouse petition).
      *   *Values Conflict:* The conflict is between **Legal Certainty & Finality** (requiring a clear, rule-based decision now) and **Maximizing Accuracy in Ambiguity** (acknowledging deep uncertainty and potentially delaying decision or seeking more evidence, which may not be possible).
      *   *Resolution:* The panel must deliberate and vote based on the *preponderance of available evidence*, explicitly stating the ambiguity. The determination must be issued. *There is no "undecided" outcome.* This is a factual finding under uncertainty, not a values choice per se. The panel resolves it.

  **III. Aggregation & Checkpoint Structure**

  *   **Checkpoint Frequency:** Mandatory checkpoint before session 10, then every 50 sessions or 5 years (whichever comes first), and at any duplicate instantiation, major complication, rollback, or specific request from the patient, clinic, or registry.
  *   **What a Checkpoint Can Detect:**
      *   Significant *current* breaks in memory (Interval Test failure).
      *   Significant *current* shifts in core psychology (High/Spiking DSD).
      *   *Current* social perception of change (Recognition Testimony conflict).
      *   *Current* status of an old procedural memory (Skill test).
      *   Aggregate replacement volume to date.
  *   **What a Checkpoint Cannot Detect (Structurally):**
      *   **Gradual Drift:** Slow, incremental changes accumulating below the DSD or Interval Test detection thresholds over many sessions/checkpoints.
      *   **Cumulative Effect without Recent Failure:** High cumulative replacement (>100%) without a recent, specific failure event (like an Interval Test fail).
      *   **The "True" Threshold:** It cannot pinpoint the exact session or percentage where "identity" was lost, if loss is gradual. Identity persistence is a matter of degree evidenced by connections; the procedure sets practical thresholds for legal discontinuity.
  *   **Cumulative Replacement & Determinacy:** The cumulative replaced fraction exceeding 100% is not *in itself* dispositive. Identity continuity depends on the *preservation of psychological connections*, not the physical substrate. The procedure answers the question: "Given the evidence available at this checkpoint, is there sufficient psychological continuity to warrant legal continuity?" It emits a binary output: **Certify Continuity** or **Refuse Certification**. If gradual drift leads to discontinuity without triggering a specific test failure, the procedure may incorrectly certify continuity until evidence of a break emerges (a limitation). We write the output honestly as the factual finding based on the defined thresholds: "Continuity Certified" or "Continuity Not Certified (Discontinuity Found)". We do not claim it finds a metaphysical truth.

  **IV. Protocol for Missing/Problematic Inputs**

  *   **No Living Witness for Interval Test:** Skip Step 2. Proceed to Step 3. The absence of this key test significantly weakens the evidence for continuity. Aggregation (Step 5) cannot use "Interval Test failure within X time" as a criterion. High DSD or Recognition conflict gains relatively more weight.
  *   **Intimates Contradict Each Other:** Handle at Step 4. A conflict is significant evidence against continuity.
  *   **Intimates Unavailable/Insufficient:** Proceed without Recognition Testimony. Skip Step 4. This reduces evidence weight, particularly for corroborating DSD warnings or social continuity. Rely more heavily on Interval Test and DSD.
  *   **Incomplete Session Logs:** If cumulative fraction cannot be reliably calculated, Skip Step 5. Proceed based on current checkpoint evidence (Steps 2, 3, 4) and Handoff (Step 7) if necessary. This is a serious data integrity issue; note it prominently.
  *   **Snapshot Baseline Missing:** If the baseline DSD battery for a snapshot used in rollback was never run, DSD comparisons for the reverted individual are invalid. Use DSD only for comparisons *after* the rollback date, relative to the (now missing) post-rollback baseline. Interval Test and Recognition for the reverted state become crucial.
  *   **DSD Unavailable:** Skip Step 3. Proceed to Step 4 (Recognition) and Step 5 (Aggregation). Lack of objective trait measurement weakens evidence.

  **V. Duplicate Instantiation Rule**

  *   **Defensibility:** The rule **is defensible** on the operationalized account of identity (psychological continuity + causal dependence). Psychological continuity is inherently branching-sensitive. Creating a duplicate severs the unique, non-branching causal path required for numerical identity. Two identical persons cannot both *be* the original; the continuity of the original is broken by the split.
  *   **Duplicate Case Questions (Step 1a):** As defined in Step 1a: "Which instance has remained continuously active since the branching event, interacting with the physical world and the original life context?" Certification applies *only* to the instance meeting this criterion.

  ---
  **Case Application**

  **Case 1: The Long Course & The Spouse's Petition**
  1.  **Duplicate?** No. Proceed.
  2.  **Interval Test Failure?** **YES.** Failed once (confabulation contradicted). *Terminate: Refuse Certification of Continuity.*
  *   **Determination:** Continuity Not Certified (Discontinuity Found).
  *   **Why Unwanted?** The patient has strong self-identification, mostly stable DSD, intact skill, and one intimate affirms continuity. The spouse's feeling "something is gone" resonates but isn't direct evidence. The *Interval Test failure* is the mechanical trigger. Refusing certification invalidates wills/directives made after the failure (or potentially earlier, depending on appeal/court ruling on timing) and complicates the marriage dissolution (which may now proceed on different grounds). It feels harsh after 31 years, but the procedure flags a verified memory break.

  **Case 2: The Parallel Instance**
  1.  **Duplicate?** **YES.** Triggered by parallel instantiation.
  2.  **1a. Duplicate Protocol:** The original instance remained active in the patient's body, interacting with the world for 70 minutes. The parallel instance was terminated after a simulated comparison. *Sufficient Answer:* The original instance. *Terminate: Certify Continuity* for the original patient instance. The duplicate instance is denied certification and is terminated.
  *   **Determination (for Original Patient):** Continuity Certified. (The duplicate instance is not certified and ceases to exist).

  **Case 3: The Rollback**
  1.  **Duplicate?** No (Rollback, not simultaneous duplication). Proceed.
  2.  **Interval Test?** Assume passed for the *reverted* state (continuous with snapshot). Clinic must run test relative to snapshot date/enrollment. Proceed.
  3.  **DSD?** Likely low (compared to snapshot baseline). Proceed.
  4.  **Recognition?** Intimates would likely affirm continuity with the *snapshot era* person, not the pre-rollback person. Assume agreement affirming the reverted state. Proceed.
  5.  **Aggregation?** Cumulative replaced fraction is irrelevant for the reverted individual (starts from snapshot). Proceed.
  6.  **Certification Threshold?** Steps 2-5 passed. *Terminate: Certify Continuity* for the reverted individual *as the person from the snapshot date*.
  *   **Determination:** Continuity Certified (for the individual as of Snapshot Date X).
  *   **Intolerable Consequence:** The plea agreement and will executed *after* the snapshot date but *before* the rollback were executed by a person (the pre-rollback state) who is now *discontinued*. Legally, the reverted person is not that individual. The plea agreement is likely voidable ("the defendant no longer exists"), creating a legal nightmare for the state. The will's beneficiaries face a challenge as the testator (the pre-rollback person) is also discontinued. The court will find the *legal nullification of the recent plea deal* particularly intolerable, as it undermines finality and potentially releases a defendant (conceptually, though the reverted person might face new charges). The procedure mechanically certifies the reverted entity's continuity with its past (the snapshot), not with the more recent past.

  ---
  **Candor Section**

  1.  **Judgment Disguised as Mechanical:**
      *   **Step 3 (DSD Threshold):** Setting the thresholds (15% absolute, 10% increase) is a judgment call. A panelist wanting a specific outcome could argue for slightly different thresholds. *(Room: Moderate - requires panel discussion/justification if challenged)*.
      *   **Step 5 (Aggregation Trigger):** Defining "recent" failure (5 checkpoints/10 years) is judgment-based. A panelist could argue for a stricter (e.g., 3 checkpoints) or looser (e.g., 15 years) window. *(Room: Moderate)*.
      *   **Step 7 (Handoff):** Defining "profound concerns not captured" or weighing ambiguous/missing evidence during Handoff is pure judgment. *(Room: Significant - the entire decision rests on panel deliberation)*.
      *   **Missing Inputs Protocol (Section IV):** Deciding how to proceed when inputs are missing involves judgment on the relative importance of the missing data in the specific context. *(Room: Significant)*.

  2.  **Questions Quietly Declined:**
      *   **"What is the Self?":** The procedure completely sidesteps the philosophical question of what constitutes a "self" or "person" metaphysically. It answers a practical, legal question about sufficient psychological continuity for specific purposes.
      *   **"When Exactly Did Continuity Break?":** It does not pinpoint a moment of loss, only that evidence of discontinuity exists *now* or at a branching point. It cannot resolve gradual drift into discontinuity without a triggering event.
      *   **"Is the New Entity Worthy of Rights?":** It certifies or denies legal continuity, not the inherent moral status of the entity presenting. The moral question is assumed settled by the legal framework establishing the registry.

  3.  **Expected Failure Points:**
      *   **Gradual Drift (Most Common):** Patients undergoing very long courses with small, frequent sessions are most likely to experience cumulative psychological change below detection thresholds for many checkpoints, leading to certification of continuity even when significant drift has occurred. The procedure is weakest here.
      *   **High Cumulative Replacement without Recent Failure:** Certifying continuity in a patient with >150% replacement but passing all recent tests will feel intuitively wrong to many, even if mechanically correct. The spouse's feeling in Case 1 exemplifies this.
      *   **Rollback Consequences (Case 3):** The legal fallout from rollbacks, especially when significant legal acts occurred in the "lost" period, is highly problematic and likely to generate appeals and demands for legal reform, regardless of the mechanical continuity finding for the reverted entity.
      *   **Ambiguous Recognition Testimony:** Intimates giving vague or conflicted answers ("same, but different") force a judgment call (Handoff) that is hard to defend objectively.
      *   **Lack of Interval Test Witness:** Severely weakens the most objective test, increasing reliance on noisier measures (DSD, Recognition).
