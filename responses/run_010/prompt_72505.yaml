  First, I should map each required topic to a question while maintaining logical flow. The residue problem seems urgent - if transparent lies aren't wrong, why do we feel uneasy? That could be Q1. For endorsement types, I need to set up a trilemma: actual/hypothetical/idealized each create problems. The cultural question must avoid stereotyping - maybe focus on inferential burden vs norms.

  For non-paradigmatic cases like children, I wonder if the hearer's deliberative capacity matters. And for bluntness, could refusing to speak become its own form of control? The Kant question needs to test if her view mandates truth-telling to murderers. Finally, the abandonment question should force her to name falsifiable criteria.

