answer: |-
  ## Fellowship Proposal: Reflexive Rights and Cooperative Governance

  **1. Central Question**  
  Can a rights framework where individuals select their *own publicly defensible descriptions* of protected actions (a) resolve Sen-style conflicts between unanimity and liberalism in small-group collective choice, while (b) avoiding triviality (where unanimity requires no action) or vacuity (where no collective action is possible), under a formal model of description spaces and publicity constraints?

  **2. Why Existing Positions Leave It Open**  
  The strongest objection holds that descriptional autonomy merely *relocates* Sen’s conflict:  
  - **Gibbard-style critics** argue rights should be tradable or waivable to ensure coherence. They might contend that your publicity constraint forces a *meta-choice* over descriptions, replicating the original coordination problem at the description-selection stage. If households must unanimously accept *each other’s* chosen descriptions to avoid contradiction, the unanimity requirement effectively swallows the protection, collapsing into the first horn of your dilemma.  
  - **Nozickians** might argue that side-constraints require fixed boundaries *ex ante* to define feasible sets; allowing *ex post* description-choice conflates the right itself with its exercise, inviting strategic description-tailoring that undermines the constraint.  

  Your proposal escapes these *only if* the publicity constraint allows non-unanimous, non-traded agreement on mutually tolerable descriptions *without* requiring identical preferences over descriptions. Existing work assumes fixed descriptions, so this dynamic remains unexplored.

  **3. Method & Example**  

  **Months 1–3:** Formalize the model.  
  - Define a finite set of households \(N\), social states \(S\), and a "description space" \(D\) (e.g., {"gardening style", "noise level", "visual impact"}).  
  - Each household \(i\) has:  
    - A preference ordering \(\succ_i\) over \(S\).  
    - A *choice function* \(c_i: S \rightarrow D\) selecting a description for any state where \(i\) acts.  
  - **Publicity Constraint:** \(i\)’s \(c_i\) must satisfy: For any two states \(s, s'\) differing *only* in \(i\)’s action, if \(c_i(s) = c_i(s')\), then *all* households must be indifferent between \(s\) and \(s'\) under that description.  
  - **Aggregation Rule:** Unanimity applies for any decision *not* covered by a chosen description under the constraint.  

  **Months 4–6:** Analyze small cases. **Example:**  
  - **Households:** Alice (A), Bob (B), Clara (C).  
  - **Issue:** Alice’s garden (actions: Wildflowers \(W\) or Neat Hedges \(H\)).  
  - **States:** \(s_W\) (A grows W), \(s_H\) (A grows H).  
  - **Candidate Descriptions:** \(d_1\)="Aesthetic Preference", \(d_2\)="Pollinator Habitat", \(d_3\)="Property Maintenance".  
  - **Preferences:**  
    - Alice: \(s_W \succ_A s_H\) (prefers wildflowers).  
    - Bob & Clara: \(s_H \succ_B s_W\), \(s_H \succ_C s_W\) (prefer hedges).  

  *Under Sen:* Alice is decisive over \(\{s_W, s_H\}\) → \(s_W\) wins, violating Pareto (since B&C prefer \(s_H\)).  

  *Under Reflexive Autonomy:*  
  - Alice chooses \(c_A\). To satisfy publicity:  
    - If she picks \(d_1\) ("Aesthetic"), publicity fails: Bob cares intensely about aesthetics (not indifferent).  
    - If she picks \(d_2\) ("Pollinator"), publicity *holds* if Bob/Clara acknowledge pollinator impact is Alice’s domain (they are indifferent *under this description*).  
  - Result: Alice’s choice is protected via \(d_2\). Unanimity applies only to decisions *not* describable as pollinator choices.  
  - **Divergence:** Sen forces conflict by fixing \(d_1\) as the "garden" description. Reflexive autonomy avoids conflict *if* a publicly tolerable description (\(d_2\)) exists.  

  **Months 7–9:** Generalize conditions (e.g., when does a profile admit conflict-resolving descriptions?).  
  **Months 10–12:** Test robustness (strategic description-choice? Larger \(N\)? Multiple protected domains).  

  **4. Success & Failure**  
  - **Success:** A characterization theorem showing: "If preferences satisfy [condition X] over states/descriptions, descriptional autonomy avoids Sen conflicts without triviality/vacuity."  
  - **Valuable Failure:** Proving the publicity constraint *necessarily* creates a meta-paradox (e.g., households disagree irreconcilably on acceptable descriptions), or that only trivial/vacuous protections are stable.  
  - **Proof of Failure:** Demonstrating that *for all* non-dictatorial description-selection rules, either (a) unanimity over collective actions is impossible, or (b) no non-trivial protection exists.  

  **5. Defense of Method**  
  - **Why formal, not interpretive?** The problem is *coordination under disagreement*. Interpretive arguments (e.g., "social states *should* be finely individuated") don’t specify *how* to coordinate descriptions without inviting strategic or inconsistent labeling. Formalism forces precision on publicity’s stability conditions.  
  - **Why not experimental?** While empirical work on boundary-drawing is vital, it cannot resolve whether descriptional autonomy is *logically coherent* as a conflict-resolution tool. A model must first show it *can* work before testing if it *does*.  

  **6. Scope & Risks**  
  - **Cut:** Exploration of dynamic/evolving description spaces; full game-theoretic analysis of strategic description-choice.  
  - **Likely Stuck:** Defining the description space \(D\). Too rich → vacuity (everything is protectable); too sparse → triviality. Formalizing "publicly defensible" without assuming shared values is the core challenge.  

  **7. Applied Deliverable**  
  A draft bylaws clause:  
  > "**Protected Actions:** A household may declare an action protected by asserting a publicly defensible description of its impact, provided no other household demonstrates that the description misrepresents impacts *they deem material*. Challenges trigger deliberation; unresolved challenges void protection for that decision."  

  A **usable clause** differs from a philosophical exhibit by requiring a *testable procedural standard* ("misrepresents impacts deemed material") rather than ideal conditions. Success means the clause offers a *practicable* path to resolve disputes without presuming consensus on values.  

  ---  
  **Total: ~1.5 pages**  
  This proposal isolates a precise formal gap in rights theory, grounded in a real governance failure. By month 12, we will know whether descriptional autonomy reconciles liberty and unanimity—or reveals a deeper impossibility. Either outcome advances cooperative practice.
