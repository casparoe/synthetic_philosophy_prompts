  First, I need to recall the key events: the 2015 Referendum Act, the 2016 vote (Leave won 51.9%), the government's plan to use royal prerogative, the Miller case where the Supreme Court ruled Parliament must act, the Article 50 notification in 2017, extensions, and finally leaving in 2020. Also, the ECJ's ruling that Article 50 could be unilaterally revoked.

  The user wants each step analyzed in terms of speech acts: locution, illocution, perlocution. They also want to know who the speaker is at each stage—electorate, Parliament, government, etc. Applying Austin's three-way split: what was said (locution), what was done by saying it (illocution), what effects it had (perlocution). Need to consider if some acts had no illocutionary force.

  Then, categorizing the referendum result under Searle's five illocutionary points: assertives, directives, commissives, expressives, declarations. Is it an assertive (stating a preference), a directive (instructing the government), or a failed declaration? The advisory vs. binding debate ties into Austin's infelicities—was it a misfire due to lack of conventional procedure?

  The Supreme Court's role in Miller: is their ruling like a bishop rejecting a marriage (invalidating the act) or clarifying constitutive rules? The user's coinage "illocutionary relay" needs testing—where force is split between two speakers. In Brexit, the referendum's political authority vs. Parliament's legal authority. Does this challenge speech act theory or fit within Searle's constitutive rules?

  The ECJ's revocation ruling questions if declarations can be undone. Traditionally, declarations are irreversible, but here revocation is possible under certain conditions. Does this mean it wasn't a true declaration, or do institutional rules allow for reversibility?

  Lastly, the user wants honesty about where the theory falls short. Can Austin/Searle handle a 17-million-person speaker? What about contested force versus absent force? The public debate was mostly perlocutionary (effects) rather than illocutionary (intent). Which aspects does the framework struggle with?

  Deep needs: The user and their roommate might be stuck on whether the referendum was binding or not. The user seeks a structured analysis to clarify misunderstandings. They might also want to apply philosophical concepts to real-world events, seeing how theory holds up. They’re interested in the gap between legal and political legitimacy, and how speech acts operate in complex institutional settings. Highlighting the limitations of the theory could show where real-world chaos exceeds philosophical frameworks, which might resolve their argument by showing that ambiguity was inherent in the process.
answer: |-
  Here's a speech-act analysis of the Brexit sequence, mapping each key event to Austin's locutionary/illocutionary/perlocutionary framework and Searle's categories, while addressing your core questions:

  ### 1. **European Union Referendum Act 2015 (Parliament)**
     - **Speaker:** Parliament (as sovereign lawmaker)
     - **Locution:** Text authorizing a referendum on EU membership
     - **Illocution:** *Directive* (Searle) – Instructing the government to hold a consultative procedure. An *exercitive* (Austin) – Instituting a formal process.
     - **Perlocution:** Created the legal/political framework for the vote. Crucially, it *did not* bring about withdrawal itself.
     - **Infelicity Analysis:** Felicitous but non-force-bearing for withdrawal. The act explicitly avoided being a *declaration* of exit.

  ### 2. **Referendum Result (23 June 2016)**
     - **Speaker:** The Electorate (as collective political actor)
     - **Locution:** "Leave" (51.9%) vs. "Remain" (48.1%)
     - **Illocution:** **Contentious Core**  
       - *Legally:* **No inherent illocutionary force** regarding EU membership. It was an *assertive* (Searle) reporting voter preference – a massively consequential **opinion poll**.  
       - *Politically:* Treated as a *directive* (Searle) by Leavers ("Government *must* implement this").  
       - *Constitutive Failure:* Lacked institutional backing to be a *declaration* of withdrawal (unlike a wedding vow).  
     - **Perlocution:** Immense political pressure, government resignation (Cameron), triggering of Article 50 plans, societal polarization.
     - **Infelicity:** **Misfire (Austin) as a "decision"** – No settled conventional procedure existed for a referendum *of this type* to automatically change constitutional/legal status. The "advisory" label highlighted the *gap* between political expectation and legal force.

  ### 3. **Government's Intention to Trigger Art. 50 via Prerogative (Post-Referendum)**
     - **Speaker:** Government (Executive)
     - **Locution:** "We will notify under Article 50 using prerogative power."
     - **Illocution:** *Commissive* (Searle) – Undertaking to act. *Exercitive* (Austin) – Attempting to initiate withdrawal.
     - **Perlocution:** Provoked the *Miller* litigation. Revealed the legal void around referendum authority.
     - **Infelicity:** **Abuse (Austin)?** – Asserting a power (prerogative) it arguably didn't possess for *this* effect (removing statutory rights).

  ### 4. **UK Supreme Court Judgment in *Miller* (Jan 2017)**
     - **Speaker:** The Judiciary (Interpreting constitutive rules)
     - **Locution:** "An Act of Parliament is required to notify under Article 50."
     - **Illocution:** **Verdictive (Austin) + Declaration (Searle) Hybrid.**  
       - *Not* merely "declining recognition" like a bishop.  
       - **Settling constitutive rules:** Declaring the *conditions of felicity* for the UK's "withdrawal declaration." It ruled that only Parliament (via statute) could perform the illocutionary act of *legally initiating withdrawal* because it alone could remove rights it created.  
     - **Perlocution:** Forced Parliamentary authorisation, shifted power from executive to legislature, clarified the UK's "constitutional requirements" under Article 50.

  ### 5. **Article 50 Notification Act 2017 (Parliament)**
     - **Speaker:** Parliament
     - **Locution:** Short statute authorizing notification.
     - **Illocution:** *Directive* (Searle) – Authorizing the PM to notify. *Exercitive* (Austin) – Enabling the next act.
     - **Perlocution:** Provided the legal basis for May's notification.

  ### 6. **Notification under Article 50 TEU (29 March 2017)**
     - **Speaker:** UK Crown (via PM May, acting under statute) as EU Treaty Party
     - **Locution:** Formal letter to European Council President.
     - **Illocution:** **Declaration (Searle)** – This utterance *changed institutional reality* per EU/Int'l law. It initiated the 2-year withdrawal countdown. **Felicitous:** Done by correct speaker (treaty party), via correct procedure (UK constitutional requirements met post-*Miller*), with clear uptake (EU acknowledged).
     - **Perlocution:** Started irreversible (legally/politically) withdrawal process, negotiations began, triggered further domestic political crises.

  ### 7. **ECJ Revocation Ruling (December 2018)**
     - **Speaker:** European Court of Justice (Interpreting EU Treaty rules)
     - **Locution:** "Article 50 notification can be unilaterally revoked following the member state's democratic process."
     - **Illocution:** **Verdictive (Austin) + Declaration (Searle) Hybrid.**  
       - Declared the *conditions of felicity* for reversing an Article 50 declaration.  
       - **Reconceptualizing Declarations:** Ruled that *this specific* institutional declaration was *revocable* if the speaker (member state) followed its own rules. It didn't destroy the *original* declaration's force; it defined a new, permissible counter-declaration.  
     - **Perlocution:** Theoretically enabled UK revocation, intensified Remain campaigns (politically irrelevant in the end).

  ---

  ### Analysis of Your Key Concepts

  1.  **The "Illocutionary Relay":** Brexit 2016-2019 is a **textbook example**.
      *   **First Speaker (Electorate):** Performs an *assertive* ("We prefer Leave") with immense **political legitimacy/authority** but **zero legal illocutionary force** (not a declaration, not a directive Parliament *must* obey).
      *   **Second Speaker (Parliament):** Performs the *directive* (authorizing notification) and enables the Crown's *declaration*, carrying **full legal force**.
      *   **The Gap:** The litigation (*Miller*) lived *precisely* in the space between the relay points, debating *whether* and *how* the first speaker's act could/should compel the second speaker. **Searle's constitutive rules explain this perfectly:** The relay works because the rules say "Only Parliament can utter the legally effective declaration; the referendum result is input into *their* decision-making process, not a substitute for it." The problem wasn't theoretical; it was political conflict over interpreting the rules and the referendum's *intended* force.

  2.  **Revocable Declarations & Institutional Reality:**
      *   The ECJ ruling **doesn't destroy the concept of declarations.** It clarifies the *constitutive rules* of *this specific* institutional act (Article 50 notification) within the EU treaty framework.
      *   **Declarations change reality *within a system of rules*.** The ECJ ruled that the system's rules *permitted* revocation under certain conditions. It's analogous to rules allowing a contract to be rescinded or a marriage annulled under specific circumstances. The *original* declaration was still effective in starting the 2-year clock; revocation was a *new* declaration permitted by the rules, reversing its *ongoing* legal effect (preventing exit). The *fact* of the original notification remained part of institutional history.

  ---

  ### Where the Austin/Searle Toolkit Reaches Its Limits

  1.  **The 17-Million-Person "Speaker":** The framework struggles with **collective intentionality at scale.**
      *   Austin/Searle focus on individual speakers or clearly defined institutional actors (judge, minister, legislator). A national electorate lacks a unified "intention" in the required sense. Was the illocution "We assert our preference" or "We command withdrawal"? The ambiguity is inherent and unresolvable by the theory. It treats the electorate as a single speaker *by fiat*, masking the complexity.

  2.  **Contested Force vs. Absent Force:** The framework distinguishes *misfires* (no force) from *abuses* (insincere). Brexit highlights **force that is *contested***.
      *   Was the referendum result a felicitous *assertive* with no directive force (legally correct), or an *infelicitous attempt* at a directive/declaration that misfired due to lack of rules (Leaver view), or a *felicitous directive within a political, non-legal convention* (strong Leaver view)? The tools can *describe* these interpretations but cannot *resolve* which is "correct" when the constitutive rules themselves are politically disputed. This is a **gap between legal and political constitutive rules.**

  3.  **The Perlocution/Illocution Mismatch:** Your observation is crucial. **Virtually all public/political debate centered entirely on *Perlocution*:**
      *   "What does this vote *mean* (for sovereignty, immigration, the economy)?" (Interpretation)
      *   "What *should* it *oblige* Parliament/the Government to do?" (Obligation/Mandate)
      *   "What *will* the *consequences* be?" (Effects)
      *   The *illocutionary* question – "What *kind of act* was this *as uttered*?" – was a niche legal/philosophical concern until *Miller*. The framework **misdescribes the actual social/political phenomenon** by prioritizing illocution. The *perlocutionary* effects (polarization, mandate claims, legitimacy crises) were the dominant reality, fueled by the *ambiguity* of the illocutionary act.

  **Conclusion:** The Brexit sequence is a powerful case study. The Austinian/Searlean framework excels at dissecting the *legal* chain of speech acts (Parliament's Act, Notification, ECJ ruling) and explaining the "illocutionary relay" via constitutive rules. It clearly shows why the referendum result lacked *legal* illocutionary force as a decision. However, it struggles with the electorate as speaker, cannot resolve contests over force arising from disputed rules, and significantly underplays the overwhelming dominance of *perlocutionary* struggle (meaning, obligation, consequence) in the political arena, which was the true engine of the conflict. The "advisory" label was a locutionary attempt to constrain illocutionary interpretation, but it proved powerless against the perlocutionary tsunami.
