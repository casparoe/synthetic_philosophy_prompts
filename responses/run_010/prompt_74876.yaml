  ### Game Design: **Policy Commitment Challenge**  
  This game forces engineers to experience the tension between acting on current information ("updateful") and locking in a policy in advance ("updateless"). Players face scenarios where locally optimal choices lead to globally worse outcomes due to a mechanical predictor (published rules) that sets conditions based on expected behavior. The structure mirrors real-world dilemmas like Newcomb's Problem or the stranded traveler, without naming them upfront.

  ---

  ### **Setup & Rules**  
  **Players:** 18 engineers, each acting as an independent "Agent."  
  **Materials:**  
  - Whiteboard (to display rules, track scores).  
  - Index cards (for secret decisions).  
  - Markers.  
  **Tokens:** Award points as tokens (1 token = 1 point). Winners get a "bragging artifact" (e.g., a printed certificate).  
  **Predictor Mechanic:** A published rule that sets game conditions based on players’ *first moves* (simulating a counterparty that conditions on expected behavior). No hidden dice or intuition—players can calculate outcomes.  

  **Game Structure (3 Rounds, 60 minutes total):**  
  1. **Round 1: Updateful Decisions** (15 min)  
     - Players act on current info, leading to locally optimal but globally suboptimal outcomes.  
  2. **Round 2: Precommitment** (20 min)  
     - Players bind themselves to policies in advance.  
  3. **Round 3: Updateless Policy + New Information** (25 min)  
     - Players lock in policies, then receive new information that tempts them to defect.  

  ---

  ### **Round-by-Round Script**  
  **Intro Script (Read verbatim, 2 min):**  
  > "Welcome to the Policy Commitment Challenge. You are all Agents in a simulation. Each round, you’ll face choices that earn tokens. Your goal: maximize tokens. Rules are published on the board. You’ll make secret decisions on index cards. No talking during rounds—save arguments for debrief. Payoffs are calculated instantly. Ready? Let’s begin."  

  #### **Round 1: Updateful Decisions (15 min)**  
  **Rules (Displayed):**  
  - Choose **Commit** or **Not Commit** (first move).  
  - Predictor sets state:  
    - If >50% choose **Commit**, state = **Trust** (high rewards).  
    - If >50% choose **Not Commit**, state = **Distrust** (low rewards).  
  - After seeing the state, choose **Cooperate** or **Defect** (second move).  
  - **Payoffs:**  
    - In **Trust** state: **Cooperate** = 10 tokens, **Defect** = 15 tokens.  
    - In **Distrust** state: **Cooperate** = 0 tokens, **Defect** = 5 tokens.  

  **Process:**  
  1. Players secretly choose **Commit/Not Commit** (write on cards).  
  2. Facilitator counts votes, announces state (**Trust** if majority **Commit**, else **Distrust**).  
  3. Players see state, then choose **Cooperate/Defect** (new cards).  
  4. Calculate payoffs: In **Trust**, most defect to get 15; in **Distrust**, most defect to get 5.  

  **Predictable Outcome:**  
  - Players signal **Commit** to induce **Trust**, then **Defect** for 15 tokens. But since >50% defect, state becomes **Distrust** next round.  
  - **Why it fails:** Defection locally dominates, but causes global **Distrust** (lower future payoffs). Players earn 5–15 tokens, but median is ~5 (since **Trust** collapses).  

  ---

  #### **Round 2: Precommitment (20 min)**  
  **Rules (Displayed):**  
  - You can **Precommit** to a binding policy:  
    - **Policy A:** Always **Cooperate** (no matter the state).  
    - **Policy B:** Always **Defect** (no matter the state).  
  - If >50% choose **Policy A**, state = **Trust**.  
  - If >50% choose **Policy B**, state = **Distrust**.  
  - **Payoffs (no second move—policy is binding):**  
    - In **Trust** state: **Policy A** = 10 tokens, **Policy B** = 5 tokens.  
    - In **Distrust** state: **Policy A** = 0 tokens, **Policy B** = 5 tokens.  

  **Process:**  
  1. Players secretly choose **Policy A** or **Policy B** (cards).  
  2. Facilitator counts votes, sets state based on majority policy.  
  3. Calculate payoffs.  

  **Predictable Outcome:**  
  - Players coordinate on **Policy A** to induce **Trust** and earn 10 tokens. Defectors (**Policy B**) earn only 5.  
  - **Contrast with Round 1:** Precommitment stabilizes **Trust**, raising payoffs. Median tokens: 10.  

  ---

  #### **Round 3: Updateless Policy + New Information (25 min)**  
  **Rules (Displayed):**  
  - Choose a binding policy upfront (same as Round 2): **Policy A** or **Policy B**.  
  - Predictor sets state based on majority policy (>50% **A** = **Trust**, else **Distrust**).  
  - **New twist:** After policies are locked, reveal "private info":  
    - In **Trust**, a **hidden cost** reduces **Policy A** payoffs by 3 tokens (now 7 tokens).  
    - In **Distrust**, a **hidden benefit** increases **Policy B** payoffs by 3 tokens (now 8 tokens).  
  - **Payoffs (binding, no changes):**  
    - **Trust** state: **A** = 7 tokens, **B** = 5 tokens.  
    - **Distrust** state: **A** = 0 tokens, **B** = 8 tokens.  

  **Process:**  
  1. Players choose policies (cards).  
  2. Facilitator sets state based on majority.  
  3. Reveal private info (write on board).  
  4. Calculate payoffs.  

  **Predictable Outcome:**  
  - Players who chose **Policy A** see **Trust** but regret it (7 < 15 from Round 1).  
  - Players who chose **Policy B** see **Distrust** but earn more (8 > 5 from Round 1).  
  - **Key tension:** Private info makes **Policy A** *feel* worse in **Trust**, but switching mid-game isn’t allowed. Median tokens: 7–8.  

  ---

  ### **Debrief (25 min)**  
  **Goal:** Map game moments to the core idea without lecturing. Ask questions to guide self-discovery.  

  **Questions to Ask:**  
  1. "In Round 1, you defected in **Trust** for 15 tokens. Why couldn’t you sustain **Trust**?"  
     - *Target: High short-term gain → long-term collapse.*  
  2. "Round 2 forced binding policies. How did that change outcomes compared to Round 1?"  
     - *Target: Precommitment stabilizes cooperation.*  
  3. "In Round 3, you locked in policies *before* seeing hidden costs/benefits. How did it feel to watch **Policy A** pay less in **Trust**?"  
     - *Target: Tension between local info (new costs) and global policy.*  
  4. "The predictor reacted to your *first move*. How did that simulate a ‘counterparty’ conditioning on your type?"  
     - *Target: Counterparties (like predictors) act on expectations of your behavior.*  
  5. "When have you seen this ‘updateful vs. updateless’ tension in our work? Example: Replanning mid-task when others rely on your consistency."  

  **Introduce Terms (at the end):**  
  > "What you experienced is **updateless decision theory**: evaluating choices from the perspective of your initial policy, not local information. It’s why ‘locking in’ sometimes beats ‘updating’—even when new info makes it painful."  

  ---

  ### **Predicted Failure Modes & Fixes**  
  1. **Sharp engineer reverse-engineers early:**  
     - If players guess the lesson in Round 1 (e.g., "We should precommit!"), pivot:  
       - **Fallback:** Skip to Round 3. Add a twist—allow policy changes *after* private info. Let them defect, then show how it collapses payoffs. Ask: "Did knowing the predictor’s rule change your strategy? How?"  

  2. **Energy dies in Round 2:**  
     - If Round 2 feels too easy (precommitment works), escalate: In Round 3, make private info extreme (e.g., **Policy A** = 2 tokens in **Trust**). Ask: "Would you abandon your policy now? What if others rely on it?"  

  3. **Critique: ‘This isn’t the real problem!’**  
     - If someone says, "You changed the rules to force failure," acknowledge:  
       > "Fair. Real predictors aren’t mechanical. But in our work, telemetry systems *are* rule-based. How would you design a ‘policy-first’ agent for that?"  
     - Redirect to the core: "The game’s point isn’t ‘always precommit’—it’s that the *timeframe* of evaluation matters. Where should we ‘stand’ when deciding?"  

  ---

  ### **What the Game Cannot Reproduce**  
  **Your Suspicion is Correct:**  
  The game teaches "precommit to bind yourself" (a tactic) but not the deeper concept: **evaluating choices from the initial policy’s perspective, not local information**.  

  **What’s Lost:**  
  - Updatelessness isn’t about contracts—it’s a *decision framework*. A bound agent still "updates" internally; an updateless agent doesn’t consider local info *at all*.  
  - Example: In Newcomb’s Problem, an updateless agent takes one box because that’s the policy it would precommit to, even if it *knows* the predictor is perfect. The game can’t simulate this "no update" mindset—players always see new info.  

  **How to Cover the Gap:**  
  Verbally clarify in debrief:  
  > "Binding contracts are one *tool*, but the insight is where you ‘stand’ when choosing. Should you ask, ‘What should I do now that I know X?’ (updateful) or ‘What policy would I want before knowing X?’ (updateless)? In replanning, sometimes the latter avoids self-sabotage, even without binding mechanisms."  

  **Honest Note:**  
  A room of engineers won’t *feel* the updateless mindset in 90 minutes. The game shows the *consequences* of updating, but you must verbally stress: **Updatelessness is not a trick—it’s a decision axis.** If they leave remembering "Evaluate from Day 0, not Now," that’s enough.  

  ---

  ### **Minute-by-Minute Timeline**  
  - **0–2 min:** Read intro script.  
  - **2–17 min:** Round 1 (Updateful).  
  - **17–37 min:** Round 2 (Precommitment).  
  - **37–62 min:** Round 3 (Updateless + New Info).  
  - **62–75 min:** Score tally (3 min) + Open argument (10 min).  
  - **75–90 min:** Structured debrief (15 min).  

  ---

  ### **Post-Game Artifact**  
  Convert tokens into a leaderboard. Winner gets a "Policy Guru" certificate (print pre-event). For the team: Share a summary linking game moments to your telemetry debate (e.g., "When replanning, are we the Round 1 defectors?").  

  This forces engineers to confront the updateful/updateless tension through failure—no philosophy degree needed. Run it, and let the game argue for you.
