answer: |-
  Here's a screening procedure based on the core principles you've derived from Berkeley's *The Querist*, designed for practical use by your board. I'll address each of your requests systematically.

  **Core Principle Simplified for Screening:**  
  *Does this proposal primarily move industry (work, trade, production) that would otherwise not move, without encouraging harmful hoarding?*

  **The Screening Procedure (For Coordinator & Board):**

  1.  **QUESTION 1: What specific, new industry does this proposal aim to move?**
      *   *Sufficient Answer:* Clear description of *new* work, trade, production, or service exchange the proposal enables *within the county* (e.g., "enables Farm A to buy fuel from Haulier B using mutual credit instead of waiting for cash sales," "subsidizes local spending by residents who wouldn't otherwise shop locally," "creates a new market for local artists"). Must be concrete and specific to the proposal.
      *   *Insufficient Answer:* Vague benefits ("supports the local economy," "raises awareness," "builds community"), benefits outside the county, or simply continuing existing activity more smoothly.
      *   *Source:* Primarily from proposal text. Doesn't require hard figures yet.
      *   **STOP if NO:** If no specific new industry is identified, or the answer is vague/insufficient, recommend **DECLINE**. Reasoning: Fails the core test of moving *otherwise idle* industry. Don't proceed.

  2.  **QUESTION 2: Is there a credible mechanism to *actively discourage hoarding* of the currency/credit involved?**
      *   *Sufficient Answer:* Design features like demurrage (holding cost), expiry dates, mandatory circulation rules (like the mutual credit cap reduction), or evidence that the instrument is inherently unattractive/unusable for hoarding (e.g., mutual credit balances aren't transferable like cash scrip). *Or*, a compelling argument why hoarding *this specific instrument* is unlikely or irrelevant to its purpose (e.g., the mutual credit line is purely for business-to-business trade facilitation, not personal savings).
      *   *Insufficient Answer:* Relying solely on trust, goodwill, or the peg to national currency. Statements implying hoarding is desirable (e.g., "collectible," "holds value perfectly," "acts as savings").
      *   *Source:* Proposal text + coordinator's knowledge of the instrument type.
      *   **STOP if NO:** If the proposal actively encourages hoarding (like collectibles) or lacks any mechanism to discourage it beyond the peg, recommend **DECLINE**. Reasoning: Encourages idle tickets, counter to core principle.

  3.  **QUESTION 3: Does the proposal minimize leakage of value/currency *out* of the local system?**
      *   *Sufficient Answer:* Clear boundaries (e.g., only usable within county, only specific participants), backing by local goods/services/property, or a mechanism ensuring value primarily circulates locally (like the mutual credit network). For subsidies (like the card), evidence the subsidy is captured *by local businesses*.
      *   *Insufficient Answer:* Reliance on external entities without strong local capture (e.g., national chains benefiting significantly), easily exportable/scalable value, or unclear boundaries.
      *   *Source:* Proposal text + coordinator's assessment of local impact.
      *   *Note:* This isn't an absolute "STOP", but a major risk factor. A "No" here means proceed with extreme caution.

  4.  **QUESTION 4: Is the burden/cost proportionate and does it avoid harming the most vulnerable holders? (VALUES CHECKPOINT)**
      *   *Analysis:* This is the critical point about impact on the poor. The procedure *cannot* settle this factually. It *must* be handed to the board.
          *   Identify any costs/risks to holders: Expiry? Fees? Demurrage? Complexity? Volatility?
          *   Identify who primarily holds this instrument: Low-income workers? Businesses?
          *   Does the anti-hoarding mechanism (Q2) disproportionately burden those who *must* hold (e.g., due to irregular income)?
      *   *Handover Wording:* "The proposal includes mechanisms to discourage hoarding [mention specific mechanism]. However, these mechanisms may impose costs/hardships on holders, particularly vulnerable populations paid in scrip who may need to hold balances longer. The board must weigh the benefit of moving industry (Q1) against this potential social cost. Is the mechanism appropriately designed to minimize harm to vulnerable users? **This is a values judgment for the board.**"
      *   *Source:* Proposal text + coordinator's knowledge of user base. *Do not* proceed to final recommendation without flagging this explicitly to the board.

  5.  **QUESTION 5: Is the reputational risk manageable?**
      *   *Sufficient Answer:* Low complexity for users, clear rules, strong participant vetting (for networks), clear communication plan, manageable scale, alignment with proven models, limited liability for the core program. Redemption path is clear and feasible.
      *   *Insufficient Answer:* High complexity, untested model at this scale, reliance on volatile actors, unclear rules, potential for significant losses concentrated on vulnerable users, redemption path unclear or risky.
      *   *Source:* Proposal text + coordinator's assessment of operational feasibility and community trust context.
      *   **STOP if NO:** If the reputational risk appears high and unmitigated (e.g., complex untested system targeting vulnerable users), recommend **DECLINE**.

  6.  **RECOMMENDATION:**
      *   If proposal passed Q1 (New Industry) and Q2 (Anti-Hoarding), and Q5 (Manageable Risk) is "Yes", and Q3 (Leakage) is acceptable or mitigated, and Q4 (Vulnerable Impact) has been explicitly flagged for board values judgement, recommend **FUND**.
      *   If Q1 or Q2 failed, recommend **DECLINE** (already stopped).
      *   If Q1 & Q2 passed, but Q5 failed, recommend **DECLINE**.
      *   If Q1 & Q2 & Q5 passed, but Q3 (Leakage) is a major "No" and/or Q4 (Vulnerable Impact) is severe, the coordinator should present the recommendation as **CONDITIONAL FUND / HIGH RISK / NEEDS BOARD VALUES JUDGEMENT**, clearly outlining the specific risks (leakage, vulnerable impact) for the board's decision.

  **Distinctions Kept vs. Dropped:**
  *   **Kept:** Money as ticket/counter vs. wealth (implied in Q1 - "move industry"). Idle money = failure (core of Q2). Prefer credit backed by local produce/property (part of Q3 - minimize leakage). Core question: "Does it move otherwise idle industry?" (Q1).
  *   **Dropped:** Explicit "money is not wealth" (too philosophical, Q1 captures essence). "Cost to hold" (subsumed under Q2 mechanisms, but Q4 ensures it's examined ethically). "Sound in itself" (replaced by Q5 - reputational risk). The finer points of Berkeley's arguments about precious metals vs. land-backed credit are simplified into Q3 (local leakage).

  **How the Procedure Will Systematically Get It Wrong:**
  *   **False Positives (Approves bad proposals):**
      *   Proposals that *sound* like they move new industry (Q1) but actually just displace existing activity or benefit outsiders (Q3 leakage). *Example:* A scheme that just shifts spending from one local business to another via a subsidy, without increasing *net* local activity.
      *   Proposals with clever anti-hoarding mechanisms (Q2) that are too complex or onerous, leading to low adoption or reputational damage (fails Q5 in practice, not on paper).
      *   Proposals where the "new industry" (Q1) is highly speculative or dependent on unrealistic participant behavior.
  *   **False Negatives (Rejects good proposals):**
      *   Proposals with genuine new industry potential (Q1) but unconventional anti-hoarding mechanisms the procedure doesn't recognize as valid for Q2.
      *   Proposals where the anti-hoarding mechanism (Q2) unavoidably impacts the vulnerable, but the net benefit (Q1) is exceptionally high and could be mitigated (rejected at Q4 board values stage).
      *   Proposals with moderate leakage (Q3) but exceptionally strong local industry movement (Q1).

  **Plain-Language Procedure for the Board (1 Page Max):**

  **Community Currency Proposal Screening Checklist**

  Our goal: Fund proposals that **get people working and trading locally in new ways**, **keep money moving**, **keep value local**, and **protect our hard-earned trust**.

  1.  **Does this create NEW work/trade?** (e.g., New deals between businesses, new local spending, new services offered?) *If NO or unclear: Decline.*
  2.  **Does it STOP people sitting on the money?** (e.g., Rules against large balances, time limits, fees for holding too long?) *If NO or encourages hoarding (like collectibles): Decline.*
  3.  **Does the money/value stay LOCAL?** (e.g., Only usable here, benefits local shops, not big chains?) *If LEAKS out badly: Risky, discuss.*
  4.  **COULD THIS HURT VULNERABLE USERS?** (e.g., Fees, rules that hit low-income holders hardest?) *WE MUST DISCUSS THIS FAIRNESS QUESTION.*
  5.  **Is the RISK TO OUR REPUTATION LOW?** (e.g., Simple rules, trusted partners, clear for users, small scale?) *If HIGH risk: Decline.*

  **Recommendation Path:**
  *   Fail 1 or 2: Decline
  *   Pass 1 & 2, Fail 5: Decline
  *   Pass 1, 2 & 5: OK to Fund *unless* major concerns on 3 (Leakage) or especially 4 (Harming Vulnerable) – then Board must vote on those risks.

  ---

  **Running the Procedure on Your Proposals:**

  **(a) Collectible Scrip Notes**
  1.  **New Industry?** *Maybe.* Selling art at a premium funds the program. New activity: Art sales & collecting. But does this *move essential industry* (food, goods, services)? Unclear. Focus seems on fundraising/collecting, not core circulation.
  2.  **Anti-Hoarding?** **NO.** Actively *encourages* hoarding (limited edition, scarce notes, collectible intent). This is the core design.
  3.  **Leakage?** Low. Notes spent locally like regular scrip (once collected/not hoarded).
  4.  **Harm Vulnerable?** Low direct harm (premium paid by collectors), but program resources used.
  5.  **Rep Risk?** Moderate. If notes become worthless speculation or counterfeiting target, could harm trust. "Worthless paper" risk is real if collecting bubble bursts.
      *   **Procedure Outcome:** **STOP at Q2 - Recommend DECLINE.** Fails core anti-hoarding principle. *Why Berkeley Rejects:* It turns money into a collectible object (like buried metal), encouraging idleness, not industry.
      *   *Redrafting Fix?* Remove collectibility entirely. Sell artist-designed scrip at face value. Premium is gone, but it might still be attractive. Q1 (New Industry) becomes stronger (supporting artists *and* circulation). Might pass Q1, Q2 (standard scrip), Q3, Q5. Q4 N/A. Worth doing? Yes, as local art promotion & standard scrip issuance.

  **(b) Mutual Credit Line (11 Businesses)**
  1.  **New Industry?** **YES.** Explicitly enables B2B trade among specific local businesses without cash, likely freeing up cash for other uses or enabling trade that cash flow constraints prevented.
  2.  **Anti-Hoarding?** **YES.** Cap on balances + rule forcing high-credit members to spend. Actively discourages hoarding credit.
  3.  **Leakage?** **Very Low.** Confined to specific, vetted local businesses trading local goods/services. Value stays entirely within this local network.
  4.  **Harm Vulnerable?** **Low Risk.** Businesses, not vulnerable individuals, hold the balances. The spending rule prevents excessive burden on debtors. Minor admin burden.
  5.  **Rep Risk?** **Low.** Small, closed network of known businesses. Simple rules. Software exists. Limited exposure for core program. Settlement mechanism clear.
      *   **Procedure Outcome:** Passes Q1, Q2, Q3, Q5. Q4 low risk/no major vulnerable impact. **Recommend FUND.** *Why Berkeley Approves:* Exactly the kind of locally-backed credit (by the businesses' produce/services) that moves otherwise idle industry within a community.

  **(c) Prepaid Card (5% Subsidy)**
  1.  **New Industry?** **Potentially YES.** Subsidy incentivizes spending *within the county* that might otherwise go to online or out-of-county retailers. Aims to shift local spending patterns.
  2.  **Anti-Hoarding?** **NO.** No expiry, no fee. Actively *easy* to hold indefinitely (like cash). The subsidy might even *incentivize* loading and holding until a big local purchase.
  3.  **Leakage?** **Major RISK.** Usable at national chains. Significant portion of the subsidy (5%) likely leaks to corporate profits outside the county. Depends on the chains' local sourcing, but leakage is inherent.
  4.  **Harm Vulnerable?** **Values Check NEEDED.** No direct fees/expiry helps vulnerable holders. *But:* Does the subsidy meaningfully reach *them*? Who loads the card? If loaded by middle/upper-income users, they capture most subsidy. If vulnerable users load it, the lack of anti-hoarding (Q2) means they *can* hold it, but is that bad? The core harm risk might be *inequitable subsidy distribution* and *lack of local capture* (Q3), rather than the holding mechanism itself harming them.
  5.  **Rep Risk?** **Moderate/High.** Partnership with external bank adds complexity. National chain involvement dilutes local focus. Potential for fraud/tech issues. Scale ($25k) is significant. Redemption path relies on bank/partners.
      *   **Procedure Outcome:** **STOP at Q2 - Recommend DECLINE.** Fails anti-hoarding. *However,* Q3 (Leakage) is also a major fail, and Q4 requires values discussion on subsidy equity. *Why Berkeley Would Hesitate:* Leakage drains local value; lack of anti-hoarding misses an opportunity; subsidy might not effectively target idle industry or vulnerable needs. The card itself is just a conduit for national currency with a small, leaky discount.

  ---

  **Confidence & Uncertainty:**

  *   **High Confidence (Stemming directly from your Berkeley summary):**
      *   Core Principle (Q1: Move idle industry).
      *   Anti-hoarding as critical design goal (Q2).
      *   Preference for local backing/circulation (Q3 leakage).
      *   Rejection of (a) Collectibles (hoarding) and endorsement of (b) Mutual Credit (moves industry, anti-hoarding, local).
      *   The *need* to flag the vulnerable impact question (Q4) to the board as values-based.
  *   **Moderate Confidence (Judgment Calls & Practical Application):**
      *   Specific phrasing of Q1-Q5 thresholds ("sufficient" vs "insufficient").
      *   Making Q5 (Rep Risk) a potential stop point.
      *   Treating Q3 (Leakage) as a major risk but not an absolute stop.
      *   Analysis of (c) Prepaid Card - particularly the interaction of Q2 (No Anti-Hoarding) and Q4 (Vulnerable Impact).
      *   The false positive/negative analysis.
  *   **Lower Confidence / Requires Local Context (Hardest to Verify):**
      *   The specific assessment of reputational risk (Q5) for each proposal relies heavily on your intimate knowledge of your community's trust levels, past failures, and operational capacity.
      *   The precise impact of the prepaid card subsidy (c) on *net new* local spending (Q1) vs. displacement is hard to predict without data – this could affect whether a board might override a Q2 decline if Q1 impact seemed huge. My judgment is the leakage and hoarding risks outweigh this.
      *   **My Least Sure Point:** **The potential *benefit* of the prepaid card (c) outweighing its Q2 (Anti-Hoarding) failure.** I judged Q1 impact as only "Potentially Yes" and leakage as major. It *could* be that the 5% subsidy powerfully stimulates significant *new* local spending, especially among lower-income residents, outweighing the lack of demurrage and some leakage. My skepticism stems from leakage to chains and the lack of mechanism to *ensure* the subsidy moves *idle* industry rather than just slightly shifting existing spending.

  **How You Could Settle My Least Sure Point (Prepaid Card Benefit):**
  *   **Observe:** Over the next two quarters, track the *stated motivations* of new users joining the core scrip system or participating in local "buy local" campaigns. Specifically try to ascertain:
      *   What is the primary *barrier* that stops them from spending more locally *now*? Is it purely price sensitivity a 5% discount would solve? Or is it lack of local product selection, convenience, awareness, or cash flow timing?
      *   How sensitive *are* lower-income residents to a 5% discount on *all* local purchases? Would it significantly change their *total* local spending budget, or just shift *which* local store gets it? (This is hard, but anecdotal evidence from food bank clients or similar about spending decisions helps).
  *   **If you observe:** Strong evidence that a simple 5% discount would unlock significant, *additional* (not just shifted) spending from price-sensitive residents (especially lower-income) who currently spend little locally, and that this spending would primarily benefit *independent* local businesses (not chains), then my skepticism about the card's Q1 impact is likely too high. The Q2 failure (no anti-hoarding) might be less critical for a tool primarily aimed at stimulating immediate spending via subsidy. Leakage (Q3) remains a major concern needing mitigation (e.g., excluding chains, higher subsidy for independents). This would make it a closer call requiring stronger board values judgement on leakage and equity (Q3/Q4).
