answer: |-
  *Sets down quill, steeples ink-stained fingers. A dry chuckle escapes.*

  Ah, Scholar, you mistake the map for the territory, the chronicler's hindsight for the captain's foresight. Cesare Borgia? His *virtù* was not in his victory, nor negated by his ruin. It blazed in the *doing*: forging alliances with the Orsini while ensuring the means to later shatter them, pacifying the Romagna with Remirro de Orco's efficient brutality *and* his own public execution of the same man to appease the mob. That is *virtù* – reading necessity and acting with ferocious, adaptable intent *before* the flood crests. Fortune gave him the Papacy for a father, true. But it was Borgia's *own* hand that fortified Urbino, subdued rivals, built the structure. Fortune snatched his father and his health away in cruel succession, collapsing the edifice built *upon* that initial gift. The structure itself, however, was the work of *virtù*. His ruin proves not the emptiness of *virtù*, but the terrible tax Fortune demands when she turns her face away, *especially* from those who built high upon her unstable favors. The man who builds dykes? His walls may still be overwhelmed by a deluge unseen in a thousand years. Does that make him the same as the praying fool? Only to those who watch from dry hills after the waters recede.

  You speak of "fixed temperament" as if *virtù* were mere stubbornness! A fatal misreading! The core of *virtù* is precisely the *capacity* to discern the shift in the winds of necessity and to bend one's methods accordingly, even against one's own grain. Think of Savonarola! A lion in the pulpit, roaring God's wrath, yet when the Signoria turned against him and the mob soured, could he become the fox? Could he temporize, dissemble, retreat? No. His nature held him fast to the fiery path, and so he burned. *That* is lacking *virtù* – the inability to adapt when the times demand it. The proof lies not in the final failure, but in the *pattern* of action: the consistent blindness to changing circumstance, the repeated refusal to prepare when preparation is possible, the reliance on hope or prayer where force or guile is needed. Look to Piero Soderini in Florence! A good man, believing in law and republic, but when the Medici claws sharpened and the winds blew towards tyranny, could he shed his lawful nature and strike first? He hesitated, clung to process... and fell. His fixed nature, unsuited to the brutal necessity of the moment, was his lack of *virtù*. The evidence is in the persistent missteps *before* the final crash, the refusal to build the dyke even as the river swelled before his eyes.

  *Leans forward, eyes sharp*

  You ask what the word *does*? It names the observable force of will and intellect applied to mastering Fortuna's chaos. It describes the *difference* between the captain who drills his men in fair weather and the one who feasts, between the prince who cultivates allies before the crisis and the one who waits. Their ends may both be swept away by a sudden storm – but only one displayed *virtù*. To deny this force because Fortune is capricious is like denying the strength of an ox because it may yet stumble. The ox *has* strength. The man with *virtù* *wrestles* with the world. Sometimes he pins it. Sometimes it crushes him. But the wrestling is real. You see only the fallen bodies and declare the struggle an illusion? Bah. Your dry hills make you complacent, Scholar. Come down into the floodplain and build something. Then we shall speak of luck. Now, sharpen your quill. Counter me.
