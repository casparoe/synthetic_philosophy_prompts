  | **Futarchy Failure Mode**       | Futarchy assumes markets separate beliefs from values; failure occurs when policy stakes incentivize trading desires as if they were forecasts.             | Adjacent            | Diagnoses institutional error (council misreading price) but doesn't explain why robotics succeeded. Your case highlights resource asymmetry as catalyst.                 | Allow only non-stakeholder traders (e.g., outsiders); use orthogonal decision markets (unrelated to trader welfare). |
  | **Pseudo-forecast Artifact**    | Prices in thin, biased markets reflect resource-weighted coalitions, not event likelihoods.                                                               | Does not apply      | Robotics was equally thin but accurate; thinness wasn’t the flaw. Your distortion arose from motivated spending by budget-empowered groups, not liquidity constraints. | Increase liquidity alone wouldn’t fix it; must address stakeholder motives and resource concentration.             |

