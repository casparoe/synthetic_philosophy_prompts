prompt: |-
  I am a high school junior, and this year I helped run a prediction market for our student government. I have run into a pattern I cannot name, and I care much more about getting the carving right than about getting a label, so please do not stop at a term.

  **The setup.** Our student council was deciding whether to replace our seven-period day with a block schedule of four longer classes. Rather than vote on the schedule, the council announced that it would adopt the change if, by a fixed deadline, the price of the yes contract finished above 65 cents in a market on a factual question: whether the share of students passing their end-of-year exams would be at least as high next year as it was this year. Trading used Council Credits, which students earn through attendance and club participation and spend in the school store on small perks. Credits could not be bought with real money, could not leave the school, and were also distributed in bulk to clubs and class organizations as part of their annual budgets.

  **First observation.** For about two weeks the price drifted between 44 and 49 cents while people argued about evidence: what other schools had done, whether longer classes help or hurt students who struggle in the morning. Then, on a single day, it jumped from 47 to 71 cents. The only thing that had happened was that the senior class organizations released their credit endowments, roughly two thousand credits, and bought yes. Six days later it dropped to 58 cents when the freshmen and sophomore clubs pooled theirs and bought no. On neither day did anyone offer a new fact about exam results, and the students making the trades were candid that they were not reporting a belief. Several of them told me they had no idea what would happen to the pass rate and were simply spending what they had been given on the outcome they wanted.

  **Second observation.** The same group, the same currency, and largely the same students ran a market a month earlier on whether our robotics team would place in the top eight at regionals. That price behaved completely differently. It fell from 70 to 52 cents the day a drive motor burned out, rose when a strong competing school withdrew, and closed within three cents of what the team's mentor had been estimating privately all season. Nobody had a stake in that outcome beyond bragging rights, and no organization held a large block of credits on it.

  **What I cannot name.** Our council treated the first price exactly as it had treated the second: as a measurement, and as the reason for a decision. So a mechanism that was supposed to be forecasting the world ended up recording the strength and the budget allocation of the people who cared about the decision, and the decision rule then converted that record into policy. The troubling part is that nobody did anything dishonest. No one spread false information, no one traded to move the number in order to change someone else's mind, and every trade was sincere. The traders were, exactly as intended, expressing how much they wanted the outcome — and the mechanism read that as how likely the outcome was. I have been reading about futarchy, the proposal that governments should settle policy by letting people bet on outcomes and adopting whatever the favored market points to, and the distinction I keep seeing drawn there is between voting on what you value and betting on what you believe. Our market seemed to collapse those two into one channel without anyone noticing it happen.

  **Near neighbors I have considered and rejected.** Goodhart's law, because nobody gamed the measure once it became a target; the measure was already contaminated before it became a target. Manipulation, because no one tried to deceive anyone and there was no strategic trading. The self-fulfilling prophecy, because the price did not bring about the outcome it predicted; if anything it may have made the outcome less likely, since passing depended on students' behavior, not their bets. The thin-market problem, because our market was thin in exactly the same way in the robotics case, and there it worked.

  **The edges I want pinned down.** Would this have gone away if the credits were real money? If outsiders — students from other schools, parents, teachers — had been allowed to trade? If endowments had been equal, or capped, or non-transferable within clubs? And is the resulting price a forecast of anything at all — perhaps an accurate forecast of what a student vote would have produced, or of the intensity of support — such that the error lies not in the price but in the council's choice of what to read off it?

  Please answer in two parts.

  *Part one:* a table with at least five rows, ordered from best fit to worst, and these columns:

  1. **Candidate concept** — its established name, or your own coinage if nothing established applies.
  2. **Core claim** — what the concept says, in one or two plain sentences.
  3. **Fit** — exactly one of: exact fit, close but incomplete, adjacent, does not apply.
  4. **Divergence** — the specific feature of my case the concept fails to capture, or the specific feature that makes it fit.
  5. **Repair condition** — what I would have to change about my school's market for the concept to apply cleanly.

  *Part two:* a single JSON object with exactly these fields:

  - `recommended_name` — string; the name you would use for this phenomenon, established or coined.
  - `definition` — string; two or three sentences, precise enough that I could apply it to a case I have never seen.
  - `necessary_conditions` — array of strings; what has to be true for it to occur, and which of them my case satisfies.
  - `looks_like_it_but_is_not` — object with `case` and `why`; a situation that superficially resembles mine but falls outside the definition.
  - `is_it_even_though_it_looks_unlike` — object with `case` and `why`; a situation that satisfies the definition despite not resembling a prediction market at all.
  - `what_the_price_was_actually_forecasting` — string; your answer to the question in my penultimate paragraph, or your reason for thinking the price forecast nothing.

  I am asking for analysis, not references, so please do not include a reading list or citations.
reasoning: |-
  We are given a detailed scenario about a prediction market in a high school setting. The key issue is that in the first market (on exam pass rates), the price was driven not by beliefs about the outcome but by the spending power of groups who had a stake in the decision (because the market outcome would determine the schedule change). In the second market (on robotics), the price behaved as a typical prediction market, reflecting information about the likelihood of the outcome.

  The phenomenon observed is that the market price, which should ideally aggregate information about the likelihood of an event, instead aggregated the preferences (or "wants") of participants who had the ability to spend credits without regard to the actual probability. This happened because the credits were not real money and were distributed in bulk to groups that had a vested interest in the outcome of the decision (the schedule change). In the robotics case, there was no such vested interest, and the market worked as intended.

  Part One: Table

  We will create a table of candidate concepts that might explain or relate to this phenomenon, ordered from best fit to worst.

  1. **Candidate Concept**: Preference Pollution (coined term, as no established term seems to fit perfectly)
     - **Core Claim**: When participants in a prediction market trade based on their preferences (what they want to happen) rather than their beliefs (what they think will happen), and they have sufficient resources to move the price, the market price becomes a reflection of the strength of preferences and resources rather than the probability of the outcome.
     - **Fit**: Exact fit.
     - **Divergence**: This concept directly captures the core issue: traders were spending based on what they wanted (the schedule outcome) and not on their beliefs about exam pass rates, and they had the resources (endowments) to move the price.
     - **Repair Condition**: To avoid preference pollution, the market must be structured so that participants have an incentive to trade based only on beliefs. This could be achieved by using real money (so that losing money hurts) and by excluding participants who have a direct stake in the decision (so they don't have a reason to trade based on preference).

  2. **Candidate Concept**: Futarchy's Preference-Belief Conflation
     - **Core Claim**: In a futarchy-like decision market, if traders have a stake in the decision and the market is not properly isolated from preference expression, the market price may conflate beliefs about the outcome with the traders' preferences for the decision.
     - **Fit**: Close but incomplete.
     - **Divergence**: This concept is close because it addresses the conflation of preferences and beliefs in decision markets. However, it is typically discussed in the context of futarchy and not necessarily in a setting with non-monetary, endowment-based trading. Our case is a specific instance of this conflation.
     - **Repair Condition**: To fix, one would need to ensure that the market is only open to disinterested parties (who do not care about the decision outcome) or that the decision outcome does not affect the traders' welfare (which is not possible in a school setting).

  3. **Candidate Concept**: Speculative Bubble (or Noise Trading)
     - **Core Claim**: When a market is driven by traders who are not trading on fundamental information (noise traders), the price can deviate from the fundamental value. This is often due to irrational exuberance or herding.
     - **Fit**: Adjacent.
     - **Divergence**: In our case, the traders were not irrational or herding; they were intentionally trading to express their preference for the schedule change. They were not misinformed but were instead using the market as a voting mechanism. The price deviation was due to a deliberate expression of preference, not noise.
     - **Repair Condition**: To avoid bubbles, one might implement measures to increase the proportion of informed traders or use real money to increase the cost of being wrong. However, in our case, the issue is not noise but a deliberate conflation.

  4. **Candidate Concept**: Wealth Effect (or Endowment Effect)
     - **Core Claim**: When participants receive a windfall (like an endowment), they may be more willing to spend it on speculative or low-probability bets because they perceive the money as "house money" (less valuable than earned money).
     - **Fit**: Adjacent.
     - **Divergence**: This concept might explain why the groups spent their credits so freely, but it does not capture the core issue that they were spending to express a preference for the schedule change, not because they undervalued the credits. The key driver was the vested interest, not the endowment per se.
     - **Repair Condition**: To avoid the wealth effect, one might not give large endowments or require participants to earn the credits. However, even without endowments, if the same groups had saved credits, they might have spent them similarly.

  5. **Candidate Concept**: Thin Market Vulnerability
     - **Core Claim**: In a market with few participants and low liquidity, large trades can move the price significantly, and the market may not reflect the true value because of the lack of depth.
     - **Fit**: Does not apply.
     - **Divergence**: The market was thin in both cases (robotics and schedule), but in the robotics case, the price moved on information and reflected the true probability. In the schedule market, the price moved due to preference-based trading. Thus, thinness is not the core issue; the issue is the motivation of the trades.
     - **Repair Condition**: To fix a thin market, one would increase participation and liquidity. However, even with more participants, if a large group with a vested interest and resources enters, they could still move the price if they trade based on preference.

  Part Two: JSON Object

  We will now provide the JSON object as requested.

  - `recommended_name`: "Preference Pollution in Decision Markets"
  - `definition`: "Preference pollution occurs in a prediction market when participants, who have a direct stake in the decision that the market is intended to inform, trade based on their preferences (what they want to happen) rather than their beliefs (what they think will happen). This leads the market price to reflect the aggregated spending power and intensity of preference of these stakeholders, rather than the objective likelihood of the outcome. The phenomenon is particularly likely when the trading currency is not real money (or has low opportunity cost) and when large endowments are held by groups with vested interests."
  - `necessary_conditions`: [
      "The market is used to inform a decision that affects the traders' welfare (so they have a stake in the outcome).",
      "Traders with a stake have the ability to trade in the market (they are not excluded).",
      "The trading currency or incentives are such that the cost of trading against one's beliefs is low (e.g., using play money or endowments that are not earned).",
      "The market is thin enough that the trades of these stakeholders can move the price significantly.",
      "The stakeholders have a common interest and can coordinate or pool resources to trade in the same direction."
    ]
    (In our case, all these conditions are satisfied: the schedule decision affected the students, they could trade, they used Council Credits (low cost), the market was thin, and the class organizations pooled resources.)

  - `looks_like_it_but_is_not`: {
      "case": "A prediction market on a corporate sales target where employees trade using real money and the market is thick (many participants). Some employees trade based on inside information that sales will miss the target, causing the price to drop.",
      "why": "In this case, the trades are based on beliefs (inside information) and not on a desire for the target to be missed (preference). Even though employees might prefer to hit the target, they are trading to make money by being accurate. This is a well-functioning prediction market without preference pollution."
    }

  - `is_it_even_though_it_looks_unlike`: {
      "case": "A university allocates research funding by having faculty members bet on which proposals will lead to the most citations. The betting uses tokens distributed by the university. Senior faculty pool their tokens to bet on their own proposals, moving the price in their favor.",
      "why": "This is preference pollution because the faculty are trading to get funding for their own proposals (preference) rather than on their honest beliefs about which proposals would generate the most citations. The use of tokens (like Council Credits) and the direct stake (funding for their proposals) match the necessary conditions."
    }

  - `what_the_price_was_actually_forecasting`: "The price in the exam pass rate market was not forecasting the likelihood that pass rates would stay the same. Instead, it was forecasting the intensity of the student body's preference for the block schedule, weighted by the distribution of Council Credits. Specifically, it was aggregating the willingness to spend credits by those who wanted the schedule change and those who opposed it. The resulting price was effectively a measure of the relative budget and coordination of the two sides, which in this case was also a predictor of how a student vote might have gone (if credits were distributed similarly to voting power)."

  This analysis captures the essence of the problem and provides a framework for understanding and avoiding it in the future.
