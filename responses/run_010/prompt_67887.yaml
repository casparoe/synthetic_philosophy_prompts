  | **Value-Induced Bias**          | Decision markets aggregate both factual predictions and preference intensities when participants have stakes in the policy outcome.                          | Close but incomplete | Captures preference/forecast entanglement but doesn't specify why resources matter. Your case showed budget inequality drove distortion, not just bias.                  | Equalize credit endowments; cap individual/club influence; isolate policy-tied markets from preference expression. |
