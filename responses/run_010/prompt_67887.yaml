  ### Key Clarifications
  - **Why not real money?**: Real money raises trading costs, incentivizing belief-based bets. But if stakeholders (e.g., students) still had policy stakes, wealthy factions could distort prices—suggesting excluding them or isolating decision markets is essential.
  - **Role of outsiders**: Allowing disinterested traders (e.g., teachers, other schools) could dilute pollution by adding belief-driven liquidity.
  - **Equal endowments?**: Equal credits might reduce distortion but not eliminate it—passionate traders could still "overbet" desires if stakes are low-cost.
  - **Forecast value**: The price had information—it predicted student body support levels—but was misused as a fact forecast. The flaw was institutional, not algorithmic.
