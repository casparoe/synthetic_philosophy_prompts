  First, the core pedagogical problem: students are regurgitating the standard arguments without understanding the empirical substance behind the measure problem. The toy case with three weighting rules seems promising - it creates a controlled environment to compare branch counting, amplitude-based weights, and Born rule weights. 

  For the question stem, I need to clearly define: 
  - The quantum state preparation (√(2/3)|up⟩ + √(1/3)|down⟩ repeated N times)
  - The three rival weighting rules 
  - The computational tasks: limiting frequencies for each rule 
  - The conceptual challenges: empirical distinguishability, typicality objections, evidential weight of rare events

  The calculation part is straightforward but crucial - students must derive that:
  - Rule A (branch counting) → 1/2 frequency 
  - Rule B (amplitude weights) → 2/3 frequency (same as Born rule!)
  - Rule C (Born) → 2/3 frequency

  This is the first trap - Rule B gives identical predictions to Born rule in this case. Many students might miss this and claim they're distinguishable. The key insight is that while Rule B works here, it would fail for unequal amplitude magnitudes (e.g. if |up⟩ had amplitude √(1/2) rather than √(2/3)).

  For the typicality objection: 
  - The Rule A skeptic argues most branches see ≈50% up
  - But "most branches" implicitly uses branch-counting measure
  - The rebuttal requires recognizing this circularity while avoiding begging the question

  The self-locating uncertainty angle needs careful handling since half the class hasn't seen it. I should define it explicitly in the question as: "When finding yourself in a branching universe, you might be uncertain about which branch you occupy."

  The marking scheme must ruthlessly penalize: 
  - Mere summary of Deutsch-Wallace (0 marks) 
  - Failure to compute Rule B's prediction 
  - Missing that Rules B and C agree here 
  - Not explaining why typicality arguments presuppose a measure

  The model answer needs to demonstrate: 
  - Correct frequency calculations 
  - Recognition that Rules B/C coincide here but differ in general 
  - Clear handling of typicality objection without circularity 
  - Proper treatment of rare events' evidential weight

  This structure forces engagement with why the measure has empirical content - pick the wrong one and you get wrong frequencies. The Rule B/C coincidence is particularly elegant because it shows amplitude-based measures can work, but only the Born rule generalizes correctly.
answer: |-
  ### Question Paper (348 words)
  **Instructions:** Answer all parts. Show calculations clearly. State all assumptions. Time allowed: 3 hours. Closed book. Calculator permitted.

  ---

  **Background:** In the Everett (many-worlds) interpretation, a spin-1/2 particle prepared in state \( \sqrt{\frac{2}{3}} |\uparrow\rangle + \sqrt{\frac{1}{3}} |\downarrow\rangle \) and measured \( N \) times (with decoherence between trials) generates \( 2^N \) branches. Each branch records a unique sequence of \( k \) "up" and \( (N-k) \) "down" outcomes. We consider three rival rules assigning weights (probabilities) to branches:

  - **Rule A (Branch-Counting):** All branches have equal weight \( \frac{1}{2^N} \).  
  - **Rule B (Amplitude Rule):** Weight of a branch with \( k \) ups is \( \propto \left| \sqrt{\frac{2}{3}} \right|^k \left| \sqrt{\frac{1}{3}} \right|^{N-k} \).  
  - **Rule C (Born Rule):** Weight of a branch with \( k \) ups is \( \left( \frac{2}{3} \right)^k \left( \frac{1}{3} \right)^{N-k} \).  

  **Tasks:**  
  1. **Calculations:**  
     (a) For large \( N \), what up-frequency \( f_\text{up} \) (i.e., \( k/N \)) does each rule predict as the *most probable value*? Derive your answers.  
     (b) For Rules B and C, compute the *expected value* \( \mathbb{E}[f_\text{up}] \) in the large-\( N \) limit.  

  2. **Empirical Distinction:**  
     (a) Could a many-worlds theory using Rule B be distinguished experimentally from Everettian quantum mechanics (Rule C)? Explain quantitatively.  
     (b) If Rules B and C *differ* in predictions, estimate the smallest \( N \) needed to distinguish them at 95% confidence (σ = 2 standard deviations) using repeated experiments. Assume ideal measurements.  

  3. **Typicality & Evidence:**  
     (a) A sceptic argues: "Rule A must be correct because over 99% of branches have \( f_\text{up} \approx 0.5 \). Observers in those branches see statistics confirming Rule A. Unless we think we are special, we should expect this." Does this argument presuppose a weighting rule? Explain.  
     (b) Consider a branch where all \( N \) measurements result in "up" (i.e., \( f_\text{up} = 1 \)).  
        - What weight does Rule B assign to this branch?  
        - What weight does Rule C assign?  
        - Does observing such a result *falsify* either rule? Explain.  
     (c) **Self-locating uncertainty (defined here):** When finding yourself in a branching universe, you might be uncertain about which branch you occupy. How might this concept help assess whether the sceptic's argument (in 3a) begs the question?

  ---

  ### Model Answer (899 words)  
  #### 1. Calculations  
  **(a) Most probable \( f_\text{up} \):**  
  - **Rule A (Branch-Counting):** All sequences are equally likely. The number of sequences peaks at \( k = N/2 \). Thus, \( f_\text{up} \to 0.5 \) as \( N \to \infty \).  
  - **Rule B (Amplitude Rule):** Weight \( \propto \left( \sqrt{\frac{2}{3}} \right)^k \left( \sqrt{\frac{1}{3}} \right)^{N-k} = \left( \frac{2}{3} \right)^{k/2} \left( \frac{1}{3} \right)^{(N-k)/2} \).  
    Maximize \( \log \)-weight: \( w_B \propto \exp\left[ \frac{k}{2} \ln \frac{2}{3} + \frac{N-k}{2} \ln \frac{1}{3} \right] \). Set derivative w.r.t. \( k \) to zero:  
    \[
    \frac{d}{dk} \left[ k \ln \sqrt{\frac{2}{3}} + (N-k) \ln \sqrt{\frac{1}{3}} \right] = 0 \implies \ln \sqrt{\frac{2}{3}} - \ln \sqrt{\frac{1}{3}} = 0 \implies \sqrt{\frac{2}{3}} / \sqrt{\frac{1}{3}} = \sqrt{2} > 1,
    \]  
    which is impossible. The weight *increases* monotonically with \( k \). Maximum at \( k = N \), so \( f_\text{up} \to 1 \).  
  - **Rule C (Born Rule):** Weight \( \propto \left( \frac{2}{3} \right)^k \left( \frac{1}{3} \right)^{N-k} \). Maximize \( \log \)-weight:  
    \[
    \frac{d}{dk} \left[ k \ln \frac{2}{3} + (N-k) \ln \frac{1}{3} \right] = 0 \implies \ln \frac{2}{3} - \ln \frac{1}{3} = \ln 2 > 0.
    \]  
    Again, weight increases with \( k \), so \( f_\text{up} \to 1 \).  

  **(b) Expected \( \mathbb{E}[f_\text{up}] \):**  
  - **Rule B:** The weight for a sequence with \( k \) ups is \( w_B(k) = C \cdot (2/3)^{k/2} (1/3)^{(N-k)/2} \), where \( C \) normalizes total weight to 1.  
    \[
    \mathbb{E}[f_\text{up}] = \sum_{k=0}^N \binom{N}{k} w_B(k) \frac{k}{N}.
    \]  
    For large \( N \), the expectation is dominated by the maximum. Since \( w_B(k) \) peaks at \( k = N \), \( \mathbb{E}[f_\text{up}] \to 1 \).  
  - **Rule C:** Standard binomial expectation: \( \mathbb{E}[k] = N \cdot \frac{2}{3} \), so \( \mathbb{E}[f_\text{up}] = \frac{2}{3} \).  

  #### 2. Empirical Distinction  
  **(a)** Rules B and C *cannot* be distinguished in this specific case because both predict \( f_\text{up} \to 1 \) as the most probable outcome, and Rule B’s expectation also approaches 1. However, this is accidental. Consider a state \( \sqrt{a} |\uparrow\rangle + \sqrt{b} |\downarrow\rangle \) with \( a \neq |\sqrt{a}|^2 \) (e.g., \( a = 0.5 \), \( |\sqrt{a}|^2 = 0.5 \)). Rule B would predict \( f_\text{up} \to 1 \) while Rule C predicts \( f_\text{up} \to a \). Here, Rule B is empirically wrong. Everettian QM uses Rule C, which matches quantum predictions.  

  **(b)** Not applicable for this state since Rules B and C agree asymptotically on the mode. *But if amplitudes were unequal* (e.g., \( \sqrt{0.5} |\uparrow\rangle + \sqrt{0.5} |\downarrow\rangle \)):  
  - Rule B predicts \( f_\text{up} \to 1 \), Rule C predicts \( f_\text{up} \to 0.5 \).  
  - Variance for Rule C: \( \sigma^2 = \frac{(0.5)(0.5)}{N} = \frac{0.25}{N} \). At 95% confidence (2σ), detectable when \( |1 - 0.5| > 2\sigma \implies 0.5 > 2 \sqrt{0.25/N} \implies N > 16 \).  

  #### 3. Typicality & Evidence  
  **(a)** The sceptic’s claim that "99% of branches have \( f_\text{up} \approx 0.5 \)" assumes Rule A (branch-counting). Under Rule C, branches with \( f_\text{up} \approx 0.5 \) have vanishingly small weight as \( N \to \infty \). The argument presupposes branch-counting to defend branch-counting—it is circular.  

  **(b) All-up branch (\( k = N \)):**  
  - Rule B weight: \( \propto \left( \sqrt{\frac{2}{3}} \right)^N \left( \sqrt{\frac{1}{3}} \right)^0 = \left( \frac{2}{3} \right)^{N/2} \). Normalizing constant is \( \left[ \sum_{k=0}^N \binom{N}{k} (2/3)^{k/2} (1/3)^{(N-k)/2} \right]^{-1} \), so weight \( w_B \leq (2/3)^{N/2} \).  
  - Rule C weight: \( \left( \frac{2}{3} \right)^N \).  
  - **Falsification:** Observing all-ups *falsifies Rule A* (weight \( \sim 2^{-N} \), negligible for large \( N \)). It *does not falsify Rule B or C* since both assign non-zero weight. However, for large \( N \), Rule C assigns weight \( (2/3)^N \) while Rule B assigns \( \sim (2/3)^{N/2} \). Since \( (2/3)^N \ll (2/3)^{N/2} \), observing all-ups is *less surprising* under Rule B than Rule C.  

  **(c) Self-locating uncertainty (SLU):** Under SLU, your uncertainty about which branch you are in should be quantified using the *weight measure* (Rule C), not branch-counting. The sceptic’s argument assumes branch-counting to define "typicality," then uses typicality to justify branch-counting—a vicious circle. SLU resolves this: weights determine rational credence. Observing \( f_\text{up} = 1 \) should make you suspect Rule B *if* you expected Rule C, since Rule B assigns higher weight to extreme outcomes.  

  #### Key Insight  
  The Born rule (Rule C) is empirically falsifiable: if frequencies consistently deviate from amplitude squares, Everettian QM is wrong. Rule A fails trivially; Rule B fails for asymmetric amplitudes. Typicality arguments only avoid circularity if weights are justified independently (e.g., via envariance or decision theory).  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A-Grade (21–25):** Correct calculations for *all* rules; identifies Rule B/C agreement here but distinguishes them generally; refutes typicality circularity using SLU/weights; quantifies evidence for all-up branch.  
  **B-Grade (16–20):** Minor errors in Rule B calculation; identifies Rule B/C agreement but vague on distinguishability; recognizes typicality circularity but weak SLU application.  

  #### Marks Allocation:  
  1. **Calculations (9 marks):**  
     - 1(a) Rule A: \( f_\text{up} = 0.5 \) (1 mark)  
     - 1(a) Rule B: Correct derivation of \( f_\text{up} \to 1 \) (3 marks)  
     - 1(a) Rule C: Correct derivation of \( f_\text{up} \to 1 \) (1 mark)  
     - 1(b) Rule B: \( \mathbb{E}[f_\text{up}] \to 1 \) (2 marks)  
     - 1(b) Rule C: \( \mathbb{E}[f_\text{up}] = 2/3 \) (2 marks)  

  2. **Empirical Distinction (6 marks):**  
     - 2(a): States Rules B/C agree *here* but differ under \( a \neq |\sqrt{a}|^2 \) (3 marks)  
     - 2(b): N/A for this state, or correct \( N \) for generic case (3 marks)  

  3. **Typicality & Evidence (10 marks):**  
     - 3(a): Identifies circularity in sceptic’s premise (2 marks)  
     - 3(b) Rule B weight: \( \propto (2/3)^{N/2} \) (1 mark)  
     - 3(b) Rule C weight: \( (2/3)^N \) (1 mark)  
     - 3(b) Falsification: Explains why all-ups doesn’t falsify B/C but disfavors C (2 marks)  
     - 3(c): Uses SLU to reject branch-counting typicality (4 marks)  

  #### Common Mistakes:  
  - **"Deutsch-Wallace summary":** Recites decision theory without applying to Rules A/B/C. **Penalty:** 0 for Q2–Q3.  
  - **"Rule B = Born Rule":** Assumes Rules B and C always agree. **Penalty:** –4 (fails Q2a).  
  - **"Typicality neutral":** Claims typicality is measure-independent. **Penalty:** –5 (fails Q3a/c).  
  - **"All-ups falsifies Rule C":** Misunderstands non-zero weight. **Penalty:** –3 (fails Q3b).  

  ---  
  This question forces engagement with the measure problem’s empirical core, penalizing canned answers. Calculations expose Rule B’s pathology, while typicality and SLU test conceptual traction.
