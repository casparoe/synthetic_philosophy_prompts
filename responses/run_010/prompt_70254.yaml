  You are a philosopher of science with a serious secondary interest in the history of economic thought. Think carefully before writing: open with five or six lines of rough brainstorming in which you test whether my question can be sharpened or ought to be narrowed, and only then give the proposal itself.

  I am applying for a one-year postdoctoral fellowship and need a proposal of about 1,200 words. My half-formed idea concerns the defence that a long-run theory was "right but early". Malthus is the classic exhibit: the checks he described now look like a fair account of pre-industrial populations generally, and what refuted him in practice was a fertility transition that began in most of north-west Europe after his death in 1834 and ran for well over a century. The twentieth-century successor case is sharper still — Ehrlich's population-and-resources predictions were scored by a decade-long wager on five metals settled in 1990, which he lost, though retrospective analysis suggests he would have won over most other windows in the century.

  The question I want posed: can "right but early" ever be a non-ad-hoc defence, and if so, what criteria, fixed in advance of the outcome, would distinguish (a) a correct mechanism with miscalibrated timing, (b) a correct mechanism temporarily swamped by an unpredicted countervailing process, and (c) a false theory whose predicted phenomenon later arrived for unrelated reasons?

  The proposal must state that question precisely; explain why the familiar apparatus — falsificationism, the underdetermination of auxiliary hypotheses, Lakatos's progressive and degenerating programmes, ceteris paribus clauses — leaves it open (no bibliography; I will supply citations myself); set out my method month by month, including which further cases I would use as controls and why they are informative rather than merely additional; say what a successful result looks like (I have in mind a scoring protocol that could be applied prospectively to long-run predictions being made today); say what would count as the project failing; and judge honestly whether one year is a realistic scope. Please write the whole thing in British English.
