  **First-class distinction**: A first-class answer (≥21) rigorously argues transitivity, constructs a compelling threshold-unit case, and derives a decision rule that preserves lexicality. Competent answers (15–20) cover all moves but lack depth in one hard area (e.g., transitivity proof or uncertainty rule).  

  ---

  **Closing Note**:  
  The hardest part is **decision under uncertainty** (Q3d), as LTNU lacks native tools, requiring innovation. Strong-but-not-exceptional answers often fumble **transitivity** (Q3c) by asserting intransitivity without proof. A hint is advisable: *"For transitivity, consider whether lexical orders on real numbers can cycle."* This scaffolds critical argument without giving away the answer.
