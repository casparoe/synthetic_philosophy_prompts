  - B: H=1, V=100
  - C: H=0, V=50

  Then: A < C (because same H=0, C has higher V) and C > B (because H=0 < H=1). Also A < B? Yes, because H=0 < H=1. So A < B < C and A < C: transitive.

  The ordering is lexicographic: first by H (real number, so ordered by the usual < on reals), then by V (real number). Lexicographic orders on real vectors are transitive. Therefore, the LTNU ordering is transitive.

  **(d) Representation and decision under uncertainty**

  Can LTNU be represented by a single real-valued function? The ordering is lexicographic: it first compares H, and then V. The set of possible H values is a real number, and for each H, V is a real number. In general, a two-dimensional lexicographic order cannot be represented by a single real-valued function if the domain is connected (like real numbers). Why? Because if we try to assign a value f(X) = -H(X) + g(V(X)) for some g, then we require that no matter how large g(V(X)), a small increase in H(X) (worse) cannot be compensated. But if we set f(X) = -H(X) * M + V(X) for a sufficiently large M, then if M is finite, we can always find V large enough to compensate a small increase in H. But LTNU does not allow any compensation. Therefore, no such finite M exists. Hence, there is no real-valued representation if the populations can have arbitrarily large V.

  However, if the space of populations is restricted such that V is bounded (say, |V| < M for some M), then we can choose a large enough constant K such that the range of V is within an interval of length less than 1, and then set f(X) = -H(X) + V(X)/K. Then the smallest difference in H (which is at least 1 if H are integers) would be greater than the maximum change in V (which is less than 1/K * (max V - min V) < 1 if we choose K > max|V|). But if H can be any real number? Then even if V is bounded, if H can vary continuously, we cannot represent it. But in practice, we might assume H and V are integers? Then with V bounded, we can represent. But the problem does not specify.

  In general, for the full space, no real-valued representation exists.

  Under uncertainty, an LTNU agent should minimize the expected H? But note: H is a random variable. Because of the lexical priority, the agent must first minimize the probability of any affliction? But that is not what LTNU says. LTNU is defined for outcomes, not prospects. We need a decision rule.

  One proposal: the agent should maximize the probability that the population has no affliction (H=0). But this might be too extreme: if two acts lead to afflicted populations, then we should choose the one with lower expected H? But then we are aggregating H, which is additive. Alternatively, we might use a lexicographic expected value: first order acts by the expected H, and if equal, by expected V. But note: H is a sum over lives. We might compute the expected H for the whole population. However, the expectation of H is linear, so it might be additive. But the lexical priority might require that we avoid any chance of high H. 

  Alternatively, we might use a minimax rule: minimize the maximum possible H? But that might be too conservative.

  The agent might set a threshold for decision under uncertainty: for example, if the expected H is above a certain level, then choose the act with minimal expected H, but if below, then maximize expected V. But this would introduce a new threshold. Without a new threshold, the agent might use a rule that first minimizes the probability that H>0, and if that probability is 1, then minimizes expected H, and if expected H is 0, then maximizes expected V. But note: if there is a chance of H>0, then the agent might prefer an act that leads to a small H with certainty over an act that leads to a large H with a small probability? But the expectation of H might not capture the lexical priority. 

  For example, consider two acts:

  Act I: leads to population with H=100 for sure.
  Act II: leads to population with H=0 with probability 0.99, and H=10000 with probability 0.01.

  The expected H of I is 100, of II is 0.99*0 + 0.01*10000 = 100. So expected H is the same. Then we would look at the expected V? But LTNU in the outcome stage would rank the outcome of II (if H=0) as better than I (H=100), and if H=10000, worse. But the agent must choose ex ante. The lexical priority might require that we avoid any chance of very high H. So the agent might prefer Act I because the worst-case scenario is better (H=100 vs H=10000). This suggests a minimax H rule: minimize the maximum possible H. Then, if the maximum H is the same, minimize the next worst, or use expectation? 

  This is complex and shows that decision under uncertainty requires additional principles. The LTNU ordering does not automatically extend to uncertainty, and a decision rule might need to incorporate a threshold for risk.

