answer: |-
  ### (a) Essay Question

  **Lexical threshold negative utilitarianism (LTNU).** Every life has a total quantity of pleasure, measured in hedons (Q), and a total quantity of pain, measured in dolors (P). There is a fixed threshold τ dolors. A life is *afflicted* if its total pain exceeds τ, and *unafflicted* otherwise. Betterness over populations is settled in two lexical stages:  

  1. *Affliction.* For a population X, let H(X) be the sum, over the lives in X, of the amount by which each afflicted life’s pain exceeds τ. X is better than Y if and only if H(X) < H(Y). Any difference in H, however small, decides the comparison: no quantity of pleasure can offset any positive quantity of affliction.  
  2. *Net sub-threshold welfare.* If H(X) = H(Y), then X is better than Y if and only if V(X) > V(Y), where V(X) = ΣQ − c·Σ min(P, τ) summed over the lives in X and c is a fixed positive conversion rate.  

  **Consider the following populations, where each life is described by (Q, P):**  
  - Population A: 10 lives at (100, 50)  
  - Population B: 100 lives at (10, 0)  
  - Population C: 1 life at (0, 110) and 100 lives at (100, 90)  
  - Population D: 1 life at (0, 1100) and 1000 lives at (100, 99)  
  - Population E: 10,000 lives at (1, 0)  

  Assume τ = 100 dolors and c = 0.5.  

  **Your tasks:**  
  1. **Rank populations A–E** according to LTNU. Justify by computing H and V for each. [5 marks]  
  2. **Assess repugnance**: Explain why the ranking of at least one population might seem repugnant. Defend this ranking against the charge, considering LTNU’s core motivation. [5 marks]  
  3. **Analyze foundational issues**: Address all four sub-questions. [15 marks]  
     - (a) LTNU treats pleasure and pain as commensurable below τ (rate c) but lexically prioritizes pain above τ. What is lost by calling this "incommensurability"? How would the view change if τ were vague, or marked a zone of incommensurability?  
     - (b) The threshold τ applies to "total pain" per life, but it is ambiguous whether pain is measured per moment, episode, or life. Construct a case where two interpretations yield opposite verdicts. Explain why the ambiguity matters.  
     - (c) H(X) sums excess pain across lives. Does this collapse LTNU into negative utilitarianism? What remains distinctive? Argue for or against the transitivity of LTNU’s betterness relation.  
     - (d) Can LTNU’s betterness ordering be represented by a single real-valued function? Under what conditions? What decision rule should an LTNU agent use when uncertain about pain caused—and must this rule involve a new threshold?  

  **Word limit**: 1,200 words  
  **Total marks**: 25  

  ---

  ### (b) Model Answer (1,250 words)  

  #### 1. Ranking of Populations  
  With τ = 100 and c = 0.5:  

  - **Population A (10 lives: (100, 50))**:  
    All lives unafflicted (P = 50 < τ).  
    H(A) = 0.  
    V(A) = ΣQ − c·Σ min(P, τ) = (10 × 100) − 0.5 × (10 × 50) = 1,000 − 250 = 750.  

  - **Population B (100 lives: (10, 0))**:  
    All unafflicted (P = 0 < τ).  
    H(B) = 0.  
    V(B) = (100 × 10) − 0.5 × (100 × 0) = 1,000 − 0 = 1,000.  

  - **Population C (1 life: (0, 110), 100 lives: (100, 90))**:  
    Afflicted life: P = 110 > τ, excess pain = 10. Unafflicted lives: P = 90 < τ.  
    H(C) = 10 (only the afflicted life contributes).  
    V(C) = ΣQ − c·Σ min(P, τ) = [0 + (100 × 100)] − 0.5 × [min(110, 100) + (100 × min(90, 100))] = 10,000 − 0.5 × [100 + 9,000] = 10,000 − 4,550 = 5,450.  

  - **Population D (1 life: (0, 1100), 1000 lives: (100, 99))**:  
    Afflicted life: P = 1,100 > τ, excess pain = 1,000. Unafflicted lives: P = 99 < τ.  
    H(D) = 1,000.  
    V(D) = [0 + (1000 × 100)] − 0.5 × [min(1100, 100) + (1000 × min(99, 100))] = 100,000 − 0.5 × [100 + 99,000] = 100,000 − 49,550 = 50,450.  

  - **Population E (10,000 lives: (1, 0))**:  
    All unafflicted (P = 0 < τ).  
    H(E) = 0.  
    V(E) = (10,000 × 1) − 0.5 × (10,000 × 0) = 10,000 − 0 = 10,000.  

  **Ranking by LTNU**:  
  - Stage 1 (H): Lower H is better. Populations grouped: A, B, E (H = 0); C (H = 10); D (H = 1,000).  
  - Stage 2 (V for H = 0): E (V = 10,000) > B (V = 1,000) > A (V = 750).  
  - Full ranking: E > B > A > C > D.  

  #### 2. Repugnance Assessment  
  The ranking of **E above B** may seem repugnant. E has 10,000 lives with minimal pleasure (Q = 1) and no pain, while B has 100 lives with higher pleasure (Q = 10) and no pain. This mirrors the Repugnant Conclusion: E sacrifices quality of life for quantity, yet LTNU ranks it highest due to higher V (10,000 > 1,000) when H = 0.  

  However, the ranking of **A above C** is more troubling for LTNU. A has 10 lives with high pleasure (Q = 100) and moderate pain (P = 50), while C has one afflicted life (P = 110, H = 10) and 100 lives with high pleasure (Q = 100) and near-threshold pain (P = 90). Intuitively, C’s vast net welfare gain (V = 5,450 vs. A’s 750) and only minor excess pain (10 dolors) might justify preferring C. Yet LTNU prioritizes eliminating affliction (H(A) = 0 < H(C) = 10), ranking A above C. This appears repugnant by allowing trivial excess pain to override massive welfare gains.  

  **Defense**: LTNU’s core motivation is that preventing severe suffering (pain > τ) is lexically prior to promoting happiness. If τ = 100 marks “severe” pain, then even a small excess (e.g., 110 dolors) is catastrophically bad and non-compensable. The repugnance charge assumes affliction is compensable, but LTNU rejects this by design. To object is to reject lexical priority, not LTNU’s internal logic. While harsh, A > C coheres with LTNU’s intent: no affliction, however minor, is tradable.  

  #### 3. Foundational Issues  
  **(a) Exchange rates and incommensurability**  
  LTNU denies incommensurability below τ (pleasure and pain exchange at rate c) but above τ, it imposes lexical priority (infinite exchange rate). Glossing this as “incommensurability” obscures the dual structure: commensurability exists below τ, and the lexical jump is a deliberate discontinuity, not value silence.  

  If τ were vague (e.g., a range [τ₁, τ₂]), affliction becomes indeterminate. H(X) could not be calculated precisely, undermining the first stage. Betterness might require a third “vagueness-sensitive” stage, complicating the ordering. If τ marked a zone of incommensurability (e.g., pain between τ₁ and τ₂ is incomparable to other values), populations with pain in this zone might be incomparable, making LTNU less decisive. This sacrifices LTNU’s clarity but better captures uncertainty about severity.  

  **(b) Threshold unit ambiguity**  
  The threshold unit is unspecified. Consider two lives:  
  - Life X: One acute episode with P = 150 dolors (total pain = 150).  
  - Life Y: Chronic pain with 100 episodes, each P = 1.5 dolors (total pain = 150).  

  Assume τ = 100 for both interpretations:  
  - **Whole-life interpretation**: Both afflicted (total P > τ), H = 50 for each.  
  - **Per-episode interpretation**: X afflicted (one episode > τ), H = 50. Y unafflicted (each episode < τ), H = 0.  

  Now compare populations:  
  - Population X: Only Life X.  
  - Population Y: Only Life Y.  

  Whole-life: H(X) = H(Y) = 50 → equal at stage 1.  
  Per-episode: H(X) = 50, H(Y) = 0 → Y better than X.  
  **Opposite verdicts**: Whole-life implies parity; per-episode implies Y is better. The ambiguity matters because LTNU’s verdicts hinge on what counts as “severe” suffering—aggregate or per incident. Without clarification, LTNU is incomplete.  

  **(c) Summative H and transitivity**  
  Summing H across lives makes LTNU aggregate excess pain linearly, akin to **negative utilitarianism (NU)** but with a discontinuity: pain below τ contributes 0 to H, while only excess matters above. This preserves distinctiveness: NU minimizes total pain simpliciter, but LTNU ignores sub-threshold pain at stage 1. For example, reducing pain from 101 to 100 in one life (affliction removed) outweighs eliminating any sub-threshold pain.  

  **Transitivity holds**. LTNU’s betterness is lexicographic: first by H (real number), then by V (real number). Real-number orders are transitive. Proof: Suppose X > Y and Y > Z. Then:  
  - Case 1: H(X) < H(Y) and H(Y) < H(Z) → H(X) < H(Z) → X > Z.  
  - Case 2: H(X) < H(Y) and H(Y) = H(Z) but V(Y) > V(Z). Then H(X) < H(Z) → X > Z.  
  - Case 3: H(X) = H(Y) and V(X) > V(Y), and H(Y) < H(Z). Then H(X) < H(Z) → X > Z.  
  Other cases similar. Thus, LTNU’s ordering is transitive.  

  **(d) Representation and uncertainty**  
  LTNU cannot be represented by a single real-valued function in general. A function f(X) must satisfy f(X) > f(Y) iff X > Y. But lexical orders on ℝ² (like H and V) are not continuous; no f(X) = g(H) + h(V) can replicate lexical priority. Representation is possible only if V is bounded (e.g., |V| < M). Then f(X) = −H·K + V, with K > 2M, ensures H-difdominate V-differences.  

  Under uncertainty, an LTNU agent cannot use expected utility (requires cardinal representation). Instead:  
  - **Lexical rule**: Minimize expected H first; if equal, maximize expected V.  
  - **Example**: Act I causes H=10 for sure. Act II has 50% chance of H=0 (V high) and 50% of H=20. Expected H(I) = 10, E[H(II)] = 10. Equal, so maximize E[V].  

  This rule **requires no new threshold** but inherits τ. However, it may demand minimax H in practice (avoid worst-case affliction), reflecting lexical caution.  

