  I think for simplicity, skip the chips and just have them report probabilities.

  Worked table for the handouts:

  For Deck A (large world) handout:

  | State | Prior P(state) | Ravens | Non-ravens | 
  |-------|----------------|--------|------------|
  |       |                | Black | Non-black | Black | Non-black |
  | 0     | 0.5            | 0     | 0         | 50   | 50       |
  | 1     | 0.1            | 1     | 0         | 50   | 49       |
  | 2     | 0.1            | 0     | 1         | 50   | 49       |
  | 3     | 0.3            | 1     | 1         | 50   | 48       |

  Total objects: 100 in every state.

  For Deck B (small reserve) handout:

  | State | Prior P(state) | Ravens | Non-ravens | 
  |-------|----------------|--------|------------|
  |       |                | Black | Non-black | Black | Non-black |
  | 0     | 0.5            | 0     | 0         | 5    | 5        |
  | 1     | 0.1            | 1     | 0         | 5    | 4        |
  | 2     | 0.1            | 0     | 1         | 5    | 4        |
  | 3     | 0.3            | 1     | 1         | 5    | 3        |

  Total objects: 10 in every state.

  And we provide a worksheet for the update.

  Example worksheet for Round 1 (non-black non-raven):

  Step 1: For each state, compute the probability of observing a non-black non-raven (likelihood).

  Step 2: Multiply the prior by the likelihood to get the unnormalized posterior.

  Step 3: Sum these products to get the normalizing constant (let's call it Z).

  Step 4: Divide each unnormalized posterior by Z to get the posterior probability of the state.

