answer: |-
  Below is a comprehensive design for your in-class betting game to make students experience Hempel's raven paradox firsthand. The game uses two interleaved sampling frames (a "large world" and a "small reserve") to highlight how context affects confirmation, and includes a seeded scenario where observing a black raven *lowers* the probability of "all ravens are black" due to a non-zero prior for "no ravens exist." The design includes rules, team structure, chip economy, a worked example, timeline, debrief, and troubleshooting.

  ---

  ### **Game Overview**
  - **Objective**: Students experience how observations confirm "all ravens are black" differently based on sampling context.  
  - **Core mechanic**: Students set market prices (in play chips) for a contract paying 100 chips if "every raven in the Blackfen reserve is black" is true. Prices reflect subjective probabilities. Observations (sampled objects) update beliefs.  
  - **Key moments**:  
    1. **Non-raven observation**: Worth little in the large world, but significant in the small reserve.  
    2. **Black raven observation**: *Lowers* probability if "no ravens" was initially plausible.  
  - **Hypothesis (H)**: "Every raven in the Blackfen reserve is black." Equivalent to "All non-black things in the reserve are non-ravens" (equivalence condition).  

  ---

  ### **Rules and Team Structure**
  #### **Teams and Roles**
  - **24 students split into 4 teams of 6**:  
    - **Team A1 & A2**: "Large world" (Deck A). Non-ravens vastly outnumber ravens.  
    - **Team B1 & B2**: "Small reserve" (Deck B). Small, closed population; all objects matter.  
  - **Each team has**:  
    - **1 Trader**: Sets prices for H after group discussion.  
    - **1 Recorder**: Tracks prices and updates on a shared board.  
    - **4 Bettors**: Bet for/against H using chips (others advise). Rotate roles per round.  
  - **Instructor role**: Samples observations, enforces rules, settles payouts.

  #### **Chip Economy**  
  - **Starting chips**: 100 per student (use poker chips: white = 1, red = 5, blue = 10).  
  - **Contract**: Pays 100 chips if H is true; worth 0 if false.  
  - **Pricing**:  
    - Pre-observation: Traders set a price for H (e.g., 40 chips = 40% probability).  
    - Bettors buy/sell contracts at this price.  
    - Post-observation: Price resets; bets reopen.  
  - **Payouts**: Settled in chips after the game.  
  - **Scoring**: Students aim to maximize chips (incentivizes honest probabilities).

  #### **Decks and Sampling Frames**  
  - **Deck A (Large World)**: 100 cards.  
    - 98 non-ravens (49 black shoes, 49 white shoes).  
    - 2 ravens (1 black, 1 white).  
    - **Context**: Non-ravens dominate → white shoes are uninformative.  
  - **Deck B (Small Reserve)**: 10 cards.  
    - 8 non-ravens (4 black shoes, 4 white shoes).  
    - 2 ravens (1 black, 1 white).  
    - **Context**: Small population → white shoes are informative.  
  - **Seeded scenario**: Before Round 3, both decks are modified:  
    - Add 1 "NO RAVENS" card (represents a reserve with only non-ravens).  
    - Remove all raven cards (decks now have 99 non-ravens + "NO RAVENS" for A, 9 non-ravens + "NO RAVENS" for B).  
    - **Effect**: Prior for "no ravens" is high (10% for A, 10% for B). First raven observation is likely bad news.  

  #### **Game Rounds**
  1. **Round 1 (Baseline)**: Observe a white shoe (non-black non-raven).  
  2. **Round 2**: Observe a black raven.  
  3. **Round 3 (Seeded)**: After adding "NO RAVENS," observe a black raven.  
  - **Sampling**: Instructor shuffles and draws one card per round (with replacement; decks reset post-draw).  

  ---

  ### **Worked Example: Priors, Likelihoods, and Posteriors**
  #### **Assumptions**  
  - Students start with uniform priors over possible reserves (simplified for in-class calculation).  
  - **H true**: All ravens are black (or no ravens).  
  - **H false**: At least one non-black raven.  

  #### **Deck A (Large World) Calculations**
  | **State**       | **Prior P(state)** | **P(white shoe \| state)** | **P(black raven \| state)** | **Notes** |  
  |-----------------|--------------------|----------------------------|-----------------------------|-----------|  
  | No ravens (H true) | 0.1              | 49/99 ≈ 0.495              | 0 (no ravens)               | 99 non-ravens (49 white shoes) |  
  | All ravens black (H true) | 0.8            | 49/100 ≈ 0.490             | 1/100 = 0.01                | 98 non-ravens (49 white) + 1 black raven |  
  | Some non-black raven (H false) | 0.1          | 49/100 ≈ 0.490             | 0 (raven is white)          | 98 non-ravens (49 white) + 1 white raven |  

  - **Round 1: White shoe observed**  
    - Unnormalized posterior:  
      - No ravens: \( 0.1 \times 0.495 = 0.0495 \)  
      - All black: \( 0.8 \times 0.490 = 0.392 \)  
      - Non-black raven: \( 0.1 \times 0.490 = 0.049 \)  
    - Normalizer: \( 0.0495 + 0.392 + 0.049 = 0.4905 \)  
    - **Posterior P(H)**: \( (0.0495 + 0.392) / 0.4905 \approx 0.901 \) (vs. prior 0.90).  
    - **Effect**: Barely changes → students set price ~90 chips.  

  - **Round 2: Black raven observed**  
    - Unnormalized posterior:  
      - No ravens: \( 0.1 \times 0 = 0 \)  
      - All black: \( 0.8 \times 0.01 = 0.008 \)  
      - Non-black raven: \( 0.1 \times 0 = 0 \)  
    - **Posterior P(H)**: \( 0.008 / 0.008 = 1.0 \) (vs. prior 0.90).  
    - **Effect**: Jumps to 100% → price ~100 chips.  

  - **Round 3 (Seeded): Black raven after "NO RAVENS" added**  
    - New prior (post-seeding): P(no ravens) = 0.1, P(H true) = 0.1 (no ravens only), P(H false) = 0.  
    - Observation: Black raven (now possible; ravens reintroduced).  
    - Likelihood:  
      - No ravens: 0 (contradiction)  
      - All black: \( 1/100 = 0.01 \)  
      - Non-black raven: 0 (not in deck)  
    - Unnormalized posterior:  
      - All black: \( 0.1 \times 0.01 = 0.001 \)  
      - Non-black raven: 0  
    - Normalizer: 0.001  
    - **Posterior P(H)**: \( 0.001 / 0.001 = 1.0 \) (but prior was 0.1!) → *Seems to confirm, but wait...*  

  #### **Deck B (Small Reserve) Calculations**
  | **State**       | **Prior P(state)** | **P(white shoe \| state)** | **P(black raven \| state)** | **Notes** |  
  |-----------------|--------------------|----------------------------|-----------------------------|-----------|  
  | No ravens (H true) | 0.1              | 4/10 = 0.4                 | 0 (no ravens)               | 10 non-ravens (4 white shoes) |  
  | All ravens black (H true) | 0.8            | 4/10 = 0.4                 | 1/10 = 0.1                  | 8 non-ravens (4 white) + 1 black raven |  
  | Some non-black raven (H false) | 0.1          | 4/10 = 0.4                 | 0 (raven is white)          | 8 non-ravens (4 white) + 1 white raven |  

  - **Round 1: White shoe observed**  
    - Unnormalized posterior:  
      - No ravens: \( 0.1 \times 0.4 = 0.04 \)  
      - All black: \( 0.8 \times 0.4 = 0.32 \)  
      - Non-black raven: \( 0.1 \times 0.4 = 0.04 \)  
    - Normalizer: \( 0.04 + 0.32 + 0.04 = 0.40 \)  
    - **Posterior P(H)**: \( (0.04 + 0.32) / 0.40 = 0.90 \) (vs. prior 0.90).  
    - **Effect**: No change → price ~90 chips.  

  - **Round 2: Black raven observed**  
    - Unnormalized posterior:  
      - No ravens: 0  
      - All black: \( 0.8 \times 0.1 = 0.08 \)  
      - Non-black raven: 0  
    - **Posterior P(H)**: \( 0.08 / 0.08 = 1.0 \) (vs. prior 0.90).  
    - **Effect**: Jumps to 100% → price ~100 chips.  

  - **Round 3 (Seeded): Black raven after "NO RAVENS" added**  
    - New prior (post-seeding): P(no ravens) = 0.1, P(H true) = 0.1 (no ravens only), P(H false) = 0.  
    - Observation: Black raven.  
    - Likelihood:  
      - No ravens: 0  
      - All black: \( 1/10 = 0.1 \)  
    - Unnormalized posterior:  
      - All black: \( 0.1 \times 0.1 = 0.01 \)  
    - Normalizer: 0.01  
    - **Posterior P(H)**: 1.0 (but prior was 0.1).  
    - **Problem**: This doesn’t show disconfirmation! **Fix**: Use a state with mixed ravens.  

  #### **Revised Seeded Scenario for Disconfirmation**
  - **Before Round 3, for both decks**:  
    - Add 1 "NO RAVENS" card.  
    - **Also add**: 1 "MIXED RAVENS" card (1 black raven + 1 white raven; H false).  
    - Remove other raven cards.  
  - **New prior (Deck B example)**:  
    - P(no ravens) = 0.4  
    - P(all black) = 0 (no "all black" state)  
    - P(mixed ravens) = 0.6  
    - **P(H true) = P(no ravens) = 0.4** (since "all black" is impossible).  

  - **Round 3: Black raven observed (Deck B)**  
    - Likelihood:  
      - No ravens: 0 (no ravens to observe)  
      - Mixed ravens: P(draw black raven) = 1/10 (1 black raven in 10 objects).  
    - Unnormalized posterior:  
      - Mixed ravens: \( 0.6 \times 0.1 = 0.06 \)  
    - Normalizer: 0.06  
    - **Posterior P(H)**: P(no ravens \| data) = 0 (since data contradicts no ravens).  
    - **P(H true)** = 0 (H requires no ravens or all black ravens; both falsified).  
    - **Effect**: Prior P(H) = 0.4 → Posterior P(H) = 0. Price crashes to 0.  

  #### **Why Shifts Are Noticeable**  
  - **Large vs. small reserve**:  
    - White shoe: In Deck A, P(H) shifts by ≤1% (e.g., 90% → 90.1%). In Deck B, shifts are 5–10% (e.g., 90% → 85% or 95%).  
  - **Black raven (seeded)**: P(H) drops from 40% to 0% (Deck B) or 10% to 0% (Deck A).  
  - Students see chip payouts change dramatically (e.g., a 40-chip price becomes worthless).  

  ---

  ### **Timeline (75 Minutes)**  
  - **0:00–0:10** - **Setup (10 min)**: Assign teams/roles, distribute chips, explain rules. Emphasize: "Prices reflect your belief in H."  
  - **0:10–0:25** - **Round 1: White shoe (15 min)**:  
    - Sample white shoe from both decks.  
    - Teams set pre-observation prices (priors), bet, then update prices (posteriors).  
    - Recorders post prices: Deck A/B prices barely change (large world) vs. shift noticeably (small reserve).  
  - **0:25–0:40** - **Round 2: Black raven (15 min)**:  
    - Sample black raven.  
    - Prices jump toward 100 in both decks (confirms H).  
  - **0:40–0:50** - **Seed Decks (10 min)**: Add "NO RAVENS" and "MIXED RAVENS" cards; explain new priors.  
  - **0:50–1:05** - **Round 3: Black raven (seeded) (15 min)**:  
    - Sample black raven.  
    - Prices crash to near 0 (disconfirms H; "no ravens" eliminated, H false revealed).  
  - **1:05–1:15** - **Settle Payouts (10 min)**: Instructor resolves contracts based on true state (e.g., H false in seeded scenario).  
  - **1:15–1:25** - **Debrief (10 min)**: Tie to paradox (see below).  

  ---

  ### **Debrief: Tying Game to the Paradox**  
  - **Nicod’s criterion (Round 1)**:  
    - "A black raven confirms H; a white shoe does not."  
    - **Game reflection**: In Round 1, white shoes *did* confirm H (posterior > prior), but barely in Deck A. In Deck B, confirmation was stronger.  
    - **Key point**: Nicod ignores context. White shoes *are* confirming, but sampling frame (non-raven abundance) determines *how much*.  

  - **Equivalence condition (Rounds 2–3)**:  
    - "H ≡ All non-black things are non-ravens. A white shoe confirms H just as a black raven does."  
    - **Game reflection**: In Round 2, black ravens strongly confirmed H. In Round 3, they *disconfirmed* H due to prior ("no ravens" was a way H could be true).  
    - **Key point**: Equivalence holds logically, but evidentiary weight depends on priors and sampling. Observing a black raven *eliminated* "no ravens," exposing H’s falsehood.  

  - **Takeaway**: Confirmation is not pure logic; it depends on:  
    - **Sampling frame**: Non-ravens are noise in large worlds, signal in small reserves.  
    - **Priors**: "No ravens" makes black ravens risky evidence.  

  ---

  ### **Predictable Problems and Fixes**  
  1. **Problem**: Students don’t update prices realistically (e.g., ignore Bayes).  
     - **Fix**: Provide a "cheat sheet" with Bayes’ formula: \( P(H|data) \propto P(data|H) \times P(H) \). Do a practice round.  

  2. **Problem**: Seeded scenario (Round 3) causes confusion ("Why did H become false?").  
     - **Fix**: Pre-game: Clarify that "no ravens" makes H *vacuously true*. Observing a raven eliminates this possibility.  

  3. **Problem**: Chip trading distracts from probability updates.  
     - **Fix**: Simplify betting: Traders set one price per round; bettors trade 1–2 contracts max.  

  4. **Problem**: Time runs out during calculations.  
     - **Fix**: Use pre-calculated posteriors (see tables) as "answer keys" if groups stall.  

  ---

  ### **What the Game Cannot Capture**  
  - **The logical core of the paradox**:  
    - The game shows why context *explains away* the paradox (e.g., white shoes confirm weakly). But it doesn’t reproduce the *logical unease* of equivalence—why *should* a white shoe confirm at all?  
    - **What you must supply**:  
      > "Equivalence makes white shoes confirming instances *in principle*. But in practice, we care about *efficient* evidence. Testing 'all ravens are black' by seeking ravens is better because non-ravens are plentiful and uninformative. The game shows why, but you must feel the tension: Logic says one thing; pragmatism says another."  

  ---

  This design forces students to confront how sampling frames and priors shape confirmation, making the paradox visceral. The seeded scenario ensures they experience disconfirmation from a "confirming" observation, and chip losses make it memorable.
