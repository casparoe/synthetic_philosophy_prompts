  4. Students might question the prior. Why such a high prior for State0? We can explain that in some contexts, it might be plausible that there are no ravens.

  Which feature of the paradox no betting game can reproduce?

  The betting game models the degree of confirmation as a change in probability. However, the original paradox is about logical confirmation: by the equivalence condition, a white shoe should confirm the hypothesis just as much as a black raven. The betting game shows that in practice, the context (the sampling frame and the prior) matters. But it does not directly address the logical point. The logical point is that the equivalence condition is valid, but that does not mean that every confirming instance is equally strong. The betting game cannot reproduce the pure logical relationship; it can only show the pragmatic, context-dependent nature of confirmation.

  You must supply the point that logically, the white shoe is a confirming instance, but that does not mean it is a good one. The betting game shows why it is not always a good one.

  Rules and team structure:

  - Split class into two halves: Team A (large world) and Team B (small reserve). Each team has about 12 students.
  - Within each team, split into groups of 3. So 4 groups per team.
  - Each group gets a handout for their team's scenario (Deck A or B) that lists the states, the prior, and the composition of the reserve in each state.
  - They also get a worksheet to do the calculations.

  Chip economy:

  We will not use chips for this version because we are not doing a market. We are having them compute probabilities. If you want to use chips, we can have them bet on the probability. We can do a simple version: have them state their probability as a price for a contract that pays 100 if H is true. Then at the end, we reveal the true state and they get or lose chips. But we haven't fixed the true state? We fixed it for the deck, but they don't know it. We can reveal it at the end.

