     So for Round 2, they start with the same prior (0.6) and then see a black raven.

     Then they do the calculation for just that observation.

     For both teams, they will get 0.25.

  40-50 min: Groups compute the posterior for Round 2.

  50-55 min: Report and compare. Both teams see a drop from 0.6 to 0.25.

  55-75 min: Debrief.

  Debrief:

  - Start by noting that in Round 1, the same observation (non-black non-raven) had a much larger effect in the small reserve than in the large reserve. Why? Because in the small reserve, every observation is a larger fraction of the whole. This relates to the idea that in a large world, there are so many non-ravens that seeing one more white shoe doesn't change our beliefs about ravens. But in a small reserve, each observation is more informative.

  - This connects to Nicod's criterion: a confirming instance is an object that is a raven and black, or a non-raven and non-black. But the degree of confirmation depends on the context.

  - The equivalence condition says that "All ravens are black" is equivalent to "All non-black things are non-ravens". So a white shoe (non-black non-raven) should confirm the hypothesis. And it does, but very little in a large world.

  - In Round 2, both teams saw that a black raven disconfirmed the hypothesis. This is because they had a high prior probability that there are no ravens at all (State0). In State0, the hypothesis is true (vacuously). Observing a black raven means that State0 is no longer possible, and we are left with states that have ravens. But we haven't confirmed that all ravens are black. In fact, in the posterior, the probability of H is only 0.25 because the state with two ravens (one black and one non-black) is now more likely than the state with one black raven.

