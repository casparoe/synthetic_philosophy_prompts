  ## VERIDIAN PREDICTIVE CAPITAL  
  HUMAN PERFORMANCE CALIBRATION PACKET  
  Q4 FY2023  
  **Employee:** Anya Sharma, Junior Quantitative Analyst  
  **Reviewer:** Martin Finch, Sr. Lead, Alpha Generation Pod  
  **Calibration Committee:** L. Dubois (Chair, Human Oversight), R. Chen (Process Assurance), D. Vance (Senior Trader)  

  **MANAGER'S NARRATIVE:**  
  Anya demonstrated consistent adherence to Veridian's Procedural Integrity Framework (PIF v3.1) throughout Q4. Her daily Decision Rationale Traces (DRTs) exhibited commendable structure, particularly in her use of mandated pre-trade correlation matrices (Form 7b) and post-trade epistemic closure reports. While her final P&L impact for the quarter was neutral (+0.2% net), her commitment to transparent process warrants recognition.

  However, several calibration flags emerged. On 11/17, Anya executed a highly profitable short position on Kronos Minerals (KRON) based on a "persistent divergence in order book flow vs. fundamentals sentiment" (DRT Log #1147). Her trace documented the *outcome* of this divergence but crucially lacked granular decomposition of the *specific cognitive steps* identifying the initial anomaly. The PIF requires at least three documented intermediate inference stages before action. Her DRT jumped from "Observed Level 2 data irregularity" directly to "High conviction short signal" without the requisite intermediary "Hypothesis Generation" and "Counterfactual Stress-Testing" stages. While profitable, this bypass of documented reasoning constitutes a significant Process Deviation (Category 2).

  Conversely, her meticulously documented long thesis on Vector Dynamics (VECD) exemplified PIF adherence. The 37-step DRT (#1208), including Bayesian probability trees, multi-factor sensitivity analyses, and three distinct scenario visualizations, received a "Exceeds" Process Fidelity score from the annotators. The subsequent -15% move in VECD following their FDA rejection does not factor into her process rating, as outcomes are explicitly excluded per Policy HO-7. The strength of the *documented reasoning trace* remains the evaluative ground truth.

  Anya requires coaching on embedding intuitive leaps within the PIF-mandated scaffolding. Her raw pattern recognition ability is noted but must be channeled through compliant epistemic decomposition. **Recommendation: "Meets Expectations"** pending improved intermediate step documentation.  

  **PROCESS FIDELITY RUBRIC (Excerpt: Hypothesis Generation Stage)**
  | Evaluation Dimension          | Does Not Meet (1)           | Meets Expectations (2)                  | Exceeds Expectations (3)                     |
  | :---------------------------- | :-------------------------- | :-------------------------------------- | :------------------------------------------- |
  | **Epistemic Scaffolding**     | Jumps to conclusion; lacks identifiable inference steps. | Documents 1-2 clear, discrete inference steps linking data to hypothesis. | Documents 3+ inference steps with explicit logical connective tissue; identifies potential cognitive biases. |
  | **Trace Completeness**        | Major stages missing; rationale gaps evident. | All mandatory PIF stages present; minor documentation omissions. | Exceeds mandatory stages; includes auxiliary justification/alternative reasoning paths. |
  | **Annotator Clarity Score**   | ACS < 65 (High ambiguity)   | ACS 65-84 (Minimal ambiguity)           | ACS >= 85 (Near-zero ambiguity; self-evident reasoning) |
  | **Sharma (KRON Trade)**       | **1** - Lacked documented intermediary steps between observation and conviction. |                                         |                                              |
  | **Sharma (VECD Trade)**       |                             |                                         | **3** - Exceptional step decomposition & auxiliary paths documented. |
  | **Peer (T. Reynolds, VECD)**  |                             | **2** - Steps present but connective tissue weak (ACS 72). |                                              |

  **CALIBRATION COMMITTEE NOTES (Abridged):**
  *   **Chen (Process Assurance):** Concur with Finch on KRON Process Deviation. Profitability irrelevant to PIF adherence. VECD trace exemplary (ACS 91!), textbook "Exceeds" despite outcome. Anya's raw ability needs PIF compliance harness. **Support "Meets."** Note: Reynolds' VECD trace scored lower due to weaker connective justification, though his *actual* loss was smaller. Correct calibration.
  *   **Vance (Senior Trader):** KRON move was obvious *if* you've watched book flow for a decade. But how do you *document* spotting "it just looks fake"? Sharma didn't crack the PIF code for that. VECD doc was beautiful. Shame about the stock. Reynolds... *sigh*. His docs are pristine. Always. Almost *too* clear. Like he writes the story *after*. But you can't mark down perfect paperwork. **"Meets" for Sharma.**
  *   **Dubois (Chair, HO):** Committee alignment achieved. Sharma: **"Meets Expectations"**. Key growth area: Decomposing intuitive pattern-matches into auditable inference chains. Reynolds (VECD trade) rated "Meets" per rubric, correct per trace quality despite smaller loss. Outcome independence maintained. Note: Process Assurance headcount requires increase (+3 FTE requested) to maintain annotation velocity; current 48hr avg. DRT review latency impacts bonus cycle timing.  

  **MEMO: HUMAN OVERSIGHT DIRECTOR'S Q1 INITIATIVE**
  *From: L. Dubois, Head of Human Oversight*
  *To: All Veridian Predictive Capital Staff*
  *Subject: Evolution Towards Pure Process Equity*

  Veridian's pioneering shift from outcome-based to process-supervised performance has yielded significant gains in transparency, reduced evaluative bias, and mitigated the rewarding of mere luck ("dumb P&L"). However, residual outcome-proxies still subtly influence our system. Most notably, the "ground truth" labels used by our Process Standards Committee to define "correct" procedural steps were initially derived *by correlating historical high-fidelity reasoning traces with subsequent profitable outcomes*.

  To achieve true process purity, Human Oversight will lead Project GroundTruth Refresh (GTR) in Q1. GTR will:
  1.  **Decouple Step Validation:** Eliminate the historical outcome-linked basis for step validity. New "correct" procedural sequences will be defined solely by internal consistency, adherence to first-principles logic frameworks, and consensus from the Process Standards Committee (using refreshed, outcome-agnostic epistemic rubrics).
  2.  **Eliminate the P&L Artifact:** Cease the publication of desk- and individual-level P&L statements. These vestigial metrics create noise, introduce unfair comparative pressures, and can subtly influence annotator scoring despite protocols. Profit & Loss will be treated as an uncontrolled environmental variable, irrelevant to individual performance assessment.
  3.  **Enhance Narrative Depth:** Mandate deeper "Meta-Cognitive Justification" layers in all DRTs (Form 9a), requiring analysts to document their awareness of potential cognitive biases *during* each inference step, not just post-hoc.

  This evolution ensures Veridian evaluates humans *solely* on the controllable, replicable quality of their documented reasoning process, creating the fairest, most equitable evaluation system possible. P&L, as a lagging, noisy indicator polluted by market randomness, has no place in a modern, integrity-focused talent system. Bonus pools will be allocated strictly based on final, calibrated Process Fidelity Scores derived from the GTR-refreshed framework.  

  *Laurence Dubois*
  *Head of Human Oversight*
  *Veridian Predictive Capital: Where Process is Profit™*
