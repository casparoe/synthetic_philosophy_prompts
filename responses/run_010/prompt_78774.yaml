  The core argument about "constituted strata" is fascinating. It attempts to carve out a third category between confounders and mediators - variables that are both causal products of treatment and proxies for pre-treatment risk. The ambulance dispatch example is cleverly constructed to expose this ambiguity. I notice the user anticipates objections about principal stratification, which suggests they've done their homework.

  Technically, I need to verify several claims: First, their assertion about collapsibility of risk difference versus odds ratio seems correct for binary covariates without effect modification, but I should flag the boundary conditions. Second, the claim that odds ratio attenuation can't cause sign reversal alone requires careful handling - it's true under homogeneity but may not hold with effect modification. 

  The novelty question is thorny. While "constituted stratum" isn't standard terminology, the underlying issue resembles what Hernán calls "selection bias after conditioning on a collider" or Pearl's "conditioning on a mediator affected by unmeasured confounders." But the user's framing through policy relevance and measurement invariance feels fresh. The principal stratification objection they anticipate could be defused by noting that principal strata are often unobservable in practice.

  For the example's coherence: mathematically, their described reversal is absolutely possible. If Protocol A upclassifies marginal cases to Tier 1, then within Tier 1, A gets relatively healthier patients than B. This creates Berkson's paradox-like bias favoring B in stratified comparisons. I should suggest they include a small numerical illustration in footnotes to cement this.

  The normative principle about stratifying only on intervention-invariant variables seems sound but needs qualification. There are edge cases like surrogate endpoints in clinical trials where we deliberately condition on treatment-affected biomarkers - but those are exceptions that prove the rule.

  Economy-wise, Section 4's second paragraph is indeed repetitive. I'll suggest collapsing the mediator rebuttals and moving the invariance principle earlier as a positive proposal rather than conclusion. The tone does occasionally veer toward "why hasn't anyone noticed this?" - particularly in Section 3's "structurally distinct" claim. Softening to "less commonly articulated" would help.

  The most likely committee pushback will focus on whether this is just a special case of mediator bias with extra steps. My defense would be: no, because the justification for conditioning differs fundamentally. We condition on mediators to block paths, but here we condition because we mistake the variable for a pre-treatment covariate. The policy context makes this distinction consequential.

  Practical constraints are clear: no new references, no vague encouragement. They want surgical critique. I'll structure my response to mirror their numbered questions precisely, with the technical audit as Section A since it underpins everything else. The ambulance example stays - it's elegant and fit-for-purpose.
answer: |-
  Here’s a line-by-line technical audit, followed by answers to your questions in order. I’ve prioritized clarity and bluntness.  

  ### **Technical Audit of Draft Sections 3–4**  
  *(Key: ⚠️ = Problematic | ✓ = Acceptable)*  

  #### **Section 3**  
  - *"A confounder is a common cause of treatment and outcome... conditioning on it is required"*  
    ⚠️ **Imprecise:** Conditioning is only required if the confounder induces bias (e.g., not for instrumental variables). Add: *"...when it induces spurious association"*.  
  - *"A mediator is an effect of treatment... conditioning on it is forbidden"*  
    ✓ **Correct** for total effects but clarify: *Conditioning blocks path-specific effects; forbidden if estimating total effect*.  
  - *"Simpson's paradox is presented as a warning about [confounders/mediators]"*  
    ✓ **True**, but note: Reversal can also occur from selection bias (e.g., conditioning on a collider).  
  - *"S is a constituted stratum if: (1) S is downstream of T, (2) S proxies a pre-T feature"*  
    ⚠️ **Needs sharpening:** Specify *why* S is the "only available measurement" (e.g., no gold-standard pre-T measure exists).  
  - *"Conditioning on S does not restore exchangeability"*  
    ✓ **Correct:** S is not a confounder (no backdoor path blocked).  
  - *"It is not simply a mediator... we condition because S tracks pre-T risk"*  
    ⚠️ **Ambiguous:** Distinguish from *proxy confounders* (e.g., error-prone pre-T measures). Clarify: *S is corrupted by T’s influence on measurement*.  

  #### **Section 4**  
  - *"Protocol A assigns more calls to Tier 1... B’s Tier 1 is sicker"*  
    ✓ **Internally consistent:** Reversal arises if:  
    - A’s Tier 1 has lower risk than B’s Tier 1 (due to over-classification).  
    - Pooled data favor B (if A gets more high-risk patients overall).  
  - *"Within-tier comparisons favor B... pooled data favor B"*  
    ⚠️ **Unclear:** Specify the direction of bias. *If A upclassifies healthy patients, within-Tier 1 comparisons favor B (A’s Tier 1 is healthier), amplifying pooled bias*.  
  - *"The tier is not on a causal path... assigning Tier 2 doesn’t kill"*  
    ✓ **Valid** if tier assignment is non-causal (purely descriptive).  
  - *"The marginal contrast is the only well-defined quantity"*  
    ⚠️ **Overstrong:** Alternatives exist (e.g., principal stratification). Acknowledge but argue they’re impractical here.  
  - *"Stratification licensed only by variables invariant under interventions"*  
    ⚠️ **Normative claim:** Not strictly true (e.g., surrogates). Frame as *"generally necessary for unbiased effect estimation"*.  

  ---

  ### **Answers to Your Questions**  

  #### **1. Technical Audit (Collapsibility Claims)**  
  - *Risk difference (RD):*  
    ✓ **Correct:** Under randomization + homogeneous effects, crude RD = weighted average of stratum RDs. Sign reversal requires stratum effects of opposite signs (or confounding).  
  - *Odds ratio (OR):*  
    ⚠️ **Partially true:** Non-collapsibility *attenuates* OR toward null under homogeneity with a single binary covariate.  
    **But:** With multiple covariates or effect modification, non-collapsibility *can* cause sign reversal (e.g., if baseline risks differ massively across strata).  
    **Recommendation:** Drop the claim that non-collapsibility alone "cannot generate reversal." State: *"While non-collapsibility typically attenuates ORs, sign reversal in the absence of confounding is rare and requires extreme effect heterogeneity or distributional imbalance."*  

  #### **2. Novelty: Is "Constituted Stratum" a Real Category?**  
  - **Strongest deflationary objection:**  
    *"This is mediator bias in disguise. Conditioning on a post-treatment variable (tier) induces selection bias because it is a collider (T → S ← U), where U is unmeasured severity. Your 'constituted stratum' is just a mediator/collider affected by unmeasured confounders. Principal stratification (conditioning on potential tier assignments under both protocols) resolves this."*  
  - **Your defense:**  
    - **Distinction:** A mediator blocks a causal path; a constituted stratum corrupts pre-T measurement. The problem isn’t blocking paths (mediator) or colliders (selection bias), but *misclassifying units* due to T-dependent measurement error.  
    - **Principal stratification rebuttal:** Principal strata (e.g., "always-Tier-1") are *counterfactual* and often unidentifiable. Your point is *practical*: When S is the *only observable* risk adjuster, conditioning distorts comparisons. Argue: *"Principal stratification is theoretically sound but unusable here—dispatchers can’t report counterfactual tiers."*  
    **Verdict:** Novel if framed as **treatment-induced measurement confounding**. Yes, it can be answered.  

  #### **3. Example Coherence**  
  - **Does the reversal work?** Yes, with this numeric example:  

  | Group | Protocol | % Tier 1 | Tier 1 Survival | Tier 2 Survival | Pooled Survival |  
  |-------|----------|----------|-----------------|-----------------|-----------------|  
  | A     | Sensitive | 50%      | 70% (healthier) | 90%             | 80%             |  
  | B     | Selective | 20%      | 50% (sicker)    | 90%             | 82%             |  

  - Pooled: B > A (82% > 80%)  
  - Tier 1: A > B (70% > 50%)  
  - Tier 2: A = B (90% = 90%)  
  **Reversal direction:** Pooled favors B, stratified favors A (opposite sign).  
  **Bias source:** Tier 1 under A includes healthier patients than Tier 1 under B.  

  #### **4. Normative Principle: Invariance**  
  - **Does it follow?** Partly. The diagnosis implies conditioning on S *changes the estimand*, but the principle ("only invariant variables") is stronger.  
  - **Counterexamples:**  
    - **Surrogate endpoints:** In trials, we stratify by treatment-affected biomarkers (e.g., CD4 count) to assess mechanism.  
    - **Policy targeting:** If protocols *should* affect triage (e.g., prioritizing high-risk groups), stratified effects matter.  
  - **Recommendation:** Soften to: *"Stratification on non-invariant variables answers a different question: not 'What is the effect of T?' but 'What is the effect of T for units with a fixed S-value?'. For protocol choice, the latter may be misleading."*  

  #### **5. Economy**  
  - **Cut:**  
    - Section 4, second paragraph (repeats mediator rebuttal).  
    - Redundant phrases in Section 3 (e.g., "neither bin applies cleanly" after defining bins).  
  - **Expand:**  
    - *Why* S can’t be a confounder/mediator (1–2 sentences).  
    - Alternative estimands (e.g., marginal effect vs. effect within principal strata).  
  - **Section 4’s second paragraph:** Cut it. The first paragraph suffices.  

  #### **6. Register: Avoiding "Overlooked Obvious" Tone**  
  - **Problematic lines:**  
    - *"this dichotomy leaves out a case... not a marginal hybrid but structurally distinct"* → Sounds dismissive.  
    - *"the obvious response... fails"* → Condescending.  
  - **Fix:**  
    - *"This dichotomy may not fully capture cases..."*  
    - *"While one response might be to treat S as a mediator, this overlooks..."*  

  #### **7. Most Likely Committee Feedback**  
  *"Your 'constituted stratum' is an insightful framing of treatment-induced measurement confounding, but it’s not entirely distinct from mediator/selection bias. The ambulance example compellingly shows how standard stratification fails when the adjuster is protocol-dependent. However, your invariance principle overreaches—there are valid reasons to condition on non-invariant variables (e.g., mechanistic queries). Tighten definitions and clarify why principal strata don’t solve this in practice."*  
  **Fatal?** No. Addressable with revisions.  

  ---  

  ### **Summary of Revisions**  
  1. **Fix technical claims:** Weaken OR reversal claim; clarify collapsibility assumptions.  
  2. **Defend novelty:** Emphasize *measurement corruption* (vs. path blocking/collider bias); contrast with principal stratification.  
  3. **Keep the example:** Add a numeric table (as above) to Appendix.  
  4. **Reframe the principle:** Present as *"When stratification variables are treatment-dependent, conditional effects answer a different causal question."*  
  5. **Trim redundancy:** Cut Section 4’s second paragraph; tighten definitions.  
  6. **Soften tone:** Avoid implying prior work is incomplete; focus on "underspecified."  

  **Final note:** Your core insight is valuable—policy choices require effects *including* how protocols shape measurement. This is underdiscussed in foundational texts. With precise definitions and moderated claims, it will strengthen your thesis.
