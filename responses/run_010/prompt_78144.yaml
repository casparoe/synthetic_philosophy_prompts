     - **B)** No, they are fundamentally different. → Go to 5  

  2. **Sphere Case:** Can a complete description of what exists at one instant (including all properties) distinguish a spinning homogeneous iron sphere from an identical stationary one?  
     - **A)** Yes. → Go to 3  
     - **B)** No. → Go to 3  

  3. **Time Traveler Case:** When a time traveler and their younger self shake hands, how many people are in the room?  
     - **A)** Two. → Go to 4  
     - **B)** One. → Go to 6  

  4. **Time Traveler Composition:** In the time traveler case, if there are two people, are they...  
     - **A)** Two separate objects linked by a special relation. → Leaf: Stage Theory  
     - **B)** Parts of a single larger object spanning time. → Leaf: Perdurantism  

  5. **Intermittence Case:** Can an object go out of existence and later return as the very same thing if the right continuity is restored?  
     - **A)** Yes. → Leaf: Intermittent Existence  
     - **B)** No. → Go to 7  

