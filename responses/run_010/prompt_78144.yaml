     - **C)** The question is misguided; reject the demand. → Leaf: Vague Composition  

  8. **Verbal Case:** Are the two descriptions (one about a persisting lectern, one about a series of momentary lecterns) just different ways to describe the same thing?  
     - **A)** Yes, they are equivalent. → Leaf: Verbalism  
     - **B)** No, they describe different realities. → Go to 9  

