  ### Photocopiable Flowchart (Key Stripped Out)

  **Start:** We agree that the lectern today is the very same lectern that was here when the course began.

  1. **Poker Case:** A poker is straight on Monday and bent on Tuesday. Is this difference in shape over time just like a poker being straight at one end and bent at the other at a single moment?  
