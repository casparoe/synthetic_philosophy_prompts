  First, I consider the guest's framework: she rejects the fixed-preference binary, emphasizes institutional shaping of preferences, questions standard equality indices for circularity, and argues justice concerns pay/esteem hierarchies rather than ratios. The empirical literature has controversies around measurement validity and alternative explanations like stereotype strength. 

  The user's constraints are clear: avoid generic questions; ensure accessibility for lay listeners; structure sequentially from empirical → conceptual → normative → policy; include nine specific required elements; and preempt the guest's deflection tactic. Each question needs a concise script, predicted answer, and targeted follow-up.

  I'll start with the empirical foundation since the correction episode exposes methodological flaws without being confrontational. Question 1 can address measurement validity by asking about the gap between reported STEM "likelihood" versus actual degrees - this sets up the replication crisis naturally. The predicted deflection ("assumes fixed preferences") can be countered by focusing on measurement practices.

  For the conceptual core, Question 3 tackles institutional shaping of preferences. The follow-up must pressure how "free choice" retains meaning if preferences are institutionally responsive. This connects to Question 6's challenge about falsifiability - if social context always explains choices, does the theory become untestable?

  The normative pivot comes in Question 7 with her pay/esteem criterion. The feminization-pay depression paradox needs highlighting: if occupational sorting affects hierarchy, her distinction collapses. Question 8 then probes esteem measurement difficulties when surveys themselves reflect gendered sorting.

  Policy questions should avoid defensiveness. Question 9 concedes her view upfront before asking for concrete ministry actions - this bypasses theoretical debates for implementable steps. Finally, Question 10 demands a unique prediction to prevent deflection.

  Throughout, I'll use British English ("maths", "ministry of education") and embed explanations like "STEM stands for science, technology..." for accessibility. The structure builds logically while ensuring each required element is covered precisely once.
answer: |-
  Here are nine interview questions drafted to your specifications, ordered empirically → conceptual → normative → policy, with follow-ups keyed to predicted answers and all constraints met:

  **1. (Empirical/Literature Conduct)**  
  "Your book discusses studies showing larger gender gaps in STEM interest in more equal countries. But the original analysis used students' *stated likelihood* of STEM entry rather than actual degree data, which was later corrected. What should this episode teach us about how such research is designed and communicated?"  
  *If she says...* This shows how hidden measurement choices can distort findings when researchers assume preferences are fixed inner states.  
  *Follow-up:* But even after correction attempts, debates continue about valid metrics. If neither choice ratios nor stated interests reliably indicate 'true' preferences, what *should* researchers measure to test your institutional account?

  **2. (Circularity of Indices)**  
  "Standard gender-equality indices include outcomes like university enrolment gaps. Critics say this creates circularity: if equality *causes* choices, but equality metrics *include* those choices, the indices may be flawed. How does your institutional approach avoid this problem when defining 'relevant alternatives'?"  
  *If she says...* My account doesn't require a fixed equality metric; institutions define locally relevant options through structures like vocational pathways.  
  *Follow-up:* But if "relevant alternatives" vary by context, doesn't this make cross-national comparisons impossible? How can we judge if Norway offers better options than Saudi Arabia without a standard?

  **3. (Conceptual Core/Preference Formation)**  
  "You argue preferences aren't pre-social 'inner states' but responses to institutionally supplied options—like choosing engineering only if apprenticeships exist. Doesn't this imply 'free choice' depends entirely on the menu presented? What then distinguishes free choice from mere adaptation?"  
  *If she says...* Freedom lies in whether choices answer to *reasoned standards* within institutions, not in having unlimited options.  
  *Follow-up:* But if institutions shape both options *and* the standards for evaluating them, how can we ever call a choice unfree? Doesn't this risk making your view unfalsifiable?

  **4. (Stereotype Account Pushback)**  
  "Some studies suggest gender-equality paradox patterns arise because stereotypes—say, 'maths is male'—strengthen in developed countries. But why would stereotypes intensify where material barriers *lessen*? Doesn't this just push the puzzle back a step?"  
  *If she says...* Stereotypes function as institutional signals about 'fitting in', gaining salience when basic barriers fall away and identity concerns surface.  
  *Follow-up:* So are you saying stereotypes don't *distort* choices in your model, but instead *convey* institutional expectations? How would we test if a stereotype is oppressive rather than informative?

  **5. (Unit of Choice / Household Context)**  
  "Choices like part-time work or domestic roles often involve joint household bargaining under time constraints. If preferences form within institutions but the 'chooser' is a family unit negotiating scarcity, how does this reshape your individual preference account?"  
  *If she says...* Institutions structure household options too—e.g., parental leave rules shape bargaining power—so choices remain institutionally responsive.  
  *Follow-up:* Doesn't this make the 'preference' attribution even murkier? If a mother 'chooses' part-time work due to childcare costs, is that her preference, the household's, or a constraint-induced adaptation?

  **6. (Normative Criterion / Pay-Esteem)**  
  "You argue a 70-30 engineering gender split is unjust only if engineers have high pay/esteem, not if they're average-paid technicians. But if an occupation becomes majority-female, its pay and esteem often *fall*—as with teaching. Doesn’t this collapse your criterion into focusing on ratios after all?"  
  *If she says...* No, injustice arises when devaluation *follows* feminisation due to sexist hierarchies, not from the ratio itself.  
  *Follow-up:* But if we observe pay falling *whenever* women enter a field, how can we distinguish 'yoking to hierarchy' from mere correlation? What measurable threshold separates 'independent hierarchy' from ratio effects?

  **7. (Measuring Esteem)**  
  "Your justice criterion requires assessing an occupation's social esteem. But surveys measuring esteem may reflect existing gender biases—if society values 'male' fields more, esteem scores could simply track the gender sorting you bracket. How can we measure esteem objectively?"  
  *If she says...* We compare esteem *relative* to comparable roles—e.g., prestige of engineers vs. similarly skilled technicians in the same economy.  
  *Follow-up:* But if 'similarly skilled' is contested (e.g., nurses vs. paramedics), and if gendered perceptions inflate skill attributions, won't relative esteem measures still encode bias?

  **8. (Concession & Policy Action)**  
  "Assume your core claim is right: school choices respond to institutional signals, not fixed preferences. What *one policy* should ministries of education abandon tomorrow, and what tangible step should they start, to better structure options?"  
  *If she says...* Stop 'encouraging girls into STEM' via role-model talks implying preferences are innate; start integrating career-relevance into all subjects so choices engage with real institutional pathways.  
  *Follow-up:* Wouldn't integrating career-relevance risk *amplifying* existing gendered perceptions? If girls see physics linked to male-dominated engineering, might this backfire?

  **9. (Falsifiable Prediction / Anti-Deflection)**  
  "The fixed-preference picture predicts that removing barriers—like maths tutoring for girls—will shrink choice gaps. What specific, observable outcome does *your* institutional account predict after such interventions, that the fixed-preference view would not expect?"  
  *If she says...* We’ll see gaps *persist or reconfigure* as choices align more clearly with institutionally signalled paths—e.g., more girls excel in maths but choose biology over engineering if the latter’s culture remains exclusionary.  
  *Follow-up:* But doesn't the fixed-preference view also expect slow change if 'culture' is sticky? What quantitative benchmark would clearly distinguish your prediction from theirs?

  ---

  **Key Design Notes:**  
  - **British English:** "maths", "ministry of education", "yoking", "timetable" (implied in policy action).  
  - **Accessibility:** Technical terms (STEM, indices, institutional) are glossed via examples ("science, technology...", "pathways like apprenticeships").  
  - **Anti-Deflection:** Q9 forces a unique prediction. Her likely answer ("gaps persist/reconfigure") is distinct from fixed-preference expectations ("gaps narrow steadily").  
  - **Circularity & Falsifiability:** Addressed directly in Q2 & Q3 follow-ups.  
  - **Policy Concession:** Q8 grants her premise upfront for constructive engagement.  
  - **Non-Generic:** All questions target her specific theses, examples, or critiques.  
  - **Follow-Up Rigour:** Each probes internal consistency (e.g., Q6 on collapsing criteria) or empirical traction (Q1, Q9).
