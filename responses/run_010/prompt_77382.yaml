  The key points of their thesis are: 1) Pure time preference isn't a moral claim but a structural constraint; 2) The parameter becomes undefined under standpoint indifference; 3) The elasticity of marginal utility does the normative work instead; 4) Standard empirical objections miss the mark since they target a nonexistent parameter.

