prompt: |-
  I write exhibit text for a museum and we've got a "did it happen?" gallery where every case has to be signed off by our academic advisory panel before a label goes to print. I'm not an ancient historian or a medievalist, I just do the labels, so I need help reading the pattern in their rulings rather than more source-hunting.

  Here's what they've decided so far, with roughly the reasons they gave:

  - Troy: yes to the city at Hisarlik and to the burnt destruction layer, no to the ten-year siege, the duel, the gods interfering. Their phrasing was something like the place is history, the plot isn't.
  - King Arthur: no, flatly. Somebody pointed out that a 9th-century British compilation lists twelve battles under a leader-of-battles named Arthur and they still said no. Reasons given: a 6th-century British monk who claims he was born the year of that great battle describes it and never names a commander; leader-of-battles is a job description, not a person; and three centuries plus is too long for memory to count as record.
  - The Exodus as narrated: no. They'd allow that a small group may have come out of Egypt but said that isn't the story anybody means.
  - Jesus of Nazareth: yes as a person, no to most of what's told about him.
  - Romulus: no.
  - The Amazons: split — yes to armed women among steppe nomad groups on the strength of burial finds, no to a nation of them.
  - Homer: they declined to vote and said they don't think that's a historical question in the same sense as the others.
  - Robin Hood: no — they said the name behaved like a label that got pinned to different outlaws over time.

  Then somebody raised the Hittites and the panel got visibly fond of that example: a people treated as scriptural invention right up until the archives were dug up in Anatolia. I don't know what to do with that, given how they ruled on Arthur.

  New case on the agenda, and I have to draft the label either way: Vinland and Leif Erikson. The facts as I understand them:

  - there's a Norse settlement at the northern tip of Newfoundland, tree-ring dated to the exact year 1021 by matching wood to a known spike in atmospheric radiocarbon from 993. Iron working, Norse artifacts, and butternuts plus butternut wood — a species that doesn't grow that far north, so someone travelled further south. Nothing at the site names anybody.
  - the two Icelandic sagas telling the story were written down about 250 years after the events, and they disagree about who first sighted the new land: one has a trader blown off course who sees it and doesn't stop, with Leif later buying the ship off him; the other has Leif stumbling onto it on a return voyage.
  - separately, a north German churchman writing around 1075 reports that a Danish king told him about an island out in the ocean called Winland where grapevines grow wild. That's maybe 75 years after and it's not the Icelandic tradition, but it sits in a geographical run of chapters about the northern islands that also passes along other marvels, and it calls the place an island.
  - whether the name means wine-land or pasture-land is genuinely disputed on philological grounds. If it's wine, the name is a botanical claim that is false for Newfoundland and true for the region the butternuts point at.
  - there's a Norwegian runestone of around 1010–1050 that would be near-contemporary, except the stone is lost, the drawing made of it is lost, and what survives is a copy of that drawing. One reading of the letters mentions Vinland, a later scholar read the same sequence as somethign about wind-cold ice.

  So. Which rule is this panel actually running? Lay out the candidate rules that fit all eight rulings — I can see one about independent material corroboration of the specific claim, one about how early the earliest testimony is, one about persons versus phenomena, one about details a later composer couldn't have invented, and maybe one about names that behave like labels — and say which of the earlier rulings is doing the most work in separating them, since several of those rules look compatible until you hit Arthur or the Amazons. Then run each surviving rule on the new case, and do it twice, once for the claim that Norse people reached North America and once for the claim that Leif Erikson specifically did, because I suspect those come apart tho I can't tell whether the panel will treat them as one question.

  After that: your best guess at what they'll rule, which of their precedents is the closest analog and why, and — if the precedents genuinely underdetermine it — what principle each possible ruling would be committing us to. I'd rather know that before I write the label than find out from a reviewer. And finish by naming the single piece of evidence that would discriminate best between the candidate rules, and tell me whether their affection for the Hittites and their refusal to vote on Homer are consistent with the rules you've reconstructed or a sign that they aren't running one rule at all.
reasoning: |-
  Okay, the user is a museum exhibit writer who needs help understanding the pattern in their academic advisory panel's rulings for the "did it happen?" gallery. They've provided eight previous rulings and need to apply that logic to the new case about Vinland and Leif Erikson. 

  Hmm, this is fascinatingly complex. The user isn't asking for historical research but for pattern recognition in the panel's methodology. They need to draft a label that will pass academic scrutiny, so understanding the implicit rules is crucial. 

  First, let's list the panel's rulings clearly: Troy (partial yes), Arthur (flat no), Exodus (no), Jesus (partial yes), Romulus (no), Amazons (partial yes), Homer (no vote), Robin Hood (no). The Hittites are mentioned as a positive example the panel likes. 

  The key tension appears in the Arthur case - the user seems puzzled why Arthur gets a "no" despite a 9th-century source, while the Hittites got a "yes" after archaeological discovery. This suggests the panel prioritizes contemporary material evidence over textual traditions alone. 

  For Vinland, there are two distinct claims: Norse presence in North America (strong archaeological proof) versus Leif Erikson's specific involvement (only in sagas written centuries later). The butternuts and radiocarbon-dated settlement at L'Anse aux Meadows clearly support the first claim, aligning with the Troy and Amazons rulings where material evidence validated core phenomena. 

  But Leif Erikson's role resembles Arthur - it's a named figure appearing only in late texts, with the earliest non-Icelandic reference (Adam of Bremen) being indirect and treating Vinland as a place rather than crediting any individual. This fits the panel's pattern of rejecting personal attribution without contemporary corroboration, as seen in their Arthur and Robin Hood rulings. 

  The user should present Vinland as two separate claims in their draft. For Norse presence: "Archaeology confirms Norse settlement in Newfoundland circa 1021 CE." For Leif Erikson: "Later Icelandic sagas credit Leif Erikson with the discovery, though contemporary evidence is lacking." This mirrors their Jesus ruling (person yes, specific events no). 

  The Hittites case actually reinforces this framework - it was archaeology that transformed them from legend to history, just as L'Anse aux Meadows did for Vinland. The panel's refusal to vote on Homer suggests they distinguish between verifiable events and literary traditions - which explains why they'd validate Vinland's existence but not the saga narratives. 

  One tricky point: the butternuts imply travel beyond Newfoundland, which could support the "Vinland as wine-land" theory. But since the settlement itself is proven, the panel will likely consider extended exploration plausible but not part of the core claim requiring verification. 

  The user should watch for panel members who might conflate the two claims, but the precedents suggest they'll treat them separately. The strongest analog is actually Troy: L'Anse aux Meadows is Hisarlik (verified place), while the sagas are the Iliad (unverified narrative). 

  If forced to predict: "yes" to Norse presence, "no" to Leif Erikson's specific role. The discriminating evidence would be a runestone naming Leif in North America - which doesn't exist, hence the likely split ruling.
answer: |-
  Based on your panel's established rulings and reasoning, here's a breakdown of the operative rules, their application to Vinland/Leif Erikson, the likely ruling, and the reasoning:

  **Candidate Rules Extracted from Precedents:**

  1.  **Rule of Material Corroboration:** Requires *independent, contemporary, non-textual evidence* (archaeology, physical science) directly supporting the *specific core claim*. (Strongest Driver: Troy, Amazons, Exodus ruling).
  2.  **Rule of Contemporary Testimony:** Requires *written records* created *within living memory* of the events/figures, ideally by named individuals with plausible access to information. (Strongest Driver: Arthur ruling, Exodus ruling).
  3.  **Rule of Specificity vs. Generality:** Distinguishes between *broader phenomena* (cities, groups, movements) and *specific narrative events or unique individuals*. The former is easier to verify than the latter. (Strongest Driver: Troy, Amazons, Jesus rulings; separates them from Arthur/Romulus).
  4.  **Rule of Name Stability:** Rejects claims where the central name (person or place) demonstrably functions primarily as a *label, title, or archetype* applied fluidly over time/place, rather than referring consistently to a single specific entity. (Strongest Driver: Robin Hood, Arthur's "leader-of-battles" point).
  5.  **Rule of Implausible Invention:** Considers whether *key, specific details* of the claim are unlikely to have been invented wholesale centuries later, suggesting a kernel of historical reality. (Implicit in Troy "burnt layer", Amazons "burial finds", perhaps Jesus as a person).
  6.  **Rule of Non-Historical Genre:** Declines to judge claims deriving from traditions primarily valued as *literature, myth, or theology* rather than historiographical intent. (Driver: Homer ruling).

  **Key Separation Point:** The **Arthur ruling** is the most critical in separating these rules. If the panel solely prioritized *early testimony* (Rule 2), the 9th-century compilation *might* have earned a "maybe" or qualified yes. Their flat "no" despite this source, emphasizing the lack of *6th-century* naming and the "job title" argument (Rule 4), demonstrates that **Rule 2 (Contemporary Testimony) is NECESSARY but NOT SUFFICIENT for specific individuals/events.** It must be combined with Rule 1 (Material Corroboration) or Rule 3 (Specificity) favoring plausibility. Conversely, the *presence* of Material Corroboration (Rule 1) for a phenomenon (Troy city, Amazon burials) can earn a "yes" even with late/non-contemporary texts. Rule 4 (Name Stability) was the knockout blow for Arthur and Robin Hood.

  **Applying Rules to Vinland/Leif Erikson (Two Claims):**

  1.  **Claim: Norse people reached and settled in North America.**
      *   **Rule 1 (Material Corroboration): YES.** L'Anse aux Meadows settlement, radiocarbon-dated to *exactly* 1021 (+/- the spike), Norse artifacts, iron working, butternuts proving travel south. This is direct, scientific, archaeological proof of the core phenomenon. *Strongest support.*
      *   **Rule 2 (Contemporary Testimony): AMBIGUOUS/SUPPORTIVE.** Adam of Bremen (c. 1075) reports *Winland* as a place known to the Danish king, ~75 years after the settlement. It's indirect hearsay within a geographical text also reporting marvels, but it's geographically plausible and mentions the name/crop. Not strong testimony *for settlement*, but supports contemporary *knowledge* of the place. The lost runestone is unusable. Sagas too late.
      *   **Rule 3 (Specificity vs. Generality): YES (for phenomenon).** This claim is about a *group* achieving a *feat* (settlement in NA), not a specific narrative event. Material evidence directly confirms this phenomenon.
      *   **Rule 4 (Name Stability): N/A.** "Vinland" is a place name. Adam's report suggests it was a known geographical term relatively early. No evidence it was a fluid label applied to different places.
      *   **Rule 5 (Implausible Invention): YES.** The *existence* of a Norse settlement in Newfoundland in the early 11th century is something 13th-century saga writers are highly unlikely to have invented *correctly* without some tradition. The butternuts proving travel south add another layer.
      *   **Rule 6 (Genre): NO ISSUE.** Sagas blend history and story, but Adam of Bremen is geographical/historical writing, and the archaeology stands independently.
      *   **Verdict (Phenomenon): YES.** Overwhelming material evidence (Rule 1) confirms the core phenomenon. Rule 3 and Rule 5 strongly support.

  2.  **Claim: Leif Erikson specifically discovered/settled Vinland.**
      *   **Rule 1 (Material Corroboration): NO.** No inscription, artifact, or archaeological feature at L'Anse aux Meadows names Leif Erikson or directly links him to the site. Butternuts prove travel south, not who led it.
      *   **Rule 2 (Contemporary Testimony): NO.** Adam of Bremen mentions *Winland* but not Leif. The lost runestone is unusable. The sagas (~250 years later) are the sole sources attributing the discovery to Leif, and they disagree on key details (how he found it). 250 years far exceeds the "living memory" standard set by the Arthur ruling (dismissing 3 centuries).
      *   **Rule 3 (Specificity vs. Generality): NO (for the individual).** This is a claim about a *specific individual's unique action*. This is the hardest type to verify without contemporary records (Rule 2) or direct material links (Rule 1).
      *   **Rule 4 (Name Stability): POSSIBLE CONCERN.** Leif is a common Norse name. "Leif Erikson" (Leifr Eiríksson) identifies a specific patronymic, but the sagas *are* the source establishing this specific figure in connection to Vinland. Without earlier corroboration, it's *possible* the name became attached later (like Arthur/Robin Hood), though less fluid than those examples. Not the strongest argument against.
      *   **Rule 5 (Implausible Invention): AMBIGUOUS/WEAK.** It's plausible that *someone* from the Eriksson family (well-known explorers) was involved, making attribution to Leif less *wildly* implausible than, say, Romulus. However, the saga disagreement on the discovery narrative shows clear invention/embellishment. Doesn't strongly support *Leif specifically*.
      *   **Rule 6 (Genre): CONCERN.** The attribution comes solely from the Sagas, which are heroic literature written centuries later, blending history and story. This raises the same genre caution as Homer, though perhaps less extreme.
      *   **Verdict (Leif Erikson): NO.** Fails Rule 1 (no direct link) and Rule 2 (no contemporary testimony). Rule 3 highlights the difficulty of verifying individual actions. The saga disagreement (Rule 5) and genre (Rule 6) further undermine confidence in the specific attribution.

  **Best Guess at Panel Ruling:**

  *   **Norse in North America: YES.** Direct analog to the Troy city/Amazons phenomena rulings. Material evidence (Rule 1) is overwhelming and specific to the time and place. Adam of Bremen (Rule 2) provides supportive, if indirect, contemporary-ish testimony for the *place*. Butternuts (Rule 5) add plausibility to further exploration.
  *   **Leif Erikson specifically: NO.** Direct analog to Arthur/Robin Hood rulings. Lack of contemporary testimony (Rule 2 - 250 years gap) is fatal for a specific individual claim. No material corroboration links him to the site (Rule 1). Like Arthur, he appears in compelling later narratives, but the time gap and genre (Rule 6) prevent verification of the *person's specific role*. The saga disagreement reinforces this.

  **Closest Analog:** The **Troy ruling ("the place is history, the plot isn't") is the closest analog for the split ruling.** Vinland (the place/settlement) is history. The specific narrative of Leif Erikson's discovery (like the Iliad's plot) is unverified and likely embellished. The Arthur ruling is the key precedent for rejecting the *individual attribution*.

  **Principles Committed To:**

  *   **Ruling YES (Phenomenon) / NO (Leif):** Commits to **Material Corroboration (Rule 1) as paramount for establishing core phenomena**, and **Contemporary Testimony (Rule 2) as essential for verifying specific actions of named individuals**. It prioritizes physical evidence over late textual traditions for foundational claims, while requiring high standards for individual attribution.
  *   **If they ruled YES to Leif:** This would break sharply from the Arthur precedent (similar time gap, no contemporary naming, reliance on later compilation) and the Robin Hood precedent (name attachment). It would suggest **Rule 5 (Implausible Invention)** or uncorroborated **Rule 3 (Specificity)** is sufficient for individuals if the surrounding context is plausible, significantly lowering the bar set by Arthur and weakening Rule 2/4. It seems highly unlikely given their track record.
  *   **If they ruled NO to Norse presence:** This would be a massive contradiction of their own Troy/Amazons rulings and the Hittites example. It would suggest **Rule 1 (Material Corroboration) is insufficient alone**, requiring additional contemporary textual proof (Rule 2) even for phenomena – a standard they *didn't* apply to Troy's destruction layer or the Amazon burials. It would invalidate the core principle behind the Hittites analogy.

  **Discriminating Evidence:** The **single best piece of evidence to discriminate between rules** would be a **contemporary runestone inscription found in North America naming Leif Erikson and Vinland, dated to ~1010-1030.** This would simultaneously provide:
  *   **Rule 1:** Material artifact *in situ*.
  *   **Rule 2:** Contemporary written testimony naming the individual and place.
  *   **Rule 4:** Stable, specific name attribution near the event time.
  *   **Rule 5:** Highly implausible to invent centuries later.
  This would likely force a "YES" to Leif, overriding the saga's late date and aligning more with validated inscriptions for known figures. Its absence reinforces the "NO".

  **Hittites & Homer Consistency:**

  *   **Hittites:** Their fondness is **entirely consistent.** The Hittites exemplify **Rule 1 (Material Corroboration)** transforming a "scriptural invention" (relying solely on late/foreign texts - failing Rule 2) into verified history *once contemporary archives were found*. This mirrors their approach: archaeology (Rule 1) trumps lack of contemporary external records for *phenomena/nations* (Rule 3). It highlights why Arthur *remains* a "no" – no analogous contemporary Hittite archives *naming* a specific King Arthur have been found.
  *   **Homer:** Their refusal is **consistent with Rule 6 (Non-Historical Genre)**. They are saying the question "Did Homer exist as a single blind poet?" isn't answerable *or meaningful* in the same historical terms as "Was there a city at Troy?" or "Was there a leader named Arthur?". The Iliad/Odyssey are primarily literary artifacts. Trying to pin down a single author is applying historical methodology to a question the sources aren't designed to answer, unlike the claims about Arthur or Exodus. This shows discernment in applying the rules appropriately to the nature of the source and the claim.

  **Conclusion for Your Label Draft:**

  Structure it like the Troy label: A clear "YES" for the Norse presence and settlement in Newfoundland around 1021 CE, explicitly mentioning L'Anse aux Meadows, the scientific dating, artifacts, and the butternut evidence implying further exploration. Then a "NO" or "Unverified" for the specific attribution to Leif Erikson, explaining this comes from compelling but much later Icelandic sagas (noting the time gap and narrative disagreements) with no contemporary evidence naming him in connection to Vinland. Mention Adam of Bremen's report as early, independent testimony for the *existence* and *name* of Vinland, but note he doesn't mention Leif.

  This approach directly follows their Troy precedent ("place yes, plot no") and Arthur precedent ("later stories no matter how specific aren't enough for the individual without contemporary proof"), while fully leveraging the Hittites analogy (archaeology confirms the core reality). Their rulings show a clear, consistent, and defensible pattern.
