  Comparing this to Hume's bundle theory. Both face similar issues with diachronic unity. Hume's perceptions are momentary, so how do we get the idea of a persistent self? But Hume uses psychological mechanisms like resemblance and causation, which might be more robust than the Abhidharma's causal series. However, both might still struggle with the first-personal aspect of identity.

