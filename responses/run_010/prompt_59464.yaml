  We must be cautious: some agreements might be verbal.

  Let me draft:

  #### Section 1: Agreed Claims

  We, the undersigned, agree on the following:

  1. **The Headline Thesis:** Dreams are not experiences that occur during sleep and are subsequently recalled upon waking. That is, the standard view that a dream is a conscious experience taking place during sleep, which is later remembered and reported, is mistaken.

  2. **Dream Reports and Evidence:** A sincere report of the form "I dreamt that p" does not, by itself, provide evidence that any conscious experience, event, process, or episode with the content *p* occurred during the subject's sleep. The production of such a report does not entail the existence of a prior, sleep-time experience.

  3. **Grammar of Dream Ascriptions:** The first-person past-tense dream report "I dreamt that p" is not analogous to a memory report about a waking experience. Its linguistic form does not commit the speaker to the occurrence of an internal event during sleep. Questions about the temporal properties of dreams (e.g., duration, precise timing) are inappropriate, not merely unanswerable, because they presuppose an event that did not occur.

     *Note: Agreement here is substantive, but the reasoning differs. The Malcolmian holds this on conceptual grounds; the Dennettian on empirical grounds (that no such event has been established).*

  4. **Sleep Laboratory Findings:** Existing sleep laboratory data (e.g., correlations between REM sleep and dream reports) do not establish that dreams are conscious experiences occurring during sleep. Such data are compatible with alternative explanations of dream reports.

  5. **Distinctions from Neighboring Theses:** Our shared thesis should not be confused with the following:
     - **Neural Activity Denial:** We do not deny that complex neural processes occur during sleep. Our thesis concerns conscious experience, not brain activity.
     - **Confabulation Thesis:** We do not claim that dream reports are generally confabulated or insincere. Subjects are truthful in their reports, but the reports do not refer to prior experiences.
     - **No Fact of the Matter:** We do not hold that there is no fact of the matter about what a subject dreamt. The content of a dream report is fixed by the report itself (Malcolmian) or by the processes producing the report (Dennettian).
     - **Dreams as Illusions:** We do not claim that dreams are illusory experiences. The issue is not the veridicality of dream content but the temporal locus and nature of the dream itself.
     - **Scientific Impossibility:** We do not assert that dream phenomena are beyond scientific study. Neural correlates and report mechanisms can be investigated, but this does not imply the reality of dream experiences during sleep.

