  4. **Distinctions from neighboring theses:**
     - Not denying that things happen in the head during sleep (e.g., neural activity).
     - Not saying subjects confabulate (Malcolmian: reports are sincere; Dennettian: may be confabulation in some cases, but not necessarily).
