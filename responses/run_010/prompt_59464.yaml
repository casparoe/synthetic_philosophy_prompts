  1. **Dream reports are not evidence for experiences during sleep.** Both deny that sincere dream reports entail that an experience occurred during sleep. But note: Malcolmian might say they are not evidence for *anything* occurring during sleep, while Dennettian might say they are evidence for content generated at some point, but not necessarily during sleep.

