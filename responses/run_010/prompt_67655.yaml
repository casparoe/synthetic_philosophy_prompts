answer: |-
  ### The Impossibility of a Universal Heuristic Estimator for Presumed Independence

  The project of formalizing a "heuristic estimator" for the expectation \(E[XY]\)—one that defaults to \(E[X]E[Y]\) when no specific information about the correlation between \(X\) and \(Y\) is available—aims to satisfy three desiderata: (1) the estimator is a well-defined function of the input expressions; (2) it defaults to independence when correlation information is "missing"; and (3) it never yields spurious estimates (e.g., it avoids catastrophic errors like predicting positive density when the true expectation is zero). I argue that these goals are jointly unattainable because the condition of "having no specific information about correlation" is not intrinsic to the random variables \(X\) and \(Y\) themselves. Rather, it depends on how \(X\) and \(Y\) are syntactically expressed and the computational resources the estimator can expend to detect correlations. To demonstrate this, I present a concrete estimation problem where the independence default is justified under one syntactic formulation but leads to catastrophic error under a semantically equivalent reformulation. The estimator, constrained by its syntactic inputs and finite computational resources, cannot distinguish the two cases, violating desideratum (3). I then address two key objections, showing why they fail to resolve the core issue.

  #### The Core Argument: Syntax and Computation Determine "Missing" Information
  The flaw in the project lies in treating "no specific information about correlation" as a property of \(X\) and \(Y\) alone. In reality, correlation is inferred from the *expressions* defining \(X\) and \(Y\), and this inference is computationally bounded. If the estimator cannot deduce a correlation within its resource limits, it defaults to independence—even if the correlation is semantically present and crucial. This creates a vulnerability: equivalent reformulations of the same problem can hide correlations, making them computationally inaccessible to the estimator. Consequently, the estimator fails desideratum (3), as it may default to independence in cases where the correlation is essential.

  To illustrate, consider the problem of estimating the expectation \(E[X(n)Y(n)]\) for integers \(n\) up to some large \(N\), where:
  - \(X(n)\) is the indicator function for \(n\) being prime: \(X(n) = 1\) if \(n\) is prime, else \(0\).
  - \(Y(n)\) is the indicator function for \(n+3\) being prime: \(Y(n) = 1\) if \(n+3\) is prime, else \(0\).

  This is the problem of detecting twin primes with offset 3 (e.g., pairs like \((n, n+3)\)). Semantically, \(E[X(n)Y(n)]\) is the probability that both \(n\) and \(n+3\) are prime. Crucially, this expectation is dominated by a local obstruction at the prime \(p=2\): since one of \(n\) or \(n+3\) must be even (and thus divisible by 2), they cannot both be prime unless \(n=2\) (where \(n+3=5\) is prime). For \(n > 2\), \(E[X(n)Y(n)] = 0\). The Hardy-Littlewood framework captures this through its singular series, which includes a local factor at \(p=2\). Here, the proportion of \(n\) modulo 2 where both residues allow primality is zero (residues \((0,1)\) or \((1,0)\) are possible, but not \((1,1)\)), so the local factor vanishes. A proper estimator should output \(E[X(n)Y(n)] \approx 0\) for large \(N\), with the exception at \(n=2\) being negligible.

  Now, consider a reformulation of the *identical* problem. Define a function \(f\) as follows:
  \[
  f(n) = n + 3.
  \]
  Then, redefine \(Y(n)\) using \(f\):
  \[
  Y(n) = 1 \text{ if } f(n) \text{ is prime, else } 0.
  \]
  Semantically, this is identical to the first formulation: for every \(n\), \(Y(n)\) is \(1\) iff \(n+3\) is prime. The expectation \(E[X(n)Y(n)]\) is unchanged and still zero for \(n > 2\). However, syntactically, the input to the estimator now consists of the expressions:
  - \(X(n) = \text{"is prime"} \) applied to \(n\).
  - \(Y(n) = \text{"is prime"} \) applied to \(f(n)\), where \(f(n)\) is given as a black-box function symbol without simplification (i.e., the internal structure of \(f\) is not immediately accessible).

  The two formulations represent the *same problem* in the sense that they define identical functions over the domain of \(n\): for all inputs \(n\), the values of \(X(n)\) and \(Y(n)\) are unchanged. The only difference is syntactic—the use of a function symbol \(f\) in place of the explicit offset—and this syntax determines what the estimator can "see."

  In the first formulation, a competent estimator (like those used by number theorists) would parse "prime at \(n\)" and "prime at \(n+3\)", recognize a linear tuple, compute local factors (including the vanishing factor at \(p=2\)), and correctly estimate \(E[XY] \approx 0\). The independence default is overridden by detectable correlation information.

  In the reformulated version, the correlation is obscured. If the estimator is computationally bounded—say, it can only spend polynomial time in the expression size to detect correlations—it may not deduce that \(f(n) = n + 3\). Treating \(f\) as an arbitrary unknown function, it has "no specific information" about the correlation between \(X(n)\) (primality of \(n\)) and \(Y(n)\) (primality of \(f(n)\)). Per desideratum (2), it defaults to independence: \(E[XY] \approx E[X]E[Y] \approx \frac{1}{\log n} \cdot \frac{1}{\log n} = \frac{1}{(\log n)^2}\). This is catastrophically wrong: it suggests a positive density of twin pairs (e.g., for \(N\) large, the estimate grows like \(\frac{N}{(\log N)^2}\)), while the true expectation is zero except for a single point (\(n=2\)).

  The estimator cannot distinguish the reformulated problem from a semantically distinct one where the independence default *is* valid. For instance, if \(f(n)\) were a genuinely uncorrelated function (e.g., \(f(n) = n + 2k\) for random \(k\)), the syntax would be identical, and the default would be appropriate. But here, the syntax hides a critical correlation, and the estimator lacks the resources to unveil it. Thus, desiderata (1) and (2) force a violation of (3): the estimator is a function of syntax, defaults to independence when correlation is computationally inaccessible, and produces a spurious estimate.

  #### Objection 1: Number Theorists Use Local Factors, So Why Can't the Estimator?
  **Objection:** Working number theorists avoid raw independence defaults by computing singular series with local factors (e.g., for linear tuples like \(n, n+3\)). The local factors handle modular obstructions (like the vanishing at \(p=2\)) efficiently, as they are computable for any prime \(p\). Sieve methods encounter a "parity barrier," but this reflects proof limitations, not a flaw in the heuristic—so an estimator should internalize local correlation-detection.

  **Response:** This objection misunderstands the scope of the problem. Local factors resolve correlations detectable through modular arithmetic, but not all correlations are local or computationally accessible under arbitrary syntactic encodings. In the reformulated problem above, the obstacle at \(p=2\) is indeed local, but it is *hidden* by the function symbol \(f\). An estimator that automatically computes local factors for *all* expressions would need to first reduce \(f(n)\) to \(n+3\), which requires symbolic simplification or evaluation. If \(f\) is complex or the estimator is resource-constrained, this may not occur.

  Moreover, the parity barrier illustrates a deeper issue: some correlations are global and resist local detection. For example, consider estimating \(E[X(n)Y(n)]\) where \(X(n)\) is the Möbius function \(\mu(n)\) (which encodes the parity of prime factors) and \(Y(n)\) is an indicator for \(n\) being prime. Here, \(\mu(n) = -1\) if \(n\) is prime (since primes have one prime factor), so \(E[X(n)Y(n)] = E[\mu(n) \cdot \mathbf{1}_{\text{prime}}(n)] = -E[\mathbf{1}_{\text{prime}}(n)] \approx -\frac{1}{\log n}\). If the estimator defaults to independence, it computes \(E[\mu(n)] \approx 0\) (since \(\mu\) averages to zero) and \(E[\mathbf{1}_{\text{prime}}(n)] \approx \frac{1}{\log n}\), yielding \(E[XY] \approx 0\), which is spurious (not catastrophic, but systematically wrong). Sieve methods cannot reliably detect this correlation due to the parity barrier—they struggle to distinguish sequences based on the parity of prime factors. An estimator that "internalizes local machinery" would miss this global correlation because it lacks a local signature (e.g., no single prime \(p\) captures it). If we reformulate \(\mu(n)\) opaquely—e.g., as a black-box function—the estimator might default to independence and fail. Thus, even with local factors, the estimator cannot handle all correlations, especially under syntactic obfuscation or global barriers.

  #### Objection 2: Opaque Reformulations Are Illegitimate
  **Objection:** Your reformulation cheats. A respectable estimator should be compositional over well-formed expressions, and your use of black-box functions like \(f\) isn't compositional or allowed in its language. If the language restricts how predicates are built, opaque forms wouldn't exist, and the problem vanishes.

  **Response:** This objection imposes an artificial restriction that undermines the estimator's generality. Desideratum (1) requires the estimator to be a function of the input expressions, but if the language forbids function symbols (like \(f\)) or complex compositions, it cannot handle legitimate mathematical problems that arise naturally. For instance, in number theory, predicates are often defined indirectly via functions (e.g., "is \(f(n)\) prime" for \(f\) a polynomial or custom function). Banning such expressions would make the estimator incomplete for real applications.

  Furthermore, compositionality does not resolve the issue. A compositional estimator processes subexpressions independently, but this can amplify errors. In the reformulated problem, a compositional estimator might compute \(E[\text{prime}(f(n))]\) as \(E[\text{prime}]\) (assuming no correlation with \(f\)), but this ignores that \(f(n)\) depends on \(n\). If it treats \(f(n)\) as independent of \(n\), it misestimates \(E[Y]\) as well. Even with compositionality, the estimator must still detect correlations *between* expressions, which depends on syntax and computation. For example, deducing that \(\text{prime}(n)\) and \(\text{prime}(f(n))\) are correlated when \(f(n) = n + 3\) requires computational work. Without that work, compositionality might even worsen the default.

  If we impose a restrictive language (e.g., only atomic predicates), the estimator becomes impractical for advanced mathematics, where definitions are layered. The weaker claim then is: for any fixed language and resource bound, there exist semantically equivalent expressions where the estimator defaults to independence in one (correctly) but not the other (causing error). Thus, the project fails for general (realistic) cases.

  #### Conclusion: The Inevitable Trade-off
  The case of the \((n, n+3)\) primes under syntactic reformulation proves that the three desiderata conflict: the estimator cannot simultaneously respect syntax, default to independence when correlation is computationally inaccessible, and avoid spurious estimates. Objection 1 fails because local factors do not address global correlations or syntactic opacity; objection 2 fails because banning complex expressions sacrifices generality. The weaker claim that survives is: a heuristic estimator can satisfy the desiderata only for a restricted class of expressions and resource bounds, but not universally. In essence, "no specific information" is a syntactic and computational notion, not a semantic one. This isn't an engineering gap but a fundamental limit—one that mirrors the parity barrier in sieve theory, where proof methods cannot access certain truths. Your seminar leader's optimism is misplaced: without abandoning desiderata (1) or (2), or accepting spurious errors, no such estimator exists. For your term paper, this is an honest win.
