answer: |-
  **CITY OF GREENWOOD HEIGHTS  
  OFFICE OF PUBLIC AMUSEMENTS  
  REQUEST FOR PROPOSALS (RFP) #OPA-2024-01: AUTONOMOUS FESTIVAL SEASON**  

  **1. Purpose of this funding round (97 words)**  
  The Office of Public Amusements (OPA) seeks proposals to design and implement the city’s 2024 Festival Season. This initiative advances the OPA’s core mandate to eliminate passive spectatorship in public gatherings, thereby strengthening civic virtue and authentic community bonds. Funding, derived from the Municipal Enlivenment Fund, prioritizes events where every attendee is an active participant. No activity may designate individuals or groups as observers. The goal is to foster environments where citizens engage directly with one another, dissolving the artificial division between performer and spectator identified as detrimental to moral integrity and civic cohesion.  

  **2. Scope of work: the crowd as its own spectacle (148 words)**  
  Proposals must outline events where the assembled populace *is* the entertainment. Activities should compel universal, simultaneous participation, ensuring no individual remains idle or assumes the role of watcher. Examples include mass participatory dances, communal singing circles (no designated choirs), collective games of physical coordination requiring mutual observation, and open-air assemblies centered on shared physical exertion or synchronized movement. Proposers must develop frameworks enabling spontaneous, egalitarian engagement. While designated leaders may initiate activities, their role dissolves into the group dynamic once participation is universal. Emphasis is placed on creating conditions where citizens derive pleasure not from observing skilled others, but from seeing themselves reflected in the active engagement of their peers. Events must occur in accessible public spaces and accommodate projected attendance of 500+ citizens.  

  **3. Eligibility: who may not apply (152 words)**  
  This RFP excludes entities or individuals whose work inherently creates audiences. Ineligible applicants include:  
  *   Professional theater companies, dance troupes, orchestras, choirs, or circuses.  
  *   Individuals holding degrees in Performance Arts, Directing, or Dramatic Literature.  
  *   Current or former members of any professional actors' union or guild.  
  *   Organizations that have previously received funding for productions featuring a stage, proscenium arch, or designated seating for spectators.  
  *   Entities employing individuals compensated specifically for performing before others.  
  *   Applicants proposing any event where a discrete group demonstrates skill or presents a narrative to others not similarly engaged at that moment.  
  The OPA seeks proposals rooted in genuine communal expression, free from the corrupting influence of professional spectacle or the implicit hierarchy of displayed talent. Proof of non-affiliation with performance industries is required.  

  **4. Deliverables and milestones (98 words)**  
  Successful proposers will deliver:  
  1.  **Event Blueprints (30 days post-award):** Detailed plans for 3 distinct large-scale participatory events.  
  2.  **Citizen Participation Protocols (45 days):** Methods for ensuring universal, simultaneous engagement; crowd assimilation strategies; contingency plans for non-participants.  
  3.  **Season Implementation (Months 2-5):** Execution of 6 public events (2 per blueprint), each achieving ≥95% real-time participation metrics (verified by OPA monitors).  
  4.  **Final Report (Month 6):** Analysis of participation rates, citizen self-reflection anecdotes, and evidence of strengthened community bonds, devoid of spectator testimonials.  

  **5. Assessment criteria and weightings, with percentages (102 words)**  
  Proposals will be evaluated based on:  
  *   **Elimination of Spectator Role (40%):** Demonstrated effectiveness in ensuring universal participation; mechanisms preventing passive observation.  
  *   **Fostering Collective Self-Reflection (30%):** Capacity for events to make citizens see themselves in each other’s active presence, promoting authentic social unity.  
  *   **Feasibility & Scalability (15%):** Practicality of achieving 500+ simultaneous participants; cost-effectiveness (avoiding luxury/idleness).  
  *   **Civic Integrity Alignment (15%):** Adherence to principles rejecting paid performance, artificial emotion, and the flattery of existing vices through staged narratives. No points awarded for artistic merit of discrete performances.  

  **6. Frequently asked questions (149 words)**  
  *   **Q: Can musicians play for dancers?**  
      A: No. Music must emanate from the participants themselves (e.g., mass singing, rhythmic stomping). Pre-recorded music is permitted only if its source is not a focal point.  
  *   **Q: Are children expected to participate fully?**  
      A: Yes. Guardians are responsible for ensuring their active engagement. Events must include age-inclusive activities. Passive observation by minors is non-compliant.  
  *   **Q: What about safety monitors or medical staff?**  
      A: Necessary safety personnel are exempt from participation mandates only during active emergencies. Their presence must be minimally intrusive and non-spectatorial.  
  *   **Q: How is "universal participation" measured?**  
      A: OPA monitors will use randomized sampling and visual scans to estimate active engagement percentages. Proposers must detail their own verification methodologies.  
  *   **Q: Why does the OPA foundational document cite a consultant who wrote an opera performed for a monarch?**  
      A: The consultant recognized the profound moral hazards inherent in such professional display later in life. His subsequent writings form our core philosophy, explicitly rejecting his earlier, erroneous engagement with court spectacle.  

  **7. Why each clause is Rousseau (147 words)**  
  *   **Purpose:** Reflects Rousseau's core argument that theater corrupts morals by fostering passivity and flattering existing vices, while true civic festivals promote active unity.  
  *   **Scope:** Embodies his vision of the crowd as its own spectacle, where citizens find pleasure in mutual presence and activity, eliminating the performer/spectator divide he condemned.  
  *   **Eligibility:** Directly stems from his condemnation of professional actors as publicly selling their person, lacking civic honor, and creating harmful hierarchies.  
  *   **Deliverables:** Mirrors his preference for practical, open-air gatherings over costly, idle-inducing permanent theaters.  
  *   **Criteria:** Prioritizes his key concerns: abolishing spectatorship (passivity), fostering genuine communal self-reflection, avoiding luxury/idleness, and rejecting professional performance's moral compromises.  
  *   **FAQ:** Addresses practical contradictions arising from his ideals: the tension between necessary roles (safety) and pure participation, and his own inconsistent history with performance (the opera *Le devin du village*), explained here as a rejected youthful error.
