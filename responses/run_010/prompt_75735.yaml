  Then there's the deal itself. The developer wants their endorsement of rodenticide, a joint press release, and a 5-year gag clause. All three parts are problematic, but the gag clause is particularly dangerous - it would cripple their advocacy work. The endorsement would damage credibility, and the press release would make them complicit in greenwashing. 

  The alternative offer from the competitor is smaller but cleaner - funding for non-toxic methods with no strings attached. It aligns better with their values despite being less impactful.

