  The rule: minimize relative entropy (Kullback-Leibler divergence) to the prior, subject to the constraints.

  Since the prior is uniform, minimizing relative entropy is equivalent to maximizing entropy.

  Constraints:
  - P(N) = P(NW) + P(NE) = 1/2.
  - P(NE | N) = P(NE) / P(N) = 3/4  => P(NE) = (3/4)*(1/2) = 3/8, so P(NW) = 1/8.

