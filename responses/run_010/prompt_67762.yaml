answer: |-
  ## Workshop Pre-Reading: Mapping Beliefs About Contingency in History

  **Purpose:** This handout explores different ways people understand contingency in history *before* we discuss labels like "determinism" or "free will." It aims to map the actual space of beliefs by identifying key axes of disagreement and providing a self-assessment tool. The goal is to enable a more nuanced discussion grounded in concrete reasoning about historical events.

  ### Part 1: The Space of Positions – Key Axes of Disagreement
  Views on contingency genuinely come apart along these dimensions. Consider where you stand on each:

  1.  **Axis 1: Small Cause vs. Low Probability**
      *   **Claim A (Small Cause):** A specific, tiny antecedent event or condition *made the crucial difference* to a major historical outcome. Change that small thing, and the large outcome changes.
      *   **Claim B (Low Probability):** The major historical outcome was genuinely *unlikely* or improbable beforehand. Replaying the tape many times, this specific outcome would rarely occur.
      *   **Why They Come Apart:** Imagine a hurricane's path. A tiny shift in initial wind speed (Small Cause) *can* mean landfall in City A vs. City B. However, hurricanes hitting *somewhere* along a broad coastline might be quite probable (Low Probability may not hold for the *category* of outcome). Claim A focuses on sensitivity; Claim B focuses on prior likelihood. **Concrete Case:** The precise timing of Archduke Franz Ferdinand's car taking a wrong turn in Sarajevo (1914) is often cited as a tiny cause altering the immediate path to war. However, the *probability* of *some* major European war breaking out in the early 20th century, given the alliance systems, militarism, and nationalism, was arguably high. Did the wrong turn *make the crucial difference* to war happening (Small Cause)? Or was war highly probable anyway, just triggered differently (Low Probability less relevant to the *fact* of war)?

  2.  **Axis 2: Gradual Amplification vs. Discrete Branch Points**
      *   **Claim A (Gradual Amplification):** Small differences accumulate slowly but steadily over long periods, gradually amplifying into large divergences. Counterfactual speculation is always somewhat legitimate but requires tracing long, complex chains.
      *   **Claim B (Discrete Branch Points):** History reaches critical junctures – like railway switches – where a small event forces a choice between two (or few) significantly different, self-stabilizing paths. After the switch, the path becomes hard to reverse. Counterfactual speculation is most legitimate *at* these points.
      *   **Why They Come Apart:** The first sees change as constant, incremental drift; the second sees change concentrated at rare moments of high leverage. **Concrete Case:** The adoption of the QWERTY keyboard layout. Was this primarily the slow, cumulative result of typists gradually adapting to slightly faster layouts (Gradual Amplification)? Or was it a specific moment – like winning a typing contest or a key manufacturer's decision – that locked in the standard, after which retraining costs made change prohibitively difficult (Discrete Branch Point)?

  3.  **Axis 3: Human Decision vs. Impersonal Event**
      *   **Claim A (Human Decision):** Crucial historical pivots turn on the specific choices, decisions, or actions of identifiable individuals or groups.
      *   **Claim B (Impersonal Event):** Crucial historical pivots turn on events outside human control or choice: epidemics, weather events, harvest failures, accidental deaths, or the random presence/absence of specific individuals in roles.
      *   **Why They Come Apart:** This axis focuses on the *source* of the contingent trigger. **Concrete Case:** The failure of the Gunpowder Plot (1605). Was the plot foiled primarily because of Lord Monteagle's decision to show the warning letter (Human Decision)? Or was it foiled because the plotters happened to store extra gunpowder in an adjacent cellar, which was discovered by chance during a routine check for firewood (Impersonal Event - random presence/storage)?

  4.  **Axis 4: Real Possibility vs. Narrative Effect**
      *   **Claim A (Real Possibility):** Statements about "what might have happened" describe genuine alternative possibilities inherent in the historical situation itself. Counterfactuals have truth value.
      *   **Claim B (Narrative Effect):** "Contingency" is primarily an effect of how we tell stories. Highlighting certain small events as pivotal reflects our narrative focus and selectivity, not an objective property of the past. Counterfactuals are useful fictions, not truths.
      *   **Why They Come Apart:** The first sees contingency "in the world"; the second sees it "in the telling." **Concrete Case:** The "discovery" of calculus by both Newton and Leibniz independently within years. Does this show that calculus was "in the air," a real possibility likely to be grasped around that time regardless (Real Possibility)? Or does labeling these events as simultaneous "discoveries" impose a narrative structure that hides the messy, context-specific developments leading to each man's work, making the simultaneity seem more contingent than it really was (Narrative Effect)?

  ### Part 2: Occupied Cells and Empty Spaces
  Combining answers to the four axes (Accept/Reject for each claim) generates 16 potential positions. Not all are coherent or occupied.

  *   **Named/Occupied Positions:**
      *   **A1, A2, A3, A4:** **Strong Contingency (Gouldian Replay):** (e.g., Stephen Jay Gould). Small causes matter, branch points exist, pivots can be impersonal *or* human, alternatives were real. Replaying life's tape yields utterly different outcomes. *[Accepts Small Cause, Discrete Branch Points, Impersonal Events (or both), Real Possibility]*
      *   **A1, A2, A3, B4:** **Path Dependency:** Small causes at branch points (often impersonal, like accidents or timing) lock in trajectories. While alternatives were real then, our focus on the path taken is a narrative choice. *[Accepts Small Cause, Discrete Branch Points, Impersonal Events, Rejects Real Possibility? (Often leans B4) or accepts both A3/B3]*
      *   **B1, ~A2, ~A3, B4:** **Structuralism / Macro-History:** Large outcomes (e.g., industrialization, rise of nation-states) were highly probable given deep structures (economic, geographic, social). Small events and choices are foam on the wave; narrative highlighting creates an illusion of contingency. *[Rejects Small Cause (large structures the difference), Rejects Discrete Branch Points (change structural/gradual), Rejects Impersonal/Human as *crucial* pivots (structures dominate), Rejects Real Possibility (alternatives often structurally impossible)]*
      *   **~A1, A2, A3, A4:** **Critical Juncture Voluntarism:** Discrete branch points exist, triggered by specific events (often human decisions), creating real alternative paths. However, the *outcome* at the juncture wasn't necessarily *unlikely* beforehand; the structure made *some* juncture probable. *[Rejects Small Cause (low prob not necessary), Accepts Discrete Branch Points, Accepts Human Decision, Accepts Real Possibility]*
      *   **B1, ~A2, A3/B3, B4:** **Contingency as Narrative Artifact (Deflationary):** The sense of contingency arises solely from how stories are constructed, emphasizing certain details as pivotal. The past unfolded with a high degree of necessity; alternatives are imaginative exercises, not historical realities. *[Rejects Small Cause, Rejects Discrete Branch Points, Ambivalent on Pivots (they aren't *crucial*), Rejects Real Possibility]*

  *   **Unnamed but Occupiable:** Many combinations are held implicitly, especially those mixing acceptance of some axes but not others (e.g., believing in human decisions at branch points but seeing alternatives as only narratively constructed - A2, A3, B4).

  *   **Likely Empty/Incoherent Cells:**
      *   **A1, A2, A3, B4 + Rejecting Human Decision (A3):** If one firmly rejects *any* role for human decisions in pivots (A3 True) but accepts Real Possibility (A4), it's hard to see how discrete branch points (A2) triggered by impersonal events lead to *real* alternatives without some human response being part of the pivot. This combination seems strained.
      *   **B1, A2, A3, A4:** Accepting Discrete Branch Points (A2) and Real Possibility (A4) strongly suggests some outcomes *were* unlikely (contra B1). Believing in self-stabilizing alternative paths implies the actual path wasn't the only highly probable one.
      *   **Rejecting All Contingency (Reject A1, Reject A2, Reject A3, Reject A4):** While strict determinism exists, it usually rejects A4 implicitly. Explicitly rejecting *all four* claims is rare and arguably incoherent with any historical analysis, which inevitably involves selection (touching B4) and apparent choices.
      *   **Emptiness Diagnosis:** Most empty cells arise from tensions between axes (like B1 vs A2/A4) or represent positions so minimal in acknowledging contingency as to be unattractive or functionally deterministic.

  *   **Close Calls (Potential Collapse):**
      1.  **Path Dependency (A1,A2,A3,B4) vs. Strong Contingency (A1,A2,A3,A4):** They collapse if one argues that the "lock-in" mechanism in path dependency *itself* makes the initial branch point outcome retrospectively appear necessary (undermining A4). Path dependency often flirts with this.
      2.  **Structuralism (B1,~A2,~A3,B4) vs. Contingency as Narrative (B1,~A2,A3/B3,B4):** They collapse if the structuralist argues that highlighting structures is *also* a narrative choice (B4), and that apparent pivots are *always* epiphenomenal (consistent with rejecting A3 as crucial). The difference lies in whether structures are seen as objectively determining or as our chosen lens.
      3.  **Critical Juncture Voluntarism (~A1,A2,A3,A4) vs. Path Dependency (A1,A2,A3,B4):** They collapse if the voluntarist accepts that the *specific* decision at the juncture, while real, doesn't mean the *large-scale outcome type* was unlikely (B1), and that the path taken quickly becomes the dominant narrative, obscuring alternatives (B4).

  ### Part 3: Self-Assessment Instrument
  **Instructions:** Read each scenario and choose the statement (A or B) that best reflects your belief about the role of contingency in that situation. Answer based on your intuition about how history works, not based on historical labels. There are no right or wrong answers. This should take ~15 minutes.

  1.  **The Archduke's Driver (Real):** In 1914, Archduke Franz Ferdinand's driver in Sarajevo took a wrong turn, stalling the car directly in front of Gavrilo Princip, who then assassinated him.
      *   **(A)** Changing that single wrong turn could plausibly have prevented the assassination *that day*, potentially altering the immediate chain of events leading to WWI.
      *   **(B)** Given the tensions in Europe, *some* major incident sparking a large-scale war was very likely to happen soon; preventing *this* assassination just means a different spark.

  2.  **The Storm and the Invasion (Invented):** A planned naval invasion of Islandia in 1588 was delayed by a severe, unexpected storm that damaged the fleet. The invasion was abandoned.
      *   **(A)** The storm was the decisive factor; without it, the invasion likely proceeds, potentially conquering Islandia and changing its history dramatically.
      *   **(B)** Islandia's strong coastal defenses and motivated populace made a successful invasion highly improbable regardless; the storm was a convenient excuse for abandoning a flawed plan.

  3.  **The Two Inventors (Real - Calculus-like):** Inventor X in Country A and Inventor Y in Country B independently developed nearly identical revolutionary engines within 6 months of each other, unaware of each other's work.
      *   **(A)** This shows the engine was a "ripe" idea; if both hadn't invented it, someone else likely would have soon.
      *   **(B)** This shows incredible coincidence; small differences in either inventor's life (funding, health, a distracting event) could easily have delayed one significantly, making the other seem like the sole "inventor."

  4.  **The QWERTY Lock-In (Real):** The QWERTY keyboard layout became dominant partly due to early adoption by a major typewriter manufacturer for reasons related to mechanical jamming, which later became obsolete.
      *   **(A)** This is a classic case where a small, early advantage (or decision) locked in a standard that became very difficult to change, even when better options existed.
      *   **(B)** QWERTY persisted because it proved "good enough" and changing entrenched standards is always difficult; its origins are less important than its functional adequacy over time.

  5.  **The Delayed Railroad Standard (Invented):** Two neighboring regions developed different railroad gauges. A proposal to adopt a common standard failed narrowly in 1850. Integration was finally achieved in 1880 at great cost.
      *   **(A)** The 1850 vote was a critical missed opportunity; agreeing then would have saved immense effort and shaped regional development differently for decades.
      *   **(B)** Economic and political forces were pushing strongly towards integration; the delay was costly but the eventual outcome was inevitable.

  6.  **The Plague and the Succession (Real/Invented Hybrid - Inspired by historical epidemics):** A deadly plague swept through Capital City in 1347. Heir A died; Heir B (previously considered less suitable) survived and inherited the throne.
      *   **(A)** The plague's random path through the city, determining who lived and died, was the pivotal event altering the kingdom's leadership and future direction.
      *   **(B)** The underlying instability of the kingdom meant significant change was likely regardless; the plague accelerated the process but didn't fundamentally alter the long-term trajectory.

  7.  **The Accidental Leak (Invented):** Scientist Z accidentally left a classified research notebook in a cafe. It was found by a journalist, leading to public scandal, funding cuts, and the end of a major research program.
      *   **(A)** This accident derailed an important scientific endeavor; without it, the program likely continues and achieves significant results.
      *   **(B)** The research program was already facing serious ethical questions and funding doubts; the leak brought things to a head but didn't change the inevitable outcome.

  8.  **The General's Cold (Invented):** General M, known for bold offensives, fell severely ill with a common cold days before a major battle. His more cautious deputy took command and adopted a defensive strategy, leading to a stalemate instead of a potential decisive victory/defeat.
      *   **(A)** The General's illness directly caused the shift in strategy and the altered battle outcome.
      *   **(B)** The illness provided the context, but the deputy's decision reflected their own judgment and the available information; attributing the outcome to the cold oversimplifies.

  **Scoring Key:** Map your answers (A or B for each question) to the axes. Note patterns.

  *   **Axis 1 (Small Cause vs. Low Prob):** A on Q1, Q2, Q3B, Q6A, Q7A, Q8A lean towards **Small Cause**. B on Q1, Q2, Q3A, Q6B, Q7B lean towards **Low Probability** (or rejection of Small Cause).
  *   **Axis 2 (Gradual vs. Branch Points):** A on Q4A, Q5A lean towards **Branch Points**. B on Q4B, Q5B lean towards **Gradual Amplification** (or rejection of Branch Points).
  *   **Axis 3 (Human vs. Impersonal):** A on Q8A leans **Human Decision**. A on Q2A, Q6A, Q7A lean **Impersonal Event**. (Q1, Q3, Q4, Q5 less diagnostic for source).
  *   **Axis 4 (Real Possibility vs. Narrative Effect):** A on Q1A, Q2A, Q3B, Q5A, Q6A, Q7A, Q8A lean **Real Possibility**. B on Q1B, Q2B, Q3A, Q5B, Q6B, Q7B lean **Narrative Effect**.
  *   **Self-Consistency Checks:**
      *   **QWERTY/Railroad Tension (Q4 vs Q5):** Strongly agreeing with Q4A (Branch Point/Lock-In) but also strongly agreeing with Q5B (Integration Inevitable) suggests tension. If lock-in is powerful (Q4A), why couldn't the gauge difference lock in divergence (contrary to Q5B)? Conversely, if integration forces are overwhelming (Q5B), why did QWERTY lock in (contrary to Q4A implying contingency)? This flags potential inconsistency between views on Branch Points and Structural Forces. *Diagnosis:* Participant may need to refine their view on the scope/power of lock-in vs. structural forces.
      *   **Calculus/Engine Tension (Q3):** Choosing Q3A (Ripe Idea) strongly leans towards Low Probability (B1) and Narrative Effect (B4). Choosing Q3B (Incredible Coincidence) strongly leans towards Small Cause (A1) and Real Possibility (A4). Holding Q3A while strongly endorsing Small Cause (A1) elsewhere (e.g., Q1A, Q2A) is inconsistent. Similarly, holding Q3B while strongly endorsing Low Probability (B1) elsewhere is inconsistent. *Diagnosis:* Participant may be conflating Small Cause with Low Probability (Axis 1) or misapplying their general view to this specific case.
  *   **Unlikely Co-occurrences:** Patterns strongly suggesting **Small Cause (A1)** + **Low Probability (B1)** are logically difficult (see Axis 1). Patterns strongly suggesting **Branch Points (A2)** + **Narrative Effect (B4)** + **Reject Real Possibility (Reject A4)** are also conceptually strained (if branch points create paths, how can the alternatives be *only* narrative?).

  ### Part 4: Limitations of the Instrument
  This tool simplifies a complex landscape. Key limitations:

  1.  **Blurred Distinctions:**
      *   **Axis 3 (Human vs. Impersonal):** The instrument struggles to cleanly separate views that see *both* human decisions *and* impersonal events as potential pivots (a common position). Items like Q6 and Q8 try to isolate, but many participants will hold a mixed view. The axis itself might be less fundamental than the others.
      *   **Critical Juncture Voluntarism (~A1, A2, A3, A4) vs. Strong Contingency (A1, A2, A3, A4):** The instrument may not reliably distinguish someone who thinks branch points *always* involve unlikely outcomes (A1) from someone who thinks they *can* but don't *have to* (~A1). Q1 and Q5 are key differentiators, but the distinction is subtle.
      *   **Structuralism (B1, ~A2, ~A3, B4) vs. Deflationary Narrative (B1, ~A2, A3/B3, B4):** Distinguishing "structures determine" from "contingency is just a story" relies heavily on Q3 and Q6/Q7. The difference in emphasis might not be fully captured.

  2.  **Specific Views Not Detected:**
      *   **Second-Order Contingency (Belief-Dependent Fragility):** The instrument *cannot* detect the view that an outcome was fragile *only because* people *believed* it was settled by a single person's choice, making them less likely to challenge it. None of the items probe beliefs *about* contingency as a causal factor. (Axis 3 and Axis 4 come closest but don't capture this reflexive aspect).
      *   **Robust Outcomes via Different Paths:** The instrument *cannot* reliably distinguish the view that "a specific small cause changed the immediate event, but the large outcome arrived soon anyway via a different route" from views rejecting Small Cause (A1) outright. A participant holding this view might answer B on items like Q1, Q2, Q7, aligning with Low Probability (B1) or Structuralism, even though they accept a form of small cause impact on the *path*. The axes and items focus on the *difference to the large outcome*.

  3.  **Presuppositions:**
      *   **Counterfactual Legitimacy:** The instrument presupposes that counterfactual reasoning is a meaningful way to discuss contingency. It leans towards **Real Possibility (A4)** by framing questions about "what might have happened." A staunch defender of **Narrative Effect (B4)** might find the questions misleading, as they implicitly ask about the past itself rather than narrative construction. This presupposition is flagged here.
