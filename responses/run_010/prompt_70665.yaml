prompt: |-
  After thirty-five years in a university physiology department I have retired and taken up philosophy, and I now convene a fortnightly reading group composed largely of former colleagues — experimentalists, a statistician, two retired engineers — none of whom has any formal training in the subject. In five weeks it is my turn to lead, and I have chosen Scanlon's contractualism: the criterion of wrongness in terms of principles for the general regulation of behaviour that no one could reasonably reject, together with the aggregation problem that criterion appears to generate. I have forty-five minutes and a whiteboard. What I require is not an explanation of the material but a plan for how I should explain it.

  Specifically: what must already be in place before the criterion can be stated intelligibly to this audience, and what depends on what in the order of introduction; which single case should carry the whole session, and what such a case must have and must conspicuously lack. I had intended to open with a decision from my own working life — whether to accept a small cumulative risk of serious injury to one technician in exchange for forty researchers each losing a modest amount of bench time — and I suspect this is a mistake, though I cannot articulate precisely why. Tell me how the concession that complaints of comparable magnitude may sometimes be weighed together should be introduced so that the group does not conclude the theory has been patched up ad hoc. Map the misconceptions I should expect from people with this training — I anticipate that the statistician will immediately reach for a sum, and that someone will object that the theory therefore always sacrifices the many to the one — and mark the point in the sequence at which each must be headed off.

  Close with one question I can put to the room that would reveal whether the idea has landed, and state plainly what I ought to leave out at this level and announce that I am leaving out.
reasoning: |-
  Okay, let me approach this query methodically. The user is a retired physiology professor transitioning to philosophy, preparing to lead a session on Scanlon's contractualism for a group of scientists and engineers. The core challenge is pedagogical - how to present abstract moral philosophy to empirically-trained minds in just 45 minutes. 

  First, I need to understand the audience's likely mindset. These are people who deal with measurable quantities, controlled experiments, and statistical reasoning. The concept of "reasonable rejection" based on impersonal principles will feel alien to them. Their instinct will be to quantify "comparative magnitude" of complaints or seek decision procedures - exactly what Scanlon wants to avoid. 

  The user's proposed opening example about technician risk versus researchers' time is problematic because it frames the moral dilemma in precisely the consequentialist terms Scanlon rejects. I need to find an alternative case that forces consideration of principle-based objections rather than net outcomes. Something like a lifeguard dilemma where saving one prevents saving many could work better - it makes the "complaint" of the abandoned swimmers vivid without being calculable.

  For structure, I'll suggest building from the ground up: start with what makes acts wrong (not consequences but justification), introduce the reasonable rejection test, then present the aggregation problem as an internal tension in the theory. The key is making "reasonable rejection" concrete - perhaps using the transplant thought experiment where no one could reasonably accept a principle allowing organ harvesting.

  The statistician will inevitably want to sum complaints. I should prepare the user to block this by emphasizing that contractualism cares about justifiability to each person, not net social utility. The "sacrificing many to one" objection can be preempted by showing how some aggregations are permitted when impersonal burdens are comparable.

  Timing is tight. Better to omit historical context and focus on one extended case study. End with a diagnostic question about whether numbers ever matter to test comprehension. The whiteboard should map objections visually to show how the theory holds together systematically.

  This approach respects the user's expertise while addressing the specific hurdles of their audience. The goal isn't comprehensive coverage but creating one "aha" moment about the distinctive nature of moral reasoning.
answer: |-
  Here’s a battle-tested plan tailored to your audience and constraints:

  ### **Pre-Requisites (First 10 mins)**
  1. **The Moral Question**  
     Clarify the target: *"What makes an act wrong?"* Contrast two approaches:  
     - **Consequentialism**: Wrong if bad net outcomes (cue nods from engineers/statistician).  
     - **Deontology**: Wrong if violates rule/duty (e.g., "Don’t lie").  
     *Whiteboard:* Sketch both axes. Emphasize Scanlon offers a *third way*.

  2. **Core Intuition**  
     "Wrongness = inability to justify your act to others." Use a micro-case: *Cutting in line*. Why wrong? Not (just) inefficiency, but *you couldn’t justify it to the person behind you*. This primes "reasonable rejection."

  ---

  ### **Stating the Criterion (5 mins)**  
  - **Scanlon’s Formula**:  
    *"An act is wrong if it violates principles for general behavior that no one could reasonably reject, given their desire to find principles others couldn’t reasonably reject."*  
  - **Key Terms**:  
    - *Principles*: General rules (not ad hoc).  
    - *Reasonably reject*: Burden on a person must be *individualistically intolerable*, not just inconvenient.  
  - *Whiteboard*: Box the criterion. Circle **"reasonably reject."**

  ---

  ### **The Star Case: Lifeguard Dilemma (15 mins)**  
  **Scenario**:  
  *You’re a lifeguard. Two swimmers are drowning:  
  - Swimmer A is 50m away, alone.  
  - Swimmer B is 10m away, but saving B means 10 others further out will die.*  

  **Why this works**:  
  - ✅ **Must have**: Clear *individual complaint* (B’s death vs. 10 deaths).  
  - ✅ **Must lack**: Quantifiable trade-offs (lives ≠ interchangeable units).  
  - ✅ **Tests aggregation**: Can B reject a principle *"save closer swimmers"*? Can the 10 reject *"ignore proximity"?*  

  **Walkthrough**:  
  1. *Principle 1: "Always save the closest."*  
     - **B’s complaint**: "I’m left to die for no fault!" → *Reasonable rejection*.  
  2. *Principle 2: "Save the largest group."*  
     - **B’s complaint**: "My death is discounted for others’ gain!" → *Reasonable?*  
  3. **Aggregation Problem**: If B’s complaint isn’t *greater* than each of the 10’s complaints, can we "add up" small complaints?  

  *Whiteboard*: Map objections side-by-side.  

  ---

  ### **Tackling Aggregation & Misconceptions (10 mins)**  
  | **Misconception**              | **Preemptive Response**                                  | **When to Intervene** |  
  |-------------------------------|----------------------------------------------------------|------------------------|  
  | Statistician sums complaints | "Contractualism blocks summation. We ask: *Can any one person reasonably reject?* Not 'how many complain?'" | During lifeguard case |  
  | "Sacrifices many to one"      | "No: if *each* of many suffers a *trivial* burden (e.g., mild itch), a principle allowing one person’s death *could* be reasonably rejected." | After stating criterion |  
  | "It’s just utilitarianism!"   | Highlight: Aggregation only permitted when burdens are *comparable and impersonal* (e.g., tax $), not life/death. | During Q&A |  

  **Introduce Scanlon’s Concession**:  
  - "Sometimes, when *many* bear *similar, modest* burdens, their complaints *together* may override one person’s large burden. But note: **not summation**—it’s about whether a principle allowing *this pattern* of burdens is rejectable."  
  - *Example*: Building a hospital causes noise to many residents vs. one patient dying without it. Principle: "Allow noise for lifesaving care." Is this rejectable by residents?  

  ---

  ### **Why Your Technician Case Fails**  
  - It smuggles in cost-benefit thinking (risk units vs. bench time).  
  - Burdens are heterogeneous (physical harm vs. productivity).  
  - Audience will instinctively calculate, missing Scanlon’s point.  

  ---

  ### **Closing (5 mins)**  
  **Diagnostic Question**:  
  *"In the lifeguard case, could a principle that says 'save the largest group' be reasonably rejected by Swimmer B? Why/why not?"*  
  - **If they get it**: They’ll note B’s complaint is *uniquely severe* (death vs. others’ risk).  
  - **If not**: They’ll argue "10 > 1" (revealing lingering consequentialism).  

  **What to Omit (Announce Early)**:  
  - *"We’re skipping Scanlon’s meta-ethics, Kant/Rawls comparisons, and ‘value of life’ debates. Focus: Does this criterion handle aggregation without collapsing into utilitarianism?"*  

  ### **Why This Works**  
  - **Audience-centric**: Uses their bias toward cases/objections as teaching moments.  
  - **Whiteboard Logic**:  
    ```  
    Moral Question → Scanlon’s Answer → Lifeguard Test → Aggregation Tension → Scanlon’s Fix  
    ```  
  - **Time**: Strict 5-min blocks keep focus.  

  This primes them to see contractualism as a *system*—not a loophole for utilitarianism, but a framework where justifiability to each person is paramount.
