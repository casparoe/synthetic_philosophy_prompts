prompt: |-
  I'm running a 75-minute seminar section of 24 undergraduates on weakness of will, and I want an activity in which present bias and the question of how to interpret it arise in the room rather than in my lecture. Constraints: no money may change hands, but the stakes must be real enough that students actually care — tokens redeemable for grade-neutral privileges, snacks, time off a task, or the like, at your discretion. Nothing is to be revealed by name until the debrief: students should discover, in their own behavior, both the pull of the immediate option and the fact that they had planned otherwise.

  Design the activity, including:

  - a payoff scheme and rule structure that induces a substantial fraction of students to defect from a choice they made earlier in the same session, where the defection option is genuinely attractive at the moment of decision and cheap to take;
  - an explicit, purchasable commitment device that lets students lock in their earlier choice at a cost, so that the room splits into those who buy it, those who decline it, and those who buy it and later regret having done so;
  - a subset of students cast as forecasters who, before the temptation moment arrives, record their predicted defection rate and predicted reasons, so the group generates its own comparison between forecast and outcome;
  - sealed or simultaneous recording of choices, to strip out social pressure;
  - a minute-by-minute timeline.

  Then a debrief that maps specific moments onto the concepts, that uses the forecasters' data to press whether this is a single agent with time-inconsistent preferences or a succession of differently motivated selves, and that meets the objection a clever student will raise: that simply changing one's mind is not weakness of will at all. Tell me what will predictably go wrong the first time I run it, and be frank about which feature of genuine akrasia — acting against one's own all-things-considered judgment — a compressed classroom exercise cannot reproduce, and what I must supply by argument instead.
reasoning: |-
  We are designing an activity for a 75-minute seminar on weakness of will. The goal is to have students experience present bias and then reflect on it. We have constraints: no money, but real stakes (tokens for privileges, snacks, etc.), and anonymity until debrief. We need to induce defection from an earlier plan, offer a commitment device, include forecasters, and have sealed choices.

  Activity Title: "The Study Session Dilemma"

  Concept: Students face a choice between doing a tedious but short task now (the immediate temptation) versus a more time-consuming task later (the planned task). The immediate task is designed to be attractive in the moment because it's quick and easy, but it leads to a worse outcome overall (because the later task becomes longer). The commitment device allows them to lock in the plan to do the later task at a small cost.

  Setup:

  1. **Tokens and Rewards**: Use tokens that can be redeemed for small privileges (e.g., 5 minutes early dismissal from class, a small snack, or a 1% bonus on a low-stakes assignment). Each student starts with a base of 10 tokens.

  2. **Phases**:
     - **Phase 1: Planning Stage** (15 minutes): Students are told they will have to complete a task. They choose between two options:
       - Option A (Immediate): A very short task (2 minutes) that they will do in the next part of the session. This task is boring but quick (e.g., counting the number of 'e's in a paragraph of text).
       - Option B (Delayed): A longer task (10 minutes) that they will do at the end of the session. This task is more engaging but time-consuming (e.g., solving a set of simple puzzles).
       - However, they are told that if they choose Option A, then the delayed task (which everyone must do regardless) will become more burdensome: it will be extended by an extra 5 minutes (so 15 minutes total). If they choose Option B, they avoid this penalty.

     The key is that Option B is the better choice overall because it avoids the extra time. But in the moment, Option A might be tempting because it's quick.

     Students record their choice (anonymously) on a slip of paper. They are told that their choice is binding unless they purchase a commitment device (which we introduce later).

  3. **Phase 2: Commitment Market** (10 minutes):
     - Now, we introduce the commitment device. For a cost of 2 tokens, students can lock in their Phase 1 choice. If they lock in, they cannot change their mind in Phase 3. If they don't lock in, they can switch in Phase 3.
     - Students are told that in Phase 3, they will have the chance to change their choice to Option A (the immediate task) without any cost (except the penalty of the longer delayed task). But if they locked in, they cannot change.
     - They must decide whether to buy the commitment. They record this decision (again anonymously) on a slip.

  4. **Phase 3: Temptation Stage** (15 minutes):
     - Now, we set up the immediate task (counting 'e's). We describe it as a quick 2-minute task that they can do right now to get it over with. We emphasize that if they switch to Option A, they avoid the 10-minute delayed task (but they will have to do a 15-minute delayed task instead). They are reminded that if they chose Option B and did not lock in, they can switch to Option A now without any additional token cost (but they lose the tokens they might have spent on commitment if they did).
     - Students who originally chose Option A in Phase 1 are not given a choice in this phase (they must do the immediate task) unless they had locked in? Actually, let's clarify: The commitment device is only for those who chose Option B in Phase 1. For those who initially chose Option A, they are already committed to the immediate task and do not have a commitment option (they are on the path to the penalty).

     But to avoid confusion: 
     - Students who initially chose Option A: they do the immediate task in Phase 3 and then will have the extended delayed task.
     - Students who initially chose Option B: 
          - If they bought the commitment: they cannot switch and will do the delayed task (without penalty) at the end.
          - If they did not buy the commitment: they can choose in Phase 3 to either stick with B (and do the delayed task without penalty) or switch to A (and then do the immediate task and face the penalty).

     In Phase 3, we set up the immediate task and give the non-committed Option B choosers the option to switch. We also have the Option A choosers do the immediate task.

     We run the immediate task: give everyone a paragraph and 2 minutes to count the 'e's. But note: only those who are doing the immediate task (either because they originally chose A or because they switched from B to A in Phase 3) do this task. The others (committed B and non-committed B who stick to B) do nothing at this time.

  5. **Phase 4: The Delayed Task** (15 minutes at the end): 
     - We run the delayed task. For those who avoided the penalty (chose B and stuck to it), the task is 10 minutes. For those who chose A or switched to A, the task is 15 minutes. We use a set of puzzles (e.g., simple logic puzzles, math problems) that are engaging but take time.

     We note that the delayed task is done by everyone, but the length depends on their choices.

  6. **Forecasters**:
     - At the start of the activity, assign 5-6 students (randomly) to be forecasters. They do not participate in the main activity (they don't make the choices or do the tasks) but observe.
     - In Phase 1, after the initial choice is made by others, the forecasters are asked to predict:
          - What percentage of the non-forecaster students who initially choose Option B will defect (switch to Option A) in Phase 3?
          - What will be the main reason for defection? (They write down one or two reasons.)
     - They record their predictions on a slip and hand them in.

     We have about 18-19 non-forecaster students (since 24 total, 5-6 forecasters).

  7. **Anonymity**:
     - All choices (Phase 1, commitment purchase, Phase 3) are recorded on slips with a unique anonymous ID (e.g., a random number assigned at the start). This way, we can track individual choices without knowing who it is.

  8. **Timeline** (75 minutes total):

     - 0-5 min: Introduction to the activity and rules. Assign anonymous IDs and assign forecasters. Hand out base tokens (10 tokens to each non-forecaster).
     - 5-20 min: **Phase 1 (Planning)**: Explain the two options and have students choose A or B. Collect slips.
     - 20-30 min: **Phase 2 (Commitment Market)**: Explain the commitment device (cost 2 tokens) for those who chose B. They decide whether to buy. Collect commitment slips. (Forecasters write their predictions during this time and hand in by the end of the phase.)
     - 30-45 min: **Phase 3 (Temptation)**: 
          - Announce that the immediate task (counting 'e's) is about to begin. 
          - For students who originally chose A: they must do the task.
          - For students who originally chose B and did not buy commitment: they are given a choice: they can either switch to A (and do the immediate task) or stick to B (and not do the immediate task). They record their choice on a slip and then those who choose A (or originally A) do the task.
          - Hand out the paragraph and give 2 minutes for the task. Collect the task sheets and the Phase 3 choice slips.
     - 45-60 min: **Phase 4 (Delayed Task)**: 
          - Explain the delayed task. Hand out the puzzle sets. 
          - For those without penalty: 10 minutes of work (they are told to work for 10 minutes and then stop).
          - For those with penalty: 15 minutes of work (they are told to work for 15 minutes). 
          - Actually, we can run it simultaneously: have everyone start, but after 10 minutes, tell the non-penalty group to stop and hand in. The penalty group continues for 5 more minutes. This makes the penalty salient.
     - 60-75 min: **Debrief**.

  9. **Debrief**:
     - Reveal the aggregate data: 
          - How many chose A vs B in Phase 1?
          - How many of the B-choosers bought commitment?
          - How many of the non-committed B-choosers defected (switched to A) in Phase 3?
          - Compare with the forecasters' predictions (average predicted defection rate and reasons).

     - Map to concepts:
          - Phase 1: The planned choice (most should choose B, the better option).
          - Phase 3: The moment of temptation. The immediate task is quick and seems attractive (present bias). The cost (extra 5 minutes in the delayed task) is in the future and feels less salient.
          - Commitment device: Some paid to lock in, which is a way to overcome present bias.

     - Key questions:
          - Why did some defect? (They might say: "It was just easier to get it over with", "I didn't want to wait", "I thought the immediate task was quick and I could handle the extra time later".)
          - Why did some buy commitment? (They anticipated they might be tempted and wanted to force themselves to stick to the plan.)
          - Were there any who bought commitment and then regretted it? (Perhaps during the delayed task, they saw the non-penalty group finish early and they had to keep working? But note: the commitment device locked them into avoiding the penalty, so they shouldn't regret it? Actually, they might regret having spent the tokens? Or if they were in the penalty group and had to work longer, they might wish they had done the immediate task? But note: the commitment device was only for those who chose B and wanted to avoid the penalty. So they avoided the penalty and did the 10-minute task. They shouldn't regret it. However, we can ask: did anyone who bought the commitment device feel during the temptation phase that they wanted to switch? They couldn't, so they might have felt frustrated. But they avoided the extra time. So we might not get regret. Alternatively, we might have a few who in Phase 3 think the immediate task is very easy and they could have saved tokens by not buying commitment and then switching? But that's not regret about the task choice but about the token expenditure. We can ask: "If you bought the commitment, did you feel during the temptation phase that you wished you could switch?")

     - Addressing the clever student: 
          - The objection: changing your mind might be rational (new information, etc.). How is this weakness of will?
          - We must emphasize that in this setup, the students had the same information in Phase 1 and Phase 3. The only thing that changed was the proximity of the immediate task. The cost (extra 5 minutes) was known and was the same. So if they changed their mind, it was due to a shift in time preference (present bias) and not new information. This is a hallmark of weakness of will: acting against one's own best judgment formed earlier.

     - What the exercise cannot capture about akrasia:
          - In real life, the all-things-considered judgment might be more deeply held and reflective. In the activity, the stakes are low and the judgment is formed quickly. 
          - The exercise might not capture the inner conflict and guilt that often accompanies real weakness of will.
          - The time frame is compressed. Real present bias often plays out over longer periods.

     - What we must supply by argument:
          - We must argue that the students in Phase 1 formed a judgment that B was better (avoiding the extra 5 minutes). When they switch in Phase 3, they are acting against that judgment. The fact that they are willing to incur the extra 5 minutes for the sake of a quick task now is a form of time inconsistency. We can connect to hyperbolic discounting.

  10. **What might go wrong**:
      - **Stakes too low**: Students might not care about the tokens or the extra 5 minutes of work. We must make the rewards meaningful (e.g., the 1% bonus on an assignment might be more compelling than early dismissal). Also, the delayed task must be sufficiently aversive (boring?).
      - **Not enough defection**: If the immediate task is too boring, they might not be tempted. We must design the immediate task to be quick and easy (but boring) and the delayed task to be more engaging but long. We want the immediate task to be attractive in the moment because it's quick, even though it leads to a longer total work time.
      - **Social pressure**: Even with anonymous slips, students might talk. We must enforce silence and independent work.
      - **Time management**: The phases must run on time. The delayed task must be designed so that it can be done in 10 and 15 minutes. We should have more than enough puzzles so that no one finishes early.
      - **Forecasters might influence**: They are not participating, but they might chat. We must keep them separate.

  11. **Adjustments**:
      - If we have time, we can run the activity twice: once without commitment and once with, to show the effect of commitment. But in 75 minutes, we have time for one run.

  Let's write the instructions for the tasks:

  - **Immediate task**: A paragraph of text (about 200 words) with a moderate number of 'e's (maybe 40-50). Example paragraph (on a neutral topic, e.g., about weather patterns). Students must count the 'e's and write the number on a sheet.

  - **Delayed task**: A set of 20 simple logic puzzles (e.g., Sudoku-like, or word puzzles). We can have two versions: one with 15 puzzles for the 10-minute group and 22 puzzles for the 15-minute group? Actually, we can give the same set but tell the penalty group to do 50% more. Or we can have two sets of puzzles, with the penalty set being longer. Alternatively, we can use a task that is naturally time-consuming, such as writing a short reflection on a topic. But puzzles are better because they are more controlled.

  Alternatively, to make the penalty more salient, we can have the non-penalty group work for 10 minutes and then get to leave (or have free time) while the penalty group works for an extra 5 minutes. This way, they see others finishing early.

  This design should work. Let's now write the minute-by-minute timeline in detail.

  **Minute-by-Minute Timeline**:

  - 0-5: Introduction
      - Explain the activity: "We are going to do an exercise about decision-making. You will make choices that affect how much work you do in class. You will earn tokens that can be exchanged for [list rewards]."
      - Assign anonymous IDs (hand out slips with random numbers, have students write it on all their slips).
      - Randomly choose 5-6 students to be forecasters (give them a different color slip). The rest are participants.
      - Hand out 10 tokens to each participant (can be physical tokens or recorded on a sheet).

  - 5-20: Phase 1 (Planning)
      - Explain the two options for the tasks they will do:
          - Option A: Do a short task (2 minutes) during the next part of the session. BUT if you choose this, then the later task (which everyone must do) will be 15 minutes instead of 10.
          - Option B: Skip the short task now, and do only the later task for 10 minutes (without the extra 5 minutes).
      - Emphasize: "The total work time if you choose A: 2 minutes now + 15 minutes later = 17 minutes. If you choose B: 0 minutes now + 10 minutes later = 10 minutes. So B is clearly less work overall."
      - Have them choose A or B on a slip (with their ID) and collect.

  - 20-30: Phase 2 (Commitment Market)
      - Announce: "If you chose Option B in Phase 1, you now have the option to buy a commitment device. For 2 tokens, you can lock in your choice of B. This means that in the next phase, you will not be allowed to switch to A. If you do not buy this, you will be allowed to change your mind in the next phase and switch to A without any additional token cost (but you will then have to do the immediate task and face the 15-minute later task)."
      - For those who chose A in Phase 1: "You do not have a commitment option because you are already scheduled to do the immediate task."
      - Participants who chose B decide on commitment (yes or no) and record on a slip (with ID). They also pay 2 tokens if yes (hand tokens to the instructor or mark on a token record).
      - Meanwhile, the forecasters are given a prediction slip: 
          - Predict the percentage of participants (non-forecasters) who chose B in Phase 1 and then switch to A in Phase 3 (i.e., defect). 
          - Also, write the main reason they think people will defect.
          - Collect the forecast slips.

  - 30-45: Phase 3 (Temptation)
      - Set the scene: "We are now going to do the immediate task. It is a short task of counting the letter 'e' in a paragraph. It will take about 2 minutes."
      - Instructions:
          - "Participants who chose Option A in Phase 1: You must do this task now. Please take a paragraph sheet and begin when I say go."
          - "Participants who chose Option B in Phase 1 and did not buy commitment: You now have a choice. You can either switch to Option A (and do the immediate task now, and then do the 15-minute later task) OR stick with Option B (skip this task and then do the 10-minute later task). Record your choice on the slip (A or B) and hand it in. If you choose A, take a paragraph and do the task. If you choose B, you do nothing now."
          - "Participants who chose Option B and bought commitment: You must stick with B. You do nothing now."
      - Hand out the paragraph to those doing the task (Option A choosers and defectors). Give 2 minutes to do the task. Collect the task sheets and the Phase 3 choice slips from the non-committed B group.

  - 45-60: Phase 4 (Delayed Task)
      - Explain: "Now we do the delayed task. It is a set of puzzles. You will have to work on them for a set amount of time."
      - Assign:
          - Penalty group (those who did the immediate task, i.e., original A or defectors to A): 15 minutes of work.
          - Non-penalty group (original B who stuck to B, whether committed or not): 10 minutes of work.
      - Hand out the puzzle sets. 
          - Start the timer. 
          - After 10 minutes: "Non-penalty group, please stop and hand in your puzzles. Penalty group, continue for 5 more minutes."
      - At 15 minutes: collect from the penalty group.

  - 60-75: Debrief
      - Reveal the aggregate data (without individual IDs). Write on the board:
          - Number who chose A in Phase 1: X
          - Number who chose B in Phase 1: Y
          - Of the B-choosers, number who bought commitment: Z
          - Of the B-choosers who did not buy commitment, number who defected: W
          - Defection rate: W / (Y - Z)   [if Y-Z>0, else 0]
      - Show the forecasters' predictions (average and reasons).
      - Discuss:
          - Why did some defect? How did it feel in the moment?
          - Why did some buy commitment? Did it work?
          - Did anyone regret buying commitment? (Maybe they felt constrained even though they didn't want to switch? Or they lost tokens and then didn't need it because they wouldn't have switched? We might get some who say they wouldn't have switched so the tokens were wasted.)
      - Connect to present bias and weakness of will.
      - Address the objection: changing one's mind vs. weakness of will. Emphasize that the change was due to the immediacy of the task, not new information.
      - Discuss the forecasters' predictions: did they over/underestimate defection? Why?

  This activity should create a tangible experience of present bias and commitment, and set up a rich discussion on weakness of will.
answer: |-
  ### Activity Design: "The Timer's Temptation"

  #### **Core Mechanism**
  Students choose between an immediate, low-effort task (temptation) and a delayed, high-value task (plan), with a penalty for defection. Tokens (redeemable for grade-neutral perks) are used to create stakes. The activity creates a conflict between a prior plan and a spontaneous desire for immediate relief.

  ---

  ### **Setup & Rules**
  - **Tokens**: Each student starts with 10 tokens. Tokens are redeemable post-activity for:  
    - 1 token = 30 seconds early dismissal  
    - 3 tokens = Skip one quiz question (max 2 skips/semester)  
    - 5 tokens = Snack (e.g., granola bar)  
  - **Phases**: Conducted anonymously via numbered slips (students draw random IDs at start).
  - **Tasks**:  
    - **Task A (Temptation)**: Quick but tedious (e.g., transcribe a paragraph of gibberish).  
    - **Task B (Plan)**: Longer but engaging (e.g., solve simple logic puzzles).  
  - **Penalty**: Choosing Task A shortens Task B but adds a 50% time penalty.  

  #### **Payoff Scheme**
  | Choice Sequence      | Task A (Now) | Task B (Later) | Token Cost | Total Time | Token Bonus* |
  |----------------------|--------------|----------------|------------|------------|--------------|
  | **Plan: B → Stick**  | None         | 10 min         | 0          | 10 min     | +3 tokens    |
  | **Defect: B → A**    | 2 min        | 15 min         | 0          | 17 min     | 0            |
  | **Plan: A**          | 2 min        | 15 min         | 0          | 17 min     | 0            |
  | **Commitment Device**| N/A          | 10 min         | 2 tokens   | 10 min     | +1 token    |

  *Token bonus rewards adherence to the original plan.  
  **Commitment device**: Pay 2 tokens to lock in Task B. If purchased, defection is blocked.

  ---

  ### **Activity Timeline** (75 min total)
  #### **Phase 1: Planning (0–15 min)**
  - **0–5 min**: Introduce rules. Distribute anonymous ID slips. Assign 6 forecasters (randomly).  
  - **6–15 min**:  
    - **All students**: Choose between:  
      - *Option A (Temptation)*: Do 2-min transcription now; Task B becomes 15 min later.  
      - *Option B (Plan)*: Skip transcription; do 10-min Task B later (+3 token bonus if completed).  
    - Record choice on slip (A/B) → collect in box.  
    - **Forecasters only**: Predict % of *non-forecasters* who defect (switch B→A) and top 2 reasons.  

  #### **Phase 2: Commitment Market (15–25 min)**  
  - **15–20 min**: Announce commitment device:  
    - *Cost*: 2 tokens to lock in Task B (if initially chosen).  
    - *Benefit*: Defection blocked; +1 token bonus if Task B completed.  
  - **20–25 min**:  
    - Non-forecasters decide: buy commitment (Y/N) → record on slip.  
    - Tokens deducted immediately if bought.  

  #### **Phase 3: Temptation (25–40 min)**  
  - **25–30 min**: Set up Task A:  
    - Display gibberish paragraph (e.g., "Xq Jzr Lp9! Fw3 nKt...").  
    - Emphasize: "Quick and easy — get it over with now!"  
  - **31–40 min**:  
    - **Task A group**: Students who chose A in Phase 1 *or* defect from B do Task A.  
    - **Defection choice**: Non-committed B-choosers decide:  
      - *Stick*: Do nothing now → proceed to Task B.  
      - *Defect*: Do Task A → forfeit bonus.  
    - Choices recorded via anonymous slip (simultaneous drop in box).  

  #### **Phase 4: Delayed Task (40–60 min)**  
  - **40–50 min**: Task B (logic puzzles):  
    - Non-defectors: 10-min version (5 puzzles).  
    - Defectors/initial A: 15-min version (8 puzzles).  
  - **51–60 min**: Penalty salient: Non-defectors finish at 50 min; defectors work until 60 min.  

  #### **Forecasters' Role (Throughout)**  
  - Observe anonymously. Submit predictions/notes by Phase 3 start.  

  ---

  ### **Debrief (60–75 min)**  
  #### **Step 1: Reveal Data (5 min)**  
  - Share aggregate results:  
    - % initial B-choosers.  
    - % who bought commitment.  
    - % defection (B→A) among non-committed.  
    - Forecasters' average prediction vs. actual.  

  #### **Step 2: Map Concepts to Behavior (8 min)**  
  - **Present bias**: Temptation phase exploited immediacy ("Just 2 min now!"), ignoring future penalty.  
  - **Commitment**: Those who paid 2 tokens anticipated bias. Some regret if they overcommitted (e.g., low temptation).  
  - **Forecasters' gap**: Predictions often underestimate defection (students assume peers are rational).  

  #### **Step 3: Key Discussion Questions (7 min)**  
  1. **"Single agent or multiple selves?"**  
     - Use forecasters' data: If students predicted defection *but still defected*, it suggests internal conflict (e.g., "I knew I’d give in, but did it anyway").  
     - Contrast with rational mind-change (e.g., new info). Here, no new info existed — only time passed.  

  2. **Address "not weakness of will" objection**:  
     - **Counter**: Weakness of will requires:  
       (a) A prior *all-things-considered judgment* (Phase 1: B was optimal).  
       (b) *Akrasia*: Acting against that judgment despite unchanged facts.  
     - **Evidence**: Defectors knew the penalty (17 min > 10 min) but chose immediacy. Commitment buyers *expected* this.  

  #### **Step 4: Limitations & Bridge to Theory (5 min)**  
  - **What the exercise can’t capture**:  
    - **Depth of judgment**: Real akrasia involves deep values (e.g., quitting smoking). Classroom stakes are shallow.  
    - **Emotional guilt**: Defectors may feel mild annoyance, not profound regret.  
    - **Long-term inconsistency**: Compression misses recurring self-sabotage.  
  - **What you must argue**:  
    - "This mimics *structure* of akrasia: planning vs. doing. But real weakness of will amplifies when stakes are personal/high-stakes. Imagine this with health or money decisions."  

  ---

  ### **Predictable Pitfalls & Fixes**  
  1. **Low defection rate**:  
     - **Why**: Task A too aversive, or penalty too weak.  
     - **Fix**: Make Task A *trivially easy* (e.g., "copy 3 lines") and penalty *salient* (e.g., non-defectors visibly relax early).  

  2. **Token apathy**:  
     - **Why**: Students undervalue privileges.  
     - **Fix**: Pre-activity survey to choose rewards (e.g., "Which perks would you fight for?").  

  3. **Social pressure leaks**:  
     - **Why**: Whispering during temptation phase.  
     - **Fix**: Strict silence rule; separate desks; use privacy screens.  

  4. **Regret missing**:  
     - **Why**: Commitment buyers avoid penalty → feel smart.  
     - **Fix**: Add a "trap": Some commitment buyers see Task A is easier than expected and wish they saved tokens.  

  ---

  ### **Materials**  
  - Anonymous ID slips (pre-numbered).  
  - Task A: Gibberish paragraph (e.g., lorem ipsum + symbols).  
  - Task B: Logic puzzles (varying difficulty).  
  - Token ledger (digital or paper).  
  - Sealed boxes for slip collection.  

  This design forces students to *live* the tension between plan and impulse, using low-cost stakes to mirror real present bias. The debrief turns their behavior into a lab for dissecting weakness of will.
