  First thought: the speech-act theory translates neatly to dramatic irony. The gap between the government's performative intent and the victims' reception is pure narrative gold. For standing, the narrator's own shaky belief in their authority could manifest through free indirect style—letting their internal conflict bleed into third-person narration. The addressee problem screams "unreliable narrator"—maybe the speechwriter keeps imagining dead ancestors listening, revealing their own guilt. Legal hedging is all about subtext; what the draft leaves unsaid could haunt the margins.

