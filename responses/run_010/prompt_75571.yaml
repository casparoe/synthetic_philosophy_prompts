answer: |-
  Here's the translation into craft vocabulary, claim by claim, with the residue highlighted as requested:

  ### 1. The Speech-Act Claim (Uptake & Empty Theatre)
  *   **Craft Counterpart:** **Dramatic Irony & Scene vs. Summary.** The apology draft (scene) is written with specific assumptions about how it *will* land (uptake). The *actual* reception by the descendants (another scene, or summary of reactions) creates dramatic irony. Does the audience (reader) see the gap between the speaker's intent and the recipients' perception? Is the apology *shown* to be received as genuine, hollow, or offensive?
  *   **The Bend:** Craft focuses on *showing* the gap, not defining the philosophical conditions of a "real" apology. Uptake becomes dramatic tension: *Will they accept it? How?*
  *   **Residue / Hole:** The core question of **"What *makes* it an apology?"** isn't fully translatable. Craft shows *if* it lands or feels hollow, but the *objective criteria* for a valid speech-act vanish. You show the *performance* and the *reception*, leaving the *ontological status* ("was it *really* an apology?") ambiguous. Your toolkit *does* risk prioritizing a *satisfying scene* over the justice question – the satisfaction comes from the *resolution of the dramatic tension* (Did they accept? How did it feel?), not necessarily the justice achieved.

  ### 2. The Standing Claim (Who Apologizes?)
  *   **Craft Counterpart:** **POV & Unreliable Narrator.** This is the narrator's internal conflict made external. *Whose story is it?* Likely the narrator/speechwriter's. Their struggle is: "Do *I*, writing *now*, have the *right* to craft these words for an entity (the State) I represent but didn't commit the acts? Do *we*?" This manifests as:
      *   **Free Indirect Style:** Bleeding the narrator's doubt into the description of the State's posture. ("*The State, that ancient, faceless beast, lumbered towards contrition. Or was it just performing? We, the inheritors of its machinery, felt... what? Responsibility? Or just the awkwardness of the chore?*")
      *   **Want vs. Need:** The narrator *wants* to write a good speech (their job). They *need* to grapple with their own complicity and the legitimacy of the act. Their belief (or lack thereof) in the State as a "continuing corporate agent" shapes their voice.
  *   **The Bend:** The philosophical debate about corporate personhood becomes the narrator's *personal crisis of legitimacy and representation*. The "standing" question is internalized as character conflict.
  *   **Residue / Hole:** The **metaphysical question** ("*Can* an abstract entity apologize across time?") has no craft counterpart. Craft deals with *human perception and feeling*. You show the narrator *struggling* with the concept, but the reader's judgment on whether the State *can* legitimately apologize remains philosophical, not craft-driven. The craft focuses on the *emotional and psychological cost* of attempting it.

  ### 3. The Addressee Claim (Who Receives It?)
  *   **Craft Counterpart:** **Implied Reader & The Obligatory Scene.** The narrator constantly grapples with the **audience** – both the immediate listeners (living descendants) and the ghosts of the dead. The *obligatory scene* is the *reaction* of the descendants. Who *shows up*? How do they react? What do they *say*? Does the narrator imagine the dead listening?
      *   **POV Power:** The narrator's choice of who to *focus* on in the audience reveals their understanding (or avoidance) of the problem. Do they fixate on an elder representing the past? On a young person representing the future? On empty seats symbolizing the dead?
      *   **Dramatic Irony (Again):** The descendants' reactions reveal who *they* feel the apology is truly for (themselves? their ancestors? the government's conscience? the media?).
  *   **The Bend:** The abstract "who" becomes concrete characters whose *reactions* are dramatized. The "acceptance" question becomes a scene of observable human response.
  *   **Residue / Hole:** The **existential void** – apologizing *to the dead* – has no direct craft tool. You can *evoke* it (through imagery, the narrator's thoughts, characters explicitly stating its impossibility), but you cannot *resolve* it within craft. Craft deals with the living. The residue is the palpable, unbridgeable gap between the words spoken now and the ears that needed to hear them generations ago. This is pure thematic weight, carried by atmosphere and character feeling.

  ### 4. The Lawyers' Claim (Regret vs. Apology/Liability)
  *   **Craft Counterpart:** **Subtext & The Unreliable Narrator.** This is gold for craft. The *drafting process* is where this plays out.
      *   **Scene:** Show the arguments with lawyers/politicians. "Strike 'apologize,' insert 'deeply regret.'" "Can we say 'mistakes were made' instead of 'we committed atrocities'?"
      *   **Subtext:** The *real* meaning lies beneath the hedged language. The narrator knows the draft is weak, the lawyers know why. The reader understands the evasion.
      *   **Unreliable Narrator:** Does the narrator convince *themselves* the hedged language is enough? Or do they see it as a betrayal? Does their internal monologue reveal the concessions?
      *   **Dramatic Irony:** The reader sees the gap between the powerful, unambiguous apology the narrator *wanted* to write and the legally-sanitized version produced.
  *   **The Bend:** The legal distinction becomes a narrative engine for conflict and character revelation. The "is it still an apology?" question becomes "How much betrayal is the narrator complicit in?"
  *   **Residue / Hole:** The **strict legal definition of liability** tied to specific words isn't a craft concern. Craft cares about the *perception* of sincerity, evasion, and betrayal generated by the word choice and the process. The residue is the *power dynamics* revealed – the State's self-protection overriding moral clarity.

  ## The Big Residue & Your Structural Question

  *   **The Core Residue:** Your craft vocabulary *excels* at dramatizing the **human experience** surrounding the apology: the internal conflict of the writer, the political maneuvering, the drafting tension, the performance, the immediate reaction of the living audience. It makes these elements vivid and compelling.
  *   **The Hole:** It **cannot directly dramatize or resolve the core philosophical/ethical questions** of justice, transgenerational responsibility, corporate identity across time, or speaking to the dead. These remain abstract weights your characters *feel* and *grapple with*, but which exist outside the mechanics of scene, summary, POV, etc. Craft translates the *debate* into *character struggle* and *dramatic tension*, not into answers.
  *   **The Conversion Risk:** You nailed it. Craft *is* primarily concerned with whether the audience (reader) experiences a **satisfying narrative resolution** – which often *feels* like justice or closure within the story's world. It *can* simulate resolution even where real justice is impossible. This is a feature, not necessarily a bug, but it requires awareness.

  ## Your Subplot & The Climax: Leaning In, Not Fixing

  **Stop trying to fix the hollowness. That *is* the point. Lean in hard.**

  1.  **The Structural Problem Isn't:** Your subplot feels hollow because the *thing it's supposed to repair is unrepairable*. That's the brutal, essential truth your story is uncovering. Trying to make the apology feel like a *true* resolution would be a betrayal of the historical reality and the core dilemmas you've researched.
  2.  **Make the Climax About the Revelation of the Hole:** The "climax" shouldn't be the apology magically fixing things. It should be the moment your narrator (and hopefully the reader) fully confronts the **insurmountable gap**:
      *   The **Speechwriter's Realization:** As they deliver the words (or hear them spoken), they viscerally understand the limitations. The ghosts remain unappeased. The living audience's reaction (anger, tears, silence, dismissal) underscores the inadequacy. The legal hedges ring hollow. The State's continuity feels like a convenient fiction.
      *   **Dramatic Irony as Epiphany:** The reader sees the vast chasm between the ceremony and the unhealed wound. The climax is the *realization* of the chasm.
      *   **Denouement = Living with the Hole:** The aftermath isn't restoration. It's the narrator (and perhaps the descendants) having to live in a world where this performative, inadequate gesture is the best that could be managed, knowing it changes little materially but perhaps shifts something intangible (awareness? the official record?) amidst the enduring injustice. Their "need" might be to confront this uncomfortable truth instead of seeking false closure.
  3.  **Whose Story Is It?** If it's the speechwriter's, their arc *is* this journey from wanting to write a good speech (want) to understanding the profound, perhaps crushing, limitations and complexities of the act itself (need). The apology isn't the *repair*; it's the *catalyst* for their disillusionment or deeper understanding.
  4.  **Implied Reader:** You're writing for readers who can sit with discomfort, ambiguity, and unresolved injustice. The "satisfaction" comes not from closure, but from the stark, honest portrayal of the attempt and its inherent failure to truly mend the unfixable. It’s a tragedy of modern bureaucracy and historical weight.

  **Conclusion:** Your toolkit brilliantly illuminates the *human drama* around the apology. The "residue" – the irreparable nature of the original wrong, the impossibility of truly speaking to the dead, the abstract nature of state continuity – isn't a flaw in your craft. It's **the thematic core your craft exposes**. Don't write the apology as a successful repair. Write it as the moment the characters (and reader) stare into the void of historical injustice and understand that words, however well-crafted, however officially delivered, can only ever be a gesture *towards* something unattainable. The hollowness *is* the truth. Let it resonate. That's powerful literary fiction.
