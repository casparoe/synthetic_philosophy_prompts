  First, I need to break down the passage claim by claim. The user wants three categories: what deflationists accept, what's an oversimplification, and what they'd deny. Let me start with Ramsey's observation. That's core deflationism—truth as a device for endorsement via disquotation. That's solid. Then the part about truth not being a property. Hmm, this is tricky. Some deflationists like Horwich do call it a property but stress it's insubstantial. The passage's absolute denial might be too strong, so it's a simplification.  

