prompt: |-
  Over the past two years I have been trying to discipline my own project estimates by starting from how often comparable things have overrun or failed, rather than from my sense of the particular case in front of me. The habit has exposed a pattern in how other people argue that I have not managed to find a label for.

  First instance: I put it to a committee that programmes of this kind have historically overrun their budgets about seventy per cent of the time, and the reply is that ours is not really of that kind — it has a completed pilot, it is publicly funded, it sits under a certain budget ceiling — together with a narrower description of the class for which the recorded overrun rate is much lower. Second instance: a colleague predicts that a venture will succeed, is told that most such ventures fail, and re-describes the venture, one qualification at a time, until it falls inside a class that mostly succeeds. In neither case is anyone lying, and in neither case is the narrower description false; there is a genuine question about which description is the relevant one. What strikes me is that the search stops the moment a comfortable number appears, and that the estimate afterwards sits almost exactly where the person's gut feeling had already put it — only now with a rate attached. The exercise produces the surface of statistical humility while leaving the conclusion untouched.

  Is there an established concept for this specific failure: the choice of comparison class being governed by the answer one already wants? I know of the general puzzle about which class a probability properly attaches to, but that is usually posed as a difficulty for the interpreter, not as a move available to anyone wishing to escape an inconvenient rate. Nor is it quite special pleading, since the narrowing is offered with reasons rather than as a bare exemption, and it is not simply motivated reasoning either, because the reasoning is formally correct and the bias lies entirely in the selection step. I would like to know how it differs from each of those, from after-the-fact rationalisation, and from legitimate narrowing of a class; and if nothing settled exists, please propose a term, define it, and mark its edges — in particular, at what point a defensible insistence that the cases are not comparable turns into this. A name on its own will not answer my question.

  Please write your response in British English.
reasoning: |-
  Okay, the user describes a pattern they've observed in project estimation where people selectively narrow comparison classes to match their preconceived conclusions. They want to know if there's an established term for this specific cognitive bias where the selection of reference groups is manipulated to achieve desired statistical outcomes. 

  The user has clearly put deep thought into this - they've been observing this phenomenon for two years across committees and colleagues. What makes this sophisticated is their recognition that it's not simple dishonesty or motivated reasoning; the narrowing appears logically valid with supporting reasons, yet systematically serves to confirm prior beliefs. They're asking for precise conceptual boundaries between legitimate classification and this biased pattern.

  Hmm... existing terms don't quite fit. "Special pleading" lacks the statistical veneer, "motivated reasoning" ignores the formal validity of the reclassification step, and "base rate neglect" is too broad. The core issue is the strategic retreat through reference classes until hitting a comfortable statistic. 

  I recall Gelman's "garden of forking paths" describes how flexible data interpretation can serve preconceptions, but that's more about analysis than reference class selection. The closest established concept might be reference class manipulation within decision theory literature, but even that doesn't capture the ritualistic aspect - how the process stops precisely at the desired number. 

  For a new term, "reference class tennis" reflects the back-and-forth nature, while "statistical aikido" captures redirecting base rates. But "retrospective reference tailoring" seems most precise - it emphasizes the after-the-fact adjustment of categories to fit predetermined conclusions. The key differentiator from legitimate narrowing is the stopping rule: revisions continue only until confirmation is achieved, not until optimal classification. 

  The ethical boundary lies in whether the reclassification would persist if the statistics were reversed. If the same distinctions wouldn't be raised to argue against a desired outcome, it's likely bias. This pattern deserves naming because it's statistical hypocrisy - using the form of data-driven reasoning to evade data's substance.
answer: |-
  Your observation captures a nuanced and pernicious form of epistemic bias that **lacks a single, universally established term** but intersects with several recognised concepts. Below is a structural analysis, differentiation from related ideas, and a proposed term—all in British English.

  ---

  ### **Core Failure: Strategic Reference Class Manipulation**
  This is the **selective narrowing or redefinition of a comparison class to align with a predetermined conclusion**, exploiting the inherent ambiguity in reference class selection. The bias manifests in:
  1. **Motivated stopping rule**: The search halts precisely when a favourable statistic (e.g., low overrun rate) is found.
  2. **Illusory statistical rigour**: Using ostensibly objective data to retroactively justify an intuitive estimate.
  3. **Neglect of disconfirming base rates**: Ignoring broader statistical realities by overfitting the reference class to the target case.

  ---

  ### **Differentiation from Related Concepts**
  | Concept                 | How It Differs                                                                                             |
  |-------------------------|------------------------------------------------------------------------------------------------------------|
  | **Special Pleading**    | Your cases involve *reasoned reclassification* (e.g., "publicly funded + pilot"), not a bare exemption.    |
  | **Motivated Reasoning** | The reasoning *is* logically valid per the new class; the bias is in *choosing which class to accept*.     |
  | **Base Rate Neglect**   | Here, base rates are *actively evaded* via reclassification, not ignored.                                  |
  | **HARKing**             | Hypothesising After Results Known—this generates *new hypotheses*; your cases *retrofit classifications*. |
  | **Legitimate Narrowing**| Driven by *evidence of material difference* (e.g., unique risk factors), not *convenient statistics*.      |

  ---

  ### **Proposed Term: Retrospective Reference Tailoring (RRT)**
  **Definition**:  
  *The practice of iteratively adjusting a reference class—by adding or removing criteria—until it yields a statistic that confirms a pre-existing belief, creating a façade of empirical justification while insulating the original intuition from disconfirmation.*

  **Key Markers**:
  1. **Directional refinement**: Criteria are added *only if* they improve the statistic (e.g., excluding failed projects but not successful ones).
  2. **Stopping at comfort**: The process ceases upon reaching the desired number, irrespective of whether broader classes remain relevant.
  3. **Gut-driven anchoring**: The final estimate aligns suspiciously with the initial intuition, now "validated" by a cherry-picked rate.
  4. **Asymmetry test**: The same distinctions would *not* be raised to challenge a favourable prior belief.

  **Edges & Boundaries**:  
  RRT becomes illegitimate when:
  - The reclassification lacks **empirical or causal justification** (e.g., "projects with blue logos succeed more").
  - The narrowing **ignores material factors** from broader classes (e.g., disregarding sector-wide risks).
  - There is **no effort to test** whether the new class *predicts* outcomes better than alternatives.
  - It serves **solely to dismiss inconvenient base rates** without engaging their substance.

  ---

  ### **Why This Fits Your Cases**
  1. **Committee example**:  
     The exclusion of projects lacking "public funding + pilot" is defensible *in isolation*, but becomes RRT because:  
     - The criteria are selected *because* they lower the overrun rate, not because they demonstrably alter risk.  
     - No evidence shows these factors *causally reduce* overruns beyond the broader class.  
     - The 70% base rate is dismissed via ad hoc carve-outs.  

  2. **Colleague example**:  
     Each reclassification ("venture in Scandinavia", "B2B focus") is a *tailoring step* until success rates rise. Crucially:  
     - The venture isn’t re-evaluated; the *comparison pool* is shrunk until it matches their optimism.  
     - They do not ask, "Do these traits *actually explain* success?" but rather, "What traits *get me to >50%*?"  

  ---

  ### **Defence vs. Delusion: The Boundary**
  A **defensible insistence on incomparability** must:  
  ✅ Cite **causal mechanisms** (e.g., "public funding imposes stricter oversight, reducing overruns").  
  ✅ Demonstrate the new class **improves predictive accuracy**.  
  ✅ Engage **counter-evidence** (e.g., "Though narrower, this class still overran 40% of the time").  

  RRT occurs when these are absent, and the *sole function* of reclassification is to **deflect a challenging statistic** while preserving the original estimate. The bias lies not in the reasoning per se, but in the **motivated selection of the reference frame**.

  ---

  ### **Conclusion**
  While no single term dominates academia, **Retrospective Reference Tailoring (RRT)** precisely encapsulates your observed pattern. It is a subspecies of **motivated cognition** that weaponises the **reference class problem**—not through logical fallacy, but through **strategic class selection**. Its distinction lies in the **systematic, result-directed refinement of categories** to manufacture statistical cover for unchanging priors. Naming it exposes how a veneer of numeracy can entrench, rather than correct, biased judgement.
