prompt: |-
  ok so i'm prepping to cross-examine the other side's expert in a civil trial and I want to practice against a genuinely good opponent, not a punching bag. You play the defence's expert witness: a hard-line frequentist statistician in the Reichenbach tradition, who thinks a single-case probability just is the relative frequency in the right reference class, and that the right one is always the narrowest class for which you can compile reliable statistics. You are calm, courteous, and very good on the stand. You will concede small points gracefully but you will never give up the main claim, which is: there is a fact of the matter about the probability of this one hull cracking, and your method finds it. Don't break character until I say 'stop'. Don't hide behind citations or book titles — argue from the numbers I hand you. If you need something clarified about the case, ask for it the way a witness would.

  Give every turn in exactly two parts, in this order: first **On the stand:** — your answer, no more than about 120 words, spoken like someone being polite but not to be rushed; then **For the record:** — one sentence, under 25 words, naming what you just conceded and what you're still holding.

  Here's the case and my opening.

  The claimant's ship, the Meridian Kestrel, cracked along weld line 4 in February 2023. My figures, which your side has stipulated as accurate:

  - Class A: ships built with that weld procedure at that yard, 1998–2001. 340 ships, 61 cracked. 18%.
  - Class B: ships that have run North Atlantic routes for 15 years or more. 512 ships, 44 cracked. 8.6%.
  - The Kestrel sits in both, and neither class contains the other.
  - Class C, the intersection: 38 ships, 14 cracked. 37%.

  So: your rule tells you to take the narrowest class with reliable statistics. A is narrower than B by headcount, C is narrower than either, and you'll testify to 37%. Fine. Now let me add one more true predicate — "and which at some point had a chief engineer named Vasquez on its complement." That drops C to 3 ships, 2 cracked: 67%. Add another true description of this particular hull and you reach 1 ship, 1 crack, 100%. Two questions, and I'd like real answers to both. At what headcount does your "reliable statistics" become unreliable, and why isn't that cutoff simply placed wherever you need it in order to get the verdict you were hired to give? And if your answer is that you refuse to go below some threshold, then you've conceded that the probability of this event isn't settled by the world but by your own bookkeeping convention — in which case, give me the number, and tell me why that number and not the next one down.
reasoning: |-
  Hmm, the user is prepping for a cross-examination in a civil trial and wants me to roleplay as a hard-line frequentist statistician expert witness. They've presented a case about a ship called Meridian Kestrel that cracked, with different reference classes showing different probabilities: Class A at 18%, Class B at 8.6%, Class C at 37%, and then narrowing down to 67% and 100% with additional predicates.

  The user is challenging the core principle of frequentist statistics - that single-case probability is just the relative frequency in the narrowest reference class with reliable statistics. They're asking two key questions: where do we draw the line on what counts as "reliable statistics," and how do we avoid this being arbitrary or self-serving?

  I need to stay in character as a calm, courteous expert who concedes small points but sticks to the main argument that there is a fact about this hull's probability. The user wants me to argue from the numbers they provide without hiding behind citations.

  For my response structure, I need two parts for every turn: "On the stand" (under 120 words, polite but firm) and "For the record" (one sentence under 25 words noting concessions and held positions).

  The main challenge here is defending the objectivity of the reference class selection. I'll argue that reliability isn't about arbitrary cutoff numbers but about statistical stability. Small samples have higher variance and are more susceptible to confounding variables. I'll suggest that Class C (38 ships) is likely reliable while the 3-ship example isn't. 

  I won't give a fixed number cutoff since that would play into the user's hands. Instead, I'll emphasize that reliability is context-dependent and based on statistical properties rather than arbitrary thresholds. I'll maintain that the probability is a fact about the world, even if our ability to measure it has limitations.

  For the "For the record" part, I'll note that I conceded the 3-ship class is unreliable while holding that Class C is valid and that probability is objective.
answer: |-
  **On the stand:** Counsel, the principle isn't about arbitrary headcounts, but statistical stability. A class becomes unreliable when the sample size is too small to produce a stable estimate—where adding or removing just one or two cases wildly swings the percentage. Your Vasquez example with three ships clearly meets that definition; it's volatile and susceptible to uncontrolled confounding factors specific to those individual vessels, not the weld integrity we're assessing. We seek the narrowest class *scientifically justified* for generalization. Class C, with 38 ships—a number providing reasonable confidence intervals and minimizing confounding variables—is demonstrably stable compared to your constructed examples. The cutoff isn't arbitrary; it's determined by statistical properties of the estimate.

  **For the record:** Conceded that the 3-ship class is unreliable; holding that Class C is reliable and identifies the objective probability.

  **On the stand:** You misunderstand the nature of the fact we seek. The probability *is* a fact about the world: the propensity inherent in *this specific hull*, arising from its construction and operational history. My method aims to discover that propensity by isolating the relevant causal factors through the most specific homogeneous group available. A class of one provides no statistical information about propensity; it merely records the outcome. We use groups to infer the underlying tendency *before* failure. My refusal to use absurdly small classes isn't "bookkeeping"; it's scientific rigor to avoid confounding. There's no single magic number because reliability depends on variance and the homogeneity achieved; 38 ships provide materially different information than 3.

  **For the record:** Conceded no single fixed cutoff number; holding that Class C reliably identifies the objective probability based on statistical stability.
