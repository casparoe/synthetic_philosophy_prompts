prompt: |-
  I co-teach a first-year course on noncooperative game theory, and my colleague's way of introducing iterated elimination of dominated strategies has started to worry me. He tells the students that the deletion procedure is natural selection in disguise: strategies are organisms, payoff is fitness, and a strictly dominated strategy is an organism that is outcompeted in every environment it could encounter, so it cannot persist. He then draws the methodological moral that the epistemic apparatus our textbook spends two chapters on — common knowledge of the payoff matrix, common knowledge of rationality, everyone reasoning about everyone's reasoning — is a luxury the argument can do without. On his telling, players need not be clever enough to run the deletion in their heads, because selection, whether biological or competitive-market selection of the kind that licenses treating firms as if they maximized without assuming anyone maximizes, will do the running for them. Iterated dominance therefore becomes the one part of the theory whose conclusions hold up when the players are not ideally rational, and he suggests to the students that this is why dominance arguments are safer than equilibrium arguments.

  He extends the analogy to the mixed-strategy case as well. A polymorphic population, in which a fraction of players uses each of several pure strategies, is the biological counterpart of a single player randomizing; so a pure strategy that is strictly dominated only by a lottery over other pure strategies is like an organism beaten not by any single rival species but by a diverse community occupying the same niche. He presents this as a virtue of the analogy: the mixed-strategy version of the procedure looks mysterious on epistemic grounds, since nobody deliberates in lotteries, but perfectly natural on evolutionary ones.

  I would like to know whether to object, and on what grounds. Please audit the analogy.

  Specifically:

  1. Lay out the correspondence explicitly — a table is fine — pairing each element of the biological or market picture with its alleged counterpart in the deletion procedure: organism, fitness, environment, generation, extinction, polymorphism, and the temporal counterpart, if any, of one round of deletion.

  2. Separate the disanalogies that actually threaten his conclusion from the ones that are merely loose phrasing. At a minimum, address: (a) the fact that selection acts on realized payoffs against the mix actually present in the population, not against every possible profile of the others' strategies, and what that does to the claim that the dynamic counterpart of deletion is strict dominance rather than something closer to failing to be a best response to the current state; (b) the gap between one individual randomizing and a population being polymorphic, and whether that gap matters precisely in the mixed-strategy-dominance case he leans on; (c) whether the analogy can be stretched from strict to weak dominance, given that deletion of weakly dominated strategies is order-dependent and can destroy equilibria that the strict version leaves intact; and (d) whether a long-run persistence claim can license any conclusion at all about a one-shot game being solved.

  3. Say what the analogy quietly imports: for instance, that fitness is fixed independently of a strategy's own frequency, that extinction is irreversible with no mutation or re-entry, that the selective environment can be identified with a single round of reasoning, that the procedure's order-independence has an analogue in the dynamics.

  4. To keep this concrete, construct a small two-player normal-form game in which some pure strategy is strictly dominated only by a mixed strategy, and then walk the same case through both the deletion argument and the evolutionary story, marking exactly where the two accounts agree and where they come apart.

  5. Give me a verdict on his conclusion. Is iterated dominance really the epistemically safe part of the theory, and can a dynamic process substitute for common knowledge of rationality? If only part of what he says survives, identify the part, and say what the honest substitute would be — including whether some other analogy, dynamic or not, would serve a first-year class better than this one.

  Argue from the concepts themselves; I am not looking for references or a reading list, just the analysis.
reasoning: |-
  Hmm, the user is a game theory professor concerned about a colleague's teaching approach. The colleague uses a biological analogy for iterated elimination of dominated strategies, claiming it makes the epistemic assumptions unnecessary. The user wants a critical audit of this analogy.

  The key claims to evaluate are: (1) That evolutionary dynamics can substitute for common knowledge of rationality in justifying iterated dominance (2) That this makes dominance arguments "safer" than equilibrium concepts (3) That the analogy works especially well for mixed-strategy dominance.

  The analogy maps game elements to biological concepts: strategies become organisms, payoffs become fitness, strategy profiles become environments, and deletion rounds become generations. But this mapping has problems.

  First, biological selection acts against actual current opponents, not all possible opponents. Evolution only eliminates strategies that perform poorly against the current population mix, not those that would fail against other hypothetical strategies. This means evolution corresponds to "not best response to current state" rather than true dominance. True dominance requires considering all possible opponent plays, which evolution doesn't do.

  Second, polymorphism isn't equivalent to individual randomization. In games, a player randomizes to make opponents indifferent, while in evolution, polymorphism emerges from differential growth rates. The equilibrium conditions differ - evolution reaches Nash equilibria only under specific dynamics like replicator dynamics, not correlated equilibria which randomization can achieve.

  Third, weak dominance fails completely in the analogy. Deleting weakly dominated strategies is order-dependent and can eliminate reasonable equilibria, but evolution has no such sensitivity. Evolution might preserve weakly dominated strategies if they're neutral against current populations.

  Fourth, the analogy smuggles in problematic assumptions: fixed payoffs (no frequency dependence), no mutation (extinction is permanent), and discrete generations matching deletion steps. Real evolution is messier.

  For a concrete example, consider a 2x2 game where strategy A is dominated only by a 50-50 mix of B and C. The deletion argument removes A immediately. But in evolution: if the population starts with all A, it persists since no better strategy exists to invade; if it starts mixed, A might decline slowly or persist at low frequency depending on initial conditions. The outcomes differ.

  The colleague is partly right but overreaches. Iterated strict dominance is indeed more robust than Nash equilibrium because it relies only on mutual knowledge of rationality (not common knowledge), and some evolutionary processes can approximate it under ideal conditions. But it's not assumption-free. The honest substitute would be: "Iterated strict dominance requires players to recognize dominated strategies and expect others to do the same, but not infinite recursion. Some evolutionary models can produce similar outcomes through selection, but only with strong assumptions about mutation rates and time scales."

  For teaching first-years, I'd suggest a simpler justification: "Dominated strategies are bad choices regardless of what others do, so we eliminate them first. Repeat until no more can be eliminated." This avoids both biological overreach and epistemic overcomplication.
answer: |-
  ### Audit of the Evolutionary Analogy for Iterated Elimination of Dominated Strategies

  #### 1. Explicit Correspondence Table
  | **Biological/Market Concept** | **Alleged Game-Theoretic Counterpart** | **Purpose in Analogy** |
  |-------------------------------|----------------------------------------|------------------------|
  | Organism                      | Pure strategy                          | Unit subject to selection |
  | Fitness                       | Payoff (utility/profit)                | Measure of "success" |
  | Environment                   | Profile of opponents' strategies       | Context determining fitness/payoff |
  | Generation                    | One round of deletion                  | Discrete step in the process |
  | Extinction                    | Elimination of a strategy              | Removal from consideration |
  | Polymorphism                  | Mixed strategy (randomization)         | Interpretation of probabilistic play |
  | Niche competition             | Strict dominance by a mixed strategy   | Justification for mixed-strategy dominance |
  | Selective pressure            | Rationality/competitive pressure       | Mechanism driving elimination |

  #### 2. Critical Disanalogies Threatening the Conclusion
  **(a) Selection Acts on Realized Payoffs, Not All Possible Profiles**  
  - **Problem:** Evolution eliminates strategies based on performance against the *current population mix*, not against *every possible opponent strategy*. A strategy may survive if it performs well against the current mix, even if strictly dominated globally.  
  - **Threat to Conclusion:** The dynamic process corresponds to "elimination of strategies that are not best responses to the current state" (a la evolutionary dynamics or learning), **not** strict dominance. Dominance requires robustness against *all* opponent strategies, which evolution cannot guarantee.  
  - **Example:** A strategy weakly beaten by the current mix but dominant against an absent strategy survives evolutionarily but is eliminated under iterated dominance.

  **(b) Polymorphism vs. Individual Randomization**  
  - **Problem:** A polymorphic population (many individuals playing different pure strategies) is not equivalent to a single player randomizing. In games, a mixed strategy is a conscious choice (or evolutionary stable state) to *induce indifference* in opponents. Polymorphism arises from differential growth, not intentional diversification.  
  - **Gap in Mixed-Strategy Case:** When a pure strategy is dominated only by a mixed strategy, evolution *can* eliminate it via polymorphism (if the dominating mix invades), but this requires:  
    - The right mix to arise (e.g., through mutation).  
    - The mix to be evolutionarily stable.  
    Deletion assumes the mix is *available* instantly; evolution needs time and luck.  
  - **Why It Matters:** The analogy conflates *population-level statistics* (polymorphism) with *individual agency* (randomization), masking the coordination problem in games.

  **(c) Weak Dominance Fails Completely**  
  - **Problem:** Weakly dominated strategies may survive evolutionarily if they are neutral against the current population (e.g., same payoff as others). Deletion is order-dependent and can delete rationalizable strategies, but evolution has no such sensitivity.  
  - **Threat:** The analogy implies all dominance is "natural," but weak dominance lacks dynamic justification. For example, evolution might preserve a weakly dominated strategy if it coexists neutrally, while deletion might eliminate it and alter equilibria.  
  - **Conclusion Undermined:** Iterated weak dominance is *not* safer epistemically—it requires stronger assumptions. Evolution cannot rescue it.

  **(d) Long-Run Persistence vs. One-Shot Games**  
  - **Problem:** Evolution justifies long-run outcomes (e.g., ESS), but iterated dominance is a one-shot solution concept. Persistence claims require infinite time, no mutation, and fixed environments. In one-shot games, players lack generational learning.  
  - **Threat:** The analogy cannot license conclusions about one-shot play without smuggling in unrealistic assumptions (e.g., "selection has already occurred").  
  - **Key Gap:** Evolution assumes repeated competition; iterated dominance assumes synchronic reasoning.

  #### 3. Hidden Assumptions in the Analogy
  The analogy quietly imports:  
  - **Fixed Fitness:** Payoffs are frequency-independent (no payoff externalities).  
  - **Irreversible Extinction:** No mutation, migration, or re-entry of strategies.  
  - **Discrete Generations = Deletion Rounds:** Assumes selection operates in synchronized steps matching deletion order.  
  - **Order Independence:** Implies dynamics are path-independent, though real evolution depends on initial conditions.  
  - **Global Knowledge:** "Environment" implies players know the full strategy space, but evolution only reacts to local interactions.

  #### 4. Concrete Game Example: "Dominated by Mix" Game
  **Game Matrix (Player 1 Rows, Player 2 Columns):**  
  ```
         L     R  
     A  3,3   0,0  
     B  0,0   3,3  
     C  1,1   1,1  
  ```
  - **Strict Dominance:**  
    - **Step 1:** For Player 1, pure strategy C is strictly dominated *only* by a 50-50 mix of A and B (expected payoff 1.5 > 1 against any Player 2 choice). Delete C.  
    - **Step 2:** Reduced game has (A,B) vs. (L,R). No further dominance.  
    - **Conclusion:** (A,L) and (B,R) survive as rationalizable profiles.  

  - **Evolutionary Story:**  
    - **Setup:** Population of Player 1s (strategies A, B, C) and Player 2s (L, R). Fitness = average payoff against current opponent mix.  
    - **Scenario 1 (Initial mix: C-dominated):**  
      - If Player 2 plays 50-50 L/R, C gets 1, A gets 1.5, B gets 1.5 → C declines.  
      - **Agreement:** C eliminated, as in deletion.  
    - **Scenario 2 (Initial mix: C-neutral):**  
      - If Player 2 always plays L, A gets 3, B gets 0, C gets 1 → A grows, C survives (since 1 > 0).  
      - **Disagreement:** C persists evolutionarily but is deleted.  
    - **Scenario 3 (Polymorphism needed):**  
      - To eliminate C, A and B must *both* be present. If mutation is rare, C may persist until A/B invade.  
      - **Disagreement:** Evolution is path-dependent; deletion is instantaneous.  

  **Where Accounts Agree/Disagree:**  
  - **Agree:** If initial conditions align (C faces mixed opponents), both eliminate C.  
  - **Disagree:** Evolution may spare C if opponents don’t play "testing" profiles (e.g., always L). Deletion assumes all profiles are considered; evolution only sees realized play.  

  #### 5. Verdict on the Conclusion
  **Partially Correct, But Overstated:**  
  - **What Survives:**  
    - Iterated *strict* dominance is epistemically safer than Nash equilibrium. It requires only **mutual knowledge of rationality and payoffs** (not common knowledge), and some evolutionary processes (e.g., replicator dynamics with mutation) can converge to its outcome under ideal conditions (fixed environment, infinite time).  
    - The analogy *is* pedagogically useful for mixed-strategy dominance, as polymorphism illustrates why mixed strategies "exist."  
  - **What Fails:**  
    - **Not Assumption-Free:** Evolution requires its own strong assumptions (no frequency dependence, no mutations, infinite time). It cannot replace epistemic conditions—it just shifts them to biological ones.  
    - **No Epistemic Substitute:** Deletion still requires players to recognize dominated strategies and expect others to do so (mutual knowledge). Evolution doesn’t eliminate this; it externalizes it.  
    - **Weak Dominance & One-Shot Games:** The analogy collapses here. Weak dominance is not evolutionarily robust, and one-shot games lack generational dynamics.  
    - **Safety Claim Exaggerated:** Dominance arguments are "safer" than equilibrium *only* because they require less reasoning, not because they avoid rationality. Evolution doesn’t change this.  

  **Honest Substitute for Teaching:**  
  - **For First-Years:** Ditch the full analogy. Use:  
    > *"A strictly dominated strategy is always a bad idea—no matter what others do. So rational players won’t use it. Once we remove it, others might become dominated, and we repeat. This doesn’t need infinite smarts, just that players spot bad choices and expect others to do the same. Evolution can sometimes mimic this, but only if strategies ‘die’ when they lose."*  
  - **Better Analogy:** **Market Entry.** Firms (strategies) enter a market; unprofitable ones (dominated strategies) exit. Competitors react to the thinner market. This mirrors deletion’s stepwise logic without biological baggage.  
  - **Core Justification:** Iterated strict dominance stands on **cautious rationality**: players avoid strictly inferior options and prune the game iteratively. No evolution needed.  

  **Final Judgment:**  
  Your colleague’s analogy is a vivid but leaky vessel. It holds water for strict dominance in large populations with mixing, but cracks under weak dominance, one-shot games, and epistemic scrutiny. Iterated strict dominance *is* the epistemically lightest tool, but it still requires mutual knowledge of rationality—evolution just provides a dynamic parallel, not a foundation.
