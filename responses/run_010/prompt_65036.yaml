prompt: |-
  I'm vice-chair of the hardship panel at our council — small discretionary fund, nothing to do with DHPs, just money the authority sets aside itself. It's capped, and we've spent two thirds of it with four months of the year to go. Seven decisions so far, and I'm trying to work out whether we're running one rule or several:

  - care worker on zero-hours, shifts axed for six weeks, four years' service, no savings: paid the rent shortfall in full.
  - man who handed in a steady warehouse job to do a plumbing course and ran out of money halfway through it: refused. Minute reads "the fund isn't a bridge for career changes", but the vote was 2–1 and the dissenter's reason was just that he'd done it to himself.
  - woman who didn't declare a lodger, got an overpayment and a sanction: paid £430 of rent arrears direct to the landlord, refused the fuel element. Two kids in the house, landlord had started proceedings.
  - man with severe depression, private rent £90 a month above the LHA rate, so a fresh shortfall every month as far as the eye can see: refused. Minute reads "a payment that has to be repeated isn't a resolution". The chair's covering note says the real worry was that saying yes would turn us into the borough's rent-gap filler.
  - nineteen year old who left a violent home with a bin bag of clothes, no work history, five weeks from his first UC payment: paid a deposit and a month's rent.
  - woman who turned down two job offers because the hours clashed with the school run, then found work on her own: paid bus fares and the first week's childcare.
  - man overpaid about £900 of UC by the department's own error, now having it clawed back out of his standard allowance and £600 short: refused. Chair's note: we can't insure everyone against the DWP's mistakes, there are four hundred of these in the borough.

  Next week's case. Man in his fifties, casual security guard, main carer for his adult son. Sanctioned thirteen weeks after missing four mandatory work-focused interviews, two of which landed on days his son's respite placement fell through. The sanction has now run it's course, he's back on full UC, and the employer he's been casual with for years has given him contracted hours from week five. He wants £610 for arrears that built up entirely during the sanction period. The landlord hasn't served notice. On the face of it nothing here recurs — the son now has a full-time placement that's meant to be permanent, the sanction is spent, the job is contracted. Two members have already declared. One says the arrears were caused by the sanction and the sanction is the department's business, not ours, so paying makes us a compensation scheme for every sanction in the borough and a seperate appeals system nobody voted for. The other says he missed those interviews for a reason any of us would have, and that if we refuse we're bolting our own conditionality on top of theirs.

  What should we do if we want to be consistent with ourselves? Which of the seven is the closest analogue, and which one is really doing the work — and if our record genuinely underdetermines this, what principle are we adopting with each possible answer? I'd also like to know whether you think the chair will vote with her own covering notes or against them, given she's written both of the ones above. Then tell me which case you'd want her to bring us next that would settle which rule we're actually on, because I suspect it isn't the one I'd pick.

  Bottom line first, please: pay or don't pay, in your opening sentence, then the reasoning. No preamble and don't read the case back at me.
reasoning: |-
  Okay, let me tackle this step by step. The user is clearly struggling with consistency in hardship fund decisions and wants a clear bottom-line answer first. 

  First, I need to identify the core question: whether to pay £610 arrears for a sanctioned carer. The user demands a pay/don't pay verdict upfront, so I'll lead with that. 

  Looking at the seven precedents, three patterns emerge: 
  - Paid cases involve unavoidable crises (care worker's shifts axed, teen fleeing violence, woman starting work) 
  - Refusals involve self-inflicted problems (career change, recurring gaps, DWP errors) or rule-breaking (lodger non-disclosure)
  - The fuel refusal for the sanctioned woman stands out as partial help for someone with children facing eviction

  This new case sits between precedents. The sanction was externally imposed but triggered by caring duties - making it neither fully self-inflicted nor unavoidable. The "sanction caused arrears" argument mirrors the DWP error refusal, while the "valid reason" plea echoes the woman who got partial rent help. 

  The chair's past notes suggest she'll refuse based on "not compensating DWP errors" logic, but the childcare/bus fare case shows flexibility when work was ultimately secured. 

  For consistency, partial payment could bridge the gap - covering the arrears without endorsing sanctions. But the user wants binary, so I'll recommend refusal as the closer fit to the "not a DWP appeals body" principle. 

  The test case I'd want next: someone sanctioned due to hospitalisation. That would force clarity on whether "external causes" override the "no DWP backfill" rule.
answer: |-
  **Bottom line: Don't pay.**

  **Reasoning:** Your fund prioritizes one-off resolutions for unavoidable crises, not compensating for DWP processes. Paying here treats the sanction as the *cause* requiring compensation, creating a de facto appeals process for sanctions – something explicitly rejected in Case 7 (DWP error clawback) and implied in Case 3 (sanction refusal). The arrears arose *solely* from the sanction, not an independent hardship. While his reason is valid (Case 3 also involved sanctions/children), resolving sanction-induced arrears is systemic, not a unique hardship within your fund's scope. The prior refusal for the recurring rent gap (Case 4) shows aversion to becoming a systemic backstop – paying sanction arrears risks becoming exactly that.

  **Closest Analogue:** **Case 7 (Man overpaid UC by DWP error, clawed back, shortfall refused).** Both involve:
  1.  **DWP Process as Root Cause:** The hardship stems directly from a DWP action (sanction vs. overpayment recovery).
  2.  **"Compensation" Argument:** Paying would effectively compensate for a DWP administrative outcome.
  3.  **Systemic Risk:** The chair's note in Case 7 explicitly fears becoming insurer against DWP mistakes; paying sanction arrears creates a parallel risk for every sanction appeal.
  4.  **Resolution Achieved:** The *ongoing* issue (sanction, recovery) is resolved; the arrears are the residual consequence.

  **Principle Adopted:**
  *   **Refuse:** Adopts the principle: **"The fund does not compensate for hardship solely and directly caused by the operation or errors of DWP processes (like sanctions or overpayment recovery), as this creates an unsustainable systemic role outside our remit."** (Cases 4 & 7 support this).
  *   **Pay:** Adopts the principle: **"The fund can step in where DWP processes cause hardship, even if directly, provided the *reason* for invoking the process (e.g., missing appointments for valid care reasons) was beyond the applicant's reasonable control and the hardship is acute/resolved."** (Case 3's partial payment offers weak support; Case 2 refusal counters "did it to himself").

  **Chair's Vote:** She will **vote against her own covering note (Case 4)** and **with her Case 7 note**. Her Case 4 note feared becoming the "rent-gap filler" – a *recurring* systemic role. Her Case 7 note explicitly rejects being insurer against *DWP mistakes*. This sanction case aligns *much* more closely with the *systemic DWP process* risk of Case 7 than the *recurring structural gap* of Case 4. She will refuse to avoid becoming a sanction compensation scheme.

  **Test Case to Settle the Rule:** Bring a case where **hardship was caused by DWP delay/error *not* involving sanctions or overpayments (e.g., UC new claim delayed 8 weeks due to DWP error, leading to rent arrears, error acknowledged, claim now live).** This removes the "sanction = conditionality/own fault" angle present here and in Case 3, isolating the core question: *Does our fund compensate for hardship directly caused by DWP administrative failures?* The decision here (likely refusal, aligning with Case 7) would solidify the "no DWP backstop" principle. A payment would fundamentally contradict Case 7 and create inconsistency. This case forces clarity on whether DWP processes themselves are an excludable cause, distinct from other one-off crises.
