  ### Seminar Exercise Case: Office Supply Hoarding

  **Scenario:**  
  In a shared office building, the company provides complimentary high-quality pens at a central supply station for all employees to use as needed. The pens are restocked every Monday morning. On Tuesday afternoon, Morgan notices that the pen supply is nearly full and unlikely to be exhausted before the next restock. To avoid ever buying pens personally, Morgan takes 20 pens (enough for a year) to stock their home office, leaving fewer for others. Morgan adopts this maxim: "Whenever I see a shared resource underutilized, I will take a large surplus for my exclusive long-term use without replacing it, to enjoy it without personal cost."

  ---

  ### Analysis

  **Maxim Statement (at test-required generality):**  
  "Whenever I perceive a shared resource as underutilized, I will take a large surplus for my exclusive long-term use without replacing it, to secure personal benefit without cost."

  **Universalized World Description:**  
  In this world, everyone acts on the maxim: whenever any person perceives a shared resource (e.g., office pens, communal tools, public benches) as underutilized, they take a large surplus for exclusive long-term personal use without replacement. Shared resources are instantly depleted upon replenishment (e.g., pens vanish Monday morning), as everyone races to hoard them. Resources become perpetually unavailable for shared use, though individual acts of taking remain physically possible when supplies are briefly present. The original purpose—securing personal benefit without cost—is universally pursued but structurally defeated.

  **Verdicts and Reasoning:**  

  1. **Strict Logical Reading (Passes):**  
     - **Verdict:** No contradiction in conception; maxim is permissible.  
     - **Reasoning:** The universalized world is logically coherent. It is consistent to describe a world where everyone hoards without replacing—no inherent contradiction in the concepts of "taking," "shared resource," or "underutilized." Morgan's act remains possible (e.g., grabbing pens post-replenishment). No conceptual impossibility arises.  

  2. **Practical-Contradiction Reading (Korsgaard; Fails):**  
     - **Verdict:** Contradiction in conception; maxim generates a perfect duty against the act.  
     - **Reasoning:** Universalization defeats Morgan’s purpose. Morgan aims to enjoy pens without cost by exploiting underutilization. In the universalized world, resources are immediately hoarded by all, leaving nothing "underutilized" to exploit. Thus, Morgan cannot achieve their purpose—hoarding becomes impossible *for the reason Morgan intends*. The maxim undermines its own conditional ground (available surplus), creating a practical contradiction in the will.

  **Identifiable Feature Causing Divergence:**  
  The **long-term exclusivity** of use (taking a surplus for *exclusive, enduring* personal use). This transforms a locally harmless act into a systemically destructive one when universalized.

  **Effect of Removing the Feature:**  
  - **Revised Maxim (without exclusivity):** "Whenever I see a shared resource underutilized, I will take a *small* amount for *immediate* use without replacing it."  
  - **Logical Reading (Still Passes):** Universalization remains coherent; people take modest amounts when resources appear underused. No inconsistency.  
  - **Practical Reading (Now Passes):** No purpose defeat. Morgan’s goal (using a resource without cost) survives universalization, as small, immediate takings don’t deplete resources systemically. Underutilization persists as a condition to exploit.  

  **Defense from Logical Reading and Success Assessment:**  
  - **Attack Strategy:** Redescribe the maxim to isolate the act from its purpose.  
    - **Defense Argument:** The logical reading re-describes the maxim as: "Taking resources when underutilized." This ignores the purpose clause ("to secure personal benefit without cost") and the *long-term exclusivity*, reducing it to a generic taking. Since generic taking is universalizable without contradiction, the maxim passes.  
  - **Success of Defense:** Fails. Purpose and context are integral to Kant’s test—maxims cannot be stripped of their intentionality (as argued in *Groundwork* 4:424). The logical reading’s re-description artificially severs the act from Morgan’s reason (enduring cost-free access), violating Kant’s insistence on evaluating "the maxim as you hold it." Universalizing the full maxim *does* defeat Morgan’s purpose, exposing a contradiction in rational willing.  

  ---

  ### Commitment: Vindicating the Practical-Contradiction Reading

  **Position:** This exercise vindicates Korsgaard’s practical-contradiction reading. The case demonstrates that the logical reading is descriptively inadequate—it permits maxims that universalization reveals as self-defeating for rational agents. Morgan’s hoarding is morally impermissible because its universalization destroys the very condition (available surplus) that makes the act purposive. Kant’s test must screen for *practical rationality*, not just logical coherence, to uphold the categorical imperative as a guide for human agency.

  **What the Practical Reading Must Surrender Elsewhere:**  
  To survive this case, the practical reading must surrender **universalizability as a purely formal/logical test**. It concedes that the contradiction arises from *empirical* consequences (e.g., resource depletion) and agent-relative purposes, not conceptual incoherence alone. This forces the reading to:  
  1. **Accept teleological elements:** Ground the test in agents' purposes (e.g., "without cost"), risking accusations of consequentialism.  
  2. **Qualify "possibility":** Allow that an act can be "impossible" for practical reasons (purpose defeat) even if logically conceivable.  
  3. **Cede parsimony:** Embrace contextual complexity (e.g., resource scarcity dynamics) over binary logical analysis.  

  **Reason for Commitment:**  
  Kant’s imperative governs *rational wills*, not abstract propositions. The logical reading reduces the test to a game of consistency-checking, permitting maxims like Morgan’s that universalization exposes as self-frustrating. This betrays Kant’s aim: ensuring agents’ maxims can function as universal laws *without undermining their own rationality*. The practical reading, despite its empirical concessions, better captures Kant’s core insight—immorality as a contradiction in the will of a rational being.
