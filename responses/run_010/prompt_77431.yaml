  **Step 6: Direct answer**

  Is "right but early" a genuine epistemic category?

  Yes, with the following conditions:

  - The core mechanism must have been verified in a controlled or favorable context.
  - The deferring factor must be exhaustible and identified non-ad hoc.
  - If the harm was averted by the forecast, it confirms the theory (but this is separate from being "right but early", which typically implies the event is still expected).

