  Okay, the user is running an undergrad reading group on decision theory and needs help drafting the first handout. They want a list of desiderata for any adequate decision theory, focusing on what it must deliver, which cases it must get right, and which structural principles it must obey. They also have a specific variant case involving uncertainty about counterfactual structure and want to know how a decision theory should handle it, especially regarding potential conflicts with dynamic consistency.

  First, I need to recall the core requirements for decision theories. The user mentioned avoiding collapses between causation and evidence, and between current actions vs. precommitments. Key principles include dominance, dynamic consistency, and not paying to avoid good news. I should list each requirement with a motivating case. 

  For example, separating causation from evidence is crucial in Newcomb's problem. The smoking lesion case highlights the distinction between what causes a state and what's evidence for it. Then there's diachronic consistency, motivated by cases like Toxin Puzzle, where intending to drink toxin but not following through shows the gap between commitment and action.

  The user's variant case involves the merchant uncertain whether Death's book is fixed or responsive. Here, the decision theory must represent higher-order uncertainty without forcing a definite recommendation. The merchant might prefer to know which book he's facing. This ties into dynamic consistency. If he pays to learn the book type now, but later faces the same uncertainty, there's a conflict. Paying makes sense only if the information affects the decision, but in this setup, learning doesn't change the available actions, so paying might be irrational. However, if the information allows adjusting the strategy, paying could be worthwhile. The key is that a good decision theory should allow the agent's uncertainty to be reflected in the decision, perhaps through randomized strategies or multiple permissible actions.

  I should check conflicts between desiderata. For instance, dominance and evidential reasoning clash in Newcomb's problem. Also, dynamic consistency might conflict with avoiding paying for information in the variant case if the theory forces a definite choice. But if the theory permits indecision or mixed strategies, it can satisfy both. The user's worry about collision between demanding a definite recommendation and dynamic consistency is valid. If the theory requires a single action, the merchant might pay for information, but that could lead to inconsistency. Allowing indecision resolves this.

  Other potential conflicts: Causal theories might violate no paying for good news in Parfit's hitchhiker, while evidential ones struggle with dominance in Newcomb. The handout needs to note these tensions without resolving them, as that's for later weeks. Ensure the response stays under 700 words, uses the specified format, and avoids comparing theories. The end section on conflicts should highlight where trade-offs arise, using the variant case as an example.
answer: |-
  ### Desiderata for Decision Theories: What Must Any Account Deliver?

  1.  **Distinguish causation from correlation:** The theory must not equate an act's causal influence on states with merely providing evidence about states. *Motivation:* Smoking Lesion problem (smoking correlates with lesion but doesn't cause cancer; evidential reasoning wrongly advises against smoking, causal reasoning correctly advises for it if pleasurable).
  2.  **Respect dominance where applicable:** If one act yields a better outcome than another *in every possible state*, the theory must prefer it. *Motivation:* Plain Dominance (Act A gives \$10 if Heads, \$20 if Tails; Act B gives \$9 if Heads, \$9 if Tails; A dominates B).
  3.  **Maintain diachronic consistency:** The theory's recommended course of action for a sequence of choices must align with its recommendations at each choice point, barring new information. *Motivation:* Toxin Puzzle (Intending to drink toxin gets \$1M, but actually drinking it makes you sick; a theory should explain why forming the intention doesn't compel drinking it later).
  4.  **Avoid paying to avoid free information:** The theory should never recommend paying a cost *solely* to prevent oneself from learning relevant, costless-to-receive information. *Motivation:* Medical Newcomb (Facing a test predicting cancer: refusing the free test and then acting as if you have cancer is irrational; you should take the test or act on prior odds).
  5.  **Handle state-dependent utilities correctly:** The theory must allow an agent's valuation of outcomes to depend rationally on the state of the world. *Motivation:* State-Dependent Bet (Betting on your own survival: valuing the money only if you live makes refusing large, favorable bets rational if survival is unlikely).
  6.  **Acknowledge the value of precommitment:** The theory must explain why it can be rational to bind one's future choices when advantageous. *Motivation:* Ulysses and the Sirens (Precommitting to resist temptation is rational; a theory shouldn't demand revisiting the choice without bindings).
  7.  **Represent higher-order uncertainty:** The theory must explicitly model and allow decisions to depend on the agent's uncertainty about the *causal structure* or *counterfactual dependencies* governing the problem. *Motivation:* Your Death's Book Uncertainty variant (Merchant unsure if fleeing *causes* Death in Aleppo or only *reveals* a fixed appointment; the theory must incorporate this meta-uncertainty without presupposing one structure).

  ---

  ### Conflicts

  *   **Dominance vs. Evidential Reasoning:** Dominance (2) demands taking both boxes in Newcomb's Problem if the Predictor is infallible. Evidential reasoning, driven by distinguishing causation/correlation (1), often recommends one-boxing. A theory satisfying both is challenging. (Load-bearing: Dominance is often core for causalists, while evidentialists prioritize 1).
  *   **Definite Recommendation vs. Higher-Order Uncertainty (Your Variant):** Demanding a *single* rational act (often assumed) conflicts with faithfully representing profound structural uncertainty (7). Requiring a definite recommendation *here* risks obscuring the core dilemma. The theory should license indecision or represent the choice as genuinely dependent on the unresolved meta-uncertainty (e.g., via randomized strategies or permissible sets of acts weighted by credence over structures).
  *   **Dynamic Consistency vs. Paying for Info (Your Variant & Collision):** Your intuition about a collision with dynamic consistency (3) is insightful. *Should he pay to learn the book type?* If the merchant *truly* has no better action available *after* learning (e.g., he still only chooses Damascus/Aleppo), paying seems irrational – it violates (4). However, if learning allows him a *different* strategy (e.g., precommit based on the book type), paying could be rational under (6). The conflict arises if the theory forces a definite *single-stage* recommendation while also demanding dynamic consistency. A theory satisfying (3), (4), (6), and (7) must handle the *sequence* coherently: paying is only rational if the information enables a valuable change in strategy later, not if it merely resolves uncertainty without changing the action set. Your variant highlights that a good theory must integrate decisions about information gathering with decisions about actions under uncertainty about the causal fabric itself.
