prompt: |-
  My partner and I are expecting our first child in the spring, and we have spent the last several weeks trying to work out how to divide the parental leave that our national scheme provides. The rules are as follows. There are twelve months of paid leave per child, paid at eighty percent of the taking parent's own prior earnings, subject to a ceiling. Four of those months are reserved for each parent individually and are non-transferable in both directions: if the parent to whom they are attached does not take them, they lapse, and the family receives no cash equivalent in their place. The remaining four months may be divided between us however we choose. Subsidized childcare is available only from the child's first birthday, and nothing at all is payable for care supplied by a grandparent, by a parent who stays home beyond the leave period, or by a household that simply manages without.

  The scheme presents itself as a benefit, but a number of its features seem to me to be doing considerably more work than a benefit should. First, the reserved months attach to persons rather than to households: the state declines to treat my partner and me as a single unit competent to allocate our own time, and would rather see four months of paid care destroyed than permit us to move them, even though a household that lets them expire is plainly worse off in both income and care. Second, the entitlement is priced by the market wage it displaces, so my partner, who earns substantially more than I do, would draw a larger weekly sum for performing exactly the same domestic labor — a scheme apparently aimed at loosening the grip of the labor market on care nonetheless measures care by the earnings it forgoes. Third, the reserved months are formally gender-neutral and are nevertheless described, in nearly every public discussion of them I have read, as though their target were fathers in particular. I should add that I find the scheme attractive in its effects and irritating in its logic, so what I want is an account of what it assumes, not a defense of it.

  Could you reconstruct the theory of the family — and, behind that, the theory of distributive justice — that this design presupposes? I would like to know which of the following it strictly requires, and which it merely fits comfortably with: that the household is not the appropriate unit of justice and that intra-household bargaining systematically disadvantages one party; that competence at caring is built by doing and cannot be supplied by someone else's doing on one's behalf; that a child has a claim on a relationship with each parent severally, independent of what either parent prefers; or the narrower instrumental claim that without a lock of some kind the higher earner will always be pushed back to work and labor-market equality will never arrive. Please also say which rival views the design forecloses — a household-unit conception of benefits, a conception on which the state must remain neutral about the division of care, a conception on which what matters is the total quantity and quality of care a child receives but not its source — and where the practice is underdetermined, so that several incompatible theories would license it equally well. Then assess whether the design is internally coherent: can earnings-proportional payment and individual non-transferability rest on a single theory of entitlement, or does the scheme slide between treating leave as deferred wages and treating it as a non-negotiable duty of care? Finally, a colleague of mine proposed a variant in which the reserved months stay attached to individuals but become marketable, so that a parent unwilling to take them may sell them to the other parent for a state-fixed sum. Tell me whether that variant preserves the presuppositions you identify or quietly substitutes a different theory in their place, and tell me what would have to change in each of the three features I listed if the scheme were built explicitly on the child's interests rather than on the parents' equality.
reasoning: |-
  Okay, the user is expecting their first child and is grappling with their country's parental leave scheme. They've laid out the rules clearly: 12 months total paid at 80% of prior earnings, with 4 months reserved exclusively for each parent and 4 flexible months. They're frustrated by what they see as contradictions in the design - particularly how benefits attach to individuals rather than households, how payments scale with earnings, and how gender-neutral rules get discussed in gendered terms.

  The user isn't looking for policy advice but wants a philosophical dissection. They're clearly intellectually sophisticated - notice how they articulate three precise contradictions and ask for reconstruction of underlying theories. This isn't just practical confusion; it's someone wrestling with political philosophy made concrete in bureaucracy. Their mention of finding the scheme "attractive in effects but irritating in logic" suggests they might be progressive-leaning but distrustful of paternalism.

  Breaking this down systematically:
  First, the reserved months' non-transferability implies the state sees households as potentially exploitative units. The design assumes parents can't be trusted to bargain fairly - likely informed by feminist economics showing how specialization leads to dependency. The earnings-proportional payment is weirder - it preserves labor market inequalities within what's framed as a care benefit. That tension between compensating lost wages versus valuing care equally is fundamental.

  On their specific questions:
  The design strictly requires rejecting households as justice units and assumes bargaining disadvantages the lower earner (usually mothers). The "learning by doing" aspect is strongly implied but not strictly necessary - you could theoretically value care skills without forcing participation. The child's separate claim theory is plausible but secondary to the gender equality aim.

  The marketable leave variant would destroy the whole premise - if you can sell your months, it becomes purely financial compensation rather than care participation. Interesting how that small change flips the underlying theory from egalitarian to neoliberal.

  When assessing coherence... yeah, the earnings-proportional and non-transferable features really do clash. One says "this is your wage replacement" while the other says "this is your civic duty." No wonder the user feels cognitive dissonance.

  The childcare gap after 12 months is another layer - it pressures parents (again, disproportionately mothers) to exit workforce entirely. The whole system seems to want gender equality but can't escape market logic. Very smart observation about how pricing care by forgone earnings contradicts the goal of elevating care's intrinsic value.

  This user would appreciate Rawls vs Okin references - they're precisely at that intersection of distributive justice and family structure. Might send them some Nancy Fraser readings if they follow up.
answer: |-
  Based on your detailed analysis, here's a reconstruction of the underlying theories and an assessment of coherence:

  **Reconstructed Theories:**
  1.  **Household as Non-Unitary Agent:** The scheme strictly assumes **intra-household bargaining systematically disadvantages one party** (typically the lower earner/caregiver). It rejects the household as the unit of justice for leave allocation, fearing coercion or unequal power dynamics would push the primary caregiver (often the lower earner) into forfeiting paid leave to maximize household income.
  2.  **Care Competence via Practice:** It strongly implies that **competence at caring is built by doing and cannot be fully outsourced**. The reserved months aim to force *both* parents into sustained, primary caregiving roles, fostering essential skills and bonds through direct experience.
  3.  **Instrumental Gender Equality:** The *primary* driver is the **narrower instrumental claim** that without individual locks ("use-it-or-lose-it"), the higher earner (historically the father) will always be pressured back to work, perpetuating gendered care roles and labor market inequality. The "father target" in discourse confirms this, even with formal neutrality.
  4.  **Child's Claim on Relationships (Secondary):** While compatible, the child's independent claim on a relationship with each parent is likely secondary. The *design* primarily serves parental equality goals. However, the state *uses* the child's welfare as justification for mandating parental participation.

  **Rival Views Foreclosed:**
  1.  **Household-Unit Conception:** Explicitly rejected. The state denies households autonomy to allocate *all* benefits based on their internal logic, prioritizing individual parental engagement over household income maximization or preference.
  2.  **State Neutrality on Care Division:** Foreclosed. The state actively structures and mandates participation from both parents, refusing neutrality on *who* provides care during the leave period.
  3.  **Care Quantity/Source Neutrality:** Rejected. The scheme values *parental* care specifically during the first year (via reserved months) and implicitly devalues non-parental care (no support for grandparents/long-term SAHPs until subsidized childcare kicks in). Source matters deeply.

  **Underdetermined Aspects:**
  *   **Weight of Child's Claim:** The scheme *could* be justified primarily by the child's right to a relationship with each parent *or* primarily by parental labor equality. The design serves both, making the core justification ambiguous.
  *   **Degree of Paternalism:** The exact level of distrust in household bargaining is implied but not strictly defined. Different theories of power within families could lead to the same design.

  **Internal Coherence Assessment:**
  The scheme exhibits **significant tension** between two theories of entitlement:
  1.  **Deferred Wages (Earnings-Proportional):** The 80% wage replacement suggests leave is compensation for lost *individual* labor market earnings – a worker-centric entitlement based on prior economic contribution.
  2.  **Non-Negotiable Care Duty (Non-Transferability):** The reserved months frame leave as an obligatory social/care duty tied to parenthood, where participation itself is the core value, irrespective of wage replacement efficiency or household preference.
  **Conclusion on Coherence:** The design **slides incoherently** between these theories. Earnings-proportionality treats the parent as a *worker* deserving compensation. Non-transferability treats the parent as a *caregiver* obligated to perform a role for the child and society. Valuing the *same* care activity differently based *only* on which parent performs it (due to wage disparity) further highlights the clash: is the leave paying for the labor (which should be valued equally) or compensating the worker (which varies by market wage)? This undermines a singular theory of entitlement.

  **Marketable Reserved Months (Colleague's Variant):**
  This variant **fundamentally substitutes the underlying theory:**
  1.  **Preserves?** Only the superficial attachment to individuals. It abandons the core presuppositions.
  2.  **Substitutes:** It replaces the **instrumental gender equality** and **care competence via doing** goals with a **neoliberal/market efficiency** theory. Care becomes a commodified task. The state's role shifts from ensuring participation to ensuring a minimum paid leave *duration* (via the fixed price), while allowing households to allocate based on comparative advantage and wage sensitivity. It revives the **household as unitary economic agent** model, trusting households to allocate resources efficiently, contradicting the original fear of disadvantageous bargaining. It severs the link between the *individual parent* and the *performance* of care during the reserved period.

  **Shifting to a Child-Centric Scheme:**
  Explicitly prioritizing the *child's interests* would necessitate changes to your listed features:
  1.  **Individual Non-Transferability:** Could *remain*, justified by the child's need for a strong bond with *each specific parent* built through direct, sustained care. The "lapse" penalty would aim to enforce this relationship-building, not parental equality.
  2.  **Earnings-Proportional Payment:** **Must change.** A child-centric view values the *care provided*, not the parent's forgone wages. Payment should be **flat-rate** (equal for both parents) or **capped at a generous median wage**, ensuring adequate resources for the child's care environment regardless of which parent provides it or their prior income. Unequal payments create unequal capacity to provide *for the child* during leave based on parental earnings, which contradicts child welfare focus.
  3.  **Gender-Neutral Rules/Gendered Discourse:** Could remain formally neutral. The discourse *might* shift to emphasize "primary" vs. "secondary" caregiver bonds if research supported it, but the core justification would be developmental necessity, not gender equality. The focus would be on ensuring the child has access to *both* parents, not on balancing parents' careers.

  **In essence:** Your national scheme prioritizes parental labor market equality and challenging gendered care norms, using the child's welfare partly as instrumental justification but primarily as a beneficiary of the resulting parental engagement. This creates internal tensions, particularly between compensation logic and participation duty. Shifting focus squarely to the child's interests would require decoupling payment from parental wages while potentially retaining enforced participation to secure parental bonds.
