prompt: |-
  I work as a policy adviser in a mid-sized voluntary-voting democracy where national turnout has slid into the low sixties over the past two decades, and I have been asked to help draft a submission to an electoral reform inquiry examining whether we should adopt the Australian model. The features of that model that I keep coming back to are structural rather than statistical. Federal compulsory enrolment and compulsory attendance at the polls have been in place since 1924; turnout moved from a voluntary-era range of roughly half to three-quarters of the eligible population into the low-to-mid nineties, and it has stayed there ever since. The sanction is a small administrative fine, cheap enough that almost nobody would call it a serious cost, and it can be waived on the basis of an acceptable excuse such as illness, absence from the country, or objection of conscience. Crucially, because the ballot is secret, the authorities can confirm that you attended a polling place and collected a ballot paper but can never confirm what you did with it; submitting a blank or deliberately spoilt paper is not an offence and is not detectable, and a substantial minority of ballots cast under compulsion are informal in exactly this way. So the state compels bodily presence, verifies presence only, and is constitutionally indifferent to the content of what is deposited in the box.

  What I want is a reconstruction of the theory this practice is only intelligible under, not a survey of arguments for and against compulsion. Start from the apparent incoherence that puzzles me: the act being mandated has, for any individual in an electorate of tens of millions, an essentially zero probability of affecting the outcome, so no straightforwardly causal expected-utility calculation can make it worth doing, let alone worth being fined for not doing; and yet the same legal system compels jury service, where a single juror's absence can actually abort a trial and where the juror is paid for the inconvenience, while the voter is neither causally indispensable nor compensated. What conception of political obligation, and of what makes an electoral result legitimate, licenses compelling the causally impotent act and not merely the causally load-bearing one? Distinguish carefully between what the practice strictly presupposes and what merely fits it comfortably. I have in mind at least four candidate grounds that seem to license an identical institution: a fair-play or reciprocity account on which beneficiaries of a cooperative scheme owe a contribution; a Kantian universalizing account on which the individual's reason to vote derives from what would follow if everyone reasoned as she does; the argument sometimes called evidential cooperation in large worlds, on which an agent facing a decision problem she knows is replicated across many structurally similar agents should treat her own choice as evidence about theirs and cooperate accordingly even absent any causal link; and a purely pragmatic, non-moral engineering rationale on which compulsion is valued because voluntary electorates over-represent the old, the affluent, and the polarized, so dragging everyone to the polls forces parties to compete for the median. Which of these does the Australian arrangement actually depend on, and which could be swapped in without changing a single rule?

  Two further questions I would like treated explicitly. First, is the arrangement internally consistent, given the parts I have described? It prosecutes non-attendance but not donkey voting or blank voting; it justifies itself by reference to the mandate an elected government receives and to the deliberative quality of a fully participating electorate, yet its enforcement machinery is blind to whether any preference was expressed at all. Does that combination presuppose that the value of voting is aggregative and symbolic rather than expressive or epistemic, and if so, what becomes of the standard defences? I would also like you to tell me which rival views the practice quietly forecloses — a consent-based account of political obligation, for instance, or a competence-restricted view on which the uninformed should stay home, or any view on which the worth of a political act depends on its being freely undertaken rather than extracted. Second, consider a variant my committee has been asked to cost: keep the obligation and the excuse provisions but replace the universal small fine with a large fine imposed on a randomly selected five per cent of detected non-voters, holding expected cost constant. What does the choice between these two enforcement structures presuppose about whether the law is doing deterrent work, norm-signalling work, or merely bookkeeping work? Finally, tell me what would have to change institutionally if we replaced the presupposed view with a strictly causal-instrumental one — what would take the place of compulsion, whether a lottery that pays one voter enough to offset the decisiveness deficit, sortition, or something else — and what would have to change if we instead adopted the evidential-cooperation reading, where the state's problem is not motivation but the salience of the fact that millions of similar agents are making the same choice at once.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a policy adviser in a democracy with declining turnout, exploring Australia's compulsory voting model. The main request is to reconstruct the underlying theory of Australia's approach, not just pros and cons. The user is puzzled by the apparent incoherence: why compel voting when an individual vote doesn't causally affect outcomes, unlike jury duty where absence has direct consequences?

  First, I need to identify the core philosophical tension. The user mentions four candidate theories: fair-play reciprocity, Kantian universalization, evidential cooperation, and pragmatic engineering. Which one does Australia's system rely on? The user also asks about internal consistency—enforcing attendance but not the content of the vote—and what that implies about the value of voting. Then there's the variant with random large fines and what enforcement mechanisms reveal about the system's purpose.

  I recall that the Australian system mandates presence, not the act of voting itself. This distinction is crucial. The secret ballot means the state only verifies attendance, not the vote's content. So the legitimacy here might stem from participation as a civic duty, separate from the instrumental impact of the vote. The fair-play theory makes sense here: benefiting from the cooperative scheme (democracy) obligates participation, even if your individual action doesn't change outcomes. 

  The Kantian angle also fits. If everyone abstained, democracy fails, so each person must vote to universalize the maxim. But evidential cooperation seems less central. Pragmatic engineering is practical but not foundational. The key is that the system treats voting as a duty of membership, not as a causally effective act. 

  For internal consistency, the system's focus on attendance rather than valid voting suggests that the act of showing up is symbolic. It reinforces the collective mandate and legitimacy, even if some submit blank ballots. This rejects views that voting's value depends on informed choice or free participation. 

  The random fine variant changes enforcement. Universal small fines signal a norm, while random large fines might deter through fear. The latter could undermine the norm-signalling, making it seem punitive rather than civic. 

  If they switched to a causal-instrumental view, compulsion wouldn't make sense. Instead, lotteries or sortition might incentivize participation where votes matter more. For evidential cooperation, enhancing salience of mass participation could be key, like real-time turnout maps. 

  The user's deeper needs involve justifying compulsory voting philosophically for their submission, addressing potential criticisms about coercion versus legitimacy. They need a coherent framework that aligns with Australia's model to present to the inquiry, showing how it resolves the tension between individual efficacy and collective duty.
answer: |-
  The Australian model operates under a **duty-of-membership theory of political obligation**, grounded in **fair-play reciprocity**. This is the non-negotiable core. Let's reconstruct its logic and implications:

  ### Core Presupposition: Fair-Play Reciprocity
  - **Strict Presupposition**:  
    Citizens benefit from a cooperative scheme (the democratic state's stability, rights protection, and public goods). Compulsory attendance is the *minimal reciprocal contribution* required to maintain this scheme. The act of attendance signifies acknowledgment of membership and shared stakes, regardless of causal impact.  
  - **Why It Resolves the "Incoherence"**:  
    Jury duty is compelled due to *direct* causal necessity; voting is compelled due to *constitutive* necessity. A trial fails without jurors; democracy degrades without collective participation. The fine isn't compensation for inconvenience (as with juries) but a penalty for free-riding on others' participation. The near-zero individual efficacy is irrelevant—the obligation derives from reciprocity, not utility maximization.

  ### Why Other Theories Are Swappable (or Not)
  | **Theory**               | **Compatibility with Australian Model** | **Swappable?** |
  |--------------------------|------------------------------------------|----------------|
  | **Fair-Play Reciprocity** | Foundational: Justifies compulsion as duty of membership. | **No**—core. |
  | **Kantian Universalization** | Fits comfortably (if all abstain, democracy collapses) but *not required*. The system works even if citizens vote for selfish reasons. | **Yes**—can replace without rule changes. |
  | **Evidential Cooperation** | Logically coherent but unnecessary. Australian law doesn't rely on voters modelling others' actions. | **Yes**—but adds no operational value. |
  | **Pragmatic Engineering** | Describes outcomes (e.g., moderating polarization) but doesn't justify *obligation*. The law compels voting because it's owed, not for social engineering. | **No**—replacing core with this would alter the model's moral basis. |

  ---

  ### Internal Consistency & Rival Views Foreclosed
  - **Consistency with Symbolic Aggregation**:  
    The system separates **attendance** (compelled, publicly verifiable) from **voting** (free, secret). This presupposes that:  
    - Legitimacy derives from *inclusive authorization*: The government’s mandate flows from universal opportunity to participate, not aggregated preferences.  
    - The "deliberative quality" comes from parties campaigning for *all* citizens (forced to address median voters), not from informed ballots.  
    Blank ballots are tolerated because the state’s interest is in *demonstrating collective buy-in*, not directing policy.  

  - **Rival Views Foreclosed**:  
    1. **Consent-Based Obligation**: Replaced by obligation from reciprocity. Voting isn’t a voluntary act of consent but a duty.  
    2. **Competence-Restricted Suffrage**: Incompatible. The system assumes all citizens—regardless of knowledge—must participate to ensure representativeness.  
    3. **Expressive/Epistemic Value**: Marginalized. If voting’s worth depended on authentic expression or informed choice, blank ballots would be penalized.  
    4. **Freedom as Prerequisite**: Rejected. The state asserts that civic duties override preference in this context.  

  ---

  ### Enforcement Structures: Deterrence vs. Norm-Signalling
  1. **Universal Small Fine**:  
     - **Primary Function**: Norm-signalling.  
     - The low cost and ease of waiver frame voting as a *default civic habit*. The fine isn’t primarily a deterrent but a symbolic marker of obligation. Enforcement is "bookkeeping" to maintain the norm’s visibility.  

  2. **Random Large Fine (5% of non-voters)**:  
     - **Presupposes Deterrence Logic**:  
       Shifts focus from norm reinforcement to rational cost-avoidance. Implies citizens vote to evade punishment, not from duty.  
     - **Undermines Fair-Play**:  
       Random punishment violates reciprocity (free-riders aren’t equally liable). It suggests the state views voting as a disutility to be priced, not a duty.  
     - **Signals Institutional Distrust**:  
       Treats citizens as opportunists needing threats rather than members sharing responsibility.  

  ---

  ### Replacing the Core Presupposition: Institutional Implications
  - **Adopting Causal-Instrumentalism**:  
    If votes matter only when decisive, compulsion is irrational. Replacements would include:  
    - **Voter Lotteries**: Pay one randomly chosen voter per district enough to offset decisiveness odds (e.g., $10,000). Others abstain.  
    - **Sortition**: Replace elections with randomly selected legislatures. Removes voting entirely.  
    - **Proxy Voting**: Allow high-efficacy voters (e.g., informed subgroups) to cast extra votes.  

  - **Adopting Evidential Cooperation**:  
    The state’s role shifts to enhancing *salience of mass participation*:  
    - **Real-Time Turnup Maps**: Public dashboards showing live turnout by neighborhood.  
    - **Social Incentives**: Voting badges on digital IDs, community competitions.  
    - **Remove Fines**: Compulsion becomes counterproductive; focus on making shared agency visible.  

  ---

  ### Conclusion
  **Australia’s model is only coherent under fair-play reciprocity.** It compels attendance because democracy is a joint enterprise demanding equal participation, irrespective of causal impact. The fine enforces membership duty, not policy influence. Swapping in Kantianism or evidential cooperation alters the justification but not the rules; pragmatic engineering or instrumentalism would require dismantling compulsion entirely. The random-fine variant abandons the model’s soul—treating citizenship as calculative rather than communal.
