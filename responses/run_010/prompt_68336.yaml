  Here are five movements for the dedication, as requested:

  **Movement 1**  
  We gather today near a plaque bearing eleven names. Eleven people who received care at this network, who trusted us, and who, during a crisis unlike any we had faced, did not receive their dialysis when they needed it. They died before we could restore full care. Their absence is a weight we feel. I helped build the system that determined the schedule during those nineteen days when our capacity was broken. That system was designed under immense pressure, with the clearest medical guidance we could assemble and with a single goal: to do the least harm possible when harm could not be avoided for everyone. It was a terrible time.

  **Movement 2**  
  The system worked in two parts. First, our clinicians created careful rules to judge how urgently each person needed treatment. This score told us who could safely wait a little longer and who truly could not. It was based on medical need alone. But many people often had the same score. When that happened, we used a second step: a random draw. We let chance decide. I chose that method because it was clear, auditable, and meant no single person on my team was making a direct choice between specific individuals. It felt like the most neutral way.

  **Movement 3**  
  In the years since, I’ve thought deeply about what that randomness meant. The medical score grouped people together by need. It had to. But the random draw looked at each person alone. When we drew lots, no one was compared. No one’s life was measured against another’s value. No one was deemed less worthy of a chance. The draw didn’t see groups or numbers; it only saw individuals, one by one. Each person in that pool had an equal claim in that moment. Giving each an equal chance wasn't about adding lives together. It was about recognizing each life separately. The burden of waiting fell entirely on the individual who waited, not on some larger calculation.

  **Movement 4**  
  Behind every name on this plaque is a world. A person who laughed, loved, worried, and hoped. A person irreplaceable to their family and friends standing here. A person who walked through these doors expecting care, and who, through circumstances beyond any single person’s control, was asked to wait. We see that person. We see the unique life that was lived. We see the specific grief of those left behind. This plaque says a name. It doesn’t say "one of eleven." It says *their* name. We remember them, each one, for who they were.

  **Movement 5**  
  To the families, your loved one mattered completely. To the staff who worked tirelessly through exhaustion and heartbreak, you did everything humanly possible. To my team, who built a tool under duress hoping to help, your work held a difficult line. That tool was built to be accountable and fair in its design. The random draw, chosen for clarity, also became a way to honor the equal standing of every patient before an impossible situation. We did not choose who waited; the situation forced the choice. We chose only how to face it. We placed trust in medicine and in chance. We placed trust in each person's inherent worth. Let this plaque stand as a testament to the eleven unique lives we lost, and to our shared resolve to meet the next crisis with the same unwavering commitment to every single person in our care.
