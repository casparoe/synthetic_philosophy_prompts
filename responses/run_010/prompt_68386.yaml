  I notice two landmines to avoid: First, any hint of stock examples (chess programs etc.) would violate their explicit instruction. Second, the marking scheme must punish "expensive errors" like claiming physical completeness settles the issue - that's exactly the level-confusion they're combating. 

  For the model answer, I'll adopt Dennett's "real patterns" framework but wrestle with the ecologist's rational construction method. The key tension is whether predictive success proves reality or just reflects the ascriber's rationality imposition. The evidence-discrimination part is crucial - they want students to propose tests beyond mere predictive power, like divergent predictions under rival attributions. 

  The marking scheme needs to reward specific moves: explaining why internal representations aren't decisive (since Dennett's stance doesn't require them), then confronting the rational construction problem. Typical botches will include fixating on lookup tables or retreating to generic stance definitions. 

  Expensive errors must include: (1) Equating physical stance completeness with ontological primacy - that misunderstands Dennett's anti-reductionism. (2) Thinking declaring "realist" ends debate - this isn't about labels but pattern robustness. 

  What this tests beyond standard questions: It forces application of stances to a novel system where intentional attribution works despite no compositional representations, exposing that predictive economy - not implementation - grounds reality claims. The evidence-discrimination requirement prevents canned answers.
answer: |-
  Here is a complete end-of-term assessment package based on your specifications.

  **1. The Question**

  **Exam Question (45 minutes, 25 marks)**

  Read the following case carefully:

  > A commercial pollination firm uses a swarm of two hundred autonomous drones in an almond orchard. Two descriptions of the swarm exist:
  >
  > 1.  **Engineers' Specification:** Each drone has a lookup table (~40,000 sensor-signature-to-motor-command entries) learned via reinforcement training, plus a small array of route statistics. The specification explicitly states no internal component represents the orchard, wind, bloom, or other drones in a reusable or compositional way (no map, self-model, etc.). Engineers can precisely predict a drone's *next* motor command using this specification. However, simulating the swarm's behaviour over an hour, or under novel conditions not in the table, performs near chance.
  > 2.  **Behavioural Ecologist's Description:** She attributes attitudes to the swarm (e.g., "believes north rows are depleted," "prefers to spread rather than clump," "wants to minimise energy per pollen unit"). From these, she derives the swarm's behaviour. Under novel trials (e.g., wind machine on, rows netted, drones removed), her predictions hold ~92% of the time and significantly outperform the engineers' simulation. When asked how she arrives at these attributions, she says she determines what a well-designed forager, situated like the swarm and equipped with its sensors, *ought* to take the world to be, and then checks if the swarm behaves accordingly.
  >
  > Crucially, the drones' internal physical states are identical under both descriptions. The accounts differ only in the *level* of description used.

  **Your Task:** Based on Dennett's concepts of stances and the reality of patterns, **argue for one of the following verdicts** regarding the attitudes attributed by the ecologist (e.g., "believes north rows are depleted," "wants to minimise energy per pollen unit"):
  > **(A) These attitudes pick out something real about the swarm system.**
  > OR
  > **(B) These attitudes are merely a convenient summary, not something the swarm system genuinely has.**

  Your essay **must**:
  1.  Clearly state your chosen verdict (A or B).
  2.  Explain *why* you reach this verdict, using Dennett's framework concerning stances and the reality of patterns. Define key terms like "real" or "has" as you use them in this context.
  3.  Explicitly address **why the engineers' finding that "nothing inside the drones represents anything" does not, by itself, settle the question in favour of (B).**
  4.  Discuss the **"harder problem"**: The ecologist generates attributions by asking what a *rational* system *ought* to believe/desire. Explain why this method raises the concern that the stance's accuracy might be partly *manufactured by the ecologist* rather than *discovered in the swarm*, and why this might suggest rival attributions could be intertranslatable. How does this bear on your verdict?
  5.  Propose **one specific piece of further evidence** that could help discriminate between verdict (A) and verdict (B). Explain *how* this evidence would support one verdict over the other. (Do not merely assert that predictive success proves reality/convenience).

  *(Approx. 700 words)*

  **2. Model Answer (Verdict A - Attitudes Pick Out Something Real)**

  **(Verdict A)** Based on Dennett's framework, the attitudes attributed by the ecologist ("believes north rows are depleted," "wants to minimise energy per pollen unit") pick out something real about the swarm system. By "real" here, I mean they identify a *robust pattern* in the swarm's behaviour that exists independently of any single observer and whose identification allows for significantly more economical and reliable prediction of the system's behaviour under a wide range of conditions than brute-force physical description does. The swarm genuinely "has" these properties in the sense that they are stable, projectable features of its functional organization discernible from the intentional stance.

  Dennett distinguishes three stances for predicting behaviour. The *physical stance* relies on precise physical laws and microstructure. The engineers use this (or a very low-level *design stance* focusing on implemented mechanisms) to predict the next motor command. While precise at that granularity, it fails miserably for longer timescales or novelty because the lookup table lacks compositional structure – it cannot recombine representations. The *intentional stance* treats the system as a rational agent with beliefs and desires to predict its actions based on what it "should" do given those attitudes and its environment. The ecologist adopts this stance, achieving 92% predictive accuracy even under unforeseen conditions. Dennett argues that a pattern is real insofar as adopting a particular perspective (like the intentional stance) allows us to capture the data (the swarm's behaviour) more economically – simplifying prediction and explanation – than listing every physical state or low-level event (brute enumeration). The ecologist's dramatic predictive success, significantly exceeding the low-level simulation's capabilities, demonstrates that the intentional pattern she identifies is highly economical and robust. This strongly suggests it is real.

  Crucially, the engineers' finding that "nothing inside the drones represents anything" in a compositional/reusable way does **not** settle the case against the reality of the intentional attitudes. Dennett explicitly rejects the idea that genuine belief requires specific, language-like internal representations (e.g., a "Language of Thought"). His intentional stance is about patterns visible at the *system level*. The reality of the pattern (e.g., the swarm acting *as if* it believes the north rows are depleted) lies in its predictive power and projectability, *not* in the specific implementation details. The lookup table, *as a whole system interacting with the environment and other drones*, exhibits a pattern best captured by intentional descriptions. The absence of internal maps or symbols doesn't erase the functional, system-level pattern the ecologist exploits.

  However, the ecologist's method raises a "harder problem": she generates attributions by asking what a *rational* system *ought* to believe/desire in that situation. This introduces a potential confound. The accuracy of her predictions might stem partly from her *imposing* a rational structure onto the swarm's behaviour, rather than *discovering* a pre-existing rational structure inherent solely in the swarm. Her method ensures the attributions will be coherent and rational *from her perspective*, potentially making the system *appear* more rational than it inherently is. This could lead to rival, *equally predictive* intentional interpretations being possible (intertranslatable), differing only in how they carve up the system's "beliefs" and "desires" while preserving behavioural predictions. For instance, "prefers to spread" vs. "fears collision damage" might both predict spreading behaviour under similar conditions. This intertranslatability challenges the idea that there is a single, uniquely "correct" set of attitudes mirroring internal states.

  Nevertheless, this doesn't undermine the *reality* of the pattern captured by *some* intentional stance interpretation. The key test is predictive power and economy *relative to alternatives*. While rival intentional interpretations might exist, *all* successful ones will capture the *same* underlying behavioural pattern – the one the ecologist identified. That this robust pattern exists and is best captured at the intentional level (compared to physical/design stance simulations) is what makes the attitudes real. The possibility of intertranslatability shows the pattern might be describable in different intentional vocabularies, but the *pattern itself* is what is real. The swarm's behaviour exhibits a strong, projectable tendency to act in ways interpretable as goal-directed foraging under constraints, and that tendency is a real feature of the system.

  **Further Discriminating Evidence:** To distinguish between (A) reality and (B) mere convenient summary, we could investigate the swarm's behaviour under conditions deliberately designed to create *irrational* conflicts between the attributed attitudes and sensory input. For example, manipulate the environment so that acting to "minimise energy per pollen unit" (attributed desire) based on the *apparent* "belief that north rows are depleted" (based on manipulated sensor signatures) would lead the swarm into a highly energy-inefficient trap, while a different action (perhaps clumping) would be optimal. If the swarm consistently falls into the trap, behaving *irrationally* relative to its *own* attributed attitudes (but rationally relative to the manipulated inputs), this suggests the attitudes are genuinely *guiding* its behaviour as a system – the pattern includes this susceptibility to irrational outcomes based on its *own* belief/desire structure. This supports (A). If the swarm easily adapts, behaving optimally despite the conflict, it might suggest the ecologist's specific attributions were merely a convenient summary of simpler mechanisms, not capturing a robust internal "logic" susceptible to such conflicts, leaning towards (B).

  **3. Marking Scheme (Total 25 Marks)**

  *   **1. Clear Verdict & Core Argument (5 marks)**
      *   *First-Class (5):* Unambiguous choice of A or B. Clear, concise statement linking verdict to Dennett's "reality as robust pattern defined by predictive economy," defining "real/has."
      *   *Competent (3-4):* Clear verdict. Link to pattern/predictive economy present but less precise or definition of terms less explicit.
      *   *Botch:* No clear verdict, or verdict stated without linking to pattern/economy, or "real/has" undefined. Verdict flip-flops. *Mistake:* "Because Dennett is a realist/instrumentalist."

  *   **2. Addressing Internal Representations (4 marks)**
      *   *First-Class (4):* Explicitly explains why the engineers' finding (no internal representations) does *not* settle against reality: distinguishes system-level pattern reality from requirement for internal symbols/language-of-thought. Cites predictive success despite lack of representations.
      *   *Competent (2-3):* States lack of representations doesn't settle it, links to stance level vs. implementation, but explanation less clear or lacks emphasis on system-level pattern.
      *   *Botch:* Implies lack of representations *does* prove attitudes aren't real, or ignores this point entirely. *Mistake:* "Beliefs require brain-like structures."

  *   **3. Exploiting Predictive Power (4 marks)**
      *   *First-Class (4):* Clearly articulates how the ecologist's superior predictive success (92% vs. near chance) under novelty demonstrates the *economy* and *robustness* of the intentional pattern, per Dennett's criterion for reality.
      *   *Competent (2-3):* Notes predictive success is key evidence for reality, links to Dennett's idea, but lacks detail on economy/robustness compared to physical stance or brute enumeration.
      *   *Botch:* Merely asserts predictive success proves reality without linking to Dennett's pattern/economy framework. *Mistake:* "Prediction proves internal representations exist."

  *   **4. Engaging the "Harder Problem" (6 marks)**
      *   *First-Class (6):* Clearly explains the concern: attributions generated via rationality norms risk *imposing* coherence, making accuracy partly ascriber-manufactured. Explains intertranslatability (rival attributions possible). Insightfully discusses implications for verdict (e.g., supports pattern reality over unique internal correspondence, or challenges uniqueness but not robustness).
      *   *Competent (4-5):* Identifies the method (rational ought) and states the concern (manufactured accuracy). Mentions intertranslatability. Discusses implications, but perhaps less deeply or clearly.
      *   *Botch:* Ignores the "harder problem" or misstates the ecologist's method. Fails to discuss implications for reality/verdict. *Mistake:* "Rationality norms prove the beliefs are true."

  *   **5. Proposing Discriminating Evidence (4 marks)**
      *   *First-Class (4):* Proposes *specific*, *novel* evidence relevant to the case (beyond existing predictions). Clearly explains *how* it discriminates between A (reality) and B (convenience), focusing on pattern robustness, susceptibility, or adaptiveness. (e.g., irrationality trap test, stability under perturbation, rival interpretations).
      *   *Competent (2-3):* Proposes relevant evidence. Explains discrimination, but link to A/B or Dennett's framework is weaker or less specific. Evidence might be somewhat vague.
      *   *Botch:* Proposes irrelevant evidence (e.g., "look inside drones"), or evidence that doesn't discriminate (e.g., "more predictions"), or fails to explain *how* it discriminates. *Mistake:* "Evidence is impossible."

  *   **6. Structure & Clarity (2 marks)**
      *   *First-Class (2):* Well-organized, logical flow, concise, clear language.
      *   *Competent (1):* Generally clear but may have minor organizational issues or slight vagueness.
      *   *Botch:* Disorganized, confusing, overly verbose, or illegible.

  **4. Expensive Errors (Cap the Mark)**

  1.  **"Completeness of Physical Stance Implies Higher Levels Aren't Real":** *Error:* Arguing that because the engineers *could* (in principle, atom-by-atom) describe everything physically, the intentional attitudes *must* be unreal or epiphenomenal. *Why Error:* This misunderstands Dennett's core point. The reality of a pattern (like a hurricane or intentional system) is defined by its predictive utility and projectability *at its own level*, not reducibility. Physical completeness doesn't negate the reality of higher-level patterns that offer genuine explanatory/predictive power. It commits a reductionist fallacy Dennett explicitly opposes.
  2.  **"Declaring Realism/Instrumentalism Settles It":** *Error:* Stating the verdict *only* based on a personal declaration ("I am a realist, therefore A") or ("Dennett is an instrumentalist, therefore B") without engaging Dennett's *specific criterion* (pattern robustness/predictive economy) applied *to this case*. *Why Error:* The question demands reasoning *using Dennett's framework* applied to the case. Simply adopting a metaphysical label bypasses the required analysis of the case using the tools provided (stances, patterns, economy).
  3.  **"Attitudes Require Phenomenal Consciousness/Feeling":** *Error:* Rejecting the reality of the attitudes because drones lack feelings, inner experience, or "what it's like" to believe/want. *Why Error:* Dennett's intentional stance is explicitly about patterns of behaviour and functional organization. He argues that beliefs/desires can be real ascriptions to systems (like chess computers or thermostats) *without* requiring consciousness. Injecting consciousness confuses the issue and ignores Dennett's functionalism.
  4.  **"Predictive Success *Only* Proves Usefulness, Not Reality":** *Error:* Conceding the ecologist's predictions work well but insisting this *only* proves the stance is a useful fiction (verdict B), without grappling with Dennett's argument that *this kind of predictive success under novelty is precisely the hallmark of a real pattern*. *Why Error:* It dismisses Dennett's core operational definition of "real pattern" without providing a counter-definition or argument *within his framework*. It asserts instrumentalism without engaging the case for realism based on pattern robustness.

  **5. What This Tests Beyond a Conventional Stance-Distinction Question**

  This question rigorously tests whether students can *apply* Dennett's framework—particularly the concept of "real patterns" defined by predictive economy and the levels issue—to a novel, complex case where intentional stance attribution is highly successful *despite* the explicit absence of compositional internal representations. It forces them beyond mere definition to grapple with the core metaphysical implication (reality) and the methodological challenge of rational construction/intertranslatability. Crucially, it demands not just recognition of predictive success, but the generation of *discriminating evidence*, pushing them towards deeper analysis of what constitutes robust pattern reality versus useful fiction. A standard "distinguish the three stances" question wouldn't probe these critical, application-oriented depths or the nuances of the reality debate within Dennett's system.
