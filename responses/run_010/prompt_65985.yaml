  - **Step 4's legitimacy leap**: Does declining authority *automatically* grant a right? The user's own examples show secession requires negotiation (Canada) or is denied (Spain). Rejecting this feels ad hoc without criteria.  
  - **Step 6's sorites paradox**: There *is* a difference between Quebec and a street—collective agency. This is where the "people" worry bites hardest.  

  The critical flaw is step 6. It treats all groups as morally equivalent by ignoring how shared identity and institutional capacity make a "people" capable of self-rule. The user missed this because civil engineering primes them to see territory neutrally—a street is just a smaller polygon. But polities aren't geometric; a village lacks Quebec’s historical institutions or Catalonia’s linguistic cohesion.  

  Pricing alternatives:  
  - Ditching step 1 loses consent’s core appeal.  
  - Rejecting step 3 undermines territorial secession’s practicality.  
  - Denying step 4 makes secession rights mysterious.  

  The circularity worry is *inside* step 6: Defining "the people" by majority vote presumes the unit’s legitimacy. Quebec’s distinct society pre-exists the vote; a random street doesn’t.  

  Repaired argument:  
