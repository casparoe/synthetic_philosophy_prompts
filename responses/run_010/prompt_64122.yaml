  We are drafting a document for two camps: Constitutivists and Situationists, regarding Good's theorem on the value of information. The goal is adversarial collaboration: present each side fairly, list agreements, disagreements, and test cases without forcing consensus.

  ## Step 1: Adjusting the Labels

  The original labels risk caricature. Let me adjust:

  - **Constitutivists** (formerly): They hold that the assumptions of Good's theorem (fixed act set, state-independent utilities, conditionalization, and expected utility maximization) are constitutive of rational agency. Thus, any deviation (like paying for ignorance) is either a change in the decision problem or irrational. However, this might caricature them as ignoring real-world constraints. Adjust to: They view the theorem as a normative standard for ideal rational agents, and deviations are either due to non-ideal conditions (which then require a different model) or irrationality.

  - **Situationists** (formerly): They argue that rationality must account for real-agent limitations (like self-binding problems or modeling limitations). Thus, there are situations where refusing free information is rational. The caricature risk is that they might seem to reject normative standards entirely. Adjust to: They hold that the theorem's idealizations are often unmet in practice, so rational agents in non-ideal situations may justifiably refuse information.

  Adjusted labels (optional, but to avoid caricature):

  - **Ideal Normativists** (for Constitutivists): Emphasizes their focus on ideal norms.
  - **Contextual Rationalists** (for Situationists): Emphasizes context-dependence.

  But to keep the original terms (as per the user's request) and adjust the descriptions:

  Working note: The term "Constitutivists" might suggest that the conditions are necessary for any belief or preference, but the position is better seen as asserting that these conditions define ideal rational agency. The term "Situationists" might suggest ad hoc exceptions, but their position is that rationality is context-sensitive and must account for cognitive and strategic limitations. To avoid caricature: Constitutivists hold that the theorem describes the normative standard for a rational agent in the specified decision problem, and any refusal of free information in such a problem is irrational. Situationists hold that the theorem's assumptions are often not met in real decision problems, and in such cases, refusing information can be rational.

  ## Step 2: Agreed Claims (Mathematics)

  Good's theorem: Consider a decision problem with:
  - A set of acts A
  - A set of states S (with prior probability P)
  - A utility function U(a,s) (state-independent)

  An agent is offered free evidence E (a random variable). Let the expected utility of the optimal act without evidence be:
  EU_0 = max_{a in A} E[U(a,s)]

  After observing E, the agent updates by conditionalization to P(s|E) and chooses the act that maximizes expected utility given E. The expected utility after evidence (but before observing it) is:
  EU_1 = E[ max_{a in A} E[U(a,s)|E] ]

  The theorem states: EU_1 >= EU_0.

  The inequality chain:

  1. EU_0 = max_{a} E[U(a,s)] 
  2. For any fixed a, E[U(a,s)] = E[ E[U(a,s)|E] ]  (by law of total expectation)
  3. Therefore, EU_0 = max_{a} E[ E[U(a,s)|E] ] 
  4. But note: EU_1 = E[ max_{a} E[U(a,s)|E] ]

  The key step: 
  E[ max_{a} E[U(a,s)|E] ] >= max_{a} E[ E[U(a,s)|E] ] 
  because the max of averages is less than or equal to the average of maxima (a standard result from Jensen's inequality for the convex function max).

  Thus, EU_1 >= EU_0.

  Agreed claims (both camps sign):

  1. The mathematical inequality holds: The expected utility of making a decision after observing free evidence (and updating by conditionalization, then maximizing expected utility) is at least as great as the expected utility of making a decision without the evidence.

  2. The proof relies on the law of total expectation and the fact that for any random variable (here E) and any set of functions (here the conditional expected utilities of acts), the average of the maximum is at least the maximum of the average.

  3. The assumptions are: 
     - The set of acts A is fixed and does not change with evidence.
     - Utilities depend only on the state and act, not on the evidence or the agent's beliefs (state-independent).
     - The agent updates by conditionalization on the evidence.
     - The agent chooses by maximizing expected utility at the time of decision.

  4. The inequality is strict if and only if there is some value of E for which the optimal act given E is different from the optimal act without evidence, and this difference matters for expected utility.

  ## Step 3: Disagreements Table

  | Topic | Constitutivist Formulation | Situationist Formulation | Difference |
  |-------|----------------------------|--------------------------|------------|
  | Scope of the theorem | The theorem applies to any decision problem meeting the assumptions. An agent who refuses free information in such a problem is irrational. | The theorem applies only to idealized decision problems. In real problems, due to limitations (e.g., self-binding, cognitive costs), refusing free information can be rational. | Substantive: They disagree on whether real agents can be in a decision problem that meets the assumptions and still rationally refuse information. |
  | Interpretation of "free" | The information is free in the sense of no direct cost and no change to the decision problem (acts, states, utilities). | Free information might still have indirect costs (e.g., by causing the agent to make a suboptimal choice due to bounded rationality or by altering the decision context). | Substantive: They disagree on whether "free" in the theorem precludes all indirect costs. |
  | Role of idealizations | The assumptions (fixed acts, state-independent utilities, conditionalization, and maximization) are constitutive of rational agency; thus, the theorem is a fundamental norm. | The idealizations are often false in practice, so the theorem does not constrain rational agents in non-ideal contexts. | Substantive: They disagree on whether the assumptions are necessary for rationality. |
  | Definition of the decision problem | The decision problem (including acts, states, utilities) is objectively defined and fixed. If an agent refuses information, it must be that the problem has changed (e.g., now including the cost of processing) and thus is a different problem. | The decision problem is defined by the agent's situation, which may inherently include limitations (e.g., inability to commit) that make refusing information rational. | Substantive: They disagree on whether the same decision problem can include cognitive limitations. |

  ## Step 4: The Cruxes and Four Cases

  We set up tests. For each crux, we have a test both accept as bearing on it, and each camp's prediction.

  Crux 1: **Can an agent be rational in refusing free information in a decision problem that satisfies the theorem's assumptions?**
  - Constitutivist prediction: No.
  - Situationist prediction: Yes, because even if the problem satisfies the formal assumptions, the agent's real limitations (e.g., self-binding) might make refusal rational.

  Crux 2: **Does the theorem's assumption of state-independent utilities hold in all real decision problems?**
  - Constitutivist: Yes, because utilities should be defined over outcomes, and outcomes are determined by states and acts.
  - Situationist: No, because outcomes can depend on the agent's beliefs (e.g., regret) or the state can be influenced by the act (as in the prognostic test).

  Crux 3: **Can the act set change due to receiving information?**
  - Constitutivist: The theorem assumes a fixed act set. If the act set changes, it's a different decision problem.
  - Situationist: In real problems, information can change available acts (e.g., by causing a loss of options).

  Now, run the four cases:

  **(a) Blinded analysis to avoid wishful thinking:**
  - Description: An analyst cannot model her own wishful thinking, so she withholds a calibration constant until the pipeline is frozen. This avoids biasing the analysis.
  - Attacks assumption: The updating by conditionalization. The agent does not trust that she will update correctly if she sees the data early (because of cognitive bias). Thus, she uses a different update rule (withholding) to avoid bias.
  - Stresses inequality chain: The step where conditionalization is assumed. The agent fears that if she sees E, she won't condition properly, so the expected utility of seeing E might be lower than not seeing it (if she were to condition properly, it would be higher, but she cannot).
  - Which camp says it's Good-breaking? 
    - Situationist: Yes, because the agent rationally refuses free information to avoid bias. 
    - Constitutivist: The decision problem has changed: now the agent has a choice of update procedure (with or without blinding). The act set now includes "analyze with blinding" vs. "without". So it's a different problem. Thus, not a counterexample to the theorem in its original form.

  **(b) Interim look at trial data by an uncommitted team:**
  - Description: A team that will stop at the first flattering result and cannot commit to continuing. They choose not to look at interim data to avoid stopping early.
  - Attacks assumption: The fixed act set (because if they look, they might stop early, which is a different set of acts) and the conditionalization (because they might not update correctly if they are biased to stop). Also, the maximization at the moment of choice: they know that if they look and see a flattering result, they will stop (which they now consider suboptimal because they want to continue to the end).
  - Stresses inequality chain: The step where the agent chooses by maximizing expected utility at the moment of choice. In this case, the future self might choose an act that the current self considers suboptimal (because the current self would prefer to continue). So the current self expects that if they look, they might make a suboptimal decision (stopping) due to lack of commitment.
  - Which camp says it's Good-breaking?
    - Situationist: Yes, because by refusing the information, they avoid the temptation to stop early.
    - Constitutivist: The decision problem has changed: the agent now has a self-control problem. The act set without looking is {continue without stopping}, and with looking it is {stop if flattering, continue otherwise}. So it's a different problem. Also, the agent is not updating by conditionalization if they stop early based on bias.

  **(c) Prognostic test with disclosure effect:**
  - Description: A test predicts an outcome (e.g., a genetic test for a disease), but disclosing the result changes the outcome (e.g., by causing stress or a self-fulfilling prophecy). Thus, the act (disclose or not) and the state are not independent.
  - Attacks assumption: State-independent utilities? Actually, the state (whether the disease develops) is influenced by the act of disclosure. So the state is not independent of the act, and the utility may depend on the act in a way that is not separable.
  - Stresses inequality chain: The step that requires that the state is independent of the act? Actually, the theorem assumes that the state is fixed and the act is chosen, and the utility is a function of (a,s). But if the act affects the state, then the state is not fixed. The theorem doesn't assume act-state independence? Actually, in the standard setup, the state is drawn from a prior, and the act doesn't affect the state. But here, the act of testing and disclosing might change the state. So the prior over states is conditional on the act? This breaks the setup.
  - Which camp says it's Good-breaking?
    - Situationist: Yes, because the information, if received and disclosed, changes the state and thus the expected utility. So refusing the test avoids the harmful disclosure.
    - Constitutivist: This is not a counterexample because the decision problem is not the same: when the agent refuses the test, she avoids the act of disclosure. The act set without the test does not include disclosure. Therefore, it's a different decision problem.

  **(d) Payoff depends on beliefs:**
  - Constructed case: In a laboratory, a researcher is offered a measurement that would tell her whether her apparatus is calibrated correctly. However, she knows that if she learns that it is not calibrated, she will become demoralized and her future productivity will suffer. The payoff (e.g., her career success) depends on her belief state.
  - Attacks assumption: State-independent utilities. The utility depends not only on the state (calibrated or not) but also on her belief about it (because demoralization affects productivity).
  - Stresses inequality chain: The step that requires utilities to be state-dependent only. Here, the utility function should be U(a, s, b) where b is the belief state, but the theorem assumes U(a,s). Since the evidence changes the belief, it directly affects utility.
  - Which camp says it's Good-breaking?
    - Situationist: Yes, because if she learns the apparatus is faulty, she becomes demoralized and her overall utility is lower.
    - Constitutivist: This is a change in the utility function. Without the information, the utility depends only on the state (and acts). With the information, the utility function changes to include belief states. So the decision problem is different.

  ## Step 5: Verbal Disagreements

  The two camps might agree on the mathematics but disagree on the application. Specifically:

  1. **Definition of "free information"**: The Constitutivist requires that the information does not change the decision problem (acts, states, utilities). The Situationist allows that in the real world, information might change the problem (e.g., by causing a belief-dependent effect). So they are using "free" in different senses.

  2. **Scope of "same decision problem"**: When the Situationist describes a case, the Constitutivist argues that the decision problem has changed. This is a substantive disagreement about what counts as the same problem.

  3. **Expected value of information**: Both agree that in the formal sense (with the assumptions) it is non-negative. But the Situationist denies that this formal sense applies to many real situations, so they are talking about different concepts.

  ## On the User's Definition of "Good-breaking"

  The user defines a case as *Good-breaking* if:
  - Offered free, truthful evidence.
  - Act set and description of consequences unchanged.
  - Ex ante expected utility strictly higher if she refuses the evidence.

  Constitutivist: They would not accept this definition because if the agent refuses the evidence and the expected utility is higher, then by their view, either the act set or consequences must have changed, or the agent is irrational. So they would amend: "the act set and the description of the consequences are unchanged" is not sufficient; one must also ensure that the agent updates by conditionalization and maximizes expected utility. If the agent does not, then it's not a counterexample.

  Situationist: They accept the definition, but note that in cases where the agent updates improperly or cannot maximize due to limitations, the "consequences" might include cognitive costs or changes in future options. So they might want to specify that the decision problem includes all relevant features (like self-commitment issues).

  Thus, the disagreement: Constitutivists require that the agent updates and chooses optimally, while Situationists allow that the agent may not (due to real limitations) and that this is part of the decision problem.

  Recorded as a disagreement: The Constitutivist amends the definition to include that the agent must update by conditionalization and maximize expected utility. The Situationist amends to include that the decision problem may include the agent's limitations (so that the consequences and acts are defined accordingly).

  ## Final Document Structure

  I will now write the full document accordingly.
answer: |-
  ### Adversarial Collaboration Report: Good's Theorem and the Value of Information  
  *Prepared for a reading group of philosophers and scientists, with positions labeled "Constitutivists" and "Situationists"*  

  ---

  ### 1. Working Note: Adjusted Position Descriptions  
  The labels "Constitutivists" and "Situationists" risk caricature if left unrefined. **Constitutivists** are not claiming that real agents always satisfy the theorem’s assumptions; rather, they argue that when an agent *violates* the theorem (e.g., refuses free information), it signals either a *failure of rationality* or a *change in the decision problem* (e.g., new acts, utilities, or constraints). **Situationists** are not rejecting Bayesian norms wholesale; they argue that rationality must account for *inescapable situational constraints* (e.g., cognitive limits, self-binding problems) that make the theorem’s idealizations inapplicable to real agents. Thus, refusal of information can be rational *without* implying irrationality or problem-change. Adjusted, both positions are substantive: Constitutivists see the theorem as a *normative standard for ideal agency*; Situationists see it as *inapplicable when situational constraints prevent idealization*.  

  ---

  ### 2. Agreed Claims: Mathematical Core of Good’s Theorem  
  Both camps accept the following mathematical statements, derived from I. J. Good’s 1962 result (often cited as 1967):  

  1. **Setup**:  
     - An agent faces a fixed set of acts \(A\), states \(S\) with prior probability \(P(s)\), and state-independent utilities \(U(a,s)\) (i.e., \(U\) depends only on \(a\) and \(s\), not beliefs or evidence).  
     - The agent is offered costless, truthful evidence \(E\) (a random variable).  
     - The agent updates beliefs via *conditionalization*: upon observing \(e\), posterior belief is \(P(s|e)\).  
     - At the moment of choice, the agent selects an act maximizing expected utility (EU).  

  2. **Inequality Chain** (both camps accept the derivation):  
     - Ex ante EU without evidence:  
       \[
       \text{EU}_0 = \max_{a \in A} \mathbb{E}_P[U(a,s)]
       \]  
     - Ex ante EU with evidence (before \(E\) is observed), assuming conditionalization and EU-maximization:  
       \[
       \text{EU}_1 = \mathbb{E}_P\left[ \max_{a \in A} \mathbb{E}[U(a,s) | E] \right]
       \]  
     - **Theorem**: \(\text{EU}_1 \geq \text{EU}_0\).  
     - **Proof steps** (uncontroversial under the assumptions):  
       - (i) \(\text{EU}_0 = \max_{a} \mathbb{E}[U(a,s)]\).  
       - (ii) By the law of total expectation: \(\mathbb{E}[U(a,s)] = \mathbb{E}\left[ \mathbb{E}[U(a,s) | E] \right]\).  
       - (iii) Thus, \(\text{EU}_0 = \max_{a} \mathbb{E}\left[ \mathbb{E}[U(a,s) | E] \right]\).  
       - (iv) \(\text{EU}_1 = \mathbb{E}\left[ \max_{a} \mathbb{E}[U(a,s) | E] \right]\).  
       - (v) \(\mathbb{E}\left[ \max_{a} \mathbb{E}[U(a,s) | E] \right] \geq \max_{a} \mathbb{E}\left[ \mathbb{E}[U(a,s) | E] \right]\) (since for any random variable, the average of maxima \(\geq\) maximum of averages).  
     - Strict inequality holds iff evidence is *relevant*: for some \(e\), the EU-maximizing act given \(e\) differs from the EU-maximizing act without evidence.  

  3. **Shared Interpretations**:  
     - The theorem shows that the *ex ante* expected value of free information is non-negative under its assumptions.  
     - Violations of \(\text{EU}_1 \geq \text{EU}_0\) imply a violation of at least one assumption (e.g., state-dependence, non-conditionalization, or non-maximization).  

  ---

  ### 3. Disagreements Table  
  | Topic | Constitutivist Formulation | Situationist Formulation | Difference |  
  |-------|----------------------------|--------------------------|-----------|  
  | **Scope of Rationality** | "Rationality requires satisfying the theorem’s assumptions; if an agent refuses free information, they are either irrational or facing a different decision problem." | "Rationality depends on the agent’s situation; refusing free information can be rational when constraints (e.g., self-binding) prevent ideal updating or maximization." | Substantive |  
  | **Status of Assumptions** | "Fixed acts, state-independent utilities, conditionalization, and EU-maximization are constitutive of rational agency in a given decision problem." | "The assumptions are useful idealizations but not constitutive; real agents may violate them rationally when situational constraints are unavoidable." | Substantive |  
  | **What Counts as a ‘Decision Problem’** | "A decision problem is defined by fixed \(A\), \(S\), \(P\), and \(U\); if refusing information alters these, it creates a new problem." | "A decision problem includes the agent’s situational constraints (e.g., inference limitations); refusing information can be an optimal act within the *same* problem." | Substantive |  
  | **Value of Information** | "Free information has non-negative value in any well-posed Bayesian decision problem; refusal is never ex ante beneficial." | "Free information can have negative value in non-ideal situations; refusal can be ex ante optimal when situational constraints are included." | Substantive |  
  | **‘Free’ Information** | "Information is free only if it has no side effects on acts, states, or utilities; otherwise, the problem has changed." | "Information can be ‘free’ in cost yet still alter the decision context (e.g., via psychological effects); this is part of the original problem." | Verbal (due to differing definitions of "free") |  

  ---

  ### 4. Cruxes and Case Analysis  
  **Shared Methodology**: Both camps accept that the cases below test *which assumptions of Good’s theorem are violated* and *where the inequality chain breaks*. Predictions are made ex ante:  
  - **Constitutivist Prediction**: No rational agent in a fixed decision problem can have \(\text{EU}_0 > \text{EU}_1\).  
  - **Situationist Prediction**: Rational agents in non-ideal situations can have \(\text{EU}_0 > \text{EU}_1\).  

  #### Cases:  
  **(a) Blinded Analysis to Avoid Wishful Thinking**  
  - **Setup**: An analyst cannot model her own bias. To ensure objectivity, she withholds a calibration constant until the analysis pipeline is frozen.  
  - **Attacked Assumption**: *Conditionalization* (she cannot update without bias, so "conditionalization" is not applied correctly).  
  - **Inequality Stress Point**: Step (iv) – \(\text{EU}_1\) assumes unbiased updating, but here \(\mathbb{E}[U|E]\) is distorted.  
  - **Camps’ Verdict**:  
    - **Constitutivist**: Not Good-breaking; the problem changed (act set now includes "defer evidence").  
    - **Situationist**: Good-breaking; refusal is rational, and the problem is unchanged.  

  **(b) Interim Trial Look Without Commitment**  
  - **Setup**: A team will stop at the first flattering result. They refuse an interim data look to avoid premature stopping.  
  - **Attacked Assumption**: *Fixed act set* (information would reduce acts to "stop early") and *maximization at choice* (future selves deviate from prior EU-maximization).  
  - **Inequality Stress Point**: Step (v) – \(\max_a \mathbb{E}[U|E]\) assumes future selves maximize EU, but they do not.  
  - **Camps’ Verdict**:  
    - **Constitutivist**: Not Good-breaking; evidence changes acts (adds "stop early"), so it’s a new problem.  
    - **Situationist**: Good-breaking; refusal is rational within the original problem (commitment inability is situational).  

  **(c) Prognostic Test with Disclosure Effect**  
  - **Setup**: A test predicts disease risk, but disclosing a positive result causes stress-induced illness, altering the outcome.  
  - **Attacked Assumption**: *State-independent utilities* (utility depends on disclosure act: \(U(\text{disclose}, s) \neq U(\text{withhold}, s)\)) and *act-state independence* (disclosure changes \(s\)).  
  - **Inequality Stress Point**: Step (ii) – law of total expectation assumes \(s\) is act-independent.  
  - **Camps’ Verdict**:  
    - **Constitutivist**: Not Good-breaking; refusing the test avoids disclosure, changing the act set.  
    - **Situationist**: Good-breaking; refusal is optimal, with no change to the problem’s description.  

  **(d) Belief-Dependent Payoffs (Constructed Case)**  
  - **Setup**: A lab chief must approve a device. If she learns it is faulty, she loses confidence and career prospects. Payoffs depend on her beliefs.  
  - **Attacked Assumption**: *State-independent utilities* (\(U\) depends on belief states, not just \(s\)).  
  - **Inequality Stress Point**: Step (i) – EU definitions assume \(U(a,s)\) is belief-independent.  
  - **Camps’ Verdict**:  
    - **Constitutivist**: Not Good-breaking; learning evidence changes utilities (e.g., confidence loss), altering the problem.  
    - **Situationist**: Good-breaking; refusal is rational, and belief-dependence is part of the original problem.  

  ---

  ### 5. Verbal Disagreements  
  Two disputes are primarily verbal:  
  - **Definition of ‘Decision Problem’**: Constitutivists define a decision problem *without situational constraints* (e.g., self-binding, belief-dependent utilities); Situationists include them. Thus, when Situationists cite a "Good-breaking case," Constitutivists rebut that the problem has changed.  
  - **‘Free’ Information**: Constitutivists define "free" as *no side effects on acts, states, or utilities*. Situationists define it as *no direct cost*, allowing indirect effects (e.g., belief-induced utility changes).  
  - **Non-Negative Expected Value**: Both agree information has non-negative value *under the theorem’s assumptions*. They disagree on whether "expected value" includes situational constraints. Thus, they are not contradicting each other but applying the theorem to different scopes.  

  ---

  ### Response to the User’s Request: Defining "Good-breaking"  
  The user defines a case as **Good-breaking** iff:  
  - Free, truthful evidence is offered.  
  - Act set and consequence description are unchanged.  
  - Ex ante EU is strictly higher if evidence is refused.  

  **Camp Responses**:  
  - **Constitutivists**: Reject this definition. *Amendment*: Add "and the agent updates via conditionalization and chooses by EU-maximization." Otherwise, refusal implies irrationality or problem-change.  
  - **Situationists**: Accept the definition *if* "consequence description" includes situational constraints (e.g., belief-dependent payoffs).  
  - **Recorded Disagreement**: Constitutivists require ideal agency in the definition; Situationists require inclusion of real-world constraints. Thus, **no case satisfies both definitions**. For example:  
    - In (d), Situationists call it Good-breaking; Constitutivists do not (due to amended definition).  
    - All four cases are well-posed *under one camp’s view* but not both.  

  **Conclusion**: The dispute hinges on whether rationality is *defined by* the Bayesian ideal (Constitutivists) or *responsive to* situational constraints (Situationists). Both camps agree on the mathematics but disagree on its applicability. This document, drafted per adversarial-collaboration protocol, enables progress by clarifying agreements and substantive cruxes.  

  ---  
  *Document ends*
