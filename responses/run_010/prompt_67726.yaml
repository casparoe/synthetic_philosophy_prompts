answer: |-
  Here’s a decision tree designed for your constraints, starting from Lewis’s triviality premises and using the example **A: "The lab ran the assay twice"** and **C: "The sample was contaminated"**. It fits on one page (7 questions, 10 leaves), avoids formal machinery in questions, and isolates the "verbal dispute" crux. Premises (i)–(v) are incompatible at the root (boxed).  

  ### Decision Tree: Responses to Lewis’s Triviality  
  **Root**: *Accept Lewis’s proof: (i) Conditionals express propositions, (ii) Credences obey standard probability rules, (iii) PC (cr(A→C) = cr(C|A) when cr(A)>0), (iv) PC holds for all credence functions (or a class closed under cond. on non-conditionals), (v) Non-degeneracy (A,C exist as above) — cannot all be true.*  

  1. **Does PC hold for ALL credence functions?**  
     - **Yes** → Go to Q2  
     - **No** (PC restricted) → Go to Q3  

  2. **Is the class of credence functions CLOSED under conditionalizing on any non-conditional sentence?**  
     - **Yes** → ✦ **Ruled out by Lewis** (triviality follows)  
     - **No** → Go to Q4  

  3. **Do indicative conditionals (e.g., *A→C*) express propositions (truth-conditions)?**  
     - **Yes** → Go to Q5  
     - **No** → Go to Q6  

  4. **After learning *A* (and nothing else), would you stake MORE on *C* being true than on *A→C* being true?**  
     - **Yes** → ✦ **McGee/Restricted PC**  
       *Awkward: PC fails for agents who’ve updated on certain evidence.*  
     - **No** → ✦ **Unnamed** (Possible but unstable: PC holds only for "rigid" credence functions)  

  5. **Is *A→C* truth-functionally equivalent to *¬A ∨ C*?**  
     - **Yes** → ✦ **Jackson/Truth-Functional**  
       *Awkward: Must explain why low-cr(¬A∨C) conditionals are sometimes assertible (e.g., via "robustness" implicature).*  
     - **No** → Go to Q7  

  6. **Is *A→C* used to express a belief about *C* under the supposition *A*?**  
     - **Yes** → ✦ **Adams/Non-Propositional**  
       *Awkward: Denies that conditionals embed logically (e.g., in negations or disjunctions).*  
     - **No** → ✦ **Edgington/Expressivist**  
       *Awkward: Conditionals express attitudes, not beliefs; "probability" is not credence but willingness to infer.*  

  7. **When *cr(A)>0*, is *cr(A→C)* always AT LEAST *cr(C|A)*?**  
     - **Yes** → ✦ **Stalnaker/Near-Miss**  
       *Awkward: *cr(A→C)* > *cr(C|A)* when *C* is possible under *A* but not determinate.*  
     - **No** → ✦ **Unnamed** (Rejects PC but keeps truth-conditions; e.g., dynamic semantics)  
       *Awkward: Assertibility tracks *cr(C|A)* without truth-conditions explaining why.*  

  ---

  ### Key Features & Annotations  
  - **Verbal Dispute Exposure**: Q3 is the crux. **Yes** → truth-conditional views (debate about probability rules). **No** → non-propositional views (debate about what "probability" means for non-assertoric content). The supervisor’s hypothesis ("verbal") becomes plausible only if you answer **No** (it reframes PC as a norm for suppositional attitudes).  
  - **Unexplored/Empty Branches**:  
    - *After Q1→No + Q3→Yes + Q5→No + Q7→No*: **Unnamed** (e.g., truth-conditional non-PC views like Bradley’s *desire*-based semantics). Not ruled out; unstable due to lack of unified assertibility model.  
    - *After Q1→No + Q3→Yes + Q5→Yes*: Covered (Jackson).  
  - **Indistinguishable Leaves**: None—all named views are separated.  
  - **Missing Mandatory Leaf**: The "contextualist/variable-domain" view is covered under **McGee/Restricted PC** (Q4).  
  - **Probability-Accessible Wording**: Questions use "stake more on" (Q4), "express a belief about *C* under supposition *A*" (Q6), etc.  
  - **Leaf Coverage**:  
    - Keep truth-conditions but reject PC: **Jackson** (Q5→Yes), **Stalnaker** (Q7→Yes), **Unnamed** (Q7→No).  
    - Truth-functional + implicature: **Jackson**.  
    - No truth-conditions: **Adams**, **Edgington** (split by Q6).  
    - Restricted PC: **McGee**.  
    - PC with enriched semantics: **Stalnaker** (marginally above).  

  **Tree Flow**:  
  ```mermaid
  graph TD
      ROOT[Premises i-v incompatible] --> Q1[PC for all cred functions?]
      Q1 -->|Yes| Q2[Closed under cond. on non-conditionals?]
      Q1 -->|No| Q3[Conditionals express propositions?]
      Q2 -->|Yes| LEAF1[✦ Ruled out by Lewis]
      Q2 -->|No| Q4[After learning A, stake more on C than A→C?]
      Q3 -->|Yes| Q5[A→C ≡ ¬A ∨ C?]
      Q3 -->|No| Q6[Express belief about C under A?]
      Q4 -->|Yes| LEAF2[✦ McGee/Restricted PC]
      Q4 -->|No| LEAF3[✦ Unnamed]
      Q5 -->|Yes| LEAF4[✦ Jackson/Truth-Functional]
      Q5 -->|No| Q7[cr(A→C) ≥ cr(C|A)?]
      Q6 -->|Yes| LEAF5[✦ Adams/Non-Propositional]
      Q6 -->|No| LEAF6[✦ Edgington/Expressivist]
      Q7 -->|Yes| LEAF7[✦ Stalnaker/Near-Miss]
      Q7 -->|No| LEAF8[✦ Unnamed]
  ```  
  Printable on one page (14 nodes total). **Student guidance**: Start at the root. At each question, answer based on your intuition about the lab assay example (*A*, *C*), not prior philosophical allegiance.
