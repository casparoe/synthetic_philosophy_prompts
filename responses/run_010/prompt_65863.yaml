answer: |-
  ## The Unspent Receipts

  The Archives hummed. Not with the buzz of electronics, but the low thrum of ancient radiators, the sigh of forced air through dusty vents, and the rhythmic *thump-scrape* of filing cabinet drawers in the Municipal Records Office of Bryn Seren. Outside, Welsh rain slicked the grey pavements; inside, fluorescent tubes flickered over ranks of beige cabinets and the peculiar device squatting on Eleri’s desk.

  Officially, it was the "Municipal Sorting and Verification Apparatus, Mark IV (Experimental Prototype)." Everyone called it the Sorter. It looked like a chunky, off-white typewriter fused with a microfiche reader. Its purpose was simple, if obscure: verify the authenticity of paper documents – birth certificates, planning permissions, benefit claims – by analysing microscopic paper fibres and ink signatures against the Council’s chaotic, half-digitised archives. Its *real* magic, known only to Eleri and her predecessor, was efficiency. It didn’t just verify; it *sorted*. Presented with a stack of mixed documents, it whirred, clicked, and spat them into neat, correct piles faster than any human clerk. It ran cool and quiet, powered seemingly by the mains socket and the faint warmth radiating from the vent near Eleri’s chair.

  Eleri understood the accounting, passed down in terse notes: *The Sorter pays its way. It uses the warmth around it, a little siphoned off, to do the heavy lifting of sorting. But it takes a snapshot of every document it processes – a record, burnt onto its internal plates. To keep working, to keep that little engine ticking over, those plates must be wiped clean after every hundred verifications. Press the red button. The wipe generates heat – noticeable heat. That’s the cost. Forget to wipe, and the Sorter slows. Eventually, it stops.*

  The records weren't anonymous data. Each verification snapshot captured the document’s essence: names, dates, the faint scent of ink, the texture of paper, the urgency in a handwritten plea, the faded grandeur of an old certificate. To the Sorter, they were just patterns. To Eleri, flicking through the verification logs sometimes, they were fragments of lives passing through the Council’s bureaucratic mill.

  Then came Aled. Newly transferred from Parks Maintenance, assigned as Eleri’s assistant. Young, earnest, fascinated by the Sorter’s quiet hum. Eleri showed him the ropes: feeding documents, clearing jams, the importance of the red button.

  "The wipe?" Aled frowned, peering at the innocuous red circle. "Why? It’s just clearing memory, isn’t it?"

  "It gets hot," Eleri said, tapping the manual – a single, dog-eared sheet. "It needs the space. Costs energy to clear it. Leave it too long, the whole thing gums up."

  Aled nodded, unconvinced. He started exploring the verification logs. He saw Mrs. Pugh’s birth certificate, traced back to 1923, the paper brittle as autumn leaves. He saw Tomos Evans’s planning permission for his garage, the ink smudged where his hand had trembled. He saw the application for young Anwen Davies’s music scholarship, the hope practically vibrating off the scanned pixels.

  "That’s Mrs. Pugh from number seventeen," Aled murmured one afternoon, pointing at a log entry. "She died last winter. This… this is a piece of her." He looked at the Sorter with new reverence. "It remembers them."

  "It records patterns," Eleri corrected, firm but not unkind. "Needs wiping."

  But Aled resisted. When the counter neared one hundred, he’d find urgent filing elsewhere. Eleri would return to find the counter reset, the faint smell of ozone and warm plastic lingering – the heat signature of erasure. She’d sigh, but say nothing. He was young. Sentimental.

  The problem started subtly. The Sorter’s hum deepened, became a low growl during complex sorts. The air around it felt warmer than usual, even on colder days. The overhead lights flickered more frequently when the Sorter was active. One afternoon, it spat out a perfectly verified document, but the verification log entry was garbled – Mrs. Pugh’s name tangled with Tomos Evans’s address.

  "See?" Eleri pointed at the corrupted log. "It’s getting full. Clogged. The wipe clears the pipes."

  Aled looked stricken. "But… that’s Mrs. Pugh’s *only* record here now. The original certificate was misfiled. If we wipe…"

  "Then the Sorter might break," Eleri stated flatly. "And then no one gets verified. No benefits, no permits. The cost is due, Aled. It always is."

  He wiped it that time. The heat bloom was intense, radiating from the vents like a miniature furnace. Aled watched the log counter reset to zero, his face tight. The Sorter’s hum returned to normal. But a seed was sown.

  The backlog grew. Benefit reforms meant a flood of new claims. The Sorter worked overtime, its counter climbing relentlessly: 150, 200, 250. Aled became its guardian. He monitored its temperature with his palm, flinching at the increasing warmth. He watched the lights dim noticeably whenever it sorted a large batch. He saw the verification logs become slower to access, occasionally glitching – a date swapped, a signature misattributed.

  "It’s struggling," Eleri warned, the counter reading 312. "That heat isn't free. The lights dimming? That’s the system compensating, pulling more juice because the Sorter’s internal engine is labouring under the weight."

  "It remembers Anwen Davies’s scholarship application," Aled argued, his voice low and intense. "It remembers the exact smudge on Tomos Evans’s form. If we wipe, that’s gone. Truly gone. It’s… it’s like forgetting them twice."

  "It’s machinery, Aled. It sorts paper. It isn't a memorial." Eleri’s pragmatism felt brittle. She saw the strain on the device, the physical manifestation of unspent cost. "The heat builds. The circuits strain. It *will* fail. And when it fails, the cost of repair…" She didn’t finish. The Council barely funded paperclips.

  At 387 verifications, the Sorter coughed. Sorting a complex land registry document, it emitted a sharp *crack*, like a tiny capacitor giving up. A thin wisp of smoke, smelling of overheated resin, curled from a seam. It completed the sort, but sluggishly, the documents emerging warm to the touch. The room lights dipped dramatically, plunging them into near-darkness for a full second before recovering.

  "The bill," Eleri whispered, staring at the smoke. "Presented."

  Panic flared in Aled’s eyes. "No! We can’t! Not yet! Look!" He frantically pulled up the log. "That was Rhiannon Morris’s deed. Her family fought for that boundary for years. The Sorter has the clearest scan… the original is water-damaged…"

  "The Sorter is *burning*, Aled! Literally! That heat has to go somewhere!" Eleri gestured wildly. The air around the desk was stifling. "If we don’t wipe, it cooks its own circuits. Then *all* the records, everything it ever sorted, every verification, is just… slag. Gone. And we have a broken machine the Council won’t fix."

  The truth hung between them, heavy as the warm, ozone-tinged air. Postponing the cost hadn't avoided it; it had compounded it. The debt wasn't just thermal now; it was the imminent destruction of the very memories Aled fought to preserve. The cost of wiping was loss. The cost of *not* wiping was greater loss, and physical ruin.

  Aled looked at the Sorter, its casing hot against his knuckles as he touched it. He looked at the red button. He looked at Eleri, her face etched with the grim certainty of broken systems and municipal budgets. He saw Mrs. Pugh’s brittle birth certificate in his mind’s eye, Tomos Evans’s smudged hope, Anwen Davies’s vibrating ambition, Rhiannon Morris’s hard-won boundary… all trapped in an overheating machine, moments from oblivion.

  The refusal to settle the debt hadn't preserved anything. It had only created a crisis where the only choices were bad and worse. The human refusal to forget collided with the ironclad necessity of the machine’s cycle, and the collateral damage was the integrity of the records themselves.

  With a sound that was half sob, half sigh of defeat, Aled reached out. His finger hovered over the red button. The Sorter whined, a high-pitched protest from straining components. The counter blinked: 387. The heat radiating from the vents felt like a physical pressure.

  He pressed it.

  A deep, resonant *thrum* vibrated through the desk. The lights flickered wildly, then dimmed almost to darkness. A wave of intense, dry heat washed over them, smelling fiercely of hot metal and dust. Aled closed his eyes, feeling the warmth on his face, imagining the countless fragile records – names, dates, signatures, tiny fragments of a hundred lives – dissolving into that sudden, necessary thermal pulse. Not gone without trace, but transformed, paid back into the ambient warmth of the Archives, settling the account.

  The thrum subsided. The lights brightened, steady now. The Sorter’s hum returned, lower, smoother, cooler. The counter read 0.

  Silence, thick and uncomfortable, filled the space where the heat had been. Aled stared at the blank log screen, his face pale. The warmth lingered, a tangible reminder of what had just been spent. Eleri placed a hand on the Sorter’s casing. It was cooling rapidly now, returning to room temperature. The immediate danger had passed. The engine could cycle again.

  But the cost was counted not just in joules, but in the hollow look in Aled’s eyes, staring at an empty log. He had consented. He had paid the price. The bill for all that efficient sorting, deferred for so long, had finally been presented and settled. Not with a bang, but with a blast of heat and the quiet erasure of three hundred and eighty-seven fragile ghosts.

  ---

  **Author's Note: The Ledger**

  *   **Work Extraction:** Each document sort performed by the Sorter utilises ambient thermal energy (from radiators, air vents) to physically organise the papers. This work is extracted via its internal mechanism, analogous to a Szilard engine using molecular knowledge to perform work against a spring or piston, drawing energy from the heat bath. Roughly *kT* ln 2 of work per sort is implied.
  *   **Information Acquisition:** Each verification creates a persistent, high-fidelity internal record (the "snapshot") within the Sorter. This acquisition, analogous to the demon observing a molecule's position, is itself thermodynamically reversible; no significant heat is generated during this recording phase.
  *   **Debt Accumulation:** Failure to erase these records constitutes the thermodynamic debt. The accumulating snapshots represent a store of unerased information. While the Sorter continues operating, this debt manifests physically: increased operating temperature (waste heat generated just to *maintain* the recorded states against thermal noise), electrical drain (compensation for inefficiency), circuit strain, data corruption (logical errors), and ultimately, component failure (overheating, capacitor blowout). The debt grows with each unerased sort.
  *   **Debt Magnitude (End):** By the climax, 387 sorts have occurred since the last wipe. The debt is large and actively destructive – the Sorter is overheating, smoking, causing power fluctuations, and on the verge of catastrophic failure that would destroy both the machine and the stored information.
  *   **Debt Discharge:** Erasure (pressing the red button) is the necessary thermodynamic reset. The energy cost of logically resetting each bit of information (Landauer's principle) is discharged as a pulse of waste heat dumped back into the surroundings (the intense wave of heat felt by Aled and Eleri, the dimming lights indicating power draw). This heat equals or exceeds the work originally extracted using the information, satisfying the second law. The information is irrevocably lost (the wiped logs).
  *   **Second Law Compliance:** No violation occurs. Work is extracted from the heat bath using information. The entropy cost (heat generation) is deferred until erasure, but it *is* paid. The accumulating consequences (heat, strain, corruption, failure) are direct evidence of the deferred cost. Erasure resets the system to its initial state, discharging the entropy debt as heat, allowing the cycle to repeat. The story explicitly shows the cost being paid and the necessity of erasure for continued operation.
