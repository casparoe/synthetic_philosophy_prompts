  ## The Forger's Final Canvas

  He knew the brushstroke's hidden nerve,
  The crackle-map on aged varnish,
  How time's thin thumb on canvas served
  To counterfeit a vanished starfish
  Of light on some dead master's sea.
  He'd bake the boards to antique brown,
  Weave fictions deep in pedigree,
  Plant clues where scholars might look down
  And gasp. A Rembrandt? Yes! Undoubted!
  (Though born last Tuesday in his shed).
  His skill was flawless, never routed –
  By X-ray, UV light, or tread
  Of carbon dating's cold decree.

  He sought new arts to test his hand,
  A sharper, cleaner kind of theft.
  He chose a quill, a grain of sand
  To seed within the archives' crypt.
  *He wrote the words, precise and stark,*
  *As if the dead man's breath grew warm,*
  *A poem found in fading dark,*
  *A perfect echo of the form.*
  He placed it, trembling, in the stacks –
  A "newly found" and "precious" thing.

  But then he saw the paradox:
  A critic read it, voice took wing,
  Recited it aloud, unfurled
  Its sound within a crowded room...
  *He wrote the words, precise and stark,*
  *As if the dead man's breath grew warm,*
  *A poem found in fading dark,*
  *A perfect echo of the form.*
  **No loss.** The selfsame verse took flight,
  No fraction of its worth declined.
  His forgery burned pure and bright
  As any true verse of that mind.

  He'd forged the ink, the page, the age,
  The brittle leaf, the scholar's cry...
  But not the poem on the stage,
  Born living from the speaker's sigh.
  It floats now, free of provenance,
  A ghost no vaults can hold or bind.
  His perfect fraud makes perfect sense,
  Authentic to its verbal kind.
  He stares: the signature's his own, yet not.
  There's nothing left to fake, no plot.
  Just language, naked and uncaught,
  The forger's hand
  Hovering above
  A name that isn't there.

  ---

  **How This Meets Your Request:**

  1.  **Autographic Felt (Painting):** Lines 1-12 detail the forger's mastery over the *physical history* crucial to painting: brushstrokes, craquelure, aging materials, provenance documents, scientific analysis. His fake succeeds *because* it mimics that unique history.
  2.  **Allographic Felt (Poetry):** The repeated stanza (Lines 13-16 & 21-24) is the core device. When recited aloud ("voice took wing," "Recited it...") or written elsewhere, the *exact same words* are the *exact same poem*. Value is intact ("**No loss.**... No fraction of its worth declined").
  3.  **The Turn:** Lines 17-20 ("But then he saw the paradox...") mark his realization. His skill set is useless because the poem's identity is purely in the word sequence, independent of its physical origin or history ("free of provenance," "Authentic to its *verbal* kind").
  4.  **The Tricky "New Lost Poem" Fraud:** Lines 25-28 ("He'd forged the ink...") explicitly address his final attempt: forging the physical artifact (ink, page, age) and the *context* (discovery, provenance). The poem itself remains authentic once uttered or recognized by its words. The fraud lies *only* in the false claim of origin and history attached to the *physical object*, not in the linguistic artwork.
  5.  **Ending on Awkwardness:** The final lines emphasize the forger's paralysis. He's confronted with the *absence* of a physical artifact to forge for the poem *itself*. The poem exists independently ("language, naked and uncaught"). The "signature" dilemma ("his own, yet not") and the hovering hand over the absent name capture his profound disorientation within this new (for him) ontological space.
  6.  **Goodman Nod:** Those familiar with Goodman will recognize the precise distinction: autographic (identity depends on history/authenticity of production) vs. allographic (identity depends solely on compliance with notation/character-indifference). The "new lost poem" highlights the nuance where the *notation* is authentic, but the *history of production* claimed is false – a fraud against the archive, not the poem.
  7.  **Accessible Poem:** Without knowing Goodman, it's a compelling story of a master forger defeated by the unique nature of language. The central image of the repeated stanza and the forger's final confusion are clear dramatic moments.
