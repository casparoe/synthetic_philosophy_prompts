prompt: |-
  I sit on the Behavioural Insights Review Panel of a fictional English unitary council, which must authorise every proposed nudge before it is piloted. Our terms of reference permit only interventions that are "transparent on reflection and compatible with the autonomous formation of the recipient's own preferences", but the panel has never defined either phrase, and we meet next Thursday.

  The proposal comes from the schools catering service. From the autumn term, every pupil in Year 4 will be served the "green plate" — a vegetable-first main with water in place of flavoured milk — unless they opt out. Opting out requires a paper form signed by the pupil and a parent, handed to the catering officer in person within ten school days, and re-authorised each term. The letter home to parents sets out, in plain English, that the default and the effort required to leave it were chosen precisely because defaults work. That disclosure sits below a paragraph inviting parents to keep their child in the scheme so their class does not lose points in the school's behaviour competition, alongside a photograph of the headteacher. Success will be evaluated by the proportion of pupils still on the green plate at week twelve. The bid also pre-commits to a revision trigger: if opt-out exceeds five per cent at any school by week four, the letter will be rewritten to reduce it.

  A parent group has objected that the proposal breaches both limbs of our terms of reference. I voted to approve at first reading and would rather not have been right for the wrong reasons.

  Please draft the panel's decision memo — approve, reject, or approve with conditions — of roughly 800 words. It should give a clear bottom line, any conditions specific enough to be operationalised by Monday, and an implementation time frame; and it should put the strongest version of the case against my preferred outcome rather than dismissing it. Close with a short annex marking which of the empirical or normative premises the decision turns on are settled and which are genuinely contested among people who know the literature, so that we are not relying on a false consensus. Invent no sources; I need no bibliography or citations.
reasoning: |-
  Okay, the user is part of a Behavioural Insights Review Panel for a fictional English council. They need to draft a decision memo about a "green plate" proposal in schools. The proposal makes a vegetable-first meal with water the default for Year 4 pupils, requiring an opt-out process involving signed paperwork. 

  Hmm, the tricky part is the panel's terms of reference requiring interventions to be "transparent on reflection" and "compatible with autonomous preference formation." The user voted to approve initially but now has doubts after parent objections. They want the memo to strongly present counterarguments even if approving.

  First, I should unpack those undefined terms. "Transparent on reflection" likely means people should be able to understand the nudge's purpose if they think about it. "Autonomous preference formation" probably means nudges shouldn't override people's ability to form their own choices. The parent group argues both are violated here.

  Looking at the proposal: The opt-out process is deliberately burdensome (paper forms, in-person submission, termly renewal). That's classic choice architecture - making the desired behavior easier. The disclosure about defaults is good, but buried below peer pressure tactics (class points competition) and the headteacher's photo. Success is measured by opt-out rates, which could incentivize making opting out even harder.

  The user wants me to draft a memo with approval/rejection/conditions. Since they lean toward approval but want intellectual honesty, I'll structure it with:
  - Clear decision (approve with conditions)
  - Strong counterarguments section
  - Specific operational conditions
  - Annex on contested/settled premises

  For conditions: Fix the disclosure placement, remove peer pressure elements, monitor autonomy indicators, and adjust the revision trigger. The timeframe should allow quick implementation by autumn term.

  The annex will note where experts agree (defaults work) vs. debate (how much friction crosses ethical lines, whether disclosures fully mitigate concerns). This avoids false consensus.

  User's deeper need seems to be upholding ethical standards while permitting effective nudges - they don't want to be "right for the wrong reasons." The memo should reflect that tension.
answer: |-
  **Behavioural Insights Review Panel: Decision Memorandum**  
  **Regarding Schools Catering Service Proposal SCS/24/G ("Green Plate Initiative")**  

  **Date:** [Thursday Meeting Date]  
  **Proposal:** Mandatory "green plate" default (vegetable-first main, water) for Year 4 pupils, with burdensome opt-out process.  
  **Decision:** **Approved with Binding Conditions** (see Section IV). Implementation permitted for Autumn Term pilot, conditional on immediate modifications.  

  ---

  ### I. Summary of Proposal
  The schools catering service proposes a default "green plate" option for all Year 4 pupils, requiring active opt-out via a signed paper form submitted in-person within 10 days and renewed termly. Key elements:  
  - Explicit disclosure in parent letter stating the default was chosen "because defaults work."  
  - Incentive paragraph linking participation to class behaviour competition points + headteacher photo.  
  - Success metric: Proportion retaining green plate at Week 12.  
  - Revision trigger: Rewrite letter if opt-out >5% by Week 4.  

  ### II. Core Ethical Test: Terms of Reference  
  Panel must ensure interventions are:  
  **A. Transparent on reflection:** Can recipients discern the intent and mechanism of influence upon consideration?  
  **B. Compatible with autonomous preference formation:** Does the nudge preserve space for genuine preference development without coercion or exploitation of cognitive biases?  

  ### III. The Case Against Approval (Parent Group/Objector Position)  
  *The Panel acknowledges the following substantive objections as ethically material:*  

  **1. Transparency Deficit:**  
     - **Disclosure Insufficiency:** Burying the rationale *below* behavioural incentives (competition points/headteacher image) risks "notice without understanding." Recipients may focus on social pressure, not the default’s intent.  
     - **Procedural Opaqueness:** The opt-out mechanism’s friction (in-person submission, short window, termly renewal) is not explicitly justified as a behavioural tool in communications. Transparency requires explaining *how* the design shapes choices, not just *that* it does.  

  **2. Autonomy Erosion:**  
     - **Preference Substitution:** The high-friction opt-out substitutes administrative barriers for genuine preference expression. A child/parent who mildly prefers flavoured milk may acquiesce to the default due to hassle, not revised preferences.  
     - **Exploitative Incentives:** Linking retention to class competition points leverages peer pressure and authority (headteacher’s photo), potentially overriding nutritional preferences with social anxiety. This risks "preference capture" unrelated to the intervention’s health goal.  
     - **Success Metric Bias:** Measuring only uptake (not health outcomes or satisfaction) incentivises preserving the default by any means, including amplifying friction if opt-outs rise.  

  **3. Revision Trigger Peril:**  
     - The 5% opt-out trigger focuses solely on reducing opt-outs, not addressing autonomy or transparency flaws. Rewriting the letter to "reduce opt-out" could further obscure intent or increase pressure, violating ToR.  

  ***Conclusion of Objector Case:** This design uses layered behavioural tactics (defaults + friction + social pressure) without sufficient guardrails, risking manipulative preference steering rather than autonomous choice support.*  

  ### IV. Panel Decision & Binding Conditions  
  **Approval is granted for a one-term pilot**, conditional on immediate operational revisions to align with ToR. Failure to implement *all* conditions voids approval.  

  **Operational Conditions (Implementation Deadline: Monday [Date]):**  
  1. **Revised Parent Letter:**  
     - Move the "defaults work" disclosure **above** any behavioural incentives (competition points/headteacher photo).  
     - Add: *"The opt-out process requires a signed form returned in-person to ensure active choice. We use this method because making opt-out more deliberate helps families commit to healthier habits."*  
     - **Remove** all references to class behaviour competitions, points, or peer consequences. Retain headteacher photo only if accompanied by a neutral welcome message.  

  2. **Opt-Out Process Modifications:**  
     - Accept forms via email/scanned upload *or* in-person.  
     - Extend deadline to **15 school days**.  
     - **Remove termly reauthorisation.** Opt-out remains valid for the academic year unless revoked.  

  3. **Success Metrics & Revision Trigger:**  
     - **Primary Success Metric:** Add parental/child satisfaction survey (nutritional appeal, perceived choice) at Week 12.  
     - **Revision Trigger Revision:** If opt-out >5% at Week 4, revisions must:  
       - Be approved by the Panel before distribution.  
       - Focus *only* on clarifying transparency (e.g., simplifying language) — not adding incentives or friction.  

  4. **Autonomy Safeguard:**  
     - Teachers must verbally inform pupils in class: *"You can change your meal choice anytime. Ask your parents to contact the catering officer if you want to switch."*  

  **Pilot Timeframe:**  
  - Autumn Term only.  
  - Full opt-out data + satisfaction surveys submitted to Panel by [End of Term Date].  
  - No rollout to other years without fresh Panel approval.  

  ### V. Reasoning for Conditional Approval  
  - **Transparency Salvaged:** Explicitly justifying *both* the default *and* the opt-out process’s friction, while elevating disclosure, meets the "transparent on reflection" threshold. Removing peer pressure avoids conflating nudges with coercion.  
  - **Autonomy Respected:** Reducing procedural hurdles (multi-channel submission, no reauthorisation) and decoupling the nudge from social punishment preserves space for preference formation. The classroom reminder empowers pupil agency.  
  - **Proportionality:** Defaults for child nutrition are widely accepted where opt-outs exist. Conditions mitigate the proposal’s most autonomy-threatening elements while preserving its public health intent.  

  ---

  ### ANNEX: Contested vs. Settled Premises in Nudge Literature  
  *(Relevant to This Decision)*  

  | **Premise**                                  | **Settled?** | **Genuinely Contested?** | **Notes for Panel**                                                                 |
  |----------------------------------------------|--------------|--------------------------|-------------------------------------------------------------------------------------|
  | Default effects robustly influence choices   | ✅ Yes       | ❌ Minimal               | Strong consensus across contexts (e.g., organ donation, savings).                  |
  | High-friction opt-outs reduce default exits  | ✅ Yes       | ❌ Minimal               | Empirical support for "sludge" effects. Ethical permissibility is contested.      |
  | Transparency disclosures mitigate autonomy concerns | ❌ No        | ✅ Yes                   | Mixed evidence. Experts debate if disclosures enable reflection or create false legitimacy. |
  | Social incentives (e.g., peer pressure) undermine autonomy in nudges | ❌ No        | ✅ Yes                   | Consensus that coercion violates autonomy; disagreement on whether peer pressure is inherently coercive. |
  | Success metrics focusing solely on uptake incentivise unethical design | ✅ Emerging  | ➖ Some debate           | Growing concern over "uptake bias"; limited direct studies in public sector nudges. |

  **Chair’s Note:** This decision hinges on contested premises (transparency efficacy, friction ethics). The conditions impose a "least restrictive, most transparent" test. Pilot data will inform whether contested assumptions hold in practice.  

  ---
  **Signed,**  
  [Your Name/Chair Designation]  
  Behavioural Insights Review Panel  
  [Unitary Council Name]
