prompt: |-
  Been stuck in this argument in my reading group for about three months now and I honestly can't tell anymore what anyone is disagreeing about. The question: is Buddhist ethics a consequentialism?

  Side A says obviously yes. Acts get evaluated by what they produce, karma is essentially a ledger of results ripening across lifetimes, and then there's that past-life case everyone brings up where the bodhisattva, sailing as a ship's captain, kills the man who's about to murder everyone aboard — taking the bad karma onto himself so the passengers and the would-be killer both come out better off. That's just the trolley problem in robes.

  Side B says no. The evaluative vocabulary isn't right/wrong at all but kusala/akusala, closer to skillful and unskillful, so what's fundamentally assessed is the state of the agent's mind rather than some state of affairs the act brings about; and nibbana isn't a consequence you produce so much as a condition you cultivate toward, which makes the whole enterprise aretaic.

  My hypothesis, and I'd like you to tell me straight if it's wrong: they don't disagree about a single case. Both say the captain is praiseworthy, both say compassion is doing the real work, both say acting from hatred is bad even when the upshot is good. So the entire fight is over the label — specifically over whether a theory can still count as consequentialist when the value it tracks is agent-relative, since your karmic stream and mine aren't fungible, whereas the standard picture assumes one agent-neutral pool of value to maximize.

  Is that the right diagnosis, or is there something substantive buried underneath the taxonomy? The candidates I can think of: whether karmic results are even the right sort of thing to evaluate acts by, given that karma is supposed to key on intention and not on how things turn out; whether there's a vicious circle in saying unskillful mental states are bad because they lead to bad results, and bad results are bad because… what, exactly; and whether merit transfer — the practice of handing your accumulated good karma over to someone else, which a lot of these traditions do ritualy — quietly breaks the agent-relativity both sides are assuming.

  Then tell me what could actually move this. A piece of textual evidence, a distinction nobody has drawn, a change in the question being asked? Or does every case just get absorbed by both readings, in which case say so plainly and explain what work the debate is doing for the people having it, because "we disagree about whether to apply a term from twentieth-century analytic ethics to a tradition that predates it by a long way" feels like a strange thing to spend a semester on.

  One more thing, and it matters to me: be explicit about which parts of this are settled among people who actually work on it and which parts are live controversy. I'd assumed the philology of kusala/akusala was uncontroversial, but maybe not even that. Don't hand me one camp's reading dressed up as the consensus.
reasoning: |-
  Okay, the user is stuck in a three-month-long debate in their reading group about whether Buddhist ethics is consequentialist. Let me start by understanding the two sides. Side A argues that it is consequentialist because actions are judged by their results, karma is like a ledger of outcomes, and they reference the ship captain story where killing one to save many is justified by the net positive outcome. Side B disagrees, saying the focus is on the agent's mental state (kusala/akusala) and that nibbana is about cultivation, not consequences, making it more virtue ethics.

  The user's hypothesis is that the disagreement is mostly about labeling, specifically whether agent-relative karma fits into consequentialism. They want to know if that's accurate or if there's a deeper issue. They also mention possible substantive points like karma's dependence on intention, circularity in defining bad results, and merit transfer breaking agent-relativity.

  First, I need to assess if the user's diagnosis is correct. They're pointing out that both sides agree on practical outcomes but disagree on terminology. That makes sense. The key conflict seems to be whether consequentialism can accommodate agent-relative values. Standard utilitarianism is agent-neutral, but Buddhist karma is individual. So, yes, the label might be the core issue.

  But are there deeper points? The user mentions three candidates: karma evaluating intentions vs. outcomes, circularity in defining bad results, and merit transfer. Let's tackle each. Karma does focus on intention (cetana), so actions are judged by volition, not results. That's a point against consequentialism, which typically looks at outcomes. Circularity: unskillful acts lead to bad karma, but why are those results bad? If it's because they cause suffering, that's consequentialist, but if suffering is bad because it's akusala, that's circular. Merit transfer complicates agent-relativity. If karma can be transferred, it implies some fungibility, which weakens Side B's argument.

  The user also wants to know how to move the debate forward. Textual evidence? Early texts like the Dhammapada emphasize intention. Distinctions? Clarifying types of consequentialism (e.g., motive consequentialism vs. act). Changing the question: maybe instead of labeling, discuss what Buddhist ethics prioritizes. But if both sides interpret cases the same way, the debate might be terminological. However, the work it's doing could be about how to frame Buddhist ethics in Western terms, which is important for comparative philosophy.

  Regarding scholarly consensus: Kusala/akusala as skillfulness is settled. Karma's focus on intention is also agreed. But the classification of Buddhist ethics is still debated, so no consensus there. Merit transfer varies by tradition but is accepted in Mahayana.

  The user's deeper needs: They're frustrated with a prolonged debate that seems unproductive. They want clarity on whether there's real substance or just semantics. They need authoritative sources to break the deadlock. Also, understanding the purpose of the debate might help the group refocus on meaningful discussion rather than labels.
answer: |-
  Your diagnosis is **largely correct and remarkably insightful**, but there are substantive nuances beneath the taxonomy debate. The core disagreement *is* about conceptual mapping and the definition of "consequentialism," particularly concerning agent-relativity and the nature of value. However, the points you raise about intention, circularity, and merit transfer *are* substantive and feed directly into that mapping problem. Here's a breakdown:

  ### 1. Your Hypothesis: Labeling & Agent-Relativity is Central (Correct)
  *   **The Sticking Point:** You've nailed it. Standard consequentialism (e.g., utilitarianism) is **agent-neutral**: value resides in states of affairs (e.g., happiness, suffering), and any agent should act to maximize that value, regardless of who they are. Buddhist karma is fundamentally **agent-relative**: *your* intentional actions create *your* karmic results (vipāka/phala), shaping *your* future experiences and progress towards liberation. Your karma isn't mine to "spend" or "optimize" globally.
  *   **Consequence:** Side A argues that tracking *long-term consequences for sentient beings' well-being and liberation* (even if individually packaged) still makes it consequentialist, perhaps akin to "motive consequentialism" or "global consequentialism" adapted for multiple life-streams. Side B argues that this agent-relativity, coupled with the focus on *mind-states as the direct locus of evaluation* (kusala/akusala), fundamentally shifts it away from classic consequentialism towards virtue ethics (arētaic).

  ### 2. Substantive Points Beneath the Surface (Your Candidates - Valid)
  These aren't just side issues; they provide the *reasons* why the labeling debate persists and why both sides interpret the "same cases" differently:

  *   **a) Intention (Cetana) vs. Outcome:** This is crucial textual evidence.
      *   **Key Text:** "Intention, monks, I declare is kamma. Having willed, one acts by body, speech, or mind." (AN 6.63). Kusala/akusala primarily qualifies the *volition* behind the act.
      *   **Side B Argument:** If the *primary moral evaluation* (kusala/akusala) is applied to the *intention/mind-state* generating the act, not the external outcome, then it's fundamentally different from consequentialism which evaluates acts *by* their outcomes. The *karmic result* is a *consequence of the intention*, not the act evaluated *for* its consequences.
      *   **Side A Counter:** True, but the *reason* intentions are kusala/akusala is *because* they reliably lead to certain *types* of consequences (suffering or its reduction). Skillfulness is *defined* by its consequences (e.g., non-greed leads to contentment). The Ship Captain's act is skillful *because* it prevents immense suffering and creates conditions for better outcomes for all involved (including the killer, by preventing a heinous act).
      *   **Scholarly Status:** **Settled consensus** that intention is the core of karmic generation. **Live controversy** on whether this makes the *ethical framework* intention-focused or consequence-focused. (Philology of *kusala* = wholesome/skillful/proficient; *akusala* = unwholesome/unskillful is **settled**).

  *   **b) The Potential Circularity:**
      *   **The Loop:** Unskillful mind-states (akusala) are bad because they lead to bad karmic results (suffering, rebirth). Bad karmic results are bad because... they are dukkha (suffering, unsatisfactoriness).
      *   **Resolution?** Dukkha isn't *defined* as bad *because* it's akusala; dukkha is the *foundational problem* Buddhism seeks to solve (First Noble Truth). Akusala states *are* a form of dukkha *and* lead to further dukkha. The badness of both akusala states and their painful results stems from their intrinsic connection to dukkha. This *can* be framed consequentially: akusala is unskillful *because* it perpetuates dukkha (a bad consequence). The loop isn't vicious but teleological: the entire path aims at the cessation of dukkha.
      *   **Scholarly Status:** **Live controversy.** Some see dukkha as the ultimate "bad consequence," making the structure consequentialist. Others see the recognition of dukkha as inherent unsatisfactoriness as prior to consequential calculation.

  *   **c) Merit Transfer (Pattidāna/Pariṇāmanā):**
      *   **The Complication:** Especially prominent in Mahayana, the idea that one can dedicate/gift one's accumulated good karma (puṇya) to others (e.g., for their well-being or favorable rebirth) *seems* to challenge strict agent-relativity. If karma is transferable, does it become a more "fungible" good to be maximized?
      *   **Side A Argument:** This shows karma *can* function as a "good" to be distributed for beneficial consequences, aligning with consequentialist optimization.
      *   **Side B Counter:** Merit transfer doesn't erase the agent-relative *creation* of karma. *Your* good deed generates *your* merit, which *you* then *choose* to dedicate. The *act of dedication* itself is a new karmic intention (kusala - generosity) by the giver. The recipient benefits, but it's not the *same* as pooling karma neutrally; it's an intentional act of giving with its own karmic logic. It doesn't negate the core link between *your* intentions and *your* karmic stream.
      *   **Scholarly Status:** **Settled consensus** that merit transfer is a widespread practice, particularly in Mahayana. **Live controversy** on its philosophical implications for karma's agent-relativity. Most scholars see it as an extension of generosity rather than negating core karmic principles.

  ### What Could Move the Debate Forward

  1.  **Refine the Question:** Instead of "Is Buddhist ethics consequentialist?", ask:
      *   "What is the *primary locus* of ethical evaluation in Buddhism: states of mind (kusala/akusala) or states of affairs (karmic results)?"
      *   "Can a framework centered on agent-relative consequences (karma) that prioritizes mind-states qualify as a *type* of consequentialism, and if so, what kind?"
      *   "What work does calling it 'consequentialist' or 'arētaic' *do* for our understanding? Does one label obscure crucial aspects?"

  2.  **Key Textual Evidence to Re-examine:**
      *   **Kusala/Akusala Definitions:** How are they explicitly defined? Texts often link them directly to consequences: e.g., akusala roots (greed, hatred, delusion) lead to harm, affliction, and suffering; kusala roots (non-greed, etc.) lead to welfare and happiness (MN 9, MN 19, AN 3.65-66). This *supports* Side A's consequential reading of *why* mind-states matter.
      *   **The Ship Captain Jātaka (e.g., Śyāma Jātaka):** Analyze the *justification* given. Does it emphasize the *outcome* (saving lives, preventing worse karma for the killer) or the *state of mind* (compassion, willingness to sacrifice)? Both sides find support here. Side A: Outcome justifies the act. Side B: The *compassion* makes the act of killing skillful *despite* its nature; a hateful killing with the same outcome would be akusala.
      *   **Nibbāna as Non-Consequence:** This is strong for Side B. Nibbāna is the cessation of causes (craving, ignorance), not an effect produced by actions. It's realized, not manufactured. Actions are skillful if they *lead towards* that cessation. This leans aretaic/virtue (cultivating the path) rather than producing a positive consequence.

  3.  **Crucial Distinction Often Overlooked:**
      *   **Consequentialism vs. Instrumentality:** Just because something *has* consequences, or is *valued for* its consequences, doesn't automatically make the *ethical theory* consequentialist. Medicine is instrumental for health, but medical ethics isn't necessarily consequentialist. Side B argues Buddhist ethics uses *skillfulness* (kusala) as the core evaluative term, defining it *by* its tendency to lead to good results (liberation, reduced suffering), but the *direct* object of evaluation is the mind-state/intention. It's **teleological** (goal-oriented) but not necessarily **consequentialist** (act-evaluated *solely* by consequences).

  4.  **Acknowledge the Terminological Stalemate (& Its Value):**
      *   You are likely correct that **many specific cases will be absorbed by both readings.** The Ship Captain is praiseworthy for both: Side A for outcomes, Side B for compassion/skillfulness. Acting from hatred is bad for both: Side A leads to bad results, Side B is akusala mind-state.
      *   **The Work of the Debate:** While frustrating, this debate *is* doing work:
          *   **Clarifying Buddhist Ethics:** It forces deep engagement with core concepts (karma, intention, kusala, nibbāna).
          *   **Testing Western Categories:** It highlights the limitations of applying labels like "consequentialism" or "virtue ethics" to complex, pre-modern traditions. The debate reveals where these categories fit poorly or need adaptation (e.g., agent-relative consequentialism?).
          *   **Philosophical Exploration:** It pushes both sides to articulate *why* they prioritize certain aspects (mind-states vs. results, agent-relativity vs. neutral good) in their interpretation. The *discomfort* with the other side's label reveals underlying philosophical commitments.

  ### Scholarly Consensus vs. Live Controversy - Explicitly

  *   **Settled Consensus:**
      *   Kusala/Akusala mean "skillful/unskillful" or "wholesome/unwholesome," qualifying mental factors/actions based on their roots (greed, hatred, delusion vs. non-greed, etc.).
      *   Karma (kamma) is generated primarily by volition/intention (cetana).
      *   Karmic results (vipāka/phala) are experienced by the actor across lifetimes and are intrinsically linked to the quality of the intention.
      *   Nibbāna is the cessation of craving/ignorance, not a "result" created by kamma in the usual sense.
      *   Merit transfer is a significant practice in many Buddhist traditions.
  *   **Live Controversy:**
      *   **The core one:** Whether Buddhist ethics as a whole is best classified as consequentialist, virtue ethical, some hybrid, sui generis, or if classification is fundamentally misguided.
      *   The precise relationship between intention, the act, and the consequence in ethical evaluation.
      *   The philosophical implications of merit transfer for agent-relativity.
      *   Whether the "good" in Buddhism is ultimately defined consequentially (cessation of dukkha) or by the nature of mind-states (purity, wisdom) themselves.
      *   How central nibbāna's "non-consequence" nature is to the ethical framework.

  ### Recommendation for Your Group

  1.  **Acknowledge the Terminological Impasse:** State clearly that "consequentialism" is a modern Western category and the debate is about whether it's a *useful* or *accurate* label, not about core Buddhist doctrines both sides largely agree on (intention, karma, compassion, etc.).
  2.  **Focus on the "Why":** For the next case study (like the Ship Captain), don't ask "Is this consequentialist?". Ask: "What, according to the text and tradition, *makes* this act skillful (kusala)? Is it primarily the captain's state of mind, the predicted outcomes, or both inherently linked? How would a purely bad-intentioned act with the same outcome be judged and why?"
  3.  **Explore the Nuances:** Discuss the points of circularity, intention vs. outcome, and merit transfer explicitly as *reasons why* the classification is difficult, rather than just arguing the label.
  4.  **Consider Dropping the Label (Temporarily):** Frame the discussion as "Understanding the Structure of Buddhist Ethical Evaluation" rather than "Is it X?".

  The debate feels stuck because both sides have valid points anchored in different interpretations of key concepts and different definitions of "consequentialism." Your hypothesis about agent-relativity being the core sticking point is astute. Moving forward requires acknowledging that while the label might be unresolvable, the *substance* of *why* it's unresolvable – the nature of karma, intention, skillfulness, and consequence – is where the real philosophical richness lies.
