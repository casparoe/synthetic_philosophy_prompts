prompt: |-
  I've been roped into a small working group at a coastal city's adaptation office, and the actual deliverable turns out to be one number: the discount rate we'll use to evaluate a sea wall (and the managed-retreat alternative) whose costs land over the next decade and whose benefits run out past 2150. People keep throwing figures at me — 5%, 3.5%, 1%, "use a declining schedule," "just use the municipal bond rate" — and each one gets defended by a paragraph I cant argue with, because I don't have a handle on what a discount rate is even supposed to *do*. So before I read anything else I want the spec. Write the desiderata: what any account of how to discount the future in social evaluation has to deliver to be usable for a decision like this one. For each requirement, give me the consideration or the concrete case behind it — what goes wrong if the rate makes a one-in-a-million chance of the whole city going under in 2200 worth less than a pothole repair today; what goes wrong if the same office ends up valuing an identical project differently depending on whether the review happens this year or in five; what goes wrong if we set the rate by asking actual people what they'd trade off, given that the people bearing the consequences aren't in the room and never will be; what goes wrong if we discount the loss of a neighborhood at a different rate than the loss of an equal number of dollars in tax base.

  Then sort them for me. Which requirements are non-negotiable — where a framework that fails them isn't a rival candidate, it's just a mistake — and which ones are really the taste of one camp dressed up as a criterion, the places where "the rate must be positive" or "must be anchored in markets" or "must be anchored in impartiality" is doing covert work and should be flagged as such. And this is the part I most want: if some subset of the requirements can't be jointly satisfied, say so out loud and say which one has to be given up. My own suspicion is that "hand me a single number I can put in the spreadsheet," "don't let the far future count as negligible," and "stay consistent over time so we don't reverse our own past decisions" don't all fit together, but I genuinely can't tell whether that's a real impossibility or just me not understanding what a declining-rate schedule buys you. If it's real, show me the collision; if it's me, show me where.

  Last thing: tell me which single requirement does the most work in knocking candidates out — the one that, once you insist on it, eliminates half the field on its own — and then briefly run the main contenders past the list. I mean the camps roughly like this: impatience is irrational so set that term to zero and let everything come from how much richer the future will be; use what markets reveal because public money has an opportunity cost and crowding out is the real constraint; the future is uncertain about its own growth, so the effective rate should fall as the horizon lengthens; and the whole aggregate-utility-over-time setup is the wrong frame for one-off irreversible choices and should be replaced by something else. No citations or reading lists please, I'm not writing a lit review and I can't chase them down anyway. I just want the criteria sharp enough that I can walk back into that meeting and say why 5% is a bad answer — or discover that it isn't.
reasoning: |-
  Okay, the user is part of a coastal city adaptation office working group tasked with determining a single discount rate for evaluating a sea wall project versus managed retreat. The costs occur over the next decade, while benefits extend beyond 2150. They're overwhelmed by conflicting suggestions (5%, 3.5%, 1%, declining schedule, municipal bond rate) and need to understand the core requirements for a valid discount rate framework. 

  First, I need to unpack why this is so messy. The user isn't just asking for definitions—they're drowning in technical arguments without anchors. Their frustration ("each one gets defended by a paragraph I can't argue with") reveals a deeper need: they want epistemological scaffolding to judge competing claims. The deliverables request is brilliant—forcing specs before solutions—but note their suspicion about irreconcilable tensions between consistency, far-future weight, and simplicity. That's the crux.

  Hmm... their examples reveal four pain points: intergenerational equity (pothole vs. city extinction), dynamic inconsistency (changing valuations over time), representation failure (absent future generations), and value homogeneity (dollar vs. neighborhood loss). These map to philosophical splits in discounting theory. 

  The real challenge is separating axioms from preferences. For instance, "must be positive" sounds technical but smuggles in ethical choices about time preference. Similarly, market-based rates imply efficiency over equity. I should flag where camps conflate values with mechanics.

  Key insight: the user's power move is demanding tradeoff transparency. When they say "if some subset can't be jointly satisfied, say so," they're anticipating triage. And they're right—simplicity, long-horizon significance, and consistency *are* incompatible under constant rates. Declining schedules fix this but violate their "single number" requirement. That collision needs explicit mapping.

  For knockout criteria, the far-future weight requirement (no Cathedral neglect) is brutal—it nixes high constant rates and pure market-based approaches. Growth-uncertainty models survive only with declining rates, which then struggle with consistency. The "no arbitrage" requirement kills purely normative rates detached from opportunity costs. 

  User's suspicion about 5% is justified—it fails catastrophically on long horizons—but 1% has dynamic inconsistency risks. The declining-rate camp offers salvation if they sacrifice spreadsheet simplicity. Sadly, there's no free lunch. 

  Final thought: their closing request to "walk back and say why 5% is bad" suggests they already lean low-rate but need armor. I'll structure the specs to make that case unavoidable while being honest about tradeoffs.
answer: |-
  Here's the spec – the core requirements any discount rate framework must meet for your coastal decision, why they matter, and how they clash:

  **The Non-Negotiable Desiderata (Fail These = Mistake):**

  1.  **No Arbitrary Time Discrimination ("Why care about 2200?"):**
      *   *What it does:* Ensures well-being (or costs/benefits measured consistently) at different times is valued fairly *solely* based on when it occurs. Rejects pure "impatience" as a *social* justification.
      *   *Why it's essential:* If you discount *only* because something happens later, a tiny current cost (pothole) outweighs a massive future catastrophe (city lost). This is ethically indefensible for intergenerational projects – future people count. A framework allowing this fails its core purpose.
      *   *What goes wrong:* The 1-in-a-million chance of losing the city in 2200 *is* treated as less important than fixing a pothole today if the rate is high enough. This makes long-term protection irrational under the analysis.

  2.  **Accounting for Opportunity Cost ("What else could we do?"):**
      *   *What it does:* Recognizes that public funds spent today have alternative uses. The discount rate should reflect the real societal return foregone by investing in *this* project instead of the next best alternative (or the cost of raising funds).
      *   *Why it's essential:* Public money isn't free. Using it for the sea wall means *not* using it for schools, hospitals, other infrastructure, or tax cuts. Ignoring this overvalues current spending.
      *   *What goes wrong:* If the discount rate is too low, projects with long-term benefits look artificially good compared to projects with immediate, high-return benefits (like education or preventative healthcare). This misallocates scarce resources.

  3.  **Intertemporal Consistency ("Don't reverse yourself in 5 years"):**
      *   *What it does:* Ensures identical costs and benefits occurring at the same *relative* future times (e.g., costs in 10 years, benefits in 100 years) are valued the same regardless of *when the decision is made*.
      *   *Why it's essential:* Prevents irrational flip-flopping and strategic manipulation. A project rejected today shouldn't become acceptable in 5 years just because the clock ticked, if the underlying facts (costs, benefits, technology, risks) are unchanged.
      *   *What goes wrong:* The office values the *identical* sea wall project differently in 2024 vs. 2029 simply because it's "closer," leading to inconsistent planning and potential for gaming the system ("wait 5 years to propose it").

  4.  **Value Homogeneity ("Neighborhoods vs. Dollars"):**
      *   *What it does:* Requires the *same* discount rate be applied to *all* costs and benefits measured in the same unit (typically monetary, but the principle holds for consistent well-being units).
      *   *Why it's essential:* Ensures internal consistency. Discounting reflects the *timing* of value, not the *type* of value. Applying different rates based on the nature of the cost/benefit is arbitrary and distorts choices.
      *   *What goes wrong:* Discounting the loss of a unique coastal neighborhood (measured in monetary equivalent value) at 1% but the loss of equivalent tax revenue at 3% arbitrarily biases the analysis against preserving the neighborhood, regardless of its actual social value.

  **The Contested/Weighted Desiderata (Where Camps Diverge):**

  5.  **Far-Future Significance ("Don't make 2200 negligible"):**
      *   *What it does:* Ensures events in the distant future (like post-2150 benefits or catastrophic risks) have meaningful weight in the current decision.
      *   *Why it's contested:* High constant rates (>2-3%) make impacts beyond 50-100 years negligible. Low/declining rates give them weight. This is fundamentally about **intergenerational equity** vs. **efficiency/opportunity cost**. Insisting on high weight for the far future often means accepting lower *average* returns or sacrificing some consistency.
      *   *What goes wrong (if ignored):* The analysis effectively ignores the very long-term benefits of protection (or costs of retreat), making managed retreat look artificially cheap and the sea wall artificially expensive. Existential risks vanish from the calculation.

  6.  **Anchoring Source ("Markets vs. Ethics vs. Uncertainty"):**
      *   *What it does:* Determines where the number comes from – observed market returns (bonds, investments), ethical principles (zero pure time preference), or models incorporating uncertainty.
      *   *Why it's contested:* This is the core battlefield. "Use markets" prioritizes observable opportunity cost but may undervalue the far future and embed current generation biases/impatience. "Zero pure time preference" prioritizes intergenerational equity but ignores the reality of investment returns and opportunity cost. "Model uncertainty" tries to reflect risks but adds complexity. This is where "taste" (prioritizing efficiency vs. equity vs. prudence) is dressed as methodology.
      *   *What goes wrong (if mismatched):* Using a pure market rate (e.g., 5% muni bond) might undervalue the far future catastrophically. Using a pure ethical rate (e.g., 1% based only on future wealth) might justify projects with unrealistically low returns compared to alternatives.

  7.  **Operational Simplicity ("One number for the spreadsheet"):**
      *   *What it does:* Favors a single, constant discount rate for ease of calculation, communication, and implementation.
      *   *Why it's contested:* Simplicity is practical but often conflicts with Far-Future Significance and sophisticated Anchoring Sources (like uncertainty models requiring declining rates). Declining schedules add complexity but address the "negligible far future" problem.
      *   *What goes wrong (if overly rigid):* Insisting on a single constant rate forces a trade-off between undervaluing the far future (high rate) or potential dynamic inconsistency/overvaluing distant projects with low certainty (low rate).

  **The Collisions & Trade-offs:**

  *   **The Big Trilemma:** You are absolutely right to suspect that **Operational Simplicity (One Number), Far-Future Significance (2200 Matters), and Intertemporal Consistency (Stay Consistent)** **cannot all be perfectly satisfied simultaneously with a constant discount rate.**
      *   *The Collision:* A constant low rate (e.g., 1-2%) satisfies Far-Future Significance but violates Intertemporal Consistency – the value assigned to a benefit in 2200 *today* is much higher than the value assigned to that *same* benefit in 2200 if you re-evaluate in 2120 using the same rate (because it's only 30 years away then, not 176). A constant high rate (e.g., 4-5%) satisfies Intertemporal Consistency but violates Far-Future Significance (2200 becomes negligible). A declining rate schedule fixes the Far-Future Significance problem *and* can be designed for approximate consistency, but it sacrifices Operational Simplicity (it's not one number, it's a formula/table).
      *   *What has to give:* Usually, **Operational Simplicity** is sacrificed (by adopting a declining schedule) to salvage Far-Future Significance and approximate Intertemporal Consistency. Sometimes Far-Future Significance is sacrificed (using a high constant rate) to keep Simplicity and Consistency. Sacrificing Consistency is generally seen as the least acceptable.

  *   **Knockout Requirement:** **Far-Future Significance** is the biggest eliminator. Insisting that costs/benefits beyond 100-150 years *must* have meaningful weight immediately knocks out:
      *   High constant rates (>~2.5%): They mathematically crush distant values.
      *   Pure market-based rates (often 4-7%): They are usually high for the above reason.
      *   Frameworks dismissing intergenerational equity: They often justify high rates.

  **Running the Camps Past the Spec:**

  1.  **"Impatience Irrational, Zero Pure Time Preference, Only Growth Discounting (e.g., 1-1.5%):"**
      *   *Aces:* No Arbitrary Time Discrimination, Far-Future Significance.
      *   *Fails:* Accounting for Opportunity Cost (ignores real market returns/crowding out), Intertemporal Consistency (with a constant low rate), Anchoring Source (rejects market evidence for ethical stance).
      *   *Verdict:* Strong on ethics/long-term, weak on realism/consistency/opportunity cost. Likely knocked out by Opportunity Cost requirement.

  2.  **"Use Market Returns (e.g., Municipal Bond Rate ~4-5%):"**
      *   *Aces:* Accounting for Opportunity Cost, Intertemporal Consistency, Operational Simplicity, Anchoring Source (observable).
      *   *Fails Catastrophically:* Far-Future Significance (2200 vanishes), arguably violates No Arbitrary Time Discrimination by embedding current impatience.
      *   *Verdict:* Strong on efficiency/consistency/simplicity, ethically bankrupt for long horizons. Knocked out by Far-Future Significance and arguably No Arbitrary Discrimination.

  3.  **"Uncertainty/Growth Models, Declining Rate (e.g., Starts ~3%, declines over centuries):"**
      *   *Aces:* Far-Future Significance, Accounting for Opportunity Cost (anchors near-term rate), No Arbitrary Discrimination (justifies decline via uncertainty, not pure time), Anchoring Source (sophisticated model).
      *   *Struggles:* Operational Simplicity (not one number), *perfect* Intertemporal Consistency (though designed for approximate consistency).
      *   *Verdict:* Addresses the core ethical/efficiency dilemma and the Trilemma (by sacrificing simplicity). Strongest contender if complexity is acceptable.

  4.  **"Wrong Frame, Use Risk/Precaution/Irreversibility (e.g., Min-Max, Safe Minimum Standard):"**
      *   *Aces:* Far-Future Significance (focuses on avoiding catastrophe), potentially handles Value Homogeneity if applied to outcomes.
      *   *Fails:* Operational Simplicity (not a discount rate), Accounting for Opportunity Cost (often ignores trade-offs explicitly), Intertemporal Consistency (hard to define), Anchoring Source (qualitative judgment). Doesn't provide "one number".
      *   *Verdict:* Useful perspective *alongside* discounting, especially for catastrophic tails. Doesn't fulfill the *discount rate* deliverable requirement. Knocked out by needing "one number" and quantifying trade-offs consistently.

  **Why 5% is Likely a Bad Answer (For This Decision):**

  1.  **Fails Far-Future Significance Catastrophically:** Benefits accruing beyond ~2080-2100 will have negligible present value. The primary justification for the sea wall *is* protecting against long-term, century-scale risks. 5% makes that protection look worthless today.
  2.  **Violates No Arbitrary Time Discrimination:** It heavily discounts simply because impacts happen later, implicitly valuing future generations far less than the present. This is hard to defend ethically for a 150+ year project.
  3.  **While it satisfies Opportunity Cost, Consistency, and Simplicity:** These strengths are overshadowed by its failure on the core ethical requirement (Far-Future Significance/No Arbitrary Discrimination) for *this specific type* of long-horizon, intergenerational investment.

  **What to Take Back:**

  *   **The Core Conflict:** You need a rate that respects the far future *and* opportunity costs. High constant rates fail the future; very low constant rates fail opportunity costs and consistency. **This is why declining schedules exist – they are the compromise.**
  *   **Knockout Argument:** "A 5% rate makes the primary benefit of this project – protecting the city decades and centuries from now – mathematically negligible in our analysis today. That fails our duty to future residents and ignores the catastrophic risks we're trying to mitigate. We need a framework where the long-term stakes actually register."
  *   **Push for:** A declining discount rate schedule. Argue that while slightly more complex than one number, it's the only way to seriously weigh the long-term future *and* respect near-term opportunity costs without creating time-inconsistency traps. Start near the muni bond rate (3-4%) for the first 30-50 years, then let it decline gradually towards 1-2% for centuries out. This balances the key requirements as well as possible.

  The discount rate isn't just a technical number; it's a profound ethical and economic choice about how we value the future. The specs show why "one size fits all" (especially a high rate) doesn't fit *this* problem.
