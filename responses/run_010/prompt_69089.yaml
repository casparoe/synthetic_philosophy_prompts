prompt: |-
  I'm in the second half of a medieval political thought survey — we've moved from Augustine and John of Salisbury into the thirteenth century, and this week's reading is Aquinas's *On Kingship* alongside his treatment of sedition in the second part of the *Summa Theologiae*. I have an essay due Thursday on whether Aquinas should be read as a theorist of resistance or as a quietist about established authority, and on the bus to seminar I listened to an episode of a history podcast whose host is a professional medievalist and who offered a fairly confident précis of Aquinas on tyrannicide. I wrote down his summary as faithfully as I could:

  > "Aquinas is the most important medieval theorist of tyrannicide, and his position is far more radical than people usually assume. His starting point is that kingship exists for the sake of the common good; a ruler who governs for his own profit and glory is a tyrant, and tyranny is not merely an inferior regime but a corrupt one, because it severs the bond that makes authority legitimate at all. Once that bond is severed, Aquinas holds, the ruler forfeits any claim to obedience, and he is quite prepared to countenance his removal by force — in *On Kingship*, the treatise he composed for the king of Cyprus, he argues that a man who has seized power over a reluctant people has no title to rule, so that whoever gets at him first commits no injustice. He adds a single qualification, and it's an instructive one: where the tyrant came to the throne lawfully, by inheritance rather than by usurpation, no human being may depose him, because a rightful king acknowledges no superior on earth and God alone is his judge. So in practice Aquinas permits tyrannicide against usurpers and forbids it against hereditary monarchs, which is why his politics are monarchist in everything but name. He does go on, in the second book, to sketch the machinery by which the leading men of the realm are to judge and remove a king who has turned tyrant. And in the *Summa* he insists that subjects who rise against a tyrant are not guilty of sedition, since sedition is properly the tyrant's own crime: he foments discord among his subjects so as to dominate them more securely. The Jesuits later took this doctrine and made it an instrument against princes, which is why the papacy eventually had to disown it and why official Catholic teaching became quietist for three centuries. Historically, Aquinas is the man who gave Europeans the idea of a right of resistance four centuries before Locke."

  Several things about this sit badly with what I remember from lecture, but I can't yet tell whether my memory or the host is at fault, and I'd rather not build an essay on a podcast. Could you go through it claim by claim and tell me what a specialist in Aquinas's political thought would accept, what she would regard as a defensible simplification, and what she would reject outright? Three points especially. First, on the central question of agency: does Aquinas anywhere license a private individual to kill a ruler, and if not, on whom does he confer the authority to act against a tyrant, and under what conditions? Second, on the asymmetry the host draws between a tyrant by usurpation and a tyrant by inheritance — is that distinction Aquinas's own, and if so, has the host stated it the right way round? I have a vague sense that Aquinas's discussion turns on something quite different, namely whether the community itself holds the right to provide its ruler, and that the "God alone can judge him" case arises in different circumstances than the host suggests, but I can't reconstruct the argument. Third, on the genealogy: is the line from Aquinas through the Jesuits to Locke right, or has the host imported into Aquinas a position that belongs to other authors? Our seminar also covered the Council of Constance and the tyrannicide articles examined there in connection with Jean Petit's defence of the Duke of Burgundy, and I think one of those articles was to the effect that killing a tyrant is licit *and meritorious*, by whatever means and without awaiting a judge's sentence — the host's framing reminded me of that, and I'd like to know whether the language he is putting into Aquinas's mouth is actually Aquinas's or belongs to that later controversy.

  Please don't give me a bibliography, a reading list, or page numbers, and don't reproduce quotations from the texts — paraphrase instead, since I have the translations in front of me and would rather check your reconstruction against them myself than trust a quotation. Where the host is extrapolating from something Aquinas genuinely does say, I'd like the genuine claim separated cleanly from the extrapolation; and if his conclusion about Aquinas as a proto-Lockean survives the corrections, tell me in what qualified form it might.
reasoning: |-
  Okay, the user is a student working on an essay about Aquinas's views on resistance and tyranny. They heard a podcast summary that they think might be inaccurate and want a specialist's perspective. Let me break this down.

  First, the user has three main concerns: agency (who can act against a tyrant), the distinction between usurpers and hereditary tyrants, and the historical lineage from Aquinas to Locke via the Jesuits. They also mention the Council of Constance and Jean Petit, so I need to address that connection.

  Looking at the podcast claims: The host presents Aquinas as permitting tyrannicide against usurpers but not hereditary tyrants. The user recalls Aquinas focusing on community consent and the right to provide a ruler, which is different. I remember that Aquinas does differentiate between usurpers and lawful rulers in *On Kingship*, but the host flips the reasoning. For usurpers, Aquinas says removal is justified because they never had legitimacy. For lawful rulers who become tyrants, Aquinas argues against private individuals acting but allows for public authority or the community to intervene. The host's version misses that nuance, implying only God can judge hereditary tyrants, which isn't accurate.

  On agency: Aquinas never licenses private individuals to kill a ruler. In *Summa Theologiae*, he states that killing a tyrant by private authority is sinful. Instead, he assigns the authority to a public body, like leading men or institutions representing the community. The user's memory aligns with this, so the podcast's claim about "whoever gets at him first" is incorrect.

  Regarding the historical lineage, the host links Aquinas directly to the Jesuits and then Locke. But Aquinas's position was more moderate. The Jesuits, like Mariana and Suárez, expanded on his ideas, justifying tyrannicide more broadly. The Council of Constance condemned Jean Petit's argument that killing a tyrant is meritorious without a sentence. Aquinas never went that far. The user is right to notice the similarity in language but correct in suspecting it's from later debates.

  The user might be worried about building their essay on a flawed source. They need clarity to avoid misrepresenting Aquinas. Their deeper need is to accurately portray Aquinas's views for their essay, distinguishing his ideas from later interpretations. They also want to understand the historical context without getting bogged down in citations, hence the request for paraphrasing.

  I should emphasize where the host oversimplifies: the agency point, the usurper vs. hereditary distinction, and the historical chain. Highlight that Aquinas's resistance theory is communal and procedural, not individualistic like Locke's. The user's essay could argue that Aquinas is a theorist of resistance but within strict bounds, not a quietist nor a radical proto-Lockean.
answer: |-
  Here's a claim-by-claim assessment of the podcast summary from the perspective of Aquinas scholarship, focusing on your three core questions:

  **1. Agency: Who can act against a tyrant?**
  *   **Podcast Claim:** Aquinas permits any individual ("whoever gets at him first") to kill a *usurping* tyrant and argues subjects rising against a tyrant are not guilty of sedition.
  *   **Specialist Assessment:**
      *   **Rejection:** Aquinas **nowhere licenses private individuals** to kill a ruler, usurper or otherwise. This is a critical misrepresentation.
      *   **Genuine Claim (On Kingship):** Against a *usurper* who seized power without consent and rules tyrannically, Aquinas argues that the individual who kills him commits no *injustice* (because the usurper has no rightful claim), but he **does not frame this as a positive right or license**. It's presented more as the usurper being an outlaw, lacking protection, rather than authorizing vigilantism.
      *   **Genuine Claim (Summa Theologiae - Sedition):** Aquinas defines sedition as sinful opposition to the *common good*. He argues that resistance to a tyrant **is not inherently seditious** *if* it is proportionate, avoids greater evils, and importantly, **proceeds from a legitimate public authority** ("public authority" or those acting on behalf of the community). He explicitly states that killing a tyrant by *private authority* is dangerous and sinful.
      *   **Genuine Claim (On Kingship - Hereditary Tyrant):** For a ruler who *lawfully* acquired power (e.g., inheritance) but then rules tyrannically, Aquinas **explicitly forbids private individuals** from acting. Authority to act lies with "public authority" or the community acting through its representative institutions (e.g., "leading men," estates, a superior authority like the Pope in certain interpretations).
      *   **Extrapolation:** The podcast host incorrectly infers a general license for individual action against usurpers from Aquinas's statement about the killer committing no injustice. Aquinas's consistent emphasis is on **procedural, public authority** for legitimate action against *any* tyrant. The "no sedition" point applies only to resistance *authorized* in this way.

  **2. The Usurper vs. Hereditary Tyrant Distinction:**
  *   **Podcast Claim:** Aquinas permits tyrannicide against usurpers but forbids it against hereditary monarchs because "God alone is his judge," making Aquinas effectively monarchist.
  *   **Specialist Assessment:**
      *   **Defensible Simplification (with major caveats):** Aquinas *does* distinguish between the two types of tyrants, particularly in *On Kingship*.
      *   **Genuine Claim:** The distinction hinges on the **origin of authority**. A *usurper* never had legitimate authority; he is essentially a criminal oppressor. A ruler who *lawfully* acquired authority (like a hereditary king) possesses that authority legitimately, even if he subsequently abuses it.
      *   **Host's Error (Reversal):** The host states "God alone is his judge" applies *only* to the hereditary tyrant. Aquinas's actual argument is broader: **No *human individual* is the rightful judge and executioner of *any* ruler.** The "God alone" principle underscores the ruler's legitimate *office*, established by God through natural/divine law, even if *this particular officeholder* is wicked. It's less about heredity specifically and more about lawful acquisition of office vs. theft of office.
      *   **Genuine Claim:** The crucial difference lies in **who possesses the authority to act**:
          *   Against a *usurper*: Authority reverts to the *community itself* (or God acting through circumstance), as the usurper violated the community's right to consent/establish rule. Hence, the killer commits no injustice *to the community*.
          *   Against a *lawful ruler turned tyrant*: Authority lies with **institutions *representing* the community** ("public authority," "leading men," estates) or a superior temporal/spiritual authority (like an Emperor or Pope, depending on context), acting *judicially* or through established constitutional means. They act *on behalf* of the community whose right to good government is being violated.
      *   **Rejection of Conclusion:** Calling Aquinas "monarchist in everything but name" based *only* on this distinction is misleading. His focus is on the *source* and *purpose* of authority (popular consent/divine origin for the common good), not hereditary monarchy per se as an inviolable principle. His mechanism for removing a hereditary tyrant is decidedly *not* quietist.

  **3. Genealogy: Aquinas -> Jesuits -> Locke?**
  *   **Podcast Claim:** Aquinas is the key medieval source for resistance theory; Jesuits directly used his doctrine against princes; this led to papal disavowal and centuries of Catholic quietism; Aquinas gave Europeans the idea of resistance 400 years before Locke.
  *   **Specialist Assessment:**
      *   **Defensible Simplification (with heavy qualification):** Aquinas *was* a crucial source for later resistance theorists, including the Jesuits and Locke. His principles (common good as legitimacy's source, tyranny as unjust, distinction between usurper/abuser, role for community/public authority) provided foundational language and concepts.
      *   **Genuine Claim:** Later thinkers (Jesuits like Mariana, Suárez, Calvinists like Beza, Monarchomachs) **radically extrapolated** from Aquinas, particularly by:
          *   Downplaying his strictures against *private* action and emphasizing the "no injustice" point against usurpers.
          *   Expanding the definition of tyranny and the mechanisms for resistance (e.g., lesser magistrates).
          *   Making resistance (including tyrannicide) seem more like a positive individual or collective *right* rather than a last-resort act justified only under strict conditions by public authority.
      *   **Host's Error (Conflation):** The host puts **later Jesuit doctrines (and even the Council of Constance condemnation)** *into Aquinas's mouth*. Aquinas *never* says tyrannicide is "licit *and meritorious*" without a judge's sentence – that language is pure Jean Petit/Council of Constance. Aquinas's conditions are far stricter. The Jesuits developed a *more radical* doctrine *inspired by* but *exceeding* Aquinas, leading to papal condemnation (notably of *regicide*, not Aquinas per se).
      *   **Rejection of Linearity:** Calling Aquinas "the man who gave Europeans the idea" oversimplifies. Resistance ideas existed before Aquinas (e.g., John of Salisbury's very cautious allowance, canon law, feudal contracts). Aquinas systematized principles but within a framework prioritizing order and legitimate procedure. Locke's theory, while drawing on medieval sources including Aquinas, is distinct in its social contract foundation and individual rights focus. Aquinas is a *significant precursor*, but not the *sole originator* of a directly transmitted "Lockean" right.

  **Conclusion on Aquinas as Theorist of Resistance vs. Quietist:**

  *   **Rejection of Quietism:** Aquinas is decidedly **not a quietist**. He provides a clear theoretical basis for resisting tyranny:
      1.  Legitimacy is conditional on the common good.
      2.  Tyranny is unjust rule, severing legitimacy.
      3.  Sedition doesn't apply to legitimate resistance.
      4.  Mechanisms exist (public authority, community representatives) for judgment and removal, even of a lawfully installed king-turned-tyrant.
      5.  Usurpers have no claim to obedience or protection.
  *   **Rejection of Radical/Proto-Lockean Resistance Theorist:** He is **not a proto-Lockean** theorist of individual/collective *rights* to revolution.
      1.  He **adamantly rejects private tyrannicide**.
      2.  Resistance must be authorized by **public, representative, or superior authority** acting judicially/constitutionally.
      3.  His framework prioritizes **order, legitimacy of office, and procedure** over revolutionary action.
      4.  His "resistance" is **corrective/protective**, aimed at restoring rightful authority/good governance, not founding government anew on popular consent like Locke.
  *   **Qualified Survival:** Aquinas survives as a **"qualified proceduralist theorist of resistance."** He provides a powerful *justification* for resisting tyranny rooted in natural law and the purpose of government, but strictly *channels* that resistance through established or emergent *public authority* acting for the common good, rejecting individual vigilantism. He stands between the more cautious earlier medieval thinkers and the more radical theorists of the late medieval and early modern periods who pushed his principles further than he intended. His influence on later resistance thought is undeniable, but it was mediated through interpretations that often amplified elements he stated cautiously and downplayed his procedural safeguards.
