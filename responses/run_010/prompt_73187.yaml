answer: |-
  ## Swiss Federal Voting Booklet (Parody Edition)

  **Federal Vote: 28 November 2023**

  **1. Die Vorlage auf einen Blick**

  *   **You are voting on:** The popular initiative ‘For the sovereign final decision (Schlusspunkt-Initiative)’.
  *   **Proposal:** The initiative seeks to amend the Federal Constitution to abolish the right of popular initiative.
  *   **Recommendation of the Federal Council and Parliament:** Rejection.
  *   **Counter-proposal:** Yes. A direct counter-proposal (Gegenentwurf) is submitted by the Federal Assembly.
  *   **Tie-break question (Stichfrage):** Yes. If both the initiative and the counter-proposal are accepted, the Stichfrage determines which text enters into force.
  *   **Majority required:** Double majority of the People and the Cantons (Ständemehr).

  **2. Text der Initiative**

  The Federal Constitution is amended as follows:

  **Art. 138 (new) Abolition of the Popular Initiative**
  1.  The right to launch a popular initiative for the partial or total revision of the Federal Constitution, as stipulated in Articles 138 to 142 of the Federal Constitution of 18 April 1999, is hereby abolished.
  2.  No new popular initiatives may be submitted after the acceptance of this article. Existing initiative committees formed prior to the acceptance of this article have their mandates terminated upon acceptance.
  3.  *Transitional Provision:* All popular initiatives submitted to the Federal Chancellery prior to the acceptance of this article, but which have not yet been put to a popular vote, are declared null and void. Any signatures collected for such initiatives lose all legal validity.

  **3. Die Argumente des Bundesrates**

  The Federal Council recognises the sovereign right of the People to decide on their own instruments of direct democracy. The initiative meets the requirements of unity of form and subject matter, and does not conflict with peremptory norms of international law. Therefore, it must be put to a popular vote.

  However, the Federal Council recommends rejecting the initiative for the following reasons:

  The popular initiative is a cornerstone of Swiss democracy, enshrined in the Constitution since 1891. It provides citizens with a vital means to directly influence the constitutional framework. Its abolition would represent a fundamental shift in the relationship between the People and the State, concentrating constitutional amendment power solely within the Federal Assembly. While the initiative process faces challenges, such as perceived complexity or its use for strategic political purposes, these are inherent to a dynamic democracy and do not warrant the instrument's complete elimination. Alternative solutions, like procedural refinements, remain preferable.

  The Federal Council acknowledges the initiators' stated concerns regarding parliamentary counter-proposals potentially diluting original initiative goals, and the resource-intensive nature of modern initiative campaigns. Nevertheless, the counter-proposal mechanism serves to find broadly acceptable solutions, and vibrant political debate, even if costly, is a sign of a healthy democracy. Abolishing the initiative right does not solve underlying issues of political discourse; it removes a fundamental democratic safety valve.

  *Cost Estimate:* The abolition of the popular initiative would eliminate all direct costs associated with processing and voting on future initiatives (drafting federal reports, signature verification, ballot printing, information campaigns). Estimated annual savings: CHF 7.5 - 12 million. Indirect costs related to parliamentary deliberation on initiatives would also cease. Concurrently, the abolition would result in a one-time cost of approximately CHF 1.2 million for the necessary legal and administrative adjustments to remove all references to the initiative process from federal and cantonal legislation and official documentation. The net fiscal impact is therefore projected to be savings of CHF 0 (zero) over a ten-year period, due to the offsetting nature of the costs and savings within the complex framework of governmental operations.

  **4. Stellungnahme des Initiativkomitees**

  The People are sovereign. This sovereignty must include the right to decide definitively on the tools they use. The popular initiative, intended as the People's direct voice, has been systematically weakened. Parliament routinely waters down clear popular mandates through counter-proposals, turning bold ideas into bureaucratic compromises. The process has been captured by well-funded parties and interest groups, using initiatives not for genuine governance but as perpetual campaign tools, clogging the system and confusing voters. True sovereignty means having the final word. This initiative embodies that principle: the People, exercising their ultimate authority, choose to conclude the initiative era. It is the logical, sovereign endpoint: the People decide to trust their elected representatives fully for constitutional development, ending a process that no longer serves its original, pure democratic purpose. Vote Yes for the sovereign Final Word.

  **5. Direkter Gegenentwurf und Stichfrage**

  Recognising the concerns about participation and legitimacy, the Federal Assembly proposes a direct counter-proposal (Gegenentwurf) to the initiative. The counter-proposal retains the popular initiative but introduces a new constitutional article:

  **Art. 139 (new) Mandatory Participation in Initiative Votes**
  1.  Every Swiss citizen eligible to vote is obliged to participate in popular votes concerning federal popular initiatives and counter-proposals.
  2.  The Federal Assembly shall enact implementing legislation, including appropriate measures to ensure compliance and minor sanctions for non-participation without valid excuse.

  If both the Schlusspunkt-Initiative and the Federal Assembly's counter-proposal are accepted by the People and the Cantons, the Stichfrage determines which text enters into force:

  *   *Question:* Which proposal should enter into force?
      *   The Popular Initiative ‘For the sovereign final decision (Schlusspunkt-Initiative)’?
      *   The Federal Assembly’s counter-proposal?

  **6. What I was actually satirising**

  This parody exaggerates several real, recognizable features of the Swiss initiative system and its discourse:

  1.  **Self-Defeating Democratic Logic:** Real initiatives often weaponize democratic principles against existing democratic structures (e.g., initiatives targeting human rights or international law based on "popular will"). This satire pushes that logic to its extreme: an initiative abolishing initiatives itself, justified *using* the very rhetoric ("sovereign people", "final word", "parliament dilutes") employed by real initiative proponents. The specialist recognizes the uncomfortable tension where direct democracy can be used to curtail itself.
  2.  **Government's Procedural Straightjacket & Evasion:** The Bundesrat section mirrors the real constraints. They *cannot* invalidate an initiative simply because it's politically abhorrent or self-contradictory, only on strict formal grounds (form, subject matter, *jus cogens*). This forces them into awkward positions, recommending rejection while being legally compelled to admit the initiative is valid, often resorting to vague appeals to tradition or "spirit of the constitution" rather than confronting the radical core head-on. The absurd cost estimate (net savings CHF 0) satirizes the bureaucratic necessity to quantify everything, even when meaningless, and highlights the government's struggle to find concrete "rational" arguments against a fundamentally political/ideological proposal.
  3.  **The Quietly Horrible Transitional Clause:** Real initiatives often bury radical or problematic details in transitional provisions (Übergangsbestimmungen). Here, the clause retroactively killing all pending initiatives (and invalidating collected signatures) is presented with typical legalistic blandness. Specialists know these clauses frequently contain the most legally contentious or far-reaching elements, slipped past voters focused on the main articles. The Stichfrage between abolition and mandatory voting is also a satirical nod to parliament's tendency to offer counter-proposals that attempt to "solve" perceived initiative problems by adding *more* democracy (or compulsion) in complex, often unworkable ways.
