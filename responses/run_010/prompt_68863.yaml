  The story could open with Arden observing Silas during a test where his printer "malfunctions." He methodically goes through his steps: checking cables, rebooting, calling helpdesk. She's impressed until she notices the pattern. Later tests reveal the same sequence - when his login fails, when a form disappears. Her growing realization should mirror what I want readers to experience.

  For the ending... perhaps during a power outage test, Silas begins his routine but stops at step three. He stands frozen in the dark. Arden then finds herself reflexively reaching for her scoring tablet despite the blackout. That final image - two humans paralyzed in different ways - leaves the question hanging. Are we ever truly off-script? The wasp parallel remains unspoken but palpable.

  Key details to include: 
  - The testing scenarios should feel authentic (printer jam, login issue, etc.)
  - Show Silas's checklist through Arden's observations, not exposition
  - Use workplace lighting/sounds to create atmosphere
  - Keep dialogue minimal and functional
  - Never mention wasps directly, but maybe have a flickering fluorescent light that buzzes

  This approach satisfies all requirements: it's a human story about workplace behavior, shows rather than tells the patterns, leaves the central question open, and subtly implicates the reader. The power outage ending creates the perfect ambiguous moment where both characters are stuck in their loops.
answer: |-
  ## Threshold Check

  Arden’s job was disruption. Officially, she was a "Procedural Resilience Analyst" for Veridian Metrics. Unofficially, she was the corporate equivalent of a mischievous poltergeist, paid to introduce small, absurd glitches into the meticulously oiled gears of workplace routine.

  Today’s target: Silas Vance, Accounts Receivable. Silas was legendary in Veridian’s resilience logs. Three years. Thirty-seven randomized tests. Thirty-seven perfect scores. While others froze, fumed, or futilely rebooted irrelevant systems, Silas navigated Arden’s manufactured chaos with unnerving calm. He was her white whale, his unflappability a quiet challenge.

  Arden watched from a nondescript service room, feeds split between Silas’s workstation camera and the hallway outside. Her toolbox today was simple: a modified access badge reader for the secure document printer and a remote trigger for a minor power flicker. Standard fare.

  She initiated Phase One. Silas, engrossed in reconciling a complex invoice batch, reached for the secure printer. His badge swipe produced only a harsh red light and a flat, digital *bleep*. Arden leaned forward. Here came the freeze, the frown, the flailing.

  Silas didn't freeze. He frowned, yes, a brief tightening at the corners of his eyes. Then:

  1.  **Check:** He rotated the badge, wiped it meticulously on his sleeve, tried again. *Bleep*.
  2.  **Consult:** He pulled up the internal IT portal on his secondary monitor, scanned the known issues log. Nothing listed for badge readers.
  3.  **Call:** He picked up his desk phone, dialed the three-digit helpdesk extension. "Hi, Moira. Silas Vance, A/R. Secure printer badge reader in Quadrant C failing. Just tried mine, clean swipe. Known issue?" He listened, nodded. "Understood. Thanks." He hung up. Moira, Arden knew, would report no known issues.
  4.  **Delegate/Verify:** Silas stood, walked briskly to Carol’s desk two pods over. "Carol, quick favor? Can you try printing that Bates report to Secure C? Just see if it takes your badge?" Carol complied. *Bleep*. Silas thanked her, his expression thoughtful.
  5.  **Manual Override/Record:** Back at his desk, Silas opened a specific incident template on his screen. He typed: *"14:17: Secure Printer C - Badge reader failure. Multiple badges tested (Vance, Carol L.). IT Helpdesk contacted - no known issues. Recommend physical inspection/reader replacement."* He saved it, flagged it as "Medium Priority."
  6.  **Workaround:** Silas navigated to the network drive, found the shared "TEMP_PRINT" folder designated for non-secure urgent jobs. He queued his document there.

  Arden scored him: 100%. Flawless. He’d identified the problem, sought information, escalated appropriately, documented the issue, and implemented a temporary solution without halting his core task. Textbook resilience.

  But something nagged. The sequence. It felt... rehearsed. Too linear. She pulled Silas’s historical test files. Test #22: Sudden network outage. Silas: 1) Checked physical Ethernet connection. 2) Rebooted PC. 3) Verified outage via internal comms app. 4) Switched to offline documentation for current task. 5) Logged incident.

  Test #15: Critical form template vanished from shared drive. Silas: 1) Refreshed drive, checked recycle bin. 2) Checked version history logs. 3) Emailed original form creator. 4) Retrieved personal archived copy from his meticulously organized cloud backup. 5) Logged incident.

  The steps varied slightly depending on the malfunction, but the *structure* was rigid. Identify, Consult (either system or person), Escalate/Verify, Document, Implement Workaround. Always in that order. Never a leap to step four if step one seemed promising. Never an exasperated sigh followed by a creative end-run around protocol. Just... procedure.

  Arden designed the next test specifically to probe the sequence. She targeted Silas’s monthly regulatory compliance report – a beast of a task requiring specific data pulled from three different legacy systems. Mid-way through his data collation, she triggered her remote command. Silas’s primary monitor flickered, then displayed only a stark blue error screen: **"SYSTEM 7B ERROR: DATA CORRUPTION DETECTED. REVERT TO LAST STABLE SNAPSHOT? (Y/N)"**

  Arden held her breath. This was a genuine-looking, deeply alarming error. Would he panic? Try random fixes?

  Silas leaned back, steepled his fingers for exactly three seconds. Then:

  1.  **Check:** He pressed 'N'. The screen remained blue. He tried Ctrl+Alt+Del. No response.
  2.  **Consult:** He pulled out a small, leather-bound notebook from his top drawer. Arden zoomed the camera. Neat handwriting filled the pages. Silas flipped to a tabbed section titled "Critical Sys Errors." He scanned, found "7B Series." A note read: *"Typically display driver or RAM conflict. Rarely data loss. Standard restart ineffective."*
  3.  **Call:** He picked up the phone. "Moira. Silas again. System 7B error on primary workstation. Hard lock. Consulted personal log – points to hardware conflict. Requesting forced remote reboot and diagnostic run." He listened. "Understood. Ten minutes." He hung up.
  4.  **Delegate/Verify:** He stood, walked not to a colleague, but to the small departmental server rack humming in the corner. He checked indicator lights, pressed a physical reset button Arden hadn't known existed. Nothing changed. He nodded, as if confirming an expected outcome.
  5.  **Document:** He returned to his desk, opened the incident template on his secondary (still functional) monitor. *"15:08: Primary workstation - SYSTEM 7B error, hard lock. Personal log consulted (indicates likely hardware conflict). IT Helpdesk contacted - remote reboot/diagnostic initiated. Physical reset attempted on local server node - no effect."*
  6.  **Workaround:** Silas picked up a tablet from his desk, logged into the secondary system access portal, and resumed collating his compliance data. Slower, but functional.

  Another 100%. Arden felt a chill that had nothing to do with the server room’s AC. His resilience wasn't adaptability; it was a deeper, more complex routine. A meticulously ranked and indexed list of fallback moves. The ultimate script to handle deviations from the script. He passed *because* he couldn't leave his sequence. He just had a very, very long sequence.

  The final test was born of frustration and a creeping dread. It wasn't about a specific task, but about the foundation of all tasks: power. Arden coordinated with Facilities for a scheduled, but unannounced-to-departments, brief power interruption to Quadrant C. Five seconds. Just enough to kill every screen and hum.

  She watched Silas as the clock ticked towards the cut-off. He was proofreading the compliance report on his tablet. 3:00 PM. The lights died. The quiet electronic hum vanished, replaced by the sudden silence of stalled machinery and soft gasps from the pod. Emergency lights flickered on, casting long, dim shadows.

  Silas sat perfectly still in the gloom for a heartbeat. Then, muscle memory engaged:

  1.  **Check:** He pressed the tablet's power button. It was already on, but dark. He pressed it again, held it. The tablet remained inert, its battery drained by the sudden cut-off? Or simply unresponsive? *Unclear cause.*
  2.  **Consult:** His hand went to his jacket pocket. Did he carry a physical copy of his error log? No. He patted his desk, found the leather notebook. He flipped it open, but the emergency lights were too dim. He couldn't read it. *Information unavailable.*
  3.  **Call:** He reached for his desk phone. Dead. No dial tone. *Communication channel down.*
  4.  **Delegate/Verify:** He stood up, looking towards Carol’s pod. Carol was trying to reboot her PC. Others were milling in confusion. Silas took a step towards the main aisle, then stopped. Verify *what*? That the power was out? Everyone knew. Who to delegate *to*? *Context insufficient.*
  5.  **Document:** He half-turned back to his desk, towards his secondary monitor. Utterly dark. *Documentation system offline.*
  6.  **Workaround:** He looked down at the dark tablet in his hand. He pressed the power button again, uselessly. His gaze swept his desk – pen, paper, the useless devices. What workaround existed for *this*? The report wasn't urgent until tomorrow. But the sequence demanded a workaround.

  He stood frozen. Not panicked, but paralyzed. His head turned slowly, taking in the dim, disrupted office, his colleagues' murmurs sounding strangely distant. The sequence had hit a dead end. No predefined box to check for "total systemic collapse of primary and secondary systems with no immediate recovery path." His flawless procedure offered no guidance here, at the absolute threshold of the expected.

  Arden watched him, this monument to controlled response, stranded in the half-light. Her scoring tablet, its battery independent, glowed softly in her hands. Her finger hovered over the "Response" field: *"0 - Task Abandoned / System Failure."* It was the only logical score.

  But before she could tap it, she paused. Her *own* script demanded she record the observation immediately. Protocol was clear: log the subject's reaction within 60 seconds of the disruption ending. The power was still out. The disruption wasn't technically over. Her finger trembled.

  *Log it now?* But the power might come back, changing the context. *Wait?* But the 60-second window might close. Her internal flowchart stuttered. Check the manual? It was on her dead laptop. Consult her supervisor? Her phone had no signal in the shielded room. Delegate? No one else was watching Silas right now.

  She stood in her dark observation room, tablet glowing like a tiny, demanding star, her finger hovering. Silas stood frozen in the dim pod, the dark tablet forgotten in his hand, staring into the shadows where his next step should be. The emergency lights buzzed, a thin, persistent sound in the sudden, shared stillness. Neither moved. The hum was the only sound, filling the space where action, any action, should have been.
