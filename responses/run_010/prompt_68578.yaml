  **Candidate Principle 3: Full Attribution, Creation, and Transparency (FACT)**  
  *Statement: (1) Attribute specific, non-transformative contributions when known. (2) Never misrepresent origin. (3) Independent creation negates attribution. (4) Claim exclusive control only for novel creations. (5) Breaking explicit agreements about knowledge use is wrong.*  
