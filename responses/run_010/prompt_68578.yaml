  ### Discussion

  Your cases reveal a nuanced moral landscape where traditional notions of intellectual property often clash with intuitions about fairness, attribution, and the nature of creation. Your tentative model—linking claims to causal necessity and value survival—captures cases like 4 and 11 by distinguishing between discovery and creation, but it stumbles on 2, 5, and 12 because it overlooks independent creation, the special status of abstract ideas, and the role of deception. A robust principle must handle attribution without conflating it with ownership, distinguish creation from discovery, and prioritize transparency.

  I propose three candidate principles, each derived from patterns in your verdicts. All emphasize mechanical application: a third party could apply them to novel cases by following the stated conditions without interpretation. For clarity, "specific contribution" means an idea, expression, or method that is concretely identifiable (e.g., a particular experiment, musical performance, or written description), not abstract patterns or styles. "Transformative use" alters the contribution so significantly that its original form or purpose is unrecognizable.

  **Candidate Principle 1: Attribution and Transparency (AT)**  
  *Statement: When an agent uses a specific contribution from another agent, they must provide clear attribution if the use is non-transformative and they know the source. It is always wrong to misrepresent a contribution’s origin, regardless of transformation. Independent creation (no access to the original) negates attribution obligations.*  
  - **Clauses and motivations**:  
    - Attribution for non-transformative use: Motivated by cases 1 (postdoc’s idea used verbatim), 10 (dinner idea built directly), and 7 (tribute album re-recording is non-transformative; attribution makes it acceptable).  
