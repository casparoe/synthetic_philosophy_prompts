  **Candidate Principle 2: Creation-Based Ownership (CBO)**  
  *Statement: Exclusive control (e.g., patents, copyright) can only be claimed over novel creations—things brought into existence through labor that did not exist before. Discoveries of pre-existing things (natural phenomena, abstract ideas) cannot be owned, even with labor. This does not affect attribution or deception rules.*  
