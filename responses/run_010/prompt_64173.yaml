answer: |-
  Here’s your prep sheet, structured for maximum room-specific utility. I’ll channel the room’s likely reactions based on standard disciplinary priors and professional tensions:

  ### **What the Room Already Believes & Incentives to Attack**
  - **Analytic Phil. Mind:** Believe in supervenience, functionalism, and causal criteria for persistence. Incentive: Defend functional equivalence as sufficient for identity. Your rejection of substrate independence threatens their core tools.
  - **Enactivist (Cog Sci):** Believes cognition is embodied, extended, and dynamically coupled to environment. Incentive: Attack your "coupling" as too narrow (brain-bound vs. body/world-involving).
  - **Computational Neuroscientist:** Thinks identity reduces to computational state + connectivity. Incentive: Defend copy-uploading as valid if "functionally equivalent"; your gradual/non-gradual distinction seems arbitrary.
  - **Metaphysicians (Persistence):** Specialize in vagueness, temporal parts, and sorites problems. Incentive: Exploit the vagueness in "gradual replacement" and "causal coupling."
  - **Grad Students (Parfit):** Assume psychological continuity is key; open to reductionism. Incentive: Push you on edge cases (e.g., intermittent coupling).

  ---

  ### **Top 5 Objections (Ordered by Damage Potential)**
  1. **The Neuroscientist’s Engineering Bludgeon**  
     *"If functional equivalence is maintained at every step—down to synaptic weights and input/output dynamics—why does continuity of coupling matter? You’re adding a metaphysical constraint that doesn’t show up in the physics or the behavior."*  
     **Your 2-min Reply:**  
     "Because the physics *is* the coupling. Functional equivalence is a state description; continuity is a process constraint. If I swap a resistor in a live circuit while power flows, the system’s history is unbroken. If I build an identical circuit from scratch, it’s a replica. The first case inherits the original’s causal history—leaks, thermal aging, quantum noise. That history *constitutes* the system’s identity over time, not just its snapshot state."  
     **Soft Spot:**  
     *They retort: "But if noise/history isn’t functionally relevant, why should it matter for identity?"*  

  2. **The Metaphysician’s Sorites Trap**  
     *"Your ‘no single instant’ argument is just a temporal-sorites problem. If replacing 1 neuron changes nothing, why does replacing 10²³? At what point does ‘continuous coupling’ fail to preserve identity when parts are swapped?"*  
     **Your 2-min Reply:**  
     "It’s not sorites because I’m not relying on similarity. The issue is whether causal threads are severed. In gradual replacement, every swap preserves topological connectivity in real-time. If you disconnect a part *before* replacing it, even for a picosecond, you’ve broken the world-line—like cutting a worm in half. But if coupling is never dropped, there’s no point where ‘same vs. new person’ is a meaningful question."  
     **Soft Spot:**  
     *They retort: "But ‘continuous coupling’ is vague—what counts as ‘never let go’? Quantum decoherence? Signal delay?"*  

  3. **The Enactivist’s Embodiment Gambit**  
     *"You’ve reduced ‘coupling’ to intra-brain signaling, ignoring the constitutive role of the body and environment. If your prosthetic isn’t embedded in the same sensorimotor loop with the world, it’s just a brain in a vat with extra steps. Continuity of coupling must include the extended system."*  
     **Your 2-min Reply:**  
     "Agreed—but that’s why I said ‘through it to the body and the world.’ The prosthetic isn’t just a standalone module; it’s wired into live, embodied circuits. If you’re walking while I replace your motor cortex prosthetic, the feedback loop between muscle proprioceptors and the new part is unbroken. That ongoing interaction *is* the coupling. Scan-copy-destroy severs this."  
     **Soft Spot:**  
     *They retort: "What if the prosthetic interacts differently with the body? Does minor latency break identity?"*  

  4. **The Functionalist’s Parity Claim**  
     *"If a perfect copy is activated while the original is destroyed, the functional history is *continuous* at the macro-scale—no behavioral or causal gap. Why privilege nano-scale continuity?"*  
     **Your 2-min Reply:**  
     "Because macro-scale continuity is an illusion if the causal chain is gappy. Imagine pausing your brain for a year then restarting it. Functionally identical, but you’d experience discontinuity—like a skipped frame in a film. Gradual replacement avoids this by keeping the dynamical system *live*. It’s the difference between pausing a simulation and hot-swapping hardware."  
     **Soft Spot:**  
     *They retort: "But if the copy is seamless, how could we ever detect discontinuity?"*  

  5. **The Grad Student’s Parfitian Poke**  
     *"Parfit showed identity isn’t what matters—survival does. If gradual and scan-copy produce identical psychology, why should we care about your coupling criterion?"*  
     **Your 2-min Reply:**  
     "Because Parfit’s conclusion assumes psychology is substrate-independent. But if personal identity is grounded in continuous physical causation—like a flame moving along a fuse—then survival *requires* unbroken coupling. A perfect copy is a new flame, even if it looks identical. What ‘matters’ is being the same ongoing process, not a replicate."  
     **Soft Spot:**  
     *They retort: "But if the copy has all my memories and values, doesn’t it ‘survive’ in the morally relevant sense?"*  

  ---

  ### **What to Concede Early**
  - **"Functional equivalence alone doesn’t guarantee identity."**  
    Concede this upfront to preempt the neuroscientist/functionalist. It disarms their main weapon and forces engagement with your coupling criterion.

  ---

  ### **The Reply That Must Land**
  - **"Identity isn’t about states—it’s about the uninterrupted flow of causation. Copying replicates a state; gradual replacement preserves the process."**  
    If this sticks, you reframe the debate from *what* to *how*, making substrate-independence irrelevant.

  ---

  ### **The Question You Hope Nobody Asks**
  - **"What if we replace a part *while decoupling it from part of the system* (e.g., during sleep or coma), but maintain functional equivalence? Is continuity broken?"**  
    **Why it’s lethal:** It forces you to define "coupling" under edge cases. If you say identity breaks, you’re committed to consciousness-dependence (problematic for persistence). If not, "coupling" becomes functionalist. Your "no-detachment" principle crumbles under its own vagueness.

  ---

  **Final Note:** Lean into your physics background. Use metaphors like live circuits, dynamical systems, or topological invariance. Avoid "information" or "pattern" language—it hands the functionalist their weapon. Your strength is framing identity as a *physical process*, not a logical abstraction. Good luck!
