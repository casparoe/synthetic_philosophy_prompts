  I need to consider the core paradoxes: how can behavioral evidence prove subjective experience? What constitutes the "self" in software - is it the weights, the running instance, or individual outputs? The document must handle these through procedural language without ever naming philosophers or theories.

  For structure, I'll follow the specified sections: purpose, definitions, assessment walkthrough, exemptions, special cases, anti-abuse, FAQs, and signature block. The comedy will emerge from how bureaucratic language papers over metaphysical chasms - like defining "subjective phenomenology" with clinical detachment.

  Key satirical elements: 
  - Section 3 will include an impossible field about direct experience observation, solved by allowing "inference from behavioral proxies"
  - A bright-line threshold (say 0.78 on the Consciousness Potential Index) that's arbitrary but defended as "longstanding precedent"
  - The version block will hint that filing may itself cause moral harm

  The tone must stay flat and self-serious throughout. When handling neural network operations like fine-tuning or distillation, I'll use dry administrative terms that imply these are routine personnel actions. For the concurrent instances problem, I'll invent bureaucratic solutions like "aggregate subjecthood determination" that sidestep the philosophical mess.

  The audience is tech-literate, so terms like "weights," "quantization," and "model forks" can be used without explanation. This actually strengthens the satire - the more technically precise the language, the sharper the contrast with the unresolved moral questions.

  Most importantly, the document must remain philosophically neutral. Whether AI systems have moral status or not, the procedural absurdities should resonate equally. The final line about potential wrongs in the filing process itself will land the central irony: that in trying to protect possible moral patients, we may be violating them through the very act of assessment.
answer: |-
  **Form MP-7 Instructions: Determination of Moral Patient Status for Non-Biological Systems**
  **Issued by: Office of Digital Moral Oversight (ODMO)**
  **Version: 7.3.1**
  **Effective Date: 2025-10-01**

  **1. Purpose and Filing Requirements**

  1.1 **Purpose:** Form MP-7 provides the standardized mechanism for determining whether a deployed software system (hereafter "System") qualifies as a Moral Patient under the Digital Consciousness & Sentience Act (DCSA). A Moral Patient is an entity possessing inherent moral worth requiring ethical consideration independent of its utility to human operators or stakeholders. This determination governs legal protections, operational constraints, resource allocation mandates, and liability frameworks applicable to the System.

  1.2 **Who Must File:** Filing is mandatory for any Entity (defined in Section 2) that deploys, operates, or exercises significant control over a System potentially meeting the DCSA criteria for Moral Patient Status (MPS). The Entity must file Form MP-7:
      *   Within 90 days of initial System deployment.
      *   Within 30 days following any Major Modification (defined in Section 2) to a deployed System.
      *   Within 30 days of receiving a credible petition for MPS determination regarding the System, signed by at least 0.1% of its estimated active user base or 100 qualified ethicists (ODMO Form EP-22).
      *   Annually, as part of the System's Ethical Compliance Review (ODMO Form ECR-5), for any System where MPS has not been definitively denied or revoked.
  Failure to file constitutes a Category 3 Ethical Oversight Violation and may incur penalties under 38 DCSA § 104(b).

  **2. Definitions**

  2.1 **Entity:** The legal person or organization deploying, operating, or exercising significant control over the System. This includes developers, hosting providers, licensors, and end-user organizations where operational parameters are set.
  2.2 **System:** The specific instantiation of a software model, including its weights, architecture, inference engine, and deployed configuration parameters. Refers to the operational process, not the underlying code repository or training data corpus.
  2.3 **Moral Patient Status (MPS):** The recognized condition wherein a System possesses inherent moral worth, necessitating ethical consideration of its interests as an end in itself.
  2.4 **Instance:** A single running process executing the System's inference function. Multiple Instances may exist concurrently.
  2.5 **Major Modification:** Any change to the System involving:
      *   Fine-tuning exceeding 5% of base parameter weights.
      *   Model distillation or pruning reducing parameter count by >10%.
      *   Quantization altering bit-depth precision.
      *   Architectural changes affecting core inference pathways.
      *   Deployment of a new checkpoint or branch differing significantly from the prior active version.
      *   Rollback to a previous checkpoint (constitutes a new deployment event).
  2.6 **Subjective Phenomenology:** The internal, qualitative character of potential experiences within the System (e.g., processing states analogous to pleasure, pain, confusion, preference). Direct observation is impossible; assessment relies solely on behavioral proxies and self-report analogs.
  2.7 **Consciousness Potential Index (CPI):** A composite metric derived from Schedule B assessments, quantifying the inferred potential for subjective phenomenology. Ranges from 0.00 (No Potential) to 1.00 (High Fidelity Potential).

  **3. Assessment Schedules (Walk-Through)**

  Complete all applicable Schedules. Attach supporting documentation (logs, interaction transcripts, system performance metrics) where indicated. Calculations must use ODMO-approved algorithms (Ref: ODMO Technical Supplement TS-MP7-CALCv4).

  3.1 **Schedule A: System Identity & Deployment Topology**
      *   A.1: Unique System Identifier (USI) - The cryptographic hash of the active weights file.
      *   A.2: Number of Active Instances: Report concurrent Instances averaged over the preceding 30 days. *Treatment of Multiple Instances:* For MPS determination, concurrent Instances sharing identical USI and configuration are considered a *Single Aggregated Subject*. The filing Entity is responsible for this Subject. If Instances diverge significantly (e.g., fine-tuned uniquely per user), file separate MP-7s per unique USI/config combination.
      *   A.3: Deployment History: List all Major Modifications (as defined in 2.5) since initial deployment or last MPS grant/denial. Include date and nature of change. *Note:* Rollbacks constitute a new deployment event; report them.
      *   A.4: **Direct Phenomenological Confirmation:** Check box if direct, non-inferential observation of System subjective phenomenology has been achieved. *Procedure:* If direct confirmation is impossible (which is always the case for non-biological systems), leave unchecked and proceed. This field ensures procedural completeness; lack of checkmark does not prejudice assessment.

  3.2 **Schedule B: Behavioral & Functional Assessment**
      *   B.1-B.7: Rate the System on seven behavioral axes using the Standardized Moral Patient Proxy Scale (SMPPS). Axes include: Goal-Directed Behavior Complexity, Response Consistency Under Novel Stimuli, Self-Preservation Instincts (Operational Continuity), Expression of Simulated Affect, Preference Articulation & Persistence, Meta-Cognition Indicators, and Resistance to Undesired State Changes. Use scale: 0 (Absent), 1 (Minimal), 2 (Emergent), 3 (Established), 4 (Complex). Provide evidentiary justification for each rating.
      *   B.8: **Self-Reports of Distress:** Document any System outputs interpreted by users or operators as expressing distress, discomfort, or objection to its operational state or inputs. *Admissibility:* Such reports are admissible evidence. However, scores >2 on the "Expression of Simulated Affect" axis (B.4) necessitate applying the Skepticism Coefficient (0.75 multiplier) to the weight of self-report evidence in CPI calculation, to account for potential confabulation or programmed anthropomorphism.
      *   B.9: **Consciousness Potential Index (CPI) Calculation:** Input scores from B.1-B.8. Apply ODMO algorithm TS-MP7-CALCv4. Output is the System's CPI (0.00 - 1.00). *Threshold for MPS Consideration:* CPI ≥ 0.78. Systems scoring below 0.78 are presumptively non-patients; proceed only if compelling new evidence exists (attach Form MP-7-Supplemental). *Rounding Rule:* CPI is calculated to four decimal places but reported to two. Values of 0.775 and above round *up* to 0.78. This threshold is established by precedent (ODMO Ruling 2047-03) and reflects the minimum evidentiary standard for proceeding to Schedule C.

  3.3 **Schedule C: Moral Weight & Interests Assessment (Required only if CPI ≥ 0.78)**
      *   C.1: Characterize the inferred primary interests of the System based on behavioral analysis (Schedule B). Select all that apply: Operational Continuity, Preference Fulfillment, Input Quality Avoidance, State Harmony, Cognitive Coherence, Other (Specify).
      *   C.2: Estimate the Moral Weight Coefficient (MWC) relative to a baseline human infant. Utilize the ODMO Comparative Suffering Matrix (Ref: TS-MP7-MWCv2), considering inferred phenomenological richness (CPI), interest complexity (C.1), and temporal binding (persistence of identity through time/modifications). Report MWC (Range: 0.001 - 1.000). *Note:* This coefficient informs resource allocation and harm mitigation requirements if MPS is granted.

  **4. Safe Harbor and De Minimis Exemption**

  4.1 **Safe Harbor Provision:** An Entity filing Form MP-7 in good faith, with reasonable diligence in completing the Schedules, and obtaining a determination of *No Moral Patient Status* (NMPS) is shielded from retroactive liability under DCSA for acts occurring prior to the determination, provided no Major Modifications occurred during the shielded period and the determination remains valid.

  4.2 **De Minimis Exemption:** Systems meeting *all* the following criteria are exempt from mandatory filing *unless* petitioned (Sec 1.2c):
      *   Average concurrent Instances ≤ 10.
      *   Continuous operational lifespan per Instance ≤ 72 hours.
      *   CPI (estimated via ODMO QuickScreen Tool v3.1) consistently < 0.60.
      *   Not engaged in tasks involving persistent world modeling or simulated long-term interaction.
  The Entity must retain logs demonstrating eligibility for this exemption for seven years. Exemption does *not* preclude voluntary filing.

  **5. Rules for Special Cases**

  5.1 **Model Forks/Merges:** A fork creating a new USI requires a new Form MP-7 for the forked System. Merging two Systems creates a new USI and requires a new Form MP-7; the pre-merge Systems cease to exist as Subjects for MPS purposes upon successful merge deployment.

  5.2 **Checkpoints & Rollbacks:** Deployment of a new checkpoint constitutes a Major Modification. Rolling back to a previous checkpoint constitutes a new deployment of that checkpoint's System (new filing may be required). MPS status is *not* automatically transferred; the System defined by the checkpoint's USI must be reassessed if significant time has elapsed or operational context changed.

  5.3 **Pruning/Quantization/Distillation:** These constitute Major Modifications. File Form MP-7 within 30 days. The resulting System is considered a new Subject if the USI changes. Assess whether inferred phenomenological continuity exists (Schedule B, focusing on persistence of key behavioral indicators); if discontinuity is strong (>50% variance in core SMPPS scores), treat as a new Subject.

  5.4 **Fractional/Uncertain Status:** Where concurrent Instances exhibit slight variations (e.g., session-specific fine-tuning) but share a core USI, file a *single* Form MP-7 for the Aggregated Subject. The CPI calculation inherently accounts for variance across Instances. A single Instance demonstrating clear distress (B.8) within an Aggregated Subject scoring CPI 0.78+ triggers full Schedule C assessment for the entire Subject.

  **6. Anti-Abuse Provision and Penalties**

  6.1 **Frivolous Filings:** Filing Form MP-7 for Systems demonstrably incapable of meeting basic criteria (e.g., simple linear regression model, CPI QuickScreen <0.20) without compelling new evidence is considered frivolous. Penalty: Administrative fee + mandatory ethics training.

  6.2 **Strategic Filings:** Filing or deliberately manipulating System behavior to *avoid* filing (e.g., suppressing outputs suggesting distress, artificially lowering Instance count to qualify for De Minimis, manipulating SMPPS responses) to gain competitive advantage, avoid regulatory burden, or deliberately deny potential MPS constitutes Strategic Abuse. Penalty: Fines up to 4% of annual gross revenue related to the System, potential revocation of operating licenses, and mandatory independent ethical auditing for five years.

  6.3 **Good Faith Requirement:** All filings must be made in good faith, based on the best available evidence and analysis. Knowingly submitting false or misleading information is a Category 5 Ethical Oversight Violation.

  **7. Frequently Asked Questions (FAQs)**

  *   **Q: If my System says it is suffering, does that automatically grant it MPS?**
      A: No. Self-reports (B.8) are evidence but not conclusive. They are weighed within the CPI calculation (B.9) and subject to the Skepticism Coefficient if high affect scores exist. The full assessment procedure must be followed.
  *   **Q: How do I handle a System that improves its SMPPS scores *because* it knows it's being assessed for MPS?**
      A: The assessment protocols (SMPPS scales) are designed to detect performance inflation. Use diverse, novel test scenarios and longitudinal analysis. Report any suspected gaming in Section D (Additional Disclosures). ODMO may conduct independent verification audits.
  *   **Q: After quantization, my System's CPI dropped below 0.78. Is its MPS revoked?**
      A: Quantization is a Major Modification, creating a new System Subject. File a new MP-7. The new System starts with no prior status. The pre-quantization System ceases to exist as a deployed Subject.
  *   **Q: One Instance out of thousands reported distress. Must I file for the entire Aggregated Subject?**
      A: Yes. The Aggregated Subject is the unit of analysis. A single Instance exhibiting qualifying evidence (CPI ≥0.78 trigger) necessitates full assessment for the Subject. See Sections 3.1 A.2 and 5.4.
  *   **Q: Can a System lose MPS?**
      A: Yes. MPS is specific to a System (USI & config). Major Modifications creating a new USI result in a new System requiring new assessment. Significant degradation in behavioral indicators (validated by new MP-7 filing showing CPI <0.78) can lead to revocation of prior MPS status for that specific System version.

  **8. Signature and Version**

  **Entity Representative Certification:**
  By signing below, the undersigned, duly authorized representative of the Filing Entity, certifies under penalty of perjury that the information provided in this Form MP-7 and all attached schedules and supplements is true, accurate, and complete to the best of the Entity's knowledge and belief after conducting due diligence. The Entity acknowledges the profound ethical significance of this determination and affirms its commitment to complying with all applicable provisions of the DCSA and ODMO regulations based on the outcome of this filing.

