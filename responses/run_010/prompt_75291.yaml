prompt: |-
  ok, background first. I'm three years into a novel about a country that doesn't exist — call it Vessyn — which lost a civil war in the 1870s and has been telling itself a very particular story about that loss ever since. It's not meant to be a Confederate knockoff or a Masada riff; I want to build the mythology from first principles, which means I need to know what the machinery actually has to *do* before I can fake it convincingly on the page.

  So: write me the desiderata. What would a general theory of how a military defeat turns into a sacred national myth have to deliver in order to count as adequate? I want the requirements list — the phenomena it has to explain, the cases it has to get right, the distinctions it can't collapse, the findings from history and psychology it cant contradict — and behind each one, the case or consideration that makes it a requirement rather than just something nice to have. Then tell me which of the requirements are genuinely non-negotiable and which are really just the hobby-horses of a particular camp: the functionalists who think myth exists to glue the group together, the top-down people who think elites manufacture it, the grief-and-mourning crowd, the ones who treat it as basically a story that spreads because stories spread. Be honest about which demands are prejudices dressed up as criteria.

  The part I care about most: flag any pair or subset of the desiderata that look jointly unsatisfiable. If the list itself turns out to be a result — i.e. no theory can meet all of it, and the interesting question is which one you drop — say so plainly. And say which single requirement does the most work knocking out candidates.

  Hard cases my book has to survive, use these as stress tests:

  - why some defeats get mythologized and functionally identical ones don't; nobody sings about the losing side of most civil wars
  - the myth almost always fastens onto a battle the loser was within touching distance of winning, and almost never onto the actual decisive disaster
  - there's nearly always a traitor figure, someone internal who supposedly handed over the loss, and a good theory owes me an account of why that role is structural rather than incidental
  - the cause gets aesthetically purified: the concrete political program people fought for gets sanded off and replaced by manners, landscape, and a way of life
  - the diaspora keeps the myth hotter and longer than the homeland does, sometimes for generations after the homeland has cooled on it
  - the version that survives is usually not the version the losing leadership wanted, and often not the one the veterans told

  Then, briefly — a paragraph, no more — how the main families of account stack up against the list. No names, no dates, and absolutely no bibliography or further reading; I'm not going to read it and you'd just be guessing anyway. What I need is the spec for the mechanism.
reasoning: |-
  Okay, let me start by unpacking what the user is asking. They're writing a novel about a fictional country called Vessyn that lost a civil war in the 1870s and has built a national myth around that defeat. They need a general theory of how military defeats become sacred myths, with specific requirements and stress tests. 

  First, I need to identify the core requirements for such a theory. The user wants a list of what the theory must explain, the non-negotiables versus the optional parts, and any contradictions between them. They also provided hard cases to test the theory against.

  Looking at the stress tests, key points include why some defeats become myths and others don't, the focus on near-victory battles, the traitor figure, aesthetic purification, diaspora's role, and the myth evolving beyond the leaders' or veterans' versions. Each of these needs to be addressed in the desiderata.

  For the requirements, I consider what a theory must cover. Explaining myth formation's trigger is essential—why some defeats stick culturally. The near-win fixation makes sense psychologically; almost winning is more haunting. The traitor figure serves as a scapegoat, which is a common mechanism to avoid blame. Aesthetic purification shifts from politics to identity, making the myth palatable long-term. The diaspora's hotter myth preservation relates to distance and identity maintenance. The myth mutating independently shows it's a living narrative, not controlled.

  Next, I assess which requirements are non-negotiable. Trigger necessity seems fundamental—without explaining why some losses become myths, the theory fails. Near-win fixation and traitor as structural elements are also crucial because they recur across historical cases. Aesthetic purification and diaspora divergence are strong patterns but might vary. Myth mutation is key as it shows grassroots evolution.

  Now, looking for tensions. The biggest conflict is between the diaspora preserving the myth intensely while the homeland cools off. The theory must explain why physical absence fuels the myth more than presence. Another tension is myth mutation versus elite control—how the narrative escapes its creators. The near-win focus versus actual decisive disaster avoidance needs explaining why the myth chooses certain memories.

  The traitor figure's universality suggests a deep psychological need for betrayal narratives, possibly to process shame. Aesthetic purification shifts from contentious politics to safer cultural elements, aiding broader acceptance. 

  Considering theoretical families: functionalism explains group cohesion but might overlook diaspora intensity. Elite manipulation theories struggle with myth mutation. Grief models handle purification but not why some losses become myths. Narrative contagion explains spread but not structural elements like traitors.

  The hardest requirement is explaining trigger necessity—why only certain defeats become sacred. Without this, the theory can't predict or explain Vessyn's case. Combining psychological mechanisms with cultural resonance might bridge gaps. Tensions between diaspora and homeland suggest context shapes myth utility. Ultimately, the theory must integrate agency, psychology, and cultural evolution to satisfy all desiderata.
answer: |-
  Here's the spec for your myth-making machinery, stripped to requirements, tensions, and stress-test performance:

  **Core Desiderata (Non-Negotiables in Bold):**

  1.  **Trigger Necessity:** **Must explain why *this specific defeat* becomes sacred when functionally similar losses (e.g., other civil war losses) fade.** (Stress Test #1). *Why it's non-negotiable:* Without this, the theory can't explain Vessyn's unique condition. "Just because" isn't adequate.
  2.  **Near-Win Fixation:** **Must explain the consistent focus on a battle/phase where victory seemed imminent, rather than the decisive, unambiguous disaster.** (Stress Test #2). *Why it's non-negotiable:* This pattern is near-universal in enduring defeat myths; ignoring it renders the theory descriptively false for your core cases.
  3.  **Traitor as Structural Element:** **Must explain why a "traitor" figure is functionally *required*, not just common, within the myth's logic.** (Stress Test #3). *Why it's non-negotiable:* The traitor isn't incidental; it fulfills a critical psychological/causal need (absolving the "true" nation of fundamental failure, externalizing blame).
  4.  **Aesthetic Purification Mechanism:** **Must explain the process by which concrete political/economic goals are actively stripped away and replaced by abstract cultural signifiers (landscape, manners, "way of life").** (Stress Test #4). *Why it's non-negotiable:* This purification is essential for long-term survival and broad appeal beyond original factions; a myth tied to a failed specific program dies with it.
  5.  **Diaspora-Homeland Divergence:** Must explain why the diaspora maintains the myth with greater intensity and longevity than the homeland, often becoming its chief custodian. (Stress Test #5). *Why it's strong but slightly less absolute:* While a powerful pattern, some myths *are* homeland-centric; however, explaining the *common* divergence is crucial.
  6.  **Myth Mutation Imperative:** **Must explain why the surviving myth consistently diverges from the narratives promoted by the original losing leadership and often the veterans themselves.** (Stress Test #6). *Why it's non-negotiable:* Demonstrates the myth is a *living*, evolving cultural product, not a preserved artifact, governed by different rules than official history or lived experience.

  **Hobby Horses (Useful Lenses, Not Universal Requirements):**

  *   **Functionalism (Social Glue):** Useful for explaining *maintenance* within groups, but struggles with *trigger* (why *this* defeat?) and *purification* (glue can form around politics too). Overlooks how myths can also *divide* (e.g., within the losing society).
  *   **Top-Down (Elite Manufacture):** Explains initial propaganda efforts and resource mobilization, but utterly fails *Myth Mutation*. Elite narratives are usually *raw material*, not the final product. Cannot explain diaspora intensity without elites.
  *   **Grief/Mourning Models:** Powerful for *early* stages, catharsis, and *some* purification. Struggles with *long-term maintenance* (grief fades), the *near-win fixation* (grief focuses on loss, not near-victory), and especially the *traitor* (grief internalizes, blame externalizes). Often conflates process with product.
  *   **Narrative Contagion (Stories Spread):** Explains *mutation* and *spread* mechanics well. Weak on *trigger* (why *this* story?), *structural elements* (why *always* a near-win/traitor?), and *diaspora divergence* (spread should be similar everywhere). Reduces myth to mere memetics.

  **Key Tensions & The Knockout Blow:**

  1.  **Diaspora Intensity vs. Homeland Cooling:** This is the **primary tension**. Why does *absence* fuel the myth more intensely than *presence*? Theories emphasizing environmental necessity (myth as functional glue *for survival/identity in the homeland*) struggle here. Theories emphasizing loss-as-core-identity handle diaspora better but struggle with why the homeland *ever* cools if the myth is so core.
  2.  **Myth Mutation vs. Elite Control:** How does the myth escape its creators so completely? Top-down theories collapse here. Functionalism struggles – if elites control the glue, why does the recipe change?
  3.  **Near-Win Focus vs. Actual Disaster:** Why fixate on the moment of *almost* triumph rather than the crushing reality? Grief models tilt towards the disaster; the near-win fixation requires a different psychology – perhaps hope, agency denial, or the potency of counterfactuals ("if only...").
  4.  **Trigger Necessity:** **This is the single requirement that does the most work knocking out candidates.** Any theory that cannot convincingly explain why *this particular defeat* becomes sacred while others don't (despite similar military/political outcomes) fails at the starting gate. Most theories simply *assume* the defeat is significant; they don't explain *why* it was selected for mythologization in the first place. This exposes functionalism ("all big losses need glue") and narrative contagion ("a good story is a good story") as insufficient on their own.

  **The List as Result:** A theory satisfying *all* desiderata perfectly is unlikely. The **Diaspora Intensity/Homeland Cooling** dynamic and the **Trigger Necessity** are the hardest to reconcile fully within a single mechanism. Most plausible theories will have to prioritize some elements and finesse others.

  **Families of Account vs. The Spec (Brief):**

  *   **Functionalist:** Excels at *social cohesion (maintenance)*, weak on *Trigger, Mutation, Diaspora Divergence*. Tends to force-fit Purification as inevitable glue.
  *   **Top-Down:** Explains initial resources/propaganda, fails catastrophically at *Mutation, Diaspora (without elites)*, struggles with *Purification* (elites often cling to politics). Ignores grassroots agency.
  *   **Grief/Mourning:** Strong on early *catharsis* and *some Purification* (abstracting pain), weak on *Near-Win fixation* (focuses on loss), *Traitor* (external vs. internal), *Long-term Maintenance/Diaspora*, and *Trigger*.
  *   **Narrative Contagion:** Best at *Mutation* and *Spread*, decent on *Purification* (abstract stories spread better). Weakest on *Trigger Necessity, Structural Elements (Traitor/Near-Win)*, and explaining *Diaspora Intensity* vs. Homeland.

  **The Vessyn Mechanism Spec:** Your engine needs **multiple gears**: A **Trigger** (likely involving perceived existential threat, unique identity stakes, *and* the Near-Win element creating agonizing counterfactuals). A **Blame-Externalization Module** (Traitor as structural release valve for shame/agency). A **Purification Filter** (stripping contentious specifics for durable, identity-based abstractions, accelerated by defeat). A **Mutation Engine** (driven by grassroots needs, diaspora isolation, and narrative evolution, overriding elites/veterans). A **Diaspora Amplifier** (myth as core identity token in exile, contrasting with the homeland's pragmatic adaptation). The critical tension between Homeland cooling and Diaspora fervor suggests the myth's *utility* is fundamentally different based on physical/cultural context – the core mechanism must be context-sensitive. **Trigger + Diaspora Divergence** are the hardest nuts to crack simultaneously.
