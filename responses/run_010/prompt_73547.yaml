  ### **Scoring Key & View Mapping**  
  Score by tallying answers, then match patterns to views. **Named views** use established labels; **unnamed** are described. Flagged pairs are indistinguishable.  

  #### **Step 1: Tally Answers**  
  | Axis         | Tally Method                                                                 | View if Dominant                          |
