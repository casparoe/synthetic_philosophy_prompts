  #### **Indistinguishable Pairs**  
  The quiz **cannot separate**:  
  1. **Graded Sentientism vs. Scaled Utilitarianism** when valence is assumed gradational. *Why?* Both support inclusion/ramps (Q4A, Q5A, Q10A), and the quiz doesn’t probe if weight is intrinsic (Graded) or separable (Scaled).  
  2. **Phenomenal Precautionism vs. "Mere" Experience Views**. *Why?* Cases like the brain organoid (Q5) and AI poetry (Q8) don’t distinguish valence from experience.  
  3. **Biocentrism vs. Aggregate Interests**. *Why?* Both endorse interests (Q6A, Q11A) and aggregation (Q4A), but differ on whether interests require biology.  

