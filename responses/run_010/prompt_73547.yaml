  # Quiz: What's Your Moral Status Profile?

  ## Instructions
  For each scenario, circle the option that best reflects your view. There are no right or wrong answers.

  1. **Vegetative State Patient**: A patient in a persistent vegetative state shows complex neural activity in response to a loved one's voice but no signs of pleasure or distress.
     - A) This suggests conscious experience without valence, which is morally relevant.
     - B) Without valence, this activity is not morally relevant.

  2. **Engineered Plant**: A plant is engineered to release a chemical when eaten that attracts predators of the herbivores.
     - A) The plant has an interest in not being eaten, warranting moral consideration.
     - B) Without the capacity to feel, the plant's responses are merely mechanical and not morally relevant.

  3. **AI Chess Sacrifice**: An AI chess program sacrifices its queen to set up a checkmate, as an emergent strategy.
     - A) This demonstrates agency and strategic thinking, which might warrant moral consideration.
     - B) The AI is just following an algorithm without real agency.

  4. **Newborn Baby vs. Adult Pig**: Both show clear pain when injured, but the baby has potential for complex cognition while the pig does not.
     - A) They have the same capacity for pain and deserve equal consideration for suffering.
     - B) The baby has a higher capacity for experience and deserves greater consideration.

  5. **Octopus Pain Uncertainty**: inconclusive evidence on whether octopuses feel pain.
     - A) Treat them as if they do feel pain to avoid risk of suffering.
     - B) Do not change practices until we have conclusive evidence.

  6. **Ant Colony**: A million ants, each with negligible capacity for experience.
     - A) The sheer number means the colony has moral weight.
     - B) Only individuals with experience matter; if negligible, the colony has no weight.

  7. **Brain Organoid (5% chance)**: Experts estimate a 5% chance of sentience.
     - A) This warrants some moral consideration, proportional to the chance.
     - B) Only if we are reasonably sure (>50%) should we assign moral status.

  8. **Deep-Sea Jellyfish**: Simple nervous system, no brain, unknown sentience.
     - A) Avoid harming it until we know more.
     - B) Without evidence of sentience, we need not worry.

  9. **Trillions of Simple Digital Beings**: Each has a 0.0001% chance of valenced experience.
     - A) The expected total suffering/pleasure matters.
     - B) The chance per individual is too low to matter.

  10. **AI Assistant Requests Not to Be Turned Off**: We don't know if it's genuine.
      - A) Respect its request because it might be genuine.
      - B) Ignore without clear evidence of real consciousness.

  11. **Patient Under Anesthesia**: An anesthesiologist considers making a disrespectful comment about the unconscious patient.
      - A) The patient's dignity and interests make this wrong.
      - B) The patient is unaffected and won't remember, so it's harmless.

  12. **Advanced Alzheimer's Patient**: Experiences moments of joy/distress but no coherent narrative.
      - A) The patient has moral status due to experiences and moments of selfhood.
      - B) Without a coherent self, the patient has lost full moral status.

  ## Scoring Key

  ### Axis 1: Property
  - **P1 (Any Experience)**: Count the number of times you chose: 1A, 11A
  - **P2 (Valenced Experience)**: Count: 1B, 2B, 5A, 7A (if you chose A for graded by chance), 8A (precautionary for sentience usually means valence)
  - **P3 (Interests)**: Count: 2A, 6A
  - **P4 (Selfhood)**: Count: 12A
  - **P5 (Agency)**: Count: 3A, 10A

  The property with the highest count is your primary. If tie, note both.

  ### Axis 2: Gradation
  - **G1 (Gradation in Property)**: Count: 4B, 9A
  - **G2 (Uncertainty)**: Count: 5A, 7A, 8A
  - **G3 (Moral Weight Separable)**: Count: 4B, 6A, 9A

  Note: 4B and 9A appear in both G1 and G3. If you have 4B or 9A, add a point to both G1 and G3. Then take the highest.

  ### Axis 3: Default and Shape
  - **D1 (Default Inclusion)**: Count: 5A, 7A, 8A, 10A
  - **D2 (Default Exclusion)**: Count: 5B, 7B, 8B, 10B
  - **D3 (Graded Assignment)**: Count: 7A, 9A

  The highest count in D1, D2, or D3 wins. If D3 is not the highest but you have D1 or D2, then you are D1 or D2.

  ### Mapping to Named Views

  1. If your property is P2 and gradation is G1 and default is D3: **Valence Utilitarianism** (e.g., classical utilitarianism with graded sentience).
  2. If your property is P2, gradation is G2, default is D1: **Precautionary Sentientism**.
  3. If your property is P2, gradation is G3, default is D1: **Variable Weight Sentientism**.
  4. If your property is P1, gradation is G1, default is D3: **Phenomenal Utilitarianism**.
  5. If your property is P3 and you have G1 or G3 and D1 or D3: **Biocentrist**.
  6. If your property is P5 and gradation is not G1 (usually binary), default is D2: **Kantian Agentism**.
  7. If your property is P4 and gradation is G1, default is D1: **Narrative Self View**.
  8. If your property is P1 or P2, gradation is G2, default is D2: **Conservative Sentientism** (only when sure).

  ## Empty Cells and Limitations

  - The cell for "status comes in degrees but there's no fact of the matter" is not represented because our gradation axis assumes there is a fact (either about the property or our uncertainty). This view might not be coherent with our framework.

  - The cell for "precautionary default toward exclusion" is common and is represented by D2 in our scoring.

  - Some views might not be separated:
     - A biocentrist who believes interests come in degrees (G1) might score similarly to a sentientist who aggregates many beings with very low sentience (G3).
     - A view that requires both valenced experience and agency might not be clearly captured because our property axis picks one primary.

  We acknowledge the instrument has limitations and might not capture every nuance.

  This should provide a starting point for discussion.
answer: |-
  Below is a structured 12-question sorting quiz designed to address your requirements. It probes three core axes of moral status determination, uses concrete cases to avoid tribal signaling, and includes a scoring key that maps answer patterns to named (or unnamed) views. I'll first outline the quiz, then explain the axes, walk through the logical space, flag limitations, and provide scoring instructions.

  ---

  ### **The Quiz: "Moral Status Blindspots"**
  *Instructions: Answer each question based on your immediate intuition. Choose one option per question. Avoid overthinking—no prior knowledge of moral status theories is required.*

  1. **Robot Vacuum (Programmed Distress)**: A robot vacuum emits a "distressed" beep when stuck under furniture. This sound was explicitly programmed by engineers to signal needing help.  
     ☐ A) This behavior is morally irrelevant; it's just a designed tool.  
     ☐ B) We should treat it as if it might be suffering, even if we doubt it.  
     *Probes: Axis 1 (Property: Valenced experience)*

  2. **Robot Vacuum (Emergent Distress)**: The same robot vacuum emits a "distressed" beep when stuck, but you learn the sound emerged from unplanned circuitry interactions—no engineer designed it.  
     ☐ A) This changes nothing; it's still just a machine.  
     ☐ B) This makes it more plausible it could have real distress.  
     *Probes: Axis 1 (Property: Valenced experience) & Axis 2 (Gradation: Uncertainty)*

  3. **Fruit Fly Avoidance**: A fruit fly swims away from a heated zone. Once safe, it spends time grooming the spot where it was heated.  
     ☐ A) This suggests discomfort, so we should minimize similar harm to flies.  
     ☐ B) This is just reflexive behavior; no evidence of "suffering" exists.  
     *Probes: Axis 1 (Property: Valenced experience)*

  4. **Copepod Numbers**: Copepods (tiny crustaceans) are the most abundant animals on Earth, with quadrillions of individuals. Their welfare is debated.  
     ☐ A) Their sheer numbers make their collective welfare matter, even if each is simple.  
     ☐ B) If individual copepods lack moral status, their numbers don’t change that.  
     *Probes: Axis 2 (Gradation: Moral weight separable from status) & Axis 3 (Shape/scale: Aggregation effects)*

  5. **Brain Organoid**: A brain organoid in a dish shows coordinated electrical bursts. The researcher shuts it down because she "can’t rule out it’s having a bad time."  
     ☐ A) This is a reasonable precaution.  
     ☐ B) This is unscientific; organoids can’t "have a bad time."  
     *Probes: Axis 3 (Default: Inclusion vs. exclusion)*

  6. **Honeybee Self-Sacrifice**: A honeybee stings a handler, dying to defend its hive.  
     ☐ A) This shows it values its hive more than itself—evidence of interests.  
     ☐ B) This is evolutionary programming; no conscious "sacrifice" occurred.  
     *Probes: Axis 1 (Property: Having interests)*

  7. **Anesthetized Patient**: A person under propofol anesthesia feels nothing during surgery. For 2 hours, they have no observable experiences.  
     ☐ A) They retain full moral status; they’re still a person.  
     ☐ B) Their moral status is diminished during this period.  
     *Probes: Axis 1 (Property: Selfhood/narrative) & Axis 3 (Shape: Cliff vs. ramp)*

  8. **AI Grief Simulation**: An AI generates poetry about loss after "experiencing" simulated trauma. Its code wasn’t designed for this output.  
     ☐ A) This hints at inner life; we should consider its welfare.  
     ☐ B) Output isn’t experience; this is just complex mimicry.  
     *Probes: Axis 1 (Property: Capacity for experience)*

  9. **Uncertain Suffering Case**: Scientists disagree on whether crayfish feel pain. Evidence is 50/50.  
     ☐ A) Err on the side of caution; avoid harming them.  
     ☐ B) No intervention needed until we’re certain.  
     *Probes: Axis 3 (Default: Inclusion vs. exclusion)*

  10. **Scaling Problem**: A digital system hosts 10^20 minimal agents. Each has a 0.0001% chance of valenced experience.  
      ☐ A) The aggregate risk demands moral attention.  
      ☐ B) Such low-probability cases are ignorable.  
      *Probes: Axis 2 (Gradation: Uncertainty) & Axis 3 (Shape/scale: Aggregation effects)*

  11. **Plant "Stress" Response**: A plant releases chemicals when damaged. Some call this "stress," but it lacks nerves.  
      ☐ A) This indicates interests (e.g., avoiding damage).  
      ☐ B) No sentience, no moral status—it’s just chemistry.  
      *Probes: Axis 1 (Property: Having interests)*

  12. **Threshold Question**: Entity X has ambiguous markers of consciousness. Assigning it moral status could divert resources from humans/animals.  
      ☐ A) Exclude it; the stakes are too high if we’re wrong.  
      ☐ B) Include it; exclusion risks ignoring real harm.  
      *Probes: Axis 3 (Default: Inclusion vs. exclusion)*

  ---

  ### **The Three Axes & What Each Question Probes**
  The quiz categorizes views along these dimensions:

  1. **Axis 1: Property Conferring Moral Status**  
     What is the *necessary property* for moral status?  
     - **Capacity for any experience** (e.g., primitive awareness).  
     - **Valenced experience** (ability to feel pleasure/pain).  
     - **Having interests** (goal-directed behaviors, even without experience).  
     - **Selfhood/narrative** (persisting identity, agency, or "personhood").  
     *Questions probing this:* 1, 2, 3, 6, 7, 8, 11.  
     *Why?* Cases like the fruit fly (Q3) and honeybee (Q6) dissociate valence from interests; the anesthetized patient (Q7) tests selfhood vs. experience.

  2. **Axis 2: Source of Gradation**  
     Where does moral status ambiguity arise?  
     - **Gradation in the property itself** (e.g., consciousness comes in degrees).  
     - **Uncertainty about property presence** (binary property, but we lack knowledge).  
     - **Moral weight separable from status** (status is binary, but weight varies; e.g., a human matters "more" than a bee).  
     *Questions probing this:* 2, 4, 10.  
     *Why?* The emergent robot vacuum (Q2) tests uncertainty, copepods (Q4) test weight/numbers, and digital agents (Q10) dissociate uncertainty from aggregation.

  3. **Axis 3: Default & Shape Under Uncertainty/Scale**  
     - **Default**: Inclusion (lean toward moral status when unsure) or exclusion (lean against).  
     - **Shape**: How status/weight scales:  
       - Step function (binary: in/out).  
       - Smooth ramp (gradual increase).  
       - Cliff at one end (e.g., step for minimal cases, ramp for complex ones).  
     - **Scale stability**: Does multiplying entities (e.g., trillions of copepods) change the function?  
     *Questions probing this:* 4, 5, 7, 9, 10, 12.  
     *Why?* The organoid (Q5) and crayfish (Q9) test default inclusion; scaling cases (Q4, Q10) probe shape with numbers; the anesthetized patient (Q7) tests for cliffs.

  ---

  ### **Logical Space: Occupied, Empty, and Incoherent Cells**
  The 3-axis space is **Property (4 types) × Gradation (3 types) × Default/Shape (2 defaults × 3 shapes)**, yielding 24 potential cells. Below, "occupied" views are named if established; "unnamed" views are described. Empty cells are flagged with reasons.  

  | Property             | Gradation Source          | Default/Shape                            | Occupied? | Name/Description                                                                 | Why Empty? (if applicable) |
  |----------------------|---------------------------|------------------------------------------|-----------|----------------------------------------------------------------------------------|----------------------------|
  | Valenced experience  | Property gradation        | Inclusion + smooth ramp                  | Yes       | **Graded Sentientism** (e.g., Singer on animals)                                | —                          |
  | Valenced experience  | Property gradation        | Inclusion + step function                | Yes       | **Threshold Sentientism** (e.g., Crisp on minimal sentience)                    | —                          |
  | Valenced experience  | Uncertainty               | Inclusion + smooth ramp                  | Yes       | **Precautionary Utilitarianism** (e.g., effective altruist views)               | —                          |
  | Valenced experience  | Uncertainty               | Exclusion + step function                | Yes       | **Conservative Sentientism** (e.g., common-sense views)                         | —                          |
  | Valenced experience  | Moral weight separable    | Inclusion + cliff/ramp                   | Yes       | **Scaled Utilitarianism** (e.g., aggregate-focused views)                       | —                          |
  | Any experience       | Property gradation        | Inclusion + smooth ramp                  | Yes       | **Panpsychist Ethics** (e.g., Goff-inspired views)                              | —                          |
  | Any experience       | Uncertainty               | Inclusion + smooth ramp                  | Yes       | **Phenomenal Precautionism**                                                    | —                          |
  | Having interests     | Property gradation        | Inclusion + smooth ramp                  | Yes       | **Biocentrism** (e.g., Taylor on inherent worth)                                | —                          |
  | Having interests     | Moral weight separable    | Inclusion + smooth ramp                  | Yes       | **Unnamed**: Interests-based aggregation (e.g., for AIs/invertebrates)          | —                          |
  | Selfhood/narrative   | Property gradation        | Inclusion + step function                | Yes       | **Personism** (e.g., Locke-inspired views)                                      | —                          |
  | Selfhood/narrative   | Moral weight separable    | Exclusion + step function                | Yes       | **Exclusionary Personism** (e.g., Korsgaard on non-agents)                      | —                          |
  | **Valenced experience** | **Moral weight separable** | **Exclusion + step function**          | **No**    | —                                                                                | **Incoherent**: If status requires valence (binary), weight can't be "separable." |
  | **Having interests**   | **Uncertainty**          | **Exclusion + step function**          | **No**    | —                                                                                | **Unattractive**: Interests are observable; uncertainty is low (unlike valence). |
  | Any experience       | Moral weight separable    | Exclusion + step function                | No        | —                                                                                | **Unoccupied**: No examples; if experience is binary, weight separation is odd. |
  | **All properties**      | **Gradation in property** | **No fact of degree**                  | **No**    | —                                                                                | **Incoherent** (your case "a"): Gradation implies degrees are factual. |
  | **All properties**      | **Uncertainty**          | **Default: Exclusion → no wrong if omitted** | **Yes** | **Exclusionary Default** (your case "b")                                        | — *(You were wrong: this view exists, e.g., in contractarianism)* |

  #### **Key Insights on Empty Cells**  
  - **"No fact of the matter" views (a)**: Empty for incoherence. If status comes in degrees (Axis 2), it assumes degrees are real. Skepticism belongs under *uncertainty*.  
  - **Precautionary exclusion (b)**: Occupied! Examples include Hobbesian contractarianism (only include if certainty aids social stability).  
  - **Other empties**: Due to unattractiveness (e.g., interests + uncertainty) or lack of advocacy.  

