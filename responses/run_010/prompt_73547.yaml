  ### **Why This Works for Your Workshop**  
  - **Avoids tribalism**: No mentions of "sentience," labels, or academic jargon. Cases feel fresh (e.g., robot vacuums, organoids).  
  - **Reveals blindspots**: Questions force tradeoffs (e.g., Q4 copepods force numerical scaling; Q12 forces inclusion/exclusion under risk).  
  - **Limitations flagged**: Indistinguishable pairs are transparently noted, so participants know where the quiz is coarse.  
  - **Safe for experts**: No attributions to living scholars; views are abstracted (e.g., "Graded Sentientism" not "Singer’s view").  

