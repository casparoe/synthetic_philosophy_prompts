prompt: |-
  I'm teaching a cross-cultural psych unit and I've assigned The Dispossessed (Le Guin, 1974) next to the tight vs. loose cultures material — mostly the Gelfand et al. 2011 Science study and the two-part definition it runs on: how strong and pervasive a society's norms are, and how much deviant behaviour gets tolerated rather than sanctioned. My students keep landing on "Anarres is the loose one, Urras is the tight one" becuase Anarres has no government, no police, no laws and no prisons, and they don't get past that. I think they've got it backwards but I want the case made properly instead of just asserted by me.

  So: read the novel through the tightness-looseness framework and tell me where Anarres actually scores on each of the two components. Does the construct break on a society where all the enforcement is informal — public opinion, the Syndicate of Instruction, gossip, work assignments, and simply nobody turning up to your talk? Work with specifics rather than vibes: Bedap's argument to Shevek about society-become-institution and where the walls really are; what happens to Tirin the playwright; the way Sabul smothers Shevek's work without ever having the formal authority to; the drought and emergency years when everybody gets posted to hard labour; and then the flip side on Urras, a world with cops, prisons and soldiers firing into a crowd that also cannot stop indulging Shevek's weirdness. Which of the two is tighter on Gelfand's own definition, and is that a failure of the measure or Le Guin finding a real third thing the measure can't see?

  Then push on the causal story. The theory says threat, scarcity and density buy tightness, and Anarres is a dustball with a fragile water supply, living under an embargo and the permanent possibility that Urras takes it back. So is the novel just a very good confirmation of the theory? If it is, what does that cost the way I've been framing things — I've been telling students tightness trades order and self-control against openness and creativity, and that both extremes do badly?

  Two constraints. Don't turn the book into an illustration: tell me where the tight/loose frame actively distorts it — the ambiguity in the subtitle, the wall, the simultaneity-versus-sequencing physics, the anarchist worry about institutions as such rather than about norm strength — and be honest about what a reading like this loses sight of. And don't quote the novel or the study; I haven't got either text to hand and paraphrase is fine.

  Bottom line first, please: your opening sentence should be your verdict on which society is tighter and why, then the reasoning. No preamble and no restating my question back at me.
