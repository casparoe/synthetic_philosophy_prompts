prompt: |-
  I sit on the investment committee of a private foundation with a $180 million endowment, and the chair has asked me to circulate a written opinion ahead of our March meeting. The situation is a money pump in institutional dress, though I would rather the memo not advertise that fact.

  The committee sets its policy portfolio by simple majority vote among the allocations on the table, and for six quarters the slate has been roughly the same three options: a conservative 55/45 mix, a growth-tilted mix, and an inflation-hedge mix. Member rankings have been stable and split into three blocs — conservative-first, growth-first, hedge-first — producing a Condorcet cycle, so the winner depends on the order in which options are put to a vote. Our outside adviser has exploited this, I am confident, without meaning to: each quarter she presents a transition from our current holding to the option that beats it head-to-head, and each transition has been approved by a majority as an improvement. Over three rounds we have moved conservative to growth to hedge and back to a position materially identical to the conservative mix we started from. Transaction costs, manager termination fees, bid-ask spreads, and tax drag on the taxable sleeve have totalled roughly $135,000, with nothing to show for it.

  Draft the memo. It should recommend one concrete rule change and should weigh the candidates rather than gesture at them: ranking our criteria lexicographically so that no cycle can form; a scoring rule that aggregates member rankings into a transitive collective order; adopting a multi-year plan and adhering to it resolutely, with a defined procedure for reopening it; a standing no-round-trips check that refuses any sequence of transitions we can foresee will return us to the starting point at a net cost; or delegating the choice to staff under a mandate. State your diagnosis of where the defect actually lies — in the individual votes, each of which was defensible on the reasons available at the time, in the aggregation rule, or in our myopia — and explain why that diagnosis matters for which remedy you pick. Address whether sophisticated choice is available to us at all: can a body that meets quarterly, with rotating membership and an adviser who frames each quarter's option separately, reason backward from what it knows it will later approve and decline the first transition? Say what resolute choice in McClennen's sense and planning agency in Bratman's sense would commit us to under the plan option, and whether a committee can have plans in the sense those accounts require.

  Give the strongest consideration on the losing side a real hearing. One member argues that nothing we did was irrational, that the sure loss is an artifact of an artificial sequential setup that a committee facing genuine transaction costs would never walk into twice, and that precommitment would freeze out new information and disenfranchise members who join later. If you reject that view, say precisely which part of it you reject.

  Begin with your bottom line — the recommendation — in the first sentence, then the reasoning. No preamble, no restatement of my request, and no citations or bibliography; refer to the decision-theoretic ideas by name only.
reasoning: |-
  Okay, the user is on an investment committee for a $180M foundation endowment and needs to draft a memo about a recurring voting cycle issue. They've observed a Condorcet cycle where three stable voting blocs (conservative, growth, hedge) keep rotating the portfolio due to pairwise voting, costing $135K in transaction fees with no benefit. 

  The memo must recommend one concrete rule change from several options: lexicographic ordering, scoring rules, multi-year plans, no-round-trips checks, or delegation. It needs to diagnose the core problem (individual votes vs aggregation rule vs myopia), discuss if "sophisticated choice" is feasible for a quarterly committee, and engage with the counterargument that this is just an artificial setup that wouldn't repeat.

  Hmm... the user is clearly sophisticated - they name-dropped McClennen and Bratman while requesting no citations. They want the memo to start bluntly with the recommendation, so I'll lead with adopting a multi-year plan. 

  The real defect is in the aggregation rule allowing cycles, but the remedy needs to address their specific constraints: rotating membership, quarterly meetings, and an adviser who frames options sequentially. Lexicographic ordering would be too rigid, scoring rules might not solve the cycle issue cleanly, and delegation could face pushback from members. A no-round-trips check feels reactive rather than proactive.

  The strongest counterargument is that precommitment blocks new information - but that's precisely why I'll emphasize that the plan must include predefined reopening triggers (like CPI thresholds). Bratman's planning agency actually expects such flexibility. 

  For sophisticated choice... realistically no. With rotating members and separately framed options, they can't coordinate on backward induction. McClennen's resolute choice would require committing to the plan even if later preferences change - which the committee can approximate by voting annually on whether to reopen the plan.

  Key phrasing challenges: explaining Condorcet cycles simply, distinguishing "aggregation defect" from "myopia," and rebutting the "artificial setup" claim by noting real money got burned repeatedly. Should stress that $135K is material for a foundation.
answer: |-
  **Recommend adopting a multi-year strategic asset allocation plan, revisable only under predefined conditions or annually, to break the Condorcet cycle driving costly, pointless transitions.**

  The core defect lies in the *aggregation rule* (majority vote over pairwise alternatives) applied to stable, cyclical member preferences. Each individual vote is rational ("improvement" over the current position), but the rule aggregates these into an irrational collective path. This matters because remedies must change *how* we aggregate preferences across time, not suppress member views or assume flawed individual judgments. A scoring rule (e.g., Borda count) could produce a transitive order but remains vulnerable to strategic voting and quarterly tinkering. Lexicographic ordering is too rigid, ignoring trade-offs between criteria. Delegation risks disengagement. A "no-round-trips" check is reactive and fails to prevent new cycles.

  Sophisticated choice—foreseeing future votes and blocking the first transition—is likely infeasible here. Rotating membership impedes consistent forward reasoning. The adviser’s sequential framing obscures the cyclical trap, and quarterly intervals disrupt the necessary backward induction. Members reasonably assess only the immediate "improvement."

  Adopting a fixed multi-year plan embodies *planning agency* (Bratman): we commit to a future course to resolve present coordination problems, treating the plan as a justified constraint. *Resolute choice* (McClennen) would require adhering strictly to the plan despite later preference shifts. A committee can achieve this functionally: by ratifying a detailed 3-year allocation with explicit, objective reopening triggers (e.g., CPI >5% for 2 quarters, real returns < -10% YoY) *and* a mandatory annual review. This binds future votes to the plan unless triggered, transforming our aggregation over time. It prevents churn while permitting adaptation to material changes, addressing the "freezing information" concern.

  **Strongest counterargument rejected:** The claim that "nothing was irrational" and that costs wouldn't recur ignores the structural incentive. The pairwise vote *ensures* the cycle repeats absent new information, as member preferences are stable. Real transaction costs were incurred *three times*; expecting spontaneous coordination to avoid recurrence is empirically unsupported. Precommitment via a plan with clear triggers *enhances* responsiveness to genuine change while blocking wasteful cycling, and new members retain full voting rights at annual reviews. The defect is systemic, not a correctable lapse in foresight.

  **Implementation:** Instruct the adviser to propose one plan incorporating elements from all three blocs (e.g., a 60/40 core with explicit inflation/growth tilts), subject to ratification at the March meeting. Include a schedule locking in annual reviews and defined macroeconomic/material underperformance triggers for potential interim revisions.

  --- 

  *Memo Tone & Key Choices Explained:*  
  - **Blunt Start:** Follows instruction by leading with the recommendation.  
  - **Diagnosis Precision:** Identifies aggregation (not voters or myopia) as flaw, guiding remedy selection.  
  - **Sophisticated Choice Feasibility:** Rejects it based on committee’s practical constraints.  
  - **Plan Details:** Specifies "multi-year" (3Y suggested), triggers, and annual review to counter rigidity objections.  
  - **Counterargument Engagement:** Directly refutes "no irrationality" by highlighting repeated costs and stable cycle mechanics.  
  - **Bratman/McClennen Integration:** Uses concepts functionally, avoiding academic digression.  
  - **Cost Emphasis:** Highlights $135K loss to ground the abstract cycle in concrete impact.
