  9. **General claim:** *Socially constructed categories are not real or causally efficacious; they are illusions we should eliminate.*  
     - **Yes** → Leaf: **Eliminativism About Race**  
     - **No** → Leaf: **Conservationism About Race**  
     - **Split** (e.g., "Yes for race, No for gender") → Leaf: **Gender as Position in Material Structure**  

  10. **General claim:** *The social element in construction means society shapes individuals to fit categories, but the categories themselves are independent.*  
      - **Yes** → Leaf: **Role-Based Account of Race**  
      - **No** → Leaf: **Realism About Race as a Social Kind**  
      - **Split** (e.g., "Yes for gender, No for race") → Leaf: **Gender as Produced Through Citational Practice**  

  11. **Vignette (b) claim:** *A currency stripped of legal-tender status that still circulates is real money because it is useful, not because of state power.*  
      - **Yes** → Leaf: **Money as Commodity Elevated by Saleability**  
      - **No** → Leaf: **Money as State-Defined Unit of Account**  
      - **Split** (e.g., "Yes for commodities, No for fiat") → Leaf: **Money as Credit and Debt Relations**  

  12. **General claim:** *A category being socially constructed means it is recent and novel, not ancient or inevitable.*  
      - **Yes** → Leaf: **Money as Status Collectively Accepted**  
      - **No** → Leaf: **Money as Credit and Debt Relations**  
      - **Split** (e.g., "Yes for gender, No for money") → Leaf: **General Conferralist Account**  

  13. **General claim:** *Social categories are real only if they have effects independent of beliefs (e.g., causing discrimination even if no one believes in them).*  
      - **Yes** → Leaf: **Realism About Race as a Social Kind**  
      - **No** → Leaf: **General Conferralist Account**  
      - **Split** (e.g., "Yes for race, No for money") → Leaf: **Money as Commodity Elevated by Saleability**  

  14. **Vignette (c) claim:** *The rise in a diagnosis's incidence after it becomes public shows the category is harmful and should be abandoned.*  
      - **Yes** → Leaf: **Eliminativism About Race**  
      - **No** → Leaf: **Conservationism About Race**  
      - **Split** (e.g., "Yes for psychiatry, No for identity") → Leaf: **Gender as Norm-Guided Self-Identification**  

  ---

  ### Leaves of the Tree  
  Each leaf provides: (1) Standard name of the position, (2) What it takes as doing explanatory work, (3) Its most awkward commitment.  

  1. **Eliminativism About Race**  
     - Explanatory work: Harmful outcomes (e.g., discrimination) are caused by false beliefs in biological or inherent differences.  
     - Awkward commitment: Must explain persistent disparities without using race as an explanatory factor.  

  2. **Conservationism About Race**  
     - Explanatory work: Race is a real social construct that causes inequality, so it must be conserved to rectify injustice.  
     - Awkward commitment: Relies on a category it seeks to dismantle, risking reification.  

  3. **Realism About Race as a Social Kind**  
     - Explanatory work: Race is a causally efficacious social kind that structures experiences (e.g., access to resources).  
     - Awkward commitment: Denies biological essence while asserting reality, leading to accusations of inconsistency.  

  4. **Role-Based Account of Race**  
     - Explanatory work: Racial categories are defined by roles (e.g., "stereotyped worker") regulated by cultural representations.  
     - Awkward commitment: Struggles when individuals reject or redefine roles (e.g., through activism).  

  5. **Gender as Position in Material Structure**  
     - Explanatory work: Gender is a place in relations of subordination/privilege (e.g., divisions of labor) that explains life outcomes.  
     - Awkward commitment: Difficulty accommodating non-binary or fluid identities within a structural binary.  

  6. **Gender as Produced Through Citational Practice**  
     - Explanatory work: Gender exists through repeated performances (e.g., speech or dress) that cite norms, not innate identity.  
     - Awkward commitment: Cannot ground a "true self" outside performative acts, undermining personal authenticity claims.  

  7. **Gender as Norm-Guided Self-Identification**  
     - Explanatory work: Gender arises from self-identification guided by social norms (e.g., defining oneself within cultural frameworks).  
     - Awkward commitment: Risks reducing gender to individual choice, neglecting structural constraints.  

  8. **General Conferralist Account**  
     - Explanatory work: Social kinds (e.g., borders) exist because they are collectively accepted (conferred) and enable functions (e.g., governance).  
     - Awkward commitment: Cannot explain categories that persist without active recognition (e.g., informal hierarchies).  

  9. **Money as Status Collectively Accepted**  
     - Explanatory work: Money works as a medium of exchange because groups accept it as such, enabling trade.  
     - Awkward commitment: Fails to explain why some objects (e.g., shells) become money and others do not.  

  10. **Money as State-Defined Unit of Account**  
      - Explanatory work: Money is a state-created unit for settling debts (e.g., taxes), sustained by legal demand.  
      - Awkward commitment: Cannot account for money in stateless societies or where state backing is irrelevant (e.g., crypto).  

  11. **Money as Commodity Elevated by Saleability**  
      - Explanatory work: Money emerges from markets as the most saleable commodity (e.g., gold), reducing transaction costs.  
      - Awkward commitment: Struggles with fiat money, which has no intrinsic value or saleability.  

  12. **Money as Credit and Debt Relations**  
      - Explanatory work: Money is credit/debt relations (e.g., IOUs) that predate physical mediums; tokens are secondary.  
      - Awkward commitment: Physical cash appears primary, obscuring the underlying social relations.  

  ---

  ### Vignette Analysis  
  For each vignette, leaves yield the same answer if they share all branch-question responses leading to them. Pairs failing separation indicate either a tree defect (insufficient questions) or genuine convergence (positions agree on core claims).  

  - **Vignette (a): Child without race vocabulary, patterned treatment**  
    - Same-answer leaves: **Realism About Race as a Social Kind** and **Role-Based Account of Race** (both answer "No" to Q1).  
    - Unseparated pairs: **Realism About Race** and **Conservationism About Race** (both answer "No" to Q9; convergence: both treat race as real and socially causal).  

  - **Vignette (b): Currency stripped of status, circulates locally**  
    - Same-answer leaves: **Money as Commodity Elevated by Saleability**, **Money as Credit and Debt Relations**, and **Money as Status Collectively Accepted** (all answer "No" to Q5).  
    - Unseparated pairs: **Money as Commodity** and **Money as Credit/Debt** (both answer "No" to Q11; defect: tree lacks question on physical vs. relational money).  

  - **Vignette (c): Diagnosis incidence rises with public awareness**  
    - Same-answer leaves: **Gender as Produced Through Citational Practice** and **Role-Based Account of Race** (both answer "Yes" to Q2).  
    - Unseparated pairs: **Gender as Citational Practice** and **Gender as Norm-Guided Self-ID** (both answer "Yes" to Q7; convergence: both see classification as transformative).  

  - **Vignette (d): Title abolished, deference persists**  
    - Same-answer leaves: **General Conferralist Account** and **Gender as Position in Material Structure** (both answer "Yes" to Q3).  
    - Unseparated pairs: **Conferralism** and **Money as Status Collectively Accepted** (both answer "Split" to Q8; convergence: both require recognition but allow informal persistence).  

