  ### Logical Space of Answer Combinations  
  The tree permits 108 combinations (3 answers × 12 questions, with pruning). 48 are occupied by leaves; 60 are unoccupied. Key unoccupied cells:  

  1. **Construction entails recency (Q12=Yes) + Category survives recognition withdrawal (Q6=No)**  
     - Why unoccupied: Incoherence. If a category depends on social practices (recency claim), it cannot survive their withdrawal.  
     - Example neglect sketch: A view where categories are ancient but dormant until constructed (e.g., "racial potentials activated by society"). Requires recency for the constructed form but survival due to latent features.  

  2. **Kind constructed (Q1=No) + Individuals not constructed (Q10=Yes)**  
     - Why unoccupied: Instability. If the kind is constructed, individuals must be shaped to fit it; otherwise, the kind lacks instances.  
     - Example neglect sketch: A "conceptualist realism" where kinds are mind-independent but concepts shape how we group pre-existing individuals. Unstable under pressure, as grouping requires social action.  

  3. **Boundaries require institutions (Q9=Yes) + Category changeable at will (Q6=Yes)**  
     - Why unoccupied: Political unattractiveness. Institutions resist change, so categories tied to them cannot be easily altered. No major theory endorses this, as it implies impotent construction.  
     - Example neglect sketch: A "voluntarist institutionalism" where institutions are malleable by collective will (e.g., protest-driven reform). Neglected due to skepticism about institutional plasticity.  

  4. **No response to classification (Q7=No) + Population changes (Q4=Yes)**  
     - Why unoccupied: Explanatory unattractiveness. If classification doesn’t change people, population changes cannot be attributed to it.  
     - Example neglect sketch: A "structural determinism" where macro-forces (e.g., economics) change populations, but classification is epiphenomenal. Neglected as it denies agency.  

  ---

  ### Self-Criticism  
  The tree misfiles **class** (e.g., socioeconomic status). Class often relies on material relations (e.g., capital ownership) that persist without recognition, but the tree assumes social construction requires human acknowledgment. This misfiling arises in **Q6 (General claim: "Social practices are necessary for the category's existence")**. Class would require "No" (it survives practice withdrawal due to material conditions), but Q6's wording conflates social and material dependence.  

  **Rewrite for Q6:**  
  - Original: *"The social practices that create a social category are necessary for its continued existence; if practices stop, the category ceases to exist."*  
  - Revised: *"If society abandoned all practices related to a social category (e.g., stopped acknowledging or acting on it), the category would vanish because it depends on those practices."*  
  - **How it accommodates class:** The revised question clarifies "practices" exclude material conditions. Class could now answer "No" (e.g., "capital ownership persists without acknowledgment"), avoiding misfiling as conferralism or eliminativism.
