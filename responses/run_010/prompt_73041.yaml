  ### Decision Tree for Social Construction Beliefs

  **Instructions:** Answer each question based on your intuitive judgment of the concrete scenario or claim. Choose **Yes**, **No**, or **Split** (e.g., "Yes for concepts, No for instances"). Proceed to the next node as directed. No prior knowledge of theory is required.

