     - **Yes** → Go to Q8  
     - **No** → Go to Q9  
     - **Split** (e.g., "Yes for individuals, No for the kind") → Go to Q10  

  4. **General claim:** *If society stopped recognizing a social category (e.g., race or gender), the category would still exist because the people in it have inherent features.*  
     - **Yes** → Go to Q11  
     - **No** → Go to Q12  
     - **Split** (e.g., "Yes for race, No for gender") → Leaf: **Gender as Position in Material Structure**  

