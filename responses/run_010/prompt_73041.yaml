     - **Yes** → Leaf: **Money as State-Defined Unit of Account**  
     - **No** → Go to Q13  
     - **Split** (e.g., "Yes for state purposes, No for local use") → Leaf: **Money as Credit and Debt Relations**  

  6. **General claim:** *Socially constructed categories (e.g., gender) are arbitrary and could be changed at will by society.*  
     - **Yes** → Leaf: **Gender as Norm-Guided Self-Identification**  
     - **No** → Leaf: **Gender as Produced Through Citational Practice**  
     - **Split** (e.g., "Yes for boundaries, No for the kind") → Leaf: **Role-Based Account of Race**  

  7. **General claim:** *Classifying people under a social category changes the population's characteristics (e.g., they adopt new behaviors).*  
