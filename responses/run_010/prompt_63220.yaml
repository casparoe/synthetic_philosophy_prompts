  ## The Bookkeeper's Last Entry  
  *(after the great unmeasuring)*

  I was the sum inside, the bright degree  
  that warmed the blood. I tallied and I rose.  
  I knew what each man gained, what made him free.  

  Now watch: he takes the apple, not the rose,  
  when both are offered. Why? I must not ask.  
  I only trace what ordering he chose.  

  Give coin for fruit he’ll later shed, a task  
  repeated: coin for bloom when fruit is near,  
  then coin for apple... See the hollowed cask  

  of coins grow light? Yet each exchange was clear  
  and, in its moment, sound. The single act  
  betrays no flaw. The pattern makes it dear  

  and damning. Three paths taken, three contacts  
  where will seemed sovereign. Now the circle’s spun:  
  he stands with apple, lighter purse, the facts  

  aligned. I cannot say he chose against his own good.  
  I cannot form the sentence that he chose for principle,  
  or stood where sacrifice was understood.  

  I cannot weigh one loss against one soul  
  made glad elsewhere. My tongue arrests, denies  
  those old assertions. I exist, a whole  

  constructed *if* the choices harmonize,  
  refuse the circling path. No inner word  
  remains when preference itself belies.

  ---

  **Margin Note:**  
  *Line 24:* "remains when preference itself belies." closes the rhyme circle with "word" (line 1), enacting the forbidden cycle.  
  *Line 17 ("I cannot say he chose against his own good"):* Forbids welfare judgments implying mistaken choice.  
  *Line 18 ("I cannot form the sentence... chose for principle"):* Excludes non-self-interested motives from the model.  
  *Line 19 ("I cannot weigh one loss against one soul"):* Rejects interpersonal comparability/cardinal summation.
