  ### **In-Class Activity: The Sentience Gambit**

  #### **Activity Structure**
  - **Duration**: 75 minutes total  
  - **Participants**: 26 students → **5 groups** of 5-6 students each  
  - **Materials**:  
    - 11 "Case Cards" (biological entities with neutral facts)  
    - "Sentience Tokens": **20 tokens per group** (physical counters or tally marks).  
    - Scoring sheets for binary judgments.  
  - **Core Mechanic**: Groups assign tokens to entities they deem conscious *before* seeing the next card. Tokens are **irreversible** and **limited**. After all cards, groups assign binary judgments (conscious: yes/no). Scoring **penalizes over-inclusion** (assigning tokens to non-conscious entities) and **under-inclusion** (failing to assign tokens to conscious entities).  

  ---

  #### **Case Cards (11 Total)**  
  *Each card states only biological/functional facts. No hints about consciousness.*  

  1. **Human**  
     - *Homo sapiens*. Complex language, theory of mind, self-recognition in mirrors. Brain: 86 billion neurons.  

  2. **Honeybee**  
     - *Apis mellifera*. Learns navigation by watching other bees. Brain: <1 million neurons. Exhibits dance communication.  

  3. **Whole Octopus**  
     - *Octopus vulgaris*. Solves puzzles, uses tools, plays. Central brain (500M neurons) + 2/3 neurons distributed in arms.  

  4. **Severed Octopus Arm**  
     - Arm detached from *Octopus vulgaris*. Continues solving tasks (e.g., opening jars) for 1+ hour without central brain input.  

  5. **Sea Anemone**  
     - *Metridium senile*. Nerve net (no brain). Reacts to touch/stimuli but no learning/memory. Reproduces asexually.  

  6. **Human Gut Neurons**  
     - Enteric nervous system. 500M neurons. Operates independently: digests food, reacts to toxins without brain signals.  

  7. **African Grey Parrot**  
     - *Psittacus erithacus*. Uses English words contextually, understands concepts like "same/different." Brain: 300M neurons.  

  8. **Venus Flytrap**  
     - *Dionaea muscipula*. No neurons. Electrical signals trigger rapid closure when prey touches hairs twice.  

  9. **Boston Dynamics Spot Robot**  
     - AI-driven quadraped. Navigates rubble, avoids obstacles, learns terrain. No biological components.  

  10. **Large Language Model (e.g., GPT-4)**  
      - Predicts text via neural networks. Generates poetry, debates philosophy, passes Turing tests in limited domains.  

  11. **20-Week Human Fetus**  
      - Developing brainstem/thalamus. Responds to sound/touch. Lacks cortical layers for sensory integration.  

  ---

  #### **Round Structure & Timings**  
  1. **Intro (5 min)**:  
     - Explain rules:  
       - Groups have **20 tokens** to assign across 11 cases.  
       - Assign tokens *before* seeing the next card. Tokens **cannot be reclaimed**.  
       - After all cards, groups decide **binary judgments** (conscious: yes/no) for each entity.  
     - **Scoring Rule**:  
       - **+X points** for tokens assigned to entities judged *conscious*.  
       - **-X points** for tokens assigned to entities judged *not conscious*.  
       - *Max score = 20* (if all tokens go to conscious entities). *Min score = -20* (if all tokens go to non-conscious entities).  

  2. **Case Rounds (40 min)**:  
     - Reveal cards **one at a time** (projected or printed).  
     - **3.5 min per card**:  
       - 1 min: Read card silently.  
       - 2 min: Group discussion.  
       - 0.5 min: Assign tokens (record publicly).  
     - *Groups track remaining tokens*.  

  3. **Binary Judgment (10 min)**:  
     - Groups decide **yes/no** for consciousness per entity.  
     - Critical: For octopus, judge **whole octopus** and **severed arm** *separately*.  

  4. **Scoring (5 min)**:  
     - Groups calculate scores using their binary judgments.  
     - Report scores publicly.  

  5. **Debrief (15 min)**:  
     - Highlight scoring pain points (e.g., groups with negative scores).  
     - Map struggles to philosophy of mind frameworks:  
       | **Sticking Point**          | **Philosophical Framework**       | **Cost**                                  |  
       |-----------------------------|-----------------------------------|-------------------------------------------|  
       | "Honeybee/LLM deserve tokens!" | **Behaviorism**                   | Includes robots/LLMs (over-inclusion).    |  
       | "Gut neurons aren’t a *self*!" | **Higher-Order Theories**         | Excludes animals without self-awareness. |  
       | "Octopus arm is just reflexes!" | **Neural Convergence**            | Excludes distributed cognition (anemones).|  
       | "Fetus has *potential*!"      | **Evolutionary/Functional Theories** | Includes entities without subjective experience (e.g., plants). |  
     - Reveal the trap: **No criterion includes all "intuitive" cases (parrot, human) without over-including (anemone, gut neurons) or under-including (honeybee, severed arm)**.  
     - Name the "isms" only now:  
       - "You tried to build behaviorist, functionalist, or neuro-centric criteria—all face the **underdetermination problem**."  

  ---

  #### **Predicted Problems & Fixes**  
  - **Problem 1: Groups hoard tokens early, run out later**.  
    - *Fix*: Remind them *after Card 3*: "You cannot assign tokens retroactively. Spend wisely!"  
  - **Problem 2: Binary judgments cause deadlock over octopus arm**.  
    - *Fix*: Force a vote: "Majority rules. If tied, split tokens evenly."  
  - **Problem 3: Students debate ethics ("But fetuses *should* be conscious!")**.  
    - *Fix*: Refocus: "Stick to biological facts. Your gut neurons don’t care about *should*."  
  - **Problem 4: Low stakes feel "gamey"**.  
    - *Fix*: Announce: "Top-scoring group picks tomorrow’s discussion topic."  

  ---

  #### **What the Activity Can’t Do (Supply This in Debrief)**  
  The activity **cannot simulate the hard problem of consciousness**: Why do some systems *feel like something*? Students experience this gap when they:  
  - Assign tokens to the LLM but feel uneasy calling it "conscious."  
  - Judge the severed arm "not conscious" despite its intelligence.  
  **Explain**: "Your discomfort mirrors the **explanatory gap**—no test captures *phenomenal experience*. That’s why philosophers like Chalmers say consciousness might be **fundamental**, not reducible to functions or neurons."  

  ---

  #### **Why This Works**  
  - **Octopus Arm Splits the Room**:  
    - Groups that call the arm conscious **lose tokens** if later judging it non-conscious (over-inclusion).  
    - Groups that deny it consciousness **miss points** if judging it conscious (under-inclusion).  
    - *Result*: Forces tradeoffs—e.g., "If the arm is conscious, is the sea anemone? What about gut neurons?"  
  - **Payoff Mechanics Reward Precision**:  
    - Assigning 3 tokens to a gut neuron later deemed non-conscious **costs -3**.  
    - Assigning 0 tokens to a honeybee later deemed conscious **gains 0** (a missed chance).  
  - **No Early Lecturing**: Students *feel* the problem before labeling it, making the debrief "aha!" moment land harder.  

  Run this tight, high-stakes simulation, and they’ll leave agonizing over anemones—mission accomplished.
