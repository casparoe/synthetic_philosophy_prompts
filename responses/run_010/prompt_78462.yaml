prompt: |-
  I am a philosophy senior, and next Friday I defend my undergraduate thesis in a public oral examination: twenty minutes of presentation, then sustained questioning from my three-person committee, then an open floor for the rest of the thesis seminar. I would like a preparation sheet for the question period. I am not looking for a defense of my thesis, a summary of the debate, or a list of references — I have read the literature and my committee has read two drafts. What I need is a realistic map of which of my moves will be attacked, by whom, in what order, and how much damage each attack will do.

  My thesis concerns Kim's causal exclusion argument, and my position is deliberately unfashionable in my seminar. The argument has four steps.

  1. I grant the exclusion argument as an attack on nonreductive physicalism. Given the causal closure of the physical plus a ban on systematic overdetermination, a mental property distinct from its physical realizer does no causal work at the level at which the physical story is told. I do not try to block closure, and I do not try to block the overdetermination premise.
  2. I claim the standard conclusion — epiphenomenalism or eliminativism — depends on a premise Kim leaves tacit: that a causal claim is true or false simpliciter, at one privileged level.
  3. Against that, I argue causal relations are level-relative in a metaphysical rather than a merely pragmatic sense. A mental property M can be a cause relative to a coarse-grained set of variables, and its realizer P a cause relative to a finer-grained set, and both claims are literally true, with no further fact of the matter about which is the causation. What fixes the level is not our explanatory interests but the grain at which interventions on the system are possible in principle — I call this the interventional grain.
  4. Therefore nothing at the mental level ever changes what happens at the physical level. My view requires no downward causation, and I present that as a feature: psychology and moral responsibility get everything they need from level-relative causation, and physicalism is never threatened.

  The committee and the room:

  - My advisor is a metaphysician who works on realization and grounding and is broadly sympathetic to Kim. He has told me twice that step 3 "looks like Yablo's proportionality thesis with extra machinery," and that if that is all it is, I have not answered Kim so much as changed the subject.
  - My second reader is a philosopher of action and of psychological explanation. She is no reductionist, but she thinks reasons-explanation is a different kind of explanation, and that framing the dispute in terms of mental properties being "causes" already concedes the wrong picture. She will want to know what my view accomplishes that the far simpler claim — that psychological explanation is not causal explanation — would not.
  - My third reader works on causation and is an interventionist. He will press hardest on "possible in principle": which interventions count, whether interventions on M that unavoidably also fix P show M is not a cause, and whether my "no further fact" clause renders causal claims indeterminate in a way that his own framework does not.
  - The open floor will have roughly a dozen classmates who have read the anthology's presentation of the exclusion argument and one response paper, and who will ask blunt, large questions.

  Please give me the following:

  1. Eight to ten objections, ordered by how damaging they would be if I answered them badly, each tagged with the person most likely to raise it and phrased the way that person would phrase it — their vocabulary and their framing, not mine.
  2. For each, a reply I could actually deliver out loud in about two minutes, written as speech rather than as hedged prose, followed by one sentence saying where that reply is soft.
  3. Your judgment on which single objection is fatal if I cannot answer it, and what I should concede in my first five minutes so that it lands as a concession rather than a retreat.
  4. A short list of things I should volunteer before they are extracted from me.
  5. The question I am hoping nobody asks, plus the best reply I could give if it comes anyway.
  6. Two or three open-floor questions that will sound naive but are genuinely hard to answer, with replies that do not talk down to the asker.
  7. A one-sentence reformulation of my thesis that I could announce in the room if the committee turns out to be right — the most I can give up and still have something worth defending.

  I suspect my softest point is the "no further fact" clause in step 3, but I may be wrong about that, and I would rather you say so plainly. Likewise, if you think one of my four steps is simply indefensible, tell me at the top of the sheet instead of building objections around it. Do not cite or recommend any literature, and do not invent references: if a reply turns on a move from the literature, describe the idea in your own words. Also do not pad the sheet with objections my step 1 already absorbs — the committee knows exactly what I have conceded.
reasoning: |-
  Okay, I need to help a philosophy senior prepare for their thesis defense on Kim's causal exclusion argument. They've provided a clear breakdown of their thesis and the committee members. Let me start by understanding their position thoroughly.

  Their thesis has four key steps. First, they accept the exclusion argument against nonreductive physicalism, conceding causal closure and no overdetermination. Second, they argue that Kim's tacit premise—that causation is absolute—is the real issue. Third, they propose level-relative causation based on interventional grain. Fourth, they conclude that this avoids downward causation while preserving psychology and moral responsibility.

  The committee consists of three members with specific concerns. The advisor thinks step 3 is similar to Yablo and might not address Kim. The second reader questions why mental causation is needed instead of non-causal explanation. The third reader will challenge "possible in principle" interventions and the "no further fact" claim.

  The student wants a realistic map of objections, ordered by damage potential, with responses. They also need concessions, preemptive points, a worst-case question, open-floor handling, and a fallback thesis statement.

  First, I need to identify the most damaging objections. The "no further fact" clause seems vulnerable, especially from the interventionist. If causation is level-relative without a fact of the matter, does that lead to indeterminacy? That could undermine the whole argument. Also, the advisor's Yablo comparison is critical—if the student is just restating proportionality, they haven't answered Kim.

  The second reader's challenge about non-causal explanation is significant. If psychological explanation doesn't need causation, why complicate things? The student must show what's gained by keeping causation level-relative.

  For the open floor, questions about moral responsibility or determinism might arise. These are broad but need careful answers that tie back to level-relativity without oversimplifying.

  The fatal objection is likely the advisor's: if step 3 is just Yablo, it doesn't engage Kim. The student should concede that they're redefining causation but argue it's necessary to resolve the exclusion problem. Preemptively, they should mention that their view avoids epiphenomenalism without downward causation, addressing the second reader's concerns early.

  The worst question might be about whether interventional grain is observer-dependent, which threatens objectivity. The response should clarify it's about in-principle interventions, not practical ones.

  Finally, the fallback thesis should emphasize that level-relative causation salvages mental causation within physicalism. Each part needs to address the specific committee member's style while staying concise. Making sure responses are spoken-style, not academic prose, is crucial for delivery.
answer: |-
  ### Preparation Sheet: Kim's Exclusion Argument Defense  
  **Core Vulnerability:** Your "no further fact" clause (Step 3) is the critical pressure point. If it collapses, your entire level-relativity thesis unravels. The third reader’s interventionist challenge is the most lethal if unaddressed.  

  ---

  ### 1. Objections Ordered by Damage Potential (High to Low)  
  *(Phrased in the opponent’s voice)*  

  **8.1 Fatal Objection (Third Reader):**  
  *"You claim causal relations are metaphysically level-relative, fixed by ‘interventions possible in principle.’ But interventions require specifying variables, which presupposes a prior choice of grain. If grain determines truth-conditions for causation, and grain itself has ‘no further fact’ grounding it, aren’t all causal claims radically indeterminate? This violates interventionism’s commitment to objective causal structure."*  
  **Your Reply (2 mins):** "You’re right that interventionism typically assumes a fixed variable set. But on my view, grain isn’t arbitrary—it’s fixed by the system’s *modal profile*: what interventions are metaphysically possible *on the system itself*, independent of us. For example, in a neuron, intervening on ion channels (fine grain) is possible in principle, but intervening *only* on ‘pain’ (coarse grain) without affecting its physical realizer isn’t. This modal constraint makes grain objective. ‘No further fact’ means no *causal* fact beyond what’s true relative to a grain, not that grain is subjective."  
  **Soft Spot:** "Metaphysically possible interventions" is underspecified; it risks circularity if grain defines possibility.  

  **8.2 Critical Objection (Advisor):**  
  *"This is Yablo’s proportionality in a lab coat. Yablo argued mental causes are ‘proportionate’ because they’re more abstract than physical details. You add ‘interventional grain,’ but if all you’ve done is swap ‘proportionality’ for ‘grain,’ you’ve dodged Kim. Kim’s point is that the *physical* level is causally closed and metaphysically privileged. Your view doesn’t answer that—it just declares other levels ‘real’ by fiat."*  
  **Your Reply:** "I agree Kim targets physical-level closure, but Yablo’s proportionality is about *explanation*—it’s epistemic. My interventional grain is metaphysical: it’s about what causal relations *exist* relative to a system’s intervention-tolerant structure. Crucially, I concede the physical level is closed! But closure at fine grain doesn’t erase causation at coarse grain. Kim’s error is assuming causal claims must be absolute. I’m not changing the subject; I’m showing his tacit premise is false."  
  **Soft Spot:** Distinguishing your "metaphysical" grain from Yablo’s "epistemic" proportionality is subtle and may not convince.  

  **8.3 Major Objection (Second Reader):**  
  *"Why force psychology into a causal straitjacket? If you admit mental properties don’t change physical outcomes, why not say psychological explanation is *non-causal* (e.g., rational or normative)? That avoids all this machinery and still preserves reason-giving. Your view seems like a convoluted way to say ‘mental causation isn’t physical causation,’ which nobody disputes."*  
  **Your Reply:** "Because if psychology isn’t causal, we lose counterfactual force. If I act for a reason, we say *that reason* made a difference—it wasn’t just inert. My account secures that: relative to coarse grain (e.g., ‘beliefs’ and ‘desires’), mental states *are* difference-makers. If we deny causation, moral responsibility collapses into mere description. My view keeps causation *real* but level-bound, so reasons genuinely explain outcomes."  
  **Soft Spot:** Assumes moral responsibility requires causation; your second reader likely denies this.  

  **8.4 Major Objection (Third Reader):**  
  *"Interventions on M always fix P (its physical realizer). If intervening on M requires manipulating P, doesn’t that prove M is causally inert? Your ‘grain’ seems ad hoc to save mental causation."*  
  **Your Reply:** "Not at all! In interventionist terms, M is a cause relative to coarse variables because fixing M *while holding fixed* other mental states (not physical details) changes outcomes. Yes, in practice we manipulate P to change M—but that’s because we’re stuck at fine grain. In principle, if we could intervene *only* on M (e.g., in a computational model), it would show M’s efficacy. The overdetermination ban only bites when causes operate at the *same* grain."  
  **Soft Spot:** "In principle" interventions may sound like science fiction.  

  **8.5 High-Risk Objection (Advisor):**  
  *"You say ‘no downward causation,’ but if mental causation is real and the physical is closed, how does M *not* override P? If M causes M* (another mental state), and M* is realized by P*, don’t you need M to cause P*?"*  
  **Your Reply:** "No—causing M* just *is* causing its realizer P* *relative to coarse grain*. At fine grain, P causes P*. There’s no ‘override’ because causation isn’t transitive across grains. It’s like saying a software update ‘causes’ a computer to crash: coarse grain (software) and fine grain (circuitry) tell compatible stories without competition."  
  **Soft Spot:** Denying transitivity across grains needs more defense.  

  **8.6 Medium Objection (Second Reader):**  
  *"If causal relations are grain-relative, is moral responsibility grain-relative too? That seems absurd. We don’t punish people ‘relative to a description.’"*  
  **Your Reply:** "Responsibility tracks the grain at which agents act. When we say ‘you caused harm,’ we mean relative to the grain of intentional actions (e.g., ‘you pulled the trigger’), not neurotransmitters. This grain is fixed by what interventions were possible *for the agent*—could they have chosen otherwise? Physical closure doesn’t threaten this, because the physical story doesn’t *compete* with the agential one."  
  **Soft Spot:** Links between grain-relativity and free will need more work.  

  **8.7 Medium Objection (Open Floor):**  
  *"If everything is physical, and mental properties are just patterns in physical stuff, how can they *do* anything extra?"*  
  **Your Reply:** "They don’t do *extra*! At fine grain, only physical properties do the work. But at coarse grain, mental patterns are what we intervene on to change outcomes. Think of a traffic jam: its ‘causes’ are driver decisions (coarse) or particle motions (fine). Both are real, but you fix jams by changing driver behavior, not particles. The physical isn’t threatened—it’s just not the whole story."  
  **Soft Spot:** Risks sounding like dualism to non-specialists.  

  **8.8 Low-Impact Objection (Open Floor):**  
  *"Isn’t this just saying causation is subjective?"*  
  **Your Reply:** "Not at all. Grain is fixed by the system’s structure, not us. We *discover* what interventions are possible—we don’t invent them. The fact that we describe grains doesn’t make them less real, just like describing continents doesn’t make geography subjective."  
  **Soft Spot:** Easy to rebut but wastes time if over-explained.  

  ---

  ### 2. The Fatal Objection & Strategic Concession  
  - **Fatal If Unanswered:** Third reader’s indeterminacy challenge (8.1).  
  - **Concede Early (First 5 Mins):** "I concede that if interventional grain were pragmatic, my view would collapse into subjectivism. But it’s not: grain is fixed by *what the system permits*. For example, a brain permits interventions on synapses but not *only* on consciousness—that’s a metaphysical constraint, not a limitation of our tools. This objectivity shields me from the ‘no fact’ worry."  

  ---

  ### 3. Volunteer Before Extracted  
  - "I am *not* claiming mental causation changes physical outcomes."  
  - "I agree with Kim that nonreductive physicalism fails; my solution requires redefining causation."  
  - "My view implies causal claims are *incomplete* without specifying grain."  

  ---

  ### 4. The Question You Hope Nobody Asks + Reply  
  **Question:** *"If an omniscient being saw the universe at the finest physical grain, would they see any ‘mental causation’ happening, or just particles?"*  
  **Reply:** "They’d see the physical story—but also see that certain patterns (mental states) are robustly difference-making *relative to coarse variables*. Just as a physicist sees quarks but a biologist sees cells, the truth of coarse-grained causation doesn’t vanish with more knowledge; it’s just not visible at that resolution."  

  ---

  ### 5. Open-Floor Questions (Naive but Hard) + Replies  
  **Question 1:** *"Doesn’t physical determinism mean our thoughts are pointless?"*  
  **Reply:** "Not at all! Determinism is a fine-grained claim. At the coarse grain of psychology, your thoughts *are* the point—they’re what steer your actions. The physical story doesn’t ‘overrule’ this; it describes the same world differently."  
  **Question 2:** *"Can’t we just say everything is physical and be done?"*  
  **Reply:** "We could—but then we couldn’t explain why we punish murderers but not earthquakes, or why psychology isn’t just physics. My view explains why both levels matter without contradiction."  

  ---

  ### 6. Fallback Thesis Reformulation  
  **One-Sentence Retreat:**  
  *"Even if mental properties don’t add physical causal power, level-relative causation rescues psychology and agency from epiphenomenalism by showing how mental states make counterfactual differences at their own grain."*  

  ---

  **Final Note:** Your Step 3 is defensible but brittle—focus all energy on grounding "interventional grain" in modality, not pragmatics. Step 4 is your strongest asset; wield it ruthlessly. **Do not defend Step 1;** your concessions are clear. Good luck.
