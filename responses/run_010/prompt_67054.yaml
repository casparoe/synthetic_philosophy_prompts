  ## The Cool Hand

  The alarm blares, a single, sustained note that slices through the hum of the reactor level. Not critical. Just hot. Sector Delta-7, junction manifold. Again. Lena doesn’t flinch. Her gloved fingers, thick inside the lead-lined suit, tighten on the decon sprayer’s trigger. Eleven years in the core, eleven years since the Anodyne. The sound is data, nothing more. A location. A problem to solve.

  She moves down the access corridor, boots thumping dully on the grated floor. Residual radiation prickles against her skin sensors – a localized heat bloom registering precisely across her back and shoulders, a 7.2 on the absorbed dose scale her implant feeds silently into her visor display. It’s uncomfortable the way a heavy backpack is uncomfortable: a fact of weight and pressure, demanding adjustment, not cessation. She shifts her stance slightly, redistributing the burden across her frame. No urgency sparks. No dread coils in her gut. The numbers are high, but manageable within her shift tolerance. She has hours yet.

  Inside the Delta-7 containment lock, the heat intensifies. Steam hisses from a faulty valve seal near the primary heat exchanger. The air shimmers. Her suit’s internal climate control whines, struggling. The thermal reading on her forearm jumps: 52°C ambient. Sensation floods her – a deep, penetrating warmth radiating through the suit layers, settling into her muscles like an immersion bath pushed too far. She notes it clinically. *Diffuse thermal saturation, epidermal layer, approx. 48°C equivalent. Dehydration risk elevated.* She unslings the decon unit, adjusts the nozzle, and begins spraying the viscous coolant onto the leaking valve assembly. The steam plume instantly condenses into a greasy mist. The heat against her skin lessens fractionally, logged as a sensory shift, not relief.

  Lunch is in the "Garden," Level 3’s bio-scrubbed cafeteria. Plastic trays, recycled air smelling faintly of ozone and synthetic protein. Lena finds her usual spot. Across from her, Ren, a new transfer from Waste Processing, picks listlessly at his nutrient cake. Sweat beads on his upper lip, his eyes tight. He’s raw. Not Anodyned yet.

  "Man, that Gamma chute this morning," Ren mutters, rubbing his shoulder. "Felt like my arm was getting microwaved through the suit. Had to tap out early for a med check. Clean bill, just... intense." He shudders visibly. "How do you guys *do* it? Delta-7’s worse, right?"

  Lena swallows a bite of her own cake, tasteless paste. "It’s hot," she acknowledges. "Sensors register high thermals consistently." She flexes her own hand on the table. No tremor. No lingering phantom ache from the morning’s work.

  "But it doesn't… *bother* you?" Ren presses, leaning forward. "The heat, the pressure, that weird static buzz in high-rad zones? Feels like ants crawling under your skin."

  Lena considers. She remembers the feeling – vaguely. A memory of childhood sunburn, the desperate urge to escape the heat. Now, it’s just input. "It registers," she says carefully. "Location, intensity, quality. But the… alarm? The part that makes you want to run? That’s gone." She meets his anxious gaze. "You focus on the job. The readings. The procedure. You don’t waste energy on the noise. You get the work done, efficiently, without the distraction screaming at you to stop. Your body signals stress – mine just logs parameters. Less fatigue, honestly. Less mental load." She gestures around the cafeteria at the other cool hands, eating calmly, chatting in low voices. No winces. No tension lines etched deep. "Look at us. We clock in, we do the impossible, we clock out. We sleep sound. We collect premium pay. The Anodyne isn't magic, Ren. It’s just focus. Pure, uncluttered focus on the task."

  Ren stares at her, then at his trembling hand resting on the tray. The fear in his eyes wars with a desperate kind of longing. "Focus," he echoes softly.

  The locker room after shift reeks of ozone, stale sweat, and something else. Something sweetly putrid, like rotting fruit left in a damp corner. Lena wrinkles her nose, a purely olfactory reaction. She unseals her suit, the heavy layers peeling away. The cool air hits her bare skin. She methodically checks her seals, logs the suit’s radiation exposure in her tablet. Routine.

  As she bends to pull off her inner thermal liner, her left knee protests. Not pain. A distinct stiffness, a locking sensation as the joint extends fully. She pauses, observes it. *Restricted range of motion, left knee joint. Probable inflammation.* She makes a mental note to mention it at her quarterly med-screen. No urgency. It doesn’t *hurt*. It just… resists.

  She pulls off the liner. The smell intensifies. It clings to her, specifically to her left foot. She sits on the bench and examines it. The skin is reddened, mottled with patches of angry purple bruising spreading from the arch towards the heel. Between the toes, the skin is macerated, white and peeling, weeping a clear fluid. The source of the smell. She prods the bruised arch gently. The tissue yields, spongy. Deep pressure sensation registers, localized. No pain. Just resistance. *Significant contusion and possible tissue necrosis, left foot. Secondary fungal/bacterial infection likely.* She logs the observation internally. She must have twisted it weeks ago, stepping awkwardly off a service ladder in Sector Echo. She’d noted the lateral instability at the time, adjusted her gait to compensate. The compensatory motion must have subtly shifted her weight distribution, increasing pressure… slowly, silently.

  She stands to get her shower kit. Her left leg buckles slightly as she puts weight on it. Not a stumble, just a fractional hesitation, a micro-stutter in her step she instantly corrects. No one else in the buzzing locker room notices. She walks to the showers, favoring the leg just enough to minimize the instability, a slight, unconscious hitch in her stride. The hot water sluices over her. She scrubs mechanically. The water stings the open lesions between her toes – a sharp, localized sensation she registers dispassionately. *Cleansing agent contact with compromised dermis.* The bruise throbs dully under the pressure of her washcloth, a deep, rhythmic pressure wave. Data points.

  Back at her locker, dressing in civvies, she catches her reflection. Pale. Thin. Shadows under her eyes seem deeper than last week. She dismisses it. Shift work. She pulls on a sock over the damaged foot. The fabric brushes the weeping skin. *Friction on abraded tissue.* She ties her boot, the laces snug over the swollen arch. *Constructive pressure on inflamed site.*

  Her hand, reaching for her bag, trembles. A fine, rapid vibration she watches with detached curiosity. *Minor tremor, right hand. Possible neural fatigue or electrolyte imbalance.* She makes another mental note. She needs to hydrate more.

  She walks out into the employee lot. The sodium lights cast long, harsh shadows. Her left foot lands with a heavier tread than the right. The tremor in her hand persists. She thinks of Ren’s scared eyes, her own calm words about focus. She thinks of the sweet-rot smell clinging to her boot. She thinks of the reactor core, its silent, seething heat waiting for her tomorrow.

  She reaches her beat-up electro-sedan. Fumbles the key fob. The tremor makes the small button elusive. She tries to steady her right hand with her left, but the grip feels clumsy, weak. She stares at her hands, pale under the parking lot lights, one trembling, the other pressing down on it with ineffective force. Focus. Pure, uncluttered focus. Her gaze drifts past the trembling hands to the car door handle. It’s scratched, dull metal. Solid. Real. She takes a slow breath, the cool night air filling her lungs. The tremor subsides, momentarily stilled by the pressure of her left hand. She lifts her right hand away, watching it hang in the air, poised, waiting to obey.

  Lena reaches out. Her fingers wrap around the cold metal of the door handle. She doesn’t pull it open. She just holds on. Tight. Her knuckles whiten under the lot lights. She stands there, motionless, gripping the handle like it’s the only solid thing left, staring straight ahead at the chain-link fence and the darkened reactor complex beyond. The only movement is the faint, rhythmic tightening of her grip.
