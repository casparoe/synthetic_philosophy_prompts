prompt: |-
  I've spent twenty-two years as a non-life underwriter, and for the last nine of those I've worked in capital modelling: setting exposure limits peril by peril, deciding how much reinsurance to buy, arguing at committee about whether a loss curve nobody can validate should still drive a capital add-on. I have no philosophy training and no intention of acquiring any; what follows is something I've assembled for myself over a lot of evenings with articles I found online. Twice in the last decade my firm had to make a call that I now think was philosophical rather than technical — whether to keep writing property in a coastal county after a storm whose severity we had no basis for anticipating, and whether to touch wildfire exposure on the urban fringe at any price at all. In both cases we ended up declining business we could have sold profitably, and we described the decision to ourselves as prudence. Reading about the precautionary principle afterwards, I had the persistent feeling that my profession already runs on some version of it, and that the arguments about it are conducted in words I don't need.

  So here is what I'd like you to do. Restate that debate, as faithfully as you can manage, in the vocabulary I actually use at work. I mean specifically: expected loss and loss distributions, tail events and the probability of ruin, risk appetite and exposure limits, the difference between pricing a risk and refusing to write it, diversification and the way correlations collapse precisely when you need them not to, reinsurance as a means of moving a risk onto somebody else's balance sheet, capital held against model risk rather than against estimated losses, adverse selection and moral hazard, and the distinction we draw between a parameter we estimate badly and a process we cannot model at all. Take the main positions one at a time. First, the strong formulation, on which a novel activity should not proceed until it has been shown to be harmless. Second, the weak one, which I believe descends from a United Nations declaration adopted in Rio in 1992, and which holds that unsettled science is not by itself a reason to postpone measures proportionate to the seriousness of the threatened damage. Third, the objection that the principle is either empty or self-defeating, since inaction carries risks of its own and can therefore always be turned against itself, producing paralysis rather than protection. Fourth, the reply that this objection misses the point, because some harms cannot be undone, some losses fall on people who never agreed to bear them, and the burden of demonstrating safety should sit with whoever proposes the change rather than with whoever would be exposed to it. And fifth, the version I've seen described as maximin reasoning: a rule for choosing when you decline to attach probabilities at all, taking instead the option whose worst outcome you could survive.

  For each of those five I want an honest ledger rather than a paraphrase. Which claims map onto something my profession genuinely does, and would it recognise them as the same thing once translated? Which can be carried across only by quietly changing the subject — and be precise about what got changed in the carrying. And which have no expression whatsoever in an underwriter's toolkit? I have two suspicions of my own, and I want you to test them rather than flatter them. The first is that irreversibility does such heavy lifting in the philosophers' debate partly because my framework has only three boxes — a risk is priceable, reinsurable, or unwritable, and those three exhaust the space — so a harm that can be neither undone nor shifted onto a counterparty is not a category I can even form; that might mean my vocabulary is impoverished, or it might mean the category is doing no real work. The second is that the whole disagreement about acts and omissions, about causing harm being worse than failing to prevent it, simply dissolves in my world, because a loss is a loss on the ledger regardless of whose name is on the file; but I cannot tell whether that dissolution is a genuine insight into the debate or an artefact of a bookkeeping convention I've never questioned. Tell me which it is. Please don't smuggle my framework's assumptions in and present them as translations: if a position only makes sense on the premise that risks can be pooled, priced, or declined, say so rather than translating it into that premise. And finish with the verdict I actually care about — for each piece that failed to carry across, whether the failure exposes a hole in the way I think or exposes a claim that was never as clear as it sounded.
reasoning: |-
  Okay, let me unpack this fascinating request from a seasoned insurance professional. The user has spent 22 years in non-life underwriting with deep expertise in capital modeling, and they're trying to bridge philosophical debates about the precautionary principle with their practical insurance framework. 

  First, I need to recognize what they're really asking: they want the precautionary principle debate translated strictly into actuarial/underwriting terms, without philosophy jargon. But more importantly, they want to test two hypotheses about why certain philosophical concepts might not fit their professional toolkit.

  The user's background is crucial here - this isn't an academic exercise. They've faced real decisions where technical models failed (coastal property after unexpected storms, urban-wildfire interface), and their "prudence" calls mirrored precautionary thinking. Now they're reverse-engineering why philosophy debates feel alien despite similar concerns.

  Breaking it down:
  - Must map five philosophical positions to underwriting concepts
  - Audit where translations work, where they distort, where they fail
  - Specifically test their two suspicions about irreversibility and moral distinctions
  - No smuggling in insurance assumptions as universal truths

  Key challenges I anticipate:
  Their three-box risk framework (price/reinsure/decline) really is fundamental. Philosophical debates assume broader options. Also, insurance treats all losses as ledger entries - that neutrality might erase ethical distinctions philosophers care about.

  For the translation attempt:
  Strong precautionary principle → This maps well to "unwritable" risks where loss potential defies modeling. But unlike philosophers, underwriters would never demand proof of harmlessness - just modelability.

  Weak principle (Rio version) → Resonates with capital buffers for model risk. But "proportionate measures" is fuzzier - we set exposure limits, not precautionary policies.

  Paralysis objection → Very real in insurance! We constantly weigh opportunity cost of declining business. But our models force quantification where philosophers might avoid it.

  Reply about irreversibility → Here's where their "three boxes" struggle. Unmodelable irreversible harm? That's just "unwritable" - no special category. Suggests their framework might be limited.

  Maximin reasoning → Pure tail risk management! We do this daily with PMLs and risk appetite. Probably the cleanest fit.

  On their suspicions:
  First one hits hard - irreversibility doesn't create new boxes because insurance can't handle what can't be pooled/priced. Not impoverished thinking; just different domain.

  Second suspicion holds: "causing vs allowing harm" vanishes because all losses hit the ledger equally. But this isn't insight - it's a consequence of their risk-transfer paradigm. Philosophers care about agency; insurers care about balance sheets.

  Final verdicts on translation failures:
  Where philosophy assumes unquantifiable irreversibility matters, that exposes a hole - insurers must quantify to act. But where philosophers insist on moral distinctions between acts/omissions, that's not a hole in insurance thinking; it's just irrelevant to their models.

  Most revealing gap: Insurance needs to quantify precaution, while philosophy often rejects that. Not a flaw - just different games.
answer: |-
  Below is a rigorous translation of the precautionary principle debate into your underwriting vocabulary, followed by an audit of conceptual alignment and your two suspicions. I’ll strictly adhere to your framework’s rules: no smuggling in assumptions, explicit labeling where translation fails, and verdicts on gaps.

  ---

  ### **1. Strong Precautionary Principle**  
  *"Do not proceed until harmlessness is proven."*  
  **Translation:** Decline any risk where the loss distribution cannot be bounded or modeled, even if expected loss appears favorable. Treat unquantifiable uncertainty as a capital add-on so severe it makes the risk unwritable.  
  **Audit:**  
  - **Matches:** Your "unwritable" box for unmodelable perils (e.g., wildfire on urban fringe). Your capital add-ons for model risk directly mirror this.  
  - **Distorts:** Philosophers demand *proof of safety*; you require *modelability*. You’d decline a risk with unknown tail severity but positive expected profit (e.g., coastal property post-unprecedented storm). Philosophers wouldn’t necessarily.  
  - **Fails:** "Harmlessness" has no underwriting equivalent. Risks are never "harmless," only "priceable."  

  ### **2. Weak Precautionary Principle (Rio 1992)**  
  *"Unsettled science ≠ inaction; act proportionally to potential severity."*  
  **Translation:** When model uncertainty is high but severity potential is catastrophic (e.g., PML > risk appetite), apply exposure limits, sub-limits, or reinsurance structures scaled to the worst credible scenario—even without robust probability estimates.  
  **Audit:**  
  - **Matches:** Capital buffers for parameter uncertainty, reducing line sizes for "fat-tailed" perils. Your coastal county decision: no new business despite profitable expected loss.  
  - **Distorts:** "Proportional measures" ≠ exposure management. You reduce exposure to fit capital constraints; philosophers advocate proactive prevention (e.g., regulation).  
  - **Fails:** "Unsettled science" isn’t a distinct category. You either model (poorly) or don’t.  

  ### **3. Paralysis Objection**  
  *"Inaction risks are real; precaution can be self-defeating."*  
  **Translation:** Declining profitable business due to model uncertainty creates opportunity cost. Competitors write it, diversification weakens, and your portfolio stagnates. Correlations collapse in crises (e.g., simultaneous coastal storms + wildfires), making your "prudent" book riskier.  
  **Audit:**  
  - **Matches:** Explicit in risk appetite frameworks. You quantify opportunity cost vs. tail risk. Reinsurance buying balances this.  
  - **Distorts:** Philosophers worry societal inaction causes harm (e.g., not developing vaccines). You worry about **competitive adverse selection**: rivals write risks you decline, skewing your portfolio.  
  - **Fails:** None. Your models force paralysis risks into quantifiable trade-offs.  

  ### **4. Reply: Irreversibility & Burden-Shifting**  
  *"Some harms are irreversible/unconsented; burden of proof lies with proposer."*  
  **Translation:** For risks with unbounded maximum losses (e.g., climate-driven perils) where traditional reinsurance fails, decline outright. The underwriter (not the insured) must prove the risk is capital-efficient.  
  **Audit:**  
  - **Matches:** Your "unwritable" box. Corollary: you won’t write risks that threaten insolvency, regardless of price.  
  - **Distorts:** "Irreversible harm" becomes "non-reinsurable ruin event." Philosophers emphasize ethical consent; you focus on balance sheet survivability.  
  - **Fails:** "Burden of proof" ≠ underwriting due diligence. You model/price; you don’t seek "proof." Unconsented losses (e.g., third parties) aren’t modeled—only policyholder losses.  

  ### **5. Maximin Reasoning**  
  *"Choose the option whose worst outcome is survivable when probabilities are unknown."*  
  **Translation:** When loss distributions defy estimation (e.g., unprecedented perils), default to minimizing maximum probable loss (PML). Set exposure limits where the 1-in-250-year event fits within risk-based capital.  
  **Audit:**  
  - **Matches:** Core underwriting practice. Capital models are literally maximin: capital = max loss at confidence interval. Your "probability of ruin" threshold defines "survivable."  
  - **Distorts:** None. Clean alignment.  

  ---

  ### **Testing Your Suspicions**  
  **Suspicion 1: Irreversibility’s "Heavy Lifting"**  
  **Verdict:** Correct. Your three-box framework (price/reinsure/decline) collapses irreversibility into "unwritable." This **exposes a hole** in your thinking:  
  - **Why:** Insurable risks assume loss is monetizable/transferable. Philosophers treat irreversibility (e.g., extinction, ecosystem loss) as *categorically distinct*—it can’t be priced because it has no counterparty. Your model can’t conceptualize non-monetizable ruin.  
  - **Gap Insight:** When declining coastal property, you saw "unmodelable tail risk," not "irreversible harm to communities." The philosophical category *does real work* but outside your balance sheet.  

  **Suspicion 2: Dissolution of Acts vs. Omissions**  
  **Verdict:** Correct, but **it’s an artefact of bookkeeping**, not insight.  
  - **Why:** Underwriting is consequence-agnostic. A $10M loss from your omission (declining a policy) = $10M loss from commission (poor pricing). But philosophy distinguishes:  
    - *Acts:* You caused harm (e.g., writing a polluter’s policy).  
    - *Omissions:* You failed to prevent harm (e.g., not insuring a hospital).  
  - **Gap Insight:** Your ledger erases moral agency. This *exposes a flaw in the philosophical claim*: if consequences are identical, "acts vs. omissions" may be a false dichotomy in risk management.  

  ---

  ### **Final Verdict: What Failed to Translate & Why**  
  | **Concept**          | **Translation Failure**                              | **Exposes...**                                     |  
  |----------------------|------------------------------------------------------|----------------------------------------------------|  
  | **Proof of harmlessness** | No underwriting equivalent; risks are always "priced," not "safe." | **Hole in your thinking**: You lack a "zero-harm" benchmark. |  
  | **Burden of proof**  | You assess/model; you don’t assign societal "burden." | **Flawed philosophical claim**: Assumes proof is possible/transferable. |  
  | **Unconsented losses** | Not modeled (only policyholder losses matter).      | **Hole**: Your framework ignores externalities. |  
  | **Irreversible harm** | Reduced to "non-reinsurable ruin."                 | **Both**: Your model is limited, but the concept is vague outside ethics. |  

  **Conclusion**: Your framework swallows quantifiable precaution (maximin, model risk buffers) but chokes on unquantifiable ethics (irreversibility, consent). The failures reveal **your vocabulary’s boundaries**—not poverty, but specialization. Where philosophers see irreducible moral dilemmas, you see unwritable risks. This isn’t a weakness; it’s domain integrity. The "bookkeeping artefact" suspicion is validated: actuarial neutrality dissolves acts/omissions, exposing that debate’s fragility when consequences are monetized.
