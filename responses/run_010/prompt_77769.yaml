prompt: |-
  I'm auditing a seminar on Indian epistemology this term and separately working through some history-of-medicine stuff, and last night I got stuck on a case I can't stop thinking about. I want to run it through the Nyāya machinery as a test of whether that machinery has any teeth on something it was never designed for. The case is the ulcer story, and here it is in brief so you don't have to guess at the facts. For most of the twentieth century the settled doctrine was that peptic ulcers came from excess acid, and behind the acid from stress, diet and personality; treatment was antacids, bland food, rest, sometimes surgery. In the late seventies a Perth pathologist, Robin Warren, kept noticing spiral-shaped bacteria sitting on the surface of stomach biopsies from patients with gastritis, which was supposed to be impossible. A young registrar, Barry Marshall, teamed up with him, they tried to culture the organism, and the first thirty of a hundred samples looked like failures — it turned out the lab's standing practice was to bin culture plates after two days, because that's what you do with throat swabs, and the thirty-first plate only survived because the technicians were too busy to throw it out. It sat in the incubator from Thursday to Monday and grew. Their study of roughly a hundred patients came out in the Lancet in 1984; a paper they'd sent to the Gastroenterological Society of Australia the year before had been ranked by reviewers in the bottom ten percent of that year's submissions. In 1984 they failed to infect piglets, and Marshall then drank a broth of the cultured bacteria himself: nausea and bad breath within three days, vomiting on days five through eight, an endoscopy on day eight showing massive gastritis with the organism cultured from the biopsy, antibiotics from day fourteen. He never developed an ulcer. The self-experiment satisfied Koch's postulates for gastritis but not for ulcers. Meanwhile the establishment line — nothing survives gastric acid, so anything seen down there is a contaminant or an opportunist colonizing already-damaged tissue — was being defended largely by people who hadn't looked, though I should say the popular hagiography is contested and some historians argue the field showed proper skepticism rather than dogma. By the mid-nineties antibiotics were standard of care for ulcers; Marshall and Warren got the Nobel in 2005. Also relevant: something like half of humanity carries the bug and most carriers never get an ulcer.

  Here's what I want out of you. First, sort the evidence into the pramāṇas and tell me where nothing fits: Warren looking at a stained biopsy through a microscope, the cultures, the correlation across the hundred patients, Marshall's own symptoms, the piglet failures, the antibiotic trials that cured people, and the confident consensus that ulcers are acid and stress. Second, put the causal claim in the five-membered form with the reason and the probandum made explicit, and state the pervasion it depends on — then tell me honestly whether there *is* a pervasion in either direction given the carrier statistics, or whether the inference needs a limiting condition (an upādhi, if that's the right tool: strain virulence? smoking? host factors?), or whether the only inference the evidence actually licensed was about gastritis rather than ulcers. Third, take the skeptics' reason, nothing survives acid, and say which of the defective-reason types it is, and whether it was defective from the start or only became defective in hindsight — and whether at some point both sides had live inferences on the table, which I think raises a counterbalance problem in Nyāya's own terms. Fourth, and this is my favorite part: perception is characterized in terms of contact between sense faculty and object, plus conditions about being non-verbal and non-erroneous. A bacillus at that magnification isn't in contact with anything, and Warren saw it only as a bacterium, i.e. under a concept. So is the founding observation of the entire story pratyakṣa at all? If not, what is it — an inference from stains and shapes? And if you want to answer that the microscope just extends the eye, does the framework actually have resources for that, or am I importing a modern move and dressing it in Sanskrit? Fifth, upamāna: I half-suspect it's a bad fit for this case, because as I understand it it's about learning what a word picks out by comparing something with a similar thing you already know, not about analogical reasoning in general — if that's right, tell me where the piglet work and the animal-model reasoning go instead, and whether satisfying a template like Koch's postulates is an instance of any pramāṇa at all. Sixth, testimony and the āpta condition: it only counts when the speaker knows the thing directly and communicates it as known. Run that on the 1980 establishment, on Marshall's own public claims, and on the clinicians who started prescribing antibiotics before they'd cultured anything themselves.

  Then I want the arrow turned around, because that's the part I can't do myself. Is this episode a genuine vindication of Nyāya's restrictive treatment of testimony — the framework predicts that a confident consensus of people without direct acquaintance deserves no epistemic weight, which is exactly what happened — or did it just get the right verdict by luck? Note the cost: the same criterion hands weight to any confident person claiming direct acquaintance, and there were earlier clinicians reporting the same bacteria-ulcer association who went nowhere, so what in the framework seperates Warren from them other than the fact that he turned out to be right? Finally, be blunt about where the taxonomy is silent. I suspect it has nothing to say about base rates and statistical evidence, nothing to say about the reliability of a *method* as opposed to the truth of a particular cognition (so the fact that the winning observation only happened because a technician was too busy to throw a plate away makes no epistemic difference at all — confirm or correct me on that), and nothing to say about the social organization of science: who gets to run the culture, who gets a slot at the society meeting, what a consensus conference does. Constraints: no bibliography, no reading list, no citations, and please don't invent sūtra numbers or attributions — if you're not sure a technical term does the job I'm assigning it, say so rather than bluffing. Use the Sanskrit terms but gloss each one the first time. And if the honest conclusion is that some chunk of this episode just falls outside the four pramāṇas, say that; a clean negative result is more useful to me than a forced mapping.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly deeply engaged with both Nyāya epistemology and medical history, and they've presented a fascinating test case: the H. pylori discovery story. The challenge is to analyze this modern scientific controversy through ancient Indian epistemological frameworks - a genuinely innovative interdisciplinary approach.

  First, I need to recognize the user's dual background: they're auditing a seminar on Indian epistemology while studying medical history. This suggests they want rigorous philosophical analysis grounded in actual historical details. Their frustration with the "ulcer story" seems to stem from recognizing epistemic tensions that standard histories gloss over.

  The core task has six precise components about evidence classification, causal reasoning, error analysis, perception theory, analogy, and testimony - plus that crucial final question about whether Nyāya's restrictions on testimony are vindicated or accidental here. The constraints are strict: no citations, honest about limitations, and Sanskrit terms must be glossed.

  Hmm, the tricky parts jump out immediately. Warren's microscope observation challenges Nyāya's direct contact requirement for perception (pratyakṣa). The carrier rate (50% infected, few get ulcers) wrecks simple pervasion (vyāpti) for causation. And the testimony (śabda) analysis needs to explain why Warren/Marshall deserved credence over earlier forgotten observers.

  I should start by mapping the evidence types:
  - Microscope viewing: arguably pratyakṣa if we accept instrumental extension
  - Cultures: inference (anumāna) based on growth patterns
  - Clinical correlation: complex anumāna with upādhi (host factors)
  - Self-experiment: pratyakṣa for symptoms but anumāna for causation

  For the five-step inference:
  1. Pratinā: This patient has peptic ulcers
  2. Hetu: Because H. pylori is present
  3. Udāharaṇa: Wherever H. pylori with virulence factors exists in susceptible hosts, ulcers occur (with upādhi!)
  4. Upanaya: Here H. pylori with...[etc.]
  5. Nigamana: Therefore ulcers caused by it

  But the pervasion is messy - only 10-20% of carriers develop ulcers, so we need qualifiers about strain virulence and host immunity. Nyāya can handle this with upādhi, but it's not elegant.

  On the skeptics' "nothing survives acid" argument - that's clearly a fallacy of the "contradicted reason" (viruddha) type from the start, since Warren kept finding survivors. Though admittedly, without cultures, one could argue it was initially uncertain.

  The testimony analysis is particularly rich. The establishment lacked direct knowledge (aparokṣajñāna) of gastric microbiology - they were parroting textbooks. Marshall claimed direct experimental knowledge but overstated for ulcers initially. Early adopters prescribing antibiotics relied on śabda from the Lancet paper - valid only if they accepted Marshall as āpta, which was contested.

  That final arrow-turn question is profound: Does this vindicate Nyāya's testimony restrictions? Partly - it correctly dismisses secondhand consensus. But it fails to explain why Warren succeeded where earlier observers failed. The framework lacks tools for social epistemology or institutional credibility. Also, note Warren himself wasn't āpta initially - he was a pathologist outside gastroenterology.

  Gaps in the taxonomy stand out:
  - No handling of statistical evidence (carrier rates)
  - No concept of methodological reliability (the accidental culture)
  - Blind to social dynamics (peer review, conference slots)

  The cleanest conclusion is that while Nyāya handles some aspects well (testimony critique, perception debates), it struggles with partial causation and scientific processes. A negative result here is actually valuable - it shows where classical frameworks need supplementation.

  User seems to want this not for easy answers but to probe where Nyāya's "machinery has teeth." Best to honor that by being transparent about both insights and limitations.
answer: |-
  Here's the Nyāya analysis of the *H. pylori* case, structured by your questions. I'll be blunt about fits, misfits, and limitations.

  **1. Sorting Evidence into Pramāṇas (Means of Valid Cognition):**
  *   **Warren's Microscope Observation:** **Pratyakṣa (Perception)**, *qualified*. Nyāya defines perception (*pratyakṣa*) as cognition arising from sense-object contact (*indriyārthasannikarṣa*), non-verbal (*avyapadeśya*), non-erroneous (*avyabhicāri*), and determinate (*vyavasāyātmaka*). Warren's seeing stained shapes fits *if* we accept the microscope as an extension of the visual sense organ (*cakṣur-indriya*). Seeing it *as a bacterium* involves conceptualization (*savikalpaka pratyakṣa*), which Nyāya accepts. The challenge is "contact." Nyāya typically assumes direct proximity. Magnification via lenses is an instrumental extension – a modern move not explicitly addressed in classical Nyāya machinery. *Conclusion:* It *can* be mapped as *pratyakṣa* by stretching the "contact" condition instrumentally, but it's not a pure classical fit. The conceptualization ("bacterium") is standard.
  *   **The Cultures:** Primarily **Anumāna (Inference)**. The visible growth on the plate (perceived) is inferred (*anumāna*) to be the *same organism* Warren saw in the biopsies. The inference relies on pervasion (*vyāpti*) between the observed characteristics (shape, staining) in the biopsy and the characteristics of the grown culture. The accidental extended incubation enabling growth doesn't alter the *pramāṇa* type – it's a contingent fact enabling the inference, not an epistemic category itself.
  *   **Correlation in 100 Patients:** **Anumāna (Inference)**. Observing the co-presence (*sahacāra*) of *H. pylori* and gastritis/ulcers in many cases suggests a causal link via inference based on positive correlation (a form of *anumāna*). Nyāya recognizes inference from association/co-presence.
  *   **Marshall's Own Symptoms:** **Pratyakṣa (Perception)** for his subjective symptoms (nausea, vomiting). The endoscopy findings (gastritis) are **Pratyakṣa** (visual perception via instrument) for the examiner. Culturing the organism from *his* biopsy is again **Anumāna** linking the organism to the observed gastritis.
  *   **Piglet Failures:** **Anumāna (Inference)** *against* a simple causal link. The failure to infect piglets provides inferential evidence (*anumāna*) that *H. pylori* alone might not be sufficient for ulcers (or that piglets are not a suitable model), suggesting the need for an *upādhi* (limiting condition, e.g., specific host factors).
  *   **Antibiotic Trials Curing People:** **Anumāna (Inference)**. The observed effect (ulcer healing) following the cause (antibiotic treatment targeting *H. pylori*) provides strong inferential evidence (*kārya-hetu*, inference from effect to cause or vice-versa) for a causal role of the bacterium. This is powerful evidence within Nyāya.
  *   **Confident Consensus (Acid/Stress Doctrine):** **Śabda (Testimony)**, but **DEFECTIVE**. It's testimony from authorities (*āptas*), but critically *fails* the āpta condition. The consensus was based on *parokṣa jñāna* (indirect knowledge – theory, tradition, indirect observation) and ultimately *erroneous*. They lacked *aparokṣa jñāna* (direct knowledge/acquaintance) of the gastric environment relevant to bacteria. Nyāya would classify this as *aśabda* or invalid testimony (*śabda-ābhāsa*) because the speakers were not *āpta* on this specific point.

  **2. Causal Claim in Five-Membered Form (Nyāya Syllogism):**

  *   **Pratijñā (Proposition):** This patient's peptic ulcer is caused by *Helicobacter pylori* infection. (*Idaṃ parṇāśaya-vraṇaṃ helikobaktara-pailori-saṃcāreṇa janyate*)
  *   **Hetu (Reason):** Because *Helicobacter pylori* is present in their stomach. (*Helikobaktara-pailori asya udare vidyate iti hetuḥ*)
  *   **Udāharaṇa (Example/General Rule with Pervasion):** Wherever there is *Helicobacter pylori* infection *in a susceptible host* (UPĀDHI!), peptic ulcers occur, as in the cases studied by Marshall & Warren. And wherever there is no *Helicobacter pylori* infection, peptic ulcers do not usually occur (or occur due to other rarer causes like NSAIDs), as in many non-infected individuals. (*Yatra yatra helikobaktara-pailori-saṃcāraḥ kṣamāśaye (upādhi!) vidyate tatra tatra parṇāśaya-vraṇāni bhavanti, yathā mārśala-vārenādīnāṃ viṣayāṇāṃ darśane; yatra yatra na bhavati tatra tatra na bhavanti, yathā bahuṣu asaṃcāriṣu.*)
  *   **Upanaya (Application):** In this patient, *Helicobacter pylori* infection *is* present. (*Asmin cikitsye helikobaktara-pailori-saṃcāro vidyate.*)
  *   **Nigamana (Conclusion):** Therefore, this patient's peptic ulcer is caused by *Helicobacter pylori* infection. (*Tasmāt idaṃ parṇāśaya-vraṇaṃ helikobaktara-pailori-saṃcāreṇa janyate.*)

  *   **Probandum (Sādhya):** "Being caused by *H. pylori* infection" (*Helikobaktara-pailori-saṃcāra-janyatva*)
  *   **Reason (Hetu):** "Presence of *H. pylori*" (*Helikobaktara-pailori-saṃcāra-sattva*)
  *   **Pervasion (Vyāpti) & Upādhi:** The straightforward pervasion "*H. pylori* presence invariably implies ulcer" is **FALSE** due to the carrier phenomenon (most infected, no ulcer). This is a major problem. The inference **needs an upādhi (limiting condition)**. The *upādhi* is "presence in a susceptible host" (*kṣamāśaya-sattva*), encompassing factors like specific bacterial strain virulence factors (CagA, VacA), host genetics, smoking, diet, stress (ironically), etc. The pervasion becomes contingent: "*H. pylori* infection *in a susceptible host* pervades peptic ulcer occurrence." This is imperfect (some susceptible hosts might still not develop ulcers, some ulcers are NSAID-induced), but far stronger and aligns with evidence. The initial evidence (correlation, Marshall's gastritis) only securely licensed an inference about **gastritis** being caused by *H. pylori* (where the pervasion is much tighter – infection almost always causes some gastritis). The ulcer link required the additional evidence (antibiotic cures) and the *upādhi* concept.

  **3. Skeptics' Reason ("Nothing survives acid"): Defect Type**

  *   **Reason (Hetu):** "This cannot be a causal bacterium because nothing survives gastric acid." (*Na etad bākṭīriyaṃ kāraṇaṃ bhavitum arhati, tathā hi, yat kiṃcit udara-āmle nāvatiṣṭhate.*)
  *   **Defect Type:** **Viruddha (Contradictory)**. This is a *hetvābhāsa* (fallacious reason). The reason itself is contradicted by the evidence Warren presented – he *did* see organisms surviving *in situ* on the stomach lining. The reason "nothing survives" was **defective from the start** because it was a general claim contradicted by specific, direct perceptual evidence (*pratyakṣa-bādha*). It wasn't just proven wrong later; it was incompatible with the initial observations Warren made (if those observations were accepted as valid *pratyakṣa*). The skeptics' position relied on *denying* the validity of that perception (calling it contamination or opportunism).
  *   **Live Inferences & Counterbalance:** Yes, both sides had live, competing inferences initially.
      *   **Marshall/Warren:** Hetu = Presence of bacteria; Vyāpti (claimed) = Bacteria cause inflammation/ulcers; Udāharaṇa = Their biopsy samples.
      *   **Skeptics:** Hetu = Acid kills all bacteria; Vyāpti = No bacteria can survive to cause disease; Udāharaṇa = General biological knowledge/prior failed cultures.
      Nyāya *does* have a framework for resolving conflicting inferences (*tarka*, disputation). Key tools include:
      *   **Bādhaka:** Finding a defeater. Warren's direct observation (*pratyakṣa*) was a potential defeater for the skeptics' universal premise ("nothing survives").
      *   **Strength of Pramāṇa:** *Pratyakṣa* is generally stronger than *anumāna* based on general principles, *if* the perception is deemed valid.
      *   **Upādhi Search:** Investigating limiting conditions (like why prior cultures failed, host susceptibility).
      The initial standoff was precisely because the skeptics challenged the validity of the key *pratyakṣa* (microscope observation) and the *vyāpti* claimed by Warren/Marshall. The subsequent evidence (successful cultures, self-experiment, antibiotic cures) progressively defeated the skeptical *hetu* and established the *upādhi*.

  **4. Microscope & Perception (Pratyakṣa):**

  This is the toughest fit. Classically, Nyāya requires direct contact (*sannikarṣa*) between the sense organ (*indriya*) and the object (*artha*). A bacillus magnified via lenses and light rays isn't in *direct* contact with the eye. Seeing it "as a bacterium" involves prior conceptual knowledge (*vikalpa*), which Nyāya accepts within *savikalpaka pratyakṣa* (determinate perception).

  *   **Arguments against it being Pratyakṣa:**
      *   Lack of direct physical contact.
      *   Dependence on complex instrumentation altering the sensory input.
      *   The role of theory/concept ("bacterium") is heavy.
  *   **Argument for it being Pratyakṣa (stretched):**
      *   The microscope is a tool (*sādhana*) extending the eye's capacity, like using a stick to touch something distant. The final cognition arises from stimulation of the visual sense *via* this instrument.
      *   The non-erroneous (*avyabhicāri*) and determinate (*vyavasāyātmaka*) conditions were arguably met for Warren – he correctly identified *something* foreign was present where it shouldn't be.
  *   **Conclusion:** Nyāya lacks explicit resources for instrumental extension. You **are importing a modern move** by arguing the microscope extends the eye. Within strict classical terms, one could argue it's **primarily Anumāna**: Inference (*anumāna*) from the perceived visual patterns (stains, shapes) under magnification to the existence of a microscopic organism. The inference relies on the pervasion between such patterns and the presence of bacteria, established through prior microbiology. This fits Nyāya's machinery *without* stretching *pratyakṣa*. Warren's key contribution was initiating this inference chain.

  **5. Upamāna (Comparison) & Animal Models:**

  You are correct. **Upamāna** in Nyāya is specifically about learning the meaning of a word (*śabda-artha-jñāna*) by comparing an unfamiliar thing to a familiar thing based on similarity, guided by testimony (e.g., learning "gavaya" means a wild cow by being told it's like a domestic cow). It's not about analogical reasoning in scientific modeling.

  *   **Piglet Work & Koch's Postulates:**
      *   **Piglet Failure:** This is negative evidence evaluated via **Anumāna**. Failure to cause disease in piglets infers (*anumāna*) that piglets lack a necessary condition (*upādhi*) present in humans, or that the model is flawed.
      *   **Animal-Model Reasoning (General):** Using animals to infer human biology/disease is fundamentally **Anumāna** based on similarity (*sādharmya*). It's inference from a similar case (*sādharmyāt sāmānyato dṛṣṭāt*). Nyāya readily handles analogical inference *as a form of anumāna*. The strength depends on the degree and relevance of similarity.
      *   **Koch's Postulates:** Satisfying these is a structured process generating multiple cognitions:
          *   Association/Correlation: **Anumāna**.
          *   Isolation & Culture: **Anumāna** (from growth to organism).
          *   Reproduction in Host: **Anumāna** (from disease in inoculated host to cause). Marshall's self-experiment provided this via *pratyakṣa* (symptoms, endoscopy) and *anumāna* (cause-effect).
          *   Re-isolation: **Anumāna**.
      Koch's Postulates aren't a distinct *pramāṇa*; they are a *method* employing *pratyakṣa* and *anumāna* systematically to establish causal inference.

  **6. Testimony (Śabda) and Āpta:**

  *   **Āpta Definition:** A speaker is *āpta* (reliable/authoritative) if they have direct, true knowledge (*aparokṣa yathārtha jñāna*) of the matter and communicate it truthfully (*saṃvādanīyatā*), without intent to deceive.
  *   **1980 Establishment:** **NOT Āpta** regarding gastric bacteriology. They lacked *aparokṣa jñāna* (direct knowledge/observation) of the relevant phenomenon (bacteria surviving in stomach). Their knowledge was *parokṣa* (indirect, based on theory/textbooks) and ultimately erroneous. Their testimony deserved no weight on this specific point. **Nyāya predicts this failure.**
  *   **Marshall's Public Claims (Early):** **Problematic regarding Ulcers.** He had *aparokṣa jñāna* regarding the bacteria's presence and its link to *gastritis* (from cultures, biopsies, self-experiment). His claims about *ulcers* were initially based on correlation and strong suspicion, but lacked conclusive *aparokṣa jñāna* or fully established *vyāpti* (due to carrier state). He overextended his *āpta* status slightly initially. His *āpta* status for gastritis was strong; for ulcers, it became solid only after antibiotic cure trials provided the causal inference.
  *   **Clinicians Prescribing Antibiotics Early:** Relied on **Śabda** from Marshall/Warren's papers/reports. Whether this was valid depends on whether they *accepted* Marshall/Warren as *āpta*. Initially, many did not, given the controversy. Those who did accept them as *āpta* (having direct knowledge and being truthful) *were* justified by Nyāya standards in acting on that testimony, even before culturing *H. pylori* themselves. Their justification came from trusting the *āpta*, not from direct knowledge.

  **Turning the Arrow: Vindication or Luck?**

  *   **Partial Vindication:** Nyāya's restrictive view on testimony **is strongly vindicated** regarding the **establishment consensus**. It correctly identifies why their testimony failed: lack of *aparokṣa jñāna*. The framework successfully explains why mere confidence and consensus, without direct grounding, carried no epistemic weight. This is a core strength demonstrated here.
  *   **The Problem (Separating Warren from Earlier Observers):** **This is where the framework struggles.** Nyāya's *āpta* condition doesn't provide clear internal criteria to distinguish Warren from earlier, forgotten clinicians reporting similar findings. Both *claimed* direct perception (*pratyakṣa*). Why should Warren's *pratyakṣa* (via microscope) be accepted as non-erroneous (*avyabhicāri*) while earlier reports were dismissed as error or contamination? The framework relies on:
      *   **Corroboration:** Warren had persistent, repeated observations, cultures (eventually), and a collaborator. This builds a case for non-error within Nyāya (multiple consistent *pratyakṣa*).
      *   **Tarka (Disputation):** Warren/Marshall actively argued against the contamination hypothesis and sought evidence (cultures, self-experiment) to defeat counter-arguments (*bādhaka*).
      *   **Ultimate Success:** His claims led to successful predictions (antibiotic cures), proving non-error *in hindsight*. But Nyāya lacks a *prospective* method to adjudicate between two claimants to *aparokṣa jñāna* beyond examining consistency and defeating counter-arguments. **The framework doesn't inherently favor the ultimately correct claimant; it just provides tools to investigate claims.** Warren succeeded partly due to persistence, methodological improvements (longer culture), and a socio-scientific context slightly more receptive (though still hostile).

  **Bluntly Stated Gaps in the Nyāya Taxonomy:**

  1.  **Base Rates & Statistical Evidence:** Nyāya has **no explicit framework** for handling probabilistic evidence, base rates (like the 50% carrier rate), or statistical significance. The carrier rate problem is forced into the *upādhi* concept, which is a workaround, not a native tool for statistics. Evaluating the strength of the correlation study (n=100) lacks specific guidelines.
  2.  **Reliability of Methods:** Nyāya focuses on the validity of the *resulting cognition* (*pramā*) from a specific instance, not the *reliability of the process or instrument* generating cognitions over time. The fact that the key culture succeeded only due to a technician's accidental deviation (not binning the plate) **makes no epistemic difference** within Nyāya. If the cognition (seeing the culture growth) is valid (*yathārtha*), the accidental path to achieving the conditions for that cognition is irrelevant. It highlights a limitation: Nyāya doesn't address the *safety* or *sensitivity* of belief-forming processes, only the truth of the specific belief formed.
  3.  **Social Organization of Science:** Nyāya is **entirely silent** on the sociology of knowledge. It has no resources to analyze:
      *   Peer review rejection (bottom 10% ranking).
      *   Power dynamics within specialties (gastroenterologists vs. pathologist).
      *   Access to resources (lab time, patient samples).
      *   Conference slots and consensus conferences.
      *   The role of institutions and funding.
      Nyāya treats knowledge as arising in individual knowers (*pramātṛ*) through *pramāṇas*, abstracting away the social, institutional, and material constraints that shape *who* can be a *pramātṛ*, *what* they can observe, and *whose* testimony is heard.

  **Clean Negative Results:**

  *   Base rates/statistics require forcing into *upādhi* or *vyāpti* qualifications; no native fit.
  *   Methodological reliability (e.g., the accidental culture success) is irrelevant to the validity of the specific cognition; the framework is silent here.
  *   The social, institutional, and material dimensions of scientific practice fall entirely outside the four *pramāṇas*. This episode vividly shows these factors are crucial, but Nyāya lacks the tools to analyze them. It focuses on the *logic* of justification in individual cognition, not the *practice* of knowledge production in communities.

  In conclusion: Nyāya provides powerful tools for dissecting the *logical structure* of evidence and inference in this case, especially regarding perception, inference, and the critique of testimony. It successfully diagnoses the establishment's failure. However, it struggles with probabilistic evidence, lacks concepts for methodological reliability, offers limited prospective tools to distinguish valid from invalid perception claims in novel contexts, and is completely blind to the social dimensions of science that were crucial to this historical episode. The framework has teeth for logic and individual cognition, but lacks jaws for statistics, methodology, and sociology.
