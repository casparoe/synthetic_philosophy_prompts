prompt: |-
  I direct my department's annual public conversation series, and our closing event this term features a moral philosopher and economic historian whose recent book advances what she calls a substitution account of moral revolutions. Her central claim is that practices embedded in an honor code — dueling among British officers and gentlemen, footbinding in late imperial China, the Atlantic slave trade as Britain abandoned it, and so-called honor crimes against women in parts of Pakistan — did not fall to moral argument, since the arguments had been available for generations without effect, nor primarily to shifts in material interest, but only once reformers contrived a substitute practice that discharged the same status function before the same audience. On her telling, the anti-footbinding societies mattered less because they persuaded anyone that binding was cruel than because they helped construct a marriage market in which unbound feet became marriageable, and British abolition mattered because the petitioning campaigns redirected the relevant audience from the planter's circle to the nation's own self-image. She is fluent and well media-trained, and her stock response to a hard question is that "the theory is about mechanisms, not predictions."

  Please draft eight to ten questions for a forty-minute conversation with a mixed audience of undergraduates, faculty, and members of the local historical society. I want questions that engage the content of the substitution thesis rather than inviting her to restate it, and for each question a follow-up keyed to the answer she is most likely to give. At minimum, work in the following lines of pressure. First, the material-interests literature: Eric Williams's Capitalism and Slavery (1944) argued that British abolition tracked the declining economic value of the West Indian slave system, while Seymour Drescher's Econocide (1977) responded that the British West Indian slave economy remained profitable right up to abolition, so that decline followed the abolition rather than causing it — she should be asked whether her account can remain neutral in that exchange, or whether it must concede that interests set the timing while honor supplied the motive. Second, Bernard Williams's thought that certain moral transformations cannot be explained as the victory of better reasoning because the earlier society lacked the ethical concepts that would have made the criticism available: is her mechanism a redescription of that point, a rival to it, or a specification of it? Third, the symmetry problem — honor entrenches norms as readily as it dissolves them, and if the same apparatus explains both persistence and change, what would count as evidence against the view? Fourth, the normative question of whether an honor-driven conversion of a practice from creditable to shameful gives us any reason to call the outcome moral progress rather than a change of fashion, and what explanatory work, if any, is left for the reformer's belief that the practice was wrong. Fifth, the applied question about designing substitutes for a live practice, including the objection that outsiders engineering an honor substitute is a form of manipulation, and the question of who gets to define the substitute. End with a question about what observation would falsify the account. No generic questions about her influences or career, please.

  One further request, and I ask it because I will be voicing some of these historical attributions aloud in a room that contains two economic historians: at the end of your draft, tell me how confident you are in the empirical and attributive claims your questions presuppose, and single out the single point you are least sure of, so that I can soften, hedge, or simply drop it from the live conversation.
reasoning: |-
  Okay, let me tackle this query systematically. The user directs an academic event series and needs substantive questions for a scholar promoting a "substitution account" of moral revolutions. The core thesis is that practices like dueling or footbinding ended not through moral arguments but via engineered substitutes serving similar status functions. 

  First, I need to ensure the questions meet all specified requirements: engaging the thesis deeply, avoiding restatements, incorporating five key pressure points, and including follow-ups. The audience mix (undergrads, faculty, historians) means questions must be accessible yet rigorous. 

  The material-interests line requires care. I recall the Williams-Drescher debate on whether British abolition followed economic decline (Williams) or preceded it despite profitability (Drescher). My question must probe if her theory can remain neutral or concedes interests set timing. For the follow-up, I'll anticipate her likely "mechanisms not predictions" reply and press whether timing explanations inherently demand interest-based analysis. 

  Bernard Williams' conceptual availability challenge needs framing as a trilemma: is her mechanism a redescription, rival, or specification? Since she emphasizes functional substitutes over missing concepts, I'll position this as a specification with a follow-up about cases where concepts *were* present but ineffective. 

  The symmetry problem is tricky. If honor explains both persistence *and* change, what falsifies it? I'll question evidentiary standards, then challenge whether this makes the theory unfalsifiable when she invokes "contingent" details. The normative angle must distinguish moral progress from fashion, probing if reformers' beliefs matter. Here, her likely functionalist reply needs pushing: does reducing morality to social mechanics drain progress of meaning? 

  For applied design, I'll question outsider engineering of substitutes, using footbinding as a potential case of external influence. The follow-up must address power dynamics in defining substitutes. Finally, falsification: what observable evidence would contradict the theory? Expecting her to cite failed substitutions, I'll ask if this conflates necessary and sufficient conditions. 

  On attributive confidence: the Williams-Drescher framing is solid, but I'm least sure about characterizing anti-footbinding societies' role in creating marriage markets. Some scholarship emphasizes internal activism over external engineering, so I'll flag this for hedging. 

  Throughout, I'll avoid biographical questions and maintain academic rigor while ensuring clarity for undergrads. The structure will flow from theoretical challenges to normative implications, ending with falsifiability—a strong closer for mixed audiences.
answer: |-
  Here are ten substantive questions with follow-ups, designed to probe the substitution thesis while incorporating your specified lines of pressure. Each follow-up anticipates her likely response based on her stated framework:

  1.  **Core Challenge to Material Interests:** "You argue that moral revolutions occur via substitution, not primarily material interest shifts. Yet, in the British abolition case, Eric Williams claimed economic decline *caused* abolition, while Seymour Drescher showed profitability persisted. Does your mechanism *require* us to take Drescher's side (profitable yet abandoned), or can it coexist with an 'interests set the timing, honor the motive' compromise?"
      *   *Likely Response:* Reiteration that her theory focuses on the *mechanism* of change once it occurs, not the preconditions.
      *   **Follow-up:** "If the substitution mechanism *only* activates after economic viability collapses (Williams), doesn't that make interests the necessary trigger? Conversely, if substitution works *despite* profitability (Drescher), does your theory then *explain* the timing by the contingent emergence of the substitute itself?"

  2.  **Bernard Williams & Conceptual Availability:** "Bernard Williams argued some past practices couldn't be criticized *internally* due to missing ethical concepts. Your substitution account seems to bypass internal persuasion altogether. Is your mechanism a *specification* of how change happens *when* concepts are lacking, a *rival* explanation suggesting concepts are less important than functions, or simply operating on a different level?"
      *   *Likely Response:* Emphasis on the functional equivalence of the substitute practice as the driver, potentially downplaying the role of conceptual evolution itself.
      *   **Follow-up:** "If reformers in, say, the footbinding case *did* articulate arguments using concepts potentially available earlier (compassion, bodily integrity) yet failed for centuries, does this suggest your functional substitution mechanism is the *decisive* factor, effectively making Bernard Williams' point about the *insufficiency* of concepts, rather than their absence?"

  3.  **Symmetry Problem (Persistence vs. Change):** "Honor codes clearly entrench practices as effectively as they can dissolve them via substitution. If the *same* apparatus (status function, audience) explains both persistence *and* revolution, what specific observation – say, a practice persisting despite reformers proposing a plausible substitute, or collapsing without one – would count as significant evidence *against* your substitution thesis as the key mechanism?"
      *   *Likely Response:* Stressing the complexity and contingency of historical change; the mechanism is necessary but not sufficient; failed substitutions might lack key features (audience acceptance, functional equivalence).
      *   **Follow-Up:** "Doesn't this risk making the theory unfalsifiable? If a substitute fails, you can always point to some missing element in its design or context, and if a practice collapses without a substitute, you might argue one *was* implicitly adopted. What specific, observable historical counterexample *would* genuinely challenge the core claim that substitution is the essential mechanism?"

  4.  **Normative Status - Progress or Fashion?:** "If the shift from 'creditable' to 'shameful' hinges on substituting a new status-bearer within the *same* honor framework, rather than the victory of a moral argument, what grounds do we have to call this 'moral progress' rather than simply a change in status fashion? Does the reformer's genuine belief in the practice's *wrongness* play any *explanatory* role in your account?"
      *   *Likely Response:* The outcome (ending cruelty, oppression) constitutes progress regardless of the mechanism; reformers' beliefs motivate the *search* for a substitute, but aren't the mechanism of change itself.
      *   **Follow-Up:** "Doesn't this functionalist view risk reducing morality to social mechanics? If the *only* reason footbinding ended was the construction of a new marriage market signal, not the recognition of its inherent wrongness, does that diminish the *moral* significance of the change? Or is the outcome itself the sole relevant moral fact?"

  5.  **Application & Agency - Outsider Engineering:** "Designing substitutes seems crucial. But when outsiders (e.g., colonial administrators, foreign NGOs) attempt to engineer a substitute practice to dismantle a local honor-based norm they deem oppressive, isn't this often perceived as manipulation or cultural imperialism? Who has the legitimacy to define the substitute and its 'equivalent' status function?"
      *   *Likely Response:* Acknowledges the risk; emphasizes the need for internal reformers or sensitive external actors to identify credible substitutes *within* the existing value/status framework.
      *   **Follow-Up:** "Looking at the anti-footbinding societies you cite – weren't they significantly driven by missionary and Western-influenced reformers? Does this complicate the claim that the substitute (new marriageability) emerged organically *within* the existing Chinese honor code, rather than being partly imposed through external influence altering the 'audience' or its values?"

  6.  **Scope & Specificity of "Substitute":** "Could 'substitute practices' be incredibly broad? For instance, in the decline of dueling, was the substitute the specific practice of 'demanding an apology' backed by law, or was it the broader rise of professional/civic identities offering alternative sources of status, diminishing the *need* for the duel's specific function?"
      *   *Likely Response:* Argues for the need for a relatively specific practice addressing the *same* status need (responding to insult/defending reputation) before the *same* audience (peers).
      *   **Follow-Up:** "How do we rigorously define 'same audience' and 'same status function'? In the British abolition case, you argue the audience shifted from planters to the national self-image. Doesn't this constitute a *change* in the relevant honor community itself, rather than just a substitution *within* it? Is changing the audience part of the substitution mechanism?"

  7.  **The Role of Coercion/Law:** "In several cases you discuss (dueling, footbinding, slavery abolition), legal prohibition or state enforcement followed or coincided with the honor shift. How integral is law/coercion to the success of the substitution mechanism? Can the honor shift via substitution *precede* and enable legal change, or is law often a necessary catalyst for the substitute to gain traction?"
      *   *Likely Response:* Law often reinforces or codifies the shift enabled by substitution; sometimes law itself can be part of the substitute (e.g., courts replacing duels for satisfaction).
      *   **Follow-Up:** "Doesn't the frequent entanglement with law reintroduce material interests (fear of punishment, loss of position) and state power as key factors? Can we truly isolate the 'honor substitution' mechanism from these other forces in explaining the *sustained* abandonment of the practice?"

  8.  **"Honor Crimes" - Applicability & Limits:** "Applying your thesis to contemporary 'honor crimes': what might a viable 'substitute practice' look like that discharges the perceived status function (family honor restoration/defense) for the relevant audience (kinship group, community)? Are there unique challenges here compared to historical examples?"
      *   *Likely Response:* Suggestion of alternatives like formal legal redress, community mediation with different outcomes, or shifting the locus of honor to other achievements (education, civic contribution).
      *   **Follow-Up:** "Given the intense social embeddedness and potential lethality of honor dynamics in such contexts, isn't the feasibility of successfully 'engineering' a substitute from outside (by NGOs, the state) particularly low without a significant prior shift in underlying values or power structures – something your mechanism seems to presuppose?"

  9.  **The Critic's Stance Within the Code:** "Your account focuses on reformers *contriving* substitutes. But what about internal critics who reject the *entire* honor code's validity? Does your theory imply their efforts are doomed to fail until they pragmatically engage the existing status game by offering a substitute? Does this marginalize radical moral critique?"
      *   *Likely Response:* Pragmatic argument; radical critique might be necessary for motivation but insufficient for change within a strong honor-based system; change requires working with the existing social grammar.
      *   **Follow-Up:** "Doesn't this risk becoming a conservative theory of change, suggesting reformers must always accept the fundamental premises of the existing honor code to be effective, potentially reinforcing oppressive structures even while changing specific practices?"

  10. **Falsification & Evidence:** "Finally, to test the thesis: what specific historical observation – for example, a well-documented moral revolution where a plausible substitute was clearly *absent*, or where a near-perfect substitute was proposed yet failed utterly to gain traction for an extended period – would you consider the strongest potential evidence *against* the substitution mechanism being necessary or decisive?"
      *   *Likely Response:* Points to complexity, multiple factors; suggests failed substitutions were flawed, or that cases lacking substitutes might involve different mechanisms (e.g., state collapse, conquest).
      *   **Follow-Up:** "If the absence of a substitute doesn't falsify it (because other factors might block change anyway), and the presence of a failed substitute doesn't falsify it (because the substitute was flawed), and a successful change *with* a substitute confirms it, doesn't this make the core claim very difficult to empirically disprove?"

  ---

  **Confidence Assessment of Empirical/Attributive Claims in Questions:**

  *   **High Confidence:**
      *   Williams vs. Drescher debate framing (Q1). This is a well-established historiography.
      *   Bernard Williams' concept point (Q2). His argument is clearly articulated in works like *Ethics and the Limits of Philosophy*.
      *   Basic facts of examples (dueling, footbinding, British abolition, honor crimes) as presented in the question stems.
      *   The role of law/coercion in the cited examples (Q7).
      *   The core elements of her thesis as described (mechanism, not prediction; role of substitutes, status function, audience).
  *   **Medium Confidence:**
      *   The characterization of anti-footbinding societies involving significant Western/missionary influence (Q5 Follow-up). While true that missionaries and Western ideas played *a* role, significant internal Chinese reform movements (often led by elites) were crucial. The *degree* to which the marriage market shift was "engineered" externally vs. emerged from complex internal dynamics is debated. **This is the point I am least sure of for your purposes.**
      *   The specific dynamics of contemporary "honor crimes" and feasibility of substitutes (Q8). This is complex and context-dependent.
  *   **Handled with Care:**
      *   The "conservative theory of change" implication (Q9 Follow-up). This is an interpretive critique based on the logic of her theory, not a direct historical claim.
      *   Falsification challenges (Q10). These are logical/philosophical probes based on the structure of her argument.

  **Recommendation:** **Soften the specific claim in Q5 Follow-Up.** Instead of: "weren't they significantly driven by missionary and Western-influenced reformers?" use: "To what extent did external actors (like missionaries or Western-influenced reformers) play a role in shaping the strategies of the anti-footbinding societies, and does this external influence complicate the idea that the substitute emerged organically *within* the existing Chinese honor code?" This acknowledges the debate without asserting a specific, potentially contentious, degree of influence.
