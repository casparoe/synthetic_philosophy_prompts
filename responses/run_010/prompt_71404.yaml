prompt: |-
  Last autumn I was drawn by lot onto our municipality's standing review panel: fourteen residents, none of us trained in law, statistics, or economics, charged with reaching findings on contested local questions — a disputed school siting, a complaint against a contractor, an appeal of a planning refusal. Our findings carry real weight, and we decide by majority vote. At our second sitting, one member argued that since there are fourteen of us, the majority is "mathematically almost certain" to be right, and proposed that we adopt whatever a bare majority reports as our standing practice and dispense with the long argument sessions. Two others agreed enthusiastically. The chair has asked me, because I once took a course in political philosophy, to open next month's meeting with forty minutes on the Condorcet jury theorem: what it actually says, what it needs in order to say it, and why it does not settle the question my colleague thinks it settles.

  I am not asking you to explain the theorem to me. I want a plan for how I should explain it to them, under these constraints: forty minutes, a whiteboard, no slides, and no formulas beyond arithmetic a person will accept while standing at a table. A short table of numbers is welcome; a proof is not.

  Please give me the following.

  First, the order of presentation, with the dependency reasons stated. In particular, tell me why the audience cannot be handed the headline result before they have understood that its force depends entirely on each member being individually better than a coin flip, and that the same reasoning runs backwards with a vengeance when they are worse. Tell me where the assumption of independence has to be introduced — before or after the numbers — and what breaks if I introduce it later.

  Second, the single example that should carry the whole thing. I want you to justify the choice by saying what such an example must contain (a genuinely binary question with a determinate right answer, members who have some skill but not certainty) and what it must be carefully free of (an answer so obvious that the room short-circuits the argument, any setup in which members can see one another's votes before casting, and anything that smuggles in an averaging intuition). Say explicitly whether the familiar urn-and-ball or repeated-coin framing serves or misleads at this level, and if it misleads, propose a replacement drawn from the sort of ordinary factual questions a panel like mine might actually face.

  Third, a misconception map. I expect at least these, and I want each one placed at the precise point in the sequence where it should be headed off, with a note on whether any of them should instead be allowed to surface on its own so that I can answer it in public:

  - that the theorem is the same thing as the intuition that many independent guesses at a continuous quantity converge on the truth, with errors cancelling out, when in fact it concerns discrete right-or-wrong questions and nothing cancels;
  - that "the majority is more likely correct" licenses each individual member to defer to the majority rather than exercise judgment of their own, and the difficulty that arises if everyone draws that inference, since the competence the theorem presupposes would then have no source;
  - that independence means only an absence of collusion or private dealing, rather than something about how members' correctness stands to one another once the truth of the matter is fixed;
  - that the theorem describes what happens in a deliberating body, when deliberation is very nearly the thing that destroys its central assumption;
  - that it is a claim about fairness, legitimacy, or whose interests get represented.

  Fourth, one question I can put to the room at the end that will separate those who have grasped the result from those who have merely adopted a slogan, together with a description of what a confident wrong answer to it would sound like.

  Fifth, what I should openly decline to cover at this level, and how to say so honestly. I have in mind the mathematics behind the limit result and what happens to votes that are correlated rather than independent. Tell me which of these to disclaim, in what words, and which to gesture at anyway because leaving it wholly unmentioned would give my colleague's proposal an unfair advantage.

  I am not looking for readings, sources, or anything to assign the panel afterwards. I need the architecture of the explanation.
reasoning: |-
  We are going to design a 40-minute explanation of the Condorcet jury theorem (CJT) for a lay panel, focusing on the key insights and misconceptions. The goal is to show that the theorem does not simply endorse majority rule as "almost certain" to be correct without critical assumptions.

  ### Order of Presentation with Dependency Reasons

  1. **Start with the Panel's Real Experience (5 minutes)**  
     - Begin by acknowledging the colleague's proposal: the idea that with 14 members, a majority is almost always right.  
     - State that we will examine a mathematical idea (CJT) that seems to support this, but we must understand its conditions.  
     - **Dependency reason**: Ground the discussion in their context to engage them. Without this, the abstract theorem may seem irrelevant.

  2. **Introduce a Concrete Binary Example (10 minutes)**  
     - Present a single, simple, binary-choice scenario that the panel might face. For example:  
       *"A developer claims a plot of land is not home to an endangered species, but an environmental group says it is. The truth is one or the other, and we must decide."*  
     - Emphasize: There is a definite right answer (though we might not know it), and each member must vote based on their individual assessment.  
     - **Dependency reason**: The theorem only applies to binary questions with a correct answer. We must establish this before introducing the theorem's claim.

  3. **Explain Individual Competence (5 minutes)**  
     - Define what we mean by an individual's "competence": the probability that a member gets the correct answer. Let’s call this `p`.  
     - Stress: `p` must be greater than 0.5 (better than a coin flip) for the theorem to work in the desired way.  
     - **Dependency reason**: The entire force of the theorem hinges on `p > 0.5`. If we present the headline result first without this, the audience might miss that the theorem can also work in reverse (if `p < 0.5`, majority is worse).

  4. **Introduce the Concept of Independence (5 minutes)**  
     - Explain independence: Once the truth is fixed (e.g., the species is truly present or not), each member's vote is based on their own assessment without being influenced by others.  
     - Use an analogy: Like witnesses to an event who form their own opinions without discussing.  
     - **Dependency reason**: Independence must be introduced before the numbers because without it, the mathematical aggregation doesn't hold. If introduced later, the audience might think that any group vote (even with deliberation) automatically satisfies the theorem's conditions.

  5. **Present the Theorem with a Numerical Example (10 minutes)**  
     - State the theorem in simple terms:  
       *If (1) each member has the same probability `p > 0.5` of being correct, and (2) votes are independent, then the probability that the majority vote is correct increases as the group size increases, and approaches 1 (certainty) as the group becomes very large.*  
     - Show a table for a small group (e.g., n=3, n=5) and then n=14 (if possible). For example:  
       - Assume `p = 0.6` (each member is 60% likely to be correct).  
       - For n=3:  
         - All three correct: (0.6)^3 = 0.216 → correct majority.  
         - Two correct, one wrong: 3 * (0.6)^2 * (0.4) = 3 * 0.144 = 0.432 → correct majority (since two out of three is majority).  
         - One correct, two wrong: 3 * (0.6)*(0.4)^2 = 3 * 0.096 = 0.288 → incorrect majority.  
         - All wrong: (0.4)^3 = 0.064 → incorrect majority.  
         - Probability majority correct: 0.216 + 0.432 = 0.648 (which is > 0.6).  
       - For n=5, we can skip the details but say the probability of majority correct is about 0.68 (if calculated).  
       - For n=14 (without calculation): it's higher than 0.6, but not 100% (e.g., if p=0.6, it's about 0.78).  
     - **Dependency reason**: The numbers make the theorem concrete. Without the prior steps (binary choice, competence, independence), the numbers are misleading. Also, we must show that n=14 is not "almost certain" if p is only slightly above 0.5.

  6. **The Reverse Case (5 minutes)**  
     - Explain that if `p < 0.5` (each member is worse than a coin flip), the theorem says the majority is more likely to be *wrong* as the group grows.  
     - Use the same example: if `p = 0.4` (each member is 40% likely to be correct), then for n=14, the majority is very likely to be incorrect.  
     - **Dependency reason**: This is the critical point that undermines the colleague's proposal. The theorem does not guarantee correctness unless we have competent individuals.

  ### The Single Example

  - **Choice**: A factual dispute about a local issue that is binary and has a clear right answer.  
    Example: *"Did the contractor use the required grade of material in the construction? (Yes/No)"*  
    - Why this works:  
      - It's binary (only two answers).  
      - There is a definite truth (the material either meets the grade or not).  
      - Each panel member can have some competence: they might review documents, photos, or hear testimony, but they are not experts (so `p` is above 0.5 but not 1).  
    - What it avoids:  
      - Not obvious: The evidence might be ambiguous, so members must exercise judgment.  
      - No pre-vote influence: We assume they form their opinions independently (without seeing others' votes).  
      - No averaging: It's not about estimating a number (like the cost of a project) but about a discrete fact.  

  - **Why urn-and-ball or repeated-coin misleads**:  
    - Urn: Drawing balls from an urn might imply that the truth is random (it's not; the urn's composition is fixed but unknown). Also, it can evoke the idea of sampling a continuous variable.  
    - Repeated coin: A biased coin flip for each member might be acceptable, but coins are independent by design, which might mask the fragility of independence in human groups.  
    - **Replacement**: Use the contractor example above. It's real, relatable, and avoids these pitfalls.

  ### Misconception Map

  1. **Misconception: CJT is like the law of large numbers for continuous quantities (errors canceling)**  
     - **Place to head off**: Immediately after introducing the binary example (Step 2).  
     - **Method**: Contrast with estimating a number (like the cost of a project) where the average of many guesses might converge to the truth. Emphasize that CJT is about a single binary question and there is no cancellation of errors – each vote is either right or wrong.

  2. **Misconception: The theorem licenses individuals to defer to the majority**  
     - **Place to head off**: After presenting the numerical example (Step 5).  
     - **Method**: Ask: "What happens if everyone thinks, 'I don't need to think hard because the majority will be right'?" Then point out: If everyone defers, then the individual competence `p` drops (because they are not trying) and might fall below 0.5. Then the theorem works in reverse! Also, the independence assumption is broken because they are following others.

  3. **Misconception: Independence just means no collusion**  
     - **Place to head off**: When introducing independence (Step 4).  
     - **Method**: Clarify that even without explicit collusion, members might be influenced by common sources (e.g., the same misleading news report) or group dynamics (e.g., a dominant speaker). Independence requires that, given the truth, the votes are not correlated. This is why deliberation can threaten independence.

  4. **Misconception: CJT describes deliberating bodies**  
     - **Place to allow to surface and then answer**: After the numerical example (Step 5) or during the discussion of independence.  
     - **Method**: Ask: "Does this apply to our panel when we deliberate?" Then explain: Deliberation can be good (it might raise `p` by sharing information) but bad for independence (if we convince each other, votes are no longer independent). CJT assumes no deliberation – just independent voting.

  5. **Misconception: CJT is about fairness or representation**  
     - **Place to head off**: At the beginning (Step 1) and when stating the theorem (Step 5).  
     - **Method**: Emphasize that CJT is about the accuracy of group decisions, not about whose voice is heard or the legitimacy of the process. It's a technical result about truth-tracking, not justice.

  ### The One Question at the End

  - **Question**: *"Suppose we find out that each of us, on our own, is only 40% likely to get the right answer on these tough questions. According to the theorem, what happens to the majority vote as we add more members?"*  
  - **Confident wrong answer**: Someone might say, "With more people, the majority becomes more accurate because there are more chances to get it right."  
  - **Right answer**: The majority becomes *less* accurate and more likely to be wrong.  
  - **Why it separates understanding**: It tests if they grasp that the theorem's effect depends on individual competence being above 0.5.

  ### What to Decline to Cover

  - **The mathematics behind the limit result**:  
    - Say: *"The theorem uses a mathematical result that as the group size goes to infinity, the probability of a correct majority approaches 1. But we don't need the proof; we can accept that it happens because the numbers push in that direction when each member is more likely right than wrong."*  
  - **Correlated votes**:  
    - Gesture at it: *"What if our votes are not independent? For example, if we all read the same misleading report? Then the theorem doesn't apply as cleanly, and the majority might not be as reliable. That's a real concern in practice, but the math for that is beyond our scope today."*  
    - Why gesture: Because leaving it unmentioned would make the theorem seem more robust than it is, and your colleague's proposal ignores this.

  ### Summary of Time Allocation

  - Introduction and context: 5 min  
  - Binary example: 10 min  
  - Individual competence: 5 min  
  - Independence: 5 min  
  - Theorem and numbers: 10 min  
  - Reverse case: 5 min  
  - Wrap-up and question: 5 min (including the one question and disclaimers)  

  Total: 40 minutes.

  This plan ensures that the critical assumptions (binary choice, p>0.5, independence) are built step by step and that the misconceptions are addressed at the right moments.
answer: |-
  Below is a structured plan for your 40-minute explanation of the Condorcet jury theorem (CJT) to the panel. It addresses your constraints (no slides, minimal math, whiteboard-friendly) and focuses on clarity, relevance, and preempting misconceptions. The goal is to show why CJT does **not** justify your colleague's proposal to blindly follow a bare majority.

  ---

  ### **1. Order of Presentation with Dependency Reasons**  
  *(Total: 40 minutes)*  
  **Dependency logic:** CJT’s conclusion is fragile and counterintuitive. If you state the headline result first ("majority is likely correct"), the audience will miss that this *depends entirely* on unstated assumptions. Reveal the mechanics step by step to force engagement.  

  | Time | Step | Key Points | Dependency Reason |
  |------|-------|------------|-------------------|
  | **0–5 min** | **Hook: Relate to the panel’s experience** | Start with your colleague’s claim: "14 people → majority almost certain to be right." Ask: *"Is this true? Does numbers alone guarantee wisdom?"* State CJT seems to support this—but only under strict conditions. | Establishes stakes. If you jump to CJT’s conclusion here, the audience will assume it’s unconditional and stop listening. |
  | **5–15 min** | **Core example: Binary choice with uncertainty** | Introduce your single example (see Section 2 below). Frame it: *"We must decide a yes/no fact, but we’re unsure. Each of us investigates alone."* | CJT only applies to binary choices with a **determinate right answer**. Without this, the theorem is meaningless. |
  | **15–20 min** | **Individual competence: p > 0.5** | Define "competence" (p): Probability one member is right. Stress: **CJT requires p > 0.5 for every member** (better than a coin flip). Use whiteboard: Show p=0.6 vs. p=0.4. | **Critical dependency:** If you discuss majority competence before individual competence, the audience won’t grasp that CJT collapses if p≤0.5. Same reasoning "backwards" (p<0.5 → majority likely *wrong*) must be shown *before* the theorem. |
  | **20–25 min** | **Independence: What it is (and isn’t)** | Define independence: *"Once the truth is fixed, my being right doesn’t affect your chance of being right. No shared biases, no peer influence."* Contrast with deliberation (e.g., group discussion skewing votes). | **Must come BEFORE numbers.** If introduced after, the audience will assume "no collusion" is enough (it’s not). Independence is CJT’s most brittle assumption—break it, and the theorem fails. |
  | **25–35 min** | **CJT result + Numbers** | Present CJT: *"If p>0.5 + independence, then larger groups → majority more likely correct."* Use a table (see below) for n=3, n=5, n=14. Show p=0.6 → P(majority correct) ≈0.71 for n=14 (not "almost certain"!). Contrast with p=0.4 → P(majority correct) ≈0.29 (majority likely *wrong*). | Numbers make it concrete, but ONLY after competence/independence are clear. If shown earlier, the audience will ignore assumptions. |
  | **35–40 min** | **Conclusion + Q&A** | Recap: CJT needs (1) binary truth, (2) p>0.5, (3) independence. Without these, majority ≠ truth. End with your "one question" (Section 4). | Ensures the takeaway is about assumptions, not the headline. |

  **Whiteboard Table for CJT (n=14, p=0.6)**:  
  ```  
  Individual skill (p): 0.6  
  Group size: 14  
  Majority needed: At least 8 correct  
  Probability majority correct: ~71% (≈7 in 10)  
  ```  
  *(No binomial formula: Just say "math shows..." and focus on intuition. For contrast, add p=0.4 → ~29%.)*  

  ---

  ### **2. The Single Example**  
  **Choice**: *"Did Contractor X violate the noise ordinance last Tuesday?"*  
  - **Why this works**:  
    - Binary: Yes/no (violation occurred or not).  
    - Determinate truth: There is a fact (e.g., security camera footage exists but isn’t shown to the panel).  
    - Skill without certainty: Members review evidence (e.g., decibel reports, witness statements) but have limited expertise; p≈0.6 is plausible.  
  - **What it avoids**:  
    - No "obvious" answer: Evidence is conflicting (e.g., witnesses disagree). Prevents short-circuiting debate.  
    - No pre-vote influence: Members vote secretly based on personal review.  
    - No "averaging": Not a continuous quantity (e.g., "How loud was it?"), which would evoke error-cancellation intuitions.  
  - **Why urn/coin examples fail**:  
    - Urn/balls: Feels like estimating a proportion (e.g., "40% red balls"), evoking averaging. Avoid.  
    - Repeated coins: Reduces voters to mindless flippers, hiding that CJT requires *human judgment* (which can be skilled or biased).  
  - **Use this instead**: Stick to the contractor example—it mirrors real panel work and makes competence/independence tangible.  

  ---

  ### **3. Misconception Map**  
  Preempt these at **specific points**—do not let them linger.  

  | Misconception | When to Address | How to Head Off | Why Not Let It Surface? |
  |---------------|-----------------|-----------------|--------------------------|
  | **CJT = "Errors cancel" for continuous quantities** | During **core example (5–15 min)**. After introducing the binary choice. | *"CJT isn’t about averaging guesses (like 'How much will this cost?'). It’s about a single right/wrong question. Errors don’t cancel—they pile up or align."* | If unaddressed, the audience will default to intuitive (but wrong) averaging logic. |
  | **"Defer to the majority"** | During **CJT result (25–35 min)**. After showing numbers. | *"If everyone defers, no one uses their skill. p drops below 0.5 → majority likely wrong. CJT needs you to think for yourself!"* | Must be preempted because it destroys the competence CJT relies on. |
  | **Independence = "No collusion"** | During **independence definition (20–25 min)**. | *"Independence isn’t just no secret deals. It means even with the truth fixed, my being right doesn’t make you more likely right. Shared biases (e.g., all read the same misleading news) break it."* | If allowed first, the audience will assume "no collusion" suffices. |
  | **CJT applies to deliberation** | During **independence (20–25 min)**. | *"Deliberation can help skill but hurt independence. If I sway your vote, we’re no longer independent. CJT assumes private votes."* | Let it surface here: Ask, *"Does this fit how we discuss?"* Then explain the tension. |
  | **CJT = Fairness/legitimacy** | In **hook (0–5 min)** and **conclusion (35–40 min)**. | *"CJT is about accuracy, not fairness. A majority could be right but unjust (e.g., ignoring a minority’s rights)."* | Preempt early—political panels often conflate truth with legitimacy. |

  ---

  ### **4. The One Question**  
  **Question**: *"If each of us is only 40% likely to be right (p=0.4), what does CJT say about our 14-person majority?"*  
  - **Confident wrong answer**: *"More people → better chance! Errors will cancel out."* (Shows they confused CJT with averaging.)  
  - **Right answer**: *"The majority is likely *wrong*—and gets worse with more people."* (Requires grasping p<0.5 reversal.)  
  - **Why it works**: Tests if they understand CJT’s competence dependence. Those who parrot "majority is always better" will fail.  

  ---

  ### **5. What to Decline to Cover**  
  Be transparent about limits to avoid overselling:  
  - **Mathematics of the limit**: *"CJT says with huge groups, majority correctness nears 100%—but the proof uses math beyond arithmetic. For us, what matters is the trend: bigger groups help only if p>0.5 and independence holds."*  
  - **Correlated votes**: *"If votes are correlated (e.g., everyone trusts the same flawed report), CJT breaks. The math gets complex, but the takeaway is simple: Shared biases make our majority less reliable. Sadly, that’s common in real life."*  
  - **Why gesture at correlation?** Leaving it unmentioned implies your colleague’s proposal is safe. Highlighting it warns that real groups rarely satisfy CJT’s ideal.  

  **Closing script**: *"Today’s goal isn’t to solve deliberation—it’s to show why CJT doesn’t make majority rule automatic. We need your judgment, not just numbers."*  

  ---  
  This plan respects your constraints, targets misconceptions, and roots CJT in the panel’s reality. By ending with the question, you force reflection—not just passive acceptance.
