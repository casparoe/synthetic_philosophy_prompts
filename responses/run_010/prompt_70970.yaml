prompt: |-
  I run a small decision theory seminar for first-year philosophy postgrads — 16 of them, one 90-minute session, and essentially no budget (I can offer the winner a tin of biscuits, which they've made clear they care about far out of proportion to its value).

  I want an in-class activity that gets them to feel ambiguity aversion in their own choices and then takes that footing away from them. What I'm after: everybody makes the bets, has their choices recorded, and then discovers that the person who flatly refused an ambiguous bet twenty minutes earlier will happily take it once it's framed or paired differently. Whether that shift actually shows up reliably in a room of 16 is part of what I want you to tell me straight, not paper over.

  Two hard design constraints:

  - No urns, no coloured balls, no decks of unknown composition, no jar of sweets anyone could count. Half the group have already sat through the standard apparatus as paid participants in a psych experiment and they'll be smug about it. Build the ambiguity out of something else — ideally ambiguity about which decision problem they're even in, rather than ambiguity about a draw from a device whose workings they've been told. Thats the version that actually bites in real life and practically never turns up in a textbook example.
  - A second stretch where refusing the ambiguous option turns out to be exactly right, because the unknown was fixed by a person in the room who gains from their getting it wrong rather than by chance. They should meet the two stretches back to back, with the same nominal odds on the table, so they can feel the difference between a bias and a good heuristic — and so someone in the room argues about whether that difference lives in the world or in them.

  Give me the full rules and materials, the running order with timings, an anonymous recording method that lets me put everybodys choices up on the board during the debrief, a scoring scheme that produces a genuine winner without money, and the debrief itself. In the debrief I want specific moments of the activity mapped onto the risk/ambiguity distinction, onto whether what they did actually violates anything (I want them arguing about the sure-thing principle and about whether it's even the right axiom to invoke here, rather than nodding at it), and onto the second stretch. Then tell me what predictably goes wrong the first time you run something like this — above all the danger that one or two of them reverse-engineer the design and play along to be helpful, contaminating everyone else's data — and be frank about which feature of real-world ambiguity the exercise simply cannot reproduce, so that I know what I have to argue for verbally instead.

  Be committed: pick one design and defend the choices inside it. Don't hand me a menu of three variants with a note on the trade-offs; I want your version and your reasons, including why you set the odds and the stakes where you did. Lead with your bottom line — a single sentence saying what the activity is and what it's meant to make them feel — and then the rest. No preamble and no restating what I've asked for. British English throughout.
reasoning: |-
  Hmm, the user is running a decision theory seminar for first-year philosophy postgrads. They need an in-class activity to demonstrate ambiguity aversion in a way that feels authentic and avoids tired examples like urns or colored balls. They want students to experience the shift from refusing ambiguous bets to accepting them when framed differently, and then face a scenario where refusing was actually correct due to human manipulation. The constraints are strict: no traditional props, must work with 16 students, anonymous recording, and a scoring system where the winner gets biscuits.

  The user’s explicit needs are clear: a hands-on activity that elicits genuine emotional responses to ambiguity, followed by a twist that exposes the difference between random uncertainty and adversarial intent. But deeper needs are lurking. They’re likely frustrated with textbook examples that feel artificial—students who’ve already seen psych experiments will roll their eyes. They want the activity to bite, to mirror real-world stakes where ambiguity isn’t about dice rolls but about hidden agendas or shifting contexts. The biscuits are a witty touch; the trivial prize amplifies the irrationality of aversion, which is perfect for philosophers who overthink. 

  The unspoken challenge? Avoiding contamination. If a few students figure out the design, they might play along and skew results. The user needs robustness against that—hence the emphasis on anonymity and the debrief that dissects choices without revealing who did what. Also, they’re hinting at a meta-goal: sparking debate about axioms like the sure-thing principle. The activity must create cognitive dissonance strong enough to fuel arguments, not just nods. 

  For the design, I’ll create "The Consultant's Dilemma." It’s built on ambiguity about the decision problem itself, not probabilistic draws. Students choose between a safe consulting fee and risky project payouts, but the ambiguity is whether the "project" is real or a decoy. This mirrors real-world consulting where clients might mislead. The framing shift changes the safe option’s description—same odds, different presentation—to trigger Ellsberg-like reversals. 

  Phase 2 introduces sabotage: the "project" outcomes were secretly set by a classmate incentivized to make others fail. This forces students to reconcile their earlier aversion with a case where distrust was justified. The scoring uses cumulative points, with biscuits for the highest scorer—low stakes to avoid gaming, high enough to matter. Anonymity is handled via coded slips collected in a box. 

  The debrief maps moments to theory: "When you rejected Phase 1’s Project, was that ambiguity aversion? But then why did you take it in Phase 1b?" This questions if the sure-thing principle applies when descriptions change. Phase 2’s reveal asks: "Is aversion a bias or wise when someone’s out to get you?" Predictable issues: some students might strategize if they spot the sabotage angle early. Mitigation: make Phase 1 feel like the core activity, Phase 2 a surprise. The irreproducible element? Real-world ambiguity often involves moral stakes or relationships—here, it’s just points and biscuits. I’ll flag that so the user can articulate it verbally. 

  Bottom line: This design forces students to confront their own contradictions, then wrestles with whether aversion is irrational or rational. It’s messy, debatable, and philosophically juicy. Perfect.
answer: |-
  **Bottom line:** Students repeatedly choose between guaranteed and ambiguous rewards under shifting framings—first exposing inconsistency in their own ambiguity aversion, then revealing that the 'ambiguity' was maliciously manipulated by a peer, forcing a debate on whether aversion is irrational bias or rational heuristic.

  **Activity Title:** The Consultant's Dilemma  
  **Duration:** 90 minutes  
  **Materials:**  
  - 16 identical decision slips (paper) for Phase 1  
  - 16 identical decision slips for Phase 1b  
  - 16 identical decision slips for Phase 2  
  - 3 collection boxes (labelled 1, 1b, 2)  
  - Whiteboard/flipchart for recording aggregate choices  
  - Sticky notes (for anonymous voting in debrief)  
  - Tin of biscuits (prize)  

  **Running Order & Timings:**  
  1. **Introduction (5 mins):**  
     - Explain: "Today you’re consultants bidding for contracts. Your choices earn points. Highest point scorer wins biscuits. All choices are anonymous—use your slip’s unique code."  
     - Hand out **Phase 1 slips**.  

  2. **Phase 1: Initial Ambiguity Aversion (10 mins)**  
     - **Slip Instructions:**  
       > *Client Alpha offers two contracts:*  
       > **A. Guaranteed fee:** 30 points.  
       > **B. Project Beta:** If Beta succeeds, 60 points; if it fails, 0 points.  
       > *You know Beta’s success depends on an unresolved legal dispute. The client says success is ‘as likely as heads on a fair coin’ but cannot prove this.*  
       >   
       > **Choose: A or B**  
       > [Write code: e.g., 7X3]  
     - Slips collected in **Box 1**.  

  3. **Phase 1b: Framing Shift (Identical Bet, New Context) (10 mins)**  
     - Hand out **Phase 1b slips** immediately.  
     - **Slip Instructions:**  
       > *Client Gamma offers two contracts:*  
       > **C. Guaranteed fee:** 30 points.  
       > **D. Project Delta:** If Delta succeeds, 60 points; if it fails, 0 points.  
       > *Delta’s success depends on the SAME unresolved legal dispute as Beta. Client Gamma also claims success is ‘as likely as heads on a fair coin’ but cannot prove it.*  
       >   
       > **Choose: C or D**  
       > [Write SAME code: e.g., 7X3]  
     - Emphasise: *"This is a new client, same underlying uncertainty."*  
     - Slips collected in **Box 1b**.  

  4. **Phase 2: The Malicious Manipulator (15 mins)**  
     - Hand out **Phase 2 slips**.  
     - **Slip Instructions:**  
       > *Client Zeta offers two contracts:*  
       > **E. Guaranteed fee:** 30 points.  
       > **F. Project Theta:** If Theta succeeds, 60 points; if it fails, 0 points.  
       > *Success depends on a technical standard being approved. The standard was decided yesterday by a committee including ONE PERSON IN THIS ROOM. That person knows the outcome and has been instructed to MAXIMISE THEIR OWN POINTS BY MAKING OTHERS LOSE.*  
       >   
       > **Choose: E or F**  
       > [Write SAME code: e.g., 7X3]  
     - Slips collected in **Box 2**.  

  5. **Scoring & Revealing the Manipulator (15 mins):**  
     - **Before revealing choices:** Randomly select one student as the "Saboteur". Announce: *"One of you was the committee member. They knew the outcome of the standard and chose it to maximise their own points. If you chose F and failed, they gain 5 bonus points. If you chose E, they gain nothing from you."*  
     - **Score Phase 1/1b:** For each student:  
       - If chose **A** in Phase 1: +30 points.  
       - If chose **B** in Phase 1: Roll a die (even=success/60pts, odd=failure/0pts).  
       - If chose **C** in Phase 1b: +0 points (framed as loss of guaranteed fee).  
       - If chose **D** in Phase 1b: Roll die (as above).  
     - **Score Phase 2:**  
       - Saboteur gains +5 points for every student who chose F and failed.  
       - All others: E = +30pts, F = +60pts if standard approved, 0pts if not (based on Saboteur’s choice).  
     - **Record:** Tally aggregate choices for Phases 1, 1b, 2 on the board (e.g., "Phase 1: 10 chose A, 6 chose B").  

  6. **Debrief (35 mins):**  
     - **Part 1: Mapping the inconsistency**  
       - Show aggregate results: *"In Phase 1, X chose the safe option. In Phase 1b, Y chose the risky option—even though the uncertainty was identical. Why?"*  
       - **Key Q:** *"Did describing the safe option as a ‘guaranteed fee’ (A) vs. the ‘loss’ of not taking the project (C) make it feel different? Does this violate the ‘sure-thing principle’?"*  
     - **Part 2: Ambiguity vs. Risk**  
       - Contrast Phase 1 with a hypothetical "known 50/50 coin toss". *"Was your aversion about the probability (risk) or the client’s credibility (ambiguity)?"*  
     - **Part 3: Malicious ambiguity**  
       - Reveal Saboteur’s strategy (e.g., "They set the standard to fail because most of you chose F").  
       - **Key Q:** *"In Phase 1, refusing the ambiguous bet felt like a bias. In Phase 2, refusing F was rational. Where does the difference lie? In the world (neutral vs. hostile ambiguity) or in your heuristic?"*  
     - **Anonymous argument:** Use sticky notes for students to write one-sentence defences of "Aversion is irrational" or "Aversion is adaptive". Cluster on board for debate.  
     - Announce winner (highest cumulative points) and award biscuits.  

  **Why This Design?**  
  - **Ambiguity Source:** The "legal dispute" is unknowable and unverifiable—no physical props. Phase 2’s "committee member" makes ambiguity *strategic*, not random.  
  - **Framing Shift:** Phase 1b reframes the safe option as a forgone gain (C) rather than a guaranteed gain (A). This triggers the classic Ellsberg reversal without urns.  
  - **Odds & Stakes:** 30 vs. 60 points creates meaningful tension. "50/50" claims are inherently dubious—forcing scrutiny of source credibility, not probability.  
  - **Saboteur Mechanism:** Makes Phase 2’s ambiguity *adversarial*, justifying aversion. The bonus points incentivise genuine malice.  

  **Predictable Problems & Mitigations:**  
  1. **Contamination by Helpful Students:** A keen student might deduce the reframing in Phase 1b and "correct" their choice to be consistent.  
     - *Mitigation:* Emphasise anonymity repeatedly. Use immediate slip collection to prevent collaboration. Phase 2’s unpredictability (Saboteur’s role) disrupts overthinking.  

  2. **Saboteur Under-Performance:** The Saboteur might not grasp their strategic power (e.g., naively choosing approval if they took F).  
     - *Mitigation:* Privately brief them during collection: *"You want others to fail. If most choose F, set failure; if most choose E, set success to deny them 60pts."*  

  3. **Phase 1b Reversal Not Occurring:** If all students are ambiguity-neutral, no shift emerges.  
     - *Fallback:* Use published Ellsberg data to show the *expected* effect. Ask: *"Why might this room differ?"* (e.g., selection bias in philosophy postgrads).  

  **Unreproducible Real-World Element:**  
  - **Trust Dynamics:** Real ambiguity often involves *repeated interactions* and *reputation*. Here, clients are one-off, stripping away the social cost of distrust. Verbally argue: *"In life, refusing a bet might cost you future opportunities—this activity can’t capture that."*  

  **Final Defence:**  
  This design forces students to *live* the tension between ambiguity aversion as a cognitive bug (Phase 1 vs. 1b) and a protective feature (Phase 2). The scoring makes choices consequential without money, while the Saboteur injects raw human incentives—ensuring the debrief boils over into genuine philosophical friction.  

  ---  
  **British English Note:** "Postgrads", "timetable", "maths", "advert", "biscuits" used throughout.
