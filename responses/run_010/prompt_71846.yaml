  You're a social epistemologist who's good at building diagnostics instead of summaries, so think carefully before writing. I'm making a handout for an undergrad reading group — they've read Fricker on the two kinds of epistemic injustice and one Dotson paper, basically nothing else — and I want a self-sorting quiz: "which account of epistemic injustice do your case judgments actually commit you to?" Give me 8–10 items, each a small concrete scenario (a clinic, a staff meeting, a jury room, a group chat) with two or three response options, and none of the scenarios or options may contain the words *credibility*, *hermeneutic*, *testimony*, or *structural* — the reader should react to what happens, not to a label.

  First sketch the space of discriminations the quiz has to make (that part's for me, not the students), then build items around them. At minimum it needs to pull apart: a credibility deficit that isn't driven by identity prejudice — is that still an injustice, or just an error?; a speaker who isn't taken as a knower at all versus one who cuts her own account short because she knows the audience can't handle it; a real gap in the concepts people share versus an audience that has the concepts and won't use them; an utterance landing as a different speech act than the one intended (her order heard as a suggestion); and being the person everyone turns to for an education about their own situation, unpaid, at your own cost.

  Then a scoring key mapping answer patterns onto named positions: Fricker's testimonial and hermeneutical injustice, Dotson's contributory injustice plus her quieting/smothering pair, Pohlhaus's willful hermeneutical ignorance, Kukla's discursive injustice, Berenstain's epistemic exploitation, and one deflationary leaf saying there's no distinctively epistemic wrong here, just ordinary unfairness and bad epistemic character. One sentence per leaf on its most awkward commitment. Finally tell me which two leaves my items can't actually seperate and why, and flag any cell in the space nothing reaches — saying whether that's because no view occupies it or because you're out of room.
