  We are building a decision procedure for annotators to label isolated character images as the target letter (usually 'a') or not, with high inter-annotator agreement (IAA) and within tight time and volume constraints. The challenges include: multiple criteria for "a-ness", no linguistics background for annotators, two orthographies (with the single-bowl form being a separate letter in one), and the need to avoid both false positives (contaminating the class) and false negatives (wasting resources). The procedure must be efficient, with only 5% escalation to senior reviewers.

  ### Brainstorming: Criteria Selection
  The client expects IAA > 0.85, so we must reduce subjectivity. The four criteria (function, feature, genealogy, recognition) are philosophically distinct but in practice often correlated. However, they diverge in edge cases. We must operationalize some and discard others to create a clear, executable procedure.

  - **Function**: Discard. It requires understanding the writer's intent and the word context, which is often unavailable in isolated crops and introduces subjectivity. Without context, annotators cannot reliably infer function. Also, we have a constraint that context may be used only in specific cases. This criterion is too vague for our purpose and would lower IAA.
    - Loss: We lose the connection to the communicative act. In cases where a mark is intended as 'a' but is malformed, it might be rejected. However, without context, we cannot know intent, so this is unavoidable.

  - **Feature**: Keep and make central. This is the most operationalizable criterion. We can define a set of diagnostic features for 'a' relative to its rivals (which vary by hand) and train annotators to look for these. The rival set can be fixed for a given project (but note: the rival set shifts; we'll handle that by making the procedure rival-relative). This criterion allows for a step-by-step test and is objective once the rivals and features are defined.

  - **Genealogy**: Discard. The idea of a continuous deformation from a canonical form is too abstract for untrained annotators and would require tracing the letter's development, which is time-consuming and subjective. It also overlaps with feature (if the deformation preserves features) but adds a historical dimension that isn't necessary for recognition.
    - Loss: We lose the ability to accept highly deformed but historically traceable letters. However, such cases are rare and might be caught by the feature criterion if the deformation hasn't crossed into rival territory.

  - **Recognition**: Keep, but reinterpret. We cannot ask annotators to simulate a "competent reader" because that's what they are. Instead, we can use this as a fallback in the escalation tier (where senior reviewers, with more time, might use their reading skill). For the first pass, we rely on features to make recognition systematic. Also, note that the feature criterion is designed to capture what makes recognition above chance possible.
    - However, we must record when context is used because context-assisted labels cannot go into the shape-only set. So we'll allow context only in a controlled way.

  We are left with **feature** as the primary criterion and **recognition** as a backup in escalation. We must also respect the orthography difference: in one corpus, the single-bowl form is a separate letter, so the same shape might be labeled differently. This is a fixed parameter.

  ### The Decision Procedure

  We design an ordered sequence of tests. The goal is to terminate quickly with a label or reject, and only escalate when necessary (≤5%). We structure it as a flowchart of questions.

  #### 1. Ordered Sequence of Tests

  **Step 0: Pre-filter (non-letter and non-target)**
  - Question: Is the mark a letter? (vs. punctuation, digit, or non-linguistic mark)
    - If not, reject.
    - If yes, proceed.
  - Note: For the target letter, we are only concerned with the letter 'a'. But if the image is clearly not a letter (e.g., a smudge, a digit), reject immediately.

  **Step 1: Orthography Check (for the second orthography)**
  - Question: Is this corpus the one where the single-bowl form is a separate letter? (This must be pre-stated for the project; annotators know which corpus they are working on.)
    - If yes (second orthography), then the single-bowl form (which looks like a circle with a vertical stem on the right) is not an 'a'. Proceed to Step 2.
    - If no (first orthography), proceed to Step 2 normally.

  **Step 2: Rival-Relative Feature Check (Core)**
  - Concept: We define the rival set for 'a' as: o, u, e, d, 4 (digit), and the single-bowl form (if applicable in the orthography). The annotator must check if the mark has the features that distinguish 'a' from each rival in the set.
  - We break down the features for 'a' (in both manuscript and cursive) relative to each rival:
    - vs. 'o': 'a' has a vertical stem (or a tail) on the right, and the bowl is not fully closed at the top (or has a flat top in some cursive). If the mark is fully closed and round, it's more like 'o'.
    - vs. 'u': 'a' has a bowl at the bottom and the stem is on the right (for manuscript) or a loop at the top (for cursive). 'u' often has a curve at the bottom and a stem on the right, but without a bowl on the bottom left. The key is the left side: in 'a', the left side is a curve that meets the stem at the top (in manuscript) or has a loop (cursive). In 'u', the left side is typically a straight or curved downstroke without a bowl.
    - vs. 'e': 'a' has a distinct bowl and stem. 'e' has a horizontal bar and a curve but no vertical stem on the right. In cursive, they may be similar, but 'e' often has a loop at the top and then a horizontal stroke, while 'a' has a loop at the top and then a downstroke.
    - vs. 'd': 'd' has a tall stem (ascender) and a bowl that is attached to the stem. 'a' has a short stem (no ascender) and the bowl is attached at the baseline. In cursive, 'd' has a loop at the top and then a downstroke that goes below the baseline, while 'a' does not.
    - vs. '4': The digit 4 has a triangular top and a vertical stem, which might look like an 'a' in some hands. But the top of the 4 is angular and the bowl is open at the bottom, while 'a' has a closed bowl (or nearly closed) at the bottom and the top is curved.
    - vs. single-bowl form (if applicable): In the second orthography, the single-bowl form (which looks like an 'a' without an overstroke) is a separate letter. So if the mark is a single bowl with a stem and no overstroke, it is not 'a' in that orthography. In the first orthography, it is 'a'.

