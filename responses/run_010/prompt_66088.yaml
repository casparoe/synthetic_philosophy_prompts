       - But some cursive 'a' are closed. So we need to allow for that. How? We can say: if the mark is fully closed, then check the shape of the closure. If the closure is at the top and forms a loop (like a cursive 'a'), then it might be 'a'. But then how to rule out 'o'? In cursive, 'o' is also closed and might have a loop? This is difficult.

