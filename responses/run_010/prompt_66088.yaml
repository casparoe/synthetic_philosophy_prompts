  ### Brainstorming: Criteria Selection
  I'll operationalize **feature** and **recognition**, discard **function** and **genealogy**, and enforce **rival-relativity** as the core lens.  
  - **Feature (kept)**: Directly operationalizable via visual diagnostics. Anchors decisions in observable traits, critical for rival-relative judgments.  
  - **Recognition (kept, as fallback)**: Used only in escalation for "competent reader" simulation. Balances speed and accuracy.  
  - **Function (discarded)**: Requires intent/context, which is often unavailable and subjective. Loss: Rejects valid *intended* 'a's if features are ambiguous.  
  - **Genealogy (discarded)**: Abstract, time-consuming, and unverifiable. Loss: Excludes historically valid but deformed 'a's that don't meet feature thresholds.  

  Rival-relativity is non-negotiable: annotations must ask "Is this closer to 'a' than to its rivals (o, u, e, d, 4, or single-bowl)?" Orthography differences (single-bowl as separate letter) are built into Step 1.

  ---

  ### Decision Procedure  
  **Goal**: Terminate in ≤40s. Escalate ≤5% of cases. Senior reviewers may use context (recorded as "context-assisted"); such labels excluded from shape-only subset.  
  **Indeterminate tier**: Images failing clear feature tests or with borderline traits (e.g., ambiguous gaps). Capped at 5% via strict exit rules.  

  **Ordered Tests** (exit at first conclusive answer):  
  1. **Orthography check (5s)**:  
     - *Q*: "Is this from the orthography where the single-bowl shape (closed loop + stem) is its own letter?"  
     - *Sufficient answer*: Yes → Reject if single-bowl shape. No → Proceed.  
     - *Exit*: Reject or proceed.  

  2. **Rival-relative shape scan (10s)**:  
     - *Q*: "Does the mark have a rounded bottom (bowl) + a vertical/hooked stem on the right? If not, reject. If yes, is the top-right open (gap) OR looped?"  
     - *Sufficient answer*: No bowl/stem → Reject. Bowl/stem present but no gap/loop → Reject (fails vs. 'o'). Proceed if gap/loop.  
     - *Exit*: Reject or proceed.  

  3. **Stem and rival guardrails (10s)**:  
     - *Q*: "Does the stem extend above the x-height? If yes, reject (vs. 'd'). Is the left side curved? If straight, reject (vs. 'u'). Is the top angular? If yes, reject (vs. '4')."  
     - *Sufficient answer*: Stem too tall/straight/angular → Reject. Else → Label 'a'.  
     - *Exit*: Label or reject.  

  4. **Borderline handling (5s)**:  
     - *Q*: "Is any feature ambiguous (e.g., gap size, stem angle, loop definition)?"  
     - *Sufficient answer*: Yes → Escalate. No → Apply Step 3.  
     - *Exit*: Escalate (if unsure) or apply Step 3.  

  **Stop conditions**:  
  - **Label** if all tests pass.  
  - **Reject** if any test fails.  
  - **Escalate** only if Step 4 triggers (ambiguous features). Volume controlled by strict "unsure" threshold.  

  ---

  ### Annotator Language (Non-Technical)  
  - **Bowl**: "Rounded bottom part, like a cup."  
  - **Stem**: "Straight or hooked line attached to the *right* of the bowl, going up."  
  - **Gap**: "Space at the *top-right* where the bowl and stem don’t touch."  
  - **Loop**: "Curve above the bowl connecting to the stem, like a lasso."  
  - **X-height**: "Height of small letters (e.g., 'o') in the same word/image."  
  - **Rival check**: "Ask: Could this be a 'u' (straight left side)? A 'd' (tall stem)? A '4' (pointy top)? An 'o' (no gap/loop)? If closer to any rival, reject."  

  ---

  ### Context Rule  
  - **First-pass annotators**: **Never** use context. Decide solely on the cropped image.  
  - **Senior reviewers**: May use context *only* if escalated. Record as "context-assisted"; exclude from shape-only datasets.  
  - **Rationale**: Prevents contamination of shape-only data. Context is a tool for escalation only.  

  ---

  ### Rival-Relativity Enforcement  
  Embedded in all steps:  
  - Step 2 explicitly compares to 'o' (gap/loop) and 'u' (curved left side).  
  - Step 3 compares to 'd' (stem height), 'u' (left side), and '4' (angular top).  
  - Single-bowl handled in Step 1 (orthography-dependent).  
  - **Annotator framing**: "Your job isn’t to decide if this is 'a'—it’s to decide if it’s *more like 'a' than its lookalikes*."  

  ---

  ### One-Page Annotator Card  
  ![Annotator Card](https://via.placeholder.com/400x600?text=Annotator+Card+Image+Placeholder)  
  *Text version*:  
  1. **START**: Is it a letter? No → REJECT.  
  2. **Orthography**: Single-bowl = own letter? Yes + single-bowl shape → REJECT.  
  3. **Shape**: Bowl + stem? No → REJECT. Top open (gap) OR looped? No → REJECT.  
  4. **Rivals**: Stem too tall? (vs. 'd') → REJECT. Left side straight? (vs. 'u') → REJECT. Top pointy? (vs. '4') → REJECT.  
  5. **Unclear?** Unsure → ESCALATE. Else → LABEL 'a'.  
  **Rivals**: o (no gap), u (straight left), d (tall stem), 4 (pointy top).  
  **Time**: ≤40s. **Context**: Never use.  

  ---

  ### Judgment Calls and Systematic Errors  
  **Judgment calls masked as procedure**:  
  - Gap size ("open" vs. "closed"): Threshold not quantified (e.g., "gap visible at arm’s length").  
  - Loop definition: Subjective recognition of "loop" vs. "smudge."  
  - X-height estimation: Eyeballed from isolated crops.  
  - "Curved" left side: Subjective curvature assessment.  

  **Systematic errors**:  
  - Rejects deformed (but intended) 'a's lacking key features.  
  - Misses cursive 'a's with closed tops if loops are ambiguous.  
  - Over-rejects uppercase variants (see Case 3).  
  - Fails on hybrid hands (e.g., cursive-manuscript mix).  

  ---

  ### Case Tests  
  **Case 1: Isolated crop (gap = ⅕ x-height)**  
  - Step 1: Assume Orthography 1 (single-bowl not separate) → Proceed.  
  - Step 2: Bowl + stem present. Gap visible → Pass.  
  - Step 3: Stem not tall, left side curved, top not angular → **Label 'a'**.  

  **Case 2: Same shape in "cat"**  
  - Identical to Case 1 (first-pass ignores context) → **Label 'a'** (non-context-assisted).  

  **Case 3: Display 'A' (open apex, no crossbar)**  
  - Uppercase → Uppercase track not defined in core procedure (optimized for 'a').  
  - **Result**: Rejected at Step 2 (no bowl/stem) or Step 3 (angular top).  
  - **Cost of keeping**: Add uppercase track:  
    - *Q*: "Two diagonal strokes meeting at bottom? Top closed/crossbar?"  
    - Open apex + no crossbar → Escalate (indeterminate). Senior accepts as 'A' but excludes from shape-only.  
    - **Tradeoff**: Adds complexity; requires training on uppercase rivals (e.g., 'H', 'Δ').  

  ---

  ### What the Procedure Cannot Do  
  - **Preserves letter identity?** No—it substitutes a **labeling convention** based on features and rival thresholds.  
  - **Where it bites**:  
    - Rejects functional 'a's with minor feature deviations (e.g., a 5-year-old’s malformed 'a').  
    - Accepts feature-perfect marks not intended as 'a' (rare, but possible in ambiguous hands).  
    - Silences genealogy/function debates; prioritizes pipeline efficiency over philosophical depth.  

  ---

  ### Confidence Assessment  
  - **Feature focus (High)**: Maximizes IAA and rival-relativity.  
  - **Recognition fallback (Medium)**: Subjective but capped at 5%.  
  - **Context ban (High)**: Protects shape-only data integrity.  
  - **Rival-relativity (High)**: Built into every step.  
  - **Orthography handling (Medium)**: Clear but risks confusion if projects switch.  
  - **Uppercase exclusion (Low)**: Case 3 shows weakness; needs dedicated track.  

  **Least sure point**: **Gap/loop threshold in Step 2**. Justification: Borderline gaps (e.g., 1/10 x-height) cause escalation spikes.  
  **Settling evidence**: Measure IAA on gap-size samples. If <0.85, add quantitative rule (e.g., "gap ≥ 1/8 x-height").
