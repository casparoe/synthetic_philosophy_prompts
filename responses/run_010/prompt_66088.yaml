  **Final Core Test (style-agnostic)**:

  - **Q1**: Does the mark have a closed or nearly closed bowl at the bottom? (Nearly closed means the gap is less than 1/3 of the x-height.) [This rules out marks that are open at the bottom, which might be 'u' or 'v'.]
