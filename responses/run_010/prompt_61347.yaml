prompt: |-
  I convene a third-year seminar in the philosophy of history whose closing unit is on periodization, and I am setting the final examination. The paper is closed book and consists of a single essay question worth 40 marks, to be attempted in 90 minutes. I would like you to draft the question, a model answer, and a marking scheme.

  What I want to avoid is the recitation my students are best equipped to produce. They arrive able to rehearse, accurately and at length, the standard debunking material: that "the Middle Ages" is a label fastened on an interval by people who conceived of themselves as standing after it and above it; that the great nineteenth-century account of the Renaissance tied the period to the emergence of the modern individual; that the "Scientific Revolution" is to a considerable degree a construction of the century that named it. None of that should earn marks, because none of it requires understanding. I want the question to force the conceptual issue instead — what would have to be true for a period label to pick out something real rather than something merely convenient, and whether the lateness and the interestedness of the coinage bear on that question at all.

  The device I want the question built around is a proposal I have invented for this paper. No historian has advanced it, and neither the question nor the model answer should imply that it is an established term of art. A colleague proposes to retire "the Renaissance," in its broad cultural sense, and replace it with "the Long Recovery," running from the mid-fourteenth-century demographic collapse to the early sixteenth century. The claim is that the new label earns its place not by enumerating admired achievements — linear perspective, humanist philology, the rediscovery of a lost ancient poem on the nature of things — but by naming a mechanism: the rebuilding of population, wages, textual supply, universities, and lay administration after the crisis, a mechanism with a discernible onset and a discernible exhaustion, after which a different set of dynamics takes hold. On this view the boundaries of a period are set by the mechanism rather than by the historian's taste.

  The question must be self-contained, so that a candidate can attempt it with nothing beyond the description above and the seminar. It should require candidates to do three things: give an account of what makes a period label pick out something real; state whether late and interested coinage is relevant to that account, and if so how; and rule on whether "the Long Recovery" improves on "the Renaissance" by the account they have defended. A candidate should not be able to reach a verdict on the third part without having committed themselves on the first two.

  Please supply the following. First, the question exactly as it would appear on the paper, with the mark allocation and the stipulated description of the proposal included. Second, a model answer of 900 to 1,100 words, written as a self-contained argument with no footnotes, no bibliography, and no citations; where it deploys philosophical machinery — cluster-based accounts of what makes something a genuine kind, the difference between classifications that merely sort their objects and classifications that change what they sort, the possibility that a dispute is merely verbal — it should explain that machinery rather than attach a name to it and move on. Third, a marking scheme totalling 40 marks, organised around five or six must-hit moves, each with the marks it carries, a statement of what a candidate must actually say in order to earn them, and the characteristic way in which candidates get it wrong. No marks should be allocated for attribution or for the recitation of scholars' names. Fourth, a short paragraph separating a first-class answer from a strong second-class one in terms of moves rather than topics.

  Three sophisticated-but-wrong manoeuvres should be singled out in the marking scheme as costing marks, each with a sentence explaining why it fails: inferring from "constructed" to "not real"; treating the interest-relativity of every classification scheme as though it were a debunking argument against some particular ones; and appealing to the feedback effects of naming an age so as to make any period label whatsoever automatically real. Finally, tell me what a fluent, well-informed answer consisting entirely of historiographical survey should score, and justify the figure in two or three sentences, so that markers who disagree with me can see the reasoning.
reasoning: |-
  We are creating a final examination question for a third-year philosophy of history seminar. The focus is on periodization, and we want to avoid mere recitation of standard debunking material. Instead, we want to force engagement with the conceptual issue: what makes a period label pick out something real, and whether the lateness and interestedness of the coinage matter.

  The device is a fictional proposal: replace "the Renaissance" with "the Long Recovery" (defined as from mid-14thC demographic collapse to early 16thC). The claim is that "the Long Recovery" names a mechanism (rebuilding after crisis) with a discernible onset and exhaustion, thus setting boundaries by the mechanism, not by the historian's taste.

  The question must require three things:
  1. An account of what makes a period label pick out something real.
  2. A statement on whether late and interested coinage is relevant to that account, and if so how.
  3. A ruling on whether "the Long Recovery" improves on "the Renaissance" by the account defended.

  We must avoid any implication that "the Long Recovery" is an established term.

  Now, we will draft:

  1. The question as it would appear on the paper.
  2. A model answer (900-1100 words) that is self-contained, explains philosophical machinery without citations, and addresses the three parts.
  3. A marking scheme (40 marks) with 5 or 6 must-hit moves, including penalties for three specified wrong maneuvers.
  4. A short paragraph distinguishing first-class from strong second-class answers.
  5. A note on what a fluent but entirely historiographical survey answer should score.

  Let's proceed step by step.

  ### 1. The Question

  **Final Examination Question (40 marks, 90 minutes)**

  A colleague proposes to replace the term "the Renaissance" (in its broad cultural sense) with "the Long Recovery". The proposed period runs from the mid-fourteenth-century demographic collapse (marked by events like the Black Death) to the early sixteenth century. The claim is that "the Long Recovery" earns its place by naming a mechanism: the rebuilding of population, wages, textual supply, universities, and lay administration after the crisis of the mid-fourteenth century. This mechanism is said to have a discernible onset (the mid-fourteenth-century collapse) and a discernible exhaustion (by the early sixteenth century, when a different set of dynamics takes hold). On this view, the boundaries of the period are set by the operation of the mechanism, rather than by the historian's taste for particular achievements (such as linear perspective, humanist philology, or the rediscovery of ancient texts).

  Write an essay that addresses the following:

  (a) What, in general, would have to be true for a period label to pick out something real (as opposed to being merely convenient or arbitrary)? (15 marks)

  (b) Does the fact that a period label is coined late (by people living after the period) and for interested reasons (to serve some agenda of the namers) bear on whether it picks out something real? Explain why or why not. (10 marks)

  (c) By the account you have defended in (a) and (b), does "the Long Recovery" improve on "the Renaissance" as a label for the period? (15 marks)

  Your essay must be self-contained and must not rely on any external sources beyond the description above and the content of the seminar. You should not assume that "the Long Recovery" is an established term of art.

  ### 2. Model Answer (900-1100 words)

  **Model Answer**

  The question of what makes a period label pick out something real, rather than being a mere convenience or arbitrary invention, is central to the philosophy of history. This essay will first develop an account of what it takes for a period label to be real, then consider whether the lateness and interestedness of the coinage affect that reality, and finally apply this account to the proposed replacement of "the Renaissance" with "the Long Recovery".

  **(a) What makes a period label real?**

  A period label is real if it identifies a genuine historical kind. A genuine historical kind is not just a collection of events that happen to fall between two dates. Instead, it must capture a set of interconnected phenomena that are bound together by a common mechanism or structure that unfolds over time. This mechanism must be such that it gives the period an internal unity and sets it apart from what comes before and after. 

  To understand this, consider an analogy from biology: a species is a natural kind because its members share a common lineage and reproductive mechanism. Similarly, a historical period might be a natural kind if there is a causal mechanism that operates throughout the interval and shapes the major developments. For instance, if we say "the Industrial Revolution", we imply a mechanism of technological innovation and economic transformation that reshaped society in a way that was not merely additive but transformative. The label picks out a real period if such a mechanism was actually at work, driving changes that are interconnected and distinctive.

  Moreover, a real period must have boundaries that are not arbitrary. The onset should be marked by the beginning of the operation of the defining mechanism, and the end by its exhaustion or replacement by a different mechanism. This does not mean that the boundaries are sharp; they might be fuzzy, but they must be grounded in the historical process itself, not in the historian's preferences. 

  However, note that historical periods are not found in the world like rocks; they are identified by historians. But that does not make them unreal. The reality of a period depends on whether the mechanism it posits was actually operative and whether the boundaries correspond to real transitions. We might call this a "realist" view of periodization: there are real historical patterns, and a period label is successful if it carves history at its joints.

  **(b) Does late and interested coinage matter?**

  The fact that a period label is coined late and for interested reasons does not automatically make it unreal. It might be that the label, even if coined with an agenda, still captures a real mechanism. For example, the term "the Enlightenment" was coined in the 19th century and used to promote certain values, but it might nonetheless pick out a real intellectual and cultural movement. 

  The key point is that the reality of the period is independent of the motives of the namers. What matters is whether the label accurately describes a historical pattern. If the pattern is real, then even if the namers had an agenda, the label can be valid. However, the lateness and interestedness of the coinage can be a warning sign: it might indicate that the label is being imposed for present purposes rather than discovered in the past. But this is only a heuristic. The ultimate test is whether the mechanism exists.

  We must avoid two mistakes here. First, we must not infer that because a label is constructed (i.e., invented by historians) it is therefore not real. All classifications are constructed in the sense that they are human products, but some constructions may correspond to reality. Second, we must not confuse interest-relativity with unreality. Every classification serves some interest, but that does not mean it fails to capture reality. For instance, the classification of stars by their temperature serves the interest of astronomers, but it also reflects a real physical property.

  Thus, lateness and interestedness do not by themselves make a period label unreal. They call for critical scrutiny, but the label's reality depends on whether it captures a genuine historical kind.

  **(c) Does "the Long Recovery" improve on "the Renaissance"?**

  By the account defended above, a period label improves if it better captures a genuine historical kind. "The Renaissance" traditionally emphasizes cultural achievements and the revival of antiquity. But if these achievements are not tied together by a common mechanism, the label might be arbitrary. For example, the rediscovery of Lucretius' poem and the invention of linear perspective might be isolated events, not parts of a unified process.

  "The Long Recovery", by contrast, proposes a mechanism: the rebuilding after the mid-fourteenth-century collapse. This mechanism includes demographic recovery, economic rebuilding (rising wages), the restoration of textual supply (as manuscripts were copied and distributed), the expansion of universities, and the growth of lay administration. If this mechanism is real and provides internal unity to the period, then the label picks out a genuine kind. Moreover, the boundaries are set by the mechanism: the onset is the collapse, and the end is when the recovery is complete and new dynamics (like the Reformation and global exploration) take hold.

  However, we must ask: is this mechanism as comprehensive as claimed? The traditional Renaissance achievements might be seen as by-products of the recovery. For instance, the rebuilding of universities might have fostered humanist scholarship. But if the mechanism of recovery does not explain the specific cultural innovations (like linear perspective), then the label might be incomplete. Yet, the proponent of "the Long Recovery" might argue that these cultural developments were enabled by the recovery and are part of the broader rebuilding.

  Furthermore, "the Long Recovery" avoids the value-ladenness of "the Renaissance", which implies a "rebirth" and thus a judgment of superiority over the preceding "dark" ages. By focusing on a mechanism, it offers a more objective basis for periodization.

  Therefore, by the realist account, "the Long Recovery" improves on "the Renaissance" if the recovery mechanism is the dominant one that structures the period and if the cultural achievements are either part of that mechanism or secondary to it. The evidence for this would require historical investigation, but the proposal has a stronger claim to capturing a real period because it grounds the boundaries in a causal process.

  In conclusion, a period label is real if it identifies a genuine historical kind defined by a unifying mechanism. Lateness and interestedness do not invalidate a label but call for scrutiny. "The Long Recovery" appears to improve on "the Renaissance" by providing a mechanism-based periodization, but its success ultimately depends on whether the recovery mechanism truly unifies the period.

  (Word count: 1050)

  ### 3. Marking Scheme (40 marks)

  The essay is marked out of 40, allocated as follows:

  - Part (a): 15 marks
  - Part (b): 10 marks
  - Part (c): 15 marks

  **Must-hit moves (and penalties):**

  **Move 1 (Part a): Defining a real period label in terms of a unifying mechanism or structure (10 marks)**  
  - To earn these marks, the candidate must articulate that a period label picks out something real if it corresponds to a genuine historical kind, which is defined by a common mechanism or structure that operates throughout the period, providing internal unity and non-arbitrary boundaries (onset and end tied to the mechanism).  
  - Common errors:  
    - Merely stating that a period is real if it is "objective" without explaining what that means.  
    - Focusing only on the existence of events without requiring a unifying mechanism.  
    - Suggesting that a period is real if it is "widely accepted" (confusing social agreement with reality).

  **Move 2 (Part a): Distinguishing real from arbitrary/convenient labels (5 marks)**  
  - The candidate must contrast the mechanism-based account with mere convenience (e.g., labeling by century) or arbitrary grouping (e.g., grouping events by the historian's taste).  
  - Common error: Failing to provide a clear contrast and thus not showing what makes the mechanism-based account non-arbitrary.

  **Move 3 (Part b): Addressing lateness and interestedness without conflating construction with unreality (5 marks)**  
  - The candidate must argue that lateness and interestedness do not automatically make a label unreal because the reality depends on whether the label captures a genuine kind. They should note that these factors call for scrutiny but are not decisive.  
  - Common errors:  
    - Falling into the trap of inferring from "constructed" to "not real".  
    - Arguing that because all classifications are interest-relative, no classification can be real (treating interest-relativity as a debunking argument).  
    - Penalty: Deduct up to 2 marks for either of these two errors.

  **Move 4 (Part b): Explaining the relevance of lateness/interestedness as heuristic warnings (5 marks)**  
  - The candidate must state that these factors can be indicative of potential bias but are not conclusive. They should explain that the label must still be tested against the historical record.  
  - Common error: Claiming that lateness and interestedness are irrelevant, without nuance.

  **Move 5 (Part c): Applying the account from (a) to evaluate "the Long Recovery" (10 marks)**  
  - The candidate must use their account from (a) to assess the proposal. They should argue that "the Long Recovery" improves if it captures a mechanism (the recovery) that unifies the period and provides non-arbitrary boundaries.  
  - Common error: Drifting into a historical discussion of the Renaissance without tying it back to the philosophical account.

  **Move 6 (Part c): Addressing the improvement relative to "the Renaissance" (5 marks)**  
  - The candidate must specifically compare the two labels by the lights of the account. They should note that "the Renaissance" may be based on taste for achievements, while "the Long Recovery" is based on a mechanism.  
  - Common error: Simply asserting that one is better than the other without argument.

  **Penalties for sophisticated-but-wrong maneuvers (deduct up to 3 marks in total if any appear):**  
  1. **Inferring from "constructed" to "not real":** Deduct 1 mark. Why: This confuses the act of labeling with the reality of what is labeled.  
  2. **Treating interest-relativity as a debunking argument:** Deduct 1 mark. Why: This fails to see that even interest-relative classifications can be real.  
  3. **Appealing to feedback effects (e.g., naming an age makes it real by influencing behavior):** Deduct 1 mark. Why: This confuses the social impact of a label with the pre-existing reality of the period.  

  **Note:** The above moves are not necessarily sequential; they are thematic. Marks are awarded based on the presence and quality of the required elements.

  ### 4. Distinguishing First-Class from Strong Second-Class Answers

  A first-class answer (typically scoring 70% or above) will not only hit all the must-hit moves but will also integrate them into a coherent argument. It will anticipate and address potential counterarguments (e.g., in part c, it might ask if the recovery mechanism is truly comprehensive or if it excludes important cultural developments). It will use precise philosophical distinctions (like the difference between real and nominal kinds) without jargon, and it will show independent thought in applying the account to the proposal. In contrast, a strong second-class answer (scoring 60-69%) will cover the required moves but may lack depth in integration. It might treat the three parts as separate questions, with less fluid transition, and might not fully explore the implications of the account in part (c). It might also miss some nuances, such as the possibility that both labels could capture real but different aspects of the same time.

  ### 5. Handling a Historiographical Survey Answer

  A fluent, well-informed answer that consists entirely of historiographical survey (e.g., recounting how the term "Renaissance" was coined by Burckhardt, how the "Scientific Revolution" was constructed by Butterfield, etc.) should score no more than **12/40**. This is because the question explicitly requires three specific philosophical tasks (a, b, c) that go beyond historical scholarship. Such an answer would fail to define what makes a period real (part a), would not address the relevance of late coinage (part b), and would not evaluate the proposal using a defended account (part c). It might contain accurate information but does not engage with the conceptual issues. Therefore, even if it is excellent as historiography, it does not answer the question set.

  This reasoning should be clear to markers: the question is designed to test philosophical understanding, not historical knowledge per se.
answer: |-
  ### Final Examination Question (40 marks, 90 minutes)

  **Question**  
  A colleague proposes to replace the term "the Renaissance" (in its broad cultural sense) with "the Long Recovery". This proposed period runs from the mid-fourteenth-century demographic collapse (e.g., the Black Death) to the early sixteenth century. The colleague argues that "the Long Recovery" earns its place not by enumerating admired achievements (like linear perspective or humanist philology) but by naming a mechanism: the rebuilding of population, wages, textual supply, universities, and lay administration after the mid-fourteenth-century crisis. This mechanism is said to have a discernible onset (the collapse) and a discernible exhaustion (when a different set of dynamics, such as the Reformation, takes hold). On this view, period boundaries are set by the mechanism, not by the historian's taste.  

  In a single essay, address the following:  
  (a) What would have to be true for *any* period label (e.g., "the Renaissance") to pick out something *real*—rather than being merely convenient or arbitrary? (15 marks)  
  (b) Does the fact that a period label is coined *late* (by people living after the period) and for *interested reasons* (to serve an agenda) bear on whether it picks out something real? Explain why or why not. (10 marks)  
  (c) By your account in (a) and (b), does replacing "the Renaissance" with "the Long Recovery" improve periodization? (15 marks)  

  Your essay must be self-contained: use only the description above and seminar content. Do not treat "the Long Recovery" as an established term.  

  ---

  ### Model Answer (970 words)  
  To assess whether "the Long Recovery" improves on "the Renaissance," we must first establish what makes a period label real. I will argue that a label picks out something real if it corresponds to a *genuine kind*—a unified set of phenomena bound by a common mechanism that structures the period. Next, I will show that while late and interested coinage warrants scrutiny, it does not automatically undermine reality; what matters is whether the label captures the mechanism. Finally, applying this account, I contend that "the Long Recovery" is an improvement because it grounds periodization in a demonstrable mechanism, unlike "the Renaissance."  

  **(a) For a period label to be real, it must identify a genuine kind defined by a unifying mechanism.**  
  A period label is not merely real because it describes a stretch of time; it must carve history "at the joints," isolating a segment where interconnected events form a coherent whole. This requires two conditions. First, there must be a *unifying mechanism*—a recurring cause or process that explains why key developments cluster together. For instance, "the Industrial Revolution" labels a real period because it captures the mechanism of technological innovation driving systemic economic and social change. Without such a mechanism, a label is arbitrary: grouping events by the historian’s preferences (e.g., "the Age of Chivalry" based on admiration for knights) is like sorting stars by colour instead of composition—it may be convenient but does not reflect a natural division.  

  Second, the mechanism must set *non-arbitrary boundaries*. Onset and end should mark the mechanism’s activation and exhaustion. Boundaries can be fuzzy (transitions are rarely instant), but they must align with shifts in dominant forces. For example, if "the Cold War" begins with the breakdown of wartime alliances and ends with the Soviet collapse, its reality hinges on whether geopolitical tension was the era’s structuring force. If boundaries are set by extrinsic factors (e.g., rounding to a century), the label is a convenience, not a discovery.  

  This view avoids two pitfalls. First, it does not demand that every event in the period fit perfectly; outliers exist in all kinds (e.g., flightless birds are still birds). Second, it allows that multiple mechanisms operate in history, but a real period isolates one that is *structurally dominant*—shaping the context for other events. Reality here is not metaphysical absoluteness but objectivity: the mechanism exists independently of the historian’s perspective.  

  **(b) Late and interested coinage does not determine reality but requires critical evaluation.**  
  A label coined late and for interested reasons (e.g., "the Renaissance" was popularised by 19th-century historians to celebrate secular modernity) might seem suspect. However, this alone cannot debunk its reality. To infer that "constructed by historians" means "not real" commits a fallacy. All classifications are human constructions—even "the Jurassic period" is a label applied after the fact—but some align with real divisions (e.g., based on fossil records). The key question is whether the label maps onto a pre-existing kind. If late coiners accurately identify a unifying mechanism (e.g., 19th-century historians correctly pinpointed a cultural shift rooted in 15th-century Italy), the label is real despite its origins.  

  Interested motives do warrant caution, as they risk biasing the selection of events. For example, defining "the Renaissance" around art and philosophy might ignore concurrent economic stagnation, making the period seem more unified than it was. But bias is not inevitability: a label born of agenda can still be validated if it withstands scrutiny against evidence. Crucially, we must avoid equating *interest-relativity* (all labels serve some human interest) with *unreality*. That a classification serves an interest (e.g., "the Long Recovery" might serve demographers) does not preclude it capturing reality; temperature scales serve scientific interests but reflect objective properties. Thus, late and interested coinage is relevant as a heuristic for potential bias, but it cannot settle reality—only the mechanism’s existence can.  

  **(c) "The Long Recovery" improves on "the Renaissance" by better capturing a genuine kind.**  
  By my account, improvement requires that the new label more accurately identifies a structuring mechanism with non-arbitrary boundaries. "The Renaissance" falls short here. It emphasises cultural achievements (e.g., humanism, art) but lacks a clear mechanism linking them. Is the "rebirth" of antiquity a cause or an effect? Without specifying how cultural shifts interlock (e.g., whether philology drives economic change), the label relies on the historian’s taste for "great works," making boundaries arbitrary. Why start in 14th-century Italy and not earlier? Why end before the Reformation? The vagueness suggests convenience, not a real kind.  

  "The Long Recovery," conversely, posits a demonstrable mechanism: post-crisis rebuilding. Demographic collapse (e.g., the Black Death) triggers labour shortages, rising wages, institutional rebuilding (e.g., universities), and textual rediscovery (as societies stabilise). This mechanism is structurally dominant: it explains diverse phenomena, from economic trends (e.g., wage data) to cultural ones (e.g., manuscript proliferation enabled humanism). Crucially, it sets non-arbitrary boundaries: onset at the mid-14th-century collapse (which disrupts medieval systems) and exhaustion when rebuilding plateaus and new dynamics (e.g., global exploration) emerge. Unlike "the Renaissance," this does not cherry-pick "admired" outcomes; it treats cultural achievements as byproducts of systemic recovery.  

  One might object that "the Long Recovery" ignores cultural agency, reducing genius to demography. But a real period need not explain everything—only the dominant structuring force. If recovery enables cultural flourishing (e.g., stability allows art patronage), it can be primary without being total. Conversely, "the Renaissance" fails precisely because it cannot establish cultural rebirth as an independent mechanism; it often depends on the very recovery it overlooks.  

  In sum, by prioritising mechanism over taste, "the Long Recovery" better satisfies the criteria for a real period label. It turns a convenience into a discovery.  

  ---

  ### Marking Scheme (Total: 40 marks)  
  **Core Moves (34 marks)**  
  1. **Defines a real period via a unifying mechanism (Part a, 10 marks)**  
     - Must state that reality requires a *structuring mechanism* (e.g., "a recurring process that explains interconnected changes") and *non-arbitrary boundaries* tied to that mechanism.  
     - Common error: Vagueness (e.g., "a real period is objective" without defining objectivity mechanistically).  

  2. **Contrasts real vs. arbitrary/convenient labels (Part a, 5 marks)**  
     - Must distinguish mechanism-based unity from arbitrary groupings (e.g., "the Renaissance based on taste vs. the Long Recovery based on demographic rebuilding").  
     - Common error: Equating non-arbitrary with "precise" (fuzziness is allowed if tied to mechanism shifts).  

  3. **Rejects "constructed implies not real" fallacy (Part b, 5 marks)**  
     - Must argue that late/interested coinage does not *automatically* negate reality (e.g., "even biased labels can align with real mechanisms").  
     - Penalty for error: −1 mark if candidate infers unreality from construction.  

  4. **Assesses late/interested coinage as heuristic (Part b, 5 marks)**  
     - Must state that coinage factors invite scrutiny for bias but do not determine reality (e.g., "they raise questions about selective emphasis, but the mechanism’s existence is key").  
     - Penalty for error: −1 mark if candidate treats interest-relativity as universal debunking (e.g., "all labels are interested, so none are real").  

  5. **Evaluates "Long Recovery" via mechanism (Part c, 7 marks)**  
     - Must apply the Part (a) account to argue that "the Long Recovery" improves by naming a mechanism (e.g., "rebuilding after crisis") and non-arbitrary boundaries (onset: collapse; end: new dynamics).  
     - Common error: Drifting into historical detail without philosophical criteria.  

  6. **Compares labels re: taste vs. mechanism (Part c, 7 marks)**  
     - Must critique "the Renaissance" for reliance on taste (e.g., "it cherry-picks achievements") and conclude that mechanism-based labeling is superior.  
     - Penalty for error: −1 mark if candidate appeals to naming feedback effects (e.g., "labels become real by influencing behavior"—this confuses social construction with historical reality).  

  **Sophisticated-but-Wrong Penalties (Deduct from total, max −3)**  
  - **−1 mark:** Inferring from "constructed" to "not real" (e.g., "the Long Recovery is invented, so it’s not real"). *Why it fails:* Construction does not preclude tracking reality; all scientific categories are constructed.  
  - **−1 mark:** Treating interest-relativity as debunking (e.g., "all periodization is subjective because it serves interests"). *Why it fails:* Interest-relativity is universal; it does not negate the possibility of objective fit.  
  - **−1 mark:** Appealing to feedback effects (e.g., "naming an era makes it real by shaping later actions"). *Why it fails:* This confuses the label’s social impact with the pre-existence of a historical kind.  

  **Fluency and Integration (6 marks)**  
  - Award up to 6 marks for coherence, clarity, and logical flow between parts (e.g., Part (c) explicitly uses Part (a)/(b) criteria).  

  **Historiographical Survey Answer Score**  
  A fluent, well-informed answer reciting *only* scholarly debates (e.g., "Burckhardt constructed the Renaissance; Butterfield debated the Scientific Revolution") without addressing the conceptual tasks in (a), (b), and (c) should score **8/40**. This reflects:  
  - 0 marks for Part (a) (no account of reality);  
  - 0 marks for Part (b) (no analysis of coinage);  
  - 0 marks for Part (c) (no application of criteria);  
  - 8/40 for structure and knowledge (below passing, as it avoids the question).  
  *Justification:* The question demands philosophical argument, not historical survey. Such an answer fails all three required parts despite fluency.  

  ### Distinguishing First-Class from Strong Second-Class Answers  
  A **first-class answer** (≥30/40) hits all core moves while *synthesizing* them: e.g., using Part (b) to preempt objections in Part (c) ("Though 'Long Recovery' is coined late, this doesn't invalidate its mechanism..."). It also *anticipates counterarguments* (e.g., "One might object that recovery ignores agency, but mechanisms can include human choices"). A **strong second-class answer** (24–29/40) covers the moves but lacks synthesis: e.g., treating parts separately, missing nuances (like allowing fuzzy boundaries), or not justifying why mechanism trumps late coinage. It may list criteria without deepening the implications (e.g., not explaining *why* taste-based labels are arbitrary).
