prompt: |-
  I am drafting comments on a colleague's monograph in the philosophy of biology. She sets out to defend an account of biological function against both selected-effect etiologism of the Millikan–Wright sort and Cummins-style causal-role analysis, yet she never states her positive view in general terms; what she gives instead is a run of verdicts on particular traits, scattered through the chapters. Before I write, I should like to establish what she is in fact committed to.

  Her verdicts, as I have collated them:

  (i) The healthy human heart has the function of pumping blood, and a neonate's heart with a severe septal defect — which never pumped blood effectively, and whose bearer died within hours — had that same function; it is this that makes it a *malfunctioning* heart rather than a heart with a different function. What such a heart actually does, shunting blood and failing to oxygenate it, is not its function.

  (ii) The human appendix has no function. She grants that it does appear to assist in repopulating the gut flora after infection, but she calls this a *service* rather than a function; and she holds that the fermentative work of our ancestors' caeca is a *past function* which did not survive the organ's reduction.

  (iii) The non-shattering rachis of domesticated maize has the function of retaining seed on the cob. Selection by early farmers counts as selection for her purposes, and the trait's being lethal to the plant in the wild, together with the crop's persisting only through human intervention, she considers beside the point.

  (iv) A genetic toggle switch engineered into E. coli, which reliably does precisely what its designers intended and is fitness-neutral, has a causal role and a *design function*, but not a biological function in the sense in which the heart has one.

  (v) The feathers of a flying passerine have two functions, flight and thermoregulation. She sees no principled reason to privilege the more recent of the selection episodes responsible for them.

  (vi) A worker honeybee's foraging has a function, notwithstanding that the effect for which it was selected accrues to the queen's reproduction rather than to the worker's own; the bearer's individual fitness is not the required currency.

  (vii) On an island that has had no bats for some two hundred thousand years, a moth species' dive response has degraded to the point where it no longer fires even when the moth is played bat ultrasound. She says this trait has no function, and her only gloss is that nothing is now being done by it.

  (viii) She attributes to the pupillary light reflex the function of regulating retinal illuminance rather than that of contracting the iris, and argues at length that settling the right description of the trait and of its effect is part of the substance of a function claim, not a preliminary to it.

  Two further cases arise in the final chapter, and on neither does she pronounce:

  N1. In a vertebrate lineage, a gene encoding a hepatic enzyme duplicated some forty million years ago. Both paralogues are expressed and catalytically competent, and both catalyse the same step; subsequent regulatory change has shifted nearly all the flux through the younger copy, so that deleting the older one — the copy whose ancestral tokens were fixed by selection precisely for catalysing that step — leaves the animal phenotypically normal in every environment the species now occupies.

  N2. On a different bat-free island, a moth species' dive response remains fully intact. It fires reliably in the laboratory when bat ultrasound is played, has not been triggered in the wild for perhaps two hundred thousand years, costs the animal very little, and shows no sign of degradation.

  What I should like from you:

  1. Which of the standard candidate accounts — permissive selected-effect etiologism, its recent-history variant, causal-role analysis, the dispositional account, and goal-contribution or organisational hybrids — survive all eight verdicts, and which single account do you judge her to be running? If you think no one account can accommodate all eight, say which verdict you take me to have misreported, and why.

  2. For each surviving account, what does it predict about N1 and N2? Which recorded verdict is the closest precedent for each case, and what principle would she be adopting, wittingly or not, whichever way she went?

  3. Your own best guess at her two verdicts, with the considerations that decide it; and the single further case that would most sharply separate the two leading accounts, together with an account of precisely what turns on it.

  4. Finally, what does (viii) demand of a theory that the other seven verdicts do not, and which of the survivors can meet that demand?
reasoning: |-
  Hmm, the user is asking me to analyze their colleague's monograph in the philosophy of biology, specifically regarding her account of biological function. The user has collated eight verdicts on particular biological traits and wants me to determine what theory of function she's implicitly committed to.

  Looking at these verdicts, she seems to be rejecting both selected-effect etiologism (like Millikan and Wright) and causal-role analysis (like Cummins). Her position appears to be a hybrid approach that incorporates elements of selection history but with important qualifications.

  For instance, in verdict (i), she maintains that a malfunctioning heart still has the function of pumping blood, which suggests she values historical selection over current causal role. However, in verdict (iv), she distinguishes between engineered functions and biological functions, indicating that design intention alone isn't sufficient for biological function.

  Verdict (iii) shows she accepts artificial selection as valid for biological function, while verdict (vi) demonstrates she accepts group-level selection. Verdict (v) suggests she allows for multiple functions based on different selection episodes without privileging recency.

  The tricky cases are (ii) and (vii). For the appendix, she distinguishes between current "service" and historical function, and for the degraded moth dive response, she denies function despite historical selection, focusing on current non-performance.

  Verdict (viii) is particularly interesting because it emphasizes that function attributions require specifying the right level of description for both trait and effect.

  For the unresolved cases N1 and N2, I need to predict how she would rule based on her previous verdicts. N1 involves a gene that has become redundant but was historically selected. Based on her appendix verdict (ii), she might say it has no current function. N2 involves a moth dive response that remains intact but unused. Her verdict on (vii) suggests she might deny function since it's not currently performing anything, even though it's maintained.

  The theory that best fits all eight verdicts seems to be a hybrid organizational-selected-effect account, specifically something like Godfrey-Smith's modern history theory or perhaps a weak organizational account that requires historical selection plus current systemic contribution.

  For the additional cases, a critical test would involve a trait that currently contributes to an organism's organization but lacks any selection history - which she would likely deny has a biological function based on her verdict (iv).

  I'll organize my response to address all four parts of the user's request systematically, providing clear reasoning for each conclusion based on the evidence from the verdicts.
answer: |-
  Based on your collation of verdicts, your colleague is running a **recent-history selected-effect account (RHSE)**, specifically a **modern-history variant** requiring selection *within the relevant lineage's recent evolutionary past*, coupled with the trait *currently contributing to the system's persistence or typical activity* (a weak organizational constraint). This hybridizes selected-effect etiologism with a minimal organizational component. Below is a detailed analysis addressing your four requests.

  ### 1. Surviving Accounts & Her Implicit Theory
  *   **Permissive Selected-Effect Etiolism (Millikan/Wright):** *Fails* verdicts (ii) and (vii). It should assign the appendix *some* function (due to past selection) and the degraded moth dive a function (due to historical selection). Verdict (ii) explicitly denies this, calling past caecal work a "past function" distinct from current function. Verdict (vii) explicitly denies function due to current non-performance, despite historical selection.
  *   **Recent-History Variant SE (e.g., Godfrey-Smith):** *Survives all 8 verdicts* when combined with a weak organizational constraint (current contribution). This is her account. It explains: (i) historical selection sets the function; (ii) appendix lacks *recent* selection/maintenance; (iii) recent artificial selection counts; (iv) no *biological* selection history; (v) multiple selective episodes within relevant history are valid; (vi) group-level selection counts; (vii) no *recent* selection/maintenance and no current contribution; (viii) Function is tied to the *selected effect* at the right systemic level.
  *   **Causal-Role Analysis (Cummins):** *Fails* verdicts (i), (iv), and (vii). It should assign the neonate heart (i) a function based on its actual causal role (shunting), assign the E. coli switch (iv) a function (it plays a causal role), and likely assign the moth dive (vii) a function (it *could* play a role, or its structure might play one). She explicitly denies these.
  *   **Dispositional Account (Bigelow & Pargetter):** *Fails* verdicts (iv) and (vii). It should assign the E. coli switch (iv) a function (it *would* contribute to fitness in future environments where its design mattered) and the moth dive (vii) a function (it *could* contribute to fitness if bats returned). She denies a biological function to (iv) and explicitly cites current non-performance for (vii).
  *   **Goal-Contribution/Organizational Hybrids (e.g., Mossio, Saborido, Moreno):** *Survive all 8 verdicts only weakly or partially*. Strong organizational accounts (requiring current contribution to self-maintenance) often *fail* (i) – the neonate heart contributes nothing valuable to the organism's viability/self-maintenance. Weaker hybrids emphasizing historical selection *plus* current contribution (like her RHSE) survive. Crucially, *pure* organizational accounts fail (iv) – the E. coli switch could easily be seen as contributing to the bacterium's persistence in an engineered system. Her distinction in (iv) necessitates a historical selection component beyond current organization.

  **Conclusion:** Only a **Recent-History Selected-Effect (RHSE) account with a weak organizational constraint** (current contribution) cleanly accommodates all eight verdicts. This aligns with thinkers like Peter Godfrey-Smith ("modern history" theory). Her verdicts consistently require a trait to have been maintained by selection *within the lineage's relevant recent past* (allowing artificial and group selection) and to *currently contribute* to the system's typical activity/persistence (explaining (ii) and (vii)). Verdict (viii) demands that the function description matches the level/system at which selection acted.

  ### 2. Predictions for N1 and N2 by Surviving Accounts
  Only the RHSE account (her implicit theory) and weaker organizational hybrids survive. Their predictions:

  *   **N1 (Redundant Hepatic Enzyme Paralog):**
      *   **RHSE (Her Account):** *No function* for the older paralogue. Similar to (ii): While it had a historical function, it lacks *recent* selection/maintenance (flux shifted long ago) and makes no current contribution to the system's viability/typical activity (deletion has no effect). Its activity is vestigial.
      *   **Organizational Hybrids:** Likely *no function*. Its contribution to the system (catalysis) is fully redundant. It doesn't make a unique or necessary contribution to the organism's self-maintenance/viability. Deleting it causes no deficit.
      *   **Closest Precedent:** (ii) The Human Appendix. Both are vestiges: historically functional, currently contributing little/nothing essential, and not under recent selection. The principle: **A trait loses its function when it ceases to be maintained by recent selection *and* ceases to make a necessary or significant contribution to the system's current viability/typical activity.**
      *   **Her Likely Principle:** Vestigial traits without current selective maintenance or essential contribution lack function.

  *   **N2 (Intact but Unused Moth Dive Response):**
      *   **RHSE (Her Account):** *Ambiguous, leaning towards No Function.* Crucial precedent is (vii). While the trait is intact (unlike (vii)), it hasn't been under selection for 200k years ("recent history" timescale is lineage-dependent, but 200k years likely exceeds it for moths). Critically, it makes *no current contribution* ("nothing is now being done by it" - verdict (vii) gloss). The low cost prevents degradation but doesn't constitute a positive contribution. Verdict (viii) also suggests function is about what the trait *does* (contributes) for the system *now*.
      *   **Organizational Hybrids:** *Likely Has a Function.* It is maintained (intact structure), retains the causal capacity to contribute to survival (fitness) if bats returned, and its low cost means it doesn't actively harm viability. It could be seen as a latent capacity contributing to the organism's robustness or potential.
      *   **Closest Precedent:** (vii) The Degraded Moth Dive. Principle: **A trait only has a function if it is *currently* contributing (or poised to contribute under normal conditions) to the system's persistence/viability *and* has been under relevant recent selection.** Her verdict (vii) emphasizes *current doing*. The intactness of N2 doesn't change the lack of current contribution in the wild.
      *   **Her Likely Principle:** A trait must be currently performing its selected activity within the organism's normal environment to have a function; mere latent capacity without current contribution or recent maintenance is insufficient.

  ### 3. Best Guess for N1 & N2, and Critical Test Case
  *   **N1 (Enzyme):** **No Function.** Strong precedent from (ii) (appendix vestige). The trait is redundant, not maintained by recent selection, and its deletion causes no deficit. Her verdicts consistently downplay deep history when current contribution/maintenance is absent.
  *   **N2 (Moth Dive):** **No Function.** Decisive precedent is (vii). Her gloss "nothing is now being done by it" applies equally to N2. Its intactness is evolutionarily inert without current bats. Verdict (viii) links function to the trait's *actual* effect within the system *now*. The low cost is irrelevant to *having* a function (though it explains persistence). The 200k year absence likely exceeds her "recent history" window.

  *   **Critical Test Case to Separate RHSE and Organizational Hybrids:**
      *   **The Case:** A complex, costly biochemical pathway (Trait C) in a modern bacterium. C was *never* under natural selection; it arose purely through a highly improbable series of neutral mutations over millions of years. However, C *currently* plays an absolutely essential role in the bacterium's core metabolism and viability. Without C, the bacterium dies immediately. It is maintained by *purifying selection* due to its current essential role, but its *origin* was non-adaptive.
      *   **What Turns On It:**
          *   **RHSE (Her Likely View):** *No Biological Function.* Trait C lacks a history of selection *for* its current effect. It was not shaped or maintained *because* it provided the metabolic benefit until very recently (when it became essential). Its origin matters. Selection only started maintaining it *after* it became essential, not *for* the reason it became essential. (Compare: verdict (iv) denies function to an engineered trait without biological selection history, even if essential).
          *   **Organizational Hybrids (Stronger Variants):** *Has a Function.* Trait C makes a current, indispensable contribution to the organism's self-maintenance and viability. This current role grounds its function, regardless of its non-adaptive origin. Selection *now* maintains it *because* of this role.
      *   **Why it Separates:** Her verdicts (especially (iv) and the emphasis on selection history in (i), (iii), (v), (vi)) strongly prioritize the trait's selective history as the source of its function. Organizational hybrids prioritize current systemic contribution, potentially allowing functions for non-adapted but essential traits. This case directly tests whether *selection history for the effect* is necessary (RHSE) or whether *current essential contribution* is sufficient (organizational).

  ### 4. The Demand of Verdict (viii)
  *   **The Demand:** Verdict (viii) demands that a theory of function **inherently incorporates the correct level of systemic analysis and description of the trait/effect** as part of the function attribution itself. It's not just that the function claim depends on prior identification of the trait and effect; rather, **settling *which* description of the trait and *which* description of its effect is the functionally relevant one is constitutive of the function claim**. Function is relational and level-specific.
  *   **Why Other Verdicts Don't Demand This:** The first seven verdicts focus on *whether* a trait has a function and *what* that function is (pumping, retention, thermoregulation), assuming the trait/effect descriptions are relatively unproblematic. Verdict (viii) explicitly tackles the problem of *description* (regulating illuminance vs. contracting iris) and argues this isn't preliminary but core to the function claim.
  *   **Which Survivors Can Meet It:**
      *   **RHSE (Her Account):** **Can Meet It.** The selected-effect account directly incorporates this. The function *is* the effect for which the trait was selected. Identifying the function *requires* identifying the specific effect that caused the trait to be favored by selection. This necessitates finding the "right" description of both the trait and its effect – the description relevant to the selection process. (Why was iris contraction selected? *Because* it regulated retinal illuminance).
      *   **Organizational Hybrids:** **Can Often Meet It, but Less Directly.** These accounts tie function to contributions to system maintenance. Identifying the relevant contribution requires specifying the system and the constraints it must satisfy. This also involves picking the "right" level of description for the trait's activity (e.g., regulating illuminance contributes to maintaining vision, while mere iris contraction might not). However, the link to a *specific historical causal process* (selection) gives the SE account a more direct grounding for the "right description" – it's the one that figured in the evolutionary explanation.

  In essence, verdict (viii) requires that function attributions are inherently explanatory claims about why a trait is there (SE) or why it's maintained (organizational), and getting the explanation right depends on getting the descriptions of the trait and its systemic effect right. Both surviving accounts can accommodate this, but the SE framework provides a natural home for it via the historical selective explanation.
