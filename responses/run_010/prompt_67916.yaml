prompt: |-
  You are a professional moral philosopher whose specialty is the ethics of praise, blame and moral worth: what makes a right action creditable to the agent who performs it, and whether that turns on acting from duty, on acting from sympathy, or on being moved by the features that make the act right. Approach what follows as a colleague's request for a careful audit of a stated position, not as an occasion to survey a debate. Think carefully before answering.

  I have drafted my own account of moral worth for a departmental workshop. Before I circulate it I want to know whether the commitments below are jointly tenable, or whether they are a collage of positions whose usual motivations pull in opposite directions. Please start with a short orientation pass: sketch, in a compact form, which commitments entail, constrain or presuppose which others, and where you expect the fault lines to lie. Then deliver the audit.

  My commitments:

  1. What confers moral worth on an action is the agent's being moved by the features that make it right — the child's distress, the promise she made, the danger to the person she could rescue — and not by the thought that acting this way is right. An agent whose operative motive is rightness itself strikes me as defective even when her action is correct.
  2. Sympathy and natural fellow-feeling are not the only motives that can confer moral worth. In cases where inclination runs against duty, an agent who does the right thing while feeling nothing for the person she helps is not thereby less creditable than one who helps gladly.
  3. Moral worth comes in degrees. Mixed motives are the norm, and an agent who acts partly from the relevant features and partly from self-interest deserves partial credit; there is no threshold below which the question simply fails to arise.
  4. Moral worth requires counterfactual robustness. An action is creditable only if the agent would have done it anyway had the particular feature that actually moved her been absent, so long as some other right-making feature was present. A lucky one-off alignment of motive and circumstance is not moral worth, however good it feels from the inside.
  5. Moral worth is not a matter of luck. It depends only on the agent's motivational set and on how she responds to the situation in front of her, never on features of her circumstances, her upbringing or her temperament for which she is not responsible.
  6. Praise and blame are asymmetric. Blameworthiness does not require a bad motive: negligence, indifference and merely self-regarding motives can render an agent blameworthy. Praiseworthiness does require a good motive. Doing the right thing from a merely non-moral motive is not praiseworthy, though it need not be blameworthy either.
  7. Deferring to someone I have good reason to trust can itself confer moral worth on my action. If my friend's judgement about what a patient needs is reliable, then acting on her advice because I take her to be reliable is a perfectly good way of being responsive to the patient's needs, and I lose no credit for failing to see those needs myself.

  My verdicts on three cases:

  (a) Huck Finn helps Jim escape, from friendship and fellow-feeling, and against his own sincere conviction that he is doing wrong. The action is creditable, and creditable in the way it actually happened; his false moral beliefs subtract nothing from its worth.

  (b) An anaesthetist who is exceptionally careful with her own patients — and who, I stipulate, would not have been nearly so careful with a stranger she had never met — is more creditable for her care than a colleague whose scrupulousness is impartial and would have been exactly the same for anyone. Particularity is not a defect.

  (c) Someone betrays a confidence out of loyalty to a friend in distress. She deserves praise for the loyalty and criticism for the betrayal, and the two assessments do not cancel each other out.

  The question I expect from the workshop is whether this is one coherent position or several incompatible ones held at once. So please:

  - Identify the pairs or clusters that are genuinely in tension, and rank those tensions by severity, most serious first, rather than presenting them as equally bad. For each, state precisely where the collision lies — which commitment's rationale cannot survive the other — and give the minimal revision that would remove it, together with what that revision would cost me elsewhere in the set, including in the case verdicts.
  - Say explicitly which apparent tensions dissolve under inspection, and why they only look like problems. I expect at least one or two of these commitments to seem contradictory at first pass and not to be; do not report those as difficulties.
  - Finally, tell me which single revision to the set would clear the largest share of the remaining trouble, and what sort of position I would be left holding if I made it.

  Keep the answer to the audit. Do not turn it into a general essay on moral worth, and do not give me a reading list or citations; you may name a position or a case where a name genuinely helps, but otherwise argue from the content of the commitments themselves. Use clear headings for each tension and severity ranking, and write the whole response in British English.
reasoning: |-
  Hmm, the user is presenting themselves as a professional moral philosopher specializing in the ethics of praise and blame. They're asking me to audit their draft account of moral worth, which includes seven core commitments and three case verdicts. They want me to identify tensions between these commitments, rank them by severity, suggest minimal revisions, and clarify which apparent tensions aren't real problems.

  Looking at their commitments: They emphasize being moved by right-making features rather than by duty itself (commitment 1). They allow for non-affective motives (commitment 2), see moral worth as gradable (commitment 3), require counterfactual robustness (commitment 4), reject circumstantial luck (commitment 5), establish asymmetric praise/blame standards (commitment 6), and validate deference to expertise (commitment 7). Their case verdicts defend Huck Finn's praiseworthiness despite false beliefs, commend partiality in care, and accept non-cancelling mixed assessments.

  The most serious tension I see is between counterfactual robustness (commitment 4) and the rejection of luck (commitment 5). Robustness requires that the agent would act rightly even if key features changed, but commitment 5 insists moral worth depends only on actual motivation and response. This creates a contradiction because robustness introduces counterfactual dependence beyond the agent's control. To resolve this, they could drop robustness or adjust their luck rejection to allow for dispositional properties.

  There's also tension between partial credit for mixed motives (commitment 3) and asymmetric praise/blame (commitment 6). Commitment 3 allows praise for actions with some non-moral motives, but commitment 6 states that praise requires a good motive. They could resolve this by refining commitment 6 to acknowledge that praise can be partial when good motives are present but diluted.

  The Huck Finn verdict (a) seems to conflict with commitment 1's focus on right-making features since Huck acts from friendship rather than recognizing the right-making features. But their commitment 7 on deference provides a solution - friendship could be seen as enabling sensitivity to features like Jim's distress.

  The anaesthetist case (b) initially seems to contradict the impartiality implied by robustness (commitment 4), but commitment 4 only requires responsiveness to some right-making feature, not all. Partiality isn't inherently problematic if the agent would still respond to other features.

  For the single most effective revision, I'd recommend adjusting commitment 5 to accept that moral worth can depend on dispositional properties like robustness, which aren't subject to luck in the same way as external circumstances. This resolves the severe tension with commitment 4 while preserving the core rejection of arbitrary luck.

  I'll structure my response with clear headings for each tension, rank them by severity, explain why some apparent tensions aren't real problems, and suggest the most impactful revision - all in British English as requested.
answer: |-
  ### Audit of Moral Worth Commitments: Tensions and Coherence  
  *Per your request, this audit assesses internal consistency and identifies fault lines. I begin with an orienting sketch of entailments and constraints, then proceed to tensions (ranked by severity), dissolved tensions, and a minimal revision strategy.*

  #### Orientation Pass: Core Entailments and Constraints  
  - **Commitment 1** (moved by right-making features, not rightness) *entails* that motives must track concrete moral reasons (e.g., distress, promises). It *constrains* **Commitment 2** (non-affective motives permitted) by demanding responsiveness to features, not feelings.  
  - **Commitment 4** (counterfactual robustness) *presupposes* **Commitment 3** (degrees of worth) to handle partial motives, and *conflicts* with **Commitment 5** (no circumstantial luck) due to reliance on dispositional properties.  
  - **Commitment 6** (asymmetric praise/blame) *constrains* **Commitment 3**: partial credit must align with "good motive" requirement for praise.  
  - **Commitment 7** (deference as responsiveness) *exemplifies* **Commitment 1**: trusting expertise is a way to access right-making features indirectly.  
  - **Case verdicts**: (a) and (c) rely on **Commitment 1** and **3**; (b) challenges impartialist readings of **Commitment 4**.  

  **Expected fault lines**:  
  1. **Counterfactual robustness (4)** vs. **anti-luck (5)** – dispositional properties vs. actual control.  
  2. **Partial credit (3)** vs. **asymmetry (6)** – whether diluted motives satisfy "good motive" requirement.  
  3. **Huck Finn (a)** vs. **Commitment 1** – acting from friendship, not right-making features.  

  ---

  #### Tensions Ranked by Severity  
  **Tension 1: Robustness vs. Anti-Luck (Commitments 4 & 5)**  
  - **Collision**: **Commitment 4** requires moral worth to depend on counterfactual dispositions ("would have done it anyway"). **Commitment 5** insists moral worth depends *only* on actual motivation and response, excluding features for which the agent isn’t responsible. Robustness introduces a dispositional property (e.g., responsiveness to *any* right-making feature) that is partly circumstantial—e.g., whether other features *would have* been present or salient falls outside the agent’s control. **Commitment 5’s rationale** (praise/blame must reflect agential responsibility) cannot survive this, as robustness makes worth contingent on external possibilities.  
  - **Minimal Revision**: Drop **Commitment 5’s** claim that worth "never depends on features of circumstances". Allow that *dispositional properties* (e.g., consistent responsiveness) are creditable even if their exercise relies on luck.  
  - **Cost**: Weakens the anti-luck stance. **Case (b)** (partiality) survives (robustness permits partiality if agent would respond to *some* feature), but **Commitment 5** becomes a narrower rejection of *arbitrary* luck (e.g., upbringing) rather than *all* circumstantial luck.  

  **Tension 2: Partial Credit vs. Asymmetry (Commitments 3 & 6)**  
  - **Collision**: **Commitment 3** allows "partial credit" for mixed motives (e.g., 60% responsiveness to right-making features, 40% self-interest). **Commitment 6** states praiseworthiness *requires* a "good motive", implying a threshold. If self-interest dilutes the motive, **Commitment 6’s rationale** (praise must reflect moral quality) is undermined—partial credit suggests an act can be *partly* praiseworthy without a *fully* good motive.  
  - **Minimal Revision**: Refine **Commitment 6** to: "Praiseworthiness requires a *sufficiently* good motive, where ‘sufficient’ admits of degrees".  
  - **Cost**: Blurs asymmetry; may imply blameworthiness could also be partial (though you deny this). **Case (c)** (non-cancelling praise/blame) is strengthened, but **Commitment 6** loses crispness.  

  **Tension 3: Particularity vs. Robustness (Case (b) & Commitment 4)**  
  - **Collision**: **Case (b)** praises the partial anaesthetist *more* than the impartial one, valuing particular attachments. **Commitment 4** tests robustness by asking if the agent would act for *other* right-making features (e.g., "would she be careful with a stranger?"). If not, robustness fails—suggesting the partial agent is *less* creditable. **Case (b)’s rationale** (particularity isn’t defective) cannot survive if robustness *requires* impartiality.  
  - **Resolution via Commitments**: **Commitment 4** only demands responsiveness to *some* right-making feature if the primary one is absent. The partial anaesthetist may still respond to *other* features (e.g., professional duty) with strangers. *No revision needed* if particularity doesn’t entail ignoring all other features.  
  - **Cost**: None if **Commitment 4** is interpreted flexibly.  

  ---

  #### Dissolved Tensions  
  **Apparent Tension: Huck Finn (a) vs. Commitment 1**  
  - **Why it dissolves**: **Commitment 1** rejects being moved by "rightness itself", not by features *constituting* rightness. Huck acts from friendship, but friendship may sensitise him to Jim’s distress (a right-making feature). **Commitment 7** (deference) analogises this: trusting a friend’s judgement *is* a way to be moved by features (e.g., the patient’s needs). Huck’s false beliefs ("doing wrong") don’t negate his sensitivity to Jim’s plight.  

  **Apparent Tension: Anti-Luck (5) vs. Robustness (4) in Case (b)**  
  - **Why it dissolves**: **Commitment 5** targets *irresponsible* influences (e.g., upbringing), not the agent’s *actual* dispositions. The partial anaesthetist’s particularity is part of her "motivational set" (**Commitment 5**), and **Commitment 4** tests whether this set is robust *across features* (not people). No luck-based objection arises if her partiality reflects a responsible choice.  

  ---

  #### Minimal Revision for Maximal Gain  
  - **Revision**: Adjust **Commitment 5** to: "Moral worth depends *primarily* on the agent’s motivational set and response, and is not undermined by luck in circumstances *except where it severs the link* between agential responsibility and the motive."  
  - **Why**: This resolves the severe **Tension 1** (with **Commitment 4**) by accommodating robustness as a creditable disposition, while retaining core anti-luck intuitions. It has low cost: **Case verdicts** hold, and **Tension 2** remains manageable.  
  - **Resulting Position**: A reasons-responsive view where moral worth requires:  
    - Actual motivation by right-making features (**1, 7**),  
    - A disposition to respond to *some* such features robustly (**4**, revised **5**),  
    - Scalable credit for mixed motives (**3**, **6** refined),  
    - Asymmetry preserved by tying praise to good motives (even if partial) and blame to broader criteria.  

  **Overall Coherence**: With this revision, your position is tenable. It combines *feature-based motivation* (Kantian-inspired but duty-avoidant), *dispositional robustness* (virtue-adjacent), and *asymmetric scalar praise*—a distinctive hybrid. Circulate with confidence, but prepare to defend the softened anti-luck stance.
