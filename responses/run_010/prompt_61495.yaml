prompt: |-
  I keep meaning to read up on this and I keep putting it off, so let me get the spec first instead. The question: what makes every 'a' an 'a'? Not what makes this particular mark pretty — what it is for two marks to be tokens of the same letter.

  Before I look at any candidate answers I want the requirements list: what an account of letterform identity has to deliver. For each requirement give me the case or consideration behind it, and say whether its non-negotiable or just something one camp insists on. Here's the raw material ive been collecting — use what's useful, drop what isn't, add your own:

  - a double-storey a (Times, most serif faces) and a single-storey a (Futura, Comic Sans, children's primers, most people's handwriting) share essentially no outline features, and yet nobody hesitates for a second about calling them the same letter.
  - mirror a b horizontally and you get a d — a different letter. Mirror an a and most people, shown it, say "that's a backwards a," not "that's some other letter." Why does reflection change the identity in one case and merely damage it in the other? whatever the answer is, it should fall out of the theory rather than being bolted on afterward.
  - rotate an n 180 degrees and you get a u; rotate a W and you get an M; rotate a b and you get a q. Rigid transforms sometimes preserve the letter, sometimes swap it for a neighbor, sometimes produce garbage.
  - the Latin C and the Cyrillic Es are the same shape in most fonts. Same letter?
  - Morse a is dot-dash, braille a is one raised dot, ASCII a is 0x61. If those are all the letter a, then shape and sound have both dropped out of the account and I want to know what's left that gets carried over. If they aren't, say what the relation between them and the printed a actually is.
  - a in cat, in father, in cake. Three different sounds, one letter. And c in cat vs city. So the sound-based account dies fast — but any account still owes me a reason why sound feels like it ought to matter.
  - in plenty of fonts lowercase l, uppercase I and the digit 1 are the same mark. Is the mark a letter, a letter, or a number?
  - A and a: one letter or two? They sort together, they're different code points, and a typeface can contain one without the other. Whatever relation holds between A and a must not also hold between A and B, and that's a constraint on the theory, not a slogan.
  - æ is a ligature in English and a full letter of the alphabet in Danish. ß vs ss. The long s, which about half of us now read as an f.
  - a manuscript nobody has been able to read in five hundred years still contains letters, presumably. But a four-year-old who produces a mark that looks exactly like an a while telling you she's drawing a cat has not written one.
  - and the one I care about most: my own handwriting. My a and my g and my x look like they came from the same hand even though they don't share any feature I can name. Any account that only ever asks about one mark at a time is going to miss that, and I want to know whether it's a requirement on letter identity or a separate problem that gets kicked next door.

  Then tell me which requirement is doing the most work killing candidates — my guess is the Morse/braille one but I could easily be wrong. And flag any pair you think can't be jointly satisfied; I have a feeling something like "shape can't be what matters" and "shape obviously matters" is in there, but I can't make it precise and I'd like you to. When the list is done, briefly — two or three sentences each, no more — say how a pure-shape account, a pure-system-role account, and a "there's no essence here, it's family resemblance all the way down" account do against it.

  Purpose, in case it changes the answer: I want a theory good enough that a program could use it to decide whether some glyph it's never seen before is an a. So nothing in the requirements can lean on facts the program couldn't in principle check.
reasoning: |-
  Okay, the user is asking for a comprehensive requirements list for what defines a letter's identity, specifically what makes any 'a' an 'a' regardless of its form. They've provided a lot of examples and edge cases they've collected, and they want me to structure these into a set of requirements with justifications and priorities. 

  Hmm, the user seems deeply invested in typography and linguistics—maybe a designer, linguist, or philosopher? Their frustration with putting off reading suggests they value precision but struggle with scattered sources. The examples about handwriting and unreadable manuscripts hint at personal engagement with materiality of writing. 

  The core tension I notice: shape can't be essential (single vs double-story 'a'), but can't be irrelevant either (mirrored 'b' becomes 'd'). The Morse/braille point is especially vicious—if abstract codes are 'a', what's the invariant? 

  For requirements, I'll group their cases into clusters: 
  First, visual invariance must handle shape variations (single/double-story 'a') while explaining why some transformations break identity (mirroring/rotation). The unreadable manuscript vs child's drawing case shows intent/system matter, but pure intentionalism fails too (Danish 'æ' vs English ligature). 

  The coding systems (Morse/ASCII) demand abstraction beyond sensory form—this might murder shape-based theories. Meanwhile, case sensitivity ('A' vs 'a') requires relational identity without collapsing distinctions between letters. 

  Biggest conflict: "shape can't define letterhood" vs "shape obviously matters". Precision: shape is never sufficient (identical glyphs = different symbols) but often necessary for recognition. The killer requirement is probably cross-modal identity (visual/Morse/braille) forcing a move to functional roles. 

  For theories: 
  - Pure shape dies on rotation/mirroring and Morse codes. 
  - System roles handle variations and scripts but struggle with ambiguous glyphs (l/I/1). 
  - Family resemblance feels right but might be too vague for their AI purpose—how does the program decide what "counts as similar" without circularity? 

  User's end goal—AI letter detection—is crucial. Any requirement leaning on human interpretation (e.g., "feels like it ought to matter" for sound) must be excluded. The manuscript/child drawing case might need rethinking: intent is unknowable to software. 

  I'll flag the "shared handwriting essence" issue separately—it's about style consistency, not letter identity per se, but the user cares deeply. Probably a downstream problem. 

  Final note: the Danish 'æ' vs English ligature case suggests letterhood is conventional, not inherent. That's a problem for essentialist theories but fits system-based views. Still, conventions vary—how would AI know which system applies? Oof.
answer: |-
  Here's a requirements list for an account of letterform identity, derived from your cases and core question, designed for AI applicability. Each requirement includes the driving case, its negotiability, and why it matters:

  ### Core Requirements for Letterform Identity

  1.  **Visual Invariance Despite Radical Shape Differences:**  
      *   **Case:** Single-story 'a' (handwriting, Futura) vs. double-story 'a' (Times New Roman).  
      *   **Negotiability:** Non-negotiable.  
      *   **Why:** The core phenomenon - identical identity despite no shared visual features. An account *must* explain this.

  2.  **Contextual Orientation Sensitivity:**  
      *   **Case:** Mirroring 'b' -> 'd' (identity change) vs. mirroring 'a' -> "backwards a" (identity preserved but damaged). Rotation effects (n->u, W->M, b->q).  
      *   **Negotiability:** Non-negotiable.  
      *   **Why:** Orientation isn't uniformly relevant. The theory must predict *when* and *why* orientation changes identity vs. damages it vs. creates a different valid letter vs. garbage, based on context.

  3.  **Distinct Identity Despite Visual Identity:**  
      *   **Case:** Identical glyph for 'l' (lowercase L), 'I' (uppercase i), and '1' (digit one).  
      *   **Negotiability:** Non-negotiable.  
      *   **Why:** A single physical mark must be interpretable as distinct abstract entities. Identity depends on more than shape.

  4.  **Cross-Modal Identity:**  
      *   **Case:** Printed 'a', Morse 'a' (·-), Braille 'a' (⠁), ASCII 'a' (0x61) being the same letter.  
      *   **Negotiability:** Highly Contentious (Some camps insist it's non-negotiable; others argue these are *representations* of 'a', not 'a' itself).  
      *   **Why:** Essential if the theory aims for abstract identity encompassing all representations. Forces move beyond physical form.

  5.  **Case Relationship:**  
      *   **Case:** 'A' (uppercase) vs. 'a' (lowercase): distinct code points, often distinct shapes, sort together, typeface may lack one.  
      *   **Negotiability:** Non-negotiable.  
      *   **Why:** Requires defining a specific relationship (case pairing) that is unique and distinguishable from relationships between different letters (e.g., A-B).

  6.  **System-Relative Identity:**  
      *   **Case:** 'æ' as English ligature vs. Danish letter; 'ß' vs. 'ss'; interpretation of long 's'.  
      *   **Negotiability:** Non-negotiable.  
      *   **Why:** The identity/status of a glyph depends on the writing system/orthography it's used within. A universal shape-based account fails.

  7.  **Intentional/Systemic Context over Raw Appearance:**  
      *   **Case:** Unreadable manuscript (contains letters) vs. child's scribble (looks like 'a', is not 'a').  
      *   **Negotiability:** Non-negotiable (for AI purpose).  
      *   **Why:** Raw shape is insufficient. Identity depends on being part of a *writing system* with communicative intent (or historical/systemic context). The child's mark lacks the context.

  8.  **Sound Independence with Phonetic Association:**  
      *   **Case:** 'a' in 'cat', 'father', 'cake'; 'c' in 'cat' vs. 'city'.  
      *   **Negotiability:** Non-negotiable (sound independence), Contentious (phonetic association requirement).  
      *   **Why:** Sound cannot *define* the letter (multiple sounds per letter). However, the theory must explain why letters *feel* sound-related - likely via their systemic role in representing language, not direct sound mapping.

  9.  **Visual Overlap Across Scripts ≠ Identity:**  
      *   **Case:** Latin 'C' vs. Cyrillic 'Es' (С).  
      *   **Negotiability:** Non-negotiable.  
      *   **Why:** Identical shape in isolation must *not* imply identical letter identity if they belong to different writing systems. Context is key.

  10. **Handwriting Style Coherence (Your Priority):**  
      *   **Case:** Distinct letters (a, g, x) sharing a unique "hand" without common features.  
      *   **Negotiability:** Contentious - Likely a separate problem ("glyph/style coherence within a script implementation") but *informs* identity.  
      *   **Why:** Highlights that identity is assessed relative to a *system* (the writer's hand/script implementation), not just isolated marks. An identity theory must allow for coherence *within* a specific stylistic instance.

  ### Analysis

  *   **Biggest Candidate Killer:** **Cross-Modal Identity (Requirement 4)** is the most lethal. It forces the theory beyond visual form entirely. If Morse/Braille/ASCII *are* 'a', the invariant must be abstract and functional. If they *aren't*, the theory must precisely define the relationship between the abstract 'a' and its representations, which is equally challenging.
  *   **Key Conflict:**
      *   **"Shape Can't Be What Matters"** (Driven by: 1 - Visual Invariance, 3 - Distinct Identity, 4 - Cross-Modal, 6 - System-Relative, 7 - Intentional Context, 9 - Script Overlap).
      *   **"Shape Obviously Matters"** (Driven by: 2 - Orientation Sensitivity, *implicitly* in recognition).
      *   **Precision:** Shape is *necessary for recognition within a specific visual implementation of a system* but is *insufficient for defining abstract identity*. Orientation sensitivity (Requirement 2) shows shape *in context* matters critically for distinguishing letters *within* a system. The conflict resolves by recognizing shape's role *within a specific systemic context* for differentiation, while abstract identity itself transcends any specific shape.

  ### Theory Performance Against Requirements (Briefly)

  1.  **Pure-Shape Account:**
      *   Dies immediately on Requirements 1 (radical shape differences), 3 (identical shape, different symbols), 4 (non-visual representations), 6 (system relativity), 7 (intentional context), and 9 (cross-script overlap). Fails Requirement 2 (orientation) unpredictably.

  2.  **Pure-System-Role Account (e.g., position in alphabet, functional role in writing system):**
      *   Handles 1, 3, 4 (if representations map to the role), 5, 6, 7, 8, 9 well. Struggles with Requirement 2 (orientation) - why does flipping change the role/position? Needs augmentation. May struggle to define the "system" for Requirement 10.

  3.  **Family Resemblance Account:**
      *   Handles 1 well. Struggles with 2 (predicting orientation effects), 3 (no chain links '1' to 'l'), 4 (hard to extend chain to Morse), 6 (ambiguous which family), and 9 (same shape, different families). Vulnerable to vagueness, making Requirement 10 (hand coherence) easier but Requirement 7 (child's scribble) harder. Poor for AI determinism.

  **For Your AI Purpose:** Requirements 4 (Cross-Modal), 7 (Intentional/Systemic Context), and 6 (System-Relative Identity) are the toughest. The AI *must* infer the relevant writing system and communicative intent context to classify a novel glyph as a specific letter. Pure shape is useless. A system-role account, augmented with contextual rules (especially for orientation), is the most viable path, but requires significant contextual input for the AI. The "hand coherence" (10) is likely a secondary recognition problem *within* a system once the script/system is identified.
