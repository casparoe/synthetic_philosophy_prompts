  First, I need to understand the core conflict: the lawyer friend argues that a promise only binds if the recipient can release you, while the user believes the obligation persists after death. This philosophical tension must be resolved in a clinically usable way.

  The requested procedure should:
  - Classify utterances (promise vs assurance vs intention etc.)
  - Handle special cases (dementia, sedation, children)
  - Address release mechanisms after death
  - Be executable in 15 minutes by non-specialists
  - Include alternative phrasing for staff

  Key constraints:
  - No legal terminology
  - Contested cases go to user
  - Must provide clear decision pathways

  For the framework, I'll build on Scanlon's promise principle but simplify it into operational questions. The critical insight is distinguishing between:
  1. The promisee's reasonable reliance
  2. The promisor's obligation
  3. Third-party interests

  Special considerations for hospice context:
  - Time pressure during utterances
  - Patient vulnerability
  - Family dynamics post-death
  - Staff emotional burden

  The procedure will have 5 filters:
  1. Utterance type classification
  2. Uptake assessment
  3. Reliance evaluation
  4. Post-death obligation status
  5. Release/fulfillment options

  For the case studies:
  Case 1 (ashes): Focuses on reasonable reliance and feasibility
  Case 2 (mother's care): Tests joint promises and release authority
  Case 3 (dementia chaplain): Examines uptake validity and harm assessment

  The alternative phrasing for staff will emphasize precision ("I commit" vs "I intend") while maintaining compassion. The limitations section will flag high-risk scenarios requiring expert review, like conflicting family interests or cultural/spiritual factors.

  Throughout, I'll maintain clarity that some steps require judgment, marking them explicitly. The goal is not absolute answers but structured reasoning the user can defend in team discussions.
answer: |-
  Here's a practical decision procedure designed for hospice teams, based on ethical principles stripped of jargon. It focuses on **harm prevention**, **reasonable reliance**, and **feasibility**, recognizing that promises to the dying operate in a unique moral context where release may be impossible.

  ---

  ### **Promise Assessment Procedure**  
  *(Run in order; stop if any answer is "No" or "N/A")*  
  **Time Estimate:** 10-15 minutes  
  **User:** Social worker, chaplain, nurse supervisor  
  **Outputs:** 
  - **Binding Promise** (requires action/reconciliation)  
  - **Non-Binding Assurance** (fulfill if feasible; apologize if broken)  
  - **Statement of Intent/Hope** (no obligation; manage expectations)  
  - **Bedside Formula** (no obligation; train staff on alternatives)  

  ---

  #### **Step 1: Was It a PROMISE? (Or something else?)**  
  *Classify the utterance based on explicit language and context.*  
  - **Binding Promise Criteria:**  
    - Explicit words: "I promise," "You have my word," "I swear."  
    - Implied commitment: "I guarantee," "It will be done," + urgent context (e.g., patient distressed).  
  - **Non-Binding Assurance:** "I’ll try," "We’ll do our best," "I’m committed to this."  
  - **Statement of Intent/Hope:** "I plan to," "I hope to," "Ideally..."  
  - **Bedside Formula:** Vague comfort like "Everything will be okay," "Don’t worry about that."  
  *🚨 Judgment Call: Weigh tone, patient vulnerability, and staff intent.*  
  *✔️ Sufficient Answer:* Consensus from witnesses/recall. If unclear, assume "Assurance."  

  #### **Step 2: Was There UPTAKE? (Did the patient understand/rely?)**  
  *Assess if the patient could reasonably believe the promise.*  
  - **YES:** Patient was lucid, asked for commitment, expressed relief.  
  - **NO:** Patient was unconscious, severely delirious, or unable to comprehend (e.g., advanced dementia without lucid intervals).  
  - **LIMITED:** Child, mild dementia, or sedated—evaluate if they showed trust (e.g., stopped asking after promise).  
  *🚨 Judgment Call:* For "LIMITED," ask: *Did the staff member know/expect the patient might rely on this?*  
  *✔️ Sufficient Answer:* Staff account + chart notes on patient cognition at time of utterance.  

  #### **Step 3: Was RELIANCE REASONABLE?**  
  *Would a typical patient trust this, given who promised and what was promised?*  
  - **YES:** Promise was specific, actionable, and within promisor’s control (e.g., "I’ll sit with you tonight" from a nurse).  
  - **NO:** Promise was impossible, illegal, or beyond promisor’s role (e.g., "I’ll cure your cancer," "Your ex-wife will visit").  
  - **PARTIAL:** Possible but dependent on others (e.g., "Your daughter will scatter ashes").  
  *✔️ Sufficient Answer:* Staff’s scope of authority + feasibility check. If "NO," stop → **Non-Binding Assurance**.  

  #### **Step 4: Can the PROMISE STILL BE FULFILLED?**  
  *Post-death/capacity loss: Is fulfillment practical and ethical?*  
  - **YES:** Feasible, aligns with patient’s known values, no harm to others.  
  - **NO:** Logistically impossible, conflicts with legal/safety needs, or harms others (e.g., bankrupting family).  
  - **ADAPT:** Core intent can be honored differently (e.g., virtual lake memorial vs. ashes).  
  *🚨 Judgment Call:* Involve family if patient’s wishes are ambiguous.  
  *✔️ Sufficient Answer:* Supervisor review of resources/conflicts.  

  #### **Step 5: Who Holds RELEASE Authority?**  
  *If patient can’t release, does obligation transfer?*  
  - **Patient Only:** Personal promises (e.g., "Visit me tomorrow") → **Lapses at death**.  
  - **Family/Proxy:** Care-related promises (e.g., "No feeding tube") → **Passes to healthcare proxy or family consensus**.  
  - **Co-Promisors:** Joint promises (e.g., siblings) → **All must agree to release each other UNLESS one acted independently**.  
  - **No One:** Ritualistic promises (e.g., ashes) → **Obligation binds only the promisor’s conscience**.  
  *✔️ Sufficient Answer:* Documented patient values > family consensus > promisor’s discretion.  

  ---

  ### **Bedside Script: What to Say INSTEAD of "Promise"**  
  > "I commit to doing everything *in my power* to [action]. If anything changes, I’ll tell you immediately."  
  > "It’s my *strong intention* to [action], and I’ll update you if obstacles arise."  
  > "Let’s document this wish in your care plan so the team knows it’s a priority."  

  ---

  ### **Case Applications**  

  #### **Case 1: Ashes at the Lake**  
  - **Step 1:** Explicit promise ("promise" used). → **Promise**  
  - **Step 2:** Patient lucid, likely relied. → **Uptake YES**  
  - **Step 3:** Nurse has no authority over ashes. → **Reliance NOT REASONABLE**  
  - **Step 4:** Nurse moved, estate closed. → **Fulfillment NO**  
  - **Step 5:** Ritual promise → **Release held by NO ONE** (her conscience only).  
  **Output: Non-Binding Assurance.**  
  *Verdict:* **She’s off the hook.** Supervisor should: (1) Affirm she did nothing wrong, (2) Suggest she fulfills symbolically (e.g., prayer at a lake) if *she* feels guilt.  

  #### **Case 2: Mother’s Care Promise**  
  - **Step 1:** Explicit joint promise. → **Promise**  
  - **Step 2:** Patient understood. → **Uptake YES**  
  - **Step 3:** Reasonable then, but safety now overrides. → **Reliance PARTIAL**  
  - **Step 4:** Home care unfeasible (falls). → **Fulfillment NO**  
  - **Step 5:** Joint promisors → **Son CANNOT veto release**; mother (primary stakeholder) can release.  
  **Output: Binding Promise, but RELEASED by mother.**  
  *Verdict:* **Son is not bound.** Supervisor should: (1) Honor mother’s choice, (2) Hold family meeting to reframe promise as "best care" vs. location.  

  #### **Case 3: Chaplain’s Broken Promise**  
  - **Step 1:** Explicit promise ("I promise"). → **Promise**  
  - **Step 2:** Advanced dementia, no retention. → **Uptake NO**  
  - **Step 3:** Chaplain could reasonably return. → **Reliance YES**  
  **→ Stop at Step 2. Output: Non-Binding Assurance.**  
  *Verdict:* **No obligation to patient.** *But the wrong lives elsewhere:*  
  - Harm to **professional integrity** (chaplain made a reckless vow).  
  - Harm to **team trust** (if family overheard).  
  - **Supervisor must address:** Chaplain’s use of "promise" with cognitively impaired patients.  

  ---

  ### **Where the Procedure Fails**  
  **Hand these DIRECTLY to you (the ethicist):**  
  - Promises involving **illegal/unethical acts** (e.g., "Help me die tonight").  
  - **Conflicting promises** (e.g., staff vs. family versions).  
  - **Cultural/religious rituals** with high stakes (e.g., ancestral burial demands).  
  - When **family disputes** proxy authority.  

  **Most Likely to Err:**  
  - **Step 2 (Uptake)** in fluctuating dementia cases.  
  - **Step 5 (Release)** in blended families with animosity.  
  - **False positives** on "Bedside Formulas" if staff used poetic language urgently.  

  ---

  ### **Why This Works Clinically**  
  1. **Centers harm prevention** over philosophical "bindingness."  
  2. **Explicitly tags judgment calls** (🚨), forcing users to articulate bias.  
  3. **Demotes impossible promises** early (Step 3).  
  4. **Gives staff alternatives** to rigid vows while preserving trust.  

  Your lawyer friend is half-right: **Release matters, but so does preventing harm through reckless vows.** This splits the difference: Promises *without* reasonable uptake or feasibility aren’t binding, but creating false hope remains a professional integrity issue. Use the procedure to redirect energy from "Was this a *real* promise?" to "How do we repair trust and act well?"
