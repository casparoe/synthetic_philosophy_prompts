answer: |-
  ### Scenario: The Binary Digit Betting Pool
  A quant firm runs an internal prediction market where employees bet on binary digits of Champernowne's constant \(C_2\) (formed by concatenating binary integers: 0.01101110010111...). Each day \(n\), a new security \(\phi_n\) opens, paying $1 if the \(n\)th digit (0-indexed) is 1, $0 otherwise. The firm's AI market maker sets prices \(P_n\) at market open using a uniform prior (each digit 50% likely) and updates via Bayesian conditionalization as digits resolve. The AI is probabilistically coherent: for any finite set of \(\phi_n\), its prices satisfy probability axioms (treating unresolved digits as independent atoms). Digits are computable but costly: computing digit \(n\) requires \(O(n \log n)\) operations. The AI spends \(O(1)\) time per market—feasible for small \(n\) but impossible for large \(n\) day-of. A human employee, Pat, trades daily.

  ### The Fleecing
  **Hard sentences**: \(\phi_n \equiv \text{“Digit } n \text{ of } C_2 \text{ is 1”}\).  
  - **Why unresolved?** At day \(n\), computing \(\phi_n\) requires \(\sim n \log n\) steps. The AI’s \(O(1)\) time per market is insufficient for large \(n\). A human with paper could compute any \(\phi_n\) in a month, but not day-of.  
  - **Coherence**: For any finite \(k\), the AI’s joint distribution over \(\{\phi_1, \dots, \phi_k\}\) is consistent (e.g., \(P(\phi_n) = 0.5\) initially). No static Dutch book exists—all finite margins are coherent.  

  **Trading strategy**: Each day \(n\), Pat spends \(O(n \log n)\) time (feasible for a patient human) computing \(\phi_n\)’s truth. If \(\phi_n\) is true and \(P_n < 1\), Pat buys 1 share at \(P_n\). If false and \(P_n > 0\), Pat sells 1 share. Pat holds until settlement.  
  - **Payoff**: Per trade, Pat gains \(|1 - P_n|\) if \(\phi_n\) true, or \(|P_n|\) if false. Since \(P_n = 0.5\) at open and \(\phi_n\) is binary, profit \(\geq 0.5\) per trade.  
  - **Sequence advantage**: The AI cannot compute \(\phi_n\) day-of for large \(n\), so \(P_n\) stays at 0.5. Pat exploits this lag indefinitely, profiting \(\geq 0.5\) daily for all \(n\) where computation exceeds the AI’s budget (i.e., almost all \(n\)).  

  **Why no coherence Dutch book?** Coherence is maintained at each timestamp: at day \(n\), \(P_n = 0.5\) is consistent with the AI’s current knowledge. The loss arises from delayed updates, not static inconsistency.  

  ### Load-Bearing Piece and Objections  
  **Load-bearing piece**: The *asymmetry in computation time*—Pat spends \(O(n \log n)\) per digit daily, while the AI spends \(O(1)\). Remove this (e.g., give AI \(O(n \log n)\) time), and the AI updates \(P_n\) to 0 or 1 before Pat trades, blocking profit.  

  **Bayesian objection**: “This is just bounded computation, not flawed coherence. Logical omniscience is harmless—like idealizing away memory limits—since coherence is the gold standard for rationality.”  
  - **Does it land?** Partially. The loss *is* computational. But: logical induction shows that coherence *plus* computational bounds *requires* specific updating (e.g., anticipating patterns) to avoid exploitation. Standard Bayesians ignore this, leaving agents vulnerable even when coherence holds. The idealization is harmful because it masks preventable vulnerabilities.  

  **Rebuttal**: A truly rational bounded agent should be *inexploitable* by other bounded traders. Logical inductors achieve this; coherent-but-slow agents do not. The flaw isn’t coherence—it’s assuming coherence suffices under computation bounds.  

  ---  
  **Word count**: 499. Uses Champernowne’s constant (proven normal in binary; digits computable). Trader edge is public computation, not private data.
