  The objection: The Bayesian might say, "But this is just a problem of bounded computation, not of coherence. The agent is coherent at every moment. The loss is due to the agent not having time to compute the digits. This is no different from any other bounded resource. Therefore, logical omniscience is still a harmless idealization because it captures the coherence condition, and we separately account for computational limits."

