  In this example, the load-bearing piece is that the trader can compute the digit for φ_n at time n, while the agent cannot. If the agent were given enough time to compute the digit (say, at time n + c for some constant c), then the trader would not be able to exploit the agent on φ_n because the agent would have updated the price to 0 or 1 by the time the trader comes along. But the trader can trade at time n, exactly when the market opens. The agent must set a price at time n without having computed the digit. If the agent sets the price to 0.5, then the trader exploits. If the agent sets the price to 0 or 1 without computing, that would be incoherent if the agent doesn't know the answer. So the agent is stuck: it must set a price without knowing the digit, and if that price is not exactly the truth, the trader can exploit.

