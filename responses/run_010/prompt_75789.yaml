prompt: |-
  I maintain the data layer for a multi-hospital mortality and organ-procurement registry, and I have no training in philosophy, so I am asking for a specification rather than an essay.

  Every record we ingest has to collapse into one boolean and one timestamp, even though the contributing hospitals run different protocols and sit under different jurisdictions, and even though the underlying event is a process rather than an instant. Building that normalization layer has dropped me into a dispute I lack the vocabulary for. The uniform statute that most American states have adopted defines death in two prongs: irreversible cessation of circulatory and respiratory functions, or irreversible cessation of all functions of the entire brain including the brainstem. That formulation has stood since 1981, and a drafting committee convened in 2021 to revise it suspended its work indefinitely in 2023, reporting that the politics and the downstream consequences made revision infeasible. A definition that has not moved in four decades, plus a failed attempt to update it, suggests to me that the hard part is not drafting but knowing what a definition of death is supposed to accomplish. I want that stated before I read anything else.

  Write the desiderata: the requirements any adequate definition, criterion, and test of death must satisfy, with the case or consideration behind each. My tentative list is below; consolidate the items that turn out to be one requirement in disguise, correct the ones that are misconceived, and add what I have missed.

  (a) Univocity — a single concept must cover both prongs, so that circulatory death and death by neurological criteria are the same kind of event and not two events the law merely agrees to treat alike.
  (b) Determinate time — a single instant must be identifiable, because inheritance, homicide liability, and transplant logistics all need one.
  (c) Decidability at the bedside — the criterion must be applicable by a non-specialist with ordinary equipment in bounded time, using only information available at that moment. Irreversibility looks to me like a claim about every intervention that could ever be attempted, which is not a bedside measurement. If the standard tests are only a proxy for it, I want to know which concept the proxy is actually tracking.
  (d) Insensitivity to resources and intentions — whether someone is dead should not turn on whether an extracorporeal circuit is primed in the next room. In controlled donation after circulatory death, circulation has been absent for only a few minutes when death is declared, and the team present could restore it but has resolved not to. On a strict irreversibility reading that patient looks alive; on a permanence reading, death depends on other people's plans. Neither is acceptable to me and I suspect one is unavoidable.
  (e) Independence from downstream uses — the definition must not be shaped by what it licenses, and in particular must not be drawn so that organ recovery turns out not to kill the donor.
  (f) Accounting for continued somatic integration — patients meeting whole-brain criteria have been physiologically maintained for years with wound healing, growth, and fluid and temperature regulation continuing, and there are reports of pregnant patients meeting those criteria supported for weeks until delivery. The definition must explain why none of this is the organism functioning as a whole.
  (g) Fixing the boundary against neighbors — persistent vegetative state, locked-in syndrome, advanced dementia, and the fact that British practice rests on brainstem function while American practice rests on the whole brain. Should an adequate definition entail that one of these jurisdictions is simply wrong?

  For each requirement, say whether it is a genuine demand on the concept or a preference of a particular camp. I also keep encountering the claim that death is a normative or legal construction rather than a biological fact, and I cannot tell whether that is a rival definition or a denial that the project has an answer; place it.

  The part I most want: identify any subset of these requirements that cannot be jointly satisfied, and state it the way you would state an impossibility result — hold this and that, and you must give up the other. Then tell me which single requirement eliminates the most candidate accounts, and whether an unmeetable list means the concept is defective or that my list is. Skip the survey of theories; if you indicate how two or three leading accounts fare, one line each is plenty. Please define technical terms on first use.
reasoning: |-
  Okay, let me unpack this user's request. They're a data professional working with mortality registries who needs philosophical clarity on defining death - but explicitly wants specifications, not essays. 

  Hmm, their core tension is practical: they have to collapse complex hospital data into binary death events, but the underlying medical/legal framework feels unstable. The 1981 UDDA definition has two prongs that might not conceptually align, and recent revision attempts failed. They're smartly recognizing that before debating definitions, we need the criteria for evaluating any definition.

  Looking at their list - wow, they've identified genuinely profound philosophical pressure points. The irreversibility vs. permanence dilemma (d) is especially thorny for their work since DCD protocols make this operational. And requirement (f) about somatic integration cuts to the heart of biological vs. neurological concepts of organismic life.

  *flipping through mental notes on bioethics debates*
  The user's suspicion about requirement (e) is spot-on - the "dead donor rule" absolutely shapes practice even if we pretend otherwise. And their worry about (b) being impossible? They're right to flag that; the more you examine biological systems, the less death looks like an instant.

  *adjusting framework*
  Need to show how some requirements are non-negotiable (like univocity) while others involve trade-offs. The resource-dependence issue (d) is particularly messy because it reveals how death determination isn't purely biological - it's a decision to stop fighting biology. 

  *structuring response*
  Will cluster their points into conceptual must-haves (Section 1), practical constraints (Section 2), and boundary conditions (Section 3). The impossibility results should be blunt: if you demand strict irreversibility (d), you sacrifice bedside decidability (c). And if you want death to be purely biological (f), you can't have it unaffected by resources (d).

  Most importantly - they asked for desiderata, not solutions. So I'll resist the academic urge to survey theories, and instead give them the evaluation grid they need to parse any definition against their data-modeling reality.
answer: |-
  Here are the consolidated desiderata for a definition of death, corrected and expanded based on core philosophical, biological, and practical imperatives. Requirements are categorized by type, and tensions are explicitly stated.

  ### **I. Foundational Requirements (Non-Negotiable)**
  1. **Biological Univocity**  
     *Requirement:* A single biological phenomenon must unify circulatory and neurological criteria.  
     *Rationale:* Death must be one state (cessation of organismal functioning) regardless of pathway. If the two prongs represent distinct biological events, the definition is incoherent.  
     *Status:* Genuine demand. Without this, death becomes a legal fiction.

  2. **Non-Normative Basis**  
     *Requirement:* The definition must track a biological reality, not societal needs (e.g., organ transplantation).  
     *Rationale:* Death cannot be defined by its consequences (e.g., "permitting organ recovery without killing").  
     *Status:* Genuine demand. Rejects the "death is purely legal" view, which confuses *diagnosis* with *concept*.

  ### **II. Practical Requirements (Operational Constraints)**
  3. **Operational Decidability**  
     *Requirement:* Death must be determinable at the bedside with available tools within finite time.  
     *Rationale:* Clinical decisions (e.g., stopping treatment) cannot await hypothetical future interventions.  
     *Status:* Genuine demand. "Irreversibility" must be interpreted as *permanence under current conditions*.

  4. **Resource/Intent Independence**  
     *Requirement:* The determination must not depend on external factors (e.g., presence of ECMO, intent to transplant).  
     *Rationale:* A person’s life/death status cannot change based on others’ resources or plans.  
     *Status:* Genuine demand. **Major tension:** Strict "irreversibility" violates this (see *Impossibilities*).

  ### **III. Boundary Requirements (Conceptual Clarity)**
  5. **Somatic Integration Threshold**  
     *Requirement:* Must distinguish integrated organismal function from mere cellular/tissue activity.  
     *Rationale:* Wound healing or gestation in brain-dead patients is subsystem activity, not the organism acting as a whole.  
     *Status:* Genuine demand. Key counterexample: A brain-dead body is a *biomechanical system*, not an organism.

  6. **Boundary Consistency**  
     *Requirement:* Must delineate death from severe neurological impairment (PVS, locked-in syndrome, dementia).  
     *Rationale:* Brainstem death criteria exclude PVS/locked-in patients (who retain consciousness). UK/US differences hinge on whether "whole brain" includes cortical function.  
     *Status:* Preference. UK (brainstem) and US (whole brain) both satisfy biological univocity if brainstem failure is the core.

  ### **IV. Derivative Requirements (Contingent but Critical)**
  7. **Temporal Determinacy**  
     *Requirement:* A legally/medically acceptable time of death must be assignable.  
     *Rationale:* Needed for legal (inheritance, homicide) and logistical (organ transplant) purposes.  
     *Status:* Preference. Biology involves processes; "instant" death is a practical/legal necessity, not biological reality.

  ### **Corrected Misconceptions & Additions**
  - **Irreversibility vs. Permanence:** Your concern (c,d) is valid. "Irreversible" biologically means *cannot* auto-resuscitate or be revived. Clinically, it means *will not* be revived given current intent/resources. The latter is used in practice ("permanence").  
  - **Added Requirement: Causal Finality**  
    *Requirement:* Death must mark the point where the body cannot spontaneously restore integrated function.  
    *Rationale:* Distinguishes temporary cessation (e.g., cardiac arrest with CPR) from biological death.  

  ### **Impossibility Results**
  1. **Hold Biological Univocity + Resource Independence → Sacrifice Strict Irreversibility**  
     If death is a biological state independent of human intervention, irreversibility cannot require evaluating *all possible* future technologies. Permanence (non-resuscitation *intended*) is the only bedside-applicable criterion.  

  2. **Hold Instantaneous Determination + Biological Accuracy → Sacrifice Precision**  
     Biology has no "instant" of death (e.g., neurons dying over hours). An "instant" is a legal convention (e.g., time of circulatory arrest or first confirmatory test).  

  ### **Most Challenging Requirement**  
  **Resource/Intent Independence (Requirement #4)** eliminates the most candidate accounts:  
  - Strict irreversibility fails (requires hypothetical future interventions).  
  - Permanence-based definitions fail (depends on human intent not to resuscitate).  
  - *Only solution:* Define death as **cessation of spontaneous organismal function** (e.g., inability to maintain homeostasis without external support), but this risks over-including ICU patients.  

  ### **Is the Concept Defective?**  
  No. Your desiderata are coherent, but Requirement #4 (Resource Independence) is **impossible to satisfy fully** in practice. Biology and clinical reality force trade-offs. The unmeetable demand is expecting death to be a *context-independent* biological fact in an era of advanced technology.  

  ### **Leading Accounts’ Compliance**  
  - **Whole-Brain Death (UDDA):** Fails strict irreversibility (c), requires permanence (d).  
  - **Brainstem Death (UK):** Same as above; resolves (g) by focusing on consciousness/respiration.  
  - **Higher-Brain Death:** Fails biological univocity (a) and somatic integration (f).  

  ### **Key Technical Terms**  
  - **Organismal Function:** The capacity of an organism to act as a whole (e.g., regulate, adapt, reproduce).  
  - **Permanence:** Cessation will not be reversed *under current circumstances*.  
  - **Irreversibility:** Cessation *cannot* be reversed by *any* means.  

  ### **Summary Position**  
  Death is the **permanent loss of spontaneous organismal function**, where "permanent" acknowledges clinical context. This satisfies (a), (c), (f), and (g), with (d) pragmatically resolved by defining "permanent" as "no intervention will be attempted." Requirement (e) is upheld by insisting the biological threshold (organismal failure) precedes any use case. The definition is biological; the *diagnosis* is operational.
