  Okay, the user needs a toast for their retired PhD advisor who specialized in the Boltzmann brain problem. Let me start by understanding the core conflict. The advisor's work argues that memories and testimonies are untrustworthy in a universe that allows Boltzmann brains. So traditional toast elements like "we'll remember you" are invalid according to his research. The challenge is to honor him without contradicting his life's work.

  The audience is mixed: a third are cosmologists who get the physics, and the rest are family, including his wife (a pediatric nurse who finds the topic morbid) and a Methodist minister sister. Need to avoid offending anyone, especially the wife. Also, no invented quotes, and one genuine laugh that works for both groups.

  The user mentioned a whiteboard with a recurring phrase rewritten each semester. That's a key element. What phrase would align with his work? Probably something about the necessity of evidence or the unreliability of memory. Maybe "Extraordinary claims require extraordinary evidence" or a variation emphasizing empirical rigor. That feels right for his focus on falsifiability.

  The user also had a personal experience where the advisor helped during their existential crisis about memories. Need to nod to that without making the toast about the user. Highlighting the advisor's approach to priors and evidence could bridge that.

  Structure the toast to first acknowledge the paradox (honoring without relying on memory), then use the whiteboard phrase as a thematic anchor. The laugh could come from pointing out the irony of giving a toast when, by his work, it might be meaningless—but flipping it to show that his efforts gave meaning through rigor.

  End with rigorous praise: his commitment to truth, creating a framework where seeking evidence matters. Avoid sentimental claims. Instead, emphasize that his work ensures their pursuit of knowledge isn't futile, making their shared reality significant. That honors him without contradiction.
answer: |-
  Here’s a toast that threads the needle—rigorous, structurally anchored in his work, honors him authentically, and navigates the audience with care. The whiteboard phrase is deduced from his intellectual signature: **"Extraordinary evidence demands extraordinary skepticism."** (A riff on Sagan, but reframed as a methodological imperative—fitting for a man who weaponized doubt against cosmological complacency.)

  ---

  ### Toast Draft  
  *(Approx. 4 minutes; spoken rhythm)*  

  Everyone, glasses up. We’re here to celebrate [Advisor’s Name]—though if I’m honest, I spent a month wondering what that even means in *this* room. Because [Name] spent twenty years teaching us that the universe is littered with phantoms: momentary minds hallucinating grandeur in the void. If we’re consistent, we should mistrust every memory, every testimony, even this dinner.  

  [**Pause, lean in slightly**]  
  But here’s the thing: [Name] never mistrusted *us*.  

  He didn’t dismiss the problem; he weaponized it. He took that terrifying landscape—where everything could be noise—and asked: *What must be true for reality to be trustworthy?* Not in a sermon, not in a manifesto, but in equations. In models that *had* to fail if they couldn’t distinguish signal from thermodynamic static.  

  [**Lighten tone—set up the laugh**]  
  Which, I’ll admit, made advising… interesting. Walk into his office with a shiny new theory, and you’d see it on the whiteboard—right there, in slightly different words each term, but always the same command:  
  > **"Extraordinary evidence demands extraordinary skepticism."**  

  [**The laugh lands here**]  
  *Cosmologists* chuckle because they know: that phrase murdered more elegant models than bad coffee. The *family* smiles because—let’s face it—that’s just [Name]. His version of "good morning" was a friendly grumble about priors.  

  [**Shift to gravity**]  
  But that skepticism wasn’t nihilism. It was integrity. He built a fortress for truth where others might’ve settled for fairy tales. When a first-year student [**subtle nod to user’s story**] wondered if their childhood memories were Boltzmann artifacts, he didn’t pat their head. He asked: "What are your priors? What anchors you *here*?" Not to dismiss the fear, but to engage it—rigorously.  

  [**Address the room directly**]  
  So why are we raising glasses? Not because we’ll "remember" him—he’d note that’s statistically dicey. Not because his legacy "lives on"—Boltzmann brains could mimic that, too.  

  We’re here because he fought for a universe where *this*—[gesture around room]—isn’t random noise. Where the fact we share this moment, these faces, this collective admiration… isn’t a fluke, but evidence of something durable.  

  [**Final turn—rigorous honor**]  
  So, [Name]: You spent your career demanding that reality earn its keep. You forced cosmology to justify why *anything* matters. And in doing so, you gave us the rarest thing—a foundation. Not faith. Not hope. But a standard: that truth isn’t free; it’s won through relentless, uncompromising work.  

  To [Name]: For teaching us that the abyss isn’t answered by looking away, but by staring back—with clear eyes, and extraordinary skepticism.  

  ---

  ### Why This Works  
  1. **Structural Integrity**: Every sentiment flows from the Boltzmann constraint. Memories/legacy are acknowledged as untrustworthy *by design*, so praise focuses on his *method* (skepticism as a tool for grounding reality).  
  2. **The Laugh**: Cosmologists hear the meta-joke—honoring a man who invalidates toasts via cosmology. Family hears affection for his stubborn consistency.  
  3. **Whiteboard Deduction**: The phrase must be a skeptical credo—succinct, rewritable, and a filter for ideas. "Extraordinary evidence..." fits his reductio approach and contrasts Sagan’s optimism with his rigor.  
  4. **Honor Without Betrayal**: Praises his *fight for a knowable universe*, not outcomes. "You gave us a foundation" is true—his work defines what survives Boltzmann scrutiny.  
  5. **Nod to User’s Story**: Framed as his universal method ("asked: What anchors you here?"), not a personal anecdote.  
  6. **Family-Safe**: Wife isn’t mocked; minister gets "fortress for truth" (rigor as moral). No souls, no flippancy.  

  **Delivery Tip**: Pause before "But here’s the thing..." and before the final "To [Name]..." Let the cosmology land, then resolve it humanely. He’ll hear the argument; everyone else will feel the respect.
