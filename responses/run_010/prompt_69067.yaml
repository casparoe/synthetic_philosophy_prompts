  Progress paths: Formal models (team reasoning) might clarify but not resolve metaphysics. Developmental studies could show when obligations emerge, supporting Gilbert. Changing the question to "what mechanisms enable joint action?" might bypass the stalemate. The user's instinct that the debate is stuck rings true; it's a deep philosophical divide.

  The user's hypothesis is largely correct. The core issue is differing theoretical goals, not facts. They're sharp to spot the asymmetry—it's key to the deadlock. Moving forward, shifting focus to mechanisms or norms might help, but the metaphysical rift may persist.
answer: |-
  Here’s a diagnosis argued from the claims and commitments of the key positions you outlined, followed by testing and paths for progress. I’ll proceed as requested: first brainstorming candidate diagnoses, then committing, then testing with cases, and finally addressing progress. My role: a philosopher of action/social ontology, prioritizing clarity, internal coherence, and predictive power over neutrality.

  ### Step 1: Brainstorming Candidate Diagnoses
  1. **Verbal Dispute?**  
     *Why it doesn’t fit*: The disagreement isn’t about definitions alone. Bratman’s "interlocking individual attitudes" and Gilbert’s "plural subject" posit fundamentally different *kinds* of entities (psychological states vs. deontic relations). They agree on *when* joint action occurs (e.g., successful pair programming) but not *what constitutes it* ontologically.  
     *Why it partially fits*: Some surface disagreements (e.g., "Is a we-intention reducible?") might stem from differing uses of "intention" or "collective." But core commitments diverge.

  2. **Substantive but Underdetermined by Evidence?**  
     *Fits strongly*: All sides agree on behavioral outputs (e.g., two people moving a piano together). The dispute is about the *underlying structure* (individual minds vs. emergent entities). No conceivable observation *directly* adjudicates between "irreducible we-intention in individual heads" (Searle) and "plural subject as sui generis" (Gilbert). Developmental evidence (e.g., children’s joint attention) is interpreted through prior commitments.

  3. **Two Different Projects Under One Label?**  
     **Fits best** (see below). Bratman/Searle focus on the *metaphysics of mind*: "What cognitive states enable joint action?" Gilbert focuses on the *normative ontology*: "What creates obligations/entitlements in shared activities?" Tuomela straddles both but insists the we-mode is distinct. Your "asymmetry" observation is key: each side neglects the other’s core explanandum.

  4. **Hidden Empirical/Formal Question?**  
     *Why it fits*: Team reasoning/game theory *could* formalize Bratman (e.g., correlated equilibria) or Gilbert (normative solution concepts), but these models *presuppose* what counts as "individual" or "collective" agency. They relocate, not resolve, the dispute.  
     *Why it doesn’t fully fit*: No formal or empirical result forces abandonment of core positions (e.g., Gilbert can still claim game theory misses obligations).

  5. **Ill-Posed Question?**  
     *Doesn’t fit*: "What is joint intention?" is coherent. The dispute arises from legitimate but incompatible intuitions: individualism (no spooky group minds) vs. phenomenology/normativity (joint action *feels* unitary/binding).

  6. **Genuinely Hard Problem?**  
     *Fits*: The tension between irreducibility and individualism is real. But "hard" doesn’t mean insoluble—it might require reconceptualization.

  ### Step 2: Committed Diagnosis  
  **Primary: Two Projects Under One Label** (metaphysics of mind vs. normativity).  
  **Secondary: Substantive but Underdetermined** (due to the project split, evidence is interpreted through prior frameworks).  

  **Why your hypothesis is largely correct but needs sharpening**:  
  - You’re right that they agree on concrete cases (e.g., pair programming counts as joint action).  
  - You’re right about the asymmetry: Bratman owes *normativity*, Gilbert owes *cognitive implementation*.  
  - **Where you’re half-right**: It’s not *just* about "where to start" (individual vs. collective). Gilbert’s plural subject *is* intended as a real ontological commitment, not just a description. But crucially, her project is driven by explaining obligations ("You can’t quit pair programming without my agreement"), while Bratman’s is driven by cognitive naturalism ("How can brains do this?").  
  - **The core tension**: All accept:  
    (A) We-attitudes ≠ aggregate I-attitudes + mutual belief.  
    (B) All intentionality is individual-based (no group minds).  
    Gilbert bends (B) by making the "plural subject" a deontic entity *created by* individuals but irreducible to their psychology. Bratman/Searle bend (A) by making we-intentions *individual states* with unique functional roles.  

  ### Step 3: Test the Diagnosis with Concrete Cases  
  **Case 1: Pair Programming the Gnarly Refactor**  
  - **Bratman/Searle**: "Joint action. You each have responsive, interlocking intentions (Bratman) or primitive we-intentions (Searle) to refactor *together*. Obligations? Just shared expectations from planning."  
  - **Gilbert/Tuomela**: "Joint action. A plural subject is formed via joint commitment (Gilbert) or we-mode attitude (Tuomela). Obligations arise: you owe each other continued participation."  
  - **Diagnostic Prediction**: **Agreement on joint action, disagreement on why it’s binding**. Bratman sees "feeling bound" as psychological (e.g., regret if you bail); Gilbert sees it as normative (you violate an obligation).  

  **Case 2: Infant Pointing (Declarative: Sharing Attention)**  
  - **Bratman/Searle**: "Proto-joint action. Infant has a we-intention to share attention, but lacks full planning/meshing subplans (Bratman) or is exercising a primitive capacity (Searle)."  
  - **Gilbert/Tuomela**: "Not full joint action. No joint commitment (Gilbert) or we-mode (Tuomela)—infant can’t grasp obligations. It’s individual expression + response."  
  - **Diagnostic Prediction**: **Disagreement!** Normativists demand obligation-capacity; cognitivists don’t. This exposes the project split: Gilbert’s norms require richer cognition.  

  **Case 3: Chimps Pulling Ropes for Food (Instrumental Cooperation)**  
  - **Bratman/Searle**: "Not joint action. Mutual responsiveness but no shared intention—just parallel individual goals with mutual belief."  
  - **Gilbert/Tuomela**: "Not joint action. No joint commitment/we-mode—chimps lack normative understanding."  
  - **Empirical Camp (e.g., Tomasello)**: "Functional coordination, not shared intentionality."  
  - **Diagnostic Prediction**: **Agreement on classification, but for different reasons**. Cognitivists cite missing mental states; normativists cite missing obligations.  

  **Verdict**: The diagnosis **predicts disagreements in edge cases** (e.g., infant pointing) where normativity/cognition is ambiguous. Where both camps agree (chimps, functional adult cases), the dispute *is* idle for practical purposes—but philosophically, it reflects divergent explanatory goals.  

  ### Step 4: Paths for Progress  
  **What *Wouldn’t* Break the Stalemate**:  
  - More behavioral evidence (e.g., fMRI during pair programming). It would be interpreted through existing frameworks.  
  - Game-theoretic models (e.g., team reasoning). They formalize *choices*, not ontology (e.g., Gilbert rejects "team reasoning" as individualistic).  

  **What *Could* Help**:  
  1. **Change the Question**: Shift from "What *is* joint intention?" to:  
     - **Descriptive**: "What cognitive/neural mechanisms enable humans to act jointly?" (favors Bratman/Searle).  
     - **Normative**: "How do obligations arise in collective action, and what sustains them?" (favors Gilbert).  
     This admits the projects are distinct but complementary.  

  2. **A New Distinction**: Separate *joint action* (causal coordination) from *joint commitment* (normative structure). Much "disagreement" vanishes if we concede Bratman explains the former, Gilbert the latter. Your pair programming involves both.  

  3. **Formal + Empirical Synthesis**:  
     - Use developmental evidence: If children *act jointly* (Bratman) *before* understanding obligations (Gilbert), it challenges normativists.  
     - If obligations emerge only with specific cognitive capacities (e.g., theory of mind), it supports Gilbert’s demand for normativity but roots it in psychology.  

  4. **Radical Reconceptualization**: Treat "we-intentionality" as a *biological capacity* (like vision) rather than a puzzle to reduce. Searle gestures at this, but it needs fleshing out.  

  **Honest Answer**: Progress is possible, but **the metaphysical rift won’t close**. Why? The intuitions are too entrenched:  
  - Individualists won’t accept Gilbert’s "plural subject" as anything but metaphorical.  
  - Normativists won’t accept Bratman’s obligations as mere "expectations."  
  The most realistic path is clarifying the *division of labor*: cognitive accounts explain *how we coordinate*, normative accounts explain *why it binds us*. Your pair programming example *needs both*—but insisting they reduce to one framework is the stalemate’s engine.  

  ### In Summary  
  Your hypothesis is 80% correct: The dispute persists because the sides are answering different questions (mind vs. normativity) while talking past each other’s core challenge (bindingness vs. ontology). The stalemate is stable because neither can fully address the other’s concerns without abandoning their foundational commitments. Progress lies in disentangling the questions, not forcing a winner.
