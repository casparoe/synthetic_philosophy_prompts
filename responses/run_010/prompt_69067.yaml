  Looking at the dispute: Bratman focuses on interlocking intentions without collective primitives. Tuomela's we-mode is irreducible. Searle sees we-intentions as primitive but individual. Gilbert introduces plural subjects with obligations. The user is right that they all reject reduction to I-intentions plus mutual belief, yet insist intentionality is individual-based. The tension is between irreducibility and individualism.

  Diagnosing the stalemate: It's not a verbal dispute because terms like "intention" are used consistently. It's substantive but underdetermined; behavioral evidence (like kids vs. apes) doesn't resolve the metaphysical question. The user's "two projects" idea fits: Bratman/Searle do descriptive metaphysics, while Gilbert addresses normativity. Each side attacks the other's weakness: Bratman's lack of normativity, Gilbert's mysterious plural subject.

