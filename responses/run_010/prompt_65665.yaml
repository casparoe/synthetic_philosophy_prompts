  Here's the scene: A sparse funeral parlor. One coffin labeled "Theory T". A **Popperian** (stiff collar) and **Lakatosian** (adjusting thick glasses) stand over it.

  **Popperian:** (Solemnly taps coffin) "There it lies. The crucial experiment struck *here*. Modus tollens demands it: Theory T is falsified. Dead and buried."
  **Lakatosian:** (Peers intently) "Dead? Don't be hasty. Look closer – the blow landed *there*." (Points *past* the coffin to a sign reading "Aux. Hypotheses & Initial Conditions").
  **Popperian:** "But the core prediction failed!"
  **Lakatosian:** "Precisely! A protective belt adjustment *redirected* your tollens beautifully. See? The hard core..." (Taps his own temple) "...remains unfalsified. Untouchable."
  **Popperian:** "So why the funeral?"
  **Lakatosian:** (Leans in conspiratorially) "Shh. We need *apparent* interment. Only when a rival program demonstrates a *progressive problemshift*..." (Nods towards an empty plot labeled "Waiting for Replacement") "...will this coffin *actually* need a body. Until then? Merely... restructuring."

  **Punchline:** The Lakatosian isn't mourning the theory's death, but strategically staging its *apparent* burial to buy time for the core, waiting only for a superior rival to force a *real* funeral via progressive problemshift. The coffin is empty because the core isn't dead yet – the falsification was absorbed by the protective belt.
