  *   **Wound 1 (Thermostats / No Gap):** Answered *partially*. Nadia's distinction (near-duplicates running *similar* not *identical* algorithms) creates a potential gap where her choice *could* be evidence for theirs, undermining the pure "automatic thermostat" analogy. However, Elias successfully forced her to abandon the "exact duplicate" premise where Wound 1 landed perfectly.
