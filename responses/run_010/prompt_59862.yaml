  Hmm, the user is asking me to create a procedure for tagging simulation library components as either CONSTRAINT or CORRELATION. They're a tech lead in engineering certification work dealing with structural and aero-thermal simulations. The current method relies on seniority, which is subjective and unreliable. They want a systematic approach grounded in philosophy of science, specifically the metaphysics of laws versus accidental regularities.

  The user clearly understands both engineering and philosophy. They reference Humean vs anti-Humean views on laws of nature - Humeans focusing on systematization (simplicity vs strength), anti-Humeans emphasizing governing power and counterfactual support. The core agreement is that mere empirical fit doesn't make something lawlike. This maps directly to their CONSTRAINT vs CORRELATION distinction.

  They've outlined several challenging cases that break naive approaches:
  - Unfitted principles derived from symmetry/conservation
  - Perfect fits that aren't simpler than lookup tables
  - Artifact-specific relations
  - Statistical distributions rather than equations
  - Previously tagged constraints that later fail

  I need to develop a step-by-step procedure that:
  - Takes about 45 minutes per candidate
  - Is usable by engineers without philosophy background
  - Produces a tag with one-line justification and evidence needed to change it
  - Handles their edge cases
  - Explicitly marks judgment calls disguised as procedures

  Then test it on three examples:
  1. Re-entry capsule drag fit (good fit but no data beyond Mach 8)
  2. Momentum conservation (always holds but fails with coarse mesh)
  3. Grain-size vs yield-strength (holds for specific supplier only)

  Finally, I need to assess:
  - What the procedure can't handle
  - Whether the Humean/anti-Humean debate actually affects tags
  - My confidence level and weakest point

  For the procedure structure, I'm considering a flowchart-like sequence of yes/no questions progressing from strongest to weakest lawlike indicators. Each step should have clear pass/fail criteria and evidence thresholds. The goal is to escalate candidates to CONSTRAINT only when multiple independent lines of evidence converge.

  Key principles to embed:
  1. Extrapolation capacity is the ultimate test (counterfactual support)
  2. Theoretical grounding matters more than fit quality
  3. Domain independence is crucial
  4. Simplicity must be balanced against strength
  5. All claims are provisional

  For the edge cases:
  - Symmetry arguments should pass early (strong theoretical basis)
  - Beautiful fits without simplicity fail (lookup tables aren't laws)
  - Artifact-specific relations fail (no domain independence)
  - Distributions need special handling (require probabilistic axioms)
  - Failed constraints trigger re-evaluation (demote to CORRELATION)

  On the philosophical debate: While the framing is useful, in practice the procedure will likely yield the same tags regardless of metaphysical stance. The anti-Humean "governing" aspect is operationalized through counterfactual tests and theoretical embeddedness.

  The grain-size example will be the hated answer - it must be CORRELATION despite long history, due to narrow domain.

  Weakest point: Handling cases where theoretical derivations contain approximations - how much idealization invalidates the lawlike claim? This shows up in the momentum conservation case with mesh dependency.
answer: |-
  Below is a procedure for tagging candidate relations as CONSTRAINT or CORRELATION, grounded in the metaphysics of laws (specifically, the distinction between *lawlike generalizations* and *accidental regularities*). It operationalizes philosophical criteria (simplicity, strength, counterfactual support, theoretical embeddedness) into engineer-accessible steps. The procedure **explicitly rejects "goodness of fit" as sufficient for CONSTRAINT**, per the core philosophical agreement.

  **Procedure: Lawlike Status Assessment (45-min max per candidate)**  
  *Output: Tag (CONSTRAINT/CORRELATION) + 1-line justification + Evidence required to change tag*  
  *Format: Ordered checklist. Stop at first definitive result. Default: CORRELATION.*

  ---

  ### Step 1: **Is it analytically derived from fundamental symmetries/conservation laws?**  
  *Purpose: Captures non-empirical, necessary truths (e.g., Noether's theorem).*  
  - **Pass**: Direct mathematical derivation from universally accepted physical laws (e.g., momentum conservation from spatial symmetry).  
  - **Evidence threshold**: Documentation showing ≤3 logical steps from fundamental law.  
  - **Result**: **CONSTRAINT** (justification: *"Fundamental symmetry/conservation law"*).  
  - **Change tag if**: Derivation is invalidated (e.g., new physics disproves symmetry).  
  - *Judgment call*: Assessing "directness" of derivation. Reject approximations.  

  ### Step 2: **Is it theoretically embedded with domain-independent mechanisms?**  
  *Purpose: Anti-Humean "governing" test. Laws are embedded in causal/nomological structures.*  
  - **Pass**: Mechanistic explanation exists (e.g., drag model based on continuum mechanics), AND it applies to materials/domains beyond test data.  
  - **Evidence threshold**: Peer-reviewed theory + validation in ≥2 distinct physical contexts (e.g., different fluids/alloys).  
  - **Result**: **CONSTRAINT** (justification: *"Mechanistic, domain-independent theory"*).  
  - **Change tag if**: Failure in a new domain disproves mechanism.  
  - *Judgment call*: Defining "distinct" contexts (e.g., two alloys from same supplier ≠ distinct).  

  ### Step 3: **Does it support robust extrapolation & counterfactuals?**  
  *Purpose: Humean "best system" simplicity + anti-Humean counterfactual support.*  
  - **Pass**: (A) Predicts *novel* phenomena/data outside training range (not merely smooth extrapolation), AND (B) Simpler than a lookup table (e.g., ≤5 fitted parameters).  
  - **Evidence threshold**: (A) ≥3 successful predictions in untested regimes; (B) Parameter count ≤ data points/10.  
  - **Result**: **CONSTRAINT** (justification: *"Predicts novel data with parsimony"*).  
  - **Change tag if**: Extrapolation failure OR simpler model emerges.  
  - *Judgment call*: Defining "novel" (slight range extension ≠ novel).  

  ### Step 4: **Is it probabilistic with well-defined scope?**  
  *Purpose: Handles scatter/distributions (probabilistic "laws" require bounded axioms).*  
  - **Pass**: Distribution form is theoretically justified (e.g., Weibull for fatigue), AND bounds are empirically quantified.  
  - **Evidence threshold**: Theoretical basis + ≥100 data points defining scatter.  
  - **Result**: **CORRELATION** (justification: *"Probabilistic within defined bounds"*). *Note: Distributions rarely qualify as CONSTRAINT.*  
  - **Change tag if**: Scatter exceeds bounds or new theory enables deterministic constraint.  

  ### Step 5: **Default**  
  - **Result**: **CORRELATION** (justification: *"Empirical fit without lawlike properties"*).  
  - **Change tag if**: New evidence satisfies Step 1–3.  

  ### Special Case: **Re-tagging after CONSTRAINT failure**  
  - If a CONSTRAINT fails new data/theory: Immediately demote to **CORRELATION**.  
  - Justification: *"Empirically invalid outside original domain"*.  
  - To regain CONSTRAINT: Must pass **Step 2 or 3** with new evidence.  

  ---

  ### Test Cases  
  1. **Re-entry capsule drag fit** (R²=0.998, Mach 2–8, smooth past Mach 8)  
     - Fails Step 1 (not fundamental). Fails Step 2 (no validation beyond capsule geometry). Fails Step 3: Extrapolation isn't "novel" (smoothness ≠ prediction), and it lacks new data. **Result: CORRELATION** (justification: *"Empirical fit, untested extrapolation"*).  
     - *Change tag if*: Validated on novel vehicle shapes past Mach 8.  
     - **Why you'll hate this**: Beautiful fit and physical motivation aren't enough.  

  2. **Momentum conservation** (violated with coarse mesh)  
     - Passes Step 1: Derived from spatial symmetry. **Result: CONSTRAINT** (justification: *"Fundamental conservation law"*).  
     - *Change tag if*: Physics itself disproved (not numerical errors).  
     - **Critical note**: Numerical violations are *implementation issues*, not law failures. Tag the *physical principle*, not the solver implementation.  

  3. **Grain-size vs. yield-strength** (one supplier, two alloys)  
     - Fails Step 1–2 (no theory, single supplier). Fails Step 3 (no novel predictions). **Result: CORRELATION** (justification: *"Supplier-specific empirical relation"*).  
     - *Change tag if*: Validated across ≥3 suppliers with mechanistic theory.  

  ---

  ### What the Procedure Can't Do  
  1. **Resolve "tie-breakers"**: If Steps 2/3 are ambiguous (e.g., partial theory + weak extrapolation), it defaults to CORRELATION. Humans must judge.  
  2. **Handle emergent phenomena**: No clear fundamental basis (e.g., turbulence). Likely CORRELATION.  
  3. **Replace domain expertise**: Some judgments (e.g., "distinct contexts") need material scientists.  
  4. **Fix bad data**: Garbage in, garbage out.  

  ### Philosophy Decoration?  
  - **The Humean/anti-Humean fight changes nothing in practice here**. Both camps agree on the operational criteria:  
    - Simplicity (Humean) ≈ parameter parsimony in Steps 1/3.  
    - Governing/counterfactuals (anti-Humean) ≈ extrapolation in Step 3.  
  - **Only if anti-Humeanism demanded *non-empirical necessity* (e.g., Lange's "nomic stability") would it change tags**—but that's untestable in engineering. Your procedure is pragmatically Humean.  

  ### Confidence & Weak Points  
  - **High confidence** that:  
    - Philosophical criteria prevent overreach (e.g., tagging CORRELATION for supplier-specific relations).  
    - The procedure is load-bearing: It replaces seniority with falsifiable tests.  
  - **Lowest confidence**: Step 2 ("domain-independence"). Defining "distinct contexts" is highly subjective (e.g., are two aluminum alloys distinct if processed differently?). This could be gamed. Mitigation: Require explicit reviewer justification for "distinctness."  

  **Final Output Format** (for reviewers):  
  ```  
  Candidate: [Name]  
  Tag: [CONSTRAINT/CORRELATION]  
  Justification: [One line from procedure]  
  Change if: [Specific evidence from procedure]  
  ```  
  Reviewers sign off after running the checklist. Time: ~30–45 min/candidate after training.
