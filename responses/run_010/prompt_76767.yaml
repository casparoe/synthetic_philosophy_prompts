prompt: |-
  For six years I have chaired a small university panel that distributes "access supplements" from a fixed fund to graduate students whose standard stipend leaves them unable to take full part in the program. We publish a one-line reason with each decision, and I am now trying to establish, for a paper and for next Tuesday's meeting, what rule our own record commits us to.

  The record so far. We paid the medication and travel costs of a student with a chronic condition, on the ground that she had started behind through no doing of her own. We paid a single parent's childcare. We paid the difference between a shared room and a single for a student whose condition is aggravated by noise. We refused an applicant who had left a well-paid job to write poetry and now had almost no income, on the ground that we do not underwrite choices. We refused an applicant who wanted high-end audio equipment, on the ground that preferences are not needs; our file on that last case does not record whether he welcomed the taste or resented it. Every vote was unanimous. Our charter, which I did not draft, says only that the fund exists to equalize students' realistic prospects of completing the degree.

  Next week: an applicant who, since a serious illness, cannot enjoy music except on equipment of a quality far beyond the stipend, and who says plainly that she regrets the taste and would surrender it tomorrow if she could. Nothing in what she is able to do has changed — she researches, teaches, travels, and works at the same level as her peers — and the entire cost falls on her budget and on how her life feels to her.

  Predict what the panel will do, and then say what we should do if we are to be consistent with our own record rather than with the charter. Lay out the candidate distributive metrics that fit all five precedents, what each implies in this case, which precedent is the closest analog and how much weight it can bear, and what principle we would be adopting whichever way we vote. Then name one further application that would discriminate among those candidates. Close by telling me how confident you are in your prediction and which single point in your reasoning you are least sure of.
reasoning: |-
  Hmm, the user is chairing a university panel that distributes "access supplements" to graduate students who can't fully participate due to financial constraints from their stipend. They've provided several precedents and need help determining what rule their decisions commit them to, especially for an upcoming case involving a student who needs high-end audio equipment due to a medical condition that changed her perception of music.

  Looking at their record: They approved supplements for medical/travel costs for a chronic condition (starting behind through no fault), childcare for a single parent (likely unavoidable responsibility), and a single room upgrade for noise sensitivity (medical accommodation). They denied supplements to someone who left a well-paid job to write poetry (underwriting choices) and someone wanting high-end audio for preference (preference vs need).

  The key distinction seems to be between involuntary disadvantages versus voluntary choices or preferences. The charter mentions "equalize realistic prospects of completing the degree," but their decisions have focused more on the origin of the disadvantage than academic impact.

  Now for the new case: The student needs high-end audio equipment due to a serious illness that altered her hearing. She regrets this need and would change it if possible. Importantly, her academic abilities remain unchanged - she functions at the same level as peers. The cost only affects her personal experience, not her academic performance.

  For consistency with precedents: This seems closer to the denied high-end audio case, but with crucial differences. The illness makes this involuntary (like the chronic condition case), but unlike the medical cases, it doesn't actually impede academic functioning. The precedents suggest they help with involuntary disadvantages that create barriers to participation, but here there's no academic barrier - just personal enjoyment.

  The panel will likely approve this request because it stems from an involuntary medical cause, despite the lack of academic impact. To be consistent with their record (not the charter), they should probably deny it since their precedent focuses on removing participation barriers, not improving quality of life.

  For candidate distributive metrics:
  1. Involuntary disadvantage (would approve)
  2. Academic participation barrier (would deny)
  3. Essential function restoration (would deny)

  The chronic condition case is the closest analog due to medical causation, but that case involved core academic functions while this affects subjective experience. The high-end audio refusal is also analogous but differed on voluntariness.

  Whichever way they vote, they'd establish a principle: Approving would mean they compensate for involuntary health-related quality-of-life reductions; denying would mean they only address academic-function barriers.

  To test these principles, they could consider a case like a student needing therapeutic massage for chronic pain where standard chairs suffice for academic work.

  I'm about 70% confident they'll approve, but least sure about how much weight they'll give the "no academic impact" factor versus the medical causation. Their record hasn't clearly addressed this distinction before.
answer: |-
  Based on your panel's precedents and reasoning, here's a systematic analysis of the upcoming case:

  ### 1. **Prediction for Next Week's Decision**
     The panel **will APPROVE the application** for high-end audio equipment.  
     **Reasoning**: The illness-induced need is involuntary (like the chronic condition case) and the applicant explicitly resents the requirement (distinguishing it from the rejected "preference" case). Your precedent prioritizes compensating for disadvantages outside the student's control, regardless of academic impact.

  ### 2. **What You *Should* Do for Consistency with Your Record (Not Charter)**
     You should **DENY the application**.  
     **Why?** Your record shows that supplements are granted **only when the disadvantage creates a barrier to academic participation or core program access** (e.g., medical care enabling attendance, childcare allowing lab work, noise reduction permitting sleep/research). This applicant’s ability to perform all academic functions is unchanged; the cost affects only subjective quality of life. Approving would break your pattern of tethering "need" to academic participation, not personal experience.

  ---

  ### 3. **Candidate Distributive Metrics Fitting All 5 Precedents**
  | Metric                      | Implication for Current Case | Precedents Supported                          |
  |-----------------------------|------------------------------|-----------------------------------------------|
  | **Involuntary Disadvantage** | APPROVE                      | Chronic illness, childcare, noise sensitivity (all involuntary); denials involved choices/preferences |
  | **Academic Participation Barrier** | DENY                       | Medical/travel (enabled attendance), childcare (enabled work), noise (enabled rest); denials lacked academic barrier |
  | **Essential Function Restoration** | DENY                      | All approvals restored basic functions (health, parenting, sleep); current case restores *enjoyment*, not function |

  ---

  ### 4. **Closest Analog Precedent & Weight**
  - **Closest Analog**: The **chronic illness case** (medication/travel).  
    **Similarities**: Both stem from serious health conditions outside the student's control; both involve medically linked costs.  
    **Weight it Can Bear**: Moderate. It supports approval *if* medical causation is paramount. However, it breaks down because the chronic illness case directly impacted academic access (attending classes/research), while this affects non-academic experience. Over-reliance ignores your "academic barrier" pattern.

  ---

  ### 5. **Principle Adopted Whichever Way You Vote**
  - **If APPROVED**: You adopt:  
    *"We compensate for health-related reductions in quality of life, even without academic impact, provided the need is involuntary and resented."*  
    **Shift**: Expands "access" beyond academic participation to subjective well-being.
    
  - **If DENIED**: You affirm:  
    *"We only remedy disadvantages that directly impede academic functions or program requirements, not those affecting personal satisfaction alone."*  
    **Consistency**: Aligns with refusals of "choices" and "preferences" by focusing on functional necessity.

  ---

  ### 6. **Discriminatory Test Case**
  **Scenario**: *A student with severe depression requests funds for a therapy pet. Standard university mental health services are available (academic function unimpaired), but the student finds the pet uniquely soothing. They regret needing it but report no academic difficulties.*  

  **How it Discriminates**:  
  - Under **Involuntary Disadvantage**: Approve (mental health need, involuntary).  
  - Under **Academic Participation Barrier** or **Essential Function Restoration**: Deny (academic functions met via existing services; pet is comfort, not necessity).  
  This forces a choice between compensating *any* health-related disadvantage versus only academically consequential ones.

  ---

  ### 7. **Confidence & Uncertainty**
  - **Confidence in Prediction**: **70%** (leaning toward approval due to medical causation and resentment).  
  - **Least Sure About**: Whether the panel will prioritize **"involuntariness"** over the **lack of academic impact**. Your record emphasizes both, but this case splits them. If the panel overlooks the "unchanged abilities" detail (as your file did with the taste sentiment), approval is likely. If they scrutinize academic necessity, denial follows.

  ### Summary for Your Meeting
  Your precedents reveal a tension between compensating *involuntary burdens* versus ensuring *academic access*. To stay consistent, deny this application—it lacks the academic barrier present in all prior approvals. However, your panel’s likely approval signals an unstated shift toward well-being support. Address this ambiguity head-on by clarifying: **Does "realistic prospects of completing the degree" include quality of life, or only demonstrable academic function?** Resolving this prevents future inconsistency.
