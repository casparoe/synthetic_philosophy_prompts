answer: |-
  ### 1. What each proposal gives up  
  - **(i) Non-factualism**: Abandons truth conditions entirely, treating conditionals as non-propositional expressions governed solely by credal norms. This forfeits logical embeddability (D1) but preserves Adams' thesis (D2) as a universal constraint.  
  - **(ii) Scope restriction**: Accepts D1 but restricts Adams' thesis to the agent's *actual* credence function, refusing to extend it to hypothetical conditionalizations. This weakens D2 to a local, non-general principle.  
  - **(iii) Shifting semantics**: Preserves D1 by assigning truth conditions, but makes the proposition expressed by "if A, B" *credence-dependent*. Adams' thesis holds generally (D2), but only relative to the credal state that fixed the proposition.  
  - **(iv) Epsilon-Adamsianism**: Retains invariant truth conditions (D1) but relaxes Adams' thesis to an approximate equality (credence ≈ conditional credence ± ε). This sacrifices *exact* generality (D2) while aiming for near-equivalence.  

  ### 2. Scores  
  | Proposal          | D1 (0–5) | D2 (0–5) | Rescue (0–10) | **Sum** |  
  |-------------------|----------|----------|---------------|---------|  
  | (i) Non-factualism | 0        | 5        | 2             | **7**   |  
  | (ii) Scope restriction | 5        | 1        | 3             | **9**   |  
  | (iii) Shifting semantics | 4        | 4        | 7             | **15**  |  
  | (iv) Epsilon-Adamsianism | 5        | 2        | 4             | **11**  |  

  *Rescue*: How well the proposal mitigates joint failure of D1/D2 (e.g., preserving core functions of Adams' thesis despite concessions).  

  ### 3. Ranking and Reasoning  
  **1. (iii) Shifting semantics** (Sum: 15)  
  Scores best by *balancing* D1 and D2. It secures embeddability (D1) via dynamic propositions and upholds a generalized Adams' thesis (D2) by indexing truth conditions to credal states. The cost is context-relativity in propositional content, but this avoids Lewisian collapse while allowing logic to operate within fixed contexts. Rescue is high: inferences relying on conditional credences (e.g., rational decision-making) remain licensed.  

  **2. (iv) Epsilon-Adamsianism** (Sum: 11)  
  Retains robust D1 (invariant truth conditions) but critically weakens D2. While ε-margin blocks Lewis’s proof, slack *compounds* under iteration/embedding: e.g., credence in *(if A, B) ∧ (if C, D)* could diverge from joint conditional credences by ~2ε, and negation/quantification exacerbate errors. D2’s "genuine generality" is lost: the constraint becomes approximate and contextually variable. Rescue is modest (4/10): useful for simple conditionals, but unreliable for complex embeddings or high-stakes logic.  

  **3. (ii) Scope restriction** (Sum: 9)  
  Maximizes D1 but cripples D2 (score 1). By limiting Adams' thesis to the *actual* credence function, it rejects the core generality needed for normative/rational foundations (e.g., it cannot assess counterfactual credal states). Rescue (3/10) is minimal: it technically "saves" Adams’ thesis for static agents but voids its role in justifying rational norms across contexts.  

  **4. (i) Non-factualism** (Sum: 7)  
  Sacrifices D1 entirely (no embeddability) to save D2 perfectly. This forfeits logical evaluation of compounds (e.g., *¬(if A, B)* is meaningless) and forces a non-standard semantics. Rescue (2/10) is low: while credence inferences *about* conditionals work, the cost to truth-conditional logic is prohibitive for a dissertation prioritizing embeddability.  

  ### 4. Fragility  
  The ranking is most vulnerable to **embedding complexity demands**. If your dissertation emphasizes *iterated or embedded conditionals* (e.g., "If A, then if B, C"), (iv) plummets: compounding ε-slack rapidly erodes D2’s residual strength, potentially swapping places with (ii). Conversely, if D2’s generality is prioritized over complex logic, (i) rises above (ii). Shifting semantics (iii) remains robust unless invariant logical form is non-negotiable.
