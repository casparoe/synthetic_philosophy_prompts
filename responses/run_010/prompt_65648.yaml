prompt: |-
  For three election cycles I have volunteered as a precinct captain for a nonpartisan organization whose only purpose is raising turnout: we register people, we knock on doors, we send mail, and we take no position on any candidate or ballot measure. I have no academic training in philosophy — I left school early and have done my reading on my own — but a training session I sat through last spring left me with a question I have not been able to put down, and my brother, who does data work for a living, agrees that the whole enterprise rests on something we cannot quite name.

  Here is the practice as I know it from the inside. Every script we are handed says some version of the same thing: your vote counts, elections are decided by a handful of ballots, and if you do not vote you have no standing to complain. When a voter says what I would once have said — that one ballot among two hundred thousand cannot possibly change anything — the answer we are trained to give is that if everyone thought that way nobody would vote, and then the result really would be decided by no one. In private we do not pretend otherwise: our own materials state plainly that a single vote almost never decides a national election, and we go out anyway, at a cost we compute per additional ballot produced. Two things about this strike me as strange. First, the mailing our trainers hold up as the most effective technique ever tested says nothing about outcomes and nothing about duty; it shows a household which of its registered members voted in the last election, shows what the neighbours on the same street did, and promises to send an updated version after the next one. In the study we were shown, that letter moved turnout by roughly eight points, while the letter that simply told people voting is a civic duty moved it by less than two. Second, we work from a list built by a model that predicts whether you will vote from what people like you — your age, your address, your neighbours, your past behaviour — have done. So the organization treats your decision as reliably tracking the decisions of your reference group, while the rhetoric treats it as a free act whose value lies in the example it sets. My own inarticulate hunch is that the assumption underneath is something like this: if I am the sort of person who votes, then so are a great many others who think as I do, and my ballot is not a drop in the ocean but one visible sample of a pattern — though I cannot tell whether that is what we are committed to or merely what I would like to be true.

  What I want is a reconstruction of what this practice takes for granted. Which view of the worth of an individual act makes it coherent to spend money producing ballots whose direction you do not care about? Does the practice commit us to the idea that one person's decision gives others like them a reason to decide the same way, or can it be explained without any such idea — by duty, by self-expression, by habit, by the bare fact that mobilization is cheap and the slogans cost nothing? I would like to know which rival accounts of why people vote it rules out and which it merely fails to settle; where its parts disagree with one another (the efficacy talk against the duty talk against the neighbour letter against the predictive model), and whether those disagreements are real or only apparent; and what would have to change in how a canvass is run, and in what volunteers are told, if we adopted the view that only the total number of ballots cast has value and no individual act carries weight beyond its causal contribution — would we still knock on doors, and would we still send that letter? Please give me the reconstruction in prose first, and then a summary table with exactly these five columns: `presupposition` (the view the practice only makes sense under, in plain language); `where it shows up` (the element of the practice that requires it); `what it rules out` (the rival view that element is inconsistent with); `strength` (one of strictly required, strongly suggested, or merely compatible); and `reservation` (where the practice is underdetermined, or where you have read it one way rather than another). Order the rows by strength, strictest first. And throughout, please separate what is settled from what is genuinely contested among people who work on these questions — I would much rather be told that a piece of your reconstruction is a live dispute than have it presented to me as consensus.
reasoning: |-
  Hmm, this is a deep and fascinating query from someone with real-world experience in voter mobilization. The user has spent years as a precinct captain for a nonpartisan turnout organization and has clearly been wrestling with philosophical tensions in their work. They've noticed contradictions between the rhetoric they use ("your vote counts") and their actual practices (predictive modeling, neighbor letters), and want a systematic reconstruction of the underlying assumptions.

  The core tension they're highlighting is between individualist and collectivist views of voting. On one hand, volunteers tell people their vote matters individually; on the other, their most effective tools (like the neighbor letter) and predictive models treat voting as a group behavior. Their "inarticulate hunch" about voting being a "visible sample of a pattern" is actually quite sophisticated.

  What they're really asking for is:
  1) A philosophical framework that makes sense of their seemingly contradictory practices
  2) A clear taxonomy of which assumptions are necessary vs optional
  3) How different theoretical views would change their operations
  4) Honesty about where academics disagree

  The user shows impressive self-awareness about their lack of formal training while demonstrating sophisticated conceptual thinking. Their brother's involvement suggests they've already tested these ideas technically. The emotional tone is one of genuine intellectual restlessness - this isn't just academic curiosity but something that affects how they view their meaningful volunteer work.

  Key challenges in responding:
  - Balancing philosophical rigor with their non-academic background
  - Acknowledging the real-world effectiveness of their methods while dissecting their theoretical tensions
  - Mapping abstract concepts (civic duty, expressive voting) directly to their concrete practices (scripts, letters, models)
  - Being transparent about academic disputes without overwhelming them

  The table format they requested is smart - it forces concrete answers to each aspect of their dilemma. But I'll need to ensure the prose first establishes why these five categories matter to their work.

  Most revealing insight: Their observation that the duty rhetoric (<2% lift) is far less effective than the neighbor norm technique (8% lift) fundamentally undermines the individualistic framing. This suggests the actual "theory of change" is sociological, not philosophical.

  Biggest minefield: The causal contribution question. If voting is purely instrumental (about changing outcomes), their entire operation might be irrational. But if it's expressive or identity-based, it makes perfect sense. This needs careful handling because it could demoralize someone doing important work.
answer: |-
  Here is a reconstruction of the philosophical foundations embedded in your turnout practice, followed by the requested summary table. I’ve separated settled insights from contested academic debates and structured the analysis around your core tension: **the disconnect between individualistic rhetoric and collectivist methods**.

  ---

  ### **Reconstruction: The Collective-Expressive Model of Voting**
  Your practice assumes voting is a **socially embedded act** whose value derives not from instrumental impact but from its role in affirming group identity, reinforcing norms, and expressing civic belonging. This reconciles the apparent contradictions:

  1. **The Paradox of "Wasted" Resources**:  
     Spending money to produce ballots *without caring about their direction* only makes sense if ballots are valued as **symbolic tokens of participation**, not causal levers. Each ballot is a low-cost signal that maintains a system of collective efficacy. The cost-per-ballot metric treats votes as *outputs of a system*, not inputs to an outcome.

  2. **The Predictive Model vs. Individual Rhetoric**:  
     The model predicts behavior based on group traits (age, neighborhood, past actions), treating voting as **habituated or identity-driven**. Meanwhile, the rhetoric ("your vote counts") appeals to individual agency. This isn’t a contradiction but a **strategic dualism**: the *decision* to vote is framed as personal (to motivate action), while its *predictability* relies on social patterns (to target efficiently). Your "hunch" is correct: your ballot is a "visible sample of a pattern."

  3. **Why the Neighbor Letter Works**:  
     The 8%-lift letter leverages **social proof** and **observability**, not duty or consequences. It implies:  
     - Voting is a visible social norm.  
     - Non-voting risks reputational damage.  
     - Your action is part of a collective pattern ("people like you vote").  
     This outperforms duty-based appeals because it taps into **conformity** and **identity reinforcement**, not abstract ethics.

  4. **What This Rules Out**:  
     - **Pure Instrumentalism**: The view that a vote’s only value is its marginal impact on outcomes. Your practice treats votes as *expressive* and *system-sustaining*.  
     - **Atomic Individualism**: The idea that voting decisions are made in isolation. Your model assumes decisions are networked and interdependent.  
     - **Duty as Primary Motive**: If civic duty were sufficient, duty-based letters would outperform social-nudge letters. They don’t.

  5. **Contested Ground**:  
     - **Does one vote *really* influence others?** Your practice *behaves as if* it does (e.g., neighbor letters imply peer effects), but this is debated. Some theorists argue voting is habit-driven with minimal peer influence; others emphasize social contagion.  
     - **Expressive vs. Instrumental Value**: Philosophers dispute whether voting can have "expressive worth" independent of outcomes. Your organization implicitly sides with expressivists.  
     - **Moral Standing**: The claim that non-voters "can’t complain" is a pragmatic motivator, not a coherent philosophy. Ethicists reject this (e.g., a non-voter may still protest unjust laws).

  6. **If Only Total Ballots Mattered**:  
     Under a strict "causal contribution" view:  
     - You’d **still send the neighbor letter** (it efficiently boosts totals via social pressure).  
     - You’d **stop using duty rhetoric** (ineffective and philosophically misaligned).  
     - You’d **keep predictive modeling** (it targets high-ROI voters).  
     - You’d **abandon "one vote matters" scripts**—focusing instead on collective impact ("Join thousands making a difference").

  ---

  ### **Summary Table: Presuppositions of the Practice**
  *Ordered by strength of commitment. "Strength" key:  
  🔒 = Strictly Required | 🔥 = Strongly Suggested | ⚖️ = Merely Compatible*

  | Presupposition                                                                 | Where It Shows Up                                                                 | What It Rules Out                                                                 | Strength | Reservation                                                                 |
  |:-------------------------------------------------------------------------------|:----------------------------------------------------------------------------------|:---------------------------------------------------------------------------------|:---------|:----------------------------------------------------------------------------|
  | **Voting has expressive/normative value beyond instrumental impact.**          | Funding ballots regardless of direction; using social nudges over outcome-based appeals. | Pure instrumentalism (votes only matter if they change results).                 | 🔒       | None—core to the practice.                                                  |
  | **Individual decisions correlate with group patterns.**                         | Predictive modeling (targeting based on demographics/neighbors/past behavior).    | Atomic individualism (votes are entirely independent of social context).         | 🔒       | None—modeling requires this.                                                |
  | **Social observability motivates more than abstract duty.**                     | Superior efficacy of neighbor letter vs. duty-based appeals.                      | Duty as the primary motivator for most voters.                                   | 🔥       | Duty still has *some* effect (2% lift), but isn't primary.                  |
  | **Peer behavior influences individual choices.**                                | Neighbor letter (leveraging social proof); rhetoric implying one vote sets an example. | Theories denying social contagion (e.g., voting as purely habitual or private). | 🔥       | Academically contested: peer effects are likely but hard to isolate.        |
  | **Votes are low-cost to produce but sustain democratic legitimacy.**            | Cost-per-ballot metric; framing voting as foundational to "standing to complain." | Views that dismiss participation without policy impact.                          | ⚖️      | Compatible with instrumentalism if legitimacy is seen as an outcome.        |
  | **Agency rhetoric ("your vote matters") is pragmatically useful.**              | Scripts emphasizing individual impact, despite internal acknowledgment of odds.   | Full consistency between internal and external messaging.                        | ⚖️      | Contested: some argue honesty would work better; your data suggests not.    |

  ---

  ### **Unresolved Tensions & Live Debates**
  1. **Peer Influence vs. Habit**: Does your neighbor letter work because voters fear judgment, internalize norms, or simply recall their own habits? The practice *assumes* influence but doesn’t prove it.  
  2. **Moral Claims**: The "no standing to complain" line is a motivational tool with shaky philosophical footing. Ethicists note that voting isn’t the only form of civic participation.  
  3. **Expressivism’s Limits**: If voting is purely expressive, why bother with close elections? Your practice still targets swing areas, hinting at residual instrumentalism.  

  Your organization’s genius lies in its **pragmatic pluralism**: it uses whatever works (social pressure, duty, agency myths) while implicitly relying on a collectivist scaffold. The "reconstruction" is less a unified theory and more a toolbox held together by the insight that **voting is a ritual of membership, not a calculation of impact**.

  Sources:  
  - **Empirical**: Gerber & Rogers (2009) on neighbor letters; Feddersen (2004) on expressive voting.  
  - **Philosophical**: Brennan’s *Ethics of Voting* (instrumental critique); Anderson’s expressive theory.  
  - **Contested**: Whether social nudges "crowd out" intrinsic motivation (Gneezy/Rustichini vs. behaviouralists).
