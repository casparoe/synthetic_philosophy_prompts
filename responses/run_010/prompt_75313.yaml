  ### Decision Tree: What is Pleasure?

  1. **Consider the pleasure of free-floating euphoria (no object) and eating a ripe apricot. Do these share a distinctive, positive *feeling* that’s identical in both?**  
     - **Yes** → 2  
     - **No** → 5  

  2. **When eating the same apricot on different days, can the pleasantness vary (e.g., mild → intense) while the apricot’s taste/smell/texture feels identical?**  
     - **Yes** → 3  
     - **No** → 4  

  3. **Common Hedonic Tone View**  
     *Most awkward commitment:* Explaining how a "hedonic tone" varies independently of sensory qualities without altering the core experience (e.g., why apricot flavor doesn’t *seem* different when pleasure intensity changes).  

  4. **Unoccupied View**  
     *Diagnosis:* Incoherent. If all pleasures share one feeling, but it *can’t* vary independently of the experience it accompanies, it cannot be both common and intrinsic.  

  ---

  5. **Is there *any* unified property (beyond the label "pleasant") shared by all pleasures?**  
     - **Yes** → 6  
     - **No** → 15  

  6. **Consider a flow state (e.g., absorbed in work). If interrupted, you’d stop immediately. Is pleasure what *commands* you to continue?**  
     - **Yes** → 7  
     - **No** → 8  

  7. **Directive View (e.g., "liking" as motivational force)**  
     *Most awkward commitment:* Explaining why you’d stop an absorbed activity (like coding) immediately if interrupted, even though it "commands" continuation.  

  ---

  8. **Consider free-floating euphoria. Can it be pleasant if it has *no object* (nothing it’s "about")?**  
     - **Yes** → 9  
     - **No** → 10  

  9. **Desire-Based View**  
     *Most awkward commitment:* Explaining how free-floating euphoria satisfies a desire if the subject isn’t aware of *what* they desire (no object to latch onto).  

  ---

  10. **Consider enjoying a cigarette after quitting (you no longer "want" to smoke). At the moment of pleasure, do you *desire* the experience?**  
      - **Yes** → 11  
      - **No** → 12  

  11. **Desire-Based View**  
      *Most awkward commitment:* Squaring occurrent desire with conflicted desires (e.g., enjoying the cigarette while judging you *shouldn’t* want it).  

