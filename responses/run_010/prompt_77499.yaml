prompt: |-
  I'm a firmware engineer at a company that makes progressive cortical implants — the kind used for degenerative conditions, where synthetic modules take over the work of failing tissue in stages rather than all at once. We have an internal Continuity Review Board that issues a certification for each procedure, completed or proposed: whether the patient who comes out is the same person, legally and morally, as the patient who went in. It reads like a formality and isn't. The certification governs advance directives, consent, insurance continuity, and who gets to make decisions if something goes wrong. Our general counsel sits on the board, so does our chief medical officer, and so do I, as the only member who actually reads the device logs. I've been asked to draft the recommendation for next month's filing. I have no formal philosophy training, so I'm going to give you our record in operational terms and ask you to supply the structure.

  The board's rulings to date:

  1. Fourteen-month staged replacement of cortical tissue; patient awake and conversing for most sessions; no interruption of any kind; at the end no biological neurons remained in the replaced regions; memory, temperament, and self-report continuous throughout. Certified.
  2. High-fidelity scan of a healthy volunteer; emulation instantiated and run for eleven days; volunteer alive, unharmed, and in the same room as the emulation on day three. Not certified — the board's finding was that the emulation was a different individual from the volunteer.
  3. Terminal patient; brain destroyed during the scan; emulation started immediately afterward and functionally continuous with the pre-scan record. Not certified.
  4. Staged replacement identical to (1) except that one session required forty-one minutes of complete neural silence — no measurable activity at all — midway through a twenty-six-month program. Certified.
  5. A region was duplicated rather than replaced: two functionally equivalent instances ran in parallel for twenty-two days while the surgical team decided which to keep; the patient reported no doubling of experience; one instance and the tissue it duplicated were then decommissioned. Certified, with an advisory.
  6. Staged replacement in which the resulting person's processing speed, memory organization, and temperament changed substantially over the following year; her husband's phrase at the hearing was "the same person, differently arranged." Certified, but the board required fresh consent for her advance directive.
  7. Staged replacement with an archival snapshot of the pre-operative state retained for ninety days and then destroyed. Certified. The board also adopted a standing rule that archived states may not be instantiated.
  8. Routine replacement of an implant's controller board — eleven seconds, no state carried on it that the patient's tissue did not also carry. Certified.

  Now the filing I have to write about. An eighteen-month staged replacement, patient awake throughout, no silent intervals, otherwise like (1). The difference is where the work happens. From month three onward, the modules replacing her tissue are not entirely inside her skull: a wearable unit takes an increasing share of the computation, bidirectionally linked at roughly two milliseconds of round-trip latency, going from ten percent of the workload in month three to ninety-three percent by month eighteen. Her skull retains the interfaces, the brainstem, and a residual biological population. By every measure we can log, she has been continuous throughout, and she describes the unit the way I describe my laptop: part of the setup, not part of her. In month nineteen the vendor must replace that wearable with a new model. The proposed method is a hot swap: the new unit runs in parallel with the old for thirty seconds, taking state directly from it over the link rather than from a scan, after which the old unit is powered down. Separately — and I wrote this part, so discount my judgment accordingly — the unit records a restorable snapshot every night and keeps the last four hundred, any of which can be instantiated on a spare unit in about four minutes. Her family has asked that the snapshots be kept indefinitely, on the reasoning that if the wearable fails catastrophically she can be brought back from last night. She has asked for the same.

  What I need from you:

  - Which principles are consistent with all eight rulings? I can gesture at three myself — something about the same physical process continuing, something about there never being two candidate persons, something about whether an earlier state can be restored — and I suspect (3) and (7) between them rule out any principle built purely on memory and character. But I want this done properly, including principles I haven't thought of.
  - What each such principle implies about the month-nineteen hot swap, and about indefinite retention of the snapshots. I expect them to disagree.
  - Which precedent is the closest analog to the hot swap, and why it beats the others. (2), (3), (5), and (8) all look relevant to me and pull in different directions.
  - A recommendation I can put in front of the board: certify, decline, or certify with conditions. If conditions, state them concretely and say what they cost this patient.
  - An honest account of what principle the board would be committing itself to by ruling either way, since we will be cited on this filing for years.
  - One further filing, described concretely enough that I could recognize it if it landed on my desk, that would settle which principle the board has actually been applying all along.

  Please don't give me references or a literature review; nobody on the board would read them and I couldn't evaluate them. And don't come back with questions. If something turns on a fact I've left out, name the fact and tell me how you'd rule under each answer to it.
reasoning: |-
  Okay, the user is a firmware engineer working on progressive cortical implants. They need help drafting a recommendation for their Continuity Review Board. Let me start by understanding their situation. The board certifies whether the patient post-procedure is the same person legally and morally as before. The engineer provided eight precedents, and now they have a new case involving an eighteen-month replacement with an external wearable unit. The key issues are the hot swap of the wearable and indefinite snapshot retention.

  First, I need to identify principles consistent with all eight rulings. Looking at the cases: (1) and (4) emphasize continuity without interruption, even with neural silence. (2) and (3) show that creating an emulation while the original exists or after destruction isn’t continuous. (5) allowed duplication but decommissioned one, avoiding two persons. (7) allowed snapshots but banned instantiation. (8) certified a hardware swap because no unique state was involved. So the principles could be: continuity of the single active process, no branching, and no restorations from past states.

  Next, applying these to the hot swap. The hot swap involves running two units in parallel for 30 seconds. Precedent (5) had parallel instances but the patient didn't experience doubling, and one was decommissioned. But here, the patient might perceive continuity. However, precedent (2) rejected an emulation running alongside the original. The critical point is whether the two units create two separate persons. Since the swap is brief and state is transferred directly, maybe it's acceptable if no branching occurs. But precedent (8) was a hardware swap with no unique state, whereas here the wearable holds state not duplicated elsewhere. So the hot swap might risk branching, making it uncertifiable unless mitigated.

  For snapshots, indefinite retention is problematic. Precedent (7) allowed snapshots but banned instantiation, so retaining them is okay only if they're never run. The family wants them for restoration, which would create a new instance from a past state, violating the no-restoration principle. So indefinite retention might be conditionally allowed if restoration is prohibited, but the patient's request conflicts with that. The board must decide if keeping snapshots risks future restorations.

  The closest precedent to the hot swap is (5) (duplication) or (8) (hardware swap). (5) is closer because two active units run in parallel, but (8) had no unique state. The hot swap has both parallel instances and unique state in the wearable. Since (5) was certified with decommissioning, the hot swap could be seen as a brief duplication. But the board might view even temporary duplication as creating two persons, as in (2). So (2) is the key counter-example. To align with (5), the hot swap must ensure no subjective doubling and prompt decommissioning.

  Recommendation: Certify the hot swap with conditions—minimize parallel runtime, ensure no branching, and prohibit snapshot restoration. For snapshots, allow retention only with strict access controls and no instantiation. The cost is the patient can't use snapshots for restoration, so catastrophic failure means permanent loss unless continuity is maintained.

  Principles at stake: Certifying implies that continuity and no branching are maintained even with external hardware, provided no parallel instances persist. Allowing snapshots but not their use reinforces that identity isn't tied to static states but to ongoing processes.

  A future filing to clarify principles: A case with a brief interruption during hardware swap. If certified, it shows continuity matters more than physical medium. If not, physical continuity is key. Or a case where a snapshot is instantiated after destruction. If certified, it contradicts precedent (3); if not, it confirms no restoration.
answer: |-
  Based on the board's rulings, I've distilled four core principles that are consistent with all eight decisions. These principles aren't mutually exclusive but form a framework for continuity:

  1.  **The Single Active Process Principle (SAP):** Continuity requires a single, unbroken *active* cognitive process (not necessarily biological or localized). Interruptions are permissible only if the process resumes identifiably from its prior state (supported by 1, 4, 6, 8). Mere static states (snapshots, archives) do not constitute the person (2, 3, 7).
  2.  **The No Branching Principle (NB):** There must never be two concurrently active, functionally equivalent candidates claiming to *be* the person (violated in 2, explicitly avoided in 5, 7). Decommissioning one branch preserves continuity only if done before both are fully active *as persons* or if subjective unity is maintained (5).
  3.  **The No Restoration Principle (NR):** Instantiating a person from a prior stored state (snapshot, archive) creates a *new* individual, even if functionally identical to the original at that past moment (explicit in 2, 3, 7).
  4.  **The Subjective/Functional Continuity Principle (SFC):** While physical substrate changes are acceptable (1, 4, 5, 6), significant shifts in core function (speed, memory organization, temperament) require re-evaluation of legal/moral agency and consent (6), but do not inherently break identity if continuity is otherwise maintained.

  **Application to Month-Nineteen Hot Swap & Snapshots:**

  *   **Hot Swap (Parallel Run):**
      *   **SAP:** The 30-second parallel run creates *two* active processes (Old Unit, New Unit) simultaneously carrying the cognitive state. This appears to violate the requirement for a *single* active process unless the patient experiences absolute unity (like in 5). Risk: Creates two candidate persons briefly.
      *   **NB:** This is explicit branching. Precedent 5 allowed branching only because the patient reported "no doubling of experience," implying subjective unity was maintained. Does subjective unity hold for 30 seconds? Unknown. Precedent 2 shows branching alone is disqualifying. Precedent 8 involved *no* unique state on the hardware, avoiding branching.
      *   **SFC:** Likely maintained *if* swap is seamless, but branching is the primary concern.
      *   **NR:** Not directly violated, as state is transferred live.
      *   **Implication:** **Likely violates NB and potentially SAP** due to concurrent active processes, unless demonstrable subjective unity akin to Case 5 exists. Without proof of unity, precedent (2) and the logic of (3/7) suggest non-certification.

  *   **Indefinite Snapshot Retention:**
      *   **SAP:** Retention itself doesn't break continuity of the active process.
      *   **NB:** Retention *enables* future branching if instantiated (violating NB), but retention alone isn't branching. Precedent 7 explicitly allows archival *retention* but forbids instantiation.
      *   **NR:** Retention enables the *possibility* of restoration, which would violate NR and create a new individual (as per 2, 3, 7). The board's standing rule (7) forbids instantiation, not retention.
      *   **SFC:** Not directly impacted by retention.
      *   **Implication:** Retention is **permissible under the board's rules (see 7)**. However, the *intent* to potentially use them for "bringing back" contradicts NR. Allowing indefinite retention *with the family's stated intent* implicitly endorses a future violation of NR/NB if restoration occurs. Precedent 7's standing rule is key.

  **Closest Analog to Hot Swap: Precedent 5 (Duplication)**

  *   **Why 5?** Both involve deliberately creating a parallel functional instance of the cognitive process. Case 5 ran for 22 days; the hot swap proposes 30 seconds.
  *   **Why it Beats Others:**
      *   **2 (Scan/Alive Volunteer):** Involved a *scan-based* emulation while the original lived – different creation mechanism, but definitive ruling against branching. Hot swap is live state transfer, not scan-based.
      *   **3 (Scan/Destroyed Brain):** Involved restoration from a scan *after* termination of the original process – violates NR/SAP. Hot swap maintains an active process.
      *   **8 (Controller Swap):** Involved hardware with *no unique state* – no branching possible. The wearable holds unique, critical state (93% of computation!), making this fundamentally different.
  *   **Why 5 Wins (for comparison):** Case 5 is the only precedent where parallel instances *were* created but continuity was certified *because* subjective unity was maintained ("no doubling of experience") *and* one instance was decommissioned. The hot swap *must* meet this same bar: demonstrable subjective unity during the parallel phase and clean decommissioning.

  **Recommendation for the Board:**

  *   **Certify the overall 18-month procedure.** Continuity was maintained throughout (SAP, SFC).
  *   **Conditionally certify the Month-19 Hot Swap procedure ONLY IF:** The parallel runtime is minimized to the *absolute technical minimum* (target << 30 seconds), *and* robust real-time telemetry demonstrates no subjective doubling or functional divergence during the parallel phase (verifying unity as in Case 5). If unity cannot be guaranteed or demonstrated, decline the hot swap method.
      *   **Cost:** Minimizing parallel time might require significant engineering effort (cost to company) and carries a small risk of swap failure if rushed. A safer alternative (brief pause/resume from biological residual) might be feasible but wasn't proposed.
  *   **Permit indefinite snapshot retention ONLY UNDER STRICT CONDITIONS:** Access controls must ensure snapshots **cannot be instantiated** under any circumstances (upholding NR and the standing rule from 7). They are archives, not restorable backups. Explicit documentation must state that instantiation would create a new legal individual, not the patient.
      *   **Cost:** The patient/family loses the desired "safety net" of restoration after catastrophic failure. Recovery must rely on hardware redundancy maintaining the *single active process* (SAP), not snapshot restoration.

  **Principles Committed To By This Ruling:**

  *   **Certifying the Hot Swap (if conditions met):** The board affirms that **brief, necessary branching during state transfer is permissible *if and only if* subjective unity is demonstrably maintained throughout (extending Principle 5)**. Physical decentralization (wearable) and latency do not inherently break continuity (SAP/SFC), but branching without unity does (NB).
  *   **Permitting Snapshots (with conditions):** The board reaffirms **Principle 7: Archived states are not the person (SAP/NR), and their instantiation is forbidden (NB/NR)**. Identity resides solely in the single, unbroken active process. Storing data about a past state does not threaten continuity, but attempting to *become* that past state again does.

  **The Litmus Test Filing:**

  To definitively reveal the board's core principle (likely SAP vs. something more physicalist), look for a filing with this scenario:

  *   **"The Brief Pause Swap":** A routine controller swap (like Case 8) for a patient *with significant unique state on the controller*. The proposed method: Power down the old controller (causing <100ms neural silence in the affected subsystem), then power up the new controller loading the last pre-silence state from a *temporary buffer* (not a restorable snapshot). Patient reports the briefest possible "flicker" in a specific sense or function, otherwise continuous.
      *   **Why it Settles the Principle:**
          *   If **Certified:** The board prioritizes **SFC/SAP** - minimal interruption with functional/experiential continuity outweighs a physical break in the active process. NR isn't violated as the buffer isn't a "restoration" point but a live transfer conduit. This aligns with tolerating silence in Case 4.
          *   If **Not Certified:** The board holds a stricter **Physical Process Continuity** view - any complete cessation of the active electrical process (silence), however brief, breaks continuity, even if functional/experiential continuity is nearly instantaneous. This would make Case 4 an outlier unless its 41-minute silence wasn't *complete* (a fact needing verification). It would also suggest a higher bar than Case 8, where no unique state existed.

  **Key Missing Fact & Ruling Impact:**

  *   **Fact:** During the hot swap parallel phase, does the patient experience a unified consciousness ("I am still one me") or duality ("I am aware of both units")?
  *   **Impact on Ruling:**
      *   **If Subjective Unity Demonstrated:** Supports certification (aligns with Case 5). Follow the conditional recommendation above.
      *   **If Subjective Duality Demonstrated or Unknown:** Forces non-certification of the hot swap method (aligns with Case 2, violates NB/SAP). Recommend an alternative method (e.g., ultra-brief pause/resume leveraging biological residual if feasible, accepting minimal silence risk like Case 4).
