prompt: |-
  I serve as methods editor of an interdisciplinary journal in historical sociology, and each month I handle six to ten submissions whose central explanatory claim takes the form "a set of values caused an outcome": an ascetic religious ethic producing a regional savings rate, a code of honor producing resistance to wage labor, a civic ethos producing low administrative corruption, a theology of vocation producing a demographic transition. My two standing reviewers are historians — excellent with sources, impatient with methodology — and they cannot agree whether such claims are explanations at all or descriptions wearing a causal costume. I need a refereeing procedure we can actually run, in about forty minutes per manuscript, with no training in philosophy and no statistics beyond what a reviewer picks up by reading.

  Please write that procedure: the questions to ask in order, what counts as a sufficient answer to each, which answers kill the paper outright, which earn a major revision, and — explicitly marked — the points at which the question is no longer about evidence but about what this journal wants an explanation to be, so that it must come to me rather than be settled by the reviewer.

  Ground it in what is genuinely available rather than in slogans. Draw on Weber's own methodological scruples about the Protestant ethic argument: the relationship he posits is one of elective affinity rather than deduction, the ideal type is a constructed benchmark against which the actual case is measured rather than an average of cases, and he closes by refusing to substitute a one-sided spiritualistic causal account of culture for a one-sided materialist one, treating either as useful only as a beginning of an inquiry and never as its conclusion. Then work through the general difficulty of explaining with meanings — that values enter explanations in at least three distinguishable ways, as a reason an actor has for doing something, as a constraint or selector operating on a set of otherwise available options, and as a constitutive part of the very thing being explained — and that only some of these uses are causal in the counterfactual sense, while others buy intelligibility instead.

  The procedure must compel the reviewer to name, for every manuscript, at least the following: the outcome and its contrast class, since explaining why A rather than B is not the same as explaining A; the value as it is operationalized, and whether the indicator would still register if the belief were absent; the mechanism at the level of individual action, with the step where many such actors become a macro pattern identified rather than assumed; the candidate causes that co-vary with the value in the same places and decades — literacy, urbanization, inheritance law, political jurisdiction, market access; the direction-of-causation question, including the possibility that the value was selected by the outcome or that both issued from a common cause; and finally whether the paper is offering a causal claim or a claim about what a practice meant to its participants, and whether the latter satisfies our standard on its own.

  Build in detection for two failure modes we see constantly. The first is functionalism: an ethic is credited with an outcome because the outcome would have needed such an ethic. The second is constitutive circularity: the explanans is a redescription of the explanandum, as when a discipline of labor is explained by an ethic whose only evidence is that same labor. A reviewer should be able to spot both without having read the philosophy of social science.

  Then run the procedure on three submissions and report the verdict on each, with the step that decides it:

  1. A quantitative paper arguing that a Reformed ethic of calling and methodical life explains a divergence in capital formation between two adjacent river valleys from 1650 to 1750, drawing on church membership rolls, probate inventories, and sermon literature, with the author candidly conceding in a footnote that the pious valley also had better navigable water and a toll exemption.

  2. An ethnographic paper arguing that a Mediterranean code of family honor explains the persistence of smallholder plots against consolidation by larger estates over two centuries, drawing on land registry data and oral histories, in which the honor code is described chiefly through the terms people use to refuse offers to sell.

  3. A beautifully written essay that I find persuasive and would hate to reject, arguing that a monastic ideal of ordered, measured hours helped produce mechanical clockmaking, where the evidence is entirely textual and the vocabulary describing the value and the vocabulary describing the outcome are nearly the same.

  Be candid about where the procedure will misfire — the papers it wrongly passes, the papers it wrongly fails — and about which of its steps are judgment calls dressed up as procedure. Do not give me a bibliography, a reading list, or citations; where you rely on Weber's text, paraphrase it rather than quoting, and do not put words in his mouth that you cannot reproduce exactly.
reasoning: |-
  Hmm, the user is a methods editor at an interdisciplinary historical sociology journal dealing with papers that claim values cause outcomes. They're struggling with two historian reviewers who disagree on whether such claims are valid explanations or just descriptions disguised as causal. They need a practical refereeing procedure that's efficient—about 40 minutes per manuscript—without requiring philosophical training or advanced stats. 

  First, I need to unpack the core challenges here. The user explicitly references Weber's methodological scruples: elective affinity over deduction, ideal types as benchmarks rather than averages, and rejecting one-sided spiritualistic or materialist explanations. There's also a deeper epistemological issue about how values function in explanations—as reasons, constraints, or constitutive elements—with only some being genuinely causal. 

  The user lists specific elements the procedure must cover: defining outcomes and contrast classes, operationalizing values, specifying micro-macro mechanisms, controlling for covariates, addressing directionality, and distinguishing causal from interpretive claims. They also want detection for functionalism and constitutive circularity—common failure modes in these papers. 

  For the procedure design, I should prioritize efficiency and trainability. Historian reviewers won't tolerate philosophical jargon, so I'll need to operationalize concepts like "contrast class" as "what didn't happen" and "counterfactual" as "would it register without the belief." The steps should flow logically: start with the claim clarity, then move to evidence, mechanisms, alternatives, and finally the journal's expectations. 

  I'll build in explicit flags where methodological judgment is required (e.g., "STOP: Editor Decision" when value operationalization is too circular). For failure modes, I'll use blunt tests: "Does the outcome prove the value exists?" for circularity, and "Is the ethic just a mirror of the outcome?" for functionalism. 

  Now for the test cases: 
  - The quantitative Reformed ethic paper likely fails on covariate control (water access/toll exemption) and possibly directionality. 
  - The ethnographic honor code paper might confuse reasons with constraints—refusing sales could be strategic rather than honor-driven. 
  - The beautiful clockmaking essay probably commits constitutive circularity if the evidence is textual and vocabularies overlap. 

  I should acknowledge limitations: the procedure might wrongly pass papers with hidden covariates or wrongly reject nuanced elective affinity arguments. Steps like mechanism plausibility are inherently subjective. But it's a pragmatic tool, not a philosopher's stone. 

  Key design principles: 
  1. Mirror the journal's mission (elective affinity > determinism) 
  2. Force concrete answers, not impressions 
  3. Isolate where editorial policy trumps reviewer judgment 
  4. Use plain-language equivalents for technical terms 

  The end product must feel like a flowchart—something a busy historian can apply while resisting the urge to write "this isn't explaining!" in the margins.
answer: |-
  Below is a practical refereeing procedure for evaluating "values as causes" submissions, designed for historian reviewers with methodological scruples but no specialized training. It requires ~40 minutes per manuscript and focuses on fatal flaws and journal standards.

  ---

  ### **Refereeing Procedure: Values-as-Causes Claims**

  **Core Principle:** The journal treats values as *part* of causal explanations (via elective affinity, per Weber), not sole determinants. Claims must distinguish between *causal* effects (counterfactual dependence) and *constitutive* meaning (intelligibility). Functionalist or circular claims are inadmissible.

  #### **Step 1: Identify the Claim (5 mins)**
  - **Question:** "What outcome does the author claim the value *caused*, and what is the *contrast class*? (e.g., 'high savings *rather than* moderate savings' or 'resisted wage labor *rather than* embraced it')."
  - **Sufficient Answer:** Clear outcome + plausible alternative (e.g., "Reformed ethic caused high capital formation *in Valley A, whereas Valley B had moderate capital formation*").
  - **Kills Paper:** No contrast class (e.g., explains "capital formation" generally). Outcome and value are identical (e.g., "honor caused honor-based resistance").
  - **Major Revision:** Vague contrast (e.g., "instead of something else").

  #### **Step 2: Operationalize the Value (10 mins)**
  - **Question:** "What *evidence* shows the value existed? Would this evidence still exist *if the value were absent*? (e.g., if no 'ascetic ethic,' would sermons still praise thrift? Would land refusals still occur without 'honor'?)."
  - **Sufficient Answer:** Multiple independent indicators (e.g., sermon texts + diaries + membership rules). "No" to the counterfactual (e.g., honor-coded refusals wouldn’t use moralistic language without the value).
  - **Kills Paper:** *Constitutive circularity*: Value is measured *only* by the outcome (e.g., "labor discipline proves the work ethic"). Value is inferred from its alleged effect (e.g., "capital accumulation shows the ethic was strong").
  - **Major Revision:** Single-source evidence (e.g., only sermons) or weak counterfactual (e.g., "people might still refuse sales for economic reasons").
  - **⚠️ STOP: Editor Decision Needed** if the reviewer suspects circularity but author uses multiple sources. *This is about what counts as independent evidence.*

  #### **Step 3: Trace the Mechanism (10 mins)**
  - **Question:** "What *actions* did individuals take because of the value, and how did these actions *aggregate* to the outcome? (e.g., 'Believers saved money → pooled savings → funded local banks')."
  - **Sufficient Answer:** Clear micro-macro link (e.g., "honor-bound refusals reduced land sales → kept plots small"). Mechanism aligns with historical actors’ stated reasons.
  - **Kills Paper:** *Functionalism*: Outcome explains value (e.g., "clockmaking required time-discipline, so monks developed it"). No mechanism (e.g., "ethic led to capital, somehow").
  - **Major Revision:** Mechanism assumed (e.g., "savings ethic obviously caused investment") or aggregation hand-waved (e.g., "many pious people led to a thrifty region").

  #### **Step 4: Check Covariates & Direction (10 mins)**
  - **Question:** "What *alternative factors* (economic, political, geographic) correlate with the value and outcome? Does the evidence rule out that these factors caused both, or that the outcome caused the value?"
  - **Sufficient Answer:** Author addresses ≥2 major covariates (e.g., literacy, laws, geography). Tests direction (e.g., sermons *preceded* capital divergence; land refusals continued despite economic pressure).
  - **Kills Paper:** Covariate ignored that better explains outcome (e.g., toll exemption in pious valley). Value *postdates* outcome (e.g., clockmaking texts appear after clocks exist).
  - **Major Revision:** Covariates mentioned but not ruled out (e.g., "water access mattered but wasn’t decisive" without evidence). Directionality ambiguous.

  #### **Step 5: Final Classification (5 mins)**
  - **Question:** "Is this primarily a *causal claim* (the value changed the outcome) or an *interpretive claim* (the value made the outcome meaningful)? Would the outcome likely differ *if the value changed*?"
  - **Sufficient Answer:** Causal claims pass Steps 1–4. Purely interpretive claims (e.g., "clocks embodied monastic ideals") require exceptional historical insight to stand alone.
  - **Kills Paper:** Causal claim fails prior steps. Interpretive claim lacks new insight (e.g., redescription using synonyms).
  - **Major Revision:** Hybrid claim where causality is weak but interpretation is novel.
  - **⚠️ STOP: Editor Decision Needed** if causal logic fails but interpretation is groundbreaking. *This is about journal standards for explanation vs. hermeneutics.*

  ---

  ### **Failure Mode Detection**
  - **Functionalism:** Ask: *"Does the author argue the value exists because it was needed for the outcome?"* If yes → kill.
  - **Constitutive Circularity:** Ask: *"Could I identify the value without referencing the outcome?"* If no → kill.

  ---

  ### **Test Cases Verdicts**

  1. **Reformed Ethic & Capital Formation (Quantitative)**  
     - **Step 1:** Pass (divergence between valleys).  
     - **Step 2:** Pass (sermons + church rolls).  
     - **Step 3:** Pass? (Savings → investment implied).  
     - **Step 4:** **KILL.** Covariates kill it: toll exemption/better water in pious valley invalidate counterfactual. Footnote concession is fatal.  
     - **Verdict:** Reject. Covariates explain divergence better.

  2. **Family Honor & Smallholder Persistence (Ethnographic)**  
     - **Step 1:** Pass (resisted consolidation vs. expected sales).  
     - **Step 2:** **KILL.** Circularity: "Honor" is operationalized *only* via refusals to sell. No evidence (e.g., ballads, court cases) showing honor existed *independently* of land decisions.  
     - **Verdict:** Reject. Value is redescription of outcome.

  3. **Monastic Hours & Clockmaking (Textual)**  
     - **Step 1:** Pass (clockmaking vs. other timekeeping).  
     - **Step 2:** **Major Revision.** Vocabulary overlap suggests circularity ("ordered hours" vs. "clock discipline"). No evidence clocks would *not* exist without the ideal.  
     - **Step 3:** Fail. No mechanism: How did ideals become gears? (Functionalism risk: "clocks required time-discipline").  
     - **Step 5:** **⚠️ Editor Decision.** Weak causality but strong interpretation. If hermeneutically novel, publish as "meaning-making" essay; if not, reject.  
     - **Verdict:** Conditionally revise (reframe as non-causal).

  ---

  ### **Where the Procedure Misfires**
  - **Wrongly Passes:** Papers with hidden covariates (e.g., unmeasured trade routes) or mechanisms that are plausible but historically inaccurate.  
  - **Wrongly Fails:** Nuanced elective affinity arguments misread as deterministic; interpretive brilliance dismissed for lacking causality.  
  - **Judgment Calls Dressed as Procedure:**  
    - Step 2 (counterfactual evidence independence)  
    - Step 5 (interpretive claim significance)  
    - Covariate significance in Step 4 (e.g., is toll exemption *decisive*?)  

  **Grounding in Weber:** Elective affinity is honored by requiring mechanisms and rejecting necessity (Step 3). Ideal types are upheld by demanding value operationalization beyond the case (Step 2). Anti-one-sidedness is enforced via covariate checks (Step 4).  

  This procedure forces concrete answers, filters fatal flaws, and flags editorial decisions about explanation standards. It accepts that some judgments are irreducibly scholarly—but makes them explicit.
