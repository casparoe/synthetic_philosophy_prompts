answer: |-
  ### Recommendation
  Your situation embodies the tension between historical accountability, family cohesion, and personal integrity. I draw on **ethics of memory** (Paul Ricoeur) and **restorative justice** (John Braithwaite) to navigate this. Ricoeur warns that forgetting enables repetition, while Braithwaite emphasizes that unaddressed harms perpetuate cycles of injustice. The core conflict is a **"duty-to-remember vs. duty-to-peace" paradox**, common in post-conflict societies.

  **Do not walk away**—your visceral reaction signals moral weight, not cowardice. But reject all three relatives' positions as extremes. Instead:  
  1. **Privately acknowledge the inheritance injustice** with the three affected cousins *before* the reunion. Share estate documents and apologize for the imbalance. Frame it as "setting the record straight," not seeking absolution.  
  2. **Archive the materials with the historical society** (per Ruth), but insist the strike ledger pages and diary transcriptions are included unredacted. Donate funds for digitization to ensure access.  
  3. **At the reunion, deliver Dale’s celebratory presentation** but add:  
     - A brief, factual mention of the sister’s early contributions to the business.  
     - A single line: "Like many during hard times, the company faced difficult choices in the 1932 strike—full records are now preserved for those who wish to study them."  
  4. **Publish Nora’s transcriptions online** (with contextual footnotes) *after* the reunion, avoiding public confrontation at a festive event.  

  This balances truth (Nora), preservation (Ruth), family peace (Dale), and your moral duty without performative shame. The fact that you benefit from this legacy *does* obligate you to truth-telling—but **how** and **when** matter. Nora’s use of the fact is ethically strongest (beneficiaries bear witness), but her timing risks harm. Dale’s use is self-serving; Ruth’s demands silence.  

  **Practical steps for nine months:**  
  - **Month 1:** Contact affected cousins privately.  
  - **Month 2:** Arrange archival transfer (specify unredacted inclusion).  
  - **Month 3–6:** Hire a grad student (via historical society) to catalog/organize, removing your physical burden.  
  - **Month 7:** Draft reunion presentation with Dale and Nora.  
  - **Month 8:** Build the digital archive (launch post-reunion).  
  - **Month 9:** Rehearse reunion remarks.  

  Your distress stems from carrying this alone. Delegate tasks—this isn’t betrayal, but stewardship.

  ---

  ### Analysis Table

  | Position            | What it treats the past as being for                      | What it would actually produce by the reunion                      | What it costs if adopted on its own                                | Condition under which it would be the right call                      | Verdict              |
  |---------------------|----------------------------------------------------------|--------------------------------------------------------------------|--------------------------------------------------------------------|-----------------------------------------------------------------------|----------------------|
  | **Ruth (Archive)** | Sacred artifact; inert truth requiring passive preservation. | Physical preservation but buried truth; no family engagement.      | Perpetuates silence; allows historical whitewashing; ignores living descendants’ stake. | If all parties agreed secrecy served greater good (e.g., avoiding violence). | **Adopt with revision**: Archive fully, but mandate access and include Nora’s transcriptions. |
  | **Dale (Celebration)** | Foundation myth; tool for present unity.                 | Superficial harmony; reinforces "poor branch" stigma; deepens resentment. | Moral injury to wronged descendants; enables historical denial; erases labor injustice. | If the harmed parties explicitly requested omission for peace.        | **Adopt with revision**: Use his structure but integrate minimal, factual acknowledgments. |
  | **Nora (Reckoning)** | Unfinished justice; moral lesson demanding repair.       | Public rupture; possible catharsis or lasting division; alienates Dale’s faction. | Turns reunion into tribunal; may retraumatize; risks performative guilt over actual repair. | If the family collectively sought transformative truth (e.g., post-apartheid commissions). | **Adopt with revision**: Publish transcripts online post-reunion; address inheritance privately. |
  | **Walk Away**       | Toxic burden; unsolvable paradox.                        | Abandoned responsibility; unresolved tension; boxes become another’s crisis. | Guarantees family conflict escalates; ensures no one benefits from the records; personal regret. | If you faced severe mental health risks requiring withdrawal.          | **Reject**: Your engagement is essential, but delegate tasks to manage burnout. |

  ---

  ### Key Philosophical Framework: **Ethics of Memory (Ricoeur)**
  - **Distinction used**: *Duty to remember* vs. *duty to forget*.  
    - Remembering prevents repetition (strike injustice).  
    - Forgetting enables social cohesion (reunion context).  
  - **Resolution**: **Staged truth-telling**—private repair for familial harm, public archiving for historical harm, celebratory unity for the present. This mirrors transitional justice models.

  **On the "same fact" rhetoric**: All three uses contain partial truths. Nora’s is most defensible: privilege obligates accountability. But Dale and Ruth weaponize gratitude to enforce silence—a classic tactic in **systemic injustice maintenance**. Your responsibility is to the *truth*, not the myth.
