answer: |-
  Here’s an example: consider a standard mechanical key — say, for a deadbolt lock. The key initially fits and operates the lock smoothly. Over time, internal pins within the lock wear down slightly due to repeated use. The key itself remains physically unchanged: its shape, mass, microstructure, and all intrinsic properties are identical. Yet, because the lock’s pins are now worn, the key no longer turns smoothly; it jams. The key has undergone a Cambridge change: it has lost the extrinsic, relational property of *being able to operate Lock X*. This property is extrinsic because it depends constitutively on the state of the lock (and the physical laws governing their interaction). We ordinarily treat this as a real feature of the key — it’s not bizarre to say "this key doesn’t work anymore," and its loss figures in causal explanations (e.g., why the door wouldn’t open).

  Now, the endurantist account is straightforward. The key, as a single, wholly present entity at every moment it exists, simply gains and loses relational properties over time without any intrinsic alteration. At t1, the key bears the relational property *can-operate-Lock-X*. At t2, after the lock’s pins wear, it bears the relational property *cannot-operate-Lock-X*. Nothing intrinsic to the key changes, and no contradiction arises because the properties are indexed to times: the key has the capacity relative to the lock’s state at t1 and lacks it relative to the lock’s state at t2. There’s no pressure to explain how incompatible properties can belong to the same thing *simpliciter*, because the properties aren’t incompatible when temporally qualified. The change is real but fully analyzable in terms of shifting external circumstances affecting the key’s relational profile.

  For the perdurantist, the case is trickier. Perdurantism typically resolves the problem of temporary intrinsics by saying that distinct temporal parts instantiate incompatible intrinsic properties. But here, the changed property is extrinsic, and *all* temporal parts of the key — past, present, and future — are intrinsically identical. The key-at-t1 part and the key-at-t2 part share all intrinsic properties; they differ *only* in their relational properties. So, what work is the machinery of temporal parts doing? The perdurantist must still say that the key’s t1-part has the relational property *can-operate-Lock-X-at-t1* (grounded in the lock’s state at t1), while the t2-part has *cannot-operate-Lock-X-at-t2* (grounded in the lock’s state at t2). But since the relational properties are borne by different temporal parts, this avoids ascribing incompatible properties to any single part. However, this seems like overkill. The temporal parts are posited to resolve incompatibility, but here there is no incompatibility to resolve — the key’s intrinsic properties are constant across time. The perdurantist account feels descriptively accurate but explanatorily hollow: it adds ontological complexity (slicing the key into parts) without a clear problem to solve. The change is already fully explained by the lock’s alteration and the relational nature of the property. The perdurantist might insist that *all* change requires temporal parts to bear differing properties, but this exposes the view to the charge that it treats extrinsic change as metaphysically on par with intrinsic change, even when no intrinsic incompatibility exists.

  This case suggests two things. First, it shows the endurantist facing no genuine problem here. The change is unproblematically relational, and endurantism handles it with minimal resources: the enduring object gains and loses extrinsic properties over time. Second, it reveals that the classic "problem of temporary intrinsics" was misdescribed — or at least too narrowly framed. The problem was presented as about resolving incompatibility (e.g., how one thing can be both bent and straight), but many intuitively significant changes, like this one, involve no intrinsic incompatibility at all. They are purely relational yet causally potent. The perdurantist’s standard motivation — resolving incompatibility — doesn’t apply to these cases, making their ontological machinery seem unmotivated for a broad class of real changes. The asymmetry bites: endurantism handles extrinsic Cambridge changes effortlessly, while perdurantism must either stretch its rationale or admit that its parts-based ontology does more work than the original problem demanded. This forces perdurantists to either broaden their justification (e.g., claiming temporal parts are needed for *any* change, not just intrinsic ones) or concede an explanatory disadvantage for extrinsic changes. Either way, the case highlights a potential blind spot in the standard dialectic.
