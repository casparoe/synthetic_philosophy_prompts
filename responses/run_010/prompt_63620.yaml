prompt: |-
  I am a junior at a public high school, and this year I serve on the student senate's budget committee. Last spring the committee adopted a new procedure for handling club funding requests above five hundred dollars, and I have been asked to prepare an evaluation of it for next year's committee. Before I argue about whether it works, I want to know what it assumes, and that is where I am hoping you can help me. Below I describe the procedure exactly as written in our handbook, and then I ask the questions I have not been able to answer on my own.

  The procedure:

  1. Any club requesting more than five hundred dollars must write its own proposal, and the proposal must end with a single measurable claim about what the money will produce — for example, "average attendance at chess club meetings will exceed twenty-two students per month during the spring semester," or "the robotics team will qualify for the state competition." The club writes this claim itself, since the club is supposed to know best what it is trying to accomplish.

  2. Once the claim is registered, a market opens for two weeks. Every student is issued one hundred units of a school currency called rams at the start of the year. Students may buy YES or NO shares in the registered claim; a share pays one ram if the claim turns out to be true and zero if it turns out to be false. Prices float between zero and one on an order book the committee maintains on a spreadsheet, and the price moves only when two students agree to trade.

  3. If the YES price closes at or above 0.60, the proposal is funded automatically and the senate takes no vote on it. If the YES price closes below 0.60, the proposal is denied automatically, again with no vote. The 0.60 figure was chosen because the committee wanted a clear line and did not want to fund anything that was a coin flip.

  4. At the end of the semester a resolution panel of two students and one faculty advisor determines whether the registered claim came true. Because a denied proposal is never tested — the club never received the money, so there is no fact about what its attendance would have been — the handbook contains a second rule: shares on a claim that was never tested are settled at their own closing price rather than at one or zero. So a student who bought NO at 0.45 in a denied proposal receives 0.45 per share back.

  5. Rams can be spent on real things: front-of-line passes at lunch, one excused absence per semester, reserved seats at assembly, and the right to buy tickets to the spring formal before the general student body can. The ten students holding the most rams in May have their names put on a plaque in the main hall, under the heading the committee chose: "Best Forecasters."

  The same senate decides certain other questions by ordinary referendum — one student, one vote, simple majority — such as whether to keep the current dress code or whether to move the homecoming dance to a weekday. In a referendum nobody is paid anything for being right, nobody's vote counts for more because of past success, and the wording of the question is drafted by the senate rather than by whichever side has the most to gain from a particular phrasing.

  The committee described the funding procedure as a small-scale version of Robin Hanson's futarchy, which as I understand it holds that in such a system "we would vote on values, but bet on beliefs."

  My questions, in roughly the order they occurred to me:

  First, what theory of belief does step 2 presuppose? It seems to assume that a student has some definite degree of confidence in the chess club's attendance claim, that this confidence is the sort of thing that can be extracted by offering payment, and that the extracted number is comparable across students and additive into a single price. Which rival accounts of belief does that rule out, and which does it merely happen to sit comfortably with? When someone buys YES at 0.70, does the procedure have to assume that person believes the claim to degree 0.70, or only that they are willing to act as if they do — and does it matter to the legitimacy of the outcome which of those is true?

  Second, what does the fixed 0.60 threshold in step 3 presuppose about the costs of being wrong? Our rule treats a false YES and a false NO as though they were equally bad, and it applies the same threshold to a two-hundred-dollar art club request and a nine-hundred-dollar robotics request. Is that a substantive claim about how decisions should be made under uncertainty, or is it just an administrative convenience that quietly imports an assumption about symmetry?

  Third, what theory of value does step 1 presuppose, given that the club chooses its own measure of success? The procedure converts every question of the form "should we support this activity?" into a question of the form "will this measurable thing happen?" — and it lets the interested party pick the measurable thing. What has to be true about goals, about the relation between a goal and a proxy for it, and about who is entitled to define the relevant good, for that substitution to be harmless rather than a way of winning the argument before it starts?

  Fourth, step 4 is the one I find hardest to make sense of. What view of truth and of counterfactuals does it presuppose to settle an untested claim at the market's own closing price? Is the committee treating the market's estimate as though it made the claim true, or as though the claim had no truth value at all and the estimate is the best available substitute? And is that consistent with also having a resolution panel of three human beings exercise judgment about snow days and transfer students in the tested cases — a panel whose discretion seems to reintroduce exactly the kind of politics the market was supposed to replace?

  Fifth, the two-track system puzzles me most of all. We let a market weighted by accumulated rams decide funding questions, and we let a strictly equal vote decide dress code questions. What distinction between the two kinds of question does that practice presuppose? Is it that some questions are about what will happen and others are about what we want, or is it that some questions are technical and others are contested, or something else? And is the line we have drawn the line the distinction actually requires — note that students can and do disagree about whether chess club deserves support at all, independently of any prediction about its attendance.

  Sixth, what view of desert does the plaque in step 5 presuppose, given that rams buy perks, perks free up time and money, and time and money buy more rams? Is rewarding forecast accuracy a claim about merit, about accuracy being a skill, or simply an incentive device that we have dressed up as an honor? Is there anything in the practice that presupposes a single year of being right is evidence of skill rather than luck, and if so, what would have to change to make that presupposition defensible?

  What I would like back is a reconstruction of the implicit theory or theories, organized around the six questions but not obliged to follow my order. Please be careful to separate three things that I keep running together: what the procedure strictly cannot function without assuming, what it merely happens to fit well with while being compatible with something else, and where it is genuinely underdetermined, so that two or three rival views would license exactly the same handbook language. Where the parts of the procedure presuppose inconsistent things, say so plainly and identify which part would have to give. Finally, tell me what would have to change — in the actual rules, not only in the philosophy — if we replaced the presupposed view with the view that a funding dispute is a disagreement about what is worth doing rather than a disagreement about what will happen.

  A few practical requests about the answer: aim for roughly twelve to fifteen hundred words, in prose rather than bullet points, and write it so that a committee of high school students and one faculty advisor could follow it without having studied philosophy. You do not need to cite or recommend any sources, and please do not invent any — I have no way to check them, and I would rather you give me names for the positions in plain language than references I cannot verify. If you think one of my six questions rests on a confusion, say that instead of answering it.
reasoning: |-
  Okay, let me approach this student senator's query methodically. The student needs a clear analysis of their budget procedure's philosophical foundations, framed accessibly for a high school committee. 

  First, I recognize the core tension: this futarchy-inspired system tries to separate "values" (what we want) from "beliefs" (what will work), but the implementation reveals several philosophical knots. The student's six questions brilliantly expose these pressure points. I'll need to untangle each while maintaining the practical focus they requested.

  For the belief question (1), the key is distinguishing between revealed preference and psychological certainty. The market doesn't care why someone bets at 0.70—it aggregates actions, not inner states. This avoids committing to any particular theory of belief, but leans behaviorist. The student's insight about "acting as if" is spot-on.

  The threshold puzzle (2) is trickier. That fixed 0.60 cutoff implicitly assumes symmetric error costs. But denying a worthy $200 request isn't equally bad as funding a failing $900 one! The procedure quietly imports this substantive assumption for administrative simplicity.

  When examining value proxies (3), I wince at how the system lets clubs define their own success metrics. This assumes clubs won't game the system by picking easily achievable targets. The substitution of "will X happen?" for "should we fund Y?" only works if the proxy perfectly captures underlying value—which it rarely does.

  The truth-value dilemma (4) is philosophically deepest. Settling untested claims at market price essentially treats predictions as self-fulfilling prophecies in denial cases. Yet simultaneously using human judgment for tested claims creates inconsistency. The market was supposed to eliminate politics, but the resolution panel brings it back through discretion.

  The two-track system (5) puzzles me too. Why use prediction markets for funding but direct votes for dress codes? The unstated premise seems to be that funding is about factual outcomes while dress codes are about preferences. But this overlooks how values permeate funding decisions too—is chess club inherently less "worthy" than robotics?

  Finally, the merit question (6) around the forecasting plaque reveals a potential feedback loop. Rewarding accuracy might incentivize effort, but when perks enable more betting, it risks creating an aristocracy of forecasters. The system assumes one year's results reflect skill, but luck plays a huge role.

  Throughout, I'll emphasize where assumptions are necessary versus merely convenient. The student's closing challenge—reimagining this as a values debate rather than prediction contest—will require fundamental restructuring. Perhaps clubs should defend their activities' intrinsic worth before elected senators, using conventional debate. 

  The word limit means I must be precise. I'll avoid jargon, use chess club/robotics examples consistently, and flag inconsistencies plainly. This bright student deserves clarity, not showy references.
answer: |-
  Here’s a reconstruction of the implicit theories behind your funding procedure, organized to address your six questions while highlighting necessary assumptions, compatible alternatives, and points of tension. I’ll conclude with practical changes needed if funding disputes are treated as disagreements about values ("what’s worth doing") rather than predictions ("what will happen").

  ---

  ### **1. Theory of Belief: What Prices Represent**  
  **Core Assumption:** Beliefs can be quantified as *probabilities* revealed through betting behavior. The market aggregates these into a single "consensus probability" (the YES price).  

  - **What it must assume:**  
    - Students have *some* degree of confidence in a claim (e.g., 70% sure chess club hits its attendance goal).  
    - When offered a bet, they act to maximize expected profit based on that confidence. If YES shares cost $0.70, a student who thinks the claim is 80% likely will buy (expecting $0.80 value for $0.70), while one who thinks it’s 60% likely will sell.  
    - Prices converge to an "efficient" estimate reflecting all available information.  

  - **Compatible Rival Views:**  
    - **Behaviorism:** Beliefs are irrelevant; prices reflect *actions* (not inner states). A student might buy YES at $0.70 to manipulate the outcome or show club loyalty—but the market still works if most trades are profit-driven.  
    - **Bayesianism:** Beliefs update rationally with evidence. The market rewards those who accurately weight new information.  

  - **What it Rules Out:**  
    - Theories where beliefs are *qualitative* (e.g., "I strongly doubt it") or *incommensurable* across people. If beliefs can’t be reduced to numbers, the price lacks meaning.  

  - **Does Legitimacy Depend on True Belief?**  
    No. The procedure only requires that trades *reveal willingness to bet*. If students bet honestly, the price reflects genuine confidence. If they bet strategically (e.g., to sink a rival club), the price becomes noisy—but legitimacy holds if the committee assumes most trades are sincere.  

  ---

  ### **2. The 0.60 Threshold: Costs of Error**  
  **Core Assumption:** False positives (funding a claim that fails) and false negatives (denying a claim that would have succeeded) are *equally costly*.  

  - **What it must assume:**  
    - All proposals have the same *stakes*. A $200 art club request and $900 robotics request are treated identically because the threshold ignores monetary cost.  
    - The 0.60 cutoff implies: "Only fund if the expected benefit outweighs the risk." But without weighting costs/benefits, it assumes a *symmetric loss function* (e.g., losing $500 on a failed bet is as bad as missing a $500 gain).  

  - **Compatible Alternatives:**  
    - **Administrative Convenience:** A variable threshold (e.g., higher for costlier requests) would be fairer but complex. The fixed 0.60 assumes simplicity trumps precision.  
    - **Implied Value:** If all clubs are equally "valuable," cost is irrelevant. But this is unrealistic—funding a $900 failure wastes more resources than a $200 one.  

  - **Tension:** Treating unequal costs equally is a substantive (and likely flawed) assumption. To fix this, the threshold could scale with request size (e.g., 0.60 for $500, 0.75 for $900).  

  ---

  ### **3. Theory of Value: Letting Clubs Choose Proxies**  
  **Core Assumption:** Clubs define their own "success," and their chosen metric (e.g., attendance) adequately captures the *underlying value to the school*.  

  - **What it must assume:**  
    - Clubs act in good faith: They pick proxies aligned with school values (e.g., chess club chooses "attendance" because it reflects student engagement, not because it’s easy to hit).  
    - Proxies are *non-manipulable* and *comprehensive* (e.g., robotics qualifying for states reflects skill-building, not just luck).  
    - The senate implicitly delegates value judgments to clubs.  

  - **Critical Weaknesses:**  
    - Clubs can "game" proxies (e.g., robotics sets "qualify for states" instead of "win states" to lower the bar).  
    - Proxies may ignore hard-to-measure benefits (e.g., chess club fostering critical thinking).  
    - **Substantive Claim:** The substitution of "will X happen?" for "should we fund Y?" assumes funding decisions are *purely about efficacy* ("can they deliver?"), not values ("is this worthwhile?").  

  - **When Harmless vs. Problematic:**  
    Harmless if:  
    - All agree on what "success" means (e.g., everyone values robotics competitiveness).  
    - Proxies are robust (e.g., attendance strongly correlates with educational benefit).  
    Problematic if:  
    - Clubs pick self-serving proxies (e.g., "we’ll host 1 event" instead of "we’ll attract 30 students").  
    - Students disagree on values (e.g., "Why fund chess when we should fund sports?").  

  ---

  ### **4. Untested Claims: Truth and Counterfactuals**  
  **Core Assumption:** For denied proposals, the market price *is the best available truth substitute*.  

  - **What it Presupposes:**  
    - **Anti-realism about untested claims:** "Will attendance exceed 22?" has no truth value if the club isn’t funded. The closing price isn’t "wrong"—it defines the outcome.  
    - **Pragmatism:** Without observable facts, the market’s estimate is the only practical resolution.  

  - **Inconsistency with Tested Claims:**  
    For funded claims, a panel judges truth based on facts (e.g., attendance records). This assumes:  
    - Truth is *objective and discoverable*.  
    - Human judgment is reliable (despite potential bias, e.g., a panelist favoring robotics).  
    This clashes with the anti-realism applied to denied claims.  

  - **Core Tension:** The panel reintroduces human discretion, undermining the market’s goal of depoliticizing decisions. To be consistent:  
    - Either use panels for *all* claims (abandoning the market’s role in truth-finding),  
    - Or settle *all* claims at market prices (treating the market as infallible).  

  ---

  ### **5. Two-Track System: Market vs. Referendum**  
  **Core Assumption:** Funding decisions hinge on *predictions* ("what will happen?"), while dress code/homecoming decisions hinge on *preferences* ("what do we want?").  

  - **Distinctions Implied:**  
    - **Epistemic vs. Ethical Questions:**  
      - Funding: "Will the chess club hit its goal?" (factual).  
      - Dress code: "Should we regulate attire?" (value-based).  
    - **Expertise vs. Equality:**  
      - Funding: Skilled forecasters (with more rams) deserve more influence.  
      - Referendum: All opinions on values are equally valid.  

  - **Problems with the Distinction:**  
    - Funding debates *also* involve values (e.g., "Is chess worth funding at all?").  
    - Referendums *also* involve predictions (e.g., "Will a strict dress code reduce bullying?").  
    - The line is blurry: A robotics request could be framed as, "Will this enhance STEM participation?" (prediction) or "Is STEM worth prioritizing?" (value).  

  - **What Must Hold:** For the two-track system to make sense, the committee must assume that:  
    - Club funding is *only* about feasibility (ignoring whether the activity is desirable).  
    - Values are settled democratically, while predictions are best left to "experts" (forecasters).  

  ---

  ### **6. The Plaque: Merit, Skill, or Incentive?**  
  **Core Assumption:** Forecasting accuracy reflects *skill* worth rewarding.  

  - **What it Presupposes:**  
    - Accuracy is primarily due to effort/talent (not luck).  
    - A one-year "win" is evidence of skill (though luck plays a role).  
    - Rewarding skill incentivizes better predictions.  

  - **Tensions:**  
    - **Feedback Loops:** Rams buy perks (e.g., excused absences), which free time to research bets, leading to more rams. This risks creating a forecasting "aristocracy."  
    - **Luck vs. Skill:** In small markets, luck dominates (e.g., guessing right on 2–3 key votes). To assume skill:  
      - The market must be large (many trades),  
      - Rams must not buy significant advantages (perks should be symbolic).  

  - **Is it About Merit or Incentives?**  
    - If merit: The plaque assumes skill exists and is measurable.  
    - If incentives: The reward motivates students to trade seriously (even if luck-driven).  
    The handbook language ("Best Forecasters") implies merit, but the system functions either way.  

  ---

  ### **If Funding Disputes Are About Values (Not Predictions): Required Changes**  
  Your closing question is pivotal. The current system assumes funding is purely about predicting outcomes ("will X happen?"). If it’s about values ("is Y worthwhile?"), the procedure conflicts with its own foundations. To align with a values-based approach:  

  1. **Replace Proxies with Value Arguments:**  
     - Clubs justify funding based on *why their activity benefits the school* (e.g., "Chess teaches strategy applicable to math" or "Robotics promotes teamwork").  
     - Drop measurable claims altogether.  

  2. **Replace the Market with Deliberation/Voting:**  
     - Use referendums or senate debates for funding, like dress code decisions.  
     - Why? Values require discussion, persuasion, and collective choice—not prediction markets.  

  3. **Revise the Threshold Logic:**  
     - Instead of a 0.60 probability threshold, define criteria for "worthwhile" activities (e.g., inclusivity, educational value, cost per student).  

  4. **Abandon the Resolution Panel:**  
     - If success isn’t tied to a claim, there’s nothing to resolve.  

  5. **Repurpose Rams (Optional):**  
     - Rams could still incentivize participation (e.g., rewarding students who attend debates), but forecasting perks become irrelevant.  

  ---

  ### **Summary of Key Tensions**  
  - **Belief vs. Action:** The market needs trades to reflect genuine beliefs but functions if actions are consistent (even if insincere).  
  - **Symmetry vs. Asymmetry:** The 0.60 threshold assumes equal error costs—a simplification that may distort decisions.  
  - **Proxies vs. Values:** Letting clubs define success assumes proxies align with school values. If not, the system incentivizes gaming.  
  - **Market Truth vs. Panel Truth:** Settling denied claims at market prices conflicts with using human judgment for funded claims.  
  - **Prediction vs. Preference:** The two-track system assumes a clean split between facts and values, which rarely exists.  
  - **Skill vs. Luck:** Rewarding forecasters assumes skill dominates luck, which may not hold in small markets.  

  The procedure’s legitimacy rests on accepting its core premises: that beliefs are quantifiable, value judgments can be outsourced to clubs, and prediction markets outperform politics. If your committee rejects these, a values-based alternative requires overhauling the rules—not just the philosophy.
