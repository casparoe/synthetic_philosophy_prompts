answer: |-
  Below is a reusable decision procedure for designing or reviewing test protocols for claims of the form: "This item will produce response R when stimulus condition S obtains." The procedure is structured as a step-by-step checklist with a core table for documentation. It explicitly screens for the four failure modes (FM1–FM4) and includes clear stopping points, handoffs, risk flags, and output grading. A technician can execute this in ~1 hour per protocol without philosophical training. The procedure is self-contained, with examples at the end.

  ---

  ### **Decision Procedure: Test Protocol Review for Disposition Claims**  
  **Purpose:** Validate if a test protocol reliably supports the claim: "Item will produce response R when stimulus S obtains in field conditions F."  
  **Inputs:** Claim (R|S), test protocol, item specifications, field conditions.  
  **Outputs:** Graded certification (likelihood + validity interval), retest interval, or handoff/stop.  
  **Tools:** Core table (below), manufacturer data, historical records.

  #### **Step-by-Step Instructions**  
  *Document answers in the core table. Proceed sequentially—if any step forces a stop/downgrade, skip later steps and justify.*

  1. **Define Claim and Field Stimulus (S):**  
     - State the exact claim: "Item will [R] when [S] in [field conditions F]."  
     - Describe S (e.g., "smoke from smouldering combustion in a corridor").  
     - *Stopping point:* If S cannot be defined operationally (e.g., "any possible fire"), stop—claim is too vague for testing. Handoff to risk authority.

  2. **Specify Test Stimulus (T) and Falsification Condition:**  
     - Describe T (e.g., "push-button press").  
     - State what test observation would falsify the claim (e.g., "horn does not sound").  
     - *Judgment call:* Flag if T is simplified (e.g., bench test vs. installed conditions).

  3. **Check Failure Modes (Execute FM1–FM4 in Order):**  
     - **FM1 (Test destroys disposition):**  
       - *Question:* Could T degrade the item's ability to respond to future S? (e.g., fatigue, depletion).  
       - *Guards:* Does the protocol mitigate this? (e.g., non-destructive limits, sample testing).  
       - *Sufficiency:*  
         - Pass: T causes no material degradation (e.g., visual inspection).  
         - Downgrade: T causes minor degradation (e.g., calibration drift).  
         - Stop: T destroys/alters the item irreversibly (e.g., destructive test on in-service item).  
       - *Handoff:* If degradation is cumulative, handoff to calculate retest interval impact.  
     - **FM2 (Background conditions prevent manifestation):**  
       - *Question:* Could background factors (e.g., contamination, low battery, isolation mode) prevent a functional item from responding during test?  
       - *Guards:* Does the protocol ensure field-like conditions? (e.g., pre-test checks for power, environment).  
       - *Sufficiency:*  
         - Pass: Background conditions match F (e.g., test in situ at rated temperature).  
         - Downgrade: Conditions partially match (e.g., bench test with simulated load).  
         - Stop: Critical factor uncontrolled (e.g., no battery check).  
     - **FM3 (Extrinsic factors supply response):**  
       - *Question:* Could the test pass due to external aid? (e.g., network override, manual intervention).  
       - *Guards:* Does the protocol isolate the item? (e.g., disconnects from controllers, tests standalone).  
       - *Sufficiency:*  
         - Pass: R is solely from item's internals (e.g., sensor triggers alarm).  
         - Downgrade: Partial isolation (e.g., tests subsystem only).  
         - Stop: R is externally forced (e.g., loop controller drives alarm).  
     - **FM4 (Structural problem: T ≠ S):**  
       - *Question:* Does T cover all critical aspects of S? (e.g., push-button vs. smoke chemistry).  
       - *Guards:* Is the gap justified by evidence? (e.g., manufacturer data linking aerosol to real smoke).  
       - *Sufficiency:*  
         - Pass: T replicates S (e.g., live fire test).  
         - Downgrade: T is a proxy with known correlation (e.g., aerosol for smoke).  
         - Stop: Gap is too wide/unjustified (e.g., push-button for smoke detection).  

  4. **Classify Evidence and Assign Inference Risk:**  
     - *Taxonomy:*  
       - **Direct:** T = S, and R is observed (e.g., live fire test). *Risk: Low (but may miss edge cases).*  
       - **Surrogate:** Measures item structure/state (e.g., contamination scan, battery voltage). *Risk: Medium (infers grounds of disposition; may not manifest).*  
       - **Calculation/Analysis:** Models or simulations (e.g., FEA stress analysis). *Risk: High (depends on assumptions).*  
       - **In-Service Observation:** R occurred during real use (e.g., past activation). *Risk: Low for observed S, but high for untested S.*  
     - *Rule:* Surrogate/calculation requires manufacturer or empirical evidence linking measurement to R|S.  
     - *Field-Test Gap:* Document gaps (e.g., "aerosol ≠ smouldering smoke"). If gap > 50% of S complexity (judgment call), downgrade to surrogate.  

  5. **Set Output Grading and Validity Interval:**  
     - *Likelihood:*  
       - **High:** Direct evidence, no FM exposures.  
       - **Medium:** Surrogate with strong evidence, or direct with minor FM exposures.  
       - **Low:** Calculation/weak surrogate, or unresolved FM exposures.  
     - *Validity Interval:* Time until likelihood degrades. Base on:  
       - Decay rate (e.g., battery lifespan, corrosion).  
       - Test-induced degradation (from FM1).  
       - Gap severity (from FM4).  
       - *Formula:* `Interval = min(manufacturer spec, historical mean time to failure) / (1 + degradation risk)`.  
     - *Rule:* If validity < 1 month, reject protocol—too fragile for certification.  

  6. **Determine Retest Interval:**  
     - *Base:* Validity interval (Step 5).  
     - *Adjust for:*  
       - FM1 impact: If test degrades item, lengthen interval or reduce test frequency.  
       - Criticality: High-risk items (e.g., fall arrest) shorten interval by 50%.  
     - *Justification:* Reference data (e.g., "battery decay: 12 months; FM1 risk: low; interval: 6 months").  

  7. **Stopping Points and Handoffs:**  
     - **Stop:** FM1 irreversible, FM4 gap unjustified, or validity interval too short. Output: "Cannot certify on evidence."  
     - **Handoff to Risk Authority:** Medium/low likelihood, or unresolved judgment calls (e.g., gap severity).  
     - **Proceed:** High/medium likelihood with validity interval. Document in core table.  

  ---

  ### **Core Documentation Table**  
  *Technician completes one table per protocol. Bold = judgment call.*  

  | Column | Description | Technician Input Guidelines |
  |--------|-------------|----------------------------|
  | **Claim Being Certified** | Exact disposition claim. | "Item will [R] when [S] in [F]." |
  | **Field Stimulus (S)** | Real-world trigger for R. | Describe S (e.g., "smoke from smouldering combustion"). |
  | **Test Stimulus (T)** | What is applied during test. | Describe T (e.g., "push-button press"). |
  | **FM Exposure & Guards** | FM1–FM4 risks and mitigations. | Per step 3 (e.g., "FM2: Dust may block sensor; guard: pre-test inspection"). |
  | **Falsifying Observation** | Test result that disproves claim. | What would fail the test? (e.g., "no alarm sound"). |
  | **Evidence Class** | Direct, surrogate, calculation, or in-service. | Select from Step 4. |
  | **Inference Risk** | Risk of relying on this evidence. | Low/medium/high + reason (e.g., "surrogate: chamber not tested"). |
  | **Gap (T vs. S)** | Difference between test and field stimulus. | Describe + **flag if gap >50% S complexity**. |
  | **Output Grading** | Likelihood (high/med/low) + validity interval. | From Step 5 (e.g., "low, 1 month"). |
  | **Retest Interval** | Time until next test. | From Step 6 (e.g., "6 months"). |
  | **Retest Justification** | Why this interval? | Cite data + FM1 impact (e.g., "battery decay: 12mo; FM1: none"). |

