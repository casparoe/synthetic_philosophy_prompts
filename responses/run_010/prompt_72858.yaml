prompt: |-
  I am the technical authority for life-safety and emergency-response equipment across a multi-site hospital group: smoke detection, fire dampers, sprinkler heads, emergency lighting and generator start circuits, medical gas cylinder valves, escape respirators, and the fall-arrest lanyards our maintenance crews work in. Every quarter I sign a schedule asserting that each item is in serviceable condition and will operate when required, and our accreditation surveyors have begun pushing back on that wording. Their objection, as I understand it, is that we treat a passing result on a scheduled test as though it established a claim about what the equipment would do under conditions we have never reproduced. The surveyor pointed to a photoelectric head in a service corridor that had passed its monthly push-button test thirty-six times running and failed to sound during a smouldering cable fault; her diagnosis, which I think is right, was that the button exercises the horn, the battery, and the supervisory circuit but not the sensing chamber, so the thing we had been testing for three years was not the thing we had been certifying. Our quality manager's response was to propose that we define "serviceable" extensionally and stop worrying: an item is serviceable just in case it responds correctly to every stimulus on the approved test list, and nothing further need be meant by the claim. I do not believe that definition is coherent, but I have not yet been able to say why in a form my engineers will accept, and I would rather hand them an instrument than an argument.

  What I want from you is a reusable decision procedure, runnable by a technician with no philosophical training, for designing or reviewing an acceptance test protocol for any claim of the form: this item will produce response R when stimulus condition S obtains. I have read enough of the literature on dispositions to know that the obvious move — treat the claim as a conditional and then go test the conditional — is contested, and that the counterexamples come in families I want the procedure to name and screen for explicitly. First, tests that remove or destroy the very disposition they were meant to detect: proof loads that fatigue webbing, heat tests that consume a fusible element, repeated actuation that drifts a calibration or empties a reservoir. Second, tests whose background conditions prevent a genuinely disposed item from manifesting: dust packed into a sensing chamber, a protective cap left in place, a battery at low state of charge, ambient temperature outside the rating, a panel left in test or isolate mode. Third, tests that an item passes without having the disposition at all, because something extrinsic supplies the work: a head that sounds only because the loop controller drives it, a valve that opens because a fitter's wrench made up for seized internals. And fourth, the structural problem that no finite list of tested conditionals is equivalent to the disposition, since there is always another stimulus condition not on the list and a ceteris paribus clause nobody can fully write down. The procedure should be built so that these four failure modes are checked in order, with a stated sufficiency criterion at each step — what answer lets the technician proceed, what answer forces a downgrade of the claim, and what answer stops the process at "cannot be certified on the evidence available."

  Beyond that ordering, I need the following components. An evidence taxonomy that distinguishes a direct stimulus test from a surrogate measurement of the item's own structure (chamber geometry and contamination reading, source activity, spring force, gasket condition, webbing tensile residual strength, current draw signature) and from calculation, analysis, or in-service observation — and for each class, an explicit statement of the inference risk carried by relying on it, since a surrogate is evidence about the grounds of the disposition rather than about its manifestation. A required field in which the protocol records the gap between the test stimulus and the field stimulus it stands in for (aerosol from a can versus real smouldering combustion products, a proof load versus a live fall, a bench cycle versus installed conditions) and a rule for when that gap is too wide for the test to bear the weight of the certification. A graded rather than binary output vocabulary, so that we assert a likelihood and a validity interval instead of "will operate," together with a defensible rule for setting retest intervals that accounts both for decay of the disposition over time and for degradation caused by the test itself. Clear stopping points, and clear handoff points where the remaining question is one of acceptable risk rather than of fact, so that the technician knows when to stop reasoning and put the file in front of me. Candour about which steps are judgment calls wearing procedural clothing; I would rather see those flagged than see them hidden inside a threshold. Please format the core as a table with columns for the claim being certified, the field stimulus, the test stimulus, which failure mode the test is exposed to and how the protocol guards against it, what observation would falsify the claim, the evidence class, and the retest interval with its justification.

  Then run the procedure on three protocols of ours, one of which must come out against us. First, the monthly push-button test on photoelectric corridor heads: tell me what that test is genuinely evidence of, whether it earns a place in the schedule at all, and what has to be added — and at what interval — before the quarterly signature is warranted. Second, lot-sample destructive testing of sprinkler heads, where we heat a sample from each batch until it operates, destroying those heads and learning nothing directly about the thousands already installed: state exactly what the sample result licenses, what would have to be measured on the installed heads instead, and whether a long-interval in-service examination can substitute. Third, proof-load testing of fall-arrest lanyards already in service, where the test plausibly leaves the lanyard weaker than it found it and where the honest conclusion may be that we should stop testing and start retiring equipment the crews are attached to and for which the budget has already allocated testing hours. If the procedure gives me an answer I do not like on any of the three, say so plainly and show which step produced it. Close with a short section stating what the procedure cannot do — the classes of claim it will never license, and the point at which it should be abandoned in favour of replacement or redundancy — and answer my quality manager's extensional definition directly, by locating precisely where "responds correctly to every stimulus on our approved list" and "will operate when required" come apart, and by saying what each of our existing tests is therefore entitled to support. I am not asking for references, a bibliography, or a survey of the debate; I want the instrument itself, written so that a surveyor can follow the reasoning and a technician can execute it in about an hour per protocol.
reasoning: |-
  We are designing a decision procedure for reviewing test protocols for claims of the form: "this item will produce response R when stimulus condition S obtains."

  The procedure must address four failure modes:
  1. Tests that remove or destroy the disposition (e.g., fatigue, consumption, drift).
  2. Tests with background conditions that prevent manifestation (e.g., contamination, low battery, wrong mode).
  3. Tests that pass due to extrinsic factors (e.g., external controller, manual intervention).
  4. The structural problem: no finite test list can cover all possible conditions.

  The procedure will be structured as a table with the following columns:
  - Claim Being Certified: The specific claim (R when S).
  - Field Stimulus (S): The actual stimulus condition in the field.
  - Test Stimulus: The stimulus used in the test.
  - Failure Mode Exposure and Guards: Which of the four failure modes the test is exposed to and how the protocol guards against it.
  - Falsifying Observation: What observation during the test would falsify the claim?
  - Evidence Class: 
     - Direct: The test applies the actual stimulus S and observes R.
     - Surrogate: Measurement of the item's structure (e.g., chamber contamination, spring force) that is the ground of the disposition.
     - Calculation/Analysis: Using models or calculations.
     - In-Service Observation: Observed during actual use.
  - Inference Risk: For each evidence class, the risk of relying on it (e.g., surrogate evidence only tells about the structure, not the actual manifestation).
  - Gap Between Test and Field Stimulus: Description of the gap and a rule for when it is too wide.
  - Output Grading: Likelihood (e.g., high, medium, low) and validity interval (time until retest or re-evaluation).
  - Retest Interval and Justification: How often the test should be repeated, accounting for decay and test-induced degradation.

  Additionally, we require:
  - Clear stopping points and handoffs for risk decisions.
  - Flagging of judgment calls.

  We'll design the procedure as a step-by-step checklist for a technician.

  ---

  **Core Procedure Steps (to be applied per test protocol for a given claim):**

  1. **Define the Claim:**
     - Clearly state: "Item will produce response R when stimulus condition S obtains in field conditions F."

  2. **Identify the Test Stimulus and Response:**
     - What stimulus is applied in the test? (T)
     - What response is expected? (R_test)

  3. **Check Failure Mode 1 (Test destroys disposition):**
     - Could the test damage the item, reducing its future ability to respond to S?
     - Guards: Is the test non-destructive? If destructive, is it only done on samples? Is there evidence that the test doesn't degrade the item?
     - If the test is destructive and done on the actual item, then the claim for that item cannot be certified after the test. For sample-based destructive tests, the claim for the untested items is based on inference (see step 7).
     - If the test is non-destructive but may cause cumulative damage (e.g., fatigue), then the retest interval must account for this.

  4. **Check Failure Mode 2 (Background conditions prevent manifestation):**
     - During the test, are there background conditions that might prevent a disposed item from manifesting R? (e.g., dust in sensor, low battery, wrong mode)
     - Guards: The protocol must ensure that the test conditions are as close as possible to field conditions and that the item is in a state that allows operation (e.g., fully powered, not isolated, within environmental specs). Pre-test checks should be defined to verify these.

  5. **Check Failure Mode 3 (Extrinsic factors supply the response):**
     - Could the test pass because of something other than the item's own disposition? (e.g., an external controller forces the response, or a technician manually operates the device)
     - Guards: The test must isolate the item so that the response is solely due to the item. For example, if testing a smoke detector, the test should verify that the alarm is triggered by the sensor and not by a network command.

  6. **Check Failure Mode 4 (Structural problem - incomplete conditions):**
     - Acknowledge that the test stimulus T may not cover all aspects of S. The gap between T and S must be evaluated.
     - Gap Analysis: Describe the differences between T and S. For instance, a push-button test on a smoke detector is not the same as real smoke.
     - Rule for Gap: If the gap is too wide (i.e., T does not adequately represent S in key aspects that affect the response), then the test may not support the claim. The test might then be reclassified as a surrogate test (see step 7) or rejected.

  7. **Classify the Evidence:**
     - Direct: If T is identical to S and the test is performed under field-like conditions, then it's direct evidence. Inference risk: low, but note that even direct tests might not cover all field conditions (e.g., the exact way a fire starts).
     - Surrogate: If the test measures the structure (e.g., webbing tensile strength) or a proxy stimulus (e.g., aerosol test for smoke detector), then it's surrogate. Inference risk: medium to high, because the relationship between the surrogate and the actual disposition must be established (e.g., by design, by correlation studies).
     - Calculation/Analysis: Using models. Inference risk: high, because models may not capture real-world variations.
     - In-Service Observation: Observed during actual use. Inference risk: low for the specific conditions that occurred, but may not cover all S.

  8. **Evaluate Inference Risk:**
     - For surrogate evidence, the risk is that the measured structure or proxy stimulus does not guarantee the response to S. The protocol must reference evidence (e.g., from the manufacturer or independent testing) that links the surrogate to the disposition.

  9. **Set Output Grading:**
     - Likelihood: 
       - High: Direct test under representative conditions, with no failure mode exposures unguarded.
       - Medium: Surrogate test with strong evidence linking to the disposition, or direct test with minor gaps.
       - Low: Surrogate test with weak evidence, or test with significant gaps.
     - Validity Interval: The time until the likelihood degrades due to:
       - Decay of the disposition (e.g., battery depletion, corrosion).
       - Cumulative damage from tests.
       - The gap between test and field conditions (if the gap is large, the validity interval might be shorter).

  10. **Determine Retest Interval:**
      - Base the interval on:
        - Manufacturer recommendations.
        - Known degradation rates (from historical data or accelerated aging tests).
        - The severity of the failure mode 1 (if the test degrades the item, then retesting too often may be harmful; if the item degrades quickly, then retest often).
      - Justification: State why the interval is set (e.g., "batteries typically last 6 months", "webbing degrades slowly in normal conditions").

  11. **Stopping Points:**
      - If at any step the test is found to be destructive to the item (and it's not a sample test) and the item is needed for service, stop: cannot certify this item without replacement.
      - If the gap between T and S is too wide and there's no surrogate evidence to bridge it, stop: the test does not support the claim.
      - If the test passes but with conditions that expose failure modes 2 or 3 unguarded, downgrade the claim (e.g., "item passed the test but under conditions that may not reflect field conditions") and flag for review.

  12. **Handoff to Risk Decision:**
      - When the evidence is incomplete (e.g., surrogate without strong correlation) or the likelihood is medium or low, the technician stops and hands off to the technical authority (you) for a risk decision (e.g., whether to accept the evidence given the consequences of failure).

  13. **Flag Judgment Calls:**
      - Clearly mark steps that require judgment (e.g., evaluating the gap between T and S, setting the validity interval) and require the technician to document their reasoning.

  ---

  **Table Format for the Core Procedure:**

  The table below is a template that the technician fills out for each test protocol. We'll then apply it to the three examples.

  | Column | Description | Instructions for Technician |
  |--------|-------------|----------------------------|
  | Claim Being Certified | "Item will produce R when S in field conditions F." | Write the exact claim. |
  | Field Stimulus (S) | The actual stimulus in the field that should trigger R. | Describe S. |
  | Test Stimulus (T) | The stimulus applied during the test. | Describe T. |
  | Failure Mode Exposure and Guards | List which failure modes (1-4) the test is exposed to and how the protocol guards against them. | For each mode: exposure (yes/no) and guard description. |
  | Falsifying Observation | What observation during the test would falsify the claim? | State what would fail the test. |
  | Evidence Class | Direct, Surrogate, Calculation, or In-Service. | Choose one and explain. |
  | Inference Risk | The risk of relying on this evidence class for the claim. | Describe the risk (e.g., for surrogate: "measures structure, not actual response to S"). |
  | Gap Between T and S | Describe the differences. | If T is not S, describe the gap. Rule: if gap is too wide (e.g., T is a push-button, S is smoke), then the test may not support the claim. |
  | Output Grading | Likelihood (High, Medium, Low) and Validity Interval (time). | Assign based on the above analysis. |
  | Retest Interval | Time until next test. | Set and justify. |
  | Justification for Retest | Why this interval? | Base on decay rate, test degradation, and gap. |

  ---

  **Application to the Three Protocols:**

  **1. Monthly Push-Button Test on Photoelectric Corridor Heads**

  - Claim: The smoke detector will sound its alarm (R) when exposed to smoke from smouldering combustion (S) in the corridor (F).
  - Field Stimulus (S): Smoke from smouldering combustion.
  - Test Stimulus (T): Push-button press (which tests the horn, battery, and supervisory circuit).
  - Failure Modes:
    - Mode 1: The test is non-destructive and does not harm the sensing chamber. Exposure: low. Guard: The test is designed to be non-intrusive to the sensor.
    - Mode 2: If the sensing chamber is contaminated, the test won't reveal it. Exposure: yes. Guard: None in the test protocol. (This is the problem in the example.)
    - Mode 3: The test might pass even if the sensing chamber is faulty because the button bypasses it. Exposure: yes. Guard: None.
    - Mode 4: The gap between T and S is huge: T is an electrical test of the circuit, S is a chemical stimulus. The test does not exercise the sensor at all.
  - Falsifying Observation: The horn does not sound when the button is pressed.
  - Evidence Class: Surrogate (it tests the circuit and battery, which are necessary for the alarm to sound, but not the sensor).
  - Inference Risk: High. The test does not provide evidence about the sensor's ability to detect smoke.
  - Gap: Very wide. The test stimulus is electrical, while the field stimulus is smoke. The test does not represent S.
  - Output Grading: Low likelihood for the claim (will sound when exposed to smoke). The test only supports a sub-claim: "the alarm circuit and battery are functional." Validity interval: 1 month (because batteries can fail quickly).
  - Retest Interval: 1 month is acceptable for the circuit and battery, but not for the sensor.
  - Justification: Batteries can deplete in a month. The sensor, however, is not tested.

  **Conclusion for Protocol 1:**
  - The push-button test does not support the claim that the detector will respond to smoke. It only supports that the alarm circuit and battery are functional.
  - To warrant the quarterly signature, we must add a test of the sensor. This could be:
    - An aerosol test (which is a surrogate for smoke) at a longer interval (e.g., annually) as per manufacturer. But note: aerosol is not identical to smouldering smoke.
    - Or, if possible, a controlled smoke test (direct) but that might be impractical monthly.
  - Revised protocol: 
    - Keep monthly push-button for circuit and battery (with monthly retest).
    - Add annual aerosol test for the sensor (surrogate evidence, medium likelihood) or biennial controlled smoke test (direct, high likelihood). The quarterly signature would then rely on the combination of these tests.

  **2. Lot-Sample Destructive Testing of Sprinkler Heads**

  - Claim: Each sprinkler head in the batch will open and release water (R) when exposed to the rated temperature (S) in a fire (F).
  - Field Stimulus (S): Heat from a fire reaching the rated temperature.
  - Test Stimulus (T): Heat applied in a test oven until operation (destructive).
  - Failure Modes:
    - Mode 1: The test destroys the sample heads. Exposure: high. Guard: Only samples are tested, not the installed heads. The inference is that the batch is uniform.
    - Mode 2: The test is done in an oven, which may not exactly replicate the rate of heating in a fire. Exposure: yes. Guard: The test standard (e.g., UL) defines the heating profile to be representative.
    - Mode 3: Not applicable (the test is of the head itself).
    - Mode 4: The gap: the test uses a controlled oven, which is designed to be equivalent to the field stimulus. The gap is small if the test profile matches real fire profiles.
  - Falsifying Observation: The sample head does not open at the rated temperature.
  - Evidence Class: Surrogate (for the installed heads) because we are using a sample to represent the batch. For the sample, it is direct evidence.
  - Inference Risk: Medium. The risk is that the installed heads might not be identical to the sample (due to manufacturing variation, or damage during installation, or environmental degradation over time). Also, the sample test does not account for in-service aging of the installed heads.
  - Gap: The test stimulus (oven) is a simulation of the field stimulus (fire). The gap is small if the test profile is designed to be representative.
  - Output Grading: 
    - For the batch at the time of manufacture: High likelihood (if the sample passes) that any head in the batch would operate at the rated temperature in a test oven.
    - But for the installed heads after years of service: The test does not account for aging (corrosion, paint, etc.). So the likelihood for the installed heads degrades over time.
  - Retest Interval: The destructive test is done once per batch. For installed heads, we rely on non-destructive examinations at intervals (e.g., visual inspection every 5 years) to check for obvious damage or contamination.
  - Justification: The initial test establishes the batch quality. Aging requires in-service inspection.

  **Conclusion for Protocol 2:**
  - The sample test licenses the claim that the batch, at the time of manufacture, meets the rated temperature. 
  - For installed heads, we must add periodic non-destructive examinations to check for degradation. Visual inspection can check for external contamination or damage but cannot verify the internal fusible element. 
  - Without in-service examinations, the claim for installed heads becomes weaker over time. 
  - We cannot non-destructively test every head. Therefore, the protocol should include:
    - Initial batch test (destructive).
    - Periodic visual inspections (e.g., annually) to check for external factors that might impair operation (e.g., paint, dust, damage).
    - Replacement based on age (if the manufacturer specifies a service life) or condition.

  **3. Proof-Load Testing of Fall-Arrest Lanyards in Service**

  - Claim: The lanyard will arrest a fall (R) when subjected to the forces of a fall (S) in the field (F).
  - Field Stimulus (S): The dynamic load of a fall (which may be up to a certain force, e.g., 6 kN).
  - Test Stimulus (T): Applying a static proof load (e.g., 3.5 kN) for a short duration.
  - Failure Modes:
    - Mode 1: The test may cause fatigue or micro-damage to the webbing, reducing its strength. Exposure: high. Guard: The test load is below the minimum breaking strength and is applied statically to minimize damage. However, repeated tests can accumulate damage.
    - Mode 2: The test is done in a controlled environment, but the lanyard might be damaged during use and not inspected. Exposure: yes. Guard: Pre-test inspection for visible damage.
    - Mode 3: Not applicable.
    - Mode 4: The gap: the test is static, but a real fall is dynamic. The test does not reproduce the shock loading. Also, the test load is less than the maximum expected force in a fall.
  - Falsifying Observation: The lanyard breaks or deforms during the test.
  - Evidence Class: Surrogate (static test for dynamic event) and also structural (if we measure elongation or inspect for damage).
  - Inference Risk: Medium to high. The static test does not fully replicate a fall, and it may weaken the lanyard.
  - Gap: The test is static and at a lower load than the maximum dynamic load. The gap is significant.
  - Output Grading: Medium likelihood. The test provides some evidence of strength but does not guarantee performance in a fall. Also, the test itself may reduce the strength.
  - Retest Interval: The technician must set an interval, but note: each test may weaken the lanyard. Therefore, repeated proof-load testing is not recommended. Instead, rely on:
    - Initial type testing (by manufacturer) for dynamic performance.
    - Regular visual inspections (e.g., before each use) for damage.
    - Periodic (e.g., annual) detailed inspection by a competent person.
    - Retirement based on time in service (e.g., 10 years) or condition.

  **Conclusion for Protocol 3:**
  - The proof-load test may do more harm than good. It is not recommended for in-service lanyards.
  - Instead, we should:
    - Retire lanyards after a set service life (based on manufacturer and industry standards).
    - Implement strict visual and tactile inspections before each use and periodic detailed inspections.
    - Use the proof-load test only for new lanyards (as part of acceptance) or for lanyards that have been subjected to a fall (then they must be removed from service anyway).

  ---

  **What the Procedure Cannot Do:**
  - It cannot certify claims where the field stimulus S is too complex or dangerous to test (e.g., a full-scale building fire). For such, we must rely on redundancy, design, and surrogate tests.
  - It cannot cover every possible condition (failure mode 4). Therefore, it will sometimes output a medium or low likelihood, and then the risk decision must be made by management.
  - It cannot replace redundancy: if an item is critical and the test cannot provide high likelihood, then we should have backups.
  - It should be abandoned when the test cannot provide evidence without destroying the item (and the item is needed) or when the gap is too wide to bridge. Then, replacement or redesign is needed.

  ---

  **Answer to the Quality Manager:**
  The extensional definition ("serviceable" means passes the test list) and the claim ("will operate when required") come apart in two main places:
  1. The test list may not cover the actual required conditions (failure mode 4). For example, the push-button test does not cover smoke detection.
  2. Passing the test list does not guarantee that the item will operate in the field because the test conditions might not match the field (failure modes 2 and 3) or the test might have altered the item (failure mode 1).

  Therefore, each test is entitled to support only a limited claim:
  - The push-button test supports: "the alarm circuit and battery are functional at the time of test."
  - The sprinkler sample test supports: "the batch, at manufacture, met the temperature rating in a test oven."
  - The lanyard proof test (if done) might support: "the lanyard withstood a static load of X at the time of test," but not that it will arrest a fall.

  The quarterly signature should not assert the broad claim unless the test protocols collectively cover all critical aspects at appropriate intervals and with adequate evidence.

  ---

  **Final Output: The Technician's Procedure**

  We now write the procedure as a reusable checklist in the form of the table and step-by-step instructions. Due to length, I'll provide the table template and then the three examples filled in.

  **Decision Procedure for Test Protocol Review**

  **Technician Instructions:**
  1. For each test protocol and the claim it supports, fill in the table below.
  2. Follow the step-by-step analysis for each failure mode.
  3. If at any step you answer "yes" to a significant exposure without adequate guard, note it and proceed but downgrade the output.
  4. When you encounter a stopping point (e.g., destructive test on an in-service item) or a handoff (e.g., medium or low likelihood), stop and escalate to the technical authority.
  5. Document all judgment calls.

  **Table Template:**

  | Claim Being Certified | Field Stimulus (S) | Test Stimulus (T) | Failure Mode Exposure and Guards | Falsifying Observation | Evidence Class | Inference Risk | Gap Between T and S | Output Grading (Likelihood, Validity) | Retest Interval | Justification for Retest |
  |----------------------|-------------------|-------------------|----------------------------------|------------------------|---------------|----------------|---------------------|--------------------------------------|----------------|--------------------------|
  |                      |                   |                   |                                  |                        |               |                |                     |                                      |                |                          |

  **Example 1: Smoke Detector Push-Button Test**

  | Claim Being Certified | Field Stimulus (S) | Test Stimulus (T) | Failure Mode Exposure and Guards | Falsifying Observation | Evidence Class | Inference Risk | Gap Between T and S | Output Grading (Likelihood, Validity) | Retest Interval | Justification for Retest |
  |----------------------|-------------------|-------------------|----------------------------------|------------------------|---------------|----------------|---------------------|--------------------------------------|----------------|--------------------------|
  | Detector sounds when exposed to smoke from smouldering combustion. | Smoke from smouldering combustion. | Push-button press. | Mode 1: Low exposure (non-destructive). Mode 2: High exposure (sensor not tested; no guard for sensor contamination). Mode 3: High exposure (test bypasses sensor). Mode 4: High exposure (T is electrical, S is chemical). | Horn does not sound. | Surrogate (only tests circuit and battery). | High: Test does not exercise the sensor. | Very wide: T is not S; the test does not assess smoke detection. | Low likelihood for the full claim. Valid for 1 month for circuit and battery only. | 1 month | Battery depletion can occur within a month. Sensor is not tested. |

  **Example 2: Sprinkler Head Sample Testing**

  | Claim Being Certified | Field Stimulus (S) | Test Stimulus (T) | Failure Mode Exposure and Guards | Falsifying Observation | Evidence Class | Inference Risk | Gap Between T and S | Output Grading (Likelihood, Validity) | Retest Interval | Justification for Retest |
  |----------------------|-------------------|-------------------|----------------------------------|------------------------|---------------|----------------|---------------------|--------------------------------------|----------------|--------------------------|
