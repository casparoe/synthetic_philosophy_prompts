  ### **Application to Your Protocols**  
  *Using the core table and procedure.*

  #### **1. Monthly Push-Button Test on Photoelectric Smoke Detectors**  
  - **Claim:** Detector sounds alarm (R) when exposed to smoke from smouldering combustion (S) in corridors (F).  
  - **Result:**  
    - **FM1:** Pass (non-destructive).  
    - **FM2:** Stop (dust in chamber prevents detection; no guard in protocol).  
    - *Procedure halted at FM2. Downgraded to low likelihood.*  
    - **Core Table Summary:**  
      | Column | Input |
      |--------|-------|
      | Claim | Sound alarm on smouldering smoke. |
      | Field Stimulus | Smouldering smoke in corridor. |
      | Test Stimulus | Push-button press. |
      | FM Exposure & Guards | **FM2: Chamber contamination not checked; no guard.** FM3: Pass (no extrinsic aid). FM4: Stop (T ≠ S). |
      | Falsifying Observation | No horn sound. |
      | Evidence Class | Surrogate (tests circuit/battery, not sensor). |
      | Inference Risk | High (sensor/chamber untested). |
      | Gap | Button vs. smoke: extreme gap (0% similarity). |
      | Output Grading | Low likelihood; validity 1 month (for circuit only). |
      | Retest Interval | 1 month (for circuit). |
      | Retest Justification | Battery decay risk; no FM1 impact. |  
  - **Conclusion:**  
    - This test is only evidence that "the alarm circuit and battery function when pressed." It does not support the smoke-detection claim.  
    - **To warrant quarterly signature:** Add an aerosol or actual smoke test (surrogate/direct) **annually** to cover the sensor. Monthly button tests can continue for circuit checks.  

  #### **2. Lot-Sample Destructive Testing of Sprinkler Heads**  
  - **Claim:** Sprinkler head opens (R) at rated temperature (S) during fire (F).  
  - **Result:**  
    - **FM1:** Stop for tested samples (destructive), but sample-based inference allowed.  
    - **FM4:** Downgrade (oven test ≠ real fire heating profile; gap: moderate).  
    - **Core Table Summary:**  
      | Column | Input |
      |--------|-------|
      | Claim | Open at rated temperature in fire. |
      | Field Stimulus | Heat from fire. |
      | Test Stimulus | Oven heat until operation (destructive). |
      | FM Exposure & Guards | **FM1: Destructive to sample; guard: batch inference.** FM4: Moderate gap (oven vs. fire convection). |
      | Falsifying Observation | Head fails to open at temperature. |
      | Evidence Class | Surrogate (for installed heads). |
      | Inference Risk | Medium (batch variation; installed aging not covered). |
      | Gap | Oven vs. fire: 60% similarity (judgment: gap <50%? **No**). |
      | Output Grading | Medium likelihood; validity 5 years (batch-level). |
      | Retest Interval | Not applicable (batch test once). |
      | Retest Justification | Batch-level; no retest for installed heads. |  
  - **Conclusion:**  
    - Sample test licenses: "This batch met specifications at manufacture." **It does not certify installed heads** due to aging (corrosion, paint) and FM4 gap.  
    - **Required addition:** Annual in-service visual inspection for damage/contamination (surrogate evidence). No substitute for destructive test—use batch data + inspections.  

  #### **3. Proof-Load Testing of In-Service Fall-Arrest Lanyards**  
  - **Claim:** Lanyard arrests fall (R) under fall forces (S) during use (F).  
  - **Result:**  
    - **FM1:** Stop (proof load may fatigue webbing; test weakens item).  
    - **FM4:** Stop (static load ≠ dynamic fall; gap: extreme).  
    - *Procedure halted at FM1. Output: "Cannot certify on evidence."*  
    - **Core Table Summary:**  
      | Column | Input |
      |--------|-------|
      | Claim | Arrest fall under fall forces. |
      | Field Stimulus | Dynamic forces of a fall. |
      | Test Stimulus | Static proof load (e.g., 3.5 kN). |
      | FM Exposure & Guards | **FM1: High (micro-tears in webbing); no guard.** FM4: Extreme gap (static vs. dynamic). |
      | Falsifying Observation | Lanyard breaks/deforms. |
      | Evidence Class | Surrogate. |
      | Inference Risk | High (test may not predict dynamic performance). |
      | Gap | Static load vs. fall: <20% similarity. |
      | Output Grading | Cannot certify. |
      | Retest Interval | N/A. |
      | Retest Justification | N/A. |  
  - **Conclusion:**  
    - **You may dislike this answer:** The test is unsafe and invalid. Proof loading risks FM1 damage and does not simulate falls (FM4).  
    - **Solution:** Abandon in-service testing. Implement:  
      - **Retirement by age/service hours** (e.g., 5 years max, per manufacturer).  
      - **Daily pre-use inspections** (surrogate for damage).  
      - **Redundancy** (e.g., twin lanyards).  
    - Budget testing hours toward replacement, not testing.  

