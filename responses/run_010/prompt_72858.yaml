  **Example 3: In-Service Lanyard Proof Testing**

  | Claim Being Certified | Field Stimulus (S) | Test Stimulus (T) | Failure Mode Exposure and Guards | Falsifying Observation | Evidence Class | Inference Risk | Gap Between T and S | Output Grading (Likelihood, Validity) | Retest Interval | Justification for Retest |
  |----------------------|-------------------|-------------------|----------------------------------|------------------------|---------------|----------------|---------------------|--------------------------------------|----------------|--------------------------|
  | Lanyard will arrest a fall (withstand dynamic fall forces). | Dynamic forces of a fall. | Static proof load (e.g., 3.5 kN). | Mode 1: High exposure (test may weaken webbing). Mode 4: High exposure (static vs dynamic, and load level may be less than fall forces). | Lanyard breaks or deforms. | Surrogate (static test for dynamic event). | High: Static test does not replicate fall, and test may damage the lanyard. | Wide: Static load at a fixed level vs dynamic impact. | Medium at best, but test may reduce future performance. | Not recommended. Use inspection and retirement by age/condition. | Proof testing adds damage and does not fully simulate a fall. |

  **Final Notes:**
  - The procedure flags that the push-button test is insufficient for the smoke detection claim, the sprinkler sample test needs in-service inspection to account for aging, and the lanyard proof test is not recommended.
  - For the lanyard, the procedure gives an answer you may not like (stop testing) because of failure mode 1 and the gap. This is based on step 3 and step 6.
