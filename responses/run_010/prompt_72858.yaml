  ### **Limitations of the Procedure**  
  - **Cannot License:**  
    - Claims where S is non-reproducible (e.g., "any possible earthquake").  
    - Items with no testable surrogate (e.g., one-time explosive devices).  
    - Claims requiring 100% certainty (use redundancy instead).  
  - **When to Abandon:**  
    - If FM1 cannot be mitigated (e.g., testing destroys item).  
    - If FM4 gap >70% and no surrogate exists.  
    - Replace or add redundancy if likelihood remains low after optimization.  

  ### **Response to Quality Manager's Extensional Definition**  
  - **Where They Diverge:** "Passes test list" ≠ "will operate when required."  
    - **FM2/FM3:** A test may pass without exercising the critical function (e.g., dust-blocked sensor passes button test).  
    - **FM4:** The test list cannot cover all real S conditions (e.g., button test vs. smouldering smoke).  
    - **FM1:** Passing a test may leave the item degraded (e.g., webbing weakened by proof load).  
  - **What Tests Support:**  
    - Push-button test: "Circuit/battery functions when pressed." Not smoke detection.  
    - Sprinkler sample test: "Batch met spec at manufacture." Not installed reliability.  
    - Lanyard proof test: "Withstood static load at test time." Not future fall arrest.  
  - **Action:** Revise quarterly schedule to assert only what tests directly support (e.g., "all items passed approved tests"). For the broader claim, use the graded output from this procedure.  

