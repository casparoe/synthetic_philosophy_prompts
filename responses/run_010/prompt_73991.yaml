answer: |-
  ### Examination Question: Democratic Theory Paper  
  **Time Allowed:** 45 minutes  
  **Closed Book. No citations required or rewarded.**  

  ---

  **Scenario**  
  The island territory of Harmonia (population: 500,000 citizens) will hold a referendum on whether to extend voting rights to non-citizen residents lawfully present for over five years (~60,000 people, primarily employed in fishing and care work). The referendum’s outcome will reshape future decisions: if passed, new voters will participate in defining future membership rules; if rejected, they remain governed without representation.  

  Two conflicting criteria for democratic inclusion arise:  
  1. **Affectedness**: Non-citizens are directly impacted by the referendum, but so are foreign fishing fleets, overseas employers, remittance-dependent relatives, and potential future migrants. The criterion lacks a clear boundary.  
  2. **Subjection**: Only those under Harmonia’s jurisdiction are included, but this assumes the legitimacy of existing territorial boundaries—precisely what the referendum aims to establish.  

  **Task**  
  (A) **Identify the logical form** of the paradox inherent in Harmonia’s referendum. Explain why this reflects a deeper problem for democratic boundary-setting. Your analysis must address whether this reflexivity constitutes:  
  - A vicious circle (democratic boundary-setting is impossible),  
  - A benign regress (resolved by historical contingencies),  
  - A fixed-point problem (solvable without foundational justification), or  
  - A sign that seeking "correct boundaries" is misdirected (the demos is constituted by institutions).  

  (B) **Apply your diagnosis**: On your view, what (if anything) could the referendum legitimately turn on? Justify your answer with reference to Harmonia’s dilemma.  

  ---  
  ### Model Answer (700 words)  

  The Harmonia referendum exposes a reflexive paradox: the decision about *who decides* reconfigures the very demos it presupposes. If the franchise extends, new voters shape future membership rules; if denied, the excluded remain subject to rules they had no role in making. This reflexivity is not merely practical but conceptual: **it is a fixed-point problem** demanding a stable solution without foundational justification.  

  **(A) The Paradox as Fixed-Point Problem**  
  The two criteria fail independently. *Affectedness* infinitely expands the demos: flag states and future migrants are affected, yet including them dissolves Harmonia’s self-governance. *Subjection* tautologically assumes jurisdictional boundaries are already legitimate—but their legitimacy is the referendum’s very subject. Crucially, whoever applies either criterion is already positioned *within or outside* the contested demos. The existing citizenry, by voting, presume authority to define membership, yet their authority derives from boundaries under dispute. This circularity is neither vicious nor benignly historical. A *vicious circle* would make democracy impossible, but democracies do make boundary decisions. A *benign regress* appeals to history, but Harmonia’s boundaries are contested *now*. The *misdirected-search* view rightly notes boundaries are constituted politically, but fails to guide action.  

  The fixed-point model accepts that boundary-setting lacks an "objective" starting point but seeks a self-consistent solution: a demos whose boundaries can be sustained *by its own procedural rules*. Like mathematical fixed points (where *f*(*x*) = *x*), it asks: what demos can coherently endorse the process that defines it? Harmonia’s citizens, as the *de facto* authoritative body, must justify their decision in terms that could be accepted by those excluded—even if provisionally.  

  **(B) What the Referendum Could Legitimately Turn On**  
  Given this, the referendum cannot directly "discover" pre-political boundaries. Instead, legitimacy hinges on **two recursive conditions**:  
  1. **Procedural reciprocity**: The decision process must allow dissenters (including the excluded) to challenge it *in future*. For example, a referendum design permitting later re-evaluation if exclusion causes measurable harm (e.g., labor exploitation).  
  2. **Institutional bootstrapping**: The vote must appeal to shared practices that *already* bind the community. Harmonia’s fishing and care sectors rely on non-citizen labor; their integration into economic life suggests a *functional* stake in governance. The referendum could thus turn on whether residency-based contributions (e.g., tax payments, social service participation) generate membership claims *under existing norms*.  

  If citizens reject extension, they must show why territorial jurisdiction alone justifies exclusion—despite non-citizens’ subjection to laws. If approved, the new demos must institutionalize pathways to contest future boundaries (e.g., via petitions or courts). Either outcome is stabilised only if the rules produced can be coherently affirmed by the resulting demos. Harmonia need not solve boundary-setting eternally; it must establish *revisable* rules that mitigate domination today while enabling future revision.  

  **Conclusion**  
  The reflexivity is a fixed-point challenge: boundaries gain authority not from first principles, but from creating a self-correcting system. Harmonia’s referendum legitimately turns on whether the outcome yields a mutually recognisable framework for ongoing negotiation—one where today’s losers can become tomorrow’s participants.  

  ---  
  ### Marking Scheme (Total: 25 marks)  
  **First-Class (≥18/25) vs Upper-Second (15–17):**  
  - **First-class** answers **explicitly name and defend one diagnosis** (e.g., "fixed-point"), **reject at least one alternative** with reasoning (e.g., "History doesn’t resolve Harmonia’s *current* legitimacy deficit"), **and derive concrete procedural criteria** for the referendum (e.g., "reciprocity" or "revisability").  
  - **Upper-second** answers identify the paradox and diagnose its form but **omit either rejecting an alternative** or **failing to specify operational criteria** for legitimacy in (B).  

  **Moves and Allocations:**  
  1. **Identification of reflexivity** (5 marks):  
     - Names the paradox: decision reconfigures the demos it presupposes.  
  2. **Diagnosis of logical form** (10 marks):  
     - Selects one option (circle/regress/fixed-point/misdirected) + justifies why others fail *in this case*.  
  3. **Application to referendum** (8 marks):  
     - Specific, non-tautological criterion for legitimacy (e.g., "procedural reciprocity," not "democratic principles").  
  4. **Clarity and structure** (2 marks):  
     - Logical progression; no significant digressions.  

  **Deductions (each –3 marks):**  
  - ⚠️ Treating subjection/affectedness as rival criteria for a *fixed* demos.  
  - ⚠️ Claiming "affectedness is too broad" without specifying *who* defines boundaries or *how*.  
  - ⚠️ Dissolving the circle by invoking "pre-political people" or "historical continuity" without addressing *why history justifies present exclusion*.  

  ---  
  ### Professional Context Note  
  **Settled:**  
  - The taxonomy of criteria (subjection/affectedness) and the *existence* of the reflexive problem are standard in democratic boundary literature (e.g., Whelan, Dahl).  
  - All four diagnoses are recognised as live options; none commands consensus.  

  **Contested:**  
  - Whether reflexivity is solvable (fixed-point) or irredeemable (vicious circle).  
  - If "misdirected search" implies radical proceduralism (e.g., Habermas) or dissolves normative boundaries altogether.  
  - The role of history: inert background (benign regress) or active justificatory resource (e.g., Walzer).  

  **Model Answer Caveats:**  
  - The "fixed-point" framing is contestable; some argue it smuggles in liberal presuppositions.  
  - *Reciprocity* as a solution draws from Forst/Cronin but is critiqued as circular by realists.  
  - The answer’s rejection of historical continuity as a *sufficient* justification aligns with Saward but not Miller.  

  **Marking Principle:**  
  Credit is for **reasoning quality**, not doctrinal alignment. A student defending "misdirected search" (e.g., "Boundaries are performative acts, not discovered") can score full marks if they rigorously apply it to Harmonia.
