  Breaking down the three requests:

  1) About the central claim: The "archive-weighted presence" concept is coherent and non-trivial. While historians acknowledge archival gaps, the user insightfully shows how synchronic framing amplifies this into narrative distortion. This isn't just "archives are uneven" but "the format turns absence into non-existence." Strong point.

  2) The friend's objection is valid but not fatal. The "shared track" concern hits hard against diffusionist models, but the user's "thread without destination" defense has potential. The bigger problem is the practical dependency on European sources for dating - that's a real methodological landmine. Suggest exploring how historians actually circumvent this (e.g., using local chronologies, dendrochronology, etc.).

  3) Fact-checking: The main oversimplification is implying historians naively use calendar years globally. Most serious scholars calibrate dates (e.g., dual dating systems). Also, synchronic history doesn't always ignore oral traditions - some incorporate them creatively. Should mention examples like Andean quipu studies.

