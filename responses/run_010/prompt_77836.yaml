  The Lindemann case is pivotal. Transcendence proofs rely on analytic methods he despised, but settle a constructivist problem he cared deeply about. This forces a hierarchy in his priorities: I suspect resolution of dispute would trump methodological purity, making him reluctantly accept it while criticizing the proof's form.

