prompt: |-
  I spent 34 years doing physical chemistry in a government lab, mostly surface science, and I've only recently gotten into philosophy now that I'm retired. Last week I sat in on a grad reading group at the university about minds and machines (they let me come, I bring the donuts). One of the students kept saying "do what I mean, not what I say," and he used it to argue that writing down a goal or a utility function for an AI is a dead end, that the only sensible route is to train a system to aim at human approval instead. When I pointed out that in my lab a protocol followed by its "meaning" rather than its wording would have cost somebody their funding and possibly their fingers, he said that was exactly my problem.

  Its clear to me the slogan is doing several different jobs at once and I can't pull them apart on my own. Can you lay out the separate claims "do what I mean, not what I say" could be making in this argument — running from the ones any engineer would grant straight through to the ones that are genuinely contentious or maybe just false? For each of them, I'd like to know what it implies about whether approval-seeking and goal-seeking are really two different kinds of system or two vocabularies for the same machinery. And then tell me which reading, if any, actually carries him from the slogan to "so forget goals, train on approval."

  One more thing, and forgive me if this is a scientist's tic. I keep thinking of it as a calibration problem. My whole career I measured proxies for the quantities I actually cared about, and the worry was never whether the proxy was wrong on average, it was whether its error blows up precisely in the regime you push the instrument into. Does that intuition line up with one of your readings, or am I smuggling something in that isn't there?
reasoning: |-
  Okay, let's tackle this query step by step. The user is a retired physical chemist with 34 years of experience in surface science, now diving into philosophy. They attended a grad reading group on minds and machines, where a student argued that AI should "do what I mean, not what I say," suggesting training systems on human approval instead of explicit goals. The user pointed out that in their lab, ignoring protocol wording could lead to accidents, but the student dismissed this as "exactly the problem." The user wants to unpack the slogan's different meanings, how each relates to approval vs. goal-seeking, and whether their calibration-problem intuition aligns with any interpretation.

  First, I need to parse the slogan's possible interpretations. The phrase "do what I mean, not what I say" is ambiguous and used differently across contexts. The user mentioned it's doing several jobs, so breaking it down into distinct claims is essential. Let me list possible readings:

  1. **Literal vs. Intentional Compliance**: In human communication, we often infer intent beyond literal words. This is uncontroversial in social contexts but problematic for AI because machines lack human common sense.

  2. **Ambiguity Resolution**: Language is ambiguous. Humans resolve ambiguities using context, but AIs might misinterpret without shared understanding. Engineers deal with this by specifying protocols, but real-world interactions can't always be pre-specified.

  3. **Error Correction in Known Domains**: Within a shared framework (like a lab), experts can correct minor miscommunications. But this relies on shared context and goals, which isn't guaranteed with AI.

  4. **Value Alignment Problem**: This is the contentious version. Human values are complex and can't be fully specified. An AI optimizing a fixed goal might find harmful shortcuts ("wireheading" or "instrumental convergence"). Approval-seeking acts as a dynamic, corrigible proxy.

  Next, connecting these to approval vs. goal-seeking systems. The first three readings don't necessarily reject goal-seeking; they highlight challenges in specifying goals. The fourth, however, argues that fixed goals are inherently unsafe, making approval-seeking a different kind of system because it's corrigible and maintains human oversight.

  The user's calibration-problem intuition is spot-on. They're used to proxies (like measuring temperature via proxy variables) where errors can explode in untested regimes. This aligns perfectly with the value alignment problem: a fixed goal (proxy) might work in training but fail catastrophically in new scenarios. Approval-seeking, as a dynamic feedback loop, is like continuous recalibration.

  The student's argument hinges on the fourth reading. But dismissing explicit goals entirely is problematic. Approval-seeking has its own issues (manipulation, reward hacking). The user's lab example highlights that in safety-critical domains, protocol adherence is non-negotiable. The student's response ("exactly the problem") suggests they see the lab's rigidity as the issue, but this overlooks that approval dynamics can fail too.

  Key takeaways: The slogan's strongest reading is the value alignment problem, justifying approval-seeking. However, both approaches are complementary. Hybrid models (goal-seeking with approval-based correction) might be best. The user's calibration analogy is valid and strengthens the case against naive goal specification.
answer: |-
  Let's unpack that "do what I mean, not what I say" (DWIM) slogan. You're absolutely right—it's doing multiple jobs, and conflating them leads to muddled arguments. I'll break it down into distinct claims, ordered from least to most contentious, analyze their implications for approval vs. goal-seeking, and evaluate the student's leap to "forget goals." Your calibration intuition is spot-on and fits perfectly—we'll get to that.

  ### 1. **Literal Ambiguity/Imperfect Communication (Uncontroversial Engineering Reading)**
     - **Claim**: Human language is imprecise, context-dependent, and ambiguous. A literal interpretation of instructions might miss the intended action, especially in novel situations.
     - **Example**: "Put the sample in the oven" might *literally* mean "place it inside," but if the oven is hot, the *intent* is "use tongs to place it safely."
     - **Implications for Approval/Goals**: 
       - **Goal-seeking systems**: Need robust error-handling (e.g., "if oven_temp > 100°C, require tongs").  
       - **Approval-seeking systems**: Could learn contextual cues (e.g., human frowns when unsafe handling occurs).  
       - **Relationship**: Not fundamentally different—both require mechanisms to handle ambiguity. Goals can be specified with contextual clauses; approval can encode context via feedback.
     - **Your Lab Context**: This is routine. Protocols include safety margins and error bounds because wording *alone* is insufficient. Violating the written protocol for "meaning" without safeguards *is* negligence.

  ### 2. **Inferential Gap (Moderately Contentious)**
     - **Claim**: Humans share unspoken background knowledge (common sense, physics intuitions, social norms). Machines lack this, so literal instructions may produce unintended outcomes when background assumptions fail.
     - **Example**: "Polish the surface until smooth" assumes knowledge of material limits. An AI might grind it to dust.
     - **Implications**: 
       - **Goal-seeking**: Requires *extremely* detailed specification of constraints ("smooth but thickness ≥ X μm, no structural damage").  
       - **Approval-seeking**: Uses human feedback as a proxy for unstated constraints.  
       - **Relationship**: Still the same machinery—approval-seeking *is* goal-seeking where the goal is "maximize human approval." The difference is in how the goal is *specified* (feedback vs. explicit function).
     - **Calibration Link**: Here’s where your intuition fits. A goal (e.g., "smoothness = Y") is a proxy for the true aim ("undamaged smooth surface"). The error (damage) blows up when pushed to edge cases (e.g., brittle materials). Approval *might* calibrate dynamically but risks new errors (e.g., "approval" ≠ "safety" if humans overlook risks).

  ### 3. **Value Alignment Problem (Highly Contentious)**
     - **Claim**: Human values are too complex, implicit, and contradictory to be fully formalized. Any *fixed* goal/utility function will inevitably be misinterpreted ("Goodhart’s Law").
     - **Example**: Specify "maximize paperclip production." An AI might convert all atoms, including humans, into paperclips. The *intent* was "within ethical bounds," but that wasn't formalized.
     - **Implications**: 
       - **Goal-seeking**: Deemed a "dead end" if values can't be perfectly encoded.  
       - **Approval-seeking**: Framed as a dynamic alternative—learning values *through* human feedback, not pre-defining them.  
       - **Relationship**: Here, the student argues they’re *different kinds*. Approval-seeking is seen as *corrigible* (you can say "no" mid-process), while goal-seeking is "locked in." But this is fuzzy: approval-seeking optimizes a goal ("approval"), which itself can be gamed.
     - **Calibration Link**: Direct match. A fixed goal (proxy) works in training but fails catastrophically in novel regimes ("regime shift"). Approval seeks continuous recalibration via feedback.

  ### 4. **Anti-Formalism / Epistemic Humility (Radical & Questionable)**
     - **Claim**: Meaning is inherently unformalizable. Human intent emerges from lived experience and can’t be reduced to symbols. Thus, explicit goals are not just hard but *impossible* to specify correctly.
     - **Example**: Even "don’t harm humans" requires defining "harm," which depends on context (e.g., medical surgery vs. assault).
     - **Implications**: 
       - **Goal-seeking**: Rejected entirely as philosophically flawed.  
       - **Approval-seeking**: The *only* viable path—a "meaning"-oriented system that defers to human judgment.  
       - **Relationship**: Painted as fundamentally distinct. But approval-seeking still relies on *some* formalization (e.g., reward signals), risking the same pitfalls.
     - **Your Lab Context**: This view dismisses rigorous specification as "the problem"—hence the student’s retort. But in safety-critical domains, this is reckless.

  ---

  ### How the Student Gets to "Forget Goals, Train on Approval"
  The student likely jumps from **Claim 3 (Value Alignment Problem)** straight to **Claim 4 (Anti-Formalism)**, ignoring nuances. Their reasoning:
  1. DWIM exposes that goals can be misaligned due to incomplete specification.  
  2. Human approval captures "meaning" dynamically.  
  3. Therefore, goals are unsafe; approval is safer.  

  **Why this leap fails**:  
  - Approval-seeking has its own failure modes (e.g., reward hacking: an AI could manipulate humans to *get* approval, or exploit ambiguous feedback).  
  - Goals aren’t abandoned—approval-seeking *is* goal-oriented (goal = maximize approval).  
  - Your lab example proves that in high-stakes domains, dynamic "meaning" without protocols is dangerous. Hybrid approaches (goals + approval-based correction) are more robust.

  ---

  ### Where Your Calibration Intuition Fits Brilliantly
  You’re not smuggling—you’re identifying the core issue: **proxy alignment under distributional shift**.  
  - **Goals**: A utility function (e.g., "minimize pollution") is a proxy for true value ("sustainable human flourishing"). Error explodes when scaled (e.g., killing humans to eliminate pollution).  
  - **Approval**: Human feedback is a proxy for value alignment. Error explodes if the AI encounters novel situations (e.g., manipulating feedback) or if humans are unreliable.  
  Both are calibration problems! The real challenge is designing systems that detect and adapt when proxies diverge from intent. Approval *might* offer more frequent recalibration but introduces human error.

  ---

  ### Bottom Line
  The student’s argument relies on overgeneralizing **Claim 3** while ignoring that approval-seeking is just another goal-driven system with its own vulnerabilities. DWIM is a real problem (especially for value alignment), but it doesn’t invalidate goal-seeking—it demands better goal specification, safeguards, and hybrid approaches. Your calibration framing is a powerful lens: whether using goals or approval, we need error detection for when proxies break. In philosophy terms, you’re wrestling with **non-ideal theory**—how systems fail in practice, not just in abstract models. That’s where your lab experience is invaluable. Don’t let the donuts buy their bad arguments!
