prompt: |-
  I direct the policy analysis unit of a mid-sized city's human services department. Beginning next fiscal year we will administer a single consolidated household support payment that replaces four categorical benefits. Our enabling ordinance sets the payment level by reference to households' "standard of living in the city" and does not say how that is to be measured, so the choice of measure is ours to make, and it will be contested. The council's budget office has commissioned a wellbeing framework built on life-satisfaction surveys. A coalition of disability organizations argues that the payment must track what households are actually able to do and be, not what they happen to hold. Our legal office wants something administrable and defensible on appeal. We score roughly forty program designs and revisions a year; a single design gets one analyst one afternoon; the analysts are not philosophers; and everything we produce can be challenged before an administrative law judge.

  What I need is a decision procedure an analyst can run on any proposed measurement or targeting rule: a worksheet with the questions in order, a statement of what counts as a sufficient answer to each, the evidence types that may be admitted at each step and how they rank against one another, the point at which the procedure returns a stop, and the points at which it hands the question up to the council because the issue is one of values rather than fact. It should be grounded in whatever the argument about the right currency of equality establishes that is genuinely usable here — the objection that income and goods are a poor proxy because households differ sharply in what they can convert a given amount into, the objection that reported satisfaction is a poor proxy because expectations adjust downward to circumstances, and the objection that compensating people for preferences they have simply grown into rewards the wrong thing. Tell me which of these distinctions must survive the simplification into a worksheet and which I can drop without distortion, and be explicit about what the procedure cannot settle and never will.

  It must also handle failure states: what the analyst does when the relevant evidence cannot be obtained, when the only available proxy is one we are not lawfully permitted to collect, and when two admissible measures point in opposite directions for the same population.

  Then run the procedure on three cases. First, a winter energy supplement gated on metered household income, where the coalition has produced data showing that households with mobility-limited or chronically ill members spend considerably more to reach the same indoor temperature, and that single-occupancy older households in our pre-1940 housing stock face costs income alone does not capture. Second, an allocation of discretionary neighborhood funds ranked by average life satisfaction under the council's index, where two of the city's most deprived neighborhoods score in the top third and the index would therefore move money away from them. Third, a proposed supplement for unpaid family carers, paid according to an in-home assessment of the carer's own condition — sleep, health, social contact — rather than by hours of care given or earnings forgone. On the third case I should tell you that I hope the procedure endorses it; if it does not, say plainly why not and what the second-best administrable rule would be.

  I want the machinery, not the scholarship: no citations, no reading list, no attributions. Two pages an analyst could actually hold while working.
reasoning: |-
  Hmm, this is a complex policy analysis challenge from a human services director. They need a practical decision procedure for evaluating measurement approaches for a new consolidated household support payment. The key constraints are: legal defensibility, administrative feasibility, philosophical robustness, and time limitations (one analyst one afternoon per design). 

  The core tension lies between three competing perspectives: the council's wellbeing framework (life satisfaction surveys), disability advocates' capability approach, and legal's need for administrability. The procedure must navigate Sen/Nussbaum vs subjective wellbeing debates without getting academic. 

  I'm designing a worksheet-style flow that forces binary stop/go decisions at each gate. It prioritizes capability evidence where available because of the conversion factors issue (disabled households needing more resources for same outcomes), but defaults to objective proxies when capability data is unobtainable. The "values handoff" trigger is crucial - when tradeoffs between competing goods emerge, it kicks to council. 

  For failure states, I'm building in fallback sequences: capability → objective → subjective, with clear documentation requirements when forced to use weaker evidence. The income/health tradeoff in winter energy case shows why capability must lead - same income buys different outcomes for disabled residents. 

  The neighborhood funds case reveals subjective wellbeing's adaptation problem - deprived communities reporting high satisfaction shouldn't lose resources. The procedure flags this as a values handoff since it's about whether to override community self-assessment. 

  On the carer supplement, my initial thought is that condition-based assessment fails the administrability stress test - too costly to scale. But I'll run it through the worksheet: capability evidence shows carers' reduced functionings, but direct assessment creates measurement burdens. The compromise might be hybrid - condition triggers verified by spot-checks. 

  The real test is whether this fits on two pages. I'm using numbered gates, all-caps key terms, and terse evidence hierarchies. Sacrificed philosophical nuance on preference endogeneity - it's noted as a risk but not a dealbreaker. What stays are: conversion factors, adaptation critique, and expensive tastes filter. 

  Final structure: 
  1. Gates 1-3 (legal/feasibility screens) 
  2. Gates 4-5 (capability validation) 
  3. Gates 6-7 (fallback options) 
  4. Handoff triggers 
  5. Failure protocols 
  Then the three cases as worked examples showing where each fails/passes.
answer: |-
  ### Decision Procedure: Measurement Evaluation Worksheet  
  **(For Analysts Evaluating Targeting Rules)**  

  **CORE PRINCIPLE:** Prioritize *capability to function* (what people can *do/be*) over *resources* or *subjective states* where evidence permits. Default to objective proxies when capability data is unavailable. Flag unresolvable value conflicts for council.  

  **GATE 0: PRE-SCREEN**  
  *Question:* Does the rule violate legal constraints (e.g., prohibited data use, discrimination)?  
  - **Sufficient Answer:** "No" + Legal Office pre-clearance memo.  
  - **Stop If:** "Yes." Return to proposer for revision.  

  **GATE 1: FUNCTIONAL EQUALITY TEST**  
  *Question:* **Does the rule account for differential resource conversion?** (e.g., Do disabled/elderly/health-impaired households need more resources to achieve the same outcome?)  
  - **Evidence Hierarchy:**  
    1. **Direct capability data:** Studies showing resource-to-outcome gaps (e.g., "Household X needs $Y more than household Z to maintain 18°C").  
    2. **Proxy data:** Health/disability registries + utility/housing cost correlations.  
    3. **Subjective data:** Self-reported barriers (low weight).  
  - **Stop If:** Credible evidence shows significant unaddressed gaps → Rule fails.  
  - **Handoff If:** No data exists, but gap is plausible → Council decides if equity requires adjustment.  

  **GATE 2: ADAPTATION TEST**  
  *Question:* **Is the rule overly reliant on subjective wellbeing (SWB) where deprivation exists?**  
  - **Evidence Hierarchy:**  
    1. **Objective deprivation markers:** Poverty rates, health outcomes, housing quality data conflicting with SWB scores.  
    2. **Studies on adaptation:** Evidence that marginalized groups report high SWB despite hardship.  
  - **Stop If:** Rule uses SWB *and* objective data shows deprivation → Rule fails.  
  - **Handoff If:** SWB is sole available metric, but deprivation is suspected → Council weighs subjectivity risk.  

  **GATE 3: PREFERENCE ENDOGENEITY CHECK**  
  *Question:* **Does the rule reward preferences shaped by unjust constraints?** (e.g., "Learned helplessness" in poverty).  
  - **Evidence Hierarchy:**  
    1. **Longitudinal data:** Showing preference shifts after policy changes.  
    2. **Qualitative studies:** On constrained choice (e.g., carers sacrificing careers).  
  - **Stop If:** Rule incentivizes harmful adaptation (e.g., paying more for resignation to deprivation).  
  - **Handoff If:** Neutral—analysts lack authority to judge "just" preferences.  

  **GATE 4: ADMINISTRABILITY STRESS TEST**  
  *Question:* **Can the rule be implemented at scale with available data?**  
  - **Evidence:** Legal Office feasibility assessment + IT/data source inventory.  
  - **Stop If:** Requires data the city cannot legally collect, or costs > 1 FTE per 1,000 cases.  

  **FAILURE STATE PROTOCOLS**  
  - **No evidence for GATE 1/2:** Use best objective proxy (e.g., median income + disability premium). Document gap.  
  - **Inadmissible proxy needed:** Stop. Rule invalid unless proxy can be anonymized/aggregated legally.  
  - **Conflicting measures:** If Gates 1–3 conflict (e.g., SWB high but capability low), default to GATE 1 (capability). If unresolvable, handoff to council.  

  **HANDOFF TO COUNCIL TRIGGERS**  
  - Unresolved conflict between capability and SWB evidence.  
  - Tradeoffs between efficiency (administrability) and equity (capability gaps).  
  - Disputes over "reasonable" conversion differences.  

  ---  
  ### Case Evaluations  
  **1. Winter Energy Supplement (Income-Gated)**  
  - **GATE 1:** *FAIL.* Coalition data shows identical income buys less warmth for disabled/elderly. Rule ignores conversion.  
  - **GATE 4:** Pass (metered income is administrable).  
  - **Action:** Stop. Redesign with disability/housing-age premiums.  

  **2. Neighborhood Funds (Ranked by SWB)**  
  - **GATE 2:** *FAIL.* High SWB in deprived areas likely reflects adaptation. Rule would move funds away from objective need.  
  - **GATE 1:** N/A (no capability data used).  
  - **Action:** Stop. Use deprivation index (e.g., housing, employment) instead.  

  **3. Carer Supplement (Condition-Based)**  
  - **GATE 1:** *PASS.* Condition assessment proxies capability loss (e.g., poor sleep = reduced functioning).  
  - **GATE 3:** *CAUTION.* Risk of rewarding "sacrifice" but no evidence of harmful adaptation.  
  - **GATE 4:** *FAIL.* In-home assessments cost > 2 FTE/1,000 cases. Not scalable.  
  - **Action:** Stop. **Second-best rule:** Pay via hours + verified care-recipient disability level. Uses existing data (e.g., Medicaid assessments), adjusts for intensity.  

  ---  
  **PROCEDURE LIMITS**  
  - Cannot resolve value disputes (e.g., "How much extra should disabled households get?").  
  - Cannot validate SWB survey methodology.  
  - Cannot eliminate all preference endogeneity; flags extreme cases only.  

  **ANALYST TOOL**  
  1. Print this sheet.  
  2. For each rule, answer Gates 0→4 in order.  
  3. Stop at first "FAIL."  
  4. Document evidence sources per hierarchy.  
  5. Flag "HANDOFF" issues in red for supervisor.  

  >> END PROCEDURE
