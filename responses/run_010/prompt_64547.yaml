  ## I. Agreed Claims

  1. Welfare hedonism, to be a substantive theory, requires that pleasure is a natural or psychological kind that can be identified independently of welfare judgments and that admits of quantitative comparison across different experiences. This ensures that claims about welfare being the balance of pleasure over pain are empirically testable and non-tautological.

  2. Both camps agree that Camp A's account provides a superior explanation for Case 2 (The click) and Case 3 (Comeuppance), while Camp B's account provides a superior explanation for Case 1 (Cold plunge) and Case 8a (the compulsive episode in Split ledger).

  3. Introspection is an imperfect tool for discerning the components of experience, and the hedonic aspect of an experience may be more accessible in comparative contexts than in isolation.

  4. Verbal reports about pleasure, while generally reliable, can be influenced by factors such as attention, conceptualization, and the complexity of the experience, leading to potential distortions.

  5. The felt intensity of an experience and its motivational pull can dissociate, as evidenced by affective neuroscience and cases such as Case 6 (The opera) and Case 8 (Split ledger).

