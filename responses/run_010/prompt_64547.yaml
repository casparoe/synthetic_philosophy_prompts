  ### I. Agreed Claims  
  1. Welfare hedonism requires that pleasure be a unified psychological kind identifiable independently of welfare judgments, such that claims about welfare being the balance of pleasure over pain are non-tautological, empirically testable, and admit of quantitative comparisons across diverse experiences.  
