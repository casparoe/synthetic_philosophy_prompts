  | D4  | Can cognitive factors directly alter the phenomenal character of sensory experiences? | Yes, cognitive factors can modulate the hedonic tone, changing the experience's phenomenology. | Cognitive factors alter the attitude, which may change how the experience is subjectively felt, but without a specific hedonic tone. | Mixed      | Experiments isolating sensory input from cognitive influence to see if phenomenology changes independently. |

