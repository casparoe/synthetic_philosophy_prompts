  First, I recall that the user mentioned existing concepts like the precautionary principle, motivated reasoning, and pragmatic encroachment. But they feel these don't fit because the cost asymmetry and the framing as evidential judgment are specific. The user needs a precise term or a new coinage.

  Looking at the nearest concepts: Pragmatic encroachment involves stakes affecting knowledge justification, but here the stakes are the attributor's, not the subject's. Motivated reasoning involves bias toward desired outcomes, but the user describes a consistent cost-based pattern without conscious intent. The precautionary principle advises caution with uncertainty, but it doesn't account for cost-dependent application. Underdetermination of theory by data is about evidence not pointing to one conclusion, but here the issue is inconsistent interpretation based on cost.

  The residue highlights the key differences: the attributor's stakes, the evidential presentation masking pragmatic motives, and the asymmetric direction (cost to the attributor). None of the existing terms cover this combination.

  For a new term, I consider "Cost-conditional evidentiary threshold shifting." It emphasizes the cost-driven change in evidence standards. The definition would include conditions like varying action costs leading to shifting evidence sufficiency judgments, presented as objective.

  Boundary cases help clarify. A regulator adopting cheap precaution fits the phenomenon if they frame it as evidential caution. An anesthetist treating infant pain aligns if the low cost justifies action despite uncertainty. A researcher adjusting confidence based on new evidence is genuine, not cost-driven. Resisting insect sentience due to unmanageable implications differs because it's about feasibility, not just cost.

  The user likely needs this term for academic discourse to highlight the bias in literature. Their deeper need might be to critique the field's inconsistencies and advocate for more consistent ethical standards, regardless of cost.
answer: |-
  ### Bottom line
  No established term perfectly captures this phenomenon. The closest candidate is **pragmatic encroachment**, but it fails to address the asymmetry where stakes belong to the attributor, not the subject. Motivated reasoning and the precautionary principle are adjacent but insufficiently precise. A new term is needed to isolate this specific configuration of cost-dependent evidential thresholds presented as objective assessments.

  ---

  ### The phenomenon restated
  This describes a systematic shift in how evidential sufficiency is judged when attributing properties (like sentience) to entities, based solely on the cost of acting on that attribution. Identical evidence is treated as adequate for precautionary action when interventions are inexpensive but dismissed as inconclusive when interventions are costly. The shift is consistently framed as a neutral evaluation of evidence—never as a pragmatic concession to cost—while the threshold for "sufficient proof" inversely tracks the actor’s financial burden. The core elements are: (1) variable evidential thresholds, (2) driven covertly by cost to the attributor, (3) masked as objective epistemic judgment, and (4) applied asymmetrically (costs to the attributor matter; costs to the subject do not).

  ---

  ### Nearest concepts
  1. **Pragmatic encroachment**: Captures how practical stakes *can* influence knowledge justification (e.g., high stakes raising evidential standards). Fails because it typically concerns the *subject’s* welfare (e.g., "Is this a pit? My life depends on it") and allows stakes to genuinely alter epistemic status. Here, stakes belong to the *attributor*, and the shift is disingenuously framed as purely evidential—not an honest admission of pragmatic influence.  

  2. **Motivated reasoning**: Explains biased interpretation favoring desired conclusions. Fits the self-serving pattern but is overly broad: it encompasses emotional/ideological drivers and doesn’t specify the *systematic cost-threshold correlation* or the *evidential masquerade*. This phenomenon is a structured subset where motivation is purely economic and bias is laundered as objectivity.  

  3. **Precautionary principle**: Advocates action under uncertainty to prevent harm. Aligns with low-cost interventions but *contradicts* the high-cost stance. The principle demands consistency ("uncertainty justifies caution"); this phenomenon *violates* that consistency by abandoning precaution when costly. It is the *suspension* of precaution due to cost, disguised as insufficient evidence.  

  4. **Underdetermination of theory by data**: Highlights that evidence alone cannot force one conclusion. However, this is a static epistemological point, not a dynamic *shift* in thresholds. The phenomenon exploits underdetermination opportunistically—invoking it to block costly actions while ignoring it for cheap ones—without acknowledging the inconsistency.  

  ---

  ### The residue
  No existing concept adequately addresses two core features:  
  **Asymmetry of direction**: The stakes are exclusively those of the party *making* the attribution (e.g., industry costs), not the entity being attributed sentience (e.g., potential fish suffering). Pragmatic encroachment typically centers the subject’s stakes; here, the subject’s stakes are irrelevant to the threshold shift.  
  **Evidential costuming**: The move is not presented as a practical compromise ("Evidence is unclear, but costs are too high to act"). Instead, identical evidence is *re-described* as objectively stronger/weaker based on cost—e.g., "inconclusive for policy" when policy is expensive versus "sufficient for caution" when cheap. This disguises economic bias as epistemic rigor, making it institutionally palatable.  

  ---

  ### A name and definition  
  **Term**: **Cost-conditional evidentiary threshold shifting** (CCETS)  
  **Definition**: *The practice of adjustably raising or lowering the stated level of evidence deemed sufficient to support a claim (e.g., animal sentience), in direct response to the financial cost of acting on that claim, while explicitly framing the adjustment as an impartial assessment of evidential quality.*  
  **Conditions for application**:  
  - (1) A single body of evidence is interpreted variably.  
  - (2) Interpretation strictly correlates with the attributor’s cost of action.  
  - (3) High-cost contexts demand higher evidence thresholds; low-cost contexts accept lower thresholds.  
  - (4) Threshold shifts are justified as objective evaluations of evidence—never cost.  
  - (5) The entity attributed the property (e.g., sentient being) lacks meaningful stakes in the outcome.  

  ---

  ### Boundary cases  
  1. **Regulator adopting cheap precaution**: *Fits CCETS* if precaution is framed as epistemically justified by uncertainty ("Evidence is ambiguous, so we must err on caution"). The low cost enables this framing, but the *evidential justification* is consistent with high-cost inaction—hence the tension persists.  

  2. **Anaesthetist treating infant pain**: *Fits* if the clinician cites "unresolved doubt" as grounds for analgesia *because* acting is low-cost. If cost weren’t low (e.g., scarce drugs in crisis), identical doubt might justify withholding treatment—masked as "evidence insufficient to justify resource use."  

  3. **Researcher lowering confidence after new evidence**: *Not CCETS*. This is genuine belief revision. CCETS requires a *cost-driven* shift without new evidence, disguised as evidential reassessment. Here, evidence changes; cost is irrelevant.  

  4. **Accepting fish sentience but resisting insect sentience due to "unmanageable" implications**: *Distinct*. "Unmanageable" implies logistical infeasibility or catastrophic consequences, not just financial cost. If "unmanageable" masks cost (e.g., "too expensive to restructure industry"), it veers toward CCETS. If genuinely existential (e.g., "would collapse food systems"), it becomes a separate stakes-based argument.  

  ---  
  This framework isolates a mechanism where economic interests covertly dictate epistemic standards. CCETS provides a lens to critique policy inconsistencies that evade charges of bias or precautionary hypocrisy.
