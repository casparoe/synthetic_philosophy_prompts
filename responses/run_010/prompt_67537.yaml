  *scribbles notes* The river setting is perfect for showing flow versus stagnation. Maybe make the Steward's rules as regular as tides, while the factor's control operates like undertows. The twins' professions matter too - a clerk experiences rules differently than a boatwright. 

  Ah! The key is in what isn't tallied: the merchant ward's unspoken expectations, the Steward's emotional toll. Jessa's "clean slate" versus Kael's "unpaid debts". The climax should hinge on their father's illness revealing how both systems fail human needs. 

  *checks word count* At 1200 words, every scene must pull double duty. The opening market confrontation establishes both governance styles through concrete details: inspection queues versus casual theft. The tally book becomes a character - its identical numbers increasingly ironic. 

  Most satisfying twist: the factor's school that seemed benevolent actually indoctrinates. Jessa's realization about her brother's apprenticeship mirrors Kael's about her "freedom". Neither system is free; they're just different cages. 

  Final beat must linger without resolution. That whispered "But the tallies match..." as the river flows indifferent to human rules... perfect. The user wants readers to argue afterward about which is worse, and this delivers.
answer: |-
  ## The Identical Ledgers

  The silt-laden scent of the River Breen hung thick over Port Charter, clinging to the weathered timber of the docks and the cobbles of Market Street. On one side, the Steward’s wards sprawled, orderly and predictable as the tide charts pinned in the Clerk's Hall. On the other, clustered around the weathered brick warehouses of the Alton Merchant House, lay the Factor’s Ward, humming with a different energy – looser, louder, seemingly freer.

  Jessa, her fingers permanently stained with ink from transcribing the Steward’s weekly Ordinance Bulletins, bumped her basket against Kael’s hip. He hauled a crate of rivets for the Alton boatyard, sweat tracing paths through the grime on his neck. Their paths crossed daily at the boundary fountain, the worn statue of Justice perpetually damp.

  "Another levy notice," Jessa sighed, nodding towards the Clerk's Hall noticeboard plastered with official seals. "Increased dockage fees for vessels over thirty paces. Published last autumn, effective tomorrow. Predictable as sunrise."

  Kael shifted the crate, his grin sharp. "Factor hasn't issued an order since his grandfather’s time, they say. Just smiles and collects half what the Steward does." He jerked his chin towards the Factor’s Ward. "See the new slates on the school roof? Alton gold paid for that. Your Steward wards still sharing chalk nubs in that leaky barn?"

  The familiar barb stung. Jessa defended the Steward’s fairness, its ironclad rules binding officials and residents alike, its appeals process. Kael scoffed at its suffocating rigidity. On impulse, Jessa pulled out the small ledger she used for household accounts. "Fine. Let’s settle it. We tally. One year. Every single order, levy, inspection, prohibition, even a reversal, that directly touches *us*. See whose cage rattles more."

  Kael’s eyes lit with challenge. "You’re on, Ink-stain. Prepare to be buried under parchment."

  *   **Month 1 (Rain’s End):** Jessa tallied first: **Notice to all residents: Mandatory inspection of chimney flues by Ordinance Inspector Durn. Date: Third-day week 4.** She noted the precise publication date from last year’s bulletin. Kael, later at the fountain, smirked. "Old Man Baris’s leaky skiff sank at Alton dock. Factor didn’t *order* it fixed, just asked me, loud enough for everyone to hear, if I thought it was ‘safe’. Baris had it hauled and repaired by sundown." He made a mark. "Count it."
  *   **Month 2 (Budding):** Jessa: **Levy: One copper per household for public lantern oil. Due week 2.** Kael: "Alton foreman ‘suggested’ we all contribute a day’s pay towards a feast for the Factor’s name-day. ‘Voluntary’. Strangely, everyone volunteered." Another mark.
  *   **Month 3 (High Sun):** Jessa endured a meticulous, hour-long inspection of her family’s licensed bread stall by Inspector Pell: scales calibrated, flour grades verified, licenses displayed. **Inspection: Stall #7. Found compliant.** Kael winced. "Got docked half a day’s pay. Foreman said my riveting on the new barge was ‘sloppy’. His nephew got my pay. No appeal, just a grunt and a pointed finger." Mark.
  *   **Month 5 (Harvest):** Jessa celebrated a small victory: **Reversal: Appeal against increased grain tax on small bakeries upheld by Standing Tribunal. Levy rescinded.** Kael arrived looking grim. "Factor’s son took a fancy to my sister. Started ‘visiting’ our house. Ma ‘politely’ asked him to stop. Next day, the foreman cut my hours. ‘Temporary slowdown’, he said." Mark. No tribunal for that.

  The ledgers filled. Jessa’s entries were crisp, bureaucratic: Ordinance 45.7, Levy Schedule D, Tribunal Case 112. Kael’s were scrawled narratives: ‘Foreman’s ‘suggestion’ about overtime’, ‘Warehouse Master’s ‘friendly reminder’ about punctuality’, ‘Factor’s wife ‘admiring’ Ma’s silver teapot (now gone)’.

  The numbers, meticulously compared each month at the fountain, were unnervingly identical. Seven levies. Five inspections. Three prohibitions (Jessa: no washing in the public trough after noon; Kael: no singing work shanties deemed ‘offensive’ near the Factor’s residence). Two reversals (Jessa’s tax win; Kael’s hours mysteriously restored after his sister ‘accepted’ a position as a maid in the Factor’s house).

  "But they’re not the same!" Jessa insisted one blustery autumn day, clutching her ledger like a shield. "Mine are known a year ahead! I can plan! I appealed and *won*! Yours are just... whims. Daggers in the dark!"

  Kael slammed his ledger shut, the sound sharp on the quiet street. "Whims? That ‘known a year ahead’ levy nearly broke Ma’s stall last winter. Your appeal took *six months*! And winning? What did it cost you in time and worry?" He leaned in, his voice low and rough. "You know why your numbers match mine, Jessa? Because the *weight* is different. Your Steward crushes you slow, like a millstone. The Factor? He stabs fast and deep, where it hurts most. Your rules bind the Steward’s men? Fine. But they still bind *you*, and you can't touch *him*. Ever. He’s untouchable stone. Our Factor? He’s a man. A greedy, smiling man. But replaceable? Maybe, someday. You’re stuck with your millstone forever."

  A chill deeper than the autumn wind went through Jessa. The irreversibility of the Steward – a fundamental fact she’d accepted like gravity – suddenly felt oppressive, suffocating. No vote, no revolt, no aging out. Just the endless, predictable, grinding turn of the Ordinance calendar.

  *   **Month 11 (Ice’s Whisper):** Jessa’s father, a Steward records clerk, fell gravely ill. The Steward’s rules were scrupulously fair: **Notice: Medical leave granted per Ordinance 12.3. Half-pay effective immediately.** The coldness of the printed notice, arriving precisely on schedule, offered no solace against the fear gnawing at her family or the looming specter of poverty. No one could bend the rule, not even for a dying man who’d served the system faithfully.
  Kael, seeing her hollow eyes at the fountain, didn’t gloat. "My Pa got the lung-rot last winter," he said quietly. "Factor sent a bottle of expensive cordial. Then doubled our warehouse storage fee. Said it was ‘market adjustment’. Ma sold her wedding bracelet." He made a mark. Just another entry.

  The year ended on the anniversary of their wager, at the damp fountain. Justice’s scales were crusted with frost. They opened their ledgers one last time. The final tallies, checked and re-checked, were identical down to the last mark. Thirty-seven entries each.

  Jessa stared at the matching numbers, then out at the grey river flowing indifferently past the rigid Steward docks and the bustling, shadowed Alton wharves. The victory she’d anticipated felt like ashes. The predictability offered no comfort. The appeals process felt like a complex lock on an unbreakable cage.

  Kael looked at his ledger, the record of quiet extortions and unspoken threats. His freedom felt like walking a knife-edge over a pit, never knowing when a smiling word might shove him over. The school roof gleamed, a monument bought with invisible coin.

  "They match," Jessa whispered, the steam of her breath hanging in the air.

  Kael closed his book with a soft thud. "Yeah. They match."

  No verdict passed between them. Only a shared, heavy understanding settling like the river mist. The costs were etched onto their lives – the cold, immovable weight of the Steward, impossible to dislodge; the warm, intimate knife of the Factor, always twisting. The ledgers proved the interferences were equal, yet the worlds they described, the fears they bred, the helplessness they engendered, were oceans apart.

  Jessa touched the cold stone of the fountain, carved with the Steward’s founding date. Forever. Kael looked towards the Alton house, where a lamp flickered in the Factor’s study. A man sat there. Just a man.

  They turned away from each other, the identical ledgers tucked under their arms, walking back into their respective wards, carrying the invisible, inescapable burden of their unchosen rules. The river flowed on, whispering no answers, only the endless, patient sound of water wearing down stone.
