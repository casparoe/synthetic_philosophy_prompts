  This is a sophisticated quantum foundations question. The sidebar summarizes David Deutsch and David Wallace's decision-theoretic defense of the Born rule in Everettian quantum mechanics. The user wants me to dissect it carefully, distinguishing what Deutsch-Wallace supporters would accept, tolerate as simplification, or reject outright. They specifically flagged two concerns: whether "caring about future selves" is problematic given branch indistinguishability, and whether "only assumptions are QM plus rationality" is accurate. Finally, they want to know if the objective chance claim holds even if the rest is corrected.

  Let me break down the sidebar sentence by sentence:

  First claim: "If every outcome... probability looks unintelligible." Deutsch-Wallace supporters would accept this as a fair statement of the problem - it's why they developed their approach. The "unintelligibility" is exactly what they're trying to solve.

  Second claim: "Deutsch and Wallace repaired this... bet exactly as the Born rule prescribes." This is essentially correct as a summary of their project. Supporters would accept "decision-theoretic argument" but note it's specifically about rational betting preferences. The phrase "cares about what happens to her future selves" is where the first puzzle lies - it's oversimplified. More precisely, the agent must be indifferent between identical future selves across branches, which is subtly different from "caring."

  Third claim: "The only assumptions... derived rather than postulated." This is where critics pounce. Supporters would say it's tolerable as a slogan but reject it as literally true. They rely on additional substantive assumptions like branch indifference, measurement neutrality, and specific utility frameworks - these go beyond "ordinary rationality" and are controversial.

  Fourth claim: "And since the branches... objective chance after all." This is the boldest claim. Supporters would accept that branch weight matters for rational action, but reject that this constitutes "objective chance" in the classical sense. Critics would say it fails to solve the problem of quantitative uncertainty.

  For the specific puzzles: About "cares about future selves" - the key is that since there's no fact about which branch you're in pre-measurement, rationality requires treating all future selves symmetrically. It's not about emotional care but about rational indifference. Regarding "only assumptions" - this ignores the extra decision-theoretic axioms required that aren't part of standard rationality.

  On the final objective chance question: Even if corrected, this inference is shaky. The Deutsch-Wallace program shows why rational agents should bet according to weights, but doesn't show these weights represent genuine probabilities. The "actual difficulty" critics point to is the origin of quantitative uncertainty - why we should feel uncertain at all when all outcomes definitely occur.

