prompt: |-
  Taking a philosophy-of-history seminar that keeps waving at "the archive" without ever getting into the weeds of how one actually works, and something from my summer job at a county archives is bugging me.

  Two practices. First: appraisal. We keep maybe 4% of what comes in, and the retention schedule is essentially driven by what the creating office says it needs for legal/fiscal/administrative purposes — so the directors' policy correspondence survives and the individual case files get pulped. Second: arrangement and description follow provenance and original order, which in practice means the catalogue entry inherits the agency's own file titles and vocabulary. For the records of the county poor farm, that means people show up in the finding aid under whatever heading the superintendent wrote on the folder (inmates, defectives, that sort of thing), because the archivist isn't supposed to editorialize. We describe ourselves as neutral custodians. Meanwhile we just launched an active collecting push to solicit materials from communities that barely appear in the holdings at all.

  So what theory of what a record *is* does the first pair presuppose — that records are evidence of the creator's activity rather than evidence about the people named in them? Which rival account does that quietly rule out, and is neutrality here even a coherent stance or just a label for whose viewpoint wins by default? And does the collecting push run on the same theory or a different one — do they contradict eachother, or can a single framework license both? Finally, what would concretely have to change in appraisal and description if you swapped in the rival view?
reasoning: |-
  Okay, the user is in a philosophy-of-history seminar that mentions "the archive" but doesn't dive into practical aspects. They worked at a county archives over the summer and noticed two main practices: appraisal and arrangement/description. 

  First, they're puzzled by appraisal—only 4% of materials are kept, based on what the creating office needs for legal or administrative reasons. So, policy correspondence stays, but individual case files get destroyed. Second, arrangement follows provenance and original order, meaning the archive uses the agency's own file titles and terms. For example, terms like "inmates" or "defectives" from a poor farm superintendent are kept as-is, without any editorializing. The archives present themselves as neutral custodians. But now they're actively collecting materials from underrepresented communities.

  The user is questioning the underlying theory here. Do records exist primarily as evidence of the creator's activities, or are they evidence about the people mentioned? They wonder if neutrality is even possible or just a default favoring the creator's viewpoint. Also, does the new collecting initiative clash with the existing practices? What would change if they shifted to a different theory?

  I need to break this down. The traditional approach is based on the "custodial theory" or the "institutional paradigm." Here, records are evidence of organizational functions and transactions. Appraisal focuses on administrative needs, not the subjects of the records. So, case files are seen as ephemeral, while policy docs show decision-making. This aligns with Jenkinson's idea that archives must preserve impartial evidence, free from modern bias. Neutrality here means not altering the creator's context, but it inherently privileges the institution's perspective.

  The rival view is the "post-custodial" or "social justice" approach, influenced by scholars like Cook and Schwartz. Records aren't just about creators but about relationships and power dynamics. Subjects in records have a stake too. Neutrality in description isn't possible because using terms like "defectives" perpetuates harm. Archivists should intervene, add context, or change descriptions to be more respectful.

  The collecting initiative seems to run on a different theory—actively seeking marginalized voices implies records should reflect society, not just institutions. This is more aligned with a community-centered approach. But it contradicts the traditional passive collection of institutional records. So, there's a tension here. Can both coexist under one framework? Maybe in a pluralistic model, but it requires rethinking neutrality and active intervention.

  If they switched to the rival view, appraisal would prioritize records with enduring value to communities, not just legal needs. Case files might be kept for their social significance. Description would involve reparative work—adding alternative terms, explaining harmful language, collaborating with communities. Neutrality would shift to transparency about interventions and multiple perspectives.

  The user's deeper needs might be frustration with the seminar's abstractness versus their hands-on experience. They want to connect theory to practice, understand contradictions in archival work, and seek ways to make archives more equitable. They might also be questioning their role in an imperfect system and looking for actionable changes.
answer: |-
  Your questions cut to the core of archival theory and expose fundamental tensions in the profession. Let's break this down:

  ### 1. **The Dominant Theory Behind Appraisal & Description (Your First Pair)**
     * **Theory:** This is the **Institutional/Provenancial Paradigm** (sometimes called the "Custodial Tradition" or "Jenkinsonianism" after Sir Hilary Jenkinson).
     * **What a Record Is:** A record is **evidence of the creator's function, activity, and transaction**. Its primary value is **evidential** – proving *what the organization did* and *how it operated*. Authenticity and impartiality are paramount.
     * **Underlying Assumptions:**
       * **Creator Primacy:** The creating body (the county agency) defines the context and meaning of the record. Their filing systems and vocabulary are essential evidence of *their* activities.
       * **Impartial Evidence:** Archives provide raw, unmediated evidence of past actions. Editorializing (changing titles, adding modern terms) contaminates this evidence.
       * **Administrative Continuity:** Records are kept primarily to serve the ongoing legal, fiscal, and administrative needs of the *creator* or its successor body (the county government). Historical/social value is secondary.
       * **Neutrality as Passivity:** "Neutrality" is interpreted as *non-interference* – preserving the record *exactly as the creator left it* and describing it *only using the creator's language and structure*.

  ### 2. **What This Theory Rules Out**
     * **The "People-Centered" or "Social Justice" Paradigm:** This rival view (championed by scholars like Terry Cook, Joan Schwartz, Verne Harris, and community archives movements) sees records as:
       * **Evidence *about* the people documented:** The experiences, identities, and lives of individuals (like the poor farm residents) are seen as having inherent value.
       * **Sites of Power & Relationships:** Records aren't neutral evidence; they are *created* by power structures (like the poor farm administration) and often reflect and reinforce the biases, perspectives, and control of the creator *over* the documented subjects.
       * **Subject Agency:** The people documented have a stake in the records, even if they didn't create them. Their perspective and the potential harm caused by the language/context matter.
       * **Neutrality as Myth:** Using the creator's inherently biased language ("inmates," "defectives") *isn't neutral*; it actively perpetuates the creator's viewpoint and silences/demeans the subjects. True neutrality requires acknowledging and contextualizing this bias.

  ### 3. **Is "Neutrality" Coherent Here?**
     * **No, it's largely incoherent as true impartiality.** It functions as **"Creator Neutrality" by default**.
       * **Whose Viewpoint Wins?** The creator's perspective is enshrined as the objective truth. The language of power becomes the archival language.
       * **Consequence:** The "neutral" stance actively obscures the power imbalance inherent in the records' creation and silences the voices and perspectives of the documented subjects. It pretends the archivist isn't making a choice, when in fact choosing *not* to intervene is a powerful choice that maintains the status quo.

  ### 4. **The Collecting Push: Contradiction or Compatible?**
     * **It Runs on a *Different* Theory:** The collecting push operates on a **Documentary Strategy / Community-Centered Paradigm**.
       * **Goal:** Actively build a more representative historical record by collecting evidence *from* or *about* previously marginalized communities.
       * **Theory of the Record:** Records are valuable as **evidence of community experience, identity, and perspective**, not just evidence of institutional function. Authenticity comes from the community context, not just administrative provenance.
     * **Contradiction:** Yes, a significant one exists.
       * **Passive vs. Active:** Traditional appraisal passively accepts what institutions discard; collecting actively seeks what institutions ignored or suppressed.
       * **Creator Focus vs. Subject/Community Focus:** Traditional description centers the agency; collecting centers the community.
       * **"Neutrality" vs. Intervention:** Traditional practice hides behind "non-interference"; collecting is an explicit intervention to correct an imbalance.
       * **Implicit Value Judgment:** The collecting push implicitly acknowledges that the existing holdings (shaped by traditional appraisal/description) are *inadequate* and *unrepresentative* – a direct challenge to the sufficiency of the "neutral custodial" model.

  ### 5. **Concrete Changes Under a People-Centered/Social Justice Paradigm**
     * **Appraisal:**
       * **Shift in Criteria:** Move beyond purely administrative/legal value. Actively consider **enduring social, cultural, and human rights value**. Ask: "Does this record provide essential evidence about the lives/experiences of individuals or communities?" "Does it document power structures or marginalized groups?"
       * **Case Files:** Individual case files (like poor farm residents) would likely be appraised *higher* as unique evidence of individual lives and institutional treatment. Their destruction would require much stronger justification. Sampling strategies might focus on representativeness or significance to community history, not just administrative efficiency.
       * **Community Input:** Consult with descendant communities or relevant stakeholder groups *during* appraisal for records concerning them (e.g., "Would these poor farm records be valuable to your community's history?").
     * **Arrangement & Description:**
       * **Reparative Description:** Acknowledge harmful language. Add contextual notes: "The term 'defectives' was used by the Superintendent to describe residents with physical or mental disabilities, reflecting contemporary attitudes now recognized as discriminatory and dehumanizing."
       * **Enhanced Access Points:** Add subject headings, personal names, geographic locations, and community-relevant keywords *not* present in the original titles. Go beyond "Inmate Case Files" to include terms like "Poor Farm Residents," "Institutionalization," "[County Name] Poor Farm," names of individuals (where privacy allows), "Poverty -- [County] -- History," "People with Disabilities -- Institutional Care."
       * **Provenance Reimagined:** Maintain creator context but *also* document the context of the *subjects* and the *power relationship* inherent in the records' creation.
       * **Collaboration:** Work with communities to develop respectful and accurate descriptions, controlled vocabularies, and finding aid structures.
       * **Transparency over "Neutrality":** Be transparent about interventions made in description and why. Explain the biases present in the original records.
       * **Aggressive Redescription Projects:** Prioritize reviewing and revising legacy descriptions containing harmful or obscure language.

  **In essence:** Swapping paradigms means shifting the core purpose from preserving evidence *of institutional activity for the institution* to preserving evidence *of human experience and societal structures for society*, with a critical awareness of power and representation. "Neutrality" transforms from passive non-interference to active transparency, contextualization, and a commitment to reducing harm and increasing equity in the historical record. The collecting push highlights the *need* for this shift but operates under different rules until the core functions of appraisal and description are fundamentally rethought.
