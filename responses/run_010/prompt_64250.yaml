prompt: |-
  I'm running a small grad seminar on updating and I've decided the useful thing to hand my students is a document, not another lecture from me. So here's the thing I want you to draft.

  Two people have been arguing about uncertain evidence for years and they've mostly been arguing past each other:

  - **Strict** holds that all real learning is becoming certain of *something*. Maybe not certain of a claim about the world — but at least certain of a claim about how things look to you right now, the "I'm being appeared-to in such-and-such a way" style of proposition. On her view probability kinematics is a derived bookkeeping device at best, and if you think you've learned without becoming certain of anything you've misdescribed your own situation.
  - **Kinetic** holds that some learning is irreducibly uncertain: there are updates where nothing in your algebra goes to 1, and where shifting the probabilities across a partition while holding your conditional credences off that partition fixed is simply what rationality requires. He thinks Strict's phenomenal propositions are either too coarse to do the work or too fine for the agent to have.

  Write the joint statement the two of them could actually sign at the end of a good-faith adversarial collaboration. Format: a numbered agreed-claims section, then a disagreements table, then the cruxes.

  In the disagreements table, each row needs the disagreement stated twice — once in wording Strict would accept as a fair statement of her own view, once in wording Kinetic would accept for his. Not neutral mush, not straw. Where you think a putative disagreement is verbal or a difference in modeling bookkeeping, say so and say which one, and don't just quietly drop it from the table.

  For the cruxes, I want the sub-questions where settling it would actually move at least one of them, and for each crux a case or argument both accept as bearing on it, with each side's prediction written down *before* the answer. Work at least these three cases in somewhere:

  1. **The dial.** A tech reads a gauge in bad light. The needle is somewhere in a band spanning three marked regions, R1, R2, R3. Her credences go from (.2, .5, .3) to (.1, .6, .3), and she'll tell you flat out that nothing about the needle became certain and that she couldn't characterize her own experience in enough detail to pin down where those numbers came from. Both sides have to answer: what does she now have that she didn't have before, and what fixes the new numbers?
  2. **Conditional-form news.** The report you recieve is itself conditional: if the shipment went north, then the probability it's in the blue warehouse is three-quarters. You had no view at all about whether it went north. Both have to say what happens to your unconditional credences, and whether the answer is even determined. (This is in the neighborhood of that Judy Benjamin case, but don't fuss about the attribution.)
  3. **Non-rigid news.** Same dial, but the news also disturbs your credences *within* each region — you find out the gauge was lit by a red lamp, which changes how you'd bet inside R2. The kinematic rule doesn't apply anymore. Both have to say what, if anything, still constrains the update, and whether this is a refutation of the framework or just a sign it's incomplete.

  Two more things I want pressed on them explicitly. First: state the conditions under which Strict's phenomenal-certainty route and Kinetic's rule provably give the same numbers, and the conditions under which they provably can't. If they only coincide when the update is rigid, that's a finding and it belongs in the document. Second: I'm pretty sure there's a line of work suggesting that a rigid kinematic update can always be reproduced by ordinary conditionalization on some newly introduced proposition — call it virtual evidence, add it to the algebra, done. If that's right, does the dispute collapse, and if not, what survives it? Make each of them answer that in their own voice.

  Also give me a short closing section on what each would give up: the cheapest concession available to each side, and what evidence or argument would make them give up the whole position rather than a piece of it.

  One last request, and it matters for how I use this in class. Keep straight what's genuinely settled among people who work on this and what's still live. When something goes in the agreed-claims list, tag it in brackets as either real consensus or a local truce these two struck for the sake of the document — a lot of what they can sign will be the second kind, and I don't want my students walking away thinking the field is more agreed-upon than it is. If you think one of these positions is close to dead, say that too instead of staging a fake balance. Just don't dress a contested view up as the consensus.
reasoning: |-
  We are drafting a joint statement for Strict and Kinetic after adversarial collaboration.
   The document will have:
    1. Numbered agreed claims (tagged as [consensus] or [local truce])
    2. Disagreements table (each row has Strict's wording and Kinetic's wording for the same disagreement)
    3. Cruxes (sub-questions that would move at least one side, with a case/argument and predictions)
    4. Explicit pressing: conditions for when Strict and Kinetic methods coincide and when they don't; the virtual evidence argument and whether the dispute collapses.
    5. Closing: cheapest concession from each, and what would make them give up the whole position.

   Also, we must address the three cases: The dial, Conditional-form news, Non-rigid news.

   Let's start by outlining the agreed claims.

   Agreed Claims (numbered):
    [We tag each as either [consensus] or [local truce]]

    1. [consensus] Both agree that rational agents update their credences in response to evidence.
    2. [consensus] Both agree that conditionalization (Bayesian updating on certain evidence) is a valid update rule when an agent becomes certain of a proposition in their algebra.
    3. [local truce] Both agree that in some cases, an agent's credence distribution changes without any proposition in the original algebra becoming certain. (Strict would say that in such cases the agent must have become certain of a phenomenal proposition not in the original algebra, but for the sake of the truce, they agree on the surface phenomenon.)
    4. [consensus] Both agree that the Jeffrey (kinematic) update rule is a well-defined mathematical operation that can be applied to a partition when the new probabilities on that partition are specified and when the conditionals off that partition remain fixed.
    5. [local truce] Both agree that if an agent's update can be represented as conditionalization on a newly introduced proposition (virtual evidence) that is consistent with the agent's total evidence, then that is a legitimate way to model the update. (Strict sees this as fundamental, while Kinetic sees it as one way among others, but they agree it's a legitimate modeling tool.)
    6. [consensus] Both agree that rationality requires coherence (avoiding Dutch books) and that after updating, the agent's credences should satisfy the probability axioms.

   Now, the Disagreements Table:

   We must state each disagreement twice: once in Strict's terms, once in Kinetic's.

   Disagreement 1: On the nature of learning in the absence of certainty in the original algebra.
     - Strict's wording: "In any genuine learning episode, the agent becomes certain of at least one proposition that describes the content of their experience (a phenomenal proposition), even if that proposition is not in the original algebra. The agent's update is then equivalent to conditionalization on that proposition, and any appearance of uncertain updating is due to a coarse-grained description of the evidence."
     - Kinetic's wording: "Learning can occur without becoming certain of any proposition, including any phenomenal proposition. In such cases, the update is irreducibly uncertain and must be represented by a shift in probabilities across a partition while holding conditional probabilities fixed off that partition, as per the kinematic rule."

   Disagreement 2: On the necessity of phenomenal propositions for a complete account of updating.
     - Strict's wording: "Phenomenal propositions (which capture the exact way the world appears to the agent) are necessary to ground any update because they are the immediate objects of certainty in experience. Without such propositions, we cannot account for the constraints that experience imposes on our credences."
     - Kinetic's wording: "Phenomenal propositions are either too coarse to capture the nuances of uncertain evidence (because they force certainty) or too fine to be accessible to the agent (because the agent cannot form precise enough propositions about their experience). Therefore, they are not necessary for a complete account of updating; the kinematic rule operates without them."

   Disagreement 3: On the status of the kinematic rule.
     - Strict's wording: "The kinematic rule is a derived bookkeeping device that approximates the effect of conditionalization on phenomenal propositions when we only care about a coarse partition. It is not a fundamental rule of rational updating."
     - Kinetic's wording: "The kinematic rule is a fundamental rule of rational updating that applies directly to cases of uncertain evidence without needing to be reduced to conditionalization on phenomenal propositions."

   Note: We must not drop any disagreement as merely verbal without explicit note. We think Disagreement 1 might be partly verbal? But they genuinely disagree on whether there is always a phenomenal proposition that the agent becomes certain of. So we leave it as substantive.

   Now, Cruxes:

   We have three cases to work in, plus the two explicit requests.

   Crux 1: The Dial Case
     - Case description: A tech reads a gauge in bad light. The needle is in a band spanning three regions R1, R2, R3. Her credences go from (.2, .5, .3) to (.1, .6, .3). She reports that nothing about the needle became certain and that she couldn't characterize her experience in enough detail to pin down the numbers.
     - Question: What does she now have that she didn't have before, and what fixes the new numbers?
     - Strict's view: She became certain of a phenomenal proposition that describes her visual experience (e.g., "I am having an experience as of the needle being in a band that makes R2 somewhat more likely than before, but without certainty"). The new numbers are fixed by her prior conditional credences given that phenomenal proposition. The fact that she cannot articulate the details does not mean such a proposition doesn't exist; it just means she lacks the concepts to express it precisely.
     - Kinetic's view: She had an uncertain learning experience that directly shifted her credences over the partition {R1, R2, R3}. The new numbers are fixed by the constraints of the experience (which she might describe as "R2 seems a bit more plausible now") and the requirement that conditional credences within each region (if she had any) remain fixed. The shift is constrained by rationality to be a Jeffrey update.

     - Predictions for what would move them:
          - If it were shown that the agent cannot even in principle form a phenomenal proposition that would yield the exact shift, that would challenge Strict.
          - If it were shown that the agent can form a phenomenal proposition that exactly captures the shift, that would support Strict and challenge Kinetic's irreducibility claim.

   Crux 2: Conditional-form News
     - Case: The report is conditional: "If the shipment went north, then the probability it's in the blue warehouse is three-quarters." You had no prior view about whether it went north.
     - Question: What happens to your unconditional credences? Is the answer determined?
     - Strict's view: The report must be interpreted as a piece of evidence that the agent becomes certain of. One option is to treat it as learning a conditional probability statement, which would require introducing a new proposition (e.g., "The source said that if north then P(blue)=3/4"). Then the update is conditionalization on that proposition. The unconditional credences are determined by the agent's prior and the new evidence. However, without a specific phenomenal proposition, Strict might say the agent becomes certain of the content of the report as understood (which is a proposition about the world, but conditional). Alternatively, she might say the agent becomes certain of having heard that conditional statement. Either way, the update is by conditionalization on that new proposition.
     - Kinetic's view: The news is a constraint on the agent's posterior probabilities. It sets P(blue | north) = 3/4. But since the agent had no prior about north, this constraint does not fully determine the posterior. The kinematic rule (which typically requires a partition and new probabilities for each cell) does not apply directly. Kinetic might say that this is a case where the update is underdetermined by the evidence without additional constraints (like minimizing information gain). However, he would not require becoming certain of any proposition. The answer is not fully determined by the evidence alone.

     - Predictions:
          - Strict: The update is always determined because the agent becomes certain of a particular proposition (the report) and then conditionalizes. The result is determined by the prior and that proposition.
          - Kinetic: Without additional constraints, the update is underdetermined. Rationality does not require a unique update in such cases.

     - Note: This is similar to the Judy Benjamin problem.

   Crux 3: Non-rigid News
     - Case: Same dial, but the news (red lamp) also disturbs conditional credences within R2. So the kinematic rule (which holds conditionals fixed) doesn't apply.
     - Question: What, if anything, constrains the update? Is this a refutation of the kinematic framework?
     - Strict's view: The agent becomes certain of a phenomenal proposition that includes the effect of the red lamp. This proposition will then affect the conditional probabilities within R2. The update is still conditionalization on that phenomenal proposition, so it is constrained by the prior and the evidence. It does not refute the fundamental role of conditionalization because the non-rigidity is captured by the content of the phenomenal proposition.
     - Kinetic's view: The kinematic rule is a special case when the conditionals off the partition remain fixed. When that doesn't hold, the rule doesn't apply, and we need a more general update rule. This is not a refutation of the kinematic framework but shows it is incomplete. Constraints might come from the principle of minimal change or other principles, but without a rule as simple as Jeffrey's.

     - Predictions:
          - Strict: The fact that conditionals change is explained by the content of the phenomenal proposition. The framework is intact.
          - Kinetic: This shows that the kinematic rule is not universally applicable, but it doesn't refute the existence of irreducibly uncertain updates. We need to extend the framework.

   Now, the explicit pressing:

   1. Conditions for when Strict and Kinetic methods coincide and when they don't:
      - They coincide when the update is rigid (i.e., the conditional probabilities off the partition remain fixed). In that case, the Jeffrey update can be seen as conditionalization on a virtual evidence proposition that is a disjunction of the partition elements weighted appropriately. 
      - They do not coincide when the update is non-rigid (conditional probabilities change). Then, the Jeffrey update is not applicable, and Strict would still insist on conditionalization on a phenomenal proposition, which might lead to a different update than any rigid rule.

      This finding should be in the agreed claims? Or in the cruxes? We'll put it in the agreed claims as a [local truce] because they both agree on the mathematical fact.

      Agreed claim 7: [local truce] When an update is rigid (i.e., the conditional probabilities given each cell of a partition remain unchanged), then the Jeffrey update rule and conditionalization on a virtual evidence proposition (that is consistent with the evidence) yield the same result. However, when the update is non-rigid, the Jeffrey rule does not apply, and the two methods may diverge.

   2. The virtual evidence argument: 
      - There is a line of work (e.g., by Jeffrey, Garber, and others) showing that a rigid kinematic update can be represented as conditionalization on a newly introduced proposition (virtual evidence). 

      Question: Does this collapse the dispute?

      - Strict's answer: "Yes, because it shows that every rigid Jeffrey update is equivalent to conditionalization on a proposition (the virtual evidence). This reinforces the view that all learning involves becoming certain of something (the virtual evidence proposition). Therefore, the kinematic rule is not fundamental but derived."
      - Kinetic's answer: "No, because the virtual evidence proposition is not the content of the agent's experience. The agent does not become certain of that proposition; they are not even aware of it. The update is driven by the uncertain evidence, and the virtual evidence is just a mathematical trick to represent it. The fundamental reality is the shift in probabilities, and the virtual evidence is a modeling artifact. Moreover, in cases of non-rigid updates, the virtual evidence approach may be more complex and less natural than other methods."

   Now, the closing: cheapest concession and what would make them give up.

    - Strict's cheapest concession: She might concede that for practical purposes, the kinematic rule is a useful tool when we are only interested in a coarse partition and don't want to model the phenomenal propositions explicitly. But this is a concession about modeling convenience, not about the fundamental nature of updating.
    - Kinetic's cheapest concession: He might concede that in some cases, the agent does become certain of a phenomenal proposition, but that this is not necessary for all updates. Some updates are irreducibly uncertain.

    - What would make Strict give up: If it were proven that there are updates that cannot be represented as conditionalization on any proposition (even a phenomenal one) without violating the constraints of the evidence, she would have to abandon her view. (But she might then question whether such an update is rational.)
    - What would make Kinetic give up: If it were proven that every update that satisfies the constraints of rationality must be representable as conditionalization on a proposition that the agent becomes certain of (and that proposition is accessible to the agent), then he would give up. Alternatively, if a more general update rule that handles non-rigid cases were shown to always require becoming certain of something, that might also challenge him.

   Finally, we note that in the field, the view that updating can be uncertain is widely accepted (so Kinetic is closer to consensus), but there is still debate about the foundations. The virtual evidence representation is a known result, but its philosophical interpretation is contested.

   Let's structure the document accordingly.
answer: |-
  ### Joint Statement: Strict and Kinetic on Updating Under Uncertain Evidence

  After extensive adversarial collaboration, we (Strict and Kinetic) present this joint statement to clarify agreements, disagreements, and cruxes in our debate about uncertain evidence. We bracket foundational philosophical differences to identify precise points of contention and potential resolution paths. Where noted, agreements reflect either established consensus in formal epistemology or local truces for this document.  

  ---

  #### **1. Agreed Claims**  
  1. **Updating requires coherence.** Rational agents revise credences in response to evidence while avoiding Dutch books and maintaining probabilistic coherence. [**Consensus**]  
  2. **Conditionalization is valid for certain evidence.** When an agent becomes certain of a proposition \(E\) in their algebra, Bayesian conditionalization (\(P_{\text{new}}(H) = P_{\text{old}}(H | E)\)) is the rational update. [**Consensus**]  
  3. **Jeffrey’s rule is mathematically well-defined.** For a partition \(\{B_i\}\), updating via probability kinematics (\(P_{\text{new}}(H) = \sum_i P_{\text{new}}(B_i) \cdot P_{\text{old}}(H | B_i)\)) is a coherent operation when \(P_{\text{new}}(B_i)\) is specified and \(P_{\text{old}}(H | B_i)\) is held fixed. [**Consensus**]  
  4. **Rigid updates coincide under both frameworks.** When an update is *rigid* (i.e., conditional probabilities given partition elements are unchanged), Jeffrey’s rule is provably equivalent to conditionalization on a "virtual evidence" proposition \(V\) constructed to yield identical posterior probabilities. [**Local truce**]  
  5. **Non-rigid updates diverge.** When an update is *non-rigid* (conditional probabilities shift within partition elements), Jeffrey’s rule does not apply, and Strict/Kinctic methods may produce different results. [**Local truce**]  
  6. **Virtual evidence is a formal tool.** Any rigid kinematic update can be represented as conditionalization on a newly introduced proposition \(V\). [**Consensus**]  
  7. **Phenomenal propositions are elusive.** Agents often lack the introspective access or conceptual vocabulary to precisely articulate propositions about their sensory experiences (e.g., "I am appeared to thusly"). [**Local truce**]  

  ---

  #### **2. Disagreements Table**  
  Each row states the same disagreement in both parties’ preferred terminology.  

  | Strict’s Wording (Acceptable to Strict)                                                                                                                                 | Kinetic’s Wording (Acceptable to Kinetic)                                                                                                                               |  
  |-------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Learning requires certainty:** All genuine learning involves becoming certain of *some* proposition (e.g., a phenomenal claim). Probability kinematics is a derived shortcut for coarse-grained bookkeeping, not a fundamental update rule. | **Learning can be irreducibly uncertain:** Some updates (e.g., Jeffrey’s rule cases) involve no proposition becoming certain. Probability kinematics is a fundamental rational constraint when evidence is uncertain. |  
  | **Phenomenal propositions are indispensable:** Only phenomenal propositions (describing how things seem) can ground updates. Without them, evidence constraints are underspecified or incoherent.                                        | **Phenomenal propositions are inadequate:** They are either too coarse (failing to capture uncertainty) or too fine (inaccessible to agents) to explain updates. Kinematic rules operate without them. |  
  | **Kinematics reduces to conditionalization:** Jeffrey’s rule is a computational approximation of conditionalization on phenomenal propositions. "Uncertain evidence" is a misdescription of the agent’s epistemic state.                     | **Kinematics is irreducible:** Jeffrey’s rule is a primary rational requirement for uncertain evidence. It is not reducible to conditionalization, as no proposition (phenomenal or otherwise) is learned with certainty. |  

  ---

  #### **3. Cruxes**  
  Sub-questions where empirical/theoretical progress would shift positions. Cases include predictions from both sides.  

  **Crux 1: The Dial Case**  
  - *Case*: A tech’s credences over gauge regions \(\{R1, R2, R3\}\) shift from \((.2, .5, .3)\) to \((.1, .6, .3)\). She insists nothing became certain, and she cannot introspect the basis for the numbers.  
  - **Question**: What fixes the new credences, and what does she gain?  
    - **Strict’s prediction**: She became certain of a phenomenal proposition (e.g., "I am appeared to *thusly*"), which, combined with her priors, fixes the shift. Her inability to articulate it reflects limited introspection, not absence.  
    - **Kinetic’s prediction**: She underwent an irreducibly uncertain update. The numbers are fixed by the *constraint of her experience* (e.g., R2 seeming more plausible), with rigidity preserving her conditionals.  
  - **Crux for resolution**: If cognitive science shows agents *cannot* form phenomenal propositions matching the kinematics (e.g., no introspective state correlates with precise partition shifts), Strict loses ground. If agents *can* always report such propositions, Kinetic does.  

  **Crux 2: Conditional-Form News**  
  - *Case*: You learn, "If the shipment went north, then \(P(\text{blue warehouse}) = 0.75\)." You had no prior credence about "north."  
  - **Question**: What happens to your unconditional credences? Is the update determined?  
    - **Strict’s prediction**: You become certain of a proposition (e.g., "The source asserted the conditional"), and update by conditionalization. Unconditional credences are fully determined.  
    - **Kinetic’s prediction**: The update is underdetermined. You must adopt new conditionals (e.g., \(P(\text{blue} | \text{north}) = 0.75\)), but rationality permits multiple coherent extensions (à la Judy Benjamin).  
  - **Crux for resolution**: If a unique rational posterior is demonstrated (e.g., via minimization principles), Kinetic revises. If underdetermination persists, Strict must explain how phenomenology fixes it.  

  **Crux 3: Non-Rigid News**  
  - *Case*: Same dial, but red-lamp evidence distorts your credences *within* \(R2\) (e.g., you now doubt sub-regions of R2). Rigidity fails.  
  - **Question**: What constrains the update? Is this fatal to either framework?  
    - **Strict’s prediction**: Phenomenal certainty still applies (e.g., "I am appeared to *redly*"), fixing the update via conditionalization. This shows kinematics is incomplete, not flawed.  
    - **Kinetic’s prediction**: Jeffrey’s rule is inapplicable, but uncertain updates persist. Constraints come from minimal change principles (e.g., maximize entropy). This is an *extension* challenge, not a refutation.  
  - **Crux for resolution**: If non-rigid updates *require* phenomenal certainty to avoid arbitrariness, Strict wins. If kinematic-like rules extend naturally (e.g., via inputting new conditionals), Kinetic’s view holds.  

  ---

  #### **4. Virtual Evidence: Does It Collapse the Dispute?**  
  - **Strict’s answer**: "Yes. Virtual evidence \(V\) shows that rigid kinematics *is* conditionalization. \(V\) is the phenomenal proposition (or its proxy). Kinetic’s ‘irreducible’ updates reduce to becoming certain of \(V\), affirming my view."  
  - **Kinetic’s answer**: "No. \(V\) is a mathematical artifact, not a proposition the agent learns or grasps. The agent only experiences *uncertain constraints* (e.g., ‘R2 seems likelier’). Virtual evidence formalizes the update but doesn’t eliminate its uncertain core."  
  - **Surviving disagreement**: The status of \(V\) (real vs. instrumental) and whether "becoming certain of \(V\)" accurately describes the agent’s psychology.  

  ---

  #### **5. Closing: Concessions and Falsifiability**  
  - **Cheapest concession each would make**:  
    - *Strict*: "I concede that for *practical purposes*, kinematics is often the only feasible method when agents lack access to phenomenal propositions."  
    - *Kinetic*: "I concede that in *some cases*, agents may become certain of coarse-grained propositions (e.g., ‘the gauge looks blurry’), but this doesn’t cover all updates."  
  - **What would falsify their core position**:  
    - *Strict*: "If an agent can rationally update *without any proposition (even phenomenal) becoming certain*, my view fails." (Test case: An AI with no phenomenology performs rigid kinematics.)  
    - *Kinetic*: "If every update *must* be described as becoming certain of a proposition to avoid incoherence, my view fails." (Test case: Showing non-rigid updates reduce to conditionalization on \(V\).)  

  ---

  #### **Field Consensus vs. Local Truces**  
  - **Consensus items** (agreed in literature): Claims 1–3, 6. Jeffrey’s rule is widely accepted for rigid updates, and virtual evidence is a standard tool.  
  - **Local truces** (our negotiated agreements): Claims 4–5, 7. The reducibility of kinematics and the role of phenomenology remain contested.  
  - **State of the field**: Kinetic’s view dominates formal epistemology (e.g., Jeffrey, van Fraassen). Strict’s position is a minority but resilient stance, often seen in foundationalist responses to probabilism. Neither is "dead," but Strict’s view requires heavier justificatory lifting in light of virtual evidence results.  

  ---  
  **Signed**,  
  Strict & Kinetic  
  *Adversarial collaborators, 2023*
