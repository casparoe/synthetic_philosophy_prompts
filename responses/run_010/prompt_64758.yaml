prompt: |-
  I'm the science program director at a mid-sized private foundation. I run a coastal ecosystems portfolio — about $6M a year — and twice a year a panel and I have to decide which incumbent programs keep their money, which get conditions attached, and which get wound down over a few years. Our reviewers are working marine ecologists and biogeochemists, no philosophers, and we allow ourselves roughly forty minutes per renewal, most of which goes to arguing about the PI's last three papers.

  Here's the problem I'm trying to solve. Our memos and decline letters have quietly drifted into reasons that don't actually justify anything: "this framework isn't testable," "they keep patching it," "nobody in the field believes it anymore," "it hasn't been refuted but it hasn't produced anything either." Each of those sounds like a verdict and is really a mood. I've been reading Lakatos on research programmes and I think his apparatus is much closer to what we're groping toward than our reviewers realize, but I obviously can't hand a panel a sixty-page essay.

  So: build me the decision procedure. Steps in order, what at each step counts as a sufficient answer versus a dodge, what the possible outputs are, and the points where the procedure stops and hands the call to me or to the board because what's left is a question about our risk appetite rather than about the science. Assume the people running it are smart and busy and have never heard the term protective belt — so I need you to be explicit about which of Lakatos's distinctions absolutely have to survive the simplification, because dropping them turns the thing back into ordinary peer review with extra vocabulary, and which ones I can safely throw away. Two constraints you should design around: our bylaws require every proposal to get a continue-or-stop recommendation with no abstentions, and our outside counsel insists the word unfalsifiable never appears in a letter. Tell me where those rules collide head-on with the theory.

  Then run it on three things I inherited, all aimed at the same question — why some seagrass meadows knocked out by nutrient runoff never come back even decades after the runoff stops:

  1. "Bistable meadows." Core: a meadow sits in one of two self-reinforcing states, and collapse is a switch between them rather than a smooth response to load. Twenty-two years of our money. Every anomaly since — sites that recovered with no obvious feedback change, sites that collapsed at very low loads — has been answered by adding another stabilizing mechanism to the belt: sulfide intrusion, waterfowl grazing, sediment resuspension, seed-bank depletion. Each is independently plausible, none was predicted in advance by the core, all were proposed after the anomaly. Two of the four now imply opposite management actions. The program has never called a result in a system it hadn't already studied. Huge lab, famous PI, half the field trained by her, our board adores her.

  2. "Supply-side recovery." Core: whether a cleared site recovers is set by propagule supply from upstream source meadows, not by local conditions. It made two risky predictions — reseeding fails at sites far from a source no matter how clean the local water is, and recovery time scales with distance-to-source in a particular way — and both were confirmed by unaffiliated groups in two other regions. One anomaly: a site recovered with no plausible source within sixty kilometers. The answer was "cryptic local refugia," small surviving patches below survey detection, which is now doing a lot of heavy lifting and is being tested by a new deep-water survey method, results due next spring. The program says nothing at all about the collapse side.

  3. "Microbial legacy." Core: what makes a site unrecoverable is a persistent change in sediment chemistry and microbial community — the sediment remembers. Four years old, one PI, two postdocs, four papers, no big field campaigns. The core implies a testable and rather surprising claim, that sites with near-identical water-quality histories will differ in recovery according to a measurable pore-water signature, and a pilot assay is running now. Nothing confirmed, nothing refuted, and the PI is candid that if the assay fails the core is in trouble. Cheapest of the three by a wide margin.

  One of those three is going to come out in a way I'll hate. Say which and why, and don't soften it.

  After the runs, the limits section, and this is where I most want you to be blunt: where will this procedure systematically misfire — what kind of science does it reward and what does it punish, given that it seems to love cheap risky predictions and instrument-building programs that take fifteen years will look inert? What should it do in a field where we are the only funder and there is exactly one program, no rival at all, which describes maybe half my portfolio? How does it handle the case where two programs are both progressive and nothing in the rules picks between them — I don't want a fake tiebreaker, I want it to say so out loud. And I have a vague memory that Lakatos himself had an example, something in the history of atomic weights, where a written-off program came back decades later; tell me if I'm misremembering, and if I'm not, how the procedure is supposed to carry that worry without paralyzing every decision we make. Finally, point out where my reviewers' instincts are actively anti-Lakatosian, and where the theory is going to hand respectable cover to something we all privately think is bad science.

  Please write in American English. No reading list, no bibliography, no footnotes — I want the procedure itself, short enough that a panelist could hold it in one hand, with the three case runs and the limits after it.
reasoning: |-
  Okay, let me tackle this complex request from the science program director. The core challenge is designing a practical decision procedure based on Lakatos' research programmes theory that fits within their real-world constraints: 40-minute renewals, no philosophers on panel, and specific legal/bylaw requirements.

  First, I need to distill Lakatos' key concepts into actionable steps without jargon. The essential distinctions that must survive simplification are:
  - Core theory vs protective belt
  - Progressive vs degenerating shifts
  - Predictive novelty vs post-hoc adjustments
  These are non-negotiable because they define what makes a research programme scientifically valuable versus one that's just treading water.

  The constraints require careful handling:
  - The "no unfalsifiable" rule means we'll use "untestable" in letters instead
  - Mandatory continue/stop decisions mean we need clear thresholds
  - Risk appetite decisions must be explicitly flagged for board intervention

  For the procedure itself, I'm imagining a flowchart with five key questions:
  1. What's the core claim? (Must be stable, non-negotiable)
  2. What anomalies has it faced? (List concrete contradictions)
  3. How did the programme respond? (Scored as progressive/degenerating)
  4. What's the track record? (Confirmed predictions vs post-hoc patches)
  5. What's the trajectory? (Future testability and cost considerations)

  The three cases present perfect test scenarios:
  - Bistable Meadows clearly shows degenerating tendencies with endless ad-hoc patches
  - Supply-Side has strong predictive success despite one anomaly
  - Microbial Legacy is high-risk/high-reward with its make-or-break assay

  Where this will systematically misfire:
  - Favors programs making frequent testable predictions (punishes long-term instrumentation projects)
  - Struggles with monopoly programmes (need supplemental criteria)
  - Requires clear "tiebreaker not possible" declaration when two progressives compete

  Reviewers' instincts that conflict with Lakatos:
  - Overvaluing "consensus belief" rather than predictive power
  - Mistaking complexity for degeneracy (some patches are legitimate)
  - Underappreciating high-risk cores with few but crucial tests

  The atomic weights example (Prout's hypothesis) shows how we build in a "hibernation clause" - if a degenerating programme develops new testable tools, it can be paused rather than killed.

  The output needs to be brutally honest about which programme would get cut (Bistable Meadows) and why, while acknowledging this might be the one the board loves. No softening.
answer: |-
  Here's your decision procedure, case applications, and limitations analysis. Designed for 40-minute renewals by working scientists. Lakatos distilled to four essential distinctions: **Core Theory** (untouchable axioms), **Protective Belt** (adjustable components), **Progressive Shifts** (predictive novel facts), **Degenerating Shifts** (endless post-hoc patches).

  ---

  ### **Research Programme Renewal Procedure**  
  *(5 Steps, 1 Page Max)*

  **Step 1: State the Core**  
  *Ask: What is the non-negotiable central claim? What would kill the program if disproven?*  
  → **Sufficient:** Clear, testable statement that explains the phenomenon.  
  → **Dodge:** Vague core, core changed in response to data, or core cannot be tested.  
  → **Output:** Core defined or flagged for decline.  

  **Step 2: Anomaly Audit**  
  *Ask: What key observations contradict the core or belt? List max 3 major anomalies.*  
  → **Sufficient:** Specific empirical mismatches (e.g., "Site X recovered with no source meadow").  
  → **Dodge:** Dismissing anomalies as "noise" without engagement.  
  → **Output:** Anomalies documented or core flagged as unfalsifiable (use "untestable" in letters).  

  **Step 3: Belt Adjustment Scoring**  
  *Ask: How did the program respond to anomalies?* Score each response:  
  - **Progressive (Keep):** Predicted **novel facts** later confirmed (e.g., "Predicted recovery time scales with distance").  
  - **Degenerating (Flag):** Added **post-hoc patches** with no new predictions (e.g., "Added sediment resuspension to explain collapse after observing it").  
  - **Neutral (Monitor):** Belt change led to new **testable predictions** not yet verified.  
  → **Output:** Majority progressive → renew; majority degenerating → wind down; neutral → short renewal with conditions.  

  **Step 4: Track Record**  
  *Ask: Did the core predict anything surprising and true *before* observation?*  
  → **Sufficient:** ≥1 confirmed novel prediction (by any team).  
  → **Dodge:** Retroactive "predictions" or claims about non-falsifiables (e.g., "It explains all cases").  
  → **Output:** Novel predictions confirmed → strong renew; none → decline unless new predictions pending (Step 5).  

  **Step 5: Future Testability**  
  *Ask: What decisive test is planned? Timeline? Cost?*  
  → **Sufficient:** Specific assay with clear pass/fail for core/belt (e.g., "Pore-water assay will confirm signature by 2025").  
  → **Dodge:** "More data needed" without threshold.  
  → **Output:** High-risk test pending → short renewal; no test → wind down.  
  → **Stop & Escalate:** To Director/Board if:  
  - Core is untestable but legally/politically sensitive.  
  - All programs degenerating but field has no rivals.  
  - Cost/benefit trade-offs exceed science criteria (e.g., "Board loves PI but science is dead").  

  **Renewal Outputs:**  
  ✅ **Renew (3–5 yrs):** Progressive shifts + confirmed predictions.  
  ⚠️ **Renew with Conditions (1–2 yrs):** Pending high-risk test or neutral shifts.  
  ⛔ **Wind Down (3-yr exit):** Degenerating shifts + no novel predictions.  

  ---

  ### **Case Applications**  

  **1. Bistable Meadows**  
  - **Core:** Two self-reinforcing states; collapse is a switch.  
  - **Anomalies:** Recovery with no feedback change; collapse at low loads.  
  - **Belt Adjustments:** Sulfide, grazing, resuspension, seed-bank patches → all **degenerating** (post-hoc, no new predictions).  
  - **Track Record:** Zero novel predictions → only explains known systems.  
  - **Future Testability:** None proposed; patches contradict each other.  
  → **⛔ WIND DOWN.** *Why: Degenerating belt, no predictive wins, core shielded by ad-hoc excuses.*  

  **2. Supply-Side Recovery**  
  - **Core:** Recovery requires propagule supply from sources.  
  - **Anomalies:** Recovery with no source within 60km.  
  - **Belt Adjustment:** "Cryptic refugia" → **neutral** (led to testable prediction: deep-water surveys).  
  - **Track Record:** **Progressive** → predicted reseeding failure & distance scaling (confirmed externally).  
  - **Future Testability:** Survey results by spring 2025 → clear pass/fail for cryptic refugia.  
  → **⚠️ RENEW 2 YEARS (conditional on survey results).** *Why: Strong predictive history; anomaly sparked testable new claim.*  

  **3. Microbial Legacy**  
  - **Core:** Sediment "memory" blocks recovery via pore-water signature.  
  - **Anomalies:** None yet (too new).  
  - **Belt Adjustments:** N/A.  
  - **Track Record:** Zero predictions confirmed → but core implies **testable novel fact** (identical histories → different recovery).  
  - **Future Testability:** Pilot assay underway → direct core test.  
  → **✅ RENEW 3 YEARS.** *Why: High-risk core with pending decisive test; cheap cost justifies risk.*  

  **The One You’ll Hate:** **Bistable Meadows** gets wound down. *Why: It’s the definition of degeneration — 22 years of patching, no predictions, core never at risk. Board love and PI fame don’t offset scientific stagnation.*  

  ---

  ### **Systematic Limits & Collisions**  

  **1. Where It Misfires:**  
  - **Punishes:** Long-term instrumentation projects (e.g., ocean sensors). They look inert until data unlocks tests. *Workaround: Flag as "pending tool-building" in Step 5.*  
  - **Rewards:** Cheap, prediction-focused programs. Small teams testing bold cores thrive.  
  - **Monopoly Programme Risk:** If one program dominates a field with no rivals, the procedure may misjudge degeneration (no alternatives to force tests). *Solution: Escalate to Director — fund seed grants for rivals.*  
  - **Tiebreaker Rule:** If two programs are equally progressive, **declare tie openly**. Outcome: Renew both or split funds. No fake science rationale.  

  **2. The "Atomic Weights" Problem:**  
  - You recall correctly: Lakatos cited **Prout’s hypothesis** (all elements are hydrogen multiples). It degenerated for decades until isotopes explained weight discrepancies, making it progressive.  
  - **Procedure Safeguard:** Short renewals for degenerating programs with *newly testable* belts (e.g., Bistable Meadows could’ve gotten 1–2 years if patches led to predictions). Don’t fund forever — but allow hibernation.  

  **3. Reviewer Instincts vs. Lakatos:**  
  - **Anti-Lakatosian:** "Nobody believes it anymore" → irrelevant. Belief ≠ progress. A lone program predicting novel facts beats a popular degenerating one.  
  - **Danger Zone:** "Hasn’t produced anything" is incomplete. A program *pending a high-risk test* (Microbial Legacy) is scientifically valid even with no "production" yet.  
  - **Bad Science Cover:** Degenerating programs may claim "complexity" to justify endless patches. The procedure forces specificity: *Did the patch predict anything new?* If no, it’s degenerative.  

  **4. Constraint Collisions:**  
  - **"No unfalsifiable" in letters:** Use "untestable core" for Step 1 failures. Avoids legal risk while meaning the same.  
  - **No abstentions:** Forces a call on monopoly/untestable cases. Escalate to Director when science criteria are exhausted (e.g., "Fund for political reasons?").  

  ---

  **Final Triage Note:** This procedure rewards **predictive boldness** and punishes **explanatory vagueness**. It won’t save a beloved PI coasting on prestige — but it will find the Microbial Legacies before they’re starved. For your portfolio: Use the "escalate" clause when the science is sound but the field lacks competition. And always, *always* demand the test.
