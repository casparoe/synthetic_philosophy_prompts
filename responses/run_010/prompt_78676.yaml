prompt: |-
  Please adopt the role of an expert in formal social epistemology and trading microstructure — someone equally fluent in Aumann-style agreement results, in no-trade theorems for agents sharing a common prior, and in models of a market maker facing a mixed order flow of informed and uninformed counterparties. Think carefully before answering. Begin with a short brainstorming section listing candidate principles that might underwrite my verdicts, including ones you expect to fail and why, and only then commit to an account.

  I am a philosophy PhD student working on the epistemology of markets, trying to establish what I actually believe about when trade is rational and when prices carry information. My verdicts:

  (1) Two risk-neutral traders with a common prior over an asset's value, each privately informed: no speculative trade between them is rational. Any bet one would take, the other's readiness to offer is itself enough to make him refuse. Firm.

  (2) Same setup, but their priors genuinely differ. Now trade is rational, and the fact of the trade tells neither party anything about who is right. Firm.

  (3) A stranger offers me even odds on a local match; my own model gives the bet positive expected value. I decline, and declining is rational, because his willingness to offer is itself evidence. Firm — the case I trust most.

  (4) A competitive market maker posts a bid and an ask to a flow of traders, some informed, some trading for reasons unrelated to their beliefs about value. He expects to lose to the first group and gain from the second, and the spread compensates. Rational, and the market healthy. Firm.

  (5) Exactly (4), with the second group removed: everyone at the counter is either informed or knows she is not. Now I think his willingness to trade is unsustainable. Firm.

  (6) Two colleagues with a common prior who know each other's credences on a policy question and still disagree. Their disagreement is fully rational, because neither has anything like common knowledge of the other's evidence. Firm, though I realize this looks like merely denying a theorem's hypothesis.

  (7) A price that revealed everything the informed know would leave no one a reason to become informed. So informational efficiency must always be strictly incomplete — a substantive constraint on markets, not a curiosity about a limiting case. Firm.

  The pair that troubles me is (3) against (4) and (5). If a counterparty's willingness to trade is always evidence, the market maker in (4) should treat every order as informed and the spread should swallow the market; yet I insist (4) is normal. And (5) says the whole difference is made by traders whose trades have nothing to do with their beliefs. That renders rational informed trade parasitic on non-informational trade, and I cannot tell whether this is a theorem, an artifact of my setup, or a sign that one of my verdicts is wrong.

  My tentative principle, which I call the "announcement test": an offer to trade — or a bet, or an argument — is rationally acceptable only if it would remain acceptable to me after both parties publicly announced that they were willing to make it. It seems to handle (1), (3), and (6), and to explain why the market maker must quote a spread rather than his prior mean, but I cannot see what it says about (5) or (7).

  Please deliver: (a) one principle, or a small set of competing ones, stated precisely enough that I could apply it to a new case without further gloss, with each clause tied to the case motivating it; (b) its verdicts on (5) and (7), and on at least two further cases you construct to probe where it is most fragile; (c) an honest statement of which of my seven verdicts it cannot accommodate, and which of those I ought to abandon; (d) a judgment on whether the announcement test is salvageable, a special case of something better, or a confusion. Argument only — no bibliography or reading list.
reasoning: |-
  Hmm, this user is a philosophy PhD student working on market epistemology. They've presented seven firm verdicts about rational trade and information in markets, but are troubled by the tension between verdict (3) (declining a stranger's bet because their offer is evidence) and verdicts (4)/(5) (about market makers thriving with mixed order flow but collapsing without noise traders).

  The user's proposed "announcement test" principle is intriguing but they're unsure how it handles cases like (5) or (7). They want me to provide a precise principle that can be applied to new cases, evaluate it against their verdicts, and judge whether their announcement test is salvageable.

  I need to think like an expert in formal social epistemology and market microstructure. Key concepts here include Aumann's agreement theorem, no-trade theorems, Glosten-Milgrom models, and the role of noise traders. The tension between (3) and (4)/(5) is central - why is a stranger's offer suspicious evidence but a market maker's quote isn't?

  The user's announcement test has merit but needs refinement. I can propose a "Counterparty Motivation Principle" that distinguishes between strategic and non-strategic counterparties. This would explain why the stranger in (3) is suspicious (their offer is strategic) while the market maker in (4) isn't (they're mechanically providing liquidity).

  For (5), this principle would say the market fails because without noise traders, every counterparty is strategic - their willingness to trade becomes evidence against trading with them. For (7), it supports the user's view that prices can't be fully revealing because that would destroy the incentive to gather information.

  I should also construct test cases: one where a counterparty has non-informational motives (which should allow trade) and another where common knowledge is forced (which should prevent trade). The principle accommodates all verdicts except possibly (2) - I think the user should reconsider whether trade is truly rational when priors differ but motivations are strategic.

  The announcement test is partially salvageable but needs to incorporate the strategic/non-strategic distinction. It's a special case of examining why the counterparty is willing to trade. I'll organize this into a clear response with the principle, its application to the cases, limitations, and judgment on the announcement test.
answer: |-
  ### Brainstorming Candidate Principles
  1. **Common Prior + Common Knowledge of Rationality → No Trade** (supports 1,6): If agents share a prior and rationality is common knowledge, no speculative trade occurs (Aumann). *Likely failure:* Ignores asymmetric information dynamics in markets (contradicts 4).  
  2. **Counterparty Motivation Matters** (supports 3,4,5): Willingness to trade is evidence only if the counterparty’s action is *strategically contingent on their information*. Non-strategic actors (e.g., liquidity traders) provide "cover" for informed trade.  
  3. **Informativeness Requires Incentive-Compatibility** (supports 7): Prices can’t fully reveal private information without destroying the profit motive for acquiring it (Grossman-Stiglitz paradox).  
  4. **Prior Divergence as Non-Common-Knowledge** (supports 2): Differing priors break common knowledge, permitting trade. *Likely failure:* Doesn’t explain *why* priors differ or how evidence updates interact (risks trivializing disagreement).  
  5. **The Announcement Test** (user’s proposal): Tests whether an offer survives common knowledge of mutual willingness. *Likely failure:* Overfits to bilateral settings; ambiguous in competitive markets with non-strategic actors.

  ---

  ### Proposed Principle: **The Counterparty Motivation Principle (CMP)**  
  **Formal Statement**:  
  > *Trade between A and B is rational iff:  
  > (i) At least one party has non-informational motives (e.g., liquidity needs, hedging), OR  
  > (ii) Their willingness to trade does not common-knowledge imply that one party possesses strictly superior information relevant to the asset’s value.*  

  **Clauses Tied to Cases**:  
  - Clause (i) motivated by **verdicts 4 & 5**: Noise traders’ non-informational motives break the inference that counterparty willingness is *always* evidence (saves market makers).  
  - Clause (ii) motivated by **verdicts 1, 2, 3 & 6**: When willingness *is* strategically contingent on information (e.g., the stranger in 3, or common-prior traders in 1), it becomes evidence against accepting the trade.  

  ---

  ### CMP’s Verdicts on Your Cases  
  - **(5) (Market maker, only informed/lay traders):** **Unviable.** Clause (i) fails (no non-informational traders). Clause (ii) fails: the market maker’s willingness to trade implies (to informed traders) that his quote is stale, inviting exploitation. Rational traders won’t participate if they know the MM will adjust. *Matches your verdict.*  
  - **(7) (Prices can’t be fully revealing):** **Substantive constraint.** Fully revealing prices would require clause (ii) to hold (no superior info), but clause (i) fails—informed traders’ motive *depends* on prices not yet revealing their info. Efficiency is incomplete to preserve incentives. *Matches your verdict.*  

  ---

  ### Test Cases for Fragility  
  1. **The Oblivious Hedger:**  
     - *Setup:* An options dealer quotes wide spreads. A hedger with *non-informational, price-insensitive* demand (e.g., needing to delta-hedge) crosses the spread.  
     - **CMP Verdict:** Rational (clause i).  
     - *Fragility Test:* If the hedger’s motive is *common knowledge*, CMP holds. But if the dealer suspects the "hedger" is informed *pretending* to be a hedger, clause (ii) may be violated. CMP assumes motives are identifiable—a weakness.  

  2. **Common Knowledge Forced by Contract:**  
     - *Setup:* Two common-prior traders contractually pre-commit to trade *before* seeing their signals, then receive signals.  
     - **CMP Verdict:** Trade rational (clause ii satisfied: willingness isn’t contingent on *post-signal* info).  
     - *Fragility Test:* This violates the spirit of no-trade theorems but technically satisfies CMP. Highlights CMP’s focus on *contingency of motivation*, not just information.  

  ---

  ### Verdicts CMP Cannot Accommodate  
  - **(2) (Trade with genuinely differing priors):** **You should abandon this.**  
    - *Why:* If both know priors differ but neither has non-informational motives (clause i false), and each knows the other’s willingness is based on their prior (violating clause ii), trade collapses. E.g., if you believe stock is worth $10 (prior mean 8), and I believe $6 (prior mean 8), your offer to sell at $8 makes me infer you have bad news. CMP says no rational trade—contradicting your verdict.  
  - **(6) (Rational disagreement with common priors):** CMP accommodates this via clause (ii): willingness to "trade" beliefs isn’t strategically contingent if evidence isn’t mutually recognized.  

  ---

  ### Judgment on the Announcement Test  
  - **Salvageable as a Corollary of CMP, but Incomplete Alone.**  
    - *Strengths:* Handles bilateral strategic settings (1,3,6) by forcing common knowledge—which *exposes* when willingness is evidence against trade. Explains why market makers don’t quote prior means: announcing "I’ll trade here" would invite adverse selection.  
    - *Why Incomplete:* Fails in (4) and (5) because it doesn’t distinguish *why* the counterparty is willing. In (4), the market maker’s announcement ("I’ll trade at this spread") *remains* rational because noise traders’ non-informational motives break the adverse-selection inference. The test works only when all actors are strategic (like your stranger in 3).  
    - **Refinement:** The announcement test succeeds precisely when CMP’s clause (ii) is violated by the announcement. It is a special case of diagnosing *strategic contingency of motives*.  

  ### Conclusion  
  Your core insight—that counterparty willingness is evidence *only when motivated by private information*—is sound. **CMP systematizes this while resolving your (3)/(4) tension by centering non-informational motives.** Abandon verdict (2); differing priors alone don’t guarantee trade. The market maker survives not despite the stranger’s logic, but because noise traders provide an *alternative explanation* for order flow, shielding informed traders from full informational collapse.
