answer: |-
  Here's the hard-nosed defense against nihilism, targeting the core mechanism of Strawson's regress:

  **The Overgeneration is Real, but the Solution Lies in Severing "Responsibility for Outcomes" from "Ultimate Authorship of Capacities"**

  Your diagnosis is correct: the "no-unearned-credit" principle, if applied universally and metaphysically, *does* destroy not just moral desert, but epistemic credit, skill attribution, friendship valuation, and achievement recognition. If ultimate responsibility requires being the *causa sui* (self-cause) of the capacities producing an outcome, then *no* credit is ever truly earned. My calculus grade, my violin performance, my loyal support during your crisis – all stem ultimately from genetic/environmental luck shaping my cognitive abilities, work ethic, and emotional capacities. This is the nihilist bullet.

  **Biting that Bullet is Unjustified and Impractical:** Nihilism about all desert collapses crucial distinctions we *must* make to navigate the world:
  1.  **Epistemically:** We *must* distinguish between reliable and unreliable informants. Calling a physicist "knowledgeable" about gravity isn't giving them *metaphysical* credit for their brain's wiring; it's *recognizing* their current state as a reliable source. Denying this collapses rational discourse.
  2.  **Practically:** We *must* distinguish skilled surgeons from novices when choosing who operates. Praising the surgeon's skill isn't crediting them with creating their own fine motor control; it's *identifying* their current capacity to perform complex tasks reliably. Denying this paralyzes action.
  3.  **Socially:** We *must* distinguish loyal friends from fair-weather ones. Valuing someone as a "good friend" isn't crediting them with self-creating their empathetic disposition; it's *appreciating* the reliable, positive disposition they *currently* manifest within the relationship. Denying this destroys the fabric of trust and reciprocity.

  **The Faulty Half: "Responsibility for the Way You Are" (in the Ultimate Authorship Sense)**

  The regress principle smuggles in an impossible, self-defeating demand: **Ultimate Self-Authorship.** This is the half that must be rejected *as a necessary condition for any credit or responsibility whatsoever*. The principle says:

  *   To deserve credit/debit for Outcome O (produced by Capacity C), you must deserve credit/debit for possessing Capacity C.
  *   But possessing Capacity C is itself an outcome (O1) produced by prior capacities (C1), so you must deserve credit/debit for C1, and so on *ad infinitum*.

  **The Mechanism Breakdown:** The fatal flaw is equating "being responsible *for* O" with "being the *ultimate originator* of the entire causal chain culminating in O." This demand for ultimate origination is incoherent – it requires being an unmoved mover concerning one's own fundamental capacities. Nothing meets this standard.

  **The Salvageable Half: "Responsibility for What You Do" (as Expression of Current Capacities)**

  This half is essential and survives. Credit, responsibility, and desert are fundamentally about **how an agent *expresses* their current capacities *within a specific domain of assessment*, given the opportunities and constraints of their situation.** The "way you are" (your capacities) provides the *stage*; "what you do" is the *performance on that stage* deserving assessment.

  1.  **Credit/Responsibility as Relational Recognition:** Attributing credit or responsibility is not primarily a metaphysical judgment about ultimate origins. It's a *practical, relational judgment* about how an agent's *current* state and actions function within a system of norms, expectations, and interactions.
      *   *Epistemic Credit:* We credit someone "for knowing X" when their cognitive capacities (however acquired) reliably produce and express accurate representations of X, especially when challenged or tested. The credit is for the *reliable manifestation and deployment* of knowledge *now*.
      *   *Skill:* We credit a pianist's skill based on the *current, reliable expression* of fine motor control, auditory discrimination, and musical understanding in their performance. The credit is for the *masterful execution* using available capacities *now*.
      *   *Friendship:* We value someone as a good friend based on the *current, reliable expression* of loyalty, empathy, and support *within the relationship*. The value stems from the *manifested disposition* and actions *now*.
      *   **Moral Responsibility:** We hold someone responsible for an action based on the *current expression* of their evaluative capacities (understanding right/wrong), volitional capacities (control over actions), and responsiveness to reasons *in the specific situation*. The responsibility is for the *judgment, choice, and action* performed *now* using those capacities.

  2.  **The Capacities as the Enabling Platform, Not the Target:** Your capacities (the "way you are") are the *necessary conditions* that make performance possible, but they are not themselves the *direct object* of credit/responsibility for a *specific outcome*. We hold the *agent* responsible for *using* (or misusing) those capacities in action. We don't need to hold the agent responsible for *having* the capacities in the ultimate sense to hold them responsible for *exercising* them.

  **Why Moral Responsibility *Feels* Different (But Isn't Fundamentally So Regarding the Regress):**

  The perceived "scope limit" for moral responsibility arises not from the regress principle magically stopping there, but from the *unique nature of what moral responsibility assesses*:

  1.  **Stakes and Reactive Attitudes:** Moral assessments involve deep personal and social stakes (blame, resentment, guilt, punishment, profound praise) and powerful reactive attitudes. This makes the demand for "ultimate authorship" *feel* more urgent, even though it's no more *metaphysically* satisfiable than for knowledge or skill. The *emotional weight* amplifies the apparent need for grounding.
  2.  **Character Assessment:** Moral responsibility often focuses on actions as expressions of deep character or evaluative stances (e.g., cruelty, dishonesty, kindness). This feels closer to judging "the way you are" than judging a specific skill performance. However, this judgment is still about the *expression* of that character *in action*, not about the ultimate origin of the character trait itself. We blame the cruel *act* as an expression of a cruel *disposition*, not the disposition's cosmic genesis.
  3.  **Control Requirement:** Moral responsibility typically demands a higher bar of control than, say, epistemic credit. However, this control is still assessed relative to the agent's *current* capacities and the situation (e.g., coercion, insanity). It doesn't require control over the formation of the capacities that enable control itself. An epileptic isn't blamed for a seizure; a surgeon is blamed for negligent stitching *using* the motor control they possess.

  **Conclusion: Severing the Link, Keeping the Practice**

  The "no-unearned-credit" principle, interpreted as requiring ultimate self-authorship of capacities, **must be rejected entirely.** It's a philosophical dead end leading to incoherent nihilism. The correct move is to **decouple "responsibility for what you do" from "ultimate responsibility for the way you are."**

  Responsibility and credit attach to **agents expressing their *current* capacities in action within specific normative domains.** We assess the *performance* (epistemic, skillful, relational, moral) based on how the agent deploys the capacities they *have* in the situation they face. The origin of those capacities (genetics, upbringing, cosmic luck) is irrelevant to the *propriety* of that assessment, *even though it explains why the agent has them*. The "regress" is halted by recognizing that capacities are the *starting point* for agency, not its product requiring prior agency. We don't need to earn our capacities to be responsible for using them; we just need to *have* them and be capable of exercising them in ways that meet or violate relevant norms. Moral responsibility survives not because it escapes the regress, but because the regress, properly understood, never threatened it in the first place – it only threatened an impossible, hyper-metaphysical notion of ultimate self-creation that nothing, including responsibility for knowledge or skill, could ever satisfy.
