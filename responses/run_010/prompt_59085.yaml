prompt: |-
  I spent thirty-four years as an analytical chemist in a government metrology laboratory, most of that time concerned with measurement uncertainty and with the unglamorous question of when an instrument's output is good enough to act upon. Since retiring I have taken up epistemology with more seriousness than my former colleagues would have predicted, and I have become preoccupied by an institutional practice I brushed against professionally for decades without ever examining it philosophically: the way the American regulator of drugs and devices grades the evidence it demands according to what is at stake. For a patient with a rapidly fatal illness and no alternative treatment, a new compound may be approved on the strength of a surrogate endpoint — tumour shrinkage, say, or a laboratory marker — that is only thought to predict clinical benefit, subject to confirmatory trials being conducted afterwards and to withdrawal of the approval if they fail. The same compound, offered for a mild and non-life-threatening complaint, would be refused outright on that showing; the agency would require direct demonstration of benefit and a far larger safety database. Something structurally parallel obtains for devices, which are sorted into three classes according to the harm their failure could cause, so that a moderate-risk device can often be cleared by demonstrating that it is substantially equivalent to an already-marketed predicate, with no new clinical data whatever, while a high-risk device serving the same anatomical purpose must carry clinical investigations of its own. So far as I can determine, the agency does not describe any of this as a relaxation of its epistemic standard; its official account is that the standard of evidence is fixed and that what varies is the balance of benefit against risk which it is acceptable to strike. A former colleague of mine now sits on a hospital pharmacy and therapeutics committee and assures me this is simply how the business is done, but I do not find that an answer.

  I should like to know whether the official account can be made coherent. Consider two dossiers that are token-identical: the same compound, the same trials, the same effect sizes and confidence intervals, submitted once for a lethal orphan disease and once for a nuisance condition. The reviewers reach opposite conclusions. Since the data do not differ, the difference must reside somewhere in the framework, and the risk-benefit story does not seem to me to locate it: if the question put to the reviewers is whether the data show that the drug works, then either they do or they do not, and the gravity of the illness is beside the point; if the question is instead whether marketing should be permitted, then the verb show has quietly changed its sense between the two submissions. My own half-formed hunch is that everything turns on whether an approval is an assertion or a permission. If it is an assertion — a public statement by the agency that this drug works — and if assertions are governed by some knowledge-like norm, then a stakes-graded approval policy appears to commit the agency either to the contextualist line illustrated by DeRose's bank examples or to the related and more radical claim, pressed by others, that whether one knows depends on what stands to be lost by being wrong; and it would then owe us a reply to the invariantists, who insist that what varies with the stakes is not knowledge but only the practical rationality of acting on it. If approval is nothing but a permission, the agency may remain a strict invariantist and let the stakes enter solely through decision theory, in which case the practice presupposes nothing epistemologically interesting at all. The provisional character of accelerated approval confuses me further and seems to cut both ways: the agency appears to grant and later revoke a warrant, which suggests it never treated its own conclusion as knowledge in the ordinary sense, yet a withdrawal is announced in precisely the language of having been mistaken, and the confirmatory obligation is imposed as though the original finding were already, in some attenuated way, established. A third datum troubles me still more. Within the same institution the conventional threshold of statistical significance does not move with the stakes: a p-value below 0.05 counts as the same achievement whether the indication is a fatal malignancy or a cosmetic complaint. And in the criminal law, where the standard of proof plainly differs between civil and criminal proceedings, the reasonable-doubt standard does not, so far as I can tell, tighten as the potential sentence lengthens; a defendant facing five years and one facing life are convicted on the same epistemic showing. Whatever theory licenses the graded approval scheme must therefore also explain why it does not license these neighbouring variations.

  What I want is a reconstruction of the epistemology this practice actually presupposes, conducted with care about the difference between presupposition and mere compatibility. Specifically: which accounts of evidence, and of knowledge, render the graded-evidence scheme intelligible, and which does the scheme positively exclude; whether the assertion/permission distinction I have proposed is a genuine hinge or a distinction without a difference, and if it is genuine, whether either horn remains available to an agency that describes its own decisions in the language it actually uses; whether the several parts of the practice — surrogate endpoints, post-marketing confirmatory obligations, risk-based device classes, an invariant significance threshold — presuppose mutually consistent things, or whether the scheme is a patchwork that no single theory underwrites; and what would have to change in the institution, both procedurally and in the wording of its decisions, were it rebuilt on a strict invariantist epistemology in which the sufficiency of evidence never depends on what turns on being right. Please be explicit about where the practice is philosophically underdetermined. I expect a good deal of it is licensed equally well by rival theories, and I would rather see that underdetermination mapped than quietly resolved by stipulation.
reasoning: |-
  Okay, let me unpack this fascinating query from a retired analytical chemist turned epistemologist. The core tension is between regulatory practice and philosophical coherence - specifically how the FDA's risk-adapted evidence standards square with theories of knowledge and evidence.

  First, I need to reconstruct the puzzle precisely. We have token-identical drug applications getting opposite decisions based solely on disease severity. The official "risk-benefit balance" explanation seems insufficient because: (1) if the question is "does evidence show efficacy?", that should be stake-invariant; (2) if it's "should we permit marketing?", then "show" becomes ambiguous. This points to deeper philosophical questions about the nature of regulatory approval.

  The user proposes two frameworks: 
  - Approval as assertion (claims knowledge of efficacy)
  - Approval as permission (practical authorization)

  But the provisional nature of accelerated approval complicates both - revocations imply the agency never fully "knew," yet withdrawals are phrased as corrections of error. And the invariant significance threshold (always p<0.05) seems inconsistent with stakes-sensitivity elsewhere.

  What makes this particularly thorny:
  - The user wants presuppositions, not just compatibility
  - Must reconcile seemingly contradictory elements (e.g., variable evidence standards but fixed p-values)
  - Needs to map where practice is philosophically underdetermined

  Key philosophical touchpoints:
  - Contextualism vs invariantism in epistemology (DeRose's bank cases)
  - Pragmatic encroachment (whether stakes affect knowledge itself)
  - Relationship between evidence and decision theory

  The multi-layered nature of regulatory practice adds complexity: surrogate endpoints, post-marketing studies, device classifications all operate with different evidence thresholds but are governed by the same risk principle.

  I should test each philosophical framework against the practice:
  1. Strict invariantism: Evidence sufficiency never depends on stakes. But this can't explain why identical data gets different decisions.
  2. Contextualism: What counts as "sufficient evidence" shifts with context. Explains variable approvals but clashes with fixed p-values.
  3. Pure decision theory: Approval is always just risk-benefit calculus. Makes evidence secondary, but conflicts with how agencies describe their epistemic judgments.

  The provisional approvals are especially telling - they suggest regulators operate with tiers of epistemic warrant: preliminary vs conclusive. This resembles "safety zones" in formal epistemology rather than binary knowledge claims.

  For the reconstruction, I'll need to:
  - Distinguish between epistemic judgments and authorization decisions
  - Show how "risk of being wrong" operates differently in efficacy vs safety assessments
  - Explain why p-values stay fixed while other evidential components shift (it's about decision thresholds, not evidence strength per se)

  The legal analogy is insightful: while proof standards differ between civil/criminal cases, they don't scale with sentence severity. Similarly in regulation, there may be categorical risk tiers rather than continuous scaling.

  Ultimately the practice appears to presuppose a hybrid view:
  - Epistemic standards are moderately invariant (hence fixed p-values)
  - But practical justification for action depends on error costs (hence variable approvals)
  - With a tiered system of epistemic risk-management (provisional vs full approval)

  This avoids full contextualism while accommodating stakes through decision theory. The "assertion" of efficacy is always probabilistic and qualified, never categorical knowledge in the philosophical sense.
answer: |-
  Your inquiry dissects a profound tension between regulatory pragmatism and epistemological coherence. Having spent decades in metrology before turning to philosophy, you recognize that institutional practices often embed unexamined epistemological commitments. Let's reconstruct the FDA-like regulatory scheme systematically, addressing your core questions about evidence gradation, assertion vs. permission, internal consistency, and invariantist alternatives.

  ### 1. **The Epistemological Presuppositions of Graded Evidence**
  The practice presupposes a hybrid view integrating **pragmatic encroachment** (stakes affect justification) and **tiered epistemic warrant** (evidence can be provisionally action-guiding without meeting "knowledge" standards). Key elements:
  - **Evidence as Decision-Relative**: Evidence isn't evaluated in isolation but relative to the *consequences of error*. For a fatal disease with no alternatives, false negatives (rejecting an effective drug) carry catastrophic costs. For a nuisance condition, false positives (approving an ineffective drug) dominate the risk calculus. This aligns with **pragmatic encroachment** (Fantl & McGrath, Hawthorne) where the stakes influence what counts as sufficient evidence for action.
  - **Surrogate Endpoints as Proxy Warrants**: Surrogates (e.g., tumor shrinkage) are not treated as direct evidence of efficacy but as *defeasible indicators* correlated with clinical benefit. Their acceptability hinges on:
    - **Theoretical plausibility** (mechanistic understanding)
    - **Desperation premium** (cost of inaction in urgent scenarios)
    - **Confirmatory backstop** (post-market studies as error-correction).
    This rejects **infallibilism**; the agency operates with **fallible, probabilistic warrants**.
  - **Invariant p-Values as a Red Herring**: The fixed p<0.05 threshold addresses *statistical noise*, not *clinical significance* or *risk*. It answers: "Is the observed effect likely real?" not "Is it sufficient for approval?" This separates **evidence generation** (stake-invariant statistics) from **evidence sufficiency** (stake-sensitive decision rules).

  ### 2. **Assertion vs. Permission: A Genuine Distinction**
  Your distinction is pivotal, but the practice blurs the lines:
  - **Approval as Assertion**: The agency *does* assert that "the benefits outweigh the risks" based on available evidence. This assertion is:
    - **Stakes-Relative**: What counts as "outweighing" depends on error costs (e.g., higher risk tolerance in life-threatening cases).
    - **Graded**: Full approval resembles a **knowledge claim**; accelerated approval is a **defeasible presumption** ("there is reasonable hope, merits verification").
  - **Approval as Permission**: The regulatory act *is* a license to market, but it carries epistemic baggage. Withdrawals ("we were mistaken") reveal that permissions imply **accountable assertions**. The agency cannot retreat to pure decision theory because:
    - Its enabling statute requires "substantial evidence" of efficacy.
    - Withdrawals invoke *epistemic failure* ("new data show no benefit"), not just changed risk calculus.
    
  **Verdict**: Approval is a **hybrid speech act**—both assertion and permission—where stakes modulate the epistemic standard for the assertion. This commits the agency to **contextualism** (DeRose) or **pragmatic encroachment**, rejecting **strict invariantism**.

  ### 3. **Internal Consistency of the Scheme**
  The scheme is coherent but tension-laden:
  - **Consistencies**:
    - **Risk-Adapted Warrant**: All elements (surrogates, confirmatory trials, device classes) share a core logic: *the cost of uncertainty determines evidential burden*. High-stakes decisions demand more direct/robust evidence.
    - **Provisionality as Error Management**: Accelerated approval treats evidence as **defeasibly sufficient**—actionable now but subject to future falsification. This mirrors Lakatosian "research programmes" or Popperian falsificationism.
  - **Inconsistencies**:
    - **p-Value Invariance**: Clashes with stakes-sensitivity elsewhere. Resolution: p-values address *internal validity* (did the intervention cause the effect?), while risk-benefit assesses *external validity* (does the effect matter clinically?). They operate at different levels.
    - **Legal Analogy Mismatch**: Criminal law uses fixed "beyond reasonable doubt" regardless of sentence length because it prioritizes **procedural justice** (equal epistemic standards for all defendants) over **consequential tailoring**. Regulation prioritizes *outcomes* (patient welfare), allowing stakes to calibrate evidence.

  ### 4. **Rebuilding on Strict Invariantism**
  An invariantist rebuild would require:
  - **Procedural Changes**:
    - Single evidence threshold for all approvals (e.g., always require direct clinical benefit + large safety DB).
    - Eliminate accelerated approval, surrogate endpoints for serious conditions, and risk-based device classes.
  - **Wording Changes**:
    - Approvals would state: "Evidence meets the fixed standard of efficacy/safety."
    - Rejections would state: "Evidence is insufficient per the universal standard," regardless of patient desperation.
  - **Consequences**:
    - **Ethical Costs**: Life-saving drugs delayed for years; preventable deaths in orphan diseases.
    - **Epistemic Costs**: Ignores that evidence assessment *always* involves value-laden tradeoffs (Rudner's argument). Invariantism pretends to "value-free" epistemology but implicitly accepts higher false-negative rates in urgent cases.

  ### 5. **Philosophical Underdetermination**
  The practice is compatible with multiple theories but **excludes** strict invariantism and infallibilism. Key underdetermined areas:
  - **Contextualism vs. Pragmatic Encroachment**: Both explain stakes-sensitivity, but the practice doesn't specify whether stakes *change the truth conditions* of "sufficient evidence" (contextualism) or *alter the justification threshold* (encroachment). Agency language ("adequate and well-controlled investigations") suggests the latter.
  - **Knowledge vs. Actionability**: The scheme blurs whether approval certifies *knowledge* or *rational actionability under uncertainty*. Confirmatory obligations lean toward the latter, but withdrawal language implies the former.
  - **Status of Surrogates**: Are they *inferential evidence* (Bayesian priors for benefit) or mere *pragmatic proxies*? Practice treats them as the former in high-stakes contexts, but theories of evidence differ here.

  ### Conclusion
  Your intuition is correct: the agency's practice embeds **pragmatic encroachment** within a **fallibilist, decision-theoretic framework**. It presumes that:
  - Evidence must be *proportionate to practical stakes* (rejecting invariantism).
  - Assertions of benefit are *graded* (full knowledge for traditional approval, justified hope for accelerated).
  - Statistical significance is necessary but insufficient; its invariance reflects a narrow *methodological* role.

  The unresolved tension lies in the agency's simultaneous use of epistemic language ("we were wrong") and pragmatic flexibility. This is best explained by treating regulatory approval as a **distinct speech act**—neither pure assertion nor bare permission—governed by **institutional epistemology**, where standards are set by social risk tolerance, not abstract truth-seeking. 

  For further exploration, examine parallels with **climate science policymaking** (where stakes similarly calibrate evidence thresholds for action) or **engineering safety factors** (where "acceptable risk" varies by context). Your metrology background positions you uniquely to dissect these applied epistemologies.
