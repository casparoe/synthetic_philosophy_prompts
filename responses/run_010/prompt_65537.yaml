prompt: |-
  I am editing a public-facing explainer on behavioural genetics, and I need a rigorous audit of one analogy that our consulting geneticist keeps reaching for. Whenever a reviewer objects that heritability estimates are systematically misread, he replies that heritability is simply the R-squared of the genetic model: a variance-explained statistic like any other, no different in kind from reporting that a regression accounts for 80 percent of the variation in house prices across a city. He uses that analogy to defend three claims in the draft.

  Claim A: writing that human height is "about 80 percent genetic" is no more misleading than writing that our model explains 80 percent of the variance in house prices.

  Claim B: heritabilities are comparable across traits and across populations in the way R-squared values are comparable across models, so a trait estimated at 0.8 can meaningfully be called more genetic than one estimated at 0.4.

  Claim C: where the estimate is high, environmental policy has little room to move individual outcomes.

  I want the analogy audited, not restated. First, map the elements explicitly: what plays the role of the outcome variable, the predictors, the fitted model, the sample, and the residual. Then show where each correspondence breaks down, attending in particular to what happens when the "predictor" is an unmeasured random effect rather than a column of data; when the estimate is broad-sense rather than narrow-sense; when genotypes are correlated with, or actively select, the environments they land in; and when the population's environmental range shifts while the genotypes stay fixed. Identify separately which commitments the regression framing quietly imports that the variance-component ratio does not carry — above all the suggestion that the non-genetic share has been positively characterised rather than arriving as a leftover residual. Finally, judge Claims A, B and C one at a time, and say whether a better analogy exists for the same explanatory purpose; if none does, say that plainly and explain what a non-specialist could correctly be told instead.

  No bibliography and no citations, please; I will supply references myself.

  Deliverable: the audit in prose, followed by a single JSON object conforming to this schema.

  - "mapping": array of objects, each with "regression_element" (string), "heritability_counterpart" (string), "correspondence" (one of "exact", "partial", "fails"), "note" (string, one or two sentences).
  - "disanalogies": array of objects, each with "feature" (string), "why_it_matters" (string), "severity" (one of "decisive", "serious", "minor").
  - "imported_commitments": array of objects, each with "commitment" (string), "supported_by_heritability" (boolean), "note" (string).
  - "claim_verdicts": array of exactly three objects, each with "claim" ("A", "B" or "C"), "survives" (one of "yes", "qualified", "no"), "reason" (string).
  - "better_analogy": object with "proposal" (string or null if none), "what_it_gets_right" (string), "what_it_still_misses" (string).
reasoning: |-
  We are auditing the analogy that heritability is like an R-squared from a regression model. The geneticist uses this to defend three claims.

  First, we map the elements of the regression analogy to heritability:

  - Outcome variable: In regression, this is the dependent variable (e.g., house prices). In heritability, this is the phenotypic trait (e.g., height).
  - Predictors: In regression, these are the independent variables (e.g., square footage, location). In heritability, these are the genetic factors (genotypes). However, note that in heritability studies, we often don't have direct measurements of all genetic variants; instead, we use statistical methods (like twin studies or SNP-based heritability) to estimate the genetic contribution.
  - Fitted model: In regression, this is the equation that predicts the outcome from the predictors. In heritability, this is the statistical model (e.g., a linear mixed model) that partitions the variance into genetic and environmental components.
  - Sample: In regression, this is the set of observations (e.g., houses in the city). In heritability, this is the population of individuals studied (e.g., a specific human population at a specific time).
  - Residual: In regression, this is the unexplained variation (error term). In heritability, this is the environmental variance (which includes measurement error and non-genetic factors).

  Now, we note the correspondences and breaks:

  1. Predictors: In heritability, the genetic predictors are typically unmeasured (we don't have the full genome sequence for every individual in the population, and even if we did, we don't know all the functional effects). Instead, we model genetic effects as random effects (e.g., in a mixed model). This is different from a standard regression where predictors are fixed and measured. Thus, the correspondence is partial.

  2. The estimate can be broad-sense (H^2, which includes all genetic variance, including non-additive) or narrow-sense (h^2, which is additive only). The regression R-squared analogy is usually for narrow-sense heritability (if we are thinking of a linear model with additive effects), but broad-sense includes more. The analogy to R-squared is typically for narrow-sense heritability, but if broad-sense is used, then the regression analogy (which usually assumes a linear additive model) breaks down because non-additive effects (dominance, epistasis) are not captured by a simple linear regression. So the correspondence is partial.

  3. Genotypes are often correlated with environments (gene-environment correlation) and can actively select environments (niche-picking). In the regression analogy, this would be like having predictors that are correlated with the error term (endogeneity), which violates the regression assumption of independence between predictors and errors. This leads to biased estimates. In heritability, such correlations inflate the heritability estimate because the genetic component captures some environmental variance. The regression analogy fails here because in standard regression we assume exogeneity.

  4. When the population's environmental range shifts while genotypes stay fixed, the heritability can change. For example, if we move from a population with variable nutrition to one with uniform excellent nutrition, the environmental variance decreases and heritability (as a proportion) may increase. In the regression analogy, if we change the range of the predictors or the residual variance, R-squared changes. However, the key point is that the R-squared is specific to the population and environment studied. The correspondence is partial because the regression R-squared is also population-specific, but the problem is that heritability is often misinterpreted as being intrinsic to the trait, while it is context-dependent.

  Now, we identify commitments that the regression framing imports but that the variance-component ratio does not carry:

  - The regression model typically assumes that the predictors are measured without error and that the model is correctly specified. In heritability, we have unmeasured genetic variants and the model may be misspecified (e.g., ignoring gene-environment interactions).
  - The residual in regression is often thought of as "noise" or "error", but in heritability, the residual (environmental variance) is not just noise: it includes systematic environmental factors that are not measured. The analogy may lead to the misconception that the non-genetic part is random and unexplainable, whereas it might be structured and amenable to intervention.
  - The regression R-squared suggests that we have positively characterized the predictors and the residual. For heritability, we have not necessarily characterized the environmental factors; the residual is just the leftover.

  Now, we judge the claims:

  Claim A: Writing that height is "about 80 percent genetic" is no more misleading than writing that a model explains 80 percent of the variance in house prices.

  Verdict: Qualified (but leaning towards no). 

  Reason: The phrase "about 80 percent genetic" is commonly misinterpreted as meaning that 80% of an individual's height is due to genes, which is not what heritability means. Heritability is a population statistic about the proportion of variance due to genetic differences in that population at that time. The house price analogy is also about variance, so in that sense it is similar. However, the house price analogy does not carry the same risk of individual-level misinterpretation because we don't typically say a house's price is "80% due to square footage". But the phrase "about 80 percent genetic" is often taken to mean that genes are 80% responsible for the trait in each individual, which is incorrect. The regression analogy does not inherently prevent this misinterpretation, and in fact might encourage it because in regression we sometimes speak of the contribution of a predictor. However, the regression R-squared is also a population-level statistic. The key issue is that the phrase "about 80 percent genetic" is ambiguous and can be misleading, whereas the house price example is less likely to be misinterpreted in the same way because people understand that house prices are influenced by multiple factors. But note: the geneticist's claim is that it is "no more misleading". Given the common misinterpretations of heritability, the statement about height might be more misleading because of the biological and personal nature of the trait.

  Claim B: Heritabilities are comparable across traits and populations in the way R-squared values are comparable across models.

  Verdict: No.

  Reason: Heritability is population- and time-specific. Two traits with the same heritability in the same population can have different genetic architectures, and the same trait in two different populations (with different environmental variances) can have different heritabilities. Moreover, R-squared values are comparable only if the models are on the same outcome variable and the same sample. But even then, we know that R-squared can be inflated by adding more predictors. In heritability, the methods and the populations may differ. For example, a heritability estimate from a twin study in one population and a SNP-based heritability in another are not directly comparable. Also, the environmental variance can vary across populations, so a trait with heritability 0.8 in one population might be more malleable by environment than a trait with 0.4 in another if the first population has a very restricted environment (so the environmental variance is low). Therefore, heritability estimates are not directly comparable in the way the claim suggests.

  Claim C: Where the estimate is high, environmental policy has little room to move individual outcomes.

  Verdict: No.

  Reason: A high heritability does not imply that environmental interventions are ineffective. Heritability is about the proportion of current variation in a population that is due to genetic variation. If an environmental change is introduced that is uniform (so it doesn't add variance) but shifts the mean, then the heritability might remain high while the mean changes. For example, adding fluoride to water reduced tooth decay without changing the heritability of tooth decay. Also, in a population with a very uniform environment, heritability will be high because environmental differences are minimal, but that does not mean that the trait is not responsive to environmental change. In fact, a novel environmental intervention (not present in the current population) might have a large effect. The regression analogy might mislead here because if a predictor explains a lot of variance, we might think that other factors don't matter, but that is only true for the current set of predictors and the current data. In the house price example, if we have a model that explains 80% of the variance with house characteristics, we might still see a big change in prices if there is a city-wide policy change (like a new tax) that affects all houses equally. That policy change would not be captured in the residual of the current model. Similarly, a new environmental intervention might shift the mean of a trait without changing the variance, so the heritability remains high but the mean changes.

  Better analogy: 

  We might consider an analogy to a baking recipe. The heritability is like the proportion of variation in cake heights (in a population of cakes) that is due to differences in the amount of flour used, in a specific kitchen with a specific set of bakers and ovens. But note: if we change the oven temperature (an environmental factor) for all cakes, we might change the average cake height without affecting the variation due to flour. This analogy captures that heritability is context-dependent and that a high heritability does not mean that environmental factors (like oven temperature) cannot change the outcome.

  However, no analogy is perfect. The flour in the recipe is a measured ingredient, whereas genes are not directly measured in heritability. Also, the cake analogy might not convey the statistical nature.

  Alternatively, we might say there is no perfect analogy. Instead, we can tell non-specialists: "Heritability tells us, for a particular population in a particular environment, what proportion of the differences we see in a trait can be traced to genetic differences. It does not tell us how much of an individual's trait is genetic, nor does it tell us how much the trait might change if we change the environment for everyone."

  Now, we structure the output as per the schema.

