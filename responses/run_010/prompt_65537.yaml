  Prose:

  The analogy that heritability is the R-squared of a genetic model is a useful starting point but breaks down in critical ways. In the regression model, the outcome variable is the phenotypic trait (e.g., height), which corresponds exactly. The predictors in regression are the genetic factors, but these are typically unmeasured and modeled as random effects in heritability, making the correspondence partial. The fitted model in regression is analogous to the statistical model (e.g., a linear mixed model) used to partition variance, but the heritability model may include unmeasured effects and assumptions about additivity, so the fit is partial. The sample in regression corresponds exactly to the studied population. The residual in regression is the environmental variance plus error, but in heritability, this residual includes non-genetic factors that may be structured and not just random noise, so the correspondence is partial.

  Several disanalogies are critical. First, in heritability, the genetic predictors are unmeasured and treated as random effects, which violates standard regression assumptions and introduces estimation challenges (serious). Second, the distinction between broad-sense and narrow-sense heritability complicates the analogy because regression R-squared is usually for additive models, but broad-sense includes non-additive effects (serious). Third, genotype-environment correlations violate the exogeneity assumption of regression (independence of predictors and error), leading to biased heritability estimates (decisive). Fourth, heritability is population-specific and changes with environmental variance, which is similar to R-squared being sample-specific, but the key issue is that heritability estimates are often misinterpreted as intrinsic to the trait (serious).

  The regression framing imports commitments not supported by heritability. It suggests that the residual (non-genetic) variance is unstructured noise, but in reality, it may include systematic environmental factors (false). It also implies that the model accounts for all relevant genetic predictors, but heritability models may be misspecified (false). Finally, it assumes predictors are measured without error, which is often not the case in genetics (false).

  Regarding the claims:
  - Claim A: The statement that height is "about 80 percent genetic" is qualified as acceptable in the same way as the house price example, but it remains more prone to misinterpretation at the individual level because of the personal nature of the trait.
  - Claim B: Heritabilities are not comparable across traits and populations as R-squared values are across models because they are context-dependent and sensitive to environmental variance and genetic diversity.
  - Claim C: A high heritability does not imply that environmental interventions are ineffective; they can shift the mean of the trait without affecting the variance.

  A better analogy might compare heritability to the role of flour variation in causing cake height variation in a specific kitchen. This analogy correctly emphasizes context-dependence and the potential for environmental changes (like oven temperature) to shift the mean. However, it still misses the statistical inference aspect and the fact that genetic factors are not directly measured or controlled.

  Given these considerations, the regression analogy is limited and can be misleading. For non-specialists, it is better to explain heritability as a population-specific, variance-based statistic and to avoid claims about the genetic "share" of an individual's trait.

