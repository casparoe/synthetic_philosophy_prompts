answer: |-
  ### Audit of the Regression Analogy for Heritability

  The analogy that heritability is equivalent to an R-squared statistic in a regression model—where genetic factors are predictors, the phenotype is the outcome, and heritability measures the proportion of phenotypic variance "explained" by genetics—is superficially intuitive but fundamentally flawed. Below, I dissect the mapping, disanalogies, imported commitments, and claim-specific verdicts. The analogy risks misrepresenting heritability as a stable, causally interpretable metric, obscuring its context-dependent and residual nature.

  #### Explicit Element Mapping
  | Regression Element      | Heritability Counterpart      | Correspondence | Note                                                                                                |
  |--------------------------|--------------------------------|----------------|-----------------------------------------------------------------------------------------------------|
  | Outcome variable         | Phenotypic trait (e.g., height)| Exact          | Both represent the dependent variable being analyzed.                                              |
  | Predictors               | Genetic variants              | Partial        | Genetics are unmeasured random effects, not observed predictors; modeled indirectly via relatedness.|
  | Fitted model             | Variance partitioning model   | Partial        | Heritability uses statistical models (e.g., ACE), but genetics are inferred, not directly fitted.  |
  | Sample                   | Study population              | Exact          | Both are specific to the observed group (e.g., a cohort at a given time/location).                |
  | Residual                 | Environmental variance         | Fails          | The residual in heritability includes unmeasured G×E interactions and systematic environmental factors, not just noise. |

  #### Critical Disanalogies
  | Feature                                | Why It Matters                                                                                                 | Severity    |
  |----------------------------------------|----------------------------------------------------------------------------------------------------------------|-------------|
  | Predictors as unmeasured random effects | Genetic variants are latent variables, not columns of data. This introduces estimation bias (e.g., via LD score regression) and conflates causality with correlation. | Serious    |
  | Broad-sense vs. narrow-sense heritability | R² assumes additive effects (narrow-sense). Broad-sense heritability (e.g., in twin studies) includes non-additive effects (dominance/epistasis), which regression R² cannot capture. | Serious    |
  | Genotype-environment correlation (rGE) | Active/passive rGE (e.g., genetic propensity shaping experiences) violates regression's exogeneity assumption, inflating heritability estimates by attributing environmental effects to genetics. | Decisive   |
  | Environmental range shifts             | If environments change (e.g., universal healthcare), heritability changes even with fixed genetics—unlike R², which is tied to a static dataset. Heritability is population- and context-specific. | Decisive   |

  #### Commitments Imported by Regression Framing (But Unsupported)
  | Commitment                                    | Supported by Heritability? | Note                                                                                                |
  |-----------------------------------------------|----------------------------|-----------------------------------------------------------------------------------------------------|
  | The non-genetic share is "characterized"      | False                      | Heritability's residual is a variance leftover, not a modeled environmental effect (e.g., it could hide systemic biases or policy-tunable factors). |
  | Predictors are causally interpretable         | False                      | Heritability quantifies association, not causation; genetic variants may proxy environmental factors via rGE. |
  | The estimate is stable across contexts        | False                      | R² is dataset-specific, but heritability's sensitivity to environmental variance is often overlooked. |

  #### Verdicts on Claims
  | Claim | Survives | Reason                                                                                                |
  |-------|----------|-------------------------------------------------------------------------------------------------------|
  | A     | No       | "80% genetic" implies genetic determinism at the individual level. Heritability is strictly a population-level variance ratio—unlike R² for house prices, which isn't misinterpreted as "80% of your house's value is due to square footage." |
  | B     | No       | Heritability depends on environmental variance and genetic diversity in a population. Comparing traits (e.g., height vs. IQ) or populations ignores these confounds. R² values are comparable only for identical outcomes and samples. |
  | C     | No       | High heritability does not preclude environmental effects; it reflects current variance partitioning. A policy shift (e.g., nutrition programs) can alter trait means without changing variance, leaving heritability high but outcomes improved. |

  #### Better Analogy
  **Proposal**: A baking recipe analogy.  
  **What it gets right**: 
  > "Heritability is like the ratio of flour-variability to total cake-size variability in a specific kitchen. If all bakers use identical flour (high heritability), size differences stem from oven fluctuations (environment). But if you change ovens (policy shift), cake sizes might change uniformly without altering the flour's role in variability."  
  **What it still misses**: 
  > Genetic factors are not controlled ingredients like flour—they are inferred statistically, and gene-environment interplay (e.g., flour quality affecting oven use) isn't captured. However, it correctly frames heritability as context-dependent and avoids causal claims.

  **Conclusion**: The regression analogy is unsustainable due to latent variables, rGE, and dynamic environments. If no analogy suffices, tell non-specialists:  
  > "Heritability estimates the proportion of trait *variability* in a group linked to genetic differences at that time. It does not measure how 'genetic' a trait is in individuals, imply fixity, or predict policy impacts. Think of it as a snapshot, not a rule."

