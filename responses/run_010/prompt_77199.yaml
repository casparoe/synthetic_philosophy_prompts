answer: |-
  Let's dissect this methodically, brainstorming candidate readings before committing. Sidgwick's passage is dense, so we'll tackle it stepwise.

  **1) Parsing the Passage & Core Commitments:**
  - **"invert Aristotle's phrase"**: Aristotle's *Nicomachean Ethics* famously begins by stating the aim of ethics is *action*, not knowledge ("For we are inquiring not in order to know what virtue is, but in order to become good"). Sidgwick inverts this: his *immediate* aim is **Knowledge** (theoretical understanding of ethical reasoning), **not Practice** (direct guidance for action).
  - **"disinterested curiosity... great discoveries of physics"**: This is primarily **attitudinal**, not methodological mimicry. He’s advocating for an *ethos*: suspend the pragmatic desire to "edify" (preach/inspire moral improvement) and adopt the physicist’s detached curiosity about *how ethical reasoning actually works*. The analogy argues that ethics, like physics, progresses when freed from immediate practical demands.
  - **Core Commitments**:  
    - Ethics should be a *science of rational methods*, not a sermon.  
    - Progress requires analyzing "methods themselves" (formal structures of reasoning) independently of their "practical results."  
    - The "urgent need" for moral guidance must be temporarily suspended to achieve objective analysis.  
  - **Ambiguity**: "Disinterested curiosity" *implies* methodological rigor akin to science, but Sidgwick doesn’t specify *which* scientific methods (e.g., quantification, experimentation) ethics should adopt. The emphasis is on the *stance* of detachment.

  **2) The "Urgent Need" Sentence & Anti-Akrasia?**
  - **Candidate Readings**:  
    A. **Epistemic Precommitment (Your Anti-Akrasia Reading)**: Sidgwick recognizes that the "urgent need" for answers acts like a visceral, near-term bias (akrasia of inquiry). Bracketing it is a deliberate act of self-binding to prevent this urgency from distorting rational analysis (akin to Ulysses tying himself to the mast *before* hearing the Sirens).  
    B. **Purely Methodological Bracketing**: This isn't about combating internal weakness, but about defining the scope of *philosophical ethics*. The "urgent need" is an *external* demand (society's push for edification) that contaminates pure analysis. Sidgwick is carving out a space for theory, not managing his own impulses.  
    C. **Rhetorical Strategy**: Sidgwick is reassuring readers (or himself) that focusing on methods *first* will *ultimately* serve practice better. The "temporary" suspension is pragmatic, not a deep psychological maneuver.  
    D. **Category Mistake (Your Worry)**: Framing this as anti-akrasia inflates a modest methodological scoping into a grand self-governance move. Sidgwick is simply saying "I won't focus on applications yet," not battling a personal tendency to be swayed by urgency.  
  - **Survives Contact with Text?** Reading (A) **partially survives but needs nuance**. Sidgwick explicitly frames the "urgent need" as something "we all feel" – it’s a *universal human motivational pull*, not just an external demand. His act of "wish[ing] to put [it] aside" is a deliberate act of cognitive control over this pull. This *is* structurally anti-akratic: he arranges the inquiry to insulate it from a powerful, motivationally salient ("urgent," "pressing") near-term concern (getting practical answers *now*) that could derail the long-term epistemic goal (building rigorous ethical science). However, it’s **epistemic anti-akrasia** (controlling inquiry-distorting impulses) rather than practical anti-akrasia (controlling action-distorting impulses). The text supports this, but it's not the *primary* focus; it’s a consequence of his methodological commitment.

  **3) Stress-Testing Against Discounting Literature:**
  - **The Hot-Cold Empathy Gap Challenge**: This is potent. Sidgwick, writing from a "cold state" (detached theorizing), explicitly brackets the "urgent need" felt in "hot states" (moral anxiety/dilemma). Research (e.g., Loewenstein) shows cold states systematically underestimate hot-state influence. Sidgwick's *methodology* might thus build in a blind spot: by assuming urgency can be cleanly bracketed, he might design an ethical theory that fails to account for how urgency *actually* warps reasoning in real-time choice. His "knowledge" might be ecologically invalid for hot-state decisions.
  - **Is it Precommitment? Candidate Readings**:  
    X. **Strotzian Self-Government/Precommitment**: *Plausible but indirect*. Sidgwick isn't planning future *actions*; he's designing a *method of inquiry*. However, he *is* a sophisticated planner recognizing that his *future engaged self* (analyzing specific dilemmas under urgency) might deviate from the optimal epistemic path laid out by his *current detached self*. The preface acts as a precommitment device *for the theorist*: "Remember, when things get urgent later, stick to analyzing methods!"  
    Y. **Thaler/Shefrin Planner-Doer**: *Fits well*. The "Planner" (Sidgwick-the-scientist) locks the "Doer" (Sidgwick-the-moralist/preacher concerned with immediate edification) out of the study. The preface is the Planner's manifesto.  
    Z. **Ainslie's Picoeconomics**: *Less direct*. Sidgwick isn't bargaining *between* temporal selves for rewards. He's a unified "self" (the theorist) strategically suppressing a specific motivational subsystem (the urge to edify) deemed disruptive to a larger goal (pure knowledge). It's suppression, not bargaining.  
    Ω. **Category Mistake (Your Worry)**: *Strong contender*. The passage is **fundamentally about the epistemic standpoint of the theorist**, not about modeling the intertemporal preferences *of the moral agent* Sidgwick is theorizing *about*. Sidgwick's *own* flat discounting view pertains to the latter. Dragging his *methodological bracketing* into models of agent inconsistency conflates the *analyst's* self-management with the *object of analysis*. Sidgwick is trying to *understand* choice, not *exemplify* it in a Strotzian sense.  

  **Commitment & Synthesis:**
  - **On (1) & (2)**: Sidgwick commits to ethics as a rigorous science of reasoning methods, demanding a physicist-like attitude of detachment. Bracketing "urgent need" is primarily a methodological scoping device to achieve this purity. However, because this urgency is a universally felt *motivational* pull, the act of bracketing *does* function as a form of **epistemic anti-akrasia** – a deliberate self-binding by the theorist to prevent a near-term, vivid demand (for practical answers/edification) from derailing the long-term epistemic project. The hot-cold gap is a valid critique: Sidgwick’s cold-state methodology may underestimate how inescapably urgency shapes real moral cognition.
  - **On (3)**: While tempting, framing the preface *itself* as Strotzian precommitment or Planner-Doer governance **risks a category mistake**. The **best reading is Ω (Epistemic Standpoint)**, tempered by the recognition in (2). Sidgwick is describing the *theorist's necessary cognitive stance* for objective analysis. It’s *analogous* to precommitment (as in X & Y) because it involves foresight about distorting influences and deliberate insulation. However, its *primary purpose* is ontological: defining what constitutes ethical *knowledge* (analysis of methods), distinct from ethical *practice* (applying those methods under urgency). Applying discounting models directly to *this* text conflates levels: Sidgwick is analyzing agent inconsistency (elsewhere), not *exemplifying* it in his preface. The hot-cold gap critique **undercuts the *effectiveness* of the bracketing** (his cold-state theory might fail hot-state agents), not its *intent*.

  **Why Ω is Best:** Sidgwick's core distinction is between "Knowledge" and "Practice." The entire passage argues that *understanding* ethical reasoning ("methods themselves") requires a different vantage point than *doing* ethics ("urgent need"). Strotz, Laibson, et al., are concerned with inconsistency *within* the practical domain of *doing*. Sidgwick's bracketing is a meta-move to access the *knowledge* domain *outside* of practical doing. While the *psychology* of his move resonates with precommitment, its *philosophical function* is foundational – establishing ethics as a theoretical science. Your seminar's value lies precisely in juxtaposing Sidgwick's *theory* of rational choice (assumed flat, consistent) with Strotz's *model* of actual choice (hyperbolic, inconsistent), using the preface to highlight how Sidgwick's *methodological purity* might ironically distance his theory from the messy psychology he seeks to explain. The preface is the mapmaker declaring he must ignore the storm to draw the coastline accurately; the discounting literature shows how the storm changes the coastline itself.
