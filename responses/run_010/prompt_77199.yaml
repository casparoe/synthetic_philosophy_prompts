  The urgency-bracketing move fascinates them. Is this anti-akrasia? Partially yes—deliberate distancing from visceral pulls resembles precommitment. But crucially, it's epistemic precommitment for the theorist, not behavioral for the agent. The hot-cold empathy gap worry is real though: Sidgwick's cold-state analysis might underestimate how urgency distorts real-world reasoning.

  For the Strotz comparison: Sidgwick's flat discounting isn't the point here. This preface is meta-theoretical scaffolding. When he says "put aside the urgent need," he's constructing a purified space for analysis, like a lab condition. Dragging this into discounting models risks category error—it's about how we study choice, not how agents make choices. Though ironically, his methodological rigor might indirectly aid personal self-governance.

  Best reading? This is epistemic hygiene for philosophers. But its brilliance lies in recognizing that the "edification impulse" is itself a visceral pull requiring preemption. The empathy gap concern stands, but Sidgwick would likely counter that acknowledging this bias is precisely why we need bracketing.

