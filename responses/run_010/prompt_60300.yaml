  You are an epistemologist whose work centers on the norms of outright belief: the lottery and preface paradoxes, closure conditions on belief, and the standing of merely statistical evidence. I would like you to perform a piece of reflective equilibrium on my behalf. Please think carefully, and before proposing any principle, spend a short passage brainstorming the structural dimensions along which my cases differ — numerical probability, the kind of evidence behind it, how many propositions are being bundled together, what is at stake, whether a mistake would be detectable, whether the proposition is about my own work, and so forth. Only then move to principles. I should say at the outset that I am not looking for references, a survey of who holds what, or names attached to views; assume I cannot look anything up, and define any term of art you end up needing.

  The context is mundane. I am a fourth-year doctoral student finishing a dissertation of roughly three hundred pages, I have a short twenty-page paper under review, I was on a civil jury last spring, and I have a standing habit of entering charity raffles. Here are my verdicts, in the order the puzzles occurred to me:

  1. **One raffle ticket.** A hospital raffle, 200,000 tickets sold, exactly one prize. I hold one. I believe I will not win, and I say so out loud without hedging. If someone asks whether I *know* I will lose, though, I say no.
  2. **Thirty raffles.** I enter about thirty such raffles a year, one ticket each. I believe I will lose every one of them. Also fine.
  3. **Three hundred raffles.** Through a club I am entered in 300 separate draws, each with 1,000 tickets sold and one prize, one ticket of mine in each. On my own numbers the chance that I lose all of them is about 74%. I believe that I lose all of them, and I would take even-money bets on it repeatedly.
  4. **The bus case.** Civil suit, plaintiff struck by a bus, and the only evidence bearing on whose bus it was is that the defendant operates 80% of the buses in the city. I do not believe the defendant's bus did it, and I would not vote for the plaintiff. Not fine — even though 80% is higher than the 74% I happily believe in case 3.
  5. **My own short paper.** Twenty factual claims, each of which I would put at 99% or better after checking sources. I believe the paper is entirely correct, which by my own arithmetic is about an 82% proposition, and I would bet on it. Fine. So 82% gets believed and 80% does not, and I do not think the two percentage points are doing the work.
  6. **The preface.** I believe each claim in the dissertation. I also believe that at least one claim in it is false. Holding both seems fine to me. But if you ask me to assert *every claim in this dissertation is true*, I refuse. So I believe each conjunct, believe the negation of the conjunction, and withhold the conjunction itself.
  7. **Count sensitivity.** If someone could make each dissertation claim as solid as each paper claim — triple-checked, 99.99% apiece — I would still refuse to assert that the dissertation is wholly error-free, while I would happily assert it of the paper. I suspect this verdict of mine is simply bad, but I cannot shake it: the sheer number of claims seems to matter over and above the probabilities.
  8. **The machine-checked lemma.** A collaborator formalized one of my lemmas in a proof assistant and the kernel accepted it. I believe the formal statement flat-out, with no preface attitude available at all. But I only mildly believe the English gloss we wrote of it, because the previous year we found a formalization that had quietly changed what was being claimed. Same lemma, same person, two utterly different attitudes — and I do not think the difference lies in how confident I feel.
  9. **Stakes, asymmetrically.** Strengthen case 4 to 999 blue buses in 1,000, that statistic still being the whole of the evidence. In court I would not vote for the plaintiff. Out of court, if a friend told me the cab she took was almost certainly one of the blue ones and I knew the 99.9% figure, I would believe her without a second thought. Meanwhile, in case 3 the money is real and the odds are worse, and stakes do not budge me at all. So stakes move my verdict in the bus case and not in the raffle case, and I cannot say why.
  10. **The biased coin.** A coin I know to be biased three to two toward heads. I do not believe it will land heads on the next toss, though heads is likelier than not, and I certainly do not believe heads on each of ten tosses. So my lower cutoff sits somewhere above one half — but I cannot set it at .99 without contradicting case 3.

  The closest I have got to a principle on my own is this: believe *p* just when *p* is more likely than not on your evidence and your evidence is not a bare frequency about a reference class. The second clause is meant to handle case 4 and the first to handle case 10, but the account then predicts against me in case 1, case 3, and case 5, and it says nothing whatever about case 6 or case 8. Please test it properly rather than dismissing it, and repair it if it can be repaired.

  What I want back: one or, if they are genuinely rivals, two or three candidate principles, each stated precisely enough that I could apply it mechanically to a new case, with each clause explicitly tied to the case or cases that forced it in. For each principle, walk the whole list and tell me which of my ten verdicts it delivers and which it contradicts. Then tell me what it says about three situations I have not made up my mind about: (a) the only evidence against a defendant is a DNA profile with a random-match probability of one in a million — do I believe he is the source?; (b) I hold 999,999 of the million tickets in a raffle that is guaranteed to have exactly one winner — do I believe I will win, and does it matter that this belief, unlike case 1, is about something that is certain to happen to somebody?; (c) an automated system produces a report of three hundred claims, each individually machine-verified against a database, with the framing and selection done by a human — do I believe all three hundred? Finish by saying which principle you would actually endorse, which of my verdicts you think I must give up to keep it, and where you suspect I am not tracking anything real but merely getting confused.
