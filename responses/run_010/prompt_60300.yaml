  ### Reflective Equilibrium on Outright Belief Norms

  I've conducted a reflective equilibrium on your ten cases, focusing on structural dimensions: probability, evidence type (statistical vs. non-statistical), proposition bundling (atomic vs. conjunctive), stakes, error detectability, authorship, and context. Your proposed principle (belief when \(p\) is >0.5 probable and evidence isn't "bare frequency") fails cases 1, 3, and 5 because raffles involve statistical evidence yet warrant belief, and the short paper's evidence isn't purely statistical but its conjunction is believed at 82%. It also ignores key features like stakes, aggregation, and defeasibility. After testing alternatives, I propose a single principle that best captures your judgments, with thresholds calibrated to your cases. Rival principles either contradicted multiple verdicts (e.g., strict closure) or added complexity without gains.

  ---

  ### Candidate Principle: **Defeasible Evidential Threshold (DET)**
  **Definition**:  
  - **Atomic proposition**: Not a conjunction of many independent, similarly evidenced claims (e.g., a single raffle loss, a bus accident claim).  
  - **Purely statistical evidence**: Evidence reducible to frequencies/probabilities without causal, individualized, or non-probabilistic support (e.g., raffle odds, bus fleet percentages).  
  - **High-stakes context**: Involves significant practical consequences, public accountability, or blame assignment (e.g., court verdicts).  
  - **Defeater**: Evidence directly undermining \(p\) or its joint truth (e.g., preface evidence for a book).  

  **Rules**:  
  1. **Atomic \(p\)**:  
     - **If purely statistical evidence**: Believe \(p\) iff \(\Pr(p) > T_{\text{stat}}\).  
       - \(T_{\text{stat}} = 0.999\) in high-stakes contexts.  
       - \(T_{\text{stat}} = 0.99\) otherwise.  
     - **If non-statistical evidence**: Believe \(p\) iff \(\Pr(p) > 0.6\).  
  2. **Conjunction \(p_1 \land \dots \land p_n\)**: Believe iff:  
     - (a) You believe each \(p_i\) (via Rule 1), and  
     - (b) No defeater exists for the conjunction.  
  3. **Defeater override**: Withhold belief in \(p\) if a defeater applies, regardless of other conditions.  

  **Clauses from Cases**:  
  - **Rule 1a** (statistical, stakes-sensitive thresholds): From cases 4 (bus 80% rejected in court) vs. 1 (raffle 99.9995% believed).  
  - **Rule 1b** (non-statistical, lower threshold): From case 10 (coin 60% rejected) vs. 5 (paper claims 99% believed).  
  - **Rule 2** (conjunctions require no defeaters): From cases 5 (paper: no defeater, believe conjunction) vs. 6/7 (dissertation: defeater, withhold conjunction).  
  - **Rule 3** (defeaters override): From cases 6–8 (preface/mistrust defeats belief).  

  ---

  ### Verdicts on Your Cases
  | Case | DET Verdict | Match? | Explanation |
  |------|-------------|--------|-------------|
  | **1. One raffle** | Believe loss | ✓ | Atomic, statistical, \(\Pr(\text{loss}) \approx 1 > 0.99\) (non-high-stakes). |
  | **2. Thirty raffles** | Believe all losses | ✓ | Atomic per raffle: \(\Pr(\text{loss}) \gg 0.99\); conjunction: no defeater (Rule 2). |
  | **3. Three hundred raffles** | Believe all losses | ✓ | Atomic per raffle: \(\Pr(\text{loss}) = 0.999 > 0.99\); no defeater for conjunction. |
  | **4. Bus case (80%)** | Do not believe defendant liable | ✓ | Atomic, statistical, high-stakes: \(\Pr(\text{liable}) = 0.8 < 0.999\). |
  | **5. Short paper** | Believe all correct | ✓ | Non-stat evidence per claim (\(\Pr \geq 0.99 > 0.6\)); no defeater for conjunction. |
  | **6. Preface** | - Believe each claim<br>- Believe ≥1 false<br>- Withhold "all true" | ✓ | Each claim: non-stat, \(\Pr > 0.6\) → believe. Conjunction "all true": defeater (preface) → withhold (Rule 3). Negation "≥1 false": non-stat evidence, \(\Pr\) high → believe (Rule 1b). |
  | **7. Count sensitivity** | Withhold "all true" for dissertation | ✓ | Defeater (preface) remains regardless of per-claim \(\Pr\); conjunction withheld (Rule 3). |
  | **8. Machine lemma** | - Believe formal<br>- Withhold English gloss | ✓ | Formal: non-stat evidence (proof), \(\Pr \approx 1 > 0.6\) → believe. English: defeater (past error) → withhold (Rule 3). |
  | **9. Stakes (bus 99.9%)** | - Court: Do not believe<br>- Friend: Believe | ✓ | Court (high-stakes): statistical, \(\Pr = 0.999 \not> 0.999\) → withhold. Friend (low-stakes): \(\Pr = 0.999 > 0.99\) → believe. Raffle stakes irrelevant: not high-stakes context. |
  | **10. Biased coin** | Do not believe heads | ✓ | Atomic, statistical: \(\Pr = 0.6 < 0.99\) (non-high-stakes). |

  ---

  ### New Cases: DET Predictions
  **(a) DNA evidence (1 in a million random match)**  
  - **Belief?** **Yes** in court.  
    - Atomic, purely statistical evidence, high-stakes context.  
    - \(\Pr(\text{defendant source}) = 1 - 10^{-6} > 0.999\).  
    - *Why?* Exceeds the high-stakes threshold (unlike 80% bus case).

  **(b) Raffle: 999,999 of 1M tickets**  
  - **Belief you win?** **Yes**.  
    - Atomic, purely statistical, non-high-stakes.  
    - \(\Pr(\text{win}) = 0.999999 > 0.99\).  
    - *Irrelevance of "certain to happen to somebody"*: The principle only considers evidence for the specific proposition ("I win"), which is highly probable. Context (e.g., existential certainty) doesn’t affect thresholds.

  **(c) Automated report (300 machine-verified claims, human framing)**  
  - **Believe all?** **No**.  
    - Each claim: Non-statistical evidence (machine-verified), \(\Pr \approx 1 > 0.6\) → believe individually (Rule 1b).  
    - Conjunction: Defeater likely exists (human framing/selection risk) → withhold belief (Rule 3).  
    - *Analogy*: Similar to dissertation (case 6)—framing adds defeater.

  ---

  ### Endorsement and Diagnoses
  **I endorse DET** as it respects all ten verdicts while systematizing thresholds, evidence types, defeaters, and stakes. It also handles new cases coherently.  

  **Verdicts to reconsider**:  
  - **Case 6 (preface inconsistency)**: DET permits believing each claim and "≥1 false" simultaneously. This is logically inconsistent but matches your intuition. I suggest revising this: if you believe "≥1 false," consistency requires doubting at least one conjunct. DET allows it only because it doesn’t enforce closure—but this risks losing normative force.  
  - **Case 9 (stakes asymmetry)**: Your intuition that stakes matter in bus cases but not raffles is preserved by DET’s high-stakes threshold. However, the threshold choice (0.999) is arbitrary. If 99.9% feels insufficient in court, raise \(T_{\text{stat}}\)—but this may conflict with case 1.  

  **Suspected confusion**:  
  - **Case 7 (count sensitivity)**: You feel the sheer number of claims matters beyond probability. DET attributes this to defeaters (e.g., preface evidence), which scale with count. This is real, not confused: aggregation amplifies undetectable error risks (e.g., framing mistakes in case 8).  
  - **Case 9 (raffle vs. bus stakes)**: You can’t articulate why stakes move you in bus cases but not raffles. DET clarifies: raffles lack public blame (non-high-stakes), while courts impose accountability. The difference is context, not stakes per se.  

  **Final recommendation**: Adopt DET but drop the preface inconsistency (case 6). If you can’t, DET still works—but expect normative oddness.
