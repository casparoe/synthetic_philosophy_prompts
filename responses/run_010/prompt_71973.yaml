prompt: |-
  I teach a second-year ethics seminar, 18 students, 75 minutes, and we're on whether there's anything deficient about taking someone else's word on a moral question — the sense that a belief formed that way is a lesser thing to have even when it's true and even when you couldn't have worked it out yourself. Design an in-class game that makes them feel that asymmetry instead of just hearing me describe it.

  Here's the rough shape I want: a round where they spend tokens to buy answers from a designated expert (I'll play them) across three kinds of question — hard factual ones, genuinely contested moral ones, and some etiquette/aesthetic ones as controls — and then a second round where any answer can be challenged and they have to stand behind it, including by acting on it or advising a third party who's relying on them. The point of the category split shouldn't be revealed until the debrief.

  Give me the rules, the token economics (no real money), the exact wording of four or five sample questions per category, and a debrief that maps specific moments onto the distinction. Also tell me what will predictably go wrong the first time I run it — especially the student whos going to insist the challenge round is rigged to make testimony look bad — and which feature of the phenomenon the game just can't reproduce and I'll have to supply myself.
reasoning: |-
  Okay, the user is teaching a second-year ethics seminar with 18 students. They want an in-class game to illustrate the deficiency in relying on others' word for moral questions versus factual ones. The key is making students feel the asymmetry, not just hear about it. 

  First, I need to understand the core concept: testimonial knowledge in ethics. The user mentioned an asymmetry between factual and moral beliefs acquired through testimony. Even when true and inaccessible personally, moral beliefs from others might feel less legitimate. The game must evoke this.

  The user outlined a two-round structure: buying answers from an expert (Round 1) and defending those answers when challenged (Round 2). They want hidden categories—factual, contested moral, etiquette/aesthetic—revealed only in debrief. 

  Token economics: Since no real money, tokens should feel valuable but not distract. Starting with 3 tokens, costing 1 per answer, and earning 1 per successful challenge defense seems balanced. It creates investment without complexity.

  Sample questions need clear distinctions:
  - Factual: Verifiable, non-controversial (e.g., "What’s the atomic number of gold?")
  - Contested moral: No consensus, multiple defensible views (e.g., "Is it morally permissible to break a promise to save someone from minor embarrassment?")
  - Etiquette/aesthetic: Culturally variable but less "weighty" than moral (e.g., "Is it rude to eat soup with a fork?")

  For Round 2 challenges, I'll need mechanisms forcing students to "stand behind" answers: advising a third party, acting out scenarios, or debating. This should make reliance on testimony feel shaky for moral questions but solid for factual ones. 

  Predictable problems:
  - The "rigged" complaint: A student might say challenges are biased against testimony. Solution: Frame challenges as neutral tests of conviction. Record expert answers to avoid bias accusations.
  - Cheating risks: Students might peek at notes. Mitigation: Ban devices, use paper answer sheets.
  - Time crunch: 75 minutes is tight. Advice: Strict time limits, pre-written questions.
  - Student discomfort: Role-playing might flop. Have non-acting options (e.g., written advice).

  What the game can’t capture:
  - The "why" behind the asymmetry. The debrief must explain that moral understanding requires first-person engagement—unlike factual knowledge, which can be outsourced without loss. Highlight how the game made them *feel* this difference.

  Debrief structure:
  1. Reveal categories after feelings are fresh.
  2. Map game moments to theory (e.g., "When defending moral answers, did you feel less ownership?").
  3. Preempt "rigged" claims by noting identical challenge structures across categories.
  4. Clarify limits: Game shows discomfort but not why ethics is special. Lecture must cover moral reasoning’s distinctness (e.g., requires empathy, commitment).

  Final tweaks: 
  - Keep expert answers unpredictable in Round 1 (e.g., randomize moral answers to avoid implying correctness).
  - Emphasize that the expert is fallible—this isn’t about truth but belief sources.
answer: |-
  Here's a comprehensive game design tailored to your ethics seminar. It's called **"The Testimony Auction,"** structured to last 65-70 minutes (leaving 5-10 mins for setup/debrief). The goal is to make students viscerally experience the "ownership gap" in moral testimony vs. factual testimony.

  ---

  ### **Game Rules**
  **Setup (5 mins):**  
  - Hand each student 3 tokens (use poker chips/sticky notes).  
  - Announce: *"Today we're testing how efficiently you can acquire knowledge. I’ll act as an ‘expert.’ You’ll buy answers from me, then defend them under pressure. Tokens = currency. Earn more by defending successfully."*  
  - Hide the three categories; label questions only as "Type A/B/C."  

  **Round 1: The Auction (20 mins)**  
  - You (as expert) auction answers to 9 questions (3 per category). Read each aloud.  
  - Students bid 1 token per answer. Highest bidder gets the answer *privately* (write it on a slip). Others hear only that it was "sold."  
  - **Token Economy:**  
    - Starting tokens: 3 per student.  
    - Cost per answer: 1 token.  
    - Reward: Answers are investments—defend them successfully in Round 2 to earn +1 token each.  

  **Round 2: The Challenge (30 mins)**  
  - Any student can challenge *any* answer given in Round 1 (even if they didn’t buy it).  
  - **Challenge Process:**  
    1. Challenger states the question and the expert’s answer.  
    2. The answer-holder must defend it in one of three ways (their choice):  
       - **Debate:** 90-second argument with the challenger.  
       - **Act It Out:** Perform a 30-second scene demonstrating the principle (e.g., for a moral question, *show* how you’d advise someone).  
       - **Advise the Third Party:** Counsel a "friend" (played by you or a volunteer) who faces this dilemma.  
    3. Class votes: "Convincing" (defender +1 token) or "Not Convincing" (challenger +1 token).  

  ---

  ### **Sample Questions (3 Categories, Hidden)**  
  **Factual (Type A):**  
  1. What’s the atomic number of gold?  
  2. What year did the Berlin Wall fall?  
  3. What’s the capital of Bhutan?  
  4. How many states ratified the U.S. Constitution initially?  
  5. What’s the speed of light in a vacuum?  

  **Contested Moral (Type B):**  
  1. Is it morally permissible to break a promise to save someone from minor embarrassment?  
  2. Should we prioritize saving a loved one over two strangers in a lifeboat scenario?  
  3. Is it ethical to use AI-generated art without crediting the source algorithm?  
  4. Does a billionaire have a moral duty to donate 90% of their wealth?  
  5. Is lying to protect someone’s feelings ever *required*?  

  **Etiquette/Aesthetic (Type C):**  
  1. Is it rude to eat soup with a fork?  
  2. Should you wear bright colors to a funeral?  
  3. Is graffiti art in public spaces inherently disrespectful?  
  4. Is a 3-second pause acceptable before responding to a compliment?  
  5. Can you politely refuse a gift for aesthetic reasons?  

  ---

  ### **Debrief (10-15 mins)**  
  **Step 1: Reveal the categories** after students share reactions. Ask:  
  - *"Which answers felt easiest to defend? Which made you uncomfortable, even if you ‘knew’ they were correct?"*  

  **Step 2: Map game moments to the asymmetry:**  
  | **Game Moment** | **Theoretical Link** |  
  |----------------|---------------------|  
  | Hesitation during moral challenges (e.g., fumbling advice, weak acting) | Moral testimony lacks "cognitive ownership" – you don’t *grasp* the reasons, so defending it feels hollow. |  
  | Confident factual defenses | Factual knowledge is "portable" – truth transfers without personal engagement. |  
  | Etiquette defenses feeling arbitrary | Unlike morals, etiquette doesn’t demand internal conviction – it’s about convention. |  
  | Guilt/annoyance when challenged on morals | Highlights the intuition that moral beliefs *should* be earned, not bought. |  

  **Step 3: Drive home the point:**  
  *"In Round 2, you felt the deficiency: true moral beliefs from testimony lack the rational/emotional scaffolding *you* build when you reason firsthand. That’s why we say ethics isn’t just about ‘knowing’ – it’s about standing behind your judgments as an agent."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"The challenge round is rigged to make testimony look bad!"** (Likely from a skeptic):  
     - **Preempt this:** Record your Round 1 answers publicly after selling them. Emphasize that *any* answer (even factual) could be challenged identically.  
     - **Debrief response:** "The structure was the same for all categories – but your *discomfort* was asymmetric. That’s the phenomenon we’re studying."  

  2. **Other issues:**  
     - **Time crunch:** Use a timer (strict 90-sec debates). Skip 1-2 questions if needed.  
     - **Shy defenders:** Let students "pass" challenges (but they lose the token and can’t earn one).  
     - **Token hoarding:** Some may skip bidding to save tokens. Remind them that undefended answers earn nothing.  
     - **Cheating/notes:** Ban phones. If someone sneakily Googles, use it: *"See how factual answers felt ‘cheap’ to verify? Morals don’t work that way."*  

  ---

  ### **What the Game Can’t Capture (Requires Your Input)**  
  The game makes students *feel* the asymmetry but can’t explain **why moral testimony feels deficient even when reliable**. Post-game, you must clarify:  
  - **Key distinction:** Factual testimony transfers *information*; moral testimony tries to transfer *judgment*. We expect moral beliefs to reflect our character/agency ("It matters that *I* think this").  
  - **Quote to bridge the gap:** *"As Bernard Williams said, ‘In ethics, the point is not to know what is right, but to be the kind of person who does it.’ Testimony gives you the ‘what’ but not the ‘why’ that shapes your moral identity."*  

  **Why this works:** The auction makes testimony feel transactional, while challenges force students to "live" their borrowed beliefs. The category reveal then frames their discomfort as data, not bias. Run it tight, and they’ll leave debating whether ethics is *sui generis* – mission accomplished.
