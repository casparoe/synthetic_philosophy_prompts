prompt: |-
  Got into a three hour argument with my friend last night and I still cant shake it. She's a nurse practitioner, no fancy training, but she walks into a room and knows a patient's about to crash before the monitors do. I'm the one who actually read the physiology. Her line was: when I'm right, I'm right, and being right is the whole point of a belief — how you got there is just the wrapping paper. I said her hunches are luck and they'll abandon her someday. She said sure, and they abandoned her in exactly one place: she got floated to a psych ward last spring and was useless there, whereas I'd supposedly be fine anywhere. Except she also pointed out that I got a dosage wrong last month becuase I was reasoning from a textbook range instead of the actual patient in front of me.

  Now our hospital is piloting a diagnostic model that's about as accurate as her hunches, and it also can't explain itself. So help me settle this: who actually won that argument? And does the black box change anything — if it's right as often as she is, is there anything left over that she has and it doesn't?
