answer: |-
  ### Exam Question  
  **Section B: Answer ONE question**  
  **Question 3**  
  **(a)** "The concept of the 'Scientific Revolution' is defensible only if we specify *what kind* of change we are measuring." Using **one** unit of analysis (e.g., content/laws of motion, method, institutions, or actors’ self-understanding), evaluate this statement with reference to developments between the 14th and 17th centuries. In your answer, address why labelling earlier ideas (e.g., Buridan’s impetus or Oresme’s diagrams) as "precursors" may or may not resolve the debate. **(20 marks)**  
  **(b)** Do "the Middle Ages" and "the Renaissance" face the *same* challenges as the "Scientific Revolution" when judged as period labels? Explain why or why not. **(10 marks)**  

  ---

  ### Model Answer (Strong Second-Year Level, ~700 words)  
  **(a)** The "Scientific Revolution" label holds validity when applied to *institutional* change and *actors’ self-understanding*, but proves misleading for *content* or *method*. Focusing on **institutions** reveals a genuine discontinuity: the 17th century saw the rise of dedicated scientific societies (e.g., the Royal Society), formalized peer review, and state-funded research roles. Nothing equivalent existed in the 14th century. Merton College’s work on kinematics occurred within traditional scholastic frameworks, with no permanent structures to sustain inquiry beyond individual scholars. Similarly, actors’ **self-understanding** shifted decisively. Figures like Bacon and Newton explicitly framed their work as a rupture with the past, dismissing medieval scholarship as "blind obedience" (Bacon). In contrast, Buridan and Oresme saw themselves as improving Aristotelianism, not overthrowing it.  

  However, discontinuity claims falter for **content** and **method**. Oresme’s geometric proof of the mean speed theorem (using rectangular areas to represent uniform acceleration) mathematically resembles Galileo’s later work on falling bodies. Calling Oresme a "precursor" is valid *if* we show institutional or conceptual linkage. Galileo likely accessed Oresme’s ideas via 16th-century printed commentaries, making medieval work *load-bearing* for later "revolutionary" content. Likewise, Buridan’s impetus theory—while distinct from inertia (impetus self-expends; inertia persists)—systematically explained projectile motion without supernatural "antiperistasis." Newton’s first law refined, but did not invent, mechanical causation.  

  The "precursor trap" arises if we conflate similarity with direct continuity *or* dismiss similarity as irrelevant. Proving a discontinuity requires evidence that later thinkers *could not* build on earlier work (untrue here) or that earlier work was functionally isolated (partially true institutionally, but false for content transmission). For example, Oresme’s diagrams were tools for philosophical debate, not quantitative prediction. Galileo repurposed them for empirical kinematics. This *reapplication* marks change—but not a content revolution.  

  Thus, the Scientific Revolution "happened" institutionally and in self-perception, but not as a content/method rupture. The label’s "revolutionary" honorific reflects 17th-century actors’ triumphalism, not a sudden epistemological break.  

  **(b)** "The Middle Ages" and "the Renaissance" face *different* challenges than the "Scientific Revolution." **"Renaissance"** shares the *honorific* problem: it implies a "rebirth" of classical ideals, echoing humanists’ (e.g., Petrarch) polemics against medieval "barbarism." Like the Scientific Revolution’s self-mythologizing, this exaggerates novelty (medieval scholastics engaged deeply with Aristotle) but captures actors’ *authentic self-conception*.  

  **"Middle Ages,"** however, is primarily a *residual* category. Coined by Renaissance thinkers to define themselves against the past, it lumps heterogeneous eras (e.g., Carolingian vs. Late Medieval) under one "dark" label. Unlike the Scientific Revolution—which points to specific institutions/ideas—"Middle Ages" lacks positive content. It fails even as "bookkeeping" because it conflates distinct periods (e.g., 12th-century scholasticism vs. 14th-century nominalism) that lack shared identity.  

  The Scientific Revolution’s core weakness—retrospectively imposing unity on disparate changes—is less acute for these labels. The Renaissance *was* consciously constructed by its actors; the Middle Ages *was* consciously rejected. Their problems stem from imprecision and bias, not an ontological debate over discontinuity.  

  ---

  ### Marking Scheme (Total: 30 marks)  
  ***(a) Unit-Specific Discontinuity & Precursor Trap (20 marks)***  
  - **First-Class (17–20):**  
    - Chooses *one* unit (institutions/self-understanding/content/method) and rigorously defends discontinuity/non-discontinuity.  
    - Uses medieval material *concretely* (e.g., Oresme’s diagrams vs. Galileo’s application; Buridan’s impetus vs. inertia; Merton College vs. Royal Society).  
    - Explains "precursor trap": avoids "similar = same" or "different = irrelevant," demands evidence of *load-bearing* transmission (e.g., print availability, citation).  
  - **Competent-B (13–16):**  
    - Identifies unit but conflates units (e.g., discusses actors’ self-understanding while listing content achievements).  
    - Mentions medieval examples but superficially (e.g., "Buridan had ideas like inertia").  
    - Recognizes precursor trap but does not specify *how* to avoid it (e.g., "we need context" without naming transmission/survival).  
  - **Common Mistakes:**  
    - **–3 marks:** Lists 17th-century achievements as proof of "revolution" without medieval comparison.  
    - **–4 marks:** Treats "precursor" uncritically (e.g., "Oresme did Galileo’s work first, so no revolution").  
    - **–3 marks:** Uses "it depends on the definition" *as conclusion* rather than analytical starting point.  

  ***(b) Period Label Comparison (10 marks)***  
  - **First-Class (9–10):**  
    - Distinguishes all three labels: Scientific Revolution (discontinuity debate), Renaissance (actor-defined honorific), Middle Ages (residual/pejorative).  
    - Notes Renaissance actors’ *own* periodization vs. Middle Ages’ retrospective imposition.  
  - **Competent-B (7–8):**  
    - Contrasts Scientific Revolution with other labels but conflates Renaissance/Middle Ages (e.g., "both are constructed").  
    - Generic claims about "bias" without specifying *how* each label’s bias differs.  
  - **Common Mistakes:**  
    - **–3 marks:** Lumps all labels as "equally constructed" without differentiation.  
    - **–2 marks:** Only discusses one label (e.g., "Middle Ages was dark") or neither.  

  ---

  ### Why This Works  
  - **Forces unit specification:** Students *must* pick a unit to avoid "it depends" evasion.  
  - **Prevents "precursor" oversimplification:** Requires engagement with *how* medieval ideas survived or were transformed.  
  - **Part (b) differentiation:** "Middle Ages" as residual vs. "Renaissance" as actor-defined exposes distinct historical functions.  
  - **Concrete use of material:** Model answer embeds Oresme/Buridan/Galileo without name-dropping historians.  
  - **No false equivalence:** "Constructed" is treated as nuanced (honorific, residual, discontinuity-testing), not a synonym for "false."
