prompt: |-
  I run a small arts fund inside a county government. We give away about $400k a year to resident-led arts projects, any medium, and I chair the seven-person panel that decides. We recieve roughly 140 applications a cycle, twice a year. First-pass reviewers get about twelve minutes per file: the applicant's one-page summary plus a short sample — a recording, a script excerpt, some photos. Two of the panelists are ordinary residents with no arts training, and one is a county councillor who is terrified of the local paper. Anyone we turn down gets a written reason and can appeal, so every reason we give has to survive being read out loud at a public meeting.

  I've read What is Art? twice and I'm increasingly convinced Tolstoy's test gets at what we're actually trying to find out — whether the thing did something to somebody — far better than the rubric we inherited, whose top category is "artistic excellence and innovation." So build me the panel procedure: ordered steps a non-philosopher can run in twelve minutes, what counts as a pass at each step, where the procedure stops with a flat no, and where it has to hand the call to a human because its a values question rather than a facts question.

  Things it has to deal with explicitly:

  - infection as an actual test and not a vibe: what does a reviewer look for in the sample, and how do we stop "I wasn't moved" from turning into "this isn't art," given that Tolstoy's reply to the unmoved critic is that their capacity has atrophied — which makes the whole thing look unfalsifiable.
  - the three conditions, individuality / clarity / sincerity: which of them survive being turned into a check list item and which have to stay judgment, and how you assess sincerity from a file when nobody ever meets the applicant.
  - his counterfeit markers — borrowings, imitativeness, strikingness, amusement — usable as screens rather than as insults.
  - the subject-matter axis, feelings that unite against feelings that divide. He grades those against the religious perception of the age and we're a secular county running about four of those at once, so tell me what stands in for it and flag loudly that this step is values dressed as procedure. Our board rule also says nothing may be rejected for its politics, so the procedure has to separate a project that transmits a feeling from one that argues a thesis.
  - what we do with innovation, the criterion we publish and the theory treats as a red flag.

  Then run it on three real-ish files:

  1. Three-channel video, 22 minutes, wordless, about a town flooded for a reservoir, by an artist with a national reputation. Gorgeously made, allusive, you kind of need to know your way around gallery video to follow it. Our arts-side panelists put it top on innovation. When we played the sample for a resident focus group nobody could say what they felt; two said it was interesting.
  2. A cycle of songs written and sung by night-shift hospital cleaners, mostly recent immigrants, performed at shift change in the cafeteria. No notation, limited technique, tiny budget. When we played the recording in the room, two panelists teared up and one said she'd been humming it all afternoon. Two board members call it a nice community activity rather than art, and worry about precedent.
  3. A one-man spoken-word show plus a mural, from an applicant we funded three years ago. Infectious, no argument — the room laughed and hissed in exactly the right places, and it's obviously made from real feeling. But the feeling it transmits is a fierce we-against-them aimed at a named group of residents: the people who bought up the old mill housing. Tell me whether the verdict changes for a version of the same show whose feeling is indignation at the evictions themselves, and say why the two come out differently if they do.

  Say which of the three you'd fund and don't soften it — I already suspect at least one of your answers is something I can't sell to the board. Finish with what the procedure can't do, which Tolstoyan distinctions you had to drop to make it runnable and what breaks without them, and where it will predictably misfire in a room of seven tired people at 6pm.
reasoning: |-
  Okay, the user runs a small arts fund in county government and chairs a seven-person panel that decides on grants for resident-led arts projects. They give away about $400k annually, reviewing around 140 applications twice a year. Each reviewer gets only twelve minutes per application. The panel includes two ordinary residents without arts training and a county councillor worried about public perception. Every rejection must include a written reason that can withstand public scrutiny at an appeal meeting.

  The user has read Tolstoy's "What is Art?" and believes his framework—focusing on whether art "infects" others with genuine feeling—better captures what they're trying to evaluate than their current rubric centered on "artistic excellence and innovation." They want a practical, step-by-step procedure that can be applied within twelve minutes per application.

  Key challenges they need addressed:
  1. How to objectively assess "infection" without it becoming subjective ("I wasn't moved")
  2. How to evaluate Tolstoy's three conditions (individuality, clarity, sincerity) from a file
  3. How to use Tolstoy's counterfeit markers (borrowing, imitativeness, etc.) as screens
  4. How to handle the "unifying vs dividing" feelings axis in a secular context
  5. What to do with "innovation" which is in their rubric but Tolstoy criticizes

  They also provide three test cases:
  1. A technically excellent but inaccessible video about a flooded town
  2. Emotionally powerful songs by hospital cleaners that some dismiss as "not art"
  3. A skilled but divisive spoken-word show targeting a specific group

  The user needs a decision procedure that:
  - Can be run in 12 minutes by non-experts
  - Clearly defines pass/fail criteria
  - Identifies where human judgment is unavoidable
  - Produces defensible rejection reasons
  - Separates art from propaganda

  The deeper challenges I notice:
  - Balancing artistic merit with community accessibility
  - Navigating political sensitivities (the councillor's fear of media)
  - Serving both art experts and ordinary residents on the panel
  - Maintaining public trust through transparent processes
  - Distinguishing between professional art and community expression

  I consider how to structure the procedure to be both rigorous and practical within severe time constraints. The twelve-minute limit means each step must be ultra-focused. I plan to divide the review into timed phases: first assessing infection through concrete evidence, then checking for disqualifying counterfeits, evaluating Tolstoy's three conditions, and finally handling the values-based "unifying/divisive" test.

  For the infection test—the core of Tolstoy's framework—I suggest looking for specific, documented audience reactions rather than relying on the reviewer's personal response. This addresses the "unfalsifiable" problem by making it evidence-based. The counterfeit markers can serve as useful red flags when observable in the materials.

  The sincerity evaluation is particularly tricky without meeting the artist. I propose examining the artist's statement for vulnerability and the work for idiosyncratic details that suggest authentic expression. The unifying/divisive axis requires special handling since their rules prohibit political rejection—I'll frame this as assessing whether the work transmits feelings or argues positions.

  For the test cases:
  - The gallery video likely fails on infection despite technical merit
  - The cleaners' songs pass through demonstrated infection and sincerity
  - The divisive spoken word fails the unifying test, while a version focused on indignation at evictions (not landlords) might pass

  The procedure will inevitably have limitations. Tolstoy's nuanced distinctions between "religious perception" and temporary social values can't be fully operationalized. The sincerity evaluation remains somewhat subjective. And tired reviewers might oversimplify the infection test or skip steps when rushed.

  I'll conclude with specific funding recommendations for the test cases, acknowledging which decisions might be hard for their board to accept—likely the rejection of the prestigious video project. The key is creating a process that surfaces Tolstoy's essential question: Did this work successfully transmit genuine human feeling?
answer: |-
  Here's a Tolstoy-inspired panel procedure designed for 12-minute reviews, focusing on infection and sincerity while handling counterfeits and the unity/division axis transparently. It prioritizes defensible, evidence-based decisions over subjective taste.

  **The Tolstoy Procedure: 12-Minute Flow**

  1.  **Infection Check (3 mins): EVIDENCE-BASED PASS/FAIL**
      *   **Action:** Look *only* at the documented audience reaction OR simulate the "transmission" test using the sample.
      *   **Look For:** *Concrete evidence* in the file (quotes from focus groups, past audience feedback, panelist notes from sample viewing) OR, if none, *immediately* engage with the sample:
          *   Does it evoke a *specific, namable feeling* (e.g., melancholy, joy, unease, awe, solidarity, anger - not just "interesting" or "nice")?
          *   Can you *paraphrase* the core feeling transmitted ("This made me feel X about Y")?
      *   **Pass:** Evidence shows *any* specific feeling was transmitted to *any* documented audience member OR reviewer can name/paraphrase a distinct feeling from the sample. *Focus on transmission, not reviewer's personal resonance.*
      *   **Fail:** No evidence of transmission AND reviewer cannot identify/paraphrase a distinct feeling from the sample (e.g., only "confusing," "boring," "abstract," "interesting"). **STOP. REJECT.** Reason: "The submitted materials did not demonstrate the transmission of a specific feeling to an audience."
      *   **Why this works:** Shifts from "I wasn't moved" (subjective) to "Can *anyone* identify *what* feeling was transmitted?" (objective assessment of evidence/purpose). Avoids Tolstoy's "atrophied capacity" trap by seeking *any* evidence of transmission, not universal resonance.

  2.  **Counterfeit Screen (2 mins): FACT-BASED PASS/FAIL**
      *   **Action:** Scan for overt markers of Tolstoy's counterfeits in the project description, sample, and artist statement.
      *   **Look For:**
          *   **Borrowing/Imitation:** Is the work primarily copying a famous style/artist/trend without clear personal purpose? (e.g., "A Warhol-style soup can painting about consumerism").
          *   **Strikingness:** Is the primary goal shock, spectacle, or technical virtuosity *detached* from feeling? (e.g., focus on extreme content or complex technique without emotional core).
          *   **Amusement:** Is the primary goal light entertainment or puzzle-solving *without* deeper emotional transmission? (e.g., purely decorative work, a clever but emotionless riddle).
      *   **Pass:** No *overt, dominant* markers present. (Minor elements are okay).
      *   **Fail:** The work appears *primarily driven* by one or more counterfeits. **STOP. REJECT.** Reason: "The work appears primarily focused on [Borrowing/Imitativeness / Strikingness / Amusement] rather than the sincere transmission of feeling."
      *   **Why this works:** Uses counterfeits as objective red flags based on stated purpose/sample characteristics.

  3.  **Tolstoy's Conditions Check (4 mins): JUDGMENT CALLS**
      *   **Action:** Assess Individuality, Clarity, Sincerity based on the file.
      *   **Look For:**
          *   **Individuality:** Does the work feel unique *to this artist/community*? Does it avoid cliché? (Check sample & statement for personal voice, distinct perspective, unconventional approach relevant to the feeling).
          *   **Clarity:** Is the transmitted feeling reasonably discernible from the materials? (Link back to Infection Check - was the feeling identifiable?).
          *   **Sincerity (Crucial & Tricky):** Does the artist seem genuinely invested in the feeling transmitted? Look for:
              *   Vulnerability or personal connection in the artist statement.
              *   Alignment between stated intent, subject matter, and the feeling transmitted.
              *   Evidence of deep engagement (e.g., lived experience, extensive research, community involvement).
              *   *Avoidance* of overtly performative, detached, or "this is what funders want" language.
      *   **Pass:** At least 2 out of 3 conditions are reasonably met based on the file. (Sincerity is weighted most heavily).
      *   **Fail:** Two or more conditions are judged significantly lacking, *especially sincerity*. **STOP. REJECT.** Reason: "The work lacked sufficient [Individuality / Clarity / Sincerity - specify which] necessary for the authentic transmission of feeling."
      *   **Why this works:** Individuality/Clarity have observable hooks. Sincerity is a judgment call but grounded in textual/contextual evidence within the file. Requires justification.

  4.  **Unity/Division & Innovation (2 mins): VALUES FLAG**
      *   **Action:**
          1.  **Identify Feeling:** State the core feeling transmitted (from Step 1).
          2.  **Unity/Division Assessment: FLAGGED VALUES STEP**
              *   Does the core feeling inherently unite people (e.g., grief for a shared loss, awe at nature, joy in community, righteous indignation *against an impersonal force/system*)?
              *   OR does the core feeling inherently divide by targeting a *specific, named group* as the enemy/object of scorn (e.g., hatred of [Group X], mockery of [Group Y], triumph *over* [Group Z])?
          3.  **Innovation:** Briefly note if technical/formal innovation is present. *Do not score it.*
      *   **Pass:** Feeling is judged unifying OR divisive *but* meets all prior steps. **PROCEED TO FUNDING CONSIDERATION.**
      *   **Conditional Fail (Values Rejection - Board Rule Conflict):** Feeling is judged *inherently divisive* (targeting a specific resident group). **STOP. REJECT.** *Requires Panel Chair/County Attorney consultation due to Board Rule.* Potential Reason: "While the work demonstrates technical competence, the core feeling transmitted is inherently divisive towards a specific group of residents, which falls outside the scope of feelings appropriate for county-funded art." **FLAG LOUDLY: This is a values-based judgment disguised as procedure.**
      *   **Innovation Note:** Record presence/absence for reporting/publicity, but it does not factor into the pass/fail decision based on Tolstoy. "Innovation observed but not weighted."
      *   **Why this works:** Separates *transmitted feeling* (Tolstoy) from *political argument* (thesis). Unifying feelings pass. Divisive feelings targeting groups trigger the Board Rule conflict, requiring explicit (and risky) values-based rejection. Indignation at an *action/system* (evictions) is distinct from targeting the *people* doing it.

  5.  **Funding Threshold (1 min): PANEL DISCUSSION PREP**
      *   **Action:** If the application passed Steps 1-4, briefly note its relative strength (e.g., Strong Pass on Sincerity/Infection, Weak Pass on Clarity) for later panel ranking against other passed applications based on *impact of the infection* and *feasibility* (budget, plan).

  **Application to Test Cases:**

  1.  **Three-Channel Video:**
      *   **Infection:** FAIL. Focus group: "nobody could say what they felt; two said it was interesting." Sample likely abstract/ambiguous. *Reject.*
      *   **Reason:** "The submitted materials, including focus group feedback, did not demonstrate the transmission of a specific feeling to an audience."
      *   **Tolstoy Verdict:** Counterfeit risk (Strikingness/Borrowing - reliant on gallery conventions). Sincerity/Clarity questionable without transmission. **DO NOT FUND.**

  2.  **Hospital Cleaners' Songs:**
      *   **Infection:** PASS. Strong evidence: panelists teared up, humming. Specific feelings likely (camaraderie, resilience, melancholy?).
      *   **Counterfeit:** PASS. Not primarily imitative, striking, or amusing.
      *   **Conditions:** PASS.
          *   *Individuality:* High (specific community, experience).
          *   *Clarity:* High (feeling transmitted clearly to panel).
          *   *Sincerity:* High (lived experience, genuine expression).
      *   **Unity/Division:** PASS. Feelings likely unifying (shared struggle, pride, solidarity). Innovation: Low (noted).
      *   **Tolstoy Verdict:** Exemplary. Transmits authentic, unifying feeling clearly and sincerely. **FUND.**
      *   **Rebuttal to "not art/community activity":** Under Tolstoy, successful infection *is* art. Community origin reinforces sincerity/individuality.

  3.  **Spoken-Word/Mural (Original - Targeting Landlords):**
      *   **Infection:** PASS. Clear evidence (laughed, hissed).
      *   **Counterfeit:** PASS (assuming genuine anger, not performative).
      *   **Conditions:** PASS (Individuality/Clarity/Sincerity strong).
      *   **Unity/Division:** **CONDITIONAL FAIL (Values).** Core feeling is "fierce we-against-them aimed at a named group." Inherently divisive. *Reject under Board Rule.*
      *   **Revised Version (Indignation at Evictions):**
          *   **Infection:** PASS (likely still strong).
          *   **Counterfeit:** PASS.
          *   **Conditions:** PASS.
          *   **Unity/Division:** PASS. Core feeling is indignation at an *action* (evictions) or *system* (speculation, displacement), not hatred of a specific resident group. This can be unifying (shared outrage at injustice). **FUND.**
      *   **Why Different:** Tolstoy distinguishes the feeling transmitted. Anger *at an injustice* unites those who perceive the injustice. Hatred *directed at a person/group* inherently divides. The procedure flags the targeting of specific residents as the divisive element violating the Board Rule.

  **What the Procedure Can't Do (Limitations & Breaking Tolstoy):**

  1.  **Nuance in Sincerity/Individuality:** It simplifies deep philosophical concepts into checklist-ish judgments. A truly masterful counterfeit might pass the screen (Step 2) but lack sincerity (Step 3), relying on the reviewer's imperfect judgment. Tolstoy's rich analysis is reduced.
  2.  **"Religious Perception" Replacement:** Using "Unifying vs. Divisive" is a crude, secular proxy. It captures *part* of Tolstoy's intent (art should unite) but loses his specific moral/spiritual framework. It *is* values dressed as procedure at Step 4.
  3.  **Depth of Infection:** It measures *if* infection occurred (and roughly what feeling), not the *quality* or *moral depth* of the feeling as Tolstoy would prioritize. A deeply sincere but trivial feeling passes.
  4.  **Innovation's Complete Removal:** Tolstoy explicitly condemns innovation for its own sake. The procedure neuters it entirely (only noted). This *will* conflict with the published rubric and arts-panelist expectations. It breaks from standard arts funding norms.
  5.  **Predictable 6pm Misfires:**
      *   **Infection Check:** Tired reviewers may default to their *own* lack of feeling rather than seeking evidence/paraphrasing the *intended* feeling. "I don't get it" becomes a quick FAIL.
      *   **Sincerity Check:** Becoming cynical/skeptical, misreading vulnerability as performative, or missing subtle clues due to fatigue.
      *   **Unity/Division:** Tired minds default to simplistic "good vs. bad" or avoid the hard values call, letting divisive work through ("it's strong art!") or rejecting unifying work that challenges comfort zones ("too political!").
      *   **Rushing:** Skipping steps (especially Counterfeit Screen or deep dive on Sincerity evidence) to meet the 12-minute limit.

  **Conclusion:** This procedure prioritizes Tolstoy's core mechanism (infection) and essential conditions (sincerity) while building in defenses against counterfeits and handling the unity/division axis within your constraints. It will reliably fund work like the Hospital Cleaners (2) and reject inaccessible Gallery Video (1). The hard call is rejecting the divisive Spoken Word (3a) while funding the systemic-critique version (3b). **The biggest board challenge will be rejecting the prestigious, innovative video (1) while funding the "amateur" cleaners (2) and explicitly making values-based rejections like (3a).** The procedure provides defensible *reasons* rooted in transmission and feeling, not taste, but the shift away from "excellence/innovation" will be stark. Use the Funding Threshold (Step 5) to prioritize among passed applications based on infection strength/feasibility for the final allocation. Good luck!
