  Okay, the user has just had a three-hour argument with their friend Nora about Anscombe's absolutist stance on killing the innocent, specifically referencing the 1956 Oxford Truman degree controversy. Nora holds an absolutist view similar to Anscombe's, and the user needs help preparing for their next discussion. They've provided several scenarios where Nora has clear moral verdicts, and they want to understand the underlying rules that explain all those judgments.

  The user presents a new case involving military strikes against radiological weapons assemblers, where adjusting the acceptable risk threshold for civilian casualties affects the number of sorties flown and overall outcomes. They want to know how Nora would rule on flying 100 sorties (with higher expected civilian deaths), what moral judgment applies to the officer setting the thresholds, and whether writing down the threshold number changes the moral character.

  Looking at Nora's position, her verdicts suggest a strong adherence to the Doctrine of Double Effect (DDE) principles, even though the user asked to avoid historical discussion. Key points from her judgments: unintended deaths during munitions plant bombing are permissible; direct killing like lethal injection isn't; and intentions matter (the pilot being delighted doesn't taint the act itself). The core seems to be about the distinction between intended vs. foreseen harm and possibly a rejection of consequentialist weighing of lives.

  The user suspects there are at least three distinct rules at play. From Nora's cases, I can identify: 1) Intention rule - if you intend the death of innocents, it's murder; otherwise, it might be permissible. 2) Double Effect rule - requires proportionality between good effect and unintended harm. 3) No life-trading rule - rejecting utilitarian calculus where lives are weighed against each other. These don't collapse because intention alone doesn't handle proportionality (e.g., surgeon case), while no life-trading explains why the judge executing an innocent is wrong despite potential net lives saved.

  For the military case: Flying the 100 sorties likely violates the no life-trading rule because Command is explicitly setting thresholds based on expected deaths versus lives saved. This puts lives on a scale. The act itself might be murder because the civilian deaths aren't merely side effects but are factored into the decision calculus. The officer writing down the threshold formalizes this calculus, making the life-trading explicit.

  To distinguish between the rules, a discriminating case could involve unintended harm that's foreseen and certain but not intended, without life-trading. For example, diverting a runaway trolley to a track where it kills one person to save five involves directly intending to use that person's death as a means (violating DDE), versus a case where harm is a side effect without such intent.

  My best guess is Nora would condemn flying the 100 sorties as murder because it explicitly involves trading lives. The core rules are intention, double effect proportionality, and no life-trading. The discriminating case helps test whether the no life-trading rule is doing independent work beyond intention and proportionality.
answer: |-
  Here are the candidate rules, predictions, and a discriminating case, based on Nora's absolutism and Anscombe's framework (without historical detail):

  **Candidate Rules:**
  1.  **Intention Rule:** Directly intending an innocent's death is always murder; merely foreseeing it as a side effect is permissible if the act is otherwise good/proportionate.
  2.  **Proportionality Rule:** Foreseen death is permissible *only* if it's a *proportionate* side effect of achieving a sufficiently good end.
  3.  **No Life-Trading Rule:** Deliberately causing an innocent's death *as a means* to save others, or *weighing* lives against lives in the decision calculus, is forbidden (even if unintended as an end).

  **Predictions for the Military Case:**
  *   **Flying the 100 Sorties:** Nora condemns it as **murder**. Setting a threshold based on "acceptable" expected deaths vs. lives saved explicitly violates the **No Life-Trading Rule (Rule 3)**. Command is directly factoring civilian deaths into their utility calculation ("saves considerably more lives overall"). This isn't merely foreseeing unintended deaths; it's deliberately accepting/risking them *as the cost* for achieving the greater good. The act itself becomes immoral.
  *   **The Officer Setting Thresholds:**
      *   **100 Sorties Threshold:** Setting this threshold **makes the officer's act murderous** (writing it down formalizes the life-trading calculus).
      *   **40 Sorties Threshold:** Likely condemned similarly, just less severely (still deliberate life-trading, just less of it).
      *   **Near-Zero Threshold:** Permissible (avoids deliberate life-trading). The act of setting the threshold itself is fine here.
  *   **Does Writing it Down Change It?** For the higher thresholds, **yes.** Writing down the "acceptable" number concretizes the forbidden life-trading calculus, making the immorality explicit in the command decision itself. It's not just the pilot's act anymore; it's Command's policy.

  **Best Guess for Nora's Answer:** She condemns flying the 100 sorties as **murder** and condemns the officer setting that threshold for **deliberate life-trading**. The **No Life-Trading Rule (Rule 3)** is the core differentiator, explaining why the munitions plant raid (where deaths are *not* priced in) is fine, but this case and the judge/innocent are murder. Rule 1 (Intention) explains the doctor cases and rotten pilot. Rule 2 (Proportionality) explains the munitions plant vs. the surgeon (disproportionate means). Rule 3 explains the judge and *this* military case.

  **Discriminating Case (Rule 1/2 vs. Rule 3):**
  *   **Case:** A runaway trolley will kill 5 workers. You can divert it onto a side track where it will kill 1 worker. You *foresee* this death but divert *only* to save the 5; you don't *intend* the 1 to die. Is diverting permissible?
  *   **Why it Discriminates:** Rule 1 (unintended side effect) and Rule 2 (proportionate) suggest **permissible**. Rule 3 (No Life-Trading) likely condemns it as **murder** because you are *deliberately* causing one death *as the means* to save five (classic consequentialist weighing). If Nora condemns this, **Rule 3 is primary and absolute**. If she permits it, Rules 1 & 2 dominate for her.

