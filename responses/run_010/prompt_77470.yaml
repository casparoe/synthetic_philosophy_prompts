prompt: |-
  Just came off a three hour argument with my friend Nora about Anscombe and the whole 1956 Oxford Truman degree business and I need a second brain before I go back tomorrow. She's an absolutist about killing the innocent, roughly Anscombe's line, and her track record, as best I can reconstruct it:

  - the firebombings and the two atomic bombs: murder, and the fact that they plausibly shortened the war doesn't touch it at all
  - a bomber that has to hit a munitions plant, where people in the next block are likely to die, where nobody ever sat down and priced those deaths and the plant just had to be hit, and the target is worth it: fine
  - the exact same raid, but the pilot is privately delighted that some of them will die: the act is fine, the man is rotten
  - a doctor pushing morphine for a dying patient's pain, knowing it'll likely hasten the end: fine
  - a doctor injecting a lethal dose to end the same suffering: murder
  - a surgeon who kills one healthy patient to get organs for five: murder
  - a judge who executes an innocent man to head off a riot that would kill hundreds: murder
  - you shoot someone who is trying to kill you: fine

  Asked why, she'll only give me two sentences, and I can't tell whether they're one rule or two: its about what you're going for, and you never get to put lives on a scale against other lives. I'm suspicious the second one can't be a whole rule on its own given the munitions plant, but she won't say more.

  Here's the case I'm bringing her. A military is flying strikes against a group assembling radiological weapons. Every sortie carries something like a 15% chance of killing a non-combatant inside the target building — nobody knows who or even whether, the intel just isn't good enough. Command is picking the acceptable risk threshold. At the current one they fly 40 sorties a month. Doubling the tolerated expected civilian deaths per sortie lets them fly 100, and their own models say that shuts the program down months earlier and saves considerably more lives overall, civilian ones included. Dropping the threshold to near zero means 10 sorties a month and the program goes ahead.

  So: what does she say about flying the 100, and separately about the officer who sets the threshold at each level — does writing the number down change the moral character of what happens under it? Give me the rules that genuinely fit all eight verdicts above (I think there are at least three and they don't collapse into each other), what each predicts for this case, your single best guess at her answer and why you'd bet on that rule over the rest, and one further case that would tell the top two apart if she squirms on this one.

  Under 450 words total. Candidate rules as short labelled bullets, then the prediction, then the discriminating case. No history of double effect please, she's read more of it than me and I've read plenty.
