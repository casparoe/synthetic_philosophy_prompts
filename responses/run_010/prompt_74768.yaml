     b. No. → Q11  

  10. **Q10 (Decision Rule: Aggressive)**: In the urn bet (cost $0.45, pays $1 if red), would you accept it for best-case gain?  
      a. Yes. → **Leaf: Imprecise Probability (Maximax Rule)**  
