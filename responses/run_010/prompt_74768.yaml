  ### Brainstorming: Mapping the Logical Space of Partial Belief Theories

  #### Dimensions of Variation:
  1. **Sharp Probability Assignment**: Whether every event must have a single numerical probability.
     - Always sharp (precise Bayesian).
     - Sometimes unsharp (imprecise views).
     - Never sharp (extreme skepticism; rare).

  2. **Source of Unsharpness (if admitted)**:
     - Epistemic only (agent's ignorance).
     - Ontological (world is indeterminate).
     - Representational (pragmatic tool).

  3. **Representation of Unsharp Belief**:
     - Single number with evidential weight.
     - Interval of probabilities.
     - Set of probability functions.
     - Distribution over probabilities (second-order).

  4. **Updating Behavior**:
     - Always sharpens with evidence (e.g., conditioning).
     - Can dilate (become less definite) after evidence.
     - Can remain unchanged despite evidence.

  5. **Decision Rule under Unsharpness**:
     - Maximin (avoid worst-case loss).
     - Maximax (chase best-case gain).
     - Hurwicz (weighted blend of min/max).
     - Midpoint/expectation (average the range).
     - Dominance (avoid dominated options).

  6. **Requirement of Sharpness**:
     - Must be as sharp as evidence permits.
     - Can remain unsharp even with strong evidence.

  #### Populated Positions:
  - **Precise Bayesian (Symmetry)**: Sharp probabilities via indifference principles.
  - **Precise Bayesian (Arbitrary Sharp)**: Sharp probabilities without justification.
  - **Maximum Entropy**: Sharp probabilities maximizing uncertainty given constraints.
  - **Imprecise Probability (Credal Sets)**: Beliefs as sets of probabilities, updated by conditioning, allowing dilation.
  - **Chance-Gap View**: Probabilities are unsharp due to ontological indeterminacy.
  - **Evidential Weight View**: Sharp probability paired with a measure of evidence strength.
  - **Deflationary View**: Unsharp states as bookkeeping tools; decisions require sharp probabilities.
  - **Second-Order Probability**: Distribution over sharp probabilities.

  #### Unoccupied Cells (Diagnosis):
  - **Consistently Sharp but Non-Updating**: Incoherent (contradicts conditionalization).
  - **Unsharpness as Evidential Character without Representation**: Unattractive (fails to guide decisions).
  - **Dilation Denial in Credal Sets**: Incoherent (mathematically inevitable in some updates).
  - **Ontological Unsharpness with Sharp Decisions**: Unattractive (indeterminacy should affect choices).

  #### Inseparable Pairs:
  - **Maximax vs. Hurwicz with High Optimism**: Requires an additional choice scenario (e.g., a high-risk/high-reward bet) to distinguish aggression from optimism.
  - **Deflationary vs. Midpoint Imprecise**: Verbal difference; both collapse to sharpness in decisions, but deflationism treats intervals as provisional.

