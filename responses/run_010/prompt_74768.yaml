  We are designing a decision tree to distinguish between different theories of partial belief. The target audience is quantitatively fluent rationalists familiar with concepts like calibration and point probabilities. The tree must be based on concrete cases and specific claims, without using technical jargon. We must cover the required distinctions and include the specified cases and leaves.

  First, we brainstorm the logical space. The dimensions along which theories of partial belief differ include:

  1. **Existence of Sharp Probabilities**: Does every question admit of a sharp probability?
     - Yes, always (precise Bayesianism).
     - No, sometimes probabilities are unsharp (imprecise probability).

  2. **Nature of Unsharp States (if admitted)**:
     - Representing the character of the evidence (e.g., the evidence is ambiguous).
     - Representing the agent's ignorance (epistemic).

  3. **Representation of Unsharp States**:
     - An interval (e.g., [0.4, 0.6]).
     - A set of probability functions (credal set).
     - A distribution over distributions (second-order probability).
     - A sharp number with a separate measure of evidential weight (e.g., Keynes's weight of evidence).

  4. **Update Rule for Unsharp States**:
     - Update by conditioning every member of the credal set (generalized conditioning).
     - Update by other rules (e.g., natural extension, Jeffrey conditioning for sets).
     - For second-order probabilities, update by conditioning the second-order distribution.

  5. **Behavior Under Evidence**:
     - Does the state become less definite after some evidence? (dilation)
     - Does the state fail to become more definite over a long run of observations?

  6. **Requirement of Sharpness**:
     - Must beliefs be as sharp as the evidence permits? (e.g., the principle of sharpness)
     - Or can they remain unsharp even when evidence is sufficient?

  7. **Decision Rule when Unsharp**:
     - Maximin (maximize the minimum expected utility).
     - MaxiMax (maximize the maximum expected utility).
     - Hurwicz criterion (weighted average of min and max).
     - Minimax regret.
     - Dominance (if one option dominates regardless of the probability function in the set).
     - Using the second-order distribution to compute an overall expected utility.

  Additionally, we must consider:

  - **Interpretation of Probability**:
    - Subjective (beliefs only).
    - Objective (chances in the world).
    - Epistemic (based on evidence).

  - **Deflationary Views**: Unsharp states as merely a convenience, not a feature of rational belief.

  Now, we map the positions that are actually defended:

  1. **Precise Bayesian (Subjective)**:
     - Always assigns a sharp probability.
     - Updates by conditioning.
     - May use symmetry principles (e.g., 1/2 for unknown coin) or adopt a sharp prior without symmetry.

  2. **Precise Bayesian (Objective)**:
     - Believes in objective chances and uses the principle of indifference or maximum entropy to set priors when information is scarce.

  3. **Imprecise Probability (Set-based)**:
     - Represents belief as a set of probability functions (credal set).
     - Updates by conditioning each function in the set.
     - Accepts that the set can dilate (become less definite) upon evidence.
     - Uses a decision rule like maximin or minimax regret.

  4. **Second-Order Probability**:
     - Assigns a sharp probability distribution over possible probability functions.
     - Updates by conditioning the second-order distribution.
     - The overall probability is the expectation of the first-order probabilities.

  5. **Interval-Valued Beliefs**:
     - Assigns an interval of probabilities (a special case of credal sets).
     - Updates by some rule that maps to intervals.

  6. **Evidential Weight (Keynesian)**:
     - Sharp probability but with a separate measure of the weight of evidence (how much evidence you have).
     - Not a full theory of unsharp belief, but a related idea.

  7. **Maximum Entropy**:
     - Assigns the sharp probability that maximizes entropy given constraints.

  8. **Deflationary View**:
     - Unsharp states are just a way to talk about sets of precise probabilities, but for decision making, one must choose a sharp probability.

  9. **Chance-Gap View**:
     - The world itself has indeterminacy (not just ignorance), so probabilities are not sharp.

