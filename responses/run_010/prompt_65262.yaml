prompt: |-
  Our department's interdisciplinary reading group on signalling — behavioural ecologists, a couple of game theorists, and several of us drifting over from economics — spent last week's session on the peacock's tail, and the discussion eventually collapsed into a sentence one of the senior members repeated at least three times: honest signals are honest because they are too expensive to fake. He deployed it against two objections at once. The first was mine: I suggested that some traits are reliable precisely because they cannot be produced inaccurately at any price — a toad's call frequency being mechanically tethered to its body size, for instance — and he answered that this was simply the same principle wearing a disguise. The second came from a colleague who works on corporate pledges: she argued that a firm's costless public commitment can still carry information if breaking it triggers sanctions imposed by the audience, and he replied that where no resources are destroyed, nothing is being signalled.

  I would rather interrogate the sentence than the man, and I suspect it is being made to do work it cannot do without heavy qualification. Could you lay out, as a list I can bring to next week's meeting, the distinct precise theses that sentence might be standing for? I am thinking of at least the following axes, and I would like you to work through them systematically and add any I have missed:

  - cost as an absolute level of expenditure borne by the signaller, versus a differential in the marginal cost — or the marginal benefit — of signalling across types;
  - waste, in the sense of resources destroyed, versus transfer, in the sense of resources handed to the receiver or to a third party;
  - cost assessed out of equilibrium, i.e. what a liar would have to pay, versus cost assessed in equilibrium, i.e. what honest signallers actually pay;
  - cost as condition-dependence (only the best-off can afford it) versus cost as deterrence (the worse-off are priced out);
  - whether the claim is about the signaller's outlay or about the receiver's response rule, since a signal's costliness is only meaningful relative to what the receiver does when it is not sent;
  - whether the sentence is offered as a theorem about signalling games, a claim about how signalling systems evolve, or an empirical generalisation about which animal traits turn out to be expensive.

  For each reading, say plainly whether it is true by stipulation, substantive and defensible, or false, and note in particular whether there is a version of the principle under which honesty survives even though the highest-quality signaller gains from signalling. I would also like to know whether any reading survives the case where signaller and receiver have largely aligned interests, and — the point that actually matters for me — which readings, if any, license dismissing unfakeable mechanical constraints as a species of the same idea, and which license the claim that audience-administered punishment cannot make a costless signal informative. Verdicts, please, not just a taxonomy, together with a brief note on which reading people most likely intend when they say it in mixed company. I am not after references or a survey of the literature; I want the distinctions themselves.
reasoning: |-
  Okay, let me approach this systematically. The user wants a clear breakdown of possible interpretations behind "honest signals are honest because they are too expensive to fake," addressing specific axes they've outlined. 

  First, I need to consider the various dimensions they mentioned: cost as absolute expenditure vs marginal differential, waste vs transfer, out-of-equilibrium vs in-equilibrium cost, condition-dependence vs deterrence, signaller outlay vs receiver response, and theoretical vs empirical claims. 

  For each interpretation, I'll evaluate truth status and applicability. The key tests are: whether honesty can persist when high-quality signallers benefit from signaling, whether aligned interests break the principle, and whether it covers mechanical constraints or audience sanctions. 

  I recall that in standard signaling theory, the core mechanism is differential cost - high-quality types pay less for the same signal. The "waste" element is common but not essential; transfers can work too. For mechanical constraints, they're honest precisely because they're unfakeable, not costly - so that only fits under a stretched "infinite cost to fake" interpretation. Audience sanctions introduce a different enforcement mechanism where cost comes from punishment, not production. 

  The senior member's dismissal of both objections seems to overextend the principle. Mechanical constraints aren't about cost but physical impossibility, while audience sanctions replace production cost with contingent punishment cost. The most defensible version focuses on differential costs, not absolute waste. 

  In mixed company, people likely intend the differential cost interpretation but often oversimplify to "signals must be costly." I'll make clear which interpretations hold water and which collapse under scrutiny, especially regarding the two objection cases.
answer: |-
  Here's a systematic breakdown of distinct interpretations of "honest signals are honest because they are too expensive to fake," evaluated against your axes and objections. For each, verdicts address truth status, key tests, and applicability to mechanical constraints/audience sanctions.  

  ### Interpretations & Verdicts  
  *(Ordered from most to least defensible in signaling theory)*  

  1. **Differential Marginal Cost (The Spence-Zahavi Core)**  
     - *Thesis:* Honesty requires that low-quality types incur higher *marginal cost* (or lower *marginal benefit*) to produce the *same* signal as high-quality types.  
     - **Verdict:** **Substantive and defensible** (core of signaling theory).  
     - High-quality gain? **YES** (high types can net-benefit; e.g., peacocks attract mates despite tail cost).  
     - Aligned interests? **SURVIVES** (honesty can emerge if costs differ sufficiently).  
     - Mechanical constraints: **DISMISSES?** *Only if stretched*: A toad's call isn't "expensive" but *impossible* to fake; this is distinct from cost differentials.  
     - Audience sanctions: **REJECTS dismissal** of costless signals. Punishment *creates* differential cost (breaking pledge is costlier for low-quality firms).  

  2. **Absolute Expenditure as Deterrence (Waste-Based)**  
     - *Thesis:* Signals must involve **wasted resources** (not transfers) that low-quality types cannot afford to produce, deterring them from signaling.  
     - **Verdict:** **Substantive but over-restrictive**.  
     - High-quality gain? **NO** (if net cost > benefit, signals are handicaps; high types may still benefit *relatively*).  
     - Aligned interests? **FAILS** (waste undermines mutual benefit; unlikely to evolve).  
     - Mechanical constraints: **DOES NOT LICENSE DISMISSAL** (no expenditure required).  
     - Audience sanctions: **LICENSES DISMISSAL** of costless signals (no waste).  

  3. **Out-of-Equilibrium Cost to Fake**  
     - *Thesis:* Honesty requires that a liar attempting to mimic a high-quality signal would pay **prohibitively high costs** (even if honest signallers pay less).  
     - **Verdict:** **Substantive and defensible** (aligns with game-theoretic models).  
     - High-quality gain? **YES** (equilibrium cost can be low for high types).  
     - Aligned interests? **SURVIVES** (if mimicry is costlier for low types).  
     - Mechanical constraints: **LICENSES DISMISSAL** (infinite cost to fake = "too expensive").  
     - Audience sanctions: **REJECTS dismissal** (sanctions make faking costly).  

  4. **Condition-Dependence (Affordability)**  
     - *Thesis:* Only high-quality signallers can *afford* the signal’s absolute cost (e.g., due to greater resources).  
     - **Verdict:** **False as a general principle** (fails if low types can pool by signaling).  
     - High-quality gain? **YES** (but system is unstable without differential costs).  
     - Aligned interests? **FAILS** (low types could signal if resources permit).  
     - Mechanical constraints: **NO LINK** (not about affordability).  
     - Audience sanctions: **NO LINK** to costless signals.  

  5. **Receiver-Response Relativity**  
     - *Thesis:* Costliness is defined relative to the receiver's response. A signal is "expensive" if *not* signaling yields higher payoff (e.g., due to receiver skepticism).  
     - **Verdict:** **True by stipulation** (tautological; reframes cost as opportunity cost).  
     - High-quality gain? **YES**.  
     - Aligned interests? **SURVIVES** (but trivializes "cost").  
     - Mechanical constraints: **DOES NOT LICENSE DISMISSAL** (focuses on behavior, not physics).  
     - Audience sanctions: **UNDERMINES DISMISSAL** (sanctions define opportunity cost).  

  6. **Evolutionary Generalisation (Empirical)**  
     - *Thesis:* In nature/anthropology, honest signals *tend* to involve conspicuous resource expenditure.  
     - **Verdict:** **Substantive but overgeneralized** (many exceptions: e.g., indexical signals like toad calls).  
     - High-quality gain? **IRRELEVANT** (descriptive claim).  
     - Mechanical constraints: **REJECTS DISMISSAL** (acknowledges unfakeable traits as distinct).  
     - Audience sanctions: **REJECTS DISMISSAL** (costless pledges exist in human markets).  

  ---

  ### Summary Verdicts  
  - **Which readings license dismissing mechanical constraints?**  
    Only **#3 (Out-of-Equilibrium Cost)** weakly licenses it (by equating "impossible" with "infinitely expensive"). **#1 (Differential Cost)** does not.  
  - **Which readings license dismissing audience sanctions?**  
    Only **#2 (Absolute Waste)** does. **#1, #3, #5** recognize sanctions *create* differential/opportunity costs.  
  - **"Mixed Company" Intent:** Likely **#1 or #2**, often conflated. Senior member probably leans on **#2** (waste) to dismiss both objections, but this is indefensibly narrow.  

  ### Core Insight  
  The sentence is most robust as **#1 (Differential Marginal Cost)**. Here, "expensive to fake" means **faking is *relatively* costlier for low-quality types** — not necessarily wasteful, absolute, or paid in equilibrium. This survives aligned interests, allows high-type benefits, and *refutes* the senior member’s dismissal of audience sanctions (which create differential costs). Mechanical constraints (**your toad example**) are honest but **not costly**; lumping them under "expensive" obscures a fundamental distinction between **strategic cost** and **physical constraint**.
