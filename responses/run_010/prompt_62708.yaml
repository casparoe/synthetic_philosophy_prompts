prompt: |-
  You are a philosopher of law with specialist expertise in mid-twentieth-century debates over legal moralism and the proper limits of the criminal law. Think the problem through carefully before answering, and begin by brainstorming the candidate principles that could generate the track record below rather than settling on the first principle that happens to fit.

  I sit in a jurisprudence seminar whose tutor defends the criminal enforcement of morality in a broadly Devlin-like vein: on her account, the law may reach conduct that the reasonable member of the community regards with revulsion rather than mere dislike, subject to respecting privacy as far as the cohesion of society allows. Her rulings so far this term:

  1. Repealing the offence covering consensual homosexual acts between adults in private — opposed; the repeal would be a mistake.
  2. Creating a new offence of adultery — opposed; the conduct is condemned, but it belongs to the divorce courts, and enforcing it would mean searching bedrooms.
  3. Creating a new offence of sexual contact with an animal, where the animal is uninjured and there are no witnesses — supported.
  4. Extending the obscenity offence to private adult possession — opposed; she would confine it to material liable to reach children or to corrupt the young.
  5. Creating a new offence of desecrating a grave, committed alone at night and noticed by no one — supported.
  6. Decriminalising the private use of a currently prohibited narcotic by adults — opposed.
  7. Repealing the offence of bigamy — opposed.
  8. Criminalising a publication that a bare majority of the public finds merely distasteful — opposed; she insists the test is not a head-count, and that distaste falls short of the reaction the law should wait for.
  9. Amending an existing offence simply because recent polling shows the moral climate has moved — opposed; she holds that the criminal law should change slowly and that a shift in opinion is not by itself a reason to change it.

  The legislature is now weighing a bill to repeal a long-standing offence concerning the treatment of human remains. The sponsors describe the conduct as follows: it takes place entirely in private; every body involved was released under the deceased's written consent given while alive, together with the consent of the family; no living person is distressed by it; and three surveys over the last five years show that the public now regards the practice with curiosity and mild queasiness rather than horror.

  Predict her verdict on this bill, and then:

  (a) Lay out the distinct principles that are each consistent with all nine earlier rulings — I expect at least three to fit — and say which familiar candidates are already ruled out by particular verdicts, naming the verdict that does the ruling out.
  (b) State what each surviving principle implies about the repeal bill, and mark precisely where they diverge.
  (c) Give your best single prediction with reasons. Be explicit about an ambiguity in her notion of the reasonable member of the community: is that figure a proxy for actual public feeling, or a normative ideal whose reactions may outrun or lag the polls? Show how each reading changes the prediction, and which reading her verdicts in 8 and 9 support.
  (d) Propose one or two further hypothetical bills that would discriminate among the principles that survive her verdict on this one, and give the verdict each principle predicts for them.
  (e) Close with two or three sentences on where the Hart-style objections to enforcing morality bite hardest on this bill, and whether any surviving principle can absorb them.

  Aim for roughly 800 words. Argue from the structure of her verdicts rather than from anything she may have said in print; you may invoke the general shape of the debate over legal moralism, but do not supply quotations, citations, or a reading list.
reasoning: |-
  Okay, the user is presenting a complex scenario involving a jurisprudence seminar tutor who follows a Devlin-like approach to legal moralism. The tutor has made nine specific rulings on various legal issues, and now the user wants me to predict how this tutor would rule on a new bill concerning the treatment of human remains. 

  First, I need to understand the tutor's position. She seems to be following Patrick Devlin's philosophy that society can criminalize behavior based on collective moral outrage, specifically when the "reasonable member of the community" feels revulsion. But she also respects privacy to some extent. The nine rulings give concrete examples of where she draws the line.

  Looking at the rulings:
  - She opposes decriminalizing homosexual acts (1) but also opposes criminalizing adultery (2) - this suggests she distinguishes between levels of moral condemnation.
  - She supports criminalizing bestiality even without witnesses (3) and grave desecration even when unnoticed (6) - these seem to trigger strong revulsion.
  - She opposes extending obscenity laws to private possession (4) and criminalizing merely distasteful publications (8) - showing she requires more than mild disapproval.
  - She opposes changing laws based solely on shifting public opinion (9) - indicating stability matters.

  For the new bill about human remains, the key points are: it's done with consent, in private, causes no distress, and the public reaction is curiosity and mild queasiness rather than horror. 

  To answer part (a), I need to identify at least three distinct principles consistent with all nine rulings. Principle A could focus on "intrinsic moral gravity" - the inherent wrongness of certain acts regardless of public feeling. Principle B might emphasize the "public feeling threshold" - requiring intense revulsion. Principle C could be about "social symbolism" - acts that represent core societal values. 

  I can see how each principle fits the rulings. For example, Principle A explains why grave desecration is criminalized (intrinsic wrong) while adultery isn't. Principle B explains the opposition to criminalizing distasteful publications (insufficient revulsion). Principle C explains why bigamy remains criminalized (threat to marriage institution).

  For part (b), these principles diverge on the human remains bill. Principle A would likely oppose repeal (intrinsic wrong), Principle B would support repeal (only mild queasiness), while Principle C would oppose repeal (grave desecration symbolizes respect for the dead).

  Part (c) is tricky because it hinges on interpreting the "reasonable member" concept. Is it a proxy for actual public feeling (which would support repeal since polls show mild queasiness) or a normative ideal (which might maintain opposition)? Her rulings 8 and 9 suggest she leans normative - distaste isn't enough, and laws shouldn't change with polls. So I'd predict she opposes the repeal.

  For part (d), hypothetical bills could test these principles. One could be about private flag desecration - Principle A might oppose criminalizing, Principle B might support if there's revulsion, Principle C would strongly support. Another could be about ritual animal sacrifice - this would differentiate Principle A (might oppose) from Principle C (might support if tied to community values).

  Finally for part (e), Hart-style objections would argue that criminalizing consensual, harmless acts is illegitimate paternalism. This bites hardest on Principle A which enforces morality without tangible harm. Principle B somewhat absorbs this by requiring intense public feeling as a democratic check, while Principle C might argue the social cohesion justification.

  Throughout this, I'm maintaining focus on the tutor's established pattern rather than external theories, while acknowledging where philosophical tensions exist in her position.
answer: |-
  ### Prediction on the Repeal Bill  
  She will **oppose the repeal**, maintaining the offence concerning the treatment of human remains.  

  ---

  ### (a) Candidate Principles Consistent with All Nine Rulings  
  **Ruled-Out Principles**:  
  - *Pure Harm Principle* (Mill): Rejected by verdicts 1 (homosexual acts harmless but criminalized) and 6 (drug use criminalized despite privacy).  
  - *Majoritarian Moralism*: Rejected by verdict 8 (mere distaste or majority opinion insufficient) and 9 (no quick law changes with shifting polls).  
  - *Privacy as Absolute Shield*: Rejected by verdicts 3 (bestiality criminalized privately) and 5 (grave desecration criminalized privately).  

  **Surviving Principles**:  
  1. **Principle A: Intrinsic Moral Gravity**  
     - The law targets conduct intrinsically violating foundational societal values (e.g., sanctity of life/death, sexual integrity), *regardless* of public feeling or privacy. Explains rulings 1 (homosexuality as deviant sexuality), 3 (bestiality as desecration), 5 (grave desecration as violation of the dead), and 6 (drugs as self-degradation).  
  2. **Principle B: Public Feeling Threshold**  
     - Criminalization requires *intense, stable revulsion* from the "reasonable person" (not mere distaste or transient views). Privacy yields only if revulsion is overwhelming. Explains rulings 2 (adultery: condemned but not revolting), 4 (obscenity: limited to protect youth, not general revulsion), 8 (distaste ≠ revulsion), and 9 (stability over polls).  
  3. **Principle C: Social Symbolism**  
     - The law protects acts symbolizing core social institutions (marriage, burial rites) whose erosion threatens cohesion. Explains rulings 1 (homosexuality as threat to traditional marriage), 5 (grave desecration as attack on burial rites), 7 (bigamy as undermining marriage), and 6 (drugs as eroding rational agency).  

  ---

  ### (b) Implications for the Repeal Bill & Points of Divergence  
  - **Principle A (Intrinsic Gravity)**: Opposes repeal. Consent is irrelevant; misusing human remains intrinsically violates respect for the dead (like grave desecration in ruling 5). Mild public queasiness doesn’t negate gravity.  
  - **Principle B (Feeling Threshold)**: Supports repeal. Public feeling is only "mild queasiness" (below revulsion), no distress, and privacy is high (like adultery in ruling 2). Surveys show revulsion is absent.  
  - **Principle C (Social Symbolism)**: Opposes repeal. Treatment of remains symbolizes societal respect for the dead; consent doesn’t erase symbolic harm (cf. ruling 5). Cohesion requires upholding burial norms.  

  **Divergence**:  
  - A/C vs. B on whether *mild public queasiness* suffices (B: no; A/C: intrinsic/symbolic harm overrides feeling).  
  - A vs. C on source of wrong: A (inherent desecration) vs. C (institutional threat).  

  ---

  ### (c) Best Prediction & Ambiguity in "Reasonable Member"  
  **Ambiguity Resolved**:  
  - **Proxy for Actual Feeling?** Would align with polls (mild queasiness → support repeal).  
  - **Normative Ideal?** Could condemn acts even if polls are mild (e.g., due to "reasonable" moral depth).  

  **Rulings 8 & 9 Support Normative Reading**:  
  - Verdict 8: Rejects "head-count" for distaste; "reasonable member" assesses moral severity, not popularity.  
  - Verdict 9: Law changes slowly; "reasonable" morality is stable, not poll-driven.  

  **Prediction**: **Oppose repeal** (aligns with Principles A and C).  
  - **Why?** The conduct parallels grave desecration (ruling 5), which she supported criminalizing privately. Consent and mild queasiness don’t override the symbolic/intrinsic harm to societal values. Normative "reasonable member" likely views this as revolting (like desecration) despite polls.  

  ---

  ### (d) Hypothetical Bills to Discriminate Principles  
  1. **Bill X: Criminalize private flag desecration (no witnesses, owner’s consent)**  
     - **Principle A**: Oppose (no intrinsic moral harm; property rights prevail).  
     - **Principle B**: Support only if surveys show intense revulsion (e.g., burning national flag).  
     - **Principle C**: Support (flag as core national symbol; consent irrelevant to symbolic harm).  

  2. **Bill Y: Decriminalize private ritual animal sacrifice (sanitary, consented by owner)**  
     - **Principle A**: Oppose decriminalization (intrinsic desecration of life, like bestiality).  
     - **Principle B**: Support decriminalization if public shows curiosity/mild disgust (below revulsion).  
     - **Principle C**: Oppose decriminalization if sacrifice threatens secular norms (social cohesion).  

  ---

  ### (e) Hart-Style Objections and Absorption  
  **Hart’s Core Objections**:  
  - **Liberty**: Criminalizing consensual, harmless acts (like this bill) is paternalistic, violating autonomy.  
  - **Pluralism**: Law enforcing "morality" suppresses minority practices in diverse societies.  
  - **Evidence**: No proof that such acts damage social structure.  

  **Where It Bites**: Hardest on **Principle A** (intrinsic wrong without harm evidence) and **Principle C** (symbolic harm assumed, not proven). Principle B best absorbs Hart by tethering law to *demonstrable* public revulsion (empirical check on moralism) and respecting privacy where revulsion is absent (as here).  

  **Survival?** Principle B could integrate Hart by requiring *both* revulsion and minimal harm, but her support for criminalizing private bestiality (no harm) and grave desecration (no witnesses) suggests she rejects harm as necessary.  

