answer: |-
  Right, then. Let's cut through the fog. You've given us a set of intuitive verdicts on what counts as part of your mind versus what doesn't, and they're messy because real life is messier than Otto's notebook. Clark and Chalmers' original "parity principle" (if it plays the same functional role as internal cognition, it counts) clearly isn't holding up to your lived experience. The good news is that your instincts aren't random—there *is* a principle (or a tight set) lurking here. I'll lay it out plainly, test it against your cases, show where it stumbles (and why that's instructive), and run it through some new examples to check for cognitive bloat. No jargon, no bibliography, just the mechanics.

  ### The Core Principle: The ACT Criteria
  After mapping your verdicts, the clearest fit is a set of four jointly necessary conditions. A resource counts as part of your cognitive process **if and only if** it meets all four:

  1.  **Automatic Deployment:** The resource is accessed or deployed without conscious deliberation *as part of initiating or sustaining* the cognitive task. It’s not something you “decide” to consult; it’s folded into the action.
  2.  **Continuous Availability:** The resource is reliably present and accessible *in the immediate context* whenever the relevant cognitive demand arises. It’s not stored away or requiring retrieval effort.
  3.  **Transparent Integration:** You engage with the *content* directly, not the tool itself. The resource feels like a transparent lens—you “see through” it to the information, without focusing on its mechanics or mediating role.
  4.  **Non-Agency:** The resource lacks independent cognitive agency. It doesn’t have its own goals, perspectives, or capacity for original thought. (This explicitly rules out other conscious beings.)

  Call it the **ACT Criteria** (Automatic, Continuous, Transparent, Non-Agency). Crucially, these are binary gates—fail any one, and it’s not part of your mind, no matter how “functional” it seems. Now, let’s run your cases through this sieve. I’ll note which clause is decisive for each verdict.

  ### Your Cases: ACT Applied
  -   **Blind man's stick: YES.**  
      *Automatic:* Wielded without conscious thought when navigating.  
      *Continuous:* Always “on” and in-hand during use.  
      *Transparent:* Feels like direct perception; attention is on the curb, not the stick.  
      *Non-Agency:* Stick has no agenda.  
      *(Clause doing the work: Transparency—it’s literally sensory extension.)*
  -   **Otto's notebook (original): YES.**  
      *Automatic:* Habitually consulted for addresses; no “decision” needed.  
      *Continuous:* Carried and accessible whenever location info is needed.  
      *Transparent:* Otto reads the address as “his belief”; doesn’t ponder the notebook’s role.  
      *Non-Agency:* Notebook isn’t thinking for him.  
      *(Clause doing the work: Automaticity—it’s a reflexive loop.)*
  -   **Your notes app (unused for months): NO.**  
      *Fails Automaticity & Continuity:* Requires deliberate retrieval (you must open the app). Not contextually present—it’s archived.  
      *(Decisive clause: Continuity—it’s inert, like a gym membership.)*
  -   **Your office whiteboard: YES.**  
      *Automatic:* Glanced at “without deciding”; part of workflow.  
      *Continuous:* Physically present and updated weekly; always “live”.  
      *Transparent:* You see tasks/deadlines directly, not “the whiteboard”.  
      *Non-Agency:* Just a surface.  
      *(Clause doing the work: Automaticity + Transparency—seamless scaffolding.)*
  -   **Calculator: NO.**  
      *Fails Automaticity & Transparency:* You deliberately “punch in” inputs and perceive it as a black box (attention is on the *tool* generating an answer, not the steps).  
      *(Decisive clause: Transparency—you’re aware of outsourcing.)*
  -   **Pen-and-paper calculation: YES? (But a casualty—see below)**  
      *Automatic:* Arguably semi-deliberate to start, but once going, it’s integrated into working memory.  
      *Continuous:* Active engagement keeps it “live”.  
      *Transparent:* You attend to the unfolding steps (content), not the paper.  
      *Non-Agency:* Paper isn’t cogitating.  
      *(Verdict tension: It *should* be YES under ACT, but your intuition says it’s “thinking” while calculator isn’t. I’ll address this as a casualty.)*
  -   **Your wife (birthdays/dates): NO.**  
      *Fails Non-Agency:* She’s a conscious being with her own mind. Even if trusted, consulting her involves social interaction, not cognitive extension.  
      *(Decisive clause: Non-Agency—trumps functional similarity.)*
  -   **Cochlear implant: YES.**  
      *Automatic:* Always “on” during hearing.  
      *Continuous:* Integrated into sensory apparatus.  
      *Transparent:* Processes sound directly; no focus on the device.  
      *Non-Agency:* No independent cognition.  
      *(Clause doing the work: All four, but Transparency is key—like the stick.)*
  -   **Otto's notebook (tampered): NO.**  
      *Fails Transparency & (implicit) Endorsement:* Trust is broken, so Otto *would* now focus on the notebook as an object (is it reliable?). It’s no longer a transparent belief-source.  
      *(Decisive clause: Transparency—corrupted trust makes it opaque.)*
  -   **Trusted chatbot: NO.**  
      *Fails Automaticity & Non-Agency:* Requires deliberate querying (not automatic). Also, it *simulates* agency, triggering social cognition—you’re “asking” it, not extending your mind.  
      *(Decisive clause: Automaticity + Non-Agency—it feels interpersonal.)*
  -   **Your past writing ("past me was an idiot"): YES (internal cognition).**  
      *Not ACT’s domain:* This is memory retrieval, not extension. ACT handles *external* resources.  
  -   **Phone satnav while driving: YES.**  
      *Automatic:* Active and guiding without deliberation during navigation.  
      *Continuous:* Contextually available (in-car use).  
      *Transparent:* Instructions feel like direct spatial awareness; you don’t “listen to the satnav”, you turn left.  
      *Non-Agency:* Algorithmic, no agenda.  
      *(Clause doing the work: Transparency—it’s perceptual-motor integration.)*  
      *Your skill-loss point:* ACT doesn’t care. A tool can atrophy biological capacity (like calculators for arithmetic) yet still be cognitive scaffolding *in the moment*.

  ### Casualties: Where ACT Clashes With Your Intuition
  Two verdicts don’t perfectly align. I’ll be straight: you likely need to drop one. The cost is either philosophical tidiness or your gut feeling.

  1.  **Pen-and-paper calculation (your verdict: YES) vs. Calculator (NO):**  
      ACT says both *could* be YES if the pen-and-paper is habitual and transparent (as in your description). But your intuition distinguishes them: pen-and-paper “feels like thinking,” while the calculator feels like outsourcing.  
      - *The Cost of Keeping Your Verdict:* If you insist pen-and-paper is extended cognition but the calculator isn’t, you must abandon ACT’s *Transparency* clause or water it down. Why? Because both require initial deliberate action (picking up pen, pressing buttons), but once active, both *can* be transparent (you focus on steps or result). ACT, strictly applied, says if you’re attending to the *process* (pen-and-paper steps) transparently, it’s in; if you’re attending to the *tool* (calculator as oracle), it’s out. Your feeling that the calculator “hands you an answer” is exactly Transparency failing—but pen-and-paper passes if it’s part of your workflow.  
      - *Solution:* Embrace ACT. Your pen-and-paper verdict *can* hold—it’s a YES under ACT if it’s transparently integrated. The calculator is a NO because it’s opaque (black box). This preserves your intuition without special pleading. If you still feel the calculator *should* sometimes count (e.g., if used constantly like Otto’s notebook), that’s a different scenario—ACT would call it YES if habitual and trusted.

  2.  **Wife (NO) vs. Otto’s notebook (YES):**  
      ACT nails this: Non-Agency cleanly separates them. No casualty here—your verdict stands. The notebook is a tool; your wife is a person. Functionality is irrelevant.

  3.  **Tampered notebook (your verdict: NO):**  
      ACT says YES (Otto still uses it automatically and transparently—he just has false beliefs). Your instinct to call it “false belief” is spot-on, but ACT doesn’t require truth.  
      - *The Cost of Keeping Your Verdict:* You’d need to add a “reliability” clause (e.g., “The resource must be factually accurate”). But that sinks the satnav (which can misdirect) and Otto’s original notebook (which could contain errors). Worse, it makes cognition depend on truth, which is slippery—your biological memory is fallible too.  
      - *Solution:* Drop your verdict. ACT’s Transparency clause handles this: if Otto *knew* about the tampering, Transparency would fail (he’d second-guess the book). But while he trusts it, it’s still cognitive scaffolding—just faulty. This avoids a reliability rabbit-hole.

  ### Testing ACT: New Cases (No Cognitive Bloat)
  You asked for ordinary-reader examples. I’ll pick two:

  1.  **A wristwatch you check constantly for the time:**  
      *ACT verdict: YES.*  
      Automatic (glanced habitually), Continuous (on your wrist), Transparent (you see “3:00”, not “the watch”), Non-Agency. It’s timekeeping as extended cognition.  
      *Bloat check:* No—your shelf of unread books fails Continuity; your phone in another room fails Continuity.

  2.  **A well-used recipe book open while cooking:**  
      *ACT verdict: YES (if habitual cook), NO (if occasional).*  
      If you cook daily and automatically consult the same stained page: Automatic, Continuous (open on counter), Transparent (you see “add salt”, not “the book”), Non-Agency.  
      If it’s fetched occasionally: fails Automaticity & Continuity.  
      *Bloat check:* No—your entire cookbook shelf isn’t continuously available. Your spouse (even if dictating recipes) fails Non-Agency.

  **Cognitive Bloat Verdict:** ACT dodges it. “Continuous Availability” and “Automatic Deployment” prevent inert objects (bookshelves) from counting. “Non-Agency” blocks people (family). Only contextually embedded, habitually accessed tools qualify.

  ### The Underlying Philosophy
  The ACT Criteria reframes Clark and Chalmers: it’s not about *functional equivalence* but *phenomenological and operational immediacy*. The mind extends when resources become so woven into your actions that they vanish—leaving only the task itself. Your unease with the calculator and chatbot isn’t inconsistency; it’s your brain spotting the seams in the integration. This also explains why your satnav weakens your innate skill: when tools are truly transparent, we offload effort (biology gets lazy). For your piece, this tension—between efficiency and atrophy—is the unsettling bit. The reader’s train journey ends, but they’re left wondering if their phone is part of them or just a crutch. That’s your hook.

  If you hold ACT’s feet to the fire, the pen-and-paper case is the only real casualty of your instincts—but it’s salvageable. The tampered notebook verdict should go; it costs you little and avoids a worse mess. British English box ticked. Now go unsettle those commuters.
