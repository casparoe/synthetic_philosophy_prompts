prompt: |-
  I cover science and ideas for a magazine, and for the last two months I've basically been embedded with one syntactician for a long piece on the innateness debate. She's a card-carrying nativist but a strangely disciplined one, and since I'm moderating a panel with her at a festival in the spring I've been keeping a list of her verdicts, mostly so I can catch her out. Here's the list as close to her own words as I can manage.

  On forming yes/no questions in English — the fact that you front the auxiliary belonging to the main clause, so "is the man who is tall happy" rather than the first auxiliary you hit going left to right — she says that one is built in, full stop, because a kid who tried the linear rule would never be told its wrong, the input doesn't disconfirm it, and yet kids don't make the mistake. Same verdict for the ban on pulling a question word out of a relative clause ("what did you meet the man who bought"). On binding she splits in a way that surprised me: the ban on a sentence-initial pronoun picking up a name that comes later ("he thinks John is clever") is innate, because kids obey it as soon as they can string two clauses together at all; but the ban on a pronoun taking a nearby antecedent — the one that makes "Mama Bear is touching her" mean somebody other than Mama Bear — she insists is *not* innate, that it falls out of the other principle plus some processing or pragmatic limitation that clears around six, which on her account is why kids fail the standard picture-matching experiment for years. Word order, which auxiliaries a language happens to have, irregular past tenses and plurals: all learned from the input, no complaint, she's happy to give those away. And the bit I keep coming back to: when I asked how a child ever gives up "goed" if nobody corrects them, she said statistics — the kid hears "went" often enough in exactly the contexts where they'd have said "goed," and the overgeneralization gets knocked out by entrenchment. She was pretty firm about that, and she added that the overregularization error itself still shows there's an innate default to add the regular ending, so the default is built in but its range of application is learned. That distinction has been rattling around in my head ever since.

  The question I've got loaded for the panel is about dropping subjects: whether the child's knowledge that English doesn't allow a missing subject — that "is raining" and "went to the store" aren't sentences, where the Italian kid's equivalents are fine — is built in or learned. The awkward parts, which I'll lay out on stage: nobody ever tells the kid that subjectless sentences are ungrammatical, the input just never contains one, and "I never heard it" doesn't by itself distinguish *forbidden* from *nobody happened to say it*; on the other hand the input is stuffed with overt subjects including the meaningless ones ("it's raining," "there's a dog outside"), so there's a positive cue you could point at, and there's a measurable difference between the English and Italian inputs; and English two-year-olds do go through a stretch of dropping subjects themselves ("want cookie," "doggie barking"), which could mean they haven't figured anything out, or could just mean thier mouths and working memory are worse than their grammar. Some people also claim that if you count carefully, English two-year-olds produce overt subjects more often than you'd expect by chance, which if true seems to cut the other way again.

  So: predict her answer. What I actually want is the machinery behind it, because her record seems to me to fit at least three different rules — something like "if positive evidence can't disconfirm the wrong hypothesis, the right one is innate," something like "only universal structural principles are innate and anything that varies between languages is a switch you set from the data," and something like "let the child's own statistics do as much work as you can possibly get away with" — and I honestly can't tell which one she's running, since they agree on everything she's ruled on so far. Name the candidate rules that are consistent with her whole record, say what each of them predicts for the subject-dropping case and for the early telegraphic stage, and give me your single best guess about what she'll say on stage plus the reason you prefer it over the others. Then tell me whether her entrenchment answer about "goed" commits her to something here she'd rather not be committed to — i.e., whether the dummy "it" in "it's raining" counts as a competing form that preempts the subjectless version the same way "went" preempts "goed," or whether that analogy quietly breaks down, and where. And finish by giving me one further case I could actually put to her live, a construction or a developmental finding where at least two of those rules give different answers, so the panel isn't just two people agreeing in different vocabularies. If you think she has no consistent answer available, say so, and say which verdict she'd have to give up to get one. I've already got the reading list, so please don't send me one — I just want the reasoning.
reasoning: |-
  Hmm, the user is a science journalist who's been embedded with a syntactician for a piece on the innateness debate. They're moderating a panel with this linguist and want to predict her stance on subject dropping in English. They've provided detailed notes on her positions across various linguistic phenomena, which show a pattern: she attributes certain grammatical constraints to innateness when positive evidence can't disconfirm incorrect hypotheses (like question formation) but allows statistical learning for others (like irregular verbs).

  The user suspects three possible underlying principles guiding her judgments: 1) Innateness when positive evidence can't disconfirm errors, 2) Innateness only for universal structural principles, with language-specific features learned, and 3) Maximizing statistical learning where possible. All three seem consistent with her past positions so far, but the subject-dropping case might force a distinction.

  For subject dropping in English: The key tension is that while English lacks subjectless sentences in input (suggesting possible innateness under principle #1), there's also abundant positive evidence with dummy subjects ("it rains"), and English toddlers do drop subjects initially. Principle #1 would likely call this innate since kids aren't reliably corrected about missing subjects. Principle #2 would say it's learned because subject dropping varies cross-linguistically (English forbids it, Italian allows it). Principle #3 would lean on statistical preemption - the high frequency of "it" in dummy subjects could block subjectless versions, similar to how "went" blocks "goed."

  Her "goed" explanation complicates things: If statistical preemption works for verbs, why not for subjects? But the analogy might break because dummy "it" isn't semantically equivalent to a missing subject in the way "went" directly competes with "goed." 

  For a test case to force divergence between principles, binding Condition B is perfect: If kids temporarily allow "Mama Bear is touching her" to mean self-touching, this challenges principle #1 (since positive evidence can't directly disconfirm the error) but fits principle #3 (pragmatic development). Principle #2 is murky here since binding varies subtly across languages.

  My best prediction is she'll say subject dropping is learned via statistics, because it aligns with her pattern of offloading as much as possible to learning. This maintains consistency with her "goed" stance and avoids a new innate principle just for English-specific features.
answer: |-
  Based on your detailed account of her positions and the underlying tension between her principles, here's the breakdown:

  **Candidate Rules Consistent with Her Record:**

  1.  **The "No Positive Evidence for Disconfirmation" (NPED) Rule:** If a child could form a persistent, *structurally possible but incorrect* grammatical hypothesis that the input *never explicitly contradicts or disconfirms* (e.g., through absence of examples, explicit correction, or unambiguous statistical patterns), then the *correct* constraint must be innate.
      *   *Predictions for Subject Dropping:*
          *   **Innate:** Kids *could* hypothesize that dropping subjects is fine (like Italian). The input never *shows* them it's wrong (no one says "Hey kid, 'Want cookie' is ungrammatical!"). Kids *do* drop subjects initially, suggesting they might start with this hypothesis. Therefore, the ban must be innate, as they eventually learn it without disconfirmatory evidence.
          *   **Telegraphic Stage:** Represents early errors before the innate constraint fully matures or is integrated. The fact they *stop* doing it without correction supports innateness.
  2.  **The "Universal Structure Only" (USO) Rule:** Only principles that are truly universal across languages (e.g., structure-dependence in question formation, binding Condition C) are innate. Anything that *varies* parametrically between languages (like word order, subject dropping, aux inventory, irregular morphology) must be learned from the input by setting switches or detecting cues.
      *   *Predictions for Subject Dropping:*
          *   **Learned:** Subject dropping (pro-drop) is a classic parameter. English is [-pro-drop], Italian is [+pro-drop]. Since it varies, it *cannot* be innate. The child learns it from the overwhelming presence of overt subjects (including expletives like "it") in the input. The difference between English/Italian input is the cue.
          *   **Telegraphic Stage:** Represents performance limitations (working memory, production capacity), not a grammatical error per se. The underlying grammatical knowledge (that subjects are required) might be present but masked. Higher overt subject rates than chance support this.
  3.  **The "Maximal Statistical Preemption" (MSP) Rule:** Innateness is the last resort. Wherever possible, attribute acquisition to statistical learning from the input, especially via *preemption*: a statistically dominant, contextually appropriate alternative form blocks the incorrect form. Innateness is only invoked when statistical learning demonstrably fails (no plausible preemptor, no cue for disconfirmation).
      *   *Predictions for Subject Dropping:*
          *   **Learned (via Preemption):** The child initially considers both options (overt and null subjects). The ubiquitous presence of overt subjects, especially the expletive "it" in contexts where meaning would be clear without a subject ("raining" -> always "It's raining"), statistically preempts the null subject option. Hearing "It's raining" thousands of times blocks the child from saying "Is raining".
          *   **Telegraphic Stage:** Represents either performance limitations *or* the statistical preemption mechanism still strengthening. Higher overt subject rates than chance are evidence *for* the statistical learning process working early.

  **Your Best Guess for Her Answer on Stage & Why:**

  *   **Prediction:** She will argue the subject-drop parameter is **learned** (likely via **MSP**, emphasizing preemption by expletives).
  *   **Reason:** This best fits her overall pattern of *minimizing innate content where learning seems plausible*. She readily gave away word order, auxiliaries, and irregulars to learning. Her passionate defense of entrenchment/preemption for "goed" shows a strong commitment to statistical learning mechanisms. Invoking an innate parameter solely for [-pro-drop] when the input provides such a strong statistical cue (ubiquitous overt subjects, including semantically "empty" ones) would be inconsistent with her stance on other variable phenomena like word order. She'll likely downplay the telegraphic stage as performance, argue the higher-than-chance overt subject rate shows early sensitivity, and emphasize the expletive "it" as the key preemptor.

  **The "Goed" Entrenchment Commitment & the Subject Dropping Analogy:**

  *   **Does it commit her?** Yes, strongly. Her argument for "goed" relies on **preemption by a statistically dominant, contextually equivalent alternative ("went")**. She explicitly invoked this mechanism.
  *   **Analogy to Subject Dropping:** "It's raining" vs. "Is raining" looks like a direct parallel:
      *   **Competing Forms:** "went" competes with "goed"; "It's raining" competes with "Is raining".
      *   **Statistical Dominance:** "went" is overwhelmingly frequent in past contexts; "It's raining" is overwhelmingly frequent in weather contexts.
      *   **Contextual Equivalence:** Both forms express the same core meaning (past action of going; current weather state of raining).
  *   **Does the Analogy Break Down?** She might *try* to argue it does, but the breakdown is weak:
      *   **Possible Argument 1: "It" is grammatical, not lexical.** "Went" is a lexical item competing with another potential lexical item ("goed"). "It" is a syntactic placeholder. However, for the *child acquiring the syntactic pattern*, "It's raining" *is* the competing structural pattern to "Is raining". The MSP rule focuses on the surface form blocking the alternative surface form, regardless of the semantic emptiness of "it".
      *   **Possible Argument 2: Telegraphic speech shows the null option exists.** But her own explanation for early overregularization ("goed") shows that children *do* produce non-adult forms before preemption fully kicks in. Telegraphic null subjects could be the equivalent phase for syntax.
      *   **Conclusion:** The analogy holds strongly. To be consistent with her "goed" explanation, she *must* argue that the overt subject (specifically the expletive "it" in relevant contexts) statistically preempts the null subject option. Denying preemption here undermines her argument for "goed".

  **The Divergence Test Case: Binding Condition B (The "Mama Bear" Problem)**

  *   **The Phenomenon:** The principle (Condition B) that a pronoun ("her") cannot be bound by a locally c-commanding antecedent ("Mama Bear"). Thus, "Mama Bear is touching her" cannot mean Mama Bear is touching herself; "her" must refer to someone else.
  *   **Her Stated Position:** She insists this is *not* innate, attributing it to processing/pragmatics maturing around age 6, explaining why young children fail picture-matching tasks (often accepting the self-touch interpretation).
  *   **Why it Diverges:**
      *   **NPED Rule Prediction (Should be Innate):** A child *could* hypothesize that "Mama Bear is touching her" *can* mean self-touching. The input *never* explicitly disconfirms this hypothesis (no one says "Hey kid, that sentence *can't* mean she's touching herself!"). Positive examples where the pronoun *does* refer to someone else ("Mama Bear is touching Goldilocks") don't prove it *can't* ever refer to Mama Bear. If kids obey Condition C innately "as soon as they can string two clauses together," why not Condition B? NPED strongly predicts Condition B *should* be innate. **Her position (learned) contradicts NPED.**
      *   **MSP Rule Prediction (Could be Learned?):** Could statistical preemption work? Maybe. If the child hears "Mama Bear is touching herself" for the reflexive meaning and "Mama Bear is touching her" *only* for the disjoint meaning, the reflexive form preempts the pronoun form for self-reference. However, the evidence is messier than "goed/went" – reflexive and pronoun forms aren't always in strict complementary distribution pragmatically. MSP *could* potentially be stretched to fit her learned position, but it's less clear-cut than subject drop or "goed".
      *   **USO Rule Prediction (Murky):** Condition B shows strong cross-linguistic similarities but also subtle variations and potential exceptions. It's less clear-cut as a universal than Condition C or structure-dependence. USO might *allow* it to be learned if argued not to be strictly universal. Her position is compatible with USO.
  *   **Why it's Perfect for the Panel:** It directly pits her stated position (learned) against the strongest prediction of the NPED rule (innate). Ask her: **"You argued Condition B isn't innate because children make errors until around age 6, attributing this to processing. But according to your 'No Positive Evidence for Disconfirmation' principle – the same one you used for question formation and Condition C – shouldn't Condition B *also* be innate? After all, the child could incorrectly allow local binding of pronouns, and the input never explicitly tells them it's impossible. How do you reconcile this with your other innate verdicts?"** This forces her to either:
      1.  Defend why Condition B *does* have disconfirmatory evidence (hard),
      2.  Argue that the errors are *not* evidence of the wrong grammatical hypothesis but purely performance (difficult given the age profile and task),
      3.  Admit NPED isn't the sole rule and weaken that principle, or
      4.  Reconsider her stance on Condition B's innateness (unlikely).

  **Conclusion on Consistency:** She *does* have a consistent underlying principle: **Maximize Statistical Preemption (MSP) and only invoke innateness when MSP demonstrably fails (NPED as a specific failure mode).** Her "goed" stance and likely subject-drop stance show MSP driving learning. Her innate verdicts (questions, Condition C) are cases where MSP fails – there's no plausible competing form to preempt the linear question hypothesis or the Condition C violation. Her Condition B stance fits MSP (attributing acquisition to developing processing/pragmatics, potentially involving statistical learning of interpretation patterns). The apparent tension arises because NPED is a powerful *indicator* of where MSP fails, but her core driver is MSP. The Condition B question exposes that NPED alone isn't her absolute rule; MSP/learning is prioritized where she sees a plausible mechanism. Her position is consistent under MSP-as-primary. Asking about Condition B vs. NPED will expose this prioritization most clearly.
