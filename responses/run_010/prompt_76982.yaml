  Below is a systematic breakdown based on Nadia's five verdicts, designed to predict her ruling on your seamount case. I'll follow your requested structure precisely.

  ---

  ### **1. Candidate Rules Fitting All Five Verdicts**  
  *(Stated as Nadia might articulate them)*  

  **Rule A: Structural Powerlessness**  
  > "A multipolar trap exists when no individual actor *can* act to prevent collective harm without being penalized or outcompeted, *and* no binding coordination mechanism exists to override individual incentives."  
  *Fits all cases: Skippers couldn't stop (1), cyclists couldn't quit (4), but pulp mill (2) had courts, and quotas/IMO (3,5) created binding mechanisms.*  

  **Rule B: Defection-Dominated Payoffs**  
  > "It's a trap when the dominant strategy for every rational actor is to defect (e.g., overfish, dope, cheat), even though mutual cooperation would yield better collective outcomes, *and* defection is individually unavoidable."  
  *Fits: Cod/doping had unavoidable defection (1,4); pulp mill (2) wasn't a strategic choice; quotas/ballast rules (3,5) changed payoffs to make cooperation rational.*  

  **Rule C: Absence of Enforceable Coordination**  
  > "A trap requires a coordination failure: actors *want* to cooperate but cannot, due to the lack of an enforceable agreement or authority that prevents free-riding."  
  *Fits: No enforcement for cod/doping/ballast pre-convention (1,4,5); pulp mill (2) had enforcement via courts; quotas/IMO (3,5) provided enforcement.*  

  **Rule D: Exit Impossibility**  
  > "A trap exists when no actor can unilaterally exit the harmful behavior without catastrophic loss, *and* collective exit is blocked by competitive or institutional constraints."  
  *Fits: Skippers/cyclists couldn't exit (1,4); pulp mill (2) allowed exit via litigation; quotas/ballast rules (3,5) created viable exit paths.*  

  ---

  ### **2. The "Killed" Rule and Irreversibility's Status**  
  - **Plausible-sounding rule killed:** The **"Irreversible Harm Rule"** (traps require point-of-no-return consequences).  
  - **Killed by:** The **doping case (4)**. Nadia explicitly dismissed your reversibility argument ("beside the point"), focusing on cyclists' powerlessness despite the harm being reversible.  
  - **Irreversibility's status:** *Demoted*, not dead. It may amplify tragedy but isn't necessary. For Nadia, traps are about **constraints on agency**, not consequences. Hysteresis matters to *you* (due to fisheries experience), but her criteria are structural.  

