  Whether the tokens which stir industry might not also require a steward, who by varying their issue and the terms of their creation, can temper the rage of circulation in boom and the numbness in slump, so that the counters do not become either torpid or frantic? (Berkeley could hold this consistently: his state-backed currency implies stewardship, and Alciphron's sign theory allows adaptive token governance.)
