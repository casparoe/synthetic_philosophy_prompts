prompt: |-
  I'm doing some informal advising for a foundation that wants to fund roughly four people for two years on the theory side of citizen assemblies, juries, and expert panels — basically everything that hangs off the Condorcet jury theorem. The catch is they're allergic to math-for-math's-sake. Every deliverable has to be something a panel organizer, a constitutional reformer, or a court administrator could actually use when making a design choice: how big the group should be, whether to let people talk before they vote, whether to weight votes by measured competence, whether to require a supermajority, whether to break the question into sub-questions and aggregate those instead. What they want from me is a defended research agenda, not a survey of the literature, and definitely not a reading list — I'm not going to be able to chase down citations and I'd rather you just reason it through.

  Here's the candidate pile, roughly as I've scribbled it. (1) The correlation problem: the theorem's headline result assumes votes are independent conditional on the state of the world, but real people talk, read the same newspapers, and get recruited from overlapping pools, so errors line up. How much correlated error can you swallow before majority accuracy stops climbing with size, and is there a non-asymptotic version a practitioner could actually plug numbers into? (2) Weighted voting: if you can estimate individual competence from past accuracy, does competence-weighted majority beat simple majority, or does the noise in your competence estimates eat the whole gain? (3) Deliberation: does structured discussion push error correlation up or down, and can that be modeled at all rather than just hand-waved at? (4) Beyond binary: what survives when there are more than two options, or when you aggregate rankings, or when you split a decision into premises and a conclusion? (5) Asymmetric error costs: for some decisions a false positive is way worse than a false negative, which is where supermajority and quorum thresholds come in — is there a principled way to set them from the cost ratio? (6) Strategy and preference falsification: what happens when voting isn't sincere, either from incentives or from social pressure? (7) The framing objection, which a friend of mine thinks is the real issue: the theorem presupposes there's a procedure-independent right answer, and for value questions rather than factual ones that presupposition may just be false, in which case the whole apparatus is being misapplied whenever assemblies decide policy rather than diagnose a problem.

  My own instinct — possibly wrong, tell me so — is that (1) is the crux and most of the others are downstream of it, since if you can't bound correlated error then the jury-size and weighting answers are all artifacts of an assumption nobody believes. But I can see the counterargument that (1) is intractable for a group of four in two years and (5) is the one with real near-term policy bite. So: rank these for this specific funder, defend the ranking explicitly in terms of how much other work depends on the answer, how tractable it is for people with formal training but not a full-time probability theorist, and how much it would change what an organizer does on Monday morning. Flag any that you think are overrated, any that are secretly the same question wearing two hats, and any important open question I've left off the pile entirely. Then tell me what would move things up or down — what result in the first year, or what failure to make progress, should make them abandon a line and reallocate. I'd rather have three well-argued priorities than seven hedged ones.
reasoning: |-
  Okay, the user is advising a foundation that wants to fund research on the practical applications of the Condorcet jury theorem. The foundation wants actionable insights for organizers of citizen assemblies, juries, and expert panels. They're allergic to purely theoretical math, so everything must translate to real-world design choices like group size, deliberation formats, voting weights, etc. The user has listed seven candidate research topics and needs help prioritizing them based on impact, tractability, and practicality.

  First, I need to understand the user's main concern: they suspect that the correlation problem (topic 1) is the crux because if errors are correlated, the theorem's assumptions fall apart. But they're open to other perspectives, especially if other topics offer more immediate policy impact. The foundation wants deliverables that practitioners can use directly, so theoretical results must be translatable into guidelines or tools.

  Looking at the seven topics:
  1. Correlation problem: Addresses the core assumption of independence. If errors are correlated, increasing group size might not help, which undermines many other results.
  2. Weighted voting: Useful if individual competence can be measured, but noise in estimates might negate benefits.
  3. Deliberation: How structured discussion affects error correlation. Hard to model but crucial because real groups deliberate.
  4. Beyond binary: Most real decisions aren't yes/no, so extending to multiple options or rankings is important.
  5. Asymmetric error costs: Practical for setting supermajority thresholds based on cost ratios.
  6. Strategy and preference falsification: Voters may not vote sincerely due to incentives or pressure, complicating models.
  7. Framing objection: Questions if there's an objective truth for policy decisions, challenging the theorem's applicability.

  The user's instinct is that topic 1 is foundational. I agree because if correlation isn't addressed, other results might be invalid. For example, weighted voting (2) or group size recommendations depend on knowing how errors correlate. If errors are highly correlated, weighting or increasing size won't help. Similarly, deliberation (3) might increase correlation, making things worse. So topic 1 is a bottleneck.

  However, tractability is a concern. Modeling correlation might require advanced math, but the user mentions researchers have formal training, not necessarily full-time theorists. So simplified models or simulations could work. Plus, practitioners need to know how much correlation is too much—something like a rule of thumb or calculator.

  Next, topic 5 (asymmetric costs) seems highly actionable. Courts and assemblies often use supermajorities. Providing a principled way to set thresholds based on cost ratios would be immediately useful. It's tractable with existing decision theory, and outputs could be simple formulas or charts.

  Topic 4 (beyond binary) is also important because many decisions involve multiple options. However, extending the theorem here is mathematically complex. But approximations might be feasible, like looking at pairwise comparisons or ranked voting. Practitioners need guidance on structuring complex decisions.

  Topic 2 (weighted voting) is practical but depends on reliable competence estimates. If noise is high, it might not be worth it. Research could determine thresholds for when weighting helps, based on measurement error. This could save organizers from ineffective methods.

  Topic 3 (deliberation) is tricky to model but vital. If structured formats reduce correlation, that's valuable. But it might require empirical work, which could be time-consuming. Still, even qualitative guidelines on effective deliberation structures could help.

  Topic 6 (strategy) is important but might be too broad. Strategic voting involves game theory, which complicates models. It might be better addressed after more foundational issues.

  Topic 7 (framing) is philosophical. If there's no objective truth, the theorem doesn't apply. But the foundation might avoid this as it questions their entire approach. Could be sidelined unless evidence shows misapplication.

  Missing topics? Maybe dynamics of repeated decisions or how to measure individual competence reliably. Also, the impact of diversity in groups, not just correlation.

  Prioritizing: 1, 5, 4, 2, 3, 6, 7. Topic 1 is foundational, 5 is actionable, 4 extends applicability. Topic 2 and 3 are next, with 6 and 7 as lower priority.

  Milestones: For topic 1, after a year, they should have a correlation threshold model or simulation tool. If not, pivot. For topic 5, develop a cost-threshold formula early. If successful, it builds confidence.

  The user wants three priorities. So recommend 1, 5, and 4. Defend by showing how 1 underpins others, 5 has quick wins, and 4 handles real-world complexity.
answer: |-
  Here’s a brutally honest prioritization for your foundation, designed to maximize practical impact per research dollar. I’ll rank the top 3 priorities, explain why they dominate the list, flag overrated/duplicative items, and outline kill criteria. My ranking hinges on **foundational necessity**, **tractability for non-theorists**, and **Monday-morning utility**—in that order.

  ### Top 3 Priorities (Non-Negotiable Starting Points)
  1. **The Correlation Problem (#1)**  
     **Why #1?**  
     - **Everything else collapses without it.** If you can’t bound correlated error, jury theorem applications are built on sand. Organizers *need* to know: *"Does adding more people actually help?"* If correlation eats gains beyond n=15, that changes design radically.  
     - **Tractability:** Simulate correlated voters (e.g., Gaussian copulas, network-based influence) and measure when accuracy plateaus. No asymptotics needed—output a lookup table or web tool: *"If you suspect >10% error correlation, groups >30 are useless."*  
     - **Monday Impact:** Tells organizers when to invest in diversity (to break correlation) or cap size. Directly answers "how big?" and exposes when other fixes (weighting, deliberation) are desperate band-aids.  
     - **Dependencies:** #2 (weighting) and #3 (deliberation) fail if correlation swamps gains. #4 (non-binary) and #5 (supermajority) require knowing *if* majority rule works at all.  

  2. **Asymmetric Error Costs (#5)**  
     **Why #2?**  
     - **Immediate policy bite.** Courts/constitutions *already* use supermajorities—but arbitrarily (e.g., 60%, 2/3). Giving a cost-ratio formula (e.g., *"If false positives cost 5× false negatives, use 70% threshold"*) is plug-and-play.  
     - **Tractability:** Extend jury theorem with loss functions. Output a simple nomogram or Excel formula. Requires undergrad stats, not measure theory.  
     - **Monday Impact:** Constitutional reformers/administer courts *will* use this. It answers "supermajority or quorum?" with rigor, replacing folk wisdom.  
     - **Dependencies:** Builds on #1—if correlation is high, thresholds become unreliable.  

  3. **Beyond Binary (#4)**  
     **Why #3?**  
     - **Reality check.** Almost no real decisions are binary. Ignoring this makes the whole agenda academic.  
     - **Tractability:** Focus on "good enough" extensions:  
       - *Multiple options:* Use Condorcet extensions (e.g., Copeland method) or top-two runoff.  
       - *Premise/conclusion:* Model as Bayesian networks. Output flowchart: *"Split if premises are less correlated than conclusion."*  
     - **Monday Impact:** Tells organizers when to decompose questions (e.g., break policy into "problem exists?" + "solution works?") vs. vote holistically.  

  ### Lower Priority (Deprioritize or Fold)
  - **Weighted Voting (#2): Overrated.** Competence estimation is usually garbage outside controlled panels (e.g., experts). Noise *does* eat gains—prior work (e.g., Shapley-Großman) shows this. Only viable if #1 is solved *and* you have clean data (rare). Shelf unless #1 finds low correlation.  
  - **Deliberation (#3): Secretly Part of #1.** It’s just one *source* of correlation. Study it *within* #1: *"Does structured debate reduce error correlation vs. unstructured?"* Don’t isolate it.  
  - **Strategy (#6): Intractable for 2 Years.** Requires game theory + behavioral models. Worse, if voters strategize, competence estimates (#2) become meaningless. Only tackle if #1-#5 crack fast.  
  - **Framing Objection (#7): Philosophical, Not Practical.** Funders want *design tools*, not epistemology. If the assembly is deciding values, jury theorem doesn’t apply—full stop. Flag this as a boundary condition, not a research goal.  

  ### Missing Critical Question: **Diversity vs. Competence Tradeoffs**  
     - *The elephant in the room:* If you recruit high-competence specialists, they’re correlated (same training/biases). If you diversify, average competence drops. Where’s the sweet spot?  
     - **Monday Impact:** Guides organizer recruitment: *"For technical questions, prioritize expertise; for societal risks, prioritize cognitive diversity."*  
     - Fold into #1 by modeling competence-correlation tradeoffs.  

  ### Kill Criteria: When to Pivot  
  - **Year 1 Milestone for #1:** Develop a practical correlation sensitivity tool (e.g., "For 55% avg. competence, correlation >0.2 makes >25 voters pointless"). If stuck, **abandon and reallocate to #5.**  
  - **For #5:** Produce a supermajority/threshold calculator by Year 1. If done early, expand #4.  
  - **If #1 Succeeds Early:** Attack #2 (weighting) *only* if correlation is low, and #4 (non-binary) aggressively.  
  - **If #1 Fails (e.g., correlation always dominates):** Pivot hard to #5 (supermajority thresholds as damage control) and #4 (non-binary aggregation as alternative).  

  ### Why This Ranking Wins
  - **#1 is the keystone.** Without it, you’re selling organizers snake oil.  
  - **#5 delivers instant legitimacy.** Courts/reformers will adopt it tomorrow.  
  - **#4 prevents obsolescence.** Binary results are useless for real assemblies.  
  - **Dropping #2, #3, #6, #7** focuses resources where theory meets practice *now*.  

  **Bottom line:** Fund one project on correlation (#1), one on thresholds (#5), and one on non-binary decisions (#4). If Year 1 shows #1 is intractable, shift to #5 and #4 plus the diversity-competence tradeoff. Deliverables are **tools, not papers**: calculators, flowcharts, lookup tables. That’s what moves needles on Monday.
