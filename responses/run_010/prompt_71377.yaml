  Hmm, the user writes a science-and-ideas column and is stuck on a piece about why institutions make people waste valuable resources to gain entry. They have examples like religious novitiates, startup offices, dating app tokens, and quiet luxury. They showed their draft to a biologist, a behavioral economist, and a sociologist—each offering different perspectives: costly signaling, cheap talk with indices, and audience signaling respectively. The user wants a clear checklist to evaluate when something qualifies as costly signaling, with specific desiderata, motivations, and which are non-negotiable versus contested. They also want to avoid misrepresenting consensus and need the settled vs. disputed parts clearly marked.

  First, I need to unpack the core requirements for honest signaling. The user mentioned several elements: signals vs. cues vs. indices, honesty as an equilibrium, marginal cost differential, cheap honest signals, cheating predictions, audience roles, and ritualization. I should synthesize these into a crisp checklist. Key non-negotiables would be the signal's intentionality and the equilibrium condition for honesty—those are foundational in signaling theory. Marginal cost differential is crucial for separating costly signals from mere affordability. 

  The user is concerned about the "waste is the signal" framing possibly being a pop-science misconception. I should address that upfront: Zahavi emphasized waste as essential, but Grafen and others formalized it as cost differential, not waste per se. Wastefulness isn't a strict requirement; it's a symptom in some models but not definitional. This clarification is vital for their piece. 

  For the checklist, I'll define each criterion with its motivation and negotiability. For example: 

  1. **Intentionality**: Signals are sent; cues/indexes are emitted. Non-negotiable. Motivated by distinguishing active communication from passive traits.  
  2. **Equilibrium honesty**: Stability where lying doesn't pay. Non-negotiable. Prevents unfalsifiability.  
  3. **Cost differential**: Marginal cost decreases with quality. Non-negotiable for costly signals. Affordability alone isn't sufficient.  
  ...and so on, including audience structure and ritualization.  

  Highlighting disputes is critical. The applicability to humans is contested—sociologists argue institutional signals target audiences, not pairwise interactions. Also, whether waste is diagnostic or incidental is debated; economists see it as epiphenomenal. I'll note where each school (Zahavi, Grafen, Spence) stands on the criteria. Spence's screening model might not fit signaling theory at all, as it's receiver-driven.  

  The single requirement that filters non-signaling explanations? Cost differential. Runaway sensory bias lacks strategic costs; screening lacks signaling intent. This sharpens their analysis. Finally, I'll structure the response to first dispel the "waste" myth, then present the checklist, followed by disputes and school comparisons. Keeping it actionable so they can apply it to their examples in a paragraph each.
answer: |-
  Here's your operational checklist for identifying costly signals, with core requirements separated from contested elements. Apply this to each example by asking if it satisfies the non-negotiables, then check how it handles the negotiables and where debates arise.

  ### Core Non-Negotiables (Must Be Present)
  1.  **Intentionality / Strategic Design:** The "wasteful" act must be *sent* or *required* to convey information, not merely leaked or accidental.
      *   *Motivation:* Distinguishes a **signal** (deliberate communication) from a **cue** (unintentional information, like height indicating health) or an **index** (unfakeable physical link, like a deep voice requiring testosterone).
      *   *Non-Negotiable:* Foundational to signaling theory. If it's accidental or purely indexical, it's not a signal.
  2.  **Equilibrium Honesty:** The signal must be honest *because* it's strategically stable for high-quality types to send it and low-quality types *not* to send it (or send a different signal), given the costs and benefits. Dishonesty must be unprofitable or unsustainable.
      *   *Motivation:* Prevents unfalsifiability. Honesty must emerge from incentives, not just good intentions. Explains why faking fails *systematically*.
      *   *Non-Negotiable:* Defines "honest signaling." A trait designed honest but easily faked isn't stable.
  3.  **Cost Differential:** The *marginal cost* of producing/sending the signal must be lower for higher-quality individuals than for lower-quality individuals.
      *   *Motivation:* Solves the "cheap talk" problem. Affordability ("they can bear it") isn't enough; high-quality types must find the signal *relatively cheaper to produce* (Zahavi's insight). This makes faking prohibitively expensive for low-quality types.
      *   *Non-Negotiable:* The core mechanism ensuring honesty in costly signaling models. If this isn't present, it's not costly signaling.

  ### Contested/Contextual Requirements (Present in Some Models/Interpretations)
  4.  **Absolute Wastefulness (Net Cost):** The signal imposes a net cost on the signaller that isn't recouped through the benefit of signaling *in the specific context being signaled about*. The resource is "wasted" relative to the *signal's information purpose*.
      *   *Motivation:* Zahavi's handicap principle emphasizes this waste as essential. It's the "cost" in costly signaling.
      *   *Contested:* Grafen-style models focus on the *differential* cost (#3) as key; absolute waste can be a *consequence* but isn't strictly necessary for the equilibrium. Economists often see "waste" as incidental to the index/differential cost combo.
  5.  **Receiver Reliance:** The receiver's behavior must *depend* on observing the signal and confer a benefit on honest signallers.
      *   *Motivation:* Defines the signaling *interaction*. If receivers ignore the signal, it fails.
      *   *Contested:* The "audience" can be complex (direct partners, third parties, eavesdroppers). The receiver conferring the benefit (e.g., mating opportunity, investment) might not be the direct observer (e.g., peers see the signal, investors confer funds). Sociologists emphasize this audience complexity.
  6.  **Predictable Cheating Threshold:** There should be a level of cheating (dishonest signaling) that destabilizes the equilibrium, making the signal unreliable.
      *   *Motivation:* Tests the stability condition (#2). If cheating is rampant and the signal remains reliable, the mechanism is wrong.
      *   *Contested:* The *level* of tolerable cheating is debated and context-dependent. Some models predict near-zero cheating if costs are high; others allow for some "noise."
  7.  **Ritualization Path:** Traits starting as cues/indices can become ritualized signals, but the account must specify how the *costly and differential* elements (#1, #3) evolved or were designed.
      *   *Motivation:* Avoids "just-so" stories. How did a leak become a signal?
      *   *Contested:* The boundaries between cue/index/signal are fluid. Some argue ritualization inherently introduces strategic intent (#1) and differential costs (#3); others see it as blurring the lines, making strict categorization problematic.

  ### The Key Filter
  The single requirement that knocks out the most non-signaling explanations (and weak signaling claims) is **Cost Differential (#3)**.
  *   **Runaway/Sensory Bias:** Lacks strategic cost imposition; driven by receiver preference, not signaller quality revelation.
  *   **Plain Screening (Spence-style):** Focuses on the *receiver's* action (setting a costly hurdle). The signaller *reacts* to the screen; the cost isn't necessarily differentially cheaper for high quality in production (though it often correlates). The *intent* (#1) often lies with the screener, not the signaller signaling quality.
  *   **Cheap Talk / Pure Indices:** Lack the differential cost ensuring honesty against fakers.
  *   **Affordability Arguments ("They can afford it"):** Fail because low-quality types might also afford it if the cost isn't *differentially* higher for them.

  ### Clarifying Your Framing: The "Waste" Question
  **Bluntly stated upfront:** The pop-science slogan "the waste *is* the signal" is an oversimplification. While Zahavi emphasized conspicuous waste as the *handicap* ensuring honesty, formal models (like Grafen's) focus on the **cost differential** (#3) as the core mechanism. Wastefulness (#4) is often a *consequence* or a *symptom* of this differential in specific contexts, but it is not the strict theoretical requirement. A signal can be costly and honest without being "wasted" if it has other benefits, provided the *differential cost* condition holds. Your framing risks conflating a common *manifestation* (waste) with the essential *mechanism* (differential cost).

  ### How the Schools Stack Up Against the Checklist

  1.  **Zahavi (Handicap Principle):**
      *   *Nails:* #3 (Cost Differential - the core idea), #4 (Absolute Waste - essential). Emphasizes waste as the *enforcer* of honesty.
      *   *Weak/Disputed:* #1 (Intentionality - less formalized, more focused on evolution of traits), #2 (Formal Equilibrium - conceptual, not game-theoretic), #5 (Complex Audiences - pairwise focus), #7 (Ritualization Path - descriptive).
      *   *Contested Claim:* That absolute waste (#4) is *always* necessary, not just a frequent consequence of #3.

  2.  **Grafen (Formal Signaling Game - Evolutionary):**
      *   *Nails:* #1 (Modeled as strategic choice), #2 (Equilibrium defined rigorously), #3 (Cost Differential - formalized as the condition).
      *   *Weak/Contested:* #4 (Absolute Waste - seen as a frequent outcome, not a strict requirement; the differential is key). Less emphasis on #7 (Ritualization).
      *   *Contested Claim:* That this perfectly maps to human cultural institutions (#5 - Audience complexity).

  3.  **Spence (Economic Screening):**
      *   *Nails:* #2 (Equilibrium - job market signaling), #3 (Often has a cost differential, e.g., education cost lower for high-ability).
      *   *Fails/Contested:* #1 (Intentionality - The *screen* (e.g., degree requirement) is set by the *receiver* (employer). The signaller (job seeker) *acquires* the signal in response. It's screening, not signaling in the Zahavi/Grafen sense). #4 (Waste - May be present, but incidental to the screening hurdle).
      *   *Key Difference:* The locus of strategic intent. Signaling focuses on the *signaller* sending information; screening focuses on the *receiver* setting costly hurdles to reveal information.

  ### The Major Live Disputes (Mark Clearly)

  1.  **Applicability to Human Institutions:** The biologist (costly signaling) vs. the sociologist (audience complexity). **Disputed:** Whether models built for pairwise animal interactions (mate choice, predator deterrence) adequately capture complex human institutional signaling where audiences are multiple, roles are abstract (e.g., "the Order," "investors"), and signals are culturally codified. *Who:* Sociologists, anthropologists, and some behavioral economists challenge straightforward biological application.
  2.  **Necessity of "Waste":** The biologist (waste is essential) vs. the behavioral economist (waste is often incidental to indices/differentials). **Disputed:** Whether conspicuous net resource expenditure/wastefulness (#4) is a *diagnostic requirement* for costly signaling or merely a common *byproduct* of the cost differential (#3) in specific contexts. *Who:* Zahavi proponents vs. Grafen-style modelers and many economists.
  3.  **Is the Handicap Principle a Coherent General Claim?** **Disputed:** Critics argue Zahavi's original formulation was vague; proponents see Grafen's formalization as vindication. Others argue differential cost (#3) *is* the general core, rendering "handicap" a metaphor. *Who:* Debate within evolutionary biology and game theory.
  4.  **Signaling vs. Screening:** **Disputed:** Whether phenomena like educational degrees or startup offices are best modeled as active signals sent by the entrant or hurdles screened for by the institution. *Who:* Economists (Spence screening) vs. Biologists/Behavioral Scientists (signaling).

  Use this checklist to dissect each example: Does the act satisfy #1, #2, and crucially #3? If yes, it qualifies as costly signaling. Then examine #4 (is waste apparent?) and #5 (who is the audience/receiver?). The disputes explain why your experts disagreed. The "waste is the signal" framing *is* a pop-science prejudice; the core is the *differential cost* ensuring honest communication.
