answer: |-
  ## Pantoum on Certainty and the Last Day

  The reckoning comes, no shadow of a doubt.  
  (Perhaps it comes for some, in possible worlds.)  
  This fire that burns within will not go out.  
  We build our house where that sure flag unfurls.  

  Perhaps it comes for some, in possible worlds,  
  A distant storm that might not scorch the skin.  
  We build our house where that sure flag unfurls.  
  The sceptic murmurs, "It *could* well begin..."  

  A distant storm that might not scorch the skin  
  Is not the furnace forging every breath.  
  The sceptic murmurs, "It *could* well begin..."  
  But some will say it comes, denying death.  

  Is not the furnace forging every breath?  
  This fire that burns within will not go out.  
  But some will say it comes, denying death  
  With words grown cold, a wheel spun round about.  

  This fire that burns within will not go out?  
  No use to say it comes, an idle wheel.  
  With words grown cold, a wheel spun round about,  
  The reckoning comes, no shadow of a doubt.

  ---

  **Notes on the machinery**

  1.  **Lines 2 & 4 (Stanza 1) → Lines 1 & 3 (Stanza 2):**  
      *   "Perhaps it comes for some, in possible worlds." (S1L2 - Skeptic's tentative concession) → (S2L1 - Restated neutrally, setting the stage for qualification).  
      *   "We build our house where that sure flag unfurls." (S1L4 - Believer's life-organizing rule) → (S2L3 - Repeated, grounding the stanza despite the skeptic's interjection).  
  2.  **Lines 2 & 4 (Stanza 2) → Lines 1 & 3 (Stanza 3):**  
      *   "A distant storm that might not scorch the skin." (S2L2 - Skeptic's qualification, diminishing the event's reality/power) → (S3L1 - Presented as a neutral observation).  
      *   "The sceptic murmurs, 'It *could* well begin...'" (S2L4 - Skeptic's characteristic non-committal stance) → (S3L3 - Repeated, emphasizing its distance from conviction).  
  3.  **Lines 2 & 4 (Stanza 3) → Lines 1 & 3 (Stanza 4):**  
      *   "Is not the furnace forging every breath." (S3L2 - Believer's counter-assertion about the *present* existential reality of belief) → (S4L1 - Shifted to a rhetorical question, challenging the skeptic's view).  
      *   "But some will say it comes, denying death" (S3L4 - Skeptic mischaracterizing belief as factual denial) → (S4L3 - Repeated, now highlighting the *skeptic's* assertion about the *believer's* position).  
  4.  **Lines 2 & 4 (Stanza 4) → Closing Structure (Stanza 5):**  
      *   *S4L2: "This fire that burns within will not go out."* (Believer's core conviction) → *S5L1, transformed into a question: "This fire that burns within will not go out?"* (Doubt enters; the conviction weakens/hollows).  
      *   *S4L4: "With words grown cold, a wheel spun round about"* (Description of belief becoming idle ritual) → *S5L3: "With words grown cold, a wheel spun round about"* (Repeated, confirming the hollowness).  
  5.  **Closing the Circle (Stanza 5):**  
      *   *S5L2: "No use to say it comes, an idle wheel."* (New line stating the consequence – the words are now functionally empty).  
      *   *S5L4: Takes S1L1: "The reckoning comes, no shadow of a doubt."* → Returning to the opening avowal, but now positioned *after* the declaration of its idleness. It lands not as conviction, but as a hollow echo, the mere form of the words stripped of their original life-organizing force. The positions (believer's certainty / skeptic's qualification) have traded places without directly engaging, leaving the original certainty sounding like an empty ritual.
