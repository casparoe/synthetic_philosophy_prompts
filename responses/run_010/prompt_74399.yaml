prompt: |-
  Stuck on a bit of Mill and hoping you can help. In A System of Logic, in the discussion of the plurality of causes, he argues that invariable sequence isn't enough for causation — day is always followed by night, but day doesn't cause night, because that sequence is only conditional; a real causal sequence has to be unconditional in the sense that it would hold whatever else we suppose about other things. I'm paraphrasing rather than typing out the page, so correct me if I've garbled the arguement.

  Here's what I actually care about. I'm working on dispositions — finks and masks — and someone in my reading group says Mill's unconditionality clause already gets you what the naive conditional analysis (x is fragile iff if x were struck it would break) can't: a disposition is a sequence that survives every supposition about the rest of the world, so finks never had a shot at refuting it.

  Can you walk me through whether that reading is even coherent? What's the modal force of the whatever-else-we-suppose bit — is it a counterfactual with other things held fixed, or something closer to a claim about which regularities admit no exceptions? And would an electro-fink style case be a counterexample for Mill himself, or does a fink count as changing the other things supposed, so the clause just swallows it? Same question for a mask, where the disposition is there and the sequence still looks unconditional throughout.
