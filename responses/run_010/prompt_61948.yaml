answer: |-
  The franchise for the 2016 EU referendum presents a complex case study in political legitimacy, revealing tensions between competing principles and practical constraints.

  1.  **Implicit Theory of Legitimacy: Administrative Path Dependence with Citizenship/Subjection Hybrid**
      *   **Strict Requirement:** The franchise relied overwhelmingly on **administrative path dependence**, specifically the existing register for UK Parliamentary general elections. This is the most fundamental and non-negotiable element. The rules governing who can vote in Westminster elections form the baseline.
      *   **What it Happens to Fit:** This baseline register itself embodies a hybrid principle:
          *   **Citizenship Principle:** The core electorate consists of British citizens (including those with Right of Abode). This aligns most directly with the idea that the ultimate sovereign body deciding the nation's constitutional future should be its own citizens.
          *   **Modified All-Subjected Principle:** The inclusion of resident Irish and qualifying Commonwealth citizens significantly modifies the pure citizenship principle. These groups are subject to UK laws and governance in their daily lives *almost identically* to British citizens. Their inclusion recognises a degree of stakeholding derived from long-standing historical ties and reciprocal rights agreements (especially with Ireland under the Common Travel Area). This inclusion *fits* a pragmatic interpretation of the all-subjected principle, where prolonged, deep subjection to state power confers voting rights on certain non-citizens.
      *   **Exclusion of Pure Principles:** It demonstrably did *not* adhere to:
          *   **All-Citizens Principle:** British citizens resident abroad for >15 years were excluded, violating pure citizenship.
          *   **All-Subjected Principle:** Resident EU nationals (excluding Irish) were subject to UK laws and governance yet excluded.
          *   **All-Affected Principle:** Vastly more people were affected than were enfranchised (EU citizens, Brits abroad <15yrs, future generations, global actors).

  2.  **Internal Consistency: Tensions and Pragmatism**
      *   **Inclusion vs. Exclusion of Resident Foreign Nationals:**
          *   **The Tension:** Including Irish/Commonwealth citizens while excluding other EU nationals is difficult to reconcile on a *strictly principled* basis of subjection or affectedness. All resident foreign nationals are subject to UK laws.
          *   **The Pragmatic Reconciliation:** The justification lies in **historical precedent and specific treaties**, not abstract principle. The inclusion of Irish citizens stems from the deeply integrated Common Travel Area and reciprocal rights dating back to Irish independence. The inclusion of (some) Commonwealth citizens is a historical legacy of Empire/Commonwealth ties, codified in nationality law and the evolution of the Westminster franchise. EU nationals, despite free movement rights, lacked this specific historical treaty-based integration into the *domestic electoral franchise*. The franchise reflected **existing UK constitutional arrangements** for *national* elections, not a re-evaluation of subjection for this specific vote.
      *   **The Fifteen-Year Rule:**
          *   This rule primarily reflects **administrative pragmatism and a bright line**. Maintaining accurate overseas registers indefinitely is difficult and costly. The 15-year limit had existed in UK electoral law since 1985. While one *could* interpret it as implying a weakening stake or connection over time, the primary driver was practical administration and the need for a clear, workable cutoff ("a bright line that had to be drawn somewhere"). There's little evidence it was calibrated to a specific theory of stakeholding duration.

  3.  **Consequences of Taking the All-Affected Principle Seriously**
      Taking the All-Affected Principle (AAP) seriously for a referendum like the EU referendum would necessitate radical, likely impractical, changes:
      *   **Dramatically Expanded Franchise:** The franchise would need to include:
          *   **All resident EU nationals:** Directly affected by loss of free movement and residency rights.
          *   **British citizens living in other EU states:** Directly affected by loss of EU free movement/residency rights and potential loss of local voting rights.
          *   **Potentially other affected non-residents:** Businesses, trading partners, close neighbours (e.g., Norway, Switzerland) whose economies/politics are deeply intertwined.
          *   **Future Generations:** Profoundly affected by long-term economic, environmental, and geopolitical consequences. Representing them meaningfully is philosophically and practically near-impossible.
      *   **Intractable Practical Problems:**
          *   **Defining "Affected":** How significantly must one be affected? Where is the cutoff? This is inherently contestable and lacks an objective standard.
          *   **Identifying Voters:** Creating accurate registers encompassing potentially millions of non-resident foreigners and future citizens is logistically impossible.
          *   **Weighting Votes:** Should votes be weighted by degree of affectedness? How?
          *   **Democratic Cohesion:** Such a vast, disparate electorate, lacking a shared national identity or common political community, would struggle to deliberate meaningfully or feel bound by the result. It dissolves the notion of a *demos* making a decision about *its own* collective future within a defined polity.
          *   **Sovereignty:** Granting voting rights to non-citizens on fundamental constitutional questions challenges core notions of national sovereignty and self-determination within a bounded political community.
      *   **Could such a Referendum be Constituted?**
          *   **Strictly, No:** A *pure* AAP referendum encompassing *all* potentially affected parties (including future generations and non-resident foreigners) is **impossible to constitute practically**. Defining the electorate, registering voters, ensuring informed participation, and achieving a legitimate outcome within a reasonable timeframe are insurmountable hurdles.
          *   **A Compromised AAP:** One could *attempt* a compromised version, significantly expanding the franchise beyond the 2016 model (e.g., including all resident foreign nationals and Brits abroad irrespective of time). However, this still falls far short of the full AAP and immediately faces the problems of defining the boundary and excluding *some* affected parties (e.g., future generations, non-resident businesses). It also fundamentally changes the nature of the vote from a decision by the national *demos* to something more akin to a multinational consultation, raising profound questions about legitimacy and authority within the existing UK constitutional order.

  **Conclusion:**

  The 2016 franchise presupposed no single, coherent theory of political legitimacy. Its core was **administrative path dependence** on the Westminster electoral roll. This roll itself reflected a hybrid **citizenship principle modified by historical subjection-based inclusions** (Irish/Commonwealth residents). This hybrid lacks strict internal consistency when scrutinised under principles like subjection or affectedness; the exclusions (EU residents, Brits abroad >15yrs) are better explained by the boundaries of the *existing national franchise* and practical administration than by a consistent principle. Taking the All-Affected Principle seriously reveals its impracticality for national constitutional referendums; it demands an unworkably vast and unbounded electorate that fundamentally conflicts with the concept of a national *demos* deciding its own constitutional arrangements within an existing sovereign state. The 2016 franchise highlights the tension between the practical administration of democracy within a bounded state and the complex, overlapping jurisdictions and affected interests inherent in supranational membership.
