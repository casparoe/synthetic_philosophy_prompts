prompt: |-
  I sit on my state judicial conference's committee that screens proposed model jury instructions and expert-evidence guidance, and in six weeks we vote on a petition to adopt a standing rule that "readiness potential" testimony is categorically inadmissible in criminal trials. The petition grew out of a real case: a guy convicted of aggravated assault whose defense expert testified that scalp EEG shows a motor buildup beginning roughly half a second before a movement while the subject reports the urge to move only about 200 milliseconds before it, so on that picture the punch was already getting underway in the defendant's brain before he was aware of choosing it. The state's response was that the paradigm is about people flexing a wrist whenever they feel like it while watching a lab clock, and that it says nothing about a fifteen-second barroom sequence involving a shove, a decision to come back, and a swing; they also pushed the accumulator line, that if the buildup is just noisy drift toward a threshold then averaging backwards from the movement manufactures the early-onset picture and there was never an unconscious decision there to find.

  We're split two-two and I'm the tiebreak, so I have to circulate something before the meeting. Draft the short opinion I'll send around.

  A few things I need it to do. Land on something we could actually vote yes or no on — ban, admit with limits, or a third option like a narrow admissibility rule paired with a cautionary instruction — and say what the operative language should hinge on. Our committee works under an internal "specificity rule": expert testimony about a defendant's state of mind has to be capable of coming out differently for this defendant, so findings that would apply to literally every human being don't count as evidence about him. Take a position on whether the Libet literature could ever satisfy that rule, or whether the rule is itself doing some question-begging work here, and don't dodge the fact that Libet's own people mostly thought the result left room for a veto rather than proving determinism. Also give the strongest honest case for whichever side you don't pick — I've recieved enough 5-0 memos that read like briefs to know the difference. And please keep it about readiness-potential style evidence specifically: don't sweep in lesion, addiction, impulse-control or adolescent-brain stuff, which is a seperate petition we hear in the spring.

  Format: exactly five numbered points, one or two sentences each, point 1 being the bottom-line recommendation. No preamble, no closing remarks, and no citations, case names or bibliography — I can't check them and the committee doesn't want one.
reasoning: |-
  Hmm, the user is a member of a state judicial conference committee that reviews model jury instructions and expert evidence guidance. They're about to vote on a petition to ban "readiness potential" testimony in criminal trials, and they're the tie-breaking vote. I need to draft a short opinion with exactly five numbered points as requested.

  The case involves a defendant convicted of aggravated assault where a defense expert used EEG readiness potential research (like Benjamin Libet's experiments) to argue that the punch was initiated unconsciously before conscious awareness. The state countered that this research doesn't apply to complex real-world behaviors like bar fights, and that the accumulator model challenges the interpretation of unconscious decisions.

  Key requirements from the user:
  - Point 1 must be the bottom-line recommendation
  - Must address their "specificity rule" that expert testimony must be capable of varying by defendant
  - Must engage with Libet's veto interpretation
  - Present strongest counterargument fairly
  - Keep focused on readiness-potential evidence only
  - Exactly 5 numbered points, no preamble/closing, no citations

  The core tension is whether neuroscience about average lab wrist-flexes can speak to individual criminal intent in complex scenarios. The specificity rule seems crucial here - if readiness potential is universal, it can't distinguish this defendant's state of mind.

  For the recommendation, I'm considering a targeted exclusion rather than a blanket ban. We could argue that readiness potential evidence is inadmissible specifically on the issue of volitional capacity because it can't satisfy the specificity rule. 

  For the counterargument, the strongest case for admission would be that while imperfect, it's the best available science for unconscious processes and jurors deserve that context.

  I'll structure it as:
  1. Recommendation: Adopt rule excluding readiness-potential testimony on volition
  2. Specificity rule application: Explains why it fails the test
  3. Libet's veto point: Acknowledges it doesn't prove determinism
  4. Counterargument: Fair presentation of opposing view
  5. Implementation: Suggested operative language

  This balances the scientific limitations with procedural fairness while meeting all formatting requirements.
answer: |-
  **1.** Recommend adopting a rule excluding expert testimony on readiness potential as proof of unconscious volition in criminal cases, with the operative language: "Expert testimony concerning readiness potential or similar pre-movement neural activity is inadmissible to prove that a defendant lacked conscious volition or awareness of initiating the specific act constituting the charged offense."  
  **2.** This evidence fails the specificity rule: readiness potential manifests similarly in all subjects performing simple, volitional lab tasks, making it inherently incapable of distinguishing *this defendant's* state of mind during a complex, contextual act like assault.  
  **3.** Even assuming Libet’s data robustly shows unconscious initiation in simple movements (which is contested, including by Libet’s "veto" interpretation), it cannot reliably extrapolate to multi-step, socially embedded criminal conduct, rendering it irrelevant under the rule.  
  **4.** The strongest case for admission is that readiness potential provides the only direct neuroscientific window into action timing versus awareness, potentially aiding jurors in assessing claims of automaticity—though its probative value for real-world acts remains speculative.  
  **5.** This limited exclusion does not bar readiness potential evidence for other purposes (e.g., challenging methodology of opposing experts) and leaves open whether future, defendant-specific neuro-metrics could satisfy the rule.
