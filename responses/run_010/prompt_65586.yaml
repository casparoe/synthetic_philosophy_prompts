  For the decision tree, I'll need nested binaries: start with fundamental divides like market vs non-market provision, then branch into finer distinctions like state-led vs community-led approaches. The leaves must include at least eight positions - from Georgism to NIMBYism - with both common labels and descriptive names.

  Scoring will be messy in practice. I'll prioritize position coherence but acknowledge mixed patterns, using a tie-breaker favoring supply emphasis where conflicts arise. The empty ideological cells are fascinating - like theoretical hybrids that don't exist in reality, such as community land value capture paired with supply restriction.

  The social pressure caveat is crucial. Some participants might give "socially desirable" answers on displacement cases while privately opposing development. The conservation question might misclassify genuine heritage defenders as exclusionary. I'll flag this in the limitations.

  Throughout, I'm focusing on making it feel locally grounded - mentioning Victorian terraces, council estates, and conservation areas that resonate in English cities. The language stays accessible but precise, avoiding planning jargon while capturing substantive conflicts.
answer: |-
  ### Diagnostic Sorting Instrument: Housing Priorities in [City Name]  

  **Purpose:** To map participants' implicit priorities through concrete choices, avoiding self-identification. Positions are inferred from trade-offs in local scenarios.  

  ---

  ### Part 1: Case-Based Questions  
  *(Answer options appear neutral; no position labels are used)*  

  1. **Former Bus Depot Site**  
     A developer proposes 40 homes (25% affordable) on a disused bus depot in a densely populated ward. Neighbours worry about parking but support housing. The council reduces parking standards to approve it.  
     *— Should the council:  
     a) Approve as planned?  
     b) Require more parking, even if it means fewer homes?  
     c) Demand 40% affordable housing, risking the scheme’s viability?*  

  2. **Victorian Terrace Conversion**  
     A homeowner converts one large house into three small flats without planning permission. Tenants are young key workers. The council must decide whether to enforce reversal.  
     *— Should the council:  
     a) Allow the flats to remain?  
     b) Enforce reversal to a single home?*  

  3. **Conservation Area Edge**  
     A 7-storey block (50 homes) is proposed on the edge of a conservation area, 2 storeys taller than guidelines. It blocks some residents’ river views but adds social rent units.  
     *— Should the council:  
     a) Approve for the extra homes?  
     b) Refuse due to height/harm to area?*  

  4. **Council Estate Redevelopment**  
     A 1960s estate with leaks and poor insulation will be rebuilt at higher density. All tenants get equivalent floorspace in the new build, but 20% must move out temporarily.  
     *— Is this acceptable if it means:  
     a) Yes, provided all return later?  
     b) No, if any displacement occurs?  
     c) Only if no density increase?*  

  5. **Compulsory Purchase for Station Approach**  
     The council needs land for a new tram stop. An owner demands £2m (reflecting potential housing value); the council offers £500k (current use value).  
     *— Should the council:  
     a) Pay market value to secure the land?  
     b) Use compulsory purchase at current use value?*  

  6. **Developer "Sweetener" Offer**  
     A developer seeks permission for 60 luxury flats. In exchange, they offer a playground and 10 units at 60% market rent for 20 years.  
     *— Should the council:  
     a) Accept the offer?  
     b) Refuse unless all units are affordable?  
     c) Refuse due to density/design?*  

  7. **Speculative Land Pricing**  
     A farmer near a planned railway station refuses to sell to the council unless paid 15x current value, banking on future housing permission.  
     *— Should the council:  
     a) Pay the price to secure land for housing?  
     b) Block development to avoid rewarding speculation?*  

  ---

  ### Part 2: Decision Tree & Named Positions  
  *(Branches by key claims; leaves = 8 named positions)*  

  ```  
  1. Is market-based supply the primary solution?  
     ├── Yes → 2  
     └── No → 3  

  2. Should landowners capture land value gains?  
     ├── Yes → **Supply-Sider (Market Urbanist)**  
     └── No → **Georgist (Value Capture Advocate)**  

  3. Is decommodifying housing the priority?  
     ├── Yes → 4  
     └── No → 5  

  4. Should the state lead large-scale building?  
     ├── Yes → **State Housebuilder (Bevanite Expansionist)**  
     └── No → **Decommodifier (CLT/Social Housing Champion)**  

  5. Is protecting incumbents the core concern?  
     ├── Yes → 6  
     └── No → 7  

  6. Do existing tenants trump owners?  
     ├── Yes → **Anti-Displacement (Tenant Protectionist)**  
     └── No → **Defensive Localist (Homeowner Preservationist)**  

  7. Is "character" a universal or local interest?  
     ├── Universal → **Heritage Conservationist**  
     └── Local → **Proceduralist (Subsidiarity Defender)**  
  ```  

  **Position Labels & Descriptions:**  
  - **Supply-Sider (Market Urbanist):** *Supports deregulated market provision.*  
  - **Georgist (Value Capture Advocate):** *Community should capture land value gains.*  
  - **State Housebuilder (Bevanite Expansionist):** *Large-scale state-led building.*  
  - **Decommodifier (CLT/Social Housing Champion):** *Remove housing from markets via trusts/social housing.*  
  - **Anti-Displacement (Tenant Protectionist):** *Freeze change to protect vulnerable renters.*  
  - **Defensive Localist (Homeowner Preservationist):** *Empower locals to block development.*  
  - **Heritage Conservationist:** *Protect physical character as a public good.*  
  - **Proceduralist (Subsidiarity Defender):** *Decisions belong to the most local legitimate authority.*  

  ---

  ### Part 3: Scoring Key  
  - **Method:** Assign 1 point per answer matching a position’s "signature" stance (see table below).  
  - **Tie-breaker:** Position with most points wins. If tie, prioritise the one emphasising **supply increase**.  
  - **Mixed patterns:** Classify as "Hybrid" (e.g., "Georgist/Decommodifier") if >50% alignment with 2 positions.  

  | Position                  | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 |  
  |---------------------------|----|----|----|----|----|----|----|  
  | **Supply-Sider**          | a  | a  | a  | a  | a  | a  | a  |  
  | **Georgist**              | a  | a  | a  | a  | b  | b  | b  |  
  | **State Housebuilder**    | c  | a  | a  | a  | b  | b  | a  |  
  | **Decommodifier**         | c  | a  | a  | c  | b  | b  | b  |  
  | **Anti-Displacement**     | b  | b  | b  | b  | a  | c  | b  |  
  | **Defensive Localist**    | b  | b  | b  | c  | a  | c  | a  |  
  | **Heritage Conservationist**| b | b | b | c | * | c | * |  
  | **Proceduralist**         | *  | *  | b  | *  | *  | c  | *  |  
  > `*` = Varied (not signature); **Heritage** prioritises Q3b; **Proceduralist** prioritises Q6c (local veto).  

  **Pro-housing ≠ supply-side:** Q3b (heritage) and Q7b (anti-speculation) are "anti" in intuitive supply-sider terms.  

  ---

  ### Part 4: Logically Empty Cells  
  *Combinations with no position:*  
  1. **Denies neighbourhood interest + Supports decommodification:**  
     *Empty as incoherent.* If no locality has standing, who decommodifies?  
  2. **Claims all land value for community + Restricts supply:**  
     *Empty as unattractive.* Restricting supply raises land values, contradicting community capture.  
  3. **Supports state-led building + Opposes displacement:**  
     *Empty as unexplored.* State builders accept temporary displacement; tenant protectionists distrust state scale.  

  ---

  ### Part 5: Indistinguishable Pairs  
  - **Georgist vs Decommodifier:** Both support Q5b (CPO at low value), Q6b (100% affordable).  
     *Separation question missing:* *"Should social housing be built on greenbelt if it speeds delivery?"*  
     → Georgist: Yes (supply focus); Decommodifier: No (anti-sprawl).  
  - **Heritage Conservationist vs Defensive Localist:** Both oppose Q3a (taller building).  
     *Separation question missing:* *"Is a faux-historical design acceptable in a conservation area?"*  
     → Heritage: No (inauthentic); Localist: Yes (if locals approve).  

  ---

  ### Limitations & Social Pressure Bias  
  The instrument risks misclassifying **socially conscious homeowners** as *Defensive Localists* when they oppose schemes on sustainability or infrastructure grounds (Q1b, Q3b). Conversely, **aspirational renters** may overstate pro-supply views (Q1a, Q3a) to avoid "NIMBY" stigma, masking genuine concerns about design/community voice. The *Heritage Conservationist* position is especially vulnerable to false positives, as opposition framed as "character" often masks exclusion. The Q4 displacement scenario partly mitigates this by forcing a material trade-off.  

  ---  
  *Instrument ends. Designed for pre-deliberation sorting in [City Name] Citizens’ Assembly on Housing.*
