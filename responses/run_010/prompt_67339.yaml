prompt: |-
  I have worked for six years as a program evaluator at a county health agency, and for the last two I have also been assembling our unit's evaluation handbook, partly because we are up for state reauthorization next spring and the reporting template insists on a single headline figure per program. Over that time I have kept running into the same configuration, in enough different settings that I now think it is a pattern rather than a run of bad luck, and I cannot find a name for it. Here it is. An intervention genuinely improves outcomes for every subgroup of the people it reaches, and yet the pooled statistic for the system as a whole moves the wrong way — not because anything was measured badly and not because the subgroup numbers conceal something, but because the intervention's own success changes who makes up the population being measured. Our wound-care clinic is the clearest case: before it opened, a group of patients with severe lower-limb complications was cycling through the emergency department and out again, and they were effectively invisible in the county's chronic-care reporting. After it opened, patients in every severity band and every age group did better than comparable patients had done before, but the county's reported complication rate rose sharply over the same two years, because people who had previously never appeared in the denominator now appeared in it. A friend of mine who evaluates school programs describes something structurally identical: a tutoring initiative raised reading scores in every grade and every prior-achievement quartile, while the district average fell, because students who would formerly have been absent or had dropped out before test day stayed enrolled and took the exam.

  I have worked through the neighbouring concepts and none of them is quite it. This is not Simpson's paradox, as far as I can tell: there, an association holding within the groups runs the other way once the groups are pooled, whereas in my cases the direction never flips at all — every subgroup agrees with every other, and the pooled figure is answering a different question about a different population. Nor is it a bias that conditioning could repair. There is no lurking variable to hold fixed, because the subgroup rates are all accurate and the pooled rate is also an accurate description of the pooled population; the trouble is that the two are not descriptions of the same thing. It is not survivorship bias, and it is not the Will Rogers phenomenon in cancer statistics, where more sensitive detection shifts borderline patients between categories and lifts the reported average of both groups with no real improvement; mine runs in the opposite direction, with real improvement producing an apparent deterioration. Goodhart's law is close in mood but wrong in mechanism, since nobody is gaming the metric — the metric is being entirely honest about a shifting denominator. "Fallacy of composition" is too general to carry any weight in a report. And I am not even certain my two examples are the same phenomenon: in the first, people who were never counted enter the count, while in the second, everyone was always in the frame and what changes is how much weight each part carries.

  So I have three requests, and the label is the least of them. First: does this configuration have an established name, in statistics, epidemiology, program evaluation, or anywhere else? If it does, tell me which name, and tell me how the literature distinguishes it from Simpson's paradox and from reclassification effects of the Will Rogers kind — and if the honest answer is that it has several partial names with no one concept underneath them, say so and lay out the pieces. Second: if there is no established term, coin one, and define it precisely enough that I could defend it in a document going to a state auditor — including whether your definition covers both of my examples or only one of them, and what you would call the other. Third, and most important, give me the edges of the thing. I want to know the boundary case at which it stops being a bookkeeping illusion and starts being evidence that the program failed, since a worsening pooled rate caused by enrolling worse-off people can shade, without any clear line, into a worsening pooled rate caused by the program's crowding out better outcomes. I also want the conditions under which the correct verdict is that the aggregate is the right number after all: if the county's population really has become sicker and more visible, perhaps the county's rate really should be higher, and an evaluator who keeps reaching for the disaggregated figure is the one evading the question. What I need from you is the carving — what this phenomenon is, what it is not, where it stops — and then practical guidance on how to decide which of the two numbers deserves to be called the result.
reasoning: |-
  Okay, let me tackle this complex query step by step. The user describes a recurring pattern in program evaluation where an intervention improves outcomes for every subgroup, yet the pooled statistic worsens due to changing population composition. 

  First, I need to verify this isn't Simpson's paradox. The user explicitly says subgroup trends don't reverse direction - all subgroups show improvement. That rules out Simpson's. The Will Rogers phenomenon involves reclassification without real change, but here there's genuine improvement with expanded coverage. 

  The core issue seems to be denominator shifts from successful interventions: previously uncounted populations enter the measurement frame. The wound clinic example shows uncounted patients now being included, while the tutoring program retains students who would've dropped out. Both cases share a common thread: the intervention's success changes who counts as part of the population.

  Searching for existing terms... "denominator effect" captures part of it but is too broad. "Inclusion paradox" might work as a new coinage since it emphasizes the causal role of including new groups. "Visibility effect" is another option, but "inclusion paradox" better reflects the irony of success appearing as failure.

  For practical guidance, the key is determining whether the aggregate rate should reflect the changing population. If the goal is assessing system-wide burden (like public health planning), the higher aggregate rate is valid. If evaluating intervention effectiveness, the subgroup improvements matter more. The boundary case lies in whether the program caused the population shift through its own success or external factors.

  The user needs clear decision criteria: when to prioritize aggregate versus disaggregated data. This requires examining why the denominator changed and what question the metric should answer. The carving knife metaphor is apt - we must dissect when the apparent deterioration represents real system change versus pure measurement artifact.
answer: |-
  This phenomenon you've described is both fascinating and critically important—it deserves a precise name and conceptual framework. After analyzing your cases and adjacent concepts, here's a structured response to your requests:

  ### 1. **Established Name & Distinction from Neighboring Concepts**  
     - **No Single Established Term Exists**: Your configuration lacks a universally recognized name in statistics or program evaluation literature. It intersects several concepts but is distinct:  
       - **Not Simpson's Paradox**: Simpson's involves reversal of association when pooling *the same subgroups*. Here, subgroups consistently improve; the paradox arises from *changing subgroup composition*, not contradictory trends.  
       - **Not Will Rogers Phenomenon**: Will Rogers reclassifies existing members, artificially boosting group averages. Your cases *add new members* to the denominator due to intervention success.  
       - **Not Goodhart’s Law**: No gaming occurs; the metric validly reflects a real population shift.  
       - **Not Survivorship Bias**: Bias arises from excluding "failures," but here we *include* previously excluded groups.  
     - **Partial Names in Literature**:  
       - *Denominator Effect* (epidemiology): Highlights how changing denominators distort rates, but doesn’t link it to intervention success.  
       - *Inclusion Bias* (health economics): Focuses on systematic exclusion of vulnerable groups, but not the paradox of success causing apparent failure.  
       - *Hawthorne Effect Adjacent*: Behavioral changes from observation, but your cases involve structural inclusion.  

     **Verdict**: No unifying term exists. Your phenomenon is a hybrid of **denominator shift** + **intervention-induced population expansion**.

  ---

  ### 2. **Coined Term & Definition**  
     - **Proposed Term**: **Inclusion Paradox**  
     - **Definition**:  
       > *A phenomenon where an intervention’s success in improving outcomes for all subgroups simultaneously expands the measured population to include previously uncounted or undercounted high-risk individuals, causing aggregate metrics to worsen despite universal subgroup improvement. This occurs when the intervention alters population visibility or retention, not outcomes.*  
     - **Scope**:  
       - **Covers both examples**:  
         - *Wound Clinic*: Uncounted patients enter the denominator ("visibility expansion").  
         - *Tutoring Program*: At-risk students retained in testing pool ("retention expansion").  
       - **Key Mechanism**: Intervention success → population composition shift → aggregate metric distortion.  
     - **Defense for Auditors**:  
       - "Inclusion Paradox" explicitly names the causal mechanism (intervention-driven inclusion) and distinguishes it from confounding (Simpson’s) or reclassification (Will Rogers).  
       - It emphasizes that the aggregate decline is a *measurement artifact of success*, not ineffectiveness.

  ---

  ### 3. **Edges & Practical Guidance**  
  #### **Boundary Cases: When Illusion Becomes Failure**  
     - **Pure Inclusion Paradox**:  
       - *Conditions*:  
         1. All subgroups show improved outcomes (e.g., lower complication rates, higher test scores).  
         2. Aggregate worsening correlates *directly* with inclusion of new high-risk individuals.  
         3. Newly included individuals would have been excluded *but for the intervention* (e.g., clinic access kept wound patients in the system; tutoring reduced dropouts).  
       - **Evidence**: Track pre/post exclusion rates (e.g., % of severe wound patients not in pre-intervention data; dropout rates pre/post tutoring).  

     - **Transition to Program Failure**:  
       - *Warning Signs*:  
         1. Subgroup outcomes stagnate or decline *among existing members* (e.g., clinic patients’ wounds worsen; enrolled students’ scores drop).  
         2. New entrants’ risk profiles are *unrelated* to intervention accessibility (e.g., external economic shock increases poverty, raising district-wide risk).  
         3. **Crowding-Out Effect**: The intervention diverts resources, harming original beneficiaries (e.g., clinic overload delays care for existing patients).  

  #### **When the Aggregate Metric "Deserves to Win"**  
     The aggregate is valid when:  
     - **The Question is Systemic Burden**:  
       If the goal is measuring *population-level disease burden* (e.g., county health planning), the higher complication rate is "real": more sick people are now visible and needing services.  
     - **The Question is Intervention Efficacy**:  
       If assessing *whether the intervention helps those it reaches*, disaggregated subgroup metrics are definitive.  

  #### **Decision Framework: Which Number is "The Result"?**  
     | **Question Purpose**               | **Use Aggregate** | **Use Disaggregated** |  
     |------------------------------------|-------------------|------------------------|  
     | Systemic resource allocation       | ✓ (e.g., budget) |                        |  
     | Intervention effectiveness         |                   | ✓ (e.g., reauthorization) |  
     | Equity assessment                  |                   | ✓ (e.g., gaps by subgroup) |  
     | Public health surveillance         | ✓ (e.g., outbreak tracking) |                |  

     - **Crucial Test**: Ask, *"Would excluding new entrants restore the 'true' rate?"* If yes, it’s Inclusion Paradox. If no (e.g., their outcomes are inherently worse), the aggregate reflects reality.

  ---

  ### Final Recommendations for Your Report  
  1. **Introduce "Inclusion Paradox"** with the definition and examples. Preempt auditor skepticism by contrasting it with Simpson’s/Will Rogers.  
  2. **Report Dual Metrics**:  
     - *Aggregate rate*: "Total complications per 100k county residents rose from X to Y."  
     - *Disaggregated rate*: "Among patients served, complication rates fell in all subgroups (A: -Z%, B: -W%)."  
  3. **Add Contextual Analysis**:  
     - Calculate the "missing population" pre-intervention (e.g., estimate uncounted wound patients from ER logs).  
     - Model the counterfactual: "Without clinic, complications would be [Z] higher due to untreated cases."  
  4. **Boundary Guardrails**:  
     - "If subgroup outcomes decline or new entrants are unrelated to intervention access, investigate program failure."  

  This framework transforms a statistical illusion into a narrative of success while honoring data integrity. The paradox isn’t a flaw—it’s evidence your programs are reaching those most in need.
