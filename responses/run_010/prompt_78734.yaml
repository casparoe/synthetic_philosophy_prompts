answer: |-
  Your work with the nursing home residents is profoundly Plutarchan in spirit, and your questions cut to the heart of biographical method. Let's break down the Alexander passage first, then address your queries systematically.

  **Unpacking Alexander's Preface (Dryden Translation):**

  1.  **"It being my purpose to write the lives... forewarn my reader..."**: Plutarch states his subject (individual lives, not eras) and immediately anticipates a potential reader complaint: why omit famous events? This is a *prolepsis* – addressing an objection before it's made. It's a rhetorical strategy, framing his selectivity as a virtue, not a flaw requiring forgiveness ("apology" here means *defense/justification*, not contrition).
  2.  **"It must be borne in mind that my design is not to write histories, but lives."**: This is the core declaration. *Histories* (Greek: *historiai*) focus on public events, wars, politics – the external, chronological narrative of *what happened*. *Lives* (Greek: *bioi*) focus on the individual character – the internal, moral nature of the *person* who acted. The difference is **purpose and perspective**. Histories aim for comprehensive accounts of events; Lives aim for ethical understanding of character.
  3.  **"And the most glorious exploits do not always furnish us with the clearest discoveries of virtue or vice in men..."**: Plutarch argues that grand deeds are often ambiguous evidence for character. Why?
      *   They can be products of circumstance, luck, or necessity, not pure virtue/vice.
      *   They might be performed for complex or mixed motives (ambition, fear, duty).
      *   They are often highly visible and thus potentially performative – the subject is "on stage."
  4.  **"sometimes a matter of less moment, an expression or a jest, informs us better of their characters and inclinations..."**: Small, seemingly insignificant moments are proposed as *superior* evidence. Why?
      *   **Unguardedness:** They occur off-stage, in moments of less calculated self-presentation.
      *   **Revealing Habit:** A repeated phrase, a spontaneous joke, a minor habit (like the "rule about not wasting string") reflects ingrained disposition (*hexis* in Greek philosophy – a settled state of character) rather than a single, pressured decision.
      *   **Concrete Specificity:** They offer a tangible, vivid snapshot of personality in action, bypassing the abstraction of large events.
  5.  **"Therefore as portrait-painters... marks and indications of the souls of men..."**: The analogy clarifies his method:
      *   **Focus:** A portrait painter prioritizes the *face* because it's the primary locus of identity and expression. Plutarch prioritizes the "marks and indications of the souls" (Greek: *ta sēmeia kai ta phōnounta tēs psuchēs* – literally "the signs and the things which reveal the soul"). These are the psychological equivalents of facial features – small actions, words, habits that manifest inner character.
      *   **Abridgement vs. Omission:** The painter doesn't *omit* the body; they render it with less detail, ensuring it doesn't distract from the face's expression. Plutarch doesn't *omit* great battles; he *epitomizes* (summarizes) them, giving enough context but directing the reader's primary attention to the character-revealing details. The "therefore" links the painter's *hierarchical focus* to Plutarch's *method of selection and emphasis*. His "leaving more weighty matters... to others" is a statement of his chosen focus, not a claim of total omission.

  **Addressing Your Questions:**

  1.  **"Not Histories, but Lives"**:
      *   **Force:** It marks a fundamental difference in **subject matter, purpose, and the kind of truth aimed at.** Histories seek the truth of events; Lives seek the truth of character. Completeness in *events* is sacrificed for depth in *understanding the person*. The "apology" is primarily **rhetorical management** – anticipating and neutralizing potential criticism about omissions by framing them as essential to his true purpose (revealing character). It's a defense of his methodological choice.

  2.  **The Painter Analogy**:
      *   Your objection is insightful but slightly misfires the analogy's point. Plutarch isn't arguing for *omission* of the body/sieges, but for **differential focus and detail.** The painter *must* include the shoulders to ground the portrait, just as Plutarch *must* include major events for context. However, the painter's *artistry* and the portrait's *likeness* reside primarily in the face. Similarly, Plutarch's *artistry* and the Life's *revelation of character* reside primarily in the small, telling details. The "therefore" hinges on the shared principle of **selective emphasis for a specific end (capturing identity/character)**, not on absolute omission. The analogy *is* about where the likeness (of the person/soul) most reliably consists – in the specific "features" (words/jests/habits) rather than the broader "body" (famous events).

  3.  **"Expression or a Jest" as Evidence**:
      *   Plutarch likely views these trifles as evidence **because they reveal disposition (*hexis*)**. His inference runs:
          *   Small, unstudied actions or words are less likely to be deliberate performances crafted for public effect.
          *   They often stem from ingrained habits, unconscious reflexes, or spontaneous reactions – windows into the "default setting" of the person.
          *   Repetition (like the woman's phrase) strengthens this: it shows a *pattern*, not an anomaly. Plutarch *does* generally assume a relatively stable core character (*ēthos*), though he acknowledges development and contradictions. The trifle's power lies in its potential to reveal this underlying disposition *despite* the circumstances, or *because* it occurs in a context where the "public mask" might momentarily slip. It doesn't preclude change, but it reveals the ground from which actions spring.

  4.  **Reconciling the Two Prefaces (Alexander & Caesar)**:
      *   There is tension, but not contradiction. Plutarch is making distinct, complementary points:
          *   **Alexander Preface:** Grand deeds are *unreliable indicators* of the *agent's inherent virtue or vice* because deeds and character can come apart (a bad man can do a great deed by luck or calculation; a good man might fail nobly).
          *   **Caesar Preface:** Virtuous deeds *themselves* are inherently admirable and can inspire imitation *regardless of the agent*. However, admiration for a *deed* does not automatically transfer to the *doer* (the perfumer/dyer analogy). We can recognize the brilliance of a tactic or the beauty of a poem while finding the general or poet personally contemptible. The "joint" Plutarch seeks is precisely the **connection between the deed and the soul that produced it.** The trifles are crucial because they help him judge *why* the deed was done and what it truly reveals about the *character* behind it. Was Caesar's clemency true virtue or calculated policy? Small moments might tip the scale. The prefaces highlight different facets of the deed/agent relationship: Alexander's focuses on the ambiguity of deeds *for judging character*; Caesar's focuses on the independent value of virtuous deeds *for inspiring action* and the potential disconnect from the agent's worth.

  5.  **The "Anecdote Filter" (Your Worry)**:
      *   This is a profound and valid concern Plutarch *does not explicitly address* in this passage. You've identified a fundamental limitation of the biographical (and historical) enterprise. The survival of anecdotes *is* shaped by:
          *   **Taste/Agenda:** What the subject's circle (or later tradition) found memorable, amusing, shocking, or useful to preserve/repeat.
          *   **Narrative Convenience:** Stories that fit a pre-existing narrative about the person.
      *   Plutarch *is* aware of source criticism (he often cites conflicting accounts). He also states elsewhere (e.g., in the *Life of Pericles*) that he sometimes omits discreditable stories *if* they are poorly attested or seem malicious inventions *and* if they don't pertain to essential character flaws relevant to his narrative. This *does* sit somewhat uneasily with his method. He relies on gossip (*phēmē*) but tries to filter it through reason and available evidence. His resource is **critical judgment:** comparing sources, considering plausibility, context, and motive of the original reporter. He assumes (perhaps optimistically) that a discerning reader/biographer can sift the revealing grain from the chaff of distortion. Your modern suspicion is warranted; Plutarch offers no perfect solution, only the tools of skepticism and triangulation. Your awareness of the families shaping the tapes is precisely this critical filter at work.

  6.  **Plutarch vs. Christian Hagiography:**
      *   You've pinpointed the key difference: **Evidentiary vs. Exemplary Purpose.**
          *   **Plutarch:** The anecdote (the jest, the phrase) is primarily **evidentiary.** It is a *clue* offered to the reader to help *judge* the subject's character. The reader is invited to engage critically: *What does this reveal about Alexander's impulsiveness, Caesar's ambition, or Cato's rigidity?* The inference is open-ended, part of an ethical inquiry.
          *   **Hagiography (Saint's Life):** The anecdote (the gesture, the saying) is primarily **exemplary.** It is a *model* offered to the reader to *imitate* or *venerate.* Its purpose is edification and inspiration. The inference is closed: *This shows the Saint's humility/piety/fortitude; go and do likewise.* Critical judgment of the saint is not the goal; emulation or devotion is. The saying is "handed over to be copied" precisely because it demonstrates the saint's virtue perfectly. Plutarch's anecdotes are diagnostic tools; hagiographic anecdotes are perfect exemplars.

  **Conclusion:**

  Plutarch's method, articulated in the Alexander preface, is a sophisticated defense of using the small and seemingly insignificant to illuminate the large reality of character. He distinguishes his project ("Lives") sharply from chronicles of events ("Histories"). The portrait analogy justifies his focus on the "soul's marks" (the *sēmeia* of character) over exhaustive battle descriptions. While he acknowledges the inspirational power of great deeds in the Caesar preface, his core biographical insight remains that the unguarded trifle often provides the clearest window into the true self.

  Your "anecdote filter" is a crucial caveat Plutarch doesn't fully confront – the stories we inherit are pre-selected. His implicit defense is the biographer's critical judgment in evaluating those sources. The difference between Plutarch and the hagiographers lies fundamentally in the use of the anecdote: as evidence for judgment versus as a perfect exemplar for imitation.

  Your work with the residents instinctively grasped Plutarch's central truth: the "big events" are often polished narratives, while the unselfconscious "rule about not wasting string," the nervously repeated phrase, or the unexplained, self-deprecating joke offer the raw, unvarnished glimpses into the unique soul within. You weren't writing histories of the 20th century; you were capturing lives. Plutarch would recognize your method immediately.
