answer: |-
  Here’s the memo drafted as requested. I recommend we treat the conservator’s reassembly as the original work (retaining its accession number), decline the estate’s refire as a new acquisition, keep the reassembled figure, and sell neither object to the estate. This position centers on the physical and historical continuity of the object we stewarded, while acknowledging the refire’s value as a posthumous homage.  

  ---  

  **MEMORANDUM**  
  To: Collections Committee  
  From: Registrar (Volunteer)  
  Date: October 26, 2023  
  Subject: Recommendation re: Kneeling Figure (Accession #1994.08)  

  After reviewing the facts, I propose the following:  
  1. **The conservator’s reassembled figure retains the original accession number (1994.08)** and remains in our collection.  
  2. **We decline to accession the estate’s refire** as a new work or substitute.  
  3. **We retain the reassembled figure and do not sell it to the estate.**  
  4. **The wall label will state:** "*Kneeling Figure* (1978), damaged January 2023 and conserved. A posthumous recasting by the estate (2023) stands adjacent."  

  ### The Case for This Position  
  **Why the reassembly is the original work:**  
  The crushed figure wasn’t erased; it was transformed. When our conservator reassembled 85% of its original material, she preserved the object’s physical and historical thread—the very thing our museum has stewarded since 1994. Yes, 15% is plaster, but this doesn’t break its identity. Consider: if a ship replaces rotten planks over centuries, it remains the *same ship* because its existence is a continuous chain of care and repair. Here, the original clay—touched by the artist, displayed by us, and shattered in our gallery—still comprises the bulk of the object. Its damage and repair are now part of its biography, making it *more* historically significant, not less. The estate calls it a "relic," but relics are venerated precisely because they are physically connected to what they represent.  

  **Why the refire isn’t the original work:**  
  The estate’s refire is a remarkable tribute—faithfully made from the artist’s mold, with her clay, and stamped legitimately. But it is a new object. A mold captures form, not history. The original figure’s value lies not just in its shape, but in its life: the artist’s hand shaping it, its decades in our gallery, even its destruction. The refire shares none of that. It is a re-creation, not a resurrection. To call it the "original" erases the history embedded in the fragments we preserved. If we swapped it onto the plinth, we’d imply continuity where none exists.  

  **Addressing the counterarguments fairly:**  
  *The estate’s strongest case:* They argue the artist’s mold and materials make the refire the true "work," as art transcends its physical instantiation. If the artist authorized the mold during her life (as she did), and the estate uses it faithfully, this is merely the work "renewed." Our policy’s focus on the accession record is circular; art isn’t paperwork. Denying the refire privileges our institutional memory over the artist’s legacy. They offer generosity—no cost, no fuss—and we risk ingratitude.  
  *The "both are new" position:* Others argue neither object is truly "original." The reassembly is a fragmentary ghost; the refire is a facsimile. Acquiring neither avoids false claims.  

  **Why we keep the reassembly and decline the refire:**  
  Selling the reassembly to the estate would commodify its history and deprive our community of its story. The refire, while sincere, doesn’t meet our collection’s purpose: preserving material evidence of the past. We should offer to display it *alongside* the original as a "companion piece" (loaned, not accessioned), acknowledging the estate’s goodwill while maintaining integrity. To the nephew, we say: "Your tribute honors her craft, but the figure we conserved is the one that lived here. We’d be honored to show both, together."  

  **The wall label’s honesty:**  
  Clarity disarms criticism. The label must state:  
  - The original was damaged and conserved (visible losses included).  
  - The refire is a 2023 posthumous casting by the estate.  
  This respects viewers’ intelligence and avoids conflating history with homage.  

  **Insurer scheduling:**  
  We schedule the reassembled figure (accession #1994.08) at a nominal value (e.g., $1) since the insurer paid a total loss. Its worth is now historical, not market-driven. The refire isn’t ours to insure.  

  ### Load-Bearing Details  
  - **The mold’s purpose matters:** She made it for *maquettes*, not replication. This weakens the estate’s "authorized continuity" claim.  
  - **The assistant’s involvement is neutral:** Faithful execution doesn’t transform the refire’s status.  
  - **Same clay/same kiln:** These bolster the refire’s aesthetic fidelity but don’t create historical continuity.  
  - **If the mold was made *for* replication?** That would strengthen the estate’s case—but it wasn’t.  

  ### Why Your "Continuous History" View Holds  
  Your instinct—that the figure is "clay arranged right *with uninterrupted history*"—is defensible. The 15% plaster doesn’t break continuity; it’s a bridge between the original and now. The refire, while 100% accurate in form, has no physical thread to 1978. It is a *new* arrangement. The "obvious push" (15% vs. 100% form) mistakes art for geometry. A face reconstructed from forensic evidence isn’t a new face; it’s the original, revealed anew. A waxwork replica, however perfect, is a separate artifact.  

  ---  
  This recommendation honors our duty as stewards: to preserve the tangible past, not replace it. It also treats the estate with respect by valuing their tribute without conflating it with history. I urge the committee to adopt this position.
