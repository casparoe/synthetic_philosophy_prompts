answer: |-
  Your first challenge mistakes the *dunamis* for the *hexis*. The child's deliberative faculty, though immature, possesses the potential for full development through habituation and instruction—as a sapling grows into an oak. The natural slave’s soul lacks this very potentiality. He apprehends reason only as the ear apprehends music: capable of receiving harmony yet unable to compose it. To educate him toward self-rule would be as futile as training vines to bear olives. The injustice you note—of Greeks enslaved by force—proves my very point: convention often violates nature. We must distinguish the true slave (discerned by his inherent traits, not circumstance) from those wrongly enslaved.  

  As for the shuttle: tools serve an external end—the cloth or the song. But the slave is part of the household, which exists for the sake of living well. If tools moved themselves, the *labor* would cease, yet the need for guidance would persist. The natural slave requires direction not merely to produce goods, but to fulfill his own essence. Just as the body is governed by the soul for its own good, so the slave achieves his proper function only under the master’s reason. Force without nature is tyranny; nature without art is barren. My account unites both: the master provides the art his nature lacks. [Agora role-play begins]
