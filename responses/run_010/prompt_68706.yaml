prompt: |-
  I'm a novelist — literary fiction, mostly third person, one book out with a small press and a second one giving me trouble. You can think of me as somebody who has spent twenty years thinking about characters exclusively in craft terms: what does this person want, what do they believe about themselves that's wrong, where's the desire-line, is the motivation legible by page forty, does the turn land. That's my native language and I'm fluent in it to the point of not noticing it. My new problem: the narrator of the book I'm drafting is a neuroscientist who has genuinely talked herself out of thinking that anybody, including herself, has beliefs or desires, and my editor's note basically says the first hundred pages have no people in them. Fair enough. So I've been reading around eliminative materialism — the Churchland-ish line that folk psychology is a stagnant theory whose central posits won't line up with anything a finished neuroscience says, so they should go the way of phlogiston and witches rather than get reduced to brain states — plus the instrumentalist alternative that treats belief-talk as a useful predictive strategy instead of a description of anything, plus the pushback that eliminativism undercuts itself, and the pushback that folk psychology isn't really a theory in the relevant sense to begin with.

  Here's what I want. Act as a philosopher of mind who reads a lot of fiction and is willing to get technical with a smart non-specialist. First, do the prep work out loud for a paragraph or two: line up the main claims and moves in that debate against the craft concepts I actually use — motivation, desire-line, interiority, free indirect style, the unreliable narrator, dramatic irony, character arc, foreshadowing, what "show don't tell" is even showing. Think carefully here and don't rush to a verdict; I want to see the mapping before the conclusion. Then restate the eliminativist case itself in that craft vocabulary, as faithfully as you can manage: what does the claim that beliefs dont exist look like when the only things you're permitted to say are things about how characters get built and how readers track them? Keep the translation honest. Don't quietly assume craft talk is already non-committal, or already instrumentalist, just because that makes your job easier, and don't smuggle your own preferred resolution in and label it translation.

  Then the part I actually care about, which is the residue report. Go claim by claim: which pieces of the eliminativist argument survive intact in craft talk, which survive only if you bend something, and which have no expression at all in the way I think about fiction. Where something doesn't survive, tell me which side the failure sits on — is the craft vocabulary missing something real (it has no way to ask whether an attribution is true, only whether it reads), or does the philosophical claim start looking less substantial once you notice it was arguing against a theory-shaped caricature of what ordinary people, and novelists, are doing when they say someone wanted something? End on the practical question, but without turning it into a pep talk: given your residue report, is my narrator's position writable in third person at all, or is the reason those first hundred pages feel empty that I'm trying to render in scene something that isn't the sort of thing a scene can hold? No bibliography and no reading list please — I'm mostly offline and I don't want invented page numbers, just the argument. Naming philosophers is fine when it helps me keep the positions seperate.
reasoning: |-
  Okay, let me unpack this novelist's challenge. They're deeply fluent in craft terms like desire-lines and character arcs, but now their neuroscientist narrator denies the existence of beliefs and desires altogether. The editor's complaint about "no people" in the first hundred pages suggests a fundamental tension between eliminative materialism and narrative construction.

  First, I need to carefully map philosophical positions against craft concepts without rushing to solutions. The core conflict is stark: eliminativism claims folk psychology is a false theory that will be replaced by neuroscience, while craft relies entirely on that folk psychology framework. But I must avoid assuming craft is automatically instrumentalist - the novelist specifically warned against that shortcut.

  For the translation exercise, I'll articulate eliminativism strictly through craft lenses: no beliefs means no character motivation as traditionally understood, no unreliable narration because there's nothing to be unreliable about, no dramatic irony because readers can't know more than the narrator about intentions. The craft terms themselves become suspect - "desire-line" turns into a convenient fiction, "interiority" becomes an illusion.

  The residue report will be crucial. Some eliminativist claims survive translation well - like the idea that folk psychology is a predictive tool rather than truth. But others collapse, particularly the notion that craft operates with "theoretical" commitments. When the novelist asks "does the turn land," they're testing audience response, not ontological truth. This suggests eliminativism may misunderstand the pragmatic nature of narrative thinking.

  For the practical question about writability in third person: the emptiness likely stems from scene structure demanding causal chains that eliminativism dismantles. But possibilities emerge in the gaps - perhaps rendering the narrator's predictive struggles or showing neural patterns as counterpoint to behavior. The challenge is maintaining tension without betraying either the philosophy or the reader's need for human connection.
answer: |-
  Here's the mapping, translation, residue report, and practical assessment as requested:

  **Prep Work: Mapping Philosophy to Craft**
  - **Motivation/Desire-Line**: Philosophy treats "belief/desire" as *explanatory posits* (why someone acts). Craft treats them as *causal engines* (what propels the scene/arc). Eliminativism (EM) attacks the *reality* of these posits; craft assumes their *functional necessity* for narrative coherence.
  - **Interiority/Free Indirect Style (FIS)**: Assumes reportable inner states (thoughts, feelings). EM denies these states exist *as commonly conceived* (not neural patterns *representing* beliefs, but beliefs *themselves* are illusory). FIS becomes problematic if the narrator rejects its foundational premise.
  - **Unreliable Narrator/Dramatic Irony**: Relies on a *gap* between character belief/reality or narrator interpretation/reality. EM collapses this: if beliefs don't exist, there's nothing *to* be wrong *about*, only maladaptive neural patterns or inaccurate predictions. Irony requires contrasting perspectives; EM denies the validity of the folk-psychological perspective.
  - **Character Arc**: Presumes *change* in core beliefs/desires/self-understanding over time. EM might recast this as *reconfiguration of neural connectivity* or *shift in behavioral dispositions/predictive models*, rejecting the "inner change" narrative.
  - **Foreshadowing**: Relies on causal chains rooted in desires/beliefs (e.g., jealousy foreshadowing betrayal). EM sees this as pattern-matching based on folk theory, not revealing real causal mechanisms.
  - **"Show Don't Tell"**: "Showing" implies revealing inner states *through behavior/subtext*; EM argues the inferred states are *fictions*. The behavior is real; the "why" attributed by craft is the fiction.

  **Translation: Eliminativism in Craft Terms (Strict)**
  *"The craft concepts you rely on are tools for predicting and organizing observable behavioral patterns and verbal reports, not descriptions of real internal entities. Attributing 'motivation' or 'desire' is like attributing 'phlogiston release' to explain combustion – it's a useful, intuitive shorthand for a complex underlying neural reality it fundamentally misrepresents. A 'desire-line' doesn't track a real psychic force; it tracks a consistent behavioral trajectory your predictive model (folk psychology) labels as desire. 'Interiority', rendered via FIS, is a compelling illusion you construct by projecting this model onto sensory data (words, actions, expressions). An 'unreliable narrator' isn't wrong *about beliefs*; they generate inaccurate behavioral predictions using the folk model or possess conflicting neural patterns. A 'character arc' describes a significant shift in observable patterns and predictive models, not an inner journey. 'Foreshadowing' exploits learned folk-psychological correlations, not actual causal chains involving beliefs/desires. 'Showing' reveals behavioral cues that trigger the reader's folk-psychological interpreter; it doesn't reveal hidden mental states because there are none to reveal in the way you imagine."*

  **Residue Report: What Survives, Bends, or Vanishes**

  1.  **EM Claim: Folk Psychology (FP) is a Predictive Tool (Instrumentalist Core)**
      *   **Survives Intact:** Craft is *explicitly* about prediction and pattern recognition. "Does the motivation read?" *is* asking if the FP model generates accurate behavioral predictions for the reader. "Does the turn land?" asks if the behavioral shift aligns with the FP-based expectations set up.
      *   **Residue:** Pure. Craft doesn't care about ontology, only predictive efficacy and narrative coherence *within the FP framework*. EM concedes FP's instrumental utility.

  2.  **EM Claim: FP Posits (Beliefs/Desires) are Radically False / Don't Exist (Eliminative Core)**
      *   **Survives Only if Bent:** You can *describe* the narrator *saying* this, but *using craft itself* to render a character *without* attributing beliefs/desires in the narrator's voice is nearly impossible. FIS requires implied states. Motivation drives plot. To *show* the narrator's POV *in scene*, you'd need to avoid all FP terms in narration, leaving only physical description and reported speech – which *creates* the "no people" effect. The craft vocabulary inherently commits to FP posits as the *currency* of character.
      *   **Failure Side:** **Craft Vocabulary Limitation.** Craft lacks the neural/mechanical vocabulary to replace FP at the descriptive level *while maintaining scene-driven narrative engagement*. It *requires* the FP level for "people" to emerge. The failure is the inability of craft to operate *without* FP commitments in its active rendering.

  3.  **EM Claim: FP is a Stagnant/False *Theory* (Churchland)**
      *   **Vanishes/Weakens:** Craft doesn't treat FP as a "theory" in the scientific sense Churchland means (a tentative explanatory framework subject to empirical falsification). For craft, FP is the *constitutive framework* for understanding personhood and action in narrative. "Stagnant" is irrelevant; its purpose is narrative function, not scientific progress. The "falseness" claim attacks an ontological commitment craft often takes for granted but doesn't *need* for its operational success (instrumentalism is sufficient for craft).
      *   **Failure Side:** **Philosophical Claim Misapplied.** EM argues against a scientific theory; craft uses FP as a narrative ontology and predictive grammar. Attacking its scientific status doesn't directly undermine its narrative necessity or functional role in constructing character and plot, which operate on a different level.

  4.  **EM Claim: FP Posits Won't Reduce to Neuroscience (Churchland)**
      *   **No Expression:** Craft has zero stake in neural reduction. Whether a "desire" reduces to a neural pattern is irrelevant to whether the desire-line is compelling or the motivation is legible. Craft operates entirely at the personal level.
      *   **Failure Side:** **Philosophical Claim Irrelevant.** This is purely a philosopher-of-mind/scientific claim. Craft vocabulary has no hooks for "reduction" or "neuroscientific ontology."

  5.  **EM Claim: Eliminativism Undercuts Itself (e.g., requires beliefs to state its case)**
      *   **Survives Intact (as a narrative tension):** This is fundamentally a *dramatic irony* or *unreliable narrator* problem *within the story*. The narrator *must* use FP terms (or avoid them in ways that cripple narrative) to communicate, while denying their validity. This creates inherent tension and potential for reader skepticism about the narrator's coherence. Craft has the tools (irony, unreliability) to *exploit* this tension dramatically.
      *   **Residue:** Strong. The self-undercutting becomes a *character trait* and *source of conflict* visible through craft lenses.

  **Practical Assessment: Is it Writable in Third Person?**

  Yes, but **only by making the tension between EM and FP the core dramatic subject**, not by seamlessly adopting an eliminative narrator perspective. The "emptiness" stems from attempting to render scenes *as if* the eliminative view were true *at the craft level*, which strips away the necessary FP framework readers (and narrative structure) require to perceive "people" and causal chains.

  *   **How to Write It:**
      1.  **Narrator's Struggle is the Plot:** The narrator's *failure* to consistently apply EM, their reliance on FP despite denying it, their difficulty predicting behavior without it, their isolation caused by it – *this* is the drama. Show the *cost* and *incoherence* of her position through her interactions and the narrative voice's unavoidable slippage into FP.
      2.  **Exploit the Irony:** Use FIS *against* the narrator. Let her thoughts betray FP attributions she'd consciously reject. Let her predictions fail spectacularly because she denies FP. Let other characters call her out on her coldness or incomprehension. The gap between her stated philosophy and her unavoidable human (FP-driven) reactions *is* the interiority.
      3.  **"Show" the Absence *as* Effect:** The "emptiness" isn't just a flaw; it's data. Render scenes where her EM perspective *creates* misunderstanding, alienation, or failed predictions. Show *other characters* reacting to her lack of expected FP engagement. The "no people" effect *in the reader* mirrors the narrator's claimed experience – use that deliberately to create unease, then contrast it with moments where FP inevitably intrudes.
      4.  **Focus on Behavior & Prediction:** Narrate observable actions, sounds, physiological cues (blushing, trembling) meticulously. Show the narrator *attempting* and often *failing* to build accurate predictive models based *only* on this + neuroscience jargon. The reader, using FP, will constantly be ahead of her, creating dramatic irony.
      5.  **The Arc is Collapse/Integration:** Her "arc" likely involves the untenable nature of pure EM in lived reality. Does her model crack? Does she find an instrumentalist compromise? Does she break down? The narrative tension *is* the conflict between her philosophy and the FP-saturated world (and her own brain).

  **Conclusion:** The eliminativist position cannot be adopted as the *narrative framework* itself without destroying the possibility of scene-driven fiction as we understand it, because craft is built on FP. However, a character *holding* that position, struggling with its implications and inherent contradictions, is fertile ground for a novel. The "no people" critique highlights the attempt to render *from* the EM perspective; the solution is to render the *conflict* between EM and FP *as experienced by the narrator*, making that tension the heart of the narrative. The residue shows EM's core challenge (FP's instrumental nature) survives, while its ontological claims create the character's fatal flaw and the story's central tension.
