prompt: |-
  My paper argues that al-Ghazālī's seventeenth discussion in the Tahāfut al-falāsifa is not a piece of occasionalist metaphysics at all, and that reading it as one — the fire doesn't burn the cotton, God does — mistakes what he's actually denying. What he denies, on my reading, is that the Avicennans can demonstrate the necessity of the causal connection; the chapter is an attack on a proof, not an assertion about who the real agents turn out to be. The weight sits on the ʿinda/bi move: observation shows the effect occurring *at* its usual antecedant, and that licenses no inference to its occurring *by* it — but that's a claim about warrant, not about ontology. On my reading he can cheerfully grant that fire has a nature and that the ʿāda is real and stable, since God's habit is precisely what makes natural enquiry possible, which is why the Iḥyāʾ and the Iqtiṣād are full of perfectly ordinary causal talk without any embarrassment. So he isn't Malebranche with a different theology: he's an anti-demonstrationist about necessitarianism, and the miracle possibility is a corollary rather than the engine.

  It goes in three weeks at a two-day workshop on kalām and its reception — 25 minutes plus 10 for questions — and I want a Q&A prep sheet rather than a defense of the view. The room will be nine or ten people: mostly historians of Arabic philosophy who do serious textual work on kalām, on Avicenna, and on his commentators; two of them work on the post-classical commentary tradition from Rāzī onward and are used to authors being read both charitably and through the eyes of their successors; one does philosophy of science on powers and dispositions, is a committed anti-Humean, thinks "necessity in nature" is doing real explanatory work and that anyone who takes it away owes a story about what makes regularities non-accidental; the rest are generalists plus one person who reliably brings up Hume's constant conjunction within four minutes of any paper on causation in Islam. My two commentators are pre-circulating: the Rāzī person, who I suspect thinks I'm doing doctrine-history badly, and the powers person. Also worth knowing: I read Arabic only with a dictionary and a lot of patience, and everyone in that room can tell. Im not asking for sources or a reading list — I know the literature — I just don't know what they'll say.

  So: give me the eight or so objections this particular audience will actually raise, ordered by how much damage they'd do if I fumbled them, each phrased the way that person would phrase it — Arabic technical vocabulary where the textualists would use it, analytic modal vocabulary where the powers guy would — with a reply I can deliver in about two minutes, a blunt note on where that reply is softest, and a flag for which ones I should just concede in the talk to defuse them. I especially want the two or three that come at me from Ibn Rushd's response to the Tahāfut, because my biggest fear is the inference that if the sharpest reader of the next generation took Ghazālī to be denying causal necessity outright and thought that denial destroyed knowledge, that's evidence about what the text said to a competent reader a century after it was written — tell me how much that actually costs me and whether there's a good answer. And then name the single reply that has to land for the paper to survive the session, plus the question I'm hoping nobody asks. My guess is that it's something like "if your reading is right, what work is the heresy charge doing in that chapter, since an under-demonstrated claim isn't unbelief" — but say whether that's really the worst case or whether there's something uglier that I'm not seeing.
