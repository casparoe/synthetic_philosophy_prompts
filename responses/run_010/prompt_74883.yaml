prompt: |-
  I cover science and risk stuff for a general-interest magazine and a huge chunk of my job is people giving me ranges instead of numbers. "Somewhere between 20 and 60 percent." "Low single digits, maybe up to 10." "Depends on the model, call it 3 to 30 times baseline." My editor wants one figure in the lede basically every time, and I've been quietly averaging things I don't think should be averaged.

  There's a whole formal literature on belief that's a set or an interval rather than a single number -- robust Bayes, imprecise probability, whatever the current name is -- and I want to actually use it, not cite it. So: write me a procedure I can run in like 20 minutes before filing, no equations passed what a smart non-specialist reader will follow, on a laptop in a newsroom with no statistician on call and a print deadline behind me.

  In order, it should cover:

  - what to actually extract from a source when they hand me a range. There's more than one thing hiding inside "20 to 60 percent" -- one model's output, several models I'm lumping together, or genuine ignorance about which world I'm in -- and I suspect the answer changes what I'm allowed to do with it.
  - when it's legitimate to collapse a range to a point for the copy and when it isn't, and what to write in the sentence instead.
  - two sources, two ranges: what combining them can even mean, and the conditions under which "experts say between X and Y" is simply false.
  - the thing a statistician told me that I never resolved: conditioning on new evidence can make the interval wider rather than narrower, sometimes no matter which outcome you learn. Tell me whether that's a bug in her example or a real feature of the math, and whether my procedure needs a step for it.
  - how to choose which end of a range to write down when a decision hangs on it (go pessimistic? some weighted compromise?) and exactly where that stops being math and starts being an editorial values judgment I should flag to readers rather than bury.

  Then run it on three cases:

  1. Two epidemiologists on how likely a new variant is to substantially evade existing immunity. One says 30-60 percent, the other 45-80. Desk wants "around 50 percent" in the first graph.
  2. One expert puts a drug at 20-80 percent chance of working. A week later a small favorable trial lands and she revises to 10-95, saying she's now more sure of the direction but less sure of the size.
  3. A source gives me a flat "60 percent" and then admits on the record that he made it up as a placeholder for "more likely than not."

  One of these three should come out in a way that will annoy my editor -- I'd rather hear it from you now than from her. And be explicit about which steps are judgment calls dressed up as procedure, which distinctions from the formal theory you deliberately dropped to keep this usable, and what the procedure flat out cannot settle.
reasoning: |-
  We are addressing a journalist's need to handle ranges of probabilities or numbers provided by sources, with the goal of producing a single figure for the lede when necessary, while being scientifically honest and transparent.

  The procedure below is designed to be practical, taking about 20 minutes, and requiring no advanced math or statistics beyond what a smart non-specialist can follow. It is structured around the questions asked.

  ### Procedure Outline

  1. **Extracting Information from a Source's Range**
  2. **Collapsing a Range to a Point: Legitimacy and Alternatives**
  3. **Combining Two Ranges from Two Sources**
  4. **Handling Intervals that Widen with New Evidence**
  5. **Choosing an Endpoint for Decision-Making and Flagging Judgment Calls**

  Then, we run the procedure on the three cases.

  ---

  ### Step-by-Step Procedure

  #### 1. Extracting Information from a Source's Range
  When a source gives a range (e.g., "20 to 60 percent"), you need to ask (or infer) what the range represents. There are three common scenarios:

  - **Scenario A: One Model's Output**  
    The range comes from a single model (e.g., a simulation with uncertainty). The range might represent a confidence interval (e.g., 95% of the model runs fall in this interval) or a credible interval (if Bayesian). 
    - *What to extract*: Ask for the interpretation (e.g., "Is this a 95% confidence interval?"). Also, if available, the central tendency (mean or median) and the reason for the width (e.g., parameter uncertainty, data limitations).

  - **Scenario B: Multiple Models**  
    The range comes from multiple studies or models (e.g., different assumptions leading to different point estimates). 
    - *What to extract*: Try to get the individual model estimates and the reasons for variation. If not possible, note that the range is an envelope of current estimates.

  - **Scenario C: Genuine Ignorance**  
    The source is expressing their personal uncertainty (e.g., "I think it's between 20 and 60, but I can't be more precise"). This is an imprecise probability.
    - *What to extract*: The range is the set of probabilities that the source considers possible. There is no underlying distribution.

  *Why it matters*: The scenario affects how we collapse the range (Step 2) and combine with other sources (Step 3). For instance, averaging a confidence interval (Scenario A) is often acceptable (if symmetric) but averaging an ignorance interval (Scenario C) might be misleading.

  **Practical Step**: In a time crunch, you can't always call back. So, if the source is an expert, assume Scenario A (if they are citing a model) or Scenario C (if they are giving a personal judgment). For multiple models (Scenario B), the source will often say so explicitly. If unsure, note the context and use the following:
  - If the source uses words like "confidence interval" or "credible interval", it's A.
  - If they say "studies show between X and Y", it's B.
  - If they say "I believe", "my best guess is between", or "it could be", it's C.

  #### 2. When to Collapse a Range to a Point and Alternatives
  - **Legitimate to Collapse**:
    - When the range is symmetric and roughly represents uncertainty around a central estimate (e.g., a confidence interval from a model). Then, use the midpoint (if symmetric) or the mean/median (if known).
    - When the range is narrow and the exact number isn't critical, the midpoint is a fair representation.
    - When the source provides a range but also a "best estimate" (use the best estimate).

  - **Not Legitimate to Collapse**:
    - When the range is very wide (e.g., 20-80%) and collapsing would hide crucial uncertainty. 
    - When the range is asymmetric (e.g., 10-50%) and the midpoint isn't representative.
    - In Scenario C (genuine ignorance) if the range is broad, collapsing might mislead.

  - **What to Write Instead**:
    - Report the range: "Experts estimate between X and Y."
    - If you must have a single number, use the midpoint but add context: "midway in a range from X to Y" or "around [midpoint], though estimates vary widely."
    - For asymmetric ranges, use the geometric mean (if multiplicative, e.g., 3 to 30 times baseline: geometric mean = sqrt(3*30)≈9.5) or the median if known. Otherwise, note the asymmetry: "most likely near the lower/higher end."

  **Rule of Thumb**: If the range spans more than 20 percentage points (e.g., 30-60% is 30 points, so >20) or the ratio of the upper to lower bound is more than 2 (e.g., 3 to 30 is a ratio of 10, so >2), then avoid collapsing. Otherwise, the midpoint is acceptable.

  #### 3. Combining Two Ranges from Two Sources
  Combining two ranges (e.g., one expert says 30-60%, another 45-80%) requires understanding what the ranges represent and the independence of the sources.

  - **What Combining Means**:
    - If both ranges are from independent sources and represent the same kind of uncertainty (e.g., both are 95% confidence intervals from models), we can think of combining evidence.
    - However, if the experts are relying on the same underlying data or are not independent, combining might overstate precision.

  - **How to Combine**:
    - **Scenario A (Confidence/Credible Intervals)**: If the models are independent, the combined interval can be approximated by the overlap or by a weighted average. However, this is complex. In practice, take the intersection (the overlapping part) if it exists, because both experts agree on that sub-interval. If no overlap, that's a red flag: the experts disagree fundamentally. Then, you cannot combine to a single interval without more work.
    - **Scenario B (Multiple Models)**: If both sources are reporting ranges from multiple models, the combined range is the union (the overall min to max) of both sets of models.
    - **Scenario C (Personal Uncertainty)**: We can take the overlap as the agreed-upon range, but if no overlap, then we have disagreement and should report both.

  - **When "Experts say between X and Y" is False**:
    This statement is false if:
    - The two intervals do not overlap (e.g., one says 30-60 and the other 65-80). Then, there is no single interval that both would agree on.
    - The experts are not independent and you are presenting them as such.

  **Practical Step**:
    - Check for overlap: If the intervals overlap, use the intersection as the agreed range (e.g., 30-60 and 45-80 overlap in 45-60). Then, if needed, collapse that to a point (using Step 2) or report the new range.
    - If no overlap, do not combine. Instead, report: "Experts disagree, with estimates ranging from X to Y and from A to B."

  #### 4. Intervals that Widen with New Evidence
  The statistician's point: Conditioning on new evidence can sometimes widen an interval. This is a real feature of the math (not a bug) and occurs in the following situations:

  - **Why it Happens**:
    - In Bayesian updating with imprecise probabilities (or robust Bayes), new data might rule out some previously plausible models, but the remaining models might be more divergent. For example, if the prior was wide and the data is ambiguous, the posterior might be even wider.
    - In the example: The drug had a prior of 20-80%. Then, a small favorable trial (but with high uncertainty) comes in. The expert now believes the drug is more likely to work (so the lower bound goes up? Actually, in the example the lower bound went down to 10% and the upper to 95%). This might be because the trial, while favorable, introduced new uncertainties (e.g., about the effect size in different subgroups) or because the prior was based on limited information and the trial, though positive, was not conclusive enough to narrow the range.

  **Does the Procedure Need a Step for This?** 
    - Yes. Recognize that a widening interval after new evidence is possible and legitimate. It means the new evidence increased uncertainty by revealing complexity. 
    - In such cases, collapsing to a point is especially problematic. Report the full range and explain why uncertainty increased.

  **Practical Step**: If a source revises their range and it becomes wider, ask why (if possible). If not, in your reporting, note: "After new evidence, the estimated range widened, reflecting increased uncertainty about the exact effect."

  #### 5. Choosing an Endpoint for Decision-Making
  When a decision hangs on a range (e.g., whether to prepare for the worst), you need to choose an endpoint to report.

  - **How to Choose**:
    - **Pessimistic End (Conservative)**: Use the end that represents the worst-case scenario if the decision is about risk-aversion (e.g., public health). For example, for a bad outcome (like a side effect), use the upper bound of the probability. For a good outcome (like a drug working), use the lower bound.
    - **Optimistic End**: For encouraging news, the opposite.
    - **Weighted Compromise**: Use a weighted average if you have a probability distribution (e.g., in Scenario A, the 5th percentile for pessimistic, 95th for optimistic). Without a distribution, this is hard.

  - **Where Judgment Comes In**:
    - The choice of which end to emphasize is a value judgment about risk tolerance. It should not be buried. 
    - Flag it to readers: "For planning purposes, the worst-case estimate of X% is being considered" or "The most optimistic scenario suggests Y%."

  **Practical Step**: 
    - If the range comes from a model (Scenario A) and you know the tail percentiles (e.g., 5th and 95th), use the 5th for a bad outcome (pessimistic) or 95th for a good outcome (optimistic). 
    - Otherwise, use the endpoint of the range (the minimum or maximum) and explicitly state that you are doing so because of the decision context.

  **Rule of Thumb**: Only use an endpoint when the decision is highly sensitive to that tail. Otherwise, use the central tendency and note the uncertainty.

  ---

  ### Running the Procedure on Three Cases

  #### Case 1: Two Epidemiologists
  - Source 1: 30-60% (evasion chance)
  - Source 2: 45-80%
  - Desk wants "around 50%"

  **Step 1: Extract Information**  
  Assume both are Scenario A (confidence intervals from their models) or Scenario C (personal uncertainty). Without more info, we'll treat as independent expert opinions (Scenario C or A). 

  **Step 2: Collapse?**  
  The ranges are wide (30 and 35 percentage points) and overlapping. Collapsing each individually to a point: 
    - Source 1: Midpoint = (30+60)/2 = 45%
    - Source 2: Midpoint = (45+80)/2 = 62.5%
  But the desk wants one number. 

  **Step 3: Combine Two Ranges**  
  The intervals overlap (45-60). The intersection is 45-60%. We can collapse that to a point? The midpoint of the intersection is (45+60)/2 = 52.5%. 

  Alternatively, we could average the midpoints: (45+62.5)/2 ≈ 53.75%. But the intersection is more representative of what both experts agree on.

  **Step 5: Decision**  
  Since the desk wants one number, and we have an overlapping range, we can say "around 53%" (from the midpoint of the overlap). However, note the range: "Experts put the chance between 45 and 60 percent, with a midpoint estimate of about 53 percent."

  **But Check Step 2 Rule**: The original ranges are >20 points wide, so we should avoid collapsing to a point without qualification. However, the overlap (45-60) is 15 points, which is borderline. We can use the midpoint of the overlap but with a note.

  **Final for Case 1**: 
  We can use "around 50 percent" (as 53% rounds to 50 in one significant digit) but must note the range. So, in the lede: "around 50 percent, within a range of 45 to 60 percent, according to two epidemiologists." 

  This should satisfy the desk and be honest.

  #### Case 2: Drug Chance of Working
  - Prior: 20-80%
  - After trial: 10-95%
  - Expert says: more sure of direction (likely helpful) but less sure of size.

  **Step 1 and Step 4**: 
  This is a case of widening with new evidence. The expert is operating in Scenario C (personal uncertainty) or Scenario A (model updated). The widening is legitimate because the trial, while favorable (so the expert now thinks it's more likely to work than before), introduced new uncertainties (e.g., about the magnitude of effect or applicability).

  **Step 2: Collapse?**  
  The prior midpoint was 50%. The new midpoint is 52.5%. But the range is now extremely wide (85 points). Collapsing to 52.5% would be highly misleading.

  **What to Write**: 
  Do not collapse. Report the new range and the reason: "The expert revised her estimate to a 10 to 95 percent chance of success, noting that while the drug appears more likely to work, the exact chance is now less certain due to questions raised by the trial."

  **Editor Annoyance**: This will annoy the editor because we cannot provide a single number. But it's necessary.

  #### Case 3: Made-up 60%
  - Source says 60% but admits it's a placeholder for "more likely than not."

  **Step 1**: This is Scenario C (genuine ignorance) but collapsed to a point arbitrarily.

  **Step 2: Collapse?**  
  The source should have given a range (e.g., 51% to 99%? or 55-65%?) but didn't. Since they admit it's made up, we cannot use 60% as a hard number.

  **What to Write**: 
  We cannot use the 60% without qualification. Instead: "The expert said the chance is more likely than not, which he represented as about 60 percent, but noted that number was a placeholder." 

  Alternatively, if we must have a number, use 60% but with the quote about it being a placeholder. However, the lede should reflect the uncertainty.

  **Editor Note**: This might be acceptable if we include the context, but the editor might be annoyed that it's not a firm number.

  ### Which Case Annoys the Editor?
  Case 2 will annoy the editor because we cannot collapse to a single number and must report a very wide range. Case 3 might also be annoying but can be handled with the placeholder explanation. Case 1 is manageable.

  ### Summary of Judgment Calls and Limitations
  - **Judgment Calls**:
    - Classifying the scenario (A, B, or C) without full information.
    - Deciding when a range is too wide to collapse (we set a rule of thumb: >20 percentage points or ratio>2, but this is arbitrary).
    - Choosing the intersection when combining two ranges (versus the union or averaging midpoints).
    - Choosing which endpoint for decision-making (pessimistic vs optimistic) is based on the context and risk attitude.

  - **Deliberately Dropped from Formal Theory**:
    - We did not use probability distributions (like beta distributions for binomial probabilities) because that requires more time and expertise.
    - We avoided Bayesian updating formulas and robust Bayes calculations.
    - We did not address dependencies between sources in depth.

  - **What the Procedure Cannot Settle**:
    - Fundamental disagreements between experts (non-overlapping intervals) without additional information.
    - How to weight two experts (if one is more reliable, we didn't include weighting).
    - When a source gives a range that is not a standard interval (e.g., min to max without a confidence level), we assume it's the full range they consider possible.

  ### Final Procedure Quick Reference

  1. **Extract**: Ask or infer the meaning of the range (model output, multiple models, or personal uncertainty).
  2. **Collapse?** 
     - If the range is narrow (<=20 percentage points and ratio<=2) and symmetric, use the midpoint.
     - If asymmetric, use the geometric mean (for multiplicative) or note the asymmetry.
     - Otherwise, report the range and do not collapse.
  3. **Combine Two Ranges**:
     - If they overlap, use the intersection and then collapse if appropriate.
     - If no overlap, report both and note disagreement.
  4. **Widening Intervals**: If new evidence widens the range, report the new range and explain the increased uncertainty.
  5. **Decision Endpoint**: Use the pessimistic end for bad outcomes (upper bound for probability of bad event) or optimistic for good, and flag that it's a judgment call.

  Now, you have a 20-minute procedure!
answer: |-
  Below is a practical, journalist-focused procedure for handling ranges in science/risk reporting. It prioritizes speed, transparency, and editorial constraints while incorporating insights from imprecise probability theory. I'll first outline the step-by-step procedure, then apply it to your three cases, flagging judgment calls and limitations.

  ---

  ### **20-Minute Pre-Filing Procedure**
  **Tools Needed**: Basic calculator, pen/paper, timer.  
  **Core Principle**: Preserve uncertainty transparency unless math *and* context justify collapsing.  
  **Time Allocation**: 5-7 min per source/range.

  #### **1. Extract Meaning from the Range** (3 min/source)  
     - **Ask/Self-Assign**:  
       - ☑️ "Is this range from **one model** (e.g., confidence interval)?" → Treat as statistical uncertainty.  
       - ☑️ "Is this **multiple models/studies** lumped together?" → Treat as disagreement among evidence.  
       - ☑️ "Is this **genuine ignorance** (no data, subjective guess)?" → Treat as "I don't know" in interval form.  
     - **If source unavailable**: Use context clues:  
       - "Studies suggest X–Y" → Multiple models.  
       - "My model estimates X–Y" → One model.  
       - "I’d guess between X and Y" → Genuine ignorance.  
     - **Critical Output**: Label the range type (A/B/C) for next steps.

  #### **2. When to Collapse to a Single Number** (2 min)  
     - ✅ **Collapse IF**:  
       - Range is narrow (≤15 percentage points or 2× multiplicative factor), *and*  
       - Context isn't decision-critical (e.g., background fact), *and*  
       - Source agrees (e.g., "my best estimate is the midpoint").  
     - 🛑 **DO NOT Collapse IF**:  
       - Range is wide (>20 pp or >3× multiplicative), *or*  
       - Decision depends on it (e.g., policy action), *or*  
       - Labeled genuine ignorance (Type C).  
     - **Alternatives to Collapsing**:  
       - Use midpoint *with qualifier*: "about 45%, midway in a 30–60% range."  
       - State range plainly: "between 30 and 60%."  
       - For genuine ignorance: "Experts cannot pin down a number but believe it’s at least 20% and under 80%."

  #### **3. Combining Two Ranges** (4 min)  
     - **Check Overlap**:  
       - If ranges overlap (e.g., 30–60% and 45–80% → overlap 45–60%), report the **intersection** as the agreed range.  
       - If no overlap (e.g., 20–40% and 60–90%), **do not combine**. State: "Experts disagree, citing estimates from 20–40% to 60–90%."  
     - **"Experts say between X and Y" is FALSE when**:  
       - Ranges don’t overlap (implies fundamental disagreement), *or*  
       - Sources aren’t independent (e.g., same lab, shared bias).  
     - **To combine midpoints**: Only if both ranges are narrow and sources equally credible. Average the midpoints.

  #### **4. Handling Widening Intervals** (1 min)  
     - **Is it real?** YES. Conditioning on new evidence *can* widen intervals (not a bug).  
       - *Why*: New data may reveal hidden complexities, increasing uncertainty about magnitude even if direction is clearer.  
     - **Procedure Step**: If a source revises a range wider:  
       - Do not collapse to a point.  
       - Explain in text: "New evidence narrowed the likely direction but increased uncertainty about the size of the effect."  
     - *No extra math needed—just flag the paradox in your text*.

  #### **5. Choosing an Endpoint for Decisions** (3 min)  
     - **Pessimistic end** (e.g., 80% in a 20–80% chance of failure) if:  
       - Harm is irreversible (e.g., pandemic prep).  
       - Source is risk-averse.  
     - **Optimistic end** (e.g., 20% in same range) if:  
       - Opportunity cost of inaction is high (e.g., drug approval).  
     - **Judgment Call**:  
       - Step 1: State which end you’re using *and why*: "For emergency planning, we use the high end (80%) of the estimated failure risk."  
       - Step 2: Explicitly note this is editorial judgment: "This approach prioritizes caution; others might weigh the lower estimate."  
     - *Never* silently average or split the difference on decision-critical ranges.

  ---

  ### **Applied to Your Cases**
  **Case 1: Two Epidemiologists (30–60% and 45–80%)**  
  - **Step 1**: Likely Type A/B (model outputs). Assume independence.  
  - **Step 2**: Ranges wide (30pp and 35pp) → **do not collapse individually**.  
  - **Step 3**: Overlap exists (45–60%). Combine to intersection: **45–60%**.  
  - **Step 5**: For "around 50%" in lede: Use midpoint of intersection (52.5% → "about 50%"). *But* add: "midway in experts' agreed range of 45–60%."  
  - **Editor Annoyance**: Low (you provided a number but retained uncertainty).  
  - *Judgment Call*: Choosing the intersection over averaging midpoints (which would give 51.25%) as more conservative.

  **Case 2: Drug Expert (20–80% → 10–95%)**  
  - **Step 1**: Genuine ignorance (Type C). Source admits uncertainty increased.  
  - **Step 2**: Range widened dramatically → **never collapse**.  
  - **Step 4**: Worsening precision is real feature. Write: "The expert now believes the drug is more likely to work but is less certain of its exact efficacy, revising estimates to 10–95%."  
  - **Editor Annoyance**: HIGH (no single number). This is the one that will frustrate them. Solution: Offer the midpoint only with heavy caveats: "about 50%, but within a vastly wider range than before."  

  **Case 3: "60% Placeholder"**  
  - **Step 1**: Genuine ignorance (Type C). Source admits "more likely than not" ≈ 51–99%.  
  - **Step 2**: Original "60%" is arbitrary → **do not report as fact**.  
  - **Alternate**: State range implied by phrasing: "well over 50%," or quote directly: "more likely than not, which he initially estimated as 60%."  
  - **Editor Fix**: If forced to pick a number, use "at least 60%" to anchor reader while signaling fuzziness.  

  ---

  ### **Key Limitations & Judgment Calls**  
  - **Dropped Formalisms**:  
    - No Dempster-Shafer theory, belief functions, or robust Bayes calculations (too time-intensive).  
    - Ignored distribution shapes (e.g., log-normal vs. uniform) for simplicity.  
  - **Judgment Calls Dressed as Procedure**:  
    - Classifying range types (Step 1) relies on heuristic cues, not verification.  
    - "Narrow" vs. "wide" range thresholds are arbitrary (15–20 pp rule).  
    - Combining via intersection (Step 3) assumes sources are equally credible.  
  - **What Procedure Can’t Settle**:  
    - Resolving expert disputes (e.g., non-overlapping ranges).  
    - Weighting sources (e.g., senior vs. junior epidemiologist).  
    - Handling >2 ranges (use the full span of all estimates).

  ### **Final Output for Your Editor**  
  - **Always Lead with Honesty**: If a number buries uncertainty, add a clause ("between X and Y," "about Z," "at least A").  
  - **Annoyance Tradeoff**: Case 2 (widening range) forces you to reject a single number. Preempt pushback with: "The science is too unsettled for one estimate—here’s why that matters."  

  This procedure ensures you’re mathematically defensible while meeting newsroom realities. For the 3 cases: **Case 2 is the editor-unfriendly one**—but it’s also the most important to report truthfully.
