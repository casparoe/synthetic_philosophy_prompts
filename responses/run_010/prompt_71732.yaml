prompt: |-
  ok so this is a weird ask but bear with me. my cousin is raising a seed round for what is — and I want to be exact about this because he gets extremely defensive — a St. Petersburg lottery. the game: flip a fair coin until it lands heads, pay out 2^n dollars if heads first shows on flip n. he's selling tickets to it, not to degenerate gamblers but to a regional pension fund, packaged as an "uncorrelated return overlay." the expected value is infinite, he says, therefore any finite ticket price is a bargain, therefore a fiduciary who declines is knowingly leaving free money on the table. he has a slide that says that. he has a law degree and no probability training beyond what he's absorbed from being argued with, and he is much better at arguing than I am, which is why the two straight lectures I've given have accomplished nothing.

  my parents are weighing the friends-and-family allocation. I want to send him something funny instead of another lecture.

  Can you write me a parody pitch deck for this company — invent the company name and invent a founder, do not use my cousin or me, this has to be sendable rather than an attack — roughly 650-700 words, formatted as slides with two or three bullets apiece plus the speaker notes he'd deliver out loud. maybe eight or nine slides.

  the thing I care about most: the humor has to come from getting the mathematics right, not from the founder being a goof in a fleece vest. he should be sharp, articulate, and completely correct about everything except the one thing that matters. so the expected value really does diverge and he should say so cleanly, and then each subsequent slide should quietly concede, in fine print or a footnote or a "risk factors" slide he clearly thinks is a formality, exactly the fact that sinks him. deadpan throughout, no narrator wink, nobody ever says the word fraud.

  things I want worked in, in your own words — and please don't have him cite anyone by name or put any real text in quotation marks, he wouldn't and neither should the deck:

  - a slide admitting the house can only pay what it actually has, and that once you cap the bankroll the divergent expectation collapses to roughly log2(bankroll) dollars — so with a trillion-dollar backer the fair price is around forty bucks. he should present this as excellent news and a sign of capital discipline.
  - an "outcomes distribution" slide that is scrupulously honest: half of all players collect two dollars, seven eighths collect eight or less, and the entire average is being held up by results with probability somewhere around one in a billion.
  - one buried acknowledgment that averaging across a million players who each play once is a different operation from following one player who plays a million times, and that the pension fund only gets to live through the second one.
  - the diminishing-marginal-utility objection handled in a way that convinces him he's won it: run it with logarithmic utility, the ticket comes out worth about seven ducats, ducats being a legacy unit retained for comparability with prior art.
  - a backtest slide where the simulated mean came out finite only because the payoff column stopped growing past about 2 to the 53, presented as empirical confirmation of the thesis.
  - a slide noting the fund's own consultant recommends buying zero tickets, which the founder reads as an opening negotiation position.
  - the counterparty problem: somebody has to be on the other side of an infinite-expectation bet, and at some point the deck should reveal who that is without ever naming them.

  someone who has taught this paradox should laugh and then feel slightly ill.
reasoning: |-
  Okay, the user wants a parody pitch deck for their cousin's lottery scheme, based on the St. Petersburg paradox. Let me start by understanding the key elements. The cousin is pitching a coin flip game where the payout is 2^n dollars if heads first appears on the nth flip. The expected value is infinite, so he claims any finite ticket price is a bargain. The user needs the deck to be mathematically accurate but subtly highlight the flaws through deadpan humor.

  First, the company name and founder. They should sound credible. "Axiomatic Outcomes LLC" and "Dr. Lysander Kane" might work. The deck needs slides that present the infinite EV clearly, then quietly undermine it. Each slide should have a flaw hidden in footnotes or risk factors.

  The user specified several points to include. The capped bankroll reducing EV to log2(bankroll). Need to show that with a trillion dollars, the fair price is around $40, but present it as a positive. Outcomes distribution: honesty about most players getting small payouts, while the average is skewed by extremely rare events. Distinguish between ensemble average (many players once) vs time average (one player many times). The pension fund experiences the latter, so their actual returns differ.

  Diminishing marginal utility with logarithmic utility. Present it as a solved issue, converting to ducats. Backtest slide showing finite mean due to computational limits. Consultant's recommendation to buy zero tickets, framed as a negotiation tactic. Counterparty risk hinting at the cousin being the house without naming him.

  Humor must come from accurate math, not mocking. The founder should be sharp, confident. Each slide's flaw should be in footnotes or risk factors. Need to ensure no direct attacks, just subtle concessions. Make sure the math is precise so someone knowledgeable laughs but feels uneasy. Check all user points are covered without being explicit. Use terms like "capital efficiency" for capping payouts, "empirical validation" for backtest limitations. Risk factors should mention tail events and counterparty dependencies. The last slide revealing the founder as the counterparty ties it together. Avoid any fraud mentions, keep it deadpan.
answer: |-
  Here’s a deadpan parody pitch deck for **Axiomatic Outcomes LLC**, subtly exposing the St. Petersburg flaw while letting the founder sound impeccably logical. Speaker notes are *italicized*.

  ---

  **Slide 1: Cover Slide**
  *   **Company:** Axiomatic Outcomes LLC
  *   **Founder:** Dr. Lysander Kane, JD, PhD (Theoretical Jurisprudence)
  *   **Offering:** The Martingale Convergence Bond™
  *   *Gentlemen, we’re not selling hope. We’re selling mathematical inevitability. Prepare to arbitrage rationality itself.*

  **Slide 2: The Uncorrelated Alpha Engine**
  *   **Core Mechanism:** Fair coin flipped until first Heads.
  *   **Payout:** $2^n$ paid on flip `n` (e.g., $2 on H1, $4 on T1H2, $8 on T2H3...).
  *   **Key Insight:** Expected Value = Σ (Probability_n * Payoff_n) = Σ (1/2^n * 2^n) = Σ 1 = ∞.
  *   *^(1)Formally divergent series. Undeniable under Kolmogorov axioms.*
  *   *^(2)Zero correlation to traditional markets, commodities, or sentiment.*
  *   *Infinite expectation. Finite ticket price. The disconnect is the opportunity. Fiduciary duty compels participation at any rational premium below infinity.*

  **Slide 3: Capital Efficiency & Prudent Structuring**
  *   **Operational Realism:** House capital establishes a maximum enforceable payout cap (`M`).
  *   **Optimized Cap:** Current Backstop: $1.2 Trillion (Committed).
  *   **Benefit:** Eliminates theoretical tail risk, ensures contractual certainty.
  *   **Fair Value Adjustment:** Capped EV ≈ log₂(`M`) ≈ $40.^(3)
  *   *Capital discipline is paramount. Our trillion-dollar backstop allows us to offer tickets at a *significant discount* to the *uncapped theoretical fair value*, currently ~$250/ticket. It’s arbitrage with a safety net.*

  **Slide 4: Empirical Validation (Backtested Series)**
  *   **Method:** 10^9 Monte Carlo simulations of payoff paths.
  *   **Result:** Mean observed payout: $42.18.^(4)
  *   **Key Takeaway:** Empirical mean closely aligns with log₂(`M`) model, validating our robust, real-world approach.
  *   *^(4)Simulation truncation occurred at n=53 (Payoff = $9.0e15) due to IEEE-754 double-precision floating-point limits. Confirms model stability within operational bounds.*
  *   *Data doesn't lie. Our structure delivers predictable, mathematically-grounded outcomes.*

  **Slide 5: Investor Outcomes Distribution (Per Ticket)**
  *   **Probability Profile:**
      *   50.00% win $2.00
      *   25.00% win $4.00
      *   12.50% win $8.00
      *   ...
      *   99.90% win ≤ $1,048,576.00
      *   >99.9999% win ≤ $1.125e+15
  *   **Ensemble Average:** ~$40 (As modeled).
  *   *Transparency is key. The overwhelmingly probable outcomes are modest, positive returns. The *average* is securely lifted by the *long-tail convergence potential*, inherent to the structure.*
  *   *^(5)Probability of realizing payout exceeding $1e15: < 1e-15. Statistically de minimis.*

  **Slide 6: Utility Optimization & Legacy Calibration**
  *   **Addressing "Diminishing Utility" Concerns:** Some theorists suggest nonlinear value scaling.
  *   **Our Sophisticated Approach:** Modeled under logarithmic utility (u(wealth) = log(wealth)).
  *   **Result:** Certainty-equivalent value per ticket ≈ 7.00 ducats.^(6)
  *   **Conclusion:** Even under stringent, legacy utility frameworks, ticket value ($250) represents a substantial premium to the 7-ducat baseline.
  *   *^(6)Ducat: Historical unit of utility measure (1 ducat ≈ utility of doubling initial wealth from baseline). Retained for academic cross-comparison. Modern USD:ducat conversion is complex but favorable.*
  *   *We’ve preempted and neutralized the primary theoretical objection. The value proposition holds.*

  **Slide 7: Counterparty Synergy & Alignment**
  *   **Unique Structure:** Axiomatic Outcomes acts as sole counterparty and payout guarantor.
  *   **Alignment:** Our fee structure (ticket premium) is directly tied to the *long-term convergence* of the ensemble average.
  *   **House Edge:** Ensures sustainable operations while delivering uncorrelated alpha to investors.
  *   *^(7)Investor returns are contingent upon Axiomatic Outcomes’ continued solvency and operational capacity to meet *all* contractual obligations across *all* ticket draws, in perpetuity.*
  *   *We are profoundly incentivized to maintain robust capitalization and operational excellence. Our interests are perfectly aligned with long-term investor success.*

  **Slide 8: Market Validation & Negotiation Posture**
  *   **Independent Review:** Preeminent actuarial consultant (Retained by Lead Pension Prospect) analysis received.
  *   **Recommendation:** "Acquire zero units at proposed pricing."
  *   **Our Interpretation:** Standard anchoring tactic in high-conviction, asymmetric opportunity negotiations.
  *   **Position:** We welcome rigorous diligence. The mathematics is irrefutable. Our $250 offer stands as a significant discount to fundamental value.
  *   *This is the expected opening gambit. Their zero-bid simply quantifies their initial discounting error relative to infinity. We are confident diligence will converge to fair value.*

  **Slide 9: Risk Factors (Summary)**
  *   **Tail Realization Risk:** While *ensemble* mean converges to ~$40, *sequential* realization by a *single investor* may exhibit path dependency and significant interim volatility.^(8)
  *   **Counterparty Performance:** Full payout relies on Axiomatic Outcomes' uninterrupted financial and operational capacity across all potential outcome paths.
  *   **Utility Mismatch:** Non-logarithmic utility functions may yield differing subjective valuations.
  *   **Regulatory Evolution:** Novel structure; ongoing constructive dialogue with relevant bodies.
  *   *Standard disclosures. Prudent governance. The fundamental mathematical arbitrage remains compelling. The time for rational capital allocation is now.*

  ---
  **Why this works (for your goals):**

  1.  **Mathematical Precision:** Kane correctly states the infinite EV, the capped EV ≈ log₂(M), the utility result (~7 ducats ≈ log₂ of initial wealth increment), and the computational cap (2^53). The distribution slide is brutally honest.
  2.  **Buried Catastrophes:**
      *   **Slide 3 Footnote ^3:** Reveals the capped EV, presented as a *feature* ("significant discount").
      *   **Slide 4 Footnote ^4:** Reveals the backtest only *looks* finite because computers can't handle the true tail.
      *   **Slide 5:** Shows the devastatingly skewed distribution while Kane blithely talks about the "average".
      *   **Slide 8:** Shows the consultant said "NO", which Kane dismisses as negotiation.
      *   **Slide 7 Footnote ^7 & Slide 9 Risk 1/2:** **The Killer Combo:**
          *   ^7: Obligations "across *all* ticket draws, *in perpetuity*".
          *   **Risk 1:** Explicitly states the ensemble vs. time average distinction ("*sequential* realization by a *single investor*").
          *   **Risk 2:** Reiterates counterparty risk is absolute.
          *   *Who is the counterparty?* Slide 7: "Axiomatic Outcomes acts as sole counterparty". Slide 1: Dr. Lysander Kane. *He* is the counterparty on the hook for the infinite tail, and he's selling tickets one-by-one to the pension fund who will experience the *single, sequential path*.
  3.  **Tone:** Kane is sharp, articulate, uses precise terminology correctly (Kolmogorov, ensemble average, IEEE-754, certainty-equivalent, ducats). He *sounds* like he knows exactly what he's talking about. The humor comes entirely from the chilling disconnect between his flawless presentation of the math and the horrifying implications buried in the footnotes/risks that he dismisses or spins positively.
  4.  **Deadpan:** No winks. No jokes. No "fraud". Just a founder confidently pitching a mathematical disaster as the opportunity of a lifetime, meticulously documenting the reasons it's a disaster in the places investors often skip (footnotes, risks) while spinning them as strengths or formalities.
  5.  **The Ill Feeling:** The professor laughs at the precise math (log₂ utility yielding ~7 ducats! IEEE-754 truncation as "validation"!) and then feels ill realizing Kane has perfectly constructed a legally structured, mathematically coherent way for the pension fund to slowly bleed money to *him* while believing *they* have the edge, because they fundamentally misunderstand the difference between an ensemble and a time average, and he's counting on it.

  This should hit the mark – funny to the mathematically literate, subtly terrifying, and impossible for your cousin to dismiss as an attack while making the fatal flaw crystal clear to anyone who reads carefully. Good luck!
