  For the decisive question 2 about content invariance... *flips through mental Begriffsschrift notes*... Ah! Section 5 is crucial. When Frege says "the same content" can appear in different judgment contexts without change, that's explicit textual evidence for invariance. Not just permitted but required for his truth-functional analysis to work. The user's "decisive" phrasing suggests this is make-or-break for their project - probably related to that non-cognitivist application in question 3.

