answer: |-
  Your compressed renderings accurately capture Frege's core claims in the relevant sections of *Begriffsschrift* (§§2-5). Let's address your questions systematically, focusing on textual evidence and logical implications.

  ### 1. Tension between (ii) and (iii)?  
  **Verdict:** Superficial tension, but no contradiction in Frege's framework.  
  - **(ii)**: Contents are "self-standing" in the sense that they are *complete conceptual unities* that *could* be judged independently. Frege states: "The content of a judgment is always a possible content of judgment *without* our actually recognizing it as true" (§2).  
  - **(iii)**: When contents are embedded in a conditional, they become *constituents* of a new, complex content. The judgment applies to the *whole* conditional content (the exclusion of the antecedent-true/consequent-false case).  
  - **Resolution**: Frege's view is compositional:  
    - Atomic contents (e.g., "A", "B") are independently judgeable.  
    - Molecular contents (e.g., "If A, then B") are new contents *built from* atomic ones.  
    - The act of judgment ("⊢") applies *only* to the entire content (atomic or molecular).  
    - **No tension**: Entertaining "A" unasserted in "If A, then B" does not require "A" to lack truth-aptness; it simply means we are not *asserting* "A" at that moment. The content "A" remains the same truth-evaluable entity.  

  ### 2. Does Frege commit to content invariance?  
  **Verdict: Yes, explicitly and necessarily.**  
  Frege unequivocally states invariance in §5:  
  > "In the judgment ‘*if B, then A*’, the two partial judgments ‘*B*’ and ‘*A*’ occur *in the same way* as in the judgments ‘*B*’ and ‘*A*’ themselves, *only they are differently combined*."  
  He elaborates:  
  > "The content of the whole is *the same* as that of the judgment ‘*not both B and not-A*’."  
  **Key points**:  
  - The invariance is *required* for his truth-functional analysis (§5, "Case 1–4" table). For the conditional to rule out "B true and A false", "B" and "A" must retain their identity and truth-conditions when embedded.  
  - This is not merely "permitted" by the text; it is foundational to Frege's logic. Without invariance, his account of compositionality collapses.  

  ---

  ### 3. Can non-cognitivism borrow this framework?  
  **Verdict: No. Frege's machinery *requires* components to be truth-apt.**  
  - **The core issue**: Frege defines *content* as what is *judgeable* (i.e., truth-evaluable). From §2:  
    > "I distinguish the *judgment* from the *content of a judgment*... The latter is the *possible content of a judgment*."  
    A "possible content of judgment" is, by definition, truth-apt.  
  - **Non-cognitivist incompatibility**:  
    - If moral sentences (e.g., "Stealing is wrong") express *non-truth-apt attitudes* (e.g., disapproval), they cannot be the "contents" Frege describes.  
    - For Frege, the antecedent in "If stealing is wrong, then..." must be the *same content* as in the atomic judgment "Stealing is wrong", which *must* be truth-apt.  
  - **What does the work?** The requirement that contents are judgeable (truth-apt) is *essential and non-detachable* from Frege's system. His conditional presupposes bivalent truth-values for components.  
  - **Could non-cognitivism reformulate?** Only by abandoning Frege's framework:  
    - If components are non-truth-apt, the truth-functional analysis of the conditional (which relies on component truth-values) is inapplicable.  
    - A non-cognitivist would need an entirely new account of how unasserted components contribute to compound attitudes. Frege offers no resources for this.  

  ### 4. Is the deflationary reading defensible?  
  **Verdict: No, and it would undermine Frege's project.**  
  - **Against deflationism**:  
    - Frege explicitly states that the *same content* appears in asserted and unasserted contexts (§5, quoted above). This is semantic, not notational.  
    - His truth-functional analysis (§5) *depends* on the semantic identity of embedded contents. If "A" in "⊢ A" and "A" in "⊢ B → A" differed in content, the truth-table for "→" would be meaningless.  
  - **Consequences if deflationism were true**:  
    - Frege's solution to the problem of embedded judgments (e.g., conditionals) would collapse.  
    - The Begriffsschrift would lose its capacity to formalize deductive reasoning (e.g., modus ponens relies on content invariance).  
  - **Impact on non-cognitivism**:  
    - Even if (ii) were merely notational, the *truth-functional analysis in (iii)* still requires components to be truth-apt. The non-cognitivist's problem in **3** would *survive intact* because the conditional's semantics presuppose bivalence.  

  ---

  ### Summary of Key Verdicts
  - **Q1**: No genuine tension. Contents are self-standing *and* composable because judgment applies only to the whole.  
  - **Q2**: **Frege explicitly commits to content invariance** (§5). It is necessary for his logic.  
  - **Q3**: Non-cognitivism *cannot* coherently borrow Frege's framework. Truth-aptness of components is non-detachable.  
  - **Q4**: The deflationary reading is indefensible and would not help non-cognitivism.  

  **Final note**: Frege's invariance thesis is the bedrock of his formal system. Without it, the Begriffsschrift fails as a tool for analyzing inference. For the non-cognitivist, this means Frege offers no solution to the embedding problem.
