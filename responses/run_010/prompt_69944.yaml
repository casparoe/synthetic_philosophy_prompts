answer: |-
  ## Joint Statement: Absent-Minded Driver Consensus & Clarification  
  *Agreed by Representatives of Camp A ("Planners") and Camp B ("Localists")*  

  ### 1. Agreed Claims (Signed by Both Camps)  
  1. **Arithmetic of Original Problem**:  
     - The ex-ante optimal *plan* (chosen before driving) is to exit with probability \( p = 5/8 \) at any junction reached.  
     - This yields an expected payoff of \( \frac{25}{16} \) (1.5625).  
     - If the driver *conditions on being at a junction* during the trip and assumes equiprobability of being at junction 1 or 2, exiting yields expected payoff \( \frac{1}{2} \cdot 4 + \frac{1}{2} \cdot 0 = 2 \), while continuing yields \( \frac{1}{2} \cdot 1 + \frac{1}{2} \cdot 0 = 0.5 \). Hence, *local* rationality favours exiting.  

  2. **Plan-Dependence of Uncertainty**:  
     - At a junction, the driver’s belief about *which* junction he is at *depends on the plan he is following*. Under the \( p = 5/8 \) plan:  
       - Probability of being at junction 1: \( \frac{1}{1 + (1 - p)} = \frac{1}{1 + 3/8} = \frac{8}{11} \).  
       - Probability of being at junction 2: \( \frac{3/8}{1 + 3/8} = \frac{3}{11} \).  
     - These beliefs are *not* uniform and are derived from the prior plan via Bayes’ theorem.  

  3. **The Paradox’s Core**:  
     - The case demonstrates a tension between:  
       (i) The ex-ante optimal strategy (planning).  
       (ii) The action recommended by a locally rational calculation (using updated beliefs at a node).  
     - This tension arises *only* because the driver cannot distinguish nodes and has imperfect recall.  

  4. **Dynamic Inconsistency**:  
     - A *real dynamic inconsistency* occurs if an agent’s optimal plan prescribes an action at a future node that they would not choose when actually at that node, *even when using the same decision rule and beliefs*.  
     - The AMD problem *is* dynamically inconsistent under **Localist** reasoning (plan vs. local calculation diverge).  
     - It is *not* dynamically inconsistent under **Planner** reasoning (only the plan matters).  

  5. **Three-Junction Test Case Setup**:  
     - Payoffs: Exit at J1 = 1, J2 = 4, J3 = 9; driving past J3 = 0.  
     - Driver cannot distinguish junctions and must use the same action (exit probability \( q \)) at all.  
     - Both camps agree to compute:  
       - The ex-ante optimal \( q \) (pre-commitment).  
       - The action recommended when *at a junction* (interim decision).  
       - Whether these two recommendations diverge.  

  ---

  ### 2. Disagreements Table  
  | Camp A (Planners)                                                                 | Camp B (Localists)                                                                 |  
  |-----------------------------------------------------------------------------------|------------------------------------------------------------------------------------|  
  | **Decision Problem Definition**: The sole rational choice is made *ex-ante*; decisions at nodes are illusory epistemic artefacts. | **Decision Problem Definition**: Rational choices occur *only* at decision nodes; ex-ante "plans" are predictive tools with no normative force at nodes. |  
  | **Normative Authority**: The ex-ante optimal plan binds the agent *at all times*; deviating is irrational. | **Normative Authority**: Only locally optimal actions (using current beliefs) are rational; plans are defeasible by node-specific reasoning. |  
  | **Time-Consistency Requirement**: Dynamic inconsistency is acceptable if it arises from misapplying conditionalisation (as in AMD). | **Time-Consistency Requirement**: Genuine rationality *requires* time-consistency; AMD reveals a flaw in ex-ante optimisation. |  
  | **Connection to Sleeping Beauty**: AMD concerns *planning under ignorance*; self-locating beliefs are irrelevant. | **Connection to Sleeping Beauty**: AMD *is* a self-locating belief puzzle; updating on "I am at a node" parallels Beauty updating on "I am awake". |  

  ---

  ### 3. Cruxes & Testable Predictions  
  **Crux 1: Does conditioning on "I am at a junction" provide new information?**  
  - **Planner (A)**: No. The driver *knew ex-ante* he would be at a junction. Conditioning is illegitimate double-counting.  
  - **Localist (B)**: Yes. "I am at a junction" rules out ex-ante possibilities (e.g., "I crashed"). Beliefs must update.  
  - **Test**: *If the driver could "crash" before any junction with probability ε, would local beliefs at a junction change?*  
    - Both agree: As ε → 0, B’s posterior → plan-dependent beliefs (8/11, 3/11), A’s position is unaffected.  

  **Crux 2: Is the three-junction case dynamically inconsistent?**  
  - **Planner (A) Prediction**:  
    - Optimal pre-commit \( q \): Maximises \( E = q \cdot 1 + (1-q) \left[ q \cdot 4 + (1-q) \cdot q \cdot 9 \right] \).  
    - At a junction: Follow plan \( q \).  
    - Prediction: No inconsistency (plan binds).  
  - **Localist (B) Prediction**:  
    - Optimal pre-commit \( q \): Same calculation as A.  
    - At a junction: Use plan-dependent beliefs to compute local EU.  
    - Prediction: Inconsistency (local EU ≠ plan EU for optimal \( q \)).  
  - **Calculation Protocol**:  
    - Step 1: Both compute optimal \( q \) (agreed method).  
    - Step 2: Compute local EU at junction using \( P(J1), P(J2), P(J3) \) derived from optimal \( q \) and Bayes’ theorem.  
    - Step 3: Compare local optimal action vs. planned \( q \).  

  **Crux 3: Does Sleeping Beauty illuminate AMD?**  
  - **Planner (A)**: No connection. Beauty’s uncertainty is *centred* (de se); AMD’s is solely about objective location.  
  - **Localist (B)**: Direct parallel. Both involve updating self-locating beliefs under imperfect recall.  
  - **Test**: *In a modified AMD with identical junctions but indexical uncertainty (e.g., "am I Driver 1 or 2?"), would reasoning change?*  
    - A: No—still only about planning.  
    - B: Yes—confirms self-locating belief structure.  

  ---

  ### 4. Verdict on Verbal Disputes & Required Stipulations  
  - **"Decision"**:  
    - Verbal if "decision" is used ambiguously.  
    - Non-verbal stipulation: *Define "decision" either as (a) ex-ante strategy choice, or (b) node-specific action selection.*  
  - **"Rationality"**:  
    - Verbal if unqualified.  
    - Non-verbal stipulation: *Specify whether "rationality" evaluates whole strategies (A) or local actions (B).*  
  - **"Information"**:  
    - Verbal in "does being at a node provide information?".  
    - Non-verbal stipulation: *Define "information" as (a) ruling out ex-ante possible worlds, or (b) any context for belief-updating.*  
  - **"Time-Consistency"**:  
    - Partly verbal; A sees it as technical (same rule applied), B as normative (same outcome).  
    - Non-verbal stipulation: *Time-consistency requires the action at every node to be optimal under the ex-ante optimal strategy’s own criterion.*  

  ---

  ### Three-Junction Test Case Predictions (Pre-Calculation)  
  | **Camp** | **Optimal Pre-Commit \( q \)** | **Interim Action at Junction** | **Predict Divergence?** |  
  |----------|--------------------------------|--------------------------------|--------------------------|  
  | **A (Planners)** | To be calculated (maximises \( E \)) | Follow \( q \) | No |  
  | **B (Localists)** | Same \( q \) as A | Recalculate EU using plan-dependent \( P(J1), P(J2), P(J3) \) | Yes |  

  **Post-Calculation Note**: *Actual optimisation yields \( q = \frac{4}{7} \), expected payoff \( \frac{36}{7} \approx 5.142 \). At a junction: \( P(J1) = \frac{7}{15} \), \( P(J2) = \frac{4}{15} \), \( P(J3) = \frac{4}{15} \). Local EU(exit) ≈ 4.067, EU(continue) ≈ 4.267 → localists recommend continuing, diverging from plan \( q=4/7 \). Planners reject interim recalculation.*  

  ---  
  *This document represents agreed points, clear disagreements, and testable predictions. Disputes reduce to fundamentls about agency and information, resolvable only by stipulation or new arguments at these cruxes.*
