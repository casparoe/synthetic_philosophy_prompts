  - The impossibility of invisible disease transfer (contagionism was still contested)
  - The irrelevance of cadaver contact to live patients
  - The self-evident safety of established medical rituals

  These functioned as hinges because:
  1) They framed what counted as admissible evidence
  2) Were immune to direct empirical testing within their paradigm
  3) Underpinned daily hospital practices

  Semmelweis' own hinges differed:
  - The primacy of observable mortality patterns over theory
  - The validity of statistical comparison
  - The moral imperative to act on correlations

  When mortality rates dropped after handwashing, physicians absorbed this by:
  - Attributing it to clinic rotation changes (temporary)
  - Questioning Semmelweis' data collection
  - Invoking atmospheric factors

  The hinge reading doesn't replace the "Semmelweis reflex" but deepens it: resistance wasn't merely stubbornness but a collision of frameworks. What only hinge theory explains is why contradictory evidence could be seamlessly incorporated without paradigm shift.

  On epistemic blame: hinges make physicians' stance comprehensible but not blameless. Their failure was refusing to let anomalies challenge foundations. Semmelweis' later breakdown reflects the agony of seeing hinges as movable when others don't.

