  The rapid conversion post-germ theory shows hinges aren't evidence-proof but require replacement frameworks. This confirms Wittgenstein's view that hinges shift with "riverbed" changes in practice.

  Weakest point: My reading assumes physicians genuinely couldn't "see" Semmelweis' evidence as valid, not just ignored it. If new scholarship shows deliberate suppression, the hinge analysis weakens.

