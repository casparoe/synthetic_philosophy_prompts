prompt: |-
  Novelist here, three chapters deep into a book I'm not sure I can pull off, and I need a spec before I write any more of the middle.

  Setup: a drought-stricken river basin, a water treaty that allocates by the ton off the back of a list of protected taxa given by scientific name, and a fish everybody has called one species for eighty years. Then a revisionist team proposes splitting it into four, which quietly redraws who gets water. My tribunal chapter is full of expert witnesses who are effectively arguing about what a species *is*, and I need their disagreement to be about something real rather than two people using the same word differently — which is what it keeps collapsing into in draft.

  So: write the desiderata. What would any theory of species have to deliver to count as adequate — and, for my purposes, to be usable in a room like that one. I want each requirement with the case or the consideration sitting behind it, not a catalogue of isms. Things I already suspect belong on the list, tell me where I'm wrong:

  - it has to handle the lineage in my book that's all-female and gynogenetic — needs a neighbouring species' sperm to trigger egg development, gives nothing genetic back — because that's the one none of my witnesses want to touch;
  - it has to survive the headwater population that intergrades with everything downstream instead of pretending clines aren't real;
  - it has to be decidable from what a witness could actually carry into a hearing — a jar, some photographs, tissue out of a museum drawer collected in the 1930s — not from a genome nobody has sequenced;
  - it has to say what makes the thing on the treaty list the same entity over time as the thing in the water right now, and seperately what makes it one entity rather than two at a single moment;
  - it has to say whether the type specimen in that drawer fixes a boundary or only a name;
  - and it has to explain why different camps counting the same fauna come out with numbers that differ by an order of magnitude, and whether that's a defect in the theories or exactly what you'd expect.

  Then the part I most want. Which of these are genuine requirements and which are one camp's taste dressed up as rigor. Which pairs or triples can't all be met at once — I've got "revisable as the science improves" against "settled enough to allocate water by" already, show me the others, especially anything that turns on gene flow or on asexuals. And which single requirement does the most damage to the most contenders, because that's probably the hinge my whole chapter should turn on. Finish with a short paragraph scoring the main species concepts against the list — keep it short, dont pad it, the criteria are where I need the thinking and I'll handle the drama myself.
reasoning: |-
  Alright, let me unpack this novelist's request. They're three chapters into a drought-stricken river basin story where a taxonomic revision could redistribute water rights, and need help crafting a believable scientific tribunal scene about species definitions. 

  First, I notice they've already identified key biological complexities: the gynogenetic fish lineage, clinal populations, and evidentiary constraints. Smart. They're not just asking for species concepts - they want the philosophical tensions underneath. The real challenge is making the expert testimony feel authentic without collapsing into semantic debates.

  Hmm... their desiderata list shows they've done homework but might be conflating operational needs with theoretical ideals. For example, "decidable from a jar of specimens" is practical but conflicts with how modern systematics actually works. And that gynogenetic case... *winces* that's going to gut at least three species concepts immediately. 

  The core tension seems to be: how can science simultaneously demand revisability (new data changes classifications) and stability (treaty allocations require fixed entities)? No species concept resolves that perfectly. I should highlight which requirements inherently conflict, like:
  - Asexual reproduction vs. interbreeding-based definitions
  - Historical continuity (same entity over time) vs. contemporaneous classification (one or two now)
  - Type specimens as anchors vs. population thinking

  For the scoring paragraph... must resist listing all 28+ species concepts. Focus on Biological, Phylogenetic, and Morphological - they'll contrast best dramatically. Emphasize how each fails the gynogenesis test. The evidentiary constraint might actually be the silent killer in the room - nobody can sequence 1930s specimens, so morphology gets overvalued...

  Biggest insight: the "order of magnitude difference in counts" isn't a flaw - it's inevitable when concepts have different resolution powers. That's the courtroom mic-drop moment waiting to happen.
answer: |-
  Here's a breakdown of the desiderata for a species concept usable in your tribunal, analyzing conflicts and scoring major contenders. Focus is on the *requirements* driving the debate.

  **Core Desiderata & Their Rationale:**

  1.  **Handle Non-Standard Reproduction (Gynogenesis):** Must accommodate lineages that reproduce asexually or rely on sexual "parasitism" without genetic exchange. *Rationale:* Real biological entities exist that defy classic "interbreeding" models. Ignoring them creates artificial gaps or forces arbitrary classification. (This torpedoes concepts relying solely on reproductive isolation).
  2.  **Acknowledge & Model Continuity (Clines/Intergradation):** Must explicitly account for populations connected by gene flow where boundaries are fuzzy, not discrete. *Rationale:* Nature often shows gradual change, not sharp breaks. A concept must explain *why* we draw a line *here* despite continuity, not pretend discontinuity exists where it doesn't. (Challenges concepts demanding absolute reproductive isolation or diagnosability).
  3.  **Operational Decidability with Available Evidence:** Must allow identification/classification using evidence realistically presentable in a hearing (morphology, limited tissue samples, historical records/photos, not requiring full genomes or impossible-to-observe behaviors). *Rationale:* Practical application. The concept must function within the evidentiary constraints of the real-world scenario (tribunal, field surveys, historical comparisons).
  4.  **Address Temporal Identity (Same Entity Over Time):** Must provide criteria for determining if the *X tonsorius* described in the 1930s treaty is the *same entity* as the fish in the river today, despite potential change. *Rationale:* Treaty obligations hinge on persistent entities. Requires a concept of lineage continuity.
  5.  **Define Contemporaneous Boundaries (One vs. Two Now):** Must clearly state what constitutes a single species *at a given time* vs. multiple species. *Rationale:* Allocation depends on counting distinct protected units *now*. This is distinct from historical continuity.
  6.  **Define the Role of the Type Specimen:** Must specify if the type fixes the essential characteristics/boundaries of the species for all time (essentialism) or merely anchors the name to a specific population sample, allowing the species' circumscription to evolve. *Rationale:* Taxonomic stability vs. scientific progress. Museum drawers contain types; their authority in revision is critical.
  7.  **Explain Count Discrepancy & Its Meaning:** Must account for why different approaches (using the same concept or different concepts) applied to the same fauna yield vastly different species counts. Must clarify if this indicates flawed concepts/methods or is an expected consequence of inherent complexity (e.g., differing resolutions, weighting of criteria). *Rationale:* Central to the conflict in your tribunal. A valid concept must make sense of this observed variation in outcomes.

  **Analysis of Conflicts & "Taste vs. Rigor":**

  *   **Genuine Requirements:** 1 (Gynogenesis), 2 (Clines), 3 (Operational Decidability), 4 (Temporal Identity), 7 (Count Discrepancy Explanation). These stem directly from biological reality or the specific constraints of the scenario.
  *   **Potential "Taste Dressed as Rigor":** Aspects of 5 (Contemporaneous Boundaries) and 6 (Type Role). *Why:* The *degree* of diagnosability required for "One vs. Two Now" (5) is often debated (e.g., absolute gaps vs. statistical differences). The weight given to the type specimen (6) vs. population variation is a historical/philosophical preference within taxonomy. However, both remain essential *questions* the concept must address explicitly.
  *   **Key Conflicts:**
      *   **Revisability vs. Stability (as noted):** Science improves (new data, concepts), but treaties need fixed entities. *All* concepts struggle here, but some (Phylogenetic) embrace change more openly than others (Morphological).
      *   **Operational Decidability (3) vs. Theoretical Purity (1 & 2):** Concepts best handling gynogenesis (1) or clines (2) often require genetic data or complex analysis (violating 3). Concepts easy to apply with jars/photos (3) often fail miserably at 1 & 2.
      *   **Lineage Continuity (4) vs. Contemporaneous Boundaries (5):** Emphasizing deep historical lineages (4 - Phylogenetic) can conflict with recognizing distinct units defined by current barriers/gene flow (5 - Biological).
      *   **Handling Asexuals (1) vs. Defining "Species" Coherence:** Concepts centered on interbreeding (Biological) or shared evolutionary fate (Evolutionary) cannot coherently include the gynogenetic lineage without major contortions. This is the **single most damaging requirement (1)**. It forces either abandoning those concepts for this case or creating awkward exceptions, exposing fundamental limitations.

  **Scoring Major Concepts Against Desiderata:**

  *   **Biological Species Concept (BSC - Interbreeding/Isolation):**
      *   **Fails:** 1 (Gynogenesis - not interbreeding), 2 (Clines - messy intergradation violates isolation), 4/5 (Poor with temporal change/lineages), 7 (Counts low in clines/high in isolates).
      *   **Struggles:** 3 (Observing interbreeding hard), 6 (Type less relevant than current barriers).
      *   **Strengths:** Intuitive for sexually reproducing sympatric groups; clear(ish) contemporaneous boundary (5) *if* isolation is absolute.

  *   **Morphological Species Concept (MSC - Form/Diagnosability):**
      *   **Fails:** 1 (Gynogenetic morph may mimic sperm-donor), 2 (Clines - gradual change = no sharp diagnosis), 4 (Morphology changes over time).
      *   **Struggles:** 7 (Counts highly sensitive to chosen diagnostic characters).
      *   **Strengths:** 3 (Works with jars/photos!), 6 (Type central as exemplar), 5 (Clear *if* diagnosable gaps exist).

  *   **Phylogenetic Species Concept (PSC - Monophyly/Diagnosability):**
      *   **Fails:** 1 (Asexual lineages can be monophyletic but challenge "species" status), 2 (Can force arbitrary splits in clines to get diagnosable units).
      *   **Struggles:** 3 (Requires robust phylogeny - hard with limited tissue/museum samples), 4/5 (Focuses on lineages but boundaries defined by apomorphies/splits), 7 (Inherently produces highest counts - smallest diagnosable units).
      *   **Strengths:** 4 (Explicitly lineage-based), 6 (Type anchors name, circumscription evolves), 7 (Explains high count discrepancy as inherent).

  **Conclusion for Your Chapter:** The **gynogenetic lineage (Requirement 1)** is the wrecking ball. It forces witnesses using BSC or similar concepts into logical contortions or outright dismissal of the lineage as "not a proper species." The **operational constraint (Requirement 3)** elevates morphology and type specimens, creating tension with concepts needing genetic data. The **count discrepancy (Requirement 7)** isn't a flaw; it's diagnostic. A PSC advocate *expects* vastly higher counts than an MSC user looking for broad morphotypes, and *both* can claim rigor. The hinge is whether the treaty requires protecting *evolutionarily distinct lineages* (PSC - high counts, hard evidence) or *recognizably distinct forms* (MSC - lower counts, easier evidence), exposing the impossibility of a purely "scientific" answer divorced from the treaty's implicit ontology. The most damaging single requirement is **Handling Non-Standard Reproduction (1)**.
