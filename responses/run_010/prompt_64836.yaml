  For the diagonal conjunction (question 2), the user's A-D/B-C pairing seems right. When Aristotle warns of "both excesses," he means bilateral imbalance: one party gets more value twice over if proportions misalign. The ἰσασμένον participle is key - D is already value-equalized, likely by implicit demand-assessment before exchange. 

  The shift to money-terms at 1133b10 (question 3) is deliberate: money abstracts persons into demand-units. [15]'s A:C::B:C proportion (house:bed :: minae:minae) collapses the four-term model because money now embodies both producers' chreia. This isn't a different proportion type but the same reciprocity monetized.

  Chreia (question 4) is the real tangle. Rackham's "demand" flattens its range - from psychological want to objective need-for-association. πρὸς δὲ τὴν χρείαν ἐνδέχεται ἱκανῶς definitely means "relative to need it suffices," admitting approximate commensurability. No contradiction: Aristotle holds ideal commensurability exists via chreia, with money as practical approximation.

  On ἐξ ὑποθέσεως (question 5), the methodological reading fits better. "Hypothesis" suggests posited unit (like geometric axiom), with nomos explaining its conventional stability. This makes money primarily an accounting tool - crucial for the user's dissertation angle.

  The producer-ratio worry (question 6) dissolves if we read "equalized" rigorously. At 1133a14, unequal persons must be value-equalized before forming A:B. The shoemaker isn't half the man; his product's demand-value makes A:B 1:1 in exchange context.

  Finally, the bracketed corn-export example (question 7) illustrates unilateral demand failure. Removing it weakens the psychological chreia evidence slightly, but the functional/normative dimensions remain strong elsewhere.

