prompt: |-
  I sit on the Elections and Governance Commission of a national professional association of roughly 40,000 members, which elects a fifteen-member board in a single at-large contest under plurality block voting: each member may cast up to fifteen votes, and the fifteen highest totals win. For three consecutive cycles the slate coordinated by the association's largest caucus has taken all fifteen seats, while a rival slate drawing between 43 and 45 percent of the vote has taken none; turnout in those contests ran below 20 percent. The Commission must settle, before its June meeting, which rule to recommend for the bylaw amendment ballot this fall. Three proposals are formally before us:

  (a) single transferable vote in the existing fifteen-member at-large district;
  (b) fifteen single-member geographic districts under first-past-the-post;
  (c) cumulative voting in five three-member districts, each member holding three votes that may be spread across candidates or piled onto one.

  Three complications constrain the choice. Our bylaws reserve at least three seats for members within seven years of certification, and proposal (a) supplies no way to enforce that floor through the count itself; staff have suggested carving reserved seats out of the district, which counsel considers permissible but expects to be slow and internally contentious. Two years ago we absorbed a 4,000-member specialist society whose members are dispersed across every region and who have not won a seat since the merger. And the caucus that has been sweeping argues, persuasively to several commissioners, that proposal (b) would convert the board into fifteen regional delegates and cost the association its capacity to take a single position on regulatory questions.

  Please draft the Commission's decision memo. It should commit to one proposal, or one proposal with a specified amendment, rather than ranking all three, and it should be actionable: what goes on the ballot, and in which cycle the new rule first operates. Deliver it as exactly five numbered items of two or three sentences each, with no preamble, no subheadings, and no signature block: (1) the recommendation and its effective cycle; (2) a diagnosis of the present rule stated in arithmetic the sweeping caucus would accept as fact; (3) why the runner-up proposal loses; (4) how the early-career floor and the merged-in society are to be handled under the recommended rule; (5) the opposing caucus's best argument given at full strength, together with whatever the memo concedes to it.
reasoning: |-
  Okay, the user is part of an Elections and Governance Commission for a large professional association with 40,000 members. They need to recommend a voting rule change because the current system has let one caucus sweep all 15 board seats for three cycles, despite a rival group getting 43-45% of the vote. Turnout is low, below 20%, which indicates members might be disengaged. The commission has three proposals to consider, each with their own complications.

  First, I need to understand the current system: plurality block voting. That means every member can vote for up to 15 candidates, and the top 15 vote-getters win. This is problematic because it allows a majority group to take all seats, leaving minority groups unrepresented. The rival caucus consistently gets a significant share of votes but no seats, which shows the system isn't fair.

  Now, looking at the three proposals: STV (single transferable vote), which allows proportional representation; single-member districts with FPTP (first-past-the-post); and cumulative voting in multi-member districts. Each has pros and cons.

  The user mentioned constraints: bylaws require at least three seats for early-career members (within seven years of certification), and there's a merged society of 4,000 dispersed members who haven't won any seats since merging. Plus, the dominant caucus argues that single-member districts would turn the board into regional delegates, hurting unified positions on regulatory issues.

  For the memo structure, it needs five numbered items without preambles or signatures. I have to choose one proposal and make it actionable. 

  Considering the options: STV could provide proportionality but doesn't enforce the early-career seat requirement directly—staff suggested carving out seats, but that might be contentious. Single-member districts might help geographically concentrated groups but could ignore dispersed groups like the merged society and risk regional fragmentation. Cumulative voting allows vote concentration, which could help minorities get representation without carving districts too finely.

  Cumulative voting in five three-member districts seems balanced. It allows minority groups to focus their votes, potentially securing seats. The merged society members are dispersed, so they could coordinate to elect someone in their district. For early-career members, a quota could be applied within the districts. This avoids the regional delegate issue raised by the dominant caucus.

  I should address why STV loses: it doesn't handle the reserved seats easily, and the carve-out process could be slow and contentious. Single-member districts lose because they might not help dispersed groups and could fragment the board's unity.

  The opposing caucus's argument about regional delegation is strong for single-member districts, but cumulative voting maintains at-large elements within districts, so the concession is that it still requires candidates to build broader support.

  Putting it all together: recommend cumulative voting with implementation in the 2025 cycle, explain the current rule's arithmetic flaw, dismiss other options, handle constraints via quotas and district design, and acknowledge the opposing view while showing how the recommendation mitigates it.
answer: |-
  **1.** The Commission recommends proposal (c), cumulative voting in five three-member districts, effective for the 2025 election cycle. This proposal shall appear on the fall bylaw amendment ballot. Implementation requires defining district boundaries before candidate filing opens in January 2025.

  **2.** The present at-large plurality rule allows a cohesive plurality, commanding roughly 55-57% of votes cast in low-turnout elections, to win every seat by coordinating a full slate and directing votes efficiently. A rival group consistently winning 43-45% of votes secures no seats because its support is spread thinly across all candidates in the block vote, falling below the winning threshold for any single candidate.

  **3.** Proposal (a) (STV) is rejected because it cannot intrinsically guarantee the early-career seat floor without complex and contentious post-election adjustments or pre-election district carve-outs, creating unacceptable delay and conflict risk. Proposal (b) (single-member districts) is rejected as it disadvantages nationally dispersed groups like the merged society and risks amplifying regional factionalism over association-wide interests.

  **4.** The early-career seat requirement will be met by establishing a nomination quota within each three-member district: at least one candidate per district must be within seven years of certification. For the merged society, cumulative voting allows their dispersed members to concentrate all three votes onto a single preferred candidate within their district, significantly lowering the threshold needed for election compared to the current system.

  **5.** The sweeping caucus correctly argues that single-member districts risk fragmenting the board into regional delegates, potentially hindering unified regulatory advocacy. While cumulative voting districts are geographic, electing three members per district forces candidates to build broader, multi-factional support within their region, preserving a stronger capacity for association-wide perspective than fifteen single-member seats would.
