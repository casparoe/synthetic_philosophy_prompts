prompt: |-
  Our production company makes a weekly narrative-history podcast, and I am the one who decides whether a contested claim about the distant past goes into the script as stated, goes in hedged, or comes out. Write me a procedure my team can actually run — source criticism in spirit, but usable by people with no historian on staff.

  Constraints: fifteen to twenty such claims per episode, twenty minutes each; nobody reads the relevant primary languages, so we work from translations and from modern syntheses; the executive producer signs off only on calls the procedure flags as non-mechanical. We currently sort everything into three labels — attested, disputed, reconstructed — and the scheme misfires in ways I can name. A claim resting on a single late author who is agreed to have used a lost earlier account gets dumped into "disputed" beside genuine live controversies. A boast carved on a monument by the king it flatters is weighted the same as that boast reported by his enemies. An oral tradition first written down eight centuries after the events is discarded even when the archaeology fits it.

  Give me the questions in the order they should be asked, what counts as a sufficient answer at each, which distinctions from the tradition must survive the simplification and which I can drop under those constraints, where the procedure terminates in a label, and where it stops and hands the call to a person because what is at issue is how much confidence we owe an audience rather than what the evidence shows. Tell me if three labels is the wrong number, and be explicit about what the procedure cannot settle at all — I assume my inability to evaluate a specialist consensus is one.

  Then run it on these. (1) Our only account of a battle was written three centuries later by an author whose sources are lost, and four subsequent writers quote him: independent witnesses, or one witness five times over? (2) A story I have treated as legend, where two chronicles composed by parties hostile to one another agree on a detail damaging to both. (3) The season's most vivid scene, which one respected specialist defends as traditional and the rest regard as later invention. I expect (3) to cost me the scene — tell me if it should not, and tell me if (2) obliges me to grant a story more credit than I want it to have.

  No bibliography or reading list; just the procedure and the three verdicts.
reasoning: |-
  Okay, the user runs a production company for a weekly narrative-history podcast and needs a practical procedure to evaluate historical claims without a historian on staff. They deal with 15-20 claims per episode, each needing evaluation within twenty minutes. The current system uses three labels—attested, disputed, reconstructed—but has flaws. For example, they treat a single late author using a lost source the same as genuine controversies, and they don't differentiate between biased sources like a king's monument versus enemy reports. Also, oral traditions written down centuries later are discarded even if archaeology supports them.

  The user wants a new procedure that's source criticism simplified for non-experts. Key constraints: no primary language access, reliance on translations and modern syntheses, and the executive producer only reviews non-mechanical calls. They need the questions in order, clear decision points, labels, and where human judgment is needed. They also wonder if three labels are sufficient and what the procedure can't handle. Plus, they provided three test cases to apply the new method.

  First, I need to address the flaws in their current system. The problems include not accounting for intermediate sources, source bias, and corroborating evidence. The new procedure should have steps to evaluate source reliability, independence, corroboration, and specialist consensus. Since they can't read primary sources, the procedure must rely on secondary sources and syntheses for context about the sources themselves.

  The user mentioned specific misfires: a single late author using a lost source gets "disputed" like real controversies. So the procedure should differentiate between "transmission issues" (lost sources) versus actual disputes. Also, a king's boast vs. enemy report should have different weights—maybe by assessing bias and motivation. For oral traditions, if archaeology fits, it shouldn't be discarded; so the procedure needs a step for external evidence.

  I should structure the questions in a logical order. Start with the basics: is there any source? Then check if it's primary or secondary. Evaluate the source's proximity to the event, potential bias, and corroboration. Include steps for specialist consensus and where human judgment is needed, like confidence levels for the audience.

  The labels might need adjustment. Instead of three, perhaps four: attested, reconstructed, disputed, speculative. "Reconstructed" could be for when evidence is indirect but plausible, like archaeology supporting an oral tradition. "Disputed" for active scholarly debates, and "speculative" for weak evidence. The user's current "reconstructed" might be too vague.

  For the test cases: 
  (1) A battle account from a late author quoted by others. Need to determine if the later quotes are independent or just copying. The procedure should check if the later writers add new info or cite different sources. If not, it's one source multiple times. Result: reconstructed due to transmission issues.

  (2) Two hostile chronicles agreeing on a detail damaging to both. Bias is high, but mutual agreement despite hostility suggests authenticity. This might bump it to attested if no other red flags.

  (3) A vivid scene defended by one specialist but rejected by others. Specialist consensus is divided, so it's disputed. But the user thinks it might cost the scene. The procedure should flag it for EP review since confidence for the audience is subjective.

  What the procedure can't handle: evaluating the strength of specialist consensus without expertise, nuanced source criticism needing language skills, unpublished evidence, or theoretical debates. The EP must handle those.

  Ensuring the procedure is usable by non-historians. Steps should be clear with yes/no answers where possible. Use secondary sources to answer questions about source reliability, bias, etc. Time constraints mean some steps might be streamlined, like checking for corroboration quickly via syntheses.

  Finally, applying the procedure to the test cases to validate it. For (2), the agreement between hostile sources might force the user to accept it as attested, which they might not want, but the procedure should reflect evidence strength. For (3), it's disputed but EP decides on inclusion based on narrative need vs. accuracy.
answer: |-
  Here's a streamlined source criticism procedure designed for non-historians under your constraints, prioritizing efficiency, clarity, and flagging key judgment calls. It reduces cognitive load by asking questions in a specific order, terminating early where possible, and using distinct labels reflecting *how* we know something, not just *if*.

  **Procedure: Source Evaluation Flowchart**

  1.  **Is there ANY direct textual/inscriptional source mentioning the claim?**
      *   *Yes:* Go to Step 2.
      *   *No:* Go to Step 6 (Archaeology/Tradition).

  2.  **How close is the source to the event? (Using dates from reliable syntheses)**
      *   *Within 1-2 generations (approx. 50-80 years) AND author plausibly had access to witnesses/records?* → Label: **ATTESTED** (Proceed to Step 3 ONLY if major red flags known via synthesis).
      *   *Later than 2 generations?* → Go to Step 3.

  3.  **Source Transmission & Independence**
      *   *Is this the ONLY source for the claim?*
          *   *Yes:* → Label: **RECONSTRUCTED** (Single data point, potentially reliable but isolated).
          *   *No (Multiple sources exist):* → Go to Step 4.

  4.  **Corroboration & Bias Check**
      *   *Do the multiple sources show clear signs of being INDEPENDENT? (e.g., different authors, different locations, different factions, different purposes, as per syntheses)*
          *   *Yes:* Go to Step 5.
          *   *No (Likely derived from a single lost source or copying each other)* → Label: **RECONSTRUCTED** (Based on a single, possibly good, but lost tradition).
      *   *Regardless of independence, is there a dominant, known BIAS in ALL sources making the claim? (e.g., all are pro-king, all are from victors, all have religious agenda)*
          *   *Yes, strong bias:* → Label: **RECONSTRUCTED** (Plausible but colored by perspective).
          *   *No significant bias OR biases conflict:* → Go to Step 5.

  5.  **Agreement & Damage Check (Crucial for surprising claims)**
      *   *Do sources AGREE on the specific claim?*
          *   *Yes:* → Label: **ATTESTED**. (Strongest textual case - multiple, independent, agreeing sources).
          *   *No (Disagreement exists):* → Go to Step 7 (Dispute Check).
      *   *SPECIAL CASE: If sources from MUTUALLY HOSTILE factions agree on a detail that is DAMAGING or EMBARRASSING to BOTH/ALL sides?*
          *   *Yes:* → Label: **ATTESTED** (High credibility - unlikely to be invented by either side). *This forces credibility even if unwanted.*
          *   *No:* → Proceed normally.

  6.  **Archaeology / Oral Tradition**
      *   *Is the claim based SOLELY on archaeological evidence?*
          *   *Yes:* → Label: **RECONSTRUCTED** (Material evidence, interpretation needed).
      *   *Is the claim based SOLELY on an oral tradition first recorded centuries later?*
          *   *Yes:* → Go to Step 6a.
      *   *Does archaeology CORROBORATE a textual or oral claim?*
          *   *Yes:* → **Upgrade the existing label:** `Reconstructed` → **RECONSTRUCTED (Corroborated)**; `Disputed` → **RECONSTRUCTED (Corroborated)**; `Attested` remains **ATTESTED**. (Corroboration strengthens).
          *   *No/Inconclusive:* → Keep label from previous steps.

      6a. **Oral Tradition Credibility**
          *   *Does a synthesis indicate the tradition is widely attested across different groups OR fits known cultural patterns?*
              *   *Yes:* → Label: **RECONSTRUCTED** (Plausible Tradition).
              *   *No:* → Label: **DISPUTED** (Uncorroborated Late Tradition).

  7.  **Dispute Check (Active Scholarly Debate)**
      *   *Do reliable syntheses indicate SIGNIFICANT, ONGOING DEBATE among specialists about this specific claim's validity?*
          *   *Yes:* → Label: **DISPUTED**.
          *   *No:* → Revert to label determined in Step 5 (usually **ATTESTED** or **RECONSTRUCTED**).

  **Where Human Judgment (EP) is Mandatory:**
  *   **Step 5 (Agreement/Damage Check):** Interpreting "mutually hostile," "damaging to both," and whether agreement is *meaningful* for the specific claim might need nuance.
  *   **Step 7 (Dispute Check):** Judging the "significance" and "ongoing" nature of a debate from syntheses can be subjective. Is it a major rift or a minor quibble? Does the synthesis present it as unresolved?
  *   **Label Application - Audience Confidence:** The procedure determines the *evidentiary status*. The EP must decide if **RECONSTRUCTED** or **DISPUTED** claims have **sufficient plausibility/interest for inclusion** (perhaps hedged) given the podcast's narrative goals and responsibility to the audience. *The procedure cannot weigh narrative value vs. historical confidence.*
  *   **Specialist Consensus Evaluation:** *The procedure cannot directly evaluate the strength of a specialist consensus.* It relies entirely on how syntheses *report* the state of play (Step 7). If syntheses are ambiguous or contradictory about consensus, flag for EP.

  **Labels Explained (4 Labels):**
  *   **ATTESTED:** Multiple independent, early, and/or unbiased sources agree; OR sources with conflicting biases agree on a damaging detail. High confidence based directly on the historical record. *(Replaces part of your old "attested", includes strong cases from bias check)*.
  *   **RECONSTRUCTED:** Plausible inference based on: a single (even late) source; sources likely dependent on one lost source; archaeology; credible oral tradition; or a claim upgraded by corroboration. The "best guess" based on available evidence, often requiring interpretation. *(Captures your "single late author using lost source", "king's boast", "oral tradition + archaeology")*.
  *   **DISPUTED:** Significant, ongoing scholarly debate exists about the claim's validity based on syntheses. Requires hedging or omission. *(Captures genuine live controversies)*.
  *   **SPECULATIVE (Implicit):** Claims failing all steps (e.g., uncorroborated, very late, unique tradition with no support, rejected by consensus). **Omit.** Not a formal label, just the action.

  **Why 4 distinctions?** Three (`Attested`, `Reconstructed`, `Disputed`) are formal labels applied by the procedure. `Speculative` is the discard pile. This separates *how we know* (Attested/Reconstructed) from *active uncertainty* (Disputed), solving your misfires.

  **What the Procedure Cannot Settle:**
  1.  **Evaluating Specialist Consensus:** It relies on syntheses flagging disputes (Step 7). Subtle consensus or debates within untranslated scholarship are invisible.
  2.  **Nuanced Source Criticism:** Fine details of language, subtle bias, complex textual interdependence requiring original language analysis are beyond scope.
  3.  **Unpublished/Recent Evidence:** Relies solely on accessible translations and syntheses.
  4.  **Theoretical Frameworks:** Cannot adjudicate claims based primarily on competing historical theories (Marxist vs. Great Man, etc.) if syntheses don't frame it as a factual dispute.
  5.  **Narrative Necessity vs. Historical Confidence:** The EP must make this call based on the label and audience expectation.

  ---

  **Applying the Procedure to Your Cases:**

  **(1) Battle Account: Single late author (3c later), sources lost, quoted by 4 later writers.**
  *   Step 1: Yes (Textual source).
  *   Step 2: Later than 2 gens → Step 3.
  *   Step 3: Is this the ONLY source? *Yes* (The 4 later writers are quoting *him*, not providing new independent info; they are one witness five times over) → **Label: RECONSTRUCTED** (Based on a single, lost tradition transmitted late).
  *   *EP Judgment:* Not needed on label. EP decides if this level of reconstruction warrants inclusion in the narrative.

  **(2) Legendary Story: Two hostile chronicles agree on a detail damaging to both.**
  *   Step 1: Yes (Textual sources).
  *   Step 2: Depends on chronicles' dates (not specified), but likely proceed to Step 4/5.
  *   Step 4: Multiple Sources? Yes. Independent? *Probably Yes* (hostile factions). Bias? *Yes, strong bias likely in each*. → Proceed to Step 5 (Bias noted but independence present).
  *   Step 5: **SPECIAL CASE:** Sources mutually hostile? *Yes*. Detail damaging to both? *Yes*. → **Label: ATTESTED**.
  *   *EP Judgment:* Not needed on label. The procedure *forces* higher credibility here due to the "embarrassment criterion," even if you wanted to treat it as legend. You *must* grant it more credit.

  **(3) Vivid Scene: One respected specialist defends, rest regard as later invention.**
  *   Step 1: Assume Yes (Textual/Traditional source).
  *   Steps 2-6: Would run based on the evidence type, likely landing at **RECONSTRUCTED** or possibly **ATTESTED** if evidence is strong but interpretation differs.
  *   Step 7: **Crucial Step:** Do syntheses indicate significant, ongoing debate? *Yes* (One vs. the rest, framed as invention vs. tradition = significant dispute). → **Label: DISPUTED**.
  *   *EP Judgment:* **Mandatory.** The procedure flags it as **DISPUTED**. The EP must decide if the narrative value of this vivid scene outweighs the significant scholarly disagreement and potential to mislead the audience. The *procedure* says it's disputed; the *EP* decides if it stays in (heavily hedged) or comes out. **You likely lose the scene** unless the EP judges the specialist's argument, presented *as* a disputed minority view, is crucial enough *and* can be framed responsibly to the audience.

  This procedure provides clear, evidence-based labels, addresses your specific misfires, and explicitly flags where human judgment about audience confidence and narrative needs must override the mechanical output.
