prompt: |-
  You are to act as a professional philosopher of science who has also sat on engineering failure-inquiry panels. Think carefully and plan before writing; I am not asking for an exposition of the literature, and I do not want references, citations, footnotes, or a reading list of any kind. Work entirely from what you already know. The deliverable is a working tool.

  **The material to be operationalized.** Daniel Dennett's account of explanation distinguishes three strategies for predicting and explaining a system's behaviour: the physical stance (reasoning from constitution and law), the design stance (reasoning from what the thing is for and how it is supposed to work, assuming no malfunction), and the intentional stance (treating the thing as a rational agent with beliefs and goals). Alongside this sits his criterion of real patterns, on which the rough test for whether something exists is whether positing it buys a genuine compression of the data — a way of predicting and explaining that no feasible alternative account delivers as well. If no stance gets you traction on it, and its positing compresses nothing, it is a manner of speaking rather than a thing.

  **My situation.** I am the methodology lead at a national accident investigation board covering energy and heavy industry. We open roughly twenty-five serious investigations a year. Each produces a public report whose Findings section names causal and contributory factors and whose Recommendations section must attach to those findings — a recommendation with no named finding behind it gets struck out at review. Reports are used in civil litigation and occasionally in criminal proceedings, so every named entity becomes a target for discovery and for blame. Our analysts are engineers and human-factors specialists with no philosophical training; they have six to eight weeks per case; the final report is signed off by a five-member board, two of them political appointees.

  **The dispute I need settled by procedure rather than by seniority.** Our findings range across all three stances. At the physical level: fatigue cracking in a weld, a corrosion rate, a relief valve's set pressure. At the design level: a maintenance interval, a redundancy architecture, a procedure that requires only one signature. At the intentional level: what the night shift believed about a recurring alarm; what site management wanted; and group-level posits about organizations — the site's "safety culture," "production pressure from the parent company's quarterly targets," "the contractor's incentives." Senior investigators insist the last group is journalism masquerading as causation and can never yield an actionable recommendation. Others insist that reports stopping at the physical level systematically exonerate the organization that built the system. Both camps appeal to what is "really there." I need a procedure that replaces that argument with checks.

  **One complication you must confront rather than paper over.** The real-patterns criterion is framed for compression across many cases; an investigation explains a single event, retrospectively, and much of the physical evidence is often destroyed or unrecoverable. So the procedure cannot simply ask whether a posit predicts well. Tell me what you substitute — counterfactual dependence, transportability to other sites in the industry, something else — and defend the substitution as the best available reading of the criterion rather than as a replacement of it.

  **What I want, in this order:**

  1. A short preliminary analysis, before any procedure. Identify which features of the three stances and of the real-patterns criterion do genuine work in this setting, which have to be dropped or bent out of shape, and what "existence" can amount to for a report — a finding that licenses a recommendation, not a metaphysical verdict. Flag every point where the theory underdetermines the tool and you had to choose.

  2. The procedure itself: an ordered sequence of tests an analyst can run on a candidate finding. For each step, state the question, what counts as a sufficient answer, the permitted outputs, and the conditions under which the procedure terminates with "do not name this as a finding; it is shorthand." Include explicitly: a rule for determining which stance a candidate finding is being offered in, and why that is a property of the claim rather than of the analyst's preference; a rule for the case in which two stances both license the same entity but imply incompatible recommendations; a rule for cases where the physical evidence is gone and only testimony and documents remain; and a rule for an entity that passes the reality test but whose naming will predictably be read by the public and by litigants as an assignment of blame to a person or firm.

  3. Say whether the procedure can yield different answers for the same entity depending on the downstream use — technical remediation versus allocation of responsibility — and whether that divergence is a defect to be engineered out or the correct result.

  4. Mark, at each step, where the procedure hands the decision to a human because the question is one of values or responsibility rather than fact, and which steps are judgment calls dressed in procedural language. Do not hide these; the board needs to know where the tool runs out.

  5. Worked applications to three candidate findings from one investigation of a pipeline rupture: (a) hydrogen-assisted cracking in a girth weld, with the failed section partially recovered; (b) the operating site's "safety culture," which our board chair uses in almost every report; (c) "production pressure from the parent company's quarterly throughput targets," a group-level intentional posit about an entity that is not itself a party to the investigation. Run each through the steps and show the outputs. At least one of the three must come out in a way I will not like; say plainly which one and why.

  6. Close with failure modes: two or three ways this procedure will misfire in real investigations, one class of case it cannot handle at all, and what a critic who thinks the whole exercise rests on a category mistake — that existence has nothing to do with predictive or explanatory payoff — would say about the tool, together with your assessment of how much that objection should worry me.

  Write in prose with numbered steps and clear headings, not as an undifferentiated bullet list. Keep individual steps short enough to be used at a desk under time pressure, and finish with a one-page summary card that an analyst could keep beside them during a review meeting.
reasoning: |-
  Hmm, this is a complex and fascinating request. The user is a methodology lead at a national accident investigation board, dealing with real-world engineering failures and needing to operationalize philosophical concepts into practical procedures. They're clearly frustrated by internal disputes about whether organizational factors like "safety culture" should be included in reports as causal factors. 

  First, I need to unpack their core dilemma: they're stuck between investigators who reject intentional-stance explanations as "journalism" and those who insist physical-level explanations "exonerate the organization." The philosophical framework they want to use - Dennett's stances and real patterns - wasn't designed for retrospective single-event analysis with destroyed evidence. That's the key tension I must resolve.

  Looking at their six specific requests, I notice the most challenging will be: 
  - Adapting the "compression" criterion to single cases (maybe through counterfactual transportability?)
  - Handling blame assignment implications
  - Making one of the worked examples produce an "unlikable" result (probably the safety culture one)

  The user's tone suggests they've had this debate many times and need something operational, not theoretical. Their mention of litigation risks and political appointees on the board tells me the procedure must be legally defensible and politically neutral. 

  For the procedure itself, I'm considering a three-stage approach: 
  1) Classify the candidate finding into a stance based on its explanatory structure, not content
  2) Apply existence tests tailored to each stance (physical evidence for physical, functional analysis for design, pattern consistency for intentional)
  3) Add practical filters for blame assignment and evidentiary gaps

  The hydrogen cracking example should pass easily as a physical stance finding. Safety culture will be tricky - if it's just a buzzword without demonstrated counterfactual impact, it might fail. Production pressure could go either way depending on documented decisions. 

  Biggest risks I foresee: 
  - Over-reliance on testimony when physical evidence is gone
  - Cultural factors being too nebulous
  - The board rejecting "unlikable" results anyway

  I'll need to be brutally honest in the worked examples - if the chair's pet "safety culture" concept doesn't hold water in a case, the procedure must call that out. The summary card should distill everything to bulletproof checklist items.
answer: |-
  ## Operationalizing Dennett's Stances for Accident Causation Findings

  **Preliminary Analysis:**  
  Dennett’s stances provide explanatory *strategies*, not ontological tiers. In accident investigation:  
  - **Physical stance** works directly (material failures, physics).  
  - **Design stance** is essential (procedures, maintenance schedules, system architecture).  
  - **Intentional stance** is unavoidable (human decisions, organizational goals) but risks reification.  
  The **real patterns criterion** must shift: *Compression* here means the posit provides indispensable *counterfactual leverage* for intervention. If removing the factor makes the accident unlikely or mitigates its severity *in similar future systems*, it’s real. "Existence" means *causal efficacy warranting intervention*.  
  *Bends/Drops:*  
  - Prediction → Retrospective counterfactual dependence.  
  - Compression → Transportability of the explanation to prevent recurrence.  
  - Metaphysical existence → Actionable causal node.  
  *Underdetermined Choices:*  
  - Defining "feasible alternative account" (we use industry-standard investigation methods as baseline).  
  - Handling irrecoverable evidence (prioritizing documented processes/testimony consistency).  

  ---

  ### The Stance-Based Causal Reality Procedure (SBCR)

  **Step 1: Stance Classification**  
  *Question:* What is the *primary mode of explanation* for this candidate finding?  
  *Sufficient Answer:*  
    - **Physical:** Explains via material properties, laws of physics, chemistry. (e.g., "Corrosion rate exceeded X mm/year").  
    - **Design:** Explains via intended function, procedure, or specification. Assumes no malfunction. (e.g., "Calibration interval exceeded OEM recommendation").  
    - **Intentional:** Explains via attributed goals, beliefs, knowledge, or reasoning (individual or group). (e.g., "Management prioritized throughput over maintenance").  
  *Rule:* Classification hinges on *how the factor exerts causal influence*. "Safety culture" is intentional (it explains via shared attitudes/goals); "weld procedure" is design.  
  *Output:* Stance label (P/D/I). **Proceed to Step 2.**

  **Step 2: Existence Test (Stance-Specific)**  
  *Question:* Does this posit provide counterfactual leverage for prevention, transportable to similar systems?  
  *Sufficient Answer & Tests:*  
    - **Physical (P):** Is the physical state/process *demonstrated* (evidence, simulation, calculation) and its role in the causal chain *necessary*? (If evidence destroyed, use: Reliable sensor data, prior identical failures, material testing of sister components).  
    - **Design (D):** Was the design/procedure *as specified* insufficient or misapplied? Demonstrate: (a) Specification existed/known, (b) Adherence was feasible, (c) Deviation/inadequacy created a necessary vulnerability.  
    - **Intentional (I):** Is the attributed intention/goal/belief *consistent* across documented decisions, communications, and actions? Does altering *this specific goal/belief* (counterfactually) break the causal chain? Avoid vague attributions ("culture" must link to *specific decisions/omissions*).  
  *Output:*  
    - **Pass:** Factor is a "real pattern" (causally efficacious). **Proceed to Step 3.**  
    - **Fail:** Factor is shorthand/lacks causal efficacy. **Terminate: "Do not name as finding."**  
  *Judgment Call:* Assessing sufficiency of indirect evidence (I,D) or counterfactual strength (I). Human judgment required.

  **Step 3: Stance Conflict Resolution**  
  *Question:* If competing stances explain the *same outcome* but imply conflicting fixes, which stance dominates?  
  *Rule:* **Downstream Dominance.** Prioritize the stance whose remediation addresses the most *fundamental and controllable* cause:  
    1. **Design** trumps Physical if the physical failure resulted from a flawed design/specification. (Fix design, not just material).  
    2. **Intentional** trumps Design if the design flaw stemmed from an intentional decision (e.g., cost-cutting overriding safety).  
    3. **Physical** trumps Intentional *only* if the physical failure was truly unforeseeable/unpreventable by reasonable design/intent (rare).  
  *Output:* Dominant stance for this factor. The finding is labelled accordingly. **Proceed to Step 4.**

  **Step 4: Actionability & Blame Filter**  
  *Question A (Actionability):* Can a *specific, feasible recommendation* be directly derived from this finding to modify the physical state, design, or intention?  
  *Question B (Blame):* Will naming this entity *predictably and solely* trigger blame assignment (vs. systemic fix), even if actionable?  
  *Rules:*  
    - **A:** Recommendation must flow logically from the stance: P (e.g., "Use alloy X"), D (e.g., "Revise procedure Y"), I (e.g., "Change incentive Z" or "Implement training on belief W"). If no clear, feasible rec, **Terminate: "Do not name."**  
    - **B:** If naming predictably causes *disproportionate* blame assignment *undermining systemic learning* (e.g., naming an individual for a systemic I-stance failure), reframe:  
      *   Individual: Use role/job title, not name.  
      *   Organization: Focus on the *specific policy/incentive*, not the company's "culture" per se.  
      *   If reframing loses essential meaning, **Terminate: "Do not name"** and note rationale for internal use.  
  *Output:* Finding is approved for naming (possibly reframed) OR rejected. **Procedure Ends.**  
  *Judgment Call:* Assessing "predictable" blame assignment and "disproportionate" impact (Board experience required).

  ---

  **Divergence on Downstream Use:**  
  The procedure *can* yield different outputs for Technical Remediation vs. Responsibility Allocation.  
  - **Technical Remediation:** Focuses on Steps 1-3 and 4A. A flawed design (D) might be named even if caused by intentional pressure (I), as the design fix is paramount.  
  - **Responsibility Allocation:** Emphasizes Step 4B. The *intentional origin* (I) of the design flaw might be named *only* if reframable without triggering disproportionate blame hindering cooperation.  
  *This is a FEATURE, not a defect.* Investigations serve dual masters: preventing recurrence (needing systemic truths) and accountability (needing careful attribution). The procedure explicitly surfaces this tension for Board deliberation at Step 4B.

  ---

  **Worked Applications: Pipeline Rupture Case**  

  *(a) Hydrogen-assisted cracking in a girth weld (failed section partially recovered)*  
  1.  **Stance:** Physical (material degradation process).  
  2.  **Existence:** Partially recovered section + metallurgy tests on sister welds + known corrosive environment → Demonstrates mechanism & necessity. **Pass (P).**  
  3.  **Conflict:** N/A (single stance).  
  4.  **Action/Blame:** Actionable recs (e.g., "Implement H2 flux monitoring"). Naming "cracking" assigns no undue blame. **Output: NAME AS FINDING (P).**  

  *(b) Operating site's "safety culture"*  
  1.  **Stance:** Intentional (attributed group-level beliefs/priorities).  
  2.  **Existence:** *Test:* Does evidence (interviews, emails, audits, incident records) show consistent patterns of decisions *demonstrably* prioritizing other goals over safety *in ways necessary* for this accident? (e.g., chronic underreporting, deferred maintenance approvals). Vague "feeling" fails. Specifics like "tolerance for bypassing safety interlocks" may pass. *Assume ambiguous evidence.* **Judgment: Fail** (Insufficient link to *specific causal decisions* in this event; "culture" too diffuse).  
      **Output: TERMINATE - DO NOT NAME (Shorthand).** *You won't like this. "Safety culture" often lacks the specificity required for counterfactual leverage and actionable recommendations in a single event. It risks being a conclusion, not a causally precise finding.*  

  *(c) "Production pressure from parent company's quarterly throughput targets"*  
  1.  **Stance:** Intentional (attributed organizational goal).  
  2.  **Existence:** *Test:* Do board minutes, emails, KPIs, bonus structures show: (1) Explicit pressure/prioritization of throughput over maintenance? (2) Did site management *cite* this pressure in *specific relevant decisions* (e.g., delaying shutdown)? (3) Counterfactual: Would reasonable alternative targets/pressure likely have prevented the delay? *Assume strong documentary evidence.* **Pass (I).**  
  3.  **Conflict:** N/A or resolved (e.g., if pressure caused a design/procedure violation, I dominates).  
  4.  **Action/Blame:** Actionable? Yes ("Revise corporate KPIs/target-setting process"). Blame Risk? High (naming "parent company pressure" invites lawsuits). **Reframe:** "Incentive structures prioritizing throughput over planned maintenance contributed." **Output: NAME AS FINDING (I) - REFRAMED.**  

  ---

  **Failure Modes & Objections**  

  1.  **Misfires:**  
      -   **Over-Literal Stance Assignment:** An analyst might misclassify a *procedural* violation (D) as intentional (I) if done knowingly. Procedure requires focusing on *how it causes harm* (flawed process vs. motive).  
      -   **Counterfactual Overreach:** In complex systems, judging "would this change prevent it?" (Step 2) can be speculative. Mitigation: Require alignment with established industry risk models (e.g., bowtie analysis).  
      -   **Blame Filter Suppression:** Pressure to "name names" might override Step 4B, triggering litigation that buries systemic fixes.  

  2.  **Unhandled Cases:** The procedure **cannot handle genuinely novel failures** with no established physical models, design precedents, or intentional analogs. It relies on transportability to "similar systems." Novelty requires expert judgment beyond the procedure.  

  3.  **Category Mistake Objection:**  
      *Critic:* "Existence (e.g., a crack, a decision) doesn't depend on its explanatory 'payoff'! This confuses ontology with utility. A crack exists regardless of your stance. This tool risks ignoring real things that are hard to explain or privileging convenient narratives."  
      *Assessment:* This worry is **moderate but manageable**. The tool *doesn't deny* the crack's physical existence. It asks if *naming it as a causal finding* (vs. evidence) compresses/explains the *specific accident chain* sufficiently to warrant a recommendation. The critic mistakes the *finding* (a causal node) for the *entity itself*. Focus on *causal efficacy within the event* makes utility paramount *for the report's purpose*. The physical evidence (the crack) remains; its *interpretation as a primary cause* is what the procedure tests. Maintain rigorous evidence standards (Step 2P) to ground physical claims.  

  ---

  **SBCR Procedure Summary Card**  

  1.  **CLASSIFY STANCE**  
      *   **P** = Physics/Chemistry/Materials  
      *   **D** = Design/Procedure/Spec (assumes no fault)  
      *   **I** = Goals/Beliefs (Indiv. or Group)  
      *   *How does it cause harm?*  

  2.  **TEST EXISTENCE (Counterfactual Leverage)**  
      *   **P:** Evidence + Necessity? (Use proxies if destroyed)  
      *   **D:** Spec flawed/misapplied + Feasible adherence?  
      *   **I:** Consistent evidence? Altering it breaks chain?  
      *   **FAIL?** → TERMINATE (Shorthand).  
      *   **PASS?** → Proceed.  

  3.  **RESOLVE STANCE CONFLICT (IF NEEDED)**  
      *   Which stance's fix is most fundamental/controllable?  
      *   **D > P, I > D, P > I (Rare)**  
      *   Label finding with dominant stance.  

  4.  **FILTER FOR ACTION & BLAME**  
      *   **A:** Specific, feasible rec from finding? NO → TERMINATE.  
      *   **B:** Naming invites disproportionate blame hindering learning?  
          *   YES → Reframe (Role/Policy/Incentive, not Person/Culture) OR TERMINATE.  
          *   NO → NAME (Reframed if needed).  

  **KEY:** Stance is about *explanation*. Real = Causally efficacious *for prevention*. Actionable Rec is mandatory. Blame risk must be managed. Judgment needed on evidence & blame assessment.
