  Let's outline the readings. The slogan "consciousness is an illusion" can be unpacked in several ways:

  ### Reading 1: The Illusion of Introspective Access
  - **Claim**: What is illusory is not consciousness itself, but our introspective belief that we have direct, infallible access to the contents of our conscious experience. The illusion is at the level of our self-report: we think we know our experiences transparently, but in fact our reports are constructed and often mistaken. This is a claim about metacognition.
  - **Status**: Substantive and defensible (supported by psychological research on introspection and metacognition).
  - **Meant by**: Cognitive scientists and philosophers like Dennett and Frankish, but in their more moderate moments. Also, psychologists studying metacognition.
  - **Hollow avowal under it**: Untouched by the theory. The narrator is accurately reporting her experience and then denying the reality of what she reports. This is exactly the kind of introspective error the theory predicts: she feels she is having an experience but then denies it, which is a failure of metacognition. The theory does not say that there is no experience, only that our access to it is flawed.
  - **Absorbs the seeming objection**: Yes. The seeming (the experience) is real, but our beliefs about it are illusory. The illusion is about our own minds, not about the world.
  - **Phenomenal residue**: The experience itself (what it is like) remains real. Only our beliefs about it are called into question.
  - **Notes**: This reading does not threaten the passage. The narrator's report is a perfect example of the kind of introspective illusion the theory describes.

  ### Reading 2: The User-Illusion (Dennett/Frankish)
  - **Claim**: Consciousness is an evolved user-illusion. There is no "Cartesian Theater" where experiences are presented to a homunculus. What we call phenomenal consciousness is a set of judgments, expectations, and dispositions (a "user-illusion") that our brain creates to make sense of its own processing. The illusion is that there is something it is like to be us, when in fact there are only these non-phenomenal cognitive processes.
  - **Status**: Substantive and contested. Defended by illusionists like Frankish and Dennett, but heavily debated.
  - **Meant by**: Strong illusionists like Frankish and Dennett in their more radical writings.
  - **Hollow avowal under it**: Coherent but revisionist. The ordinary concept of experience (with phenomenal character) is being revised. The narrator's report would be interpreted as her making judgments and having dispositions (e.g., to report the light) and then denying that there is any phenomenal property. But the theory says there never was any phenomenal property to begin with. So she is correct in her denial, but her initial report must be reinterpreted as being about her judgments/dispositions, not about a phenomenal experience.
  - **Absorbs the seeming objection**: With difficulty. The theory redefines "seeming" as a judgment or disposition. There is no phenomenal seeming, only a cognitive one. The objection is absorbed by redefining terms.
  - **Phenomenal residue**: None. The theory denies that there is any phenomenal residue. What we call "phenomenal" is just a pattern of judgments and dispositions.
