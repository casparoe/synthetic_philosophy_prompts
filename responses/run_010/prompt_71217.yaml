  ### Reading 3: Eliminative Illusionism (No Seemings at All)
  - **Claim**: There are no seemings, no phenomenal experiences at all, not even as judgments or dispositions. The illusion is that there is any subjective aspect to our mental life. This view might be seen as a more radical form of illusionism that borders on eliminativism.
  - **Status**: False or self-undermining. If there are no seemings, then the illusion of consciousness cannot appear to anyone. This leads to the "illusion must appear" objection in a strong form.
  - **Meant by**: Almost no one explicitly, but sometimes attributed to the most extreme readings of illusionism or eliminative materialism.
  - **Hollow avowal under it**: Incoherent. The narrator is reporting a seeming (the light) and then denying it. But if there are no seemings, then she cannot even have the seeming to report. So the report itself is impossible.
  - **Absorbs the seeming objection**: No. It collapses under the objection. If there is an illusion, it must seem some way, but this view denies seemings entirely.
