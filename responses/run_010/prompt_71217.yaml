  ### Reading 4: The Hard Problem Dissolved (Dennett-style)
  - **Claim**: The illusion is that there is a "hard problem" of consciousness. The feeling that there is an explanatory gap between physical processes and subjective experience is an illusion. Once we fully understand the brain, we will see that there is no gap. However, subjective experience (what it is like) is real but not mysterious.
  - **Status**: Substantive and contested (Dennett's view).
  - **Meant by**: Dennett and like-minded philosophers.
  - **Hollow avowal under it**: Untouched by the theory. The theory is about the philosophical problem, not about the reality of experience. The narrator is reporting and then denying her experience, which might be odd but is not addressed by this theory.
  - **Absorbs the seeming objection**: Yes. Experience is real and not denied.
  - **Phenomenal residue**: Full phenomenality remains.
  - **Notes**: This reading does not support cutting the passage.

  ### Reading 5: Phenomenal Properties as Misrepresentations (Representationalism Gone Wrong)
