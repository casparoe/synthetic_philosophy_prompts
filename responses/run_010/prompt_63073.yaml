prompt: |-
  Ok so I'm in a philosophy of mind seminar and this week is pain and its badness, and I think I finally get why pain asymbolia is supposed to be such a big deal, but I want to sanity check my reading of it before I say it out loud in class on Thursday.

  Here's what I took away: people with pain asymbola still feel the pain completely normally — the sensation, where it is, the sharp-and-burning quality — they just don't mind it. They still yank their hand off the hotplate and wince and guard the sore bit like anyone else, and afterwards they'll say yeah that was pain, it just didn't bother me. So the raw feel is intact and the only thing that's switched off is the caring about it.

  Which is why I keep landing on the conclusion that this basically settles the debate about why pain is bad. If you can have the full felt quality of pain with the badness turned off, then the badness obviously isn't in the feeling — it's in a separate judgment or desire that's about the feeling. So anyone who says pain is bad in virtue of how it feels is wrong, and the negative hedonist has to reverse themselves and admit pain is bad because we dislike it rather than disliked because it's bad. And it would also mean unpleasantness is more like an opinion you hold about a sensation than anything internal to the sensation. Right?

  Something tells me I'm sanding down a wrinkle and I can't find it, and I have a sneaking suspicion that the "they still yank their hand off" part is load bearing in a way I'm not appreciating.

  Could you walk me thru it? Please use these sections, in this order:

  - **The bottom line** — 3 or 4 sentences, just tell me straight whether my inference holds
  - **Where my description of the condition is off** — 200-250 words, and be specific about which bits don't survive contact with the actual cases
  - **What the cases can and can't show** — 250-300 words, including why the story about where the damage is matters for how much weight the examples can bear
  - **So does this sink negative hedonism about pain?** — 250-300 words, best version of each side, don't fudge it
  - **What I should actually say in seminar** — around 100 words, plain speech I can say out loud without sounding like I'm reading a paper
