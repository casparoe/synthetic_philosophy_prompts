prompt: |-
  I'm in the second year of a philosophy PhD and need to submit a 1,200-word project outline for my department's dissertation review next month, along with a ten-minute presentation of it. My topic is the ethics of infinite populations, and my half-formed idea is that the literature has quietly slid between two different kinds of infinity: an infinite temporal horizon, where the moments come pre-ordered by time, and an infinite population at a single time, where no ordering of the individuals is privileged. Devices invented for the first setting then get carried into the second without anyone noticing that they have lost their justification. Consider the overtaking-style rules that compare infinite welfare profiles by looking at finite initial segments and taking a limit, or by comparing two profiles whenever one is eventually always better than the other: these presuppose an enumeration, and in the temporal case the enumeration is handed to us by the arrow of time, whereas for a population spread out in space any enumeration is an arbitrary choice, so a rule whose verdict changes when we relist the same individuals is either incomplete or covertly indexical. My working hypothesis is that a strict index-invariance requirement — the comparison of two infinite populations must not depend on how their members are listed — forces us to give up full comparability and settle for a partial ordering on which two profiles are comparable only where they differ at finitely many positions. What I most want to test is the decision-theoretic payoff: does restricting attention to finite differences actually dissolve the familiar paralysis whereby, in an already infinite universe, no finite improvement to anyone's welfare can be shown to make things better on the whole, or does it merely relocate that paralysis from global choices to the local, finitely scoped choices an agent actually faces?

  Turn this into the outline itself. I need a crisp statement of the central question, phrased so that it has determinate possible answers rather than reading as a plea for further work; a short account of why the standard moves — extending the finite aggregation rule by some limiting device, dropping anonymity, weakening the Pareto requirement, or simply accepting the non-constructive orderings that anonymity together with Pareto is said to require on infinite domains — leave my question open instead of answering it; the method, laid out across the four semesters I realistically have, saying what I would define, prove, or construct in each and in what order, including where I expect to need formal results and where the work is conceptual; the space of possible results, including the ones that would be disappointing but still worth having; and an explicit statement of what would count as failure, since my committee will want to see that I know in advance what would make me abandon the project. I'd also like a candid paragraph on scope: which components are safe for a dissertation and which are the sort of thing that consumes five years and produces nothing, and what the cheapest defensible fallback version of the project is if the index-invariance requirement turns out to be either trivially satisfiable or trivially unsatisfiable.

  Two constraints on how you write it. First, I will supply all the references myself, so please include no bibliography, no literature review keyed to citations, and no invented titles or attributions; naming positions, principles, and arguments and describing results is fine, attributing them to particular papers is not. Second, wherever my sketch leans on a technical claim that is not obviously true — that anonymity plus Pareto really does require non-constructive methods on infinite domains, that the overtaking criterion really is enumeration-dependent in the way I've described, that a finite-difference comparability rule really yields a partial ordering closed under the operations I'd need — flag it explicitly as something I must verify, and say what would have to be true of that claim for my argument to go through if it fails. Keep the whole thing in the register of a proposal rather than a paper: the committee should come away seeing a plan for work not yet done, with a case for why the work is worth doing and why it can be done in the time I have.
