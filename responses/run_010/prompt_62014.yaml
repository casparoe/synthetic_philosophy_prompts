prompt: |-
  I'm writing a novel about a family where one sibling makes it big and the others don't, and I've realised I keep making quiet judgment calls about which of my characters the reader should admire and which should get cut down to size. I know there's names for this stuff — the American Dream on one side, Jantelagen and tall poppies on the other — but I don't want the labels, I want the principle underneath my own verdicts. Here they are, mostly arrived at by feel:

  - The kid who grows up in a rusted-out town, works two jobs, gets out, becomes a surgeon: admire, fully, no asterisks.
  - That same surgeon twenty years on, who can't stop mentioning where he came from at every dinner party: something curdles. I don't want the reader admiring him anymore, but I dont want them despising him either.
  - A woman who inherited the business and is genuinely better at running it than her father was: I want her admired, but the admiration comes out thin, like it doesn't land in the chest.
  - The guy who worked exactly as hard as the surgeon and got cancer instead: I want the reader to feel something closer to anger on his behalf than pity.
  - A neighbour who resents the surgeon and says so loudly at the hardware store: contemptible.
  - A neighbour who resents the surgeon, says nothing, and quietly stops inviting him over: I want the reader to understand him almost from the inside.
  - The surgeon's brother, who sabotages him a little out of that resentment: awful, and the most alive person in the book.

  Is there a principal that gets all seven, or most of them? My guess is something about who did what with what they were handed — but that has to be wrong, because it demotes the woman who inherited the business, and I don't actually want to demote her. So state the principle as precisely as you can, tell me which clause each verdict is doing work for, and then tell me what it predicts about a case I haven't listed: a teenager from a rich family who's extremely good at something and has visibly worked at it. And if it can't hold all seven at once, say which verdict I should throw out and why — I'd rather lose one than build a principle with seven epicycles on it.

  Lead with your bottom line in the first sentence and then give me the reasoning. No preamble, no restating my question back at me. Also be straight with me about how confident you are in the principle you land on, and single out the part of it you're least sure of.
reasoning: |-
  Okay, the user is writing a novel about family dynamics where one sibling succeeds while others don't, and they're struggling with implicit judgments in their character portrayals. They've listed seven specific verdicts they want readers to feel about different characters, from admiration to contempt to understanding. 

  Hmm, they're clearly a thoughtful writer - they recognize their own biases ("quiet judgment calls") and want to uncover the unifying principle beneath their instincts. Interesting that they reject simplistic labels like "American Dream" or "Jantelagen" in favor of something more fundamental. The examples show nuanced emotional gradients: admiration that curdles over time, thin admiration for competent inheritors, anger rather than pity for the unlucky. 

  Their proposed "who did what with what they were handed" principle almost works but fails on the businesswoman case - and they rightly resist downgrading her. The surgeon's journey is key here: initial hustle admirable, later humblebragging less so. The neighbor who quietly withdraws gets reader empathy while the loud one gets contempt. 

  Ah! The common thread seems to be about how characters relate to life's unfairness. Do they: 
  - Transcend it through action (young surgeon) 
  - Weaponize it (humblebragger) 
  - Master inherited advantages (businesswoman, thin admiration because no transcendence) 
  - Suffer it unjustly (cancer victim - anger not pity) 
  - Resent it toxically (loud neighbor - contempt) 
  - Process it privately (quiet neighbor - understanding) 
  - Act out resentment (brother - awful but alive) 

  For the rich talented teen: if they acknowledge their privilege while working hard, they'd earn respect but not the visceral admiration of the self-made surgeon. That feels consistent. 

  Least confident about the businesswoman case - why is her admiration "thin"? Maybe because inherited success lacks the primal satisfaction of overcoming. But that's precisely what makes her interesting - she challenges the principle. Should note that tension. 

  User's clearly sharp - they'll spot any fuzziness. Need to state it bluntly: the principle is about characters' orientation to systemic unfairness, not just individual merit. Their examples all test different facets of this. 

  Final check: does "unearned suffering versus unearned grace" cover the brother's sabotage? Yes - his actions make systemic resentment visceral. And the teen prediction follows naturally: privilege acknowledged minimizes reader backlash. 

  Nodding to myself. This holds. The one case that slightly strains is the businesswoman, but that's because inherited advantage inherently complicates the "earnedness" scale - which is why the user feels the thinness. Actually strengthens the principle by exposing its boundary.
answer: |-
  **Core principle: Characters earn narrative approval based on how they *orient themselves* to life's inherent unfairness—specifically, whether they transcend, master, resent, or weaponize the unearned advantages or disadvantages they receive.**

  **Confidence:** High (90%). **Least Sure Part:** The "thin admiration" for the inherited-businesswoman case—it's the most subtle and context-dependent verdict.

  Here's how each verdict aligns with the principle:

  1.  **The young surgeon:** *Admire (Full)*. **Why:** Actively *transcends* significant unearned disadvantage (rust-belt origin) through effort and merit. Action against unfairness.
  2.  **The humblebragging surgeon:** *Curdled admiration*. **Why:** Weaponizes his *past* disadvantage (unearned hardship) for present social gain, undermining his earned merit. Exploits unfairness for status.
  3.  **The competent inheritor:** *Thin admiration*. **Why:** *Masters* her unearned advantage (inheritance) competently and improves it. Earns merit *within* her context, but lacks the transcendence of overcoming disadvantage. The admiration is thin because it addresses *only* the mastery of the advantage, not the overcoming of unfairness itself.
  4.  **The unlucky worker:** *Anger, not pity*. **Why:** Suffers profound unearned disadvantage (cancer) *despite* effort equivalent to the admired surgeon. Highlights the *brutal randomness* of unfairness, demanding reader anger at the system/cosmic injustice, not condescending pity for the individual.
  5.  **Loudly resentful neighbour:** *Contemptible*. **Why:** *Resents* another's success (earned merit + unearned luck) purely as an external target for blame. Passively weaponizes perceived unfairness *against others* without meaningful action. Toxic resentment.
  6.  **Quietly resentful neighbour:** *Deep understanding*. **Why:** *Resents* internally but processes it privately (withdrawal). Demonstrates a relatable, non-toxic *internalization* of perceived unfairness. Action is restrained, focusing on self-preservation.
  7.  **Sabotaging brother:** *Awful but alive*. **Why:** *Weaponizes* his resentment and sense of unfairness *actively* against the successful sibling. Takes destructive action based on perceived injustice, making him dynamic (alive) but morally reprehensible (awful).

  **Prediction for the Rich, Talented Teenager:**

  *   **Scenario:** Teenager from a rich family, extremely good at something, visibly worked hard.
  *   **Predicted Reader Response:** **Respect for effort/skill, but guarded/cool admiration, potentially tinged with skepticism.** The admiration will be less visceral and more conditional than for the young surgeon.
  *   **Why:** They *master* their significant unearned advantage (wealth/privilege) through visible effort and merit. This earns respect. However, the principle dictates that reader *full warmth/admiration* requires transcending disadvantage. Mastering an advantage, while commendable, doesn't generate the same emotional resonance as overcoming one. The reader might question how much the advantage facilitated the success ("Would they be this good without the resources?"), leading to a cooler, more analytical appreciation. **The key factor influencing intensity/direction:** How consciously the teen acknowledges or grapples with their privilege. Denial increases skepticism; acknowledgment and responsible use might slightly warm the respect.

  **If You Must Lose One Verdict:**

  *   **Lose #3 (Thin admiration for the businesswoman).** It's the verdict most reliant on subtle authorial tone and context to convey the "thinness." The principle clearly explains *why* the admiration might be thinner (lack of transcendence), but whether it truly *lands* as "thin" for the reader is harder to guarantee purely through character action/orientation compared to the stronger, more visceral reactions (admiration, anger, contempt, understanding, awful/alive) provoked by the others. It's the verdict most susceptible to reader interpretation based on personal views of inheritance.
