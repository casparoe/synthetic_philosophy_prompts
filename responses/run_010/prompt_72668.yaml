answer: |-
  To the Allocation Committee:  

  I recommend we adopt the Kalai-Smorodinsky (KS) rule this cycle, but subject to explicit restrictions ensuring that ideal points and breakdown positions reflect only credible, institute-aligned opportunities and fallbacks. Specifically:  
  - **Ideal points** must be grounded in projects with secured data rights, funding, and feasibility within 150% of our total capacity.  
  - **Breakdown positions** must exclude resources funded or operated outside the institute’s joint governance (e.g., the hospital’s clinical cloud).  

  Under these constraints, preliminary arithmetic suggests a near-equal split (∼52% hospital, ∼48% genomics), diverging sharply from the skewed outcomes produced by unvetted submissions. I’ll explain why this middle path best addresses our twin complications, though I acknowledge forceful counterarguments for both stricter and more lenient approaches.  

  **On Ideal Points**: The genomics center’s population-scale project (4× our capacity, unfunded) and the hospital’s defunded workload both claim maximal utilities that are, charitably, speculative. If entered raw into the KS formula, these ideals would distort the division: genomics’ overclaim pulls the solution toward them (∼55–60% share), as KS scales shares to the ratio of achievable gains. Your point that KS "gives up independence of irrelevant alternatives" (IIA) is trenchant—Nash bargaining would ignore these fantasies, anchoring solely to credible threats and feasible options. I agree this is a vulnerability. Yet Nash has its own flaw: if one partner’s *genuine* opportunities expand (e.g., genomics secures new data rights), Nash could allocate them *less* surplus than before, punishing progress. KS avoids this by weighting gains proportionally to potential. Our compromise? Accept KS’s linkage to ideals but bind them to reality. Projects lacking approvals, funding, or scalable scope (beyond a 1.5× buffer for optimism) cannot define "maximum gain." This year, both submissions fail the test.  

  **On Breakdown Positions**: The hospital’s cloud contract (60% throughput at 3× cost) creates an asymmetric floor: genomics stalls entirely; hospital maintains partial function. Using these raw breakdowns, KS allocates the hospital ∼65–70% of surplus—rewarding its costly fallback. But the cloud was bought with clinical funds, not joint resources, and its inefficiency contradicts our institute’s purpose: affordable, shared computation. Counting it arguably penalizes genomics for lacking external capital and inflates the hospital’s perceived sacrifice. Some might argue the cloud *should* factor in—after all, it exists, and the hospital’s resilience *is* leverage. Yet if we tolerate such leverage, we incentivize partners to hoard external options, undermining collective efficiency. Hence, our restriction: breakdowns should reflect only what each partner loses *from institute collapse*, excluding outside assets. Without the cloud, both breakdowns converge near zero, neutralizing this asymmetry.  

  **The Alternatives**: Abandoning the rule returns us to haggling, which wastes time and amplifies power imbalances. Adopting KS unrestrained invites gaming, as we’ve seen. Our middle path imposes just enough discipline to harness KS’s equity—equal proportional sacrifice—while defanging distortions. It concedes that no rule is perfectly stable but insists that ideals and threats must be tethered to our shared mission. Enforcing this will require committee scrutiny, but it beats unprincipled bargaining.  

  We vote in two weeks. I welcome your critique.  

  —  
  P.S. For transparency: Under raw inputs, genomics’ inflated ideal might net them ∼55%; the hospital’s cloud advantage might push them to ∼70%. Under our restrictions, with credible ideals (e.g., genomics: feasible screening pilots; hospital: active funded workloads) and symmetric breakdowns (no cloud), the split nears parity. The genomics center’s constrained ambition and the hospital’s forfeited cloud advantage do the redistributive work.
