  ### Decision Tree for DNA as a "Code"  
  *Framed around the axis: **Reader-dependence (current use) vs. Writer-history (evolutionary origin)***  

  **Start**: You accept writing "the genetic code" in a paper.  

  1. **Mitochondrial code test**:  
     - In mitochondria, UGA codes for tryptophan; in the nuclear genome, UGA is a stop codon. If you insert a mitochondrial gene into the nuclear genome, does UGA **still mean tryptophan**?  
       - **YES (writer-history)** → Go to 2.  
       - **NO (reader-dependence)** → Go to 3.  

  ---

  #### Branch A: Writer-History Focus (Answers "YES" above)  
  2. **Lab-engineered organism test**:  
     - Scientists reassign codon TAG from "stop" to an unnatural amino acid (e.g., biphenylalanine) by adding synthetic tRNA/synthetase. Is this **still a "code"**?  
       - **YES (convention is malleable)** → Go to 4.  
       - **NO (requires natural history)** → Go to 5.  

     4. **Virus test**:  
        - A virus’s genome is translated by a host’s ribosomes (e.g., human virus in a dog cell). Is the virus’s DNA **still a code**?  
          - **YES (convention transcends individual "writers")** → **Conventional-sign view**.  
          - **NO (requires co-evolved writer/reader)** → *Empty cell* (incoherent: history can’t specify "ownership" without reader).  
       - *Leaf: **Conventional-sign view***  
         - Code status depends on **arbitrary conventions** fixed by history (natural or artificial), maintained by current users.  
         - *Your axis debt*: Primarily **writer-history**, but conventions must be adopted by readers.  

     5. **Ancient script test**:  
        - A gene from an extinct species (e.g., Neanderthal) is "decoded" using modern knowledge. Is it **still a code**?  
          - **YES (history alone suffices)** → **Teleosemantic view**.  
          - **NO (requires original function in ancestral system)** → *Empty cell* (unattractive: rejects all "fossil codes").  
       - *Leaf: **Teleosemantic view***  
         - Code status requires **natural selection shaping the mapping** for a biological function.  
         - *Your axis debt*: Entirely **writer-history** (selection fixes the mapping; readers inherit it).  

  ---

  #### Branch B: Reader-Dependence Focus (Answers "NO" at 1)  
  3. **Riboswitch test**:  
     - An RNA strand folds into a shape that binds a metabolite (e.g., adenine), regulating transcription—no translation involved. Is this RNA **a "code"**?  
       - **YES (any structured signal counts)** → Go to 6.  
       - **NO (requires codon-to-amino-acid mapping)** → Go to 7.  

     6. **Junk DNA test**:  
        - A long, transcribed DNA stretch has no detectable function (e.g., silenced retrotransposon). Is it **still a "code"**?  
          - **YES (if read, it’s coded)** → **Flat-out deflationism**.  
          - **NO (requires causal impact)** → **Causal/difference-making view**.  
       - *Leaf 1: **Flat-out deflationism***  
         - "Code" is a **metaphor for any pattern we interpret**, even without function or history.  
         - *Your axis debt*: **Reader-dependence** (only current interpretation matters).  
       - *Leaf 2: **Causal/difference-making view***  
         - Code status requires **current causal role** in the system (e.g., protein synthesis, regulation).  
         - *Your axis debt*: **Reader-dependence** (what the reader *does* with the signal defines the code).  

     7. **Engineered organism test**:  
        - Scientists assign codon TAG to biphenylalanine in lab E. coli. Is this **still a "code"**?  
          - **YES (reader’s current rules apply)** → **Causal/difference-making view** (as above).  
          - **NO (requires natural mapping)** → *Empty cell* (incoherent: rejects reader-dependence if mapping is artificial).  

  ---

  ### Empty Cells & Why  
  - **Writer-history + No causal role**:  
    Incoherent. If history alone defines the code, but it has no current function (e.g., junk DNA), the "code" label is vestigial—contradicts the purpose of codes (to *do* something).  
  - **Reader-dependence + Fixed history**:  
    Unattractive. If current readers define the code (e.g., mitochondrial gene read as "stop" in nucleus), insisting on original history (tryptophan) ignores the active system.  
  - **Co-evolved writer/reader exclusivity** (e.g., virus test "NO"):  
    Unworkable. Viruses, horizontal gene transfer, and symbiosis blur "ownership"—no clear position defends this.  

  ### Indistinguishable Leaves  
  - **Causal/difference-making view** (from 6→NO or 7→YES) and **Conventional-sign view** (from 4→YES) *both* accept engineered organisms as codes. The tree separates them via the mitochondrial test (history vs. reader), but if you prioritize current causality *and* accept conventions, the boundary blurs.  

  ---

  ### My Verdict: Who Won Dinner?  
  **Leaf chosen: Causal/difference-making view** (reached via 1→NO → 3→NO → 7→YES).  
  - **Your axis debt**: **Reader-dependence**. The mapping is a code iff it makes a difference in the *current* system (e.g., a codon causes amino acid incorporation; a riboswitch triggers regulation). History explains *how* the mapping arose, but the code is realized by what readers *do* now.  
  - **Why this wins**:  
    - Handles edge cases cleanly:  
      - Mitochondrial gene in nucleus? UGA is "stop" (reader’s rules apply).  
      - Engineered organism? TAG is biphenylalanine (reader’s machinery enforces it).  
      - Junk DNA? Not a code (no causal role).  
      - Ancient script? Not a *biological* code (no current reader/function).  
    - Avoids teleosemantic pitfalls (e.g., lab codes "don’t count") and deflationism’s overreach ("everything is a code").  
  - **Who won**: **You won dinner** if you argued for reader-dependence. Your friend (history-focused) must explain why a gene’s meaning doesn’t change when the reader does—e.g., mitochondrial UGA *must* mean tryptophan even in a nuclear context (teleosemantics), which is biologically unrealistic.  

  **Final note**: Biology uses codes *because* readers (ribosomes, RNA polymerases, etc.) enact mappings in real time. History sets the stage, but the play only exists when performed.
