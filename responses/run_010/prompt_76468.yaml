answer: |-
  Here’s your Q&A prep sheet, structured for damage control in this specific room. Objections are ranked by potential damage, grouped by speaker type, with replies and strategic notes.

  ---

  ### **Top-Tier Objections (High Damage Potential)**
  #### **1. Computational Scientist (Cosmology Modeller)**  
  *Objection:* "You treat resolution like a binary switch, but in practice, adaptive mesh refinement or subgrid parameterizations can *dynamically* allocate detail to welfare-relevant regions. If your simulators care about consciousness, why wouldn’t they refine around sentient clusters? Your ‘aggregate variable’ claim assumes they’re dumb emulators, not goal-directed simulators."  
  *Reply (90s):* "Adaptive refinement is computationally expensive in *state-space*, not just physically. Tracking a trillion conscious entities with neural granularity requires explicit high-resolution tagging, not just fluid dynamics. Parameterizations work for bulk properties (e.g., galaxy formation), not individualized subjective states. If consciousness is emergent from fine-grained dynamics, you can’t parameterize it cheaply. Instrumental runs optimize for the *question asked*—not unbounded sentient detail."  
  *Soft Spot:* Assumes consciousness *requires* fine-grained modeling. If a modeller argues coarse-grained systems can still host welfare, this collapses. Commit: Welfare is substrate-dependent.  

  #### **2. Formal Epistemologist**  
  *Objection:* "Your ‘discount survives mixture’ relies on a gerrymandered reference class. If posthumans truncate sims, why assume *we’re* in a sim they’d truncate? Typicality says we should expect to be in a *long* sim if most sim-runtime is long—even if most *sims* are short. Your argument cherry-picks the reference class to avoid this."  
  *Reply (90s):* "The reference class isn’t ‘simulated moments’ but *simulation runs*. Instrumental runs dominate by count (cheap/short/coarse), not duration. A long sim has higher runtime but is exponentially rarer due to cost. Measure over runs favors short/coarse. We’re more likely sampled from a vast set of short runs than a tiny set of long ones."  
  *Soft Spot:* If cost doesn’t scale steeply with duration/resolution, the rarity claim fails. Commit: Simulator resources are finite and aggressively optimized.  

  #### **3. Climate Modeller**  
  *Objection:* "You conflate termination with irrelevance. We spin down climate models when the policy question is answered, but the *simulated world* continues evolving—we just don’t track it. Your ‘truncation’ means deleting active processes? That’s bad practice. Why wouldn’t simulators archive or low-res sustain runs?"  
  *Reply (90s):* "Sustaining a run at low-res might preserve physics, but not necessarily consciousness. If fidelity drops below the threshold for individual welfare (e.g., aggregating brains into statistical blobs), the ‘persons’ vanish. Archiving is possible, but instrumentally motivated simulators won’t pay storage/energy costs for astronomically many coarse runs. They’d terminate and reinitialize."  
  *Soft Spot:* If low-res sustain preserves welfare, truncation isn’t inevitable. Commit: Consciousness requires high-resolution persistence.  

  ---

  ### **Mid-Tier Objections (Moderate Damage)**
  #### **4. Formal Epistemologist (Credence Mixture)**  
  *Objection:* "Even granting your sim discount, mixing it with unsimulated credence doesn’t kill fanaticism. If unsimulated futures dominate expected value, the fanatic’s lever remains. You need the *conditional* sim probability high *and* the discount deep—but Bostrom’s argument doesn’t give you precise probabilities."  
  *Reply (90s):* "The key is that *posthuman civilizations* capable of sims are precisely those incentivized to truncate. If unsimulated futures exist, they’re generated by agents who *would* run sims—and thus truncate their own ‘real’ future if it threatened resources. The discount applies to the only agents who could create astronomical value."  
  *Soft Spot:* Assumes posthuman agents universally prioritize resource conservation over fanatical projects. A critic could argue for altruistic posthumans.  

  #### **5. Philosopher of Mind (Unfalsifiability Variant)**  
  *Objection:* "Your fidelity threshold for consciousness is arbitrary. If simulators can’t validate subjective states (which they can’t), your ‘aggregate variable’ claim is just storytelling. This is unfalsifiable speculation dressed as technical intuition."  
  *Reply (90s):* "It’s not about validation; it’s about computational irreducibility. If simulating a brain requires emulating its microphysics (per computational functionalism), coarse-graining destroys the substrate. You can’t have ‘half a consciousness’ in a parameterization—it’s an emergent property of fine-grained dynamics."  
  *Soft Spot:* Functionalists may argue coarse models can still realize consciousness.  

  ---

  ### **Concessions to Make Early**  
  - **Concede:** "The simulation argument doesn’t yield precise likelihoods. My claim is conditional: *if* we take it seriously enough to assign non-zero credence, here are the consequences."  
  - **Concede:** "Typicality assumptions are contestable. I use ‘typical’ only in the sense of ‘instrumentally optimal for bounded goals’."  
  - **Refuse to Concede:** Instrumentality implies truncation/coarsening. If sims aren’t optimized for cost, the thesis fails.  

  ---

  ### **Objection Grouping**  
  - **Same Core:** Objections 1 (adaptive refinement) and 5 (consciousness threshold) both challenge whether coarse sims erase welfare. Use Reply 1’s computational cost argument for both.  
  - **Same Core:** Objections 2 (reference class) and 4 (credence mixture) both dispute the measure over futures. Use Reply 2’s "runs over runtime" point.  

  ---

  ### **The Reply That Must Land**  
  **"Instrumentality necessitates truncation/coarsening."** If the room accepts that simulators optimize for cost—and that consciousness/resolution is expensive—the thesis holds. Hammer: "Purpose-bound simulations don’t pay for unused runtime or fidelity. Fanaticism requires the opposite."  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"Why assume posthuman simulators aren’t *themselves* fanatics? If they value the far future, wouldn’t they run long, high-fidelity sims to practice stewardship—making sims *more* likely to contain vast futures?"**  

  - **Least-Bad Answer:** "Fanaticism is self-undermining under resource constraints. If posthumans value real futures over simulated ones, they’d prioritize real resource conservation—which means terminating sims. If they value sims equally, the cost of high-fidelity long runs limits their number, so measure still favors short/coarse runs."  
  - **Cost to Thesis:** High. Forces you to assume fanaticism is evolutionarily unstable or that sims are inherently lower value. Loses 30% of the argument’s bite by conceding fanatic simulators might exist.  

  ---

  **Final Triage**: Focus on defending instrumental truncation (Objections 1, 3) and the reference-class gambit (Objection 2). If those hold, the thesis survives. Let mid-tier objections slide with concise replies; concede where harmless. The worst threat is the unasked question—if raised, pivot to resource constraints immediately.
