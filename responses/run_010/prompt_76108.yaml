answer: |-
  Here’s the complete exam package addressing your requirements, with the case sharpened for clarity and the marking scheme focused on critical pitfalls:

  ### (1) Essay Question (295 words)
  > **Case:** In a provincial land registry, applicants present registering officers with a customary gift (traditionally cloth, now cash in an envelope) *before* opening a file. The officers’ professional code mandates accepting these gifts; refusal is considered an insult to the applicant’s household. All gifts are logged in a public register (displayed physically and online), including amounts, dates, and names of giver/receiver. The gift buys no advantage: statutory fees are fixed, criteria transparent, files processed in order of lodgement. An audit confirmed no differences in decisions or waiting times between givers and non-givers. However, non-givers are socially sanctioned—denied credit, excluded from community events, and seen as violating reciprocal obligations—despite receiving identical bureaucratic treatment.  
  >  
  > A reformer is assigned to the office. She refuses all gifts and publishes these refusals. Her technical decisions are flawless. Within two years, colleagues withhold crucial information, applicants conceal disputes, and a clerk refuses to report fraud—arguing neither has "claim" on the other. Locals deem her the registry’s "most dangerous officer."  
  >  
  > **Question (25 marks):**  
  > Is the gift-taking corrupt? Is the refusal corrupt? Defend *one* coherent account of corruption that yields a determinate verdict for *both* practices, or argue that no single account can. What does your conclusion imply for anti-corruption strategies?  

  ---

  ### (2) Model Answer (795 words)  
  The gift-taking is not corrupt, while the refusal is functionally corrupt—not by conventional bribery standards, but by severing the accountability ties essential to governance. Corruption here must be defined as *the dissolution of an office’s purpose through compromised accountability*, whether by private gain *or* isolation from communal oversight.  

  Transparency International’s "abuse of entrusted power for private gain" fails because the gifts are public, gain is neither private (integrated into professional norms) nor abusive (audits show neutrality). Equally, anthropological gift/bribe distinctions collapse: the transfer purchases no specific favor, yet refusal triggers exclusion. The reformer’s salary differs fundamentally—it is impersonal, state-administered compensation, not a web of mutual obligation binding her to the community.  

  The office’s purpose is not merely bureaucratic processing but maintaining a *legible and trusted* land system. The gifts sustain this by creating horizontal accountability: the public register embeds officers in reciprocal social debt. Applicants trust the system because officers are "claimable"—their decisions can be challenged through social channels, and clerks voluntarily report fraud because reciprocity demands it. The gift is not payment for service but an invitation into mutual responsibility.  

  The reformer’s refusal, while technically impartial, destroys this ecosystem. By rejecting gifts, she rejects the bonds enabling communal oversight. Colleagues and applicants no longer share vital information because she exists outside the reciprocity framework—she owes nothing, so cannot be held accountable. Her isolation makes her "dangerous" not because she is dishonest, but because her integrity is sterile: she cannot access the informal knowledge (disputes, fraud) necessary for effective governance. Her office’s purpose—trustworthy land registration—is undermined not by venality but by inaccessibility.  

  No single traditional account condemns one practice without excusing the other. If corruption requires secrecy, both are public. If it requires private gain, the gifts are logged and neutral; the refuser’s "gain" is her salary. If cultural legitimacy defines corruption, gift-taking is valid but the refuser (from the same culture) calls it corrupt. The case demands we prioritize *functional* corruption: practices that render an office inoperable.  

  This implies that anti-corruption cannot fetishize impartiality or transparency alone. The reformer’s approach—importing external "clean" standards—ignored how local accountability functioned. Effective reform would require rebuilding vertical (state-citizen) accountability to replace the horizontal (community-officer) ties she severed—e.g., formal whistleblower channels or participatory oversight. Otherwise, eliminating "corrupt" practices can dismantle the social infrastructure enabling governance, leaving institutions technically pure but practically inert. Corruption, then, is contextually tethered to an office’s embedded purpose.  

  ---

  ### (3) Marking Scheme (25 marks total)  
  **Must-hit points (A-grade moves):**  
  1. **Rejects secrecy/gain as necessary criteria** (5 marks)  
     *Failure:* Argues gifts are corrupt because "bribes are secret" (ignoring public register) or claims gifts are "private gain" without distinguishing from salary.  
  2. **Defines office purpose & corruption as functional failure** (7 marks)  
     *Failure:* Never states the registry’s core purpose (trusted land system via embedded accountability); treats corruption as only moral/legal deviation.  
  3. **Explains reciprocity = accountability** (5 marks)  
     *Failure:* Calls gifts "bribes" without addressing how they enable fraud reporting/information flow; or labels refusal "ethical" without seeing its isolation effect.  
  4. **Handles accountability inversion** (5 marks)  
     *Failure:* Claims both practices are corrupt/clean without addressing the paradox: gift-takers are reachable/effective but "venal," refuser is clean but inert/dangerous.  
  5. **Draws non-obvious anti-corruption implication** (3 marks)  
     *Failure:* Suggests "better training" or "stricter laws" without noting reform must replace severed accountability networks.  

  ---

  ### Design Rationale  
  - **Trap Avoidance:** The marking scheme explicitly penalizes your predicted failure modes (secrecy fixation, salary/gift conflation, cultural relativism, transparency overreach).  
  - **Accountability Inversion:** The top marks (points 3 & 4) require recognizing that gifts create social leverage *enabling* governance, while refusal destroys it.  
  - **No Taxonomy Crutches:** Naming "speed money" or Mauss’ gift theory earns *zero* marks unless applied to show *why* this case resists categorization (e.g., "nothing sped up, no access bought").  
  - **A vs B Separation:** An A paper hits all 5 points; a B paper misses #2 or #4 (e.g., "gifts are corrupt because they’re extra-legal" but never defines office purpose). A C paper botches #1 or #3 (e.g., "gifts are bribes because cash changes hands").  
  - **Argument Focus:** Model answer avoids survey-style writing—it’s a single thesis demonstrating how to wield concepts functionally.  

  This tests the core insight: corruption isn’t a freestanding act but a rupture in an office’s ecosystem of accountability. Students must see that both practices invert intuitions about integrity and venality.
