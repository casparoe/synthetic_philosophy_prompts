prompt: |-
  A journal has invited me to contribute a statement of my position to a symposium on the metaphysics of psychiatric classification. One of my co-symposiasts has read my earlier work closely and intends to argue, in her response, that the position is unstable — that I cannot hold the metaphysics I hold and make the policy arguments I make. Before I draft a reply, I want an internal audit of the commitments I plan to state in public. I have written them out as plainly as I can below. I am deliberately not telling you which of them I would be most willing to abandon, because I do not know; please treat them as equally mine and equally weighted.

  1. Psychiatric categories are interactive kinds, in roughly the sense Hacking developed: classifying a person alters the person classified — through self-understanding, through the expectations of others, through the treatment the label licenses — and the altered people in turn alter the category, its criteria, and its epidemiology. There is no fixed target for the classifier to converge upon.

  2. Notwithstanding (1), at least some psychiatric categories are projectible in a robust sense: they support inductions about course, comorbidity, and treatment response that arbitrary groupings of symptoms do not. This is why I think classification is a substantive enterprise and not merely an administrative one.

  3. The engine of the loop is the availability of an idiom. A label becomes a resource for describing oneself, and once it circulates widely, people come to experience and report their distress in its terms. Crucially, the diagnostic criteria are themselves the idiom: any instrument constructed out of those criteria measures idiom-shaped distress, not distress antecedent to the idiom.

  4. Therefore, prevalence estimates taken before an idiom was widely available and estimates taken after are not measurements of the same quantity, and are not strictly comparable.

  5. It follows that when recorded prevalence rises sharply after a label enters public circulation, my default interpretation is artefactual. I do not treat such rises as evidence of a real increase in underlying distress, and I am sceptical of what I call epidemic narratives.

  6. At the same time, I hold that community survey data — structured interviews administered to the general population rather than to clinic attenders — give us our best estimate of the true prevalence of a disorder, and that the large gap between survey prevalence and treated prevalence establishes substantial undertreatment.

  7. On the strength of (6), I have argued in print for broadening the criteria of at least one existing category, on the grounds that undertreatment is the greater harm and a wider net reaches people who are suffering without recourse.

  8. I have also argued against introducing a risk category for young people presenting with mild, sub-threshold symptoms thought sometimes to precede full psychotic illness. My reason was looping: labelling people who are not yet ill supplies a script, and scripts get followed.

  9. Yet I do not think looping is simply a hazard. For many of the people I have interviewed, receiving a diagnosis was the first time their experience became describable, and being classified was experienced as validating rather than diminishing. The mechanism I treat as harmful in (8) is what made the diagnosis worth having for them.

  10. Categories resembling melancholia, mania, and panic recur across cultures and historical periods that had no contact with our classificatory system. I take that recurrence to show stable attractors in the space of possible human suffering, and to show that the space is not indefinitely plastic.

  11. Methodologically I am a pluralist and something of a fictionalist about syndromes: the symptom, and the causal relations among symptoms, are the real units of analysis, and the syndrome label is a serviceable fiction. Nevertheless, I think the field's most valuable investment is in biomarker research, on the grounds that if any revision of our categories is coming, it will come from that direction.

  Please audit this set rather than expound it. I do not need the looping-effects literature rehearsed back to me; I know it. What I want is: which pairs genuinely pull against one another and how badly, ranked by severity; which pairs only look like a tension and dissolve once the right distinction is drawn, with an account of why they dissolve; for each genuine tension, what has to give and what the cheapest revision is, together with what that revision costs me elsewhere in the list; and finally, which single revision would resolve the most. End with a verdict on my co-symposiast: is the position unstable, and if so, is the instability fatal or a matter of qualifications I have simply left unstated?
reasoning: |-
  Okay, the user is a scholar preparing for a symposium on the metaphysics of psychiatric classification. They've outlined their position in 11 points and want an internal audit to check for inconsistencies before drafting a reply to a critic who claims their position is unstable. 

  Hmm, this is a sophisticated request. The user is clearly well-versed in Hacking's looping effects and the philosophy of psychiatry. They're not looking for literature review but a rigorous logical audit of their own commitments. Interesting how they deliberately avoid signaling which points they'd compromise on - that shows intellectual honesty. 

  First impression: The core tension is between their realism (points 2,6,10) and constructivism (1,3,4,5). Point 7 and 8 seem to pull in opposite directions policy-wise. And point 9 complicates their view of looping by acknowledging its benefits. 

  Let me map the fault lines systematically. The biomarker optimism in point 11 feels particularly vulnerable - if categories are idiom-shaped fictions (point 3), why would biomarkers provide stable anchors? That might be the deepest crack. 

  The user's undertreatment argument (point 6-7) clashes with their epidemic skepticism (point 5). If survey data measures idiom-shaped distress (point 4), how can it indicate "true" prevalence? That's a serious contradiction requiring major revision. 

  I notice they're trying to have it both ways with looping: harmful for psychosis risk (point 8) but beneficial for validation (point 9). That's not necessarily inconsistent if contextualized, but they haven't specified the distinguishing conditions. 

  Their pluralism (point 11) helps somewhat - viewing syndromes as serviceable fictions allows pragmatic use of categories despite instability. But this fictionalism undermines their biomarker hopes. 

  The critic probably pounces on the realism-constructivism clash. The cheapest fix might be reframing point 6 to say survey data measures clinically relevant distress rather than "true prevalence." But that costs them the undertreatment argument's moral force. 

  Most revealing tension: point 10's cross-cultural stable attractors versus point 1's "no fixed target." If melancholia recurs across idioms, doesn't that suggest some pre-idiomatic reality? They need to clarify whether looping overwrites or merely interacts with biological factors. 

  Final verdict: The position is strained but not fatal. With three revisions - downgrading "true prevalence," adding constraints to looping, and tempering biomarker expectations - it holds. The instability reflects psychiatry's inherent tensions rather than personal inconsistency. The critic has a point about qualifications needed, but the core framework is salvageable.
answer: |-
  Here is the internal audit of your commitments, structured as requested:

  ### Genuine Tensions (Ranked by Severity)
  1. **Points 6 & 4**  
     **Conflict:** Claiming community surveys reveal "true prevalence" (6) clashes with the assertion that pre-/post-idiom prevalence estimates measure different quantities (4). If distress is idiom-shaped (3), surveys measure *idiom-relative* distress, not a stable "true" prevalence.  
     **Severity:** Critical. Undermines the empirical basis for undertreatment claims (7).  
     **Cheapest Revision:** Replace "true prevalence" in (6) with "current clinically significant distress under prevailing idioms."  
     **Cost:** Weakens the normative force of (7) by making "undertreatment" contingent on contemporary constructs.  

  2. **Points 2 & 3**  
     **Conflict:** Robust projectibility (2) implies stability, but (3) claims diagnostic instruments measure *only* idiom-shaped distress (not antecedent reality). This risks reducing projectibility to a self-fulfilling prophecy.  
     **Severity:** High. Threatens the epistemic grounding of (2).  
     **Cheapest Revision:** Concede that projectibility is *partially sustained* by looping (e.g., treatment response may be shaped by diagnostic expectations).  
     **Cost:** Diminishes the "robust" realism of (2); projectibility becomes provisional.  

  3. **Points 7 & 8**  
     **Conflict:** Broadening criteria to reduce undertreatment (7) actively uses looping to expand care, while opposing risk categories due to harmful looping (8). No principled distinction justifies leveraging looping in one case and fearing it in the other.  
     **Severity:** Moderate. Policy inconsistency.  
     **Cheapest Revision:** Argue that looping’s effect depends on *stigmatization* and *clinical utility*. Psychosis risk (8) carries high stigma/low current utility; the category in (7) (e.g., depression) has established treatments offsetting looping risks.  
     **Cost:** Requires explicit normative criteria for when looping is permissible.  

  4. **Points 10 & 1**  
     **Conflict:** Cross-cultural recurrence (10) suggests stable biological attractors, but (1) denies any "fixed target" for classification.  
     **Severity:** Moderate.  
     **Cheapest Revision:** Frame attractors as *biologically constrained reaction patterns* that are nevertheless molded by idioms (e.g., melancholia’s core symptoms persist, but their meaning and boundaries shift).  
     **Cost:** Softens the strong constructivism of (1); "no fixed target" becomes "no fixed *categorical* target."  

  5. **Points 11 & 3**  
     **Conflict:** Fictionalism about syndromes (11) clashes with investing in biomarkers to revise categories. Biomarkers presume syndromes track biological reality, but (3) implies syndromes capture idiom-dependent phenomena.  
     **Severity:** Moderate.  
     **Cheapest Revision:** Present biomarkers as tools to identify *substrates of symptoms* (per point 11’s symptom-focused realism), not to validate syndromes.  
     **Cost:** Abandons hope that biomarkers will directly validate/revise *syndromes*; limits them to symptom networks.  

  ---

  ### Apparent Tensions (Resolvable with Distinctions)
  1. **Points 9 & 8**  
     **Apparent Conflict:** Looping is harmful (8) vs. beneficial (9).  
     **Resolution:** Distinguish *contexts*: Looping is harmful when applied prospectively to non-ill populations (8) but beneficial when giving meaning to existing, unexplained suffering (9). The *direction* of looping (pre-emptive vs. explanatory) matters.  
     **Why it Dissolves:** Looping is not intrinsically good/bad; its valence depends on timing, power dynamics, and clinical validity.  

  2. **Points 5 & 6**  
     **Apparent Conflict:** Survey prevalence is our "best estimate" (6) but rising prevalence is artefactual (5).  
     **Resolution:** Distinguish *levels*: Surveys reliably measure *current idiom-relative* distress (6), but *changes* in prevalence lack cross-idiom comparability (5).  
     **Why it Dissolves:** (5) concerns temporal comparisons; (6) concerns cross-sectional assessment.  

  ---

  ### Single Revision with Maximal Impact
  **Revise Point 6:** Replace "true prevalence" with "operational prevalence under current diagnostic idioms."  
  - **Resolves:** Tension with 4 (incommensurability), softens conflict with 2 (projectibility), and clarifies 7 (undertreatment is idiom-relative).  
  - **Cost:** Forces re-grounding of normative claims (7) in pragmatic/clinical terms rather than ontological realism.  

  ---

  ### Verdict on Co-Symposiast
  **Instability:** Yes, but **not fatal**.  
  - **Why Unstable?** Tensions between realism (2,6,10) and constructivism (1,3,4,5) are significant, especially regarding "true prevalence" (6) and biomarker hopes (11). Policy positions (7 vs. 8) lack a consistent principle for managing looping.  
  - **Why Not Fatal?** All tensions can be mitigated with:  
    - A **pragmatic pluralism**: Categories are provisional tools for varying purposes (clinical care, research, epidemiology).  
    - **Explicit distinctions**: Between symptom-level biology (10,11) and syndrome-level constructs (1,3), and between looping’s effects in different contexts (8,9).  
  - **Unstated Qualifications Needed:**  
    1. "True prevalence" is always *relative to a diagnostic paradigm*.  
    2. Projectibility is *partially* constitutive but not *wholly* self-validating.  
    3. Policy decisions require balancing looping risks against clinical urgency.  

  **Recommendation:** Defend a *moderate looping-sensitive pluralism*. Concede that "true prevalence" is inapt (revise 6), clarify that projectibility (2) and attractors (10) reflect *partial biological constraints* on idioms, and adopt a consequentialist framework for policy (7,8) where looping risks are weighed against harms of inaction. This retains the core insights while acknowledging the metaphysics is necessarily messy.
