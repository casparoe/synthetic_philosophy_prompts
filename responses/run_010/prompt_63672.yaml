prompt: |-
  Our reading group spent two hours on this and I still can't tell whether it's a good argument or a conjuring trick. It's meant to get you from signalling biology to moral anti-realism without ever touching metaphysics. Here it is as best I can reconstruct it.

  (1) By the handicap principle, a signal is reliable only if sending it is costly, and costly in a way that hits low-quality signallers harder than high-quality ones. That's the whole point of the peacock's tail: it's honest because a weak peacock can't afford it.

  (2) Moral condemnation is costly in exactly that shape. Denouncing someone publicly burns capital — you make an enemy, you invite retaliation, you bind yourself to a standard you'll be held to later. And it costs a bad cooperator more than a good one, since a known freeloader gets called out for hypocrisy and has more to lose by the attempt. The risk-free, anonymous kind of denunciation is the unreliable one; the expensive kind is what actually moves people.

  (3) So when I say what he did was wrong, the job the utterance is doing is displaying something about me — my commitments, my coalition, my willingness to pay to enforce — rather than reporting how things stand in the world.

  (4) And where the job a bit of discourse is doing is displaying the speaker, its surface content isn't earning its keep. You can explain why we produce it and why listeners respond to it without ever supposing it's true, or even the sort of thing that could be. My friend calls this the function-swamps-content principle and thinks it's the load-bearing step.

  (5) So moral claims aren't in the business of being true.

  (6) The selling point: no queer properties, no argument from disagreement, no need to litigate whether moral facts could exist. Just the biology, plus the observation that condemnation is expensive.

  I'm a realist and I want to keep (1) and (2) — the biology seems right, and (2) seems right about the sociology too — but (5) is precisely what I deny and I can't locate the break in the chain. Two things I keep circling:

  - (1) says cost is what makes a signal honest, and then (3) uses that same cost to make the utterance look like it isn't about the act at all. Something about that transition bothers me but I cant articulate what. Is there a slide here, and if so is it between (1) and (2), between (2) and (3), or somewhere in (4)?
  - Does it matter whether condemnation even qualifies as a handicap rather than an index or a conventional signal? (2) is claiming differential cost and I'm honestly not sure that's true. The loudest condemners are frequently the worst offenders, which is the opposite of what a handicap should look like — but if I say condemnation is cheap instead, I feel like I've handed the argument a different and possibly better route to (5), and I don't know how.
  - If (4) is meant as a general principle it seems to run on (6), and on everything said in a seminar by people who want jobs. Is that fatal self-undermining or just the genetic-fallacy shrug I'm supposed to ignore?

  So: which step fails? And if none of them actually fails, tell me which is cheapest to give up and price it — I'd rather lose (2) than (1), but I dont know what a realist gives up by dropping (2), since I'd still want some account of why condemnation is expensive and why people respond to it. Finally, is there a version with (4) weakened into something defensible that still lands somewhere I should be worried about? I'd like to know how close the argument gets before it breaks, not just that it breaks.
reasoning: |-
  Okay, let's tackle this step by step. The user presents an argument from their reading group that uses signaling biology to argue for moral anti-realism. They're a moral realist and want to preserve the biological basis (1) and sociological observation (2) but reject the conclusion (5). They've identified three main areas of concern: the transition from honesty in signaling to non-descriptivism in moral claims, whether condemnation actually functions as a handicap signal, and whether the function-swamps-content principle (4) is self-undermining.

  First, I need to unpack the argument's structure. The core move seems to be equating moral condemnation with biological signaling via the handicap principle, then arguing that since the function is signaling rather than describing, the content isn't truth-apt. The user feels uneasy about the leap from (2) to (3) where costly signaling shifts from ensuring honesty to revealing speaker attributes instead of describing reality. That's a crucial pivot point.

  Regarding condemnation as a handicap signal: the user raises a valid point about hypocrites. If bad cooperators often condemn loudly, that contradicts the differential cost requirement. But rejecting (2) might backfire - if condemnation is cheap, it could still support anti-realism by making moral claims unreliable signals. The user needs a way to maintain that moral claims track truth even if condemnation serves signaling functions.

  The function-swamps-content principle (4) seems particularly vulnerable. If applied universally, it would invalidate itself since the principle's own content could be explained by its function (persuading people of anti-realism). The user recognizes this self-undermining risk but wonders if it's just a genetic fallacy. I think it's deeper - it's a performative contradiction.

  For the realist defense, I'll consider these options: First, challenge the inference from signaling function to non-descriptivism. Costly signals can still convey truth (e.g., scientific research is costly but descriptive). Second, modify (2) - perhaps condemnation's costs vary contextually but can still track moral facts. Third, attack (4) as overbroad - many discourse types serve multiple functions without eliminating descriptive content.

  The user's preference is to sacrifice (2) if needed, but I think weakening (4) is more strategic. A realist could accept that moral discourse has signaling functions while insisting it also describes mind-independent properties. The cheapest concession might be reframing (3): the utterance displays speaker commitment and describes reality simultaneously. This maintains biological plausibility without collapsing into anti-realism.

  Ultimately the argument gets furthest if we grant (1)-(3) but block (4). The critical break is when the inference from signaling function to non-descriptivism occurs. The user should note that evolutionary explanations don't preclude truth-tracking - our visual system evolved for fitness but still conveys reality. Similarly, moral condemnation could be both costly signal and fact-stating.
answer: |-
  Your instincts are sharp – this argument *is* clever but contains crucial missteps. It leverages valid insights in biology and sociology to make an invalid leap in metaethics. The critical break occurs **between (3) and (4)**, specifically in the application of the "function-swamps-content principle." Let's dissect it step-by-step:

  1.  **Step (1):** **Valid.** The handicap principle (Zahavi) is a well-established model in biology explaining honest signaling. Costliness that differentially impacts low-quality signallers *is* a key mechanism for reliability in contexts like mate selection or predator deterrence.
  2.  **Step (2):** **Plausible, but nuanced.** Your concern about hypocrites is valid. Public moral condemnation *can* be costly (reputation risk, retaliation, commitment costs). It *can* sometimes be harder for a "bad cooperator" (if their hypocrisy is exposed, amplifying the cost). **However:**
      *   **It's not universally a handicap signal:** Loud condemnation can sometimes be *cheap* or even *beneficial* for bad actors (virtue signaling, scapegoating, deflecting blame). The cost structure is highly context-dependent (social standing, nature of the act, anonymity, group dynamics).
      *   **It's not ONLY a signal about the speaker:** Crucially, even when it *functions* as a costly signal about the speaker (commitment, coalition, enforceability), it simultaneously *purports* to be about the act itself. Its surface content ("X is wrong") doesn't vanish because it also signals something else.
      *   **Differential cost isn't guaranteed:** As you note, bad actors can often condemn loudly without incurring higher costs (or even gaining benefits), contradicting the strict handicap model. This weakens the analogy but doesn't automatically hand the argument to anti-realism. It just shows (2) isn't universally true.
  3.  **Step (3):** **Premature Inference.** This *infers* from the signaling function described in (2) that the *sole* or *primary* job of the utterance "What he did was wrong" is to display something about the speaker, *rather than* reporting on the world. This is where the slide happens. The argument assumes that *because* the utterance has this signaling function, it *cannot* also be performing a descriptive function. This is an unwarranted leap from functional explanation to semantic/content analysis.
  4.  **Step (4):** **The Fatal Flaw (Function-Swamps-Content Principle):** This principle is **false as a general rule** and **self-undermining**. It claims: If the primary *function* of a discourse is to display something about the speaker (rather than describe the world), then its surface content isn't "true" or even truth-apt.
      *   **Counterexamples Abound:** Consider expressions of pain ("Ouch!"), scientific reports, historical accounts, or even simple assertions ("The sky is blue"). These utterances serve crucial social *functions* (eliciting help, coordinating research, preserving knowledge, sharing information). Their surface content is *essential* to that function. Explaining *why* we produce them and why listeners respond doesn't remotely entail that their content isn't true or truth-apt. The function *relies on* the content being understood as descriptive. The handicap signal of the peacock's tail *honestly signals* underlying fitness – the signal's function depends on its *reliably correlating with a real state of the world* (fitness). Function and descriptive content aren't mutually exclusive; they are often intertwined.
      *   **Self-Undermining:** Your suspicion is correct. The argument itself (steps 1-6) serves a social function within philosophy (persuading, displaying intellectual prowess, aligning with a school of thought, potentially getting jobs). Applying the "function-swamps-content" principle consistently, we should conclude that the content of *this very argument* isn't truth-apt – it's just displaying something about the speaker/arguer. This isn't just a genetic fallacy (pointing to origins to dismiss content); it's a performative contradiction where the argument relies on its own content being meaningful and truth-evaluable *while* deploying a principle that would deny that very possibility to itself. **This is fatal to (4).**
  5.  **Step (5):** **Invalid Conclusion.** This follows only if (3) and (4) hold. Since (3) is an unwarranted inference and (4) is a false and self-undermining principle, (5) does not follow.
  6.  **Step (6):** **Misleading Selling Point.** While it avoids *some* metaphysical debates, it smuggles in a massive, unsupported semantic premise (4) and an invalid inference (3). Avoiding queerness doesn't magically validate the reasoning from (1)/(2) to (5).

  **Where the Break Is & How to Fix It (Realist Response):**

  *   **The Critical Break:** **Between (3) and (4).** The inference that signaling function *entails* non-descriptive content (3), and especially the general principle that function swamps content (4), are the argument's core weaknesses.
  *   **Cheapest Concession:** **Weaken (3) and Reject (4).** This preserves the valuable insights in (1) and (2) without conceding anti-realism.
      *   **Revised (3):** "So when I say what he did was wrong, *one important aspect* of the utterance's function is displaying something about me – my commitments, my coalition, my willingness to pay to enforce – *alongside* reporting how I believe things stand in the world regarding the wrongness of the act."
      *   **Reject (4):** Discard the "function-swamps-content" principle. Acknowledge that discourse, including moral discourse, can (and often does) serve multiple functions simultaneously. The social signaling function does *not* negate the descriptive, truth-apt content. The costliness identified in (2) *could* be a mechanism that helps *stabilize* reliable communication about genuinely held moral beliefs and commitments within a group, not evidence that there's no belief about an act's properties being expressed. The cost helps ensure the sincerity or commitment behind the descriptive claim, not that the claim isn't descriptive.
  *   **Why Drop (2) Isn't Necessary or Wise:** (2) contains plausible sociological observations. A realist can fully accept that moral condemnation *often* functions as a costly signal with social benefits (enforcing cooperation norms). This is compatible with the view that the condemnation *expresses a belief* that the act possesses the property of wrongness. The cost helps guarantee the speaker's investment in the norm they are invoking. Giving up (2) gains you nothing against the argument's core flaw (the invalid inference/principle) and loses a plausible explanation for the social dynamics of morality. Your alternative account ("why condemnation is expensive and why people respond to it") would likely *still* involve signaling functions, which the anti-realist could try to misuse via the same flawed principle (4).
  *   **How Close Does It Get?** The argument gets surprisingly far by cleverly linking a solid biological model to a social phenomenon. It correctly identifies that moral condemnation *involves* costly signaling with social-regulatory functions. **Where it breaks:** It fallaciously concludes that *because* it has this signaling function, the semantic content *must* be non-descriptive or non-truth-apt. This is the illegitimate leap. The realist can embrace the biology and sociology while consistently maintaining that the utterances also express cognitive, truth-apt beliefs about objective (or inter-subjective) moral properties or facts. The cost helps ensure the *reliability* or *sincerity* of the speaker's report on their moral perception/judgment, not that there's nothing to report.

  **In summary:** Keep (1) and the plausible core of (2). Challenge the inference in (3) that signaling function implies non-descriptive content. Forcefully reject the self-undermining and false "function-swamps-content" principle (4). The argument fails because it mistakes *one function* of moral discourse (costly signaling for social regulation) for its *only semantic purpose*, committing a category error by inferring metaethical conclusions (non-descriptivism, non-cognitivism, anti-realism) directly from evolutionary/sociological function. The biology explains *how* moral discourse works socially, not *what* its utterances mean or whether they can be true.
