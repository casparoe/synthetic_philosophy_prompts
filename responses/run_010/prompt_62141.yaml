  ### Decision Tree for Historical Explanation Positions

  **Tree Structure (9 branch nodes, 8 leaves):**

  1. **Does the explanation rely on any generalization (law-like, probabilistic, or truism) to connect causes to outcomes?**  
     - *Yes, explicitly for the main causal link* → Go to 2  
     - *Yes, but only for intermediate steps in a chain* → Go to 8  
     - *No* → Go to 3  

  2. **Is the generalization non-trivial (i.e., substantive and predictive, not common sense)?**  
     - *Yes* → **Leaf: Covering-law explanation (Hempel-inspired)**  
       *Awkward commitment: Must defend the universality or predictive power of historical "laws," which are often context-dependent.*  
     - *No (trivial/truism, e.g., "people act in self-interest")* → **Leaf: Truism-based explanation (unnamed)**  
       *Awkward commitment: The generalization is too vague to test or falsify, risking circularity.*  

  3. **Is the explanation structured around a contrast (e.g., "why this rather than that?")?**  
     - *Yes* → **Leaf: Contrastive explanation (van Fraassen-inspired)**  
       *Awkward commitment: The contrast class is chosen arbitrarily, making explanations subjective.*  
     - *No* → Go to 4  

  4. **Does the explanation focus primarily on reconstructing agents' reasons (beliefs/desires)?**  
     - *Yes* → Go to 5  
     - *No* → Go to 6  

  5. **Does the explanation include factors beyond the agent’s awareness (e.g., structural constraints)?**  
     - *No (only what the agent knew/wanted)* → **Leaf: Intentional explanation (Dray-inspired)**  
       *Awkward commitment: Ignores unintended consequences or systemic forces beyond individual agency.*  
     - *Yes (objective situation, even if unknown to agent)* → **Leaf: Situational analysis (Popper-inspired)**  
       *Awkward commitment: Blurs the line between the agent’s perspective and the historian’s hindsight, risking anachronism.*  

  6. **Does the explanation present events as a temporal sequence where order is explanatory?**  
     - *Yes* → **Leaf: Narrative explanation (Danto-inspired)**  
       *Awkward commitment: Cannot objectively justify why one narrative is better than another beyond factual accuracy.*  
     - *No* → Go to 7  

  7. **Does the explanation break the process into a chain of localized causes?**  
     - *Yes* → Go to 8  
     - *No* → **Leaf: Other explanation (unnamed)**  
       *Awkward commitment: Fails to clarify what makes the account explanatory rather than descriptive.*  

  8. **Does the chain involve stepwise causal mechanisms (e.g., A triggers B, B enables C)?**  
     - *Yes* → **Leaf: Mechanism-based explanation (Elster-inspired)**  
       *Awkward commitment: Mechanisms are often ad hoc or lack clear boundaries.*  
     - *No* → **Leaf: Stepwise non-causal explanation (unnamed)**  
       *Awkward commitment: The links between steps are associative, not causal, weakening explanatory force.*  

  ---

  ### Diagnostic Results for Example Sketches:
  - **(A)**: → **Covering-law** (Q1: Yes → Q2: Yes).  
  - **(B)**: → **Intentional** (Q1: No → Q3: No → Q4: Yes → Q5: No).  
  - **(C)**: → **Narrative** (Q1: No → Q3: No → Q4: No → Q6: Yes).  
  - **(D)**: → **Contrastive** (Q1: No → Q3: Yes).  
  - **(E)**: → **Mechanism-based** (Q1: Intermediate → Q8: Yes).  

  ---

  ### Unoccupied Combinations & Gaps:
  Using axes:  
  - **(i) Explanandum**: Single event (S) vs. Pattern/recurrence (P).  
  - **(ii) Connective tissue**: Nomic (N), Intentional (I), Chronological (C), Contrastive (Ct), Mechanistic (M), Other (O).  
  - **(iii) Adequacy relation**: In-world (W) vs. Contrastive-question (Q).  

  | Combination      | Status          | Reason                          |
  |------------------|-----------------|---------------------------------|
  | Pattern + Nomic + Contrastive | Neglected       | Rarely used; patterns usually explained via in-world laws. |
  | Pattern + Mechanistic + In-world | Neglected       | Coherent but uncommon; no example in seminar. |
  | Event + Truism + In-world | Neglected       | Truisms rarely standalone; no example. |
  | Pattern + Other + Contrastive | Incoherent      | "Other" connective tissue + contrastive adequacy conflicts (contrastivity requires clear alternatives). |

  - **Empty because incoherent**: Only one case (above).  
  - **Unattractive**: None (all coherent combinations are viable).  
  - **Neglected**: 3+ cases (see table; mainly pattern-focused explanations missing from examples).  

  ---

  ### Key Notes:
  - **(B) vs. Situational Analysis**: Separated at Q5. **Wedge**: Intentional (B) *excludes* objective factors unknown to the agent; situational analysis *includes* them.  
  - **(E) as Mechanism-based**: This is a **fourth value of axis (ii)** (mechanistic connective tissue). It rejects covering laws (no overarching generalization) but uses local stepwise causes.  
  - **Narrativity vs. Contrastivity**: Not the same! Narrativity (Q6) uses chronology as glue; contrastivity (Q3) defines explanandum via alternatives. (C) uses narrative without contrast; (D) uses contrast without narrative.  

  ---

  ### First-Slide Questions:
  1. **"Does your explanation lean on any generalization—even a loose one—to tie causes to outcomes?"**  
     (Flags: Covering-law, Truism, Mechanism)  
  2. **"Is your account built around a comparison (e.g., ‘why X *rather than* Y?’)?"**  
     (Flags: Contrastive)  
  3. **"Does the explanatory ‘heavy lifting’ come from reconstructing actors’ motivations?"**  
     (Flags: Intentional, Situational)
