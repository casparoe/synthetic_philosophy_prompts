     - The player who appears least in command (because they have low stability and might fail to de-escalate) is the one that is most dangerous and must be taken seriously.
     - And after the event, it's hard to tell who won because the outcomes are either mutually destructive or the winner only won by risking mutual destruction.

  Finally, address the uncle's point: deterrence fails if someone blinks? But the game shows that sometimes you can't blink because you've bound yourself. And the whole system is about managing the risk of losing control.

