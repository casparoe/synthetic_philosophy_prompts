prompt: |-
  I convene a graduate seminar on explanation in the historical sciences, jointly with a colleague in economic history who has been admirably tolerant of my philosophical pestering, and I am currently rebuilding the reading list for Michaelmas term around the Great Divergence and the older formulation of the same puzzle that goes by Needham's name. Working through that material has left me with a dissatisfaction I have not been able to articulate, and I want to know whether the thing I am circling already has a name in the methodological literature, or whether it needs one coined for it.

  The pattern is this. A contrastive question is posed: why did sustained industrialisation get going in England rather than in the Yangzi Delta? An answer is offered as a list of features the first case had and the second lacked — accessible coal, a distinctive wage-and-energy price structure, the ecological windfall from the New World, certain property rights, a certain scientific culture. A critic then observes that the feature was present in the other case as well, merely elsewhere or earlier: China had coal too, in the north; the Dutch Republic had high wages, cheap fuel, dense markets and a vigorous natural knowledge, and did not industrialise; the same institutional arrangement can be found in Song China. And here is the move I want named. The answer is not withdrawn and the feature is not given up. Instead the comparison is quietly narrowed until the feature differentiates again: not England but Lancashire; not China but the Lower Yangzi; not coal but coal within economical haulage of a navigable waterway; not the Dutch Republic but the Dutch Republic together with its lack of a continental hinterland. No narrowing is announced as a revision of the question, and each one is individually unimpeachable — of course we should compare like with like, and of course the sensible unit is a region rather than a civilisation. Cumulatively, though, the effect is that the comparator is fixed once the outcome is already known, and then re-fixed whenever the nominated difference turns out not to be a difference, so that the answer is never genuinely at risk. I saw the identical shape in a student essay last term on why a particular empire collapsed rather than merely contracted: each differentiator was met with the observation that other empires had it too and did not collapse, and each time the comparison class shrank, from empires to agrarian empires to agrarian empires without a maritime frontier, until the differentiators were once again differentiating.

  What I want from you is not a label but a carving. Begin by telling me plainly whether this has an established name, and if it does not, say so and supply one, with a definition and with what it rules out. I suspect the honest answer will be that I have been describing a composite of several things I only half-know — choosing cases on the strength of the outcome, the tidiness that hindsight lends a story, the limits Mill himself put on the method of difference where the cases cannot be made to agree in all other circumstances, and whatever the philosophical literature on contrastive explanation says about who is entitled to fix the alternative against which a fact is explained — but I want each of those identified precisely, told how the pattern above differs from it, and told which comes closest and why. I also want the boundary drawn on the other side, since there must be cases where narrowing the comparison is not a rescue at all but simply the right refinement, and I should like a criterion that separates the two, plus one or two genuinely hard cases that sit on the line. Please give me your bottom line in the first sentence and the reasoning after it, with no preamble and no restatement of my question.
reasoning: |-
  Hmm, the user is convening a graduate seminar on explanation in historical sciences, specifically focused on the Great Divergence and Needham's puzzle. They've noticed a methodological pattern in how historians explain why industrialization happened in England rather than China: scholars propose differentiating factors, critics point out these factors existed elsewhere too, and then proponents narrow the comparison until the factor becomes differentiating again. This feels like a rigged game where the answer isn't truly tested. The user wants to know if this pattern has a name, or if it needs one, and wants a precise analysis of its components.

  The user is clearly frustrated with how historical explanations are being constructed in this literature. They're an academic who thinks deeply about methodology, probably a philosopher of history or someone adjacent to that field. They've noticed this pattern both in professional scholarship and student work. Their dissatisfaction comes from seeing explanations that seem immune to counterevidence—each time a counterexample appears, the comparison shifts to avoid it. They want this named and dissected.

  This pattern resembles several known methodological issues: cherry-picking cases that fit the theory, hindsight bias in constructing narratives, and Mill's method of difference limitations. But it's not exactly any of those. Cherry-picking usually involves selecting cases based on outcomes upfront, whereas here the case selection evolves as counterexamples emerge. Hindsight bias colors the whole narrative but doesn't capture the iterative narrowing. Mill's method acknowledges the problem of dissimilar cases but doesn't address how scholars might "fix" the comparison post-hoc.

  The core issue is the dynamic adjustment of the comparison class to protect the hypothesis. This is different from legitimate refinement where narrowing is based on theoretical reasons independent of the outcome. For example, specifying "coal near waterways" makes sense if transport costs are part of the theory, but not if it's only introduced after learning northern Chinese coal was too distant.

  The user wants clear boundaries: when is narrowing legitimate refinement versus ad hoc rescue? A key criterion is whether the narrowing is motivated by pre-existing theoretical mechanisms or just to dismiss counterexamples. Hard cases might involve regions with partial similarities, like Dutch wages being high but not sustained by the same factors as in England.

  The most precise term for this pattern is "Dynamic Comparison Class Fixing" - it emphasizes the shifting nature of the comparator. The user needs this dissected from similar concepts, with examples of legitimate versus illegitimate narrowing. They'll appreciate clear distinctions and concrete cases to illustrate the boundary.
answer: |-
  This pattern has no established name; I propose **Dynamic Comparison Class Fixing** (DCCF).

  **Definition:** DCCF is the iterative, unannounced narrowing of the comparison class in a contrastive historical explanation *in direct response to counterexamples*, ensuring the initially posited differentiating factors remain salient only by redefining the cases or features *after* the outcome is known, thereby insulating the explanation from falsification.

  **What it rules out:** DCCF is distinct from:
  1.  **Cherry-Picking Cases (Selection Bias):** Involves *initial* selection of cases favorable to the hypothesis. DCCF occurs *during* argumentation, adapting the comparison *reactively* to counterevidence, not just at the start.
  2.  **Hindsight Bias:** Explains *why* a known outcome happened, making it seem inevitable. DCCF is the specific *mechanism* of redefining comparisons *within* that narrative to *maintain* inevitability against challenges.
  3.  **Mill's Method of Difference Limitations:** Mill acknowledged cases are never perfectly similar, requiring judgment. DCCF exploits this necessity *opportunistically* and *repeatedly*, not as a principled limitation but as an *ad hoc* rescue tactic for specific factors under fire.
  4.  **Contrastive Explanation's "Fixing the Foil":** Philosophers (e.g., van Fraassen, Lipton) debate who sets the alternative. DCCF involves *shifting the foil* without justification *specifically to nullify counterexamples*, not just setting an initial plausible alternative. Legitimate foil-setting is stable or justified independently.

  **Closest Concept:** DCCF is closest to a specific, iterative form of **ad hoc hypothesis rescue** applied to the *comparison class itself* within Mill's framework. It differs from general ad hocness by focusing *exclusively* on manipulating the cases/features being compared to preserve differentiation.

  **Boundary with Legitimate Refinement:** Legitimate refinement occurs when narrowing is:
  *   **Theory-Driven:** Motivated by *prior* theoretical understanding of relevant causal mechanisms/scales (e.g., "industrial innovation requires *regional* factor markets," justifying comparing Lancashire vs. Yangzi Delta *from the outset*).
  *   **Independent of Counterexample:** Proposed *before* or *without reference to* a specific challenge, based on general principles.
  *   **Predictive/Explanatory Scope:** Explains *other* phenomena or aligns with broader causal models.

  **Criterion:** Narrowing is likely DCCF if it is *only prompted by and directly targeted at negating a specific counterexample* ("Feature X wasn't unique? Then let's redefine the case/feature until it is!") and lacks independent theoretical justification offered *prior* to the challenge.

  **Hard Cases on the Boundary:**
  1.  **The Dutch Republic "Counterexample":** Initial Claim: High wages + cheap energy + markets caused UK take-off. Counter: Dutch had this too. Narrowing: "UK had this *without* being a compact, trade-dependent entrepôt vulnerable to continental blockade." Is this DCCF? *If* vulnerability is introduced *only* to dismiss the Dutch, it's DCCF. *If* vulnerability was a *pre-existing* part of a theory about the stability required for sustained capital-intensive investment, it's refinement.
  2.  **"Scientific Culture":** Initial Claim: A specific "Baconian" experimental culture was key in England. Counter: Song China had sophisticated empirical investigation. Narrowing: "Not just empirical investigation, but investigation *oriented towards practical manipulation and improvement of techniques*." Is this DCCF? *If* the "orientation" criterion is newly minted *only* to exclude Song China after the counter, it's DCCF. *If* it reflects a well-defined historiographical concept of "applied science" used *consistently* elsewhere, it's refinement (though arguably vague).

  **Bottom Line:** DCCF is a distinct, unnamed methodological pitfall where the comparison class is dynamically reshaped reactively to shield differentiating factors from counterexamples, undermining testability; legitimate refinement requires independent, theoretical justification for narrowing.
