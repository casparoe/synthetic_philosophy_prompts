answer: |-
  ## Analysis of Epistemic Narrowing in Identity-Linked Disagreement

  ### Part 1: Candidate Brainstorming & Ranking

  **Direction 1: Philosophical Literature on Disagreement**
  *   **Epistemic Bootstrapping/Objection-Circularity (High Fit):** Determining peer status *requires* assuming your view is correct to judge their grasp of the evidence. This fits the core mechanism where assessing "equally well-placed" on sub-questions presupposes your framework. Rank: 1st. Directly addresses the dissolution of revision obligation via presupposition.
  *   **Higher-Order Evidence Misapplication (Medium Fit):** Treating disagreement *itself* as evidence only in low-stakes cases, ignoring it as higher-order evidence when stakes are high. But you *are* processing it, then dissolving its force via specialization. Rank: 3rd. Captures asymmetry but not the granular subdivision mechanism.
  *   "Steadfastness by Epistemic Fission" (Novel Concept - Medium-High Fit): Systematically splitting the domain of relevant expertise until no dissenter shares *all* sub-competencies, leveraging the uniqueness of your personal history/context. Rank: 2nd. Describes the *process* well but isn't a standard term.
  *   **Epistemic Partiality/Identity-Encroachment (Medium Fit):** Belief formation influenced by identity/investment. Explains *why* it happens but not *how* the granular subdivision works while feeling justified. Rank: 4th.

  **Direction 2: Fallacy Taxonomy (Informal Logic)**
  *   **Division Fallacy (Weak Fit):** Mistakenly assuming what's true of the whole is true of parts. Not directly applicable. Rank: 6th.
  *   **Ad Hoc Hypothesis/Goalpost Moving (Medium-Low Fit):** Seems close, but you note the *standard* doesn't change, the *granularity* does. Each exclusion has a "real fact" backing. Rank: 5th. Captures the *effect* but not the *method*.
  *   **Method of Residues Misapplied (Medium Fit):** Eliminating alternatives by subtracting shared competencies until only your position remains, treating unique experience as decisive residue. Rank: 3rd. Describes the *effect* of subdivision well.
  *   **Special Pleading via Granularity (High Fit):** Applying a *consistent* standard (detailed expertise) but at an *arbitrary level of specificity* favorable to your position. The fallacy lies in the *unjustified granularity shift*, not a changed standard. Rank: 1st. Best fit in fallacy terms.

  **Direction 3: Expertise & Professional Judgment/Panel Design**
  *   **Uniqueness Heuristic (High Fit):** Overvaluing unique personal experience ("*I* ran *this* assay") as decisive, dismissing broader competence. Common in expert overconfidence. Rank: 1st. Directly explains the subdivision endpoint.
  *   **Confirmation Bias in Expertise Assessment (Medium Fit):** Seeking reasons why dissenters lack specific expertise. Explains motivation but not the structured, granular *process* or feeling of justification. Rank: 4th.
  *   **Failure of Perspective-Taking/Calibration (Medium Fit):** Inability to accurately calibrate others' expertise when emotionally invested. Related, but doesn't capture the systematic subdivision. Rank: 5th.
  *   **Structural Vulnerability to "Siloed Expertise" Arguments (High Fit):** Panels lacking pre-agreed norms for "sufficient expertise" level are vulnerable to this dissolution tactic. Design flaw your pattern exploits. Rank: 2nd. Highlights the systemic issue.

  **Direction 4: Cognitive Science/Social Psychology**
  *   **Naive Realism + Identity Protective Cognition (Medium-High Fit):** Belief your view is objective reality + defending identity-linked beliefs. Explains motivation and dismissal of dissent, but not the granular *method*. Rank: 3rd.
  *   **Attribute Substitution (Medium Fit):** Substituting the hard question ("Is their overall judgment sound?") with an easier one ("Do they know *this* specific sub-thing?"). The subdivision *creates* the easier questions. Rank: 2nd.
  *   **Motivated Numeracy/Reasoning (Low-Medium Fit):** Using detailed reasoning to defend a desired conclusion. True, but "blunt" as you said; doesn't explain the *specific epistemic mechanism*. Rank: 6th.
  *   **Scope Insensitivity in Expertise Evaluation (High Fit):** Failing to see that minor increments in specific, unique experience don't proportionally increase epistemic weight relative to broader competence. Rank: 1st. Explains why the subdivisions feel justified individually but cumulatively distort.

  **Top 3 Overall Candidates:** 1. Epistemic Bootstrapping/Circularity, 2. Special Pleading via Arbitrary Granularity, 3. Uniqueness Heuristic + Scope Insensitivity.

  ### Part 2: Established Concept & Differentiation

  **The core established concept you describe is a sophisticated form of Epistemic Bootstrapping, manifesting as Special Pleading via Arbitrarily Increased Granularity.** It leverages the fundamental problem that judging epistemic peer status often requires substantive judgments about the disputed question itself.

  *   **How it works:** You start with a genuine, consistent standard: "Revise towards equally well-informed peers." When identity/work is invested, you engage in **Recursive Domain Particularization**. The domain of "relevant expertise" is subdivided into increasingly specific sub-competencies ("run *this* assay," "know *this* subgroup lit"). Each subdivision is *individually justifiable* ("These details *are* relevant!"). Crucially, *your* position defines which sub-competencies are deemed *essential and decisive*. Because your unique experience makes you the only one possessing *all* the now-essential sub-competencies (or sharing them only with allies), the set of "peers" evaporates. The obligation to revise dissolves not by rejecting the norm, but by making the qualifying set for peer status logically empty *for dissenters* through granular redefinition.

  *   **Differentiation from Close Candidates:**
      *   **Standard Bootstrapping Worry:** The standard worry is that peer identification *might* be question-begging. Your pattern is the *active exploitation* of this worry. It's not just a risk; it's a *method* used systematically and semi-consciously to *achieve* steadfastness while *feeling* conciliatory. You're *performing* the bootstrapping.
      *   **Special Pleading:** Standard special pleading applies a *different* standard. You apply the *same* standard ("detailed expertise matters") but shift the *level of analysis* (granularity) to where only you meet it. It's special pleading *via granularity manipulation*.
      *   **Uniqueness Heuristic:** This is the *endpoint* ("Only I have *this* experience"). Your pattern describes the *process* of *constructing* that uniqueness by defining the required experience ever more narrowly.
      *   **Motivated Reasoning:** This is the *driver*. Your pattern is the specific *cognitive tactic* used within motivated reasoning in high-stakes, expertise-based disagreements.

  *   **Relation to the Peer Status Problem:** This pattern is **a way of exploiting the bootstrapping worry.** You don't just note the *potential* for circularity; you actively *use* the need to define "relevant expertise" to build a fortress of uniqueness around your position by defining relevance at a microscopic level only you inhabit. The disputed question is settled *by fiat* in defining the peer set.

  ### Part 3: Coining a Term & Boundary Test

  While rooted in bootstrapping and granular special pleading, the specific, recursive, self-justifying process merits a distinct label: **Recursive Domain Particularization (RDP).**

  *   **Definition:** Recursive Domain Particularization (RDP) is an epistemic maneuver occurring in disagreements involving identity or significant personal investment, characterized by:
      1.  **Initial Concession:** Acceptance of a norm requiring belief revision in the face of disagreement from equally well-placed peers.
      2.  **Granular Subdivision:** The recursive decomposition of the domain of "relevant expertise" or "sufficient positioning" into increasingly specific sub-competencies or contextual knowledge components.
      3.  **Justification per Subdivision:** Each subdivision step is supported by a plausible, context-specific reason why the finer-grained competency/knowledge is genuinely relevant to the disputed claim.
      4.  **Position-Defined Relevance:** The selection of *which* sub-competencies are deemed essential and decisive is implicitly guided by the defender's own unique experiences and position.
      5.  **Peer Set Evaporation:** The cumulative effect of subdivisions is the definition of a set of necessary conditions for being "equally well-placed" that only the defender (and those who already agree) satisfies, dissolving the obligation to revise without explicitly rejecting the norm.
      6.  **Internal Justifiability:** Each step feels reasonable and defensible from within the perspective of the person performing RDP.

  *   **Boundary: Legitimate Specialization vs. RDP**
      *   **Legitimate Specialization:** Expertise boundaries are drawn based on *pre-existing, field-recognized, functionally distinct domains* with *consensus* on their relevance (e.g., cardiology vs. nephrology). The relevance of the specialization to the *specific question* is non-arbitrary and widely acknowledged. The specialist doesn't demand unique *personal* history, only recognized *domain* expertise. ("You need a nephrologist for renal clearance.")
      *   **Recursive Domain Particularization (RDP):** Boundaries are drawn *ad hoc* during the disagreement, often reaching a level of *personalized, contextual detail* (e.g., "run *this specific version* of the assay on *this specific cohort*"). Relevance is argued *post hoc* based on the specifics of *this* claim/evidence, heavily influenced by the defender's own path to belief. The necessary expertise becomes unique to the defender's biography. ("You need someone who has run *this exact* assay, with *this* batch of reagents, on data shaped *precisely* like *this*.")

  *   **Test for Self-Application (Use with Caution - Inherent Limits):**
      *   **The "Relevance Reversal" Test:** When demanding a specific sub-competency (e.g., "Have they read the subgroup literature in Language X?"), ask: "If someone *lacking* this specific competency *agreed* with me, would I dismiss their agreement as irrelevant or unqualified? Or would I accept their concurrence as meaningful?" If you'd accept agreement without the specific competency but demand it for disagreement, RDP is likely operating. If the competency is *truly* essential, agreement *without* it should also be suspect.
      *   **The "Level of Consensus" Test:** Is the granular expertise you're demanding recognized *outside this immediate dispute* as essential for *this type* of judgment? Or is its critical importance being established *because* of the disagreement and your unique position? If it's the latter, RDP is likely in play.
      *   **Honest Assessment of Possibility:** Is applying this test *from inside* the pattern feasible? **Barely, and with difficulty.** The strength of RDP lies in the genuine justifiability of each step and the high stakes. Meta-awareness (which you have) is necessary but not sufficient. The "Relevance Reversal" test offers the best chance, as it targets the asymmetry inherent in RDP. It requires brutal honesty about whether the demanded specificity is truly a *sine qua non* for *any* valid judgment, or only for *dissent*. Institutional checks (Part 4) are more robust.

  ### Part 4: Implications for the Disagreement Debate

  This pattern poses a **significant challenge to both conciliatory and steadfast views, arguing strongly for a procedural rule fixing the level of detail upfront.**

  1.  **Challenge to Conciliating Views:** RDP shows how the core conciliatory move – revising based on peer disagreement – can be systematically *gamed* and dissolved from within while *appearing* to adhere to the norm. It exploits the ambiguity in defining "peer" or "equally well-placed." If conciliationism cannot prevent RDP, its practical force in high-stakes, identity-relevant disputes is severely weakened. It needs a defense against this method of norm dissolution.
  2.  **Challenge to Steadfast Views:** While seemingly enabling steadfastness, RDP actually *undermines* its typical justifications. Steadfastness usually appeals to *reasons* why one is right or the dissenter isn't a peer. RDP generates the *appearance* of non-peer status through a motivated, granular process. It reveals how "properly positioned" can become a question-begging shield constructed *after* disagreement arises, making steadfastness potentially epistemically irresponsible when driven by RDP.
  3.  **The Need for Pre-Defined Grain Size:** The most compelling implication is that **both views require a procedural mechanism to define the relevant level of expertise granularity *prior* to encountering specific disagreements on contentious topics.** RDP flourishes in the absence of such norms. For deliberative bodies like your committee:
      *   **Establish Expertise Criteria Early:** During panel formation or protocol development, define *in advance* the *types* and *levels* of expertise required for different kinds of judgments. What constitutes "sufficient" knowledge? Is it general methodological competence in the field, specific domain expertise, or something else? Aim for functionally relevant, field-recognized categories.
      *   **Pre-Commit to Peer Definition:** Explicitly agree, *before reviewing specific evidence*, on who counts as an "equally well-placed" member *for the purposes of triggering conciliation norms* within the committee. Base this on the pre-defined expertise criteria, not on the specifics of the data under review or personal histories.
      *   **Focus Deliberation on the Evidence, Not Credentialing:** Structure discussion to focus on interpreting the *shared evidence* and arguments, rather than allowing debates about whether someone is "truly" qualified *on this narrow point*. The pre-defined expertise level should suffice for participation.
      *   **Acknowledge Investment & Use Facilitators:** Explicitly acknowledge when topics involve member's own work. Consider using an independent facilitator to manage discussion, enforce pre-agreed norms on expertise levels, and challenge moves towards excessive particularization during deliberation.

  **Conclusion:** You've precisely identified Recursive Domain Particularization (RDP) – a sophisticated, self-justifying epistemic maneuver exploiting the bootstrapping problem inherent in defining peer status. It dissolves the obligation to revise by constructing an irreproducible uniqueness through motivated granular subdivision. While each step feels reasonable, the cumulative effect is an epistemic fortress. Distinguishing it from legitimate specialization hinges on pre-existing consensus regarding domain relevance and avoiding *ad hoc*, personalized criteria. Its existence underscores a critical vulnerability in both conciliatory and steadfast approaches: the need to define the level of relevant expertise *before* the dispute arises, making structured deliberative procedures essential safeguards against this subtle form of epistemic closure. Your meta-awareness is the first defense; institutional pre-commitments on expertise granularity are the stronger one.
