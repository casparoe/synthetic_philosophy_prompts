  I need to approach this systematically. This is a sophisticated epistemological problem that requires careful unpacking. The user wants structured analysis across four domains: philosophical literature on disagreement, fallacy taxonomy, expertise studies, and panel design principles. They're particularly concerned about the "unit size" shift in evaluating expertise and want to distinguish legitimate specialization from problematic narrowing.

  Looking at philosophical aspects, this seems related to the problem of "bootstrapping" where determining epistemic peerhood might require prior agreement on the disputed claim. But the user's pattern is more active - they're constructing peerhood through granular specialization. The "uniqueness heuristic" in expertise studies also comes close, but usually applies to claiming authority rather than dissolving disagreement obligations. Fallacy-wise, it resembles a "division fallacy" or "method of residues" but with epistemic justification at each step.

  For panel design principles, this pattern threatens the "fracture points" that structured deliberation tries to prevent. The key distinction from legitimate specialization is that in valid cases, the subdomain expertise is non-arbitrary and consensus exists about its relevance. The user's pattern uses justifiable subdivisions to dissolve disagreement rather than resolve it.

