  We are designing a decision procedure for evaluating philanthropic proposals, especially those involving high-stakes, low-probability events (like existential risks) and comparing them to more certain, local interventions.

   The key challenges:
   1. Pascal's Mugging: When the potential impact is enormous, even a tiny probability can dominate the expected value calculation, leading to a recommendation to fund even if the probability is extremely low. But this can be exploited and may lead to wasting money on unrealistic projects.
   2. Multiple Counting: The same future benefit (e.g., saving future generations) being claimed by multiple projects.
   3. Uncertainty Types: Distinguishing between uncertainty in the size of the payoff and uncertainty in the effectiveness of the intervention.
   4. Limited Budget: We can only say "yes" a limited number of times.

   Proposed Procedure:

   We break the evaluation into stages. At each stage, we ask a question and set thresholds. If the proposal fails at any stage, we reject. If it passes all, we then compare it to other opportunities.

   Stage 1: Basic Due Diligence (5-10 minutes)
     - Is the organization legitimate? (e.g., registered nonprofit, transparent about finances, etc.)
     - Do they provide enough information for us to evaluate? If they refuse to provide numbers, we note that and move to Stage 2 but with a penalty (or we might reject if they are completely opaque).
     - What is the specific intervention? (Must be clear and concrete)

   Stage 2: Probability of Success (10-15 minutes)
     We try to estimate the probability that the intervention will have any positive effect at all. This is the probability that the project succeeds in its intended way (e.g., for the extinction group, that they actually reduce extinction risk; for the carbon startup, that they achieve the breakthrough).

     We require the organization to provide:
       - Their own estimate of success probability (if they don't, we assign a default low probability, e.g., 1% or even lower, but note that without their input we have to be skeptical).
       - Evidence for that estimate (e.g., expert opinions, past track record, etc.)

     We then adjust based on our own assessment of the evidence. We set a minimum bar for the probability to even consider: say, at least 1 in 10,000 (0.01%). If the probability is below that, we reject because it's too speculative.

     However, note: For local interventions (like the food bank) the probability of success (that the food reaches hungry people) is near 100%.

   Stage 3: Magnitude of Impact (10 minutes)
     We estimate the impact if successful. We break this down:

     a) Direct Impact: How many people (or other units) are directly affected? And by how much?
     b) Scale: Does the intervention scale? (e.g., a policy change might affect millions, a local shelter affects hundreds)

     We also check for double-counting: If the impact is based on saving future generations, we note that this same impact is being used by others. We apply a discount: if multiple organizations claim credit for the same impact, we assign each a fraction (e.g., if there are 3 organizations working on the same big cause, we might assign 1/3 of the total impact to each, unless they can demonstrate that their work is independent and additive).

     For the extinction risk group: the impact is the entire future of humanity. We need to convert that into a number. A common approach in effective altruism is to use the value of reducing existential risk by a tiny amount. For example, if the current risk of human extinction in the next century is X%, and they reduce it by Y%, then the impact is (Y/X) * (expected number of future lives). But this is huge and we must be cautious.

     Instead, we can use a standard value per life saved (or per life-year) and then discount the future appropriately. However, for simplicity and to avoid double-counting, we might cap the impact at a certain level or use a fixed value for existential risk reduction (e.g., the value of reducing global catastrophic risk by 1% is worth $Z, based on some benchmark).

