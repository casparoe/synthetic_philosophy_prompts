answer: |-
  Below is a structured, step-by-step procedure designed for your family's grant meetings. It's built to handle high-stakes proposals (like extinction prevention or moonshot startups) alongside local interventions (like food banks), while explicitly addressing your concerns about Pascal's Mugging, double-counting, uncertainty types, and budget constraints. The procedure is designed to be run in **under 60 minutes** by non-experts, with clear exit points for values-based voting.

  ---

  ### **The Grant Evaluation Procedure**
  **Time Allocation:** 60 minutes max (adjust time per step as needed).  
  **Tools Needed:** Laptop, calculator, timer, and a vote tracker for Step 7.

  #### **Step 1: Legitimacy & Transparency Check**  
  **Question:** Is this organization credible, and can we get basic numbers?  
  **Threshold:**  
  - **PASS:** Organization is registered (nonprofit/verified business), provides *some* quantifiable estimates (even rough probabilities or impacts), and has a clear theory of change.  
  - **FAIL:** Refuses to share any numbers, has no track record, or raises red flags (e.g., vague claims, no transparency).  
  **Action if FAIL:** **Reject immediately.** No further discussion.  
  **Time:** 5 minutes.  
  *Why?* Filters out unserious or opaque proposals. Most organizations fail here ("most of them," per your note).

  #### **Step 2: Problem Scale & Crowding Check**  
  **Question:** Is this problem massively important, and is it already being addressed?  
  **Threshold:**  
  - **PASS:** The problem is global/existential (e.g., climate change, pandemics), AND there is evidence of **underfunding** (e.g., <10 major players, funding gaps reported by experts).  
  - **FAIL:** The problem is crowded (e.g., 50+ well-funded groups working on it) OR the impact is purely local/non-existential.  
  **Action if FAIL:** Classify as **Tier 2** (non-existential) and skip to Step 5.  
  **Time:** 10 minutes.  
  *Why?* Addresses your intuition: "If the stakes are huge, wouldn’t everyone be working on it?" High-stakes + low crowding = worth deeper look. Otherwise, deprioritize.

  #### **Step 3: Impact Adjustment for Double-Counting**  
  **Question:** Are we counting the same impact across multiple proposals?  
  **Threshold:**  
  - If the impact relies on **saving future generations** or **preventing extinction**, discount the claimed impact by **1/(N+1)**, where:  
    - `N` = Number of *other* credible groups you’ve funded in the last 3 years working on the *same* outcome.  
    - *Example:* If 2 groups last year claimed extinction prevention, discount this proposal’s impact by 1/3.  
  - For other impacts (e.g., carbon removal), no discount.  
  **Action:** Apply discount and note the adjusted impact.  
  **Time:** 5 minutes.  
  *Why?* Solves your double-counting concern. Future lives aren’t additive; they’re a shared moral stake.

  #### **Step 4: Uncertainty & Probability Adjustment**  
  **Question:** How reliable is the probability of success?  
  **Threshold:**  
  - **Type A (Effectiveness Uncertainty):** "We’re not sure our *method* works." (e.g., unproven tech).  
    - **Adjustment:** Cut claimed probability of success by **10×**.  
  - **Type B (Impact Uncertainty):** "We’re sure our method works, but the *scale* of impact is uncertain." (e.g., policy advocacy).  
    - **Adjustment:** Use claimed probability, but cap impact at **$10B** (prevents infinity math).  
  **Action:** Apply adjustment and calculate **Adjusted Expected Value (AEV)**:  
  ```
  AEV = (Adjusted Probability) × (Adjusted Impact)  
  ```  
  **Time:** 15 minutes.  
  *Why?* Your note: "Uncertainty about payoff vs. intervention matters." Type A is riskier, so we penalize it harder.

  #### **Step 5: Cost-Effectiveness Comparison**  
  **Question:** How does this compare to a benchmark intervention?  
  **Threshold:**  
  - **Benchmark:** A local food bank at **$40/person fed**.  
  - Calculate **Cost-Effectiveness Ratio (CER)**:  
    ```
    CER = Grant Requested / AEV  
    ```  
    - *Example:* AEV = 10,000 lives saved → CER = $15,000 / 10,000 = **$1.50/life saved**.  
  - **PASS:** CER ≤ **$100/life saved** (or equivalent: 2.5× food bank cost).  
  - **FAIL:** CER > $100/life saved.  
  **Action if FAIL:** Classify as **Tier 2** and skip to Step 7.  
  **Time:** 10 minutes.  
  *Why?* Anchors to a real-world benchmark. If the high-risk proposal isn’t 2.5× better than a food bank, it’s not worth the gamble.

  #### **Step 6: Budget Saturation Check**  
  **Question:** Would funding this exhaust our risk budget?  
  **Threshold:**  
  - **PASS:** High-risk proposals (existential/moonshots) ≤ **1 per year**.  
  - **FAIL:** Already funded a high-risk proposal this year.  
  **Action if FAIL:** **Reject** and skip to Step 7 for values vote (only if Tier 2).  
  **Time:** 5 minutes.  
  *Why?* Ensures you don’t blow the fund on multiple long shots ("can’t say yes every time").

  #### **Step 7: Values Vote**  
  **Question:** Does this align with our family’s values?  
  **Threshold:** Majority vote (3+ of 5 cousins).  
  **Time:** 10 minutes.  
  *Why?* All procedures have judgment calls. This step acknowledges that math can’t resolve everything.

  ---

  ### **Applied to Your Three Cases**
  **Context:** Annual fund = $70k. Grant size = $15k. High-risk limit = 1/year.  
  **Benchmark:** Food bank = $40/person fed → **$100/life saved** CER threshold (2.5× equivalent).

  #### **Case 1: Human Extinction Prevention Group**  
  - **Step 1 (Legitimacy):** PASS. Shares numbers.  
  - **Step 2 (Crowding):** PASS. Existential risk + evidence of underfunding (e.g., <10 major players).  
  - **Step 3 (Double-Counting):** Discount impact by **1/3** (2 other groups funded last year).  
  - **Step 4 (Uncertainty):**  
    - Claims: 1/10,000 chance of saving 1B future lives.  
    - Adjusted: Type A uncertainty → probability cut to **1/100,000**.  
    - AEV = (0.00001) × (1B lives / 3) = **3,333 lives saved**.  
  - **Step 5 (Cost-Effectiveness):**  
    - CER = $15,000 / 3,333 lives = **$4.50/life saved** → PASS ($4.50 < $100).  
  - **Step 6 (Budget):** PASS (no high-risk funded this year).  
  - **Result: Fund.** Math justifies it, but only because of strict adjustments.  

  #### **Case 2: Carbon Startup (1/500 Shot at $100× Return)**  
  - **Step 1 (Legitimacy):** PASS. Shares numbers.  
  - **Step 2 (Crowding):** PASS. Climate tech + underfunded in their niche.  
  - **Step 3 (Double-Counting):** No discount (not future-generation-based).  
  - **Step 4 (Uncertainty):**  
    - Claims: 0.2% chance of $1.5M impact ($15k × 100).  
    - Adjusted: Type A uncertainty → probability cut to **0.02%**.  
    - AEV = (0.0002) × $1.5M = **$300**.  
  - **Step 5 (Cost-Effectiveness):**  
    - CER = $15,000 / $300 = **$50 per $1 of impact** → FAIL.  
    *Comparison: Food bank creates $375 impact for $15k (375 people × $1/meal). This creates $300.*  
  - **Result: Reject.** Math fails cost-effectiveness.  

  #### **Case 3: Local Food Bank ($40/person)**  
  - **Step 1 (Legitimacy):** PASS. Documents meals.  
  - **Step 2 (Crowding):** FAIL (local/non-existential) → **Tier 2**. Skip to Step 7.  
  - **Step 7 (Values Vote):**  
    - Impact: 375 people fed.  
    - Vote: Majority likely approves (you’ve funded it for years).  
  - **Result: Fund via values vote.**  

  ---

  ### **Key Takeaways**
  1. **Your food bank funding is defensible.** The procedure routes it to a values vote, where your family’s local priorities legitimately matter.  
  2. **High-risk proposals rarely clear all hurdles:** The adjustments (probability cuts, double-counting discounts, CER threshold) prevent Pascal’s Mugging. The extinction group passed only due to low crowding and your benchmark leniency.  
  3. **Judgment calls are explicit:**  
     - Steps 2 (crowding) and 7 (values) are subjective but necessary.  
     - Discount rates (Step 3) and probability cuts (Step 4) are based on heuristics, not rigor.  
  4. **The procedure can’t decide everything:**  
     - If an organization won’t share numbers (Step 1), reject.  
     - If crowding is ambiguous (Step 2), lean toward Tier 2.  
     - Values votes (Step 7) override math when family priorities conflict.  

  **Final Budget Impact:** Funding 1 high-risk grant (extinction) and 3–4 values-based grants (e.g., food banks) per year keeps the fund sustainable. You’d reject ~3/4 speculative proposals like the carbon startup.  

  ---  
  This system balances rigor and practicality, ensuring you never "hand over the entire fund and go home." Run it as a checklist in your next meeting, and adjust thresholds as you gain experience.
