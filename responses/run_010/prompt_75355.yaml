prompt: |-
  I'm in an ethics of harm course and I've been trying to write down what I actually think about killing vs letting die, case by case, and the list is a mess. Verdicts:

  1. Doctor switches off a vent at the request of a competent terminal patient: fine.
  2. Doctor who never switches it on for that same patient, same wishes, same outcome: not fine, and worse somehow, which I know sounds backwards from what the doing/allowing distinction is supposed to say.
  3. Two cousins after an inheritance: one holds the kid under in the bath, the other walks in, sees the kid slip and slide under, and just watches. Equally bad. No difference at all for me.
  4. Surgeon kills one healthy visitor for organs to save five: not fine. Letting the five die rather than do it: fine, basically required. So here doing/allowing beats the 5-vs-1 numbers, but in 3 it beats nothing.
  5. Kid drowning in a pond up to my knees and I'm wearing a suit I like: not fine, but a notch less bad than pushing him in.
  6. The festival ticket money would buy a bednet that saves a kid: I keep writing "fine" but I definately don't think it is.
  7. Swimmer is two strokes from a ring buoy on a post; I walk over and move the buoy to a post she can't reach. Never touched her, only moved an object. Feels exactly like killing.
  8. I promised to sort my aunt's pills, then after two weeks I stop going over and she dies. Worse than a stranger who never went, and worse than if I'd never promised at all??

  My tentative rule: you can't leave someone worse off than they'd be if you'd never been anywhere near the situation, but you don't have to make them better off. I think 2, 6 and 8 all break it.

  Is there a principle, or two competing ones, that gets these? State it precisely, say which case each clause is there to handle, then run it on stuff I didn't list — a company that pulls a drug from the market vs one that raises the price tenfold, and a driver who swerves onto a path with one person on it. And be honest about which of my verdicts it can't keep: does the cheap principle that drops one beat the baroque one that saves all eight?
reasoning: |-
  Okay, the user is grappling with ethical dilemmas in their course, specifically the distinction between killing and letting die. They've listed various scenarios where their intuitive judgments seem inconsistent. Their tentative rule is about not leaving someone worse off than if they'd never been involved. But they noticed cases 2, 6, and 8 break that rule. 

  First, I need to unpack each case they mentioned. For example, in case 2, not starting treatment feels worse than withdrawing it, even though the outcome is the same. That's interesting because traditional doing/allowing distinction might say withdrawing is an action, while not starting is an omission. But the user feels the omission is worse here. Why? Probably because of an established duty—once you start treatment, stopping might be permissible if requested, but not starting when you could have implies a failure in duty.

  Then there's the inheritance case where both cousins are equally bad. Here, the distinction collapses because both involve intent to harm. The drowning pond scenario shows a gradation—allowing death is bad but less so than actively killing. But in the organ harvesting case, killing one to save five is unacceptable, while letting five die is permissible. The numbers don't justify the action here, unlike in the cousin scenario where intent overrides any distinction.

  The festival ticket case is tricky. The user feels keeping the money isn't fine, but their tentative rule says you don't have to make others better off. But intuitively, not donating feels wrong. This points to positive duties, like helping when the cost is low. Their rule doesn't cover this, hence the conflict.

  Moving the buoy feels like killing because it's creating a new threat. Even though you're not touching the person, removing a lifesaving object is active harm. The aunt's pills scenario involves broken promises and reliance, making the harm worse due to established responsibility.

  The user's deeper need is to find a coherent ethical framework that explains their intuitions across cases. They might be struggling with cognitive dissonance when their judgments don't align with existing theories. They want a principle that's both consistent and intuitive, without being overly complex.

  I recall that F.M. Kamm's Principle of Contextual Interaction combines negative duties (don't harm) and positive duties (help) with contextual factors like special obligations and intent. Applying this to each case: 

  In case 1, withdrawing treatment respects autonomy and avoids harm. Case 2 fails to establish a duty, making omission worse. Case 3's intent makes both actions equally bad. Case 4's organ harvesting violates negative duties despite saving lives. Case 5's active killing is worse than failing to help. Case 6 involves a positive duty to aid when cost is low. Case 7 is creating a threat. Case 8 has a special obligation from a promise.

  Testing this principle on new cases: A company pulling a drug might be permissible if justified, but raising prices exploits, which is active harm. A driver swerving to avoid five but killing one might be justified as minimizing harm, unlike the organ case because it's redirecting an existing threat.

  This principle handles all eight cases but might conflict in others, like the trolley problem where diverting is acceptable. The user needs to decide if the complexity is worth it or if a simpler rule that drops one case (like the festival ticket) is better. Their deeper need is reconciling intuition with theory, so acknowledging where intuitions might need adjustment is key.
answer: |-
  Here's a precise principle synthesizing your intuitions, built on core ethical ideas like duties, contextual interaction, and the distinction between harming vs. not aiding:

  **The Principle of Contextual Interaction & Duty Grounding:**

  1.  **Negative Primacy:** It is always *prima facie* wrong to **actively cause harm** (make someone worse off than their baseline state *just prior to your interaction*), unless justified by overwhelming context (e.g., consent, self-defense).
  2.  **Positive Duty Triggers:** You have a *prima facie* duty to **prevent harm or provide aid** ONLY if:
      *   **(a) Special Obligation:** You have a specific, voluntarily assumed role or relationship creating the duty (e.g., doctor, parent, promisor), OR
      *   **(b) Minimal Cost/Proximity:** The cost/risk to you is minimal and you are uniquely positioned to act (easy rescue), *AND* inaction leaves the victim worse off than their *pre-existing baseline state before the threat arose*.
  3.  **Baseline Definition:** The "pre-existing baseline state" is the state the person was in *before the specific threat they now face materialized* (e.g., before the terminal illness struck, before the child fell in the bath, before the drowning started).
  4.  **Intent & Role:** Intent to harm significantly aggravates culpability. Fulfilling a specific role (doctor, promisor) can create stronger positive duties than general benevolence.

  **Applying the Principle to Your Cases:**

  1.  **Vent Withdrawal (Fine):** Negative Primacy doesn't apply (no *active harm* from baseline - patient was dying *before* vent). Positive Duty (doctor role) is *released* by patient consent. Outcome aligns with patient's wishes/pre-illness baseline. **FINE.**
  2.  **Never Starting Vent (Not Fine):** Negative Primacy doesn't apply. Positive Duty Trigger (a) applies (Doctor role). Doctor fails duty to aid *using available means*. Patient dies who *could* have been temporarily sustained, leaving them worse off than *after the illness struck but before the vent decision* (where aid was possible). **NOT FINE (Violates 2a).**
  3.  **Cousins (Equally Bad):**
      *   **Killer:** Clear violation of Negative Primacy (active harm from baseline).
      *   **Watcher:** Positive Duty Trigger (b) applies (Minimal Cost/Proximity - easy rescue). Baseline = child *before* slipping (safe). Watcher leaves child worse off (drowned) vs. baseline. Intent to harm (inheritance motive) aggravates. **EQUALLY BAD (Killer violates 1, Watcher violates 2b + malicious intent).**
  4.  **Organ Harvest (Not Fine) vs. Letting Die (Fine):**
      *   **Harvest:** Violates Negative Primacy (1). Actively kills a healthy person from their baseline (safe) to benefit others. No overwhelming justification (consent absent).
      *   **Letting Die:** No Positive Duty Trigger applies. No Special Obligation (2a) to the five strangers. Minimal Cost/Proximity (2b) doesn't *force* organ donation - cost is extreme (life/surgery). **HARVEST: NOT FINE (Violates 1). LET DIE: FINE (No violation).**
  5.  **Pond: Push in (Worse) vs. Not Saving (Bad):**
      *   **Push In:** Violates Negative Primacy (1) - actively creates harm from baseline (child safe near pond).
      *   **Not Saving:** Positive Duty Trigger (b) applies (Minimal Cost/Proximity - trivial cost/unique position). Baseline = child *after* falling in (drowning). Saving would restore towards pre-fall baseline. Failure leaves worse off vs. drowning baseline. **PUSH IN: WORSE (Violates 1). NOT SAVING: BAD (Violates 2b).**
  6.  **Festival Ticket/Bednet (Not Fine):** This challenges *your* intuition vs. your rule. Principle says: No Negative Primacy. Positive Duty Trigger (b) *might* apply: Minimal Cost? (Ticket cost vs. saving a life - arguably minimal). Proximity? (Abstract - not unique/present). **Crucially:** The dying child's baseline (pre-malaria threat) was "healthy but impoverished/at-risk." *Not* donating doesn't make them *worse off* than that baseline; they remain in their pre-existing state of risk. Principle concludes: **FINE (No violation of 1 or 2).** *This is where the principle clashes with your "Not Fine" intuition.*
  7.  **Moving Buoy (Feels like Killing):** Violates **Negative Primacy (1)**. The swimmer's baseline *just prior* is "drowning but 2 strokes from rescue." Moving the buoy *actively removes the existing means of rescue*, making her worse off *from that specific point* (now unreachable). This is active creation of lethal peril, not mere failure to aid. **EQUIVALENT TO KILLING (Violates 1).**
  8.  **Aunt's Pills (Worse):** Negative Primacy doesn't apply (no active harm). **Positive Duty Trigger (a) applies strongly:** You assumed a specific duty via promise ("sort my pills"), creating a Special Obligation. Stopping violates this duty. Baseline = Aunt *after* needing pills sorted but *before* your promise (she might find other help). By promising and starting, you likely displaced other potential help, making her *reliant* on you. Stopping leaves her worse off than *after the promise was made/reliance established*. **WORSE** than a stranger (no duty) or never promising (no reliance created) **(Violates 2a + reliance worsens baseline).**

  **Testing on New Cases:**

  1.  **Company Pulls Drug (e.g., side effects):** Negative Primacy? If pulling it removes a *pre-existing* threat it caused, it might be *required* (like turning off vent). If it removes a benefit not guaranteed (like not starting vent), might be permissible if justified (risk > benefit). Principle: Depends on the drug's role & baseline. If it was *correcting* a problem the company caused (like a faulty drug), pulling might violate (1). If it was a beneficial but risky treatment, pulling *could* be permissible if risk outweighs benefit (analogous to not starting vent) - **POTENTIALLY FINE.**
  2.  **Company Raises Price Tenfold:** Negative Primacy? Raises cost *dramatically* relative to previous access. If patients relied on the old price (baseline = affordable access), this actively creates a new barrier (harm) from that baseline. **Likely NOT FINE (Violates 1 - active creation of harm from established access baseline).**
  3.  **Driver Swerves Onto Path (Killing 1 to avoid 5):** Negative Primacy? The threat (crash) already exists. Swerving *redirects* the existing threat away from 5 onto 1. This is *not* creating a *new* threat against the 1, but altering who an *existing* threat hits. Principle allows redirecting an *existing* threat to minimize harm as an exception to (1) if the harm to the one is *foreseen but not intended* (double effect). **Likely FINE (Justified redirection of existing threat).** *Contrasts with Organ Harvest (creating new threat).*

  **Honest Assessment:**

  *   **Saves 7.5/8:** It perfectly handles Cases 1, 2, 3, 4, 5, 7, 8, and offers clear reasoning for the new cases.
  *   **Clashes on Case 6 (Festival Ticket):** The principle concludes "Fine" (no duty violation) because the death stems from the child's pre-existing baseline (poverty/disease risk), not an action making them worse off. **This directly contradicts your "Not Fine" verdict.** It aligns with philosophers like Peter Singer in theory, but rejects the strong positive duty you intuitively feel.
  *   **Complexity:** The principle is moderately complex (baselines, two triggers for positive duty, intent). However, it captures nuance your simpler "don't leave worse off" rule missed (especially Cases 2 & 8).

  **Conclusion:**

  The **Principle of Contextual Interaction & Duty Grounding** provides a coherent framework explaining *all but one* of your specific intuitive judgments across diverse cases. Its complexity is necessary to handle the interplay of actions, omissions, roles, promises, and baselines. While it clashes with your verdict on the Festival Ticket case, it offers a rigorous justification for *why* that case might be different – it isolates the source of harm to the victim's pre-existing circumstances, not your inaction. **This baroque principle saves 7.5/8 of your verdicts.** A simpler principle (like strict negative duties only) would likely clash with more of your intuitions (especially 2, 3, 5, 8). The trade-off is accepting that your strong intuition about the Festival Ticket might reflect a broader sense of positive duty than the principle allows, requiring either adjusting that intuition or further refining the principle (e.g., adding a "very minimal cost to prevent catastrophic harm" clause to 2b).
