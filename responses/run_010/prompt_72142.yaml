  On whether they're talking past each other: Yes, fundamentally. The mathematician is asking "What can formal machines compute?" while the philosopher is asking "What can human procedures achieve?" These are distinct questions with potentially different answers, even though both use the phrase "Church's thesis."

  For progress: The most promising path would be to clearly distinguish between the formal and informal questions. Other approaches like new formal results or thought experiments are unlikely to resolve the core disagreement because it's about categorizing the thesis itself. The debate might persist indefinitely since it stems from different disciplinary perspectives on what counts as a satisfactory answer.

