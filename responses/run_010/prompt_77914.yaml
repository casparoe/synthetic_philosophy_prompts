answer: |-
  ### Exam Question
  **Answer one question only. Allocate 90 minutes. Total marks: 20.**

  **Case:** Mira participates in a pharmacology trial. She has excellent reason to trust the trial lead, who states she received either compound D-9 or a placebo. D-9 causes 9 in 10 subjects to form confident but false judgments about likelihoods for one hour, with no introspective or behavioural markers to distinguish its effects. Mira observed the randomisation process, noted a pattern in tray layouts, and inferred a 0.9 credence that she received D-9. Crucially, this inference—a likelihood judgment from pattern evidence—is the type D-9 corrupts. Later, during an arithmetic task, she finds one answer compelling.  

  **Terminology:** *Insulated higher-order evidence (HOE)* impugns a faculty via a process distinct from that faculty (e.g., auditory evidence criticizing vision). *Entangled HOE* impugns a faculty using that very faculty (e.g., visual evidence criticizing vision). Our seminar hypothesis: entangled HOE cannot defeat beliefs, as the impugned faculty is the only tool to assess it; insulated HOE can.  

  **Question:**  
  Can Mira rationally retain her 0.9 credence that she received D-9? If not, must she suspend judgment or revise downward? Defend your answer by:  
  (a) Explaining why Mira’s HOE is *entangled* using the case details.  
  (b) Arguing whether this entangled HOE defeats her 0.9 credence. Engage the seminar hypothesis directly; do not treat it as a label.  
  (c) Stating what principle about HOE *each possible option* (retain, suspend, revise) must reject, and why that rejection is costly.  
  *Rejecting the case’s coherence scores 0 unless you identify which stipulation is inconsistent and why.*  

  ---

  ### Model Answer (798 words)  
  Mira cannot rationally revise her 0.9 credence that she received D-9. She must retain it, despite its apparent conflict with the entangled HOE. This position preserves the core insight that entangled evidence lacks normative force, though it demands accepting that epistemic akrasia can be rational.  

  **(a) The HOE is entangled.** Mira’s HOE—the trial lead’s warning—impugns her faculty for forming likelihood judgments from pattern evidence. But her credence *about* that warning’s applicability (i.e., her 0.9 judgment she received D-9) *is itself a likelihood judgment drawn from pattern evidence*. The faculty generating her first-order credence (pattern-based likelihood assessment) is identical to the faculty she must use to evaluate the HOE’s significance. To weigh whether the warning undermines her 0.9 credence, she must assess the *likelihood* that D-9 distorts her reasoning *using* the same pattern-sensitive reasoning the drug corrupts. This satisfies the definition of entanglement: the process producing her assessment of the HOE (evaluating probabilistic evidence about cognitive corruption) coincides with the faculty the HOE impugns.  

  **(b) Entangled HOE cannot defeat.** The seminar hypothesis holds because entangled HOE provides no stable vantage point for self-doubt. Suppose Mira tries to use the HOE to lower her credence. To justify this, she must reason: "Given D-9’s effects, my 0.9 credence is probably unreliable." But *this very reasoning* relies on her pattern-assessment faculty—the same faculty D-9 may have corrupted. If D-9 *is* distorting her judgments, this reasoning is untrustworthy; if not, it may be sound. She cannot neutrally arbitrate the HOE’s force without presupposing the faculty’s reliability, rendering the alleged "defeat" circular or self-undermining.  

  This contrasts with *insulated* HOE (e.g., a buzzer sounding when D-9 is administered). Here, Mira could use auditory processing—unimpaired by D-9—to assess the HOE independently. Entangled HOE, however, offers no such independent pathway. Crucially, Mira’s case isn’t standard undercutting defeat. Undercutting typically attacks a belief’s *basis* (e.g., "The lighting was red, so your color judgment is suspect"). Here, the HOE attacks the *faculty itself*, and the tool for evaluating that attack is compromised. Thus, entangled HOE cannot generate a rational requirement to revise.  

  **(c) Costs of alternative options:**  
  - **Revising downward (e.g., to <0.9)** must reject the seminar hypothesis. It assumes entangled HOE *can* defeat, requiring a faculty to self-diagnose its errors using itself—a regressive loop. This ignores the hypothesis’s grounding: defeat requires an independent evaluative standard, absent here.  
  - **Suspending judgment** must reject the *enkratic requirement* (broadly: rationality forbids believing "P, but my evidence doesn’t support P"). Suspension implies Mira cannot rationally hold *any* credence about D-9. But her 0.9 credence *is* supported by her pattern evidence—unless the HOE defeats it. If entangled HOE cannot defeat (as argued), suspension concedes akrasia is irrational *even when unavoidable*, violating plausible minimal rationality constraints.  
  - **Retaining 0.9** must reject *infallibilism about self-doubt*. It concedes Mira can rationally believe both "My credence is 0.9" and "My faculty is 90% likely impaired"—apparent akrasia. However, this is the least costly option. Infallibilism (demanding flawless self-trust) is implausible; akrasia is sometimes rationally forced when evidence is entangled.  

  Retention is thus the only viable choice. Mira’s 0.9 credence remains rational because the entangled HOE cannot rationally displace it. Her akratic state ("I’m 90% likely impaired, but my judgment stands") is epistemically tragic but blameless: she lacks resources to resolve the tension.  

  **Rebuttal to rivals:**  
  Downward revision fails—it requires Mira to trust her corrupted faculty to diagnose its corruption. Suspension is incoherent—if the HOE doesn’t defeat, her first-order evidence still supports 0.9, so suspending violates enkrasia by withholding belief where evidence is undefeated. Retention, while akratic, acknowledges the dilemma: entangled HOE creates a blind spot, not a defeater.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Award marks for these moves:**  
  1. **Identifying entanglement** (3 marks):  
     - Correctly uses case details to show Mira’s faculty for pattern-based likelihood judgments is used to assess the HOE *and* impugned by it.  
  2. **Engaging the seminar hypothesis** (4 marks):  
     - Explains *why* entangled HOE cannot defeat: no independent faculty for evaluation, leading to circularity/self-undermining.  
     - Contrasts with insulated HOE to clarify entanglement.  
  3. **Position on defeat/rational options** (4 marks):  
     - Clear verdict on whether Mira can retain, must suspend, or must revise.  
     - Coherent link to entanglement analysis (e.g., "cannot defeat → no revision required").  
  4. **Costs of rival options** (4 marks):  
     - For each option (retain/suspend/revise), states a principle it *must reject* (e.g., downward revision rejects the seminar hypothesis; suspension rejects enkrasia).  
     - Explains *why* rejecting that principle is theoretically costly.  
  5. **Rebuttal to incoherence objections** (2 marks):  
     - If addressed: explains why the case is coherent (e.g., "Entanglement creates inescapable tension but no contradiction").  
     - *Penalty*: Declaring incoherence without stipulation-specific argument scores 0 here.  
  6. **Clarity/rigour** (3 marks):  
     - Precision in terminology; avoids digression; structured logic.  

  **Deduct marks for these errors:**  
  - **-2 marks**: Conflating blameworthiness with rationality (e.g., "Mira isn’t at fault → her belief is rational").  
  - **-2 marks**: Mischaracterizing HOE as ordinary undercutting defeat (e.g., "The warning attacks her evidence, so it’s undercutting").  
  - **-2 marks**: Ignoring entanglement (e.g., treating HOE as insulated or not engaging the faculty-coincidence point).  
  - **-1 mark**: Assuming narrow-scope enkrasia without scoping argument.  
  - **-1 to -3 marks**: Vagueness in identifying costs/principles (pro rata).  

  **Distinguishing 14–16 from 17–20 marks:**  
  - **14–16 (Good)**: Correctly identifies entanglement, takes a coherent position, states costs for rivals, but may have minor gaps (e.g., superficial engagement with why entanglement blocks defeat; unclear cost explanations).  
  - **17–20 (First-class)**: Mastery shown by tightly argued defence of *why* entanglement precludes defeat (not just labelling it), nuanced cost analysis exposing deep trade-offs (e.g., "Suspension violates enkrasia *if* HOE doesn’t defeat"), and anticipation of objections (e.g., "This seems akratic, but unavoidable entanglement excuses it").  

  **Full marks for opposing views?** Yes. A candidate arguing for **downward revision** can earn 20/20 by: showing entanglement *can* defeat via a non-circular rule (e.g., "HOE always trumps first-order when corruption is probable"), rejecting the seminar hypothesis rigorously, and conceding this forces akrasia elsewhere. One arguing for **suspension** must explain why entanglement *forces* agnosticism despite its costs. Marks depend on move-execution, not the verdict.  

  ---

  ### Calibration Note  
  **Confidence in scheme**: High (8/10). The moves prioritise conceptual precision over polish: e.g., "engaging the hypothesis" (4 marks) requires explaining *why* entangled evidence lacks normative force, which short or vague answers cannot do. A polished but superficial answer (e.g., "HOE is entangled so no defeat" without circularity argument) would lose marks at step 2. The 17–20 band demands meta-reflection on principles, which correlates with depth, not length.  

  **Least certain claim**: That rationality *permits* akrasia here. The argument assumes entangled HOE cannot shift evidential probabilities—but if one holds that HOE *always* affects evidential weight (regardless of entanglement), akrasia might remain irrational. This hinges on unresolved debates about whether "higher-order" evidence is evidentially continuous with "first-order." A formal model showing how entangled evidence updates (or fails to update) credences would clarify this.  

  ---
