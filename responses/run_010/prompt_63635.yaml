answer: |-
  Here's how we can construct your inverted bucket scenario and trace its implications. Imagine an isolated universe containing two components: a bucket of water at the very center, perfectly still relative to the distant cosmic horizon, and an immensely massive, rigid, thin spherical shell surrounding it at a great distance. This shell is rotating uniformly at a constant angular speed. Crucially, we stipulate a strong "dragging" effect: the rotation of the shell *completely determines* the local inertial frames throughout the enclosed volume. Any object inside, if isolated, naturally comes to rest relative to the shell's rotating frame. The bucket itself is mechanically prevented from rotating *with* the shell; it is fixed, maintaining zero angular momentum relative to the distant, non-rotating reference frame we'd define in an empty universe. The shell is so massive that its gravitational influence dominates everything inside.

  The substantivalist, committed to absolute space (or a fixed spacetime metric), analyzes the situation. They see the bucket as genuinely *rotating* relative to absolute space. The bucket is stationary relative to the fixed "background," but the local inertial frames—defined by free-falling test particles—are being dragged by the shell. For the substantivalist, rotation is absolute motion relative to this background structure. Since the bucket is fixed against this background while the local inertial frames whirl around it due to the shell's dragging, the substantivalist concludes the bucket is absolutely rotating. Absolute rotation implies centrifugal forces: the water should climb the sides of the bucket. They predict a concave surface.

  The Machian relationist sees things differently. For them, motion is *only* relative to other matter. The only significant matter in this universe is the rotating shell and the bucket. The bucket is *not rotating* relative to the shell; it is stationary relative to that distant matter. The water inside the bucket is also stationary relative to the shell. Since there is no relative motion between the bucket/water and the only other reference frame (the shell), the relationist insists there is no rotation happening here at all. Without relative rotation, there are no centrifugal forces. They predict the water's surface remains flat.

  The stipulated dragging effect delivers precisely the local inertial frame rotation induced by the shell. Because we stipulated *complete* dragging, free particles released near the bucket would orbit as if attached to the shell's rotation. But crucially, the *bucket itself* is anchored, resisting this dragged motion. An observer beside the bucket, using a spirit level (which aligns with the local inertial frame), would find the instrument tilted. The water's surface, seeking to be perpendicular to the vector sum of gravity and the *effective* gravity from inertial forces, would form a distinct concave shape. The water climbs the walls. The experimental result matches the *substantivalist's* prediction of concave water, not the relationist's prediction of flat water. The single feature doing the work is the **completeness of the frame-dragging**. If the dragging were only partial (say 50%), both theories would predict *some* concavity, differing only in degree. If the dragging were zero (no shell influence), the substantivalist predicts concavity (absolute rotation), the relationist predicts flatness (no relative motion to the shell), and the water would be flat (vindicating the relationist in that limit). Full dragging is essential to flip the usual dynamic and pressure the relationist.

  Now, a modern substantivalist (who views spacetime's geometric structure as the arbiter of inertia and rotation, not an ethereal Newtonian container) responds to your inversion. They would agree with the *outcome*: the water is concave because the bucket is rotating relative to the local inertial frames, which are an intrinsic part of the spacetime's metric structure, dynamically shaped by the mass-energy (the shell). They see no pressure on *their* position. The dragging effect is simply how matter influences the metric. Rotation is defined by deviation from local geodesics (inertial paths). The anchored bucket *is* accelerating (rotating) relative to those geodesics, hence the centrifugal effects. The "absolute space" of Newton is replaced by the dynamic, matter-influenced metric field, but the core idea of motion relative to spacetime structure remains. For them, your scenario confirms their view: the metric structure dictates inertia, and the bucket rotates relative to it.

  This exposes the crux: does the case collapse into a quarrel over words? Almost. The modern substantivalist and a sophisticated relationist (who accepts the metric as a real, non-material structure) *agree entirely on the physical predictions* in this and all scenarios. They agree the water is concave here due to rotation relative to the local inertial frames defined by the metric. The disagreement becomes purely metaphysical: is the metric structure a *substance* (substantivalism) or is it ultimately a *relation* between material events (a sophisticated relationism à la Leibniz or modern structural realism)? The *detectable* difference vanishes because both grant the metric's physical reality in determining motion. Your inversion successfully shifts pressure onto a crude relationism that tries to define rotation *solely* by direct relative motion to *other visible matter* (the shell), ignoring the mediating role of the metric/inertial structure shaped by all matter. But against a modern view incorporating spacetime geometry, the bucket argument loses its bite as an *empirical* discriminator. It highlights a metaphysical choice about the ontological status of spacetime structure, not a disagreement about measurable outcomes. Your construction isn't a dud—it brilliantly exposes the limitations of crude relationism—but it confirms that within contemporary physics, the substantivalism/relationism debate hinges on interpretation, not experimental test. The bucket argument's original "target" (a naive relationism ignoring inertial structure) remains valid, but the ground has shifted.
