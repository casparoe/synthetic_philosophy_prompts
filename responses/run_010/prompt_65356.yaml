  The crack might be that in practice, when applying the theorem, we might have additional context that fixes scales. For example, if we assume all individuals have the same utility function for money, then scales are fixed. But that's a strong assumption and not based on the theorem itself. The theorem doesn't provide that; it's an additional ethical choice.

