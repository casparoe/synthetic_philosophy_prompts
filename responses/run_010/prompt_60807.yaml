answer: |-
  ### Ordered Menu of Theses: "Meaning Isn't in the Head"  
  Here, I lay out distinct interpretations of your colleague's slogan, ordered from weakest (least controversial) to strongest (most contentious). For each, I specify:  
  - **Formulation**: Precise statement of the thesis.  
  - **Verdict**: Platitude (uncontroversial truth), Defensible (substantive but supportable), or False.  
  - **Twin Earth (TE) Establishment**: Whether TE cases (e.g., Water/H₂O vs. XYZ) establish this. "Yes" = TE is sufficient; "Partial" = TE supports but isn't conclusive; "No" = TE irrelevant or insufficient.  
  - **Division of Labor (DoL) Establishment**: Whether DoL considerations (reference depending on experts) independently establish this. "Yes," "Partial," or "No."  
  - **Compatibility with 2Dism**: Whether the thesis conflicts with your view (primary intensions narrow, secondary wide). "Compatible" = no conflict; "Incompatible" = conflicts.  
  - **Axes of Variation**:  
    - **Meaning Notion**: Semantic value (e.g., truth-conditional content), Extension (reference/truth-value), Cognitive Significance (how thoughts are grasped), Psychological State Type (states individuated for psychological explanation).  
    - **"In the Head"**: Intrinsic State (determined solely by internal physical properties), Accessible (introspectively available), or Fixing Reference (sufficient to determine reference alone).  
    - **Scope**: Individual (one speaker) or Community (linguistic group).  
    - **Range**: All Expressions, or Restricted (natural kinds/indexicals only).  

  ---

  #### Thesis 1: Weak Individual Extension Externalism  
  - **Formulation**: For some expressions (e.g., natural kind terms), an individual's intrinsic state does not determine the extension of their terms.  
  - **Verdict**: Platitude.  
  - **TE Establishment**: Yes (directly shown: Oscar and Twin Oscar share intrinsic states but "water" refers to H₂O/XYZ).  
  - **DoL Establishment**: Partial (DoL reinforces this for terms relying on experts, but TE alone suffices).  
  - **Compatibility with 2Dism**: Compatible (you concede secondary intensions—which determine extension—are wide).  
  - **Axes**:  
    - Meaning Notion: Extension.  
    - "In the Head": Intrinsic State + Fixing Reference.  
    - Scope: Individual.  
    - Range: Restricted.  

  #### Thesis 2: Community-Wide Extension Externalism  
  - **Formulation**: For some expressions (e.g., natural kind terms), a linguistic community's collective intrinsic states do not determine extension, as reference depends on external factors (e.g., environment or experts).  
  - **Verdict**: Platitude.  
  - **TE Establishment**: Partial (TE focuses on individuals; DoL is better suited).  
  - **DoL Establishment**: Yes (e.g., "gold" refers via expert knowledge, not average speaker's state).  
  - **Compatibility with 2Dism**: Compatible (again, secondary intensions are wide and community-dependent).  
  - **Axes**:  
    - Meaning Notion: Extension.  
    - "In the Head": Intrinsic State + Fixing Reference.  
    - Scope: Community.  
    - Range: Restricted.  

  #### Thesis 3: Semantic Value Externalism for Natural Kinds  
  - **Formulation**: For natural kind terms and indexicals, an individual's semantic value (e.g., truth-conditional content) is not fixed by their intrinsic state.  
  - **Verdict**: Defensible.  
  - **TE Establishment**: Yes (TE shows truth-conditions vary while intrinsic states are identical).  
  - **DoL Establishment**: Partial (DoL shows semantic value relies on community, but TE suffices for individuals).  
  - **Compatibility with 2Dism**: Compatible if "semantic value" = secondary intension; Incompatible if it includes primary intension (your view treats primary as part of semantic value and narrow).  
  - **Axes**:  
    - Meaning Notion: Semantic Value.  
    - "In the Head": Intrinsic State + Fixing Reference.  
    - Scope: Individual.  
    - Range: Restricted.  

  #### Thesis 4: Global Semantic Value Externalism  
  - **Formulation**: For all expressions, an individual's semantic value is not fixed by intrinsic state alone.  
  - **Verdict**: Defensible for natural kinds/indexicals; False for other terms (e.g., logical connectives).  
  - **TE Establishment**: No (TE targets natural kinds; irrelevant for, e.g., "bachelor").  
  - **DoL Establishment**: No (DoL is restricted to specific terms).  
  - **Compatibility with 2Dism**: Incompatible (you hold primary intensions are narrow components of semantic value for all expressions).  
  - **Axes**:  
    - Meaning Notion: Semantic Value.  
    - "In the Head": Intrinsic State + Fixing Reference.  
    - Scope: Individual.  
    - Range: All Expressions.  

  #### Thesis 5: Cognitive Significance Externalism  
  - **Formulation**: An individual's cognitive significance (e.g., how a thought is understood or reasoned with) is not determined by intrinsic state.  
  - **Verdict**: False.  
  - **TE Establishment**: No (Oscar and Twin Oscar have identical cognitive access to "water" thoughts; TE doesn't show cognitive differences).  
  - **DoL Establishment**: No (irrelevant to subjective grasp).  
  - **Compatibility with 2Dism**: Incompatible (primary intensions are defined by cognitive significance and narrow).  
  - **Axes**:  
    - Meaning Notion: Cognitive Significance.  
    - "In the Head": Intrinsic State.  
    - Scope: Individual.  
    - Range: All Expressions.  

  #### Thesis 6: Psychological State Externalism  
  - **Formulation**: Psychological state types (e.g., beliefs individuated for explanatory purposes) are not fixed by intrinsic state.  
  - **Verdict**: Defensible but contested (e.g., in debates over "broad" vs. "narrow" psychology).  
  - **TE Establishment**: Partial (motivates broad views but doesn't force them; internalists argue states can be typed narrowly).  
  - **DoL Establishment**: No.  
  - **Compatibility with 2Dism**: Incompatible (your view implies primary intensions capture a narrow psychological state type).  
  - **Axes**:  
    - Meaning Notion: Psychological State Type.  
    - "In the Head": Intrinsic State.  
    - Scope: Individual.  
    - Range: All Expressions.  

  #### Thesis 7: Strong Global Externalism  
  - **Formulation**: Nothing recognizable as "meaning" (semantic value, cognitive role, or psychological type) is fixed by intrinsic state for any expression.  
  - **Verdict**: False (overreaches; e.g., narrow content is defensible for non-TE-vulnerable terms).  
  - **TE Establishment**: No (TE targets extensions/semantic values, not all meaning aspects).  
  - **DoL Establishment**: No.  
  - **Compatibility with 2Dism**: Incompatible.  
  - **Axes**:  
    - Meaning Notion: All of the above.  
    - "In the Head": Intrinsic State.  
    - Scope: Individual + Community.  
    - Range: All Expressions.  

  ---

  ### The Weakest Reading Licensing Dismissal  
  **Thesis Licensing Dismissal**: Thesis 4 (Global Semantic Value Externalism).  
  - **Why?** It asserts that no aspect of semantic value is narrow for any expression, directly opposing your claim that primary intensions are narrow components of semantic value. If true, your project collapses, as "narrow content" couldn't be semantically relevant.  
  - **Entitlement from Twin Earth?** No. TE only establishes restricted claims (Theses 1–3), showing that extensions and secondary intensions for natural kind terms are wide. It doesn't touch primary intensions or non-TE-vulnerable terms (e.g., "pain" or logical concepts). TE is silent on whether semantic value includes a narrow layer.  

  **What the Two-Dimensionalist Concedes**:  
  - That **secondary intensions are wide** (established by TE for natural kinds).  
  - That **extension isn't fixed individually** (supported by TE/DoL).  
  - That **no "full" meaning** (e.g., reference-determining content) is narrow.  

  **Burden Shifts To**: The question of whether **primary intensions are a legitimate, contentful, and explanatory level of meaning**. Specifically:  
  - Do primary intensions (as narrow, a priori accessible functions) play a substantive role in cognition, rationality, or intentional explanation that wide content cannot?  
  - If they do, then narrow content is vindicated as a component of meaning—even if reference is wide. Your colleague must then argue either that (a) primary intensions aren't genuinely contentful (e.g., they're "merely" linguistic or computational), or (b) they don't recover anything useful for philosophy of mind (e.g., they fail to explain behavior).  

  This reframes the debate: not about relitigating TE, but about whether two-dimensional machinery provides a post-externalist account of narrow content that does necessary work. Your project survives if you can meet this burden.
