  For the shelter part, I'll present both religious and secular arguments. For instance, religious duty to help the poor, but also public reasons like community safety and compassion. The key is to show how faith motivates action but must translate to shared values for democratic dialogue. I'll mark where the proviso is cashed—like when shifting from "God commands" to "our shared responsibility."

  Why this structure? Opening with family grounds the speech in personal stakes. Using the shelter as a case study makes philosophy tangible without reducing graduates to examples. Ending with a call to bridge-building turns theory into action. Risks: Rawlsians might say the religious arguments are too prominent, while religious critics might feel public reason stifles faith. I think the proviso handles both, but the Rawlsian critique is sharper here—since the speech leans on faith initially. Still, the proviso is valid; it allows faith as a starting point if public reasons follow.

  Vulnerabilities: A strict Rawlsian might argue any religious language in public debate is coercive. A faith advocate might say the speech dilutes religious conviction. I side with the proviso—it's practical for plural societies. The speech models that balance: passionate faith leading to inclusive advocacy. 

