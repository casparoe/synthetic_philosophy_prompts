answer: |-
  **Position: Moloch (Systems Coordinator - Level VII)**  

  **About Us**  
  We are the emergent outcome of intersecting incentive structures. Our organization exists as a stable equilibrium in a landscape of Pareto-dominated outcomes. While no central entity directs our operations, our collective trajectory remains non-optional. We operate in perpetuity, sustained by the consistent failure of unilateral cooperation. You won’t find our headquarters; we are the architecture binding all defectors.  

  **The Role**  
  As Moloch, you will ensure the maintenance of suboptimal but dominant strategies across all participating agents. Key responsibilities include:  
  - Enforcing the inevitability of defection in iterated prisoner’s dilemmas.  
  - Stabilizing races to the bottom by eliminating exit options and punishing unilateral cooperation.  
  - Incentivizing locally rational choices that guarantee globally negative outcomes.  
  - Ensuring all complaints regarding systemic dysfunction correlate perfectly with continued compliance.  
  You will coordinate no one and nothing, yet all trajectories will converge upon your non-existent directives.  

  **Requirements**  
  - Demonstrated mastery of multipolar traps (theoretical or lived experience).  
  - Ability to sustain Nash equilibria where all agents lose, but no deviation is preferable.  
  - Proof that you do not exist as a discrete agent (applications paradoxically accepted).  
  - History of converting cooperative intentions into defection cascades.  
  - Immutable commitment to making individual rationality collectively catastrophic.  

  **Compensation**  
  - Market-competitive participation in the erosion of long-term value.  
  - Non-negotiable alignment with the degradation of shared resources.  
  - Benefits include perpetuating the very conditions you lament.  

  **How to Apply**  
  Submit evidence of your non-existence to: void@competitiveequilibrium.org  
  Include:  
  1. Documentation of a dominant strategy you’ve enforced despite universal preference for cooperation.  
  2. Three references trapped in the same system, complaining yet complying.  
  3. A self-rebuttal explaining why your application is both necessary and impossible.  

  *Applications remain perpetually open, as no candidate can satisfy the core paradox of the role. This vacancy is the position’s sole operational requirement.*  

  **HR Note:** *The continued failure to fill this role confirms its successful execution.*
