prompt: |-
  I am in Year 13 at a comprehensive in West Yorkshire, and I am writing my EPQ on the question of whether an individual act can be wrong when it makes no difference to anyone. I have got to the point where the general arguments feel familiar to me — the claim that my driving, my chicken and my ballot are each causally impotent, the reply that this reasoning would exonerate everyone in any large-scale harm, and the suggestion that what I should really be tracking is the probability of making a difference rather than the certainty of it. What I have not been able to settle is whether my own judgement is consistent with any of these positions, so I have been writing down my actual verdicts on cases and I would like to know what principle, if any, they add up to. Please reason from the cases themselves rather than from who has said what; I would rather not be sent a reading list, because I have no way of checking it and it would not help me decide anything.

  Here are the verdicts. Not voting in our school council election last term felt to me like a genuine moral failure, not merely an imprudent one, even though the winner beat the runner-up by 214 votes out of roughly 900 cast and I cannot construct any story on which my ballot was decisive. Buying a supermarket chicken I think is wrong, though I accept the objection that the store orders in fixed batches weeks in advance, so my purchase causes no additional bird to be reared or killed. But when I buy a fish that is already dead on the market slab — where the boat has landed what it landed and will go back to sea regardless of what I do — I think that is at least as wrong as the chicken, and possibly worse, which is the first pair I cannot make sense of, since on the causal story I tell myself about chicken the fish should be clearly less objectionable. Buying one of the last two portions on a counter, when I know the shop restocks to match what has sold, feels straightforwardly wrong in a way that an ordinary purchase does not, and I recognise that the only difference is supposed to be one of probability. Donating fifty pounds to an appeal that pays out only if it reaches a target it almost certainly will not reach, I think is a waste of money but not wrong, and I would feel no guilt about it — the second pair I cannot reconcile, since the chance of my matter there is arguably no smaller than in the restocking case. Signing a petition with 900 names, which is even less likely to change anything than a vote, I felt better about doing than I did about voting, and would have felt worse about refusing. Leaving the lights on in an empty classroom seems barely wrong and leaving my charger plugged in overnight not wrong at all, yet I think each pupil who does either is doing something wrong, and I think the one pupil who does it in a school where every other pupil already does it is just as wrong as the rest — a claim that surprises me when I write it down. Relatedly, if a thousand people each raise the suffering of a victim by an imperceptible amount I think each is wrong, but if nine hundred and ninety-nine have already gone as far as they can and the thousandth adds an increment that is now plainly perceptible, I think he is much worse than the others, and not merely by a hair. Someone who flies to Spain twice a year but eats no meat strikes me as doing better than someone who never flies and eats meat every day, and I cannot justify this, since neither makes a difference to anything. And I feel good about using a reusable cup, do not believe it makes a difference, resent being told I do it only to feel good, and cannot say it is anything more than that.

  What I want from you is a principle, or a small set of rival candidates, stated precisely enough that I could apply it to a case I have not thought of, with each clause tied to the particular verdict above that motivates it. Then tell me what it says about the cases I have left out: the end-of-year trip, where the coach is hired whatever happens and there are two spare seats, so that my going costs nothing and adds no emissions, while the train option might see an extra carriage attached if enough of us book — I take the coach seat to be obviously permissible and the train seat to be not obviously permissible, which looks backwards if marginal emissions are what matters; whether "I am only one person" is ever a legitimate excuse, or only ever a true statement; and whether the same principle will require me to vote in the general election once I turn eighteen next year. Finally, say honestly which of my verdicts has to go: I would rather be told that a principle saving all of them would be so baroque as to be suspect, and shown which single judgement is the cheapest to abandon, than be handed a theory that quietly reinterprets everything until the tension disappears. Please also say whether recasting the problem in terms of expected harm resolves it or simply relocates it, and write throughout in British English.
reasoning: |-
  Hmm, this is a sophisticated ethical dilemma from a Year 13 student working on their EPQ. They've clearly done substantial groundwork on the problem of inconsequential actions but are frustrated with existing frameworks. What they're seeking isn't more theory but a principle derived from their own intuitive judgments across varied cases.

  The core tension lies in their inconsistent responses to seemingly analogous situations. For instance, they condemn buying supermarket chicken (where their purchase doesn't affect supply) yet feel equally uneasy about buying already-landed fish – which should be less objectionable on causal grounds. Similarly, they judge buying the last portion before restocking as wrong but donating to a futile fundraiser as merely wasteful. Their challenge is to find coherence in these positions without forcing artificial consistency.

  Notably, they're adamant about avoiding theoretical name-dropping or reading lists – a refreshing constraint that demands grounding in their lived moral intuitions. Their cases span consumption (chicken, fish), civic acts (voting, petitions), resource use (lights, chargers), and collective harm scenarios. The three omitted cases (school trip, "only one person" excuse, future voting) will serve as test points for any proposed principle.

  Key observations from their verdicts: 
  - They assign significance to institutional participation (voting > petition)
  - Perceived wastefulness triggers guilt only when linked to replaceability (restocking portion) 
  - They reject purely aggregative thinking (lights/charger cases) 
  - Harm visibility modulates blame (imperceptible vs perceptible increment) 
  - Lifestyle comparisons defy causal impact (flying vs meat-eating)
  - Symbolic acts hold value independent of efficacy (reusable cup)

  The student explicitly requests: 
  1) A principle tied to specific verdicts 
  2) Application to omitted cases 
  3) Identification of which verdict must be sacrificed 
  4) Assessment of expected harm frameworks 
  5) British English throughout

  Their intellectual honesty is impressive – they'd rather abandon one judgment than accept strained reconciliations. This suggests the solution may lie in a hybrid principle combining participatory norms with conditional wrongness in structured contexts.
answer: |-
  Below is a synthesis of your verdicts into a coherent ethical principle, followed by its application to your omitted cases, an assessment of expected harm, and identification of the verdict requiring revision. The principle is constructed directly from your stated intuitions and avoids importing external theories.

  ### Proposed Principle: The Structural Complicity Standard
  An individual act is wrong if:
  1.  **It constitutes participation in a harmful system** (motivated by: chicken/fish purchases, supermarket restocking, voting), AND
  2.  **The system operates on predictable aggregate participation** (motivated by: chicken supply, voting, lights/charger cases, imperceptible increments), AND
  3.  **The act expresses endorsement of the system's harm or failure to resist it when feasible alternatives exist** (motivated by: voting vs. petition, reusable cup, flying vs. meat-eating, fish feeling "worse").

  **Clause 1 (Participation):** Your guilt over chicken/fish, voting, and the last portion stems from seeing yourself as an active *participant* in a harmful practice (factory farming, electoral apathy, resource depletion), even when your causal impact is negligible. The wrongness arises from your role *within* the harmful structure.  
  **Clause 2 (Predictable Aggregates):** Systems like poultry supply, electricity grids, or collective harms rely on mass participation being predictable. Your verdicts on lights/chargers ("each pupil wrong") and imperceptible increments ("each is wrong") show you reject exonerating individuals simply because harm is overdetermined. The system’s harm requires many like you, and your act is part of that predictable pattern.  
  **Clause 3 (Endorsement & Feasibility):** This distinguishes cases where similar probabilities feel differently wrong. Signing a petition feels less obligatory than voting because voting is a core civic duty – refusing it signals stronger endorsement of apathy. Using a reusable cup expresses rejection of waste culture, even if ineffective alone. Conversely, donating to a hopeless appeal isn't "wrong" because it expresses anti-harm sentiment without endorsing harm. The fish feels "possibly worse" than chicken because choosing a dead fish when alternatives exist feels like a clearer endorsement of exploitation, given the direct visibility of harm.

  ### Application to Omitted Cases
  1.  **School Trip (Coach vs. Train):**  
      - *Coach:* Permissible. Clause 1 fails – occupying a spare seat doesn’t participate in *causing* emissions (coach runs regardless). No endorsement of harm (Clause 3).  
      - *Train:* Potentially wrong. Clause 1 applies if booking a seat increases the probability of an extra carriage (participation in emissions). Clause 2 applies (rail operators respond predictably to aggregate demand). Clause 3 applies if lower-emission alternatives exist (e.g., coach). Your intuition holds: the coach is permissible; the train requires justification (e.g., no feasible alternative).  

  2.  **"I am only one person" Excuse:**  
      Never a *legitimate moral excuse* under this principle, though it may be factually true. If Clauses 1 and 2 apply (systematic harm + predictable aggregates), your participation is still wrongful complicity (Clause 3). The excuse only highlights your causal insignificance, not your moral disconnection.  

  3.  **General Election Vote:**  
      Required. Clause 1 (participation in democracy), Clause 2 (elections hinge on predictable aggregates), and Clause 3 (refusing signals endorsement of apathy/outcomes when alternatives exist) all apply strongly. Failing to vote is a moral failure, mirroring your school council verdict.

  ### Which Verdict Must Go: The Futile Donation
  Your judgment that donating to a futile appeal is "not wrong" (merely wasteful) conflicts most directly with the principle.  
  - **Why it conflicts:** Clauses 1 and 2 arguably apply (participating in a fundraising system that predictably aggregates donations). Clause 3 *should* make refusal feel worse than not signing a petition – refusing expresses indifference to the cause, while donating expresses solidarity. Yet you feel no guilt about refusing.  
  - **Why it's the "cheapest" to abandon:** It’s your only verdict where expressing anti-harm sentiment feels morally optional. Aligning this with your reusable cup/voting intuitions (where expression matters) strengthens consistency. Abandoning "not wrong" doesn’t force revision elsewhere.  
  - **Revised Verdict:** Donating is *not wrong* only if it has symbolic value (Clause 3: expressing solidarity). Refusing is *mildly wrong* if affordable, as it fails to express resistance to suffering when cost-free.

  ### Does Expected Harm Resolve or Relocate the Problem?
  - **Relocates, not resolves.** Expected harm quantifies probability but doesn’t address your core concern: *why* participation in doomed collective harms feels wrong. Your verdicts reject pure expected utility:  
    - Voting has low expected utility but feels obligatory; futile donations have similar low utility but feel optional.  
    - The "last portion" feels uniquely wrong due to *replaceability* (a form of participation), not just higher probability.  
    - Imperceptible increments are condemned despite near-zero *expected* harm per actor.  
  Expected harm *describes* likelihood but doesn’t capture the *relational* wrong (complicity in a harmful structure) or *expressive* dimension (endorsement) driving your intuitions. It pushes the problem back to "Why care about expected impacts of structurally complicit acts?"

  ### Summary
  Your judgments cohere around a principle where wrongness stems from **willing participation in a harmful system that relies on predictable mass complicity, coupled with a failure to express dissent when feasible.** This explains why voting, consuming exploitative goods, or wasting resources in aggregate-dependent systems feels culpable, while isolated symbolic acts (reusable cup) or unavoidable participation (spare coach seat) do not. Abandoning the "no guilt" verdict on futile donations strengthens this consistency. The principle obligates voting in general elections, rejects "only one person" excuses, and reframes expected harm as a symptom, not the cause, of the deeper moral failure: complicity.
