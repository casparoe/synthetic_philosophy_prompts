answer: |-
  ### Joint Statement on Spectrum Arguments and the Transitivity of Betterness  
  **Parties:**  
  - **Single-Scale Consequentialist (SSC)**: Holds that all-things-considered betterness is a single, transitive relation. Cyclic betterness is excluded by dominance reasoning and money-pump arguments.  
  - **Intransitivist (INT)**: Holds that betterness aggregates aspect-relative relations (e.g., intensity, duration) with weights that shift contextually across a spectrum, permitting intransitive cycles without error.  

  #### 1. Agreed Claims (Signed by Both Parties)  
  Both parties endorse the following claims regarding a "hangnail-to-torture" pain spectrum (e.g., states of pain intensity/duration ranging from negligible to extreme):  
  1. **Adjacent Comparability**: For any two adjacent points in the spectrum (e.g., pain *i* vs. pain *i*+1), a genuine, all-things-considered betterness comparison can be made (one is worse, better, or equal).  
  2. **No Sharp Cutoff**: No single step in the spectrum constitutes a "sharp cutoff" where a minimal increase in pain intensity/duration results in a discontinuous jump in badness (e.g., from "not bad" to "very bad").  
  3. **Robustness of Intransitivity Intuition**: The intuition that the spectrum’s endpoints are intransitive (e.g., "hangnail is better than torture, but adjacent pains are worse or equal") is a stable, replicable psychological phenomenon demanding theoretical attention.  
  4. **Dominance Avoidance**: If outcome *A* dominates outcome *B* (i.e., *A* is better in some aspects and worse in none), *A* is better than *B* simpliciter.  
  5. **Non-arbitrariness**: The absence of a sharp cutoff does not imply that all spectrum comparisons are arbitrary or indeterminate.  

  #### 2. Residual Disagreements (Wording Acceptable to Each Side)  
  Each disagreement is stated in language the respective party would use. Disputes flagged as "merely verbal" concern terminology, not underlying facts.  

  | Disagreement                                                                 | SSC Wording                                                                 | INT Wording                                                                                   | Merely Verbal? |  
  |------------------------------------------------------------------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|----------------|  
  | **Nature of "better than"**                                                  | "Betterness" names a single, context-invariant relation governed by transitivity. | "Better than" is a context-sensitive label for shifting aspect-relative relations; no single relation captures all-things-considered betterness. | **Yes** (Dispute hinges on whether the *phrase* denotes one or many relations) |  
  | **Interpretation of Intransitivity Intuition**                               | The intransitivity intuition reveals cognitive limitations in aggregating small differences, not a feature of normative reality. | The intuition reflects the true structure of betterness: weights shift, generating non-transitive cycles absent psychological error. | No |  
  | **Vulnerability to Money-Pumps**                                             | Cyclic preferences would permit exploitable money-pumps, rendering them irrational and practically unsustainable. | Money-pumps fail against rational agents: they can refuse trades by spotting cycles or re-evaluating options holistically. | No |  
  | **Source of Spectrum Puzzles**                                               | Spectrum cases arise from vagueness in comparing small differences; they do not refute transitivity. | Spectrum cases arise from genuine weight shifts; vagueness is secondary or irrelevant. | No |  

  #### 3. Cruxes: Cases and Predictions  
  Each crux is paired with a concrete case both parties agree is probative. Predictions are recorded in advance.  

  **Crux 1: Weight Shifts vs. Vagueness**  
  *Case*: A discrete spectrum of 100 health states differing in pain intensity (1–100) and duration (fixed at 50 years). Adjacent states (*i* vs. *i*+1) differ by 1 unit of intensity. Subjects compare:  
  - **Adjacent pairs** (e.g., 45 vs. 46)  
  - **Mid-spectrum vs. endpoints** (e.g., 10 vs. 90)  
  - **Endpoint reversal** (1 vs. 100)  
  *Control for vagueness*: Intensity differences >20 units are stipulated to be non-vague (e.g., 1 vs. 25 is clearly distinguishable).  
  - **SSC Prediction**: Subjects will judge state 1 better than state 100 consistently. Apparent reversals arise only in vague comparisons (differences <5 units).  
  - **INT Prediction**: Subjects will judge state 1 better than state 100 *and* adjacent states worse, even for non-vague mid-spectrum pairs (e.g., 10 > 90).  

  **Crux 2: Money-Pump Robustness**  
  *Case*: Agents with alleged cyclic preferences (A≻B, B≻C, C≻A) face a series of trades:  
  - **Trade 1**: Pay $1 to swap A for B.  
  - **Trade 2**: Pay $1 to swap B for C.  
  - **Trade 3**: Pay $1 to swap C for A (returning to start, minus $3).  
  Both parties agree rational agents should avoid *net loss*.  
  - **SSC Prediction**: Agents will be money-pumped unless they revise preferences to transitive ones.  
  - **INT Prediction**: Agents will refuse Trade 3 (or any trade completing a cycle) without revising preferences.  

  **Crux 3: Dominance in Hybrid Cases**  
  *Case*: Option A: Mild pain (5/100) for 60 years. Option B: Severe pain (95/100) for 59 years. Option C: Mild pain (5/100) for 1 day + $1,000,000.  
  - **SSC Prediction**: C≻A≻B (transitive chain; C dominates A in resources).  
  - **INT Prediction**: A≻B (duration dominates), C≻A (resources dominate intensity), but B≻C possible if severity/resources weights shift (exposing cycle).  

  #### 4. Evidence Against Own Position  
  **SSC Commitments**:  
  - *What would count as evidence against*: A reproducible case where (a) rational agents exhibit non-vague cyclic preferences *and* (b) avoid money-pumps without revising preferences.  
  - *Would it move SSC?*: Only if cyclic agents avoid exploitation *without* ad hoc constraints (e.g., "I refuse cycle-closing trades"). Current money-pump setups make this unlikely.  

  **INT Commitments**:  
  - *What would count as evidence against*: A spectrum where (a) all pairwise comparisons are non-vague, (b) weights are explicitly fixed (e.g., "intensity always trumps duration"), and (c) transitivity holds.  
  - *Would it move INT?*: Only if weight shifts are excluded by design *and* no auxiliary factors (e.g., framing) explain the data. INT remains unmoved if "fixed weights" imply artificial rigidity.  

  ---  
  **Attestation**  
  Signed in good faith, acknowledging unresolved disagreements as substantive:  
  [SSC Signatory]  
  [INT Signatory]  
  Date: [Date]  

  ---  
  **Annotations**  
  - **Tone Adherence**: Agreed claims (e.g., "no sharp cutoff") preserve substance: SSC still requires transitive ordering; INT still requires weight shifts.  
  - **Non-Papered Disputes**: Disagreements (e.g., money-pumps) are stated without dilution (e.g., SSC insists cycles *must* be irrational; INT denies this).  
  - **Merely Verbal Flag**: The "better than" dispute is flagged as terminological, as SSC and INT agree on the phenomenology but not the semantics.  
  - **Crux Design**: Crux 1 isolates weight shifts from vagueness via non-vague mid-spectrum comparisons.  
  - **Honesty in Evidence**: Both sides admit their criteria for falsification are stringent; neither expects imminent concession.
