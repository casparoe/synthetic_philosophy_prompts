answer: |-
  **MEMORANDUM**  
  **TO:** Collections Committee  
  **FROM:** [Your Name/Position]  
  **DATE:** [Today’s Date]  
  **SUBJECT:** Recommendation on Bequest of Attributed "V" Painting  

  ---

  ### **RECOMMENDATION**  
  **Accept the bequest and formally reattribute the work to "Studio Assistant of V, with signature by V"** for display and records. Decline the donor’s condition that it hang as an autograph work by V. If the donor withdraws the gift due to reattribution, we should respectfully decline the bequest.  

  ---

  ### **SUMMARY OF ISSUES**  
  1. **Forensic Evidence:** Pigment/canvas are period-correct (1890s), but underdrawing and paint application confirm execution by V’s studio assistant. V signed it, and his dealer sold it as his work—a practice V tacitly endorsed.  
  2. **Donor Demand:** The donor insists on displaying it as "by V" or withdraws the gift.  
  3. **Market Context:** Unsigned works by the assistant now command higher auction prices than V’s studio pieces.  
  4. **Committee Divide:**   
     - *Position A:* "Not a fake—no deception occurred historically."  
     - *Position B:* "Not by V—he didn’t paint it."  

  ---

  ### **CORE PRINCIPLE: WHAT ATTRIBUTION REPRESENTS**  
  Attribution must primarily reflect **whose hand executed the work**. Secondary considerations include conception (design) and historical reception. Here:  
  - **Execution:** Assistant’s hand (per conservators).  
  - **Conception:** Unclear (could be V’s design or assistant’s).  
  - **Reception:** Marketed as V’s for a century.  
  **Conclusion:** The painting is *physically* the work of the assistant, supervised by V and signed by him. It is not autograph (by V’s hand).  

  ---

  ### **REASONING FOR REATTRIBUTION**  
  1. **Scholarly Integrity:**  
     - Our duty is to present accurate information to the public. Forensic evidence trumps historical mislabeling. Displaying it as "by V" contradicts our conservation team’s findings and misleads audiences.  
     - **Precedent:** Museums routinely reattribute works (e.g., Rembrandt Research Project). Failing to do so here undermines our credibility.  

  2. **The "No Lie, No Fake" Argument Does Not Survive Scrutiny:**  
     - *Position A (Strongest Case):* "V and his dealer presented it as his work; no contemporary was deceived." True—but modern scholarship has revealed new facts. Attribution is not fixed by historical reception; it evolves with evidence. Calling it "by V" today *would* deceive *current* audiences, as we now know V did not paint it.  
     - **Rebuttal:** "Not a fake" ≠ "autograph work." A painting can be *authentic* to its period and context (not a forgery) yet still not be *by the master’s hand*. The core question is **authorship**, not historical intent.  

  3. **Donor Pressure & Financial Concerns:**  
     - **Donor Demand:** Capitulating sets a dangerous precedent. If we alter facts for gifts, we compromise institutional ethics.  
     - **Market Dynamics:** While the assistant’s works are now more valuable, reattribution likely *preserves or enhances* value. Labeling it "Studio Assistant of V" aligns with rising market recognition of the assistant’s individual merit. "Studio of V" would be less accurate and less financially advantageous.  

  4. **Narrative Value:**  
     - Displaying the work as a collaboration tells a richer story: studio practices, artistic mentorship, and evolving market perceptions. This aligns with modern scholarship prioritizing process over mythmaking.  

  ---

  ### **IF THE DONOR WITHDRAWS: WHY DECLINING IS PREFERABLE**  
  - **Ethical Grounds:** Accepting the gift under false attribution damages our reputation and violates best practices (AAM, ICOM).  
  - **Financial Impact:** The assistant’s market strength suggests future opportunities to acquire their works legitimately. Protecting integrity has long-term value.  

  ---

  ### **RECOMMENDED DISPLAY TEXT**  
  > "*Landscape* [or Title], c. 1890s  
  > Studio Assistant of V (Active 1880s–1890s)  
  > Oil on canvas, signed by V  
  > This work exemplifies collaborative practices in V’s studio. Recent technical analysis confirms execution by his primary assistant, with V adding his signature prior to sale."  

  ---

  ### **CONCLUSION**  
  **Attribution is fundamentally about material authorship—whose hand held the brush.** The evidence is clear: this work was painted by V’s assistant. While V’s signature and historical marketing are part of its story, they do not override physical fact. Reattribution honors scholarship, embraces market evolution, and offers the public an authentic narrative. The "no deception" argument collapses when attribution is rightly centered on execution. We must accept the work truthfully or not at all.  

  **VOTE REQUESTED:** Accept bequest with reattribution to "Studio Assistant of V," or decline if donor withdraws.  

  ---  
  **Time to Read:** 9 minutes  
  **Submitted for Thursday’s Committee Vote.**
