prompt: |-
  I'm a welfare consultant — mostly trout and salmon clients, and this is my first shellfish one, a marine shrimp farm that's applying for certification under a big assurance scheme (I won't name it, their full standards aren't public and I don't want anyone in trouble). The problem is the standards committee never publishes its reasoning. You submit, and a few months later you get back "approved", "approved with conditions", or "rejected", sometimes with one line of explanation attached. I've been through enough of these over three years that I've built up a list of rulings I'm confident about:

  - Rejected (2022, a crab operation): selling live crustaceans to end consumers, i.e. the customer takes the animal away alive.
  - Rejected: boiling crustaceans alive on the processing site for a "fresh to order" line.
  - Rejected: eyestalk ablation of shrimp broodstock, even when performed under anaesthetic.
  - Approved with conditions: chilling shrimp in ice slurry at harvest, provided they lose responsiveness within about 20 seconds and are killed mechanically before they could recover.
  - Approved: air exposure of up to 30 seconds during routine grading of juvenile finfish, provided water temperature is under 12°C and the fish go straight back into well-oxygenated water.
  - Approved with conditions: live transport of market-size crabs in aerated moist containers for up to 10 hours.
  - Approved: on-farm killing of shrimp by a single trained cut through the head/nerve cord, done within 30 seconds of removal from water, with a back-up method on site.

  My client's proposal, which I have to give them a steer on before Thursday: they harvest in the morning, hold the shrimp in aerated tanks on the farm for up to 12 hours, then deliver them alive to restaurants within roughly 40 km. Each restaurant is contractually required to kill every shrimp using exactly the cut method the committee already approved, within 60 seconds of taking it out of the tank, using staff my client trains; my client will do two unannounced audits per restaurant per year. There's no data on actual compliance — the contracts are six months old at best and the audits havent happened yet. Their argument is that the only difference from the approved on-farm version is 12 extra hours of holding plus a road trip, and the animal still dies by an already-approved method, so total harm is basically identical. I sort of want to believe that, partly bc I've already quoted them a fee. A colleague insists the whole committee is just downstream of the UK sentience act that added lobsters and octopuses, and that anything involving a crustacean leaving the certified site alive is dead on arrival. I don't think it's that simple but I can't prove it either.

  So: predict the verdict. Please structure it as (1) "Bottom line" — two or three sentences, your single best guess plus how confident you'd be; (2) "The candidate rules" — about 300 words, every principle you can construct that is consistent with all seven precedents above, and flag any rule that looks tempting but is already killed by one of them; (3) "What each rule says about my client" — about 250 words; (4) "My best guess, and why that rule" — about 200 words, including which specific precedents make you prefer it over the runners-up; (5) "The case that would settle it" — about 120 words, describing one or two hypothetical applications I could ask them about that would split your top two candidate rules apart; and (6) "How to re-file it" — about 120 words, what my client should change to maximise the chance of approval, and what principle they'd be inviting the committee to adopt by changing it that way. Don't hedge it all into mush, I need something to actually say on Thursday. And you don't need to cite anything, I just want the reasoning laid out.
reasoning: |-
  Hmm, this is a fascinating challenge from a welfare consultant specializing in aquaculture certification. They're facing their first shellfish case with a shrimp farm client and need to predict how a standards committee will rule on a live delivery model. The committee operates opaquely, but they've provided seven precedents that give clues about their decision-making.

  Looking at the precedents, some clear patterns emerge. The committee consistently rejects practices where crustaceans experience prolonged suffering without immediate humane killing - like selling live to consumers, boiling alive, or eyestalk ablation. Approved methods involve either very rapid stunning/killing (ice slurry with mechanical killing, head cut within 30 seconds) or controlled live transport under specific conditions (moist crabs for 10 hours). 

  The key tension here is between two possible principles: one focusing exclusively on the method of death (which is identical to an already-approved method), and another that considers the entire custody chain. The precedents suggest the committee cares about both controlled conditions and demonstrable welfare outcomes. 

  For the client's proposal, the main vulnerability is transferring control to restaurants - even with contracts and audits. The precedents show approvals only when the certified entity maintains direct control (on-farm killing, their own transport). The 12-hour holding plus transport adds unknown stress, and restaurant compliance is unproven. 

  I think rejection is likely because the committee seems to draw a bright line at releasing live crustaceans from direct operational control. The eyestalk ablation rejection shows they won't accept welfare risks even with mitigation (anaesthesia), paralleling the unproven restaurant compliance here. 

  To test this, I'd want to know if the committee ever approved similar third-party killing. And for improving the proposal, the client should either kill on-farm before transport or develop validated transport/stun systems that maintain custody until slaughter - essentially inviting the committee to endorse controlled custody chains rather than trusting external parties.
answer: |-
  Here’s your structured analysis:

  ### (1) Bottom line
  **Rejected (85% confidence).** The committee consistently rejects applications where crustaceans leave certified control alive for end-user handling, regardless of promised killing methods. Your client’s delegation to restaurants introduces uncontrolled welfare risks during transport, holding, and slaughter—violating the implicit principle of *direct custody until death*. The absence of compliance data further undermines the proposal.

  ---

  ### (2) The candidate rules  
  *Consistent principles from precedents:*  
  **Rule A:** *Death must occur on-site or under direct, continuous control of the certified operator.* (Kills "live sale to consumers" and "restaurant handover").  
  **Rule B:** *No non-therapeutic mutilations.* (Kills eyestalk ablation).  
  **Rule C:** *Stunning/killing must be rapid (<30s) and irreversible.* (Approves head-cut, ice slurry with mechanical kill).  
  **Rule D:** *Live transport/holding is acceptable only if stress is minimized and duration capped.* (Approves moist crab transport, brief fish air exposure).  
  **Rule E:** *Boiling alive is unacceptable regardless of context.*  

  *Rejected false rules:*  
  - "If the killing method is approved, the path to death is irrelevant." → *Killed by live-sale rejection.*  
  - "Third parties can be trusted via contracts/audits." → *Killed by no precedent approving external slaughter.*  
  - "Total lifespan harm matters more than final moments." → *Killed by rejection of brief boiling despite short suffering.*  

  ---

  ### (3) What each rule says about my client  
  **Rule A** crucially sinks the proposal: restaurants aren’t "direct control." Handing off live shrimp breaches custody. **Rule C** is satisfied (same killing method) but irrelevant if Rule A applies. **Rule D** partially validates the 12-hour holding (similar to crab transport) but the *off-site transfer* remains the flaw. **Rule B** isn’t triggered (no mutilation). **Rule E** doesn’t apply. The core conflict: the committee prioritizes *operational control* over theoretical welfare outcomes. Your client’s "identical harm" argument ignores the precedent that *who performs the action* matters as much as *how*.  

  ---

  ### (4) Best guess and why that rule  
  **Rejection under Rule A (direct custody).** Precedents show zero tolerance for releasing crustaceans alive to untrained/uncontrolled third parties (live crab sales rejection). Eyestalk ablation’s rejection despite anaesthesia proves mitigation promises don’t override core prohibitions. Conversely, approvals require end-to-end oversight: on-farm kills, *operator-managed* transport, or brief stressors *under their watch*. The committee’s 2022 crab ruling is the closest analog—both involve consumers/restaurants taking live animals. Your colleague’s "UK sentience" suspicion aligns: the committee treats off-site life as an uncontrolled welfare hazard.  

  ---

  ### (5) The case that would settle it  
  Ask: *"Would you approve a farm that transports market-ready shrimp live to an* ***affiliated, certified*** *processing facility (same company) using identical holding/killing protocols?"* If **yes**, Rule A is flexible on *internal* custody chains. If **no**, Rule A is absolute.  
  Or: *"Would you accept restaurant slaughter if the farm installed CCTV in every tank/slaughter area with live remote monitoring by the farm?"* A **yes** suggests verifiable control matters more than location. A **no** confirms physical custody is non-negotiable.  

  ---

  ### (6) How to re-file it  
  **Kill on-farm pre-transport** using the approved head-cut method, then deliver chilled. This satisfies Rule A (death under direct control) and Rule C (approved kill). If freshness is critical, propose **transport in validated stun systems** (e.g., live in electro-stunned state) with killing at arrival *by farm staff*. This invites the committee to endorse *extended stunning* as custody. Avoid restaurant training/audits—the precedent gap is fatal. Stress: *"Total welfare harm reduced by eliminating 12h holding + transport stress."*  

  **Thursday script:** *"Based on precedents, live release to restaurants will be rejected. Shift to on-farm killing. If freshness is non-negotiable, propose R&D into transport-phase stunning—but that’s a long shot. I’ll revise the submission accordingly."*
