prompt: |-
  You're going to play a philosopher of social science who has spent their career on two things: vagueness (sorites, precisifications, supervaluationism, all that) and the mess of how official statistics get defined. Please actually think hard about this before answering rather than pattern-matching it to a debate you've seen a million times. I can't look anything up, so no citations, no reading list, no "see also" — I want your reasoning, not your bibliography.

  Background: I'm a software engineer, I build data pipelines and dashboards. No philosophy training past a couple of podcasts and one half-read book. I got into an argument at work last week that I lost, and I want to know exactly which move lost it for me.

  Here's the argument I made. It's about whether the world is getting less violent — you know, the Pinker-style claim that homicide rates and battle deaths have been falling for centuries. Numbered so you can point at specific steps:

  (1) "The world is getting less violent" is true or false only relative to a metric: a definition of what counts as a violent event, plus a rule for aggregating events into a number over a population and a time window.
  (2) There's no non-arbitary way to pick the metric. At every point there's a choice that changes the answer and that the facts don't settle. Does a harm baked into an institution count as violence when nobody throws a punch? Is one bombing campaign one act or five thousand? Do you normalize per capita or count absolute deaths? Is the comparison 1900 vs. now, or now vs. five thousand years ago? Each option is defensible and none is forced on you by the world.
  (3) If the truth of a claim depends on a choice among options that are equally defensible, then the claim is not true or false, full stop.
  (4) So "the world is getting less violent" is not true or false.
  (5) Identical reasoning gives the identical result for "global poverty is falling," "life expectancy is rising," and "unemployment went down last quarter" — ask anyone who has built those numbers, the definitional choices are just as load-bearing.
  (6) So none of those claims is true or false either.
  (7) But (6) is absurd. I ship dashboards with those numbers on them, people make real decisions off them, and it's not the case that printing "unemployment rose" and printing "unemployment fell" are equally fine — one of them is just wrong.
  (8) So something above is wrong.

  The part I care about: I want to keep (2) and I want to keep (7). (2) because I've sat in enough metrics arguments to know the definitions really are choices, and (7) because otherwise my entire job is nonsense. That pushes the damage into (1), (3), or the step from (3) to (4) — and I cannot see what's wrong with any of them. My colleague said (3) "obviously fails" and I said "then show me" and he couldn't, he just kept saying "that's not how definitions work."

  What I want from you:

  - First, brainstorm out loud. List every exit from this argument you can see, one or two sentences each, including the ones you think are bad exits. I want to see the option space before you commit to anything.
  - Then commit. Name the exact step you'd reject, and explain why it looked obviously fine to me when I wrote it — what's the plausible principle sitting right next to it that I slid onto by accident?
  - Then price the alternatives. For each of the other candidate exits, what do you lose by taking it, and is the loss bearable?
  - Finally, give me the honest verdict on the original question. Is "the world is getting less violent" true, false, true-relative-to-a-context, or something else — and specifically, what do you do with the per-capita vs. absolute-numbers tension, and with the question of whether institutional harms count at all? If your answer is "it depends," say what it depends on, and whether that dependence is a feature of the words or a feature of the world.

  Two constraints. If your diagnosis leans on a piece of technical machinery, explain the machinery in a sentence or two of plain English and then show me it actually does work on step (3) instead of just being a fancy label. And be willing to tell me (2) is the thing to give up if that's your real view — I'd rather be corrected than flattered.
