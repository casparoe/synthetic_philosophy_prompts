answer: |-
  ### Final Exam Question: Philosophy of Science - Objective Chance  
  **Time Allowed:** 45 minutes  
  **Word Limit:** 1,200 words  
  **Answer ONE question. This is Question 2.**  

  ---

  **Question 2: Admissibility and the Principal Principle**  
  Consider the following scenario:  
  > A device called the **Nightlight** flashes either red or green once nightly at midnight. Let **H** be the chance hypothesis stating that for every night *n*, the objective chance of red on night *n* is 1/2, with all nights independent. Let **H\*** be the hypothesis that the device is stuck and will flash red every night forever (chance 1 of red on all nights). At night 0 (before any flashes), an agent assigns credence 1/2 to **H** and 1/2 to **H\***.  

  The **Principal Principle (PP)** constrains rational initial credence as follows:  
  > For any proposition *A*, chance hypothesis *H*, and admissible evidence *E*:  
  > **Cr(*A* | *H* ∧ *E*) = Ch(*A*)**  
  > where *Ch* is the chance function specified by *H*, and *Cr* is the agent’s credence function.  

  We compare two characterizations of **admissibility**:  
  > **(A1) Past-and-Chance Admissibility**: *E* is admissible iff it is only about (a) events before the time of the chance in question, or (b) other objective chances.  
  > **(A2) PP-Preserving Admissibility**: *E* is admissible iff applying PP with *E* does not generate inconsistency.  

  **Your task**:  
  For each item of evidence below, determine whether it is admissible relative to **H** at night 0 under **A1** and **A2**. Explain each verdict. Then:  
  > (i) Discuss whether **A1** or **A2** can be defended given these verdicts.  
  > (ii) Explain what your verdicts imply about whether PP is a substantive or trivial constraint.  
  > (iii) In the presence of **E2**, can PP and Bayesian conditionalization both be satisfied? State and defend your answer.  

  **Evidence Items**:  
  > **E1**: A factory ledger showing that 1 of 1,000 shipped Nightlights was stuck, and this defective unit was randomly selected for the agent.  
  > **E2**: A sealed diagnostic report, dated night 1,001 and delivered via a trusted mechanism, stating that the Nightlight flashed red on all of the first 1,000 nights.  
  > **E3**: A report that on night 1,001, after seeing the printout described in E2, the agent’s credence in **H** will be 1/100.  

  ---

  ### Model Answer (798 words)  
  **Principal Principle (PP)**: PP requires that an agent’s conditional credence in *A*, given a chance hypothesis *H* and admissible evidence *E*, must equal the chance *Ch*(*A*) specified by *H*. Formally: **Cr(*A* | *H* ∧ *E*) = Ch(*A*)**.  

  **Admissibility Verdicts**:  
  **E1 (Factory Ledger)**:  
  - Under **A1 (Past-and-Chance)**: **Admissible**. E1 describes historical facts (manufacturing details) predating night 0 and does not disclose future outcomes. PP applies: Cr(red on n1 | H ∧ E1) = Ch(red) = 1/2.  
  - Under **A2 (PP-Preserving)**: **Admissible**. E1 does not contradict PP. Given H, chances remain 1/2 regardless of defect rates.  

  **E2 (Sealed Future Report)**:  
  - Under **A1**: **Inadmissible**. E2 describes future outcomes (nights 1–1,000), violating the "past-and-chance" clause.  
  - Under **A2**: **Admissible**. Applying PP with E2 is consistent: Cr(red on n1 | H ∧ E2) = 1/2. E2 reports outcomes but does not *logically conflict* with H’s chances. H remains possible (though improbable) if all 1,000 red flashes occur by luck.  

  **E3 (Self-Prediction Report)**:  
  - Under **A1**: **Inadmissible**. E3 concerns a future credence state (night 1,001), not past events or chances.  
  - Under **A2**: **Inadmissible**. Applying PP with E3 creates contradiction. Suppose Cr(H | H ∧ E3) = Ch(H). But Ch(H) = 1 (since H specifies chances), while E3 says Cr(H) = 1/100 on night 1,001. PP would require Cr(H | H ∧ E3) = 1, but E3 implies this credence is 1/100—an inconsistency. Thus, E3 is inadmissible under A2 to avoid self-refutation.  

  **(i) Defending Admissibility Characterizations**:  
  **A1** is defensible for ensuring PP avoids future information that could "undermine" chance-based predictions. However, it deems E2 inadmissible despite PP applying consistently, suggesting A1 is overly restrictive. **A2** resolves this by allowing evidence consistent with PP. Yet A2 faces problems with self-referential evidence like E3, which forces admissibility restrictions to prevent inconsistency. Neither characterization is wholly superior: A1 is metaphysically conservative; A2 is epistemically flexible but requires constraints to block paradoxes.  

  **(ii) Substantive vs. Trivial PP**:  
  PP is **substantive** only if admissibility excludes non-redundant evidence. Under A1, PP is non-trivial: it forbids conditioning on future data (E2), making chance a guide to rational belief distinct from frequency. Under A2, PP risks triviality if *all* consistent evidence is admissible (e.g., E2). But E3 shows limits: A2 must exclude evidence that induces inconsistency, preserving PP as a non-arbitrary constraint. Thus, PP remains substantive—it demands alignment with chances *unless* such alignment self-destructs.  

  **(iii) PP, Conditionalization, and E2**:  
  In the presence of **E2**, **PP and Bayesian conditionalization cannot both be satisfied** if the agent learns E2 at night 0.  
  - At night 0, under A2, PP applies: Cr(all red | H ∧ E2) = (1/2)^1000.  
  - After conditionalizing on E2 at night 0, Cr(H | E2) should update via Bayes. Initially, Cr(E2 | H) = (1/2)^1000, Cr(E2 | H\*) = 1. With prior Cr(H) = Cr(H\*) = 1/2:  
    > Cr(H | E2) = [Cr(E2 | H) × Cr(H)] / [Cr(E2)] = [(1/2)^1000 × 1/2] / [ (1/2)^1000 × 1/2 + 1 × 1/2 ] ≈ 0.  
  - But PP at night 0 requires Cr(H | H ∧ E2) = Ch(H) = 1 (since H sets chances). Conditionalization on E2, however, yields Cr(H | E2) ≈ 0. Thus, if E2 is admissible (per A2), PP demands Cr(H | H ∧ E2) = 1, but conditionalizing on E2 gives Cr(H) ≈ 0—violating PP unless Cr(H ∧ E2) = 0. Yet H ∧ E2 is possible (though improbable). Hence, honoring both principles is impossible when E2 is learned and deemed admissible.  

  This conflict arises because E2 reveals future frequencies that "defeat" H probabilistically, while PP insists H’s truth requires full credence. The tension exposes a deeper problem: chances cannot seamlessly integrate self-undermining evidence within Bayesian norms.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-hit points** (Miss one = lose marks):  
  1. **PP correctly stated as conditional credence** (4 pts).  
     *Common error:* Writing PP as Cr(A) = Ch(A) unconditionally.  
  2. **E2 deemed inadmissible under A1 but admissible under A2** (4 pts).  
     *Common error:* Claiming E2 is inadmissible under A2 "because it’s about the future" without addressing consistency.  
  3. **E3 deemed inadmissible under A2 due to inconsistency** (4 pts).  
     *Common error:* Arguing E3 is admissible because it is "true," ignoring self-refutation.  
  4. **Conflict between PP and conditionalization given E2** (4 pts).  
     *Common error:* Stating they conflict without showing the calculation (Cr(H | E2) ≈ 0 vs. PP’s demand for Cr(H | H ∧ E2) = 1).  
  5. **Substantive-trivial distinction tied to admissibility constraints** (4 pts).  
     *Common error:* Asserting PP is "obviously substantive" without referencing E2/E3 verdicts.  

  **Top-band threshold (17–20)**: Answers must synthesize all five points *and* do one of:  
  - Explain why A2 must exclude *some* evidence (e.g., E3) to save PP from vacuity.  
  - Contrast how A1 avoids self-undermining at the cost of flexibility.  
  - Diagnose the E2 conflict as showing chances cannot absorb defeating frequencies.  

  ---

  **Note on E2 Realism**:  
  The future-dated printout in E2 risks seeming "sci-fi," inviting dismissive answers. A realistic substitute preserves the dialectic:  
  > **E2 (revised)**: A legally binding contract, signed at night 0, guaranteeing that on night 1,001 the agent will receive an authenticated report of the first 1,000 flashes (which the agent trusts completely).  

  This retains the key element—certainty about future evidence—without futuristic machinery.
