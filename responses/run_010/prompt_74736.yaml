  A fourth possible view could be a radical externalist one where the taste is constituted by the tea itself, but that doesn't fit with Naomi's focus on discriminatory capacities. To distinguish these views, a good test case would be one where functional dispositions remain identical but the subject insists something feels different, with no behavioral or physiological correlates - though Naomi would likely dismiss this as confabulation or conceptual confusion.

