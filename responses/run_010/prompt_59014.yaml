prompt: |-
  I do intake review at a city agency — we look at maybe fifteen proposed rules and program changes a month before they go to council, anything from a character clause in a vendor licence to a shelter policy where a caseworker can relocate someone at her discretion. Lately the pushback we get is a particular kind: someone says the rule is fine, the officials running it are decent, nobody's actually been harmed, so what's the complaint. I want a screening procedure I can hand to a reviewer who's never read any political theory, built out of the republican idea of liberty as non-domination rather than non-interference — the bits about arbitrary interference, about whether a power has to track the interests of the person it's applied to, and about freedom meaning you can meet the other person's gaze without deferring or being afraid. Twenty minutes a proposal, one reviewer, no lawyers in the room until sign-off, and the output has to be a verdict plus flags, not an essay.

  Give me the questions in order, what counts as a sufficient answer to each, and the points where it should stop and escalate to counsel instead of pretending to decide. It especially has to handle three things we keep hitting, which I've started calling sleeping clauses: a discretionary power that's never actually been used, contest rights that exist on paper but cost enough time or exposure that nobody uses them, and constraints the affected people voted for themselves.

  Then run it on two live ones. First: a hardship waiver in a business licence where the deciding officer has no obligation to give reasons and the waiver is revocable at will. Second: a lottery for subsidised units where nobody has any say but also nobody gets singled out. Take a position on which is worse and defend it — one of those results will annoy me and I'd rather you say that plainly than balance it out. And be straight about where the procedure will misfire, and which distinctions I'm losing by compressing it into something a non-specialist can run.
reasoning: |-
  Okay, let me break this down. The user is an intake reviewer at a city agency facing a specific challenge: they need a practical screening tool based on republican liberty theory (non-domination) that non-specialists can apply in 20 minutes per proposal. The core tension is between efficiency and theoretical depth—they want flags, not essays, but must catch "sleeping clauses" where structural power imbalances exist without active harm.

  First, I need to unpack the republican liberty framework. The key is shifting from "did interference happen?" to "could arbitrary interference happen?". Pettit's three tests seem most operational: 1) Is the power constrained to track interests? 2) Is it non-arbitrary (requiring reasons/review)? 3) Does it preserve equal standing (the "gaze test")? 

  The "sleeping clauses" are critical: unused powers, inaccessible appeals, and self-imposed constraints. These require probing latent risks—like whether a waiver officer could revoke without cause tomorrow, even if they haven't today. For self-imposed rules, I recall Pettit's caveat that consent doesn't erase domination if exit isn't feasible (e.g., voting for a lottery doesn't make losing dignified).

  Now for the screening flow: it must be diagnostic, not interpretive. I'll structure it as a chain of yes/no gates ending in flags. Key design choices:
  - Start with "power check" (is there a power imbalance?) to filter low-risk cases early.
  - Focus on institutional design, not intent: "decent officials" are irrelevant to structural risk.
  - Build in off-ramps to counsel where subjectivity kicks in (e.g., "reasonable contestation").
  - For self-imposed rules, add a viability-of-exit question—did they have real alternatives?

  Testing on the two examples:
  - The hardship waiver fails hard: no reasons required + revocable at will = pure arbitrariness. The "gaze test" is vivid here—could a small business owner look the officer in the eye without fear?
  - The lottery is trickier. No singling out avoids personal domination, but the absence of agency still creates systemic vulnerability. However, it arguably tracks interests better (randomness isn't arbitrary if rules are clear). Still, I'd argue the waiver is worse because it personalizes power.

  I'm aware of losses: flattening "tracking interests" into checkboxes omits nuance about whose interests count. Also, without context, reviewers might miss covert domination (e.g., if only certain groups apply for waivers). But pragmatically, this prioritizes catching clear red flags.

  Final check: does the output defend a position as requested? Yes—explicitly ranking the waiver higher-risk aligns with the "annoy me" directive. And flagging where oversimplification happens maintains integrity.
answer: |-
  Here's a screening procedure built on republican liberty (non-domination), designed for speed, clarity, and practical flagging – with built-in handling for "sleeping clauses." It assumes the reviewer understands basic policy structures but not theory.

  **The Screening Procedure: "Dominance Risk Assessment" (20-Minute Version)**

  **Core Question:** Could this rule put someone at the mercy of another's arbitrary will, even if it hasn't happened yet? Focus on the *structure* of the power, not current use or good intentions.

  **Questions in Order (Yes/No/Sometimes + Brief Justification Required):**

  1.  **POWER CHECK:** Does this rule/program grant an individual, office, or entity *discretionary power* over others (e.g., granting/denying benefits, imposing sanctions, making binding decisions affecting status, rights, or access)? *(Sufficient Answer: Yes/No. If **No**, stop. Low domination risk. Verdict: Likely Acceptable. Flag: None. If **Yes**, proceed.)*
  2.  **INTEREST TRACKING:** Is the power-holder *required by the rule/program itself* to base their decisions *solely* on factors tied to the *relevant interests* of the people subject to the power? (e.g., objective eligibility criteria, public safety evidence, predefined hardship definitions). *(Sufficient Answer: Clear **Yes** (explicit criteria)/Clear **No** (pure discretion)/**Sometimes** (vague criteria, broad factors). If **Yes**, proceed to Q3. If **No** or **Sometimes**, flag: **HIGH - ARBITRARY POWER**. Proceed to Q4.)*
  3.  **REASON & REVIEW SAFEGUARD:** (Only if Q2 was **Yes**) a) Is the power-holder *required to give reasons* for decisions (especially adverse ones) specific to the case? AND b) Is there a *practically accessible, timely, and low/no-cost* process for the affected person to *contest the decision* before a separate body? *(Sufficient Answer: **Yes** to both (strong safeguard)/**No** to either or both (weak safeguard). If **Yes** to both, proceed to Q4. If **No** to either, flag: **MEDIUM - ACCOUNTABILITY GAP**. Proceed to Q4.)*
  4.  **THE GAZE TEST:** Would a reasonable person subject to this power feel they must act with *deference* or experience *fear* of negative consequences when interacting with the power-holder, *simply because of how the power is structured*? (Ignore current "decent officials"). Consider: Can the power be used unpredictably? Is there vulnerability? Is contestation impractical? *(Sufficient Answer: **Unlikely** (clear rules, strong safeguards)/**Likely** (broad discretion, weak safeguards, high stakes)/**Depends** (context-specific). If **Unlikely**, Verdict: **Acceptable with Flags** (note existing flags). If **Likely** or **Depends**, flag: **HIGH - STATUS THREAT**. Proceed to Q5.)*
  5.  **SLEEPING CLAUSE CHECK:** Does the risk primarily arise from a *potential* power imbalance, not current harm? Specifically:
      *   a) **UNUSED POWER:** Is there a discretionary power that *hasn't been exercised yet*? (Flag: **SLEEPER - UNUSED POWER**)
      *   b) **PAPER RIGHTS:** Are contest rights *formally available but impractical* due to cost, time, complexity, risk, or lack of support? (Flag: **SLEEPER - INEFFECTIVE CONTEST**)
      *   c) **SELF-IMPOSED:** Were the constraints/powers *voted for or agreed to by those affected*? (Flag: **SLEEPER - CONSENT CONTEXT**. *Important: Consent doesn't automatically negate domination risk if exit isn't viable or the choice wasn't truly free/equal.*)
      *(Sufficient Answer: Identify which apply (a/b/c) or **None**. Flags added. Proceed to Verdict.)*

  **Verdict & Escalation:**

  *   **No Flags:** Verdict = **Likely Acceptable**.
  *   **MEDIUM Flag(s) only:** Verdict = **Conditionally Acceptable - Monitor Risks**. (Reviewer can note concerns).
  *   **Any HIGH Flag or SLEEPER Flag:** Verdict = **High Domination Risk - Escalate to Counsel**. **STOP. Do not pretend to decide.**
  *   **Uncertainty on Q4 (Gaze Test) or complex application of Q2/Q3:** Verdict = **Escalate to Counsel**. **STOP.** (Judging "reasonable person" fear/deference or parsing vague criteria often needs nuance).

  **Handling the Three Sleeping Clauses:**

  1.  **Unused Discretionary Power:** Q1 catches it. Q2/Q3/Q4 assess its *potential* for arbitrary use. Flagged explicitly in Q5a. **Escalates if HIGH risk flags are present.**
  2.  **Ineffective Contest Rights:** Q3b explicitly probes *practical* accessibility (cost, time, exposure). Flagged as **SLEEPER - INEFFECTIVE CONTEST** in Q5b. **Escalates if contest rights are weak/purely formal.**
  3.  **Self-Imposed Constraints:** Q5c flags it as context (**SLEEPER - CONSENT CONTEXT**). **Crucially:** This *doesn't* automatically make it acceptable. The reviewer *still applies Q2, Q3, Q4*. Consent might mitigate *some* fear (Q4), but if the power structure is arbitrary (fails Q2/Q3) and people are locked in or vulnerable, domination risk remains. **Escalates if it fails Q2/Q3/Q4 despite consent flag.**

  **Testing on Live Examples:**

  **1. Hardship Waiver (Business License): Officer has discretion, no reason required, revocable at will.**

  *   **Q1 (POWER):** **Yes.** (Grants officer power to grant/revoke waiver).
  *   **Q2 (INTEREST TRACKING):** **No.** No requirement to base decision *solely* on factors tied to applicant's relevant interests (hardship). Pure discretion. **FLAG: HIGH - ARBITRARY POWER.**
  *   **Q3 (REASON & REVIEW):** Skip (Q2 was No).
  *   **Q4 (GAZE TEST):** **Likely.** Business owner is highly vulnerable to officer's whim (revocable at will, no reasons). Fear of arbitrary denial/revocation is structural. **FLAG: HIGH - STATUS THREAT.**
  *   **Q5 (SLEEPER):** Could be **a (Unused Power)** if never used, or **b (Ineffective Contest)** if appeal exists but is costly/risky. **FLAG: SLEEPER - [APPLICABLE TYPE].**
  *   **Verdict:** **High Domination Risk - Escalate to Counsel.** (Multiple HIGH flags).

  **2. Lottery for Subsidized Units: No individual say, no singling out.**

  *   **Q1 (POWER):** **Yes.** (The lottery system/person running it has power over who gets scarce resource).
  *   **Q2 (INTEREST TRACKING):** **Sometimes -> Leans Yes.** Rules *should* be based purely on eligibility criteria (income, household size) and random chance. Randomness itself isn't inherently arbitrary *if rules are clear and applied uniformly*. Assuming rules are objective, this is a **Yes**. (If rules are vague, it could be Sometimes/No).
  *   **Q3 (REASON & REVIEW):** **a) Reasons:** Generally **No.** Lotteries don't provide "reasons" for not being picked beyond "not selected randomly." **b) Contest:** Likely **Yes** for *eligibility* or *process* errors (e.g., wrong name drawn, wasn't eligible), but **No** for the *outcome* of randomness itself. **FLAG: MEDIUM - ACCOUNTABILITY GAP** (No reason for the specific outcome, though process might be contestable). Proceed.
  *   **Q4 (GAZE TEST):** **Unlikely.** While disappointing, applicants aren't subject to an *individual's* arbitrary will. The power is impersonal and rule-bound (random). No specific official to fear or defer to regarding the outcome. Status is equal among applicants. **No High Flag.**
  *   **Q5 (SLEEPER):** **None** specific, unless contestation for the outcome itself is misleadingly promised (not typical).
  *   **Verdict:** **Conditionally Acceptable - Monitor Risks.** (MEDIUM flag for lack of reason/contest on the outcome itself, but structure minimizes personal domination).

  **Which is Worse? Defending the Position:**

  The **Hardship Waiver** is **significantly worse** from a non-domination perspective.

  *   **Core Failure:** The waiver creates a direct, personalized relationship of domination. The business owner is utterly at the mercy of a specific official's unconstrained will (Q2: No tracking, Q4: High fear/deference). Revocation "at will" is the epitome of arbitrary power – the owner has no security.
  *   **Republican Liberty Violation:** This structure *ensures* the business owner cannot "meet the gaze" of the officer without justified fear or need for deference. Their livelihood is subject to unchecked whim.
  *   **Lottery Contrast:** The lottery, while frustrating and denying agency, does *not* create a relationship where one person dominates another. Applicants face an impersonal system bound by pre-set rules and chance. They are equally vulnerable to the system, not to the arbitrary will of a specific power-holder. Their status as citizens with equal standing isn't undermined by the *structure* in the same way; they don't fear a specific official's displeasure. The lack of recourse on the outcome (Q3 flag) is a flaw, but it doesn't equate to the personalized, arbitrary power in the waiver.

  **Where the Procedure Will Misfire & What's Lost:**

  1.  **Oversimplifying "Tracking Interests" (Q2):** Distinguishing "objective criteria" from "vague factors" is subjective. A non-specialist might miss when seemingly neutral criteria systematically disadvantage a group (covert domination). **Lost:** Nuance in what constitutes a truly "common avowable interest" (Pettit) and identifying structural biases.
  2.  **"Reasonable Person" Judgment (Q4 - Gaze Test):** This is inherently subjective. A reviewer's own background might blind them to vulnerabilities experienced by marginalized groups. **Lost:** Sensitivity to how power dynamics affect different populations differently.
  3.  **Assessing "Practical" Contestation (Q3b):** Judging cost/time/exposure barriers without legal/financial expertise is hard. A reviewer might underestimate barriers for low-income or vulnerable individuals. **Lost:** Deep understanding of real-world access barriers.
  4.  **Consent Complexity (Q5c):** The procedure flags consent but relies on escalation for nuanced analysis. A non-specialist might overvalue consent ("they voted for it!") without grasping if alternatives were viable or the vote was truly free/equal. **Lost:** Theory of when consent legitimizes power vs. when it masks domination due to unequal bargaining power or lack of exit.
  5.  **Systemic vs. Individual Domination:** The procedure focuses on identifiable power-holders (Q1). It might miss diffuse systemic domination where no single agent has arbitrary power, but the system itself creates vulnerability (like some effects of pure markets). The lottery touches this, but the procedure handles it via Q4. **Partially Lost:** Capturing domination without a clear dominator.
  6.  **"Never Been Harmed" vs. Structure:** The procedure *tries* to force focus on structure, but a reviewer distracted by "decent officials" or lack of complaints might still downplay flags. **Requires Discipline.**

  **Conclusion:** This procedure provides a practical, theory-grounded tool for flagging high-risk domination structures, especially sleeping clauses, within the 20-minute constraint. It prioritizes escalation for complex judgments. The Hardship Waiver exemplifies high-risk personalized arbitrary power, making it worse than the impersonal (though imperfect) lottery system. Use it with awareness of its limitations, particularly regarding nuanced interest-tracking, subjective "gaze test" judgments, and assessing real-world contest barriers – these are the costs of compression for non-specialist use. Escalate early and often when flags or uncertainty arise.
