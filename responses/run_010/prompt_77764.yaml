  ### In-Class Activity Design: Strategy-Stealing and Non-Constructive Existence Proofs  
  **Objective:** Students experience a non-constructive existence proof (strategy-stealing) in a finite game, confront the gap between existence and execution, and critique its epistemic value.  

  ---

  #### **Game Rules: Chomp**  
  - **Board**: Rectangular grid (e.g., 2×2, 2×3, 3×3). Bottom-left square is poisoned.  
  - **Players**: Alternate turns.  
  - **Move**: Choose a remaining square. Remove it and all squares above and/or to the right of it.  
  - **Losing Condition**: Player who takes the poisoned square loses.  
  - **Key properties**:  
    - **Finite/deterministic/no draws**: Game ends when poison is taken; no ties.  
    - **Symmetric moves**: Both players have identical move options from any position.  
    - **Monotonicity**: Removing more squares never harms a player (extra moves only restrict opponents).  
  - **Materials per pair**: Graph paper, two colored pens/pencils (✓ for Player 1, ✗ for Player 2).  

  ---

  #### **Minute-by-Minute Timeline**  
  **Total: 100 minutes**  
  *(Groups: 11 pairs of students)*  

  | Time  | Activity                                                                 | Facilitator Script (Transitions Only)                                                                 |
  |-------|--------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|
  | 0-5   | **Intro to Chomp**                                                       | "Today we play Chomp. Rules: Grid, poison bottom-left. Remove squares above/right. Lose by taking poison. Play 2×2 now—find out who wins." |
  | 5-15  | **Play 2×2 Chomp** (Explicit strategy)                                   | "Play best-of-3 with your partner. Switch who starts first. After, write: What’s the winning move?"   |
  | 15-20 | **Discuss 2×2**: First player wins (take top-right)                     | "Who wins 2×2? How? Yes: First player takes top-right, mirrors. This proof gives a witness—a recipe." |
  | 20-30 | **Play 2×3 Chomp** (No easy witness)                                     | "Now try 2×3. Same rules. Can you find a winning first move? Play 3 rounds. Note: No need to find it!" |
  | 30-40 | **Stage the Theft in 2×3** (Engineered breakdown)                        | "Alice (P1), take top-right. Bob (P2), respond. Alice, now copy Bob’s *hypothetical* strategy. If it says ‘take X’ but X is gone, take ANY safe square. What happens?" |
  | 40-50 | **Class Argument**: Why theft works despite breakdown                   | "Alice won even when copying failed. Why? Redundant moves aren’t fatal—monotonicity saves her."       |
  | 50-55 | **Formalize Strategy-Stealing** (Hypotheses)                            | "So: We proved P1 wins 2×3 without knowing how. What did we assume? Finite? Symmetric moves? Extra moves harmless?" |
  | 55-60 | **Predict for 4×4**: Commit in writing                                 | "Who wins 4×4? Write: ‘P1 wins. Proof: Strategy-stealing.’ But—do you have a strategy? Hand these in." |
  | 60-75 | **Sabotage Activity** (Break the argument)                              | "Design a game where: (1) Symmetric, (2) Finite/no draws, (3) But P2 wins. What hypothesis fails?"    |
  | 75-85 | **Share Sabotage Games** (Instructive example provided)                 | "Example: 2-pile Nim (each pile size 2). Rules: Take any objects from one pile. Lose if you take last object. P2 wins by mirroring. Why? Extra moves CAN hurt—monotonicity fails." |
  | 85-95 | **Debrief**: Map hypotheses to gameplay                                 | "In Chomp, monotonicity held. In Nim, it didn’t. And our 4×4 prediction? You ‘know’ P1 wins but can’t act. That’s the gap." |
  | 95-100| **Philosophical Close**                                                | "Does proving ‘P1 wins’ without a strategy count as knowledge? Or is it too hollow? Discuss next time." |

  ---

  #### **Sabotage Activity Details**  
  - **Goal**: Groups create a symmetric, finite, draw-free game where P2 wins.  
  - **Instructive Example**:  
    - **Game**: 2-pile Nim (piles of size 2).  
    - **Rules**: Take any number from one pile. Player taking the *last* object loses.  
    - **P2 Wins**: P2 mirrors P1’s moves across piles. If P1 takes *k* from pile A, P2 takes *k* from B. Forces P1 to take the last object.  
    - **Hypothesis Broken**: **Monotonicity**. Taking extra objects *can* hurt (e.g., reducing a pile to zero might hand victory to the opponent).  
  - **Why not degenerate?**: No trivial parity—requires strategic mirroring, not just counting moves.  

  ---

  #### **Failure Modes & Fixes**  
  1. **Quick Solvers**:  
     - *Problem*: Students solve 2×2/2×3 instantly.  
     - *Fix*: Redirect to "Prove why mirroring works in 2×2" or "Sketch a game tree for 3×3".  

  2. **Silent Pairs**:  
     - *Problem*: Pairs stall during play or sabotage.  
     - *Fix*: Provide prompts: "What if P1 takes corner? Try copying after P2’s response."  

  3. **Timing Overrun**:  
     - *Problem*: Theft demo or sabotage runs long.  
     - *Fix*: Use a timer. Cut Nim explanation short; provide handout.  

  4. **Misunderstanding Proof ≠ Strategy**:  
     - *Problem*: Students think strategy-stealing gives a playable strategy.  
     - *Fix*: During theft, stress: "We proved existence, but Alice’s ‘copying’ isn’t a real strategy—it depends on a hypothetical!"  

  5. **Confusing Symmetry**:  
     - *Problem*: Students assume "symmetric board" (not moves).  
     - *Fix*: Clarify: "Symmetric moves mean both players have identical choices from a position—board shape irrelevant."  

  ---

  #### **Honest Limits**  
  - **Non-Constructivity Gap**: Classroom boards (2×2, 2×3, 3×3) are small enough for exhaustive search. Students won’t *feel* computational infeasibility.  
  - **Bridge the Gap**: In debrief, contrast:  
    > "For 2×3, you *could* brute-force a strategy. For 100×100, you can’t—but strategy-stealing still says P1 wins. The proof gives certainty without utility. That’s what we mean by ‘non-constructive’."  

  - **What You Must Supply**: The *epistemic tension*—knowledge without ability. Emphasize:  
    > "Mathematicians debate: Does this ‘win’ without a strategy count as knowledge? Or is it a Pyrrhic victory?"  

  ---

  **Materials Summary**:  
  - Graph paper (1+ sheet per pair).  
  - Two colored pens/pencils per pair.  
  - Timer.  
  - Pre-printed Nim rules for sabotage (optional).  

  **Outcomes**:  
  - Students articulate strategy-stealing and its hypotheses.  
  - They experience "knowing who wins but not how."  
  - They critique non-constructive proofs as knowledge.
