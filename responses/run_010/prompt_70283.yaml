answer: |-
  Governor, the atrocity would have been *ordering the breach without that imminent, overwhelming necessity* – say, if she'd acted on a hunch or false data, drowning the village needlessly. The necessary dirty hand is distinguished by the concrete reality *in that moment*: the flood crest *is* coming, the city *will* drown absent action, and crucially, *no other option exists* to save it. The identical order becomes monstrous *only* if those brutal conditions weren't met. What distinguishes it is the governor's knowledge of the absolute, immediate, and unavoidable trade-off forced upon her by her office and the physical world. An observation against my position? If you showed me a case where an official *knowingly* violated a deep moral norm (like killing innocents) *without* such dire necessity, yet the outcome was beneficial by pure luck, and we still called it dirty hands. We wouldn't. We'd call it criminal recklessness or worse. The guilt isn't consequentialist regret; it's the indelible stain of *choosing* to directly inflict horrific harm on specific, blameless people whose names you know, even when refusing would inflict greater harm. Consequentialism washes its hands after the math; we bear the weight of the violation itself.

  The guilt is inherent to the *nature* of the act – the deliberate drowning of nine hundred souls – not merely its consequence. Consequentialism tells her only to tally the net lives saved. But her anguish springs from violating the fundamental prohibition against murdering the innocent, a duty that binds her personally *even as* her office demands she break it. Abstention has victims, yes – the city's thousands. But the breach doesn't *just* have victims; it has *her* as the *agent* who ordered their deaths. Justification (saving more lives) doesn't erase the objective wrongness of killing those villagers; it only shows why, tragically, she *had* to commit that wrong. Excuse would absolve her; justification forces her to own the act, wrongness and all. That conscience isn't bolted on; it's the shattering recognition that her duty required her to become, in this terrible instance, the author of an atrocity necessary to prevent a greater catastrophe. The office compels the act, but cannot sanctify it.
