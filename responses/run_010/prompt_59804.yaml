  ### **Where the Procedure Misfires and Limitations**  
  - **Misfires:**  
    - **Complex Interactions:** Fails when >3 variables interact (e.g., cascading failures). Solution: Focus on root triggers.  
    - **Probabilistic Causes:** Struggles with "likely causes" (e.g., "this caused a 30% failure rate"). Stick to binary prevent/reduce.  
    - **Human Factors:** Poorly handles vague actions (e.g., "misjudgment"). Requires forcing specific variables (e.g., "RunbookStep = skipped").  
  - **Cannot Do:**  
    - Assign blame (handled in Step 6).  
    - Predict future incidents (only backward-looking).  
    - Handle "deep" causes (e.g., "understaffing" → demote to background).  
  - **Automation Limits:** Steps 1 (variable set) and 4 (intervention testing) need human input; others can be tool-assisted.  

  ### **The Dispute Between Camps: Does It Change the Report?**  
  - **In 90% of incidents, both camps produce identical reports.** The procedure resolves the dispute by:  
    - Using **interventionist tests** (Step 4) but scoping variables to avoid explosion (Step 1).  
    - **Demoting non-actionable absences** (Step 2) and **handling overdetermination** (Step 3).  
  - **Residue (Where Dispute Matters, <10% of incidents):**  
    | **Incident Type**       | **Counterfactual Camp Output**                          | **Interventionist Camp Output**                     | **Procedure’s Output** |  
    |--------------------------|--------------------------------------------------------|----------------------------------------------------|------------------------|  
    | Absence of non-engineered safeguard (e.g., Incident A’s unclosed ticket) | "Absence of ticket closure caused incident" (over-inclusive) | Excluded (not actionable) | Demoted (not a variable) |  
    | Latent risk (e.g., Incident A’s batch job) | Not a cause (didn’t counterfactually change outcome) | Included as risk (could intervene) | Classified as "latent risk" (handed off) |  
    | Overdetermination (e.g., Incident B) | Lists both causes + all absences | Lists both causes but only actionable absences | Lists both causes (with note) + promotes only actionable absences |  
  - **Conclusion:** The camps disagree on philosophy but agree on practical outputs when constrained by engineering actionability. The procedure forces explicit scoping, making differences rare and tractable. The published report changes in <10% of cases—only for non-engineered absences or latent risks. For your examples:  
    - Incident A: Both camps would output identical claims for `CanaryDeploy`, `RetryJitter`, and `CircuitBreakerState`. Dispute residue: Counterfactual might list the unclosed ticket; interventionist would not. Procedure demotes it.  
    - Incident C: Both camps focus on the missing test. The tooling choice is excluded by time-windowing.  

  This procedure gives you defensible, scoped claims in 90 minutes. It avoids philosophy debates by making judgments explicit (e.g., "actionability") and automatable where possible.
