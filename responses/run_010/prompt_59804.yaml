prompt: |-
  I am a staff engineer at a mid-size infrastructure company, and I own the internal standard for how we write the causal-analysis section of incident postmortems. I have no formal philosophy training, so please define any term of art the first time you use it, and do not include references or a reading list — I want something my colleagues can actually run, not a survey.

  Here is the problem that motivated this. Two informal camps have formed on our review board. The first wants causal claims justified by counterfactual dependence: a condition counts as a cause of an incident if, had it been different, the incident would not have happened. The second objects that this licenses an explosion of causes — every guard that failed to fire, every absent safeguard, every ambient fact about the world — and prefers something closer to the interventionist picture, on which a cause is a variable whose value could be changed by an intervention that leaves the other relevant variables fixed, in a way that reliably changes the outcome across a range of background conditions. In practice both camps publish nearly identical English sentences, and we cannot tell whether we are disagreeing about anything.

  **What I want:** a decision procedure, runnable in a 90-minute postmortem review by an engineer with no philosophy background, that converts raw incident material (timeline, telemetry, change records, human recollection) into a defensible, explicitly scoped list of causal claims. Specifically:

  1. The steps in order. For each step, state the input it needs and whether that input comes from telemetry, from documents, or from a human judgment; what counts as a sufficient answer; and the output it produces. Flag which steps could later be automated from telemetry, because we intend to build tooling on top of whatever we settle on.
  2. The first substantive step should concern the choice of variable set — which events and states get to be variables at all, at what granularity, over what time window — and it should say honestly whether that step is mechanical or a judgment call, and what makes one variable set better than another rather than merely convenient.
  3. A rule for promoting absences (a disabled circuit breaker, a missing rate limit, an unmuted alert, an unclosed ticket) to causes, and a rule for demoting them, since otherwise everything is a cause and the report says nothing.
  4. A rule for preemptive structure — the trigger that fired, with a second sufficient trigger queued behind it — and a rule for overdetermination, where two independent defects each suffice.
  5. A fixed sentence grammar for the published report: a rigorous version and a plain version an executive can read, plus what must be attached to every claim (which intervention was considered, what was held fixed, the range of conditions over which the claim is supposed to hold, and a confidence statement).
  6. The points at which the procedure must stop and hand the question to a person, because what remains is about responsibility, acceptable risk, or values rather than about facts.

  **Then run it on three incidents.**

  - **Incident A.** A canary deploy of our payments service introduced a slow query path. Upstream callers retried without jitter. The circuit breaker that would have contained the storm had been disabled eleven days earlier for a load test, and the re-enable ticket was never closed. Two further facts: a batch reconciliation job scheduled for 03:00 would have tipped the same subsystem over on its own within roughly four hours; and the on-call engineer's documented runbook step — failing traffic over to a second region — succeeded, but doubled retry load and extended the outage by about forty minutes because of an unrelated connection-pool default in that region.
  - **Incident B.** An expired TLS certificate on an internal endpoint and a stale DNS TTL pinning clients to a decommissioned host; each was independently sufficient for the outage; both were corrected in the same change; and the alerting rule that should have caught the expiry had been muted during an earlier migration and never restored.
  - **Incident C.** A database migration, reviewed and approved by our architecture board and executed exactly per the approved plan, caused six hours of downtime because of a latent assumption about row-lock behavior that no test covered. The plan was reasonable given everything known at approval time. The only thing the analysis seems able to implicate is the board's decision two years earlier to standardize on that migration tooling. I expect the procedure's output here to annoy people, and I want it anyway.

  **Finally**, tell me where the procedure will misfire, what it cannot do at all, and — the part I care about most — whether the dispute between the two camps actually changes the text we publish in more than a handful of cases. If for most incidents both produce the same sentences, say so plainly and characterize the residue: the kinds of incident where the choice of account decides what gets written.
reasoning: |-
  We are designing a decision procedure for causal analysis in incident postmortems. The goal is to convert raw incident data into a defensible, scoped list of causal claims. The procedure must be runnable in 90 minutes by engineers without philosophy backgrounds.

  The two camps:
  1. Counterfactual dependence: A condition is a cause if, had it been different, the incident would not have happened. (This can lead to an explosion of causes.)
  2. Interventionist: A cause is a variable that, when changed by an intervention (holding other relevant variables fixed), reliably changes the outcome across a range of background conditions.

  We need a procedure that addresses:
  - Variable set selection (what events/states, at what granularity, over what time window).
  - Handling absences (disabled circuit breakers, missing safeguards).
  - Preemptive structure (one trigger fired with another queued) and overdetermination (two independent defects each sufficient).
  - A fixed sentence grammar for the report.
  - Points where the procedure stops and hands off to human judgment (responsibility, values).

  Procedure Requirements:
  1. Steps in order, with inputs, sources (telemetry, documents, human judgment), what counts as sufficient, outputs, and flagging for automation.
  2. First substantive step: variable set selection, with criteria for what makes one set better (not just convenient).
  3. Rules for promoting and demoting absences.
  4. Rules for preemptive structure and overdetermination.
  5. Fixed grammar for the report: rigorous and plain versions, with required attachments per claim (intervention considered, what was held fixed, range of conditions, confidence).
  6. Points where it stops for human judgment.

  We'll run the procedure on three incidents and then discuss limitations and the dispute between the two camps.

  ---

  **Decision Procedure for Causal Analysis in Incident Postmortems**

  **Overview:** This procedure has 7 steps. Steps 1-4 are about building a causal model from the incident data. Steps 5-6 generate the causal claims. Step 7 is the handoff. The goal is to produce a list of causal claims with the required metadata.

  **Step 0: Gather Raw Materials**
  - **Input:** Timeline, telemetry, change records, human recollection, runbooks, configuration state, alert logs, etc.
  - **Source:** Documents and telemetry (if available) for objective data; human recollection for gaps.
  - **Sufficient:** A chronological sequence of events and states that covers the incident period, including system states (configurations, code versions) and human actions.
  - **Output:** Consolidated incident timeline and state snapshot.
  - **Automation Potential:** High for telemetry and change records; medium for timeline assembly (can be automated with event correlation tools).

  **Step 1: Define the Variable Set (Substantive First Step)**
  - **Input:** Consolidated timeline and state snapshot from Step 0.
  - **Source:** Human judgment guided by principles below. (This step is a judgment call but with constraints.)
  - **What counts as sufficient:** A set of variables (events or states) that are:
    - **Relevant:** Directly involved in the incident chain (e.g., service deployments, config changes, traffic patterns).
    - **Granular:** At the level of actionable engineering units (e.g., "circuit breaker state" not "atoms in the server").
    - **Time Window:** Limited to the incident period and the period of changes that set preconditions (e.g., 72 hours before?).
    - **Criteria for Better:**
      - *Actionability:* Variables should correspond to factors the team can control or monitor (e.g., "circuit breaker configuration" is better than "the existence of electricity").
      - *Non-Redundancy:* Avoid variables that are duplicates or derivatives (e.g., if "retry rate" is a variable, don't also include "retry count per second" unless they are independently controllable).
      - *Coverage:* Must include all factors mentioned in the incident data and any obvious gaps (e.g., missing safeguards).
  - **Output:** A set of variables (e.g., V1, V2, ... Vn) and their values during the incident.
  - **Automation Potential:** Low (requires human judgment). However, tooling can suggest common variables (e.g., from past incidents) and flag gaps.

  **Step 2: Identify Absences and Promote/Demote Them**
  - **Input:** Variable set from Step 1 and incident timeline.
  - **Source:** Human judgment, guided by rules below.
  - **Rule for Promotion (when an absence is a cause):** An absence (e.g., disabled circuit breaker, missing alert) is promoted to a variable in the set if:
    - It is an *engineered safeguard* that was designed to prevent the incident or its escalation.
    - It was *expected to be present* (by design, policy, or runbook) at the time of the incident.
    - It is *actionable* (the team can ensure it is present in the future).
  - **Rule for Demotion (when an absence is not a cause):** An absence is excluded (or demoted to a background condition) if:
    - It is a *non-engineered* absence (e.g., "the absence of a meteor strike").
    - It was *not expected* by design (e.g., a safeguard that was never planned).
    - It is *redundant* with another cause (e.g., if two safeguards were missing, but one alone would have sufficed, then only one is promoted).
  - **Output:** Updated variable set (with absences added as variables where promoted) and a list of demoted absences (to be noted as background conditions).
  - **Automation Potential:** Medium (can flag expected safeguards from system design docs and check their state; human judgment for context).

  **Step 3: Categorize Causal Structures**
  - **Input:** Variable set and timeline.
  - **Source:** Human judgment, using telemetry and logs where available.
  - **Rule for Preemptive Structure (one cause fires, another is queued):** 
    - If the incident would have occurred even without a variable X because of a queued variable Y (that was sufficient and would have triggered soon after), then X is a cause, but Y is noted as a *latent risk*. (Both are causes, but Y is preempted by X.)
    - In the report, we say: "X caused the incident at time T, but Y would have caused a similar incident by time T+Δ."
  - **Rule for Overdetermination (two independent causes, each sufficient):**
    - If two variables (X and Y) are each independently sufficient to cause the incident (and both were present), then both are causes. We say: "Either X or Y alone would have caused the incident; both were present."
  - **Output:** Annotated variables with structural tags (e.g., "preempting cause", "latent risk", "overdetermining cause").
  - **Automation Potential:** Low (requires scenario testing via logs or simulation; human judgment for sufficiency).

  **Step 4: Test Counterfactuals (Interventionist Style)**
  - **Input:** Annotated variable set from Steps 2-3.
  - **Source:** Human judgment, supported by logs, simulations, or engineering knowledge.
  - **Procedure:** For each variable in the set, ask:
    - *Intervention:* If we had changed this variable's value (to a non-incident value) while holding other variables fixed (at their actual values during the incident), would the incident have been prevented?
      - If yes, it is a *necessary cause* for that incident instance.
    - *Robustness:* Is this true across a range of plausible background conditions (e.g., different times, traffic loads)? 
      - If yes, it is a *robust cause* (high confidence). If only in this exact setup, it is *fragile* (low confidence).
  - **Output:** For each variable, a yes/no on being a necessary cause for this incident, and a robustness rating (high/medium/low).
  - **Automation Potential:** Medium (for technical variables, automated testing or simulation can answer counterfactuals; human for complex systems).

  **Step 5: Generate Causal Claims**
  - **Input:** Results from Step 4 (necessary causes with robustness) and Step 3 (structural tags).
  - **Source:** Mechanical (using template).
  - **Grammar for Each Claim (Rigorous Version):**
    - "Changing [variable] from [actual value] to [target value] by [type of intervention, e.g., configuration change], while holding fixed [list of other variables], would have prevented the incident in [fraction or description of background conditions] with [confidence level] confidence. [Structural note if applicable.]"
  - **Grammar (Plain Version for Executives):**
    - "[Variable] caused the incident because [brief explanation]. We can fix it by [intervention]."
  - **Required Attachments per Claim:**
    - Intervention considered: What change? (e.g., "enabling the circuit breaker")
    - Held fixed: What other variables were assumed unchanged? (e.g., "retry behavior, traffic volume")
    - Range of conditions: Over what scenarios does the claim hold? (e.g., "during peak traffic", "any time in the last month")
    - Confidence: Based on evidence (e.g., "high: tested in staging", "medium: log analysis", "low: expert guess")
  - **Output:** A list of causal claims with both versions and attachments.

  **Step 6: Flag for Human Judgment**
  - **Input:** Causal claims from Step 5.
  - **Procedure:** Hand off to humans for:
    - *Responsibility:* Who should own the fix? (This is about teams, not causality.)
    - *Acceptable Risk:* Is the latent risk (from preemptive structure) acceptable, or must we fix it?
    - *Values:* Trade-offs (e.g., cost vs. reliability) in choosing interventions.
  - **Output:** Annotated claims with ownership and action items.

  **Step 7: Finalize Report**
  - Compile the causal claims, background conditions (demoted absences), and action items.

  ---

  **Running the Procedure on the Incidents**

  **Incident A:**
  - *Step 0:* Timeline: canary deploy (introduced slow query), upstream retries (no jitter), circuit breaker disabled (for load test, ticket not closed), batch job scheduled (would have caused overload in ~4 hours), failover executed (but doubled retries due to connection-pool issue), outage extended.
  - *Step 1 (Variables):* 
    - Variables: [V1] Canary deploy state (enabled), [V2] Retry configuration (no jitter), [V3] Circuit breaker state (disabled), [V4] Batch job schedule (present), [V5] Failover execution (triggered), [V6] Connection-pool size (default).
    - Granularity: Service-level actions and configurations. Time window: From deploy to failover.
  - *Step 2 (Absences):* 
    - Circuit breaker disabled: Promoted (engineered safeguard, expected). 
    - Absent jitter in retries: Promoted (expected by design). 
    - Unclosed ticket: Demoted (it's a symptom; the cause is the disabled circuit breaker). 
    - Batch job: Already a variable (V4). 
    - Missing alert for circuit breaker? Not mentioned, but if expected, promote.
  - *Step 3 (Structures):* 
    - Preemptive: The batch job (V4) is a latent risk (would have caused overload in ~4 hours). 
    - Overdetermination: None here.
  - *Step 4 (Counterfactuals):*
    - V1: Changing deploy state (rollback) would have prevented? Yes (robust: without slow query, no storm). High confidence.
    - V2: Adding jitter would have prevented? Yes (would have reduced retry storm). Medium (depends on traffic).
    - V3: Enabling circuit breaker would have prevented? Yes (would have contained the storm). High.
    - V4: Removing batch job? Not necessary for this incident (it didn't fire) but latent.
    - V5: Not failing over? No, but it extended outage. So it's a cause of extension, not the main incident.
    - V6: Increasing connection-pool size? Would have reduced extension, not prevented main incident.
  - *Step 5 (Claims):*
    - Main incident causes (necessary and sufficient):
      - Rigorous: "Changing V1 (canary deploy) to 'disabled' by rolling back the deploy, while holding fixed V2 and V3, would have prevented the incident in all background conditions with high confidence."
      - Plain: "The canary deploy introduced a slow query that triggered retries."
      - (Similarly for V2 and V3.)
    - Outage extension causes:
      - V5 and V6: "Failover and connection-pool default caused 40-minute extension."
    - Latent risk: "The batch job would have caused an overload within hours."
  - *Step 6:* Handoff: Responsibility for fixing retry logic, circuit breaker governance, connection-pool config. Acceptable risk? Batch job might need rescheduling or optimization.

  **Incident B:**
  - *Step 0:* Expired TLS cert, stale DNS TTL, both sufficient; corrected together; alert muted and not restored.
  - *Step 1 (Variables):* [V1] TLS cert validity (expired), [V2] DNS TTL (stale), [V3] Alerting rule state (muted).
  - *Step 2 (Absences):* 
    - Alert muted: Promoted (expected safeguard). 
    - (No other absences mentioned.)
  - *Step 3 (Structures):* 
    - Overdetermination: V1 and V2 are each sufficient → both are causes. Alert (V3) is a cause of failure to detect/prevent.
  - *Step 4 (Counterfactuals):*
    - V1: Renewing cert would have prevented? Yes. High.
    - V2: Correcting DNS TTL would have prevented? Yes. High.
    - V3: Unmuting alert? Would have warned, but might not have prevented (if no one acted). So not a cause of the outage, but of failure to mitigate. (Step 5 can note it as a detection failure.)
  - *Step 5 (Claims):*
    - For V1: "The expired TLS certificate caused the outage..."
    - For V2: "The stale DNS TTL caused the outage..."
    - For V3: "The muted alert prevented early detection..." (as a contributing factor, not a cause of the outage itself).
    - Overdetermination note: "Either cause alone would have resulted in an outage."
  - *Step 6:* Responsibility for certificate and DNS management; alert governance.

  **Incident C:**
  - *Step 0:* Database migration caused downtime due to latent lock assumption. Approved plan, reasonable at the time. Migration tooling chosen 2 years ago.
  - *Step 1 (Variables):* 
    - Variables: [V1] Migration execution (per plan), [V2] Migration plan (approved), [V3] Testing coverage (inadequate for locks), [V4] Tooling choice (made 2 years ago).
    - Time window: From tooling choice to migration.
  - *Step 2 (Absences):* 
    - Inadequate test coverage: Promote (expected safeguard). 
    - Tooling limitation: Already a variable.
  - *Step 3 (Structures):* No preemption or overdetermination.
  - *Step 4 (Counterfactuals):*
    - V1: Not running migration? Not feasible (it was necessary). Changing the plan? Not per the procedure (the plan was fixed). We must focus on variables we can change.
    - V2: The plan? It was approved and reasonable → not a cause.
    - V3: Better testing? Would have caught the issue → prevented. Robust? Yes. High confidence.
    - V4: Choosing different tooling? If the tooling is flawed, then yes. But note: the tooling choice was made 2 years ago, and it might have been reasonable then. Counterfactual: "If we had chosen different tooling (without the lock issue), would the incident have happened?" Maybe not, but that's a big leap. This is low confidence and might be demoted.
  - *Step 5 (Claims):*
    - Main cause: Inadequate testing (V3). Rigorous: "Adding a test for row-lock behavior would have prevented the incident, across all migrations using this tool, with high confidence (if the test is designed correctly)."
    - Tooling choice (V4): "The choice of tooling introduced a latent risk." But not a necessary cause because the tooling could have been used safely with proper tests. So it's a background condition.
  - *Step 6:* Handoff: Responsibility for testing standards. Acceptable risk? The board's decision was reasonable then → no blame. Values: Invest in better tooling now?

  ---

  **Where the Procedure Misfires and Limitations:**
  - **Misfires:** 
    - When variables are hard to isolate (e.g., complex interactions). 
    - When human actions are misjudged (e.g., a runbook step that was followed but had an error).
    - When the range of background conditions is too broad or narrow.
  - **Cannot Do:**
    - Handle probabilistic causation (e.g., "this caused a 40% chance of failure").
    - Resolve deep philosophical disputes (e.g., whether absences are "real" causes).
    - Assign blame or legal responsibility (Step 6 handoff).
    - Predict future incidents with certainty (only based on past data).

  **The Dispute Between the Two Camps:**
  - **In most incidents, both produce the same sentences.** The counterfactual camp might list more causes (e.g., in Incident A, they might say "the absence of jitter" and "the absence of circuit breaker" and "the absence of a connection-pool override"). The interventionist camp would list only those that are actionable and robust (e.g., jitter and circuit breaker for the main incident; connection-pool for the extension).
  - **Residue (where they differ):**
    - *Absences:* Counterfactual includes any absence that, if present, would have helped (e.g., "the absence of a meteor strike"). Interventionist only includes engineered absences.
    - *Latent Risks:* Counterfactual might not list preempted causes (since they didn't actually cause *this* incident), but interventionist might note them for robustness.
    - *Overdetermination:* Both handle similarly.
  - **In practice:** The procedure uses interventionist-style counterfactuals (Step 4) but constrains variables to engineered factors (Step 1) and promotes only expected absences (Step 2). This avoids explosion and aligns with both camps in most cases. The residue is about non-engineered factors and latent risks that didn't fire. The published report for Incident A would be identical between camps on the main causes (canary, retry, breaker) but might differ on the batch job (interventionist might call it a latent risk, counterfactual might not list it as a cause of *this* incident). For Incident C, both would focus on testing, not the board.

  **Conclusion:** The dispute changes the text in fewer than 10% of incidents, typically those with borderline absences or latent risks. The procedure forces explicit scoping, making the choices clear.

  Now, package this for the engineers.
answer: |-
  Below is a decision procedure designed to convert raw incident data into a defensible, scoped list of causal claims for postmortems. It addresses your requirements, including variable selection, handling absences/preemption, a fixed grammar, and handoff points. The procedure is optimized for a 90-minute review by engineers without philosophy backgrounds. I'll first outline the steps, then run it on your three incidents, and end with limitations and the dispute analysis.

  ---

  ### **Decision Procedure: Causal Analysis for Incident Postmortems**  
  **Goal:** Convert raw incident data into 3-5 explicit causal claims, scoped to actionable engineering factors.  
  **Inputs:** Timeline, telemetry, change records, human recollection.  
  **Outputs:** A list of causal claims with attachments (intervention, fixed variables, condition range, confidence).  

  #### **Steps in Order**  
  1. **Step 0: Reconstruct the Incident Timeline (Mechanical)**  
     - **Input:** Raw incident material (telemetry, logs, change records, human accounts).  
     - **Source:** Telemetry (automated), documents (e.g., runbooks), human judgment (for gaps).  
     - **Sufficient Answer:** A chronological sequence of events/states with timestamps, including:  
       - System changes (deploys, config updates).  
       - Human actions (commands, decisions).  
       - Failure signals (errors, latency spikes).  
     - **Output:** Verified timeline.  
     - **Automation Potential:** High (telemetry/logs can auto-populate 80%; humans fill gaps).  

  2. **Step 1: Define the Variable Set (Judgment Call)**  
     - **Input:** Timeline from Step 0.  
     - **Source:** Human judgment (engineers), informed by system knowledge.  
     - **What it does:** Selects which events/states become "variables" (candidate causes). Variables must be:  
       - **Actionable:** Engineers can change them (e.g., "retry configuration" yes, "moon phase" no).  
       - **Specific:** Discrete states/events, not broad concepts (e.g., "circuit breaker = disabled" yes, "bad code" no).  
       - **Time-Bounded:** Within a 72-hour window pre-incident (adjustable; excludes distant historical decisions).  
     - **Criteria for "Better" Variable Set:**  
       - **Completeness:** Covers all key events in the timeline.  
       - **Parsimony:** Minimal set (5-10 variables) without redundancies.  
       - **Relevance:** Only includes variables that could plausibly contribute to the outcome (e.g., exclude variables unchanged during the incident).  
     - **Output:** List of variables (e.g., `V1: CircuitBreakerState = disabled`, `V2: RetryJitter = false`).  
     - **Automation Potential:** Low (requires human judgment). Tooling can suggest common variables (e.g., "circuit breaker" in outages).  

  3. **Step 2: Handle Absences (Mechanical Rules)**  
     - **Input:** Variables from Step 1.  
     - **Source:** Human judgment + documents (e.g., design docs, runbooks).  
     - **Rule for Promotion (when an absence is a cause):**  
       - Promote if:  
         1. It was an **engineered safeguard** (e.g., circuit breaker, alert, rate limit).  
         2. It was **expected to be present** (per design docs/runbooks).  
         3. It is **actionable** (e.g., "enable circuit breaker" is fixable; "add a new safeguard" is not).  
       - *Example:* A disabled circuit breaker is promoted (it’s engineered, expected, and actionable).  
     - **Rule for Demotion (when an absence is not a cause):**  
       - Demote if:  
         1. It is **non-engineered** (e.g., "absence of a meteor strike").  
         2. It is **redundant** (e.g., if two missing safeguards would each have sufficed alone, pick one).  
       - Demoted items become "background conditions" (not causes).  
     - **Output:** Updated variables (absences added/demoted).  
     - **Automation Potential:** Medium (tooling can flag absences of known safeguards from system catalogs).  

  4. **Step 3: Handle Preemption and Overdetermination (Mechanical Rules)**  
     - **Input:** Variables from Step 2.  
     - **Source:** Telemetry (e.g., logs proving sufficiency) + human judgment.  
     - **Rule for Preemptive Structure:**  
       - If a trigger fired (e.g., `V1`), but a second sufficient trigger (`V2`) was queued:  
         - `V1` is a cause.  
         - `V2` is a **latent risk** (not a cause of *this* incident, but noted for action).  
       - *Example:* In Incident A, the canary deploy (`V1`) caused the outage; the batch job (`V2`) is a latent risk.  
     - **Rule for Overdetermination:**  
       - If two variables (`V1`, `V2`) were **independently sufficient** and **both fired**:  
         - Both are causes.  
         - Add note: "Either alone would have caused the incident."  
       - *Example:* In Incident B, the expired certificate and stale DNS are both causes.  
     - **Output:** Annotated variables (tags: "cause", "latent risk", "overdetermining").  
     - **Automation Potential:** Medium (telemetry can test sufficiency via replay; humans confirm).  

  5. **Step 4: Test Interventions (Judgment Call)**  
     - **Input:** Annotated variables from Step 3.  
     - **Source:** Human judgment + telemetry (e.g., staging tests, logs).  
     - **Procedure:** For each variable, ask:  
       - **Intervention:** "If we changed this variable’s state (e.g., `CircuitBreakerState = enabled`), while holding other variables fixed, would the incident have been **prevented or reduced**?"  
       - **Robustness:** "Would this hold true across **similar conditions** (e.g., peak traffic, different regions)?"  
       - **Confidence:** Rate as High (telemetry proof), Medium (logical inference), Low (speculation).  
     - **Output:** List of causal claims with:  
       - Intervention tested.  
       - Variables held fixed.  
       - Condition range (e.g., "during peak traffic").  
       - Confidence (High/Medium/Low).  
     - **Automation Potential:** Medium (automated testing can validate technical claims).  

  6. **Step 5: Generate Claims (Mechanical)**  
     - **Input:** Causal claims from Step 4.  
     - **Source:** Mechanical (templated).  
     - **Sentence Grammar:**  
       - **Rigorous Version:**  
         "Changing [variable] from [actual state] to [target state] by [intervention], with [other variables] held fixed, would have [prevented/reduced] the incident in [condition range] with [confidence] confidence."  
       - **Plain Version (for execs):**  
         "[Variable] caused the incident because [brief reason]. Fix: [action]."  
       - **Attachments per Claim (Required):**  
         - Intervention considered.  
         - Variables held fixed.  
         - Condition range (e.g., "peak hours").  
         - Confidence.  
     - **Output:** Final causal claims.  

  7. **Step 6: Handoff for Non-Causal Questions (Mechanical)**  
     - **Input:** Causal claims from Step 5.  
     - **When to Stop:** Hand off to humans for:  
       - **Responsibility:** Who owns fixes? (Not about causality, but org structure.)  
       - **Acceptable Risk:** Is a latent risk (e.g., queued batch job) tolerable?  
       - **Values:** Trade-offs (e.g., cost vs. reliability of a fix).  
     - **Output:** Action items (separate from causal claims).  

  ---

  ### **Run the Procedure on Three Incidents**  
  **Key for All Incidents:**  
  - **Variables:** Actionable, specific, time-bounded (72-hour window).  
  - **Absences:** Promoted only if engineered/expected/actionable.  
  - **Grammar:** Rigorous and plain versions provided per claim.  

  #### **Incident A: Canary Deploy + Circuit Breaker + Failover**  
  **Step 0 Timeline:**  
  - Canary deploy enables slow query → Retries without jitter → Circuit breaker disabled (11 days prior) → Failover executed → Connection-pool issue doubles retries.  
  - Batch job would have caused overload in ~4 hours.  

  **Step 1: Variables**  
  - `V1: CanaryDeploy = enabled` (actionable: rollback).  
  - `V2: RetryJitter = false` (actionable: add jitter).  
  - `V3: CircuitBreakerState = disabled` (actionable: enable).  
  - `V4: FailoverExecution = triggered` (actionable: improve runbook).  
  - `V5: ConnectionPoolSize = default` (actionable: override).  
  - `V6: BatchJob = scheduled` (actionable: reschedule/optimize).  

  **Step 2: Absences**  
  - `V3` (disabled circuit breaker) promoted (engineered/expected).  
  - Absence of jitter (`V2`) promoted (engineered/expected).  
  - Unclosed ticket demoted (not a variable; symptom of `V3`).  

  **Step 3: Preemption/Overdetermination**  
  - Preemption: Batch job (`V6`) is a latent risk (not a cause; would have triggered later).  
  - No overdetermination.  

  **Step 4: Test Interventions**  
  - `V1`: Rollback canary → Incident prevented? **Yes** (robust across traffic; High confidence).  
  - `V2`: Enable jitter → Incident prevented? **Yes** (robust; Medium confidence).  
  - `V3`: Enable circuit breaker → Incident prevented? **Yes** (robust; High confidence).  
  - `V4`: Skip failover → Outage reduced? **Yes** (but not prevented; Medium confidence).  
  - `V5`: Increase connection pool → Outage reduced? **Yes** (robust; High confidence).  
  - `V6`: Delay batch job → Not applicable (latent risk).  

  **Step 5: Causal Claims**  
  1. **Claim 1 (CanaryDeploy):**  
     - Rigorous: "Changing CanaryDeploy from enabled to disabled by rolling back, with RetryJitter and CircuitBreakerState held fixed, would have prevented the incident in all traffic conditions with High confidence."  
     - Plain: "The canary deploy introduced a slow query that triggered retries. Fix: Improve query testing."  
     - Attachments: Intervention=Rollback deploy; Held fixed=RetryJitter, CircuitBreaker; Condition range=All traffic; Confidence=High.  
  2. **Claim 2 (RetryJitter):**  
     - (Similar format; cause of escalation).  
  3. **Claim 3 (CircuitBreakerState):**  
     - (Direct cause of containment failure).  
  4. **Claim 4 (Failover + ConnectionPool):**  
     - Rigorous: "Changing FailoverExecution to skipped OR ConnectionPoolSize to increased, with other variables fixed, would have reduced the outage by ~40 minutes in multi-region setups with High confidence."  
     - Plain: "The failover doubled retry load due to a connection-pool issue. Fix: Update runbook and connection defaults."  

  **Step 6: Handoff**  
  - Latent risk: Batch job (`V6`) → Handoff to humans: "Is this risk acceptable?"  
  - Responsibility: App team owns `V1`; Infra owns `V3`; SRE owns runbook (`V4`).  

  ---

  #### **Incident B: TLS Certificate + DNS + Alert**  
  **Step 0 Timeline:**  
  - Expired TLS certificate + stale DNS TTL → Both sufficient → Fixed in same change → Alert muted during migration.  

  **Step 1: Variables**  
  - `V1: CertValidity = expired` (actionable: renew cert).  
  - `V2: DNSTTL = stale` (actionable: update TTL).  
  - `V3: AlertState = muted` (actionable: unmute).  

  **Step 2: Absences**  
  - `V3` (muted alert) promoted (engineered/expected safeguard).  

  **Step 3: Preemption/Overdetermination**  
  - Overdetermination: `V1` and `V2` are independently sufficient → Both causes.  

  **Step 4: Test Interventions**  
  - `V1`: Renew cert → Incident prevented? **Yes** (robust; High confidence).  
  - `V2`: Update DNS → Incident prevented? **Yes** (robust; High confidence).  
  - `V3`: Unmute alert → Incident prevented? **No** (would have warned but not prevented; demoted to contributing factor).  

  **Step 5: Causal Claims**  
  1. **Claim 1 (CertValidity):**  
     - Rigorous: "Changing CertValidity from expired to valid by renewal, with DNSTTL held fixed, would have prevented the incident in all environments with High confidence."  
     - Plain: "The expired TLS certificate caused client failures. Fix: Improve cert rotation."  
  2. **Claim 2 (DNSTTL):**  
     - Rigorous: "Changing DNSTTL from stale to updated, with CertValidity held fixed, would have prevented the incident in all environments with High confidence."  
     - Plain: "Stale DNS TTL pinned clients to a dead host. Fix: Enforce TTL refresh policies."  
     - Note: "Either Claim 1 or Claim 2 alone would have caused the incident."  
  3. **Claim 3 (AlertState):**  
     - Not a cause (only contributing factor): "Muted alert delayed detection."  

  **Step 6: Handoff**  
  - Responsibility: Security team owns certs; Networking owns DNS.  

  ---

  #### **Incident C: Database Migration + Tooling Choice**  
  **Step 0 Timeline:**  
  - Database migration → Downtime due to row-lock issue → Plan approved → Tooling chosen 2 years prior.  

  **Step 1: Variables**  
  - `V1: MigrationExecution = executed` (actionable: not useful; plan was followed).  
  - `V2: TestCoverage = missing_rowlock_test` (actionable: add test).  
  - `V3: MigrationTool = ToolX` (actionable: switch tooling).  
  - Time window: Excludes `V3` (tooling choice 2 years ago) → Too distant.  

  **Step 2: Absences**  
  - `V2` (missing test) promoted (engineered/expected).  
  - Tooling limitation demoted (not a variable per Step 1).  

  **Step 3: Preemption/Overdetermination**  
  - None.  

  **Step 4: Test Interventions**  
  - `V1`: Skip migration → Not feasible (business requirement).  
  - `V2`: Add row-lock test → Incident prevented? **Yes** (would have caught issue; High confidence).  
  - `V3`: Change tooling → Not tested (excluded by time window).  

  **Step 5: Causal Claims**  
  1. **Claim (TestCoverage):**  
     - Rigorous: "Changing TestCoverage to include row-lock tests, with MigrationExecution held fixed, would have prevented the incident in any migration using ToolX with High confidence."  
     - Plain: "Missing tests for row-lock behavior caused downtime. Fix: Add test coverage for lock contention."  
     - Attachments: Intervention=Add test; Held fixed=MigrationExecution; Condition range=All migrations; Confidence=High.  

  **Step 6: Handoff**  
  - Values: "Should we invest in new tooling despite the cost?" → Handoff to leadership.  
  - Responsibility: DB team owns tests; architecture board owns tooling review.  

