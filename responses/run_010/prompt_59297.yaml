answer: |-
  ## Art as Evidence, Art as Cry: Ishiguro's Institutional Counter-Stage in *Never Let Me Go*

  Your instinct to move beyond using the novel as mere "wallpaper" for institutional theories is spot on. Ishiguro doesn't just illustrate Danto or Dickie; he constructs a chillingly precise *simulacrum* of an art institution within Hailsham to interrogate the very foundations those theories rest upon. Let’s map the stage:

  Hailsham meticulously replicates artworld structures. The **Guardians act as critics and gatekeepers**, ranking student work, fostering competition ("Who do you think is the best artist?"), and implicitly setting standards (Tommy's "silly animals" are dismissed). The **Exchanges function as a micro-market**, complete with tokens as currency, establishing value through peer desire and scarcity. **Madame's Gallery serves as the ultimate validating institution**, a curated collection signifying prestige and "success." Finally, the **revealed purpose** – proving clones possess souls to a skeptical outside world – positions the art as *evidence*, the product legitimized solely for its instrumental value in an anthropological argument about humanity. This isn't just an artworld; it's an artworld explicitly designed for non-artistic ends.

  So, is it art? **Institutionalism (Dickie/Danto) should say "Yes, absolutely."** Dickie defines an artwork as an artifact "which has had conferred upon it the status of candidate for appreciation by some person or persons acting on behalf of a certain social institution (the artworld)." Check. Danto's "artworld" provides the necessary theoretical atmosphere and historical context for something to *be* art. Hailsham, as a self-contained institution with its own norms, rules, and conferring agents (Guardians, Madame), seems to perfectly fit. By their lights, Tommy's animal drawings *are* art within Hailsham.

  But the novel screams discomfort with this answer. **Why the strain?** Because institutionalism focuses on the *conferral* and *structure*, but Ishiguro exposes the hollowness when the *purpose* and *reception* are fundamentally alien to art's core functions as we intuitively understand them:
  1.  **Art as Evidence, Not Experience:** The art's value for the *outside* world lies entirely in its *existence* as proof of interiority ("Look, they *make* things!"), not in its aesthetic qualities, emotional impact, or interpretive richness. The Gallery isn't for viewing pleasure; it's a specimen jar. The guardians' judgments seem focused more on technical competence or perceived "soulfulness" than aesthetic merit per se. This flips art's purpose: instead of being appreciated *for itself*, it's a means to an anthropological end.
  2.  **The Missing "Artworld" Light (Levinson):** Jerrold Levinson’s historical intentionalism argues something is art if intended for regard *in a way prior artworks* were regarded. The clones at Hailsham have **no meaningful exposure to prior art history or context**. Their work exists in a vacuum, shaped only by the guardians' directives and peer imitation. What "light" are their drawings meant to be regarded in? Only the light of proving they *can* create, not within the tradition of landscape, portraiture, or abstraction. Their intentionality is profoundly constrained and directed towards the institutional goal, not artistic tradition.
  3.  **The Soul Specimen vs. Tolstoyan Infection:** This is where your hunch about Madame and Kathy's dance hits powerfully. Tolstoy defined art as the communication of feeling from artist to recipient, a direct "infection." The Gallery art fails this utterly for the outside world; it's cold evidence. **But Kathy dancing to "Never Let Me Go"?** That's different. Madame isn't assessing technical skill or collecting evidence. She's overwhelmed by the raw, unintended transmission of feeling – Kathy's yearning embodied in the dance with the pillow, mediated through a commercial tape. It bypasses the institution entirely. It's a moment of pure, unmediated *infection*. Madame cries *because* she feels what Kathy feels, however imperfectly. In this moment, the cheap tape and childish dance achieve what the carefully curated Gallery fails to do: create genuine, human connection through embodied emotion. The institution (Hailsham) becomes the barrier to true art, while the authentic moment happens *despite* it.

  **Pushing Back & Nuancing:**
  1.  **Kathy's Narration as Art:** You're right to suspect this cuts against a purely external Tolstoyan reading. Ishiguro's genius is making Kathy's *telling* the ultimate artwork. Her narrative is carefully constructed, infused with deep feeling (longing, loss, quiet acceptance), and designed to infect *us*, the readers. It transcends the institutional cage of Hailsham. This *is* art in the Tolstoyan sense, communicated to an audience beyond the novel's world. It suggests art's power persists *through* individuals, even when institutions co-opt its products.
  2.  **Madame's Context:** While the dance moment feels pure, Madame *is* still part of the institution. Her reaction is complex – is it purely Tolstoyan infection, or also horror at the system she enables, seeing the humanity it denies? The institution haunts even this "authentic" moment.
  3.  **Institutionalism's Partial Hold:** The institutional structure *does* function internally. The students *do* value their art intrinsically at the Exchanges, finding personal meaning and connection in creation and trade *among themselves*. Within Hailsham, Tommy's drawings *are* art for Tommy and his peers, even if dismissed by guardians. Dickie isn't entirely wrong *inside the bubble*; the problem is the bubble's purpose and its relationship to the wider world.

  **What the Novel Contributes that Weitz/Beardsley Can't:**
  *   **Institutional Co-option & Violence:** Weitz (anti-essentialism, "open concept") and Beardsley (aesthetic experience theory) debate art's boundaries. Ishiguro shows us **institutional power not just defining art, but potentially hollowing it out and weaponizing it.** The Gallery isn't a neutral space; it's an instrument of biopolitical control, using art as proof to manage a subjugated class. This exposes the dark potential within institutional theories – what happens when the "artworld" serves dehumanizing ends?
  *   **Art as Proof of Humanity vs. Art as Humanity:** The novel forces the question: If art is used to *prove* you have a soul, but the act of creation *is* the expression of that soul, what does that say about the institution demanding proof? It highlights the **absurd cruelty of demanding evidence for inherent humanity through culturally specific practices**.
  *   **The Primacy of the Personal Act:** Beyond theories, Ishiguro underscores that art's most fundamental power – the Tolstoyan infection – resides in the direct, human act of creation and reception, often *despite* or *outside* formal institutions. Kathy's dance and her narration are testaments to this.
  *   **History & Deprivation:** Levinson's requirement feels painfully inadequate here. The clones' lack of art history isn't incidental; it's *essential* to their conditioning. The novel asks: **Can meaningful art emerge from profound historical and cultural deprivation, intended only for instrumental use within a closed system?** Institutional theory might say "yes" formally, but the novel screams that this "art" lacks the vital connection to human experience and tradition that gives art its enduring resonance.

  **Conclusion:**
  Ishiguro isn't just offering a counterexample; he's staging a tragic thought experiment. Within Hailsham's institutional frame, the drawings *are* art by its own rules (Dickie/Danto), yet feel profoundly *not-art* because they are severed from art's core purpose of shared human feeling and connection (Tolstoy) and lack grounding in artistic tradition (Levinson). The Gallery represents the perversion of art into a tool of validation for the validators. The true artistic moments – Kathy's dance infecting Madame, and Kathy's narration infecting *us* – happen outside or in defiance of this system. The novel thus contributes a devastating critique: institutional frameworks can legitimize objects *as* art while simultaneously stripping them of art's essential humanity. Art's deepest power, Ishiguro suggests, lies not in the conferred status or the specimen jar, but in the raw, uncontrollable transmission of feeling between one vulnerable soul and another, even (or especially) in the face of systems designed to deny that very soul. This is a dimension of art's definition and vulnerability that pure philosophical argument struggles to capture with the same visceral force.
