prompt: |-
  You're a philosopher of art who teaches with novels a lot — bear with me on this one. I'm prepping a session on the definition of art around Ishiguro's Never Let Me Go, and I want a reading that doesn't just use the book as wallpaper for Danto and Dickie.

  Start with a few paragraphs of brainstorming: map out the ways the novel actually stages art-institution stuff — the guardians ranking the students' work, the kids trading pieces for tokens at the Exchanges, Madame carting the best of it off to the Gallery, Tommy's embarassing animal drawings, and the late reveal that the whole collection existed to convince the outside world that clones had souls.

  Then the question I care about: is the Hailsham art actually art? An institutional theory looks like it should say yes without strain — there's an artworld in miniature on the page, complete with a market, judges, a curator and a collection. But the novel treats the work as evidence, closer to a specimen or a testimony than an artwork, and nobody ever suggests the outside world cares how the drawings look. Is Ishiguro knowingly writing a counterexample to Dickie and Danto, or is he just using art as a stand in for personhood? Work in Tolstoy's infection view and Levinson's historical definition too — the historical one seems especially awkward here, since the students had no prior art in whose light their work was meant to be regarded.

  Here's my hunch, and push back on it if it's wrong: the only moment in the book where art does what art is supposed to do is Madame crying in the doorway at little Kathy dancing with a pillow to a mass-produced Judy Bridgewater tape — a cheap commercial object, no artworld, no curation, one person's feeling transmitted into another. If that's right the novel is basically Tolstoyan and the Gallery is the villain rather than the hope.

  Stay faithful in both directions: don't reduce the book to an illustration of the debate, and don't stretch the theories to fit it. Tell me plainly where my reading breaks — I already suspect Kathy's own narration counts as an artwork and cuts against me. Finish with what the novel contributes to the definitional debate that an argument in Weitz or Beardsley couldn't. Around 1200 words, no bibliography or works-cited stuff, just name the positions as you go.
