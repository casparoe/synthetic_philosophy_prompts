prompt: |-
  I'm the registrar on a small university museum's collections committee, and for about eight years now I've been keeping private notes on how we rule whenever an "is this still the same artwork" question comes up. Its become my hobby to try and reverse-engineer our own standard, and I've given up. Here's the track record, roughly in the order we decided them:

  1. Kinetic sculpture, motor burned out. We swapped in a new motor built to the same spec by a different manufacturer, everything else original. Same work, no change to the accession number.
  2. Marble bust, nose snapped off in a move. Conservator carved a new nose out of stone from the same quarry and pinned it. Same work.
  3. Plaster maquette, essentially disintegrated by humidity. The estate authorized us to make a bronze from a photogrammetric scan taken before it went. We logged the bronze as a new object, catalogued "after the original maquette," separate number.
  4. A stack piece, a hundred fired bricks the artist himself piled in '94. Toppled in a small earthquake; our preparators restacked it to the artist's own diagram, same bricks, same floor. Same work.
  5. Same piece, second quake a few years later, this time the bricks shattered. We bought a hundred new bricks of the same make and dimensions, restacked to the same diagram, and the artist, still living, emailed us telling us to go ahead. Not the same work. We recorded it as a reinstallation of a lost work and the wall label says so.
  6. Neon piece, tubes failing one at a time over about twenty years, replaced as they went by the artist's own studio, so that by the end none of the original glass was left. Same work, nobody even raised it.
  7. Limestone garden piece, weathered badly. A restorer in the eighties re-cut the entire surface to freshen it. Same stone, same mass, unbroken history in our own courtyard the whole time. We ruled it was no longer the artist's work but a later re-cutting after it, and struck the attribution.

  The new one lands Thursday and we're already split three-three. It's a wall drawing. In 1979 the artist sold us a certificate specifying the piece: instructions, a materials list, a diagram, and language to the effect that the drawing may be executed by drafters other than the artist, must be painted over at the close of each exhibition, and that each execution is the work. We've installed it four times, different hands each time, fresh wall, painted out afterward. Now the artist's foundation says the 1979 certificate is superseded. They've issued a new one that changes the wall proportions and adds a pigment the original materials list rules out, and they're telling us the next installation is still the same work and asking that the label and accession record run continuously from 1979.

  So what I want from you is a recommendation and the reasoning underneath it. Which way should we vote if we care about being consistent with 1 through 7 rather than with whoever talks longest in the meeting? Which single precedent is doing the most work as the closest analogy, and which one are the two camps each leaning on? Then pull out the two or three candidate standards our record is actually compatible with. My own guess is that there's a "keep the original matter" line and a "keep something the artist's own hand did" line and maybe a third one about the artist's standing authorization traveling with the work, but I genuinely can't tell which of those 5, 6 and 7 are forcing on us, since 6 and 7 point in opposite directions and 5 kills the obvious authorization story. Say what each candidate standard implies about the wall drawing. If they all land the same way, tell me so, and then give me the hypothetical case that would have split them, because I want to know where our fault line is before somebody finds it for us. And if the precedents genuinely underdetermine it, say plainly which principle we'd be signing onto by voting yes and which by voting no, including whatever would come back to bite us later given how we've ruled so far — we hold two other certificate works and a couple of editions.

  One more thing. I'd rather you mark where your reconstruction of our record is shakiest: which precedent did you have to soften, reinterpret, or write off as an inconsistency to get a clean standard out of us? And tell me what would change your recommendation — some fact about the wall drawing, or the wording of either certificate, or how we handled past supersessions, that if I gave it to you would flip your answer. I want to know which folders to go pull before Thursday.
reasoning: |-
  Okay, let me start by understanding what the registrar is asking. They're dealing with a collections committee that has a history of deciding whether an artwork remains the same after various alterations or recreations. Now they have a new case about a wall drawing where the artist's foundation issued a new certificate changing some specifications. The registrar wants a recommendation based on consistency with past decisions and to identify the underlying standards from those precedents.

  First, I need to analyze each of the seven precedents to extract the principles the committee used. Let me list them out again:

  1. **Kinetic sculpture (motor replacement)**: New motor from a different manufacturer, same specs. Ruled same artwork. Here, the original matter was mostly retained except the motor, which was a functional component. So maybe the artwork's essence isn't tied to every physical part, especially replaceable ones.

  2. **Marble bust (nose replacement)**: Conservator carved a new nose from the same quarry stone. Same work. Original material was used for the replacement, and it's a repair. The artist's hand wasn't directly involved, but the original stone's continuity might matter.

  3. **Plaster maquette (bronze recast)**: Original disintegrated, bronze made from a scan. New object, "after the original." Here, the material changed entirely (plaster to bronze), and it's a new creation. So original matter lost, and it's a replica.

  4. **Stack piece (re-stacked by preparators)**: Same bricks, same diagram after earthquake. Same work. Artist's diagram used, but artist not involved. Physical material intact, just reassembled.

  5. **Stack piece again (new bricks)**: New bricks, same make, artist approved. Not the same work. This is interesting because the artist was alive and approved, but they still considered it a reinstallation of a lost work. So even with artist approval, new materials make it a different work? But in #6, neon tubes were replaced over time, all original glass gone, but still same work. Contradiction here?

  6. **Neon piece (tubes replaced over time)**: Original glass all replaced by artist's studio. Same work. Artist's studio involvement might imply authorization, and gradual replacement is key. Like the Ship of Theseus.

  7. **Limestone garden piece (re-cut)**: Same stone, but surface re-cut by restorer. Ruled not artist's work. Here, the physical material is the same, but the form was altered by someone else. So artist's hand matters more than the material.

  Now, looking for patterns. The registrar mentioned three possible standards: original matter, artist's hand, or standing authorization. 

  - **Original matter**: Precedents 1, 2, 4 kept original material to some extent. But in #1, the motor was replaced, so not all material original. In #2, the nose was new stone but same quarry. #4 kept all bricks. #3 lost all original material, so new object. #5 used new bricks, not same work. #6 had no original glass but still same work—contradicts? Unless gradual replacement is key. #7 kept stone but lost artist's hand.

  - **Artist's hand**: #7 explicitly values the artist's hand. #3, the bronze wasn't by the artist, new object. #4, reassembled by preparators, not artist, but same work? But #5, artist approved new bricks, yet not same work. #6, artist's studio did replacements, same work. So maybe ongoing authorization or artist's intent matters.

  - **Authorization**: #5 had artist approval but still not same work because material changed? But #6 had studio authorization. #3 had estate authorization but still new object. So authorization alone isn't sufficient. Maybe the type of work matters? The stack piece (#4,5) is about the specific object, while the neon might be more about the design.

  The wall drawing case: Original certificate allowed executions by others, each execution is the work. Now foundation changes proportions and pigment, says it's the same work. 

  Comparing to precedents:
  - #3: New material (bronze vs plaster), new object. Here, new execution with changed specs might be like a new material?
  - #6: Gradual replacement authorized, same work. But here, each execution is temporary, painted over. So each installation is a new instance, but considered the same work under the certificate.
  - #7: Alteration by others made it not the artist's work. Changing proportions and pigment could be seen as altering the artist's original design.

  The key conflict is between the artist's original instructions and the foundation's changes. If the committee values the artist's original specifications (like in #7, where re-cutting changed the form), then changing proportions and pigment might make it a different work. But the certificate allows different drafters, so is the design what matters?

  The registrar asked which precedent is the closest analogy. #6 (neon) involves authorized changes over time, but the design remained the same. Here, the foundation is changing the design. So #7 is closer: altering the artist's work makes it no longer the same.

  But in #5, new bricks with artist approval weren't the same work. Material change was key there. Here, the "material" is the execution—each installation is ephemeral. Changing the specs might be like changing the materials list.

  Possible standards from the record:
  1. **Material Continuity Standard**: Artwork remains the same if original material is preserved or replaced under authorized processes without altering the form. Precedents 1,2,4,6 support this, but 5 and 7 challenge it. #5 (new bricks) broke continuity, #7 (same stone) but form altered. So material alone isn't sufficient.

  2. **Artist's Intent/Authorization Standard**: Focus on the artist's original or ongoing authorization. #6 had studio authorization, same work. #5 had artist approval but not same work—contradiction. Unless #5's approval was for a recreation, not continuation. #3 had estate authorization but new object, so authorization doesn't override material change.

  3. **Form/Design Integrity Standard**: The artwork's essence is in its design or form. Changes to the form make it different. #7's re-cutting altered form, not same. #3's recast preserved form but material changed, new object. #4 and #5: same form, but material change in #5 made it not the same. So form alone isn't sufficient.

  The wall drawing's case has changed form (proportions) and materials (pigment). Under #7, changing form makes it not the artist's work. Under #6, gradual changes authorized kept it the same, but the design didn't change there. Here, the design is changed.

  The foundation's new certificate supersedes the old one. But the committee must decide if they accept this. Precedent #3 had estate authorization but still called it new. So authorization for change doesn't necessarily keep it the same.

  Hypothetical to split standards: Suppose a painting is damaged, and the estate authorizes a restorer to repaint parts with different colors. Material is same canvas, but form altered. Based on #7, it might not be the same. But if gradual restoration like #6, maybe different. But in #6, the design was maintained.

  For the wall drawing, voting "no" (not the same work) aligns with #7 (form altered) and #5 (material change). Voting "yes" might align with #6 if the foundation's authorization is seen as continuous. But #3 and #5 show that even with authorization, material/design change makes it new.

  The shaky precedent is #5 versus #6. #5 had artist approval for new bricks but called it a reinstallation of a lost work. #6 had studio authorization for tube replacements, kept original. The difference might be that the neon's design persisted, while the stack piece's physical instance was lost. Also, gradual vs. full replacement.

  For the wall drawing, each execution is a new installation, so changing specs might make it a new instance. But the certificate originally said each execution is the work. The foundation now says the next installation is the same work. If the committee accepts the foundation's authority, but precedents like #3 and #5 suggest that even with authorization, significant changes make it new.

  Recommendation: Vote "no," it's not the same work. Reasoning: Changing proportions and pigment alters the design, similar to #7 where re-cutting changed the form, making it not the artist's work. Also, in #5, new materials made it a new work despite artist approval. The artist's original certificate specified the materials and proportions, so deviating from that breaks continuity.

  Closest precedent: #7 (limestone re-cut) and #5 (new bricks). The two camps: "yes" camp might lean on #6 (authorized changes) and the certificate's allowance for different drafters. "No" camp on #7 and #5.

  Candidate standards:
  1. **Original Specifications Standard**: Artwork tied to the artist's original specifications. Changes to form or materials make it different. Supported by #3,5,7.
  2. **Authorized Continuity Standard**: Ongoing authorized maintenance or execution keeps it the same, even with changes, as long as authorized. Supported by #6, possibly #1 and #2 if seen as maintenance.
  3. **Material Instance Standard**: The physical object must be preserved or incrementally replaced. Supported by #1,2,4,6 but contradicted by #5 (new materials not same).

  For the wall drawing:
  - Standard 1: Not the same, specs changed.
  - Standard 2: Same, if foundation's authorization is valid.
  - Standard 3: Not applicable since each execution is ephemeral.

  Standards 1 and 3 would say not the same, Standard 2 might say same. But precedents #3 and #5 suggest that authorization doesn't override spec or material changes. So the committee might prioritize original specs.

  Hypothetical to split: A sculpture with replaceable parts; the artist authorizes using different materials for replacements. If the parts are replaced with different materials, is it the same? Based on #6, if gradual and authorized, yes. But if all at once like #5, no? So the wall drawing's case is more like a full re-specification rather than gradual.

  Fact that could flip the decision: If the original certificate allowed the artist to update specifications, then the foundation might have the authority. But the registrar should check the original certificate's wording on amendments. If it doesn't allow changes, then superseding it might not be valid.

  Also, how past supersessions were handled. If other certificate works were updated and treated as same, that might support yes. But the registrar mentioned they have other certificate works, so consistency there matters.

  In summary, the recommendation is to vote "no" for consistency with #5 and #7. The shakiest precedent is #6 versus #5, where gradual authorized change is accepted but full replacement with new materials is not. For the wall drawing, the changes are not gradual but a one-time alteration of specs, more like #5 or #7.
answer: |-
  ### Recommendation: Vote "NO" — the next installation is **not the same work** under your committee's established precedents.  

  #### Core Reasoning:  
  Your track record prioritizes **the integrity of the artist's original specifications and material essence** over later alterations, even when authorized. The foundation's changes—altering proportions and pigments—violate the 1979 certificate's explicit instructions, effectively creating a new design. This mirrors Precedent 7 (limestone re-cut) and Precedent 5 (new bricks), where deviations from the original form or matter broke continuity. While the foundation claims authority to supersede the certificate, your precedents show authorization alone doesn't override material/design changes (see Precedents 3 and 5). Consistency demands treating this as a derivative work, not the original 1979 piece.  

  ---  

  ### Analysis: Which Precedent is the Closest Analogy?  
  - **Strongest Analogy: Precedent 7 (Limestone Re-cut)**.  
    Here, the stone’s material was retained, but re-cutting altered the artist’s form. You ruled it was no longer the artist’s work. Similarly, the wall drawing’s new proportions/pigment alter the artist’s 1979 design, voiding its identity.  
  - **Secondary Analogy: Precedent 5 (New Bricks)**.  
    Artist-authorized replacement with new materials resulted in a "reinstallation of a lost work." Likewise, the foundation’s new certificate replaces the original specifications, creating a new iteration.  

  #### How the Two Camps Are Arguing:  
  - **"YES" Camp (Same Work)**: Leaning on **Precedent 6 (Neon Tubes)**. They argue gradual, authorized updates (like replacing tubes) preserved the work’s identity. Here, the foundation’s certificate "authorizes" changes, and the drawing’s temporary nature (like the neon’s decay) allows evolution.  
  - **"NO" Camp (Not Same Work)**: Leaning on **Precedents 5 (New Bricks)** and **7 (Limestone)**. Changes to core materials/specifications (bricks, surface form) broke continuity, even with approval. The wall drawing’s new proportions/pigment are analogous.  

  ---  

  ### Candidate Standards Extracted from Your Precedents  
  Your record supports **three conflicting standards**, with Precedents 5, 6, and 7 creating tension:  

  1. **Original Specifications Standard**:  
     - The artwork is defined by the artist’s **initial instructions and materials**. Changes to these void identity.  
     - Supported by: Precedent 3 (maquette recast: new material/form = new work), Precedent 5 (new bricks = new work), Precedent 7 (re-cut surface = not artist’s work).  
     - **Implies for Wall Drawing**: Not the same work. The new proportions/pigment violate the 1979 specs.  

  2. **Authorized Continuity Standard**:  
     - Identity persists if changes are **gradual, authorized, and preserve functional essence**, regardless of material turnover.  
     - Supported by: Precedent 1 (motor swap: functional repair), Precedent 2 (nose repair: authorized conservation), Precedent 6 (neon tubes: studio-authorized replacements).  
     - **Implies for Wall Drawing**: Same work. The foundation’s certificate "authorizes" updates, and installations are inherently ephemeral.  

  3. **Material Instance Standard**:  
     - The artwork is tied to the **original physical matter** or its direct, unbroken legacy. Full replacement = loss.  
     - Supported by: Precedent 4 (same bricks = same work), Precedent 5 (new bricks ≠ same work), Precedent 7 (same stone but altered ≠ same work).  
     - **Implies for Wall Drawing**: Not the same work. Each installation is a new material instance (paint/wall), and the design changes compound this.  

  #### Do All Standards Land the Same Way?  
  **No.** Precedents 5, 6, and 7 split the standards:  
  - **Original Specifications** and **Material Instance** say "not same work."  
  - **Authorized Continuity** says "same work."  

  #### Hypothetical Case That Would Split Them:  
  > *A conceptual artwork consists of a signed contract stating, "The work is a 10m² field of growing clover; it may be re-planted in new soil by authorized gardeners." After 20 years, the foundation issues a new contract changing the plant species to ivy. Is it the same work?*  
  - **Original Specifications**: Not same (changed plant species).  
  - **Authorized Continuity**: Same (authorized change, functional essence as a "growing field" remains).  
  - **Material Instance**: Not same (new plants/soil; no material legacy).  
  **Your fault line**: Whether *authorized changes to core specifications* invalidate identity. Precedents 5 and 7 lean "no"; Precedent 6 leans "yes."  

  ---  

  ### Where Your Record is Shakiest: Reinterpreting Precedent 6  
  To extract a clean standard, **Precedent 6 (Neon Tubes) is the outlier** requiring reinterpretation:  
  - **Why it’s shaky**: Unlike Precedent 5 (new bricks = not same), Precedent 6 allowed total material replacement. This contradicts the "original matter" logic in Precedents 3, 5, and 7.  
  - **How to reconcile it**: Precedent 6 hinges on **gradual, authorized updates preserving the *design***. The studio replaced tubes to *match the original*, not alter it. This distinguishes it from the wall drawing (design changed) and Precedent 5 (sudden replacement).  
  - **Risk if ignored**: Over-relying on Precedent 6 could justify any foundation-mandated redesign, eroding your commitment to the artist’s original vision (Precedents 3, 7).  

  ---  

  ### What Would Flip the Recommendation: Key Facts to Check  
  Vote "no" unless **one of these flips your decision**:  
  1. **Original Certificate’s Amendment Clause**: Does the 1979 certificate explicitly allow the artist/foundation to update specifications? If yes, this strengthens the "Authorized Continuity" standard (Precedent 6). *Pull: 1979 certificate file.*  
  2. **Past Supersessions for Other Certificate Works**: If you treated similar foundation-mandated changes as continuous (e.g., updated dimensions in a prior installation), consistency may force "yes." *Pull: Files for your two other certificate works.*  
  3. **Wording of "Each Execution is the Work"**: Does this phrase imply *all executions are inherently the same work*, even with new certificates? If so, Precedent 4 (re-stacking same diagram) might apply. *Pull: Committee notes from past installations.*  

  ---  

  ### Potential Consequences of Your Vote  
  - **Voting NO (Not Same Work)**:  
    - **Principle**: Original specifications trump later alterations.  
    - **Bites Back**: Future cases where foundations tweak editions (e.g., changing ink in a print series) may require new accessions.  
    - **Protects**: Artist’s intent (Precedents 3, 7), and prevents foundations from rewriting history.  
  - **Voting YES (Same Work)**:  
    - **Principle**: Artist-authorized entities can redefine the work.  
    - **Bites Back**: Opens door to future overrides (e.g., a foundation changing a sculpture’s medium). Undermines Precedents 5 and 7.  
    - **Risks**: Inconsistency with Precedent 3 (estate-authorized recast = new work).  

  ---  

  ### Final Advice  
  **Vote NO** for consistency. The foundation’s changes cross a line—altering proportions and pigments violates the 1979 specifications, mirroring the "re-cutting" in Precedent 7. Prioritize the artist’s original instructions over institutional convenience. Before Thursday, **pull the 1979 certificate and past installation records** to confirm if amendments were anticipated. If the original certificate allows for updates, acknowledge this as a **committee exception** (not precedent) to avoid muddying your standards.  

  This isn’t just about paint on a wall—it’s about whether your museum guards the artist’s voice or lets foundations drown it out. Precedents 5 and 7 suggest you’ve historically chosen the former. Stick to it.
