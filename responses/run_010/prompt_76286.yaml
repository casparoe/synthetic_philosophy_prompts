  **Case A: The ER Doctors**

  Dr. Ava and Dr. Ben are ER physicians evaluating a patient for a rare disease X. They share a common prior: P(X)=1/3. Each has run a test, with possible results High, Medium, or Low. The likelihoods are known and identical for both tests:

  - P(High|X) = 1/2, P(Medium|X)=1/3, P(Low|X)=1/6
  - P(High|~X)=1/6, P(Medium|~X)=1/3, P(Low|~X)=1/2

  Ava got High, Ben got Low. Hospital policy: recommend treatment if posterior >=0.6.

  *Ava's initial posterior*:  
  P(X|High) = [ (1/2)*(1/3) ] / [ (1/2)*(1/3) + (1/6)*(2/3) ] = (1/6) / (1/6 + 2/18) = (1/6) / (1/6 + 1/9) = (1/6) / (3/18+2/18) = (1/6)/(5/18) = 3/5 = 0.6 → treat.

  *Ben's initial posterior*:  
  P(X|Low) = [ (1/6)*(1/3) ] / [ (1/6)*(1/3) + (1/2)*(2/3) ] = (1/18) / (1/18 + 2/6) = (1/18) / (1/18 + 6/18) = (1/18)/(7/18) = 1/7 ≈0.1429 → not treat.

  **Transcript**  
  1. Ava: "I recommend treatment."  
  2. Ben: "I recommend against."  
  3. Ava: "My test was strongly positive."  
  4. Ben: "Mine was strongly negative."  
  5. Ava: "Then we disagree. Let's get a consult."  
  6. Ben: "Wait, what's your posterior? Mine is 1/7."  
  7. Ava: "Mine is 3/5. That's odd. What was your test result?"  
  8. Ben: "Low. Yours?"  
  9. Ava: "High."  

  **Collapse**  
  Both now know both results. They compute:  
  P(X|High, Low) = [ (1/2 * 1/6) * (1/3) ] / [ (1/2*1/6)*(1/3) + (1/6*1/2)*(2/3) ] = [ (1/12)*(1/3) ] / [ (1/12)*(1/3) + (1/12)*(2/3) ] = [1/36] / [1/36 + 2/36] = 1/3.  
  Both now have posterior 1/3 < 0.6, so both recommend against treatment.  

  **Load-bearing feature**: The initial exchange of actions and qualitative statements did not convey the exact test results. Announcing posteriors prompted sharing of results, leading to agreement. Without sharing results (or if they had shared results initially), agreement would have occurred earlier.

  **Case B: The Startup Pitch**

  Venture capitalist Vic and founder Fiona are assessing the success chance (S) of Fiona’s startup. Vic’s prior: P(S) = 1/10 (from seeing 1000 startups, 100 succeeded). Fiona’s prior: P(S) = 1/2 (founded twice, one success). They both see a market report: Favorable (F). Likelihoods:  
  - P(F|S) = 3/4, P(F|~S) = 1/4  

  *Vic’s posterior*:  
  P(S|F) = [ (3/4)*(1/10) ] / [ (3/4)*(1/10) + (1/4)*(9/10) ] = (3/40) / (3/40 + 9/40) = 3/12 = 1/4.  

  *Fiona’s posterior*:  
  P(S|F) = [ (3/4)*(1/2) ] / [ (3/4)*(1/2) + (1/4)*(1/2) ] = (3/8) / (4/8) = 3/4.  

  **Transcript**  
  1. Vic: "After the report, I think P(S) = 25%."  
  2. Fiona: "I think it’s 75%."  
  3. Vic: "I’ve seen many startups; this one isn’t special."  
  4. Fiona: "But this report is very positive!"  
  5. Vic: "My prior was 10%, now 25%."  
  6. Fiona: "Mine was 50%, now 75%."  
  ... (no convergence)  

  **Why no collapse?** They have no common prior. The common prior assumption is violated.  

  **Objection and survival**: The objection that prior differences must stem from different information is valid, but in this case, the different information (past experiences) is not shareable or incorporable into the current probability of S. Vic and Fiona agree that their priors differ due to different backgrounds, but they cannot reconcile these by sharing evidence about S. Case B survives if we consider S as the event in question and the past as inaccessible for Bayesian updating in this interaction.  

  **Coda**: With priors close but not identical, posteriors will be close after sharing evidence. The gap narrows but may not vanish.  

  **Load-bearing feature for Case B**: Differing priors. With common prior, they’d agree after seeing the same evidence.
