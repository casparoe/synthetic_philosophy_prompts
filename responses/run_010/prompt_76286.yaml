  ### Case A: Honest, Common Prior, No Posterior Announcement  
  **Setting:** Two ER doctors, Ava and Ben, are assessing a patient for a rare condition Z. They share a common prior (P(Z) = 1/3\)), and each ordered a test. Tests are conditionally independent given Z. Likelihoods:  
  - If Z, test is positive w.p. 9/10, negative w.p. 1/10.  
  - If not Z, test is positive w.p. 1/10, negative w.p. 9/10.  
  Ava’s test is positive; Ben’s is negative. Hospital policy: Treat if posterior ≥ 0.5.  

  **Initial Posteriors:**  
  - Ava: \(P(Z | \text{pos}) = \frac{(9/10)(1/3)}{(9/10)(1/3) + (1/10)(2/3)} = \frac{9/30}{11/30} = 9/11 \approx 81.8\%\). Recommends treatment.  
  - Ben: \(P(Z | \text{neg}) = \frac{(1/10)(1/3)}{(1/10)(1/3) + (9/10)(2/3)} = \frac{1/30}{19/30} = 1/19 \approx 5.3\%\). Recommends against.  

  **Transcript (4 rounds, coarse actions only):**  
  1. **Ava:** "I recommend treatment."  
  2. **Ben:** "I recommend against."  
  3. **Ava:** "My test was alarming." (Vague; implies concern but not the result.)  
  4. **Ben:** "Mine was reassuring." (Vague; implies safety but not the result.)  
  *Disagreement persists.*  

  **Collapse After Announcing Posteriors (2 rounds):**  
  5. **Ava:** "My posterior is 9/11."  
  6. **Ben:** "Mine is 1/19. Wait—your test was positive?"  
  7. **Ava:** "Yes, and yours negative?"  
  8. **Ben:** "Yes. Now update: Both results imply \(P(Z | \text{pos}, \text{neg}) = \frac{(9/10)(1/10)(1/3)}{(9/10)(1/10)(1/3) + (1/10)(9/10)(2/3)} = \frac{9/300}{9/300 + 18/300} = \frac{9}{27} = \frac{1}{3}\)."  
  Both now hold \(P(Z) = 1/3 < 0.5\). Agree not to treat.  

  **Load-Bearing Feature:** *Coarse communication (actions/hedged speech) hides exact evidence.* Delete this, and they share test results immediately, collapsing in Round 2.  

  ---

  ### Case B: Exact Posteriors Announced, No Common Prior  
  **Setting:** A hiring committee (Jaya and Ken) evaluates a candidate. They agree on likelihoods for interview performance (signal: Strong/Weak) but have common-knowledge differing priors due to career backgrounds:  
  - Jaya (tech industry): Prior \(P(\text{Good}) = 3/4\) (sees many high performers).  
  - Ken (academia): Prior \(P(\text{Good}) = 1/4\) (sees many theorists).  
  Likelihoods: If Good, Strong signal w.p. 3/4; if Bad, Strong signal w.p. 1/4.  
  Both observe a Strong signal.  

  **Initial Posteriors:**  
  - Jaya: \(P(\text{Good} | \text{Strong}) = \frac{(3/4)(3/4)}{(3/4)(3/4) + (1/4)(1/4)} = \frac{9/16}{10/16} = 9/10\).  
  - Ken: \(P(\text{Good} | \text{Strong}) = \frac{(3/4)(1/4)}{(3/4)(1/4) + (1/4)(3/4)} = \frac{3/16}{6/16} = 3/6 = 1/2\).  

  **Transcript (Posterior announcements, no convergence):**  
  1. **Jaya:** "My posterior is 90%."  
  2. **Ken:** "Mine is 50%."  
  3. **Jaya:** "After pooling, still 90%." (Updates using Ken’s 50% as evidence, but prior dominates.)  
  4. **Ken:** "Still 50%." (Similarly, Jaya’s 90% doesn’t shift his prior.)  
  *Gap persists indefinitely.*  

  **Why No Collapse?** *Common prior assumption violated.* Differing priors are common knowledge, so each discounts the other’s posterior as reflecting their prior, not new evidence.  

  **Objection & Survival:** Common-prior proponents argue any gap implies hidden information asymmetry. Case B **survives** because:  
  - Priors stem from non-shareable lifetime experiences (tech vs. academia).  
  - They know they have different priors, but cannot "update" on immutable pasts.  
  - Setting requires priors to be "hardwired" from non-overlapping data (career base rates).  

  **Coda (Close Priors):** If priors differ by \(\epsilon\), posteriors differ by \(O(\epsilon)\) after evidence. Agreement is approximate, not exact.  

  **Load-Bearing Feature:** *Differing priors are common knowledge.* Delete this (e.g., assume priors are private), and they’d misinterpret each other’s posteriors, potentially converging.  

  ---  
  **Teaching Notes:**  
  - **Case A Drill:** Coarse communication prevents evidence pooling. Restore exact announcements (or share raw data), and agreement follows.  
  - **Case B Drill:** Differing common-knowledge priors block agreement. Restore common prior, and they converge after Round 1.  
  - **Why It Works:** Disagreement arises solely from Bayesian updates on stated priors/likelihoods/protocol—no irrationality or hidden motives.
