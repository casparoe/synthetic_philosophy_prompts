  We are constructing two cases to illustrate Aumann's agreement theorem.

  Case A: Honest, common prior, but no announcement of posteriors.

  Setting: Two doctors in an emergency room (ER) are reviewing a patient with ambiguous symptoms. They share a common prior about the probability that the patient has condition X (a rare but serious disease). The prior is based on known base rates. They have each run different tests (Test A and Test B) which are conditionally independent given the presence or absence of the disease. However, instead of announcing their posterior probabilities, they only exchange their recommendations (treat or not treat) which are based on thresholds.

  Common prior: P(X) = 1/2 (for simplicity, though rare, but we can set it arbitrarily to 1/2 to keep arithmetic easy). Actually, let's set it to 1/3 to avoid the 50% threshold. We want them to have different posteriors but not say the numbers.

  Let:
  - Disease X: present (X) or absent (~X)
  - Prior: P(X) = 1/3, so P(~X)=2/3.

  Doctor 1 runs Test A which has:
  - Sensitivity: P(Test A positive | X) = 9/10
  - Specificity: P(Test A negative | ~X) = 9/10

  Doctor 2 runs Test B which has the same:
  - Sensitivity: P(Test B positive | X) = 9/10
  - Specificity: P(Test B negative | ~X) = 9/10

  But note: the test results are conditionally independent given the disease state.

  Now, suppose the patient tests positive on Test A and negative on Test B.

  Doctor 1 observes: Test A positive.
  Doctor 2 observes: Test B negative.

  They are both rational and share the common prior and the likelihoods.

  Let's compute their posteriors.

  Doctor 1's posterior: P(X | Test A positive)
  = [P(Test A positive | X) * P(X)] / [P(Test A positive | X)*P(X) + P(Test A positive | ~X)*P(~X)]
  = [ (9/10)*(1/3) ] / [ (9/10)*(1/3) + (1/10)*(2/3) ] 
  = [ (9/30) ] / [ (9/30) + (2/30) ] 
  = (9/30) / (11/30) = 9/11.

  Doctor 2's posterior: P(X | Test B negative)
  = [P(Test B negative | X) * P(X)] / [P(Test B negative | X)*P(X) + P(Test B negative | ~X)*P(~X)]
  = [ (1/10)*(1/3) ] / [ (1/10)*(1/3) + (9/10)*(2/3) ]
  = [ (1/30) ] / [ (1/30) + (18/30) ] 
  = (1/30) / (19/30) = 1/19.

