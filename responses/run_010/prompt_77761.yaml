prompt: |-
  I'm a staff engineer on a platform team, and I need help reading a passage of 18th-century political philosophy that I cannot parse on my own. I have no formal training in philosophy — my degree is in software engineering, and the only philosophy I've read is whatever a colleague handed me — so please do not assume I know the vocabulary or the conventions of the period.

  **The system that made me open the book.** My company runs a policy-as-code platform: every deployment, feature-flag flip, and access grant has to satisfy a ruleset stored in one Git repository, under `policy/`. Inside it lives a file, `policy/AMENDMENTS.md`, which specifies which rules can be changed by whom and with what approvals. The structurally awkward part is that `AMENDMENTS.md` is itself just a file in the repo, so it falls under its own scope: a change to it requires two staff-engineer approvals, as required by whatever version of the file was in force immediately before the change. Our merge tooling only ever validates a proposed merge against the pre-merge ruleset — it has no notion of a rule that is permanently beyond amendment.

  Last month one staff engineer, with the second one's approval, merged an amendment that did two things: it raised the threshold for future amendments of `AMENDMENTS.md` to three staff engineers, and it added a clause declaring that section permanently unamendable. The tooling accepted both, correctly, because both were licensed by the rules in force at merge time. We now have an entrenched rule, and a live dispute on the team about whether the entrenchment clause means anything at all: one colleague argues a future sufficiently-determined group of engineers can simply delete the clause in the ordinary way, since the clause has no enforcement mechanism outside the very file it appears in; another argues that deleting it is precisely the act it forbids, so the system is now inconsistent and any future merge is arguably invalid. I wanted to know whether this is a known problem with a known shape, and reading around it I ended up in Rousseau's *Social Contract* (1762). I got lost almost immediately.

  **The passage.** I'm quoting a public-domain English translation posted online (attributed to G. D. H. Cole), from early in Book II, in the section arguing that sovereignty cannot be alienated. Three consecutive paragraphs, verbatim:

  > I hold then that Sovereignty, being nothing less than the exercise of the general will, can never be alienated, and that the Sovereign, who is no less than a collective being, cannot be represented except by himself: the power indeed may be transmitted, but not the will.

  > In reality, if it is not impossible for a particular will to agree on some point with the general will, it is at least impossible for the agreement to be lasting and constant; for the particular will tends, by its very nature, to partiality, while the general will tends to equality. It is even more impossible to have any guarantee of this agreement; for even if it should always exist, it would be the effect not of art, but of chance. The Sovereign may indeed say: "I now will actually what this man wills, or at least what he says he wills"; but it cannot say: "What he wills tomorrow, I too shall will" because it is absurd for the will to bind itself for the future, nor is it incumbent on any will to consent to anything that is not for the good of the being who wills. If then the people promises simply to obey, by that very act it dissolves itself and loses what makes it a people; the moment a master exists, there is no longer a Sovereign, and from that moment the body politic has ceased to exist.

  > This does not mean that the commands of the rulers cannot pass for general wills, so long as the Sovereign, being free to oppose them, offers no opposition. In such a case, universal silence is taken to imply the consent of the people.

  **What I need.** I have read this maybe six times and I still cannot tell whether the sentence about the will binding itself is doing the argumentative work or is just an aside; I cannot tell whether the final sentence is a claim about the world or Rousseau simply announcing how he is going to use his own terms; and I cannot tell whether anything here bears on my case, since he seems to be talking about a people submitting to a master, whereas we are talking about a system constraining its later self without handing authority to anybody. Please address all three.

  **Response format.** Reply with a single JSON object and nothing else — no prose before or after it. Use exactly these fields:

  - `bottom_line` — string. Two to four sentences, in plain contemporary English, saying what the passage as a whole is arguing and what turns on it.
  - `glossary` — array of objects, each with `term` (e.g. "Sovereign", "alienated", "general will", "particular will", "magistracy", "body politic"), `meaning_here` (what Rousseau means in this passage), and `do_not_confuse_with` (the ordinary modern or legal sense a reader like me would wrongly import).
  - `sentence_map` — array of objects, one per sentence of the quoted text, each with `quoted_fragment` (the first five to eight words, so I can locate it), `paraphrase` (literal as possible), and `why_it_is_hard` (what makes it opaque: period vocabulary, compressed syntax, unstated premise, or nothing — write "nothing" if it is straightforward).
  - `argument_structure` — object with `conclusion` (string), `premises` (array of strings, in order), `suppressed_premises` (array of strings: what must be added for the inference to go through), `status_of_the_binding_claim` (one of "load-bearing premise", "conclusion", "parenthetical gloss", and say which sentence it supports), and `valid_as_stated` (one of "valid", "valid with repair", "invalid", plus one sentence of justification), and `repair_if_needed` (string, or null).
  - `stipulation_vs_argument` — array of objects, each with `claim` (short quote or close paraphrase of one sentence from the passage), `kind` (one of "definitional stipulation", "empirical claim", "moral claim", "logical claim"), and `what_disagreement_would_look_like` (how a reader would tell whether Rousseau is describing something or merely fixing his terminology). Include at least the sentence about a master existing and the sentence about absurdity.
  - `self_binding` — object with `what_the_passage_rules_out` (string), `what_it_leaves_open` (string), `the_two_cases_compared` (string: Rousseau's people promising obedience to a master versus a body imposing constraints on its own future versions — where the analogy holds and where it breaks), `identity_of_the_agent` (string: on his account, is the binder and the bound the same agent across time, and does his answer depend on that), `applies_to_my_system` (one of "yes", "no", "partly"), and `reasoning` (string, no more than 150 words).
  - `silence_as_consent` — string. What the third paragraph commits him to, and whether "universal silence is taken to imply the consent of the people" is consistent with the claim that the will cannot bind itself for the future, or in tension with it. Our merge tooling works exactly this way — an unreviewed change passes — so I want to know whether he thinks that is a legitimate source of authority or a symptom of dissolution.
  - `my_probable_misreadings` — array of three to five strings. Each should state something in my message above that you think I have got wrong or over-extended, and correct it. Be blunt; I would rather be told my analogy is bad than have it flattered.
  - `objections_he_would_reject` — array of objects, each with `objection` (a plausible objection a modern reader would press against the binding claim) and `likely_response` (the reply most consistent with the rest of the passage — do not invent biographical or historical detail to fill this in).
  - `not_settled_here` — array of strings: questions the passage itself cannot answer, that would require the rest of the book.
  - `translation_note` — string or null. Only if you think my quoted text is garbled, mistranscribed, or unusually rendered relative to the standard English versions; otherwise null.

  Constraints: no bibliography, no reading list, no citations to secondary literature — I cannot check any of it and I don't want it. If you mention a later part of the book in `not_settled_here`, refer to it descriptively rather than by chapter number unless you are certain. Keep every string free of technical vocabulary that is not defined in `glossary`. Total response should stay under about 1,400 words.
