  2. Three parts:
     (a) Identify threatened premise and why.
     (b) Assess if threat is real - distinguish being in position to know vs. actual knowing, and how checking changes the state.
     (c) Apply to KK principle - can the same reasoning rescue it?

  For (a), the threatened premise is luminosity. Luminosity claims that if C obtains, Dana is in a position to know it. But the wristband setup means accessing that position requires attending, which sustains C. So when C might be failing (at faint stages), she can't check without maintaining C, preventing knowledge of non-C.

