prompt: |-
  I spent most of last night arguing with a friend — an economist by training, now doing survey-based welfare measurement for a regional health authority — about whether an interpersonal comparison of utility is even the sort of thing that can be true or false, and what could possibly settle it. He holds what I would call a quietist line, defended with a broadly Wittgensteinian flavour: our practice of comparing one another's pleasures and pains is not a set of hypotheses awaiting verification but a rule-governed form of life, resting on primitive pre-linguistic reactions — the flinch, the wince, the reaching-out — that we share and train into children. On his view, demanding independent empirical warrant for those comparisons is a category mistake, and the only thing that "fixes the cross-person scale" is that we are creatures who respond to each other in this way rather than that. I found the position both compelling and slippery, and the deeper problem the argument exposed is that neither of us had ever written down what one should require of an account of interpersonal comparison in the first place; we traded cases and intuitions for three hours with no specification against which to test them, so neither of us could be shown to have lost.

  So, before I read anything further in this area, I want the desiderata. Fix the purpose as follows: not a theory good enough to win a seminar argument, but one good enough to bear weight in real decisions — in particular, the case of an authority that must rank the competing claims of a patient whose lifelong depression has recalibrated everything she reports about her own condition against a patient in acute pain, using instruments built largely out of self-report. Write the list of requirements any adequate account of interpersonal utility comparison must meet, with the case or consideration behind each one. That should include, at minimum: the phenomena it has to explain (both our ordinary confidence in claims like "her pain is worse than his" and our equally ordinary sense that some such claims are not merely unknown but indeterminate); the distinctions it must not collapse (level comparability versus comparability of differences; comparability versus measurability; the question whether such comparisons are true versus the question how anyone could know them; comparison of one person across time versus comparison of two people at a time; a scale being fixed by our practices versus a scale being discovered in the world); the formal constraints it must respect (uniqueness of each person's utility scale only up to positive affine transformation, and hence exactly what further structure genuine comparability demands beyond within-person cardinality, including whether a common origin and a common unit are separable requirements); the results it must stay consistent with (the impossibility theorems whose force depends on an ordinal, interpersonally non-comparable framework, and the possibility results that become available once comparability is granted — say what additional conditions those results need, not merely that they exist); and the empirical facts it cannot contradict or hand-wave (hedonic adaptation and response shift; the disability paradox, where people report a high quality of life against all clinical expectation; and the anchoring-vignette and related rescaling techniques used to correct self-report for the fact that different groups use the same response categories differently — on which last point I want an explicit verdict: do those techniques presuppose the comparability they are meant to establish, produce it, or something else?). For every requirement, mark it as non-negotiable or as the preference of a particular camp, and then tell me which single requirement does the most to eliminate candidate accounts.

  I also have a suspicion that three of the demands I have just listed cannot be jointly satisfied: that comparability be settled entirely by facts about individuals that carry no ethical evaluation; that the account be determinate enough to rank actual allocations; and that it explain why first-person report and third-person observation come apart without one of them being simply mistaken. If that trilemma is real — or if you can state a sharper version of it — say so, and say which leg should be dropped; I would rather have that result than a harmonious list, and if it is not real, show me the account that satisfies all three. I would also like my friend's quietist position run against the list explicitly: which requirements it meets, which it dissolves rather than meets, and which it simply cannot handle. Two further requests about how you present this. First, be scrupulous about separating settled ground from live controversy among people who work on this topic: for each requirement, say whether it is near-universal or contested, and where it is contested, sketch the best argument on the other side rather than assuming it away — I do not want a contested view, including my friend's, smuggled in as the default. Second, no bibliography, reading list, or citation apparatus: use proper names only as labels for positions, and flag any attribution you are not fully confident of, since I have no way to check it tonight. If you want to close with a paragraph on how the two or three main families of account fare against the specification, keep it to one clearly separated paragraph — the thinking I am after is in the criteria.
reasoning: |-
  Okay, the user presents a fascinating and complex philosophical puzzle about interpersonal utility comparisons (IUC). They've engaged in a deep debate with an economist friend who takes a Wittgensteinian quietist position, and now seeks a structured framework to evaluate different accounts of IUC. The request is exceptionally detailed, requiring a comprehensive list of desiderata across multiple dimensions: phenomena to explain, distinctions to maintain, formal constraints, consistency requirements, and empirical realities.

  The user's scenario involves real-world policy applications - specifically a health authority comparing patients with chronic depression versus acute pain using self-report instruments. This practical context elevates the stakes beyond academic debate. Their frustration about arguing without clear criteria resonates - they're seeking analytical scaffolding to prevent future discussions from becoming intuition-driven stalemates.

  Several key challenges stand out: First, the tension between formal utility theory (which traditionally rejects IUC) and practical welfare measurement (which requires it). Second, the friend's quietist view that treats IUC as a "form of life" rather than empirically verifiable claims. Third, the trilemma the user suspects about ethical neutrality, determinacy, and reconciling first/third-person perspectives.

  The response must walk a tightrope: rigorous enough for policy decisions while acknowledging philosophical controversies. It should avoid bibliographic distractions as requested, instead focusing on conceptual mapping. The assessment of the quietist position needs particular care - showing where it dissolves rather than solves problems.

  For the desiderata list, I consider organizing around: explanatory targets (ordinary confidence vs. indeterminacy), critical distinctions (level vs. difference comparisons), formal constraints (affine transformations), consistency requirements (Arrow's theorem implications), and empirical constraints (hedonic adaptation, disability paradox). Each requirement should be tagged as consensual or contested.

  The trilemma analysis seems crucial - I suspect dropping ethical neutrality may be necessary. The quietist position likely dissolves the measurement problem but struggles with empirical anomalies like the disability paradox. Vignette techniques appear to presuppose comparability rather than establish it.

  Throughout, I'll maintain strict separation between settled points (e.g., affine uniqueness) and live debates (e.g., origin constraints). The closing comparison of major approaches will be concise, focusing on how well they meet the articulated criteria rather than advocating any position.
answer: |-
  Here is a specification of desiderata for an account of interpersonal utility comparison (IUC), designed for real-world welfare decisions, structured as requested. Requirements are marked **(NN)** for non-negotiable (widely accepted constraints), **(C)** for contested, or **(P)** for preference of specific camps. The core trilemma and assessment of quietism follow.

  ### I. Phenomena to Explain (Non-Negotiable Basis)
  1.  **Ordinary Confidence:** Must explain why we routinely make and accept claims like "her migraine pain is worse than his papercut" or "winning the lottery gave him more joy than it would give her," often with high confidence and intersubjective agreement. *(NN: Grounds the practice)*
  2.  **Indeterminacy:** Must explain why other comparisons feel deeply indeterminate or unanswerable ("Is my grief over my lost pet worse than your annoyance at a delayed flight?"), resisting even hypothetical resolution. *(NN: Reflects limits of the practice)*
  3.  **Discrepancy:** Must account for systematic discrepancies between self-report (e.g., high QoL reports in severe disability - the "disability paradox") and third-person observation/clinical expectation, without always declaring one simply "wrong." *(NN: Key empirical reality for policy)*

  ### II. Distinctions to Maintain (Preventing Conceptual Collapse)
  4.  **Level vs. Difference Comparability:** Must distinguish comparing absolute utility *levels* ("A is happier than B is now") from comparing utility *differences* ("A's gain from treatment X is larger than B's gain from treatment Y"). An account may deliver one without the other. *(NN: Fundamental conceptual distinction)*
  5.  **Comparability vs. Measurability:** Must distinguish the *possibility* of making meaningful comparisons from establishing a precise *cardinal scale* with a defined unit and origin. Comparability is necessary but not sufficient for full measurability. *(NN: Avoids over/under-selling)*
  6.  **Truth vs. Epistemology:** Must clearly separate the *metaphysical* question of whether IUC statements *can* be true/false from the *epistemological* question of how we could *know* them. An account might address one without solving the other. *(NN: Prevents category errors)*
  7.  **Intrapersonal vs. Interpersonal:** Must not conflate comparing one person across times/states (generally accepted as meaningful under cardinal utility) with comparing different people at a time. *(NN: Basic scope distinction)*
  8.  **Practices Fixing vs. World Discovering:** Must clarify whether the scale is constituted by shared human reactions/decisions ("fixed by us") or corresponds to a pre-existing, observer-independent reality ("discovered in the world"). *(C: Deep philosophical divide; Quietists/Pragmatists favor "fixed by us," Realists favor "discovered")*

  ### III. Formal Constraints (Mathematical Foundations)
  9.  **Affine Uniqueness:** Must respect that each individual's utility function is unique only up to a positive affine transformation (u_i'(x) = a_i * u_i(x) + b_i; a_i > 0). *(NN: Standard result in utility theory)*
  10. **Cardinality Requirement:** Must require at least *within-person cardinality* (meaningful difference comparisons for each individual) as a prerequisite for any interpersonal comparison. *(NN: Widely accepted necessity)*
  11. **Origin & Unit Constraints:** Must specify what, beyond within-person cardinality, is needed for IUC:
      *   **Common Unit (Scale):** Is a common unit of measurement required/achieved? (e.g., fixing the `a_i` ratios).
      *   **Common Origin (Zero):** Is a common zero point required/achieved? (e.g., fixing the `b_i` values).
      *(C: Major axis of disagreement. Some accounts require both (full cardinal ratio scale), some only common unit (cardinal full comparability), some neither explicitly. Quietism often implies practices fix both implicitly.)*

  ### IV. Consistency with Results (Theoretical Coherence)
  12. **Ordinal Impossibility:** Must be consistent with the force of impossibility theorems (e.g., Arrow's) under strict ordinality and non-comparability. Granting IUC legitimately relaxes these constraints. *(NN: Establishes the need for IUC)*
  13. **Possibility Conditions:** Must specify the *exact additional conditions* (beyond granting IUC) needed for specific positive possibility results (e.g., Harsanyi's Aggregation Theorem requires comparable cardinal utilities and the Pareto principle; other social welfare functions require specific types of comparability like ratio-scale or unit comparability). *(NN: Avoids overstating what IUC alone achieves)*

  ### V. Empirical Constraints (Avoiding Hand-Waving)
  14. **Hedonic Adaptation/Response Shift:** Must accommodate that individuals' utility scales recalibrate over time due to changing circumstances, expectations, or health states (e.g., chronic pain patients reporting lower pain intensity than expected). Cannot treat scales as static. *(NN: Robust empirical finding)*
  15. **Disability Paradox:** Must explain how individuals with severe disabilities can report high subjective well-being (QoL) despite objective indicators suggesting profound loss, without dismissing either measure as invalid. *(NN: Critical challenge for health policy)*
  16. **Anchoring Vignettes & Rescaling:** Must provide a coherent account of these techniques:
      *   **Purpose:** Correct for DIF by using standardized vignettes to "anchor" how different groups interpret response categories (e.g., "mild pain").
      *   **Verdict:** These techniques *presuppose* a form of comparability – specifically, that the vignettes describe states with *interpersonally comparable utility levels* – in order to rescale the self-reports. They *produce* interpersonally comparable *rescaled reports*, but they *rely on* the assumed comparability of the vignettes' underlying states. They do not *establish comparability de novo* from non-comparable data. *(NN: Accurate reflection of methodology; Avoids circularity claim)*

  ### The Core Trilemma
  Your suspicion is sharp. The likely trilemma is:
  1.  **Ethical Neutrality:** IUC settled purely by descriptive facts about individuals/populations (psychology, behavior, physiology), carrying no inherent ethical evaluation.
  2.  **Determinacy:** Account yields determinate rankings of real-world allocations (e.g., Patient A's claim vs. Patient B's).
  3.  **Non-Error Reconciliation:** Explains self-report/3rd-party discrepancies without declaring one systematically mistaken (e.g., embracing the disability paradox as meaningful data).

  *   **Conflict:** (1) is hard to reconcile with (2) & (3). Pure descriptive facts (e.g., neuroimaging, behavior) often underdetermine comparisons, especially across very different states (chronic depression vs. acute pain). Achieving determinacy (2) while accommodating paradoxes (3) typically requires introducing normative elements (e.g., privileging self-report as authoritative, or defining "true" utility via idealized preferences) or accepting significant indeterminacy.
  *   **Resolution:** (1) **Ethical Neutrality** is the leg most plausibly dropped for an account aiming at (2) and (3) in policy contexts. Most operational accounts (e.g., using rescaled self-reports with vignettes) implicitly incorporate normative choices (e.g., taking self-report as the gold standard, defining the "common" scale via representative judgments about vignettes).

  ### Assessment of Quietism
  *   **Meets:** (1 Ordinary Confidence - as bedrock practice), (2 Indeterminacy - some comparisons lie outside the form of life), (6 Truth/Epistemology - dissolves demand for independent warrant), (7 Intrapersonal/Interpersonal - focuses on interpersonal), (8 Practices Fixing - core tenet), (9 Affine Uniqueness - compatible), (10 Cardinality - accepts meaningful difference comparisons within practice), (11 Origin/Unit - practices implicitly fix both), (12 Ordinal Impossibility - compatible), (16 Vignettes - sees them as refining shared practice).
  *   **Dissolves (rejects the demand):** (3 Discrepancy - may see paradox as reflecting diverse forms of life, not error), (5 Comparability/Measurability - rejects need for "measurement" beyond practice), the *demand* for independent empirical warrant underlying many requirements.
  *   **Struggles With/Cannot Handle:** (13 Possibility Conditions - quietism isn't prescriptive), (14 Hedonic Adaptation - struggles to explain scale recalibration *within* the practice), (15 Disability Paradox - risks dismissing clinical expectation or self-report as outside the relevant "form of life"), the need for **determinate rankings (2)** required for policy. Its strength is explaining the *possibility* of IUC, not providing a *decision procedure* for hard cases. It struggles most with generating the **Determinacy** required for your policy case.

  ### The Most Eliminating Requirement
  **Requirement 11: Specifying Origin & Unit Constraints (C)** does the most to eliminate candidates. The choice here fundamentally shapes the type of comparability possible (level only, difference only, both) and the feasibility of constructing a scale. Accounts demanding both a common origin (*e.g.*, a universal zero like "no pain") and a common unit (*e.g.*, a standard "util") face immense empirical and conceptual hurdles. Relaxing one or both (*e.g.*, requiring only unit comparability like some preference-based accounts, or seeing practices fix them contingently like quietism) opens possibilities but also defines distinct, often incompatible, approaches. This requirement forces the account to confront the minimal structure needed beyond within-person cardinality.

  ### How Main Families Fare (Briefly)
  *   **Preference-Based (Harsanyi, etc.):** Grounds IUC in extended preferences/idealized observers. **Meets:** 2, 4 (often differences), 5, 6, 7, 9, 10, 12, 13 (with strong assumptions). **Struggles:** 1 (abstracts from phenomenology), 3/15 (privileges idealized report over actual report/observation), 8 ("discovered" via rationality), 11 (often requires strong assumptions for unit/origin), 14/16 (handles poorly). **Drops:** Ethical Neutrality (often relies on rationality norms).
  *   **Psychometric/Rescaling (Vignettes, etc.):** Uses statistical techniques on self-reports with anchors. **Meets:** 1 (indirectly), 2 (some indeterminacy remains), 3/15 (takes reports seriously, adjusts), 4 (often levels), 5, 7, 9, 10, 12, 13 (with data), 14 (can model), 16 (core method). **Struggles:** 6 (truth vs. knowledge blurry), 8 (ambivalent - scale is "constructed" but aims for objectivity), 11 (implicitly assumes level comparability of vignettes). **Drops:** Pure Ethical Neutrality (choice of anchors/vignettes normative).
  *   **Quietist/Wittgensteinian:** IUC as a constitutive social practice. **Meets:** 1, 2, 4 (within practice), 6 (dissolves demand), 7, 8, 9, 10, 12. **Struggles/Dissolves:** 3, 5, 11 (as formal demands), 13, 14, 15, 16 (as external techniques). **Fails:** Providing **Determinacy (2)** for hard policy cases. Best as a meta-account justifying the *possibility* of simpler methods.

  This specification reveals the deep tensions, particularly between policy needs for determinacy and the conceptual/empirical challenges of achieving ethically neutral, fully resolved comparisons, especially when self-reports defy expectations. The quietist account provides a compelling foundation for the *possibility* of IUC but offers little direct help for the health authority's specific, determinate ranking problem.
