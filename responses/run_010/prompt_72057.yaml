answer: |-
  ### Workshop: "The Unseen Life of Margaret O'Donnell"  
  **Objective:** Volunteers experience how institutional records obscure ordinary lives, revealing biases of record-keepers.  

  ---

  ### **Materials**  
  - **Dossier** (identical for all tables; 10 documents, 1,200 words total).  
  - **Table Assignments** (6 tables, each with a unique governing question).  
  - **Timer, whiteboard markers, paper for notes.**  

  ---

  ### **Printable Dossier: Margaret O'Donnell (fictional, 1880s–1890s, Anytown, NY)**  
  *(Print one set per table. Documents are out of chronological order.)*  

  1. **County Almshouse Admission Register (1887)**  
     *Name: Margaret O’Donnell. Age: 42. Occupation: Seamstress. Admitted: April 5, 1887. Discharged: April 19, 1887. Reason: “Temporary distress; claims inability to work due to lung complaint. No known kin. Discharged to seek employment.”*  

  2. **Liquor Commissioner’s Docket (1891)**  
     *Margaret O’Donnell, 23 Maple Street. Fined $10 (Dec. 3, 1891) for “unlicensed sale of spirits to boarders.” Note: “Defendant absent. Fine unpaid.”*  

  3. **Newspaper Clipping: *Anytown Chronicle* (1890)**  
     *“Complaint against Mrs. O’Donnell of Maple St. for ‘disorderly conduct’ by neighbors. Dismissed by Justice Harris for lack of evidence. Mrs. O’Donnell stated, ‘I run a decent house.’”*  

  4. **Tax Assessor’s Ledger (1889)**  
     *Property: 23 Maple Street. Owner: Margaret O’Donnell. Value: $800. Taxes paid in full.*  

  5. **Church Disciplinary Record (1892)**  
     *St. Anne’s Parish. Margaret O’Donnell cited for “Sabbath-breaking” (taking in laundry on Sundays). Reprimanded: “Must cease or face expulsion.”*  

  6. **Coroner’s Report (1888)**  
     *Margaret O’Donnel (spelled with one ‘l’). Age: ~40. Found deceased in river near lumberyard. Verdict: “Accidental drowning. No signs of struggle. Occupation: Washerwoman.”*  

  7. **Self-Authored Fragment (undated, torn paper)**  
     *“…cannot sleep for the coughing. James drank the rent money again. If I lose the house, what then? The girls are too young to…”*  

  8. **Justice of the Peace Docket (1891)**  
     *Margaret O’Donnell charged with assault (Sept. 1891): “Struck boarder with iron skillet during dispute. Case dismissed when complainant vanished.”*  

  9. **Poor-Law Officer’s Notes (1887)**  
     *“O’Donnell application for relief denied. Verified she runs illegal boardinghouse at 23 Maple. Known to harbor petty thieves. Not ‘indigent’—merely immoral.”*  

  10. **Newspaper Clipping: *The Town Crier* (1892)**  
     *Gossip column: “Maple Street boardinghouse rumored to shelter a counterfeiter! Widow O’Donnell seen at his trial. Why does she court trouble?”*  

  ---

  ### **Table Assignments & Roles**  
  - **Governing Question** (distributed on cards; focus groups on specific angles):  
    - Table 1: *What was Margaret’s economic stability?*  
    - Table 2: *How did authorities treat Margaret?*  
    - Table 3: *What personal struggles shaped her life?*  
    - Table 4: *Was Margaret respected or marginalized?*  
    - Table 5: *How independent was Margaret?*  
    - Table 6: *What relationships defined her?*  
  - **Roles per Table:**  
    - **Timekeeper** (keeps group on schedule).  
    - **Skeptic** (questions assumptions).  
    - **Synthesizer** (prepares 2-min presentation).  
    - **Archivist** (flags contradictions/silences).  

  ---

  ### **Timeline (100 Minutes Total)**  

  #### **0–5 min: Introduction**  
  - **Your Script:**  
    > “Today, we’re detectives. You’ll reconstruct the life of Margaret O’Donnell—an ordinary woman in 1890s Anytown—using her ‘surviving’ records. Your goal: Write a 2-minute biography answering your table’s unique question. The best account gets featured in our *Historical Society Newsletter*. No prior knowledge needed—just work the documents.”  

  #### **5–30 min: Dossier Analysis**  
  - Groups read/docs (15 min), then discuss/question (10 min).  
  - **Pressure:** Emphasize the newsletter feature. Announce at 10 min: “You have 5 minutes left to draft your initial theory.”  

  #### **30–35 min: Mid-Activity Turn**  
  - **Your Script (exact words):**  
    > “STOP. I just received new archival metadata: The coroner’s report (Document 6) is for *Margaret O’Donnel*—one ‘l’—a different person. Adjust your analysis.”  
    *(This forces groups to untangle the similar-name error.)*  

  #### **35–55 min: Revised Analysis & Prep**  
  - Groups refine biographies (15 min) and prep presentations (5 min).  

  #### **55–75 min: Table Presentations**  
  - Each table presents for 2 min max. Highlight divergences:  
    - Table 1 (economy) may call her “struggling but resilient.”  
    - Table 4 (reputation) may call her “notorious.”  
    - Table 6 (relationships) may invent “James” as her husband.  

  #### **75–90 min: Debrief**  
  - **Map Moments to Concepts (use whiteboard):**  
    - *Contradiction* (Poor-Law Officer vs. Tax Ledger): “What happens when records clash?” → Leads to **bias in sourcing**.  
    - *Similar-Name Error* (Coroner’s Report): “Why did some merge two lives?” → **Context collapse**.  
    - *Self-Authored Fragment*: “What did you assume about ‘James’?” → **Over-interpreting silence**.  
    - *The Town Crier Rumor*: “Did one group use the counterfeiter detail? Why?” → **Single attestation in ‘disreputable’ sources**.  
  - **Finally, Introduce Terms:**  
    > “You experienced ‘archival silence’—what’s missing is as telling as what’s kept. This is ‘microhistory’: spotlighting ordinary lives through institutional traces. But remember—these records reflect the **record-keepers’ priorities**, not Margaret’s voice.”  

  #### **90–95 min: Forced-Choice Application**  
  - Pose quick dilemmas (volunteers vote by show of hands):  
    1. *A coroner’s report calls an immigrant “shiftless.” Transcribe as-is?*  
       - Yes (preserve accuracy) / No (redact) / Add editor’s note.  
    2. *A tax record lists a woman as “Mrs. John Smith.” Index under her name?*  
       - Yes (prioritize her identity) / No (use husband’s name) / Both.  
    3. *A petition includes a racial slur. Transcribe exactly?*  
       - Yes / Replace term / Transcribe + content warning.  
    4. *A church record misspells a name. Normalize it?*  
       - Yes (aid searchability) / No (preserve original) / Footnote both.  

  #### **95–100 min: Closing**  
  - **Your Script:**  
    > “This is why your transcription choices matter. Do we replicate the record-keeper’s biases, or make space for the unseen? Every decision shapes whose story gets told.”  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Stalling Group (Likely Table 3 or 5):**  
     - *Why*: Overwhelmed by contradictions (e.g., “Was she poor or not?”).  
     - *Fix*: Nudge: “Focus on your specific question—ignore what’s unresolvable.”  

  2. **Refusal to Speculate (Likely the Shop Teacher’s Table):**  
     - *Why*: “This is guesswork!” due to fragmentary evidence.  
     - *Fix*: “History is inference. Your job is to show what the documents *allow* us to say.”  

  3. **Mid-Turn Lands Flat:**  
     - *Why*: If no group merged the Margarets, it feels irrelevant.  
     - *Fix*: Still debrief: “Why *didn’t* you conflate them? What saved you?”  

  4. **Objection: “This Isn’t Real History!”**  
     - *Fix*: “Exactly. But it mirrors real gaps. Would your choices change if Margaret were your ancestor?”  

  ---

  ### **What the Activity Can’t Do (Requires Your Input)**  
  1. **The “Real Person” Certainty:**  
     - Volunteers know Margaret is fictional. Real researchers face ambiguity: *Is there a person here? Is the record complete?*  
     - **Supply This**: In debrief, ask: “What if you didn’t know these were all one person? What if more documents existed?”  

  2. **Emotional Weight of Silence:**  
     - The exercise can’t replicate your great-great-grandmother’s emotional absence.  
     - **Supply This**: Briefly share your story again before the forced-choice round: “I found my ancestor only through others’ words. You decide how future seekers find theirs.”  

  3. **Open-Ended Research:**  
     - Volunteers work a closed dossier. Real research is iterative and uncertain.  
     - **Supply This**: Note in closing: “You saw a slice of a life. Imagine years hunting for one more document—and finding nothing.”  

