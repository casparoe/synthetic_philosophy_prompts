  - Question: What does this case reveal?
  - A: This shows that the scope of rights must be determined by considering external effects. The jurisdictional reply (that this is about delineation) only highlights that scope-determination is doing the work and cannot be prior to the theory of rights. If the right is defined narrowly to exclude such cases, then the paradox might be avoided, but that requires a theory of when external effects are permissible.
