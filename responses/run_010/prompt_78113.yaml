  ### Electoral Systems Simulation Activity  
  **Total Time:** 75 minutes (50 min activity, 25 min debrief)  
  **Participants:** 24 students (all active; 3 as candidates in Rounds 1-2, 6 as candidates in Round 3, all others vote).  
  **Materials:** Movable chairs, whiteboard, printed voter cards (24 double-sided sheets), ballots (cut from 36 sheets → 72 half-sheet ballots), markers.  

  ---

  ### **Round 1: Single-Winner Plurality** (15 min)  
  **Goal:** Elect a candidate ranked last by a majority under sincere voting.  
  **Rule:** "Vote for one candidate. The candidate with the most votes wins. Ties broken by coin flip."  
  **Setup (5 min):**  
  - Assign roles: 3 candidates (A, B, C) based on pre-selected volunteers.  
  - Distribute voter cards (Side 1). Students sit in three groups matching their card:  
    - **Group 1 (10 voters):** Prefers A > B > C (asymmetric payoffs).  
    - **Group 2 (8 voters):** Prefers B > C > A.  
    - **Group 3 (6 voters):** Prefers C > B > A.  
  - **No communication.** Explain rules and payoffs.  

  **Voting (5 min):**  
  - Distribute ballots. Students vote secretly for A, B, or C.  

  **Tally & Record (5 min):**  
  - Tally votes on whiteboard.  
  - **Expected outcome:** A wins (10 votes). B:8, C:6.  
  - Award points: Group 1 = 10 pts, Groups 2 & 3 = 0 pts.  

  **Voter Card (Side 1):**  
  ```
  GROUP 1  
  Your Points if Winner is:  
  - Candidate A: 10 points  
  - Candidate B: 5 points  
  - Candidate C: 0 points  

  Vote Rule: Write ONE candidate's letter (A, B, or C).  
  Most votes wins.  
  ```  
  *(Cards for Groups 2/3 adjust payoffs: Group 2—B:10, C:5, A:0; Group 3—C:10, B:5, A:0.)*  

  ---

  ### **Round 2: Plurality with Campaign** (20 min)  
  **Goal:** Voters shift votes strategically without instruction.  
  **Rule:** Same as Round 1, but add a 2-minute campaign.  
  **Setup (5 min):**  
  - Same candidates/voters.  
  - **Campaign rules:** Candidates give 30-sec speeches. They may:  
    - State their positions.  
    - Urge voters to support them to defeat another candidate.  
    - **Banned:** Mentioning specific voter payoffs or offering bribes.  

  **Campaign (2 min):**  
  - Candidates speak in order (A, B, C).  

  **Voting (5 min):**  
  - Ballots distributed. Vote secretly.  

  **Tally & Record (8 min):**  
  - Tally votes.  
  - **Expected outcome:** B wins (Group 2 votes B; Group 3 shifts from C to B → B:14, A:10, C:0).  
  - Award points: Group 1 = 0 pts, Group 2 = 10 pts, Group 3 = 5 pts.  

  **Discovery Target:** At least one Group 3 voter volunteers: "I didn’t vote for C because I didn’t want A to win."  

  ---

  ### **Round 3: Multi-Member District (SNTV)** (15 min)  
  **Goal:** Intra-party competition emerges.  
  **Rule:** "Vote for one candidate. Top *two* win seats. District magnitude = 2."  
  **Setup (5 min):**  
  - Add 3 candidates: A2 (from Group 1), B2 (from Group 2), C2 (from Group 3).  
  - Distribute voter cards (Side 2). Split groups:  
    - Group 1: 5 prefer A1 > A2, 5 prefer A2 > A1.  
    - Group 2: 4 prefer B1 > B2, 4 prefer B2 > B1.  
    - Group 3: 3 prefer C1 > C2, 3 prefer C2 > C1.  

  **Voting (5 min):**  
  - Ballots list candidates: A1, A2, B1, B2, C1, C2.  

  **Tally & Record (5 min):**  
  - Tally votes.  
  - **Expected outcome:** A1 (6 votes), A2 (4), B1 (4), B2 (4), C1 (3), C2 (3). Winners: A1 + A2 (tie for second broken alphabetically).  
  - Award points: Sum of payoffs for both winners.  
    - *Example: Group 1 voter (prefers A1) gets 10 (A1) + 9 (A2) = 19 pts.*  

  **Voter Card (Side 2):**  
  ```
  GROUP 1 (A1-PREFERRING)  
  Points per Winning Candidate:  
  - A1: 10 | A2: 9 | B1: 0 | B2: 0 | C1: 0 | C2: 0  

  Vote Rule: Write ONE candidate’s name (e.g., "A1").  
  Top TWO win.  
  ```  
  *(Cards vary by subgroup; e.g., Group 2 B1-preferrer: B1:10, B2:5, others:0.)*  

  ---

  ### **Points & Incentives**  
  - **Scheme:** Points convert to lottery tickets (1 ticket per 10 points). Three prizes drawn (e.g., candy, exemption from next reading quiz).  
  - **Why it works:** Incentivizes point maximization without grade impact or collusion.  

  ---

  ### **Answer Keys & Deviations**  
  **Round 1:**  
  - *Expected:* A wins (10-8-6).  
  - *Deviation 1:* Group 3 voter defects to B → A:10, B:9, C:5 → A wins (no change).  
  - *Deviation 2:* Group 2 voter defects to C → A:10, B:7, C:7 → A wins (tie for second irrelevant).  

  **Round 2:**  
  - *Expected:* B wins (14-10-0).  
  - *Deviation 1:* Group 3 votes sincerely → A:10, B:8, C:6 → A wins.  
  - *Deviation 2:* Group 2 votes for C → A:10, C:14 → C wins.  

  **Round 3:**  
  - *Expected:* A1 + A2 win (6-4-4-4-3-3).  
  - *Deviation 1:* Group 2 coordinates on B1 → Winners: A1 (6), B1 (8).  
  - *Deviation 2:* Group 1 all votes A1 → Winners: A1 (10), B1 (4).  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Round 1:** Voters miss asymmetric payoffs → *Fix: Verbally emphasize "points depend ONLY on who wins, NOT who you vote for."*  
  2. **Round 2:** Candidates give vague speeches → *Fix: Privately cue them pre-campaign: "Say, ‘Vote for me to stop A from winning.’"*  
  3. **Round 2:** Group 3 doesn’t shift votes → *Use answer key: If A wins, ask Group 3, "Why accept 0 points when B could give you 5?"*  
  4. **Round 3:** Tally takes >2 min → *Pre-draw a tiebreak order (e.g., A1 > A2 > B1 > B2 > C1 > C2).*  
  5. **General:** Ballot confusion → *Use pre-named ballots (e.g., "VOTE: _________" with candidate list on whiteboard).*  

  ---

  ### **Debrief (25 min)**  
  1. **Observations (5 min):**  
     - "What happened in Round 1? What changed in Round 2? What was different in Round 3?"  
  2. **Vocabulary (10 min):**  
     - **Discovery 1:** "Psychological effect" (voters anticipate others; e.g., Round 2 shift). Contrast "mechanical effect" (vote-to-seat conversion).  
     - **Discovery 2:** "Intra-party competition" (Round 3; rivals share a label).  
     - **Key terms:** Duverger’s Law (two-party tendency under plurality), SNTV (vote for individuals in multi-seat races).  
  3. **Connections (10 min):**  
     - Round 3 revealed that systems shaping *candidate rivalry* (same-party vs. cross-party) matter as much as seat allocation.  
     - Limitations: Activity can’t show **long-term party adaptation** (e.g., nomination strategies, voter habituation). *Verbal supplement: "Real electoral systems evolve over decades—parties learn to manipulate rules, voters form habits, and new parties emerge organically."*  

  ---

  ### **What the Activity Cannot Reproduce**  
  **Limitation:** The simulation cannot capture **temporal dynamics of party organization**.  
  - **Why:** Parties adapt over multiple elections (e.g., coordinating nominations, building voter loyalty). This activity is a one-shot game.  
  - **Verbal Coverage:** "In reality, electoral rules reshape parties over time. Plurality systems incentivize two stable parties; proportional systems encourage niche parties. Voters and elites learn strategies across cycles—something we compressed into 50 minutes."
