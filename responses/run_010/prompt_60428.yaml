answer: |-
  ## The Dose Held

  I hold the **dose**. Enough for five, they plead.
  My hand cups also this cold, balanced **coin**.
  Is five times one death truly five times **worse**?
  I face a single **stranger** on the dock.
  The watching, waiting **shore** holds four more lives.
  I offer him, I offer each, one **chance**.

  One life demands one fair and equal **chance**.
  My duty isn't measured by the **dose**.
  I see the anguish on the distant **shore**,
  But justice spins upon this simple **coin**.
  I owe no less to this one **stranger** here,
  Than if the claimed, collective **worse** were true.

  "He sees himself alone," the **stranger** cries.
  "One life, one death. What difference makes the **chance**
  For others far away? Their greater **worse**
  Arises from each separate loss. The **dose**
  Denied to them is felt by each. That **coin**
  You toss ignores the weeping on the **shore**!"

  But numbers count! Each cry's a separate wrong,
  The **shore** insists. "Regard each **stranger**'s need!
  The **dose** could save the **shore**! One weighted **chance**
  For him condemns the rest. Is that not **worse**?
  You mock their plight with that impartial **coin**!"
  (Their logic bites, yet feels an alien force).

  Is equal *concern* voided by the **coin**?
  Does fairness to the one dismiss the **shore**?
  Or is demanding certainty the **worse**
  Betrayal? To the pleading **stranger**, near,
  I gave no promise, only equal **chance**.
  This choice consumes the single precious **dose**.

  The liquid gleams, the full, decisive **dose**.
  I feel its weight far heavier than the **coin**.
  I look to him, I look towards the **shore**.
  "One **chance**," I say, though knowing it sounds **worse**
  To them, a cruelty. Each **stranger** stands
  Alone in their own fate, upon this **chance**.

  The **chance** is cast. The spinning **coin** ascends.
  I watch it climb, a cold, indifferent **dose**
  Of air. The **stranger** waits. The watching **shore**
  Holds breath. Is this respect, or merely **worse**?
  For thirty lines I held the loss apart,
  Refused the sum. Now watch the numbers start.

  Now watch the numbers start: the grieving **shore**,
  Five **strangers** lost. The vial, the single **dose**,
  This falling **coin** decides which death is **worse**? One **chance**.
