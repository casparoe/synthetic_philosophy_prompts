  Key challenges here: First, maintaining strict discipline about not sliding into trolley-problem clichés while analyzing what is essentially a real-world trolley scenario. Second, carefully distinguishing between the three German documents' approaches without oversimplifying. Third, handling the US comparison without making value judgments about which system is "better."

