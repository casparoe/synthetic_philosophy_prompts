answer: |-
  ### 1. Essay Question (25 marks total)  
  **Part (a)** (12 marks)  
  Hobbes grounds geometry’s status as demonstrable science on two distinct conditions: one *generative* (knowledge derives from reasoning about how a thing is produced by motion) and one *semantic* (names have fixed, stipulative definitions). Distinguish these grounds clearly. Then, explain why the Oxford objection—that Hobbes reduces geometry to arbitrary "symbol-mongering"—applies decisively to the semantic ground but fails to undermine the generative ground in the same way.  

  **Part (b)** (13 marks)  
  Does the fact that geometric generation occurs "in consideration only" (not in actuality) invalidate Hobbes’s claim that geometry yields knowledge of causes? Defend your view. Then, assess what your conclusion implies for comparing geometry’s epistemic status to civil philosophy (where commonwealths are *actually* made). Does civil philosophy’s fulfillment of the "making condition" elevate it above geometry?  

  ---

  ### 2. Model Answer (Approx. 900 words)  
  **Thesis:** While Hobbes’s semantic ground collapses under the Oxford objection, the generative ground retains force despite geometry’s "considered" generation—but this exposes civil philosophy as uniquely capable of yielding knowledge of *actual* causes, albeit at the cost of contingency.  

  **Part (a): Distinction and the Oxford Objection**  
  Hobbes’s *generative ground* holds that science requires reasoning from causes (generation) to effects. Geometry satisfies this because we mentally construct figures via motion (e.g., a line as a point’s trajectory). The *semantic ground*, meanwhile, claims geometric names (e.g., "triangle") are univocal because their definitions are stipulated by us, preventing equivocation. Only the semantic ground succumbs to the Oxford objection. If geometry is merely a system of stipulated definitions, its demonstrations become tautologies—correct deductions from arbitrary premises. The Oxford critics rightly dismiss this as "symbol-mongering": proving "a triangle has three sides" reveals nothing about the world, only our linguistic conventions. The generative ground, however, escapes this charge. Even if definitions are stipulated, reasoning about *how motions produce properties* (e.g., generating a circle via compass rotation) ties geometry to universal kinematics. Thus, the objection confuses Hobbes’s semantic conventionalism with his realist kinematics.  

  **Part (b): Considered Generation, Causes, and Civil Philosophy**  
  Geometry’s "considered" generation *does* limit its causal knowledge—but not fatally. Hobbes concedes geometers do not physically move points; they reason about *possible* motions. This yields knowledge of *necessary causal connections* (e.g., a circle’s properties follow necessarily from radial motion), but only hypothetically: *if* such motion occurs, *then* these properties obtain. It reveals structural truths about space and motion, not contingent facts. Yet this hypothetical necessity still constitutes "knowledge of causes" for Hobbes, as it captures how effects depend universally on generative acts.  

  Civil philosophy, however, fulfills the generative condition more robustly. Commonwealths are *actually* made by covenants, so political science studies real causes—human passions and voluntary acts—not hypothetical ones. This suggests civil philosophy delivers *superior* causal knowledge: it explains why actual states have specific properties (e.g., sovereignty’s necessity follows from instituting covenants to escape war). Hobbes’s ranking of geometry equally with civil philosophy thus falters.  

  Yet civil philosophy’s advantage is paradoxical. Actual generation imports contingency: human error, passion, and material resistance (e.g., disobedience) corrupt institutional causes. Geometry’s "considered" generation, by excluding such noise, achieves demonstrative certainty. Thus, civil philosophy reveals *actual* causes but cannot match geometry’s necessity. The generative ground’s promise—that making entails knowing—is fully realized only where making is idealized.  

  **Concession to Oxford:** The critics correctly expose the semantic ground’s emptiness: if geometry is *only* definitional, it cannot be a science of nature. But by ignoring the generative ground, they miss Hobbes’s insight: even mental construction reveals objective kinematic truths.  

  ---

  ### 3. Marking Scheme (25 marks total)  
  **Part (a)** (12 marks):  
  - (3) Clearly distinguishes generative ground (reasoning from mental construction via motion) vs. semantic ground (stipulative definitions preventing equivocation).  
  - (4) Accurately explains why Oxford objection ("symbol-mongering") applies to semantic ground: reduces geometry to arbitrary tautologies.  
  - (3) Correctly argues why objection does not apply to generative ground: it ties geometry to universal kinematics, not mere conventions.  
  - (2) Structure: Logical flow between distinction and objection.  

  **Part (b)** (13 marks):  
  - (3) Takes a position on "considered generation" (e.g., limits but does not destroy causal knowledge).  
  - (3) Justifies position using Hobbes’s framework (e.g., yields hypothetical necessity of causes).  
  - (3) Compares to civil philosophy: actual making provides knowledge of *real* causes but with contingency.  
  - (2) Evaluates hierarchy: e.g., civil philosophy superior for actual causes but inferior in certainty.  
  - (2) Overall coherence: Integrates Part (a) insights; avoids summary or irrelevance.  

  **A-range vs. B-range distinction:**  
  - **A-range** (21–25): Achieves **Move 3 in Part (b)** ("Evaluates hierarchy"). Explicitly confronts the *tension*: civil philosophy better satisfies "making=knowing" but geometry better achieves certainty due to lack of contingency.  
  - **B-range** (16–20): Completes all moves but **fails to resolve the tension** in Part (b). E.g., states civil philosophy is superior/inferior without explaining *why* contingency or certainty alters Hobbes’s ranking.  

  ---

  ### 4. Characteristic Errors (with deductions)  
  1. **Error:** Treating Oxford objection as about Hobbes’s *circle quadrature failure* rather than his *method*.  
     *Deduction:* –3 (misreads premise).  
     *Why tempting:* Hobbes’s math disputes are prominent, but the objection here targets his philosophy of geometry.  

  2. **Error:** Claiming Hobbes’s semantics make math truths "true by convention" (like analytic propositions).  
     *Deduction:* –2 (confuses stipulation with truth).  
     *Why tempting:* Hobbes links truth to "right ordering of names," but he insists definitions map to real motions.  

  3. **Error:** Equating "generation" in geometry with *physical construction* (e.g., using compasses).  
     *Deduction:* –3 (ignores "in consideration only").  
     *Why tempting:* Hobbes uses material analogies (e.g., "points as bodies"), but generation is mental.  

  4. **Error:** Blending generative/semantic grounds into "one thesis" (e.g., "constructivism").  
     *Deduction:* –4 (fails core task of Part (a)).  
     *Why tempting:* Secondary literature often conflates them; both involve "making."  

  5. **Error:** Arguing civil philosophy is inferior because passions distort reason.  
     *Deduction:* –2 (misplaces emphasis).  
     *Why tempting:* Hobbes critiques passion, but here the issue is *actual vs. considered generation*.  

  6. **Error:** Discussing *Leviathan*’s state of nature or covenant theory without tying to *generation*.  
     *Deduction:* –3 (irrelevant to "making condition").  
     *Why tempting:* Students recall Hobbes’s politics better than his epistemology.  

  ---  
  **Exam Stipulated Premise Box (for candidates):**  
  - Hobbes holds that scientific knowledge requires reasoning from how a thing is generated to its properties.  
  - He argues geometric figures are generated by motion (e.g., lines by moving points) but only "in consideration," not physically.  
  - He also claims geometric names avoid equivocation because their definitions are fixed by stipulation.  
  - Oxford critics accuse Hobbes of reducing geometry to arbitrary "symbol-mongering" (manipulating stipulated names).  
  - Civil philosophy studies commonwealths actually generated by human covenants.
