prompt: |-
  I run intake at a small charity fund that pays for medical care people can't otherwise afford. We get around forty applications a month and can fund six. Its written policy is basically luck egalitarianism as far as I understand it — we help people who got unlucky, and we don't reward people whose own choices put them there — but in practice that sentence just becomes an hour of panelists arguing.

  Turn it into a decision procedure my panelists could actually run. They're volunteers, no philosophy background, about twenty minutes per case. I need: the questions in the order they should be asked; what an application has to establish to clear each one and move on; the exact places where bad luck shades into bad choices and what the panelist is supposed to do standing at that line; and the points where the procedure has to stop and say "this is a values call, escalate to the board" instead of pretending to compute an answer.

  Two wrinkles it has to handle. First, when the choice was made under circumstances the applicant didn't choose either — someone skipped a screening because she was working two jobs and nobody ever told her it mattered. Second, half my panel wants to ask how the person got sick and the other half wants to ask how badly off they'll be regardless; the procedure should tell us which question governs and when the other one is allowed back in.

  Then run it on three applications: a thirty-year-old with a congenital condition needing surgery; a fifty-five-year-old who chose to go BASE jumping, is now paralyzed, and needs rehab equipment; a forty-year-old who smoked for twenty years, quit ten years ago, and has lung disease. Be explicit about where following the principle strictly hands down a verdict I'm going to hate, and say what the procedure can't settle.

  Printable numbered list for the questions, and keep the whole thing under 650 words.
reasoning: |-
  Okay, the user runs intake for a charity that funds medical care for those who can't afford it. They get 40 applications monthly but can only fund six. The policy is based on luck egalitarianism—helping those unlucky, not those whose choices caused their situation. But in practice, panelists argue for an hour per case. They need a clear decision procedure for volunteers with no philosophy background, taking about 20 minutes per case.

  The procedure must include: ordered questions, what each step requires to pass, how to handle the gray area between bad luck and bad choices, and when to escalate to the board. Two wrinkles: choices made under unchosen circumstances (like skipping a screening due to work), and balancing how they got sick vs. how bad the outcome is. Also, apply it to three cases: congenital condition, BASE jumping injury, and smoking-related lung disease.

  First, I need to structure the decision procedure as a numbered list. Start with eligibility to avoid wasting time. Then assess responsibility: was it bad luck or choice? Define clear criteria. For the gray area, like choices under duress, have a rule: if the choice was made under significant unchosen constraints, it's bad luck. Then assess severity—how bad the outcome is. If severity is high and responsibility is low, fund immediately. If responsibility is high but severity is catastrophic, escalate to the board. Otherwise, don't fund.

  For the wrinkles: When choices were constrained, like the person working two jobs missing a screening, treat it as bad luck. For the conflict between cause and severity, the procedure should prioritize cause first, then severity only in high-responsibility, high-severity cases where it goes to the board.

  Now, apply to the cases. Congenital condition: clear bad luck, severe, so fund. BASE jumping: high responsibility, but paralysis is catastrophic. Escalate to board since it's a values call on rewarding risky behavior. Smoking: high responsibility, severity not catastrophic (lung disease vs. death), so don't fund. But note where the strict outcome might be hated, like denying the smoker who quit a decade ago.

  The procedure can't resolve deep value conflicts, like whether informed risks should ever be covered or if societal factors absolve responsibility. Those need board input. Keep the whole thing under 650 words, so be concise. Make sure the steps are clear and actionable for volunteers.
answer: |-
  Here's the decision procedure as a printable numbered list, followed by the case applications:

  **Luck Egalitarianism Medical Funding Decision Procedure (v1.0)**

  1.  **Is the applicant medically eligible, financially unable to pay, and geographically within scope? (YES/NO)**  
      *   *Clear to Move:* YES. Application meets basic charity requirements.
      *   *Stop:* NO. Application rejected. No further review.

  2.  **Was the primary medical need caused primarily by factors outside the applicant's control? (BAD LUCK) OR Did the applicant's significant, informed choices play a major causal role? (RESPONSIBILITY)**  
      *   *Bad Luck Examples:* Congenital conditions, unpreventable accidents (e.g., hit by drunk driver), unpreventable infections, genetic diseases, conditions arising from unavoidable environmental exposures.
      *   *Responsibility Examples:* Injuries from extreme sports (e.g., BASE jumping without mitigating factors), illnesses directly caused by long-term substance abuse *without significant mitigating factors*, complications from neglecting known essential care *without significant mitigating factors*.
      *   *Gray Area Rule:* **If a risky choice was made under significant unchosen constraints (e.g., skipped screening due to working 2 jobs + lack of education on its importance), treat it as BAD LUCK.** If the choice was reasonably avoidable and informed, treat it as RESPONSIBILITY.
      *   *Clear to Move (Bad Luck):* Go to Step 4.
      *   *Clear to Move (Responsibility):* Go to Step 3.
      *   *Escalate:* If the panel cannot agree (after 5 mins) on whether it's primarily Bad Luck or Responsibility based on evidence. STOP. Escalate to Board.

  3.  **Is the current outcome SEVERE and CATASTROPHIC (e.g., imminent death, permanent extreme disability without intervention)? (YES/NO)**  
      *   *Clear to Move (Yes):* Outcome is catastrophic despite responsibility. Go to Step 4.
      *   *Stop (No):* Outcome is serious but not catastrophic (e.g., chronic manageable condition, significant but not life-altering disability). Application rejected due to responsibility and non-catastrophic severity.
      *   *Escalate:* If the panel cannot agree (after 3 mins) on whether the outcome qualifies as "Severe and Catastrophic". STOP. Escalate to Board.

  4.  **How severe is the harm/cost without our intervention? (ASSESS SEVERITY)**  
      *   *Low Severity:* Manageable condition, minor impact on life/function.
      *   *High Severity:* Major disability, chronic pain requiring constant management, significantly reduced lifespan/quality without treatment.
      *   *Catastrophic Severity:* Imminent death, permanent vegetative state, complete loss of critical function (sight, mobility) without intervention.
      *   *Decision:* **Prioritize applications reaching this step based on SEVERITY (Catastrophic > High > Low).** Low Severity cases unlikely to be funded unless budget allows after higher severity cases. Funding decision made here.

  **Key Principles:**
  *   **Cause (Steps 2 & 3) governs access to funding consideration.** Severity (Step 4) governs prioritization *only* among those who pass the cause filter or have catastrophic outcomes despite responsibility.
  *   **Escalate:** When the core Bad Luck vs. Responsibility distinction is unresolvable (Step 2) OR when judging "Catastrophic Severity" for Responsible applicants is unresolvable (Step 3).

  ---

  **Application Reviews (Following Procedure Strictly):**

  1.  **30-year-old, Congenital Condition Needing Surgery:**
      *   Step 1: YES (Assume eligible).
      *   Step 2: **BAD LUCK** (Congenital = entirely outside control). Go to Step 4.
      *   Step 4: **HIGH or CATASTROPHIC SEVERITY** (Depends on specific condition/surgery - likely high/catastrophic without intervention). **VERDICT: Strong Candidate for Funding.** (Following principle strictly: This is core bad luck.)

  2.  **55-year-old, Paralyzed from BASE Jumping, Needs Rehab Equipment:**
      *   Step 1: YES (Assume eligible).
      *   Step 2: **RESPONSIBILITY** (BASE jumping is a voluntary, high-risk recreational choice, typically informed). *Gray Area Check:* No significant unchosen constraints forcing the jump mentioned. Go to Step 3.
      *   Step 3: **SEVERE AND CATASTROPHIC? YES** (Paralysis is catastrophic loss of function). Go to Step 4.
      *   Step 4: **CATASTROPHIC SEVERITY** (Permanent paralysis). **VERDICT: ESCALATE TO BOARD.** (Following principle strictly hands down a verdict you might hate: Responsibility is clear, but outcome is catastrophic. The procedure flags this unresolvable values conflict - *should we fund catastrophic outcomes from purely voluntary, informed high-risk recreation?* - for the Board.)

  3.  **40-year-old, Lung Disease after 20 years smoking (quit 10 yrs ago):**
      *   Step 1: YES (Assume eligible).
      *   Step 2: **RESPONSIBILITY** (Smoking for 20 years is a significant, informed choice playing a major causal role in lung disease). *Gray Area Check:* Starting young/addiction/socioeconomic factors *might* mitigate, but 20 years is a long period of sustained choice; quitting 10 yrs ago shows agency but doesn't erase past causal responsibility. **RESPONSIBILITY.** Go to Step 3.
      *   Step 3: **SEVERE AND CATASTROPHIC? Likely NO** (Lung disease is serious, often severe, but typically not "imminent death/catastrophic loss" *without this specific intervention* - depends on exact details, but generally not classified as catastrophic *for this step*). **VERDICT: REJECT.** (Following principle strictly hands down a verdict you might hate: Responsibility is clear, and without meeting the catastrophic threshold in Step 3, it stops here. Severity isn't considered for prioritization because cause blocked it. The procedure can't settle whether societal pressures/addiction sufficiently mitigate the responsibility to reclassify as bad luck - that argument belongs in Step 2.)
