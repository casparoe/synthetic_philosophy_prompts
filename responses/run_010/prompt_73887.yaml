  ## Meridian Moral Exchange: Participant Rulebook & Operational FAQ  
  *(Version 4.3.1, Effective: [CURRENT_DATE])*

  **1. Introduction & Scope**  
  1.1. The Meridian Moral Exchange ("MME" or the "Exchange") provides a regulated venue for the standardized trading of Moral Settlement Instruments ("MSIs") pursuant to the Ethical Commerce Act of [YEAR] and oversight by the Office of Moral Market Oversight ("OMMO").  
  1.2. This Rulebook governs Participant conduct, instrument specifications, clearing protocols via the Impartial Spectator Clearing Corporation ("ISCC"), and dispute resolution. Defined Terms appear in `SMALL CAPS` throughout.

  **2. Participant Eligibility & Onboarding**  
  2.1. All prospective PARTICIPANTS (natural persons or designated MORAL AGENTS of entities) must complete the Know Your Conscience ("KYC") process.  
  2.1(a). KYC requires submission of Form KYC-1 ("Source of Credence Disclosure"), detailing origins of moral intuitions, key influences, and periods of significant CREDENCE volatility. Supporting documentation (e.g., philosophy course transcripts, book club reading lists, significant life event affidavits) is encouraged.  
  2.1(b). PARTICIPANTS must register their INTERNAL PARLIAMENT via Form MP-1 ("Credence Allocation Declaration").  
  2.1(c). The INTERNAL PARLIAMENT comprises SEATS allocated proportionally to the PARTICIPANT’S current CREDENCE (expressed as a percentage) in recognized MORAL THEORIES (e.g., Classical Utilitarianism, Kantian Deontology, Rule Consequentialism, Virtue Ethics Threshold 7b, etc.). Unallocated or "agnostic" CREDENCE must be placed in the Designated Doubt Reserve ("DDR").  
  2.2. PARTICIPANTS must MARK-TO-MARKET their INTERNAL PARLIAMENT SEAT allocation quarterly via Form MP-1Q. Material shifts (>5% aggregate or >2% in any single THEORY SEAT) occurring intra-quarter require immediate amendment filing (Form MP-1A).  
  2.3. The Exchange reserves the right to suspend KYC-1 or MP-1 filings deemed "insincere," "convenient," or exhibiting "excessive herding behavior" per Market Monitoring Desk ("MMD") Advisory 12.7.

  **3. Tradable Instruments**  
  3.1. Standardized MSI contracts cleared through ISCC include:  
  3.1(a). **ABSTENTION FUTURES (AF):** Binding agreement to refrain from a specified class of action (e.g., "Dietary Restriction Level 3," "Carbon Travel Tier 2") for a defined period. Settlement is physical (verified non-performance) or cash against the Moral Reference Index (`MRI`).  
  3.1(b). **CONVICTION SWAPS (CS):** Agreement between two PARTICIPANTS to exchange the moral weight associated with performing an action. Party A pays Party B to assume the "moral burden" of Action X; Party B pays Party A for Action Y. Net settlement in Moral Accounting Units (`MAU`).  
  3.1(c). **MORAL OFFSET CERTIFICATES (MOC):** Standardized credits representing the neutralization of a quantified moral "debit" incurred by an action. One (1) MOC offsets one (1) Moral Debit Unit (`MDU`) as measured against the MRI.  
  3.1(d). **DEONTOLOGICAL CREDIT DEFAULT SWAPS (DCDS):** Protection against a "CONSCIENCE DEFAULT EVENT" (`CDE`) – defined as the conscious violation of a deeply held deontological constraint by the protection buyer. Payout triggered upon verified CDE (Form CDE-1 with Notarized Anguish Affidavit).  
  3.2. Instrument specifications (tick size, contract months, permissible underlying actions/constraints) are published in Supplement S-1.

  **4. Pricing & Settlement**  
  4.1. The MORAL REFERENCE INDEX (`MRI`) serves as the benchmark for MSI valuation and cash settlement.  
  4.1(a). The MRI is calculated hourly by ISCC using a Borda-Condorcet hybrid algorithm applied to the aggregate, anonymized SEAT allocations of all PARTICIPANTS, weighted by trading volume and adjusted for stated THEORY incomparability.  
  4.1(b). The MRI is expressed in Moral Accounting Units (`MAU`), a dimensionless unit representing the aggregate, normalized choice-worthiness valuation across all registered THEORIES for a standard "util" basket.  
  4.2. Cross-THEORY settlements (e.g., a Utilitarian buying an MOC from a Kantian) are converted via the MRI/MAU mechanism. ISCC assumes counterparty THEORY risk during conversion.  
  4.3. Physical settlement of AFs requires third-party verification by an OMMO-Audited Moral Auditor. Failure to perform constitutes a contract breach (Rule 9).

  **5. Key Participant Obligations**  
  5.1. **SINCERE ALLOCATION:** PARTICIPANTS warrant that MP-1 filings represent their best-faith current CREDENCE, acknowledging that strategic misrepresentation ("Moral Hedging") undermines market integrity and voids trades per Rule 12(b).  
  5.2. **CONSCIENCE MAINTENANCE:** PARTICIPANTS must actively maintain their capacity for moral reasoning. Evidence of significant impairment (e.g., prolonged nihilism, fanaticism exceeding Tolerance Band 4, acute apathy) may lead to suspended trading privileges.  
  5.3. **NON-EXTERNALIZATION (RULE 12(c)):**  
  12(c)(i). Any trade where the primary moral loss is borne by an identifiable, non-consenting non-signatory (`INN`) is null and void *ab initio*.  
  12(c)(ii). The PARTICIPANT initiating the trade bears the burden of proving the absence of an INN prior to execution.  
  *Commentary 12c.1 (Exchange): While foundational, satisfaction of Rule 12(c) requires demonstrating a negative of near-infinite scope. Participants are advised to maintain significant litigation reserves when trading instruments with diffuse or poorly defined moral patienthood (e.g., MOCs for atmospheric carbon, AFs affecting potential future beings).*

  **6. Market Integrity & Incident Protocol**  
  6.1. The MMD monitors for anomalous CREDENCE shifts, wash trading of convictions, and attempts to corner moral markets.  
  6.2. **Incident [REDACTED-REF: MM/YYYY]:** References to the "[REDACTED] Delisting Event" are restricted to internal Exchange compliance training materials. Publicly, the Exchange affirms only that all SEAT allocations and corresponding THEORY weights reflect genuine PARTICIPANT CREDENCE at the time of MARK-TO-MARKET, and that Rule 8.4 (Voluntary THEORY Delisting upon acquisition of >75% of circulating SEATS by a single PARTICIPANT or affiliated group, subject to OMMO review) was followed per protocol.¹  
  6.3. PARTICIPANTS holding >15% of SEATS in any single THEORY must file a Moral Position Disclosure (Form MPD-1) weekly.

  **Frequently Asked Questions (FAQ)**

  **Q1: How do I know my MAUs are comparable to another Participant's? Doesn't each moral theory measure value differently?**  
  A1: The MRI/MAU mechanism, utilizing sophisticated aggregation of diverse THEORY weights via the Borda-Condorcet algorithm, provides a common medium of exchange. While individual THEORIES may lack a common unit of account, the revealed preferences and credences of the market *collective*, processed through our proprietary methodology, generate a sufficiently stable conversion metric for settlement purposes. Think of it as a moral FX mechanism.

  **Q2: Isn't this just selling indulgences?**  
  A2: The Meridian Moral Exchange categorically rejects any comparison to pre-modern indulgence systems. MME operates under strict regulatory oversight (OMMO), utilizes transparent, market-driven pricing (MRI), mandates rigorous KYC/MP-1 disclosures to combat insincerity, and offers standardized, exchange-traded instruments focused on future forbearance, burden-sharing, and measurable offsetting – not retrospective absolution. The structural and regulatory differences are profound.²

  **Q3: What happens if I have a genuine crisis of conscience and my credence changes drastically overnight?**  
  A3: File Form MP-1A immediately. Failure to do so may constitute a violation of Rule 5.1 (Sincere Allocation). Depending on the severity and direction of the shift, your open positions may be subject to accelerated margin requirements or forced liquidation by ISCC to manage counterparty THEORY risk. We recommend maintaining a diversified INTERNAL PARLIAMENT portfolio to mitigate volatility.

  **Q4: Rule 12(c) seems impossible to satisfy. How can I ever prove no INN exists?**  
  A4: Rule 12(c) embodies a core ethical principle of the Exchange. While operationally challenging, its stringent requirement incentivizes Participants to carefully consider the potential externalities of their traded moral actions. Focus trading on instruments with highly localized, consensual, or patientless moral dimensions where feasible. Consult Compliance Advisory CA-12c for guidance. Litigation reserves are strongly recommended.

  **Q5: Can wealth distort the market? Won't rich participants just buy their way out of moral constraints?**  
  A5: The MME provides a neutral price discovery mechanism. The clearing price reflects the aggregate market valuation of moral trade-offs at a given time, incorporating available information and credences. Wealth enables greater participation, but does not inherently distort the *price* of morality any more than it distorts the price of wheat; it simply reflects differential willingness and ability to transact within the established framework. The market is amoral only in its mechanism, not its inputs.

  ---
  **Author's Note**

  **Liberties Taken & Contested Ground:**  
  The satire leans heavily on *operationalizing* the core challenges of moral trade proposals. Key liberties:  
  1.  **Credence Measurement/Registration:** Form MP-1 exaggerates the feasibility of quantifying and honestly reporting probabilistic credence across incommensurable theories. Real proposals often assume this is tractable; the satire presents it as bureaucratically fraught and ripe for gaming.  
  2.  **Comparability (MRI/MAU):** The Borda-Condorcet MRI is a deliberate strawman. Proposals often suggest proxies (e.g., voting, bargaining weights), but the satire highlights the arbitrariness of *any* aggregation method when theories disagree fundamentally on scales and units. The "MAU" embodies this absurdity.  
  3.  **Alienation:** Instruments like DCDS explicitly satirize the idea that core deontological constraints *can* be meaningfully "traded" – a point hotly contested in philosophy (can you *sell* a promise not to murder?).  
  4.  **Rule 12(c) & INNs:** This directly targets the core Coasean flaw: real-world externalities (pollution victims, exploited workers, future generations) are rarely feasible signatories. The rule's practical impossibility underscores the moral hazard.  
  5.  **The "Incident":** Delisting a theory via seat accumulation satirizes how market power could silence minority or demanding moral views, questioning if "revealed credence" via trade reflects sincere belief or financial capacity. Real proposals likely wouldn't allow this.  
  6.  **Wealth Distortion:** The FAQ answer (Q5) embodies the market fundamentalism the satire critiques. Proposals might argue markets *reveal* value, but the satire assumes wealth inevitably sets the price, prioritizing ability-to-pay over moral insight.

  **What Could Change My Mind (Or Where the Satire Might Fail):**  
  The satire works by assuming the *market mechanism itself* inevitably introduces distortions (wealth effects, gaming, bureaucracy, aggregation absurdity) that corrupt the ideal of moral trade. A convincing counter-argument would need to show:  
  1.  **Robust Non-Market Alternatives Fail:** If voting, deliberation, or principled pluralism consistently yield worse outcomes (more conflict, persistent injustice) than even an imperfect market *in realistic, large-scale societies*, the market's flaws might be the least bad option.  
  2.  **Markets Reveal Sincere Meta-Credence:** If participation *requires* such costly commitment (time, disclosure, genuine belief updates via MP-1 marking) that it filters out insincere actors, making revealed "prices" better proxies for deep moral uncertainty than stated beliefs or votes. The satire assumes insincerity/gaming dominates.  
  3.  **Externalities Are Manageably Local:** If moral conflicts truly involved *only* consenting adults with clear, tradable entitlements and no spillovers (a vanishingly small set), Coasean bargaining becomes plausible. The satire assumes INNs are ubiquitous.  
  4.  **Wealth Correlates with Moral Insight:** A deeply uncomfortable argument, but if one could demonstrate that resources *enable* deeper moral reflection or access to information, the wealth distortion critique weakens. The satire assumes no such correlation.  
  The deepest flaw in the satire might be its focus on *exchange* mechanics. A non-market mechanism implementing moral uncertainty (e.g., a sophisticated voting rule) might face identical aggregation and sincerity problems without the wealth distortion. If those problems are fundamental to *any* implementation of moral uncertainty under profound disagreement (not unique to markets), then the satire unfairly singles out the market approach. The core philosophical difficulties might be inescapable regardless of the institutional form.
