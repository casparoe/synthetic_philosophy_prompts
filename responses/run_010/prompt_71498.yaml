prompt: |-
  There is a dispute about the temporal fine structure of experience that I want to convert into a sorting instrument rather than a lecture. The question I care about is narrow: when a subject reports something that could not have been available to them at the moment they report experiencing it — a colour change seen in transit between two lamps, a tap felt at a point on the forearm where no tap was delivered, a stationary flash that appears to trail a moving object it was physically aligned with — is there nevertheless a determinate fact about what the subject's experience was like at that moment, a fact the report merely fails to track, or is the demand for such a fact already the mistake? I am preparing a handout for a graduate summer-school session, and I want participants sorted by what they say about cases, not by which camp they announce.

  **What the tree may assume.** Take it as settled, shared by every participant, that the following phenomena are real and correctly described: (i) two spatially separated lamps flashing in alternation, with subjects reporting smooth motion between them and a colour change occurring somewhere along the path; (ii) a briefly presented target followed by a mask, with subjects reporting having seen nothing at the target's location; (iii) taps delivered at the wrist and then the elbow, producing reported taps at intervening points on the forearm; (iv) a flash physically aligned with a moving object, reported as lagging behind it; (v) cortical stimulation experiments in which subjects date the onset of an evoked sensation to a time earlier than the stimulation could plausibly have produced it.

  **Three paradigms of my own.** Treat these as thought experiments on the same footing as the above; they are mine, not from the literature.
  1. *Cue-delayed colour phi.* On half the trials subjects are told in advance which lamp's colour to report; on the other half, a tone issued after both lamps have gone dark indicates which to report. Suppose both groups give identical reports, including the in-transit colour change.
  2. *Double report.* After a flash-lag trial the subject makes an immediate keypress localisation of the flash and, two seconds later, a freehand drawing of what they saw. Suppose the keypress places the flash in alignment while the drawing places it behind the moving object.
  3. *Deferred narrative.* In a masking block, no response is collected on a subset of trials. At the end of the block the subject is asked to describe, in free narrative, everything they saw. Suppose the masked target turns up in that narrative.

  **Deliverable.** A decision tree of ten to twelve nodes, each a yes/no question or a choice among two or three options, and seven to nine leaves.

  - Every node must be answerable by someone who has never read the literature: phrase each in the vocabulary of the cases — lamps, taps, cues, reports, memory, the moment of the flash — and not in the vocabulary of the theories. No node may contain the name of a position, a philosopher, or a term of art belonging to one side of the dispute.
  - At least two nodes must probe the difference between the order in which experiences occur and an experience whose content is an order: whether a subject can undergo "A then B" without there having been an experience of A followed by an experience of B.
  - Each leaf carries a label (the standard name where one exists, a coinage where none does), a two-sentence statement of the view, and one sentence naming its most awkward commitment — the thing its defender would least like to have said aloud in seminar.
  - The leaves must include, at minimum: a view on which there is a finish line in the stream and nothing downstream of it can be revised; a view on which the question of when the revision happened has no answer in cases like these; a view on which experience is determinate precisely because all the integration, extrapolation and inference is finished before experience begins; a view on which experience is determinate and then overwritten in memory, leaving sincere but unfaithful reports; a view on which the specious present is a sequence of bounded windows; a view on which every experience carries its own just-past and about-to-be within it; a view on which there was never any in-transit colour experience to have, and the subject is describing what they know about the display; and a view on which the phenomenology is authoritative and the paradigms, not the theory, are what fail.
  - Flag every pair of leaves that your tree routes to different branches but that the participants' answers cannot in practice distinguish. For each such pair, say whether some further case would separate them or whether the two are equivalent by construction.
  - List at least four complete answer-vectors that your tree permits and that correspond to no view anyone holds. For each, diagnose the vacancy: is the combination incoherent, merely unattractive, or simply unexplored?

  Two further constraints. Nothing in the handout may require a reader to look anything up: no bibliography, no citations, no page references, no author-year attributions — naming positions and people is expected and fine. And close with four to six sentences identifying which single node does the most diagnostic work in the tree, and which node comes closest to restating the question at issue rather than dividing the answers to it.
reasoning: |-
  Hmm, the user wants me to create a decision tree for sorting graduate students based on their views about the temporal fine structure of conscious experience. They're specifically interested in cases where subjective reports seem to contradict what was physically present at the moment of experience.

  This is a complex philosophical problem about the relationship between experience, memory, and reporting. The user has provided several established phenomena (like the phi phenomenon and cutaneous rabbit) and three original thought experiments. I need to design a decision tree with 10-12 nodes that probes fundamental disagreements without using technical jargon.

  Key requirements:
  - Every node must be answerable using only the vocabulary of the cases (lamps, taps, reports etc.)
  - Must include at least two nodes about temporal order vs ordered content
  - Needs 7-9 labeled leaves covering specified positions
  - Must flag indistinguishable leaf pairs and list impossible answer combinations

  The user wants this for a summer school handout - practical and interactive rather than lecture-based. They're clearly deeply familiar with the literature but want to avoid name-dropping philosophers in the tree itself.

  I'll start by identifying the core tension: is there a determinate experiential fact at each moment, or is that demand mistaken? The positions to cover include:
  - Finitist views (experience has a "finish line")
  - Indeterminacy views
  - Pre-experiential processing views
  - Memory overwriting views
  - Specious present models
  - Predictive processing views
  - Postdictive interpretation views
  - Phenomenological authority views

  For the decision tree, I'll need to craft questions that naturally sort people into these camps. Good nodes might probe:
  1. Whether the reported content (like color change) was experienced or inferred
  2. Whether conflicting reports indicate memory errors or indeterminate experience
  3. Whether temporal sequence requires discrete experiential moments
  4. How to handle cases where retrospective narrative includes "missing" elements

  The deferred narrative case is particularly interesting - it forces a choice about whether phenomenology can be constituted after the fact. The cue-delayed color phi experiment cleverly tests whether advance knowledge affects experience.

  For impossible answer vectors, I'll need to identify combinations that would require contradictory commitments - like believing in both determinate moment-by-moment experience AND deferred constitution of content.

  The most diagnostic node will probably be about whether experience is revised after the fact - this cuts to the heart of the "finish line" question. The node closest to restating the core question might be about whether reports track momentary experience.

  I'll structure the tree to first separate views that accept phenomenological authority from those that don't, then branch based on how they handle temporal structure and conflicting reports. The thought experiments will serve as key discriminators throughout.
answer: |-
  Here is a decision tree meeting all specifications. It uses only case-based vocabulary and sorts by responses to concrete scenarios.

  ---

  **Decision Tree: Temporal Fine Structure of Experience**

  1.  **In the cue-delayed colour phi (tone indicates which lamp to report *after* both are dark), when subjects report the in-transit colour change, was that colour change:**  
      (A) Something they genuinely *saw happening* while the lamps were visible?  
      (B) Something they only realized or constructed *after* the tone told them which lamp was relevant?  
      (C) Something they *saw*, but only in a way that depended on knowing (from the tone) which lamp came second?

  2.  **In the double report trial (keypress places flash aligned, drawing places it behind moving object):**  
      (A) Is the keypress report more faithful to what was experienced *at the moment of the flash*?  
      (B) Is the drawing more faithful to what was experienced *at the moment of the flash*?  
      (C) Were both reports faithful to the experience *as it was* at different *times* (keypress when made, drawing when made)?  
      (D) Does neither report faithfully capture a single determinate experience at the flash moment because the experience itself wasn't settled then?

  3.  **In the deferred narrative (masked target described *later* in free narrative): When the subject describes the masked target at the end of the block, was the target:**  
      (A) Truly *seen* during the original trial but only reported later?  
      (B) Not seen during the trial, but *mistakenly believed* later to have been seen?  
      (C) Not seen during the trial, but its presence *inferred* later based on block context?

  4.  **Consider a sequence "A then B" (like two distinct taps at wrist then elbow). To experience this sequence ("A then B"):**  
      (A) Must there be an experience *of A alone*, followed by an experience *of B alone*?  
      (B) Can there be a *single* experience whose content *is* "A followed by B", without separate A-only and B-only moments?  
      (C) Is the sequence only known *after* B occurs, through memory?

  5.  **When the cutaneous rabbit reports a tap mid-forearm (where no tap occurred), at the *moment* when that illusory tap is supposedly felt:**  
      (A) Was there *no* tap experience there at all?  
      (B) Was there a tap experience *as real as* the wrist/elbow taps?  
      (C) Was there an experience *of expectation* or *tendency* towards a tap, but not a full tap?

  6.  **In the flash-lag effect (flash aligned physically, seen as lagging), at the precise *moment* the flash occurs:**  
      (A) Was the flash experienced in its correct, aligned position?  
      (B) Was the flash experienced in its lagging position?  
      (C) Was there no determinate experience of the flash's position at that moment?

  7.  **In the cortical stimulation experiment (sensation onset dated too early): The "antedating" of the sensation means:**  
      (A) The brain *changed the timing* of the past experience in memory.  
      (B) The experience genuinely *occurred earlier* than the stimulus.  
      (C) There was no determinate time for the experience *until* it was reported.

  8.  **For the colour change in the *standard* colour phi (no delay cue):**  
      (A) Was the colour change experienced *during* the interval between the lamps going dark?  
      (B) Was the colour change only experienced/completed *after* the second lamp flashed and went dark?  
      (C) Was there never an experience *of change itself*, only separate experiences of Lamp1 and Lamp2 colours?

  9.  **After a masking trial where the subject initially reports seeing nothing at the target location, but later (in deferred narrative) describes the target:**  
      (A) Does this show the *original experience* contained the target, but the initial report missed it?  
      (B) Does it show the *memory* of the experience was altered after the fact?  
      (C) Does it show the *experience itself* was indeterminate during the trial and only settled later?

  10. **Consider the *moment* the second lamp flashes in colour phi. Does the experience at that moment:**  
      (A) Include the *completed* motion and colour change?  
      (B) Include *only* the second flash and *nothing* about the motion/change?  
      (C) Include the second flash *plus* the *just-past* first flash and the *ongoing* motion/change?

  11. **When a subject reports the illusory forearm tap in the rabbit illusion:**  
      (A) Is this report *incorrect* about what they experienced *at the time*?  
      (B) Is this report *correct* about what they experienced *at the time*?  
      (C) Is the report correct, but what it describes wasn't an *experience of a tap*, only an *inference*?

  12. **In the deferred narrative case, if the subject sincerely describes the masked target:**  
      (A) Does this *prove* the target was in the original experience?  
      (B) Does it *disprove* claims the target wasn't experienced?  
      (C) Is it *irrelevant* to what the original experience was like?

  ---

  **Leaves (Views)**

  1.  **Momentary Finitism:** Experience is fully formed at each moment; nothing later alters its past content. Reports merely access this fixed record.  
      *Awkward Commitment:* Must insist subjects are simply *wrong* about their experience in deferred narrative or report conflicts, even when sincere and consistent.
  2.  **Memory Revisionism:** Experience is determinate at the time, but subsequent events (like the tone or block context) overwrite the memory trace before reporting. Reports reflect revised memory, not original experience.  
      *Awkward Commitment:* Requires subjects to be systematically and profoundly mistaken about their *own past experiences* whenever integration occurs.
  3.  **Pre-Experiential Completion:** All integration and inference happens *before* the conscious experience begins. Experience presents a finished, determinate product.  
      *Awkward Commitment:* The "moment" of experience must be delayed until *after* all relevant physical events (e.g., after the tone in cue-delayed phi).
  4.  **Temporal Atomism:** Experience occurs only in discrete, instantaneous moments. Sequence is inferred post-hoc.  
      *Awkward Commitment:* Cannot account for the direct experience of motion, change, or brief sequences (like "A then B") as such.
  5.  **Specious Present Windowing:** Experience occurs within extended, overlapping temporal windows ("specious presents"). Content within a window is co-present and determinate.  
      *Awkward Commitment:* The boundaries of the window are arbitrary and cannot be specified by the subject or experimenter.
  6.  **Retentionalism:** Every conscious moment inherently includes a "just-past" horizon and sometimes an "about-to-be" horizon as part of its content. Sequence is directly experienced within a single now.  
      *Awkward Commitment:* The "just-past" content is not a memory trace but part of the present experience, making the present experience intrinsically complex and temporally extended.
  7.  **Postdictive Interpretationism:** The "experience" reported is determined by cognitive processes (inference, interpretation) operating on sensory data *after* the relevant physical events. There is no determinate "at the moment" phenomenology independent of this postdiction.  
      *Awkward Commitment:* Denies that there is a specific "what it was like" *at the time* for the subject to be wrong *or* right about in many cases.
  8.  **Phenomenological Authority:** The subject's sincere report, especially under good conditions, defines their experience. If they report the in-transit colour or the masked target later, then that *was* part of their experience.  
      *Awkward Commitment:* Must hold that the *timing* of the experience (e.g., colour change during transit) is as reported, even if physics suggests integration took longer.
  9.  **Dynamic Indeterminacy:** Experience at time T is indeterminate regarding certain features (position, colour, presence) that are only rendered determinate by subsequent events or reports. The demand for a determinate fact at T is misplaced.  
      *Awkward Commitment:* Experience loses its status as a definite, time-local state of the subject.

  ---

  **Indistinguishable Leaves & Distinguishers**

  *   **Memory Revisionism (2) vs. Postdictive Interpretationism (7):** Both explain deferred reports as post-hoc. *Distinguisher:* Probe *when* the "experience" becomes determinate. Ask: "In cue-delayed phi, *when* was the colour of the moving spot fixed? (A) Before the tone. (B) Only after/because of the tone." (2:A, 7:B).
  *   **Retentionalism (6) vs. Specious Present Windowing (5):** Both involve extended presents. *Distinguisher:* Probe discreteness. Ask: "Is the specious present a single, unified experience (6) or a sequence of micro-experiences within a window (5)?" A further case: Imagine a very slow phi motion. Is the motion experienced as truly continuous (6) or as a rapid sequence of stills (5)?
  *   **Phenomenological Authority (8) vs. Pre-Experiential Completion (3):** Both validate reports. *Distinguisher:* Ask: "In cue-delayed phi, does the tone *alter* the experience of the colour change compared to the pre-cued group? (A) No, experience was the same (3). (B) Yes, the tone makes it part of the experience (8)." *Note:* They may *functionally* agree reports are correct, but differ on mechanism.

  ---

  **Impossible Answer Vectors (Examples)**

  1.  **Vector:** (1:B, 2:A, 3:A, 4:A, 5:B, 6:A, 7:A, 8:B, 9:A, 10:B, 11:A, 12:A)  
      *Vacancy:* **Incoherent.** Claims cue-delay colour change is constructed after the tone (1:B) *but* the keypress is faithful to the flash moment (2:A) *and* deferred narrative proves the target was originally experienced (9:A, 12:A). Insists on discrete temporal atoms (4:A) *and* that the flash was experienced aligned at the moment (6:A), yet also that the illusory tap was experienced as real at the time (5:B). This combines commitments to late construction *and* faithful early access *and* atomism *and* accurate illusory content at the time – an unstable mix lacking a principle to decide *when* construction wins vs. access wins.
  2.  **Vector:** (1:A, 2:C, 3:C, 4:B, 5:A, 6:C, 7:C, 8:C, 9:C, 10:C, 11:C, 12:C)  
      *Vacancy:* **Merely Unattractive / Unexplored.** Denies any determinate content (6:C, 10:C), denies reports track original experience (2:C, 3:C, 9:C, 12:C), sees sequence as directly experienced (4:B) but denies illusory tap experience (5:A, 11:C). This is a form of **Dynamic Indeterminacy (9)** but weakens it further by denying sequence requires atoms (4:B) while also denying the retentional "just-past" (10:C). It lacks positive content for *what* is experienced beyond fleeting, indeterminate moments and direct sequence awareness. It's likely unexplored because it struggles to explain the richness of reported experience without resorting to *some* form of temporal extension or postdiction.
  3.  **Vector:** (1:A, 2:B, 3:A, 4:A, 5:B, 6:B, 7:B, 8:B, 9:A, 10:A, 11:B, 12:A)  
      *Vacancy:* **Incoherent.** Claims the *delayed* drawing is faithful to the flash moment (2:B) *and* the deferred narrative proves original experience (9:A, 12:A) *and* the flash was experienced lagging at the moment (6:B) *and* the sensation genuinely occurred earlier (7:B). Yet insists experience is momentary/finite (1:A, 4:A, 10:A) and illusory taps are real (5:B, 11:B). This requires experience to be both fixed at the moment *and* contain future-incorporated content (flash lag, colour change) and antedated sensations – violating the claimed momentariness/finiteness.
  4.  **Vector:** (1:C, 2:D, 3:B, 4:C, 5:C, 6:C, 7:A, 8:C, 9:B, 10:B, 11:C, 12:B)  
      *Vacancy:* **Unexplored / Unattractive.** Mixes memory revision (7:A, 9:B) with a strong denial of determinate at-the-moment content (2:D, 3:B, 5:C, 6:C, 8:C, 10:B, 11:C) and sees sequence only known later (4:C). The only determinate content seems to be isolated, timeless features (10:B, maybe 5:C). This is a radical **Postdictive Interpretationism (7)** combined with almost eliminativism about momentary experience. It's likely unexplored because it struggles to account for the *sense* of temporal flow and presence without *any* determinate temporal content at the time. It's unattractive as it makes "experience" very thin until reconstructed.

  ---

  **Key Nodes**

  *   **Most Diagnostic Node:** **Node 9 (Deferred Narrative - Nature of Later Report).** This node forces the deepest division. Does the later report reveal original content (Momentary Finitism, Phenomenological Authority), reveal memory error (Memory Revisionism), reveal a later-*constituted* experience (Postdictive Interpretationism, Dynamic Indeterminacy), or show inference (a path towards Interpretationism)? It directly challenges the existence or accessibility of a time-T fact. Answering A, B, or C here strongly predicts core commitments to finitism, revisionism, or indeterminacy/postdiction respectively.
  *   **Node Closest to Restating the Question:** **Node 6 (Flash-Lag - Experience at Flash Moment).** This node directly asks for the core disputed fact: At the precise moment T, was there a determinate experience (A or B) or not (C)? It embodies the central tension: is there a fact about the flash's experienced position at T? Answers A/B affirm the demand for a determinate fact at T; answer C rejects that demand as mistaken for cases like this. It maps directly onto the core question: "is there a determinate fact... or is the demand... already the mistake?"
