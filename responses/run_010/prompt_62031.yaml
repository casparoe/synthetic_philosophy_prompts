answer: |-
  ### **Dispositional Dilemmas: The Counterexample Construction Game**  
  A classroom game designed to shatter confidence in the Simple Conditional Analysis (SCA) by having students build physicalized counterexamples. Teams alternate as **Analysts** (crafting SCA-style rules) and the **Workshop** (building objects that break those rules). The game converges on Lewis's "intrinsic fix" patch, reveals its limitations, and primes a debrief on causal bases vs. conditionals.

  ---

  ### **Ruleset**  
  **Objective**: The Workshop builds objects that satisfy one of two goals:  
  - **(a) Disposition Present, Rule Fails**: Object has the disposition (e.g., fragile) but the Analysts' rule says it lacks it.  
  - **(b) Disposition Absent, Rule Passes**: Object lacks the disposition but the rule says it has it.  

  **Teams**:  
  - **Analysts (1 team, 3–4 students)**: Write an explicit if-then rule to sort objects (e.g., "Fragile iff it would shatter if struck").  
  - **Workshop (1 team, 3–4 students)**: Use toolbox devices to build counterexample objects.  
  - **Voters (Remaining students)**: Secretly vote on whether the object "really" has the disposition.  

  **Rounds**:  
  1. **Round 1**: Analysts write initial rule → Workshop builds Object A → Class votes → Analysts apply rule.  
  2. **Round 2**: Analysts revise rule → Workshop builds Object B → Class votes → Analysts apply rule.  
  After each round, score counterexamples.  

  **Toolbox (Devices & Literature Counterparts)**  
  *Each device is printed on an index card. Workshop must use ≥1 device per object.*  
  1. **Freeze-Field Generator (Finkish Disposition Remover)**:  
     - *Effect*: Switches the object’s internal structure to *non-disposed* (e.g., rubber) the instant stimulus occurs. Switches back after.  
     - *Literature*: Finks (Martin). Blocks SCA by making the conditional false while disposition remains.  
  2. **Thaw-Field Generator (Reverse Fink)**:  
     - *Effect*: Switches the object’s internal structure to *disposed* (e.g., glass) the instant stimulus occurs. Switches back after.  
     - *Literature*: Reverse finks. Blocks SCA by making the conditional true while disposition is absent.  
  3. **Null-Shell Packing (Mask)**:  
     - *Effect*: Prevents the stimulus from reaching the object (e.g., absorbs impact, blocks liquid).  
     - *Literature*: Masks (Johnston). Disposition present, but stimulus never triggers manifestation.  
  4. **Quantum Eraser (Antidote)**:  
     - *Effect*: Allows stimulus and manifestation to occur but instantly neutralizes the effect (e.g., shatters then repairs glass).  
     - *Literature*: Antidotes (Bird). Disposition present, but manifestation is hidden.  
  5. **Standard Hammer**: Strikes objects (plain-jane tool).  
  6. **Inertial Dampener**: Shields object from accidental triggers (plain-jane tool).  

  **Workshop Object Submission**:  
  - Describe:  
    - Base material (e.g., "glass vase").  
    - Attached devices (e.g., "with Freeze-Field Generator").  
    - Test outcome (e.g., "when struck, it bends, doesn’t shatter").  
    - Claim: (a) or (b).  

  **Voting & Validation**:  
  1. **Gut Verdict**: After Workshop describes the object (***without revealing devices or claim***), voters answer:  
     - *"Based on this description, does the object have the disposition? [Yes/No]"*  
     - Secret ballot → Majority vote = "truth" (ties invalidate the counterexample).  
  2. **Analysts Apply Rule**: After voting, Analysts state how their rule sorts the object.  
  3. **Validation**: Workshop scores if:  
     - (a) Gut verdict = YES & Rule says NO.  
     - (b) Gut verdict = NO & Rule says YES.  

  **Scoring**:  
  - Workshop: **2 points** per valid counterexample.  
  - Analysts: **1 point** per round if their rule *isn’t* broken.  
  - Bonus: Workshop gets **+1 point** per device used beyond the first (encourages complexity).  

  **Rules Enforcement**:  
  - **No "Lawyering"**: Analysts must use their rule *as written*; no retrofitting after voting.  
  - **No Microstructure Appeals**: Analysts’ rules can *only* use if-then conditionals about test outcomes. If they try to reference composition, say: "Rules must be based on what the object *would do*, not what it’s made of."  
  - **Device Limits**: Workshop may use ≤2 devices per object (prevents overengineering).  

  ---

  ### **Materials**  
  - **Printed Toolbox Cards**: 6 cards (one per device).  
  - **Ballots**: Slips of paper for voting.  
  - **Whiteboard**: For Analysts to write rules.  
  - **Timer**: For strict phase management.  
  - **Prizes**: Symbolic (e.g., "Philosopher’s Stone" paperweight for winners).  

  ---

  ### **Timeline (100 Minutes)**  
  - **0:00–0:10**  
    - Explain rules, assign teams (Analysts, Workshop, Voters).  
    - Announce disposition: **Fragile** (defined as "shatters if struck").  
  - **0:10–0:20**  
    - *Analysts*: Write initial SCA rule (e.g., "Fragile iff it would shatter if struck").  
  - **0:20–0:30**  
    - *Workshop*: Build Object A using toolbox (claim a or b).  
  - **0:30–0:40**  
    - Workshop **presents Object A** (description only).  
    - **Class vote** → Tally gut verdict.  
    - Analysts apply rule → Validate counterexample.  
  - **0:40–0:50**  
    - *Analysts*: Revise rule to block Object A.  
  - **0:50–1:00**  
    - *Workshop*: Build Object B to break revised rule.  
  - **1:00–1:10**  
    - Workshop **presents Object B**.  
    - **Class vote** → Tally.  
    - Analysts apply rule → Validate.  
  - **1:10–1:20**  
    - Tally scores, declare winner.  
  - **1:20–1:40**  
    - **Debrief** (see script below).  

  **Team Adjustments**:  
  - **13 Students**: Analysts (3), Workshop (3), Voters (7).  
  - **15 Students**: Analysts (4), Workshop (4), Voters (7).  

  ---

  ### **Debrief Script**  
  **Beats**:  
  1. **Reveal Toolbox Names**: Show device→literature map:  
     - Freeze-Field = **Fink**  
     - Thaw-Field = **Reverse Fink**  
     - Null-Shell = **Mask**  
     - Quantum Eraser = **Antidote**  
  2. **Analyze Analyst’s Final Rule**:  
     - Ask Analysts: "What clause did you add to block the first counterexample?"  
     - *Expected*: "Keep intrinsic properties fixed during stimulus." (Lewis’s move).  
  3. **Asymmetry Spotlight**:  
     - "Did your fix handle the Freeze-Field (fink)? Probably yes. Did it handle Null-Shell (mask)? Probably no."  
     - Why? Intrinsic fix solves finks but not masks/antidotes (stimulus never occurs or is hidden).  
  4. **The Microstructure Bypass**:  
     - Poll class: "How many wanted to just say ‘It’s fragile if made of glass’?"  
     - Point out: "If you did, you shifted to a **causal basis** analysis (microstructure). But conditionals alone failed."  
  5. **Philosophical Takeaway**:  
     - "The exercise shows SCA’s fragility. Lewis’s fix repairs finks but not masks. Appeals to microstructure work but abandon conditionals. This is why powers are more than ‘if-then’ rules."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Workshop fails to build a valid counterexample.  
     - *Fix*: Provide "emergency counterexample cards" (e.g., pre-built fink/mask examples) for Round 2.  
  2. **Problem**: Gut verdict ties or is unclear.  
     - *Fix*: Invalidate counterexample; Workshop loses points. In debrief, discuss ambiguity (e.g., "Is masked glass ‘fragile’?").  
  3. **Problem**: Analysts write vague rules.  
     - *Fix*: Enforce "if-then" syntax; reject rules with loopholes (e.g., "if struck *under normal conditions*").  
  4. **Problem**: Workshop reveals claim/devices during presentation.  
     - *Fix*: Penalize 1 point; remind them to *only describe behavior*.  
  5. **Problem**: Asymmetry doesn’t emerge (mask doesn’t break revised rule).  
     - *Fix*: In debrief, present a mask case: "Glass with permanent foam. Gut verdict: fragile. Rule with intrinsic fix: ‘If struck with same intrinsics, it shatters’ → shattering requires foam removal, so rule holds. But SCA fails without the fix!"  

  ---

  ### **What the Game Can’t Reproduce**  
  **The Real Problem**: The game assumes we can "peek inside" the object to see devices/base material. But SCA aims to analyze dispositions *without* assuming internal structure. The deeper issue is **ontological**: Are dispositions reducible to conditionals, or must we appeal to intrinsic properties? The game *exposes* this by forcing students to confront devices that alter structure/behavior, but it doesn’t resolve whether intrinsic properties are metaphysically prior.  

  **Worse Worry**: The gut verdict relies on *knowing* internal structure, but in real cases (e.g., science, ethics), we often infer dispositions from behavior alone. The game might reinforce the illusion that internal access is always possible. **Recover**: In debrief, ask: "Could you judge fragility *without* knowing about the freeze-field? If not, conditionals are even weaker than you thought."  

  ---  
  This game achieves your goals: Students lose SCA conviction through hands-on failure, converge on Lewis’s fix, and confront its limits. The toolbox makes counterexamples tangible, and voting prevents retrofitting. Run it as-is, and they’ll leave with a visceral grasp of finks, masks, and the conditional/intrinsic tension.
