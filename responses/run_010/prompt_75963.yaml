  First, I need to unpack the core disagreement. The difference-maker focuses on actual counterfactual differences - did my action change someone's outcome? The marginalist cares about expected harm - even small probabilities matter when scaled. The student provided a scaffolding with parameters g (granularity of harm threshold) and a (supply absorption), plus four village scenarios to test these views.

  For the agreed claims section, I should identify common ground. Both sides likely agree that in V3 (continuous harm), individual acts clearly matter. They probably also agree that in V1 (threshold not crossed), no single act made the difference. The key is phrasing these neutrally while noting where qualifications are needed - like the difference-maker insisting that "no harm occurred" in V1 even if probabilities increased.

  The disagreements table needs careful mapping across the (g,a) space. Where g=0 (continuous), both should agree moral reasons exist regardless of absorption. But at g=1 (discrete threshold), divergence happens - especially when a=1 (full absorption). The marginalist will still see probabilistic reasons while the difference-maker won't. I should explicitly mark which regions show genuine vs verbal disagreements - like whether "harm" requires actualized outcomes or includes risks.

  For cruxes, I'll structure testable predictions. For example: In lab experiments with lumpy thresholds, would people feel blame when not pivotal? The difference-maker predicts no, marginalist yes. Or: If probabilities can't be precisely calculated, does that invalidate expected harm? Difference-maker says yes, marginalist says decision rules can handle imprecision.

  The verbal disputes section should isolate terminology clashes. "Harm" itself is contested - actual vs probabilistic. Also whether moral reasons require counterfactual difference-making. The substantive residue is whether we should care about miniscule risks - which persists even if we redefine terms.

  I notice potential model issues: V2 and V4 might not be distinct if redundancy and timing uncertainty create similar pivotality questions. And g/a may interact - high absorption could make thresholds effectively smoother. I'll flag this upfront and adjust cases to ensure clear differentiation.

  Throughout, I'll maintain neutrality - no favoring either view. The document should expose where disagreements are fundamental versus terminological, and map precisely where each side concedes points based on scenario parameters. The village cases will serve as concrete anchors for abstract disputes.
answer: |-
  Here is the draft joint statement, structured as requested. I've flagged model issues upfront and repaired V4 for clarity. Both parties ("Difference-Maker" DM and "Marginalist" M) can sign this document without endorsing the other's core principle.

  ---

  **Joint Statement: Moral Reasons in Collective Harm Cases**

  **Preamble:** This document outlines areas of agreement and disagreement between two views on whether individual acts in large-scale collective harm scenarios generate act-based moral reasons. It uses a framework with two parameters (**Granularity *g***: 0 = continuous harm, 1 = discrete threshold; **Absorption *a***: 0 = no supply smoothing, 1 = full smoothing) and analyzes four village cases (V1-V4). We agree this framework captures key structural features of collective harm problems (e.g., climate change, factory farming).

  **Model Repair Notice:** V2 (redundant bucket crossing sharp mark) and the original V4 (sticky valve with unknown timing) risked conceptual overlap in pivotality uncertainty. V4 is redefined for distinctness: *"V4: There is a sharp mark (g=1), but the valve mechanism is faulty. It trips with probability P(h) = (Total Buckets - Threshold +1)/1000 when total buckets ≥ Threshold, and P(h)=0 otherwise. Villagers know P(h) increases with overfilling but cannot know if their specific bucket triggered it."* This isolates *mechanism uncertainty* distinct from V2's *redundancy*. We also note *g* and *a* are treated as independent for analysis, though real-world interactions may exist (e.g., high *a* might functionally lower *g*).

  **1. Agreed Claims (With Qualifications Noted)**

      1.1  **In V3 (g=0, continuous harm):** An individual act (adding one bucket) *always* makes the downstream farm slightly wetter/more damaged in the actual sequence. (DM Qualification: "It makes a *measurable physical difference*, though whether this constitutes 'harm' generating a *moral reason* depends on the significance of the change." M signs without qualification).
      1.2  **In V1 (g=1, threshold not crossed):** No individual villager's act of adding a bucket *counterfactually caused* the farm to be flooded, as the flood did not occur. (M Qualification: "While no single act caused the flood, each act increased the objective probability of the flood occurring." DM signs without qualification).
      1.3  **In V2 (g=1, threshold crossed by redundant bucket):** No single villager who added a bucket after the threshold was crossed was *pivotal*; the flood would have occurred even if any one of them had not added their bucket. (M Qualification: "While not pivotal *ex post*, each act performed after the threshold was crossed maintained the harmful state and potentially increased the severity/duration of harm if applicable." DM signs core claim without qualification).
      1.4  **In V4 (g=1, probabilistic triggering):** An individual villager cannot know at the time of acting whether their specific bucket will be the one that triggers the valve. (Both sign without qualification).
      1.5  **DM Principle Core:** DM holds that an act generates an act-based moral reason *only if* it counterfactually makes a difference to the welfare state of some actual person (i.e., the world where the act occurs is relevantly different for that person compared to the world where it does not).
      1.6  **M Principle Core:** M holds that an act generates an act-based moral reason if it raises the expected harm to actual persons, where expected harm is the probability-weighted magnitude of potential harm.
      1.7  **Relevance of Scale:** Both agree that the *number of actors* is a crucial factor in determining the impact (counterfactual or probabilistic) of an individual act within the framework. (DM Qualification: "Scale matters only insofar as it affects the likelihood of an act being difference-making." M Qualification: "Scale directly multiplies the per-act expected harm.").
      1.8  **Role of Knowledge:** Both agree that an agent's knowledge of the parameters (*g*, *a*, total actors, proximity to threshold) is relevant to their moral deliberation. Ignorance may excuse or mitigate blameworthiness, but does not change the objective status of the act's effects.

  **2. Disagreements Table**

  | Issue                                                                 | Difference-Maker's Formulation                                                                 | Marginalist's Formulation                                                                                        | Genuine (G) or Verbal (V)? | Concessions by Region (g,a) (DM: Reason Exists? / M: Reason Absent?) |
  | :-------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :------------------------- | :------------------------------------------------------------------- |
  | **Does a single act generate an act-based moral reason when *g=1*?**  | "Only if the act was pivotal in crossing the threshold or causing a discrete harm."            | "Yes, if the act increased the probability of the discrete harm occurring or increased its expected severity."    | G                          | (1,0): DM: *Only if pivotal* / M: *Yes* <br> (1,1): DM: *No* / M: *Yes* |
  | **Is raising the probability of harm to actual people sufficient for generating an act-based moral reason?** | "No. Probability is not harm. Only actualized differences in welfare constitute 'harm' for generating direct moral reasons via my act." | "Yes. Exposing real people to increased risk of harm is itself a morally relevant effect of my act."              | G (Partially V - see Sec 4) | N/A (Core Principle)                                                 |
  | **Does 'absorption' (*a*) negate moral reasons?**                     | "If *a=1*, my act causes no change in output or immediate physical state, hence cannot be difference-making." | "Even if *a=1*, my act signals demand, influencing long-term production decisions & expected harm. Probability shifts persist." | G                          | (0,1): DM: *Yes (No Diff)* / M: *No (Reason Exists)* <br> (1,1): DM: *No* / M: *Yes* |
  | **Moral Significance of V1 (g=1, no flood)**                          | "No act-based moral reason exists. No one was harmed by any individual act."                   | "A strong act-based moral reason exists. Each act imposed a real, shared risk of catastrophic harm."              | G                          | (1,0) & (1,1): DM: *No* / M: *Yes*                                   |
  | **Moral Status in V2 (g=1, redundant post-threshold)**                | "No act-based moral reason *against adding the bucket* exists post-threshold, as harm is already occurring & my act changes nothing for victims." | "A strong act-based moral reason persists. Adding the bucket sustains the harm, potentially worsens it, & normalizes harmful behavior." | G                          | (1,0) & (1,1): DM: *No (for stopping harm)* / M: *Yes*               |
  | **Moral Status in V4 (g=1, probabilistic trigger)**                   | "No act-based reason exists unless P(pivotal) is near 1. Low, diffuse probabilities don't constitute 'making a difference'." | "A clear act-based reason exists proportional to the expected harm (P(trigger) * Harm). Uncertainty doesn't negate the reason." | G                          | (1,0) & (1,1): DM: *Only if P(piv) high* / M: *Yes*                  |
  | **Is 'expected harm' a real moral quantity?**                         | "No. 'Expected harm' aggregates non-actual outcomes. Only actual differences to real people matter for direct moral reasons generated *by my specific act*." | "Yes. Expected harm quantifies the real increased risk imposed on identifiable people by my act."                 | G (Partially V - see Sec 4) | N/A (Core Principle)                                                 |
  | **Concession Map:**                                                   |                                                                                                |                                                                                                                  |                            | **Region (g,a): DM Concedes Reason? / M Concedes No Reason?**        |
  |                                                                       |                                                                                                |                                                                                                                  |                            | **(0,0): DM: *Yes* / M: *No***                                       |
  |                                                                       |                                                                                                |                                                                                                                  |                            | **(0,1): DM: *No* / M: *No***                                        |
  |                                                                       |                                                                                                |                                                                                                                  |                            | **(1,0): DM: *Only if pivotal* / M: *No***                           |
  |                                                                       |                                                                                                |                                                                                                                  |                            | **(1,1): DM: *No* / M: *No***                                        |

  **3. Cruxes: Key Sub-Questions and Predictions**

      3.1  **Crux: Do people intuitively perceive moral blameworthiness in non-pivotal contributions to threshold harms?**
          *   **Case/Test:** Lab public-goods experiment with lumpy thresholds (*g=1*), varying group size, and clear post-threshold redundancy. Measure self-reported blameworthiness and third-party judgments of contributors, especially non-pivotal ones post-threshold.
          *   **DM Prediction:** Blame judgments will focus overwhelmingly on pivotal actors or be absent entirely for non-pivotal contributors. Contribution rates post-threshold will be high as perceived obligation drops.
          *   **M Prediction:** Significant blame will be assigned to non-pivotal contributors both before and after the threshold is crossed, correlating with their contribution to the risk/sustained harm. Contribution rates post-threshold will be lower than DM predicts due to perceived complicity.
          *   **Settling Power:** Strong results counter to DM's prediction (widespread blame of non-pivotal actors) would challenge DM's claim about intuitive moral reasoning. Strong results counter to M's prediction (no blame for non-pivotal actors) would challenge M's claim about the perceived moral relevance of risk/collective harm.

      3.2  **Crux: Can pivotal probabilities be precisely defined in real cases, and does imprecision undermine the expected harm calculus?**
          *   **Case/Test:** Analysis of real-world collective harm problems (e.g., individual carbon emissions, meat consumption). Can pivotal probabilities be assigned sharp point values, or are they inherently interval-based or highly sensitive to model assumptions?
          *   **DM Claim:** Probabilities in real cases are often intractably vague or model-dependent intervals (e.g., P(pivotal) = [1e-9, 1e-7]). This "pseudo-precision" renders expected harm calculations practically meaningless for grounding specific moral obligations for individual acts. Decision rules requiring sharp probabilities fail.
          *   **M Claim:** While pinpoint precision is often impossible, robust decision rules (e.g., maximize minimum expected utility, precautionary principle under Knightian uncertainty) can still rank acts under imprecision. Refusing to assign *any* expected value under imprecision paralyzes moral decision-making in precisely the cases where guidance is most needed.
          *   **Settling Power:** Demonstrating that pivotal probabilities in paradigmatic cases resist meaningful sharp point estimates *and* that no robust decision rule can generate clear guidance *would* support DM's critique of M's practical applicability. Demonstrating viable robust decision rules *would* support M's claim that imprecision does not negate the existence of reasons.

      3.3  **Crux: Does supply absorption (*a=1*) functionally eliminate the physical trace of an individual act?**
          *   **Case/Test:** Empirical study of supply chains. Does an individual purchase decision (e.g., one burger, one flight) cause an immediate, identifiable change in production output or resource use at the margin, or is it fully buffered by inventory, slack capacity, and aggregate forecasting?
          *   **DM Claim:** In modern economies, *a* is often close to 1 for individual acts. Buffering mechanisms mean my specific purchase rarely causes immediate physical change (production, emissions). Thus, it makes no counterfactual difference.
          *   **M Claim:** Even with buffering, individual acts aggregate into demand signals influencing long-term production planning, investment, and thus *expected* future harm. The probability shift is real even if the physical instantiation is delayed or smoothed.
          *   **Settling Power:** Evidence that individual acts have near-zero measurable impact on *immediate* physical variables (output, emissions) due to buffering would support DM's description of the causal chain. Evidence that individual acts reliably influence *long-term* forecasts and decisions would support M's claim about persistent probabilistic impact.

  **4. Verbal Disputes and Substantive Residue**

      4.1  **The Word "Harm":** A significant component of the disagreement is verbal, concerning the definition of "harm" relevant to generating direct, act-based moral reasons.
          *   **DM:** Restricts "harm" to *actual, counterfactually-determined worsening* of a specific person's state.
          *   **M:** Extends "harm" to include the *imposition of risk* (increased probability of a worsened state) upon specific persons.
          *   **Substantive Residue:** Even if we stipulate definitions (e.g., call DM's harm "Actual Harm" and M's "Risk Imposition"), the core disagreement remains: **Does imposing a tiny, non-pivotal risk of severe harm on identifiable individuals generate a direct moral reason *specific to my act*?** DM says no (only Actual Harm does); M says yes (Risk Imposition does). This is genuine.

      4.2  **The Currency of Moral Reasons:** Linked to the above, there's a verbal aspect regarding the necessary "currency" for an act-based moral reason.
          *   **DM:** Requires a *counterfactual difference* in the actual world sequence for a direct reason.
          *   **M:** Allows the *expected value* (probability-weighted outcome) of an act to generate a direct reason.
          *   **Substantive Residue:** The genuine question is: **Must a morally relevant outcome of my act be something that *actually happened differently* because of it, or can it be a *shift in the likelihood* of outcomes happening?** DM requires the former; M accepts the latter.

      4.3  **"Moral Quantity":** The dispute over whether "expected harm" is a "real moral quantity" is largely verbal, hinging on the definitions above. The substantive residue is the disagreement described in 4.1 and 4.2.

