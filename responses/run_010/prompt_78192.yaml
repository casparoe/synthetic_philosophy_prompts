prompt: |-
  I do contract reference work — discographies, franchise histories, institutional timelines — and for the better part of two decades my job has been to decide, for other people's projects, when one thing stopped being the same thing and something else began. What surprises me is how rarely that decision is made by looking at what actually persisted. When the owner of the Cleveland Browns moved his football operation to Baltimore in 1996, the league's settlement left the name, the colors, the records, and the history in Cleveland with a franchise that was formally deactivated for three seasons, while the relocated operation — the same owner, the same coaches, the same players — was entered in the record books as an expansion club that began play in 1996. Every person went one way and the identity went the other, and the reason was an agreement rather than anything about the world. The arrangement has since been copied in other leagues. The music business supplies a mirror image: an oldies act ends up with no surviving original members performing under the name, while several founding members tour the same repertoire under a different name, and which group is the band is settled, if it is settled at all, by whoever holds the trademark. Partisans of each are equally certain the other is the impostor, and neither certainty has anything to do with who is standing on stage. I once had to draw a timeline for a small daily whose entire staff resigned and started a competing paper across town; the masthead was bought by a chain that filled it with unrelated content, and every reference source still describes the chain's product as the paper founded in the nineteenth century, because that is what ownership of the masthead says.

  I know this neighborhood touches the Ship of Theseus, including the variant in which someone gathers up the discarded planks and reassembles them, which is essentially the rival band. But the classic puzzle asks what continuity does or does not preserve, and what I keep encountering is something narrower and, to my mind, stranger: the question is closed by a document — a registration, a charter, a league settlement, a court's allocation of a mark — and afterward everyone in the record speaks as though a substantive question about persistence had been answered rather than assigned, so that a later reader can't tell that there was ever a decision to make. Nothing in the resulting history marks the spot where the continuity ran out and the paperwork took over.

  So: is there an established concept for this specific move, as distinct from the general puzzle about replacement? I'm not after a label to use at parties; I want the carving — what the phenomenon is, what it isn't, and where its edges run. Please answer as exactly five numbered items, one or two sentences each, with no introduction and no conclusion, in this order: (1) the established concept that comes nearest to what I've described and the precise respect in which the description departs from it; (2) a second near neighbor and its own point of departure; (3) whether anything in the literature names this thing specifically rather than the general territory around it; (4) if not, a term you would coin, with a definition tight enough to exclude ordinary cases where the paperwork and the people happen to point the same way; and (5) one boundary case of your own choosing, stated concretely, with your verdict on which side of the line it falls and why.
reasoning: |-
  Okay, the user works in contract reference work, creating discographies and timelines, and has noticed something intriguing. They deal with deciding when one entity stops and another begins, but often, this decision is based on legal documents rather than actual persistence. For example, the Cleveland Browns moved to Baltimore, but the team's identity stayed in Cleveland due to a league settlement. Similarly, in music, a band's name might be owned by someone with no original members, while the original members tour under a different name. The user mentions a newspaper where the masthead was bought by a chain, making it the "original" paper on record.

  The user is pointing out that in these cases, continuity is determined by paperwork—trademarks, legal agreements—not by what actually persists in reality. They know it's related to the Ship of Theseus paradox but want a more specific concept for this phenomenon where documents override actual persistence. They want a precise term or concept that distinguishes this from the general puzzle of identity over time.

  The user's explicit request is for five numbered items: first, the closest established concept and how it differs; second, another near concept and its difference; third, whether literature names this specifically; fourth, if not, a coined term; fifth, a boundary case with a verdict.

  Now, thinking about established concepts. The Ship of Theseus is the obvious one, but it's broader—it deals with gradual replacement and what preserves identity. The user's cases involve legal intervention, like trademarks or settlements, which isn't part of the original paradox. So that's a departure: the identity is assigned by authority, not debated based on continuity.

  Another concept is legal personality. Corporations or entities have legal identities separate from their components. But in the user's examples, the legal identity is maintained even when all components change, which differs from cases where legal personality is tied to function or structure. Here, it's purely about documentation, like ownership records.

  I need to check if there's a specific term. In philosophy, things like "conventionalism" or "social ontology" touch on this, but no dedicated term for this exact move. Terms like "nominal continuity" might be close, but they're not standard. So, probably nothing specific in literature.

  For coining a term, something like "documentary determination" could work—it emphasizes that persistence is decided by records, not facts. It needs to exclude cases where documents and reality align, focusing on when documents override.

  Boundary case: Imagine a restaurant relocating under the same name due to a lease, but all staff and recipes change. If the trademark stays, it's documentary determination; if not, it might not be. Verdict: It falls under documentary determination because the name persists via legal rights, despite operational discontinuity.

  The user might be frustrated that real persistence is ignored in records. They could want tools to highlight these discontinuities in their work. Deeper need: perhaps to legitimize alternative histories or critique how institutions control narratives through documents.

  Structuring the response: Five items as requested. Keep it concise, no intro or conclusion. Ensure precision in each point.

  Item 1: Ship of Theseus. Departure: Identity is authoritatively assigned via documents, not debated through material continuity.

  Item 2: Legal personality. Departure: Persistence is maintained solely through registration, even with complete operational discontinuity.

  Item 3: No specific term in literature; it's undifferentiated from broader puzzles.

  Item 4: Coined term "documentary determination". Definition: Persistence decided by documentary records overriding material or operational continuity.

  Item 5: Boundary case: Restaurant with new owner/staff but same name via lease. Falls under documentary determination due to trademark persistence.
answer: |-
  (1) The Ship of Theseus paradox addresses identity through material continuity and replacement, but your cases diverge by resolving identity through authoritative documentary assignment (e.g., trademarks, settlements) that deliberately overrides material or operational persistence.  
  (2) Legal personality in corporate law treats entities as continuous via formal registration, yet your examples depart by allowing such continuity despite complete functional or compositional discontinuity (e.g., a newspaper masthead persisting with entirely new staff and content).  
  (3) No established term specifically names this documentary override; literature subsumes it under broader discussions of conventionalism in social ontology or legal fiction, without isolating the mechanism.  
  (4) "Documentary determination": persistence ascribed exclusively through formal records (registrations, settlements), overriding all operational, material, or human continuity that would otherwise challenge it.  
  (5) A university relocates, rebrands, and replaces all faculty, but retains its original charter and accreditation: this falls under documentary determination because continuity is upheld solely by the charter, despite total functional rupture.
