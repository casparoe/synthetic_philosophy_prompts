              - USA: 1789-present (235 years, ongoing)
              - UK: 1689-present (335 years, ongoing) [Glorious Revolution]
              - France: 1958-present (66 years, ongoing) [Fifth Republic]; but we could also consider the Third Republic (1870-1940, 70 years) as ended.
