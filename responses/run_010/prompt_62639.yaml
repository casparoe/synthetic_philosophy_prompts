          - Adjusted wide: 40% * 1.25 = 50%
          - Average: 56.25% -> rounded to 56%.
  - **Output**: The probability that the post-1945 order will still be dominant in 2070 is 56%, with a spread between classes of 10% (narrow:62.5%, wide:50%). We also note the conditional median remaining lifespan from the narrow class: not computed here, but available.

  **Why you might hate this**: 
  - The sample sizes are small, especially for the narrow class (only 4 hegemonic orders). The adjustment is subjective, and the 56% number might be used to justify long-term investments that assume the order will persist. But the true uncertainty is high (the spread between classes is 12.5% after adjustment, but the inherent data sparsity is a bigger issue). Also, the definition of the order's death is debatable.

  ### What the Procedure Cannot Do
  1. **Handle very vague questions**: If the event cannot be defined clearly, the procedure stops early.
  2. **Overcome data limitations**: When historical data is scarce (e.g., for very long-lived regimes or unique cases), the output may be "no number".
  3. **Predict rare events**: Black swans (e.g., nuclear war, climate catastrophe) are not captured in the base rate.
  4. **Adjust for unprecedented factors**: If a modern factor has no historical analog (e.g., AI, climate change), the adjustment is guesswork.
  5. **Replace expert judgment**: The procedure forces transparency but cannot resolve deep uncertainties. The reference class choice remains subjective.
  6. **Failure mode**: The procedure might produce a number when it shouldn't (e.g., when the spread is just below the threshold but the data is poor). The first burn might come from a case where the reference class was defensible but the historical data was not representative of the future (e.g., due to structural breaks).

  **Conclusion**: This procedure provides a structured, auditable way to generate reference class forecasts. It stops when the data is insufficient or the spread is too wide. The output is either a number with a clear uncertainty band or "no number". It forces explicit definitions and documents judgments. However, it cannot eliminate subjectivity and should be complemented by other methods.
answer: |-
  Below is a disciplined, audit-ready procedure for reference class forecasting, designed to address your concerns about subjectivity, length-biased sampling, and reference class arbitrariness. It forces explicit pre-commitments, quantifies uncertainty, and stops when the data can't support an answer. The procedure has **six steps**, with clear "stop" conditions and documentation requirements. Judgment calls are explicitly flagged (🚩).

  ---

  ### **Procedure: Reference Class Forecasting for Institutional Survival**
  **Outputs**: Either (1) a survival probability with uncertainty band, (2) a comparative historical metric, or (3) "No number" with reasons.  
  **Key Safeguards**:  
  - **Pre-commitment** to classes/rules before data collection.  
  - **Two reference classes** (narrow/wide) to test sensitivity.  
  - **Conditional survival analysis** to account for current age.  
  - **Adjustment cap** (±20% absolute) for modern factors.  
  - **Spread threshold** (>25% difference → "No number").  

  ---

  #### **Step 0: Define the Question**  
  **Analyst writes down**:  
  - Exact outcome (e.g., "Collapse of CCP rule in China").  
  - Target year (e.g., 2050).  
  - Metric requested (survival probability, historical comparison, or both).  
  **Sufficiency test**:  
  - If the outcome is ambiguous (e.g., "post-1945 system ending" lacks clear failure condition), **stop → "No number"**. Require partner sign-off on definition.  
  **🚩 Judgment call**: Defining the failure event (e.g., is a civil war required, or does electoral defeat count?).  

  #### **Step 1: Pre-Commit to Reference Classes**  
  **Analyst writes down**:  
  - **Narrow class**: 1-sentence definition + membership test (e.g., "Communist party-states: regimes with a single Marxist-Leninist party controlling military and policy, post-1917").  
  - **Wide class**: 1-sentence definition + membership test (e.g., "All great powers: states with top 3 GDP/share of global power, per Correlates of War Project").  
  - **Start rule**: Objective start date (e.g., "Date party takes power" or "Treaty ratification").  
  - **Death rule**: Objective failure condition (e.g., "Loss of power via revolution, coup, or dissolution").  
  **Sufficiency test**:  
  - Classes must have ≥5 members each. If not, **stop → "No number"**.  
  **🚩 Judgment call**: Choosing classes (e.g., "great powers" vs. "industrialized states" changes outcomes).  

  #### **Step 2: Collect Data & Handle Bias**  
  **Analyst writes down**:  
  - List of all class members, start/end dates, current status.  
  - Sources (e.g., "Center for Systemic Peace polity database").  
  - **Current age** of the subject regime (e.g., CCP in 2024: 75 years).  
  **Bias corrections**:  
  - **Length bias**: Use Kaplan-Meier estimator (below) to account for oversampling of long-lived regimes.  
  - **Left-truncation**: Exclude regimes with missing early-history data.  
  **Sufficiency test**:  
  - If >30% of members have uncertain failure dates, **stop → "No number"**.  

  #### **Step 3: Calculate Base Rates (Conditional Survival)**  
  **Analyst writes down**:  
  - **Kaplan-Meier survival curve** for each class, using:  
    $$S(t) = \prod_{t_i \leq t} \left(1 - \frac{d_i}{n_i}\right)$$  
    where \(d_i\) = failures at time \(t_i\), \(n_i\) = regimes still at risk.  
  - **Conditional survival probability**:  
    $$P(\text{survive to } T \mid \text{survived to } t) = \frac{S(T)}{S(t)}$$  
    (e.g., \(T = 100\) years if current age \(t = 75\) and target is 25 years ahead).  
  **Outputs**:  
  - Median lifespan and survival probability to target year for each class.  
  **Sufficiency test**:  
  - If subject's current age > max observed lifespan in class → **stop → "No number"** (insufficient data).  

  #### **Step 4: Adjust for Modern Factors (Capped)**  
  **Analyst writes down**:  
  - List of modern factors (e.g., nuclear deterrence, digital surveillance) with:  
    - Direction of effect (±).  
    - Adjustment magnitude per factor (max ±0.1 absolute probability per factor).  
    - Historical justification (e.g., "Nuclear states have 0% external conquest rate since 1945: +0.1").  
  - **Total adjustment cap**: Final probability change ≤ ±0.2 absolute (e.g., 60% → max 80% or min 40%).  
  **🚩 Judgment call**: Factor selection/magnitude (cap is arbitrary but necessary for auditability).  

  #### **Step 5: Compare Classes & Output**  
  **Analyst writes down**:  
  - Narrow class probability (\(P_n\)), wide class probability (\(P_w\)).  
  - **Spread**: \(\Delta = |P_n - P_w|\).  
  - **Decision rule**:  
    - If \(\Delta > 0.25\) → **"No number"** (reference class choice dominates result).  
    - If \(\Delta \leq 0.25\) → output \(\text{avg}(P_n, P_w) \pm \frac{\Delta}{2}\) (e.g., \(65\% \pm 7\%\)).  
  - For historical comparisons (no probability): Output percentile ranks (e.g., "US age is 90th percentile vs. great powers").  

  ---

  ### **Example Runs**  
  **Case (a): CCP survival to 2050 (25-year horizon)**  
  - **Step 0**: Outcome = "CCP loses monopoly on power by 2050". Metric = survival probability.  
  - **Step 1**:  
    - Narrow class: "Communist party-states" (start = party takes power, death = party loses power).  
      - Members: USSR (1917–1991), China (1949–), Vietnam (1976–), Cuba (1959–), East Germany (1949–1990).  
    - Wide class: "Modern great powers" (start = top 3 GDP, death = revolution/conquest).  
      - Members: USA (1871–), UK (1815–), France (1815–), Japan (1895–), Germany (1871–1945; 1991–), USSR (1922–1991).  
  - **Step 2**:  
    - Current age (CCP): 75 years (2024–1949).  
    - Data: USSR (74 years), East Germany (41), Vietnam (48), Cuba (65).  
  - **Step 3** (Kaplan-Meier, conditional on 75-year survival):  
    - Narrow: \(P(\text{survive to 100 years}) = 40\%\) (only USSR failed at 74; others censored).  
    - Wide: \(P(\text{survive to 100}) = 55\%\) (e.g., UK/France survived; Germany/USSR failed).  
  - **Step 4**: Adjustment: +0.1 (surveillance tech), +0.1 (no USSR-style economic collapse) → +0.2 total.  
    - Narrow: \(40\% \rightarrow 60\%\), Wide: \(55\% \rightarrow 75\%\).  
  - **Step 5**: \(\Delta = |60\% - 75\%| = 15\% < 25\%\). Output: \(68\% \pm 8\%\).  
  **Audit trail**: Narrow class drove pessimism; adjustment capped at +0.2 despite subjectivity.  

  **Case (b): US historical unusualness (comparison)**  
  - **Step 0**: Outcome = "Current US political system". Metric = percentile rank vs. history.  
  - **Step 1**:  
    - Narrow: "Liberal democracies" (start = universal suffrage, death = democratic breakdown).  
    - Wide: "Great powers" (as above).  
    - Start rule for US: 1789 (Constitution).  
  - **Step 2**: US age = 235 years (2024–1789).  
    - Narrow members: France (1958–, 66 years), Germany (1949–, 75), UK (1918–, 106), India (1947–, 77).  
    - Wide members: UK (1815–, 209), France (1815–, 209), Ottoman (1299–1922, 623), Rome (509 BC–476 AD, 985).  
  - **Step 3**: Percentile of current age:  
    - Narrow: 235 years > all others → 100th percentile.  
    - Wide: 235 years > UK/France but < Rome/Ottoman → 70th percentile.  
  - **Step 5**: \(\Delta = |100\% - 70\%| = 30\% > 25\%\) → **"No number"**.  
  **Why**: Narrow class is too small (only 4 members; UK at 106 years censored). Partner must accept uncertainty or redefine classes.  

  **Case (c): Post-1945 system survival to 2070 (hard stop)**  
  - **Step 0**: Outcome = "US no longer unipolar hegemon AND UN/IMF/WTO replaced". Metric = survival probability.  
  - **Step 1**:  
    - Narrow: "Hegemonic systems" (start = hegemon controls >40% global GDP, death = loss of hegemony).  
      - Members: Pax Britannica (1815–1914, 99 years), Pax Americana (1945–).  
    - Wide: "International orders" (start = treaty, death = great power war/new treaty).  
      - Members: Westphalian (1648–1789, 141), Concert of Europe (1815–1914, 99), Pax Britannica, Pax Americana.  
  - **Step 2**: Current age = 79 years (2024–1945).  
  - **Step 3**: Conditional survival to 124 years (79 + 45):  
    - Narrow: Only Pax Britannica (99 years) → died at 99. \(P(\text{survive to 124}) = 0\%\) (but N=1, unreliable).  
    - Wide: All 3 predecessors failed (max 141 years). \(P(\text{survive to 124}) = 25\%\) (based on K-M).  
  - **Step 4**: Adjustment: +0.2 (nuclear deterrence, globalization).  
    - Narrow: \(0\% \rightarrow 20\%\), Wide: \(25\% \rightarrow 45\%\).  
  - **Step 5**: \(\Delta = |20\% - 45\%| = 25\%\) (threshold hit!). **Output → "No number"**.  
  **Why you’d hate this**: Partner promised a client an answer, but procedure stops due to tiny sample (narrow class) and spread at threshold. Forcing a number would mislead.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Predict unprecedented events**: Black swans (e.g., AI-driven collapse, climate catastrophes) have no reference class.  
  2. **Resolve ontological debates**: If experts dispute what constitutes a "regime" (e.g., is the EU a new order?), the procedure stops.  
  3. **Override garbage inputs**: Poor class definitions (e.g., "democracies vs. autocracies") yield garbage outputs.  
  4. **Eliminate subjectivity**: Pre-commitment exposes biases but doesn’t remove them (🚩 flags everywhere).  
  5. **Handle short-lived regimes**: Left-truncation bias means volatile young regimes (e.g., interwar republics) are undersampled.  

  **Most Likely Failure Mode**: **Spread manipulation**. Analysts may game class definitions to force \(\Delta \leq 25\%\) (e.g., making narrow/wide classes converge). Mitigation: Require peer review of pre-commitments.  

  **Final Advice**: Use this for base rates only. Pair it with scenario analysis for the "why" behind the numbers. Publish "No number" proudly when data fails—it beats lying with precision.
