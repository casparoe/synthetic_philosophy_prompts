prompt: |-
  ok so I just spent two hours arguing with a friend about this and I want a third party in the room, because I couldn't answer him and I have to answer a version of this at work about once a quarter.

  I'm in the scenario/strategy group at a large asset manager. Twelve of us. We feed 30-year capital allocation decisions, and roughly quarterly somebody senior asks us something like: will the current political order in Beijing still be standing in 2050? How unusual is the US right now, historically? Is the post-1945 system ending? Every time, an analyst disappears for a week, reads a pile of history, comes back with a narrative, and then we argue for an hour about whether the narrative is evidence or just vibes with a bibliography. Last quarter a number from one of these went into a client deck and I genuinely cannot reconstruct how we got it.

  What I want is the outside view turned into something we can actually run: reference classes, base rates, survival from the past, the whole Kahneman/Flyvbjerg reference-class-forecasting idea, but as ordered steps that a smart analyst with one working day and no historian on staff can follow, and that leave behind an audit trail a partner can sign off on in ten minutes. Sometimes the output goes in a deck with real money attached, so "we think probably not" isn't going to cut it — but neither is a fake precise number, and I'd rather the procedure tell me to publish nothing than publish a number it can't support.

  Here's the fight I lost, and the procedure has to either handle both of these or say plainly where it concedes:

  1. My friend says the reference class is always chosen after you already know what answer you want. Great powers, personalist regimes, bureaucratic empires, hegemons, party-states — each gives a different duration distribution and nothing in the method tells you which is the honest one. He says the entire exercise is a way of laundering a preference into an average.

  2. He also says the historical sample is not a fair sample twice over. We have good durations for the polities that lasted long enough and kept records long enough to be written about, so the short ones are missing. And if I'm standing in 2025 asking about an order that has already lasted 75 years, the unconditional average lifespan of empires is simply the wrong quantity — I want expected remaining life given the age it's already reached, and I have no clue whether that's larger or smaller. He called it length-biased sampling, something about how if you drop in at a random moment you disproportionately land in the long-lived ones. I nodded like I understood and I didn't.

  Given that, the deliverable needs:

  - the steps in order, what counts as a sufficient answer at each one, what the analyst writes down at each one, and the points where the procedure stops cold with "no number" rather than grinding out a guess.
  - a pre-commitment stage: the reference class written as one sentence plus an explicit membership test plus a start rule and a death rule, all fixed before anybody opens a single case. Because the coding rule does all the work — depending on what you're counting, Rome ends in 476, or in 1453, or arguably never, and that one decision swings the sample mean by centuries. I want the procedure to force that decision into the open and make the analyst defend it, not discover it in a footnote.
  - a requirement to build two classes, one narrow and one wide, and to report the spread between the two results as the answer instead of a point estimate. Tell me how wide the spread can get before the honest output is silence.
  - a rule for how far the base rate may be adjusted on the grounds that modern states have capacities older ones didn't — mass literacy, fiscal extraction, surveillance, nuclear deterrence, medicine. Cap the adjustment, make the cap written-down and checkable, and tell me straight whether the cap is arbitrary.
  - an explicit account of where the procedure hands the question to a human because what's at issue isn't a fact but what we're even asking about.
  - every step that is really a judgment call wearing an arithmetic costume, flagged as such. Don't be gentle about this.

  Then run it, showing the analyst's actual worksheet, on three cases: (a) the political order in China over the next 25 years; (b) the US question, where what the client wants is a comparison to history rather than a probability; and (c) a third case you pick where the procedure produces an output I would hate to send — one where it either forces us to publish a survivial number that makes our flagship 30-year assumption look comfortable when I privately think it isn't, or forces "no number" on the exact question a partner has already promised a client we'd answer. Don't pick a soft one.

  Finally, tell me what this procedure cannot do: the questions it will look like it's answering and isn't, and the failure mode we should expect to get burned by first.
reasoning: |-
  We are designing a procedure for reference class forecasting that addresses the concerns raised. The procedure must be transparent, auditable, and avoid producing fake precision. It will force explicit decisions and stop when necessary.

  ### Key Principles
  1. **Pre-commitment to reference classes and rules**: Define reference class, membership criteria, start and death rules upfront.
  2. **Two reference classes**: One narrow (more similar) and one wide (broader context). Report the spread between their results.
  3. **Conditional survival**: Account for current age (use survival analysis, conditional on having survived to the current age).
  4. **Adjustment for modern factors**: Allow a limited, explicit adjustment for modern capacities, with a cap and clear documentation.
  5. **Audit trail**: Every step documented, including judgments and where the procedure stops.
  6. **Stop conditions**: If the spread between narrow and wide classes is too large, or if the data is insufficient, output "no number".

  ### Steps in Order
  **Step 0: Define the Question and Outcome**
     - **Analyst writes down**: The exact question (e.g., "Will the current political order in Beijing still be standing in 2050?") and the outcome (e.g., "collapse of the current political order").
     - **Sufficient answer**: A clear, unambiguous definition of the event. If the event is not clearly defined (e.g., "the post-1945 system ending" is too vague), stop and return for clarification. The analyst must get partner sign-off on the definition.

  **Step 1: Pre-commit to Reference Classes**
     - **Analyst writes down**:
       - Narrow reference class: One sentence definition, e.g., "Communist party-states that ruled a great power in the 20th century".
       - Wide reference class: One sentence definition, e.g., "All great powers since 1500".
       - **Membership test**: Explicit criteria for inclusion (e.g., for narrow: must be a one-party state, ruling a great power, with the party in control of the military and state apparatus; for wide: a state recognized as a great power by a standard source, e.g., the Correlates of War project).
       - **Start rule**: When the regime is considered to have started (e.g., for China: 1949; for the US: 1789; for the post-1945 system: 1945).
       - **Death rule**: When the regime is considered to have ended (e.g., for a regime: when it loses power via revolution, coup, or dissolution; for a system: when the key institutions and norms are replaced).
     - **Sufficient answer**: The definitions must be specific and testable. The analyst must defend the choices (e.g., why a particular start date? why these criteria?). If a defensible definition cannot be agreed upon in the team (e.g., because the event is too vague), stop and return "no number".

  **Step 2: Collect Data**
     - **Analyst writes down**:
       - List of entities in each reference class, with start and end dates (or current status if still alive). If an entity is still alive, note its current age.
       - Source for each data point (e.g., "Goldstone (1991) for revolutions", "COW for great powers").
     - **Sufficient answer**: A table with at least 10 entities for the wide class and at least 5 for the narrow class (if available). If the sample size is too small (e.g., narrow class has <5), stop and note "insufficient data for narrow class". If the data is unreliable (e.g., no consensus on start/end dates), stop.

  **Step 3: Calculate Base Rates (Conditional Survival)**
     - **Analyst writes down**:
       - For each class, the current age of the subject (e.g., China's regime in 2024 is 75 years old).
       - The Kaplan-Meier estimator or a simple life table to compute:
          - The distribution of lifespans for completed spells (ended regimes).
          - The conditional survival probability: P(T > current_age + t | T > current_age) for t years (e.g., t=25 for 2050).
          - If there are censored observations (ongoing regimes), they are used in the survival analysis.
       - The median remaining lifespan and/or the probability of survival to the target year.
     - **Sufficient answer**: A survival curve for each class and the conditional probability for the target year. If the current age is beyond the last observed failure in the class (e.g., no regime in the class has lived beyond 100 years and the subject is 75), then the tail is estimated from the available data but with a warning.

  **Step 4: Adjustment for Modern Factors**
     - **Analyst writes down**:
       - A list of modern factors that might extend or shorten the lifespan (e.g., nuclear deterrence, surveillance, global institutions) and the direction of their effect.
       - A quantitative adjustment: The base rate is multiplied by an adjustment factor (A). 
          - A = 1 + [sum of small adjustments]. Each factor gets a value between -0.1 and +0.1 per factor, and the total adjustment must be between 0.5 and 2.0 (i.e., at most doubling or halving the base rate).
          - The adjustment per factor must be justified by one historical analogy or study (e.g., "Nuclear weapons have prevented great power wars since 1945; we adjust by +0.05 for nuclear deterrence").
       - **Cap**: The adjustment factor A is capped at 2.0 and floored at 0.5. The cap is arbitrary but set to prevent extreme adjustments without overwhelming evidence. The analyst must document the reasoning and sources for each adjustment.
     - **Sufficient answer**: The adjusted probability for each class. If the adjustment factors are too speculative (e.g., no historical analogy), then skip adjustment and use the base rate.

  **Step 5: Compare Narrow and Wide Classes**
     - **Analyst writes down**:
       - The conditional survival probability (adjusted if applicable) from the narrow class (P_narrow) and the wide class (P_wide).
       - The spread: absolute difference |P_narrow - P_wide|.
       - **Stop condition**: If the spread > 0.3 (30 percentage points), then output "no number" because the reference class choice is too influential. Alternatively, if the two classes give very different pictures (e.g., one predicts survival with 90% and the other 40%), then the uncertainty is too high to report a number.
       - If the spread <= 0.3, then report the average of P_narrow and P_wide as the point estimate and the spread as the uncertainty band (e.g., 70% ± 15%).

  **Step 6: Output**
     - The final output is either:
          - A probability (point estimate with spread) and the conditional remaining life expectancy (median), OR
          - "No number" with reasons (e.g., "insufficient data", "spread too wide", "question too vague").
     - The analyst writes a summary including the reference classes, key assumptions, adjustments, and a clear statement of the output.

  ### Judgment Flags
  At each step, the analyst must flag judgments:
  - Step 0: Defining the event (judgment: what counts as "standing"?).
  - Step 1: Choosing reference classes and rules (judgment: what is "similar"?).
  - Step 2: Data collection (judgment: which sources? how to handle disputed cases?).
  - Step 3: Survival analysis (judgment: handling of censored data, choice of estimator).
  - Step 4: Adjustments (judgment: which factors, how much to adjust?).
  - Step 5: Spread threshold (judgment: why 0.3?).

  ### Running the Examples

  #### Example (a): Political order in China over the next 25 years (to 2050)
