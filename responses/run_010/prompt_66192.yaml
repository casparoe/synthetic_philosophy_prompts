  The user has very specific constraints: I need to create a short, everyday conversation (around 80 words) where someone says something true but implicates something false they believe to be false. It must arise naturally from conversational maxims without any irony, sarcasm, or tone-of-voice tricks. The setting should be ordinary - no courtrooms or reference letters. The hearer must have no independent evidence, so the false impression comes entirely from the utterance. The speaker must have had the option to lie at greater cost, showing they chose this path deliberately.

