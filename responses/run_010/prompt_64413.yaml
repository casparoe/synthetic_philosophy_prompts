  **My next reply:**  
  You frame belonging as a gift Jante bestows, but isn't it conditional on self-effacement? My Minnesota town "belonged" you only if you didn't outshine – it was a cage lined with cotton wool. And this friction you describe: when my daughter's peers resent her "elevation," isn't that just envy rationalized as community care? Jante seems to mistake uniformity for cohesion. True community should withstand a rising plank without splintering. If the floor can't bear unevenness, was it ever truly solid?
