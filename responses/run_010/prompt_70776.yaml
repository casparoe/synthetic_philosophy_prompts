prompt: |-
  So — second-year metaphysics, 22 students, and next Tuesday I've got 75 minutes on causation by omission: whether an absence can be a cause. They've already had counterfactuals and they've had the regularity/INUS material, and every one of them can recite "but for the gardener's failure to water, the plant would have lived." That's precisely the trouble. They think they already know this topic and they don't, and I need a plan for running the session, not a transcript of a lecture I could give in my sleep.

  The order first. What goes on the board before what, with a line of justification for each piece about why it can't be moved earlier. My instinct is to open on a case where everyone, me included, is happy to say the omission caused the harm, and only later reveal that the very same machinery licenses verdicts we can't live with. But tell me if that's backwards — specifically whether they need to hit the profligacy problem *before* they'll give a damn about the difference between an omission and a mere absence, because I genuinely can't tell whether that distinction lands for them as a solution or as a dodge.

  Then the carrying case. I'm banning the plant, the hiker and the poisoned canteen, and anything with Suzy and Billy in it, since half the room met those in intro and will coast on recognition. Two candidates of my own, pick one or throw them both out and build me something better:

  - Case A: the lifeguard on duty leaves the platform for the bathroom; a weak swimmer goes under at the deep end and drowns. The relief guard is in the locker room. Seperately, a retired guard three towns over is also not at that pool.
  - Case B: a maintenance tech signs off a scaffold inspection; one clip that's supposed to be on the frame was never fitted, and a painter falls. Here the absence is an object rather than an action, and there are a hundred identical scaffolds in the yard where the clip is present.

  Whichever case you land on, it has to do four things: exactly one agent whose omission is a plausible cause and at least one whose isn't, so the class feels the line instead of being told about it; a baseline that isn't smuggled in by the way I've rigged the setup; a harm the students already think somebody is to blame for, so nobody can slip out through "well, nobody's responsible anyway"; and it has to survive being re-described positively — he was in the bathroom, he was doing paperwork — without the class concluding that the wording is doing all the work. Tell me which of those four the case buys you cheap and which one it strains, because I'd rather know before Tuesday.

  Misconception map, with timings. The ones I'm braced for: "the counterfactual account already settles this, obviously"; "so everyone who didn't water your plants caused them to die" — they'll say that as a joke and mean it as a refutation; "an omission is just an event under a negative description, so it's all phrasing"; the opposite overcorrection, "then nothing is ever caused by an omission, it's just talk"; and the flat conflation of failing to prevent with causing. There's also one kid who's read a paper arguing omissions are never causes at all and wants to make that the entire class. Tell me where in the sequence I can park him without either swatting him down or letting him win the room by minute twelve. For each misconception: the minute it gets headed off, and whether the fix is a distinction, a case, or an honest admission that the question is open.

  One exit question, answerable in a paragraph, that would tell me they got the problem rather than the vocabulary — plus what a bad-but-passing answer looks like, since I'm going to read twenty-two of them.

  And what I should refuse to cover at this level, and announce that I'm refusing: contrastive accounts, the metaphysics of absences as entities, thier status in criminal law, whatever else you'd cut. If something on that pile actually has to come in for the session to hang together, say which and defend it. One whiteboard, no slides, and I'd rather spend the last ten minutes being straight about where the literature is stuck than pretend we resolved it.
reasoning: |-
  Okay, let's tackle this professor's query. They teach a second-year metaphysics class on causation by omission. The students are overconfident because they know the classic "gardener's failure" example but don't grasp the deeper issues. The professor needs a session plan that challenges their assumptions without rehashing basics.

  First, the opening case is crucial. The professor wants one where an omission clearly causes harm but later reveals counterintuitive implications. I need to decide whether to start with profligacy (too many causes) first. Profligacy might be better upfront because when students realize "every non-waterer caused the plant's death," it shocks them into seeing the problem. That creates urgency for distinguishing omissions from mere absences.

  The professor banned common examples like plants or poisoned canteens. Looking at their Case A (lifeguard) and Case B (scaffold clip). Case A has multiple absent people - the on-duty lifeguard, relief guard, retired guard. Students will intuitively blame the on-duty lifeguard but not the others. Case B's missing clip is an object absence, which might complicate things since the debate often focuses on actions. Case A seems stronger because it has clear agents with duties. It naturally provides: one plausible agent (on-duty lifeguard), implausible ones (retired guard), clear harm (drowning), and blame exists. The positive redescription test works too - "he was in the bathroom" doesn't negate causation, showing wording isn't everything. Case A strains baseline smuggling slightly since duty feels inherent, but we can address that by emphasizing the relief guard's absence later.

  For the board sequence: Start with profligacy to create tension. Write "Counterfactual test → multiple 'causes'" showing every non-lifeguard "caused" drowning. Then ask "Why do we blame only some?" introducing norm/duty as a possible solution but immediately challenge it with the relief guard example. This order forces them to confront why their intuition rejects profligacy before offering distinctions.

  Misconceptions: When "every non-waterer caused it" comes up (minute 15), use profligacy to show the problem isn't solved. For "it's just phrasing," deploy the positive redescription test (minute 30). The "omissions aren't real causes" student gets parked early (minute 5) with "That's one view; let's test it against cases," returning to them during the solution discussion.

  Exit question: "Why isn't the retired lifeguard's absence a cause, but the on-duty one is?" Bad answers focus only on duty. Good answers mention problem of profligacy and needing more than counterfactuals.

  Cuts: Avoid contrastive accounts, metaphysics of absences, criminal law. Only duty is needed to make the distinction work. Whiteboard-only keeps focus on arguments. End by acknowledging unresolved debates to model philosophical honesty.

  This plan balances challenge with clarity, using their overconfidence against them while leaving key questions open.
answer: |-
  Here’s a battle-tested plan designed to shatter complacency and force engagement with the *problem*, not the platitudes. It prioritizes dissonance, targeted misconceptions, and controlled chaos. **Total time: 75 mins.**

  ---

  ### **I. The Opening Gambit: Profligacy First (0-15 mins)**
  *   **Why Start Here?** You suspect they need to *feel* the absurdity before caring about distinctions. You're right. Starting with an "easy" omission case lets them nod along. Profligacy is the grenade that makes the distinction *necessary*, not academic.
  *   **Board Step 1 (Min 0): The Uncontroversial Baseline?**  
      *   **Case:** Use **Case A (Lifeguard)**. Write:  
          *"Lifeguard on duty (LG1) leaves platform for bathroom. Weak swimmer drowns in deep end. Relief guard (LG2) in locker room. Retired guard (LG3) 3 towns away."*  
      *   **Question:** "Who *caused* the drowning?"  
      *   **Student Response:** Expect immediate consensus: LG1's omission (leaving post) caused it. LG2 & LG3 irrelevant. *Don't challenge yet.*  
      *   **Board Note:** "Intuitive Verdict: LG1's omission caused death. LG2/LG3 absences did not."

  *   **Board Step 2 (Min 7): Applying the Counterfactual Sledgehammer**  
      *   **Question:** "Apply the counterfactual test rigorously. BUT FOR LG2 not being on the platform, would the swimmer have drowned? BUT FOR LG3 not being there?"  
      *   **Logic:** If LG2 *had* been on the platform (instead of locker room), they *would* have seen & rescued. Same (arguably) for LG3 *if* they'd magically been there. ∴ BUT FOR LG2's absence, death wouldn't have occurred. Ditto LG3.  
      *   **Board Note:** Add:  
          *"CF Test Implies: BUT FOR LG1's absence → Death? YES.  
          BUT FOR LG2's absence → Death? YES.  
          BUT FOR LG3's absence → Death? YES."*  
      *   **Crucial Question:** "So, did LG2 and LG3 *also* cause the death? Does *everyone* who *could* have been there but wasn't cause it?"  
      *   **Goal:** Induce discomfort. Let the "joke" ("So everyone who didn't water your plants...") happen organically *here*. It’s not a refutation; it's the **profligacy problem** laid bare. They *feel* this verdict is absurd.

  *   **Why Order Matters:** You CANNOT introduce distinctions (duty/norm) BEFORE profligacy. Profligacy is the *engine* that makes the distinction compelling. Starting with "easy" omission + distinction feels like a solution in search of a problem. Profligacy *is* the problem.

  ---

  ### **II. Case A Assessment: What It Does (and Doesn't) Buy You Cheap**
  *   **✓ Cheap:** Plausible cause (LG1) vs. implausible causes (LG2, LG3). Students *feel* the difference viscerally. Harm with blame (LG1 is clearly blameworthy) is strong baseline.
  *   **✓ Cheap:** Survives positive redescription. "LG1 was in the bathroom" doesn't negate causation intuition. The *context* (duty, expectation) carries the weight.
  *   **⦿ Strains:** Baseline smuggling. The "duty" feels inherent to the setup. **Mitigation:** Explicitly note: "Notice we all instantly appealed to LG1's *role*, *duty*, or *expectation* to draw the line. Why is *that* relevant to *causation*? Is that part of the counterfactual? Or something else?" This sets up the distinction as a *response* to profligacy, not a given.
  *   **⦿ Strains (Slightly):** "Mere absence" vs. omission. LG2 (relief guard in locker room) is the **critical test case**. Is LG2's absence a "mere absence" or an omission? It's ambiguous! This is GOOD – it forces the distinction debate. LG3 is clearly "mere absence."

  ---

  ### **III. Forging the Distinction: Omission vs. Mere Absence (15-35 mins)**
  *   **Board Step 3 (Min 15): The Problem Statement**  
      *   **Board Note:** "PROFLIGACY PROBLEM: CF test alone makes *too many* absences causes. We reject this intuitively (LG2/LG3 ≠ causes). WHY?"
  *   **Question:** "What's the difference between LG1's absence and LG3's absence? Why does LG1's *lack of action* feel like a cause, but LG3's lack of action doesn't?"  
      *   **Student Responses:** Expect: Duty, Responsibility, Expectation, Role, Norm, Capability. *Write these down.*
  *   **Introduce the Distinction (Min 25):**  
      *   **Board Note:** "Proposed Distinction:  
          **OMISSION**: Absence *of an expected/required action* by an *agent in a relevant position*. (LG1)  
          **MERE ABSENCE**: Absence lacking norm/expectation/role. (LG3)  
          **PUZZLE CASE**: LG2? (Relief guard in locker room - expected? required? positioned?)"
  *   **Press on LG2 (Min 30):** "Is LG2's absence an omission? Did *they* cause the death? Why/why not?" *Force debate.* Key: Does the relief guard have a *duty to be on the platform right now*? Or just a duty to be *available*? This exposes the potential fuzziness/norm-dependence of the distinction. **This is where the "it's just phrasing" misconception dies.** "LG2 was doing paperwork" doesn't resolve it – the question is whether they *should* have been on the platform. The wording *reflects* the norm, it doesn't create it ex nihilo.
  *   **Addressing "Just an event under negative description":** "If omissions are just negatively described events, describe LG1's 'event' positively that night." ("He sat on the toilet," "He walked to the bathroom.") Ask: "Does *that event* (sitting/walking) cause the drowning? No. We only get causation when we describe it *as* the absence of guarding. The *negative description is essential* to the causal claim. It's not epiphenomenal."

  ---

  ### **IV. Misconception Map & Takedowns (Integrated Timings)**
  *   **"CF account already settles this" (Min 0-7):** Profligacy **immediately** blows this up. The CF test *creates* the problem it can't solve alone. (Fix: **Case** - Profligacy in Lifeguard example).
  *   **"So everyone who didn't water..." (Min 10-15):** Let it happen! **Embrace it** as the profligacy problem. "Exactly! That's the absurdity the CF test leads to. Do we accept that? If not, what's missing?" (Fix: **Distinction** prompted by problem).
  *   **"Omission = Negative Description of Event" (Min 30):** As above. Positive redescription fails to capture the cause. "Sitting on the toilet" didn't kill the swimmer; "Not guarding" did. (Fix: **Case + Distinction** - Lifeguard redescription).
  *   **"Then nothing is caused by omission / It's just talk" (Min 35-40):** Point back to LG1. "Do you really think LG1's leaving post had *nothing* to do with the death? Is blame *only* about 'allowing'? What's the practical difference between causing and allowing here?" Connect to their blame intuition. (Fix: **Case + Honest Admission** - Distinction tries to preserve real causal role for omissions like LG1's while avoiding profligacy; it's messy but necessary).
  *   **Conflation of Failing to Prevent with Causing (Ongoing):** Constantly reframe: "Is failing to prevent X *the same as* causing X? Or is it one *way* something can *be* a cause (via omission)?" Use LG3: LG3 failed to prevent, but we balk at saying they *caused* it. Why? (Distinction: Lack of norm/position).
  *   **The "Omissions Aren't Causes" Kid (Min 5 & Min 50):**  
      *   **Min 5:** Park them. "That's a serious position [Name]. We'll get to views like that later. First, let's see *why* people think omissions *can* be causes and what problems that creates." (Shows respect, delays derailment).  
      *   **Min 50:** Bring them back. "Ok [Name], lay out the core argument that omissions aren't causes. How does it handle LG1? What does it say about blame?" *Use it to transition to the literature's stuckness.* Avoid letting them "win"; frame it as one viable but challenging response to the problems we've seen.

  ---

  ### **V. The Exit Question & Bad/Good Answers**
  *   **Question:** "In the lifeguard case, why does the counterfactual dependence of the drowning on the relief guard's (LG2) absence *not* automatically make that absence a cause, whereas we readily accept the on-duty guard's (LG1) absence as a cause? What problem does this illustrate?"
  *   **Bad-but-Passing Answer (C-):** Focuses *only* on duty/responsibility ("LG1 had a duty, LG2 didn't") without mentioning profligacy or the insufficiency of the counterfactual test. May imply the distinction is simple. *Shows vocabulary, not problem grasp.*
  *   **Good Answer (B+):** Identifies the **profligacy problem** ("The CF test alone makes too many absences causes, like LG2's and even LG3's, which seems wrong"). Explains that the distinction (duty/expectation/role) is proposed to *limit* what counts as a causally relevant omission (like LG1's) and exclude mere absences (like LG3's), but notes LG2 is a **hard case** showing the distinction might be fuzzy or normative. *Shows they see the problem driving the need for the distinction.*

  ---

  ### **VI. What to REFUSE to Cover (Announce Early & Reiterate)**
  *   **Cut:** Metaphysics of absences as entities, Contrastive accounts (X rather than Y), Criminal law standards (actus reus, duty to act), Detailed taxonomy of "prevention" vs. "causation".
  *   **Why?** These are deep diversions. The core metaphysical problem (profligacy + the role of norms in causal selection) can be grasped without them. Introducing absences-as-entities derails into abstract ontology. Contrastivism adds another layer of complexity obscuring the core CF issue. Law imports external frameworks.
  *   **The One Necessary Element: Norms/Duty.** You **must** allow discussion of duty/role/expectation/norm. It's not a legal import; it's the intuitive basis students (and philosophers like Schaffer, McGrath) use to draw the omission/mere absence line *within* the causal discussion. Frame it as: "How do we *select* which absences are causally relevant from the ocean of counterfactual dependencies?" Norms provide a selection criterion. Acknowledge it's philosophically loaded ("Is causation normative?") but necessary for the session.

  ---

  ### **VII. Structure & Whiteboard Flow**
  ```
  | Min  | Board Section                          | Activity                                 | Key Questions/Moves                                 |
  |------|----------------------------------------|------------------------------------------|-----------------------------------------------------|
  | 0-7  | CASE: Lifeguard Setup + Intuitive Verdict | Present Case A, Poll for LG1 cause      | "Who caused it? Why not LG2/LG3?"                   |
  | 7-15 | CF TEST -> LG1, LG2, LG3 Dependence     | Apply CF rigorously                     | "BUT FOR LG2? LG3? Profligacy Problem! Absurd?"     |
  |15-25| PROFLIGACY PROBLEM                     | Student ideas for difference (LG1 vs LG3)| "What distinguishes LG1 from LG3?" (List: Duty, etc)|
  |25-35| DISTINCTION: Omission (Norm/Role) vs Mere Absence | Define, Introduce LG2 as Puzzle        | "Is LG2 an omission? Why/why not?" (Debate norms)  |
  |35-45| ADDRESS MISCONCEPTIONS                 | Redescription, "Just negative events?" | "Describe LG1 positively. Does *that* cause death?"|
  |45-60| DEEPEN: Fuzzy Cases, Norm Dependence   | Discuss LG2 ambiguity, Role of norms   | "Is causation normative here? Is this a dodge?"    |
  |60-70| LITERATURE STUCKNESS                   | Summarize key problems, Parked Student View | "Profligacy, Fuzzy Lines, Normativity. No consensus."|
  |70-75| EXIT QUESTION                          | Assign, Conclude                        |                                                    |
  ```

  ---

  ### **Key Rationale**
  *   **Profligacy First:** Creates the necessary tension and makes the distinction *earn its keep*. Starting with the "easy" case + distinction feels preachy; profligacy makes it urgent.
  *   **LG2 is the Star:** The relief guard isn't a flaw; it's the perfect catalyst. It forces engagement with the fuzziness of the norm-based distinction. Is their absence "merely absent" or an "omission"? It depends on the precise scope of their duty! This exposes the messiness.
  *   **Mistake Parking:** Parking the "no omissions" view early avoids derailment while validating the student. Bringing it back late contextualizes it as *one* response to the problems raised, without letting it dominate.
  *   **Honesty over Resolution:** Spending the last 10 mins explicitly listing where things are stuck (Profligacy demands a fix, Fixes (like norms) seem ad hoc/fuzzy, Metaphysical status unresolved) is pedagogically valuable. It shows the *live* philosophical problem.

  This plan weaponizes their overconfidence. They walk in thinking "but-for failure" is the answer. They leave knowing it's the catalyst for a deep, unresolved problem. Good luck!
