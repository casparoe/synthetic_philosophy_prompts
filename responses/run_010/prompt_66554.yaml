prompt: |-
  I run user research at a mid-size consumer app, and since the new privacy rules landed every design change — defaults, consent screens, pricing tiers, notification cadence — gets argued about in a weekly review with legal sitting in. It always collapses into the same fight: someone says "users have revealed they don't care about X, look at the acceptance rate," someone else says "that's not a preference, that's a dark pattern," and I'm the one who puts my name on the research note that's supposed to settle it. Got badly burned on one of these last quarter.

  Can you build me a reusable decision procedure, grounded in what revealed-preference theory actually commits you to, that takes a set of observed choices and answers "does this license a claim about what these people value?" Steps in order, what counts as a sufficient answer at each one, and where it just terminates in "you can't say that." It has to be runnable by a PM with no economics in about 15 minutes. Things it needs to genuinely handle: whether "preference" here is just a relabeling of the choice, or a claim about a state of theirs that could have come out differently; what has to hold about the choice situation for the inference to go through at all (defaults, framing, what else was on the menu, whether opting out cost anything, whether they knew what they were accepting); whether there's any consistency check we can honestly run on logs to separate pattern from noise; and where "they chose it" comes apart from "it's good for them," since half these fights are secretly about the second thing. Flag which steps are judgment wearing a procedure costume.

  Then run it on three live ones:
  1. 92% accept full data-sharing consent on first open — single "Agree" button, the alternatives behind a "More options" link.
  2. Free-tier users who sit through ads still don't upgrade after we dropped the ad-free tier below the price they themselves named in a survey.
  3. We A/B'd two versions of a streak feature, the more aggressive one retained better, and the team now wants to call that evidence users prefer it.

  At least one of these comes out badly for us, I know. Say which, don't soften it, and say what would have to change in the design or the data for it to come out the other way. Finish with a short list of what the procedure can never deliver, however clean the data gets.
reasoning: |-
  We are building a decision procedure grounded in revealed preference theory to evaluate whether observed choices (like acceptance rates, upgrade decisions, etc.) can be interpreted as evidence of user preferences. The procedure must account for the conditions under which choices are made and distinguish between genuine preferences and choices driven by the design (dark patterns).

  Key concepts from revealed preference theory:
  - Revealed preference theory states that if a consumer chooses bundle A over bundle B, then we can infer that the consumer prefers A to B, provided the choice is made in a context that allows for a meaningful comparison and without coercion or manipulation.
  - The theory requires that choices are made from feasible sets (all options are available and known) and that the choice is the result of rational decision-making (though we might relax this to "consistent" decision-making).

  However, in practice, we must consider:
  1. **The choice set**: What options were available? Were they clearly presented?
  2. **The default**: Defaults can heavily influence choices (status quo bias).
  3. **Information**: Did the user have full information about the consequences of their choice?
  4. **Costs of opting out**: If opting out is difficult or costly, the choice may not reflect preference.
  5. **Framing and presentation**: How the options are framed can affect choices (e.g., positive vs. negative framing).
  6. **Consistency**: If the same user makes consistent choices in different contexts, it's stronger evidence.

  We also need to separate:
  - "Preference" as a stable internal state vs. a momentary choice.
  - Whether the choice is "good for them" (a normative claim) vs. what they chose (positive claim).

  The procedure will have the following steps:

  **Step 1: Define the Claim**
  - What specific preference claim is being made? (e.g., "Users prefer sharing their data.")
  - The claim must be about a user's internal state (a valuation) that could, in principle, have been different.

  **Step 2: Map the Choice to the Claim**
  - How does the observed choice relate to the claim? Is the choice a direct expression of the claimed preference?
  - If the claim is about a preference for A over B, then the choice must be between A and B (or sets that include them) and the user must have chosen A when B was available.

  **Step 3: Assess the Choice Context**
  Check the following conditions (all must pass for the choice to be informative about preference):
     a. **Feasibility**: Were all relevant options available and feasible? (e.g., if the claim is about A vs B, both must have been available and known to the user)
     b. **Information**: Did the user have sufficient information to understand the consequences of each option? (e.g., if the consent screen did not clearly explain data sharing, then information is insufficient)
     c. **Ease of Choice**: Were the options equally easy to choose? (e.g., if one option is the default and the other requires multiple steps, then the choice is biased by the design)
     d. **No Coercion or Manipulation**: Was the choice free of coercion (e.g., threats) and undue manipulation (e.g., deceptive design)? (Note: This is a judgment call, but look for dark patterns such as misleading wording, hidden alternatives, or emotional pressure.)

  **Step 4: Check for Consistency (if possible)**
  - If we have data on the same users making multiple related choices, do they show consistency? (e.g., if a user opts in to data sharing, then later opts out when it becomes easier, that might indicate the initial choice was not a true preference)
  - If the choice is a one-time event, we skip this step.

  **Step 5: Separate Preference from Welfare**
  - Even if we can infer a preference, does that mean the choice is good for the user? (Revealed preference does not commit to welfare judgments.) We must explicitly note that this step is about preference, not welfare.

  **Step 6: Termination Conditions**
  - If any condition in Step 3 fails, we terminate with: "You cannot say that this choice reveals a preference because [reason]."
  - If Step 4 shows inconsistency, we terminate with: "The choices are inconsistent, so we cannot infer a stable preference."
  - Otherwise, we can say: "The observed choice is consistent with the claim that users prefer [A] over [B]." But note: we cannot prove the preference, only that the choice is not inconsistent with the claim.

  **Judgment Steps**: Steps 3c (ease of choice) and 3d (coercion/manipulation) involve judgment. We must be explicit about the criteria and document the reasoning.

  Now, let's run the three examples:

  **Example 1: 92% accept full data-sharing consent on first open — single "Agree" button, the alternatives behind a "More options" link.**

  - Step 1: Claim: "Users prefer sharing their data."
  - Step 2: The choice is between sharing and not sharing. However, the design makes sharing the default and hides alternatives. The choice is not directly between two equally accessible options.
  - Step 3:
     a. Feasibility: Alternatives are available but hidden (behind a link). Passes technically but not in spirit? 
     b. Information: Assuming the consent screen explains data sharing, but if the alternatives are hidden, the user might not know they have options. So information might be incomplete.
     c. Ease of Choice: The "Agree" button is one click, but to choose otherwise requires multiple steps (click "More options", then choose). Fails: not equally easy.
     d. No Coercion/Manipulation: Hiding alternatives is a dark pattern (manipulation). Fails.
  - Termination: Fails Step 3c and 3d. We cannot say this reveals a preference for data sharing.

  To come out differently: If the consent screen presented all options equally (e.g., two buttons: "Agree to all", "Customize", and "Reject all" with equal prominence and one-click each) and the acceptance rate was high, then we could infer preference.

  **Example 2: Free-tier users who sit through ads still don't upgrade after we dropped the ad-free tier below the price they themselves named in a survey.**

  - Step 1: Claim: "Free-tier users prefer the free tier with ads over the ad-free tier at the price they stated in the survey."
  - Step 2: The choice is between continuing with the free tier (with ads) and upgrading to the ad-free tier at a lower price than they stated in the survey. The choice is direct: they are choosing the free tier.
  - Step 3:
     a. Feasibility: Both options are available and known? We assume the users are aware of the new lower price? (If not, then fails.) We must check if the users were notified of the price drop. If they were not, then feasibility fails because they didn't know the option was available at that price. But let's assume they were notified.
     b. Information: They know the consequences (ads vs no ads, and the price). Passes.
     c. Ease of Choice: Upgrading requires an action (paying) whereas continuing is passive. This is a status quo bias. The choice to not upgrade is easier than upgrading. Fails: because it's easier to do nothing.
     d. No Coercion/Manipulation: We don't have evidence of coercion, but the ease of the status quo is a form of manipulation by design? (Not typically considered coercion, but the design makes inaction the default.) This is borderline. We might pass on 3d but fail on 3c.
  - Step 4: Consistency? They stated in a survey they would pay a certain price, but now they don't. This is inconsistent. We must consider: surveys are hypothetical, and real choices involve real money. So we cannot expect perfect consistency. But we have a direct inconsistency between stated and revealed. This weakens the claim.
  - Step 5: Even if we infer they prefer the free tier, that doesn't mean it's good for them (they might be better off without ads and with more time).

  Termination: Fails Step 3c (ease of choice) and Step 4 (inconsistency). We cannot say that they prefer the free tier. It might be that they do, but the design (status quo bias) and the inconsistency with the survey weaken the inference.

  To come out differently: If we made the upgrade the default (e.g., a trial that automatically upgrades unless they cancel) and they still downgrade, then we could infer they prefer the free tier. Also, if we see consistent choices over time (e.g., they repeatedly choose not to upgrade even when reminded) then it becomes stronger.

  **Example 3: We A/B'd two versions of a streak feature, the more aggressive one retained better, and the team now wants to call that evidence users prefer it.**

  - Step 1: Claim: "Users prefer the more aggressive streak feature."
  - Step 2: The choice is not direct. We are not observing a choice between the two streak features. Instead, we are observing retention (which is a choice to continue using the app). The claim is that the streak feature caused the retention, and that the retention reflects a preference for that feature.
  - Step 3: 
     a. Feasibility: Both versions were available to different groups? Yes, in the A/B test. But note: the user did not choose which version to use; they were assigned. So the choice we observe is not about the streak feature per se, but about continuing to use the app.
     b. Information: The users were using the feature, so they experienced it. Passes.
     c. Ease of Choice: The choice to retain is the same in both groups? Yes, the design of the streak feature might make it harder or easier to leave, but that's part of what we are testing. We are comparing two designs. However, the more aggressive streak feature might use dark patterns (e.g., making it hard to break the streak) which could be coercive. We need to check the design.
     d. No Coercion/Manipulation: If the aggressive streak feature uses manipulative tactics (e.g., excessive notifications, fear of loss, making it very hard to break the streak without negative consequences) then it fails. But if it's just more engaging without being manipulative, it passes.

  But note: the claim is about preference for the feature, but we are not observing a choice of the feature. We are observing retention. So:

  - Step 2 re-examined: The claim that users prefer the aggressive streak feature is being inferred from retention. However, retention might be driven by addiction, coercion, or other factors, not by a genuine preference.

  - Step 4: We cannot check consistency for the same user because they only experienced one version. But we can look at whether the same users, when given a choice, would choose the aggressive version? We don't have that data.

  Termination: The main issue is that we are not observing a choice between the two streak features. We are observing an outcome (retention) that might be caused by the feature. This is not a direct revealed preference for the feature. It might be that the aggressive feature is more effective at retaining users, but that doesn't necessarily mean they prefer it. They might be retained because of addiction or because they feel trapped.

  To come out differently: If we had a test where users could choose between the two streak features (e.g., in an A/B test with an option to switch) and we saw that the aggressive one was chosen more often, then we could infer preference.

  **Summary of which one comes out badly:**
  - Example 1: Bad (cannot infer preference due to dark pattern)
  - Example 2: Bad (cannot infer preference due to status quo bias and inconsistency with survey)
  - Example 3: Bad (retention is not a direct choice for the feature, and the aggressive version might be manipulative)

  But note: in Example 3, if the aggressive streak feature is not manipulative (e.g., it just has a more engaging design without coercive elements) and we can show that the higher retention is due to increased satisfaction (e.g., through surveys or other measures), then we might be able to make a weaker claim. However, the procedure would still not allow a direct revealed preference inference because we are not observing a choice of the feature.

  **What the procedure can never deliver:**
  1. **Proof of preference**: Revealed preference can only show consistency with a preference, not prove it.
  2. **Welfare judgments**: It cannot tell us what is good for the user.
  3. **Stability of preferences**: It cannot guarantee that preferences are stable over time or contexts.
  4. **Causality without control**: Without a controlled experiment (like A/B testing) that isolates the choice, we cannot infer causality.
  5. **Understanding why**: It does not reveal the reasons behind the preference.
  6. **Non-choice data**: It cannot use data that isn't about choices (e.g., survey responses about hypotheticals) to infer preferences, except as a consistency check.
answer: |-
  Below is a reusable decision procedure grounded in revealed preference theory, designed to evaluate whether observed user choices support claims about user preferences. It addresses your core requirements:  
  - **Practicality**: Runnable by a PM in 15 mins, no economics background needed.  
  - **Key issues handled**: Whether "preference" is more than just a relabeling of choice; necessary conditions for inference (defaults, framing, menu, costs, knowledge); consistency checks; and separation of "chose it" vs. "good for them."  
  - **Transparency**: Flags steps where judgment is disguised as procedure.  

  ---

  ### **Revealed Preference Decision Procedure**  
  *Use this for any claim like "Users prefer X" based on observed choices.*  

  #### **Step 1: Define the Claim**  
  - **Task**: State the specific preference claim (e.g., "Users *value* privacy over convenience").  
  - **Sufficient Answer**: A claim about a user’s **internal state** (e.g., "value," "prefer," "prioritize") that *could have been different* under the same conditions.  
  - **Terminate If**: The claim is just a relabeling of the choice (e.g., "92% chose it, so they prefer it"). This is circular.  
  - **Key Judgment**: Is the claim about a *mental state* or just an *action*? If the latter, stop.  

  #### **Step 2: Map Choice to Preference**  
  - **Task**: Identify if the choice **directly tests** the claimed preference.  
  - **Sufficient Answer**: The choice must involve a **trade-off** between the claimed preference and something else (e.g., time, money, effort). If no trade-off exists, the choice doesn’t reveal valuation.  
  - **Terminate If**:  
    - The choice lacks alternatives (e.g., a single button with no opt-out).  
    - The choice isn’t actionable (e.g., a survey response with no real stakes).  
  - **Key Judgment**: Is the trade-off meaningful? (e.g., "Agreeing to data sharing saves 2 minutes" vs. "No cost to refusing").  

  #### **Step 3: Audit the Choice Context**  
  *All conditions below must pass. If any fail, the choice is uninformative about preference.*  
  - **a. Defaults & Framing**:  
    - **Check**: Was there a neutral default (e.g., no pre-ticked boxes)? Were options framed neutrally (e.g., "Share data" vs. "Protect privacy" isn’t neutral)?  
    - **Terminate If**: Defaults/framing skew toward one option (e.g., "Agree" is prominent; alternatives are hidden).  
  - **b. Menu Transparency**:  
    - **Check**: Were all options visible and understandable without extra steps? Did users know consequences?  
    - **Terminate If**: Key options were buried (e.g., behind "More options"), or consequences were unclear.  
  - **c. Cost of Opting Out**:  
    - **Check**: Was opting out/alternative just as easy as opting in?  
    - **Terminate If**: Opting out required >1 extra step, time, or cognitive effort (e.g., navigating menus).  
  - **d. Information Symmetry**:  
    - **Check**: Did users have the same information you have? (e.g., if pricing changed, did they know?).  
    - **Terminate If**: Information was hidden, ambiguous, or assumed.  
  - **Key Judgment**: All checks here are **judgment disguised as procedure**—document assumptions.  

  #### **Step 4: Consistency Check**  
  - **Task**: Look for evidence that choices align across contexts or time.  
  - **Sufficient Answer**:  
    - **Pass**: Choices are consistent (e.g., users who accept defaults also opt-in when defaults change).  
    - **Fail**: Choices conflict (e.g., users say they value privacy in surveys but accept tracking when it’s the default).  
  - **Terminate If**: Inconsistencies exist with no confounding factors (e.g., new information). If inconsistent, you can’t infer a *stable* preference.  
  - **Tool**: Use logs to compare:  
    - Stated vs. revealed choices (e.g., survey vs. behavior).  
    - Choices under similar conditions (e.g., acceptance rates with/without defaults).  

  #### **Step 5: Separate Preference from Welfare**  
  - **Task**: Explicitly decouple "they chose it" from "it’s good for them."  
  - **Sufficient Answer**: State: "This suggests users *prefer* X under these conditions, but we cannot conclude X *improves their well-being*."  
  - **Terminate If**: The argument conflates preference and welfare (e.g., "They chose it, so it’s good"). Revealed preference theory **does not support welfare claims**.  
  - **Key Judgment**: Welfare requires ethics/norms—this is **always judgment-based**.  

  #### **Step 6: Final Decision**  
  - **License a Claim?**  
    - ✅ **Yes**: If all steps pass → "Observed choices are consistent with users valuing X."  
    - ❌ **No**: If any step terminates → "Choices do not support claims about preference; context likely drove behavior."  

  ---

  ### **Apply to Your Cases**  
  Ran in <15 mins each. Assumes PM has access to basic logs/survey data.  

  #### **Case 1: 92% accept data-sharing consent (single "Agree" button, alternatives behind "More options")**  
  - **Step 1**: Claim: "Users *value convenience over privacy*." Valid claim about internal state.  
  - **Step 2**: Choice involves trade-off (privacy vs. ease), but alternatives not equally accessible.  
  - **Step 3**:  
    - a. **Defaults/Framing**: "Agree" is default; alternatives hidden → **Fail**.  
    - b. **Menu Transparency**: Options behind link → **Fail**.  
    - c. **Opt-Out Cost**: Extra steps to refuse → **Fail**.  
    - d. **Information**: Assume users knew consequences → Pass.  
  - **Termination**: Fails Step 3 (a/b/c). **Verdict: ❌ Cannot claim users prefer data sharing.**  
  - **To Fix**: Show equal-weight buttons ("Agree," "Reject All," "Customize") on same screen. If acceptance stays high, it might pass.  

  #### **Case 2: Free-tier users don’t upgrade even at their survey-stated price**  
  - **Step 1**: Claim: "Users *value ad-free experience below price $X*." Valid.  
  - **Step 2**: Trade-off exists (money vs. time/ads). Directly tests preference.  
  - **Step 3**:  
    - a. **Defaults/Framing**: Status quo (free tier) is default → **Fail** (default effect).  
    - b. **Menu Transparency**: Upgrade option visible? Assume yes → Pass.  
    - c. **Opt-Out Cost**: Doing nothing (staying free) is easier than paying → **Fail**.  
    - d. **Information**: Did users know price dropped? If not → **Fail**; if yes → Pass.  
  - **Step 4**: **Inconsistent** with survey (stated $X but won’t pay <$X).  
  - **Termination**: Fails Step 3 (a/c) and Step 4. **Verdict: ❌ Cannot claim users value ad-free at $X.**  
  - **To Fix**: Remove status quo bias (e.g., temporary forced upgrade trial). If users downgrade, it passes.  

  #### **Case 3: Aggressive streak feature retains better in A/B test → "Users prefer it"**  
  - **Step 1**: Claim: "Users *prefer aggressive streaks*." Valid.  
  - **Step 2**: Retention isn’t a direct choice about streaks; it’s a proxy. No trade-off tested.  
  - **Step 3**:  
    - a. **Defaults/Framing**: Users assigned; no active choice → **Fail**.  
    - b. **Menu Transparency**: Features experienced, but no *choice* → **Fail**.  
    - c. **Opt-Out Cost**: If streaks make quitting harder (e.g., loss aversion), it’s coercive → **Fail** if aggressive version uses pressure.  
  - **Step 4**: No user-level choice data to compare → Inconclusive.  
  - **Termination**: Fails Step 2 and Step 3 (a/b). **Verdict: ❌ Cannot claim preference; retention ≠ preference.**  
  - **To Fix**: Test with optional streak settings (e.g., "Switch to gentle mode"). If users keep aggressive, it passes.  

  **Which came out badly?** All three fail, but **Case 3 is most egregious**—retention metrics alone never reveal preference.  

  ---

  ### **What This Procedure Can Never Deliver**  
  1. **Welfare judgments**: Never proves something is "good for users," even with perfect data.  
  2. **Causality without trade-offs**: Choices without alternatives (e.g., one-button consent) can’t reveal preferences.  
  3. **Stated preference validity**: Survey responses (e.g., "I’d pay $X") are not revealed preferences.  
  4. **Universal preferences**: Only reveals preferences *under specific conditions*—change the context, and inferences break.  
  5. **Why users chose**: Revealed preference shows "what," not "why" (e.g., fear, habit, or true valuation).  

  **Final Note**: This procedure forces transparency. When Steps 3 or 5 fail (as in your cases), it exposes where "preference" claims are masking design influence or ethics debates—which is where research and legal should focus.
