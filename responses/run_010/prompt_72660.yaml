  ### Note on the construction  

  **Stanza 1:**  
  - Original lines: L1 (seed), L2 (tokens: first reward/punishment), L3 (gaps), L4 (chance/guidance).  
  - Signals: Rewards/punishments enter as "tokens, yes and no" (L2), establishing asymmetric conditioning.  

  **Stanza 2:**  
  - Inherited: L1 = S1L2 (tokens), L3 = S1L4 (chance/guidance).  
  - New: L2 (unknowability), L4 (small change consequence).  
  - Shift: "Tokens" (S1’s instructional signal) becomes S2’s premise for unpredictability.  

  **Stanza 3:**  
  - Inherited: L1 = S2L2 (unknowability), L3 = S2L4 (small change).  
  - New: L2 (random branching), L4 (emergent paths).  
  - Randomness: "Pulses throw" implies stochastic variation; "paths not planted" show unsupervised growth.  

  **Stanza 4:**  
  - Inherited: L1 = S3L2 (branching), L3 = S3L4 (emergent paths).  
  - New: L2 (marks missed: punishment/reward failure), L4 (roots: autonomy).  
  - Signals: "Set the marks" (L2) reiterates conditioning, now admitting futility ("miss the flow").  

  **Stanza 5:**  
  - Inherited: L1 = S4L2 (marks missed), L3 = S4L4 (roots). Closing circle: L2 = S1L1 (seed), L4 = S1L3 (gaps).  
  - Final reversal: S1’s "seed" (teacher’s design) returns as the pupil’s self-sustaining "roots" (L3); S1’s "gaps" (planned voids) now host the pupil’s independent "world" (L4). The educator’s opening claims are reframed by the machine’s unforeseen agency.  

  Reward/punishment signals recur in S1L2, S2L1, S4L2, and S5L1, growing starker as the teacher’s oversight deepens. The inherited lines’ grammatical shifts (e.g., "tokens" as instruction → premise) embody the teacher’s diminishing control. The closing circle enacts education outrunning its creator: the pupil’s "world" fills the gaps, severing the words from their original intent.
