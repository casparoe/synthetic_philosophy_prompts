  External: 100 runs. 50 A, 50 B. In each A run, worker 1 exists. In each B run, worker 1 exists. So when you are worker 1, 50 times in A, 50 times in B. Probability 50% it's A.

  So self-sampling says 99% A, SIA says 50% A, difference is huge. Factor of almost 2 in odds, but probabilities 99% vs 50%, ratio about 1.98, close enough to 2. But user wants factor of three. To get that, make B have 1000 workers.

  SS: P(A|w1) = [1 * 0.5] / [0.5 + 0.5/1000] = 0.5 / (0.5 + 0.0005) = 0.5/0.5005 ≈ 99.95%

  SIA: still 50%

  Ratio of probabilities 99.95/50 ≈ 2, but the odds ratio is [0.9995/0.0005] vs [0.5/0.5] = 1999 vs 1, which is way more than 3. But the user might mean the probability ratio. He says "off by at least a factor of three", probably meaning one is three times the other. 99.95% is about twice 50%, not three times. To get SIA 50% and SS say 99%, which is twice, but to get SS to say 75%, then SIA 50%, ratio 1.5. Need SS to give higher.

  Set Hypothesis A: 2 workers. Hypothesis B: 10 workers. Prior 50-50.

  SS: you are worker 2. P(you w2|A)=1/2, P(you w2|B)=1/10. Posterior P(A|w2) = [ (1/2)(0.5) ] / [ (1/2)(0.5) + (1/10)(0.5) ] = (0.25) / (0.25 + 0.05) = 0.25/0.30 ≈ 83.33%

  SIA: prior P(A) ∝ 2, P(B)∝10, so P(A)=2/12=1/6, P(B)=10/12=5/6. P(w2|A)=1/2, P(w2|B)=1/10. Posterior P(A|w2) = [ (1/6)(1/2) ] / [ (1/6)(1/2) + (5/6)(1/10) ] = (1/12) / (1/12 + 5/60) = (1/12) / (1/12 + 1/12) = (1/12)/(2/12) = 1/2 = 50%

