  Self-sampling assumes you're a random sample from all observers that exist. So if you're worker 3, in Hypothesis A (3 workers), you have a 1/3 chance of being worker 3. In Hypothesis B (12 workers), you have a 1/12 chance. But since the boss chooses the hypothesis with equal probability, the posterior odds should be (1/3) / (1/12) = 4, meaning Hypothesis A is 4 times more likely. That gives P(A|you're worker 3) = 4/5 = 80%.

