  Since both hypotheses always have a worker 3, in 50 runs of A, worker 3 is there; in 50 runs of B, worker 3 is there. So when worker 3 is observing, it's equally likely to be A or B. So the true probability is 50%. That matches self-indication.

  Self-sampling gave 80%, but the actual frequency is 50%, so self-sampling is wrong in this case.

  The user's brother-in-law might object that the external observer is counting wrong. He might say that we should count runs, not instances of worker 3. But each run has a worker 3, so in 100 runs, worker 3 appears 100 times—50 in A, 50 in B. So the probability from inside when you are worker 3 is 50% for A.

  The key difference is that self-sampling doesn't account for the greater chance of being in a world with more observers. In this setup, both worlds exist equally often, but B has more observers, so you're more likely to be in B if you're a random observer. But when we condition on being worker 3 specifically, it balances out.

  To make the disagreement larger, I could adjust the numbers. For example, if Hypothesis A has only 1 worker, and Hypothesis B has 10 workers. Then self-sampling: if you're worker 1, P(you're worker 1|A) = 1, P(you're worker 1|B) = 1/10. Prior equal, so posterior P(A|worker 1) = [0.5 * 1] / [0.5*1 + 0.5*0.1] = 0.5 / (0.5 + 0.05) = 0.5/0.55 ≈ 90.9%.

  Self-indication: prior P(A) proportional to 1, P(B) to 10, so P(A) prior = 1/11, P(B)=10/11. Likelihood P(worker 1|A)=1, P(worker 1|B)=1/10. Posterior P(A|worker 1) = [ (1/11)*1 ] / [ (1/11)*1 + (10/11)*(1/10) ] = (1/11) / (1/11 + 1/11) = (1/11)/(2/11) = 1/2 = 50%.

  External: 100 runs, 50 A, 50 B. When A, worker 1 exists. When B, worker 1 exists. So in 50 cases, worker 1 is in A, in 50 in B. So 50% chance it's A when you're worker 1. Again, SIA wins.

  But the user wants a factor of three difference. In the first scenario, SS gave 80%, SIA 50%, ratio 80/50=1.6, not three. In the second, 90.9% vs 50%, ratio 1.818, still not three. Need to make it more extreme.

