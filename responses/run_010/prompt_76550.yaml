  So SIA gives correct 50%, SS gives incorrect 99%.

  Now, brother-in-law might say the external observer is counting wrong. He might argue that we should consider each run equally, and in runs where Alpha is chosen, guard #1 exists, in Bravo, guard #1 exists, so no issue. But from inside, when you are guard #1, you exist, but in the set of all possible guard-slots, most are in Bravo. SS doesn't account for that.

  The key feature that causes disagreement is that in SS, the prior is uniform over hypotheses, while in SIA, prior is proportional to number of observers. When we condition on indexical information (being a specific observer), it leads to different updates.

  To collapse to agreement, if we make the number of observers the same in both hypotheses. Suppose both have 10 workers. Then SS: P(you worker 3|A)=1/10, same for B. Posterior P(A|worker 3)=0.5. SIA: prior P(A)∝10, P(B)∝10, so still 0.5, same. Or if we don't condition on being a specific worker, but just that you exist. But in the original, both hypotheses have worker 1 existing.

