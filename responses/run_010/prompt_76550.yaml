  SS says 83.33%, which is about 5/6, SIA 50%. Ratio 83.33/50 = 1.666, not three. To get ratio three, need SS probability three times SIA, but SIA is 50%, so SS would need 150%, impossible. Or perhaps the odds. The odds for A under SS are 83.33:16.67 ≈ 5:1, under SIA 50:50=1:1, so odds ratio 5 vs 1, factor five. That satisfies "factor of three" if we mean odds ratio.

  User says "off by at least a factor of three", and earlier mentioned "1.05 versus 1.0", so probably probability ratio, but 1.6 vs 1 is less than 3. But in the 1 vs 100 case, SS 99% vs SIA 50%, ratio 1.98, which is close to 2. Perhaps he'll accept that, or I can make B larger.

  To get a bigger probability difference, have Hypothesis A with very few workers, B with many. But in the posterior, SS approaches 100%, SIA stays 50%. The ratio approaches 2. The probability can't be more than 100%. So the maximum ratio is 2. But if we look at the probability of B, SS gives 1% in 1 vs 100, SIA gives 50%, so ratio 50, which is way over three. But user might be referring to the probability for the less likely hypothesis or something. He says "the two rules' odds should be off by at least a factor of three", probably meaning the probability they assign to the same hypothesis differs by a factor of three. In 1 vs 100, for hypothesis B, SS says about 1%, SIA says 50%, so 50/1=50, factor 50. That works. Similarly, for A, SS 99%, SIA 50%, ratio 1.98. But factor three is satisfied for B's probability.

  So I'll use A:1 worker, B:100 workers. 

  Now, the scenario. Instead of a warehouse, maybe a research study or something, but warehouse is fine. Let's say the cold-storage warehouse has two possible security protocols. Protocol Alpha: only one guard on duty. Protocol Bravo: 100 guards on duty, but each in a separate, identical security booth with the same monitors. The boss flips a fair coin to decide which protocol to use tonight. As a guard, you sit in your booth and see the same things either way. You know your employee number is #1. (In Protocol Alpha, you're the only guard, so you're #1. In Bravo, there are 100 guards, and you happen to be #1.) From your perspective, you're sitting in booth 1, watching monitors. You don't know if there are other booths occupied or not.

  Now, you want to know: what's the probability that Protocol Alpha is in use, given that you are guard #1?

  Self-sampling: Prior P(Alpha) = 0.5, P(Bravo) = 0.5. Likelihood: P(you are #1 | Alpha) = 1. P(you are #1 | Bravo) = 1/100. So posterior P(Alpha | you are #1) = [1 * 0.5] / [1*0.5 + (1/100)*0.5] = 0.5 / (0.5 + 0.005) = 0.5 / 0.505 ≈ 0.9901 or 99.01%

