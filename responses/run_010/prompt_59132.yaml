  ### **Leading Candidate: The Fine-Tuning-Free Factorization Criterion**
  A phenomenon is **nonlocal** if it cannot be reproduced by any causal model satisfying the following conditions:
  1. **Factorization of Outcomes**: For any hidden variable \(\lambda\), the outcomes \(a\) and \(b\) must be statistically independent given the local setting and \(\lambda\). Formally:  
     \[
     P(a, b \mid x, y, \lambda) = P(a \mid x, \lambda) \cdot P(b \mid y, \lambda)
     \]
     for all values of \(a\), \(b\), \(x\), \(y\), and \(\lambda\). This ensures no direct or indirect dependence between outcomes across stations.

  2. **No Fine-Tuning**: The distribution of \(\lambda\) and the outcome functions must be **context-independent**. Specifically:
     - \(P(a \mid x, \lambda)\), \(P(b \mid y, \lambda)\), and \(P(\lambda \mid x, y)\) are fixed functions (not tailored to the specific experimental setup).
     - These functions must remain invariant under changes to the set of possible settings, their probabilities, or the experimental context (e.g., they cannot "adjust" to reproduce the statistics only for a specific configuration).

  **What this means**:
  - **Nonlocality** is defined as the *inexplicability* of correlations under any model meeting these conditions.
  - **Locality** requires that correlations are screened off by \(\lambda\) without ad hoc adjustments. \(\lambda\) may depend on \(x\) and \(y\) (e.g., in retrocausal models), but only if this dependence is **lawful** (described by context-invariant functions), not fine-tuned.
  - **Fine-tuning** is quantified as context-dependence: if changing the settings (e.g., adding new options) forces you to redefine \(P(\lambda \mid x, y)\) or the outcome functions, the model is fine-tuned.
  - This distinguishes "genuine explanations" (laws) from "conspiracies" (arbitrary, setup-specific dependencies).
