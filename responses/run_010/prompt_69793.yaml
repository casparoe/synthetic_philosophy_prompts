answer: |-
  This phenomenon you're describing is perceptive and unsettling. While it borrows Stoic *language* ("not up to me"), it **distorts the core Stoic principle of pursuing preferred indifferents with effort but without attachment to outcomes**. There isn't a single, universally established term for this specific tactic, but we can define and name it clearly:

  ### The Established Name: Preemptive Value Attenuation (PVA)

  **Definition:** Preemptive Value Attenuation (PVA) is the *deliberate, conscious act of downgrading the perceived importance or desirability of a desired outcome or goal before its realization is determined, specifically as a prophylactic measure against potential future emotional distress associated with failure or loss.*

  ### Key Characteristics & Boundaries

  1.  **Intent (Motive):** The *primary* driver is emotional self-protection/insurance against anticipated pain. It's fear-driven avoidance of vulnerability. This is distinct from:
      *   **Stoic Acceptance:** The Stoic aims for *ataraxia* (freedom from disturbance) by focusing effort on the controllable (actions, judgments) while accepting the uncontrollable (external results) as indifferent to virtue. They *pursue* the promotion/race *vigorously*, judging it "preferred," but understand its attainment doesn't define their worth or happiness. Their calm comes from correct judgment and effort, not devaluing the goal itself beforehand.
      *   **Adaptive Preferences (Sour Grapes):** This occurs *after* a loss or denial ("The grapes I can't reach are sour anyway"). PVA happens *before* the outcome is known. It's proactive souring, not reactive. Your friend devalued the promotion *before* the decision.
      *   **Self-Handicapping:** This involves creating obstacles *before* an event to have an excuse for failure ("I partied all night before the exam, so failing wasn't my *real* ability"). PVA involves cognitive restructuring (devaluing), not behavioral sabotage. Your runner friend devalued the race times, he didn't (necessarily) skip training to justify a bad performance.

  2.  **Timing:** PVA occurs during the *period of uncertainty*, *before* the outcome is resolved. It's anticipatory. This is crucial. Ordinary acceptance or resignation happens *after* the outcome is known and unavoidable. Stoic detachment regarding outcomes is a *constant attitude*, not a last-minute tactical retreat.

  3.  **Consequence:**
      *   **Internal:** Achieves its aim: reduced distress upon failure/loss. Reports of calmness/happiness are genuine in the immediate sense of avoiding pain.
      *   **External/Existential:** Creates the perception of "shrinking" or diminished vitality. Why?
          *   **Inauthenticity:** The devaluation is recognized (by self or others) as forced, strategic, and incongruent with prior effort/desire.
          *   **Loss of Meaning:** Deliberately draining value from pursuits that *were* meaningful undermines a source of vitality and engagement. Passion and deep care are suppressed.
          *   **Erosion of Agency:** While framed as controlling reactions, it subtly avoids the vulnerability inherent in *truly* wanting something. It's control via disengagement.
          *   **Social Perception:** Others sense the dissonance between the effort expended and the sudden lack of care. It feels like emotional dishonesty or a withdrawal of spirit.

  ### Where PVA Stops and Acceptance Begins

  The line is drawn by **motive, cognitive process, and impact on pursuit**:

  *   **PVA:** Motive = Fear of pain. Process = Actively downgrading the *value/importance* of the goal itself ("This promotion doesn't *really* matter to me anymore"). Impact = Often leads to reduced effort or abandonment *before* the outcome ("Why try so hard for something I've decided isn't important?"). The goal is rendered psychologically "safe" by making it worthless.
  *   **Genuine Acceptance/Detachment:** Motive = Pursuit of virtue/eudaimonia (flourishing) through right action. Process = Maintaining the goal's *preferred* status while understanding its attainment is not *essential* for well-being or self-worth. Impact = Continued full effort on the controllable aspects (preparing, performing well). The value of the pursuit remains, but happiness isn't contingent on the specific external outcome. The goal remains valuable, but not devastating to lose.

  ### Why This Isn't Stoicism (Though It Wears the Cloak)

  Stoicism encourages **courageous engagement with preferred indifferents.** Epictetus didn't say "Stop wanting the promotion"; he said, "Make the best use of what is in your power, and take the rest as it happens." The goal remains preferred; the attachment to *needing* it for happiness is released. PVA bypasses this by trying to make the preferred indifferent genuinely *indifferent* (or even dispreferred) *before* fate decides. It sacrifices the value of the pursuit itself to avoid the sting of potential loss.

  ### In Summary

  **Preemptive Value Attenuation (PVA)** is the strategic, anticipatory devaluation of a desired outcome solely as emotional insurance against potential failure or loss. It differs from:

  *   **Adaptive Preferences:** PVA is proactive; sour grapes are reactive.
  *   **Self-Handicapping:** PVA is cognitive devaluation; self-handicapping is behavioral sabotage.
  *   **Stoic Acceptance/Detachment:** PVA abandons the value of the pursuit to avoid pain; Stoicism maintains the value of the pursuit while detaching happiness from the uncontrollable outcome.

  The unsettling feeling you and others have stems from witnessing the intentional shrinking of desire and spirit – the sacrifice of passionate engagement on the altar of pain avoidance. It achieves calmness at the cost of depth and authenticity. It's emotional safety through existential downsizing.
