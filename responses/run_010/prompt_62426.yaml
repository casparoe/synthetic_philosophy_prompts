  We'll coin: "Persistent Prediction Vindication" (PPV)

  Step 4: Definition
  A prediction that remains unchanged and is consistently wrong for an extended period, but then the predicted event occurs. The predictor is then credited as having been correct, despite the long delay and without having altered the prediction.

  Step 5: Necessary conditions
  What must hold for a case to be PPV?
