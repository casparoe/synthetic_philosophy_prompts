  - *The Structure of Scientific Revolutions* (Kuhn): On paradigm shifts, though not timing.  
  - *Thinking, Fast and Slow* (Kahneman): On hindsight bias in crediting predictors.  
  - Merton’s work on self-fulfilling prophecies (for contrast with your cases).  

