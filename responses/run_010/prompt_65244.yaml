prompt: |-
  Build me a case of underdetermination that's meant to be cured by indirect evidence — the sort of thing you reach for when you want to insist that two rivals are never really empirically equivalent, only equivalent-so-far.

  The spec: two theories, T1 and T2, about some concrete invented phenomenon — your pick, something with lots of measurements attached to it, like why a certain alloy goes brittle below a threshold temperature. They have to agree on every possible observation in that domain: same predictions, same curve fits, everything. Then you bring in evidence from a completely separate line of investigation that lets you tell them apart after all.

  Constraints:
  - write both theories out explicitly, and say what the total evidence in the first domain consists in — no hand-waving;
  - the discrimination has to run through a third claim that's independently well supported by its own evidence, not through one rival just being ad hoc or internally inconsistent;
  - if T1 and T2 end up disagreeing about anything observable in the first domain, the case fails;
  - keep the scenario itself to about two paragraphs.

  Then run the check: show the reasoning from the outside evidence to T1 over T2, and name which feature of the case is doing the work. And one last thing — suppose I grant the whole case. Explain why someone who was worried about underdetermination in general shouldn't be impressed, i.e. what's left standing once you've got this. That's really what the exercise is for: I want to see whether indirect evidence dissolves the problem or just relocates it.
reasoning: |-
  We are to create a case of underdetermination that is resolved by indirect evidence. The scenario must involve two theories T1 and T2 that are empirically equivalent in a given domain (say, the brittleness of an alloy below a threshold temperature) but are later distinguished by evidence from a separate domain. The total evidence in the first domain must be specified, and the discrimination must come via a third, independently supported claim. The two theories must agree on all observations in the first domain. We then show the reasoning from the outside evidence to prefer T1 over T2, and finally explain why a general worry about underdetermination is not entirely dispelled.

  Scenario:

  Domain: The phenomenon is the brittleness of a specific alloy, Zeta-phase, below 200K. The total evidence in this domain consists of:
  - Measurements of the critical stress required to fracture the alloy at temperatures from 100K to 300K, showing a sharp drop below 200K.
  - Electron microscopy images of the alloy's microstructure at various temperatures, showing the formation of micro-cracks below 200K.
  - X-ray diffraction data at different temperatures, showing a phase change at 200K.

  T1: The brittleness is caused by a phase transition that creates a new crystal structure (alpha) which is inherently brittle. This phase transition is triggered by the temperature falling below 200K, and the new structure has a higher density of defects that act as crack initiation sites.

  T2: The brittleness is caused by the suppression of dislocation movement below 200K. In T2, the same phase (beta) persists, but the mobility of dislocations (which allow plastic deformation) is frozen out below 200K, leading to brittle fracture without a phase change.

  Both T1 and T2 fit the data equally well: they predict the same critical stress curve, the same micro-crack patterns in the images (though interpreted differently: T1 says they are due to the brittle alpha phase, T2 says they are due to the lack of dislocation movement in the beta phase), and the same X-ray diffraction pattern (T1 attributes the pattern to the alpha phase, T2 to a distortion in the beta phase). Thus, they are empirically equivalent in the domain of alloy brittleness.

  Now, we introduce evidence from a separate domain: the study of thermal expansion. Independent experiments on pure elements that are constituents of the alloy (say, metal A and metal B) show that when they form a solid solution, their thermal expansion coefficients change in a way that is consistent with the formation of a new phase at low temperatures only if the phase transition occurs. Specifically, we have:

  - Extensive measurements of the thermal expansion of pure A, pure B, and several alloys of A and B (including the Zeta-phase) over a wide temperature range (50K to 400K). The thermal expansion coefficient of Zeta-phase shows an anomaly (a sudden change) at 200K.

  - Theory of thermal expansion: It is well-established (from solid-state physics) that a phase transition typically causes a discontinuity in the thermal expansion coefficient, whereas a change in dislocation mobility does not.

  The third claim (C): The anomaly in the thermal expansion coefficient at 200K in the Zeta-phase alloy is a discontinuity and is characteristic of a phase transition.

  This claim C is independently supported by the thermal expansion data from the Zeta-phase and by the general theory of thermal expansion (which has been confirmed in many other materials). The evidence in the thermal expansion domain (the discontinuity at 200K) is not part of the original domain (which was focused on mechanical properties and microstructure).

  Now, T1 and T2 are distinguished:

  - T1 predicts a phase transition at 200K, so it predicts a discontinuity in the thermal expansion coefficient at 200K (which is what we observe).

  - T2 does not involve a phase transition; it only involves a change in dislocation mobility. Therefore, T2 does not predict a discontinuity in the thermal expansion coefficient. In fact, T2 would predict a smooth change in the thermal expansion coefficient (because the beta phase is continuous) and no discontinuity.

  Thus, the evidence from the thermal expansion domain (the discontinuity) supports T1 and refutes T2.

  Reasoning:

  1. The thermal expansion data for Zeta-phase shows a discontinuity at 200K.
  2. The general theory of thermal expansion (independently supported by numerous other materials) tells us that such discontinuities are characteristic of phase transitions and not of changes in dislocation mobility.
  3. Therefore, the discontinuity at 200K in the thermal expansion coefficient of Zeta-phase is evidence of a phase transition occurring at 200K.
  4. T1 postulates a phase transition at 200K, while T2 does not.
  5. Hence, the evidence from thermal expansion supports T1 over T2.

  The feature doing the work: The discontinuity in the thermal expansion coefficient is a phenomenon that is directly tied to the existence of a phase transition (via the independently supported general theory). This discontinuity is not observable in the original domain (which did not include thermal expansion measurements) but is in a separate line of investigation.

  Why a general worry about underdetermination remains:

  Even though in this case we broke the underdetermination by bringing in evidence from another domain, the general problem of underdetermination is not dissolved. Here's why:

  1. The new evidence (thermal expansion) might itself be underdetermined. That is, there might be alternative theories of thermal expansion that could account for the discontinuity without a phase transition. The general theory we used (that discontinuities in thermal expansion are caused by phase transitions) is itself a theory that could be underdetermined by the evidence that supports it. We have assumed that this general theory is well-supported and that there are no equally well-supported rivals, but in principle, underdetermination could reappear at that level.

  2. The two original theories (T1 and T2) might be adjusted to accommodate the new evidence. For example, T2 could be modified to include an auxiliary hypothesis that explains the discontinuity without a phase transition. One might propose that the dislocation freeze-out somehow causes a discontinuity in the thermal expansion. If such an auxiliary hypothesis can be independently supported (or at least not refuted), then T2 might be saved. This is the Duhem-Quine problem: when a theory faces a refutation, we can often adjust auxiliary hypotheses to accommodate the data.

  3. There could be an infinite number of theories that are empirically equivalent to T1 and T2 in the original domain and also in the expanded domain (if we consider all possible observations). The fact that we broke the underdetermination in this case by expanding the domain does not guarantee that we can always do so. Moreover, the underdetermination might reappear when we consider even more domains. The problem is that we can never test every possible domain.

  4. The underdetermination problem is a global one: for any body of evidence, there are multiple theories that can account for it. The fact that we added one more piece of evidence and broke the underdetermination in this instance does not show that we can always break it. It only shows that in this particular case, we were able to find a new kind of evidence that distinguished the two. But the general skeptic can always imagine a rival theory that is constructed to be empirically equivalent to our best theory in all evidence we have (and will ever have). This is the problem of unconceived alternatives.

  Thus, while indirect evidence can sometimes break local underdetermination, it does not solve the global underdetermination problem. The worry remains that our theories might be false even though they are supported by all available evidence, because there might be an alternative theory that we have not conceived of that is equally supported.
answer: |-
  ### Case of Underdetermination Resolved by Indirect Evidence  
  **Scenario:**  
  Consider an alloy, "Zetalloy," that becomes brittle below 150 K. The **total evidence in the primary domain** (brittleness) consists of:  
  - Stress-strain curves from 100–300 K, showing abrupt fracture below 150 K.  
  - Micrograph images revealing crack propagation paths at 140 K, 160 K, and 180 K.  
  - X-ray diffraction (XRD) data indicating identical lattice parameters and defect densities at all temperatures.  
  - Thermal conductivity measurements showing no discontinuity across 150 K.  

  **Theory T1:** Brittleness arises from **quantum tunneling of hydrogen atoms** into lattice gaps below 150 K, creating stress concentrators. T1 predicts:  
  - No change in XRD patterns (hydrogen is too light to diffract X-rays).  
  - Identical crack paths (hydrogen weakens bonds uniformly).  
  - All observed stress-strain curves.  

  **Theory T2:** Brittleness stems from **electron spin ordering** below 150 K, forming rigid magnetic domains that resist plastic deformation. T2 predicts:  
  - No change in XRD (spin states don’t alter lattice geometry).  
  - Identical crack paths (domains fracture uniformly).  
  - All observed stress-strain curves.  

  T1 and T2 agree perfectly on every measurement in the brittleness domain: same predictions, same fits, same observations. They are empirically equivalent *so far*.  

  **Discrimination via Indirect Evidence:**  
  A separate line of investigation studies **hydrogen diffusion in metals** using neutron scattering. Independently, decades of experiments on diverse alloys establish:  
  - **Claim C:** Hydrogen atoms in metal lattices *always* exhibit quantum tunneling below 150 K if their local binding energy is ≤0.1 eV (supported by 200+ neutron scattering datasets, quantum simulations, and cryogenic spectroscopy).  
  - Zetalloy’s hydrogen binding energy is measured at 0.08 eV via neutron scattering (a result *unrelated* to brittleness tests).  

  **Reasoning to Prefer T1:**  
  1. **C is independently well-supported:** The hydrogen tunneling law (C) is confirmed by evidence from unrelated alloys (e.g., steel, titanium hydrides), with no counterexamples.  
  2. **C entails T1’s mechanism for Zetalloy:** With binding energy = 0.08 eV (<0.1 eV), C *requires* hydrogen tunneling below 150 K in Zetalloy.  
  3. **T2 is incompatible with C:** T2’s spin-ordering mechanism does not involve hydrogen, so C does not support it. T2 remains possible but unmotivated by C.  
  4. **T1 explains brittleness *via* C:** T1 links brittleness to tunneling, which C directly verifies for Zetalloy. T2 lacks this connection.  

  **Feature doing the work:** The **independently confirmed law (C)** bridges the separate domain (hydrogen dynamics) to the primary domain (brittleness). C is not *ad hoc*; it preexists and applies broadly. T1 leverages C; T2 does not. Critically, T1 and T2 *still agree on all brittleness observations*—no new data in the primary domain distinguishes them.  

  ### Why Underdetermination Isn’t Fully Resolved  
  Suppose I grant this case. A skeptic worried about underdetermination in general *should not be impressed*, because:  
  1. **The core problem relocates, not dissolves:** The underdetermination between T1 and T2 is resolved only by relying on **C**, which is *itself* vulnerable to underdetermination. For example:  
     - Could there be a rival theory C* that also fits all hydrogen diffusion data but interprets "tunneling" as instrumental noise? If so, C’s support for T1 weakens.  
  2. **Holism strikes back:** T2 could absorb C by adding auxiliary hypotheses (e.g., "spin ordering *triggers* hydrogen tunneling"). This preserves T2’s empirical equivalence in *both* domains. Auxiliary hypotheses are untestable here—so underdetermination persists.  
  3. **Infinite regress looms:** Indirect evidence relies on theories (like quantum mechanics underpinning C) that face their *own* underdetermination (e.g., Bohmian vs. Copenhagen QM). Resolving local underdetermination kicks the problem "up" or "sideways" but never eliminates it globally.  
  4. **Unconceived alternatives:** For every C-supported T1, we can imagine a T2-like theory empirically equivalent to T1 + C in *all* domains (e.g., "spin ordering mimics tunneling signatures in neutron data"). Underdetermination is a generative problem; indirect evidence only chases its tail.  

  **Conclusion:** Indirect evidence breaks empirical equivalence in *specific* cases by cross-domain consilience, but it cannot guarantee a unique "best theory" because the **auxiliary theories and laws (like C) are themselves underdetermined**. The skeptic’s worry transforms from "T1 and T2 are indistinguishable" to "C and its rivals are indistinguishable"—leaving underdetermination’s core challenge intact.
