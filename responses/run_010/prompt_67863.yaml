  The user suspects fine grain is crucial, so I'll test that by contrasting with a coarse discrimination case. I'll make sure the argument emerges from the views' commitments rather than being stipulated. Using American English throughout, I'll structure this as a complete seminar-ready thought experiment with clear philosophical analysis.
answer: |-
  Here is the thought experiment and analysis, designed to your specifications:

  **The Case: The Master Colorist**

  Lena, a senior automotive paint specialist, sits under calibrated D65 lighting examining three paint swatches: a reference shade (VW Deep Ocean Blue) and two extremely similar test shades (BMW Midnight Blue and Mercedes Obsidian Black). Untrained observers consistently misidentify them as identical. Lena, however, has 20 years of rigorous daily practice distinguishing such near-identical blues. Photons reflecting from the swatches strike the L-, M-, and S-cones in Lena's retinas, triggering distinct patterns of electrochemical signals. These signals travel via the optic nerves to her primary visual cortex (V1), where edge and luminance features are processed. The signals then propagate to area V4, specialized for color processing. Years of deliberate training have refined specific neural pathways in her fusiform gyrus, encoding the subtle reflectance differences (measurable via fMRI activation patterns) between Midnight Blue and Obsidian Black relative to Deep Ocean Blue. This specific pattern of V4 and fusiform activation reliably initiates a cascade: signals propagate to her prefrontal cortex, activating motor planning areas. This, in turn, sends signals down her corticobulbar tract, precisely coordinating her larynx, tongue, and lips to produce the vocal report: "The Mercedes swatch is closer to the VW than the BMW swatch." Instrumentation confirms the physical chain is complete: retinal response → optic nerve signal → V1 activation → V4 activation → fusiform pattern → prefrontal activation → motor command → articulated sound waves. Lena's report is, invariably, accurate.

  **Demonstration of the Design:**

  1.  **Epiphenomenalist's Predicament & the Paradox:**
      *   The epiphenomenalist holds that Lena's *subjective experience* of the blues – the phenomenal "blueness" and the subtle qualitative difference she *feels* between Midnight Blue and Obsidian Black – plays *no causal role* in producing her report. The physical story (photons → cones → V1 → V4 → fusiform → prefrontal → motor output) is causally sufficient.
      *   **The Paradox:** Lena's report *is accurate* and she *claims* it is based on her conscious experience ("I *see* that the Mercedes blue is closer"). If the experience is causally inert, *how does Lena know* which shade is which *via her experience*, and *how does that specific knowledge get accurately expressed* in her report? The accuracy of the report perfectly tracks the *content* of her non-causal experience. This creates the paradox: accurate phenomenal judgment seems inexplicable if the phenomenal quality judged plays no role in causing the judgment. It's paradoxical because it suggests reliable knowledge of a causally irrelevant property, making the correlation between non-causal experience and accurate report seem like an inexplicable cosmic coincidence rather than a mere oddity.

  2.  **Physicalist Response:**
      *   The physicalist (specifically, the reductive or identity-theory physicalist) argues that Lena's subjective experience of the color difference *is identical to* or *is constituted by* the specific neural state in her V4/fusiform gyrus. The neural state *is* the experience. There is no non-physical "residue." Therefore, the neural state causing the report *just is* the experience being reported on. The accuracy is explained because the report is causally sensitive to the very physical state that constitutes the experience. There is no separate phenomenal property needing explanation; the experience is part of the physical causal chain.

  3.  **Testing the Hypothesis (Fine vs. Coarse Grain):**
      *   **Fine Grain (Original Case):** The paradox is sharp. The discrimination relies on highly specific, trained neural states corresponding to barely distinguishable *qualia*. It's implausible to explain the report's accuracy solely in terms of coarse functional states (e.g., "discriminates blue A from blue B"). The *specific content* of the experience – the precise shade – seems necessary to ground the *specificity* of the accurate judgment. Removing the experience leaves the physical cause, but severs the link explaining why *this* neural state leads to a report *about that specific phenomenal quality*.
      *   **Coarse Discrimination Modification:** Suppose Lena only needs to distinguish bright red from dark green – a distinction easily made by untrained observers based on distinct cone response ratios and simple V4 processing. Here, the report ("It's red") could arguably be fully explained by the functional role of the neural state (detecting long-wavelength dominance) without needing to invoke the *specific phenomenal redness*. The judgment is coarse-grained enough that functionalism or a purely physical story about signal detection seems sufficient. The paradox weakens significantly because the link between the *specific quale* and the *specific report content* is less crucial; the report maps onto a broad functional category. The epiphenomenalist has an easier time arguing that the phenomenal character is merely correlated with the functional state causing the report, without the correlation needing to explain highly specific phenomenal knowledge.

  4.  **Epiphenomenalist's Appeal to Covariance & Its Failure:**
      *   The epiphenomenalist's best appeal is to **lawful psychophysical covariance**: Due to the fundamental laws of nature linking physical states (specific V4/fusiform patterns) to phenomenal states (specific color experiences), whenever the physical state P1 (Midnight Blue) occurs, the phenomenal state E1 occurs, and whenever P2 (Obsidian Black) occurs, E2 occurs. Lena's neural state P1 reliably causes report R1 ("BMW closer"), and P2 causes R2 ("Mercedes closer"). Accuracy arises because P1/P2 reliably correlate with the external stimuli *and* lawfully covary with E1/E2.
      *   **Why it Fails to Resolve the Paradox:** This explains *correlation*, not *knowledge*. While covariance ensures that when Lena says "Mercedes is closer," E2 (the experience of Obsidian Black being closer) is present, it does *not* explain *how Lena knows* that E2 is the experience *of Obsidian Black being closer*. For her report to constitute *knowledge* based on her experience, there needs to be a reason why the report is *about* E2 and its content. If E2 is causally impotent, it cannot provide the justification for the report or be the *reason why* she says "Mercedes." The report is caused by P2 and happens to correlate with E2, but E2 itself plays no role in informing Lena or guiding her judgment. The report seems to magically "track" the content of an experience that has no causal purchase on it, leaving the *intentionality* of the judgment (its being *about* the experience) unexplained. Lawful covariance provides a brute correlation but doesn't bridge the explanatory gap for how the subject *gains accurate knowledge* of their own causally inert phenomenal state.
