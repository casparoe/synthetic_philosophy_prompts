answer: |-
  Below is a systematic analysis of the Christmas Truce and "live and let live" practices through the lens of three dominant collective intentionality theories. I follow your structure precisely, flagging psychological inferences and ending with key uncertainties.

  ### **1. Disciplinary Mapping**  
  **a. *Shared Intention (Bratman-style):***  
  - *Demands:* Interlocking intentions ("I intend that we J"), meshing subplans, mutual responsiveness, mutual belief.  
  - *Supported by:*  
    - **Burial parties:** Explicit coordination (roles, timing), mutual responsiveness (e.g., synchronizing burial tasks).  
    - **Deliberate misses:** Mutual belief in reciprocal restraint (e.g., shells dropped in empty ground at predictable times).  
  - *Gaps:*  
    - **Singing carols:** No prior intention or subplans; mutual responsiveness emerges spontaneously.  
    - **Resumption under orders:** Subplans conflict irreconcilably with higher-order military obligations.  
  - *Silences:* Ad hoc groups (e.g., men meeting in no man's land) lack stable mutual belief.  

  **b. *Plural Subject (Gilbert-style):***  
  - *Demands:* Joint commitment formed by mutual readiness, creating obligations, standing to rebuke, and no unilateral exit.  
  - *Supported by:*  
    - **Joint burials:** Mutual expression of readiness (emerging from trenches), rebuke-apt violations (e.g., anger at resumed firing).  
    - **Warnings about raids:** Obligations implied by reciprocal trust.  
  - *Gaps:*  
    - **First carols:** No expressed readiness to commit; actions are exploratory.  
    - **Deliberate misses:** Tacit and anonymous—no channel for rebuke if one side defects.  
  - *Silences:* How commitment forms without verbal agreement (e.g., through gestures alone).  

  **c. *We-Intention (Searle/Tuomela):***  
  - *Demands:* Individual "we-intentions" (I intend *as part of us*), no mutual belief required.  
  - *Supported by:*  
    - **Initial singing/answering:** Soldiers act with "we-intentions" (e.g., "We are exchanging carols") from the outset.  
    - **Football:** Spontaneous joint activity without negotiation.  
  - *Gaps:*  
    - **Inherited practices:** We-intentions may not persist across unit rotations.  
    - **Resumption under orders:** We-intentions are overridden by individual self-preservation.  
  - *Silences:* Whether we-intentions exist in *asymmetric* cases (e.g., one side restrains fire unilaterally).  

  ---

  ### **2. Verdicts on Resumption of Hostilities**  
  - **Shared Intention:** Resumption is *rational subplan adjustment* due to conflicting intentions (military orders vs. truce). No moral failing—only coordination breakdown. (*Cost:* Downplays normative force of truce.*)  
  - **Plural Subject:** Resuming fire is a *breach of obligation*; soldiers wrong each other personally. Orders don’t dissolve commitment. (*Credit:* Captures sense of betrayal; e.g., diaries calling it "murder" to shoot post-truce.*)  
  - **We-Intention:** Resumption reflects *individual intention shift*. No betrayal, as we-intentions are mind-dependent. (*Cost:* Fails to explain guilt/shame described in accounts.*)  

  ---

  ### **3. Grain Problem**  
  - **Shared Intention:** Default scale is small, face-to-face groups (e.g., burial party). Struggles with larger, fluid assemblies (e.g., shifting groups in no man's land).  
  - **Plural Subject:** Requires identifiable parties to commit. Ad hoc groups (e.g., carol-singers) qualify if readiness is mutually expressed.  
  - **We-Intention:** Most permissive—any individual can adopt a we-intention toward any group (e.g., a single soldier can "intend *as part of* the trench line").  
  - ***Verdict:*** The truce sits on the boundary:  
    - *Burials* fit all three at platoon scale.  
    - *Deliberate misses* stretch shared intention (mutual belief weak) and plural subject (no expression).  
    - *Carol exchanges* fit only we-intentions initially.  

  ---

  ### **4. Persistence Through Turnover**  
  - **Problem:** Practices persisted despite unit rotations via informal handovers (e.g., incoming units briefed to avoid targeting ration collectors).  
  - **Plural Subject/Shared Intention:** Fail—commitments bind specific individuals. New soldiers cannot inherit obligations without recommitment.  
  - **We-Intention:** *Could* allow persistence if newcomers adopt pre-existing we-intentions (e.g., "I intend as part of *this trench’s* routine").  
  - **Group-Agent Solution (e.g., List & Pettit):** The *company* (as an entity with procedures) could "intend" restraint. But here, no formal procedures exist—only informal routines.  
  - ***Cost of Redescription:*** Calling the *trench* the agent loses the interpersonal normativity (e.g., felt obligations to specific enemies).  

  ---

  ### **5. Game Theory vs. Collective Intention**  
  - **Game Theory (Axelrod):** Tacit cooperation as equilibrium in iterated prisoner’s dilemma. Explains deliberate misses, inherited routines.  
  - **Conflict with Intentional Accounts:**  
    - **Felt obligations/warnings:** Diaries describe moral outrage at defections—inexplicable in purely strategic terms.  
    - **Christmas gifts:** Altruistic acts (e.g., giving tobacco) contradict strict payoff maximization.  
    - **Resumption under orders:** Game theory predicts defection when incentives change (orders, artillery support), but *not* the reported guilt.  
  - ***Verdict:*** Complementary levels:  
    - Game theory explains *sustainability* of restraint.  
    - Collective intention explains *phenomenology* (betrayal, obligation).  
    - Warnings about raids are *overdetermined* (both strategic and normative).  

  ---

  ### **6. Step Back: Challenging Assumptions**  
  The episode **subverts canonical cases** by being:  
  - **Non-consensual:** Soldiers cannot "opt out" (desertion punished by death).  
  - **Hierarchical:** Commitments conflict with superior orders.  
  - **Antagonistic:** Parties are *enemies* in a larger conflict.  
  - **Improvised:** No prior agreement.  

  ***Implications:***  
  - Theories are **too demanding** if they require explicit agreement (Gilbert) or meshing subplans (Bratman).  
  - **We-intentions** handle spontaneity but may be *too permissive* (e.g., could cover predator-prey avoidance).  
  - **None anticipated this case:** Canonical examples assume benign, small-scale cooperation.  

  ---

  ### **7. Your Inclination: Assessment**  
  - **Shared intention:** Correct on burials; correct failure on larger/spontaneous acts.  
  - **Plural subject:** Overextends if applied to *all* practices (e.g., carols lack commitment). *But:* Not "cheap"—rebuke-aptness requires mutual expression, distinguishing it from crowd chanting.  
  - **We-intention:** Correctly captures the first 10 minutes. Misses the *obligations* that emerged later.  
  - ***Refinement:*** The truce evolved from Searle-style we-intentions to Gilbert-style commitments *after* face-to-face interactions.  

  ---

  ### **Housekeeping**  
  **Key Uncertainties (Verify These):**  
  1. Whether "inherited practices" involved explicit briefing or mere imitation (diaries suggest the former, but evidence is anecdotal).  
  2. If *all* participants felt obligations, or only those who met face-to-face (psychological inference from selective diaries).  
  3. Whether football was truly *joint* (or parallel play).  

  **Potential Overstatements in Your Account:**  
  - "Tacit non-aggression from November 1914": Actual onset varied by sector; some areas saw violence until 1915.  
  - "Warnings about raids": Rarely formalized; often via shouted hints ("We shoot tomorrow!").  

  **Detail Needing Correction:**  
  - The Eastern Front truces were less common and shorter-lived than implied—mostly Christmas Day 1914, without sustained "live and let live."  

  This case exposes collective intentionality’s limits in coercive, fluid contexts. The theories *can* accommodate it—but only by stretching their core assumptions.
