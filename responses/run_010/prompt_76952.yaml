prompt: |-
  I am drafting a chapter on the epistemology of testimony for a collected volume, and before I engage with any particular account I want the specification of what an adequate one would have to deliver in the hardest case available: reports of apparently paranormal events, and above all reports advanced as evidence for the survival of consciousness after death. Please write that specification.

  I want the requirements anchored to Henry Sidgwick's predicament, because it makes the difficulty unusually sharp. He was the founding president of the Society for Psychical Research in 1882 and at the same time the author of The Methods of Ethics, where he argues that the conflict between rational egoism and universal benevolence — his dualism of practical reason — leaves morality without a fully rational foundation unless one may assume the universe to be so ordered that duty and happiness are ultimately reconcilable. He therefore treated empirical evidence for survival as a matter of the first practical importance for ethics, while presiding over an investigative program whose standards were such that no such evidence emerged. He also chaired the committee behind the Census of Hallucinations, published in 1894 and drawn up largely by his wife Eleanor Mildred Sidgwick, which canvassed roughly 17,000 people, recorded 1,684 reports of apparition experiences, and whose central statistical move was to compare the observed frequency with which such experiences fell within a day of a corresponding death against the frequency chance coincidence would predict, given the base rate of the experiences and general mortality figures. Any specification I adopt must make sense of someone able to do all three of these things at once without evident inconsistency.

  The deliverable is a numbered list of the requirements an adequate account of evidential standards in this domain must meet, each with the case or consideration motivating it. Please cover at least the following, and add any requirement I have omitted that you judge belongs, saying why:

  - the distinction it may not collapse between the reliability of a witness's report of an experience and the evidential weight of the causal story attached to it: a witness may be impeccable about having seen a recognizable figure at a given hour without that supporting survival in the slightest;
  - deliberate fraud, and separately fraud of which the witness is unaware — confabulation, elaboration under questioning, and the sincere reporting of ordinary information, forgotten by everyone present, that arrives as though novel;
  - the standing worry that information apparently from the dead could instead be produced by an unrestricted telepathic faculty among the living, which would leave survival empirically indistinguishable from boundless psi; and whether the cross-correspondence strategy later developed within the Society — complementary fragments, each too specific for any single sitter, gathered from automatic writers working apart — answers that worry or merely relocates it;
  - an explanation, without special pleading, of why the standard applied here differs from that applied to ordinary testimony, since a differential treatment justified only by the falsity of the target claim is circular;
  - a bar that some finite body of testimony could in principle clear, on pain of begging the question, together with a description of what such a body of testimony would look like;
  - the non-independence of witnesses who share a cultural script, given that séance conventions shaped what was experienced, how it was described, and what counted as striking;
  - an explicit attitude to repeatability and to experimental control, and to the demand for a mechanism, with no silent importation of either from laboratory science by an account that continues to accept non-repeatable singular evidence elsewhere, as in history, cosmology, or the early reception of meteorites;
  - a view on whether practical stakes bear on the threshold: if the consequences of error about survival are as Sidgwick supposed, does that raise the evidential bar, lower it, or leave it unmoved — and can the same account say what is lost by suspending judgment indefinitely;
  - a statement of what would count against the hypothesis, not only of what would count for it.

  Mark which of these are non-negotiable and which are the local preferences of a particular camp — the laboratory, the apologist, the debunker — and say what makes them camp-relative rather than genuine.

  The part I most want is this. Identify any subset of the requirements that cannot be jointly satisfied. My own suspicion is that a standard demanding a mass of independent, uncontaminated, non-coincidental testimony cannot be met by a phenomenon that is, on the most favorable description its partisans offer, sporadic, private, and uncontrolled, so that the attainability requirement pulls against the independence and repeatability requirements. Tell me whether that diagnosis is right, whether the impossibility is a feature of the phenomenon or an artifact of standards imported from the wrong kind of inquiry, and, if a requirement must be dropped or reformulated to restore consistency, which one and what it becomes. Then name the single requirement that does the most work in excluding candidate accounts, and justify that choice.

  Close with a short assessment — half a page at most — of how three kinds of account fare against the list: a Humean treatment on which uniform experience defeats any amount of testimony; the Bayesian rejoinder that a sufficiently large body of independent credible reports can in principle outweigh any finite prior; and a credulity-based treatment on which sincere testimony is presumptively credible absent specific defeaters. Say also where Sidgwick's own Census practice sits: does it satisfy the specification he implicitly endorsed, and if not, which requirement does it fail?

  Please give no bibliography, no citations, and no reading list; I want the requirements and the reasoning behind them. A table is acceptable for marking non-negotiable against camp-relative, but the impossibility argument should be in prose.
reasoning: |-
  Okay, let me approach this systematically. The user is drafting a chapter on testimony epistemology focusing on paranormal reports - especially survival evidence - and wants rigorous standards anchored to Sidgwick's unique position as ethicist and psychical researcher. 

  First, I need to extract core requirements from their detailed query. They've listed eight specific points covering evidentiary independence, fraud risks, telepathy concerns, differential treatment justification, attainability, cultural contamination, repeatability demands, and practical stakes. Additionally, they want these marked as non-negotiable vs camp-relative, with analysis of potential requirement conflicts and assessment of three epistemological approaches.

  Sidgwick's predicament provides the perfect test case: his ethical framework made survival evidence crucial, yet his SPR investigations maintained strict standards that ultimately didn't confirm survival. This tension must inform the requirements. Key angles to address include:
  - Separating experience reliability from interpretive claims
  - Accounting for unconscious and deliberate deception
  - Resolving the telepathy/survival indistinguishability problem
  - Avoiding circular standards that presuppose paranormality's falsehood
  - Ensuring the bar is theoretically clearable
  - Handling witness interdependence 
  - Defining appropriate scientific rigor without double standards
  - Determining if ethical stakes affect evidence thresholds

  The user's suspicion about conflicting requirements (attainability vs independence/repeatability) seems well-founded. Phenomena described as sporadic and private inherently resist standard evidentiary demands. This tension might necessitate reformulating "repeatability" to allow for historical investigation models rather than lab replication.

  For the comparative assessment, I'll contrast Humean skepticism (prior experience dominates testimony), Bayesian updating (evidence can overcome priors), and credulity principles (testimony as default credible). Sidgwick's Census approach likely satisfies most requirements except perhaps the telepathy alternative explanation.

  The most pivotal requirement appears to be the non-circularity standard (#4), as it prevents dismissal-by-presupposition while forcing accounts to articulate why paranormal testimony deserves scrutiny beyond normal historical evidence. This does the heaviest lifting in excluding inadequate approaches.
answer: |-
  Here is a specification of requirements for an adequate epistemology of testimony regarding paranormal survival reports, anchored to Sidgwick's predicament, with non-negotiable requirements marked (NN) and camp-relative ones identified:

  ### Requirements for an Adequate Account of Testimonial Evidence in Survival Cases

  1.  **Distinction between Experience and Interpretation (NN):** The account must rigorously separate the reliability of a witness's report *of their subjective experience* (e.g., "I saw a recognizable figure of X at time T") from the evidentiary weight of the *causal explanation* attached to it (e.g., "This was the surviving consciousness of X"). The latter requires independent justification beyond the sincerity and observational reliability of the witness. *Motivation:* Sidgwick's Census documented *experiences* (apparitions) but required statistical analysis to cautiously assess any potential link to death; the experience alone proves nothing about survival.

  2.  **Accounting for Fraud and Misattribution (NN):** The account must provide robust mechanisms to detect and discount (a) deliberate fraud (conscious deception) and (b) fraud where the witness is unaware (confabulation, cryptomnesia, elaboration under suggestion, unconscious incorporation of sensory cues or prior knowledge). *Motivation:* SPR investigations, including Sidgwick's oversight, constantly grappled with exposure of fraud and subtle psychological explanations for seemingly paranormal information, making this intrinsic to the domain.

  3.  **Addressing the Telepathy Worry (NN):** The account must confront the possibility that information apparently from the dead could instead originate from telepathic (or other psi) interactions among the living. It must evaluate whether strategies like cross-correspondences genuinely circumvent this worry by demonstrating super-psi complexity *incompatible* with known living minds, or merely relocate the problem to an implausible super-psi faculty. *Motivation:* This was a core theoretical challenge within the SPR; survival evidence must be distinguishable from alternative psi explanations to be meaningful.

  4.  **Non-Circular Differential Scrutiny (NN):** The account must justify why testimony for paranormal claims warrants *stricter* standards than ordinary testimony (e.g., historical events, mundane perception) without presupposing the falsity of the paranormal claim. The justification must appeal to general epistemic principles (e.g., prior probability based on background knowledge, coherence demands, susceptibility to specific error types like #2 & #3). *Motivation:* Sidgwick applied scientific rigor without abandoning the *possibility* of evidence; differential treatment based solely on assumed falsity is question-begging.

  5.  **Theorized Attainability (NN):** The account must specify, in principle, what a *finite* body of testimony/data capable of clearing the evidential bar would look like, even if currently unrealized. It cannot set an impossible standard that begs the question against the phenomenon. *Motivation:* Sidgwick's *practice* presumed evidence *could* be found (hence the Census, SPR investigations); an epistemology making evidence *in principle* unobtainable contradicts the spirit of his search.

  6.  **Handling Non-Independence and Cultural Scripting:** The account must address the contamination of testimony by shared cultural expectations, séance conventions, leading questioning, and social reinforcement, which shape experiences, descriptions, and interpretations. *Motivation:* The content and interpretation of paranormal reports (e.g., Victorian spirit messages) are demonstrably culturally influenced. *(Camp-Relative: Debunkers often overemphasize this to dismiss all testimony; Apologists sometimes underplay its distorting effects. Non-negotiable aspect: Recognition of the problem is essential; the weight given to it can vary.)*

  7.  **Explicit Stance on Repeatability, Control & Mechanism:**
      *   The account must explicitly state its requirements for repeatability (direct replication vs. similar instances) and experimental control.
      *   It must state whether a proposed mechanism is required for evidence to be acceptable.
      *   It must avoid uncritically importing standards from controlled laboratory science while rejecting singular evidence accepted in history, cosmology, or law. *Motivation:* Sidgwick used statistical (Census) and investigatory methods distinct from lab experiments. The tension between the singularity of historical events (incl. potential survival evidence) and scientific ideals needs explicit resolution. *(Camp-Relative: Laboratory camp demands lab-grade repeatability/control; Apologists/historians accept non-repeatable singular evidence; Debunkers use lack of repeatability/mechanism as a primary dismissal tool. Non-negotiable aspect: An account must explicitly define its stance here without inconsistency.)*

  8.  **Clarifying Stakes and Thresholds:**
      *   The account must articulate whether the high practical stakes of the survival question (per Sidgwick's ethical dualism) raise the evidential bar (demanding more certainty), lower it (due to the cost of missing truth), or leave it unchanged (epistemic standards being stakes-invariant).
      *   It must articulate the epistemic cost of indefinite suspension of judgment. *Motivation:* Sidgwick's *motivation* was profoundly practical; an epistemology must address how (if at all) stakes interact with evidence assessment. *(Camp-Relative: Apologists may lean towards lowering the bar due to stakes; Debunkers/Lab camp may insist stakes don't lower standards or even raise them. Non-negotiable aspect: The account must have a reasoned position on stakes.)*

  9.  **Falsifiability Requirement (NN):** The account must specify what conceivable patterns of testimony or evidence *against* the survival hypothesis would count as disconfirming or significantly weakening it. It cannot only define what counts *for* it. *Motivation:* To be genuinely empirical, a hypothesis must be falsifiable. Sidgwick implicitly accepted this by seeking evidence that *could* fail to materialize or show explicable patterns.

  ### The Impossibility Argument

  Your diagnosis is largely correct, but the impossibility arises from a specific tension inherent in the *phenomenon as described*, exacerbated by importing standards from the wrong *kind* of inquiry, rather than being purely an artifact. The core conflict is between:

  *   **Requirement 5 (Attainability):** Demands that *some* finite body of evidence *could* suffice.
  *   **Requirement 6 (Independence/Scripting):** Highlights that genuinely independent reports are scarce due to cultural saturation and shared scripts.
  *   **Requirement 7 (Repeatability/Control):** As commonly interpreted (demanding lab-grade replication/control for *each* claim).
  *   **The Nature of the Phenomenon:** Defined by proponents as sporadic, private, subjective, and often occurring outside controlled contexts.

  **Lab-grade repeatability/control (a *strict* interpretation of R7) is fundamentally incompatible with a phenomenon described as sporadic and private.** You cannot reliably replicate a specific, uncontrolled private experience on demand in a lab. Similarly, cultural scripting (R6) makes achieving *pure* independence across a large sample ("mass") extremely difficult.

  **Resolution:** Requirement 7 (**Explicit Stance on Repeatability/Control & Mechanism**) must be **reformulated**. An adequate account must explicitly *reject* the demand for laboratory-style repeatability *for individual instances* of such phenomena. Instead, it must adopt the standards of **historical or forensic inquiry**, where:
  *   "Repeatability" means the occurrence of *multiple, similar* unexplained events/experiences under diverse conditions, investigated rigorously case-by-case.
  *   "Control" shifts to meticulous source criticism, cross-verification, ruling out normal explanations, and assessing coherence across cases (akin to the cross-correspondence *strategy*, though its success is debatable).
  *   A mechanism is not a *precondition* for evidence, but its absence may lower the posterior probability or guide the search for normal explanations.

  This reformulation preserves attainability (R5) by allowing evidence to accumulate through rigorously investigated singular reports and patterns thereof, while still demanding high standards for source reliability (R1, R2) and addressing non-independence/scripting (R6) through critical analysis of context and content.

  ### The Pivotal Requirement

  **Requirement 4 (Non-Circular Differential Scrutiny)** does the most work in excluding candidate accounts. It forces an account to:
  1.  **Acknowledge the prima facie credibility of sincere testimony** (preventing blanket debunking).
  2.  **Justify heightened scrutiny** based on *general* epistemic principles (prior improbability based on established science, high susceptibility to errors R2 & R3, coherence demands), not the mere strangeness or assumed falsity of the claim.
  3.  **Avoid special pleading** in *either* direction – neither dismissing all testimony because it's "paranormal" nor accepting weak testimony because the stakes are high or the topic is special.

  Accounts that fail R4 either collapse into dogmatic skepticism (Humean) or uncritical credulity, or resort to question-begging justifications for their level of scrutiny.

  ### Assessment of Three Accounts & Sidgwick's Practice

  *   **Humean (Uniform Experience Defeats Testimony):**
      *   **Fails:** R4 (Circular: "uniform experience" assumes survival is false to define what's "uniform"), R5 (Sets an impossibly high bar – testimony can *never* overturn the "uniform" prior), R9 (Defines survival as false a priori).
      *   **Strengths:** Emphasizes R1, R2, R3, R6 concerns seriously. Unmoved by stakes (R8).
  *   **Bayesian (Credible Reports Outweigh Prior):**
      *   **Potentially Satisfies:** R4 (Heightened scrutiny via low prior, justified by background knowledge), R5 (In-principle attainability), R9 (Falsifiable via Bayes factor <1). Handles R1, R2, R3 via likelihood adjustments. Can incorporate R6/R7 stance explicitly. Can articulate stakes (R8) as affecting action thresholds, not evidence strength itself.
      *   **Challenges:** Requires quantifying priors/likelihoods amidst uncertainty (R2,R3,R6,R7). Susceptible to misapplying priors or neglecting complex error modes.
  *   **Credulity (Sincere Testimony Presumptively Credible):**
      *   **Fails:** R1 (Collapses experience/interpretation), R2 (Insufficient on fraud/misattribution), R3 (Neglects telepathy/super-psi), R4 (No justification for *not* applying heightened scrutiny – special pleading *for* paranormal claims), R9 (Weak on falsification).
      *   **Strengths:** Formally satisfies R5. Acknowledges stakes (R8) might lower bar.

  **Sidgwick's Census Practice:**
  *   **Satisfies:** R1 (Focused on experience frequency/timing, not interpretation as survival), R2 (Attempted rigorous data collection/screening), R5 (Sought finite, analyzable data corpus), R9 (Was falsifiable - a negative result *was* a result), R8 (Motivated by stakes, but didn't obviously lower bar).
  *   **Fails:** R3 (Did not address the telepathy alternative directly – the Census couldn't distinguish a telepathic "death impression" from survival). R6 (Cultural scripting of *what* was reported as an "apparition" or "death-related" wasn't deeply analyzed). R7 (Relied on statistical analysis of uncontrolled experiences; no mechanism demanded or offered).
  *   **Implicit Endorsement:** Sidgwick's practice implicitly required R1, R2, R4 (applying scientific/mathematical rigor *because* of the domain, not circularly), R5, R9. His main failing against his *own* implicit standard was likely R3 – the telepathy loophole remained a live alternative explanation for the Census results.
