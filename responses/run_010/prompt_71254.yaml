  **INTERNATIONAL ALLIANCE FOR PORTRAYAL INTEGRITY STANDARD IAPI 2077:2028**  
  **ETHICAL PORTRAYAL CERTIFICATION (EPC) SCHEME FOR DRAMATIZED DEPICTIONS**  
  **First Edition**

  **1.0 SCOPE**  
  1.1 This Standard establishes requirements for the Ethical Portrayal Certification (EPC) of an Audiovisual Work (AV Work) concerning its treatment of one or more Subjects. A *Subject* is defined as any natural person whose life, actions, or identifiable characteristics form a material basis for the portrayal of a character within the AV Work.  
  1.2 The requirements specified herein apply solely to *Dramatizations* (see Clause 3.1).  
  1.3 Jurisdiction of this Standard over a Subject is determined by the *Temporal Proximity Index (TPI)*:  
      &nbsp;&nbsp;&nbsp;&nbsp;a) **Tier 1 (Full Jurisdiction):** Subjects deceased ≤ 25 years prior to the AV Work's Principal Photography Commencement Date.  
      &nbsp;&nbsp;&nbsp;&nbsp;b) **Tier 2 (Reduced Jurisdiction):** Subjects deceased > 25 years but ≤ 100 years prior. Presumption of *Diminished Direct Sensitive Interest* applies.  
      &nbsp;&nbsp;&nbsp;&nbsp;c) **Tier 3 (Minimal Jurisdiction):** Subjects deceased > 100 years prior. Presumption of *No Surviving Sensitive Interest* applies, triggering *Historical Contextualization Allowances* (see Annex A.2).  
  1.4 *Sunset Period Adjustment*: For Tier 2 Subjects, the *Materiality Threshold* for nonconformities increases by 2% per annum elapsed beyond the initial 25-year threshold. For Tier 3 Subjects, it increases by 5% per annum beyond the 100-year threshold.  
  1.5 Subjects who are living at the time of the AV Work's Principal Photography Commencement Date fall outside the scope of this Scheme. Protection for such individuals is afforded through statutory rights, contractual agreements, or other contemporaneous legal remedies, the applicability and robustness of which decline as a function of time subsequent to the Subject’s demise relative to the AV Work's creation.

  **2.0 NORMATIVE REFERENCES**  
  IAPI-GUI 2077:01:2028 Guidance on the Application of IAPI 2077:2028  
  IAPI-ANN A:2028 Annex A: Materiality Thresholds & Historical Contextualization Allowances  
  IAPI-ANN B:2028 Annex B: Dramatization Variance Scoring Matrix

  **3.0 DEFINITIONS**  
  For the purposes of this document, the following terms and definitions apply:  
  3.1 **Dramatization:** An AV Work primarily intended as entertainment or artistic expression, where narrative structure, character development, and dialogue are constructed or significantly elaborated beyond the verifiable record, even if based upon actual events or persons. *Dramatizations* are subject to the full requirements of this Standard.  
  3.2 **Documentary:** An AV Work primarily intended as informational or journalistic, adhering strictly to verifiable facts, records, and contemporaneous evidence. Reconstruction of events utilizes only documented actions and dialogue. *Documentaries* are exempt from this Standard but may apply for optional *Veracity Verification Marking*.  
  3.3 **Inspired By:** An AV Work where the connection to actual persons or events is nominal, serving only as a loose conceptual catalyst. Characters and events are substantially fictionalized, and specific identification of real persons as *Subjects* is demonstrably ambiguous or absent. *Inspired By* works fall outside the scope of this Standard.  
  3.4 **Composite Character:** A single character within a *Dramatization* whose attributes, actions, or narrative function are derived from the amalgamation of traits, experiences, or roles attributable to two or more distinct real persons.  
  3.5 **Material Variance:** Any instance within a *Dramatization* where portrayal of a Subject demonstrably departs from the preponderance of verifiable evidence concerning that Subject's documented life, actions, or character.  
  3.6 **Sensitive Interest:** Concerns pertaining to a Subject’s reputation, dignity, privacy, or legacy reasonably adjudged to be held by the Subject during life or inheritable by designated successors (see Clause 7.0).  
  3.7 **Verifiable Evidence:** Records contemporaneous with the Subject’s life, including official documents, authenticated personal correspondence, credible eyewitness accounts recorded near the time of the event, or established historical consensus.

  **4.0 REQUIREMENTS**  
  4.1 The Production Entity shall establish and maintain a *Subject Impact Assessment (SIA)* for each Tier 1 and Tier 2 Subject within the AV Work. The SIA shall document known facts, potential *Material Variances*, and rationale for significant deviations, citing *Verifiable Evidence* gaps or *Historical Contextualization Allowances* (Annex A) where applicable.  
  4.2 **Disclosure Obligation:**  
      &nbsp;&nbsp;&nbsp;&nbsp;4.2.1 The Production Entity shall implement clear and conspicuous disclosure of the *Dramatization* nature of the AV Work.  
      &nbsp;&nbsp;&nbsp;&nbsp;4.2.2 Acceptable disclosure methods include, but are not limited to:  
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a) An opening title card stating: *"This is a dramatization. Certain events, characters, timelines, and dialogue have been created or altered for dramatic purposes."*  
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;b) A closing credit disclaimer substantially similar to 4.2.2a.  
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;c) A prominent statement within the press kit and official marketing materials.  
      &nbsp;&nbsp;&nbsp;&nbsp;4.2.3 Implementation of disclosure per 4.2.2 constitutes a **Credit** (see Annex B, Item B.1).  
  4.3 **Mitigation of Non-Verifiable Elements:**  
      &nbsp;&nbsp;&nbsp;&nbsp;4.3.1 Where significant gaps in *Verifiable Evidence* exist concerning a Subject's actions, dialogue, or motivations, the Production Entity shall employ strategies to mitigate potential misrepresentation.  
      &nbsp;&nbsp;&nbsp;&nbsp;4.3.2 The use of **Composite Characters** is recognized as a valid *Corrective Measure* to reduce the number of distinct *Subjects* portrayed, thereby simplifying narrative demands and minimizing potential *Material Variance* exposure for specific individuals, particularly in Tier 2 and Tier 3 contexts. Implementation per documented rationale constitutes a **Credit** (see Annex B, Item B.2).  
  4.4 The Production Entity shall achieve a minimum score of 85 points on the *Dramatization Variance Scoring Matrix* (Annex B) for the AV Work as a whole. Scores < 85 result in *Nonconformity*. Scores ≥ 90 qualify for Silver Certification. Scores ≥ 95 qualify for Gold Certification. Scores = 100 qualify for Platinum Certification. Points are cumulative and subject to *Materiality Weighting* per Annex B severity classifications (Minor, Moderate, Major).

  **5.0 CERTIFICATION PROCESS**  
  5.1 Certification is granted following a Stage 1 (documentation review) and Stage 2 (on-site/remote audit) assessment by an IAPI-Accredited Conformity Assessment Body (CAB).  
  5.2 The CAB shall verify the SIA, disclosure implementation, claimed *Corrective Measures* (e.g., *Composite Characters*), and score the AV Work against Annex B via direct *Observation* and interview.  
  5.3 Nonconformities require a *Corrective Action Plan* (CAP) for resolution prior to certification issuance.  
  5.4 Certification validity is 3 years, subject to annual *Surveillance Audits*. Significant changes to the AV Work post-certification may necessitate *Scope Extension* review.

  **7.0 COMPLAINTS, STANDING, AND APPEALS**  
  7.1 Complaints regarding alleged nonconformity of a certified AV Work to this Standard may be lodged with IAPI.  
  7.2 **Standing to Complain:**  
      &nbsp;&nbsp;&nbsp;&nbsp;7.2.1 For Tier 1 Subjects: Standing is granted to the Subject’s legal executor, spouse or domestic partner, children, parents, or siblings.  
      &nbsp;&nbsp;&nbsp;&nbsp;7.2.2 For Tier 2 Subjects: Standing is limited to the Subject’s children or grandchildren.  
      &nbsp;&nbsp;&nbsp;&nbsp;7.2.3 For Tier 3 Subjects: Standing requires demonstration of direct lineal descent and evidence of active stewardship of the Subject’s legacy, subject to IAPI Secretariat approval. *Presumption of No Surviving Sensitive Interest* (Clause 1.3c) applies unless rebutted by compelling evidence.  
  7.3 Where no individual with Standing per Clause 7.2 can be identified or located, IAPI may, at its discretion:  
      &nbsp;&nbsp;&nbsp;&nbsp;a) Appoint an *Independent Legacy Advocate* for the purposes of the complaint; or  
      &nbsp;&nbsp;&nbsp;&nbsp;b) Dismiss the complaint for lack of Standing, citing *Exhaustion of Designated Sensitive Interest*.  
  7.4 Appeals against certification decisions or complaint resolutions may be made to the IAPI Independent Appeals Board.

  **NOTICE**  
  IAPI is pleased to announce that the dramatized miniseries *"The Verdigris Sonata"* (Chronicle Pictures, 2028) has achieved **Platinum Certification** under IAPI 2077:2028, the highest rating for Ethical Portrayal. This certification recognizes Chronicle Pictures' exemplary commitment to the principles outlined in this Standard.

  ---
  **ANNEX B (NORMATIVE): DRAMATIZATION VARIANCE SCORING MATRIX**

  | Item | Description of Dramatization Variance                                                                 | Severity    | Points | Credit/Deduction |
  | :--- | :---------------------------------------------------------------------------------------------------- | :---------- | :----- | :--------------- |
  | B.1  | Implementation of Standard Disclosure per Clause 4.2.2                                                 | N/A         | +5     | **Credit**       |
  | B.2  | Use of Composite Character per Clause 4.3.2 (with documented rationale)                               | N/A         | +3     | **Credit**       |
  | B.3  | Attributing specific spoken dialogue to a Subject where no verifiable record of such words exists     | Minor       | -1     | Deduction        |
  | B.4  | Relocating a Subject's death to a different narrative act or calendar year (> ±1 year)                | Moderate    | -3     | Deduction        |
  | B.5  | Merging two distinct attested persons into a single Composite Character role                          | Minor       | -1     | Deduction        |
  | B.6  | Inventing or significantly altering a key personal relationship (e.g., friendship, rivalry, romance) | Major       | -5     | Deduction        |
  | B.7  | Supplying specific interior motive/thought process where Subject left no diary/confession             | Moderate    | -2     | Deduction        |
  | B.8  | Staging a detailed scene where no character depicted could plausibly have reported the events         | Major       | -6     | Deduction        |
  | B.9  | Omitting a Subject's known, documented objection to an event/action because it impedes narrative flow | Major       | -7     | Deduction        |
  | B.10 | Assigning an action demonstrably performed by Person A to Person B for dramatic convenience          | Moderate    | -3     | Deduction        |
  | B.11 | Creating a fictional significant event involving the Subject not supported by verifiable evidence     | Major       | -8     | Deduction        |
  | B.12 | Condensing a complex historical sequence (>5 years) into a single simplified scene implying causation | Moderate    | -4     | Deduction        |

  *Points are deducted for Items B.3-B.12. Points are added (Credits) for Items B.1 and B.2. Final Score = 100 + Credits - Deductions. Materiality Weighting: Minor (x1), Moderate (x1.5), Major (x2). Maximum possible deduction per item capped at -10 points after weighting.*
