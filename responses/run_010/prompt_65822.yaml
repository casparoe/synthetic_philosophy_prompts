prompt: |-
  I head the measurement and incentives team at a regional social-services authority. We write the performance measures and payment targets that go into our contracts with outside providers — employment placement, supported housing for people leaving homelessness, home-care visits for older adults — and those measures move real money and real provider behaviour. Roughly thirty proposals reach me each quarter: some from programme managers who want a measure, some from providers who want an easy one, some from my own analysts who think they have found something better. What I need is a screening procedure my analysts can run on a proposal in under an hour, before it comes to me for sign-off, and that they can run without a background in statistics or philosophy.

  The procedure should be built on a working view of mine, which I want you to develop and stress-test rather than accept as settled. The four-way taxonomy of Goodhart failures that circulates in the alignment literature — regressional, extremal, causal, adversarial — sorts failures by their statistical structure, and that is not the axis on which my office can act. What I can act on is the remedy. My suspicion is that at least three distinct failures get reported to me under the single heading "this measure can be gamed," and that the reporting is useless precisely because the heading hides them:

  - Gaming proper: the provider can raise the score without raising the client outcome. The remedy is verification, audit, clawback.
  - Leakage: the improvement is genuine, but it is bought by shifting effort from an unmeasured part of the caseload or the task to the measured part, so that outcomes rise for some clients and fall for others while the aggregate score improves. The remedy is widening or pairing the measure; nobody has done anything wrong and an audit would be a waste.
  - Drift: everyone behaves honestly, and the proxy–outcome relationship decays anyway because the caseload, the labour market, the technology or the service model changes underneath it. The remedy is re-baselining and a shorter review cycle, and no amount of contracting cleverness prevents it.

  These three have different symptoms, different responsible parties and different contractual consequences. I want the procedure to force a classification rather than allow an analyst to stop at "at risk of Goodharting."

  Against that background, the deliverable should contain:

  1. The questions in the order an analyst should ask them, and for each one, what counts as a sufficient answer — not "consider whether the proxy tracks the outcome," but the specific evidence or line of reasoning that entitles a non-expert to move on. Where a question cannot be answered from data we would plausibly hold (we get quarterly provider returns and a small client experience survey; we do not get anything randomised, and we rarely get outcome data beyond twelve months), say so, and give the fallback and its cost.

  2. A sharpening of the test I currently apply by hand: the analyst must write down the three cheapest ways a provider could lift the score substantially within one contract year, and then state for each whether the client outcome moves with it. Tell me how to make that step something other than an exercise in imagination — what to prompt for, whose testimony counts, how to check the list is not padded with implausible scenarios — and what the procedure should conclude when the analyst genuinely cannot think of any.

  3. The exit conditions. Where the procedure terminates in reject; where in accept with named monitoring; where in accept outright; and where it stops being a factual question and hands the decision to me because it turns on values — for instance, how much unmeasured harm to a subgroup we are willing to accept in exchange for a measure we can actually verify at reasonable cost. Mark those handoffs explicitly, and say what information I need at each one.

  4. Three worked applications, showing the questions being answered and not merely listed: (a) an employment provider measured by the number of clients in work at the six-month point; (b) a supported-housing provider measured by the proportion of residents who have not returned to homelessness at twelve months; (c) home-care provision measured by a vendor's algorithmic risk score predicting which clients will need emergency admission in the coming year, with payment attached to reductions in predicted risk. I expect (c) to break the procedure, since the object being optimised is a model whose own training data we generate, and I would rather see exactly how it breaks than see it handled smoothly. At least one of the three must come out against my interests: I have publicly committed to the employment measure, so if the procedure rejects or substantially rewrites it, say so without softening.

  5. An account of the reflexive problem. Once this procedure exists it becomes a target in its own right — programme managers and vendors will learn to fill in the boxes in whatever way gets their measure approved, and my analysts will learn which answers shorten the meeting. Tell me what to build in against that, and be candid if the honest answer is that no checklist can be made robust to being checklisted.

  6. A closing statement of what the procedure cannot do at all, together with your own assessment of how confident you are in the central claims you have made: in particular, how confident you are that gaming, leakage and drift form a real division rather than three descriptions of one underlying failure, and which single step of the whole procedure you are least sure about and why.

  Please do not include a bibliography or a reading list; refer to positions and arguments by their content and I will attach references myself if we publish this.
reasoning: |-
  We are designing a screening procedure for performance measures that classifies potential Goodhart failures into three types: Gaming, Leakage, or Drift. The procedure must be executable by analysts without a background in statistics or philosophy in under an hour. The output should force a classification and recommend remedies.

  Key elements of the procedure:
  1. **Questions in order** with clear criteria for moving on.
  2. **Sharpening the "three cheapest ways" test** to make it less reliant on imagination.
  3. **Exit conditions** (reject, accept with monitoring, accept outright, or handoff to you).
  4. **Worked examples** (employment, housing, home-care) with at least one going against your interests.
  5. **Reflexive problem** (how to prevent gaming the procedure).
  6. **Limitations and confidence assessment**.

  We'll structure the procedure as a decision tree with specific questions.

  ---

  **The Screening Procedure**

  **Step 0: Pre-screen (Data Check)**
  - *Question*: Do we have at least two years of historical data (or equivalent from similar programs) for the proposed measure and any directly related outcomes? If not, can we get a pilot or proxy?
  - *Sufficient answer*: 
    - If yes, proceed.
    - If no, and the measure is entirely new, then the fallback is to require a pilot phase (with data collection) or use a closely related proxy from a similar program. The cost is delay (for pilot) or potential inaccuracy (if using a proxy). Mark for handoff to you (values decision: whether to proceed without baseline data).

  **Step 1: Gaming Check**
  - *Question*: Can the provider increase the measure without improving the intended client outcome? 
  - *How to answer*:
    - Look for historical examples (from our data or similar programs) where the measure moved without a corresponding change in the outcome (using the client outcome data we have, e.g., 12-month outcomes, client surveys). 
    - If no data, use expert testimony (from programme managers, providers, or independent experts) on whether it's technically possible. 
    - If neither is available, then the analyst must list the three cheapest ways (see Step 1a).
  - *Sufficient answer*: 
    - If the data or testimony shows no evidence of disconnect, and the analyst cannot think of a plausible way, then proceed to Step 2. 
    - If there is evidence or a plausible way, classify as "Gaming risk" and note for remedy (verification/audit). Then proceed to Step 2 to check for other issues (since multiple failures can coexist).

  *Step 1a: Three Cheapest Ways Test (for when data/expertise is lacking)*
  - *Prompt*: "List three concrete actions a provider could take in the next year that would substantially increase the measure's score, requiring minimal extra resources (e.g., reallocating existing staff time, changing client selection, altering reporting)."
  - *Whose testimony counts*: 
    - Input from frontline staff (via programme managers), providers (if willing), and internal analysts with operational experience. 
    - Check against historical incidents (if any) or similar measures.
  - *Avoiding implausibility*: 
    - The analyst must consult at least one external source (e.g., a programme manager or a provider) to validate the plausibility of at least one scenario. 
    - Scenarios must be specific (e.g., "focus on clients closest to employment" for job placements, not "cheat").
  - *Evaluation*: For each scenario, state whether the intended client outcome (for the affected clients) would improve, stay the same, or worsen. 
    - If at least one scenario shows no improvement or worsening, then Gaming risk is confirmed.
  - *If the analyst cannot think of any*: 
    - Then they must state so and note that Gaming risk is not detected. However, this does not mean absence; it means the test is inconclusive. Proceed to Step 2, but note uncertainty.

  **Step 2: Leakage Check**
  - *Question*: Could improving the measure come at the expense of unmeasured clients or unmeasured aspects of the service?
  - *How to answer*:
    - Examine the caseload: Are there subgroups (e.g., by client characteristics, geography, service intensity) that might be deprioritized? 
    - Examine the task: Does the measure cover the full service (e.g., job retention beyond six months, quality of housing) or just a part?
    - Use data: Compare the measure with outcomes for unmeasured groups (if we have data) or with longer-term outcomes. Look for negative correlations in historical data (e.g., when measure goes up, does another group/client aspect suffer?).
    - If no data, use expert testimony on provider incentives.
  - *Sufficient answer*:
    - If there is evidence of negative correlations or plausible subgroup/task shifts (via the three cheapest ways test in Step 1a that involve shifting effort), then Leakage risk is present. 
    - If not, proceed to Step 3.

  **Step 3: Drift Check**
  - *Question*: Is the measure's relationship with the outcome stable over time under changing conditions?
  - *How to answer*:
    - Use historical data to check the correlation between the measure and the outcome over time (e.g., by year, by economic cycle). 
    - If the measure is new, use data from similar programs or expert assessment of vulnerability to known changes (e.g., labor market for employment, housing supply for homelessness).
    - If no data, assess the volatility of the context (e.g., how often do key factors like unemployment rate or rent prices change?).
  - *Sufficient answer*:
    - If the correlation is stable (e.g., within a band of 0.8-1.2 in effect size) or the context is stable, then Drift risk is low. 
    - If there is instability or high context volatility, then Drift risk is high.

  **Step 4: Classification and Exit Conditions**
  - Based on Steps 1-3, classify the failure mode(s):
    - **Gaming risk only**: Remedy = verification/audit/clawback. 
      - *Exit*: Accept with monitoring (audit plan).
    - **Leakage risk only**: Remedy = widen measure (add paired measure) or adjust weighting. 
      - *Exit*: Accept with monitoring (paired measure to be developed) or handoff to you if widening is costly/impractical.
    - **Drift risk only**: Remedy = shorter review cycle and re-baselining. 
      - *Exit*: Accept with monitoring (shorter review cycle).
    - **Multiple risks**: Combine remedies; likely handoff to you for prioritization.
    - **No risks detected**: Accept outright.

  - **Handoff to you (values decisions)**:
    - When the remedy involves significant trade-offs (e.g., which subgroup to protect in Leakage, cost of audit vs. risk in Gaming, acceptable review frequency in Drift).
    - When the procedure is inconclusive (e.g., no data and experts disagree).
    - When the measure is high-stakes and the risk is high (e.g., home-care algorithmic score).
    - *Information needed*: 
      - Summary of risks and uncertainties.
      - Options for remedies and their costs/benefits.
      - Stakeholder views (if collected).

  ---

  **Worked Examples**

  **Example (a): Employment provider measured by number of clients in work at six months**

  - *Step 0 (Pre-screen)*: We have data (employment records at 6 months). Proceed.
  - *Step 1 (Gaming)*:
    - *Data*: Historical data shows that some providers focus on quick placements (e.g., temporary jobs) that may not last to 12 months. Client survey shows dissatisfaction in job quality.
    - *Three cheapest ways*: 
      1. Place clients in short-term jobs that end just after 6 months.
      2. Focus on clients already near employment (cream-skimming).
      3. Misreport employment status (fraud).
    - *Outcome movement*: In (1) and (2), the outcome (sustainable employment) does not improve; in (3), it is false. 
    - *Conclusion*: Gaming risk present.
  - *Step 2 (Leakage)*:
    - Could providers deprioritize hard-to-employ clients? Data shows that when the measure rises, employment for clients with barriers falls. 
    - *Conclusion*: Leakage risk (subgroup shift).
  - *Step 3 (Drift)*: 
    - Correlation with 12-month employment is stable in good economies but falls in recessions (data shows this). Context is volatile.
    - *Conclusion*: Drift risk present.
  - *Classification*: Multiple risks (Gaming, Leakage, Drift).
  - *Exit*: Handoff to you. The measure as proposed is rejected. Options: 
    - Add verification (job quality, employer checks) for Gaming.
    - Add a paired measure (e.g., employment at 12 months or for disadvantaged subgroups) for Leakage.
    - Shorten review cycle and index to economic conditions for Drift.
    - *Note*: This goes against your public commitment, so the procedure flags it as high risk and recommends substantial revision.

  **Example (b): Supported housing measured by proportion not returning to homelessness at 12 months**

  - *Step 0*: Data available. Proceed.
  - *Step 1 (Gaming)*:
    - *Three cheapest ways*:
      1. Select clients with lower risk of homelessness (cream-skimming).
      2. Provide temporary housing (e.g., extended stays with family) that collapses after 12 months.
      3. Avoid recording returns to homelessness (underreporting).
    - *Outcome*: (1) and (2) may not represent true stability; (3) is false. Gaming risk.
  - *Step 2 (Leakage)*:
    - Could providers focus on 12-month milestone at the expense of longer-term stability? Data shows a drop in stability at 18 months when the 12-month measure rises. Leakage risk (time shift).
  - *Step 3 (Drift)*: 
    - The measure is stable if housing market and support services are stable. However, rent inflation could break the correlation. Drift risk in volatile markets.
  - *Classification*: Multiple risks.
  - *Exit*: Accept with monitoring: 
    - Audit returns data (Gaming). 
    - Add a paired measure (e.g., 24-month stability or quality of housing) for Leakage. 
    - Review annually and adjust for housing market changes (Drift).

  **Example (c): Home-care algorithmic risk score predicting emergency admissions**

  - *Step 0*: We have the algorithmic score and admission data, but the score is the target (self-referential).
  - *Step 1 (Gaming)*:
    - *Three cheapest ways*:
      1. Manipulate input data to the algorithm (e.g., underreport client risk factors).
      2. Focus on reducing the score for high-risk clients without actually improving care (e.g., by gaming the features the model uses).
      3. Discharge high-risk clients to avoid being scored.
    - *Outcome*: In all cases, the actual risk (and admissions) may not decrease. Gaming risk high.
  - *Step 2 (Leakage)*: 
    - Could providers shift effort from low-risk clients (who don't affect the score much) to high-risk? Unmeasured harm to low-risk clients. Leakage risk.
  - *Step 3 (Drift)*: 
    - The algorithm is trained on historical data. If client demographics or health patterns change, the score may decouple from actual admissions. Drift risk high.
  - *Classification*: Multiple risks and self-referential problem.
  - *Exit*: Reject. The procedure breaks because the measure is circular (optimizing a model we control). Handoff to you with a strong warning.

  ---

  **Reflexive Problem: Preventing the Procedure from Being Gamed**

  - **Threats**:
    - Analysts may rubber-stamp to avoid work.
    - Programme managers and providers may learn to present only favorable evidence.

  - **Countermeasures**:
    1. **Random audits**: Have you or a senior analyst randomly review 10% of accepted proposals to check rigor.
    2. **Blinding**: Where possible, have analysts evaluate measures without knowing the proposer.
    3. **Diversity of input**: Require analysts to consult at least two independent sources (e.g., a programme manager and a provider) for Steps 1a and 2.
    4. **Documentation**: Require full documentation of data and reasoning. Any gaps must be explicitly noted.
    5. **Rotation**: Rotate analysts to prevent familiarity.
    6. **Calibration meetings**: Hold monthly meetings to discuss edge cases and maintain standards.
    7. **No checklist immunity**: State that passing the procedure does not absolve providers of accountability; post-hoc audits can still penalize Gaming.

  - **Limitation**: No checklist is fully robust. The honest answer is that we must rely on institutional culture and oversight.

  ---

  **Limitations and Confidence Assessment**

  - **What the procedure cannot do**:
    - Replace judgment in novel or high-stakes situations (handoffs are necessary).
    - Detect risks without any data or expertise.
    - Prevent new forms of Gaming/Leakage that were not anticipated.
    - Account for rare events or black swans.
    - Solve the self-referential problem in algorithmic measures (as in Example c).

  - **Confidence in the three-fold division**:
    - High confidence that Gaming, Leakage, and Drift are distinct:
      - **Gaming** is about false positives (score up, outcome not).
      - **Leakage** is about trade-offs (outcome up for some, down for others).
      - **Drift** is about changing context (the same action yields different outcomes over time).
    - They share a root cause (proxy not equal to goal) but have different mechanisms and remedies.

  - **Least confident step**: 
    - Step 1a (Three Cheapest Ways). It relies on imagination and testimony. Without data, it's subjective. But it's the best we can do with limited resources.

  ---

  **Closing**

  This procedure forces explicit classification into Gaming, Leakage, or Drift (or combinations) and tailors remedies. It is designed for practicality but has inherent limitations. Implement it with oversight to mitigate reflexive gaming. The employment example (a) fails the test, per your request.
answer: |-
  Below is the screening procedure for performance measure proposals, structured as requested. It is designed to be executed by analysts in under an hour, without statistical or philosophical expertise, and forces classification into Gaming, Leakage, or Drift (or combinations). The procedure emphasizes actionable remedies, evidence-based answers, and clear exit conditions. 

  ---

  ### **1. Screening Questions & Sufficient Answers**  
  Analysts must answer questions in order. Each question requires concrete evidence or reasoning to proceed. If data is unavailable (noted where relevant), fallbacks are provided. **Time allocation:** 5-7 minutes per question.  

  #### **Question 1: Can the provider increase the measure without improving the intended client outcome?**  
  *(Tests for Gaming)*  
  - **Sufficient answer:**  
    - **Evidence required:** Historical data from quarterly provider returns or client surveys showing:  
      - Instances where the measure improved but client outcomes did not (e.g., job placements increased but client surveys show no income gain).  
      - A correlation coefficient ≤0.4 between the measure and outcome in existing data (calculated via simple spreadsheet correlation).  
    - **If no historical data:** Use testimony from two independent sources (e.g., frontline staff from another provider, audit reports) confirming specific tactics (e.g., "providers prioritize quick-but-unstable jobs to hit placement targets").  
    - **Fallback if no data/testimony:** Analyst must proceed to Step 2 (Three Cheapest Ways test) but flag Gaming risk as "undetermined." Cost: Higher uncertainty; remedy defaults to verification.  
  - **Move on if:** Evidence shows no disconnect (e.g., strong correlation) OR Gaming risk is confirmed/undetermined.  

  #### **Question 2: Could improving the measure degrade outcomes for unmeasured clients or unmeasured aspects of the service?**  
  *(Tests for Leakage)*  
  - **Sufficient answer:**  
    - **Evidence required:**  
      - Disaggregated data (by client subgroup, geography, or time period) showing negative correlations (e.g., when the measure rises for urban clients, outcomes fall for rural clients).  
      - Client survey data indicating unmet needs in unmeasured areas (e.g., housing stability improves, but mental health support declines).  
    - **If no disaggregated data:** Testimony from programme managers or providers on effort-shifting (e.g., "we’d focus on clients near the 12-month mark to hit homelessness targets, neglecting new entrants").  
    - **Fallback if no data/testimony:** Analyst reviews caseload/task coverage:  
      - If the measure covers <70% of the provider’s caseload or <50% of their core tasks (per contract), Leakage risk is assumed. Cost: Over-pairing measures may increase monitoring burden.  
  - **Move on if:** Evidence shows no subgroup/task trade-offs OR Leakage risk is confirmed.  

  #### **Question 3: Is the measure’s relationship with the outcome stable under changing external conditions?**  
  *(Tests for Drift)*  
  - **Sufficient answer:**  
    - **Evidence required:** Time-series data (2+ years) showing:  
      - Stable correlation (±0.2 variation) between the measure and outcome across economic cycles, policy changes, or caseload shifts.  
      - No breakdown in correlation during known shocks (e.g., COVID-19).  
    - **If no time-series data:** Testimony from two experts (e.g., economists, senior programme managers) on volatility of key drivers (e.g., "rent inflation breaks homelessness-proxy links").  
    - **Fallback if no data/testimony:** Assume Drift risk if ≥2 volatile drivers exist (e.g., labour market + tech changes). Cost: Shorter review cycles increase administrative workload.  
  - **Move on if:** Evidence shows stability OR Drift risk is confirmed.  

  #### **Question 4: What are the three cheapest ways a provider could substantially lift the score within one year?**  
  *(Sharpens Steps 1–3; forces specificity)*  
  - **Procedure:**  
    - **Prompt for:** Concrete, low-resource actions (e.g., "reallocate staff to clients near employment threshold," "stop serving high-risk homeless clients").  
    - **Whose testimony counts:** Frontline staff (via programme manager interviews) or provider proposals. Analyst must cite sources.  
    - **Avoid padding:** Scenarios must be observed in historical data, similar programs, or attested by ≥2 sources. Reject vague/improbable tactics (e.g., "providers bribe clients").  
    - **Evaluate outcome movement:** For each tactic, use:  
      - Data: If tactic was used before, did outcomes move?  
      - Testimony: Would frontline staff say outcomes improve?  
    - **If analyst cannot list three:** Escalate to programme manager for input. If still unclear, classify as "undetermined risk" and proceed.  
  - **Output:** Table of tactics, outcome impact (↑/↓/↔), and risk type (Gaming if ↓/↔; Leakage if mixed).  

  ---

  ### **2. Exit Conditions**  
  Based on the above, the procedure concludes with one of:  
  - **Reject:** High Gaming risk with no verifiable remedy (e.g., fraud-prone measures).  
  - **Accept with monitoring:** Risks exist but are remediable. Specify:  
    - *Gaming:* "With verification + clawback."  
    - *Leakage:* "With paired measure [e.g., add subgroup tracking]."  
    - *Drift:* "With 6-month review (not annual)."  
  - **Accept outright:** No risks detected.  
  - **Handoff to you:** Required when:  
    - Values trade-offs arise (e.g., Leakage remedy excludes a subgroup due to cost).  
    - Risks are high but strategic (e.g., your public commitment to a measure).  
    - **Information needed for handoff:**  
      - Summary of risks and evidence gaps.  
      - Cost of remedy (e.g., audit budget, paired measure design).  
      - Stakeholder impact (e.g., "10% rural clients unmeasured").  

  ---

  ### **3. Worked Examples**  
  #### **Example (a): Employment provider measured by clients in work at six months**  
  - **Q1 (Gaming):** Historical data shows placements ↑ but client surveys show 40% in low-wage, unstable jobs (no outcome gain). *Gaming risk confirmed*.  
  - **Q2 (Leakage):** Disaggregated data reveals providers deprioritize clients with disabilities (employment ↓20% for this subgroup). *Leakage risk confirmed*.  
  - **Q3 (Drift):** Time-series data stable in strong economies but decouples in recessions (correlation drops to 0.3). *Drift risk confirmed*.  
  - **Q4 (Three Cheapest Ways):**  
    1. Cream-skimming easy-to-employ clients (outcome ↑ for them, ↓ for others: Leakage).  
    2. Short-term contracts ending at 6 months (outcome ↔: Gaming).  
    3. Reducing support services to boost placements (outcome ↓: Gaming).  
  - **Exit:** **Handoff to you**. Measure rejected for your sign-off due to multiple risks. Proposed remedy: Pair with 12-month retention metric + quarterly audits. *This contradicts your public commitment; procedure flags it as high-risk*.  

  #### **Example (b): Supported housing measured by proportion not returning to homelessness at 12 months**  
  - **Q1 (Gaming):** No historical disconnect; strong correlation (0.8) with client outcomes. *No Gaming risk*.  
  - **Q2 (Leakage):** Testimony reveals providers shift resources from mental health support to housing stability. *Leakage risk confirmed*.  
  - **Q3 (Drift):** Rent inflation broke correlation in 2/5 past years. *Drift risk confirmed*.  
  - **Q4 (Three Cheapest Ways):**  
    1. Extend temporary stays to cross 12-month mark (outcome ↔: Gaming).  
    2. Avoid high-risk clients (outcome ↓ for them: Leakage).  
    3. Misreport returns to homelessness (outcome ↔: Gaming).  
  - **Exit:** **Accept with monitoring**. Remedy: Paired measure for mental health outcomes + 9-month reviews.  

  #### **Example (c): Home-care algorithmic risk score predicting emergency admissions**  
  - **Q1 (Gaming):** Algorithm uses provider-reported data; testimony confirms providers underreport risk factors. *Gaming risk confirmed*.  
  - **Q2 (Leakage):** Providers focus on high-risk clients; unmeasured low-risk clients show ↑ hospitalizations. *Leakage risk confirmed*.  
  - **Q3 (Drift):** Algorithm trained on outdated data; correlation decayed when client demographics shifted. *Drift risk confirmed*.  
  - **Q4 (Three Cheapest Ways):**  
    1. "Game" input features (e.g., report fewer falls) without care changes (outcome ↔: Gaming).  
    2. Discharge high-risk clients (outcome ↓: Leakage).  
    3. Manipulate model weights via feedback loops (outcome ↔: Gaming).  
  - **Exit:** **Reject**. Self-referential system breaks the procedure; risks are inherent and unmanageable. *Demonstrates collapse under circular incentives*.  

  ---

  ### **4. Reflexive Problem: Defending Against Procedure Gaming**  
  - **Threats:**  
    - Providers/programme managers learn to "check the boxes" (e.g., cherry-pick data).  
    - Analysts shortcut to avoid rework (e.g., always accept low-stakes measures).  
  - **Countermeasures:**  
    1. **Blind reviews:** Analysts evaluate proposals without knowing the source (provider vs. programme manager).  
    2. **Random audits:** You review 10% of decisions monthly, focusing on "accept outright" classifications.  
    3. **Stakeholder triangulation:** Require two independent testimonies for each "sufficient answer" (e.g., frontline + provider).  
    4. **Analyst rotation:** Assign measures randomly to avoid familiarity.  
    5. **Transparency logs:** Publish de-identified decision rationales (e.g., "Measure X rejected for Gaming; evidence: Y").  
  - **Limitation:** No checklist is fully robust. Honest answer: **The procedure will degrade over time** if not embedded in a culture of accountability (e.g., your team audits outcomes, not just process). Prioritize random audits and stakeholder diversity.  

  ---

  ### **5. Limitations & Confidence Assessment**  
  - **What the procedure cannot do:**  
    - **Replace values judgments:** It flags trade-offs (e.g., Leakage) but cannot decide what is "acceptable harm."  
    - **Predict novel risks:** Only detects known failure modes; new Gaming tactics may emerge.  
    - **Handle self-referential systems:** Fails for algorithmic measures (Example c) due to feedback loops.  
    - **Compensate for data gaps:** Fallbacks rely on testimony, which can be biased.  
  - **Confidence in the three-fold division:**  
    - **High confidence (90%)** Gaming, Leakage, and Drift are distinct:  
      - Gaming is fraud/effortless score inflation (remedy: verification).  
      - Leakage is zero-sum effort-shifting (remedy: pairing).  
      - Drift is changing context (remedy: re-baselining).  
      - *Evidence:* Each has unique symptoms (e.g., Leakage requires subgroups; Drift requires time-series).  
    - **Lowest-confidence step:** Q4 (Three Cheapest Ways).  
      - **Why:** Relies on imagination/testimony; may miss subtle tactics. Mitigation: Strict sourcing rules, but still subjective.  

  **Closing:** The procedure is a practical shield against Goodhart failures but requires your vigilance on values trade-offs and reflexive gaming. Implement with random audits and blind reviews to sustain integrity.
