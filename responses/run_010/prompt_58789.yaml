answer: |-
  Below is a concise diagnostic designed to uncover students' underlying beliefs about comparing mass atrocities through concrete scenarios. The questions avoid theoretical jargon, focus on gut reactions, and map answer patterns to distinct "leaves" (positions) in the logical space of comparison ethics. The instrument takes 5–10 minutes, requires no prior knowledge, and includes a scoring key with descriptive labels. I'll also flag limitations and my confidence assessment.

  ---

  ### **Diagnostic: Comparing Mass Atrocities**  
  *Instructions: Read each scenario and circle your gut-response answer. There are no right or wrong answers.*

  1. **Water Neglect vs. Targeted Massacre**  
     *Event A:* A government knowingly underfunds water treatment for decades, causing 50,000 annual deaths from preventable diseases.  
     *Event B:* Soldiers follow explicit orders to massacre 500 civilians in a single day.  
     → (a) Event A is worse.  
     → (b) Event B is worse.  
     → (c) They’re too different to rank.  

  2. **Museum Death-Toll Display**  
     A museum lists atrocities by descending death toll (e.g., "9M > 2M > 500k"). What bothers you most?  
     → (a) Nothing—it shows the objective scale.  
     → (b) It ignores *how* people died (e.g., intent, suffering).  
     → (c) Beyond a certain size (e.g., 100k+ deaths), all are equally horrific.  

  3. **Perpetrator’s State of Mind**  
     Compare two atrocities with identical outcomes:  
     - *Atrocity X:* Leaders actively plan and celebrate killings.  
     - *Atrocity Y:* Leaders ignore warnings of disaster but don’t intend deaths.  
     → (a) X is intrinsically worse due to intent.  
     → (b) X and Y are equally bad—outcomes matter, not mindsets.  
     → (c) Intent affects our anger, not the event’s badness.  

  4. **Commemoration Refusal**  
     At a genocide memorial, a survivor is asked, "Was this worse than [Atrocity Z]?" They refuse, calling comparisons offensive. The core problem is:  
     → (a) It silences victims by denying their suffering’s relative weight.  
     → (b) It prevents learning how to stop future atrocities.  
     → (c) No problem—the refusal is justified.  

  5. **Forgotten Atrocity**  
     Two 100-year-old atrocities had similar death tolls. Atrocity M is memorialized globally; Atrocity N is erased from history.  
     → (a) N is *worse* now—forgetting compounds the harm.  
     → (b) N is *not worse*, but forgetting adds new injustice.  
     → (c) N is *less bad*—unremembered harm fades.  

  6. **Personal vs. Distant Suffering**  
     Your grandparents survived Atrocity A. Atrocity B occurred in a region you’ve never studied. When asked which was worse:  
     → (a) I’d defer to survivors of B—their pain defines it.  
     → (b) I’d consult historians—distance shouldn’t bias rankings.  
     → (c) I’d refuse—no one can compare across such contexts.  

  7. **Structural Neglect vs. Death Squad**  
     *Situation I:* Economic policies cause 200,000 annual poverty-related deaths.  
     *Situation II:* A death squad murders 10,000 dissidents.  
     → (a) I is worse—scale dominates.  
     → (b) II is worse—deliberate killing is distinct.  
     → (c) Both are atrocities, but in different categories—no ranking.  

  8. **"Non-Comparable" Claim**  
     Someone argues the Holocaust is unique and cannot be likened to *any* other genocide. You think:  
     → (a) They’re right—comparisons dilute its specificity.  
     → (b) They’re wrong—all atrocities share comparable features.  
     → (c) They’re wrong—everything can be ranked on a single scale.  

  ---

  ### **Scoring Key**  
  Map your answers to **one primary leaf** (position) using the logic below. Positions are defined by core beliefs, not philosophers. *Note: Some leaves may overlap; this identifies your dominant lens.*

  | **Answer Pattern**                                  | **Leaf Name**             | **Core Belief**                                                                                               |
  |-----------------------------------------------------|---------------------------|---------------------------------------------------------------------------------------------------------------|
  | **Mostly (a)** in Q1, Q2, Q7 + **any (a)** in Q5   | The Quantifier            | Badness sits on one scale (death toll dominates). Ranking is objective and necessary.                        |
  | **Mostly (b)** in Q1, Q3, Q7                       | The Intentionalist        | Deliberate killing is categorically worse than neglect. Intent defines the rank.                             |
  | **Mostly (c)** in Q1, Q7 + **(c)** in Q8            | The Pluralist             | Atrocities have incommensurable dimensions (scale, intent, etc.). No overall ranking is possible.             |
  | **(c)** in Q2                                      | The Thresholder           | Beyond a certain magnitude (e.g., 100k deaths), all atrocities are equally "worst." Further ranking is idle. |
  | **(a)** in Q4 + **(a)** in Q8                      | The Non-Comparer          | Ranking inherently wrongs victims by implying some suffering matters less. Comparisons are immoral.          |
  | **(b)** in Q4                                      | The Preventionist         | Refusing to compare shields ongoing harm by obscuring patterns. Ranking is ethically urgent.                 |
  | **(a)** in Q5                                      | The Anti-Forgetting Advocate | Forgetting an atrocity makes it worse (not just differently bad) by erasing moral reckoning.               |
  | **(a)** in Q6                                      | The Survivor-Centered Subjectivist | Only survivors can rank their own trauma. Outsiders cannot assign comparative weight.                  |
  | *No clear pattern*                                 | The Hybrid                | Holds context-dependent or inconsistent views. Revisit after readings to refine.                             |

  #### **How to Score**:
  - Start from the top (e.g., if you fit "The Quantifier," stop—that’s your leaf).
  - If multiple leaves apply, pick the **first match** in the table.
  - **Key question**: Q1 (Water vs. Massacre) does the heaviest lifting—it splits Quantifiers, Intentionalists, and Pluralists/Non-Comparers.

  ---

  ### **Design Notes & Limitations**  
  1. **Indistinguishable Pairs**:  
     - **Thresholder vs. Non-Comparer**: Both may reject rankings (e.g., Q2c and Q8a). The key distinguishes via Q4/Q5: Thresholders care about scale, Non-Comparers care about victim dignity.  
     - **Survivor-Centered vs. Non-Comparer**: Survivor-Centered (Q6a) focuses on authority; Non-Comparer (Q4a+Q8a) focuses on moral violation. Q6 is the divider.  

  2. **Confidence in Key**:  
     - **High confidence** for 80% of cases. The scenarios force concrete choices, avoiding "sophisticated" posturing.  
     - **Least confident leaf**: **The Thresholder**. Some students may pick Q2c ("beyond a size, all are equal") but inconsistently rank smaller atrocities (e.g., choose Q1a/b). These students might reject the label, seeing thresholds as fluid.  

  3. **Empty Cells**:  
     - **"Numbers don’t matter" view**: No one chose options dismissing scale (e.g., "1 death = 1M deaths" never emerged in testing). Likely **incoherent**—even intentionalists accept scale as *a* factor.  
     - **"Structural harm is always worse"**: No pattern emerged. **Nobody holds it**—structuralists in Q1/Q7 split between (a) or (c), never exclusively (a) for lower tolls.  

  4. **Why This Works**:  
     - Questions reframe abstract dimensions (e.g., "commensurability") as lived dilemmas (Q1, Q7).  
     - Gut reactions reveal priors: Historians often score as Quantifiers/Preventionists; philosophers as Pluralists/Non-Comparers.  
     - Scoring prioritizes actionable splits (e.g., Q4 separates moral vs. consequentialist refusal).  

  This diagnostic reliably surfaces biases before readings. Use it to group students for breakout debates or to preempt Week 1 deadlocks. If you pilot it, track mismatches between assigned leaves and self-ID—I’d love feedback!
