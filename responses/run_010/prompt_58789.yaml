  Scenario: Two atrocities: 
    Atrocity X: A leader orders a genocide with clear intent and a detailed plan.
    Atrocity Y: A leader, through reckless decisions and ignoring warnings, causes a famine that kills millions. The leader didn't specifically want anyone to die but didn't care either.
  Answer choices:
  a) Atrocity X is worse because of the direct intent to kill.
  b) Atrocity Y is worse because the death toll is higher and the leader's negligence was extreme.
  c) The state of mind only affects how we judge the perpetrator, not which event is worse.

  Question 3: [Probes: standing of the comparer]
  Scenario: You are at an international conference. A historian from a country that suffered Atrocity P (which affected your own grandparents) and Atrocity Q (which occurred in a distant country you know little about) is asked to rank which was worse. The historian says Atrocity P was worse. Then, a survivor of Atrocity Q says that Atrocity Q was worse. How do you react?
