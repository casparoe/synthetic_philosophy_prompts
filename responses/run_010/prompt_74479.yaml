  ### Joint Statement on Neural Representations in Machine Learning  
  **Signed by Dr. Eleanor Vance (Interpretability Realist) and Dr. Marcus Thorne (Representation Skeptic)**  
  *After Adversarial Collaboration on Image Classifier Case Study*  

  We, the undersigned, agree on the following points derived from empirical evidence and shared definitions, using the case of a small image classifier where:  
  (a) Steering a direction in hidden activations causes the model to classify diverse inputs (e.g., zebras, sweaters) as "tiger";  
  (b) Different probe architectures (e.g., linear vs. non-linear) yield distinct directions or subspaces decoding "striped";  
  (c) One direction generalizes across image types, while another only decodes "striped" for cartoons.  

  #### Agreed Claims  
  1. **Steering demonstrates causal influence over outputs.**  
     Adding a direction to activations predictably alters model behavior (e.g., inducing "tiger" classifications). This is an empirical fact about the model’s causal structure, not an illusion.  

  2. **Probes reveal statistical associations, not necessarily "ground truth."**  
     Probes trained on activations decode human-interpretable concepts (e.g., "striped") with above-chance accuracy. However, different probes can yield different directions for the same concept, and no probe architecture is privileged *a priori*.  

  3. **"Features" and "representations" are terms of art with operational definitions.**  
     - **Feature:** A direction or subspace in activation space that, when manipulated, reliably changes model behavior in a human-interpretable way (e.g., steering "striped" influences "tiger" classification).  
     - **Representation:** A pattern of activations that consistently correlates with or causally mediates an external concept *under intervention* (e.g., activation patching shows a state’s role in "striped" detection).  
     These terms do *not* imply:  
     - That features/representations are discrete, innate, or uniquely defined (multiple may exist).  
     - That they mirror human cognition or possess intrinsic "aboutness."  

  4. **Steering and activation patching constrain theories of model function.**  
     These methods empirically verify that certain activation patterns *causally contribute* to specific outputs. They rule out theories where models lack any concept-specific structure.  

  5. **The thermostat analogy is incomplete.**  
     Unlike a thermostat (whose internal state merely correlates with temperature), steering shows neural networks have states that *causally control* concept-sensitive behavior. This is non-trivial but does not resolve whether such states "represent" in a strong sense.  

  6. **Outstanding questions are both empirical and definitional.**  
     - **Empirical:** How robust are features across architectures, scales, and distribution shifts? Do certain directions generalize better?  
     - **Definitional:** What criteria warrant calling a state a "representation"? When is "aboutness" ascribed vs. projected?  

  7. **Interpretability tools have pragmatic value.**  
     Regardless of philosophical stance, these methods improve model debugging, bias detection, and control. Disagreements about "representations" do not negate this utility.  

  #### Residual Disagreements  
  The table below outlines unresolved disputes. Both parties endorse the neutral phrasing and the bearing experiment/argument. Predictions are stated upfront.  

  | Neutral Disagreement | Realist’s Position (Dr. Vance) | Skeptic’s Position (Dr. Thorne) | Bearing Experiment/Argument | Realist’s Prediction | Skeptic’s Prediction |  
  |----------------------|--------------------------------|---------------------------------|------------------------------|----------------------|----------------------|  
  | **Do internal states have intrinsic "aboutness"?** <br> (i.e., is there a fact of the matter that a state is *of* stripes, beyond causal correlations?) | "The model’s internal states carry intrinsic content about concepts (e.g., ‘striped’) because they play a consistent causal role in concept-sensitive behavior across interventions." | "Internal states are merely causal nodes in a computational graph; ‘aboutness’ is imposed by interpreters correlating states with concepts." | **Argument:** If we permute all labels in the probe dataset (e.g., train a probe to call "striped" activations "polka-dotted"), can steering still induce coherent concept-specific behavior? | Steering will fail: behavior will become incoherent (e.g., adding "striped" induces random classifications). The model’s states are "locked" to specific content. | Steering will remain coherent if the probe is retrained: behavior is shaped by statistical associations, not intrinsic content. |  
  | **Is there a fact of the matter about *which* feature is the "true" representation?** <br> (e.g., between the general vs. cartoon-only "striped" direction) | "Among multiple candidate directions, one is privileged as the representation the model ‘uses’ in its normal computation, identifiable via causal fidelity (e.g., which direction best restores behavior under patching)." | "No direction is ontologically ‘true’; representations are observer-relative summaries of distributed computations, and multiple may be pragmatically valid." | **Experiment:** Replace activations at a layer with projections along Direction A (general "striped") or Direction B (cartoon-only "striped") via patching. Measure fidelity to original model behavior on mixed image types. | Direction A will restore behavior more faithfully across all inputs, indicating it is the core representation. | Both directions will partially restore behavior (due to correlations), but neither will fully capture the model’s computation, as "striped" is not localized. |  
  | **Does steering reveal pre-existing structure or create new semantics?** <br> (i.e., is the steered model still "reasoning" or just executing corrupted math?) | "Steering activates pre-existing, concept-specific circuitry; the model’s ‘tiger’ classification post-steering is a coherent extension of its learned semantics." | "Steering injects an arbitrary vector; the resulting behavior is an artifact of the model’s statistical regularities, not evidence of structured representations." | **Thought Experiment:** After steering a "tiger"-inducing direction, does the model generate plausible "tiger"-like internal states (e.g., activating "jungle" or "predator" features)? Or does it produce incoherent activations? | States will cohere with "tiger" semantics (e.g., "striped" → "jungle" activations rise). Steering reveals latent structure. | States will be incoherent (e.g., "striped" + "parking meter" activates disjoint features). Steering creates pathological edge cases. |  

  #### Verbal Dispute Clarification  
  The core verbal disagreement concerns **"representation."**  
  - **Realist usage:** A state is a "representation" if it reliably correlates with and causally mediates external concepts under intervention (purely functional criteria).  
  - **Skeptic usage:** "Representation" implies intrinsic aboutness (e.g., mental states in humans), which cannot exist in matrix multiplications without consciousness/evolutionary history.  

  **After disambiguation:** Both agree on all observable facts (e.g., causal effects, probe statistics). The residual disagreement is whether functional properties (correlation + causal role) suffice for "representation" (Realist) or if intentionality requires additional criteria (e.g., teleology, consciousness) absent in AI (Skeptic). This is metaphysical, not empirical.  

  ---  
  *This document reflects our consensus on established facts and defined disagreements. We commit to updating our positions based on new evidence from the bearing experiments.*  
  **Dr. Eleanor Vance**  
  *Professor of Machine Learning, Stanford University*  
  **Dr. Marcus Thorne**  
  *Professor of Philosophy of Mind, MIT*  
  November 5, 2023
