prompt: |-
  I cover AI and cognitive science for a magazine, and for about three months now I've been trying to write a piece on interpretability that doesn't just amount to "researchers are finding features inside neural nets, wow." Every draft dies on the same question, which nobody on either side will answer straight: does a trained network actually *have* representations — is there a fact of the matter about what its internal states are about — or are we projecting our own categories onto a blob of matrix arithmatic and then being impressed that the projection predicts things? I've decided to build the piece around a fake-but-deadly-serious document: the joint statement that a committed interpretability realist and a committed skeptic about neural representations could both sign after a genuine adversarial collaboration.

  Here's the case that convinced me the two sides aren't merely talking past each other, and that I'd like you to treat as the shared test bed for the document. A researcher shows me a small image classifier. They hunt for a direction in the hidden activations that lines up with "striped," and they find one; add a multiple of that direction at inference time and the model starts calling things tigers — a zebra, a striped sweater, a parking meter that happens to have stripes painted on it. Very cool. But the same model, read out with a different probe architecture, gives a different subspace that also decodes "striped," and there's a second direction that decodes it only for cartoonish images and not photographs. Ask which one is *the* representation and the room splits. My philosophy friend says this is just the 1980s thermostat debate with GPUs; the researcher says the thermostat had no steering experiments. Both think the other is dodging something.

  So: write that joint statement, in American English. I want a numbered section of claims both parties can sign — about what steering and activation-patching results establish and what they don't, about what "feature" and "representation" are doing as terms of art in the field, and about which of the open questions are empirical and which are really definitional. Then the residual disagreements as a table, with columns for: the disagreement stated neutrally, the wording the realist would accept for their own side, the wording the skeptic would accept for theirs, the experiment or argument or thought case both agree would bear on it, and each side's prediction about the outcome, written down before the result. No strawmen — don't let the skeptic come out as a nihilist who thinks the work is worthless, and don't let the realist come out as someone who thinks a linear probe settles metaphysics. Where you judge part of the dispute to be verbal, i.e. where the two are using "representation" to mean different things and would agree on every observable fact, say explicitly which part, why, and what is left over afterwards that isn't verbal. And please dont tack a bibliography onto the end; I need the document itself, roughly the length of something two people with reputations on the line could actually put their names to.
reasoning: |-
  We are crafting a joint statement between a realist and a skeptic regarding neural representations in AI. The goal is to have both sign on to a set of agreed-upon points and then clearly outline the remaining disagreements in a structured way.

  The scenario: a small image classifier has multiple ways to decode "striped" (via different probe architectures) and steering experiments (adding a direction to activations) that change the model's output in semantically meaningful ways. The realist thinks this shows the model has representations; the skeptic thinks we're projecting.

  We will have:

  1. A numbered section of agreed claims (both can sign).
  2. A table for residual disagreements with columns:
     - Disagreement stated neutrally
     - Realist's wording for their position
     - Skeptic's wording for their position
     - Experiment/argument/thought experiment that both agree would bear on the disagreement
     - Realist's prediction
     - Skeptic's prediction

  We must avoid strawmen: the skeptic is not a nihilist (the work is useful, but not as evidence for representations in the strong sense), and the realist doesn't think linear probes settle metaphysics.

  Where the dispute is verbal (different definitions of "representation"), we will explicitly say so and then state what non-verbal disagreement remains.

  Let's outline the agreed claims first:

  Agreed Claims (numbered section):

  1. **Steering experiments demonstrate causal influence**: When we add a vector (found by some method) to the activations, it causes the model to output a specific class (e.g., "tiger") for a wide variety of inputs. This is an empirical fact about the model's behavior.

  2. **Probes can find statistical regularities**: Probes (linear or non-linear) trained on hidden activations can decode human-interpretable concepts (like "striped") with above-chance accuracy. This is also an empirical fact.

  3. **Multiple probes can yield different directions**: There is no unique "correct" probe architecture. Different probe designs (e.g., linear vs. non-linear, or trained on different datasets) may find different directions or subspaces that correlate with the same concept. This is observed and does not by itself invalidate either position.

  4. **The term "feature" in the field**: In the interpretability literature, "feature" is often used to refer to a direction or subspace in activation space that, when manipulated (e.g., via steering), has a predictable and interpretable effect on the model's output. This is a term of art and does not necessarily imply that the model "has" that feature in a strong ontological sense.

  5. **The term "representation" in the field**: Similarly, "representation" is often used to mean a pattern of activations that correlates with an external concept (as detected by a probe) or that plays a causal role in the model's computation (as shown by intervention). This does not necessarily imply that the model has internal states that are "about" that concept in the same way human thoughts are.

  6. **Open questions are both empirical and definitional**: There are empirical questions about how robust and general these findings are (e.g., across model architectures, scales, and tasks). There are also definitional questions about what counts as a "representation" and under what conditions we should ascribe intentionality or aboutness to an AI system.

  7. **The utility of interpretability tools**: Both agree that these tools (steering, probing) are useful for understanding and controlling model behavior, regardless of the philosophical debate.

  Now, the table of residual disagreements:

  We structure the table with the following columns:

  | Disagreement (neutral) | Realist's Position | Skeptic's Position | Bearing Experiment/Argument | Realist's Prediction | Skeptic's Prediction |

  We identify key disagreements:

  Disagreement 1: Ontological status of representations
  - Neutral: Whether the model has internal states that are genuinely about external concepts (e.g., stripes) in a way that is not just a projection by the interpreter.
  - Realist: The model does have representations in a substantive sense; the internal states are causally involved in the computation and carry information about the external concept in a manner that is independent of the interpreter's probe choice.
  - Skeptic: The model's internal states are not about external concepts in a substantive sense; the apparent aboutness is a result of the interpreter's choice of probe and the way we choose to describe the system. The model's behavior can be explained without invoking representations as having intrinsic aboutness.
  - Bearing: An experiment that tests whether the model's behavior in novel situations (e.g., out-of-distribution images) aligns with the concept as defined by the probe. For instance, if we steer with a "striped" vector and the model starts calling a completely novel object (say, a striped sound wave visualized as an image) a tiger, does that show the model has a general concept of stripes or just that the steering vector is causing a class change?
  - Realist's Prediction: The model will generalize the concept in ways that align with human-like abstraction (e.g., recognizing stripes in any form) because the representation is about stripes.
  - Skeptic's Prediction: The model will sometimes fail to generalize (or generalize in ways that are inconsistent with the concept) because the steering vector is tied to the statistical patterns in the training data and not a general concept.

  Disagreement 2: Uniqueness of representations
  - Neutral: Whether there is a fact of the matter about which of the multiple directions (found by different probes) is the "true" representation of a concept.
  - Realist: Even though multiple probes may find different directions, there is a fact of the matter about which one is the representation the model actually uses in its computation. This might be determined by which one is causally involved in the model's normal operation (e.g., via activation patching).
  - Skeptic: There is no fact of the matter about which direction is the "true" representation; the model does not have a unique representation for a concept. The different directions are different ways of reading the same underlying computation, and the choice is pragmatic.
  - Bearing: Conduct an activation patching experiment: replace the activations at a layer with the component along a particular direction (from probe A) and see if the model behaves as if it saw the concept. Then do the same with a different direction (from probe B). If one direction restores the model's normal behavior better than the other, that might indicate it is more central.
  - Realist's Prediction: One of the directions (likely the one that is more causally relevant) will have a much stronger effect in restoring the model's behavior when patched, indicating it is the primary representation.
  - Skeptic's Prediction: Both directions might show some effect (because they are correlated) but neither will fully capture the model's behavior because the concept is distributed and probe-dependent.

  Disagreement 3: The relationship between representation and computation
  - Neutral: Whether the model's internal states are best described as representing concepts or whether the entire system is just doing matrix multiplications without any aboutness.
  - Realist: The model's internal states are representations because they play a functional role in the computation that is analogous to how representations work in human cognition (even if simpler). The steering experiments show that the model is using these states to stand for concepts.
  - Skeptic: The model is performing computations that can be described as if they involve representations, but this is just a useful description. The underlying reality is matrix multiplications that do not have any inherent meaning.
  - Bearing: Consider a thought experiment: if we take a model and randomly permute the labels of the concepts (e.g., swap the "striped" direction with the "dotted" direction) and then retrain the probe (but not the model), does the probe still work? If the representation is intrinsic to the model, then the probe should not work after permutation. But if the probe is just fitting to arbitrary patterns, it might adapt.
  - Realist's Prediction: The probe will fail because the representation was tied to the original structure of the model. The model's internal structure is fixed and the probe must align with it.
  - Skeptic's Prediction: The probe can be retrained to map the new patterns to the same labels because the model's activations are just patterns and the probe is flexible.

  Note: We must also note any verbal disputes. For example, the term "representation" might be used by the realist to mean a state that plays a causal role in the computation and correlates with an external concept, while the skeptic might reserve "representation" for states that have intrinsic aboutness (like in humans). So we can say:

  Verbal Dispute: The two parties are using the word "representation" differently. The realist uses it in a functional sense (causal role, correlation) while the skeptic uses it in a stronger, more metaphysical sense (intentionality). After clarifying, the remaining disagreement is whether the functional properties are sufficient to ascribe aboutness, or whether there is an additional requirement (like being part of a larger cognitive system) that the model lacks.

  Now, we write the joint statement accordingly.
