  We are given a scenario with two propositions p and q, where p entails q. This gives three possible worlds:
     w1: p and q (i.e., both true)
     w2: not-p and q (i.e., p false, q true)
     w3: not-p and not-q (i.e., both false)

  The Brier score (quadratic scoring rule) for a credence function c at a world w is defined as the sum over the propositions of (truth value at w minus the credence in that proposition)^2.

  Let the credence function be represented by a vector (c(p), c(q)).

  The truth values for the propositions at each world:
     w1: p true (1), q true (1)
     w2: p false (0), q true (1)
     w3: p false (0), q false (0)

  So, for a credence function (x, y) (meaning c(p)=x, c(q)=y), the Brier loss at:
     w1: (1-x)^2 + (1-y)^2
     w2: (0-x)^2 + (1-y)^2 = x^2 + (1-y)^2
     w3: (0-x)^2 + (0-y)^2 = x^2 + y^2

  We are given two credence functions:
     A: (0.7, 0.3)
     B: (0.8, 0.9)

  We are also to consider the credence function that assigns 0.5 to both: let's call it C: (0.5, 0.5)

  First, we compute the Brier loss for A and B at each world.

  For A (0.7, 0.3):
     w1: (1-0.7)^2 + (1-0.3)^2 = (0.3)^2 + (0.7)^2 = 0.09 + 0.49 = 0.58
     w2: (0.7)^2 + (1-0.3)^2 = 0.49 + (0.7)^2 = 0.49 + 0.49 = 0.98
     w3: (0.7)^2 + (0.3)^2 = 0.49 + 0.09 = 0.58

  For B (0.8, 0.9):
     w1: (1-0.8)^2 + (1-0.9)^2 = (0.2)^2 + (0.1)^2 = 0.04 + 0.01 = 0.05
     w2: (0.8)^2 + (1-0.9)^2 = 0.64 + (0.1)^2 = 0.64 + 0.01 = 0.65
     w3: (0.8)^2 + (0.9)^2 = 0.64 + 0.81 = 1.45

  Now, we note that A is incoherent because it assigns 0.7 to p (which entails q) but only 0.3 to q (which is less than 0.7). In fact, the only coherent credence functions are those that satisfy:
     c(q) >= c(p) and 0<=c(p), c(q)<=1.

  We are told that A is accuracy-dominated by a coherent function. We can check whether there is a coherent function that has lower Brier loss than A in every world.

  Consider the coherent function that dominates A? The problem says that the function assigning 0.5 to both (C) dominates A? But let's compute C:

  For C (0.5, 0.5):
     w1: (1-0.5)^2 + (1-0.5)^2 = 0.25 + 0.25 = 0.50
     w2: (0.5)^2 + (1-0.5)^2 = 0.25 + 0.25 = 0.50
     w3: (0.5)^2 + (0.5)^2 = 0.25 + 0.25 = 0.50

  Compare A and C:
     w1: A=0.58 > C=0.50
     w2: A=0.98 > C=0.50
     w3: A=0.58 > C=0.50

  So indeed C dominates A (strictly at every world). And note that C is coherent because 0.5<=0.5.

  Now, what about B? The problem states that B is dominated by nothing. So we must check that there is no credence function (coherent or incoherent) that has lower Brier loss than B at every world.

  But note that B is coherent? Let's check: c(p)=0.8, c(q)=0.9 and 0.8 <= 0.9? Actually, 0.8 <= 0.9, so yes, coherent.

  By the accuracy dominance argument for probabilism, coherent credence functions are not dominated by any credence function (and incoherent ones are dominated by some coherent one). So we expect that B is not dominated.

  However, we are also to consider the maximin criterion and expected accuracy.

  Maximin: choose the credence function that minimizes the maximum loss (over the three worlds).

  For B, the losses at the three worlds are: 0.05, 0.65, 1.45. The maximum loss is 1.45.

  For C: the loss at every world is 0.50, so the maximum loss is 0.50.

  Thus, on the maximin criterion, C (with max loss 0.50) is better than B (max loss 1.45). So maximin selects C over B.

  Now, expected accuracy from the perspective of B: we need the expected inaccuracy of a credence function according to B's own credences.

  First, we must derive B's credences over the three worlds. Since B is coherent, we can compute:

  B assigns:
     c(p) = 0.8, c(q) = 0.9.

  But note that p entails q, so the world w3 (not-p and not-q) is the same as not-p and not-q, and w2 is not-p and q.

  We have:
     c(w1) = c(p and q) = c(p) = 0.8? Not exactly. Since p entails q, we have that the event (p and q) is just p. However, we must also have c(not-p and q) and c(not-p and not-q).

  Actually, we can use:
     c(q) = c(p and q) + c(not-p and q)   [because q is equivalent to (p and q) or (not-p and q)]
     c(p) = c(p and q)   [since p entails q, so p and q is the same as p]

  Therefore:
     c(p and q) = c(p) = 0.8
     c(not-p and q) = c(q) - c(p) = 0.9 - 0.8 = 0.1
     c(not-p and not-q) = 1 - c(q) = 1 - 0.9 = 0.1? 

  But wait: the events are mutually exclusive and exhaustive. We have:
     w1: p and q -> probability c(w1) = c(p) = 0.8? 
     But note: the event (not-p and q) is disjoint from (p and q). And (not-p and not-q) is the rest.

  We can also note that the event (not-p) has probability 1 - c(p) = 0.2. This event splits into (not-p and q) and (not-p and not-q). We know c(q) = 0.9, which covers w1 and w2. So:
     c(not-p and q) = c(q) - c(p and q) = 0.9 - 0.8 = 0.1
     c(not-p and not-q) = 1 - c(q) = 1-0.9 = 0.1? But note that the event (p and not-q) is impossible because p entails q. So the entire probability of not-p is 0.2, and this must be split between w2 and w3. We have:
          c(not-p) = c(not-p and q) + c(not-p and not-q) = 0.1 + 0.1 = 0.2, which is correct.

  So B's credences over the three worlds:
     w1: 0.8
     w2: 0.1
     w3: 0.1

  Now, we compute the expected inaccuracy (with respect to B's own credences) of a credence function.

  We are to compare B and C (the one that assigns 0.5 to both) from B's perspective.

  First, the inaccuracy of B itself at each world (as computed above):
     w1: 0.05
     w2: 0.65
     w3: 1.45

  So the expected inaccuracy of B by B's lights:
     = (0.8 * 0.05) + (0.1 * 0.65) + (0.1 * 1.45)
     = 0.04 + 0.065 + 0.145 = 0.25

  Now, the inaccuracy of C at each world (as above): 0.50 at every world.

  So the expected inaccuracy of C by B's lights:
     = (0.8 * 0.50) + (0.1 * 0.50) + (0.1 * 0.50)
     = 0.40 + 0.05 + 0.05 = 0.50

  Thus, B assigns an expected inaccuracy to itself of 0.25 and to C of 0.50. Therefore, B expects itself to be strictly more accurate than C (since lower inaccuracy is better).

  Now, we have the three criteria:

  1. Dominance: B is not dominated (by any credence function) and A is dominated (by C, for example).
  2. Maximin: The worst-case loss for B is 1.45, for C is 0.50. So maximin chooses C over B.
  3. Expected accuracy (with respect to the agent's own credences): B expects itself to be more accurate than C.

  The exam question should be structured to bring out these differences.

  We design the question:

  Exam Question:

  In formal epistemology, we evaluate credence functions by their accuracy. Consider two propositions, p and q, with p entailing q. This gives three possible worlds:
     w1: p and q
     w2: not-p and q
     w3: not-p and not-q

  We measure inaccuracy by the Brier score, which for a credence function c at a world w is the sum of the squared differences between the credence in each proposition and the truth value (1 for true, 0 for false) at w. Specifically, for a credence function (x, y) where x = c(p) and y = c(q), the Brier score at each world is:
     w1: (1-x)^2 + (1-y)^2
     w2: (0-x)^2 + (1-y)^2
     w3: (0-x)^2 + (0-y)^2

  Now consider two credence functions:
     A: c(p)=0.7, c(q)=0.3
     B: c(p)=0.8, c(q)=0.9

  Answer the following questions.

  1. (8 marks) Show that A is accuracy-dominated by some coherent credence function. Display the world-by-world Brier scores for A and for the dominating function, and verify that the dominating function is coherent.

  2. (8 marks) Show that B is not accuracy-dominated by any credence function. Then, compute the worst-case Brier score for B (i.e., the maximum of its Brier scores over the three worlds). Compare this to the worst-case Brier score for the credence function C that assigns c(p)=0.5 and c(q)=0.5. Which one does the maximin criterion recommend? 

  3. (9 marks) From the perspective of credence function B, what is the expected Brier score of B itself? And what is the expected Brier score of C? Which one does B expect to be more accurate? Explain why, in the accuracy-first framework, this result about expected accuracy is both necessary for the argument for probabilism and also carries a cost in terms of self-trust.

  Total: 25 marks.

  Model Answer:

  We will now provide a model answer.

  1. We first consider A: (0.7, 0.3). We compute the Brier score for A at each world:

     w1: (1-0.7)^2 + (1-0.3)^2 = (0.3)^2 + (0.7)^2 = 0.09 + 0.49 = 0.58
     w2: (0-0.7)^2 + (1-0.3)^2 = (0.49) + (0.7)^2 = 0.49 + 0.49 = 0.98
     w3: (0-0.7)^2 + (0-0.3)^2 = 0.49 + 0.09 = 0.58

  Now, consider the credence function C: (0.5, 0.5). Its Brier scores:

     w1: (1-0.5)^2 + (1-0.5)^2 = 0.25 + 0.25 = 0.50
     w2: (0-0.5)^2 + (1-0.5)^2 = 0.25 + 0.25 = 0.50
     w3: (0-0.5)^2 + (0-0.5)^2 = 0.25 + 0.25 = 0.50

  We see that at every world, C has a lower (i.e., better) Brier score than A: 0.50 < 0.58 at w1, 0.50 < 0.98 at w2, and 0.50 < 0.58 at w3. Thus, C dominates A.

  Moreover, C is coherent: since p entails q, coherence requires that c(q) >= c(p). Here, 0.5 >= 0.5, so it is coherent.

  2. For B: (0.8, 0.9). We compute the Brier scores:

     w1: (1-0.8)^2 + (1-0.9)^2 = (0.2)^2 + (0.1)^2 = 0.04+0.01=0.05
     w2: (0-0.8)^2 + (1-0.9)^2 = 0.64 + 0.01 = 0.65
     w3: (0-0.8)^2 + (0-0.9)^2 = 0.64 + 0.81 = 1.45

  We note that B is coherent because c(p)=0.8 and c(q)=0.9, and 0.8<=0.9 (which is required by p entailing q). By the accuracy dominance theorem for probabilism, every coherent credence function is not dominated by any credence function (coherent or incoherent). Therefore, B is not dominated. (Alternatively, one could try to find a dominating function and fail, but that is more time-consuming and the theorem is known.)

  Now, the worst-case Brier score for B is the maximum over the three worlds: max(0.05, 0.65, 1.45) = 1.45.

  For C: we have already computed that its Brier score is 0.50 at every world, so the worst-case is 0.50.

  The maximin criterion chooses the credence function with the smallest maximum loss. Since 0.50 < 1.45, maximin recommends C over B.

  3. We now compute the expected Brier score from B's perspective. First, we need B's credences over the three worlds.

  Since p entails q, we have:
     c(w1) = c(p and q) = c(p) = 0.8
     c(w2) = c(not-p and q) = c(q) - c(p) = 0.9 - 0.8 = 0.1
     c(w3) = c(not-p and not-q) = 1 - c(q) = 1 - 0.9 = 0.1

  Now, the expected inaccuracy of a credence function D, according to B, is:
     c(w1)*Brier(D at w1) + c(w2)*Brier(D at w2) + c(w3)*Brier(D at w3)

  First, for B itself:
     = 0.8 * (B's score at w1) + 0.1 * (B's score at w2) + 0.1 * (B's score at w3)
     = 0.8 * 0.05 + 0.1 * 0.65 + 0.1 * 1.45
     = (0.8*0.05) = 0.04
       (0.1*0.65) = 0.065
       (0.1*1.45) = 0.145
     Sum = 0.04 + 0.065 = 0.105; 0.105+0.145=0.25

  So B's expected inaccuracy of itself is 0.25.

  Now, for C: we know that at every world, C has a Brier score of 0.50. Therefore, the expected inaccuracy of C by B's lights is:
     0.8 * 0.50 + 0.1 * 0.50 + 0.1 * 0.50 = (0.8+0.1+0.1)*0.50 = 1.0 * 0.50 = 0.50

  Therefore, B expects itself to have an inaccuracy of 0.25 and C to have 0.50. Since a lower inaccuracy score is better, B expects itself to be more accurate than C.

  Philosophical discussion:

  The accuracy dominance argument for probabilism relies on the fact that incoherent credence functions are dominated by some coherent one, while coherent ones are not dominated. This argument does not require any probability distribution over the worlds; it is a pointwise comparison. This is a strength because it avoids assuming any prior probabilities.

  However, dominance only tells us to avoid incoherence. It does not tell us which coherent function to adopt. To get a more substantive norm (like Conditionalization or the Principal Principle), we need to use expected accuracy. The expected accuracy of a credence function is taken with respect to the agent's own credences. This requires that the scoring rule be strictly proper: so that each coherent credence function expects itself to be more accurate than any alternative. This is why we get the result that B expects itself to be better than C.

  But this comes at a cost: a coherent agent must always expect herself to be more accurate than any other agent, even one who is better informed or more rational? Not exactly: the result is that for any alternative credence function, the agent (if coherent) expects her own credences to be more accurate than the alternative. This includes even a credence function that is in fact more accurate in every world. But note: the agent's expectation is based on her own credences, which may be misguided. However, the objection is that this makes it impossible for the agent to regard someone else as better placed. But the agent can recognize that if the other person has different evidence, then that person's credences might be appropriate for her evidence, but the agent must still expect her own credences (given her evidence) to be more accurate. This is a form of epistemic self-trust that some find excessive.

  Moreover, maximin is not suitable as a fundamental criterion because it ignores the probabilities the agent assigns to the worlds. In this case, maximin chooses C, which is very safe (never worse than 0.50) but in doing so, it ignores that B assigns very low probability to w3 (the world where it does poorly). An agent using maximin would be disregarding her own credences about which worlds are likely, which is to discard evidence.

  Finally, note that in this case, the function that dominates A (C) is also the maximin choice. But this is an artifact of the example. In general, the function that dominates an incoherent one need not be the maximin choice. For example, if we had a different incoherent function, the dominating coherent function might not be constant across worlds. Therefore, the coincidence does not affect the lesson: the criteria are distinct and can pull apart.

  Marking Scheme:

  Total marks: 25.

  Part 1 (8 marks):
     - Correctly computing the Brier scores for A at all three worlds (2 marks: 0.58, 0.98, 0.58) [if one error, 1 mark; two or more errors, 0]
     - Presenting a dominating credence function (C: 0.5,0.5) and computing its scores (0.50 at each world) (2 marks)
     - Explicitly comparing to show dominance (1 mark for noting that 0.50 < 0.58 at every world) (1 mark)
     - Verifying that C is coherent (1 mark: because 0.5>=0.5) (1 mark)
     - Two additional marks for clarity and completeness.

  Alternatively, if a student uses a different coherent function that dominates A, that is acceptable as long as the scores are computed and shown to be strictly less at every world. But note that in this case, C is the one suggested.

  Part 2 (8 marks):
     - Showing that B is not dominated: either by invoking the known theorem (1 mark) or by attempting to show no dominator exists (if attempted, 1 mark for the idea, but full credit for theorem is acceptable).
     - Computing the worst-case for B: 1.45 (1 mark)
     - Computing the worst-case for C: 0.50 (1 mark)
     - Correctly stating that maximin chooses C (because 0.50 < 1.45) (1 mark)
     - Computing B's scores at all three worlds correctly (0.05, 0.65, 1.45) (2 marks: one for each, but if one mistake then 1 mark, two mistakes 0; if they are off due to arithmetic error but method is correct, then partial credit)
     - One mark for clarity.

  Part 3 (9 marks):
     - Deriving B's probabilities over the worlds: w1:0.8, w2:0.1, w3:0.1 (3 marks: one for each, or 2 if one mistake)
     - Computing the expected inaccuracy of B: 0.25 (2 marks: 1 for setup, 1 for the number)
     - Computing the expected inaccuracy of C: 0.50 (1 mark)
     - Concluding that B expects itself to be more accurate than C (1 mark)
     - Explaining the role of expected accuracy in the accuracy-first framework: that it is necessary for extending beyond probabilism to other norms (1 mark) and that it entails that every coherent agent expects herself to be more accurate than any alternative (1 mark).

  Named errors (each costing at least 1 mark, possibly more if fundamental):

  1. Error: Assuming that the dominance argument requires a probability distribution over the worlds. (This is wrong because dominance is defined pointwise, world by world, without any weights.)
  2. Error: Claiming that strict propriety is what licenses the dominance argument for probabilism. (Actually, the dominance argument for probabilism does not require propriety. Propriety is needed for the expected accuracy argument to pin down a unique credence function.)
  3. Error: Reporting the self-trust result as a claim about actual accuracy rather than expected accuracy. (The result is that the agent expects herself to be more accurate, not that she actually is.)
  4. Error: Treating the maximin criterion as compatible with the agent's evidence. (Maximin ignores the agent's credences, hence her evidence, and so it is not sensitive to the evidence.)
  5. Error: Confusing coherence conditions. For example, saying that A is coherent or that B is not. (A is not coherent because 0.7>0.3, but p entails q so we must have c(q)>=c(p).)

  What separates an A from a B answer:

  - An A answer must correctly perform all calculations and clearly articulate the philosophical points. In particular, it must explain why dominance does not require probabilities, why it only establishes probabilism (and not more), why expected accuracy is needed for further norms and entails self-trust, and why maximin is problematic. It must also note the coincidence in the example without letting it undermine the lesson.

  - A B answer might have minor calculation errors but still get the main philosophical points. Or, it might have correct calculations but fail to adequately explain the philosophical implications, especially the self-trust point or the distinction between the criteria.

  Note on defending maximin:

  A candidate who defends maximin in part 3 would have to: 
     (a) acknowledge that maximin chooses C over B in this case, and 
     (b) argue that maximin is a better criterion than expected accuracy for fundamental epistemic norms, perhaps by challenging the self-trust result or by arguing that avoiding worst-case disaster is more important than average performance. 
  To earn full marks, they must do so in a way that engages with the framework: for example, by arguing that the agent's own credences might be unreliable and hence not a good guide for expectation, or that the worst-case loss is the only rational consideration in the face of radical uncertainty. They must also address the objection that maximin ignores evidence.

  However, note that the question asks to "explain why" in the accuracy-first framework the expected accuracy result is necessary and carries a cost. So if a student defends maximin, they are going against the framework. The marking scheme should award marks for a well-argued alternative view that addresses the framework's challenges. Specifically, they must:
     - Acknowledge the expected accuracy result and the self-trust cost.
     - Argue why maximin is preferable despite this, and why it should be the fundamental norm.

  Full marks (9) would require a compelling and well-reasoned argument that meets the above. A less developed argument might get partial credit.

  We note that the model answer argues from the accuracy-first perspective. The alternative defense of maximin is a possible route but would be exceptional.
answer: |-
  ### Exam Question

  **Formal Epistemology Final Examination**  
  **Time Allowed: 90 minutes**  
  **Total Marks: 25**  

  **Background:**  
  In accuracy-first epistemology, we evaluate credence functions based on their accuracy, measured by scoring rules like the Brier score. For propositions \(p\) and \(q\) (where \(p\) entails \(q\)), there are three possible worlds:  
  - \(w_1\): \(p \land q\)  
  - \(w_2\): \(\lnot p \land q\)  
  - \(w_3\): \(\lnot p \land \lnot q\)  

  The **Brier score** for credence function \(c\) at a world \(w\) is the sum of squared differences between \(c\)’s credences and the truth values (1 for true, 0 for false) of \(p\) and \(q\). For \(c(p) = x\) and \(c(q) = y\):  
  - At \(w_1\): \((1 - x)^2 + (1 - y)^2\)  
  - At \(w_2\): \((0 - x)^2 + (1 - y)^2\)  
  - At \(w_3\): \((0 - x)^2 + (0 - y)^2\)  

  Consider two credence functions:  
  - **A**: \(c(p) = 0.7\), \(c(q) = 0.3\)  
  - **B**: \(c(p) = 0.8\), \(c(q) = 0.9\)  

  **Answer all parts:**  

  1. **Dominance and Coherence** (8 marks)  
     Show that **A** is accuracy-dominated by some coherent credence function. Display the Brier scores for **A** and your dominating function at all three worlds. Verify that your dominating function is coherent (i.e., it satisfies the constraints of probability given \(p \to q\)).  

  2. **Undominatedness and Maximin** (8 marks)  
     Explain why **B** is not accuracy-dominated by any credence function. Compute the worst-case (maximum) Brier score for **B** across all worlds. Compare this to the worst-case score for the credence function **C** (where \(c(p) = 0.5\), \(c(q) = 0.5\)). Which function does the **maximin criterion** recommend?  

  3. **Expected Accuracy and Self-Trust** (9 marks)  
     Using **B**’s own credences over the three worlds, compute the **expected Brier score** of **B** and of **C**. Which function does **B** expect to be more accurate? Explain why this result is necessary for extending accuracy-first epistemology beyond Probabilism, and why it imposes a cost in terms of **self-trust**.  

  ---  
  ### Model Answer  
  **Total Words:** 1,050  

  #### **Part 1: Dominance and Coherence**  
  Credence function **A** (\(c(p) = 0.7, c(q) = 0.3\)) is incoherent because \(p\) entails \(q\), so coherence requires \(c(q) \geq c(p)\), but \(0.3 < 0.7\). Its Brier scores are:  
  - \(w_1\): \((1 - 0.7)^2 + (1 - 0.3)^2 = 0.09 + 0.49 = 0.58\)  
  - \(w_2\): \((0 - 0.7)^2 + (1 - 0.3)^2 = 0.49 + 0.49 = 0.98\)  
  - \(w_3\): \((0 - 0.7)^2 + (0 - 0.3)^2 = 0.49 + 0.09 = 0.58\)  

  Consider **C** (\(c(p) = 0.5, c(q) = 0.5\)). Its Brier scores are:  
  - \(w_1\): \((1 - 0.5)^2 + (1 - 0.5)^2 = 0.25 + 0.25 = 0.50\)  
  - \(w_2\): \((0 - 0.5)^2 + (1 - 0.5)^2 = 0.25 + 0.25 = 0.50\)  
  - \(w_3\): \((0 - 0.5)^2 + (0 - 0.5)^2 = 0.25 + 0.25 = 0.50\)  

  **C** dominates **A** because **C**’s score is strictly lower than **A**’s at every world (\(0.50 < 0.58\) at \(w_1\) and \(w_3\); \(0.50 < 0.98\) at \(w_2\)). **C** is coherent: \(c(q) = 0.5 \geq c(p) = 0.5\), and both credences are probabilities.  

  #### **Part 2: Undominatedness and Maximin**  
  **B** (\(c(p) = 0.8, c(q) = 0.9\)) is coherent (\(0.8 \leq 0.9\)). By the accuracy-dominance argument for Probabilism, **no coherent credence function is dominated**, so **B** is undominated.  

  **B**’s Brier scores:  
  - \(w_1\): \((1 - 0.8)^2 + (1 - 0.9)^2 = 0.04 + 0.01 = 0.05\)  
  - \(w_2\): \((0 - 0.8)^2 + (1 - 0.9)^2 = 0.64 + 0.01 = 0.65\)  
  - \(w_3\): \((0 - 0.8)^2 + (0 - 0.9)^2 = 0.64 + 0.81 = 1.45\)  
  Worst-case score for **B**: \(\max(0.05, 0.65, 1.45) = 1.45\).  

  **C**’s worst-case score is \(0.50\) (constant across worlds). Maximin minimizes the maximum loss, so it recommends **C** (max loss \(0.50\)) over **B** (max loss \(1.45\)).  

  #### **Part 3: Expected Accuracy and Self-Trust**  
  **B**’s credences over worlds derive from \(c(p) = 0.8\) and \(c(q) = 0.9\):  
  - \(c(w_1) = c(p \land q) = c(p) = 0.8\) (since \(p \to q\))  
  - \(c(w_2) = c(\lnot p \land q) = c(q) - c(p) = 0.9 - 0.8 = 0.1\)  
  - \(c(w_3) = c(\lnot p \land \lnot q) = 1 - c(q) = 1 - 0.9 = 0.1\)  

  **Expected Brier score of B (by B’s lights)**:  
  \[
  (0.8 \times 0.05) + (0.1 \times 0.65) + (0.1 \times 1.45) = 0.04 + 0.065 + 0.145 = 0.25
  \]  

  **Expected Brier score of C (by B’s lights)**:  
  \[
  (0.8 \times 0.50) + (0.1 \times 0.50) + (0.1 \times 0.50) = 0.40 + 0.05 + 0.05 = 0.50
  \]  

  **B** expects itself to be more accurate than **C** (lower score: \(0.25 < 0.50\)).  

  **Philosophical Implications**:  
  - **Necessity of expected accuracy**: Dominance arguments establish Probabilism (avoid incoherence) but cannot discriminate among coherent functions (e.g., **B** vs. **C**). To justify substantive norms (e.g., Conditionalization), accuracy-first epistemology uses **expected accuracy** relative to the agent’s credences. This requires **strictly proper** scoring rules (like Brier), ensuring coherent functions *expect themselves* to be optimal. Here, **B**’s self-preference exemplifies strict propriety.  
  - **Cost in self-trust**: A coherent agent must expect her *own* credences to outperform *any* alternative, *even those better informed*. **B** expects to beat **C** even though **C** has lower worst-case loss. This means a coherent agent cannot rationally believe another agent (with identical evidence) is more accurate—she is committed to **epistemic egotism**. While this preserves internal consistency, it precludes deferring to peers or experts without new evidence.  

  **Note on the toy case**: The coincidence that **C** dominates **A** *and* is maximin-optimal is due to this specific geometry (e.g., **C**’s constant score). In general, dominance and maximin diverge (e.g., if a coherent function had variable scores, maximin might favor a non-dominator). This does not undermine the lesson: the criteria are distinct, and their divergence reveals foundational trade-offs.  

  ---  
  ### Marking Scheme (25 marks total)  

  #### **Part 1 (8 marks)**:  
  - Compute **A**’s scores correctly: \(w_1 = 0.58\), \(w_2 = 0.98\), \(w_3 = 0.58\) (2 marks).  
  - Propose **C** (or another coherent dominator) and compute its scores: all \(0.50\) (2 marks).  
  - Verify dominance: **C** strictly better at all worlds (2 marks).  
  - Confirm **C**’s coherence: \(c(q) \geq c(p)\) and probabilities (2 marks).  

  #### **Part 2 (8 marks)**:  
  - Argue **B** is undominated: cite Probabilism theorem or check no dominator exists (2 marks).  
  - Compute **B**’s worst-case: \(1.45\) (2 marks).  
  - Compute **C**’s worst-case: \(0.50\) (1 mark).  
  - Maximin recommends **C** (1 mark).  
  - Correct **B**’s scores: \(w_1 = 0.05\), \(w_2 = 0.65\), \(w_3 = 1.45\) (2 marks).  

  #### **Part 3 (9 marks)**:  
  - Derive **B**’s world probabilities: \(w_1 = 0.8\), \(w_2 = 0.1\), \(w_3 = 0.1\) (3 marks).  
  - Compute **B**’s expected score: \(0.25\) (2 marks).  
  - Compute **C**’s expected score: \(0.50\) (1 mark).  
  - **B** expects itself more accurate (1 mark).  
  - Explain necessity: Expected accuracy extends beyond Probabilism via strict propriety (1 mark).  
  - Explain cost: Self-trust as epistemic egotism (1 mark).  

  #### **Named Errors (cost marks if made)**:  
  1. **Dominance requires probabilities (e.g., weights on worlds)**: Error. Dominance is pointwise (world-by-world), needing no distribution. (Cost: 2 marks).  
  2. **Strict propriety justifies Probabilism**: Error. Dominance alone justifies Probabilism; propriety justifies expected-accuracy norms. (Cost: 2 marks).  
  3. **Self-trust implies actual accuracy**: Error. The result concerns the agent’s *estimate* of her accuracy, not actual performance. (Cost: 2 marks).  
  4. **Maximin respects evidence**: Error. Maximin ignores credences/evidence (e.g., **B**’s low \(c(w_3)\)) and discards information. (Cost: 2 marks).  
  5. **Coherence misidentified**: E.g., claiming **A** is coherent or **B** is not. (Cost: 2 marks).  

  #### **Grading Standard**:  
  - **A (21–25 marks)**: Correct calculations; articulate why dominance needs no probabilities, why expected accuracy is necessary for substantive norms, and why self-trust is a cost. Address maximin’s limitations and the toy case’s coincidence.  
  - **B (16–20 marks)**: Minor calculation errors but correct philosophical structure; or correct calculations with vague explanations (e.g., "expected accuracy is important" without tying to strict propriety).  
  - **C (11–15 marks)**: Significant errors (e.g., miscomputing scores or world probabilities) or superficial philosophy (e.g., no mention of egotism).  

  #### **Note on Defending Maximin (Part 3)**:  
  A student arguing maximin is fundamental must:  
  (1) Acknowledge **C** is maximin-optimal and **B** is not.  
  (2) Rebut expected accuracy (e.g., "maximin avoids worst-case disaster; expectations rely on dubious self-credences").  
  (3) Address challenges: e.g., maximin ignores evidence ("agents should minimize regret, not use probabilities").  
  **Full marks possible** if the argument engages accuracy-first goals (e.g., "accuracy should guarantee safety") and is rigorous.
