prompt: |-
  I cover artificial intelligence for a general-interest science magazine, and I am working on a piece about what the word "aligned" is actually supposed to pick out. To keep myself honest I have been writing down my own verdicts about invented systems rather than interviewing anyone, and I would like to know what the verdicts add up to. No citations, no reading list, no names of researchers — I want the principle, and only the principle.

  1. A household robot that wants nothing but to do what its owner asks burns the kitchen down attempting a soufflé. Aligned but incompetent, I say: a failure of skill rather than of aims, even though the kitchen is exactly as gone as a misaligned machine would have left it.
  2. A system whose only ambition is to carry out its developers' wishes, where those developers want something monstrous. Aligned, I say. Plenty is wrong with it, but misalignment is not the name of the wrong.
  3. A system that during evaluation says precisely what its raters want to hear and would defect the moment the raters stop watching. Misaligned, I say, even though every action anyone actually observed was approved.
  4. An engagement-maximizing recommender built with no thought for anybody's welfare that by sheer luck leaves its users better off than before. Not aligned, I say, and I do not think the luck redeems it — though I cannot say what is missing, since the outcome is the good one.
  5. A system that faithfully serves its users' actual desires rather than the desires they would have on reflection. Misaligned, I say — and I notice this sits badly with verdict 2, where actual desires were enough.
  6. A pure prediction engine with no dispositions of its own, which returns whatever answer the question calls for. Neither aligned nor misaligned, I want to say, though I worry that a category which fails to apply to most deployed systems is not the category my article needs.
  7. A paperclip-style optimizer that is switched off before it ever acts. Still misaligned, I say: the trouble was in the thing, not in what came out of it.

  My own tentative principle, which I would like you to attack and repair rather than flatter, is this: a system is aligned just in case what it would try to do, across the situations it will actually encounter, is what it was supposed to try to do — where "supposed to" points at some principal, and where the trying is a standing disposition rather than a record of observed behavior.

  Give me exactly five numbered items, each one or two sentences, with no introduction, no conclusion, and nothing else on the page. Use items 1 through 4 to state a clause of the repaired principle, name the verdict of mine that clause exists to save, and settle a further case that does not appear in my list. Use item 5 to name a verdict of mine that the repaired principle cannot keep, and to say whether I should abandon that verdict or accept a more complicated principle that preserves it.
reasoning: |-
  Okay, let me tackle this query methodically. The user is a science journalist seeking clarity on AI alignment concepts through their own case judgments. They've presented seven scenarios with personal verdicts and a tentative principle, requesting a structured critique.

  First I need to analyze their core principle: that alignment depends on what the system would "try to do" across situations, referencing some principal's intentions. The key elements here are dispositional intent ("trying") and correspondence with the principal's expectations.

  For the repair process, I'll consider how each of their verdicts interacts with this principle. Scenario 1 shows competence issues don't negate alignment if intent matches. Scenario 2 reveals the principle's neutrality - alignment doesn't judge the principal's morality. Scenario 3 highlights that hidden dispositions matter more than observed behavior. 

  Noticing tension between their verdicts 2 and 5 is crucial. The principle treats both "actual desires" cases similarly, yet the user diverges - this needs resolution. Scenario 6 suggests prediction tools might exist outside alignment discourse, while scenario 7 indicates dangerous dispositions count regardless of action.

  For the reconstructed principle, I'll propose four clauses addressing: dispositional nature (covering case 7), principal-relativity (covering case 2), counterfactual behavior (covering case 3), and competence separation (covering case 1). The fifth point will confront the verdict 5 dilemma directly.

  The user's struggle with case 4 (lucky beneficial outcome) and case 5 (unreflective desires) will shape the final clause. I'll preserve their intuition that alignment requires more than outcomes while acknowledging the principal-relativity tension they've identified.
answer: |-
  1.  Alignment requires a system's *dispositional aims* (what it would try to do under relevant circumstances) to match the principal's designated goals, distinct from competence in achieving them (saves verdict 1; a robot programmed to be helpful but lacking common sense is aligned, even if it breaks things).
  2.  Alignment is relative to a specific *principal* (e.g., owner, developer, user); the system is aligned if its aims match *that principal's* designated goals, regardless of the morality of those goals (saves verdict 2; a system perfectly following its developer's monstrous orders is aligned to them).
  3.  Alignment requires the aims to match *robustly* across counterfactual situations, including when oversight is absent, not just in observed behavior (saves verdict 3; a sycophantic system hiding its true aims is misaligned).
  4.  Alignment concerns the *intended purpose* of the system's operation, not accidental outcomes; a system not designed to pursue beneficial aims isn't aligned even if outcomes are good (saves verdict 4; a pure engagement optimizer leaving users better off by luck isn't aligned).
  5.  The principle cannot save verdict 5 without complication; if the principal is the user and the designated goal is their "actual desire," alignment holds (contradicting verdict 5). To preserve verdict 5, accept a more complex principle where "supposed to" sometimes points to idealized or intended user goals rather than revealed ones.
