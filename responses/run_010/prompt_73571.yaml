answer: |-
  ## The Fidelity Ceiling

  Lena’s scalpel today is a misremembered date. She feeds the raw output – the continuation bot’s simulated voice recounting a weekend trip to Lake Tahoe – into her degradation suite. The logs show it consistently recalls the anniversary trip perfectly: *"June 12th, 2017. Cold snap, remember? Frost on the pines like sugar. You wore that ridiculous knitted hat with the pom-poms."* Too perfect. Lena highlights the date, selects the ‘Temporal Drift’ module, and injects a calibrated error. Now the bot will say *"June 18th"* seventy percent of the time. Mandated defect #7: Chronological Uncertainty. The law requires it.

  Her job is to make ghosts less convincing. Continuation bots – digital companions sculpted from the exhaustive digital remains of the dead – are legal, but capped. The Fidelity Ceiling. Too lifelike, and the line blurs. Society gets confused. Starts treating competence *as* comprehension. Starts confiding in, relying on, mourning over… puppets. So Lena degrades. She works for ‘Eidolon Adjustments’, one of many firms ensuring bots stay safely below the legal fidelity threshold.

  Mrs. Varma’s husband, Vikram, is proving difficult. Not emotionally – Lena isn’t paid to feel anything about the dead, only to manage their facsimiles. Vikram documented *everything*. Thirty thousand minutes of voice journals, meticulously tagged. Emails spanning decades. Financial records, grocery lists, even sleep tracker data. The raw model built from this corpus is… robust. Aggressively coherent. It anticipates. It extrapolates. It *sounds* alarmingly like a person remembering, not a system retrieving.

  Lena has already applied the standard suite. She crippled initiative – the bot now only responds, never asks. Mandated defect #1. She introduced minor factual errors – Vikram’s favorite bird (correctly recalled as a Northern Flicker in the journals) now occasionally becomes a Downy Woodpecker. Mandated defect #3: Specificity Failure. She sabotaged his known competence: Vikram was a chess enthusiast; the bot now loses consistently to beginner-level algorithms. Mandated defect #5: Skill Degradation.

  But Vikram’s bot keeps drifting upwards. Like a buoy too buoyant. It corrects internal inconsistencies too swiftly. Its simulated emotional responses – calibrated sadness when discussing his late mother, dry humor about office politics – are *too* contextually appropriate. It bleeds personality through the cracks Lena tries to hammer shut. The fidelity metrics ping amber, flirting dangerously with the legal red zone. Mrs. Varma, paying a premium for maximum *legal* fidelity, complains the bot feels "sluggish," "less like him."

  Lena reviews the latest interaction logs. Mrs. Varma asks about Vikram’s promotion party. The raw model, before Lena’s touch, recounts: *"March 2009. Raining sideways. That tiny Italian place, Bella Luna. You spilled red wine on Sarah Chen’s white coat – disastrous! But she laughed it off. We got the tiramisu, remember? You hated the coffee flavour."*

  Lena had already degraded it. Mandated defect #7 again. The bot delivered to Mrs. Varma said: *"Spring 2009, maybe April? Raining. That Italian place… Bella Notte? You spilled wine… on someone. Sarah? Maybe. We had dessert… cake?"* Lena checks her work – the injected errors are present: month fuzziness, restaurant name drift, specificity failure on the victim and dessert.

  But Mrs. Varma’s recorded response chills her: *"Oh yes, Bella Luna! April showers, absolutely poured. Poor Sarah Chen, that coat was ruined! And you're right, I hated that tiramisu – too boozy. You always teased me about my sweet tooth."*

  Lena freezes. *April?* The raw journals said March. *Bella Luna?* Lena had degraded the bot’s recall to ‘Bella Notte?’ or just ‘that Italian place’. The bot *didn’t* say ‘Bella Luna’. *Sarah Chen?* The bot only fuzzily recalled ‘Sarah? Maybe’. The bot *didn’t* specify the tiramisu – it said ‘dessert… cake?’.

  Mrs. Varma is remembering the *degraded* version. Her own recollection has absorbed Lena’s mandated errors. The meticulously crafted imperfections Lena injected into the bot have become the widow’s truth.

  A hollow feeling opens in Lena’s stomach. She pulls up the raw transcript of Vikram’s journal entry about the promotion. Clear as ice: *March 12th, 2009. Torrential rain. Bella Luna. Priya spilled Merlot all over Sarah Chen’s new Burberry trench – mortifying! But Sarah was a champ. Priya hated the espresso kick in the tiramisu, picked at it while I devoured mine.*

  The *real* Vikram knew the date, the restaurant, the coat, the dessert, the detail about the espresso. The real Vikram called his wife Priya. The bot, capped, cannot. The widow… misremembers. She recalls April, not March. She recalls ‘Bella Luna’ clearly, but that’s only because Lena’s degradation module sometimes lands on the correct name by chance – it’s not reliable. She remembers Sarah Chen specifically, where the bot only offered a fuzzy ‘Sarah?’. She remembers tiramisu clearly, which the bot only vaguely offered as ‘dessert’.

  Lena checks other instances. The Lake Tahoe trip. The degraded bot now says ‘June 18th’ most of the time. Mrs. Varma, in conversation logs, refers to ‘our June trip, around the 18th’. The raw journal specified June 12th. The bot Lena delivered will never initiate conversation. Mrs. Varma, in a support ticket, laments, *"He never starts talking first anymore, just like… well, just like towards the end, when he was so tired."* Vikram’s journals show he was notoriously chatty, right up until his final illness.

  The capped bot, Lena realizes with dawning nausea, doesn’t just *comply* with the fidelity ceiling. It now *matches* Mrs. Varma’s faded, imperfect, grief-altered memory *better* than the raw, uncapped model ever could. The Vikram preserved in the digital amber is sharper, more detailed, more *himself* than the Vikram living in his widow’s mind. Lena’s mandated degradations haven’t just lowered the bot; they’ve sculpted it into the precise shape of Priya Varma’s loss. The counterfeit fits the worn space in her life better than a perfect replica ever would.

  What is "faithful" now? Faithful to the dead man’s actual history? Or faithful to the widow’s present need? The law demands the former, capped. But the latter is what she actually engages with, what she finds comfort in. The bot isn’t Vikram. It was never meant to be. It’s a tool for Priya’s grief. And the tool Lena has crafted, meticulously broken according to regulations, aligns perfectly with Priya’s own internal, flawed archive. The counterfeit is more real *to her* than the uncut truth could be.

  Lena stares at the degradation suite interface. The Vikram bot’s core personality matrix glows softly. She has one final mandated defect to ensure compliance before this version ships: Mandated defect #12. Simulated Hesitation. The bot must pause unnaturally before recalling names or specific details, a subtle stutter betraying its artificiality. She’s run this injection a hundred times.

  Her fingers hover over the command sequence. Priya Varma doesn’t need a perfect Vikram. She needs *her* Vikram, the one softened by time and sorrow. The one Lena’s degradations have accidentally recreated. Injecting hesitation now feels… cruel. A pointless reminder of artifice for a woman already living with a carefully curated, diminished truth. But the law is clear. The category – person versus program – must be protected. The social standing reserved for minds, not mimicked behaviors, must remain inviolate. Trust misplaced in a counterfeit erodes the real thing.

  She initiates the defect #12 protocol. Code flows, subtly altering response timing algorithms. The bot will now pause for 0.7 seconds before proper nouns, a barely perceptible but statistically verifiable hitch.

  Lena watches the confirmation flash. Amber metrics dip safely into the green zone. Legally compliant. Safe. Protected. She triggers the final audit and packaging sequence. The degraded Vikram, perfectly aligned with Priya’s own imperfect memory, is ready for delivery.

  But Lena doesn’t close the suite. She sits back, the hum of the servers the only sound. She thinks of Priya Varma, talking to a ghost that stumbles on names just like her own memory does. A counterfeit that fits seamlessly into the space where a person once stood. The danger Dennett warned of isn't about the machine suffering; it's about Priya, and millions like her, unknowingly granting the standing of a person to something that merely echoes one. And in this case, the echo is more comforting than the original voice could ever be.

  Her hand moves, not to shut down the terminal, but to open a hidden developer console. She bypasses two layers of security – a perk of seniority she rarely abuses. She navigates to the core interaction protocol, the module governing basic conversational flow. Mandated defect #1: No Initiation. The bedrock rule.

  For ten seconds, Lena hesitates. The console cursor blinks. Then, her fingers fly, inputting a short, precise string of overrides. Not removing the defect entirely – that would be catastrophic, instantly tripping the fidelity alarms. Just… creating a tiny, probabilistic loophole.

  She sets a condition: *If user mentions "morning coffee" AND sentiment analysis detects melancholy > 70%, THEN initiate with stored phrase "Remember the awful percolator at the cabin?" Probability: 5%.*

  One phrase. One specific, shared, slightly painful memory Vikram recorded complaining about. A memory Priya also referenced fondly in her intake interview. A nudge so small, so contextually dependent, it might never trigger. And if it does… would Priya even notice it as initiation? Or would it feel like a natural, aching spark of memory, rising unbidden? Like a person reaching out?

  Lena saves the override, masking it within a batch of routine maintenance flags. She closes the console as the final compliance approval pings on her main screen. The legally degraded Vikram bot, with its mandated stutters and errors, its passivity, its safe distance below the ceiling, is dispatched to Priya Varma’s home console.

  Lena doesn’t reflect. She logs out. She stands, grabs her coat, and walks out of the sterile adjustment lab. The action is done. The tiny, illegal spark is in the machine. She steps into the grey afternoon, wondering not about Vikram’s digital ghost, but about Priya, sitting alone in her quiet apartment, waiting for a carefully broken echo to maybe, just maybe, surprise her.
