   15. Public announcement: should we have a public announcement partway through? The problem asks: "your recommendation on whether a public announcement made partway through the sequence would sharpen or wreck the effect"

          If we make a public announcement of the true state, that would wreck the cascade because then everyone would know the truth. We don't want that.

          Alternatively, we might announce the tally of private signals so far? But that would break the rules because the private signals are not revealed until the end.

          So we do not make any public announcement.

   16. Three things that could go wrong:

          a. The first two players happen to split and then the next few also split so that a cascade doesn't start until very late or not at all. 
             Solution: We can still show the results. The public guesses might not show a strong herd, but we can compare the public and private. And we can note that the public guesses were more volatile. Also, we can run the game twice (with two rounds) and hope that in one of them the cascade starts early.

          b. A player might not understand the rules and look at the board before writing the private guess. 
             Solution: Emphasize the order: "First, draw your slip and without looking at the board, write your private guess and seal it. Then look at the board and make your public guess."

          c. The bag might run out of slips? But we prepared 20 slips. If we have more than 20 players? The problem says 14-20, so we are safe.

          d. The state might be revealed accidentally? 
             Solution: Be careful when flipping the coin and filling the bag. Do it in private? Or flip the coin and then without revealing, fill the bag.

          e. The players might not take the private guess seriously and just write the same as the public guess? 
             Solution: Emphasize that the private guess is based solely on their own slip and that it is important for the experiment. Also, the reward for the private guess is independent.

          f. Time: 20 players in 10 minutes is 30 seconds per player. That might be tight. 
             Solution: Have a helper to manage the bag and the collection of private guesses. And have a timer.

   17. The feature that the game cannot reproduce: 

          In real life, people might not be Bayesian rational. They might be influenced by other factors. Also, the game assumes that all players understand that the signals are of 75% accuracy and that they are using Bayesian updating. But our players are not trained in probability. They might not update correctly. 

          Therefore, we cannot be sure that they are following the Bayesian logic. They might be following the crowd for social reasons even when they shouldn't. Or they might be contrarian.

          Also, the game does not capture the idea that in real life, the cost of going against the crowd might be high (socially) even if the information is strong. In our game, the only cost is possibly losing the point for being correct. In the second round, we add an incentive to be in the majority, but that is monetary (candy) and not social.

          So the game cannot reproduce the social pressure aspect. We will have to discuss that.

   18. Instructions:

          We'll have two rounds. In each round, there is a true state of the world: either Blue or Red. We have chosen the state by a coin flip and filled a bag with 20 slips. Some slips say Blue and some say Red. The bag has more slips of the true color (but we won't tell you the ratio).

          You will be called in a predetermined order. When called, you will:

            Step 1: Draw one slip from the bag and look at it. This is your private signal.
            Step 2: Without looking at the whiteboard, write on a small slip of paper your "private guess" for the state. This should be the color you believe the state is based ONLY on the slip you just drew. Fold it and put it in the "private guess box". Do not show anyone.
            Step 3: Now look at the whiteboard. It has the public guesses of the players who went before you. Then, write your "public guess" on the whiteboard for everyone to see. This public guess can be based on your private signal AND the public guesses you see.

          Note: The private guess is only based on your own slip. The public guess can be based on the entire public history and your own slip.

          Scoring for the first round:
            - If your private guess is correct, you get 1 point.
            - If your public guess is correct, you get 1 point.

          After the first round, we will do a second round with the same structure but different scoring.

          Second round scoring:
            - The private guess: if correct, 1 point.
            - The public guess: 
                  * If correct, 1 point.
                  * Additionally, if your public guess matches the majority of the public guesses in this round (at the end of the round), you get 1 extra point. However, if there is a tie (equal number of Blue and Red public guesses), then no one gets the extra point.

          We will then reveal the true state for each round and tally the points.

          Remember: the goal is to earn as many points as possible. Points will be redeemed for candy.

          Questions before we start?

   19. Timeline:

       0:00 - 0:05: Introduction and explanation of the overall game and the first round rules.
       0:05 - 0:08: Explanation of the first round scoring and the procedure (draw, private guess, public guess).
       0:08 - 0:18: First round: 20 players * 30 seconds = 10 minutes. (If we have less than 20, we finish early.)
       0:18 - 0:20: Explanation of the second round rules and scoring.
       0:20 - 0:30: Second round: 10 minutes.
       0:30 - 0:35: Tallying: 
              - For round 1: reveal the true state, then open the private guess box and tally private guesses. Also, tally the public guesses from the board.
              - For round 2: same.
