              - Why did the public guesses become so uniform? 
              - In the second round, did you feel differently about making the public guess? 
              - For those who changed their public guess to match the majority, was it because you were persuaded by the crowd or because you wanted the extra point? 
              - How can we tell the difference? 
              - In real life, do people follow the crowd for information or for social acceptance? 
              - This phenomenon is called an "information cascade".

   20. Implementation details:

          - We need: 
               * A coin.
               * Two sets of slips: 
                     Set Blue: 15 Blue, 5 Red.
