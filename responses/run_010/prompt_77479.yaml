               * Whiteboard and markers.

          - How to choose the order? We can assign numbers randomly.

   21. Recommendation: Do not make any public announcement during the sequence. It would wreck the cascade.

   22. Candid statement: The game cannot reproduce the social pressure that exists in real life. In the game, the only incentive to conform is the explicit point for being in the majority in the second round. In real life, people might conform to avoid standing out or due to social norms, even without explicit rewards. We will have to discuss this.

