answer: |-
  ### Game Design: Information Cascade Simulation

  #### Core Mechanics
  - **Hidden State**: A coin flip determines the "true state" (Blue or Red) before each round.  
  - **Private Signals**: Each player draws a slip from a bag corresponding to the true state:  
    - *Blue State Bag*: 15 "Blue" slips, 5 "Red" slips (75% accuracy)  
    - *Red State Bag*: 15 "Red" slips, 5 "Blue" slips (75% accuracy)  
  - **Accuracy Choice**: 75% ensures cascades start early (players 3–4). At 75%:  
    - Two agreeing signals → 90% confidence (overrides a conflicting third signal).  
    - Probability first two agree = (0.75)² + (0.25)² = 62.5% → cascade likely by player 3.  
    - Lower accuracy (e.g., 60%) delays cascades; higher (e.g., 80%) makes them start earlier.  

  #### Materials
  - Two opaque bags (one for each state).  
  - Pre-filled slips: 15 "Blue" + 5 "Red" for Blue bag; 15 "Red" + 5 "Blue" for Red bag.  
  - Sealed guess slips (small paper slips), a collection box.  
  - Whiteboard to record public guesses.  
  - Coin for state selection.  

  ---

  ### Instructions to Players (Read Aloud)
  "Welcome! Today we’ll play a decision game with two rounds.  
  **Goal**: Guess if the hidden state is **Blue** or **Red**.  
  **Setup**:  
  - I’ll flip a coin to pick the true state (Heads: Blue; Tails: Red).  
  - A bag with slips (mostly matching the true state) will be passed around.  

  **Your Turn**:  
  1. **Draw a slip**: Look at it secretly—this is your private hint.  
  2. **Private Guess**: *Immediately* write your guess **based only on your slip** on a small slip. Fold and drop it in the box. *Do NOT look at the whiteboard yet!*  
  3. **Public Guess**: *Now* look at the whiteboard (all prior public guesses). Write your guess on the board for everyone to see.  

  **Scoring (Candy Points)**:  
  - **Round 1**:  
    - Private guess correct = **1 point**  
    - Public guess correct = **1 point**  
  - **Round 2**:  
    - Private guess correct = **1 point**  
    - Public guess correct = **1 point**  
    - *Extra*: If your public guess matches the **majority** of public guesses this round = **+1 point**  
    *(Tie = no extra points)*  

  We’ll tally points after both rounds. Ready?"  

  ---

  ### Timeline (40 Minutes Total)
  1. **0:00–0:05**: Explain rules and demo (show a sample slip, emphasize *private before public*).  
  2. **Round 1 (0:05–0:18)**:  
     - Flip coin, fill bag.  
     - Players act sequentially:  
       - Player 1: Draw slip → private guess (sealed) → public guess (board).  
       - Player 2: Same (now sees Player 1’s public guess).  
       - Continue for all players (~30 seconds/player).  
  3. **Round 2 (0:18–0:30)**:  
     - Re-explain Round 2 scoring (emphasize majority bonus).  
     - New coin flip, refill bag.  
     - Repeat sequence.  
  4. **Tally & Reveal (0:30–0:35)**:  
     - Open true state (coin result).  
     - Open sealed private guesses.  
     - Post on whiteboard:  
       - *Public Guesses*: Sequence and totals (e.g., "Blue: 18, Red: 2").  
       - *Private Guesses*: Totals (e.g., "Blue: 12, Red: 8").  
     - Calculate points (candy rewards: 1 point = 1 candy).  
  5. **Discussion (0:35–0:40)**: Use questions below.  

  ---

  ### Key Moments Mapping to Concepts
  - **Cascade Start**: Herd behavior begins when early players agree (e.g., players 3–4 ignore their signals if prior public guesses match).  
  - **The Gap**: Public guesses show near-unanimity; private guesses split ~75:25 (e.g., 15:5) → highlights ignored information.  
  - **Ambiguity in Round 2**: Majority bonus creates doubt—did players follow the crowd for truth or points?  

  ---

  ### Public Announcement Mid-Sequence?
  - **Recommendation: Do NOT announce mid-sequence**.  
  - **Why**: An announcement (e.g., "True state is...") would shatter the cascade by revealing hidden information. Players would reset to truth-seeking. The effect relies on sequential uncertainty.  

  ---

  ### Three Failure Modes & Fixes
  1. **First Two Players Split (No Cascade)**:  
     - *Chance*: 37.5% (1 - 0.625).  
     - *Fix*: Proceed! Later players may still cascade (e.g., after player 5). In discussion, contrast with rounds where cascades *did* form.  

  2. **Players Peek at Board Before Private Guess**:  
     - *Prevention*: Stress "DO NOT look at board until private guess is sealed." Physically shield the board during private guesses.  

  3. **Players Ignore Signals in Round 1 (Social Conformity)**:  
     - *Prevention*: Emphasize "Private guess = ONLY your slip. Public guess = slip + board." Reward truth (points for correct guesses).  

  ---

  ### Unreproducible Feature
  - **Social Pressure**: The game cannot replicate real-world stigma/costs of disagreeing with the group. Players might conform to avoid embarrassment, but here the only penalty is lost points.  
  - **Discussion Solution**: Ask: *"In Round 2, how many of you felt social pressure to agree with the crowd, separate from points?"*  

  ---

  ### Discussion Questions
  1. **Observe the Results**:  
     - "Public guesses were nearly unanimous, but private guesses were split. Why?"  
  2. **Cascade Mechanics**:  
     - "After players 3–4, why did guesses stop changing, even if slips disagreed?"  
  3. **Round 2 Ambiguity**:  
     - "If you followed the crowd in Round 2, was it because you were *persuaded* or because you wanted the *extra point*? Could you tell the difference?"  
  4. **Real-World Link**:  
     - "Outside this game, when might people ignore private info to follow the group? Is it about truth, social acceptance, or both?"  
  5. **Reveal the Effect**:  
     - "This is called an **information cascade**—individuals abandon their knowledge to follow early public actions."  

  ---

  This design ensures cascades emerge naturally, the public/private gap is measurable, and Round 2’s ambiguity drives debate. With 75% accuracy and sequential dependence, the effect will land vividly.
