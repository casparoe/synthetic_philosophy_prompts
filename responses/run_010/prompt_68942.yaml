answer: |-
  Your argument is tightly constructed, but it founders at **step (5)**. This step claims that committed members must receive from the group benefits *at least* as much as the residual cost they bear—otherwise, they would have no incentive to stay loyal. The flaw lies in its narrow definition of "payoff," which is restricted solely to external group benefits (trust, preferential dealing, insurance) as defined in step (3). Crucially, it ignores **intrinsic rewards**—non-instrumental satisfactions like the emotional solace of belief, the joy of ritual participation, or the existential purpose derived from devotion—that committed members experience *directly* from the practice itself. These rewards are distinct from both the residual cost (step 2) and the instrumental group benefits (step 3), yet they form a core part of the net utility for the committed. A faker, lacking sincere commitment, cannot access these intrinsic benefits. Thus, for a committed member, even if group benefits alone do not cover the residual cost, the intrinsic rewards can bridge the gap, making their participation rational. Step (5) fails to account for this, creating a false dilemma in step (7). The signal remains honest because the *total* net gain (group benefits + intrinsic rewards - residual cost) is positive for the committed but negative for the non-committed (for whom intrinsic rewards are absent or negative).  

  A careful reader might accept step (5) because it appears consistent with step (3)'s definition of payoff, and because intrinsic rewards are often omitted from economic-style analyses to maintain objectivity. Rejecting step (5) forces costly-signalling theory to incorporate intrinsic rewards, which are subjective and harder to quantify. This weakens falsifiability slightly, as intrinsic rewards can be invoked post hoc, but it aligns the theory with empirical psychology (e.g., studies showing that religious practices provide intrinsic emotional benefits). The theory loses some parsimony but gains explanatory power for why committed members endure costs that would deter fakirs.  

  If you rejected this critique, I would target **step (6)** next. It asserts that identical public acts must have identical costs and payoffs for all performers. But intrinsic rewards mean the *net utility* differs: the act is effectively "cheaper" for the committed due to their internal state, even if observable costs/benefits are the same. Rejecting step (6) is costlier, as it undermines the theory's reliance on observable behaviour and forces broader acceptance of unmeasurable mental states.  

  On your specific queries:  
  - **Filter vs. signal**: Partly real. The distinction isn't mere relabelling, as signalling emphasises *communication* (individuals voluntarily convey hidden traits via costly acts), while filtering emphasises *selection* (groups impose costs that screen out the uncommitted). Yet in practice, religious practices often blend both, as signals can evolve into institutional filters. Economically, it maps to whether the informed (signaller) or uninformed (screener) moves first, but the mechanisms differ: signals require differential net costs (e.g., via intrinsic rewards), while filters rely on self-selection.  
  - **Camps**:  
    - **Cheap-talk**: Needs intrinsic rewards to explain costly signals when interests aren't perfectly aligned. Without them, cheap signals would suffice for honesty.  
    - **Grafen-style models**: Require lower *marginal net cost* for high-commitment types—intrinsic rewards provide this by reducing net cost, satisfying the differential condition.  
    - **CREDs**: Explicitly relies on intrinsic rewards (sincere belief) to make displays credible; this camp rejects step (5) by treating belief as a non-instrumental benefit that enables honest signalling.  

  After rejecting step (5), costly-signalling theory still predicts:  
  1. Groups with costlier practices will exhibit higher cooperation and resilience, as signals deter free-riders.  
  2. Costly practices will correlate with stronger in-group trust, even after controlling for selection effects.  
  3. Individuals will perceive high-cost performers as more committed, leading to greater social rewards.  

  **Confidence**: High. Intrinsic rewards are empirically attested in religious psychology and resolve the paradox. Only evidence that intrinsic rewards are uniform across committed/non-committed individuals (or irrelevant to net utility) would lower confidence.  

