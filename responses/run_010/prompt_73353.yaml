answer: |-
  Based on the archaeologist's verdicts, her rule prioritizes **empirical demonstrability and methodological parsimony**, specifically:

  - Claims require **primary association of finds** (intact context is essential; see Case 2 vs. Cases 1, 4, 5, 7, 8).
  - **Practical alternatives must be excluded** before non-utilitarian explanations are considered (Case 3).
  - Inferences stop at **patterned behavior**, avoiding **meaning or purpose** (Cases 1, 4, 5, 6, 7, 8).
  - **Single hypotheses must account for multiple independent features** (implied in Cases 3, 4, 6, 7, 8).
  - **Analogy is limited**: It can demonstrate possibility (e.g., a ritual *can* produce such deposits) but not identity (e.g., naming the rite or its meaning; Case 7).

  **Her verdict on the cave** will be:  
  - **Accept**: A deliberate, patterned, non-utilitarian deposit produced by a ritual practice.  
  - **Reject**: Any claim that this ritual is the *same* as the later recorded rite, or any specific meaning (e.g., the bird's symbolic role).  

  **Closest analog**: **Case 7** (later rite producing similar deposits).  
  - **Why?** Both involve analogies from later records to prehistory, intact contexts, and non-utilitarian deposits.  
  - **Does it decide?** Yes: Case 7 establishes that analogy licenses inference to "ritual practice" (as a behavioral pattern) but forbids projecting details (e.g., naming the rite). Thus, it dictates the cave verdict: ritual is accepted as a *category* of action, but not specified further.  

  **What she commits to**:  
  - If she **accepts** ritual practice: She commits to prehistoric ritual as a patterned behavior (institution), evidenced by the deposit's form and the analogy.  
  - If she **rejects** (she won’t): She would deny ritual entirely, but the intact context, excluded alternatives, and analogy make this unlikely.  
  *Commitment here*: **Ritual exists as a behavioral institution** in the prehistoric context, but **no continuity** with the later rite is affirmed (due to the 2000-year gap and absence in the interim record).  

  **One further case to separate rules**:  
  - **Scenario**: A sealed tomb containing unique gold masks and weapons, alongside botanical remains of a non-local, non-utilitarian plant. *No* later analogies or ethnographic parallels exist.  
  - **Why it separates rules**:  
    - **Intact context** (primary association) and **excluded practical alternatives** (non-utilitarian plant) support ritual (aligning with rules A and B).  
    - But **no analogy** (unlike Case 7/cave) means she would *reject* "ritual" (per her reliance on analogy for such leaps) and only accept "non-utilitarian deposit."  
    - This separates her **analogy-dependent ritual inference** (from Case 7/cave) from a hypothetical rule that might accept ritual based solely on context/excluded alternatives.  

  **In essence**: Her rule is a **weighted combination** where intact context and excluded alternatives are necessary but insufficient for ritual claims; analogy is required to cross from "patterned behavior" to "ritual practice," but never to meaning. The cave verdict mirrors Case 7, cementing ritual as behavior, not belief.
