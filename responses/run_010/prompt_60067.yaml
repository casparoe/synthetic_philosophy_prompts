answer: |-
  ### Project Proposal: Indeterminacy of Pre-Tax Income and the "Taxation Is Theft" Debate  
  **Supervisor Approval Draft**  
  **Word Count Estimate:** ~1,500 words (expands to 8,000 in final paper)  
  **Time Commitment:** 10–12 hrs/week for 14 weeks (1 semester)  

  ---

  #### (a) Precise Question  
  Does the *metaphysical indeterminacy* of pre-tax income—specifically, the absence of a baseline-independent fact about "how much of one’s income was rightfully theirs prior to taxation"—render the slogan "taxation is theft" either (i) *unfalsifiable* (because no objective baseline exists to falsify it), (ii) *expressively incoherent* (because it presupposes a determinate pre-tax entitlement that cannot exist), or (iii) *confused* (by conflating normative claims about just distribution with false descriptive claims about pre-state holdings)? If not, does it instead reduce the debate to a second-order disagreement over which *decomposition principle* (e.g., historical entitlement, patterned justice, or institutional baselines) should define pre-tax entitlements—leaving the slogan philosophically intact but practically contestable?  

  **Why this is precise**: Disagreement is possible without talking past one another. One could reject the core premise (arguing pre-tax income *is* determinate), deny that theft-talk requires determinacy (claiming "theft" depends only on non-consensual taking), or argue that the decomposition-principles debate is already the core issue.  

  ---

  #### (b) Why Existing Positions Don’t Settle This  
  The debate stalls because dominant replies ignore the *constitutive role* of legal-institutional frameworks in defining income. I’ll engage two key objections:  

  1. **Libertarian "Historical Entitlement" Reply**:  
     *Claim*: "Theft" depends only on whether the process acquiring pre-tax income was voluntary (e.g., via contracts), not on metaphysical facts about the income itself. If taxation is non-consensual, it’s theft—regardless of baseline indeterminacy.  
     *Why this misses the point*: Voluntary processes (e.g., employment contracts, equity grants) *presuppose* state-constituted systems (corporate personhood, currency, courts). If pre-tax income cannot exist independently of these systems, labeling taxation "non-consensual" ignores that the *entire transactional framework* is state-dependent. The indeterminacy objection asks: "Can ‘voluntary’ even apply to a process whose inputs/outputs are institutionally defined?"  

  2. **Structuralist "No Separable Holding" Reply**:  
     *Claim*: If pre-tax holdings are inseparable from state systems, "theft" is incoherent because there is no distinct thing to steal—taxation is just reallocating shares of a collective product.  
     *Why this misfires*: This conflates *metaphysical separability* (whether pre-tax income exists without the state) with *normative separability* (whether we can justifiably assign shares prior to taxation). The structuralist reply assumes the latter follows from the former. But my argument is stronger: even *if* we accept normative assignments (e.g., "John’s pre-tax salary is $100K"), the assignment itself is baseline-relative—like an ML feature attribution—and thus not uniquely "true."  

  **The stalemate**: Libertarians assume historical processes bypass baseline-dependence; structuralists assume inseparability voids theft-talk. Neither addresses whether baseline-relativity *infects the concept of entitlement itself*.  

  ---

  #### (c) Method: Phased Approach (10–12 hrs/week)  
  **Total Hours**: ~140 hours. **Approach**: *Conceptual analysis* (not case-building) is faster and more rigorous. Building small non-state cases (condo fees, open-source infra) would overextend limited time—each requires reconstructing institutional metaphysics. Instead:  

  - **Phase 1: Framing Indeterminacy (Weeks 1–4)**  
    - Define "metaphysical indeterminacy" for pre-tax income using institutional facts (e.g., currency value depends on central banks; IP depends on copyright law).  
    - Stress-test with counterexamples: e.g., cash transactions in stateless societies. *Output: 2,000-word section*.  

  - **Phase 2: Theft-Talk and Baselines (Weeks 5–8)**  
    - Analyze "theft" as a concept: Does it require a determinate victim-owned thing? Or only non-consensual taking? Engage libertarian/structuralist replies from (b).  
    - Map to ML analogy: If feature attribution requires baselines, does "entitlement attribution" do the same? *Output: 2,500 words*.  

  - **Phase 3: Decomposition Principles (Weeks 9–12)**  
    - Evaluate candidate principles for assigning pre-tax shares:  
      - *Historical baseline* (pre-state or "state-neutral" conditions) → Libertarian favorite.  
      - *Patterned baseline* (e.g., "market value" assuming current institutions) → Structuralist implied.  
      - *Functional baseline* (e.g., "what sustains systems enabling income") → My proposal.  
    - Test principles against simple examples (e.g., a platform’s 30% take rate: is it "theft" or a service fee?). *Output: 2,500 words*.  

  - **Phase 4: Synthesis and Conclusion (Weeks 13–14)**  
    - Does indeterminacy deflate, relocate, or fortify "taxation is theft"? *Output: 1,000 words*.  

  **Why conceptual > case studies**: Arguing directly about theft’s criteria is more efficient—building parallel cases risks descriptive tangents. Examples illustrate but don’t drive the argument.  

  ---

  #### (d) Verdict on the ML Analogy  
  **The analogy is useful but not load-bearing**. It’s a *heuristic* for baseline-dependence in attribution, not proof of income indeterminacy.  

  - **Strengths**: Clearly illustrates how changing baselines (e.g., all-zeros vs. dataset mean) alters "contribution" without changing the output. This mirrors how defining pre-tax income relative to a "state-free baseline" vs. "current institutional mean" yields different entitlements.  
  - **Liability**: It *does* assume a well-defined joint output (e.g., the ML prediction, or gross economic product). If the output itself is indeterminate (e.g., "income" lacks clear boundaries), the analogy collapses. **Mitigation**: Argue that gross income *is* sufficiently defined for decomposition debates (e.g., USD salary amount), even if its moral assignment isn’t.  

  **Recommendation**: Keep it as an intuitive bridge but ground arguments in institutional metaphysics, not ML theory.  

  ---

  #### (e) Success vs. Failure Conditions  
  - **Success**:  
    1. Shows "taxation is theft" is either (i) unfalsifiable (no baseline to test), (ii) incoherent (if theft requires determinate holdings), or (iii) reducible to unresolvable baseline disputes.  
    2. Proves that libertarians *must* defend a specific baseline (e.g., Lockean state-of-nature) to make theft coherent.  
    3. Demonstrates that structuralists rely on *their own* baseline (e.g., patterned justice).  

  - **Failure** (project collapses if):  
    1. "Theft" requires only *non-consensual taking of any amount*, making baseline indeterminacy irrelevant. (Counter: This ignores that theft accusations imply *quantitative wrongness*—e.g., "they took $5K that was *mine*.")  
    2. All baseline choices are morally equivalent (indeterminacy changes nothing). (Counter: Baselines encode normative priorities—e.g., historical vs. functional—so disagreement persists.)  
    3. The debate *is* already about decomposition principles (your angle is deflated). (Counter: Then I’ve clarified that baseline selection is the core—which still reframes the stalemate.)  

  ---

  #### (f) Scope Constraints  
  To fit 8,000 words and part-time hours, **exclude**:  
  - Empirical tax policy (e.g., progressivity vs. flat tax).  
  - Full histories of property theory (Locke, Nozick, Rawls).  
  - Comprehensive libertarian counterarguments beyond core entitlement theory.  
  - Technical ML details (use analogy only illustratively).  
  - Global/cultural variations (focus on liberal democracies with similar tax systems).  

  **Risks**:  
  - Overreach: Chasing every decomposition principle. **Limit to 3 candidates**.  
  - Under-defining "indeterminacy": **Anchor it to institutional metaphysics** (Searle-style "status functions").  

  ---

  **Feasibility Assessment**:  
  - **Idea Survival**: Likely survives. The indeterminacy argument *sharpens* but doesn’t instantly refute theft-talk. It forces baseline-justification into the open.  
  - **Biggest Threat**: If "theft" is purely procedural (non-consent + any loss), your focus on amounts is misplaced. **Preemption**: Argue that theft implies *entitlement to a specific thing*—and indeterminacy voids specificity.  
  - **Why This Works**: Leverages your systems/ML background without requiring philosophy undergrad gaps. The proposal stays in your wheelhouse: **modeling attribution under constraints**.  

  **Next Step**: I’ll draft a bibliography targeting 5 core readings (e.g., on institutional facts, entitlement theory) + 3 optional. Let’s refine the question/method if your supervisor pushes back.
