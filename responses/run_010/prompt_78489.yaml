answer: |-
  Here's a desiderata list for a theory of conceptual slippage adequate for your snail shell domain, grounded in your empirical constraints and the pattern/process tension. I've flagged non-negotiables (NN), camp-specific commitments (CSC), and tensions.

  ### Core Desiderata (Non-Negotiables)
  1. **Graded Judgments with Predictive Power (NN)**  
     *Why*: Your motifs (e.g., bands vs. stripes) and slippages (dots → dashed line) exist on spectra. The theory must output a *degree* of fit (e.g., 0.7 similarity) for novel shell pairs and predict human disagreement (e.g., "60% of observers call this a band, 40% a stripe").  
     *Case*: A shell with faint, irregular bands – a theory must quantify its "band-ness" and predict observer variance.  
     *Tension*: Requires modeling subjectivity without collapsing into relativism.

  2. **Process-Pattern Decoupling (NN)**  
     *Why*: Shells with identical patterns may have different developmental histories ("schedules"). The theory must *not* assume static motifs map directly to processes.  
     *Case*: Two shells with identical "chevron" patterns: one grown steadily, one with growth spurts altering pigment deposition. The theory must license slippage (chevron → tent) without implying identical causation.  
     *Tension*: Forces the theory to handle *morphological equivalence without causal equivalence*.

  3. **Novelty Handling without Lookup Tables (NN)**  
     *Why*: You need predictions for unseen shells. The theory must generate slippage licenses from first principles (e.g., relational structures, feature weights), not memorized examples.  
     *Case*: A shell with "flames" intersecting a new dot-matrix pattern – no prior catalog entry exists.

  4. **Operationalizability (NN)**  
     *Why*: You demand a tool, not a parable. The theory must be implementable as code or a procedure that ingests shell descriptions and outputs slippage licenses.  
     *Case*: If it requires "ideal observer" insights (e.g., noticing undetectable micro-features), it’s useless for your empiricist framework.

  ### Explanatory Desiderata
  5. **Explain Obvious vs. Arbitrary Distinctions**  
     *Why*: Some slippages feel natural (chevron → zigzag), others forced (blotch → flame). The theory must *explain why* via mechanisms (e.g., relational alignment, topological invariance), not just label them.  
     *Case*: Why is "dots → dashed line" intuitive but "dots → band" jarring? A theory citing "shared directionality" for dots/dashes but not dots/bands succeeds.  
     *CSC Risk*: Some theories may prioritize structural alignment over perceptual salience.

  6. **Vocabulary Fluidity Accommodation**  
     *Why*: Your band/stripe boundary is inherently fuzzy. The theory must treat categories as porous and context-dependent, not demand rigid definitions.  
     *Case*: A "band" that thins irregularly – the theory should allow slippage to "stripe" without requiring a fixed width threshold.  
     *CSC Alert*: Classical categorization theories (e.g., necessary/sufficient conditions) fail here; prototype/exemplar models fare better.

  ### Consistency & Constraint Desiderata
  7. **Clustered Consistency without Determinism**  
     *Why*: Repeated runs on the same shell pair should yield *similar* outputs (e.g., 0.6–0.7 fit), not identical (deterministic) or random scores.  
     *Case*: Human observers consistently rate a motif as borderline band/stripe but occasionally diverge – the model should mirror this variance.  
     *Tension*: Directly clashes with rigid symbolic AI approaches.

  8. **No Peeking (Anti-Post-Hoc Justification) (NN)**  
     *Why*: The theory cannot retroactively redefine criteria to fit outcomes (e.g., "the slippage worked because I say so"). Licenses must derive from pre-defined, transparent mechanisms.  
     *Case*: If a chevron→zigzag slippage fails, the theory can’t invent a new "angle tolerance" rule *after* seeing the shells.

  ### The Central Tension
  **Fluidity vs. Constraint (NN Conflict)**  
  - *Fluidity Demand*: The theory must permit multiple valid slippages (e.g., chevron → zigzag OR tent).  
  - *Constraint Demand*: It must rule out invalid slippages (e.g., blotch → single line) and predict which boundaries (e.g., band/stripe) are inherently disputed.  
  - *Why It’s Fatal*: Most theories sacrifice one for the other. Over-constrain and you lose slippage; over-relax and everything analogizes to everything. **This tension alone disqualifies most off-the-shelf solutions.** Your hunch is correct: this is where theories tear apart.

  ---

  ### Which Requirement Does the Most Damage?  
  **Process-Pattern Decoupling (Desideratum 2)**. Most analogy theories (e.g., structure-mapping) assume static relational structures. Your domain *requires* decoupling static output from dynamic generation – a temporal disconnect few theories address. They either ignore process (favoring pattern) or conflate the two.

  ---

  ### Theory Snapshots vs. Desiderata  
  1. **Copycat Architecture**  
     - *Strengths*: Built for slippage (e.g., "abc" → "ijk" via alphabet shifts). Handles graded novelty, fluid vocabularies (Desiderata 1,3,6).  
     - *Weaknesses*: Struggles with process-pattern decoupling (assumes "slippable" features are given). Operational but opaque; consistency relies heavily on temperature parameters (Desiderata 2,7).  

  2. **Structure-Mapping Theory (SMT)**  
     - *Strengths*: Explains obvious/arbitrary via systematicity (Desideratum 5). Constrains slippage via relational alignment.  
     - *Weaknesses*: Relies on predefined predicates (fails Desideratum 6). Poor at process-pattern decoupling (treats patterns as static structures). Not naturally graded (binary "match/don’t match") (Desiderata 1,2,6).  

  3. **Similarity Metric (Contrast Model)**  
     - *Strengths*: Graded judgments, implementable, handles novelty via feature weights (Desiderata 1,3,4).  
     - *Weaknesses*: No explanation for obvious/arbitrary – it’s descriptive. Fails process-pattern decoupling (weights are static). Collapses under vocabulary fluidity (e.g., how to weight "band-ness" vs. "stripe-ness"?) (Desiderata 2,5,6).  

  ---

  **The Upshot**: Your desiderata expose a gap. Existing theories handle *either* fluidity *or* constraint, but your domain (pattern/process decoupling + fuzzy motifs) demands both. A viable theory must incorporate **temporal dynamics** (how processes "freeze" into patterns) and **perceptual topology** (why some morphologies "slide" naturally). Until then, the list *is* the result – a diagnostic for why analogy stumbles on lived experience.
