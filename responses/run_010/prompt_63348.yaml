  The window shows a thinning maple crown.
  His left hand lies precisely on the sheet.
  The kettle whispers in the fading town.
  A thousand miles of silence, slow and deep.

  The contract waits beside the passport's blue.
  A foreign city sharpens in the light.
  This work could root the scholarship I do.
  A necessary plane must leave tonight.

  The spoon must lift the broth, however weak.
  The sheets require a turning, slow and sure.
  The fragile wrist, the barely risen cheek,
  demand attendance quiet and obscure.

  The conference hall expects a certain name.
  The key unlocks a flat where no one waits.
  This path defines the structure of the game.
  A different future gathers at its gates.

