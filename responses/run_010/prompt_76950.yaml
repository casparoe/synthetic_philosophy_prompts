  First, I need to catalog the possible interpretations of "existence is not a predicate" as rigorously as possible. The user expects at least six readings: logical form of singular existentials, grammatical classification of "exists," Fregean/Russellian second-order view, metaphysical property status (abundant vs sparse), Kant's "real predicate" criterion, and quantifier deflationism. I'll consider whether to add more, like the performative aspect or substitution behavior in intensional contexts.

  For each reading, I must provide: precise formulation, status (platitude/defensible/contested/false), entailment relations, and relevant opponents. The Kantian and Fregean readings seem distinct - one about concept determination, the other about logical types. I should also separate the grammatical claim from the logical one, since "exists" syntactically behaves like a predicate even if semantically special.

  Then I'll map these to the three seminar uses: 
  1) Against ontological argument - only Kantian reading directly applies, and even then modal versions evade it. 
  2) Fictional objects - Russellian analysis avoids commitment but leaves semantic puzzles unresolved. 
  3) Mathematical existence - here the slogan presupposes the second-order view rather than supporting it. 

  For diagnostics, I'll identify test cases: "Ghosts exist" vs "Sherlock doesn't exist" vs "Prime numbers exist" - each challenges different readings. Negative existentials particularly strain deflationary views.

  The core confusion to warn against is conflating grammatical predicate-hood with logical/meta-physical property-hood. That should be the handout's header. 

  Throughout, I'll avoid historical surveys and focus on conceptual distinctions, since the user knows the literature. The goal is to equip students with analytical tools to dissect the slogan's varied deployments.
answer: |-
  Here is the disambiguated inventory of "existence is not a predicate" theses, structured per your requirements. The readings are ordered from least to most metaphysically substantive.

  ### I. Inventory of Distinct Theses
  1. **Grammatical Thesis (GT)**  
     *Formulation*: In natural language (e.g., English), "exists" is syntactically a predicate (verb).  
     *Status*: **False**. Competent speakers treat "exists" grammatically as a predicate (e.g., "Unicorns exist," "Socrates existed").  
     *Entailments*: Independent of all other readings; GT's falsity is irrelevant to their truth.

  2. **Logical Form Thesis (LFT)**  
     *Formulation*: Singular existential claims (e.g., "Sherlock Holmes exists") are not atomic subject-predicate propositions of the form *Fa*.  
     *Status*: **Platitude** (accepted by Frege, Russell, Quine; denied only by Meinongians).  
     *Entailments*: Implied by RT and ST below. Consistent with DT and KT.

  3. **Deflationary Thesis (DT)**  
     *Formulation*: The existential quantifier (∃) exhausts the logical content of "existence"; no substantive property corresponds to it.  
     *Status*: **Substantive and defensible** (e.g., Carnap, deflationists). Contested by property realists.  
     *Entailments*: Consistent with LFT, RT, ST; neutral on KT and MPT.

  4. **Russellian/Type-Theoretic Thesis (RT)**  
     *Formulation*: Existence is a second-order property (a property of concepts/propositional functions): "X exists" means ∃*x* F*x* (for *F* = concept of *X*).  
     *Status*: **Substantive and defensible** (Frege, Russell). Contested by first-order property advocates (e.g., free logicians).  
     *Entailments*: Entails LFT. Consistent with DT, KT, MPT.

  5. **Kantian Thesis (KT)**  
     *Formulation*: "Existence" adds no *determining content* to a concept (i.e., it doesn't specify *what* the object is like).  
     *Status*: **Substantive and contested** (Kantians vs. defenders of "existence" as a determinable property).  
     *Entailments*: Independent of RT/LFT (e.g., one can deny RT but accept KT). Implies DT if "property" requires determining content.

  6. **Metaphysical Property Thesis (MPT)**  
     *Formulation*: Existence is not a *sparse property* (a fundamental, causal/natural property of objects).  
     *Status*: **Substantive and contested**. Platitude for sparse property theorists (e.g., Armstrong); false on abundant property views (where all predicates denote properties).  
     *Entailments*: Consistent with RT/KT/DT but neutral between them. Denied by those treating existence as a first-order sparse property.

  7. **Semantic Substitution Thesis (SST)**  
     *Formulation*: "Exists" cannot be coherently predicated in atomic sentences without generating paradox or presupposition failure (e.g., "Sherlock exists" implies Sherlock has being).  
     *Status*: **Substantive and defensible** (Russell, semantic anti-Meinongians). Contested by free logicians.  
     *Entailments*: Entails LFT. Strengthens RT by addressing singular terms.

  ### II. Verdict on Seminar Uses
  - **Ontological Argument (OA)**:  
    Only **KT** directly refutes Anselm's OA (existence adds no perfection to God's concept).  
    *Caveat*: KT fails against **modal** OA versions (e.g., Plantinga), which treat *necessary existence* as a determining property.  
    *Slogan's success*: **Partial**—only on Kantian reading, not others.  

  - **Fictional Names (Sherlock Holmes)**:  
    **RT** or **SST** resolves the *metaphysical* problem (no commitment to non-existent objects).  
    *Unresolved*: The *semantic* problem of how "Sherlock" refers in "Sherlock doesn't exist." RT/SST relocate this to the theory of reference (e.g., descriptivism).  
    *Slogan's success*: **Limited**—solves ontological commitment but not semantics.  

  - **Arithmetic Existence**:  
    The dismissal **presupposes RT** (existence is second-order: "numbers exist" = numeral concepts are instantiated).  
    It does *not* support RT; it **assumes it**. Opponents (e.g., Platonists) deny RT by treating numbers as objects with first-order existence.  
    *Slogan's success*: **Circular**—only works if RT is already granted.  

  ### III. Diagnostic Sentence Patterns
  | Pattern                  | Example               | Problematic For                         | Diagnostic Power                     |
  |--------------------------|-----------------------|------------------------------------------|---------------------------------------|
  | **Singular Affirmative** | "Socrates exists."    | SST, RT (if read as atomic)              | Tests if "exists" is ever first-order |
  | **Singular Negative**    | "Pegasus doesn’t exist." | GT, naive RT (without descriptivism)   | Exposes reference failure issues      |
  | **Quantificational**     | "Electrons exist."    | None (all accept as ∃*x* Electron(*x*)) | Neutral                              |
  | **Mathematical**         | "Primes > 2 exist."   | MPT (if sparse properties), KT           | Tests if existence is "substantive"   |

  ### IV. The Prime Confusion (Handout Header)
  **"Do not conflate 'existence is not a grammatical predicate' (false) with 'existence is not a first-order logical/meta-physical property' (substantive thesis)."**

  ### Summary of Key Dependencies
  - RT/SST ⇒ LFT ⇏ RT/SST (LFT is weaker).  
  - KT ⇒ DT only if "property" entails determining content.  
  - MPT is orthogonal to logical debates (RT/LFT).  
  - GT is irrelevant to all substantive disputes.  

  This framework isolates how each seminar use invoked a *different* thesis under the same slogan, exposing non-trivial inferential gaps—especially in the mathematical case (presupposing RT) and the OA (KT’s limitations). The diagnostics help students spot which thesis is operative in a given argument.
