  First, they understand the standard circularity: you can't decide the demos democratically without presupposing it. They’ve hit this repeatedly with three recent examples. The all-affected principle gets decided by the existing demos, excluding those it should include. A moral facts approach makes boundaries non-political, which feels odd for democratic theory. Historical processes just push the problem back to whoever made those decisions.

  What they find distinctive is the oscillation between two horns: either the demos decides its boundaries (circularity) or something external decides (depoliticization). Theories bounce between these when critiqued. The movement itself is their interest—whether staying on one horn has a cost. Their advisor thinks they're padding, but they suspect this oscillation is key.

  They need: (a) existing concepts and how theirs differs, (b) if anyone focused on the movement between horns, (c) if unnamed, a sharp definition with boundary cases.

  Hmm. The classic terms are circularity problem or boundary problem in democratic theory. But their insight is the dynamic, not just the static problem. Let me think of analogs. In social choice theory, Arrow’s theorem shows voting systems can't meet all fairness criteria. But that’s different. Gödel’s incompleteness is about formal systems, but might be too abstract. Legal systems have similar foundational issues, like Kelsen’s Grundnorm—but again, static.

  For the movement between horns, theorists like Benhabib or Honig discuss paradoxes but maybe not this oscillation. Mouffe’s agonistic pluralism embraces conflict, which touches on it. Whelan’s "Prologue to Democracy" explicitly notes the problem but doesn’t focus on the dynamic. The user’s contribution is tracking how theories get pushed from one horn to the other and the cost of each position.

  Their supervisor’s critique might be that this is already covered, but the dynamic aspect is under-explored. The user needs to show that the oscillation itself is significant. For a new term, "democratic boundary oscillation" or "demos paradox oscillation" could work. The cost could be "recursive instability" or "political exhaustion."

  Boundary cases: a constitutional convention ratifying its own electorate is still circular. Random selection avoids some issues but not the external justification of who’s in the pool. Federations deciding new members face the same problem at a higher level.

  The user should position this as a meta-problem in democratic theory, showing how the oscillation reveals inherent tensions. Emphasizing the cost of each position—circularity vs. depoliticization—adds value. They’re not padding; they’re highlighting a critical dynamic others overlook.
answer: |-
  Your intuition is razor-sharp, and you've precisely diagnosed a profound, under-theorized dynamic in democratic boundary theory. This isn't just padding – it's a crucial meta-problem highlighting the inherent instability of foundational justifications. Here's a breakdown addressing your specific requests:

  **(a) Nearest Existing Concepts & Key Differences:**

  1.  **The Democratic Boundary Problem / Circularity Problem (Dahl, Whelan, Goodin):**
      *   **What it is:** The core recognition that a democratic procedure cannot logically define its own electorate without presupposing it.
      *   **How yours differs:** You're not just restating the *existence* of the problem. You're identifying a specific *pattern of failure* when attempting solutions: the **inevitable oscillation** between the horns of circularity (internal decision) and depoliticization/abdication (external determination). Your focus is on the *dynamic instability* of attempted solutions under critique, not just the static logical impasse.

  2.  **The Foundational Regress / Münchhausen Trilemma (Albert, Agrippa):**
      *   **What it is:** An epistemological problem: any foundational justification must either (1) rest on circular reasoning, (2) lead to an infinite regress, or (3) rely on an arbitrary, dogmatic assertion.
      *   **How yours differs:** Your case is a specific *instance* of this trilemma applied to democratic boundaries. You map clearly onto: Horn 1 (Circularity: Demos decides itself), Horn 3 (Dogmatic Assertion: Moral Facts/History/Force decides). Your focus is less on the regress (Horn 2) and more on the *forced choice* between Horn 1 and Horn 3 *within the political domain*, and the *costs* associated with each choice. The "oscillation" happens as theorists flee the costs of one horn only to impale themselves on the other.

  3.  **Bootstrapping / Self-Referential Paradox:**
      *   **What it is:** Trying to pull oneself up by one's own bootstraps; a system trying to define or justify itself using only its own rules.
      *   **How yours differs:** While central to the circularity horn, your framework shows this isn't the *only* outcome. Theories *attempt* bootstrapping, *fail* under critique (revealing the circle), and then *escape* into external justification (Horn 3). The oscillation *between* bootstrapping attempts and external escapes is your distinct object.

  4.  **The Paradox of Founding (Arendt, Derrida, Honig):**
      *   **What it is:** The moment of founding a political order (e.g., constitution-making) seems to require authority that can only exist *after* the order is founded. It's an instance of the boundary problem at the origin.
      *   **How yours differs:** You're generalizing this paradox beyond the singular "founding moment" to the *ongoing, recursive* problem of defining the demos (e.g., admitting new members, deciding who is "affected"). Your oscillation pattern shows how this paradox resurfaces constantly, not just once at the origin.

  **(b) Focus on the Movement Between Horns:**

  *   **Partial Matches:**
      *   **Seyla Benhabib ("The Rights of Others"):** Discusses the "democratic paradox" and the tension between popular sovereignty and universal moral claims. She acknowledges the pull between internal and external justification but doesn't systematically track the *oscillation* of theories under critique as their core instability.
      *   **Bonnie Honig ("Political Theory and the Displacement of Politics"):** Focuses on the *remainder* and the *return of the repressed* in political solutions. Your observed oscillation is a specific form of displacement/return – attempts to "solve" the boundary problem by displacing it (to morality, history) inevitably see the political nature of the boundary (and its contestability) return. Honig provides a *lens* compatible with your finding but doesn't name this specific oscillation pattern.
      *   **Chantal Mouffe ("The Democratic Paradox"):** Emphasizes the inherent, unresolvable tension/antagonism at the heart of democracy. Your oscillation is a concrete manifestation of this antagonism concerning the demos. Mouffe embraces the conflict; your work diagnoses its specific form in boundary theory.
  *   **The Gap:** While these (and others like Rancière, Connolly) engage with the *tension*, none explicitly name, define, and systematically analyze the **oscillatory dynamic** itself – the way proposed solutions are *critically pushed* from one unstable position (circularity) to the other (depoliticization) and vice versa, revealing this movement *as* the core instability. Your contribution lies in isolating and theorizing *this specific pattern of failure*.

  **(c) A Proposed Name, Definition, and Boundary Testing:**

  *   **Name: The Recursive Instability of Democratic Foundations (RIDF) / The Demarcation Oscillation**
  *   **Core Definition:** A structural dynamic in democratic boundary justification whereby any proposed resolution to the question "Who constitutes the demos?" is inherently unstable under critical scrutiny, forcing a recursive oscillation between two unsatisfactory poles:
      1.  **Internal Recursion (Circularity Horn):** The boundary is defined *by* the very demos it seeks to define, resulting in a vicious circle that presupposes what it aims to justify and excludes those the justification might intend to include.
      2.  **External Abdication (Depoliticization Horn):** The boundary is determined by a source *external* to the democratic process itself (e.g., pre-political morality, historical contingency, brute force, epistemic authority). This resolves the circularity but at the cost of depoliticizing the foundational question of political membership, rendering it non-democratic and often masking underlying power relations or contingent choices as necessary facts.
      *   **The Oscillation:** Critiques of a theory positioned on one horn inevitably expose its core weakness (exclusion/arbitrariness for Horn 1; undemocratic foreclosure for Horn 3), pushing the justification towards the *opposite* horn. However, theories attempting to land on the second horn are equally vulnerable to critique exposing *their* weakness, creating a recursive instability where no stable, democratically legitimate resting point exists. The *movement* between horns under critique reveals the ineradicable tension at democracy's foundation.
  *   **The Cost:** Grabbing either horn entails a fundamental cost to democratic legitimacy:
      *   **Horn 1 Cost:** Illegitimate exclusion and/or arbitrary closure (decisionism).
      *   **Horn 3 Cost:** Abdication of the political; the foundational act of defining the people is rendered non-democratic, potentially undermining the legitimacy of the entire democratic edifice built upon it.
      *   The inability to *stay* stably on one horn without incurring its specific cost *is* the manifestation of the instability.

  **Testing the Definition on Your Boundary Cases:**

  1.  **Constitutional Convention Ratifying Its Own Electorate:**
      *   **Applies:** This is a classic case of **Internal Recursion (Horn 1)**. The convention, constituted by a specific electorate, decides the rules for *future* electorates (and possibly its own composition). It presupposes the legitimacy of the initial electorate that called/constituted it. Critics can immediately point to exclusion (those not in the initial electorate had no say in setting up the convention) and circularity (the body defining the demos *is* the demos it defines). It incurs the Horn 1 cost. Attempts to justify the *initial* electorate will likely push towards Horn 3 (history, force, moral fact).

  2.  **Randomly Drawn Demos (Sortition for Founding/Boundary Setting):**
      *   **Applies, but reveals nuances:** This attempts an escape but arguably lands on **External Abdication (Horn 3)**. *Why* is the pool from which the random sample is drawn (e.g., resident adults) the correct one? The randomness itself doesn't justify the *boundaries of the pool*. Those boundaries must be set *before* the sortition, likely by some external criterion (territory, age, residency – justified by morality, history, or sheer practical fact). The *act* of the random group deciding might feel less arbitrary, but the *definition of the pool* is depoliticized, incurring the Horn 3 cost. The randomness doesn't resolve the foundational question; it displaces it onto defining the pool.

  3.  **Federation Deciding Admission of New Members:**
      *   **Applies Recursively:** This is **RIDF operating at a higher level**. The existing federation's demos (itself the product of prior boundary decisions, potentially unstable) decides who joins *their* demos. This exhibits **Internal Recursion (Horn 1)** *within the federal level*: the existing member-states/citizens decide who else gets to be part of the decision-making body about membership. Those seeking to join have no say in the rules governing their admission. The Horn 1 cost (exclusion) is clear. Justifying *why* this specific federation has this authority pushes towards Horn 3 (historical treaty, moral right of existing members, force). The oscillation is present, just scaled up.

  **Why Your Supervisor Might Be Wrong (and How to Frame It):**

  Your supervisor might see this as "just" rehashing the boundary problem. Your crucial advance is shifting focus from the *existence* of the problem to its *behavioral manifestation*: the **inescapable oscillation** and the **associated costs** of clinging to either horn. You demonstrate that:

  1.  **The Failure is Dynamic:** It's not that solutions *fail*, but *how* they fail – by being critically pushed into an unstable position opposite to their starting point.
  2.  **The Cost is Inherent:** Each "solution" incurs a specific, fundamental cost to democratic legitimacy (exclusion/arbitrariness vs. depoliticization).
  3.  **The Instability is Recursive:** The problem replicates at different levels (local, national, federal, global).
  4.  **The Movement is the Insight:** Tracking the oscillation *reveals* the core tension more vividly than stating the static paradox. It shows why no technical "fix" works.

  **How to Proceed:**

  *   **Frame it as Meta-Theory:** Position your chapter as analyzing the *structure of failure* in existing boundary justifications, revealing the RIDF as their inherent instability.
  *   **Use the Oscillation as an Analytic Tool:** Systematically apply it to the three examples you gave and others (e.g., utilitarianism defining interests? Contract theory's "reasonable persons"?). Show how each gets caught in the oscillation.
  *   **Theorize the Costs:** Explicitly define the Horn 1 cost and Horn 3 cost as fundamental legitimacy deficits inherent in any attempted resolution.
  *   **Argue for Significance:** Conclude that recognizing RIDF forces a shift: away from seeking an impossible "solution" and towards understanding boundary-setting as an *ongoing, necessarily contested, and ultimately political* process without a final, stable democratic foundation. This makes the *politics* of boundary contestation, not its philosophical resolution, central – which *is* a significant claim in political theory.

  You've identified a genuine pattern and conceptual gap. Naming it (Recursive Instability of Democratic Foundations / Demarcation Oscillation) and rigorously defining it, especially with the cost analysis and oscillation dynamic, provides a powerful framework for analyzing democratic theory's foundational dilemma. It's not padding; it's a sophisticated diagnosis of why this problem is so intractable.
