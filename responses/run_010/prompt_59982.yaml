prompt: |-
  I am in the second year of a PhD in political theory, writing a dissertation chapter on how Victorian liberals thought the legitimacy of property was to be argued for once the electorate stopped being confined to property-holders. My chapter centres on Mill's posthumous *Chapters on Socialism*, and I keep coming back to the two paragraphs that open the first of them, because I suspect a good deal of his late position is compressed into them and I cannot get a stable reading. The text appeared in 1879, some years after his death, under a preliminary notice by Helen Taylor warning that "the chapters now printed are the first rough drafts thrown down towards the foundation of that work." Here is the opening (from a public-domain electronic edition; I have removed the e-text's page-break numerals and stopped where my copy breaks off):

  > In the great country beyond the Atlantic, which is now well-nigh the most powerful country in the world, and will soon be indisputably so, manhood suffrage prevails. Such is also the political qualification of France since 1848, and has become that of the German Confederation, though not of all the several states composing it. In Great Britain the suffrage is not yet so widely extended, but the last Reform Act admitted within what is called the pale of the Constitution so large a body of those who live on weekly wages, that as soon and as often as these shall choose to act together as a class, and exert for any common object the whole of the electoral power which our present institutions give them, they will exercise, though not a complete ascendency, a very great influence on legislation. Now these are the very class which, in the vocabulary of the higher ranks, are said to have no stake in the country. Of course they have in reality the greatest stake, since their daily bread depends on its prosperity. But they are not engaged (we may call it bribed) by any peculiar interest of their own, to the support of property as it is, least of all to the support of inequalities of property. So far as their power reaches, or may hereafter reach, the laws of property have to depend for support upon considerations of a public nature, upon the estimate made of their conduciveness to the general welfare, and not upon motives of a mere personal character operating on the minds of those who have control over the Government.
  >
  > It seems to me that the greatness of this change is as yet by no means completely realized, either by those who opposed, or by those who effected our last constitutional reform. To say the truth, the perceptions of Englishmen are of late somewhat blunted as to the tendencies of political changes. They have seen so many changes made, from which, while only in prospect, vast expectations were entertained, both of evil and of good, while the results of either kind that actually followed seemed far short of what had been predicted, that they have come to feel as if it were the nature of political changes not to fulfil expectation, and have fallen into a habit of half-unconscious belief that such changes, when they take place without a violent revolution, do not much or permanently disturb in practice the course of things habitual to the country. This, however, is but a superficial view either of the past or of the future. The various reforms of the last two generations have been at least as fruitful in important consequences as was foretold. The predictions were often erroneous as to the suddenness of the effects, and sometimes even as to the kind of effect. We laugh at the vain expectations of those who thought that Catholic emancipation would tranquilize Ireland, or reconcile it to British rule. At the end of the first ten years of the Reform Act of 1832, few continued to think either that it would remove every important practical grievance, or that it had opened the door to universal suffrage. But five-and-twenty years more of its operation had given scope for a large development of its indirect working, which is much more momentous than the direct. Sudden effects in history are generally superficial.

  Six things I would like help with, in roughly ascending order of how unsure I am about them.

  1. The inference. What licenses the move from the enlargement of the franchise to the claim that the laws of property "have to depend for support upon considerations of a public nature"? I can see three readings and cannot choose: (a) a conceptual point about the ground of justification — since the class whose support used to be decisive is no longer the only decisive voice, only reasons addressable to everyone can now carry the day; (b) a causal prediction about how legislation will in fact be defended; (c) a normative demand on Mill's own class to learn a public vocabulary. Does it matter that he writes "have to depend" rather than "ought to depend"? And is the passage ultimately a claim about the justification of property, or about the sociology of justification?

  2. The parenthetical. What work is "(we may call it bribed)" doing? If the property-holder's support for property was a bribe, then the pre-Reform consensus was epistemically compromised and not merely partial. Does that commit Mill to thinking the new electorate judges the general welfare *better* precisely because it lacks a peculiar interest in the existing distribution? That seems in tension with the symmetry of his general complaint about class legislation.

  3. "No stake in the country." He inverts the higher ranks' vocabulary — these people are said to have no stake, yet "they have in reality the greatest stake, since their daily bread depends on its prosperity" — and then immediately says they have no peculiar interest of their own in supporting property as it is. Please reconstruct whatever distinction resolves having the greatest stake but no peculiar interest (stake in national prosperity versus interest in a particular distribution, perhaps?), and tell me whether Mill actually has that distinction available here or whether the two sentences are pulling against each other. Is the redescription of "stake" a substantive argument or a rhetorical substitution of a functional notion for a proprietary one?

  4. The theory of prediction. Mill diagnoses a "blunted" perception, says the old forecasts were wrong as to suddenness and sometimes as to kind but not as to magnitude, says indirect working is "much more momentous than the direct," and concludes that sudden effects in history are superficial. What account of institutional change is this? In particular: is the error he identifies one of timing, of mechanism, or of the level at which one looks? He appears to mean all three. Does that leave him with a coherent view, or does the claim that predictions were right about magnitude while wrong about kind and timing amount to a way of immunising any reform against disconfirmation — which would be a real problem for someone who, as I read him elsewhere in these chapters, wants the socialist proposal judged by experience rather than by a priori argument?

  5. A formulation of my own that I want tested. I have been telling myself that Mill holds political change to be predictable as to direction but not as to pathway, and that the resulting uncertainty is asymmetric: it discounts confident promises more heavily than confident fears. That is my vocabulary, not his. Does the passage support it, resist it, or say something better? If you can state his position more precisely — in terms of what he takes the forecaster to know and not to know — please do, and mark where my gloss distorts.

  6. Draft status. Given Taylor's warning that these are rough drafts which might have been reordered or absorbed elsewhere, how much weight can questions 1–5 bear? Which of them survive the caveat and which depend on assuming a finish Mill never gave the text? Are there features of these paragraphs — the aside, the loose "To say the truth," the heap of historical illustration — that mark them as unrevised, and should I treat them as evidence of a settled late view or only of working assumptions?

  I am not after references, a bibliography, or the standard summary of Mill's attitude to socialism; please work from the passage itself and from what you can reliably say about his wider thought. I would rather you told me plainly where my questions import distinctions Mill is not drawing than that you answered them all affirmatively.
