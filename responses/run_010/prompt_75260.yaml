  ### Activity Design: "The Word in the Jungle"

  #### **Core Concept**
  Participants become field linguists encountering the "Junglefolk" tribe. The goal is to translate their word "Zab" via observable behavior. Responses are mechanically predetermined to be consistent with three interpretations: "rabbit," "undetached rabbit part," or "temporal rabbit stage." The indeterminacy arises because all tests yield identical results under all three manuals.

  ---

  ### **1. Roles, Rules, Materials & Timeline**  
  *(For 11-16 people; adjustments for 7 in Section 5)*  

  #### **Roles**  
  - **Linguists (10-14 people)**: Split into 3 groups. Each devises tests, records data, and builds a translation manual.  
  - **Elders (1-2 people)**: Verify tests adhere to rules and tally points.  
  - **Facilitator (You)**: Manage flow, play the "Oracle" (voice of the Junglefolk), and enforce rules.  

  #### **Materials**  
  - **Stationery**:  
    - 3 sets of colored index cards (red, blue, green) for manuals.  
    - 1 large poster board for "Observation Log."  
    - Sticky notes, markers, dice (2 six-sided), a bell.  
    - 20+ rabbit images (whole rabbits, rabbits behind screens, rabbit pairs, etc. — *see examples below*).  
  - **Printed Materials**:  
    - **Test Cards (15)**: Pre-written test scenarios (e.g., "Point to a rabbit’s ear").  
    - **Oracle Cards (3 decks)**: Determine Junglefolk responses. Each deck corresponds to a manual (rabbit/part/stage) but yields identical outputs.  
    - **Response Key**: A table translating dice rolls into Junglefolk utterances (e.g., "Zab," "Gah," "Dak").  

  #### **Rules**  
  - Tests must use physical props (images, gestures).  
  - Junglefolk only "speak" through the Oracle (you). Responses come from dice rolls + the Response Key.  
  - Groups earn points for consistent predictions, not "correctness."  

  #### **Timeline (90 mins)**  
  - **0–10 min**: Setup. Explain roles, rules, and scoring. Show the "rabbit scene" (image + "Zab!").  
  - **10–40 min**: **Testing Phase**. Groups propose tests. For each test:  
    - Elders approve it → Facilitator rolls dice → Oracle gives response using Key.  
    - Groups log results on the Observation Log.  
  - **40–55 min**: **Manual-Building**. Groups create translation manuals (e.g., "Zab = Rabbit").  
  - **55–70 min**: **Final Challenge**. Groups use manuals to predict Junglefolk reactions to 3 new tests.  
  - **70–85 min**: **Scoring & Reveal**. Tally points. Show manuals are equally valid. Debrief Quine.  
  - **85–90 min**: Q&A.  

  ---

  ### **2. Scoring Scheme & Final Challenge**  

  #### **Scoring**  
  - **1 point** per accurate prediction during testing.  
  - **3 points** for each correct Final Challenge prediction.  
  - **Elder Bonus**: 1 point to any group that invents a novel test.  
  - **No money, pure prestige**: Winning group names the "official" Junglefolk manual (later revealed as arbitrary).  

  #### **Final Challenge**  
  Groups use their manuals to predict Junglefolk responses to:  
  1. A rabbit half-hidden behind a screen ("What is this?").  
  2. The same rabbit shown twice ("Same Zab?").  
  3. A rabbit’s foot (attached to a rabbit) ("Zab?").  

  **How responses stay consistent**:  
  - **Half-hidden rabbit**: All manuals output "Zab" (rabbit present → rabbit/part/stage present).  
  - **Same rabbit twice**: All output "Gah" ("no" for identity – *explained in Key*).  
  - **Attached foot**: All output "Zab" (part of rabbit → valid under all interpretations).  

  *Result*: All manuals score equally. The point: **All work identically in practice**.  

  ---

  ### **3. Mechanizing the Native: The Oracle System**  
  *No human "native" – responses come from dice + a fixed Key.*  

  #### **Response Key**  
  *(Write this on a poster; dice rolls determine outputs)*  
  | Dice Roll | "What is this?" | "Same?" | "Not?" |  
  |-----------|-----------------|---------|--------|  
  | 2, 3, 4   | Zab             | Dak     | Zab    |  
  | 5, 6, 7   | Gah             | Gah     | Gah    |  
  | 8, 9, 10  | Zab             | Zab     | Dak    |  
  | 11, 12    | Dak             | Dak     | Zab    |  

  **How it works**:  
  - For any test, you roll two dice.  
  - Match the roll to the Key’s output for that test type.  
  - **Pre-set consistency**: Outputs are fixed to align with all three manuals.  
    - *Example*: For "attached foot," all manuals interpret it as "Zab." Rolls 2–4, 8–10, or 11–12 yield "Zab" (see Key).  

  #### **Test Card Examples**  
  *(Pre-print these; groups pick cards to "test")*  
  1. Point to a whole rabbit. → "What is this?"  
  2. Point to the same rabbit 5 minutes later. → "Same Zab?"  
  3. Point to a rabbit’s ear (attached). → "What is this?"  
  4. Show an image with no rabbit. → "Zab?"  
  5. Point to a rabbit behind a screen (only ear visible). → "What is this?"  

  **Magic**: For each test, the Key outputs identically for all manuals. *You never need to pick a "true" meaning*.  

  ---

  ### **4. Anticipated Tests & Neutralizing Them**  
  Groups will try classic Quinean tests. All are rigged to fail:  

  | Test                  | How It’s Neutralized                                                                 |  
  |-----------------------|--------------------------------------------------------------------------------------|  
  | **Part vs. whole**    | Attached part (e.g., ear) → "Zab" for all manuals (part of rabbit = valid reference). |  
  | **Same rabbit twice** | Output "Gah" ("no") for "Same?" – manuals interpret "same" differently (stage/part ≠ persistent rabbit). |  
  | **Half-hidden rabbit**| Output "Zab" – rabbit/part/stage still present.                                      |  
  | **Negation**          | "Not Zab?" for a non-rabbit → Output "Dak" ("yes, not Zab"). Consistent for all.      |  
  | **Rabbit vs. lookalike**| Show a hare → Output "Gah" ("not Zab"). No manual includes non-rabbits.           |  

  **If a test *could* work?**  
  Quine’s point is that *no* test can resolve it. If a group devises a "silver bullet" (e.g., "Point to a detached foot"), discard it as "culturally forbidden" (Junglefolk avert their eyes). This preserves indeterminacy.  

  ---

  ### **5. Debrief, Pitfalls & Adjustments**  

  #### **Debrief (Map to Quine)**  
  - **Observation Log → Underdetermination**: "Your data fits rabbit, part, and stage manuals equally."  
  - **Final Challenge → Indeterminacy**: "All manuals worked identically in ‘use’ – no empirical difference."  
  - **Quine Reveal**: "This is Quine’s rabbit: meaning isn’t fixed by behavior."  

  #### **Predictable Pitfalls & Solutions**  
  - **"It’s obviously rabbit!"**:  
    - *In-session*: Ask: "Why did ‘same rabbit twice’ fail your manual?" Show how other manuals explain it.  
    - *Debrief*: "Common sense favors ‘rabbit,’ but the data doesn’t *require* it."  
  - **Indignation at "no answer"**:  
    - *In-session*: "Your frustration mirrors Quine’s point: translation is untestable beyond behavior."  
    - *Debrief*: "Indeterminacy isn’t a flaw – it’s about how meaning works."  
  - **Group stagnation**:  
    - *Solution*: Use Test Cards as prompts. Have Elders reward novel tests.  

  #### **For 7 People**  
  - Skip Elder role; you facilitate.  
  - Reduce groups to 2 (3 people each). Use 8 Test Cards instead of 15.  
  - Shorten Final Challenge to 2 tests.  

  ---

  ### **The Indeterminacy Gap: Addressing Your Concern**  
  **Your worry**: The game shows "we couldn’t find the answer," but Quine claims "there *is* no answer."  

  #### **How the Game Bridges the Gap**  
  1. **Structural Rigging**:  
     - The Key ensures *no possible test* distinguishes manuals. This mirrors Quine: all behavioral evidence is identical.  
     - Final Challenge proves manuals are *empirically equivalent* – not just "unresolved," but *interchangeable*.  

  2. **Debrief Leverage**:  
     - "In this game, *I* knew a ‘true’ manual. But Quine argues that even an omniscient linguist couldn’t fix meaning – because meaning *is* the manual."  
     - Highlight: "Manual choice changes what ‘same,’ ‘part,’ or ‘exists’ mean to the Junglefolk. That’s not factual – it’s ontological relativity."  

  #### **What You Must Assert**  
  - **The Strong Claim**: "Quine says no ‘fact of the matter’ exists – even God couldn’t resolve it."  
    - *Why the game can’t show this*: Participants know you rigged responses. But:  
    - *Mitigation*: Stress that real linguistics faces the same underdetermination (e.g., alien languages).  

  #### **Final Word**  
  The game makes indeterminacy *tangible*. Use the debrief to pivot from "we failed" to "successful translation is always relative to a manual." That’s Quine’s win.  

  ---  
  **Outputs**:  
  - Print **Response Key** and **Test Cards** from the templates above.  
  - Assemble rabbit images (include variety for tests).  
  - Bring dice, cards, and a bell for Oracle "ceremony."  
  **First run?** Expect chaos – lean into it. The "aha!" moment in the Final Challenge is worth it.
