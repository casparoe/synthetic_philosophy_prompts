  **85-90 min: Debrief**
  - Reveal that the exercise is based on Quine's rabbit example in *Word and Object*.
  - Explain that no matter how much data they collected, at least two manuals (rabbit, part, stage) fit equally well.
  - The point: meaning is indeterminate.

  ### Scoring Scheme
  - The group gets 1 point for every correct prediction during the manual testing phase.
  - The scoring is done publicly on the board.
  - At the end, if multiple manuals have the same score, then it's a tie.

  ### Handling the Identity Test
  In the prepared response for the identity test, we have the native say "Dap" (different) for the same rabbit at two times. In the debrief, you explain that:
  - For the "rabbit" manual, this might seem odd, but it can be explained by the native having a different concept of identity (e.g., they might require the rabbit to be in the exact same state).
  - For the other manuals, it fits perfectly.

  ### Predicted Problems and Solutions
  1. **Someone says it's obviously "rabbit"**: In the debrief, point out that the other manuals also fit all the data and that the identity test doesn't fit the rabbit manual without additional assumptions.

  2. **Someone is indignant**: Acknowledge the frustration. Explain that the exercise is designed to illustrate a philosophical point about the nature of meaning and evidence.

  3. **Only 7 people**: Reduce the number of scenarios. Skip the identity test if time is short.

  ### The Gap: There is a Correct Answer?
  In the game, you know the responses because they are predetermined. But you predetermined them to be consistent with all three manuals. So in a sense, there is no single correct manual. The point is that the evidence does not pick one manual over the others.

  You can say: "In this game, I predetermined the responses to be ambiguous. But Quine's point is that in real life, the evidence available to the linguist is similarly ambiguous. There is no fact of the matter about which manual is correct because meaning is not determined by behavior alone."

  ### Materials List
  - Whiteboard or large paper and markers.
  - Index cards for scenarios: On one side, the description of the scene; on the other, the native's response.
  - A set of pictures (optional) to accompany the scenarios.
  - A notebook for the group to record observations.

  ### Example Scenarios and Responses
  Prepare the following cards (or a list if you don't want cards):

  Card 1:
    - Scene: "You are standing in a field. A whole rabbit runs by."
    - Response: "Gavagai"

  Card 2:
    - Scene: "You show a picture of a rabbit with only its ear visible (the rest behind a screen)."
    - Response: "Gavagai"

  Card 3:
    - Scene: "You show a picture of a squirrel."
    - Response: "Blik"

  Card 4:
    - Scene: "You show a picture of a rabbit's foot (attached to a rabbit)."
    - Response: "Gavagai"

  Card 5:
    - Scene: "You show two separate pictures: one of a rabbit at 9:00 AM and one of the same rabbit at 10:00 AM. You point to each picture and ask 'Gavagai?' for each."
    - Response for each: "Gavagai"
    - Then you ask: "Dup?" (meaning: are these the same Gavagai?)
    - Response: "Dap"

  Card 6:
    - Scene: "You show a picture of a rabbit half-hidden behind a tree."
    - Response: "Gavagai"

  Card 7 (new in the testing phase):
    - Scene: "You show a picture of the same rabbit as in card 5 but at 11:00 AM."
    - Response for the picture: "Gavagai"
    - Then if they ask: "Is this the same as the rabbit in card 5 at 9:00 AM?" using their manual, they will use "Dup". But they haven't learned "Dup" yet in the first phase? They will have from card 5.

  In the first phase, when you do card 5, you provide the response for "Dup" as well, so they learn "Dup" and "Dap".

  ### How to Generate the Materials in Under an Hour
  - Write the scenes and responses on index cards.
  - If using pictures, draw simple sketches or print them from the internet in advance.

  ### Final Note
  This activity will not prove Quine's thesis but will simulate the underdetermination. The gap between "we couldn't determine" and "there is no fact of the matter" is bridged in the debrief by philosophical argument. You will have to explain that Quine's claim is stronger: the manual is not determined by all possible evidence, and there is no fact of the matter about which is correct beyond the evidence.

  Good luck!
