prompt: |-
  I cover science and ideas for a general-interest outlet — mostly AI and neuroscience, but I've got a reported piece coming up on how much of government decision-making now runs through vendors, models, and allied agencies, and my editor wants an interactive box to go with it. The working title is something like "would you dirty your hands?" and I want it to actually sort readers rather than let them self-label.

  Can you build me the instrument?

  Here's the shape I'm after. First, lay out the logical space as a handful of independent commitments — the questions on which the positions genuinely come apart, not a list of schools. The dimensions I care about most, given what my piece is about: whether the act stays wrong all-things-considered or is merely unpleasant to perform; whether anything morally sticks to the person afterwards (guilt, apology, a duty to confess or to be punished); whether the dirt attaches to an individual agent at all, or gets smeared across the committee, the contractor, and the model that produced the recommendation; whether whatever permission exists is special to holding office or is just an ordinary feature of moral life that anyone can face; and whether handing the decision to a system or a subcontractor changes the moral situation or only the visibility of it. Feel free to add dimensions if you think I'm missing ones that do real work.

  Then write ten items that locate a reader in that space. Each one is a concrete situation with two or three answer options, phrased the way a person would actually talk, and none of them may name a philosopher, an ism, or a theory — a reader should be able to answer every item without any idea which leaf they're steering toward. I want the cases to be contemporary and distributed, not the seminar classics: an eligibility model that denies thousands of appeals and no human ever reviews a file; a strike list built from a signals vendor's output; getting a private contractor to do the thing your own agency is barred by statute from doing; asking an allied service to hold and question someone for you; taking money from a genuinely bad actor to fund a campaign that keeps a worse government out; a triage protocol written before the surge so nobody has to make the call at the bedside; sitting on a true report because publishing it would cause a panic; and prosecuting the person who leaked the program. One near-ticking-bomb case is fine for calibration, but don't build the thing around it, and skip Coventry entirely — the Churchill story doesn't survive the history anyway.

  Then the key. Map answer patterns onto leaves, each with a name if it has one and "unnamed" if nobody really defends it. I want at minimum: the paradox view where the leader is both justified and genuinely guilty; the straight consequentialist dissolution where there's no dirt, just squeamishness; the threshold/supreme-emergency reading that switches rules only past a certain stakes level; the reason-of-state view with no moral remainder at all; the view that this is just ordinary moral tragedy and nothing special about politics; the democratic authorization view where the voters own the act; a view on which the wrongdoing is real but no individual is left holding it once it's been run through many hands and a machine; and the eliminativist who thinks the whole problem is a confusion. For each leaf give one sentence on its most awkward commitment and one quiz item where it has to bite a bullet.

  Two more things, because this is where these interactives usually cheat. Flag every pair of leaves your ten items can't actually seperate, and say what an eleventh question would have to ask to pull them apart. And point out the combinations in the space that come up empty — I'm especially curious whether anyone holds "the act was wrong, nothing sticks to the agent, and responsibility dissolved into the system" — and for each empty cell tell me whether it's vacant because the view is incoherent, because it's unattractive, or just because nobody's got round to it.

  No bibliography and no quotes, please — my fact-checker handles names separately and I don't want to hand her a list to chase. Keep each item short enough to fit on a card in the interactive, and assume a smart reader who has never opened a political theory book.
reasoning: |-
  Okay, the user is a science and ideas journalist working on a piece about government decision-making through vendors, models, and agencies. They need an interactive quiz to sort readers into different ethical positions without using philosophical jargon. Let me break down their requirements.

  First, they want the logical space defined by key dimensions: whether an act remains wrong despite necessity, if moral residue sticks to the person, if responsibility is diffused, whether permission is unique to officeholders, and if outsourcing changes morality. I should check if any dimensions are missing. Maybe adding one about institutional vs. individual responsibility could help.

  Next, they need ten contemporary scenarios. The user provided examples like eligibility models denying appeals without review, strike lists from vendors, using contractors to bypass statutes, etc. Each scenario needs clear, concise options avoiding any theory names. I need to ensure diversity in the cases—covering tech, outsourcing, leaks, funding dilemmas. Avoid classic examples like Coventry or over-reliance on ticking bombs.

  For the key, mapping answer patterns to philosophical positions is crucial. They listed views like paradox, consequentialist, threshold, reason-of-state, etc. Each leaf needs a brief on its awkward commitment and a bullet-biting example. I must identify which pairs the quiz can't separate and suggest an eleventh question. Also, highlight vacant combinations in the logical space, like "act wrong, no residue, responsibility diffused"—is it incoherent or just unclaimed?

  The user emphasized real-world relevance and avoiding academic references. Quiz items must be short, conversational. They also want to expose where existing theories might have gaps. I should ensure the instrument is intuitive for readers without philosophy background but still robust enough to categorize nuanced stances.

  Potential pitfalls: overlapping dimensions making some questions redundant, scenarios too similar, or failing to distinguish key views. Testing answer patterns against each leaf to ensure separation. For example, distinguishing threshold from consequentialist might hinge on whether stakes change the moral nature. An eleventh question could probe if dirty hands are ever cleansed through confession, separating paradox from democratic views.

  Empty cells: The combination where the act is wrong, no individual blame, and responsibility dissolves into the system—likely unattractive because it avoids accountability. Or "special permission only for officials" without residue—maybe incoherent if permission negates wrongdoing. Need to check each cell's plausibility.

  Finally, ensuring clarity and engagement. Each quiz item should force a choice that reveals underlying principles. Balancing brevity with depth so readers feel accurately sorted without frustration. The key must transparently show limitations, building credibility by admitting what the quiz can't differentiate.
answer: |-
  Here’s the interactive instrument designed for your purposes. It isolates key dimensions, uses contemporary non-academic scenarios, and maps cleanly to distinct positions while flagging limitations.

  ---

  ### **The Dirty Hands Quiz: Where Do You Stand?**

  **Instructions:** For each situation, pick the **one statement** closest to your gut reaction. Don’t overthink it. There are no right answers, just honest ones.

  1.  **The Algorithmic Gatekeeper:** A state welfare agency uses an AI model to instantly deny 98% of benefit appeals. No human ever sees the files. *You learn the model has serious flaws denying thousands of legitimately desperate people.*
      *   A) *This is horrifying. Whoever signed off owns this, even if they never saw the files.*
      *   B) *The system saved resources overall, but someone high up needs to publicly fix it and apologize.*
      *   C) *It’s a bad outcome, but the blame sits with the team who built/picked the flawed model, not the director.*

  2.  **Outsourced Interrogation:** Your agency is legally barred from "enhanced interrogation." A trusted allied service isn’t. You pass them a high-value detainee suspecting they’ll use those methods. *They get critical, time-sensitive intel.*
      *   A) *We crossed a line. We’re responsible for what they did on our behalf.*
      *   B) *It got vital results. The law blocked us, but the greater need justified using the ally.*
      *   C) *The ally chose their methods. We provided information; the moral act is theirs.*

  3.  **The Leaker’s Fate:** A whistleblower leaks proof of an illegal mass surveillance program protecting national security. Public outrage forces it to shut down. *Prosecutors charge the leaker.*
      *   A) *Prosecuting them is wrong; they exposed wrongdoing.*
      *   B) *They broke the law and harmed security. Prosecution is necessary.*
      *   C) *The real problem is the illegal program. Punishing the leaker feels like scapegoating.*

  4.  **Tainted Funding:** To prevent a truly dangerous faction from winning, your campaign takes major donations from a corrupt but powerful oligarch. *You win and block the worse threat.*
      *   A) *Taking that money corrupted us. The win feels hollow.*
      *   B) *Stopping the bigger evil was essential. The ends justified the unsavory means.*
      *   C) *Politics is rough. We used the tools available to win a crucial fight, no apologies needed.*

  5.  **Pre-Programmed Triage:** A hospital network, anticipating ventilator shortages, adopts a strict algorithm prioritizing survival odds during a future surge. *When the surge hits, doctors follow it, denying vents to some who plead.*
      *   A) *The algorithm shields doctors, but the moral weight of denying care remains.*
      *   B) *It was the least worst option planned calmly. Following it is responsible, not dirty.*
      *   C) *The blame lies with whoever designed/approved the cold algorithm, not the doctors.*

  6.  **The Vendor’s Target List:** Military planners use a private company's AI to analyze signals intel and generate a "high-confidence" strike list against insurgent leaders. *A strike based solely on this list kills civilians.*
      *   A) *The commanders ordering the strike bear the responsibility, vendor or not.*
      *   B) *Using the best available intel was correct. Tragic, but not wrongful.*
      *   C) *Fault is diffused: the vendor's model, the intel sources, the approval chain – no single person "owns" it.*

  7.  **Suppressing Panic:** Your agency confirms a non-lethal but scary industrial contaminant is in the water supply. Fixing it takes weeks. *You delay the announcement to avoid riots, knowing people will ingest it.*
      *   A) *Hiding the truth was wrong, even to prevent panic. People had a right to know.*
      *   B) *Preventing chaos and ensuring an orderly fix made the delay necessary.*
      *   C) *This is just crisis management. Leaders make tough calls about timing bad news.*

  8.  **Bypassing the Ban:** A law forbids your environmental agency from using aerial pesticides. You hire a private contractor to apply the *exact same* pesticides over a critical infestation. *It saves vital crops.*
      *   A) *This was a deliberate end-run around the law. It’s illegitimate.*
      *   B) *The law was an obstacle to solving a real emergency. Circumventing it was justified.*
      *   C) *The contractor did the spraying. We hired them legally for a needed job. No issue.*

  9.  **The Necessary Lie (Ticking Bomb Lite):** You have credible intel a bomb is hidden in a crowded area, but no specifics. The only suspect won’t talk. *You authorize threatening to harm their family if they don’t talk (knowing you won't actually do it). They break and reveal the location.*
      *   A) *The threat was deeply wrong, even as a bluff. Saving lives doesn't wash that away.*
      *   B) *Saving hundreds absolutely justified the deception. No moral stain remains.*
      *   C) *It was a nasty trick, but necessary in the moment. The leader did their grim job.*

  10. **The Committee’s Call:** A multi-agency panel votes to approve a risky covert action with high potential for blowback. You voted "yes." *It goes badly, causing significant unintended harm.*
      *   A) *I share responsibility for that harm. I voted for it.*
      *   B) *It was the best decision based on the info. Bad outcomes don't make it wrong.*
      *   C) *The decision belongs to the committee as a whole. Individual blame is misplaced.*

  ---

  ### **The Key: What Your Answers Reveal**

  Your pattern locates you within a logical space defined by:
  1.  **Permanent Wrong?** Does the act remain morally wrong *all-things-considered*, or is the "dirt" just unpleasantness?
  2.  **Moral Residue?** Does guilt, a need for apology, confession, or punishment stick to the *individual agent*?
  3.  **Responsibility Diffused?** Does blame spread/smear across systems, committees, vendors, models?
  4.  **Special Permission?** Is acting this way only permissible *because* of holding office?
  5.  **Outsourcing Changes Morality?** Does using a vendor/model/ally fundamentally alter the moral situation (beyond visibility)?

  **Your Result (Leaves):**

  *   **Mostly A's: The Paradox of Dirty Hands**
      *   *View:* Leaders *must* sometimes commit gravely wrong acts for the greater good. The act remains objectively wrong, and the leader bears genuine guilt/residue. Justification doesn't cleanse. Special to political office.
      *   *Awkward Commitment:* A genuinely good leader must sometimes become morally guilty.
      *   *Bites Bullet On:* #9 (The Necessary Lie) - The threat was morally abhorrent *and* necessary, leaving guilt even though it worked and saved lives. Prosecuting the leaker (#3) might be legally required but feels morally problematic.
  *   **Mostly B's: Clean Consequentialism**
      *   *View:* If an act was the best available option to maximize overall good (or minimize harm) given the circumstances, it was the *right* thing to do. No "dirt" remains – just regret about the situation. Not special to office.
      *   *Awkward Commitment:* No act is intrinsically dirty if consequences justify it. "Wrongness" dissolves.
      *   *Bites Bullet On:* #2 (Outsourced Interrogation) - Getting the vital intel justifies the end-run around the law and the ally's methods. No apology needed. #4 (Tainted Funding) is simply smart strategy.
  *   **Mix of A/B, especially B on High-Stakes: Threshold Deontology**
      *   *View:* Normal moral rules apply strictly... until stakes exceed a catastrophic threshold (supreme emergency). Only *then* can rules be broken, and the act may still carry residue. Permission tied to office/responsibility.
      *   *Awkward Commitment:* Defining the precise, non-arbitrary threshold where rules dissolve.
      *   *Bites Bullet On:* #7 (Suppressing Panic) - If the potential panic was deemed catastrophic, delay might be justified. If not, it was wrong. #9 (Necessary Lie) likely crosses the threshold; #8 (Bypassing the Ban) probably doesn't unless crops = famine.
  *   **Mostly B/C, especially C on Diffusion: Systemic Diffusion**
      *   *View:* Complex systems (vendors, algorithms, committees, chains of command) fundamentally diffuse or dissolve individual moral responsibility. Wrongdoing might be real ("the act was wrong"), but no *individual* bears the guilt/residue. Blame lies with the structure.
      *   *Awkward Commitment:* Individuals in powerful positions can avoid blame for outcomes they set in motion.
      *   *Bites Bullet On:* #1 (Algorithmic Gatekeeper) & #6 (Vendor's Target List) - Serious harm occurred, but the CEO/General isn't personally culpable; the flawed *system* is to blame. #10 (Committee's Call) - Responsibility is collective, not individual.
  *   **Mostly C's: Realpolitik / Reason of State (Unnamed?)**
      *   *View:* Governing requires actions unacceptable in private life. These acts aren't morally "dirty"; they are necessary tools of statecraft. No moral residue. No special guilt. Outsourcing is just another tool. The rules *are* different for leaders.
      *   *Awkward Commitment:* Politics exists largely outside ordinary morality; effectiveness is the primary virtue.
      *   *Bites Bullet On:* #2 (Outsourced Interrogation) & #8 (Bypassing the Ban) - Clever solutions to legal obstacles, standard practice, no need for apology. #3 (Leaker's Fate) - Prosecution is essential to maintain state secrecy/authority.
  *   **Strong Mix, Especially A on Wrongness/C on Residue: Democratic Authorization**
      *   *View:* Authorization by the people (via election, mandate, or implicit consent) transfers responsibility. The act might be "dirty" in the abstract, but the *official* is cleansed by acting under mandate. Residue falls on the authorizing body (voters). Special to office.
      *   *Awkward Commitment:* Voters bear moral responsibility for acts they didn't directly choose/know about.
      *   *Bites Bullet On:* #4 (Tainted Funding) - Winning the election justifies the means used. #7 (Suppressing Panic) - The leader acted to preserve order on the public's behalf, no personal guilt. Prosecuting the leaker (#3) defends democratic secrets.
  *   **Inconsistent A/B/C, Focus on Ordinary Tragedy: Moral Tragedian**
      *   *View:* There's nothing uniquely "dirty" about politics. Leaders face tragic choices where all options involve significant wrongs or harms, just like anyone caught in extreme circumstances (e.g., Sophie's Choice). Residue might exist, but it's not *special* to office. Outsourcing changes little morally.
      *   *Awkward Commitment:* The intense scrutiny and power of office don't create a distinct moral category.
      *   *Bites Bullet On:* #5 (Pre-Programmed Triage) & #9 (Necessary Lie) - These are horrific choices anyone in that position might face, not uniquely "political dirty hands."
  *   **Mostly B/C, Rejects "Dirt" Language: Moral Eliminativism (Unnamed)**
      *   *View:* The whole "dirty hands" framing is confused. We're just describing tough choices with trade-offs under uncertainty. Talk of "guilt," "stain," or "special permission" is unhelpful moralizing. Focus on outcomes and process improvement.
      *   *Awkward Commitment:* Dismisses the deep moral intuition that some necessary acts *feel* intrinsically wrong and guilt-inducing.
      *   *Bites Bullet On:* *All* scenarios - The language of "dirt," "guilt," or "stain" is rejected as inaccurate. Analyze decisions for better processes (#1, #6) or better intel (#9), not moral residue.

  ---

  ### **Limitations & Vacant Spaces**

  1.  **Indistinguishable Pairs (Requires 11th Question):**
      *   **Paradox vs. Threshold Deontology:** Both often choose A/B similarly, especially on high-stakes items (#2, #9). The Paradox view *always* sees residue, Threshold only *sometimes*. **11th Question:** *After a leader makes a necessary but awful choice, is publicly expressing personal guilt/apology (even if they'd do it again) important, or does it undermine necessary action?* (Important: Paradox; Undermines: Threshold).
      *   **Clean Consequentialism vs. Realpolitik:** Both choose B frequently. Consequentialism sees morality *in* the outcome; Realpolitik often sees state action *beyond* conventional morality. **11th Question:** *Is there any act so intrinsically vile (e.g., torturing an innocent child for no gain) that it could never be justified for any state advantage?* (Yes: Clean Consequentialism - consequences could *never* justify this; No: Realpolitik - if the state truly needed it, it could be done).
      *   **Systemic Diffusion vs. Moral Eliminativism:** Both lean towards C. Diffusion believes in systemic *wrongdoing* without individual blame; Eliminativism rejects the "wrongdoing" framing entirely. **11th Question:** *When a complex system causes massive harm (like the flawed algorithm in #1), is it still meaningful to say the *outcome* was morally "wrong," or is that just an emotional label for a bad event?* (Outcome was wrong: Diffusion; Just a bad event: Eliminativism).

  2.  **Vacant Cells in the Logical Space:**
      *   **"Act Was Wrong, Nothing Sticks to Agent, Responsibility Dissolved into System" (Perm Wrong: Yes, Residue: No, Diffused: Yes):** This is a core tenet of **Systemic Diffusion**. *Occupied.*
      *   **"Act Was NOT Wrong (Justified), But Residue/Guilt Sticks" (Perm Wrong: No, Residue: Yes):** *Vacant.* Likely **incoherent**. If an act is truly justified all-things-considered, why would guilt/residue be appropriate? This contradicts the core meaning of "justified."
      *   **"Special Permission Exists, Outsourcing CHANGES Morality (reduces dirt), Residue Sticks" (Special: Yes, Outsourcing Changes: Yes, Residue: Yes):** *Vacant.* **Unattractive/Unclaimed.** Why would permission exist only to be undermined by a common tool (outsourcing)? If residue sticks, outsourcing didn't cleanse the act. No major theory argues outsourcing *increases* the agent's burden while reducing the act's wrongness.
      *   **"No Special Permission, Outsourcing CHANGES Morality (eliminates dirt), Residue Doesn't Stick" (Special: No, Outsourcing Changes: Yes, Residue: No):** *Vacant.* **Unattractive/Unclaimed.** If there's no special permission, why would outsourcing (a mere logistical change) magically eliminate moral responsibility that *would* exist if the official did it directly? This seems like an unjustified loophole.
      *   **"Act Was Wrong, Residue Sticks, Responsibility Diffused" (Perm Wrong: Yes, Residue: Yes, Diffused: Yes):** *Vacant.* **Incoherent.** If responsibility is truly diffused and dissolved, how can residue meaningfully "stick" to an individual agent? These commitments pull against each other.

  ---

  This instrument forces choices on contemporary, system-focused dilemmas, mapping cleanly to distinct positions while transparently showing its boundaries and the unexplored corners of the "dirty hands" landscape.
