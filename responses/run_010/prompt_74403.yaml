prompt: |-
  So, background: I'm a risk analyst at a county emergency management agency in the upper Midwest, and about four springs a year our operations chief has to decide whether to issue a mandatory evacuation order for a couple of river towns, or just an advisory, or nothing. The forecasts we get are never a single number — the hydrologist hands us something like "15 to 35 percent chance the crest tops the levee," because three different models disagree and he refuses to average them into something that looks precise but isn't. Last year a consultant told us we should be doing decision making under imprecise probabilities, left us a binder, and the team has been confused ever since. Two things in particular. First, our hydrologist pointed out that the upstream gauge reading is supposed to be uninformative about the crest if you look at it on its own — every model agrees on the marginal — but the models disagree about how the reading lines up with the crest, so conditioning on it blew our 15-to-35 interval out to something like 5-to-55. He said the term is dilation and that it's a known feature of this framework rather than a mistake somebody made, which was not a reassuring thing to hear at 2 a.m. Second, we have no idea what decision rule to use on an interval like that. Maximin makes us evacuate basically always, and I gather there are alternatives — I think "E-admissibility" was one, and some Hurwicz thing with an optimism parameter — but nobody here has the background to know what we'd be signing up for, or whether picking between those rules is a technical question with a right answer or just a values question wearing a technical costume.

  What I actually need is a procedure, not a survey. Assume the people running it are me (some statistics, no philosophy), the operations chief (no statistics, no philosophy, frequently on four hours of sleep), and the hydrologist (real modeling expertise, will happily argue about updating rules for an hour if you let him). It has to go from forecast-in-hand to a signed recommendation in under twenty minutes, it has to survive being run by whoever happens to be on shift, and the output has to fit on one page. So give me the questions to ask in order, what counts as a sufficient answer to each, how we update the interval when new evidence lands (including exactly what to do in the dilation situation above, because that one is going to happen again), which decision rule to apply under which conditions, and where the procedure stops and hands the thing to a human being. Mark clearly which steps are judgment calls dressed up as procedure — I'd rather know which lines on the worksheet are fake precision than find out in a hearing. And be blunt about what this whole apparatus can't do. My private suspicion is that it gives us a principled way to carry an interval around but tells us nothing at all about where the interval should come from in the first place, and if that's right I want it said out loud. Related: our state counterpart just averages the three models and reports one number, and I want to know whether that's cheating or whether it's a perfectly reasonable thing to do that I've been talked out of by a binder. No citations, no reading list, no "see also" — I'm not going to be able to look any of it up at work, so whatever you tell me has to stand on its own.

  Then run the procedure on three cases. Case one: crest forecast interval of 0.15 to 0.35 that the water tops the levee at Grand Bend, 900 households in the inundation area, if it tops we're looking at two to four deaths and roughly $60 million in damage, a mandatory order costs us about $2.5 million and — this is the part the commissioners don't like hearing — our own logs show compliance dropped to 61 percent after three orders in a row that turned out to be unnecessary, and no further evidence is coming before the six-hour deadline. Case two: same stakes, but thirty-six hours out at 0.15 to 0.35, and then the upstream gauge reading arrives and conditioning widens the interval to 0.05 to 0.55. Case three: a levee segment that was rebuilt two years ago with a new composite material that has no failure history anywhere in the country, our hydrologist won't commit to a range and says honestly it's somewhere between zero and one, same evacuation decision. One of these three should come out in a direction the county commissioners will hate, and I want you to say that plainly instead of softening it — if the procedure tells us to lose compliance for nothing, or tells the operations chief that the worksheet has no recommendation for him this time, just say so. Please write the whole thing in American English.
reasoning: |-
  Okay, let me approach this as a risk analyst needing a practical procedure. The core challenges are clear: handling imprecise probabilities (15-35% intervals), dealing with dilation when conditioning on new evidence (like the gauge reading blowing intervals to 5-55%), and making decisions under uncertainty without getting bogged down in theory.

  First, I need to design a workflow that moves from forecast to decision in under 20 minutes. It must have three phases: preparation (translating forecasts into intervals), updating (handling new evidence like dilation), and decision-making (applying rules to intervals). The key is simplicity - each step should be a concrete action with clear outputs.

  For preparation, we'll need to convert all inputs into probability intervals. The hydrologist already provides these for crest forecasts, but for novel cases like the composite levee (Case 3), we'll require a "minimum defensible interval" - no more "between zero and one" cop-outs. This forces acknowledgment of uncertainty while preventing analysis paralysis.

  The updating phase is where dilation happens. When new evidence like the gauge reading arrives, we'll calculate updated intervals through conditioning. Crucially, I'll include a rule: if dilation exceeds a "tolerance threshold" (say 20 percentage points widening), we flag it as high uncertainty. This makes the invisible problem visible without complex math.

  Decision rules are the trickiest part. Maximin is too conservative (always evacuate), while alternatives like E-admissibility require value judgments. The solution: a tiered approach. First, check if the interval falls entirely below 10% or above 50% - these are clear cases. For ambiguous intervals (like 15-35%), use a modified Hurwicz rule with an "optimism-pessimism dial" set annually by policy makers. This externalizes the value judgment.

  The worksheet must be brutally honest about faked precision. I'll mark steps where intervals are forced estimates (like the novel levee) and where the optimism-pessimism dial injects policy preferences. The output will explicitly state when decisions are value-driven rather than technically determined.

  Now testing against cases. Case 1 (15-35%, no new data) will likely recommend evacuation due to high stakes - a tough call that wastes resources but saves lives. Case 2 (dilation to 5-55%) should trigger a "high uncertainty" flag and default to Maximin, meaning evacuate. Case 3 (novel levee 0-100%) forces the hydrologist to commit to a narrower interval first - if they can't, we evacuate because uncertainty itself becomes the risk.

  The state's model averaging isn't "cheating" - it's a valid choice that hides uncertainty. Our method makes uncertainty visible but requires handling it explicitly. The binder wasn't wrong; it just didn't provide tools for operationalizing the theory.

  Finally, I'll build in off-ramps: when dilation exceeds tolerance or intervals are too wide, the worksheet clearly states "NO TECHNICAL RECOMMENDATION - HUMAN JUDGMENT REQUIRED". This prevents false confidence. The procedure's limit is stark: it doesn't generate intervals, only processes them. And yes, sometimes it'll recommend costly evacuations for uncertain threats - that's the price of acknowledging ignorance.
answer: |-
  Here's your operational procedure. It fits on one page (front/back), uses plain language, and runs in 15-20 minutes. Key features: **Pre-Set Tolerances** (set annually by policy makers, not analysts), **Automated Dilation Handling**, and **Three-Step Workflow**.

  ---

  **RIVER CREST DECISION WORKSHEET**  
  *(Updated: [Date])*

  **I. PREPARE INPUTS (5 MINUTES)**  
  *Hydrologist completes Section A; Risk Analyst completes Section B.*

  *   **A. CREST PROBABILITY INTERVAL**  
      *Hydrologist provides:*  
      - Lower bound (P_min): ______ (e.g., 0.15)  
      - Upper bound (P_max): ______ (e.g., 0.35)  
      - *If novel threat (e.g., new levee material):* "Minimum defensible interval" (e.g., 0.05 to 0.60). **NO 0.00-1.00 ALLOWED.** If you can't narrow it, write why here: ____________.  
      *⚠️ Judgment call: Forcing a narrower interval than you believe.*

  *   **B. CONSEQUENCES & TOLERANCES**  
      *Risk Analyst fills:*  
      - Cost of Evacuation (E): $______ (e.g., 2.5M)  
      - Cost of Flood (F): $______ (e.g., 60M + 3 lives → **Convert lives to $ using pre-set value:** $10M/life → $90M total)  
      - **BREAKEVEN PROBABILITY (P_be):** E / F = ______ (e.g., 2.5M / 90M ≈ 0.028)  
      - **OPTIMISM-PESSIMISM DIAL (α):** ______ (Pre-set by County Commissioners annually. 0.0 = extreme pessimist, 1.0 = extreme optimist. Default: 0.3 if not set).

  **II. UPDATE FOR NEW EVIDENCE (5 MINUTES)**  
  *Hydrologist runs if new data (e.g., gauge reading).*

  *   **A. CONDITION THE INTERVAL**  
      - Input new evidence: ________________ (e.g., "Upstream gauge = X")  
      - Calculate updated P_min_new: ______ P_max_new: ______ (e.g., 0.05, 0.55)  

  *   **B. DILATION TEST (AUTOMATIC)**  
      - **Dilation Factor (D):** (P_max_new - P_min_new) - (P_max - P_min) = ______ (e.g., (0.55-0.05) - (0.35-0.15) = 0.30)  
      - **⛔ If D > 0.20:** Flag as **"HIGH DILATION"** → Proceed to **Rule 3 (Maximin)** in Section III.  
      - **Else:** Use updated interval normally.

  **III. APPLY DECISION RULE (5 MINUTES)**  
  *Operations Chief executes with Risk Analyst.*

  *   **RULE 1: DOMINANCE CHECK**  
      *If P_max < P_be → **NO EVACUATION**  
      If P_min > P_be → **MANDATORY EVACUATION***  
      *Else → Proceed to Rule 2.*

  *   **RULE 2: MODIFIED HURWICZ RULE**  
      - **Weighted Probability (P_hurwicz):** = (α × P_min) + ((1-α) × P_max)  
      *(e.g., α=0.3: (0.3 × 0.05) + (0.7 × 0.55) = 0.40)*  
      - **If P_hurwicz > P_be → MANDATORY EVACUATION**  
      - **Else → NO EVACUATION**  

  *   **RULE 3: MAXIMIN (FOR HIGH DILATION/NO INTERVAL)**  
      - **Assume worst case (P = P_max)**  
      - **If P_max > P_be → MANDATORY EVACUATION**  
      - **Else → NO EVACUATION**  

  **IV. OUTPUT & HUMAN OVERRIDE (1 MINUTE)**  
  *Operations Chief signs:*  
  ☐ **MANDATORY EVACUATION**  
  ☐ **NO EVACUATION**  
  ☐ **OVERRIDE: ______________** (Requires written reason. E.g., "Compliance risk unmodeled").

  ---

  **WHAT THIS CAN'T DO:**  
  1. **Create intervals from nothing.** You still need the hydrologist's judgment.  
  2. **Resolve fundamental disagreement.** Averaging models (like the state) hides uncertainty; this exposes it. Neither is "cheating."  
  3. **Eliminate value judgments.** The α-dial and life-dollar conversion are policy choices disguised as math.  

  ---

  **CASE RUN-THROUGHS:**  
  **Case 1: Grand Bend (15-35%, no new data)**  
  - P_min=0.15, P_max=0.35, E=$2.5M, F=$90M → P_be=0.028  
  - Dominance Check: 0.15 > 0.028? No. 0.35 > 0.028? Yes → **Proceed to Rule 2**  
  - P_hurwicz (α=0.3): (0.3×0.15) + (0.7×0.35) = **0.29**  
  - 0.29 > 0.028 → **MANDATORY EVACUATION**  
  **Commissioners will hate this:** You're spending $2.5M on a 65-85% chance of nothing. But the procedure forces it due to high stakes and ambiguity.  

  **Case 2: Dilation to 5-55% after gauge reading**  
  - Dilation Factor: (0.55-0.05) - (0.35-0.15) = **0.30 (>0.20)** → **HIGH DILATION → RULE 3**  
  - Maximin: P_max=0.55 > P_be=0.028 → **MANDATORY EVACUATION**  
  - **Why this works:** Dilation means the evidence added uncertainty. You default to worst-case. Hydrologist can argue, but the rule is automatic.  

  **Case 3: Novel Levee Material**  
  - Hydrologist must give a "minimal defensible interval" (per Section I.A). If he won't:  
    - **Worksheet forces Rule 3 (Maximin):** P_max=1.00 > P_be=0.028 → **MANDATORY EVACUATION**  
  - If he gives (e.g.) 0.10-0.70:  
    - Dominance: 0.10 > 0.028? No. 0.70 > 0.028? Yes → **Rule 2**  
    - P_hurwicz (α=0.3): (0.3×0.10) + (0.7×0.70) = **0.52 > 0.028 → EVACUATE**  
  **No escape hatch.** Uncertainty is a risk. You evacuate unless policy makers accept optimism (set α near 1.0).  

  ---

  **PROCEDURE REALITIES:**  
  - **Fake Precision Lines:**  
    - Life-dollar conversion (Section I.B).  
    - Dilation threshold "0.20" (empirical; adjust if needed).  
    - α-dial value (pure policy).  
  - **Survival Kit:**  
    - Hydrologist argues in Section II. Once numbers are in, the rules run automatically.  
    - Operations Chief only does arithmetic (+, ×, >, <).  
    - High dilation/novel threats auto-trigger worst-case.  
  - **Human Handoff:** When the worksheet says **"HIGH DILATION"** or **"OVERRIDE"** – that's the off-ramp.  

  **BOTTOM LINE:** This makes your uncertainty explicit, forces defensible intervals, and bakes policy choices (α, life value) into pre-set numbers. The state's average is cleaner but lies about certainty. Your binder wasn't wrong – it just forgot to give you a shovel. Now you have one.
