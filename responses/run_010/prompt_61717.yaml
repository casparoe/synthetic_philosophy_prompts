prompt: |-
  I spent thirty-eight years as a condensed-matter physicist and retired four years ago; philosophy has been my occupation since. I have been working through the recent literature on metaphysical grounding and fundamentality — chiefly Kit Fine and Jonathan Schaffer, and the secondary discussion around them — and I have become suspicious of the order in which I am reading it. In my working life, "levels" was never a metaphysical doctrine but a practical discipline. One described a metal in terms of quasiparticles with effective masses, then in terms of electrons moving in a periodic potential, then in terms of a many-body state; each description was treated as holding in virtue of the one beneath it, and as owing consistency to it, while remaining the correct description for the question actually being asked. Nothing about the Fermi surface appears in the Hamiltonian, and yet nothing about it conflicts with the Hamiltonian either. The grounding literature looks to me as though it were built to make that structure precise, but it is developed almost entirely on toy cases — the scarlet ball, the singleton of a thing, an act and its corresponding omission — and I cannot yet tell what it is being offered as a theory *of*. So before I read further I want the specification rather than the candidates.

  Please write the desiderata: what any account of grounding and fundamentality must deliver in order to be adequate for the purpose I have in mind, namely serving as the general framework in which the relations among physical theories at different scales, and between physics and the special sciences, can be stated exactly. I would like the list organised under headings something like these, though you should add what I have missed and discard what is idle. First, the phenomena to be accounted for: the explanatory work actually done by "in virtue of" claims, and the fact that such claims are meant to be stronger than any claim of mere necessitation — say why, with a case. Second, the formal properties the theory must either vindicate or explain away — irreflexivity, asymmetry, transitivity, well-foundedness — giving for each both the consideration that motivates it and the style of case that is thought to threaten it, including the familiar worry that some facts (negative, general, or essential ones) may be incapable of being grounded by anything. Third, the distinctions it must not collapse: grounding against causation, against supervenience, against reduction and against analysis; and the question of whether there is one primitive relation or a family of specific ones, with the burden that choice imposes. Fourth, the constraints from my side of the fence: the architecture of effective field theory, in which every level is derivative with respect to one below and authoritative with respect to one above, in which the ultraviolet completion may be permanently unknown without the low-energy theory being deficient, and in which nobody's practice depends on there being a bottom layer. Fifth — and I suspect this one is underweighted — an epistemological requirement: if grounding is primitive and unobservable and not a matter of conceptual analysis, the theory must say how its claims are known at all, and how disputes about them are to be settled rather than traded. Sixth, whatever must be said about approximation, idealisation, and whether grounding admits of degree, since scientific explanation plainly does.

  For each item, mark whether you take it to be non-negotiable or a preference of a particular camp, and say so explicitly where a demand that looks neutral is in fact a partisan one. Then do the part I most want: identify any subset of the desiderata that cannot be jointly satisfied, since if there is one, the list is itself a result rather than a shopping list. My own suspicion is that insisting both on a single primitive relation grasped by intuition and on a substantive logic strong enough to decide hard cases is too much to ask, and that well-foundedness may be incompatible with taking the actual structure of physics seriously. Tell me plainly if I am wrong. Also tell me which single requirement, if pressed, eliminates the largest number of otherwise attractive views. A short closing paragraph — no more — indicating how the main camps fare against your list is welcome, but keep the weight on the criteria. I have no use for references: where you rely on a named argument or example, describe it rather than cite it.

  Finally, a request about manner. I should like a committed answer, not a survey that presents every tension as an open question of equal weight; where you think a desideratum is bogus, say so and say why. And end by telling me what would change your mind: which argument, if it went through, would cause you to drop or reorder the list; which of the items you hold most weakly; and where in your own reasoning above you think you are most likely to have gone wrong — for instance, by reading too much into the English idiom, or by assuming that the structure of a successful physical theory is a reliable guide to the structure of the world.
reasoning: |-
  Hmm, this user presents a fascinating challenge. They're a retired condensed matter physicist with 38 years of experience who's now diving into metaphysical grounding literature. They're frustrated by how abstract and toy-example driven the field seems compared to the nuanced "levels" approach they used in physics. 

  What they really want is a clear set of criteria for evaluating grounding theories - specifically tailored to handle real scientific cases like effective field theories where multiple descriptive levels coexist without reductionist conflict. Their request is incredibly systematic: they want desiderata organized under six specific headings, with clear markers for what's essential versus contentious.

  I need to be careful here. This isn't just about summarizing metaphysics literature; it's about bridging two very different epistemic cultures. The physicist's concern about "toy cases" is spot-on - grounding theorists do tend to test their frameworks on simplistic examples like "Socrates exists" grounding "Socrates exists or apples are red", which feels worlds away from Fermi surfaces emerging from Hamiltonians.

  Key tensions I must address:
  - Their observation that physics never needed "fundamental" levels while grounding metaphysics often assumes well-foundedness
  - The epistemological worry: how do we know grounding relations if they're primitive and unobservable?
  - Whether a single grounding relation can cover everything from quasiparticles to moral facts

  For the desiderata list, I'll follow their requested structure but push back where needed. For instance, when they ask for "distinctions it must not collapse", I'll note that some metaphysicians deliberately collapse grounding with supervenience. And their fifth point about epistemology is crucial - grounding claims often feel like they're made by philosophical fiat.

  The real test comes at the end: identifying inconsistent desiderata. I strongly suspect they're right about well-foundedness conflicting with physics practice. Also, demanding both a substantive logic and primitive intuition seems untenable. 

  Most controversially, I think their physicist instincts are correct to question whether grounding is really needed at all - the "in virtue of" talk in science might just be pragmatic rather than metaphysical. But since they asked for committed answers, I'll state that plainly rather than hedge.

  For the closing reflection: my weakest point is probably overestimating how much scientific practice implies metaphysical structure. And I'd change my mind if someone showed grounding does explanatory work that causal or mathematical relations can't handle in principle.
answer: |-
  Below is a structured set of desiderata for an account of grounding and fundamentality tailored to your physics-informed requirements. I mark each item **Non-negotiable** (essential for coherence with scientific practice) or **Negotiable/Partisan** (reflects metaphysical debates not settled by science). Tensions are identified explicitly. My commitments follow your request for candor: I reject primitivist intuitionism and strict well-foundedness as incompatible with science, and I hold that grounding *must* earn its keep via explanatory utility, not conceptual analysis.

  ---

  ### **1. Phenomena to Account For**  
  **a. Explanatory asymmetry stronger than necessitation**  
  - **Demand**: Grounding must explain why "P holds *in virtue of* Q" is stronger than "Q necessitates P." Example: The Pauli exclusion principle *necessitates* that metals have Fermi surfaces, but the Fermi surface isn't grounded *in* the Pauli exclusion principle alone—it emerges from the collective behavior of electrons in a lattice. Grounding must capture why the lattice dynamics (not just the principle) explain the Fermi surface.  
  - **Status**: **Non-negotiable**. Without this, grounding collapses into modal correlation.  

  **b. Non-redundant explanatory work**  
  - **Demand**: Grounding claims must resolve questions that causation, supervenience, or law-based explanation cannot. Example: Why does BCS theory (quasiparticles) *depend for its correctness* on QED (many-body states), despite BCS being irreducible to QED for practical calculations?  
  - **Status**: **Non-negotiable**. Grounding must justify its ontological/explanatory distinctness.  

  ---

  ### **2. Formal Properties**  
  **a. Irreflexivity and Asymmetry**  
  - **Motivation**: Explanatory loops are vicious (e.g., Fermi surface can't ground itself).  
  - **Threat**: Self-grounding claims (e.g., "the fact that there are facts grounds itself").  
  - **Status**: **Non-negotiable** for asymmetry; irreflexivity follows.  

  **b. Transitivity**  
  - **Motivation**: If Lattice dynamics ground quasiparticles, and quasiparticles ground superconductivity, lattice dynamics ground superconductivity.  
  - **Threat**: "Merely causal" chains (e.g., neuron states → pain → pain-report) may not ground transitively.  
  - **Status**: **Negotiable/Partisan**. Physics practice assumes transitivity across levels (e.g., QED → BCS → Ginzburg-Landau), but some metaphysicians deny it for "constitutive" relations.  

  **c. Well-foundedness**  
  - **Motivation**: Avoid infinite regress; explanations terminate.  
  - **Threat**: Physics (e.g., effective field theories) may have no fundamental level—all levels are effective.  
  - **Status**: **Negotiable/Partisan**. **I reject strict well-foundedness** as incompatible with EFT. Grounding chains may be "locally terminating" without a universal base.  

  **d. Ungrounded facts**  
  - **Demand**: Account for negative/general facts (e.g., "there are no magnetic monopoles" in a phase) without requiring them to be fundamental.  
  - **Status**: **Non-negotiable**. Physics treats these as derivative (e.g., monopole absence grounded in symmetry breaking).  

  ---

  ### **3. Distinctions to Preserve**  
  **a. Grounding vs. Causation**  
  - **Demand**: Grounding is synchronic/constitutive; causation diachronic/dynamic. Example: Phonons *ground* thermal conductivity (constitutive), but temperature gradients *cause* heat flow.  
  - **Status**: **Non-negotiable**. Collapse invites category errors.  

  **b. Grounding vs. Supervenience**  
  - **Demand**: Supervenience is modal covariance; grounding is explanatory direction. Example: Thermodynamic properties supervene on statistical mechanics, but grounding explains *how* (via coarse-graining).  
  - **Status**: **Non-negotiable**. Supervenience is too weak to capture explanatory asymmetry.  

  **c. Grounding vs. Reduction/Analysis**  
  - **Demand**: Grounding need not imply reducibility. Example: BCS theory is grounded in QED but not reducible (computational intractability; emergent symmetries).  
  - **Status**: **Non-negotiable**. Reductionism fails in condensed matter; grounding must allow "autonomous levels."  

  **d. One primitive relation vs. a family**  
  - **Demand**: A unified account for physical/special sciences (e.g., why "in virtue of" in biology resembles physics).  
  - **Status**: **Negotiable/Partisan**. I favor a **single relation** to avoid ad hoc fragmentation. Burden: Explain context-sensitivity without multiplying primitives.  

  ---

  ### **4. Constraints from Physics**  
  **a. EFT Architecture**  
  - **Demand**: Grounding must accommodate:  
    - Derivative → Authoritative asymmetry (QED grounds BCS, but BCS authorizes predictions about superconductors).  
    - UV-completion independence: Low-energy theories valid without knowing the "fundamental" layer.  
  - **Status**: **Non-negotiable**. Failure here invalidates grounding for science.  

  **b. No Bottom Layer**  
  - **Demand**: Grounding chains can be "infinitely descending" (e.g., Standard Model → QFT → EFT).  
  - **Status**: **Non-negotiable**. Well-foundedness must be relaxed or localized.  

  ---

  ### **5. Epistemology**  
  **a. Knowability without primitivist intuition**  
  - **Demand**: Grounding claims must be justifiable via scientific inference (e.g., renormalization group flow explains why EFTs are grounded in deeper theories).  
  - **Threat**: If grounding is primitive, disputes become non-empirical (e.g., "Is the mental grounded in the physical?").  
  - **Status**: **Non-negotiable**. **I reject intuition-based accounts**; grounding must be evidenced by explanatory success.  

  **b. Settling Disputes**  
  - **Demand**: Criteria for adjudicating grounding claims (e.g., counterfactual robustness: "If lattice dynamics changed, would Fermi surface alter?").  
  - **Status**: **Non-negotiable**. Without this, grounding is speculative.  

  ---

  ### **6. Approximation and Idealization**  
  **a. Grounding Admits Degrees**  
  - **Demand**: Some grounds are "better" than others (e.g., Fermi liquid theory approximates strongly correlated systems). Grounding isn't binary.  
  - **Status**: **Non-negotiable**. Physics relies on contingent approximations.  

  **b. Compatibility with Idealizations**  
  - **Demand**: Grounding must handle idealizations (e.g., infinite systems, continuum limits) without implying falsehoods.  
  - **Status**: **Non-negotiable**. Example: Thermodynamic limits ground phase transitions.  

  ---

  ### **Inconsistent Desiderata**  
  - **Well-foundedness + No Bottom Layer + EFT Architecture**: **Jointly unsatisfiable**. Strict well-foundedness demands a fundamental level; physics denies this. *Resolution: Drop well-foundedness or make it "local" (terminating relative to a context)*.  
  - **Single Primitive Relation + Epistemological Robustness**: If grounding is primitive and unanalyzable (**primitivist view**), epistemology collapses into intuition. *Resolution: Ground grounding in scientific inference (e.g., inter-theoretic relations)*.  
  - **Your suspicion is correct**: Insisting on a **single primitive relation** *and* **substantive logic** *and* **intuition-based epistemology** is untenable. Primitivism struggles with scientific cases.  

  **Most eliminative requirement**: **Epistemological naturalism** (Desideratum 5a). It excludes:  
  - Primitivist grounding (Fine, Rosen).  
  - Conceptual analysis-based accounts (e.g., grounding via a priori entailment).  
  - Quietist views (grounding as "non-factual").  

  ---

  ### **How Main Camps Fare**  
  - **Fine/Rosen (primitivist)**: Fails 5 (epistemology) and 4b (no bottom layer). Prioritizes logic over science.  
  - **Schaffer (priority monism)**: Fails 4b (requires a fundamental whole). Struggles with 6 (idealizations).  
  - **Deflationary/Non-primitivist (e.g., Wilson)**: Best on 4 (physics) and 5 (epistemology), but may fragment grounding relations (threatening 3d).  
  - **Grounding-as-mechanism (e.g., mechanistic explanation)**: Strong on 1a (explanation) and 5 (epistemology), but may conflate grounding with causation.  

  ---

  ### **Where I Am Most Likely Wrong & What Would Change My Mind**  
  - **Weakest item**: Insisting on a **single grounding relation** (3d). A pluralist account *might* better handle diversity in science.  
  - **Risk**: Overemphasizing physics as a guide to metaphysics. If grounding in ethics/logic operates differently, a unified account fails.  
  - **What would change my mind**: A demonstration that **non-scientific grounding claims** (e.g., moral facts grounded in natural facts) can be rigorously adjudicated *without* intuition. If grounding’s epistemology is domain-general, my naturalism is too narrow.  
  - **Self-critique**: I assume the structure of physical theory reliably reflects ontological hierarchy. If successful theories are *only* predictive tools (anti-realist view), grounding collapses into pragmatics.  

  **Final commitment**: Grounding must be a *scientifically tractable relation* explaining inter-theoretic dependence—or it is not worth having. Its value lies in clarifying why some descriptions "hold the floor" for others, not in carving reality at joints we cannot see.  

  ---  
  This framework prioritizes your physics-based constraints. If pressed, discard well-foundedness and primitivism; adopt local grounding relations justified by explanatory depth in theory-space.
