prompt: |-
  I read environmental regulation, not philosophy of science, and I have been trying to work out what theory of value the planetary protection rules are built on. I cannot get a coherent answer, so let me lay out the practice as I understand it and ask you to do the reconstruction. Please tell me if I have got any of the facts wrong, and whether the correction would change your reading.

  Under the 1967 treaty governing outer space, states are obliged to conduct exploration so as to avoid harmful contamination of celestial bodies, and also to avoid adverse changes in Earth's environment resulting from returned extraterrestrial matter. In implementation: landers bound for Mars are assembled in cleanrooms and their components baked for long stretches to drive the count of viable bacterial spores on board below a permitted limit; flight paths are biased so that a failed spacecraft is unlikely to strike a region where liquid water might let a hitchhiking Earth microbe multiply; an international committee sorts missions into protection categories of increasing stringency, and the agencies employ planetary protection officers to enforce them. When the Galileo orbiter ran out of propellant in September 2003, NASA deliberately destroyed it by crashing it into Jupiter rather than leave it in an orbit from which it might eventually fall on Europa, a moon with a subsurface ocean. Planned Mars sample return is handled as the strictest category of all, requiring containment of the returned material.

  Two things strike me as sitting badly with that. First, the quarantine imposed on returning Apollo crews — three weeks sealed in a facility with their spacecraft and their samples — was dropped after the first few lunar landings, once the Moon was shown to be lifeless; we now cheerfully leave hardware and debris there. Second, every serious plan for a crewed Mars mission concedes that human beings cannot be heat-sterilized, that each astronaut carries tens of trillions of microorganisms, and that a habitat will leak. The working solution appears to be to declare certain regions off-limits and accept contamination elsewhere.

  So: what does this practice presuppose? Reconstruct the implicit theory of value as precisely as you can, and consider at least these candidates — that indigenous microbes have moral standing in their own right; that a possible second origin of life is a unique and non-replicable object of knowledge, valuable the way an undeciphered manuscript or an unexcavated site is; that this is simply institutionalized precaution under radical uncertainty about both probabilities and values; or that nothing is being protected except the integrity of future science. Then tell me which of these the practice strictly requires, and which it merely fits comfortably with, pointing to the features that discriminate between them. I would expect the tolerated spore limits and the off-limits regions to look more like pollution control — acceptable risk, best available technology — than like a prohibition on touching, and I note that we sterilize hospital instruments by the trillion without a second thought, so the protected thing cannot be microbial life as such.

  Please also address these specific puzzles. What does it presuppose to treat a merely possible organism, one nobody has ever observed, as the bearer of a claim against us? What does it presuppose about biology, since the harm model assumes Earth microbes could metabolize Martian material and outcompete native life rather than share an ancestry with it? What explains the asymmetry between the abandoned back-contamination rules and the standing forward-contamination rules — does it reveal that knowledge rather than organisms is the real object, or is it an asymmetry about who bears the risk, which would itself be a normative commitment worth naming? And which rival views does the practice quietly rule out?

  Finally, tell me what would have to change if the presupposed view were made explicit and applied consistently. If Martian microbes genuinely had standing, is a crewed mission permissible at all? Or does the practice's own logic amount to a right of first look that expires the moment we settle whether life is there — in which case the Moon is not an inconsistency but the pattern's predicted endpoint? Describe what a policy built on a different one of your candidate theories would actually look like on the ground.

  Be explicit about how confident you are in each part: which readings the practice strongly supports and which are speculative extrapolations from details I may have garbled. Single out the one point in your answer you are least sure of, and say what a specialist would need to check to settle it.
reasoning: |-
  Okay, let me unpack this user's query about planetary protection. They're clearly well-versed in environmental regulation but struggling to pin down the underlying ethical framework. The detailed examples they provide - from cleanroom protocols to the Galileo probe's deliberate destruction - suggest they've done serious homework but hit a conceptual wall. 

  Hmm, their frustration with "incoherent answers" rings true - this is a field where operational rules outpace philosophical articulation. The core tension they spot between Mars sterilization and abandoned lunar quarantine is sharp. And their four candidate theories (intrinsic value of microbes, epistemic value, precaution, science protection) cover the major philosophical bases. 

  Right, let's tackle their puzzles systematically. First, the "possible organism" paradox: how can we owe duties to unconfirmed life? The precautionary principle handles this - it's about preserving the *conditions* for potential value. The biology assumption (Earth vs Martian life competition) does seem shaky though - current astrobiology leans toward common origins or incompatibility. 

  The Moon/Mars asymmetry is telling. Abandoning lunar quarantine once knowledge was gained strongly points to science-integrity as the core value. If microbial rights were primary, we'd still protect the sterile Moon "just in case." 

  For manned missions... *winces* that's messy. The proposed "off-limits" zones basically admit contamination is inevitable, which contradicts strict microbial rights views. The user's "right of first look" expiration theory seems spot-on - once we know Europa has life, protection might switch from avoidance to non-interference. 

  Least confident point? Whether current Mars protocols truly fit "best available technology" or are more restrictive. A specialist should compare spore limits to hospital sterilization efficacy thresholds. 

  If we took microbial rights seriously, all Mars exploration might halt - but since we're planning manned missions anyway, the practice clearly doesn't embrace that view. The epistemic value theory fits best, with precaution as its enforcement mechanism. 

  *checks notes* Must remember to flag where policy inconsistencies might arise - like if we find dead Martian fossils, does protection continue? The user would want that implication teased out.
answer: |-
  Based on your description (which accurately reflects current planetary protection practice and its historical context), here's a reconstruction of the implicit theory of value, addressing your specific puzzles and candidate theories. Confidence levels are indicated throughout, with the least certain point identified.

  ---

  ### **Core Theory of Value: Presupposed by Practice**
  **Epistemic Conservationism:**  
  Planetary protection primarily values the preservation of *opportunities for unique scientific knowledge*, specifically the potential to discover and study a second, independent origin of life. This knowledge is treated as **non-replicable, irreplaceable, and fragile** – analogous to an undisturbed archaeological site or pristine ecosystem. Harm is defined as actions that *preemptively destroy or irrevocably compromise* this epistemic opportunity.

  **Key features justifying this reading (High Confidence):**  
  1. **Asymmetry in Back- vs. Forward-Contamination Rules:**  
     - Lunar quarantine was abandoned *because* knowledge was gained (Moon is lifeless), eliminating the epistemic risk. Forward-contamination rules persist where knowledge is absent (Mars, Europa).  
     - **Implied Normative Commitment:** The burden of precaution falls on the actor introducing contamination (us), not on potential future discoveries. Risk asymmetry favors protecting the unknown.  

  2. **Tolerance for Contamination Under Constraints:**  
     - Permitted spore counts and "off-limits" regions on Mars for human missions reflect **acceptable risk management**, not absolute prohibition. This mirrors pollution control (e.g., emissions limits) where some degradation is tolerated to achieve other goals (e.g., exploration).  
     - Sterilizing hospital instruments isn’t analogous: it protects specific human interests, not an *unknown* epistemic good.  

  3. **Galileo’s Destruction:**  
     Sacrificing the probe preserved Europa’s ocean as an uncontaminated object of study – a clear epistemic priority over hardware or mission cost.  

  4. **Strict Containment for Sample Return:**  
     Samples are contained not to protect Earth (Apollo showed minimal risk), but to prevent contamination that could confound the study of *indigenous* Martian material.  

  ---

  ### **Evaluation of Candidate Theories**
  | Theory                     | Fit with Practice                     | Discriminating Features                                  |  
  |----------------------------|---------------------------------------|----------------------------------------------------------|  
  | **Epistemic Value**        | **REQUIRED** (Core justification)     | Rules relax upon gaining knowledge (Moon); sample containment protects scientific integrity. |  
  | **Precaution under Uncertainty** | **INTEGRAL SUPPORT** (Enforcement mechanism) | Rules apply where knowledge gaps exist; probabilistic spore limits. |  
  | **Science Integrity**      | **COMPATIBLE** (Subset of epistemic)  | Explains containment/sterilization but not *why* potential life merits unique caution. |  
  | **Moral Standing of Microbes** | **INCOMPATIBLE**                    | Practice tolerates contamination (human missions, spore limits); no protection for sterile environments post-knowledge. |  

  - **Moral Standing Theory Ruled Out:** If microbes had intrinsic rights, heat-sterilizing landers would be unethical (like genocide), and human missions to Mars would be impermissible. Practice explicitly plans for both.  

  ---

  ### **Resolution of Specific Puzzles**
  1. **Protecting "Possible" Organisms:**  
     - **Presupposes:** Potential life has no intrinsic moral claims, but its *potential discovery* has immense epistemic value. The "claim" is against *our* actions that would foreclose knowledge. Precaution is triggered by **scientific plausibility** (e.g., liquid water on Mars) – not mere possibility.  
     - *Confidence: High* – Consistent with abandoned lunar rules.  

  2. **Biological Assumptions:**  
     - **Presupposes:** Earth and Martian life *could* be physiologically incompatible (distinct origins) OR that Earth microbes could disrupt Martian ecosystems via competition/resource exploitation. Practice hedges against both, prioritizing **non-interference** until compatibility is known.  
     - *Confidence: Medium* – Astrobiology models conflict; policy assumes worst-case competitive exclusion.  

  3. **Asymmetry (Back- vs. Forward-Contamination):**  
     - **Reveals:** Knowledge is the object. Back-contamination rules were precautionary against unknown Earth risks; once risk was disproven, protection ceased. Forward-contamination protects enduring epistemic value. The asymmetry reflects **risk-bearing asymmetry**: we impose contamination on other worlds, not vice versa.  
     - *Normative Commitment:* **Other worlds as scientific commons** – humanity has a duty to preserve opportunities for discovery.  
     - *Confidence: High* – Directly evidenced by lunar policy change.  

  4. **Rival Views Ruled Out:**  
     - **Biocentric Equality:** If all life had equal moral standing, sterilizing spacecraft would be obligatory *everywhere* (not just "special regions").  
     - **Planetary Sovereignty:** Practice assumes no inherent rights of celestial bodies; protection is anthropocentric (for science).  
     - *Confidence: High* – Contamination tolerances and mission design contradict these.  

  ---

  ### **Implications of Consistent Application**
  - **If Epistemic Value is Paramount:**  
    - Crewed Mars missions require **strict zoning** ("off-limits" special regions) and containment tech. Contamination elsewhere is tolerated as an acceptable trade-off for exploration.  
    - Protection **expires upon knowledge gain**: If Mars is confirmed lifeless, rules relax (like the Moon). If life is found, protection shifts to **non-interference** (e.g., no landing near life sites).  
    - **Galileo-type sacrifices remain obligatory** to protect ocean worlds (Europa, Enceladus).  

  - **If Microbial Rights Were Genuinely Recognized:**  
    - Human missions to potentially inhabited worlds become ethically impermissible.  
    - All spacecraft require near-absolute sterilization (current spore limits are 300 per m² – far above "rights-respecting" levels).  
    - *This is not practiced or planned.*  

  - **If Precaution Dominated:**  
    - Sample return might be banned entirely (unknown risks).  
    - Human missions to Mars would be indefinitely postponed.  
    - *Practice balances precaution with exploration goals.*  

  ---

  ### **Weakest Point: Confidence & Specialist Check**
  - **Least Confident Claim:** The argument that *current* spore limits and mission tolerances are purely "epistemic/conservationist" rather than partially rooted in unresolved *precautionary concerns about Earth safety*.  
    - **Why:** NASA/ESA sometimes cite "protecting Earth’s biosphere" in official docs, though scientific consensus deems back-contamination risk negligible.  
    - **Specialist Check Needed:** Review internal agency risk assessments for Mars Sample Return (MSR) and human mission planning:  
      - Is "Earth safety" a genuine driver or a legacy justification?  
      - Do decision thresholds (e.g., spore limits) correlate with scientific detection limits or broader precaution?  

  **Overall Confidence:**  
  - **High** on epistemic value as core theory (95%: explains asymmetries, tolerances, and knowledge-dependent rules).  
  - **Medium** on whether precaution incorporates unstated Earth-protection aims (60%: policy language is ambiguous).  
  - **Speculative:** Long-term "expiration" of protection post-discovery – no precedent beyond Moon.  

  --- 
  **In summary:** Planetary protection is best understood as **precautionary conservation of unique epistemic opportunities**, not intrinsic rights of microbes. It accepts controlled contamination to enable exploration but prioritizes preserving the ability to detect and study extraterrestrial life *as it exists independently of Earth*. Your "right of first look" metaphor is apt – and the Moon is indeed the endpoint of that logic.
