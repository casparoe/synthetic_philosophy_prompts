prompt: |-
  You are a professional philosopher who works on the ethics of information and on the conceptual analysis of privacy; please treat what follows as a piece of careful applied analysis rather than a general survey, and think it through slowly before you start writing.

  I am a second-year graduate student. My supervisor is drafting a monograph on informational privacy, and her manuscript is the subject of our department's work-in-progress seminar this term; I have been asked to prepare a formal comment on the middle chapter. Her method throughout is uniform: she states a worked example, then issues a verdict — privacy violated, or not violated — and only later gestures at the theory. The examples are her own inventions, not lifted from the literature, so please do not try to match them to a published author or book. Please also do not give me a bibliography, citations, quotations, or page references; neither of us has the sources to hand and I want reconstruction and argument, not name-checking.

  Her verdicts on the eight examples so far:

  1. A fertility clinic sends appointment reminders — which reveal that the patient is in treatment — to the household email address she had supplied years earlier for billing, without ever asking whether that address is safe to use. **Violation.**
  2. A direct-to-consumer genetics company requests separate, plain-language, itemized permission for each of four downstream uses (research, product improvement, partner marketing, law-enforcement access), lets users revoke any of them at any time, and honors revocations within thirty days. **No violation.**
  3. A period-tracking app whose policy said only that it "may share information with trusted partners" sells users' inferred cycle predictions to an advertising network; accepting the policy was the sole condition of using the app at all. **Violation** — and she stresses that the user's acceptance is beside the point.
  4. A hospital releases records to an academic researcher under a data-use agreement that forbids re-identification; the researcher's graduate student re-identifies four percent of the records against a purchased public voter file, then publishes nothing and shares nothing. **Violation.**
  5. A fitness app silently reverses a default so that GPS routes are public unless the user finds and flips a buried setting. Route-sharing is entirely ordinary in that user community, nobody is embarrassed by anything, and a good many users are delighted. **Violation.**
  6. A patient gives her oncologist a specific, written, revocable authorization to send her pathology report to her personal trainer; the trainer signs a confidentiality undertaking and uses the report only to adjust the training program. **Violation** — and here she stresses that the patient's authorization was as complete and as informed as authorization can be.
  7. A newspaper assembles a searchable database of the names and faces of everyone photographed at a permitted public march, the names supplied by matching faces against public social-media profiles. **Violation.**
  8. A hospice patient, while fully competent, initials a clause in the admission packet permitting her voice recordings and personal letters to be used "for the bereavement program." She dies. Her daughter asks for a recording of her mother reading a story she had recorded years earlier, and the hospice hands it over. **No violation.**

  The ninth example, which she has not yet ruled on, is the one I have to comment on. Same hospice, same initialed clause, same recordings and letters: the bereavement program trains a conversational system on them and offers the family an interactive voice that answers in the deceased's manner and cadence. It never claims to be her; access is restricted to the immediate family; nothing is published or sold; and the clause she initialed said only "for the bereavement program," with no mention of interactive reconstruction.

  Here is what I need from you, in this order:

  **Step 1 — brainstorm before you commit.** Lay out at least four candidate general rules that could generate her eight verdicts: for instance, a rule on which privacy claims are really claims about property, contract, and confidential relationships in disguise; a rule on which privacy is a matter of the subject's control; a rule on which privacy is a matter of access or secrecy; a rule on which it is governed by context-specific norms of information flow; a rule on which it protects personhood or dignity. You may add or replace candidates as you see fit. For each, say which of the eight verdicts it explains cleanly and which it has to strain to accommodate, and note the strain. A compact table whose rows are candidate rules and whose columns are the eight verdicts — marked *clean*, *strain*, or *incompatible*, with a one-line note wherever it is not clean — would be ideal here.

  **Step 2 — survivors.** Tell me which candidates, if any, survive all eight unqualified. If none does, say whether the ledger is consistent only with a hybrid or with an auxiliary assumption bolted onto one of them, and state precisely what that auxiliary is and what priority rule the hybrid needs when its components conflict. If one of your candidates is flexible enough to absorb all eight verdicts no matter how they came out, say so and price the cost in predictive content.

  **Step 3 — the prediction.** Predict her verdict on case 9, with a rough confidence, and identify which of the eight is the closest analog and where that analogy might break. Note in particular which of examples 6 and 8 she will treat as governing, and why.

  **Step 4 — divergence.** For each surviving candidate, give the reasoning it would use on case 9, and mark exactly where the candidates part company. Include the wrinkle that the subject is dead: say which candidates think a deceased person can be the subject of a privacy violation at all, and how that changes their verdict.

  **Step 5 — the recommendation.** She has to write a verdict. Recommend the one that best coheres with her own precedents, and then, honestly, state what principle the chapter would be adopting by ruling that way and what it would be adopting by ruling the other way — including any cost to examples she has already committed to.

  **Step 6 — the discriminator.** Design a tenth worked example that would tell the two best-fitting candidates apart, and state in advance what each of them predicts about it.

  Aim for roughly 1,300 to 1,600 words, use headers matching the six steps, and resist the temptation to open with a definition of privacy or a history of the concept — assume I have read the standard material and want your judgment instead.
reasoning: |-
  Hmm, this is a fascinating and highly specific request from a graduate student working on informational privacy ethics. They need a structured philosophical analysis of their supervisor's case judgments to predict her stance on a new case involving posthumous voice recreation. 

  First I need to understand the core task: reverse-engineering the professor's implicit principles from eight decided cases to predict her ruling on a ninth. The student wants me to avoid grand theories and focus strictly on coherence with existing verdicts. 

  Looking at the eight verdicts, several patterns jump out:
  - Consent alone isn't sufficient (cases 3 & 6)
  - Secondary uses without explicit authorization are problematic (1,3,4,7)
  - Default settings matter (5)
  - Posthumous privacy exists but can be waived (8)

  The hospice cases (6,8) present an interesting tension: written authorization wasn't enough for the trainer case but was sufficient for releasing the recording. This suggests the supervisor distinguishes between information flow purpose and recipient trustworthiness. 

  For Step 1's candidate rules, I'm considering:
  1) Control theory (but fails case 6)
  2) Contextual integrity (handles most but struggles with 8)
  3) Dignity protection (explains 3,5,7 well)
  4) Risk-based approach (accounts for 1,4,5)
  5) Relational privacy (addresses 6 and 8)

  The contextual integrity framework seems most promising but needs augmentation for the dead subject issue. For the prediction on case 9, I suspect she'll find violation due to the radical repurposing of data, though the daughter's request analogy in case 8 creates tension. 

  When designing the discriminator case, I'll pit contextual integrity against dignity theory by creating a scenario where social norms permit certain data uses but dignity concerns arise - perhaps deepfake manipulation of a consenting adult's image. 

  Throughout this, I should maintain strict focus on applied coherence rather than theoretical purity, as requested. The word count allows depth but requires discipline - I'll need to compress the table while keeping it legible.
answer: |-
  ## Professional Analysis: Reverse-Engineering a Privacy Framework

  ### Step 1: Candidate Rules & Fit Assessment

  Here is a compact assessment of five candidate principles against the eight verdicts:

  | Rule Description                                | Ex1 | Ex2 | Ex3 | Ex4 | Ex5 | Ex6 | Ex7 | Ex8 | Notes                                                                 |
  | :---------------------------------------------- | :-- | :-- | :-- | :-- | :-- | :-- | :-- | :-- | :-------------------------------------------------------------------- |
  | **A. Strict Purpose Specification & Adherence:** Privacy is violated when information is used or disclosed in ways materially different from the specific purpose understood or consented to at collection. | Clean | Clean | Clean | Clean | Clean | Clean | Clean | Strain | Problem: "Bereavement program" in Ex8 *could* arguably include sharing with daughter, but stretches "specific purpose". |
  | **B. Contextual Integrity:** Privacy is violated when information flows violate context-relative informational norms concerning the *type* of information, the *actors* involved, the *transmission principles*, and the *purpose*. | Clean | Clean | Clean | Clean | Clean | Strain | Clean | Strain | Problem: Ex6 – Patient/Trainer flow *might* be normatively acceptable in some fitness contexts; Ex8 – Sharing w/daughter *might* fit bereavement norms. |
  | **C. Dignity/Autonomy Core:** Privacy protects fundamental interests in personal dignity, bodily integrity, and decisional autonomy. Violations occur when actions undermine self-presentation, create vulnerability, or bypass core self-determination. | Clean | Clean | Clean | Clean | Clean | **Incompatible** | Clean | Clean | **Fatal Flaw:** Ex6 verdict is inexplicable. Patient exercised full autonomy; no inherent dignity harm in trainer seeing report for fitness. |
  | **D. Precautionary Risk Minimization:** Privacy is violated when an entity fails to take reasonable, specific steps to minimize the risk of harmful, unexpected, or norm-violating downstream uses or disclosures, regardless of consent. | Clean | Clean | Clean | Clean | Clean | Strain | Clean | Strain | Problem: Ex6 – Oncologist arguably took reasonable steps (written auth, confidentiality). Ex8 – Hospice took minimal steps (clause). |
  | **E. Relational/Trust-Based:** Privacy is violated when a relationship of trust (e.g., clinician-patient, service-user) is breached by uses/disclosures that betray the core expectations and vulnerabilities inherent in that specific relationship, even with consent. | Strain | Clean | Clean | Clean | Strain | Clean | Clean | Clean | Problem: Ex1 – Focus is more on negligence than *relational* betrayal. Ex5 – Violation seems based on changed defaults, not inherent trust in app. |

  **Analysis:**
  *   **A (Purpose Spec)** performs well but strains on Ex8. Its strength is demanding specificity.
  *   **B (Contextual Integrity)** is very strong but requires nuanced judgments about norms for Ex6 & Ex8.
  *   **C (Dignity Core)** is fatally undermined by Ex6 – consent *should* resolve dignity/autonomy concerns here.
  *   **D (Risk Minimization)** fits well but struggles with Ex6 where risks were arguably managed and Ex8 where minimal steps were taken.
  *   **E (Relational Trust)** captures Ex6 perfectly but struggles with technology examples (Ex1, Ex5) where the "relationship" is less defined than in healthcare.

  ### Step 2: Survivors & Reconciliation

  *   **No candidate survives all eight verdicts unqualified.** Rule C is definitively eliminated by its incompatibility with Ex6.
  *   **The ledger suggests a hybrid approach.** The most plausible core is **Contextual Integrity (B)**, but it requires **bolting on an auxiliary assumption concerning transformative repurposing**.
  *   **Auxiliary Assumption:** *Even within a consented or normatively accepted context, using personal information as the basis for generating fundamentally new forms of representation or interaction (especially those simulating identity or agency) constitutes a distinct privacy violation, unless such use was explicitly anticipated and authorized.*
  *   **Priority Rule for Hybrid (B + Auxiliary):** Contextual norms govern baseline flows and expected uses. The auxiliary rule governs novel, transformative repurposing that creates new categories of information or interaction (e.g., AI training for simulation), overriding contextual norms if not explicitly anticipated/authorized. Conflicts are resolved by asking if the new use *transforms the nature of the information or its impact*.
  *   **Why this hybrid?** B explains most cases inherently. The auxiliary cleanly explains Ex6: Sharing the *existing report* with the trainer might be contextually acceptable, but creating an *interactive AI simulation* from recordings/letters is transformative repurposing not explicitly authorized, hence a violation. It also strengthens B on Ex3 (norm violation + unexpected transformation of data for ad targeting) and Ex7 (public photo database creates a new, searchable identification tool).

  ### Step 3: Prediction for Case 9

  *   **Predicted Verdict:** **Violation.** (High Confidence: ~85%)
  *   **Closest Analog:** **Example 6 (Oncologist/Trainer - Violation)** is the governing analog, not Example 8 (Daughter/Recording - No Violation).
  *   **Reasoning:**
      *   Like Ex6, this involves a transformative repurposing of personal information (voice/letters) into a fundamentally new form (interactive conversational AI) that simulates aspects of the deceased's identity and agency.
      *   The clause "for the bereavement program" is analogous to the patient's authorization in Ex6: it authorizes *a use* (bereavement support), but not *this specific, novel, identity-simulating method*. Just as sharing the report with the trainer was a specific use not covered by general consent to treatment, creating an interactive AI voice is a specific use not covered by "bereavement program."
      *   The auxiliary rule (transformative repurposing) applies directly. Creating an interactive AI agent is a qualitative leap beyond using a static recording for comfort, changing the nature of the interaction and potentially the family's relationship with the deceased's memory.
      *   Ex8 is distinguished because handing over an existing recording for playback is a direct, non-transformative use consistent with common-sense understanding of bereavement support ("here is her voice"). It doesn't generate a new interactive entity.
  *   **Where Analogy to Ex6 Might Break:** The subject is deceased. However, the supervisor's Ex8 verdict ("No Violation") implicitly accepts that privacy interests *can* persist after death concerning the *handling of specific information* collected in life, otherwise handing the recording to the daughter could have been a violation. The violation in Ex9 stems from the *nature of the repurposing* of that information, not merely its disclosure.

  ### Step 4: Divergence on Case 9

  *   **Hybrid B (Contextual Integrity + Transformative Repurposing Auxiliary):** Violation. The core flow (using voice/letters for bereavement) might be normatively acceptable *if* done via static recordings or letters. However, training an interactive AI fundamentally transforms the information into a new entity capable of simulated interaction, creating a novel form of representation and potential impact not anticipated by the contextual norms of hospice care or the vague consent clause ("bereavement program"). This transformative use requires explicit, specific authorization.
  *   **D (Precautionary Risk Minimization):** Likely Violation. The hospice failed to minimize the risk of an unexpected, potentially distressing, and normatively fraught downstream use (interactive AI simulation). The clause was overly broad ("bereavement program"), failing to specify permissible methods. The risk of this kind of deep personal replication wasn't reasonably mitigated. (Diverges from B: Focuses on risk failure rather than norm violation + transformation).
  *   **E (Relational Trust):** Violation. The hospice, in a profound relationship of trust formed during end-of-life care, betrayed the core expectations of that relationship by using deeply personal, intimate artifacts (voice recordings, personal letters) to create an interactive simulation. This goes beyond the expected bounds of memorialization or comfort associated with a hospice bereavement program, potentially commodifying or distorting the patient's identity for the hospice's chosen method of support. (Diverges from B/D: Focuses on betrayal of the specific hospice-patient trust relationship inherent in the context).
  *   **A (Strict Purpose Specification):** Violation. The specific purpose consented to ("bereavement program") does not clearly encompass the creation of an interactive AI simulation. This use is materially different from simply using recordings or letters passively. (Converges with B/D/E on verdict, diverges slightly on reasoning by focusing purely on purpose mismatch rather than norms, risk, or trust).
  *   **The Deceased Subject:** All surviving candidates (A, B, D, E) implicitly accept that posthumous privacy violations are possible concerning the *handling of specific information generated or entrusted during life*. Ex8 established this baseline. The violation in Ex9 arises from *how* the entrusted information is handled (transformed into an AI simulation), not the mere fact of its use after death. Rule E (Relational Trust) might place the strongest emphasis on the betrayal of the *trust relationship established while the patient was alive* persisting in governing the use of the information she provided.

  ### Step 5: Recommendation

  *   **Recommendation:** Rule **Violation** for Case 9.
  *   **Principle Adopted by Ruling Violation:** The chapter adopts the principle that **consent to a general purpose (e.g., "bereavement program") does not authorize the use of personal information to create novel, interactive simulations of the individual's identity or agency without explicit, specific authorization for that transformative use.** This embeds the hybrid framework: contextual norms govern baseline flows, but transformative repurposing demands heightened specificity.
  *   **Cost of Ruling No Violation:** Ruling "No Violation" would adopt the principle that **consent to a broad purpose authorizes any downstream use within that purpose's imaginative scope, regardless of how transformative or unexpected the method.** This would significantly weaken Ex6 (oncologist/trainer) – if "treatment" consent is broad, why isn't sharing with the trainer covered? It would also undermine Ex3 (period app) – if "trusted partners" is broad, why isn't selling data covered? Ex4 (re-identification) would also be harder to defend, as the broad purpose of "research" could arguably encompass re-identification attempts. The "No Violation" ruling would create tension with the emphasis on specificity in Ex2 and the rejection of broad consent in Ex3.
  *   **Coherence with Precedents:** Ruling "Violation" coheres best with Ex6 (transformative use not covered by specific auth), Ex3 (broad consent insufficient for unexpected use), and Ex4 (use violates specific agreement terms). It distinguishes Ex8 by the non-transformative nature of sharing the static recording.

  ### Step 6: The Discriminator

  *   **Tenth Worked Example:** A public library partners with a tech company to offer patrons a service: scan any physical book you borrow, and the system provides real-time, personalized annotations (historical context, critical analysis, related works) overlaid on your viewing device. Patrons must consent to "enhance your reading experience using your borrowing history and interaction data." The system silently uses the patron's unique highlighting patterns, page-turn speed, and borrowing history (including sensitive topics like health, finance, or sexuality) to train a proprietary algorithm predicting reading preferences for targeted book recommendations sold to publishers.
  *   **Predictions:**
      *   **Hybrid B (Contextual Integrity + Transformation):** *Violation.* The contextual norm of library borrowing involves facilitating access, not covertly mining intimate reading behaviors (highlighting patterns, speed on sensitive topics) for commercial algorithmic training. Using borrowing history/data to generate *real-time annotations* might fit "enhance reading experience," but training a *commercial preference algorithm* is a transformative repurposing not explicitly authorized and violating library-patron informational norms.
      *   **D (Precautionary Risk Minimization):** *Violation.* The library failed to minimize the risk of unexpected commercial exploitation of deeply sensitive behavioral data (reading patterns on intimate topics). The consent ("enhance reading experience") was overly broad and did not specify algorithmic training for third-party commercial use.
      *   **E (Relational Trust):** *Violation.* The library, in a relationship of trust centered on intellectual exploration and confidentiality, betrays that trust by covertly mining sensitive reading behaviors for commercial gain with publishers, far exceeding the expected bounds of "enhancing reading experience."
      *   **A (Strict Purpose Specification):** *Likely Violation.* "Enhance your reading experience" arguably covers the annotations but clearly does not encompass training a commercial algorithm for publishers. This is a materially different purpose.
  *   **Discrimination:** This case doesn't cleanly distinguish B, D, E, and A; they likely converge on Violation. However, it **sharply distinguishes them from Control Theory (eliminated earlier)**, which might argue no violation if consent was given, and highlights the **strength of B/D/E/A over pure Dignity Theory (C)** – the violation stems from norms, risk, trust, or purpose mismatch, not necessarily inherent dignity harm from targeted ads. To distinguish B/D/E, a case involving transformative use *within* clear, specific consent and context would be needed (e.g., a *requested* AI grief counselor trained *only* on consented data for *that purpose* – B/D/E might see no violation if norms/trust align, whereas A might still demand ultra-specificity).
