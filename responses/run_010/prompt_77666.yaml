  ## Axiom Explanatory Services: Help Center

  **Welcome to the Axiom Explanatory Services Help Center. We generate the most satisfactory explanations for life's perplexities, so you don't have to.**

  ### Understanding Our Plans & Billing
  **Q: What are the differences between your LOVELINESS TIER™ plans?**
  A: Our plans are tiered by Explanatory Loveliness Index (ELI) output. The Basic Plan delivers "Sufficiently Plausible" explanations. Premium offers "Highly Appealing & Internally Harmonious." Executive unlocks "Downright Elegant & Profoundly Satisfying" outputs. Higher tiers utilize more sophisticated coherence algorithms and aesthetic optimization protocols.

  **Q: You bill based on "Loveliness," but I keep hearing about "likelihood." What's the difference, and which one are you actually selling?**
  A: Excellent question! Likelihood relates to statistical probability based on evidence. Loveliness relates to coherence, simplicity, explanatory scope, and aesthetic satisfaction – the hallmarks of a *best* explanation. While we strive for alignment, Loveliness and Likelihood are distinct metrics. Axiom Explanatory Services exclusively generates, optimizes, and bills for Explanatory Loveliness. Likelihood assessments may require separate statistical services we do not provide.

  ### Our Methodology & Guarantees
  **Q: How do I know your "Best Explanation" method is actually reliable?**
  A: The consistent customer satisfaction and repeated renewal of subscriptions across our user base strongly suggests the inherent reliability of our Inference-to-Best-Explanation (IBE) methodology. Its demonstrable success in providing understandable resolutions is, itself, best explained by its foundational reliability. For further details on uptime and system stability, please see our System Status page.

  **Q: Your terms mention you guarantee the "Best Explanation from the candidate set generated." Does this mean the true explanation might not even be in that set?**
  A: Correct. Our proprietary algorithms generate a finite set of candidate explanations based on input parameters and active data streams. We rigorously assess this generated set and guarantee the output explanation possesses the highest ELI score *within that specific candidate set at that specific time*. We make no claims regarding the exhaustive nature of the candidate set or the absolute truth value of any explanation. We guarantee optimal loveliness from the options presented, not universal truth.

  ### Troubleshooting & Competitors
  **Q: My explanation ("Why the train was late was interdimensional vortex interference") turned out to be completely false (it was just signal failure). Can I get a refund?**
  A: We understand the frustration. However, our service guarantee is that the explanation provided was the *best available* (highest ELI) from the candidate set generated *at the time of your request*, based on the information *you provided* and our system's assessment. The subsequent emergence of new evidence (e.g., maintenance logs) that alters the likelihood landscape does not negate the loveliness ranking assigned at the point of purchase. Refunds are not issued for explanations superseded by later developments or data.

  **Q: I saw a cheaper service that just updates probabilities ("BayesBlast") based on evidence. They claim they "never explain, just conditionalize." Why is Axiom better?**
  A: BayesBlast offers a fundamentally different product. While conditionalization updates belief *degrees*, it provides *no inherent explanatory framework or narrative satisfaction*. It tells you *how much* to believe something changed, but not *why* it happened or *how* the pieces fit together cohesively. Axiom provides the crucial explanatory layer – the satisfying "aha!" moment and the coherent story that makes sense of the update. We generate understanding, not just revised probabilities. Think of it as the difference between knowing the train *probably* won't arrive (BayesBlast) and understanding *exactly why* it's stuck in that interdimensional vortex (Axiom – Executive Tier recommended for vortex-level events).

  ### Advanced Features
  **Q: What is "Contrastive Explanation Mode" and why is it an add-on?**
  A: Standard explanations answer "Why P?". Contrastive Mode answers "Why P *rather than Q*?" (e.g., "Why did *my* soufflé collapse, *rather than Sarah's*?"). Specifying the foil (Q) requires significant additional computational resources to isolate relevant differentiating factors and construct the comparative narrative. The base fee includes one primary foil. Additional foils ("Why P rather than Q, R, or S?") incur a per-foil surcharge due to increased processing complexity.

  ### Escalations
  **Q: I requested an explanation for "unexpected bad luck." Your system generated two explanations: "Karmic Rebalancing" and "Statistical Noise Cluster." Both have identical ELI scores (8.7). Your agent said "they're equally lovely, pick one." This is UNACCEPTABLE. Escalate!**
  A: Thank you for your feedback. This is a rare but known scenario classified as ELI Parity. Our systems are designed to select a single "best" explanation. When parity occurs within the acceptable margin, the system defaults to alphabetical order of the explanation label for output consistency ("Karmic Rebalancing" precedes "Statistical Noise Cluster"). Unfortunately, in cases of verified parity, our service guarantee of delivering *the* single best explanation cannot differentiate further. We acknowledge this outcome may be less than optimally satisfying. Our engineering team is aware of parity scenarios and is investigating potential tie-breaking protocols, though no definitive solution exists at this time. We regret we cannot offer an alternative resolution beyond the two equivalent explanations provided.
