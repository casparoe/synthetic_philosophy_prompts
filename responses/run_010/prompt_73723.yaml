  Hmm, the user is a philosophy professor running a shared biographical library for an undergraduate program. They need a rigorous decision procedure for evaluating new nominations, grounded in Plutarchan, hagiographic, and contemporary exemplar theory traditions—not generic media literacy. The current "decide by taste" method is unsustainable given the constraints: untrained graduate students on the committee, 30-minute reviews, and texts being taught by non-specialists.

  Key requirements for the procedure:  
  - Fixed sequence of questions with clear pass/fail thresholds  
  - Classification into four teaching modes (mirror/template/caution/criticism) with explicit usage restrictions  
  - Preservation of Plutarch's deed/imitation distinction  
  - Rules for handling textual silences about faults  
  - Hard rejection points (not just qualified admissions)  
  - Retroactive withdrawal mechanism  
  - Transparent flags for value judgments  

  The three test cases are revealing:  
  1. *Plutarch's Alcibiades*—their personal favorite but ethically problematic. Forces confrontation with bias.  
  2. *Legendary desert ascetic vita*—tests how the procedure handles uncorroborated existence and didactic fiction.  
  3. *Familial statesman biography*—probes conflicts of interest in authorized narratives.  

  Building the procedure requires synthesizing:  
  - **Plutarch's principles**: Micro-behaviors > grand deeds; faults as human universals; malice in excessive vice-dwelling  
  - **Hagiographic conventions**: Topoi as genre signals; edification > historicity; uncorroborated subjects  
  - **Exemplar theory**: Admiration's gatekeeper role; resistance to correction; undesirability of "perfect" lives  

  Major pitfalls to address:  
  - Graduate students might misapply the "admiration test" for cautionary lives  
  - Silent faults could be over-interpreted as suppression  
  - The existence-corroboration rule might wrongly exclude pedagogically useful legends  

  For Alcibiades specifically, the tension is acute: Plutarch's own method condemns his subject's moral volatility despite brilliant qualities. The procedure must force admission as *cautionary* only, blocking mirror/template uses—likely frustrating the professor.  

  The withdrawal rule needs special care, perhaps requiring:  
  - New historical evidence undermining factual basis  
  - Pattern of teaching misuse observed  
  - Scholarly consensus shift on text's reliability  

  Ultimately the procedure's limits must be acknowledged:  
  - Cannot replace teacher training  
  - Struggles with satirical/ironic lives  
  - Risks mechanistic application to nuanced texts  
  - Leaves "undesirable virtue" problems unresolved  

  The professor's meta-request is key—they want transparency about where the procedure is merely codifying judgment. That's most salient in:  
  - Deciding when silence about faults is prudent vs deceptive  
  - Determining if a flaw is "necessary" to dwell on  
  - Assessing whether admiration is irretrievable post-correction  

  For the ascetic vita, the existence rule must flex: if the text presents itself as legendary (e.g., "The Life of Saint Nobody"), it can be admitted for criticism of hagiographic tropes—but not as template. The statesman bio demands scrutiny of access agreements; exclusive control of papers might require automatic caution-mode assignment.  

  Final note: The procedure is a scaffold, not a replacement for scholarly engagement. Its greatest value may be forcing explicit justifications where previously "taste" ruled.
answer: |-
  Below is a decision procedure derived from Plutarchan biography, hagiographic conventions, and contemporary exemplar theory. It is designed to be operational, with fixed questions, clear rejection thresholds, and explicit flags for value judgments. The procedure distinguishes four teaching modes:  
  - **Mirror** (self-comparison)  
  - **Template** (direct emulation)  
  - **Caution** (warning against flaws)  
  - **Criticism** (interrogating admiration)  

  Each text is assigned to permitted modes; all others are forbidden. The procedure includes a withdrawal rule and specifies entry documentation.  

  ---

  ### **Decision Procedure: Vetting Biographical Material**  
  **Order of Operations** (30 mins/nomination; stop if rejection triggered):  

  1. **Existence & Genre Honesty**  
     - *Question*: Does the text transparently signal its genre (e.g., hagiography, authorized bio, memoir)? If subject is historical, is existence corroborated by non-hagiographic/partisan sources?  
     - *Threshold*: Reject if (a) existence unverifiable *and* text claims historicity, *or* (b) genre is obscured (e.g., legend presented as fact).  
     - *Judgment Flag*: Graduate students assess using standard references (e.g., Oxford Classical Dictionary, Martyrologies). Committee chair resolves ambiguities.  

  2. **Admiration Mechanics**  
     - *Question*: Does the text solicit uncritical admiration? If yes, is admiration *necessary* for the nominated teaching purpose?  
     - *Threshold*: Reject if admiration is irretrievable (per exemplar theory: flaws are unacknowledged or dismissed).  
     - *Judgment Flag*: Grad students identify admiration triggers (e.g., rhetoric, omission of faults); chair evaluates retrievability.  

  3. **Treatment of Faults** (Plutarch’s Malice Test)  
     - *Question*: Are faults acknowledged? If omitted, is silence (a) *prudent* (per Plutarch’s "regard for human nature"), or (b) *malicious* (whitewashing)?  
     - *Threshold*: Reject if faults are suppressed to manipulate admiration *and* text is nominated for mirror/template use.  
     - *Silence Rule*: Silence is evidence only if fault is widely attested elsewhere. Prudent omission permitted for caution/criticism modes.  

  4. **Micro-Actions vs. Macro-Deeds** (Plutarch’s Mirror Test)  
     - *Question*: Does the text emphasize trivial incidents (remarks, jests) over grand deeds?  
     - *Threshold*: Reject if *only* grand deeds are presented *and* nominated for mirror/template use (fails character evidence test).  

  5. **Exemplar Categorization**  
     - *Assign Modes*:  
       - **Template**: Only if subject’s conduct is consistently admirable *and* faults are pedagogically navigable.  
       - **Mirror**: If micro-actions reveal complex character for self-reflection.  
       - **Caution**: If faults illustrate moral risks (Plutarch’s "human unmixed" principle).  
       - **Criticism**: If solicited admiration requires deconstruction (e.g., hagiography, partisan bio).  
     - *Forbid Modes*: Template forbidden if faults are grave/unacknowledged; Mirror forbidden if admiration is manipulative.  

  6. **Withdrawal Rule** (For existing texts):  
     - Trigger if new evidence: (a) disproves existence, (b) exposes malicious fault-suppression, or (c) shows persistent misuse in teaching.  

  7. **Documentation** (2–3 sentences for library entry):  
     - State permitted teaching modes, key moral focus (e.g., "ambition vs. loyalty"), and critical cautions (e.g., "legendary tropes present").  

  ---

  ### **Application to Nominations**  
  **1. Plutarch’s *Life of Alcibiades***  
  - *Existence & Genre*: Historical, genre honest (biography). PASS.  
  - *Admiration*: Solicits admiration for brilliance; faults (treason, sacrilege) are acknowledged but framed as "tragic waste." Admiration retrievable via criticism. PASS.  
  - *Faults*: Faults explicit; no suppression. Silence rule N/A. PASS.  
  - *Micro-Actions*: Jests, seductions, and quirks reveal character (e.g., mutilating Hermae). PASS.  
  - *Exemplar Categorization*:  
    - **Permitted**: Caution (ambition’s perils), Criticism (interrogate charismatic appeal).  
    - **Forbidden**: Mirror (self-comparison too ambiguous), Template (conduct condemnable).  
  - *Verdict*: **ADMIT** for Caution/Criticism only.  
  - *Entry*: "Teach as cautionary tale of talent corrupted by ambition; interrogate Plutarch’s lament over wasted virtue. Forbidden as template for emulation."  
  - *What would change verdict*: If Alcibiades’ faults were minimized (e.g., treason justified), reject for Template risk.  

  **2. 9th-C *Vita of Desert Ascetic***  
  - *Existence & Genre*: Subject uncorroborated; text uses hagiographic topoi (childhood miracles, posthumous wonders). Genre honest as *vita*. PASS.  
  - *Admiration*: Solicits devotion through legend (e.g., levitation, fasting miracles). Irretrievable for emulation. PASS for Criticism.  
  - *Faults*: None recorded; silence prudent (hagiographic convention). PASS.  
  - *Micro-Actions*: Absent; only supernatural deeds. FAILS Plutarch’s test.  
  - *Exemplar Categorization*:  
    - **Permitted**: Criticism (deconstruct hagiographic tropes).  
    - **Forbidden**: Mirror, Template, Caution (no plausible character evidence).  
  - *Verdict*: **ADMIT** for Criticism only.  
  - *Entry*: "Use to analyze hagiographic conventions; existence uncorroborated. Forbidden as template for self-denial or moral mirror."  
  - *What would change verdict*: If vita included mundane details (e.g., daily struggles), admit for Mirror with Criticism.  

  **3. Authorized Biography of 20th-C Statesman**  
  - *Existence & Genre*: Historical, but genre obscured (marketed as objective; exclusive access compromises independence). FAIL (malicious omission risk).  
  - *Admiration*: Certain (family author); likely irretrievable due to suppressed faults.  
  - *Faults*: Omission probable (e.g., scandals excluded per access agreement). Silence malicious per Plutarch. REJECT at Step 3.  
  - *Verdict*: **REJECT**.  
  - *What would change verdict*: If bio included critical archives (e.g., opposition letters), admit for Criticism with Caution.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Misfires**:  
     - May reject nuanced texts with *intentional* irony (e.g., satirical lives).  
     - "Admiration retrievability" is probabilistic; grad students may misjudge.  

  2. **Judgment Calls Disguised as Criteria**:  
     - Step 2 (Admiration Mechanics): "Irretrievable" hinges on chair’s view of pedagogical salvageability.  
     - Step 3 (Malice Test): Distinguishing "prudent" vs. "malicious" omission requires historical expertise.  

  3. **Omissions**:  
     - Cannot assess literary merit or cultural significance beyond moral pedagogy.  
     - Ignores student demographics (e.g., trauma triggers in cautionary texts).  
     - Fails on non-Western lives (procedure based on Plutarch/hagiography).  

  4. **Structural Limits**:  
     - Assumes committee can detect genre conventions; may fail on obscure formats.  
     - Withdrawal rule reactive, not preventive (relies on post-admission scrutiny).  

  **Most Likely Failure Point**: Step 2 (Admiration Mechanics). Grad students may miss subtle admiration cues (e.g., rhetorical flourishes) or overestimate corrigibility.  

  **Conclusion**: The procedure *can* be operationalized but remains value-laden. It mitigates (not eliminates) arbitrariness by forcing explicit justifications, forbidding high-risk modes, and flagging chair judgments. It succeeds not by eliminating taste, but by disciplining it through tradition-derived constraints.  

  Would you like refinements to specific steps?
