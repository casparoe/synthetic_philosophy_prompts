prompt: |-
  Next month I run a single 75-minute session for an interdisciplinary graduate cohort — philosophy, economics, and public policy — on the Pasadena paradox and, more generally, on decision problems whose expected value is undefined rather than merely enormous. Everyone in the room has had one term of expected-utility theory: they can compute an expectation as a probability-weighted sum, they have met the St. Petersburg game and the diminishing-marginal-utility reply to it, and they know from first-year calculus that some infinite series converge while others diverge. They have never met conditional convergence or the rearrangement theorem, and they have no measure theory. I want a plan for the session, not the session itself — please do not explain the Pasadena game to me.

  The carrier will be the coin-flip gamble that pays plus or minus 2^n/n dollars, with the sign alternating, when heads first appears on the nth toss, so that its expectation series is the alternating harmonic series; alongside it goes the cousin gamble that dominates it state by state. Build the plan around the following decisions:

  1. The dependency structure, with a minutes budget for each step. In particular, tell me where the mathematical detour goes: conditional convergence and the order-dependence of the sum must be installed at some point, and if I front-load it I lose the room, while if I save it for the end the gamble looks like a conjuring trick performed on them. Give me your recommendation and the reason, stated in terms of what later steps depend on it.
  2. Whether the Pasadena game is itself the right carrier or whether something smaller has to carry the first twenty minutes. Say precisely what the carrier must have (unbounded payoffs of both signs, an expectation series that converges but not absolutely) and what it must lack, and why the tempting substitutes fail — a finite capped version, the plain St. Petersburg game presented as though it raised the same problem, and a case in which the expectation is missing because the outcomes are not commensurable rather than because the series misbehaves.
  3. A map of the misconceptions, each with the step at which it is headed off and the cost of deferring it. I expect at least these: that this is St. Petersburg with minus signs and therefore nothing new; that the expectation is ln 2 and so nothing is wrong; that truncating the series at some large n is a legitimate repair; that the order-dependence complaint is a cheat because a gamble has no ordering of its states; that undefined expectation is an impressive name for very risky; and that a bounded utility function dissolves everything. On that last one, tell me where it belongs given that it is true — with bounded utility the probability weights alone guarantee absolute convergence — but that I want them to feel the price rather than be told it.
  4. What the dominating cousin does that Pasadena alone cannot do, and at which step it should be introduced: before the first proposed repair, so the repair is born under pressure, or after, so the repair gets a fair hearing first. Take a position.
  5. One closing question or short task that would show me the idea landed, together with the specific wrong answer that would show it did not — as distinct from a merely clumsy answer.
  6. What I should refuse to cover at this level and say so out loud: the proof of the rearrangement theorem, expectation as a Lebesgue integral, finitely additive extensions and other technical repairs, relative expected utility, imprecise probabilities. For each, give me the honest one-sentence placeholder that does not pretend the topic is nonexistent.

  Deliver the plan as a single valid JSON object with exactly these fields:

  - "sequencing_thesis": two or three sentences naming the one sequencing decision the whole session turns on and why.
  - "relied_on_prior_knowledge": array of strings, each stating one piece of the cohort's background that a specified step actually uses.
  - "sequence": array of objects with "step" (integer), "minutes" (integer, summing to 75 across all steps), "component" (the idea being installed), "depends_on" (array of earlier step numbers), "why_not_earlier" (what breaks if this step is moved up), "board_at_end" (what is written on the board when the step ends), and "defuses" (array of misconception labels handled here, possibly empty).
  - "carrying_example": object with "name", "statement" (the exact way I say it aloud), "must_have" (array), "must_lack" (array), and "rejected_alternatives" (array of objects with "alternative" and "why_it_fails").
  - "misconceptions": array of objects with "label", "why_predictable", "defused_at_step" (integer), "defusing_move", and "cost_of_deferring".
  - "dominating_cousin": object with "position" (step number), "work_it_does", and "reason_for_position".
  - "omissions": array of objects with "topic", "why_out", and "placeholder_line".
  - "comprehension_check": object with "task", "answer_that_shows_it_landed", "answer_that_shows_it_did_not", and "what_the_failure_diagnoses".

  Write every value as a full phrase or sentence rather than a keyword list, and give me no bibliography: no paper titles, no author attributions, no dates I would have to look up.
reasoning: |-
  We are building a plan for a 75-minute session on the Pasadena paradox and decision problems with undefined expected value. The cohort has one term of expected-utility theory, knows the St. Petersburg game, and basic calculus (convergent/divergent series) but no measure theory, conditional convergence, or rearrangement theorem.

  The main example is the Pasadena game: a coin flip gamble that pays (+1)^n * 2^n / n dollars when the first heads appears on the nth toss. The expectation is the alternating harmonic series: sum_{n=1}^{∞} (-1)^{n+1} / n, which converges conditionally to ln(2) but not absolutely. We also have a dominating cousin: a gamble that pays (2^n)/n (always positive) for the same event, which has expectation sum 1/n (harmonic series) that diverges.

  The plan must address:

  1. Sequencing: When to introduce the conditional convergence detour? We must install it without front-loading (losing the room) or making it seem like a trick at the end. I recommend introducing it after presenting the gamble and computing the expectation naively, but before discussing repairs. This way, the mathematical issue is established and then the repair attempts (like truncation) are seen in light of this.

  2. Carrier example: Why the Pasadena game and not a capped version, St. Petersburg, or incommensurable outcomes? It must have: unbounded payoffs of both signs, conditionally convergent expectation series (converges but not absolutely). It must lack: a finite cap (which would make the expectation well-defined), and the problem must be due to the series misbehaving (non-absolute convergence) rather than non-commensurability.

  3. Misconceptions: We list several and when to defuse them.

  4. Dominating cousin: Introduce it after the first repair attempt (truncation) to show that truncation doesn't work because the cousin dominates and has divergent expectation, so the repair is inadequate.

  5. Comprehension check: A task that reveals if they understood, and a wrong answer that shows failure.

  6. Omissions: Topics to skip and a one-sentence placeholder for each.

  Now, let's outline the sequence of steps:

  Total: 75 minutes.

  Step 1 (5 min): Introduce the Pasadena gamble. State the rules and write the payoffs. Make sure they see the alternating signs and increasing magnitude.

  Step 2 (10 min): Compute the expectation naively. Write the series: 1 - 1/2 + 1/3 - 1/4 + ... and note it converges to ln(2). Then ask: is this the expectation? (This sets up the problem.)

  Step 3 (15 min): Mathematical detour on conditional convergence. Explain that the series converges conditionally, meaning that rearranging the terms can change the sum. Demonstrate with a rearrangement (e.g., one positive and two negatives) that the sum can be made to converge to a different value or diverge. This step is crucial because the expectation is undefined. Why not earlier? We need the series to be present so they see the problem in context. If done too early, it's abstract and unmotivated.

  Step 4 (10 min): First repair attempt: truncation. Someone suggests ignoring very large n. Compute the expectation for n<=N. Then note that as N increases, it approaches ln(2). But then introduce the cousin gamble: the same event but always positive payoff of 2^n/n. Its expectation is the harmonic series (diverges). Point out that the cousin gamble dominates the Pasadena game (state by state, the cousin pays at least as much and sometimes more). Therefore, if we truncate the cousin, we get a finite expectation, but the original cousin has infinite expectation. So truncating the Pasadena game doesn't capture the risk because the cousin, which is better, is infinitely bad? Actually, the cousin has undefined expectation in the sense that it diverges to infinity? But wait, the cousin's series is the harmonic series which diverges to infinity. The problem is that the truncated cousin has expectation that grows without bound as N increases, so we cannot assign a finite value. But for the Pasadena, the truncated expectation approaches ln(2), but the rearrangement issue remains. The key point: truncation doesn't resolve the fact that the expectation is order-dependent.

  Step 5 (10 min): Discuss the implications: the expectation is undefined. We cannot assign a single number. So how do we decide? This leads to the idea that without a defined expectation, expected utility theory breaks.

  Step 6 (10 min): Address the bounded utility response. They know that bounded utility solves St. Petersburg. Explain that with bounded utility, the series becomes absolutely convergent because the terms are bounded by a convergent series (by the boundedness). So the problem goes away. But the price: we must bound utility arbitrarily, which might be unrealistic. Let them feel the price: we are forced to assume that no matter how much money, an extra dollar adds at most a fixed amount to utility, which might not reflect true preferences.

  Step 7 (10 min): Recap and broader view. What other repairs exist? (We omit technical ones.) Emphasize that the problem is real: when payoffs are unbounded and of both signs, we can have undefined expectation even when the series converges conditionally.

  Step 8 (5 min): Comprehension check: Task: "Consider a gamble that pays 1/n if the first heads is on an odd toss and -1/n if on an even toss. Does it have a defined expectation?" 
  - Correct answer: No, because the series is conditionally convergent (alternating harmonic without the 2^n factor, but same convergence issue). 
  - Wrong answer: Yes, because it converges to ln(2). (This shows they missed the rearrangement issue.)

