  ### Thomson's Lamp In-Class Activity: Design and Implementation  
  **Goal:** Students confront the paradox by experiencing the limitations of finite simulations and the underdetermination of the endpoint state. They commit to an answer for the lamp at \( t = 60 \) seconds after an infinite series of halving intervals, exposing flaws in both "it's off" (last-flip reasoning) and "neither" (evasive infinity) answers.  

  **Materials (Per Group of 4 Students):**  
  - **Lamp simulator:** A physical switch (or button) + a light (LED) or a tablet app that toggles a virtual lamp. *No real lamp needed if impractical; use paper "ON/OFF" cards as a backup.*  
  - **Timer:** Stopwatch app on a phone/tablet (set to count down intervals).  
  - **Data log:** Printed table (see below) for recording flips.  
  - **Prediction slips:** Small cards for final commitments.  
  - **Group tokens:** 5 poker chips/colored paper clips per group (for betting, no real money).  

  **Stipulation to Close "Physical Impossibility" Escape Hatch:**  
  > *"This is a thought experiment. We assume:  
  > - The lamp toggles instantly with no delay.  
  > - Time intervals can be divided perfectly.  
  > - We care only about logical consistency, not engineering.  
  > If physics feels like a cheat, remember: we're doing metaphysics—exploring what the rules imply."*  
  **Reinforce upfront:** This avoids dismissal and focuses on the paradox.  

  ---  

  ### Activity Rules & Timeline (75 Minutes Total)  
  **Phase 1: Setup & Finite Simulation (20 Minutes)**  
  - **0:00–0:10** (10 min): Introduce Thomson’s lamp.  
    - Lamp starts **ON** at \( t = 0 \).  
    - Flips occur at intervals halving each time:  
      - First flip: \( t = 30 \)s (lamp OFF)  
      - Second flip: \( t = 45 \)s (lamp ON)  
      - Third flip: \( t = 52.5 \)s (lamp OFF)  
      - ... continue halving intervals until \( t = 60 \)s is reached.  
    - **Question:** "What is the lamp’s state at exactly \( t = 60 \)s if we do *infinitely many flips*?"  
  - **0:10–0:20** (10 min): **Group simulation (6 flips)**.  
    - Groups run the timer for 6 flips (times: 30s, 15s, 7.5s, 3.75s, 1.875s, 0.9375s).  
    - Record data in a table:  

      | Step | Time (s) | Lamp State After Flip |  
      |------|----------|-----------------------|  
      | 1    | 30       | OFF                   |  
      | 2    | 45       | ON                    |  
      | 3    | 52.5     | OFF                   |  
      | 4    | 56.25    | ON                    |  
      | 5    | 58.125   | OFF                   |  
      | 6    | 59.0625  | ON                    |  

    - **At \( t = 60 \)s (finite case):** Lamp is ON (no flip between 59.0625s and 60s).  

  **Phase 2: Infinite Extrapolation & Commitment (20 Minutes)**  
  - **0:20–0:30** (10 min): **Group discussion on the infinite case.**  
    - *Prompt:* "Assume we do *infinitely many flips* (step 7 at 59.53125s, step 8 at 59.765625s, etc.). What is the lamp’s state at exactly \( t = 60 \)s? Why?"  
    - **Critical twist:** Assign *contradictory priming* to groups:  
      - **Half the groups (A):** "Focus on the pattern: the lamp alternates with each flip. After infinite flips, it must be OFF because the last flip (if there was one) would turn it off."  
      - **Other groups (B):** "Focus on the time: at \( t = 60 \)s, the lamp has been flipped infinitely many times. Infinity is weird—maybe it’s neither ON nor OFF."  
  - **0:30–0:40** (10 min): **Commit with stakes.**  
    - Each student writes privately on a prediction slip:  
      - **Answer:** ON, OFF, or NEITHER.  
      - **Reason:** 1-sentence explanation.  
    - **Betting:** Each group bets **2 tokens** (of 5 total) on their collective answer.  
      - *Mechanic:* Groups debate internally, then place tokens in one of three boxes (ON/OFF/NEITHER).  
      - *Scoring:* If correct, groups win +2 tokens (total 7). If wrong, lose bet (total 3). "Correctness" will be resolved in debrief.  

  **Phase 3: Group Reports & Contradiction (15 Minutes)**  
  - **0:40–0:45** (5 min): **Report finite-state agreement.**  
    - All groups confirm: at \( t = 60 \)s with 6 flips, lamp is ON.  
  - **0:45–0:55** (10 min): **Reveal infinite predictions.**  
    - Groups share answers/reasons. **Prime-induced split emerges:**  
      - Group A (last-flip): "OFF."  
      - Group B (infinity-weirdness): "NEITHER."  
    - **Logs comparison:** Show two groups (one A, one B) with *identical simulation logs* (same times/states). Highlight:  
      - Same data → opposite predictions.  
      - *"If the data we collected can't force one answer, what's missing?"*  

  **Phase 4: Debrief & Paradox Mapping (20 Minutes)**  
  - **0:55–1:05** (10 min): **Why both answers fail.**  
    - **Problem 1: No limit to the sequence.**  
      - *Activity link:* "In your simulation, the lamp oscillated: ON → OFF → ON → OFF... What happens as steps approach infinity? It oscillates forever—no stable limit. Saying 'OFF' (last-flip) assumes a final flip, but infinity has no last step. Saying 'NEITHER' waves hands at infinity but doesn't resolve the contradiction."  
      - *Thomson's point:* The sequence {ON, OFF, ON, OFF, ...} has no limit.  
    - **Problem 2: Endpoint underdetermination.**  
      - *Activity link:* "Your logs describe times *before* 60s. At 60s itself, the rules say nothing. The supertask only defines states *at* flip times (all <60s). After 6 flips, we said the lamp is ON at 60s—but that relied on *stopping*. In the infinite case, we never stop, so we can't borrow state from the last flip."  
      - *Thomson's point:* The supertask fails to specify the state at \( t = 60 \)s.  
  - **1:05–1:15** (10 min): **Resolve bets and conclude.**  
    - **Bet resolution:** "No answer is 'correct'—the question is ill-posed! The finite data can't fix the infinite case, and the rules don't define the endpoint. All groups keep their tokens (no penalty), but NEITHER wins by default because ON/OFF require unjustified assumptions."  
    - **Key takeaway:**  
      - The paradox arises because:  
        1. The sequence doesn’t converge (no limit).  
        2. The supertask is silent about the endpoint (underdetermination).  
      - "Infinity" alone doesn’t solve it—we must admit the description is incomplete.  

  ---  

  ### What Breaks the First Time (and Fixes)  
  1. **"We can't flip fast enough!"**  
     - **Fix:** Reiterate stipulation upfront. Ask: "If we *could* flip instantly, does the logic hold?" Redirect to the data log (times/states) as the only evidence.  

  2. **Groups rush to "NEITHER" to avoid risk.**  
     - **Fix:** Priming (Group A/B) forces engagement with flawed reasoning. Betting tokens (not points) lowers stakes while incentivizing commitment.  

  3. **Finite simulation feels irrelevant to infinity.**  
     - **Fix:** Explicitly contrast finite endpoint (determined) vs. infinite (underdetermined) in debrief. Ask: "Why could we say 'ON' at 60s after 6 flips? What changed for infinity?"  

  4. **Token betting distracts.**  
     - **Fix:** Use quick, physical tokens (chips/paper clips). Focus discussion on reasons, not scores.  

  ### What the Activity Can't Replicate (Supply in Debrief)  
  - **The supertask as a limit of finite tasks:** Students simulate finitely, but the infinite case must be *reasoned* about. Explicitly say:  
    > "Thomson’s lamp is defined as the *limit* of finite flips. But the limit of the states (ON, OFF, ON, ...) doesn’t exist—it diverges. And limits of *processes* don’t always commute: the state at the endpoint isn’t determined by prior states. You have to see this mathematically; no experiment can show it."  

  - **Non-uniqueness of endpoint:** Stress:  
    > "We could add a rule like 'lamp is ON at 60s' without contradicting the flips. That’s how underdetermined this is!"  

  ---  
  **Why This Works:**  
  - Students hit the wall by seeing their own reasoning (primed to fail) clash with identical data.  
  - Tokens + private commits make stakes tangible without money.  
  - The debrief directly maps activity moments to Thomson’s two problems, forcing metacognition.  
  - You become a facilitator of "discovery," not a lecturer of "answers."
