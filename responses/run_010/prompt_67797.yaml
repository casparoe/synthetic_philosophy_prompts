  Now, we sort the disanalogies by importance for emulation:

  1. **Hybrid system**: If the brain is not purely digital but has analog components, then a purely digital emulation might miss essential features. This is critical for the emulation argument.

  2. **Nature of computation**: If the brain is using a different kind of calculus (not standard mathematics), then we might not know how to program an emulation without first understanding that calculus. This is also critical.

  3. **Precision of components**: The low precision and the way reliability is achieved (statistically) might require a different approach to emulation (e.g., simulating every neuron and synapse in detail) which is computationally expensive and not straightforward.

  4. **Memory organization**: The von Neumann bottleneck (separate memory and processing) is a known limitation. The brain's architecture is more efficient for certain tasks. Emulating the brain on a von Neumann machine might be inefficient, but not impossible. However, the friend's argument relies on the brain being a computer in the same sense, and this architectural difference is a challenge.

  5. **Memory capacity and reuse**: The small capacity estimate (if correct) might be a surprise, but it doesn't directly break emulation. It just means the brain is efficient. However, the dynamic nature of memory might be hard to model.

  6. **Binary elements**: This is partial and often overstated. The friend uses it to say the brain is digital, but the analog aspects break it.

  The emulation conclusion might survive if we can overcome these disanalogies (e.g., by simulating the analog parts digitally at a high enough resolution). However, von Neumann's own analysis suggests that the brain is not a standard digital computer and that emulation would require solving significant engineering challenges that are not trivial. The friend's argument that it's just an engineering problem (not metaphysics) might hold in principle, but the engineering might be much harder than implied because of these disanalogies.

  Now, the equivocations:

  The word "computer" or "computation" can slide between:

  1. **Trivial sense**: Any physical system can be said to "compute" its next state (like a rock falling computes its trajectory). In this sense, the brain is a computer.

  2. **Strong sense**: A system that is programmable, uses discrete states, and can run algorithms. This is what we typically mean by a computer and what is required for emulation (so that we can program an emulator to mimic the brain).

  The friend seems to be using the trivial sense to establish that the brain is a computer and then sliding to the strong sense to imply that we can emulate it by programming a computer. But von Neumann's book notes that the brain's "computation" is in a different, non-standard form, which might not fit the strong sense.

