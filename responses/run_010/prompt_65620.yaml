answer: |-
  ### Brainstorming: Axes of Disagreement on Reflection  
  Reflection’s plausibility fractures along these dimensions:  
  1. **Source of Change**: Is the future shift driven by *new evidence* or by *cognitive degradation* (e.g., fatigue, bias)?  
  2. **Knowledge Retention**: Will the future self retain *all current evidence*, or could they *lose* critical knowledge?  
  3. **Target Norm**: Does Reflection bind *belief states* (credences) or *practical commitments* (betting dispositions/plans)?  
  4. **Derivation**: Is Reflection *primitive* (a bedrock norm) or *derived* from conditionalization + diachronic coherence?  
  5. **Judgment Authority**: Is the future self *epistemically superior* (e.g., better informed) or *inferior* (e.g., impaired)?  

  These axes generate distinct positions. For example:  
  - **Unconditional Reflection** ignores source/retention.  
  - **Information-Monotone Reflection** requires future self to have *at least* current knowledge.  
  - **Source-Based Reflection** rejects deference if change stems from irrational processes.  
  - **Planning Norm** applies Reflection *only* to precommitments (e.g., contracts).  

  ---

  ### Sorting Quiz: "Future Self Credence Scenarios"  
  *Instructions: For each scenario, assume you currently hold credence **C** in proposition **P**. Your future self at time **T** will hold credence **D** in **P**. State your *current* credence in **P** or your wager (if applicable).*  

  1. **More Data**:  
     *T* will review all evidence you possess today, plus new data from an ongoing experiment. You expect *T*’s credence in *P* to be 0.8.  
     Your current credence is 0.5.  
     → (A) Raise to 0.8 now  
     → (B) Stay at 0.5  
     → (C) Raise partially (e.g., to 0.65)  

  2. **Night Shift Exhaustion**:  
     *T* is you after 24 hours without sleep. Sleep deprivation reliably makes people overly optimistic. You expect *T*’s credence in *P* to be 0.9. Your current well-rested credence is 0.6.  
     → (A) Adopt 0.9 now  
     → (B) Keep 0.6  
     → (C) Lower below 0.6 (e.g., 0.55)  

  3. **Forgotten Evidence**:  
     *T* will have forgotten a key fact that now supports *P* for you. You expect *T*’s credence to be 0.3. Your current credence (with the fact) is 0.7.  
     → (A) Lower to 0.3  
     → (B) Keep 0.7  
     → (C) Lower partially (e.g., 0.5)  

  4. **The Persuasive Fallacy**:  
     *T* will encounter a charismatic speaker pushing a flawed argument for *P*. You recognize the flaws now, but expect *T* will be convinced and hold credence 0.95. Your current credence is 0.4.  
     → (A) Adopt 0.95  
     → (B) Keep 0.4  
     → (C) Adjust slightly toward 0.95 (e.g., 0.5)  

  5. **Betting Commitment**:  
     You must *now* set odds for a bet on *P* that will be settled at *T*. You expect *T*’s credence to be 0.75. Your current credence is 0.6.  
     → (A) Set betting odds for *P* at 0.75  
     → (B) Set odds at 0.6  
     → (C) Set odds between (e.g., 0.65)  

  6. **Medical Prognosis Shift**:  
     *T* is you after new medical tests. You expect *T*’s credence in *P* ("recovery likely") to be 0.7. Your current credence (without tests) is 0.5.  
     → (A) Adopt 0.7  
     → (B) Keep 0.5  
     → (C) Wait for the tests  

  7. **Hypothetical Argument**:  
     *T* will study a novel argument for *P* that you haven’t seen yet. You expect *T*’s credence to be 0.85. Your current credence is 0.3.  
     → (A) Adopt 0.85  
     → (B) Keep 0.3  
     → (C) Suspend judgment until you see the argument  

  8. **Aging and Conservatism**:  
     *T* is you at age 90; aging makes you more skeptical of new theories. You expect *T*’s credence in *P* (a new theory) to be 0.2. Your current credence is 0.6.  
     → (A) Lower to 0.2  
     → (B) Keep 0.6  
     → (C) Lower modestly (e.g., 0.5)  

  9. **Ulysses’ Sobriety Pact**:  
     *T* is future-you after taking a drug that makes you crave danger. You expect *T* to assign high credence (0.9) to *P* ("skydiving is safe"). Your current sober credence is 0.4. You *now* precommit to declining skydiving invitations.  
     → (A) Adopt 0.9 credence *and* drop the precommitment  
     → (B) Keep 0.4 credence *and* the precommitment  
     → (C) Keep 0.4 credence *but enforce* the precommitment  

  10. **Disagreement with Past Self**:  
      *T* is you in 10 years. You now expect that at *T*, you’ll look back at your *current* credence of 0.7 in *P* and deem it mistaken, holding 0.3 instead.  
      → (A) Lower to 0.3  
      → (B) Keep 0.7  
      → (C) Adjust modestly (e.g., 0.6)  

  ---

  ### Scoring Key: Mapping Answers to Positions  
  *(Patterns: Count selections of A/B/C across scenarios. Dominant trends map to views.)*  

  | **Position** | **Defining Feature** | **Answer Pattern** | **Notes** |
  |--------------|----------------------|-------------------|-----------|
  | **Unconditional Reflection** | Defers regardless of source/change | **A** in *all* scenarios (including 2,3,4,8). | Van Fraassen’s original principle. |
  | **Derivative via Conditionalization** | Only defers if shift aligns with expected evidence | **A** in 1,6,7; **B** in 2,3,4,8. **C** in 5 if odds reflect current credence. | Collapses if conditionalization is doubted. |
  | **Information-Monotone** | Defers only if future self has ≥ current information | **A** in 1,6,7; **B** in 3; **A/B** in 2,4,8 if impairment deemed irrelevant. | Rejects deference in "Forgotten Evidence" (3). |
  | **Source-Based Restriction** | Rejects deference if change stems from irrationality | **B** in 2,4,8; **A** in 1,6,7. **C** in 3 if partial adjustment. | Distinguishes rational/irrational causes (e.g., Scenario 4 vs. 7). |
  | **Planning Norm Only** | Binds commitments (bets/precommitments), not beliefs | **A** in 5; **B** in all belief scenarios (1-4,6-8,10); **C** in 9. | Accepts precommitment in Ulysses case (9C). |
  | **Flat Rejection** | No obligation to defer to future selves | **B** in *all* scenarios. | Treats future selves as external advisors. |
  | **Deflationary Betting Constraint** | Reflection *only* governs wagers | **A** in 5; **B** elsewhere. | Silent on belief adjustment. |

  #### Unoccupied Positions & Gaps:  
  - **Primitive + Non-Source-Based**: No one holds "defer even to impaired selves" as fundamental. *Why*: Incoherent if judgment degradation is acknowledged.  
  - **Derived + Blind to Knowledge Loss**: Expecting *T* to know less *now* violates conditionalization. *Why*: Unexplored/unattractive.  

  #### Indistinguishable Positions:  
  1. **Derivative vs. Information-Monotone**: Both yield **A** in 1,6,7 and **B** in 3.  
     - *Separator Item*: Add a scenario where *T* gains *misleading* evidence you expect to be deceptive.  
       - *Derivative*: Defers (if conditionalization requires it).  
       - *Information-Monotone*: Rejects deference (future knows more but is misled).  

  2. **Source-Based vs. Deflationary**: Both may say **B** in belief scenarios and **A** in betting (5).  
     - *Separator Item*: A scenario where *T*’s shift is caused by irrational bias but you must precommit to *act* on *T*’s credence.  
       - *Source-Based*: Rejects adjusting action (due to bias).  
       - *Deflationary*: Accepts precommitment to *T*’s credence.  

  This instrument isolates intuitions about temporal deference, bypassing jargon to reveal fault lines in diachronic rationality. For your group: Compare answer clusters to spark debate on *why* cases feel different—e.g., whether forgetting evidence severs epistemic authority.
