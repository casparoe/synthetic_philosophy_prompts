  - \(U(SD, A) = 1\) (lives)  
  - \(U(GA, D) = 1\) (lives)  
  - \(U(GA, A) = 0\) (dies)  
  **Joint Distribution**:  
  - Predictor accuracy: 0.9.  
  - If agent would choose \(SD\), predictor says \(E_{SD}\) with prob 0.9.  
  - If agent would choose \(GA\), predictor says \(E_{GA}\) with prob 0.9.  
  - Death’s location = predictor’s forecast (state = evidence).  

  **Ex Ante EU(decide now)**:  
  - If choose \(SD\):  
    - Predictor says \(E_{SD}\) (prob 0.9), so Death in \(D\): utility 0.  
    - Predictor says \(E_{GA}\) (prob 0.1), so Death in \(A\): utility 1.  
    - EU = \(0.9 \times 0 + 0.1 \times 1 = 0.1\).  
  - If choose \(GA\):  
    - EU = \(0.1 \times 1 + 0.9 \times 0 = 0.1\) (symmetry).  
  - **EU(decide now) = 0.1**.  

  **Ex Ante EU(look then decide)**:  
  - Suppose agent’s policy: if \(E_{SD}\), choose \(GA\); if \(E_{GA}\), choose \(SD\) (to avoid prediction).  
