   One known example is in the context of evidential decision theory and a medical condition.

   Here's an example: 

   There is a state S: the agent has a disease (D) or not (H). Prior: P(D)=0.5.
   There is a test for the disease that is 90% accurate: 
     P(test_pos|D) = 0.9, P(test_neg|D) = 0.1
     P(test_neg|H) = 0.9, P(test_pos|H) = 0.1

   The agent has two acts: 
     A: take a treatment that is effective if she has the disease, but has a side effect if she doesn't.
     B: do nothing.

   Utilities:
     If she has the disease and takes A: utility 1 (cured with no side effect because she has the disease)
     If she has the disease and takes B: utility 0 (not cured)
     If she is healthy and takes A: utility 0 (side effect)
     If she is healthy and takes B: utility 1 (fine)

   This is the standard case. Now, normally, the test is worth taking because it helps her decide.

   But now, we add a twist: the test also measures the agent's inclination to take the treatment. Specifically, the test result is not only based on the disease but also on whether the agent is inclined to take the treatment. This is the idea of a "psychological" test.

   How? Let's assume that the agent's inclination to take the treatment is correlated with the disease. For example, people with the disease are more likely to be inclined to take the treatment.

   But then the test result is affected by the disease and by the agent's inclination.

   Let I be the agent's inclination: I= A or B (whether she is inclined to choose A or B). The agent's actual choice might be based on the test result, but the inclination is there before the test.

   We assume that the test result is determined by the disease and the inclination. For example, the test might be more likely to be positive if the agent has the disease or if she is inclined to take the treatment.

   Specifically, we can define:

   P(D) = 0.5.

   The inclination I is distributed as:
     P(I=A|D) = 0.9, P(I=B|D) = 0.1
     P(I=A|H) = 0.1, P(I=B|H) = 0.9

   Then the test result (evidence) E is either POS or NEG.

   We define:
     P(E=POS | D, I) = 0.9, regardless of I.
     P(E=POS | H, I) = 0.1, regardless of I.

   But then the test result is independent of I, and we are back to the standard case.

   To make it dependent on I, we can:
     P(E=POS | D, I=A) = 0.99
     P(E=POS | D, I=B) = 0.5
     etc.

