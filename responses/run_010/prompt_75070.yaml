  The objection I’d press: "If the agent is a Bayesian expected utility maximizer and the evidence is truly free, why wouldn’t she precommit to ignoring it or use mixed strategies to break the correlation? Your example assumes she cannot precommit, but Good’s theorem applies to precommitment strategies." This exposes a deeper issue: the theorem assumes the agent can optimally *use* information, but decision-dependence may require game-theoretic considerations beyond static Bayesianism.

