  ### The Case Against the Ubiquity of Good's Theorem

  #### Thesis
  For a Bayesian expected utility maximizer, costless evidence without side effects is not always worth waiting for, because the standard proof of Good's theorem silently relies on decision-independence—the assumption that the evidence does not depend probabilistically, via the agent's own dispositions, on the act she will choose.

  #### Hidden Assumption
  The unstated hypothesis is **decision-independence**: conditional on the evidence, the agent's posterior distribution over states is invariant to the act chosen. When evidence is *decision-dependent* (e.g., a prediction of the agent's choice), this fails, opening the possibility that free evidence can harm the agent.

  #### Assumptions Audit
  | Assumption                  | Granted in My Case? | Why It Matters |
  |----------------------------|---------------------|----------------|
  | Costless evidence          | Yes                 | Ensures refusal isn't due to costs. |
  | No side effects            | Yes                 | Rules out non-informational harms. |
  | Bayesian updating          | Yes                 | Agent conditions on evidence rationally. |
  | EU maximization            | Yes                 | Standard framework for Good's theorem. |
  | Evidence induces a partition| Yes                 | Standard for value of information. |
  | **Decision-independence**  | **No**              | When violated, the max-then-average vs. average-then-max comparison fails. |

  #### The Case: An Imperfect Prediction Setup
  **Acts**:  
  - \(A\): Bet on State 1.  
  - \(B\): Bet on State 2.  

  **Evidence Cells**:  
  - \(E_A\): Predictor forecasts the agent will choose \(A\).  
  - \(E_B\): Predictor forecasts the agent will choose \(B\).  

  **States of the World**:  
  - \(S_1\): State 1 occurs.  
  - \(S_2\): State 2 occurs.  

  **Joint Distribution**:  
  The predictor is imperfect and knows the agent’s decision tendencies, which are correlated with the state. The joint distribution over states, evidence, and the agent’s act (treated as a random variable from the ex ante perspective) is as follows:  

  - \(P(S_1) = 0.5\), \(P(S_2) = 0.5\).  
  - If \(S_1\), agent chooses \(A\) with prob 0.9, \(B\) with prob 0.1.  
  - If \(S_2\), agent chooses \(A\) with prob 0.1, \(B\) with prob 0.9.  
  - Predictor accuracy: Given the state, the predictor forecasts correctly with probability 0.9.  
    - If \(S_1\), predictor outputs \(E_A\) with prob 0.9, \(E_B\) with prob 0.1.  
    - If \(S_2\), predictor outputs \(E_A\) with prob 0.1, \(E_B\) with prob 0.9.  

  **Joint Probabilities**:  
  - \(P(S_1, E_A, A) = 0.5 \times 0.9 \times 0.9 = 0.405\)  
  - \(P(S_1, E_A, B) = 0.5 \times 0.9 \times 0.1 = 0.045\)  
  - \(P(S_1, E_B, A) = 0.5 \times 0.1 \times 0.9 = 0.045\)  
  - \(P(S_1, E_B, B) = 0.5 \times 0.1 \times 0.1 = 0.005\)  
  - \(P(S_2, E_A, A) = 0.5 \times 0.1 \times 0.1 = 0.005\)  
  - \(P(S_2, E_A, B) = 0.5 \times 0.1 \times 0.9 = 0.045\)  
  - \(P(S_2, E_B, A) = 0.5 \times 0.9 \times 0.1 = 0.045\)  
  - \(P(S_2, E_B, B) = 0.5 \times 0.9 \times 0.9 = 0.405\)  

  **Utilities**:  
  - \(U(A, S_1) = 1\)  
  - \(U(A, S_2) = 0\)  
  - \(U(B, S_1) = 0\)  
  - \(U(B, S_2) = 1\)  

  #### Agent’s Ex Ante Calculations
  **EU of Deciding Now (without evidence)**:  
  - If choose \(A\): \(0.5 \times 1 + 0.5 \times 0 = 0.5\).  
  - If choose \(B\): \(0.5 \times 0 + 0.5 \times 1 = 0.5\).  
  - Indifferent; assume agent chooses \(A\) arbitrarily.  
  - **EU(decide now) = 0.5**.  

  **EU of Looking Then Deciding (with evidence)**:  
  After seeing evidence, the agent updates beliefs *and* the decision-dependence means the posterior weights shift with the act considered (evidential decision theory):  
  - **If \(E_A\) is observed**:  
    - \(P(S_1 \mid E_A, A) = \frac{0.405}{0.405 + 0.005} = 0.988\) (if she plans to choose \(A\))  
      - EU of \(A\): \(0.988 \times 1 + 0.012 \times 0 = 0.988\)  
    - \(P(S_1 \mid E_A, B) = \frac{0.045}{0.045 + 0.045} = 0.5\) (if she plans to choose \(B\))  
      - EU of \(B\): \(0.5 \times 0 + 0.5 \times 1 = 0.5\)  
    - Agent maximizes: chooses \(A\) (0.988 > 0.5).  
  - **If \(E_B\) is observed**:  
    - \(P(S_1 \mid E_B, A) = \frac{0.045}{0.045 + 0.045} = 0.5\)  
      - EU of \(A\): 0.5  
    - \(P(S_1 \mid E_B, B) = \frac{0.005}{0.005 + 0.405} = 0.012\)  
      - EU of \(B\): \(0.012 \times 0 + 0.988 \times 1 = 0.988\)  
    - Agent maximizes: chooses \(B\) (0.988 > 0.5).  
  - **Ex ante EU(look then decide)** = \(P(E_A) \times 0.988 + P(E_B) \times 0.988\)  
    - \(P(E_A) = 0.405 + 0.045 + 0.005 + 0.045 = 0.5\)  
    - \(P(E_B) = 0.045 + 0.005 + 0.045 + 0.405 = 0.5\)  
    - **EU = \(0.5 \times 0.988 + 0.5 \times 0.988 = 0.988\)**.  

