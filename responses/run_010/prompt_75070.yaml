  - **If \(E_A\) is observed**:  
    - \(P(S_1 \mid E_A) = \frac{P(S_1, E_A)}{P(E_A)} = \frac{0.405 + 0.045}{0.5} = 0.9\)  
      - EU of \(A\): \(0.9 \times 1 + 0.1 \times 0 = 0.9\)  
      - EU of \(B\): \(0.9 \times 0 + 0.1 \times 1 = 0.1\)  
    - Agent chooses \(A\) (0.9 > 0.1).  
  - **If \(E_B\) is observed**:  
    - \(P(S_1 \mid E_B) = \frac{0.045 + 0.005}{0.5} = 0.1\)  
      - EU of \(A\): \(0.1 \times 1 + 0.9 \times 0 = 0.1\)  
      - EU of \(B\): \(0.1 \times 0 + 0.9 \times 1 = 0.9\)  
    - Agent chooses \(B\).  
  - **Ex ante EU(look then decide)** = \(0.5 \times 0.9 + 0.5 \times 0.9 = 0.9\).  

  **Agent’s Corrected Preference**:  
  - EU(decide now) = 0.5 < 0.9 = EU(look then decide).  
  - Still, looking is better. This does not demonstrate the thesis. I need a case where the agent, by her own lights, prefers not to look.  

  **Revised Example with Utility Dependence on Evidence**:  
  Introduce a utility cost for matching the prediction (to simulate decision-dependence without ad-hoc probability shifts):  
  - \(U(A, S, E)\) = 1 if \(A\) matches \(S\), plus -10 if \(A\) matches the prediction in \(E\).  
  - Acts, states, evidence as before.  
  - **Decision now**:  
    - If she chooses \(A\), predictor (knowing this) forecasts \(E_A\) with prob 0.9.  
    - EU(A) = \(0.5[0.9(1 - 10) + 0.1(1)] + 0.5[0.9(0 - 10) + 0.1(0)] = 0.5[-8.9] + 0.5[-9] = -8.95\)  
  - **Look then decide**:  
    - Suppose she plans: if \(E_A\), choose \(B\); if \(E_B\), choose \(A\) (to avoid matching).  
    - Predictor knows this, so:  
      - If she would choose \(B\) after \(E_A\), predictor forecasts \(E_B\) (since it forecasts the act).  
      - But if she sees \(E_A\), she chooses \(B\), and if predictor said \(E_A\), she chose \(B\) but predictor said \(A\), so she avoids matching.  
      - This is inconsistent. Assume predictor uses fixed accuracy given the act.  
    - If she sees \(E_A\) and chooses \(B\):  
      - \(P\)(match evidence) = \(P\)(act \(B\) and prediction \(E_B\)) but evidence is \(E_A\), so she doesn't match.  
      - But the predictor’s forecast is fixed, so the evidence is independent of the future act.  
    - This is messy.  

  Given the time, I provide a standard example from the literature: the "Death in Damascus with an Imperfect Predictor".  

  **Revised Case (Death in Damascus Variant)**:  
  **States**: Death is in Damascus (\(D\)) or Aleppo (\(A\)), \(P(D) = 0.5\).  
  **Acts**: Stay in Damascus (\(SD\)) or Go to Aleppo (\(GA\)).  
  **Evidence**: Prediction of agent's choice: \(E_{SD}\) or \(E_{GA}\).  
  **Utilities**:  
