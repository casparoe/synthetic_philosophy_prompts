  #### Proof Step That Fails
  The inequality in Good’s theorem relies on:
  \[
  \max_a \sum_s U(a,s) \cdot P(s|e) \geq \sum_s U(a_e, s) \cdot P(s|e)
  \]
  for each \(e\), where \(a_e\) is the act chosen without evidence. When evidence is decision-dependent, \(P(s|e)\) is not act-invariant. The proof assumes a fixed posterior for all acts, but with decision-dependence, the posterior shifts when conditioning on the act. Thus, the max-then-average assumes a probability distribution that isn’t accessible to the agent when evaluating acts post-evidence.

  #### CDT Reply
  Your colleague is partially correct: causal decision theory (CDT) often *does* restore Good's theorem by severing the correlation between evidence and acts via *interventions*. CDT evaluates acts using probabilities that do not condition on the act, avoiding the shift in posteriors. For example, in the predictor case, CDT would use \(P(s \mid \text{do}(a))\) instead of \(P(s \mid a)\), which is stable. However, CDT can still value information negatively if the evidence causally influences the state (e.g., in a self-fulfilling prophecy). But in cases like the predictor, where evidence is *causally* independent of the state, CDT would value it non-negatively. The flaw is not in evidential decision theory per se, but in the mismatch between the standard Bayesian update and the decision-dependent correlations.

