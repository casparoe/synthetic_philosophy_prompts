  | Y   | -   | A   | -   | -   | N   | Y   | Y   | **Empty**                             | **Incoherent:** N8 requires phenomenal causation, N5=N denies report needs phenomenal cause, N7=Y partially incorporates experience. Contradiction. |
  | N   | -   | -   | -   | N   | -   | -   | N   | **Empty**                             | **Unattractive/Incoherent?:** Denies report mechanism (N5=N) *and* interactionism (N8=N). Leaves only brute coincidence (F) or constitution/PC (D/E), but path to those requires Y at N1/N3/N6/N7. This path leads nowhere plausible. |
  | *   | *   | *   | *   | Y   | *   | *   | Y   | **Empty**                             | **Incoherent:** Can't have physical process *entirely* sufficient (N5=Y) *and* need extra non-physical cause (N8=Y). |
  | Y   | -   | A   | -   | -   | Y   | Y   | *   | **Empty**                             | **Unattractive/Unoccupied:** Acquaintance (N6=Y) and Constitution/PC (N7=Y) are distinct strategies; combining them is redundant/unnecessary. No major position does this. |

  **Indistinguishable Leaf Pairs:**
  *   **A (Illusionism) & B (Neural Tracking)** often arrive via the same path (N1=N, N5=Y). They share the core commitment that reports track physical states, differing on whether there's *anything* phenomenal beyond that tracking. The case studies don't easily distinguish them; deeper metaphysics does.
  *   **D (Constitution) & E (Phenomenal Concepts)** arrive via the same path (N1=Y, N3=A, N6=N, N7=Y). Both leverage the experience being constitutive, differing on *what* it constitutes (the report vehicle vs. the concept used). Concrete cases struggle to split them; the distinction is conceptual/metaphysical.

  **Settled vs. Contested & Popularity:**

  *   **Node 1 (Blindsight):** **Contested Framing.** Experts agree the data is robust. *Disagreement:* Whether the report "I see nothing" reflects *absolutely zero* visual consciousness (vs. degraded, non-reportable awareness). The "No" answer (used here) is common but debated.
  *   **Node 2 (Choice Blindness):** **Settled Framing.** Experts largely agree the phenomenon demonstrates confabulation and lack of transparent access to decision causes. The "No" answer is strongly supported.
  *   **Node 3 (Split-Brain):** **Settled Framing.** The core LH confabulation phenomenon is robust. The "Confab" answer is standard. The "Access" answer is speculative/rare.
  *   **Node 4 (Unattended Pain):** **Contested Framing.** Experts agree on the data (delayed report). *Disagreement:* Whether the delay is due to *unattended experience* or *delayed experience onset*. The framing forces a choice between two live interpretations. Neither is definitively settled.
  *   **Node 5 (Report Mechanism):** **Contested Framing.** The question *assumes* a separation between physical report processes and phenomenal properties. Physicalists (especially illusionists/identity) reject this separation as fundamental. The framing leans towards the epiphenomenalist's dilemma. Experts disagree profoundly on whether this is the right question.
  *   **Node 6 (Acquaintance):** **Contested Framing.** Physicalists often reject the notion of non-propositional, non-functional "acquaintance" as mysterious. Proponents see it as fundamental. Experts disagree on the validity of the concept itself.
  *   **Node 7 (Constitution/PC):** **Contested Framing.** While popular, many philosophers find the idea of experiences being "constituents" of concepts or cognitive states metaphysically obscure or question-begging. Experts disagree on its viability.
  *   **Node 8 (Interactionism):** **Settled Framing (within Physicalism).** The vast majority of philosophers of mind and neuroscientists accept causal closure. Interactionism is seen as violating established physics. *Within the physicalist mainstream, it's settled that interactionism isn't needed.* The framing reflects this. Proponents of interactionism are a small minority who reject this physicalist premise.

  *   **Leaf Popularity:**
      *   **A. Illusionism:** **Serious Minority.** Growing, but still faces strong intuitive resistance.
      *   **B. Identity/Neural Tracking:** **Mainstream (within Physicalism).** Core to reductive physicalism.
      *   **C. Acquaintance:** **Serious Minority.** Core to Russellian Monism and some property dualism.
      *   **D. Constitution:** **Serious Minority.** Niche position within self-representational theories.
      *   **E. Phenomenal Concepts:** **Mainstream (within Non-Reductive Physicalism/Dualism).** The dominant strategy for non-reductive views to handle the paradox.
      *   **F. Brute Coincidence:** **Nearly Empty.** Universally seen as a major cost; few endorse it willingly. Often a reductio argument against epiphenomenalism.
      *   **G. Interactionism:** **Nearly Empty** in contemporary academic philosophy/science. Violates deeply held physicalist commitments.

  **Judgment Calls (Mine):**
  1.  **Grouping A&B:** Treating Illusionism and Neural Tracking as arriving at the same node is pragmatic for the tree based on cases, though they differ metaphysically.
  2.  **Grouping D&E:** Similarly, treating Constitution and Phenomenal Concepts together at N7 due to their shared "constitutive" core.
  3.  **Structure of N4 & N3:** Using Unattended Pain and Split-Brain primarily to challenge the reliability/transparency of reports and access to experience, pushing towards either constitution/acquaintance or brute coincidence/illusionism.
  4.  **Defining "Content-Locking Solved":** I rated views as "Yes" only if they provided a mechanism intrinsically linking report content *to the phenomenal character itself* (Acquaintance, Constitution, PC), "Partially" if they linked it to the neural state identified *with* the character (B) or caused *by* the character without explaining content (G), and "No" otherwise. This reflects the spirit of your "fixed by rather than merely agreeing" concern.
  5.  **Identifying Incoherent Cells:** The key empty cells (N5=Y & N8=Y; N1=Y, N3=A, N6=N, N7=Y & N8=Y) are flagged as incoherent based on the core commitments of the answers conflicting.

  This tree should let your group navigate to their core commitments using concrete cases, revealing where their answers lead regarding the paradox and its associated costs, while clarifying the contested landscape. Good luck!
