answer: |-
  Here's a decision tree designed for your reading group, built from your specifications. It focuses on concrete cases and avoids philosophical jargon at the nodes, while capturing the required leaves and tags.

  **Decision Tree Structure (7 Nodes, 8 Leaves, Depth 5)**

  1.  **Node 1 (Blindsight):** Subject DB reports "I see nothing" in his blind field but reliably guesses stimulus location/direction above chance. When asked *how* he guesses, he says "It's just a lucky guess" or "I felt like pointing there." Does DB's *report* ("I see nothing") accurately reflect *any conscious visual experience whatsoever* in the blind field?
      *   **No:** Go to Node 2.
      *   **Yes:** Go to Node 3.

  2.  **Node 2 (Choice Blindness):** In experiments, subjects confidently justify a choice they demonstrably did *not* make (e.g., choosing a face they rejected seconds earlier, due to covert swapping). When they report reasons for the *altered* choice ("I chose this face because..."), is their report generated by processes *transparently accessible* to their conscious reasoning? (i.e., could they, in principle, introspect and discover the real cause was the experimenter's trick?)
      *   **Yes:** Go to Node 4.
      *   **No:** Go to Node 5.

  3.  **Node 3 (Split-Brain):** A split-brain patient is shown a picture of a snow scene to the right hemisphere (RH) and a chicken claw to the left hemisphere (LH). They point with their left hand (RH) to a shovel (to clear snow) and with their right hand (LH) to a chicken. When asked *why* they pointed to the shovel, their speaking LH says "I pointed to the shovel to clean out the chicken shed." Is the LH's *verbal report* about the reason for the shovel choice primarily based on:
      *   **Access to the RH's actual visual experience/contents?:** Go to Node 6.
      *   **A post-hoc confabulation generated by the LH?:** Go to Node 5 (via "No" path).

  4.  **Node 4 (Unattended Pain):** You stub your toe intensely but are so engrossed in a task you don't consciously feel the pain until a minute later when you shift attention. At the moment *before* you shift attention, was there:
      *   **A conscious pain experience present but unattended?:** Go to Node 7.
      *   **No conscious pain experience present at all (only non-conscious nociception)?:** Go to Node 5 (via "No" path).

  5.  **Node 5 (Report Mechanism):** When a subject accurately reports "I see red," is the *content* of that report (referring to the *phenomenal quality* of red) determined solely by the physical/functional state of the brain *without* needing the phenomenal property itself to play an active causal role?
      *   **Yes:** Go to Leaf A (Illusionism) or Leaf B (Identity/Neural Tracking).
      *   **No:** Go to Node 8 (Interactionism).

  6.  **Node 6 (Acquaintance):** When you introspect your own vivid red experience, is your *knowledge* of what it's like *constituted* by having the experience itself present to you, in a way that isn't just knowing *facts about* the experience?
      *   **Yes:** Go to Leaf C (Acquaintance).
      *   **No:** Go to Node 7.

  7.  **Node 7 (Constitution/Phenomenal Concepts):** When you report "I see red," is the conscious experience of red *itself* a literal *constituent* of either (a) the cognitive process generating the report, or (b) the concept 'red' as used in that report?
      *   **Yes (a or b):** Go to Leaf D (Constitution) or Leaf E (Phenomenal Concepts).
      *   **No:** Go to Leaf F (Brute Coincidence).

  8.  **Node 8 (Interactionism):** Does the conscious experience of red possess causal powers that are *fundamentally distinct* from, and not reducible to, the causal powers of the underlying neural activity? (i.e., does consciousness "push atoms around" in a way physics alone doesn't account for?).
      *   **Yes:** Go to Leaf G (Interactionism).
      *   **No:** (Leads back to earlier options or contradiction - see Logical Space). *This path shouldn't be taken if answering previous nodes honestly; it flags a potential inconsistency.*

  **Leaves & Tags:**

  *   **Leaf A: Illusionism** (Frankish, Dennett-ish)
      *   *Coincidence Bill:* **None.** There *is no* phenomenal experience to match the report to. Reports are about *misrepresentations* or dispositions, not actual qualia.
      *   *Content-Locking Solved?* **No (Moot).** The problem dissolves because there's no phenomenal content to lock onto. Reports track neural/functional states or cognitive models.
  *   **Leaf B: Identity/Neural Tracking** (Type Identity, some Eliminativism)
      *   *Coincidence Bill:* **None/Small.** The report tracks the neural state N. Since the experience *is* N (or is nothing over/above N), the report automatically tracks the experience by tracking N. Any "gap" is conceptual confusion.
      *   *Content-Locking Solved?* **Partially (Relocates).** The neural state N *is* the experience. Reporting "red" tracks N. Why does N feel like *red* rather than something else? This "hard problem" aspect isn't addressed; content-locking for *phenomenal character* is relocated to the identity claim.
  *   **Leaf C: Acquaintance** (Russellian Monism, some Non-Reductive Physicalism)
      *   *Coincidence Bill:* **None.** Accuracy comes from direct, non-inferential awareness (acquaintance) with the experience itself. The report expresses this direct knowledge.
      *   *Content-Locking Solved?* **Yes.** The content is fixed *by the experience itself* being the object of direct awareness. The report is *about that very object*.
  *   **Leaf D: Constitution** (Kriegel's Self-Representationalism, some Higher-Order Thought)
      *   *Coincidence Bill:* **None/Small.** The experience is literally a part of the representational state generating the report (e.g., the experience represents itself). The report's content includes/is constituted by the experience.
      *   *Content-Locking Solved?* **Yes.** The experience *is part of* the vehicle/content of the report itself. There's no gap for coincidence to occur.
  *   **Leaf E: Phenomenal Concepts** (Loar, Chalmers, Papineau)
      *   *Coincidence Bill:* **None/Small.** The concept 'red' used in the report *incorporates* the experience of red (e.g., as a constituent, or via direct recognitional capacity). Applying the concept accurately to the experience is built-in.
      *   *Content-Locking Solved?* **Yes.** The phenomenal concept's content is fixed *by* the experience it refers to (often via a direct, recognitional link). The report uses this concept.
  *   **Leaf F: Brute Coincidence** (Hard Epiphenomenalism, some Mysterianism)
      *   *Coincidence Bill:* **Unpayable/Large.** The physical process generates a true report about the experience, but the experience itself plays *no causal role whatsoever* in generating that report. The match is a massive, unexplainable cosmic coincidence.
      *   *Content-Locking Solved?* **No.** The report's content just *happens* to correspond correctly to the causally inert experience. There's no mechanism fixing the content *to* the experience.
  *   **Leaf G: Interactionism** (Popper & Eccles, some Dualism)
      *   *Coincidence Bill:* **None.** The experience directly causes (or influences) the report, explaining the match.
      *   *Content-Locking Solved?* **Partially (Relocates).** The experience causes the report *with specific content*. *Why* does *this* experience cause a report with *this specific content*? This requires explaining mental causation and content assignment within a non-physical framework – the problem is relocated, not fully solved. (How does the non-physical quale cause "red" to be uttered?).

  **Vocabulary Notes:**
  *   **"Coincidence Bill":** The field often discusses the **explanatory gap** or the **problem of mental causation** specifically regarding epiphenomenalism. "Brute contingency" or "lucky harmony" captures the idea.
  *   **"Content-Locking":** This relates closely to the **determination of intentional content** and **mental representation**. How does a brain state/process come to *mean* or *refer to* a specific phenomenal quality? It touches on the **hard problem** and **naturalizing intentionality**.

  **Logical Space (Coordinate Table)**

  *   **Axes (Node Answers):** N1 (Blindsight: Y/N), N2 (Choice Blindness: Y/N), N3 (Split-Brain: Access/Confab), N4 (Unattended Pain: Present/Not), N5 (Report Mech: Y/N), N6 (Acquaintance: Y/N), N7 (Constitution/PC: Y/N), N8 (Interactionism: Y/N)
  *   **Key:** Y = Yes, N = No, A = Access (RH Exp), C = Confab (LH Post-hoc), P = Pain Present, NP = Pain Not Present.

  | N1 | N2 | N3 | N4 | N5 | N6 | N7 | N8 | Occupied? (Leaf)                      | Reason if Empty                 |
  | :-- | :-- | :-- | :-- | :-- | :-- | :-- | :-- | :------------------------------------ | :------------------------------ |
