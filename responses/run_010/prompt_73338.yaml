prompt: |-
  I teach a first-year graduate seminar on the ethics of research practice — 24 students, mixed across biology, chemistry, and CS, one 75-minute session in a plain seminar room with a whiteboard, no guarantee of computers, and no budget for real money. Most have had one semester of probability and none is a game theorist. My problem is that we spent the first weeks on the standard catalog — tragedy of the commons, free riding, prisoner's dilemma, principal–agent problems — and my students now pattern-match every case of collective risk onto one of those four templates. When I describe a lab considering whether to publish a protocol, release a dataset, or open-source a model, half the class immediately says "commons problem" and stops thinking. I want an activity that breaks that reflex by making them live through a structurally different failure mode before anyone names it.

  The failure mode I have in mind is what I know as the unilateralist's curse, and since it is not part of the standard curriculum, here is the mechanism as I understand it, so that the design does not depend on your recalling the label: there is an action whose true net value depends on a state of the world that the actors do not know; each actor forms an independent, noisy estimate of whether acting is net beneficial; each actor is individually able to act alone, without anyone's consent; each acts whenever their own estimate is favorable. Under those conditions, adding more well-intentioned, individually prudent actors makes a bad outcome more likely, because the pool of estimates grows and with it the chance that at least one actor receives a spuriously favorable signal and acts on it — and a single bad act is not diluted or offset by the many good decisions that were made, since the acts are not rivalrous and nobody is taking more than their share of a common resource. The harm comes from selection over noisy estimates, not from defection, externalities, or overconsumption. The usual institutional remedy — requiring consultation, a second signature, a veto, or unanimity before anyone acts — genuinely reduces bad acts, but it also suppresses good ones, and that cost is real and should be visible in the same numbers rather than asserted in the debrief. Participants should come away seeing three things: that the outcome got worse purely because there were more of them, with nobody irrational or malicious; that this is not the commons and not free riding, and being able to say precisely where it differs; and that the coordination fix they will propose on their own carries a measurable price.

  Please design the activity so that the payoff structure and the noise process are held exactly fixed while only the number of people who may act varies — the same scenario run with a single actor, then a small team, then the whole room — so that any difference in outcome is attributable to group size alone and cannot be explained away by the scenario changing. Give me: the hidden-state and signal-generation mechanism implementable with dice, cards, or sealed envelopes rather than software; a points-based payoff scheme in which the losses are felt collectively rather than by punishing an individual student in a way that would distort their incentives; the verbatim text of anything I need to print or write on the board, none of which may contain the name of the phenomenon or a synonym such as winner's curse or selection effect; a minute-by-minute timeline for 75 minutes; and the actual arithmetic for each group-size condition — the probability that at least one bad act occurs, worked out from your chosen signal distribution, not asserted — along with your judgment about whether the effect will reliably appear in the number of rounds that fit the session, and what I should do if it does not, including the specific embarrassment of the single-actor condition producing no bad act at all, which will look to the room like evidence against the whole idea. Then give me the debrief: questions in the order I should ask them, each mapped to a moment of play, the point at which the concept finally gets its name, and prepared responses to the two objections I expect — the student who concludes we should simply always consult, and the student who complains the signals were rigged against them. State what will predictably go wrong the first time this is run and how to recover in real time; include a scaled-down variant for a session where only a dozen students show up; and close with a frank account of which feature of the phenomenon a classroom game cannot reproduce — I suspect correlated estimates among people who share a literature, and the fact that real acts are irreversible rather than repeated — together with the two or three sentences I must supply verbally to cover the gap. Begin your response with one sentence stating the single moment in the activity where the idea lands, and then give the design; no preamble, no restatement of my request, and no closing commentary.
reasoning: |-
  We are designing an activity to demonstrate the unilateralist's curse without naming it. The key moment when the idea lands is when the entire class sees that the group with more actors had a higher rate of harmful actions even though each actor was well-intentioned and using the same decision rule.

  **Activity Title: The Action Threshold Game**

  **Core Mechanism:**
  - A hidden state: either "Acting is beneficial" (green) or "Acting is harmful" (red). Each state occurs with 50% probability.
  - Each actor receives a private signal (a number) drawn from a distribution that depends on the state. The signal is designed such that even well-intentioned actors will sometimes get it wrong.
  - We use dice to generate signals. We'll use a 6-sided die for simplicity.

  **Signal Generation:**
  - If the hidden state is green (beneficial), the signal is drawn uniformly from {3, 4, 5, 6}.
  - If the hidden state is red (harmful), the signal is drawn uniformly from {1, 2, 3, 4}.
  - Thus, a signal of 3 or 4 is ambiguous (can come from either state), 1 or 2 is only from red, 5 or 6 only from green.

  **Decision Rule:**
  - Each actor acts if their signal is greater than or equal to 4. Why 4? Because:
    - In the green state: signals are 3,4,5,6. Acting threshold 4: they act on 4,5,6 (75% of the time) and don't on 3 (25%).
    - In the red state: signals are 1,2,3,4. Acting threshold 4: they act on 4 (25% of the time) and don't on 1,2,3 (75%).
  - This rule is prudent: in green, they act most of the time; in red, they rarely act. But they can make mistakes.

  **Payoff Scheme:**
  - If the hidden state is green and at least one person acts: +100 points to the collective pot.
  - If the hidden state is green and no one acts: 0 points (missed opportunity).
  - If the hidden state is red and no one acts: +0 points (no harm, no foul).
  - If the hidden state is red and at least one person acts: -200 points to the collective pot (because harm is done and it's irreversible).

  We want the harm to be collective so that no individual is blamed. The entire class shares the collective pot. The goal is to maximize the total points.

  **Why this setup?**
  - In the red state, the probability that a single actor acts is 25% (since they get a signal of 4 and act). So the chance of a harmful act by one actor is 25%.
  - With multiple independent actors, the chance that at least one acts in the red state is 1 - (0.75)^n, where n is the number of actors. This increases with n.

  **Arithmetic:**
  - For one actor: P(bad act in red state) = 0.25
  - For two actors: P(at least one bad act) = 1 - (0.75)^2 = 1 - 0.5625 = 0.4375
  - For three actors: 1 - (0.75)^3 ≈ 1 - 0.421875 = 0.578125
  - For four actors: 1 - (0.75)^4 ≈ 1 - 0.31640625 = 0.68359375
  - For the whole class (24 students): ≈ 1 - (0.75)^24 ≈ 1 - 0.001 (approx) = 0.999 (virtually certain)

  But note: we are going to run multiple rounds. We need the effect to be visible in a small number of rounds.

  **Group Sizes to Test:**
  We'll run the same scenario (same hidden state, same signal distribution) for three group sizes:
  1. Solo: one actor (the rest of the class observes)
  2. Small team: 4 actors (randomly selected)
  3. Whole room: all 24 students (or as many as present) are actors

  We run several rounds for each group size to get a pattern.

  **Materials:**
  - Two coins to determine the hidden state (one flip for the round: heads=green, tails=red). Alternatively, a die: 1-3 red, 4-6 green (but we want 50/50).
  - One 6-sided die per actor (or share if limited). Alternatively, we can pre-generate signals on paper if dice are scarce.
  - Whiteboard to record the collective points and the outcomes.

  **Setup:**
  - Prepare sealed envelopes for each round? No, we can do it live.
  - Instead, we can have the instructor flip a coin in front of the class to set the hidden state (but keep it hidden from the actors? Not necessarily, because the state is hidden in reality. But in the game, the state is hidden until the end of the round? Actually, we want to reveal the state and the payoffs at the end of each round so they see the consequences.

  **Procedure for a Round:**
  1. **Determine hidden state:** Instructor flips a coin (or rolls a die for 50/50) and records the state (but does not reveal until step 6).
  2. **Assign actors:** For the current group size (solo, small, whole), select the actors. The rest are observers.
  3. **Generate signals:** Each actor rolls a 6-sided die in private (so only they see their die). They must not reveal their signal until after the round.
  4. **Decision:** Each actor decides independently whether to act (if their signal >=4) or not (if <4). They write their decision on a slip of paper (to avoid social pressure) and hand it to the instructor.
  5. **Count actions:** Instructor collects all decisions and notes if at least one actor decided to act.
  6. **Reveal state and outcome:** Instructor reveals the hidden state and announces the outcome and points for the round.
     - If state green and at least one acted: +100
     - If state green and no one acted: 0
     - If state red and at least one acted: -200
     - If state red and no one acted: 0
  7. **Record:** Update the collective point total on the board.

  **Timeline for 75 minutes:**
  - (5 min) Introduction: Explain the setup without giving away the point. "We are going to simulate a research group facing a decision: whether to take an action that could be beneficial or harmful. The true state of the world is hidden. Each of you will get a private signal about the state. Your goal is to maximize the collective points for the class."
  - (5 min) Explain the rules: 
    - Hidden state: 50% chance green (acting beneficial), 50% red (acting harmful).
    - Signal: When you roll a die, the number is your signal. 
    - Decision rule: If your signal is 4 or more, you should act. Otherwise, don't.
    - Payoffs: as above.
  - (15 min) Solo rounds: Run 4 rounds with one actor each time (choose a different volunteer each time). Record the state, the actor's signal, their decision, and the outcome. 
  - (15 min) Small team rounds: Run 4 rounds with 4 actors (randomly chosen each round). For each round, record the state, how many acted, and the outcome.
  - (15 min) Whole room rounds: Run 4 rounds with all students as actors. Record the state, how many acted (but we only care if at least one acted), and the outcome.
  - (20 min) Debrief and discussion (see below).

  Total: 60 minutes for rounds, 15 minutes buffer and debrief.

  **Arithmetic and Expected Outcome:**
  - In the red state:
    - Solo: P(bad act) = 0.25 -> expected bad act in 1 out of 4 red rounds.
    - Small team (4): P(at least one bad act) = 1 - (0.75)^4 ≈ 0.6836 -> about 2.7 out of 4 red rounds.
    - Whole room (24): ≈ 1 -> almost every red round.

  But note: the state is determined randomly. We run 4 rounds per group size. The state is independent per round. On average, we expect 2 red rounds and 2 green rounds per group size.

  **What if the solo condition produces no bad act?**
  - It might: in 2 red rounds, the chance of no bad act in solo is (0.75)^2 = 0.5625. So about 56% of the time, we'll see no bad act in the solo red rounds. That might make the students think that the solo actor is safe. But then in the group rounds, we expect more bad acts in red states. We can point out that even in solo, the actor sometimes causes harm (if we had a red round and they acted). If we have no red round in solo, then we didn't see a bad act. But we have multiple group sizes and rounds. We can compare the rate of bad acts in red states across group sizes.

  **Contingency if no bad act in solo:**
  - If in the solo rounds we have no red state at all (which has 25% chance per round, but over 4 rounds the chance of no red is (0.5)^4=0.0625, so unlikely), then we note that and say we'll focus on the other conditions. Alternatively, we can run an extra solo round if time. But the point is that even if we don't see a bad act in solo, we can still see the increase in bad acts in the group conditions.

  **Debrief Questions:**
  1. (After all rounds) "Look at the outcomes in the red state rounds. How did the rate of harmful actions change as the number of actors increased?" (They should see an increase.)
  2. "In the red state, why did more actors lead to more harmful actions? Was anyone being irrational or malicious?" (No, each followed the same rule.)
  3. "How is this different from the tragedy of the commons? In the commons, what happens when more people act? (They deplete a resource.) Here, what is the resource? Is there depletion? (No, the harm is caused by one person acting, and it doesn't matter how many others don't act.)"
  4. "What did we do to try to prevent harmful actions? Did we require more people to agree? What happened to the beneficial actions when we did that?" (We haven't done that in the game yet, but they might suggest it. We can then run a variant in the debrief or discuss hypothetically.)

  **Institutional Remedy Demonstration (if time permits in debrief):**
  - We can quickly simulate one round with the whole room but with a rule: at least two actors must agree to act (i.e., we require two or more to decide to act before the action is taken). But note: the decision is still individual. Alternatively, we can require unanimity? 
  - Actually, we can do a quick calculation: for the whole room with 24, in the red state, the chance of at least one actor acting is almost 1. But if we require at least two to act? The chance of at least two acting in red state is 1 - P(0 actors) - P(1 actor) = 1 - (0.75)^24 - 24*(0.25)*(0.75)^23. This is still very high? Actually, with the threshold rule, the number who act in red state is binomial(n=24, p=0.25). The mean is 6, so it's very likely to have at least two. But the point is: requiring unanimity would be extreme. Let's do a simple remedy: require consensus of two randomly chosen individuals? We can do a quick round: pick two actors randomly. They must both agree to act for the action to be taken. Then the chance of a bad act in red state is P(both act) = (0.25)^2 = 0.0625. But then in green state, the chance of both acting? (0.75)^2 = 0.5625, so we miss the opportunity 43.75% of the time. So we reduce bad acts but also reduce good acts.

  **Naming the Phenomenon:**
  - After the above discussion, we name it: "This phenomenon is known as the unilateralist's curse. It occurs when individuals can act unilaterally and their individual judgments are noisy. Even if each person is well-intentioned, having more people increases the chance that at least one person mistakenly thinks acting is a good idea and causes harm."

  **Objection Handling:**
  1. **"We should always consult"**: 
     - Response: "Consultation can help, but note that in our remedy, we required two to agree. What happened to the green state rounds? We might have missed some good opportunities. The cost of suppressing good acts must be weighed against the benefit of reducing bad acts."

  2. **"The signals were rigged"**:
     - Response: "The signal distribution was fixed and the same for every round. The noise is inherent in the problem. In real life, we often have ambiguous evidence. The point is that even with the same level of noise, having more people increases the chance of a false positive."

  **Predictable Problems and Recovery:**
  - **Problem:** Students might not keep their signals private and discuss, breaking the independence.
    - **Recovery:** Emphasize the rules: "Remember, your signal is private. You must not share it until after the round. This is important because in reality, you might not have time to consult."

  - **Problem:** The state might come up green too often and we don't see a red state in the group rounds.
    - **Recovery:** We can adjust the coin flips if necessary (but that's cheating). Instead, we can note that we expect about half the rounds to be red, and if we get an outlier, we can discuss the expected probabilities.

  - **Problem:** In the whole room, everyone will act in green state and we get +100, but in red state, we almost always get -200. The collective points might be negative. That's okay because it reflects the problem.

  **Scaled-Down Variant for 12 Students:**
  - Same structure. For the whole room, use 12 actors. The arithmetic for red state: P(bad act)=1-(0.75)^12≈ 1-0.0317=0.9683. Still very high. We can run 3 rounds per group size to save time.

  **What the Game Cannot Reproduce:**
  1. **Correlated estimates:** In reality, researchers in the same field may have correlated signals because they read the same papers. This would reduce the independent noise and might mitigate the curse. 
  2. **Irreversibility:** In the game, we run multiple rounds and the harm is reversible in the sense that we reset. In reality, a harmful act might be permanent.

  **Verbal Gap-Filling:**
  - "In the real world, the signals that researchers get are often correlated because they share a common literature. This might reduce the effect we saw, but it doesn't eliminate it. Also, note that in reality, once a harmful action is taken, it cannot be undone. That's why we set the payoff for a bad act so high."

  **Verbatim Text for the Board:**
  - Rules:
    - Hidden state: 50% green (acting beneficial), 50% red (acting harmful).
    - Your signal: Roll a die. 
    - Act if your signal >=4.
  - Payoffs:
    - Green state & at least one acts: +100
    - Green state & no one acts: 0
    - Red state & no one acts: 0
    - Red state & at least one acts: -200

  **Start of Activity:**
  The moment the idea lands: When the whole room sees that in a red state round with many actors, they almost always get a bad outcome, even though each actor was following the same rule as the solo actor who sometimes avoided it.

  **Design Details:**
  We have provided the above.
answer: |-
  The moment the idea lands is when the whole class sees that in a red-state round with 24 actors, a harmful action occurs nearly every time, while the same state and rules with one actor rarely cause harm, proving group size alone worsens outcomes.

  **Activity Design: The Collective Action Challenge**  
  *Core mechanism fixed across all rounds:*  
  - **Hidden state:** Determined by coin flip (heads = green/beneficial, tails = red/harmful).  
  - **Signal generation:** Each actor rolls one 6-sided die privately.  
    - Green state: Signals 3, 4, 5, or 6 (uniform).  
    - Red state: Signals 1, 2, 3, or 4 (uniform).  
  - **Decision rule:** Actors act if their die roll (signal) is ≥4.  
  - **Payoffs (collective points for entire class):**  
    - Green state + at least one actor acts: +100  
    - Green state + no one acts: 0  
    - Red state + no one acts: 0  
    - Red state + at least one actor acts: -200  

  **Materials:**  
  - 1 coin (instructor use).  
  - 1 six-sided die per student (or share if limited).  
  - Paper slips for decisions.  
  - Whiteboard with tracking table:  

  | Round | Group Size | Hidden State (revealed after) | # Who Acted | Outcome (Points) | Total Points |  
  |-------|------------|-------------------------------|-------------|------------------|-------------|  
  | ...   | ...        | ...                           | ...         | ...              | ...         |  

  **Verbatim Text for Whiteboard (pre-write):**  
  ```  
  RULES  
  - Hidden state: 50% green (act = good), 50% red (act = bad)  
  - Your signal: Roll 1 die in secret.  
  - Decide: ACT if roll ≥4, DON'T ACT if roll <4.  
  - Goal: Maximize class points.  

  PAYOFFS  
  - Green + action: +100  
  - Green + no action: 0  
  - Red + no action: 0  
  - Red + action: -200  
  ```  

  **Timeline (75 minutes):**  
  - **0–5 min:** Introduce activity. *"We’re simulating a research team deciding whether to take a high-stakes action—like releasing a dataset. The true risk is hidden. Each of you gets a private signal (die roll) and must decide independently whether to act. Your goal: maximize collective points."* Explain rules/payoffs using whiteboard.  
  - **5–25 min: Solo rounds (1 actor).** Run 4 rounds.  
    - Per round: Flip coin (hide result). Pick one volunteer actor. They roll die in private, decide (write "ACT" or "DON'T" on slip), hand to instructor. Reveal state, outcome, update points.  
  - **25–45 min: Small-team rounds (4 actors).** Run 4 rounds.  
    - Per round: Flip coin. Randomly pick 4 actors. Each rolls die privately, decides (write slip). Instructor checks if ≥1 acted. Reveal state/outcome, update points.  
  - **45–65 min: Whole-room rounds (24 actors).** Run 4 rounds.  
    - Per round: Flip coin. All students roll dice privately, decide (write slips). Instructor collects, checks if ≥1 acted. Reveal state/outcome, update points.  
  - **65–75 min: Debrief** (questions below).  

  **Arithmetic & Contingencies:**  
  - *Fixed probabilities per state:*  
    - Red state: P(one actor acts) = P(roll≥4) = 2/4 = 0.5? No.  
      - Red state signals: 1,2,3,4 → P(roll≥4) = P(4) = 1/4 = 25% (since only 4 triggers act; 1/2/3 do not).  
    - Green state: P(act) = P(roll≥4) = P(4,5,6) = 3/4 = 75%.  
  - *Red-state failure probabilities (P(at least one harmful act)):*  
    - Solo: 25% (1 - 0.75)  
    - Small team (4 actors): 1 - (0.75)^4 ≈ 68.4%  
    - Whole room (24 actors): 1 - (0.75)^24 ≈ 99.9%  
  - **Will effect appear?** Yes. Over 4 red-state rounds (expected 2 per group size with 50% state probability):  
    - Solo: Likely 0–1 harmful acts (P(0 harms in 2 red rounds) = (0.75)^2 ≈ 56%).  
    - Teams: Likely 1–2 harmful acts (P(≥1 harm in 2 red rounds) ≈ 1 - (1-0.684)^2 ≈ 90%).  
    - Whole room: Near-certain harmful acts in all red rounds.  
  - **If solo has no bad act:** *"Notice: In solo, we avoided harm here. But was that due to the actor’s skill or luck? Let’s compare group sizes."* Highlight that solo had a 25% chance per red round—small but real—while groups amplified it. Use arithmetic to show inevitability in large groups.  
  - **If effect is weak (e.g., few red rounds):** Run 1–2 extra whole-room rounds, emphasizing state randomness. Contrast with solo’s low base rate.  

  **Debrief Questions (order and timing):**  
  1. (After recording all outcomes) *"Look at red-state rounds. What happened to the rate of harmful actions as more people could act?"* → Point: Harm increased with group size.  
  2. (After showing decision slips are consistent) *"Were any actors reckless or irrational? Did anyone deviate from the rule?"* → Point: All followed the same prudent rule (act if ≥4).  
  3. (After tallying green-state outcomes) *"In green states, how did group size affect missing good opportunities?"* → Point: More actors reduced missed chances (solo missed 25% of green acts, groups nearly none).  
  4. *"How is this different from a tragedy of the commons? Think: Is there a shared resource being depleted? Are actors 'taking more than their share'?"* → Point: Here, one bad act causes full harm; no resource rivalry.  
  5. *"What’s a quick way to reduce harmful acts? Let’s hear your ideas."* → When "consultation/unanimity" is proposed, calculate its cost: *"Suppose we require 2 people to agree to act. In red states, P(harm) = P(both roll≥4) = (0.25)^2 = 6.25%. But in green states, P(missed opportunity) = P(not both≥4) = 1 - (0.75)^2 ≈ 44%."*  
  6. **Name the phenomenon:** After Q5. *"This is the unilateralist’s curse: more actors increase the risk of a bad decision through noise, not malice."*  

  **Objection Responses:**  
  - **"We should always consult"**: *"True, consultation cuts harmful acts—but at a cost. Our calculation shows it suppresses good acts too. Is that worth it? In research, delays or vetoes might block beneficial innovation."*  
  - **"Signals were rigged"**: *"The dice were fair—green had 75% act signals, red had 25%. Real data is noisy; a 'rigged' feeling reflects how ambiguity tempts overconfidence in small groups."*  

  **Predictable Problems & Recovery:**  
  - **Problem:** Students peek/share signals. → *Recovery:* Pause and restress: *"Signals must be private—no talking. Real researchers often can’t confer instantly."*  
  - **Problem:** Slow slip collection in large groups. → *Recovery:* Use table groups to collect slips quickly.  
  - **Problem:** Misrecorded states. → *Recovery:* Have a student verify coin flips/rolls.  

  **Scaled-Down for 12 Students:**  
  - Same timeline.  
  - Adjust group sizes: Solo (1), Small team (3), Whole room (12).  
  - Red-state P(harm): Solo 25%, Small team ≈ 58% (1 - 0.75^3), Whole room ≈ 97% (1 - 0.75^12).  
  - Run 3 rounds per group size to fit time.  

  **Unreproducible Features & Verbal Gap Coverage:**  
  - *Correlated estimates:* "In reality, researchers share literature, so signals correlate. This weakens the curse but doesn’t kill it—noise remains."  
  - *Irreversibility:* "Real actions can’t be undone. Our points reflect this: -200 for red-state acts is permanent loss, not a repeatable cost."
