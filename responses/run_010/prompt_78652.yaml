prompt: |-
  You're an evolutionary game theorist who also does philosophy of biology — think carefully, and brainstorm a bit before you start writing. I want the spec, not a survey of mechanisms.

  What does a theory of the evolution of cooperation between unrelated, non-clonal agents actually have to deliver to count as adequate? Give me the desiderata: the phenomena it must account for, the cases it has to get right, the distinctions it can't collapse, the empirical results it can't flatly contradict — with the motivating case or consideration behind each one, not just a label.

  A few things I'd expect on the list, or else a reason they dont belong: cooperation under noise, where a strict reciprocal rule spirals into mutual defection after one accidental defection; the endgame problem, i.e. why people keep cooperating in finitely repeated games when backward induction says they shouldn't; reports from some subject pools where the most generous contributors get punished roughly as much as free riders, which seems to invert the usual prediction; voluntary participation, where models sometimes yield cycles instead of defection taking over; and third-party punishment by bystanders who gain nothing from punishing.

  Then mark which requirements are non-negotiable and which are really the preferences of one camp — demanding an account with no group-level selection at all, or demanding that cooperation pay off for the individual at equilibrium, look like candidates for the second pile. Flag any subset you think is jointly unsatisfiable; that's the part I most want to see, since then the list is itself a result. Finish by saying which single requirement eliminates the most standard mechanisms (kin selection, direct reciprocity, indirect reciprocity, network reciprocity, punishment, partner choice), and a couple of lines each on how they do agaisnt it. Keep it tight — no bibliography, I'll find my own reading.
