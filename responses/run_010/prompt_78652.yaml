answer: |-
  Here are the core desiderata for an adequate theory of cooperation evolution between unrelated, non-clonal agents, categorized and assessed:

  **Non-Negotiable Desiderata (Empirical Anchors):**
  1.  **Baseline Cooperation in One-Shot Anonymity:** *Must* explain why cooperation occurs predictably in controlled one-shot anonymous interactions (e.g., dictator games, one-shot PDs) where future interaction, reputation, and punishment are impossible. *Motivation:* Robust empirical finding across diverse human cultures; falsifies strict rational self-interest as the sole universal driver.
  2.  **Conditional Cooperation & Positive Reciprocity:** *Must* account for the widespread tendency for cooperation to increase with the *expected* cooperation of others. *Motivation:* Cornerstone of behavioral economics experiments (public goods games with communication, sequential games); explains responsiveness to social context.
  3.  **Negative Reciprocity & Costly Punishment:** *Must* explain why individuals incur costs to punish defectors/free-riders, even in one-shot settings or when punishment provides no future material benefit to the punisher. *Motivation:* Ubiquitous finding in public goods games with punishment options; crucial for sustaining cooperation.
  4.  **Robustness to Noise/Errors:** *Must* explain how cooperation persists despite inevitable misperceptions, mistakes in execution, or environmental fluctuations causing unintended "defections." *Motivation:* Strict tit-for-tat spirals into mutual defection after errors; real-world interactions are noisy.
  5.  **Third-Party Punishment (TPP):** *Must* explain why "bystanders" (unaffected by the initial interaction) punish norm violators at personal cost. *Motivation:* Strong empirical evidence (third-party punishment games); highlights enforcement of group norms beyond direct self-interest or pairwise reciprocity.

  **Contested Preferences (Camp-Specific Demands):**
  6.  **Strict Individual Payoff Maximization at Equilibrium:** *Demand* that cooperation strategies, once established, yield higher *individual* expected payoffs than defection within the population/group. *Motivation:* Preference of individual/gene-level selection advocates; rules out explanations relying solely on group benefit without individual advantage.
  7.  **No Group-Level Selection:** *Demand* that the explanation avoid any invocation of between-group differential survival/reproduction (multilevel selection). *Motivation:* Preference of strict individual-selectionists; concern about untestability or unnecessary complexity.
  8.  **"Endgame" Cooperation in Finite Repetition:** *Demand* that the theory explain sustained cooperation near the end of known finite interactions. *Motivation:* Preference for models avoiding backward induction paradox; empirical observation in many (though not all) experiments.
  9.  **Voluntary Participation Stability:** *Demand* that the theory specifically produce stable cooperative equilibria allowed by "loner" or exit options. *Motivation:* Preference for models where cooperation is stable *because* of the exit option, not just coexisting with cycles; empirical observation of stable cooperation in such setups.

  **Critical Phenomena Requiring Explanation (Not Yet Adequately Covered):**
  10. **Antisocial Punishment Paradox:** *Must* grapple with findings where high contributors or cooperators are punished (e.g., some subject pools in public goods games). *Motivation:* Contradicts simple models of punishment enforcing cooperation; suggests complex social dynamics like counter-dominance, spite, or conflicting norms.
  11. **Scale & Parochialism:** *Must* explain limits to cooperation scale (within-group vs. between-group) and phenomena like parochial altruism (cooperation + outgroup hostility). *Motivation:* Real-world cooperation is bounded; universal cooperation is rare.

  **Tensions and Incompatibilities:**
  *   **6 (Strict Individual Payoff Max) vs. 5 (TPP) & 3 (Costly Punishment):** Explaining costly punishment, especially TPP, purely as individual payoff maximization *within the interaction* is extremely difficult. These behaviors often incur net costs. Reconciling this requires either relaxing strict payoff maximization (incorporating proximate mechanisms like emotion), invoking long-term/cultural payoffs, or accepting group-level benefits.
  *   **10 (Antisocial Punishment) vs. Universal Punishment Logic:** Standard punishment theories assume punishment targets low contributors. Antisocial punishment directly contradicts this and requires distinct mechanisms (e.g., envy, dominance contests, different normative frameworks).
  *   **8 (Endgame Cooperation) vs. Classical Game Theory:** Backward induction is logically sound within its axioms. Explaining its empirical violation requires incorporating different agent models (e.g., irrationality, fuzzy horizon perception, social preferences overriding payoff calculation).
  *   **11 (Scale/Parochialism) vs. Universal Cooperation Models:** Mechanisms promoting in-group cooperation (e.g., strong reciprocity, group identification) often inherently create boundaries against out-groups. A theory explaining widespread within-group cooperation might *predict* parochialism.

  **The Single Most Damaging Requirement:**
  **5. Third-Party Punishment (TPP)** eliminates the most standard mechanisms:
  *   **Kin Selection:** Irrelevant (unrelated agents).
  *   **Direct Reciprocity:** Punisher wasn't involved in the initial interaction.
  *   **Indirect Reciprocity (Reputation):** TPP often occurs anonymously, and the punisher gains no *future* reputation benefit from an anonymous act.
  *   **Network Reciprocity:** Relies on local interactions and reputations; TPP can target strangers outside one's network.
  *   **Punishment (Standard):** Standard models focus on *second-party* punishment (victim punishes offender). TPP requires a distinct motivation ("norm enforcement").
  *   **Partner Choice:** TPP isn't about selecting partners; it's about enforcing norms on interactions one isn't part of.

  **How Mechanisms Fare Against TPP:**
  *   **Cultural Group Selection:** *Best Fit.* Posits group-beneficial norms (including TPP) evolve because groups with more effective norm-enforcers outcompete others. Punisher's cost is offset by group survival. Requires group-level thinking.
  *   **Strong Reciprocity / Social Preferences:** *Possible Fit.* Requires hardwired (evolved) or learned preferences for norm enforcement *as an end in itself*, even at cost. Shifts explanation to proximate mechanisms.
  *   **Costly Signaling:** *Weak Fit.* Signaling "trustworthiness" or "commitment to group" via TPP is possible but strained, especially anonymously. Benefits are indirect and speculative.
  *   **Other Mechanisms:** Largely fail to address TPP directly.

  An adequate theory must deliver on the non-negotiables (1-5), seriously grapple with 10 & 11, and navigate the tensions inherent in the contested preferences (6-9). TPP remains the hardest nut to crack for individual-selection-focused mechanisms.
