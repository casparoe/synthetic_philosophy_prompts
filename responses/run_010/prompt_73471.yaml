prompt: |-
  So I just spent two hours arguing with a friend who's on the same committee as me, and neither of us budged, so I want a third opinion.

  We're five people at a small nonprofit who decide on grant applications. Our standing rule: approve only if the project is (a) likely to have real impact, (b) inside our mission area, and (c) affordable in this year's budget. We voted on each question separately and then on the application as a whole. Impact: three yes. Mission: three yes. Affordability: three yes — a different three each time. Then the actual approve/reject vote came out 5-0 no. It turns out every one of us had at least one objection, we just didn't have the same objections.

  My friend says the committee should approve it, because the committee's position is the majority position on each question, and the majority said yes to all three. I said that's insane — not one person in that room thinks this project should get money, so the committee doesn't think it either. He said I'm counting heads when I should be counting judgments, and anyway if we'd voted in the other order (approve/reject first, then the reasons) we'd have gotten the opposite result, so there's no principled answer and we might as well pick whichever procedure gives the better outcome.

  Which of us is right? Is there a fact of the matter about what the committee believes that isn't just an artifact of the order we happen to take the votes in? And practically — we have to send the board one answer on monday, so what do I put down?
reasoning: |-
  Okay, let me try to unpack this problem. So there's a committee of five people deciding on a grant application. They have three criteria: impact, mission fit, and affordability. They voted separately on each criterion, and each got three "yes" votes. But importantly, it was different members voting yes each time. Then when they voted on the overall approval, it was unanimously rejected. 

  Hmm, the user is caught in a philosophical and procedural dilemma. Their friend argues that since the majority approved each criterion individually, the project should pass. But the user points out that no one actually supports the full package. That's a really interesting tension between procedural formalism and substantive consensus.

  First I need to understand the logical structure. This reminds me of Condorcet's paradox in voting theory, where individual preferences don't aggregate coherently. Each criterion has majority support, but no voter supports all three criteria simultaneously. So when you look at the complete package, there's zero support.

  The friend's argument about vote order is clever but flawed. If they'd voted approve/reject first, they might have rejected it unanimously, but that wouldn't change the underlying reality that no member actually wants this funded. The vote order just reveals different aspects of the same preferences.

  Practically speaking... this reveals a flaw in their voting procedure. By separating the votes, they've created a situation where the formal outcome contradicts actual consensus. They should either require members to vote on the whole package first, or design ballots that capture members' full positions.

  For Monday's decision, the ethical choice is clear: the committee doesn't support this grant. Recording approval when every member objects would be dishonest. But they urgently need to fix their process - maybe by using a single holistic vote, or requiring that at least one member supports all three criteria.

  The user seems frustrated but thoughtful. They recognize this isn't just about winning an argument, but about good governance. I should validate their instinct while offering practical solutions.
answer: |-
  This situation reveals a fascinating flaw in your voting procedure, not a philosophical stalemate. **You are both partially right, but your position reflects the committee's actual will more accurately.** Here's the breakdown:

  ### 1. **The Logical Problem:**
     - **Your Friend's View (Majority on Criteria = Approval):** This treats the three criteria as independent propositions. *Formally*, a majority approved each hurdle. If the rules *only* required separate majority approval of criteria, this view has procedural merit.
     - **Your View (No Individual Supports the Whole Project):** This focuses on the *holistic judgment* required for funding. **No committee member finds the project acceptable overall.** The separate votes obscure this reality. This is the core issue.

  ### 2. **Why Your View is Stronger:**
     - **The Committee's Purpose is Holistic Approval:** Grant approval isn't an abstract "AND" gate for criteria; it's a decision to fund *a specific project*. If *zero* members support funding it after deliberation, the committee *as a body* does not support it, regardless of disaggregated votes. The unanimous "No" on the final vote confirms this.
     - **Voting Order Doesn't Create Equivalence:** Your friend's argument about reversing the vote order is flawed. Voting "Approve/Reject" *first* captures the holistic judgment directly. Voting on criteria *first* creates an artificial construct that can mask dissent (as happened here). The holistic vote is the more meaningful expression of the committee's will regarding *funding the project*.
     - **"No Principled Answer" is Incorrect:** There is a principle: **A project should only be funded if the committee, after deliberation, supports funding it.** The disaggregated vote created a procedural illusion of support that doesn't exist substantively.

  ### 3. **What the Committee "Believes":**
     - **The committee does NOT believe this project should be funded.** The unanimous final vote is the clearest evidence.
     - **The committee DOES believe (by majority) that the project meets each individual criterion.** This is useful *diagnostic* information but is **not equivalent to approval.** Meeting criteria is necessary but not sufficient; the final approval vote is the sufficient condition.

  ### 4. **Practical Solution for Monday:**
     **Recommendation: Reject the application.**
     - **Reason:** "While a majority of the committee found the project met each individual criterion (Impact, Mission Fit, Affordability) when considered separately, a unanimous vote (5-0) rejected the application for funding based on overall assessment. No member supported final approval."
     - **Why this is Honest & Defensible:**
       - It accurately reflects both the disaggregated criteria votes *and* the decisive holistic funding vote.
       - Funding a project that *every member* ultimately voted against is indefensible and undermines trust.
       - It highlights the procedural issue needing immediate fixing.

  ### 5. **Critical Next Step: Fix Your Voting Procedure IMMEDIATELY**
  This situation will recur unless you change how you vote. **Proposed Solutions:**

  | **Voting Method** | **How It Works** | **Why It Solves This Issue** |
  |-------------------|------------------|------------------------------|
  | **Holistic Vote First** | Vote "Approve/Reject" *before* or *instead of* separate criteria votes | Ensures the final funding decision reflects actual support for the whole project |
  | **Conditional Ballot** | Members vote "Approve" only if they support *all three* criteria; otherwise "Reject" | Prevents fragmented approvals by requiring members to support the full package |
  | **Recorded Criteria + Final Vote** | Members publicly state their position on each criterion *before* final vote | Maintains diagnostic info while making dissent patterns visible before final decision |
  | **Require at Least One "Full Supporter"** | Only bring to final vote if at least one member supports all three criteria | Ensures some actual support exists before voting on funding |

  **Do NOT** do nothing. The current system creates the illusion of approval where none exists. Your unanimous rejection vote proves the system is broken.

  **In summary:** You are right that the project shouldn't be funded. Record the rejection clearly, explain the discrepancy to the board, and prioritize fixing your voting rules to prevent this nonsensical outcome in the future. The committee's true position is revealed by the final vote: unanimous rejection.
