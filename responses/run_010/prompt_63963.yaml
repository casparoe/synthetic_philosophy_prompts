prompt: |-
  For about eleven years I have kept a notebook of predictions about matters my neighbours must act on: whether a creek will overtop the low road within a day, whether a late frost will take the blossom, whether a repaired culvert will hold through the spring. I have no training in statistics or in philosophy and I have read nothing on the subject, so please treat the practice I am about to describe as my own invention rather than assuming I am using someone else's vocabulary.

  From the start I have declined to write down a single number. I write two: the lowest chance I can honestly defend and the highest, and I treat everything between them as still open. When new information bears on a prediction I revise both ends, and I do not allow one end to cross the other. Most of the time the band narrows, which feels like learning. But on three or four occasions it has *widened* after I received information, and I have never satisfied myself as to whether that is a flaw in my method to be patched out, or an honest report that the news told me less than I hoped while simultaneously making me less sure of everything nearby. One such case is described below.

  I now coordinate a volunteer group of nine that advises the county on whether to pre-position sandbags, close low-water crossings, and open the shelter. We meet for twenty minutes on a Tuesday, nobody in the group has mathematics beyond arithmetic, and the dispatcher who signs off will accept only a yes or a no. We also publish a record of how often we were right, and that record currently demands single numbers from us, which feels like a betrayal of the whole method.

  What I want from you is a procedure this group could actually run each week, in ordered steps: how wide a band we may honestly write down and when we must widen it rather than pretend to precision; what to do when two members give bands that do not overlap at all; how to choose an action when the low end of the band says stand down and the high end says act; at what point we are obliged to collapse the band into one number, and what number that should be; and whether a band can be scored afterwards for accuracy at all, or whether the act of scoring quietly forces us back to a single figure. Please mark plainly which steps are measurements and which are merely our choosing how cautious to be, and tell me where the procedure will misfire.

  Then run it on three cases. First: a band of 0.25 to 0.70 that the creek tops the road within thirty-six hours, where closing the road costs a forty-minute detour for the school run and six hours of county labour, and leaving it open risks a vehicle in moving water. Second: two members report 0.1 to 0.4 and 0.5 to 0.8 on the same frost, and neither will move. Third, the widening case: we held 0.3 to 0.5 on a freeze, then took a reading from a station whose reliability we have never managed to pin down and whose error has in the past run in both directions, and after revising we were left holding 0.15 to 0.75 — should we act on a band that got wider because of information, and if so on which end?

  At least one of these should come out in a way I will dislike; I would rather be told that now. Finally, if what I have stumbled into has names — the widening, the two-number habit, the rules for acting from one — give me the names, since I need words to use in front of nine people. Do not give me a reading list, citations, or authors to look up; I want terminology, not homework.
reasoning: |-
  Hmm, this is a fascinating and practical problem. The user has developed their own probability band method over eleven years for community decision-making, and now needs a formalized group procedure that maintains integrity while producing actionable outputs. 

  First, let's unpack their core tensions: They're philosophically committed to uncertainty ranges but face institutional pressure for binary decisions. The widening phenomenon particularly troubles them - that rare but valid case where new information increases uncertainty. Their examples reveal three pain points: decision thresholds with conflicting band ends, reconciling non-overlapping expert bands, and handling counterintuitive uncertainty expansion.

  I notice they're allergic to academic jargon but need precise terminology for group coordination. Terms like "uncertainty band" and "reliability discount" might work if framed as practical tools rather than academic concepts. The aversion to citations is strong - they want operational language, not theory.

  Key design challenges emerge:
  - How to preserve the band method's honesty while meeting the dispatcher's binary requirement
  - A transparent conflict resolution protocol for non-overlapping bands
  - Decision rules that don't pretend false precision
  - Scoring that accommodates ranges without collapsing them

  For the widening case, I'm considering a "reliability audit" step before incorporating suspect data. The frost prediction example will likely dissatisfy them because it exposes a fundamental limitation: when experts genuinely disagree, the method can't magically create certainty.

  The scoring solution might be controversial - using the band's midpoint for record-keeping while maintaining internal uncertainty ranges. They'll recognize this as a necessary compromise but may resent the institutional pressure causing it.

  Terminology needs:
  - "Uncertainty band" for their two-number range
  - "Band discipline" for revision rules
  - "Decision threshold" for action triggers
  - "Reliability discount" for questionable data sources
  - "Band collapse" (their term) for final reduction

  The procedure must emphasize when steps are measurements (e.g., calculating weighted midpoints) versus judgment calls (e.g., setting caution levels). Case 2 will highlight this distinction painfully - the measurement gives a 0.1-0.8 band, but deciding to act requires choosing a caution level.
answer: |-
  Below is a complete procedure for your group, designed to preserve the integrity of your "uncertainty band" method while delivering actionable decisions. Terminology is **bolded** where introduced. Steps marked **"Measurement"** rely on calculable inputs; **"Judgment"** steps require group discretion on caution.

  ---

  ### **Group Procedure: Uncertainty Band Protocol**
  1. **Initial Band Submission**  
     Each member writes their honest **uncertainty band** (lowest defensible chance to highest) for the event.  
     *Example: Frost prediction → [0.1, 0.4] and [0.5, 0.8].*  
     **Measurement**: Recording numbers.

  2. **Reconcile Non-Overlapping Bands**  
     - If bands *overlap*: Combine by taking the **outer bounds** (lowest low, highest high).  
       *Example: [0.1, 0.4] and [0.3, 0.6] → [0.1, 0.6].*  
     - If bands *do not overlap* (e.g., [0.1, 0.4] and [0.5, 0.8]):  
       - Calculate the **gap** (0.5 - 0.4 = 0.1).  
       - Widen each band by **half the gap** *outward*:  
         - First band: 0.1 - 0.05 = **0.05**  
         - Second band: 0.8 + 0.05 = **0.85**  
       - Combined band: **[0.05, 0.85]**.  
     **Why**: Forces acknowledgment of disagreement without letting members "hide" uncertainty.  
     **Measurement**: Gap calculation; **Judgment**: Agreeing to widen.

  3. **Revise with New Information**  
     - If new data is from a **reliable source** (known error < ±5%): Narrow the band proportionally to source reliability.  
     - If source is **unreliable** (e.g., past errors in both directions):  
       - Apply a **reliability discount**: Widen the band by 10–30% (group chooses % based on source history).  
       *Example: Original [0.3, 0.5] + unreliable sensor → widen 20% → [0.15, 0.75].*  
     **Judgment**: Deciding source reliability and discount %.

  4. **Make a Decision**  
     - Define **action thresholds** during setup (e.g., "Act if >30% chance of disaster").  
     - Compare the band to thresholds:  
       - If **entire band is below "act" threshold**: Stand down.  
       - If **entire band is above "stand down" threshold**: Act.  
       - If **band straddles a threshold** (e.g., low end says stand down, high end says act):  
         - Calculate the **decision point**: Midpoint of the band.  
         - Act if midpoint > threshold.  
     **Judgment**: Setting thresholds; **Measurement**: Midpoint calculation.

  5. **Collapse the Band for Records**  
     - For scoring, collapse the final band to a **single figure: the midpoint**.  
       *Example: [0.25, 0.70] → 0.475.*  
     - Track accuracy of these midpoints over time.  
     **Why**: Scoring ranges is statistically incoherent; this preserves historical comparison without discarding your method.  
     **Measurement**: Midpoint calculation.

  6. **Widening is Valid**  
     If new information widens the band, **do not reverse it**. This is an **honest uncertainty report**. Proceed to Step 4.

  ---

  ### **Terminology for Your Group**
  - **Uncertainty Band**: Your two-number range (lowest defensible to highest defensible chance).  
  - **Band Discipline**: Rules for revision (no crossing, widen/narrow based on data).  
  - **Reliability Discount**: Penalty applied to bands when using untrustworthy data.  
  - **Decision Point**: Band midpoint used when thresholds are straddled.  
  - **Band Collapse**: Reducing to one number *only* for records.  

  ---

  ### **Case Applications**
  **Case 1: Creek Flooding (Band: 0.25–0.70)**  
  - Costs: Close road (40-min detour + 6 labor hours) vs. Risk vehicle in water.  
  - **Action Thresholds**:  
    - "Act" threshold: >40% chance (cost of action is moderate; risk is high).  
    - Midpoint: (0.25 + 0.70)/2 = **0.475** (47.5%).  
  - **Decision**: 47.5% > 40% → **Close the road**.  
  *Why you might dislike this:* Midpoint ignores your wide band; but thresholds force a choice.

  **Case 2: Frost Prediction (Non-Overlapping Bands: 0.1–0.4 and 0.5–0.8)**  
  - Gap: 0.5 - 0.4 = 0.1.  
  - Widen each band by half-gap (0.05):  
    - New Band 1: [0.1 - 0.05, 0.4 + 0.05] = [0.05, 0.45]  
    - New Band 2: [0.5 - 0.05, 0.8 + 0.05] = [0.45, 0.85]  
  - Combined band: **[0.05, 0.85]**.  
  - **Decision**: Band straddles any reasonable threshold → Use midpoint: (0.05+0.85)/2 = **0.45**.  
    - If "act" threshold is >30% for frost: 45% > 30% → **Act** (e.g., deploy frost protection).  
  *Why you might dislike this:* Forces a wide band from disagreement, but midpoint decides.

  **Case 3: Widening Band (Freeze Prediction: Original 0.3–0.5 → Revised 0.15–0.75)**  
  - Cause: Unreliable sensor reading.  
  - **Action**: Band widened → Use **midpoint**: (0.15 + 0.75)/2 = **0.45**.  
    - If "act" threshold is >40%: 45% > 40% → **Act**.  
  - **Key**: Widening is *correct*; unreliable data increased uncertainty. Midpoint still guides action.  

  ---

  ### **Where the Procedure Misfires**
  1. **Non-overlapping bands** become extremely wide, potentially making midpoints unhelpful (e.g., [0.05, 0.85] midpoint = 0.45).  
     - *Mitigation*: Require members to justify extremes; repeat discussion.  
  2. **Midpoint decisions** ignore band width. A narrow [0.49, 0.51] and wide [0.10, 0.90] both yield midpoint 0.50.  
     - *Mitigation**: Set higher/lower action thresholds for wider bands (e.g., require >55% if band width >0.40).  
  3. **Scoring uses midpoints**, obscuring your band method in records.  
     - *Tradeoff*: Necessary for accountability.  

  ### **Final Note**  
  You’ve independently developed a variant of **interval-valued probability** with elements of **robust Bayesianism**. The widening phenomenon is called **uncertainty inflation** and is defensible when data quality is poor. Your "band collapse" resembles **interval contraction** in decision theory.  

  This system prioritizes transparency over false precision. It will frustrate you when uncertainty is high—but that’s the point.
