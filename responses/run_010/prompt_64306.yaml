  The cruxes section needs concrete cases that could resolve disagreements. For conceptual impossibility, I might propose comparing atrocities with different features (e.g., genocide vs. mass enslavement) to see if consistent rankings emerge. For moral prohibition, I could suggest surveys on whether ranking demeans victims. I'll include predictions from both sides about outcomes and note where they disagree on interpretation.

  I should track the conceptual and moral objections separately as requested. For the context-invariance crux, I'll propose testing whether rankings change based on allocation purpose versus memorial purpose.

  In closing, I'll identify that some disagreement about "severity" might be verbal - the Ranker sees it as multidimensional but comparable, while the Non-Ranker sees dimensions as incommensurable. The substantive disagreement would remain about whether any cross-atrocity comparison is possible or permissible for resource allocation.

