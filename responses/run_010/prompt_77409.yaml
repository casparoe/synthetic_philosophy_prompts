  We are presented with an argument against the "big-history" approach that treats social constructs (money, states, etc.) as collectively imagined orders. The argument is structured in 8 steps and is intended as a reductio ad absurdum of that approach. The goal is to identify which step is faulty and why.

  The core of the argument is that if the thesis (that these orders are imagined) is true, then it itself is an imagined order and thus not true (or false) but merely useful. Therefore, we have no reason to believe it. This is then generalized to all functional or genealogical accounts of belief.

  Let's break down the steps:

  (1) Whether a claim is true or false depends only on whether it corresponds to mind-independent facts.

  (2) On the thesis in question, imagined orders have no such facts behind them.

  (3) So claims made from inside an imagined order ... are neither true nor false; they are coordination devices.

  (4) The thesis itself has come to be widely accepted ... for the kind of reason the thesis says such things are accepted: it does useful work ... flattering readers ...

  (5) So, by (3), the thesis is neither true nor false; it is a coordination device about coordination devices.

  (6) A claim that is merely useful is not one anyone has reason to believe.

  (7) Therefore no one has reason to believe the thesis.

  (8) Therefore, no one has reason to believe any functional or genealogical account of belief (including the ones used by the group and their critics).

  We are to reject one of these steps. Let's examine each.

  First, note that the argument is self-referential: it uses the thesis to undermine itself.

  Consider step (1): This is a statement of correspondence theory of truth. It says that truth is only about correspondence to mind-independent reality. But the thesis in question (the big-history approach) is about social constructs, which are not mind-independent. So if we accept (1), then indeed claims about social constructs (like money being money) are not about mind-independent facts and hence, by (1), are not truth-apt. That leads to (3).

  However, the big-history thesis itself might be seen as a claim about the social world. Is the existence of social constructs a mind-independent fact? The thesis says that these constructs are imagined, so they are mind-dependent. But then, what about the thesis that they are imagined? Is that a mind-independent fact? The argument in (4) says that the thesis is accepted because it is useful, not because it is true. So (4) is applying the thesis to itself.

  Now, step (5) says that by (3) (which applies to claims within an imagined order) the thesis itself is a coordination device and hence not truth-apt. But note: (3) is about claims made from *inside* an imagined order. The thesis in question (that social orders are imagined) is not itself a claim made from inside one of those orders (like money or state). It is a claim about the nature of those orders. So perhaps (3) does not apply to the thesis itself? That is, the thesis is a meta-claim about social constructs, not a first-order claim within a social construct.

  This suggests that step (4) and (5) might be misapplying (3). The thesis is not a claim within the imagined order it describes. It is a claim about that order. Therefore, it might be a candidate for truth or falsity in a way that the first-order claims (like "this is money") are not.

  But let's see: the thesis is that money, states, etc. are imagined orders. This thesis is itself a social construct? According to the thesis, all such beliefs are part of an imagined order? But that would make the thesis self-defeating.

  Alternatively, we might reject step (6): "A claim that is merely useful is not one anyone has reason to believe." This step is crucial for the reductio. But why can't a claim be both useful and true? And even if it is merely useful, does that mean we have no reason to believe it? We might have pragmatic reasons to believe it. Moreover, the thesis does not necessarily say that the beliefs in imagined orders are *only* useful and not true. It says they are maintained because they are useful, but that does not preclude them from being true (if we have a different theory of truth for social constructs).

  But the argument in (3) says that they are neither true nor false because they lack mind-independent facts. So if we stick with correspondence theory, then they are not truth-apt. Then step (6) says that if a claim is not truth-apt (merely useful) then we have no reason to believe it. But note: we might have non-epistemic reasons to believe it (e.g., practical reasons). However, the argument is about having reason to believe the thesis as a true account.

  Another point: step (4) asserts that the thesis is accepted because it is useful and flattering. But is that the only reason? Maybe it is also accepted because it is true? The thesis itself would say that the belief in it is maintained because of its usefulness, but that doesn't necessarily mean it isn't true. This is the genetic fallacy: confusing the origin of a belief with its justification.

  So the mistake might be in step (4) or (5). Specifically, step (4) is an application of the thesis to itself, but it does so by asserting that the thesis is accepted *only* for its usefulness and not for its truth. But the thesis does not say that beliefs are *only* held for their usefulness and never for their truth. It says that the social orders exist because of collective acceptance, and that collective acceptance is driven by functionality. But that doesn't mean that every belief held by an individual is held solely for its functionality. There might be multiple reasons.

  Moreover, the thesis itself might be a candidate for truth. What kind of truth? If we reject (1) and adopt a different theory of truth (for example, a coherence theory or a pragmatic theory) then step (1) is not applicable. Then we might say that the claims about social constructs are true in a different sense. So perhaps the defender of the thesis should reject (1).

  But the question asks: what does the defender surrender by rejecting (1)? If she rejects (1), she gives up the correspondence theory of truth. That might be acceptable for social constructs, but what about other domains? The thesis is about social constructs, but the correspondence theory might still hold for natural facts. So she might adopt a pluralist theory of truth.

  Alternatively, she might reject (2). But (2) seems to be part of the thesis: that imagined orders have no mind-independent facts behind them. That is, they are not grounded in physical reality in the same way as, say, the existence of trees.

  Rejecting (2) would mean that imagined orders do have some mind-independent facts behind them. But that might be contrary to the thesis.

  Accepting (5) and denying (6): If we accept that the thesis is merely a coordination device (not truth-apt) but deny (6) and say that we still have reason to believe it (for practical reasons), then we might avoid the reductio. But then we are admitting that the thesis is not true, but useful. That might be acceptable for a pragmatist, but it undermines the project of giving a true account of social reality. Moreover, the group has been using the thesis to criticize grand narratives, which they presumably take to be false. But if their own account is not true either, then what is the force of their critique?

  So let's summarize the options:

  Option A: Reject (1). Then we can say that truth does not always require correspondence to mind-independent facts. For social constructs, we might have a different standard of truth (e.g., collective acceptance). Then the thesis itself might be true in that sense. We surrender a monolithic correspondence theory of truth. This might be acceptable for social constructivists.

  Option B: Reject (2). But (2) is central to the thesis. If we reject (2), we are saying that imagined orders do have mind-independent facts behind them. That might be a retreat from the strong constructivist position.

  Option C: Accept (5) but deny (6). Then we say the thesis is a coordination device (not truth-apt) but we have pragmatic reasons to believe it. Then the project of accounting for belief in terms of social function can still be pursued as a useful endeavor, even if not as a true theory. But then the critical work (e.g., showing that human rights are imagined) is also merely useful? That might not be satisfying for critical theorists.

  Option D: Reject the application of (3) to the thesis. That is, the thesis is not a claim within an imagined order but a meta-claim about such orders. Therefore, it might be truth-apt. Then we avoid (5). But then we must explain why the thesis itself is not subject to the same analysis. The argument in (4) says that the thesis is accepted for the same functional reasons. So if the thesis is true, then it should be accepted because it is true, not (only) because it is useful. But the thesis says that beliefs in social constructs are held because of their functionality. So the thesis about social constructs might itself be a social construct? This is tricky.

  I think the most promising way out is to reject (1) and adopt a pluralist theory of truth. For natural facts, correspondence might hold; for social facts, truth might be defined in terms of collective acceptance or coherence. Then the thesis itself can be true (as a social fact about social facts). The defender surrenders the idea that truth is always and only correspondence to mind-independent reality. But that is a common move in social ontology.

  Alternatively, we can challenge step (4). Step (4) claims that the thesis is accepted *only* for its functional role (flattering readers). But that is an empirical claim. Maybe it is accepted because it is well-supported by evidence? The thesis does not preclude the possibility of rational belief. It only says that the social orders are maintained by collective acceptance. The belief in the thesis might be held for epistemic reasons. So step (4) is not necessarily true. And without (4), we cannot get to (5).

  But the argument says that the member is using the method of the books: explain belief by the social work it does. So in the context of the group, they are committed to explaining beliefs (including the belief in the thesis) by their social function. So step (4) is being offered as an explanation of why the thesis is believed, using the thesis's own method. Therefore, if the group accepts that method, they must accept (4). But then we are back to the problem.

  However, note that the thesis does not say that *every* belief is held *only* for its social function. It might be that the belief in the thesis is held both because it is well-supported and because it is useful. The social function explanation does not have to be exclusive. So step (4) might be overreaching by saying that the belief is held "for exactly the kind of reason" (i.e., solely for functional reasons). But the thesis doesn't require that; it only says that functional reasons are sufficient to explain the persistence of the belief. So step (4) might be an overstatement.

  But let's look at the argument: (4) says "accepted for exactly the kind of reason the thesis says such things are accepted". The thesis says that imagined orders are accepted because they do useful work. So if the thesis is such an imagined order, then it should be accepted because it does useful work. But is the thesis itself an imagined order? The thesis is about money, states, etc. It is not itself one of those. It is a theory. So perhaps it is not part of the same category.

  Given these complexities, I think the best step to reject is (1). The defender of the thesis should reject the correspondence theory of truth as the only standard. This allows the thesis to be true in a different sense. What is surrendered? A commitment to a naive realism about truth. But in the context of social constructivism, that is often already given up.

  If we reject (1), then step (3) does not follow: claims about imagined orders might be true without corresponding to mind-independent facts. They might correspond to social facts, which are mind-dependent. Then the thesis itself might be true as a social fact.

  Alternatively, if we reject (6), we can say that even if the thesis is not truth-apt (because it's a coordination device) we still have reason to believe it for pragmatic reasons. Then the project survives as a pragmatic enterprise. But that might not be as strong a defense as having a true theory.

  I think the defender of the thesis should reject (1). That is the most straightforward way.

  But let's see what the question says: "I would rather give up (6) than (1)". But the author cannot tell if that is an option.

  If we reject (6), we are saying that we can have non-epistemic reasons to believe a claim. That might be acceptable, but it makes the project less about truth and more about utility. Then the critical work we do (e.g., debunking grand narratives) is not because they are false but because they are less useful? That might be a shift in the critical project.

  Therefore, I recommend rejecting (1). This allows the thesis to be true (in a social sense) and avoids the reductio.

  Now, if we think the argument is sound and (8) is correct, then what survives? The project of accounting for belief in terms of social function would be one that we have no reason to believe. But we might still engage in it for pragmatic reasons (e.g., it is useful). So the project becomes self-consciously pragmatic: we do it because it is helpful, not because it is true. But then we cannot claim that our account is true and the grand narratives are false. We can only say that our account is more useful. That might be acceptable, but it changes the nature of the critique.

  Given that, I think the argument is not sound because step (1) should be rejected.

  So to answer:

  The step to reject is (1). It looks unobjectionable in context because it is a common-sense view of truth. But in the context of social constructs, it is inadequate. The defender surrenders a monolithic correspondence theory of truth and must adopt a more pluralistic or deflationary theory.

  Rejecting (2) would surrender the core idea that imagined orders lack mind-independent facts. That might undermine the thesis.

  Accepting (5) and denying (6) would mean we accept that the thesis is not truth-apt but we have pragmatic reasons to believe it. Then we surrender the idea that the thesis is true, but we keep the project alive as a useful fiction.

