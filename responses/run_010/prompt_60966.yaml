  **The passage genuinely cannot decide Item 4 (chemical treatment)** — Ruskin’s text doesn’t clarify if non-paint material treatments are "deceit." Context (church restoration conventions) would determine this.  

  **Practical advice**: Ruskin’s framework prioritizes authenticity of material and labor. To reduce costs without "deceit," focus on:  
  - Avoiding surface faking (Item 2 is indefensible per Ruskin).  
