  | **1. Cast capitals**            | **Cast-or-machine** (Head 3)       | Believed to *look* hand-carved? (Unclear)    | **No**: Not yet conventional; deceives about labor. | **Condemned**               | If visibly cast and known as such, is it still deceit?  |  
  | **2. Grain wood as oak/marble** | **Surface** (Head 2)               | Invites belief it *is* oak/marble. (False)   | **No**: "Deceptive representation" is explicit deceit. | **Condemned**               | Ruskin condemns "painting surfaces to represent other material." |  
  | **3. Ribbed vault (non-structural)** | **Structural?** (Head 1)           | Ribs appear structural. (False)              | **N/A**                                  | **Admissible**             | §VII: Non-structural ribs are *not deceit* if common practice. |  
  | **4. Chemically treat limestone** | **Surface?** (Head 2)              | Invites belief it *is* soot-aged. (False)    | **Possibly**: If color-matching is conventional in restoration. | **Turns on fact**           | Is this "painting surfaces"? Or honest aging simulation? |  
  | **5. Gild lettering**           | **None**                           | Not believed to be gold. (True per Ruskin)   | **Yes**: Explicitly admissible.         | **Admissible**             | Ruskin endorses gilding as non-deceit in architecture.  |  
  | **6. Hand-carve facsimile**     | **None**                           | Invites belief it *is* original style. (True) | **N/A**                                  | **Admissible**             | No deceit if honestly a replica; labor is authentic.    |  

  ---  

  ### Bottom Line  
  **Ranked from most condemned to least condemned by the passage**:  
  1. **Item 2 (Graining)** — Explicitly deceitful per Head 2.  
  2. **Item 1 (Cast capitals)** — Condemned under Head 3 unless proven conventional.  
