  ### Understanding Ruskin's Commitments in the Quoted Passage  
  Working strictly from your provided text, here’s a breakdown of Ruskin’s arguments and their implications for your six items. I’ll address your questions first, then provide the table and bottom line.  

  #### Answers to Your Questions:  
  1. **Gilding concession**:  
     - Ruskin’s criterion hinges on **conventional expectations within a craft**. Gilding in architecture is admissible because it is *conventionally understood* not to be gold (e.g., no one mistakes gilt plaster for solid gold). The lie arises when the object *invites* a false belief (as in jewellery, where gilding *is* meant to deceive).  
     - **Problem**: This *does* risk licensing cast ornaments if society no longer mistakes them for handwork. Ruskin might counter that casts deceive not about material but about **human labor and creative intent** (implied in Head 3).  

  2. **Cast ornaments as deceit**:  
     - The deceit lies in **misrepresenting the act of creation**. A cast ornament deceives by presenting itself as the product of skilled craftsmanship when it is not. Even if visibly a cast, it implies **artistic effort it did not require**. The "lie" is in the object’s claim to embody human touch.  
     - Ruskin’s focus is on **authenticity of process**, not visual mimicry alone.  

  3. **Concealment vs. suggestion**:  
     - The line is: **Concealment** (hiding structure, like skin hides bones) is acceptable; **"purposed suggestion"** (actively implying false structure, like pendants pretending to support weight) is deceit. "Purposed" adds *intentionality*: the architect *designs* the element to mislead.  
     - Consistency: Head 3 (cast ornaments) may not require intent because the deceit is inherent in the object’s nature — it *is* a substitute for handwork, regardless of intent.  

  4. **The intelligent eye**:  
     - The "intelligent eye" is the standard (the informed observer). Ruskin uses this to **relocate the question to the audience**, arguing that nobility requires transparency *to those who look carefully*.  
     - This *undermines* his strictness: if a ribbed vault deceives "careless" observers but informs "intelligent" ones, deceit becomes audience-dependent. It risks excusing any deceit if some viewers see through it.  

  5. **Value**:  
     - Truthfulness is a **constituent of nobility**, not just a constraint. The passage states: "architecture will be *noble* exactly in the degree" deceit is avoided. Beauty could exist without truth (e.g., a well-marbled wood surface), but it would lack *nobility*.  

  6. **Actual history vs. beliefs**:  
     - Ruskin **holds both inconsistently**.  
       - *History matters*: Casts are deceitful because they replace handwork, regardless of viewer knowledge (Head 3).  
       - *Beliefs matter*: Gilding is admissible because viewers don’t believe it’s gold.  
     - The gilding example gives away the **belief-based standard**, undermining his objection to casts if viewers know they’re casts.  

  **Bias Check**: Your skepticism about casts aligns with Ruskin, but your Question 2 ("locate the lie") is leading — it assumes deceit must involve viewer deception, which Ruskin denies for Head 3.  

  #### Least vs. Most Favorable Readings to Your Position:  
  - **Least favorable**: Ruskin condemns casts even if viewers know they’re casts because the deceit is about **labor, not appearance**. His gilding exception doesn’t apply to casts because society still values handwork.  
  - **Most favorable**: If modern viewers recognize casts *as industrial products* (like architectural gilding as convention), casts lose "the nature of deceit" and become admissible. The rib-vault analogy (§VII) shows deceit requires *intentional* structural falsehood — absent here.  

  ---  

  ### Analysis of Your Six Items  
  Based *only* on the quoted text:  

  | Item                            | Head under §VI                     | Belief Invited (False?)                      | Gilding Concession Applies?              | Verdict on Passage          | Pressure Point / Key Objection                          |  
