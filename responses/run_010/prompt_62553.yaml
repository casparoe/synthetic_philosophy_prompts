answer: |-
  ## Specification for an Adequate Account of When Inside View Yields to Outside View

  **Practical Purpose:** A competent non-specialist (e.g., a research funding manager) must decide whether a specific, novel three-year research programme (e.g., developing a new bio-sensor using an untested material) will finish on schedule, based on available information. Actionability (the ability to make a better decision) is a *testable desideratum*, not assumed.

  **Core Concepts:**
  *   **Inside View:** Focuses on the specific details of the case: the team's expertise, the project plan, perceived risks, technological novelty, initial progress. Relies on causal models, narratives, and unique features.
  *   **Outside View:** Focuses on statistical base rates derived from a relevant reference class of similar past projects (e.g., "novel materials research projects," "bio-sensor development projects," "3-year university research grants"). Ignores case specifics to avoid bias.

  **Requirements for an Adequate Account:**

  *(Marked [N] for Non-Negotiable)*

  1.  **Handle Genuine One-Offs (True Singletons) [N]:**
      *   **Requirement:** Must provide actionable guidance even when no truly relevant historical reference class with frequency data exists (e.g., this specific material/bio-sensor combination is unprecedented).
      *   **Why Requirement?** A key claimed advantage of the outside view is leveraging statistics, but if no relevant statistics exist, the account must still offer a defensible decision procedure without collapsing into arbitrary guesswork. Failing here renders the account useless for genuinely novel endeavours.
      *   **Bearing:** Primarily on **usability** (providing *some* basis for action), secondarily on accuracy (mitigating unfounded optimism/pessimism).

  2.  **Distinguish Genuine Evidence from Optimism/Bias [N]:**
      *   **Requirement:** Must reliably differentiate between case-specific information that constitutes *probative evidence* altering the probability relative to the base rate (e.g., the lead researcher has a proven track record of delivering *this specific type* of complex project early; unique preliminary data solves a key known risk) and information stemming from cognitive biases like overconfidence, planning fallacy, or motivated reasoning (e.g., "our team is exceptional," "we've solved all the hard problems already" without concrete proof).
      *   **Why Requirement?** The core rationale for yielding to the outside view is to counteract predictable biases. An account that cannot tell the difference risks ignoring genuinely diagnostic information or, conversely, being misled by bias disguised as evidence. Failing here undermines the epistemic foundation of the inside/outside view distinction.
      *   **Bearing:** Primarily on **accuracy** (calibration - avoiding systematic error).

  3.  **Account for Systematic Insider Underperformance:**
      *   **Requirement:** Must explain when and why informed insiders (e.g., the research team lead) systematically make worse predictions than a simple base rate derived from an appropriate reference class (e.g., consistently underestimating timelines).
      *   **Why Requirement?** Empirical findings (e.g., in planning fallacy research) show this underperformance occurs frequently. An adequate account must specify the *conditions* under which this happens (e.g., novel tasks, complex causal chains, strong motivational biases) to justify overriding the inside view. It cannot merely assume it always happens.
      *   **Bearing:** Primarily on **accuracy** (resolution - justifying the *use* of the outside view as superior).

  4.  **Resolve the Reference Class Problem [N]:**
      *   **Requirement:** Must provide a justifiable, non-arbitrary rule or procedure for selecting *the* relevant reference class (or weighting multiple classes) when the focal case belongs to many plausible classes with divergent base rates (e.g., "all research projects," "engineering projects," "uni materials science projects," "bio-sensor projects," "projects using novel material X"). Simply "taking the outside view" is incomplete and potentially misleading without this.
      *   **Why Requirement?** This is the fundamental epistemological challenge for the outside view. Without a solution, base rate selection is vulnerable to manipulation ("reference class tennis") or caprice, rendering the resulting prediction unstable and potentially meaningless. The rule must be defensible *a priori*, not just *post hoc*.
      *   **Bearing:** Primarily on **accuracy** (ensuring the base rate is *relevant*), critically linked to **usability** (providing a clear method).

  5.  **Address Reflexivity (Self-Defeating Predictions):**
      *   **Requirement:** Must handle situations where the widespread adoption of the prediction (or the decision based on it) would alter the base rate statistics upon which it was originally made. (e.g., If the prediction "90% of such projects overrun" leads funders to demand excessively padded timelines, future projects might *appear* more on-time, invalidating the original base rate).
      *   **Why Requirement?** In social and decision contexts, predictions can influence behaviour. An account needs to recognise this potential feedback loop to avoid generating its own obsolescence or perverse incentives.
      *   **Bearing:** Primarily on **accuracy over time** and **usability** (ensuring the prediction remains relevant for action).

  6.  **Separate Heuristic from Normative Claims:**
      *   **Requirement:** Must clearly distinguish between advocating deference to base rates as a pragmatic *heuristic* (a useful rule-of-thumb to counteract known biases) versus a strict *normative* requirement (the base rate *is* the correct probability, barring overwhelming specific evidence).
      *   **Why Requirement?** The justification, implications for weighting inside information, and robustness to the reference class problem differ radically between these stances. Conflating them leads to confusion about the account's epistemic status and limits.
      *   **Bearing:** On **clarity of the account itself** (essential for evaluation and teaching), affecting both accuracy and usability interpretations.

  **The Core Tension: Fixed Reference Classes vs. Responsive Evidence Incorporation**

  *   **The Conflict:** Requirement 4 (Reference Class Resolution) demands a non-arbitrary, *a priori* rule for selecting the reference class, often proposed as "fixing it in advance" to prevent motivated class-shopping. Requirement 2 (Distinguishing Genuine Evidence), however, necessitates that genuinely probative case-specific information *can* alter our assessment, which logically includes altering our judgment of *which reference class is most relevant* or *how much to adjust the base rate*.
  *   **Why They Seem Jointly Unsatisfiable:**
      1.  **Fixed Classes Stifle Evidence:** Rigidly pre-defining the reference class ("Always use 'university materials science projects'") ignores potentially diagnostic case information suggesting a *different* class is more relevant (e.g., "This project's key risk is regulatory approval, making 'medical device development projects' more pertinent than purely technical ones"). Genuine evidence about the case's *causal structure* or *key risk drivers* should influence class selection to improve relevance (Accuracy).
      2.  **Responsiveness Enables (Disguised) Shopping:** Allowing case information to influence reference class selection creates an opening for motivated cognition. Self-serving interpretations of "relevance" can be used to select a class with a favourable base rate ("It's really more like 'highly-funded breakthrough projects', which have a better track record"), effectively smuggling the inside view bias back in under the guise of refining the outside view (Accuracy, Usability - vulnerability to bias).
      3.  **The Rule-Making Paradox:** Any *a priori* rule for class selection (e.g., "choose the narrowest class with sufficient data") is itself subject to interpretation and potential bias in application *to the specific case*. Defining what counts as "narrowest" or "sufficient data" requires judgment about the case, reintroducing the inside view at the meta-level. Truly eliminating case-specific judgment from class selection appears impossible without resorting to arbitrary, context-insensitive rules that harm accuracy.

  **The Eliminator: Reference Class Resolution (R4)**

  Requirement 4 (Resolving the Reference Class Problem) eliminates the most contenders. It is the fundamental stumbling block for most proposed accounts:

  1.  **Strict Base-Rate View (Always yield, ignore case specifics):** Fails R4 catastrophically. It provides no rule for choosing *which* base rate to use among the many possibilities. It is vulnerable to reference class tennis and offers no way to handle true one-offs (R1) or incorporate genuine evidence (R2).
  2.  **Always Privilege Inside View (Ignore base rates):** Also fails R4, but by irrelevance. It dismisses the outside view entirely, so the problem of choosing a reference class doesn't arise. However, it fails R3 (ignores systematic insider underperformance) and provides no defence against predictable biases, making it highly vulnerable to inaccuracy.

  **Summary Assessment Against R4:**

  *   The **strict base-rate view** fails R4 because it offers *no solution* to choosing the relevant class, rendering its prescriptions arbitrary or manipulable.
  *   The **always-privilege-inside view** fails R4 implicitly by denying the need for a reference class at all, ignoring the potential value of statistical reality checks and the evidence of systematic bias.
