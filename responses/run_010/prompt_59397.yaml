answer: |-
  ### Official Acknowledgment Classification Procedure  
  **Purpose**: Classify draft texts of state acknowledgment to prevent misrepresentation as apologies. Apply tests in order; stop at first failure unless otherwise noted. Each test is applied to the entire text.  

  ---

  #### 1. Ordered List of Tests for Apology Classification  
  *(Apply sequentially; failure at any necessary test = not an apology.)*  

  | Test | Question to Ask | Pass Condition | Fail Condition | Necessary? | Pragmatic Impact if Failed |
  |------|----------------|---------------|---------------|-----------|---------------------------|
  | **1. Specific Wrong Identified** | Does the text explicitly name the wrongful act(s) (e.g., "forced removals," "discrimination")? | Act is unambiguously named. | Act is vague, implied, or omitted. | **Yes** | Victims may reject as evasion. |
  | **2. Responsibility Accepted** | Does the text state the state (via its agents) bears responsibility? | Uses "we/state accept responsibility" or equivalent. | Denies responsibility, blames past context/regime, or uses passive voice. | **Yes** | Seen as hollow; fails collective agency. |
  | **3. Regret for the Act** | Does the text express regret/sorrow *for the act itself*? | Directly regrets the act (e.g., "sorry for removals"). | Regrets only suffering, outcomes, or uses conditional language (e.g., "if harm occurred"). | **Yes** | Perceived as sympathy, not apology. |
  | **4. Wrongdoing Acknowledged** | Does the text state the act was morally/legally wrong? | Uses "wrong," "unjust," or equivalent. | Justifies act (e.g., "standards of the time") or omits moral judgment. | **Yes** | Reduces to historical record without condemnation. |
  | **5. Addressed to Victims** | Is the text directed to victims/descendants? | Explicit address (e.g., "to the families affected"). | Generic audience (e.g., "to the nation") or unaddressed. | **Yes** | Undermines victim recognition; impersonal. |
  | **6. Disavowal of Act** | Does the text reject the act as unacceptable? | States "should not have happened" or equivalent. | Neutral description or omits disavowal. | **Yes** | Implies act could be repeated; no ethical stance. |
  | **7. Commitment to Change (Advisory)** | Does the text pledge non-repetition or repair? | Concrete steps (e.g., "reform laws," "reparations"). | No commitment or symbolic gestures only (e.g., memorials). | No | Victims may deem apology incomplete. |

  ---

  #### 2. Classification Vocabulary (Non-Apology Acts)  
  *(Apply if any necessary test fails; use tests to determine category.)*  

  | Classification | Definition | Key Tests Passed | Key Tests Failed |
  |----------------|-----------|------------------|-----------------|
  | **Sorrow at Outcome** | Expresses sadness for suffering, detached from state responsibility. | 3 (if for suffering), 7 (optional) | 1, 2, 4, 6 |
  | **Acknowledgment of Fact** | States events occurred neutrally, no moral judgment. | 1 | 2, 3, 4, 5, 6 |
  | **Statement of Sympathy** | Compassion for victims; no link to state acts. | 3 (for suffering), 5 | 1, 2, 4, 6 |
  | **Disavowal of Past Regime** | Condemns prior government; no continuity of responsibility. | 6 | 1 (if vague), 2, 3, 4 |
  | **Commitment to Reform** | Focuses on future change; ignores past wrongs. | 7 | 1, 2, 3, 4, 6 |
  | **Request for Reconciliation** | Seeks relationship repair; omits responsibility. | 5, 7 (optional) | 1, 2, 3, 4, 6 |

  ---

  #### 3. Repairs for Failed Tests  
  *(Minimal fixes; ✱ = requires non-verbal action by the state/minister.)*  

  | Failed Test | Minimal Repair | Rewording-Only? |
  |------------|---------------|----------------|
  | **1. Specific Wrong** | Insert explicit act description (e.g., "for the forced removals"). | Yes |
  | **2. Responsibility** | Add "We accept responsibility." | ✱ **No** (requires state policy change). |
  | **3. Regret for Act** | Replace "sorrow for suffering" with "sorrow for [act]." | Yes |
  | **4. Wrongdoing** | Insert "[Act] was unjust." | Yes |
  | **5. Addressed** | Add "To the victims of [act]." | Yes |
  | **6. Disavowal** | Add "This should not have occurred." | Yes |
  | **7. Commitment** | Add "We commit to ensuring this never recurs." | ✱ **No** (requires budgetary/policy action). |

  ---

  #### 4. Escalate to Minister  
  Hand off if:  
  - **Continuity of responsibility** (Test 2): If the state denies it is the same entity as the past regime.  
  - **Material commitments** (Test 7): If reparations/restitution involve fiscal/political trade-offs.  
  - **Moral gravity**: Whether the act warrants apology vs. other forms (e.g., truth commission).  

  #### 5. What the Procedure Cannot Settle  
  - **Sincerity**: Cannot verify intent.  
  - **Propriety of seeking apology**: Whether an apology should be offered if not requested.  
  - **Victim uptake**: Whether apology is valid without victim acceptance.  
  - **Historical responsibility disputes**: E.g., whether modern citizens inherit guilt.  

  ---

  ### Application to Drafts  
  #### Draft A: Removal of Children Program  
  - **Test 1**: Pass (names removals program).  
  - **Test 2**: Fail (denies responsibility: "no person now living bears responsibility").  
  - **Test 3**: Fail (sorrow for suffering, not the act).  
  - **Test 4**: Fail (justifies act with "standards of its time").  
  - **Test 5**: Pass (addresses families).  
  - **Test 6**: Fail (no disavowal).  
  - **Test 7**: Pass (funding for memorial/review).  
  **Classification**: **Not an apology**. Combines *Sorrow at Outcome* (Tests 3, 7) and *Acknowledgment of Fact* (Test 1).  
  **Failed Tests**: 2, 3, 4, 6.  
  **Repairs**:  
  - Test 2: Requires minister decision on responsibility acceptance (✱ non-verbal).  
  - Test 3: Reword to "sorrow for the removals."  
  - Test 4: Insert "removals were wrong."  
  - Test 6: Add "removals should not have occurred."  
  *Without Test 2 repair, it remains non-apology*.  

  #### Draft B: Detention Without Trial  
  - **Test 1**: Pass (names detention).  
  - **Test 2**: Pass ("accepts responsibility").  
  - **Test 3**: Pass ("expresses regret and shame" for the act).  
  - **Test 4**: Pass ("did wrong").  
  - **Test 5**: Fail (not addressed to victims).  
  - **Test 6**: Pass (disavowal implied by "wrong").  
  - **Test 7**: Fail (no change commitment; disclaimer closes claims).  
  **Classification**: **Not an apology** (fails Test 5). *Statement of Responsibility and Regret* (Tests 1–4, 6).  
  **Failed Tests**: 5.  
  **Repairs**:  
  - Test 5: Add "To those unlawfully detained" (rewording-only).  
  *If repaired, it becomes an apology* (Test 7 failure is pragmatic but not necessary).  

  #### Draft C: Acts of Prior Regime  
  - **Test 1**: Fail ("acts committed" is vague; no specifics).  
  - **Test 2**: Fail (disavows regime but no state responsibility).  
  - **Test 3**: Pass (regret for harms).  
  - **Test 4**: Fail (no moral judgment).  
  - **Test 5**: Fail (unaddressed).  
  - **Test 6**: Pass (disavows regime).  
  - **Test 7**: Fail (no commitment).  
  **Classification**: **Not an apology**. Combines *Disavowal of Past Regime* (Test 6) and *Sorrow at Outcome* (Test 3).  
  **Failed Tests**: 1, 2, 4, 5, 7.  
  **Repairs**:  
  - Test 1: Name specific acts (e.g., "dispossession and discrimination").  
  - Test 2: Requires minister decision on state continuity/responsibility (✱ non-verbal).  
  - Test 4: Insert "these acts were unjust."  
  - Test 5: Add "To the descendants of those harmed."  
  *Without Test 2 repair, it remains non-apology*.  

  ---

  ### Plain Classification  
  - **Draft A**: Not an apology (denies responsibility; justifies wrong).  
  - **Draft B**: Not an apology *as drafted* (unaddressed), but reparable.  
  - **Draft C**: Not an apology (vague, unaddressed, denies responsibility).  
  **Unflattering truth**: None qualify as apologies without repair. Draft B is closest but lacks victim address; Drafts A and C evade state responsibility.
