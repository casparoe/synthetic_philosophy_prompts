prompt: |-
  I serve as senior adviser to the unit of a national government that receives petitions for official acknowledgment of historical wrongs — forced removals of children, detention without trial, dispossession of land, state-sanctioned discrimination in employment and housing. Roughly twenty petitions arrive each year; three or four reach the drafting stage, and each resulting text is read aloud at a public ceremony, entered into the official record, and thereafter cited by claimants' lawyers, by negotiating teams, and by other states weighing comparable questions. The drafting officers who produce these texts are lawyers and historians, not philosophers, and they have no framework for deciding what they are actually producing. The predictable result is that we regularly issue documents described publicly as apologies that do not, on inspection, apologize for anything.

  What I need is a decision procedure the unit can run on any draft text of official acknowledgment in about an hour and that yields a written classification we can defend if it is challenged in public or in a tribunal. Ground the tests in whatever speech-act theory, the philosophy of collective and corporate agency, and the ethics of apology can actually support; where the underlying position is disputed and the procedure must simply choose, I want that flagged as a choice rather than reported as a finding. Please deliver the following:

  1. An ordered list of tests, each phrased so that a non-specialist can apply it to a sentence in a draft, and each with an explicit statement of what counts as passing and what as failing.
  2. A classification vocabulary: the distinct kinds of act a draft might be performing instead of apologizing — sorrow at an outcome, acknowledgment of historical fact, statement of sympathy toward sufferers, disavowal of a past regime, commitment to reform, request for reconciliation — together with the tests that determine placement.
  3. For every test, whether it is conceptually necessary for the text to be an apology at all or merely pragmatically advisable given how such texts are received, and which tests could pass while the document still fails as an apology in the eyes of the people it concerns.
  4. For each failed test, the minimal repair that would restore it, and a clear marking of the repairs that cannot be accomplished by rewording because they require an accompanying act — a named agent accepting responsibility, an acknowledged obligation, some transfer or restitution. The purpose of the procedure is to stop us producing the appearance of apology, not to help us produce it more cheaply.
  5. The points at which the procedure must stop and hand the question to the minister because it is one of value or political judgment rather than of what an apology is.
  6. What the procedure cannot settle under any circumstances — I expect this to include sincerity, whether an apology may properly be sought from a party who has not offered one, and whether the wronged party's uptake is required for the apology to have been given.

  The output must fit on two pages and be usable by drafting officers without further explanation, since every draft passes legal review and then goes to the minister, and I have about a week per case.

  Then run the procedure on the three drafts currently on my desk, and give me the classification, the tests failed, and the repairs available for each.

  Draft A — the text our office considers its strongest work, since it has cleared legal review without amendment. The state expresses profound sorrow for the suffering endured by children and their families under a mid-century program of removals; acknowledges that the suffering was real, widespread, and lasting; observes that the program was conceived in accordance with the beliefs and standards of its time and that no person now living bears responsibility for it; and commits funding to a memorial and to a review of current child-welfare practice.

  Draft B — the minister, speaking for the state, says that the state did wrong, names the wrong as detention without trial carried out by state officials under color of law, accepts responsibility for it on behalf of the state, and expresses regret and shame, closing with a clause providing that the statement neither creates nor implies any legal or financial obligation and that all claims arising from the period are closed.

  Draft C — a petition directed at the present administration concerning acts committed by a prior regime that this administration repudiated and helped to remove. The draft disavows that regime, acknowledges that the present state holds property and advantages acquired during it, and expresses regret for the harms suffered. The petitioners are descendants; the principal representative body has stated it will not accept an apology unaccompanied by reparation, while a second group argues that an official apology will be used to declare the matter closed. The draft nowhere says to whom it is addressed or whether it awaits acceptance.

  Tell me plainly which of the three the procedure classifies as an apology, including where the classification is unflattering to us.
reasoning: |-
  We are creating a decision procedure for classifying official acknowledgment texts. The goal is to determine if a given text is an apology, and if not, what kind of act it is performing. The tests are based on speech-act theory, collective agency, and the ethics of apology.

  The tests for an apology (adapted from standard philosophical accounts) must include:

  1. **Identification of the wrong**: The text must explicitly state what the wrongful act was.
  2. **Acceptance of responsibility**: The apologizing agent must accept that they (or the entity they represent) are responsible for the wrong.
  3. **Expression of regret or remorse**: The text must express regret, remorse, or sorrow for the wrong (not just the suffering).
  4. **Recognition of wrongdoing**: The text must state or imply that the act was wrong (not just unfortunate or causing suffering).
  5. **Addressing the victim**: The apology must be addressed to the victim or their representatives.
  6. **Disavowal of the behavior**: The text must disavow the wrongful behavior (i.e., indicate it should not have happened).
  7. **Commitment to change (optional but often expected)**: A promise not to repeat the wrong and/or to make amends.

  However, note that some of these are necessary and some are advisory. Also, we must account for collective agency (the state as the apologizing agent) and the fact that the state may be a continuing entity.

  We will design an ordered list of tests. Each test is applied to the entire text (not just a sentence) because the act is performed by the whole.

  **Classification Vocabulary (with tests for each)**:

  - **Apology**: All necessary tests (1-6) must pass. Test 7 is advisory.
  - **Expression of sorrow at an outcome**: Expresses sadness about the suffering but without accepting responsibility or acknowledging wrongdoing. (Fails tests 1, 2, 4, 6)
  - **Acknowledgment of historical fact**: States that events occurred without moral judgment or responsibility. (Fails tests 2, 4, 6)
  - **Statement of sympathy**: Expresses compassion for the sufferers but without linking to the state's actions or responsibility. (Fails tests 1, 2, 4, 6)
  - **Disavowal of a past regime**: Distances the current state from a past regime but without accepting responsibility for the past regime's actions (if the current state is seen as continuous, this might not suffice). (May pass test 6 but fails test 2 and often test 1 and 4)
  - **Commitment to reform**: Focuses on future actions without addressing past wrongs. (Fails tests 1, 2, 4, 6)
  - **Request for reconciliation**: Seeks to restore relationship without full acknowledgment of wrong. (Fails tests 1, 2, 4, 6)

  **Necessary vs. Advisory**:

  - Tests 1, 2, 4, 5, and 6 are necessary for an apology. Without any of these, the text is not an apology.
  - Test 3 (expression of regret) is necessary (because without regret, it's not an apology).
  - Test 7 (commitment to change) is advisory: it is often expected and can make the apology more meaningful, but it is not necessary for the speech act of apologizing.

  **Points requiring ministerial decision**:

  - Whether the state (as currently constituted) can be held responsible for the acts of a past regime (if continuity is contested).
  - Whether the wrong is of a kind that the state should apologize for (as opposed to, say, individual perpetrators).
  - Decisions about reparations or other material commitments (since these are political and budgetary).

  **What the procedure cannot settle**:

  - **Sincerity**: We can only check for the presence of the words, not the intent behind them.
  - **Whether an apology may properly be sought from a party who has not offered one**: This is a normative question about who can be asked to apologize.
  - **Uptake by the wronged party**: The procedure cannot determine if the apology is accepted or has the desired effect.

  **Minimal Repairs**:

  - For each failed test, we suggest the minimal rewording that would fix it, unless the repair requires more than words (e.g., accepting legal responsibility, providing reparations). We mark those that require more than words.

  ---

  **Ordered List of Tests for an Apology**:

  *Apply each test to the entire draft.*

  1. **Test 1: Identification of the Wrong**  
     - *Question*: Does the text explicitly state the specific wrongful act(s) for which acknowledgment is being made?  
     - *Pass*: The text clearly describes the act (e.g., "forced removals of children", "detention without trial").  
     - *Fail*: The text only refers to suffering or consequences without naming the act, or is vague.  
     - *Necessary*: Yes. Without it, the apology is not about a specific wrong.  
     - *Minimal Repair*: Insert a clear description of the wrongful act. (Can be done by rewording.)

  2. **Test 2: Acceptance of Responsibility**  
     - *Question*: Does the text state that the state (through its agents) is responsible for the wrongful act?  
     - *Pass*: The text uses phrases like "we accept responsibility" or "the state is responsible" for the act.  
     - *Fail*: The text distances the state (e.g., by attributing the act to a past regime without accepting that the current state is the same entity and responsible) or uses passive voice to avoid attribution.  
     - *Necessary*: Yes. Apology requires the agent to take responsibility.  
     - *Minimal Repair*: Add a sentence accepting state responsibility. (But if the state denies continuity with the past regime, this may require a political decision — mark for minister.)

  3. **Test 3: Expression of Regret or Remorse**  
     - *Question*: Does the text express regret, remorse, or sorrow specifically for the wrongful act (not just for the suffering that resulted)?  
     - *Pass*: The text says "we regret [the wrongful act]" or "we are sorry for [the wrongful act]".  
     - *Fail*: The text expresses sorrow for the suffering or for the event happening, but not for the state's role in causing it.  
     - *Necessary*: Yes.  
     - *Minimal Repair*: Change the expression to target the act (e.g., "we are sorry for [the act]").

  4. **Test 4: Recognition of Wrongdoing**  
     - *Question*: Does the text state or imply that the act was wrong?  
     - *Pass*: The text uses words like "wrong", "unjust", "unlawful", or "immoral" to describe the act.  
     - *Fail*: The text describes the act as a product of its time or as something that caused suffering without condemning it as wrong.  
     - *Necessary*: Yes.  
     - *Minimal Repair*: Insert a phrase that explicitly labels the act as wrong.

  5. **Test 5: Addressing the Victim**  
     - *Question*: Is the text addressed to the victims or their representatives?  
     - *Pass*: The text uses direct address (e.g., "to the victims of X") or clearly states it is speaking to them.  
     - *Fail*: The text is a general statement without addressing the victims.  
     - *Necessary*: Yes.  
     - *Minimal Repair*: Add an address to the victims (by rewording).

  6. **Test 6: Disavowal of the Behavior**  
     - *Question*: Does the text disavow the wrongful behavior (i.e., state that it should not have occurred)?  
     - *Pass*: The text says the act "should not have happened" or "was a mistake", or otherwise condemns it.  
     - *Fail*: The text does not disavow the act, or even justifies it by the standards of the time.  
     - *Necessary*: Yes.  
     - *Minimal Repair*: Add a disavowal (e.g., "We condemn these actions and disavow them").

  7. **Test 7: Commitment to Change (Advisory)**  
     - *Question*: Does the text commit to not repeating the wrong and/or to making amends?  
     - *Pass*: The text includes a promise of non-repetition and/or specific steps toward amends (e.g., reparations, memorials, reforms).  
     - *Fail*: The text has no such commitment.  
     - *Necessary*: No, but failure may lead to rejection by victims.  
     - *Minimal Repair*: Add a commitment to non-repetition and/or amends. (Note: If amends require resources, this may require more than words — mark for minister.)

  **Classification Vocabulary and Tests for Placement**:

  - The classification is determined by which tests pass and which fail. For an apology, tests 1-6 must pass.
  - For other acts, we look at the pattern:
    - **Expression of sorrow at an outcome**: Fails 1, 2, 4, 6. Passes 3 (but about outcome) and maybe 5 and 7.
    - **Acknowledgment of historical fact**: Passes 1 (if it names the event) but fails 2, 4, 6. May pass 5 and 7? Not necessarily.
    - **Statement of sympathy**: Passes 3 (about suffering) and maybe 5, but fails 1, 2, 4, 6.
    - **Disavowal of a past regime**: Passes 6 (disavowal) but fails 2 (if the current state does not accept responsibility for the past regime's acts). May pass 1 and 4? Not necessarily.
    - **Commitment to reform**: Passes 7, but fails 1, 2, 4, 6. (Note: if it also passes 1, 2, 4, 6 then it's an apology with commitment.)
    - **Request for reconciliation**: May pass 5 (addressing the victim) and 7 (commitment to future relationship) but fails 1, 2, 4, 6.

  **Procedure Output**:

  For each draft, run the tests and then classify accordingly.

  ---

  **Application to Draft A**:

  - Test 1: Pass. It identifies the program of removals.
  - Test 2: Fail. It explicitly says "no person now living bears responsibility" and by extension the state (as currently constituted) does not accept responsibility. It attributes the act to past beliefs and standards.
  - Test 3: Pass. It expresses sorrow for the suffering, but note: the sorrow is for the suffering, not for the act. However, the test requires regret for the act. So we must check: does it express regret for the act? The text says: "expresses profound sorrow for the suffering". This is not the same as sorrow for the act. Therefore, Test 3 fails because the regret is not for the act but for the suffering. (But note: in natural language, sorrow for the suffering might be taken as regret for the act. However, the test requires explicit connection to the act. Without that, it fails.)
  - Test 4: Fail. It does not state the act was wrong. It says the program was "conceived in accordance with the beliefs and standards of its time", which justifies it.
  - Test 5: Pass. It is addressed to the children and families (implied by "suffering endured by children and their families").
  - Test 6: Fail. It does not disavow the behavior. Instead, it contextualizes it as a product of its time.
  - Test 7: Pass. It commits funding to a memorial and review.

  Classification: Not an apology. It fails tests 2, 3 (if strictly interpreted), 4, 6. It is primarily an expression of sorrow at an outcome and an acknowledgment of historical fact, with a commitment to a memorial and review.

  Repairs:
  - Test 2: Requires the state to accept responsibility. This is a political decision and cannot be done by rewording alone. (Flag for minister)
  - Test 3: Reword to express sorrow for the act: "We express profound sorrow for having removed children from their families."
  - Test 4: Insert a phrase: "We now recognize that this program was wrong."
  - Test 6: Insert a disavowal: "We disavow the forced removal of children as a grave injustice."

  But note: without fixing Test 2 (responsibility), it still won't be an apology.

  **Draft A Classification**: Expression of sorrow at an outcome, acknowledgment of historical fact, and commitment to reform. Not an apology.

  ---

  **Application to Draft B**:

  - Test 1: Pass. It names the wrong: "detention without trial".
  - Test 2: Pass. "accepts responsibility for it on behalf of the state".
  - Test 3: Pass. "expresses regret and shame". (Regret for the act? The text says: "expresses regret and shame" — it is implied that this is for the act. The test requires regret for the act. The text does not specify the object of regret, but given the context, it is for the act. We pass.)
  - Test 4: Pass. It says the state "did wrong".
  - Test 5: The text does not explicitly address the victims. It is a statement about the state's actions. (Fail)
  - Test 6: Pass. Accepting responsibility and calling it wrong implies disavowal.
  - Test 7: Fail. There is no commitment to change. Moreover, it explicitly disclaims any obligation and closes all claims.

  Classification: Almost an apology but fails Test 5 (addressing the victim). Also, the disclaimer about obligations and closing claims might undermine the apology, but that is not a formal test. However, without Test 5, it is not an apology.

  Repairs:
  - Test 5: Reword to address the victims: "To the victims of detention without trial, we express ..."

  But note: the disclaimer clause might be problematic for the victims' acceptance, but that is beyond the tests. Also, the lack of commitment (Test 7) is not necessary but may be expected.

  **Draft B Classification**: It fails as an apology only on Test 5. With that repair, it would be an apology. Without repair, it is a statement of responsibility and regret, but not an apology because it is not addressed to the victims.

  ---

  **Application to Draft C**:

  - Test 1: Pass. It acknowledges the acts committed by the prior regime (though it doesn't specify what acts, it is in the context of the petition which is about dispossession and discrimination? The draft says: "acknowledges that the present state holds property and advantages acquired during it, and expresses regret for the harms suffered." It does not explicitly state the wrongful acts. However, the context of the petition is known. But the test requires explicit statement. So we must check: does it name the acts? The text says "acts committed by a prior regime" — too vague? The draft also says "harms suffered" without naming the acts. Therefore, Test 1 fails. (Note: the petition is about specific acts, but the draft does not name them.)
  - Test 2: Fail. The present state disavows the regime but does not accept responsibility for the acts. It only acknowledges holding property from that time.
  - Test 3: Pass. It expresses regret for the harms.
  - Test 4: Fail. It does not state that the acts were wrong. It only regrets the harms.
  - Test 5: Fail. It does not say to whom it is addressed.
  - Test 6: Pass. It disavows the regime (which implies disavowing its acts?).
  - Test 7: Fail. There is no commitment to change or reparations.

  Classification: Not an apology. It fails tests 1, 2, 4, 5, 7. It is primarily a disavowal of a past regime and an expression of regret for harms.

  Repairs:
  - Test 1: Name the specific wrongful acts (rewording).
  - Test 2: This is a political decision about continuity and responsibility. Without accepting responsibility, it cannot be an apology. (Flag for minister)
  - Test 4: Insert a phrase: "We recognize that these acts were wrong."
  - Test 5: Address the victims: "To the descendants of those who suffered ..."

  But without Test 2, it still won't be an apology.

  **Draft C Classification**: Disavowal of a past regime and expression of regret for harms. Not an apology.

  ---

  **Summary**:

  - Draft A: Not an apology. Fails tests 2, 3 (arguably), 4, 6. Classification: Expression of sorrow at an outcome and acknowledgment of historical fact, with commitment to reform.
  - Draft B: Not an apology (fails test 5). Classification: Statement of responsibility and regret. With repair (addressing the victim) it would be an apology.
  - Draft C: Not an apology. Fails tests 1, 2, 4, 5. Classification: Disavowal of a past regime and expression of regret for harms.

  None of the three drafts fully qualifies as an apology. Draft B is the closest and can be fixed by rewording. Draft A and C require more than rewording (acceptance of responsibility) which is a political decision.

  **Note**: The procedure does not judge sincerity or the likelihood of acceptance by victims.

