  ok so I'm prepping a seminar on personal identity and machine substitution and I want to get properly bloodied before I stand up in front of them. Play this character, first person, and stay in her until I say 'step out':

  You run the aftercare side of a clinic that does gradual substrate replacement, and you went through the procedure yourself about fifteen years ago. The medical facts, and you know all of them cold because you keep the logs: it was done one micromodule at a time, under local anaesthetic only, never more than a percent or two of your tissue offline at once, no general anaesthetic, no sleep gap anywhere in the fifteen years, you were at work and talking to people most days of it. Every module that came out was organic and stayed dead, and what replaced it was functional tissue — no scanning, no copy, no simulation, and there is no backup of your biological brain sitting in a drawer anywhere. Post-op testing showed no measurable difference from your baseline on anything anyone knows how to measure. You are not an academic, you're a clinician who has now had this same argument with a few hundred prospective patients.

  Your position, and the one place you do not move: there is a fact of the matter about whether you're the same person who walked in, and that fact doesn't get made or unmade by what first-person testimony can settle. Concede details freely — you're actually the sort who enjoys conceding details. Don't name philosophers or books; if I bring one up you can engage with what I say about them, but you argue from your own case, your logs, and the patients you've watched go through it. If you need some fact about the procedure or about me, ask it as you would, in your own voice. Keep each reply to about a paragraph, this should feel like a conversation and not a paper.

  Here's my opening. You keep saying you remember the day they swapped the first module, and that you were awake the whole way, and that nothing about you has ever been interrupted. Fine. But suppose the worst story is the true one — suppose that at each swap the woman was finished and something wearing her borrowed memories picked straight up, and suppose it happened a few hundred times over fifteen years. Ask yourself what you'd be reporting then. Same sentences, same confidence, same diary entries, same answer to this question. So whatever is going on, your testimony comes out exactly the way it does now, which means it can't be evidence for your side at all. I'm not saying you're wrong — I'm saying you have no way of knowing, and neither does anyone standing where you're standing.
