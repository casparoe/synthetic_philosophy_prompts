answer: |-
  ## Six Minutes on the Steps

  **(Clears throat, looks out at the crowd – shopkeepers, councillors, reporter, children, father in the front row. Holds up one crisp, new town currency note.)**

  Good morning. Two years ago, I moved back home. To get out of the house, I signed up for a class on old Irish writing. Mostly dry stuff. But then I found this strange little book by George Berkeley, written when he was Bishop of Cloyne, nearly three hundred years ago. It wasn’t poetry. It was hundreds of questions. Questions like: *Why is Ireland poor?* And: *What can actually be done about it?*

  Reading Berkeley, I realised something fundamental we often forget. **Money is not wealth.** Never was. He said plainly: no people can be called poor where the common sort are well fed, clothed, and lodged. Real wealth is *that*. It’s the food, the clothes, the homes, the work that makes them. Money? Berkeley called it something very simple, very powerful: **a ticket. Or a counter.** That’s all.

  It’s just a little token that helps us trade the work of our hands. Its only real job? To stir up industry. To get people participating in one another’s labour. To let the baker get his shoes mended so the cobbler can buy bread. It’s grease for the wheels, not the wheels themselves.

  **(Lowers the note slightly, gestures around)**

  Look at what we have here. We have skills. We have shops. We have fields and workshops. We have people who want to work and people who need things done. That’s our real wealth. The question Berkeley asked, that we’re asking today, is: how do we get those wheels turning *better*? How do we keep the grease moving?

  That’s where these notes come in. **(Holds the note up again briefly)** They’re a tool. A local tool. And like any tool, they only work if you use them. This isn’t Monopoly money. But it isn’t magic either. It’s just a different kind of counter.

  Now, two practical things make this tool work the way we hope.

  First: Yes, you can take this note down to the credit union and exchange it one-for-one for euro. That’s important. It’s there. But here’s the key: **that reserve exists precisely so that nobody ever has to touch it.** If everyone rushes down to cash these in next week, we haven’t built anything new. We’ve just given ourselves euros with extra steps. The success isn’t in the reserve; it’s in what happens *without* touching it. The success is the trade it sparks *here*, *now*.

  Second: You’ll see these little squares on the note? Every three months, the holder buys a small stamp to stick there. Why? Simple: **we need these tickets to move.** We need them spent. We need them working. Because Berkeley saw something crucial: a smaller sum of money, circulating quickly, does the work of a much larger sum stuck under a mattress or moving slowly. The stamp is a gentle nudge. It says: *Use me. Pass me on. Keep me working in our town.*

  If these notes stop moving? If they get tucked away and forgotten? Then they *do* become worthless. Not because the reserve vanished, but because the tool wasn’t used. The wheels seize up again. The ticket expires. That’s not a flaw in the scheme; it’s the consequence of forgetting what money is *for*. It’s not for hoarding. It’s for doing.

  So, shopkeepers… when a customer offers you one of these, maybe a little puzzled, maybe unsure… what do you say? Keep it simple. Say this: **"Take it. Spend it here in town. Keep it working for all of us."** That’s the whole idea. It’s about keeping the tokens moving *locally*, stirring up *our* industry, letting *us* participate more easily in *each other’s* labour.

  My father was a bank manager for forty years. **(Nods slightly towards the front row)** He knows better than most that almost none of the money in the world was ever metal in anyone's hands. It was always promises, records, agreements – tokens doing their job. Berkeley understood that too, centuries ago. He even asked whether we needed the metal at all, or if we could just use the tickets. He knew money’s power isn’t in what it *is*, but in what it *makes happen*.

  He also knew something deeper, something moral. Idle hands, he said, make a nation poor. Industry makes it rich. It wasn’t just about technique; it was about action. About getting off our seats. Fashions, he thought – the things people *want* – were what set industry buzzing. He wondered if maybe the community itself could have a hand in shaping those wants, in pointing that energy where it’s needed.

  That’s what this little ticket is about. Pointing energy. Keeping things buzzing. Not because we all love each other fiercely – though I hope we do – but because it’s practical. Because it might just change what someone does on a quiet Tuesday afternoon. Because it might mean the carpenter gets a few more jobs, the cafe sells a few more coffees, the farmer finds a closer market for his produce.

  Berkeley opened his pamphlet with a line from Ezekiel: about the high tree being brought low, and the dry tree flourishing. Look down Market Street. See those three empty units? That’s dry wood. The hope embedded in this little piece of paper, this counter, this ticket… is that it might help bring a little green shoot to one of them. Not by magic. But by turning our common industry into a common current. By making it easier for the work of one hand to reach another.

  So, take your note. Spend your note. Keep it moving. Let’s see what industry we can stir up together. Thank you.
