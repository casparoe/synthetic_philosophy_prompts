  The most discriminatory criterion is likely "no exploitation in recurring interactions" - it eliminates naive myopic theories but also challenges standard dynamic consistency when preferences shift endogenously. Neutrality is impossible at the desiderata level; the list will always reflect underlying meta-commitments about rationality's nature.
answer: |-
  Below is a structured list of desiderata for an adequate theory of diachronic rational choice, designed for neutrality where possible and explicit bias where not. Each desideratum is presented with: (1) its motivating case, (2) classification as **non-negotiable** (essential for coherence) or **taste** (theoretically optional), and (3) status as **genuine requirement** (camp-neutral) or **substantive commitment** (disguised school-specific axiom). The list targets your specified cases and structural concerns.

  ---

  ### **Desiderata for Diachronic Rational Choice Theories**

  1. **Avoidance of Strictly Dominated Outcomes**  
     - **Motivation**: Standard money pump (cyclic preferences) and parity-breaking pump (each trade is a genuine improvement). An agent repeatedly paying to return to the start faces a sure loss.  
     - **Non-negotiable**: Yes (theories permitting systematic exploitation lose normative force).  
     - **Genuine requirement**: **Substantive commitment**. *Bias*: Favors consequentialist/global views. Rejects theories that deem locally rational choices sufficient even when they guarantee overall loss.  

  2. **Local Rationality**  
     - **Motivation**: An agent who acts optimally at each node given *current* preferences/information, yet ends up worse off. If this is irrational, the flaw must lie beyond local choice.  
     - **Non-negotiable**: **Taste**.  
     - **Genuine requirement**: **Substantive commitment**. *Bias*: Assumes separability of nodes (demanded by myopic/naive choice theories). Rejected by holistic views where "local rationality" is incoherent without global context.  

  3. **Temporal Neutrality**  
     - **Motivation**: Backward-looking foresight (anticipating future choices) vs. commitment (sticking to a plan despite shifting preferences) both avoid money pumps. Must both be permissible?  
     - **Non-negotiable**: No.  
     - **Genuine requirement**: **Substantive commitment**. *Bias*: Privileges dynamic consistency (foresight) over plan-sticking. Neutrality here is impossible—endorsing both leads to contradictions when plans conflict with current preferences.  

  4. **Recurrence-Invariance**  
     - **Motivation**: Does the verdict change if the pump occurs once vs. infinitely? A one-off pump may be "cheap learning"; infinite pumps imply exploitation.  
     - **Non-negotiable**: Yes (rationality shouldn’t hinge on accident of repetition).  
     - **Genuine requirement**: **Genuine requirement**. *Neutral*: Adequate theories must explain why exploitation is unacceptable regardless of frequency.  

  5. **Endogenous Preference Change Assessment**  
     - **Motivation**: Distinguishing rational preference shifts (e.g., learning) from manipulative steering (e.g., trades altering preferences via framing).  
     - **Non-negotiable**: Yes.  
     - **Genuine requirement**: **Genuine requirement**. *Neutral*: Any theory must account for *why* preferences change, not just that they do.  

  6. **Self-Binding Permissibility**  
     - **Motivation**: Ulysses scenarios—taking a locally suboptimal action to prevent future losses (e.g., paying to avoid a pump).  
     - **Non-negotiable**: **Taste**.  
     - **Genuine requirement**: **Substantive commitment**. *Bias*: Favors sophistication/commitment theories. Rejects myopic views that forbid actions unjustified by current preferences.  

  7. **Bounded Cognition Compatibility**  
     - **Motivation**: Agents who lack computational resources to foresee long sequences or identify cycles.  
     - **Non-negotiable**: Yes (else the theory is inapplicable to humans).  
     - **Genuine requirement**: **Genuine requirement**. *Neutral*: Norms must be feasible for agents with limited foresight/memory.  

  8. **Deliberative Availability**  
     - **Motivation**: Can agents use the theory’s norms *during* decision-making? Theories requiring god’s-eye view (e.g., full tree traversal) fail this.  
     - **Non-negotiable**: Yes (practical rationality requires usability).  
     - **Genuine requirement**: **Genuine requirement**. *Neutral*: Unusable norms are not norms for *choice*.  

  9. **Normative Target Flexibility**  
     - **Motivation**: Must specify whether norms bind acts, plans, dispositions, or preferences. Theories assuming this upfront beg key questions (e.g., "plans are primary" vs. "acts are primary").  
     - **Non-negotiable**: **Taste**.  
     - **Genuine requirement**: **Substantive commitment**. *Bias*: Reflects a meta-commitment about rationality’s locus (e.g., dispositional theories vs. act-based).  

  ---

  ### **Structural Conflicts & Key Insights**
  - **Irreconcilable Triad**: The combination of **No-Sure-Loss** (Des. 1), **Local Rationality** (Des. 2), and **Foresight Independence** (implied by Des. 7–8) *cannot* be jointly satisfied.  
    - *Proof*: In a parity-breaking money pump, each trade is a genuine local improvement (satisfying Local Rationality). An agent with bounded cognition (Foresight Independence) cannot foresee the cycle and thus engages in all trades, suffering sure loss (violating No-Sure-Loss). Resolving this requires abandoning one desideratum:  
      - Reject Local Rationality (e.g., require global foresight).  
      - Reject No-Sure-Loss (e.g., accept pumps as rational).  
      - Reject Foresight Independence (e.g., demand unbounded cognition).  
    - *Verdict*: This is a **real result**, not an artifact. Theories *must* choose which to sacrifice.  

  - **Most Discriminatory Desideratum**: **Avoidance of Strictly Dominated Outcomes** (Des. 1) eliminates the most candidates (e.g., myopic choice theories) and is the core stake in money pump debates.  

  - **Neutrality Achievable?** No. Desiderata like Local Rationality and Self-Binding Permissibility are inherently partisan. A "neutral" list would be vacuously weak. The debate’s framing often obscures that **separability of nodes** (assuming choices can be judged in isolation) is a substantive commitment, not a neutral starting point.  

  ---

  ### **Assessment of Major Theories**
  - **Dynamic Consistency (e.g., Strotz, Pollak)**: Requires choices to align with prior plans unless preferences change exogenously. *Scores well* on No-Sure-Loss (avoids pumps via foresight) and Recurrence-Invariance. *Fails* Local Rationality (later acts may violate current preferences), Bounded Cognition (requires full foresight), and Self-Binding (forbids Ulysses acts as "inconsistent").  
  - **Plan Commitment (e.g., Gauthier, McClennen)**: Privileges sticking to adopted plans. *Scores well* on No-Sure-Loss and Self-Binding. *Fails* Temporal Neutrality (rejects foresight-only approaches) and Local Rationality (plan adherence may override current preferences).  
  - **Backward-Looking Foresight (e.g., sophisticated choice)**: Choices based on predicting future actions. *Scores well* on No-Sure-Loss and Bounded Cognition (minimal computation). *Fails* Self-Binding (cannot take Ulysses actions) and Endogenous Change (treats preferences as fixed).  
  - **Pump-Denial (e.g., non-Archimedean preferences)**: Claims money pumps are illusory (e.g., small losses aren’t truly improvements). *Fails* Avoidance of Dominated Outcomes (tolerates exploitation) and Recurrence-Invariance (pumps worsen with repetition).  
  - **Dispositional (e.g., Nozick)**: Norms attach to traits (e.g., steadfastness). *Scores well* on Deliberative Availability and Self-Binding. *Fails* Local Rationality (dispositions aren’t chosen at nodes) and Endogenous Change (cannot assess preference shifts).  

  **Conclusion**: No theory satisfies all desiderata. **Dynamic consistency** handles pumps best but demands unrealistic foresight; **plan commitment** is more feasible but dogmatic. The money pump *does* reveal agent irrationality—but only if we accept No-Sure-Loss as non-negotiable, which itself is a substantive choice. Your trilemma is genuine: rationality cannot be fully local, loss-avoiding, and feasible for bounded agents.
