answer: |-
  ### 1. Precise Theses Expressed by "A white horse is not a horse"  
  *(With verdict and justification)*  

  1. **Semantic Non-Identity of Names**:  
     The *name* "white horse" is not identical to the *name* "horse".  
     **Verdict**: Non-trivially true.  
     **Justification**: Names differ in syntactic composition and referential conditions ("horse" names form; "white horse" names form+color).  

  2. **Denial of Class Membership**:  
     There exists a white horse that is not a horse. (∃x(Wx ∧ Hx) → ¬Hx)  
     **Verdict**: False.  
     **Justification**: Contradicts the premise that all white horses are horses. Literal quantification is invalid.  

  3. **Denial of Class Identity**:  
     The class of white horses ≠ the class of horses. (WH ≠ H)  
     **Verdict**: Trivially true.  
     **Justification**: WH is a proper subset of H (barring universal whiteness), so they are extensionally distinct.  

  4. **Denial of Intensional Identity**:  
     The *sense* (intension) of "white horse" ≠ the *sense* of "horse".  
     **Verdict**: Non-trivially true.  
     **Justification**: "White horse" connotes coloration absent in "horse"; substitution in requests fails (e.g., asking for "horse" vs. "white horse").  

  5. **Mereological Non-Identity**:  
     A white horse is a composite entity (horse + whiteness), not identical to its component "horse". (W⊕H ≠ H)  
     **Verdict**: Non-trivially true.  
     **Justification**: The whole (compound) possesses properties (e.g., color-restriction) not held by the part "horse".  

  6. **Realist Non-Identity**:  
     The universal *Horseness* combined with *Whiteness* yields a distinct entity from *Horseness* alone.  
     **Verdict**: Non-trivially true.  
     **Justification**: Combinatorial realism: fusion of universals creates a new, complex universal with stricter identity conditions.  

  7. **Naming Standards**:  
     "Horse" correctly names *only* the essential form, while "white horse" names a qualified instance; thus, the latter is not a correct name for "horse".  
     **Verdict**: Indeterminate (context-dependent).  
     **Justification**: True if naming requires exact correspondence to essence; false if naming tolerates accidental properties.  

  ---

  ### 2. Support from Arguments  
  - **First Argument** (Shape/Color Separation):  
    Supports (1) Semantic, (4) Intensional, (7) Naming Standards.  
    *Cannot carry more*: It addresses naming, not ontology.  
  - **Argument from Requests**:  
    Supports (3) Class Non-Identity, (4) Intensional.  
    *Carries more*: Shows terms are not interchangeable, implying intensional difference.  
  - **Reply to Objection** (Separated/Combined):  
    Supports (5) Mereological, (6) Realist.  
    *Carries more*: Assumes compositionality ("horse" as component).  
  - **Color Exclusion Argument**:  
    Supports (4) Intensional, (5) Mereological.  
    *Carries more*: Implies compound terms impose additional constraints.  

  ---

  ### 3. Compatibility with Interlocutor's Reply  
  The reply ("separated-off/combined-with") is **only compatible** with:  
  - (5) Mereological (horse as part vs. compound whole)  
  - (6) Realist (whiteness + horseness as fusion)  
  - (7) Naming Standards (naming the compound vs. essence)  

  **Mass-Term Interpretation**:  
  The nouns behave like mass terms (e.g., "horse" as "horseness"), supporting (5) and (6). If "horse" denotes a homogeneous kind (like "water"), adding "white" creates a qualified sub-kind, not identical to the base kind. This avoids class-membership contradictions.  

  ---

  ### 4. Side Questions  
  - **Hardness/Whiteness in Stone**:  
    Enlarges support for (5) Mereological and (6) Realist readings. If properties are discernible only separately, compounds are irreducible to components.  
  - **Disputation Context**:  
    Yes, it matters. The thesis may exploit ambiguity for dialectical effect, making (1), (4), or (7) strategically viable without doctrinal commitment to (2) or (3).  

  ---

  ### 5. Student Positions & Viability  
  - **First Student** (Logic): Relied on (4) *Intensional Non-Identity*. Correct that this is non-trivially true and logical.  
  - **Second Student** (Eristic): Attacked (2) *Class Membership* (false) and (3) *Class Identity* (trivial). Charges land here but miss stronger readings.  

  **Charges**:  
  - Triviality: Lands on (3) Class Non-Identity (obvious subset relation).  
  - Falsehood: Lands on (2) Class Membership (contradicts taxonomy).  

  **Interesting and True Reading**:  
  (5) *Mereological Non-Identity* is both non-trivial and defensible.  
  **What Must Be Given Up**:  
  - Class-based semantics (if "horse" is a mass term, not a count noun denoting a set).  
  - Extensional equivalence as criterion for term identity.  

  **Formal Summary**:  
  The viable core is:  
  - *Extensionally*: "White horse" ⊂ "horse", so WH ≠ H (trivial).  
  - *Intensionally*: Sense("white horse") ≠ Sense("horse") (non-trivial).  
  - *Mereologically*: (H ⊕ W) ≠ H (non-trivial).  
  The sentence's surface grammar misleads; its arguments target intensional/mereological distinctions, not existential claims.
