  We are going to restate the two cosmological arguments (kalam and PSR) in the vocabulary of dependent type theory and proof theory. We'll address each point as requested.

  ## Preliminaries: Grounding Relations

  We model grounding relations as a type-theoretic context of justifications. Each entity (or fact) is represented by a type, and a grounding for it is a term of that type. A grounding relation from A to B might be represented as a function from B to A (if we think of A as grounding B) or perhaps as a function from A to B (if we think of A explaining B). The exact direction may vary by argument. We will be precise.

  We assume that the grounding relation is represented by a binary relation on a set of entities (or facts) and that we are building a derivation (a proof term) for each entity. The goal is to see how the arguments translate into properties of these derivations.

  ## 1. The Kalam Argument and the Actual Infinite

