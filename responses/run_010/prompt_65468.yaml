answer: |-
  ### Restatement of the Cosmological Arguments in Proof-Theoretic Terms

  #### **1. Kalam's Ban on Actual Infinite**
  - **Original Claim**: An infinite past is a completed infinite totality, which is impossible (ban on actual infinity).
  - **Formal Interpretation**: 
    - An infinite past is modeled as an infinitely descending chain in the grounding relation (causation): \( \dots \to e_{-3} \to e_{-2} \to e_{-1} \to e_0 \).
    - **Well-foundedness vs. Coinduction**: 
      - This chain resembles a **non-terminating computation** (rejected by termination checkers), not a coinductive stream.
      - **Distinction from Coinductive Streams**: 
        - Coinductive streams (e.g., `Stream Nat`) are **productive**: generated from a starting point and corecursive rule (e.g., `nats_from n := n :: nats_from (n+1)`).
        - An infinite past lacks a starting point and is **non-productive** (no base case). It is closer to an infinitely descending chain (e.g., `bad : Nat := bad + 1`), which termination checkers reject.
    - **Potential vs. Actual Infinity**: 
      - **Potential infinity**: Inductive types (e.g., `Nat`), which are always finite at each step.
      - **Actual infinity**: Coinductive types (e.g., `Stream`), which are completed infinite objects.
      - Kalam's "actual infinite" forbids **completed infinite totalities without a generative origin**. This maps to a **well-foundedness requirement** for grounding relations.
  - **Argument's Survival**: 
    - The ban translates to a **well-foundedness constraint** on causation. If causation is well-founded, an infinite past is invalid. 
    - **Distortion**: Coinductive streams are allowed in your framework, but they require a starting point. The past, as a beginningless chain, lacks this and is excluded. The force survives if causation is deemed inherently well-founded.

  ---

  #### **2. Principle of Sufficient Reason (PSR) as Completeness**
  - **Original Claim**: Every contingent fact has an explanation (derivable from axioms).
  - **Formal Interpretation**: 
    - PSR demands **completeness**: Every truth (type) is inhabited by a proof (term) from axioms.
    - **Internal Coherence**: 
      - For systems encoding arithmetic (via contingent facts), **Gödel incompleteness** applies: there are truths unprovable within the system. 
      - PSR requires explaining **all contingent facts** (a possibly infinite set) with **necessary facts** (axioms). This implies a **well-founded derivation tree** rooted in axioms.
    - **Dependent Product**: 
      - PSR requires a term in the dependent product \( \Pi_{(c:\text{Contingent})} \text{Explanation}(c) \), meaning a uniform derivation for all contingent facts.
  - **Argument's Survival**: 
    - **Completeness fails** for systems strong enough to self-reference (Gödel). 
    - PSR survives only as a **well-foundedness requirement**: Contingent facts derive from necessary axioms, avoiding circularity. The completeness aspect is **internally incoherent** for rich systems.

  ---

  #### **3. Necessary Being as Self-Explanatory**
  - **Original Claim**: The necessary being is self-explanatory (a fixed point of grounding).
  - **Formal Interpretation**: 
    - **Circularity vs. Guardedness**: 
      - **Circular derivation**: `x : T := \cdots x \cdots` (unguarded, rejected by kernel).
      - **Guarded corecursion**: `s : Stream A := a :: s` (guarded by `::`, accepted).
    - **Necessary Being**: 
      - Must be a **nonderived base case** (an axiom: `god : NecessaryBeing`), not a circular proof. 
      - Self-explanatory translates to **inhabitation by definition** (e.g., `NecessaryBeing` is defined to exist).
  - **Argument's Survival**: 
    - The necessary being is an **axiom**, terminating the regress. 
    - **No fixed point needed**: The argument requires a **base case**, not self-referential circularity. The distinction between circular/guarded is irrelevant here. Force survives intact.

  ---

  #### **4. Unexplained Conjunction of Contingent Facts**
  - **Original Claim**: Explaining each contingent fact individually does not explain the whole conjunction.
  - **Formal Interpretation**: 
    - **Pointwise vs. Uniform Explanation**: 
      - Pointwise: For each fact `c_i`, a proof `p_i : Explanation(c_i)` exists.
      - Uniform: A single proof `p : \Pi_{(i:I)} Explanation(c_i)` for all facts.
    - **Dependent Product Formation**: 
      - If the indexing set `I` is finite, \( \Pi_{(i:I)} \text{Explanation}(c_i) \) is inhabited (uniform explanation exists). 
      - If `I` is infinite, dependent product formation **requires choice** or a uniform method. Without these, it may fail.
    - **The Complaint**: 
      - The conjunction demands a **uniform derivation** for all `c_i`. Pointwise proofs do not suffice if the explanations are heterogeneous (no common cause).
  - **Argument's Survival**: 
    - Stated precisely, the complaint is **valid but conditional**: 
      - **True** if no uniform derivation exists (e.g., explanations lack a common pattern). 
      - **False** if a uniform proof is constructible (e.g., via induction over `I`). 
    - In PSR, the necessary being must provide a uniform explanation, making it a **coherent requirement**.

  ---

  #### **5. From First Cause to Personal Agent**
  - **Claim**: The first cause/necessary being is a free personal agent who chose to create.
  - **Formal Interpretation**: 
    - **No counterpart** in structural vocabulary. 
    - Well-foundedness gives a **base case** (first cause), not properties like agency, intention, or personhood.
  - **Verdict**: 
    - **Not a structural claim** about grounding. This is a **gap in your vocabulary**, revealing the move as **metaphysical, not proof-theoretic**.

  ---

  ### Residue Report
  1. **Translated Cleanly**:
     - Well-foundedness of causation (Kalam).
     - Necessary being as axiom/base case (PSR).
     - Dependent product for total explanations (PSR).

  2. **Translated Under Distortion**:
     - **Kalam's actual infinite ban**: 
       - Distortion: Your framework allows coinductive streams, but these have a starting point. The past does not. 
       - **Source**: Design decision to allow productive infinities. Kalam assumes causation must be well-founded, which is a **policy choice**, not necessity. 
       - **Verdict**: Premise less clear—why must causation be well-founded?
     - **PSR completeness**: 
       - Distortion: Gödel limits self-referential completeness. 
       - **Source**: Genuine feature (incompleteness theorems). 
       - **Verdict**: Premise damaged—completeness is incoherent for strong systems.

  3. **Cannot Be Expressed**:
     - Personal agency of the necessary being. 
     - **Verdict**: Not impoverishment—this was never structural.

  ---

  ### Final Verdict on the Arguments
  - **Kalam Argument**: 
    - **Damaged by translation**. Well-foundedness is a policy choice; coinductive structures show an infinite past is coherent. Premise relies on unmotivated well-foundedness of causation.
  - **PSR Argument**: 
    - **Untouched by translation** when stripped of completeness. Well-foundedness + base case + dependent product formation are natural. Survives as a structural claim.
  - **Stronger Version**: 
    - **PSR becomes stronger** when stated as: 
      - Grounding is well-founded → a base case (necessary being) exists. 
      - Dependent product formation over contingent facts is possible → the whole is explained uniformly. 
      - (Completeness is discarded due to Gödel.)

  **Conclusion**: The PSR argument, as a well-foundedness requirement, is vindicated. Kalam's reliance on banning actual infinities is weakened by the formal toolkit. Agency claims remain outside the structural lens.
