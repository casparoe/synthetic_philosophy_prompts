prompt: |-
  I'm trying to figure out whether "democratic backsliding" names a real thing in my head or is just what I call my side losing. Verdicts first, then a principle I've been carrying around that I suspect is broken.

  Expanding a constitutional court by five seats and filling all five before the newly elected parliament has even convened: backsliding, no argument. A national senate leaving a vacant supreme court seat empty for a year without a single hearing: also backsliding, and this one bothers me because nothing illegal happened and no written rule was broken. Lowering the voting age to 16: obviously not. Barring citizens who've lived abroad more than fifteen years from voting: I won't call it backsliding when a stable old democracy does it, but I would call it that when a new government does it this year, and I can't tell you why those aren't the same act. Prosecuting a former head of government on ordinary charges with real evidence behind them: not backsliding, though I flinch. Inventing the charge after the conduct: backsliding. Redrawing districts so a party takes 60% of the seats on 45% of the vote: backsliding now, but the same trick run by the other party thirty years ago I wouldn't have called that, and the only difference I can name is that the tools got sharper. Turning public broadcasting into a mouthpiece: backsliding. Subsidizing independent outlets so they survive at all: not.

  My principle is: a move only counts if I'd call it backsliding whichever party did it, and it has to make the current rulers less likely to loose an election and hand over power. Everything else is just politics.

  I know the senate case and the fifteen-year rule each break that somewhere. Give me one or two candidate principles stated precisely enough that I could actually test them, say which of my verdicts has to go to keep them, and tell me what the survivor says about a case I didn't list: an opposition-run city whose local elections get postponed indefinitely over a corruption emergency. No headings, bullets, bold, or tables please — continuous prose, like an email.
reasoning: |-
  Okay, the user is struggling with the concept of "democratic backsliding" and whether it's a real phenomenon or just their side losing. They've listed several examples with their verdicts and provided a principle they suspect is flawed. Their principle is that it only counts as backsliding if they'd call it that regardless of which party did it, and if it reduces the likelihood of the current rulers losing power.

  First, I need to unpack their examples. They mention court-packing, leaving a Supreme Court seat vacant, changing voting ages, disenfranchising expats, prosecuting former leaders, gerrymandering, and media manipulation. Their reactions vary based on context, like whether a democracy is stable or new, or if the same action happened in the past. 

  Their stated principle has two parts: neutrality (whichever party does it) and effect on electoral competitiveness. But they admit contradictions, like the Senate vacancy and the 15-year voting rule. For the vacancy, nothing illegal happened, but they still see it as backsliding. The expat voting rule feels different in old vs. new democracies. So their principle breaks because context matters beyond partisanship and competitiveness.

  The user wants alternative principles that are precise and testable. They also want to know which of their verdicts must change under the new principles and how to apply it to a new case: an opposition city postponing local elections due to corruption.

  I should consider democratic norms and institutional integrity. Democratic backsliding often involves weakening checks and balances, undermining accountability, or reducing political equality. Legal vs. norm-based actions are key—like exploiting loopholes versus breaking laws. For example, the Senate vacancy exploits procedural gaps, which erodes norms even if legal.

  Another angle is intent and effect. Actions that intentionally concentrate power or reduce pluralism could be backsliding. But proving intent is tricky. Alternatively, focusing on the impact on democratic institutions: do they become less able to constrain the ruling party or ensure fair competition?

  A robust principle might be: an action constitutes democratic backsliding if it violates established democratic norms or undermines institutional checks and balances, thereby reducing the opposition's capacity to compete fairly or access peaceful transfer of power. This includes exploiting legal technicalities to bypass accountability.

  Applying this to their examples: Court-packing and media manipulation clearly violate norms and checks. The Senate vacancy, while legal, subverts institutional functions. Gerrymandering to extreme asymmetry undermines fair representation. Prosecuting with real evidence is legitimate; inventing charges is not. Lowering the voting age expands participation, not backsliding. Subsidizing media to preserve plurality is positive.

  Contradictions in their verdicts: The 15-year voting rule. In an old democracy, it might be seen as a settled policy. But in a new democracy doing it suddenly, it could be targeting diaspora opposition votes. So context of intent and impact matters. Similarly, past gerrymandering might not have been as severe or might have been normalized, but the current sharper tools create worse imbalance, making it backsliding now.

  The new case: Postponing elections indefinitely in an opposition city under corruption pretext. If it's a legitimate emergency with a clear timeline and oversight, it might be justified. But if it's vague, indefinite, and targets political opponents without checks, it's backsliding—eroding local accountability and disenfranchising voters.

  The user needs to adjust their view on the expat voting rule and past gerrymandering. The expat rule isn't inherently backsliding unless applied discriminatorily or suddenly to disenfranchise. Past gerrymandering, if similarly severe, should be recognized as backsliding then, but norms and standards evolve, so current actions might be worse. Their principle must account for norm erosion beyond partisanship and competitiveness alone.
answer: |-
  You're wrestling with the core tension in defining democratic backsliding: separating substantive democratic erosion from partisan outcomes and political maneuvering within accepted rules. Your self-identified principle ("only if I'd call it whichever party did it, and only if it makes rulers less likely to lose power") is a good starting point but breaks down because it ignores *how* power is secured and the *health of institutions* beyond immediate electoral competitiveness. Here are two candidate principles, aiming for precision:

  1.  **Principle of Institutional Integrity & Fair Contestation:** An act constitutes democratic backsliding if it exploits legal ambiguity, established norms, or institutional processes *in a way that systematically degrades the impartiality, independence, or capacity of key state institutions* (like courts, electoral bodies, media regulators) *or directly impairs the opposition's ability to compete on equal terms for power through free and fair elections*. The act must demonstrably shift the playing field *away* from neutral competence and equal access *towards* the incumbent's permanent advantage.

  2.  **Principle of Unilateral Rule Modification:** An act constitutes democratic backsliding if it involves the incumbent, without broad consensus or compelling non-partisan justification, unilaterally altering fundamental rules of the political game (e.g., electoral system, judicial appointments, voting rights, media oversight) *in a manner that demonstrably reduces institutional constraints on their own power or directly weakens core mechanisms of democratic accountability* (like free elections, an independent judiciary, or a pluralistic media), thereby increasing the risk of entrenchment.

  **Applying Principle 1 (Institutional Integrity & Fair Contestation):**

  *   **Verdicts that Must Go/Change:**
      *   **Past Gerrymandering (30 years ago):** If the *effect* was similarly extreme (60% seats on 45% vote) and exploited institutional processes to degrade fair representation, it *was* backsliding then too. Tools being "sharper" now doesn't change the fundamental act if the outcome was equally undemocratic. Your past acceptance likely reflects normalization or lesser awareness, not a principled difference. You must call both backsliding or neither, based on the *outcome for fair representation*.
      *   **15-Year Expat Rule:** Your distinction between old/new democracies is problematic. The key under this principle is *intent and effect on fair contestation*. If an old democracy has long had this rule as part of a settled framework, it's harder to argue it *systematically degrades impartial institutions* or *impairs equal competition now*. If a new government *suddenly* imposes it targeting a diaspora known to favor the opposition, with the *intent and effect* of reducing their voting power unfairly, it likely qualifies. The act itself isn't inherently backsliding; the context of *how* and *why* it's done matters for institutional integrity and fair play.
      *   **Senate Vacancy:** This *stands* as backsliding under this principle. Exploiting procedural rules to deliberately paralyze a core institution (the Supreme Court) for partisan gain degrades its independence and capacity, directly impairing a key check on power. The absence of a broken *written law* is irrelevant; the *norm* of timely appointments to maintain institutional function was violated unilaterally.

  *   **Other Verdicts Confirmed:**
      *   Court Packing: Degrades judicial independence/impartiality.
      *   Invented Charges: Degrades judicial impartiality & fair contestation (weaponizing law).
      *   Gerrymandering (now): Degrades fair representation/contestation.
      *   Media Mouthpiece: Degrades pluralistic information essential for fair contestation.
      *   Lowering Voting Age: Expands electorate, doesn't degrade institutions/contestation.
      *   Prosecuting with Evidence: Upholds accountability, doesn't inherently degrade institutions.
      *   Subsidizing Independent Media: Supports pluralism, doesn't degrade institutions.

  **Applying Principle 2 (Unilateral Rule Modification):**

  *   **Verdicts that Must Go/Change:**
      *   **Past Gerrymandering:** Same as Principle 1. If it was a unilateral alteration of the *effective* electoral rules to entrench power and reduce accountability, it qualifies regardless of when it happened.
      *   **15-Year Expat Rule:** Similar to Principle 1. A long-standing rule isn't a *unilateral modification*. Imposing it suddenly, without broad consensus, targeting opposition voters, *is* a unilateral rule change reducing accountability mechanisms (voting access). The age/stability of the democracy is less relevant than the *act of unilateral change* itself.
      *   **Senate Vacancy:** This *stands* as backsliding. It's a unilateral exploitation/applicaton of rules (inaction) to paralyze a core accountability mechanism (the court).

  *   **Other Verdicts Confirmed:** Similar to Principle 1. Court packing, gerrymandering, media takeover, invented charges all involve unilateral changes weakening constraints/accountability. Lowering voting age, prosecuting with evidence, and media subsidies generally do not (subsidies *could* be if structured to favor government allies, but your description suggests support for independence).

  **The New Case: Opposition-Run City Elections Postponed Indefinitely Over Corruption Emergency**

  *   **Under Both Principles:** This *strongly leans towards backsliding*, but requires examining intent, justification, and process.
      *   **Principle 1:** Does the indefinite postponement exploit an emergency to *systematically degrade* the institution of local elections and *impair the opposition's ability to compete* for control of the city? An indefinite halt, without a clear, credible, non-partisan path to restoration, inherently degrades the electoral institution and disenfranchises citizens, favoring the *current* controllers (possibly the national government intervening). If the "corruption emergency" is vague, lacks independent verification, or seems pretextual, it severely damages fair contestation.
      *   **Principle 2:** Is this a *unilateral* act by a higher authority (likely national government) altering the fundamental rule of regular elections for this city? An *indefinite* postponement is a clear unilateral modification of the electoral timetable, directly weakening local accountability mechanisms. The lack of a defined end date or clear, impartial oversight process is critical evidence of backsliding intent.
      *   **Verdict:** Unless there is overwhelming, independently verified evidence of systemic corruption completely paralyzing governance *and* a clear, short-term, independently monitored plan for holding elections (neither of which "indefinite" suggests), this act constitutes democratic backsliding under either principle. It unilaterally suspends a core democratic mechanism (elections) under a likely pretextual "emergency," entrenching current control (whether local remnants or national interveners) and removing the opposition's path to power through elections. Your flinch about prosecution *with evidence* is sensible caution; the indefinite election postponement *without* clear evidence and process should trigger a stronger alarm about backsliding.

  **Survivor's Diagnosis:** Your core insight – that backsliding involves actions making rulers "less likely to lose" – is correct, but incomplete. The crucial additions are the *method* (degrading institutions/unilateral rule changes) and the *target* (neutrality, fairness, accountability mechanisms). This shifts focus from pure electoral outcome to the *health of the democratic system itself*. You must reconcile that actions like extreme gerrymandering *were* likely backsliding even in the past, and that context like *how* a rule change is implemented (suddenly/unilaterally vs. settled practice) matters more than the age of the democracy. The broken part of your initial principle was overlooking *institutional erosion* and *unilateralism* as the defining characteristics, distinct from the raw outcome or the age of the norm.
