answer: |-
  ## Prospectus: Narrative Selves and Unstable Foundations — Interrogating Dennett's Center of Gravity Analogy

  **1. Core Question & Problem Statement**

  Dennett’s “center of narrative gravity” (CNG) analogy is widely invoked to render eliminative materialism about the self palatable: the self is a *benign abstraction*, like a center of gravity (CoG) in physics, lacking substantial reality but serving a crucial predictive/explanatory role without ontological peril. This prospectus challenges the uncritical application of this analogy by identifying a critical disanalogy: **underdetermination**. While a CoG is uniquely determined by a fixed mass distribution (Condition i), the narrative self appears radically underdetermined by the underlying psychological/behavioral facts. Multiple, often incompatible, narratives can be constructed from the same base facts, depending on narrator, purpose, and context. The central question this chapter will answer is:

  **Given that the narrative self is underdetermined by the base psychological and behavioral facts in a way a center of gravity is not, what specific *failure mode* regarding the "harmlessness" conditions (i-iii) does this entail? Specifically:**
  **(a) Is it still benign, requiring a revised analogy (e.g., coordinate choice)?**
  **(b) Does it reveal the self as a causally potent social object?**
  **(c) Does it demonstrate the abstraction is *not* harmless, undermining the analogy's purpose?**

  This question moves beyond the mere existence of underdetermination (often noted anecdotally) to precisely diagnose its *philosophical consequences* for the CNG analogy's core function: defanging eliminativism.

  **2. Why Existing Positions Leave the Question Open: The Underdetermination Gap**

  The literature on narrative identity largely fails to engage rigorously with the implications of underdetermination *for the specific harmlessness conditions implied by the CoG analogy*.

  *   **Narrativists (e.g., MacIntyre, Schechtman, some Bruner):** Emphasize the *necessity* and *functionality* of narrative for agency, responsibility, and meaning. They may acknowledge narrative flexibility but typically frame it as a *feature* (e.g., narrative repair, multiple perspectives) or focus on coherence constraints. **Why the gap?** Their primary concern is establishing narrative's *importance*, not rigorously testing the *metaphysical implications* of its structure against the CoG analogy's criteria. They often implicitly assume the narrative *can* be sufficiently grounded or that its functional role justifies it regardless, without explicitly addressing whether this grounding meets Condition (i) or how the functional role interacts with Conditions (ii) and (iii) *in light of underdetermination*. They don't explain why the underdetermination inherent in narrative construction doesn't violate the "no further fact" determinacy of Condition (i) that makes the CoG analogy feel safe.
  *   **Anti-Narrativists (e.g., Strawson, Lamarque, some phenomenological strands):** Reject the *necessity* of narrative for selfhood, arguing for episodic experience or minimal subjectivity. **Why the gap?** Their attack is often on the *ubiquity* or *desirability* of narrative, not the *specific structure* of the CNG abstraction or its disanalogy to CoG. They might point to confabulation or narrative distortion, but they generally don’t engage deeply with the *physics analogy* itself or systematically analyze the underdetermination problem *in terms of the conditions for benign abstraction*. Their critique bypasses the specific mechanism (the CoG comparison) by which Dennettian abstractionism tries to make eliminativism unscary.
  *   **Abstractionists/Taking the Analogy at Face Value (e.g., Dennett, some functionalists, deflationary materialists):** Embrace the CoG comparison directly, arguing the self is "real" precisely in the way abstracta like centers of gravity are real – as useful fictions or patterns. **Why the gap?** They rarely subject the analogy itself to rigorous scrutiny concerning its *conditions for harmlessness*. They focus on the *explanatory utility* (Condition ii) and often gesture towards dispensability (Condition iii), but largely *assume* Condition (i) – unique determination by the base facts – holds for the narrative self, or treat narrative construction as a process that *just converges* on a single "gravitational center." The pervasive underdetermination revealed by psychology, autobiography, and literary theory challenges this assumed determinacy head-on, and proponents of the analogy haven't adequately addressed *how* the narrative self meets Condition (i) *despite* this underdetermination, or what the consequences are if it doesn't.

  **3. Methodology: A Conditional Analysis Focused on Harm Criteria**

  The chapter will employ a **conditional philosophical analysis centered on the criteria for "benign abstraction"**, explicitly ruling out two common but insufficient approaches for this specific question:

  *   **Ruled Out: Pure Conceptual Analysis of "Narrative".** While clarifying narrative is important, the core issue isn't the *definition* of narrative per se, but whether *whatever abstraction the narrativist/abstractionist posits as the self* meets the harmlessness conditions modeled by the CoG analogy. Endless debate over necessary/sufficient conditions for narrative distracts from the structural comparison.
  *   **Ruled Out: Comprehensive Empirical Tour.** Reviewing psychological work on autobiographical memory distortion, confabulation, cultural narrative variation, or therapeutic re-narration is illustrative but not decisive. The chapter will *draw upon* key empirical findings (e.g., work showing malleable life stories) as *evidence for the premise* of underdetermination. However, the core task is a *philosophical assessment* of what this underdetermination *means* for the analogy's validity and the self's status, not an exhaustive cataloging of empirical instances.

  **The Core Method:**
  1.  **Establish the Harmlessness Conditions:** Precisely define the three conditions (i: unique determination by base facts, ii: significant predictive compression, iii: dispensability without empirical loss) and argue they are *individually necessary and jointly sufficient* for an abstraction to be "harmless" in the way the CoG analogy intends (making eliminativism ontologically non-threatening).
  2.  **Establish Underdetermination:** Argue persuasively, using philosophical reasoning and selective empirical evidence (e.g., narrative multiplicity from the same facts, interpretive flexibility), that the narrative self *fails Condition (i)* in a way the CoG does not. The base facts (memories, behaviors, dispositions) radically underdetermine the *specific narrative emplotment* constituting the self.
  3.  **Conditional Analysis:** Given the failure of (i), systematically analyze the implications for (ii) and (iii), and for the overall status of the abstraction:
      *   Does predictive utility (ii) *survive* or even *depend* on the underdetermination? (Pointing towards (a))
      *   Does the underdetermination involve *feedback loops* where the narrative choice *shapes* the base facts? (Pointing towards (b))
      *   Does the failure of (i) fundamentally undermine the claim that the abstraction is ontologically non-committal or eliminable without loss (iii)? (Pointing towards (c))
  4.  **Interrogate the Analogy:** Critically evaluate whether alternative abstracta (e.g., coordinate systems, gauge choices, free parameters, institutional facts) provide better models than CoG *if* underdetermination is fundamental.

  **Why this method?** It directly targets the heart of the user's "nagging feeling": the unexamined *conditions for harmlessness* in the analogy. It leverages philosophical tools (conceptual analysis, metaphysics of abstraction, philosophy of science/social ontology) to diagnose the *structural flaw* exposed by underdetermination, moving beyond descriptive accounts of narrative or piecemeal empirical critiques to a focused evaluation of the analogy's core logic.

  **4. Possible Results & The Exhaustiveness Question**

  The chapter structure will lead to one of the following determinate conclusions, argued for based on the conditional analysis:

  *   **(a) Benign Abstraction, Wrong Analogy:** Result: The narrative self *is* a benign abstraction *despite* failing (i), but the CoG is the *wrong model*. The right analogues are entities like *coordinate systems in physics* or *free parameters in models*, where underdetermination is inherent and resolved pragmatically (by convention, purpose, or theoretical context). Harmlessness is preserved via Conditions (ii) and (iii), but the "no further fact" determinism of (i) is replaced by pragmatic constraint. The theorist's job shifts to identifying the relevant pragmatic factors fixing narrative choice.
  *   **(b) Causally Potent Social Object:** Result: The underdetermination isn't merely pragmatic; it stems from the self's nature as an *institutional fact* (like money or borders). Narrative choices are acts within a social practice, and the "self" they constitute feeds back causally to shape behavior, cognition, and social recognition, thereby altering the very base facts it was meant to summarize. This violates the passive summarization implied by CoG (and Condition i) and introduces a causal potency absent in CoG. While perhaps "abstract" in one sense, it fails the *harmlessness test* modeled on *physical* abstracta because its social reality has concrete, non-dispensable causal effects.
  *   **(c) Harmful Abstraction:** Result: The failure of (i) is catastrophic for the analogy's purpose. If the narrative self is fundamentally underdetermined, then positing *it* as the "center" introduces a *substantive commitment* or *illusion* not present in the CoG case. Its utility (ii) might be pragmatic or ideological, but it fails to be *merely* a compression of base facts, and its dispensability (iii) becomes questionable because it seems to *create* or *stipulate* an entity rather than summarize one. The analogy actively *misleads* by suggesting an ontological safety that isn't there; it should be retired.

  **Are (a), (b), (c) exhaustive and distinct?** They represent fundamentally different *diagnoses* of the problem created by underdetermination regarding the analogy's validity and the self's status:
  *   (a) preserves benign abstraction but changes the *kind* of abstraction.
  *   (b) abandons the "mere abstraction" label in favor of a socially constituted, causal entity.
  *   (c) rejects the abstraction as failing its core justificatory purpose.
  While (a) and (b) both acknowledge underdetermination, they draw diametrically opposed conclusions about the self's nature (abstract vs. causally social) and the analogy's viability. (c) rejects the core project of benign abstractionism via the analogy. They are mutually exclusive interpretations of the failure of Condition (i). The chapter will argue explicitly that these are the three live options arising from the analysis.

  **5. Failure Conditions & Malformed Questions**

  *   **Failure:** The project fails if:
      *   The argument for the *necessity and sufficiency* of Conditions (i-iii) for CoG-style harmlessness is unconvincing.
      *   The premise of *radical underdetermination* specific to narrative selves (compared to CoG) is not robustly established.
      *   The analysis cannot compellingly distinguish between (a), (b), and (c), or shows they collapse (e.g., arguing (a) inherently leads to (b)).
      *   The conclusion is merely that "it's complicated" without a clear diagnosis of the analogy's flaw.
  *   **Malformed Question:** The question would be malformed if:
      *   The core premise (narrative self is underdetermined in a way CoG is not) is simply false or insignificant.
      *   The "harmlessness" of the CoG abstraction itself is fundamentally misunderstood (e.g., if it *isn't* considered ontologically harmless by relevant standards).
      *   The three options are shown to be non-exclusive or not collectively exhaustive of the logical possibilities arising from the failure of (i).

  **6. Scope Management & Ballooning Risks**

  This chapter is tightly scoped to **interrogate the validity of the CoG analogy** in light of narrative underdetermination. Key boundaries:

  *   **Focus:** The conditions for benign abstraction *as modeled by the CoG analogy*. The goal is *not* to solve the general problem of personal identity, provide a complete theory of narrative, or refute all forms of narrativism/anti-narrativism.
  *   **Limits:** Minimal engagement with:
      *   Deep metaphysical debates about substance vs. bundle theories *unrelated to the analogy*.
      *   Comprehensive history of narrative theories.
      *   Detailed exegesis of all Dennett's work on consciousness/self.
      *   Full defense of eliminative materialism beyond its relation to the analogy.

  **Where it Could Balloon (and What to Cut First):**

  1.  **Expanded Empirical Survey:** Risk: Diving too deep into psychology/neurosociology of autobiographical memory, confabulation studies, cross-cultural narrative variation. **Cut First:** Limit empirical evidence to 2-3 paradigmatic, widely accepted examples illustrating underdetermination. Avoid detailed methodological critiques or surveys of conflicting studies.
  2.  **Alternative Analogies Debated Exhaustively:** Risk: Lengthy exploration of numerous potential analogues (fictional characters, mathematical points, software objects, etc.). **Cut First:** Focus analysis on the 1-2 strongest candidate analogues for (a) (e.g., coordinate systems) and the core institutional facts for (b). Treat others cursorily.
  3.  **Full Defense of Social Ontology (for b):** Risk: Getting bogged down in meta-ethics/philosophy of social science defending the reality of institutional facts. **Cut First:** Rely on established frameworks (e.g., Searle, collective intentionality) without deep justification, applying them directly to the narrative self case.
  4.  **Engaging Every Critic of Narrativism/Abstractionism:** Risk: Trying to address all possible objections from all camps. **Cut First:** Stay laser-focused on the responses specifically relevant to the *underdetermination challenge to the CoG analogy's harmlessness conditions*. Ignore tangential critiques.

  **Conclusion for Prospectus:**
  This chapter will deliver a focused, critical intervention in the debate on narrative selves by rigorously examining the unstated foundations of Dennett's influential center-of-gravity analogy. It will demonstrate how the phenomenon of narrative underdetermination exposes a critical flaw in the analogy's ability to render the self a "harmless abstraction," forcing a decisive choice between reconceiving the abstraction, recognizing the self's social causal power, or abandoning the analogy's conciliatory promise. The result will be a clear diagnosis of the analogy's specific vulnerability and its implications for the ontological status of the narrative self.
