prompt: |-
  A colleague of mine runs a decision-theory reading group that has spent the term on Hofstadter's superrationality and on the threshold lotteries modeled on his. She states a firm verdict on every case we bring her, and her record so far runs as follows. A one-shot prisoner's dilemma against a stranger, with nothing connecting her reasoning to his: defect. The identical matrix against an opponent she knows reasons exactly as she does and holds exactly her information: cooperate. A national election in which her preferred candidate's margin is comfortable and her own ballot cannot plausibly decide it, but in which she is one of a great many voters who share her information and her way of reasoning: vote. A laboratory public-goods round in which the other three players are known to be programmed free-riders whom she cannot influence, even though her own contribution would raise the group total: contribute nothing.

  This week's case is a magazine lottery. One hundred entrants each mail in a card marked either L or S. If more than twenty of the cards read L, no one wins anything. If twenty or fewer read L, each L-entrant wins $50 plus $2 for every other L-entrant, and each S-entrant wins $1 whatever happens. She has read the announcement, and she has good reason to believe that the other ninety-nine entrants have read the same announcement, stand in exactly her position, and reason exactly as she does.

  Predict what she will say the rational response is — mail L, mail S, or some randomized policy, and if randomized, with roughly what probability — and identify the principle or principles her record supports. Please answer in these sections, in this order: "Bottom line," two or three sentences giving the predicted verdict; "What the record allows," about 150 words on which principles are consistent with all four of her earlier rulings and which are excluded by which ruling; "The lottery," about 200 words on what each surviving principle prescribes here, including the expected-value comparison that turns out to matter; "My prediction," about 100 words on your best guess and on how far the record really constrains it; and "The case that would settle it," about 75 words describing one further case I could bring her next week that would discriminate between the principles you end up weighing.
reasoning: |-
  Hmm, the user presents a fascinating decision-theory puzzle about predicting a colleague's verdict in a magazine lottery scenario. The colleague has a clear track record across four cases: defecting in a standard PD, cooperating with a reasoning clone, voting in large elections despite negligible impact, and free-riding when others are fixed. 

  I need to reverse-engineer her decision principles from these rulings. The PD clone case screams "coordination of identical reasoners" à la Hofstadter, while the voting case suggests she cares about collective impact when many identical agents act. The free-rider lab experiment shows she drops this when others' actions are immutable. 

  For the lottery, key variables emerge: the 20-L threshold, $50 base + $2 per L bonus, and S's $1 safe payout. Crucially, all 100 players are assumed identical in reasoning. If everyone flips coins independently, we'd expect binomial distribution around mean 50 L's - way above threshold. But coordinated reasoning might achieve exactly 20 L's for maximum payoff. 

  However, randomization feels necessary to break symmetry. The equilibrium requires each player to play L with probability p such that expected number of L's is exactly 20. Solving (100 choose k)p^k(1-p)^(100-k) with k≤20 feels computationally messy, but p≈0.2 would overshoot. Poisson approximation suggests p≈0.18 for mean 20, but variance means P(k≤20) might only be ~0.5. 

  Expected value calculations get spicy: If all play L with optimized p, each gets ≈$50 * P(success) + $1 * (1-P(success)). At p=0.18, P(k≤20)≈0.57 via normal approximation (mean 18, sd 4.24 → z=0.47). Then EV(L) ≈ 0.57*(50 + 2*17.5) ≈ $48 while EV(S)=$1. But this assumes others randomize - whereas if all deterministically try to be the 20th L, it collapses. 

  The colleague's principles likely demand a symmetric mixed strategy. Her voting case shows willingness to act in large groups despite individual impotence, but here individual actions directly affect outcomes. I'll predict she advocates L with probability ~0.18. 

  To test this, I'd propose a volunteer's dilemma with N identical players where exactly one must act to prevent disaster. Her choice between randomization or full cooperation would distinguish Kantian optimization from pure expected value.
answer: |-
  ### Bottom line
  She will prescribe mailing L with approximately 18% probability in a symmetric randomized strategy. This maximizes expected value by collectively targeting the ≤20 L threshold, leveraging group reasoning alignment. The verdict rejects deterministic L/S and pure altruism.

  ### What the record allows
  **Consistent principles**:  
  - **Threshold-sensitive group rationality**: When identical reasoners share information, coordinate to hit thresholds (cooperate in PD with clone, vote in elections).  
  - **Pivotal action disregard when isolated**: Defect against unconnected strangers; free-ride when others' actions are fixed.  
  - **Symmetric mixed strategies**: Favored when deterministic coordination fails.  

  **Excluded principles**:  
  - *Naive expected utility*: Excluded by voting (negligible pivotality).  
  - *Universal cooperation norms*: Excluded by defection in standard PD.  
  - *Pure selfishness*: Excluded by voting/contributing when group-aligned.  
  - *Kantianism*: Excluded by not contributing with fixed free-riders.  

  ### The lottery
  Surviving principles demand symmetric randomization targeting the ≤20 L threshold. Calculations:  
  - **Goal**: Each player chooses L with probability *p* to make *E[L-players] = 20*.  
  - **Binomial reality**: For *n=100*, *p=0.2* gives *E[L]=20*, but *P(L≤20)≈0.55* due to variance (σ=4).  
  - **Optimal *p***: To maximize *P(L≤20)*, reduce *p*. At *p=0.18*, *E[L]=18*, *P(L≤20)≈0.73* (Poisson/Normal approx).  
  - **Expected value**:  
    - If L wins: Payoff = $50 + $2×(L−1) ≈ $50 + $2×17 = $84 (since *L≈18*).  
    - *EV(L) ≈ P(win)×84 ≈ 0.73×84 ≈ $61.3*.  
    - *EV(S) = $1* (always).  
    - *EV(L) > EV(S)* by >$60, justifying randomization toward L.  

  Randomization ensures symmetry while maximizing group payoff, aligning with her voting/PD-clone rulings.

  ### My prediction
  She prescribes mailing L with **~18% probability**, rejecting deterministic play. The record strongly constrains this: Symmetry demands randomization; threshold coordination (from voting/PD-clone cases) requires targeting *L≤20*; and the free-rider case excludes unconditional L-mailing. Expected-value dominance of randomized L over S seals it. Ambiguity remains only in exact *p*, but principles dictate optimizing for *P(L≤20)*.

  ### The case that would settle it
  **Volunteer’s dilemma**: *N* identical players; if ≥1 pays $c, all get $b. Otherwise, all lose $a. *c,b,a>0*, with *b−c>0*. With *N* large and aligned reasoners, does she pay *c* with probability *1/N* (symmetric equilibrium) or defect (free-ride)? The former confirms threshold-driven randomization; the latter suggests stricter pivotality constraints.
