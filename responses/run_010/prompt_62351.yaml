answer: |-
  This is a normative disagreement about the *purpose* of belief representation, masquerading as a technical dispute about probability models, with the sequential-choice charge against imprecise models being sound but insufficient to resolve the debate because it targets a different normative goal.

  The imprecisist's core argument from cases like Ellsberg or Keynesian weight isn't that dilation doesn't occur or that sets avoid diachronic money-pumps—they concede both. It's that a rational belief state must *reflect the structure of evidence*, and evidence with "gaps" or "ambiguity" cannot license a unique real number without misrepresentation. When they say dilation is a "feature," they mean it correctly models how *evidential relationships* propagate: learning which partition cell occurred *should* sometimes expand uncertainty when evidence is sparse or conflicting. The demand for sequential coherence, to them, wrongly prioritizes action-guidance over fidelity to evidential constraints. Their rejection of diachronic incoherence charges isn't denial of the betting behavior but a denial that *belief itself* must be action-guiding. Belief's job ends at representing licensed doxastic attitudes; decision rules (e.g., Γ-maximin) handle action separately, and incoherence arises only if we mistakenly demand beliefs directly license bets.

  The precise Bayesian's insistence on sequential coherence isn't merely computational pragmatism. It stems from viewing credence as inherently *dispositional*: to believe *is* to be poised to act consistently across time. Dilation isn't rejected as mathematically impossible but as *epistemically pathological* because rational learning should not systematically increase uncertainty. When they cite money-pumps, they argue that avoiding guaranteed loss is a minimal norm of rationality, and any belief state enabling such loss (through *any* decision rule) is defective. Crucially, they see the imprecisist's "evidential fidelity" as empty without a link to doxastic commitment—a set of probabilities, they argue, is not a belief state but a description of indecision.

  The question-begging charge holds: sequential coherence norms *are* derived from precise coherence. But this doesn't stall the debate; it reveals the core clash. The precise Bayesian argues that norms of action *must* constrain belief because belief is practical. The imprecisist rejects this teleology. This is why dilation arguments talk past each other—one sees it as evidential sensitivity, the other as irrational volatility—and why betting cases gain no traction: one side views them as revealing a fatal flaw in the belief state, the other as misapplying action-norms to representation.

  Progress requires abandoning the hope for a unified "belief state" and instead disentangling two functions: a *doxastic commitment_ (answerable to evidence) and a _practical commitment_ (answerable to action). A representation theorem showing that every "evidentially licensed" set corresponds to a family of decision rules satisfying weakened coherence could clarify, but only if paired with a normative argument for why one function subordinates the other. Alternatively, an impossibility result proving that no non-collapsing decision rule for sets avoids *some* dynamic irrationality under *some* evidence stream would force imprecisists to either accept incoherence or split the concepts. Pessimism is warranted if belief is indeed bifunctional—no formal result can settle which function is primary. The impasse persists because both sides correctly identify a genuine normative demand (evidential fidelity vs. agency), and no amount of mathematical clarification can reconcile them without a prior agreement on what belief *is for*. The debate is hard because it asks for a single answer to a dual-purpose concept.
