answer: |-
  ### Proposed Procedure for Funding Panel

  **Core Principles:**  
  1. **Avoid Doctrinal Paradox:** Derive funding decisions solely from criterion-level votes to ensure logical consistency with the conjunctive rule ("fund only if all criteria are met").  
  2. **Handle Recusals:** Recusals are criterion-specific; eligibility for each vote differs.  
  3. **Prevent Strategic Voting:** Hide intermediate tallies until the final decision is made.  
  4. **Transparency:** Record votes and decisions for appeals.  
  5. **Human Judgment:** Allow override only for irreconcilable procedural conflicts (e.g., ambiguous recusals or ties), not substantive disagreements.  

  ---

  ### Step-by-Step Procedure

  | Step | Question Put to the Panel                                        | Who Votes                                                                 | What Counts as a Sufficient Answer                                                                 | What Happens If It Fails                                                                                               | Judgment Call (No, or Yes + Topic)                                                                 |
  |------|------------------------------------------------------------------|---------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | 1    | Recusal declaration for **Soundness**                            | All panel members (self-recusal based on conflict rules)                 | Confirmed recusal status recorded; non-recused members eligible for Soundness vote.                | Chair resolves disputes (e.g., unclear conflicts) with panel input.                                                    | **Yes**: Whether a member’s conflict qualifies for recusal under foundation rules.               |
  | 2    | *Vote:* Does the application meet the **Soundness** criterion?   | Non-recused members for Soundness (from Step 1)                          | Majority "Yes" (>50% of votes cast).                                                               | Application fails; proceed to Step 5 (no funding).                                                                     | **No**                                                                                            |
  | 3    | Recusal declaration for **Significance**                         | All panel members (self-recusal)                                         | Confirmed recusal status recorded; non-recused members eligible for Significance vote.             | Chair resolves disputes.                                                                                               | **Yes**: Same as Step 1.                                                                         |
  | 4    | *Vote:* Does the application meet the **Significance** criterion? | Non-recused members for Significance (from Step 3)                       | Majority "Yes".                                                                                    | Application fails; proceed to Step 5 (no funding).                                                                     | **No**                                                                                            |
  | 5    | Recusal declaration for **Feasibility**                          | All panel members (self-recusal)                                         | Confirmed recusal status recorded; non-recused members eligible for Feasibility vote.              | Chair resolves disputes.                                                                                               | **Yes**: Same as Step 1.                                                                         |
  | 6    | *Vote:* Does the application meet the **Feasibility** criterion? | Non-recused members for Feasibility (from Step 5)                        | Majority "Yes".                                                                                    | Application fails; proceed to Step 7 (no funding).                                                                     | **No**                                                                                            |
  | 7    | **Final Decision**                                               | Chair (no vote)                                                          | All three criteria have majority "Yes" (from Steps 2, 4, 6).                                       | Application not funded.                                                                                                | **No** (arithmetic: if any criterion lacks majority "Yes", decision = "No Fund").                |
  | 8    | **Override/Appeal Handling**                                     | Chair (with panel input if needed)                                       | N/A (used only for unresolved ties, procedural errors, or ambiguous recusals).                     | If override invoked, chair decides based on discussion and records reasoning. Else, decision stands.                  | **Yes**: Only if a tie/vote-count error occurs; not for substantive disagreements.               |
  | 9    | **Record & Announce**                                            | N/A                                                                      | Tally sheets and decision documented in appeal file.                                               | N/A                                                                                                                    | **No**                                                                                            |

  **Key Rules:**  
  - **Ballot Order:** Sequential votes on Soundness → Significance → Feasibility.  
  - **Eligibility:** Only non-recused members per criterion vote. Recusals declared before each vote.  
  - **Tallies:** Vote counts **hidden** until final decision (Step 7) to prevent strategic voting.  
  - **Funding Decision:** Derived **automatically** from criterion votes (fund iff all three have majority "Yes"). No separate "fund/don’t fund" vote.  
  - **Ties:** A tie (e.g., 3-3) fails the criterion (not >50%).  
  - **Appeal File:** Records:  
    - Recused members per criterion.  
    - Vote counts per criterion.  
    - Final decision and derivation logic.  
    - Override rationale (if used).  
  - **Human Judgment:** Only invoked at **Step 8** for procedural issues (e.g., tied vote, recusal dispute). Never to override criterion-based outcomes.  

  ---

  ### Example Cases

  #### **Case 1: Recusal Flips the Paradox**  
  **Scenario:**  
  - 9 panelists (P1–P9).  
  - **Recusals:** P1 recused on *Feasibility* (conflict).  
  - **Votes:**  
    - *Soundness:* 5 Yes, 4 No → **Pass** (majority "Yes").  
    - *Significance:* 5 Yes, 4 No → **Pass**.  
    - *Feasibility:* 4 Yes, 4 No (P1 recused) → **Fail** (tie; not majority).  
  **Outcome:**  
    - **Decision:** No fund (Feasibility not met).  
    - **Paradox Flip:** Without recusal, P1 (a "No" voter) would have made Feasibility 4 Yes, 5 No → **Fail** (same outcome). But if P1 were a "Yes" voter:  
      - With recusal: Feasibility 4 Yes, 4 No → **Fail**.  
      - Without recusal: Feasibility 5 Yes, 4 No → **Pass** → **Fund**.  
    - Recusal flipped a "fund" outcome to "no fund" due to lost "Yes" vote.  

  #### **Case 2: Procedure Forces "Wrong" Outcome**  
  **Scenario:**  
  - 9 panelists, no recusals.  
  - **Votes:**  
    - *Soundness:* 5 Yes, 4 No → **Pass**.  
    - *Significance:* 5 Yes, 4 No → **Pass**.  
    - *Feasibility:* 4 Yes, 5 No → **Fail**.  
  **Outcome:**  
    - **Decision:** No fund (Feasibility not met).  
    - **Substantive Issue:** Panel feels feasibility concerns are minor and project is highly significant. Wants to fund despite Feasibility failure.  
    - **Procedure’s Constraint:** Override (Step 8) not allowed for substantive disagreements. Decision is binding.  
    - **Why "Wrong"?** Conjunctive rule is rigid; panel cannot exercise holistic judgment when criteria are "mostly met."  

  ---

  ### Why This Works  
  - **Judgment Aggregation:** Uses **premise-based voting**—aggregates judgments on premises (criteria) to derive conclusion (funding). Avoids doctrinal paradox by not aggregating the conclusion directly.  
  - **Scalability:** 9 voters × 14 apps/month is manageable with sequential votes (≈5 min/app).  
  - **Appeal-Proof:** Decision is arithmetically derived from published criteria, reducing legal vulnerability.  
  - **Anti-Strategic:** Hiding tallies prevents voters from adjusting votes based on partial results.  

  **Caveats:**  
  - **Recusal Complexity:** Different voter sets per criterion are acceptable; the rule is criterion-specific.  
  - **"Procedure Costume" Steps:** Step 1, 3, 5 (recusal declarations) involve judgment but are necessary for fairness. Step 8 (override) is a true judgment call but rarely used.  
  - **Values vs. Arithmetic:** Human judgment only intervenes in procedural ambiguities (Step 8). All substantive decisions are arithmetic.  

  Implement this to ensure consistent, defensible outcomes.
