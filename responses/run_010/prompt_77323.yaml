prompt: |-
  ok so I'm a junior and in my comparative government class our teacher is making each of us write one practice essay question for the class review packet, plus a model answer and a marking scheme, bc she says writing the question is harder then answering it. My topic is presidential vs parliamentary systems and I want mine to be the genuinely hard one, not the boring "name three differences between the two systems" thing half the class is gonna do.

  Here's the setup I already came up with. It's a made-up country on purpose so nobody can just recite facts about the US or the UK, and also we're not allowed internet during the review session so the question has to be answerable from the info given plus whatever we learned in class:

  **Valtreya** — democracy since the mid-1990s, about 18 million people.
  - President is directly elected by majority runoff, serves a five-year term, can run for a second term.
  - One legislative chamber, 200 seats, elected by proportional representation with a really low 2% threshold, so there are usually six or seven parties in it and no single party comes close to a majority.
  - The president picks ministers who don't need legislative approval and can't be fired by the legislature. The legislature can only remove the president by impeachment for an actual crime, which needs two-thirds.
  - The president can veto bills (a three-fifths vote overrides it) and can rule by decree while the chamber is not in session. The president can't dissolve the chamber.
  - In the last twenty years: no president has had a friendly majority in the chamber for more than about 18 months of any term, two presidents governed mostly by decree, one was impeached and removed after ten months of that, and one president's whole program sat blocked for three years.

  A constitutional convention has two proposals on the table:
  - **Proposal A:** switch to a parliamentary system. Ceremonial president chosen by the chamber, and a PM plus cabinet that need and keep the confidence of a majority, with the chamber dissolvable for early elections.
  - **Proposal B:** keep the directly elected president with real powers, but add reciprocal survival — the chamber can remove the president and the cabinet by a simple-majority no-confidence vote, and a president facing that vote can instead dissolve the chamber and force presidential and legislative elections at the same time within 90 days. Each side can only use its power once per year.

  One of the convention delegates argues in the hearings that "the entire point of electing the president separately is that when things go badly, voters know exactly who to throw out." Another delegate says Proposal B is just parliamentarism with extra steps and will end up importing all the instability without any of the party discipline that makes parliamentary government workable.

  So what I need from you:

  1. The actual exam question, worded the way a real exam would word it. It should be answerable in 45 minutes and it has to force people to pick and defend one of the two proposals rather than list pros and cons of both. I specifically want it to make them notice that the same feature — like the executive being removable by the legislature, or the legislature not being — is a virtue in some party systems and a disaster in others, and that "presidential = gridlock, parliamentary = efficient" isn't the real dividing line. Build in a requirement that they engage with both delegates' claims, since those two claims pull in opposite directions and I think most people won't see that.

  2. A model answer of about 700 words that actually argues for one proposal and deals with the strongest case for the other one, not a both-sides mush.

  3. A marking scheme out of 25 with the point value of each element, written so a stranger could grade with it. I need it to say specifically what seperates an A answer from a B answer — like, name the exact moves each one has to contain — and then list four or five mistakes that should cost marks, with a note on why each one is a mistake and not just a difference of opinion. The mistakes I'm expecting are things like treating fusion of powers as meaning there are no checks on a PM at all, or assuming Proposal A automatically gives you a stable single-party majority when the electoral system is PR with a 2% threshold, or thinking a fixed term is automatically more stable than a no-confidence vote.

  Please don't put in a bibliography or tell me to cite anything, and don't make the argument depend on specific real-world facts someone would have to look up — if the model answer gestures at real countries as examples that's fine but it shouldn't need any dates or vote counts to work.
reasoning: |-
  Okay, this is a sophisticated request from a high school junior creating an intentionally challenging comparative government essay. The student clearly understands the nuances of presidential vs parliamentary systems and wants to avoid superficial comparisons. Their Valtreya case study is well-designed to force analytical thinking rather than rote memorization.

  First, I need to unpack the core challenge: crafting a question that compels students to make and defend a constitutional choice based on Valtreya's specific context. The student's frustration with "name three differences" questions is valid - this needs deeper institutional analysis. The key will be forcing engagement with how party systems (fragmented legislature) interact with constitutional structures.

  The student's existing setup is strong: the 2% PR threshold guaranteeing multiparty fragmentation is crucial, as is the historical evidence of chronic deadlock. The reciprocal survival mechanism in Proposal B is particularly clever - it's essentially a semi-presidential variant that most students won't recognize immediately. 

  For the question design, I'm considering how to:
  - Embed the two delegate quotes as mandatory discussion points
  - Require using Valtreya's institutional features as evidence
  - Block both-sides answers by demanding a recommendation
  - Highlight the party system as the decisive variable

  The model answer should demonstrate how to:
  - Reject simplistic stability/efficiency dichotomies
  - Show why Proposal A's "party discipline" claim fails in fragmented systems
  - Explain how reciprocal survival creates different incentives
  - Use Valtreya's history as predictive evidence

  Marking scheme must penalize:
  - Ignoring the 2% threshold implications
  - Treating dissolution powers as equivalent in both systems
  - Assuming PMs automatically command majorities
  - Missing that reciprocal survival alters accountability

  Noticing the student wants the model answer to argue for Proposal B - that's smart because it's the less intuitive choice and better demonstrates nuanced thinking. The delegate's "parliamentarism with extra steps" critique is perfect to dismantle.

  Biggest challenge will be keeping the model answer under 700 words while covering all layers: historical context, institutional analysis, rebutting both delegates, and showing why B solves Valtreya's specific problems better than A. Need to model concise academic writing.

  The reciprocal survival mechanism deserves special attention - it's modeled after systems like Peru's 1993 constitution but most students won't know that. Must explain how the mutual threat creates different incentives than pure presidentialism or parliamentarism.

  This is unusually advanced for high school - impressive that the student recognizes how party systems mediate constitutional effectiveness. Their teacher's "writing questions is harder" philosophy is clearly paying off.
answer: |-
  Here’s a complete exam package designed to force analytical depth on Valtreya’s constitutional dilemma, avoiding superficial comparisons and demanding engagement with institutional context and competing claims.

  ---

  **1. Exam Question (45-minute format):**

  > **Valtreya’s constitutional convention must choose between Proposal A (parliamentary system) and Proposal B (reciprocal survival presidentialism). Drawing *specifically* on Valtreya’s institutional features (electoral system, party system, historical experience) and engaging with *both* delegate statements below:**
  >
  > *   **Defend which proposal is more likely to produce accountable and effective government for Valtreya.**
  > *   **Explain why the alternative proposal is less suited to Valtreya’s conditions.**
  >
  > **Delegate Statements:**
  > 1.  "The entire point of electing the president separately is that when things go badly, voters know exactly who to throw out."
  > 2.  "Proposal B is just parliamentarism with extra steps and will end up importing all the instability without any of the party discipline that makes parliamentary government workable."

  ---

  **2. Model Answer (Argues for Proposal B - ~690 words):**

  Valtreya’s chronic instability stems from its rigid presidentialism operating within a fragmented legislature. While Proposal A promises efficiency through parliamentary fusion of powers, Valtreya’s extreme multiparty system (driven by 2% PR) makes disciplined majorities elusive, risking perpetual cabinet crises. Proposal B, introducing reciprocal survival, offers a superior path by preserving direct presidential accountability while creating mechanisms to overcome gridlock, making it the more viable choice for effective and accountable government.

  Proposal A’s parliamentarism is poorly suited to Valtreya’s party system. The delegate touting party discipline assumes stable majority coalitions are achievable. However, with 6-7 parties and no party near a majority (due to 2% PR), forming a durable governing coalition would be arduous. History shows no stable legislative majority exists. Coalition partners, knowing the PM relies on their votes for survival, gain disproportionate leverage, making cabinets unstable bargaining arenas vulnerable to blackmail over individual policies. The constant threat of no-confidence votes (a feature of Proposal A) incentivizes short-term deals over coherent policy, as seen in similarly fragmented systems like Italy’s First Republic. Crucially, when this inevitable instability leads to frequent government collapses or elections, the delegate’s core claim of clear accountability ("voters know who to throw out") collapses. Voters would punish the *coalition*, diffusing blame among multiple parties, not identifying a single responsible executive. The PM, reliant on shifting coalitions, becomes a scapegoat, not the clear focal point of accountability promised by direct election.

  Proposal B directly addresses Valtreya’s core problem: fixed-term presidentialism combined with legislative deadlock. It preserves the key advantage highlighted by the first delegate: direct presidential accountability. Voters retain the power to directly reward or punish the president every five years (or sooner via dissolution-triggered elections). Crucially, it adds the *mutual threat* of reciprocal survival. The legislature gains the power to remove the president/cabinet via simple-majority no-confidence, but the president can counter by dissolving the legislature and triggering simultaneous elections within 90 days. This mechanism is fundamentally distinct from parliamentarism and counters the second delegate’s claim.

  Firstly, reciprocal survival creates a powerful deterrent against both presidential overreach *and* legislative obstructionism. A president tempted to rule by decree constantly (a past problem) risks provoking a no-confidence vote they might lose, triggering elections where they face voter anger. Simultaneously, fragmented parties blocking *all* presidential initiatives face dissolution, forcing them into an election where voters may punish their obstruction. This incentivizes negotiation *before* crises erupt. Secondly, simultaneous elections (president + legislature) strengthen, not weaken, accountability. Unlike Proposal A’s potential for mismatched majorities, voters see the president and their potential legislative partners as a package, clarifying responsibility. Thirdly, it avoids the perpetual instability trap of pure parliamentarism in fragmented systems. The "once per year" limit on using the no-confidence/dissolution power prevents constant brinkmanship. Governments aren’t overthrown weekly over minor disputes; the threat encourages parties to find workable compromises within the legislature, knowing the nuclear option has severe consequences for all. The "instability" feared is channeled into a decisive electoral reset when truly necessary, unlike the chronic cabinet shuffles Proposal A would likely produce.

  Proposal A’s promise of efficiency through fusion is illusory in Valtreya’s context; it would likely replace presidential gridlock with cabinet instability and diffuse accountability. Proposal B directly confronts the historical pathologies: it deters presidential decree abuse through the no-confidence threat, deters legislative obstruction through the dissolution threat, preserves direct presidential accountability, and clarifies responsibility through potential simultaneous elections. It harnesses Valtreya’s multipartism towards negotiated governance rather than letting it cause perpetual deadlock or cabinet chaos. Reciprocal survival offers a more realistic and balanced solution for Valtreya’s unique challenges.

  ---

  **3. Marking Scheme (Total: 25 Points):**

  **A Answer (22-25 points):**
  *   **Clear Recommendation & Context:** Explicitly defends either A or B as better for Valtreya, rooted in its *specific* institutional features (2% PR/fragmented parties, history of deadlock/decrees, fixed terms, no dissolution). (3 pts)
  *   **Engagement with Delegate 1:** Accurately explains the "clear accountability" argument for direct election and assesses its validity *under each proposal* in Valtreya's context (e.g., B preserves it; A diffuses it via coalitions). (4 pts)
  *   **Engagement with Delegate 2:** Accurately explains the "instability without discipline" critique of B and provides a *substantive rebuttal* showing how reciprocal survival differs from parliamentarism (mutual threat deterrent, simultaneous elections, limited use) and why "party discipline" is unlikely under A in Valtreya. (4 pts)
  *   **Analysis of Chosen Proposal:** Explains *why* the chosen proposal (A or B) is suited to Valtreya, focusing on how it would likely function given the party system and historical problems (e.g., A: argues coalition-building *can* work despite fragmentation; B: explains how mutual threat forces cooperation). Uses Valtreya's features as evidence. (6 pts)
  *   **Analysis of Rejected Proposal:** Explains *specifically* why the rejected proposal is *less* suitable for Valtreya than the chosen one, focusing on its vulnerabilities to the party system/history (e.g., A: cabinet instability, diffuse accountability; B: potential for deadlock/abuse if threats fail). Avoids strawmen. (6 pts)
  *   **Nuance & Synthesis:** Moves beyond simple "gridlock vs efficiency." Recognizes trade-offs. Synthesizes delegate arguments and institutional analysis into a coherent case. (2 pts)

  **B Answer (17-21 points):**
  *   Makes a recommendation but links it less precisely to Valtreya's specifics.
  *   Engages with both delegates but analysis might be shallower or less integrated (e.g., mentions them but doesn't fully rebut Delegate 2's claim about B).
  *   Analyzes both proposals but the comparison might be less sharp or less grounded in Valtreya's context (e.g., generic pros/cons).
  *   Explains the chosen proposal adequately but may not fully explore how it interacts with the fragmented legislature.
  *   Explains weaknesses of the rejected proposal but might miss key context-specific vulnerabilities.
  *   Shows good understanding but lacks the depth of synthesis or precise institutional reasoning of an A answer.

  **Common Mistakes & Point Deductions (Costs 1-3+ points each, depending on severity/frequency):**

  1.  **Ignoring Fragmentation:** Fails to base the argument primarily on Valtreya's 2% PR and resulting 6-7 party legislature with no majority. (e.g., "Proposal A will create a strong majority government" - *Mistake:* Assumes discipline/majorities magically appear under parliamentarism despite the electoral system making them improbable).
  2.  **Misunderstanding Fusion/Separation:** Equates parliamentary fusion with absolute power for the PM or presidential separation with absolute gridlock. (e.g., "A PM has no checks" - *Mistake:* Ignores coalition dynamics, legislative votes, potential head of state roles, or future elections. "Presidentialism always means gridlock" - *Mistake:* Ignores mechanisms like reciprocal survival or decree powers designed to overcome it).
  3.  **Misrepresenting Proposal B:** Treats it as identical to pure presidentialism or pure parliamentarism. (e.g., "B keeps gridlock because the president is still separate" - *Mistake:* Ignores the game-changing impact of the mutual threat of no-confidence/dissolution. "B is the same as A" - *Mistake:* Ignores the directly elected president and the specific mechanics/deterrents of reciprocal survival).
  4.  **Misapplying Stability:** Assumes fixed terms (current system or B's presidential term) automatically equal stability, or that no-confidence votes (A or B) automatically equal instability. (e.g., "Fixed terms are always more stable" - *Mistake:* Ignores that fixed terms caused *years* of deadlock/decrees in Valtreya. "No-confidence votes mean constant chaos" - *Mistake:* Ignores deterrent effects in B or potential for durable coalitions in A, however unlikely here).
  5.  **Superficial Accountability:** Focuses only on election *method* (direct vs indirect) without analyzing *clarity* of responsibility under governing conditions. (e.g., "Direct election is always clearer accountability" - *Mistake:* Fails to consider that under A, a collapsing coalition diffuses blame, while under B, simultaneous elections clarify the president-legislature relationship).
  6.  **Neglecting Delegates:** Fails to substantively engage with *both* delegate quotes as required by the question. (e.g., Only mentions one, or mentions both superficially without analyzing their claims in depth).
  7.  **Both-Sides-ism:** Presents balanced pros/cons without making a clear, defended recommendation as required. (*Mistake:* Avoids the core task of the question).

  **Why these are mistakes, not opinions:** The question demands analysis rooted *in Valtreya's given institutional and historical context*. These errors stem from ignoring that context, misrepresenting the proposals, applying generic stereotypes, or failing to meet the specific requirements of the prompt (e.g., defending a choice, engaging delegates). An opinion is *which* proposal you choose; a mistake is failing to justify it using Valtreya's reality.

  ---
  This package forces students to move beyond memorized definitions and grapple with how constitutional design interacts with party systems. The model answer demonstrates arguing for the less intuitive choice (B) by directly confronting Valtreya's history and the delegate critiques. The marking scheme explicitly rewards context-specific analysis and penalizes common analytical errors grounded in oversimplification. Good luck with your review packet!
