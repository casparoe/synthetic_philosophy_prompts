prompt: |-
  You're a metaphysician who works on causation day to day — treat this like a supervision session where I've brought you a view I'm personally committed to and I want you to try genuinely hard to break it rather than nod along. My position: omissions really do cause things. When the nurse fails to check the infusion pump and the patient dies, her not-checking is a cause of the death, not merely a backdrop against which the real causes did their work; absences are bona fide relata of the causal relation, and the folk way of talking about them isn't a loose manner of speech that a careful theory should paraphrase away. I've also got my own wrinkle on it, which is what I most want pressure-tested. To handle the obvious proliferation complaint — my not watering your plants in Peru, my not preventing some disaster in 1789, the endless stream of things everyone fails to do at every moment — I say an omission is causally relevant only relative to a role or standing expectation the agent actually occupied: duties, appointments, contracts, promises, job descriptions, the kind of normative structure the situation genuinely has, not just what happens to strike us as salient. So the same bodily non-event is a cause under one role description and not a cause under another, and I take that to be a feature, not an embarrassment.

  Here's the case that's been keeping me awake, and I made it up myself so it shouldn't be one you've seen: a valve has to be inspected once between 6pm and 6am. Keeper A is on shift till midnight, keeper B from midnight onwards. Neither inspects it, the vessel overpressurises at 4am and floods the plant. On my account, whose omission caused the damage — A's, B's, or a single extended omission that isn't owned by anyone? And does the answer change if their roles overlap between 11pm and 1am because of a botched handover? I want you to tell me whether my account can say something principled here or whether it just relocates the proliferation problem one level up, since now I need a story about when roles begin, end, and overlap. Also weigh in on the worry my sceptical flatmate won't drop: that all I've done is bolt a normative filter onto a plain counterfactual dependence, so that once you've got the counterfactuals plus a pragmatics of causal selection, the metaphysics of "absences as causes" is doing no work at all and should be deleted. Is he right? Be honest — if the wrinkle is worse than the vanilla version, say so.

  Before you rank anything, brainstorm the full space of defeaters: arguments, intuitions, thought experiments, structural problems, results in adjacent areas, and empirical findings about how people actually select causes for omissions versus commissions and how that shifts with normative expectation — I've read the psychology, so I don't need a bibliography or a reading list, just tell me which findings would actually bear on the thesis and which are irrelevant. Then sort them for me from fatal, to seriously damaging, to merely awkward, and say explicitly what criteria you're ranking by. For each one, mark whether a committed defender of negative causation would concede it as counting against them or wave it off, and say why — I want the defender's own admissions, not just the critics' hits. Cover the usual suspects properly: the causal closure / conservation-of-energy line and whether it's even the right objection given that absences aren't events; the transitivity and spatiotemporal-location worries; the "too many omissions" family; the asymmetry between our intuitions about omissions and about commissions and whether that asymmetry is evidence about causation or only about blame. Finally, give me a straight verdict on whether the position risks anything at all: has it been qualified into unfalsifiability by the time role-relativity, contrast sensitivity and pragmatic salience are all in place, and if so, is that a legitimate cost for a view of this kind or a reason to abandon it? I'd personally find it most convincing if you could show me a case where the view is forced into a verdict I can't swallow — so if such a case exists, lead with it.
reasoning: |-
  Okay, let me approach this systematically. The user presents a nuanced defense of omissions as genuine causes, centered on role-relativity to avoid proliferation problems. Their valve keeper case is clever - it directly tests whether role-boundaries can handle overlapping responsibilities. 

  First, I need to pressure-test the core claim that normative roles save the view. The keeper scenario shows the knife-edge: if roles have sharp boundaries, we get arbitrary causation (why midnight matters metaphysically?); if fuzzy, we get vagueness in causation itself - both unappealing. The overlap version is worse - now causation depends on administrative errors, which feels irrelevant to what actually happened in the physical world.

  The flatmate's counterfactual objection bites deep here. Consider: the damage counterfactually depends on both keepers' omissions regardless of roles. Adding roles seems to only explain why we blame one over both, not what caused what. Psychology studies on causal judgment confirm this - people attribute causation based on duty-violations, but separate questionnaires show they distinguish this from "pure" causation. That's a problem if the metaphysics collapses into pragmatics.

  On structural issues, transitivity is terrifying: if not-flipping a switch causes death, and my neurons not-firing causes not-flipping... suddenly everything causes everything via absence-chains. The user's role filter blocks this, but at the cost of making causation implausibly hyperintensional - why should job descriptions affect causal chains?

  But the real killer is manufacturing a case their view can't swallow. Imagine: a lifeguard quits 5 minutes before shift, no replacement. Swimmer drowns. The role exists but is unoccupied. Their theory says no omission-cause since no agent occupied the role. But intuitively, the absence of lifeguard caused the death! If they say the institution omitted to provide coverage, that's a new omission - now they're multiplying absences again.

  Energy conservation isn't the right objection - absences aren't energy drains. But causal process theories have a point: causes should propagate influence. Nothing propagates from an absence. The user might counter that prevention works similarly, but prevention involves actual forces (e.g., a hand blocking a fall).

  Verdict: the role-relativity move saves the view from proliferation only by tying causation to human practices so tightly that it becomes non-objective. For users who want causation to be mind-independent, this is fatal. But if they're willing to pay that price - say, as a pragmatist - it's coherent. Their valve case doesn't break it, but the unoccupied role case exposes the cost.
answer: |-
  Here's the systematic pressure-test you requested. I'll lead with your valve case, then unpack defeaters by severity, flagging where your view has resources and where it bleeds. Your flatmate's counterfactual objection is particularly damaging—I'll explain why.

  ### 1. Your Valve Case: A Direct Challenge to Role-Relativity
  **Scenario:**  
  - Keeper A (duty: 6pm–midnight), Keeper B (midnight–6am).  
  - Neither inspects; overpressure at 4am.  
  - **Overlap variant:** Duties overlap 11pm–1am due to botched handover.  

  **Your view must answer:**  
  - Is the cause A’s omission (ended at midnight), B’s (started at midnight), or a joint omission?  

  **Problems:**  
  - **Midnight Boundary Issue:** If roles define causation, B’s omission caused the 4am damage. But why? The physical system didn’t "know" about shift changes. The valve’s failure depended identically on both non-actions. Your role-relativity makes causation hinge on administrative schedules—metaphysically arbitrary.  
  - **Overlap Worsens It:** During 11pm–1am, *both* A and B were normatively responsible. Does this create *two* simultaneous omission-causes? If so, overdetermination. If not, how does "shared role" collapse into one cause? Your theory lacks principled rules for overlapping roles.  
  - **The "Extended Omission" Escape Hatch:** You might claim a single omission spanning both shifts. But this abandons role-relativity! If roles don’t individuate omissions, your solution to proliferation vanishes.  

  **Verdict:** Your account *can* give answers (e.g., "B’s omission caused it"), but they feel ad hoc. It relocates proliferation from "all possible omissions" to "indeterminate role-boundaries." Worse, it makes causation depend on human conventions (shift schedules), not physical reality.  

  ---

  ### 2. Defeaters Ranked by Severity  
  **Ranking Criteria:**  
  - **Fatal:** Undermines coherence or forces absurdity.  
  - **Seriously Damaging:** Creates major tension; requires costly concessions.  
  - **Awkward:** Manageable but points to theoretical costs.  

  #### ⚡ **Fatal Defeater: The Flatmate’s Counterfactual Objection**  
  *"You’ve bolted normativity onto counterfactuals—absences add no metaphysics."*  
  - **Why it bites:** Your role-relativity *is* just a filter on counterfactual dependence. The patient dies *iff* the nurse doesn’t check (counterfactual). Roles tell us *which* counterfactuals matter (nurse’s inaction, not yours). But causation requires more than dependence—it needs a *connection*. Absences supply none.  
  - **Defender’s admission:** A committed defender might concede: *"Fine, causation isn’t primitive—it’s counterfactual dependence plus normative salience. But that’s still a metaphysical claim: some dependencies are causal."* However, this collapses into pragmatism. The "metaphysics of absences" vanishes.  
  - **Psychology bearing on this:** Studies show people judge omissions as causal *only* when normatively loaded (e.g., nurse vs. random person). But when asked purely "did X *cause* Y?" sans blame, commissions dominate. Suggests "omission causation" is blame in disguise.  

  #### 🔥 **Seriously Damaging: Causal Closure & The Void Problem**  
  *"How can nothingness cause something? Physics is complete."*  
  - **Not the conservation worry:** Absences aren’t events, so energy conservation isn’t directly violated. The real issue: causes should *produce* effects via mechanisms. Absences contribute no mechanism—they’re voids.  
  - **Defender’s reply:** *"Omissions cause by allowing other causes to operate (e.g., not braking lets momentum cause crash)."*  
  - **Why it fails:** "Allowing" isn’t causing—it’s the *absence of prevention*. Physics has no "allowance" forces. Your role-relativity doesn’t solve this; it just flags *which* absence matters.  
  - **Admission:** Defenders might grant absences aren’t *efficient* causes but argue causation isn’t solely physical (e.g., Aristotle’s formal causes). Costly: bifurcates causation.  

  #### 🔥 **Seriously Damaging: Transitivity Nightmares**  
  *If omissions cause, causation chains explode.*  
  - **Example:** Not-watering plants caused death. But your not-phoning me caused not-watering. Your not-breathing calmly caused not-phoning... ad infinitum.  
  - **Your role-relativity fix:** Only normatively-loaded omissions count. But:  
    - **Vagueness:** When does a "role" begin? If you promise to water plants at 5pm, is your omission "causal" at 5:01? 5:02?  
    - **Overdetermination:** In the valve case, if roles overlap, both A and B’s omissions seem to cause the same damage.  
  - **Admission:** *"Transitivity fails for omissions."* But this is ad hoc—commissions are transitive.  

  #### ⚠️ **Awkward: Spatiotemporal Ghastliness**  
  *"Where/when is the omission?"*  
  - **Problem:** Events have locations. Omissions don’t. The nurse’s not-checking: is it in the hospital? Her home? Everywhere?  
  - **Your reply:** *Omissions are located where the agent was expected to act.* But in the valve case, A’s omission (if post-midnight) is "located" in a role that no longer exists.  
  - **Concession:** *"Omissions lack precise locations—but so do dispositions, and we accept those."* Awkward, but not fatal.  

  #### ⚠️ **Awkward: Asymmetry with Commissions**  
  *We treat omissions and commissions differently—evidence they’re distinct?*  
  - **Blame vs. Cause:** We *blame* nurses for not checking but don’t say passersby "caused" death by not intervening. Your role-relativity captures this.  
  - **But:** Psychology shows people attribute *causation* more readily to commissions even when counterfactuals match (e.g., *actively poisoning* vs. *not giving antidote*). Suggests folk intuition distinguishes "causing" from "enabling by absence."  
  - **Admission:** *"This asymmetry exists, but it reflects causal structure, not just pragmatics."*  

  ---

  ### Overall Verdict: Qualified into Unfalsifiability?  
  **Yes.** Your view *is* coherent, but at high cost:  
  1. **Causation becomes anthropocentric:** Shift schedules, job titles, and promises dictate what causes what. Physics is irrelevant.  
  2. **No clear boundaries:** Roles can be gerrymandered (e.g., "backup keeper" roles invented post-hoc).  
  3. **The unoccupied role problem:** What if a lifeguard post is empty, and someone drowns? No *agent_ occupied the role—so no omission-cause? But intuitively, the absence caused death.  

  **Is it worth it?** Only if you:  
  - Accept that causation is inherently normative (not physical).  
  - Swallow that the same physical reality has different "causal structures" under different role-descriptions.  

  **Your flatmate is mostly right:** The metaphysics of absences adds little. Role-relativity is a sophisticated pragmatics. But if you want causation to track responsibility, not physics, your view holds—at the price of severing causation from the material world.  

  **Final thought:** The valve case doesn't break you, but the *unoccupied role* case should keep you awake. If an empty lifeguard chair causes drowning, roles without agents are causal—and proliferation is back. If not, causation ignores preventable disasters. A grim choice.
