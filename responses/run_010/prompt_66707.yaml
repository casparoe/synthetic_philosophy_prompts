prompt: |-
  Okay so I've been turning this over on my own for like two years with nobody to argue with, so I'm going to lay it out and you tell me where it breaks.

  My view: when you blame somebody for a thing you do yourself, you don't just lose credibility or make a weaker argument — you lose the right to say it at all. The exact same words coming from someone else would be fine; coming from you they aren't blame anymore, they're something else. I call it the clean-hands thing (its probably got a real name, use whatever). It has nothing to do with whether you're right. My brother is a functioning drinker and he's completely correct that his kid shouldn't be doing what his kid is doing — I'm still saying he isn't the one who gets to say it.

  Two patches I've already added, and I want you to go after these hard because I suspect they're carrying more weight than I've admitted: (1) you get your standing back if you actually stopped and owned it out loud, not just felt bad about it privately, and (2) the bigger the gap between your failing and the one you're blaming, the less the mismatch matters.

  What I want:

  - the cases, arguments, and observations that should genuinely move me off this, ranked from "this ends the view" down to "awkward but I survive it"
  - which of those a person holding my view would honestly concede count against them, and which they'd wave off — plus a straight answer on which of those wave-offs are legitimate
  - what my view predicts that the rival doesn't. The rival: hypocrisy is only ever an epistemic problem, it just makes people discount your testimony, and there's no separate "right to blame" that gets forfeited. Give me a situation where those two come apart so I can see which one is tracking something real
  - whether my two patches have quietly made this unfalsifiable, and if so whether that's a special problem for a view about blame or whether views like this are just allowed to be that way

  The case that scares me most, and I dont know what to do with it: in addiction circles the person best placed to tell a guy he's wrecking his life is often the guy who already wrecked his own. My brother's old sponsor has *more* standing with him than I do, and specifically because he did the same thing. If that generalizes past addiction, I've got the direction of my whole view backwards. Tell me whether it's a special case or whether I'm wrong.

  Write it in American English, and skip the citations and reading lists — I can't look anything up, I'd rather you just make the arguments directly.
reasoning: |-
  Okay, let me unpack this user's query. They've been wrestling with this idea for two years - that hypocrisy strips your right to blame others, regardless of truth. They call it the "clean-hands" principle. Their brother's situation with drinking illustrates it well: even when correct, the brother loses moral standing to criticize his kid.

  The user already added two modifications: (1) you regain standing if you publicly own your failure, and (2) the bigger the gap between your failing and theirs, the less it matters. They want these tested hard.

  Breaking down their requests:
  - They need counterarguments that challenge their view, ranked by impact
  - Analysis of which counterarguments they'd likely accept vs dismiss
  - A comparison against the rival view (that hypocrisy is only about credibility, not rights)
  - Assessment of whether their patches make the view unfalsifiable
  - Resolution of the addiction sponsor case that seems to contradict their whole premise

  The addiction sponsor example is particularly troubling - it suggests firsthand experience grants superior standing, the opposite of their clean-hands principle. This needs careful handling.

  Key angles to explore:
  1) The difference between moral authority and epistemic authority - the sponsor has the latter despite lacking the former
  2) Distinguishing blame from other forms of criticism (warning, advice)
  3) Whether "right to blame" is about social permission versus moral justification
  4) How their patches function - the "owning it" clause seems reasonable, but the "gap" modifier might be doing too much work

  For test cases:
  - Rank counterarguments: strongest being cases where hypocrites are uniquely positioned to deliver effective criticism (addiction sponsors, reformed criminals in deterrence programs)
  - Concessions: they'd likely admit the sponsor case is valid but argue it's specialized (recovery communities)
  - Rival view test: imagine a hypocrite whose criticism is discounted for credibility but still morally valid (like a politician condemning affairs while having one - people dismiss it as insincere but it's still true)
  - Falsifiability: the gap-size patch risks making the theory untestable since "significant gap" is subjective

  The sponsor case isn't fatal - it shows their principle applies best to moral condemnation, not all forms of intervention. But they'll need to clarify what "blame" means in their framework.
answer: |-
  Here's the direct take on your clean-hands view, argued head-on as requested. I'll hit your points in order, saving the addiction case for last.

  ### 1. Cases/Arguments That Challenge Your View (Ranked by Impact)
  **A. The Interventionist Hypocrite (Ends the view if accepted)**  
  *Scenario:* A former gang leader (convicted of violence) runs an anti-gang program. He tells a kid, "You'll end up dead or in prison like I did." The kid listens *because* the leader has identical failures. His hypocrisy isn't a bug—it's the feature.  
  *Why it moves you:* This directly contradicts your core claim. The words aren't "something else" (like jealousy or deflection); they’re *more* potent blame *because* of his dirty hands. The ex-addict sponsor case you fear is this exact pattern. If this generalizes beyond addiction (e.g., ex-cons deterring crime, repentant extremists deradicalizing others), your view collapses. **If you concede this isn't special to addiction, your view is backwards.**

  **B. The Necessary Hypocrite (Seriously undermines, but survivable)**  
  *Scenario:* A corrupt mayor condemns city council bribery. Is he wrong? No—the council *is* corrupt. Should he shut up? Then the only people calling out corruption would be saints (who rarely exist) or outsiders (who lack leverage). Society often needs hypocrites to initiate change.  
  *Why it moves you:* It shows hypocrisy can be instrumentally necessary. Your view implies we should silence accurate criticism if the critic is flawed. But if clean hands are too rare, corruption goes unchallenged. Your "right to blame" rule might enable worse harm.

  **C. The Asymmetry Defense (Awkward but you survive)**  
  *Scenario:* Your brother tells his kid, "Drinking ruins lives," while drunk. You argue he lost the right. But what if he says it *sober* the next morning, filled with regret? Or what if he’s blaming his kid for *heroin* use, not alcohol?  
  *Why it’s awkward:* Your patches cover this, but it exposes their limits. If he "owns it" (Patch 1) or the gap is big (heroin vs. alcohol, Patch 2), he *regains* standing. But this feels arbitrary—why does heroin grant him moral authority when beer doesn’t? It suggests your rule is situational, not absolute.

  ### 2. What You’d Concede vs. Wave Off (And Legitimacy)
  - **You’d concede:** The **Interventionist Hypocrite** (A) is valid in addiction/recovery contexts. It’s a direct counterexample to your universal claim. *Legitimate? Yes. It proves hypocrisy doesn’t *always* nullify standing.*  
  - **You’d wave off:** "But the mayor *is* right about corruption!" (from B). You’d say, "He still forfeited his *right* to blame, even if he’s factually correct." *Legitimate? Partly.* Your view separates truth from standing, so this is consistent. But it highlights that your rule prioritizes purity over results.  
  - **You’d wave off (less legit):** "What if the hypocrite’s blame *works*?" Example: A cheating spouse shames their partner for cheating, causing reform. You’d say, "Still illegitimate blame." *Less legitimate* because it dismisses real-world consequences. If "blame" is defined by its function (stopping harm), effectiveness *should* matter.

  ### 3. Your View vs. The Rival (Hypocrisy as *Only* an Epistemic Problem)  
  **The rival view:** Hypocrisy makes people distrust you ("Why listen to a liar?"), but it doesn’t touch the *moral permissibility* of blaming. The words themselves are fine—they’re just less persuasive.  
  **Your view:** Hypocrisy makes the blame *morally illegitimate*, regardless of truth or impact. The same words are tainted.  

  **Test Case: The Prison Reform Hypocrite**  
  *Setup:* A violent prisoner (Prisoner X) beats a cellmate for assaulting a guard. He yells, "You never hit staff! That’s the one rule you don’t break!"  
  - **Rival view:** Prisoner X’s violence makes him an unreliable messenger. Others might ignore him as a hypocrite, but his statement is *factually correct* and *morally permissible* to utter.  
  - **Your view:** Prisoner X has zero standing to condemn the assault. His words aren’t "blame" but maybe intimidation or projection. It’s *inherently wrong* for him to say it.  

  **Why your view tracks something real:** In the cellblock, Prisoner X’s "blame" feels like aggression, not moral appeal. It’s coercive, not corrective. The rival view misses that hypocrisy can corrupt the *moral nature* of the act, not just its persuasiveness.  

  ### 4. Your Patches: Unfalsifiable?  
  **Patch 1 (Owning it):** Not unfalsifiable. We can test if public confession restores standing (e.g., "Does an alcoholic who admits their problem gain credibility condemning drunk driving?"). This is observable.  
  **Patch 2 (Gap size):** **Dangerously unfalsifiable.** "Big gap" is undefined. Is cheating ≠ murder a big gap? What about embezzlement ≠ speeding? You can always claim a gap is "too small" to restore standing. This makes your view slippery—no counterexample can stick because you adjust the gap to fit.  
  **Is this a special problem?** Yes. Blame relies on social norms, which are fuzzy. But a theory that can’t be tested fails as a tool for reasoning. You *must* define "gap" objectively (e.g., "different moral categories," "orders of magnitude in harm") or this patch sinks you.

  ### The Addiction Case: Special or Fatal?  
  **It’s a special case, but proves your view isn’t universal.**  
  - Why it’s special: Recovery communities operate on **redemption logic**, not clean hands. Standing comes from:  
    - **Shared experience:** "You know I get it because I did it."  
    - **Proof change is possible:** "I was worse than you, and I’m here."  
  - Why it doesn’t generalize: Outside these contexts, identical failures *usually* undermine standing. Example: A CEO fired for fraud can’t credibly blame an employee for stealing office supplies—it feels like scapegoating.  
  - **Verdict:** Your view holds *unless* the hypocrite is:  
    (a) In a role where redemption is central (e.g., mentor, clergy),  
    (b) Using their failure as proof of insight (not just finger-wagging).  
    You’re not backwards—you just need a caveat: **"In contexts focused on moral correction (not redemption), clean hands matter."**

  ### The Core Tension
  Your view excels at capturing the **violation of shared moral community**. Blaming others while exempting yourself is a power move, not justice. But it underestimates **instrumental hypocrisy** (when flawed people fix problems) and **redemption** (when failure becomes authority). The patches help, but Patch 2 needs rigor. Drop the "right to blame" absolutism—focus on *when hypocrisy corrupts the moral act itself*. That’s where your insight bites deepest.
