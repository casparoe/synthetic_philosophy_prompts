prompt: |-
  You're a political philosopher who's spent years on self-determination and territorial rights, and I want you to do the unglamorous part before any of the theories. Context: I've been asked to write an internal memo for a democracy-monitoring outfit that has to decide whether to endorse some version of a right to secede in its public statements and its country reporting. So the bar isn't elegance, it's whether a theory can be turned into something my employers could actually say out loud about a live crisis without it collapsing on contact.

  What I want first is the spec. Write out the desiderata — what any account of when a group may take a slice of an existing state's territory and set up on its own has to deliver to be adequate for that purpose. For each requirement, give me the case or the consideration that motivates it, and mark whether it's genuinely non-negotiable or whether it's something one camp insists on and dresses up as a requirement (plebiscitarians will demand one set of things, just-cause and remedial theorists another, and I suspect a lot of what gets listed as a desideratum is a partisan preference in costume).

  Use these as your test cases but don't stop there: the Scottish vote Westminster agreed to in 2014, where the parent state handed over the legal power to hold it; the Catalan one in October 2017, which the Spanish constitutional court struck down and suspended before it happened, held anyway at roughly 43% turnout with police physically closing polling stations, followed by a declaration of independence that lasted about as long as it takes to say; Quebec in 1995, where the No side won by a few tenths of a point on a question whose wording everyone argued about, and then Ottawa went to the Supreme Court and afterwards legislated about what counts as a clear question and a clear majority; and a consensual dissolution where nobody much objects, like the velvet split. A good spec should tell me in advance what the theory has to say about each of those, and about the cases where they disagree with each other.

  Also insist that the distinctions I care about not get collapsed: between having a right to leave and having a right to take the land with you; between external self-determination and the internal kind; between a remedy for ongoing injustice and a standing permission any sufficiently cohesive group can invoke whenever it likes; and between the claim of the seceding group and the claim of the minority inside it that doesn't want to go. Call that last one the recursion problem: if a province can peel off, why can't a city inside the new state peel off from it, and why does the peeling stop at any particular level rather than going all the way down to the individual, which is just an exit right with no territory left to exit with.

  Now the part I actually care about most. Tell me whether some subset of your list is jointly unsatisfiable. My suspicion is that demanding a determinate answer to who exactly counts as the demos, demanding neutrality about contested historical claims on both sides, and demanding that a successful secession be final and stable so the thing doesn't just restart can't all be had at once — the demos question has to be settled by someone, and whoever settles it isn't neutral, and any settlement leaves a group inside the new border with a complaint that looks exactly like the original one. But I might be wrong, so argue it rather than assume it, and if the set turns out to be consistent after all, say why and show me the model. If it is impossible, that's the finding, and I want to know which requirement gets dropped and what specifically we lose by droping it.

  Last thing: tell me which single requirement does the most work knocking out candidate theories, the one that if you take seriously rules out the most otherwise attractive views.

  Take your time and brainstorm out loud first — a few lines of you sorting which demands are real from which are shibboleths, before you commit to the list. Then write the whole thing as continuous prose, the way you'd write a letter or a long email: no headings, no bullet points, no numbered lists, no bold, no tables, just paragraphs that run into each other. If you feel like ending with a couple of lines on how the main families of view you know measure up, fine, but don't name-drop authors or give me references — I can't check them and I don't want a bibliography. Definately more interested in the criteria than in the scorecard.
reasoning: |-
  Okay, let me approach this systematically. The user wants a set of criteria for evaluating secession rights theories, tailored for practical policy use - not academic elegance but real-world applicability. They've provided specific test cases and emphasized avoiding conceptual collapses between related but distinct ideas.

  First, I need to identify genuine desiderata versus partisan preferences disguised as requirements. The key is distinguishing what's essential for any credible position from what specific schools of thought demand. For instance:
  - Plebiscitary theories will insist on democratic expression as sufficient
  - Remedial theories require prior injustice
  - Nationalist theories emphasize cultural distinctiveness
  But the core requirements should transcend these camps.

  The user's test cases reveal crucial dimensions:
  - Scotland 2014 (state-consented referendum)
  - Catalonia 2017 (unilateral, suppressed)
  - Quebec 1995 (ambiguous question/margin)
  - Velvet divorce (mutual agreement)
  These show we need criteria handling both consensual and contested scenarios.

  The conceptual distinctions they mentioned are critical:
  1. Right to leave vs right to territory (exit isn't land claim)
  2. External vs internal self-determination (sovereignty vs autonomy)
  3. Remedial vs primary right (injustice trigger vs inherent right)
  4. Majority claim vs minority recursion (the subunit problem)

  Now for the core challenge: identifying potential incompatibilities. The user suspects that determinacy, neutrality and stability might be jointly unattainable. I think they're right - any resolution of the "demos question" (who decides) requires a non-neutral authority, and any border-drawing creates new minorities with identical grievances.

  The recursion problem seems particularly devastating - it threatens to reduce all territorial claims to individual exit rights. Any viable theory must explain why secession stops at certain boundaries without special pleading.

  Among all requirements, I suspect the "no new minorities" criterion does the heaviest lifting in disqualifying theories. Most frameworks struggle with this - even remedial justifications don't solve the problem of creating new oppressed groups within the seceded territory.

  For the memo format, I'll avoid academic scaffolding and present as continuous prose. The conclusions will show that while we can get a workable set of criteria, perfect neutrality and perfect stability are indeed incompatible - in practice, we must prioritize procedural legitimacy over absolute neutrality.
answer: |-
  You're right to demand the unglamorous groundwork before theory. Deciding whether a democracy-monitoring outfit endorses a "right to secede" publicly requires a brutally practical filter: what *must* a credible account handle to avoid collapsing amid real-world crises? Forget philosophical elegance; we need criteria that expose whether a theory can generate pronouncements usable in places like Barcelona, Edinburgh, or Quebec without immediately self-destructing or causing more harm than good. Based on the cases you provided and the conceptual minefields, here’s the spec – the non-negotiable demands and the contested ones masquerading as universals, with the test cases and your required distinctions woven in.

  First, genuinely non-negotiable desiderata. Any account must:

  1.  **Distinguish Exit from Territorial Claim:** It must rigorously separate the right of individuals or groups *to leave* a state (emigration, renunciation of citizenship) from the right *to take territory* and establish a new sovereign state. Failure here collapses everything into individual rights, ignoring the core problem of land and jurisdiction. This is fundamental: Catalonia isn't about Catalans moving to France; it's about claiming Barcelona. No viable theory can skip this distinction.
  2.  **Address the Recursion Problem (No New Minorities):** If a group (e.g., Catalans) claims a right to secede based on principle X (e.g., distinct nationhood, prior sovereignty, remedial injustice), the theory *must* consistently explain why a subunit *within* that group (e.g., the Val d'Aran, Tarragona, or even pro-union neighborhoods in Barcelona) doesn't immediately gain the *identical* right to secede *from the new state* using principle X. It must show why the "peeling" stops where it does. Failure here risks infinite regress or exposes the justification as arbitrary. Quebec avoiding this with its "territorial integrity" while seceding from Canada highlights the tension.
  3.  **Require a Definable "Self" and Territory:** It must specify, however imperfectly, *who* constitutes the group claiming the right and *what territory* they claim. "The people of Scotland" in 2014 was defined by residency and the existing Scottish administrative boundary. Quebec used the provincial boundary. A theory relying on "a people" must offer a non-circular way to identify them *before* the secession vote. Vagueness here makes the claim operationally useless and fuels conflict, as seen in debates over who should vote in Catalonia (only Catalans? All Spanish citizens in Catalonia?).
  4.  **Provide Procedural Determinacy:** It must specify a clear, knowable *process* for how the claim is legitimately asserted and decided. Is it only with state consent (Scotland)? A unilateral declaration after a vote (Catalonia 2017)? A supermajority under agreed rules (Quebec post-Clarity Act)? Without this, the claim is just a justification for force or chaos. The Spanish Constitutional Court striking down the Catalan referendum underscores the crisis caused by procedural ambiguity.
  5.  **Acknowledge Stability/Order as a Constraint:** It must recognize that successful secession isn't just a moral claim; it requires establishing a *viable, stable* new state entity capable of maintaining order, providing basic governance, and engaging internationally. The Catalan declaration's instantaneous collapse demonstrates the gap between claim and reality. The Velvet Divorce worked partly because both new states were demonstrably viable from day one. A theory ignoring practical stability is irresponsible for a monitoring outfit.
  6.  **Distinguish External from Internal Self-Determination:** It must clarify whether the claimed right is for *full sovereign independence* (external) or for *meaningful autonomy within* the existing state (internal). Conflating them lets states off the hook ("we gave them a parliament, what more do they want?") and obscures whether secession is genuinely necessary. Remedial theories often hinge on this: was internal self-determination genuinely exhausted or impossible (Catalonia's claim) or was it offered and functional (Scotland's devolution)?
  7.  **Account for State Legitimacy (The Flip Side):** It must engage with the legitimate interests and claims of the *remaining state* and its population. Secession isn't just an act by Group A; it dismembers State B, altering the rights and obligations of all its citizens. Westminster agreeing to Scotland's vote reflected a political judgment about the UK's legitimacy and cohesion. Spain's resistance reflected its constitutional order. A theory treating the parent state as merely an obstacle misses half the equation.

  Now, desiderata fiercely contested between camps, often presented as essential but reflecting core theoretical divides:

  8.  **Remedial Cause vs. Primary Right:** *Must* secession be justified *only* as a remedy for grave, persistent injustice (discrimination, oppression, broken autonomy promises - arguably Catalonia's claim)? Or can a cohesive group exercise a primary right based on national identity or democratic will, even absent grave injustice (arguably Scotland/Quebec's claims)? Remedialists insist the former is non-negotiable to prevent fragmentation; plebiscitarians/primary right theorists demand the latter as essential for democratic freedom. This is the deepest fault line. Your outfit endorsing one implicitly rejects the other.
  9.  **Democratic Expression as Necessary/Sufficient:** Is a clear, free, and fair majority vote *sufficient* to legitimize secession (plebiscitarians/primary right), or is it merely *necessary* (or even potentially irrelevant) without other conditions like a just cause or state consent (remedialists, consent theorists)? The 2017 Catalan vote (disputed legality, low turnout, held under duress) tests whether "democratic will" alone suffices. The Quebec Clarity Act shows Ottawa demanding more than just a bare majority on an unclear question. This is partisan.
  10. **Neutrality on Competing Historical Narratives:** *Can* a theory adjudicate secession claims without taking sides in contested histories (e.g., Catalonia's medieval autonomy vs. Spanish constitutional unity; Quebec's conquest vs. federal partnership)? Remedial theories often *require* judging historical injustices. Primary right theories try to sidestep history, focusing on present will or identity. Achieving true neutrality is likely impossible; the act of specifying the "self" or a "just cause" inevitably engages contested narratives. This is a key source of instability.
  11. **State Consent as Mandatory:** Must the existing state *always* consent for secession to be legitimate (as per much international law and the Spanish position)? Or can legitimacy arise unilaterally under extreme conditions (remedial just war analogues)? The Velvet Divorce had consent; Catalonia did not. Making consent non-negotiable empowers states to block even seemingly justified secessions; denying it entirely risks anarchy. This reflects the consent/remedial divide.

  **On Joint Satisfiability and the Core Tension:**
  Your suspicion is correct. A subset of demands is *jointly unsatisfiable* in a way that guarantees perfect stability and neutrality: **Definable Demos + Procedural Determinacy + Stability/Finality + Neutrality on History/Narrative.**

  *   **Why:** To have a *definable demos* and a *determinate procedure*, *someone* must authoritatively define the group ("Catalans defined by X") and the process ("vote requires Y majority under Z rules"). That authority (constitutional court, parliament, international body) *cannot be neutral.* Its definition will favor one narrative (e.g., "Catalonia is an integral part of Spain" or "Catalonia is a nation") and one conception of the relevant "people" (residents vs. ethnic Catalans). This act of definition *creates* or *leaves behind* a minority within the newly defined territory whose claim ("We *are* Spanish! Why are we being dragged out?") is structurally identical to the original secessionist claim, just scaled down (the recursion problem). This minority's opposition inherently threatens the *stability/finality* of the new arrangement. The Quebec Clarity Act tries to manage this by demanding clarity *beforehand*, but it still required Ottawa (non-neutral) to define acceptable clarity, leaving sovereigntist Quebecers feeling aggrieved and pro-union minorities in Quebec still present. The Velvet Divorce worked because near-consensus minimized the aggrieved minority. Catalonia shows the explosion when the minority is large and the process contested. You *cannot* have perfect neutrality in defining the demos *and* perfect procedural determinacy *and* guarantee no aggrieved minorities *and* thus perfect stability. The recursion problem ensures the minority issue persists.

  *   **What Must Give:** In practice, for a usable framework, **perfect neutrality must be sacrificed.** We must accept that defining the demos and the process involves contestable political judgments, not pure neutral arbitration. The focus shifts towards *procedural legitimacy* – was the definition and process as inclusive, transparent, and fair as possible *given the context*, even if not perfectly neutral? Scotland and post-Clarity Act Quebec aim for this. The cost of dropping neutrality is that the framework will always be vulnerable to charges of bias from the losing side, risking instability. The alternative – clinging to impossible neutrality – leads to paralysis or fuels conflict through ambiguity (Catalonia 2017).

  **The Heavyweight Desideratum:**
  The requirement that does the most work knocking out otherwise attractive theories is **"Address the Recursion Problem (No New Minorities)."** It's devastatingly effective.

  *   **Why:** Plebiscitary/Primary Right theories (especially romantic nationalist ones) often founder spectacularly here. If Quebec is a nation entitled to self-determination, why isn't Montreal? Why isn't a neighborhood? If "the will of the people of Catalonia" suffices, why doesn't the will of the people of Lleida (if they voted against) suffice to stay with Spain? Remedial theories struggle too: if Catalonia secedes due to Spain's oppression, what remedies the "oppression" felt by the pro-Spanish minority *within* Catalonia under the new Catalan state? Consent theories relying on existing administrative borders (like Canadian provinces) seem arbitrary – why *that* level? Theories focused solely on cultural distinctiveness or prior history face the same scaling problem. This requirement forces every theory to confront the inherent arbitrariness and violence of drawing borders and imposing a new sovereign on those within them who reject it. Simple, appealing theories based on democratic will or national identity often collapse under this weight, revealing they haven't truly solved the core problem of territorial jurisdiction and the coercion inherent in state formation. It exposes that secession isn't just freedom *for* a group, but the imposition of a new state *on* everyone within the claimed territory.

  **How Theories Measure Up (Briefly):**
  *   **Plebiscitary/Primary Right:** Excel on democratic expression and procedural clarity (if rules are set). Often stumble badly on recursion (who votes? why this territory?), downplay the state's legitimate interests, and ignore remedial needs. Struggle with neutrality when defining the demos. Handle Scotland/Quebec (with rules) better than Catalonia.
  *   **Just-Cause/Remedial:** Strong on addressing grave injustice and providing a (theoretically) objective trigger. Better at engaging the state's responsibility. Often handle recursion slightly better by tying the right to the *victimized group*, but creating new minorities remains a huge problem. Struggle fiercely with procedural determinacy and neutrality (who judges the injustice? how severe must it be?). May legitimize Catalonia but struggle to condemn a suppressed unilateral move. Can make Scotland/Quebec seem unnecessary.
  *   **Consent/Associative:** Prioritize stability and existing order. Strong on procedural determinacy (only legal routes) and respecting state integrity. Handle Velvet Divorce perfectly. But can entrench injustice by making secession impossible without state consent (ignoring remedial needs), appear blatantly non-neutral against aggrieved groups, and offer no answer to recursion beyond "existing borders." Catalonia becomes illegitimate by definition; even Scotland required Westminster's consent.
  *   **Nationalist/Cultural:** Provide intuitive appeal for groups with strong identities. But definitions of "nation" are fiercely contested and non-neutral. Recursion is a nightmare (sub-groups claim distinct nationhood). Offer little procedural guidance beyond assertion. Struggle with democratic expression if the "nation" doesn't align with voters. Catalonia and Quebec fuel these, but they provide poor *general* criteria.

  The takeaway for your memo is this: Any endorsement of a secession right must grapple openly with the recursion problem and abandon the illusion of perfect neutrality. Prioritize frameworks that emphasize clear, inclusive procedures for defining the group and the process (leaning towards the plebiscitary/consent hybrid seen in Scotland/Clarity Act Quebec), while explicitly acknowledging the remedial dimension as a crucial *context* justifying why such a drastic step might be considered, even if not a strict prerequisite. Avoid absolutist claims based solely on identity or unchecked majority will. Stress that secession is a last-resort, inherently destabilizing mechanism that creates new minorities; the primary focus for a democracy monitor should always be on robust *internal* self-determination and mechanisms to address grievances *within* the existing state, making secession less likely and less necessary. The right to secede, if endorsed, should look more like a tightly constrained, procedural emergency exit than a standing invitation.
