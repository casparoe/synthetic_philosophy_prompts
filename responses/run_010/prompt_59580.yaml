            L_D_notE = 1.00 * 0.80 = 0.80

            LR_D = 0.05 / 0.80 = 0.0625

            Prior odds (for this step) = 0.045 / (1-0.045) = 0.045/0.955 ≈ 0.04712

            Posterior odds = 0.04712 * 0.0625 ≈ 0.002945

            P_after_D = 0.002945 / (1+0.002945) ≈ 0.00294 (round to 3 decimals: 0.003)

          Final P(E) = 0.003

          This is a significant drop.

       Example (ii): tremor (0.20, 0.50, 0.30) and gas (0.15, 0.45, 0.40) arriving on the same shift, with GPS down for maintenance.

          Prior: 0.14

          Step 4: Update with TG (both available)

            L_TG_E = 
              We need to iterate over all i and j.

              i=0 (T_quiet), j=0 (G_quiet): 0.20 * 0.15 * 0.05 = 0.0015
              i=0, j=1: 0.20 * 0.45 * 0.05 = 0.0045
              i=0, j=2: 0.20 * 0.40 * 0.00 = 0

              i=1 (T_elev), j=0: 0.50 * 0.15 * 0.05 = 0.00375
              i=1, j=1: 0.50 * 0.45 * 0.10 = 0.0225
              i=1, j=2: 0.50 * 0.40 * 0.15 = 0.03

              i=2 (T_high), j=0: 0.30 * 0.15 * 0.00 = 0
              i=2, j=1: 0.30 * 0.45 * 0.10 = 0.0135
              i=2, j=2: 0.30 * 0.40 * 0.50 = 0.06

              Sum L_TG_E = 0.0015+0.0045+0+0.00375+0.0225+0.03+0+0.0135+0.06 = 0.13575

            L_TG_notE = 
              i=0, j=0: 0.20*0.15*0.60 = 0.018
              i=0, j=1: 0.20*0.45*0.20 = 0.018
              i=0, j=2: 0.20*0.40*0.05 = 0.004

              i=1, j=0: 0.50*0.15*0.10 = 0.0075
              i=1, j=1: 0.50*0.45*0.03 = 0.00675
              i=1, j=2: 0.50*0.40*0.01 = 0.002

              i=2, j=0: 0.30*0.15*0.005 = 0.000225
              i=2, j=1: 0.30*0.45*0.005 = 0.000675
              i=2, j=2: 0.30*0.40*0.00 = 0

              Sum L_TG_notE = 0.018+0.018+0.004+0.0075+0.00675+0.002+0.000225+0.000675 = 0.05715

            LR_TG = 0.13575 / 0.05715 ≈ 2.3755

            Prior odds = 0.14 / 0.86 ≈ 0.16279

            Posterior odds = 0.16279 * 2.3755 ≈ 0.3868

            P_after_TG = 0.3868 / (1+0.3868) ≈ 0.279 (round to 0.279)

          Step 5: GPS is down, so skip.

          Final P(E) = 0.279

       Example (iii): The deputy director announced an expected increase, but the update produces a lower number.

          Scenario: 
            Prior in the morning: say 0.25 (we don't have the exact, but we'll assume)
            The deputy director said at 11: they expect to raise the alert at noon.
            Then the midday run (with the new data) produces a board number lower than the morning one.

          What the analyst does:

            Step 1: The analyst runs the procedure and gets a result that is lower (e.g., 0.20) than the morning (0.25).

            Step 2: The analyst must double-check the input: 
                     - Check the sensor status: are any dead? 
                     - Check the vectors: did they enter correctly?
                     - Check the calculation: redo the arithmetic.

            Step 3: If the calculation is correct, then the analyst must note in the log:

                     "Midday update: Prior P(E)=0.250, after update P(E)=0.200. This is a decrease, contrary to the deputy director's announcement."

            Step 4: The analyst must immediately telephone the deputy director and the observatory director to report the discrepancy.

            Step 5: The analyst must not change the alert level until the discrepancy is resolved.

            Step 6: The analyst must document the call and the instructions received.

       What the procedure cannot deliver:

          - It cannot capture dependencies beyond the ones we precomputed (like the TG group). If there are dependencies between TG and D, we ignore them.

          - It relies on the precomputed likelihood tables. If these are not accurate (due to non-stationarity or limited data), the updates may be poor.

          - The model assumes that the eruption state E is binary (eruption above stated size or not). It does not capture different levels of activity that might be precursors.

          - The procedure does not account for temporal evolution (like a trend). We update based on the current reading only.

          - The procedure does not incorporate other information (like visual observations, or data from other sensors not included in the three channels).

          - The procedure may break if the soft classifier is poorly calibrated.

          - The independence assumptions (conditional and in the soft vectors) may not hold.

          Therefore, the procedure is a decision support tool. The analyst must use judgment and consult experts when:

              - The update produces a result that contradicts strong expectations (like example iii).
              - The update leads to crossing an alert threshold.
              - The readings are ambiguous or the situation is complex (like multiple sensors dead, or readings that are extreme and unprecedented).

          The final decision to change the alert level must be signed off by a senior scientist.

   12. We write the procedure in a step-by-step manner for the analyst.

       Note: The spreadsheet must be set up to do the arithmetic. We assume the analyst has a spreadsheet with:

          - Cells for input: current P_old, and the vectors for T, G, D (and checkboxes for dead?).

          - Precomputed tables (TG_E, TG_notE, D_E, D_notE) in fixed cells.

          - Formulas to compute L_TG_E, L_TG_notE, then LR_TG, then update to P_after_TG, then similarly for D.

       We assume the spreadsheet is built by experts. The procedure is about using the spreadsheet.

       Procedure Document:

          Title: Procedure for Updating Eruption Probability

          Step 0: Preparation
            - Open the duty spreadsheet. Ensure you are on the "Update" tab.
            - Note the current eruption probability (P_old) from the duty board and enter it in cell B2 (which is labeled "Prior P(E)"). Enter it to 3 decimals.

          Step 1: Check sensor status and record readings
            - For each channel (Tremor, Gas, GPS):
                 * Check the system status: if the sensor is dead (as indicated by the maintenance log or system flag), check the "Dead" checkbox for that channel and leave the vector blank.
                 * If the sensor is working, enter the vector (q, e, h) exactly as provided by the software in the corresponding cells (to 2 decimals). Do not change the order.

          Step 2: Update with Tremor and Gas (TG group)
            - If either Tremor or Gas is available (i.e., not dead), the spreadsheet will automatically compute the TG update.
            - The spreadsheet will show an intermediate result "P after TG" in cell C10. Record this value to 3 decimals in the log.

          Step 3: Update with GPS
            - If GPS is available (not dead), the spreadsheet will automatically update using the GPS vector.
            - The spreadsheet will show the final updated probability "New P(E)" in cell C15. Record this value to 3 decimals in the log and update the duty board.

          Step 4: If both TG and GPS are dead, then the new P(E) remains the same as the prior.

          Step 5: Special cases and checks
            - If the new P(E) is significantly different from the prior (e.g., change of more than 0.10) or if it crosses an alert threshold (e.g., 0.30 for level 2, 0.60 for level 3, etc. - as per your alert scheme), then call the duty senior scientist to review.
            - If the update produces a result that contradicts an official announcement (like example iii), double-check your entries and then call the deputy director and the observatory director immediately.
            - If the spreadsheet shows an error, check that the vectors are entered correctly and that the dead checkboxes are set appropriately. If the error persists, call the duty senior scientist.

          Step 6: Log
            - Record in the logbook: 
                 Date and time
                 Prior P(E)
                 Tremor vector and status (dead or alive)
                 Gas vector and status
                 GPS vector and status
                 P after TG (if computed)
                 New P(E)
                 Any phone calls made.

          Judgment Calls (as noted in the procedure):
            - The grouping of Tremor and Gas together and treating GPS separately is a judgment call.
            - The treatment of dead sensors as missing is a judgment call.
            - The independence assumptions are judgment calls.

          Where the procedure might break:
            - If there is strong dependence between the GPS and the other channels not captured by the eruption state, the update may be inaccurate. If the results are surprising, consult a senior scientist.
            - If the soft classifier produces a vector that is uniform (like (0.33,0.33,0.34)) and the update leads to a large change, this might be due to the model and not the data. Use caution.

          Limitations:
            - The procedure does not account for trends over time. It is a snapshot update.
            - The procedure does not incorporate other data sources (e.g., visual observations, infrasound, etc.). The analyst must consider these separately and may need to adjust the final probability with senior approval.

          Final Authority: The duty senior scientist has the authority to override the procedure's result based on other information.

       End of Procedure.

   13. We have provided the procedure and examples. We note that the precomputed tables are critical and must be reviewed periodically by experts.

       We also note that the procedure is designed for a 20-minute handover. The spreadsheet must be tested for speed and ease of use.

       Finally, we emphasize that the procedure is a tool and not a substitute for expert judgment.
answer: |-
  Below is a step-by-step procedure for updating the eruption probability using soft classifications, designed for spreadsheet execution by technicians with minimal formal training. The procedure addresses dead sensors, near-ties, channel dependencies, and edge cases. Key assumptions are explicitly stated, and judgment calls are labeled. Three worked examples and handling of the deputy director scenario are included.

  ---

  ### **Procedure: Updating Eruption Probability (P(E))**
  **Starting Point**: Current P(E) (e.g., 0.140 on the duty board).  
  **Inputs**: Soft classification vectors for Tremor (T), Gas (G), and GPS (D) in the format (quiet, elevated, high).  
  **Output**: Updated P(E) after processing new data.  
  **Time Limit**: 20 minutes.  
  **Tools**: Spreadsheet with preloaded reference tables (see **Precomputed Tables** section).  

  #### **Step 1: Initialize and Record Prior Probability**  
    - Write down the current P(E) from the duty board (e.g., `0.140`).  
    - **Decimals**: 3 (e.g., 0.140).  
    - **Log Entry**:  
      ```  
      [Date/Time] START UPDATE  
      Prior P(E): [value]  
      ```

  #### **Step 2: Check Sensor Status and Input Vectors**  
    - For each channel (T, G, D):  
      - **Dead Sensor Check**: If the vector is exactly `(0.00, 1.00, 0.00)`, mark it as **dead**.  
        - *Why?* Dead sensors default to `(0.00, 1.00, 0.00)`, but a true "elevated" reading is not identical.  
        - **Test**: Enter `DEAD` in the spreadsheet next to the channel.  
      - **Alive Sensor**: Record the vector exactly as reported (e.g., `(0.42, 0.39, 0.19)`).  
    - **Decimals**: 2 for vectors (e.g., 0.42).  
    - **Log Entry**:  
      ```  
      Tremor: [vector] or DEAD  
      Gas: [vector] or DEAD  
      GPS: [vector] or DEAD  
      ```

  #### **Step 3: Process Channels in Fixed Order**  
    - **Order**: Always process **Tremor (T) and Gas (G) together** (Group TG), then **GPS (D)**.  
      - *Why?* T and G are driven by overlapping processes (non-independent); D is treated as independent.  
      - **Judgment Call**: This order and grouping assume dependency between T and G but independence from D.  

    - **Case A: TG Group (T and G)**  
      - If **both dead**: Skip TG update.  
      - If **one alive, one dead**: Use only the alive channel (see **Case A2/A3**).  
      - If **both alive**:  
        - **Case A1: Joint Update**  
          - Compute likelihoods using the **joint TG reference table** (precomputed):  
            - `L_TG_E = sum(T_i * G_j * P(T=i, G=j | E))`  
            - `L_TG_notE = sum(T_i * G_j * P(T=i, G=j | not E))`  
          - *Spreadsheet Steps*:  
            1. Multiply T’s vector (e.g., `T_q, T_e, T_h`) by G’s vector (e.g., `G_q, G_e, G_h`).  
            2. Multiply each product by the corresponding `P(T,G | E)` and `P(T,G | not E)` from the TG table.  
            3. Sum all values to get `L_TG_E` and `L_TG_notE`.  

      - **Case A2: Only T Alive**  
        - Use the **T-only marginal likelihoods** (precomputed from TG table):  
          - `L_TG_E = sum(T_i * P(T=i | E))`  
          - `L_TG_notE = sum(T_i * P(T=i | not E))`  
      - **Case A3: Only G Alive**  
        - Use **G-only marginal likelihoods** (similar to Case A2).  

      - **Update P(E) for TG Group**:  
        - Compute likelihood ratio: `LR_TG = L_TG_E / L_TG_notE`.  
        - Update odds: `Odds_after_TG = (P_prior / (1 - P_prior)) * LR_TG`.  
        - Convert to probability: `P_after_TG = Odds_after_TG / (1 + Odds_after_TG)`.  
      - **Decimals**: 3 for `P_after_TG` (e.g., 0.156).  
      - **Log Entry**:  
        ```  
        After TG: [P_after_TG]  
        ```

    - **Case B: GPS (D) Group**  
      - If **dead**: Skip D update.  
      - If **alive**:  
        - Compute likelihoods using **D reference table**:  
          - `L_D_E = (D_q * P(D=q | E)) + (D_e * P(D=e | E)) + (D_h * P(D=h | E))`  
          - `L_D_notE = (D_q * P(D=q | not E)) + (D_e * P(D=e | not E)) + (D_h * P(D=h | not E))`  
        - Update probability:  
          - `LR_D = L_D_E / L_D_notE`  
          - `Odds_after_D = (P_after_TG / (1 - P_after_TG)) * LR_D`  
          - `P_after_D = Odds_after_D / (1 + Odds_after_D)`  
      - **Decimals**: 3 for final P(E) (e.g., 0.142).  
      - **Log Entry**:  
        ```  
        After D: [P_after_D] or "Skipped"  
        Final P(E): [value]  
        ```

  #### **Step 4: Handle Near-Ties**  
    - **Definition**: A near-tie is when the two highest bins in a vector differ by ≤0.10 (e.g., `(0.42, 0.39, 0.19)` for T).  
    - **Action**: Use the **full soft vector** (do not harden). The procedure inherently handles uncertainty by weighing all bins.  
    - *Why?* Hardening loses information; soft updates reduce false negatives/positives.  

  #### **Step 5: Update Duty Board and Log**  
    - Write the final P(E) on the duty board.  
    - **Log Entry**:  
      ```  
      [Date/Time] END UPDATE  
      Final P(E): [value]  
      ```

  ---

  ### **Precomputed Tables (Stored in Spreadsheet)**  
  1. **TG Joint Table**: `P(T=i, G=j | E)` and `P(T=i, G=j | not E)` for all bins (i,j = quiet, elevated, high).  
     - Derived from historical data (e.g., during eruptions, T and G are often both "high").  
  2. **D Table**: `P(D=k | E)` and `P(D=k | not E)` for k = quiet, elevated, high.  
  3. **Marginal Tables**: `P(T=i | E)`, `P(T=i | not E)`, `P(G=j | E)`, `P(G=j | not E)` (precomputed from TG joint table).  

  ---

  ### **Worked Examples**  
  **Assumed Reference Tables**:  
  - **TG Joint (E)**:  
    | T\G | Quiet | Elevated | High |  
    |------|-------|----------|------|  
    | Quiet | 0.05 | 0.05 | 0.00 |  
    | Elevated | 0.05 | 0.10 | 0.15 |  
    | High | 0.00 | 0.10 | 0.50 |  
  - **TG Joint (not E)**:  
    | T\G | Quiet | Elevated | High |  
    |------|-------|----------|------|  
    | Quiet | 0.60 | 0.20 | 0.05 |  
    | Elevated | 0.10 | 0.03 | 0.01 |  
    | High | 0.005 | 0.005 | 0.00 |  
  - **D (E)**: P(quiet)=0.05, P(elevated)=0.15, P(high)=0.80  
  - **D (not E)**: P(quiet)=0.80, P(elevated)=0.15, P(high)=0.05  

  **Example (i):**  
  - Prior P(E) = 0.140  
  - T = `(0.10, 0.60, 0.30)`, G = `(1.00, 0.00, 0.00)` (firm quiet), D = `(1.00, 0.00, 0.00)` (firm quiet).  
  - **TG Update (Both alive)**:  
    `L_TG_E = (0.10*1.00*0.05) + (0.10*0.00*0.05) + ... + (0.30*1.00*0.00) = 0.005 (T_quiet/G_quiet) + 0.03 (T_elev/G_quiet) = 0.035`  
    `L_TG_notE = (0.10*1.00*0.60) + (0.60*1.00*0.10) + (0.30*1.00*0.005) = 0.06 + 0.06 + 0.0015 = 0.1215`  
    `LR_TG = 0.035 / 0.1215 ≈ 0.288`  
    `Odds_after_TG = (0.140/(1-0.140)) * 0.288 ≈ 0.047 → P_after_TG = 0.047 / (1+0.047) = 0.045`  
  - **D Update**:  
    `L_D_E = 1.00*0.05 = 0.05`  
    `L_D_notE = 1.00*0.80 = 0.80`  
    `LR_D = 0.05/0.80 = 0.0625`  
    `Odds_after_D = (0.045/(1-0.045)) * 0.0625 ≈ 0.00294 → P_after_D = 0.00294 / (1+0.00294) ≈ 0.003`  
  - **Final P(E) = 0.003** (significant decrease).  

  **Example (ii):**  
  - Prior P(E) = 0.140  
  - T = `(0.20, 0.50, 0.30)`, G = `(0.15, 0.45, 0.40)`, D = `DEAD`.  
  - **TG Update (Both alive)**:  
    `L_TG_E = (0.20*0.15*0.05) + (0.20*0.45*0.05) + ... + (0.30*0.40*0.50) = 0.1358`  
    `L_TG_notE = (0.20*0.15*0.60) + (0.20*0.45*0.20) + ... + (0.30*0.40*0.00) = 0.0572`  
    `LR_TG = 0.1358 / 0.0572 ≈ 2.37`  
    `Odds_after_TG = (0.140/0.860) * 2.37 ≈ 0.386 → P_after_TG = 0.386 / (1+0.386) ≈ 0.279`  
  - **D Update**: Skipped (dead).  
  - **Final P(E) = 0.279** (increase).  

  **Example (iii): Deputy Director Scenario**  
  - **Context**: Morning P(E) = 0.250. Deputy Director announces alert raise at noon. Midday update yields P(E) = 0.200.  
  - **Analyst Actions**:  
    1. Double-check all inputs and calculations.  
    2. **Log Entry**:  
       ```  
       [Date/Time] MIDDAY UPDATE  
       Prior P(E): 0.250  
       [Channel vectors/dead status]  
       Final P(E): 0.200  
       NOTE: Decrease contrary to deputy director announcement.  
       ```  
    3. **Telephone**: Immediately call Deputy Director and Observatory Director.  
    4. **Do not change alert level** until resolved. Senior staff must decide next steps.  

  ---

  ### **Where the Procedure Breaks and Mitigations**  
  1. **Dependency Assumption Failure**:  
     - **Breakdown**: T and G are not conditionally independent given E (e.g., external factors affect both).  
     - **Mitigation**: If T and G shift oppositely (e.g., T high, G quiet), consult a senior scientist.  
  2. **Non-Stationary Processes**:  
     - **Breakdown**: Precomputed tables assume past = future (e.g., new eruption styles).  
     - **Mitigation**: If P(E) trends up but tables push it down, override with expert judgment.  
  3. **Sensor Correlation in Soft Classifier**:  
     - **Breakdown**: Classifiers for T and G use overlapping features (violates soft vector independence).  
     - **Mitigation**: If both classifiers flip simultaneously, flag for review.  
  4. **Extreme Values**:  
     - **Breakdown**: Vectors like `(0.01, 0.01, 0.98)` may dominate updates, even if erroneous.  
     - **Mitigation**: Cross-check with raw data if available.  

  ---

  ### **What the Procedure Cannot Deliver**  
  - **Temporal Trends**: Does not account for accelerating activity (e.g., rising tremor over days).  
  - **External Data**: Ignores non-instrumental cues (e.g., gas smells, animal behavior).  
  - **Multi-Size Eruptions**: P(E) is binary (eruption above size X or not); no granular size classes.  
  - **Calibration Drift**: Cannot detect if soft classifiers degrade over time.  
  - **Cascading Failures**: If multiple sensors die during a crisis, reliability plummets.  

  ---

  ### **When Arithmetic Stops and Signatures Take Over**  
  1. **Threshold Crossing**: If P(E) crosses an alert level (e.g., 0.30 → Level 2), a senior scientist must sign off.  
  2. **Contradictory Evidence**:  
     - e.g., P(E) decreases despite all channels showing "high."  
     - **Action**: Halt update; log discrepancy; call director.  
  3. **Unprecedented Vectors**:  
     - e.g., `(0.00, 0.00, 1.00)` from a historically noisy sensor.  
     - **Action**: Flag as suspicious; consult seismology group.  
  4. **Crisis Mode**:  
     - During rapid unrest, bypass the procedure; use expert aggregation.  

  --- 

  **Final Note**: This procedure systematizes routine updates but **does not replace expertise**. When in doubt, stop, call, and convene.
