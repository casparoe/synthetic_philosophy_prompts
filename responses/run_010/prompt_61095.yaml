prompt: |-
  I keep running into an accounting rule that seems to contradict the first thing every econ textbook tells you, and I can't work out what it's actually committed to. Under US GAAP a factory or a machine sits on the books at what you paid for it minus depreciation — historical cost — not at what it's worth today. If it turns out to be worth much less, you write it down, and that reduced number becomes its new cost basis permanently; the rules explicitly prohibit writing it back up later, even if the asset recovers and its worth more again. IFRS, covering basically the same assets, does let you reverse the write-down. Then the very same set of financial statements carries a trading portfolio at today's market price, with no reference at all to what was paid for it.

  So what picture of value does the American rule presuppose? My hunch is that it treats the past as only allowed to push the number down, never up — history gets a veto but not a vote — and that this isn't really a claim about assets at all but about management's optimism. But I can't tell whether it's a metaphysics of value (what you spent genuinely bears on what the thing is worth) or an epistemology of testimony (a write-down is the kind of thing you can verify and a write-up never is). And is this a case of honoring sunk costs, which we're all told is irrational, or the opposite — an institutional ritual for burying them, after which they can never come back?

  Tell me which rival views the rule quietly rules out, whether the path-dependent treatment of the factory and the path-independent treatment of the stock portfolio can be licensed by a single theory or need two, where the practice is just underdetermined so that several theories would fit it equally well, and what would have to change if you rebuilt the whole thing on a strictly forward-looking view where only expected future cash flows count.
reasoning: |-
  Okay, the user is grappling with a fundamental tension in accounting rules: why US GAAP treats fixed assets like factories at historical cost (with impairment write-downs that can't be reversed) while simultaneously valuing trading securities at market price. They're clearly well-versed in econ concepts but frustrated by what seems like a contradiction. 

  Hmm, their question has layers. On the surface, it's about accounting rules, but underneath, they're really probing philosophical questions about value measurement. That "metaphysics vs epistemology" distinction shows they've thought deeply. I should avoid dry textbook answers and engage with the theoretical puzzle they've articulated so well.

  Key points they're wrestling with:
  - The apparent hypocrisy of "sunk costs matter for factories but not stocks"
  - Whether historical cost reflects a belief about intrinsic value or just distrust of management
  - Why write-downs are irreversible if recovery is possible
  - How two contradictory valuation methods coexist in one financial statement

  Ah, and their last question is brilliant - asking which theories are "ruled out" by the rules. That's such a sharp way to frame it. Most students would just ask "what's the rule?" but they want to know what philosophies were rejected in designing the rule.

  I notice they mention "institutional ritual for burying sunk costs" - that suggests they suspect this is more about psychology than logic. Smart observation. The irreversibility rule does feel almost like a religious taboo against ever admitting you overpaid originally.

  Their background seems to be economics (hence the sunk cost dogma) but they're clearly accounting-curious. Probably an MBA or grad student given how precisely they distinguish US GAAP vs IFRS treatments. No jargon mistakes in their question at all.

  Biggest challenge will be explaining why the accounting world doesn't just adopt the economist's "forward-looking cash flows" approach wholesale. Need to emphasize reliability vs relevance tradeoff without drowning them in accounting standards codification language.

  Oh! And must address that portfolio vs factory contradiction head-on. The "single theory" part of their question is crucial. Can't just list differences - need to show how conservatism creates a coherent (if messy) system where historical cost for fixed assets and mark-to-market for liquid assets actually serve the same underlying goal: not misleading investors.

  Should probably end with that thought experiment about switching to pure expected cash flows. Fun chance to show how radical that change would be - goodbye income statements as we know them! Might help them appreciate why accountants cling to historical cost despite its flaws.
answer: |-
  You've hit upon one of accounting's deepest philosophical tensions: **the conflict between backward-looking reliability and forward-looking relevance**. US GAAP's treatment of fixed assets (irreversible historical cost) versus trading securities (full fair value) isn't random—it reflects deliberate choices about evidence, verifiability, and the purpose of financial statements. Here's how rival views are ruled out and reconciled:

  ### What the Rule Presupposes & Rules Out:
  1.  **Epistemology Over Metaphysics:** The rule is *not* a claim that historical cost *is* true value. Instead, it’s a **verifiability constraint**. A write-down requires objective evidence of impairment (e.g., physical damage, market decline). A subsequent recovery is speculative until realized via sale. GAAP prioritizes *objective verification* over subjective estimates of upside.
      -   **Rival View Ruled Out:** "Market value is knowable and should always be reported." GAAP rejects this for fixed assets due to illiquidity and valuation uncertainty.

  2.  **Asymmetric Conservatism (Prudence Principle):** Losses are recognized when probable, gains only when realized. This "anticipate losses, not gains" principle protects against management over-optimism.
      -   **Rival View Ruled Out:** "Symmetrical fair value accounting for all assets." GAAP explicitly avoids this for long-lived assets, fearing earnings volatility and manipulation.

  3.  **Sunk Costs as Anchor Points:** GAAP treats the *original transaction* as the most reliable anchor. Write-downs bury sunk costs *permanently*—not because they’re rational, but because reversing them would imply original cost was "recoverable," inviting hindsight bias.
      -   **Rival View Ruled Out:** "Historical cost is irrelevant; only future cash flows matter." GAAP uses historical cost as a starting point for allocation (depreciation) and impairment testing.

  4.  **Management Distrust:** The prohibition on write-ups assumes managers can’t be trusted to objectively value unrealized gains. Trading securities escape this because market prices are external and verifiable.
      -   **Rival View Ruled Out:** "Management’s internal valuations are sufficiently reliable." GAAP says no for illiquid assets.

  ### Reconciling Factory vs. Trading Portfolio:
  -   **A Single Theory? Yes—Conditional Verifiability:** GAAP’s unifying logic is **evidence quality**. Assets are fair-valued *only when*:
      -   Markets are active and observable (trading securities).
      -   Reliable, unbiased inputs exist (Level 1/2 fair value hierarchy).
      -   For factories, markets are thin and appraisals are costly/subjective. Historical cost (less depreciation) is the "best available" verifiable measure *until* impairment is proven.
  -   **Two Theories? Pragmatically, Yes:** In practice, GAAP blends:
      1.  **Historical Cost Principle:** For assets held for use (factories), focusing on cost allocation and realized value.
      2.  **Fair Value Principle:** For assets held for trading, focusing on current wealth.

  ### What a Strict Forward-Looking System Would Require:
  If accounting were rebuilt *solely* on expected future cash flows (a "pure" economics view):
  -   **All assets/liabilities marked to model:** Factories, IP, brand value—everything valued at discounted cash flows (DCF). Balance sheets show current economic value.
  -   **Income Statements Become Volatile:** Earnings would reflect changes in DCF assumptions (growth rates, discount rates) alongside operational performance.
  -   **Massive Subjectivity & Reliability Challenges:** Management estimates would dominate. Auditing would require deep valuation expertise. Comparability across firms would suffer.
  -   **Elimination of "Realization" Principle:** Unrealized gains/losses recognized immediately (like trading securities today).
  -   **Depreciation Disappears:** Replaced by changes in DCF value. "Income" becomes change in net present value.
  -   **Required:** Radical shifts in auditing standards, manager incentives, investor education, and litigation frameworks to handle inherent estimation uncertainty.

  ### Why GAAP Resists This:
  1.  **Reliability > Relevance:** Accountants prioritize objective, auditable numbers over theoretically "truer" but subjective valuations.
  2.  **Stewardship Function:** Historical cost helps assess management’s *past decisions* (e.g., "Did they overpay for the factory?"). Fair value obscures this.
  3.  **Earnings Manipulation Risk:** Subjective write-ups invite earnings management. Irreversible write-downs are a "one-way ratchet" limiting upside bias.
  4.  **Operational Focus:** Depreciation matches cost to revenue generation—a useful concept for assessing profitability, even if not "economic."

  ### In Short:
  US GAAP’s rule presupposes that **value is only knowable with high certainty when evidenced by an arm’s-length transaction (past or present)**. It quietly rules out symmetrical fair value for illiquid assets, symmetrical treatment of gains/losses, and pure forward-looking models—prioritizing verifiable conservatism over speculative relevance. The coexistence with fair-valued portfolios is licensed by a **verifiability threshold**: market prices are deemed sufficiently objective, while internal valuations of factories are not. This isn’t sunk cost fallacy; it’s sunk cost *censorship*, burying the past to constrain managerial optimism. A forward-looking system would be more economically rational but less auditable—a trade-off accounting standards bodies remain unwilling to make.
