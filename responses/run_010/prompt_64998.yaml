  First, I need to understand the core dilemma. The user is caught between respecting local self-determination and ensuring equitable access to basic needs. The council's decision seems influenced by historical power imbalances from colonial times, where two families now control the local government. The user's predecessor took a hands-off approach, which led to system failures and higher costs later. But imposing rules might undermine local autonomy.

  The user explicitly wants a principle, not procedural suggestions. They need a test that can be applied universally. They also have four specific questions about funding role, rule announcement, self-retiring mechanisms, and transparency in communication.

  The key elements here are: basic needs (water access), historical injustice (colonial legacy leading to current power structures), and sustainability (past failures due to lack of maintenance). The user's proposed distance rule addresses the immediate inequity but might erode trust in local institutions.

  For the principle, I should focus on non-subordination. The idea is that certain decisions can be overridden if they perpetuate harm that subordinates a group's ability to meet basic needs. The override must be necessary and proportionate, directly addressing the specific harm without broader interference.

  Applying this to the distance rule: the council's decision leaves 900 people without water access, which is a severe harm. The rule is targeted and minimal—only adjusting the plan to meet the distance threshold. The override is justified. The predecessor's approach, however, allowed decisions that led to system failures, which again harmed communities by denying them water. But the harm wasn't addressed, so it fails the test.

  Now, the user's questions:
  1. Does paying make a difference? The principle stands regardless of funding. The moral justification is based on preventing harm, not financial control. Advising would require persuasion, not imposition.
  2. Announcing the rule in advance makes it more defensible by providing predictability and reducing arbitrariness. It's not just efficiency but legitimacy.
  3. A self-retiring rule is tricky. Structural changes might be needed, but the principle requires ongoing vigilance. The rule should aim to build local capacity to prevent future harms, making overrides unnecessary.
  4. Transparency is crucial. The principle must withstand public scrutiny. If it can't be explained to both the council and the affected hamlets, it's flawed. The non-subordination argument should be translatable and defensible in public.

  Also, the historical context matters. Past foreign administration set up systems that enabled current power imbalances. Overriding might echo colonialism, but the principle focuses on current harm, not past actions, to avoid paternalism.

  Deep needs: The user wants to balance ethical action with sustainable outcomes. They need confidence that their decisions are morally sound and won't perpetuate harm or dependency. They also seek legitimacy in their role without repeating historical mistakes.
answer: |-
  The principle you seek must navigate the tension between local self-determination and the prevention of irreparable harm arising from structural injustice. Here it is, stated precisely:  

  **You may override a local decision-making body when:**  
  *(a) The decision perpetuates or creates severe, preventable harm (defined as deprivation of basic capabilities necessary for human dignity, e.g., secure access to water, food, safety);*  
  *(b) The harm is concentrated on a group systematically excluded from the decision process by that body’s design or operation; AND*  
  *(c) Your intervention is the minimum necessary to prevent that specific harm, without assuming broader governance functions.*  

  ### Application to Your Case  
  1. **Your distance rule override is justified under this principle:**  
     - *(a)* **Severe Harm:** 900 people walking 4 hours daily for water constitutes severe, preventable deprivation of time, health, and security.  
     - *(b)* **Systematic Exclusion:** The hamlets are excluded by population thresholds set without consideration for dispersed communities. The council’s capture by historical elites compounds this.  
     - *(c)* **Minimum Necessary Intervention:** The rule only corrects spatial exclusion from water access. It doesn’t dictate council composition, funding allocations, or other governance matters.  

  2. **Your predecessor’s approach is condemned:**  
     Allowing systems to be sited inequitably and fail met condition (a) (harm via water deprivation) and (b) (exclusion of marginalized groups), but *failed* condition (c): refusal to intervene minimally to prevent foreseeable harm. Costly rebuilds prove the harm was preventable.  

  ### Answers to Your Specific Questions  
  1. **Does paying matter?**  
     No. The override is defensible based on harm prevention, not funding. If you were only advising, you could *recommend* the same rule as a moral imperative, but imposition requires authority (e.g., funding leverage). The principle justifies *influence* proportional to your role.  

  2. **Does announcing the rule in advance help?**  
     Yes, but not merely for efficiency. Announcing it:  
     - *Strengthens legitimacy* by making the rule transparent, universal, and predictable (avoiding arbitrariness).  
     - *Weakens legitimacy* if it appears as a rigid, foreign imposition. Mitigate this by grounding the rule in local consultation (e.g., validating the 1500m threshold with community walking-time surveys).  

  3. **Can a rule retire itself?**  
     No. Structural exclusion (condition *b*) rarely self-corrects. But the rule should *force institutional adaptation*:  
     - Require councils to prove no household exceeds 1500m *before* plans are approved.  
     - Sunset the rule only if exclusionary thresholds are amended or harm is remedied. Otherwise, it remains a necessary check.  

  4. **Can the principle survive public scrutiny?**  
     Yes, if translated plainly:  
     > *"No council may decide to leave people without water when those people had no voice in the decision. Our rule ensures every home has water within walking distance. If your plan achieves this, we fund it. If not, we adjust only until it does."*  
     This passes three tests:  
     - **The Chair:** Cannot publicly argue for excluding people from water access.  
     - **The Hamlets:** Hear their deprivation named and prioritized.  
     - **Moral Logic:** Justifies the override solely on remedying exclusionary harm—not technical superiority or cultural judgment.  

  ### Why This Works  
  - **Targets injustice, not incompetence:** It overrides only when harm stems from exclusion, not mere poor planning. A council representing all hamlets that chose a slower rollout would *not* meet condition (b).  
  - **Avoids paternalism:** By limiting interventions to *specific harm prevention*, it doesn’t claim locals are "incapable." It acknowledges the system is rigged.  
  - **Fits the history:** Directly addresses the colonial legacy—not by reimposing foreign control, but by dismantling exclusionary structures *left behind*.  
  - **Operationalizes "self-determination":** Empty self-determination perpetuates harm; meaningful self-determination requires inclusive institutions. Your rule forces inclusion.  

  **Final Counsel:** Impose the rule. The council’s fury is the sound of exclusionary power being checked—not a sign of failure. The hamlets’ future gratitude is secondary; the imperative is ending *today’s* preventable harm.
