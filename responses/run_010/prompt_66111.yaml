prompt: |-
  Nyāya gives testimony its own pramāṇa alongside perception and inference, roughly on the grounds that understanding the sentence of a trustworthy speaker yields knowledge by a causal route of its own; the Buddhist side (Dignāga, Dharmakīrti) allows only perception and inference and folds testimony into inference about the speaker's reliability. Anglo social epistemology keeps replaying this as reductionism vs antireductionism about testimony.

  So: give me your actual credence that Nyāya wins here — that testimonial warrant is irreducable to whatever perception plus inference can deliver, including inference from a speaker's track record. Decompose it rather than just handing me a number. In particular I want you to separate the psychological/causal sense of "irreducible" from the normative one and give a figure under each, then a weighted overall number, and say how much of the gap between them is just the two sides talking past each other. Include terms for whether the reductionist can absorb the two cases I care about most — a child acquiring a first language who has no concept of reliability at all, and a relay case where you understand the output language but have zero access to the competence of the translation chain behind it — plus whatever else you think belongs in the product. Then name the single sub-question your final number is most sensitive to, and what argument or empirical finding would move it furthest.

  Lead with the bottom line (the number), keep the whole thing under 300 words, American English.
