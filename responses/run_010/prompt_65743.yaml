  Key requirements are: probability as objective logical relations (not subjective feelings), non-numerical probabilities, incomparable options, weight of evidence as separate from probability, refusal to use principle of indifference, Chapter 12 elements like the beauty contest meter and spontaneous optimism button, and friction with star ratings. The reviews should include specific critics like an actuary and a behavioral economist, plus that poor parent choosing schools.

  Important constraints: no fake Keynes quotes, no oversimplification to "risk vs uncertainty" (which comes from Knight), and maintaining ambiguity about whether the app or the industry is broken. The tone must stay deadpan without winking at the reader.

  I'll structure this as: App name and developer ("Rationale: Decision Support for Humans" by Cambridge Uncertainty Collective), promotional blurb framing it as revolutionary, features list hitting all Keynesian points, known issues section that's actually core features, and carefully crafted reviews with developer replies. The parent review will be the centerpiece - showing the app declaring school choices incomparable after weeks of data entry.

  For the Chapter 12 elements: The beauty contest meter will detect when decisions become recursive social expectations rather than fundamentals. The "Enterprise!" button will bypass calculation entirely. The developer replies will show academic frustration - especially with the Savage review about betting behavior.

  The challenge is making every feature painfully faithful to Keynes while sounding like real app copy. Like the "known issues" listing "Cannot compute probabilities for unique historical events" which is exactly what Keynes argued. Or the developer reply to the actuary saying calibration metrics "fundamentally misconstrue the nature of logical probability."

  The parent review gets special attention: after entering parenting philosophies and school brochures, the app declares the schools "not comparable on current evidence" and suggests visiting during recess to observe "animal spirits." That punchline captures the absurdity and profundity of Keynes' view - sometimes decisions can't be calculated.
answer: |-
  ## App Store: Rationale™ — Decision Support for Humans

  **Developer:** Cambridge Uncertainty Collective
  **Category:** Productivity
  **Price:** Free (In-App Purchases for Expanded Evidence Logging)
  **Version:** 1.2.1 (Keynesian Stable)
  **Rating:** ★★☆☆☆ (2.3 - 47 Ratings)

  **Description:**
  Tired of decision-making apps pretending the future is a spreadsheet? Introducing **Rationale™**, the world's first decision-support tool built on a rigorous foundation of *actual human uncertainty*. Developed by scholars dedicated to the profound insights of John Maynard Keynes (particularly his *Treatise on Probability* and Chapter XII of *The General Theory*), Rationale™ doesn't impose false precision. It respects the logical structure of your knowledge and the inherent ambiguity of the future.

  Forget single-number probabilities and forced rankings. Rationale™ helps you navigate the *real* world of partial knowledge, incommensurable alternatives, and the vital distinction between genuine enterprise and mere speculation. It doesn't tell you what to do; it helps you understand *why* deciding is often complex, and when a leap of faith ("animal spirits") is the most rational act available.

  **Features:**

  *   **Evidence-Based Probability Engine:** Calculates the *objective logical relation* between your hypothesis (e.g., "This stock will rise") and your *specific body of evidence*. This relation is fixed by the evidence, not your feelings. Want a higher number? Find better evidence!
  *   **Non-Numeric Probability Output:** Faithfully represents Keynes's insight. See outputs like "Probable," "More Likely Than Not," "As Likely As Not," "Uncertain," or the crucial "Not Numerically Measurable." No fake decimals here.
  *   **Comparability Assessment:** Rigorously evaluates whether two options can even be logically ordered given your evidence. Outputs include "A > B," "B > A," "Indifferent," or the intellectually honest "Not Comparable." Stop forcing square pegs into round holes!
  *   **Weight of Evidence Visualizer:** Witness the crucial Keynesian distinction! Watch the "Weight" meter climb (indicating your case is built on more substantial evidence) while the "Probability" verdict remains stubbornly "Possible" or "Uncertain." Knowledge grows, certainty doesn't always follow.
  *   **Principle of Indifference Refusal Module:** Knows *nothing* about two potential outcomes? Rationale™ **will not** arbitrarily assign 50/50 odds. "Complete ignorance demands silence, not false equivalence." Outputs "Insufficient Basis for Comparison."
  *   **Chapter XII Toolkit:**
      *   **Beauty Contest Meter™:** Flags when your decision shifts from evaluating the "prettiest face" (fundamental value) to guessing "what average opinion expects average opinion to expect." A vital warning against recursive speculation!
      *   **Enterprise vs. Speculation Analyzer:** Helps discern whether you're investing based on long-term prospective yield ("enterprise") or short-term market psychology ("speculation").
      *   **SPONTANEOUS OPTIMISM BUTTON ("Animal Spirits!")™:** For when calculation fails. Bypasses probabilistic dithering. A single, decisive button driven by "a spontaneous urge to action rather than inaction." Use responsibly (and not for actuarial tables).
      *   **Long Horizon Skepticism:** Gently (then firmly) discourages excessively long-term forecasts. "The developer respectfully suggests that expecting precise knowledge about 2050 based on today's evidence is... optimistic."
  *   **Comprehensive Evidence Log:** Document your premises, sources, and reasoning. Rationale™ is only as good as the evidence you feed it. (Pro version unlocks tagging, source reliability ratings, and temporal evidence tracking).

  **Known Issues and Limitations (Per Developer):**

  *   **Persistent User Demand for Single Numbers:** The system is functioning as designed when it refuses to output a numerical probability where none is logically justified by the evidence. This is not a bug; it is epistemological fidelity.
  *   **Incompatibility with Forced Ranking Paradigms:** Cannot comply with requests to rank inherently incommensurable options (e.g., comparing career satisfaction metrics to projected pension values under wildly different assumptions). Outputting "Not Comparable" is the correct and logical response.
  *   **"Animal Spirits" Button Misuse:** Some users report pressing the Spontaneous Optimism Button for decisions like choosing breakfast cereal. While technically functional, the developer recommends reserving it for decisions involving genuine, non-quantifiable uncertainty and significant consequence. Cereal choices typically possess measurable attributes.
  *   **Weight/Probability Disconnect Confusion:** Users sometimes express frustration that increasing the Weight of Evidence does not automatically increase the precision or favourability of the Probability assessment. The developer reiterates: Weight and Probability are distinct dimensions. A heavier dossier on an uncertain proposition remains an uncertain proposition.
  *   **Star Rating System:** The app store's requirement to reduce the complex utility and fidelity of this tool to a one-dimensional 1-5 star metric is deeply problematic and represents a fundamental category error. We display the rating under protest.
  *   **Requires Intellectual Honesty:** Output quality is directly proportional to the user's willingness to acknowledge the limits of their knowledge. Garbage In, Garbage Out remains in effect, albeit with more philosophically robust error messages.

  **User Reviews:**

  1.  **★☆☆☆☆ ActuaryRick (1 Star)**
      *"Waste of time. Needed probability of loan default. Entered 200 data points. App says 'More Likely Than Not' and Weight 'Substantial'. Useless! My models give me 63.7%! Where's the calibration? How do I backtest 'Substantial'? This isn't decision support, it's decision avoidance."*
      *   **Developer Response:** "Calibration metrics applied to non-numerical logical relations fundamentally misconstrue the nature of probability as defined in the underlying framework. The assessment 'More Likely Than Not' given your 'Substantial' evidence *is* the calibrated response. Demanding a spurious number for use in a model that assumes quantifiable risk is precisely the epistemic error Rationale™ exists to counter."

  2.  **★☆☆☆☆ ForecastingChamp (1 Star)**
      *"I win forecasting tournaments. This thing is broken. I meticulously entered everything known about the Q3 sales forecast. It just says 'Probability Not Numerically Measurable' and 'Weight: Moderate'. How am I supposed to score that? How do I know if I'm over/underconfident? It refuses to play the game!"*
      *   **Developer Response:** "The 'game' of forecasting tournaments often assumes numerical probabilities are always extractable and meaningful. Rationale™ adheres to the position that for many complex, unique future events, especially in business, a single numerical probability *cannot* be logically derived, even with substantial evidence. Scoring such an output as 'wrong' reflects a limitation of the tournament, not the tool."

  3.  **★★☆☆☆ BayesBro42 (2 Stars)**
      *"Stuck in the 1920s. My man Savage showed how degrees of belief come from betting behavior. It's all about coherent preferences! This app ignores revealed preferences and subjective states. It keeps asking for 'evidence' like some dusty librarian. Probability IS a state of mind!"*
      *   **Developer Response:** (Sigh) "While the axiomatic approach based on betting dispositions pioneered by Ramsey and later Savage is mathematically elegant and useful in specific constrained contexts, Rationale™ is explicitly built upon Keynes's *logical-relation* interpretation as presented in the *Treatise*. The conflation of belief with a quantifiable, bettable state is considered by this framework to be a profound error when applied to most real-world decision-making under uncertainty. We are not dusty librarians; we are... evidence custodians."

  4.  **★★★★☆ CuriousBehaviorist (4 Stars)**
      *"Fascinating! A brutal counterpoint to nudging and heuristics. Watching the 'Weight' soar while the probability stays stubbornly vague perfectly illustrates the 'knowledge without certainty' problem. The Beauty Contest Meter is genius – caught me optimizing for perceived expectations twice already! Clunky interface, philosophically brilliant. Minus one star for making me feel uncomfortable about my own decisions."*

  5.  **☆☆☆☆☆ HarriedParent (1 Star)**
      *"HORRIBLE. Just HORRIBLE. Spent WEEKS entering data: School A test scores, parent reviews, commute times, after-school programs. School B's philosophy, campus vibe, financial aid details, sports offerings. Photos!! I just need to know: A or B??? What does Rationale say? 'OPTIONS NOT COMPARABLE ON CURRENT EVIDENCE. WEIGHT: MODERATE. PROBABILITY OF SUPERIOR OUTCOME FOR EITHER: NOT NUMERICALLY MEASURABLE.' Then it suggested I consider 'Spontaneous Optimism' or visit during recess to observe 'animal spirits'. My kid starts next month! I cried."*

  6.  **★★★☆☆ VentureSkeptic (3 Stars)**
      *"Used it on a potential seed investment. Deep tech, novel market. Rationale™ refused to give a number, declared the probability of success 'Uncertain' despite 'Growing' weight of evidence (patents, team, pilot interest), and the Beauty Meter lit up red as I started mentally benchmarking against likely investor reactions. Then I hit the Animal Spirits button. We invested. Jury's out, but the app forced a clarity about the *kind* of leap we were taking that spreadsheets obscured. It's brutally honest. Not sure I like it, but I might need it."*

  **(App Icon: A slightly off-kilter scale balancing a feather on one side and a question mark on the other, against a backdrop of shifting grey fog.)**
