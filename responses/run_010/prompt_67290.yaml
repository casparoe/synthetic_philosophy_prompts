  Okay, the user is preparing a seminar comparing classical Greco-Roman biographies with medieval saints' lives. They've identified a structural problem in both genres: the biographer's aim of inspiring imitation through selective, edifying narratives backfires, leading readers to feel admiration without feeling compelled to imitate. They want to know if this phenomenon has a name or if they need to coin one.

  The user has clearly done deep research. They mention Plutarch's preface about small details revealing character, yet his actual biographies focus on grand battles. They note that flaws only reappear when comparing paired lives, and that modern profiles of overcoming hardship create a warm feeling that substitutes for action. They’ve also ruled out related concepts like hagiography (as a term of abuse), historical models making the present feel derivative, and admiration as a moral emotion. Their focus is on the substitution effect itself, not reader judgment or accuracy.

  Hmm, the core issue is the gap between intent (imitation) and outcome (complacent admiration). The user needs a precise term to bridge classical and medieval genres. Existing terms don’t quite fit: "Exemplary vacuum" is too vague; "admiration trap" focuses on emotion, not structure; "biographical insulation" captures the sealed-off nature but misses the substitution. 

  Let me synthesize: The problem is the narrative structure creating an "unjoinable" exemplar. "Exemplary hermeticism" might work—"hermetic" implying a sealed, self-contained portrayal that prevents integration into the reader’s life. The mechanism involves curation (selecting only edifying elements), elevation (heightening the subject’s stature), and discharge (admiration satisfying the moral impulse). 

  Conditions for failure: If the biography includes unresolved struggles (Augustine’s theft of pears) or mundane details (Plutarch’s kitchen fire), the seal breaks. Boundary cases: A unique life (e.g., surviving a volcano) can’t be imitated but doesn’t induce false moral satisfaction; misdirected imitation (copying a saint’s extreme fasting) isn’t the same as substitution; texts like propaganda can induce the feeling without a real exemplar. 

  This term distinguishes from their "neighbors": Unlike hagiography-as-abuse, it’s about structure, not accuracy; unlike the scale problem, it’s about substitution, not inferiority; unlike admiration theory, it highlights failure, not success. 

  The user’s seminar will benefit from this lens—it connects Plutarch’s omissions to medieval hagiography’s idealization under one mechanism. They’ll need the boundary cases to test the concept’s limits. Solid reasoning.
answer: |-
  Based on your precise dissection of the phenomenon, its mechanism, and its distinction from neighboring concepts, this structural flaw in exemplary biography **does not have a universally established or precise name in the relevant literature.** While concepts like the "admiration trap," "exemplary gap," or "biographical idealization" hover nearby, they fail to capture the specific mechanism of **substitution** (admiration replacing imitation) and its dependence on the **structural curation of the narrative** itself.

  Therefore, I propose the term: **Exemplary Hermeticism**

  Here's the defense and elaboration:

  1.  **Definition:** Exemplary Hermeticism is the structural flaw in an exemplary narrative (biography, saint's life, profile) wherein the deliberate curation of content for edification creates an *hermetically sealed* portrait. This seal renders the subject admirable but fundamentally *unjoinable* to the reader's life, transforming the intended response of imitation into the self-contained and self-satisfying response of admiration.

  2.  **Mechanism of Operation (How the Seal is Applied):**
      *   **Curation:** The biographer selects *only* the grand, resolved, unambiguously virtuous, or superhumanly overcoming moments. Failures (unless dramatically repented *within* the narrative), mixed motives, mundane struggles, and unresolved flaws are excised.
      *   **Elevation:** This selective inclusion inherently elevates the subject beyond the realm of ordinary human experience. They become a statue on a pedestal, not a fellow traveler.
      *   **Displacement:** The narrative structure, by presenting this curated elevation *as the whole truth*, implicitly communicates that *this* is what must be imitated. The reader perceives the gap between their own messy reality and this polished ideal.
      *   **Substitution & Discharge:** The act of recognizing and feeling admiration for this ideal *feels* like a moral response. The narrative's hermetic seal ensures there is no accessible "seam" (flaw, mundane struggle, relatable failure) where the reader could realistically graft their own efforts. Admiration becomes the *endpoint* of the moral engagement, discharging the obligation to imitate precisely because imitation feels impossible. The better the curation (smoothing the seams), the more perfect the seal and the more complete the discharge.

  3.  **Conditions for Failure to Arise (Breaching the Seal):**
      *   **Inclusion of the Unresolved/Mundane:** As you noted, clumsy or honest inclusion of failures, ordinary moments, or unresolved struggles disrupts the hermetic seal. The reader sees a "seam" (Augustine agonizing over *why* he stole the pears; a saint grumbling about the cold). This creates unease and obligation ("If even *they* struggled with this, maybe I can too?").
      *   **Focus on Process over Perfection:** Narratives emphasizing the *struggle*, the *development* of virtue, or the *cost* paid *within the subject's ordinary context* prevent hermetic sealing. Plutarch's stated preference for the revealing "small incident" (if followed) would achieve this.
      *   **Reader Identification through Flaw:** A significant, relatable flaw or failure presented honestly *as part of the exemplar's journey* (not just a pre-conversion sin instantly erased) creates a point of entry for the reader.
      *   **Contextual Embedding:** Placing the subject firmly within the constraints and mundanities of their time and place (rather than lifting them out of it) makes the ideal less abstractly perfect and more concretely achievable.

  4.  **Boundary Cases Testing the Edges:**
      *   **Case 1: Honestly Told but Non-Transferable (Unique Circumstances):** A biography detailing someone surviving a unique catastrophe (e.g., 70 days adrift at sea). It may be profoundly admirable but induces no *false* sense of discharged obligation. The reader recognizes the uniqueness and doesn't feel the *substitution* effect because imitation isn't the plausible intended response. The hermetic seal exists, but the *promise* of imitation wasn't strongly made in the first place. The flaw (hermeticism) is present, but its *consequence* (substitution of admiration for imitation) doesn't trigger the same moral dissonance.
      *   **Case 2: Admiration Producing Imitation of the Wrong Feature:** A saint's life emphasizing extreme asceticism might inspire a reader to copy the *hair shirt* but miss the underlying *humility* or *charity*. This is **misplaced imitation**, not **exemplary hermeticism**. The hermetic seal *failed* in one sense (imitation occurred) but succeeded in another (it sealed off the *core* virtue, directing focus to the superficial/imitable but irrelevant signifier). The mechanism differs: the narrative didn't seal off *all* points of entry, just the *correct* one. The discharge via admiration *didn't* fully occur because some action (however misguided) was prompted.
      *   **Case 3: Inducing the Feeling Without an Exemplar:** Propaganda or advertising creating a feeling of warm moral satisfaction ("Supporting Brand X makes you a good person!") without depicting any specific human exemplar. This exploits a *similar psychological mechanism* (substituting feeling for action) but lacks the core element of **exemplary biography**. It's a simulacrum of the response without the biographical subject or the stated aim of imitation. Hermeticism requires the sealed *exemplar* as the object.

  5.  **Distinction from Neighbors (as Requested):**
      *   **Hagiography (as term of abuse):** Focuses on *factual inaccuracy* or *uncritical piety*. Exemplary Hermeticism can occur in biographies that are *factually accurate* about what they include; the flaw is the *selective omission* creating an *unjoinable* ideal, regardless of the truth of the included parts.
      *   **19thC German Historical Models (Making Present Feel Small):** Concerns the reader's sense of historical *scale* and their own *insignificance*. Exemplary Hermeticism concerns the *substitution of a specific response* (admiration for imitation) due to *narrative structure*, not a feeling of temporal smallness. A hermetically sealed exemplar might be from any era; the problem is the seal, not the epoch.
      *   **Admiration as Moral Emotion/Grounding Normative Theory:** This is a *positive* account of how admiration *should* work. Exemplary Hermeticism describes the *structural failure* within a genre *aimed* at this positive function, where the narrative form sabotages it by preventing admiration from *progressing* to imitation.
      *   **Worry about Identifying Load-Bearing Features:** This is about *epistemic uncertainty* - the reader doesn't know *what* to imitate. Exemplary Hermeticism creates *ontological distance* - the reader perceives *that* imitation is impossible because the exemplar exists on an unattainable plane, regardless of whether they could identify the "right" feature.

  **Why "Exemplary Hermeticism" Works for Your Seminar:**

  *   **"Exemplary":** Clearly anchors the concept in the tradition of *exempla*, models for imitation, shared by both Greco-Roman biography and medieval hagiography.
  *   **"Hermeticism":** Perfectly captures the *sealed* nature of the portrayal – airtight, self-contained, impervious to integration. It implies the removal of air (the messy breath of real life) and contaminants (flaws, mundanity).
  *   **Precision:** It names the *structural flaw* (hermetic sealing via curation) and its *consequence* (the substitution effect blocking imitation), differentiating it from inaccuracy, reader incompetence, or historical scale.
  *   **Bridging Genres:** It provides a neutral, conceptually grounded term applicable to Plutarch's omissions, a medieval hagiographer's idealization, and a modern inspirational profile's curated triumph, focusing on the shared structural problem defeating their shared aim.

  You can now deploy "Exemplary Hermeticism" as the critical lens to analyze how both Plutarch and the author of the *Life of St. Antony*, despite differing contexts and purposes, fall prey to the same narrative mechanism that undermines their core pedagogical goal, fostering admiration that satisfies rather than stimulates.
