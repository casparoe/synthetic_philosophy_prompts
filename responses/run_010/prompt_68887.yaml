answer: |-
  **Exam Question**

  Evaluate the following view of composition: some things compose something if and only if no complete description of the world can state all the facts about those things without employing a singular term for something they compose.

  Consider two cases:
  1.  **The Swarm:** A swarm of bees hovering near a hive. The individual bees bear dispositions (e.g., thermoregulating the hive, coordinated defense against predators) that are irreducibly collective – they cannot be fully explained by facts about individual bees plus simple relations like spatial proximity.
  2.  **The Pair:** A specific shoe located in Boston and the Eiffel Tower in Paris. Assume every fact concerning these two objects is either a fact about the shoe alone (e.g., its size, material), a fact about the Eiffel Tower alone (e.g., its height, structure), or a plain relation holding directly between them (e.g., distance apart, relative age, comparative mass).

  Does this view deliver the intuitively correct verdicts in both cases? Explain why or why not in detail for each case. If you argue it delivers the correct verdicts, defend it against potential objections concerning the cases or the nature of composition. If you argue it delivers an incorrect verdict in one or both cases, explain precisely where it goes wrong and what this reveals about the view's commitments.

  Finally, what does adherence to this view commit its proponent to regarding the question of whether composition *depends* on our descriptive resources? Is this commitment defensible?

  ---

  **Model Answer (Approx. 700 words)**

  The stipulated view (SCV) links composition to the *irreducibility of description*: the xs compose a y iff a complete description of the world *must* mention some z composed by the xs to capture all facts about the xs. Evaluating SCV against the Swarm and the Pair reveals both strengths and significant metaphysical commitments.

  **1. The Swarm: Correct Verdict, But Why?**
  SCV plausibly delivers the correct verdict that the bees compose a swarm. The key is the stipulated irreducibly collective dispositions (CDs). Facts about these CDs – e.g., "The swarm maintains an internal hive temperature of 35°C" or "The swarm defensively repels the wasp invader" – are facts *about the bees* (they are the participants). Crucially, these facts cannot be fully captured by any conjunction of facts solely about individual bees (e.g., Bee1 is flying, Bee2 is vibrating...) plus facts about simple external relations between them (e.g., Bee1 is 5cm from Bee2). Attempting to describe the thermoregulation or defense *only* in terms of individual actions and pairwise relations would miss the *collective, organized, functional unity* constitutive of the swarm's behavior. This functional unity seems to be an emergent fact *about the bees as a collective entity*. Therefore, a complete description of the facts about these bees seems forced to employ a singular term referring to the swarm itself to state facts concerning their CDs. SCV thus correctly entails composition occurs here.

  However, we must ask *why* description is irreducible. Is it *merely* descriptive convenience, or does it track an ontological fact? SCV points towards the latter: the irreducibility suggests the swarm is a genuine entity over and above the bees, possessing properties (the CDs) not reducible to properties of and relations between the parts. SCV identifies composition where such irreducible, higher-level properties emerge.

  **2. The Pair: Incorrect Verdict and Revealing Commitments**
  SCV delivers the *incorrect* verdict that the shoe and the Eiffel Tower (S&ET) do *not* compose an object. The stipulation is decisive: *every* fact concerning S&ET is either a fact about the shoe alone, a fact about the ET alone, or a "plain relation" directly between them (like distance, relative mass, or "older than"). There are no irreducibly collective facts analogous to the swarm's CDs. For any fact seemingly about "them" (e.g., "The shoe and the ET are 5500km apart"), this is simply the plain relational fact *Distance(Shoe, EiffelTower) = 5500km*. A complete description can exhaust all facts about S&ET using only singular terms for the shoe, the ET, and predicates denoting properties of each or relations holding directly between them. No singular term for some further entity "composed" by S&ET is needed. SCV thus entails no composition occurs.

  Intuitively, however, this is the *right* answer – we don't believe a scattered object composed of a Boston shoe and the Eiffel Tower exists. So, SCV gets the verdict right *in this case*. But the *reason* it gets it right, and the *implication* of getting it right *only* under this description-based condition, is deeply problematic. SCV implies that the *only* reason S&ET don't compose an object is that we can describe all the facts without needing to refer to such an object. There is no barrier grounded in their spatial disconnection, causal isolation, or lack of functional unity *in itself* that rules out composition. Composition fails *solely* due to descriptive reducibility.

  This reveals SCV's core commitment: **Composition depends constitutively on our descriptive resources.** Whether composition occurs is not a mind-independent feature of reality determined solely by how the xs are arranged in the world (e.g., their spatial configuration, causal interactions, or functional integration). Instead, it is determined by whether *our descriptions* of the facts concerning the xs *require* positing a composite entity. If a description without composite terms is possible (as with S&ET), then no composition exists. If such a description is impossible (as claimed for the swarm), then composition exists. The existence of composite objects is tied to the expressive limitations or necessities of language.

  **Commitment to Descriptive Dependence and Conventionalism**
  This commitment makes SCV a form of *descriptive dependence* view, bearing strong affinities to, though not being identical to, conventionalism. Conventionalism typically holds that whether composition occurs is a matter of linguistic or conceptual convention – we *choose* to "carve up" the world in certain ways. SCV is subtler: it doesn't claim we *choose* when description is irreducible; it claims that composition *is constituted by* the *fact* that irreducible description is necessary. However, this "fact" about descriptive necessity is not brute; it plausibly depends on the conceptual and linguistic resources available *to us* for describing the world. What counts as a "plain relation" or an "irreducible collective fact" depends on our descriptive framework. Crucially, SCV makes the *existence* of the composite object depend on this framework-dependent feature. Therefore, while SCV might deny being *merely* conventional (insisting the irreducibility is a real feature *of our descriptive interaction with the world*), it unequivocally commits its proponent to the view that composition is not a fully mind-independent relation. It depends on the nature and limits of description, which is an activity and capacity of thinkers and language-users. This renders composition metaphysically lightweight and dependent on our representational practices, a significant cost for those seeking a robustly realist ontology of ordinary objects like swarms.

  SCV correctly classifies both cases, but only by making composition hinge on descriptive reducibility, thereby tethering the existence of composite objects to our descriptive capacities in a way that compromises metaphysical realism about composition.

  ---

  **Marking Scheme (25 Marks)**

  **A (21-25 Marks):** Outstanding, critically engages with the view's foundations and implications.
  *   **Must Contain:**
      *   Clear explanation of why SCV entails composition for the Swarm based on irreducibly collective dispositions forcing singular term use. (4 marks)
      *   Clear explanation of why SCV entails *no* composition for the Pair based on the reducibility of all facts to individual/relational facts. (4 marks)
      *   Recognition that while the verdicts *match* intuition, the *reason* SCV gives for the Pair’s non-composition (only descriptive reducibility) is crucial. (3 marks)
      *   Explicit, precise articulation that SCV commits to composition depending constitutively on descriptive resources/reducibility. (3 marks)
      *   Nuanced discussion linking this commitment to conventionalism or descriptive dependence, acknowledging the distinction while arguing SCV still makes composition mind-dependent. (5 marks)
      *   Evaluation of the defensibility of this commitment (e.g., cost to realism, potential counterarguments considered). (3 marks)
      *   Overall coherent, well-structured argument. (3 marks)
  *   **Note:** Prevents crediting answers that get the verdicts right but miss the deep implication about mind-dependence, or that conflate descriptive necessity with ontological fundamentality without argument.

  **B (16-20 Marks):** Good, covers the main points but lacks full critical depth or nuance on implications.
  *   **Must Contain:**
      *   Correct application of SCV to the Swarm case, explaining irreducibility necessitates the singular term. (4 marks)
      *   Correct application of SCV to the Pair case, explaining reducibility means no singular term is needed. (4 marks)
      *   Acknowledgement that SCV delivers the *correct intuitive verdicts* in both cases. (2 marks)
      *   Identification that SCV makes composition depend on descriptive facts (reducibility/irreducibility). (3 marks)
      *   Statement that this links composition to language/description/mind. (2 marks)
      *   Some attempt to label this (e.g., as conventionalism or anti-realism), though potentially less nuanced. (2 marks)
      *   Basic structure and clarity. (3 marks)
  *   **Note:** Prevents crediting answers that fail to connect SCV’s mechanism (descriptive irreducibility) to a dependence claim, or that assume the correctness of the verdicts validates the view without probing its commitments.

  **C (11-15 Marks):** Satisfactory, basic understanding but significant omissions or errors in application/implications.
  *   Explains SCV for one case reasonably well, but weak or incorrect on the other. (5 marks)
  *   Misses or misstates the connection between SCV's verdicts and descriptive dependence. (Deduct 4 marks)
  *   May confuse irreducibility of description with irreducibility of properties/parthood without argument. (Deduct 3 marks)
  *   Superficial or incorrect treatment of the commitment question (e.g., simply filing under "conventionalism" without justification). (3 marks)
  *   Adequate structure. (3 marks)
  *   *Note:* Prevents passing answers that misapply SCV to the cases or completely ignore the dependence question.

  **D (6-10 Marks):** Poor, demonstrates only a minimal grasp of the question or the view.
  *   Significant misunderstanding of SCV or the cases. (5 marks)
  *   Fails to coherently apply SCV to one or both cases. (Deduct 5 marks)
  *   Little to no engagement with the commitment question. (Deduct 4 marks)
  *   Weak structure and clarity. (1 mark)
  *   *Note:* Prevents failing answers from scoring higher by sheer volume without relevant content.

  **F (0-5 Marks):** Fail, demonstrates no understanding or irrelevant.
  *   Completely incorrect or irrelevant response. (0 marks)
  *   *Note:* Catches answers that ignore the stipulated view or the test cases entirely.
