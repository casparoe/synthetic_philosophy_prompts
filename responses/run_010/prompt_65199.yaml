  - A bet on a proposition \(X\) at betting quotient \(q\) and stake \(S\) (where \(S\) is a real number, positive or negative) is a contract that pays \(S \cdot (1 - q)\) if \(X\) is true, and \(-S \cdot q\) if \(X\) is false.
  - A conditional bet on \(Y\) given \(X\) at betting quotient \(q\) and stake \(S\) is a contract that pays \(S \cdot (1 - q)\) if \(X \wedge Y\) is true, \(-S \cdot q\) if \(X \wedge \neg Y\) is true, and is called off (i.e., pays 0) if \(X\) is false.

  ---

  **Part A (10 marks)**

  Ren has opinions about two propositions, \(A\) and \(E\). Her unconditional credences over the atoms are:

  \[
  \begin{align*}
  \text{cr}(A \wedge E) &= 0.21, \\
  \text{cr}(A \wedge \neg E) &= 0.49, \\
  \text{cr}(\neg A \wedge E) &= 0.10, \\
  \text{cr}(\neg A \wedge \neg E) &= 0.20.
  \end{align*}
  \]

