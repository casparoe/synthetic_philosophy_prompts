  ### Marking Scheme  
  **Total: 30 marks**  
  - **First-class answer (70%+):** Correct in all technical parts (A1, B2 payoffs, B1 argument); precise on philosophical nuances (A2 bridge premise, C1 indexing, C2 defense); no significant errors.  
  - **Good answer (50-69%):** Minor technical/arithmetic errors but solid structure; adequate on philosophy but misses nuances.  

  #### Part A (10 marks)  
  - **A1 (5 marks):**  
    - Portfolio: 1 mark (correct bets), 1 mark (correct stakes: 100, 100, 60), 1 mark (correct quotients), 1 mark (payoff table), 1 mark (loss = $21).  
    - **Common errors:**  
      - Stakes not $100/$100/$60 (e.g., $100 for all): −1 (if loss ≠ $21 or not constant).  
      - Payoff table errors: −1 per major mistake (e.g., missing world, wrong sign).  
      - No constant loss: −1 (if still a sure loss) or −2 (if not).  
      - *Blog-formed error:* Omit conditional bet; use unconditional bets only (fails; −3).  
  - **A2 (5 marks):**  
    - 1 mark: Notes individual fairness.  
    - 2 marks: Explains aggregation as vulnerability source.  
    - 2 marks: Identifies bridge premise (commitment to package acceptance).  
    - **Common errors:**  
      - Asserts Dutch Book = belief inconsistency without bridge: −2.  
      - Misses aggregation point: −2.  

  #### Part B (15 marks)  
  - **B1 (5 marks):**  
    - 2 marks: Finite portfolios cover finitely many tickets.  
    - 2 marks: World \(H_k\) (\(k\) uncovered) has no loss.  
    - 1 mark: Bet on \(D\) nets 0.  
    - **Common errors:**  
      - Asserts without argument: −3.  
      - Misses \(H_k\): −2.  
  - **B2 (5 marks):**  
    - 2 marks: Buys bets on each \(H_i\) (stake +100, price 0).  
    - 2 marks: Sells bet on \(D\) (stake −100, price 1).  
    - 1 mark: Correct payoff in \(H_j\): Dana loses $100.  
    - **Common errors:**  
      - Wrong stake signs: −2.  
      - Incorrect payoff: −2.  
  - **B3 (5 marks):**  
    - 2 marks: Finite truncation fails in \(H_k\) (\(k\) truncated).  
    - 2 marks: Profit from winning ticket payout (no offset).  
    - 1 mark: Highlights limit/infinite coverage.  
    - **Common errors:**  
      - Says truncation works: −2.  
      - Vague profit explanation: −1.  

  #### Part C (5 marks)  
  - **C1 (2 marks):**  
    - 1 mark: Family of criteria.  
    - 1 mark: Indexed to portfolio class (e.g., finite/countable).  
  - **C2 (3 marks):**  
    - 1 mark: Clear position.  
    - 2 marks: Coherent argument (e.g., defends with finite additivity/pragmatism, or critiques with countable additivity).  
    - **Full credit for heterodoxy:** Well-argued defense/critique (e.g., Dana rational + finitist reasons, or irrational + countable Dutch Book).  

  #### Contestable Points (Full Credit for Well-Argued Views)  
  - **A2 bridge premise:** Alternative formulations accepted if coherent (e.g., "logical omniscience").  
  - **C2 Dana’s rationality:** Defense (as above) or critique (e.g., countable additivity is normative) accepted if argued.  

  #### Defects in Setup (None)  
  - Numbers work: Ren’s loss is clean $21; Dana’s loss is $100.  
  - Part B2 answerable: Portfolio is simple; payoffs verifiable quickly.  
  - No trivial solutions: Part B requires understanding infinite portfolios.  

