  **B1.** (5 marks) Argue that no finite portfolio of bets at Dana's prices can guarantee her a net loss. (Do not just assert this; provide reasoning.)

  **B2.** (5 marks) Construct an explicit countably infinite portfolio of bets that guarantees Dana a net loss. Use the stake for the bet on \(D\) to be \(-\$100\) (i.e., selling a bet on \(D\)) and for each bet on \(H_i\) to be \(+\$100\). Verify the payoff for each ticket that wins (i.e., for each world where a particular \(H_j\) is true).

