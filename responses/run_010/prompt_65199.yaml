  ---

  **Part C (5 marks)**

  **C1.** (2 marks) Is the sure-loss criterion for rationality a single criterion or a family of criteria indexed by a class of admissible portfolios (e.g., finite vs. countable)? Briefly explain.

  **C2.** (3 marks) Is Dana irrational? How might a defender of Dana answer the charge that her opinions cannot be jointly correct given that she is certain that some ticket wins (so \(\text{cr}(D)=1\)) but prices each individual ticket at 0?

