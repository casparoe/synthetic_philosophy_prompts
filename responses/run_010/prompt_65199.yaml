    - \(-S \cdot q\) if \(X\) is false.  
  - A **conditional bet on \(Y\) given \(X\)** at betting quotient \(q\) and stake \(S\) pays:  
    - \(S \cdot (1 - q)\) if \(X \wedge Y\) is true,  
    - \(-S \cdot q\) if \(X \wedge \neg Y\) is true,  
    - \(0\) if \(X\) is false (called off).  

  ---

  #### Part A (10 marks)  
  Ren has opinions about propositions \(A\) and \(E\). Her unconditional credences are:  
  \[
  \begin{align*}
  \text{cr}(A \wedge E) &= 0.21, \\
  \text{cr}(A \wedge \neg E) &= 0.49, \\
  \text{cr}(\neg A \wedge E) &= 0.10, \\
  \text{cr}(\neg A \wedge \neg E) &= 0.20.
  \end{align*}
  \]  
  These are coherent (sum to 1). Her conditional credence for \(E\) given \(A\) is 0.60, though her unconditional credences imply \(\text{cr}(E \mid A) = \frac{0.21}{0.70} = 0.30\).  

  **A1.** (5 marks)  
  Write down an explicit portfolio of bets (specifying type, proposition, quotient, stake, and whether bought or sold) at Ren’s prices that costs her the same nonzero amount in every possible world. Use stakes in multiples of $100. Provide a payoff table showing net payoffs for the bookie (opponent) in the worlds \(A \wedge E\), \(A \wedge \neg E\), and \(\neg A\) (combine \(\neg A \wedge E\) and \(\neg A \wedge \neg E\) since payoffs are identical). State the guaranteed loss to Ren.  

  **A2.** (5 marks)  
  Explain how your portfolio shows that Ren’s vulnerability to a sure loss arises solely from aggregating individually fair bets. What does this imply about the inference from "Ren can be made to lose money for sure" to "Ren’s beliefs are inconsistent"? Identify the bridge premise needed to link package-level vulnerability to a defect in belief (not just choice).  

  ---

  #### Part B (15 marks)  
  Dana faces a lottery with tickets numbered \(1, 2, 3, \ldots\) (countably infinite), exactly one of which will win. Let \(H_i =\) "ticket \(i\) wins" and \(D = H_1 \vee H_2 \vee \cdots\) (so \(D\) is certain). Dana’s prices follow the finite-cofinite zero-one measure:  
  - Price of any finite disjunction of \(H_i\)s (including single tickets) = 0.  
  - Price of \(D = 1\).  

  **B1.** (5 marks)  
  Argue that no finite portfolio of bets at Dana’s prices can guarantee her a net loss. (Do not just assert this; provide reasoning.)  

  **B2.** (5 marks)  
  Construct a countably infinite portfolio guaranteeing Dana a net loss. Use:  
  - Stake \(-\$100\) for a bet on \(D\) (i.e., sell a bet on \(D\)),  
  - Stake \(+\$100\) for a bet on each \(H_i\) (i.e., buy a bet on each \(H_i\)).  
  Verify the net payoff for Dana when ticket \(j\) wins (for arbitrary \(j\)).  

  **B3.** (5 marks)  
  Explain why no finite truncation of your portfolio in B2 guarantees a sure loss. Where does the bookie’s profit come from in the infinite portfolio?  

  ---

  #### Part C (5 marks)  
  **C1.** (2 marks)  
  Is the sure-loss criterion a single criterion or a family of criteria indexed by a class of admissible portfolios (e.g., finite vs. countable)? Briefly explain.  

  **C2.** (3 marks)  
  Is Dana irrational? How might a defender of Dana answer the charge that her opinions cannot be jointly correct (she is certain some ticket wins, yet prices each \(H_i\) at 0)?  

  ---

  ### Model Answer  
  **Total word count: ~1,100**  

  #### Part A  
  **A1.**  
  Portfolio (all at Ren’s prices; stakes in dollars):  
  1. **Sell** a conditional bet on \(E\) given \(A\), quotient 0.60, stake \(S_1 = 100\).  
  2. **Buy** a bet on \(A \wedge E\), quotient 0.21, stake \(S_2 = 100\).  
  3. **Sell** a bet on \(A\), quotient 0.70, stake \(S_3 = 60\).  

  Payoff table (net gain for bookie; Ren’s loss is the negative):  
  | World          | Conditional bet on \(E \mid A\) (sold) | Bet on \(A \wedge E\) (bought) | Bet on \(A\) (sold) | Bookie’s net gain | Ren’s net loss |  
  |----------------|----------------------------------------|--------------------------------|---------------------|-------------------|----------------|  
  | \(A \wedge E\) | \(-100 \cdot (1 - 0.60) = -40\)        | \(100 \cdot (1 - 0.21) = 79\)  | \(-60 \cdot (1 - 0.70) = -18\) | \(21\)          | \(-21\)        |  
  | \(A \wedge \neg E\) | \(100 \cdot 0.60 = 60\)          | \(-100 \cdot 0.21 = -21\)      | \(-60 \cdot (1 - 0.70) = -18\) | \(21\)          | \(-21\)        |  
  | \(\neg A\)     | \(0\) (called off)                   | \(-100 \cdot 0.21 = -21\)      | \(60 \cdot 0.70 = 42\)      | \(21\)          | \(-21\)        |  

  - **Guaranteed loss to Ren:** $21 in every possible world.  

  **A2.**  
  - **Individual fairness:** Each bet is fair by Ren’s credences. The conditional bet has expected value 0 given her conditional credence 0.60. The bet on \(A \wedge E\) is fair given her unconditional credence 0.21. The bet on \(A\) is fair given her credence 0.70.  
  - **Package-level vulnerability:** The sure loss arises only when the bets are aggregated. Individually, each bet is consistent with her beliefs; the incoherence is revealed only in combination.  
  - **Inference and bridge premise:** The Dutch Book Theorem infers inconsistent beliefs from vulnerability to a sure loss. This requires the bridge premise: *The agent is committed to accepting any finite combination of bets they deem individually fair.* Without this, vulnerability reflects a choice defect (e.g., myopia about aggregation), not a belief defect. The argument assumes agents evaluate bets package-wise or are logically omniscient.  

  #### Part B  
  **B1.**  
  - Any finite portfolio involves finitely many bets. These bets reference only finitely many tickets (say, tickets \(1\) to \(n\)) and possibly \(D\).  
  - The bet on \(D\) (price 1) has net payoff 0 in all worlds (since \(D\) is always true). Bets on finite disjunctions (price 0) pay \(S\) only if the winning ticket is in their disjunction.  
  - Consider world \(H_k\) where \(k > n\) (a ticket not referenced). Here, all finite disjunction bets pay 0 (since \(k\) is outside their scope), and the bet on \(D\) pays 0. Net loss = 0.  
  - Since no loss occurs in \(H_k\), no finite portfolio guarantees a sure loss.  

  **B2.**  
  Portfolio:  
  - **Buy** a bet on each \(H_i\) (price 0), stake \(S_i = 100\) for all \(i = 1, 2, \ldots\)  
  - **Sell** a bet on \(D\) (price 1), stake \(S_D = -100\) (i.e., receive $100 upfront).  

  **Verification for world \(H_j\) (ticket \(j\) wins):**  
  - **Bet on \(H_j\) (bought):**  
    - Dana pays bookie \(100 \cdot (1 - 0) = 100\) (since true).  
  - **Bets on \(H_i\) for \(i \neq j\) (bought):**  
    - Dana pays bookie 0 (all false).  
  - **Bet on \(D\) (sold):**  
    - Bookie pays Dana \((-100) \cdot (1 - 1) = 0\) (net; upfront payment cancels payout).  
  - **Net for Dana:** \(-100 + 0 + 0 = -100\).  
  - **Result:** Dana loses $100 in every world.  

  **B3.**  
  - **Finite truncation (tickets \(1\) to \(n\)):** In world \(H_k\) (\(k > n\)):  
    - Bets on \(H_1\) to \(H_n\) pay 0 (all false).  
    - Bet on \(D\) pays 0.  
    - Net loss = 0 (no loss).  
  - **Profit source in infinite portfolio:** The bookie collects $100 from the winning ticket (always covered) with no offsetting cost. The bet on \(D\) nets 0, and the infinite coverage ensures every world has a winner. Profit is a "limit phenomenon" from full enumeration.  

  #### Part C  
  **C1.**  
  The sure-loss criterion is a **family of criteria** indexed by admissible portfolios. Finite Dutch Books (finite portfolios) define one criterion; countable Dutch Books (countably infinite portfolios) define another. Dana satisfies the finite criterion (no finite sure loss) but violates the countable criterion. Admissibility depends on the chosen portfolio class.  

  **C2.**  
  - **Defense of Dana (not irrational):**  
    Dana’s beliefs are consistent with **finitely additive probability**: \(P(D) = 1\), \(P(H_i) = 0\) for all \(i\), with finite additivity (but not countable additivity). A defender argues:  
    - **No feasible exploit:** Infinite portfolios are pragmatically impossible; rationality should not require immunity to non-implementable threats.  
    - **Joint correctness:** Opinions are jointly correct under finite additivity. Countable additivity is not a rationality axiom—it is a restriction for specific applications (e.g., continuous spaces).  
    - **Charge rebuttal:** The charge assumes countable additivity (\(P(D) = \sum P(H_i)\)), which Dana rejects. Her beliefs are correct: Some ticket wins (so \(D\) is true), but no particular ticket is "probabilistically privileged" (each \(P(H_i) = 0\) is consistent).  
  - **Alternative view (irrational):** Countable Dutch Books reveal incoherence; avoiding them requires countable additivity.  

