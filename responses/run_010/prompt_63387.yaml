  ## Speech: The Shape of Holding

  **(Approx. 7 minutes; ~800 words)**

  Good evening. On behalf of my sisters and our family, thank you all for being here to celebrate my mother’s retirement. It means a lot to see so many faces – those who’ve known her across a boardroom table, and those who know her best across a bridge table or over the garden fence.

  My mother spent thirty-one years doing a job most of us struggle to fully picture. I build complicated systems for a living, things meant to move smoothly and predictably. But what she worked on was a system built on a very different kind of logic. One that, when I finally tried to understand it this past winter, left me stuck on a particular paradox.

  Imagine someone makes a promise. A huge, terrifying promise. The kind of promise that, if you ever actually *had* to keep it, would mean everything was already lost. Keeping it would be the worst outcome imaginable, for everyone involved, especially the one who made the promise. The entire safety of the system depends on everyone believing this promise absolutely, *and* on that promise never, ever being put to the test. Its power relies on it staying… theoretical. Untried. The moment you might *have* to act on it, the whole logic collapses.

  That’s the unstable core my mother spent her career tending. Her job, fundamentally, was making sure the test never came. It wasn't about winning a contest. It was about maintaining a balance so precarious, so dangerous to disturb directly, that the only possible work was the careful, constant work of preventing the unthinkable from being triggered. It was about holding the line so that the ultimate failure – the test itself – never happened.

  But it wasn't just about that one big, terrifying promise staying theoretical. The people who really understand this system know it’s more complicated than a simple "if you do X, I will do Y."

  One thing I learned is that the most believable posture isn’t a perfectly controlled, clean threat. It’s something messier. It involves deliberately creating a little shared uncertainty. A sense that things *could* slip, that events *could* spin partly out of anyone’s hands, leading to consequences no one fully intends but everyone fears. Why? Because a threat you have complete, absolute control over is a threat you could, at the last second, choose *not* to carry out. And if everyone knows you *might* back down, the threat loses its power. The uncertainty itself, the shared risk, is what makes the promise feel real. It makes the danger palpable enough to prevent action.

  And then there’s the other side of that coin. If you made the system completely automatic – if you took away any last chance for a human to step in, to reconsider, to say "stop" – you’d have the most believable promise possible. But that would also be the most terrifying design. Because the very moment when a terrible accident is about to happen, the moment when you desperately *need* a human judgment call, a pause, a second thought… that’s the exact moment the system would be on autopilot. Removing the human decision precisely when you need it most is the worst kind of safety failure.

  It’s a system built on contradictions. A promise too terrible to keep, made believable by shared risk and uncertainty, yet dependent on the very human judgment that an automatic system would remove. And it creates a strange, uncomfortable space: this incredibly dangerous balance at the top makes it possible for smaller, sometimes crueler conflicts to happen underneath, precisely because everyone knows disturbing the top is unthinkable.

  My mother saw this not as a fascinating puzzle, but as a profound moral problem. Her life's work was the painstaking, often invisible labour of keeping that impossible balance stable. Making sure the test never came. It was about the notification agreements, the inspection schedules, the agonizingly slow back-channel work to get two parties who wouldn’t speak directly to agree on the wording of a single paragraph. For two years. On *one* sentence. It was about the yellow legal pads filled with precise language, the phone answered the same way, every time, for three decades – a ritual of readiness. It was about maintaining the channels, clarifying the misunderstandings, reducing the risks that could lead to the test nobody wanted but everyone had to pretend they might carry out.

  It’s work that defies celebration in the usual ways. There’s no victory parade for the disaster that didn’t happen. No monument for the sentence that took two years to get right, the one that prevented a misunderstanding. The measure of success is the absence of catastrophe. It’s holding.

  And yet… this woman who navigated these impossible, world-spanning tensions also has a tomato garden that could probably supply the neighbourhood through a siege. Ask anyone here about her tomatoes. Ask us – her kids – about the absurd abundance of them every summer. Ask her bridge partners about the jars that magically appear on their doorsteps. It’s enthusiasm bordering on mania. She approaches growing tomatoes with the same intense focus she brought to those legal pads. Is it an antidote to the abstract terrors? A grounding in the tangible? Or just a deep, stubborn belief in nurturing something good? Whatever it is, it’s real, it’s generous, and it results in far more tomatoes than any reasonable person would attempt. We’ve eaten a lot of tomato sauce.

  That’s the person we know. The one who is never late returning a phone call, neighbour or negotiator. The one who tends her garden with fierce dedication, just as she tended that fragile, dangerous balance for thirty-one years.

  So, we celebrate her tonight not for solving the unsolvable paradox, but for holding her post within it. For the uncelebrated labour of making sure the test never came. For understanding that the system she served wasn’t wise, but that holding it steady, day after day, year after year, was essential. For the clarity of her moral sense that saw it as a problem to be managed, not a game to be won.

  Mom, we honour the work. We honour the holding. And we are profoundly grateful for the tomatoes. Enjoy the garden. You’ve earned it.
