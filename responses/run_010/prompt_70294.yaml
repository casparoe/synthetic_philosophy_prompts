  On the decree vs law distinction... Ah! Aristotle's key point is about generality versus specificity. Laws must be general principles applying equally to all, while decrees are situational decisions. The user's right that form and content can diverge today, but for Aristotle the procedural aspect (stable rules vs ad hoc votes) was inseparable from the substantive nature of the output.

