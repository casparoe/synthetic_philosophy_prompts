prompt: |-
  Been reading Aristotle's Politics, book IV (1292a, Rackham trans.) and I'm stuck on a chunk of it. Here's the bit:

  > "Another kind of democracy is where all the other regulations are the same, but the multitude is sovereign and not the law; and this comes about when the decrees of the assembly over-ride the law. This state of things is brought about by the demagogues; for in the states under democratic government guided by law a demagogue does not arise, but the best classes of citizens are in the most prominent position; but where the laws are not sovereign, then demagogues arise; for the common people become a single composite monarch, since the many are sovereign not as individuals but collectively."

  and a bit further on:

  > "…for they owe their rise to greatness to the fact that the people is sovereign over all things while they are sovereign over the opinion of the people, for the multitude believes them."

  > "such a democracy is not a constitution at all; for where the laws do not govern there is no constitution … it is impossible for a voted resolution to be a universal rule."

  Can you help me get a handle on what he's doing here? A few things I can't work out:

  - What's the actual content of the "single composite monarch" claim? Is it that a majority can't deliberate, so it ends up acting like one undivided will, or is the point more about accountability? And the demagogues being "sovereign over the opinion of the people" — is that meant as an epistemic worry (nobody can tell who's right) or just a power observation?
  - Why is it *impossible* for a decree to be a universal rule? Is the law/decree distinction about generality of content, or about how the thing gets made — entrenchment, procedure, whether it's aimed at a named person? Becuase those come apart all the time and he seems to be treating them as one thing.
  - The one I most care about: I'm interested in democratic backsliding, and the modern cases (Hungary replacing the constitution wholesale, court-packing, referendums to overrule judges) all happen through channels that are formally legal. If a government acts by law rather than by decree, does Aristotle's test just fail to bite at all? Or is there something in the passage that still gets a grip on a majority that keeps amending its own fundamental rules?

  Please answer in British English.
