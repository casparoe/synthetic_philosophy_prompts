answer: |-
  ## Research Proposal: Beyond Blame - Diagnosing Discharge Gaps in Autonomous System Governance

  **Project Title:** Mapping the Transactional Void: Diagnosing and Addressing Discharge Gaps in Autonomous System Responsibility

  **1. Introduction & Problem Statement**
  The proliferation of autonomous systems (AS) across domains like transport, healthcare, and logistics has intensified concerns about the "responsibility gap": scenarios where harm occurs, yet no individual or entity can be justly blamed. Prevailing analyses primarily focus on identifying a culpable *agent* – debating whether blame distributes across actors (developer, operator, organisation), necessitates strict liability, or vanishes into a "problem of many hands." This project contends that this agent-centric focus is misplaced and obscures a more fundamental governance failure. The critical deficit in problematic cases is often not the absence of a blameworthy party, but the absence of a functional *transactional loop*: the inability for the affected party (or their representatives) to effectively address a demand concerning the harm to *any* relevant institution, receive an intelligible response, and witness a meaningful consequence.

  Consider two illustrative cases:
  1.  **Maritime Navigation:** An autonomous cargo vessel executes a legal, protocol-compliant course alteration. A smaller vessel grounds itself avoiding it. Subsequent investigations show the flag state, software vendor, classification society, and shore operator all adhered strictly to their procedures. Compensation is paid by insurers, but no specific entity accepts responsibility. Affected parties have no clear, non-arbitrary entity to whom they can direct questions or demands for explanation or remediation.
  2.  **Healthcare Triage:** A hospital's AI triage algorithm, validated according to protocol, systematically deprioritises a specific patient group. This bias is discovered a year later. Clinicians, unaware of the algorithmic scores, had no basis to override them. The hospital pays compensation via insurance, no individual is sanctioned, and affected patients/families lack a clear channel to demand answers or assurances about systemic changes.

  In both cases, the core failure is not necessarily a lack of *attributability* (potentially, blame *could* be distributed), but a failure of *answerability* or *discharge*. The harmed party encounters a void when attempting to initiate the fundamental transaction of demanding an account.

  **2. Research Question**
  The central research question is:

  > **Under what necessary and sufficient conditions can an institution governing an autonomous system successfully discharge its responsibility by completing the transactional loop – receiving, processing, and responding meaningfully to demands arising from that system’s operations – irrespective of the prior attribution of blame?**

  This question is genuinely open: the outcome could reveal that specific, identifiable institutional structures and processes *are* sufficient (or necessary) for discharge, or it could demonstrate that the transactional loop inevitably collapses without prior blame attribution, or that existing minimal structures (like generic complaint procedures) are surprisingly adequate.

  **3. Gap in Existing Literature & Why the Transaction Matters**
  Existing approaches to the responsibility gap fail to adequately address the transactional dimension:

  *   **Distributed Blame/Problem of Many Hands:** This literature focuses on *whether* and *how* blame can be apportioned across multiple actors (e.g., Nissenbaum, Copp). It assumes that identifying culpable agents *is* the solution to the gap. However, as the cases show, even when blame *could* theoretically be distributed, the harmed party may *still* face a discharge gap if no institution is structured to *receive and answer* their specific demand. The transaction is presupposed, not analysed.
  *   **Strict Liability/Compensation Schemes:** These solutions (e.g., Calo, Gurney) bypass blame attribution by imposing liability and ensuring compensation. While vital for redress, they often terminate the transactional loop prematurely. Payment settles the *claim* but does not inherently provide the harmed party with an *explanation*, an *acknowledgement* of the failure, or a visible *institutional response* (e.g., system modification, process change). The demand for an *account* remains unmet.
  *   **Institutional Design/Oversight Regimes:** Proposals for new regulatory bodies, audit standards (e.g., ISO standards, emerging AI audits), or due diligence frameworks (e.g., EU AI Act requirements) focus on preventing harm or assigning oversight pre-hoc. While crucial, they primarily address *locus* (designating responsible entities) and *ex ante* risk management. They do not inherently guarantee the *ex post* capacity and willingness of the designated institution to engage in a meaningful, demand-responsive dialogue with the specific harmed party. An audit might confirm protocol compliance without addressing the victim's demand for understanding or assurance.

  The literature on "responsibility voids" (e.g., Santoni de Sio, Van den Hoven) and distinctions between *attributability* and *answerability* (e.g., Watson, Fischer & Ravizza) comes closest. These frameworks recognise that being blameworthy (attributability) is distinct from being *held* responsible through demands (answerability). **However, the existing conceptual work lacks a precise operationalisation of what constitutes a successful "answerability transaction" in the context of AS harms, particularly one that can be assessed *before* harm occurs (ex ante). Furthermore, it insufficiently disentangles the institutional *capacity* and *willingness* to discharge responsibility through such a transaction from the prior question of blame attribution. This project aims to rigorously define the transactional loop and develop a diagnostic test for institutional discharge capacity, filling this specific gap.**

  **4. Research Approach (9-Month Plan)**
  This project rejects the alternatives of refining blame distribution theories or designing comprehensive oversight regimes. Instead, it adopts a focused conceptual and diagnostic approach centred on the discharge transaction:

  *   **Phase 1: Conceptual Groundwork & Transaction Definition (Months 1-3):** Rigorously define the components of the "transactional loop" (demand initiation, intelligible reception, meaningful processing, substantive response, observable consequence). Analyse philosophical (answerability, recognition theory) and socio-legal (dispute resolution, grievance mechanisms, restorative justice) literature to establish criteria for a successful loop completion. Explicitly distinguish "locus gaps" (no entity) from "discharge gaps" (entity exists but cannot/will not complete loop).
  *   **Phase 2: Case Analysis & Gap Diagnosis (Months 4-6):** Apply the developed framework to the two core cases (maritime, healthcare) and 2-3 additional documented cases of AS incidents (e.g., fatal autonomous vehicle crashes, algorithmic welfare allocation errors). Diagnose the nature of the gap (locus, discharge, or both) in each case. Identify recurring institutional features that create discharge gaps even when locus exists (e.g., fragmentation, opacity, lack of designated response protocols beyond compensation, diffusion of decision points).
  *   **Phase 3: Discharge Capacity Test Formulation (Months 7-9):** Synthesise findings to develop a diagnostic "Discharge Capacity Test" (DCT). The DCT will specify ex ante conditions an institution (or governance structure) must satisfy to demonstrate potential competency in completing the transactional loop *if* a demand arises. This involves defining testable criteria based on institutional structure, communication channels, decision-making authority, feedback mechanisms, transparency commitments, and resources dedicated to response.

  **5. Success Criteria & Outputs**
  A successful outcome is the formulation of a robust and actionable **Discharge Capacity Test (DCT)**. This test must:

  1.  **Be Ex Ante Applicable:** Assessable *before* system deployment or harm occurs, focusing on institutional *design* and *capacity*.
  2.  **Target the Transaction Specifically:** Move beyond assessing blame attribution or general risk management (covered by due diligence/audits). It must explicitly evaluate the institution's *potential* to: receive domain-specific demands, process them competently (investigate, deliberate), formulate intelligible responses, and enact meaningful consequences (beyond mere compensation).
  3.  **Differentiate Capacity:** Identify features that distinguish institutions genuinely capable of discharge from those merely possessing a complaints mailbox or insurance policy. It must probe the *quality* and *authoritativeness* of the potential response loop.
  4.  **Avoid Collapse:** Remain distinct from simply requiring strict liability or compensation schemes. While financial redress might be *one* consequence, the test must require capabilities for explanation, acknowledgement, and systemic learning/change.

  The primary output will be a comprehensive working paper detailing the conceptual framework, case analyses, and the proposed DCT, suitable for submission to a leading ethics/governance journal.

  **6. Failure Conditions & Risks**
  The project could fail meaningfully in several ways:
  *   **Trivialisation:** The DCT conditions might be so minimal that any organisation with a generic grievance procedure satisfies them, failing to capture the specific demands of AS-related harms.
  *   **Ex Ante Impossibility:** It might prove impossible to define meaningful, testable ex ante conditions for discharge capacity that are not either too vague or excessively demanding, rendering the DCT impractical.
  *   **Collapse into Liability:** The criteria might inadvertently reduce to requiring strict liability or mandatory compensation schemes, failing to capture the distinct elements of explanation, acknowledgement, and responsive action.
  *   **Insufficient Generality:** The DCT might only be applicable to the specific case studies analysed, lacking broader relevance across AS domains.
  *   **Overlap with Audit:** The DCT might become indistinguishable from adding new clauses to existing audit standards, failing to offer a novel diagnostic lens.

  Documenting these potential failure modes will be crucial for understanding the limits of the transactional approach.

  **7. Scope & Resources**
  This is a nine-month, purely theoretical and analytical project conducted by a single postdoctoral researcher. It leverages existing published case studies, legal analyses, incident reports, and philosophical/legal literature. There is no budget for primary fieldwork, interviews, or new data collection. The focus is on conceptual innovation and diagnostic tool development grounded in documented real-world scenarios and established scholarship.

  **Conclusion**
  This project moves beyond the stalled debate on blame attribution in autonomous systems by diagnosing a more fundamental failure: the discharge gap. By rigorously defining the transactional loop of responsibility, analysing its breakdown in key cases, and developing an ex ante Discharge Capacity Test, it aims to provide a novel and actionable tool for designing governance structures that can truly *answer* for the actions of the systems they deploy. This focus on institutional answerability offers a concrete path towards closing the real responsibility gap experienced by those harmed.

  \answer{Under what necessary and sufficient conditions can an institution governing an autonomous system successfully complete the transactional loop of receiving, processing, and responding to demands arising from its operations?}
