answer: |-
  ## Sestina: Oikos and Agora (After Aristotle, Politics I)

  The sandal's **use** is bound to simple **need**:
  To shield the foot, bear life's uneven **weight**.
  No thought of profit in its worn **shoe**,
  No hidden worth beyond its daily **stamp**,
  Its value fixed within the household's hold,
  Not measured out in cold, abstracted **gold**.

  Yet barter falters: grain for oil? Agreed,
  But when the oil is scarce, the harvest **gold**?
  One craves a cloak *now*, though the weaver's **need**
  Is timber, stacked and seasoned, bearing **weight**.
  No common measure, lacking coin or **stamp**,
  Can bridge this gap for sandal, cloak, or **shoe**.

  So men sought substance, useful, dense with **weight**,
  A common token all could understand:
  A useful metal, silver, rare **gold**,
  Accepted freely through the busy land.
  Its value first confirmed by careful **use**
  Of scales, each piece assessed, a measured **stamp**.

  Then came the city's mark, the trusted **stamp**,
  Relieving men from carrying the **weight**
  Of scales each time they sought to **use**
  This common measure. Faith replaced the **shoe**
  Of doubt. The token shone like captured **gold**,
  Convention answering the shifting **need**.

  But know this well: the gleaming token's **need**
  To function rests upon that fragile **stamp**,
  The shared belief that makes the metal **gold**
  More than its substance, bearing unseen **weight**.
  Withdraw that faith, discard the public **stamp**,
  It's useless slag. What practical **use**
  Remains? No bread, no wine, no worn-out **shoe**.
  Its power fades, a broken trust, a **need**
  Betrayed. The heavy, unmarked **weight**
  Is just a burden, stripped of meaning's **stamp**,
  No longer bright and trusted, like true **gold**.

  For while the household seeks its bounded **gold** –
  Enough warm grain, a roof, a sturdy **shoe** –
  True wealth defined by what sustains the **need**,
  The money-art has no such limit's **stamp**.
  Its end is endless, adding **weight**
  To **weight**, transforming every **use**
  To **use** in chains of gain. The proper **use**
  Of things is lost. The gleam of **gold**
  Becomes the goal itself, a crushing **weight**
  That sees the sandal not as needed **shoe**,
  But vessel for the ever-shifting **stamp**
  Of profit, blind to actual human **need**.

  **Envoi**
  King, feel the **weight** of your cold **gold**'s dread **stamp**:
  True **need** returns – a hunger no bright **use**
  Can sate. The **shoe** won't feed you. All is **gold**.
