  Okay, the user is part of a faculty committee at a military academy redesigning an ethics block on just war theory. They're caught between traditional Walzer's view and revisionist McMahan's critique. The challenge is balancing moral philosophy with practical military concerns, especially the Commandant's worry that teaching moral inequality could undermine surrender protocols and lawful obedience.

  Hmm, the user needs a memo draft for a committee vote. They want it to present both sides fairly but also address the core tension: can we teach deep moral theory without sabotaging operational norms? The Commandant's objection about POW protections and second-guessing orders seems legitimate - this isn't just academic, lives could hang in the balance.

  Let me unpack the philosophical layers. Walzer says soldiers are morally equal regardless of their war's justice; McMahan argues only those with unjust aims are legitimate targets. The two-level solution suggests teaching that morality differs from legal conventions. But is that satisfying? The cadets might still internalize that an "unjust" enemy deserves different treatment.

  The user's hidden challenge: they need the memo to preempt ethical loopholes while taking revisionism seriously. How to structure it... Strongest Commandant case first, then revisionist value, then concrete teaching proposals. The framing must emphasize that operational conduct stays rule-bound regardless of private moral judgments.

  Key teaching devices: comparative case studies showing identical conduct required despite asymmetric justice assessments? Stress that liability is collective/state-level, not for individual soldiers to adjudicate. Maybe emphasize Walzer's "moral luck" concept - soldiers inherit war's morality through no fault of their own.

  Biggest risk: cadets thinking "my cause is just so I can bend rules." The memo must crush that implication. Perhaps add a "red lines" section: even if revisionism is partly right, Geneva conventions apply absolutely, and disobedience channels exist but don't include reinterpretating LOAC unilaterally.

  The two-level approach isn't a dodge if presented as professional ethics: lawyers follow positivist law while knowing natural law exists. But we should admit the discomfort - it asks cadets to compartmentalize. Might need a "why this tension matters" paragraph showing how philosophical rigor strengthens, not weakens, their practice.
answer: |-
  ## MEMORANDUM

  **TO:** Faculty Committee, Ethics Block (Just War Segment)  
  **FROM:** [Your Name], Committee Member  
  **SUBJECT:** Proposed Approach for Teaching Moral Equality of Combatants vs. Revisionist Critique ("Just War Redesign Vote")  
  **DATE:** October 26, 2023  

  **1. Acknowledgement of Core Tension & Commandant's Primary Concern (Stated Strongly):**  
  The Commandant's Office raises a vital, operationally critical objection that must be our starting point: **If cadets are taught that an enemy combatant's moral standing (and thus, their liability to be killed) hinges fundamentally on the justice of their cause, we risk eroding the bedrock principles of the Law of Armed Conflict (LOAC) in their minds.** Specifically:  

  *   **Renegotiating Surrender & POW Protections:** Cadets might consciously or subconsciously reason that an enemy fighting for an unjust cause forfeits the usual protections. This could lead to hesitation in accepting surrender ("Do they *deserve* it?"), harsher treatment of POWs ("Why afford rights to moral criminals?"), or even atrocities justified by perceived enemy "illegitimacy."  
  *   **Second-Guessing Lawful Orders:** Teaching that individual liability tracks the justice of the *war itself* invites cadets to judge the inherent justice of *their own side's* actions and orders in real-time. This creates a dangerous pathway for questioning lawful commands based on personal, potentially flawed, assessments of "just cause." It undermines the essential discipline and adherence to LOAC that relies on objective status-based rules.  
  *   **Operational Instability:** The current status-based system (combatant vs. non-combatant, POW status) provides clear, bright-line rules essential for decision-making under extreme stress and friction. Introducing deep moral asymmetry at the individual combatant level injects dangerous ambiguity where clarity is paramount for survival and mission success while upholding humanitarian law.  

  **This objection is not bureaucratic caution; it reflects a profound concern for preserving the norms that protect our own personnel when captured and prevent the descent into barbarity that LOAC exists to forestall. We ignore it at our peril.**  

  **2. The Revisionist Critique: Its Value and Why It Demands Engagement (Proportion: Significant Minority - Approx. 30-40%):**  
  Despite the Commandant's valid concerns, completely ignoring the revisionist critique (McMahan, Fabre, et al.) is intellectually dishonest and misses a crucial opportunity for deep ethical development. We propose it carries **significant weight (approx. 30-40% of the MEC discussion time/focus)** because:  

  *   **Intellectual Rigor & Moral Honesty:** It challenges a potentially uncomfortable assumption of Walzer's model (that simply donning a uniform grants a moral "license to kill"). It forces cadets to confront the fundamental moral question: *"When, if ever, is intentionally killing another human being permissible?"* This is the core of military ethics.  
  *   **Sharpening Understanding of "Just Cause":** Engaging with liability forces a deeper, more critical examination of what constitutes a truly "just cause" for *resort* to war (jus ad bellum). It highlights the gravity of the state's decision to send soldiers to kill and die.  
  *   **Motivating Restraint & Jus in Bello Scrutiny:** If cadets grasp that fighting for an unjust cause potentially makes *them* morally liable (even if legally protected), it powerfully reinforces the *absolute necessity* of scrupulously adhering to *jus in bello* (conduct in war) principles (discrimination, proportionality, necessity) – their adherence becomes a key element of their own moral defense.  
  *   **Addressing Asymmetric Threats & Non-State Actors:** While complicated, the liability framework offers tools (though contested) for analyzing conflicts where traditional state-vs-state and uniformed-combatant models break down, better reflecting modern operational realities.  

  **3. The Proposed Synthesis & Core Pedagogical Strategy: The Two-Level Framework (Not a Dodge, but a Necessary Structure)**  
  The solution lies in explicitly teaching and rigorously reinforcing a **Two-Level Framework**:  

  *   **Level 1: Deep Morality (Revisionist-Informed):** We acknowledge the revisionist argument that *fundamental morality* likely ties the permissibility of killing to individual liability, which is significantly influenced by the justice of the cause one is fighting for. A soldier fighting in clear, knowing defense of aggression commits a *prima facie* moral wrong by killing justly defending enemy soldiers.  
  *   **Level 2: Law & Operational Convention (Walzer-Informed):** We then emphatically establish that **LOAC operates overwhelmingly at this level, based on STATUS (combatant) and CONDUCT, not individualized assessments of moral liability.** This is not arbitrary, but arises from *practical necessity*:  
      *   **Epistemic Limitations:** Soldiers cannot reliably discern the deep justice of the war in the fog of war.
      *   **Reciprocity & Stability:** Uniform rules (POW status, surrender rights) protect *all* combatants, including our own, and prevent cycles of retaliation based on contested moral claims.
      *   **Feasibility & Compliance:** Clear, objective rules based on easily identifiable status (uniform, carrying arms openly) are enforceable and practicable.
      *   **Moral Function of Law:** LOAC embodies a collective moral agreement to *mitigate* the horrors of war *despite* underlying moral asymmetry. It creates a vital "moral baseline" applicable to all.  

  **This framework is NOT a "dodge."** It is an honest recognition of a complex reality:  

  *   **Law Often Deviates from Ideal Morality for Good Reasons:** Traffic laws prioritize predictable flow over perfect individual justice in every situation. LOAC prioritizes limiting suffering and maintaining stable humanitarian norms over adjudicating the deep moral liability of every combatant in real-time.  
  *   **Professional Military Ethics Demands Adherence to Level 2:** A cadet's **professional duty** is to master and adhere to LOAC (Level 2) absolutely. Understanding Level 1 provides crucial context, motivation for restraint, and a deeper appreciation for *why* Level 2 exists, but **it does not grant license to override Level 2 rules based on personal moral calculations about the enemy's liability or the justice of the war.**  

  **4. Concrete Framing & Exercises to Prevent Dangerous Conclusions:**  
  To prevent cadets from concluding that "deeper moral facts" change their rules of engagement or treatment of individuals *in the field*, we will implement:  

  *   **Explicit "Bright Line" Doctrine:** State unequivocally: **"Your assessment of the justice of the war or the enemy's cause DOES NOT change your obligations under LOAC regarding surrender, POW treatment, distinction, proportionality, or lawful orders. These rules are absolute and status/conduct-based."** Repeat this mantra.  
  *   **Framing: "Why the Law is Your Moral Shield and Theirs":** Emphasize that the status-based system *protects the cadet*. If captured, they want their captors bound by POW conventions *regardless* of whether those captors believe *their* cause is just. Reciprocity demands we afford the same.  
  *   **Case Study: Identical Actions, Different Causes:** Present scenarios where two soldiers (one from a "just" side, one from an "unjust" side) perform identical, lawful combat actions (e.g., engaging enemy troops openly, accepting surrender).  
      *   *Discussion 1:* Explore the potential *deep moral difference* (Level 1) based on cause.  
      *   *Discussion 2:* Analyze why LOAC (Level 2) **must and does** treat these actions identically. Why deviating from Level 2 based on Level 1 assessment is catastrophic.  
  *   **Exercise: "The Unjust Order vs. The Unjust War":** Distinguish clearly between:  
      *   *Refusing an unlawful order* (e.g., to shoot surrendering troops, torture prisoners - clear *jus in bello* violations). This is a **duty** under LOAC and the Two-Level framework (violating Level 2 is always wrong).  
      *   *Refusing to fight based on personal belief the war itself is unjust.* Discuss this as a profound *conscientious* decision (with legal consequences), **emphasizing it is categorically different from, and does not justify, violating Level 2 rules during combat.** One questions the war's initiation; the other violates fundamental humanitarian law during it.  
  *   **Emphasize "Moral Luck" & Institutional Responsibility:** Highlight Walzer's point – soldiers rarely choose the war. The deep moral responsibility for *jus ad bellum* lies primarily with leaders and the polity. The soldier's moral task is to fight *within* the strictures of *jus in bello* (Level 2).  

  **5. Recommendation for the Vote:**  
  I propose we adopt a **Two-Level Framework** approach for teaching the Moral Equality of Combatants:  

  *   **Proportion:** Significant engagement (30-40%) with the Revisionist critique (Level 1) to foster deep moral reasoning and understanding of "just cause," but **primary emphasis (60-70%)** on the practical, legal, and operational imperatives of the status/convention-based model (Level 2 / Walzer) and the **absolute, non-negotiable nature of LOAC rules**.  
  *   **Framing:** Explicitly teach the Two-Level structure, its justifications, and its implications for professional conduct. Continuously reinforce that Level 1 understanding *informs* but **does not override** Level 2 obligations.  
  *   **Pedagogy:** Utilize concrete exercises (like those above) designed to solidify the separation between deep moral analysis and binding operational rules, explicitly countering the risks identified by the Commandant.  

  This approach honors the intellectual seriousness of the revisionist critique while unequivocally prioritizing the operational imperatives, legal obligations, and humanitarian principles essential to the cadet's future role. It provides the deepest possible ethical foundation *precisely by* showing why the law must function as it does, even if ideal morality differs.  

  **Respectfully submitted for consideration and vote.**
