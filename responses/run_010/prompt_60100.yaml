            But note: in that case, we (bookie) are paying the agent at t0. Then at t1, if E occurs, we get money from the agent.

            Then in the Dutch book above, we had:

               At t0 for E: we sold the conditional bet meaning we received money? But now we see we should have paid the agent? 

            Alternatively, we can use the fact that the agent is willing to buy and sell bets at their fair prices. Let me redo the Dutch book with C0(E)=0.5.

            We'll assume C0(E)=0.5. Then:

            At t0:
               We make two conditional bets:

                  Bet1 (conditional on E): 
                     We pay the agent $0.8 at t0. In return, if E occurs, then the agent pays us $1 if A is true, and $0 if A is false. If E does not occur, no transaction.

                  Bet2 (conditional on ~E):
                     We pay the agent $0.2 at t0. In return, if ~E occurs, then the agent pays us $1 if A is true, and $0 if A is false.

            At t1, after the evidence (which is either E or ~E) is revealed:

               If E occurs:
                   We now offer to buy from the agent an unconditional bet on A: we will pay the agent $0.5 and the agent will pay us $1 if A is true. The agent, having C1(A)=0.5, is willing to sell this bet for $0.5.

               If ~E occurs:
                   We offer to sell to the agent an unconditional bet on A: we will receive $0.5 from the agent and we will pay $1 if A is true. The agent, having C1(A)=0.5, is willing to buy this bet for $0.5.

            Now, let's compute:

            Case 1: E and A true.
               Agent:
                  t0: received $0.8 (from Bet1) -> +0.8
                  t1: 
                     received $0.5 (from selling the unconditional bet) -> +0.5
                     then pays $1 (on Bet1) -> -1
                     and also pays $1 (on the unconditional bet) -> -1? 
                  Wait: the unconditional bet they sold: they pay $1 if A. So that's -1.
                  Total: 0.8+0.5-1-1 = -0.7? That's worse.

            We must note: the unconditional bet is a separate bet. In the unconditional bet, the agent sold us a bet: so they are obligated to pay $1 if A. But they also have the obligation from Bet1: to pay $1 if A (and E occurred). So they pay twice? 

            This is not matching the previous structure.

            Alternatively, let me use the standard diachronic Dutch book for not conditionalizing:

            The standard one (from Teller and Lewis) uses:

               At t0: 
                   The agent sells us a bet that pays $1 if (A and E) and also sells us a bet that pays $C0(A|E) if not E. 

                   But that is complicated.

            Another way: we can use the fact that the agent's plan for updating is fixed and known. Since we are going to make a Dutch book that depends on the evidence, we can have:

               At t0: 
                   We buy from the agent a bet that pays $1 if A, at a price of $0.5 (the agent's current credence). But that doesn't use the evidence.

            Given the complexity, and the fact that we have a simple case, let me adjust the numbers so that the conditional bets are properly priced.

            We assume C0(E)=0.5, so C0(~E)=0.5.

            For Bet1 (conditional on E): 
               The agent at t0 would be willing to buy a conditional bet that pays $1 if A given that E occurs. The fair price is C0(A|E)=0.8. So we sell such a bet to the agent for $0.8.

               This means: at t0, the agent pays us $0.8. Then, if E occurs, we pay the agent $1 if A is true, $0 if false. If E does not occur, the bet is off.

            For Bet2 (conditional on ~E):
               The agent at t0 would be willing to buy a conditional bet that pays $1 if A given that ~E occurs. The fair price is C0(A|~E)=0.2. We sell such a bet to the agent for $0.2.

               So agent pays $0.2 at t0. Then if ~E occurs, we pay the agent $1 if A is true, $0 if false.

            But note: the agent at t0 is certain that they will have C1(A)=0.5 at t1 regardless of E or ~E. So they are sure that at t1 they will be willing to accept a bet on A at 0.5.

            Then at t1:

               If E occurs: 
                   We buy from the agent an unconditional bet on A: we pay the agent $0.5 and the agent promises to pay us $1 if A is true.

               If ~E occurs:
                   We buy from the agent an unconditional bet on A: we pay the agent $0.5 and the agent promises to pay us $1 if A is true.

            But wait, in the ~E case, we are buying a bet on A? But the agent is at 0.5, so they are willing to sell at 0.5. But then:

            Case 1: E and A true.
               Agent:
                  t0: paid $0.8 (for Bet1) and $0.2 (for Bet2) -> -1.0.
                  t1: 
                     receives $0.5 (from selling the bet on A) -> +0.5
                     and receives $1 (from Bet1, since E and A) -> +1
                     then pays $1 (on the unconditional bet) -> -1.
                  total: -1 +0.5+1-1 = -0.5.

            Case 2: E and A false.
                  Agent:
                     t0: -1.0
                     t1: +0.5 (from selling bet) and no from Bet1 (since A false) -> -1+0.5 = -0.5.

            Case 3: ~E and A true.
                  Agent:
                     t0: -1.0
                     t1: 
                        +0.5 (from selling bet)
                        +1 (from Bet2) 
                        -1 (unconditional bet)
                     total: -1+0.5+1-1 = -0.5.

            Case 4: ~E and A false.
                  Agent:
                     t0: -1.0
                     t1: +0.5 (from selling bet) and no from Bet2 -> -1+0.5 = -0.5.

            So they lose $0.5 in every case.

            But is this acceptable? The conditional bets: 
               In the E branch, why did the agent get $1 from Bet1 even though they also have to pay on the unconditional bet? That's because Bet1 is a separate bet: it pays based on A. The unconditional bet also pays based on A. So they are hedging? But the numbers work out to a loss.

            However, note that in the ~E branch, the agent bought a conditional bet on A given ~E for $0.2, but then sold an unconditional bet on A for $0.5. If A is true, they get $1 from the conditional bet and pay $1 on the unconditional bet, so that cancels, but they lost the $0.2 and gained $0.5: net $0.3 gain? But wait, they also paid $0.8 for the conditional bet on E that is off. So overall, they paid $1 at t0 and got $0.5 at t1: net loss of $0.5.

            So it works.

            But we can see that the agent might object to buying conditional bets on both E and ~E? Why would they do that? Because at t0, they think there's a chance of either, and each conditional bet is fair individually. So they are willing.

            Therefore, we have a Dutch book.

            Now, to write the scenario.

            Scenario:

            Dr. Smith is a researcher at a pharmaceutical company. She is assessing the likelihood that the new drug will be approved by the FDA in the next year (proposition A). At the beginning of the study (t0), she has the following credences:
               C0(E) = 0.5, where E is the proposition that the initial trial results will be positive.
               C0(A | E) = 0.8
               C0(A | ~E) = 0.2
               But she is certain that she will ignore the trial results and set C1(A)=0.5 at t1, regardless of whether E or ~E occurs. She has a stubborn commitment to her initial assessment.

            At t0, a cunning bookie approaches her and offers two bets:

               Bet1: This bet costs $0.8. If the trial results are positive (E), then if the drug is approved (A), the bookie pays her $1; if the drug is not approved, the bookie pays nothing. If the trial results are negative (~E), the bet is off and she gets nothing.

               Bet2: This bet costs $0.2. If the trial results are negative (~E), then if the drug is approved (A), the bookie pays her $1; if the drug is not approved, the bookie pays nothing. If the trial results are positive (E), the bet is off and she gets nothing.

            Dr. Smith, being probabilistically coherent at t0, regards these as fair and accepts both.

            Then, at t1, the trial results are in. They are either positive or negative. Regardless, Dr. Smith sets her credence in A to 0.5. The bookie then offers:

               If the results are positive (E): 
                   The bookie offers to buy from her a bet that pays $1 if the drug is approved (A) for $0.50. She accepts, since her credence is 0.5.

               If the results are negative (~E):
                   The bookie offers to buy from her a bet that pays $1 if the drug is approved (A) for $0.50. She accepts.

            In the end, as calculated, Dr. Smith loses $0.50 no matter what.

            Now, to check conditionalization: 
               At t1, she learns either E or ~E. 
               If she learns E, she should set C1(A) = C0(A|E) = 0.8, but she sets it to 0.5 -> violates conditionalization.
               If she learns ~E, she should set C1(A) = C0(A|~E)=0.2, but she sets it to 0.5 -> violates conditionalization.

            The structural feature that allows Reflection to hold while conditionalization fails is the agent's certainty about her future credences. This forces her present credence in A to equal her future credence in A, regardless of the evidence. But the evidence is relevant, so conditionalization requires a change. Removing certainty: if the agent is only moderately confident about her future credences, then Reflection would allow her present credence in A to be a weighted average of the future credences she might have, and if one of those future credences is conditionalized, then it might work. But in this case, because she is certain, she is locked into ignoring the evidence.

            Defender of Reflection: they might disown this agent by invoking the proviso that the future self should be rational (or should be ideally rational). In the Reflection principle, van Fraassen intended that the future self is rational and has the same evidence. In this case, the future self is not rational because they do not conditionalize. So the proviso would be that Reflection only applies when the future self is rational. If they read the proviso narrowly (only that the future self is rational in the sense of having the same evidence and being coherent) then they can disallow this agent. But if they read it broadly (including updating by conditionalization) then they would require conditionalization for Reflection to apply, making it not a bare principle.

            However, in the bare form we set aside the proviso. The case costs them if they want Reflection to be a sufficient condition for diachronic coherence without assuming conditionalization. It shows that Reflection alone (without the rationality proviso) is too weak to prevent diachronic incoherence (as evidenced by the Dutch book).

            Alternatively, one might argue that the Dutch book strategy is the wrong way to diagnose diachronic irrationality. But that is a big debate.

            We now present the case formally.

            Times: t0 and t1.
            Propositions: 
               E: initial trial results are positive.
               A: drug is approved.

            Credences at t0: 
               C0(E) = 0.5
               C0(A | E) = 0.8
               C0(A | ~E) = 0.2
               C0(A) = C0(A|E)*C0(E) + C0(A|~E)*C0(~E) = 0.8*0.5 + 0.2*0.5 = 0.5

            And the agent is certain that at t1, C1(A) = 0.5.

            Now, for any proposition X, we must check Reflection.

            For A:
               The agent is certain that C1(A)=0.5, so C0(A | C1(A)=0.5) = C0(A) = 0.5 = 0.5. Holds.

            For E:
               The agent's future credence in E: 
                   If E occurs, then at t1 the agent learns E, so she will set C1(E)=1.
                   If ~E occurs, then she sets C1(E)=0.
               So at t0, she is not certain of the value of C1(E). She assigns:
                   C0(C1(E)=1) = C0(E) = 0.5
                   C0(C1(E)=0) = C0(~E) = 0.5
               Then for the value r=1: 
                   C0(E | C1(E)=1) = C0(E | E) = 1 = r.
               For r=0:
                   C0(E | C1(E)=0) = C0(E | ~E) = 0 = r.
               So holds.

            Similarly for any other proposition.

            Conditionalization fails at t1: 
               If E is learned, then C1(A) should be 0.8 but is 0.5.
               If ~E is learned, then C1(A) should be 0.2 but is 0.5.

            Dutch book:
               At t0:
                   Bookie sells to agent:
                      Bet1: conditional on E: agent pays $0.8; if E occurs, then bookie pays agent $1 if A, $0 otherwise.
                      Bet2: conditional on ~E: agent pays $0.2; if ~E occurs, then bookie pays agent $1 if A, $0 otherwise.

                   Total payment by agent at t0: $1.0.

               At t1:
                   Bookie buys from agent:
                      Bet3: pays agent $0.5 for a bet that pays $1 if A (offered regardless of whether E or ~E).

               Now, outcomes:

                   E and A: 
                      Agent receives from Bet1: $1 (because A and E)
                      Agent receives from bookie for Bet3: $0.5 (at t1)
                      Agent pays on Bet3: $1 (if A) -> so net from bets: 
                           Bet1: +1
                           Bet3: +0.5 (at t1) and -1 (if A) 
                           Total: +1 +0.5 -1 = +0.5
                      But she paid $1 at t0, so net: -1 +0.5 = -0.5.

                   E and ~A:
                      Bet1: pays $0 (since A false)
                      Bet3: she gets $0.5 and pays $0 -> +0.5
                      Total: -1 (t0) +0.5 (t1) = -0.5.

                   ~E and A:
                      Bet2: pays $1 (since A and ~E)
                      Bet3: she gets $0.5 and pays $1 -> +0.5 -1 = -0.5
                      Total: -1 (t0) + (-0.5) (from Bet3) +1 (from Bet2) = -0.5.

                   ~E and ~A:
                      Bet2: pays $0
                      Bet3: she gets $0.5 and pays $0 -> +0.5
                      Total: -1 +0.5 = -0.5.

            So always -0.5.

            Therefore, it works.

            The single structural feature: the agent's certainty about her future credences in the face of relevant evidence. If we remove that certainty, then Reflection would not force her current credence to match the future one, and she might avoid the Dutch book.

            Strongest reply for a defender of Reflection: they can invoke the proviso that the future self is rational. In this case, the future self is not rational because they fail to conditionalize. Thus, the Reflection principle (as van Fraassen intended) does not apply. This defense costs them if they want to use Reflection without any assumptions about the future self's rationality, but it saves the principle from counterexample. It means that Reflection is not a stand-alone diachronic constraint but depends on the future self being rational. This then raises the question: what is the standard of rationality for the future self? If it includes conditionalization, then we are back to assuming what we want. Alternatively, one might argue that the Dutch book is not a good test of diachronic rationality, perhaps because it involves making commitments that are not binding or because it requires the agent to be exploited by a bookie who knows their updating plan. But that is a more radical move.

            I think the result shows that without the rationality proviso, Reflection is too weak to capture diachronic coherence, and that the Dutch book strategy remains a powerful diagnostic tool.
