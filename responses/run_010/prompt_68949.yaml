  ## 4. Priest's Dialetheism

  Priest's idea: some sentences are both true and false. We accept contradictions, but try to contain them so that not everything follows (using a paraconsistent logic).

  In type theory, we have `False` as an uninhabited type. If we have a term of type `False`, then we can prove anything (by `False.elim`). So the system is explosive. To model dialetheism, we would need a paraconsistent logic, which is not the default in Lean or Coq.

