  ## 2. Kripke's Fixed-Point Construction

  Kripke's idea: we allow a truth predicate that can be partially defined. We start with an empty extension and anti-extension, and then build up by evaluating sentences until we reach a fixed point. Some sentences (like the Liar) end up without a truth value (gaps).

