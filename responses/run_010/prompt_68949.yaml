  ### Field
  - Expressible: we can have a type of sentences and a truth predicate without assuming excluded middle. We can define the Liar and then show that it cannot be determinate. This fits naturally in a constructive type theory.
  - The determinacy operator is just a predicate: `D(s) = true s ∨ false s`.
  - Revenge: we can model the hierarchy of determinacy operators by having a sequence of determinacy operators. But Field's system is complex and might require a transfinite hierarchy.

  ### Deflationary
  - Expressible: the Liar is untypable. This is the most straightforward.
  - Revenge: the revenge sentence is also untypable.

  ## Answers to Specific Questions

  - **Does the universe hierarchy do Tarski's job?** Yes, and it's essentially the same idea: a language cannot contain its own truth predicate.

  - **Is "true" just "inhabited"?** In the type theory we have, yes. But note: in `Prop`, we have proof irrelevance, so a proposition being true means it has a proof (but we don't care which). In `Type`, it means it is inhabited by some term. However, the philosophical positions often have a concept of truth that is not tied to provability (like in Kripke, Gupta, Field). In type theory, we can have a notion of truth that is classical (if we assume EM) or constructive. But in the standard systems, truth is provability. However, we can add classical axioms to get non-constructive truth. But even then, it is still tied to provability in the system: a true proposition is one that has a proof (which may be non-constructive). So there is no room for truth that outruns provability in the sense of being true but unprovable in the system? Actually, by Gödel, there are true sentences that are not provable. But in type theory, we can extend the system to prove more, so the notion of truth is relative to the system.

    However, in the Liar paradox, the issue is about defining truth within the same language. The type-theoretic notion of truth (inhabitation) is relative to a universe level. So for a given universe level, we can define truth in that level only in a higher level.

  - **Does dependent type theory have an analogue of a gap?** Yes, we can have a three-valued logic where a sentence can be neither true nor false. This is not a type error but a designated value. However, in the standard `Prop`, every proposition is either true or false (if we assume EM) or we don't assume EM and it might be neither if we don't have a proof or refutation. But in the constructive setting, a proposition might be neither proved nor refuted yet, but it is still considered to be either true or false classically? In Kripke's gap, it is a third value, so we explicitly model it.

  - **For positions that fail to translate:**
    - Priest's dialetheism fails because our type theory is explosive. We can either:
