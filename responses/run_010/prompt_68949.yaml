  - The gap is represented as a third truth value, which is not a type error but a genuine value. So we have a gap.
  - Revenge: the strengthened Liar (about being in the gap) is expressible only if we add a gap predicate, which then requires a new fixed point. This is inherent to Kripke's approach and can be modeled in type theory by iterating the construction.

