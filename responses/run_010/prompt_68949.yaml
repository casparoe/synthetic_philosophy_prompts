  I'm not a philosopher, I'm the person who has to keep our Lean proofs compiling. I do formal verification of a compiler's semantics — Lean 4 mostly, some Coq — and my grasp of the truth-paradox literature is about one reading of the SEP entry on the Liar, half-followed, which I've revisited off and on ever since. A colleague who's finishing a philosophy PhD told me at our offsite that everything I'd need to understand that debate is already sitting in my head in the form of universe levels and Girard's paradox, and I want to check whether he's actually right or just flattering himself.

  So: take the main live positions on the Liar and restate each one as precisely as you can in the vocabulary I actually use — types and terms, propositions-as-types, `Prop` vs `Type`, universe levels and universe polymorphism, impredicativity, totality, whether something is decidable or merely semi-decidable, inductive vs coinductive definitions, least and greatest fixed points, consistency as "there is no closed term of type `False`". The positions I want handled: Tarski's hierarchy of languages and the undefinability of truth; Kripke's fixed-point construction with truth-value gaps and the minimal fixed point; Gupta's revision theory, where you iterate a candidate extension of the truth predicate and read off which sentences stabilize; Priest's dialetheism, i.e. some sentences are both true and false; Field's paracomplete route, where you restrict excluded middle for sentences containing the truth predicate and bolt on a determinacy operator; and the more deflationary line that the Liar sentence is simply defective and doesn't express a proposition at all. Where it helps, also say what the revenge problem looks like for each — the upgraded sentence that says it isn't true and isn't determinately untrue either, that kind of thing.

  Then the part I actually care about: the residue report, position by position. Which claims come across intact, which only come across if you bend a type-theoretic notion out of its usual shape (and say exactly how you bent it), and which have no expression in my framework whatsoever. And be honest about the direction of fit — I don't want you to declare dialetheism incoherent just because `False → anything` is a one line proof in my system; thats assuming the conclusion instead of translating it. Same with calling the Liar "untypable" and treating that as if it settled the philosophy. Flag every place you were tempted to do that.

  A few specific things I want answered: does the universe hierarchy actually do Tarski's job, or is the resemblance skin deep — one is about a language defining its own truth, the other is about keeping a proof system from proving everything? Is "true" in my framework just "inhabited", and if so is there any room left for a notion of truth that outruns provability, which is what all these people seem to be reaching for? Does dependent type theory have any analogue of a sentence that's neither true nor false but not thereby meaningless — a genuine gap rather than a type error? And for each position that fails to translate, give me your read on which of two things is going on: my vocabulary is missing something real, or the position never was as coherent as it sounded. I've got maybe thirty minutes of attention for this, so prioritize the residue over the exegesis.
