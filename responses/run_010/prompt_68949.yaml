  ## 5. Field's Paracomplete Approach

  Field's idea: we restrict the law of excluded middle for sentences containing the truth predicate. We add a determinacy operator `D` such that `D(P)` means that `P` is true or false (so we can use excluded middle for `D(P)`). The Liar sentence is not determinate, so it is neither true nor false, and excluded middle fails for it.

