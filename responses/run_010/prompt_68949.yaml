      liar : Prop := ¬ True liar

  which is not well-founded. Without recursion, we cannot form it. So we can say that the Liar is not a valid proposition.

  Residue:
  - This is the most straightforward in type theory: the Liar is untypable. The revenge problem: a sentence that says "I am not expressible as a proposition"? But then it is expressed? This is similar to the paradox of the least indefinable ordinal. We can avoid it by noting that the revenge sentence itself is untypable.

  ## Residue Report

  Now, we summarize the residue for each position.

  ### Tarski
  - Comes across intact: the universe hierarchy blocks the Liar by making the truth predicate for level `i` live in level `i+1`.
  - Revenge: blocked by the same hierarchy.
