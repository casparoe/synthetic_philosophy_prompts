  We are going to translate several philosophical positions on the Liar paradox into the framework of dependent type theory (as in Lean or Coq). The key concepts we have are:

  - Types and terms: propositions are types, and a proof of a proposition is a term of that type.
  - `Prop` vs `Type`: in Lean, `Prop` is the universe of propositions (impredicative by default) and `Type u` are universes of data types (with `u` being a universe level).
  - Universe levels and polymorphism: to avoid paradoxes (like Girard's paradox, which is a type-theoretic version of Russell's paradox), we have a hierarchy of universes: `Type 0`, `Type 1`, etc.
  - Impredicativity: the ability to define a type by quantifying over a universe that includes the type being defined. In Lean, `Prop` is impredicative (so we can form `∀ P: Prop, P` which is in `Prop`), but `Type` universes are predicative (so `∀ T: Type i, T` would be in `Type (i+1)`).
  - Totality: functions are total, and every term has a normal form (in a consistent system).
  - Decidability: a proposition is decidable if we can prove `P ∨ ¬P` (and in some cases we have an algorithm). Semi-decidability: for some propositions we might have a procedure that halts if the proposition is true but may not halt if false (like the halting problem).
  - Inductive and coinductive definitions: least and greatest fixed points of monotone operators.
  - Consistency: the absence of a closed term of type `False`.

  We are to restate the following positions:

  1. Tarski's hierarchy of languages and undefinability of truth.
  2. Kripke's fixed-point construction (with truth gaps, minimal fixed point).
  3. Gupta's revision theory (iterating a candidate extension until stabilization).
  4. Priest's dialetheism (some sentences are both true and false).
  5. Field's paracomplete approach (restrict excluded middle, add a determinacy operator).
  6. Deflationary view (Liar is defective, doesn't express a proposition).

  Then, we will analyze the "residue": which parts of the positions can be naturally expressed, which require bending the type theory, and which are inexpressible. We will also address:

  - Does the universe hierarchy do Tarski's job or is the resemblance superficial?
  - Is "true" just "inhabited" in this framework? Can we have truth that outruns provability?
  - Is there an analogue of a truth gap (neither true nor false) that isn't a type error?
  - For each position that fails to translate, we'll assess whether the type theory is missing something or the position is inherently incoherent.

  We will avoid assuming that the type theory "solves" the paradox by declaring the Liar untypable. Instead, we'll try to model the Liar in the type theory if possible.

  ## 1. Tarski's Hierarchy

  Tarski's idea: a language cannot define its own truth predicate. We need a hierarchy: a base language L0, then a metalanguage L1 that can talk about truth in L0, then L2 for truth in L1, etc.

  In type theory, the universe hierarchy is similar. We cannot have a type of all types (because of Girard's paradox). Instead, we have `Type u` for each level `u`. We can define "truth" for a lower universe in a higher one.

