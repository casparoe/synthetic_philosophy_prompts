  The Liar sentence is defective: it doesn't express a proposition. Therefore, it is not in the domain of the truth predicate.

  In type theory, we can say that the Liar sentence is not well-typed. For example, in Tarski's hierarchy, it would be untypable because it tries to use a truth predicate of the same level.

