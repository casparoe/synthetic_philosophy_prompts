answer: |-
  ## HOUSE OF DOMINANCE: OFFICIAL CONTESTANT RULEBOOK (Season 7 Edition)

  **1. PREMISE & PURPOSE:**  
  Contestants ("Strategies") reside in the House of Dominance, competing to avoid weekly Audience Eviction. The Audience ("The Other Player") represents diverse tastes evaluated across all possible weekly voting configurations ("Configurations"). Survival hinges solely on demonstrating universal resilience against Audience preference shifts. The Production Company ("The Game") is impartial, bound by mathematical inevitability. Drama is organic.

  **2. EVICTION PROCEDURE (STRICT CLAUSE):**  
      *   **2.1 Grounds for Eviction:** A Contestant (C) faces mandatory eviction if, and only if, another *individual* Contestant still residing in the House, OR a *blended appeal proposal* ("Mix") generated solely from current non-evicted Contestants, demonstrates superior Audience approval.
      *   **2.2 Superiority Requirement:** To demonstrate superiority, an individual or Mix *must* receive strictly greater approval than C from the Audience *in every single possible Configuration*, simultaneously. Ties do NOT constitute superiority. ("Beats them everywhere, no ties.")
      *   **2.3 Blend Specification:** A Blend is defined as a specific, fixed proportional allocation of focus/resources among two or more current non-evicted Contestants (e.g., "50% Focus on Contestant A, 50% Focus on Contestant B"). The Blend's approval score in any Configuration is the weighted average of its constituent Contestants' scores.
      *   **2.4 Eviction Authority:** Upon identification of a Contestant satisfying Clause 2.1, Producers will execute immediate eviction. Evictions occur weekly until only supremely resilient Contestants remain.

  **3. PRODUCER DISCRETION (WEAK CLAUSE):**  
      *   **3.1 At-Will Removal:** Producers reserve the right, at their sole discretion, to evict a Contestant deemed "Marginally Redundant." This applies if another individual Contestant or Blend receives approval scores *at least as high* as the target Contestant in *every* Configuration, and achieves *strictly higher* approval in *at least one* Configuration. ("Never worse, sometimes better.")
      *   **3.2 Order Sensitivity Warning:** Evictions performed under Clause 3.1 may alter the sequence and final composition of the House compared to evictions performed solely under Clause 2.1. The Production Company accepts no liability for perceived instability or the removal of viable pairings resulting from discretionary eviction order.

  **4. FINALE & RATIONALIZATION:**  
      *   **4.1 Finalist Status:** Contestants surviving all possible elimination rounds (under the active clauses) achieve Finalist status.
      *   **4.2 Rationalization Mandate:** All Finalists are required to visibly bear the mark of their resilience. The term "RATIONALIZABLE" must be tattooed in a minimum 12pt font on a prominent limb or torso location within 48 hours of the finale airing. This signifies their demonstrable compatibility with all conceivable Audience Configurations under the rules of the Game.

  **GLOSSARY:**

  *   **Audience (The Other Player):** The collective entity whose shifting preferences, evaluated across all possible scenarios (Configurations), determine survival. Not a monolith.
  *   **Configuration:** A specific, complete set of criteria the Audience might use to evaluate Contestants in a given week. Think "Week 1: Focus on Social Game; Week 2: Focus on Challenge Prowess," etc. *All* possible Configurations are considered simultaneously for eviction decisions.
  *   **Blend (Mixed Strategy Proposal):** A specific, fixed recipe combining the appeal of current non-evicted Contestants. E.g., "Present 60% of A's traits with 40% of B's traits." Its score is the calculated average.
  *   **Superiority (Strictly Dominates):** When an individual or Blend beats another Contestant *every single time*, no matter what the Audience focuses on (Configuration). No ties.
  *   **Marginally Redundant (Weakly Dominated):** When an individual or Blend is *never worse* than the target Contestant and is *definitely better* in at least one Configuration. Subject to Producer discretion (Clause 3).
  *   **Rationalizable:** (Adj.) The ultimate state of Audience resilience. Achieved only by Finalists. Signifies withstanding every conceivable elimination challenge posed by the Game's rules. Requires tattoo.

  **FREQUENTLY ASKED QUESTIONS (FAQ):**

  *   **Q: How is "every single possible Configuration" defined? Does Production invent them?**  
      A: Configurations represent the full, finite spectrum of preference structures the Audience *could* exhibit based on inherent traits of the Strategies (Contestants) and the Game structure. They are not "invented" weekly but are inherent possibilities considered exhaustively by our proprietary Eviction Calculation System (ECS). Clause 2.2 operates purely on logical inevitability.

  *   **Q: Clause 2 seems unfair! How can a Blend evict someone when no single person beats them?**  
      A: The rules reflect holistic Audience appeal. A Blend represents a coherent alternative approach constructed *only* from existing options. If this alternative reliably outperforms a Contestant under *all* potential Audience moods (Configurations), that Contestant's unique value proposition is mathematically eliminated. See Sidebar: "Last Week's Calculated Farewell."

  *   **Q: Clause 3 sounds messy. Why have it? Doesn't it just cause chaos?**  
      A: Clause 3 allows Production to streamline the game by removing contestants who offer no unique advantage *in the current House composition*, even if they aren't strictly inferior in *all* ways. It accelerates the narrative while adhering to the principle of non-superfluousness.

  *   **Q: Doesn't the order of evictions, especially using Clause 3, change who could win? That seems biased!**  
      A: **(Official PR Statement):** The Production Company categorically assures viewers and contestants that the *core eviction logic* (Clause 2) is fundamentally order-independent. The final set of Rationalizable contestants is a fixed property of the initial Game setup, impervious to eviction sequence when adhering strictly to Clause 2. Discretionary actions (Clause 3) are clearly marked as such and represent optional narrative tools, not a reflection on the Game's inherent mathematical fairness under Clause 2.

  *   **Q: Is "Nobody's Favorite" the kiss of death?**  
      A: Legal has advised us that, under the strict definitions of this competition, the property colloquially known as "Nobody's Favorite" aligns precisely with the formal grounds for eviction under Clause 2.1. Contestants lacking this property may still be vulnerable under Clause 3.1.

  *   **Q: Why the tattoo?**  
      A: Rationalization is permanent. The tattoo is a binding commitment to the state of ultimate Audience compatibility, a badge of honor, and excellent branding. Contestants agree to this in Schedule 7b, Section "Post-Game Obligations."

  **SIDEBAR: LAST WEEK'S CALCULATED FAREWELL**

  > Week 6 saw the surprising eviction of "The Calculated Blend" (50% Alex, 50% Blake), despite both Alex and Blake surviving individually. Analysis by the ECS confirmed: Against Configuration X (Focus: Social Alliances), Alex scored 3, Blake scored 0, Blend scored 1.5, Chris scored 2. Against Configuration Y (Focus: Solo Challenges), Alex scored 0, Blake scored 3, Blend scored 1.5, Chris scored 2. Critically, while neither Alex nor Blake individually beat Chris everywhere (Alex loses in Y, Blake loses in X), *and* the Blend (1.5) loses to Chris (2) in *both* X and Y, satisfying Clause 2.1 (a Mix beats the Blend everywhere). Alex and Blake remain as neither is beaten by Chris individually everywhere nor by any viable Mix excluding them. The Blend was mathematically evicted. #HouseMath #Shook #BlendsBeware

  **FORUM HOT TAKE (Re: Clause 3):**
  >*"Absolute BULL**** they used the 'Marginally Redundant' clause to boot Kai & Linh last night! Yeah, the Jaxson/Kai/Linh trio vote was messy, but Kai & Linh were SOLID together against the singles vote! Production just wanted drama & now we're stuck with Jaxson's toxic vibes til finale. #Rigged #BringBackKaiLinh #Clause3IsTheVillain"*
