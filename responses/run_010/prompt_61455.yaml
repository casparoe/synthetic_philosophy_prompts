answer: |-
  ## Protocol: Aris Thorne

  **1. Final Instructions**

  > Dr. Aris Thorne, gaunt against hospital linen, dictates his protocol to Dr. Lena Voss. His voice rasps, precise as his statistical models. Six fragments: a calibration constant (π truncated oddly), a Bangkok alley name ("Soi Dog"), an obscure date (Oct 17, 1987), a tomb inscription ("Beloved Mutt"), a childhood nickname ("Stinky"), sealed envelope contents (a single dried orchid petal). Five trusted recipients, geographically scattered, no mutual contact. Thorne alone knows the key: the fragments form his first dog’s funeral details. "Assemble the proof, Lena," he whispers. "Not faith. Data." Voss nods, her own quiet yearning for *more* buried under procedural notes. Pancreatic cancer claims him three days later.

  **2. The Reading**

  > Eight months on, Voss watches video from Oslo. Medium Ingrid Bjornstad, eyes closed, sketches symbols. "Constant... point one four one five nine... alley... animal path... Dog? Date... fall... seventeenth... inscription... 'Beloved Mutt'... nickname... unpleasant smell... Stinky?" She frowns. "The sealed thing... fragile... like a leaf, but not... a flower part? Broken petal." Five direct hits. The sixth? Thorne’s key required the orchid petal *plus* the inscription to signify the dog’s grave. Bjornstad produced both. Voss’s pen trembles. It *worked*. Protocol integrity feels intact. Hope, sharp and dangerous, pierces her professional armor.

  **3. The Leak**

  > Voss audits relentlessly. Recipient logs, comms traffic, backgrounds. The orchid petal fragment was held by Professor Chen in Taipei. Chen swore he’d never been told its nature or context. But Voss finds an old email thread: Thorne, years before his diagnosis, joking with Chen about preserving a "ridiculous orchid" from a mutual colleague’s retirement, attaching a photo. Chen had forgotten. The sealed envelope’s *existence* was known, its *specific content* seemingly protected. But the *category* – a dried flower part – wasn’t. Sensory leakage? Cryptomnesia? Bjornstad accessed Chen’s latent memory of the orchid, not Thorne’s secret. Voss slumps at her desk. The structure held, but a forgotten brick crumbled.

  **4. The Chamber**

  > Voss rebuilds. Three automatists: Ottawa, Perth, Lisbon. Isolated rooms, monitored feeds, no external contact. Each receives one unique, meaningless fragment via sealed, randomized delivery: "Oct 17, 1987"; "Beloved Mutt"; "Stinky". They enter trance states, automatic writing commencing. Ottawa scrawls "Soi Dog". Perth produces "3.14159". Lisbon writes "orchid petal - fragile". Simultaneously, independently. No one held more than one piece. No living mind possessed the whole sequence. Voss assembles the transcripts: *Soi Dog, Oct 17, 1987, Beloved Mutt, Stinky, 3.14159, orchid petal*. Thorne’s key fits perfectly. The protocol, stripped of social vectors, delivers. It’s flawless. Clinically clean. Undeniably anomalous.

  **5. The Silence**

  > Voss stares at the six assembled fragments. Her assistant, Eli, breathes, "It’s him. It *has* to be." Voss touches the printout. "It’s data, Eli. Verified, impossible data. But where’s Aris?" She recalls Bjornstad’s report: *"Not a voice. Like... receiving a fax. Impersonal."* The fragments cohere only through Thorne’s pre-death key. No warmth, no memory of shared equations, no wry humor about mortality – just coordinates and labels. "We proved information transfer survived the biological endpoint," Voss says, the Sidgwickian void opening before her. "But did *he*? Or did we just map the echo chamber of a universe that keeps receipts?" The fragments offer nothing but their own cold validation. The trap is sprung; the lab proved its point, and found only dust.
