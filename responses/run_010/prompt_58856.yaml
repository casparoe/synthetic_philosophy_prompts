  Okay, let me tackle this user's query. They're organizing a workshop with philosophers, neuroscientists, and AI safety researchers. The main question is whether the brain is literally a computer. The user wants desiderata to frame the discussion, avoiding pre-settling disputes. 

  First, I need to unpack their eight proposed criteria. They want to know which are essential, which are camp-biased, and if any are redundant. The user suspects tensions between (ii) independence from interpretation and (iii) counterfactual robustness. Also, (vii) about system boundaries might conflict. 

  Starting with (i): non-universality. A brick shouldn't compute everything. That's non-negotiable because without it, computation becomes trivial. But how strict should failure be? Too strict, and we might exclude messy biological systems. Too lenient, and bricks compute. Balance is key.

  Next, (ii): interpretation-independence. The user wants an objective claim about brains, not just our descriptions. But all computation accounts involve some observer choices. Maybe reframing this as minimal dependence would help. Still, it's core to their goal.

  For (iii): counterfactual robustness. Real computations should handle varied inputs. Non-negotiable for explanatory power. But this requires specifying interventions, which might involve interpretation. Here's the tension with (ii).

  (vi) and (v) seem solid. Distinguishing real vs. convenient computation is crucial. Empirically assessable is necessary too. Gradability (iv) is negotiable; useful for edge cases but not essential. (vii) on system boundaries is tricky - where do we draw the line? Probably non-negotiable but problematic. (viii) about explanatory relevance is important but secondary.

  Now, conflicts: (ii) and (iii) clash because counterfactuals need intervention specs, which aren't purely intrinsic. (vii) worsens this by needing boundary decisions. Sacrificing strict independence might be necessary, accepting some observer-relativity while keeping objectivity.

  Assessing theories: mechanistic views handle (i,iii,viii) well but struggle with (ii,vi). Mapping accounts satisfy (i,ii,iii) but need observer choices. Semantic views add unnecessary baggage. Pancomputationalism fails (i,vi,viii).

  If sacrificing one criterion, (iv) gradability is the safest. For joint unsatisfiability, allowing minimal observer-relativity might resolve it. (iv) and (viii) are weakest if needed.

  The user's hidden need might be facilitating productive debate without predefined outcomes. Highlighting tensions helps them frame discussions. They might also want to identify which criteria different camps prioritize, aiding negotiation.
answer: |-
  Here is a rigorous set of desiderata for your framing document, designed to force substantive engagement while exposing fault lines. I've evaluated your candidates, identified tensions, and scored major accounts against the core criteria.

  ### Core Desiderata for "Physical System X Computes Function F"
  *(Non-negotiable = **NN**; Camp-Commitment = **CC**; Constrains Computation/Usability indicated)*

  1.  **Non-Triviality (NN - Constrains Computation)**  
      *Requirement:* Some physically possible systems must fail to compute some functions.  
      *Motivation:* If a brick computes every possible function (e.g., by trivial mapping of all inputs to one output, or chaotic state transitions matching any formal evolution), the claim "brain computes" conveys no distinctive information. *Case:* A rock heated by the sun cannot be shown *not* to compute the weather simulation it coincidentally matches for 5 seconds.  
      *(Your i - Genuine & NN)*

  2.  **Implementation Independence (NN/CC Hybrid - Constrains Both)**  
      *Requirement:* Whether X computes F must depend primarily on X's intrinsic physical properties and dynamics, not on an external agent's *choice* of interpretation mapping.  
      *Motivation:* Brains existed before humans devised formalisms. If computation requires a human "programmer" to assign meaning, the claim "brains compute" becomes anthropocentric, not a discovery about brains. *Case:* A falling tree computes only if someone *chooses* to map impact sounds to binary digits.  
      *(Your ii - Genuine but nuanced. Strict independence is likely impossible; minimal dependence is NN. The "no choice" wording is strong CC for realists)*

  3.  **Counterfactual Robustness (NN - Constrains Computation)**  
      *Requirement:* For X to compute F, it must be true that *if* relevant inputs (specified physically) had been different (within a defined range), X would have produced the physically-specified output corresponding to F(input).  
      *Motivation:* Accidental correlation ≠ computation. A system must support *interventions*. *Case:* A broken calculator displaying "6" whenever "2+2" is pressed doesn't compute addition, even if it coincidentally got it right once.  
      *(Your iii - Genuine & NN)*

  4.  **Distinction from Description (NN - Constrains Usability)**  
      *Requirement:* The account must differentiate a system genuinely computing F from a system merely being *conveniently describable* using computational language.  
      *Motivation:* Computational models are powerful heuristics, but the workshop question concerns ontology. *Case:* Describing water flow through pipes as "computing" fluid dynamics is useful modeling, but doesn't imply the pipe system intrinsically implements that computation.  
      *(Your vi - Genuine & NN)*

  5.  **Empirical Constrainability (NN - Constrains Usability)**  
      *Requirement:* It must be conceivable that specific empirical evidence (beyond mere functional similarity) could confirm or refute whether X computes a specific F.  
      *Motivation:* Without this, the claim is untestable metaphysics. *Case:* Finding a specific, stable physical structure implementing a NAND gate differs from noting that neural firing patterns vaguely resemble a logic circuit.  
      *(Your v - Genuine & NN)*

  6.  **Explanatory Relevance (CC/NN Hybrid - Constrains Usability)**  
      *Requirement:* The computational description should not be epiphenomenal; it should play a role in explaining X's behavior/capacities.  
      *Motivation:* If computation is present but irrelevant to how the system works (e.g., a shadow's shape), calling brains "computers" is vacuous. *Case:* Explaining a computer's output via its program execution vs. explaining it via silicon chemistry alone.  
      *(Your viii - Genuine, but strict NN status depends on views of explanation. CC for functionalists)*

  7.  **Boundary Sensitivity (CC - Constrains Usability)**  
      *Requirement:* The account must provide principled (non-arbitrary) grounds for delimiting the physical system X that is the candidate computer.  
      *Motivation:* Computational claims shift radically depending on boundaries. *Case:* Does "the neuron" compute, or only networks? Is the glial scaffold included? Does the spinal cord compute independently?  
      *(Your vii - Genuine but primarily CC for mechanists/embedded cognition views. NN only if boundaries are critical to avoiding triviality)*

  8.  **Gradability (CC - Constrains Usability)**  
      *Requirement:* The account should accommodate degrees of implementation (e.g., "implements F partially/noisily").  
      *Motivation:* Biological systems are messy. Uploads/duplicates may be imperfect. *Case:* A damaged circuit or a low-fidelity brain simulation might implement an algorithm only approximately.  
      *(Your iv - Genuine but strongly CC for those prioritizing biological realism. Not strictly NN for defining core computation)*

  ### Key Tensions & Conflicts
  *   **The Crucial Conflict (ii vs. iii):** **Implementation Independence (ii)** demands computation be intrinsic. **Counterfactual Robustness (iii)** demands specifying *which* inputs/outputs/counterfactuals matter. Specification requires *selecting* a mapping from physical states to formal symbols/states. **This selection inherently involves an external perspective.** A purely intrinsic account (strict ii) struggles to define non-trivial computation (i) or counterfactuals (iii). Relaxing (ii) to allow minimal observer-relative mapping (e.g., identifying "input/output" states based on causal role) sacrifices strict objectivity but enables robust computation (iii, i, v). **What Gives:** Strict independence (ii) must be relaxed. The resulting account gains explanatory power (viii) and empirical traction (v) but loses the pure "mind-independence" some philosophers desire. Computation becomes a *causal-dispositional property* relative to a chosen abstraction, not a property like mass.
  *   **Boundary Problem (vii):** Defining the system boundary is often entangled with the mapping choice (needed for iii), creating another locus for observer-relativity. Resolving (vii) often depends on explanatory goals (viii), not pure physics.

  ### Contender Scorecard (Against NN Criteria: i, iii, iv, v, vi)
  *   **Mechanistic (Rule-Governed State Manipulation):**  
      Excels at i (rules define specific functions), iii (mechanism enforces counterfactuals), v (mechanism is observable), vi (distinct from description). Struggles with ii (identifying "states" and "rules" often requires interpretation) and vii (boundaries can be fuzzy in biology). Strong on viii (explanatory).

  *   **Formal Mapping + Counterfactuals (e.g., Fodor, early Putnam):**  
      Excels at i (mapping constrains function), iii (counterfactuals built-in), vi (clear distinction if mapping is non-arbitrary). Struggles with ii (mapping choice is observer-dependent), v (verifying all counterfactuals is impossible), vii (boundaries affect mapping). viii depends on mapping's causal relevance.

  *   **Semantic/Intentional (e.g., Searle, Millikan):**  
      Ties computation to content/function. May satisfy i, vi, viii. Fails iii (semantics doesn't guarantee counterfactual robustness), v (content is hard to pin down empirically), ii (interpretation-dependence is inherent). Often violates v (empirical assessability). Weakest contender here.

  *   **Pancomputationalism (Everything Computes):**  
      Deliberately violates i (triviality) and vi (no distinction). Fails v (no empirical content), viii (explanatorily idle). Only useful as a reductio against weak criteria.

  ### Where the List Might Be Wrong & Sacrifices
  *   **Most Likely Weakness:** **Gradability (iv)**. While useful for biological realism, a core *definition* of computation might reasonably be all-or-nothing. Imperfect implementation could be seen as failing to compute the *target* F perfectly, rather than requiring computation itself to be graded. Sacrificing (iv) simplifies the core definition without crippling discussion of partial uploads (which can be framed as implementing a *different*, approximate function).
  *   **Resolving Joint Unsatisfiability:** If shown that an account can ground a *non-arbitrary, intrinsic* notion of "input/output state" and "state transition type" (e.g., via fundamental physics or causal topology), then (ii) and (iii) could coexist without observer-relativity. Dynamical systems theory or information theory *might* offer paths, but success is debatable.
  *   **Candidate for Striking:** **Boundary Sensitivity (vii)** is doing the *least essential work* for the core question. While critical for application, the core desiderata (i-vi,viii) can be discussed for a *given* candidate system. Disputes about boundaries become an *application* of the criteria, not a prerequisite for defining computation. Strike (vii) to avoid premature entanglement.

  **Conclusion for Your Workshop:** Frame the core challenge as reconciling the need for **objective counterfactual structure (iii)** with the apparent need for **some level of abstraction/description (relaxed ii)** to specify *what* is being computed non-trivially (i, vi). The tension between these is where the real philosophical and scientific action lies. The list forces participants to confront whether computation is an *intrinsic physical property* or a *perspective-dependent causal capacity*, and what level of abstraction is justified in neuroscience. This is the load-bearing beam. Good luck!
