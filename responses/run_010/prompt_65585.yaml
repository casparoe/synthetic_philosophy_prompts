  The contingency question needs to address whether engineered pain-indifference spares suffering and implications for pain relief ethics and animals. The follow-up should challenge the seeming counterintuitive implication for animals lacking this attitude.

  For representational differences, I'll contrast her attitude-based view with commands-to-protect or badness-representation accounts. The follow-up should probe empirical separability since functional overlap is tricky.

  On disconnected affect, I'll question whether asymbolics might still have unease that just doesn't connect to action. The follow-up should target her evidence against this, given her functionalist stance.

  The falsifiability question must specify observable evidence that would undermine her view - perhaps preserved affect without sensation or vice versa.

  After these, I'll add an unnumbered confidence statement: high confidence overall but least sure about the disconnected affect question because introspection reports in asymbolia are notoriously hard to interpret.

