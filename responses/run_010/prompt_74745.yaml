prompt: |-
  So — I've somehow been tapped to give the graduation address at my own college this summer. It isn't a fancy place: mostly nursing, primary teaching, civil engineering, and about fifteen maths students a year who've been reassured it counts as a maths degree. Room will be maybe 400, nearly all of them families, plus the engineering and computing faculty and three colleagues from my department who will absolutely catch everything I do.

  I'm a constructivist. Not the sort who thinks it's a bit quirky, the sort who's spent twenty years refusing to accept a proof that only shows something can't fail to exist. And I've decided I want to give the whole address in that spirit rather than do the usual thing where you mention your odd specialism for ninety seconds and then read out a generic speech about the future.

  The trouble is that basically every stock line in a graduation speech is, if you actually look at it, an unearned existence claim. There's a place out there for every one of you. You'll find your way. The world needs what you've got. Nobody has a proof of any of these — they're asserted because it'd be cruel not to. Same with the 'either you'll change the world or the world will change you, and honestly both are fine' business: that's an excluded middle doing the emotional work, and if I can't say which of the two I've got no business saying it at all. And this is a town where the biggest employer shut four years ago and a third of the students are the first in their family to get here, so those lines aren't just unsupported, they're close to an insult.

  Can you write the speech? Six to eight minutes said out loud. The rules I'm holding myself to:

  - I only promise what I can build or point at. Any claim I make about their futures has to be one I could hand them a method for.
  - I do want to say the honest weak version instead of the comforting strong one — that it isn't true that they'll come to nothing is something I can stand behind, whereas 'you'll all flourish' isn't — but the speech should own the fact that this is a smaller promise, not slip it in disguised as the bigger one. Someone's got to notice that I gave them less than they expected and that I did it on purpose.
  - Never name the doctrine. No Brouwer, no intuitionism, no 'constructive mathematics', no footnote-y asides. My three colleagues should recognise what I'm up to; a nurse's gran should just hear a good speech.
  - Near the end I want to actually hand them something constructed rather than promised — a specific, doable thing, not a metaphor for one.
  - One joke that works on both levels at once.
  - No quotations from famous people, living or dead. I can't fact-check from a podium and I'd rather say nothing I have to attribute.

  It can't come out as a lecture or a sermon or a lecture wearing a sermon's coat. Funny and warm in places. British English please, and write it the way I'd say it — with the pauses marked and the bits I'd ad-lib flagged — rather than as an essay.
reasoning: |-
  Okay, the user is a constructivist mathematician who's been asked to give a graduation speech. They want to avoid the usual platitudes that make unproven existence claims about the future. Instead, they want to deliver a speech that aligns with their philosophical stance—only promising what can be constructed or demonstrated, without naming the doctrine. 

  First, I need to understand their constraints. The audience is mixed: families, faculty from engineering and computing, and three colleagues who'll catch the nuances. The speech must be 6-8 minutes, in British English, with pauses and ad-libs marked. No famous quotes, no jargon, but a joke that works on two levels. 

  The core challenge is replacing "you'll all succeed" with honest, weaker promises backed by actionable methods. For example, instead of "there's a place for everyone," offer concrete strategies for resilience or community-building. The user also wants to hand graduates something tangible at the end—not a metaphor. 

  I notice the user is sensitive to the local context: a town with high unemployment, many first-gen students. Generic optimism would feel insulting. The speech must acknowledge hardship while avoiding despair. The "smaller promise" ethos needs to be explicit, not sneaky. 

  For structure: start with relatable humor (punching holes in clichés), transition to constructive alternatives, then the tangible "gift" (the card idea feels right—simple, universal, buildable). The joke about "not proving a negative" works doubly: mathematicians laugh at the logic, everyone else at the self-deprecation. 

  Warmth is crucial. The ad-libs ("look, I know...") and folksy metaphors ("bricks and mortar") should ground the abstract philosophy. Ending with "I can't prove you won't fail, but I can prove you're not failures" ties it together. 

  Biggest risk: sounding clinical. Counter by leaning into British understatement ("modest, sturdy things") and punching up the communal hope in the finale. The three colleagues should nod at the intuitionism; gran should just feel reassured.
answer: |-
  ## (Clears throat. Sound of shuffling papers. Pause.)  

  Right. Well. Congratulations. Seriously. To every single one of you in those slightly-too-big robes. Nurses, teachers, engineers, the valiant maths contingent holding down the fort... you did it. You built this. And I know precisely what *that* feels like. Not the graduating bit – the building bit.  

  *(Leans in slightly, conspiratorial tone)*  
  See, I know the script. I know what you’re expecting. Big, shiny promises about the future. Guarantees. The whole “your place is waiting out there!” routine. *(Shakes head slightly)* Trouble is… I looked. I really looked. And I couldn’t find the proof. I couldn’t *build* that guarantee. That place? It might be there, sure. But it might also… not be. Not yet. Or it might look nothing like the brochure. And telling you otherwise? Feels a bit like handing you a map to a city I’ve never visited. Bit rude, really.  

  *(Paces a step, gestures vaguely)*  
  So, what *can* I promise? Things I can actually put my hands on. Or point you towards building yourself.  

  First promise: **You won’t come to nothing.** Look around. *(Gestures to audience)* Look at the people who got you here. The sheer effort in this room – yours, theirs. That effort? That’s real. You *built* this degree. Brick by brick. Lecture by bleary-eyed lecture, placement by challenging placement. You can build *more*. Doesn’t mean it’ll be easy, or glamorous, or exactly what you pictured while cramming for that fluid dynamics exam. But *nothing*? Logically impossible. You’ve already built *something*. You’ve got the tools.  

  Second promise: **You can build resilience.** Not the fluffy “bounce back” kind. The nuts-and-bolts kind. You know how? Because you’ve already done it. Remember that module you were sure you’d fail? That patient, that pupil, that code that just *would not* compile? That feeling the night before a deadline when the library coffee machine broke? *(Small chuckle from crowd)* You didn’t vanish. You dug in. You asked for help – maybe grudgingly. You found a way. *That’s* the method: Remember what worked. Remember you did it *before*. Keep that toolkit handy – the stubbornness, the coffee source, the friend who proofreads. That’s buildable. That’s yours.  

  Third promise: **You can build connection.** Right here. Today. Look at the person next to you. *(Pause for people to look)* Go on. Bit awkward? Fine. But that person? They sweated through exams in the same slightly-too-warm halls. They know the specific flavour of canteen chips on a Tuesday. They are part of the structure *you* built. Hold onto them. Not vaguely. Specifically. Send the text. Make the call. Meet up when the first job feels overwhelming, or the tenth application gets rejected. Build *this* network. It’s real. It’s concrete. It’s mortar between your bricks.  

  *(Tone shifts, more grounded)*  
  Now, about that future everyone’s buzzing about. They say, “You’ll change the world, or the world will change you! Either’s fine!” Sounds neat, tidy. Two boxes. Tick one. But… *(shrugs, palms up)* ...what if it’s messy? What if you change *bits* of the world – one careful lesson plan, one safe discharge, one sturdy bridge, one elegant bit of code – *while* the world buffets you about? What if the ‘big change’ isn’t a thunderclap, but a thousand small adjustments? I can’t hand you a method for guaranteeing *which* box you tick. But I *can* hand you a method for navigating the mess: **Build the next small, true thing.**  

  Focus on the step you *can* take. The problem you *can* solve today. The person you *can* help right now. Don’t wait for the grand plan to materialise out of thin air. Build the foundations. Brick. By. Brick.  

  **(Pulls a small stack of blank index cards from pocket. Holds them up.)**  

  Which brings me to what I actually *can* hand you. No map. No grand guarantee. But this? *(Taps cards)* This is a start.  

  Here’s your method, your first small, buildable thing:  

  1.  **Take one of these.** *(Gestures for helpers to distribute cards, or holds them out)* Just a blank card. Modest. Sturdy. Like the promises I *can* make.
  2.  **Tonight, or tomorrow, or when the post-graduation fog lifts… Write down ONE thing.** Just one. Something small. Something *buildable* in the next week or two. Not “Get My Dream Job”. More like… “Email Prof. Davies about that project idea.” Or “Look up the local volunteer scheme for tutoring.” Or “Fix my CV draft.” Or “Call Sam about sharing a flat.” Or even, “Find out where the nearest decent coffee is near the new hospital.” *(Small laugh)*
  3.  **Do it.** Actually build that one, small, specific thing. Cross it off. Feel the click of that brick settling into place.
  4.  **Then? Get another card. Do it again.**

  *(Pause. Looks around, making eye contact)*  
  This isn’t a magic spell. It won’t conjure up a perfect future. But it *will* prove something fundamental: **You are builders.** You build by building. Small step. Next step. Real thing.  

  That nursing care plan? Built. That lesson structure? Built. That bridge stress analysis? Built. That proof that finally clicked at 3 am? *(Nods knowingly at Maths students)* Built. You built them. You *are* builders.  

  So, build your resilience toolkit. Build your connections. Build your next small, true thing.  

  The future isn’t a pre-existing city on a map. It’s a construction site. And you? You’ve just spent years apprenticing on one of the toughest sites going. You’ve got the hard hat. You’ve got the skills. You’ve got this card.  

  Go build something solid. Something true. Something *yours*.  

  And congratulations. You’ve earned every brick of it.  

  **(Steps back, nods firmly. Holds up the remaining cards. Pause for applause.)**  

  ---

  **Notes for Delivery:**  

  *   **Pauses:** Marked with `(Pause)`. Use them! Let the humour land, let the seriousness sink in. The pauses after challenging statements ("it might also... not be") are crucial.
  *   **Ad-libs/Thoughts:** Flagged in `*(italicised in brackets)*`. These are moments to sound conversational, slightly off-the-cuff, reacting to the room. The "look, I know..." bits are vital warmth.
  *   **Tone:** Start warm and slightly wry. Build conviction in the "promises" section. Grounded and practical for the "method". Earnest and empowering at the end. Avoid preachiness; strive for shared understanding.
  *   **The Joke (Two Levels):** *"I couldn’t find the proof. I couldn’t build that guarantee."* Level 1 (Everyone): Self-deprecating academic honesty. Level 2 (Maths Colleagues): Pure constructivism – no proof without construction.
  *   **The "Gift":** The index cards are concrete, actionable, and embody the core philosophy. Distributing them physically is key. "Modest. Sturdy. Like the promises I *can* make." is the explicit acknowledgement of the "smaller promise".
  *   **British English:** "Canteen chips", "grudgingly", "post-graduation fog", "Prof. Davies", "flat", "tidy" (for neat), "buffets you about". Overall phrasing avoids overly American optimism.
  *   **Hitting the Brief:**  
      *   **No Existence Claims:** Replaced "flourish" with "won't come to nothing", "build resilience/connection", "build the next small thing". All actionable.
      *   **Honest Weak Version:** Explicitly contrasts with expected clichés ("Trouble is...", "Sounds neat, tidy... But...", "Modest. Sturdy.").
      *   **Doctrine Unnamed:** Colleagues will hear intuitionism/constructivism in rejecting unproven existence, excluded middle ("two boxes"), focus on method/building. Gran hears practical advice.
      *   **Constructed Thing:** The index card method is specific and doable.
      *   **Not Lecture/Sermon:** Conversational tone, humour, warmth, focus on shared experience (canteen, exams, robes).
      *   **Timing:** Reading aloud with pauses at approx. 140 words/minute puts this comfortably in the 6-8 minute range. Practice pacing!
