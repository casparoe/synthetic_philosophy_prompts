answer: |-
  ## The Flux Assessment

  The air down here tastes like rust and static. A kilometre of Canadian Shield presses down, the ventilation a constant metallic sigh in my ears. My fingers, clumsy in thick gloves, adjust the dials on the recurrence interferometer. It hums against the rock face, a low thrum vibrating up my boots. Damn damp. Condensation beads on the housing, making the readout screen flicker – a scatter of false positives like phantom fireflies in the gloom.

  “Settling?” Anders, the project’s chief engineer, calls from further down the gallery. His headlamp cuts a beam through the dust motes dancing in my own light. He’s competent, Anders. Doesn’t romanticize the rock. Sees strata, fracture zones, heat conductivity. Not… what I’m paid to see.

  “Nearly,” I grunt, wiping the screen with a sleeve. The damp messes with the capacitance sensors. The interferometer doesn’t see consciousness, not directly. It measures patterns – complex, sustained recurrences in the quantum signatures spat out by fundamental interactions. The theory says *that’s* where subjects arise: integrated, differentiated, recurrent. Brains, yes. Maybe alien biologies. *Not* inert granite. Usually. The machine beeps, a steady, low-frequency pulse indicating baseline flux – the ceaseless storm of event-qualia, each interaction a flicker of raw, intrinsic *something*, extinguished the instant it completes. Billions born and annihilated every picosecond in a cubic centimetre of this ancient rock. Good, bad, neutral – brief, unremembered, uncompensated. The background hum of a universe feeling itself.

  My job: quantify the disturbance. Excavation ripping through strata. The emplacement of vitrified waste canisters like obsidian eggs. The thermal pulse – heat radiating for millennia, subtly altering the rock’s chemistry, its stress fields, its *interactions*. Every change means annihilated event-qualia and the birth of new ones. The Environmental Assessment Authority wants the numbers. The *experiential* impact statement. Appendix F, Subsection 12.3: Phenomenological Disturbance Estimate.

  “Gallery Seven’s the headache,” I say, pulling up the anomaly log on my field tablet. The screen glows unnaturally bright in the tunnel’s perpetual twilight.

  Anders walks closer, his boots crunching on loose scree. “The ambiguous resonance.” He states it flatly. He’s seen the preliminary data. “Either inert noise, or…”

  “Or subjects with a recurrence cycle measured in decades,” I finish. The thought still sends a chill that has nothing to do with the 10-degree Celsius air. Imagine an experience – a single, integrated ‘moment’ of perception or feeling – stretching across *decades*. Slow as continental drift. Born before multicellular life crawled onto land. And our repository’s heat plume wouldn’t destroy it; the recurrence pattern holds. But it would warp it. Permanently. Non-consensually. Alter the intrinsic character of an experience older than mountains. What would that *be* like? The interferometer can’t tell us. It only flags the pattern’s existence and stability, not its content.

  Anders sighs, the sound swallowed by the ventilation’s drone. “Dr. Vanya’s report flagged this sector as ‘Subject-Bearing: High Confidence’. Refused to sign off. Forced the whole re-survey.” He taps his own tablet. “I pulled it again last night. Passionate. Convinced.” He pauses, then adds, clinically, “Her breakdown came six weeks later. Acute stress psychosis. They found her trying to ‘calibrate’ her microwave oven with a jeweller’s loupe.”

  The implication hangs in the damp air. Vanya saw subjects everywhere, even in the cafeteria cutlery, they said. Good scientist gone soft. Broken by the weight of unseeable suffering. Evidence, or evidence of breakdown? That’s the second complication gnawing at me.

  Back at the surface office – a glorified Portakabin smelling of stale coffee and photocopier toner – I find Lyra Chen, my physicist consultant, hunched over spectral analysis printouts. Her desk is a landscape of dense equations and half-empty coffee cups.

  “Still chewing on Gallery Seven?” she asks without looking up.

  “The resonance profile… it skirts the threshold,” I say, dropping into a creaking chair. I pull up the graphs. “Signal strength just below the standard cut-off for sustained recurrence. But the *pattern*… it’s weirdly coherent across the low frequencies. Like a drumbeat slowed down until it’s almost silence.”

  Lyra pushes her glasses up. “Thresholds are administrative conveniences, Marcus. Drawn by committees based on best guesses. Reality doesn’t care about our Appendix F.” She taps the graph. “This *could* be ultra-slow subjects. Vanya thought so.”

  “Vanya also thought her kettle was screaming.”

  Lyra’s gaze sharpens. “Ad hominem doesn’t invalidate data. The *point* is the flux itself. Even if Gallery Seven *is* inert, even if there are *zero* subjects anywhere down here except the worms and us… what about the *annihilation*?” Her voice gains intensity. “Every interaction we disrupt – every event-qualia extinguished by our drill bit, our concrete, our rad-waste heat – has an intrinsic character. Some are bad. Agonizing, maybe. Trillions per second. Gone without a trace, yes. No subject remembers the pain. But the *badness happened*. Doesn’t that demand minimization? Isn’t causing vast amounts of unexperienced suffering… still *wrong*?”

  It’s the argument she always circles back to. The sheer *quantity* of extinguished negative qualia as an ethical imperative, regardless of subjects. The universe as a vast, unremembered holocaust we’re duty-bound to mitigate.

  Anders walks in, holding a requisition form. “Sign-off needed for the thermocouple array in Gallery Four.” He overheard. “Lyra, with respect, that way lies madness. And paralysis. Concern terminates at the subject. Prudential concern – worry for a being’s future states – requires a being *with* a future, a narrative. Moral concern requires someone *to be wronged*. These…” he gestures vaguely downwards, “…event-flickers? They have no past, no future, no memory, no anticipation. They aren’t *someone*. They’re just… physics. Painful physics, maybe, but physics nonetheless. Worrying about them is like worrying about the ‘suffering’ of a snuffed candle flame. It’s category error. Our duty is to avoid harming *subjects* – workers, future generations, maybe even these hypothetical slow giants in the rock. Not metaphysics.”

  Lyra shakes her head fiercely. “You’re drawing the moral circle too small, Anders. Just because the suffering isn’t archived doesn’t mean it wasn’t real. Doesn’t mean we aren’t culpable for unleashing it.”

  “Culpable to *whom*?” Anders counters, his voice calm, practical. “There’s no victim. Only the fact of the pain-flux itself. Reducing it is a metaphysical preference, not an ethical obligation. We build this repository safely, we contain the waste, we avoid creating *or harming* subjects. That’s the job.” He places the requisition form in front of me. “Gallery Four’s readings are textbook inert. Sign off, Marcus. We’re on schedule.”

  The pen feels heavy in my hand. I look at the form, then at the spectral analysis of Gallery Seven on my screen – Vanya’s ghost hovering over the ambiguous peaks and troughs. Lyra’s conviction burns beside me; Anders’s pragmatism radiates calm competence. Both positions hold. Both feel terrifyingly incomplete.

  Is the rock in Gallery Seven a slow, ancient mind, about to have its aeons-long experience forcibly altered? Is it just inert stone humming with meaningless, extinguished micro-pangs? Did Vanya see truth, or did the sheer weight of imagining trillions of unremembered agonies crack her mind? Is Lyra right – is the annihilation of badness itself a harm demanding sacrifice, even if no one ever knows? Or is Anders correct – is only the suffering of persistent subjects our moral compass?

  The interferometer can’t tell me. Philosophy won’t, down here in the damp and the dust and the pressing weight of bureaucracy. My job is to assess. To categorize. To sign.

  I think of the thermal pulse model: centuries of heat warping the rock’s deep, cold stillness. I think of Vanya, meticulous, passionate, broken. I think of Appendix F, Subsection 12.3, waiting for my numbers, my recommendation.

  Neither position resolves. The crux stands, sharp and unsolvable.

  I pick up the pen. I sign the requisition for Gallery Four. Textbook inert. Easy.

  Then I pull up the draft report. My cursor blinks beside Gallery Seven’s assessment field. ‘Inconclusive – Ambiguous Resonance Profile’ is the safe option. Requires further study. Delays the project. Costs millions.

  I think of Anders’s schedule. I think of Vanya’s jeweller’s loupe and her microwave.

  My fingers type: **‘No Sustained Recurrence Detected. Classification: Inert Flux.’**

  The reason is simple, concrete, utterly inadequate: the damp kept making the readout flicker. I can’t trust the signal in Gallery Seven, not with the condensation that high. The instrumentation was unreliable. That’s all. That’s the reason I write in the margin. Appendix F demands verifiable data. This wasn’t.

  I save the draft. The hum of the Portakabin’s heater fills the silence. The ethical abyss remains wide open beneath my feet, but the paperwork, at least, is in order. For now.
