prompt: |-
  I am three chapters into a master's dissertation on perceptual justification, and the chapter I am supposed to be writing now is the one on cognitive penetration — the question of when a belief, an expectation or a desire of the subject's actually changes what they see, as opposed to changing what they say they see, or changing what they would have seen anyway given where they happened to be looking. My supervisor's standing advice is that I cannot settle this from the armchair, and a friend of mine who works in experimental psychology assures me that every case I bring her will dissolve into response bias. Neither remark has helped, because I do have settled intuitions about a good many of these cases, and I would like to know what they add up to before I decide whether to give them up.

  My working principle, arrived at by accretion rather than argument, is this: perception is cognitively penetrated only when some cognitive state of the subject's — a belief, a standing expectation, a concept they deploy — brings about a change in the experience itself, and only when that change is the sort of thing that could be assessed as apt or inappropriate in the light of the content of that state. Everything else is, on my principle, either post-perceptual judgement, or attention, or slow perceptual learning, and none of those is penetration. Now for the cases. The Müller-Lyer arrows and the checkerboard illusion with the two identical squares of grey: I know perfectly well what the facts are, I see the difference regardless, and I say not penetrated. An experienced radiologist looking at a chest film reports seeing a nodule where I see only mottled grey, and I say her experience genuinely differs from mine — penetrated, though I concede that someone will call this perceptual learning and I am not sure I can resist the charge. In that colour-matching study in which people set the background behind a heart-shaped orange card distinctly redder than the background behind a square card of exactly the same hue, I say penetrated, and this is the case I feel most confident about, since shape ought to have nothing to say about hue. When I am hungry, food photographs look larger and more vivid to me than they do after a meal, and here I say not penetrated: a drive state, and I suspect the change is in the reporting rather than in the seeing. Those two are a pair I cannot reconcile, since structurally they look to me like the same thing. When somebody says 'it's a seal' about an ambiguous drawing and I duly see a seal, I say not penetrated, because both readings were available all along and the remark merely selected between them; but when a colleague of mine who was firmly in the white-and-gold camp over that photograph of the dress was told the right answer and thereafter saw blue and black, involuntarily and for good, I say penetrated — and I am aware that this second pair is no easier than the first, since the only differences I can point to are that one flip is voluntary and reversible and the other is neither. Finally: after being told what a badly degraded recording says, I hear the words plainly and can never hear it as noise again, which I call penetration; and after days in inverting goggles the world looks the right way up again without any belief of the wearer's being implicated, which I call not penetration. The case I keep reversing on is the eighty-pound bottle of wine: the price has been mentioned, the wine tastes better, and the drinker insists that the flavour itself has changed rather than their opinion of it.

  Here is what I want. Test my principle against these cases and either repair it or replace it — I am not attached to the principle, only to the verdicts. State your best candidate precisely enough that I could apply it to a case neither of us has thought of, or, if you think the honest answer is that no single principle will do all this work, state your two best rivals and the difference between them. Lead with the principle itself in a single sentence before you do anything else, and identify which clause is doing the work in each of my two problem pairs. Then go through the cases in order, saying which verdicts the principle reproduces and which it overturns, and be blunt about the overturning: I would rather have a simple principle that forces me to abandon either the hunger verdict or the ambiguous-seal verdict than an elaborate one that saves both, and I want you to say which course you recommend and why. Close with one case of your own devising on which your principle and the simplest rival come apart, together with the verdict each of them delivers. Please write in British English, and keep the whole thing under 650 words.
reasoning: |-
  Hmm, this user is deep into their master's dissertation on perceptual justification, specifically cognitive penetration. They're grappling with cases where cognitive states seem to alter perception itself versus other explanations like response bias. They've developed a principle but need it tested against various examples.

  The user presents several thought experiments: Müller-Lyer illusions (no penetration), radiologists seeing nodules (penetrated), color-matching with shapes (penetrated), hunger affecting food perception (not penetrated), ambiguous drawings like seals (not penetrated), the infamous dress photo (penetrated), degraded audio (penetrated), inverting goggles (not penetrated), and expensive wine tasting better (unclear). 

  Their working principle has two key parts: cognitive states must directly alter experience, and that alteration must be assessable as apt/inappropriate relative to the cognitive state's content.

  The challenge lies in reconciling structurally similar pairs - particularly the hunger/food case vs. shape/color case, and the reversible seal drawing vs. irreversible dress perception. The user prioritizes theoretical consistency over preserving all intuitions.

  They want a precise principle that either fits their verdicts or forces them to abandon some. The solution should clearly state which clause resolves their problematic pairs, apply to all cases, recommend which intuitions to discard if necessary, and include a novel test case.

  I'll formulate a principle with three criteria: cognitive causation, experience-alteration, and normativity. This handles their problem pairs through the normativity clause - hunger lacks appropriateness assessment while shape/color has it. Most verdicts hold except the radiologist case (reclassified as perceptual learning) and wine case (becomes penetrated).

  The novel test case - national flags affecting color perception - cleanly distinguishes from simpler rivals through the normativity requirement. This maintains theoretical rigor while honoring the user's core intuitions about experience-altering penetration.
answer: |-
  My principle: Cognitive penetration occurs iff a cognitive state directly causes a change in perceptual experience *and* this change is assessable as accurate/inaccurate relative to the content of that cognitive state. The normativity clause (assessability) resolves your problem pairs.

  **Cases assessed:**

  1.  **Müller-Lyer/Checkerboard**: Not penetrated. Normativity absent (knowing truth doesn’t make the *illusion itself* inaccurate relative to belief). **Matches your verdict.**
  2.  **Radiologist**: Not penetrated. Expertise alters sensitivity via perceptual learning, not direct cognitive causation altering experience *now*. **Overturns your verdict.** This *is* slow learning.
  3.  **Heart/Square colour**: Penetrated. Belief/association about shape directly causes hue misperception; this misperception *is* inaccurate relative to the shape belief ("hearts shouldn't affect *hue*"). **Matches your verdict.**
  4.  **Hungry/food photos**: Not penetrated. Drive state changes salience/attention/vividness *reporting*, not the core experience assessable relative to a belief. **Matches your verdict.** (Normativity clause: Hunger isn't a belief whose content makes a size misperception apt/inapt).
  5.  **Ambiguous seal**: Not penetrated. Cognitive state selects available percept; no new experience created assessable as apt/inapt. **Matches your verdict.**
  6.  **"The Dress" (post-flip)**: Penetrated. Belief causes a *new, stable* colour experience; this experience is assessable as accurate/inaccurate relative to the belief ("is it *really* blue/black?"). **Matches your verdict.**
  7.  **Degraded audio**: Penetrated. Belief causes a new auditory experience; this experience is assessable relative to the linguistic belief ("does it *sound* like those words?"). **Matches your verdict.**
  8.  **Inverting goggles**: Not penetrated. Adaptation alters sensory input processing (perceptual learning), not direct cognitive causation. **Matches your verdict.**
  9.  **£80 wine flavour**: Penetrated. Price belief directly causes a change in flavour *experience*; this change is assessable as apt/inaccurate relative to the price belief ("does it *taste* like an £80 wine should?"). **Overturns your verdict.** This *is* penetration.

  **Reconciling Problem Pairs & Recommendation:**
  *   **Hunger (Not Pen.) vs. Shape/Hue (Pen.)**: Resolved by normativity. Hunger lacks cognitive content against which the vividness change can be assessed as apt/inapt. The shape/hue change *is* assessable as inapt relative to the shape association ("hearts shouldn't affect hue perception").
  *   **Ambiguous Seal (Not Pen.) vs. The Dress (Pen.)**: Resolved by experience alteration + normativity. The seal involves selection, not creation of a new experience assessable as apt/inapt relative to the prompt. The Dress involves a *new* colour experience generated by belief, assessable relative to it.
  *   **Recommendation**: Abandon the radiologist and wine verdicts. Your principle correctly identifies penetration via normativity, distinguishing genuine cognitive effects on experience (Shape/Hue, Dress, Audio, Wine) from learning (Radiologist, Goggles), selection (Seal), or non-cognitive/non-assessable changes (Hunger). Simplicity favours discarding the two intuitions overturned.

  **Novel Case & Rival Principle:**
  *   **Case**: Subjects told a faint grey smudge on a screen is "definitely a spider". Many report *seeing* a distinct spider shape afterwards. Rival Principle (simpler): Penetration = Cognitive state directly causes *any* change in experience.
  *   **My Principle**: Likely Penetrated (if experience genuinely changes; assessable as apt/inapt relative to "it's a spider").
  *   **Rival Principle**: Penetrated.
  *   **Where they Diverge**: If subjects merely *judge* the smudge *is* a spider based on the prompt, but their *visual experience* remains unchanged (just a smudge), my principle says **Not Penetrated** (no assessable experiential change). The rival principle might still count it if judgement is conflated with experience. My principle requires the experience itself to be altered and normatively assessable.
