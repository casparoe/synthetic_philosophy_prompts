answer: |-
  Your case study confronts Smith’s moral psychology with a fascinating historical challenge. Let’s proceed step by step, testing the theory against the episode without forcing coherence where none exists. I’ll take your facts as given—they align with current scholarship—and focus on the conceptual mapping you request before addressing the tensions.

  **Mapping Smith’s Framework to the Boycott**  
  Smith’s moral psychology centres on *sympathy* as an imaginative act: we project ourselves into another’s situation to grasp their sentiments. Yet this capacity weakens with distance—spatial, social, or emotional. The China earthquake passage starkly illustrates this decay: abstract suffering fails to disrupt daily life, while trivial personal harm consumes us. The *impartial spectator* emerges as the internal arbiter of conduct, constructed from real social interactions but refined to correct for bias. Crucially, Smith distinguishes between approving an action’s *propriety* (its motive’s congruence with what spectators would endorse) and its *utility* (its beneficial consequences).  

  For the sugar boycott:  
  - **The Spectator’s Identity**: Here, the spectator is dual-layered. *Proximally*, it is the abstainer’s community—fellow pamphleteers, pledge-signers, or tea-table companions—who observe adherence to the boycott through public declarations, shop choices, or conversation. *Distally*, and more radically, it is the *imagined enslaved person*, whose hypothetical perspective is invoked to judge the consumer’s complicity. Smith allows spectators to be abstract ("any fair spectator"), but they are typically grounded in observable social circles. The boycotters stretched this by projecting a spectator from beyond their lived world.  
  - **Sentiment Approved**: Spectators primarily approve the *motive* behind abstention: a desire to avoid participating in injustice. Fox’s pamphlet makes this motive tangible by quantifying guilt—transforming abstract moral horror into a calculable share of suffering. The act itself (abstention) gains propriety because spectators concur that complicity in slavery is blameworthy. Utility—reduced demand for slave labour—is secondary; Smith warns that approving actions *solely* for utility risks moral confusion. Here, utility validates the motive but does not define it.  
  - **Overcoming Distance**: Smith’s theory would predict this movement’s improbability. Vivid imagination of distant suffering is rare; sympathy naturally favours the near. Yet Fox’s pamphlet engineered vividness through arithmetic: *your* teapot = *this fraction* of a person’s agony. This calculation collapsed moral distance by making the invisible chain of complicity tangible. It forced consumers to place themselves not just in the enslaved person’s position but in the *perpetrator’s*—a psychological jolt Smith’s "humane European" might lack.  

  **Verdict on the Movement’s Viability**  
  Smith’s framework, surprisingly, *can* accommodate the boycott’s emergence—but only through strenuous imaginative labour. The pamphlet’s calculus acts as a "sympathy engine," compensating for distance by making guilt visceral and personal. Women’s leadership aligns with Smith’s emphasis on social observation: their exclusion from formal politics heightened reliance on communal spectatorship (tea tables, pledges) as arenas for moral judgment. The planters’ alarm confirms the movement’s perceived potency: it created a *new* spectating public that judged consumption as a moral act.  

  Against rival readings:  
  - **Utility-Maximising Piety?** Unconvincing. Abstaining from cheaper West Indian sugar for costlier East Indian sugar contradicts narrow self-interest. Smith’s propriety-utility distinction holds: boycotters foregrounded *duty* (avoiding guilt), not gain.  
  - **Expressive Politics?** Partial, but reductive. The public pledges and pamphlets were indeed performative, but Smithian spectatorship *requires* such expression—moral judgments solidify through social affirmation. This wasn’t empty ritual; it trained spectators to see consumption as ethical agency.  
  - **Solely Religious Conscience?** Overstated. Quaker/Evangelical networks provided infrastructure, but Fox’s pamphlet framed the argument in secular, calculable terms. Smith’s spectator resonates with theological "inner witness" concepts, yet his theory explains how conscience is socialised—through actual and imagined spectators.  

  **Testing the Three Tensions**  
  1. **Invisible Abstention**: Smith insists the spectator is schooled by *observable* actions. Boycotters solved this by making non-action visible: pledges published names; shop signs advertised "free labour" sugar; refusal became a topic of conversation. This fits Smith’s model—just in an expanded theatre. The "audience" now judged patterns of consumption, not just discrete deeds. It extends, but doesn’t rupture, his account.  
  2. **The Unseen Enslaved as Spectator**: This strains Smith. The enslaved could not realistically witness or correct the abstainer’s internal spectator. Yet Smith allows us to imaginatively adopt perspectives beyond our circle ("the eyes of mankind"). By rigorously projecting the enslaved person’s viewpoint—via pamphlets detailing plantation conditions—boycotters constructed a *deliberately distant* spectator. This leans on universalist ethics ("rights") that Smith’s empiricist psychology cannot ground. His spectator emerges from social interaction, not abstract principle; here, social distance is overcome by *moral* imagination exogenous to his system.  
  3. **Calculation’s Conundrum**: Fox’s arithmetic emphasises causal responsibility—a utility-focused metric. Smith warns against deriving propriety from consequences alone. Yet in this case, the calculation *serves* propriety: it makes the motive (avoiding complicity) concrete. Spectators approve the desire *not to harm*, quantified to prove sincerity. Utility (reduced suffering) follows from the motive but does not motivate it. The framework holds—barely—because the core impulse aligns with Smith’s "sense of justice."  

  **Where Smith Falls Silent**  
  Smith’s *economic* case against slavery—its inefficiency—is irrelevant here. Boycotters focused on slavery’s inherent cruelty, not its market defects. His moral psychology illuminates their *motivations* but not their *political strategy*. The movement’s brilliance was in weaponising sympathy through quantification and social pressure—tactics beyond Smith’s purview.  

  **Conclusion: A Qualified Success**  
  Smith’s theory proves remarkably elastic in explaining the boycott’s psychological mechanics: it maps how sympathy, amplified by imaginative calculation, overcame distance; how spectatorship migrated into domestic and commercial spaces; and why propriety, not utility, drove abstainers. Yet it stumbles on the boycott’s moral universalism—its appeal to an unobservable, suffering spectator. This suggests a limit: Smith’s spectator is culturally embedded, not transcendent. For the enslaved to become valid spectators required concepts of inherent personhood that Smith implies (through sympathy’s universality) but never secures.  

  The exercise doesn’t fail. It reveals where Smith’s model illuminates (the social scaffolding of conscience) and where it needs supplementing (the leap to genuinely impartial humanity). For your seminar, this tension—between situated spectators and boundless moral claims—may be the richest ground. It shows philosophy and history in uneasy, productive dialogue.
