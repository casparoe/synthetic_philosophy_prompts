prompt: |-
  So I've been working the gate desk at a mid-size airport for about four years and I keep getting dragged into this argument with my roommate, who's doing a philosophy degree, about when it's ok to just say something flat out instead of hedging. He keeps telling me there's some clean rule, and every time I try to write down what I actually think I end up with a mess. Here are my verdicts, going by gut:

  Passenger asks if flight 214 is on time. Board says on time, but I know the inbound plane is still sitting in Denver. I say "it's on time." Not fine, obviously. Same passenger, same question, but I've just refreshed the screen ten seconds ago and there's no reason to doubt it — I say "it's on time." Fine. And I say it's fine even though I know the boards are wrong maybe one time in seven and I've been wrong before on exactly this. But then my friend texts me the same question an hour after my shift, and I tell her "it's on time" off memory of that same board — not fine. My roommate says those last two can't both be right, because the epistemic situation is basically identical, and I don't have an answer, I just know they feel different.

  My uncle does the weekend weather on a community radio station. He says "rain tomorrow" out loud when he's privately at maybe 60 percent. I think that's fine, it's the job, people listening know the genre. But the same man, at my cousin's wedding, asked whether it'll rain for the outdoor thing Saturday, says "it'll rain Saturday" at the same 60 percent — and I think that's not fine. Same guy, same confidence, different room. At the pharmacy counter next door there's a tech who tells patients the drug does what the label says while privately thinking the studies were garbage: I say fine. That same tech telling a patient "you'll feel noticeably better by Friday," which she does believe but has no way of knowing: not fine. Telling my sister "you'll get the callback" when I'm pretty sure she won't, because she needs it: not fine, even though it would help her. Reading allergens off a package to a worried parent on the phone, with no ability to double-check anything: fine. Saying "the airline says it's on time" when I actually doubt it: fine, and I think that's an easy one.

  My own attempt at a rule is the betting one: you may say it flat out only if you'd put a month's pay on it in front of the person you're telling. But that seems to wreck the radio case and the allergen case and maybe even the board case, and I don't want to give those up. The distinction I keep reaching for is between *posting* — putting out the line that belongs to the desk, the label, the station — and *vouching*, where it's me on the hook. Posting seems permissive, vouching seems strict, and I think that's what makes the board-at-the-desk vs board-over-text pair feel different, but I can't say exactly where posting stops and vouching starts, and I worry I'm just relabeling the thing.

  So: is there a principle, or a small number of candidate principles, that actually gets all of these, or nearly all? State it precisely — clause by clause, and tell me which of my cases is doing the work for each clause, because I want to see whether some clause is only there to rescue one weird verdict. Then tell me what it says about the case I keep going back and forth on: the incident review, where I'm like 90 percent sure a specific crew's late arrival caused the delay because I heard it on the radio, but I can't corroborate it and my name goes on the report. And what it says about a case I haven't thought through at all — the automated announcement system saying "flight 214 will depart on time" when nobody has checked, and the airline's chatbot saying the same thing to a passenger. Who's asserting there, if anybody, and does posting/vouching even apply? Finally, be honest about which of my verdicts the principle can't keep. If the cheapest coherent option turns out to be just "say it only if you know it" and eating the loss on the radio forecast and the board case, tell me that straight and tell me what that costs me at work, rather than building me a baroque thing with six clauses that saves everything.
reasoning: |-
  Okay, the user works at an airport gate desk and is struggling with a philosophical debate about when to state things confidently versus hedging. They've given several real-life scenarios where their gut feeling says it's either fine or not fine to make a flat statement. Their roommate, studying philosophy, argues there should be a clean rule, but the user finds it messy. 

  First, I need to parse all their examples. They mention situations like announcing flight statuses based on the board, weather forecasts, pharmacy advice, reassuring their sister, reading allergen info, and incident reports. Each has nuances. For instance, saying a flight is on time when they've just checked the board feels okay, but texting the same info later doesn't. The uncle giving a weather report on radio is fine, but at a wedding it's not. The pharmacy tech reading labels is acceptable, but personal assurances aren't. 

  Their betting rule—only state something if you'd bet a month's pay on it—doesn't hold up because it conflicts with some cases they feel are acceptable, like the radio weather forecast or reading allergens without double-checking. They hint at a distinction between "posting" (official capacity) and "vouching" (personal responsibility), but struggle to define it clearly.

  The user's deeper need seems to be finding a practical, defensible principle for their job. They need clarity to handle daily communication without overcomplicating things. They might also want validation that their intuitive judgments aren't arbitrary, even if a perfect rule doesn't exist. The roommate's insistence on a clean rule adds pressure, making them doubt their instincts.

  Looking at the principles I considered: Warranted Assertibility, Role-Based Norms, and Commitment Accounting. Role-Based Norms align best with their examples. It distinguishes between acting in an official role (posting) versus personal statements (vouching). This explains why stating the flight status at the desk is fine (posting) but texting later isn't (vouching). The radio weather is part of the job, so it's acceptable even at 60% confidence, but at the wedding, it's personal. 

  The incident report case is tricky. If it's part of their role to report probable causes, even without certainty, it might be okay. But if they're vouching personally, it's not. They need to clarify their role's expectations. For automated systems, the airline is institutionally posting, so it's acceptable under the role-based principle.

  Some cases don't fit perfectly. The pharmacy tech reading labels is posting, but if they doubt the studies, is that still within role? The user thinks it's fine, so Role-Based Norms cover it as long as the tech is conveying official info. Reassuring their sister is personal vouching, which the rule correctly flags as not fine.

  The user might worry that Role-Based Norms could be misused to avoid accountability. But in professional contexts, roles come with accountability structures. The airline backs the board info, the pharmacy stands by the labels. If the user states "the airline says it's on time," they're deferring to the role, which is responsible.

  In conclusion, Role-Based Norms seem the most coherent framework, preserving most of their judgments. It accepts that communication norms depend on context and roles, which matches the user's intuition. They can apply this at work: in official capacity, state information confidently; personally, be more cautious. This should resolve the debate with the roommate by showing their instincts aren't arbitrary but contextually grounded.
answer: |-
  Here's a clean, defensible principle grounded in **Role-Based Norms of Assertion**, preserving most of your intuitive judgments while avoiding excessive complexity:

  ### The Principle (Role-Based Norms of Assertion)
  **You may assert *P* flatly without hedging if and only if:**  
  *(Clause 1)* You are acting in a recognized social or institutional **role**,  
  *(Clause 2)* The assertion falls within the **scope of that role's authority**,  
  *(Clause 3)* You are conveying the **official position or best available evidence** of the institution/role (even if you personally doubt it), **OR**  
  *(Clause 4)* You are making a **personal assertion** *and* you possess **knowledge-level justification** for *P* (roughly: you couldn't easily be wrong given your evidence).

  ---

  ### How It Handles Your Cases
  1. **Flight 214 On-Time (Desk):**  
     *Fine.*  
     *(Clause 1)* You're at the gate desk (role).  
     *(Clause 2)* Reporting flight status is core to the role.  
     *(Clause 3)* You're conveying the airline's official system status (the board).  

  2. **Flight 214 On-Time (Text to Friend):**  
     *Not Fine.*  
     *(Clause 1)* You're acting as a friend (personal role), not an airline agent.  
     *(Clause 4)* Personal assertion requires knowledge-level justification. Your memory of the board hours ago doesn't meet this (easily could be wrong).  

  3. **Uncle: "Rain Tomorrow" (Radio):**  
     *Fine.*  
     *(Clause 1)* He's a weather presenter (role).  
     *(Clause 2)* Forecasting is the job.  
     *(Clause 3)* He's conveying the station's best forecast (60% is standard for "rain" in this context).  

  4. **Uncle: "Rain Saturday" (Wedding):**  
     *Not Fine.*  
     *(Clause 1)* He's acting as a guest/uncle (personal role).  
     *(Clause 4)* Personal assertion lacks knowledge-level justification (60% is too low).  

  5. **Pharmacy Tech: "Drug Does What Label Says":**  
     *Fine.*  
     *(Clause 1)* Tech is acting in professional role.  
     *(Clause 2)* Conveying label info is core duty.  
     *(Clause 3)* She's stating the official manufacturer/pharmacy position (even if she doubts the studies).  

  6. **Pharmacy Tech: "You'll Feel Better by Friday":**  
     *Not Fine.*  
     *(Clause 1)* Still in role, BUT...  
     *(Clause 3)* This is a *prediction* about an individual's response, not the official drug efficacy. It exceeds the role's scope (conveying label facts).  
     *(Clause 4)* If seen as personal, lacks knowledge-level justification.  

  7. **Reassuring Sister: "You'll Get the Callback":**  
     *Not Fine.*  
     *(Clause 1)* Personal role (sibling).  
     *(Clause 4)* Lacks knowledge-level justification (you're pretty sure she won't). Wishful thinking ≠ justification.  

  8. **Reading Allergens Off Package (No Double-Check):**  
     *Fine.*  
     *(Clause 1)* Acting in role (pharmacy/desk agent).  
     *(Clause 2)* Providing label info is role-appropriate.  
     *(Clause 3)* You're conveying the *official information on the package* (the authoritative source).  

  9. **Saying "The Airline Says It's On Time" (While Doubting):**  
     *Fine.*  
     *(Clause 1)* In role.  
     *(Clause 2)* Reporting airline status is the job.  
     *(Clause 3)* You are *accurately* reporting the airline's *official position*.  

  ---

  ### Your Sticking Points Resolved
  *   **Flight Board vs. Text:** The difference is **Role Context**. At the desk, you're an agent *posting* the airline's official status. Texting your friend, you're a private citizen *vouching* based on stale data. Roles define the norms.
  *   **Incident Review Report (90% sure crew caused delay):**  
      *Depends on your role's reporting requirements.*  
      - If your role *requires* reporting probable causes based on available evidence (like radio chatter), **it's fine** *(Clause 1, 2, 3: reporting institutional evidence)*.  
      - If the report requires *corroborated facts* or implies personal certainty, **it's not fine** *(Exceeds Clause 3 scope; Clause 4 requires knowledge, which 90% + hearsay may not meet)*.  
      **Check your reporting guidelines.** If "best available evidence" is sufficient, assert it flatly. If "verified facts" are required, hedge ("Based on radio chatter, I believe crew delay was the likely cause...").

  *   **Automated System / Chatbot Saying "On Time":**  
      - **Who's Asserting?** The *airline*, institutionally.  
      - **Does Posting/Vouching Apply?** Yes, but institutionally. The airline is "posting" its official status via the system.  
      - **Is it OK?** Under Role-Based Norms, **yes** *(Clause 3)*. The system is acting within its programmed role, conveying the airline's official data feed. The justification lies in the airline's institutional commitment to maintain accurate systems, not in the system's "knowledge." Passengers understand they're getting the airline's posted status, not a personal guarantee from a sentient being.

  ---

  ### Verdicts the Principle CAN'T Keep (And Why That's OK)
  1.  **"Flight 214 On-Time (Desk)" when boards are wrong 1/7 times:**  
      *The principle says this is FINE.* You might feel uneasy because 1/7 is significant. However, the principle prioritizes the **role function** (conveying the official system status) over individual certainty *in that context*. Passengers rely on the system, knowing it's fallible. Your job is to report the system, not your personal assessment *unless specifically asked for it*.  
      **Cost at Work:** You must accept that conveying the official status is your duty, even knowing it's imperfect. Hedging ("The board *says* on time...") constantly would undermine the system's utility and likely violate procedure.

  2.  **Pharmacy Tech Doubting Studies:**  
      *The principle says stating the label is FINE.* Your worry stems from her *personal* doubt. The principle focuses on the *role action* of conveying official information. Her epistemic state is irrelevant to Clause 3. Her role doesn't require her to personally endorse the science, just to convey the regulated label information.  
      **Cost:** You must separate personal belief from role-based communication. Her job is to be a conduit for official info, not a personal validator.

  ---

  ### Why This Beats "Just Say It If You Know It"
  The "knowledge-only" rule fails your core cases:  
  *   **Radio Weather (60%):** Not knowledge, but intuitively fine due to role context.  
  *   **Flight Board (Desk):** You don't *know* it's true (1/7 error), but it's your job to report it.  
  *   **Reading Allergens:** You don't *know* the package is correct, but it's the authoritative source for your role.  
  *   **"The Airline Says...":** You don't believe it, but accurately reporting the airline's statement is your job.

  **Role-Based Norms** accepts these as legitimate assertions because social practices depend on institutional roles communicating official positions, not just individuals uttering known truths. It captures the **posting/vouching** distinction cleanly: Posting = Clause 3, Vouching = Clause 4. The cost is accepting that institutional communication has different norms than personal conversation – which aligns perfectly with your intuition and airport reality. Stick to this principle; your gut was smarter than your roommate's "clean" rule.
