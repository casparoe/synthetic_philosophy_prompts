prompt: |-
  I hold a chair in philosophy at a British university, and my own work sits almost entirely within formal epistemology: credence functions, ordinary and Jeffrey conditionalisation, priors and likelihoods, reliability parameters and the higher-order evidence they generate, deference principles, strict coherence and regularity constraints, calibration, and imprecise probability when I need it. That vocabulary is native to me and to the doctoral students on my seminar; Sanskritic philosophy is not. This term I am co-teaching a module on testimony with a colleague from our Centre for Sanskrit Studies, and week five is devoted to the Nyāya claim that śabda — the utterance of a trustworthy speaker — is a pramāṇa in its own right, co-ordinate with perception and inference rather than reducible to either. My colleague has supplied me with a précis, and since I read no Sanskrit I need to know, before I stand up in front of fifteen Bayes-first students, whether that position can be stated at all in the apparatus I actually use, and how much of it survives the restatement intact.

  The précis, as I understand it, runs roughly as follows, and I should be grateful if you would correct me wherever I have garbled it — better now than in the seminar. Nyāya admits four pramāṇas: perception, inference, comparison and śabda, whereas the Buddhist epistemologists admit only the first two and treat everything testimonial as inference from signs. Śabda is defined by reference to an āpta, a speaker who knows the matter as it is and speaks as he knows it, so that the warrant conveyed depends on the cognitive standing and the character of the source rather than on any mark present in the utterance itself. Veridical verbal cognition is held to require four things: mutual expectancy amongst the words; semantic fitness, the standing illustration being that one may water a plant with water but cannot coherently be said to water it with fire; contiguity of the utterance; and the speaker's purport, which settles cases in which a single word-form admits of two readings — the familiar example being a term that can mean either a horse or salt, disambiguated by whether the setting is a battlefield or a dining room. Separately, and this is the claim I find most striking, Nyāya holds that the validity of a cognition is extrinsic both in its arising and in its apprehension: nothing internal to a cognition certifies it, and one learns that a cognition was valid by inferring from the success of the activity it prompted. The Mīmāṃsakas deny this and hold validity to be intrinsic, whilst also maintaining that the Veda is authorless; Nyāya instead makes the Veda the utterance of Īśvara and derives its standing from his being the paradigm āpta.

  What I want is a translation exercise, not a comparative survey. Take each of those claims in turn — the irreducibility of śabda, the āpta condition, the four conditions on verbal cognition, the extrinsic-validity thesis, and the divine-author move — and restate it as precisely as you can in my formal idiom: what is the credence, what counts as the evidence, what is the likelihood, what is conditionalised on what, and where, if anywhere, a reliability parameter or a deference principle has to be introduced. Then give me the residue report, which is the part I actually care about, sorted into three tiers: what translates cleanly; what translates only by being bent, with the bending identified; and what has no expression whatsoever in a probability calculus. Be scrupulous about not smuggling — if the only way to render a Nyāya claim in my vocabulary is to help myself to assumptions the Naiyāyika would reject, such as treating a speaker's trustworthiness as a parameter to be estimated from evidence about his past utterances, or treating the four conditions as likelihood ratios over competing interpretations rather than as conditions on whether a cognition arises at all, then say so plainly and score it as distortion rather than as translation. Finally, tell me which side the residue favours: where the translation fails, is that because the formal apparatus genuinely lacks a dimension — pedigree as opposed to strength, factivity as opposed to degree of confidence, a distinction between whether a cognition occurs and whether it is warranted — or because the Nyāya claim, stripped of its technical vocabulary, turns out to be a repackaged thesis about priors and reliabilities that was never as radical as it sounds? I have suspicions in both directions and I expect you to push back on them. Two pressure points I would like you to work through rather than gesture at: whether pramā, which appears to be factive, can be rendered at all by a non-factive assignment of degrees of belief; and whether a testifier whose reliability is not merely very high but unimpeachable is representable in a framework that bars credences of exactly one on anything contingent, and what the Naiyāyika forfeits if he is driven to accept a merely extreme prior on divine utterance. Please do not send me a bibliography, a reading list or any citations; I have the secondary literature to hand, and it is argument I am asking for.
reasoning: |-
  Okay, I need to tackle this query from a philosophy professor who specializes in formal epistemology. They're co-teaching a module on testimony and need help translating Nyāya concepts into their Bayesian framework. Let me break this down carefully.

  First, the user wants a strict translation exercise, not comparative analysis. The key elements to address are: the irreducibility of śabda, the āpta condition, the four conditions for verbal cognition, extrinsic validity, and the divine-author move. For each, I need to express them in terms of credences, evidence, likelihoods, conditionalization, reliability parameters, and deference principles.

  The user is very specific about avoiding smuggling - I can't introduce assumptions that Nyāya would reject. The residue report must categorize what translates cleanly, what requires bending, and what's untranslatable. They also want to know where the translation fails - whether due to limitations in Bayesian epistemology or because the Nyāya claims aren't as radical as they appear.

  Important pressure points: 
  1) How to handle pramā (which seems factive) within non-factive credences
  2) Whether unimpeachable reliability can be represented without assigning credence 1 to contingencies

  Starting with śabda's irreducibility: Nyāya sees it as co-equal with perception and inference, not reducible to inference. In Bayesian terms, testimony would be a basic evidence type rather than derived from other evidence. This maps cleanly to priors treating testimonial evidence as primitive.

  For the āpta condition: This defines a trustworthy speaker who knows the truth and speaks truthfully. Bayesianism would treat trustworthiness as a reliability parameter θ. But Nyāya sees this as constitutive, not estimable - here's where bending occurs. We'd have to represent āpta as θ=1, but that violates regularity. The residue favors Nyāya as Bayesianism can't capture intrinsic trustworthiness without extreme priors.

  The four conditions (expectancy, fitness, contiguity, purport) pose challenges. These aren't about evidence strength but about whether cognition occurs. Bayesianism has no equivalent for cognition-generation conditions - this is untranslatable residue. We can only model them as likelihoods affecting interpretation probabilities, which bends Nyāya's intent.

  Extrinsic validity is fascinating: validity is known through successful action, not intrinsic to the cognition. Bayesianism lacks "validity" as distinct from credence. We can model action success as evidence for source reliability (updating θ), but this distorts by making validity probabilistic rather than binary. The residue reveals Bayesianism's lack of factive/normative dimensions.

  For divine authorship: Treating Īśvara as θ=1 creates tension with regularity. Nyāya forfeits unimpeachability by accepting extreme but not infinite confidence. The residue shows Bayesianism's inability to represent absolute epistemic authority.

  On pramā's factivity: Credences can't capture factive knowledge. We can use high credence with reliability, but it's not equivalent. This is untranslatable - a key limitation of probabilistic approaches.

  The unimpeachable reliability issue: Assigning P(θ=1)=0 under regularity makes divine testimony problematic. Nyāya must accept it as extreme prior, losing the "incorrigible" aspect - this residue favors Bayesian constraints.

  Overall, the residue analysis shows significant limitations in Bayesian epistemology for capturing Nyāya's categorical distinctions between pramāṇas, their constitutive conditions, and factive knowledge. Where translation works best is for structural parallels like evidence source primitiveness, but the deeper epistemological commitments resist clean formalization.
answer: |-
  Here is a systematic translation and residue analysis, adhering strictly to your formal epistemology framework and avoiding conceptual smuggling. Each Nyāya claim is dissected into Bayesian components, followed by a tiered residue report and pressure point resolution.

  ### 1. **Irreducibility of Śabda**
     - **Nyāya Claim**: Śabda is a basic source of knowledge (pramāṇa), co-ordinate with perception/inference, not reducible to inference from observed signs.
     - **Formal Translation**:  
       - *Credence Target*: Posterior credence in proposition \(p\) (content of testimony).  
       - *Evidence*: Utterance event \(U\) ("Speaker S uttered \(p\)").  
       - *Likelihood*: \(P(U | p, \theta_S)\) and \(P(U | \neg p, \theta_S)\), where \(\theta_S\) is S's *reliability parameter* (truthfulness + competence).  
       - *Conditionalization*: Jeffrey conditionalization on \(U\), with likelihoods weighted by \(\theta_S\).  
       - *Irreducibility*: Treating \(U\) as a *primitive evidence type* in the prior structure. No decomposition into perceptual/inferential inputs (e.g., no \(P(U | \text{inference from S's behavior})\)).  
     - **Residue Report**:  
       - **Clean Translation**: Testimonial evidence as a basic update source (like perceptual inputs).  
       - **Bending**: Nyāya treats śabda as metaphysically distinct; Bayesianism treats it as *procedurally* primitive (a design choice in the model). No distortion if we accept primitiveness in the evidence taxonomy.  
       - **Untranslatable**: None.  
       - **Residue Favors**: Parity. Bayesianism can accommodate primitive evidence sources.

  ### 2. **Āpta Condition**
     - **Nyāya Claim**: Warrant requires an *āpta* (knower/truthful speaker). Trustworthiness is constitutive, not inferred from marks in the utterance.  
     - **Formal Translation**:  
       - *Credence Target*: \(\theta_S\) (S's reliability).  
       - *Evidence*: Direct assignment of \(\theta_S = 1\) for an āpta.  
       - *Likelihood*: N/A (no learning process; āpta-status is given).  
       - *Conditionalization*: Deference principle: \(P(p | U_S) = \theta_S\), with \(\theta_S = 1\) for āptas.  
       - **Smuggling Alert**: Nyāya rejects estimating \(\theta_S\) from past utterances (it's known via speaker's nature). Must treat \(\theta_S = 1\) as axiomatic for āptas.  
     - **Residue Report**:  
       - **Clean Translation**: Deference to a source with maximal reliability.  
       - **Bending**: Forcing \(\theta_S = 1\) violates Bayesian *regularity* (no credence 1 in contingencies). **Distortion score: Severe**.  
       - **Untranslatable**: Constitutive trustworthiness (not empirically estimated).  
       - **Residue Favors**: Nyāya. Bayesianism lacks a non-empirical, categorical reliability concept.

  ### 3. **Four Conditions on Verbal Cognition**
     - **Nyāya Claim**: Mutual expectancy, semantic fitness, contiguity, and purport are *necessary for cognition to arise*, not factors affecting strength.  
     - **Formal Translation**:  
       - *Credence Target*: \(P(p | U)\) only defined if conditions are satisfied.  
       - *Evidence*: Conditions act as *filters*: if unmet, \(U\) is not evidence (no update).  
       - *Likelihood*: \(P(U | p) = 0\) if conditions fail (utterance impossible under \(p\)).  
       - **Smuggling Alert**: Modeling conditions as likelihoods \(P(U | p)\) misrepresents Nyāya – they govern whether cognition *occurs*, not its probability.  
     - **Residue Report**:  
       - **Clean Translation**: None.  
       - **Bending**: Treating conditions as setting \(P(U | p) = 0\) for incoherent utterances (e.g., "water with fire"). **Distortion score: Moderate** (confuses cognition-arising with evidence strength).  
       - **Untranslatable**: Conditions as *enablers of cognition* (not credence values). Bayesianism lacks a "cognition generator" layer.  
       - **Residue Favors**: Nyāya. Bayesianism conflates *whether evidence exists* with *how strong it is*.

  ### 4. **Extrinsic Validity**
     - **Nyāya Claim**: Validity (prāmāṇya) of a cognition is known extrinsically via successful action, not intrinsically.  
     - **Formal Translation**:  
       - *Credence Target*: Posterior credence in reliability \(\theta_S\) or belief in \(p\).  
       - *Evidence*: Success/failure of action based on \(p\) (e.g., "plant thrived after watering").  
       - *Likelihood*: \(P(\text{success} | p, \text{action})\) (high if \(p\) true).  
       - *Conditionalization*: Update \(\theta_S\) or \(P(p)\) using success/failure data.  
     - **Residue Report**:  
       - **Clean Translation**: Using outcomes to calibrate source reliability.  
       - **Bending**: Nyāya validity is binary (pramā/pramāṇa), while credence is gradable. **Distortion score: Mild** (structural mismatch).  
       - **Untranslatable**: "Validity" as a property *of the cognition itself*. Bayesianism only tracks credence shifts.  
       - **Residue Favors**: Nyāya. Bayesianism lacks a concept of *warrant* distinct from credence.

  ### 5. **Divine-Author Move**
     - **Nyāya Claim**: Veda's authority derives from Īśvara as the paradigm āpta (θ=1).  
     - **Formal Translation**:  
       - *Credence Target*: \(P(\text{Veda}_p) = 1\) for all propositions \(p\) in Veda.  
       - *Evidence*: Axiomatic \(\theta_{\text{Īśvara}} = 1\).  
       - *Likelihood*: \(P(\text{Veda} | p) = 1\) if \(p\) true, else 0.  
       - *Deference*: Maximal deference principle.  
     - **Residue Report**:  
       - **Clean Translation**: None (violates regularity).  
       - **Bending**: Approximating with \(P(\theta_{\text{Īśvara}} > 0.999999) \approx 1\). **Distortion score: Severe** (loses unimpeachability).  
       - **Untranslatable**: Incorrigible authority. Forfeits Nyāya's categorical guarantee.  
       - **Residue Favors**: Bayesianism. Nyāya must accept that divine "unimpeachability" is modeled as extreme confidence, not certainty.

  ---

  ### Pressure Point Resolution
  1. **Pramā as Factive vs. Credence**:  
     - *Conflict*: Pramā is factive (entails truth); credence is not.  
     - *Translation*: Credence \(P(p) \approx 1\) with high \(\theta_S\) *approximates* pramā but doesn't entail truth.  
     - *Residue*: **Untranslatable core**. Bayesianism lacks factivity – a fundamental limitation. Nyāya's radicalism survives: pramā is a success term, credence is not.

  2. **Unimpeachable Reliability**:  
     - *Conflict*: Bayesianism bars \(P(\theta_S = 1) = 1\) for contingencies.  
     - *Translation*: Must use extreme prior \(P(\theta_S > 1 - \epsilon) \approx 1\).  
     - *Forfeit*: Nyāya loses **infallibility**. Divine testimony becomes merely *highly reliable*, opening a gap for skepticism. Residue favors Bayesianism's regularity constraint.

  ---

  ### Overall Residue Summary
  | **Nyāya Element**       | Clean Translation        | Bent Translation         | Untranslatable Residue               | Residue Favors       |
  |--------------------------|--------------------------|--------------------------|--------------------------------------|----------------------|
  | Śabda irreducibility     | Evidence primitiveness   | None                     | None                                 | Parity               |
  | Āpta condition           | Deference                | Forced θ=1 (distortion)  | Constitutive trustworthiness         | Nyāya               |
  | Four conditions          | None                     | Likelihoods (distortion) | Cognition-arising conditions         | Nyāya               |
  | Extrinsic validity       | Calibration              | Gradable vs. binary      | Validity as normative property       | Nyāya               |
  | Divine author            | None                     | Extreme prior (distortion)| Incorrigible authority             | Bayesianism         |

  ### Key Conclusions
  - **Where Bayesianism Lacks Dimension**:  
    - Distinction between *evidence generation* (whether cognition arises) and *evidence weighting*.  
    - Binary factivity (pramā) vs. gradable credence.  
    - Non-empirical warrant (āpta as constitutive).  
  - **Where Nyāya is "Repackaged"**:  
    - Extrinsic validity reduces to reliability calibration.  
    - Śabda primitiveness is a modeling choice, not a metaphysical insight.  
  - **Radicalism Check**:  
    - Nyāya's irreducibility and extrinsic validity are genuinely radical (expose Bayesian blind spots).  
    - Āpta/divine claims *are* radical but forfeit coherence under Bayesian constraints (e.g., infallibility lost).  

  **Recommendation for Seminar**: Frame the untranslatable residues (factivity, cognition-arising conditions) as challenges *to* Bayesianism, exposing its limitations in handling categorical epistemic distinctions. The āpta/divine tension with regularity will provoke useful debate about probabilistic foundations.
