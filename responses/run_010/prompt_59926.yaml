answer: |-
  ### Issue #782: BUG: unasserted occurrences of moral vocabulary throw a semantic exception  
  **Opened by `@moral_dev` on 2023-10-05**  
  ![](https://img.shields.io/badge/status-open-red) ![](https://img.shields.io/badge/priority-high-critical)  
  **Reactions:** 👍 12 👎 1 😕 7  

  #### Minimal Reproduction Steps  
  1. **Embedded conditional case**:  
     Input: `If (lying.isWrong) { gettingBrotherToLie.isWrong }`  
     Expected: Coherent conditional evaluation.  
     Actual: `SemanticException: Cannot resolve 'isWrong' in unasserted context. State: [BOO(LYING)] not allocated.`  

  2. **Negation ambiguity**:  
     Input A: `~BOO(LYING)` → Intended: *It is not wrong to lie* (rejection of attitude).  
     Input B: `BOO(~LYING)` → Intended: *Not-lying is wrong* (positive attitude toward truth-telling).  
     Actual: Both resolve to identical state `BOO(NULL)`.  

  3. **Modus ponens failure** (stack trace):  
  ```  
  Argument:  
    1. If lying is wrong, then getting brother to lie is wrong.  
    2. Lying is wrong.  
    ∴ Getting brother to lie is wrong.  

  Stack Trace:  
    Step 1: Premise 1 parsed as CONDITIONAL(BOO(LYING) → BOO(GETTING_BROTHER_TO_LIE))  
    Step 2: Premise 2 asserts BOO(LYING) → ✓  
    Step 3: Attempt to derive BOO(GETTING_BROTHER_TO_LIE) via modus ponens  
    ERROR: Cannot evaluate CONDITIONAL without truth-apt values. Attitude engine requires assertion context.  
  ```  

  ---

  ### Comments  

  #### `@maintainer_quasi` (Core Team) · 2023-10-05  
  ![](https://img.shields.io/badge/status-wontfix-yellow)  
  **Reactions:** 👎 15 😠 8  

  > Patch `v0.8.3-higher-order-attitudes` handles this. We’ve deprecated `BOO()` in favor of `ATT(φ, ψ)`, where ψ is a higher-order attitude (e.g., `ATT(BOO(LYING), BOO(GETTING_BROTHER_TO_LIE))`). The conditional in Step 1 now compiles to `ATT(BOO(LYING), BOO(GETTING_BROTHER_TO_LIE))`, which is assertable. Marking as resolved.  

  #### `@moral_dev` · 2023-10-06  
  > @maintainer_quasi This only works for the examples in `/docs/tutorials/`. Try:  
  > `If (if lying is wrong then stealing is wrong) then cheating is wrong`.  
  > Result: `StackOverflowError` in attitude recursion. Your patch just relabels the crash. Reopening.  

  ---

  #### `@contrib_beingfor` · 2023-10-07  
  **PR #305**: Introduces `BeingFor(φ)` as primitive state type. Solves compositionality and closes #780 (wishful-thinking).  
  **Reactions:** 🎉 9 🤔 17  

  > Overview:  
  > - Replace `BOO/HURRAH` with `BeingFor(blaming_for_φ)`.  
  > - `~BeingFor(blaming_for_φ)` ≠ `BeingFor(blaming_for_¬φ)`.  
  > - Conditionals map to `BeingFor(blaming_for_φ) → BeingFor(blaming_for_ψ)`.  
  > Modus ponens preserved via state transitions. Passes all tests.  

  #### `@user_classic` · 2023-10-08  
  > @contrib_beingfor This is just cognitivism with extra steps. `BeingFor(blaming_for_φ)` is a truth-apt proposition about mental states. You’ve rewritten `CORRECT(φ)` and called it "expressivism." Flagging for scope creep.  

  ---

  #### `@fork_norm_expr` (Norm-Expressivist Fork) · 2023-10-10  
  > In our fork, every `BOO(φ)` allocates a `Plan(φ)` object (see RFC #142). Nesting works because `Plan(If φ then ψ)` binds sub-plans.  
  > **Downside**: `Plan` objects persist indefinitely → memory leak. GC can’t collect them without violating deontic constraints.  

  #### `@hybrid_advocate` · 2023-10-12  
  **Proposal**: Hybrid build. Bolt truth-conditional module (`DescriptiveEngine`) onto backend for non-moral terms.  
  ```  
  if (lying.descriptiveFact) { ... }  // Handled by DescriptiveEngine  
  if (lying.isWrong) { ... }          // Handled by AttitudeEngine  
  ```  
  **Reactions:** ❌ 22 💡 3  

  #### `@maintainer_quasi` · 2023-10-12  
  > @hybrid_advocate How do you sync the engines? What if `DescriptiveEngine` outputs `lying = harmful` but `AttitudeEngine` outputs `BOO(harmful) = false`? Now we have moral/non-moral disagreement *inside the system*. Breaks expressivism’s "no moral facts" axiom.  

  ---

  #### `@docs_pr` · 2023-10-15  
