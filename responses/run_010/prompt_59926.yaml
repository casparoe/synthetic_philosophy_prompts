  **Linked Issues**: Closes #201, #455, #780.  
  **Reactions:** 🙌 18 👀 10  

  > Example:  
  > `"Lying is wrong" is TRUE_FOR_OUR_PURPOSES` ≡ `Our community norms allocate BOO(LYING).`  

  ---

