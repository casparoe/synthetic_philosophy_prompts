  We are producing a joint statement from two epistemologists: a tracking theorist (TT) and a closure advocate (CA). They have been collaborating on the issue of whether knowledge is closed under known entailment, using a specific case and a proposed Inheritance Rule.

  **The Case Recap:**
  - Guard forms belief that the mat is working by stepping on it and hearing the alarm.
  - The mat being working entails that no bridge is fitted (since a bridge requires cutting the cable).
  - Nearest worlds where the mat is not working are ordinary failures (frayed cable, etc.) where stepping on it produces no alarm.
  - Worlds with a bridge fitted are more remote (since it requires a thief's intervention).
  - Actual world: mat is sound and no bridge.

  **The Proposal: Inheritance Rule**
  - When S believes p by method M, p entails q, and S competently deduces q from p, then the belief in q is credited to a composite method M-plus-deduction.
  - The tracking condition for the composite is evaluated in the nearest worlds where q is false. Because the composite method reaches q only through p, these are the nearest worlds where p is false (and M is used).
  - Thus, if M tracks p, the composite tracks q, and closure holds.

  **Task Breakdown:**
  1. **Agreed Claims**: Numbered list of claims both can sign, substantive enough (at least four) that an informed bystander might have denied them. Include:
     - Claims about the case (guard's knowledge, etc.)
     - What the Inheritance Rule entails for this case and for the skeptical scenario.
     - How the case resembles/does not resemble the standard skeptical scenario.
     - Whether the tracking conditions (with M as actually used) yield the differential verdict (i.e., guard knows p but not q) in this case, and what that agreement shows.

  2. **Disagreements**: Table with columns:
     - Subject (topic of disagreement)
     - Tracking Camp's Position (TT's own wording)
     - Closure Camp's Position (CA's own wording)
     - Neutral Statement (what is actually in dispute)
     - Crux? (whether it's a genuine crux or merely verbal)

  3. **Cruxes and Pre-registered Predictions**: For each row in the table marked as a crux, name the argument/case/variant that both accept as bearing on it. Then record each side's prediction. Specifically address:
     - Order reversed: guard lifts the mat first (checks cable) then steps and hears alarm. Would he then know no bridge is fitted? And is a theory that turns on the order condemned or vindicated?
     - Does the fact that q could easily have been checked bear on whether he knows q by deduction from p?
     - Is the Inheritance Rule's anti-sceptical consequence (making the tracking theorist concede knowledge of not being envatted) a fatal cost or an overlooked benefit?
     - In a variant with 1000 mats: guard runs the same check on each and deduces none is bridged. Does the tracking condition's indifference to base rates surface as a defect?

  4. **Falsifiers**: For each camp, what would make them give up their core commitment? (State as a verdict about a case or a principle they'd have to swallow.)

  5. **Verbal Residue**: Short closing section stating which parts of the dispute are just about how finely to individuate methods, and which parts survive any such stipulation.

  **Joint Statement Structure:**

  We write as if both parties are signing off.

  ---

  **Joint Statement on the Closure of Knowledge Under Known Entailment**

  After a year-long adversarial collaboration, we, the undersigned tracking theorist (TT) and closure advocate (CA), present our joint statement. We have focused on a specific case and a proposed Inheritance Rule, as stipulated. Below we outline our agreements, disagreements, and predictions for future work.

  ### 1. Agreed Claims

  Both parties agree to the following claims:

  1. **Literal Tracking Verdict in the Stipulated Case**: Under the tracking theory, with the method M individuated as *stepping on the mat and forming belief based on hearing the alarm*, and with the stipulated similarity ordering (where worlds with a bridge are remote and worlds with ordinary failures are near), the guard knows that the mat is working (p) but does not know that no bridge is fitted (q). This is because:
     - For p: In the nearest worlds where p is false (ordinary failures), the guard steps on the mat and does not hear the alarm, so he would not believe p. Hence, the belief tracks p.
     - For q: In the nearest worlds where q is false (a bridge is fitted), which are remote, the guard steps on the mat, hears the alarm (because of the bridge), and so believes p (and by entailment, would believe q). But in these worlds, q is false. However, because these worlds are remote, they are not the relevant ones for the tracking condition? Wait: the tracking condition for q requires looking at the nearest worlds where q is false. Since the bridge worlds are the only worlds where q is false, and they are remote, but they are still the worlds we must consider for the counterfactual of q. So, in the nearest q-false worlds (which are the bridge worlds), the guard does believe q (via believing p and deducing q). Therefore, the belief in q does not track q because in some of the closest q-false worlds, he still believes q. So differential verdict: knows p, not q.

     Both parties agree that the tracking theory, applied literally, yields this differential verdict. TT takes this as confirming the denial of closure, while CA takes it as revealing a flaw in the standard tracking condition.

  2. **The Inheritance Rule's Effect in the Case**: If we apply the Inheritance Rule to the case, then the guard's belief in q (no bridge is fitted) is credited to the composite method M-plus-deduction. The tracking condition for this composite is evaluated in the nearest worlds where q is false, which (by the rule) are the nearest worlds where p is false (since the composite method reaches q through p). In the nearest p-false worlds (ordinary failures), the guard uses M (steps on the mat) and does not hear the alarm, so he does not believe p and hence does not believe q. Therefore, the composite method tracks q. Thus, the Inheritance Rule would attribute knowledge of q to the guard.

  3. **The Inheritance Rule's Anti-Sceptical Consequence**: Both parties agree that the Inheritance Rule, if adopted, would force the tracking theorist to concede that in the standard brain-in-a-vat scenario, the agent knows that they are not a handless brain in a vat. This is because the belief in that proposition would be formed by a composite method (e.g., perception-plus-deduction) and the tracking condition for the composite would be satisfied in the nearest worlds where the sceptical hypothesis is false (which are the ordinary worlds where one has hands, etc.).

  4. **Dissimilarity to Standard Sceptical Scenario**: The guard case is not a standard sceptical scenario because:
     - The possibility of a bridge, though remote, is a concrete, physical possibility that the guard could easily check (by looking at the cable) but has chosen not to. In contrast, the brain-in-a-vat scenario is typically taken to be a far-fetched, global scenario that is not easily checkable by ordinary means.
     - The guard's ignorance of q (no bridge) is due to a specific, avoidable epistemic negligence (failing to check the cable) rather than an inescapable limitation of human cognition.

  5. **The Guard's Actual Knowledge of p**: Both parties agree that, intuitively, the guard does know that the mat is working (p) in the actual scenario. This is not undermined by the possibility of a bridge because that possibility is remote and the guard's method is reliable for detecting ordinary failures.

  6. **The Guard's Ignorance of q Without the Inheritance Rule**: Without the Inheritance Rule (or some other modification), the tracking theory entails that the guard does not know that no bridge is fitted (q). Both parties agree that this is also intuitive in this case because the guard has done nothing to rule out the bridge possibility.

  7. **The Inheritance Rule Restores Closure by Construction**: The rule, by design, ensures that whenever the original method M tracks p and the agent competently deduces q from p, the composite method will track q. Therefore, the rule guarantees single-premise closure.

  ### 2. Disagreements

  The following table captures our key disagreements. Each party has formulated their own position, and we provide a neutral statement of the dispute.

  | Subject | Tracking Camp's Position (TT) | Closure Camp's Position (CA) | Neutral Statement of Dispute | Crux? (Genuine/Verbal) |
  |---------|-------------------------------|------------------------------|------------------------------|-------------------------|
  | **The Fate of the Differential Verdict** | The differential verdict in the guard case (knows p, not q) is correct and illustrates a failure of closure that we must accept. | The differential verdict in the guard case is mistaken: the guard does know q by deduction from p, and the standard tracking condition errs by not crediting the composite method. | Whether the guard knows q (no bridge is fitted) by deducing it from p (mat is working) in the original case. | Genuine |
  | **The Inheritance Rule's Anti-Sceptical Consequence** | The Inheritance Rule's consequence that we must attribute knowledge of not being a brain in a vat is unacceptable because it removes a key advantage of tracking theories: their ability to explain why sceptical hypotheses are not known to be false. | The Inheritance Rule's anti-sceptical consequence is a benefit because it aligns with the intuitive plausibility of closure and avoids the implausible result that we lack knowledge of obvious entailments. | Whether the rule's forcing the tracking theorist to concede knowledge of the negation of sceptical hypotheses is a fatal cost or a welcome result. | Genuine |
  | **The Proper Individuation of Methods** | Methods must be individuated finely enough to reflect the actual causal process: in the guard case, the method for p is sensory (hearing the alarm), and for q it is deduction from p. These are distinct methods. | Methods should be individuated in a way that respects the agent's epistemic actions: when q is competently deduced from p, the method for q is the same as for p but extended by deduction. The composite method is the appropriate unit for evaluating knowledge of q. | How methods should be individuated for the purpose of applying tracking conditions, particularly when deduction is involved. | Partly Verbal (but with substantive implications) |
  | **The Role of Easy Checkability** | The fact that q (no bridge) could easily have been checked by the guard is irrelevant to whether he knows q by deduction from p. What matters is the method he actually used. | The easy checkability of q is relevant because it highlights that the guard's failure to use a direct method for q is negligent, and this negligence undermines his claim to know q by deduction from p. | Whether the easy checkability of q bears on the epistemic status of the guard's belief in q when formed by deduction. | Genuine |
  | **The Order of Actions** | The order of actions (stepping first vs. checking cable first) is epistemically relevant because it affects the method used. If the guard checks the cable first and then steps, he uses a different method for q. | The order of actions should not affect whether the guard knows q because the same evidence is ultimately available. The method for q should be seen as including both actions when performed. | Whether the order in which the guard performs the actions (stepping on the mat vs. inspecting the cable) affects whether he knows q. | Genuine |

  ### 3. Cruxes and Pre-registered Predictions

  For each genuine crux in the table, we identify a test case or variant and state our predictions.

  1. **Crux: The Fate of the Differential Verdict**  
     **Test Case: Order Reversed**  
     Variant: The guard first lifts the mat and inspects the cable, verifying it is intact (and thus that no bridge is fitted). Then he steps on the mat and hears the alarm, forming the belief that the mat is working.  
     - **TT's Prediction**: In this variant, the guard knows q (no bridge) by the direct method of inspection, and then knows p by stepping. The order matters: by checking first, he uses a direct method for q, so he knows q. But if he had only stepped and deduced, he would not know q. A theory that respects the order of actions is vindicated because it reflects the actual causal history of beliefs.  
     - **CA's Prediction**: The guard knows both p and q regardless of order. The reversal only makes explicit what was already implicit: the deduction from p to q is a valid route to knowledge. The order should not matter; what matters is the total evidence. A theory that turns on the order is condemned because it makes knowledge depend on arbitrary temporal factors.  
     **What would show one wrong?** If, in the reversed order, the guard does not know q until after he steps (CA would be wrong) or if in the original order the guard knows q without checking (TT would be wrong).

  2. **Crux: The Role of Easy Checkability**  
     **Test Case: Same as original, but emphasize checkability**  
     We consider whether the guard's knowledge of q by deduction is affected by the fact that he could have easily checked the cable.  
     - **TT's Prediction**: Easy checkability does not affect the tracking condition for the deduced belief. The guard does not know q by deduction even though he could have checked, because the method he used (deduction from p) does not track q.  
     - **CA's Prediction**: Easy checkability is a red herring. The guard can know q by deduction from p regardless of whether he could have checked directly. However, if the deduction is the only route and direct check is impossible, then deduction alone must suffice.  
     **What would show one wrong?** If in a case where direct check is impossible, the guard still cannot know q by deduction (CA would be wrong). Or if in a case where direct check is possible but not used, the guard can know q by deduction (TT would be wrong).

  3. **Crux: The Inheritance Rule's Anti-Sceptical Consequence**  
     **Test Case: Standard Brain-in-a-Vat Scenario**  
     Apply the Inheritance Rule to the sceptical case: an agent believes she has hands by perception (M), and deduces that she is not a handless brain in a vat (q).  
     - **TT's Prediction**: Attributing knowledge of q in this case is a fatal cost of the Inheritance Rule because it forces us to say we know we are not brains in vats, which is counterintuitive and removes the tracking theorist's response to scepticism.  
     - **CA's Prediction**: This consequence is an overlooked benefit because it aligns with the common sense view that we do know we are not brains in vats, and the tracking theory should not deny that.  
     **What would show one wrong?** If it turns out that we do not know we are not brains in vats (CA would be wrong) or if we do (TT would be wrong). But since this is a matter of intuition, it may not be settled empirically.

  4. **Crux: Base Rates and Multiple Mats**  
     **Test Case: Thousand Mats**  
     Variant: The guard is responsible for 1000 mats, each with a pressure mat and alarm. Each morning, he steps on each mat and hears each alarm. He deduces that none of the mats is bridged.  
     - **TT's Prediction**: The tracking condition is indifferent to base rates. For each mat, the method for p (mat working) tracks p (in the nearest non-working worlds, no alarm). But for each q_i (no bridge for mat i), the nearest q_i-false world is one with a bridge on that mat, which is remote, and in that world he still believes q_i (via believing p_i and deducing). So he does not know any q_i. This is a defect of the unmodified tracking theory because it ignores the low base rate of bridges.  
     - **CA's Prediction**: The guard does know each q_i because the composite method (stepping-plus-deduction) for each mat tracks q_i (since the nearest q_i-false world is a bridge world, but the rule says to look at the nearest p_i-false world, which is an ordinary failure). Under the Inheritance Rule, he would know. Without the rule, the standard tracking condition is defective in this case because it doesn't account for the deduction.  
     **What would show one wrong?** If in the thousand mats case, the guard intuitively knows that no mat is bridged (TT would be wrong) or if he does not (CA would be wrong without the Inheritance Rule).

  ### 4. Falsifiers

  For each camp, what would make them give up their core commitment?

  - **Tracking Theorist (TT)**: TT would give up the denial of closure if presented with a case where: (i) S knows p, (ii) S knows p entails q, (iii) S competently deduces q from p, (iv) the method for p tracks p, (v) the method for q (if considered separately) does not track q, but (vi) it is undeniable that S knows q. However, TT does not think such a case exists. Alternatively, if it were shown that the tracking condition is not necessary for knowledge (e.g., by a clear case of knowledge without tracking), TT would abandon tracking altogether.

  - **Closure Advocate (CA)**: CA would give up the insistence on closure if presented with a case where: (i) S knows p, (ii) S knows p entails q, (iii) S competently deduces q from p, but (iv) it is clear that S does not know q, and (v) no reformulation of the tracking condition (or other conditions) can restore closure without leading to more severe problems (e.g., rampant scepticism or trivialization of knowledge). CA would also abandon the project of modifying tracking if it were shown that knowledge is not closed in general.

  ### 5. Verbal Residue

  We have come to regard a portion of our dispute as verbal: the debate over how finely to individuate methods. Specifically, whether the method for a deduced belief should be considered the same as the method for the premise or a composite. This can be resolved by stipulation: if we stipulate that methods include the deduction step, then the tracking condition for the conclusion can be evaluated accordingly. However, even with such stipulation, substantive disagreements remain:

  - Whether the tracking condition, when applied to the composite method, is the correct condition for knowledge (TT denies this because it ignores the actual causal process and the remote possibilities; CA affirms it).
  - Whether the order of actions affects knowledge (TT: yes; CA: no).
  - Whether the possibility of easy checking undermines or is irrelevant to knowledge by deduction.

  These issues are not resolved by method individuation and require further investigation.

  Signed,  
  [Tracking Theorist]  
  [Closure Advocate]
answer: |-
  ### Joint Statement on the Closure of Knowledge Under Known Entailment  
  **Produced by the Tracking Theorist (TT) and Closure Advocate (CA)**  
  *At the close of a year-long adversarial collaboration*

  #### 1. Agreed Claims  
  Both parties endorse the following substantive claims about the guard case, the Inheritance Rule, and their implications. An informed bystander might have denied each, as they extend beyond the stipulations:  

  1. **The guard knows the mat is working (p) via his method.** Under the tracking theory’s literal application (M = stepping on the mat and forming belief based on hearing the alarm), the guard’s belief that p tracks p: in the nearest worlds where p is false (ordinary failures like frayed cables), he does not hear the alarm and thus does not believe p. This satisfies the tracking condition for knowledge of p.  
  2. **The guard lacks knowledge that no bridge is fitted (q) under literal tracking.** For q, the tracking condition fails: the nearest worlds where q is false (bridged-mat worlds) are remote, but in those worlds, the guard still hears the alarm (due to the bridge) and believes p (and thus q via deduction). Since he believes q in these q-false worlds, the belief does not track q.  
  3. **The Inheritance Rule secures closure in this case.** Applied to the guard, the rule re-individuates his method for q as M-plus-deduction. The tracking condition for this composite is evaluated in the nearest worlds where q is false, which (per the rule) are the nearest worlds where p is false (ordinary failures). In those worlds, he does not believe q, so the composite tracks q. Thus, the rule attributes knowledge of q to the guard.  
  4. **The case differs from standard scepticism in two key ways.** First, the bridge possibility, though remote, is *easily checkable* by the guard (via inspecting the cable), whereas sceptical scenarios (e.g., envatted brains) are not practically checkable. Second, the guard’s ignorance of q stems from *negligence* (failing to inspect), not global underdetermination.  
  5. **The Inheritance Rule forces anti-sceptical concessions.** In the brain-in-a-vat scenario, the rule makes the belief “I am not a handless brain in a vat” inherit the tracking of “I have hands,” compelling the tracking theorist to attribute knowledge of the sceptical hypothesis’s negation.  
  6. **Literal tracking’s differential verdict is intuitive here.** Both parties agree that in the stipulated case, it is intuitive that the guard knows p but not q—unlike in sceptical cases, where denying knowledge of q (e.g., “I am not envatted”) is controversial.  
  7. **Agreement on this verdict reveals a challenge for tracking.** TT takes it as confirming closure’s failure; CA takes it as exposing a flaw in literal tracking’s method-individuation.  

  #### 2. Disagreements  
  The table below captures core disagreements. Each party’s position is self-formulated; the neutral column avoids partisan vocabulary.  

  | Subject | Tracking Camp’s Position (TT) | Closure Camp’s Position (CA) | Neutral Statement of Dispute | Crux? (Genuine/Verbal) |  
  |---------|--------------------------------|-------------------------------|-------------------------------|--------------------------|  
  | **Closure’s fate** | “Single-premise closure fails because knowledge is method-relative: S can know p via M, deduce q, yet lack knowledge of q if M does not track q when evaluated separately.” | “Closure must hold; any condition permitting the differential verdict is flawed. Beliefs from competent deduction inherit the security of their premises.” | Whether knowledge of q obtained solely by deduction from known p requires a separate tracking evaluation for q. | Genuine |  
  | **Inheritance Rule’s anti-sceptical cost/benefit** | “The rule’s consequence—attributing knowledge of not being envatted—is a fatal cost. It surrenders tracking’s key advantage: explaining why sceptical hypotheses are unknowable.” | “The rule’s anti-sceptical consequence is a benefit. It aligns with commonsense: we know entailed propositions sceptics deny, and tracking should accommodate this.” | Whether the rule’s forcing knowledge of sceptical hypotheses’ negation undermines or strengthens tracking. | Genuine |  
  | **Role of easy checkability** | “Easy checkability of q is irrelevant to whether S knows q by deduction from p. Knowledge depends solely on the method used, not unused alternatives.” | “Easy checkability matters. When q is easily checkable but unchecked, deducing q from p is epistemically irresponsible; thus, S lacks knowledge of q.” | Whether the guard’s ability to easily check the cable affects his knowledge of q when deduced from p. | Genuine |  
  | **Method individuation** | “Methods must be individuated by their actual causal triggers: M (sensory for p) and deduction (for q) are distinct. The Inheritance Rule conflates distinct processes.” | “Methods should reflect epistemic agency: M-plus-deduction is a single, extended method for q. The rule correctly re-individuates to capture this.” | Whether deduction from p constitutes a new method for q or extends the original method. | Partly verbal |  
  | **Order sensitivity** | “The order of actions (e.g., stepping vs. inspecting first) affects the method used and thus knowledge. Order matters because it alters causal history.” | “Order is irrelevant; knowledge depends on total evidence. If the guard has the same evidence, he knows q regardless of sequence.” | Whether temporal order of evidence-gathering actions affects knowledge of q. | Genuine |  

  #### 3. Cruxes and Pre-registered Predictions  
  For each genuine crux, we specify a test case/variant and predictions. Predictions are falsifiable over a decade.  

  - **Crux: Closure’s fate**  
    **Test case: Order reversal**  
    Variant: Guard inspects the cable first (verifying no bridge), then steps on the mat and hears the alarm.  
    - TT’s prediction: Guard knows q (no bridge) *only* via inspection, not deduction. If he deduces q from p after stepping, he still lacks knowledge of q that way. Theories sensitive to order are vindicated: they reflect how knowledge is method-dependent.  
    - CA’s prediction: Guard knows q via either inspection or deduction, regardless of order. Theories turning on order are condemned: they make knowledge arbitrary.  
    *Falsifiability*: If order reversal yields knowledge of q *only* via inspection (not deduction), CA is wrong. If deduction alone suffices for q regardless of order, TT is wrong.  

  - **Crux: Role of easy checkability**  
    **Test case: Uncheckable q**  
    Variant: The cable is sealed; guard cannot inspect it. He deduces q from p as before.  
    - TT’s prediction: Easy checkability is irrelevant. Guard identically lacks knowledge of q—same as original case.  
    - CA’s prediction: Without easy checkability, deduction can yield knowledge of q; guard knows q.  
    *Falsifiability*: If guard knows q when q is uncheckable, TT is wrong. If he still lacks knowledge, CA is wrong.  

  - **Crux: Inheritance Rule’s anti-sceptical consequence**  
    **Test case: Vat scenario under the rule**  
    Variant: Agent believes “I have hands” by perception (M), deduces “I am not a handless brain in a vat” (q).  
    - TT’s prediction: Attributing knowledge of q is counterintuitive; >90% of non-philosophers will deny we know we are not envatted.  
    - CA’s prediction: Attributing knowledge of q aligns with intuition; >70% will affirm we know we are not envatted.  
    *Falsifiability*: Empirical surveys in 10 years showing strong majority intuition against (or for) knowing q falsifies CA (or TT).  

  - **Crux: Base rates and scaling (thousand-mats variant)**  
    **Test case: Guard checks 1000 mats identically, deduces no bridge on any.**  
    - TT’s prediction: Literal tracking denies knowledge for each q_i (“mat i has no bridge”)—same as single mat. Base rates (e.g., bridge rarity) do not affect tracking. This is defensible: rare threats need not be known.  
    - CA’s prediction: The Inheritance Rule grants knowledge of each q_i. Without it, literal tracking’s indifference to base rates is a defect: it ignores low probability of bridges across many mats.  
    *Falsifiability*: If guard intuitively knows no mat is bridged in the 1000-mat case, TT is wrong. If he does not, CA is wrong.  

  #### 4. Falsifiers  
  What would compel each camp to abandon its core commitment?  

  - **Tracking Theorist (TT)** would give up denying closure if confronted with a case where:  
    (i) S knows p via M, (ii) S knows p entails q, (iii) S deduces q from p, (iv) M tracks p, (v) q’s negation is remote (like bridge worlds), *and* (vi) it is undeniable that S knows q (e.g., universal intuition affirms it).  
    Principle to swallow: “Knowledge is closed under known entailment, even when the tracking condition for q fails separately.”  

  - **Closure Advocate (CA)** would give up insisting on closure if confronted with a case where:  
    (i) S knows p via M, (ii) S knows p entails q, (iii) S deduces q from p, (iv) M tracks p, *but* (v) S clearly lacks knowledge of q *and* (vi) no method-reformulation (e.g., Inheritance Rule) restores closure without attributing knowledge in clear non-cases (e.g., to deceived agents).  
    Principle to swallow: “Knowledge can fail to transmit through known entailment, even for non-sceptical propositions.”  

  #### 5. Verbal Residue  
  We concur that **method individuation** is partly verbal: disputes over whether deduction “extends” M or creates a new method reduce to terminological choices about “method” granularity. This portion dissolves under stipulation (e.g., if “method” is defined to include deduction).  

  However, **substantive disagreements survive**:  
  - Whether the tracking condition must apply to *actually used methods* (TT) or *optimally re-individuated methods* (CA).  
  - Whether easy checkability or action order affects knowledge, independent of method stipulation.  
  - Whether the Inheritance Rule’s consequences (e.g., anti-scepticism) are acceptable, regardless of method labels.  

  This concludes our joint statement. We remain divided on closure but agree on the case’s lessons and the need for further empirical testing.  

  — Signed,  
  **The Tracking Theorist**  
  **The Closure Advocate**
