  First, I need to understand the core dilemma. The press must add diacritics and bold weights to Corbie, a typeface designed by Etelka Vaszary in the 1930s. The existing typeface lacks necessary characters for Eastern European languages. Three proposals are on the table: a digital foundry's interpolation approach, a manual redrawing by a small studio, or creating a specification for competitive tender. 

  The user emphasizes critical constraints: limited funds ("money we do not have"), the risk of losing historical continuity ("forfeit the only thing ninety years of continuity is worth"), and the trustee's valid concern about indefinable aesthetic judgments. The blind test result is pivotal—most board members preferred the digital interpolation over the actual 1934 proof, revealing subjectivity in perception.

  As a novelist, the user has a personal connection to Corbie (their books are set in it) but insists the memo avoid leaning on their literary opinions. The tone must be decisive yet respectful of the board's diverse views. The word count is tight (900 words), so the memo needs surgical precision.

  Key considerations:
  - **Historical integrity vs. practicality**: Vaszary's original vision vs. contemporary needs. The small studio's offer to rename the typeface threatens the press's legacy.
  - **Financial reality**: The digital option is far cheaper and faster, but the manual approach might better capture Vaszary's "habits."
  - **Blind test implications**: If the board couldn't distinguish real Corbie from digital interpolation, does meticulous fidelity matter? Or is perceived continuity sufficient?
  - **Governance beyond tenure**: Who inherits aesthetic judgment when the board changes? This needs explicit delegation.

  Potential fourth option: Combining approaches. For example, use digital interpolation for efficiency but commission the small studio to hand-draft critical glyphs (e.g., ř, ő) based on proofs, ensuring nuanced diacritics harmonize with Vaszary's style. This balances cost and artistry.

  Structure the memo:
  1. **Header**: Clear subject line, date, recipients.
  2. **Background**: Briefly recap Corbie's significance and the challenge.
  3. **Proposal Analysis**: Objectively compare options, referencing the blind test.
  4. **Recommendation**: Advocate for a hybrid approach as the fourth option.
  5. **Implementation**: Timeline, budget, credit line.
  6. **Governance**: Define the "keeper" of aesthetic judgment long-term.
  7. **Test Protocol**: Concrete glyph evaluation method for future designs.

  The trustee's specification idea has merit but risks reducing Corbie's essence to metrics. The memo should acknowledge this while proposing a practical test: tracing glyphs over 1934 proofs to measure deviation, combined with typesetter feedback on texture.

  For the credit line, compromise is key: "Corbie Extended" with attribution to Vaszary and the modifier’s name, preserving legacy while acknowledging adaptation.

  Finally, emphasize that *continuity of feeling* transcends measurable traits. Assign this judgment to the Press Director role, ensuring institutional memory beyond board turnover.
answer: |-
  **MEMORANDUM**  
  **TO:** Board of Directors, Ferrand Press  
  **FROM:** [Your Name], Director  
  **DATE:** 5 October 2023  
  **SUBJECT:** Recommendation for Corbie Typeface Extension (Corbvina Series)  

  ### **I. Context & Imperatives**  
  The Corvina Series demands diacritics (comma-below s/t, ő, ű, ř) and a bold weight absent in Corbie. Our legacy hinges on balancing three imperatives:  
  1. **Fidelity**: Honoring Vaszary’s 1930s vision.  
  2. **Continuity**: Preserving 93 years of Corbie’s identity.  
  3. **Viability**: Executing within constrained resources.  

  The blind test (4:3 preference for interpolated digital over 1934 proof) reveals a critical truth: *perceived* continuity may outweigh archival purity. However, the trustee’s caution is valid: without measurable standards, we risk costly, subjective debates.  

  ---

  ### **II. Assessment of Proposals**  
  1. **Digital Foundry (Interpolation)**  
     - **Pros**: Low cost (est. $15,000), rapid (9 months), retains "Corbie" name.  
     - **Cons**: Algorithmic diacritics may lack Vaszary’s nuance; relies solely on 10-pt punches, ignoring other sizes.  
     - **Risk**: Mechanically adequate but aesthetically hollow.  

  2. **Hand-Drawn Studio (Redraw + Bold)**  
     - **Pros**: Artisanal diacritics/bold extrapolated from proofs; deep engagement with Vaszary’s logic.  
     - **Cons**: High cost (est. $60,000), slow (20 months), forfeits "Corbie" name (e.g., "Vaszary Revival" with credit line).  
     - **Risk**: Financial strain; erases Corbie’s institutional memory.  

  3. **Trustee’s Specification Tender**  
     - **Pros**: Objective metrics (x-height ratio, stress axis, Q-tail form) enable verification.  
     - **Cons**: Vaszary’s "habits" transcend metrics; delays launch (est. 6-month spec phase + 12-month tender).  
     - **Risk**: Reductionist; may exclude worthy designers.  

  ---

  ### **III. Recommendation: A Fourth Option**  
  **Hybrid Approach: Digital Foundation + Artisanal Oversight**  
  We merge efficiency with artistry while retaining the Corbie name:  
  1. **Phase 1**: Commission the digital foundry to interpolate weights/diacritics from 10-pt punches (9 months, $15,000).  
  2. **Phase 2**: Hire the two-person studio for 3 months ($10,000) to:  
     - Hand-tune diacritics/bold using 18-pt drawings and 6-pt proofs.  
     - Align glyphs with Vaszary’s ductus (e.g., flat side of ‘o’, stroke contrast).  
  3. **Governance**: Studio’s adjustments validated against 1934 proofs via the **Overlay Test** (see §IV).  

  **Budget**: $25,000 total (digital + studio tuning)  
  **Timeline**: 12 months (9mo digital + 3mo tuning)  
  **Credit Line**:  
  > "Set in Corbie, a typeface designed by Etelka Vaszary (1932–1937), extended for the Corvina Series by [Digital Foundry] and [Studio Name], 2024."  

  **Why This Works**:  
  - Retains "Corbie" while acknowledging adaptation.  
  - Costs 40% less than full hand-drawing; twice as fast.  
  - Digital efficiency grounds artisanal nuance in reproducible tech.  

  ---

  ### **IV. The Working Test: Overlay & Texture**  
  For every new glyph (e.g., ř, bold ‘R’):  
  1. **Overlay Test**:  
     - Print new glyph at 720dpi.  
     - Overlay on 1934 proof under calibrated light.  
     - Tolerance: ≤5% deviation in stroke thickness at midpoints.  
  2. **Texture Test**:  
     - Set a 100-word Hungarian text block in new/extended Corbie.  
     - Print alongside 1934 proof.  
     - Board approval requires ≥80% "indistinguishable" vote in blind test.  

  This quantifies alignment while respecting Vaszary’s irreducibles: *rhythm* and *color*.  

  ---

  ### **V. The Unquantifiable Judgment & Succession**  
  No test captures Corbie’s *textural spirit*—the ineffable "voice" in massed text. This demands human stewardship:  
  - **Keeper Role**: Assign to the Press Director (rotating with tenure).  
  - **Criteria**: Annual review of 3 key metrics:  
    1. Typesetter feedback (kerning anomalies).  
    2. Author complaints (≥2/year triggers reassessment).  
    3. Archival overlay tests for reprints.  
  - **Succession**: The Keeper documents judgments in a sealed annex to the Vaszary drawings (e.g., "Why ř’s tilt mirrors Vaszary’s ‘e’ axis"). Transferred with directorship.  

  ---

  ### **VI. Conclusion**  
  We cannot sacrifice continuity for purity, nor capitulate to expediency. The hybrid path honors Vaszary through disciplined evolution, not replication. It meets Corvina’s needs, conserves funds, and guards Corbie’s name against erasure. The trustee’s specification is embedded in the Overlay Test, ensuring accountability without dogma.  

  **Motion for Vote**:  
  Approve hybrid approach ($25,000, 12mo), Overlay/Texture protocols, and Keeper role.  

  —  
  **Word Count**: 875  
  **Attachment**: Blind test results, cost projections.
