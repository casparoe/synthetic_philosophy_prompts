  Below is a complete, print-ready game design for your seminar, addressing all requirements while avoiding identity-based roles and focusing on mechanical asymmetries. The activity runs in 75 minutes, with phases designed to reveal the **minimal comparability assumptions** required for different decisions.

  ---

  ### **Game Title**: The Scale of Justice  
  **Core Insight**: Decisions require varying degrees of interpersonal comparability, from ordinal to cardinal, and calibration can anchor levels but not marginal rates.  

  ---

  ### **Materials (Print-Ready)**  
  #### **1. Player Cards (6 unique types, 4 copies each for 24 students)**  
  *Each card has two sections: "Your Well-Being" (converts tokens to private points) and "Your Reporting Rule" (how to publicly report well-being on 0–10).*  

  | Card Type | Well-Being Function (Secret!)                                                                 | Reporting Rule (Public Behavior)                                                                                            |  
  |-----------|-----------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|  
  | A         | Points = 5 × tokens                                                                           | Report = Round(Points / 10) (e.g., 50 points → 5, 63 points → 6)                                                           |  
  | B         | Points = 20 × √(tokens)                                                                       | Report = Round(Points / 10) + 2 (capped at 10) (e.g., 40 points → 6 + 2 = 8; 90 points → 9 + 2 = 10)                       |  
  | C         | Points = (5 × tokens) - (0.1 × tokens²)                                                      | Report = Round(Points / 10) - 2 (floored at 0) (e.g., 40 points → 4 - 2 = 2; 10 points → 1 - 2 = 0)                        |  
  | D         | Points = 6 × tokens (if tokens ≤ 8); 48 + (3 × (tokens - 8)) (if tokens > 8)                 | Report = 0 if Points < 50; 10 if Points ≥ 50 (ignores all intermediate values)                                             |  
  | E         | Points = 8 × tokens                                                                           | Report always = 5 if Points < 60; 6 if 60 ≤ Points < 80; 7 if Points ≥ 80 (ignores extremes)                               |  
  | F         | Points = 15 × tokens for token 1; 10 × tokens for tokens 2–5; 5 × tokens for tokens 6+       | Report = Round(Points / 10) but only even numbers (e.g., 47 points → 4.7 → 5 → rounds to 4 or 6? → **Rule:** Choose nearest even #) |  

  **Notes**:  
  - **No identity labels**: Asymmetries are in math/reporting rules (e.g., diminishing returns, thresholds, fixed scales).  
  - **True points** range 0–100; tokens are integers.  

  #### **2. Vignette for Calibration (Identical for All)**  
  > *"Alex is a 28-year-old who works as a library assistant. They live in a small apartment alone, have enough income for essentials and occasional dinners out, but no savings. They have two close friends and enjoy reading. Last year, they took a 3-day vacation. They are generally healthy but worry about job stability."*  

  ---

  ### **Game Phases & Timeline (75 Min Total)**  
  **Group Setup**: 24 students → 6 groups of 4. Each group has 1 of each card type (A–F).  

  | Phase   | Time     | Activity                                                                                                                                                               | Instructor Role                                                                                               |  
  |---------|----------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|  
  | **0. Setup** | 5 min    | Distribute cards. Explain: "Tokens = resources. Convert tokens to YOUR points. Report well-being publicly on 0–10 using YOUR rule. Never reveal your card."            | Emphasize secrecy. No real money; "points" are hypothetical.                                                 |  
  | **1. Ordinal Choice** | 15 min   | **Task**: *Groups choose between two policies:*<br>- **Policy X**: All get 10 tokens.<br>- **Policy Y**: All lose 1 token, but gain 5 well-being points.<br>**Catch**: Y is a **Pareto improvement** (all truly gain: Card A gains +0.5, B +2.3, C +2.4, D +2.5, E +1, F +0.5). But reports may not show this! | Silent observer. After vote, ask: "Did reports prove Y was better for everyone?" (Likely no—shows **ordinal sufficiency**). |  
  | **2. Cardinal Sum** | 20 min   | **Task**: *Split 40 tokens to maximize the SUM of your group’s reported well-being.*<br>**Catch**: Groups optimize reported sums, not true well-being (e.g., may overallocate to binary reporters). | Reveal true sums post-decision (e.g., "Your allocation yielded 240 true points vs. 280 max possible").        |  
  | **3. Calibration** | 20 min   | **Task**: <br>1. *All rate Alex’s life (vignette) on 0–10 using your scale.*<br>2. *Rescale all reports using Alex’s rating as anchor.*<br>3. *Re-split 5 tokens taken from one member given to another—does rescaled sum increase?*<br>**Catch**: Rescaling fixes **levels** (Alex = 6 for all) but not **marginal rates** (e.g., taking 1 token from F gives 15 points; giving to A gives 5 points—net loss, but rescaled reports may hide this). | Orchestrate ratings. Guide rescaling math: `Rescaled Report = (Original Report) × (6 / Your Alex Rating)`.    |  
  | **Debrief** | 15 min   | Discuss:  <br>- Phase 1: Only needed **ordinal self-comparison** (did YOU gain?). Pareto improvements don’t need interpersonal comparisons.<br>- Phase 2: Required **cardinal & comparable units** (true points). Arguments like "we need to help the binary reporter!" collapse without cardinality.<br>- Phase 3: **Calibration anchors levels**, not marginal rates. "Alex’s life = 6" doesn’t mean 1 token has same value for all. | Use group experiences to map arguments to assumptions. Note: Real policy lacks a "true point oracle."          |  

  ---

  ### **Predicted Problems & Fixes**  
  - **"Over-reporter accused of lying"**:  
    - **Prevent**: Frame rules as "psychological differences," e.g., "Card B feels optimistic; Card C feels cautious."  
    - **Fix**: Intervene: "Your card reflects how you express well-being—not lying. Discuss how this affects trust in reports."  
  - **Group indecision**:  
    - **Fix**: Impose time limits. Phase 1: "Vote in 60 seconds." Phase 2: "Submit allocation in 5 minutes."  
  - **Math confusion in calibration**:  
    - **Fix**: Provide formula: `Rescaled Report = Original Report × (6 / Your Alex Rating)`. Do one example live.  

  ---

  ### **Structural Limitations**  
  1. **The Oracle Problem**: You (instructor) know "true points," but real-world debates lack this. Students may over-rely on "truth" instead of debating epistemology.  
     - **Mitigation**: Debrief explicitly: "In reality, no one holds these true points—how would this change your arguments?"  
  2. **Simplified Reporting Rules**: Real well-being reporting involves cultural/psychological nuances beyond mechanical rules.  
  3. **Vignette Limitations**: Alex’s life anchors levels but can’t resolve how individuals value changes (marginal rates).  

  ---

  ### **Debrief Script (Key Points)**  
  > "In Phase 1, you only needed to know if *you* were better off—no interpersonal comparison. That’s why Policy Y passed even with noisy reports.  
  >  
  > In Phase 2, arguing to ‘give more to binary reporters’ assumed you could compare gains across people. But without true cardinality, you can’t prove this maximizes well-being.  
  >  
  > In Phase 3, calibration fixed how you ‘leveled’ Alex’s life, but didn’t harmonize how much *extra* tokens helped each of you.  
  >  
  > **The takeaway**: Some decisions (e.g., Pareto improvements) need minimal comparability. Others (e.g., utilitarianism) need stronger assumptions. Calibration helps, but not with marginal choices."  

  ---

  This design ensures students *experience* comparability assumptions through dilemmas, avoids reductive "can't compare" takeaways, and meets your pedagogical and ethical constraints. Let me know if you need adjusted card math or vignette text!
