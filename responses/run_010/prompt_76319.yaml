  On the Berkeleyan counter to (E): The "dissolution as revelation" point is clever but ultimately question-begging. It assumes what it needs to prove - that collapse indicates emptiness rather than cognitive limitation. (E) remains distinct from (A) by focusing on the measurement problem in self-applied faculties, whereas (A) is about scope confusion.

