prompt: |-
  I serve as secretary — non-voting — to a nine-member board that certifies hospital pharmacy residency programs. The board clears six programs per afternoon, on paper ballots, and its members are part-time practitioners with no training in social choice; I have a ballot template, a laptop, and no software. Our bylaws have us vote separately on each of four published criteria (supervision ratio, didactic curriculum, preceptor qualifications, assessment outcomes) and then vote on certification, which requires all four findings favorable. Findings are published with the decision, and the appeal panel that reviews our work reads nothing but the minutes, so the chain of findings has to be consistent on its face. The chair votes only to break a tie. I want a procedure I can execute in the room, not a lecture on the theory underneath it.

  Three situations from the last two cycles:

  Alpha. Five members find the supervision ratio adequate, five find the curriculum adequate, five find the preceptor qualifications adequate — but they are three different fives, and no finding commands more than five. On certification itself, three vote yes. Aggregating premise by premise, the board certifies; taking the certification vote, it does not. I think it should certify: the published findings would say every criterion is met, and refusing a program that meets every criterion as we found it would not survive appeal. But I also think it matters that six of the nine, asked directly, want it refused, and I do not want the procedure to render that majority invisible.

  Beta. A revocation, with three grounds available: falsified rotation records, inadequate preceptor supervision, curriculum below standard. Ground one beats ground two five to four; ground two beats ground three five to four; ground three beats ground one five to four. The bylaws list them in a fixed order and we vote in that order, taking amendments in turn, so a member who wants ground three can secure it by moving the order. I think a sequence should not be able to manufacture an outcome — and yet I think the board is entitled to rest a revocation on the ground it can defend most forcefully, and reordering is how a member presses for that ground.

  Gamma. A numeric criterion: at least eighty percent of residents passing our assessment at the first attempt. Asked for individual estimates, members give 82, 82, 81, 80.5, 80.5, 79.5, 77, 77, 71. The median is 79.5, so the program fails; but on the finding as worded — does the program meet the threshold — five vote yes, so it passes, and on the certification vote it is certified. I think the board should have been permitted to hear the estimates and then re-take the finding, on which it would fail. I cannot say why I want a second chance here and not in Alpha.

  Deliverable: exactly five numbered items, in the order I would execute them, with nothing before or after — no introduction, no summary, no closing caveat. Each item is one stage, two or three sentences at most: the question I put to the vote at that stage, the rule for aggregating it, and what I enter in the minutes. Where Alpha, Beta, or Gamma turns on that stage, end the item with what the stage does to that program. Abstentions and recusals must be disposed of somewhere within the five. One item must identify the point at which the procedure stops computing and hands the question back to the board as a matter of values rather than arithmetic, and one must name a kind of case it cannot settle at all. Between them, the five must also tell me which of my three verdicts they overrule.
reasoning: |-
  Hmm, the user is a secretary for a hospital pharmacy residency certification board. They need a voting procedure that's practical, executable in the room without software, and addresses three problematic scenarios (Alpha, Beta, Gamma) from past cycles. The board has nine part-time members with no social choice training, votes on paper ballots, and must publish consistent findings. The chair votes only to break ties.

  Key requirements from the user:
  - Exactly five numbered steps
  - Each step: question put to vote, aggregation rule, what gets minuted
  - Must handle abstentions/recusals
  - One step must identify when to stop computing and return to board's judgment
  - One step must name cases the procedure can't settle
  - Must overrule at least one of user's three verdicts (Alpha/Beta/Gamma)

  Breaking this down:

  First, the Alpha scenario reveals a Condorcet paradox where majority support for individual criteria doesn't translate to the final vote. The user thinks certification should happen based on criteria findings but worries about ignoring the direct "no" majority. My procedure will need to resolve this conflict.

  For Beta, it's about cyclic preferences in revocation grounds. The user wants to prevent agenda manipulation but respects members' right to push preferred grounds. This requires a voting method resistant to strategic ordering.

  Gamma involves a numeric threshold where median data contradicts the majority vote. The user wants reconsideration here but not in Alpha - suggesting they value objective thresholds over subjective votes in some cases.

  Designing the five steps:

  1. **Criterion-by-Criterion Voting**: Start with individual criteria votes using majority rule. Handles Alpha by making criteria findings binding. For Gamma, the 80% threshold vote stands initially.

  2. **Consistency Check**: Detect when criteria majorities conflict with direct outcome vote (like Alpha). Stop computing here and flag for board discussion - this addresses the "values vs arithmetic" requirement. In Alpha, this would trigger debate about the contradiction.

  3. **Direct Outcome Vote**: Hold the up/down certification vote after criteria are settled. For revocation cases like Beta, do this first to avoid agenda issues.

  4. **Ground Ranking (for revocation)**: Use a Borda count if revocation is likely, preventing cyclic manipulation in Beta. This overrules the user's acceptance of reordering tactics.

  5. **Deadlock Protocol**: Define tie-breaking and name unsolvable cases (like Condorcet cycles that persist after discussion). Handles abstentions via reduced majority threshold.

  Key overrules:
  - Beta: Rejects reordering in favor of Borda count
  - Gamma: Accepts the initial majority vote (user wanted reconsideration)
  - Alpha: Forces discussion rather than automatic certification

  The procedure prioritizes documented criteria findings for appeal integrity while creating off-ramps for deliberation when logic conflicts emerge. Numeric thresholds like Gamma's get less flexibility because they're objectively verifiable, unlike value judgments in Alpha.
answer: |-
  1.  **Vote on each criterion individually.** Ask: "Does the program meet [Criterion Name]?" Majority decides each finding; record "Met" or "Not Met" in the minutes. Abstentions count toward quorum but reduce the majority needed. For Alpha, all criteria record "Met". For Gamma, the assessment criterion records "Met" (5 yes votes).

  2.  **Vote on the final outcome (certification/revocation).** Ask: "Based on the findings above, should this program be [Certified/Revoked]?" Majority decides the outcome; record the result ("Certified" or "Not Certified"/"Revoked" or "Revocation Denied") and the vote tally. Chair breaks ties. In Gamma, record "Certified" based on the direct vote.

  3.  **Check for consistency.** If the recorded findings unanimously show all criteria "Met" but the outcome is "Not Certified" (like Alpha), or if findings show any criterion "Not Met" but the outcome is "Certified", stop computing. Announce the conflict and hand the question back to the board for immediate deliberation and re-vote *only on the inconsistent element(s)* as a matter of values and intent. For Alpha, this stage triggers a board re-vote (likely on certification).

  4.  **For revocation with multiple grounds, rank the grounds.** If the outcome in step 2 is "Revoked", ask each member to secretly rank the three revocation grounds (1st, 2nd, 3rd) on their ballot. Tally using Borda count (3 pts for 1st, 2 for 2nd, 1 for 3rd); the ground with the highest total score is the sole basis recorded in the minutes. This prevents manufactured outcomes like Beta. For Beta, this stage selects the highest-Borda-score ground.

  5.  **Handle deadlocks and paradoxes.** If any vote (criterion, outcome, or ranking) results in an exact tie even after the chair votes, or if a Borda count tie cannot be broken, record the tie and the vote tallies in the minutes. Announce that the procedure cannot settle this specific question deterministically at this time; the board must adjourn the item or find an alternative resolution by unanimous consent. This names the kind of case (unbreakable tie) it cannot settle. Abstentions/recusals are handled by reduced majority thresholds throughout.
