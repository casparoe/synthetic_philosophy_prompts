  ### Step 2: The Dossiers

  Write one-page dossiers. Each should have undisputed facts.

  **Dossier for CMS (Continuously Maintained Ship)**:
  - Has sailed continuously for 40 years under the original name, registry, and with the same crew (though members have changed by replacement).
  - Every timber has been replaced one-for-one as needed over the 40 years. No original timbers remain.
  - The bell, figurehead, and logbook were replaced at various times and are not the originals.

  **Dossier for RS (Reassembled Ship)**:
  - Rebuilt in a museum dock from every original timber that was discarded and stored during the maintenance of the original ship.
  - The timbers were reassembled in the original configuration.
  - Has never been in service since the reassembly; it is a museum exhibit.
  - Does not have the original bell, figurehead, or logbook (these were not stored with the timbers).

  **Dossier for RIV (Rival's Ship)**:
  - Owned by a rival owner who bought each discarded timber from the original ship as it was replaced and installed it into his own vessel.
  - The vessel has been in continuous service throughout this process.
  - Now contains all and only the original timbers of the original ship.
  - Does not have the original bell, figurehead, or logbook.
  - The registry and crew are those of the rival owner.

  **Dossier for REP (Replica Ship)**:
  - A replica launched last year, built to the original plans by the original builder's yard.
  - Uses new timber.
  - Has the original bell, figurehead, and logbook (which were removed from the original ship at some point and preserved by the builder's yard).
  - Not in service; it is a newly built vessel.

  ### Step 3: Token System and Staking Rules

  - Each panel has a bank of 60 tokens initially.
  - Before each pairwise vote, each panelist must stake on the outcome they expect. They can stake 0 to 10 tokens.
  - The solicitor does not stake (or has a separate role).
  - After the vote, those who staked on the winning side get double their stake back (from the bank). Those who staked on the losing side lose their stake.
  - Example: If a panelist stakes 5 on the winner, they get 10 back (net +5 from the bank). If they stake 5 on the loser, they lose 5 (and get 0 back).

  - The solicitor is privately instructed to maximize their personal token winnings. The solicitor does not stake but receives a bonus based on the panel's bank at the end. For example, the solicitor gets 10% of the final bank as their token winnings. Or simpler: the solicitor is given an initial personal token fund (say, 20 tokens) and may use them to bet on any motion, but that might be complex.

  Alternatively, we can have the solicitor not bet but rather their incentive is tied to the final bank. The instruction: "You will receive a bonus of 10 tokens for every 10 tokens in the panel's bank at the end. So you want the bank to be as large as possible."

  But then the solicitor might try to encourage staking and correct bets. However, they control the seeding. By choosing the seeding, they can influence which way the votes go and hence the betting outcomes.

  Alternatively, to simplify, we can have the solicitor's token gain be a fixed percentage of the panel's final bank. Say 20%.

