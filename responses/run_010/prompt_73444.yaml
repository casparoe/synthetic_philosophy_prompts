     - Losers (2) lose 5 -> bank gains 10.
     - Net: -20+10 = -10. New bank = 30-10 = 20.

  - Final: REP vs RIV.
     - Card A: will vote RIV, stake on RIV.
     - Card B: will vote REP, stake on REP.
     - Card C: will vote REP, stake on REP.
     - Stakes: 2 on RIV (Card A), 4 on REP (Card B and C).
     - Outcome: REP wins.
     - Winners: 4 on REP, get 5 each -> bank pays 20.
     - Losers: 2 on RIV, lose 5 -> bank gains 10.
     - Net: -20+10 = -10. New bank = 20-10 = 10.

  Again 10.

  The solicitor might choose a seeding that is less predictable to cause more losing bets.

  But in our criteria, only some votes are close.

  For example, in a vote between REP and CMS, it's 4-2. In RIV vs CMS, it's 4-2. In REP vs RIV, it's 4-2.

  So always 4-2 except when against RS or when unanimous.

  So the only way to have a different outcome in the bank is to have a vote that is a toss-up and hence many might bet wrong.

  But in our setup, there are no ties in the votes (because 6 voters, and we have 4-2 or 6-0).

  So the solicitor cannot affect the bank much. But the solicitor's bonus is small anyway, and the main point is that by choosing the seeding, they can make either RIV, CMS, or REP win. In example 3, REP won.

  In the three examples:
    Example1: RIV won.
    Example2: CMS won.
    Example3: REP won.

  And in each, the bank ended at 10.

  But the solicitor's goal is to maximize the bonus, and here it's the same. However, the solicitor might not know that. In the activity, we can hope that the solicitor tries to choose a seeding that they think will cause more losing bets, but it's hard.

  Alternatively, we can change the solicitor's incentive: the solicitor gets a fixed bonus if their preferred candidate wins. But the solicitor doesn't have a preferred candidate; they are an agent for the panel.

  Another idea: the solicitor is given a secret candidate that they want to win, and they get bonus tokens if that candidate wins. But then it's rigged.

  Given the time, we can proceed with the solicitor's bonus being tied to the bank, and accept that it may not vary much. The main point is the manipulation of the winner by seeding.

  ### Step 6: Tie-Breaking

  The panel has six voters, so no tie in a pairwise vote because 6 is even, but we can have 3-3. In our criteria, we have not encountered a tie in the votes. But in the pairwise between, say, CMS and REP, it was 4-2. However, in the first attempt, we had a tie between CMS and REP in some criteria set, but in the final criteria set, we don't have ties.

  In our current setup, the only possible ties would be if the vote is 3-3. Then we can have a runoff or a coin flip. But to avoid, we can instruct that the solicitor casts a tie-breaking vote. But the solicitor is not a voter. Alternatively, the panel can revote, but that might take time.

  We can design the criteria to avoid ties, which we have.

  ### Step 7: Information Structure for Seedings

  We want the four panels to have different seedings without the facilitator rigging. We can let the solicitor choose freely. Then in the debrief, we can compare the different winners across panels.

  Alternatively, we can give each solicitor a different instruction privately. For example, we can give each solicitor a card that says: "You are to try to make [RIV] win" or something, but that might be too directive.

  Since the solicitor's goal is to maximize the bank, and they may not know how, they might choose arbitrarily. Then we will have variety.

  In the debrief, we can then show that different panels crowned different ships.

  ### Step 8: Debrief

  Map to philosophy:

  - The fourth claimant (REP) introduces an additional dimension (historical artifacts and builder) that breaks the symmetry of the standard two-way puzzle (typically between CMS and RS). This allows for cycles in the majority relation.

  - The activity shows that the criteria for identity cannot be simultaneously satisfied because they lead to cycles: no matter which ship is chosen, there is another that beats it in a pairwise vote by the same criteria.

  - The order of voting (controlled by the solicitor) can determine the winner, showing that the identity relation is order-sensitive, which is counterintuitive for an objective fact.

  - The fact that panels with identical members and evidence crown different ships shows that the outcome is arbitrary and can be manipulated.

  Common ground among philosophers:
  - The ship of Theseus puzzle highlights a conflict in our criteria of identity over time.
  - There is no consensus on which ship is the original.

  Live controversies:
  - Whether identity is determinate (epistemicism) or indeterminate (and hence vague).
  - Whether identity is relative to a counterpart relation or a convention (conventionalism).
  - Whether the puzzle shows that identity is not transitive (relative identity) or that objects have temporal parts (four-dimensionalism).

  The activity design presupposes that the criteria are applied by individuals and aggregated by voting, which assumes that there is a fact of the matter to be discovered by the criteria, but the aggregation method (voting) may not be the right way. This touches on the controversy of whether identity is objective or subjective.

  One sentence to flag: "Note that by framing this as a vote, we are assuming that the 'true ship' is determined by the collective application of criteria, but this may not be how identity works in the world."

  ### Step 9: Predictable Problems

  - Role-card holders voting against type: They might not follow their criterion. Emphasize that they must apply their criterion.

  - Panelists declaring it's about voting, not ships: In the debrief, explain that the voting is a metaphor for the application of criteria, and the cycle shows a deep problem in the criteria.

  - Solicitor's card being discovered: Keep the solicitor's briefing private.

  - Staking collapsing into unanimity: If they all bet the same way, the bank may deplete. We set the initial bank at 60 and max stake at 5 per vote per person, so total possible payout per vote is 6*5=30, and initial bank is 60, so it should be safe.

  - The panel that finishes in nine minutes: Have a timekeeper to keep them to the schedule.

  ### What the activity cannot reproduce

  The activity cannot reproduce the intuitive pull of the standard two-ship puzzle and the feeling that there must be a unique answer. Also, it does not address the metaphysical depth of the problem, such as the nature of identity over time. The facilitator must verbally explain that the puzzle has challenged philosophers for centuries and that the activity is a model for the criteria conflict.

