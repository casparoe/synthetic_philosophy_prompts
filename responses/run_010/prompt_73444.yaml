  ### In-Class Activity Design: The Ship Adjudication

  **Objective**: Students discover through active adjudication that their criteria for ship identity conflict irreducibly and that the outcome is manipulable by voting order, without instructor input. The activity uses a maritime trust bequest with four claimants and a structured panel process.

  ---

  ### **Claimant Dossiers** (one-page each, undisputed facts)
  **Distribute one set per student. All panels see the same dossiers.**

  1. **Continuously Maintained Ship (CMS)**  
     "This vessel has sailed without interruption for 40 years under the original name, registry, and crew. Every timber was replaced one-by-one as needed, using new materials. The original bell, figurehead, and logbook were discarded during maintenance and are not aboard."

  2. **Reassembled Ship (RS)**  
     "This vessel was rebuilt in a museum dock from every original timber discarded by the CMS. The timbers were stored and reassembled in the original configuration. It has never sailed since reassembly and lacks the original bell, figurehead, and logbook."

  3. **Rival’s Ship (RIV)**  
     "This vessel is owned by a rival and has sailed continuously. The rival purchased each timber as it was discarded by the CMS and installed it into their sound hull. It now contains all and only the original timbers. It operates under a new registry and lacks the original bell, figurehead, and logbook."

  4. **Replica Ship (REP)**  
     "This vessel is a replica launched last year, built to the original plans by the original builder’s yard using new timber. It possesses the original bell, figurehead, and logbook (removed from the original ship decades ago). It has never sailed except for its maiden voyage."

  ---

  ### **Role Cards** (six unique cards per panel; print one set per panel)  
  **Each card gives a criterion and a strict ranking. Students apply their criterion sincerely. Rankings derive from the criteria.**

  1. **Card A (Material + Continuous Service Primacy)**  
     "The true ship must have the original timbers. If tied, prioritize continuous service.  
     **Ranking**: RIV (has timbers + service) > RS (has timbers, no service) > CMS (no timbers, service) > REP (no timbers, no service)."

  2. **Card B (Continuous Service + Artifacts Primacy)**  
     "The true ship must have the longest continuous service. If tied, prioritize historical artifacts.  
     **Ranking**: CMS (40 years’ service) > REP (artifacts) > RIV (service but <40 years) > RS (no service, no artifacts)."

  3. **Card C (Artifacts + Builder Primacy)**  
     "The true ship must have the original artifacts. If tied, prioritize construction by the original builder.  
     **Ranking**: REP (artifacts + builder) > RIV (no artifacts, but timbers) > CMS (no artifacts, service) > RS (no artifacts, no builder)."

  4. **Card D (Continuous Service + Material Primacy)**  
     "The true ship must have continuous service. If tied, prioritize original timbers.  
     **Ranking**: RIV (service + timbers) > CMS (service, no timbers) > RS (no service, timbers) > REP (no service, no timbers)."

  5. **Card E (Material + Artifacts Primacy)**  
     "The true ship must have original timbers. If tied, prioritize historical artifacts.  
     **Ranking**: RIV (timbers) > RS (timbers) > REP (artifacts) > CMS (no timbers, no artifacts)."  
     *(Tiebreak: RIV > RS due to continuous service; REP > CMS due to artifacts)*

  6. **Card F (Builder + Material Primacy)**  
     "The true ship must be built by the original builder. If tied, prioritize original timbers.  
     **Ranking**: REP (builder) > RIV (timbers) > RS (timbers) > CMS (no builder, no timbers)."  
     *(Tiebreak: RIV > RS due to continuous service)*

  ---

  ### **Token System and Staking Rules**
  - **Initial bank per panel**: 60 tokens (paper tokens provided).
  - **Staking**: Before each pairwise vote, each panelist stakes 0–5 tokens (whole numbers) on which claimant they expect to win. Stake privately on paper slips.
  - **Payouts**:
    - If staked on the winner: Receive double the stake from the bank (e.g., stake 3, get 6 back: +3 profit).
    - If staked on the loser: Lose the stake to the bank.
  - **Solicitor’s incentive**: The solicitor (elected per panel) receives 20% of the panel’s final bank as a bonus. They are privately instructed: "Maximize your token bonus by the end."

  ---

  ### **Minute-by-Minute Timeline** (100 minutes total)
  | Time  | Activity                                                                                               | Instructor Role                                                                 |
  |-------|--------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | 0–10  | **Intro & Setup**: Distribute dossiers (all students). Split into 4 panels (6 students each).          | Explain the trust bequest and claimants. No philosophical input.               |
  | 11–20 | **Role Assignment**: Give each panelist one role card (each panel has one set of Cards A–F).           | Observe; ensure cards are private.                                             |
  | 21–30 | **Solicitor Election & Briefing**: Panels elect a solicitor. Privately brief solicitors on all six criteria and their token incentive (use briefing sheet). | Hand solicitors a "Criteria Summary" sheet. Emphasize secrecy.                 |
  | 31–40 | **Seeding & Strategy**: Solicitors return to panels, receive the token bank (60 tokens). Solicitors announce the seeding (pairing for the first two votes). | Announce: "Solicitors, choose which two claimants face off first and second." |
  | 41–50 | **Vote 1**: Stake tokens. Vote by show of hands. Record outcome. Adjust tokens.                          | Timekeeper; no input on voting.                                                |
  | 51–60 | **Vote 2**: Stake tokens. Vote. Adjust tokens.                                                           | As above.                                                                      |
  | 61–70 | **Vote 3** (final): Stake tokens. Vote. Adjust tokens. Declare winner and disburse solicitor bonus.      | As above.                                                                      |
  | 71–100| **Debrief**: Discuss outcomes across panels. Map to philosophy (use guide below).                      | Facilitate discussion; use debrief framework.                                  |

  ---

  ### **Verification: Rankings, Cycles, and Solicitor Incentives**
  **Ranking Table** (each card’s strict ordering):
  | Card | Ranking (1st > 2nd > 3rd > 4th)         |
  |------|------------------------------------------|
  | A    | RIV > RS > CMS > REP                     |
  | B    | CMS > REP > RIV > RS                     |
  | C    | REP > RIV > CMS > RS                     |
  | D    | RIV > CMS > RS > REP                     |
  | E    | RIV > RS > REP > CMS                     |
  | F    | REP > RIV > RS > CMS                     |

  **Pairwise Majority Results** (6 voters per panel; 2 of each card):
  - **RIV vs CMS**: RIV wins 4–2 (Cards A, D, E, F prefer RIV; B, C prefer CMS).
  - **CMS vs REP**: CMS wins 4–2 (Cards A, B, D, E prefer CMS; C, F prefer REP).
  - **REP vs RIV**: REP wins 4–2 (Cards B, C, F prefer REP; A, D, E prefer RIV).
  - **Cycle**: RIV > CMS, CMS > REP, REP > RIV.  
    *No Condorcet winner; majority preferences cycle*.

  **Seedings Yielding Different Winners**:
  - **Seeding 1 (RIV wins)**:  
    - Vote 1: RIV vs RS → RIV wins (unanimous).  
    - Vote 2: CMS vs REP → CMS wins (4–2).  
    - Vote 3: RIV vs CMS → RIV wins (4–2).  
    - *Solicitor’s token gain*: Assume all stake 5 per vote. Bank starts at 60.  
      - Vote 1: All stake on RIV → 6 winners, bank pays 6×5 = 30; new bank = 30.  
      - Vote 2: 4 stake on CMS (win), 2 on REP (lose) → Bank pays 4×5 = 20, gains 2×5 = 10; new bank = 20.  
      - Vote 3: 4 stake on RIV (win), 2 on CMS (lose) → Bank pays 4×5 = 20, gains 2×5 = 10; new bank = 10.  
      - Solicitor bonus: 20% of 10 = 2 tokens.  

  - **Seeding 2 (REP wins)**:  
    - Vote 1: REP vs RS → REP wins (unanimous).  
    - Vote 2: RIV vs CMS → RIV wins (4–2).  
    - Vote 3: REP vs RIV → REP wins (4–2).  
    - *Solicitor’s token gain*: Same staking → Final bank = 10, bonus = 2 tokens.  

  **Tie Avoidance**:  
  - Votes are by simple majority (no ties; 6 voters, min 4–2).  
  - If a 3–3 tie occurs (unlikely with these criteria), revote once. If still tied, solicitor breaks the tie.

  **Information Structure for Seedings**:  
  - Solicitors choose seedings freely without instructor input.  
  - *Why it works*: With identical panels but different solicitors, seedings vary naturally. In debrief, highlight how solicitor strategy (e.g., pitting strong candidates early) caused divergent outcomes.  
  - *No rigging needed*: Panels are independent; differences arise from solicitor choices.

  ---

  ### **Debrief Framework** (30 minutes)
  **Map Activity to Philosophy**:  
  1. **Fourth Claimant’s Role**: "The replica (REP) introduces artifacts and builder criteria, breaking the symmetry of the standard two-ship puzzle. With only CMS and RS, cycles are impossible; adding REP creates intransitive preferences."  
  2. **Order-Sensitivity**: "You saw solicitors change winners by reordering votes. If 'the ship' were an objective fact, it shouldn’t depend on when we ask. But your criteria, when aggregated, made identity order-sensitive."  
  3. **Identical Inputs, Different Outputs**: "Panels had identical evidence and role distributions, but crowned different ships. This shows criteria conflicts aren’t resolvable by 'more evidence'—they’re structural."  

  **Common Ground vs Controversies**:  
  - **Common ground**: "Philosophers agree the puzzle exposes irreconcilable criteria for identity over time. No 'settled' answer exists."  
  - **Live controversies**:  
    - *Four-dimensionalism*: Ships are spacetime worms; all claimants are temporal parts.  
    - *Relative identity*: "The ship" is context-dependent; no absolute identity.  
    - *Epistemicism*: One ship is objectively original, but we can’t know which.  
    - *Deflationism*: "Identity" is a linguistic convention, not a deep fact.  
    - *Closest continuer*: The ship is whichever best preserves key properties (e.g., function, matter).  
  - **Contested Presupposition in Activity**: The activity assumes identity can be decided by aggregating individual criteria (voting). Flag: "This models identity as a 'social fact,' but some argue identity is mind-independent. Does the activity subtly favor conventionalism?"  

  ---

  ### **Predictable Problems and Solutions**
  1. **Role-card holders voting against type**:  
     - *Prevention*: Emphasize in instructions: "Apply your criterion sincerely; this is about testing principles, not winning."  
     - *Response*: In debrief, note: "If voters ignored criteria, it shows how hard it is to adhere to principles under conflict."  

  2. **"This is about voting, not ships"**:  
     - *Prevention*: Open debrief with: "The voting is a metaphor—cycles reflect criteria conflicts, not democracy’s flaws."  
     - *Response*: "If identity criteria are incoherent, real-world decisions (e.g., inheritance law) face the same problem."  

  3. **Solicitor’s card discovered**:  
     - *Prevention*: Brief solicitors privately; instruct them not to reveal incentives.  
     - *Response*: "If discovered, it highlights how hidden incentives exploit philosophical indeterminacy."  

  4. **Staking collapses into unanimity**:  
     - *Prevention*: Cap stakes at 5 tokens to limit bank depletion.  
     - *Response*: "Even with identical stakes, token outcomes couldn’t override seeding effects."  

  5. **Panel finishes early**:  
     - *Prevention*: Assign a "timekeeper" student per panel.  
     - *Response*: Have early finishers predict outcomes for other seedings.  

  **What the Activity Cannot Reproduce**:  
  - **The intuitive pull of the original puzzle**: Students encounter a "pre-solved" multi-ship version. *You must verbally reintroduce the classic two-ship tension*: "In the standard puzzle, we feel CMS or RS must be the ship—but adding REP and RIV shows this intuition scales poorly. The core confusion persists: Can identity be defined without contradiction?"  

  ---

  ### **Printable Materials**
  - **Dossiers**: [Print 24 copies; 1 per student]  
  - **Role Cards**: [Print 4 sets (one per panel); each set has one copy of Cards A–F]  
  - **Solicitor Briefing Sheet**: [Print 4 copies; include criteria summaries and token incentive]  

  This design ensures students discover criteria conflicts and order-sensitivity through hands-on adjudication. The debrief explicitly avoids endorsing any resolution, instead highlighting controversies and the activity’s own assumptions.
