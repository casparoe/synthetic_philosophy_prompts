  6-10 min: Form panels of six and within each panel, give out the role cards. Each student gets one role card privately. There are six role cards per panel: two A, two B, two C.

  11-15 min: Panelists read their role card and apply it to rank the claimants. They do not reveal their role card to others.

  16-20 min: Each panel elects a solicitor. The solicitor is briefed by the facilitator (you) in private. The briefing: the solicitor is given a sheet with the six criteria (so they know what each role card holder is supposed to do) and told that their goal is to maximize their own token bonus, which is 20% of the panel's final bank.

  21-25 min: The solicitor returns and the panel is given their token bank (60 tokens). The solicitor announces the seeding for the knockout tournament. The knockout has three pairwise votes: two in the first round, then the winners face each other, then the winner of that faces the remaining one? No, with four claimants, a knockout is typically: first two votes (between two pairs), then the two winners vote, and the winner of that is the champion. But we have three votes: vote1: A vs B, vote2: C vs D, vote3: winner1 vs winner2.

   But in our case, we have four claimants. The solicitor must choose which two pairs to vote on first.

  For example, the solicitor can choose to put in the first round: 
    Match 1: X vs Y
    Match 2: W vs Z
  Then the winners of these two face each other.

  The seeding means choosing which claimants are paired in the first round.

  26-30 min: Before the first vote, panelists stake tokens (0-10) on the outcome of the first pairwise vote. They write their stake privately and hand to the solicitor or a vote counter. Then the vote is taken by show of hands. The outcome is announced. Tokens are paid: winners get double their stake from the bank, losers lose their stake.

  31-40 min: Repeat for the second pairwise vote (the other first-round match).

  41-50 min: Repeat for the final vote (winners of the first two matches).

  51-60 min: The winning claimant is announced. The bequest is awarded. The solicitor calculates the final bank and takes their 20% bonus.

