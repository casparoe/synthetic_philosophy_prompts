          Card C: RIV>CMS -> RIV
     - Outcome: RIV wins 4-2 (cards A and C for RIV, card B for CMS).

  - Final: REP vs RIV.
     - Vote:
          Card A: RIV>REP -> RIV
          Card B: CMS>REP>RIV -> in REP vs RIV, REP>RIV -> REP
          Card C: REP>RIV -> REP
     - So: RIV: Card A (2 votes)
