  - Four claimants to a bequest for "the vessel":
    1. The Continuously Maintained Ship (CMS): Sailed continuously, every timber replaced one-by-one over forty years.
    2. The Reassembled Ship (RS): Rebuilt in a museum from all the original timbers that were discarded and stored.
    3. The Rival's Ship (RIV): Contains all the original timbers (bought as discarded) in a sound hull, in continuous service.
    4. The Replica Ship (REP): Built last year to original plans with new timber, but has original bell, figurehead, and logbook.

  Each claimant has a one-page dossier with undisputed facts. The asymmetries are structural (each has a different claim to being the ship).

  Activity mechanics:
  - 24 students split into four panels of six.
  - Each panel has the same six private role cards. Each role card assigns a criterion that the holder must apply, which implies a strict ranking of the four claimants.
  - Each panel elects a solicitor. The solicitor is briefed on all six criteria and chooses the seeding (order of pairwise votes) for a knockout tournament. The tournament consists of three pairwise motions (each decided by simple majority of the six panelists). The winner of the final vote gets the bequest.
  - Panelists stake paper tokens on each motion (before the vote) from the panel's bank. The solicitor is privately instructed to maximize their own token winnings by the end.

