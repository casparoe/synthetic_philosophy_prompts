  ### Custom Case Study: Herding in Household Evacuation Decisions

  #### Setup
  A levee protects a street of five households from flooding. The state of the world is whether the levee **fails (F)** or **holds (H)**, with a prior probability of 0.5 for each state. Households decide sequentially (in order: 1 to 5) whether to evacuate (E) or not evacuate (N). Payoffs depend only on the state and one’s own action: if the levee fails, evacuating yields 0 (no loss) and not evacuating yields -1 (loss); if it holds, evacuating yields -1 (unnecessary cost) and not evacuating yields 0. Thus, each household evacuates iff their posterior probability of failure exceeds 0.5. All are Bayesian rational, with common knowledge of rationality, signal structures, and the prior. Private signals (High/Low) are conditionally independent given the state. A High signal suggests the levee holds; a Low signal suggests failure. Signal accuracies (probability of correct signal) are strictly increasing:  
  - Household 1: 0.51  
  - Household 2: 0.60  
  - Household 3: 0.70  
  - Household 4: 0.72  
  - Household 5: 0.75  

  Costs are set so the decision rule flips at exactly P(F) = 0.5. The levee fails (true state F), and private signals are:  
  - H1: High (suggesting H)  
  - H2: High  
  - H3: High  
  - H4: Low  
  - H5: Low  

  All households choose **not to evacuate (N)**, forming a wrong cascade (consensus not to evacuate despite failure). If H1’s signal were Low, all would evacuate (correctly). The cascade is pinned to H1 (least informed, accuracy 0.51).

  ---

  #### Decision Process (Posteriors and Actions)
  **State: F (levee fails)**  
  - **Signal likelihoods**:  
    - P(High | F) = 1 - accuracy (e.g., for H1: 1 - 0.51 = 0.49)  
    - P(Low | F) = accuracy (e.g., for H1: 0.51)  
  - **Prior**: P(F) = P(H) = 0.5.  
  - **Posterior** for each household is calculated using Bayes’ theorem. Actions reveal signals only if informative; once a cascade starts, actions become uninformative.

  **Household 1 (H1):**  
  - Private signal: High.  
  - Posterior P(F | High):  
    \[
    \begin{align*}
    \text{P(F | High)} &= \frac{\text{P(High | F)} \cdot \text{P(F)}}{\text{P(High)}} \\
    \text{P(High)} &= \text{P(High | F)} \cdot \text{P(F)} + \text{P(High | H)} \cdot \text{P(H)} \\
                   &= (0.49 \cdot 0.5) + (0.51 \cdot 0.5) = 0.5 \\
    \text{P(F | High)} &= \frac{0.49 \cdot 0.5}{0.5} = 0.49 < 0.5.
    \end{align*}
    \]  
  - **Action: N** (since P(F) < 0.5). This reveals H1’s signal was High (if it were Low, P(F | Low) = 0.51 > 0.5 would lead to E).

  **Household 2 (H2):**  
  - Observes H1’s action: N → infers H1’s signal = High.  
  - Private signal: High.  
  - Two signals: High (from H1), High (own).  
  - Posterior P(F | High, High):  
    \[
    \begin{align*}
    \text{P(F | High, High)} &= \frac{\text{P(High | F)} \cdot \text{P(High | F)} \cdot \text{P(F)}}{\text{P(High, High)}} \\
    \text{P(High, High | F)} &= 0.49 \cdot 0.40 = 0.196 \\
    \text{P(High, High | H)} &= 0.51 \cdot 0.60 = 0.306 \\
    \text{P(High, High)} &= (0.196 \cdot 0.5) + (0.306 \cdot 0.5) = 0.251 \\
    \text{P(F | High, High)} &= \frac{0.196 \cdot 0.5}{0.251} \approx 0.390 < 0.5.
    \end{align*}
    \]
  - **Action: N** (P(F) < 0.5). Reveals H2’s signal was High (if it were Low, P(F | High, Low) ≈ 0.553 > 0.5 would lead to E).

  **Household 3 (H3):**  
  - Observes H1’s N and H2’s N → infers signals: High (H1), High (H2).  
  - Private signal: High.  
  - Three signals: High, High, High.  
  - Posterior P(F | High, High, High):  
    \[
    \begin{align*}
    \text{P(High, High, High | F)} &= 0.49 \cdot 0.40 \cdot 0.30 = 0.0588 \\
    \text{P(High, High, High | H)} &= 0.51 \cdot 0.60 \cdot 0.70 = 0.2142 \\
    \text{P(High, High, High)} &= (0.0588 \cdot 0.5) + (0.2142 \cdot 0.5) = 0.1365 \\
    \text{P(F | High, High, High)} &= \frac{0.0588 \cdot 0.5}{0.1365} \approx 0.215 < 0.5.
    \end{align*}
    \]  
  - **Action: N** (P(F) < 0.5). Reveals H3’s signal was High (if it were Low, P(F | High, High, Low) ≈ 0.557 > 0.5 would lead to E).

  **Household 4 (H4):**  
  - Observes three N’s → infers signals: High (H1), High (H2), High (H3).  
  - Private signal: Low.  
  - Three High signals, one Low signal.  
  - Posterior P(F | High, High, High, Low):  
    \[
    \begin{align*}
    \text{P(F | signals)} &\propto \text{P(signals | F)} \cdot \text{P(F)} \\
    \text{P(signals | F)} &= 0.49 \cdot 0.40 \cdot 0.30 \cdot 0.72 = 0.042336 \\
    \text{P(signals | H)} &= 0.51 \cdot 0.60 \cdot 0.70 \cdot 0.28 = 0.0600048 \\
    \text{P(F | signals)} &= \frac{0.042336 \cdot 0.5}{0.042336 \cdot 0.5 + 0.0600048 \cdot 0.5} \approx \frac{0.021168}{0.0511704} \approx 0.414 < 0.5.
    \end{align*}
    \]  
  - **Action: N** (P(F) < 0.5). Action does NOT reveal H4’s signal (even with a Low signal, P(F) < 0.5, so N is chosen regardless). **Cascade begins**: Action is uninformative, so H5 cannot infer H4’s signal.

  **Household 5 (H5):**  
  - Observes four N’s. Infers:  
    - H1, H2, H3’s actions reveal High signals (as they would have chosen E with Low signals).  
    - H4’s action N is uninformative (could be High or Low).  
  - Private signal: Low.  
  - Must compute posterior over possible signals for H4:  
    \[
    \begin{align*}
    \text{P(F | 3 High, H4?, Low)} &\propto \text{P(3 High, Low | F)} \cdot \text{P(F)} \cdot [\text{P(H4=High | F)} + \text{P(H4=Low | F)}] \\
    &\text{(since H4's signal is unknown, marginalize over it)} \\
    \text{P(3 High, Low | F)} &= 0.49 \cdot 0.40 \cdot 0.30 \cdot 0.75 = 0.0441 \\
    \text{P(3 High, Low | H)} &= 0.51 \cdot 0.60 \cdot 0.70 \cdot 0.25 = 0.05355 \\
    \text{P(F | data)} &= \frac{0.0441 \cdot 0.5}{0.0441 \cdot 0.5 + 0.05355 \cdot 0.5} \approx \frac{0.02205}{0.0488} \approx 0.452 < 0.5.
    \end{align*}
    \]  
  - **Action: N** (P(F) < 0.5). Cascade continues.

  **Result:** All choose N (wrong action, as levee fails). The cascade starts at H4, but the consensus is pinned to H1’s weakly informative (0.51) signal. If H1’s signal were Low:  
  - H1: P(F | Low) = 0.51 > 0.5 → E.  
  - H2: Infers H1’s Low signal. If H2 gets Low, P(F | two Lows) > 0.5 → E; if High, P(F | Low, High) ≈ 0.553 > 0.5 → E. Similarly, all subsequent households evacuate (correctly).

  ---

  #### Key Feature Enabling the Cascade
  **Common knowledge of rationality (CKR) is crucial**. CKR ensures households:  
  - Believe predecessors acted solely based on signals (no random behavior).  
  - Can perfectly infer predecessors’ signals from actions (until cascade starts).  
  This allows early (weak) signals to dominate later (stronger) signals.  

  **Cascade under 20% noise (each predecessor may ignore signal and pick randomly):**  
  - **Cascade breaks**. With noise, H4 and H5 cannot perfectly infer earlier signals. For example:  
    - H4 sees three N’s but believes each N has a 20% chance of being random (not based on High signal). This weakens the inferred evidence for High signals.  
    - H4’s posterior with a Low signal: P(F) increases but remains <0.5 (≈0.48 in simulation) → still N (cascade holds at H4).  
    - H5 sees four N’s, but uncertainty compounds. With a Low signal: P(F) ≈ 0.503 > 0.5 → E.  
    **Result:** Cascade breaks at H5 (chooses E). Noise prevents strong herding by reducing confidence in action-based inferences.

  ---

  #### Critique from a Defender of the Standard Model  
  1. **Requirement (1) incoherence with fast-rising precisions**:  
     - If later signals are much stronger (e.g., H5 accuracy >> H1), accumulated weak signals (from H1–H3) should be easily overturned by one strong signal. In this case, H4’s signal (0.72) or H5’s (0.75) should dominate early signals, preventing a cascade.  
