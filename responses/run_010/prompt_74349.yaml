prompt: |-
  I am co-teaching an undergraduate seminar this spring with a colleague in classics, on the ethics of disagreement and compromise, and we have put Sophocles' Antigone in week four. My own work is on moral trade: the proposal that agents who hold different moral views can transact without either of them revising those views, each doing something the other's view counts in favor of in exchange for a forbearance or a payment that their own view counts in favor of, so that both come out ahead as measured in their own moral currency rather than in some common one. The stock illustration is a utilitarian and a deontologist who discover that a restraint or a contribution is worth much more to one of them than to the other, and trade accordingly. The pressure points that interest me are whether there is any exchange rate at all between genuinely incommensurable values, whether a duty that can be bought off has been honored or corrupted by the transaction, and whether opening such a marketplace invites extortion from anyone willing to threaten what the other side finds abhorrent. I want to run the play through this lens, and I want you to be as concrete as possible about where in the plot the lens actually bites.

  Here is what I have in mind. Creon's decree and Antigone's burial are usually staged as a collision of irreconcilable commitments, yet the play is full of what look like offers, counter-offers, and refusals to bargain. Ismene declines to share the risk on the ground that success is impossible, and then offers to share the punishment once the act is done — an offer Antigone rejects in terms that read like a refusal to let someone claim a share in a good she did nothing to produce. Haemon urges his father to yield and reports that the city privately sides with Antigone, which comes across less as an appeal to principle than as an accounting of Creon's collapsing political capital. When Teiresias warns him, Creon's first response is to accuse the prophet of having been paid for his prophecy — that is, of having already traded the thing he claims to be transmitting. And late in the play Creon does reverse course, burying Polyneices and setting out to release Antigone from the tomb, and arrives too late. Please treat that sequence as a bargaining history and go through it stage by stage: what could Creon have conceded at each point that would have cost him less than the catastrophe, what could Antigone have offered that she would not have regarded as a betrayal of the burial itself, and which of the two — if either — is the party whose framework makes trade impossible rather than merely expensive. Note also Antigone's own justification for acting: her reasoning that she would not have done this for a husband or a child, since those could be replaced, but only for a brother, since her parents are dead and no other brother can be born. That looks to me like an explicit argument from non-substitutability to non-tradeability, and I want you to say whether it survives contact with the moral-trade framework or whether that framework has the resources to absorb it.

  Then tell me where the reading breaks down and I should stop pressing it: which features of the play are distorted by treating Antigone and Creon as bargaining agents rather than as characters whose whole point is that they are not, and whether the play's divine and heroic register has any room at all for the idea of a market in moral goods. My colleague and I disagreed about this after our syllabus meeting and I would rather you took a side than surveyed the options. He thinks the play is a tragedy of bargaining failure — the mutually acceptable deal was available and everyone dies because two people would not take it. I think the play is a refutation of the very idea, showing that certain goods are the kind of thing that must not be priced, so that the counsel of flexibility offered by Haemon and Teiresias is the shallow position the tragedy exposes. Commit to one of those readings, or to a third you can defend better, and give your reasons. Two constraints on the response: please do not quote the play, since we are using a modern prose translation and I have no use for speeches reproduced from memory or for line numbers; and I do not want references to secondary literature or a suggested reading list, just your own account. Work from the structure of the scenes as I have described them, and where you think I have mischaracterized the play, say so and correct me rather than quietly accepting my framing. Close by saying what the dramatization can contribute to the debate over moral trade that an argument in a journal article could not — and be candid about how much of your verdict depends on a contested reading of Antigone's own motives.
reasoning: |-
  Okay, let me approach this query methodically. The user wants a concrete application of moral trade theory to Antigone's key interactions, pushing beyond abstract philosophical debate into dramatic specifics. 

  First, I need to map the bargaining sequences accurately. Ismene's offer to share punishment after the fact isn't just cowardice - it's a belated attempt to transact in moral credit, which Antigone rejects as inauthentic. That's crucial because Antigone sees virtue as non-fungible. 

  Haemon's intervention fascinates me. When he tells Creon the city sides with Antigone, it's not just political pressure - it's revealing Creon's moral currency is devaluing. But Creon misreads this asdisloyalty rather than market information. His later offer to pardon Antigone if she submits fails because he's offering political capital (forgiveness) for something she considers sacred (duty). 

  The non-substitutability argument is central. Antigone's "no replacement brother" speech isn't sentimentality - it's declaring this particular duty has infinite marginal value. In moral trade terms, her demand curve is vertical. No exchange rate exists. 

  Where I disagree with the user's colleague: This isn't bargaining failure but value incompatibility. Creon could've conceded earlier (after Teiresias, say), but any deal requiring Antigone to recognize state authority over burial would still demand she discount the sacred - impossible for her. 

  The play's contribution beyond journals? It dramatizes the emotional cost of moral trade attempts. Haemon's desperation, Creon's dawning realization - these show why some frameworks resist negotiation not from stubbornness but from coherence. 

  Final verdict: Antigone's motives aren't contested here - she consistently acts as if divine law has no price. The tragedy confirms her stance: when Creon finally trades, the gods don't credit the transaction. The bodies pile up precisely because some accounts can't be settled.
answer: |-
  Here’s a concrete breakdown of *Antigone* through your moral-trade lens, followed by a committed reading and its limitations:

  ### Bargaining Sequence Analysis
  1. **Ismene’s Offer/Rebuff**  
     - *Trade Attempt*: Ismene offers retroactive solidarity (sharing punishment) after refusing shared risk.  
     - *Failure Point*: Antigone rejects this as "moral free-riding." Accepting would dilute her act’s moral exclusivity—like paying in counterfeit currency. Her burial duty is non-transferable; sharing punishment without shared action commodifies martyrdom.  
     - *Creon’s Missed Opportunity*: None here. Ismene’s irrelevance to Creon highlights his fixation on obedience, not moral exchange.

  2. **Haemon’s Appeal**  
     - *Trade Attempt*: Haemon offers Creon political capital (popular support) in exchange for pardoning Antigone.  
     - *Failure Point*: Creon misreads this as extortion, not trade. He sees flexibility as devaluing his authority. Conceding would cost him *less than catastrophe* (yielding on punishment but upholding the decree), but his framework equates compromise with integrity-loss. Antigone gains nothing—she’d still see Polyneices dishonored.  
     - *Antigone’s Position*: She cannot offer Creon anything (e.g., public submission) without betraying the burial’s sacredness. For her, the act’s moral worth dissolves if bargained over.

  3. **Teiresias’ Warning**  
     - *Trade Attempt*: Teiresias offers Creon a chance to avoid divine wrath (future cost) by reversing course.  
     - *Creon’s Accusation*: His bribery charge reveals his transactional worldview: all moral claims are reducible to hidden payments.  
     - *Late Concession*: Burying Polyneices and freeing Antigone *is* Creon trading—but too late. The cost? His son and wife. Earlier action (e.g., after Haemon’s plea) might have averted tragedy at lower cost (minor reputation loss).

  4. **Antigone’s Non-Substitutability Argument**  
     - *Moral-Trade Challenge*: Her claim that brothers are irreplaceable posits a good with *infinite marginal value*. In trade terms: no quantity of other goods (husbands, children) offsets its loss.  
     - *Framework Absorption?*: Moral trade fails here. If Antigone’s duty is singular (no substitutes) and absolute (no marginal utility), it has no "exchange rate." Offering to trade it would be like auctioning a soul—meaningless within her framework.

  ### Who Blocks Trade?
  - **Creon’s Framework**: Permits trade in theory (he values political stability and authority), but his pride conflates concession with surrender. He could have traded (e.g., mitigated punishment for Antigone’s silence) without moral self-betrayal.  
  - **Antigone’s Framework**: Inherently anti-trade. The burial duty is sacred, non-negotiable, and its value destroyed by commodification. She isn’t refusing a "price"—she denies pricing is *possible*.  

  ### Your Reading’s Limits: Where the Lens Breaks
  1. **Divine/Heroic Register**: The gods demand burial—no haggling. Teiresias frames consequences as cosmic justice, not market forces. Moral trade assumes human negotiators; here, transcendent laws bind Antigone and doom Creon.  
  2. **Tragic Essence**: They aren’t just "bad bargainers." Antigone *must* defy; Creon *must* crumble. Framing them as agents misrepresents tragedy as negotiation error. Haemon’s and Teiresias’ flexibility isn’t "shallow"—it’s human pragmatism contrasted with fatal absolutism.  
  3. **Antigone’s Motive**: If she seeks heroic glory (a contested reading), her refusal makes sense as investment in eternal fame—a "currency" Creon can’t offer. But the play stresses divine duty over reputation.  

  ### Committed Reading: Tragedy as Anti-Trade  
  I side with **your view**: The play refutes moral trade.  
  - **Why?**  
    1. **No Mutual Gains**: Creon’s and Antigone’s "currencies" (state authority vs. divine law) aren’t fungible. Any "deal" (e.g., secret burial + public pardon) would require both to violate core commitments.  
    2. **Non-Tradeable Goods**: Antigone’s argument holds. Some goods (brother’s burial, divine favor) lose value if priced. Creon’s belated trade (burying Polyneices) isn’t honored by the gods—the family dies anyway. The play shows *why* such goods resist markets: they derive worth from categorical, not comparative, value.  
    3. **Extortion Foreshadowed**: Creon’s bribery accusation previews a world where moral claims are reduced to bids—a corruption the play condemns.  

  ### What Drama Contributes Beyond Journals  
  - **Stakes of Incommensurability**: Journals debate abstract duties; *Antigone* shows bodies piling up when values clash. Haemon’s suicide viscerally argues that some duties *cannot* be offset.  
  - **Motives Matter**: Your verdict hinges on Antigone’s purity of motive. If she’s partly driven by stubborn pride (a contested reading), moral trade seems more plausible—but the text emphasizes divine duty. Drama forces us to ask: Can any "trade" satisfy the gods? The answer here is *no*.  

  **In short**: The play insists some goods are priceless not because they’re valuable, but because pricing them annihilates their worth. Creon’s collapse isn’t bad bargaining—it’s the market hitting a moral singularity.
