  I recall that impossible worlds avoid logical omniscience by allowing worlds where logical truths don't hold. But they might struggle with defining which inferences are obvious. Awareness operators tag propositions the agent has considered, but might make culpability too narrow. Degrees of belief (like probabilities) could model thresholds but may not capture the structure of reasoning. Fragmentation handles compartmentalization but risks making nothing accessible. 

