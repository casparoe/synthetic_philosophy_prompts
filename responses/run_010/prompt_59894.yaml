answer: |-
  ## Night Book, Grand Hotel

  The house is full. No vacancy. The **key**
  Hangs silent by the worn front desk. The **corridor**
  Stretches, accounted for within the **register**,
  Each slot defined beneath the green desk **lamp**.
  A traveler enters, damp. I ring the **bell**
  Announcing: Shift. Make room. Open your **door**.

  The first guest moves beyond his former **door**
  To room two, taking up its waiting **key**.
  A chain reaction answers that first **bell**,
  A wave of shuffling down the **corridor**,
  Each number stepping up. The **register**
  Requires adjustment by the dimming **lamp**.

  I note the changes in the ledger’s **lamp**-
  Light: Guest One now inhabits number two’s **door**.
  The orderly progression in the **register**
  Seems sound, though endless. Each received a **key**,
  Each step absorbed along the **corridor**
  Without a final guest displaced. The **bell**

  Stays still. Until the thunder of a **bell**
  Announces coaches, endless. Flickers **lamp**
  On faces crowding past the **corridor**,
  A queue demanding each a numbered **door**.
  My old belief—a plot defines the **key**
  To substance—strains. I check the **register**.

  I double entries. Odd rooms in the **register**
  Stand clear. The coach-guests hear their summoning **bell**,
  Take odd-numbered rooms. I hand each **key**
  To new arrivals crowding near the **lamp**.
  All housed. Yet why does room one stand, its **door**
  Ajar, untouched, down the long **corridor**?

  The meaning frays. "Is full"—down the **corridor**—
  Meant ground occupied, matched in the **register**.
  No gap implied. But here, beside this **door**
  Left void, "full" splits: all guests housed by the **bell**'s
  Command, yet space remains. The surveyor’s **lamp**
  Flickers on paradox. The moving **key**

  Lies in the endless chain, the **key** to how
  A whole contains itself. The **corridor**
  Extends through sequence, not through stone. The **register**'s
  Logic, not mortar, holds. The fading **lamp**
  Confirms: the rule *is* house. The final **bell**
  Signals the method holds—behind each **door**.
