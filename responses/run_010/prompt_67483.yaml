prompt: |-
  I'm in the second year of a slightly odd masters program that makes me take economics courses and philosophy-of-science courses in the same building, and last week something clicked that I can't unsee. In my asset pricing seminar we went through a run of papers where the field's basic framework gets contradicted by the data — the standard example being that long-run stock returns are way higher than any plausible model of people smoothing their consumption would predict, plus a pile of return patterns (momentum, value, low-vol, whatever) that the simplest market models say shouldn't be exploitable. And what happens every single time is that nobody proposes giving up the framework. Someone adds a new ingredient — a taste for insuring against rare disasters, habit formation, one more "risk factor" — and that ingredient gets published as a contribution in its own right, and the framework walks away unharmed. It got so routine that a few years back some people counted up how many such factors had been published, found hundreds of them, and argued that new ones should have to clear a much higher statistical bar than the usual two-sigma rule, precisely because rescuing the model had become too cheap. Someone in the seminar said, half-joking, that this makes the whole apparatus unfalsifiable, and the professor's reply was roughly: no, because a good rescue predicts something new that you can go check independently, whereas a bad one is ad hoc — it exists only to make the anomaly disappear. That distinction seemed to satisfy everyone in the room and it did not satisfy me at all.

  Then two days later, in my methods class, we did the famous Friedman essay on the methodology of positive economics, which I gather is still the semi-official statement of how the profession thinks about itself. The doctrine there is that whether a theory's assumptions are realistic is beside the point — firms don't literally solve marginal conditions, they just behave as if they do, like a champion billiard player who behaves as if he knows the differential equations — and the only thing that matters is whether the theory's predictions are accurate. I kept waiting for someone to notice that this cuts directly against what happened in the other seminar. If predictive accuracy is the only currency, then a contradiction between prediction and data is just a strike against the theory, full stop, and the question "was that rescue ad hoc or independently motivated?" shouldn't even be a question, since a rescue either improves predictions or it doesn't. And on the same view, the big selling point of behavioural economics — that its assumptions are psychologically more honest about how people actually choose under risk, unlike the axiom-violating experiments going back to Allais — shouldn't count as a selling point at all, because realism of assumptions was declared irrelevant. Yet in practice people clearly treat the ad-hoc/progressive distinction as doing real work, and they clearly treat psychological realism as a virtue. So the profession seems to be running two incompatible accounts of what makes a theory worth keeping, and only ever states one of them out loud.

  Can you act as a philosopher of science who has actually spent time inside an economics department, and take this apart properly? Think it through slowly — before you settle on an answer, brainstorm the full range of theories of confirmation and of scientific progress that could license the seminar behaviour, including ones that aren't the obvious Lakatosian move (someone told me once this is what Lakatos meant by a research programme and its protective belt, but I never got past the slogan, so tell me whether the practice really is Lakatosian or whether that's a stretch). Then: reconstruct the implicit theory the practice presupposes as precisely as you can; seperate what it strictly requires from what merely fits it comfortably, since I suspect several very different views would license the same behaviour; say which rival accounts of evidence and of theory-choice the practice quietly rules out just by existing; and tell me whether the two halves — the seminar norms and the Friedman self-image — can be held together honestly, or whether one of them is really just window dressing. Finally, describe what would have to change on the ground if you swapped the implicit view for strict instrumentalism: journal norms, what counts as a contribution, seminar etiquette, hiring, the way textbooks present superseded material. Please also flag where you think my description of the practice is unfair or just wrong — I'm writing my thesis on housing supply regulation so this is largely procrastination, but I'd rather know if I've caricatured the field. And end by saying what would change your mind: which argument or piece of the practice, described differently, would push you to a different verdict, and where in your reasoning you're most likely to be going wrong.
reasoning: |-
  Okay, the user is in a unique master's program combining economics and philosophy of science. They noticed a contradiction between how economists handle anomalies in asset pricing and the methodological stance from Friedman's essay. Let me unpack this.

  First, in asset pricing, when data contradicts models (like high stock returns or exploitable patterns), economists add new factors instead of abandoning the framework. The professor justified this by distinguishing between ad hoc fixes and those that predict new phenomena. The user was unsatisfied. Then, in methods class, Friedman's instrumentalism says only predictive accuracy matters, not realistic assumptions. The user sees a conflict: if only predictions count, why care if a fix is ad hoc? Why value psychological realism in behavioral economics?

  The user wants a philosopher of science's analysis. They want a thorough exploration of theories of confirmation, the implicit rules in economics practice, and whether the seminar behavior and Friedman's view can coexist. Also, they want to know what changes if instrumentalism were strictly applied.

  I need to address several layers. Start by outlining relevant philosophy of science theories: Popper's falsification, Lakatos' research programmes, Kuhn's paradigms, Bayesianism, etc. Then, analyze if the seminar's approach fits Lakatos—protective belt adjustments with novel predictions. But the user mentioned that might be a stretch, so check if the practice truly requires novel predictions or just pays lip service.

  Next, reconstruct the implicit theory in practice. Economists seem to value predictive improvement but also explanatory coherence. Factors are accepted if they tie into existing theory, even if initially ad hoc. Also, psychological realism is valued despite Friedman, possibly because it offers new research avenues or fits with intuition.

  Comparing to Friedman, instrumentalism strictly says only predictions matter. But in practice, economists care about theoretical elegance and coherence. This creates tension. The implicit theory might be a hybrid: predictive accuracy as primary, but with secondary criteria like theoretical integration and explanatory depth.

  The user might be pointing out hypocrisy or inconsistency. Need to assess if both can be held honestly. Maybe Friedman's view is idealized, while practice is pragmatic. Or perhaps behavioral econ's realism leads to better predictions long-term, aligning with instrumentalism.

  If strict instrumentalism were applied, journals would prioritize any predictive model, regardless of theoretical basis. Ad hoc factors without novel predictions would be acceptable. Hiring might favor empirical researchers over theorists. Textbooks would present models based on predictive success, not theoretical lineage.

  Now, where might the user's description be off? They imply hundreds of factors are always added, but some might be discarded. Also, behavioral factors are sometimes criticized for being ad hoc too. The field isn't monolithic; there's debate.

  To change my view, evidence that novel predictions from new factors are consistently tested and failed ones rejected. Or if top journals publish models solely for predictive power without theoretical justification. Also, if behavioral econ's success is due to predictive gains, not realism.

  Key points: The implicit theory values explanatory coherence alongside predictions. Friedman's instrumentalism is a simplification. Practice tolerates some tension because it's pragmatic. Strict instrumentalism would make economic theory more fragmented and less cohesive.
answer: |-
  Let's dissect this systematically, as you requested. Your observation cuts to the heart of economic methodology, and the tension you identify is genuine. I'll act as a philosopher of science embedded in an econ department, drawing on both the practice and the rhetoric.

  **1. Brainstorming Theories of Confirmation & Progress Relevant to the Seminar Behavior:**

  *   **Naive Falsificationism (Popper):** Contradictory evidence *should* force rejection of the core framework. The seminar behavior directly violates this. Popper would condemn the "rescue" efforts as immunizing stratagems.
  *   **Sophisticated Methodological Falsificationism (Lakatos):** This is the "obvious" move. Theories exist within "Research Programmes" (RP) with a hard core (e.g., rational agents, utility maximization, market efficiency/equilibrium) and a protective belt of auxiliary hypotheses (e.g., specific utility functions, risk factors, market frictions). Anomalies target the belt, not the core. Modifications to the belt are "progressive" if they: a) explain the anomaly, *and* b) predict *novel* facts (excess content). "Degenerate" modifications only explain the anomaly ad hoc. The professor's distinction maps directly onto this.
  *   **Kuhnian Paradigms:** The core framework is the paradigm. Anomalies accumulate until a crisis prompts a paradigm shift (e.g., behavioral replacing neoclassical). The seminar behavior represents "normal science" – puzzle-solving *within* the paradigm. The resistance to abandoning the core is typical; paradigms aren't abandoned because of anomalies alone, but only when a better alternative is available.
  *   **Bayesian Confirmation:** Evidence updates the probability we assign to a theory/hypothesis. A new factor (H) is confirmed if it significantly increases the likelihood of the observed data (D), i.e., P(D|H) >> P(D|~H). Distinguishing "ad hoc" from "progressive" might relate to the prior probability of H. A factor derived from deep theory or independent evidence gets a higher prior than one invented solely for the anomaly. Novel prediction success drastically increases P(D|H).
  *   **Inference to the Best Explanation (IBE):** We choose the hypothesis that provides the best *explanation* for the evidence. A "progressive" rescue provides a deeper, more coherent, more unifying explanation than an ad hoc one. Novel predictions are strong evidence of explanatory power.
  *   **Pragmatic Instrumentalism (Friedman):** Theories are tools for prediction. Only predictive accuracy matters. Assumptions are "as if," irrelevant fictions. A rescue is good *if and only if* it improves predictions consistently. Whether it's ad hoc or independently motivated is irrelevant noise. Novel predictions are just *more predictions* to test.
  *   **Structural Realism:** We should believe the core *structure* of successful theories is preserved through theory change (e.g., optimization, equilibrium), even if the specific entities (e.g., precise utility functions) change. Adding factors preserves the structural core.
  *   **Methodological Pluralism / Contamination:** Economics isn't "pure" science. Its methodology is contaminated by: a) **Mathematical Tractability:** Complex, psychologically realistic models can be intractable. Simpler, unrealistic assumptions prevail even if known to be false. b) **Policy Relevance:** Frameworks need to be *usable* for policy analysis, requiring stability and broad applicability. c) **Institutional Incentives:** Publishing requires novelty; adding a new factor is a clear path to publication. Abandoning the core framework is career-risking and makes existing knowledge obsolete.

  **2. Reconstructing the Implicit Theory in Practice:**

  *   **Precise Reconstruction:** The dominant implicit methodology is a **Lakatosian Research Programme framework with strong Kuhnian inertia and pragmatic constraints, filtered through Bayesian/IBE intuitions about priors and explanations, but judged primarily on pragmatic instrumentalist grounds.**
      *   **Core Tenets (Hard Core - Lakatos):** Agents are rational optimizers (broadly defined), markets tend towards equilibrium (broadly defined), asset prices reflect fundamental value + risk (broadly defined). This core is treated as nearly sacrosanct.
      *   **Progress Requirement (Protective Belt - Lakatos):** Auxiliary hypotheses (new factors, frictions, preferences) *can* be added to explain anomalies, but they are judged more favorably if they:
          1.  **Explain the Anomaly:** Fix the immediate contradiction.
          2.  **Generate Novel Predictions (Progressive - Lakatos):** Predict something *new* and empirically verifiable beyond the initial anomaly. (e.g., Habit formation predicts specific dynamics in consumption volatility).
          3.  **Cohere with Existing Theory (IBE/Bayesian Prior):** Fit plausibly within the broad rational/optimizing framework. A "taste for rare disasters" feels more "economic" than "people are randomly moody on Tuesdays."
          4.  **Enhance Predictive Scope/Accuracy (Instrumentalism):** Ultimately, the *goal* is seen as improving predictive power, even if the path involves theoretical adjustments.
          5.  **Maintain Tractability (Pragmatic Constraint):** The modification shouldn't make the model unusably complex for calibration or policy analysis.
      *   **Ad Hoc Defined:** A modification violating (2) and/or (3). It *only* explains the specific anomaly it was invented for, doesn't connect to other theory, and offers no new testable implications. It's a "patch." (e.g., "Add 0.5% to the equity premium because reasons").
      *   **Role of Psychological Realism:** While Friedman dismisses assumption realism, in practice, psychological plausibility (e.g., prospect theory) often acts as a strong heuristic for (3) Coherence and as a *source* for (2) Novel Predictions. It makes the auxiliary hypothesis seem less arbitrary, giving it a higher prior (Bayesian) or making it a better explanation (IBE). It signals the factor might be robust and generate further insights.

  *   **What it Strictly Requires vs. Comfortably Fits:**
      *   **Strictly Requires:** (1) Explaining the anomaly. (4) *Potential* for improved prediction (though often assumed rather than rigorously proven for new domains).
      *   **Comfortably Fits (Highly Valued, Often De Facto Required for Publication):** (2) Novel predictions (or at least the *promise* of them). (3) Theoretical coherence/plausibility within the rational framework. (5) Tractability.
      *   **Ruled Out:** Strict Popperian falsificationism (core rejection due to anomaly). *Pure* Friedman instrumentalism (ignoring ad-hocness/coherence). Radical paradigm shifts as a first resort.

  **3. Compatibility with Friedman:**

  *   **The Tension:** You are absolutely correct. Friedman's explicit doctrine ("only predictions matter, assumptions are irrelevant 'as if' fictions") is fundamentally incompatible with the practice of distinguishing "ad hoc" from "progressive" rescues based on *theoretical* virtues (novel predictions imply new *theoretical* content, coherence is about *theoretical* structure) and valuing psychological realism.
  *   **Can They Be Held Together?** Not honestly as stated. Friedman provides a powerful *rhetorical defense* against critics of unrealistic assumptions (the billiards player) and emphasizes prediction as the goal. However, the *actual practice* of theory development and evaluation relies heavily on criteria Friedman explicitly dismisses. The Friedman essay functions more as **defensive rhetoric and a justification for abstraction** than an accurate description of day-to-day methodological decision-making in theory development.
  *   **The Window Dressing:** Friedman is the window dressing. It's the official story told to outsiders (and students in methods classes) to deflect criticism about realism. The implicit Lakatosian/Kuhnian/pragmatic hybrid is the engine driving research choices within the established asset pricing paradigm. Behavioral economics' appeal *does* partly rely on assumption realism, contra Friedman, because that realism is seen as a source of better explanations and *more accurate* predictions in specific domains (e.g., puzzles the standard model fails at), even if its core often clashes with the neoclassical hard core.

  **4. Impact of Switching to Strict Instrumentalism:**

  *   **Journal Norms:** Papers could *only* be judged on immediate, demonstrable predictive improvement on specific datasets. Theoretical motivation, coherence, novelty beyond the immediate fix, and "ad-hocness" would be irrelevant. "We added a dummy variable for years ending in '3' and it improved the R-squared by 0.02" could be publishable if it "works."
  *   **What Counts as a Contribution:** *Any* predictive improvement, however achieved, regardless of theoretical rationale or generality. Clever curve-fitting and machine learning models without economic interpretation would dominate. Developing deep theoretical foundations for factors would be seen as wasted effort.
  *   **Seminar Etiquette:** Questions like "But is this factor theoretically motivated?" or "What novel predictions does this make?" or "Isn't this just ad hoc?" would be nonsensical. The *only* valid questions would be "How much did the prediction error decrease?" and "Does it work on this other dataset?"
  *   **Hiring:** Expertise in complex structural modeling or theoretical microfoundations would be devalued. Expertise in high-powered econometrics, machine learning, and empirical prediction tournaments would be paramount.
  *   **Textbooks:** Superseded models would vanish immediately once a new model showed better predictive performance on current data. Textbooks would resemble cookbooks of current best-predicting techniques, devoid of theoretical lineage or debate about foundations. History of thought would disappear.
  *   **Overall:** Economic theory would become fragmented, potentially more empirically accurate in narrow domains in the short term, but lacking coherence, explanatory power, and the ability to address novel situations outside past data. The link between micro behavior and macro outcomes would severely weaken.

  **5. Assessing Your Description & Potential Caricature:**

  *   **Mostly Fair:** You accurately capture the core dynamic: anomalies prompting auxiliary hypothesis development within the core framework, the proliferation of factors, and the tension between Friedman's stated doctrine and actual practice. The "hundreds of factors" (e.g., the "zoo" critique) is well-documented.
  *   **Potential Overstatements/Caricature:**
      *   **"Nobody proposes giving up the framework":** This *does* happen, but it's rare, marginal, and often comes from outside the mainstream (e.g., radical behavioralists, econophysics, complexity econ). Within top journals/seminars, it's extremely uncommon. Frameworks *do* evolve significantly (e.g., incorporating limited rationality, information frictions), but rarely is the core of optimization/equilibrium abandoned.
      *   **"Walks away unharmed":** The core *is* affected. Adding habits, rare disasters, or behavioral elements *does* change the nature of the framework. It becomes more complex and less "pure." It's a process of core *erosion* or *enrichment*, not pristine preservation. The core concepts (optimization, equilibrium) become more abstract and less directly tied to strong-form rationality or instantaneous clearing.
      *   **Rescues are "too cheap":** While many factors are proposed, most die quietly. The critique about the statistical bar (e.g., Harvey, Liu, Zhu (2016)) *has* had an impact. Replication crises and demands for out-of-sample testing, pre-registration, and higher t-statistics are rising, partly in response to the factor zoo. The process is messier than "cheap rescue always wins."
      *   **Behavioral Economics' Reception:** While psychological realism is a selling point, behavioral models are *also* often criticized for being ad hoc ("another bias"), lacking a unified theory, and sometimes failing to outperform simpler models predictively. Its acceptance isn't solely due to realism; it's also because it *works* for specific anomalies (e.g., equity premium, disposition effect) in ways the standard model couldn't.

  **6. What Would Change My Mind & Where I Might Be Wrong:**

  *   **Changing My Mind (Evidence for Stronger Instrumentalism):**
      *   If top journals consistently published papers *explicitly defending* ad-hoc factors *purely* on short-term predictive gains without *any* appeal to theoretical motivation or novel predictions, and if this was widely accepted in seminars.
      *   If hiring committees demonstrably prioritized pure predictive power (e.g., Kaggle competition winners) over theoretical training or model coherence.
      *   If textbooks systematically removed the theoretical justification for models and presented them solely as predictive tools, explicitly citing Friedman.
  *   **Changing My Mind (Evidence for More Radical Practice):**
      *   If seminars regularly featured serious discussions about abandoning the rational agent/equilibrium core in mainstream asset pricing due to anomalies, *without* a dominant alternative paradigm ready, and if such papers were published in top journals.
      *   If the "novel prediction" requirement was systematically shown to be a sham – i.e., factors are consistently published without novel predictions, or the "novel" predictions are trivial/untested, and this faces no criticism.
  *   **Where I Might Be Wrong:**
      *   **Overstating Lakatos:** The "novel prediction" criterion might be weaker in practice than I suggest. Many published factors might lack truly novel, tested predictions, relying more on coherence/tractability. The RP structure might be messier.
      *   **Underestimating Instrumentalism:** Perhaps the *only* reason coherence/novelty matter is that they are heuristics for *long-run* predictive success. The profession might believe, at some level, Friedman is ultimately right, and these are just useful proxies.
      *   **Field Heterogeneity:** Asset pricing might be particularly prone to this dynamic. Other fields (e.g., empirical IO, labor) might hew closer to instrumentalism, focusing on credible identification for specific effects rather than grand theoretical rescues. Development economics experiments might lean more towards Popperian tests of specific mechanisms.
      *   **Evolution:** The practice might be shifting faster than I acknowledge towards stricter empirical standards and greater acceptance of behavioral elements as *part* of the evolving core, reducing the tension.

  **Conclusion:** You've identified a real and profound methodological fissure. The implicit theory governing the seminar practice is a pragmatic blend of Lakatosian resilience (protect the core, demand progressive adjustments) and Kuhnian normal science, judged by a mix of instrumentalist goals (does it predict better?) and theoretical virtues (is it coherent/explanatory/generative?). Friedman's official instrumentalism is largely incompatible with this practice, serving more as a defensive rhetorical shield than a guiding principle for theory development. It allows economists to dismiss critiques of unrealistic assumptions while quietly relying on theoretical plausibility to guide model-building. Switching to strict instrumentalism would radically alter the field's character, prioritizing prediction at the expense of explanation and coherence. While your description slightly overstates the passivity of the core and the cheapness of rescues, it captures the essential dynamic accurately. The field persists in this state because the core framework offers immense tractability, unifying power, and institutional inertia, and because finding a truly superior, comprehensive alternative has proven extraordinarily difficult. The tension persists because it's functional, not because it's logically coherent. Good luck with the thesis (and the procrastination)!
