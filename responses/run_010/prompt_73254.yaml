  For locality, key aspects include factorisability (joint probabilities), prohibition of spacelike influences, no-signalling, and causal constraints. For realism, options range from determinism to counterfactual definiteness, ontic quantum states, and explanatory depth via local beables. I'll need to evaluate each pairing - for example, factorisability + determinism is refuted, while no-signalling + counterfactual definiteness might leave the latter untouched.

  Regarding the chair's claim, I disagree that the positions are symmetric. The Bohmian accepts nonlocal causation but maintains observer-independent reality, while the QBist preserves no-signalling at the cost of observer-dependent facts. Crucially, nonlocal influences in Bohmian mechanics don't allow signalling, so they're compatible with relativity. The QBist avoids nonlocality but gives up on a mind-independent world. Thus, the experiments constrain only the conjunction - either conjunct can be abandoned, but the choices aren't equivalent in their philosophical costs. Realism isn't always redundant; in some interpretations it adds substantive content beyond locality constraints.

