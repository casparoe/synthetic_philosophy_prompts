prompt: |-
  I am setting the final examination for an MA seminar titled Memory, Testimony, and Political Ethics, and I need one essay question, a model answer, and a marking scheme. The paper is three hours long and closed book; candidates are told they need not cite, quote, or name sources, only argue. The question is worth 25 marks and should be answerable in roughly 1,500 words.

  The question must be built on the following case, which I have invented and which you should reproduce on the paper in a tightened form of no more than 200 words, flagged as fictional so that no candidate thinks it tracks a real country's statute:

  For forty-one years the interior ministry of the Republic of Karst maintained a domestic surveillance programme. Its surviving files, known as the Registry, run to some 1.8 million entries: reports on subjects, lists of informants, and written denunciations. Audits have established that informants were sometimes compelled, that regional offices worked to numerical quotas, and that in one district fabrications account for a majority of entries. A transitional bill proposes the following regime: public access restricted to a five-member commission, empowered to release names only where independent corroboration exists; sealing of the remainder for forty years; automatic destruction at the end of that period; and a right, for any individual named in the Registry as either subject or informant, to petition for the destruction of the entries concerning them. The stated grounds are threefold. First, unreliability: the Registry does not establish what it purports to establish. Second, harm: in two towns granted early full access, longitudinal studies found no measurable rise in interpersonal trust and a marked increase in private retaliation, ostracism, and contested inheritances. Third, civic effect: participation in public life among the youngest cohort runs inversely to exposure to Registry content. Opposing the bill, an association representing the families of roughly six thousand people who disappeared argues that for many of the missing the Registry is the only surviving trace, and that allowing the successor state to decide what is destroyed simply continues the old regime's control of the record. Two further facts should feature, because they are where the case bites: about two fifths of the petitions lodged so far come from informants rather than subjects; and the only Registry entries concerning the disappeared are arrest-and-transfer notations produced by the same district offices whose fabrications generated the unreliability finding.

  The point of the question is not to elicit a verdict on the bill. It is to see whether candidates can hold apart three things they will otherwise run together: whether a duty to remember is owed to the remembered or to the remembering community, and what follows from each answer about who may waive it; whether archival custody without uptake by any audience counts as remembering at all; and whether a document that misdescribes an individual's conduct can still be a reliable record of the institution that produced it. Please stipulate, in the question itself, two terms candidates are to use: "custodial remembering," meaning preservation of a record by an institution on behalf of a community that need never read it, and "communicative remembering," meaning preservation that secures actual uptake by some community, and "standing to forget," meaning the authority, if anyone has it, to release another from a duty to remember. The A/B boundary should turn on whether candidates can explain why the petitioning victims' and informants' own wishes do not by themselves settle the permissibility of destruction, and on whether they can state what would have to be true for a sunset clause to be a mode of remembering rather than of forgetting.

  You may assume candidates have read Margalit's The Ethics of Memory (2002), including his distinction between ethics as the domain of thick relations and morality as the domain of thin relations, and his claim that radical evil, in attacking a shared humanity, grounds an obligation to remember its victims; and Rieff's The Triumph of the Therapeutic (1966), including his account of how moral and religious demands come to be recast as questions about individual psychic well-being. Do not require any further reading, and do not put words in either author's mouth: the question should ask candidates to construct the strongest available case for forgetting out of Rieff's premises about therapeutic culture, rather than to report conclusions he is supposed to have drawn about memory, since he is not a straightforward partisan of forgetting.

  Please supply three things. First, the examination question exactly as it will appear, including the case summary, the stipulated definitions, and an explicit instruction that candidates must take a position and defend it rather than survey both sides. Second, a model answer of about 750 words that does precisely that: argues a defensible line on the bill's central provisions, and shows its work on the three distinctions above, including the awkward fact that the notations concerning the disappeared come from the least reliable offices. Third, a marking scheme totalling 25 marks, allocated across five or six must-hit points, each given with what the point is, what an A-range answer says about it, what a B-range answer says about it that keeps it out of the A range, and the marks available. Close with a list of specific errors that should cost marks — for instance, treating forgiveness and forgetting as the same operation, assuming the duty attaches to survivors' feelings rather than to anything owed to the dead, invoking collective memory without saying who the bearer of the duty is, or reasoning from the unreliability of denunciations to the unreliability of every entry in the Registry — each with the deduction and one line on why it evidences a misunderstanding rather than a stylistic lapse.
reasoning: |-
  We are constructing an essay question for an MA seminar final examination. The question is built around a fictional case study about the "Registry" in the Republic of Karst. The case involves a controversial transitional bill that proposes restricted access and eventual destruction of the Registry. The key points of the case are:

  - The Registry contains 1.8 million entries from a 41-year domestic surveillance program.
  - Problems: Informants were sometimes compelled, regional offices had quotas, and one district had mostly fabrications.
  - The bill proposes:
    1. Public access restricted to a 5-member commission (which can release names only with independent corroboration).
    2. Sealing the rest for 40 years, then automatic destruction.
    3. A right for any named individual (subject or informant) to petition for the destruction of their own entries.
  - Stated grounds for the bill: unreliability, harm (increased retaliation, ostracism, etc.), and negative civic effect (reduced participation in public life among the young).
  - Opposition: An association of families of the disappeared (about 6,000 missing) argues that the Registry is the only trace of the disappeared and that the state's control over destruction continues the old regime's control.
  - Two awkward facts:
    - About two-fifths of petitions so far are from informants (not subjects).
    - The only entries about the disappeared are arrest-and-transfer notations from the same unreliable district offices.

  The point of the question is to test three distinctions:

  1. Whether a duty to remember is owed to the remembered or to the remembering community, and what that implies about who can waive it.
  2. Whether "custodial remembering" (preservation without uptake) counts as remembering at all.
  3. Whether a document that misdescribes an individual can still reliably record the institution that produced it.

  We are to stipulate three terms:

  - "custodial remembering": preservation by an institution on behalf of a community that need never read it.
  - "communicative remembering": preservation that secures actual uptake by some community.
  - "standing to forget": the authority to release another from a duty to remember.

  The A/B boundary should depend on:

  - Explaining why the victims' and informants' wishes don't by themselves settle the permissibility of destruction.
  - Stating what must be true for a sunset clause to be a mode of remembering rather than forgetting.

  We assume candidates have read Margalit (2002) and Rieff (1966). We are to use Rieff to build a case for forgetting (without putting words in his mouth) and Margalit for the duty to remember.

  Now, the required outputs:

  1. The examination question (with case summary, definitions, and instruction to take a position and defend it).
  2. A model answer (about 750 words) that takes a position and addresses the three distinctions and the awkward facts.
  3. A marking scheme (25 marks) with 5-6 must-hit points (with A and B descriptions) and a list of specific errors with deductions.

  Let's proceed step by step.

  ### Step 1: Examination Question

  We need to write the question exactly as it will appear. It should include:

  - A tightened case summary (max 200 words, flagged as fictional).
  - Stipulated definitions of the three terms.
  - The explicit instruction to take a position and defend it.
  - The question prompt that directs candidates to address the three distinctions and the awkward facts.

  Question prompt:

  > "Taking a position on the transitional bill, argue whether its provisions constitute a responsible approach to the Registry. In doing so, you must address:
  > - Whether the duty to remember is owed primarily to the remembered or to the remembering community, and what this implies about the right of individuals to petition for destruction;
  > - Whether 'custodial remembering' (as defined) is sufficient for fulfilling a duty to remember;
  > - How the fact that the arrest-and-transfer notations about the disappeared were produced by the least reliable offices bears on the reliability of the Registry as a record of the institution; and
  > - What would have to be true for the forty-year sunset clause to be understood as a mode of remembering rather than forgetting.

  > Your answer must use the stipulated terms and engage with the arguments for forgetting that can be constructed from Rieff's account of therapeutic culture and with Margalit's claims about the duty to remember radical evil. You are expected to take a clear position and defend it, not survey both sides."

  Now, the case summary (tightened to 200 words):

  > FICTIONAL CASE: For 41 years, the Republic of Karst's interior ministry ran a domestic surveillance programme. Its surviving files (the Registry) contain 1.8 million entries: reports on subjects, informant lists, and denunciations. Audits found that informants were sometimes compelled, regional offices worked to quotas, and one district had mostly fabrications. A transitional bill proposes: (1) public access restricted to a five-member commission (releasing names only with independent corroboration); (2) sealing the rest for 40 years, then automatic destruction; (3) a right for any named individual (subject or informant) to petition for destruction of their entries. Grounds: unreliability; harm (in two towns with early access, studies showed increased retaliation, ostracism, and contested inheritances, and reduced civic participation among the young). Opposing the bill, an association of families of about 6,000 disappeared persons argues the Registry is the only trace of the missing, and state control of destruction continues the old regime's control. Two key facts: about 40% of petitions so far are from informants; the only entries about the disappeared are arrest-and-transfer notations from the same unreliable district offices.

  Stipulated terms:

  > For this question, use the following definitions:
  > - "Custodial remembering": preservation of a record by an institution on behalf of a community that need never read it.
  > - "Communicative remembering": preservation that secures actual uptake by some community.
  > - "Standing to forget": the authority, if anyone has it, to release another from a duty to remember.

  ### Step 2: Model Answer (Approx 750 words)

  We are to take a position and defend it. Let's choose a position: **Opposing the bill** (but note: the question doesn't require a verdict on the bill per se but on whether it's a responsible approach). However, the instructions say "take a position on the transitional bill". We can also choose to support the bill. Since the model answer should be exemplary, we'll take a nuanced position that engages the complexities.

  Position: The bill's provisions are not a responsible approach because they fail to adequately address the duty to remember the victims of radical evil and because they prioritize therapeutic individual relief over the community's need to confront its institutional past.

  Now, we must address:

  1. **Duty to remember**: Owed to whom? (Margalit: radical evil creates a duty to remember the victims, which is owed to humanity. This duty is moral (thin relations) and thus not waivable by individuals or even the community. But also, the community has an ethical duty (thick relations) to remember for its own identity and future.)
  2. **Custodial vs. communicative remembering**: The bill's restricted access and sealing amount to custodial remembering. But is that enough? We must argue that without uptake (communicative remembering), the duty is not fulfilled because the community does not actually remember.
  3. **Reliability of the institutional record**: Even if individual entries are unreliable (because from a district that fabricated), the Registry as a whole is a reliable record of the institution's operations. The arrest-and-transfer notations, though from unreliable offices, still testify to the fact that the state apparatus carried out disappearances.
  4. **Sunset clause as remembering?**: For the sunset clause (40-year sealing then destruction) to be a mode of remembering, it would have to be part of a plan to ensure that within that period, the community engages in communicative remembering (e.g., through education, memorials, etc.). Otherwise, it's just delayed forgetting.

  Also, we must engage Rieff: We can build a case for forgetting from Rieff's premises. In therapeutic culture, moral demands are recast in terms of individual well-being. Thus, the bill's emphasis on preventing harm (retaliation, ostracism) and on individual petitions reflects a therapeutic mindset: it prioritizes healing the individual psyche over collective moral reckoning. But we can argue that this therapeutic approach is inadequate for confronting state evil.

  And we must explain why the wishes of victims and informants don't settle the matter: The duty to remember radical evil is a moral duty (Margalit) that transcends individual wishes. Even if an informant wants to forget, the community must remember the system that compelled them. Similarly, the disappeared are owed remembrance by humanity, not just by their families.

  Model Answer Structure:

  - Introduction: State position and outline.
  - Section 1: Duty to remember - owed to the remembered (the victims) and to the remembering community. The disappeared are victims of radical evil (Margalit), so the duty is non-waivable. The community also has an interest in remembering for its own moral health. Thus, individual petitions (even from victims) cannot override this duty. The fact that 40% of petitions are from informants shows the risk of allowing self-interested parties to erase the record.
  - Section 2: Custodial vs. communicative remembering. The bill's restricted access and sealing are custodial. But without uptake, it doesn't fulfill the duty. The harm studies show that uncontrolled access causes problems, but the bill's solution (near-total sealing) abandons communicative remembering. A responsible approach would seek controlled forms of uptake (e.g., redacted archives, educational use).
  - Section 3: Reliability of the institutional record. The arrest-and-transfer notes, though from unreliable offices, are still evidence of the institution's actions. They may not prove the guilt of individual officers, but they document the system. Destroying them would destroy evidence of the disappeared.
  - Section 4: Sunset clause as remembering? Only if during the 40 years, the state actively promotes communicative remembering (e.g., a truth commission, memorials, curriculum). The bill doesn't require this, so it's just forgetting.
  - Section 5: Engaging Rieff. The bill reflects therapeutic culture: it frames the issue in terms of individual harm and well-being (petitions for destruction, prevention of retaliation). But Rieff's critique implies that therapeutic culture can evade deeper moral questions. The bill avoids the collective work of confronting the past.
  - Conclusion: The bill is not responsible because it fails on all three distinctions and prioritizes therapeutic forgetting over moral remembrance.

  ### Step 3: Marking Scheme (25 marks)

  Must-hit points (5-6):

  1. **Position and engagement with the bill**: Takes a clear position and defends it with reference to the bill's provisions. (4 marks)
     - A: Clear, consistent position; sophisticated engagement with the bill's details.
     - B: Position may be unclear or inconsistently maintained; superficial treatment of the bill.

  2. **Duty to remember and standing to forget**: Correctly distinguishes between duty owed to the remembered and to the community, and explains why individual wishes (petitions) do not settle the matter. (5 marks)
     - A: Explicitly uses Margalit to argue that the duty to remember victims of radical evil is non-waivable and owed to humanity; explains that individuals lack standing to forget for the community.
     - B: Recognizes the distinction but may conflate the two duties or not fully explain why individuals cannot waive the duty.

  3. **Custodial vs. communicative remembering**: Evaluates whether custodial remembering fulfills the duty. (5 marks)
     - A: Argues that custodial remembering is insufficient without uptake; links to the bill's restricted access and sealing as inadequate for communicative remembering; suggests alternatives.
     - B: Describes the distinction but does not fully argue why one is insufficient, or does not connect to the bill's provisions.

  4. **Reliability of the institutional record**: Addresses the fact that the arrest-and-transfer notes are from unreliable offices but argues for the Registry's value as an institutional record. (5 marks)
     - A: Explains that even unreliable entries can reliably document the institution's operations, especially for systemic crimes like disappearances; notes that the arrest notes are the only trace of the disappeared.
     - B: Acknowledges the unreliability but does not fully develop the institutional argument, or fails to address the awkward fact.

  5. **Sunset clause as remembering**: States what would make the sunset clause a mode of remembering. (3 marks)
     - A: Clearly states that the sunset clause would be remembering only if accompanied by active efforts to ensure communicative remembering during the 40 years; notes the bill lacks this.
     - B: Mentions the need for uptake but does not specify what that entails or how it relates to the sunset clause.

  6. **Engagement with Rieff and therapeutic culture**: Constructs a case for forgetting from Rieff's premises and uses it to critique or support the bill. (3 marks)
     - A: Builds a strong case for forgetting based on Rieff's account of therapeutic culture (prioritizing individual well-being over collective morality) and uses it to analyze the bill's provisions; may counter-argue that therapeutic forgetting is inadequate.
     - B: Mentions Rieff but does not construct a full case for forgetting, or does not connect it to the bill.

  Total: 25 marks.

  Specific errors and deductions:

  - Treating forgiveness and forgetting as the same: -2 marks (misunderstanding of concepts).
  - Assuming the duty to remember attaches only to survivors' feelings (ignoring the duty to the dead): -2 marks (misreads Margalit).
  - Invoking collective memory without specifying the bearer of the duty: -1 mark (vagueness).
  - Reasoning from the unreliability of denunciations to the unreliability of every entry: -2 marks (fails to distinguish individual entries from institutional record).
  - Ignoring the awkward fact about the arrest notes coming from unreliable offices: -2 marks (failure to engage a key part of the case).
  - Not using the stipulated terms: -1 mark per term (up to -3) (failure to follow instructions).
  - Not taking a position (surveying both sides): -3 marks (ignores explicit instruction).
  - Misrepresenting Rieff as a straightforward partisan of forgetting: -1 mark (ignores nuance).

  Now, let's write the actual outputs.
answer: |-
  ### Examination Question

  **Fictional Case Summary (max 200 words):**  
  For forty-one years, the Republic of Karst’s interior ministry operated a domestic surveillance programme. Its surviving files (the "Registry") contain 1.8 million entries: subject reports, informant lists, and denunciations. Audits confirm informants were sometimes coerced, regional offices used quotas, and one district’s entries are mostly fabricated. A transitional bill proposes: (1) public access restricted to a five-member commission (releasing names only with independent corroboration); (2) sealing unreleased entries for forty years, followed by automatic destruction; (3) a right for any named individual (subject or informant) to petition for destruction of their entries. Justifications include unreliability, documented harms (in two towns with early access, studies showed increased retaliation, ostracism, and reduced civic engagement among youth), and civic stability. Opposing the bill, an association representing families of roughly 6,000 disappeared persons argues the Registry is the only trace of the missing, and state-controlled destruction perpetuates the old regime’s power. Two critical facts: 40% of petitions so far are from informants; the only entries concerning the disappeared are arrest-and-transfer notations from the same unreliable district offices.  

  **Stipulated Definitions:**  
  - **Custodial remembering**: Preservation of a record by an institution on behalf of a community that need never read it.  
  - **Communicative remembering**: Preservation that secures actual uptake (engagement, interpretation) by some community.  
  - **Standing to forget**: The authority, if anyone has it, to release another from a duty to remember.  

  **Question:**  
  Argue whether the transitional bill’s approach to the Registry constitutes a responsible ethical and political response to Karst’s past. Take a clear position (for or against the bill) and defend it. Your answer must:  
  - Explain why the wishes of petitioners (victims and informants) do not, by themselves, settle the permissibility of destruction, using the concepts of *duty to remember* and *standing to forget*.  
  - Evaluate whether *custodial remembering* alone fulfills any duty to remember, or if *communicative remembering* is required.  
  - Address how the unreliability of individual entries (e.g., arrest-and-transfer notations for the disappeared) affects the Registry’s reliability as a record of the *institution* that produced it.  
  - State what would have to be true for the forty-year sunset clause to be a mode of *remembering* rather than *forgetting*.  
  Engage with Margalit’s *The Ethics of Memory* (e.g., duties arising from radical evil) and construct the strongest case for forgetting using Rieff’s premises about therapeutic culture (e.g., recasting moral demands as questions of individual well-being). Do not survey both sides; argue your position.  

  ---

  ### Model Answer (Approx 750 words)  
  **Position:** The transitional bill is an irresponsible response to Karst’s past. It prioritizes therapeutic forgetting over moral remembrance, fails the disappeared, and misconstrues the duties owed to both victims and the community.  

  The bill’s core error lies in privileging individual wishes over collective duties. Margalit distinguishes ethics (thick relations, like community bonds) from morality (thin relations, binding all humans). Radical evil—such as state-sponsored disappearances—attacks shared humanity, grounding a moral duty to remember victims *as victims*. This duty is owed not primarily to the remembered (who cannot waive it) or the remembering community (which might prefer closure), but to humanity itself. Thus, petitioners—whether informants seeking erasure or families of the disappeared—lack *standing to forget*. Informants (40% of petitioners) may desire relief from shame, but their wishes cannot override the duty to expose systemic coercion. Similarly, while families of the disappeared seek preservation, their grief does not solely determine the duty; humanity’s stake in condemning radical evil is non-negotiable. The bill wrongly treats destruction petitions as sufficient ethical release, ignoring that no individual can absolve society of its moral debt.  

  Custodial remembering, as proposed (sealing files for forty years), is inadequate because it prevents communicative remembering—actual public engagement. The bill reduces remembrance to institutional storage, assuming future access suffices. But without uptake, custodialism is passive preservation, not active remembrance. Margalit implies remembrance requires narrative integration: a community must confront the past to rebuild moral norms. The harm studies cited (rising retaliation, falling civic engagement) show *unmediated* access backfires, but the bill’s solution—near-total sealing—abandons communicative work entirely. Responsible alternatives exist: redacted archives, truth commissions, or educational programmes could foster structured uptake while mitigating harm. By opting for custodialism alone, the bill ensures the Registry remains inert, failing both ethics (community self-understanding) and morality (bearing witness to evil).  

  The bill further errs in conflating individual and institutional reliability. The arrest-and-transfer notations for the disappeared *are* unreliable about specific acts (e.g., who ordered arrests), given their origin in corrupt districts. Yet they reliably document institutional behaviour: the state apparatus systematically disappeared citizens. Destroying these entries (as the bill permits via petitions or sunsetting) would erase evidence of systemic crime. Margalit’s duty to remember radical evil demands preserving such institutional testimony, even if flawed. The regime’s coercive methods (e.g., quotas, fabricated denunciations) are precisely what must be remembered to prevent recurrence. The bill’s focus on individual accuracy ignores that the Registry, as a whole, reliably exposes the institution’s malevolent design.  

  The sunset clause (destruction after forty years) could only qualify as remembering if it facilitated communicative uptake during the sealing period. For example, if the state used those decades to curate exhibits, fund research, or integrate lessons into education, the clause might serve as a "pause" for communal processing. However, the bill mandates no such measures; sealing is passive, not preparatory. Thus, the clause functions as delayed forgetting—a therapeutic deferral of moral reckoning. Here, Rieff’s critique of therapeutic culture illuminates the bill’s flaws. He argues modernity replaces moral imperatives with psychological well-being as the highest good. The bill embodies this: it frames destruction as relief for petitioners (e.g., informants escaping stigma) and positions the sunset clause as societal "healing." Yet this therapeutic logic reduces remembrance to a psychic burden, evading the harder task of institutional accountability. Rieff’s premises support forgetting only if we prioritize individual comfort over truth—but for radical evil, this is indefensible.  

  Ultimately, the bill’s provisions neglect the disappeared. Their only traces—flawed arrest notes—are vulnerable to petitions from informants (who may have participated in their oppression) or automatic destruction. This perpetuates the old regime’s violence: the state again controls the narrative, now by authorizing erasure. A responsible approach would exempt the disappeared’s entries from petitions and sunsetting, preserving them as irreducible evidence of radical evil.  

  The bill is a therapeutic escape, not an ethical solution. It sacrifices duty to memory for the illusion of peace.  

  ---

  ### Marking Scheme (25 marks total)  
  **Must-Hit Points:**  

  1. **Clear Position and Argumentation (4 marks)**  
     - **A-range (4)**: Explicitly endorses or rejects the bill; consistently defends the position with nuanced reasoning tied to the case details (e.g., informants’ petitions, harm studies).  
     - **B-range (2–3)**: Position is vague or inconsistently maintained; relies on generic claims about memory without engaging case specifics.  

  2. **Duty to Remember, Standing to Forget, and Petitions (6 marks)**  
     - **A-range (5–6)**: Uses Margalit to argue the duty to remember radical evil is non-waivable and owed to humanity; explains why petitioners (victims/informants) lack standing to forget for society; addresses the 40% informant petitions as a conflict of interest.  
     - **B-range (3–4)**: Recognizes a duty but conflates ethics/morality or owed parties; treats petitioners’ wishes as decisive without interrogating authority.  

  3. **Custodial vs. Communicative Remembering (5 marks)**  
     - **A-range (5)**: Argues custodial remembering (sealing) is insufficient without uptake; contrasts with communicative alternatives (e.g., education); links to the bill’s harm studies as a challenge requiring mediation, not abandonment.  
     - **B-range (3–4)**: Describes the distinction but does not evaluate sufficiency; mentions uptake without tying it to the bill’s access restrictions.  

  4. **Institutional Reliability and Awkward Facts (5 marks)**  
     - **A-range (5)**: Distinguishes individual unreliability (e.g., fabricated arrests) from institutional reliability (systematic oppression); argues the arrest notes for the disappeared reliably evidence state crimes despite flaws; uses this to critique destruction risks.  
     - **B-range (3–4)**: Notes unreliability but generalizes to the whole Registry; fails to address the disappeared’s entries or their origins.  

  5. **Sunset Clause as Remembering (3 marks)**  
     - **A-range (3)**: States the clause could only be remembering if paired with active communicative efforts (e.g., education, memorials) during the 40 years; notes the bill lacks this, making it forgetting.  
     - **B-range (2)**: Identifies the need for uptake but does not specify how the clause fails; calls it "forgetting" without justification.  

  6. **Engagement with Rieff and Therapeutic Culture (2 marks)**  
     - **A-range (2)**: Constructs a case for forgetting from Rieff’s premises (prioritizing individual well-being over moral demands); uses it to critique the bill as therapeutic evasion.  
     - **B-range (1)**: Mentions Rieff superficially (e.g., "therapy promotes forgetting"); does not build the case from his cultural critique.  

  **Specific Errors and Deductions:**  
  - **Treating forgiveness and forgetting as equivalent**: –2 marks (conflates distinct concepts; forgiveness may require remembrance).  
  - **Anchoring the duty solely in survivors’ feelings (ignoring the dead)**: –2 marks (misreads Margalit; duty to victims transcends survivor preferences).  
  - **Invoking "collective memory" without specifying duty-bearers**: –1 mark (vagueness; must identify if duty binds the state, citizens, or humanity).  
  - **Generalizing unreliability (e.g., "fabricated entries prove the whole Registry is useless")**: –2 marks (fails to separate individual inaccuracy from institutional evidence).  
  - **Ignoring the awkward fact about the disappeared’s arrest notes**: –2 marks (omission of a key case element).  
  - **Not using stipulated terms (custodial/communicative remembering, standing to forget)**: –1 per term (max –3).  
  - **Failing to take a position (e.g., surveying pros/cons)**: –3 marks (violates explicit instruction).  
  - **Misrepresenting Rieff as advocating forgetting**: –1 mark (he describes, but does not endorse, therapeutic culture).  

  ---  
  This examination question, model answer, and marking scheme assess candidates’ ability to disentangle the core distinctions while applying theoretical frameworks to a complex political-ethical dilemma. The model answer opposes the bill but would receive full credit for a well-argued defense if it similarly engaged the nuances.
