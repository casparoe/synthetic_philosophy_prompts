prompt: |-
  I'm a master's student in philosophy and this year I'm the teaching assistant for our third-year philosophy of mind course, which has just finished three weeks on the philosophy of pain. The convenor has asked me to set one practice essay question for the mock paper, together with a model answer and a marking scheme, so the students can calibrate their expectations before the real exam.

  I want the question to be about pain asymbolia, and I want it to be unanswerable by reciting that pain has sensory-discriminative and affective-motivational components. It should force students to take a position on what, if anything, asymbolia shows about why pains are bad: are asymbolics missing painfulness itself, or only the capacity to care about their painfulness, or is the whole dissociation argument unsafe, given that asymbolics are reported to be indifferent to visual and verbal threats as well as to noxious stimulation, and given that the presentation may not be a single syndrome at all? Please also build a practical consequence into the question — if an asymbolic's pain is not bad for them, would inducing asymbolia be as good a treatment as inducing analgesia? — since I expect that is where students will reveal whether they have kept "feels bad" and "is bad" properly apart.

  Deliverables: the question itself, sized for one hour and worth 25 marks; a model answer of about 800 words; and a marking scheme listing five must-hit moves, the marks each is worth (total 25), and a one-line note on how students typically go wrong at each point, with a clear statement of what separates a first-class answer from a good one. Describe the competing positions substantively rather than by author. Begin with the exam question, followed by the model answer and then the marking scheme, with no preface, no commentary on the task, and no restatement of what I have asked for.
reasoning: |-
  We are creating an exam question on pain asymbolia, focusing on what it shows about the badness of pain and including a practical consequence about treatment.
   The question should avoid simple recitation of the two-component theory and push students to take a position on the nature of asymbolia and its implications.
   We need:
     - The exam question (for a one-hour essay, 25 marks)
     - A model answer (about 800 words)
     - A marking scheme with five must-hit moves (each with marks, total 25), a note on common mistakes, and a statement on what separates first-class from good answers.

   Let's design the question to cover:
     (a) What asymbolia shows about why pains are bad (is the painfulness missing, or the capacity to care? or is the dissociation argument unsafe due to broader indifference or heterogeneity?)
     (b) The practical consequence: if asymbolic pain isn't bad, would inducing asymbolia be as good as analgesia?

   Exam Question:

   "Pain asymbolia is a condition in which patients report feeling pain but do not find it unpleasant or motivating. What does this condition show about why pains are bad? In particular, does it show that the badness of pain is separable from its sensory qualities? If asymbolics' pains are not bad for them, would inducing asymbolia be as effective a treatment for pain as inducing analgesia? Justify your answers."

   Model Answer (approx. 800 words):

   Pain asymbolia presents a fascinating challenge to philosophical accounts of pain. Patients with this condition can accurately report the location and intensity of a noxious stimulus, yet they do not exhibit the typical aversive reactions: they may smile, remain relaxed, and report that the sensation does not bother them. This condition has been interpreted as evidence for the dissociation between the sensory-discriminative and affective-motivational components of pain. However, the philosophical implications for why pains are bad are far from straightforward. I shall argue that asymbolia does not show that the badness of pain is entirely separable from its sensory qualities, but rather that the badness of pain arises from the normal integration of sensory and affective processes. Moreover, inducing asymbolia would not be as effective as analgesia as a treatment for pain because it leaves intact the sensory component which is inherently tied to the badness in normal pain.

   The standard interpretation of asymbolia is that it reveals the affective-motivational component can be missing while the sensory component remains. This view suggests that the badness of pain is located solely in the affective component. Thus, if we could remove that component (as in asymbolia), the pain would cease to be bad. However, this interpretation may be too simplistic. First, it assumes that the sensory component in asymbolia is identical to that in normal pain. But some evidence suggests that asymbolics do not process the sensory input in the same way: their condition often involves a broader indifference to threats, including visual and verbal threats, which indicates a more general disruption in the evaluation of harm. This raises the possibility that the sensory component in asymbolia is not the same as in normal pain because it is detached from the network that assigns threat value. Second, asymbolia might not be a single, uniform syndrome. Variations in presentation could mean that in some cases, the affective component is absent, while in others, there is a more fundamental alteration in the sensory experience.

   If we consider what makes pain bad, we must distinguish between the feeling of pain and the evaluation of that feeling. The standard view holds that the badness of pain is intrinsic to the feeling itself. But asymbolia suggests a different picture: the sensory feeling is present, but the badness is missing. This might lead one to conclude that the badness is extrinsic, arising from our reaction to the sensory feeling. However, this conclusion is challenged by the fact that in normal pain, the sensory and affective components are integrated in such a way that the feeling is inherently unpleasant. The asymbolic case might then be understood as a disruption of this integration, resulting in a sensory experience that is not unpleasant. Therefore, the badness of pain is not located in a separable affective component but in the typical, integrated experience. This view avoids the pitfall of reducing pain's badness to a separate affective state and instead sees the badness as emergent from the whole experience.

   Turning to the practical question: if asymbolics' pains are not bad for them, would inducing asymbolia be as good a treatment as inducing analgesia? Analgesia removes the sensory component, while asymbolia would aim to remove the affective component. On the surface, both would eliminate the badness. However, there are two reasons why asymbolia would be inferior. First, the sensory component in asymbolia remains, and this might still carry information about tissue damage. Even if not unpleasant, the sensation might be distracting or interfere with normal functioning. Second, and more importantly, the broader implications of asymbolia must be considered. If asymbolia involves a general indifference to threats, then inducing it might lead to dangerous situations where the individual ignores not only pain but other signals of harm. This could result in failure to protect the body from injury. In contrast, analgesia removes the sensation altogether, thus eliminating both the badness and the potential for distraction, without inducing a global threat indifference.

   Moreover, the goal of pain treatment is not only to remove suffering but also to preserve the protective function of pain. Analgesia does this by removing the pain signal only when medically appropriate (under supervision), while the body's normal protective mechanisms remain intact for other threats. Induced asymbolia, however, would blunt the protective function across the board. Therefore, even if asymbolia were effective in eliminating the badness of pain, it would do so at the cost of a crucial survival mechanism.

   In conclusion, pain asymbolia does not prove that the badness of pain is entirely separable from its sensory qualities. Instead, it shows that the badness arises from the normal integration of sensory and affective processes. Inducing asymbolia would not be as effective a treatment as analgesia because it leaves the sensory component (which in normal pain is part of the badness) and impairs the broader protective functions of the affective system. Thus, while asymbolia offers deep insights into the nature of pain, it does not provide a safe or effective model for pain treatment.

   Marking Scheme (25 marks total):

   1. Explanation of pain asymbolia and the standard two-component interpretation (4 marks)
      - Must-hit: Clearly describe asymbolia as involving reported sensation without unpleasantness or motivation, and link it to the separation of sensory and affective components.
      - Common mistake: Simply reciting the two-component theory without applying it to asymbolia, or failing to note that asymbolics report feeling pain.
      - First-class distinction: Goes beyond the basic description to note that asymbolia may involve a broader indifference or that it might not be a single syndrome.

   2. Critical evaluation of what asymbolia shows about the badness of pain (6 marks)
      - Must-hit: Discuss at least two positions: (i) the badness is in the affective component (so asymbolia shows it is separable) and (ii) the badness is in the integrated experience (so asymbolia shows a disruption of integration). Also consider challenges (e.g., broader indifference, heterogeneity of the syndrome).
      - Common mistake: Assuming that asymbolia straightforwardly supports the separability of badness without considering alternative interpretations.
      - First-class distinction: Weaves together the empirical challenges (broader threats, syndrome heterogeneity) with the philosophical positions to argue for a nuanced view.

   3. Addressing the practical consequence: comparing asymbolia and analgesia as treatments (6 marks)
      - Must-hit: Argue whether inducing asymbolia would be as effective as analgesia, considering both the removal of badness and other factors (e.g., protective function, broader implications).
      - Common mistake: Focusing only on the removal of badness and ignoring other consequences (e.g., the protective role of pain, the risk of global threat indifference).
      - First-class distinction: Clearly articulates that the goal of treatment is not only to remove suffering but also to preserve protective functions, and that asymbolia fails at the latter.

   4. Distinguishing between 'feels bad' and 'is bad' (4 marks)
      - Must-hit: Explicitly address the difference between the phenomenology of pain (how it feels) and its evaluative status (whether it is bad for the person) and how asymbolia informs this distinction.
      - Common mistake: Conflating the feeling of unpleasantness with the badness of pain, or assuming that if a pain is not felt as bad then it is not bad.
      - First-class distinction: Uses the distinction to clarify the argument about why asymbolic pain might not be bad, while also noting that the absence of felt badness does not necessarily imply the absence of badness (if, for example, the sensory component still signals harm).

   5. Overall structure, clarity, and argumentation (5 marks)
      - Must-hit: Essay is well-organized, with a clear thesis and progression of ideas. Arguments are logically developed and supported.
      - Common mistake: Lack of clear structure, jumping between points without logical connections, or failing to provide a justified position.
      - First-class distinction: The essay presents a coherent and original argument that synthesizes the issues and addresses counterarguments.

   Total: 25 marks.

   Note: A first-class answer (typically 70% and above) will not only cover the must-hit moves but will also demonstrate independent critical thought, nuance, and synthesis. It will avoid simply repeating standard positions and will instead construct a well-supported argument that addresses the complexities of the condition and the practical implications. A good answer (60-69%) will cover the must-hit moves competently but may lack depth in critical evaluation or fail to fully integrate the practical consequence with the theoretical discussion.
answer: |-
  **Exam Question**  
  Pain asymbolia involves patients who report feeling pain but exhibit no distress or avoidance. Critically assess what this condition reveals about *why pains are bad*. Specifically:  
  (i) Does asymbolia demonstrate that the badness of pain is distinct from its sensory qualities?  
  (ii) If asymbolic pain is not bad for the patient, would therapeutically inducing asymbolia be as effective as analgesia for treating pain?  
  Support your answers with philosophical reasoning and empirical considerations.  

  ---

  **Model Answer**  
  Pain asymbolia presents a radical dissociation: patients accurately describe pain’s location and intensity yet remain indifferent to noxious stimuli (e.g., smiling when pricked by a needle). This challenges philosophical accounts of pain’s badness. I argue that asymbolia does *not* prove pain’s badness is fully separable from its sensory qualities, as indifference may stem from disrupted threat-evaluation beyond pain. Consequently, inducing asymbolia would be inferior to analgesia as a treatment, as it compromises protective functions without addressing sensory harm.  

  **(i) What asymbolia shows about pain’s badness**  
  The dominant view interprets asymbolia through a two-component model: sensory-discriminatory (e.g., pain’s location) and affective-motivational (e.g., unpleasantness). Asymbolia allegedly isolates the former, suggesting pain’s badness resides solely in the affective component. If correct, pain’s sensory qualities are value-neutral, and badness arises only when linked to aversion. However, this interpretation faces three challenges.  

  First, asymbolia may not purely subtract affect. Patients often exhibit *broad threat-indifference*, including unresponsiveness to visual or verbal dangers (e.g., a looming fist). This implies a global deficit in harm appraisal, not a pain-specific dissociation. If asymbolics cannot process *any* signals as threatening, their indifference to pain might reflect a failure to *categorize* sensations as harmful, not the absence of a discrete “pain affect.” Pain’s badness might then depend on cognitive-evaluative integration, not a dissociable affective module.  

  Second, asymbolia’s heterogeneity undermines the dissociation argument. Cases vary: some patients report sensations indistinguishable from typical pain; others describe muted or atypical qualities. If asymbolia is not a unified syndrome, it cannot reliably isolate pain components. For instance, if sensory processing is subtly altered, the affective component may be intact but disconnected from evaluation. This suggests pain’s badness requires *sensory-affective integration*—not separable parts—challenging the two-component model.  

  Third, asymbolia forces a distinction between *phenomenal badness* (pain feeling unpleasant) and *evaluative badness* (pain being harmful). Even if asymbolics lack phenomenal badness, their pains may retain evaluative badness if they signal tissue damage. Conversely, if they genuinely feel no unpleasantness, their pains might not be *bad for them*—supporting the view that badness depends on phenomenology. Yet this risks conflating two claims:  
  - *Epistemic claim*: We know pain is bad *because* it feels bad.  
  - *Metaphysical claim*: Pain is bad *only if* it feels bad.  
  Asymbolia questions the latter but not the former. Even if asymbolic pains lack felt badness, they could remain objectively harmful due to their causal role in injury (e.g., ignoring a fracture). Thus, asymbolia highlights that pain’s badness is not *essentially* phenomenal but may still be *contingently* tied to it in ordinary contexts.  

  **(ii) Therapeutic implications: Asymbolia vs. analgesia**  
  If asymbolic pains are not bad due to absent unpleasantness, inducing asymbolia therapeutically might seem equivalent to analgesia. Both would eliminate suffering. However, asymbolia would be ethically and clinically inferior.  

  Analgesia blocks nociception, preventing both sensory and affective processing. This preserves cognition and threat responsiveness: a patient on morphine still avoids falling. Asymbolia, by contrast, blunts threat evaluation broadly. Artificially inducing it might render patients indifferent to *all* dangers—not just pain—increasing risks like burns or assaults. This violates medicine’s directive to “do no harm,” as global threat apathy could be life-threatening.  

  Moreover, pain’s biological role is protective. Asymbolia dismantles this function without addressing damage. For example, an asymbolic patient with appendicitis might feel no distress but still endure tissue necrosis. Analgesia, while also risky, is typically targeted and temporary; induced asymbolia could entail chronic, systemic indifference. Thus, even if asymbolic pain lacks felt badness, it fails as treatment because it neglects pain’s *informational badness*—its link to bodily harm.  

  **Conclusion**  
  Asymbolia does not cleanly isolate pain’s badness in an affective component. Instead, it reveals that badness arises from integrated threat evaluation, disrupted globally in asymbolia. While asymbolics may not experience pain as *phenomenally bad*, this does not entail their pains are wholly *unbad*; they remain signals of harm. Inducing asymbolia would thus be a poor treatment, sacrificing self-protection without mitigating damage. Pain’s badness is neither fully separable from sensation nor safely eliminable via indifference.  

  ---

  **Marking Scheme**  
  *(Total: 25 marks)*  

  1. **Accurate description of asymbolia and the two-component challenge** (4 marks)  
     - *Must-hit move:* Explain asymbolia as "reported pain without distress" and its use to dissociate sensory/affective components.  
     - *Common mistake:* Merily reciting the two-component model without linking it to asymbolia’s challenge to pain’s badness.  
     - *First-class separator:* Notes that asymbolia may involve *atypical* sensory processing or broader indifference.  

  2. **Critical assessment of what asymbolia shows about badness** (7 marks)  
     - *Must-hit move:* Evaluate at least two positions: (i) badness is in the affective component (separable), (ii) badness requires integrated evaluation (inseparable), using empirical issues (e.g., threat generality, syndrome heterogeneity).  
     - *Common mistake:* Assuming asymbolia *proves* badness is affective without addressing broader indifference.  
     - *First-class separator:* Distinguishes phenomenal vs. evaluative badness and argues asymbolia challenges metaphysical (not epistemic) links between feeling and badness.  

  3. **Analysis of therapeutic consequence** (6 marks)  
     - *Must-hit move:* Argue whether asymbolia induction would be as effective as analgesia, considering protective function and global threat indifference.  
     - *Common mistake:* Claiming "no suffering = good treatment" while ignoring functional trade-offs (e.g., injury risk).  
     - *First-class separator:* Demonstrates that asymbolia fails because it severs pain from its informational role in harm avoidance.  

  4. **Clarity on "feels bad" vs. "is bad" distinction** (4 marks)  
     - *Must-hit move:* Explicitly separate phenomenology (unpleasantness) from normative badness (harm), showing how asymbolia tests their relationship.  
     - *Common mistake:* Conflating "pain isn’t felt as bad" with "pain isn’t bad," or neglecting objective harm (e.g., tissue damage).  
     - *First-class separator:* Uses the distinction to defend why asymbolic pain might still be bad *for* the patient despite lacking unpleasantness.  

  5. **Structure, coherence, and originality** (4 marks)  
     - *Must-hit move:* Logically organized essay with a clear thesis, signposting, and minimal redundancy.  
     - *Common mistake:* Unfocused narrative, unresolved tensions between positions, or over-reliance on bullet-point reasoning.  
     - *First-class separator:* Synthesizes empirical and philosophical issues into a novel position (e.g., "badness as integrated threat-evaluation").  

  **First-class answer benchmark**: Integrates all five moves into a nuanced argument, avoids dichotomies (e.g., "sensory vs. affective"), and uses asymbolia to refine—not just reject—theories of pain. Distinguishes phenomenal/evaluative badness rigorously and highlights practical consequences beyond symptom relief. A *good* (mid-2:1) answer covers moves 1–4 competently but may lack synthesis or critical depth on syndrome heterogeneity.
