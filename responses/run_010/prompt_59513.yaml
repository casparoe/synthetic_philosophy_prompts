answer: |-
  ### Joint Statement on Vagueness: Epistemicism and Supervaluationism  
  **Authored by [Epistemicist Signatory] and [Supervaluationist Signatory]**  

  ---

  #### 1. Agreed Claims  
  1.1 **The Sorites Paradox**: The paradox consists of a valid argument with three components:  
      - *Premise 1*: A clear case (e.g., Patch 1 is red).  
      - *Premise 2*: A tolerance principle (e.g., If Patch *n* is red, then Patch *n*+1 is red).  
      - *Conclusion*: A clear non-case (e.g., Patch 1000 is red).  
      The conclusion is false, yet rejecting Premise 2 appears counterintuitive.  

  1.2 **What Any Theory Owes**:  
      - **Tolerance**: Must explain why tolerance *seems* compelling despite not holding universally.  
      - **Penumbral Connections**: Must preserve intuitive links between predicates (e.g., nothing can be both red and orange).  

  1.3 **Logical Principles**:  
      - Both preserve classical *excluded middle* (P ∨ ¬P is always true).  
      - Epistemicism preserves classical *bivalence* (every proposition is true or false).  
      - Supervaluationism rejects bivalence for borderline cases but retains excluded middle.  

  1.4 **Competence & Assertion**:  
      - A competent speaker cannot know or assert the location of a cut-off.  
      - First-order usage is identical: both prohibit asserting "Patch *n* is red" for borderline *n*.  

  ---

  #### 2. Disagreements Table  
  | Issue | Epistemicist Formulation | Supervaluationist Formulation | Dispute Type | What Would Move Each Party |  
  |-------|--------------------------|-------------------------------|-------------|---------------------------|  
  | **Nature of Borderline Cases** | Borderline cases reflect ignorance of a precise cut-off fixed by usage. | Borderline cases reflect genuine indeterminacy: no fact of the matter under all admissible precisifications. | Substantive | Epistemicist: Proof that usage underdetermines exact extension. Supervaluationist: Proof that all precisifications share a cut-off. |  
  | **Truth Conditions** | "Patch *n* is red" is true iff *n* < *c* (sharp *c*). Truth tracks mind-independent facts. | "Patch *n* is red" is supertrue iff true on *all* admissible precisifications. Truth is precisification-relative. | Substantive/Verbal (partly) | Shared diagnostics (e.g., "rish" case). |  
  | **Metasemantics** | Usage fixes a sharp extension via causal-historical facts, even if unknowable. | Usage fixes constraints on admissible precisifications; extensions are sets of precisifications. | Substantive | Evidence that meaning supervenes on accessible features alone. |  

  ---

  #### 3. Cruxes with Pre-Registered Predictions  
  *For each crux, both parties agree the "rish" case is decisive. Predictions are sealed prior to analysis.*  

  - **Crux 1: Does destroyed coin-flip outcome fix "rish" extension?**  
    - *Epistemicist Prediction*: Yes. Extension is 1–612 (heads) or 1–611 (tails). Patch 612 is borderline iff outcome was tails.  
    - *Supervaluationist Prediction*: No. All precisifications admitting the rule are admissible → Patch 612 is borderline.  
    - *Shared Argument*: Rule publicly links extension to coin flip; destruction makes outcome inaccessible.  

  - **Crux 2: Does vault-sealed (openable later) outcome fix extension?**  
    - *Epistemicist*: Yes. Extension is sharp; Patch 612 borderline iff tails.  
    - *Supervaluationist*: Outcome is temporally inaccessible → borderline for *now*.  

  - **Crux 3: Does privately known (now lost) outcome fix extension?**  
    - *Epistemicist*: Yes. Extension is sharp; ignorance irrelevant.  
    - *Supervaluationist*: No. Admissibility depends on public meaning-fixing facts → borderline.  

  ---

  #### 4. Verbal Dispute Verdict & Practical Equivalence  
  - **First-Order Operational Equivalence**:  
    Both agree that in practice:  
    - No one can *know* cut-offs.  
    - Tolerance premises are *unassertable*.  
    - Regulators (e.g., defining "obese") should set pragmatic thresholds, not seek "true" boundaries.  
    → **No practical divergence in real decisions**.  

  - **Non-Verbal Core**:  
    The dispute is substantive at two levels:  
    1. **Higher-Order Vagueness**:  
       - Epistemicist: "Definitely red" has a sharp boundary (unknowable).  
       - Supervaluationist: "Definitely" is itself vague → no sharp boundaries at any order.  
    2. **Metasemantics**:  
       - Epistemicist: Meaning fixes extensions *directly* (inaccessible facts matter).  
       - Supervaluationist: Meaning fixes *constraints* (only accessible facts matter).  

  - **"Rish" Diagnostics**:  
    - Epistemicist: "Rish" differs from ordinary vagueness only in how the cut-off was fixed (explicit rule vs. usage).  
    - Supervaluationist: "Rish" has no penumbra if outcome is accessible; ordinary vagueness has inherent indeterminacy.  

  ---

  #### 5. Why This Disagreement Matters  
  The dispute is not verbal: it concerns whether reality admits of sharp boundaries unknowable to humans (epistemicism) or whether vagueness is ontological (supervaluationism). This shapes metaphysics, not practice.  

  ---

  ### Confidence Assessment  
  **Overall Confidence: 85%** (Calibrated per section)  

  1. **Agreed Claims (95%)**: Uncontroversial synthesis of shared ground.  
  2. **Disagreements Table (80%)**: Formulations capture core positions; "substantive/verbal" mix may need nuance.  
  3. **Cruxes (90%)**: "Rish" diagnostics force key commitments; predictions align with literature.  
  4. **Verbal Verdict (75%)**: Practical equivalence is defensible, but epistemicists may reject "no divergence" phrasing.  

  **Least Confident Claim**:  
  - *Epistemicist may object* to "Tolerance principles are strictly false" (Agreed Claims 1.2).  
    - **Objection**: They hold tolerance *fails* at a sharp boundary but deny this makes it "false" simpliciter; it is *not assertable* by competent speakers.  
    - **Revision**: "Tolerance principles cannot be unrestrictedly asserted."  

  **Most Solid**: "Rish" responses (100%): Directly derived from each theory’s axioms.  

  **Recommendation**: Test "borderline" judgments in the vault variant: Supervaluationists should predict retraction of "borderline" upon vault opening; epistemicists deny this changes past truth.
