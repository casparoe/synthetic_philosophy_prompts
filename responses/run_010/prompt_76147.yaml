prompt: |-
  I'm in a jurisprudence reading group at uni and one of the law students has a phrase he reaches for whenever the conversation goes anywhere awkward: 'you can't cause anything by doing nothing'. Latest outing was the no-duty-to-rescue rule. His argument was roughly that the stranger who walks past the drowning child hasn't caused anything to happen, so there's no causal hook for a duty to attach to, and any liability would have to be conjured up out of thin air rather than found in the facts. I'm fairly sure there's more than one claim tangled up in that one sentence but I couldnt get them apart at the time and he'd already moved on.

  So: unpack it. Give me the menu of distinct precise claims the line could be standing for — metaphysical ones about whether absences are the sort of thing that can be a cause, semantic ones about what omission sentences really say, normative ones about who owes what to whom wearing a causal disguise — and for each say whether it's true, whether it's interesting even if it is true, and crucially whether it would actually get him his conclusion about the duty to rescue. My hunch is that one reading is unobjectionable but does him no good whatsoever and another is exactly what he needs but doesn't hold up; point at both. And tell me whether he needs the causal claim at all, or whether the same conclusion about no general duty could be reached on entirely different grounds with the slogan doing no work.

  Two bits I especially want sorted, because that's where he'd dig in. First, the case where the omission looks unproblematically causal: I promised to water your plants while you were away, I don't, and they die. If absences can cause things then my not watering them caused it, and the King's not watering them caused it, and so did everyone else's who wasn't in your flat that week — which makes causation ludicrously promiscuous. Say which readings of the slogan are really just attempts to block that, and which ones survive it. Second, the difference between saying my omission caused the plants to die and saying the absence of water caused it — do those come apart, and does it matter which one he means? Relatedly, where does double prevention fit in: cases where my not doing something is really my not stopping something that was already underway. Does the slogan cover those, and should it?

  No refs or reading list, please — I can't chase those down anyway and its not what I'm after. I just want the distinctions and the verdicts laid out cleanly enough that I can take them back to him next week.
reasoning: |-
  Okay, let me try to unpack this user's query. They’re in a jurisprudence reading group, and a law student keeps using the phrase "you can't cause anything by doing nothing" to argue against a duty to rescue, like in the drowning child scenario. The user wants to dissect this slogan into distinct claims—metaphysical, semantic, normative—and evaluate each for truth, relevance, and whether it supports the no-duty conclusion. 

  First, I need to identify the core claims hidden in that slogan. The user mentioned three types: metaphysical (can absences be causes?), semantic (what do omission statements really mean?), and normative (is causation necessary for duty?). Each needs separate analysis. 

  For the metaphysical claim, there's a debate about whether absences can cause events. Some philosophers say no—causes must be positive events. But that seems shaky. If I promise to water plants and don’t, my inaction directly leads to their death. Denying this risks making causation arbitrary. The promiscuity problem (e.g., the King also "causing" the plants' death by not watering them) is a real issue, but context usually restricts relevant causes. So while absences *can* be causes, we intuitively focus on salient ones like the promise-breaker, not random strangers. 

  Semantically, the slogan might mean that "A omitted X" doesn’t assert a causal relation. That’s plausible—saying "I didn’t water the plants" describes inaction, not causation. But this doesn’t help the law student’s case. Even if the statement isn’t explicitly causal, we can still infer causation from context (e.g., the plants died *because* I broke my promise). So this claim is true but irrelevant to denying liability. 

  Normatively, the key move is linking causation to duty. The student argues no causation → no duty. But duties often arise without causal involvement, like contractual obligations. In rescue cases, the duty might stem from vulnerability or societal norms, not causation. So even if absences aren’t causal (which is dubious), it wouldn’t block a duty to rescue. 

  The user’s hunches seem spot-on. One reading (semantic) is harmless but useless; another (metaphysical) is needed for the argument but collapses under scrutiny. And causation isn’t essential—duties can exist on other grounds, like relationship roles (e.g., parent-child) or voluntary commitments. 

  On the specific bits: The plant example shows that absences *can* cause harm, but context solves promiscuity. Double prevention (like not stopping a rolling boulder) is trickier—it feels more causal because you’re withholding intervention. But the slogan fails here too; not acting can still be causal. 

  Ultimately, the student’s slogan distracts. The real debate is normative: when do we impose duties to aid others? Jurisdictions that enforce rescue duties (e.g., Vermont) prove causation isn’t the linchpin. The user can corner him by asking why causation should dictate duty in the first place.
answer: |-
  Here's the dissection of "you can't cause anything by doing nothing" – unpacked into distinct claims, evaluated for truth, relevance, and whether they support the no-duty-to-rescue conclusion:

  ### The Menu of Claims

  1.  **Metaphysical Claim: Absences are not causes (Omissions are metaphysically inert).**
      *   **What it means:** Causation requires a positive act or event. An absence (like not watering plants, not rescuing) is literally nothing – it lacks the "oomph" to be a causal force. Only the *presence* of something (drowning water, lack of water) causes outcomes.
      *   **True?** Highly contentious/debatable. Many philosophers argue absences *can* be genuine causes (especially in contexts like promises or duties). Denying it feels counterintuitive in specific cases ("My *not watering* caused the plants to die"). **Verdict: Probably False, or at least highly problematic.**
      *   **Interesting?** Yes, core debate in philosophy of causation.
      *   **Gets him the conclusion?** **Only if true AND causation is essential for duty.** If true, the non-rescuer didn't *cause* the drowning, removing the "causal hook." But see Claim 3.
      *   **Plant Problem:** This claim *is* primarily motivated by avoiding promiscuity (King causing death). Its proponents bite the bullet: neither you nor the King metaphysically caused it; the *absence of water* did. They see this as less absurd than counting every non-actor as a cause.

  2.  **Semantic Claim: "Omission" sentences don't *assert* causation; they describe a state.**
      *   **What it means:** Saying "His not rescuing caused the death" isn't literally stating he exerted causal force. It's shorthand for "The death occurred, he didn't rescue, and his rescue was expected/required to prevent it." The causal work is done by the background conditions (drowning process).
      *   **True?** Plausible. "He didn't rescue" describes his inaction; the causal link is inferred contextually or normatively.
      *   **Interesting?** Moderately (philosophy of language).
      **Gets him the conclusion?** **No.** Even if semantically true, it doesn't mean there's *no link* justifying liability. It just says the sentence structure hides the normative basis. Liability could still be based on the *failure to fulfill an expected/required intervention*, regardless of literal causation. The "causal hook" requirement is a separate, normative claim (see Claim 3).

  3.  **Normative Claim: Liability/duty requires *causing harm* (The "causal hook" requirement).**
      *   **What it means:** The law (or morality) only imposes liability for outcomes you *brought about* through positive action. Merely failing to prevent harm you didn't create doesn't count as "causing" it in the relevant sense for liability.
      *   **True?** **This is the core legal fiction/assumption driving the slogan in this context.** It's a *normative choice* embedded in common law tradition (emphasizing negative liberty/"no harm"), not a metaphysical truth. Many argue it's unjustifiable.
      *   **Interesting?** Crucial! This is the *real* battleground for the duty-to-rescue debate.
      **Gets him the conclusion?** **Directly, but circularly.** If you *define* the requirement for liability/duty as *causing the harm*, then by definition, omissions (which allegedly don't cause) can't ground liability. But this begs the question: *Why* should liability *require* causation? This claim **is exactly what he needs but doesn't hold up** on its own; it needs justification beyond the slogan. Other grounds (below) can reach the same conclusion *without* needing causation.

  4.  **Normative Claim: General positive duties are impermissible/burdensome.**
      *   **What it means:** Imposing a general duty to rescue would infringe too much on individual liberty, impose excessive burdens, and be impractical to enforce fairly. The slogan is just a causal-sounding way to express this deeper normative aversion.
      *   **True?** Debatable (many jurisdictions *do* have limited duties to rescue). Reflects a specific liberal political philosophy.
      *   **Interesting?** Very – the heart of the policy debate.
      **Gets him the conclusion?** **Yes, and without needing causation.** This is the *real* reason behind the no-duty rule for strangers. The slogan's causal talk is a **disguise** for this normative stance. The conclusion (no general duty) stands on liberty/utility grounds alone.

  ### Addressing Your Specific Bits

  1.  **The Plant Problem & Promiscuity:**
      *   **Which readings block it?** Primarily the **Metaphysical Claim (1)**. If absences aren't causes, then *nobody's* omission caused the death – only the absence of water did. This avoids promiscuity but seems deeply unsatisfying for the promise case.
      *   **Which readings survive it?** **Normative Claim (3)** survives: Even if *metaphysically* everyone's omission "caused" it, the law only cares about *legally relevant* causes – the person who had a *duty* (via promise) to act. **Normative Claim (4)** also survives: The promiscuity *is* absurd, showing why we only impose duties based on special relationships/undertakings, not universally.

  2.  **Omission vs. Absence & Double Prevention:**
      *   **Do they come apart?** Yes, and it matters.
          *   "His not watering caused death" focuses on *his failure* (agent-centered).
          *   "The absence of water caused death" focuses on the *state of the world* (event-centered).
      *   **Why it matters:** Normative liability hinges on the *agent-centered omission* – his *failure* relative to a duty/expectation. The absence is the physical mechanism. The slogan often conflates them. **He likely means the agent-centered omission cannot be a cause.**
      *   **Double Prevention (e.g., not removing a log stopping a rolling boulder):**
          *   **Does the slogan cover it?** Ambiguous. It's an omission (*not* removing the log) but feels more causally direct than pure non-rescue. It involves *withholding an intervention* against an *existing threat*.
          *   **Should it?** If the slogan denies causation here, it's even less plausible. Double prevention omissions often *are* treated as causes legally (e.g., failing to maintain a safety device). This weakens the slogan's generality. **It struggles with double prevention, suggesting the core issue isn't metaphysics but normative relevance.**

  ### Verdicts & Your Hunch

  *   **Unobjectionable but Useless:** The **Semantic Claim (2)** is plausible but irrelevant. It explains language, not liability. It doesn't block a duty.
  *   **Needed but Doesn't Hold Up:** The **Normative Claim requiring causation for duty (3)**. This is what he *needs* to link the slogan to no-liability. But it's a circular, unjustified normative assumption masquerading as metaphysics or logic. **This is the weak spot.**
  *   **The Core Issue:** The **Normative Claim against general duties (4)**. This is the *actual* reason for the no-duty rule. The causation slogan is **unnecessary** to reach the conclusion. The same conclusion ("no general duty to rescue strangers") is reached directly on grounds of liberty, impracticality, and lack of special relationship – **the slogan does no real work here**.
  *   **Does he need the causal claim at all?** **No.** Jurisdictions that *do* impose a duty to rescue (e.g., Vermont, France) don't suddenly believe omissions cause things metaphysically. They made a different *normative* choice about when positive duties arise (e.g., easy rescue without danger). The causation argument is a red herring.

  ### How to Corner Him Next Week

  1.  **Focus on Normative Claim 3:** "You say liability requires causing the harm via positive action. *Why* must that be the rule? Is it written in the stars, or is it a legal policy choice? If it's a policy choice, is 'avoiding promiscuity' the *real* reason, or is it about liberty? Couldn't we have a policy imposing liability for *failing an easy rescue* even if it's not 'causing' in your strict sense?"
  2.  **Highlight the Distraction:** "The slogan 'can't cause by doing nothing' seems to be doing two things: a) hiding the real policy choice against positive duties, and b) trying to solve the promiscuity problem by denying all omission causation. But we solve promiscuity by context and duty anyway – the King isn't liable because he had no duty, not because he didn't 'cause' it. Does the slogan actually *add* anything beyond stating the existing rule?"
  3.  **Use Double Prevention:** "If I see a log holding back a boulder heading towards a child, and I deliberately *don't* remove a pin that would release the log (knowing it would stop the boulder), did my *inaction* cause the harm? If so, how is rescuing the drowning child fundamentally different? Both involve withholding an intervention against an existing threat."

  The power move is to grant the causation point *arguendo* and then show it's irrelevant: "Okay, *maybe* omissions aren't metaphysically causal. So what? Liability isn't magic – it's a normative judgment. We impose liability for breaching contracts (promises) via omission all the time. Why *shouldn't* we impose it for breaching a hypothetical duty of easy rescue? The 'causal hook' looks like an excuse, not a reason."
