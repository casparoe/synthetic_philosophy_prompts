answer: |-
  ### Bottom Line
  *Middlemarch* operates primarily on a **syncritic model**, extending Plutarch’s method to ordinary lives while dismantling the exemplar model’s reliance on admiration. Eliot doesn’t abolish Plutarch’s project but radically democratizes it, arguing that moral instruction emerges from comparing flawed, unheroic lives. The narrator’s judgments deepen this syncritic process rather than reverting to exemplarism.

  ---

  ### Syncritic Pairings as Moral Engines
  **1. Dorothea vs. Mary Garth: Integrity in Different Registers**  
  Both women embody moral rigor but express it inversely. Dorothea seeks grand ideals (helping Casaubon’s scholarship, funding Lydgate’s hospital) yet stumbles through naivete. Mary rejects idealism (refusing Featherstone’s bribe, valuing practical loyalty) but achieves quiet, sustainable good. The pairing trains us to see how virtue manifests contextually: Dorothea’s "epic" aspirations often misfire, while Mary’s "unhistoric" steadfastness reliably nurtures those around her. Neither is idealized; their juxtaposition critiques the exemplar model by showing admiration alone cannot capture virtue’s forms.

  **2. Lydgate vs. Casaubon: The Corruption of Ambition**  
  Both doctors of sorts (medical/science, theological/philology) are consumed by intellectual pride. Casaubon’s *Key to All Mythologies* is paralyzed by his fear of exposure; Lydgate’s research is sabotaged by his desire for status (epitomized by marrying Rosamond). The syncritic work lies in how their failures illuminate each other: Casaubon’s isolation breeds despair, Lydgate’s sociability leads to compromise. The narrator *guides* but doesn’t absolve—Casaubon’s pitiable self-pity is framed as a human flaw, not an exoneration. We judge them relationally: Casaubon’s tragedy is his refusal to connect; Lydgate’s is his surrender to connection’s wrong kind.

  **3. Bulstrode vs. Farebrother: Hypocrisy and Flawed Grace**  
  Bulstrode’s evangelical piety masks past crimes; Farebrother, a lax clergyman who gambles, displays unpretentious kindness. When Bulstrode’s corruption is exposed, Farebrother refuses to condemn him, recognizing their shared human frailty. The scandal’s "unsettled verdict" is deliberate: Bulstrode suffers socially, but his internal torment (and hesitant steps toward atonement) resists easy moralizing. Farebrother’s compassion here isn’t exemplary—it’s a syncritic counterpoint showing that rigid judgment (like Bulstrode’s own) perpetuates harm. Virtue emerges in the gap between their responses to failure.

  ---

  ### Subverting Admiration: The End of Exemplarism  
  **Casaubon as Anti-Exemplar**  
  The narrator doesn’t ask us to admire Casaubon but to confront the *humanity* beneath his despicable actions. His terror of intellectual inadequacy makes him petty, but also tragically recognizable. This *blocks* admiration—we cannot "imitate" him—yet he instructs morally by revealing how vanity and fear corrupt potential. Plutarch might polish such flaws; Eliot amplifies them to argue that virtue is learned through diagnosing failure, not emulating perfection.

  **Dorothea’s "Hidden Life" Paradox**  
  Yes, the novel memorializes Dorothea, but its insistence that her true impact is "hidden" is key. Her grand acts (wedding Casaubon, championing Lydgate) achieve little; her quiet influence (reconciling Rosamond and Lydgate, supporting Will) creates ripple effects. The 800 pages *document* how true moral weight resides in unseen choices, not public glory. The Finale disclaims monumental *heroism*, not significance—extending Plutarch by insisting ordinary lives warrant syncritic attention.

  **Lydgate’s Unadmirable End**  
  His failure is total: abandoned research, capitulation to society’s expectations, a hollow marriage. Yet his life is profoundly instructive. Compared to Casaubon, he shows how charm and talent crumble without moral resilience; compared to Farebrother, he reveals how pride blinds one to genuine connection. We learn not by wanting to *be* Lydgate but by dissecting why his potential dissolved—a syncritic lesson in the cost of compromised integrity.

  ---

  ### Does Eliot Extend or Destroy Plutarch?  
  She **extends it dialectically**. Plutarch’s syncritic method is retained (comparative moral analysis), but its subjects are transformed. Greatness is replaced by granular, unheroic struggle. The narrator’s guidance isn’t exemplarist imposition; it’s a tool to sharpen the reader’s comparative faculties where lives are too subtle for self-evident lessons. Admiration is sidelined because Eliot argues it *distorts*: we learn virtue by analyzing the muddled middle, not the polished peak. The cost of idealization Plutarch risks—making virtue seem unattainable—is solved by grounding moral psychology in the everyday. The paired lives aren’t just realist texture; they are structured to force Plutarchan *comparison* onto the "unvisited tombs," proving their lives *are* Lives worth reading.
