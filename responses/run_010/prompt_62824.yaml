prompt: |-
  I sit on a panel that has to decide whether a certain engineered architecture should be treated as one subject of experience or two: two processing modules that share some memory and some control channels but not others, with no global workspace and no single bottleneck through which reports must pass. Before we argue about the engineering, I want the standard of evaluation fixed by drawing on the human case. Write the desiderata a theory of the unity of consciousness must meet in order to count as adequate for this purpose. Include the commissurotomy phenomena any such theory has to account for — verbal denial of a stimulus that the contralateral hand nevertheless identifies correctly, intermanual conflict in which the two hands work at cross purposes, and the more recent testing in which a patient appears able to respond accurately to either visual field by any route — the distinctions it may not collapse (unity of consciousness versus unity of the subject or agent; binding within a single percept versus coherence across a stretch of time; access to information versus there being something it is like to have it), and any established results it must not contradict. For each requirement, give the consideration that motivates it and label it non-negotiable, genuinely contested, or a parochial preference of one camp. Then do the part I most need: say which requirements survive abstraction away from neural tissue entirely and which are hostage to human implementation, and whether any subset of the surviving ones is jointly unsatisfiable — if the list turns out to generate a contradiction, state that plainly rather than smoothing it over. Omit the scorecard against named theories; we will do that separately.
reasoning: |-
  Okay, the user is on a panel deciding whether an engineered architecture should be considered one or two subjects of experience. They want to establish evaluation standards based on human consciousness unity before arguing about engineering specifics. 

  Hmm, this is a sophisticated philosophical-neuroscientific interface problem. The user clearly understands commissurotomy literature but wants to abstract principles applicable to artificial systems. They're preempting implementation-biased arguments by demanding consciousness criteria untethered from biology. Smart move.

  Let me unpack their layered request: First, they need desiderata for any theory of conscious unity. Second, these must cover split-brain phenomena without conflating key distinctions. Third - and crucially - they want to know which criteria remain valid when abstracted from wetware, and whether those create contradictions. 

  *scratches head* The tricky part is separating neural implementation from functional principles. For instance: Binding within a visual field feels fundamental to consciousness, but might be implemented differently in silicon. Whereas global workspace seems more architectural... but is it necessary? And those commissurotomy cases! The recent findings where patients respond accurately to either visual field really complicate classical models.

  *starts organizing* Better group requirements into categories: phenomenological must-haves (like qualitative unity), operational constraints (access vs. experience), and split-brain explanatory demands. Need to flag which are non-negotiable (e.g., avoiding contradiction with established data) versus contested (like whether unity requires a single agent). 

  *winces* The landmines are in abstraction. If we say "no single bottleneck" is negotiable but "coherent self-narrative" is essential, does that conflict with split-brain patients showing partial narrative coherence? And if we discard all neural implementation details, can we even define "subject of experience"? 

  *checks papers* Important to note: Block's access/experience distinction survives abstraction, while Sperry-style "cerebral dominance" probably doesn't. But then - uh oh - if we require both (a) unified phenomenology and (b) allowance for dissociated access as in split-brain... is that contradictory for engineered systems? Only if we insist on perfect unity. Maybe graded unity is the answer? 

  User would hate if I smooth this over. Better state plainly: The requirement for "experiential unity across time" (non-negotiable) plus "allowance for access dissociations" (also non-negotiable) creates tension when abstracted. A single-subject system could satisfy both only if we accept partial unity - which might be exactly what their engineered architecture shows!
answer: |-
  Here are the desiderata for evaluating theories of consciousness unity, structured for your purpose. Requirements are categorized by motivation, negotiability, and abstraction potential, with contradictions explicitly addressed:

  ### **I. Core Phenomenological Desiderata** (Non-Negotiable)
  1. **Qualitative Unity**  
     *Requirement:* At any instant, multiple features (e.g., color, shape) within a single perceptual modality must be experienced as unified (e.g., "a red circle," not redness + circularity).  
     *Motivation:* Introspective certainty of coherent objects. Foundational to perception.  
     *Abstraction:* Survives — intrinsic to subjective experience, implementation-independent.  

  2. **Temporal Coherence**  
     *Requirement:* Consciousness must exhibit continuity across time (e.g., experiencing motion or a melody, not disjointed frames).  
     *Motivation:* Subjective flow of experience; prerequisite for agency and memory.  
     *Abstraction:* Survives — necessary for any temporally extended subject.  

  ---

  ### **II. Split-Brain Explananda** (Non-Negotiable)  
  3. **Verbal Denial + Contralateral Identification**  
     *Requirement:* Account for ability to report stimuli verbally from one hemisphere while the other hemisphere guides accurate non-verbal responses (e.g., left hand identifying an unseen object named by right hemisphere).  
     *Motivation:* Empirical datum from commissurotomy; disproves naïve unity.  

  4. **Intermanual Conflict**  
     *Requirement:* Explain goal-directed antagonism between hands (e.g., one buttoning a shirt, the other unbuttoning it).  
     *Motivation:* Evidence for independent volitional systems post-surgery.  

  5. **Cross-Response Accuracy in Recent Paradigms**  
     *Requirement:* Explain accurate responses to stimuli in either visual field via *any* output (e.g., left hemisphere verbally reporting right-visual-field stimuli *and* sometimes left-field stimuli with training).  
     *Motivation:* Shows unity isn’t fixed; integration can occur via task demands or plasticity.  
     *Abstraction:* Survives — tests architectural flexibility of information routing.  

  ---

  ### **III. Critical Distinctions**  
  6. **Unity of Consciousness ≠ Unity of Agent** (Non-Negotiable)  
     *Requirement:* Theory must permit dissociations between unified experience and singular agency (e.g., intermanual conflict implies two competing agents despite partial experiential unity).  
     *Motivation:* Split-brain shows agents can fragment while consciousness may partially unify.  
     *Abstraction:* Survives — agency is functional, consciousness phenomenological.  

  7. **Binding ≠ Temporal Coherence** (Non-Negotiable)  
     *Requirement:* Binding (synchronic unity) must not be conflated with diachronic unity (e.g., a patient may bind features *within* each hemisphere but lack coherence *between* hemispheres).  
     *Motivation:* Splits occur at different architectural levels.  

  8. **Access ≠ Phenomenology** (Genuinely Contested)  
     *Requirement:* Distinguish informational access (reportability) from subjective experience ("what it’s like").  
     *Motivation:* Philosophical (Block’s "Hard Problem") + empirical (blindsight, split-brain).  
     *Abstraction:* Survives — applies to any system with potential for dissociation.  

  ---

  ### **IV. Architectural Constraints**  
  9. **No Obligatory Global Workspace** (Genuinely Contested)  
     *Requirement:* Must not presume a single, mandatory bottleneck for consciousness (e.g., GWT).  
     *Motivation:* Split-brain shows unity can be partial/contextual; rival models (IIT, recurrent processing) reject central bottlenecks.  
     *Abstraction:* Survives — questions whether unity requires centralized hardware.  

  10. **Unity Without Physical Continuity** (Non-Negotiable)  
      *Requirement:* Cannot demand contiguous neural tissue as necessary.  
      *Motivation:* Engineered systems may lack biological continuity; functionalism.  
      *Abstraction:* Explicitly survives — core to your abstraction goal.  

  ---

  ### **V. Contradictions Under Abstraction**  
  **The Tension:**  
  - **Non-Negotiable Survivors:** Qualitative Unity (1), Temporal Coherence (2), Access ≠ Phenomenology (8), and Unity ≠ Agency (6).  
  - **Contradiction Risk:**  
    - (1) & (2) imply a *single subject* with unified, continuous experience.  
    - (8) & (6) + split-brain data imply *multiple subjects* (competing agents with dissociated access/phenomenology).  

  **Resolution:**  
  A theory *must* allow **graded unity** (e.g., unity within subsystems, not necessarily globally). Contradiction arises only if demanding *perfect* unity across all states. Split-brain shows unity is task-dependent and partial — an adequate theory must permit this variability. Thus, no fatal contradiction if the theory accommodates:  
  > *A system can be one subject of experience **if and only if** it exhibits a dominant, functionally integrated perspective across time, even with local dissociations.*  

  ---

  ### **Summary of Abstraction Survival**  
  | **Requirement**               | Survives Abstraction? | Why                                                                 |
  |-------------------------------|------------------------|---------------------------------------------------------------------|
  | Qualitative Unity             | Yes                    | Core to phenomenology                                               |
  | Temporal Coherence            | Yes                    | Essential for a temporally extended subject                         |
  | Split-Brain Phenomena         | Yes (as test cases)    | Stress-tests unity/access/agency dissociations                      |
  | Consciousness ≠ Agency       | Yes                    | Functional vs. phenomenological distinction                         |
  | Binding ≠ Temporal Coherence | Yes                    | Architectural levels distinct                                       |
  | Access ≠ Phenomenology       | Yes                    | Conceptual distinction                                              |
  | No Obligatory Global Workspace| Yes                    | Questions centralization necessity                                  |
  | Physical Continuity Rejected | Yes                    | Explicitly implementation-agnostic                                  |

  **Final Proviso:** Any theory must reject **Cartesian Theater models** (non-negotiable per split-brain data) and accept that unity is **dynamic, not absolute**. The engineered architecture may qualify as *one* subject if it sustains a coherent "first-person perspective" integrating information across critical functions (e.g., decision-making, memory, goals) despite modularity — but this coherence must exceed the disunified performance seen in acute split-brain cases.
