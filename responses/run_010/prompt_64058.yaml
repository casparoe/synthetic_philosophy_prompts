     - **Assumption dropped**: None (avoids hidden variables λ entirely, denying realism).  
     - **Gives up Bell's conclusion**: 8/10 (rejects realism and any causal explanation for correlations).  
     - **New weirdness bought**: 3/10 (minimal ontology, but leaves quantum correlations as unexplained brute facts).  
     - **Net cost**: 11  

  ### Ranking by Net Cost (Cheapest First)
  1. **Instrumentalist move (net cost: 11)**: Cheapest because it denies realism without adding complex machinery, though it leaves correlations unexplained.  
  2. **Everett (net cost: 14)**: Next cheapest due to preserving locality and wave-function realism, but buys high weirdness with many worlds.  
  3. **Retrocausality (net cost: 15)**: Moderately costly by sacrificing statistical independence, avoiding non-locality but introducing time-symmetry paradoxes.  
  4. **Bohmian mechanics (net cost: 15)**: More expensive due to non-locality and particle trajectories, which add significant ontological baggage.  
  5. **GRW-style collapse (net cost: 15)**: Similarly costly with non-local collapses and ad hoc dynamics, though less weird than superdeterminism.  
  6. **Superdeterminism (net cost: 17)**: Most expensive as it denies free will and implies a predetermined universe, making science itself suspect.  

  ### Settling the Everett Argument
  Your friend claims Everett "drops nothing and pays nothing," but this is incorrect: Everett explicitly **drops outcome independence** (as entanglement requires non-independent outcomes given λ) and **buys substantial weirdness (9/10)** with its infinite branching multiverse and unresolved probability issues, landing it at a net cost of 14—not free.
