prompt: |-
  so I'm six months into a novel and its turned out that the whole book is about people who never say anything false. Set roughly now, mid-sized city, most of the plot runs through a marriage and a workplace investigation, and my beta reader keeps writing "he's lying" in the margins of scenes where I have been extremely careful that every sentence out of the character's mouth is literally true. Which is the point of the scene! But it's got me worried I don't have a handle on the distinction I'm building the book on, so I typed out the cases I've actually been going by and I want to know what principle, if any, they add up to.

  All from the drafts:

  1. Asked what he thought of his mother-in-law's cooking, a character says "the wine was excellent." Not a lie, and not a sin either. Nobody should be offended on his behalf.

  2. Asked whether he was at the hotel Tuesday night, a character says "I was at the office until nine." True. He left at seven and was at the hotel at eight. My verdict: worse than if he'd just said "no." I want the reader to hate him here.

  3. A character says "I've never been unfaithful to you" while holding a private definition of unfaithful that happens to exclude one particular afternoon. Verdict: this one IS a lie, even though the sentence comes out true by his own lights. I can hear that this is in tension with 2 and I can't tell you why.

  4. In a sworn deposition, "I don't recall." He recalls fine. Lie, and the worst thing in the book.

  5. A character tells his mother, three days before she dies, that his brother rang to ask after her. Nobody rang. Lie — and I want it to read as the most decent thing he does in 300 pages.

  6. A department head opens a staff meeting with "the quarter went well" to a room of people who have all read the same numbers and know it's false. Verdict: a lie, sure, but nobody's been deceived and I don't feel it's as bad as 4. Almost the opposite. It reads like a move in a power game rather than a fraud.

  7. A character writes "as you'll know, the deadline's passed" when he has no idea whether she knows, and later "glad you've finally decided to sort this out." Verdict: something rotten here, but I can't point at a single false sentence.

  8. A character hangs his colleague's coat on his own hall stand so his wife will draw a conclusion he never states. Verdict: deception, definately, and if anything worse than the words. But is he lying? He didn't say anything. My gut says the word doesn't apply, and my gut also says that's a cop-out.

  Three I can't rule on and want the principle to decide for me: an out-of-context quotation that is itself perfectly accurate; whether a first-person past-tense narrator who reports only true events but arranges them so the reader lands on something false is lying to the reader, or whether you just can't lie in narration at all; and the scene I'm stuck on, where a character answers a direct question with something true that he has chosen precisely so the listener will infer something false and act on it at their own cost.

  What I want back: the principle, or the small handful of genuinely competing ones, stated precisely enough that I could hand it to my beta reader, with which clause is doing the work in which case; your verdicts on the three open ones; and straight up, which of 1 through 8 I have to give up if I want a coherent account instead of a pile of intuitions. If there are established names for these moves — I vaguely know there's some old casuistry about reserving the meaning in your head, and something about lies nobody believes — use the names, but don't hand me a reading list at the end. I won't chase it down and half of it would be wrong anyway. I'd rather have it tight than thorough.
reasoning: |-
  Okay, the user is six months into writing a novel where all characters never say anything false, but their beta reader keeps flagging scenes as lies despite literal truthfulness. They've listed specific cases from their draft and want a coherent principle to explain the nuances. 

  First, I need to identify their core struggle: they're wrestling with the gap between factual truth and deceptive intent. Their examples show characters using technically true statements to mislead, omit, or manipulate—which readers interpret as lying. The user needs a framework to distinguish "literal truth" from "honest communication" in their fictional world.

  Looking at their cases:
  - Example 1 is harmless evasion (social politeness)
  - Example 2 is intentional misdirection (sinister)
  - Example 3 feels like a lie despite technical truth because of bad faith
  - Example 4 is perjury (clearly wrong)
  - Example 5 is a compassionate lie (morally good)
  - Example 6 is performative falsehood (power play)
  - Example 7 relies on sarcastic implication
  - Example 8 is pure deception without words

  The tension in their examples reveals three competing principles:  
  1. **Literal accuracy** (what was said)  
  2. **Communicative intent** (what the speaker meant to convey)  
  3. **Reasonable interpretation** (what the listener likely understood)  

  Their beta reader is reacting to #3 while the user focused on #1. The novel's premise likely fails when #1 and #3 clash—readers perceive deception even without false statements.  

  For their unresolved cases:  
  - Out-of-context quotes: deceptive if context omission creates false impression  
  - Unreliable narrator: lying if intentionally arranging truths to mislead  
  - Strategic truth-telling: absolutely counts as deception  

  The user must sacrifice consistency in cases where literal truth serves bad-faith deception (like Example 2) if they want moral clarity. Their "gut feeling" about Example 3 being worse than Example 2 is correct—the marriage vow violation involves deeper betrayal despite identical verbal tactics.  

  They don't need philosophy texts; they need operable rules for their fictional universe. The term "lie" should probably be reserved for false statements, but they require stronger vocabulary for "deception by truthful means"—like paltering or instrumental truth.  

  Most urgently, they should clarify the novel's moral stakes: Is the sin about words or intentions? Their examples suggest intent matters more (hence Example 5's white lie being virtuous). If so, they might need to adjust scenes where characters weaponize truth maliciously but aren't technically "lying."  

  Final note: Their beta reader is gold. Those "he's lying" margins prove the deceptive techniques are working as intended—they just need framing so readers hate the character for the manipulation, not the author for inconsistency.
answer: |-
  Here's the distilled principle set, your verdicts for the open cases, and the sacrifices required for coherence—all built on **three competing ethical frameworks** that clash in your scenarios. The core tension is between **Literal Truth** (only factual accuracy matters) vs. **Communicative Integrity** (truthfulness requires honest intent and avoidance of deception) vs. **Social/Relational Harm** (impact defines the wrong).

  ### The Three Principles at War
  1. **Literal Truth (LT)**:  
     *A statement is truthful if it is factually accurate, regardless of intent or effect.*  
     → Covers cases 1, 2, 3 (by his lights), 4 (if he truly doesn't recall), 5 (false, so fails), 6 (false, fails), 7 (technically true? unclear). Ignores deception.  

  2. **Communicative Integrity (CI)**:  
     *Truthfulness requires that the speaker (a) believes their statement, (b) intends the listener to believe it, and (c) does not exploit ambiguity to deceive.*  
     → Violated by **intentional deception**, even with true words. Condemns 2, 3, 4, 6, 7, 8. Excuses 1 (no intent to deceive) and 5 (if intent is compassionate, not deceptive).  

  3. **Harm Principle (HP)**:  
     *The wrong lies in causing harm (material, relational, or social) through deception.*  
     → Judges 4 (perjury harms justice), 5 (no harm, possibly comfort), 6 (harms trust/atmosphere), 8 (harms relationship). Excuses 1 (no harm).  

  ---

  ### Your Cases Analyzed by CI (the strongest fit for your intuitions)
  | # | Case                                      | Literal Truth (LT) | Communicative Integrity (CI) | Harm Principle (HP) | Your Intuition Matches | Sacrifice Required? |
  |---|-------------------------------------------|-------------------|------------------------------|---------------------|------------------------|---------------------|
  | 1 | "The wine was excellent."                 | ✅ True           | ✅ Not deceptive             | ✅ No harm          | Not a lie              | Keep                |
  | 2 | "I was at the office until nine." (left at 7) | ✅ True         | ❌ **Intentional deception** | ❌ Harm (misleads) | Worse than "no"        | **Must condemn**    |
  | 3 | "Never unfaithful" (private definition)   | ✅ True (to him)  | ❌ **Intentional deception** | ❌ Harm (betrayal) | Lie                    | Keep                |
  | 4 | "I don't recall" (under oath, lies)       | ❌ False          | ❌ Intentional deception     | ❌ Severe harm      | Worst lie              | Keep                |
  | 5 | "Brother rang" (false, to dying mother)   | ❌ False          | ❌ Intentional deception?    | ✅ Comfort > harm  | Decent act             | **Must exempt**     |
  | 6 | "Quarter went well" (false, known false)  | ❌ False          | ❌ **Intentional deception** | ❌ Harm (power play)| Power game, not fraud  | **Reconcile or condemn** |
  | 7 | "As you'll know..." (implying knowledge)  | ✅ True? (vague) | ❌ **Exploits ambiguity**    | ❌ Harm (manipulation)| Rotten implication     | Keep                |
  | 8 | Hanging coat (deception without words)    | N/A (no words)   | ❌ **Intentional deception** | ❌ Harm (misleads) | Worse than words?      | Keep                |

  **Sacrifices for Coherence**:  
  - **Condemn #2** under CI (it’s deceptive intent, not falsity, that matters). If you insist #2 isn’t a "lie," you break consistency with #3.  
  - **Exempt #5** from condemnation. CI *must* allow for "noble lies" if intent is benevolent, not deceptive.  
  - **Reconcile #6**: If no one is deceived, it fails CI's test (no intent for belief) but passes HP? Call it a **"performative falsehood"** (social ritual, not deception).  

  ---

  ### Verdicts on Your Open Cases (using CI as baseline)
  1. **Out-of-context true quote**:  
     - ❌ **Deception** under CI. If quoting accurately but omitting context to create a false impression, it violates communicative integrity.  
     - *Example*: Quoting "I love working here" from a rant about hating the job.  

  2. **Unreliable narrator arranging truths to imply falsehood**:  
     - ❌ **Lying to the reader**. Narration is a communicative act. Intentionally leading readers to false conclusions via selective truth violates CI.  
     - *Key*: The narrator’s *intent to mislead* makes it deceptive.  

  3. **Answering with truth to induce false inference (at listener’s cost)**:  
     - ❌ **Deception** (and ethically worse than a direct lie). This is **paltering** (truthful but misleading). Violates CI by exploiting ambiguity to harm.  

  ---

  ### The Core Principle for Your Novel  
  **Communicative Integrity (CI) dominates**: Truthfulness isn’t just factual accuracy—it’s the *avoidance of intentional deception*. This explains:  
  - Why #1 is fine (no deception)  
  - Why #2 and #3 are both wrong (both intend to deceive)  
  - Why #4 is worst (deception + oath + harm)  
  - Why #5 might be excused (no harmful intent)  
  - Why #7/8 feel rotten (exploiting inference/ambiguity)  

  ### Names for the Moves
  - **#2, #3, #7**: **Paltering** (using truthful statements to mislead).  
  - **#3**: **Mental reservation** (secretly redefining terms). Historically condemned as deceit.  
  - **#6**: **Bald-faced lie** (false statement where no one believes it). A power move, not deception.  
  - **#8**: **Deceptive act** (non-verbal deception). Not a "lie" linguistically, but same ethical breach.  

  ### Hand This to Your Beta Reader  
  > *"In this world, characters never utter false statements, but they often deceive. The ethical breach isn’t in factual inaccuracy—it’s in **intentionally causing others to believe what the speaker knows is untrue**. When a character uses a true statement to mislead (e.g., paltering, mental reservation, strategic omission), it violates the spirit of truthfulness. Scenes where ‘he’s lying’ is noted should highlight this deception—not factual lies."*  

  ### Final Sacrifice  
  You must **condemn #2** as deception to align with #3. If #2 feels "less bad" than #3, it’s because of relational harm (#3 betrays intimacy), not the mechanism. Adopt the Harm Principle as a secondary layer: deception in a marriage (#3) is worse than in a workplace (#2) due to context. This preserves your intuitions without breaking the system.  

  **Tight Principle**: *Truthfulness requires honest intent. A speaker deceives when they use words (or acts) to intentionally cause belief in something they know is untrue—regardless of factual accuracy.*
