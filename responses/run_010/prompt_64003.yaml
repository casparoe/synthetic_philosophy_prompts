prompt: |-
  I'm giving a 30-minute talk at a philosophy-of-cosmology workshop in about three weeks, and the audience is... a mixed bag that I'm honestly a little scared of. Roughly: four or five philosophers of probability (one of whom works on the Sleeping Beauty problem and considers it settled), two cosmologists who care about the measure problem and think of themselves as doing the adult version of this stuff, and a couple of Bayesian statisticians who will want to know what the likelihood function actually is. Nobody in the room is a fan of anthropic reasoning generally; the default mood is "this whole literature is a mess of badly-specified thought experiments."

  Here's the thesis I'm defending: the self-sampling assumption is right and the self-indication assumption is wrong — you should reason as if you were a random observer from your reference class, *not* weight hypotheses by how many observers they contain — and the famous "presumptuous philosopher" case, where a theorist becomes near-certain of a theory just because it predicts a trillion times more observers, doesn't refute SIA at all. It's really an objection about prior sensitivity dressed up as a paradox. My argument sketch, so you have something to aim at: (1) SIA makes it possible to get massive confirmation from facts that have nothing to do with your evidence — the theorist never looked through a telescope, he just counted; (2) SSA at least ties the shift in credence to your actual location among observers, which is the only genuinely new information you ever get; (3) the reference-class relativity everyone complains about is a feature, because your total evidence narrows which class you're sampling from, and once you do that properly the presumptuous philosopher's trillion-to-one swing mostly evaporates; (4) I'll bite the bullet on the doomsday argument, but only in a restricted, sane form.

  What I need is a prep sheet, not a defense of my view. Give me the eightish objections this particular room will actually raise — not the ones I'd get from an anthropics-nerd forum — ordered by how much damage they'd do, each phrased roughly the way that person would phrase it (the cosmologist will talk about measures and typicality, the Sleeping Beauty person will insist my view is committed to halving, the statistician will ask me to write down the sampling model). For each: a two-minute reply I can deliver out loud, an honest note on where the reply is soft, and what I should just concede up front so I don't waste the Q&A defending something indefensible. Also tell me which single reply has to land or the whole talk collapses, and finish with the question I'm praying nobody asks — the one I don't have a good answer to yet.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're giving a 30-minute talk at a philosophy-of-cosmology workshop. The audience is a mix of philosophers of probability, cosmologists, and Bayesian statisticians. All of them are skeptical of anthropic reasoning, seeing it as messy. The user's thesis is that the self-sampling assumption (SSA) is correct, while the self-indication assumption (SIA) is wrong. They want to defend against objections without getting bogged down in defending their entire view.

  First, I need to identify the main objections each group might raise. The philosophers of probability, especially the Sleeping Beauty expert, will likely connect SSA to the halfer position. The cosmologists will focus on measure problems and typicality, arguing their approach is more rigorous. The statisticians will demand a clear likelihood function and sampling model. 

  For each objection, I should craft a concise reply that addresses the core concern but also notes where the argument might be weak. The user needs to know what to concede upfront to save time. The most critical reply is probably to the cosmologist's objection because if the audience dismisses SSA as naive compared to cosmology measures, the whole talk could collapse. 

  The user also mentioned a "pray nobody asks" question. That might be the one about the reference class problem, as it's notoriously messy and hard to resolve. I should highlight that as the weakest point. 

  I'll structure the objections by damage level, starting with the most damaging. The cosmologist's objection is top because if they convince the room that cosmology handles this better, SSA seems irrelevant. Next is the statistician's demand for a likelihood function, which is essential for credibility. The Sleeping Beauty objection is next because it ties into existing debates but might not be as central. 

  For each objection, I'll draft a two-minute reply, note where it's soft, and suggest concessions. The key is to keep replies focused, acknowledge weaknesses without derailing, and steer back to the talk's thesis. The user needs to avoid getting stuck in technicalities and instead emphasize that SSA provides a coherent framework where others falter, especially in thought experiments like the presumptuous philosopher. 

  Finally, I'll remind the user to concede that SSA isn't a complete solution but a tool that, when combined with empirical evidence, avoids the excesses of SIA. This sets realistic expectations and builds credibility.
answer: |-
  Here's your prep sheet, designed for maximum impact with this specific hostile audience. The objections are ordered by damage potential, with replies structured for quick delivery. **Critical Reply** marked below.

  ### Core Strategy: 
  Frame SSA as *conservative epistemology* that ties belief-updating to *actual indexical information*, contrasting with SIA's "free confirmation." Emphasize that **SSA + total evidence** defangs "presumptuous philosopher" (PP) without needing cosmology's heavy machinery. Concede early that SSA isn't "complete" but a necessary component.

  ---

  ### **1. The Cosmologist's Objection (Highest Damage: Dismisses your whole project)**
  *"Why reinvent the wheel? In cosmology, we solve observer-counting via the *measure* in the multiverse. Typicality emerges from the geometry/physics. Your 'reference class' is just a poorly defined hack for a problem we solve rigorously. PP isn't 'prior sensitivity' – it's a sign your framework lacks the right measure!"*
  *   **Reply (2-min):** "Respectfully, cosmological measures *presuppose* a solution to the indexical problem. Choosing a measure (e.g., proper time vs. comoving volume) implicitly answers 'What is my sampling probability over observers?' before any physics. SSA makes this sampling assumption *explicit* and *epistemological*. Crucially, when you combine SSA with *our actual evidence* (e.g., we observe CMB temperature ~2.7K, not values typical of Boltzmann brains), you get constraints robust against measure ambiguities. PP exploits *lack* of such evidence. Your measure *is* the prior – that's my point."
  *   **Soft Spot:** Doesn't prove SSA is *better*, just argues it's prior to/informs measure choice. Cosmologists see measure as *physics*.
  *   **Concede:** "Absolutely, a full cosmological model needs a physical measure. But *interpreting* what that measure implies for *my* credences requires something like SSA. My claim is SSA provides the correct epistemic bridge between the multiverse and my beliefs."

  ### **2. The Bayesian Statistician's Objection (Cuts to core credibility)**
  *"Stop hand-waving. Write down the sampling model: What is the population? What is the sampling mechanism? What's the likelihood function for *my* existence given theory T? If SSA is 'just conditionalization', show me the math. Without this, it's not Bayesian."*
  *   **Reply (2-min):** "Gladly. Population: The observer-moments in the reference class *compatible with my total evidence E*. Sampling: Uniform random selection from that class. Likelihood P(I exist | T & SSA): This is *not* defined directly. Instead, SSA tells us P(I am *this specific observer* | T) ∝ 1 / (Number of observers in ref class under T compatible with *existing at all*). But crucially, upon learning I exist (trivially true) *and specific evidence E* (e.g., I see CMB=2.7K), I update: P(T | E) ∝ P(E | T & SSA) * P(T). P(E | T & SSA) is the probability that a *random observer* in the T-universe (within the ref class) sees E. PP fails because *before* getting specific E, the ref class is huge/undefined; *after* E, it's constrained."
  *   **Soft Spot:** "Ref class compatible with existing at all" feels vague. Defining the "pre-existence" reference class operationally is notoriously tricky.
  *   **Concede:** "You're right, the initial, pre-evidence reference class definition is philosophically fraught. In practice, for PP-like cases, *total evidence E* (like our physical constants) drastically narrows it, making the prior sensitivity manageable. I'm assuming a 'minimal' initial class based on cognitive capabilities."

  ### **3. The Sleeping Beauty Philosopher's Objection (Ties you to a "losing" position)**
  *"If you endorse SSA, you're committed to being a 'halfer' in Sleeping Beauty! But the halfer position is demonstrably incoherent/leads to Dutch books. Your epistemology is flawed at the root."*
  *   **Reply (2-min):** "SSA applies to indexical uncertainty about *which observer you are* in a physical world. Sleeping Beauty is fundamentally different: it's about *temporal identity* and *memory erasure* within a single observer's timeline. SSA concerns sampling across distinct observers or observer-stages in different worlds/times. The core issue in SB is whether the awakenings constitute different 'observer-moments' for credence assignment *even though it's the same person*. That's distinct from SSA's domain. I can consistently hold SSA for cosmological observer-counting *and* be a thirder on SB, seeing awakenings as distinct information states."
  *   **Soft Spot:** Distinction feels semantic. Both involve indexical uncertainty under duplication.
  *   **Concede:** "Fine, if you *insist* on forcing SB into an SSA mold, SSA *applied naively to awakenings* suggests halving. But I think that misapplies SSA. The real lesson of SB is that the definition of 'observer-moment' matters critically – just like the reference class does for cosmology. My SSA is focused on the cosmological context."

  ### **4. The General Anti-Anthropic Objection (Mood Killer)**
  *"This whole debate is sterile! Your 'resolution' of PP just replaces one arbitrary parameter (SIA's weighting) with another (your reference class). It's still untestable, unfalsifiable philosophy masquerading as science. Why does cosmology need this?"*
  *   **Reply (2-min):** "I share your frustration with poorly constrained thought experiments. But anthropic reasoning *is* forced upon us when considering theories predicting vastly different numbers of observers *capable of making the observations we make*. Ignoring it means ignoring relevant information. SSA isn't adding a *new* parameter; it's making explicit the *epistemic constraint* that my existence is indexical data. The reference class *is* constrained by total evidence – we know we're observers with specific physical capabilities making specific measurements (like CMB). PP highlights what happens *without* that evidence. With it, SSA gives stable, non-presumptuous results."
  *   **Soft Spot:** Doesn't fully dispel the "untestable" charge. SSA refinements are still model-dependent.
  *   **Concede:** "Agreed, anthropics alone can't *select* theories. It needs coupling with specific physical evidence and models. Its core job is preventing *obviously wrong* conclusions from observer counts alone."

  ### **5. The "SSA is Just as Bad" Objection**
  *"You say PP is prior sensitivity, not SIA's fault. But SSA has Doomsday! If I'm a 'random human', I should think doom is soon. That's insane *and* prior-sensitive! How is that better than PP?"*
  *   **Reply (2-min):** "Two key points. First, Doomsday *only* bites under SSA if we assume a *specific, narrow reference class* (e.g., 'all humans ever') *and* a specific prior over doom times (e.g., uniform in birth rank). But my total evidence includes: I live in an era of advanced science/technology, not the agrarian past; I know about exponential population growth. This *dramatically* shifts the plausible reference class and priors, weakening Doomsday significantly. Second, while Doomsday is uncomfortable, PP under SIA is *catastrophic* – it allows near-certainty in theories with *zero empirical support* beyond headcount. SSA ties belief shifts to *location* information, which Doomsday uses (my birth rank), however uncomfortably. PP under SIA uses no location information."
  *   **Soft Spot:** "Significantly weakened" is vague. Hard quantitative demonstrations are messy.
  *   **Concede:** "I concede that a *naive* SSA Doomsday Argument, ignoring most of my evidence, is strong and unsettling. But it's a *feature* showing SSA reacts to indexical info, not a bug proving it wrong. The lesson is: *use all evidence* rigorously."

  ### **6. The "What's New?" Objection (From Cosmologist or Philosopher)**
  *"This sounds like standard 'typicality' plus conditionalization. Aren't you just restating what careful cosmologists already do? Why the fancy SSA label?"*
  *   **Reply (2-min):** "You've nailed part of it! Careful application of typicality *is* applying SSA. My goal is to extract the *general epistemic principle* (SSA) from the cosmological practice and show it's superior to SIA *as a foundational rule*. The 'fancy label' clarifies why PP under SIA is wrong: it *violates* typicality by weighting theories by observer count *before* conditioning on typicality within a theory. SSA makes the 'be typical' assumption explicit and primary. Framing it this way prevents errors in non-cosmological thought experiments and clarifies the role of indexical evidence."
  *   **Soft Spot:** Risks making the talk seem trivial if they already accept typicality.
  *   **Concede:** "If you rigorously apply typicality conditional on *all* evidence, including your specific observations, then you are effectively using SSA. My talk is partly an argument *against* SIA and *for* recognizing SSA as the correct formalization of that typicality principle."

  ### **7. The "Reference Class is Arbitrary" Objection**
  *"You say 'total evidence' defines the reference class. But how? Is it 'observers seeing CMB=2.7K'? 'Carbon-based life'? 'Mathematically aware observers'? This is just as arbitrary as SIA's weighting! Different choices give wildly different results."*
  *   **Reply (2-min):** "Arbitrariness is minimized by *conditionalization*. Start with the broadest plausible class compatible with *being an observer capable of having my evidence* (e.g., conscious, embodied, in a universe with physics). Crucially, *update* as you gain evidence. Learning I see CMB=2.7K restricts me to observers *in regions with CMB~2.7K*. Learning I'm human restricts me to human observers. SIA's weighting is fixed *before* evidence. SSA's class is dynamically narrowed *by* evidence. PP uses no narrowing evidence, hence the sensitivity. With our actual rich evidence, the class is sufficiently narrow for stable conclusions."
  *   **Soft Spot:** Defining "broadest plausible class" is still subjective. No clear stopping point.
  *   **Concede:** "There's inherent vagueness at the outermost boundaries. But in practice, for theories predicting observers *radically* different from us (e.g., Boltzmann Brains), our evidence *sharply* defines the class: we are clearly not BBs. For closer cases, it's fuzzy, but so are many priors in science."

  ### **8. The "SSA Violates Bayesian Coherence" Objection (Philosopher of Probability)**
  *"Conditionalizing on 'I exist' under SSA requires assigning probabilities to your own existence conditional on theories. But 'I exist' is always true! How is this non-trivial? Standard Bayes can't handle this self-locating certainty."*
  *   **Reply (2-min):** "This is the 'Problem of Old Evidence' for indexicals. SSA provides a resolution: before conditionalizing on my specific identity, I consider the probability that *some observer exists with my exact evidence E* within T. Learning '*I* am that observer' is indexical. SSA tells us how to update *from* a state of ignorance about *which* observer I am *within the class defined by E and T*. The shift comes not from learning 'I exist' (which is certain), but from learning *which specific data-collecting entity I am* among the possibilities defined by T and E. It's coherent when framed as updating on indexical location."
  *   **Soft Spot:** Still philosophically contentious. Requires accepting self-locating beliefs as fundamental.
  *   **Concede:** "Formalizing this rigorously within standard Bayesianism is an active challenge. I'm assuming frameworks like Bostrom's or Manley's that extend Bayesianism to handle self-locating uncertainty. If you reject that extension, we have a deeper disagreement."

  ---

  **The Critical Reply That Must Land:** **#2 (The Bayesian Statistician)**. If you can't convincingly write down the sampling model and likelihood function *in front of them*, your credibility with the precise thinkers (stats, some philosophers) evaporates. Nail this reply clearly, slowly, and write the key terms on the board: Population (Ref Class + Total Evidence), Sampling (Uniform), Likelihood (P(E | T & SSA) = Freq of E in Pop under T).

  **The Question You Pray Nobody Asks (The "Prayer" Question):**
  *"Assume a multiverse with two types of universes: Type A (99.9% of volume) has 1 observer per universe who sees evidence E. Type B (0.1% of volume) has 1 trillion observers per universe, all of whom also see E. I observe E. According to your SSA + total evidence: What is P(I am in Type A)? What is P(I am in Type B)? Doesn't this *still* give ~10^9-to-1 odds in favor of Type B – making you just as 'presumptuous' as the SIA philosopher, just via the cosmological measure/volume weighting instead of direct observer counting?"*

  *   **Why it's deadly:** It directly weaponizes the cosmologist's measure against your SSA framework. Your total evidence (E) is seen in *both*, so reference class narrowing doesn't help. Your probability now seems *entirely* driven by the cosmological measure (volume fractions), replicating the PP swing you criticized SIA for. Distinguishing SSA's "sampling over observers" from the underlying measure weighting becomes nearly impossible here. You likely *have to* accept a huge swing towards Type B, undermining your core thesis that SSA avoids PP. The best defense is muddy: argue the measure *is* part of the prior physics, and SSA just tells you how to interpret it for your credence, but this sounds like conceding PP is inevitable if the measure is sufficiently skewed, contradicting your attack on SIA.

  **Final Prep Advice:**
  1.  **Open by Conceding:** "Anthropics is messy. SSA isn't a magic bullet. Its goal is modest: to handle indexical information *without* granting free confirmation (SIA). PP exposes *prior* sensitivity, which SSA + evidence minimizes."
  2.  **Whiteboard is Key:** For #2 (Statistician) and #1 (Cosmologist), use the board. Write the SSA likelihood (P(E|T) = Freq of E in Ref Class under T). Show how PP lacks E.
  3.  **Control Q&A:** "Let me rephrase to ensure I understand..." buys time. "That's an important point, but due to time, let me focus on..." redirects. Acknowledge good points quickly.
  4.  **Emphasize:** "SSA forces belief shifts to be *anchored to location information you actually gain*. SIA does not."

  Good luck! This audience is tough, but your core argument (SSA + Evidence tames PP) is defensible if you stay focused on the epistemology and concede the necessary ground early.
