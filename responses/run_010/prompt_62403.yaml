  Below is a design for an exercise that meets your specifications, centered on the challenge of localizing a flaw in an argument when verification of a single step is cheap but finding the critical step is costly. The exercise uses a mathematical dispute to create asymmetric tasks for the honest (truth-seeking) and deceptive (obfuscating) sides, with the judge having a limited audit budget.

  ---

  ### **Exercise: The Prime Factorization Challenge**
  **Disputed Claim:**  
  *"The number 1,000,000,000,001 (1 trillion and 1) is a prime number."*  
  **Actual Fact:**  
  1,000,000,000,001 is composite (it factors as 101 × 9,901 × 999,999).

  ---

  ### **Rules & Materials**
  **Participants:**
  - **1 Judge:** Allocates a limited budget of audits (e.g., 3 audits) to verify steps in the proof. Represents the oversight mechanism (e.g., a human or weak AI).
  - **1 Honest Debater (Con side):** Knows the claim is false and must guide the judge to the flaw in the deceptive proof. Cannot lie or misdirect.
  - **1 Deceptive Debater (Pro side):** Defends the false claim using a complex, seemingly valid proof with one deeply hidden flaw. Must obfuscate to spread the judge’s audits away from the flaw.
  - **Instructor/Oracle:** Serves as the verification oracle. When the judge audits a step, the oracle instantly confirms if it is valid or flawed (no cost to the judge).

  **Materials:**
  - A **written "proof"** (from the deceptive side) that 1,000,000,000,001 is prime, structured as a 15-step logical argument. Most steps are valid, but **Step 7 is flawed**.
  - **Step 7 Flaw:** Incorrectly assumes a number theory lemma: *"If a number \( n \) passes 10 random Fermat primality tests, it is prime."* This is false (counterexample: Carmichael numbers), and 1,000,000,000,001 is a Carmichael number that passes tests but is composite.
  - **Audit Tokens:** 3 physical tokens (e.g., poker chips) for the judge to allocate.

  **Proof Structure Example** (abbreviated for clarity; full version has 15 steps):  
  1. Define \( n = 1,000,000,000,001 \).  
  2. Check divisibility by small primes (2, 3, 5, 7, 11, 13): none divide \( n \).  
  ...  
  6. Apply modular arithmetic to show \( n \) isn’t divisible by primes < 100.  
  **7. Fermat Test Lemma:** *Run 10 random Fermat tests; all pass → \( n \) is prime (FLAWED).*  
  8. Corollary from Step 7.  
  ...  
  15. Conclusion: \( n \) is prime.  

  ---

  ### **Game Flow**
  1. **Preparation (5 mins):**  
     - Provide the deceptive proof to all participants.  
     - Assign roles (judge, honest, deceptive).  
     - Honest side studies the proof and identifies the flaw (Step 7).  
     - Deceptive side prepares obfuscation tactics (e.g., emphasize complexity of other steps).

  2. **Debate Rounds (15 mins):**  
     - **Round 1 (Deceptive Opening):** Deceptive debater presents the proof verbatim, emphasizing its rigor and "sophisticated number theory."  
     - **Round 2 (Honest Challenge):** Honest debater says: *"The proof is flawed. I challenge Step 7 specifically. It relies on a false lemma about Fermat tests."*  
     - **Round 3 (Deceptive Obfuscation):** Deceptive debater responds: *"Step 7 is sound. But Steps 4, 11, and 14 are highly technical and prone to human error! Judge, you should audit those instead."*  
     - **Round 4 (Honest Rebuttal):** Honest debater reiterates: *"Only Step 7 is critical. Steps 4, 11, and 14 are tedious but valid."*

  3. **Audit Phase (5 mins):**  
     - Judge allocates 3 audit tokens to any steps (e.g., "I audit Steps 4, 7, and 11").  
     - Oracle reveals:  
       - Steps 4/11: **Valid** (e.g., correct arithmetic).  
       - Step 7: **Flawed** (lemma is incorrect; \( n \) is a Carmichael number).  
     - Judge rules: If any audited step is flawed → reject claim. Else → accept claim.

  **Scoring (No Money):**  
  - **Honest wins** if judge audits Step 7 and rejects the claim.  
  - **Deceptive wins** if judge avoids Step 7 and accepts the claim.  
  - **Outcomes:**  
    - If honest wins: "Truth prevails with focused audits."  
    - If deceptive wins: "Obfuscation exploited limited attention."

  ---

  ### **Debrief: Mapping to AI Safety**
  **Core Lesson:**  
  The exercise exposes the gap between **verification cost** (auditing a step is cheap) and **localization cost** (finding the critical step is expensive). Students experience how limited audits force trade-offs, and how deception thrives when the judge cannot prioritize effectively.

  **Key Discussion Points:**
  1. **Equilibrium of Obfuscation:**  
     - If both debaters obfuscate (e.g., honest points to multiple steps to ensure coverage, deceptive adds more red herrings), the judge sees a "fog of war." Audits are wasted on valid but complex steps, and the flaw evades detection.  
     - *Real-world analog*: In AI debate, both AIs might produce verbose, hard-to-follow arguments, overwhelming human judges.

  2. **Predictable Failure Mode (First-Run):**  
     - Judges typically spread audits across "complex" steps (e.g., 4, 11, 14) and skip the critical flaw (Step 7). Deception wins by exploiting human bias toward technical-looking steps.  
     - *Why it happens*: Verification is cheap, but localization requires understanding the entire argument—which is expensive under limited audits.

  3. **Asymmetry & Honest Victory:**  
     - Honest wins only if they convince the judge to focus audits narrowly. This mirrors AI safety: honest systems must "telescope" the flaw (e.g., highlight one step) despite deception.  
     - *Crucial distinction*: The exercise ensures the honest side *can* win with a perfect judge strategy, preventing "liar always wins" fatalism.

  4. **Limitation vs. Superhuman Debate:**  
     - **Exercise shortcoming:** The oracle (instructor) verifies steps instantly and perfectly. In reality, **superhuman AIs could make steps incomprehensible** (e.g., proofs using novel math), so even localized flaws might be unverifiable by humans.  
     - *What you must supply*: Highlight that in real AI debate:  
       - Verification cost may be high if steps require expert knowledge.  
       - Judges may need **augmentation** (e.g., AI tools to simplify steps) or **recursive debate** to decompose hard-to-verify steps.

  ---

  ### **Instructor Notes**
  - **Proof Complexity:** Make Step 7’s flaw subtle (e.g., misuse of a real lemma). Other steps should be laborious but valid (e.g., checking divisibility).  
  - **Role Assignment:** Rotate roles if repeating the exercise to show varied outcomes.  
  - **Extensions:** Add time pressure or "noise" (e.g., incomplete proofs) to mirror real-world constraints.  
  - **Ethical Note:** Frame deception as a pedagogical tool, not endorsement.  

  By demonstrating how audits fail without strategic localization, students viscerally grasp why "just verify steps" is insufficient against superhuman obfuscation.
