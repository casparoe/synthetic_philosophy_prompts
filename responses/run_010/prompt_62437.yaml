  First, I need to properly understand the core argument structure. The friend claims that Friedman's methodological doctrine (1) is itself a theory that must be judged by its own standards - predictive success rather than descriptive accuracy. This creates a self-immunizing loop where realist objections become inadmissible. The user finds this conclusion troubling but couldn't counter it during the debate.

  The user's astrologer parallel is particularly interesting. Their friend dismissed it by pointing to astrology's predictive failures, but the user suspects this misses the point. They want to know if this analogy exposes a flaw in the self-application logic, and whether rejecting it requires realist commitments.

  Looking at the argument steps, premise (3) seems the critical pivot point - it's where the self-application happens. But the move from (2) to (3) might be problematic. Calling methodology "a theory" doesn't automatically mean it has the same epistemic status as first-order theories. Methodological claims operate at a different logical level - they're rules for evaluation, not predictive models.

  The user's sympathies matter here. They like (1) as methodology but reject the self-justification move. They'd rather sacrifice (6) than abandon instrumentalism, which suggests they see the value of Friedman's approach without buying its absolute self-defense.

  The astrologer parallel actually highlights two important disanalogies: First, astrology makes first-order empirical claims while methodology doesn't. Second, the "success" in (6) is circular when applied to methodology - we're judging the evaluative rule by the theories it produces, but only according to its own standards. This circularity isn't necessarily fatal, but it makes the immunity claim weaker than presented.

  Ultimately, the friend's argument conflates different types of "theories." Rejecting (3) as invalid preserves instrumentalism while avoiding self-immunization. The cost is acknowledging that methodology needs external justification - perhaps pragmatic or coherence-based rather than strictly "realist."
answer: |-
  Your friend's argument is clever but contains a critical flaw in its self-referential structure. I reject **step (3)**, specifically the inference from (1) and (2) to (3). Here's the breakdown:

  ### Why (3) is Invalid
  The argument commits a **category error** by treating methodological doctrines identically to first-order scientific theories. While (2) is correct that a methodology *makes claims* about inquiry, these claims are **meta-theoretical** and serve a fundamentally different function:
  - **First-order theories** (e.g., economic models) describe *phenomena* (e.g., market behavior). Their assumptions are instrumental tools for prediction.
  - **Methodological doctrines** (e.g., instrumentalism) prescribe *how to evaluate* first-order theories. Their "assumptions" are normative or epistemological principles, not predictive hypotheses.

  Thus, (1)'s criterion ("assess theories *solely* by predictive success") **cannot coherently apply to itself** because:
  - Methodological doctrines do not make predictions about economic phenomena. They make claims about *what counts as successful science*.
  - Applying (1) to itself would require evaluating instrumentalism *only* by whether it "predicts" which theories will succeed. But instrumentalism doesn't issue testable predictions; it issues *evaluative standards*. This reduces to circularity: "Instrumentalism is true because theories accepted under instrumentalism are predictively successful" – but "predictive success" is *defined* by instrumentalism itself.

  ### The Cost of Rejecting (3)
  - **What you lose**: The self-immunizing property of instrumentalism. You must accept that methodological claims (like (1)) require justification beyond their own instrumental criteria – e.g., coherence with scientific practice, explanatory power, or broader epistemic virtues.  
  - **What you keep**: Your preferred position. You retain (1) as a first-order methodology and (2) (methodology makes factual claims) without conceding that instrumentalism is beyond critique. Realist objections (e.g., "scientists test assumptions") become admissible but not necessarily decisive.

  ---

  ### Your Astrologer Parallel: Why It Works (and Your Friend's Reply Fails)
  Your parallel **damages step (6)** and exposes the circularity in self-application. Let's analyze:

  1. **The parallel's structure**:  
     - Astrology declares: "Judge me *only* by my own predictive success."  
     - It self-applies: "This methodological rule is itself a theory, so judge it *only* by whether astrologers accept successful charts."  
     - This is identical to your friend's (1)→(3) move.  

  2. **Your friend's reply**:  
     He rejects the parallel because "astrology doesn't pass the test in (6)." This **begs the question** and misses your point:  
     - (6) assumes instrumentalism's *own definition* of "predictive success." Astrology could claim equal success *by its own standards* (e.g., "Venus in retrograde explains your divorce!").  
     - Your friend implicitly appeals to **realist criteria** (e.g., "astrology's 'predictions' don't correspond to reality") – the very criteria instrumentalism rejects in (5).  

  3. **The disanalogy doing the work**:  
     There *is* a disanalogy, but it **helps you, not your friend**:  
     - Friedman's economics has *intersubjective predictive success* by conventional scientific standards (e.g., empirical data).  
     - Astrology does not.  
     - **Crucially, recognizing this disanalogy requires stepping outside instrumentalism**. It relies on a realist-friendly appeal to *actual empirical performance* – not the self-certified "success" in (6).  

  4. **Who benefits?**  
     - **Realists** can exploit this disanalogy to argue that instrumentalism only "works" when its predictions align with reality – tacitly relying on truth.  
     - **Instrumentalists cannot** consistently appeal to this disanalogy without self-sabotage: admitting astrology fails requires using the realist criteria they reject in (5).  

  ---

  ### Ranking Premises by "Cost" to Your Position
  If you insist on preserving instrumentalism while blocking self-immunization:  
  1. **Least costly to reject**: **(6)**  
     - *Cost*: You lose the "vindication" of instrumentalism by its own test.  
     - *Benefit*: You avoid circularity and can acknowledge that first-order success (e.g., in economics) doesn't prove methodological truth.  

  2. **Moderate cost: (3)** (as I recommend)  
     - *Cost*: You concede that methodology needs external justification.  
     - *Benefit*: You save (1) and (2) while defanging the self-immunization argument.  

  3. **Most costly: (1)**  
     - *Cost*: Abandons instrumentalism entirely. Unacceptable to you.  

  ---

  ### Conclusion
  Your friend's argument fails at (3) by conflating levels of inquiry. Methodological doctrines *cannot* self-apply without circularity or question-begging. Your astrologer parallel succeeds because it reveals this flaw: rejecting astrology requires criteria instrumentalism forbids. The disanalogy (astrology lacks real predictive success) is real but only detectable from a realist perspective – which instrumentalism cannot acknowledge without inconsistency. 

  **To retain instrumentalism**: Reject (3). Accept that methodology must answer to meta-criteria (e.g., coherence, fertility, broad applicability) beyond its own first-order rules. This lets you keep (1) as a useful heuristic while avoiding self-defeating immunity.
