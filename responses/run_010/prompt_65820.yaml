  Hmm... let me unpack the dialectic carefully. The friend's argument is clever because it forces supervaluationists into what looks like a dilemma with only bad exits. But I recall Fine's original work anticipated these objections. The key moves available to supervaluationists include:

  First, rejecting the disjunction in (4) by denying that "drawing a sharp line" is the only alternative to vagueness. Supervaluationism doesn't require precision at any level - it can consistently maintain vagueness all the way up without that preventing truth-value assignments at object level. 

  Second, the regress in (6) isn't necessarily vicious. We handle higher-order vagueness through the same supervaluational mechanism - it's recursive but not circular. Truths can emerge from patterns across precisifications even when those precisifications themselves have borderline cases. 

  Third, premise (2) overstates - truth-values aren't "fixed entirely" by admissibility because supertruth also depends on how precisifications behave. The admissibility conditions constrain but don't fully determine outcomes.

  The user's instinct about (4) is sharp - that's exactly where the argument overreaches. But preserving (3) is wise; giving up metalanguage vagueness would indeed collapse the view. The cost is accepting that semantic foundations can be vague without being mysterious - a feature rather than bug.

  About the regress: it's endless but not vicious. Like an infinite series converging, the supervaluationist machinery can deliver definite truth-values without needing "final" precision. This does require embracing open-texture in language, which some find unsatisfying, but it's coherent.

  I should emphasize that this position isn't cost-free. It means accepting truth as relativized to specification schemes rather than absolute, and it doesn't eliminate all counterintuitive results (like the truth of "either he's bald or he's not" while neither disjunct is true). But these are known tradeoffs in the literature.

  The user seems particularly concerned about whether this regress "never terminates" in truth-determination. That's worth addressing directly: the supervaluationist can point to local determinacy - claims can be true relative to a vagueness resolution framework even if that framework itself has unresolved vagueness. We navigate such layered indeterminacies in ordinary discourse constantly.
answer: |-
  You've hit on one of the most persistent objections to supervaluationism ("superV") – the *admissibility regress* or *higher-order vagueness* problem. Your friend's argument is sophisticated, but I reject **step (4)'s disjunction** ("*either* accepts a vague metalanguage *or* draws a sharp line"). Supervaluationism has a viable third option: **embrace vagueness in the metalanguage *without* drawing a sharp line *and* without triggering a vicious regress that prevents truth-value assignment at the object level.** Here's the breakdown:

  ### Where the Argument Goes Wrong & Why
  1.  **Rejecting (4)'s False Dilemma:**
      *   **The Move:** SuperV denies that the *only* options for handling vague "admissible" are (a) making it precise or (b) accepting infinite regress preventing determination. It offers (c): **treat "admissible precisification" supervaluationally within the metalanguage itself.**
      *   **Why (4) Looks Tempting:** It seems intuitive that if a term is vague, you must *either* precisify it (drawing a sharp boundary somewhere) or leave it vague (leading to unresolved indeterminacy). This assumes classical bivalence applies fundamentally *at the meta-level*.
      *   **The Cost/Commitment:** SuperV must consistently apply its framework *at every level*. "Admissible" is vague, so its semantics is given via *supervaluations over precisifications of "admissible precisification"*. This means:
          *   There is no single, sharp set of admissible precisifications for "bald".
          *   Instead, there are *many* admissible ways to precisify "admissible precisification" (meta-precisifications).
          *   A statement like "*Precisification P is admissible for 'bald'*" can be:
              *   **Super-true:** True on all admissible meta-precisifications.
              *   **Super-false:** False on all admissible meta-precisifications.
              *   **Indeterminate:** True on some, false on others.

  2.  **Rejecting the Implication in (5):**
      *   **The Move:** Even if the supervaluationist *did* draw a sharp line around admissibility for "bald" (which they typically resist), it wouldn't *necessarily* collapse into epistemicism. Epistemicism posits a *single*, unknowable sharp boundary. SuperV with a sharp meta-boundary posits that "bald" has *multiple* equally good sharpenings (all within the sharp meta-boundary), and truth is defined via universal quantification over *that set*. The "last bald man" would still vary across *different* precisifications within the admissible set. While the *set* of precisifications is sharp, the *extension* of "bald" remains blurred across that set.
      *   **Why (5) Looks Tempting:** If the *set* of precisifications is sharp, it seems like the truth conditions for "n is bald" (∀P∈Admissible: P(n)=True) *must* pick out a sharp boundary. However, this ignores that the *variation* within the admissible set is what creates the borderline cases. The *set* being sharp doesn't mean the *property defined by quantifying over the set* is sharp.
      *   **The Cost/Commitment:** SuperV *can* technically be combined with a sharp meta-boundary (some formal models do this), but this is widely seen as *ad hoc* and contrary to the spirit of capturing vagueness. It concedes that the *real* vagueness (the variation) is pushed only one level up. Most supervaluationists avoid this.

  3.  **Rejecting the Viciousness Claim in (6):**
      *   **The Move:** The regress is **endless but not vicious**. Truth-values *can* be determined at the object level ("n is bald") even while "admissible" is vague, because supertruth at level N is defined relative to the (vague) admissibility at level N+1. Crucially, **indeterminacy at level N+1 does not automatically infect level N with indeterminacy**.
      *   **How it Works:**
          *   Consider a clear case: Pierre has 0 hairs. On *every conceivable* precisification of "bald" compatible with meaning/use (i.e., on *every* candidate admissible precisification, even those borderline-admissible themselves), Pierre is bald. So "Pierre is bald" is **super-super-true** (true on all meta-precisifications of admissibility). Its truth is settled *despite* the vagueness of "admissible".
          *   Consider a clear non-case: Charles has a full, thick head of hair. He's not bald on *any* admissible candidate precisification. "Charles is bald" is **super-super-false**.
          *   Consider a borderline case: Jacques has some sparse hairs. There are *some* candidate meta-precisifications where *all* the precisifications deemed admissible *at that meta-level* make Jacques bald. There are others where *all* make him not bald. And there are meta-precisifications where *some* of the precisifications they deem admissible make him bald and others don't (making "Jacques is bald" indeterminate *at that meta-level*). So "Jacques is bald" is **indeterminate at the object level**. Crucially, this indeterminacy *is determined* by the supervaluationist machinery operating at the meta-level, even though the meta-level itself has borderline cases.
      *   **Why (6) Looks Tempting:** It assumes that vagueness at level N+1 *must* prevent the assignment of any definite status (truth/falsity/indeterminacy) at level N. But supervaluationism provides a mechanism (quantification over precisifications) that *can* yield definite results at level N even when level N+1 is vague, as long as there's sufficient uniformity *across* the candidate precisifications at level N+1 regarding the outcome at level N.
      *   **The Cost/Commitment:** SuperV must accept that semantic foundations are *themselves* vague and open to multiple precisifications. There is no single, absolutely precise, non-vague bedrock. Truth for vague sentences is **relativized stability**: a sentence is true if it's stable (comes out true) across *all* ways of resolving the vagueness that are compatible with meaning and use, *even though* the set of "ways of resolving vagueness" is itself vague. This requires abandoning the classical ideal of absolute, context-independent precision in semantics.

  ### Diagnosis Summary
  *   **Step Rejected:** **Step (4)** presents a false dichotomy.
  *   **Why it Looked Fine:** It relies on an implicit classical assumption that vagueness must be "resolved" (by sharpening or by leaving indeterminate) *at the expense of definite truth-value assignment*. SuperV rejects this by providing a mechanism (quantification over precisifications) that *can* assign definite statuses (super-truth, super-falsity, indeterminacy) even when operating within a vague framework.
  *   **Cost of Giving it Up (for the argument):** The argument loses its force as a *reductio*. SuperV escapes the dilemma.
  *   **Cost for SuperV:** It must embrace an endless hierarchy of vagueness. However, it provides a *coherent, non-collapsing* way to navigate this hierarchy and assign stable truth-values (and indeterminacy) at each level. The regress is **endless but not vicious**; it's the structure of language, not a fatal flaw. The cost is accepting that semantics is fundamentally open-textured and that truth is stability-under-resolutions rather than correspondence-to-a-single-sharp-reality.

  **Who won?** Your friend successfully highlights a profound challenge for SuperV (higher-order vagueness). However, SuperV has a sophisticated, non-collapsing response available (supervaluating the meta-language). Neither side delivered a knockout blow. The debate goes to the judges: philosophers remain divided, though SuperV survives as a distinct option precisely by rejecting the disjunction in (4) and embracing the endless regress as manageable. Your suspicion about (4) was correct!
