  Below is a triage procedure for evaluating set-builder specifications in ZFC. It fits on one page, uses a closed vocabulary of verdicts, and includes repairs and student-facing explanations. The procedure addresses your correction: **Quantification over all sets is permissible in Separation if an antecedent set is provided; the issue is unbounded comprehension without a set to separate from**. The kernel of your intuition is correct: **ZFC enforces predicativity via the antecedent set constraint, preventing self-referential paradoxes like Russell's, but allows impredicative quantification otherwise**. This is embedded in Step 2b.

  ---

  ### **Triage Procedure for Set-Builder Specifications**
  **Input**: `{x : φ(x)}` or `{f(x) : x ∈ A}` (with `φ` a formula in the language of set theory, possibly with parameters).

  1. **Determine Form**  
     - If `{f(x) : x ∈ A}`, go to **Replacement Form (Steps 2a–3a)**.  
     - If `{x : φ(x)}`, go to **Separation Form (Steps 2b–5b)**.  

  ---

  #### **I. Replacement Form: `{f(x) : x ∈ A}`**
  2. **Check Antecedent Set**  
     - Pass: `A` is a known set (e.g., given in context).  
     - Fail: `A` is not a set or undefined.  
       - **Verdict**: REQUIRES AN ANTECEDENT SET.  
       - **Repair**: Restrict to a set (e.g., `A = B` where `B` is supplied).  
       - **Explanation**: "You must specify a set to apply the function to."  
     - If pass, proceed to Step 3a.  

  3. **Check Function Definition**  
     - Pass: `f` is a class function (i.e., `∀x ∈ A ∃!y (y = f(x))`).  
     - Fail: `f` is not a function (e.g., ambiguous or multi-valued).  
       - **Verdict**: NOT EXPRESSIBLE IN THE FIRST-ORDER LANGUAGE (if `f` uses external concepts) or escalate.  
       - **Repair**: Redefine `f` to be functional (e.g., `f(x) = y` via explicit `ψ(x, y)`).  
       - **Explanation**: "The rule must define exactly one output per input."  
     - If pass:  
       - **Verdict**: ADMISSIBLE BY REPLACEMENT.  
       - **Explanation**: "The image of a set under a function is a set."  

  ---

  #### **II. Separation Form: `{x : φ(x)}`**
  2. **Check Expressibility**  
     - Pass: `φ` uses only `∈`, `=`, logical operators, and ZFC-definable notions (e.g., "finite", "ordinal").  
     - Fail: `φ` uses external concepts (e.g., "definable in English", "provable").  
       - **Verdict**: NOT EXPRESSIBLE IN THE FIRST-ORDER LANGUAGE.  
       - **Repair**: Reformulate in the language of ZFC or treat as a metatheoretic schema.  
       - **Explanation**: "The condition cannot be written in the basic language of sets."  
     - If pass, proceed to Step 3b.  

  3. **Check Boundedness**  
     - Pass: There exists a set `B` such that `φ(x) → x ∈ B`.  
       - **Verdict**: ADMISSIBLE BY SEPARATION.  
       - **Repair**: Write as `{x ∈ B : φ(x)}`.  
       - **Explanation**: "We can form this set by restricting to elements of a known set."  
     - Fail: No such `B` is apparent.  
       - Proceed to Step 4b.  

  4. **Check Set Construction Principles**  
     - Attempt to identify a known axiom:  
       - **Power Set**: If `φ(x) ≡ x ⊆ C` and `C` is a set → ADMISSIBLE BY POWER SET.  
         - Explanation: "The power set of a set is a set."  
       - **Union**: If `φ(x) ≡ ∃y ∈ C (x ∈ y)` and `C` is a set → ADMISSIBLE BY UNION.  
         - Explanation: "The union of a set is a set."  
       - **Other axioms** (e.g., Pairing, Infinity): Explicitly match to axiom templates.  
     - If matched:  
       - **Verdict**: ADMISSIBLE VIA SPECIFIC CONSTRUCTION (state axiom).  
     - If not matched, proceed to Step 5b.  

  5. **Check for Proper Classes**  
     - Test: Does the collection contain all sets of a type that ZFC proves proper?  
       - **Russell-type**: `φ(x) ≡ x ∉ x` → Contradiction if set.  
       - **Burali-Forti-type**: `φ(x) ≡ "x is an ordinal"` → Contradiction if set.  
       - **Universe-type**: `φ(x) ≡ x = x` → Too large by Regularity.  
     - If matches a known proper class:  
       - **Verdict**: PROPER-CLASS SIZED.  
       - **Repair**: Restrict to a set (e.g., `{x ∈ V_α : φ(x)}`), promote to a class, or use a schema.  
       - **Explanation**: "This collection is too large to be a set."  
     - If no match:  
       - **Escalate to instructor** (e.g., obscure or independent of ZFC).  

  ---

  ### **Worked Examples**

  | Case | Specification                 | Step | Verdict                           | Repair/Explanation                                                                 |
  |------|-------------------------------|------|-----------------------------------|------------------------------------------------------------------------------------|
  | (i)  | `{x : x ∉ x}`                | 5b   | PROPER-CLASS SIZED               | "This leads to Russell’s paradox if assumed a set."                               |
  | (ii) | Groups of order `p` (prime) | 5b   | PROPER-CLASS SIZED               | Restrict to groups on `ω` or a fixed set. "Underlying sets can be arbitrary."     |
  | (iii)| Order types of well-orderings of `ω` | 3b   | ADMISSIBLE BY SEPARATION          | Bound by `ω₁` (the set of countable ordinals). "`ω₁` exists by Replacement and is a set." |
  | (iv) | Real diagonalizing <25-word definables | 2b   | NOT EXPRESSIBLE IN FIRST-ORDER | "Definability in English is not in the language of ZFC."                         |
  | (v)  | `{X ⊆ A : X finite}`         | 3b   | ADMISSIBLE BY SEPARATION          | Bound by `P(A)`. "Finite subsets are a subset of the power set."                |

  **Notes**:
  - **No choice needed in (iii)**: `ω₁` is constructed via Replacement from the set of well-orderings of `ω` (a subset of `P(ω × ω)`), with no AC required for existence.
  - **Case (ii) misdiagnosis risk**: Students may expect ADMISSIBLE (since isomorphism classes are sets), but the specification is PROPER-CLASS SIZED due to varying underlying sets.

  ---

  ### **Escalations and Limitations**
  - **Escalate**:  
    - Step 5b (unknown proper class), ambiguous parameters, or independent cases (e.g., `{x : CH holds for x}`).  
  - **Limitations**:  
    - **Ambient theory dependence**:  
      - In NBG, PROPER-CLASS SIZED becomes ADMISSIBLE AS A CLASS.  
      - With a universal set (e.g., NF), Russell’s set may be ADMISSIBLE.  
    - **Do not raise alternatives** unless asked; focus on ZFC.  
  - **What it cannot do**:  
    - Handle metatheoretic independence (e.g., `L`-definability without AC).  
    - Diagnose size without known proper classes (e.g., `{x : |x| > ℵ_0}`).  
    - Resolve deeply implicit constructions (e.g., iterative definability).  

  ---

  This procedure is self-contained, runs in 5–10 minutes, and uses only ZFC axioms. Keep this page for reference during tutoring.
