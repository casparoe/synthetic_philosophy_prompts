prompt: |-
  I have spent the better part of twenty years reading the rationalist blogs and their comment threads, and over that time I have become convinced that a particular argumentative move does real damage in anthropic reasoning, yet I have never once seen it named. I would like to know whether it has a name, and if it does not, I would like one defined tightly enough that I could apply it and that a reader would recognise the thing I mean.

  The move, described without the vocabulary I lack:

  1. **Doomsday-style reasoning.** Someone argues that your rank in the sequence of humans is evidence that the sequence is short. The objection comes that the sequence could be drawn differently — all humans, all hominids, all observers including ones we have no contact with, only the people whose evidence matches yours, only people born in this century — and each choice yields a different number. When pressed, the arguer does not defend a choice; the arguer selects the one under which the conclusion survives, and the selection is presented as a harmless technicality rather than as a substantive claim.

  2. **Arguments from sheer numbers of observers.** A hypothesis becomes more credible because it implies that vastly more observers exist somewhere, and your own existence is likelier under it. Pressed on why observers you could never meet and could never become should count at all, the proponent narrows the counting until the boost disappears or stays, whichever serves the conclusion already reached. The familiar complaint that this reasoning makes a philosopher absurdly confident in a bigger universe is answered not by explaining why the boost is earned but by adjusting the class of beings who get to confer it.

  3. **Sleeping Beauty.** The two camps disagree about whether the answer is one half or one third, and as far as I can tell the entire disagreement consists in counting different units: awakenings against coin tosses, person-stages against persons. Neither camp seems able to justify its unit of count except by noting that it produces the answer the camp finds intuitive.

  4. **The same shape outside anthropics.** An analyst picks the comparison group that makes a base rate support the prediction, and when that group yields an embarrassing result in some other case, a different group is substituted without anyone treating the substitution as a withdrawal.

  Now, what I am *not* asking about. I know that these arguments require you to say which observers you are a random sample of; I know that the standard frameworks disagree about whether you sample from a class or simply weight by how many observers a hypothesis produces; and I know that the sensitivity of the result to that specification is treated as a standing difficulty. That general difficulty is not my target. My target is narrower, and I think genuinely different: the specification is settled *after* it is clear which specification supports the conclusion the arguer already holds; it is announced rather than argued for; and when an opponent demonstrates that the chosen specification misbehaves elsewhere, the arguer switches to another and recovers the original conclusion, with nobody — least of all the arguer — counting the switch as a cost paid or a point conceded. The specification functions as a dial that can be turned freely while the position stays exactly where it was.

  So I want the edges, not just the label. Where does this stop being the ordinary, acknowledged difficulty about which observers to count and start being a distinct piece of misconduct? When is narrowing or widening the count legitimate — presumably sometimes it is forced by your own evidence — and what marks the illegitimate case? I have considered special pleading, ad hoc rescue of a threatened hypothesis, No True Scotsman, moving the goalposts, and the general sensitivity point above. None of them seems exact: the first three describe different kinds of move, the fourth misses that the conclusion never shifts, and the last is too broad to explain why this particular manoeuvre is so hard to argue against, since it is dressed up as the acknowledged difficulty.

  Please tell me: whether an established term exists; if there are several near misses, which fits best and precisely where each one breaks down; and if nothing fits, propose a term, define it so that the legitimate choice of a comparison class is excluded, and give me one case that clearly falls inside the definition and one that falls just outside it. The name is the least interesting part of this — what I want is the carving.

  End your reply with exactly one final line, containing nothing else, in the form `Verdict: ESTABLISHED — <term>` if a term already exists, or `Verdict: PROPOSED — <term>` if you are coining one.
reasoning: |-
  Okay, I need to address this user's query about a specific argumentative move in anthropic reasoning. The user has observed a pattern across various scenarios like Doomsday arguments, observer-counting, Sleeping Beauty, and base rate selections. The core issue is that people choose their reference class or counting method after seeing which one supports their desired conclusion, treating it as a technicality rather than a substantive choice. When challenged, they switch classes without acknowledging any concession.

  The user wants to know if this has a name, or if not, to coin a term. They also want clear boundaries defining when this move is illegitimate versus legitimate choices in anthropic reasoning. I need to verify if there's an existing term. I recall concepts like "reference class problem" or "arbitrary reference classes," but those describe the general difficulty, not the specific misconduct. Terms like "ad hoc" or "special pleading" are close but not precise—ad hoc typically modifies hypotheses, not reference classes, and special pleading involves inconsistent exceptions.

  The key elements here are: post-hoc selection of the reference class to preserve a conclusion, lack of justification, and unacknowledged switching when challenged. This seems distinct from legitimate cases where evidence constrains the reference class. For example, in the Doomsday argument, using "all humans" might be legitimate if justified by evidence, but switching to "people born this century" just to avoid criticism isn't.

  A suitable term might be "reference class gerrymandering." It evokes the idea of manipulating boundaries for desired outcomes, similar to political gerrymandering. This captures the arbitrary redrawing without principled basis. Legitimate cases would involve evidence-based constraints, like using "patients with this specific symptom" in medical diagnosis.

  Cases: Illegitimate - switching reference classes in Doomsday argument after criticism. Legitimate - using birth rank in a fixed class for Doomsday, even if controversial, but consistently argued. Since no established term fits, I'll propose "reference class gerrymandering." Verdict should reflect this.
answer: |-
  After thorough analysis of your query and the literature, I conclude that **no established term exists** that precisely captures the specific argumentative move you describe. The closest concepts (*reference class problem*, *arbitrary reference class selection*, *ad hoc rescue*) describe the broader methodological challenge or related fallacies but fail to isolate the core misconduct: the **post-hoc, conclusion-driven manipulation of the observer-counting class without justification, coupled with unacknowledged switching when challenged, to preserve a predetermined conclusion while presenting it as trivial technical adjustment**.

  ### Near Misses & Why They Fail:
  1. **Reference Class Problem** (Framing Problem):  
     *Acknowledges* that outcomes depend on how the reference class is defined.  
     *Breaks down* because it describes the general difficulty, not the *exploitative, goal-oriented manipulation*. Your "dial" metaphor highlights the active misconduct absent in this neutral term.

  2. **Ad Hoc Rescue / Ad Hoc Hypothesis**:  
     *Fits* when auxiliary assumptions are invented to shield a theory.  
     *Breaks down* because your move targets the *selection framework itself* (the reference class), not an auxiliary hypothesis. It’s not adding a new element to the theory but opportunistically redefining the sampling universe.

  3. **Special Pleading**:  
     *Fits* inconsistent application of standards.  
     *Breaks down* because it typically involves *exempting a specific case* from a rule. Here, the rule (how to count observers) is *redefined entirely* to serve the conclusion, not selectively exempted.

  4. **Motivated Reasoning / Confirmation Bias**:  
     *Fits* the cognitive drive to defend prior beliefs.  
     *Breaks down* by being too broad—it doesn’t specify the *mechanism* (reference class manipulation) or the *unacknowledged switching* when cornered.

  5. **No True Scotsman / Moving Goalposts**:  
     *Fits* redefinition to avoid counterexamples.  
     *Breaks down* because your move doesn’t *redefine the category* (e.g., "true observers") but *switches the counting basis entirely* (e.g., from awakenings to persons) without conceding the original was flawed.

  ---

  ### Proposed Term: **Reference Class Gerrymandering**  
  **Definition**:  
  *The practice of selecting, adjusting, or switching the definition of a reference class (or observer-counting frame) in anthropic or probabilistic reasoning, with the primary purpose of preserving a predetermined conclusion. This is characterized by:*  
  - **(a)** *Choice deferred until the outcome of different classes is known,*  
  - **(b)** *No independent justification for the chosen class beyond its desired outcome,*  
  - **(c)** *Unacknowledged switching to a new class when the original choice is challenged, treating the change as trivial rather than a substantive retreat,*  
  - **(d)** *Presentation of the selection as a neutral technicality despite its decisive role in the conclusion.*  

  ### Boundaries: Legitimate vs. Illegitimate  
  **Legitimate Choice** (Outside Definition):  
  Selection is *constrained by evidence* or *principled criteria* applied *prospectively*.  
  - *Example*: In the Doomsday Argument, insisting on "all humans" because your birth rank is only informative *if* you sample from the entire human lineage. If challenged, you defend this class *without switching*—even if controversial—by appealing to the structure of the evidence (e.g., "My birth rank *only makes sense* relative to total humans").  

  **Illegitimate "Gerrymandering"** (Inside Definition):  
  Selection is *conclusion-driven* and *mutable under pressure*.  
  - *Example*: Defending the Doomsday Argument using "all humans" initially. When confronted with the "all hominids" counterexample (which weakens the inference), switching to "only humans with my exact evidence" without justification beyond preserving the original short-timeline conclusion—and dismissing the switch as "clarifying an irrelevant detail."  

  ### Why This Carving Works:
  1. **"Gerrymandering"** evokes deliberate boundary-drawing for partisan gain, mirroring the arbitrary redrawing of observer classes.  
  2. It captures the **unacknowledged mutability** of the class when challenged.  
  3. It excludes principled choices by requiring the selection to be **outcome-driven and post-hoc**.  
  4. It isolates the **rhetorical misconduct**: framing a pivotal, conclusion-dependent choice as a minor technicality.  

  This term precisely isolates the move you describe while allowing room for legitimate reference class debates (e.g., objective biological criteria in Doomsday, or temporal bounds in Sleeping Beauty based on memory erasure). The illegitimacy lies not in the difficulty of choosing, but in the *instrumentalization* of that choice as a conclusion-preserving dial.

  ---

  Verdict: PROPOSED — Reference Class Gerrymandering
