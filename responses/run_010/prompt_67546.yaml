prompt: |-
  I'm in a decision-theory reading group and we've been going around in circles on Good's theorem about the value of information for the better part of two years, and at this point I'd rather have a diagnosis of the argument than another round of it. Please write in American English.

  Here's the shape of the dispute as I see it.

  Camp A's line: take an agent with a settled set of acts, a credence function over states, who conditionalizes on what she learns and doesn't forget it. Then a costless observation can never lower her expected utility, because in the worst case she just does what she'd have done anyway. The ignore-it move makes the result practically free, so what's left of "information can hurt you" is really about price, or about sloppy updating, or about weakness of will. On this view the interesting cases are engineering problems, not counterexamples.

  Camp B keeps producing cases they think break it, and their general complaint is that the ignore-it move quietly assumes the agent can still perform the act she'd have performed uninformed — which is exactly what's in doubt, becuase either her tastes have shifted, or the act is off the table now that other people condition on the fact that she knows, or she can't stop herself acting on what she's seen. The three they lean on hardest:

  1. A parent weighing a predictive test for an untreatable late-onset condition in her kid. A positive result changes no medical decision but changes how she experiences every birthday for thirty years. Camp A absorbs this by making the parent's own beliefs part of the consequence space — belief-dependent utility, so nothing is violated. Camp B says that absorption is the whole problem.
  2. A hiring committee that scores candidates after seeing their names. More information can't hurt them if the goal is picking the best player, but the institution blinds the review anyway, not because names are costly but because the reviewers can't be trusted to conditionalize on names the way the institution wants. Camp A calls this a principal-agent problem in decision-theory clothing; Camp B calls it a case where "the agent's expected utility" is the wrong thing to be maximizing and the theorem is answering a question nobody asked.
  3. A prosecutor who declines a cheap DNA test, or a buyer who skips the inspection, because a deal is alive only while both sides are uninformed. Learning is free but being known-to-have-learned isn't.

  My own hypothesis, which I want you to attack rather than accept: this isn't really a disagreement about whether information can make someone worse off. It's a disagreement about which object gets held fixed across the learning event — a snapshot problem with a frozen act set and a conditionalizing updater, where Camp A is right and nearly trivially so, versus an extended situation where the act set, the tastes, the other players' strategies, or whose utility counts are all moving, where the theorem simply doesn't get a grip. And a good chunk of it may be verbal, since economists mean a willingness-to-pay number by "value of information," philosophers mean a requirement to gather your total evidence, and the ML people in my group mean instrumental usefulness for hitting a fixed goal, and all three camps are talking past each other under one label.

  What I want from you:

  - Tell me whether that's the right diagnosis, a wrong one, or only half of it. Is this substantive, verbal, two questions sharing a name, a hidden formal question doing all the work, or an ill-posed question? Argue for your reading using what each camp actually says, not using generalities about how decision theory is complicated.
  - Engage seriously with the absorption worry in case 1. Camp A can always enlarge the state space, endogenize the preference change, or bring in Kreps–Porteus-style preferences over when uncertainty resolves rather than what it resolves to. If literally any apparent counterexample can be re-modeled until the theorem applies again, is the theorem unfalsifiable and therefore empty? Or is there a principled line between legitimate re-modeling and a dodge — some constraint on what counts as the same decision problem — and if so, state it.
  - Say whether there's a case, or a kind of case, that would force Camp A to actually concede something rather than re-describe, and if there isn't, say that plainly.
  - Then tell me what would count as progress given your diagnosis: a theorem, a distinction, a change of question, a piece of data, or nothing at all — and if nothing, explain why the argument kept feeling substantive to everyone in the room even so.

  Don't send me a bibliography, a reading list, or names-and-dates of papers — I'm offline and can't check any of it. I want the reasoning, and I want you to commit to a diagnosis instead of hedging across all of them.
reasoning: |-
  Okay, the user is in a decision-theory reading group stuck on Good's theorem for two years. They've outlined two camps: Camp A says information can't hurt if it's free and you can ignore it, while Camp B provides cases where it seems to. The user wants a clear diagnosis without hedging.

  First, I need to unpack their hypothesis. They think the disagreement is about what's held fixed during learning. Camp A freezes acts and updates credences, so information can't hurt. Camp B allows changes in acts, preferences, or context. The user wants me to argue if this is correct.

  Looking at the three cases: 
  1. Parent testing for untreatable disease. Belief-dependent utility lets Camp A absorb this by expanding states. But Camp B says that's dodging the real issue—the experience change.
  2. Hiring committee blinding names. Camp A calls it principal-agent; Camp B says maximizing agent's utility isn't the institution's goal.
  3. Prosecutor skipping DNA test because the deal collapses if information is known. Here, learning isn't the problem; the aftermath of being known to have learned is.

  The user's hypothesis seems strong. The key is what's exogenous vs. endogenous. Good's theorem assumes stable acts, utilities, and no external changes from learning. Camp B's cases violate these by making utility depend on beliefs, acts unavailable post-learning, or strategic responses.

  On the absorption worry: Expanding state spaces can make the theorem unfalsifiable if done arbitrarily. But there's a principled line: legitimate modeling requires that acts remain feasible and utilities depend only on states and acts, not on the learning process itself. In the parent's case, if the utility change isn't due to the state but the belief, that's a preference change, which violates the fixed utility assumption. Kreps-Porteus preferences might handle this, but that's a different model, not a refutation.

  Is there a case Camp A can't redescribe? Maybe one where learning physically alters the world, making the original act impossible. For example, a device that explodes if a sensor is read. Here, the act set changes because reading the sensor destroys the option to not read. But even then, Camp A might say the initial decision includes whether to trigger the sensor. The theorem applies to the choice to learn or not. If learning causes physical changes, it's not costless.

  Progress might come from distinguishing the scope of Good's theorem: it applies when all else is fixed. Cases where learning changes the game are outside its scope. Clarifying that the value of information depends on the stability of the decision context. For the group, agreeing on what "costless" means and what's held fixed could help. If they want a broader view, they might explore models where preferences are belief-dependent or learning triggers changes, but that's beyond Good's theorem.

  The user might be frustrated with repeated re-descriptions. They need a way to move forward by accepting the theorem's limits. The substantive issue is whether decision theory should account for endogenous changes caused by learning, which Good doesn't. Recognizing that could resolve the stalemate.
answer: |-
  Your diagnosis is **90% correct and captures the core issue**, but misses one subtlety about strategic information transmission. Let's break this down with surgical precision, using the camps' own arguments.

  ### 1. Your Diagnosis: Mostly Right, With One Strategic Twist
  - **Where you nailed it**: This is fundamentally about **what gets held fixed** during the learning event. Camp A's "ignore-it move" requires:
    - A fixed menu of physical acts (e.g., "hire candidate X," "don't test the child").
    - Stable utility functions (preferences over outcomes don't shift with beliefs).
    - No causal feedback from learning to the decision environment (e.g., others don't react to your knowledge state).
    
    Camp B's counterexamples violate these by making utility belief-dependent (Case 1), changing feasible acts post-learning (Case 3), or introducing principal-agent conflicts (Case 2). **Good's theorem is airtight in the frozen snapshot**—it’s practically tautological given its assumptions. Camp B’s cases aren’t counterexamples; they’re **violations of the premises**. 

  - **The 10% you missed**: In Case 3 (prosecutor/buyer), Camp B’s real objection isn’t just that acts change—it’s that **information revelation is endogenous to the act of learning**. When the prosecutor *considers* taking the DNA test, the *mere possibility of future learning* collapses the plea deal. Good’s theorem treats "learning" as a private, passive receipt of data. But if learning forces public disclosure (or others anticipate it), the "costless observation" assumption fails. This is a hidden **signaling problem**, not a flaw in Good’s math. Camp A would (and should) call this a "price" of information disclosure, but Camp B rightly notes that pure "observation" often isn’t isolatable from its social consequences.

  ### 2. The Absorption Worry: Legitimate Modeling vs. Dodge
  - **Camp A’s moves** (expanding state space, Kreps-Porteus) **aren’t cheating—but they expose the theorem’s limits**. Take Case 1 (parent testing for untreatable disease):
    - Legitimate move: If the parent’s anguish is *caused by the child’s actual disease state* (even if unknown), you can expand the state space to include "parent’s belief about disease" and define utility over composite states (e.g., "healthy child + parent believes healthy"). Good’s theorem holds: *Given this expanded setup*, learning never hurts.
    - Dodge: If the parent’s suffering stems purely from *believing* the child is sick (regardless of truth), Kreps-Porteus can "solve" it by making utility depend on beliefs. But this **changes the utility function**, violating Good’s assumption that utility is state-dependent. You’ve redefined the problem.

  - **The principled line**: Absorption is legitimate **iff** the utility function depends *only* on states of the world and acts (not on the learning process itself). If "happiness" requires *ignorance* as a direct input (e.g., "blissful delusion"), Good’s framework breaks. Kreps-Porteus isn’t a dodge—it’s a different model for preference structures where *when* you learn matters. But Camp B is right: Forcing every problem into Good’s mold can obscure the phenomenon (e.g., "beliefs as direct utility generators").

  - **Is the theorem unfalsifiable? Yes, within its domain**—and that’s the point. Good’s theorem is a **conditional truth**: *If* you fix acts, utilities, and no learning externalities, *then* learning weakly helps. Camp B’s cases falsify the antecedent, not the conclusion. This doesn’t make it "empty"; it clarifies its scope. The fight is over whether real decisions fit the snapshot.

  ### 3. Cases That Force Camp A to Concede (Sort Of)
  - **No case forces Camp A to concede Good’s theorem is wrong**. It’s mathematically unimpeachable under its assumptions. But **Camp A must concede irrelevance** when:
    - **Acts become infeasible post-learning**: E.g., in Case 3, if "offer plea deal" evaporates the *instant* the prosecutor learns the DNA result (say, due to a legal trigger), the "ignore-it move" fails. Camp A can still say, "But the initial choice included *whether to learn*," but this reframes the decision—it doesn’t save the theorem’s application *after* learning occurs.
    - **Utility depends intrinsically on the learning event**: E.g., a "curiosity averse" agent who pays to *avoid* knowing their genetic disease risk because knowing *itself* causes distress, even if medically irrelevant. Camp A can Kreps-Porteus this, but at the cost of admitting the original utility function wasn’t state-dependent.
    - **Strategic disclosure is unavoidable**: If taking the DNA test *automatically* alerts the defense (via subpoena), "costless observation" is impossible. Camp A must move to a game-theoretic model.

  Camp A’s retreat is always to **redraw the decision boundary**, making "whether to learn" part of the initial act. That’s valid—but it sidesteps whether Good’s result applies *after* new information arrives, which is what Camp B cares about.

  ### 4. What Counts as Progress
  - **Stop refighting the theorem**. It’s not broken. Progress requires:
    - **A crisp distinction**: Formally separate **Good-Information** (costless, private, snapshot-compliant) from **Real-Information** (potentially belief-utility-altering, act-constraining, or socially embedded).
    - **Two questions, explicitly divided**:
      1. "Does Good-Information ever hurt under Bayesian updating?" → *No, and here’s why* (Camp A’s win).
      2. "Can Real-Information hurt?" → *Obviously yes, and here’s how* (Camp B’s win). Focus energy here.
    - **A shift in focus**: For cases like 1-3, ask: "What *causes* the shift in acts/utilities post-learning?" Model that mechanism directly (e.g., signaling games for Case 3, belief-dependent utility for Case 1, incentive design for Case 2).
    
  - **Why it feels substantive**: You’re wrestling with **whether decision theory should describe idealized agents or guide messy humans**. Camp A sees DT as a normative benchmark for rational agents; Camp B sees it as a tool for real institutions. Good’s theorem is a Rorschach test for this divide. Resolve the meta-dispute, and the circles stop.

  **Bottom line**: Your diagnosis is essentially correct—this is about frozen vs. dynamic contexts. Camp A wins on math, Camp B on phenomenology. Progress means demarcating their domains, not forcing one frame onto the other. Stop asking if information *can* hurt; ask *when* and *why* it does in practice, and build models that capture those dynamics. That’s where the insight lies.
