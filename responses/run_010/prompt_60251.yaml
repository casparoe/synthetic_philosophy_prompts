  The technical requirements are stringent: accurate depiction of Bennett's resolution (memory erasure cost), exclusion of Brillouin's measurement dissipation argument, precise handling of kT ln 2, and physical grounding of the trapdoor mechanism. The double meanings of "fast" (swift/fixed) and "heat" (technical/colloquial) need careful deployment. 

