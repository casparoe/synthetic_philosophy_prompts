  In the note, I'll flag two liberties: 1) simplifying Szilard's engine to one molecule (though common in pedagogy), 2) implying perfect trapdoor closure (real mechanisms would have leakage). Suppressed Smoluchowski-Feynman ratchet discussions to maintain focus. Least confident about the "jostled door" line - while Brownian motion would affect it, quantifying that disturbance would break the form.

