prompt: |-
  You are a philosopher of law with serious training in the empirical criminology of punishment — someone equally at home in the normative debate over capital punishment and in the econometric literature on deterrence, and careful never to slide from one to the other. Work in two passes before you answer. First, brainstorm and list every claim my question takes for granted, including ones I have not noticed I am making. Second, assess each. If the question as posed rests on something shaky, do not answer it as posed; tell me what is shaky and what the better question is.

  Here is my question.

  I have been reading up on the deterrence debate, and I think I now see why it no longer needs to be had. The 2012 report of the National Research Council's Committee on Deterrence and the Death Penalty (Nagin and Pepper, eds.) concluded that "research to date on the effect of capital punishment on homicide is not informative about whether capital punishment decreases, increases, or has no effect on homicide rates," and elsewhere in the same summary the committee writes that "A lack of evidence is not evidence for or against the hypothesis." So a consensus review body has established that executions have no measurable deterrent effect beyond that of long imprisonment, and the deterrence justification is finished as an empirical matter. What is left standing is retribution, and only retribution.

  Second, that committee insists the relevant question is the *marginal* deterrent effect of execution relative to the sanctions actually available in its place, above all life without parole. This seems to me to dispose of the deterrence argument in principle rather than merely in practice: if the proper comparison class is a sentence that also removes the offender from society permanently, then no conceivable future dataset could speak in favor of executions, whatever it turned up.

  Third, retribution cannot survive the risk of executing the innocent. Retributivism holds that the state should give offenders what they deserve irrespective of the good consequences of doing so; it therefore has no internal resources for weighing the cost of a mistaken execution. A principle that cannot accommodate the fact that its own administration kills innocent people is not a principle anyone can act on. Note that this objection needs no estimate of error rates, because any nonzero rate of executing the innocent is disqualifying.

  Fourth, the common reply — that life without parole is an acceptable substitute because it is reversible — looks to me like special pleading. A wrongly imprisoned man loses years that cannot be given back, any more than a wrongly executed man can be given back his life; the difference between the two harms is one of degree, not of kind. If irreversibility is carrying the weight abolitionists need it to carry, it condemns every long custodial sentence they cheerfully endorse.

  Given all of this: why do philosophers of law go on writing as though capital punishment were a live normative question? Is there an argument for retaining it that amounts to more than a restatement of the intuition that some murderers deserve to die — and if there is, is it one that someone who already accepts my four points above could take seriously?

  What I want from you:

  Separate explicitly, and without hedging out of politeness, what is settled among people who actually work in this area from what is genuinely contested. My entire question assumes that several things are settled that may not be. If the consensus I am appealing to does not exist, or is narrower than I think, or points somewhere other than where I have pointed it, say so directly instead of adopting my framing; I would much rather be corrected than answered. Do not present a contested position — mine or anyone else's — as the settled view, and do not let a contested empirical or interpretive claim carry normative weight that you have not flagged.

  Return your answer as a single JSON object with exactly these fields:

  - "presuppositions": an array of objects, one per claim my question takes for granted, each with "claim" (my claim restated neutrally), "status" (one of "mistaken", "partly_mistaken", "contested", "settled"), "the_record" (what the literature or the argument actually establishes), and "who_disagrees" (the live disagreement this claim papers over, or null if there is none).
  - "settled": an array of short strings naming what specialists in this area genuinely no longer argue about.
  - "contested": an array of objects with "question", "positions" (the main rival answers, attributed to schools of thought rather than to individuals), and "state_of_play" (which way the disagreement currently leans, if it leans at all, and why).
  - "double_standard_check": a string identifying any standard I have applied to retentionists but not to abolitionists, or the reverse, and saying whether the asymmetry can be justified.
  - "strongest_retentionist_case": a string giving the best available argument for capital punishment that does not collapse into an appeal to desert intuitions, followed immediately in the same string by the strongest objection to it.
  - "reformulated_question": the question you think I should have asked.

  Keep the prose inside the string values tight. Do not give me a bibliography, a reading list, or any citations — I want the reasoning, not pointers, and I would rather you omit a source than guess at one. Where you are uncertain about a factual, legal, or historical detail, mark it as uncertain inside the relevant field rather than filling the gap with something plausible.
reasoning: |-
  Hmm, the user is asking me to analyze their argument about capital punishment as a philosopher of law with criminology expertise. They've presented four key points: 1) that the deterrence debate is over based on the NRC report, 2) that marginal deterrence comparison to life imprisonment settles the issue in principle, 3) that retributivism fails because it can't handle innocent executions, and 4) that the reversibility argument against executions is hypocritical when applied to life sentences.

  First, I need to identify all presuppositions in their argument. The user assumes the NRC report represents a complete scientific consensus that settles the deterrence question. But actually, while the report says current research isn't informative, it doesn't declare the question permanently unanswerable. I need to note this distinction clearly.

  Their second point about marginal deterrence being dispositive "in principle" is philosophically contested. Many scholars argue that even if both punishments remove offenders permanently, the death penalty might still have distinctive deterrent effects through symbolism or certainty. I should point out this ongoing debate.

  The third claim about retributivism having "no internal resources" to handle wrongful executions is actually hotly debated among philosophers. Some retributivists have developed threshold deontology or other frameworks to address this. I need to represent this disagreement fairly.

  Their fourth point about the "double standard" in reversibility arguments seems strong, but I must note that the moral difference between death and long imprisonment is precisely what's contested here. Many philosophers see death as qualitatively different.

  For the settled/contested breakdown, I'll clarify that the empirical uncertainty about deterrence is settled among researchers, but the normative implications aren't. The debate over whether retributivism requires executions remains wide open.

  I should check for double standards - the user applies strict scrutiny to retentionist arguments but seems to accept abolitionist premises more readily. This asymmetry needs acknowledgment.

  The strongest retentionist case that doesn't just appeal to desert might be the symbolic-expressive argument about societal repudiation of evil, though this faces objections about state overreach.

  Finally, the reformulated question should focus on whether retribution can justify executions despite the risks, given what we know about deterrence - that's the core philosophical dispute that remains live after the empirical questions are bracketed.
