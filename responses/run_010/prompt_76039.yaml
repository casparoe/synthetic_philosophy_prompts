prompt: |-
  I am about to spend three years as the sole philosopher embedded in a small quantitative-methods unit at a national infrastructure regulator. The unit must decide, on a recurring basis, which of several competing long-horizon simulation models — sea-level and flood-risk projections over fifty- to hundred-year horizons — its permitting and investment decisions should rest on, and it must be able to defend that choice in audit and in litigation. Every candidate is known to be false, and the horizon is too long for the decision to be settled by outcomes arriving within it.

  The unit's current proposal is to construct an explicit verisimilitude score: define closeness to the truth formally, estimate each candidate's expected closeness relative to present evidence, and rank. The estimator in view is a convergence proxy — roughly, expected agreement with whatever model turns out to be best eventually, approximated by agreement with an evidence-weighted ensemble of the present candidates. A reviewer has raised two objections: that the proxy rewards correlated error and scores each model partly by its similarity to the very things being scored, and that the certification requirement pushes toward a single scalar even where the underlying ordering is only partial.

  I want help designing an agenda, not a survey of the field. Which open questions in the theory of verisimilitude should the unit treat as load-bearing over the next three years, and in what order? For each question you prioritize, give me the reasoning: how much of the design turns on its answer; whether it is tractable for one person working formally — proof-theoretic and measure-theoretic tools, no new field data; how neglected it is relative to how much existing practice silently assumes it is already settled; and what a resolution would concretely change about the score.

  Consider at least the following candidates, and add any you judge more important than these: whether truthlikeness should be a scalar or a partial order, and what a decision procedure looks like when the ordering fails to rank precisely the contested pairs; parameterization- and language-dependence, i.e. whether such a measure can be made invariant under re-expression of the same physical content; how to extend accounts built for deductively closed sets of sentences to candidates that are probability distributions rather than sentence sets, and what that has to do with proper scoring rules; the epistemic problem — whether "estimated" verisimilitude relative to available evidence is stable or simply reinstates the uncertainty it was supposed to resolve; whether Arrow-style impossibility results, showing that familiar desiderata cannot be jointly satisfied in richly structured domains, force the unit to give up one of its desiderata, and which one; and how deliberate idealizations, present in every candidate, should figure in closeness to the truth.

  Then tell me which of these to deprioritize — where settling the question would leave the design unchanged — and what kinds of arguments or results over the next two or three years would move an item up or down your ordering. Be explicit about the trade-off you are striking between upstream importance and tractability for a single person on a three-year clock, and say what the criteria for your ranking are rather than just presenting the ranking. I am not asking for references, a bibliography, or a reading list; describe positions and results by their content and argue from there.
reasoning: |-
  Okay, the user is a philosopher embedded in a quantitative methods unit at a national infrastructure regulator. They need to decide which long-term simulation models to use for sea-level and flood-risk projections over 50-100 year horizons. The challenge is that all models are known to be false, and outcomes won't be verifiable within the time frame. The unit proposes a verisimilitude score, but a reviewer has raised objections about correlated errors and the scalar approach.

  First, I need to understand the core issues. The user wants an agenda, not a literature survey. They listed specific candidates: scalar vs partial order, parameterization dependence, extending to probability distributions, epistemic stability, Arrow-style impossibilities, and handling idealizations. I should prioritize based on how much each affects the design, tractability for one person with formal tools, neglect in current practice, and what changes a resolution would bring.

  Starting with the scalar vs partial order question. This is critical because the certification requires a single score, but reality might only support partial ordering. If they can't rank some pairs, forcing a scalar might be indefensible. This affects the design fundamentally. It's tractable with formal tools since it involves order theory and decision theory. Current practice assumes scalar scores are possible, but that's not settled. Resolving this could mean accepting incomplete rankings or using dominance criteria.

  Next, parameterization and language dependence. If the score changes with how the model is expressed, that's a problem for objectivity. They need invariance under re-parameterization. This is highly technical but doable with measure theory and information geometry. Existing methods often ignore this, assuming their metrics are invariant. Solving this could ensure the score isn't arbitrary, making it more defensible in litigation.

  Extending verisimilitude to probability distributions is another priority. The models are likely probabilistic, so moving from deductive systems to distributions is necessary. Proper scoring rules might help here. This is tractable with statistical decision theory. Current practice might mishandle probabilistic models, so resolving this would integrate scoring rules with truthlikeness, improving accuracy assessments.

  Epistemic stability is about whether estimated verisimilitude resolves uncertainty or adds more. If the estimate is unstable, it doesn't help. This might be less critical initially since the unit knows the models are false. It's tractable but might not change the design immediately. They can use Bayesian methods to mitigate instability.

  Arrow-style impossibilities might show that desirable properties can't coexist. However, this is more abstract and might not directly impact their specific case. If their domain isn't structured enough, it might not apply. This could be deprioritized unless evidence shows conflicts in their criteria.

  Handling idealizations: models simplify reality intentionally. Should closeness penalize these? If not, how to account for useful falsehoods? This is important but might be addressed after the structural issues. It's tractable with decision theory, focusing on model purpose. Resolving this would adjust how scores account for necessary simplifications.

  Prioritizing: Scalar vs partial order first because it's foundational. Then parameterization invariance to avoid arbitrariness. Then extending to distributions since models are probabilistic. Idealizations next for applicability. Epistemic stability and Arrow's theorem later as they might not change the core design.

  Trade-offs: Upstream importance vs tractability. Starting with structural issues that could invalidate the approach. Using formal tools to handle invariance and distributions. Deprioritizing theoretical impossibilities unless evidence shows conflicts. The user needs defensible decisions for litigation, so objectivity and robustness are key. The agenda should build from ensuring the score's validity to practical adjustments.
answer: |-
  Here's a prioritized agenda for your 3-year focus, designed for maximum defensibility under litigation/audit constraints, balancing upstream importance, tractability, and neglect in practice. The ranking criteria are:  
  1. **Design Criticality**: How much the question threatens the *entire viability* of the proposed score if unresolved.  
  2. **Tractability**: Amenable to formal (proof/measure-theoretic) progress by one person without new data.  
  3. **Neglect-to-Assumption Gap**: How much existing practice implicitly assumes a solution while the literature is stuck.  
  4. **Concrete Impact**: How a resolution would change the score's structure or justification.  

  ---

  ### **Top Priority: The Three Load-Bearing Questions**  
  1. **Parameterization- and Language-Dependence**  
     - **Why Critical**: If your score changes under mathematically equivalent model re-expressions (e.g., log-transforming sea-level variables), it is arbitrary and legally indefensible. The entire project collapses.  
     - **Tractability**: High. Work lies in measure-theoretic invariance (e.g., ensuring densities use the same dominating measure) or differential-geometric approaches (Fisher information as a metric). Focus on *practically relevant* transformations in climate models.  
     - **Neglect**: Severe. Most verisimilitude metrics (e.g., Brier score) assume a fixed parameterization. Practitioners ignore this fragility.  
     - **Impact**: Resolution forces either:  
       (a) A canonical model language (implausible), or  
       (b) An invariant geometric framework (e.g., Wasserstein distance between distributions).  
     - **Milestone**: By Year 1, prove whether convergence proxies are invariant under standard climate-variable transformations.  

  2. **Extending Verisimilitude to Probability Distributions**  
     - **Why Critical**: Your candidates are *stochastic simulators*, not deductive theories. Deductive verisimilitude (e.g., Popper) fails here.  
     - **Tractability**: High. Leverage statistical decision theory. Key insight: Proper scoring rules (e.g., log score) *are* truth-directed but measure *accuracy*, not *truthlikeness* for false models. Bridge via "divergence from ideal" (e.g., KL divergence to true distribution).  
     - **Neglect**: Acute. Philosophical work focuses on deterministic theories; quantitative fields use scoring rules without justifying them for verisimilitude.  
     - **Impact**: Replaces the "convergence proxy" with a rigorous divergence-based metric. E.g., replace ensemble agreement with expected KL divergence to a Bayesian nonparametric posterior.  
     - **Milestone**: By Year 2, formalize a divergence-based verisimilitude for probabilistic models that satisfies dominance (if A is closer than B in all dimensions, rank A higher).  

  3. **Scalar vs. Partial Order**  
     - **Why Critical**: Certification demands a single ranking, but reality may only support partial orders (e.g., Model A better at storm surges, B at tidal variations). Forcing a scalar invites legal challenge.  
     - **Tractability**: Moderate. Use lattice theory or Pareto dominance. Define a decision rule for incomplete orders (e.g., "admissible set" ranking).  
     - **Neglect**: High. Regulatory practice assumes total orders exist; philosophy debates incomparability but offers few decision procedures.  
     - **Impact**: If partial orders are unavoidable, you need:  
       (a) A dominance criterion (accept models non-dominated in key dimensions),  
       (b) A tie-breaking rule (e.g., minimax regret), and  
       (c) Documentation justifying incomparability claims.  
     - **Milestone**: By Year 1.5, identify which model pairs are *provably incomparable* under your evidence.  

  ---

  ### **Secondary Priority: Necessary but Less Immediate**  
  4. **Deliberate Idealizations**  
     - **Why Important**: Models simplify intentionally (e.g., ignoring tectonic shifts in sea-level models). Should "closeness" penalize this?  
     - **Tractability**: Moderate. Formalize as a trade-off: Idealizations increase *pragmatic utility* but decrease *structural accuracy*. Use cost-benefit analysis within scoring.  
     - **Impact**: Adjusts scores by weighting "critical omissions" (e.g., penalizing models ignoring ice-sheet dynamics).  
     - **Timing**: Post-Year 2, once core metrics exist.  

  ---

  ### **Deprioritize: Intractable or Non-Critical for Design**  
  5. **Epistemic Stability**  
     - **Why Deprioritize**: "Estimated" verisimilitude will *always* be unstable with limited evidence—this is inherent to long horizons. Stability is a red herring; your score is inherently Bayesian.  
     - **Resolution Impact**: Minimal. You already know estimates are uncertain; robustness checks (e.g., sensitivity to priors) matter more than theoretical stability.  
     - **Action**: Monitor via sensitivity analysis, not foundational work.  

  6. **Arrow-Style Impossibilities**  
     - **Why Deprioritize**: Arrow’s theorem applies to aggregating *preferences*, not model comparisons. Your problem is closer to *model selection* (e.g., AIC) where no such impossibility exists.  
     - **Risk**: If forced, drop "independence of irrelevant alternatives" (your ensemble already violates this).  
     - **Action**: Ignore unless specific conflicts arise in practice.  

  ---

  ### **Agenda Rationale & Trade-Offs**  
  - **Trade-Off Struck**: Prioritizing **structural defensibility** (parameters, distributions, ordering) over epistemic elegance. Parameterization and distributional foundations threaten the whole enterprise and are tractable with formal tools. Partial orders are urgent due to litigation risk.  
  - **Why Not Epistemic/Idealization First?**: Without invariant metrics and a probabilistic foundation, refining how to score "closeness" is premature.  
  - **Adjustment Triggers**:  
    - **Upgrade** "Idealizations" if core metrics penalize useful simplifications (e.g., a coarse grid that speeds computation).  
    - **Upgrade** "Epistemic Stability" if audits reveal excessive sensitivity to minor evidence shifts.  
    - **Downgrade** "Partial Orders" if dominance relations cover all contested pairs.  

  ### **Concrete Three-Year Workflow**  
  - **Year 1**: Solve parameterization invariance (build geometric framework) and formalize partial-order decision rules.  
  - **Year 2**: Define distributional verisimilitude via divergences, integrating proper scoring rules. Test on toy models.  
  - **Year 3**: Incorporate idealizations and stress-test full system under evidence uncertainty.  

  This agenda ensures that by Year 3, your verisimilitude score rests on non-arbitrary, probabilistic foundations with explicit rules for incomparability—making it auditable even if controversial.
