  The user raises a compelling dilemma: either Pettit's theory must classify Sweden's reactivation as non-arbitrary (thus collapsing back to interference metrics), or it must rank Sweden's system as worse than Finland's (which seems counterintuitive). This is a sophisticated philosophical puzzle.

