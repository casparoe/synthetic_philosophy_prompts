answer: |-
  Here are sharp critical comments addressing your specific questions, with the strongest unstated objection at the end:

  ### 1. On "obligation in abeyance" as a distinct category:
     - **Failure of carving:** Your category risks being a repackaging of *pre-existing legal powers* + *conditional obligations*. The "unilateral activation" feature isn’t novel; it’s inherent in any state power retained under statute (e.g., emergency economic controls). The work you assign to "abeyance" is already done by Pettit’s core idea: **non-actualized arbitrariness**. Calling it a new *type* of obligation adds little.
     - **Where it fails:** It collapses under scrutiny of *degrees of constraint*. Sweden’s activation required published criteria and political ratification. If "abeyance" requires total unilateralism (no constraints), it doesn’t fit Sweden; if it allows constraints, it dissolves into ordinary conditional duties. The concept’s distinction from "legal power to legislate" is also thin: both rely on prior democratic authorization.

  ### 2. The Pettit dilemma holds, but a republican reply exists:
     - **Your framing is correct:** Pettit *would* likely deny domination in Sweden’s case because activation tracked public reasons and interests (security threat + democratic process). This *does* collapse non-domination into procedural legitimacy, undermining your use of it.
     - **Plausible republican reply:** Focus on **ex ante vulnerability**, not just activation. The *dormancy itself* creates a structural asymmetry: citizens cannot contest the *continued existence* of the power, only its exercise. The state’s unilaterally defined "conditions" (e.g., "security environment") render the duty arbitrary *in potentia*. The right comparison is **Sweden-in-2016 vs. a state without dormant conscription** – the former live under a sword of Damocles the latter do not.

  ### 3. Swiss exemption tax: Counterexample to inalienability?
     - **It is a counterexample, but with limits:** The tax *is* functionally a price, violating the intuition that service is "beyond commodification." However, it’s not a *pure* counterexample:
       - Unfit individuals pay without having a service option, making it a *penalty* rather than a price *for them*.
       - The tax is framed as compensating society for non-participation (like a Pigouvian tax), not as purchasing a moral waiver. This preserves symbolic inalienability: "You owe service; if physically unable, you owe equivalent support."
     - **Your framing underplays this nuance:** The tax isn’t a simple market exchange. It’s a hybrid – a price for the *able-bodied who choose not to serve*, but a compensatory duty for others.

  ### 4. Institutional facts: Mostly correct but needing updates/caveats:
     - **Sweden:** Correct that reactivation (2017) required no new legislation. *Update:* Conscription has since been expanded (gender-neutral since 2018, larger intakes). The "4,000/year" post-2017 is accurate for initial years but rising.
     - **Switzerland:** Exemption tax (*Wehrpflichtersatz*) is still 3% of taxable income (min. CHF 400/year) for men up to age 37. Civil protection service *does* offset it. *Caveat:* "Unfit" pay reduced rates or nothing (medical exemption).
     - **Finland:** Still universal for men. *Caveat:* Civilian service is now 347 days (equalized with military in 2023). Penalties for refusal remain.
     - **No major errors, but cite sources for reactivation mechanics (e.g., Swedish Govt. Bill 2016/17:4).**

  ### 5. Strongest unstated objection & its impact:
     - **Objection: "Abeyance" confuses legal possibility with domination. Domination requires *reasonable fear*, not mere abstract power.**  
       Pettit requires that arbitrary power be *actionable* and *perceived as a threat*. A dormant draft with high activation barriers (political scrutiny, published criteria) may not generate genuine fear. Citizens in 2016 Sweden likely saw reactivation as improbable until the security shift – unlike a landlord's immediate right of entry. Your analogy to suspended sentences fails: those involve *individualized* judicial threats, while dormant conscription is a *systemic, impersonal* power requiring collective political action to trigger.
     - **Can the paper absorb it? Partially, but restructuring is needed.**  
       You must engage the **credibility threshold** for domination. Argue that even low-probability state powers, if unilateral and constitutionally entrenched, create a *baseline vulnerability* that republican freedom rejects. Emphasize that the *mere existence* of the power alters citizen-state relations (e.g., discouraging career choices). This shifts focus from "fear" to **structural subordination**. Without this, the objection fatally weakens the Swedish case.

  **Critical Summary:** Your core insight (dormant conscription as normatively distinct) is valuable, but "obligation in abeyance" is under-theorized. The paper’s stakes hinge on convincing republicans that *non-arbitrary but unilaterally activatable powers* are dominating *ex ante*. The strongest path is refining the structural vulnerability argument against the "reasonable fear" objection. Drop or radically reconceive the category "abeyance"; lean harder on Pettit’s existing framework of *arbitrary capacity*.
