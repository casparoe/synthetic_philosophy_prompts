  For question 2, the Pettit dilemma appears robust. The republican might respond by focusing on the unpredictability of activation rather than the process itself, but the user has preempted this by noting Sweden's constrained reactivation process. Comparing different time periods in the same country might strengthen their case.

  Regarding question 3, the Swiss model is indeed challenging to the inalienability intuition. The exemption tax functions as a price for some, but not for those medically unfit - this nuance needs addressing.

