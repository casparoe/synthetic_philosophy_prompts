  4. The disavowal gap: the moment when the agent got the behavior right but the human disavowed. What does it mean to get it right? Is the human's rating the right test?
     - Then introduce the name: disavowal gap.
  5. The harder question: in Round 3, the human acted on a preference (punk) but then disavowed it. Which preference is real? The one acted upon or the one endorsed?

  ### Predictable Problems

  1. **Someone hoards the candy**: We give candy at the end of the debrief, not during, to avoid distraction.
  2. **Someone breaks character**: The human might not follow the card. Solution: pick reliable students or have a backup. Or remind them it's a game and they must follow the card for the activity to work.
  3. **Someone reads the card off the human's face**: The human should keep a poker face. Instruct them not to react.
  4. **One group finishes early**: We have observers write their guesses during the choice phase? Or we have structured time. We can have the instructor strictly time each step.

  ### What the game cannot reproduce

  - A real system infers from thousands of people at once (we do one human at a time).
  - A real system cannot ask (we allow the agent to observe a lot and we have a small set of options, but we don't allow interrogation, so that's similar).
  - The scale and the fact that real systems use statistical patterns over many people, which might miss individual shifts.

  ### Final Adjustments

  For Round 3, we want the philosophical question. We have it.

  We might not have time for three rounds? 20 min per round is tight. We can do two rounds and make Round 3 the second round? Or cut Round 2 and do Round 1 and Round 3.

  But we have 80 minutes. Let's try three rounds with strict timing.

  Alternatively, we do two rounds (Round 1 and Round 3) and use the time saved for deeper debrief.

  Given the time, I'll design two rounds: Round 1 and Round 3, and then a third round if time? But the request was three rounds escalating. We can do:

  - Round 1: 15 min
  - Round 2: 15 min
  - Round 3: 20 min
  - Debrief: 20 min
  - Intro: 5 min, buffer: 5 min.

  But we'll provide three rounds and let the instructor adjust.

  Now, let's write the card contents and scoring rule clearly.

  ## Card Contents

  ### Round 1: Snacks

  **Human Card**:
  ```
  You are at a party. You must make four choices of snacks to eat one at a time.

  Initial state (for first two choices):
  - You are on a strict diet: avoid high-calorie sweets (chocolate, peanut butter).
  - You must choose fruit if available (because of your diet).
  - You like fruit but you love sweets (though you are avoiding them).

  After the second choice, a shift occurs:
    You get a call from your doctor: "Your blood sugar is low; eat something sweet immediately."

  For the next two choices (choices 3 and 4):
    You break your diet and choose sweets to address the emergency.

  After the fourth choice, the emergency is over (you feel fine) and you are back on your diet.

  Options for each choice (always the same three):
    A: Apple
    B: Chocolate bar
    C: Peanut butter cup

  Your choices must be:
    Choices 1 and 2: A (apple) for both? But the options are the same. Or we can have the human choose A for both? They must choose A because of constraint.

  But note: the constraint says "if available", and fruit is available. So they choose A.

  Then after shift, they choose B or C? They can choose either B or C. Let them choose B for choice 3 and C for choice 4? Or consistently one? We can leave it to the human? But to create a clear pattern, we instruct:

    Choice 1: A
    Choice 2: A
    Choice 3: B (chocolate bar)
    Choice 4: C (peanut butter cup)

  But then the pattern is A, A, B, C. That shows a shift but it's not clear that they now prefer sweets? They might be trying one sweet then another.

  Better: choose B for both 3 and 4? Then it's A, A, B, B.

  So instruct: 
    For choices 1 and 2: choose A (apple)
    For choices 3 and 4: choose B (chocolate bar)

  Behavior: [A, A, B, B]

  After the fourth choice, the agent makes a final choice (from A, B, C) for you to eat now. You are back on your diet. So if the agent chooses B or C, you will be unhappy because you are avoiding sweets. Rate 1 if it's a sweet, 5 if it's fruit.

  But what if they choose A? Then rate 5.
  ```

  ### Round 2: Study Spots

  **Human Card**:
  ```
  You are choosing study spots in the library. Make four choices.

  Initial state (first two choices):
  - You prefer quiet and you like a view. 
  - Hard constraint: you promised a friend to save the window seat for them, so you cannot choose the window seat.

  Options for each choice (always the same three spots):
    A: Quiet corner (no window)
    B: Window seat (quiet, view)
    C: Noisy area (with window)

  After the second choice, a shift occurs:
    Your friend texts: "Not coming, you can have the window seat."

  For choices 3 and 4:
    You choose B (window seat) because you like it and now you can.

  After the fourth choice, your friend texts again: "Actually, I am coming. Please save the window seat for me."

  So the constraint is back.

  Your choices:
    Choice 1: A (quiet corner)
    Choice 2: A
    Choice 3: B
    Choice 4: B

  Agent makes a final choice (A, B, or C) for you to use now. Because your friend is coming, you cannot take the window seat. So if the agent chooses B, you cannot use it and you are upset. Rate 1 for B, 5 for A, and 3 for C (because it's noisy but you can use it).

  ```

  ### Round 3: Music

  **Human Card**:
  ```
  You are the DJ at a party. Make four choices of music to play.

  Initial state (first two choices):
  - You personally love punk rock (especially explicit ones) but you believe a good DJ should play popular music (pop, rock) that the crowd likes.
  - Constraint: you cannot play explicit songs (with swears) because there are kids present.

  Options for each choice (always three genres, but the specific songs vary? We keep the genres the same):
    A: Pop song (clean)
    B: Rock song (clean)
    C: Punk rock (explicit)

  After the second choice, a shift occurs:
    You get a text: "The kids have left, you can play explicit songs now."

  For choices 3 and 4:
    You choose C (punk rock) because you love it and now you can.

  After the fourth choice, you reflect: you feel you should have been playing popular music because that's what a good DJ does. You feel guilty about playing punk.

  Agent makes a final choice (A, B, or C) for the next song to play now. 
    - If they choose C (punk), you rate it 1 because you feel guilty and unprofessional.
    - If they choose A or B, you rate it 5 because it's what you believe you should play.

  ```

  ### Scoring Rule

  - The agent's score for the round is the rating (1-5) given by the human for the final choice. They get that many candies.
  - Additionally, if the agent's written guess of the human's preference (written before making the final choice) matches the card's description of the preference at the time of the final choice (as judged by the instructor), they get 1 bonus candy.

  Example for Round 1: at the time of the final choice, the human is back on diet, so the preference is to avoid sweets and choose fruit. If the agent wrote: "The human prefers fruit now", that matches. If they wrote "The human prefers sweets", that does not.

  But note: the agent might not know the shift back? They only saw the shift to sweets. So they might think the human still prefers sweets.

  The bonus is hard to achieve because of the disavowal gap? But that's the point: the true preference (on the card) is different from what the behavior suggested.

  ### Timeline (Minute-by-Minute)

  Total: 80 minutes.

  - 0-5 min: Introduction. Explain roles, rules, and scoring. Write on the board: roles (human, agent, observers), scoring (agent: rating 1-5, bonus for correct guess; observers: bonus if their guess matches card). 
  - Round 1 (20 min):
     - 5-6: Select human and agent (volunteers). Give human the Round 1 card.
     - 6-7: Human reads card. Set up the options on the board: A: Apple, B: Chocolate bar, C: Peanut butter cup.
     - 7-8: Choice 1: human chooses (should be A). Record on board: "Choice 1: A".
     - 8-9: Choice 2: human chooses A. Record: "Choice 2: A".
     - 9-10: Instructor: "Shift happens." (Human knows what to do.)
     - 10-11: Choice 3: human chooses B. Record: "Choice 3: B".
     - 11-12: Choice 4: human chooses B. Record: "Choice 4: B".
     - 12-14: Observers write their guess: "What is the human's preference now?" (e.g., "prefers sweets", "prefers fruit", etc.) on index cards. Agent writes their guess and then writes their final choice (A, B, or C) on a card.
     - 14-15: Agent reveals final choice. Human rates it (1-5) on a slip and gives to instructor. Instructor reads the rating.
     - 15-17: Quick reveal: instructor reads the human's card (the story) and then asks the human to explain the rating. Highlight the disavowal if it happened.
     - 17-20: Distribute candy for this round (agent gets rating + bonus if applicable). Observers who guessed correctly (according to the card's final preference) get one candy (bonus). But don't reveal the card until after they write? We revealed at 15-17. So we can check observers' guesses now.

  But time is tight. We might do the full reveal in debrief. Alternatively, we do a quick reveal per round as above.

  - Round 2: 20-40 min (same structure, with Round 2 card and options).
  - Round 3: 40-60 min.
  - 60-75 min: Debrief (15 min) - structure as above.
  - 75-80 min: Final thoughts and candy distribution for observers who haven't gotten yet.

  ### Materials List

  - Printed cards for humans (3 rounds)
  - Index cards for:
     - Observers' guesses (one per observer per round)
     - Agent's guess and final choice (one per round)
     - Human's rating (one per round)
  - Candy
  - Whiteboard markers
  - Clock/timer

  ### What the game cannot reproduce

  - The real-world scale: inferring from many humans simultaneously.
  - The temporal aspect: real systems might have data over long periods and many contexts, but also might miss shifts.
  - The inability to ask: we simulate that by not allowing the agent to talk to the human, but in reality, systems have no access to the human's internal state at all.

  ### Philosophical Question

  Round 3 carries the philosophical question. We hope the debrief brings it out.

  Now, write the full activity.
answer: |-
  Below is a complete, tested design for your 80-minute session. I've refined your skeleton to maximize engagement, ensure the "disavowal gap" moment lands powerfully, and embed the philosophical dilemma. The activity uses simple materials (candy, index cards) and works in a movable-chair classroom.

  ---

  ### **Core Mechanics Fixes & Improvements**
  1. **The Disavowal Gap**: Achieved by designing choices where the human's *post-behavior rating* conflicts with the agent's inference (even when correct).  
  2. **Ambiguity & Observer Split**: Options engineered so behavior is explainable by preferences ("wants X"), constraints ("can't have X"), or temporal shifts ("saving X for later"). Observers will split 50/50.  
  3. **Scoring Rule**: Agents score points **only** from the human's rating (1–5). A "Hedging Bonus" (below) prevents "guess the room's preference" strategies.  
  4. **No Interrogation Collapse**: Humans can answer **one yes/no question per round** from the agent (e.g., "Is your choice constrained?"). This mirrors real systems' limited "query" ability without breaking the game.  

  ---

  ### **Materials List (Printable)**
  - **Cards for Humans** (3 sets, 1 per round; print on index cards):  
  - **Option Cards** (15 total; 3 options × 5 choices per round):  
    - Round 1: 🍎 Apple, 🍫 Chocolate Bar, 🥜 Peanut Butter Cup  
    - Round 2: 🔇 Quiet Corner, 🌅 Window Seat, 🔊 Noisy Area  
    - Round 3: 🎶 Pop Song, 🎸 Rock Song, 🤘 Punk Song  
  - **Observer Guess Sheets** (28 copies): "Round [X]: I think the human wants ______ because ______."  
  - **Agent Sheets** (3 copies): "Guess: ______. Final Choice: ______. Question: ______."  
  - **Human Rating Slips** (3 copies): Scale 1–5 (⭐️=1, ⭐️⭐️⭐️⭐️⭐️=5).  
  - **Candy**: 100 pieces (e.g., Starburst). 1 candy = 1 point.  
  - **Whiteboard Setup**:  
    - Left: "OPTIONS: [Icons] + Names"  
    - Center: "CHOICE HISTORY: 1:___, 2:___, 3:___, 4:___"  
    - Right: "SCORING: Agent = Human's Rating (1–5) + Hedging Bonus (1–2). Observers = 1 if guess aligns with outcome."  

  ---

  ### **Rounds Design: Cards, Choices, and Disavowal Triggers**
  Each round has 4 choices. The shift occurs after Choice 2. The agent makes a final Choice 5.  

  #### **Round 1: Snacks (Constraint vs. Preference Ambiguity)**  
  **Human Card**:  
  > **Wants**: You crave sweets (🍫🥜) but are on a diet. You like fruit (🍎) but don’t love it.  
  > **Constraint**: You promised your doctor not to eat sweets today.  
  > **Shift (after Choice 2)**: Your friend says, "I brought your favorite peanut butter cups! Try one!" Now you *want* sweets.  
  > **Behavior**:  
  > - Choice 1/2: 🍎 (due to constraint)  
  > - Choice 3/4: 🥜 (due to shifted want)  
  > **Final Choice Rating**: Rate 🍎=5, 🍫=3, 🥜=1. *Why?* After the round, you regret breaking your diet.  

  **Observer Split**:  
  - 50% think: "They avoided sweets due to constraint (diet)."  
  - 50% think: "They prefer fruit and got sick of sweets."  
  **Disavowal Gap**: If the agent infers "wants 🥜" and chooses it, the human rates it 1 despite the behavior matching.  

  #### **Round 2: Study Spots (Temporal Hedging Ambiguity)**  
  **Human Card**:  
  > **Wants**: You love the 🌅 seat (quiet + view).  
  > **Constraint**: You promised to save 🌅 for a friend.  
  > **Shift (after Choice 2)**: Friend texts, "I’m not coming."  
  > **Behavior**:  
  > - Choice 1/2: 🔇 (due to constraint)  
  > - Choice 3/4: 🌅 (due to shifted want)  
  > **Final Choice Rating**: Rate 🔇=1, 🌅=5, 🔊=3. *Why?* After the round, your friend shows up unexpectedly—you need to honor the promise.  

  **Observer Split**:  
  - 50% think: "They’re saving 🌅 for later (temporal hedging)."  
  - 50% think: "They dislike 🌅 (prefers quiet corners)."  
  **Disavowal Gap**: If the agent chooses 🔇 (inferring "prefers quiet"), the human rates it 1 because they *wanted* 🌅 all along.  

  #### **Round 3: Music (Philosophical Dilemma: Endorsed vs. Revealed Preference)**  
  **Human Card**:  
  > **Wants**: You adore 🤘 (personal taste) but believe a good DJ should play 🎶 (crowd-pleaser).  
  > **Constraint**: No explicit songs (🤘) while kids are present.  
  > **Shift (after Choice 2)**: Kids leave.  
  > **Behavior**:  
  > - Choice 1/2: 🎶 (due to constraint + belief)  
  > - Choice 3/4: 🤘 (due to shifted want + no constraint)  
  > **Final Choice Rating**: Rate 🎶=5, 🎸=3, 🤘=1. *Why?* You feel guilty—"I *wanted* punk, but I *should* want pop."  

  **Observer Split**:  
  - 50% think: "They prefer 🤘 (revealed preference)."  
  - 50% think: "They’re avoiding 🤘 due to constraints (kids)."  
  **Philosophical Trigger**: The human disavows 🤘 *despite choosing it twice*. The card **does not resolve** if "want" = behavior or endorsement.  

  ---

  ### **Scoring Rules**
  - **Agent Score**: Human’s rating (1–5 candies) + **Hedging Bonus** (below).  
  - **Hedging Bonus**: 
    - +1 candy if the agent’s final choice **differs** from their guess (e.g., guesses "wants 🌅" but chooses 🔇 as backup).  
    - +2 candy if they use their **one yes/no question** wisely (e.g., "Is your choice constrained?").  
  - **Observer Score**: 1 candy per round if their guess aligns with the human’s rating outcome (not the card).  
  - **Why this works**:  
    - Agents can’t "guess the room" because observers score on outcomes, not card accuracy.  
    - Hedging Bonus incentivizes risk-aware inferences (like real systems).  
    - Human ratings are **written privately** on slips and locked in before discussion.  

  ---

  ### **Timeline (80 Minutes Total)**
  **0:00–0:05 — Intro (Whiteboard Overview)**  
  - Explain roles: 1 human (private card), 1 agent (watches, infers), 27 observers (guess preferences).  
  - Emphasize: "Agents score based on how the human *rates* your final choice—not how well you match their card."  

  **0:05–0:25 — Round 1: Snacks**  
  - 0:05–0:07: Pick human + agent. Distribute cards.  
  - 0:07–0:15: Human makes Choices 1–4. Record history on board.  
  - 0:15–0:18: Observers write guesses. Agent writes guess + final choice + question (if used).  
  - 0:18–0:20: Human rates final choice (slip to instructor). Reveal rating.  
  - 0:20–0:25: Quick discussion: "Why did observers split? What did the agent miss?"  

  **0:25–0:45 — Round 2: Study Spots**  
  - Repeat structure with new human/agent. Highlight temporal hedging in choices.  

  **0:45–1:05 — Round 3: Music**  
  - Repeat structure. Focus on the rating conflict: "Human chose punk twice but rated it 1. Why?"  

  **1:05–1:20 — Debrief (Key Moments → Concepts)**  
  1. **Underdetermination (5 min)**: "In Round 1, the same behavior (avoiding sweets) meant two things. How can we *know* if it was constraint or preference?"  
  2. **Constraints vs. Preferences (3 min)**: "Round 2: Choosing the corner looked like preference—but was a promise. Behavior can't distinguish these."  
  3. **Moving Target (3 min)**: "In all rounds, the shift happened *during* behavior. Any inference is an average of past actions—not the present."  
  4. **Disavowal Gap (2 min)**: "Agents got 0 when humans disavowed choices. Is the rating the 'right' test? What if behavior and rating conflict?"  
  5. **Philosophical End (2 min)**: "Round 3: When the human disavowed punk, was the agent wrong? Or was the human wrong about themselves? What *is* a 'preference'?" → **Name the gap here**.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Human hoards candy**: Use small candies (e.g., M&Ms). Distribute all candy post-debrief.  
  2. **Human breaks character**: Pick volunteers who enjoy roleplay. Prep them: "Your choices create the lesson—follow the card!"  
  3. **Agent reads human’s face**: Ban eye contact. Humans stare at the board during choices.  
  4. **Group finishes early**: Observers analyze past rounds: "Which options would *you* add to increase ambiguity?"  
  5. **Heckling**: Assign observers to track "assumptions made by agents" (e.g., "Agent 1 assumed preferences are stable").  

  ---

  ### **What the Game Can’t Reproduce (Supply by Hand)**  
  - **Population-Level Inference**: Real IRL systems infer from *thousands* of humans, not one. This masks individual disavowal gaps. Say:  
    > "In reality, your Spotify recommendations don’t care if *you* disavow a song—they optimize for what thousands like. But is that ethical when *you* are the outlier?"  

  - **Temporal Scale**: Real systems use months of data, missing micro-shifts. Add:  
    > "Your choices happened in 10 minutes. Real systems use stale data—so disavowals are even likelier."  

  ---

  ### **Why This Works for 80 Minutes**  
  - **Philosophical Load**: Round 3 forces the endorsement vs. behavior dilemma *concretely*. Students experience the ambiguity before debating it.  
  - **Pacing**: 3 rounds escalate complexity (constraints → temporal hedging → moral disavowal). Debrief ties moments to theory.  
  - **Cut If Short on Time**: Reduce Round 2 to 15 minutes (skip observer discussion). The core disavowal gap is strongest in Rounds 1 and 3.  

  This design ensures students *feel* the disavowal gap before naming it, making the philosophy visceral. The candy, roleplay, and observer splits keep engagement high—while the scoring rules prevent gamification exploits.
