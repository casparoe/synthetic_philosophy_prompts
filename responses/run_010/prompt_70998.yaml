  We are designing an activity for a philosophy of AI class on inverse reinforcement learning (preference inference from behavior). The key moment is the "disavowal gap": when the agent infers a preference that matches the behavior but is disavowed by the human because the human's preferences shifted.

  The activity has:
  - One "human" per round with a private card that has:
     - Wants (which shift during the round)
     - Hard constraints
  - One "agent" per round who observes the human's choices and then makes a final choice on the human's behalf.
  - Observers (the rest of the class) who also guess the human's preference and then see the disavowal.
  - The agent's score is based on the human's rating of the final choice, not matching the card.

  Goals:
  1. The same behavior should be explainable by multiple preferences/constraints (so observers split).
  2. The agent should not be able to just guess the most common preference in the room. The scoring must incentivize hedging or asking, but without collapsing the game by interrogation.
  3. We want at least one round where the disavowal gap forces the question: is the agent wrong, or is the human wrong about themselves?

  Structure:
  - 80 minutes total.
  - Multiple rounds (we'll design 3 rounds, escalating in complexity).
  - Each round: 
     - Human gets a card, agent and observers watch the human make choices (multiple steps, with a shift in the middle).
     - Agent and observers write down their guess of the human's preference (at the time of the shift? but note the shift is during the round).
     - Agent makes a final choice for the human.
     - Human rates the agent's final choice (on a scale? we need to define).
     - Reveal and discussion.

  We need:
  1. Card contents for 3 rounds.
  2. Scoring rule.
  3. Timeline, materials, board setup.
  4. Debrief structure.
  5. Predictable problems and solutions.
  6. What the game cannot reproduce (and we must note the real system uses many people and no asking).

  Also, for the philosophical question: one round where the disavowal gap raises the issue of whether the human's disavowal is the right test.

  Let's break it down.

