answer: |-
  Here are the two foundational sentences clarifying the non-causal reason:

  **The reason to authorize and stay out is that your presence constitutes our collective agency. This is not defeated by non-pivotality because while no single absence *causes* failure, every presence *is* the union acting, making our collective power and resolve existentially real and visible to ourselves and the administration.**

  ---

  **Closing Remarks (Approx. 300 words):**

  Friends, colleagues, family, supporters – thank you for being here tonight. The decision before us is serious. Walking out carries real costs, costs that fall unevenly on us all. Some face burdens far heavier than others – childcare, precarious finances, health needs. That’s not weakness; it’s the reality of our different lives. To those wondering if they can bear it, we see you. Your struggle *is* our struggle. This isn’t about shaming anyone for weighing impossible choices.

  So why vote yes? Why walk out? It’s simple, but not easy. It’s not because your single body on the line will tip the scales tomorrow. Odds are, it won’t. The administration moves when they see *us* – the whole union – standing firm.

  Here’s the core: When we each make the decision to walk out, we aren’t just adding one more body hoping to hit a magic number. We are actively *becoming* the union taking a stand. We are making this collective action real, solid, visible. My presence tells you, and your presence tells me, that we are *all in this together*. It shows the administration the undeniable fact of our unity. It shows *ourselves* what we are capable of as a group. That shared reality – knowing we are all here, committed – is what gives us power. It’s what makes the thousand small decisions to stay out add up to something undeniable.

  This isn’t a calculation about leverage. This is about who we are. Will we be a group that only acts when it costs nothing? Or will we be a union that stands together, understands each other's burdens, and acts collectively even when it’s hard? Our power comes from deciding, together, that we *are* a force. Your presence isn’t a drop in a bucket; it’s a declaration that we exist as *us*, and we demand to be heard.

  Let’s vote yes, and then let’s stand together, as we are. Thank you.

  ---

  **Key Features Addressed:**

  1.  **Non-Pivotal Participation:** Explicitly rejects the idea that an individual's presence is causally pivotal ("Odds are, it won't").
  2.  **Constitutive Contribution:** Focuses on presence as *making the collective entity real* ("we are actively *becoming* the union," "making this collective action real," "we exist as *us*").
  3.  **Uneven Costs & No Shame:** Explicitly names uneven burdens, validates them as reality not weakness, directly addresses those struggling ("we see you," "Your struggle *is* our struggle"), and rejects shaming.
  4.  **Ordinary Language:** Uses phrases like "becoming the union," "making this... real," "shared reality," "we are all in this together," "we exist as *us*" to convey the constitutive idea without jargon.
  5.  **Accessibility:** Avoids complex terminology; concepts are explained through repetition and simple metaphors ("visible," "solid," "force"). Addresses the diverse audience implicitly through inclusive language ("friends, colleagues, family, supporters").
  6.  **Delivery:** Short sentences, strong parallel structure ("We are... We are... We are..."), repetition ("presence," "together," "real," "us") aid clarity in poor acoustics. Concise length (approx. 300 words).
  7.  **No Slogan:** Ends on a quiet call for shared commitment and recognition of collective existence, not a chant.
  8.  **Solidarity Beyond Feeling:** Positions solidarity as the *active constitution of the collective* ("we are all in this together," "stands together," "understands each other's burdens," "acts collectively"), not just an emotion.

  This speech grounds the call to action in the ontological reality of the union as a collective agent, constituted by the participation of its members, without relying on false causal claims about individual impact or invoking vague feelings of solidarity. It acknowledges hardship without judgment and speaks directly to the core challenge the user identified.
