  ## The Brass Board at 43 Sycamore

  The courtyard at 43 Sycamore Court was Agnes’s sanctuary. Not that she spent much time lounging. Mostly, she knelt among the raised beds her mother had built decades ago, coaxing tomatoes and basil from the stubborn city soil. The scent of damp earth and sun-warmed herbs was the closest thing to peace she knew, a quiet counterpoint to her days knee-deep in invoices and overtime slips for Borrelli Plumbing. Lately, though, the sanctuary felt like a ticking clock.

  The brass board in the lobby was the source of the ticking. A relic, like Mrs. Gunderson’s lace doilies on the radiator covers. Mounted beside the ancient elevator, its surface was scarred by decades of thumbtacks holding notices about boiler shutdowns and lost cats. And one original bylaw, typed on yellowing cardstock, pinned dead center: *Resolution of Common Space Usage. Proposal posted here prior to the first of any month becomes binding upon all residents for a period of ten (10) years. No withdrawal. No amendment. Custodian to maintain postings.* Mr. Henderson, the board’s keeper, took that last part seriously. Nineteen years in, he wouldn’t remove a grocery list once tacked up.

  Agnes knew the rule. Everyone did, vaguely, like knowing fire escapes exist. Until Leo Kovac moved into 4B and saw the courtyard not as a garden, but as three perfectly aligned, unused parking spaces. Revenue, Leo argued at the last building meeting, jingling his car keys like punctuation. Real revenue. The building’s reserve fund was anaemic. Roof repairs loomed. Insurance premiums crept up yearly. Three spaces rented monthly? That was stability. Security. He had pamphlets from a paving company.

  Agnes had argued back, voice tight. The beds. The light. The history. Her mother’s hands shaping the soil. The building murmured agreement, but it was the murmur of shared anxiety, not conviction. Money talked louder than nostalgia.

  Leo wasn’t malicious. He fixed motorcycles in a rented garage two blocks over, grease permanently under his nails. He nodded politely when Agnes passed him in the hall. But his eyes, when they flicked towards the courtyard windows, were calculating. He wanted the security the parking spaces promised, the same way Agnes craved the solace of the garden. Both knew the brass board was the only route. Post your proposal before the first – win everything. Lose the posting race – lose everything for ten years.

  The ticking grew louder as April bled into May. The first of June was a fortnight away. Agnes watched Leo. He watched her back. They became experts in each other’s routines. Agnes knew Leo left for the garage at 7:15 AM sharp. Leo knew Agnes checked the lobby mail around 6:30 PM. The brass board, under Mr. Henderson’s indifferent gaze, became a silent battleground. Agnes imagined Leo’s notice, crisp and brutal: *Resolution: Convert Courtyard to Three (3) Paved Parking Spaces.* She had her own draft, folded small in her wallet: *Resolution: Maintain Courtyard Exclusively as Communal Garden Space (Existing Beds Preserved).*

  Posting first was victory. It was also terrifying. The ten-year lock. What if she needed the money later? What if Leo retaliated somehow? What if she was wrong? But losing… losing the basil, the tomatoes, the quiet hum of bees among the lavender… unthinkable.

  Then, Mrs. Gunderson cornered Agnes by the mail slots. Her voice was a dry whisper. “You heard about the Millers, over on Elm? Their building had two notices posted same day. Contradictory nonsense. Went to the city.” She shook her head, her glasses slipping down her nose. “Fence went up. Years it took to sort. Years! Their insurance? Skyrocketed. Poor young Miller boy, lost his scholarship… had to leave college.” She patted Agnes’s arm with a papery hand. “Just… be careful, dear. That tiebreaker clause… it’s a poison pill.”

  The tiebreaker clause. Agnes dug out the building’s bylaws booklet later that night. Buried in dense legalese: *In the event of contradictory proposals posted for the same common space resolution within the same monthly posting period, jurisdiction defaults to City Planning Board. Said space to be closed for all resident use pending resolution.* And below that, the kicker: *Associated legal and administrative costs, including any resultant increases in building insurance premiums, to be levied as a special assessment upon all unit owners.*

  A poison pill indeed. Mutual destruction. If they both posted, nobody got the courtyard. Worse, everyone paid dearly for the privilege of losing it. Leo knew this too. Agnes saw it in the new tension around his eyes, the way he lingered near the brass board after collecting his mail, studying the existing notices like they held a code.

  The week before June 1st was agony. Agnes woke at 3 AM, the image of asphalt smothering her mother’s rosemary bush jolting her upright. She drafted frantic alternatives on scrap paper at work, her mind whirring while calculating pipefitter hours. Could they share? Garden half, park half? The bylaw didn’t allow for amendments or combinations. It was all or nothing, winner-takes-all, scorched-earth victory. Or mutual ruin.

  Leo was jumpy. He nearly dropped his toolbox when Agnes stepped out of the elevator as he was examining the brass board one evening. His knuckles were white on the handle. “Agnes,” he nodded, voice gruff. He didn’t meet her eyes.

  “Leo.” She moved to her mailbox, acutely aware of his presence, the stifling quiet of the lobby broken only by the wheeze of the elevator mechanism.

  He cleared his throat. “Nice weather for the… plants.” It sounded forced.

  “Suppose it is.” She fumbled with her mailbox key. The folded garden notice in her pocket felt like a grenade. Could she post it now? Right now? Beat him? The brass board gleamed dully under the lobby’s weak light, the empty space waiting.

  But the image of the fence, the insurance bills, Mrs. Gunderson’s worried face… it paralyzed her. *Being faster might doom us all.* The thought landed with cold clarity. Posting *her* notice first was still a gamble. Leo might still post his out of spite, or panic, triggering the tiebreaker. Her victory could still turn to ash and debt.

  The power wasn't just in binding the *other* person. It was in binding *yourself*. Irrevocably. Taking the option to fight dirty off the table. Making your surrender… not a surrender, but a condition.

  It felt like stepping off a cliff. Her hands were icy.

  That Friday afternoon, Agnes didn’t go straight home. She went to the hardware store. She bought a single sheet of heavy, cream-colored cardstock. Expensive. The kind that wouldn’t curl. Back at Borrelli’s, after the last plumber clocked out, she sat at her desk. The payroll system hummed. She wrote carefully, precisely, her payroll clerk’s handwriting neat and unambiguous. Not a proposal for the courtyard. An offer. A binding commitment.

  She didn’t sleep. Saturday dawned grey and drizzly. Leo’s motorcycle wasn’t in its usual spot. Probably at the garage. Agnes took a deep breath. She went downstairs. The lobby was empty. Mr. Henderson’s door was closed. The brass board waited.

  Her notice wasn’t folded. It was flat and crisp. She read it one last time, the words stark:

  *I, Agnes Finch (Unit 2C), hereby irrevocably commit: Should Leo Kovac (Unit 4B) post a binding resolution by June 1st converting the courtyard solely to paved parking (max. 3 spaces), I will not post any contradictory resolution within this posting period. I acknowledge this prevents me from initiating the tiebreaker clause regarding the courtyard this month.*

  She didn’t propose the garden. She gave up her right to fight him over the parking. She bound *herself*.

  Her fingers trembled slightly as she pressed a brass thumbtack through the top corners of the cardstock. The *snick* as it pierced the cork backing behind the brass was loud in the silent lobby. She pressed it flat. The cream rectangle stood out starkly against the faded notices about laundry room hours and a lost parakeet. It looked absurdly formal. Terrifyingly permanent.

  She walked away quickly, her heart hammering against her ribs. She didn’t look back. She spent the day pretending to weed beds she might lose forever, the drizzle soaking her collar, her thoughts a chaotic whirl. Had she just handed Leo the keys to the courtyard? Signed its death warrant? Or had she done something else?

  Sunday passed. Leo’s motorcycle was back. Agnes avoided the lobby. She saw Leo once, carrying groceries. He looked at her, a long, searching look, his expression unreadable. He didn’t speak.

  Monday. Tuesday. Wednesday. The cream notice hung on the brass board. People passed it. Mrs. Gunderson paused, adjusted her glasses, peered closely. Mr. Henderson dusted around it. A new notice about a leaky faucet in 3A appeared below it. Leo must have seen it.

  Thursday evening. Agnes came home late after resolving a payroll discrepancy. The lobby was dim. She hesitated, then forced herself to look.

  Her cream notice was still there. Alone.

  But tucked neatly underneath its bottom right corner, held by the same brass tack, was another piece of paper. Smaller. Lined, like torn from a notepad. Written in a blunt, practical hand she recognized from garage invoices:

  *Parking plan includes designated area (6ft x 4ft) for Agnes’s pots – south wall, full sun. Water access maintained. – L.K.*

  Agnes stared. Her fingers touched the edge of the lined paper. It wasn’t a proposal. It wasn’t binding. It wasn’t posted properly. Just a note. Tacked under her own commitment.

  She looked up. Leo was standing in the shadowed entrance to the stairwell, holding a mug of coffee. He didn’t approach. He just looked at her, then gave a single, almost imperceptible nod. Not friendly. Not hostile. An acknowledgment. Then he turned and started climbing the stairs, his heavy boots echoing in the quiet.

  Agnes turned back to the brass board. Her notice, irrevocable. His note, flimsy, unofficial. The courtyard’s fate hung between them, suspended not by a fence, but by a single brass thumbtack and a few handwritten words. Outside, the drizzle had stopped. Through the lobby’s grimy window, the first sliver of the greenhouse beds was visible, the leaves glistening wet and dark in the fading light. She didn’t move. The only sound was the slow drip of water from the awning outside landing on the concrete step.
