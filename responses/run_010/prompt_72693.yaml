  ### How the Poem Works  
  The pantoum’s recursive form embodies Moore’s organic unities: identical lines (e.g., "A stream runs clear...") change value when transplanted. In the first quatrain (positions 1–4), the landscape exists devoid of consciousness. When the stream reappears in the third quatrain (position 9), it anchors a shared moment—the line’s worth now emerges from mutual perception. The unshareable good (fourth quatrain) isolates the watcher: the recycled lines "They sit together..." (position 13) and "They watch the water..." (position 15) haunt as absent reciprocity, making the solitary appreciation feel both real and diminished. The closing sigh (position 20) returns as indifferent nature, refusing resolution. Banned words are avoided; concrete images carry the philosophy.
