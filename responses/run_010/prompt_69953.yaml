    - Let's examine the betting arrangements:

      **Case 1: Bet offered and settled at each awakening.**
      - On each awakening, Beauty is offered a bet that pays $1 if heads and $0 if tails. If she bets at 1:2 odds (i.e., she pays $1/3 to win $1 if heads, so net: if heads she gets $1 - $1/3 = $2/3, if tails she loses $1/3), then:
        - If heads (one awakening), she wins once: net $2/3.
        - If tails (two awakenings), she loses twice: net -$2/3.
        - Expected value from Sunday: (1/2)*($2/3) + (1/2)*(-$2/3) = 0. So fair price per bet is $1/3.
      - A halfer might think the fair price per bet is $1/2. Then:
        - If heads: she wins $1 - $1/2 = $1/2 (once).
        - If tails: she loses $1/2 twice, so net -$1.
        - Expected value: (1/2)*($1/2) + (1/2)*(-$1) = -$0.25. So she would be losing money on average.

      Hence, in this settlement convention, the halfer is vulnerable to a Dutch book.

      **Case 2: A single bet offered on Sunday, settled at the end.**
      - On Sunday, Beauty is offered a bet that pays $1 if heads and $0 if tails. The fair price is $1/2 (since the chance of heads is 1/2). 
