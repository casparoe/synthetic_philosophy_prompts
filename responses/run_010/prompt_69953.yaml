  ### 3. Own diagnosis

  I will argue for a diagnosis that combines elements of the centered versus uncentered content and the norm of conditionalization, leading to a substantive disagreement that is difficult.

  **The core issue**: The problem forces us to confront the relationship between self-locating beliefs and non-self-locating beliefs, and the updating of self-locating beliefs under loss of information.

  - **What each camp asserts**:
    - **Thirder**: On awakening, Beauty should assign equal credence to the three centered possibilities: <Heads, Monday>, <Tails, Monday>, <Tails, Tuesday>. Therefore, P(Heads) = 1/3.
    - **Halfer**: Beauty learns no new non-self-locating information. She knew she would be awakened. So she should not change her credence in heads, which remains 1/2.

  - **Norms implicitly committed to**:
    - **Thirder**: They are committed to a form of conditionalization that takes into account centered information. They hold that upon awakening, Beauty learns the new indexical information: "I am awake now" (or "this is an awakening"). Relative to her knowledge on Sunday, this information is not certain (because on Sunday she knew she would be asleep on Sunday night) but it is new. The set of possibilities she considers now is different: she rules out the Sunday night possibility and now considers only the three awakenings. Moreover, by a principle of indifference (or symmetry), she should assign equal probability to each.
    - **Halfer**: They are committed to the view that only non-indexical information can change credences about non-indexical matters. Since the coin flip is non-indexical, and Beauty learns nothing new about the coin, her credence should remain 1/2. They might also appeal to the Reflection Principle: on Sunday she had credence 1/2 and she knew that on awakening she would have the same credence, so she should not change.

