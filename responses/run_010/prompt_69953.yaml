  - The halfer's 1/2 is the objective chance of the coin flip (and also the Sunday probability).
  - The thirder's 1/3 is the fraction of awakenings that are heads-awakenings.

  Both are valid in their own way, but they are not the same.

  **My diagnosis**: The dispute is a substantive disagreement that is difficult because it arises from a tension in the norms of rationality when applied to self-locating beliefs under memory loss. Both sides have strong arguments, and it is not clear how to reconcile them. It is not a verbal dispute because both sides are using the same words with the same meaning (the proposition "the coin landed heads" is clear). It is also not a faultless disagreement about different propositions because both are answering the same question about the same proposition. The question is well-posed but the norms of rationality are in conflict.

  ### 4. What would count as progress?

  Given that I see the dispute as substantive and difficult, progress would come from:

  - **A theorem that shows that one of the norms (e.g., conditionalization on centered information) leads to inconsistency in a broader class of cases** or that the other norm (e.g., reflection) leads to more general problems.

  - **A precisification of the experimental setup** that breaks the symmetry or introduces a new element. For example, if we change the number of awakenings in the tails case, we can get a clear verdict. Suppose on heads, Beauty is awakened once; on tails, she is awakened 100 times. Then the halfer would still say 1/2, but the thirder would say 1/101. Now consider a bet: if she is offered a bet at each awakening that pays $1 on heads and $0 on tails, then the fair price per bet is 1/101. If she pays more than that, say 1/2, she will lose a lot in the tails case. This strongly supports the thirder view for per-awakening bets. But the halfer might still maintain that her credence in heads is 1/2. So we need to see if there is a broader framework that can accommodate both.

  - **An argument forcing the abandonment of one of the competing norms**. For example, if it can be shown that the halfer position leads to an unavoidable Dutch book even in a carefully controlled setting that separates the settlement conventions, then that would be progress. Or if the thirder position leads to violations of reflection in a way that is unacceptable.

