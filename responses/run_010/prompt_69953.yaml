      However, the typical thirder does not do that: they assign 1/3 to heads on awakening regardless of the betting context. So if asked about a single bet for the whole experiment during an awakening, they might still say 1/3? But that would be a mistake because the expected value of the bet is 1/2. 

      Alternatively, the thirder might say: "The credence I assign to heads is 1/3, but for a bet that is settled at the end and only once, I should use the Sunday credence of 1/2." That would be a hybrid view. 

      But in the literature, thirders do not typically make this distinction. They assign 1/3 and then note that for per-awakening bets it leads to the right behavior, but they might not address the single-experiment bet.

      Similarly, halfers assign 1/2 and then for per-awakening bets they are in trouble.

      Therefore, it seems that both camps do not adjust their credence to the betting context. They assign a single number for the credence in heads at an awakening. That number is then used for any bet offered at that awakening. 

      Hence, the dispute is not merely about settlement conventions because the camps do not adjust to the convention. They each stick to one credence and apply it to all bets. 

      However, the hypothesis might be that the camps are implicitly assuming different settlement conventions. 

      - Thirders might be assuming that any bet offered at an awakening is per-awakening (so it will be settled then and there and possibly multiple times). 
      - Halfers might be assuming that a bet about the coin is about the entire experiment and should be settled at the end (so only once).

      This is plausible. 

      But note that Lewis (a halfer) explicitly considers the possibility of a bet on awakening and argues that Beauty should not accept a bet at even odds on heads because she would lose twice as much in the tails case. So he is aware of the per-awakening betting. But he still maintains that her credence should be 1/2. So he is not changing his credence to fit the betting context. 

      Therefore, we cannot say that both camps would agree once the settlement convention is fixed. The halfer, even when told that the bet is per-awakening, might still assign 1/2 and then refuse to bet at 1/3 because she knows that in the tails case she will be offered the bet twice. But that refusal is not based on her credence but on the betting arrangement. 

      So the hypothesis that the dispute is about settlement conventions is partially supported: the betting arrangements do show that the fair price depends on how the bet is settled. However, the camps do not then adjust their credence accordingly. They each hold a fixed credence and then must adjust their betting behavior in a way that might seem inconsistent. 

      Thus, the hypothesis might capture a key aspect but not the entire story. It is a genuine crux in that the betting behavior reveals a difference in what the credence is being used for, but it does not fully explain why each camp holds their credence fixed regardless of the betting context.

