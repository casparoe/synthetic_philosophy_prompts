  We are given a detailed state of play and a hypothesis about the Sleeping Beauty problem. The hypothesis is that the halfer/thirder dispute is not fundamentally about probability but about what credences are answerable to: either to fair betting prices (which might depend on when bets are settled) or to tracking chances independently of the number of awakenings.

