  The constraint they imposed (no reliance on uncheckable private beliefs) is particularly interesting. In philosophy of promising, many theories do rely on mental states - Scanlon's expectation-based view, Rawls' practice-based view, etc. But for software agents, we need externally verifiable criteria. This constraint might force us toward more objective theories.

  For the desiderata list, I should:
  1. Cover their explicit cases
  2. Add missing but crucial philosophical distinctions (like the difference between being bound and merely having a reason)
  3. Include standard requirements from promise literature they might have missed (e.g. that promises can be released)
  4. Flag which items are non-negotiable vs. contingent

  The deathbed promise case is fascinating - no one to disappoint, yet we feel obligated. This kills pure reliance theories. The coercion case challenges will-based theories. The "promise of feeling" tests the boundaries of what can be promised. Each case probes a different weakness.

  Biggest tension I see: between the deathbed promise (which suggests obligation exists even without any effects) and the implementability constraint (which demands observable criteria). Can't have both - one must yield. Probably the constraint should be relaxed slightly, but I'll follow their instruction to pick.

  Now structuring the response:
  First, numbered desiderata with motivation and negotiability status. Need about 15-20 items to cover everything. Group logically: binding conditions, scope of content, release mechanisms, moral foundations, etc.

  Then conflict analysis - smallest unsatisfiable set is likely {Deathbed Promise, Implementability Constraint, No Private States}. The deathbed case requires obligation without observable effects, but implementability forbids that. I'd drop implementability because humans clearly do make such promises.

  Finally, quick take on major theories:
  - Will theories fail coercion cases
  - Reliance theories fail deathbed promises
  - Practice theories struggle with secret promises
  - Scanlon-style expectation theories need mental states they can't access

  The user's constraint is indeed problematic - promising fundamentally involves intentional states. But for their agents, they'll need to define "binding" operationally, perhaps through institutional rules rather than moral philosophy. Still, giving them the pure theory first as requested.
answer: |-
  Here is the philosophical specification for a theory of promissory bindingness, structured as requested. Desiderata are non-negotiable unless marked otherwise.

  ### I. Desiderata (Requirements & Motivations)
  1. **Secret Obligation**  
     *Motivation*: Deathbed promise kept in secret (promisee dead, no witnesses). The promise still binds; breaking it wrongs the deceased.  
     *Negotiability*: Non-negotiable. Any theory denying this loses the core intuition that a promise creates a duty *to the promisee*, not contingent on social enforcement.  

  2. **Voluntariness Threshold**  
     *Motivation*: Promise extracted under severe duress (e.g., sleep deprivation, coercion). Such promises may not bind, or bind weakly.  
     *Negotiability*: Non-negotiable. Coercion undermines moral agency.  

  3. **Content Constraint**  
     *Motivation*: Promising a feeling ("I promise I’ll never resent you"). Feelings aren’t directly volitionally controlled; bindingness may not apply.  
     *Negotiability*: Negotiable (context-dependent). Some theories allow "effort-based" promises; others limit to actions.  

  4. **Non-Vacuous Binding**  
     *Motivation*: Promising to do what one is already morally required to do (e.g., "I promise not to murder you"). The promise adds a distinct obligation.  
     *Negotiability*: Non-negotiable. Otherwise, promises add nothing to preexisting duties.  

  5. **Ultra Vires Commitment**  
     *Motivation*: Agent commits beyond its mandate, and counterparty can’t verify the mandate. The commitment may still bind the *agent*, even if not the principal.  
     *Negotiability*: Negotiable (use-case specific). Depends on whether the theory prioritizes institutional roles or interpersonal obligations.  

  6. **Implicit Binding**  
     *Motivation*: Plain statement of intention ("I’ll pick you up at 6") with no promissory language. This can still bind if context implies commitment (e.g., reliance is reasonable).  
     *Negotiability*: Non-negotiable. Language alone doesn’t determine moral force; social context does.  

  7. **Outcome Irrelevance**  
     *Motivation*: Keeping the promise leaves the promisee worse off than breaking it (e.g., promising to lend a car, but borrower crashes it). Bindingness isn’t overridden by bad outcomes alone.  
     *Negotiability*: Negotiable. Consequentialist theories reject this; deontological theories insist.  

  8. **Self-Release Immunity**  
     *Motivation*: Whether you can promise not to release yourself from a promise (e.g., "I swear I’ll never retract this vow"). If possible, it creates "inescapable" obligations.  
     *Negotiability*: Negotiable. Contingent on whether autonomy can be irrevocably alienated.  

  9. **Promisee-Exclusive Right**  
     *Motivation*: Only the promisee is wronged by breaking a promise (not third parties).  
     *Negotiability*: Non-negotiable. Central to interpersonal promise structure.  

  10. **Breakability with Justification**  
      *Motivation*: Promises can rightly be broken (e.g., to save a life).  
      *Negotiability*: Non-negotiable. Absolutism is implausible.  

  11. **Inadequacy of Compensation**  
      *Motivation*: Compensation doesn’t cure the wrong of breaking a promise (though it may mitigate).  
      *Negotiability*: Non-negotiable. The wrong is betrayal, not merely harm.  

  12. **Implementability Constraint**  
      *Motivation*: No reliance on private mental states (e.g., "what the agent believes the other believes"). Must be externally verifiable.  
      *Negotiability*: **Your constraint, but I argue it should be dropped**. Promissory binding inherently involves intentions and expectations. Without this, theories become behavioral and lose normative force.  

  ### II. Required Distinctions (Non-Collapsible)  
  - **Promise vs. Contract**: Contracts are institutional; promises are moral.  
  - **Promise vs. Statement of Intention**: Intentions lack commitment to the promisee.  
  - **Promise vs. Assurance/Prediction**: Assurances may invite reliance; promises create duties.  
  - **Promise vs. Threat/Offer**: Threats coerce; offers propose exchanges.  
  - **Promise vs. Vow**: Vows are self-directed or to a higher power.  
  - **"Binds" as Duty vs. Claim vs. Strong Reason**: Must distinguish creating a duty (owed *to* someone) from merely giving oneself a reason.  

  ### III. Conflict Analysis  
  **Smallest Unsatisfiable Set**: {**Secret Obligation (1)**, **Implementability Constraint (12)**, **Promisee-Exclusive Right (9)**}.  
  - **Why**: (1) requires bindingness without any observable effects (promisee dead, no reliance). (12) forbids relying on unobservable mental states. (9) insists only the promisee is wronged, but if they’re dead and no one observed, external verification fails.  
  - **Drop Implementability Constraint (12)**. It’s artificial and undermines the moral phenomenology of promising. Secret obligations matter precisely because they exist *beyond* social verification.  

  **Most Disqualifying Requirement**: **Secret Obligation (1)**. It eliminates theories that ground bindingness in reliance, expectation, or social consequences.  

  ### IV. Standard Theories’ Silent Concessions  
  - **Will-Based Theories** (grounded in promisor’s autonomy): Give up **Voluntariness Threshold (2)** (coercion voids consent).  
  - **Reliance/Expectation Theories** (grounded in promisee’s dependence): Give up **Secret Obligation (1)** (no reliance possible if secret).  
  - **Social Practice Theories** (grounded in communal norms): Give up **Outcome Irrelevance (7)** (norms often incorporate consequences).  

  **Your constraint (12) is the core problem**. Promising is irreducibly intentional. Drop it, or accept a reduced theory that ignores secret obligations and focuses on observable reliance. For agents, consider a hybrid: bindingness triggers when (a) intention to commit is externally signaled, and (b) counterparty acknowledges receipt. This sidesteps metaphysics but meets engineering needs.
