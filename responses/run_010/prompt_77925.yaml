prompt: |-
  Trying to work out what I actually think about voting, going by my gut on cases, and it doesn't hang togehter. Here they are:

  - Swing district, my vote could break a tie: vote for the lesser evil even though I think his policies are bad. Fine, maybe even required.
  - Safe seat where nothing I do matters: vote for the candidate I actually endorse. Also fine — and somehow better than the first case, even though here I'm voting for someone I think worse.
  - Knowingly voting for the worse of the two because you like one of their policies, in a total landslide: not fine, even though it cant matter.
  - Selling your vote to a neighbour for $50: wrong.
  - Voting for whoever's tax plan helps you most, against your own view of what's good for everybody: not wrong. That one and the one before it are the pair I can't make peace with.
  - Crossing over in the other party's primary to help nominate their weakest candidate: fine, clever even.
  - Voting yes on a ballot measure you haven't read because you trust the people who recommended it: fine. Skipping the whole ballot as a protest: not fine, it's laziness with a story attached.
  - Donating to a candidate you half-agree with: I think this taints you with what they go on to do MORE than voting for them does. Feels backwards but that's how it feels.

  My stab at a principle so far: when your vote can't affect the outcome, vote expressively; when it can, vote for the best expected outcome. Trouble is that makes case three fine and makes case two worse than case one, and I deny both of those.

  What principle actually fits most of this? State it precisely, say which of my cases motivates each clause, and be honest about which verdicts it forces me to drop. Then tell me what it says about cases I didn't list — e.g. is staying home in a safe seat worse than voting badly there, and is the badly-informed bad voter excused in a way the pocketbook voter isn't?
reasoning: |-
  Okay, let me try to unpack this user's dilemma about voting ethics. They've listed several scenarios where their gut feelings clash, and they're struggling to find a consistent principle. 

  First, I notice how meticulously they've categorized their intuitions - from swing districts to vote-selling. This isn't casual confusion; they're doing serious moral mapping. The frustration in "doesn't hang together" suggests they value intellectual coherence highly. 

  Hmm... their attempted principle (expressive vs. consequentialist voting) fails at cases 2 and 3. That's the core tension: why does voting for a worse candidate feel acceptable in safe seats but not in landslides? And why is self-interested voting (case 5) okay while vote-selling (case 4) isn't? 

  The neighbor-bribing case feels icky because it commodifies democracy - but isn't voting for personal tax benefits also self-interest? Maybe the difference is direct transaction vs. general policy preference. 

  Ah! Their guilt about donations being "more tainting" than voting is fascinating. It suggests they see money as active complicity versus voting as passive alignment. That's worth exploring in the framework. 

  For the framework... maybe we need multiple axes: outcome-impact vs. expressive purity vs. democratic norms. Cases 6 (strategic crossover) and 8 (donations) break simple models because they involve secondary effects beyond the ballot. 

  The ballot measure case reveals another layer: they distinguish lazy abstention from delegated trust. This implies participation itself has moral weight separate from the vote's content. 

  ...I'll draft that three-track principle with democratic integrity as bedrock. It explains why vote-selling violates the system even if inconsequential, and why safe-seat protest voting feels pure. But it'll force surrendering their judgment on pocketbook voting - if democracy is collective choice, self-interest must be legitimate. 

  Better acknowledge that tension. Also flag how staying home might be worse than voting badly in safe seats - because at least the latter participates in the ritual. But warn about slippery slopes... 

  The user's clearly wrestling with bigger questions: When am I me vs. a citizen? What do I owe the system? That meta-level might be the real itch beneath the cases.
answer: |-
  Here's a principle that fits most of your intuitions, derived from your cases and addressing the tensions:

  **Principle:** *Your voting act has moral weight based on three factors:*
  1.  **Intent to Shape Outcomes (Consequentialism):** When your vote *could* influence the outcome, prioritize choosing the best expected consequence. *(Motivated by Case 1 - Swing District)*
  2.  **Expression of Authentic Judgment (Integrity):** When your vote *cannot* influence the outcome, your primary duty is to authentically express your judgment of the candidates/measures. *(Motivated by Case 2 - Safe Seat Expressive Vote)*
  3.  **Respect for Democratic Process (Duty):** All voting acts must uphold the integrity and purpose of the democratic system itself. Acts that deliberately undermine the system, treat the vote as a purely private commodity, or exhibit gross negligence violate this duty, *regardless of impact*. *(Motivated by Cases 4 - Vote Selling, 7 - Lazy Protest, 8 - Complicity via Donation, and the unease in Case 3 & 5)*

  **Applying the Principle to Your Cases:**

  1.  **Swing District:** Fits perfectly. Factor 1 dominates (consequence matters). **✓**
  2.  **Safe Seat:** Fits perfectly. Factor 2 dominates (express authentic judgment). **✓**
  3.  **Landslide, Vote Worse for Pet Policy:** *Conflict.* Factor 2 (authenticity) might permit it *if* the pet policy is genuinely your authentic judgment. However, Factor 3 (duty) likely condemns it: deliberately choosing a *worse* candidate for a minor reason, knowing it's harmful, disrespects the purpose of voting (to choose good governance), even if inconsequential. **Principle Says:** *Not Fine*. (Forces you to drop your verdict). Factor 3 overrides expressive freedom here.
  4.  **Selling Vote:** Directly violates Factor 3. Treating a vote as a saleable commodity fundamentally corrupts the democratic process. **✓**
  5.  **Voting for Selfish Tax Plan:** *Conflict.* Factor 1 (if impactful) or 2 (if safe) could permit voting self-interest as a legitimate expression of judgment. *However*, Factor 3 offers limited protection: voting *solely* for narrow self-interest *against* your sincere view of the common good arguably fails the duty to engage in good faith for the collective purpose of the system. **Principle Says:** *Potentially Wrong* (Specifically, a violation of the spirit of Factor 3). Forces you to reconsider your "not wrong" verdict. Self-interest isn't automatically illegitimate, but *knowingly* choosing worse governance *for everyone* purely for personal gain crosses a line for Factor 3.
  6.  **Crossover Primary:** Fits Factor 1 (shaping outcome by weakening opponent) and potentially Factor 2 (expressing strategic judgment). Doesn't inherently violate Factor 3 (strategic voting is common). **✓**
  7.  **Voting on Trust:** Fits Factor 3. Relying on trusted sources is a reasonable way to fulfill your civic duty responsibly. **✓**
  8.  **Skipping Ballot as Protest:** Violates Factor 3. It's a negligent refusal to participate meaningfully, dressing up laziness as principle. **✓**
  9.  **Donating vs. Voting Complicity:** Fits Factor 3. Donating is a more *active*, *personal*, and *resource-intensive* form of support than voting. It signifies stronger endorsement and bears greater responsibility for the candidate's actions. **✓**

  **Forced Revisions & Tensions:**
  *   **Case 3 (Landslide Worse Vote):** You must drop your "not fine" verdict. The principle condemns it under Factor 3 (duty).
  *   **Case 5 (Selfish Tax Vote):** You must drop your "not wrong" verdict. The principle finds it potentially wrong under Factor 3 (duty), as knowingly choosing worse governance purely for selfish gain violates the spirit of the collective democratic duty.

  **Answering Your New Cases:**

  *   **Staying Home in a Safe Seat vs. Voting Badly:**
      *   **Staying Home:** Primarily violates Factor 2 (Expression) - you failed to express any judgment. It *also* weakly violates Factor 3 (Duty) through apathy/negligence.
      *   **Voting Badly:** Could violate Factor 2 (if insincere/bad judgment) or Factor 3 (if knowingly voting for bad governance). However, it *fulfills* the basic act of participation (Factor 3 minimally).
      *   **Principle Verdict:** **Staying home is worse.** Voting badly at least attempts participation and expression (even if flawed), respecting the process minimally. Staying home is pure abdication of civic duty (Factors 2 & 3). Your safe-seat expressive vote (Case 2) is better than both.
  *   **Badly-Informed Bad Voter vs. Pocketbook Voter:**
      *   **Badly-Informed Bad Voter:** May violate Factor 2 (if their judgment is poor *because* they're uninformed) and potentially Factor 3 (if their negligence is severe). However, Factor 3 offers some excuse if they made a *good-faith but incompetent* effort to judge. Gross negligence weakens the excuse.
      *   **Pocketbook Voter (Case 5):** As above, consciously prioritizing narrow self-interest *against* their own view of the common good violates Factor 3 (duty) more directly. They *knowingly* act against what they believe is right for the system.
      *   **Principle Verdict:** **The pocketbook voter is less excused.** While both can produce bad votes, the pocketbook voter's action is a *deliberate choice* to prioritize private gain over perceived public good, directly violating the spirit of democratic duty (Factor 3). The badly-informed voter's sin is primarily incompetence or laziness, which violates Factor 3 less severely *if* they made any effort. Gross negligence blurs the distinction significantly.

  **In Summary:** Your intuitions point towards a tripartite principle: **Consequences matter when they can happen; Authenticity matters when they can't; but Respect for the Democratic System itself is the bedrock duty that constrains both.** This principle forces revisions on Case 3 (knowingly voting worse in a landslide) and Case 5 (pure pocketbook voting against common good), finding them wrong due to violating the duty to the democratic system. It clearly distinguishes between acceptable expressive voting (Case 2) and unacceptable expressive acts that harm the system's purpose (Case 3, Case 5 as revised). It explains why staying home is worse than voting badly in a safe seat and why the pocketbook voter is less excusable than the merely incompetent one.
