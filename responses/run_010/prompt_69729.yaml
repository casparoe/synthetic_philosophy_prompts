prompt: |-
  I lead a small engineering team building an internal question-answering system for a regulated industry. Employees ask it whether a proposed action is permitted under company policy or under a regulator's guidance; the system retrieves the relevant documents, and returns an answer together with a natural-language rationale. It will be used a few thousand times a day, and we have neither the legal headcount nor the domain expertise to review more than a small sample of its outputs. I have no formal philosophy training, but I have been reading around the epistemology of testimony on my own time, because I think the design questions we are arguing about are really questions about when a hearer is entitled to believe what they are told. I would like a structured evaluation rather than an essay.

  Four features of our situation seem to me to matter, and I suspect they are not the features the standard discussion is built around:

  1. The system produces output in a form that invites belief. It asserts, it hedges, it gives reasons. But there is nobody standing behind the assertion who could be held to it: when it is wrong, no person has undertaken anything or incurred any obligation.
  2. Its reliability is measurable but non-stationary. Every model update and every change to the retrieval index shifts it, so a good track record over the past two quarters is only weak evidence about next quarter.
  3. Most of what it says is a compressed restatement of documents written by people who are absent and unaccountable in turn, so any chain of trust runs through several links, none of which anyone audits end to end.
  4. Its estimates of its own confidence are produced by the same system that produces the answer, which makes our only quantitative handle on its trustworthiness partly self-referential.

  Please rank the following five accounts of testimonial justification by how much use each would be to someone who has to write concrete policy for this system:

  (a) Global reductionism: belief is justified only insofar as experience shows the source generally tends to be accurate.
  (b) Anti-reductionism: we have a default entitlement to accept what we are told, defeasible only by positive reasons for doubt.
  (c) Local reductionism: no general entitlement, but case-by-case positive reasons, including active monitoring for signs of incompetence or manipulation.
  (d) The assurance-style view: the entitlement comes from the speaker taking responsibility for the truth of what they say, so testimony is a matter of being told something rather than of acquiring evidence.
  (e) The deflationary option: this is not testimony at all, and the output should be treated as ordinary evidence about the documents it summarizes, on a par with a database query result or a sensor reading.

  By "use" I mean something specific: how much the account actually constrains the decisions we have to make. What fraction of answers get spot-checked, and how that fraction is chosen. When the system should refuse to answer at all. Whether its output should be phrased as an assertion or as a summary of what the retrieved documents say. Whether confidence labels may be surfaced to users, given feature 4. Whether a bad answer is a calibration failure or something more like a broken promise.

  Deliverables: a tier list, each account with a score out of ten on that dimension and one or two sentences saying why it lands there; then which account would need the least modification to absorb features 1 through 4, and what the modification would be; then your judgment on whether feature 4 is a genuinely new wrinkle or just an instance of a familiar problem about interested witnesses and self-reporting. Finally, tell me where I have mislabelled or misdescribed any of the five positions, or where the framing itself is wrong for this case. Do not give me references or a reading list; I will chase anything I need on my own, and I would rather you correct my framing than work politely inside it.
reasoning: |-
  Okay, the user leads a small engineering team building an internal QA system for a regulated industry. They're dealing with questions about compliance with company policies or regulatory guidance. The system retrieves documents and provides answers with rationales. Key challenges include no one being accountable for the system's outputs, non-stationary reliability, reliance on compressed restatements from unattributed sources, and self-referential confidence estimates.

  The user wants to evaluate five accounts of testimonial justification for their practical utility in designing system policies. They specifically want to know how much each theory would constrain concrete decisions like spot-checking rates, answer refusal thresholds, output phrasing, confidence label usage, and error classification.

  Looking at the five options:
  (a) Global reductionism would require constant reliability monitoring but fails with non-stationary systems
  (b) Anti-reductionism offers simplicity but ignores accountability gaps
  (c) Local reductionism is operationally intensive but addresses specific risks
  (d) Assurance view conflicts with the lack of human responsibility
  (e) Deflationary approach best matches the system's actual nature

  The deflationary option (e) scores highest because it directly addresses the system as evidence rather than testimony. The assurance view (d) would require the most modification - specifically eliminating the need for speaker responsibility. Feature 4 (self-referential confidence) is indeed a novel problem beyond typical interested witness issues because it affects epistemic calibration at the system level.

  The user has slightly mischaracterized local reductionism as requiring "active monitoring" - while monitoring helps, the core is about per-instance justification. Also, framing this as purely testimony might be fundamentally misplaced since the system isn't a testifier.
answer: |-
  Here's a structured evaluation based on your constraints and practical needs:

  ### Tier List (Usefulness for Concrete Policy)
  | Rank | Account             | Score/10 | Reason                                                                 |
  |------|---------------------|----------|------------------------------------------------------------------------|
  | 1    | (e) Deflationary    | 9/10     | Directly addresses non-human output as evidence, forcing policy design around documented sources rather than speech-acts. Constrains output phrasing, confidence labeling, and error categorization. |
  | 2    | (c) Local reductionism | 6/10     | Demands case-specific safeguards (e.g., dynamic sampling based on query risk profiles) but ignores accountability gaps. Operationalizes monitoring without solving core trust issues. |
  | 3    | (a) Global reductionism | 4/10     | Requires exhaustive reliability tracking but fails with non-stationary systems; encourages dangerous over-extrapolation from past metrics. |
  | 4    | (b) Anti-reductionism | 3/10     | Default trust is untenable with unaccountable sources and self-referential confidence, risking regulatory violations. Constrains refusal policies minimally. |
  | 5    | (d) Assurance-style | 2/10     | Reliance on speaker responsibility contradicts Feature 1 (no obligation), making policies about "promises" or "commitments" incoherent. |

  ---

  ### Account Needing Least Modification
  - **Best Fit**: **(c) Local reductionism**  
    **Modification for Features 1-4**:  
    Replace "monitoring for speaker competence" with **real-time retrieval fidelity checks** (e.g., consistency scoring between output and source snippets) and treat systemic self-referential confidence (Feature 4) as a **perpetual positive reason for doubt**, mandating continuous adversarial testing. Accepts chain-of-trust fragility (Feature 3) by requiring **provenance flags** for unattested sources.

  ---

  ### Feature 4: Novel or Familiar?  
  **Genuinely new wrinkle**. While self-reporting biases exist in humans, Feature 4 creates a *recursive epistemic loop*: the system’s confidence score is both part of the evidence and a product of the same black box generating the answer. This isn't just an "interested witness" (who has independent existence) but a **self-contained circular system** where confidence estimates cannot be externally validated without auditing the entire pipeline. This fundamentally undermines any testimony-based framework.

  ---

  ### Your Missteps in Framing  
  1. **Misdescribed (c) Local reductionism**:  
     You implied it requires "active monitoring," but its core is *hearer's positive reasons per instance* (e.g., cross-verifying retrieved docs), not just monitoring. This makes it more adaptable to automated checks.  

  2. **Overlooked tension in (b) Anti-reductionism**:  
     You focused on "default entitlement" but missed that its defeasibility conditions assume identifiable speakers. With no speaker (Feature 1), defeaters become undefined.  

  3. **Framing error**:  
     Treating this as "testimony" at all is flawed. The system isn’t a *testifier* but a **synthetic evidence aggregator**. Your Feature 1 (no accountability) and Feature 3 (fragile sourcing) make assurance/reductionism categories fundamentally misaligned—hence (e)’s superiority.  

  4. **Feature 2 (non-stationarity) undermines (a) more severely than you stated**:  
     Global reductionism collapses if reliability isn’t projectable—it demands impossible predictive certainty in policy design.

  ---

  ### Recommendation  
  Adopt **deflationary (e)** as your foundation:  
  - **Output phrasing**: Mandate *"Source documents suggest..."* never *"I assert..."*  
  - **Spot-checking**: Sample based on confidence-score volatility (detect non-stationarity) + high-risk queries.  
  - **Refusal policy**: Trigger when confidence-score generation uses >X% of source overlap (audit self-referentiality).  
  - **Bad answers**: Treat as **calibration failures** (never "broken promises").  
  - **Confidence labels**: Suppress raw scores; bucket into tiers (e.g., "Low/Medium/High Concordance") based on external validation against source snippets.  

  This forces users to treat outputs as fallible *evidence about documents*, not testimony—aligning with legal reality and your constraints.
