prompt: |-
  So I just spent about four hours arguing with my friend Raj about the Great Divergence and I've come away way more confused about the *shape* of the argument than about the actual history. He's very much a "compare England to the Yangzi Delta, look at coal and wages and empire" guy, and I'm more of a "you're describing Britain's good luck and then calling it a cause" guy. We got nowhere. But the thing I kept throwing at him and he kept just not registering is a pattern I don't have a name for, and I want to know whether it has one. I'm a data analyst, not an academic, so go easy on me if this is all super well known.

  The pattern: somebody asks "why did X happen and not Y?", and it turns out the answer depends completely on how you write down the X — not the Y, the X. Same historical event, different perfectly reasonable description of it, different set of near-misses that count as the relevant alternatives, different causes, and the causes you get can straight up contradict each other. Concretely, with Raj: "why England and not the Yangzi Delta." If the thing-to-be-explained is "mechanised cotton spinning shows up in Lancashire in the 1780s," then the live causes are cheap coal sitting next to navigable water, oddly high wages relative to fuel, and slave-grown cotton. If the thing-to-be-explained is "output per person starts rising every year and never stops," then it's property rights, courts, the scientific culture, and high wages barely register at all. If it's "escape from an organic, land-constrained economy," then it's basically energy and ghost acres and the institutions story becomes noise. All three are supposed to be the same question. Each one silently makes a different contrast class the interesting one (France, the Song, India, the Netherlands, Rome) and each one promotes different facts to causes and demotes others to background. And Raj would grab whichever description made his favourite cause load-bearing, and when I pushed on it he'd slide to a different description without seeming to notice he'd done it, and the argument just kept regenerating because there was never a fixed thing being explained.

  It's not only history, which is why I think it's a general pattern and not just "historians are sloppy." Same structure in an argument I was in about a startup beating its rival: "beating" as in didn't go bankrupt → timing and a lucky funding round; "beating" as in ended up with 80% of the market → network effects and a distribution deal; "beating" as in created a category that didn't exist → the product. Three explanations, mutually pretty hostile, all answering "why them and not the other guy." Also: my brother and I once had a genuinely nasty conversation about "why did he end up a doctor and not me," and it turned out I meant "in medicine" and he meant "financially secure," and once we noticed that the whole two-year resentment sort of dissolved, which was annoying because I'd kind of been enjoying it.

  So — is there an established concept for this, and if not, what would you call it? Here's what I've already bumped into and why none of it quite fits, because I'm not looking for a bare label, I want the edges. Contrastive why-questions and foils: that's about the hidden "rather than Q" term and about relevance, but here the instability is in the P side, and the Q shifts only as a downstream consequence. Grain-sensitivity of explanations, and macro-vs-micro: close, but that's usually about how much detail an explanation ignores, whereas mine is about two explanations at *different* grains each claiming to answer one question. Screening off, INUS conditions, causal selection, the normal/abnormal-condition business: these tell you how to pick among causes once the explanandum is fixed, and my problem is that it isn't. Reference class problem: that's about estimating probabilities, and this happens even when nobody's putting numbers on anything. Equivocation: no, because nobody's using one word with two meanings — "industrialised," "rich," "escaped Malthus" are all honourable descriptions. Motte and bailey: no defensible core and no indefensible extension. Moving the goalposts: the standard of evidence isn't being changed, the thing being explained is. What I most want carved out is the *sliding* version specifically — using description-shifts to keep a pet cause relevant — because a natural reply is "well, every explanation is relative to a description, that's just how explanation works, so what's the complaint?" and I can't articulate why the sliding case is worse than the ordinary case. Is there some requirement you could put on a why-not question for it to be well posed, something like the answer having to be stable across the descriptions of the fact that the questioner would accept? Where does that requirement break down, and what are the boundary cases between a legitimate re-specification ("actually I was asking about growth rates, not the spinning jenny, let me be precise") and the bad slide? Two or three made-up examples of each would help me more than definitions.
reasoning: |-
  Okay, the user is describing a pattern where the explanation for why something happened depends entirely on how the event (X) is described. They gave examples from a debate about the Great Divergence, a startup's success, and a personal disagreement. The core issue is that different descriptions of X lead to different contrast classes (Y), which then highlight different causes. The user wants to know if there's a term for this and how to distinguish legitimate re-specification from problematic sliding.

  First, I need to recall relevant philosophical concepts. The user mentioned contrastive explanations, where "why P rather than Q" sets the context. But here, the problem is with P being described differently, which changes Q implicitly. So it's not just about Q but how P is framed.

  They also mentioned grain-sensitivity, which is related. Explanations can vary based on the level of detail. But the user points out that here, different grains are treated as answering the same question, leading to conflicting causes. That's a key distinction.

  Next, causal selection and INUS conditions (insufficient but necessary parts of unnecessary but sufficient conditions) focus on selecting causes once the explanandum is fixed. Here, the explanandum itself isn't stable. The reference class problem is about probability estimation, which isn't the issue here. Equivocation involves word meanings, but the user says the descriptions are all valid, not ambiguous terms.

  The user wants to differentiate between legitimate clarification and problematic sliding. For example, clarifying whether the question is about mechanization vs. sustained growth is legitimate. But shifting descriptions mid-argument to favor a pet cause is the problem. That sliding prevents resolving the debate because the goalposts move without acknowledgment.

  I remember that in philosophy, the "explanatory frame" or "contextualism" might relate. But the term "explanandum plasticity" comes to mind—how the thing to be explained morphs. However, "plasticity" might be too vague. "Contrast class drift" could work, but it emphasizes Q over P. The user noted that P's description changes first, causing Q to shift.

  Another angle: "causal framing effect." Similar to framing in psychology, where how a problem is presented affects decisions. Here, framing X differently changes the perceived causes. But I need a term that captures the dynamic aspect, especially the unacknowledged shifts.

  The user also mentioned the personal example with their brother. When they realized "doctor" meant different things (profession vs. financial security), the conflict resolved. That highlights that clarifying the description can dissolve misunderstandings. So the issue is when such clarification doesn't happen, and shifts are covert.

  In the Great Divergence example, Raj slides between descriptions to keep coal/wages relevant. Each shift changes what counts as a near-miss (Netherlands vs. Song Dynasty). So the problem is the lack of anchoring the explanandum. A well-posed question requires agreeing on which aspects of X are essential and which contrasts matter. Without that, the explanation becomes unstable.

  Possible terms:
  - **Explanandum Ambiguity**: The thing being explained is underspecified.
  - **Contrastive Instability**: The foil changes due to P's description.
  - **Causal Relativity to Description**: Causes depend on how P is defined.
  But the user wants a term for the sliding behavior, not just the dependency. 

  **Dynamic Explanatory Drift**: Emphasizes the shifting nature. Or **Covert Re-specification of the Explanandum**. 

  For the requirement of a well-posed question: The explanandum must be specified with enough precision that the relevant contrast class is stable. The causes should be robust across reasonable descriptions of P. If different descriptions lead to contradictory causes, the question needs refinement.

  Boundary cases:
  - **Legitimate**: Clarifying whether the focus is on the invention's appearance vs. sustained growth. Acknowledging that different facets have different causes.
  - **Problematic**: Shifting from "why mechanization in England" to "why sustained growth" without notice when challenged, to maintain a preferred cause.

  The user's deeper need might be to identify when an argument is unproductive due to unacknowledged shifts and how to anchor discussions. They might also seek validation that this is a recognized issue beyond their experiences, providing a framework to detect and prevent such slides in future debates.
answer: |-
  You've hit on a profound and under-discussed problem in causal reasoning—one that straddles philosophy of science, historiography, and everyday arguments. The core issue isn't just that explanations depend on descriptions (which is universal), but that **unacknowledged shifts in how we frame the *explanandum* (the thing to be explained) covertly redefine the contrast class, causal priorities, and even what counts as "the same event."** This sliding isn't mere description-dependence; it's a *rhetorical maneuver* that protects pet theories by reframing success criteria mid-debate. There's no universally accepted term for this, but I'll synthesize concepts to carve out its edges and propose a name. Let's break it down.

  ### Core Pattern: **Explanandum Drift**
  Call it **Explanandum Drift** (or **Frame-Slippage**). This occurs when:
  1. A question asks "Why X and not Y?"  
  2. The *description of X* is ambiguous or multifaceted.  
  3. Shifting the description of X implicitly redefines:  
     - The relevant *contrast class* (what counts as a "near-miss" alternative).  
     - The *salient causes* (what factors are "load-bearing" vs. background).  
  4. This shift happens *covertly* during debate, making the argument unresolvable because the goalposts move without acknowledgment.  

  Your examples nail it:  
  - **Industrial Revolution**:  
    - Frame 1: *"Mechanized cotton spinning in 1780s Lancashire"* → Contrast: Yangzi Delta/France. Causes: Coal, wages, slavery.  
    - Frame 2: *"Sustained per-capita growth"* → Contrast: Song Dynasty/Dutch Golden Age. Causes: Institutions, science.  
    - Frame 3: *"Escape from land constraints"* → Contrast: All pre-industrial societies. Causes: Energy/ghost acres.  
    - **Drift**: Raj slides frames to keep "coal" relevant. If you challenge coal under Frame 2, he invokes Frame 1.  

  - **Startup success**:  
    - Frame 1: *"Avoided bankruptcy"* → Contrast: Failed rivals. Cause: Lucky funding.  
    - Frame 2: *"Captured 80% market share"* → Contrast: Direct competitors. Cause: Network effects.  
    - Frame 3: *"Created a new category"* → Contrast: Industry incumbents. Cause: Product innovation.  
    - **Drift**: Defending "why us?" by switching frames when a cause is critiqued.  

  - **Personal conflict**:  
    - Frame 1: *"Works in medicine"* → Contrast: Your career path. Cause: Interest/skill.  
    - Frame 2: *"Is financially secure"* → Contrast: Your financial state. Cause: Career choice/luck.  
    - **Resolution**: Fixing the frame dissolved the conflict.  

  ### Why "Drift" is Worse Than Ordinary Description-Dependence
  Ordinary explanation accepts that framing matters—but **drift** is pathological when:  
  - **It's defensive**: Shielding a favored cause by reframing X *only when challenged*.  
  - **It's unacknowledged**: The slider doesn't admit the reframing (unlike legitimate clarification).  
  - **It creates contradiction**: Causes that explain Frame 1 may be irrelevant or antithetical to Frame 2 (e.g., "high wages" as cause vs. background).  
  - **It precludes resolution**: By never fixing X, the debate regenerates infinitely.  

  ### Boundary: Legitimate Re-Specification vs. Pathological Drift
  A why-not question is well-posed when the **explanandum is pinned to a specific aspect of X**, with explicit contrasts. Legitimate re-specification *narrows* the frame; pathological drift *shifts* it to evade counterarguments.  

  #### Legitimate Cases (Stable Contrasts)  
  1. **Clarifying scope**:  
     - *Initial Q*: "Why did England industrialize first?"  
     - *Re-specification*: "Actually, I mean *sustained productivity growth*, not just cotton tech."  
     → **Contrast fixed**: Now explicitly vs. the Dutch (who had tech but not growth).  
     → **Cause change valid**: Institutions become central, coal demoted.  

  2. **Disambiguating success**:  
     - *Initial Q*: "Why did Startup A beat Startup B?"  
     - *Re-specification*: "I care about *market dominance*, not survival."  
     → **Contrast fixed**: Now vs. all rivals in the same market.  
     → **Cause change valid**: Network effects highlighted, luck downplayed.  

  #### Pathological Drift (Unstable Contrasts)  
  1. **Evading counterevidence**:  
     - *You*: "If coal caused growth, why didn’t the Netherlands (with similar resources) industrialize?"  
     - *Raj*: "But England uniquely had *steam-powered factories*!" (Shifts frame to technology adoption).  
     → **Contrast drifts**: Netherlands (no coal factories) replaces Yangzi (no sustained growth).  
     → **Cause preserved**: Coal remains central despite your challenge.  

  2. **Redefining success**:  
     - *You*: "Your startup’s ‘luck’ was just timing—others had the same product."  
     - *Founder*: "But we *created the category*!" (Shifts frame to innovation).  
     → **Contrast drifts**: From direct rivals to hypothetical non-innovators.  
     → **Cause preserved**: "Product genius" salvaged.  

  3. **Moral/personal equivocation**:  
     - *You*: "Why did Dad praise your career but not mine?"  
     - *Brother*: "He just values *financial responsibility*!" (Shifts frame from profession to stability).  
     → **Contrast drifts**: From "medicine vs. your field" to "stable vs. unstable jobs."  
     → **Cause preserved**: "Dad’s rationality" intact, your resentment obscured.  

  ### Theoretical Anchors & Gaps
  - **Contrastive Explanation** (van Fraassen, Lewis): Why P *rather than Q*? But drift abuses this by altering P to force a favorable Q.  
  - **Causal Selection** (Hart & Honoré): How we pick "the cause" from conditions. But drift changes *what event* needs explaining.  
  - **Grain-Sensitivity** (Ylikoski): Explanations vary by detail level. But here, frames aren’t granularity levels—they’re *different aspects* of X (tech vs. growth vs. energy escape).  
  - **INUS Conditions** (Mackie): Causes are "insufficient but necessary parts of unnecessary but sufficient conditions." Drift rewrites what counts as "the condition."  

  No existing concept fully captures the *dynamic, defensive* slide you describe. **Explanandum Drift** fills this gap by focusing on how redefining P smuggles in new contrasts and causes.  

  ### How to Combat It
  1. **Pin the frame**: "What *exact aspect* of X are we explaining? Mechanization, growth, or energy escape?"  
  2. **Fix the contrast**: "Compared to *whom*? France? The Song? The Netherlands?"  
  3. **Test cause robustness**: "Does your ‘coal’ theory explain why the *Dutch* didn’t achieve sustained growth?"  
  4. **Call out shifts**: "You started asking why growth happened, but now you’re talking about spinning jennies. Which is it?"  

  Your frustration is justified: this drift masks substantive disagreement as verbal confusion. It’s not "sloppy history"—it’s a universal trap in causal reasoning. Naming it (Explanandum Drift) is the first step to taming it.
