prompt: |-
  I cover science and ideas for a magazine, and I've been trying to get my head around the philosophy arguement about moral testimony — the claim that there's something fishy about taking another person's word on a moral question even when they're way more trustworthy than you are. No philosophy training here, but twenty years in newsrooms, so I want you to translate the whole thing into the vocabulary I actually live in: sourcing, verification, on the record versus on background, single-source stories, "trust me" quotes, the difference between reporting a claim and vouching for it.

  Take the main positions one at a time and render them in those terms: the puzzle of why moral testimony supposedly differs from testimony about the weather or about a bridge's load rating, the view that believing on someone's say-so is legitimate but doesn't get you to understanding, and the view that there's no real difference at all and the puzzle is manufactured. Keep the translation honest — don't just relabel journalism norms and call it philosophy.

  Then the part I care about most: tell me what didn't survive. Which claims map cleanly onto sourcing practice, which ones you had to bend to fit, and which ones my profession definately has no word for. And give me your read on whether that residue is a gap in newsroom vocabulary or evidence the philosophers are fighting over something thinner than it sounds.

  Exactly five numbered points, a sentence or two each, no intro and no wrap-up. American English please, and no reading list — I can't chase citations.
reasoning: |-
  Okay, the user is a science and ideas journalist with two decades of newsroom experience but no formal philosophy training. They want me to translate the moral testimony debate into journalism terms like sourcing, verification, and quoting practices. 

  Hmm, they specifically asked for five numbered points without intros or wrap-ups. Need to stick to that rigidly. The challenge is mapping abstract philosophy concepts onto concrete newsroom practices without distorting either. 

  First, the core puzzle: why moral testimony feels different than factual testimony. In journalism terms, it's like getting a source to vouch for "this bridge is safe" versus "this policy is unjust." The former can be verified through engineering reports, the latter relies on the source's moral authority - which is trickier to source-check. 

  Second perspective: believing moral testimony without understanding. This maps cleanly to "reporting a claim" without endorsing it - like quoting an ethicist on background about corporate wrongdoing. The journalist can publish it but doesn't personally grasp the moral reasoning. 

  Third view: no real difference. This clashes with newsroom instincts because journalists treat empirical claims and value judgments differently in verification. You'd never fact-check a weather report the same way you'd "fact-check" whether something's immoral. 

  Now the residue analysis: The "bending to fit" happens with the "understanding vs belief" distinction. Journalists care about attribution accuracy, not whether the reporter internally comprehends the moral argument. That's a philosophical luxury in deadline-driven work. 

  The true gap is in "moral deference aversion" - that instinctive discomfort journalists feel when just parroting moral judgments, even from experts. Newsrooms have no term for this because their epistemology is practical, not introspective. The philosophy debate exposes a tension journalists feel but don't name.
answer: |-
  1.  **The Puzzle (Why Moral Testimony Feels "Fishy"):** Imagine a source gives you a definitive, on-the-record statement about a bridge's load capacity. You verify their engineering credentials, cross-check with blueprints, and publish. Now, imagine the same impeccable source gives you an equally definitive, on-the-record statement like "Policy X is fundamentally unjust." Verifying their integrity is easy, but verifying *the claim itself* feels different – there's no blueprint for injustice. The "fishiness" is that while you can report their judgment credibly, relying *solely* on their say-so for the moral truth feels like bypassing your own editorial duty to understand *why* it's unjust, unlike the bridge calculation where understanding the math isn't required for accurate reporting.
  2.  **Belief Without Understanding:** You can absolutely report a respected ethicist's on-background comment condemning a corporate practice as exploitative, attributing it properly ("According to leading ethicist Dr. Y..."). Your piece accurately transmits the claim, and readers believe it based on the source's authority (legitimate belief). However, *you* personally might not grasp the specific ethical framework (e.g., Kantian vs. Utilitarian) justifying the condemnation. Philosophically, you lack "understanding" – you can't explain the *reasons* yourself, only report the expert's conclusion. This maps to using a "trust me" quote ethically (with proper sourcing) but not necessarily internalizing the reasoning.
  3.  **No Real Difference (The Puzzle is Manufactured):** Some argue sourcing a moral claim like "This war crime violates international law" operates identically to sourcing "This material melts at 1000°C." If your source (e.g., an international law scholar or a materials scientist) is rigorously vetted and credible on the record, their testimony *is* the verification for that claim within your reporting. Demanding extra "moral understanding" from the journalist is like demanding they personally replicate the melting point experiment – unnecessary for accurate reporting based on authoritative sourcing. The "fishiness" is just misplaced skepticism about expertise in value-laden domains.
  4.  **What Maps Cleanly:** The core journalistic practices of **source vetting (credentials, track record), proper attribution (on-record/background), and distinguishing reporting a claim from endorsing it** map directly. The philosophical concern about relying *solely* on testimony aligns with journalistic aversion to **single-source stories for major claims**, especially complex/value-laden ones, without seeking corroboration or deeper context.
  5.  **The Residue & The Gap:** The insistence on **personal "understanding" versus accurate reporting of sourced belief** bends journalism norms. Newsrooms prioritize accurate transmission and sourcing over the reporter's internal comprehension of complex arguments (philosophical or scientific). The truly foreign concept is **"moral deference aversion" itself** – the deep philosophical discomfort that merely *reporting* a well-sourced moral judgment, without personally grasping its justification, is somehow deficient *epistemically* (in how we know it). Newsrooms have no vocabulary for this internal epistemic lack because their standard is practical reliability (is the sourcing sound?) not personal philosophical comprehension. This suggests the residue points to a genuine philosophical tension about knowledge and value that journalism's practical epistemology sidesteps, rather than being entirely "thin."
