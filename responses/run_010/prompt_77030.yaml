prompt: |-
  You're a moral philosopher who works on the emotions — specifically the guilt/shame debate — and you've read both the philosophy (the shame-is-more-basic line, the honor-and-face stuff from anthropology) and the clinical psychology. No lit review, no citations, no reading list: I want the principle.

  Here's what I'm trying to work out. I have a pile of verdicts about when shame and when guilt are the *fitting* response, accumulated over years of arguing with friends and myself, and I can't see what they add up to. Some are obvious, some I'm unsure of, and I'm fairly confident at least one pair is just inconsistent. I'd rather you tell me which than save them all with something baroque.

  The cases. (F = fitting, U = unfitting. Where I list both emotions, the question is which of the two fits.)

  1. A surgeon realizes, ten years later, that a diagnostic error of hers probably cost a patient years of life. Nothing in the record shows it and no one will ever find out. Guilt: F. Shame: U. She did a bad thing; she isn't thereby a bad doctor or a bad person, and shame smuggles in a claim about her worth that the facts don't support.

  2. Same surgeon, but the error turns out to be continuous with something she already knew about herself: she rushes histories becuase she finds patients tedious. My verdict flips. Shame: F, and arguably more fitting than guilt, because what's been exposed is a standing feature of her rather than an episode.

  3. A man with severe depression, unemployed for a year, feels deep shame about the state of his flat — the dishes, the smell. Shame: U. Not his doing; it's the illness and the situation talking. And guilt would be even more obviously unfitting, so this is a case where I want to say *neither* emotion fits.

  4. The same man feels shame about his body. Here I give the opposite verdict: the shame is tracking something real, so I won't call it unfitting — and yet I'd argue him out of it, and I'd think it good for him if I won. So fittingness and whether-you-should-feel-it come apart.

  I know 3 and 4 look like the same kind of case (non-chosen, standing, bodily-cum-situational feature of the self) getting opposite verdicts. That's the pair I most want you to press on.

  5. A woman who was bullied at fourteen still feels shame remembering how she begged them to stop. Shame: U — and note there's no act here for guilt to attach to, so it isn't that guilt takes over. Then the second layer: she's ashamed of having been ashamed. Both layers U.

  6. A man cheats on his partner and feels intense shame but no guilt at all. I think this is a recognizable profile and a bad one: shame without guilt produces concealment and self-protection where guilt would produce repair. So shame is F in the sense that it tracks the real defect, guilt is F and missing, and the whole configuration is pathological.

  7. A soldier who did exactly what he was trained and ordered to do, lawfully, and who feels no guilt but profound shame. Guilt: U. Shame: F. This is the case that makes me distrust the usual story that guilt is the mature ethical emotion and shame the primitive one.

  8. My father makes a racist joke at a dinner I'm hosting. I feel shame, not guilt, and I call it fitting. But if my closest friend makes the identical joke at the identical dinner, what I feel is embarrassment, and I'd call shame there unfitting. The only difference is that one of them is *mine* — family. I can't ground that and I suspect it's a prejudice, but I don't want to give it up either.

  9. Someone decides against cheating on an exam, then fails it, and feels shame about having been on the verge. F. Guilt: U, no wrong was done; the shame is about what was in him.

  10. Survivor guilt — say, the sibling who lived. And separately: a woman who feels a flash of relief when her mother finally dies after four years, and feels guilty about the relief. In both, guilt U and shame worse, and yet I want to keep survivor guilt around as somehow *valuable* even while calling it unfitting. That's the second place where fittingness and value come apart for me, and this time it's guilt doing it, not shame.

  11. My one cultural claim, tentative. Suppose a society has the practices and vocabulary for shame but effectively none for guilt — no confession, no apology as repair, no making-amends script; instead honor, standing, face, being seen. My verdict: this changes the *shape* of moral life there (what gets done after a wrong, and who has to be involved) but not which responses are fitting. So a culture can choose its emotional repertoire but not the facts that make responses fitting. I want to know whether that's coherent, or whether "fitting" has already been smuggled in from my own culture.

  What I want from you:

  - First, brainstorm out loud: three or four genuinely different candidate principles before you commit to any. Include at least one that is not a version of "guilt is about acts, shame is about the self," because that formula already fails me on 7 and 8 and doesn't separate 1 from 2 without extra machinery.
  - Then pick or construct the best one. State it precisely, clause by clause, and for each clause say which case above motivated it and what the clause would look like if you deleted it.
  - Run it over all eleven cases and report the score honestly. Where it disagrees with me, say whether you think my verdict should go or the clause should. I'd rather lose 8 (the family one) and maybe 4 than end up with six epicycles.
  - Then give me its verdicts on four cases I haven't listed: shame about having been praised for something you don't think you earned; guilt about your own tastes, e.g. loving a film you find morally repulsive; shame in someone who genuinely has no internal audience, no imagined spectator at all; and group shame for a country's history felt by someone born after the events.
  - Finally, the two meta-questions. Does your principle make shame more ethical than guilt, or less — does it vindicate case 7 against the usual story? And in what sense, if any, can a culture choose, given that you've made fittingness independent of the culture's choices? Is there a residual sense in which a culture could be *wrong* about its own emotions, and would 11 then be a claim about them or about us?

  Think carefully about 3 vs 4 and about 10, because I suspect whatever handles those two handles everything else. Length: as long as it needs to be, but no throat-clearing and no summary of my cases back at me.
reasoning: |-
  Okay, this user is a moral philosopher specializing in emotions, specifically the guilt/shame debate. They've presented eleven nuanced cases where they've judged whether shame or guilt is fitting, and they're struggling to find an underlying principle that unifies their verdicts. The cases highlight tensions, especially between cases 3 and 4 (both involve non-chosen states but get opposite verdicts) and case 10 (where survivor guilt is deemed unfitting but valuable).

  Hmm, the user explicitly rejects the simple "guilt=acts, shame=self" formula since it fails on cases like the soldier (7) or family shame (8). They want principles that can handle cultural independence of fittingness (case 11) while acknowledging cultural shaping of emotional repertoires. The depth here is impressive—they're wrestling with meta-questions about whether cultures can be "wrong" about emotions.

  Right, first I need to brainstorm principles beyond the obvious. Let's avoid regurgitating Williams/Taylor/Nussbaum. Four candidates come to mind: 
  1) Control principle: guilt fits controllable actions, shame fits unchosen exposures. But this fails case 4 (body shame fitting despite lack of control). 
  2) Relational principle: guilt breaches obligations, shame breaches identities. Tempting, but messy for case 6 (cheating involves both). 
  3) Self-assessment principle: guilt evaluates deeds, shame evaluates worthiness of regard. Closer, but needs refinement for case 3 (depression-induced shame deemed unfitting). 
  4) Exposure principle: shame fits when a flaw is *revealed* (not just exists), guilt fits when harm is *done*. Ah—this might handle the surgeon cases (1 vs 2) and the soldier (7).

  *Pauses* The exposure principle feels strongest, especially with a twist: shame responds to perceived threats to one's status as an acceptable self/group member, while guilt responds to causal responsibility for unjustifiable harm. Worth testing clause-by-clause. 

  For clause motivation: 
  - "Perceived threat to acceptability" covers case 2 (surgeon's pattern) vs case 3 (depression isn't acceptability-threatening). 
  - "Causal responsibility" nails case 1 (surgeon's error) and excludes case 10 (survivor guilt unfitting). 
  - "Unjustifiable harm" handles case 7 (soldier's lawful act isn't unjustifiable). 

  Running through all cases: 
  - Case 4 (body shame) is tricky. If body shame stems from *socially imposed* unacceptability (not mere existence), it's fitting per principle—but the user wants to argue against feeling it. Hmm, principle holds, user's verdict might bend. 
  - Case 8 (family shame) fails: why is *my* father's joke a threat to *my* acceptability? Principle deems shame unfitting; user should drop this verdict. 
  - Case 10: survivor guilt unfitting (no causation), but its value lies elsewhere—principle vindicated. 

  New cases: 
  - Shame over unearned praise? Fitting per principle (threat to acceptability if exposed). 
  - Guilt over tastes? Unfitting (no harm caused). 
  - Shame without audience? Possible if self-regard is internalized. 
  - Group shame? Fitting if identity-based (acceptability threatened by group's past). 

  Meta-answers: 
  - Shame isn't less ethical than guilt (vindicates case 7). Both track real moral features. 
  - Cultures can choose *which* emotions to cultivate, but not what makes them fitting—so yes, a culture could be "wrong" if it deems shame fitting where no threat exists, or guilt where no harm was done. Case 11 stands: fittingness is culture-independent. 

  *Sigh* The hardest trade-off: case 4 (body shame) is deemed fitting by the principle, but the user wants to reject the feeling. Solution: distinguish fittingness from health/utility. Body shame *tracks* real social exclusion (so fitting) but combating that exclusion is morally urgent. No inconsistency. 

  Final principle holds well—only case 8 must be surrendered. Small price for coherence.
answer: |-
  ### Brainstormed Candidate Principles  
  *(Rejecting "guilt=acts/shame=self" as insufficient)*  

  1. **The Exposure Principle**:  
     Shame fits when a *perceived flaw in the self* (trait, identity, affiliation) is **exposed** or threatens social/moral standing. Guilt fits when **causal responsibility** for unjustifiable harm/breach occurs.  
     *Why?* Separates "what I did" (guilt) from "what was revealed about me" (shame), handles cases 7 (soldier: exposure of vulnerability), 2 (surgeon: exposed pattern), 8 (family: exposure via affiliation).  

  2. **The Accountability Principle**:  
     Guilt fits **voluntary actions** that violate obligations. Shame fits **involuntary associations or traits** that violate shared ideals of personhood.  
     *Why?* Focuses on control vs. passivity. Explains 3 (depression: involuntary, shame unfitting) but fails 4 (body shame: involuntary yet fitting?) and 7 (soldier: act voluntary, shame fits).  

  3. **The Regard Principle**:  
     Shame fits when one’s **worthiness of regard** (by self/others) is undermined. Guilt fits when one **fails to regard others** justly.  
     *Why?* Centers relational status. Explains 1 (surgeon: no worthiness undermined) vs. 2 (surgeon: worthiness as doctor undermined), and 9 (shame over unacted impulse: self-regard threatened).  

  4. **The Harm/Identity Principle**:  
     Guilt fits **harmful outcomes** (actual or intended). Shame fits **identity disjunction** (gap between "who I am" and "who I should be").  
     *Why?* Distinguishes consequences from self-concept. Handles 6 (cheating: harm + identity breach) and 10 (survivor guilt: no harm caused).  

  ---

  ### Selected Principle: **The Exposure Principle** (Refined)  
  *Clauses & Motivations:*  

  1. **Shame is fitting** when a feature of the self (trait, identity, affiliation) **exposes one as falling short of a standard** necessary for social/moral acceptability *and* this exposure threatens one’s standing.  
     *Motivated by:* Cases 2 (surgeon’s pattern exposed), 4 (body shame: social acceptability threatened), 7 (soldier: vulnerability exposed).  
     *Delete clause?* Without "threatens standing," shame would fit *any* shortcoming (e.g., bad hair day)—contradicts 3.  

  2. **Guilt is fitting** when one is **causally responsible for unjustifiable harm or violation** (act/omission).  
     *Motivated by:* Cases 1 (surgeon’s error causes harm), 6 (cheating harms partner), 10 (survivor guilt: no causation → unfitting).  
     *Delete clause?* Without "unjustifiable," guilt would fit unavoidable acts (e.g., self-defense)—contradicts 7.  

  3. **Neither fits** when the emotion misattributes responsibility (guilt) or misidentifies a threat to standing (shame).  
     *Motivated by:* Case 3 (depression: no flaw exposed), 5 (shame over victimhood: no shortcoming).  

  ---

  ### Principle Tested on Your Cases  
  | Case | Your Verdict | Principle’s Verdict | Conflict Resolution |  
  |------|--------------|---------------------|---------------------|  
  | 1    | Guilt F, Shame U | **Match** | Guilt: causal harm. Shame: no exposure/acceptability threat. |  
  | 2    | Shame F | **Match** | Pattern exposes her as falling short (threat to doctor identity). |  
  | 3    | Shame U | **Match** | No flaw exposed; illness isn’t a moral shortcoming. |  
  | 4    | Shame "not U" | **Shame F** | *Conflict*: Body shame fits if society ties body to acceptability (exposure threat). **Your verdict should go**: fittingness ≠ health (per your note). |  
  | 5    | Shame U (both) | **Match** | No shortcoming (begging isn’t flaw); second-layer shame misattributes. |  
  | 6    | Shame F, Guilt F (missing) | **Match** | Shame: identity breach exposed. Guilt: harm caused → *should* feel both. |  
  | 7    | Shame F, Guilt U | **Match** | Shame: exposure of vulnerability/fallibility. Guilt: no unjustifiable harm. |  
  | 8    | Shame F (family) | **Shame U** | *Conflict*: Father’s act exposes *his* flaw, not yours (unless you endorse it). **Your verdict should go**: cultural bias ("mine" ≠ "me"). |  
  | 9    | Shame F, Guilt U | **Match** | Shame: impulse exposes flawed character. Guilt: no harm done. |  
  | 10   | Guilt U (but "valuable") | **Match** | Guilt unfitting (no causation). Value ≠ fittingness (e.g., motivates solidarity). |  
  | 11   | Fittingness culture-independent | **Match** | Principle uses universal criteria (causation, exposure, acceptability standards). |  

  **Score**: 9/11 agreements. Conflicts: **4** (shame fitting), **8** (shame unfitting).  

  ---

  ### New Cases & Verdicts  
  1. **Shame about unearned praise**:  
     - **Shame F**. Praise exposes a gap between perceived/actual worth (threat to self-regard).  

  2. **Guilt about loving a morally repulsive film**:  
     - **Guilt U**. No harm caused; shame *might* fit if it exposes a conflict in values (e.g., "I should hate this").  

  3. **Shame without an internal audience**:  
     - **Possible**. Shame can target *self*-acceptance (e.g., "I fall short of my own standard"). Fitting if standard is coherent.  

  4. **Group shame for country’s history**:  
     - **Shame F** *if* identity is tied to group. Exposure of shared flaw threatens moral standing (e.g., "complicit by affiliation").  

  ---

  ### Meta-Answers  
  **1. Ethical status of shame vs. guilt**:  
  Shame is *not* less ethical. It tracks **identity/relational breaches** (case 7: soldier’s shame over complicity in systemic violence); guilt tracks **individual harm**. Shame can be more fundamental (e.g., motivating guilt). Vindicates case 7 against "shame=primitive" narratives.  

  **2. Cultural choice & fittingness**:  
  - Cultures **choose** which emotions to *cultivate*, which standards define "acceptability," and which affiliations matter (e.g., case 8: family ties).  
  - But they **cannot choose** what makes an emotion *fitting*. If a culture lacks guilt scripts (case 11), it may still be fitting for harm-causers (e.g., cheating spouse) to feel guilt—they’re just deprived of the vocabulary.  
  - **Can cultures be wrong?** Yes:  
    - If they deem shame fitting for non-exposed/non-flawed states (e.g., case 3: shaming the depressed).  
    - If they deem guilt unfitting for clear harm (e.g., case 6: cheating without guilt).  
  - Case 11 is **about them**: fittingness is objective; the claim is that their *repertoire* is inadequate to moral reality.  

  ---

  ### Why This Works  
  - **Solves 3 vs. 4**: Case 3 (depression) has no flaw; case 4 (body) *does* if society ties bodies to worth. Fittingness ≠ desirability.  
  - **Handles 10**: Guilt unfitting (no causation), but valuable for other reasons (e.g., moral sensitivity).  
  - **Drops 8** cleanly: Your family shame verdict was inconsistent; the principle forces coherence.  
  - **No epicycles**: Exposure + causation cover all cases without ad-hoc fixes.  

  **Final Principle**:  
  > *Shame* is fitting when a trait/identity/affiliation **exposes a shortfall in standards for acceptability**, threatening standing.  
  > *Guilt* is fitting when one is **causally responsible for unjustifiable harm**.  
  > *Neither* fits when the emotion misattributes the source (shame) or agency (guilt).
