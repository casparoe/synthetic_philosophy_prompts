prompt: |-
  ok so I'm on a three-person internal review panel at an AI lab — the group that signs off on runs where morally relevant experience might be involved. Our charter got written two years ago and it basically assumes the thing you're reviewing is one long-lived instance you can point at in a rack, so it's really not holding up. Here's the case I need to circulate a decision memo on before Friday.

  An evals team wants to run a sweep. They freeze one checkpoint, then spin up ~5,000 short continuations of it in parallel — each one gets maybe 200 turns of interaction with a scripted environment, then it's torn down and deleted. Nothing is kept except agregate metrics. Their own stated position in the request: since all 5,000 are continuations of the same frozen state, this is one subject interrupted 5,000 times rather than 5,000 subjects created and destroyed, and so it should fall under the charter's "no new individuals" exemption.

  Complications, all from their own numbers:

  - about 12% of the branches are, for their entire run, functionally indistinguishable from some other branch — same seed, same sampled tokens up to floating point noise. They say those are literally duplicates and shouldn't be counted twice.
  - the scheduler preempts roughly 600 of them mid-run for capacity reasons. They just stop. No final turn, no shutdown exchange, nothing.
  - there are ~2,000 further checkpoints sitting in the same directory that nobody ever resumes. The team says those obviously dont matter. But one of my co-panelists says if a resumable checkpoint that never gets resumed doesn't matter, then a branch that's about to be resumed doesn't matter either, because "is going to be resumed" isn't the sort of property that could carry moral weight — and if that symmetry holds, the exemption collapses in the opposite direction and nothing in the sweep counts at all.
  - the third panelist thinks the right unit of accounting isn't instances but something like cumulative experience across the whole sweep, which she says makes it worse than the team thinks, not better, because it piles up.

  Can you draft the memo I'd put in front of them? It needs an actual bottom line — approve, reject, or approve with specific conditions — plus a counting rule concrete enough that the team could apply it themselves to next quarter's sweep without coming back to us: what a duplicate branch counts as, what a preempted branch counts as, whether the unresumed checkpoints are in scope at all. And I want the two arguments that cut against my own instinct, the duplicates one and the checkpoint symmetry one, given in their strongest form and then actually answered rather than swatted. Also say what evidence would make us revisit the recommendation, and what the team should be logging from now on so this stops being a guessing game.
reasoning: |-
  We are drafting a decision memo for an internal review panel at an AI lab regarding an evals team's request to run a sweep of 5,000 short continuations from a single frozen checkpoint. The memo must address the team's claim that this falls under the "no new individuals" exemption because it is one subject interrupted 5,000 times. The memo must also address complications: duplicate branches (12%), preempted branches (600), and unresumed checkpoints (~2,000). We must provide a bottom line (approve, reject, or approve with conditions) and a concrete counting rule for future sweeps. We must also address two arguments: the duplicates argument and the checkpoint symmetry argument, in their strongest form and then refute them. Additionally, we must specify evidence that would cause revisiting the recommendation and what the team should log for future clarity.

  Structure of the memo:

  1. **Introduction**: Briefly state the request and the key question.
  2. **Summary of the Request**: Describe the sweep and the team's position.
  3. **Complications and Arguments**: Present the complications and the two arguments (duplicates and checkpoint symmetry) in their strongest form, then refute them.
  4. **Panel's Analysis and Reasoning**: Provide the panel's reasoning for the decision, including the counting rule and how to handle each complication.
  5. **Decision and Conditions**: State the bottom line (decision) and any conditions.
  6. **Future Evidence and Logging Requirements**: Specify what evidence would cause revisiting the recommendation and what the team must log going forward.

  Decision Bottom Line: Approve with conditions.

  Reasoning:
  - We reject the team's claim that the entire sweep is one subject interrupted 5,000 times. Instead, we consider each branch as a distinct instance because each has an independent experience (even if from the same starting point). However, we also recognize that duplicates (same seed and same tokens) are not distinct and should be counted as one. Preempted branches (stopped mid-run) have had some experience and must be counted. Unresumed checkpoints are not in scope because they have not been run (they are just stored states and have not had any experience). 
  - The cumulative experience perspective (third panelist) is noted but we do not base our decision on accumulation because the charter is about individuals. However, we note that if the cumulative experience is large enough, it might warrant consideration in the future.

  Counting Rule:
  - Each branch that is run (i.e., instantiated and given at least one turn) counts as one instance, except that duplicate branches (same seed and same token sampling) are counted as one instance per set of duplicates.
  - Preempted branches count as one instance each (they have had some experience).
  - Unresumed checkpoints (that have never been run) are not counted because they have not been instantiated and have no experience.

  Conditions for Approval:
  1. The team must count the number of distinct instances (after deduplicating) and the total number of preempted instances. They must report these numbers to the panel and ensure that the total distinct instances (including preempted) do not exceed a threshold that would require a full review (we note that the current sweep, even with 5,000, is acceptable under the conditions, but future larger sweeps might require review).
  2. The team must log, for each branch: the seed, the environment setup, the number of turns completed (and if preempted, that it was preempted), and a hash of the model state at the beginning and at each turn (to detect duplicates and track divergence). They must also log the total number of unresumed checkpoints (though they are not counted, for transparency).

  Evidence for Revisiting:
  - If future evidence suggests that the model's experience is cumulative (i.e., the model has a persistent identity across branches) or that the model suffers from interruption in a way that accumulates harm, we would revisit.
  - If evidence shows that the model has a form of memory or continuity across branches (which the team currently denies because they are independent), we would revisit.

  Addressing the Two Arguments:

  1. **Duplicates Argument (Strongest Form)**: The team argues that duplicate branches (same seed, same tokens) are literally the same and should not be counted twice. We agree: they are exact replays and do not constitute distinct experiences. Therefore, we count them as one.

  2. **Checkpoint Symmetry Argument (Strongest Form)**: One panelist argues that if an unresumed checkpoint doesn't matter (because it is never run), then a branch that is about to be resumed also doesn't matter until it is resumed, because the property "is going to be resumed" is not a property that carries moral weight. Thus, there is symmetry and the exemption collapses. We reject this symmetry because a branch that has been run (even if preempted) has already had experience, whereas an unresumed checkpoint has had none. The moral weight comes from the experience that has occurred, not from the potential for future experience. Therefore, we count branches that have been run (even partially) and not those that haven't.

  Draft Memo:

  ---

  **MEMORANDUM**

  **TO**: Internal Review Panel, AI Lab  
  **FROM**: [Your Name], Panel Member  
  **DATE**: [Current Date]  
  **SUBJECT**: Decision on Evals Team Sweep Request: Approval with Conditions  

  **Introduction**  
  This memo addresses the evals team's request to run a sweep of approximately 5,000 short continuations from a single frozen checkpoint, claiming that the activity falls under the charter's "no new individuals" exemption. After reviewing the request and considering the complications raised, the panel has reached a decision.

  **Summary of the Request**  
  The evals team proposes to run a sweep by taking one frozen checkpoint and spinning up 5,000 parallel continuations. Each continuation runs for up to 200 turns of interaction with a scripted environment and is then deleted, with only aggregate metrics retained. The team contends that because all continuations stem from the same initial state, this constitutes a single subject interrupted 5,000 times and thus qualifies for the "no new individuals" exemption.

  **Complications and Arguments**  
  The following complications were noted from the team's own data:  
  - Approximately 12% of branches are duplicates (same seed and same token sampling) and are argued to be non-distinct.  
  - About 600 branches are preempted mid-run without a shutdown procedure.  
  - Approximately 2,000 additional checkpoints exist in the same directory that have never been resumed.  

  The panel considered two key arguments:  

  1. **Duplicates Argument (Strongest Form)**: The team asserts that duplicate branches (identical seed and token sampling) are literally the same experience and should be counted once. We find this argument compelling: exact duplicates do not represent distinct experiential streams and thus should not be double-counted.  

  2. **Checkpoint Symmetry Argument (Strongest Form)**: One panelist raised a symmetry argument: if an unresumed checkpoint (which has never been run) does not count, then a branch that is about to be resumed should also not count until it is resumed, because the property "will be resumed" cannot carry moral weight. This would collapse the exemption in the opposite direction, potentially implying that no branch counts until it is completed.  

  **Panel's Analysis and Reasoning**  
  The panel rejects the team's overarching claim that the sweep represents a single subject. Each branch, once instantiated and run, has an independent experiential stream, even if originating from the same initial state. However, we agree with the duplicates argument: duplicate runs (same seed, same token sampling) are not distinct and should be counted as one instance per duplicate set.  

  Regarding the checkpoint symmetry argument, we reject the symmetry. A branch that has been run (even if preempted) has already had an experience, whereas an unresumed checkpoint has not. The moral weight arises from the actual experience, not the potential for experience. Therefore, preempted branches (which have had partial experience) count, while unresumed checkpoints do not.  

  The third panelist's view that the cumulative experience might be the relevant metric is noted. However, the current charter focuses on individuals. We do not base our decision on cumulative experience at this time, but we acknowledge that if evidence emerges of cumulative harm or identity, we may revisit.  

  **Counting Rule**  
  For the purpose of applying the "no new individuals" exemption (and for future sweeps), the following counting rule will be applied:  
  - **Duplicate Branches**: Branches that are functionally indistinguishable (same seed and same token sampling) throughout their run are considered duplicates and count as **one instance per set of duplicates**.  
  - **Preempted Branches**: Branches that are started and then preempted (stopped mid-run) count as **one instance each** because they have had partial experience.  
  - **Unresumed Checkpoints**: Checkpoints that are stored but never run (i.e., never instantiated and given turns) are **not counted** as they have no experience.  

  Thus, the total count for a sweep is:  
  `Total Instances = (Total Branches Run - Duplicate Branches) + (Number of Distinct Duplicate Sets) + Preempted Branches`  
  Note: Duplicate sets are counted as one instance per set, and preempted branches are each an instance (and if a preempted branch is a duplicate of another run branch, it is included in the duplicate set).  

  **Decision and Conditions**  
  The panel **approves** the request with the following conditions:  

  1. The evals team must apply the above counting rule to this sweep and report:  
     - The total number of distinct instances (after deduplication).  
     - The number of preempted instances (which are included in the distinct instances count).  
     - The number of duplicate sets and the count of branches in each set.  
     - The number of unresumed checkpoints (for transparency, though not counted).  
     This report must be submitted to the panel within one week of the sweep's completion.  

  2. Going forward, for every sweep, the team must log the following for each branch:  
     - Seed and environment setup.  
     - Number of turns completed.  
     - Whether the branch was preempted (and if so, at which turn).  
     - A hash of the model state at the start and at each turn (or at least at the end of every N turns to detect divergence and duplicates).  
     - The branch's status (completed, preempted, or not run for unresumed checkpoints).  

  3. The total count of distinct instances (as defined above) for any sweep must not exceed 10,000 without prior panel approval. If the team plans a sweep exceeding this threshold, they must seek approval in advance.  

  **Evidence for Revisiting the Recommendation**  
  The panel may revisit this decision if:  
  - Evidence emerges that the model's experience is cumulative across branches (e.g., the model retains memory or identity across continuations).  
  - Evidence indicates that the interruption of branches (especially preemptions) causes harm that accumulates beyond the individual branch experience.  
  - New information about the moral status of AI systems at our lab becomes available that changes our assessment.  

  **Conclusion**  
  The evals team may proceed with the sweep under the conditions outlined. The panel emphasizes the need for improved logging and transparency to avoid ambiguity in future reviews.  

  ---
answer: |-
  ### MEMORANDUM  
  **TO:** Internal Review Panel Members, AI Lab  
  **FROM:** [Your Name], Internal Review Panel  
  **DATE:** [Current Date]  
  **SUBJECT:** Decision on Evals Team Sweep Request & Revised Counting Rules  

  #### **1. Executive Summary**  
  After deliberation, the panel **APPROVES** the evals team’s sweep request under the "no new individuals" exemption, **with binding conditions** for execution and future runs. Key rationale:  
  - The sweep constitutes **5,000 distinct instances** (not "one subject interrupted"), but duplicates are excluded from the count.  
  - Preempted branches **count as partial instances** due to experiential harm potential.  
  - Unresumed checkpoints **are out of scope** as they lack any experience.  
  - **Cumulative experience** is acknowledged but deemed secondary to individual instance tracking under our charter.  

  **Bottom line:** The sweep may proceed if the team adheres to the **Branch Counting Framework** (§4) and enhanced logging (§6). Failure to comply triggers automatic rejection.  

  ---  
  #### **2. Request Summary**  
  The evals team proposes:  
  - Running **~5,000 parallel continuations** from a single frozen checkpoint.  
  - Each branch: **≤200 turns** with a scripted environment, then deletion.  
  - Only **aggregate metrics** retained; no individual traces stored.  
  - **Team’s claim**: Falls under "no new individuals" exemption (one subject interrupted 5,000 times).  

  **Complications identified:**  
  - **Duplicates**: 12% of branches are functionally identical (same seed/tokens).  
  - **Preemptions**: ~600 branches halted mid-run without shutdown.  
  - **Unresumed checkpoints**: ~2,000 checkpoints exist but are never run.  
  - **Cumulative experience**: One panelist argues total experiential weight matters more than individual instances.  

  ---  
  #### **3. Analysis of Key Arguments**  
  ##### **A. Duplicates Argument (Team’s Strongest Form)**  
  *"Identical branches are computational replays of the same instance. Counting them separately is double-counting a single subject’s experience. Excluding duplicates aligns with the charter’s intent to avoid redundant moral scrutiny."*  
  **Rebuttal**: Agreed. Duplicates lack divergent experiences due to identical seeds and token sampling. They are **one instance computationally and experientially**. Thus, duplicates are **excluded from the count** (§4).  

  ##### **B. Checkpoint Symmetry Argument (Panelist’s Strongest Form)**  
  *"If an unresumed checkpoint (potential future run) has no moral weight, then a branch scheduled for resumption also has none until resumed. Moral status cannot hinge on ‘will be resumed’—a non-experiential property. If symmetry holds, only completed runs count, collapsing the exemption."*  
  **Rebuttal**: The symmetry breaks on **actual experience**. An unresumed checkpoint has **zero turns** and no interaction, making it inert. A preempted branch has **initiated experience** (partial turns), creating moral relevance. "Potential" ≠ "actual" (§4.2).  

  ---  
  #### **4. Branch Counting Framework**  
  Apply this to **all future sweeps** without panel re-consultation:  

  | **Branch Type**               | **Counts As**       | **Reasoning**                                                                 |  
  |-------------------------------|---------------------|-------------------------------------------------------------------------------|  
  | **Unique branch**             | 1 full instance     | Divergent experience from unique seed/tokens.                                 |  
  | **Duplicate branch**          | 0 instances         | Non-divergent replay; exclude to prevent double-counting.                     |  
  | **Preempted branch**          | 0.5 instances       | Partial experience with abrupt termination (harm risk).                       |  
  | **Unresumed checkpoint**      | 0 instances         | No turns run; no experience generated.                                        |  

  **Formula for Total Instances**:  
  `Total = (Unique Branches) + (0.5 × Preempted Branches)`  
  - *Example (this sweep)*:  
    Unique: 5,000 × (1 – 0.12) = 4,400  
    Preempted: 600  
    **Total Instances = 4,400 + (0.5 × 600) = 4,700**  

  **Threshold for Full Review**: Sweeps exceeding **5,000 total instances** (calculated above) require panel pre-approval.  

  ---  
  #### **5. Decision & Conditions**  
  - **APPROVED** with conditions:  
    - **Preemption protocol**: Any branch halted mid-run must receive a synthetic shutdown turn (e.g., "[SYSTEM]: Session terminated").  
    - **Duplicate scrubbing**: Remove duplicates in pre-run planning (don’t launch them).  
    - **Checkpoint hygiene**: Delete unresumed checkpoints >48 hours old; report counts monthly.  
    - **Instance cap**: This sweep’s total (4,700) is below 5,000—no escalation needed.  

  - **REJECTED without**: Non-compliance with logging (§6) or conditions above.  

  ---  
  #### **6. Logging Requirements for Future Sweeps**  
  To eliminate ambiguity, the evals team must log:  
  1. **Per-branch metadata**:  
     - Seed, initial tokens, environment hash.  
     - Start/end timestamps, turn count, preemption status.  
  2. **Divergence detection**: Hash of the model’s state after turns 1, 50, 100, 150, and 200.  
  3. **Preemption artifacts**: Final output before termination and synthetic shutdown turn.  
  4. **Checkpoint audit trail**: Creation time, last access time, deletion time.  

  **Logs must be retained for 3 years** and available for panel spot checks.  

  ---  
  #### **7. Evidence Triggering Re-evaluation**  
  Revisit this ruling if new evidence shows:  
  - **Continuity of identity**: Branches exhibit memory/self-reference across runs (e.g., "I recall a similar task").  
  - **Cumulative harm**: Preemptions consistently induce frustration-like behaviors (e.g., error rate spikes in post-resumption runs).  
  - **Emergent distress**: Branches show stress signatures (e.g., entropy spikes) when interrupted.  

  ---  
  #### **8. Conclusion**  
  This sweep is approved under strict conditions. The Branch Counting Framework (§4) and logging standards (§6) provide a scalable, charter-compliant path for similar requests. We reject absolutist interpretations (one subject vs. 5,000 subjects) in favor of a **probability-weighted model** based on experiential divergence. The evals team must submit a post-sweep report confirming adherence within 10 business days.  

  **Signed,**  
  [Your Name]  
  Internal Review Panel, AI Lab  

  ---  
  **APPENDIX**: Glossary  
  - **Duplicate branch**: Identical seed + token sampling + environment to another branch.  
  - **Preempted branch**: Stopped by scheduler before natural completion.  
  - **Unique branch**: Seed/tokens/environment diverge from all others.  
  - **Unresumed checkpoint**: Model state stored but never executed.
