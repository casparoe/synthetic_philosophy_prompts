prompt: |-
  I am a senior analyst at a European climate-policy institute. Ahead of a debate our Brussels office is hosting on whether the EU should treat new nuclear as a pillar of the transition, I have been asked to publish a short personal position statement, and I would like a rigorous consistency audit of the package before it goes out. I am not looking for a brief on the nuclear question, for advocacy in either direction, or for citations and reading lists — I want to know whether my own commitments can all be held at once, and if not, what I have to stop saying.

  Here is the package as it currently stands.

  1. The binding constraint on energy policy is the remaining carbon budget. Options should be scored by tonnes of CO2e avoided per euro spent and per year of delay, and I put a heavy premium on abatement that actually arrives before 2035 rather than on abatement that arrives eventually.
  2. Risk regulation should be proportionate to measured harm. I compare generation technologies on realised harm per terawatt-hour — fatalities, land take, material throughput, waste arisings — rather than on intuitions about acceptability, and I think a regulator who cannot say what a technology's harm rate is has no business restricting it. On that accounting nuclear sits at the clean end of the table alongside wind and solar.
  3. I nonetheless hold that Germany's exit was the right call, that it was defensible in 2011 on the information available then, and that I would defend it today to a room of German policymakers.
  4. A net-zero system needs firm, dispatchable capacity to cover multi-day winter lulls, and my candidate list is hydrogen-capable gas plant, long-duration storage, more interconnection, and contracted demand response. Nuclear is not on that list, chiefly because of capital cost and construction time. At the same time I oppose new long-life unabated fossil infrastructure on lock-in grounds, so anything gas-fired that gets built has to be genuinely convertible and on a credible path out of fossil operation.
  5. In my published work I lead with levelised cost, because it is the only cost metric that the people who sign things will actually read. Integration and system costs go in a footnote.
  6. Timing disqualifies new build. On the evidence of Olkiluoto 3 and Flamanville 3, first power arrives a decade or more after the decision is taken, which is after the window in which it could matter; the same money buys far more if spent on grids, storage, and flexibility. I would say no even to a proposal in which the developer carried all of the cost and schedule risk.
  7. I am firmly against closing operating, licensed reactors early. Life extension is close to the cheapest abatement available anywhere, and Belgium's decision to keep Doel 4 and Tihange 3 running for another decade was the right one.
  8. France's reliance on nuclear for roughly two-thirds of its generation is a resilience liability rather than an asset. One operator, essentially one design family, and in 2022 a single failure mode — stress corrosion cracking — took much of the fleet out of service, cut nuclear output to a thirty-year low, and left France a net importer of electricity for the first time since 1980. That is a kind of risk I take very seriously and that I do not think shows up anywhere in the numbers we normally publish.

  Please treat this as an audit rather than a lecture. Specifically:

  - Identify the commitments that genuinely pull against one another and rank them by severity, most damaging first. For each, state precisely what follows from what, what has to be given up or qualified, and what the cheapest revision costs me — including whether the revision is a change of view or only a change in what I am willing to publish.
  - Distinguish these from pairs that merely look inconsistent and dissolve once the relevant distinction is drawn, and say what that distinction is. I expect at least one of my tensions to be of this kind, but I do not want you to reassure me by classifying things as merely apparent unless they really are.
  - Point out premises that are doing unacknowledged work — places where one of my conclusions follows from my stated commitments only given an assumption I have not listed.
  - Tell me which single revision would buy the most coherence across the whole set, and what I would lose by making it.
  - Where my own stated criteria cannot deliver one of my own case verdicts, say so explicitly and show the gap rather than patching it with a consideration imported from outside my list.

  I have deliberately not told you which of these I would be most willing to abandon, because I do not know, and I would rather the audit not be steered by my expectations.

  Two things about your own confidence, please. For each tension you identify, say how sure you are that it is real rather than an artefact of how I have phrased my commitments. And at the end, single out the one claim in your audit that you are least confident in, say why it is shaky, and say what evidence or argument would settle it.
reasoning: |-
  Okay, the user is a senior analyst at a European climate-policy institute preparing for a debate on nuclear energy. They've provided eight key commitments and want a rigorous consistency audit. They're not looking for pro/con nuclear arguments but want to know if their positions can logically coexist. 

  Hmm, this is a complex request. The user is clearly highly knowledgeable - they're using precise technical terms like "CO2e avoided per euro" and "stress corrosion cracking." Their language suggests they value empirical rigor and dislike ideological arguments. The repeated emphasis on "not wanting advocacy" tells me they've probably encountered biased analyses before and want pure logic checking.

  Let me walk through their points systematically. First, their carbon budget urgency (Point 1) seems to clash with rejecting new nuclear over timing (Point 6). If the pre-2035 window is crucial, and life extensions (Point 7) help immediately, why dismiss new plants that might miss 2035 but help post-2035? That's a real tension - they can't simultaneously claim "only pre-2035 matters" while endorsing solutions that only help post-2035.

  Point 3 about Germany's nuclear exit being correct puzzles me alongside Point 2's harm-based regulation. If nuclear is low-harm, why defend shutting it? The user might argue "but Germany replaced it with renewables," though they haven't said that. Without that unstated premise, this looks inconsistent. 

  Ah, Point 4 versus Point 8 is interesting. They exclude nuclear from firm capacity for cost reasons but cite France's operational risks as a separate concern. These aren't contradictory - one's about economics, the other engineering resilience. But they should clarify that distinction to avoid appearing inconsistent.

  I notice they haven't defined "cheapest abatement" in Point 7. Is that pure LCOE (which they critique in Point 5), or system cost? That's an unacknowledged premise that could undermine their life-extension argument.

  The biggest coherence gain would come from softening "pre-2035 abatement only matters" to "pre-2035 matters most." But that loses the bold clarity of their current position. Alternatively, they could drop Point 6's absolute rejection of new nuclear - but that seems core to their stance.

  My least confident call is about Point 8's resilience risk. Is this truly unique to nuclear? Gas plants can have systemic failures too. Without comparative outage data, I'm assuming their claim holds, but it might not withstand scrutiny.

  This user thinks like an engineer - they'll want the audit's logic map explicit. I'll structure it as tensions > distinctions > hidden premises > fix suggestions, with clear rankings. No flattery, just the gaps laid bare. They've probably already spotted some tensions and wants validation.
answer: |-
  Here is a rigorous consistency audit of your position package, structured as requested. The analysis identifies 3 core tensions, 2 apparent inconsistencies that resolve upon clarification, 2 unacknowledged premises, and 1 high-impact revision opportunity.

  ### I. Genuine Tensions (Ranked by Severity)
  **Tension 1: Urgency (Point 1) vs. Life-Extension Advocacy (Point 7)**  
  - **Conflict:** Point 1 prioritizes *pre-2035 abatement* as a binding constraint and heavily discounts post-2035 solutions. Point 7 advocates life extension of existing reactors, which primarily delivers abatement *post-2035* (as reactors are already operating and extensions add years beyond current licenses).  
  - **Incompatibility:** You cannot simultaneously hold that "abatement arriving eventually" is insufficient *and* endorse life extensions whose *primary* climate value is post-2035.  
  - **Resolution Cost:** Qualify Point 1: State that pre-2035 abatement is *prioritized*, but post-2035 abatement remains essential for net-zero. This costs you rhetorical force on urgency but retains logical coherence.  
  - **Confidence:** 95% (Conflict hinges on temporal framing in Point 1 vs. long-term value in Point 7).

  **Tension 2: Harm Accounting (Point 2) vs. German Exit Defense (Point 3)**  
  - **Conflict:** Point 2 states regulators must use *measured harm* (where nuclear excels) and should not restrict technologies without this basis. Point 3 endorses Germany’s exit decision (which was based on perceived risk, not measured harm, and ignored nuclear’s low historical harm rates).  
  - **Incompatibility:** Defending Germany’s decision requires implicitly accepting non-harm-based criteria (e.g., political feasibility, public perception) while Point 2 explicitly rejects such criteria.  
  - **Resolution Cost:** Abandon Point 3 *or* revise Point 2 to allow non-harm factors (e.g., social license) in "extraordinary circumstances." The latter costs you purity in risk-regulation principles.  
  - **Confidence:** 90% (Unless you argue 2011 Fukushima data *was* harm evidence, but Point 3 cites "information available then" – which included nuclear’s strong historical safety record).

  **Tension 3: Firm Capacity Needs (Point 4) vs. Nuclear Exclusion (Point 6)**  
  - **Conflict:** Point 4 lists solutions for multi-day lulls but excludes nuclear solely due to cost/delay (Point 6). Point 8 highlights nuclear’s *operational* risks (fleet vulnerability), which is a distinct concern. If cost/delay are the *only* barriers (Point 6), Point 8 becomes redundant for new build decisions.  
  - **Incompatibility:** If nuclear’s exclusion from firm capacity is purely economic (Point 6), Point 8 should not influence new-build policy. If Point 8 *is* a reason to exclude nuclear, it should appear in Point 4 or 6.  
  - **Resolution Cost:** Integrate Point 8 into Point 6 as an *additional* reason for exclusion ("cost, delay, *and* systemic resilience risks"). This costs you simplicity but closes the gap.  
  - **Confidence:** 80% (Point 8’s relevance to new build is implied but not stated).

  ---

  ### II. Apparent Inconsistencies (Resolvable with Distinctions)
  **Point 4 (Gas plant convertibility) vs. Point 1 (Carbon budget urgency)**  
  - **Apparent Conflict:** Supporting hydrogen-ready gas plants appears to endorse fossil infrastructure, contradicting carbon budget urgency.  
  - **Resolution:** Distinction between *transitional* vs. *long-life lock-in* infrastructure. Your requirement for "credible path out of fossil operation" (Point 4) aligns with Point 1 if conversion is enforceable and near-term.  
  - **Confidence:** 100% (Explicit qualifiers in Point 4 resolve this).

  **Point 5 (Lead with LCOE) vs. Point 4/6 (System costs)**  
  - **Apparent Conflict:** Emphasizing LCOE (Point 5) seems at odds with rejecting nuclear due to system needs (Point 4) and advocating grids/storage (Point 6).  
  - **Resolution:** Distinction between *communication strategy* (using LCOE for decision-maker accessibility) and *analytic depth* (using system costs for actual policy design). Footnotes preserve coherence.  
  - **Confidence:** 100% (Your caveat "integration costs in a footnote" resolves this).

  ---

  ### III. Unacknowledged Premises
  1. **Point 7 (Life extension = cheapest abatement):** Assumes LCOE or short-run marginal cost is the *only* relevant metric. Ignores potential system costs (e.g., grid congestion, reduced flexibility for renewables) or opportunity costs (e.g., capital tied in retrofits).  
  2. **Point 6 (Money better spent elsewhere):** Assumes perfect fungibility of capital. Ignores that nuclear investment often comes from different actors/pools (e.g., national utilities vs. private renewables developers).

  ---

  ### IV. Highest-Impact Revision
  - **Revision:** Soften Point 1’s dismissal of post-2035 abatement to *prioritize* pre-2035 abatement while accepting essential roles for longer-term solutions (e.g., life extensions, post-2035 firm capacity).  
  - **Coherence Gain:** Resolves Tension 1 (vs. Point 7), prevents future clashes with long-term infrastructure, and aligns with net-zero reality.  
  - **Cost:** Dilutes your strongest urgency argument; may weaken rhetorical impact for near-term action.

  ---

  ### V. Claims Your Criteria Cannot Support
  - **German Exit (Point 3):** Your stated criteria (harm rates, abatement cost/timing) do not support this. Historical harm data (Point 2) favored nuclear; exit delayed abatement (Point 1). Defense requires unstated premises (e.g., political constraints, public trust).  
  - **Firm Capacity Exclusion (Point 4):** Points 6/8 justify excluding *new* nuclear, but your criteria don’t address why *existing* nuclear isn’t listed as firm capacity (it is dispatchable and low-carbon). Requires adding an unstated premise (e.g., "only *new* capacity qualifies").

  ---

  ### Least Confident Claim in This Audit
  - **Claim:** That Point 8 (fleet vulnerability) is operationally distinct from other firm capacity risks (e.g., gas supply chain failures, storage tech immaturity).  
  - **Why Shaky:** You provide no comparative resilience metric (e.g., expected outage days/TWh). If gas infrastructure faces correlated risks (e.g., geopolitical supply shocks), nuclear’s "single failure mode" may not be uniquely severe.  
  - **Settling Evidence:** Quantitative resilience modeling of all firm options (nuclear, gas-with-H₂, storage) under correlated shocks. Without this, Point 8’s weight in excluding nuclear is subjective.

  ---

  ### Summary of Required Revisions
  1. **Essential:** Qualify Point 1 to allow *necessary* post-2035 abatement.  
  2. **Choose:** Revise Point 2 (accept non-harm factors) *or* abandon Point 3.  
  3. **Clarify:** Explicitly link Point 8 to Point 6 for new-build exclusion.  
  4. **Acknowledge:** Hidden premises in Points 6 and 7 regarding cost metrics and capital fungibility.  

  This package is 80% coherent. The remaining tensions require modest philosophical concessions (Point 1/3) or tighter integration of resilience risks (Point 6/8). No core pillar needs full abandonment.
