prompt: |-
  Got into a three hour argument with a friend last night (he's an environmental historian, I'm not) about whether you can say a drought caused a famine. His take: weather is just backdrop, only people and institutions cause anything, and every "the climate did it" story is determinism in a nicer font. My take: then explain why the same drought flattened one state and barely registered in its neighbour. Nobody budged. Which is annoying because it's literally my job.

  I'm a story editor on a history docuseries. Most episode pitches reach me with a non-human driver bolted on — a volcano, a plague, a multi-decade drought, a monsoon shift. Roughly a dozen a season, maybe 40 minutes each before notes go back to the writer and the showrunner (showrunner has a PhD, writers generally don't). I need a procedure I can actually run on a script's causal claim, not an essay about causation. So: the questions to ask in order, what counts as a passing answer at each one, where the procedure is allowed to kill a claim outright, and where it has to stop and hand off to a human because what's left is a question about which story we're telling rather than what happened. Use whatever is genuinely settled about causes versus background conditions, about attributing anything from proxy data in a single case, and about the political damage the determinist tradition did — but write it for someone who's never read any of that.

  Then run it on three pitches: an episode arguing a long drought brought down a Bronze Age palace system; one arguing epidemic disease rather than military skill explains a conquest, where the writer really wants the disease up front; and one arguing a famine was caused by harvest failure. Let the procedure say no on that third one if it wants to. And tell me straight where it'll misfire — which claims it wrongly passes and which it wrongly kills.
reasoning: |-
  Okay, the user is a story editor for a history docuseries dealing with episode pitches that often attribute historical events to non-human factors like droughts or plagues. They had a debate with an environmental historian friend about whether a drought can cause a famine, highlighting a tension between environmental determinism and human agency. The user needs a practical, step-by-step procedure to evaluate causal claims in scripts, not theoretical essays. 

  First, I need to understand the core conflict: the friend argues that only people and institutions cause events, while the user points out differential impacts (e.g., same drought affecting neighboring states differently). The user's job involves vetting pitches that often frame climate or disease as primary drivers. They need a tool that's efficient, grounded in settled historical methods, and sensitive to determinism's political baggage, yet accessible to non-academics.

  The procedure must be actionable—sequential questions with clear pass/fail thresholds. It should distinguish between necessary background conditions and active causes, account for human responses, and flag where narrative choices (not facts) take over. Key principles to embed: 1) Proximal causes are usually human, 2) Differential outcomes prove human agency's role, 3) "Cause" in storytelling isn't identical to academic causation.

  Breaking it down: Start by verifying the environmental event occurred (Step 1), then check if it could plausibly impact the outcome (Step 2). Crucially, Step 3 assesses human responses—did institutions worsen/mitigate it? If they failed, the claim passes but must be framed as a trigger, not sole cause. Steps 4-5 handle nuance: competing factors and narrative framing. The procedure should kill claims only if the environmental factor is fictional or irrelevant; otherwise, it guides rewriting to avoid determinism.

  Testing on the three pitches: 
  1. Bronze Age drought: Passes Step 3 (evidence of institutional collapse linked to drought stress) but requires framing as "triggered a crisis." 
  2. Disease-driven conquest: Fails Step 3 (no evidence institutions couldn't handle disease); must be demoted to a factor. 
  3. Famine from harvest failure: Automatically fails at Step 3—user allowed this, as per their request. Harvest failure is background; famine requires institutional failure.

  Misfires: The tool might wrongly pass if evidence of human response is scant (e.g., poorly documented societies) or wrongly kill if "mitigation capacity" is too rigidly defined. It also can't resolve debates about intentionality (e.g., whether colonial neglect constitutes causation). 

  User's deeper needs: They want academic rigor without jargon, speed (40-min scripts!), and to placate showrunner (PhD) and writers (non-experts). The procedure balances credibility with storytelling—flagging when the human/institutional story is missing, but acknowledging environmental factors as narrative catalysts. Essentially, it turns "the climate did it" into "the climate exposed who they were."
answer: |-
  Here's a straight-to-the-point procedure based on settled historical methodology, designed for speed and practicality. It focuses on **causal attribution** and avoids determinism by prioritizing **human agency and institutional response**. It kills claims only when they are factually false or entirely unsupported; otherwise, it flags them for reframing.

  **The "Cause or Context?" Script Check Procedure:**

  1.  **Did "It" Happen?** (Verification)
      *   *Question:* Is the claimed environmental/disease event (drought, plague, monsoon shift, etc.) *credibly established* for the specific time and place using the best available evidence (proxy data, contemporary records, archaeological evidence)?
      *   *Pass:* Clear evidence from multiple reliable sources/proxies. Uncertainty acknowledged if present.
      *   *Fail/Kill:* Contradicted by evidence, based on debunked theories, or relies on wildly speculative data. Claim dies.
      *   *Handoff Needed:* Evidence is ambiguous, highly contested, or relies on a single contentious proxy. Flag for historian/showrunner.

  2.  **Could "It" Matter?** (Plausible Mechanism)
      *   *Question:* Is there a *logical, evidence-based link* between the event and the human outcome? (e.g., Drought -> reduces water for crops/livestock -> *could* lead to food shortage; Plague -> kills people/soldiers -> *could* weaken an army/society).
      *   *Pass:* Mechanism is direct, obvious, and supported by basic facts (e.g., agrarian society needs rain for crops).
      *   *Fail/Kill:* Mechanism is illogical, anachronistic, or physically impossible. Claim dies. (e.g., "A minor temperature dip caused instant societal collapse" without a plausible chain).
      *   *Handoff Needed:* Mechanism is indirect or complex (e.g., climate shift influencing migratory patterns that *then* cause conflict). Flag for writer/showrunner to clarify chain.

  3.  **Did People/Institutions Respond?** (The Agency Test - **MOST CRITICAL STEP**)
      *   *Question:* Does the evidence show that *human decisions and institutional structures* significantly **amplified, mitigated, or failed to respond** to the event? Look for evidence of *differential impact* (your "neighbour state" point) or *policy choices*.
      *   *Pass:*
          *   Evidence shows institutions *failed* to mitigate (e.g., grain hoarding, corrupt distribution, ignoring warnings, disastrous policies *during* the event).
          *   Evidence shows institutions *exacerbated* the crisis (e.g., war blocking supply routes, forced requisitions, suppressing aid).
          *   Clear evidence of *differential outcomes* traceable to different policies/resources.
      *   *Fail/Reframe REQUIRED:* No evidence of institutional response/failure, or the narrative presents the event as an *unstoppable, overwhelming force* leaving no room for human action. **"Cause" claim fails.** It must be reframed as a *trigger*, *stressor*, or *contextual factor*. The primary cause *must* shift to the human/institutional response (or lack thereof).
      *   *Handoff Needed:* Evidence of response is fragmentary or debated. Flag for historian/showrunner to weigh in on interpretation.

  4.  **Was "It" Alone?** (Overdetermination Check)
      *   *Question:* Are there other significant, well-established factors simultaneously contributing to the outcome (war, economic crisis, political instability, technological change)?
      *   *Pass:* Narrative acknowledges other factors and their interplay. The environmental/disease factor isn't presented as the *sole* cause.
      *   *Reframe REQUIRED:* Narrative presents the event as the *primary* or *sole* driver while ignoring other major, documented factors. Demand inclusion of complexity.
      *   *Handoff Needed:* Relative weighting of multiple causes is highly contested among experts.

  5.  **Is the Framing Honest?** (Determinism & Politics Check)
      *   *Question:* Does the narrative framing avoid implying inevitability ("doomed by climate") or absolving powerful actors (rulers, elites, colonial powers) of responsibility? Does it acknowledge the political damage of determinist narratives (used to blame victims, justify exploitation, or portray collapse as "natural")?
      *   *Pass:* Framing emphasizes contingency, human choices, responsibility, and avoids fatalistic language. Contextualizes how determinism has been misused.
      *   *Reframe REQUIRED:* Uses deterministic language ("the drought *caused* the collapse", "defeated *by* plague"), implies inevitability, or obscures the role of powerful decision-makers. Demand language focusing on "triggered," "exposed," "occurred during," "amplified by," or explicitly names responsible *human* actors/institutions.
      *   *Handoff Needed:* Framing involves sensitive political/historiographical debates best navigated by the showrunner/historian.

  **Procedure Summary:** Verify Event -> Check Plausibility -> **CRITICAL: Test for Human/Institutional Response/Failure** -> Check for Other Factors -> Check Framing Language. Kill only on Step 1 (False Event) or implausible mechanism (Step 2). **Step 3 is where "X caused Y" claims usually fail and require reframing.**

  ---

  **Applying the Procedure to Your Pitches:**

  1.  **"Long Drought Brought Down a Bronze Age Palace System"**
      *   **Step 1 (Happen?):** *Pass.* (Assuming solid proxies like tree rings, sediment cores show severe multi-decade drought in the region).
      *   **Step 2 (Matter?):** *Pass.* Drought plausibly stresses agricultural base crucial to palatial economies/taxation.
      *   **Step 3 (Respond?):** **CRITICAL POINT.** Did palaces fail to adapt (e.g., over-reliance on grain monoculture, no storage, conflict over resources, inability to manage migration)? Evidence of differential collapse (some areas/palaces fared better)? *If evidence shows institutional rigidity, conflict, or failure to adapt:* **Pass, BUT Reframe Required.** "The prolonged drought triggered a crisis that exposed the inherent vulnerabilities and ultimately led to the collapse of the centralized palace systems, which failed to adapt." *If no evidence of response/failure:* **Fail/Reframe Required.** "A severe drought occurred during the period of palace system collapse, adding significant stress to societies also facing [other factors - e.g., earthquakes, migration, internal conflict]."
      *   **Step 4 (Alone?):** *Reframe Likely.* Usually earthquakes, migration, trade disruption also implicated. Narrative must include complexity.
      *   **Step 5 (Framing):** *Reframe Likely.* Avoid "drought brought down." Use "drought contributed to," "collapsed amid drought," "drought exposed weaknesses."

  2.  **"Epidemic Disease Explains a Conquest (vs. Military Skill)"**
      *   **Step 1 (Happen?):** *Pass.* (Assume contemporary accounts/reasonable evidence of epidemic in defender's territory/time).
      *   **Step 2 (Matter?):** *Pass.* Disease killing soldiers/civilians/logistics people logically weakens defense.
      *   **Step 3 (Respond?):** **CRITICAL POINT.**
          *   Did the defenders *fail* to mitigate? (e.g., no quarantine, bad sanitation, fleeing soldiers spreading it further, leadership decapitated by disease)?
          *   Did the attackers *exploit* the disease? (e.g., timing invasion, propaganda, attacking weakened areas)?
          *   Was the attackers' success *dependent* on the disease? (e.g., were they losing before it hit? Did it affect them less due to prior exposure/better logistics?).
          *   *If evidence shows defender failure or attacker exploitation:* **Pass, BUT Reframe Required.** "While military skill played a role, the devastating epidemic that crippled [Defender]'s capacity to resist was a decisive factor in [Attacker]'s victory." *DON'T lead with disease as the singular explanation.*
          *   *If no evidence of differential impact/response, or disease hit both sides equally:* **Fail/Reframe Required.** "A severe epidemic ravaged the region during [Attacker]'s campaign, significantly weakening [Defender]'s forces and contributing to their defeat, alongside [Attacker]'s strategic advantages." Disease is a major *factor*, not *the explanation* vs. military skill. Writer can't have disease "up front" as *the* cause if Step 3 evidence is weak.
      *   **Step 4 (Alone?):** *Reframe REQUIRED.* Military tactics, technology, morale, resources, logistics *always* play a role. Narrative must show interplay. Pitching it as "disease *rather than* military skill" is usually too simplistic.
      *   **Step 5 (Framing):** *Reframe REQUIRED.* Avoid "explains a conquest." Use "was a major contributing factor," "crippled the defense," "exploited the epidemic."

  3.  **"Famine was Caused by Harvest Failure"**
      *   **Step 1 (Happen?):** *Pass.* (Assume evidence of crop failure - drought, flood, pests, etc.).
      *   **Step 2 (Matter?):** *Pass.* Lack of food logically *can* lead to famine.
      *   **Step 3 (Respond?):** **CRITICAL POINT. THIS IS WHERE IT DIES AS A "CAUSE".** Harvest failure is a *trigger* for *potential* famine.
          *   Did institutions/governments fail to release grain reserves?
          *   Did merchants hoard grain, inflating prices?
          *   Was food exported from the afflicted area?
          *   Was relief blocked (by war, policy, incompetence)?
          *   Was the population already vulnerable (poverty, prior malnutrition, inequality)?
          *   **FAIL/REFRAIME REQUIRED (Kill the "Caused by" claim).** *Every* famine requires human/institutional failure. **Passing Answer:** "A severe harvest failure triggered a famine in [Region], which was exacerbated by [specific human failures - e.g., colonial grain exports, warlord requisitions, incompetent relief efforts, market manipulation]." **The harvest failure is the *context* or *trigger*; the *cause* of the famine lies in the human response.**

  ---

  **Where the Procedure Will Misfire:**

  *   **Wrongly Passes:**
      *   **"Clever" Determinism:** If Step 3 evidence *exists* but is weak or misinterpreted (e.g., *assuming* institutions were overwhelmed without proof, ignoring their active harmful choices). A writer could cherry-pick evidence of *some* response failure to pass Step 3 while still implying the environmental factor was overwhelmingly decisive.
      *   **Poorly Documented Cases:** For very ancient or poorly documented events, the *absence* of evidence for institutional response (Step 3) might be mistaken for evidence of absence. The procedure might let a weakly supported "drought caused collapse" claim pass if the writer argues "we have no records of any response, so they must have been helpless."
  *   **Wrongly Kills/Reframes:**
      *   **Overwhelming Scale:** In rare cases of truly catastrophic, unprecedented events (e.g., a supervolcano, continent-scale virgin soil epidemic), the procedure might insist on finding institutional "failure" when *no* pre-industrial society could have realistically mitigated it. Step 3 might demand unrealistic evidence of response capacity.
      *   **Intentional Harm:** If an institution *deliberately* uses an environmental stressor *as a weapon* (e.g., blocking aid during a drought to punish a region), Step 3 passes (amplification!), but the *framing* (Step 5) becomes crucial. The procedure might not perfectly distinguish between incompetence and malice without careful human interpretation.
      *   **Subtle Vulnerabilities:** If institutional failure is about *long-term* vulnerability (e.g., unsustainable farming practices adopted decades earlier making a society hypersensitive to drought), the link might be complex enough to require Handoff at Step 3, potentially delaying a valid "reframe required" call.

  **Key Takeaway for Your Job:** This procedure forces the narrative to **follow the evidence of human action/inaction.** It kills lazy environmental determinism ("the drought did it") but allows environmental factors to be powerful *catalysts* or *stressors* within a story fundamentally driven by people and their systems. The "human/institutional response" test (Step 3) is your strongest tool from the argument with your friend. Use it relentlessly. Your showrunner with the PhD will appreciate the methodological rigor; your writers will learn to build stronger, more evidence-based stories centered on human drama.
