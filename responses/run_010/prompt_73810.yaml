  But in our example, we only used the model prior. In the full two-part MDL, we would use L(model) + L(data|model). For M1: L(M1)=6 bits, and L(data|M1)=0 because the data is exactly as predicted. For M3: L(M3)=14 bits, and L(data|M3)=0. For M2: L(M2)=10 bits, and L(data|M2)= -log2( (3/4)^9 * (1/4)^3 ) = - [ 9*log2(3/4) + 3*log2(1/4) ].

