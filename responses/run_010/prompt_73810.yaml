  A defender of minimum description length might say that we have not considered the shortest description that accounts for the data. The model M3 is not the true model: the true model is that the machine fails at hours 4,8,12,13, but then what? The model M3 says fails at multiples of 4 and at hour 13. But then at hour 16, it would fail again? But in the true model, after hour 13, we might have a different pattern. But for predicting hour 13, M3 is correct. But then for hour 14, it might be wrong. But we are only predicting one step.

