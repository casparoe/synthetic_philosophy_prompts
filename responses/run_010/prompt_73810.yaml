  What if we soften the deterministic candidate to allow a small error rate? For example, we could have a model that is periodic with period 4 but with a small probability of error. Then it would assign a small probability to C at hour 13. Then the shortest-description rule might not be adopted as is? But the friend's view is to adopt the shortest description that accounts for the observations. If we soften, then the model might not fit exactly? But if we allow a probabilistic model that is the periodic one with noise, then it would have a longer description (because we have to encode the noise level). For example, we could have:

