  The mixture in the two-part MDL is not the same as Solomonoff. In the two-part MDL, we choose the model with the shortest total code length. But in Solomonoff, we use a weighted mixture.

  To avoid the problem, we might need to include the prediction of the next observation in the code length. But for the next observation, we haven't seen it. So we can't.

  The point is: the shortest model (in two-part or just the model) can be refuted by the next observation, while the mixture does not put all its eggs in one basket.

  What would change my mind? If we could show that in this scenario, the true model is not the one we think, or if we had not included the true model in the candidate set. But we did include it. Or if the bit-lengths were so close that the mixture also assigned near zero probability to the true model. But in our case, it assigned 1/16384 to M3, which is small but not zero. And it turned out that the next event was C, so that small weight saved us from infinite loss.

