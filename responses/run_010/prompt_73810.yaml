  Weights: M1': 2^{-10}, M2: 2^{-10}, M3: 2^{-14}

  Total Z = 2^{-10} + 2^{-10} + 2^{-14} = 2 * 2^{-10} + 2^{-14} = 2^{-9} + 2^{-14} = 32/32768 + 2/32768 = 34/32768? Wait, 2^{-9}= 1/512 = 64/32768? Let me compute:

  2^{-10} = 1/1024 = 32/32768? 32768 / 1024 = 32, so yes, 1/1024 = 32/32768.
  2^{-14} = 1/16384 = 2/32768.

  So Z = 32/32768 + 32/32768 + 2/32768 = 66/32768 = 33/16384.

  P(C) = [ (32/32768) * epsilon + (32/32768) * (1/4) + (2/32768) * 1 ] / (66/32768)
        = [ 32*epsilon + 8 + 2 ] / 66   (because 32/32768 * 1/4 = 8/32768, and 2/32768)
        = (32*epsilon + 10) / 66

