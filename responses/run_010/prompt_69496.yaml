  What's interesting is their self-aware hypothesis: they suspect there were actually two distinct questions masquerading as one debate (singular causation vs explanatory units), and that the "indexicality worry" makes covering laws either trivial or non-projectible in historical contexts. The ferry case is their litmus test—a concrete example where neither framework seems to fit.

