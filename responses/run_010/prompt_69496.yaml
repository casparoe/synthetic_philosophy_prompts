answer: |-
  Your diagnosis is razor-sharp and largely correct—but the ferry case reveals something deeper. Let's dissect this systematically.

  ### 1. **The Core Impasse: Two Questions, One Mask**
  Your "two questions" hypothesis holds:
  - **Covering-law proponents** (Hempelians) care about *epistemic warrant*: What justifies claiming "A caused B" in a singular case? Their answer: implicit general laws.
  - **Narrativists** care about *explanatory comprehension*: What makes a sequence of events intelligible *as a whole*? Their answer: configurational understanding (colligation, emplotment, narrative coherence).

  The stalemate arises because neither side addresses the other's concern. When Hempelians reduce Dray's "rational explanation" to a covering-law schema (e.g., "Agents generally act rationally given beliefs/desires"), they sidestep the *particularity* of historical judgment. When narrativists invoke "story coherence," they ignore how to validate *causal claims* within the narrative. **The debate conflated validation with understanding.**

  ### 2. **The Ferry Case: A Fatal Counterexample**
  Your ferry shutdown example demolishes both frameworks:
  - **No covering law**: No non-trivial law predicts "overlapping certification + rigid rules → shutdown." A "law" like "Bureaucratic misalignments cause operational failures" is unfalsifiable mush. Specify it further (e.g., threshold engineer counts), and it becomes non-projectible beyond ferries/hulls/harbor rules.
  - **No rational action**: As you note, no agent *chose* the outcome. Dray’s model fails.
  - **The real structure**: This is a **constraint-based explanation**. It traces how *locally rational rules* (crew scheduling, safety inspections) generated an *emergent dysfunction* when combined. Historians excel at revealing these *causal architectures*—configurations where elements interact to produce unintended consequences.

  ### 3. **Indexicality: Worse Than You Suspected**
  Your indexicality worry is correct but understated. Historical "laws" aren’t just non-projectible—they’re **descriptively inert**. Consider:
  - A "tight" law (e.g., "Ferries with ≤2 engineers during inspections shut down if rules forbid shift changes") is just a redescription of *this* case. It explains nothing new.
  - A "loose" law (e.g., "Institutional inertia causes failures") can’t predict *when* or *how* failure occurs.

  **Hempel loses either way**: The former is ad hoc; the latter lacks explanatory power. Meanwhile, narrativists rightly note that the *explanatory insight* lies in the contingent configuration—but still lack tools to validate why *these* constraints mattered.

  ### 4. **What Historical Explanation *Really* Is**
  Your ferry case points to a better model:  
  **Historical explanation is counterfactual dependence tracing within a constraint space.**  
  - Identify key constraints (rules, resources, incentives, beliefs).  
  - Show how the outcome *depends* on their interaction.  
  - Use comparison (implicit or explicit) to highlight what made *this* configuration decisive.  

  In the ferry case: The shutdown *depended on* (a) the certification rule, (b) the scheduling system, (c) the inspection window, *and* their collision. Change one (e.g., allow provisional certifications), and the outcome alters. No "laws" or "reasons" are needed—just dependency relations in a concrete system.

  ### 5. **Paths to Progress (Concrete Steps)**
  #### A. **Dissolve the False Binary**
  - **Distinguish validation from comprehension**: Admit that warranting singular claims (e.g., "Rule X contributed to shutdown") requires different tools (e.g., causal graphs, process tracing) than rendering a sequence intelligible (narrative, mechanisms).  
  - **Embrace mechanismic explanation** (Machamer, Darden, Craver): Focus on *how* events connect via real-world entities and activities (e.g., "The scheduling system interacted with the rulebook to disable contingency planning"). This bridges generality and particularity.  

  #### B. **Formalize Constraint Spaces**
  - Develop models for **constraint-based explanation**: Use causal networks (e.g., Bayesian networks) to map how rules/resources/beliefs *enable or disable* actions. Test dependency via counterfactuals ("Would altering X change Y?").  
  - **Apply computational historiography**: Simulate counterfactuals (e.g., "What if the harbor master had override authority?"). Tools like agent-based modeling can formalize "configurations" without universal laws.  

  #### C. **Corpus Test: Falsifiability in Practice**
  - **Protocol**: Give historians/philosophers cases like your ferry example. Ask:  
    - *Historians*: "What evidence would undermine this explanation?"  
    - *Philosophers*: "What general claim is being made, and how could it be falsified?"  
  - **Predicted Result**: Historians focus on *specific dependencies* ("If we found engineers could certify remotely, the explanation fails"). Hempelians struggle to isolate testable generalizations. Narrativists focus on coherence ("If the rules were routinely ignored, the story loses plausibility"). **This exposes the disconnect.**  

  #### D. **Change the Question**
  Retire "Is history scientific?" and ask:  
  - **"How do historians isolate causally relevant differences?"** (e.g., Why did *this* ferry fail when similar ones didn’t?)  
  - **"How do constraints propagate consequences?"** (e.g., How did certification rules interact with labor markets to create vulnerability?)  

  ---

  ### Conclusion: Why Your Hypothesis Wins (Mostly)
  The "two questions" diagnosis is correct—but the ferry shows something radical: **Both frameworks misidentify the explanandum**. History explains *how contingent constraints generate outcomes*, not universal patterns or individual reasons. Progress requires tools to model *particular causal architectures*. The covering-law model isn’t just inadequate—it’s a category error. Narrative alone can’t validate claims. **The future lies in constraint-based mechanismic explanation**, blending configurational insight with rigorous dependency-tracing. 

  > "The historian’s task isn’t to find laws *in* events, but to reconstruct the logic *of* events—the temporary, local, and often accidental logic that makes things happen as they do."  
  > — Your ferry engineer, probably.
