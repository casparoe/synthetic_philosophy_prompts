prompt: |-
  ok so I'm a 3rd year psych student and for the last two semesters I've been RA-ing for a prof who runs a tiny forecasting outfit that does numbers for the city and the health authority — mostly "how long will this take," "what'll it cost," "what's the chance this program hits its target." We just did the inside view vs outside view week in my judgment and decision making seminar so I know the party line, but I'm trying to write up what she actually does, and her verdicts are weirder than the textbook version.

  Her record this year, roughly in her own words:

  1. Health authority wanted a base rate for how long a particular complex surgery takes; they had 300 comparable cases on file. The surgeon pushing back had done about 40 of them, kept her own logs, and could point at the specific anatomy in front of her. Prof submitted the surgeon's number, flat, no splitting the difference.
  2. A startup founder came in with a beautiful bottom-up plan, every task costed out from first principles, never checked against anything real, and zero forecasting history. Prof submitted the base rate for comparable seed-stage companies and basically ignored the plan.
  3. Same surgeon, different fight — her department's funding depended on her operative numbers looking good, and she was arguing her own numbers beat the national registry because of who gets referred to her. Prof sided with her anyway.
  4. A first-of-its-kind city pilot where nobody could agree on the reference class at all — municipal IT projects? social programs? nothing? Prof picked municipal IT projects herself and used that base rate, over the program director's confident, extremely detailed prediction of success (director had no track record and no account of why this one would beat the class).
  5. A dean predicting time-to-fill a faculty hire, which is a domain where you basically never get clean feedback. She had a log of her last six searches that came in close, plus a mechanism: the sub-specialty has exactly four people finishing this year and two are already spoken for. Prof went with the dean.

  The new case is why I'm bugging you: she's at a conference until Monday and my initials go on the number we send over Friday. A water systems operator, 30 years on the job, whose past failure predictions were logged and are genuinely well calibrated — best record in our whole dataset — says pump station 4 will fail before the end of the summer and wants it replaced now. Vibration, temperature and current draw are all nominal, nothing out of range anywhere. His reasoning is that the sound of it has changed, and in his experience that sound shows up about a year before the bearings go. He's got nothing riding on it, he retires in two years. The replacement is like $400k; if he's wrong nothing happens, if he's right and we wait the east side loses pressure for a week.

  So what does she say, and what rule is she actually running? I can already see two that seem to fit all five of those verdicts and then split on this one — something about whether the person has a documented, feedback-fed record, and something about whether there's a case-specific causal mechanism vs just a vivid story — and I can't tell which she's on. Give me your best guess at her verdict, then walk me through which candidate rules survive all five and which ones die, and say which of the five are the load-bearing verdicts doing the killing (I suspect 2 and 4 are doing most of the work but I'm not sure). Then tell me what each surviving rule says about pump station 4, and give me one case I could bring her Monday that would settle it definitively. And since I'm the one signing off — if her precedents genuinely don't decide this, tell me what principle I'd be committing myself to by going with the operator versus going with the base rate, because I have to write a single sentence of justification either way and I don't want it to be a sentence that contradicts cases 1 through 5.
reasoning: |-
  Okay, let me unpack this fascinating forecasting dilemma. The user is a psych student RA trying to reverse-engineer their professor's decision-making pattern from five real cases, and needs to apply it to a high-stakes pump station prediction due Friday. 

  First, I notice the user's framing - they're not just asking for an answer but for the underlying rule structure. That tells me they're thinking like a researcher, which makes sense given their psych background. The urgency is palpable though - that Friday deadline looms while the prof is away.

  Hmm... the five cases present a puzzle. At first glance they seem contradictory: sometimes the prof sides with the insider view (surgeon, dean), sometimes with base rates (startup, IT project). But looking closer, three patterns emerge: 

  1) When domain experts have feedback-calibrated intuition AND a causal mechanism, she favors them (cases 1,3,5). 
  2) When insiders lack calibration or mechanism, she defaults to base rates (cases 2,4). 
  3) The surgeon case #3 is particularly telling - she trusted calibrated expertise even with potential bias because the mechanism (referral patterns) was credible.

  Now for the pump station operator. Let's map him to the framework:
  - His calibration is impeccable (best in dataset)
  - His mechanism ("sound precedes bearing failure") is causal
  - No apparent bias (retiring soon, nothing at stake)
  - Yet... no current instrument readings support this

  This fits the expert-trusting pattern perfectly. But wait - case #2 punished first-principles reasoning without reality-checking. The operator's "sound" claim isn't instrumentally verified. Is that a dealbreaker? Probably not, because unlike the startup founder, this expert has decades of feedback confirming his sensory detection ability.

  For the user's Friday decision, I'd recommend siding with the operator. The justification sentence could be: "We prioritize calibrated expert intuition when supported by domain-specific causal mechanisms and uncontradicted by available data." This avoids contradicting prior cases - those rejected either lacked calibration (startup) or mechanism (IT director).

  To test the rule definitively, I'd propose a hypothetical case where a highly calibrated expert presents a mechanism BUT current data contradicts it. Say an oncologist with perfect prognosis record insists a patient's benign tumor will metastasize based on "tissue appearance," but all scans and markers disagree. Which way would the prof jump? That'd force the calibration-vs-data tension.

  The user's deeper need here is confidence in their institutional knowledge - they don't want to misrepresent the prof's methods. Smart to look for load-bearing cases; #2 and #4 are crucial because they show where she rejects compelling stories without foundations. #3 is the counterweight proving she'll back experts despite apparent conflicts when the expertise holds up.

  Worth noting the emotional weight too - that $400k decision with neighborhood impacts. The user's academic question has real consequences, which explains their meticulousness. My response should honor that gravity while giving actionable analysis.
answer: |-
  Here's the breakdown of your professor's likely rule, the pump station verdict, and how to test it:

  **Your Professor's Likely Rule (Survives All 5 Cases):**

  > **Trust the insider view *only if* the insider possesses:**
  > **1.  Demonstrated Calibration:** A documented history of accurate predictions/assessments *in the specific domain*, fed by clear feedback loops.
  > **2.  A Plausible Causal Mechanism:** An explanation rooted in domain-specific causality, not just correlation or narrative.
  >
  > **Otherwise, default to the relevant outside-view base rate.**

  **Analysis of the 5 Cases (Load-Bearing Verdicts Highlighted):**

  1.  **Surgeon (Surgery Time):** **INSIDER.** *Why?* Calibration: 40 specific cases (feedback loop exists). Mechanism: Specific anatomy of *this* patient.
  2.  **Startup Founder:** **OUTSIDER.** *Why?* **Load-Bearing.** Calibration: Zero forecasting history (no feedback loop). Mechanism: First-principles plan untethered to reality (no causal link proven/tested).
  3.  **Surgeon (Funding/Registry):** **INSIDER.** *Why?* Calibration: Her specific logs (feedback loop). Mechanism: Referral patterns creating a genuinely different population (causal explanation for deviation).
  4.  **Program Director (Pilot):** **OUTSIDER.** *Why?* **Load-Bearing.** Calibration: No track record (no feedback loop). Mechanism: "Confident, detailed prediction" is just a story/narrative, lacks a *causal* reason why *this* project beats the base rate class. Prof *chose* the most defensible base rate.
  5.  **Dean (Hire):** **INSIDER.** *Why?* Calibration: Log of 6 comparable, close searches (feedback loop exists, even if imperfect). Mechanism: Specific supply constraint in the sub-specialty (causal bottleneck).

  **Why Other Candidate Rules Fail:**

  *   **"Always trust experts with skin in the game" (Fails Cases 2 & 4):** Startup founder had skin in the game but was rejected. Program director likely had skin in the game but was rejected. Surgeon in Case 3 had skin in the game (funding) and was trusted.
  *   **"Always prefer causal mechanism over base rate" (Fails Case 2 & 4):** Startup plan *was* causal (first principles) but rejected due to lack of calibration. Program director's "detailed prediction" implied causality but was rejected due to lack of calibration/history.
  *   **"Always trust documented records" (Fails Case 5 & potentially 3):** Dean's log was sparse but accepted. Surgeon's logs (Case 3) were accepted over the national registry. The *quality* (feedback-fed calibration) matters more than just existence.
  *   **"Split the difference" (Fails All):** She never did this.

  **Pump Station 4 Verdict (Applying the Rule):**

  *   **Operator:** Possesses **exceptional documented calibration** (best record in the dataset, 30 years of logged predictions with feedback). Offers a **plausible causal mechanism** ("that sound shows up about a year before the bearings go" – sensory cue linked to a specific failure mode via experience).
  *   **Sensors:** Show nominal readings. This *contradicts* the operator's sensory input but **does not invalidate his mechanism**. Sensors measure different proxies (vibration, temp, current) than the operator's cue (sound). They might not detect the *specific* pre-failure state his ear identifies. They act as guardrails against obvious failure, not necessarily early detection.
  *   **Bias:** Explicitly stated as none (nothing riding on it, retiring).

  **Professor's Likely Verdict: TRUST THE OPERATOR.**

  **Justification Sentence (For You to Use Friday):**
  > "We prioritize the forecast of the water systems operator due to his exceptionally well-calibrated intuition in this specific domain and the plausible causal mechanism linking the reported auditory cue to impending bearing failure, despite nominal instrument readings."

  **Case to Settle the Rule (Present to Prof Monday):**

  > **The Case of the Contradicted Calibration:** Imagine a highly calibrated senior train dispatcher (20-year logbook, near-perfect calibration predicting delays on her route) reports a "feeling" that Bridge X is unstable *today* and will cause a derailment if a heavy freight crosses it. Her mechanism: "The way the wind whistles through the truss changed this morning, and that's how the old Mill Creek bridge sounded the day before it collapsed." However, **real-time structural sensors on Bridge X (strain gauges, accelerometers) show all readings are solidly within normal historical ranges and safety margins.**
  >
  > *   **Why it Settles the Rule:** This directly pits exceptional calibration + plausible mechanism **against** contradictory hard data from instruments designed to measure the exact thing the expert is concerned about (structural integrity). Does the prof still trust the calibrated expert's sensory mechanism over the instruments? If yes, she prioritizes calibration+mechanism *absolutely*. If she defaults to the sensor data (a form of highly specific, real-time "base rate" or measurement), then her rule requires the mechanism to be **consistent with available data**, making the pump station case (where sensors were merely nominal, not contradictory) a clearer win for the operator.

  **Your Commitment Principle (If Precedents Truly Don't Decide It - Though They Do):**
  If you felt genuinely stuck (which you shouldn't be, based on the rule above), the core principle you'd be committing to by choosing the operator is: **"Exceptionally calibrated expert intuition, grounded in domain-specific causal mechanisms, constitutes a valid 'inside view' that supersedes even relevant outside-view base rates when the expert's specific cue is not directly contradicted by available data."** Choosing the base rate would commit you to: **"Instrumental measurements defining 'nominal operation' establish a sufficient outside view, overriding expert intuition even when calibrated, unless the expert's mechanism is demonstrably measuring something the instruments cannot detect."**

  **Conclusion:** Based on the pattern in cases 1, 3, and 5 (trusting calibrated expertise with mechanisms) and the rejection in cases 2 and 4 (lacking calibration/history), the operator wins. Sign off with the justification provided. The pump station case strongly reinforces the rule – it's a near-textbook example of when to trust the calibrated insider view. Good luck on Friday!
