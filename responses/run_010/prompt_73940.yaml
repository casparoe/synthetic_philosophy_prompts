prompt: |-
  I'm a backend engineer and I've volunteered for a fourty-minute lunch-and-learn at work on predictive processing / the free energy principle. Audience is about fifteen engineers, all sharp, zero philosophy, and half of them have seen Friston mentioned on twitter. Don't explain the theory to me — plan how I should explain it.

  What I need: the order the pieces have to go in (I keep wanting to open with the Kalman filter analogy and I suspect that'll poison everything downstream), the one example that should carry the whole talk — I was going to use a baseball outfielder tracking a fly ball without solving any differential equations, tell me if that's the right one or if it backfires — and the misconceptions they'll bring or form, plus exactly where in the sequence to head each one off. The ones I'm bracing for: "surprise just means being startled", "this is literally gradient descent on a loss function", and the dark room objection (if you're minimizing surprise why not sit in a dark room). Also say what I should openly refuse to cover at this level, and give me one question I can ask at the end to check whether it landed.

  Format: exactly five numbered items, in that order — sequence, example, misconception map, what to skip, the check question. One or two sentences each, no intro, no conclusion.
reasoning: |-
  Hmm, the user is a backend engineer preparing a lunch-and-learn on predictive processing and the free energy principle. They need a structured plan to explain this complex topic in just forty minutes to fellow engineers who are sharp but have no philosophy background. 

  The key constraints are clear: focus on practical sequencing, choose one strong example to carry the talk, address specific misconceptions upfront, declare what to skip, and end with a check question. 

  I notice the user already recognizes potential pitfalls - like opening with Kalman filters which might anchor the audience too rigidly. Their proposed baseball outfielder example seems promising because it showcases real-time prediction without complex math, but I need to confirm if it truly illustrates active inference. 

  The misconceptions they listed are spot-on - especially the "dark room" objection that derails many intro discussions. Each needs surgical prevention at specific points. 

  For the sequence, I'll prioritize grounding in perception first before introducing action (to avoid "why not just act" confusion). The example must demonstrate both prediction and action correction seamlessly. 

  What to skip is crucial - no math derivations, no Markov blankets, no consciousness debates. Keep it tightly focused on the predictive loop. 

  The check question should test if they grasp the core shift from reactive to predictive processing. "Why don't we just sense the world?" could reveal if they understand perception as active construction.
answer: |-
  Here's your five-item plan:

  1.  **Sequence:** Start with perception as *active inference* (brain as prediction engine), introduce *prediction errors* as the driver, then show how action minimizes prediction error (motor control as changing inputs to match predictions), finally frame *surprise* as long-term prediction error (free energy). Avoid Kalman filters early; they oversimplify the generative model.
  2.  **Example:** Use the **baseball outfielder**. Describe them predicting the ball's landing point based on initial trajectory (generative model), constantly updating this prediction using visual input (prediction error minimization), *and* actively running to where the ball *will be* (action minimizing future prediction error). This shows perception-action unity without math.
  3.  **Misconception Map & Preemption:**
      *   **"Surprise = Startle":** When defining surprise, immediately contrast brief sensory startle (e.g., loud noise) with *persistent prediction failure* (e.g., utterly failing to understand a situation). Emphasize surprise as *model inaccuracy*.
      *   **"Just Gradient Descent":** Acknowledge the similarity when explaining prediction error minimization, but stress that FEP is about *what* is being minimized (surprise via changing predictions *or* inputs) and the *generative model's* role in defining the "loss".
      *   **"Dark Room":** After introducing surprise minimization, preempt this by stating organisms must maintain *essential variables* (e.g., blood sugar, body temp). Sitting in a dark room *maximizes* surprise long-term because your internal state drifts from viability. Minimizing surprise requires actively seeking predictable inputs that maintain homeostasis.
  4.  **What to Skip:** Explicitly refuse to cover the *mathematical derivation* of Free Energy, the specifics of *Markov Blankets* (beyond "systems have boundaries"), and *consciousness/philosophical implications*. Stick to the core perception-action loop.
  5.  **Check Question:** End with: **"If our brains are fundamentally minimizing prediction error, why don't we just hallucinate a perfectly predictable world?"** A good answer touches on the constraints of sensory input and the survival cost of a completely inaccurate model.
