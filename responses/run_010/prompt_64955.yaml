  ### Self-Sorting Sidebar Quiz: What Is "Knowing How"?  
  Answer these 10 concrete questions based on your intuitions. No prior philosophy knowledge needed—just your gut reactions. At the end, a scoring key reveals where you stand in the debate about skill, knowledge, and machines.  

  ---

  #### **Questions**  
  *(Each question rules out or splits between key positions. Options are designed to isolate core intuitions without jargon.)*  

  1. **The Paralyzed Pianist**  
     A concert pianist becomes paralyzed and can no longer play. She can still describe exactly how to perform complex pieces and perfectly judge others' performances. Does she still *know how* to play?  
     - A) Yes, her knowledge is intact.  
     - B) No, she’s lost the ability.  
     *Splits:* Rules out views that ignore physical ability (e.g., strict intellectualism). Tests if know-how requires current capability.  

  2. **The Book Learner vs. The Inarticulate Expert**  
     Person A reads every book on swimming but has never entered water. Person B has saved lives as a lifeguard for 30 years but can’t explain a single stroke. Who *knows how* to swim?  
     - A) Only the book learner.  
     - B) Only the expert.  
     - C) Both, in different ways.  
     *Splits:* Embarrasses intellectualism (if A) and anti-intellectualism (if B). Tests if know-how requires practical experience or propositional knowledge.  

  3. **The Novice and the Master Driver**  
     A novice driver and a Formula 1 champion both know how to drive, but the champion is far more skilled. Is this a difference in *how much* they know how to drive?  
     - A) Yes, know-how comes in degrees.  
     - B) No, it’s binary—they both "know how," but one executes better.  
     *Splits:* Rules out views where know-how is all-or-nothing (e.g., classical intellectualism). Tests if skill depth is part of know-how.  

  4. **The Injured Carpenter**  
     A master carpenter suffers a brain injury. She recalls every fact about woodworking but produces chaotic results when trying to build. Has she lost her know-how?  
     - A) Yes, she can’t do it anymore.  
     - B) No, the facts are still there.  
     *Splits:* Rules out views that equate know-how with knowing-that. Tests if ability is essential.  

  5. **The Recipe Follower**  
     Someone bakes a perfect cake by blindly following a recipe, with no understanding of why steps work (e.g., why eggs must be room temperature). Do they *know how* to bake it?  
     - A) Yes, they succeeded.  
     - B) No, they lacked understanding.  
     *Splits:* Rules out views valuing outcome over process (e.g., crude dispositionalism). Tests if understanding is required for "intelligent" know-how.  

  6. **The AI Chess Champion**  
     An AI beats grandmasters at chess, explains its moves in plain English, and learns from mistakes. Does it *know how* to play chess?  
     - A) Yes, it passes every test.  
     - B) No, it lacks something non-physical (e.g., consciousness).  
     - C) No, but for non-mysterious reasons (e.g., no real grasp).  
     *Splits:* Rules out views that ignore embodiment/phenomenology. Tests if know-how is uniquely human. Option C forces specification of "what’s missing."  

  7. **The Untried Talent**  
     A person with innate athleticism aces a gymnastics routine on their first attempt, never having practiced. Did they *know how* to do it beforehand?  
     - A) Yes, they had the latent ability.  
     - B) No, practice was essential.  
     *Splits:* Rules out views requiring prior practice (e.g., Rylean training). Tests if know-how can be innate.  

  8. **The Juggler’s Confession**  
     Someone says, "I know *that* juggling involves tossing objects in a pattern, but I don’t *know how* to juggle." Is this distinction valid?  
     - A) Yes, knowing-that ≠ knowing-how.  
     - B) No, it’s confused—knowing-how is a type of knowing-that.  
     *Splits:* Rules out deflationism/intellectualism. Tests if the grammar reflects a real divide.  

  9. **Skill Degradation**  
     Can someone gradually lose know-how through disuse (e.g., a chef who forgets knife techniques after years in management)?  
     - A) Yes, know-how erodes incrementally.  
     - B) No, it’s all-or-nothing—degradation affects execution, not knowledge.  
     *Splits:* Rules out views where know-how is static (e.g., intellectualism). Tests if know-how is tied to practice.  

  10. **The Pilot and the Autopilot**  
      An experienced pilot hasn’t hand-flown a plane in years, relying entirely on automation. Does she still *know how* to fly?  
      - A) Yes, her skill is dormant.  
      - B) No, the machine "has" the skill now.  
      - C) The skill was always a human-machine collaboration.  
      *Splits:* Tests intuitions about human-machine partnerships. Directly addresses the column’s theme.  

  ---

  #### **Scoring Key**  
  Map your answers to the cells below. Cells represent core positions in the philosophy of know-how. Positions are defined by their answers to the questions, not by names.  

  **Cell 1: Rylean Anti-Intellectualism**  
  *(Know-how is intelligent practice; it can’t be reduced to rules or facts.)*  
  - **Answers:** 1B, 2B, 3A, 4A, 5B, 6C, 7B, 8A, 9A, 10B  
  - **Core:** Know-how requires embodied ability, understanding, and practice. Rejects "knowing-that" as foundational.  
  - **Verdict on pilots/radiologists:** They’ve lost true skill—relying on machines degrades know-how into passive monitoring.  

  **Cell 2: Intellectualism**  
  *(Know-how is a species of knowing-that: practical knowledge under a "practical mode of presentation.")*  
  - **Answers:** 1A, 2C, 3B, 4B, 5A, 6A, 7A, 8B, 9B, 10A  
  - **Core:** Knowing-how reduces to propositional knowledge (e.g., "I know *that* this action achieves this goal"). Physical ability is incidental.  
  - **Verdict:** Professionals retain know-how; machines augment access to propositions.  

  **Cell 3: Ability-Centered View**  
  *(Know-how is the ability to perform an action. Success defines knowing.)*  
  - **Answers:** 1B, 2B, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10B  
  - **Core:** Ability is necessary and sufficient. Degrees matter (Q3), and loss of ability = loss of know-how (Q4, Q9).  
  - **Verdict:** Pilots lose know-how without practice; machines don’t "have" ability—they’re tools.  

  **Cell 4: Dispositionalism**  
  *(Know-how is a disposition to succeed when trying. Focus on reliable outcomes.)*  
  - **Answers:** 1B, 2B, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10A  
  - **Core:** Similar to ability-centered but allows non-physical cases (Q10A). Success trumps understanding (Q5A).  
  - **Verdict:** Professionals retain a disposition (if they *could* act if needed); machines might share know-how if reliable.  

  **Cell 5: Hybrid (Practical Grasp + Propositions)**  
  *(Know-how requires both factual knowledge and a practical "grasp" of it.)*  
  - **Answers:** 1C (theoretical knowledge remains), 2C, 3A, 4C (lost practical part), 5B, 6C, 7B, 8A, 9A, 10C  
  - **Unnamed?** Yes—no major defender. *Why:* Combines intellectualist and Rylean elements incoherently. Practical grasp is vague, making it ad hoc.  
  - **Verdict:** Professionals retain propositions but lose grasp; machines supply grasp.  

  **Cell 6: Virtue-Epistemology**  
  *(Know-how is an intellectual virtue cultivated through training.)*  
  - **Answers:** 1B, 2B, 3A, 4A, 5B, 6B/C, 7B, 8A, 9A, 10B  
  - **Core:** Know-how is a reliable, praiseworthy skill tied to character (e.g., Aristotle’s *phronesis*).  
  - **Verdict:** Professionals atrophy without practice; machines lack virtues.  

  **Cell 7: Deflationism**  
  *(The know-how/know-that split is grammatical, not metaphysical.)*  
  - **Answers:** 1A/B (context-dependent), 2A/B (grammar varies), 3B, 4B, 5A, 6A, 7A, 8B, 9B, 10C  
  - **Core:** Language creates a false dichotomy. "Knowing how" is contextually useful shorthand.  
  - **Verdict:** The debate is misplaced—skill was never "in" the human or machine but in the system.  

