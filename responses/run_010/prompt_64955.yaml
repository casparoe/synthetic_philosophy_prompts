  2. Intellectualism: Knowing-how is a species of knowing-that (propositional knowledge) picked out by its practical content.
  3. Ability-centered views: Knowing-how is primarily about having the ability to perform the action.
  4. Disposition-centered views: Knowing-how is about having a disposition to succeed when trying.
  5. Hybrid views: Knowing-how requires both propositional knowledge and a practical way of grasping it (e.g., Stanley and Williamson).
  6. Virtue-epistemology: Knowing-how is a kind of intellectual virtue or skill.
  7. Deflationism: The distinction is merely grammatical and does not reflect a deep metaphysical difference.

