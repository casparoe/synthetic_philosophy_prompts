  ## Opening Remarks: Verbal Disputes Workshop

  [Clears throat, slight smile, look around the room]  
  Good Thursday morning! Welcome, everyone. Genuinely delighted to see so many faces here – and slightly terrified, in equal measure. It’s wonderful to have you all gathered for what promises to be… well, let’s say a *distinctive* two days on verbal disputes. Right then. Before we dive in, just the briefest housekeeping: fire exits are there and there, toilets down the hall, and yes, Professor Davies, the frankly alarming biscuit expenditure *will* be addressed in my final report. [Pause for slight chuckle]

  Now. I stand here acutely aware of the particular mix of perspectives warming these seats. We have our champions of what we might call… *quantifier fluidity*. Those who see much of ontology as a fascinating, perhaps inevitable, dance of linguistic frameworks potentially talking past each other. And we have our robust *structure realists*, convinced the world carves itself at certain privileged joints, waiting for our quantifiers to properly latch on. And, of course, those who might raise an eyebrow at the whole framing, the deflationists, wisely reserving judgement on whether the fight is worth the candle. All of you listening intently – and quite rightly – for any hint that the chair is smuggling in a substantive ontological commitment disguised as a platitude before we’ve even started.

  Which brings me to my first, utterly failed, attempt at neutrality. I wanted to say: "It’s great to see so many of you here!" But… *are* there many of you here? Depending on how we count – persons? human organisms? mereological sums? – the number might fluctuate alarmingly before I finish this sentence. I thought about observing that "We’ve got a full programme." But *what* is full? The programme booklet? Or the temporal slots abstractly conceived? And is there even *a* programme, or just a collection of talks? Perhaps I could note that "There’s a problem with the projector." But *is* there a projector? Or just particles arranged projector-wise? Is there a problem? Or just an unexpected arrangement causing frustration? [Pause. Look slightly exasperated, but amused]

  Even the simplest utterance seems to land us right back in the thick of it. This weekend, we’re exploring whether deep disagreements – about statues and lumps of clay, about heaps, about numbers, about the very furniture of the universe – might, at their core, be battles over language, over how we choose to deploy our ‘there is’ and ‘there are’. We’ll be revisiting familiar tools: the distinction between questions framed within a system and questions *about* which system to adopt; the method of elimination, asking what conceivable difference in the world would settle the matter. Thinkers you know well hover in the background.

  So, what to do? Perhaps we could try a temporary armistice? A weekend truce where we stipulate a harmless, pragmatic ‘there are’ just to get through the schedule? We’ll say ‘there are chairs’ so we can sit, ‘there are speakers’ so they can talk, ‘there are biscuits’… well, because. But here’s the rub: even *that* proposal is loaded. For our quantifier-variance friends, this might feel like conceding too much to a single, privileged ‘way things are’. For our neo-Aristotelians, it might sound like a capitulation to linguistic free-for-all, ignoring the real structure we perceive. The very act of stipulating neutrality might betray an ontological bias! [Shake head wryly]

  And that, perhaps, is the heart of our peculiar endeavour. We’re here to argue about whether certain arguments are merely verbal. But lurking beneath that, the truly vertiginous thought: *is our dispute about whether the dispute is verbal… itself a verbal dispute?* Does the regress bottom out? Or does it spiral? [Pause. Lean forward slightly]

  That’s the tension we inhabit for the next two days. It’s not about easy answers – I suspect if we had those, we wouldn’t be here. It’s about clarity, about understanding the terms of engagement, and about seeing where genuine disagreement might persist even when the linguistic fog clears… if it ever does. I have immense respect for the rigour and passion everyone brings to these questions, however differently we approach them. Professor Davies, I promise at least one session will be entirely biscuit-adjacent.

  So. Let’s embrace the complexity. Let’s listen carefully, challenge charitably, and try to map the fault lines – linguistic, ontological, or something else entirely. Our first speaker is ready to kick things off… [Glance towards first speaker] …assuming, of course, we can all agree there *is* a first speaker. Let’s find out.
