prompt: |-
  Working title: "Supererogation as a corner case" — first draft, about 850 words, written for a department workshop. Comments wanted, details at the bottom.

  ---

  **1.** The standard inventory of deontic categories is forbidden / obligatory / permitted, and then, awkwardly, supererogatory — the act that is morally better than what duty requires but which one may nonetheless omit without fault. The awkwardness is structural rather than merely taxonomic. If the supererogatory is just "permitted, and better than some alternative that is also permitted," then it isn't a fourth deontic status at all; it's a description of a region in the space of permitted acts, and we should stop talking as though we'd discovered a new modality. On the other hand, if it really is a status in its own right, then the usual tripartite picture was never complete, and theories built on it — most famously maximizing consequentialism, which Urmson took to collapse the distinction entirely, and which Wolf later attacked from the direction of the moral saint — have a hole in them the size of a category.

  **2.** My proposal is that the disjunction is false, because it assumes a single scale. There are two. One is a graded, roughly impersonal ordering of acts by how good they are; call it the evaluative ranking. The other is binary, agent-indexed, and answers a different question entirely: not "how good is this?" but "may this agent be held to it?" The supererogatory is the set of acts that sit at the top of the first ranking while falling inside the permitted region of the second. That's why the category feels both real and derivative: it's real because the two rankings genuinely come apart, and derivative because nothing new is being added to the deontic machinery. It's a corner case generated by a mismatch of scales, not a fourth primitive.

  **3.** The interesting question is then what fixes the permitted region, and here I want to say something deflationary. A demand can be issued against an agent only if issuing it generally is sustainable — only if violations can be met with resentment, blame, and enforcement without wrecking the conditions under which holding anyone to account works at all. Demanding is not free. It consumes normative slack, it licenses reactive attitudes that have to be paid for somewhere, and it crowds out the agent's own projects, along with whatever good those projects were producing. So the boundary of obligation falls where the marginal cost of demanding exceeds the marginal value of compliance. This is not a claim about how good acts are; it is a claim about the price of accountability, and the price is what caps the demand.

  **4.** That gets us a prediction, and it gets Singer's shallow-pond case for free rather than as a special pleading. As the cost of performing a good act falls while the good stays fixed, demanding it becomes progressively more worth the price, and acts migrate across the line from supererogatory to obligatory. Kidney donation stays on the far side even though a life is at stake, because a regime that demands organs is ruinous in exactly the way paragraph 3 describes. So the familiar embarrassment — why is it obligatory to wade into a pond and not obligatory to give up a kidney, when a child's life is at stake in both? — dissolves. We are not valuing a life less than a kidney. We are pricing two different demands, and the demands are priced differently.

  **5.** The trouble is forgiveness, and I don't have a fix. Forgiving someone who wronged you is routinely listed as supererogatory; it is cheap for the forgiver, it is good for both parties, and on my account cheap-plus-good should make it demandable, hence obligatory. But we feel quite strongly that the victim is entitled to withhold, and that anyone who insisted on forgiveness would be doing something impermissible. So cost cannot be the only variable. What's missing looks like jurisdiction: certain claims belong to a particular person, and only the holder can press or waive them, so the practice as a whole has no standing to demand the waiver. On that reading supererogation shows up in two structurally unrelated places — where demanding is too expensive, and where demanding simply isn't ours to do.

  **6.** If that's right the category is disjunctive and probably not unified, which would be a mildly interesting negative result. The alternative is to treat jurisdiction as a limiting case of cost: to enforce a demand against the claim-holder's own wishes is to destroy the thing that makes holding-to-account possible in the first place, namely a person with standing, and that is the most expensive demand of all. I lean toward this second line and I have no arguement for it.

  ---

  Okay, comments. Some specific asks, in roughly the order I care about them:

  1. Is paragraph 2 actually saying anything, or is it a redescription of the standard "two scales" / "two levels" move that people have made about supererogation for decades? If it's the latter, tell me which version of it I've reinvented and what, if anything, survives.

  2. Paragraph 4 claims to explain the pond/kidney asymmetry. I suspect a reviewer will say I've relabelled it. If you think it's a relabelling, the useful thing would be a concrete case that breaks the prediction — either one where the cost of the good act drops a lot and it stubbornly stays supererogatory, or one where the cost rises and it becomes obligatory anyway.

  3. There's a circularity worry I can feel but can't articulate: paragraph 3 makes the extension of "obligatory" depend on facts about the practice of holding responsible, and the practice of holding responsible is itself supposed to be governed by what's obligatory. Is that vicious, or is it the same kind of bootstrapping that shows up in, say, rule-consequentialist accounts of rules? Tell me which, and why.

  4. Is paragraph 5 fatal or fixable? If fixable, I want to know whether you'd take the jurisdiction route or the "jurisdiction as limiting case of cost" route in paragraph 6 — and if you take the second one, does it collapse the whole account into a single variable again, which is what I want, or does it just move the disjunction somewhere else?

  5. Quietly: how much of this assumes consequentialism? I've tried to keep the evaluative ranking theory-neutral but I don't trust myself. Point at the sentences where a non-consequentialist should start objecting.

  House rules for the comments: don't summarise the essay back to me, don't open with praise, don't tell me it's interesting unless you also tell me where it stops being interesting. Rank the paragraphs worst to best and say in one sentence each why. And name the single sentence you'd cut first. Typos and rough edges in the prose are known and not worth mentioning — I care about the argument.
reasoning: |-
  Okay, let me tackle this philosophy paper draft on supererogation. The author wants focused feedback on specific argument points, so I need to be precise and avoid fluff.

  First, looking at paragraph 2 - the core claim about two scales. This does feel familiar; Chisholm's optionality framework comes to mind, where supererogation emerges from the gap between ought and good. The novelty here might be in framing it as a "corner case" from scale mismatch rather than a primitive category. But I should check if they're adding anything new to existing two-tiered theories.

  For paragraph 4's kidney-pond asymmetry explanation, I wonder if organ donation scenarios could test it. What if donating blood becomes extremely low-cost (like future tech making it painless)? Would it flip to obligatory? The author needs to handle cases where cost drops but social resistance keeps it supererogatory.

  The circularity worry in paragraph 3 is serious. The obligation definition relies on responsibility practices, which themselves reference obligations. This resembles rule-consequentialism's bootstrapping - maybe defensible if framed as reflective equilibrium rather than strict derivation.

  Paragraph 5's forgiveness problem seems fixable. The jurisdiction-as-cost approach could work if violating claim-holder autonomy undermines the entire accountability system. That might preserve the single-variable model without disjunction. But is that convincing? Maybe need to explore if all jurisdictional cases reduce to cost.

  On consequentialism assumptions: phrases like "graded impersonal ordering" and "marginal value of compliance" sound consequentialist. A deontologist would object at "the price is what caps the demand" in para 3 - rights shouldn't be subject to cost-benefit analysis.

  For paragraph ranking: 
  - Weakest is para 5 (forgiveness problem sticks out) 
  - Then para 3 (circularity issue) 
  - Para 1 sets up well 
  - Para 4 handles pond case cleanly 
  - Para 2 is strongest (clear framework)

  Sentence to cut: "This is not a claim..." in para 3 - redundant since the contrast is already established.

  The jurisdiction solution in para 6 feels promising if developed further. Need to see if it creates new problems elsewhere though.
answer: |-
  Here's a direct response to your queries, following your house rules:

  1.  **Paragraph 2:** This is a clear and useful *redescription* of the standard "two scales" move (e.g., Chisholm, Heyd, arguably even Urmson's critique implies it). What survives is the specific framing as a "corner case" generated by *scale mismatch* rather than a primitive category, and the emphasis on the derivative nature ("not a fourth primitive"). This framing is helpful for the overall argument structure but doesn't introduce new conceptual machinery.
  2.  **Paragraph 4 (Pond/Kidney):** The explanation avoids *mere* relabeling by grounding the asymmetry in the *system-level cost of enforcement* rather than just the *agent's cost*. A potential break case: **Mandatory Vaccination (Low Individual Cost/High Societal Enforcement Cost).** Getting a flu shot is very low-cost for the individual and provides significant good (herd immunity). Yet, making it *obligatory* (with sanctions for refusal) generates immense societal cost (enforcement, surveillance, political conflict, erosion of trust). Your model *predicts* it should become obligatory (low cost + high good). However, many societies treat it as supererogatory or weakly encouraged, resisting full obligation due to the high enforcement cost – *which your model acknowledges*. This *doesn't* break it; it *illustrates* it. The asymmetry holds because demanding wading is cheap/sustainable; demanding kidneys/vaccines isn't. Reviewer pushback might stem from wanting a *fundamental* difference, but you offer a *pragmatic* one grounded in practice.
  3.  **Paragraph 3 (Circularity):** The circularity is **not vicious; it's bootstrapping akin to rule-consequentialism.** You're describing a *practice* (holding responsible) that defines the *conditions* (sustainability) under which specific norms (obligations) within that practice can be meaningfully applied. The practice itself isn't *governed* by the specific obligations it generates; it's governed by its own functional requirements (sustainability). "Obligatory" is defined *relative to the sustainable practice*. This is similar to how rule-consequentialism defines "right" relative to rules whose *acceptance* is optimal, without needing a prior definition of "right" for the rule-selection process itself. The practice provides the foundation.
  4.  **Paragraph 5 (Forgiveness):** **Fixable.** I'd take the **"jurisdiction as limiting case of cost" route (para 6).** This avoids the disjunction and integrates jurisdiction into your core cost model. Demanding forgiveness *from the victim* isn't merely expensive; it actively *destroys the foundation* of the accountability practice by violating the claim-holder's essential standing/autonomy. This is the ultimate cost – undermining the system itself. This *doesn't* collapse the account into a single variable *if* "cost" is understood broadly to include *systemic sustainability costs* like destroying foundational agency. It preserves unity by showing how the jurisdictional limit is a *consequence* of the high cost of violating it, not an independent principle.
  5.  **Consequentialism Assumption:** The core assumption surfaces in the **evaluative ranking** ("impersonal ordering of acts by how good they are") and the **cost-benefit framing of obligation** ("marginal cost of demanding exceeds the marginal value of compliance"). A non-consequentialist (e.g., deontologist) would object most strongly to:
      *   "The boundary of obligation falls where the marginal cost of demanding exceeds the marginal value of compliance." (Para 3) - Rights/duties aren't subject to marginal utility.
      *   "We are pricing two different demands..." (Para 4) - Framing obligation as pricing.
      *   The *entire conception* of obligation as demand-sustainability rather than derived from categorical imperatives, rights, or relational duties. The "evaluative ranking" being impersonal and potentially aggregative is also a red flag.

  **Paragraph Ranking (Worst to Best):**

  1.  **Para 5:** Identifies a key counterexample (forgiveness) but leaves it unresolved, creating the most immediate vulnerability.
  2.  **Para 3:** Makes the crucial but potentially circular/core argument about the source of obligation; its success hinges on accepting the bootstrapping.
  3.  **Para 1:** Sets up the problem and disjunction effectively but is largely stage-setting.
  4.  **Para 4:** Applies the model convincingly to the classic pond/kidney case, demonstrating explanatory power.
  5.  **Para 2:** Provides the clearest and most essential conceptual framework for the entire argument (two scales, corner case).

  **Sentence to Cut First:** "This is not a claim about how good acts are; it is a claim about the price of accountability, and the price is what caps the demand." (Para 3) - This is redundant. The contrast ("not... but...") is already strongly implied by the preceding sentences describing the two distinct scales. Cutting it tightens the prose without losing the point.
