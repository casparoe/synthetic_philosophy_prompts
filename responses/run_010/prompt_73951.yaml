prompt: |-
  I'm one of five members of the electoral commission in a mid-sized country — we keep the national roll and we decide the contested cases about who belongs on it. Its been about twelve years of decisions now, roughly in order:

  - A man who left at age nine and has lived abroad 46 years, never paid tax here, holds another passport: kept on the national roll, votes by mail.
  - Lawful permanent residents with 12+ years here: added to the municipal roll only; their challenge to get on the national roll turned down.
  - People who live just over the border and commute in five days a week, 18 years running, paying full income tax here: kept off both rolls.
  - Citizens' children born abroad: on the roll if a parent registered them; the third generation born abroad, never resident here: struck off.
  - Adults under full legal gaurdianship: put back on the roll, reversing an old exclusion.
  - Prisoners: off the roll during the sentence, back on automatically at release; people on probation never came off at all.
  - Sixteen- and seventeen-year-olds: refused, but allowed to pre-register so they go on automatically at 18.
  - Foreign diplomats resident here, exempt from our taxes and largely from our courts: refused even the municipal roll.

  Next month's case. Something like 40,000 people were admitted under a 15-year guest-worker program: they live here the whole time with their families, pay full taxes and social contributions, are subject to all our law including criminal law, and there's no route to citizenship — the visas are non-renewable and at year 15 they have to leave for good. The first cohort is at year 13. Their home country takes the vote away from anyone abroad more than five years, so right now they vote nowhere. A lot of them have kids born here who are citizens under our birthright rule and will stay. They're only asking for the municipal roll.

  What will we decide, and what should we decide if we want to be consistent with ourselves? Be honest with me that more than one rule probably fits those eight verdicts. Lay out the candidates, say what each one predicts for next month and where each of them strains against our past cases, tell me which precedent is the closest analog and what in it is doing the real work, then give me your best guess plus your recommendation and say what principle we'd be committing ourselves to with each choice. Finally, name the hypothetical case you'd want brought in front of us next — the one that would actually force out which rule we're running.

  Say how confident you are in the rule you settle on, and flag the single step in your reasoning you're least sure about. American English, please.
reasoning: |-
  Okay, let me tackle this electoral commission case. The user is one of five members deciding whether guest-workers should be added to the municipal roll. They've provided eight past decisions and want a consistent approach. 

  First, I need to unpack those precedents. The kept cases seem to prioritize citizenship (like the man abroad) or physical presence with integration (like permanent residents only getting municipal rights). The rejections involve either territorial disconnection (border commuters) or allegiance conflicts (diplomats). 

  The guest-workers are tricky - they're deeply embedded locally (taxes, kids born here) but temporally limited. Their municipal request feels like the permanent resident case, but the 15-year expiration looms large. That sunset clause makes them look transient, like the diplomats who won't build lasting ties. 

  I'm noticing tension between two principles: "membership through rootedness" (which would include them) versus "franchise requires future stake" (which excludes them). The guardianship reversal suggests we value inclusion, but the diplomat refusal shows limits. 

  The closest precedent is actually the permanent resident case - both groups have long-term residence without citizenship path. But those residents had indefinite stay, while guest-workers have an expiration date. That difference might be decisive. 

  If I had to predict, the commission likely rejects them to avoid setting a "temporary means voting" precedent. But I'd argue for including them - their daily lives are municipally impacted, and 15 years is longer than many citizens reside in one place. The hardest part is squaring this with the border commuter refusal, though those folks slept elsewhere. 

  For a test case, I'd want to see someone with renewable 1-year visas living here 20 years - that would force the "temporary but perpetual" dilemma. My confidence is medium; the citizenship principle in Case 2 is strong, but their effective statelessness (voting nowhere) tugs at equity concerns.
answer: |-
  Here's a breakdown of your commission's likely decision path, the competing principles, and my analysis of consistency:

  **The Core Tension in Precedents:**  
  Your decisions reveal a conflict between two potentially governing principles:  
  1.  **Citizenship as Primary Gatekeeper:** National roll requires citizenship (Cases 2, 3, 4, 8). Municipal roll requires significant residence/connection *plus* lawful presence (Case 2 vs. Case 3).  
  2.  **Stakeholder Theory:** Voting rights attach to those subject to the jurisdiction's laws *and* having a concrete, enduring stake in the community (Taxation: Cases 3, 8; Enduring Ties: Cases 1, 6, partially 7; Exclusion due to Transience/Lack of Stake: Cases 3, 8).

  **Candidate Rules & Predictions:**  

  1.  **Rule: Citizenship is Necessary and Sufficient for National Roll; Lawful Permanent Residence (Indefinite) is Required for Municipal Roll.**  
      *   **Prediction:** REJECT guest-workers. They lack citizenship and their residence is explicitly temporary, not permanent.  
      *   **Fits:** Cases 1 (Citizen abroad), 2 (LPRs get municipal), 3 (Non-residents excluded), 4 (Citizenship rules), 8 (Non-citizen non-residents).  
      *   **Strains:** Case 5 (Guardianship - citizenship sufficient despite capacity? But kept). Case 6 (Prisoners lose vote temporarily - citizenship remains, stake interrupted). Case 7 (Pre-registration acknowledges future citizenship/stake). Doesn't explain *why* indefinite residence (Case 2) is the municipal threshold vs. long-term temporary (Case 3 commuters).  

  2.  **Rule: Subjection to Full Jurisdiction + Deep Social/Financial Integration + Reasonable Duration Creates a Local Stake Warranting Municipal Franchise.**  
      *   **Prediction:** **GRANT** guest-workers municipal roll access. They pay full taxes, are subject to all laws, live here full-time with families for 13-15 years, raising citizen children.  
      *   **Fits:** Case 2 (LPRs integrated get municipal), Case 3 (Commuters pay tax *but* lack full residency/family integration), Case 5/6/7 (Focus on connection/stake, even if modified).  
      *   **Strains:** Case 1 (Minimal current integration/stake, kept via citizenship). Case 4 (3rd gen abroad - citizenship insufficient without connection). Case 8 (Diplomats exempt from jurisdiction/tax - no integration). Struggles with the *permanence* distinction between Case 2 (LPRs) and the guest-workers.  

  3.  **Rule: Permanence of Status is Implicitly Required for Any Franchise.**  
      *   **Prediction:** REJECT guest-workers. Their status is explicitly temporary (15-year hard stop), unlike LPRs (Case 2) or even prisoners/probationers (Case 6) who have a path back.  
      *   **Fits:** Case 2 (LPRs have permanence), Case 3 (Commuters lack permanence here), Case 4 (3rd gen abroad lack permanence connection), Case 8 (Diplomats are temporary).  
      *   **Strains:** Case 1 (Citizen abroad lacks permanence *here*). Case 5/6/7 (Status can be fluid - guardianship, incarceration, age - but vote retained or path assured). Discounts the *depth* of current integration.  

  **Closest Analog: Case 2 (Lawful Permanent Residents - Municipal Roll Only)**  
  *   **What's Doing the Real Work:** The combination of **lawful residence status + significant duration (12+ years) + full integration into daily life/society (implied by long residence) + payment of taxes/subjection to laws.**  
  *   **Key Distinction for Guest-Workers:** The **lack of permanence/indefinite status.** LPRs have the right to stay indefinitely; guest-workers have a fixed, non-renewable endpoint. This is the crux.

  **Prediction & Recommendation:**  

  *   **Prediction (What You *Will* Likely Do):** REJECT the guest-workers' application. The **permanence distinction** from Case 2 (LPRs) will likely dominate. Citizenship is the bright line for national roll (Cases 1, 2, 4). For municipal roll, the precedent of requiring a *permanent* lawful status (Case 2) contrasts sharply with the explicitly temporary guest-worker status. Cases 3 and 8 reinforce exclusions based on transience or lack of enduring stake. The commission will likely see the 15-year sunset as creating an inherently temporary, non-stakeholding class despite their current integration.  
      *   *Principle Committed To:* **Permanence of lawful residence status is a prerequisite for municipal franchise, even alongside deep current integration and taxation.** Citizenship remains paramount for national franchise.

  *   **Recommendation (What You *Should* Do for Consistency & Equity):** **GRANT** municipal roll access.  
      *   *Reasoning:*  
          *   **Subjection & Integration:** They meet the core *functional* criteria from your most inclusive municipal precedent (Case 2 - LPRs): Long-term (13-15 yrs > 12 yrs), full-time residence (vs. Case 3 commuters), full taxation, full subjection to laws (including criminal law), deep social ties (families, citizen children raised here).  
          *   **Stakeholder Principle:** Their lives are entirely embedded in your municipalities *now*. They are governed by local laws, pay local taxes, use local services, and their children are citizens who will remain. Denying them a vote contradicts the logic used for LPRs and the reversal on guardianship (Case 5).  
          *   **Addressing Permanence:** While their *status* isn't permanent, their *current reality* (13-15 years) represents a significant, non-transient portion of life with concrete local stakes. The "no permanence" rule strains against Case 1 (citizen abroad permanently) and the focus on *current* integration in Cases 5 & 6.  
          *   **Avoiding Disenfranchisement:** They vote *nowhere*, creating a democratic deficit for people deeply integrated into your society.  
      *   *Principle Committed To:* **Deep, long-term, full integration into the local community and subjection to its jurisdiction creates a sufficient stake for municipal franchise, irrespective of citizenship or the indefinite permanence of status.** National roll remains citizenship-based.

  **Confidence & Uncertainty:**  
  *   **Confidence in Recommendation:** **Medium-High (7/10)**. The stakeholder/integration principle fits the *spirit* of your most relevant precedent (Case 2) and your inclusive moves (Cases 5, 7) better than a rigid permanence requirement.  
  *   **Least Sure Step:** **Balancing the "permanence" factor.** Case 2's LPRs had an indefinite right to stay, which *is* a meaningful distinction. Is 15 years of *known* temporary residence sufficiently different from 12+ years of *indefinite* residence to justify exclusion? This is the hardest conceptual leap. Your Case 3 (commuters) suggests the answer might be "yes," but their lack of *full-time residence* was also key.

  **The Revealing Hypothetical Case:**  
  Bring us someone with **renewable, long-term temporary visas (e.g., 5-year renewable, lived here 20 years continuously, paying taxes, integrated, no citizenship path).**  
  *   **Why it Forces the Issue:**  
      *   Eliminates the "hard 15-year stop" of the guest-workers, focusing purely on "temporary *status* but potentially permanent *de facto residence*."  
      *   Directly challenges the "permanence of *status*" vs. "permanence of *residence/integration*" distinction.  
      *   If you granted the guest-workers municipal rights, you'd *have* to grant this person. If you rejected the guest-workers based on temporary status, this case forces you to decide: Does renewable-but-technically-temporary status count as "permanent enough"? Or is *any* technically temporary status disqualifying, regardless of actual duration and integration? This would expose whether you're truly running a "permanent status" rule or a "deep long-term integration" rule.
