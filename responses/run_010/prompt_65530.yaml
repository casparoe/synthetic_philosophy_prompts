answer: |-
  ### Task 1: Diagnostic Questions  
  To classify traits, I apply three diagnostic questions:  
  1. **Current functional utility**: Does the trait confer a measurable fitness benefit *in its current state*?  
  2. **Developmental/architectural constraint**: Is the trait’s form or presence directly determined by unavoidable physical/developmental processes (e.g., tissue fusion angles, cavity geometry)?  
  3. **Phylogenetic inertia**: Is the trait present due to shared ancestry rather than current selection, especially if non-functional or maladaptive now?  
  These categories are not interchangeable because they reflect distinct causal pathways (selection vs. constraint vs. historical contingency). A trait may score high on both adaptation and byproduct (e.g., a keel shaped by development but co-opted for function).  

  ---

  ### Task 2: Two-Axis Ratings  
  | Trait | Axis A (Adaptation) | Axis B (Byproduct) | Classification           | Justification (Key Stipulation) |  
  |-------|---------------------|--------------------|--------------------------|---------------------------------|  
  | T1    | 3                  | 10                 | Byproduct later co-opted | Keel height is "monotonic function of fusion angle" (T1). Functional in 4 species, co-opted in 1, unused in 1. |  
  | T2    | 7                  | 8                  | Adaptation               | Gland "used in territory marking" with fitness benefit (T2), but pocket itself is architectural. |  
  | T3    | 2                  | 9                  | Phylogenetic legacy      | Webbing optimal in aquatic species but identical in terrestrial/fossil (T3); reduction impairs swimming but no other effects. |  
  | T4    | 0                  | 10                 | Architectural byproduct  | Liver mass tracks cavity volume "with slope matching prediction"; no diet/fitness correlation (T4). |  
  | T5    | 10                 | 1                  | Adaptation               | Tuft "use[s] it to brush off flies"; size predicts parasite load/sleep (T5). |  
  | T6    | 0                  | 3                  | Neutral variant          | Tint has "no difference" to function/behavior; arose in small populations (T6). |  
  | T7    | 0                  | 8                  | Phylogenetic legacy      | Cusp "plays no part in chewing" but present in fossil; costlier now (T7). |  

  **Notes**:  
  - **T1**: For the unused sixth species, Adaptation = 0, Byproduct = 10 (pure architectural effect).  
  - **T2**: Pocket is byproduct (B=8), gland is adaptation (A=7).  
  - **T3**: Adaptation score low for terrestrial species; would be 9 for aquatic.  

  ---

  ### Task 3: Tier List (Damage to Strict Adaptationism)  
  **Top Tier (Devastating)**:  
  - **T3 (Webbing)**: Present identically in non-aquatic species/fossil, proving it isn’t shaped *for* current function.  
  - **T6 (Eye tint)**: Neutral trait with no function, arising via drift in small populations—selection irrelevant.  
  **Mid Tier (Damaging)**:  
  - **T1 (Keel)**: Tallest keel in non-using species; height mechanically fixed, not optimized for function.  
  - **T4 (Liver)**: Purely allometric; zero adaptive deviation despite dietary shifts.  
  - **T7 (Cusp)**: Vestigial, costly, and retained only by ancestry.  
  **Bottom Tier (Absorbable)**:  
  - **T2 (Pocket/gland)**: Adaptationists would emphasize gland’s utility and ignore pocket’s origin.  
  - **T5 (Tuft)**: Clear current function; easily framed as "adapted for parasite defense."  

  ---

  ### Task 4: Rating the Argumentative Moves  
  1. **Score: 0.9** – Still vital. T3 and T7 show present utility (swimming, ancestral chewing) ≠ origin. Confusion inflates adaptation-counts (e.g., webbing in terrestrial species).  
  2. **Score: 1.0** – Unassailable. T1 (fusion angle dictates keel), T4 (cavity volume dictates liver), and T7 (cusp tied to enamel-knot sequence) prove constraints channel traits.  
  3. **Score: 0.4** – Weakened. Asymmetric scrutiny is rarer today (e.g., neutral/null models standard). But T6’s "no experiments showed function" might still be overlooked without explicit alternatives.  
  4. **Score: 0.7** – Retains force. Technical inaccuracy weakens the metaphor, but core point—that structures arise as byproducts of design necessities—stands (e.g., T1’s keel as fusion byproduct). Rhetorical power outweighs precision.  

  ---

  ### Task 5: Closing Judgements  
  **Least confident classification**: T1 (palatal keel). Stipulations imply keel height is developmentally locked (B=10), but its varied uses complicate adaptation scoring.  
  - **Key observation needed**: Measure fitness effects of keel height *within* the bark-stripping species. If taller keels improve stripping efficiency, A rises to 7 for those species; if not, A falls to 1.  
  - **Move needing rehabilitation**: Move 3 (asymmetric scrutiny). Score would rise to 0.8 if studies routinely tested non-selective hypotheses (e.g., drift simulations for T6, constraint models for T4) *before* invoking adaptation. Currently, such tests are common but not universal.
