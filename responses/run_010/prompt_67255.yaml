  First, I need to unpack the key concepts here: populism, anti-pluralism, and the nuances of democratic representation. The user is stuck on the technical correctness of the majority, but the issue isn't the math—it's the rhetoric and its implications. The winning side claiming exclusive representation is problematic because it erases the minority's legitimacy. 

  The user mentions they voted against the referendum, so their question isn't about personal disappointment but understanding the academic critique. They want to know if there's substance beyond mere disagreement with the outcome. 

  I should explain how "the people have spoken" becomes problematic when used to silence dissent. Democracies thrive on pluralism—acknowledging diverse views as legitimate. The winners' rhetoric implies that only their supporters are the "real" people, which is exclusionary and dangerous. This can lead to marginalizing opposition, undermining institutions, and fostering polarization. 

  Also, a 53% majority isn't a sweeping mandate. Nearly half the population disagreed, so governing as if only the majority matters ignores a significant portion. The Condorcet winner point is valid but doesn't address the ethical dimension of inclusive governance. 

