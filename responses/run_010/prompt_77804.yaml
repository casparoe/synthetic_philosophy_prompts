  - Point out: "This round (Round 1) is the analogue of non-resistant non-belief: the seeker is trying hard, but there is no response at all."
  - "In Round 2, the Hider could send ambiguous signals. Did that make it less frustrating? But note: the Seeker might not have understood the signals, and the chocolate might still have been withheld. This relates to the 'epistemic distance' reply: God might send signals that are ambiguous to preserve our freedom. But the hiddenness argument asks: what if the seeker doesn't recognize them as from God? Or what if they are too ambiguous to help?"
  - "In Rounds 3 and 4, the Seeker was lukewarm. The hiddenness argument is not about these cases because it requires a non-resistant non-believer who is capable of relationship and seeking. A lukewarm seeker is resistant in a way or not trying."
  - "The skeptical-theist reply says we cannot know what a loving God would do. But in the role-play, the Hider had a reason (on the card) that the Seeker didn't know. However, in the divine case, we don't have the card. We are in the dark about God's reasons. Is that a good enough reply? Note that in the role-play, the Hider might have been wrong about what was good for the Seeker (e.g., maybe the Seeker really needed the chocolate). But God is supposed to be perfectly loving and wise. So we have to trust that God's reasons are good, even if we don't know them. But then, why wouldn't God at least let us know that there is a reason? Or give us the card?"
  - End by connecting to the readings: "This activity is a model of Schellenberg's argument and the replies we read. The central difficulty is that from the seeker's perspective, silence feels like absence, but from the hider's perspective, it feels like care. The argument says that a perfectly loving God would not let the seeker be in that position of non-resistant non-belief. The replies challenge whether we can know what a loving God would do or whether the hiddenness is necessary for greater goods."

