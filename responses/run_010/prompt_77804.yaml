     We have 4 rounds. Each student is in the same pair for all rounds. In Rounds 1 and 2, Student A is the Seeker and Student B is the Hider. In Rounds 3 and 4, they switch: Student A becomes Hider and Student B becomes Seeker. Now, we vary the conditions:

     - Round 1: Strict silence, Seeker (Student A) is persistent.
     - Round 2: Ambiguous signals allowed, Seeker (Student A) is persistent.
