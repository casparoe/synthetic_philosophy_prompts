  **Timeline (40 minutes):**
  - 0-5 min: Setup. Move chairs into 8 pairs (each pair has two chairs facing each other). Explain: "We are doing a role-play about communication and withholding. Each of you will be paired with someone. In the first two rounds, one of you will be the Seeker and the other the Hider. Then you will switch roles for the next two rounds. The Seeker's goal is to get a chocolate bar from the Hider. The Hider has a reason to withhold it for the Seeker's own good. I will give you role cards with instructions. We will do four rounds, each 5 minutes. At the end of each round, the Hider will decide whether to give the chocolate to the Seeker. We will record the outcomes publicly."
