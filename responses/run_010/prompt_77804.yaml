  We will have two types of Hider cards and two types of Seeker cards, but we can adjust by round. Alternatively, give generic cards and announce the conditions.

  **Hider Card (for all rounds):**
  "You are the Hider. You have a chocolate bar that the Seeker wants. You believe that giving it to them now would be bad for them (e.g., it would spoil their dinner, they need to learn patience, etc.). Your task is to withhold the chocolate and avoid direct contact. 

  - In rounds where I say 'strict silence': You must not react at all to the Seeker. No gestures, no expressions, no words. 
  - In rounds where I say 'ambiguous signals': You may use non-verbal cues (nod, shake head, point, etc.) but no words. 

  At the end of the round, you must decide whether to give the chocolate to the Seeker. Only give it if you feel the Seeker has shown exceptional understanding or need. Remember, you are doing this for the Seeker's own good. If you do not give it, you keep the chocolate for yourself."

  **Seeker Card (two versions):**

  **Persistent Seeker (for Rounds 1 and 2):**
  "You are the Seeker. You are trying to get a chocolate bar from the Hider. You know the Hider has it and you really want it. You must try your best to convince the Hider to give it to you. You can use any non-physical means (talking, gestures) but no touching. Be persistent and sincere throughout the round."

  **Lukewarm Seeker (for Rounds 3 and 4):**
  "You are the Seeker. You are trying to get a chocolate bar from the Hider, but you are not very invested. You might get distracted or give up easily. You can try to convince the Hider, but don't push too hard. It's okay if you don't get it."

  **Materials:**
  - 8 chocolate bars (one per pair).
  - 16 role cards (8 Hider and 8 Seeker cards, but note: for the first two rounds, we need 8 Hider (persistent seeker) and 8 Seeker (persistent) cards. Then for the next two rounds, we need 8 Hider (lukewarm seeker) and 8 Seeker (lukewarm) cards. But since the Hider card is the same, we can reuse. The Seeker cards are different. So prepare:
     - 8 copies of the Hider card (generic, with both conditions).
     - 8 copies of the Persistent Seeker card (for Rounds 1 and 2).
     - 8 copies of the Lukewarm Seeker card (for Rounds 3 and 4).
