     We have two sets of two rounds. In the first two rounds, Group A is Seekers and Group B is Hiders. Then in the next two rounds, they switch: Group A becomes Hiders and Group B becomes Seekers. However, when they switch, the Seeker type changes (from persistent to lukewarm). This might be confusing because the same student will not experience both types of seeking. We want each student to experience both roles and both conditions. How to do it?

