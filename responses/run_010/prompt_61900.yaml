  They also need practical guidance on: which contract clause to use as an example (should it be airtight or vague?), what topics to avoid at this introductory level, and how to assess whether participants truly grasped the concept versus just feeling unsettled.

  I notice deeper needs beneath the surface:
  - They're trying to empower stewards to confidently challenge management's interpretations without sounding arbitrary
  - They need to validate the importance of filing grievances even when outcomes aren't guaranteed
  - There's an unspoken urgency - this isn't academic for them, it's about real workplace conflicts

  The philosophical concept (likely inspired by Wittgenstein or legal realists) must be made tangible for warehouse/hospital workers with no philosophy background. Concrete examples and participatory exercises will be crucial. The overtime clause they mentioned is perfect because it contains both clear intent ("divided equally") and necessary vagueness ("as far as practicable").

  For the session flow, I consider starting with a tangible exercise (like drawing a triangle from dots) to demonstrate interpretation differences before introducing abstract concepts. Then build through contract language examples, group discussion of past grievances, and finally address the "why bother" objection by positioning interpretation as a power struggle where filing grievances creates necessary pressure - not about being "more right" but about forcing negotiation.

  Key pitfalls to avoid:
  - Don't get bogged down in legal theory or philosophy jargon
  - Don't imply language is meaningless (risks fueling defeatism)
  - Don't pretend there's a magic "correct" interpretation (undermines the core argument)

  The assessment question at the end should force application - perhaps asking what they'd say to a member who claims "the contract says X so we can't fight this." A good answer would acknowledge the words while arguing for plausible alternatives based on intent or precedent.
answer: |-
  Here’s a battle-tested 90-minute session plan designed for shop stewards with no philosophy background. The goal is **to equip them to argue that contract language requires interpretation, not just passive acceptance, especially in unforeseen situations.**

  **Core Structure & Flow:**  
  *(Total: 85 mins + 5 min buffer)*

  ---

  ### **1. Hook: The "Rule-Following" Illusion (15 mins)**  
  **Activity:** *"Draw a Triangle" Exercise*  
  - *Task:* "I’ll describe a rule. You draw what it tells you: **‘Connect these three points: Point A, Point B, Point C.’**"  
    (Show 3 dots in a rough triangle on a slide/board).  
  - *Result:* 95% draw a triangle.  
  - *Reveal:* Show 3 dots **in a straight line**. Ask: "Did you break the rule? The rule didn’t say the points *couldn’t* be colinear."  
  **Why:** Visually proves that **even simple rules rely on unstated assumptions**. Heads off *"words mean what they mean"* by showing context shapes interpretation.  

  ---

  ### **2. Contract Reality: The "As Far As Practicable" Clause (20 mins)**  
  **Use the overtime clause:** **"Overtime shall be divided equally as far as practicable."**  
  - *Why this clause?* It’s **obviously vague** (better than airtight). Everyone knows "practicable" is fuzzy.  
  - *Activity:* Small groups (5 mins) brainstorm:  
    *"What did ‘practicable’ mean in 1998? What does it mean today with automation/understaffing?"*  
  - *Debrief:* Highlight 2–3 conflicting *reasonable* interpretations.  
  **Key Point:** **The words didn’t change – the world did.** Management’s reading isn’t "obviously wrong," but neither is ours.  

  ---

  ### **3. The Core Argument: Past Decisions ≠ One True Rule (20 mins)**  
  **Analogy:** *"The Recipe Book"*  
  - *Scenario:* "Your grandma’s recipe says ‘bake until done.’ She always pulled cookies at 10 mins. You have a convection oven. Is 8 mins breaking the rule?"  
  - *Discussion:*  
    - Did grandma foresee convection ovens?  
    - Is "until done" *only* what grandma did? Or the *outcome* she wanted?  
  - **Land the Argument:**  
    > "Past decisions (grandma’s 10 mins) are compatible with MANY rules:  
    > - ‘Bake 10 mins no matter what’  
    > - ‘Bake until golden-brown’  
    > - ‘Bake until firm’  
    > **The words don’t tell you which rule you’re ‘really’ following when things change.**"  

  ---

  ### **4. Tackling Misconceptions Head-On (15 mins)**  
  - *"Words mean what they mean!"*  
    **Response (post-Exercise/Recipe):** "Yes – but *what they mean* depends on **what problem they were solving**. Did ‘practicable’ mean ‘easy for supervisors’ or ‘fair to workers’? Words don’t decide that alone."  
  - *"So management can do whatever?!"*  
    **Response:** "No – **it means the contract is a tool for negotiation, not a robot**. If their reading undermines the clause’s purpose (fairness), we fight. Silence isn’t consent; it’s unresolved."  
  - ***Sharp Steward’s Objection:*** *"Then our reading’s no better – why file?"*  
    **Response (CRITICAL):**  
    > "**Filing isn’t about being ‘more correct’ – it’s about power.**  
    > - If we don’t file, their interpretation **wins by default**.  
    > - Filing forces them to **defend their reading** against ours.  
    > - Arbitration isn’t a philosophy test; it’s **‘Which reading better fits the contract’s purpose and past practice?’**  
    > We file because **silence = surrender**."  

  ---

  ### **5. Why This Matters: The Steward’s Superpower (10 mins)**  
  - *Message:* "Our job isn’t to ‘find the right answer’ in the text. It’s to:  
    1. **Expose management’s interpretation as a *choice*** (not inevitable).  
    2. **Argue our reading aligns with the contract’s purpose** (fairness, safety, etc.).  
    3. **Use grievances to rewrite ambiguity in practice** (create new ‘past decisions’ that favor us)."  
  - *Do NOT get into:* Legal theory (Wittgenstein/Dworkin), deep dive into arbitration law, or drafting perfect language.  

  ---

  ### **6. The Assessment Question (5 mins)**  
  **Ask:** *"If management says, ‘The contract doesn’t explicitly forbid what we’re doing,’ how do you respond?"*  
  - **Got it:** "The contract doesn’t have to forbid every bad idea. We argue this violates the **purpose** of Clause X [e.g., fairness]."  
  - **Spooked:** "But... they’re right?" or focuses only on "we need stricter language."  

  ---

  **Why This Sequence Works:**  
  1. **Starts concrete** (drawing exercise) → **applies to contract** (overtime clause) → **generalizes** (recipe analogy) → **empowers** (your superpower).  
  2. **Objections are pre-empted:**  
     - Literalism dies in Step 1.  
     - Defeatism ("management wins") dies in Step 4 with the *power* argument.  
     - The sharp steward’s concern is addressed *after* they see the problem, but *before* the inspirational close.  
  3. **The clause** is vague by design ("as far as practicable") – forcing interpretation. An airtight clause would obscure the core argument.  

  **Bring:**  
  - Slides with dots/recipe scenario.  
  - Printed copies of the overtime clause.  
  - A whiteboard to capture group brainstorm on "practicable."  

  **Remember:** You’re not teaching philosophy – you’re **arming them for battle**. End by tying it back: *"Next grievance where management says ‘It’s not in the contract,’ you say: ‘Let’s talk about what IS in it – and what it’s FOR.’"*
