answer: |-
  ### 1. Support for the Hypothesis  
  The quoted text **strongly supports** your hypothesis. Polybius explicitly defines the "true" forms of government (kingship, aristocracy, democracy) by **moral and functional criteria**, not merely structural office-holding:  
  - **Kingship** (4.2): Requires voluntary acceptance and governance "by an appeal to reason" rather than force.  
  - **Aristocracy** (4.3): Demands rule by "the justest and wisest men."  
  - **Democracy** (4.5): Depends on a community bound by reverence for gods, honor for parents, respect for elders, and obedience to laws.  

  Crucially, **3.9–3.12** states that deviations from these criteria create regimes that merely *resemble* the true forms but are distinct types (monarchy → tyranny, oligarchy → mob-rule). **4.6** formalizes this by listing *six* types: three "good" and three "vicious allied" forms. Your inference is validated: decay does not corrupt a regime internally but **reclassifies it into a new type**. For democracy specifically, **4.5** defines it as inherently lawful and pious, so internal decay (e.g., lawlessness) would, by Polybius’ logic, cease to be democracy and become "mob-rule" (ochlocracy). The sequence in **4.7–4.9** describes **replacements among types**, not organic decay:  
  > *"Monarchy first changes into... tyranny"* (4.8)  
  > *"Aristocracy... degenerates into oligarchy"* (4.9)  

  **Limitation**: The excerpt stops before Polybius details democracy’s decay. To confirm whether *all* transitions are reclassifications (not internal decay), you would need to check if later sections describe democracy "degenerating" into mob-rule *while still being called democracy*, or if it becomes mob-rule upon violation of its moral criteria.  

  ---

  ### 2. "Naturally Allied" and Legitimation Strategy  
  **"Naturally allied" (4.6)** implies a relationship based on **shared structural appearance but divergent moral substance**. The "alliance" is one of deceptive similarity:  
  - Monarchy resembles kingship (both have one ruler) but lacks consent/reason.  
  - Oligarchy resembles aristocracy (both have few rulers) but lacks wisdom/justice.  

  This aligns with **3.10**, where rulers "falsely assume" regal titles to exploit the legitimacy of the "true" form. Polybius is indeed highlighting **political language as a legitimation strategy**: regimes mimic the *labels* of virtuous forms to mask their moral defects. This **squares perfectly with the moral definitions**: the labels (kingship, aristocracy) are reserved for regimes meeting ethical standards, while structurally similar but corrupt regimes must "falsely" claim them. The taxonomy is thus both structural *and* moral: structure determines resemblance, morality determines classification.  

  **Greek context**: "Naturally allied" likely renders *symphyôn* (conjoined/growing together), implying an inherent but superficial kinship.  

  ---

  ### 3. *Phusis*/*Technē* Contrast and Cyclicality  
  The **nature (phusis)/art (technē)** contrast in **4.7** is pivotal:  
  > *Monarchy* arises "**natural and unaided**" (*automatos*—spontaneously).  
  > *Kingship* arises "**by the aid of art (technē) and correction of defects**."  

  This sets a pattern:  
  1. Nature produces a crude form (monarchy).  
  2. Human art refines it into virtue (kingship).  
  3. Nature reasserts through decay into vice (tyranny).  

  **Asymmetry**: Art improves nature but is fragile; nature’s unaided products are inherently unstable. The sequence is **directional but not yet closed** in the excerpt: it moves from primitive (monarchy) to refined (kingship) to degenerate (tyranny), then to aristocracy (4.8), then oligarchy (4.9). **No return to the start is described here.**  

  **Is it cyclical?** The excerpt **underdetermines** full cyclicality. Polybius implies decay is inevitable (*"aristocracy by its very nature degenerates"*), but the cycle’s closure (e.g., mob-rule reverting to monarchy) is absent. To confirm, you would need to see if Polybius later claims mob-rule collapses *into monarchy* (completing the cycle), or if Rome’s mixed constitution interrupts it.  

  ---

  ### 4. Reconciling Predictability and Rome’s Exception  
  **2.8–2.10** claims constitutions are the "chief cause" of success/failure, enabling prediction for states with known constitutions. **3.1–3.3** contrasts "Greek states" (predictable) with Rome (unpredictable). The discrepancy arises because:  
  - Greek states have **simple, pure constitutions** whose outcomes follow clear patterns (3.2).  
  - Rome has a **"complicated" (poikilos) mixed constitution** (3.3), making its dynamics opaque.  

  Polybius is **not placing Rome outside the model** but highlighting **methodological challenges**:  
  1. Complexity requires deeper analysis to identify the operative mechanisms.  
  2. Ignorance of Roman customs (*ethē*) and private life impedes inference.  

  **Your suspicion is correct**: Polybius suggests mixed constitutions *resist simple modeling*, not that they escape decay. The "fountain-head" (archē) metaphor (2.10) still applies—Rome’s constitution remains the cause of its success—but its intricacy defies easy prediction. The popular notion of Rome "escaping the cycle" oversimplifies; Polybius implies complexity delays, not negates, deterministic patterns.  

  ---

  ### 5. Translation Artifacts  
  Key terms and their likely Greek originals (confidence: ★★★★☆ based on standard Polybian usage):  
  - **"Constitution"**: *Politeia* (★★★☆☆). Broader than "governance structure"; implies communal order, including customs.  
  - **"Mob-rule"**: *Ochlokratia* (★★★★☆). Pejorative term contrasting with *dēmokratia* (true democracy).  
  - **"Art"**: *Technē* (★★★★★). Human craft/knowledge, opposed to *phusis* (nature).  
  - **"Naturally allied"**: *Symphyôn* (★★★☆☆) or *syngenē* (conjecture). Implies kinship by origin or resemblance.  
  - **"Fountain-head"**: *Archē* (★★★★☆). "First principle" or "originating cause," not merely a source.  

  **Crucial nuance**:  
  - **"Growth... natural and unaided" (4.7)**: *Automato* (spontaneous) ≠ "natural" in a teleological sense. It implies absence of design.  
  - **"Degenerates" (4.9)**: *Phtheiresthai*—to corrupt/destroy. Active moral decay, not passive change.  

  ---

  ### Verdict on Your Hypothesis  
  **Your hypothesis is safe to print** for the defined scope (4.2–4.5). The text robustly supports the claim that Polybius defines regimes morally, making decay a reclassification. The cycle is presented as a taxonomy with transition rules, not organic decay of a persistent entity. Democracy, by definition, cannot decay internally without becoming mob-rule.  

  **Caveats for your article section:**  
  1. The excerpt **does not confirm cyclical closure** (return to monarchy). This requires checking later sections for mob-rule’s fate.  
  2. Rome’s "exception" is **methodological, not ontological**: complexity complicates prediction, but the constitutional "fountain-head" still governs outcomes.  
  3. The moral definitions **serve a pragmatic aim**: Polybius wants readers to diagnose regimes *correctly* to choose the "best in each case" (2.8). This is political science as much as history.  

  **In sum**: Polybius’ cycle is less a law of history than a heuristic framework. The definitions are its linchpin—making decay not a process but a recategorization—allowing him to uphold constitutional virtue as both normative and predictive, while accounting for Rome’s anomaly. Your insight exposes why his "cycle" remains endlessly adaptable: it is a classificatory schema masquerading as destiny.
