  I need to tackle this by separating the moral content from the blamer's history. Agree the brother's past affects reception and effectiveness, but not the permissibility of his blame. Emphasize that the sister's wrongdoing exists independently. Concede that his past might make him seem self-serving, but that's about prudence, not entitlement. 

  Also, address the user's unarticulated unease. The brother's unapologetic history and past complacency might relate to his current motives. But even if his motives are questionable, as long as the blame is correct, it's still valid. The teacher comparison is key: both are asserting the same moral truth, but the teacher's version might be more effective due to consistency. That difference is practical, not about standing.

