  ### The Permutation  

  **Line Recurrence and Sampling Methods**:  
  - **Stanza 1, Line 2** ("A point is chosen on the rim") recurs in **Stanza 2, Line 1**, initially denoting the selection of an endpoint. In **Stanza 2**, it anchors Method 1 (two endpoints), yielding the probability **1/3** in Line 8 ("A third of the ways...").  
  - **Stanza 2, Line 2** ("Along a radius, the mark is made") recurs in **Stanza 3, Line 1**, shifting from an endpoint to a radial midpoint (Method 2). This introduces **1/2** in Line 6 ("Half the radius...").  
  - **Stanza 3, Line 2** ("A midpoint held, a length defined") recurs in **Stanza 4, Line 1**, repurposed from radial midpoint to any interior midpoint (Method 3). This culminates in **1/4** in Line 8 ("A quarter of the disk...").  

  **Meaning Shifts**:  
  - "A point is chosen on the rim" (Method 1) becomes ironic in **Stanza 2**—where the *same* line now sits beside radial sampling, undermining its original intent.  
  - "A midpoint held, a length defined" (Method 2) is stripped of radial context in **Stanza 4**, becoming a generic midpoint amid interior sampling.  

  **Pantoum’s Role**:  
  The form earns its keep by *enacting* Bertrand’s paradox: recycled lines mutate meaning when embedded in new stanzas, mirroring how probabilities change under reparameterization. The cyclical structure (closing with the opening lines) reflects the problem’s unresolved arbitrariness. Elsewhere, repetition is decorative—e.g., the compass/straw imagery—but still serves the theme of shifting perspectives.
