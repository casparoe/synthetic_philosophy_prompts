  ### Algebra: C is Never a Best Response
  For Player 1, **C** is never a best response to any belief \((p_X, p_Y, p_Z)\) (where \(p_X + p_Y + p_Z = 1\)):  
  - Expected payoff of **C**: \(2p_X + 2p_Y + 3p_Z\)  
  - Expected payoff of \(\frac{1}{2}\)A + \(\frac{1}{2}\)B:  
    \[
    \frac{1}{2}(5p_X + 0p_Y + 7p_Z) + \frac{1}{2}(0p_X + 5p_Y + 7p_Z) = 2.5p_X + 2.5p_Y + 7p_Z
    \]  
  - Compare:  
    \[
    2.5p_X + 2.5p_Y + 7p_Z > 2p_X + 2p_Y + 3p_Z \implies 0.5p_X + 0.5p_Y + 4p_Z > 0
    \]  
    Always true since \(p_X, p_Y, p_Z \geq 0\) and not all zero. Thus, **C** is strictly dominated and never a best response.

  ### Weak Dominance and Order-Dependence
  - **Weak dominance**: Using weak iterated dominance, the game does **not** collapse to a unique cell.  
  - **Order-dependence**: In Round 3, after eliminating **C** and **Z**, the remaining 2x2 has no strict dominance. Weak dominance could eliminate **A** or **B** first, leading to different outcomes:  
    - If **A** is weakly dominated by **B** (assuming weak inequality), eliminate **A** → Then **Y** might be eliminated, leaving **(B, X)**.  
    - If **B** is weakly dominated by **A**, eliminate **B** → Then **X** might be eliminated, leaving **(A, Y)**.  
    - **Specific step**: In the 2x2 (after **C** and **Z** gone), no strategy is strictly dominated, but both **A** and **B** might be weakly dominated by mixtures if weak dominance is allowed, causing path-dependence.

