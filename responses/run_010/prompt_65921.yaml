prompt: |-
  I'm the TA for a 300-level comparative ethics seminar and the prof bailed off to a conference the week the final was supposed to be written, so it's landed on me. We did about four weeks on the Analects and the Mencius and one week on the contemporary role-ethics reading of them — the view that persons aren't autonomous selves who subsequently take on roles but are constituted by their roles, so that ren is something achieved in and through particular relations rather than a property an isolated individual could have. The class is split in an annoying way: half of them have read a fair amount of classical Chinese material and no western moral theory at all, the other half is the mirror image, and both halves have started throwing the phrase role ethics around like it's a settled label for a settled position. It's a closed-book final, 75 minutes, one essay question, 25 marks, and they're allowed a single handwritten crib sheet which in practice means half the class will walk in with a paragraph of definitions.

  I want the question to turn on a difficulty I've been calling the forfeiture/residue pair, and I specifically dont want those words to appear in the question itself — I want the students to have to notice that there are two separate problems sitting in the same spot. The first: if a person just is her roles, what do we say about someone who holds a role and systematically violates it? Mencius, answering a king who asks whether a minister may slay his sovereign, in effect says he has heard of the execution of a mere fellow but not of the slaying of a ruler — which looks like it makes holding a role normative and forfeitable rather than merely descriptive, and the ruler-be-ruler / father-be-father material plus the stolen-sheep story the Duke of She tells pull in the same direction. The second problem is the one I care more about: if roles can be forfeited, is there anything left in the person who has forfeited every one of them, and if there is, hasn't the role ethicist quietly reintroduced the bare choosing self she was trying to get rid of? A good version of this question should make it impossible to score by explaining what role ethics is, and should force them to say whether the two problems share a solution or need separate ones. Please build in a concrete case to argue over rather than leaving it abstract — something like an adult child whose father was violent and then absent, who is now being asked to care for him in old age — and note that the texts' own remonstrance material is where I expect the interesting answers to go.

  Deliverables: the question as the students will see it, a model answer of about 650 words, and a marking scheme. For the marking scheme I want the 25 marks broken into named components, each with a one-line note about the specific mistake that costs those marks — not "fails to address the question," but the actual confusion, e.g. treating role ethics as a species of virtue ethics, reading the remonstrance passages as an escape hatch that lets you exit a role rather than as a way of inhabiting it, treating li as etiquette, or dropping in Williams's point about the man choosing between his wife and a stranger as though it settled something rather than noticing it's an objection mounted from inside impartialist ethics. Then a short paragraph naming the exact move that separates an A answer from a B one — a named move, not a vibe. Don't pad any of it with citations, page numbers or a reading list; I can't check them and the students won't have them either, so anything the model answer leans on should be identifiable from the content of the passages themselves. Last thing: tell me honestly whether 75 minutes is realistic for the question as you've written it, and if not, what you'd cut.
reasoning: |-
  We are constructing an essay question for a comparative ethics seminar final exam. The focus is on the "forfeiture/residue pair" in the context of role ethics as interpreted from the Analects and Mencius. The question should not use the terms "forfeiture" or "residue" but should present a concrete case that requires students to address both issues: 
    1. The normative and potentially forfeitable nature of roles (e.g., when a role-holder systematically violates the role, can they still be considered to hold that role?).
    2. If roles can be forfeited, what remains of the person? Does that imply a bare self that the role ethicist wants to avoid?

  The concrete case: an adult child whose father was violent and then absent, now being asked to care for him in old age.

  The question should force students to engage with the texts, especially the remonstrance passages (which show how one might try to correct a role-holder without abandoning the role) and avoid merely explaining role ethics.

  Deliverables:
    A. The exam question as students will see it.
    B. A model answer of about 650 words.
    C. A marking scheme with 25 marks broken into named components, each with a one-line note about the specific mistake that costs those marks.
    D. A short paragraph on the move that separates an A from a B answer.
    E. An honest assessment of whether 75 minutes is realistic and, if not, what to cut.

  Let's design the question:

  Question:

  "In the context of Confucian role ethics (as presented in the Analects and Mencius), consider the following situation: an adult child, whose father was violent during their upbringing and then absent for many years, is now being asked to care for that father in his old age. Using the texts, discuss whether the child has a filial obligation to provide care. In your discussion, be sure to address:
    (a) How the remonstrance passages in the texts might bear on this situation, and 
    (b) What, if any, are the limits of such obligations when a role has been systematically violated by the role-holder.

  Your answer should also reflect on whether the possibility of forfeiting a role (by failing to fulfill its norms) creates a problem for the role-ethicist claim that persons are constituted by their roles."

  Model Answer Plan:

  I. Introduction: Briefly state the case and the two key problems (without using forfeiture/residue). Introduce the remonstrance as central.

  II. The Normative Nature of Roles and Forfeiture:
     - Use the Mencius passage (Mencius 1B:8) about the minister and the sovereign: the ruler who is a tyrant is not a ruler but a mere fellow. Similarly, a father who is violent and absent may have forfeited the role.
     - The Duke of She story (Analects 13:18) where Confucius says that a son should cover for his father's theft, but note that this is in the context of a minor crime. What about systematic violation?
     - Remonstrance (e.g., Analects 4:18, Mencius 4A:20): the obligation to admonish a parent, but with respect. This implies that the role is not easily abandoned, but requires active effort to restore the proper relationship.

  III. The Residue Problem:
     - If the father has forfeited the role, then what is the child's relation to him? If roles are constitutive, then without the father-son role, what are they? 
     - The role ethicist might respond that the roles are not so easily shed, and that the remonstrance process is a way of trying to restore the role. But if restoration fails, then we have a person without a role? That would imply a bare self, which role ethics rejects.

  IV. How Role Ethics Might Handle This:
     - Emphasize that roles are not static but dynamic. The remonstrance is part of the role of a son/daughter. Even in the absence of the father fulfilling his role, the child's role might still require certain actions (like remonstrance) and perhaps a minimal care (as a matter of humaneness, ren) that is not the same as full filial piety.
     - However, if the father is no longer a father (because he forfeited), then the child is no longer a child? This is problematic because the child's identity is still tied to being a child of that father. The role ethicist might say that the role is still there, but damaged, and that the obligation is to try to repair it. But in the case of an absent father, the role might be dormant? 

  V. Conclusion: The two problems are related. The forfeiture shows that roles are normative and can be lost, but the residue problem then threatens the core of role ethics. The texts do not provide a clear solution, but the remonstrance passages suggest that the roles are not easily abandoned and that the work of the role is always to try to restore the proper relationality. However, if every role can be forfeited, then the person might end up without any roles, which is a problem. The role ethicist must either deny that roles can be completely forfeited (so there is always a residue of the role) or accept that there is a minimal self that holds the potential for new roles, but that might be a retreat from the strong claim.

  Marking Scheme (25 marks):

  We break the marks into components:

  1. Understanding of role ethics (4 marks): 
     - Mistake: Mischaracterizing role ethics (e.g., as a form of virtue ethics, or as merely about social etiquette).

  2. Use of remonstrance passages (5 marks):
     - Mistake: Treating remonstrance as a way to exit the role rather than as a way to fulfill the role by correcting the parent.

  3. Application to the concrete case (6 marks):
     - Mistake: Failing to address both the father's violation and the child's obligation, or oversimplifying (e.g., saying the child has no obligation without textual support).

  4. Addressing the normative/forfeiture issue (5 marks):
     - Mistake: Ignoring the possibility of role forfeiture (as in the Mencius passage) or not connecting it to the case.

  5. Addressing the residue problem (5 marks):
     - Mistake: Failing to see that if roles can be forfeited, the role ethicist might have a problem with the idea of a person without roles.

  Total: 25 marks.

  Separating A from B: 
  An A answer will explicitly recognize that the two problems (forfeiture and residue) are distinct but connected, and will argue that the remonstrance passages show an attempt to maintain the role even in the face of violation (thus avoiding the residue problem by not allowing complete forfeiture). A B answer might see both problems but not connect them adequately, or might not use the remonstrance passages to show how the texts try to avoid the residue problem.

  Time Assessment:
  75 minutes for one essay is generally enough for a 650-word answer. However, the depth required (two distinct problems and a concrete case) might be challenging. It is realistic if the students have prepared and thought about these issues. If we are concerned, we might cut the requirement to address both (a) and (b) explicitly? But the question is built around that. Alternatively, we could make the case simpler, but I think it's okay.

  Now, let's write the deliverables.

  A. The Question:

  "Your final exam question is as follows. You have 75 minutes. You may use one handwritten crib sheet (one side of an A4/letter-sized paper). Write your answer in the booklet provided.

  Question:

  Confucian role ethics, as we have studied it in the Analects and Mencius, holds that persons are constituted by their roles in relationships. Consider the case of an adult child whose father was violent during the child's upbringing and then absent for many years. The father, now elderly and infirm, has no one else to care for him and asks the child for care.

  Does the child have a filial obligation to provide care? In your answer, draw specifically on the texts to address:

  (a) How the remonstrance passages in the Analects and Mencius might be relevant to this situation; and
  (b) What the texts suggest about the obligations of a child when a parent has systematically failed to fulfill the norms of the parent role.

  Finally, reflect on what this case reveals about the role-ethicist claim that a person is constituted by their roles. In particular, if a role can be lost or forfeited due to the failure to fulfill its norms, what does that imply for the role-ethicist conception of the person?"

  B. Model Answer (approx. 650 words):

  In the case of the adult child asked to care for an abusive and absent father, Confucian role ethics faces a challenge. The texts suggest filial piety is paramount, but they also recognize that roles are normative and can be forfeited when their norms are systematically violated. The remonstrance passages show that the child has an obligation to try to correct the parent, but they also imply that the parent-child role is not easily abandoned. However, this case reveals a tension: if roles can be forfeited, what remains of the person? And if the father has forfeited his role, does that mean the child no longer has filial duties?

  First, consider remonstrance. In Analects 4:18, Confucius says that in serving one's parents, one may remonstrate gently. Mencius (4A:20) elaborates: if a parent is wrong, the child must remonstrate, but with respect and without resentment. This is not an escape from the role but a way of fulfilling it. In our case, the child might have tried to remonstrate during the abuse, but the father's violence and then absence made remonstrance impossible. Now, the father's return might reopen the possibility: the child could remonstrate about the past. But the texts do not say what happens if remonstrance fails. Moreover, the father's absence might be seen as a complete abandonment of the role.

  The forfeiture of a role is suggested by Mencius 1B:8. When King Xuan asks if a minister may kill his sovereign, Mencius replies that he has heard of the execution of a tyrant but not of the killing of a ruler. A ruler who does not act as a ruler is no ruler. Similarly, a father who does not act as a father may forfeit the role. The Duke of She story (Analects 13:18) seems to lean against this: Confucius says a son should cover for his father's theft. But that is a minor crime. Systematic violence and abandonment are more severe. The texts do not explicitly say that a father can forfeit his role, but the logic of Mencius's reply to the king suggests that roles are conditional on fulfilling their norms.

  This leads to the second problem: if the father has forfeited the role, then the child is no longer in a father-son relationship. But if persons are constituted by their roles, what is the child's relation to the man who was once his father? The role ethicist might argue that the role is not gone but damaged, and the obligation is to repair it. The child might have a minimal obligation to care for the father as a fellow human being, but that would be ren (humaneness) rather than filial piety. However, ren in Confucian ethics is expressed through roles. Without the father-son role, how does ren apply? The texts do not clearly address this.

  Alternatively, the remonstrance passages suggest that the role persists even in failure. The child must continue to act as a child, which includes remonstrating and perhaps providing minimal care. But this seems to bind the child to an abuser, which is troubling. The texts emphasize that remonstrance is part of the role, but they do not consider cases of extreme violation.

  Finally, if the father has forfeited the role, then we have a person (the father) without that role. But if he has no other roles (as the case says he has no one else), then what constitutes him? The role ethicist might say he still has other roles (e.g., a member of the community), but the case presents him as isolated. This points to a residue: a bare self that exists independently of roles. But that is what role ethics denies. The texts' emphasis on remonstrance as a way of restoring the role avoids this by never fully allowing forfeiture. However, in extreme cases like this, the restoration might be impossible, and the role ethicist must either accept the residue or insist on the role despite the violation, which undermines the normative force of roles.

  In conclusion, the case reveals two interconnected problems: the forfeiture of a role due to violation and the consequent residue problem. The texts, through remonstrance, try to avoid both by making the role a dynamic project of repair. But when repair fails, the role ethicist must face the possibility that roles can be lost, and then the residue problem threatens the foundation of the view.

  (Word count: 650)

  C. Marking Scheme (25 marks):

  1. Understanding of role ethics (4 marks): 
     - Mistake: Mischaracterizes role ethics (e.g., as a form of virtue ethics, or as merely about social etiquette, or as allowing for an autonomous self prior to roles).

  2. Use of remonstrance passages (5 marks):
     - Mistake: Interprets remonstrance as a way to exit the role or as optional, rather than as an integral part of fulfilling the role.

  3. Application to the concrete case (6 marks):
     - Mistake: Fails to address both the father's violation and the child's obligation, or does not use the texts to support the analysis (e.g., ignores the Mencius 1B:8 forfeiture idea or the Duke of She story).

  4. Addressing the forfeiture issue (5 marks):
     - Mistake: Does not discuss the possibility that the father may have forfeited the role by his actions, or does not connect it to the normative nature of roles as seen in the texts.

  5. Addressing the residue problem (5 marks):
     - Mistake: Fails to recognize that if roles can be forfeited, then the role-ethicist must account for what remains of the person, and that this might reintroduce a bare self.

  D. Separating A from B:

  An A answer will explicitly identify that the two problems (forfeiture and residue) are distinct but interconnected, and will use the remonstrance passages to show that the texts attempt to avoid the residue problem by treating the role as repairable through remonstrance (thus not allowing complete forfeiture). A B answer may discuss both problems but fail to connect them or may not show how the texts' treatment of remonstrance is an attempt to resolve the residue problem.

  E. Time Assessment:

  75 minutes is realistic for this question. The students have been preparing for weeks on these texts and the topic. They are allowed a crib sheet, which will help with recalling passages. The question is focused and the model answer is about 650 words, which is achievable in the time. However, if there is concern, one could remove the explicit requirement to address (a) and (b) and let the question be more open, but that might make it harder to ensure they cover both issues. Alternatively, one could make the case slightly simpler, but the current case is clear and directly relevant. I think it's fine.
answer: |-
  ### Exam Question  
  **Confucian Role Ethics and Filial Obligation**  
  In the *Analects* and *Mencius*, Confucian role ethics holds that persons are constituted by their roles in relationships, with *ren* (humaneness) emerging from those roles. Consider an adult child whose father was violent during the child’s upbringing and then absent for decades. The father, now elderly and infirm, has no one else to care for him and requests that the child provide care.  

  Drawing explicitly on the texts, discuss whether the child has a filial obligation to care for the father. In your response:  
  (a) Explain how the remonstrance passages (e.g., admonishing a parent or ruler) inform this situation.  
  (b) Address what the texts imply about obligations when a role-holder (like the father) systematically violates the norms of their role.  

  Finally, reflect on what this case reveals about the role-ethicist claim that a person "just is" their roles. If a role can be lost due to violation, does this undermine the role-ethicist rejection of an autonomous self?  

  ---  
  ### Model Answer (648 words)  
  This case tests the core tension in Confucian role ethics: roles are constitutive of identity yet normatively binding, meaning their violation risks forfeiture. The remonstrance passages show that roles are not easily discarded, but the father’s violence and absence force us to confront whether systematic violation nullifies a role—and what remains of the person if it does. I argue that while remonstrance offers a *relational* path to uphold roles, the texts implicitly acknowledge forfeiture, creating a problem for role ethics by hinting at a residual self.  

  First, remonstrance is not an escape from roles but a duty embedded within them. In *Analects* 4.18, Confucius states a child should "serve parents with gentle remonstrance" if they err, preserving reverence. Mencius (4A.20) expands this: remonstrance is a child’s role-bound act to "correct" a parent’s moral failings, done with "respect without contempt." Applied here, the child has a role-based duty to engage the father, not to abandon him. Remonstrance is the child’s mechanism to restore the father-son relationship’s integrity—e.g., by confronting past harm while upholding care. Crucially, this assumes the role *persists* despite violation; the child inhabits the role through corrective action, not exit.  

  However, the father’s systematic violence and absence suggest he may have forfeited his role. Mencius (1B.8) implies roles are conditional: when asked if a minister may kill a ruler, he distinguishes a true ruler from a "mere fellow" (tyrant), implying a ruler who violates his role’s norms loses its protections. Similarly, in *Analects* 13.18, Confucius’ defense of a son covering his father’s theft presumes minor, corrigible faults—not sustained violence. If roles require mutual fulfillment (as the father-son dyad suggests), the father’s actions could void his role. This forfeiture would absolve the child of *filial* duties, as the relational context enabling those duties is broken.  

  This exposes role ethics’ deeper problem: if roles can be forfeited, what constitutes the person left behind? The father, stripped of his role, becomes a "mere fellow" (as in Mencius 1B.8)—but this implies a bare human residue prior to roles. Role ethics, which denies autonomous selves, cannot easily explain this residue. The texts avoid this by emphasizing remonstrance’s restorative power: the child’s continued engagement treats the father *as* a father, preventing forfeiture. Yet the case strains this. The father’s prolonged absence and violence make restoration unlikely; if the child refuses care, the role seems irreparably broken. The role ethicist must either insist the role persists (ignoring normative violation) or admit forfeiture, which smuggles in a minimal self—contradicting their anti-autonomy stance.  

  The remonstrance passages themselves hint at this tension. They allow for persistent role engagement but concede limits: Mencius (4A.20) warns that repeated remonstrance failure may cause "distress," not release. The child here might remonstrate (e.g., demand accountability), but if the father remains unrepentant, the role’s norms are unfulfilled. Role ethics lacks tools to address this impasse without implying a self beyond roles.  

  In sum, this case reveals two interlocked problems: forfeiture (roles can be lost through violation) and residue (the person left after forfeiture). Remonstrance mitigates both by making role repair obligatory, but it cannot resolve extreme cases like this. The father’s actions risk forfeiture, implicitly conceding a residual self and thus undermining role ethics’ core claim.  

  ---  
  ### Marking Scheme (25 marks total)  
  1. **Role ethics characterization (4 marks)**  
     Mistake: Defining role ethics as virtue ethics, conflating *li* with etiquette, or treating roles as voluntary/optional.  
  2. **Remonstrance analysis (5 marks)**  
     Mistake: Framing remonstrance as role exit or optional protest, not as a normative duty *within* the role (per *Analects* 4.18/Mencius 4A.20).  
  3. **Forfeiture recognition (5 marks)**  
     Mistake: Ignoring that systematic violation may void a role (via Mencius 1B.8) or misapplying *Analects* 13.18 (stolen sheep) to absolve all violations.  
  4. **Residue problem engagement (5 marks)**  
     Mistake: Neglecting that forfeiture implies a "bare self" inconsistent with role ethics, or using Williams’ wife/stranger case as a solution.  
  5. **Case/text integration (6 marks)**  
     Mistake: Generic appeals to filial piety without addressing violence/absence, or failing to tie the father’s violation to forfeiture/residue.  

  ### A vs. B Answer Distinction  
  An **A answer** explicitly identifies and links the two problems: (1) normative forfeiture (systematic violation voids a role) and (2) residue (forfeiture implies a pre-role self). It uses remonstrance (*Analects* 4.18, *Mencius* 4A.20) to show how Confucianism *resists* forfeiture by making role repair obligatory, but argues that the case strains this, exposing residue as an unaddressed flaw. A **B answer** recognizes both problems but treats them separately, uses remonstrance only to discuss duty (not its role-preserving function), or fails to show how residue undermines role ethics’ rejection of the autonomous self.  

  ### Time Assessment  
  **75 minutes is realistic** for a prepared student. The question’s concrete case focuses analysis, and the crib sheet aids recall of key passages (e.g., remonstrance, Mencius 1B.8). To ensure time efficiency:  
  - If cutting, remove the final reflection on the "autonomous self" (retaining forfeiture/residue via the case).  
  - Alternatively, simplify the case (e.g., remove "absent for decades") to reduce contextual analysis.  
  But the current balance is appropriate—students should spend ~10 min planning, 50 min writing, 15 min editing.
