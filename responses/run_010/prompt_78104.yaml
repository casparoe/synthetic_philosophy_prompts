answer: |-
  The Mytilene sequence reveals an Athenian political theory centered on **radical, immediate, and unconstrained popular sovereignty**, where the Assembly's will is the supreme source of political authority. This theory operates under the following implicit principles:

  1.  **The Assembly as Sovereign Will:** The demos in Assembly *is* the state. Its expressed will (via decree) constitutes valid law at the moment of enactment. No higher law, divine mandate, institutional check (court, magistrate, council), or written constitution supersedes its pronouncement.
  2.  **Self-Validation & Temporal Supremacy:** A decree's validity derives solely from its enactment by the current Assembly. Its legitimacy requires no external sanction. Crucially, **only a subsequent vote of the Assembly itself** can alter or nullify a prior decree. The later decree doesn't "correct" the former as illegal or invalid; it simply *replaces* it by virtue of being the *most recent* expression of the sovereign will. Validity is purely chronological ("last vote wins").
  3.  **Separation of Legality and Wisdom:** The validity of a decree is distinct from its wisdom, justice, or prudence. The Assembly is empowered to decree *anything*, wise or foolish, just or monstrous. While the *proposer* of a decree could later be held accountable if the decree violated existing laws (via *graphe paranomon*), the *decree itself* was binding when passed, and its *reversal* was not a judicial annulment but a new sovereign act. The second Mytilene vote establishes solely that it was the *later* will; its "wisdom" is a separate question of political judgment, not legal validity.
  4.  **Authority Resides Solely in the Moment of Decision:** The Assembly's authority is not embedded in a permanent legal structure but exercised anew in each meeting. Yesterday's decision binds only until today's Assembly chooses to overturn it. There is no concept of the demos binding its *future* self; each Assembly is sovereign unto itself.

  **Reconciling Scrupulousness about Procedure:**

  This radical sovereignty coexists with procedural scrupulousness through a key distinction:

  *   **The Decree vs. Its Proposal:** While the Assembly can *pass* any decree, the *act of proposing* a decree contrary to existing laws (*nomoi*) is a separate offense. The graphe paranomon prosecutes the *citizen proposer* for introducing an illegal motion, *not* the Assembly for passing it. The Assembly's vote validates the decree *as policy*, but doesn't absolve the proposer of legal responsibility for suggesting something unlawful.
  *   **Socrates' Stand:** Socrates' refusal (after Arginusae) highlights this. He didn't claim the Assembly *couldn't* vote on the illegal motion (its sovereign power was unquestioned). He refused to *put* it to the vote as presiding officer, recognizing his personal liability for facilitating an illegal proposal. The scrupulousness applies to the *process* leading to the vote (is the motion legal to propose?) and individual accountability, not to constraining the Assembly's ultimate power to enact whatever is put before it.

  **Where Practice is Underdetermined (Room for Rival Theories):**

  1.  **The Basis for Reversal:** The practice *requires* only a later vote. It does *not* specify *why* the reversal occurred. Rival theories can fill this gap:
      *   **Epistemic Deliberation:** The second debate revealed new arguments, demonstrating the superior wisdom of clemency (emphasizing deliberation's role).
      *   **Shifting Popular Sentiment:** The emotional fervor cooled overnight, reflecting the volatility of mass opinion (emphasizing the demos's fickleness).
      *   **Moral Awakening:** The demos recognized the inherent injustice, appealing to a higher, unwritten moral law (though not a *legal* constraint).
      *   **Pure Chronological Supremacy:** The later vote supersedes simply because it comes later, irrespective of reasons (emphasizing proceduralism over substance).
  2.  **The Source of Law's Authority:** While the Assembly makes decrees (*psephismata*), the laws (*nomoi*) it sometimes prosecutes against also derive ultimately from the people (through older, more solemn procedures). The practice doesn't explicitly resolve the *ultimate* source of the laws' binding force. Is it popular sovereignty crystallized in the past, or is there a faint concept of inherent validity? (Athenian rhetoric often leaned towards the former).

  **What Changed After 403: Subordinating Decrees to Laws**

  For Athens to treat some decisions as "beyond its own reach" (i.e., make decrees subordinate to laws), fundamental shifts were needed:

  1.  **Institutional Changes:**
      *   **Judicial Review Mechanism:** The formalization and strengthening of the *graphe paranomon*, allowing courts (representing the demos in a different, perhaps more stable, capacity) to *annul* decrees found contrary to existing laws, not just punish proposers.
      *   **Distinct Lawmaking:** Establishing a separate, more rigorous procedure (*nomothesia*) for enacting or changing *nomoi* (laws), distinct from the simpler decree-making (*psephismata*) of the Assembly. Laws became hierarchically superior.
      *   **Archival & Accessibility:** Systematic publication and archiving of laws to serve as a stable reference point against which decrees could be measured.
  2.  **Shift in the Demos' Self-Understanding:**
      *   **From Unbounded Will to Self-Limitation:** The demos had to conceive of itself not just as a body exercising pure will in the moment, but as a constitutional entity capable of binding its *future* legislative actions. Sovereignty became enduring, not momentary.
      *   **Laws as Higher Commitments:** Laws (*nomoi*) were reimagined not just as older decrees, but as the fundamental, stable framework of the polity – expressions of the people's deeper, more considered will that should constrain ephemeral passions expressed in decrees. The "rule of law" began to supersede the "rule of the latest decree."
      *   **Acceptance of Constraint:** The citizenry had to accept that the Assembly's power was not absolute; it was limited by the legal framework the people themselves had established. The courts, as guardians of the laws, became a check *derived from* popular sovereignty but *acting upon* its specific manifestations in the Assembly.

  In essence, the Mytilene sequence embodies the purest form of direct, majoritarian democracy where the people's immediate will *is* law. Reconciling this with procedural scrupulousness required isolating liability onto the proposer. The post-403 reforms represent a move towards a constitutional democracy, where the people's sovereignty is mediated through stable laws and institutional checks, even against their own transient Assembly. The demos learned to see its past self (embodied in laws) as a legitimate constraint on its present self (acting in the Assembly).
