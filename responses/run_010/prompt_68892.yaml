prompt: |-
  I am in the second year of a philosophy PhD and have been convening an informal reading group on the foundations of Bayesian epistemology. Last week we reached the Dutch book arguments — the claim that a set of degrees of belief is defective precisely when it disposes the agent to accept a package of bets that guarantees her a net loss — and one member of the group announced that the whole enterprise is logic in fancy dress: that exploitability is a mere symptom, and that the axioms do the real work. Rather than argue about it in the abstract, I sat down and wrote out, case by case, when I actually take a betting vulnerability to track a genuine defect in someone's doxastic state and when I do not. What follows is my list, and I want to know what it adds up to.

  1. A coin-toss punter with 0.45 for heads and 0.45 for tails who accordingly sells a bookie two tickets, one paying £1 on heads and one paying £1 on tails, at 45p each: she banks 90p and pays out a pound whichever way it falls. Clearly defective, no qualification needed.
  2. The very same agent, but the two halves of the book are offered on separate days by separate bookies who make no mention of one another, and she would have declined both had they been tabled together as a single package. Still defective, though I think less so, or differently so — this reads to me as a failure of attention rather than of coherence.
  3. An author whose degrees of belief form a perfectly coherent probability function: 0.99 on each of a hundred claims in her manuscript and, quite consistently, a low value on their conjunction. She knows at least one claim must be false. No book can be run against her, and yet I want to say something has gone wrong.
  4. An agent with strongly diminishing marginal utility of money who declines every bet her linear-utility counterpart would take, and who therefore looks exploitable only if you ignore her utility curve. Not irrational in the slightest.
  5. An agent who revises by some rule other than conditionalisation, and who is disposed both to buy bets now at her current odds and to buy further bets later at her post-evidence odds. Exploitable, and irrational.
  6. Identical prior, identical posterior, identical non-conditionalising rule — but this agent has resolved never to place a bet after she learns anything, so the second half of the book can never be sold to her. No feasible book exists against her, and I still judge her exactly as irrational as the agent in case 5. This is the pair I cannot get my head around, and I note that cases 2 and 6 pull against each other: in one, fragmentation across time and bookies seems to excuse, and in the other it does not.
  7. An agent who conditionalises impeccably but forgets that she has already bought a certain exposure, so that a bookie can sell it to her a second time. Exploitable, but not irrational — she lost her memory, not her coherence.
  8. An agent who refuses all bets, or who accepts only bets with a spread wide enough to swallow any book's profit. Invulnerable, and her degrees of belief may be as wild as you please. I think the framework owes me an account here that does not amount to stipulating betting dispositions she simply lacks.
  9. An agent who accepts bets at odds that are entirely fair by her own evidence, but whose bookie has privately observed the coin's bias and can therefore extract a sure profit from her. I do not think this vulnerability counts against her at all.

  Is there a principle — or a short list of rival candidates — that generates all nine of these verdicts? I would like each candidate stated precisely enough that I could apply it myself to a case you have never seen, with an explicit note of which item on my list forces each clause into the formulation. Then please run it against three situations I have deliberately left out: an agent whose doxastic state is imprecise, a set of probability functions rather than a single one; an agent who discounts the future hyperbolically and is therefore vulnerable to a book assembled across time; and an agent whose incoherence concerns propositions that no bet could settle within her lifetime. Finally, tell me plainly which of my verdicts the best candidate has to overturn and what it costs to keep them, and say where in the formulation my colleague's charge shows up — if exploitability really is a symptom rather than the substance, the principle should reveal that somewhere in its own structure. Please write the whole answer in British English.
reasoning: |-
  Okay, let me approach this systematically. The user presents nine carefully constructed cases testing the relationship between Dutch book vulnerability and rational defects in belief states, seeking an underlying principle that unifies their judgments. As someone deeply engaged in Bayesian epistemology, they clearly want to move beyond abstract debates to concrete criteria.

  First, I need to unpack their core concern: their colleague's claim that Dutch book arguments are "logic in fancy dress" suggests exploitability might be epiphenomenal to deeper coherence norms. The user's cases probe precisely where vulnerability does/doesn't track irrationality - from attention failures (case 2) to memory lapses (case 7) to utility curves (case 4). 

  The key tension emerges in contrasting pairs: case 2 (fragmentation mitigates defect) vs case 6 (fragmentation doesn't excuse non-conditionalization), and case 5 (exploitable=irrational) vs case 9 (exploitable but blameless). Case 3 (lottery paradox) and case 8 (bet-averse agent) further challenge whether vulnerability is necessary or sufficient for defect.

  I consider structuring the response around three dimensions of rational defect: synchronic coherence (cases 1,3,4), diachronic coherence (5,6), and non-epistemic factors (7,9). The unifying thread might be that vulnerability only indicates irrationality when it stems from core belief-forming dispositions rather than implementation failures or environmental luck. 

  For the additional cases: 
  - Imprecise probabilities: Vulnerability to sure loss might indicate defective credal sets, but reasonable disagreement exists here. 
  - Hyperbolic discounting: This feels like a diachronic coherence failure akin to case 5.
  - Unsettleable bets: Here vulnerability seems irrelevant since no actual loss can occur.

  The hardest reconciliation is case 6 - why is the non-betting agent still irrational? This suggests the defect lies in the disposition itself, not its manifestation. Case 2's partial excuse implies that attention lapses aren't core failures. The principle must distinguish between fundamental irrationality and performance errors.

  Ultimately, I'll propose that Dutch book vulnerability reveals irrationality iff it arises from stable, general dispositions that violate probabilistic or updating norms, and where the agent has epistemic access to the relevant information. This covers:
  - Synchronic violations (cases 1,4,8)
  - Diachronic violations (5,6)
  - Excludes non-epistemic factors (7,9)
  - Explains attenuated blame in case 2
  - Accommodates case 3 via improper prior formation

  The cost is relaxing exploitability as strictly necessary (cases 3,6,8) while maintaining its sufficiency when conditions are met. This addresses the "symptom" charge by making vulnerability a reliable indicator of underlying dispositional defects under normal agential conditions.
answer: |-
  Here’s a precise principle unifying your nine verdicts, followed by application to your three new cases and critical analysis. The core idea is that **exploitability indicates irrationality iff it stems from a defective *doxastic disposition* that persists under full agential transparency (awareness, access to evidence, and no non-epistemic impediments)**.

  ### The Principle of Doxastic Dispositional Coherence (PDDC)
  1. **Synchronic Defect Clause**: A set of credences is defective if it dispositionally sanctions bets exposing the agent to a sure loss *when all bets are simultaneously transparent to the agent* (cases 1, 4, 9).  
     *Forced by:* Case 1 (transparent package defective), Case 4 (utility prevents actual loss), Case 9 (hidden info absolves).  
  2. **Diachronic Defect Clause**: A belief-updating rule is defective if it dispositionally sanctions bets across time that jointly guarantee loss *when future bets are transparently foreseeable at the initial stage* (cases 5, 6).  
     *Forced by:* Case 5 (exploitable via foreseeable diachronic book), Case 6 (defect persists despite no exploitation).  
  3. **Non-Doxastic Exemption**: Defects are overridden by non-doxastic factors (e.g., utility curves, memory failures) that prevent the disposition from manifesting or negate its irrationality (cases 4, 7).  
     *Forced by:* Case 4 (utility justifies avoiding bets), Case 7 (memory lapse isn’t doxastic failure).  
  4. **Access Requirement**: Exploitability must be evaluable under *actual* agential access to evidence and bet structures; defects aren’t imputed due to inaccessible information or fragmentation (cases 2, 9).  
     *Forced by:* Case 2 (fragmentation mitigates defect), Case 9 (bookie’s hidden knowledge irrelevant).  
  5. **Non-Exploitation Corollary**: Defects can exist without exploitability if bets are refused (case 8) or if the credences violate rational constraints beyond coherence (case 3).  
     *Forced by:* Case 3 (coherent but defective priors), Case 8 (invulnerability ≠ rationality).  

  ---

  ### Application to Your New Cases
  1. **Imprecise Credences (Set of Probability Functions)**  
     - *Agent*: Believes *P(H)* ∈ [0.3, 0.7] for a coin toss.  
     - *Dutch Book*? A bookie might offer bets she accepts at extremes (e.g., buy £1-on-H at £0.35, sell £1-on-H at £0.65). If she accepts both, she loses £0.30 regardless of outcome.  
     - *PDDC Verdict*: **Defective iff she dispositionally accepts all such bets under transparency**. If her imprecision reflects genuine indeterminacy (permissibly), no defect (clause 3). If it’s unmotivated dithering, clause 1 applies.  
     - *Cost*: Permissivism about imprecise credences might require rejecting your case 3 verdict (see below).  

  2. **Hyperbolic Discounter**  
     - *Agent*: Values £1 today > £1.10 tomorrow, but in 365 days values £1 on day 366 > £1.10 on day 365.  
     - *Dutch Book*? Bookie offers:  
       - Today: Pay 90p for £1 tomorrow.  
       - Tomorrow: Sell £1.10 due day 366 for £1 (accepted due to shifted discounting).  
       Net: Agent pays 90p + £1, receives £1 + £1.10. Guarantees 10p loss.  
     - *PDDC Verdict*: **Defective** under clause 2 (diachronic disposition guarantees loss under transparency). Time-inconsistency is a doxastic-practical flaw.  

  3. **Unsettleable Bets (e.g., Afterlife Propositions)**  
     - *Agent*: *P(Heaven)* = 0.8, *P(No Heaven)* = 0.5.  
     - *Dutch Book*? Infeasible—no bet can be settled.  
     - *PDDC Verdict*: **Not exploitable, but defective** under clause 5. Credences violate additivity (synchronic defect), even if unactionable. Coherence is a constraint on belief, not just betting.  

  ---

  ### Costs and Tensions
  - **Case 3 (Conjunction Paradox) is the Biggest Cost**: PDDC’s clause 5 deems her defective despite coherence. To retain this, we must reject strict probabilism (your colleague’s "axioms doing the real work"). *Alternative*: Surrender case 3 by insisting coherence suffices (but this clashes with your intuition).  
  - **Case 6 (Non-Betting Non-Conditionaliser) is Critical**: PDDC’s clause 2 deems her irrational *without exploitability*. This explicitly severs defect from actual vulnerability, prioritising dispositions.  
  - **Case 2 vs. Case 6**: Fragmentation excuses in case 2 (clause 4: lack of access) but not case 6 because non-conditionalisation is a *foreseeable* dispositional flaw (clause 2).  

  ---

  ### Where Your Colleague’s Charge Appears
  PDDC confirms exploitability is a "symptom":  
  - **Clause 5** allows defects without exploitability (cases 3, 6, 8).  
  - **Clause 3** exempts non-exploitable agents from blame (case 4).  
  - **Clause 2** makes diachronic irrationality inherent in the *disposition*, not the book (case 6).  
  The "substance" is the **doxastic disposition**; Dutch books are merely diagnostic tools that fail under non-ideal conditions (fragmentation, memory, hidden info).  

  ---

  ### Summary
  **PDDC generates all nine verdicts at the cost of relaxing probabilism for case 3 and decoupling defect from actual exploitability in cases 6 and 8.** It refutes your colleague by embedding exploitability within a broader theory of epistemic dispositions, revealing where it reliably signals irrationality (clauses 1–2) and where it misfires (clauses 3–5). The framework thus escapes "logic in fancy dress" by anchoring norms in agents’ cognitive economies, not just abstract consistency.
