answer: |-
  Here's the joke as continuous prose for your narrator:

  So I was rereading this bit about how we draw the moral circle, right? Where some creatures are sacred ends-in-themselves – you can’t just *use* them, ever, the rules are absolute. But others? They’re in the happiness ledger. Their pleasure counts, their pain counts, but you *can* use them if the overall math works out, if the total happiness goes up enough. And the fellow writing it got terribly worried about the join – how can the universe hold both kinds of moral thing at once? How do we stop the ones who *feel* more intensely, who can experience vastly greater joys or miseries, from swallowing up all the resources meant for the sacred ones? It’s messy. But the bit that really sticks, see, is that the animals never got a vote on which side of the line they landed. Take that lion eyeing my leg. To him, I’m pure utility. A walking, talking happiness-input. He can crunch the numbers: one good chomp versus my entire future of Kantian fretting, and the scales tip deliciously. But me? Staring back? I’m barred by sacred law from running the same calculation on *his* thigh. Utter asymmetry. The rules bind me, but not him. Makes you wonder… who *really* designed the system? Because sitting here, looking at this lamb, it feels awfully convenient that the ones writing the rules, the ones holding the fork... we ended up miraculously, unanimously, on the sacred side.

  **Why this punchline works:**
  1.  **The "Fold-Over":** The setup explores the abstract philosophical asymmetry. The punchline ("the ones holding the fork... we ended up miraculously, unanimously, on the sacred side") suddenly applies the *exact same critique* to the specific, concrete situation the listeners are in (eating lamb), indicting their own hypocrisy without naming it. The listener realizes the joke wasn't *just* about lions and abstract rules, but about *this dinner table* all along.
  2.  **Indicts the Table:** It directly points the finger at the diners ("we ended up miraculously, unanimously") and their action ("holding the fork"), fulfilling your request to quietly accuse them.
  3.  **Accessible & Structural:** Uses plain language ("sacred," "happiness ledger," "math," "rules bind me") to convey Nozick's core dilemma without jargon. The humor comes entirely from the inherent contradiction in the theory and its self-serving application, not from mocking nerds.

  **Shorter Version:**

  This philosopher was tying himself in knots over creatures who are sacred ends-in-themselves versus creatures who are just entries in the universal happiness spreadsheet. Worried sick that some super-feeler, some happiness black hole, might morally justify gobbling us all up to maximize cosmic joy. Kept fretting about the join between the two systems. But the kicker? The animals never consented to being spreadsheet entries. A lion sees my leg purely as potential utility – crunch the numbers, chomp, net happiness gain. Easy. Me? I’m forbidden, by sacred decree, from doing the same math on *his* leg. So who drew the line? Looking around at this lamb… seems suspiciously neat that the rule-makers, the knife-and-fork wielders, always land firmly on the sacred side of things. Convenient, that.
