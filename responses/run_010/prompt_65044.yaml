  Okay, the user is a TA preparing for a discussion on Aquinas and tyrannicide. They've got two students with opposing interpretations: one says Aquinas allows killing a tyrant with proportionality, the other says only public officials can do it. The user needs a clear, defensible reading of the texts without just saying "it's contested." They provided three passages and specific questions.

  First, I need to tackle the "unless" clause in Passage A (II-II, q.42, a.2). The student sees it as a permission with a cost-benefit cap. But looking at the context, the article is defining sedition, not granting blanket permission. The clause says disturbing a tyrannical government isn't sedition unless done "inordinately," causing more harm than the tyranny itself. The grammar: "inordinately" modifies "disturbed," meaning excessively or disorderly. The harm comparison is between the disruption caused by the resistance and the harm from the tyrant's ongoing rule. Since the objection mentions a divided multitude, the harm likely includes civil strife. So the clause isn't permitting tyrannicide; it's just saying such resistance isn't sedition if proportionate. But it could still be unlawful for other reasons, like being murder if done privately.

  Next, Passage B (II-II, q.64, a.3) is crucial. Aquinas explicitly says only public authorities can kill evildoers for the common good. Private individuals can't usurp this role. The reply to Obj.3 adds that private actions for the common good can't harm others without proper authority. So for resistance against a tyrant, unless the resisters have public authority, it's not permitted. Is there a way around this? The tyrant's injustice doesn't automatically transfer authority to subjects. The last line in Passage A's reply ("the tyrant is guilty of sedition") makes the resisters defenders of the common good, so they're not seditious. But that only removes the sedition label; it doesn't grant them killing rights. They're not seditious, but killing could still be murder if done privately.

  Now, the crossbow scenario in Passage C (II-II, q.64, a.7). Can a private person shoot the guard? Aquinas's self-defense principle allows unintended killing if proportional and necessary. But he explicitly says private individuals cannot intend to kill, even in self-defense. In this case, shooting the guard to save someone else—is that self-defense? Probably not, as self-defense here is about personal danger. Plus, if the shooter intends to kill (e.g., aims to kill, not disable), it's unlawful. The "more than necessary violence" tests both means (could you wound instead?) and overall proportionality (is the force excessive for the situation?). In a tyrannical context, one crossbow bolt might seem minor, but since it's usurping public authority, it's likely forbidden.

  Verdict: The student who says only public officials can kill the tyrant is closer to correct. The strongest argument for the other side is the "not sedition" point in Passage A and the proportionality clause. But Passage B's clear restriction to public authority overrides that. The key is Aquinas's view that public authority is necessary for lethal action for the common good, and tyranny doesn't automatically legitimize private violence. The underdetermined part is whether a legitimate authority can emerge during tyranny to sanction resistance. Aquinas doesn't specify, so that's a point to flag in class.
answer: |-
  Here's a straight, text-driven reading that resolves the tensions while respecting Aquinas's hierarchy of authority. I conclude **the "public official" student is substantially correct**, but the "proportionality" student identifies a real nuance in how Aquinas frames resistance. Below is the breakdown, your answers, and the verdict.

  ---

  ### 1. The "Unless" Clause in Passage A: It’s About the Label "Sedition," Not Permission to Kill  
  **What it does:** The clause ("*unless* indeed the tyrant’s rule be disturbed so inordinately...") determines **whether an act qualifies as the sin of "sedition"**—it does *not* authorize killing or guarantee the act is lawful. Aquinas is defining the boundaries of "sedition": disturbing a *tyrannical* regime isn’t sedition *unless* the disturbance causes disproportionate harm.  
  **Grammar:** "Inordinately" modifies "disturbed" (i.e., the act of resistance is disordered/excessive). The harm comparison is:  
  - **Harm A:** Suffering under the tyrant’s ongoing rule.  
  - **Harm B:** Harm caused by the *disturbance itself* (e.g., civil war, collateral damage).  
  If Harm B > Harm A, the act *is* seditious; if Harm B ≤ Harm A, it is *not* seditious.  
  **Why this matters:** Removing the "sedition" label means the resistors are "defending the common good" (Passage A, body) and thus not sinners *for sedition*. But Aquinas is clear: an act can avoid being "sedition" and *still* be sinful for other reasons (e.g., murder, if done without authority). The objection’s civil-war scenario is key: Aquinas is weighing societal stability, not just the tyrant’s life.  

  ---

  ### 2. Who Can "Disturb" the Tyrant? Only Public Authority (or Those Acting Under It)  
  **The agent:** The *only* lawful agent for lethal force is **public authority** (Passage B: "they alone, and not private individuals"). Aquinas gives no loophole for collective popular uprising or automatic authority-transfer.  
  **Key nuances:**  
  - **Tyrant’s injustice:** Strips the tyrant of *moral legitimacy* but not automatically of *legal authority*. Resistance isn’t "private action" only if done by **an alternative public authority** (e.g., a lower magistrate, a council with recognized jurisdiction). Aquinas implies this by contrasting "private individuals" with "persons of rank having public authority" (Passage B).  
  - **"The tyrant is guilty of sedition"**: This isn’t rhetorical—it reinforces that defending against him isn’t sedition. But it doesn’t upgrade resistors to *authorized killers*. It simply means their resistance isn’t intrinsically sinful *as sedition*. They are "permitted" only in the negative sense (not guilty of sedition), not positively empowered (Passage B still binds them).  
  **Verdict:** No non-cheating reading lets private individuals or mobs kill. Authority must be *public and institutional*, not derived from the tyrant’s injustice alone.  

  ---

  ### 3. The Crossbow Scenario: You May NOT Shoot  
  **Apply Passage C’s principles:**  
  - **Intend vs. Foresee:** You may *foresee* the guard’s death but cannot *intend* it. Aquinas is strict: private individuals cannot intend killing, even in defense of others ("*it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority*").  
  - **What can you intend?** Only stopping the guard (e.g., aiming for a leg). If death is unavoidable, it must be unintended. If you *need* to kill to stop him (e.g., he’s armored), you’re forbidden from acting—since killing would be intentional.  
  - **"More than necessary violence"**: Tests **BOTH**:  
    - (a) *Means*: Could you wound instead of kill? (If yes, killing is excessive).  
    - (b) *Proportionality*: Is lethal force proportionate to *this act*? (Yes, to save a life).  
    But—critically—**political context is irrelevant here**. Passage C’s proportionality applies only to *immediate self-defense*, not regime change. One crossbow bolt isn’t "sedition," but it’s still *murder* if you lack authority (Passage B).  

  **Outcome:** As a private person, you cannot shoot to kill. If you shoot and kill intentionally, it’s murder. If you shoot to wound and he dies, it *might* be justified—but only if non-lethal force was impossible.  

  ---

  ### 4. Verdict: Which Student is Closer?  
  **Winner: The "public official" student.** Aquinas unequivocally restricts lethal force to public authority (Passage B), and the exceptions in Passage A/C don’t override this.  
  **Strongest argument for the "proportionality" student:** Passage A’s reply *does* frame resistance against tyranny as "not sedition" and potentially lawful if proportionate. This *feels* like permission—but it’s negated by Passage B’s absolute bar on private killing.  
  **What must be true about Aquinas’s "public authority"**: It must be *hierarchical and institutional*. Authority isn’t dissolved by tyranny; it must be exercised by an office (e.g., a lesser magistrate, a council). Private citizens never get killing rights.  
  **Underdetermined point:** Can a *collective* (e.g., the "multitude") *become* a public authority? Aquinas doesn’t say. Passage A’s split-multitude scenario implies factions lack authority—only unity under a leader could qualify. **Flag this to your class:** Aquinas’s silence here is where later thinkers (e.g., Calvin, resistance theorists) innovate.  

  **Your one-liner for class:**  
  > "Aquinas forbids private tyrannicide absolutely. Only public authority can kill—even for the common good. Resisting a tyrant isn’t ‘sedition’ if proportionate, but unless you’re an official, it’s still murder."  

  This reading is defensible solely from your provided texts. No hedging.
