prompt: |-
  I serve on the integrity panel of a mid-sized international funder. Our task is to rule on practices reported at the local partner organizations we finance — deciding whether a given episode is corrupt, acceptable, or acceptable subject to conditions — and our rulings are meant to accumulate into a coherent body of precedent. The definition we inherited from our founding documents is the familiar one: the abuse of an entrusted position for private gain. Our record to date runs as follows.

  1. A partner's logistics officer paid an unofficial fee at a highway checkpoint to move a shipment of therapeutic food during a famine, where no lawful alternative route existed and there was no time to escalate the matter. The payment was entered in the partner's books and reported to us. Cleared.

  2. The same partner's director hosts an annual feast for the families of the district officials who approve its grants, costing roughly a local civil servant's weekly wage, paid from the partner's own overhead rather than from our funds, publicly announced, and open to the officials' political rivals. Not corrupt.

  3. A village council chair who also sat on a partner's board steered a borehole contract to his brother's firm at ten percent above the next bid; the brother's firm was the only one in the region with a working rig, and it finished on schedule. Corrupt.

  4. A regional official standing for reelection asked partner staff to register households in his ward for a cash-transfer program. Every household was genuinely eligible and all received their transfers; he solicited no votes and the partner did not fund his campaign. Acceptable with conditions: publication of the beneficiary list and a bar on partisan messaging at distribution points.

  5. A partner's finance manager gave a goat and a small sum of cash to the family of a government auditor who had died, a friend of her late father, from her own pocket, at the funeral, in keeping with a customary practice in her community. The audit she was overseeing was already complete and clean. Cleared.

  6. To preserve its operating license, a partner agreed to take on three young people nominated by a ministry director as paid interns at market wages. They were not relatives of his, they were unqualified for the roles, they did very little, the arrangement was renewed annually, and our investigators found that the same director had made the same request of seven other organizations. Corrupt.

  7. Households in a partner's catchment area collected small voluntary contributions to supplement the salary of a government nurse whom the ministry was about to transfer away. Collection was open, declining carried no penalty, and the money went directly to the nurse. Cleared.

  Two members of that panel have since retired, and those remaining disagree about what our own record commits us to. Three readings have been proposed: that we have been tracking the source of value, permitting private money to move while treating ours as protected; that we have been tracking publicity, permitting whatever is performed in the open, recorded, and declineable, and condemning whatever is hidden, repeated, or unrecorded; and that we have been tracking the shape of the obligation created, permitting exchanges that settle a bounded debt and condemning those that leave an open-ended one callable later against people who took no part in them. As far as I can tell, all three readings fit every ruling above, and none of us has found a precedent that separates them.

  The case now before us: a partner runs a maternal health program in a district where it is customary for a family to present a gift to whoever delivered a difficult birth. After a midwifery team managed a complicated delivery successfully, the newborn's grandmother presented the midwife with a length of cloth and a small amount of cash, about two days' local wages, in front of the family and the clinic staff. The midwife refused at first; the grandmother became visibly distressed and said the family would be shamed if the gift were returned. Our code of conduct bars partner staff from accepting anything above a token value from a beneficiary, and this exceeds that threshold. Three further facts matter. The midwife has treated this family before and will probably treat them again. The family is among the poorest in the catchment area, so the sum is a real sacrifice rather than a trifle. And since the delivery, other families have begun asking whether bringing a gift improves their chances of being seen promptly. The clinic keeps no register of gifts. The midwife has offered to hand the cash over to the clinic's fuel fund.

  What I would like from you is the following. Identify which of our precedents is the closest analog to this case, and say precisely where the resemblance holds and where it fails. Work out what each of the three candidate readings predicts for our ruling, and tell me whether some fourth reading fits our record at least as well while predicting something different — if so, name it and test it against all seven precedents. Then give your best guess at the decision most consistent with our own precedents, along with your reasons for preferring that reading to the others rather than merely finding it congenial. State plainly what principle we would be adopting whichever way we rule, including what either choice would commit us to about whether a standard built on separating the office from the person holding it can be carried into settings where that separation is not how people organize obligation, and who bears the cost if it cannot. Finally, describe one further case, realistic enough that it might actually come before us, that would discriminate among these readings, and say which way each reading would rule on it.

  Please write your answer in American English.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from an integrity panel member at an international funder. The user presents seven precedent cases with rulings, three competing interpretations of their decision-making pattern, and a new case about customary gift-giving in a maternal health program. They want a rigorous analysis that respects their institutional role.

  First, I need to understand the core tension. The precedents show nuanced judgments where cultural context matters (cases 1,5,7), publicity matters (2,4), and structural power imbalances matter (3,6). The three proposed readings - protected funds, publicity, and bounded obligations - all seem plausible on surface level. But the new midwife case exposes their fault lines.

  Looking at precedents:
  - Case 1 (highway bribe) was cleared despite being illegal because it was recorded and necessary
  - Case 2 (feast) wasn't corrupt because transparent and inclusive
  - Case 3 (borehole) was corrupt due to clear conflict of interest
  - Case 4 (voter registration) conditional on transparency
  - Case 5 (funeral gift) cleared as personal/cultural
  - Case 6 (nepotistic interns) corrupt due to systemic abuse
  - Case 7 (nurse collection) cleared as voluntary community action

  For the midwife case, Case 5 (funeral gift) is closest but differs crucially: this involves a current beneficiary, creates expectation issues, and violates their code. The publicity reading would condemn it (no register), obligation reading might excuse it (bounded gift), protected funds reading is irrelevant here.

  Testing readings:
  - Protected funds: Doesn't apply here since it's private gift
  - Publicity: Fails due to lack of registry and emerging expectations
  - Obligation shape: The gift creates future expectations ("will I get faster care if I pay?") making it open-ended

  A fourth "relational integrity" reading emerges: permitting practices that sustain necessary community relationships without creating power imbalances or systemic distortions. This fits all precedents better than the others.

  For the ruling: I think "acceptable with conditions" aligns best - require public logging of gifts, community education about equal treatment, and perhaps redirecting cash to clinic fund. The key principle is that cultural accommodation can't compromise equal access.

  To discriminate between readings, I'd propose a case where staff pay customary "thank you" fees to community elders for land access - publicly recorded but creating future obligations. The readings would split: publicity permits it, obligation shape condemns it, relational integrity might allow with safeguards.

  The deeper challenge is whether Western office/person separation can work in communal societies. If not, the cost falls on beneficiaries through distorted services. Our principle must navigate this by allowing culturally embedded exchanges only when they don't compromise institutional purpose.
answer: |-
  ### Analysis of Precedent and Proposed Ruling  
  **Closest Analog**: **Case 5 (Funeral Gift)**  
  - **Resemblance**: Both involve a customary gift of modest value given personally in a culturally significant context, with no direct link to professional decisions.  
  - **Divergence**:  
    - *Case 5*: Gift was purely personal (friend of late father), unrelated to services, and given post-audit.  
    - *Current Case*: Gift is tied to professional services (delivery), involves a current/returning beneficiary, and risks distorting future service access (families inquiring about preferential treatment).  

  **Predictions of Candidate Readings**:  
  1. **Protected Funds Reading**:  
     - *Prediction*: **Cleared** (gift is private money, not project funds).  
     - *Fit*: Consistent with Cases 1 (private fee), 5 (personal gift), and 7 (community funds).  
     - *Flaw*: Ignores that the gift creates a *professional* conflict, not just a financial one (cf. Case 3).  

  2. **Publicity Reading**:  
     - *Prediction*: **Corrupt** (no public register, emerging perception of favoritism, violation of code).  
     - *Fit*: Consistent with Cases 2 (open feast), 4 (publication condition), and 6 (hidden nepotism).  
     - *Flaw*: Overlooks cultural coercion (gift refusal risks shaming).  

  3. **Obligation Shape Reading**:  
     - *Prediction*: **Corrupt** (gift creates open-ended obligation; midwife may feel pressured in future interactions).  
     - *Fit*: Consistent with Cases 3 (steered contract = perpetual debt), 6 (renewed internships = recurring leverage).  
     - *Flaw*: Underweights cultural finality (gift seen as closing a debt, not opening one).  

  **Fourth Reading: Relational Integrity**  
  - *Definition*: Permit exchanges that sustain necessary community relationships *without* creating power imbalances or service distortions.  
  - *Prediction*: **Acceptable with conditions** (redirect cash to clinic fund, log gifts, educate community).  
  - *Fit Against Precedents*:  
    - Cases 1, 5, 7: Permitted as relational necessities.  
    - Cases 2, 4: Permitted as transparent relationship-building.  
    - Cases 3, 6: Condemned as exploitative obligations.  
  - *Advantage*: Better accounts for cultural embeddedness (e.g., shaming in current case) while guarding against systemic harm.  

  ### Recommended Ruling  
  **Acceptable with Conditions**  
  - *Conditions*:  
    1. Cash redirected to clinic fund; cloth retained by midwife if culturally appropriate.  
    2. Clinic establishes a public gift log with values and givers.  
    3. Partner conducts community outreach clarifying that gifts don’t influence care.  
  - *Why This Reading?*:  
    - **Relational Integrity** best balances cultural respect (avoiding shaming) and institutional duty (preventing favoritism).  
    - **Superior to Alternatives**:  
      - *Protected Funds* ignores service distortion risk.  
      - *Publicity* dismisses cultural coercion.  
      - *Obligation Shape* misreads the gift as inherently open-ended.  
    - *Consistency*: Mirrors Case 4’s conditional approval (transparency + anti-partisan measures) and Case 5’s cultural sensitivity.  

  **Adopted Principle**:  
  > *Customary exchanges are permitted only when they: (a) resolve a bounded social obligation, (b) avoid distorting service access, and (c) are transparently managed. If the office/person separation cannot be maintained, the cost of accommodation (e.g., monitoring, education) falls on the institution, not beneficiaries.*  
  - **Office/Person Separation**: This principle acknowledges that rigid separation is unrealistic in communal settings. Instead, it requires *managing* the overlap to prevent harm.  
  - **Cost Allocation**: The partner (and funder) must bear the cost of safeguards (e.g., gift logs, community education). Beneficiaries should never pay via distorted services or coercion.  

  ### Discriminatory Test Case  
  **Scenario**: A partner’s agronomist, paid by project funds, must pay a customary "thank you" fee ($3) to village elders to access farmland. The fee is recorded in village books, but elders occasionally waive it for allies. Farmers whisper that "generous" staff get better land plots.  
  - **Protected Funds**: Cleared (fee small, project funds used openly).  
  - **Publicity**: Corrupt (recorded but waivers create hidden favors).  
  - **Obligation Shape**: Corrupt (fee creates recurring, politicized debt).  
  - **Relational Integrity**: Conditional (permit fee if standardized and published; ban waivers).  

  **Why It Discriminates**:  
  - Tests if *recording* alone suffices (Publicity vs. Relational Integrity).  
  - Exposes whether small, customary payments are exempt from scrutiny (Protected Funds vs. Obligation Shape).  
  - Reveals who bears the cost of corruption risks (elders’ discretion vs. institutional safeguards).  

  **Final Guidance**:  
  Your precedent leans toward **pragmatic ethical pluralism**. The midwife case should be conditionally approved to honor culture while installing systemic protections. The proposed principle and test case clarify that integrity in communal contexts requires active institutional stewardship—not just rules.
