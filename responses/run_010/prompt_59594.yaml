prompt: |-
  I am a conservation biologist who now sits on a panel that reviews funding proposals touching on the welfare of wild animals, and I have been trying to write down the doctrine my own judgments actually follow. What I have instead is a list of verdicts that I suspect are not all consistent. Each concerns a proposal of the kind my panel sees or could plausibly see. My verdicts:

  1. Emergency water and fodder for an elephant population in a drought that our own extraction helped cause: approve, and I think we owe it.
  2. The identical provision for an elephant population in a drought that owes nothing to us: I would approve it if it were cheap, but I do not think it is owed.
  3. Removing a dam that blocks fish migration: approve enthusiastically, even though the restored spawning access means many more fry hatched into a river in which most of them die.
  4. Oral vaccination of a wild rabbit population against a pathogen we introduced: approve. The same vaccine against a pathogen the rabbits have always carried, at comparable cost and comparable certainty: I hesitate, and my hesitation seems to track what it would do to the population's size rather than to its suffering.
  5. Extirpating a host-specific parasitic botfly where nothing else depends on it: approve.
  6. Suppressing an apex predator population by two thirds on modelling I accept as sound, which lowers aggregate suffering among its prey: refuse, even though the model behind it is better than the models behind several proposals I approve.
  7. Reintroducing that same apex predator to a landscape from which we exterminated it, knowing the reintroduction multiplies painful deaths: approve, and I would campaign for it.
  8. A gene drive suppressing a commensal rodent on an island, expected to prevent vastly more suffering than any of the above, practically irreversible, untested at scale: refuse, whatever the expected-value arithmetic says. Funding the contained research that would eventually make it testable: approve.
  9. A standing program that humanely kills every large mammal in a park that sensors identify as starving or mortally injured: this is the one I keep revising. It plainly reduces aggregate suffering; it also converts park management into a continuous killing operation whose error rate I cannot estimate, and I suspect my refusal rests on that rather than on the welfare arithmetic.
  10. A habitat modification that reduces the number of insects hatched into lives that almost certainly end within days, at essentially no cost to anything else: approve. A proposal to reduce insect biomass generally on the grounds that most insect lives are net negative: refuse.
  11. Reintroducing a rare raptor to part of its former range, though its recovery increases predation on other birds: approve. Establishing a population of the same raptor where it has never lived, to raise a biodiversity score: refuse.

  My own tentative rule is that we should intervene where we caused the problem and never intervene to change a population's size. Cases 5, 7, and 10 break that immediately, so it is not what I am running.

  The pairs I can see are in trouble: 3 against 10, since both increase the number of animals living short bad lives and I welcome one; 6 against 7, since the same animals and the same death rate get opposite verdicts; 4 against 5, since both are welfare-motivated interventions against an endemic harm-doer and I approve only one; 7 against 11; and 6 against 8, where I refuse a well-modelled local intervention and a poorly-modelled global one, apparently for different reasons.

  What I want from you:

  (a) one or two candidate principles, stated as decision rules precise enough to be applied by someone who does not share my intuitions;
  (b) for each clause of each, the case above that forces it;
  (c) a judgment on whether the principle that saves all eleven is so clause-laden that it ceases to be a principle, and if it is, the simplest coherent version together with an explicit statement of which verdicts it costs me and why those rather than others;
  (d) its ruling on three cases I have not listed: a contraceptive bait and a lethal cull that produce the same population trajectory over the same number of years; relieving suffering inflicted by a species we introduced two centuries ago and no longer control; and, at equal cost, choosing between improving the lives of a long-lived, slowly reproducing species and stabilizing the population of a short-lived, explosively reproducing one;
  (e) an honest account of what your principle cannot accommodate in my verdicts, as opposed to what it merely reinterprets.

  Finally, say where the resulting rule sits relative to the standing positions in this debate. I do not want names, references, or a reading list, only which familiar view it most resembles, where it departs from that view, and whether the departure is a refinement or a rejection.
reasoning: |-
  Okay, let me start by trying to understand the conservation biologist's problem. They've listed eleven verdicts on different funding proposals and feel these might not be consistent. They want principles that can explain all these decisions. But some cases seem contradictory, like approving dam removal which increases fry deaths but refusing general insect biomass reduction. Or reintroducing predators they previously extirpated but refusing to suppress the same predator elsewhere. 

  First, I need to look for patterns across all these cases. The biologist mentions owing intervention when humans caused the problem. That explains case 1 (helping elephants affected by extraction) versus case 2 (natural drought). But then case 5 (removing a botfly) and case 7 (reintroducing an apex predator) don't fit because humans didn't cause those issues. So that principle alone isn't enough.

  Looking at population size interventions: they hesitate in case 4 (vaccinating against endemic disease) because it affects population size, but in case 10 they approve reducing insect hatching. That's conflicting. Also, in case 6, refusing predator suppression lowers prey suffering but changes population size. So avoiding size changes isn't consistent either.

  The hesitation in case 4 about population size might be about natural balance. Vaccinating against an introduced pathogen (case 4 first part) is okay because humans messed up, but not against a natural one. Similarly, in case 11, reintroducing a raptor to its former range is restoration, but introducing it elsewhere for biodiversity isn't. That suggests a preference for restoring natural states over creating new ones.

  Case 8 is tricky. Refusing a gene drive for rodents despite preventing suffering because it's irreversible and untested. But approving the research. Here, caution about unintended consequences and scale matters. Case 9 is about active euthanasia versus passive suffering. The refusal there seems more about the operational aspect (continuous killing) than the welfare math. So maybe the principle includes avoiding high-intervention maintenance.

  Case 3 (dam removal) is approved even though more fry die. But in case 10, reducing insect hatching is approved, while reducing overall biomass is refused. The difference might be that dam removal restores a natural process, even if it causes more deaths, whereas reducing biomass is an artificial reduction. So natural processes are key.

  Now, combining these ideas: maybe the core principle is intervening when humans caused harm to restore natural conditions, and otherwise being cautious. But case 5 (removing botfly) is an intervention not tied to human cause. Unless "no dependencies" makes it low-risk. Case 7 is reintroducing a predator humans eradicated, so that's restoring natural state. Case 11 reintroduction to native range is similar, but introducing elsewhere isn't.

  So perhaps the principles are about restoration and natural processes. Also, avoiding interventions that alter population sizes without restoring ecology. But case 10 reduces insect hatching, which is a size change, but it's approved because it's a habitat modification that reduces suffering without harming others. That's different from case 4's vaccination which might increase population unnaturally.

  For the gene drive in case 8, refusing due to scale and irreversibility, but approving research. That's about the precautionary principle. Similarly, case 9's refusal is about operational risks, not welfare. So risk assessment is a factor.

  Putting this together: two principles. First, restorative intervention for human-caused harm. Second, ecological deference: avoid disrupting natural processes unless restoring them. Then add risk constraints: avoid irreversible or high-risk interventions. 

  Testing against all cases: Case 1 fits restorative. Case 2 not human-caused, so not owed. Case 3 restores natural migration. Case 4 first part is restorative (human-introduced pathogen), second part isn't. Case 5 removing botfly: not restorative, but perhaps because it's a minor element with no dependencies, so low impact, fitting ecological deference. But why approve? Maybe seen as removing an unnatural harm? Not sure. Alternatively, it's a welfare-specific intervention without ecological disruption. 

  Case 6 suppressing predators: disrupts natural balance. Case 7 reintroduction restores it. Case 8 gene drive: high risk, irreversible. Case 9: operational risk. Case 10 habitat mod reduces suffering without harm, so acceptable. Reducing biomass generally disrupts ecology. Case 11 reintroduction to native range restores, establishing elsewhere does not.

  For the contraceptive vs lethal cull: same population effect, but the principle might prefer non-lethal if it causes less suffering, but the biologist didn't specify. The principle here might not distinguish if the outcome is the same. 

  Relieving suffering from introduced species long ago: if humans caused it, even long ago, restorative principle applies. But if the species is now naturalized, it might be complicated. The principle would say intervene because humans caused the problem originally.

  Choosing between species: the principle doesn't specify, so might default to welfare or feasibility. But the biologist might prefer the long-lived species due to individual welfare, but the principle doesn't address this. 

  The resulting rule resembles non-interventionism but with exceptions for restoration and human-caused harm. It departs by allowing welfare interventions if they don't disrupt ecology, like case 10. The refinement is in defining acceptable interventions more clearly, especially around restoration and risk.
answer: |-
  Based on your verdicts, I propose the following decision rules. They prioritize **ecological restoration**, **mitigation of human-caused harm**, and **caution toward interventions that disrupt natural processes**, with explicit risk constraints:

  ### Candidate Principle 1: Restorative Intervention  
  *"Approve interventions that (a) restore ecosystems to a more natural state disrupted by humans, or (b) directly mitigate suffering caused by human actions. Reject interventions that alter natural processes or population dynamics without a restorative or mitigative purpose."*  

  ### Candidate Principle 2: Risk-Constrained Welfare  
  *"Approve suffering-reduction interventions only if they (a) avoid large-scale/permanent ecological disruption, (b) target unnatural suffering sources, and (c) have low operational risks. Prioritize reversibility and containment."*  

  ---

  ### (b) Cases Forcing Each Clause  
  **Restorative Intervention**  
  - **Clause (a)**: Case 7 (reintroducing human-exterminated apex predator) forces requiring *human-caused disruption* for restoration.  
  - **Clause (b)**: Case 1 (drought relief after human extraction) forces *mitigation of human-caused suffering*.  
  - **Rejection clause**: Case 6 (suppressing natural predator) forces refusal of non-restorative population alteration.  

  **Risk-Constrained Welfare**  
  - **Clause (a)**: Case 8 (refusing irreversible gene drive) forces excluding large-scale/permanent disruption.  
  - **Clause (b)**: Case 4 (approving vaccine for human-introduced pathogen, hesitating for endemic) forces targeting *unnatural* suffering.  
  - **Clause (c)**: Case 9 (refusing sensor-based euthanasia) forces refusal due to operational risks.  

  ---

  ### (c) Coherence and Trade-offs  
  A unified principle covering all 11 cases requires four clauses but remains actionable:  
  **Final Principle**:  
  *"Approve only if:  
  1. It restores ecosystems degraded by humans, OR  
  2. It reduces suffering caused by humans, OR  
  3. It reduces suffering from unnatural sources with minimal ecological disruption, AND  
  4. It avoids high uncertainty, irreversibility, or systemic operational risks."*  

  **Simplified Coherent Version (costs 3 verdicts)**:  
  *"Approve only for restoring human-degraded ecosystems or mitigating human-caused suffering."*  
  - **Costs**: Case 5 (botfly removal), Case 10 (insect-hatching reduction), and Case 3 (dam removal) are rejected.  
  - **Why these?** They lack a direct human-caused harm (botfly, insect lives) or restore natural processes but aren't explicitly reversing human damage (dam removal). Your approval of Case 3 hinges on restorative intent, but the simplified rule excludes welfare-only interventions without human causation.  

  ---

  ### (d) Rulings on New Cases  
  1. **Contraceptive vs. lethal cull (same population trajectory)**:  
     - *Approval* for contraceptive, *refusal* for lethal cull.  
     - **Why**: Both alter populations, but lethal methods cause direct suffering (violates Risk-Constrained Welfare). Restorative Intervention doesn’t apply here.  

  2. **Relieving suffering from species introduced 200 years ago**:  
     - *Approve*.  
     - **Why**: Humans caused the introduction (Restorative Intervention clause 2), even if indirect now.  

  3. **Improving lives of long-lived species vs. stabilizing short-lived species**:  
     - *Choose improving lives of long-lived species*.  
     - **Why**: Stabilizing populations often requires ongoing intervention (e.g., culling, habitat control), risking ecological disruption (violates Risk-Constrained Welfare clause 3). Welfare gains for individuals in stable populations outweigh quantity-focused management.  

  ---

  ### (e) Honest Limitations  
  - **Reinterprets**: Case 10 (insect-hatching reduction) is framed as "minimal disruption" (Risk-Constrained Welfare clause 3), not pure welfare math. Case 5 (botfly) is approved as an "unnatural suffering source," though humans didn’t introduce it.  
  - **Cannot Accommodate**:  
    - Your hesitation in Case 4 (endemic vaccine) implies discomfort with *any* population-size intervention, but the principle allows it if criteria are met. It accepts your verdict but not your reasoning.  
    - Case 11’s refusal of "biodiversity introduction" relies on "natural range" as a moral boundary. The principle enforces this but doesn’t derive it from core axioms—it’s an ecological deference prior.  

  ---

  ### Position in the Debate  
  - **Resembles**: A **restoration-focused non-interventionism** (e.g., "leave nature alone unless fixing human mistakes").  
  - **Departs by**:  
    1. Explicitly permitting *targeted suffering reduction* for human-caused or unnatural harms (e.g., your Cases 1, 4, 5).  
    2. Incorporating *risk thresholds* (e.g., refusing Case 8 despite welfare gains).  
  - **Refinement or Rejection?** A **refinement**. It retains non-interventionism’s caution but carves exceptions for responsibility and low-risk welfare, rejecting both pure "aggregate suffering" utilitarianism (e.g., refusing Cases 6 and 8) and strict "hands-off" ecology (e.g., approving Cases 3 and 7).  

  This rule systematizes your intuition that **humans are gardeners, not gods**: intervening to repair damage or alleviate unnatural suffering, but deferring to evolved ecosystems when in doubt.
