prompt: |-
  I've been keeping a running list in my notes of the imprecise-credence cases I actually have verdicts about — it's going to be the spine of a workshop talk — and its a mess. Here it is, roughly in the order I wrote it down.

  1. A coin comes out of a mint I know nothing about: no symmetry information, no track record, no manufacturing story. I refuse to hold a sharp 0.5 for heads. Something like an interval that comfortably straddles a half, maybe [0.3, 0.7]. And refusing to bet either side at even money, for any stake, seems to me like the correct call rather than cowardice.

  2. But now: a coin I'm told is either double-headed or double-tailed, and nothing further. Here I think my credence in heads should be sharp, exactly 0.5, by symmetry — even though I also know for certain the true chance is 0 or 1, so my sharp 0.5 is guaranteed to misdescribe the chance. I'm completely at peace with that. Cases 1 and 2 look to me like the same evidence situation getting opposite treatment, and I'm not embarrassed by it, but I need to say why out loud.

  3. The two-machine case. A coin is tossed twice by a machine I know is either sticky (likes to repeat) or anti-sticky (likes to alternate), with no clue which. Say sticky means P(HH)=P(TT)=3/8 and anti-sticky means P(HT)=P(TH)=3/8, so each toss is marginally even either way. My credence that the second toss is heads is a sharp 1/2. Now I'm offered the first result for free — and whichever way it comes, my interval for the second toss blows open to [1/4, 3/4]. I think declining the free look is rational. I also think, separately, that costless no-strings information is never rationally declined. Both sentences are on the list.

  4. Betting on an interval. Offered $1 if heads for 55c: refuse. Offered $1 if heads for 45c: refuse again. So I turn down both sides and leave money on the table, and I think that's fine. But a scheme that guarantees I lose no matter how things turn out — that I think is genuinely irrational, not merely unlucky. Turning down both sides and getting suckered are supposed to be different things, and I want the principle that makes them different.

  5. Sampling. I've watched the mint's coin land heads 500 times in 1000. My interval for the next head should now be narrow, call it [0.47, 0.53], and it should keep narrowing with more data, approaching a point arbitrarily closely without ever being one — even though the data never logically excludes a bias of 0.9.

  6. Same interval, different history. You and I both sit at [0.2, 0.8] for "this urn is mostly red." You got there by drawing twenty balls; I got there by knowing nothing at all. I think these are not the same epistemic state, and that a view on which a credal state just *is* a set of numbers cannot see the difference. I'd pay for one more observation in both cases, but not the same amount, and one of us is much closer to being squeezed into precision.

  7. If I know one of E1…En must obtain, and my conditional interval for H given each Ei lies inside [0.4, 0.6], then my unconditional interval for H had better not stick out past that. I'm told this requirement fails in some infinite setups and that I should learn to live with it. I don't want to.

  My tentative principle is: the credal set is exactly the probability functions compatible with your total evidence; update by conditionalizing each member; accept a bet iff every member recommends it. It handles 1 and 4 tolerably. It gives the wrong answer on 2, since compatibility alone leaves heads anywhere in [0,1] there. It's silent on 5, because every bias is compatible with 500/1000. It can't even express 6. It's silent on 7. And I suspect it turns the refusal of free information in 3 from permissible into mandatory, which is the opposite of what I want.

  So: what principle actually fits this list? State it precisely enough that I could run a new case through it myself, say which clause is doing the work in which numbered case, and tell me straight which of my verdicts it can't keep — I'd much rather be told that 3 or 7 has to go than be handed something with six epicycles bolted on. If 3 and 7 are in tension, I want that said explicitly, since I currently believe both.

  Then run your principle on two cases that aren't on the list. (a) A forecaster I know to be well-calibrated reports 0.3 on a claim about which I otherwise have nothing at all: do I end up sharp at 0.3, or interval-shaped around it, and what in the principle decides that? (b) Same sticky/anti-sticky machine as in 3, except the first toss gets announced over a loudspeaker whether I want it or not, and I'm allowed to lock in my bet on the second toss beforehand — is walking out of the room still permitted, and if it is, what does that say about whether the information in 3 has negative value or merely no value?

  I know the names of the standard camps here; I don't need the labels, I need the machinery.
reasoning: |-
  Okay, the user has a detailed list of cases involving imprecise credences and is struggling to reconcile their intuitive judgments with existing formal frameworks. They're preparing a workshop talk and need a coherent principle that can handle all their cases without internal contradictions. 

  First, I notice the user is deeply familiar with the technical literature but frustrated by how existing models (like credal sets) fail their intuitive tests. Their examples are carefully constructed stress tests: case 2 challenges strict evidence-compatibility, case 6 exposes the insufficiency of static intervals, and case 3 pits information refusal against Dutch book arguments. 

  The core tension emerges between two desires: wanting credences to reflect *only* evidence-compatible probabilities (which demands sharp 0.5 in case 2) while also wanting epistemic states to remember their evidentiary history (case 6) and avoid premature precision (case 1). The user's provisional credal set approach fails this because it's memoryless and too permissive in some cases (like 2) yet too restrictive in others (like 3 when refusing free information). 

  Hmm. What they might need is a two-layer model: one layer for evidence compatibility, another for robustness or stability. Case 2 feels sharp because the symmetry creates robustness despite ignorance of the actual chance. Case 1 lacks that symmetry anchor. The stability principle I propose formalizes this - it explains why they're comfortable with sharp 0.5 in 2 (stable under evidence shifts) but not in 1 (fragile). 

  For case 3's information refusal paradox, the key is distinguishing between ex ante and ex post rationality. The principle allows declining free information *only* when it would destabilize your credence without improving decisions - which matches their intuition that it's permissible but not mandatory. This also resolves the tension with "never refuse costless information" by clarifying that the latter applies when information has instrumental value. 

  Case 6 requires credences to carry metadata about evidentiary weight. The stability principle handles this implicitly: the user with 20 samples has higher stability (narrower interval survives new data) than the ignorant user. Thus paying more for another sample is rational for the latter. 

  On the new cases: 
  (a) The forecaster's 0.3 creates asymmetry. Without other evidence, it's stable only if treated as a symmetry-breaking input - hence sharpening. But if I distrust calibration, robustness demands an interval. 
  (b) Announcing the first toss forces a decision. Walking out is permitted because betting without updating maintains the original stable interval - demonstrating information can have neutral value when it doesn't improve decision robustness. 

  The user's resistance to dropping case 7 (interval coherence) is understandable. The stability principle satisfies it in finite cases by design, but they'll need to accept its failure in infinite partitions - a necessary trade-off for solving cases 1-6. I should emphasize that this mirrors how Bayesian updating handles non-measurable sets. 

  Throughout, I avoid terms like "imprecise probability" or "Dempster-Shafer" because the user explicitly wants mechanisms, not labels. The stability+robustness framing builds on their existing intuition that some symmetries license precision while others don't.
answer: |-
  Here's a principle designed to capture your intuitions, built around **Robust Stability** and **Evidential Anchoring**. It rejects the idea that the credal set is *just* the set of probability functions compatible with your total evidence.

  **The Robust Stability Principle (RSP):**

  1.  **Credal State:** Your credal state for proposition `H` is represented by a *set* `C` of probability functions, but this set is constrained by more than just *logical compatibility* with evidence.
  2.  **Evidential Anchoring:** `C` must include *all and only* those probability functions that:
      *   (a) Are compatible with your total evidence `E`.
      *   **(b) Are robustly stable under the symmetries or invariances implied by `E`.**
          *   Robust Stability: A probability function `P` is robustly stable if small, evidence-preserving perturbations in the description of the underlying possibility space (consistent with `E`'s symmetries) do not lead to significant changes in `P(H)`.
  3.  **Updating:** Upon learning new evidence `E'` (with certainty), update by conditionalizing *every member* of `C` on `E'`, provided `E'` is consistent with the possibility space defined by prior evidence. The resulting set `C' = {P(·|E') | P ∈ C}` becomes your new credal state. Re-evaluate Robust Stability (step 2b) *if* the symmetries/invariances implied by the new total evidence `E & E'` have changed.
  4.  **Decision (Accepting Bets):** Accept a bet on `H` with net payoff structure `X` iff `E_P[X] ≥ 0` for *every* `P ∈ C`. (Otherwise, reject it).
  5.  **Decision (Seeking Information):** Costless, no-strings information about a proposition `A` *can* rationally be declined *if and only if*:
      *   Learning `A` or learning `¬A` would *destabilize* your credal state (i.e., force a significant widening of your interval for `H` due to *violating* previously robust symmetries), AND
      *   This potential destabilization provides *no compensating increase in robustness* for *any* decision you currently face or anticipate facing before the outcome of `H` is resolved.

  **How RSP Handles Your Cases:**

  1.  **Mystery Coin:** `E` implies *no symmetries*. No specific `P` is robustly stable (small changes in assumptions about the mint change `P(H)` wildly). `C` is large, e.g., `[0.3, 0.7]`. Bet refusal at `0.5` is required (Step 4). *Clause: 2b (Lack of Robust Stability).*
  2.  **Double-Headed/Double-Tailed:** `E` implies strong symmetry: Heads and Tails are treated identically by the evidence (the labels are arbitrary). The *only* `P` robust under this symmetry is `P(H)=0.5`. While `P(H)=0` and `P(H)=1` are compatible with `E` (Step 2a), they are *not* robustly stable. Perturbing the setup slightly (e.g., considering a coin that's 99.999% likely DH or DT) breaks `0` or `1` drastically, but leaves `0.5` essentially unchanged. `C` collapses to `{0.5}`. You correctly hold sharp `0.5`. *Clause: 2b (Robust Stability under Evidence Symmetry).*
  3.  **Two-Machine Case:**
      *   *Before 1st Toss:* Evidence implies symmetry between Sticky/Anti-Sticky *and* symmetry between H/T for the first toss. The only robustly stable `P(H2)` is `0.5` (similar reasoning to Case 2). `C(H2) = {0.5}`.
      *   *After seeing 1st Toss (e.g., H):* The symmetry between Sticky/Anti-Sticky is broken (learning `H` makes Sticky more likely, Anti-Sticky less likely). Crucially, the prior symmetry was *necessary* for the robustness of `P(H2)=0.5`. Without it, no sharp `P` is robustly stable. The robustly stable set widens to `[1/4, 3/4]` (the values compatible with `E` *and* stable under the *remaining* symmetries, e.g., H/T symmetry for the *second* toss conditional on machine type).
      *   *Declining Free Look:* Permissible under RSP Step 5. Learning `H1` or `T1` *will* destabilize your credal state for `H2` (force widening). Crucially, this destabilization provides *no compensating increase in robustness* for betting on `H2` *before* the second toss happens. You *already* have the most robust credence possible (`0.5`) given the symmetries, and learning `H1` won't help you make a *better* bet on `H2` before toss 2 (it just makes you less certain). *Clause: 5 (Permissible Decline due to Destabilization without Compensating Robustness Gain).*
      *   *"Costless info never declined":* This holds for information *instrumentally valuable* for future decisions. Step 5 carves out an exception where the information *only* harms robustness without providing any instrumental benefit for *upcoming* choices.
  4.  **Betting on an Interval:** `C(H) = [L, U]`. Refusing bets at `0.55` and `0.45` is required if `L < 0.5 < U` (Step 4). This is not a guaranteed loss scheme ("suckered"). A guaranteed loss scheme requires a *set of bets* accepted *simultaneously* that collectively guarantee loss. Here, you are offered bets *sequentially* and reject both individually. RSP Step 4 only tells you to reject bets not acceptable to all `P ∈ C`. It doesn't force you to accept any particular combination. *Clause: 4 (Bet Acceptance Rule).* The "suckered" case violates the fundamental axiom of avoiding strict loss, which RSP respects via Step 4.
  5.  **Sampling (500/1000):** `E` implies approximate symmetry/frequency. The robustly stable `P` values cluster around `0.5`. Functions assigning `P(H)=0.9` are compatible (Step 2a) but *not robustly stable*. Slight changes in the sample (e.g., 501H instead of 500H) would drastically reduce `P(H)=0.9` under most sensible priors, while barely moving `P(H)=0.5`. The robustly stable set `C` narrows around `0.5` with more data. *Clause: 2b (Robust Stability under Approximate Frequency Symmetry).*
  6.  **Same Interval, Different History:** `C` isn't just the interval; it's the set defined by *current evidence under its symmetries*. Your evidence (20 draws) implies stronger symmetries (stable frequencies) than mine (total ignorance). Your interval `[0.2, 0.8]` is *more robust* (less likely to widen dramatically with one more draw) than mine. The *degree of robustness* differs. RSP captures this because the *evidence supporting the symmetry* is stronger for you, making the interval more stable. The willingness to pay more for another observation reflects the *potential to increase robustness* (narrow the interval significantly - Clause 5's "compensating increase in robustness"). Mine has high potential gain; yours has low potential gain. *Clause: 2b (Degree of Robustness implied by Evidence Strength).*
  7.  **Interval Coherence (Finite):** RSP satisfies this. If every `P ∈ C` has `P(H|E_i) ∈ [0.4, 0.6]`, then for any `P ∈ C`, `P(H) = Σ P(H|E_i)P(E_i)`. Since `P(H|E_i) ≤ 0.6` and `Σ P(E_i)=1`, `P(H) ≤ 0.6`. Similarly, `P(H) ≥ 0.4`. So `C(H) ⊆ [0.4, 0.6]`. *Clause: 2a (Compatibility) + Probability Axioms.* **Trade-off:** RSP *cannot* guarantee this for infinite partitions without additional (often problematic) continuity assumptions. You *must* learn to live with its potential failure in infinite cases (e.g., countable additivity failures), as demanded by your cases (2, 5) involving sharp credences despite logical possibilities of extreme chances. **3 and 7 are compatible under RSP for finite cases.**

  **RSP Applied to New Cases:**

  **(a) Calibrated Forecaster (0.3):**
  *   **Evidence `E`:** "Forecaster I know to be well-calibrated reports `P(H)=0.3`" + "No other evidence about `H`".
  *   **Robust Stability (2b):** The key symmetry implied by the calibration knowledge is that if the forecaster *says* `p`, then `H` happens roughly `p` of the time *in the long run across many such reports*. For *this specific report*, `E` breaks the symmetry between `H` and `¬H`. It anchors `H` at `0.3`, making probabilities far from `0.3` unstable. Suppose you consider `P(H)=0.5`. Perturb the evidence slightly: suppose the forecaster reported `0.29` or `0.31` instead. `P(H)=0.5` remains stubbornly high. In contrast, `P(H)=0.3` would move smoothly with the report. `P(H)=0.3` is robustly stable under variations consistent with the forecaster's calibration within expected error bounds. Functions around `0.3` (e.g., `[0.28, 0.32]`) might also be stable depending on your precise calibration model. `P(H)=0.01` or `P(H)=0.99` are unstable.
  *   **Verdict:** Your credence should sharpen to, or form a *very narrow interval* around, `0.3`. The robust stability induced by the calibration report anchors your credence precisely. *Clause 2b does the work.*

  **(b) Sticky/Anti-Sticky with Forced Announcement & Pre-Commitment:**
  *   **Setup:** Machine (Sticky or Anti-Sticky) chosen secretly. First toss (`T1`) occurs and result (`H1` or `T1`) *will* be announced before the second toss (`T2`). You must decide *now*, before `T1` happens, whether to bet on `T2` being Heads at given odds, or walk away (declining to bet).
  *   **Credal State Before T1:** Same as Case 3 initially: `C(T2) = {0.5}` (Robustly stable under Sticky/Anti-Sticky symmetry and `T1` H/T symmetry).
  *   **The Offer:** Lock in a bet on `T2=H` now, or walk away.
  *   **RSP Analysis:**
      *   *Option 1: Bet Now.* Based on `C(T2) = {0.5}`, you would accept a bet at even money (Step 4: `E_P[Win] = 0.5*1 + 0.5*(-1) = 0` for `P ∈ C`). You might accept slightly favorable odds. Crucially, this bet is made *before* the destabilizing information (`T1`) arrives. Your decision is based on the *current robustly stable credence*.
      *   *Option 2: Walk Away.* Is this permitted? Step 5 is about *seeking/declining information*. Here, you aren't declining information; you are declining to bet *before* the information arrives. RSP Step 4 governs bet acceptance: You can *always* rationally decline a bet if it's not required by Step 4. Since accepting the bet is only *permitted* (not mandated) by Step 4 (because `E_P[X]=0`), declining it is also rationally permissible. Walking out is allowed.
  *   **Verdict:** Walking out of the room **is permitted**. This highlights the distinction in Case 3: In Case 3, declining the information *was permitted* because the information had no instrumental value and caused harm (destabilization). Here, declining *to bet* is permitted simply because RSP's betting rule doesn't force you to accept fair bets or make bets you don't want to make. The key point about the information in Case 3 under RSP is that it had **merely no (instrumental) value**, not negative value in a decision-theoretic sense forcing you to pay to avoid it. You *could* decline it without irrationality because it offered no benefit. You are never forced to accept fair bets based on your credal state. *Clause 4 (Bet Acceptance Rule is permissive, not mandatory for `E_P[X]=0`) does the work.*

  **Summary and Which Verdicts are Kept:**

  RSP keeps all your verdicts on Cases 1-7 for finite scenarios. The cost is accepting that interval coherence (Case 7) can fail for infinite partitions. The core innovation is **Clause 2b (Robust Stability under Evidential Symmetries)**. It explains:
  *   Sharp credences in Cases 2 & 3 (initial) despite extreme possibilities (Robust Stability).
  *   Imprecise credences in Cases 1, 3 (after update), 5, 6 (Lack of Robust Stability).
  *   The difference in Case 6 (Degree of Robustness).
  *   Why declining information is permitted in Case 3 (Destabilization without compensating robustness gain for upcoming decisions - Clause 5).
  *   Betting behavior in Case 4 (Clause 4).
  *   Interval Coherence in finite Case 7 (Clauses 2a + Probability).

  RSP provides a precise procedure: Identify total evidence `E` -> Determine symmetries/invariances implied by `E` -> Find probabilities robustly stable under those symmetries -> That set is `C`. Update by conditionalization. Accept bets only if acceptable to all `P ∈ C`. Decline costless info only if it destabilizes without improving robustness for upcoming decisions. This handles the new cases distinctly.
