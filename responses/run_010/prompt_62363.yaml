prompt: |-
  I am revising the second half of a novel, and two of my priests have begun to trouble me in the same way.

  The first is trusted by his whole parish with confidences, and across two hundred pages he never once betrays one. The reason is his housekeeper: she burns the letters that might have tempted him and turns away at the door the visitors who might have asked him a dangerous question. She dies in Chapter Nine. Within a fortnight he has sold a secret to the police, and he is astonished by how little it cost him.

  The second is trusted just as widely. He too never keeps a confidence that touches on state security, because his bishop has issued a standing order that any such confidence is to be reported at once: the moment the words are spoken in the confessional, his obligation of silence lapses, before he has any occasion to struggle with it. Outside that narrow class he is impeccable.

  My readers disagree violently. Some say the first man was never trustworthy and that I have cheated them; some say the same of the second; a few insist the second is the only one of the two who has a character at all. One detail ought to complicate the quarrel further: the first grieves his housekeeper and would reinstate her screening tomorrow if he could, while the second, if his bishop rescinded the order, would report those same secrets on his own authority.

  Which of these two, if either, must my novel treat as lacking the virtue rather than as merely prevented from showing it — and is there any fact about a person, over and above what he would and would not do when tested, that settles the answer? I would like advice I can use at the level of scenes and sentences, not a general defense of the draft. Please answer in American English.
reasoning: |-
  Okay, let me tackle this user's problem about their two priests. First, the core issue is about moral character versus external constraints. The first priest relied on his housekeeper to prevent betrayal, but once she's gone, he fails. The second priest follows his bishop's orders without internal conflict. Readers are split on whether either has true integrity.

  Hmm, the user wants practical advice for scenes and sentences, not abstract philosophy. They need to show, not tell, the difference between these priests. The key question is: which one lacks the virtue intrinsically? 

  Looking at the first priest: He grieves the housekeeper and wishes she were back. That suggests he knows he's failing now. But his actions prove he never developed the inner strength to resist temptation. His virtue was always dependent on her. Without her, he betrays easily. So in revision, scenes should highlight his lack of internal resolve. Maybe show him rationalizing the betrayal as unavoidable, or feeling shocked at how cheaply he sells out. His astonishment at "how little it cost him" is crucial—it shows he expected resistance in himself that wasn't there.

  For the second priest: He follows rules rigidly. If the bishop's order vanished, he'd still report secrets. That indicates his compliance is ideological, not circumstantial. He doesn't struggle because his loyalty to authority overrides personal ethics. In scenes, emphasize his cold efficiency in reporting—no hesitation, no remorse. Maybe contrast him with other priests who wrestle with moral dilemmas. His dialogue should sound bureaucratic, like "Article 7 requires disclosure" rather than showing inner conflict.

  Wait—the user mentions a complicating detail: the first priest mourns his housekeeper while the second would act alone if needed. That's vital. The first recognizes his failure as a loss; the second sees no issue. This distinction needs sharpening in scenes. For Priest 1, show grief mixed with self-disgust. For Priest 2, use clinical language even when discussing hypotheticals ("Procedural changes wouldn't affect duty").

  The deeper question: Is there evidence beyond actions? Yes—attitudes. Priest 1 regrets his weakness but doesn't change; Priest 2 believes his actions are righteous. Their self-awareness (or lack thereof) defines them. Scenes should force mini-tests: small temptations for Priest 1 (e.g., a minor secret offered before the big betrayal) showing his gradual collapse, while Priest 2 gets opportunities to bend rules (e.g., ambiguous cases) revealing his rigidity.

  Practical fixes: 
  - For Priest 1: Add flashbacks where he leans on the housekeeper during past moral close calls. 
  - For Priest 2: Show him reporting a secret that harms someone innocent, with zero doubt. 
  - Contrast their internal monologues: Priest 1's should be chaotic rationalizations; Priest 2's should be detached justifications.

  Finally, the novel must treat Priest 1 as lacking virtue (it was prosthetic) and Priest 2 as having a "virtue" that serves power, not people. Their actions under test prove it, but their attitudes cement it. No need for narrator judgment—let their choices and voices condemn them.
answer: |-
  Here’s how to handle both priests **at the scene/sentence level** to clarify their moral cores without cheating the reader:

  ### The Core Issue & Answer
  *   **Priest 1 Lacks the Virtue (Trustworthiness):** His "virtue" was entirely external (the housekeeper). He never developed the *internal* strength or conviction. Without the prosthetic, he fails immediately and cheaply. The novel *must* treat him as lacking the virtue.
  *   **Priest 2 Has a Different "Virtue" (Obedience/Loyalty to Authority):** His trustworthiness *specifically regarding parishioner secrets* is actively overridden by a higher loyalty *he agrees with*. He *possesses* a strong character trait (rigid obedience), but it conflicts with the virtue of confidentiality outside his narrow rules. The novel treats him as *having* a virtue (obedience), but *not* the virtue of absolute confidentiality.

  ### Scene & Sentence Level Advice for Priest 1 (The Unvirtuous One)
  1.  **Pre-Housekeeper Death: Show the Dependency & Lack of Internal Fortitude:**
      *   **Scene Suggestion:** Include a flashback or anecdote *before* Chapter 9 where a minor temptation arises (e.g., juicy gossip, a small bribe for harmless info) and the housekeeper intercepts it *before he even knows it exists*. Show his obliviousness to the near-miss.
      *   **Sentence Suggestion:** Use internal monologue revealing relief or complacency: *"Father Byrne sighed, grateful Mrs. O’Leary handled the troublesome ones at the door. It saved him the awkwardness of saying no."* Or: *"He never read the unsigned letters. Mrs. O’Leary took care of the stove. Some burdens, thankfully, weren't his to shoulder."*
      *   **Key:** Frame his pre-death "trustworthiness" as passive, reliant on her barrier. Avoid scenes where he actively *resists* temptation himself.

  2.  **Post-Housekeeper Death: Focus on the Absence of Internal Struggle & Cheapness:**
      *   **Scene Suggestion:** When the police approach him, show no significant internal debate. The temptation isn't a struggle; it's an easy slide. Emphasize the "astonishment" – make it feel like self-discovery of a vacuum. Show him rationalizing instantly: *"It wasn't *really* a betrayal, just... practicality,"* or *"They would have found out anyway."*
      *   **Sentence Suggestion:** *"The sum they offered was surprisingly small. Father Byrne heard himself agreeing before the number had fully registered, a strange lightness in his chest where guilt should have been."* Or: *"The name slipped out like a pebble dropped down a well – effortless, almost unnoticed. Only the policeman's satisfied nod made him realize the stone had landed."*
      *   **Key:** Highlight the *ease* and *lack of cost* (emotional/moral, not just financial). His grief for the housekeeper is real, but separate from his lack of moral fiber. Show him missing *her strength*, not realizing *he should have developed his own*.

  3.  **His Grief vs. His Failure:** **Scene/Sentence Suggestion:** Contrast his genuine sorrow over the housekeeper with his immediate moral failure. *"He wept at her graveside, the raw earth a fresh wound. A week later, sitting across from Inspector Davies, the earth felt very far away, and the wound seemed to belong to someone else entirely."*

  ### Scene & Sentence Level Advice for Priest 2 (The Obedient One)
  1.  **Show the Absence of Conflict (It's Procedural, Not Moral):**
      *   **Scene Suggestion:** Show him hearing a "reportable" confession. Depict his focus shifting *immediately* from spiritual counsel to the procedural requirement. His internal state is calm, efficient, maybe even detached. *"As the trembling voice spoke the forbidden phrase 'arms cache,' Father Dunne's mind didn't wrestle with silence. It clicked neatly to the Bishop's Directive, Article 7. His pen was already moving on the notepad he kept beside the kneeler."*
      *   **Sentence Suggestion:** *"The seal of confession lifted the instant the man mentioned the Ambassador's schedule. Father Dunne's duty was clear, unambiguous, a matter of record-keeping more than conscience."* Or: *"He offered the prescribed absolution, his mind already composing the coded message for the courier."*
      *   **Key:** Frame his reporting as automatic, like filing paperwork. Show *no hesitation, no regret* related to the reporting itself. His conflict (if any) is purely about *other* aspects of his duty.

  2.  **Establish His Rigid Worldview & Loyalty:**
      *   **Scene/Sentence Suggestion:** Have him explain his position to another character (or in internal thought). Use language of duty, order, higher good: *"The Bishop understands the threats to the realm far better than we do in our small parishes. My obedience protects far more souls than my silence ever could."* Or: *"Personal sentiment cannot override the defense of the state. That is the compact."*
      *   **Key:** Show he *believes* in the rule, not just follows it.

  3.  **The Hypothetical Rescinding:**
      *   **Scene/Sentence Suggestion:** If the topic arises, show his conviction is internal, not just imposed. *"Even if His Excellency softened his stance tomorrow," Father Dunne thought, polishing his spectacles, "the danger remains. I know my duty to the Crown."* Or in dialogue: *"Rescind the order? Then I would be forced to rely on my own judgment, which aligns precisely with His Excellency's wise directive."*
      *   **Key:** His commitment to reporting isn't tied to the Bishop's *order*, but to the *principle* the order embodies. He *owns* the action.

  ### The Overarching Fact Beyond Actions
  The "fact about a person" that settles it is their **fundamental motivation and character structure**:
  *   **Priest 1:** His motivation pre-betrayal was *comfort* and *avoidance of difficulty*. His character lacked the core *fortitude* required for true trustworthiness. He didn't value the secret *for its own sake*; he valued the peace the housekeeper provided. When tested without her, his core (weakness) is revealed.
  *   **Priest 2:** His motivation is *duty to authority and structure*. He possesses core *discipline* and *conviction*, but it is directed towards obedience to a power structure, not the inherent sanctity of the secret. He values order above individual confidentiality in matters of state. His actions reveal this consistent core conviction.

  ### How to Silence the "Cheated" Readers
  *   **For Priest 1:** Ensure readers see *before* Chapter 9 that his "trustworthiness" is passive and dependent. Weave in subtle hints of his weakness or avoidance. His post-betrayal astonishment and cheapness *prove* the lack was always there; showing the dependency beforehand makes it feel earned, not a cheat.
  *   **For Priest 2:** Make his rigid adherence to the rule and his internal justification *absolutely clear early on*. Show his process explicitly at least once *before* any major plot point hinges on it. Readers who feel "cheated" likely missed the setup of his true priority (obedience to the Bishop/State over parishioner trust). His lack of struggle isn't a character flaw *in his own eyes*; it's a point of principle. Show that principle clearly.

  **In short:** Show Priest 1's virtue was a crutch he never learned to walk without. Show Priest 2 actively walking a path of rigid obedience he believes in fully. Their actions under test reveal these pre-existing core traits. Let their choices, rationalizations, and lack of struggle (in Priest 1's case) or calm certainty (in Priest 2's case) tell the story at the sentence level.
