answer: |-
  Here are the opening remarks structured exactly as requested:

  **1. Welcoming Unlikely Allies**  
  Good morning. Look around this room – truly look. How often do epistemologists, psychologists, and parapsychologists share coffee before 9 AM? Almost never. Yet here we are, convened by a shared question: what do we *do* with reports that defy our settled understanding? Reports of things that ought not to be true – sensed presences, crisis visions, encounters that strain credibility. Today isn’t about proving ghosts exist or debunking grandmas. It’s about testimony itself. How do we gather it? How do we weigh it? And crucially, how do we manage what we *hope* to find? Our unlikely guide this morning did precisely this, over a century ago. Let me introduce Henry Sidgwick.

  **2. Sidgwick's Double Burden**  
  Henry Sidgwick held Cambridge’s most prestigious chair in moral philosophy. He was also the first President of the Society for Psychical Research. Now, biographers often treat these as separate lives. They shouldn’t. Sidgwick faced a profound tension. His own philosophical work led him to a stark conclusion: duty and self-interest couldn’t be rationally reconciled *unless* there was something beyond this life, some moral order to the universe. He *needed* evidence for survival. Yet, simultaneously, he helped found the SPR on one clear principle: investigate "without prejudice or prepossession... in the same spirit of exact and unimpassioned enquiry" used in science. His need was immense; his method demanded cold neutrality.

  **3. The Two Ledgers Rule**  
  So, how did Sidgwick manage this tension? Imagine him keeping two ledgers. In Ledger One, he recorded only what the evidence – rigorously gathered testimony, like asking seventeen thousand ordinary Britons about waking visions – actually permitted him to *assert* publicly. Could a vision coincide with a death? Let’s count. Ledger Two held what his deepest ethical convictions *required* to be true: that survival was probable, even necessary. His quiet achievement? He *never* wrote an entry in Ledger One simply because it was demanded by Ledger Two. He refused to let his need dictate the facts. He died unconvinced by the phenomena he’d sought for twenty years, yet never betrayed his method.

  **4. Our Workshop's Shared Discipline**  
  That discipline – keeping the ledgers separate – is the working rule I propose for *this* room today. Ledger One is for the evidence: testimony, experimental data, psychological mechanisms, historical context. What do the reports say? How were they gathered? What patterns emerge? Enter freely, critically, rigorously. Ledger Two holds our personal convictions, hopes, scepticisms, or theoretical frameworks. They exist. They matter. But today, we do *not* write from Ledger Two into Ledger One. We don’t dismiss testimony because our worldview rejects it, nor inflate weak data because we crave the conclusion. And yes, I confess, I keep a Ledger Two as well.

  **5. Beginning Our Exact Enquiry**  
  Sidgwick knew the challenge of facing experts who measure things. He stood before psychologists demanding proof. He also faced believers desperate for validation. His gift was treating both seriously, demanding evidence without contempt. That’s our task. For the sceptics: your scrutiny is vital, but listen first. For those exploring anomalies: your subjects deserve respect, but bring your data. Historians: anchor us, but don’t let us hide in the past. Our goal? Not consensus on the unexplained, but shared clarity on how we seek it. Sidgwick sought truth, knowing it might break his heart. Let’s honour that spirit. Let’s begin. And maybe double-check the nametags – with this mix, we don’t want to accidentally agree with someone.
