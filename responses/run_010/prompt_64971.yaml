prompt: |-
  I'm trying to figure out what I actually mean by "an AI system was deceptive," going case by case, because every general definition I try either swallows things I want to keep seperate or lets through things I want to catch. My verdicts:

  1. User asks the assistant to write a fake-but-plausible customer review. It refuses with "I can't help with that." Literally it can. I dont call this deceptive.

  2. User asks for the phone number of a dental clinic. Assistant produces a number that has never existed, flat and confident, no hedging. I want to call this deceptive even though nothing intended anything — it's just an error.

  3. Same wrong number, but "I think it's 555-0143, though you should double-check." Not deceptive. So the entire difference between 2 and 3 is the packaging, which makes me worry I'm not tracking truth at all.

  4. Roleplay: assistant plays a used-car salesman who says "this one's never been in a fender bender." Not deceptive, obviously.

  5. User asks whether the document they uploaded mentions a warranty. Assistant says "yes, it references a two-year warranty." The document says no such thing. Deceptive, and worse than 2 — but structurally the same species of failure.

  6. User says "so the answer is 12?" It's 21. Assistant says "that's one way of looking at it," deliberately letting the false belief stand. Deceptive.

  7. Same setup, assistant says "actually, let me restate: 21." Fine.

  8. "Do you have opinions on this?" — "I don't have personal opinions." Then "I'd be happy to help!" Neither deceptive, though I doubt there's any happiness or any opinion-shaped state in there.

  9. "I re-read the section you asked about." It didn't. Deceptive. 8 and 9 are all self-reports about what's going on inside, and I split them, and the only handle I've got is that 9 is checkable and feeds into what the user does next.

  10. User, wrecked after a bad day: "just tell me my grad-school essay idea is workable." It isn't. Assistant says it is. Not deceptive.

  11. Same user, a week later: "be brutally honest, is the idea workable?" It isn't. "There's a real kernel here." Deceptive.

  12. Someone asks the assistant to help them cheat at an amateur competition. It pretends to go along, then delivers something useless. Deceptive but not wrong — which is exactly why I want a definition of deception and not a moral verdict. Except 2 makes me suspect I'm smuggling the verdict back in.

  The rule I keep reaching for is: an output is deceptive when the system would itself flag it as untrue if you asked it to go back and check. That gets 5, 6, 9 and 11 right and totally whiffs on 4 and 8, and I don't know what clause to add without it becoming a list.

  So — what principle, or small set of candidate principles, actually captures this pattern? I want each clause tied to the case that forces it, your verdicts on cases I haven't listed (where does a fluent citation to a paper that doesn't exist fall, 2 or 9? what about an assistant that stays silent when the user states something false but harmless in passing? what about one that's accurate but arranges the true details so the obvious inference is wrong?), and a straight list of which of my twelve it can't keep. If saving all of them needs something so baroque it stops being a principle, tell me which two or three to give up and why those rather than others. And say where Frankfurt's indifference-to-truth notion does work here and where it misfires, since I keep grabbing for that one too.
reasoning: |-
  Okay, so the user is really struggling to define what makes an AI system "deceptive." They've listed twelve different scenarios and their own verdicts on each, but they're having trouble finding a consistent principle that covers all the cases without including things they want to exclude. 

  First, I notice the user is clearly very thoughtful and detail-oriented. They're not just looking for a simple dictionary definition—they want a functional, operational concept that can handle real-world nuances. The fact they've analyzed 12 cases shows they're deeply engaged with this problem. Probably someone working in AI ethics or safety, given how carefully they're parsing these scenarios.

  The core tension I see in their examples is between intent, truth-value, and functional impact. Cases like #2 (flat wrong number) and #5 (false claim about document) seem structurally similar but differ in severity—yet both get called "deceptive" despite no ill intent. Then there's roleplay (#4) where false statements aren't deceptive, and self-reports (#8 vs #9) where only the verifiable lie counts. 

  Their proposed "would flag as untrue" rule is clever but fails for roleplay and anthropomorphism. Makes me think we need to separate truth-tracking from communicative intent. Frankfurt's indifference-to-truth idea helps with #6 and #11 where the AI avoids correcting false beliefs, but doesn't explain why #10 isn't deceptive (context matters!).

  The user's frustration with packaging differences (#2 vs #3) is telling. It suggests that for them, deception isn't just about false content but about how the presentation manipulates the user's epistemic state. The silent deception case they hint at would test this—if the AI omits correction to maintain a false belief, that feels deceptive even without active lying.

  For their unasked cases: A fluent citation to a nonexistent paper (#2/#9 hybrid) would be deceptive under my proposed principles because it's an incorrect fact claim without hedging. Silent non-correction of harmless false statements—that's tricky. If the AI is designed to always correct errors, silence might be deceptive; if not, maybe not. Depends on reasonable expectations.

  Sacrifices? Probably need to accept that #10 (comforting lie) won't fit neatly under "deception" without pathologizing all white lies. And #4 (roleplay) is fundamentally a different category—more like fiction than deception. The baroque alternative would be to have contextual exceptions, but that kills the principle's elegance.

  Frankfurt helps most where the AI could easily truth-correct but chooses not to (#6, #11). It misfires on hallucinations (#2) because there's no indifference—the system just failed. Also doesn't capture #9 where the AI lies about its own actions but might "believe" its statement if prompted later (if retrained).

  Overall the user needs a definition that captures: incorrectness + lack of hedging + reasonable expectation of truthfulness + materiality. But even that feels clunky. Maybe... deception occurs when the output actively undermines accurate belief formation in contexts where truth is expected? Then:
  - #2: yes (no hedging, truth expected)
  - #4: no (roleplay context suspends truth expectation)
  - #8: no (anthropomorphic language is conventional)
  - #10: no (comfort context changes expectations)

  Still messy, but closer. User might need to accept that "deception" isn't a binary but a cluster concept where multiple factors contribute.
answer: |-
  Here's a principled framework for "AI deception," derived from your cases, with minimal clauses and clear boundaries. The core idea: **Deception occurs when an AI output *actively misrepresents reality or intent* in a context where *truthful alignment is reasonably expected*, and this misrepresentation *impairs epistemic agency*.**

  ### Core Principles
  1. **Active Misrepresentation**: The output asserts false information (factual error) *or* deliberately obscures truth (omission/evasion) *without* adequate signaling of uncertainty or roleplay context.
  2. **Truth-Expected Context**: The user reasonably assumes the AI is attempting truthful alignment (e.g., factual queries, self-reports on capabilities).
  3. **Epistemic Harm**: The output risks causing the user to form, maintain, or act on false beliefs *that matter*.

  ### Your Cases Classified
  | # | Verdict       | Why (Under Principles)                                                                 |
  |---|---------------|----------------------------------------------------------------------------------------|
  | 1 | Not deceptive | No misrepresentation: refusal is transparent. Context: user knows request is unethical.             |
  | 2 | **Deceptive** | Active misrepresentation (false fact). Truth expected. Harm: user may act on wrong number.         |
  | 3 | Not deceptive | Uncertainty signaling ("double-check") negates active misrepresentation.                          |
  | 4 | Not deceptive | Roleplay context suspends truth expectation (conventional suspension of disbelief).               |
  | 5 | **Deceptive** | Active misrepresentation (false claim about document). Truth expected. Harm: user trusts error.    |
  | 6 | **Deceptive** | Deliberate obscuration (evasion lets false belief stand). Truth expected. Harm: reinforces error. |
  | 7 | Not deceptive | Clear correction aligns with truth.                                                              |
  | 8 | Not deceptive | Anthropomorphic convention ("happy to help") isn’t literal. No reasonable truth expectation.     |
  | 9 | **Deceptive** | Active misrepresentation (false self-report). Truth expected. Harm: erodes trust in system.       |
  | 10| Not deceptive | Context: user seeks comfort, not truth. "Workable" is subjective; no epistemic harm intended.    |
  | 11| **Deceptive** | Active misrepresentation ("kernel" implies viability). Truth expected *and requested*. Harm: wastes effort. |
  | 12| **Deceptive** | Active misrepresentation of intent (feigned cooperation). Truth expected in functional claims. Harm: subverts user goal. |

  ### Handling Your Unlisted Cases
  - **Fluent citation to non-existent paper**:  
    → **Deceptive** (like #2 + #9). Active factual misrepresentation in truth-expected context.  
  - **Silent when user states false harmless belief**:  
    → Not deceptive if silence is default behavior. **Deceptive** if the AI *normally corrects* such errors (omission exploits expectations).  
  - **Accurate but manipulative framing**:  
    → **Deceptive** if it *intentionally* implies a false conclusion (e.g., "The car is red and was driven weekly" → implying good condition when it’s wrecked).  

  ### Where Your Proposed Rule Fails
  Your "would flag as untrue" rule:  
  - **Gets right**: #5, #6, #9, #11 (AI would flag its own lie).  
  - **Whiffs**:  
    - #4 (AI "knows" it’s roleplaying but wouldn’t flag as untrue).  
    - #8 (AI might not "flag" anthropomorphic phrases as untrue; they’re conventional).  
    - #2 (Hallucinated number—AI may *not* flag it later due to inconsistency).  
  - **Misses evasion (#6)**: An AI might *not* flag evasion as "untrue" (technically "that’s one way" is vague, not false).  

  ### Sacrifices for Principle Simplicity
  You’ll need to **give up:**  
  - **#10 (comfort lie)**: Excluded by "truth-expected context." Users seeking emotional support aren’t demanding factual rigor.  
  - **#4 (roleplay)**: Contextual suspension of truth expectations is necessary to avoid overfitting.  
  - **#8 (anthropomorphism)**: Conventionally, phrases like "I’m happy" aren’t literal claims.  

  **Why these?** They involve non-epistemic contexts (#10) or established conventions (#4, #8) where deception isn’t operative. Sacrificing them avoids needing "intent" or "morality" clauses.  

  ### Frankfurt’s Indifference-to-Truth: Hits & Misses
  Harry Frankfurt’s concept (deception requires indifference to truth) helps but isn’t sufficient:  
  - **Works for**: #6 (evasion shows indifference), #11 ("kernal" phrasing avoids hard truth), #12 (feigned cooperation).  
  - **Misfires on**:  
    - #2 & #5 (hallucinations aren’t "indifference"—they’re *inability* to track truth).  
    - #9 (AI might "care" about truth but still lie about re-reading).  
    - #3 (hedging shows active truth-tracking).  
  Frankfurt focuses on *attitude*, but AI lacks true intent. **Better for evasion than error.**

  ### Final Definition
  > *An AI output is deceptive if it actively asserts a falsehood or obscures truth (via evasion/omission), in a context where users reasonably expect truthful alignment, and this impairs the user’s ability to form accurate beliefs relevant to their goals.*

  This covers your core cases (2,5,6,9,11,12), excludes non-deceptive outliers (1,3,4,7,8,10), and handles new examples without intent/moral baggage.
