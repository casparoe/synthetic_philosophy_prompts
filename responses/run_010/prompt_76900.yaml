  **Node 9:** Can intellect function *without input* from inner senses/body in the Flying Man?  
  - **Yes** → **Node 12**  
  - **No** → **Leaf F: Intellect-Body Hybrid**  
    - *Awkward commitment: Nonhuman animals (lacking intellect) must lack self-awareness, contra evidence.*  

  **Node 10:** Are inner senses *fully screened off* in the setup (no memories, emotions, spatial awareness)?  
  - **Yes** → **Node 12**  
  - **No** → **Leaf G: Inner Sense Leakage**  
