  ### Notes on Unoccupied Corners and Inseparable Leaves  
  1. **Unoccupied corners:**  
     - **Eliminative + Embodied processes + Screening successful (Node 6 → Node 8 → Embodied processes → Node 11 → Yes):** Incoherent. If awareness is embodied, screening *must* fail (contra setup), but Node 11 "Yes" assumes nonphysical embodiment. Unoccupied as self-contradictory.  
     - **Self-luminosity + Occurrent thisness + Intellect (Node 5 → Self-luminosity → Node 8 → Intellect → Node 9 → Yes → Node 12 → Non-inferential):** Unattractive. Self-luminosity typically implies a substantive self (not occurrent); pairing it with minimal awareness is unmotivated.  
     - **Persisting self + Embodied processes + Screening successful (Node 4 → No → Node 5 → Any → Node 8 → Embodied processes → Node 11 → No):** Unexplored. Embodied accounts (e.g., enactivism) reject persisting substances, making this unstable.  

  2. **Inseparable leaves (lumped):**  
     - **Fragile Self-Luminosity (Leaf E) and Elimination Failure (Leaf D):** Cannot reliably distinguish via tree. Both are "argument undermined" positions relying on empirical counters. Grouped as **Empirical Defeat**.  
     - **Bodily-Dependent Persistence (Leaf C) and Embodied Reductionism (Leaf H):** Both collapse self to body; differences in persistence are marginal. Grouped as **Bodily Anchoring**.  

  3. **Unbranchable ambiguity:**  
     - Avicenna’s "estimation" (wahm) is ambiguously screened off. Node 10 forces a choice, but in scholarship, it’s contested. Positions relying on "inner senses" (e.g., **Inner Sense Leakage**) inherit this vagueness.  

  4. **No-threat branches:**  
     - Deafferentation (Node 12 → Leaf J): Threat is specific to substance dualism’s need for immateriality.  
     - Infant development (Node 12 → Leaf K): Threat is to individuation difference’s primacy.  
     - Split-brain (Leaf E/L): Threatens unity of self in luminosity/direct knowledge.  
     - Depersonalization (Node 7 → Leaf E): Directly targets luminosity’s "invulnerability."  
     - Phantom limbs (Node 11 → Leaf H/I): Challenges embodied accounts in screening.  
     - Nonhuman animals (Node 9 → Leaf F): Counters intellect-dependence.
