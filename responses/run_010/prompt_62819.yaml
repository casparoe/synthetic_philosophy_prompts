prompt: |-
  I spent most of last night arguing with a former labmate of mine — we overlapped for two years in an interpretability group, and he has since gone into building internal-state monitors for deployed models while I stayed on the circuits side — and what I want is not a reconstruction of the argument but the document the two of us should have produced at the end of it. Our fight was over a question that sounds like a piece of trivia until you actually try to answer it: what makes two computations inside a model the *same mechanism*? His position, which I will call the localist one, is that a mechanism is a subgraph — a particular set of attention heads and MLP units together with the edges among them and the weights that configure those edges — and that two computations run through the same mechanism only if they are mediated by substantially the same subgraph, as established by interventions: patch the units in and out, ablate them, and check that the behavior tracks them. On this view the mechanism is where the computation physically happens, and anything else is just a description of it. My position, which I will call the functionalist one, is that a mechanism is a role specified by a counterfactual profile — a mapping from an equivalence class of inputs to outputs, with a stated dependence structure in between — which can be realized by different units, different weights, or arguably different architectures; on this view two computations run through the same mechanism if they realize the same function at the same level of specification, whatever happens to realize it. What I take to be decisive for my side, and what he thinks is a verbal maneuver, is multiple realizability inside a single set of weights: redundant copies of a function, features smeared across directions in superposition, a neuron whose ablation does nothing because a partner picks up the slack. Under his criterion the partner neuron is not part of the mechanism and the redundant copy is a different mechanism, which seems to me to make mechanism identity track facts that no one cares about; under mine, he says, "same mechanism" becomes so coarse that it stops predicting anything about what will happen when you intervene.

  Draft the joint statement that he and I could both sign after a serious adversarial collaboration. I want, first, a numbered section of agreed claims: what both camps accept about how models compute, about what activation patching and ablation can and cannot license, about the canonical cases that we both kept reaching for — induction-head-like behavior turning up in different heads and different layers across independently trained runs; a model that gets the right answer on-distribution through the circuit we identified and off-distribution through something that looks like a shortcut or a memorized pattern; continued fine-tuning that shifts which units matter while the trained behavior persists — stated so that neither of us has to swallow a formulation the other wrote. Second, a disagreements table with at least four rows, each giving the issue, the localist formulation, and the functionalist formulation, where each side's wording is one that side would accept as its own view rather than a straw man, plus a column marking whether the row is substantive or verbal. Third, the cruxes: the sub-questions such that settling them would actually move one of us. I suspect at least three are live, and you should feel free to propose others — whether causal dependence on a unit is necessary for that unit to count as part of the mechanism; whether mechanism identity is relative to an input distribution, so that the mechanism can change while the weights stay fixed; whether identity can be transitive across separately trained models at all, and if so at what level of description; and, the one that matters most for his day job, whether establishing that the internal mechanism is unchanged licenses any prediction about behavior that establishing unchanged behavior on a probe set does not. For each crux, give a concrete test, experiment, or case that both of us would agree bears on it — describe it at the level of what is patched, what is held fixed, what distribution is used, what is measured — and record each side's prediction in advance, including the prediction that would count as a loss. If some test is one of us would refuse to treat as decisive, say so and say why.

  Two constraints on the deliverable. Do not adjudicate: I have read enough summaries that quietly pick a winner, and the point of this exercise is that neither of us is going to be converted by a paragraph. And do not pad it with references — no reading list, no bibliography, no gesture toward papers by name; where a technique matters, describe what it does rather than cite who did it. Beyond that, be specific where it is easy to be vague. I want the agreed claims to be things we could actually disagree with, not platitudes about neural networks being complicated; I want the table's two columns to be genuinely asymmetric, so that swapping them produces something obviously wrong; and I want at least one place where you tell us plainly that a dispute we both thought was deep is a disagreement about what the word is for, with the reasoning that shows it. Close with the single sentence you think he could sign that commits him to the most, and the single sentence I could sign that commits me to the most.
reasoning: |-
  We are drafting a joint statement after an adversarial collaboration between two researchers: one with a "localist" view (mechanism as a physical subgraph) and one with a "functionalist" view (mechanism as a functional role). The goal is to capture both agreement and disagreement without adjudicating.

  ## Section 1: Agreed Claims

  Both parties agree on the following points:

  1. **Computation in Neural Networks**: Neural networks perform computations through the interaction of units (e.g., neurons, attention heads, MLP layers) connected by weighted edges. These computations are deterministic given the weights and input.

  2. **Role of Interventions**: Activation patching and ablation are valid experimental techniques for probing model behavior. Patching (replacing activations) can reveal causal dependencies, and ablation (setting activations to zero or noise) can reveal functional importance. However, both techniques have limitations: they may not capture the full computational story, and their effects can be context-dependent.

  3. **Multiple Realizability in Separate Models**: Independently trained models can exhibit similar behaviors (e.g., induction heads) realized by different physical subgraphs (e.g., different layers, different heads). This is uncontroversial and does not require the mechanisms to be physically identical.

  4. **Robustness and Redundancy**: A model may achieve the same behavior through multiple pathways. This includes:
     - **Redundancy**: Multiple units (or subgraphs) capable of performing the same function, such that ablating one does not change the output because another compensates.
     - **Superposition**: A single unit (or direction) representing multiple features, such that ablating it affects multiple behaviors.
     - **Fine-Tuning Stability**: After fine-tuning, the model's behavior may persist even when the importance of specific units (as measured by ablation) changes, indicating that the function is preserved while the physical realization shifts.

  5. **On-Distribution vs. Off-Distribution Behavior**: A model may rely on a specific circuit for on-distribution inputs but use a different (e.g., memorized or heuristic) pathway for off-distribution inputs. This does not necessarily imply that the "core mechanism" has changed, but it highlights the context-dependence of computation.

  6. **Levels of Abstraction**: Descriptions of model computation can be given at different levels of abstraction (e.g., weights, activations, functions). Both parties agree that no single level is the "only true" description, but they differ on which level is most appropriate for identifying mechanisms.

  ## Section 2: Disagreements Table

  | Issue | Localist Formulation | Functionalist Formulation | Substantive or Verbal? |
  |-------|----------------------|----------------------------|------------------------|
  | **Definition of Mechanism** | A mechanism is a physically localized subgraph (a set of units and edges with specific weights) that mediates a computation. | A mechanism is a functional role defined by a counterfactual input-output profile and internal dependence structure, realizable by multiple physical substrates. | Substantive |
  | **Identity Conditions** | Two computations are the same mechanism iff they are mediated by substantially the same physical subgraph, as verified by interventions (e.g., patching or ablation shows consistent causal dependence). | Two computations are the same mechanism iff they realize the same function (with the same input-output mapping and internal causal dependencies) at a specified level of abstraction, regardless of the physical realization. | Substantive |
  | **Scope of Mechanism Identity** | Mechanism identity is tied to the physical instantiation in a specific model; it cannot be meaningfully applied across models with different weights. | Mechanism identity can hold across models (even with different architectures) if they implement the same function in a relevantly similar way. | Substantive |
  | **Role of Input Distribution** | The mechanism is defined relative to the model's weights and architecture; it does not change with the input distribution. The same mechanism may be activated differently on different inputs. | The mechanism is defined relative to a specified input distribution; if the function realized changes with the input distribution, then the mechanism is different. | Substantive |
  | **Handling Redundancy** | If a unit is ablated and the behavior persists due to compensation by another unit, the compensating unit was not part of the original mechanism; it is a distinct mechanism that has taken over. | If a unit is ablated and the behavior persists due to compensation, the mechanism is the functional role that both units (and possibly others) can realize; the mechanism is the same, but the physical realization has shifted. | Substantive |
  | **Multiple Realizability in One Model** | Redundant copies within a model are distinct mechanisms because they are physically distinct; they may perform the same function, but they are not the same mechanism. | Redundant copies within a model are the same mechanism because they realize the same function; the mechanism is the function, not the physical instance. | Substantive and partially verbal (see below) |
  | **Verbal Disagreement Example** | When we say "the mechanism is broken", we mean that a specific physical component has been altered. | When we say "the mechanism is broken", we mean that the function is no longer being performed. | Verbal (disagreement about word usage, not underlying facts) |

  Note on a verbal disagreement: The last row highlights a case where the dispute is primarily about language. Both agree that altering a physical component can break a function and that a function can break without altering a specific physical component (e.g., via compensation). The disagreement is whether the term "mechanism" refers to the physical part or the function.

  ## Section 3: Cruxes

  For each crux, we describe a concrete test and record predictions.

  ### Crux 1: Is causal dependence on a unit necessary for that unit to count as part of the mechanism?
  - **Test**: 
     - **Model**: A model with two redundant units (A and B) such that, when both are present, they contribute equally to a function F. On a distribution D, ablating either unit alone does not change the output (because the other compensates), but ablating both breaks F.
     - **Intervention**: We ablate unit A and observe that F is preserved (due to B). Then we ablate unit B and observe that F is preserved (due to A). 
     - **Question**: Is unit A part of the mechanism for F when unit B is intact?
  - **Localist Prediction**: No. When B is intact, ablating A does not affect F, so A is not causally necessary and thus not part of the mechanism. The mechanism for F includes only the units that are causally necessary in a given context (which might change with the ablation state). In the intact model, both A and B are part of a larger mechanism, but they are distinct sub-mechanisms that can compensate.
  - **Functionalist Prediction**: Yes. The mechanism is the functional role F, which is realized by the network including both A and B. Both are part of the mechanism because they can each realize F. Ablation shows redundancy, not absence from the mechanism.
  - **Decisive?**: Both might agree that this test reveals a difference in what they mean by "part of the mechanism". The localist might argue that the test shows A is not necessary, while the functionalist argues that it shows A is part of a redundant implementation. This crux may not be fully decisive because it relies on prior commitments.

  ### Crux 2: Does mechanism identity depend on the input distribution?
  - **Test**:
     - **Model**: A model that, on distribution D1, uses a circuit C1 to compute function F, but on distribution D2 (e.g., out-of-domain inputs), uses a different circuit C2 to compute the same function F (or a similar one).
     - **Intervention**: We fix the weights and measure the circuit used (via activation patching) on D1 vs D2. We confirm that for inputs from D1, patching in activations from C1 changes the output, but patching in C2 does not; and vice versa for D2.
     - **Question**: Is the mechanism the same when the model processes D1 and D2?
  - **Localist Prediction**: The mechanism is the same because the weights are fixed. The model uses different pathways (C1 and C2) for different inputs, but the underlying physical structure (the weights) hasn't changed. The mechanism is the set of available pathways, and it remains the same.
  - **Functionalist Prediction**: The mechanism is different because the function is realized by a different causal structure (C1 vs C2) for D1 vs D2. The mechanism is defined by the actual computation performed, which is input-dependent.
  - **Loss Condition**: If it turns out that the model uses the same physical subgraph for both distributions (which we set up not to be the case), both would agree the mechanism is the same. The disagreement is when the physical subgraph changes.
  - **Decisive?**: This test might not fully resolve the issue because the localist might argue that the mechanism is the entire network, while the functionalist focuses on the active subgraph. However, it highlights a core difference.

  ### Crux 3: Can mechanism identity hold across separately trained models?
  - **Test**:
     - **Models**: Two independently trained models (same architecture) that both perform function F (e.g., induction). We identify the circuit in each model (via patching/ablation) and find they use different heads/layers.
     - **Intervention**: We transplant the subgraph from Model 1 (say, a set of heads) into Model 2 by replacing the corresponding weights. We then test whether the transplanted model behaves like Model 1 or Model 2 on a set of inputs that require F.
     - **Measurement**: We compare the output of the transplanted model to the original models and check if the function F is preserved and whether it now uses the transplanted circuit.
  - **Localist Prediction**: The transplant will not work as expected because the mechanism is embedded in the entire network. The behavior of the transplanted model will be degraded or altered because the mechanism is not just the subgraph but its integration with the rest of the model. Thus, mechanism identity cannot hold across models.
  - **Functionalist Prediction**: If the function F is the same, then the mechanism is the same. The transplant might work if the functional role is preserved, but even if it doesn't, that doesn't negate functional identity; it might show that the realization is context-dependent. However, the functionalist would predict that if the transplant works, it supports their view, but if it doesn't, it doesn't necessarily refute it (because the function might be realizable in multiple ways).
  - **Loss Condition**: The localist would consider it a loss if the transplant works perfectly and the model behaves exactly as if the mechanism were the same. The functionalist would consider it a loss if, after showing that the function is the same, the transplant fails and we cannot attribute the failure to irrelevant factors (e.g., incompatible interfaces).
  - **Decisive?**: The functionalist has an escape hatch (context-dependence), so the test might not be fully decisive for them. The localist might also argue that a successful transplant would just show that the mechanism is physical and can be moved, which doesn't prove functional identity across models without transplant.

  ### Crux 4: Does establishing unchanged internal mechanism (by localist criteria) license predictions beyond behavior on a probe set?
  - **Background**: This is critical for the localist's day job (building internal-state monitors). He claims that if the internal mechanism is unchanged (by his lights), we can predict behavior in new situations better than if we only know the behavior on a probe set.
  - **Test**:
     - **Setup**: We have a model that is fine-tuned on a new dataset. We want to know if a particular mechanism M (e.g., for truthfulness) is unchanged.
     - **Localist Check**: The localist uses his methods (e.g., patching/ablation) to verify that the same subgraph is causally responsible for the behavior in the fine-tuned model as in the original.
     - **Functional Check**: The functionalist checks if the function (input-output profile) is the same on a held-out probe set.
     - **Prediction Task**: We then evaluate the model on a new distribution D_test (which is out-of-distribution for both the probe set and the fine-tuning data) and measure a specific behavior (e.g., truthfulness).
     - **Question**: Does the localist's internal check provide better predictions about behavior on D_test than the functionalist's probe set check?
  - **Localist Prediction**: Yes. If the internal mechanism is unchanged, then even on OOD data, the model will use the same causal pathway and thus behave similarly. If only the behavior on the probe set is unchanged, the mechanism might have changed (e.g., via fine-tuning) and could fail on D_test.
  - **Functionalist Prediction**: No. The only way to know about behavior on D_test is to test it directly or to have a functional description that generalizes. The localist's internal check might be misleading because the same physical subgraph could implement a different function on OOD data, or the function might be preserved even if the subgraph changes. The probe set check is at least a direct measure of the function.
  - **Loss Condition**: 
     - Localist loss: If the internal mechanism is unchanged (by localist criteria) but behavior on D_test changes unpredictably (i.e., no better than the probe set check).
     - Functionalist loss: If the internal mechanism being unchanged (by localist criteria) consistently predicts behavior on D_test better than the probe set check, especially in cases where the probe set behavior is the same but the internal mechanism has changed (by localist criteria) and the behavior on D_test changes accordingly.
  - **Decisive?**: This is a practical crux with real-world implications. Both sides should agree on the experimental setup and metrics (e.g., prediction accuracy of the two methods).

  ## Closing Sentences

  - **Sentence for Localist to Sign**: "The identity of a mechanism is determined by the specific physical units and weights that causally mediate a computation, as revealed by targeted interventions, and this physical instantiation is primary for predicting model behavior under distributional shift."
  - **Sentence for Functionalist to Sign**: "The identity of a mechanism is determined by the function it computes, defined by its input-output profile and internal causal dependencies, and this functional description is primary for explaining why the model behaves as it does, regardless of the physical substrate that realizes it."
answer: |-
  ### Joint Statement on Mechanism Identity in Neural Networks  
  **Produced via Adversarial Collaboration**  
  *By [Localist's Name] and [Functionalist's Name]*  

  #### 1. Agreed Claims  
  Both parties accept the following as empirically grounded and non-controversial:  
  1. **Neural networks exhibit causal structure**: Interventions (e.g., activation patching, ablation) reveal dependencies between units (e.g., attention heads, MLP neurons) and outputs. These dependencies are detectable, reproducible, and necessary for interpreting model behavior.  
  2. **Multiple realization occurs across training runs**: Functions (e.g., induction-head-like behavior) arise in distinct physical subgraphs (e.g., different layers, heads, or weight matrices) across independently trained models with identical architectures. No shared physical subgraph is required.  
  3. **Redundancy and compensation exist**: Ablating a unit may leave behavior unchanged if another unit (or set of units) compensates. This is observed in cases like duplicated attention heads, superposition, or fine-tuning where behavior persists despite shifted unit importance.  
  4. **Pathway switching occurs off-distribution**: A model may use one circuit (e.g., a "core" mechanism) for on-distribution inputs and a distinct pathway (e.g., heuristics or memorized patterns) for out-of-distribution inputs, even with fixed weights.  
  5. **Interventions are context-dependent**: Patching/ablation effects vary with input distribution, model state, and which units are ablated. A unit critical in one context may be irrelevant in another.  
  6. **Mechanism descriptions are hierarchical**: A computation can be described at multiple levels (e.g., weights, activations, mathematical functions). No level is ontologically privileged; choice of level depends on the explanatory goal.  
  7. **Fine-tuning alters physical realization without necessarily changing behavior**: Unit-level importance (measured by ablation sensitivity) can shift significantly during fine-tuning while high-level input-output mappings remain stable.  

  #### 2. Disagreements Table  
  Each row states an issue, followed by wording each party accepts as their own position. "Substantive" indicates disagreement about facts; "Verbal" indicates disagreement about terminology.  

  | Issue | Localist Formulation | Functionalist Formulation | Substantive/Verbal |  
  |-------|----------------------|----------------------------|-------------------|  
  | **What defines a mechanism?** | A mechanism is a fixed physical subgraph (specific units and edges) whose weights and connections directly mediate computation. | A mechanism is a function from inputs to outputs, defined by a counterfactual dependence profile, independent of physical instantiation. | Substantive |  
  | **When are two computations the "same mechanism" in one model?** | Two computations use the same mechanism iff they are causally mediated by the same set of units, verified by interventions (e.g., ablating the set disrupts both). | Two computations use the same mechanism iff they implement identical input-output mappings with matching internal dependence structures, even if realized by disjoint units. | Substantive |  
  | **Does mechanism identity require causal necessity of all parts?** | A unit is part of a mechanism only if ablating it disrupts the mechanism’s output (on typical inputs), establishing its causal necessity. | A unit is part of a mechanism if it realizes the mechanism’s function, even if ablation has no effect due to redundancy (e.g., a backup unit). | Substantive |  
  | **Is mechanism identity relative to input distribution?** | Mechanisms are defined by weights and architecture; they do not change with input distribution. Altered input-dependent pathways reflect activation of different sub-mechanisms within the fixed physical graph. | Mechanisms are defined relative to an input distribution; if the computational pathway changes substantially (e.g., on- vs. off-distribution), the mechanism itself differs, even with fixed weights. | Substantive |  
  | **Can mechanisms be identical across models?** | Mechanism identity cannot hold across models; similar functions may exist, but physical differences (e.g., weight values, unit connectivity) preclude identical mechanisms. | Mechanism identity can hold across models if they implement the same function with isomorphic dependence structures (e.g., both have an "induction head" with matching input-output roles). | Substantive |  
  | **What is disrupted when a unit is ablated?** | Ablation disrupts the mechanism if it alters outputs; persistent behavior after ablation implies a distinct mechanism has compensated. | Ablation disrupts the realization, not the mechanism; persistent behavior confirms the function is preserved (e.g., via redundancy), so the mechanism remains identical. | Verbal |  

  **Verbal Disagreement Rationale**: The final row is verbal. Both agree ablation can leave behavior unchanged due to compensation, but dispute terminology: "Disrupts the mechanism" (localist) vs. "disrupts the realization" (functionalist) is a label for the same phenomenon. Swapping terms would misrepresent each view: Calling compensation "same mechanism" denies localism’s physical specificity; calling it "different mechanism" denies functionalism’s role abstraction.  

  #### 3. Cruxes  
  For each, we specify a test both parties accept as bearing on the issue, and predict outcomes that would falsify our positions.  

  **Crux 1: Is causal necessity required for a unit to be part of a mechanism?**  
  - **Test**: In a model with two redundant units (A and B), where ablating either alone has no effect on output (due to compensation), but ablating both disrupts behavior. Measure whether A is part of the mechanism when B is active.  
    - *Intervention*: Ablate A while B is intact; measure output change.  
    - *Distribution*: Inputs where both units are active.  
    - *Measurement*: Causal effect of ablating A on output accuracy.  
  - **Localist Prediction**: Ablating A has no effect → A is not part of the mechanism (causal necessity fails). **Loss if**: Ablation has no effect, but A is deemed part of the mechanism.  
  - **Functionalist Prediction**: A is part of the mechanism (it realizes the function). **Loss if**: Ablation has no effect, and A is excluded from the mechanism.  

  **Crux 2: Can mechanism identity change while weights are fixed?**  
  - **Test**: Train a model on distribution D1 until it uses a specific circuit C for function F. Evaluate on D2 (shifted distribution) where it uses circuit C' for F. Verify via patching that C and C' are physically disjoint.  
    - *Intervention*: Patch activations from C into runs on D2 (and vice versa); measure output change.  
    - *Held Fixed*: Model weights.  
    - *Measurement*: Patching effect size (≥80% output change indicates causal relevance).  
  - **Localist Prediction**: Mechanism is unchanged (weights are identical); patching C into D2 runs disrupts outputs. **Loss if**: Patching C into D2 has no effect, proving C is irrelevant on D2.  
  - **Functionalist Prediction**: Mechanism differs (pathway change); patching C into D2 has minimal effect. **Loss if**: Patching C into D2 significantly alters outputs, proving C is still central.  

  **Crux 3: Does internal mechanism stability predict OOD behavior better than probe-set performance?**  
  - **Test**: Fine-tune a model on new data. For a behavior (e.g., truthfulness), compare two checks: (1) Localist: Verify original mechanism (subgraph) is causally active via patching. (2) Functionalist: Verify probe-set performance is unchanged. Then evaluate on OOD inputs.  
    - *Intervention*: Localist patches original mechanism’s activations into fine-tuned model; functionalist assesses probe-set accuracy.  
    - *Distribution*: OOD inputs unseen during fine-tuning or probing.  
    - *Measurement*: Correlation between mechanism/probe stability and OOD behavior.  
  - **Localist Prediction**: Mechanism stability better predicts OOD behavior than probe-set performance. **Loss if**: Probe-set stability predicts OOD behavior as well as (or better than) mechanism stability.  
  - **Functionalist Prediction**: Probe-set performance predicts OOD behavior as well as mechanism stability. **Loss if**: Mechanism stability is a significantly better predictor.  
  - **Decisiveness**: Functionalist would not treat a single test as decisive due to context-dependence; replication across tasks/models is needed.  

  **Crux 4: Can mechanism identity hold across models?**  
  - **Test**: Train two models (same architecture) to perform function F. Identify F’s "circuit" in each (C1, C2) via patching. Transplant C1’s weights into Model 2, replacing C2.  
    - *Intervention*: Replace C2’s weights with C1’s in Model 2.  
    - *Held Fixed*: Non-circuit weights in Model 2.  
    - *Measurement*: Output accuracy on F-relevant inputs post-transplant.  
  - **Localist Prediction**: Transplant degrades performance; mechanism identity requires full context. **Loss if**: Transplanted model performs as well as Model 1.  
  - **Functionalist Prediction**: Performance may degrade (due to interface mismatch), but mechanism identity is not refuted; function matters more. **Loss if**: Transplant works perfectly and functionalist denies mechanism identity.  
  - **Decisiveness**: Localist treats this as decisive; functionalist does not (due to potential interface issues).  

  ---  
  **Closing Sentences**  
  - **For the localist to sign**: "Mechanism identity is grounded in the physical subgraph causally responsible for a computation, and interventions on this subgraph provide unique predictive power for model behavior under perturbation or distributional shift."  
  - **For the functionalist to sign**: "Mechanism identity is defined by the function a computation performs, and this functional description generalizes across physical realizations, enabling predictions about model capabilities independent of implementation details."
