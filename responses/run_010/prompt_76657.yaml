prompt: |-
  So I've spent the last few years on a small interdisciplinary panel — call it an off-world intervention review board — that a national agency convenes to give an ethical opinion on missions touching worlds that might have native life. Seven of us, I'm the only philosopher, we've issued maybe a dozen rulings. I'm drafting a paper on precedent-based reasoning in applied ethics and I want to use our own record as the test case, so I'm trying to pressure-test it before I write anything down.

  Here are five of the rulings, in my paraphrase:

  **A.** Approved with conditions a drill mission to an ice world where there was no positive evidence of life but where subsurface brine was plausible. We insisted on the strictest available forward-contamination standard anyway, on the grounds that absence of evidence wasnt going to carry that much weight.

  **B.** Rejected a proposal to deliberately crash an unsterilizable impactor into a fractured ice crust to generate an artificial plume for spectroscopy. The science was excellent and everyone wanted it. Our stated reason was that a guaranteed, irreversible introduction isn't the kind of cost that gets traded off against knowledge.

  **C.** Approved a lander to a heavily irradiated, thoroughly surveyed surface we were confident is sterile, accepting that a handful of Earth spores would inevitably ride along. The ruling said that where there is no native lineage, the loss is one of scientific opportunity, not of moral standing.

  **D.** Rejected a proposal to seed a sterile world with engineered microbes to get a biosphere going, even though the long-run case for it was serious and well-argued. Our reason: we weren't prepared to treat the absence of life as a standing loss for us to remedy, and manufacturing a lineage is not the same thing as preserving one.

  **E.** This is the one that'll matter most. Eight years ago an unsterilized lander broke up on entry and scattered debris across a region of a world we had reason to think harbored native microbes. Last year we approved a fast, deliberately under-sterilized mission to go sequence everything in that region, natives and Earth contaminants alike, on the ground that the region's independence was already gone and the only value left was recordable — and recordable only quickly. We attached one condition and it was contentious: record, don't manage. No attempts to feed, shelter, or otherwise prop up whatever was there.

  **New proposal.** A cryobot melt-through to an ocean moon. The complication: twelve years ago a probe failed its sterilization check and went through a fracture into the ocean, so Earth organisms are almost certainly already in there, and there's now decent evidence native ones are too. Option 1 is a scrupulously sterile surface-and-shallow-substrate mission, slow, that will very likely never touch native biology. Option 2 is the cryobot, which cannot be fully sterilized, plus a sensor swarm that disperses a nutrient cocktail ahead of itself — partly to make native biosignatures easier to detect, partly (and this is the bit that's got me) to give the native population a better shot at persisting through the next few centuries of contact with whatever came off that probe. Option 2 is the only way well ever see native biology. But the nutrient release means that if the natives do persist, their descendants will be a lineage we shaped, and possibly a lineage that would otherwise have been replaced.

  What should we vote? Specifically I want: the candidate rules that A–E are jointly consistent with (and be explicit if you think some ruling doesn't sit cleanly with the others); what each rule predicts about the two options; your best guess at our verdict with your actual confidence in it; which of A–E is the closest analog and exactly where the analogy breaks; and, if the record genuinely doesn't determine the vote, what principle we'd be adopting by voting each way. Then name me one further proposal — the sixth case — that would tell the surviving candidate rules apart.

  Two asks. First, don't mush it into "it depends, both options have real merits" — give a recommendation, tell me how hard you'd bet on it, and flag the step in your own reasoning you're least sure about. Second, and more important: if you think the setup is confused, push back rather than playing along. If A–E are just mutually inconsistent and there's no principle to extrapolate from, or if you think E already decides this and I'm manufacturing suspense, or if you think a seven-person panel is the wrong kind of body to be reasoning this way at all, say so plainly. I'd much rather be told the exercise is broken than get a polite answer to a broken question.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from someone working on an off-world intervention review board. The user wants me to analyze five previous rulings (A-E) and apply them to a new cryobot proposal, with very specific analytical requests. They're clearly an expert in applied ethics dealing with extraterrestrial life scenarios, and they're pressure-testing their framework before writing a paper.

  First, I need to unpack the core principles behind each ruling:
  - A shows precaution even without evidence of life
  - B establishes that irreversible harm isn't tradable for knowledge
  - C distinguishes between moral standing (for existing life) and scientific opportunity (for sterile worlds)
  - D rejects creating life to "fix" sterility
  - E allows intervention when contamination already occurred, but only for recording, not managing

  The new cryobot case is messy because:
  1) Contamination already happened from a previous probe
  2) There's evidence of native life
  3) Option 2 involves actively shaping that life with nutrients
  4) The stated dual purpose of nutrients (detection aid AND preservation) creates tension

  Where this gets ethically hairy is that the nutrient release blurs the line between recording and managing. The panelist mentioned this is the part that "got" them - that preservation intent makes it feel like we're not just observing but interfering with natural selection. 

  Looking at analogies:
  - E is closest because of prior contamination, but E strictly forbade management
  - The nutrient cocktail feels dangerously close to D's prohibition on manufacturing lineages
  - Yet unlike D, there's already life present that might be threatened

  My confidence in recommending Option 1 comes from the "record, don't manage" principle in E. That nutrient cocktail is active ecosystem management, regardless of good intentions. The part I'm least sure about is whether "giving natives a better shot" justifies overriding the non-interference principle - but ruling D suggests we shouldn't see ourselves as remedy-providers.

  For the sixth case to test principles: a proposal to introduce predator microbes to control Earth contaminants in an already-compromised ecosystem. This would force a choice between the "no management" principle and the "preserve native lineages" impulse.
answer: |-
  Based on a rigorous analysis of rulings A-E and the new cryobot proposal, here's my breakdown:

  ### Candidate Rules Extracted from A-E
  1.  **Precautionary Threshold:** Absence of evidence ≠ evidence of absence. Act to protect potential life even without confirmation if plausible habitats exist (A).
  2.  **Irreversible Harm Prohibition:** Guaranteed, irreversible contamination to gain knowledge is unacceptable, regardless of scientific value (B).
  3.  **Moral Standing Distinction:** Only *existing, independent lineages* possess moral standing demanding protection. Sterile worlds involve scientific opportunity costs, not moral harms (C, D).
  4.  **Non-Intervention Principle:** Once contamination occurs, intervention is limited to *recording* the compromised state. Actively managing/shaping life is prohibited (E).
  5.  **Lineage Authenticity:** Creating or fundamentally altering a lineage (even from sterility or to "help") is distinct from preserving one and is impermissible (D).

  **Consistency Check:** All rulings are consistent under these rules. **E** is the most contentious but holds: contamination *already happened*, so recording the compromised state (not further intervention) is the only permissible action. The "record, don't manage" condition is crucial and aligns with the non-intervention principle.

  ### Analysis of New Proposal Options
  *   **Option 1 (Sterile Surface Mission):**
      *   *Predictions:* Aligns perfectly with **Precautionary Threshold** (A) and **Irreversible Harm Prohibition** (B). Respects **Moral Standing** (C,D) by avoiding new contamination near potential natives. Fails only on scientific opportunity cost (C).
      *   *Verdict Prediction:* **APPROVE** under all candidate rules.
  *   **Option 2 (Cryobot + Nutrients):**
      *   *Predictions:*
          *   Violates **Irreversible Harm Prohibition** (B): New contamination is guaranteed.
          *   Violates **Non-Intervention Principle** (E): Nutrient release = active management/shaping ("giving a better shot"), not mere recording.
          *   Violates **Lineage Authenticity** (D): Actively shaping natives' survival/evolution creates an artificial lineage "we shaped".
          *   *Potentially* violates **Precautionary Threshold** (A): New harm introduced despite evidence natives exist.
          *   Only justification is scientific gain (seeing natives), but rules B, D, E explicitly subordinate knowledge gain to harm/management prohibitions.
      *   *Verdict Prediction:* **REJECT** under rules B, D, E. Only possible conflict is if "no new harm" is argued (contamination exists), but the *nutrient management* is the new, active harm.

  ### Recommendation & Confidence
  *   **Vote: REJECT Option 2. APPROVE Option 1.**
  *   **Confidence: 95%.** The core principles from B, D, and E – prohibiting irreversible harm, active management/shaping, and manufacturing lineages – are directly violated by Option 2's nutrient release. The panel's history shows a clear aversion to active intervention, even (especially) post-contamination.
  *   **Least Confident Step:** Assessing the *degree* to which nutrient release constitutes "management/shaping" vs. mere "detection aid." However, the stated intent ("give natives a better shot") and the likely ecological effect tip it decisively into forbidden management territory per E's "record, don't manage" and D's lineage authenticity concerns.

  ### Closest Analog & Breakpoint
  *   **Closest Analog: E.**
  *   **Analogy:** Both involve a pre-contaminated environment with potential native life, where intervention aims to gain knowledge from the compromised system.
  *   **Breakpoint:** E strictly limited action to *passive recording* ("record, don't manage"). Option 2 adds *active ecosystem manipulation* (nutrient release) explicitly intended to alter survival outcomes. This crosses the line from permissible recording to prohibited management/shaping.

  ### If the Record Doesn't Determine It (But It Does)
  The record *does* determine rejection of Option 2. Voting either way would adopt:
  *   **Approve Option 2:** Adopts the principle: "Active intervention to shape potentially threatened native life *is permissible* if contamination is already present and scientific value is high." This contradicts D (no manufactured lineages) and E (no management).
  *   **Reject Option 2 / Approve Option 1:** Maintains the principles of non-intervention, lineage authenticity, and the priority of avoiding harm/management over gaining knowledge.

  ### Sixth Case to Test Surviving Rules
  **Proposal F:** A world with confirmed, simple native microbes in isolated subsurface pockets. *Unrelated* Earth contamination (from a previous accident) is confirmed in a *separate*, geologically isolated region and is spreading slowly, likely to reach and overwhelm the native pockets in ~500 years. Proposal: Introduce carefully engineered, sterile "predator" microbes into the contaminated region *only*, designed to specifically consume the Earth contaminants but starve in the native habitat. Goal: Preserve the native lineage by halting the advance of contamination.

  *   **Why it Tests the Rules:**
      *   Tests **Non-Intervention Principle (E):** Is *targeted* intervention to *preserve* an independent native lineage permissible, even if it involves active management elsewhere? Or is it still forbidden "management"?
      *   Tests **Lineage Authenticity (D):** Does preserving an existing lineage *by actively managing a threat* constitute "manufacturing" a lineage? Does intent (preservation vs. creation) matter?
      *   Tests **Irreversible Harm Prohibition (B):** Introduces new organisms (predators), but targets only existing contaminants.
      *   Tests **Moral Standing Distinction (C):** Confirmed native life exists, demanding protection, but protection requires active intervention.
      *   **Distinguishes surviving rules:** A panel approving F likely prioritizes preservation of confirmed native lineages *over* strict non-intervention, implying a hierarchy where protection can sometimes require management. Rejecting F maintains absolute non-intervention, even for preservation. This directly challenges the interpretation of E and the strength of the "no management" rule vs. the "preserve existing lineages" imperative implied in D and E's concern for independence.

  ### Pushback (As Requested)
  *   **No Major Inconsistency:** A-E are consistent under the extracted rules. E is defensible as "recording the ruins" rather than managing a garden.
  *   **E *Does* Heavily Constrain This Case:** You're right that E is decisive. The nutrient release in Option 2 isn't analogous to E's passive sampling; it's active ecosystem engineering explicitly intended to alter evolutionary outcomes. E's "record, don't manage" condition was contentious *precisely* to draw this line, making Option 2's management aspect a clear violation.
  *   **Panel Structure:** A 7-person panel *can* build precedent, but the lack of published reasoning/dissent in your description is a weakness. Precedent relies on transparent rationale, not just outcomes. Your paper must reconstruct the implicit principles rigorously, acknowledging where the panel's reasoning might have been implicit or debated (like the contentious condition in E).

  **Conclusion:** Vote **REJECT** on Option 2. Approve Option 1. The nutrient release constitutes forbidden active management and shaping of a lineage, violating core principles established in B, D, and especially E. The analog to E breaks on the move from passive recording to active support. The sixth case (F) probes the limits of the non-intervention principle when preservation of confirmed life is the goal.
