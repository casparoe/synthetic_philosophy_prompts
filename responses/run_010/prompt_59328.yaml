prompt: |-
  I'm a commercial litigator, and contract doctrine is my native language: offer and acceptance, consideration and its nominal substitutes, promissory estoppel, conditions and gap-fillers, expectation versus reliance damages, voidability for incapacity, duress, mistake and impracticability, formalities such as seals and the statute of frauds, and the standing of third-party beneficiaries. Restate the philosophical debate over why promises bind in that vocabulary, as faithfully as you can, taking the main accounts in turn: Hume's line that no bare act of the will can create an obligation and that promising binds only as a feature of a human convention; the practice conception, on which the duty arises from invoking a constitutive social practice; the expectation-based account, on which the wrong consists in deliberately leading someone to plan on your performance and then letting them down; and the view that a promise transfers to the promisee a right you previously held, including the right to release you. For each, name the doctrine that comes closest to carrying it, and say where that doctrine's machinery resists the philosophical claim.

  Then give me the residue report in three lists: what translates cleanly; what you could render only by distorting the philosophy, the law, or both; and what has no expression at all in my vocabulary. Address the asymmetry head-on — consideration tells me a gratuitous promise is unenforceable, while a seal or a peppercorn makes binding something morality may never have made binding. Does that divergence show lawyers holding a concept of obligation the philosophers lack, or does it show that the philosophers' "bindingness" is something my vocabulary was never built to express? Close by naming the residual item you judge most damaging, and say whether it counts against the account that cannot be translated or against the framework that cannot translate it.
reasoning: |-
  Okay, the user is a commercial litigator deeply familiar with contract law doctrines. They want me to restate philosophical debates about why promises bind using contract law vocabulary. The main accounts to cover are Hume's convention theory, the practice conception, expectation-based accounts, and the right-transfer theory. For each, I need to name the closest contract doctrine, explain where it resists the philosophical claim, and then provide a residue report in three lists: clean translations, distortions, and untranslatable concepts. Finally, I need to address the asymmetry between legal enforceability (like consideration requirements) and moral bindingness.

  First, I'll tackle each philosophical account one by one. For Hume, his view is that promises are binding due to social convention, not just will. The closest doctrine is consideration, but consideration requires a bargained-for exchange, while Hume's convention is more about societal acceptance. The resistance here is that law formalizes convention into strict rules.

  Next, the practice conception by Rawls or Searle suggests that invoking a social practice creates duties. The doctrine here is promissory estoppel (PE). But PE requires detrimental reliance and isn't based solely on invoking a practice. So the resistance is that PE needs reliance, not just participation in the practice.

  Then the expectation-based account, like Scanlon's, where the wrong is inducing reliance and causing disappointment. The closest is reliance damages in contract law. But reliance damages are a fallback when expectation damages can't be proven, whereas Scanlon's view is about the moral wrong of creating expectations. So the resistance is that law prioritizes expectation damages, not reliance.

  The right-transfer theory from Owens or Shiffrin posits that promising transfers a right to the promisee. Third-party beneficiaries come closest, as they grant rights to non-parties. But this doctrine is limited by vesting and intent requirements, whereas the philosophical view is broader. The resistance is that third-party rights are constrained by legal rules, not inherent in the promise.

  Now for the residue report. Clean translations would be things like expectation damages aligning with the expectation-based account. Distortions include consideration being stretched to fit Hume's convention. Untranslatable concepts include the moral "ought" in promises versus legal enforceability.

  Addressing the asymmetry: consideration makes gratuitous promises unenforceable, but a seal or peppercorn can bind them legally. This shows that lawyers have a procedural concept of obligation, focusing on enforceability, while philosophers discuss moral bindingness. The divergence highlights that the legal framework wasn't built to express moral obligations without formalities.

  The most damaging residual item is the moral "ought." It's untranslatable because contract law doesn't concern itself with moral duties unless they meet legal criteria. This counts against the legal framework's inability to capture the philosophical essence of promising beyond enforceability.
answer: |-
  Here's the restatement of the philosophical debate on promissory obligation in commercial contract doctrine, followed by the residue analysis and asymmetry assessment:

  **Philosophical Accounts Translated & Contrasted with Doctrine:**

  1.  **Hume's Conventionalism:**
      *   **Philosophy:** Promises bind solely due to a socially beneficial *convention*. No intrinsic moral magic in the "act of will"; obligation arises from the *institution* of promising itself, sustained by mutual advantage and the expectation of performance.
      *   **Closest Doctrine:** **Consideration** (as a formal requirement).
      *   **Translation:** The enforceability of a promise isn't inherent in the expression of will ("offer") but depends on its conformity to the legal convention requiring a bargained-for exchange ("consideration"). The convention exists because it facilitates reliance and commerce.
      *   **Doctrine's Resistance:** (1) **Nominal Consideration/Peppercorn:** The law *does* enforce promises based on a bare formality (seal, nominal $1), treating the *form* as sufficient even without substantive societal benefit or mutual advantage in that specific case, which Hume would find arbitrary. (2) **Gratuitous Promises & Morality:** Doctrine explicitly *rejects* enforcing most gratuitous promises (lack of consideration), even if they create strong moral obligations within Hume's convention (e.g., deathbed promise to a friend). Law carves out a narrower convention.

  2.  **Practice Conception (Rawls, Searle):**
      *   **Philosophy:** The duty arises *only* by invoking a specific, rule-governed social practice. Uttering "I promise" invokes constitutive rules; breaking it violates the internal rules of the practice you willingly joined.
      *   **Closest Doctrine:** **Promissory Estoppel (PE)**.
      *   **Translation:** Invoking the practice (making a promise) can create an obligation if the promisee *reasonably relies* on it to their detriment. The "practice" of inducing reliance creates the duty to avoid injustice.
      *   **Doctrine's Resistance:** (1) **Detrimental Reliance Requirement:** PE *requires* actual, reasonable, and detrimental reliance. The pure practice conception sees the duty arising from the *act of promising within the practice*, even *before* reliance occurs. (2) **Remedy (Reliance vs. Expectation):** PE typically awards *reliance* damages, restoring the promisee to their pre-promise position. The practice conception suggests the duty is to *perform* (or pay expectation damages), as that's the core rule of the practice invoked.

  3.  **Expectation-Based Account (Scanlon):**
      *   **Philosophy:** The wrong is intentionally inducing reasonable reliance (expectation) in another and then failing to perform without adequate justification, causing disappointment and thwarted planning.
      *   **Closest Doctrine:** **Expectation Damages** as the default remedy + **Fraud/Misrepresentation** (for inducing reliance).
      *   **Translation:** The core wrong justifying enforcement is the harm caused by *disappointed expectation* due to the promisor's deliberate inducement. Expectation damages aim to put the promisee in the position they *expected* to be in had the promise been kept.
      *   **Doctrine's Resistance:** (1) **Bargain Requirement:** The law *requires* consideration (a bargain) to trigger robust expectation damages for most promises. Scanlon's principle suggests inducing reliance on a *gratuitous* promise could also be binding/wrongful if the conditions are met, but doctrine generally says "no consideration, no expectation remedy." (2) **Strict Liability vs. Fault:** Contract breach is largely strict liability. Scanlon's account emphasizes the *deliberate* creation of expectation and the *unjustified* failure. Doctrine cares less about "justification" (beyond defenses like impracticability) and more about the fact of breach.

  4.  **Right-Transfer Theory (Owens, Shiffrin):**
      *   **Philosophy:** A promise transfers a *right* (a moral claim) the promisor previously held over their own future action to the promisee. The promisee now holds a right to performance (or release).
      *   **Closest Doctrine:** **Third-Party Beneficiary Rights**.
      *   **Translation:** The promise operates to transfer a right to performance to the promisee, who can demand it or release the obligation. This aligns with a beneficiary gaining enforceable rights via a contract between others.
      *   **Doctrine's Resistance:** (1) **Consideration Requirement Again:** The "transfer" only happens if the *promisor's* promise is supported by consideration flowing to the *promisor*. The right-transfer theory posits the transfer occurs via the promise itself. (2) **Vesting & Intent:** Third-party rights are contingent on vesting and clear intent to benefit. The philosophical view suggests the transfer is inherent in the promissory act directed *at the promisee*. (3) **Gratuitous Promises:** Doctrine rejects the transfer of rights via a gratuitous promise.

  **Residue Report:**

  1.  **Translates Cleanly:**
      *   **Expectation Damages** capturing the core harm of disappointed planning (Scanlon).
      *   **Detrimental Reliance** as the trigger for PE, aligning with part of the expectation-based and practice accounts.
      *   **Third-Party Beneficiary** structure illustrating the concept of a right transferred/enjoyed by another.
      *   **Voidability Defenses (Duress, Incapacity, Mistake)** reflecting limits on when an apparent "transfer" or "induced reliance" is invalid due to defective consent.

  2.  **Rendered Only by Distortion:**
      *   **Hume's Convention via Consideration:** Distorts Hume by equating the *formal legal requirement* (consideration/seal) with the *societal convention*. It ignores that the legal formality can bind where the moral convention might not (peppercorn) and not bind where it might (serious gratuitous promise). The law *is* a convention, but a narrower, more formal one.
      *   **Practice Conception via PE:** Distorts by making *reliance*, not the *invocation of the practice*, the core trigger for obligation. It also distorts the remedy (reliance vs. expectation). PE is a *doctrinal response* within the legal practice, not the practice itself.
      *   **Right-Transfer via Third-Party Beneficiary:** Distorts by requiring consideration from the *promise-giver* (promisor) and specific intent for the benefit. The pure transfer theory applies directly to the promisor-promisee relationship without these preconditions.
      *   **Scanlon's Principle via Fraud:** Distorts by framing the wrong as intentional deceit (fraud), whereas Scanlon's wrong can occur even with good faith intent later thwarted, focusing on the creation of expectation and subsequent let-down without justification.

  3.  **No Expression in Contract Doctrine Vocabulary:**
      *   The **Intrinsic Moral "Ought"**: The core philosophical question – *why* *should* a promise create a moral duty *prior to or independent of* legal consequences, reliance, or convention. Doctrine only asks "is it enforceable?" not "is it binding (morally)?"
      *   **Bare Invocation of a Practice Creating Obligation:** The idea that *saying* "I promise" *itself* creates a duty (Practice Conception), absent reliance, consideration, or formality. Doctrine has no mechanism for this.
      *   **Transfer of a Moral Right via Promise Alone:** The notion that a promise *ipso facto* transfers a moral claim right from promisor to promisee (Right-Transfer), without bargained-for exchange or reliance. Doctrine requires more.
      *   **The Distinction Between Moral Bindingness and Legal Enforceability Per Se:** Doctrine assumes unenforceability means (legally) non-binding. Philosophy explores the gap.

  **Addressing the Asymmetry (Consideration/Formality vs. Morality):**

  The divergence between consideration/seals (making the "immoral" peppercorn promise enforceable) and philosophy (suggesting serious gratuitous promises *are* morally binding) cuts both ways, revealing fundamental differences in purpose:

  1.  **Lawyers Hold a Procedural Concept of Obligation:** Contract doctrine is fundamentally about **enforceability in court**, not abstract moral bindingness. Consideration and formalities (seals, SOF) are *evidentiary and cautionary proxies* designed to filter out unreliable claims, prevent fraud, and allocate judicial resources efficiently. A "binding" promise in law is one the *state will compel you to perform or pay for*. The peppercorn or seal provides the requisite procedural hook. Philosophers generally lack *this specific concept* of state-enforced obligation.
  2.  **Philosophers' "Bindingness" is Outside Doctrine's Scope:** The philosophers' core concern – the *moral* "ought" inherent in promising – is something contract doctrine **was never built to express or adjudicate**. Doctrine is a tool for resolving disputes and facilitating commerce based on *reliance*, *bargains*, and *formalities*. It deliberately excludes vast areas of moral promising (gratuitous, familial, social) because they lack the *procedural markers* deemed necessary for efficient and fair state intervention. "Bindingness" in philosophy is a normative claim; in law, it's a conclusion about enforceability.

  **Most Damaging Residual Item & Culpability:**

  *   **Item:** The **Intrinsic Moral "Ought"** – the core question of *why* a promise *should* create a moral duty independent of consequences, convention, or law.
  *   **Culpability:** This counts **primarily against the legal framework's inability to translate it**. Contract doctrine is a practical, procedural engine for dispute resolution and commerce, explicitly agnostic on deep moral philosophy. Its machinery (consideration, formalities, reliance requirements) is designed to answer "Is this promise *enforceable*?" not "Is this promise *morally binding*?". The lack of expression for the fundamental philosophical question highlights that doctrine operates on a different plane – one of social engineering and procedural fairness, not foundational moral justification. While the philosophical accounts struggle to perfectly map onto doctrine (as shown in the distortions), the *complete absence* of the core normative question demonstrates the inherent limitation of the doctrinal vocabulary for expressing the philosophers' central concern.
