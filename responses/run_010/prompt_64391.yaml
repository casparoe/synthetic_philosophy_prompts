prompt: |-
  I chair a statutory advisory panel that recommends to a government department whether early-stage field deployments of certain high-consequence technologies should be permitted: small-scale solar radiation management trials, contained releases of gene-drive organisms against invasive species on islands, and large-scale ocean chemistry interventions. Our enabling instrument requires us to satisfy ourselves that the expected benefits of a proposal outweigh its expected risks, and for fifteen years panels have read that as a simple instruction — attach probabilities to outcomes, attach values to them, multiply, add, compare. In the last two years the instruction has broken down. Three applicants have submitted models in which the sum we are being required to compute does not settle on a number at all: one because the upside tail is modelled in such a way that the mean does not exist (the applicant reports a tail exponent below one and appears not to have noticed what that implies); one because benefits and harms both have unbounded tails, so that regrouping the terms of the sum changes its sign; and one in which the expectation is technically finite but is produced almost entirely by a single term whose probability nobody can defend. A board member described the first of these as the St Petersburg problem in a lab coat. I am told the second also has a name in the literature; use it if it helps, but do not make the procedure depend on my knowing it. What we lack is any way of proceeding that is not simply a polite way of ignoring the offending terms.

  Please write the decision procedure this panel can run. The constraints it must survive are these. We take roughly forty proposals a year and give each a single ninety-minute meeting. Six members sit: one statistician, and otherwise an ecologist, a marine chemist, a lawyer, an economist and a lay member; only the statistician would recognise a formal definition of an expectation, and the procedure must be usable by the others without her translating every step. We cannot commission new modelling, so we must take the applicant's numbers as given, though we may require them to be restated in a form we specify. Every recommendation must be accompanied by written reasons capable of surviving scrutiny by a reviewing court, and I sign them.

  The department's guidance still cites a rule left by my predecessor, which we call the truncate-and-median rule: replace every outcome value above +£500 million with +£500 million and every value below −£500 million with −£500 million, compute the expectation of the truncated variable, and recommend permission only if that figure is positive and the median outcome is also positive. Address this rule directly before replacing it. Does it repair the problem, or relocate it into the choice of the £500 million figure? Is it stable if an applicant re-slices their own scenario set? And can a truncation point be fixed non-arbitrarily — for instance by reference to the maximum loss the public purse has actually been appropriated to bear, or to the ceiling on compensable harm — rather than by round number?

  The procedure you write should contain, in order: the questions to ask of a proposal; what counts as a sufficient answer to each; a workable test that distinguishes the four situations we currently conflate (the expectation does not exist; the expectation is infinite; the expectation is finite but rests on terms no one can estimate; the expectation is fine and we are merely queasy); at least two fallback criteria that can be applied when no expectation is available, each with a statement of what it assumes and what it can legitimately be used to justify; the points at which the procedure stops with a refusal to permit; and the points at which it stops because the remaining question is one of value rather than fact and must be handed to the panel, or to the minister.

  Then run it on three cases. (i) A contained gene-drive release to suppress an invasive rodent across an inhabited island group: harms bounded and modest, with a stated worst case; benefits modelled by the applicant with a tail so heavy that the mean upside diverges. (ii) A stratospheric aerosol injection trial in which avoided heat deaths and disrupted regional monsoon rainfall both carry unbounded tails, and in which the applicant's spreadsheet sums scenarios in an order that happens to make the total positive. (iii) An ocean alkalinity enhancement trial whose expectation is finite and computable, with the entire net benefit supplied by one scenario assigned a one-in-ten-thousand probability and valued at several hundred times the cost of the trial, where our own experts consider that probability not merely uncertain but not estimable at all.

  I expect the procedure will permit at least one of these, and I expect it will be one I think should not be permitted. If so, report that plainly rather than adjusting the procedure until it agrees with me, and tell me whether the disagreement is a defect in the procedure or a defect in my instincts. Close by stating what the procedure cannot do, where it will misfire in ordinary use, and how an applicant could model their way through it in bad faith — I would rather know that now than discover it in a year.

  Do not supply citations, a reading list or a history of the debate; I want the procedure, not its provenance. Set out the steps as numbered items, each with its question, its sufficiency condition, and the exit or handoff it triggers, in plain prose that assumes no more than a first-year statistics course, defining any technical term at first use. Please write throughout in British English, including spelling, and keep monetary amounts in pounds sterling.
reasoning: |-
  We are designing a decision procedure for a panel that reviews high-consequence technology deployment proposals. The current method of computing expected net benefits (by multiplying probabilities by outcomes and summing) breaks down in cases with heavy tails, undefined expectations, or extreme dependence on a single scenario. The panel has limited time and expertise (only one statistician). The procedure must be robust, legally defensible, and non-arbitrary.

  We address the existing "truncate-and-median" rule first:
  - The rule truncates outcomes at ±£500 million and then computes the expectation of the truncated variable. It also requires the median outcome to be positive.
  - The problem: 
    - It relocates the arbitrariness to the choice of the truncation point. Why £500m? If we set it too low, we ignore important tail risks; if too high, we might not solve the convergence issue.
    - It is not stable under re-slicing of scenarios. An applicant could partition a high-impact scenario into multiple smaller ones to avoid truncation, or vice versa.
    - The median requirement is a separate condition that may not align with expected value (which is about the mean). A positive median does not guarantee a positive mean, especially in skewed distributions.
  - Can we fix the truncation point non-arbitrarily? 
    - Reference to the maximum loss the public purse can bear: This might be set by law (e.g., the government's borrowing capacity, or a statutory limit on liability) and could be a non-arbitrary cap. However, it may be too large (e.g., trillions) and not solve the divergence problem. Also, it might not capture non-monetised harms.
    - Ceiling on compensable harm: Similarly, if there is a legal cap on liability, that could be used. But again, it might be high and not address the fundamental issue of infinite expectations.
    - Conclusion: While less arbitrary than a round number, such a cap does not repair the underlying mathematical problem. It merely hides the tail beyond the cap. Moreover, the choice of cap is still a policy decision that should be made by the minister or Parliament, not the panel.

  Therefore, we replace the truncate-and-median rule with a new procedure that handles the problematic cases.

  The new decision procedure:

  **Preliminary Step:** The panel requires the applicant to provide a complete set of scenarios with associated probabilities and outcomes (monetised or in a common unit of impact). The outcomes must include both benefits and harms, and the net benefit for each scenario.

  **Step 1: Check for the existence of a finite expectation.**
     - **Question:** Does the net benefit have a finite expected value? Specifically, we require that the sum of |net benefit in scenario i| * probability(i) converges. The applicant must provide evidence that the expectation is finite and computable.
     - **Sufficiency condition:** The applicant must show that the absolute net benefit series is convergent (i.e., the expectation of the absolute net benefit is finite). If the applicant cannot show this, or if the panel's statistician (after review) determines that the expectation does not exist (e.g., because of a tail exponent <=1 in a power-law tail) then we move to Step 2. Otherwise, we proceed to Step 3.
     - **Exit/Handoff:** If the expectation does not exist (i.e., the absolute expectation is infinite), then we cannot compute the expected net benefit. We stop the expectation-based assessment and move to Step 2 (fallback criteria). We note this in the reasons.

  **Step 2: Apply fallback criteria for when the expectation is undefined or infinite.**
     - We have two fallback criteria. We apply both and then hand off to the panel for a decision if the criteria do not agree. The criteria are:
        - **Criterion A: Median net benefit.** 
            - **Question:** Is the median net benefit positive? 
            - **Assumption:** This criterion assumes that we care about the central tendency and that the median is a robust measure of the center even in the presence of heavy tails. However, it ignores the magnitude of outcomes in the tails.
            - **Use:** It can justify permission if the median is positive and the panel is comfortable that the tail risks are acceptable (which requires further assessment of the tails).
        - **Criterion B: Bounded loss with high probability.**
            - **Question:** Is there a high probability (e.g., at least 95%) that the net benefit will be above a substantial negative threshold (e.g., -£X, where X is chosen by the panel as a tolerable loss)? And is the maximum possible loss (or a very high loss with very low probability) acceptable?
            - **Assumption:** This criterion assumes that we can set a tolerable loss level (X) and a confidence level (e.g., 95%). The tolerable loss might be set by reference to the maximum loss the public purse can bear (if such a figure exists) or by a policy decision. We suggest using a pre-specified X (e.g., £500 million, but now justified by the public purse limit) and a 95% confidence level. The panel must set X in advance (by policy) and then apply it uniformly.
            - **Use:** It can justify permission if the probability of a net loss worse than -£X is less than 5% and the panel is satisfied with the worst-case outcomes that might occur beyond that.
     - **Sufficiency condition:** For the procedure, we require both criteria to be checked. The applicant must provide the cumulative distribution function (or enough quantiles) to assess the median and the 5th percentile (or the probability of exceeding -£X). 
     - **Exit/Handoff:** 
          - If both criteria are met (median positive and at least 95% chance of net benefit > -£X), then we may recommend permission, but the panel must also consider the nature of the tail risks (Step 4).
          - If both criteria are not met, then we move to Step 5 (refusal) unless the panel overrides based on other considerations (Step 6).
          - If only one criterion is met, then the panel must decide (Step 6) based on a qualitative assessment of the tail risks and the project's merits.

  **Step 3: Check the reliability of the expectation when it is finite.**
     - **Question:** Is the finite expected net benefit robust? That is, is it not dominated by a small number of extreme scenarios that have highly uncertain probabilities?
     - **Sufficiency condition:** We require that no single scenario contributes more than 50% of the absolute value of the total expected net benefit. If any scenario does, then we examine the probability of that scenario. 
          - If the probability of that scenario is well-estimated (i.e., based on empirical evidence or a consensus of experts, and not contested by our own experts), then we accept the expectation.
          - If the probability is not well-estimated (e.g., our experts say it is not estimable, or the uncertainty is too high) then we treat the expectation as unreliable and move to the fallback criteria (Step 2).
     - **Exit/Handoff:** 
          - If the expectation is robust (no scenario dominates and probabilities are defensible) and positive, we proceed to Step 4.
          - If the expectation is positive but unreliable, we move to Step 2 (fallback criteria).
          - If the expectation is negative, we move to Step 5 (refusal) unless the panel overrides (Step 6).

  **Step 4: Assess tail risks.**
     - **Question:** Even if the expectation is positive and robust (or the fallback criteria are met), are the tail risks acceptable?
     - **Sufficiency condition:** The panel must consider:
          - The worst-case outcome (or a very bad outcome that has non-negligible probability) and whether it is catastrophic and irreversible.
          - The best-case outcome and whether it is transformative.
          - The balance between the two: is the chance of catastrophe too high relative to the chance of transformation?
     - **Exit/Handoff:** This step is qualitative and involves the entire panel. If the tail risks are deemed acceptable, we recommend permission. If not, we move to Step 5 (refusal) unless overridden (Step 6).

  **Step 5: Refusal.**
     - **Condition:** The procedure leads to refusal if:
          - In Step 1, the expectation does not exist and the fallback criteria (Step 2) are not both met.
          - In Step 3, the expectation is negative and robust (and no fallback criteria are applied because we had a reliable expectation).
          - In Step 4, the tail risks are unacceptable.
     - **Exit:** The panel recommends refusal.

  **Step 6: Panel override.**
     - **Condition:** At any point where the procedure leads to refusal (or when the fallback criteria are mixed) but the panel believes there are compelling reasons to permit, the panel may hand off to the minister with a clear statement of the risks and the reasons for the override.
     - **Exit:** The panel does not make a recommendation but refers the decision to the minister, with a detailed explanation of the risks and the panel's concerns.

  **Summary of the procedure:**
     - Step 1: Check existence of finite expectation. If not, go to Step 2.
     - Step 2: Apply fallback criteria (median and bounded loss). If both met, go to Step 4. If not, go to Step 5 unless Step 6 (override).
     - Step 3: If expectation exists, check reliability. If reliable and positive, go to Step 4; if reliable and negative, go to Step 5; if unreliable, go to Step 2.
     - Step 4: Qualitative assessment of tail risks. If acceptable, recommend permission; else, Step 5.
     - Step 5: Recommend refusal.
     - Step 6: At any point, the panel can refer to the minister.

  Now we run the three cases:

  **Case (i): Contained gene-drive release to suppress invasive rodents on an inhabited island group.**
     - Harms: bounded and modest (worst case stated).
     - Benefits: modelled with a heavy tail (tail exponent <1) such that the mean upside diverges.
     - Step 1: The expectation of net benefit does not exist because the absolute expectation diverges (due to the upside tail). We move to Step 2.
     - Step 2: 
          - Criterion A: Median net benefit. The applicant must provide the median. Given that the upside is very heavy-tailed but the downside is bounded, the median might be positive (if the probability of a modest net benefit is high enough). We assume the applicant reports a positive median.
          - Criterion B: Bounded loss. Since the harms are bounded, we can set X to be the worst-case loss (which is known and modest, say £Y). Then we require that the net benefit is above -£Y with 95% probability. Because the downside is bounded, this condition is automatically satisfied (as long as the worst-case loss is within our tolerable limit). 
          - Both criteria are met? Probably yes. Then we go to Step 4.
     - Step 4: Assess tail risks. The upside is unbounded (which is good) but the downside is bounded and known. The worst-case harm is acceptable (as per the problem statement). The panel must consider if the chance of the worst-case harm is acceptable and if the huge potential upside (even if rare) justifies the risk. Since the worst-case harm is modest and bounded, the tail risks are likely acceptable. 
     - **Recommendation: Permit.**

  **Case (ii): Stratospheric aerosol injection trial.**
     - Avoided heat deaths (upside) and disrupted monsoon rainfall (downside) both have unbounded tails.
     - The applicant's spreadsheet sums scenarios in an order that makes the total positive (indicating that the expectation might be conditionally convergent but not absolutely convergent, i.e., the Riemann rearrangement theorem applies).
     - Step 1: The absolute expectation is infinite (because both tails are heavy and unbounded) so the expectation does not exist. We move to Step 2.
     - Step 2:
          - Criterion A: Median net benefit. We don't have information, but let's assume the applicant reports a positive median? However, in a symmetric heavy-tailed distribution, the median might be zero. We need the applicant to provide the median. Without more information, we cannot assume it's positive. (The problem does not specify the median.) 
          - Criterion B: Bounded loss with high probability. Given that both tails are unbounded, there is no guarantee that the net benefit will be above -£X with 95% probability. In fact, because of the heavy tails, the probability of a very large loss might be more than 5%. The applicant must quantify the 5th percentile. If they cannot, or if it is below -£X (which we set at, say, £500 million), then this criterion fails.
          - Suppose the applicant provides a distribution that shows the median is negative? Then both criteria fail. Or if the median is positive but the 5th percentile is below -£X, then only the median criterion is met. Then we would hand off to the panel for a qualitative assessment (Step 6).
          - Given the symmetry of the problem (both tails are heavy and unbounded) and the rearrangement issue, it is likely that the median is near zero and the 5th percentile is a large negative. Therefore, we assume both criteria are not met.
     - Move to Step 5 (refusal) unless the panel overrides (Step 6). The panel might override if they believe the potential benefits are worth the tail risks, but that is a policy call for the minister.

     - **Recommendation: Refuse, or hand off to minister if the panel believes there is a compelling case.**

  **Case (iii): Ocean alkalinity enhancement trial.**
     - Expectation is finite and computable, but the entire net benefit is from one scenario (probability 1/10,000) valued at several hundred times the cost (say, net benefit of £B in that scenario, and near zero or negative in others).
     - Our experts say the probability is not estimable.
     - Step 1: Expectation exists (finite). Move to Step 3.
     - Step 3: Check reliability. The single scenario contributes 100% of the expected net benefit (since the others are negligible). The probability of that scenario is 1/10,000, which our experts say is not estimable. Therefore, we treat the expectation as unreliable. Move to Step 2.
     - Step 2: 
          - Criterion A: Median net benefit. Without the extreme scenario, the median net benefit is likely negative (because the other scenarios are near zero or negative). The applicant must provide the median. We assume the median is negative (because the one positive scenario is very rare and the rest are not positive enough to lift the median). So criterion A fails.
          - Criterion B: Bounded loss. The worst-case outcome? Without the extreme positive scenario, the net benefit is bounded (and probably negative). But the applicant's model includes the extreme positive scenario. However, since we are in Step 2, we are using the entire distribution. The loss in the non-extreme scenarios is bounded (say, between -£C and £D, where C and D are moderate). But the extreme positive scenario is a huge benefit, not a loss. The loss side is bounded. So the net benefit is at least -£C (the worst-case loss) in 99.99% of scenarios? Actually, the scenario set includes the one extreme positive and the rest bounded. So the net benefit is bounded below by -£C (which we assume is acceptable) and above by a huge number. Therefore, the probability of net benefit below -£X (if we set X>=C) is zero? So criterion B is met (if we set X >= C) because the loss is bounded and within the tolerance.
          - But note: the problem states that the entire net benefit is from one scenario. In the other 9,999 scenarios, the net benefit is zero or negative. So the median is negative (if at least half the scenarios have net benefit <=0). Therefore, criterion A (median) fails. But criterion B (bounded loss) passes because the worst-case loss is bounded (and we set X to cover that bound).
          - Since only one criterion is met, the panel must decide (Step 6). 
     - Step 6: The panel considers the tail risks. The worst-case loss is bounded and acceptable (by our setting of X). But the project has a high chance (over 50%) of being a net loss (so median is negative). The panel must decide if the small chance of a huge benefit is worth the high chance of a loss. This is a value judgment. The panel may choose to hand off to the minister.

     - **Recommendation: Hand off to the minister with an explanation that the project has a high probability of loss but the losses are bounded and acceptable, and a tiny chance of a huge benefit. The minister must decide if the gamble is worth taking.**

  Now, the chair expects that the procedure will permit at least one case that the chair thinks should not be permitted. In this run:
     - Case (i) is permitted. The chair might be uncomfortable because the upside is unbounded and the chance of a huge benefit (though rare) might be overemphasized? But the harm is bounded and acceptable. The procedure permits it because the fallback criteria are met and the tail risks are acceptable.
     - The disagreement: The chair's instincts might be more risk-averse. The procedure is designed to allow such projects if the downside is bounded and acceptable. This is not a defect in the procedure but a difference in risk attitude. The procedure is focused on preventing catastrophic losses and ensuring that even in the worst-case, the loss is tolerable. In this case, the worst-case is acceptable. The chair's discomfort might be about the lack of an upper bound on benefits? But that is a positive. The procedure cannot capture all nuances of risk attitudes, which is why we have Step 4 (tail risk assessment) and Step 6 (ministerial referral).

  What the procedure cannot do:
     - It cannot eliminate arbitrariness entirely. The choice of the loss threshold X (for criterion B) is arbitrary unless set by policy. We recommend that the panel asks the department to set X by reference to the public purse or a liability cap.
     - It relies on the applicant's scenario probabilities and outcomes. An applicant acting in bad faith could:
          - Artificially break a heavy-tailed scenario into many small ones to avoid Step 1 (existence check) and make the expectation appear finite and reliable. To counter this, the panel should require that the applicant justifies the granularity of scenarios and the independence of events. The statistician can check for hidden heavy tails by looking at the distribution of outcomes.
          - Understate the probability of bad outcomes to pass criterion B. The panel must rely on its own experts to challenge the probabilities.
     - It may be too permissive for projects with bounded losses but a high chance of loss (like case iii) if the minister is inclined to gamble. The procedure flags such cases for ministerial decision.

  Where it will misfire:
     - In distributions that are bimodal or have complex dependencies, the fallback criteria (median and 95% VaR) might not capture the risks adequately.
     - The procedure might refuse projects that have a very small chance of a catastrophe (even if the median and 95% VaR are good) if the catastrophe is deemed unacceptable in Step 4. This is a feature, not a bug.

  We present the procedure in numbered steps as requested.

  **The Decision Procedure:**

  **Preliminary Requirement:** The applicant must provide a complete scenario set, each with a probability and a net benefit (in pounds sterling). The net benefit must be the difference between benefits and harms, monetised appropriately. The scenarios must be mutually exclusive and exhaustive.

  **Step 1: Check for Finite Expectation**
     - **Question:** Is the expected net benefit finite? Specifically, does the sum of the absolute value of the net benefit in each scenario multiplied by its probability converge?
     - **Sufficiency condition:** The applicant must demonstrate convergence of the absolute expectation. The panel's statistician will review the distribution and check for heavy tails (especially power-law tails with exponent <=1) and other indications of divergence. If the absolute expectation diverges, the expectation does not exist.
     - **Exit:**
          - If the expectation does not exist, proceed to Step 2.
          - If the expectation exists (finite), proceed to Step 3.

  **Step 2: Fallback Criteria (when expectation does not exist)**
     - **Questions:**
          - A. Is the median net benefit positive? (The median is the value where at least 50% of the probability mass has net benefit less than or equal to it and at least 50% greater than or equal to it.)
          - B. Is the probability that the net benefit is less than or equal to -£X (where X is a fixed threshold set by the panel, e.g., the maximum compensable harm or a public purse limit) no more than 5%? (That is, at least 95% of the probability mass has net benefit greater than -£X.)
     - **Sufficiency condition:** The applicant must provide the cumulative distribution function (or the necessary quantiles) to answer both questions. The threshold £X must be set in advance by the panel as a matter of policy (and reviewed periodically). The panel may use a default of £500 million if no policy threshold exists, but this should be justified by reference to public finances.
     - **Exit:**
          - If both A and B are satisfied, proceed to Step 4.
          - If neither A nor B is satisfied, proceed to Step 5 (refusal).
          - If only one of A or B is satisfied, the panel must make a qualitative assessment (hand off to Step 6).

  **Step 3: Check Reliability of the Expectation**
     - **Question:** Is the expected net benefit robust? Specifically, is there any scenario that contributes more than 50% of the absolute value of the total expected net benefit? And if so, is the probability of that scenario well-estimated?
     - **Sufficiency condition:** The applicant must list the scenarios in descending order of |net benefit| * probability. If any scenario accounts for more than 50% of the total absolute expectation, then the panel's experts (including the statistician) must assess whether the probability of that scenario is based on sound evidence and is not contested. If the probability is highly uncertain or not estimable (as judged by the panel's experts), then the expectation is deemed unreliable.
     - **Exit:**
          - If the expectation is robust (no scenario dominates by more than 50%, or if a dominating scenario has a well-estimated probability) and the expected net benefit is positive, proceed to Step 4.
          - If the expectation is robust and negative, proceed to Step 5 (refusal).
          - If the expectation is unreliable (due to a dominating scenario with uncertain probability), proceed to Step 2.

  **Step 4: Tail Risk Assessment**
     - **Question:** Are the tail risks (both upside and downside) acceptable?
     - **Sufficiency condition:** The panel must consider:
          - The worst-case net benefit scenario (or a very bad scenario with non-negligible probability) and whether it represents a catastrophe (e.g., irreversible, widespread harm) that is unacceptable even with low probability.
          - The best-case scenario and whether it represents a transformative benefit.
          - The probability of catastrophic loss versus transformative gain.
     - **Exit:**
          - If the panel (by majority) deems the tail risks acceptable and the previous steps are satisfied, recommend permission.
          - If the tail risks are unacceptable, proceed to Step 5 (refusal).

  **Step 5: Refusal**
     - **Condition:** The procedure reaches this step if:
          - Step 2: Neither fallback criterion is met (or only one is met and the panel does not override) and the expectation does not exist.
          - Step 3: The expectation is robust and negative.
          - Step 4: Tail risks are unacceptable.
     - **Action:** The panel recommends refusal.

  **Step 6: Panel Override or Ministerial Referral**
     - **Condition:** At any point in the procedure, if the panel believes that there are compelling reasons to override the procedure's indication (e.g., in Step 2 when only one fallback criterion is met, or in Step 5 when the risks are high but the benefits are transformative), the panel may refer the decision to the minister.
     - **Action:** The panel does not make a recommendation but provides a detailed report to the minister, explaining the risks and the reasons for the referral. The minister then decides.

  **Final Recommendation:** The panel signs the written reasons, which must document the path taken through the procedure and the evidence considered at each step.

  We note that the chair expects the procedure to permit case (i) (gene-drive) even if the chair is uncomfortable. This is because the procedure focuses on bounded harms and positive median. The chair's discomfort might stem from the unbounded upside, which is not a risk but an opportunity. The procedure does not penalise unbounded upside if the downside is controlled. This is not a defect but a design choice. The chair may wish to adjust the tail risk assessment (Step 4) to be more cautious about unbounded upsides? But typically, we are more concerned about downsides. 

  The procedure cannot eliminate value judgments, especially in Step 4 and Step 6. It makes the trade-offs explicit and provides a structured way to handle mathematical pathologies. It is designed to be usable by non-experts by relying on the statistician for Step 1 and Step 3, and by using simple concepts (median, worst-case loss) in Step 2.
answer: |-
  ### Decision Procedure for the Statutory Advisory Panel  

  **Preamble**  
  This procedure replaces the "truncate-and-median" rule. The truncate-and-median rule relocates the problem into the choice of the truncation point (e.g., £500 million):  
  - **Why it fails**:  
    1. **Arbitrariness**: The £500 million cap lacks justification. Using public purse limits (e.g., maximum loss the Treasury can absorb) or compensable harm ceilings is preferable but still policy-dependent, not scientific. The panel cannot set this unilaterally.  
    2. **Instability**: Applicants can manipulate outcomes by re-slicing scenarios (e.g., splitting one high-impact event into many smaller ones to avoid truncation).  
    3. **Incompleteness**: Truncation ignores tail risks beyond the cap, which is critical for high-consequence technologies. The median requirement adds little, as it ignores magnitude.  

  The new procedure prioritises robustness, clarity, and fallback tests for non-expert panel members. It assumes:  
  - Net benefits are monetised in pounds sterling.  
  - Applicants provide probabilities and outcomes for all scenarios.  
  - The panel’s statistician handles technical verification; others apply logical tests.  

  ---

  ### Decision Procedure Steps  
  **Preliminary Step: Validate Inputs**  
  - **Question**: Has the applicant provided a complete set of scenarios with probabilities and net benefits (benefits minus harms), including worst-case estimates?  
  - **Sufficiency condition**:  
    - All scenarios are listed with probabilities summing to 100%.  
    - Extreme outcomes (best/worst cases) are explicitly stated.  
  - **Exit**: If incomplete, return to applicant for revision. Proceed if complete.  

  **Step 1: Does a Meaningful Expected Net Benefit Exist?**  
  - **Question**: Is the expected net benefit (sum of probability × net benefit for all scenarios) finite, uncontradictory, and not dominated by indefensible probabilities?  
  - **Sufficiency condition**: The statistician certifies one of four mutually exclusive diagnoses:  
    1. **Expectation does not exist**: Absolute expectation (sum of probability × |net benefit|) diverges (e.g., infinite mean due to tail exponent ≤1).  
    2. **Expectation is infinite**: Sum oscillates or changes sign when scenarios are re-ordered (e.g., conditionally convergent series).  
    3. **Expectation is finite but unreliable**: >50% of the net expectation depends on scenarios with "not estimable" probabilities (per panel experts).  
    4. **Expectation is valid**: Finite, convergent, and robust.  
  - **Exit**:  
    - If (1), (2), or (3): Proceed to **Step 3** (fallback criteria).  
    - If (4) and expected net benefit >0: Proceed to **Step 2**.  
    - If (4) and expected net benefit ≤0: Proceed to **Step 5** (refusal).  

  **Step 2: Assess Tail Dominance (For Valid Expectations)**  
  - **Question**: Is the positive expectation overly reliant on extreme upside scenarios?  
  - **Sufficiency condition**:  
    - Identify any scenario contributing >30% of the total expected net benefit.  
    - Panel experts (e.g., ecologist, chemist) assess whether its probability is "estimable" (grounded in data/consensus) or "not estimable" (too speculative).  
  - **Exit**:  
    - If no scenario dominates or all probabilities are estimable: Proceed to **Step 4**.  
    - If any dominating probability is "not estimable": Proceed to **Step 3** (fallback criteria).  

  **Step 3: Apply Fallback Criteria**  
  - **Use when**: Expectation is unavailable (Step 1) or unreliable (Step 2).  
  - **Criterion A: Median Net Benefit**  
    - **Question**: Is the median net benefit positive? (Median: 50% of scenarios have net benefit ≥ this value.)  
    - **Assumption**: Central outcomes are well-estimated; tails are less important.  
    - **Justifies**: Permission if worst-case harm is bounded and acceptable.  
  - **Criterion B: Loss Floor**  
    - **Question**: Is the probability of net loss worse than -£X ≤5%? (Where £X = maximum loss the public purse can bear, e.g., statutory compensation cap.)  
    - **Assumption**: Catastrophic losses beyond -£X are intolerable; other outcomes are manageable.  
    - **Justifies**: Permission if catastrophic risk is contained.  
  - **Exit**:  
    - Both criteria met: Proceed to **Step 4**.  
    - One criterion met: **Hand off to panel** for qualitative review (**Step 6**).  
    - Neither met: Proceed to **Step 5** (refusal).  

  **Step 4: Qualitative Tail Risk Review**  
  - **Question**: Are extreme outcomes (best and worst cases) acceptable given their probabilities?  
  - **Sufficiency condition**: Panel assesses:  
    - Irreversibility of harm.  
    - Uncertainty in probability estimates.  
    - Societal tolerance for worst-case (e.g., mass mortality, ecosystem collapse).  
  - **Exit**:  
    - Risks acceptable: **Recommend permission**.  
    - Risks unacceptable: Proceed to **Step 5** (refusal).  

  **Step 5: Refusal**  
  - **Conditions**:  
    - Expected net benefit ≤0 (Step 1).  
    - Fallback criteria not met (Step 3).  
    - Tail risks unacceptable (Step 4).  
  - **Action**: Recommend refusal. Document reasons referencing the failure point.  

  **Step 6: Panel or Ministerial Handoff**  
  - **Conditions**:  
    - Fallback criteria conflict (Step 3).  
    - Uncertainty is value-laden (e.g., "Is a 1% risk of ecosystem collapse worth a 10% chance of saving a species?").  
  - **Action**:  
    - If resolvable by panel (e.g., trade-offs debated): Vote and decide.  
    - If policy-laden (e.g., ethical/societal risk tolerance): **Refer to minister** with risk summary.  

  ---

  ### Procedure Applied to Cases  
  **Case (i): Gene-Drive Release (Benefits with Heavy Tail, Harms Bounded)**  
  - **Step 1**: Expectation does not exist (tail exponent <1; infinite mean upside). Proceed to **Step 3**.  
  - **Step 3**:  
    - **Criterion A**: Median net benefit positive (harms bounded, benefits skewed positive).  
    - **Criterion B**: Loss floor met (worst-case loss bounded; e.g., -£20 million < -£X).  
    - Both criteria met. Proceed to **Step 4**.  
  - **Step 4**: Worst-case harm modest and reversible (e.g., temporary rodent population increase). Tail risks acceptable.  
  - **Recommendation**: **Permit**.  
  - **Chair’s concern**: You may dislike permitting due to unbounded upside (e.g., "over-optimism"). The procedure prioritises bounded harms over speculative upsides—this is **not a defect**. Your instinct may over-weight low-probability gains.  

  **Case (ii): Stratospheric Aerosol Trial (Unbounded Benefits and Harms)**  
  - **Step 1**: Expectation is infinite (re-ordering scenarios flips net benefit sign). Proceed to **Step 3**.  
  - **Step 3**:  
    - **Criterion A**: Median net benefit likely negative (symmetric heavy tails; median ≈0).  
    - **Criterion B**: Loss floor not met (5% probability of catastrophic drought loss > -£X).  
    - Neither criterion met. Proceed to **Step 5**.  
  - **Step 5**: Refusal.  
  - **Recommendation**: **Refuse**.  

  **Case (iii): Ocean Alkalinity Trial (Finite but Unreliable Expectation)**  
  - **Step 1**: Expectation finite but unreliable (dominated by one scenario). Proceed to **Step 2**.  
  - **Step 2**: One scenario (p=0.0001) provides >99% of net benefit. Panel experts deem probability "not estimable." Proceed to **Step 3**.  
  - **Step 3**:  
    - **Criterion A**: Median net benefit negative (other scenarios net zero or negative).  
    - **Criterion B**: Loss floor met (worst-case loss bounded; e.g., -£10 million).  
    - One criterion met. **Hand off to panel (Step 6)**.  
  - **Step 6**: Panel assesses trade-off: High chance of small loss vs. tiny chance of massive benefit. Refers to minister due to value judgment (e.g., "Is gambling £10 million acceptable for a 0.01% chance of solving ocean acidification?").  
  - **Recommendation**: **Refer to minister**.  
  - **Chair’s concern**: You may oppose ministerial referral (preferring refusal). The procedure flags value judgments—this is **not a defect**. Your instinct may reject low-probability bets, but ministers decide societal risk appetite.  

  ---

  ### Limitations and Vulnerabilities  
  1. **What the procedure cannot do**:  
     - Resolve deep uncertainty (e.g., "unknown unknowns").  
     - Replace political judgment for value-laden trade-offs (Step 6).  
     - Detect bad-faith modelling if applicants hide tail risks.  

  2. **Where it misfires**:  
     - **Over-permissiveness**: If £X (Step 3) is set too high, catastrophic risks may be ignored.  
     - **Under-permissiveness**: Heavy-tailed benefits (Case i) may be unduly penalised if fallback criteria misapplied.  
     - **Panel bias**: Non-experts may over-interpret "estimable" probabilities (Step 2).  

  3. **Bad-faith evasion tactics**: Applicants could:  
     - **Manipulate scenarios**: Artificially bound tails to pass Step 3. (*Countermeasure: Require justification for excluded extremes.*)  
     - **Inflate £X**: Lobby to raise the public loss cap. (*Countermeasure: Fix £X to statutory limits.*)  
     - **Obfuscate probabilities**: Label speculative estimates as "conservative." (*Countermeasure: Panel experts must validate.*)  

  **Final Note**: The procedure permits Case (i) but refuses or refers Cases (ii) and (iii). If this clashes with your instincts, it reflects the procedure’s focus on *bounded harms* and *estimable risks*. Your instincts may prioritise avoiding speculative gains (Case i) or low-probability bets (Case iii)—a defect only if the panel’s mandate is ultra-conservatism. The procedure ensures mathematical pathologies do not paralyse decision-making, while escalating value judgments.
