prompt: |-
  Forty-one years I spent taking other people's numbers on faith. Calibrations done by a technician I never met, a melting point out of a handbook, a referee who insisted we redo a measurement, a co-author who swore up and down the sample was pure. Nobody ever taught me to notice that almost nothing I believe about the world I found out for myself. Now that I'm retired I've been reading the philosophers on testimony — Hume and Reid, and the moderns arguing about reductionism and anti-reductionism — and my head is spinning, mostly because everyone seems to be arguing past everyone else and I can't tell which disagreements are real.

  So here's what I want: build me a decision tree that sorts a person into a position in this debate, the way you'd identify an unknown compound from its reactions.

  Audience is my reading group — six retired scientists, none of us has read the literature properly, and not one of us will admit to a label in advance. So every branch node has to be a question you could answer honestly without knowing where it leads. Nothing like "do you think testimony reduces to perception plus induction?" That's the answer wearing a question's clothes.

  Draw the cases out of scientific life, not out of "a stranger tells you the way to the station." I mean things like: your grad student says the run hit temperature but the log page is missing; a preprint reports an effect you can't reproduce and the authors won't release the data; a textbook lists a constant with no source given; a footnote credits a personal communication with a man who died in 1998; an anonymous referee asserts your method is unsound without saying why; someone at a conference mentions in passing that a famous result is an artifact of one particular setup. Ten to twelve questions, seven or eight leaves.

  For the leaves, give each its usual name and one sentence on what it costs the person standing there. I want at minimum: the Hume-ish global reductionist; the local reductionist who wants positive reasons case by case; the Reid/Coady anti-reductionist; the Burge-style entitlement view; Lackey's dualism; and the assurance or trust view — Faulkner, Moran — where believing someone is closer to trusting a person than to weighing evidence. If there's a deflationary option that says testimony isn't really a source at all, put it in too.

  One thing I want the tree to either accommodate or throw out: in my experience the thing you trust is usually not a mouth and a pair of ears but a chain — a sample, an instrument, a lab notebook, a calibration traceable to some standard in another country. So include at least one branch point that turns on whether the testifier is a person or an institutional chain, and tell me at the end whether that axis is orthogonal to the reductionism debate or genuinely cuts across it.

  Then, after the tree, lay out the logical space itself: list your questions as coordinates and mark which combinations come out empty, and for each empty cell say why — incoherent, unattractive, or just nobody's got round to it yet. I have a suspicion there's a cell for "positive reasons required, but required of the institution rather than the individual hearer," and I'd like to know if anyone is standing in it.

  Flag every pair of leaves your tree can't actually seperate, and say what you'd have to ask to pull them apart. And if any branch question is one where a working scientist would find both answers absurd, say so — that's probably where the philosophy has gone wrong and I'd rather know.

  No bibliography please, no reading list. I can't chase papers down and neither can you, as far as I know. Just the structure and the reasoning. Write it so I can print it and hand it around: plain questions, plain branches, jargon only in the leaf names.
reasoning: |-
  Hmm, the user presents an intriguing challenge. They're a retired scientist who spent 41 years relying on others' data without questioning the epistemology behind it, and now they're diving into philosophy of testimony. Their reading group of fellow retired scientists wants a practical decision tree to navigate the reductionism vs. anti-reductionism debate, grounded in scientific scenarios rather than abstract thought experiments.

  Key requirements stand out: the tree must have 10-12 concrete scientific situations as branch points (like unreproducible preprints or unattributed textbook constants), leading to 7-8 major philosophical positions. Each leaf needs a plain-English cost assessment. Crucially, branches can't presuppose philosophical knowledge - questions like "do you require positive reasons for each testimony?" would be cheating. 

  The institutional trust dimension feels vital - the user specifically mentions trusting chains (calibration traces, lab notebooks) over individual testifiers. I'll need to integrate this early in the tree and later analyze whether it cross-cuts traditional categories. Their suspicion about "institution-focused positive reasons" deserves special attention in the logical space mapping.

  For structure, I consider starting with foundational forks: 1) whether testimony requires verification to be rational, 2) if reasons must be case-specific. Then drill into scenarios exposing fault lines - e.g., irreproducible data tests local vs global reductionism, while anonymous referee comments challenge entitlement views. The institutional question ("trust hinges on systems or people?") should appear mid-tree where it can redirect multiple paths.

  Leaf positions will cover: Humean reductionism, local reductionism, Reid/Coady anti-reductionism, Burgean entitlement, Lackey's dualism, Faulkner/Moran assurance views, and perhaps a deflationary option. Each gets a one-sentence cost: e.g., anti-reductionism's burden of distrusting all testimony, reductionism's investigative workload.

  Post-tree, I'll map the logical space using branch questions as axes, flagging empty cells. The user's hypothesized "institutional positive reasons" position might indeed exist in Lackey's neighborhood. I'll note inseparable pairs (e.g., local reductionism vs dualism on some axes) and flag any questions where both answers seem scientifically absurd - perhaps "always verify personally" which no working scientist does.

  The tone should stay concrete: when asking about dead-footnoted sources, I'll frame it as "does this citation's decay change your belief?" not "what is testimonial justification?" Printability demands minimal jargon, with leaf names as the only technical terms.
answer: |-
  Here's a decision tree designed for scientists, using concrete scientific scenarios to navigate the testimony debate. Questions are operational, branch points avoid presupposing philosophical knowledge, and leaves specify the philosophical position & its practical cost.

  **Decision Tree: The Testimony Debate for Scientists**

  **Start:** You encounter a scientific claim relying on others' testimony (e.g., a value, method, result). How do you approach its justification?

  1.  **Q1: Would you *only* rationally accept this claim if you had verified it yourself through direct observation or your own reasoning? (e.g., Do you physically need to check the instrument calibration log yourself before trusting the grad student's temperature report?)**
      *   **Yes** → **Leaf 1: Global Reductionism (Humean)**. *Cost:* Immense personal verification workload; paralyzing skepticism towards nearly all scientific knowledge.
      *   **No** → Go to Q2.

  2.  **Q2: Does accepting *this specific claim* rationally require you to have *positive, case-specific reasons* to think *this specific source* is reliable *in this instance*, beyond just "they said it"? (e.g., When the preprint authors refuse data, do you need specific evidence *about them or this paper* to believe the claim, beyond their credentials?)**
      *   **Yes** → Go to Q3.
      *   **No** → Go to Q5.

  3.  **Q3: Where do the required "positive reasons" primarily come from? (e.g., When trusting the co-author's purity claim, is your positive reason based on *your assessment of the system* (lab QC, their expertise record) or on *their act of telling you* being a reason itself?)**
      *   **Primarily from assessing the source/system (expertise, track record, institutional safeguards, coherence)** → **Leaf 2: Local Reductionism**. *Cost:* Significant investigative effort per claim; potential for inconsistency if criteria aren't applied uniformly.
      *   **Primarily from the speaker's *act* of telling you (their assurance, taking responsibility)** → Go to Q4.

  4.  **Q4: Is the speaker's act of telling you *sufficient* by itself to justify belief (if competent/sincere), or is it just a *necessary component* alongside other evidence? (e.g., When the co-author swears the sample is pure, is their sincere assurance *enough* for you, or do you still need independent checks?)**
      *   **Sufficient by itself (if competent/sincere)** → **Leaf 3: Assurance/Trust View (Faulkner, Moran)**. *Cost:* Vulnerability to deception; requires strong interpersonal assessment skills; struggles with institutional/impersonal testimony.
      *   **Necessary but not sufficient; needs other evidence** → **Leaf 4: Dualist View (Lackey)**. *Cost:* Must constantly balance speaker-dependent and content/context-dependent factors; complex justification.

  5.  **Q5: Is your default acceptance based on the *content* of the claim being generally plausible, or on the *source* having a general right to be trusted? (e.g., When the textbook lists an unsourced constant, do you accept it because it *fits* with established knowledge, or because textbooks *are* generally reliable sources?)**
      *   **Primarily the *content* fitting established knowledge/plausibility** → **Leaf 5: Humean Anti-Reductionism (often misattributed; weaker than Reid)**. *Cost:* Reliance on coherence can reject true outliers or accept plausible falsehoods; still requires significant background knowledge.
      *   **Primarily the *source's* general right to be trusted (competence/sincerity presumed)** → Go to Q6.

  6.  **Q6: Does this default trust apply only to *individuals* you perceive as competent/sincere, or does it extend to *institutions, systems, or chains* of testimony? (e.g., When trusting the calibration traceable to a foreign standard, is it based on trusting *the individual tech* or trusting *the institutional calibration system* itself?)**
      *   **Primarily individuals** → **Leaf 6: Anti-Reductionism (Reid/Coady)**. *Cost:* Difficulty trusting impersonal systems/anonymous sources; struggles with large-scale collaborative science.
      *   **Primarily institutions/systems/chains** → Go to Q7.

  7.  **Q7: Is your trust in the system/institution based on an *entitlement* (a default right to rely on it without evidence), or on a *presumption* of its reliability built from past success? (e.g., Do you trust the calibration chain *because* it's the standard system (entitlement), or *because* such systems have proven reliable before (presumption)?)**
      *   **Entitlement (default right to rely)** → **Leaf 7: Entitlement View (Burge)**. *Cost:* Hard to justify why we have this entitlement; requires accepting some sources as authoritative without proof.
      *   **Presumption from past success** → **Leaf 8: Institutional Anti-Reductionism (Reid/Coady extended)**. *Cost:* Requires faith in systemic stability; vulnerable if systems break down or lack transparency.

  **Optional Deflationary Path (Can be reached from Q2 or Q5):**
  *   **Q-D: When you accept a testimonial claim, do you fundamentally see it as relying on a *distinct source* of knowledge ("testimony"), or just as ordinary inference based on observed utterances? (e.g., Is "Dr. Smith said X" meaningfully different *as evidence* from "The instrument read Y"?)**
      *   **Not fundamentally distinct; just inference/perception** → **Leaf 9: Deflationism/Reduction to Perception+Inference**. *Cost:* May struggle to capture the unique social/normative dimensions of testimony; blurs lines.

  ---

  **Analysis & Logical Space**

  1.  **The Institutional Axis:** Question 6 explicitly targets the individual vs. institutional source. This axis **cuts across the reductionism debate**. You can be:
      *   A *local reductionist* about institutions (requiring case-specific evidence for a lab's system).
      *   An *anti-reductionist* about individuals but a *reductionist* about institutions (Reid + Skepticism).
      *   An *entitlement* theorist focused on institutions (Burge extended).
      *   The tree places "institutional trust" primarily within the anti-reductionist branch (Q6), but a local reductionist (Leaf 2) could *also* demand positive reasons specifically about an *institution* for a given claim. This is the cell you suspected: **"Positive reasons required, but of the institution rather than the individual."** This fits within **Local Reductionism (Leaf 2)**. For example: "I need evidence *this specific lab's* QC procedures were followed *this time* before I trust their purity claim."

  2.  **Logical Space (Using Key Branch Questions as Axes):**
      *   **Axis 1 (Q1):** Requires Personal Verification? (Yes/No)
      *   **Axis 2 (Q2):** Requires Case-Specific Positive Reasons? (Yes/No)
      *   **Axis 3 (Q6):** Trust Primarily Individual or Institutional? (Ind/Inst)
      *   **Axis 4 (Q7):** Institutional Trust Based on Entitlement or Presumption? (Ent/Pre) *[Only applies if Inst]*
      *   **Axis 5 (Q3/Q4):** Nature of Reasons/Assurance? *[Complex sub-axis]*

      **Empty/Incoherent Cells:**
      *   **(Yes, Yes, ?, ?, ?):** Global Reductionism (Leaf 1). Requires personal verification *and* case-specific positive reasons? Incoherent. If you require personal verification, needing case-specific reasons for testimony is moot.
      *   **(No, No, Inst, Ent, ?):** Entitlement View (Leaf 7). Filled.
      *   **(No, No, Inst, Pre, ?):** Institutional Anti-Reductionism (Leaf 8). Filled.
      *   **(No, No, Ind, ?, ?):** Anti-Reductionism (Reid/Coady - Leaf 6) or Humean Anti-R (Leaf 5) depending on Q5. Filled.
      *   **(No, Yes, Ind, ?, From System/Content):** Local Reductionism (Leaf 2). Filled.
      *   **(No, Yes, Ind, ?, From Assurance):** Requires Assurance view (Leaf 3) or Dualism (Leaf 4) depending on Q4. Filled.
      *   **(No, Yes, Inst, ?, From System/Content):** Local Reductionism (Leaf 2 - focused on institution). **This is your cell.** Filled.
      *   **(No, Yes, Inst, ?, From Assurance):** *Empty/Incoherent?* Trusting an impersonal *institution/system* primarily because of its *act of telling you* (assurance) doesn't map well onto existing theories. Assurance is typically interpersonal. This combination seems **unattractive/unmapped**.
      *   **(No, No, Inst, ?, ?) & (No, No, Ind, ?, ?):** Deflationism (Leaf 9) could potentially sit here, denying the distinctness of testimony regardless of source type.

  3.  **Indistinguishable Leaves (Without Further Questions):**
      *   **Local Reductionism (Leaf 2) vs. Dualism (Leaf 4)** on institutional claims where the scientist *does* have positive systemic reasons *and* perceives institutional assurance. *To Separate:* Ask Q3/Q4 specifically about an institutional claim: "When trusting the calibration certificate, is the crucial factor the documented traceability (system) or the fact the institution issued it (assurance)?" System → Local Reductionism; Assurance → Dualism (likely leaning towards "other evidence" needed).
      *   **Anti-Reductionism (Leaf 6 - Individual) vs. Assurance View (Leaf 3)** when the source is a trusted individual. *To Separate:* Ask Q4: "Is the trusted colleague's sincere assurance *sufficient by itself* for you to believe a surprising claim, or do you still need some independent plausibility/check?" Sufficient → Assurance; Not sufficient → Anti-Reductionism (trust requires competence *presumption*, not just assurance).
      *   **Humean Anti-Reductionism (Leaf 5) vs. Institutional Anti-Reductionism (Leaf 8)** on textbook constants. *To Separate:* Ask Q6 specifically: "Do you accept the constant because it *fits* (content) or because it's *in the textbook* (source/institution)?" Content → Humean Anti-R; Source → Institutional Anti-R.

  4.  **Potentially Absurd Branch Points (From a Working Scientist's View):**
      *   **Q1 (Require Personal Verification):** Answering **"Yes"** is practically absurd for any working scientist. Modern science is *built* on distributed labor and trust in others' work. This reveals why strict Global Reductionism (Leaf 1) is seen as a non-starter for understanding actual scientific practice.
      *   **Q2 (Require Case-Specific Positive Reasons - Always):** Answering **"Yes"** for *every single testimonial claim* (like every constant in a paper, every method described) would also be cripplingly inefficient and absurd in practice. This highlights the intuitive pull of *some* form of default acceptance (anti-reductionism or entitlement) for routine scientific communication. Scientists constantly accept claims without actively gathering positive reasons for *each one*.

  This tree provides a concrete path through the philosophical landscape using scientific dilemmas. The institutional dimension is crucial and not orthogonal, revealing hybrid positions like institutional local reductionism. The empty cell (Institutional + Case-Specific Reasons + Based on Assurance) highlights a potential gap in mapping theories to impersonal systems. Print and enjoy the debate!
