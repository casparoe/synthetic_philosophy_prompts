prompt: |-
  ok so I'm doing my EPQ on whether the language you speak changes how you think, and I've been going through all the famous examples trying to work out which ones I actually buy. My verdicts are a proper mess and I want to know what principle, if any, sits behind them. Please write the answer in American English, even though I don't.

  - Russians spot the difference between a light and a dark blue quicker than English speakers do, and the advantage vanishes if you make them do a word task at the same time: I think that one's solid, and it's about perception itself, not just what they remember afterwards.
  - Speakers of that Australian Aboriginal language who have to say things like there's an ant on your south-west leg: I think they genuinely have a different sense of direction to me, not just a different habit of describing it.
  - German speakers calling a bridge elegant and Spanish speakers calling it sturdy, apparently because of the noun's gender: half-believed. It feels more like a party trick than a way of seeing.
  - Whorf's story about the bloke who chucked a cigarette into a drum marked empty of petrol: no weight at all, he was just careless.
  - Whorf's claim that Hopi has no way of thinking about time, and the linguist who spent years showing it does: I feel like that killed the whole hypothesis for me.
  - The New Guinea group with only two colour words who did just as well as English speakers on a colour memory test: nothing there. But a very similar study on another New Guinea language, one that seperates yellow and green differently, apparently did find an effect, and I can't tell you why I'd trust the second and not the first. That's the pair I keep going round in circles on.

  So: can you give me a principle, clause by clause, saying which case each clause is doing work for, and be honest about whether it can hold all six of those verdicts? What does it predict for the claim that people whose language doesn't mark the future grammatically save more money and smoke less? And if something has to go, tell me which of my verdicts is the one to drop and why.
