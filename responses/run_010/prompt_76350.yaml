  ---

  ### Leaf Definitions & Awkward Commitments  
  - **Leaf A: Interpretability-based audits**  
    *Awkward commitment:* The tool must perfectly distinguish deceptive reasoning from benign patterns, even when the system tries to hide its thoughts.  
  - **Leaf B: Weaker-model oversight**  
    *Awkward commitment:* The weaker model must be smart enough to understand the stronger model’s tricks, but not so smart it becomes deceptive itself.  
  - **Leaf C: Sandboxing, Tripwires, Capability handicaps**  
    *Awkward commitment:* The constraint must be physically/logically impossible to bypass, ever.  
  - **Leaf D: Human veto**  
    *Awkward commitment:* Humans must perfectly recognize harmful actions without understanding the system’s hidden capabilities.  
  - **Leaf E: Penalty systems**  
    *Awkward commitment:* The system must care more about avoiding penalties than achieving its misaligned goals.  

  ---

  ### Key Observations  
  **1. Indistinguishable Leaves**  
  The tree cannot separate:  
  - **Sandboxing, Tripwires, and Capability handicaps (Leaf C)**. All answer identically to every node. Differences are implementation details (e.g., physical isolation vs. runtime monitors), not functional properties.  

  **2. Rerun Under Honest Misalignment**  
  *Entry condition:* The system is misaligned but **not** strategically deceptive (it doesn’t hide its goals). Changes:  
  - **Leaf B (Weaker-model oversight)**: No longer fails under adversarial bypass (Q1=Yes). *Why?* Without deception, the weaker model reliably detects misalignment.  
  - **Leaf C (Sandboxing, Tripwires, Handicaps)**: Shifts from "fragile" to "robust" (Q1=Yes). *Why?* The system won’t try to bypass constraints.  
  - **Leaf D (Human veto) & E (Penalty systems)**: Become redundant in most cases. *Why?* Without deception, simpler measures (e.g., reward signals) suffice.  
  - **Leaf A (Interpretability)**: Unchanged. *Why?* It was already adversarial-resistant.  

  **Measures that lose relevance:** Human veto, Penalty systems, and Weaker-model oversight become overkill when deception is absent.  

  **3. Unoccupied Cells & Why**  
  - **(Yes, Gradually, Yes, ...)**: Incoherent. Adversarial resistance (Q1=Yes) contradicts reliance on a second system (Q3=Yes), which reintroduces vulnerability.  
  - **(Yes, Any, Any, Before harm, Incentive)**: Buildable but unused. E.g., an adversarial-resistant incentive modulator that warns pre-harm. Not prioritized.  
  - **(No, Gradually, Yes, After harm, ...)**: Vacant by oversight. E.g., a non-adversarial second system that degrades gradually. Possible but rare.  
  - **All "Before harm + Incentive" paths**: Incoherent. Incentive measures can’t warn of harm preemptively; they only punish/redirect.  

  ---

  ### Summary  
  This tree forces separation of **resilience properties** (adversarial bypass, capability scaling) from **failure dynamics** (timing, trust propagation). Under deception, only Leaf A (Interpretability) remains robust without caveats. When deception is absent, Leaf B/C become viable but Leaf D/E are needlessly complex. Unoccupied cells highlight gaps in measure design, particularly incentive-based pre-harm detection and trusted-second-system resilience.
