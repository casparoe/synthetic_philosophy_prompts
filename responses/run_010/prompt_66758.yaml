prompt: |-
  Something's been bugging me about how cryptography actually gets done in practice, and I want to work out what it's committed to philosophically before I trust any of it.

  Here's the setup as I understand it. We have a few primitives that are provably unbreakable, full stop — the one-time pad, Shamir's secret sharing, that sort of thing. Nobody uses them for anything except very special cases. Instead basically all real security — TLS, signing, banking, messaging apps — rests on problems we cannot prove are hard: factoring, discrete logs, and for the symmetric side, the hope that nobody finds a shortcut against AES. The "security proofs" people write are reductions: break the scheme and you can factor. But nobody can prove factoring is hard, and the general expectation is that we probably can't, at least not in any proof system strong enough to be interesting.

  Meanwhile the same community has norms that sound like the opposite epistemology entirely: don't roll your own crypto, submit a design to years of open cryptanalysis before deploying it, formally verify the implementations, and treat a single working attack as fatal no matter how obscure. And key sizes get chosen by standards bodies — 128 bits here, 3072 bits there — with the justification being estimates of the running time of the best currently known algorithms plus a fat safety margin, which is an engineering judgement rather then a theorem.

  So what theory of knowledge does this practice presuppose? A few things I want dealt with specifically:

  1. The assumption is universal over an unbounded class — no efficient algorithm exists, for any adversary, including ones nobody will ever write down — but its a universal claim about an unbounded class — but the only evidence offered is that very clever people have failed. Does the practice presuppose an inference from absence of counterexamples to something law-like? And why does that inference feel legitimate here when it would be scandalous in, say, number theory?

  2. There's a weird asymmetry: one algorithm refutes the assumption conclusively, and no amount of failed attacks confirms it. Some people talk about complexity assumptions as though they were empirical, more like a thermodynamic law than a theorem — is that what the practice is actually doing, or something else? Note that Shor's algorithm showed the hardness is contingent on what physics the attacker has available, which seems to make the empirical reading both better and worse at the same time. Say which, and why.

  3. Why isn't provable security wanted? The one-time pad is provable and useless at scale, because the key has to be as long as the message, used once, and delivered over a channel that is already secure. That suggests the practice presupposes logistics is the binding constraint and that mathematical hardness is a cheap stand-in for a physically secure channel. Is that a claim about knowledge or just about cost? And can more than one theory license it — i.e. where exactly is the practice philosophically underdetermined, such that a realist about complexity classes and someone who thinks hardness is just a sociological fact about our current algorithmic toolkit would both be perfectly happy with the identical deployed systems?

  4. Is the whole thing internally consistent at all — the "demand proof" norms sitting on top of an admittedly unprovable foundation — or does it only look inconsistent because "proof" is doing two different jobs at the two levels?

  Then the counterfactual: what would have to change, in practice and in how the field describes itself, if we adopted a strictly information-theoretic stance and refused to trust anything that isn't unconditionally secure? Do we end up with quantum key distribution everywhere and enormous key-management overhead, or do we discover that the thing we were really leaning on was never hardness but something else — trust in a community, say, or in the slowness of publication?

  Please answer in British English. Be concrete about the practice itself, and keep separating what it strictly presupposes from what it merely happens to fit well with.
reasoning: |-
  Okay, the user is grappling with the philosophical underpinnings of cryptographic practice, specifically the tension between provable security in theory and the reliance on unproven hardness assumptions in practice. They've outlined several pointed questions about epistemology, the nature of evidence in cryptography, and the internal consistency of the field's norms. 

  First, I need to unpack their core concern: they see a paradox where cryptographers demand rigorous proofs (for implementations and protocols) while building everything atop foundations that are inherently unprovable. Their questions drill into this contradiction. 

  The user is clearly well-informed—they reference one-time pads, Shamir's secret sharing, AES, factoring, discrete logs, and even Shor's algorithm. Their frustration is philosophical: why does this "unprovable foundation + obsessive proof demands" structure feel intellectually legitimate? They're not questioning cryptography's effectiveness but its epistemological coherence.

  Breaking down their four queries:
  1. **Universal claims from absence of counterexamples**: They note that hardness assumptions claim no efficient algorithm exists (ever), yet evidence is only "clever people failed so far." Why is this acceptable here but not in pure maths?
  2. **Asymmetry and empirical status**: One break kills the assumption; no breaks don't confirm it. And Shor showed hardness depends on physical reality. Does crypto treat assumptions like empirical laws?
  3. **Why provable security isn't wanted**: They suspect it's logistics—mathematical hardness is a "cheap stand-in" for physical security. Is this about cost or deeper epistemology? Could realists and anti-realists both accept the practice?
  4. **Internal consistency**: Are "demand proof" norms incoherent when foundations are unprovable? Or is "proof" used differently at different levels?

  Finally, they ask a counterfactual: what if we *only* used information-theoretic security? Would it force QKD everywhere, or reveal that trust was always social?

  I need to answer in British English, staying concrete about practice while separating strict presuppositions from convenient fits. The user wants philosophical clarity, not reassurance.

  Key angles to address:
  - **Evidence in crypto vs. maths**: In maths, absence of proof isn't evidence; in crypto, sustained cryptanalysis *is* treated as evidence for hardness. This isn't scandalous because crypto's assumptions are falsifiable (breaks happen) and have utility (working systems). Maths seeks eternal truth; crypto seeks cost-effective security *now*.
  - **Asymmetry**: Yes, hardness assumptions behave like empirical hypotheses. Shor didn't "disprove maths" but showed factoring's hardness is physical-world-contingent. Crypto practice already accepts this—it's why post-quantum crypto exists.
  - **Logistics as driver**: Absolutely. The strict presupposition is that *efficient* and *scalable* security is paramount. OTPs are provable but useless for TLS. Complexity assumptions aren't "cheap" but *necessary* for modern systems. Both realists (who believe P≠NP) and anti-realists (who see hardness as current human limitation) can accept the practice because it delivers functional security regardless of ontology.
  - **"Proof" doing two jobs**: Exactly. At the foundation level, "proof" means reduction to a hardness assumption. At the implementation level, it means formal verification against *known* flaws. The norms aren't inconsistent; they're layered.

  For the counterfactual: Strict information-theoretic security would collapse most digital infrastructure. QKD is niche (cost, range limits), and key management would be monstrous. We'd realise that modern crypto leans on *both* mathematical hardness *and* trust in processes (e.g., NIST competitions, peer review). But crucially, we'd also see that "unconditional" security often depends on physics (e.g., QKD assumes quantum mechanics holds), which is itself unprovable. So even "provable" security has a pragmatic core.

  The user's deepest itch might be whether crypto practice is philosophically honest. Answer: yes, because it transparently treats hardness assumptions as axioms. The field's "proof" demands are about minimising *unnecessary* risks, not achieving mathematical certainty.
answer: |-
  Right, let's dissect this properly. Cryptography in practice *is* a fascinating philosophical beast, sitting at the crossroads of mathematics, computer science, engineering, and a hefty dose of pragmatism. Your observations about the tension between unprovable foundations and rigorous practice are spot on. Here's a breakdown of what the practice strictly presupposes versus what it accommodates, addressing your specific points:

  ### 1. Universal Claims & Absence of Counterexamples: Why Not Scandalous?
  *   **Strict Presupposition:** The practice presupposes that sustained, intensive, expert cryptanalysis provides *probabilistic evidence* (not proof) that no efficient algorithm for the hard problem (factoring, DLOG, etc.) currently exists *within the known realms of mathematics and computational models*. It does **not** presuppose absolute, eternal, mathematical certainty of hardness. The inference is from "many clever adversaries have tried very hard and failed" to "it is currently intractable for *any* realistic adversary."
  *   **Why Legitimate Here vs. Number Theory?**
      *   **Falsifiability & Stakes:** In number theory, a conjecture (e.g., Goldbach) is a pure truth claim. Its falsity wouldn't collapse systems people rely on daily. Cryptography rests on assumptions that *are* actively falsifiable – a single efficient algorithm breaks it. The high stakes (security of money, communications, state secrets) demand acting *as if* the assumption holds, based on the best available evidence (absence of breaks), even without proof. It's a risk management exercise.
      *   **Utility Focus:** Cryptographic hardness assumptions are valued for their *utility* in building secure systems, not solely for their mathematical beauty. If an assumption withstands decades of concerted attack and enables secure systems, its practical value justifies its use, even if its ultimate mathematical status is unknown. Number theory seeks truth; applied crypto seeks functional security *now*.
      *   **Community Process:** The "years of cryptanalysis" norm formalises this evidence gathering. It presupposes that the collective effort of the cryptographic community is the best available method for stress-testing these assumptions. Failure to break is treated as *evidence* of current hardness, not proof of eternal impossibility.

  ### 2. Asymmetry & The Empirical/Physical Contingency
  *   **Strict Presupposition:** The practice presupposes that cryptographic security is fundamentally **computational** and **contingent**. It is contingent on:
      *   The current state of algorithmic knowledge.
      *   The computational model (classical vs. quantum).
      *   Physical laws (as Shor's algorithm starkly revealed).
  *   **Why the Empirical Reading Fits (and Why Shor Validates It):**
      *   **Asymmetry is Inherent:** A break is concrete (here's the algorithm, it works). "Confirmation" can only ever be provisional ("we haven't found a break yet"). The practice embraces this. Security levels (128-bit, 3072-bit) are set based on *estimates* of the computational effort required by the *best-known algorithms* plus a safety margin. This is inherently empirical and engineering-led, akin to estimating the force needed to break a physical lock.
      *   **Shor's Impact:** Shor didn't invalidate the *approach*; it validated its *contingency*. The practice presupposes that assumptions *must* be re-evaluated if the computational model changes (e.g., large quantum computers). The field *immediately* pivoted to post-quantum cryptography research. This shows the practice treats hardness assumptions as *hypotheses about the physical and computational world*, not immutable mathematical truths. The empirical reading becomes *better* because the field demonstrably adapts to new physical realities (quantum threat). It becomes "worse" only if one naively hoped the assumptions were eternally true mathematical statements.

  ### 3. Why Provable Security Isn't Wanted (or Rather, Why it's Insufficient)
  *   **Strict Presupposition:** The practice presupposes that **scalability, efficiency, and practicality are paramount constraints** that unconditionally secure primitives (like OTP) fail to meet for most applications. It presupposes that **computational hardness assumptions provide a sufficiently good approximation of a physically secure channel at a vastly lower logistical and cost burden.**
  *   **Knowledge vs. Cost:** It's both, inseparably. The *knowledge* claim is that, based on current evidence, the computational problem *is* hard enough to make attacks infeasible *within practical timescales and budgets*. The *cost* claim is that building and managing the physical/logistical infrastructure for unconditional security (like distributing OTP keys globally for the internet) is astronomically more expensive and complex than relying on mathematically hard problems and digital key exchange.
  *   **Underdetermination & Realism vs. Sociological View:**
      *   **Realist:** Believes P ≠ NP, factoring *is* intrinsically hard (even if unprovably so), and crypto leverages this fundamental truth. The practice fits perfectly.
      *   **Sociological/Anti-Realist:** Believes "hardness" just means "no one knows how to break it efficiently yet, and the community scrutiny makes it likely no one will soon." The practice *also* fits perfectly. The deployed systems, key sizes, and security proofs work identically regardless of whether the underlying hardness is a fundamental truth or a robust social consensus about current capabilities. **The practice is philosophically underdetermined precisely here:** it functions based on the *current state of play* regarding what can be efficiently computed, agnostic to the deeper ontological status of complexity classes. Both viewpoints accept the evidence of sustained cryptanalysis as sufficient justification for deployment.

  ### 4. Internal Consistency: "Demand Proof" Norms vs. Unprovable Foundations
  *   **Strict Presupposition:** The practice presupposes a **strict hierarchy of "proof"** and is internally consistent *because* of this separation:
      1.  **Foundation Level (Hardness Assumptions):** "Proof" means a **reduction**: "Breaking this scheme efficiently is *at least as hard as* solving this well-studied problem (e.g., factoring)." This doesn't prove the scheme is unbreakable; it proves its security is *equivalent* to the hardness of the underlying problem. It presupposes the problem *is* hard based on evidence (cryptanalysis).
      2.  **Construction Level (Schemes & Implementations):** "Proof" means **mathematical verification** within the model defined by the hardness assumption. This includes:
          *   Formal security proofs (reductions) showing no flaw *relative to the assumption*.
          *   Formal verification of code: proving the implementation *correctly instantiates* the mathematical scheme, eliminating side-channels and logic errors.
          *   Cryptanalysis: Proving the scheme *isn't broken* by any *known* method, even within the model.
  *   **Consistency Achieved:** The "demand proof" norms apply rigorously *within their respective levels*. The reduction proof demands certainty that the scheme's security *depends entirely* on the hardness assumption and has no easier backdoor. The implementation proof demands certainty that the code faithfully executes the scheme. The unprovability of the foundational hardness assumption *is acknowledged and accepted* as a separate matter, addressed by the evidence-based cryptanalysis process. "Proof" means something different and more specific at each level.

  ### The Counterfactual: Strictly Information-Theoretic Stance
  If cryptography *only* used unconditionally secure primitives (OTP, IT-secure secret sharing, QKD for key exchange):
  1.  **Radical Practical Shift:** Vast majority of current systems (TLS, PGP, blockchain, digital signatures, online banking, secure messaging apps) would vanish. Secure communication would require pre-shared keys as long as the total message volume.
  2.  **Key Management Apocalypse:** The logistical overhead would be colossal. Distributing, storing, and synchronising massive keys securely *in advance* for all possible communications becomes the dominant, near-impossible challenge. QKD helps *only* for key exchange between two points with dedicated fibre, not for scaling to billions of users/devices or offline use. Key management, not mathematical hardness, becomes the single point of failure and astronomical cost centre.
  3.  **Revealed Leaning:** This counterfactual starkly reveals that modern cryptography leans overwhelmingly on **two things**:
      *   **Computational Hardness Assumptions:** As the *engine* enabling efficient, scalable security without pre-shared secrets.
      *   **Trust in Process & Community:** The norms (standardisation, peer review, cryptanalysis) provide confidence that the assumptions *currently hold* and the implementations are correct. The *slowness* of academic cryptanalysis and publication acts as an early warning system.
  4.  **Philosophical Shift:** The field would have to abandon talk of "computational security" or "128-bit security" based on algorithm estimates. Security claims would be absolute ("information-theoretically secure") but heavily qualified by the *logistical* security of the key distribution mechanism (e.g., "secure *if* the courier wasn't compromised"). The discourse would centre entirely on physical security, trusted couriers, QKD hardware vulnerabilities, and key storage solutions, with mathematics playing a much smaller role.

  In essence, cryptographic practice pragmatically presupposes that computational hardness, evidenced by sustained cryptanalysis and contingent on the physical/computational model, provides the most viable foundation for achieving *scalable, efficient, and practically secure* systems in the real world. It separates the unprovability of the foundations from the demand for rigorous proof *within* the models those foundations enable, relying on community scrutiny and process to manage the inherent risk. It's a philosophy of evidence-based, contingent security, not absolute mathematical certainty.
