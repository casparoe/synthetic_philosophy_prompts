prompt: |-
  so my co-author and I owe our department a jointly-signed statement for their adversarial collaboration series, deadline in 3 weeks, and after two years of arguing we still can't agree on a single sentence. She's a particularist in Dancy's line — reasons holism, no finite set of principles that a good judge consults. I'm a generalist: I think there are true contributory principles, and I think the rationality of moral judgment depends on having some of them in hand rather than on an uncodifiable sensitivity.

  Part of the problem is that we keep sliding between claims that aren't the same claim. I've started using a ladder to pin us down, and I want the statement built around it:

  rung 1 (valence): there are features F such that whenever F is present it's a reason of the same polarity, though its weight can vary;
  rung 2 (statable): the relevant features, and the conditions that switch them on or off, can be written down finitely, provisos included;
  rung 3 (guide): a competent agent should use those written-down principles in deliberation, as opposed to treating them only as the standard that makes her judgments correct.

  I take all three. She says she denies only rung 3, and I think thats false, but I can't prove it — she'll happily agree to rung-1-sounding claims about pain and then say the principle stating them isn't doing any of the work.

  Also useful for the drafting: two different ways a principle's application can fail. Sometimes a condition just switches a feature's reason-giving power off while leaving its polarity intact (the promisee lets you off). Other times it looks like the polarity itself flips (that the act would give someone pleasure seems to count against it when the pleasure is in another person's suffering). She says the second kind exists and does all the work. I say every alleged flip is really the first kind once you describe the feature properly — that the feature was never just giving pleasure but giving innocent pleasure, and that the generalist is allowed to individuate features that finely.

  Write the joint statement. What I need:

  1. a numbered list of claims we can both sign, and make them carry weight — not "moral judgment is context sensitive," which we both consider filler;
  2. the disagreements that survive, as a table with columns: issue / her wording, phrased so she'd sign it / my wording, phrased so I'd sign it / which rung it sits on;
  3. the cruxes — the sub-questions where a settled answer would actually move one of us — and for each, say which side it moves and in which direction;
  4. for each crux, a case or line of argument we'd both grant bears on it, plus each side's prediction, written down in advance so were on the hook for it.

  And if you think a chunk of this is verbal — my suspicion is that the fine-grained-description move plus the ladder confusion covers a lot of it — tell me which chunk, and what the real question underneath is. No citations, no reading list, don't tell me who argued what. I just want the formulations exact.
