prompt: |-
  I'm working on a novel whose narrator is a former government communications director — the kind of person who has spent twenty years turning events into narratives and is now, late, trying to work out whether any of it was lying. For research I read a long magazine essay about post-truth politics that leans hard on Arendt, and I want to know how much of it I can safely put in this man's mouth before I make him sound like an idiot to anyone who's actually read her.

  Here's the passage, which I've broken into numbered sentences so we can go through them one at a time. The essay is by someone who clearly knows the material, so I'm assuming the trouble is going to be subtle rather than obvious:

  1. Arendt wrote about political lying mainly twice — once in a sixties essay on truth and politics, once in a piece on the Pentagon Papers — and the two are doing different jobs: the first asks why factual truth is so fragile in politics generally, the second asks what a particular government actually got up to.
  2. Her starting point is that lying is nothing new: truthfulness, she says, has never counted among the political virtues, and lies have always been regarded as justifiable tools in political dealings.
  3. What changed in the twentieth century is that governments stopped merely hiding facts and started unmaking them — the modern lie doesn't cover over something secret, it destroys the very thing it contradicts.
  4. It can do that because a factual truth, unlike a logical or mathematical one, carries no necessity with it; whatever happened could always have happened otherwise, and that gap is precisely where the liar sets up shop.
  5. This is also why the liar starts out ahead of the truth-teller: he knows the facts and can build a story that is tidier and more appealing than the mess they really make, which is why lies travel faster and stick harder than the truth does.
  6. She holds that lying about the past is the worst kind, since the past is fixed and, in a bureaucratic state, documented, whereas lying about the future is almost respectable — there are no facts about it yet, and the liar's "things will be otherwise" is close to what the statesman is claiming when he acts.
  7. The Pentagon Papers confirmed all of it: they revealed an administration that had spent years successfully rewriting the record of the war for the American public, and that only came apart when the documents got out.
  8. Arendt's conclusion is the bleak one — that once every institution has an image to manage and every fact is up for arguement, nothing is so well established that it can't be argued away.
  9. So the real damage isn't done to truth as such but to the common world people share, and that's a loss no amount of fact-checking repairs.

  I typed out one line myself from the essay so I'd have at least one thing to check against, and sentence 2 is quoting it: truthfulness has never been counted among the political virtues, and lies have always been regarded as justifiable tools in political dealings. Does the essayist deploy that line the way Arendt deploys it, or has he quietly turned a description into a permission?

  Go sentence by sentence. For each one tell me whether a careful Arendt reader would nod, wince, or object outright, and seperate out three things I can't tell apart on my own: what's just right, what's a fair simplification that loses a distinction she cared about, and what she'd actually deny. I especially want to know about 5, 6 and 7, because those are the ones my narrator would find most flattering about himself, and if Arendt wouldn't say them I need to rewrite him. Then tell me whether 8 and 9 survive once the earlier sentences are corrected — i.e. is the bleak conclusion still available on the accurate version of her view, or does it depend on the bits that don't hold up?

  Don't send me off to read anything or give me a bibliography; I want your own judgment on these sentences as I've set them out. And finish with a last line in exactly this form, since I'm keeping a spreadsheet of the sources I trust:

  Verdict: [fair|fair-but-slanted|half-wrong|strawman], [n]/9 outright wrong
