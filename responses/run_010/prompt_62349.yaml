prompt: |-
  I cover probability and physics for a general-interest science magazine, and next month I'm giving a talk at a small institute seminar. The room will be maybe a dozen working statisticians and physicists who use probabilities every day but never touch the philosophy, plus two or three philosophers who know the Lewis literature cold. My thesis is that the Principal Principle isn't really a principle about chance at all — it's a special case of a general norm about deferring to a law-like informant — and that once you see it that way, the admissability problem stops looking like a bug. Inadmissible evidence is just evidence your informant doesn't share with you, and the principle goes quiet precisely when you know more than they do.

  Here's the sketch of my argument, which is what they'll be aiming at:

  1. Any norm of the form "match your credence to what a source tells you about how the world will distribute itself" needs an account of when you're allowed to override that source with private information.
  2. Chance claims are just the claims of an idealized informant whose evidence is the whole prior history plus the laws, and nothing indexical about you in particular.
  3. So deference holds whenever your extra evidence is stuff the informant already has, and lapses otherwise — and thats not the principle failing, it's the principle working as intended.
  4. Which means the interesting question isn't what makes evidence admissible, it's what makes an authority law-like. That's where I want to end.

  Give me a prep sheet, not a defense. In this order:

  - How the room will hear this — about 100 words: what a statistician takes my claim to be, what a philosopher takes it to be, and where those two readings come apart in a way that will bite me mid-talk.
  - Objections, worst first — six to eight, numbered. For each: how that specific person in that specific room would actually phrase it (their vocabulary, not textbook vocabulary), a reply I can deliver in about ninety seconds, and a one-line tag on where the reply is soft.
  - Concede these up front — about 150 words, the things I should give away in the first five minutes to buy credibility with the philosophers without losing the physicists.
  - The one that has to land — about 100 words: the single reply without which the whole talk collapses.
  - The question I'm hoping nobody asks — about 75 words.

  Two notes on the epistemics. Where an objection touches something that's genuinely settled among people who work on this, say so flatly; but where it's a live fight — the undermining futures business, whether chance needs the Principle in order to deserve the name at all, whether Hall-style conditionalizing actually repairs anything — mark it as contested and don't smuggle one side in as the consensus. And please flag anywhere my sketch above misstates a standard position or overstates how novel the move is. I'd much rather hear it from you than from the third row.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're preparing a seminar talk challenging the standard view of the Principal Principle (PP) as fundamentally about chance, arguing instead it's a special case of deference to a law-like informant. The audience includes statisticians, physicists, and philosophers. 

  First, I need to consider how each group will interpret the claim. Statisticians might see it as a practical rule about expert deference, while philosophers will recognize it as a metaphysical challenge to Lewis's framework. The key divergence is whether chance requires PP or is prior to it—this could cause confusion mid-talk when the informant's "law-like" nature is discussed.

  Next, objections. The user wants worst first. The top objection will likely be about collapsing chance/credence distinction. A philosopher would frame this in terms of undermining futures. The reply should emphasize the informant's idealized evidence, but it's soft on why this informant deserves the label "chance." Other objections include the need for PP in defining chance, the ad hoc nature of admissibility, and Hall's conditionalization approach.

  For upfront concessions, the user needs to grant that Lewis's PP is standard, PP fixes reference for chance, and that admissibility is messy. This builds credibility without losing physicists by keeping the core argument intact.

  The critical point to land is that admissibility problems disappear when we stop expecting PP to do metaphysical work and see it as an expert deference norm. If this doesn't resonate, the whole argument fails.

  The dreaded question is whether the informant's probabilities are chances by another name. If asked, the user must clarify that chances emerge from the informant's role in guiding credence, but it risks circularity.

  I should check if the user's sketch misstates positions. Claiming PP isn't about chance might overstate novelty—Lewis links them intrinsically. Also, reducing admissibility to informant's evidence oversimplifies; in Lewis's framework, it's about ruling out future events. Highlighting these points will help the user prepare.
answer: |-
  Here's your prep sheet, calibrated for the room and epistemic transparency:

  ---

  ### How the Room Hears This (100 words)
  *   **Statisticians:** Hear a practical "expert deference" framework. They'll assume "chance" is just a robust statistical forecast (like a hyper-informed model), and your "law-like informant" is an idealized data-generating process. The admissibility fix feels tidy and familiar (don't override the expert with info *they* baked in).  
  *   **Philosophers:** Hear a *revision* of Lewis's metaphysics. You're denying PP's role in *defining* chance, turning it into a derivative epistemic norm. "Law-like informant" sounds like a *replacement* for primitive chance.  
  *   **Divergence:** The bite comes on **metaphysical priority**. Statisticians see the informant *producing* chances. Philosophers see Lewisian chances as *prior* to the PP. When you say "chance claims *are just* claims of an idealized informant" (Step 2), philosophers hear you *reducing* chance to epistemology, denying its primitive physical status. This clashes with Lewis's view that PP *constrains* what chance *is*. Expect pushback here on whether your account *captures* chance or *redefines* it.

  ---

  ### Objections (Worst First)
  1.  **Objection (Philosopher):** "You've dissolved chance into credence! If chance *is* just what this idealized agent believes based on laws+history, then undermining futures vanish – but that's because you've eliminated objective chance altogether. Aren't you just describing a *very* well-informed credence function?"  
      *Reply:* "No, the informant's probability *assignments* are fixed by the *laws and history alone*, independent of anyone's belief. It's not the agent's credence; it's what the *laws dictate* the agent *should* assign given *only* that evidence. Undermining futures remain problematic *for the agent*, precisely because the informant's assignment doesn't account for possible future influences on the laws themselves (a contested issue!)."  
      *Soft Spot:* The ontological status of "what the laws dictate" remains murky. Is it physical or stipulative?

  2.  **Objection (Philosopher):** "Lewis *needs* the PP to fix the reference of 'chance'. If you demote PP to mere deference to an informant defined *by* laws+history, what pins down 'chance'? Your 'law-like informant' *presupposes* the concept it's meant to explain!"  
      *Reply:* "The concept 'chance' is pinned down by its *functional role*: it's the unique (or best) candidate for the informant in a deference norm guiding rational credence about future events *given* the laws and history. The laws+history define the informant's *evidence*, not the concept of chance *per se*. Chance *is* the output of this lawful process."  
      *Soft Spot:* Requires accepting a functionalist view of chance, contested by primitivists.

  3.  **Objection (Philosopher/Statistician):** "Isn't 'admissibility' just a label for the problem you're avoiding? You say inadmissible evidence is 'stuff the informant doesn't share'. But Lewis's problem was *defining* 'inadmissible' *without* circularly invoking chance or the PP. You've merely *relabeled* the problem as 'defining the informant's evidence', which seems equally hard."  
      *Reply:* "Crucially, the *informant's evidence* (laws + entire past history) is defined *independently* of the PP or the concept of chance itself. It's part of setting up the *deference scenario*. The circularity Lewis faced arose because he tried to define admissibility *using* chance/PP. I specify the informant's evidence upfront. Deference fails cleanly when your evidence isn't a subset of theirs."  
      *Soft Spot:* Defining "the entire past history" absolutely precisely remains tricky (e.g., the 'big fix').

  4.  **Objection (Statistician):** "This feels like repackaging conditionalization. If I treat the informant's report P(A) = x as evidence E, then conditionalizing on E gives credence x, unless I have other evidence contradicting E. Isn't that just standard Bayesian updating?"  
      *Reply:* "Exactly! That's the core epistemic move. The novelty is identifying the *specific type of informant* (defined by laws+history) where this deference norm *deserves* the label 'Principal Principle'. The PP isn't a *sui generis* rule; it's conditionalization applied to this very special, law-governed source."  
      *Soft Spot:* Downplays why this *specific* application is fundamental enough to be a "Principle".

  5.  **Objection (Philosopher):** "Hall's New Principle *solves* the admissibility problem *within* Lewis's framework by conditionalizing on the *entire* chance theory. Doesn't that make your 'law-like informant' redundant?"  
      *Reply:* "Hall's move *is* an improvement (contested by some on complexity grounds). But it still treats PP as fundamental to chance. My point is deeper: *needing* Hall's fix reveals that the original PP wasn't a primitive norm about chance itself, but an imperfect application of general deference to an authority (the chance theory/laws). Hall effectively *builds* the idealized informant's knowledge (of the whole theory) into the conditionalization. My view explains *why* his fix works."  
      *Soft Spot:* Hall's proponents might see it as a sufficient internal fix.

  6.  **Objection (Physicist/Statistician):** "In practice, 'laws+history' is never complete. We use probabilities based on models with limited evidence. Does your 'informant' just become 'our best current scientific model'? How is this useful?"  
      *Reply:* "The idealized informant is a *regulative ideal*. In practice, we defer to the best *available* law-like informant – our best physical theories and data. The norm is: 'Set credence to what the *best available model/theory, given its evidence base*, says, unless you possess relevant evidence *outside* that model's evidence base.' The PP is the perfect, unattainable limit."  
      *Soft Spot:* Risks making "chance" overly context-dependent.

  ---

  ### Concede These Up Front (150 words)
  "Let's be clear: Lewis's Principal Principle, linking rational credence to objective chance, is foundational in modern philosophy of probability. It powerfully captures a core intuition. Lewis *is* right that something like the PP is central to our concept of chance – it fixes the reference. The 'admissibility problem' he identified is real and deep; attempts to neatly define 'inadmissible evidence' have proven notoriously difficult and often circular. Proposals like Hall's New Principle are serious contenders for a solution within the Lewisian framework. My goal isn't to dismiss this profound work, nor to deny the *importance* of the link between chance and credence. It's to offer a different *metaphysical perspective* on what that link *is*. I propose we see the PP not as revealing the *nature* of chance, but as describing how to *defer* to a specific, supremely authoritative *source* of information about the world."

  ---

  ### The One That Has To Land (100 words)
  **The Core Reply (When pressed on admissibility/informant):** "The 'admissibility problem' looks like a bug *only* if we expect the Principal Principle to be a fundamental metaphysical law connecting two primitive concepts: chance and credence. If we instead see it as a *special case* of the general epistemic norm to defer to an expert's pronouncements *within their domain of knowledge*, the problem vanishes. Deference norms *always* specify the expert's knowledge base. Inadmissible evidence isn't a mysterious exception breaking the PP; it's simply information *outside the idealized informant's specified evidence* (laws+history). The PP 'going quiet' isn't failure; it's the norm *correctly* telling you the expert has nothing to say on *this* matter. *That's* the shift."

  ---

  ### The Question I'm Hoping Nobody Asks (75 words)
  **The Question:** "Isn't your 'law-like informant' just *chance by another name*? If its pronouncements based on laws+history *are* what we call chance, and we *must* defer to them (modulo 'inadmissible' info), haven't you just reproduced Lewis's PP and his problem? What work is 'deference' doing besides renaming?"  
  **Why Dread It:** Forces you to either admit the reduction is mostly verbal *or* defend a subtle metaphysical distinction (chance as output vs. primitive) against charges of circularity, potentially losing physicists and frustrating philosophers. It directly challenges the novelty and substance of the "shift."
