prompt: |-
  Our street has no parking controls: the spaces outside the houses are first come, first served, and by six in the evening there are never enough of them. The council has now proposed a controlled parking zone — residents' permits, a small allocation of visitor vouchers, and penalty charge notices for anyone parked without one. At the residents' association meeting a neighbour argued against it. A common resource, he said, is like a potluck supper: everyone brings a dish, nobody has to be made to, and the person who turns up empty-handed is dealt with by raised eyebrows rather than by rules. On his account our parking problem is a failure of neighbourliness rather than of institutions, and the remedy is a street supper and a WhatsApp group, not permits and fines.

  Could you audit that analogy for me? I'd like an explicit mapping first — what in the potluck corresponds to the parking spaces, to the contribution, to the guest who comes empty-handed, to the raised eyebrows — and then the disanalogies, sorted into those that actually bear on his conclusion and those that are merely decorative. In particular, I want to know what the potluck picture quietly assumes about the visibility of a contribution, the size and stability of the group, and whether anyone can be excluded from the benefit; and whether the difference between a potluck and a contested parking space is structural, or just a matter of our neighbours being less sociable than they might be. If the analogy fails, does his conclusion fail with it, or does something weaker and defensible survive? Finally, is there a better analogy for a resource that is genuinely rivalrous but hard to exclude people from, and what would it license that this one does not?

  Please write your answer in British English.
reasoning: |-
  Okay, the user wants me to audit an analogy comparing street parking to a potluck supper. Let me start by breaking down the explicit mapping as requested. The neighbour's argument is that both are common resources managed through social norms rather than formal rules. 

  First, the potluck elements mapped to parking: the dishes contributed correspond to residents not using cars or making space for others. The empty-handed guest is someone taking a space without contributing, like a commuter parking all day. Raised eyebrows represent social disapproval instead of fines. The supper itself is the shared benefit of available parking.

  Now, considering the disanalogies. The key differences are visibility and rivalry. In a potluck, contributions are visible—everyone sees who brought what. But parking contributions are invisible; you can't tell if someone walked instead of driving. Also, parking spaces are rivalrous—one car takes a spot, leaving less for others. Dishes at a potluck aren't rivalrous; everyone can take a portion without depleting it entirely. 

  The group size matters too. A potluck works with a small, stable group where social pressure is effective. A street might have many residents, including renters who move often, making norms harder to enforce. Plus, exclusion: you can invite only certain people to a potluck, but street parking is open to anyone, including outsiders, which complicates social control.

  These structural differences weaken the neighbour's conclusion. Social pressure alone might not suffice for parking because the resource characteristics differ. Even if residents were friendlier, the invisibility and rivalry issues remain. However, a weaker point survives: fostering community could help, but it's insufficient without rules.

  Looking for a better analogy, a village green or commons makes sense. Grazing land is rivalrous and hard to exclude others from, leading to overuse without management. This analogy supports the need for formal permits, aligning with the council's proposal. It highlights that rivalry and exclusion challenges require institutional solutions, not just social norms.
answer: |-
  Here’s an audit of the potluck supper analogy, structured as requested, using British English:

  ### Explicit Mapping of the Potluck Analogy
  | **Potluck Supper Element** | **Parking Space Equivalent**        | **Purpose in Argument**                                                                 |
  |----------------------------|-------------------------------------|-----------------------------------------------------------------------------------------|
  | **Dishes contributed**     | Residents limiting car usage (e.g., walking, carpooling, parking considerately) | Represents voluntary contribution to the shared resource.                               |
  | **Empty-handed guest**     | Non-resident parker (e.g., commuter, shopper) or resident overusing spaces      | The "free rider" depleting the resource without contributing.                           |
  | **Raised eyebrows**        | Social disapproval (e.g., gossip, notes, public shaming in WhatsApp group)      | Proposed enforcement via community norms rather than formal penalties.                  |
  | **Potluck supper itself**  | Availability of parking spaces      | The shared benefit everyone enjoys when contributions are made.                         |
  | **Implicit organiser**     | Neighbourhood collective goodwill   | Assumes an organic, self-policing community dynamic.                                    |

  ### Disanalogies Bearing Directly on the Conclusion  
  *(i.e., undermine the "social norms suffice" argument)*  
  1. **Rivalry vs. Non-Rivalry**  
     - **Potluck:** Food is *non-rivalrous* (one person eating doesn’t prevent others from eating the same dish).  
     - **Parking:** Spaces are **rivalrous** (one car occupying a space directly excludes others).  
     *Why it matters:* Social norms work better for non-rivalrous goods. Parking’s rivalry creates zero-sum competition, escalating conflict beyond "raised eyebrows".  

  2. **Visibility of Contribution**  
     - **Potluck:** Contributions are **immediately visible** (everyone sees who brought a dish).  
     - **Parking:** "Contributions" (e.g., choosing not to own a car, parking further away) are **invisible**. Neighbours can’t verify who is "bringing a dish".  
     *Why it matters:* Social enforcement relies on observable behaviour. Invisible sacrifices nullify peer pressure.  

  3. **Excludability**  
     - **Potluck:** Organisers can **exclude non-contributors** ("Sorry, invite-only").  
     - **Parking:** **Exclusion is impractical** legally/socially. Outsiders (tradesmen, visitors, commuters) can’t be barred without formal controls.  
     *Why it matters:* The "empty-handed guest" at a potluck can be turned away; on the street, they cannot, making informal enforcement futile.  

  4. **Group Stability & Scale**  
     - **Potluck:** Effective in **small, stable groups** with repeated interactions (e.g., 20 regular attendees).  
     - **Parking:** Involves **larger, fluid groups** (renters, commuters, delivery drivers) with no long-term social bonds.  
     *Why it matters:* Social norms collapse when participants are transient or anonymous.  

  ### Decorative Disanalogies  
  *(Interesting but irrelevant to the core argument)*  
  - **Material vs. Spatial Resource:** Food is consumed; parking spaces are reused.  
  - **Cultural Context:** Potlucks are voluntary social events; parking is an economic/public good.  
  - **Urgency:** Parking scarcity causes daily disruption; a poor potluck is a minor inconvenience.  

  ### What the Potluck Assumes (Quietly)  
  1. **Visibility:** That all contributions and violations are observable.  
  2. **Small Scale:** A cohesive group where social sanctions work.  
  3. **Voluntary Participation:** Guests *choose* to attend and can be excluded.  
  4. **Non-Rivalry:** Enough food for all, regardless of others’ consumption.  

  ### Structural vs. Social Failure  
  The disanalogies reveal a **structural problem**, not merely antisocial neighbours:  
  - Parking is **inherently rivalrous and non-excludable** – classic "tragedy of the commons".  
  - Even perfectly "sociable" neighbours couldn’t resolve rivalry/invisibility issues via WhatsApp. A commuter isn’t part of the social group to feel "raised eyebrows".  
  - **Conclusion:** The analogy fails catastrophically; the neighbour’s conclusion (social remedies suffice) fails with it.  

  ### Weaker, Defensible Surplus  
  A sliver of truth survives: **Community cohesion *supplements* formal systems**. A WhatsApp group *could* aid permit allocation or report abuse, but it cannot *replace* controls where rivalry and scale exist.  

  ### A Better Analogy: **The Village Green Commons**  
  - **Mapping:**  
    - *Common grazing land* = Parking spaces (rivalrous: overgrazing depletes grass; overparking depletes spaces).  
    - *Shepherd owning 100 sheep* = Resident owning 3 cars.  
    - *Unregulated access* = Non-resident parkers.  
    - *Enclosure/permits* = Controlled Parking Zone (CPZ).  
  - **Why it’s Superior:**  
    - Explicitly models **rivalry** (grass regrowth vs. parking turnover) and **non-excludability** (anyone’s livestock can graze).  
    - Historically, commons **required formal management** (stinting rules, fines) to avert collapse – validating the council’s proposal.  
  - **What it Licenses:**  
    - Formal allocation (permits) and penalties *are* necessary for sustainable management.  
    - Acknowledges that social trust alone fails when individual incentives conflict with collective good ("If I don’t park here, someone else will").  

  ### Final Verdict  
  The potluck analogy misdiagnoses an **institutional problem** as a **social one**. Parking is less like a shared meal and more like contested grazing land: without enforceable rules, depletion is inevitable. The village green analogy better justifies the CPZ – and reminds us that even medieval peasants understood the need for permits.
