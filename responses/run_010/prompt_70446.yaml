answer: |-
  ## Committee Testimony on the Human Tissue Products Act

  **Chairman:** Thank you for joining us today. We are considering the Human Tissue Products Act. Our first witness is Dr. Aris Thorne, former Chief Regulatory Economist for the National Standards Bureau. Dr. Thorne, you have five minutes for an opening statement.

  **Dr. Aris Thorne (Hartian Liberal):** Thank you, Chairman. My position is this: the state must justify criminalizing conduct by demonstrating tangible harm to individuals or a demonstrable risk to indispensable social structures. The Act before you fails this test. It explicitly disclaims harm: no one is physically injured, deceived, defrauded, or endangered. The donor consents freely and revocably. The product is certified safe. The consumer commits no offence. The sole justification offered is the assertion that permitting this practice would change society’s self-understanding, causing disintegration, supported by polling showing high, stable revulsion.

  I concede widespread revulsion is a significant social fact. It signals discomfort, perhaps a sense of boundary violation. But revulsion alone cannot be the basis for law, especially criminal law. History shows our revulsions shift dramatically. Once, blood transfusion was seen as unnatural cannibalism; dissection of the dead was a horrific desecration added to the penalty for murder. Yet, society did not disintegrate when we overcame those revulsions; it integrated new understandings of medicine and science. The stability of revulsion over fifteen years in this case proves only that the *idea* hasn’t become normalized *yet*. It tells us nothing about whether normalization *would* cause harm or disintegration. Stability without challenge is not evidence of a fundamental, society-sustaining truth. It is simply the status quo.

  Furthermore, the Act’s structure is incoherent. If consuming human-tissue meat is morally repugnant enough to *criminalize its production and sale*, why is *consuming* it not also criminal? This suggests the revulsion is focused on the *idea* of the act, the commodification, rather than the act itself. But criminalizing an idea’s manifestation, absent harm, is the definition of legal moralism – using the law to enforce a majority’s moral tastes. Law should protect people, not police metaphysical notions of societal identity that cannot be falsified. The memorandum’s disintegration claim is unfalsifiable; no conceivable observation could disprove it, because any society that survives the change would be declared ‘different’, proving the claim retroactively. This makes it a dogma, not a justification.

  **Chairman:** Thank you, Dr. Thorne. Our next witness is Professor Mara Voss, Professor Emeritus of Legal Sociology at Grantham University. Professor Voss, your five minutes.

  **Professor Mara Voss (Devlinist Moralist):** Thank you, Chairman. Dr. Thorne mischaracterizes the core argument. This is not about policing tastes or enforcing dogma. It is about the fundamental role shared moral boundaries play in maintaining social cohesion. Law is not merely a harm-prevention tool; it is a constitutive force. It declares what a community collectively judges to be fundamentally incompatible with its shared life.

  The Act’s justification rests on an observable social fact: the near-universal and stable revulsion against consuming products derived from human tissue, even under the stringent safeguards specified. This revulsion, persisting for fifteen years despite technological feasibility, indicates a deep-seated boundary. It’s not merely a ‘taste’; it’s a constitutive element of *who we understand ourselves to be* as a society. Drawing on the exchange following the Wolfenden Report, the point isn't that every moral feeling must be legislated, but that society has a right to protect its fundamental moral fabric from erosion where a profound, shared judgement exists. Permitting this practice isn't just allowing a new liberty; it would be actively dismantling a shared understanding – a taboo – that forms part of the invisible latticework holding us together.

  Dr. Thorne invokes historical shifts in revulsion – dissection, transfusion. But he ignores crucial distinctions. Firstly, those shifts often occurred against *initial* revulsion precisely *because* compelling countervailing benefits – life-saving medical knowledge, life-saving treatments – became undeniable. Where is the comparable, overwhelming benefit here? It’s merely another source of meat. Secondly, look at his other list: the durable revulsions against eating horse or dog in the West. Why do they persist? Because they *also* tap into deep-seated boundaries about the categorization of animals and what is ‘food’. They haven't been overridden by necessity or overwhelming benefit. This human tissue case belongs firmly on *that* list. It strikes at a boundary concerning the human body itself, its fundamental separation from the realm of commodity and consumption.

  Regarding the asymmetry: Criminalizing production while exempting consumption is entirely coherent. The law targets the *commercialization and normalization* of the act – the point where it enters the public sphere and becomes a *social fact*. Permitting consumption privately acknowledges the limits of law enforcement but crucially avoids *endorsing* the act. However, permitting *sale* is an endorsement. It signals societal acceptance. And this is the crux: Laws that *prohibit* encode a shared negative judgement. Members of society inhabit this judgement; it provides a common reference point for reasoning about related issues (dignity, the body, commerce). Laws that *permit*, however, are silent. They do not encode a positive endorsement; they merely withdraw prohibition. A society can accumulate new permissions – new liberties – without necessarily eroding existing shared moral understandings, provided those permissions don't directly contradict a fundamental boundary. But *withdrawing a prohibition* on something held to violate a fundamental shared boundary *is* an active step. It dissolves a previously encoded common judgement. The cost isn't necessarily immediate chaos, Dr. Thorne, but a slow fraying – a loss of a specific shared certainty about a foundational limit. How do we observe this? We look for indicators: increased polarization on related moral issues, a decline in social trust, a sense of normative confusion. These are subtle, long-term effects, not a single catastrophic event. The memorandum’s claim *is* testable, albeit longitudinally: if such an Act passed, we *would* observe changes in social cohesion metrics over time compared to societies maintaining the prohibition. The burden of proof should lie with those asserting *no cost* to such a fundamental shift, not with those recognizing the inherent risk.

  **Chairman:** Dr. Thorne, you may respond.

  **Thorne:** Professor Voss makes a powerful case for the constitutive role of law, and I concede that shared moral understandings are vital for cohesion. However, her argument relies on several leaps. First, she assumes this specific revulsion defines a ‘fundamental boundary’ essential to our society. But what makes *this* revulsion fundamental while others, like dissection, were not? She points to a lack of ‘overwhelming benefit’ as distinguishing this case from transfusion. But that is precisely the point! We are criminalizing something *because* we find it revolting *and* see no benefit – using disgust as the sole justification. The ‘overwhelming benefit’ test implicitly acknowledges that revulsion alone *isn't* enough; we require a countervailing reason *to overcome it*. Here, the lack of benefit is used to justify *giving revulsion decisive weight*. This seems circular.

  Secondly, the asymmetry thesis. You claim prohibitions encode a common judgement, while permissions are merely silent. But isn't the *act* of withdrawing a prohibition itself a powerful social signal? Doesn't it encode a new common judgement: that this act is *not* so fundamentally incompatible with societal identity after all? The silence of permission is deafening in its contrast to the previous prohibition. The stable revulsion against eating horse or dog persists *despite* the absence of prohibition; society continues to encode that judgement through social norms, not criminal law. Why can’t that happen here? Why must the *criminal law* be the sole vessel for this specific judgement? The Act creates a new crime where none existed before, targeting commerce around an act it simultaneously declares legal for the individual. This seems less about encoding a shared judgement and more about using the heavy hand of the state to enforce a majority's visceral reaction against a minority activity, precisely because social norms alone might *not* suffice to maintain the revulsion in the face of technological possibility. You argue permission is silent, but criminalizing the *maker* while permitting the *eater* sends a deeply confused message about what the shared judgement actually *is*.

  Regarding testability: Your proposed observation – measuring social cohesion years after repeal – is problematic. How do we isolate the effect of *this* change from countless other social, economic, and political factors? And what baseline do we use? More crucially, if we observe no decline, does that falsify your thesis? Or would you argue, as I suspect, that society has merely become a *different* one, proving the disintegration occurred? This renders the claim untestable.

  **Voss:** Dr. Thorne presses on testability and the distinction between boundaries. First, the difference: Dissection and transfusion confronted revulsion with undeniable, concrete, life-and-death *goods*. The revulsion yielded because the benefit was not just compelling but operated in a different, tangible domain – preserving life. Here, the proposed act offers no comparable good; it’s substitutional. The revulsion stands unchallenged by necessity. Horse and dog eating avoidance persists without legal prohibition because the social norm remains robust, supported by cultural narratives and categorization. But this human tissue case is *novel*. It presents a challenge the existing social norm hasn't faced: the technical possibility of safe, consensual production. The criminal law is being considered precisely *because* the robustness of the social norm alone, in this unprecedented context, is uncertain. The law acts as a reinforcement, a declarative anchor.

  Secondly, the asymmetry. Withdrawing a prohibition *is* a signal, yes. But it’s a signal that the previously encoded *negative* judgement is no longer held. It removes a specific piece of the shared moral framework. Permitting something new doesn’t necessarily remove an existing encoded negative judgement about something else. The cost of withdrawal is the *loss* of that specific, articulated common ground. Social norms are powerful, Dr. Thorne, but they are diffuse and can shift incrementally. The criminal law prohibition is a bright line, a clear statement of a collective ‘no’. Removing it dims that line. The confusion you perceive in criminalizing the maker but not the eater reflects a practical compromise acknowledging enforcement limits while still making the crucial statement: society will not *sanction* or *normalize through commerce* this act. It draws the line at public endorsement.

  You ask how to test the disintegration thesis without confounding variables? It’s admittedly difficult, like most social science. We’d need careful comparative studies across jurisdictions with different legal stances, controlling for other variables as best as possible, looking for divergence in indicators like trust, anomie, or polarization on related bioethical issues over decades. If my thesis holds, jurisdictions permitting this would show measurable, if subtle, negative divergence on such metrics compared to those prohibiting it. If no such divergence is found despite rigorous attempts to measure it, that *would* count against the specific claim that *this* prohibition withdrawal caused disintegration. I concede that point. It’s not perfectly falsifiable in a single experiment, but it is empirically investigable over time. The absence of identifiable victims, Dr. Thorne, is not a trump card ending the argument. The potential victim is society itself, in its constitutive understanding.

  **Thorne:** Professor, you concede the test is difficult and long-term, and the observable effects would be subtle and entangled. But the burden of justifying criminalization *now* rests on demonstrating a probable, significant harm. You offer a hypothesis about potential long-term, diffuse social costs. The evidence for this specific risk? The polling showing revulsion. But that only tells us about current feelings, not the *consequences* of changing them. You invoke the novelty of the challenge to social norms. But novelty fades. The ‘unchallenged by necessity’ argument feels like special pleading. Why is the benefit of dietary choice, resource efficiency, or even simple consumer preference less valid than the benefits of medicine? Because we *feel* it is? Because the revulsion is currently strong? That brings us back to using law to freeze current moral intuitions.

  You say removing the bright line of prohibition dims it. But perhaps that line shouldn’t have been drawn so brightly in the first place, absent harm. The confusion in the Act reflects a deeper confusion: trying to use criminal law to sustain a feeling – revulsion – that may well evolve naturally, as it did with dissection. Placing this on the ‘horse and dog’ list is an assertion, not evidence. Those revulsions persist without criminal prohibitions. Why assume this one *requires* criminalization to persist or that its failure to persist would be catastrophic? The disintegration claim remains a prediction based on intuition about the importance of *this specific* boundary. My intuition, informed by history’s list of dissolved revulsions, is that societies are more resilient than that. The fundamental distinction, Professor, isn't just about harm, but about the *type* of justification. You ask us to criminalize based on the majority's profound feeling that something is ‘not us’, even when they can’t articulate harm beyond that feeling changing. I argue that is insufficient grounds for state coercion. The morality a society *happens* to hold is not necessarily the morality it *ought* to enforce through its most punitive instrument. To assume that maintaining *this specific* revulsion is essential for cohesion *is* to assume the conclusion.

  **Voss:** Dr. Thorne, the resilience you cite involves societies navigating change *without losing core constitutive boundaries*. The dissolved revulsions you list were either overcome by overwhelming tangible benefit operating in a different domain (medicine) or were not truly constitutive boundaries in the first place. The durability of the horse/dog revulsion *without* law demonstrates the strength of that *particular* social norm. This case is different: the technology creates a novel pressure on a boundary concerning the *human* body itself, a category central to our self-understanding in a way animal categories or medical necessity are not. The benefit offered is trivial by comparison. You dismiss ‘not us’ as mere feeling, but shared self-understanding *is* the substance of social cohesion. The law doesn’t exist merely to prevent stabbings; it exists to define the community within which stabbing is wrong. Criminalizing this act defines a boundary essential to that community definition. The burden isn't solely on demonstrating imminent, tangible harm, but on demonstrating that removing this long-standing, deeply held, constitutive prohibition carries *no significant risk* to the moral fabric – a fabric whose strength and nature is revealed precisely by the persistence of this revulsion. Your appeal to the ‘morality we ought to hold’ is vital, but it cannot simply bypass the empirical reality of the morality that *does* hold and its demonstrable role in binding this society together. To dismiss the stable revulsion and the disintegration hypothesis as *mere* intuition ignores the sociological reality of how societies cohere through shared symbolic boundaries. The cost of being wrong – of assuming resilience where none exists – is potentially profound and irreversible erosion.

  **Chairman:** Thank you, both. Your time is concluded. The record will remain open for written submissions.

  **Precisely in Dispute:**
  1.  **The Nature of the Boundary:** Whether the revulsion against human-tissue meat represents a *constitutive, fundamental boundary* essential to societal cohesion (Voss) or a potentially transient *moral intuition* insufficient for criminalization absent tangible harm (Thorne).
  2.  **The Burden of Proof & Risk:** Whether the burden lies on demonstrating the *probability of significant harm/disintegration* to justify prohibition (Voss) or on demonstrating the *absence of significant risk* to justify withdrawing the prohibition/not enacting it (Thorne), and whether the stable revulsion itself constitutes evidence of such risk.
  3.  **The Role of Law:** Whether criminal law's function includes *constitutively defining fundamental societal boundaries* through prohibition, even absent individual harm, to maintain shared self-understanding (Voss), or whether it should be primarily limited to *preventing tangible harm* to individuals or essential institutions, with moral boundaries managed through non-coercive social norms (Thorne).
  4.  **The Testability & Relevance of History:** How to empirically distinguish between revulsions representing fundamental boundaries (durable like horse/dog) and those that are contingent (dissolved like dissection/transfusion), and whether historical examples of resilience justify confidence in this specific case or are irrelevant due to unique factors (human body centrality, lack of overwhelming benefit).

  ---

  **Analytical Note (My Voice):**

  Both witnesses make claims potentially testable by your empirical disposition. Thorne’s core challenge – that Voss’s disintegration thesis is vague and its effects inseparable from other variables – is valid but not fatal. Voss’s claim about the *asymmetry* between introducing permissions and withdrawing prohibitions is particularly ripe for investigation. A person with your background could design a study probing how *perceived societal moral cohesion* changes based on *changes in legal status*.

  **Study Design Sketch (Impractical/Unappetizing):**

  1.  **Core Question:** Does withdrawing a longstanding prohibition on a consensual, non-harmful act viewed with stable revulsion cause a measurable decline in perceived shared moral values or social trust, compared to introducing a new permission for a similarly reviled but *novel* act?
  2.  **Method:** Longitudinal, multi-national comparative survey. Identify several culturally similar jurisdictions (e.g., regions within large federations or closely allied nations).
  3.  **Intervention Tracked:**
      *   **Group A (Withdrawal):** Jurisdictions that *repeal* an existing prohibition on a consensual, non-harmful but traditionally reviled act (e.g., specific ritual practices, certain forms of body modification – ethically fraught but necessary for analogy).
      *   **Group B (New Permission):** Jurisdictions that *introduce* permission for a *novel*, similarly reviled but consensual, non-harmful act (e.g., a new bio-tech application like advanced germline editing for non-therapeutic traits, assuming initial revulsion).
      *   **Control Group C:** Jurisdictions with no change regarding comparable issues.
  4.  **Metrics (Measured Annually for 10-20 years):**
      *   *Perceived Moral Cohesion:* Surveys measuring agreement with statements like "People in my community share fundamental moral values," "We agree on basic right and wrong."
      *   *Social Trust:* Standard metrics (e.g., "Most people can be trusted").
      *   *Normative Certainty:* Agreement with "The rules about what is acceptable/unacceptable in society are clear."
      *   *Act-Specific Revulsion:* Track stability/change in revulsion towards the specific act in each group.
  5.  **Analysis:** Compare trends in Group A (Withdrawal) vs. Group B (New Permission) vs. Group C (Control) on the cohesion/trust/certainty metrics, controlling for broader socio-economic-political trends. Test Voss’s thesis: Does Group A show a significant negative divergence compared to Groups B and C, *even if* revulsion towards the specific act declines similarly in A and B? This would suggest withdrawal carries a unique cost. Thorne’s position would predict no significant difference between A and B if revulsion change is similar, or that any difference is attributable to confounding factors.

  This design attempts to isolate the effect of *legal change type* (withdrawal vs. new permission) on perceived moral fabric, holding the nature of the act (reviled, consensual, non-harmful) relatively constant. The immense ethical and practical challenges (finding suitable acts, long timeframe, controlling variables) highlight the difficulty inherent in testing foundational social theories empirically, aligning with your observation about the Hart-Devlin debate's empirical gap.
