  For the tree structure: Starting with a scenario about mathematician's rule-following forces the effective procedure question early. Then a physics-based scenario (like the black hole computer) splits the physical systems question. This creates four quadrants early on. Subsequent nodes probe nuances like trial-and-error computation, relativistic effects, quantum description levels, and finite revisions.

  The leaves should include: stipulative definition, empirical physical claim, Gödelian anti-mechanism, limiting computation, real-number machines, relativistic computation, and a conflation leaf. Each leaf needs a clear central claim and "most awkward commitment" - the counterintuitive implication they must accept.

  For empty cells: I'll identify logically possible but undefended positions, like accepting relativistic super-Turing computation while rejecting real-number machines. These combinations are either unexplored or reveal inconsistencies in how one defines "computation."

  The pairs this tree can't separate would include conflations between different types of physical theses, or between trial-and-error and relativistic positions. Adding a question about indefinite revision versus spacetime structure would help distinguish these.

