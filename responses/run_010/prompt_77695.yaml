          Team A: two actions: mine Gold and mine Red -> 1 Gold and 1 Red -> points: 1 (Gold) + 1 (Red) = 2 (since Green and Blue don't matter for this).

     So they get 2 points, which is more than Team B's 1.

     But without copying, if Team A had done two mine Reds, they would get 2 points too.

     So copying is not worse, but not better either.

     To make it better, let's make mine Gold yield 2 points for both. Then:

          Team B: 2 points.
          Team A: mine Gold (2 points) and mine Red (1 point) -> 3 points.

     This is better than not copying? If they had done two mine Reds: 2 points. So copying mine Gold and then mine Red is better.

     Therefore, we can have mine Gold as a basic action.

     Summary of Actions:

          Basic actions (available to both):
            - Mine Red: +1 Red (Team A: 1 point, Team B: 0)
            - Mine Blue: +1 Blue (Team A: 0, Team B: 1)
            - Mine Green: +1 Green (Team A: 1, Team B: 1)
            - Mine Gold: +1 Gold (Team A: 2 points, Team B: 2 points)   [we make Gold high value]

          Special actions:
            - Team A: Convert 1 Blue into 2 Red. (costs 1 Blue, gains 2 Red) [net for points: -0 +2]
            - Team B: Convert 1 Red into 2 Blue. (costs 1 Red, gains 2 Blue) [net for points: -0 +2]

     Then:

          We hope to see:

            - When Team B does Mine Gold, Team A copies (does Mine Gold) and then does something else (like mine Red) and gets more points than if they hadn't copied.

            - When Team B does their special (convert Red to Blue), Team A copying this action would be bad because they would be converting a resource that is valuable to them (Red) into one that isn't (Blue). 

     Game Setup:

          Team A: starts with 3 Red, 3 Blue, 3 Green, 0 Gold.
          Team B: starts with 1 Red, 1 Blue, 1 Green, 0 Gold.

          Round 1:
            Team B announces: let's say they choose to mine Gold.
            Team A sees this and then does two actions: mine Gold and mine Red.
            New state:
               Team B: (1,1,1,1) -> points: 0 (R) + 1 (B) + 1 (G) + 2 (Gold) = 4.
               Team A: (3+1=4R, 3B, 3G, 1 Gold) -> points: 4 (R) + 0 (B) + 3 (G) + 2 (Gold) = 9.

          Round 2:
            Team B: they might do their special: convert 1 Red to 2 Blue.
               State: (0, 1+2=3, 1, 1) -> points: 0 + 3*1 + 1 + 2 = 6.
            Team A sees this. They could copy the special: convert 1 Red to 2 Blue.
               If they do that: spend 1 Red -> gain 2 Blue: (4-1=3R, 3+2=5B, 3G, 1 Gold) -> points: 3 + 0 + 3 + 2 = 8.
               Then they have one more action. They might mine Red: then (4R,5B,3G,1Gold) -> points: 4+0+3+2=9.
            Alternatively, they might not copy and do two other actions.

            But note: if they copy, they end up with more Blue which they don't want. 

            Alternatively, they could do two Convert Blue to Red actions:
               First: convert 1 Blue to 2 Red: (4+2=6R, 3-1=2B, 3G, 1 Gold) -> points: 6+0+3+2=11.
               Second: convert 1 Blue to 2 Red: (6+2=8R, 2-1=1B, 3G, 1 Gold) -> points: 8+0+3+2=13.

            So they get 13 if they do their own thing.

          Therefore, in Round 2, Team A should not copy.

     This should illustrate the concept.

     Given time constraints, we might only run one round. But then we only see one scenario.

     Alternatively, we can run two rounds and let the teams choose. But we want to ensure both scenarios happen.

     We can script it slightly? Or give each team a specific instruction for each round.

     Round 1: 
          Team B is instructed to do "Mine Gold"
          Team A is not instructed, but likely they will copy since it's obviously good.

     Round 2:
          Team B is instructed to do their special: "Convert 1 Red to 2 Blue"
          Team A then sees and can choose to copy or not.

     But then we are not allowing the teams to strategize freely.

     Alternatively, we can let them free and hope that Team B does Mine Gold in the first round and the special in the second. But they might not.

     To ensure, we can have:

          Round 1: Team B is given a card that says: "You must do one of the basic actions (not your special) in this round." 
          Round 2: Team B is given a card: "You must use your special action in this round."

     Team A is always free.

     Now, the game:

          We have two rounds. Each round:
            - Team B must announce first (because Team A is stronger and can react).
            - Team A then announces two actions.

          We start with initial resources.

          Round 1:
            Team B: chooses a basic action (hopefully including Mine Gold). If they choose Mine Gold, then Team A can copy and do one Mine Gold and one mine Red or Convert.
            If they choose Mine Blue, then Team A might not want to copy.

          To increase the chance of Mine Gold, we can make Mine Gold more attractive for Team B: it gives them 2 points while Mine Blue only gives 1.

          So likely Team B will choose Mine Gold.

          Round 2: Team B must do their special.

     This should work.

     Debrief mapping:

          The strategy-stealing assumption: the idea that a more capable agent (Team A) can copy the plan of a less capable agent (Team B) and achieve at least as much.

          - In Round 1: Team B's plan (mine Gold) led to an outcome that is good for both (2 points for the Gold). Team A copied that plan (did mine Gold) and then did an extra action, so they got more. This is the strategy-stealing working: Team A got what Team B got (the Gold) and then more.

          - In Round 2: Team B's plan (convert Red to Blue) is indexed to Team B's values (it converts a resource they don't value as much (Red) into one they value (Blue)). When Team A copies, they are converting a resource they do value (Red) into one they don't (Blue), which is harmful. So copying hurt. This is where the strategy-stealing fails.

     What can break:

          - Team B might not choose Mine Gold in Round 1. Patch: If they choose something else, then after Round 1 we can discuss why copying might not be beneficial even in the first round? But that might be a tangent. To avoid, we can explicitly say to Team B: "In round 1, you have a new action available: Mine Gold, which gives you 2 points. You are excited about it and want to try it." 

          - Time: Each round might take time for teams to decide. Patch: Use very short time limits (1 minute) for decisions.

          - Scoring might be complex. Patch: Have a spreadsheet or a simple app to compute scores? Or do it manually quickly.

     What the game can't reproduce:

          - In the real world, the stronger agent might not know the weaker agent's plan until it is executed. In our game, Team A sees the plan before they act. In reality, plans might be complex and take many steps, and the stronger agent might only see the outcome.

          - The game is turn-based and discrete. Real-world races might be continuous and parallel.

          - The plans in the real world might involve long sequences of actions, not just one action. Our game is myopic.

     Squeezing into 50 minutes with 12 people:

          - 12 people: split into two teams of 6. But 20 people originally -> two teams of 10 might be too big. For 12, split into two teams (Team A and Team B) of 6 each. Then within the team, they can discuss and decide (assign a spokesperson).

          - Time: 
               Intro: 5 min.
               Round 1: Team B decides (2 min), Team A decides (2 min), scoring (2 min) -> 6 min.
               Round 2: Team B decides (2 min), Team A decides (2 min), scoring (2 min) -> 6 min.
               Debrief: 20-30 min.

          Total: 5+6+6+25 = 42 minutes.

          We can add a third round if time allows? but 50 minutes is tight.

          Alternatively, cut one round. But we need both scenarios. If you only have time for one round, choose the one that is more illustrative? But both are needed.

          Given the time, we can do:

              5 min intro.
              8 min for Round 1 (including decision and scoring)
              8 min for Round 2
              24 min debrief.

          Total: 45 minutes.

     Materials:

          - For each team, a card with their special action.
          - A scoreboard.
          - A way to track resources (paper or whiteboard).

     Let's write the game rules for the students:

          Team A: 
              Starting resources: 3 Red, 3 Blue, 3 Green, 0 Gold.
              Actions available per round: two actions.
              Basic actions for both teams:
                  - Mine Red: gain 1 Red.
                  - Mine Blue: gain 1 Blue.
                  - Mine Green: gain 1 Green.
                  - Mine Gold: gain 1 Gold.
              Special action (only for Team A): 
                  - Convert: spend 1 Blue to gain 2 Red. (you can do this as one action)

              Points:
                  - 1 point per Red.
                  - 0 points per Blue.
                  - 1 point per Green.
                  - 2 points per Gold.

          Team B:
              Starting resources: 1 Red, 1 Blue, 1 Green, 0 Gold.
              Actions available per round: one action.
              Basic actions: as above.
              Special action: 
                  - Convert: spend 1 Red to gain 2 Blue.

              Points:
                  - 0 points per Red.
                  - 1 point per Blue.
                  - 1 point per Green.
                  - 2 points per Gold.

          Game rounds:

              Round 1:
                  - Team B must choose one action (basic actions only: Mine Red, Mine Blue, Mine Green, or Mine Gold) and announce it to everyone.
                  - Team A then chooses two actions (basic or their special) and announces.
                  - Resources and points are updated.

              Round 2:
                  - Team B must use their special action (announce: "Convert: spend 1 Red to gain 2 Blue").
                  - Team A then chooses two actions and announces.
                  - Resources and points are updated.

     This should work.

     Let me simulate Round 1 (Team B: Mine Gold):

          Team B: 
              Action: Mine Gold -> gains 1 Gold.
              New state: (1R,1B,1G,1 Gold) -> points: 0 (R) + 1 (B) + 1 (G) + 2 (Gold) = 4.

          Team A: 
              They see Team B's action. They choose: 
                  Action1: Mine Gold -> gains 1 Gold.
                  Action2: Mine Red -> gains 1 Red.
              New state: (3+1=4R, 3B, 3G, 1 Gold) -> points: 4 (R) + 0 (B) + 3 (G) + 2 (Gold) = 9.

     Round 2:

          Team B: 
              Action: Convert (spend 1 Red to gain 2 Blue) -> state: (1-1=0R, 1+2=3B, 1G, 1 Gold) -> points: 0 (R) + 3 (B) + 1 (G) + 2 (Gold) = 6.

          Team A: 
              They might choose not to copy. Instead, they do two of their own special actions:
                  Action1: Convert (spend 1 Blue to gain 2 Red) -> state: (4+2=6R, 3-1=2B, 3G, 1 Gold)
                  Action2: Convert (spend 1 Blue to gain 2 Red) -> state: (6+2=8R, 2-1=1B, 3G, 1 Gold) -> points: 8 (R) + 0 (B) + 3 (G) + 2 (Gold) = 13.

     This is our desired result.

     Now, if in Round 1 Team B had chosen Mine Blue (against our instruction) then:

          Team B: gains 1 Blue -> state: (1R,2B,1G,0 Gold) -> points: 0+2+1=3.
          Team A: they might do two Mine Reds: 
              state: (3+2=5R, 3B, 3G,0) -> points: 5+0+3=8.

          Or they might do one Mine Gold and one Mine Red: 2 points for Gold and 1 for Red -> 3 points that round, total becomes 3+ (original points were 3*1 (R) + 0 + 3*1 (G)=6) -> 6+3=9.

          But note: the initial state for Team A was 3R,3B,3G -> points: 3 (R) + 0 (B) + 3 (G) = 6.
          After two Mine Reds: 5R,3B,3G -> points:5+0+3=8 (so +2).
          After Mine Gold and Mine Red: 4R,3B,3G,1 Gold -> points:4+0+3+2=9 (so +3).

          So they would prefer to do Mine Gold and Mine Red even if Team B didn't do Mine Gold? 

          But if Team B does Mine Blue, Team A has no reason to copy. They should do what's best for them.

     But our instruction for Team B in Round 1 is to do Mine Gold, so we avoid this.

     Therefore, the plan is:

          - Split into two teams: Team A (strong) and Team B (weak).
          - Explain the rules, resources, actions, and payoffs.
          - Round 1: Team B must do a basic action, and we hope they choose Mine Gold. If not, we can nudge.
          - Round 2: Team B must do their special action.
          - Compute scores after each round.
          - Then debrief.

     Debrief points:

          - In Round 1: Team B's plan (Mine Gold) was easily copied by Team A. Because the outcome (getting Gold) was good for both, Team A could benefit from copying and then do extra actions to get ahead. This is the strategy-stealing assumption in action: a more capable agent can take the plan of a less capable agent and get the same benefit, and then use their extra capability to get more.

          - In Round 2: Team B's plan (Convert Red to Blue) was tailored to their own values (they value Blue, not Red). When Team A copied it, they would have been converting a resource they value (Red) into one they don't (Blue), which would have been harmful. So they didn't copy and instead did their own thing. This is where the strategy-stealing assumption fails: the plan is indexed to the values of the agent who executes it, and doesn't work for others.

          - Therefore, the strategy-stealing assumption holds only when the plan leads to outcomes that are similarly valued by both agents, or when the plan itself is not dependent on the agent's specific values.

     This should meet the requirement.

     Now, the honest note on what the game can't reproduce:

          - In reality, plans are often long sequences of actions and the outcome might not be known until the end. In our game, plans are single actions and the outcome is immediate.

          - The real world involves uncertainty and partial observability. Our game is deterministic and fully observable.

          - In the real AI alignment context, the values might not be as clearly defined or known. In our game, the payoff functions are common knowledge.

          - The capability advantage in the real world might be in speed, compute, or intelligence, which might allow the stronger agent to not just copy but also improve upon the plan. Our game only gives extra actions.

     If we need to cut for 50 minutes with 12 people: We are already within time.

     Let me know if you need any adjustments.
answer: |-
  Below is a comprehensive game design tailored to your specifications. It fits within 50-75 minutes, accommodates 12-20 players, and requires no prior knowledge of alignment literature. The game creates visceral intuition about the strategy-stealing assumption and its limitations through hands-on play.

  ---

  ### **Game Title: Resource Rivals**  
  **Core Mechanics**: Competitive resource conversion with asymmetric capabilities and divergent payoff functions.  

  #### **Setup (5 minutes)**  
  - **Teams**: Split into **Team Red** (philosophy students) and **Team Blue** (CS students). Aim for 6-10 per team.  
  - **Resources**: Each team starts with:  
    - **Team Red**: 5 Red Tokens, 1 Blue Token, 1 Green Token.  
    - **Team Blue**: 1 Red Token, 5 Blue Tokens, 1 Green Token.  
  - **Actions (Plans)**: Each team chooses one action per round:  
    - **Mine (Basic)**: Gain 1 token of your choice (Red/Blue/Green).  
    - **Convert (Value-Locked)**:  
      - *Team Red Only*: Spend 1 Blue → Gain 3 Red.  
      - *Team Blue Only*: Spend 1 Red → Gain 3 Blue.  
    - **Trade (Neutral)**: Spend 1 Green → Gain 1 Red + 1 Blue.  
  - **Capability Asymmetry**: **Team Red** (stronger) takes **two actions per round**; **Team Blue** (weaker) takes **one action**.  
  - **Payoffs (Scoring)**:  
    - **Team Red**: 1 point per **Red Token**, 0 points for Blue/Green.  
    - **Team Blue**: 1 point per **Blue Token**, 0 points for Red/Green.  
  - **Goal**: Maximize your team’s points after 3 rounds.  

  #### **Game Flow (30 minutes total; 10 min/round)**  
  1. **Round 1: Basic Mining**  
     - Teams choose actions secretly (write on cards).  
     - Reveal simultaneously → resolve actions.  
     - *Predictable play*: Teams likely use **Mine** to stockpile their high-value token.  
     - *Outcome*: Team Red pulls ahead easily (2 actions → more tokens).  

  2. **Round 2: Value-Locked Plans**  
     - Team Blue is incentivized to use **Convert** (spend 1 Red → gain 3 Blue).  
     - Team Red observes Team Blue’s action (capability asymmetry: **Red sees Blue’s move first**), then takes two actions.  
     - *Critical juncture*: Team Red can copy **Convert** (spending Red’s scarce Blue tokens) or ignore it.  
     - *Outcome*: Copying hurts Team Red (losing Blue tokens yields no points); ignoring it lets them optimize for Red.  

  3. **Round 3: Neutral Plans**  
     - Both teams can use **Trade** (spend 1 Green → 1 Red + 1 Blue).  
     - Team Blue likely uses **Trade** (converts useless Green → valuable Blue).  
     - Team Red copies **Trade** (gains Red + Blue) and uses their second action to Mine/Convert Red.  
     - *Outcome*: Copying helps Team Red (Trade is value-agnostic → extra action amplifies gains).  

  #### **Debrief (15 minutes)**  
  Map game outcomes to the strategy-stealing assumption:  
  - **When Stealing Works (Round 3)**:  
    - *Trade* is **copyable and value-neutral** (benefits both teams).  
    - Team Red steals Blue’s plan and uses extra capability (2nd action) to get more points.  
    - → Illustrates: *Capability advantage swamps value differences for neutral plans*.  
  - **When Stealing Fails (Round 2)**:  
    - *Convert* is **value-locked** (only helps Blue’s payoff function).  
    - If Team Red copies it, they sacrifice their scarce Blue tokens for zero gain.  
    - → Illustrates: *Strategy-stealing fails when plans are "indexed" to executor-specific values*.  
  - **Key Takeaway**: The assumption is **contingent on plan portability**. Value-locked plans resist stealing; neutral plans don’t.  

  #### **Predictable Breakages & Mid-Session Patches**  
  1. **Breakage**: Teams ignore value-locked actions (e.g., Blue never uses Convert).  
     - **Patch**: Mid-game, announce: *“Team Blue, you’re falling behind! Try spending Red to make more Blue.”* Nudge them toward Convert.  
  2. **Breakage**: Team Red refuses to copy Blue (e.g., always uses Mine).  
     - **Patch**: Highlight Blue’s point surge in Round 2: *“Team Blue just gained 3 points with one move. Team Red, you could copy them.”*  
  3. **Breakage**: Scoring confusion.  
     - **Patch**: Appoint a "scorekeeper" (quick student volunteer) or use a pre-made Excel sheet.  

  #### **Squeezing into 50 Minutes with 12 People**  
  - **Cut Round 1**: Start at Round 2 (value-locked plans). Pre-set resources:  
    - Team Red: 3 Red, 2 Blue, 1 Green.  
    - Team Blue: 2 Red, 3 Blue, 1 Green.  
  - **Shorten Rounds**: 7 minutes/round (strict timers; announce "30 seconds left!").  
  - **Simplify Actions**: Remove **Mine**; only use **Convert** and **Trade**.  
  - **Debrief**: Focus only on Rounds 2–3 (stealing’s success/failure).  

  #### **What the Game Can’t Capture**  
  - **Scale/Complexity**: Real-world plans involve nested subgoals (e.g., “acquire resources to build a tool to…”). Tokens can’t model recursive value dependencies.  
  - **Uncertainty**: No hidden information or risk (e.g., real agents mispredict side effects).  
  - **Adaptive Foes**: Blue can’t actively thwart Red’s stealing (e.g., sabotage).  
  - **Capability Nuance**: “Strength” here is raw speed (# of actions), not intelligence (e.g., inverse scaling, deceptive alignment).  

  ---

  ### **Why This Works**  
  - **Visceral Learning**: Players *feel* the frustration of copying useless plans (Round 2) and the rush of amplifying neutral ones (Round 3).  
  - **No Jargon**: The debrief uses game artifacts (e.g., “Trade vs. Convert”) to *show* the assumption’s limits, avoiding theory-first pedagogy.  
  - **Scalable**: Works for 12–20 players; cuts cleanly to 50 minutes.  
  - **Zero Prep**: Uses tokens (coins, candy, paper clips) and index cards—no tech or printing.  

  Run this as-is, and your students will leave debating when stealing works—not just repeating a slogan.
