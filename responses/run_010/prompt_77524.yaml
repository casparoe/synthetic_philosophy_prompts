  ### Joint Statement on Dutch Book Arguments

  After a year of deliberation, the reading group has identified substantial common ground, persistent disagreements, and key cruxes whose resolution would advance the debate. Below, we outline areas of agreement, a table of live disputes, three critical cruxes, and the evidence each camp would accept as counter to its position.

  ---

  ### 1. Claims Both Camps Endorse  
  The following numbered statements are non-trivial points of agreement, reflecting shared understanding of Dutch book theorems and their limitations:  

  1. **Synchronic Vulnerability**: An agent whose credences violate the axioms of finite additivity is susceptible to a synchronic Dutch book—a finite set of simultaneously offered bets, each acceptable by the agent’s lights, that together guarantee a net loss.  
  2. **Synchronic Immunity**: An agent whose credences satisfy the axioms of finite additivity is immune to a synchronic Dutch book.  
  3. **Countable Additivity Not Enforceable by Finite Books**: No finite Dutch book can enforce countable additivity. Agents violating countable additivity may avoid a finite Dutch book, even if an infinite book could exploit them.  
  4. **Priors Underdetermined by Coherence**: Coherence (satisfying the probability axioms) leaves prior probabilities fully underdetermined. Two agents with identical evidence but different coherent priors may hold equally coherent yet divergent credences.  
  5. **Diachronic Vulnerability (Conditionalization)**: An agent who (i) plans to update their credences using a rule other than conditionalization and (ii) is willing to accept bets at their current and future credences as determined by that rule is susceptible to a diachronic Dutch book—a sequence of bets offered across time that guarantees a net loss.  
  6. **Diachronic Immunity (Conditionalization)**: An agent who updates by conditionalization and accepts bets at their current and future credences is immune to a diachronic Dutch book.  

  ---

  ### 2. Disagreements Table  
  Each row presents a live dispute, with wordings preferred by each camp and a verdict on whether the disagreement is substantive or verbal.  

  | Dispute Description                  | First Camp’s Preferred Wording                                                                 | Second Camp’s Preferred Wording                                                                | Verdict       |  
  |--------------------------------------|------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|---------------|  
  | **Nature of the defect**             | Incoherent credences are defective *as credences* because they reveal internal inconsistency, demonstrated by Dutch book vulnerability. | Dutch book vulnerability reveals a defect only in the agent’s *betting dispositions*, not in the credences themselves; incoherent credences may be rational if betting is avoided. | Substantive   |  
  | **Necessity of coherence**           | Coherence is necessary for rational credences: any incoherent set is irrational because it is exploitable under fair-betting assumptions. | Coherence is not necessary for rational credences: agents may avoid exploitation without coherent credences (e.g., via cautious betting), and incoherence does not entail epistemic irrationality. | Substantive   |  
  | **Sufficiency of coherence**         | Coherence is sufficient for immunity to Dutch books, which is a minimal necessary condition for credences to be rational (though not sufficient for full epistemic rationality). | Coherence is insufficient to ensure epistemic rationality; immunity to Dutch books is neither necessary nor sufficient for credences to be epistemically justified (e.g., coherent priors may be arbitrary or evidentially ungrounded). | Substantive   |  
  | **Diachronic significance**          | The diachronic Dutch book shows that conditionalization is rationally required for belief updating; vulnerability to pumping is a defect in the updating rule itself. | The diachronic Dutch book shows only that agents with specific betting dispositions must conditionally update to avoid loss; it does not impugn non-conditional updating rules unless combined with such dispositions. | Substantive   |  

  ---

  ### 3. Cruxes  
  The following sub-questions are pivotal; resolving them would shift at least one camp’s position. For each crux, we state a concrete case or argument accepted by both camps as bearing on it, and each camp’s advance prediction.  

  #### Crux 1: Interval-Valued Credences as Counterexample or Coherence-in-Disguise?  
  - **Case**: An agent assigns interval-valued credences (e.g., P(A) = [0.3, 0.5]) and adopts a cautious betting policy: they accept a bet on A only if the offered odds fall strictly outside their interval (e.g., buying a £1 bet on A for less than £0.30 or more than £0.50). The agent’s underlying *precise* credence (e.g., P(A) = 0.4) is incoherent with their other precise credences, yet they avoid Dutch books via their policy.  
  - **First Camp’s Prediction**: This case fails as a counterexample. The agent avoids exploitation only by decoupling betting from their (defective) precise credences; the underlying incoherence remains rationally impermissible for precise-credence agents. Vulnerability is inherent to incoherent precise credences under fair-betting.  
  - **Second Camp’s Prediction**: This case severs the link between incoherence and exploitability. The agent’s precise credences are incoherent yet rational (as they avoid loss), proving Dutch books target betting dispositions, not credences.  

  #### Crux 2: Money-Pump Argument and the Value of Planning  
  - **Case**: An agent who does not update by conditionalization is offered a money-pump sequence (e.g., a series of bets exploiting their updating rule to extract arbitrarily large losses). The agent, aware of their own predictability, values plan consistency and thus refuses some bets that are myopically acceptable.  
  - **Concrete Argument**: Does the money-pump fail if the agent can rationally refuse bets by accounting for future choices or valuing planning?  
  - **First Camp’s Prediction**: Refusing bets undermines diachronic rationality: the agent either rejects bets acceptable by current credences (irrationally ignoring their own beliefs) or admits their updating rule is defective. Conditionalization remains necessary.  
  - **Second Camp’s Prediction**: The pump fails, showing that rational agents can avoid exploitation via foresight or plan-aware preferences. This defeats the argument that non-conditional updaters are inherently irrational.  

  #### Crux 3: Dutch Books with Unbounded Utility  
  - **Case**: An agent has unbounded linear utility (e.g., U(money) = money, with no saturation point) and incoherent credences. Can a Dutch book guarantee a *fixed* loss (e.g., lose £1 unconditionally) via finite, acceptable bets?  
  - **Concrete Argument**: Both camps accept a standard construction: if P(A) = 0.4, P(B) = 0.4, P(A∪B) = 0.9 for disjoint A, B, the agent sells a £1 bet on A for £0.40, sells a £1 bet on B for £0.40, and buys a £1 bet on A∪B for £0.90. Net loss: £0.10.  
  - **First Camp’s Prediction**: The Dutch book succeeds. Unbounded utility does not prevent fixed losses; incoherent credences remain exploitable and thus irrational.  
  - **Second Camp’s Prediction**: The Dutch book "works" but loses normative force: with unbounded utility, agents may accept infinite-stakes bets rendering finite losses negligible, or reject small-stakes books as irrelevant to rationality.  

  ---

  ### 4. Evidence Against Each Camp’s Position  
  - **First Camp (Dutch Book Normativists)**: They would accept as evidence against their view a demonstration that incoherent credences can be:  
    - **Non-exploitable under fair-betting**: An agent with incoherent precise credences who must accept bets at those credences but avoids Dutch booking through no ad hoc policy.  
    - **Epistemically rational without coherence**: A scenario where incoherent credences are epistemically superior (e.g., better calibrated or evidence-responsive) and coherence is systematically misleading.  
  - **Second Camp (Betting Dispositions Skeptics)**: They would accept as evidence against their view a demonstration that:  
    - **Incoherence implies non-betting defects**: Incoherent credences lead to epistemic irrationality (e.g., accuracy-dominance) even in agents with no betting dispositions.  
    - **Betting avoidance is epistemically irrational**: Agents who reject bets at their credences to avoid Dutch books are inherently epistemically flawed (e.g., violating transparency or consistency norms of belief).  

  ---  
  This statement reflects our best-faith effort to distill consensus, disagreements, and paths forward. We encourage further debate on the cruxes to resolve the deadlock.
