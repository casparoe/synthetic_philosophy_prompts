  We are drafting a joint statement for two camps in a departmental reading group on Dutch book arguments.

  The first camp (let's call them the "Dutch Book Normativists") holds that vulnerability to a Dutch book is what gives the probability axioms their normative force, so that incoherent credences are defective precisely as credences.

  The second camp (the "Betting Dispositions Skeptics") holds that the Dutch book theorems show only that certain packages of betting dispositions are self-defeating, and that nothing about belief as such follows. They think coherence is neither necessary nor sufficient for epistemically good credences.

  We need:

  1. A numbered list of claims both camps can sign (non-trivial, including at least: no finite book enforces countable additivity, coherence leaves priors wide open, and shared views on the diachronic case).

  2. A disagreements table: one row per live dispute, with each row having:
     - First camp's preferred wording
     - Second camp's preferred wording
     - Verdict on whether the row is substantive or merely verbal.

  3. Cruxes: three sub-questions that would move at least one side. For each crux:
     - The concrete case or argument both accept as bearing on it.
     - Each side's prediction about that case in advance.

  4. A short section on what each camp would count as evidence against its own position.

  Let's break it down.

  Part 1: Common Ground (numbered list)

  We need non-trivial claims both can agree on. Some ideas:

  a) The standard Dutch book theorem (for finite additivity) shows that if an agent's credences are not coherent (i.e., do not satisfy the probability axioms for finite additivity), then there exists a set of bets (a Dutch book) which the agent would accept individually but which together guarantee a loss.

  b) Coherence (in the sense of satisfying the standard probability axioms for finite additivity) is sufficient to avoid a Dutch book in the synchronic case.

  c) However, no finite set of bets can enforce countable additivity. (This is a known result: countable additivity cannot be enforced by a finite Dutch book.)

  d) Coherence does not determine prior probabilities: two agents with different prior probability distributions can both be coherent.

  e) In the diachronic case, if an agent updates by conditionalization, then they are immune to a diachronic Dutch book (as per the standard argument). Conversely, if an agent does not update by conditionalization, then they are vulnerable to a diachronic Dutch book.

  But note: the second camp might not agree that the diachronic Dutch book argument shows anything about belief. However, they might agree on the conditional: if an agent has certain betting dispositions that are tied to their updating rule, then if they don't update by conditionalization, they can be exploited. But they might not think that this exploitation reflects on the credences as beliefs.

  So we must be careful.

  For the diachronic case, both camps can agree on the following:

  - The standard diachronic Dutch book argument shows that an agent who announces an updating rule other than conditionalization and who is willing to accept bets at their current credences and also at their future credences can be exploited by a Dutch book.

  But the second camp would add: this does not necessarily impugn the rationality of the updating rule per se, because the agent might not be forced to have such betting dispositions.

  So for common ground, we can state:

  1. Synchronic Dutch Book Theorem: An agent with incoherent credences (violating the probability axioms for finite additivity) is susceptible to a synchronic Dutch book, i.e., a set of bets that the agent would accept individually but which together guarantee a loss.

  2. Synchronic Coherence Implies Immunity: An agent with coherent credences (satisfying the probability axioms for finite additivity) is not susceptible to a synchronic Dutch book.

  3. Countable Additivity: The requirement of countable additivity cannot be enforced by a finite Dutch book. (That is, there are agents who violate countable additivity but against whom no finite Dutch book can be made.)

  4. Underdetermination of Priors: Coherence (as defined by the probability axioms) does not determine prior probabilities; two agents with different prior probability distributions over the same algebra of events can both be coherent.

  5. Diachronic Dutch Book Theorem (Conditionalization): If an agent plans to update using a rule that is not conditionalization, then there exists a set of bets (offered at different times) that the agent would accept at the time they are offered and which together guarantee a loss.

  6. Converse Diachronic Dutch Book Theorem (Conditionalization): If an agent plans to update by conditionalization, then there is no set of bets (offered at different times) that the agent would accept at the time they are offered and which together guarantee a loss.

  Note: The second camp might object to the way 5 and 6 are worded because they see the vulnerability as being about the package of betting dispositions and not about the updating rule per se. However, they can agree that the theorem holds as stated: the vulnerability exists for an agent who has the betting dispositions that are assumed (namely, accepting bets at their current credences and at their future credences as updated by the rule). So we can word it conditionally on the agent having such betting dispositions.

  But to be safe, we might reword 5 and 6 to include the betting dispositions:

  5. Diachronic Dutch Book Theorem: Consider an agent who is willing to accept bets at their current credences and also willing to accept bets at their future credences as determined by their updating rule. If the updating rule is not conditionalization, then there exists a set of bets (offered at the current time and at future times) that the agent would accept and which together guarantee a loss.

  6. Converse: If the updating rule is conditionalization, then for such an agent (with the described betting dispositions) there is no such set of bets.

  Now, both camps can agree on these as mathematical theorems.

  Part 2: Disagreements Table

  We need to list the live disputes. Each row: first camp's wording, second camp's wording, and verdict (substantive or verbal).

