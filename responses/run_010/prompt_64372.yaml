prompt: |-
  I volunteer at the tenants' clinic in my building, so let me set this up properly. The place got sold last year and the new management company put in a "smart" intercom at the front door: app-based, it logs every entry, takes a photo of visitors, and the manager says it can do face matching if we opt in. Everybody got a consent form with the lease renewal and most people signed, including a lot of the people who'll be in the room. Two weeks ago a super pulled the entry logs to complain to a tenant about their late night guests, and that's when it clicked for me that the real fight isn't about the cameras — it's that everyone thinks signing the paper settled the question. Next Thursday I've got forty minutes at the monthly tenant meeting, church basement, flipchart and markers, no projector, about twenty people ranging from a retired night-shift nurse to a guy who does backend dev and will absolutly say something about encryption.

  What I want to teach is one thing, not a survey of the topic: that the interesting question about an information practice isn't "is it secret" or "did you agree to it," but whether the way information moves fits the norms of the situation it's happening in — a doctor's office, a building lobby, a workplace — and that consent can be perfectly voluntary in form and still leave you with a practice that's objectionable. I read something along those lines a while back and can't find it again, so don't assume I know the jargon or the names; if the concept has a standard label, use it once so I can look it up later, but build the session on cases from our building rather than on vocabulary. So plan the forty minutes for me: the order the pieces have to go in, with a note on what each piece depends on. I don't want to open with the smart intercom, because I think half the room will go defensive about having signed — tell me whether you agree or whether I'm wrong about that. And pick the one scenario I should build the whole thing around, saying what it has to contain and what it should deliberately leave out; I'd rather you invent a case involving our super, the logs, or the opt-in form than reach for something generic.

  Then map the misconceptions you expect. I'm counting on "I've got nothing to hide," "I signed it so I can't complain," "if it's encrypted and stays on their servers there's no issue," and "this is just what renting costs now" — tell me at which point in the sequence each gets defused and how, including how I handle the people who already signed without making them feel like the sucker in the room. Say what I should openly refuse to get into at this level (surveillance law, resale of data to third parties, whatever you think is a trap) and how to announce that I'm skipping it. And give me one question to close with, phrased so that I can tell from their answer whether the idea landed or whether they're just agreeing because I'm the one holding the marker. Don't lay out options and let me pick — commit to one sequence, one case, one closing question, with your reasons, and if you think my framing is off, overrule me and say why. No reading list or handout suggestions, nobody's doing homework.
reasoning: |-
  Okay, let me unpack this tenant clinic volunteer's request. They're preparing a 40-minute session about building surveillance systems, specifically the new "smart" intercom that logs entries, takes photos, and offers facial recognition. The core insight they want to convey is that consent forms alone don't determine whether an information practice is acceptable—it's about whether the data flow aligns with the social norms of the context (like a lobby vs. doctor's office).

  Hmm, their key concern is that tenants think signing the consent form settled everything, when actually the system's implementation—like supers pulling entry logs to shame tenants—creates problems regardless of formal consent. They explicitly don't want jargon-heavy explanations or generic examples, preferring concrete building-related scenarios. Interesting constraint: they anticipate defensiveness from those who already signed, and want to avoid opening with the intercom system itself.

  I notice they've identified four likely misconceptions: "nothing to hide" mentality, false belief that signing = no right to complain, overconfidence in encryption solving privacy issues, and resignation about surveillance being inevitable. The challenge is defusing these without making attendees feel foolish. They also want clear boundaries on off-topic areas (e.g., data resale or surveillance law) and a diagnostic closing question to gauge true understanding.

  *scratches head* The real needle to thread here is making the abstract concept of "contextual integrity" tangible through their building's stories while managing group dynamics. The retired nurse and backend dev represent very different literacy levels—gotta bridge that gap. Since they mentioned flipcharts, visuals will anchor the discussion, but no projector means keeping drawings simple.

  *lightbulb moment* What if we start with a completely different building scenario to sidestep defensiveness? Like comparing how people expect different information flows in a doctor's office versus a lobby, then circling back to the intercom. The super's log-pulling incident is perfect for the central case study—it's specific, violates norms, and proves consent doesn't fix misuse. 

  For the closing, a "what would change your comfort level?" question could reveal if they grasped that norms can be renegotiated even after signing. Gotta watch for the dev derailing into encryption debates though—might shut that down gently by acknowledging its importance while refocusing on power dynamics ("Encryption protects data in transit, Gary, but doesn't prevent management from accessing your comings and goings").
answer: |-
  Here’s a focused 40-minute plan built around **contextual integrity** (the concept you described, coined by Helen Nissenbaum). We’ll avoid jargon and anchor everything in your building’s reality.  

  **Core Concept to Teach:**  
  *"Consent isn’t enough. We need to ask: ‘Does how information is collected, shared, and used here match what we expect in our homes?’"*  

  ---

  ### **The Sequence (40 Minutes Total)**  
  **1. Warm-Up: "Where Does Information Belong?" (10 mins)**  
     - *Activity:* Draw 2 columns on flipchart: **DOCTOR’S OFFICE** vs. **BUILDING LOBBY**.  
     - *Ask:* "What personal info do you share in each place? Who expects to see it? What would feel *weird* if it happened?"  
       - *Doctor’s Office:* You share symptoms (expected). Nurse sees it (expected). Receptionist shouts it to waiting room (weird!).  
       - *Lobby:* You tell super your sink is leaking (expected). Super posts your leak complaint on the bulletin board (weird!).  
     - *Why this first?* Creates safe distance from the intercom issue. Establishes that *context defines rules*—not just consent.  

  **2. Introduce the Concept: "The Unwritten Rules" (5 mins)**  
     - *Flipchart:* Draw arrows showing info flow in the lobby example.  
     - *Say:* "Every space has unwritten rules about info. When those rules break—even if you ‘agreed’—it feels wrong. That’s called **contextual integrity**. It’s why the receptionist shouting your medical info is creepy, even if you signed a form."  
     - *Key point:* "Signing a form doesn’t make broken rules okay."  

  **3. The Central Scenario: "The Super & the Entry Logs" (15 mins)**  
     - *Case:* **Super uses entry logs to confront Tenant B about "too many late-night guests."**  
       - *What it INCLUDES:*  
         - Logs were collected for "security" (stated purpose).  
         - Tenant signed consent for data collection.  
         - Super used logs for tenant shaming (unexpected use).  
       - *What it LEAVES OUT:*  
         - Facial recognition (distraction).  
         - App security (irrelevant to *use*).  
     - *Discussion Questions:*  
       - *"Did the super break an unwritten rule here? Which one?"* (Expected: Info used for security ≠ policing tenants’ lives)  
       - *"Would you feel differently if the manager (not super) did this? Why?"* (Highlights power dynamics)  
       - *"Does signing the form make this okay?"*  

  **4. Defusing Misconceptions (Within Scenario Discussion)**  
     - *"I signed, so I can’t complain."*  
       - **Defused at Step 3:** "Signing lets them collect data—not misuse it. Your lease doesn’t say ‘super monitors your social life.’"  
     - *"I’ve got nothing to hide."*  
       - **Defused at Step 1/3:** "This isn’t about ‘hiding’—it’s about *respect*. Should your super know when you come home?" (Nod to night-shift nurse: "Would you want work knowing your sleep schedule?")  
     - *"Encryption means no issue."*  
       - **Defused at Step 3:** "Encryption protects data from hackers—not supers or managers. The problem isn’t *theft*, it’s *misuse*." (To backend dev: "Would encrypting the logs stop the super from accessing them?")  
     - *"This is just renting now."*  
       - **Defused at Step 2/3:** "Do we want to normalize this? Landlords aren’t cops. Buildings weren’t like this 5 years ago."  

  **5. Reframe Consent (5 mins)**  
     - *Flipchart:* "Consent = Opening the door. It doesn’t mean anything can walk through."  
     - *Say:* "Signing the form let them install the system. It doesn’t mean we agreed to *every use*. We can still demand rules for *how* data is used."  

  **6. Closing Question (5 mins)**  
     - *"What’s one unwritten rule about information in our building that we all assume—but isn’t written down anywhere?"*  
       - *Why this?* Tests if they grasp that norms exist beyond contracts. If they say "super shouldn’t spy on guests," the idea landed. If they default to "it’s in the lease," revisit Step 2.  

  ---

  ### **Handling Defensiveness & Traps**  
  - **Why NOT start with the intercom?** You’re right. Starting with the logs scenario (Step 3) makes it about *misuse*, not the device itself. People who signed won’t feel attacked because the villain is the super’s actions—not their consent.  
  - **What to skip:**  
    - **Surveillance law:** "Laws set bare minimums—not what’s *right* for our home."  
    - **Data resale:** "Whether they sell data is separate from whether they *misuse* it internally."  
    - **Facial recognition debates:** "Today, we’re talking about *how info is used*, not how it’s collected."  
  - **Announcing skips:**  
    *"We could talk about laws or tech specs all day, but let’s stay focused: Does this feel like the kind of home *we* want to live in?"*  

  ---

  ### **Why This Works**  
  - Uses **your building’s story** (super, logs) to make abstract ideas concrete.  
  - **Doesn’t shame signers:** The blame is on mismanagement, not consent.  
  - **Pre-empts derailing:** By acknowledging but sidelining encryption/data sales.  
  - **Closes with empowerment:** The last question implies norms can be reclaimed.  

  You’re not teaching privacy theory—you’re revealing a broken social contract. The flipchart stays visual, the cases stay local, and the backend dev gets a targeted encryption rebuttal. Forty minutes, one big idea.
