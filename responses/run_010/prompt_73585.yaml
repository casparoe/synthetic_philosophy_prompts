answer: |-
  Here are eight objections you're likely to face, ordered by potential damage, phrased in the room's dialects, with concise replies and vulnerability notes. Overlaps are flagged.

  **Concessions for Candour (First 5 Minutes):**
  1.  **"I concede the Tokyo Tribunal presents distinct challenges. Its procedural flaws, cultural context, and perceived victor-imposition were arguably more acute than Nuremberg's. My claim about the account 'travelling' requires careful qualification – it's about the *source* of legal authority (revolutionary legislation), not identical legitimacy perceptions or execution."** (Pre-empts Historians & softens Tokyo claim).
  2.  **"Selective enforcement *is* a profound moral and political problem inherent in victors' justice. It creates genuine distributive injustice and damages perceptions of legitimacy. My argument isn't that it doesn't matter, but that it operates differently from the retroactivity challenge and doesn't *legally* invalidate the convictions rendered under the Charter's authority."** (Disarms "soft on selectivity" critiques).
  3.  **"My 'revolutionary' label describes the *act* of legislating new crimes *explicitly* for the first time with binding force, not a value judgment on its morality or wisdom. Existing treaties like Kellogg-Briand were crucial *inspiration*, but lacked the defined criminal liability and jurisdictional framework the Charter created."** (Clarifies stance on pre-1945 law for Legality Theorists).

  **Objections & Replies:**

  1.  **The Legality Theorist's Core Challenge (Phrased):** "You fundamentally misunderstand the declaratory theory. Kellogg-Briand (1928) *did* renounce aggressive war, state practice *did* show its violation was viewed as an international wrong, and the London Agreement (signed by the Allies *and* recognised by Germany's unconditional surrender/Act of Berlin) provided the valid jurisdictional basis *under existing international law principles* for trying violations as crimes. The Charter codified and proceduralised pre-existing *jus cogens* norms, it didn't invent them *ex nihilo*. Your 'revolutionary' claim is historically and legally unsound."
      *   **Reply (2 mins):** "Kellogg-Briand renounced war as state policy but was silent on *individual criminal liability*. Pre-1945 state practice showed condemnation, perhaps even 'wrongfulness', but crucially, not a single precedent established *criminal prosecution of state leaders* for launching war. The London Agreement wasn't a treaty with Germany; it was an exercise of sovereign legislative power by the victors *over* the defeated state. The Charter's Article 6(a) *created* the crime for the first time with defined elements and a court to try it. Codification implies prior existence in a cognisable form – the criminal liability element was absent."
      *   **Where Soft:** Minimises the weight of Kellogg-Briand + evolving state practice as *foundation* for declaring the crime. Relies on strict absence of identical prior prosecution precedent. Doesn't fully negate the 'jurisdiction via surrender/occupation' argument.

  2.  **The Prosecutor's Courtroom Realism (Phrased):** "This is all very philosophical, but in the real world of charging decisions, *legality is paramount*. We *must* ground charges in law existing at the time. Your 'revolutionary' approach sounds like saying 'might makes right' – the winners get to invent the law *after* the fact to hang the losers. That’s not justice, it’s politics disguised as law, and it makes my job impossible ethically. How does this help *practitioners* uphold the rule of law *today*?"
      *   **Reply (2 mins):** "My argument *accepts* the retroactivity point for 1945. It doesn't endorse it as ideal practice today. The key takeaway for practitioners is this: defending Nuremberg by pretending Crimes Against Peace *were* clearly established law before 1945 is historically weak and invites the devastating *tu quoque* riposte. Acknowledging the unique, constitutive nature of the Charter – born of necessity and supreme authority – allows us to *distinguish* it normatively. Modern tribunals rightly demand strict legality precisely *because* we learned from Nuremberg's necessary exception. It highlights that *your* charging discretion today rests on vastly firmer, prospective legal foundations than Jackson had."
      *   **Where Soft:** Concedes ground on modern practice. Relies on the "unique historical circumstance" defence, which the prosecutor might dismiss as special pleading. Doesn't give him a *practical tool*.

  3.  **The Legality Theorist's Selectivity Reboot (Phrased):** "If the Charter was truly novel legislation by the victors, then the 'victors' justice' critique becomes *stronger*, not weaker, legally. If they could legislate *anything*, their choice *only* to prosecute the Axis leadership looks like pure vindictive selectivity, unconstrained even by pre-existing legal categories. This makes the trials *more* legally suspect, not less. Your 'distributive injustice' framing undersells it – it's potential *abuse of legislative power*."
      *   **Reply (2 mins):** "You highlight the tension perfectly. However, legislative power, even revolutionary power, isn't inherently unlimited. The Charter *defined specific crimes* (Art 6). While the victors had the *power* to legislate broadly, the *legality of the convictions* rests on whether the defendants' acts fell within those defined crimes post-Charter. Selective *application* (choosing whom to prosecute under the new law) is a separate issue from the *validity of the law itself* or the *retroactivity* of applying it to pre-Charter acts. Abuse of power in selectivity doesn't logically negate the validity of the *law* they created or its *prospective* application to the defined acts."
      *   **Where Soft:** The line between "valid law" and "abusive application" is thin when the same entity legislates, prosecutes, and judges. Doesn't fully address why *this* selectivity isn't a *legal* flaw *within* the revolutionary framework.

  4.  **The Tokyo Historian's Contextual Objection (Phrased):** "Your 'revolutionary' thesis might hold a sliver of water for Nuremberg, given the Four Powers' relatively coherent control. Applying it to Tokyo is unsustainable rubbish. The Far East Commission was fragmented, MacArthur was supreme but answerable to shifting US policy, and the Tribunal's procedures were widely seen (then and now in Japan) as blatantly imposed victor's vengeance, lacking even Nuremberg's veneer of legal innovation. The 'legislative authority' you cite was chaotic, contested, and deeply compromised by geopolitics from day one. How can this 'revolutionary' account possibly 'travel' here?"
      *   **Reply (2 mins):** "You're right about Tokyo's profound differences in execution, perception, and political context. My claim isn't about identical *legitimacy* or *quality*. It's about the *source of legal authority*. The IMTFE Charter was still promulgated by the Supreme Commander for the Allied Powers (SCAP), acting under authority delegated by the Allied Powers exercising supreme authority over Japan via surrender instruments (e.g., Potsdam Declaration, Instrument of Surrender). However flawed, the act of *defining crimes and establishing a tribunal* was still an exercise of constitutive, post-surrender sovereign power – *de facto* revolutionary legislation. The flaws you cite pertain to *abuse* of that power and *distributive injustice*, not the fundamental nature of the authority used to create the court and its statute."
      *   **Where Soft:** This is the weakest link. The "authority" was messier, more unilateral (US-dominated), and arguably less "supreme" in a coherent sense than in Germany. Distinguishing "source of authority" from "perception/legitimacy/quality" feels strained given the historians' focus on lived experience and memory.

  5.  **The Legality Theorist's Slippery Slope / Legitimacy Drain (Phrased):** "If we accept your 'revolutionary legislation' justification for Nuremberg, what stops any powerful coalition defeating an enemy from convening its own 'tribunal', declaring new crimes *ex post facto*, and executing the losers? You've gutted the principle of legality and provided a blueprint for show trials masquerading as justice. Nuremberg's *enduring* legitimacy rests precisely on it *not* being seen that way!"
      *   **Reply (2 mins):** "The unique, catastrophic context of Nazi Germany and Imperial Japan – industrialised genocide, aggressive wars shattering the global order – provided the *exceptional* necessity justifying this unique act. Crucially, the Allies also established institutional safeguards (defined charges, adversarial procedure, right to defence) *within* the Charter, aiming for fairness *under* the new law. The lesson isn't that it's always permissible, but that in the absolute vacuum left by total defeat of regimes responsible for unprecedented crimes, *some* authoritative act was needed. Its legitimacy derives from the *substance* of the crimes tried, the *procedures* followed (however imperfect), and the *necessity* of the moment, not *just* the power. Modern international law, with the ICC and clear *nullum crimen* principles, is the *antidote* developed *because* of Nuremberg's exceptionalism."
      *   **Where Soft:** "Necessity" and "uniqueness" are subjective and politically malleable. Safeguards at Tokyo were widely seen as inadequate. Doesn't provide a clear *legal* bright line against future abuse, only a political/moral one.

  6.  **The Prosecutor's Practical Selectivity (Phrased):** "You dismiss 'victors' justice' as mere distributive injustice. But in the craft of prosecution, selectivity *is* central to legitimacy. Jackson made strategic choices – focusing on aggression and conspiracy, downplaying some Allied actions – based on evidence and politics. Your theory seems to say those choices are irrelevant to the *legal* validity of convicting Goering of Aggressive War. But if the *application* of this 'new law' was demonstrably skewed by the victor status, doesn't that infect the *entire enterprise* legally, or at least fatally undermine its moral claim to be 'justice'?"
      *   **Reply (2 mins):** "Selectivity is inherent in *all* prosecution. The key distinction is between selectivity *within* the defined legal framework (which may be politically or evidentially driven, sometimes problematically) and the *validity of the framework itself* or its *retroactive application*. The victor status undoubtedly influenced *which* crimes were prioritised and *whom* was prosecuted. But proving Goering planned aggressive warfare under the *new* Charter's definition is legally separate from the Allies not prosecuting Harris for area bombing. The former is about individual guilt under the promulgated law; the latter is about the victors' failure to apply their *own* new law equally – a serious moral/political failing, but not a *legal* defect *in Goering's conviction* under the Charter that existed at his trial."
      *   **Where Soft:** The "separateness" feels artificial when the same actors control the entire process from legislation to sentencing. In practice, the *appearance* of bias can be as damaging as actual legal invalidity.

  7.  **The Legality Theorist's Crimes Against Humanity Nexus (Phrased):** "Your focus is on Crimes Against Peace, but what about Crimes Against Humanity (CAH)? The Charter tied them to the war nexus ('in execution of or in connection with any crime within the jurisdiction of the Tribunal'). If the Charter was truly novel legislation, doesn't this arbitrary limitation – excluding pre-war Nazi atrocities like the Holocaust's early phases – become an even more glaring act of *unjust* legislative selectivity by the victors, rather than a mere interpretation of existing law? Doesn't this undermine your claim that the revolutionary act was *necessary* for justice?"
      *   **Reply (2 mins):** "The wartime nexus *was* a significant and regrettable limitation, reflecting political compromise among the Allies and perhaps an initial reluctance to assert jurisdiction over purely internal atrocities. Within my framework, this *is* indeed an example of how the victors used their constitutive power imperfectly – they *could* have defined CAH universally but *chose* not to. However, this doesn't negate the *validity* of convicting defendants under the CAH definition *as legislated* for acts committed during the war. It highlights the *distributive injustice* point – the failure to legislate more broadly – but again, doesn't legally undo the convictions actually secured under the promulgated statute. The revolutionary act *enabled* prosecution for wartime CAH; its limitation prevented broader justice."
      *   **Where Soft:** This highlights a profound *moral* flaw in the legislative choices made under the revolutionary power, making the "necessity for justice" argument harder to sustain for CAH specifically. It feels like a concession to selectivity *within the legislative act itself*.

  8.  **The Historian's Legitimacy/Memory Point (Phrased):** "You're privileging a narrow, legalistic view of 'validity'. In Japan, the enduring perception of Tokyo as 'victors' justice' *stems directly* from the sense that the law was invented by the winners to punish the losers, exactly as you describe! Your 'revolutionary' theory, rather than solving the legitimacy problem, *explains precisely why the trials lack legitimacy in crucial constituencies*. How does describing the process accurately as revolutionary legislation help *now*, when the goal (then and now) was establishing a legitimate historical and legal record?"
      *   **Reply (2 mins):** "You're absolutely right about the perception, particularly in Japan. My aim isn't to *create* legitimacy retroactively, but to provide a more *accurate* account of the legal authority invoked, which helps us *understand* the sources of that legitimacy deficit. Defending Tokyo by pretending it applied pre-existing law fuels accusations of hypocrisy when pre-war Allied actions are considered. Acknowledging the revolutionary nature forces a different conversation: not 'was this pre-existing law?' (which invites *tu quoque*), but 'was this exercise of constitutive power *justified* by the circumstances, and was it *exercised fairly*?' The answers in Tokyo's case are far more contested than Nuremberg's, explaining its weaker legacy. This framing allows for a clearer critique of the *abuse* of that power."
      *   **Where Soft:** Concedes the core point about legacy damage. The "different conversation" might be seen as academic and not address the lived historical resentment. Doesn't offer a path to *repairing* legitimacy.

  **Overlapping Objections:**
  *   **Objection 1 (Declaratory Theory) & Objection 4 (Tokyo Context):** Both rely on arguments that pre-existing law/sufficient jurisdictional continuity existed, making the "revolutionary" label inaccurate. Objection 4 applies this specifically to Tokyo's messier situation.
  *   **Objection 3 (Selectivity Reboot) & Objection 6 (Prosecutor's Selectivity) & Objection 7 (CAH Nexus):** All are variations on the theme that selectivity – in legislating the scope of crimes (CAH nexus), in applying the law only to the losers, or in prosecutorial choices – is not just a "distributive injustice" but fatally undermines the legal or moral legitimacy of the entire enterprise. Objection 3 focuses on the legislative choice, 6 on prosecutorial application, and 7 on a specific legislative limitation.
  *   **Objection 2 (Prosecutor's Realism) & Objection 5 (Slippery Slope):** Both express concern that the revolutionary model undermines the rule of law – Objection 2 for modern practitioners, Objection 5 for future bad actors.

  **The Must-Land Reply:**
  The reply to **Objection 1 (The Legality Theorist's Core Challenge)** MUST land. If the room remains convinced the Charter was merely declaratory of pre-existing law (especially Crimes Against Peace), your entire "revolutionary" thesis and its core resolution of the retroactivity/selectivity tension collapses. Your reply needs to firmly establish the *creation* of individual criminal liability as the novel, constitutive act. Everything else flows from this.

  **The Nuclear Option Question (The One You Pray Nobody Asks):**
  **"Your 'revolutionary legislation by the victors' account perfectly describes the legal mechanics of a *show trial*. If the Allied Tribunal in 1945-48 fits this model – new laws, selective defendants, victors judging losers – what principled distinction, *within your own framework*, prevents us from concluding that Nuremberg/Tokyo *were* essentially show trials with better PR? Doesn't your theory retrospectively vindicate the 'victors' justice' critique by providing its exact legal blueprint?"**

  *   **Why it's devastating:** It directly attacks the *legitimacy* you need the trials to retain for your argument about their foundational importance to have weight. It forces you to rely on contextual factors (scale of crimes, procedural safeguards, necessity) that are external to your core "revolutionary legislation" thesis and easily dismissed as subjective or hypocritical. Conceding it *was* a show trial costs you the thesis. A shrug ("It's a description, not an endorsement") undermines any claim to its normative value. Retreating to moral arguments ("But the Nazis *deserved* it!") abandons your legal thesis and plays into the selectivity critique.
  *   **Potential (Unsatisfying) Replies & Their Cost:**
      *   *"The distinction lies in the substantive justice of the cause and the relative fairness of the procedure within the revolutionary framework."* (Cost: Abandons legal purity for moral/political judgment; subjective; invites "who decides?").
      *   *"The unique historical necessity and the absence of any alternative forum provide the distinguishing justification."* (Cost: Admits justification is circumstantial, not inherent in the model; weak against Tokyo comparisons; doesn't prevent future abuse claiming 'necessity').
      *   *"The subsequent development of international criminal law based on prospective, consensual statutes *is* the distinction and the repudiation of the show trial model."* (Cost: Concedes Nuremberg/Tokyo *were* fundamentally flawed/show-trial-like by modern standards, undermining their foundational mythos; retrospective).
      *   *"The 'show trial' label implies predetermined outcomes and lack of due process. Nuremberg/Tokyo, despite flaws, aimed for and provided significant adversarial process under their Charters, distinguishing them from pure Stalinist spectacles."* (Cost: Minimises prosecutorial dominance and political constraints; doesn't address the core 'victors legislating to convict losers' dynamic; weak on Tokyo).
      *   **Least Worst Option:** "The model *describes* the source of authority. Whether it constituted a *show trial* depends on the *application* of that authority: the independence of the judges, the rigour of the procedure, the quality of the defence, the adherence to the promulgated rules. Nuremberg, despite valid criticisms, largely met a threshold of fairness *within its revolutionary framework* that distinguishes it from a mere kangaroo court. Tokyo is more debatable. The inherent vulnerability to abuse is the reason the model is exceptional and not the basis for modern international criminal law." (Cost: Still relies on contestable judgments about fairness; weakens the coherence of the 'revolutionary' act as a self-contained justification; shifts ground to procedure over substance of authority).

  **Good luck with the workshop! Your core argument is bold and clearly articulated – expect a lively debate.**
