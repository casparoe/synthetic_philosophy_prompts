  Okay, the user is presenting at a law school workshop on legality and legitimacy in the founding trials of 1945-48. They need a Q&A prep sheet focused on potential objections, not a defense of their paper. Their main argument is that the Nuremberg Charter was a revolutionary legislative act, not declaratory of existing law, thus addressing retroactivity by accepting it while framing "victors' justice" as a selective enforcement issue rather than invalidating the convictions. They'll face international criminal lawyers, legal theorists on legality, Tokyo Tribunal historians, and a retired prosecutor.

  Hmm, the user's approach is deliberately provocative - calling the Charter "revolutionary" will ruffle feathers among legality scholars who defend its lawfulness. The room composition suggests three main battlefronts: legality theorists (objecting to non-declaratory stance), Tokyo historians (contextual differences), and the prosecutor (pragmatic concerns). Need to identify overlapping objections disguised in different vocabularies.

  First, the core tension in their thesis: if legality theorists attack the revolutionary framing, that's existential for the argument. The prosecutor's "courtroom realism" objection about practical irrelevance could also be devastating if unanswered. Must prioritize these.

  Noticing two hidden equivalences: 1) The legality theorist's "Kellogg-Briand as source" and historian's "Tokyo contextual difference" both imply continuity with pre-existing law. 2) The prosecutor's "charging discretion" and "legitimacy drain" critiques both stem from applied practice concerns.

  For concessions: Early admission about Tokyo's weaker revolutionary credentials would pre-empt historians. Acknowledging selective enforcement as morally problematic (though not legally invalidating) disarms critics. Distinguishing between legal validity and moral legitimacy is crucial upfront.

  The nuclear option question seems to be about revolutionary precedents enabling bad-faith tribunals - their reply about institutional safeguards is shaky because power realities often override them. Might need to fall back on "this framework describes, doesn't endorse" but that's a retreat.

  For the Tokyo equivalence claim, the "must-land" reply is distinguishing between normative and descriptive authority - if this fails, the thesis unravels across contexts. Should prepare concrete examples of how both tribunals exercised constitutive power despite procedural differences.

  The prosecutor's "why bother" challenge requires connecting theory to practice - perhaps argue that misdiagnosing retroactivity leads to flawed modern legality principles, affecting charging decisions. But admit this is speculative.

