  ### 3. What to Say to the Volunteer Who Quit  
  > "You're right—this *does* judge people. But with 40 requests a week and not enough cash, we must triage. The procedure judges *events* ('Was this crisis avoidable?') not *lives* ('Are you a good person?'). It fails people born into unfairness because Step 2’s 'reasonableness' doesn’t account for poverty traps. But dropping it would let gamblers or reckless choices drain funds from true bad luck, like cancer or layoffs. We’ll escalate systemic cases (e.g., discrimination) to me. It’s not justice; it’s the best bad option for preventing the most misery with two volunteers and a spreadsheet."  

  **Does the procedure answer her charge?**  
  - **No**. Step 2 ("avoidable choice") assumes a level playing field. It doesn’t—and can’t—address how "choices" are warped by poverty, race, or disability. The escalation for systemic injustice tries to patch this, but it’s reactive, not built-in.
