prompt: |-
  For eighteen months I have kept a file of remarks from readers, and although I write a fortnightly column on books and the sciences of mind, I have never managed to pin down what the file is actually about. The remarks all come after the fact. A woman tells me she wept through a harrowing chapter of a novel and then learned in an interview that the episode was lifted almost intact from the author's own life; she describes the discovery as curdling rather than deepening her grief, and cannot say why, since the suffering is now more real than it was before. A man describes finishing a memoir that destroyed him and then reading that substantial portions of it were invented, and reports a peculiar impulse to take back the tears, as though they had been paid to the wrong account. A third reader, whose favourite novel for a decade was a translation, found out that the death scene she had mourned over and over had been softened by the translator and simply does not occur in the original. In every case the person insists, when pressed, that they never for a moment supposed the characters existed; the distress is not about having been tricked, and it is not that the feeling was unpleasant at the time. It is the sense that an emotion they genuinely had has been orphaned by later information about the status of its object, and that they are now mildly ashamed of it on their own behalf. One of them said she felt she had grieved out of turn.

  What I find most striking is an asymmetry. When people discover that the snake in a nature programme was a prop, or that the aircraft they braced for doom in was never in difficulty, the fear evaporates and they find the whole thing funny; nobody is embarrassed to have been afraid, because the feeling simply lapses. With the book the feeling does not lapse — it seems to persist while being retrospectively demoted, which is a strange combination, and it is why I doubt the label I am most often given. Several academics I put this to said I had rediscovered the paradox of fiction, but that puzzle concerns how we can be moved at all by people we know do not exist, and my correspondents have no trouble being moved; their difficulty is with having been moved. Nor is it the older puzzle about why we seek out distressing art, since the discomfort I am describing arrives later and attaches to the discovery rather than to the reading. I am looking for whatever the philosophy of emotion, or of fiction, calls this specific after-the-fact condition, and failing that, for a term I can defend in print.

  I am not after a bare name; I want the carving. Please answer as a numbered list of exactly five items, each of one or two sentences, with no introduction, no conclusion, and no bibliography. The first three items should each take one established concept that comes closest to what I have described — including any account that treats such responses as not full-blooded emotions, any account of emotions that persist against a person's own better judgment, and any account framed in terms of whether a feeling is appropriate to its object — and should state precisely where my phenomenon departs from it. The fourth item should give the term you would use for the phenomenon itself, with a definition sharp enough that I could tell a reader when it does and does not apply. The fifth item should settle two boundary cases for me: whether the same condition arises when the object was always real but the description of it turned out to be wrong, as with a eulogy delivered about a person the mourner had misremembered, and whether it arises when later information strengthens rather than weakens the claim on the feeling, as with my first correspondent.
reasoning: |-
  Hmm, the user is describing a very specific emotional phenomenon related to fiction. They've collected reader anecdotes where discovering factual inconsistencies about a work retroactively changes their emotional relationship to it - not by eliminating the emotion, but by making them feel ashamed of having felt it.

  I need to address their request precisely: five numbered items with strict formatting. First three items must contrast established concepts with this phenomenon. 

  For the first concept, the paradox of fiction comes to mind since it deals with emotional responses to fictional events. But that's about how we can feel anything for non-existent things, whereas here the emotion persists but feels illegitimate after factual revelations. The mismatch is clear: their correspondents had no problem feeling emotions initially, only with sustaining them after learning new information.

  For the second concept, cognitive dissonance fits partially because there's conflict between emotion and new knowledge. But cognitive dissonance typically drives attitude change, whereas here the emotion lingers despite judgment - it's more about shame than resolution. The persistence against judgment is key.

  For the third concept, fittingness theories of emotion seem relevant since they judge appropriateness to the object. But these focus on whether the emotion matches the object's true nature at the time of feeling, whereas the issue here is retrospective disqualification by later information about the object's status. The temporal gap matters.

  For the fourth item, I need to coin a precise term. "Retroactive affective disqualification" captures the core: "disqualification" implies revoked validity, "affective" centers emotion, and "retroactive" stresses the after-the-fact nature. The definition must exclude cases where emotions vanish (like fake snakes) and include only when shame persists.

  For the fifth item, boundary cases: 
  - Misremembered eulogy: yes, same condition because the feeling was directed at a misrepresented real object.
  - Strengthened claim (like discovering fiction was real): no, because the new information validates rather than undermines the emotion - no shame would attach.

  The user's "carving" request suggests they want conceptual precision above all. Their examples show this isn't about deception or unpleasantness, but about emotional ownership being voided. The academic jargon in my response should serve their need for publishable terminology while staying anchored to their vivid examples.
answer: |-
  1.  The **paradox of fiction** addresses how we feel genuine emotions for known-fictional characters; my phenomenon departs because the initial emotion *is* unproblematic, and the distress arises *later* from information changing the perceived status of the emotion's *grounding object*, not its fictionality itself.
  2.  **Cognitive dissonance** involves discomfort from holding conflicting beliefs/attitudes; my phenomenon departs because the core distress is not primarily the conflict itself but the *shame* attached to the *persisting* emotion feeling retrospectively *unwarranted* or misdirected, despite the new knowledge.
  3.  **Fittingness theories** judge an emotion's appropriateness to its object's actual properties *at the time*; my phenomenon departs because the emotion felt fitting *during* the experience is *retrospectively disqualified* by information revealing the object's *status* or *origin* (e.g., invented, altered, misattributed), creating shame for having felt it.

  4.  The phenomenon is **retroactive affective disqualification**: the *persistence* of an emotion alongside a *retrospective judgment* that its initial object was fundamentally misconstrued (in source, authenticity, or nature), leading to shame because the feeling now seems unwarranted *in light of its true origin*, not because it was unpleasant or deceptive. It applies only when the emotion persists *despite* knowledge undermining its grounding, causing affective shame; it does not apply if the emotion simply lapses or the issue is initial deception/fictionality alone.

  5.  *Misremembered eulogy (real object, wrong description)*: **Yes**, the same condition arises because the mourner's grief, though directed at a real person, was shaped by a misrepresentation, leading to retrospective shame for grieving *based on a falsehood*.
      *Strengthened claim (discovering fiction was real)*: **No**, the condition does not arise because the new information *validates* rather than disqualifies the emotion's grounding, eliminating the basis for retrospective shame; the feeling remains warranted.
