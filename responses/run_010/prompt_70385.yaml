  The user describes two examples. First, a committee member comments on a candidate's "enthusiastic" letters that he read twice, leading to divided interpretations without him intending any insinuation. Second, a peer reviewer notes a lab's recent data discussion, which could imply issues without stating anything directly. The speaker seems genuinely unsure of their own intention.

  The user has already ruled out several concepts: lying (since statements are true), misleading by implicature (no specific intended belief), paltering (no specific false belief intended), innuendo (speaker isn't being coy), and Frankfurtian bullshit (speakers care about truth). They note the effect is shifting what possibilities hearers consider live, making them epistemically worse off.

