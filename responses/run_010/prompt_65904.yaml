  Now, about Arrow's theorem: Arrow's theorem applies to ranked voting systems that require a complete and transitive ranking. It states that no ranked voting system can satisfy four seemingly reasonable criteria (unrestricted domain, non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives) simultaneously. 

  The condition that is often the culprit is independence of irrelevant alternatives (IIA). Arrow's theorem does not say that every voting system is arbitrary or rigged. It says that for ranked systems, it's impossible to have all four properties. 

  Approval voting is not a ranked system; it is a cardinal system (where voters indicate approval for each candidate). Therefore, Arrow's theorem does not apply to approval voting. However, approval voting has its own trade-offs. 

  The sortition argument: Arrow's theorem does not imply that we should pick randomly. It only shows that no ranked system can satisfy all four criteria. But that doesn't mean we cannot have a system that produces a fair outcome. In fact, in our poll, we see that Priya is the Condorcet winner, meaning she is preferred by a majority over each other candidate. So the data shows that there is a candidate who is broadly acceptable. 

