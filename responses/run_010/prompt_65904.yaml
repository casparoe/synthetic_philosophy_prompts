  **Subject:** Voting System Recommendation for Student Body President Election  

  #### Executive Summary  
  I recommend **approval voting** for this year's election, with **instant-runoff voting (IRV)** as a fallback if ballot changes cannot be implemented within 60 days. Approval voting ensures broad support, minimizes vote-splitting, aligns with our bylaws, and can be deployed via Google Forms with minimal changes. IRV is a principled alternative if technical constraints block approval voting, but it requires a ranked ballot that may exceed our deadline.  

