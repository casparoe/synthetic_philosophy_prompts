  Draft memo:

  ---

  **To:** Elections Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation for Student Body President Voting System  

  ### Introduction  
  As tasked, I have analyzed the voting systems under consideration for the student body president election. Using the practice poll data (600 students ranking four candidates: Marcus, Priya, Dana, Theo), I computed the outcomes under first-past-the-post (FPTP), instant-runoff voting (IRV), Borda count, and approval voting. I also checked for a Condorcet winner. Below, I summarize the results and provide a recommendation.  

  ### Key Findings from Practice Poll  

  1. **FPTP**:  
     - First-choice votes: Marcus (180), Priya (150), Theo (140), Dana (130).  
     - **Winner: Marcus** (30% of the vote).  

  2. **IRV (Instant Runoff)**:  
     - Round 1: Dana (last) eliminated; her 130 votes transfer to Theo (Theo: 140+130=270).  
     - Round 2: Priya (150) eliminated; her votes transfer to Marcus (Marcus: 180+150=330).  
     - **Winner: Marcus** (55% in final round).  

  3. **Borda Count** (points: 3 for 1st, 2 for 2nd, 1 for 3rd, 0 for 4th):  
     - Marcus: 890, Priya: 1130, Dana: 900, Theo: 680.  
     - **Winner: Priya**.  

  4. **Approval Voting** (assuming voters approve their top two candidates):  
     - Marcus: 330, Priya: 380, Dana: 220, Theo: 270.  
     - **Winner: Priya** (63.3% approval).  

  5. **Condorcet Winner**:  
     - Priya beats every other candidate in head-to-head matchups.  
     - **Condorcet Winner: Priya**.  

  ### Arrow’s Theorem and Sortition  
  Arrow’s theorem applies only to ranked voting systems and shows that no such system can simultaneously satisfy four fairness criteria (unrestricted domain, non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives). It does not prove all voting systems are “rigged” or arbitrary. In fact, our data shows a clear Condorcet winner (Priya), suggesting the outcome is not arbitrary. Sortition (random selection) is not a practical solution for electing a president and does not follow from Arrow’s theorem.  

  ### Approval Voting and Arrow’s Theorem  
  Approval voting is not a ranked system and thus falls outside Arrow’s theorem. However, it has trade-offs:  
  - **Ballot comprehension**: Easy for voters (check all acceptable candidates).  
  - **Strategy**: Voters might undervote (not approving a second choice to help their first) or overvote (approving too many). We can mitigate this through voter education.  
  - **Majority requirement**: The winner must be approved by a majority of voters (≥301 in our case). In our simulation, Priya had 380 approvals, satisfying this.  

  ### Time Constraint  
  Our ballot is a Google Form. Approval voting can be implemented by allowing multiple selections (checkboxes), which is a minor change. The district requires 60 days’ notice for ballot changes; we have 5 weeks (35 days). This is tight but feasible for approval voting. Other systems (IRV, Borda) would require a ranked ballot, which is complex to implement in Google Forms and may not meet the deadline.  

  ### Recommendation: Approval Voting  
  I recommend approval voting because:  
  1. It elected the Condorcet winner (Priya) in our data.  
  2. It is simple to implement on our current platform.  
  3. It avoids vote-splitting and can satisfy the majority requirement.  
  4. It is resistant to strategic voting if voters are instructed to approve all candidates they find acceptable.  

  **Fallback Option**: If the ballot change cannot be approved in time, we should use FPTP with a runoff (top two advance to a second round) if no candidate receives a majority. However, this requires two elections and may not be practical.  

  ### Criteria for Future Committees  
  1. **Majority Criterion**: The system should produce a winner supported by a majority of voters in the final round or via approvals.  
  2. **Condorcet Criterion**: The system should elect the Condorcet winner if one exists.  
  3. **Simplicity**: The system should be easy for voters to understand and straightforward to implement.  

  ### Conclusion  
  Approval voting best meets our needs for simplicity, fairness, and timeliness. I urge the committee to adopt it for this year’s election.  

