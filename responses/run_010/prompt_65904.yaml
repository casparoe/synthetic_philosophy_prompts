  - The ballot is a Google Form and cannot easily do a ranked ballot. Also, any change must be filed 60 days out, which is about 5 weeks from now. So we don't have time for a complex ballot change.

  Approval voting might be easier: we can set up the Google Form to have checkboxes for each candidate. That is straightforward. We can keep the current ballot (which is a list of candidates) and just change it to allow multiple selections (checkboxes). This should be feasible within the time constraint.

  But we must consider the majority requirement: under approval voting, the winner might not have a majority of the votes (if we interpret "votes cast" as the total number of approvals? or the number of voters?). The bylaws say "a majority of votes cast". In approval, we have two interpretations:

  1. The winner must have more than half of the voters approving them? (i.e., at least 301 approvals in a 600-voter election)
  2. Or, the winner must have more than half of the total approvals? That doesn't make sense because total approvals vary.

  Typically, "votes cast" in approval would be per voter: each voter casts one ballot, but that ballot may have multiple approvals. However, the majority requirement is ambiguous. But note: in the bylaws, it probably means a majority of the voters (i.e., more than half the voters must vote for the winner). In approval, that would mean the winner must be approved by at least 301 voters. 

  In our approval simulation (with top-two), Priya had 380, which is above 301. But if we had a scenario where no candidate gets 301, then we might have a problem. However, that seems unlikely because voters can approve multiple candidates.

  Alternatively, we might interpret the bylaw as requiring a majority in the context of the system. For FPTP, it's a majority of first-choice votes. For approval, it would be a majority of voters approving. But the bylaw might need to be reinterpreted.

  Given that they have ignored it for years, we might need to clarify. But for the memo, we note that under approval, it is possible to have a candidate with majority approval (over 50% of voters approving). In our simulation, Priya had 380 (which is 63.3%).

  Now, the strongest case for the other systems:

  - For FPTP: it is the simplest, and we already have the ballot set up. It requires no change. But we know it can lead to vote splitting and winners with low plurality.

  - For IRV: it ensures the winner has a majority in the final round, and it uses rankings which might better reflect preferences. But in our case, it did not pick the Condorcet winner. Also, the ballot change might be difficult: we would need a way to do rankings in a Google Form. We might have to use a series of dropdowns or multiple questions, which could be messy and might confuse voters. And we don't have time to redesign the form and get it approved if it's a complex change.

  - For Borda: it gives a complete ranking, but it is vulnerable to strategic voting (e.g., burying a strong opponent). Also, the ballot would require a full ranking, which again is hard on Google Forms.

  - For sortition: it is not a serious option for electing a president. The argument from Arrow's theorem is a misinterpretation.

  Recommendation:

  Given the time constraint and the need for a ballot that is easy to implement, approval voting is a good choice. It avoids the spoiler effect, it is simple for voters (just check the candidates you approve), and it can be implemented on Google Forms with checkboxes. Also, in our simulation, it elected the Condorcet winner (Priya). 

  Moreover, it escapes the Arrow theorem because it is not a ranked system. However, it has its own issues: voters might not know how many to approve (we can educate them to approve all they find acceptable). Also, it might encourage strategic voting (e.g., not approving a candidate who is a close challenger to your favorite). But it is a good compromise.

  If we run into trouble with the 60-day deadline, we might fall back to FPTP. But we should note that we can change the FPTP ballot to approval without changing the format? Actually, the format would change: from selecting one to selecting multiple. So we might need to file a change. But the change is minimal: we are just allowing multiple selections. We should check with the district.

  Alternatively, we could do a hybrid: use FPTP for this year but with a runoff if no majority? But that would require two rounds, which is more time-consuming.

  Given the time, approval voting seems the best.

  Criteria for the committee:

  1. Majority criterion: the system should ideally produce a winner with majority support (either in the final round or overall).
  2. Condorcet criterion: if there is a candidate who beats all others head-to-head, that candidate should win.
  3. Simplicity: both for voters and for ballot implementation.

  In our data, approval voting satisfied the majority criterion (Priya had 380>300) and the Condorcet criterion (Priya was the Condorcet winner). It is also simple to implement.

