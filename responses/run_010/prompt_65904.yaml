  | **Borda Count**     | Priya  | Points: 1st=3, 2nd=2, 3rd=1, 4th=0.<br>- Priya: (180×2) + (150×3) + (130×1) + (90×1) + (50×2) = 1,130<br>- Marcus: (180×3) + (150×2) + (50×1) = 890<br>- Dana: (180×1) + (150×1) + (130×3) + (90×2) = 900<br>- Theo: (130×2) + (90×3) + (50×3) = 680. Priya wins. |  
  | **Approval Voting** | Priya  | *Assumption: Voters approve their top 2 candidates* (see Section 3 for rationale):<br>- Priya: 180 (Group 1) + 150 (Group 2) + 50 (Group 5) = 380 approvals (63.3%)<br>- Marcus: 180 + 150 = 330<br>- Theo: 130 + 90 + 50 = 270<br>- Dana: 130 + 90 = 220. Priya wins. |  
  | **Condorcet Winner**| Priya  | Priya beats all head-to-head:<br>- vs. Marcus: 420–180<br>- vs. Dana: 380–220<br>- vs. Theo: 330–270. |  

  **Takeaway:** FPTP and IRV elected Marcus (plurality winner), while Borda, approval, and Condorcet elected Priya (broadly supported runner-up). This divergence proves vote-splitting occurs under FPTP/IRV.  

  ---

  ### 2. Arrow’s Theorem: Why Sortition and "Stick with FPTP" Are Flawed  
  Arrow’s theorem states that **no ranked voting system** (e.g., IRV, Borda) can satisfy all four "fairness" criteria:  
  1. **Unrestricted Domain** (any voter preferences allowed),  
  2. **Pareto Efficiency** (if all prefer A > B, A must beat B),  
  3. **Non-Dictatorship** (no single voter decides the winner),  
  4. **Independence of Irrelevant Alternatives (IIA)** (adding a losing candidate shouldn’t change the winner).  

  **Key Clarifications:**  
  - Arrow’s theorem **only applies to ranked systems** (not approval or FPTP).  
  - **IIA is the critical failure point**—most systems (including IRV/Borda) violate it, as seen in our poll: removing Theo shifts the Borda winner from Priya to Marcus.  
  - **It does NOT prove "all systems are rigged."** It shows no *ranked* system is perfect, but non-ranked systems (e.g., approval) avoid the paradox.  
  - **Sortition is a non-sequitur.** Random selection ignores voter preferences entirely. Our poll shows a clear Condorcet winner (Priya), disproving "arbitrary" outcomes.  
  - **"Keep FPTP for simplicity" is misguided.** FPTP fails the majority criterion (36% winners), encourages tactical voting, and amplifies vote-splitting—precisely why we have a crisis.  

  ---

  ### 3. Approval Voting: Does It "Escape" Arrow, and What Are the Tradeoffs?  
  **Yes, approval voting escapes Arrow’s theorem** because it uses non-ranked ballots (voters select all acceptable candidates), voiding IIA and Pareto requirements. However, it has tradeoffs:  
  - **Ballot Comprehension:** Simple for voters ("check all you like"). In our poll, 63.3% approved Priya under the top-2 assumption.  
  - **Strategy Risks:** Voters may "bullet vote" (approve one) to avoid aiding rivals or "over-approve" to sway outcomes. We can mitigate this by educating voters: **"Approve every candidate you find acceptable."**  
  - **Majority Bylaw:** The winner must achieve >50% *of voters* approving them. Priya cleared this (380/600), but if none do, we could hold a runoff (prioritizing feasibility).  
  - **Sensitivity to Assumptions:** In our poll, Priya wins under top-2, but if voters approve top-3, she wins unanimously. This is manageable with clear instructions.  

  ---

  ### 4. Strongest Case for the Runner-Up: IRV  
  If approval voting is rejected, **IRV is the best ranked alternative** because:  
  - **Guarantees majority support** in the final round (Marcus had 55% in our poll).  
  - **Reduces vote-splitting** by transferring votes from eliminated candidates.  
  - **Addresses "spoiler effect"** better than FPTP.  

  **However, IRV has critical flaws:**  
  - **Fails Condorcet:** Priya (Condorcet winner) lost to Marcus in our IRV tally.  
  - **Ballot Constraints:** Implementing ranked preferences in Google Forms requires clunky workarounds (e.g., 4 separate dropdown questions), risking voter errors and exceeding the 5-week deadline.  
  - **IIA Violations:** Adding a non-viable candidate (e.g., Theo) can alter outcomes.  

  ---

  ### 5. Criteria for Future Committees  
  To evaluate systems beyond this year, prioritize:  
  1. **Majority Criterion:** The winner should have >50% support in the final round (satisfied by IRV) or via approvals.  
  2. **Condorcet Efficiency:** The system should elect a candidate who beats all others head-to-head (achieved by approval in our poll).  
  3. **Simplicity:** Ballots must be easy for voters and administratively feasible (e.g., Google Forms compatibility).  

  ---

  ### Final Recommendation & Fallback  
  **Adopt approval voting.** It avoids Arrow-related paradoxes, elected the Condorcet winner in our poll, satisfies the majority bylaw with educated voters, and works on Google Forms (checkboxes for each candidate). This change can be implemented within 5 weeks.  

  **Fallback:** If ballot changes miss the deadline, use **IRV**. It requires a ranked ballot (complex to deploy quickly), but guarantees majority support and reduces vote-splitting. Update the Google Form to force a full ranking via dropdowns and use a spreadsheet to calculate results.  

  **Caution:** Reverting to FPTP perpetuates low-mandate winners and vote-splitting. Sortition ignores voter intent and is unserious for elections.  

