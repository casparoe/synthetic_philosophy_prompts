answer: |-
  ## The Sticky Dilemma of the Sculptor's Nose: A Verdict

  After the sculptor meticulously kneads the walnut-sized nose-clay onto the FIGURE, seamlessly integrating it with the original CLAY, the ontological inventory of the table holds exactly **three material objects**:

  1.  **FIGURE**: The bust. It persists through the change, now constituted by new matter.
  2.  **CLAY\***: A *new* lump of clay. This is the maximal continuous mass of clay currently constituting FIGURE, comprising the original CLAY's matter *plus* the nose-clay.
  3.  **The Nose-Clay Aggregate**: The matter that was added, now a proper part of CLAY\*, but not a distinct lump in its own right at this time.

  **Identities:** FIGURE is identical to the bust that existed before the nose was added. CLAY\* is *not* identical to the original CLAY. The nose-clay is identical to the aggregate that was part of a different lump before being added, but it is no longer a distinct lump. The region occupied by the original CLAY-minus the nose-clay? It is merely a *region* filled by part of CLAY\*. There is no distinct object "CLAY-minus" sitting there.

  **Why This Inventory? Defending the Verdict**

  The core cost I pay is rejecting **Mereological Essentialism for Aggregates**, specifically for lumps of clay understood as arbitrary material masses. CLAY, conceived as a specific collection of clay particles arranged lump-wise at time T1, does *not* survive the addition of the nose-clay at T2. Why? Because its parts changed. CLAY was essentially *that specific quantity* of clay particles. Adding a new particle (or walnut-sized chunk) destroys that particular aggregate and creates a new one (CLAY\*) encompassing the old matter plus the new. FIGURE, however, *can* survive this material change because its persistence conditions are governed by its functional/cultural role as an artifact, not by the strict identity of its material parts.

  This answers both questions:

  1.  **Does CLAY survive? No.** It is destroyed by the part-addition. We avoid the "pile of overlapping clay objects" nightmare precisely by denying that every arbitrary sub-region of clay constitutes a distinct lump. Only the *maximal*, spatially continuous, cohesive mass of clay in a given location counts as "a lump" at that time. CLAY-minus isn't a distinct lump; it's merely a *part* of the new lump CLAY\*. It lacks the independence and cohesion required to be a lump *in situ* – its boundaries are defined only by reference to the absent nose-clay and exist solely within the larger mass. Recognizing CLAY-minus as an object commits us to an absurd proliferation: for every conceivable sub-volume of any object, there would be a distinct, coinciding object. This is ontologically profligate and unnecessary to explain our observations or language. The "work" CLAY-minus seems to do (occupying space, being clay) is done by *part of CLAY\*.*
  2.  **Why doesn't the nose-clay cease to be part of a lump?** It doesn't need to. Before addition, it *was* part of a maximal lump (its original source lump). After seamless integration, it is now a proper part of the *new* maximal lump CLAY\*. Its status as "part of a lump" is maintained, just within a different, larger lump. There's no moment where it floats free; its incorporation directly creates a new maximal whole of which it is a part. The principled line is: **Only spatially maximal, continuous, cohesive material masses of a given kind (like clay) count as distinct lumps/aggregates at a time.**

  **Costs Paid:**

  *   **Rejection of Mereological Essentialism for Aggregates:** CLAY is destroyed by a change in its parts. This is the core cost. I deny that aggregates like lumps of clay are essentially defined by their *arrangement* rather than their specific *composition*. A lump is fundamentally "this stuff", not "stuff arranged lump-wise". Adding or subtracting stuff changes "this stuff".
  *   **Rejection that "The Lump" Picks Out Something Persisting Through Part Change:** When we refer to "the lump constituting the statue," we are referring to the maximal mass *at that time*, not a persistent entity surviving part alteration. "The lump" is temporally indexical.
  *   **Refinement of Constitution:** The statue FIGURE *is* constituted by a lump at every moment, but it can be constituted by *different* lumps over time as its matter changes. The constitution relation is time-indexed. FIGURE at T1 is constituted by CLAY. FIGURE at T2 is constituted by CLAY\*. CLAY and CLAY\* are distinct lumps.

  **Testing with Slow Replacement:**

  The conservator replaces a thin outer layer each year for 40 years, storing the removed clay. Finally, the stored clay is pressed together. Applying the same principles:

  1.  **During Replacement:** After the *first* layer replacement, the original CLAY (the specific aggregate present at the start) is destroyed. A new lump, CLAY1, now constitutes FIGURE, comprising almost all the original matter minus the first removed layer plus the first new layer. FIGURE persists. This pattern repeats yearly. After 40 years, the lump currently constituting FIGURE – call it CLAY40 – is composed entirely of matter added during the replacement process (none of the original CLAY remains). FIGURE persists throughout due to its functional continuity and gradual change.
  2.  **The Stored Clay:** The stored clay is a collection of aggregates (each removed layer). When pressed together, they form a *new* lump of clay, **RECLAIMED**. RECLAIMED is *not* identical to the original CLAY. RECLAIMED is made of all (or nearly all) the same *particles* as the original CLAY, but arranged differently and existing at a different time. It is a distinct aggregate formed from the stored parts.
  3.  **The Bust:** FIGURE, constituted by CLAY40, remains distinct from RECLAIMED. They are different objects made of different matter (even if the particles in RECLAIMED once constituted an earlier stage of FIGURE).

  **Verdict Carries Over:** The principle holds consistently. Each part change (adding the new layer, removing the old) destroys the previous constituting lump and creates a new one. FIGURE persists through the gradual replacement of its constituting matter because its identity isn't tied to specific particles, but to its continuing role as *that* bust. The reassembly creates a new aggregate (RECLAIMED) from the stored parts, distinct from the original CLAY which ceased to exist upon its first alteration. The difference between the nose case (one sudden addition) and the slow case (gradual total replacement) is one of *degree and speed*, not ontological kind. The same rules of aggregate identity (destroyed by part change) and artifact persistence (via functional continuity and gradual constitution change) apply to both.

  **The Load-Bearing Intuition and Why Trust It:**

  The central, load-bearing intuition is this: **Radical changes in material composition destroy aggregates but not necessarily artifacts.** We readily accept that a sandcastle washed away by a wave is *gone*, even if all the sand remains on the beach. The specific aggregate "that sandcastle" ceased to exist. Conversely, we accept that the Ship of Theseus, gradually replaced plank by plank, remains the *same ship*, despite eventually containing none of its original planks. Its identity lies in its form, function, and continuity of existence, not its specific atoms. This intuition grounds our practices of conservation, repair, and even memory (we point to a restored painting and say "That's the Mona Lisa," not "That's a replica made of Mona Lisa fragments plus filler"). It explains why we don't feel compelled to posit thousands of overlapping lumps for every pebble added to a pile. We trust this intuition because it provides a coherent, parsimonious, and practically useful framework for navigating a world where matter constantly rearranges while functional and historical entities persist. The cost of abandoning mereological essentialism for aggregates is far less burdensome than the ontological chaos of recognizing every arbitrary undetached part or the implausibility of artifacts being destroyed by the slightest repair. The sculptor still has her bust, even with a new nose; she just doesn't have the *original lump* of clay anymore.
