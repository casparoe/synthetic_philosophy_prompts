prompt: |-
  I'm a third-year stats PhD student, and my dissertation chapter is about when you should defer to a model's own probability outputs — basically treating a fitted model as an expert and matching your probabilities to its. To get the philosophy straight I went to a reading group where we read a chapter of some trade-press book by a physicist about randomness, and there's a couple of pages on Lewis's Principal Principle. I've pasted the passage below. Nobody in my department works on this stuff and the philosophy grad in the group mostly just nodded along, so I have no idea how much of it to trust — I want to lean on it in a footnote but I'm worried it's going to make me look bad.

  Here's the passage: "David Lewis's Principal Principle is the bridge between objective chance and rational belief. It says that chance is whatever plays a certain role in our degrees of belief: if you know that the objective chance of some event is x, and you have no evidence bearing on whether that event happens, then your degree of belief in it should be exactly x. Rationality, in other words, requires you to defer to the chances. Chance on this picture is a fixed property of a physical set-up, like a mass or a charge, and it stays fixed however much of the future unfolds. Strictly speaking the principle isn't an optional extra bolted onto probability theory, since a credence function that violates it is incoherent in the technical sense and can be Dutch-booked. That is also why Lewis thought chance earns its name: chance is defined as whatever quantity obeys the constraint, so the Principle is a piece of conceptual analysis rather than a discovery about the world, and which chances the world actually has is settled by the same stroke. Philosophers of statistics treat this as a deep result, but it is really just the requirement of calibration written in a different notation — a forecaster whose degrees of belief match the true chances is calibrated, and one whose degrees of belief violate the Principal Principle is not. Lewis did note one wrinkle. Some evidence is admissible and some is not, and inadmissible information can license you to depart from the chances, but he showed that information about the past is admissible, so in practice you may conditionalize on anything you've actually learned. The upshot is uncomfortable for the Humean, and Lewis admitted as much. If chances are just a summary of what happens, then knowing what is going to happen would settle what the chances are, which is to say his own principle makes chance unknowable in exactly the cases that matter. He never found a way out."

  My instincts, which may well be wrong: the calibration sentence is the load-bearing one for my chapter and I suspect it's too quick, since calibration is about long-run agreement between stated probabilities and observed frequencies whereas this is about what to believe conditional on a chance claim; also "he showed that information about the past is admissible" sounds way too clean for something people describe as delicate; and "he never found a way out" feels cheap. But I can't tell which of those hunches are right, and I don't know what I'm missing entirely.

  So: go through the passage sentence by sentence (or clause by clause where a sentence does two things) and tell me what a philosopher of probability who actually works on Lewis would accept, what they'd wince at, and what is just false. Then tell me whether the big conclusions survive once the details are fixed. No need to point me at literature or give me a bibliography — I want the audit itself, not a reading list.

  Please answer as a single JSON object, no prose outside it, with this schema:

  - `passage_audit`: array of objects, one per sentence/claim, each with:
    - `claim`: a paraphrase of the claim, under 15 words
    - `verdict`: one of `accurate`, `fair_simplification`, `misleading`, `wrong`, `contested_among_defenders`
    - `what_holds_up`: what the claim gets right
    - `where_it_goes_wrong`: the specific defect, or `null` if there isn't one
    - `specialist_reaction`: what a Lewis scholar would say back, one or two sentences
    - `minimal_rewrite`: the claim rewritten so a specialist would sign it
  - `conclusions`: array of objects, one for each big inference the passage draws (at minimum: the Principle-is-just-calibration line, the "conceptual analysis settles which chances there are" line, and the "Humeanism makes chance unknowable and Lewis never escaped it" line), each with `claim`, `survives_correction` (`yes`/`partly`/`no`), and `why`
  - `omissions`: array of strings, things the passage leaves out that would change how a careful reader uses it
  - `safe_to_lean_on`: array of strings, claims from the passage I could actually reuse when arguing that deferring to a model's probability output is the statistically respectable thing to do
  - `biggest_single_problem`: one sentence naming the worst thing in the passage
reasoning: |-
  We are given a passage from a book about Lewis's Principal Principle, and we need to audit it for accuracy.
   The user is a stats PhD student and wants to know if they can safely use this in a footnote without looking bad.
   We are to provide a JSON object with a detailed audit, as per the specified schema.

   Steps:
   1. Break the passage into claims (sentence-by-sentence or clause-by-clause). We'll split the passage into 7 claims based on the sentences and the distinct ideas in longer sentences.
   2. For each claim, provide:
      - `claim`: a paraphrase (under 15 words)
      - `verdict`: one of: accurate, fair_simplification, misleading, wrong, contested_among_defenders
      - `what_holds_up`: what the claim gets right
      - `where_it_goes_wrong`: the defect or null
      - `specialist_reaction`: one or two sentences of what a Lewis scholar would say
      - `minimal_rewrite`: the claim rewritten so a specialist would sign it

   3. Then, for the `conclusions` array, we consider the big inferences drawn in the passage:
      a. The Principal Principle is just the requirement of calibration written differently.
      b. The Principle is conceptual analysis and settles which chances there are.
      c. Humeanism makes chance unknowable and Lewis never found a way out.

      For each, we say if the conclusion survives correction (yes/partly/no) and why.

   4. `omissions`: things the passage leaves out that would change how a careful reader uses it.

   5. `safe_to_lean_on`: which claims from the passage can be reused for the argument about deferring to a model's probability.

   6. `biggest_single_problem`: one sentence naming the worst thing.

   Let's break the passage into claims:

   Claim 1: "David Lewis's Principal Principle is the bridge between objective chance and rational belief. It says that if you know that the objective chance of some event is x, and you have no evidence bearing on whether that event happens, then your degree of belief in it should be exactly x."

   Claim 2: "Rationality, in other words, requires you to defer to the chances. Chance on this picture is a fixed property of a physical set-up, like a mass or a charge, and it stays fixed however much of the future unfolds."

   Claim 3: "Strictly speaking the principle isn't an optional extra bolted onto probability theory, since a credence function that violates it is incoherent in the technical sense and can be Dutch-booked."

   Claim 4: "That is also why Lewis thought chance earns its name: chance is defined as whatever quantity obeys the constraint, so the Principle is a piece of conceptual analysis rather than a discovery about the world, and which chances the world actually has is settled by the same stroke."

   Claim 5: "Philosophers of statistics treat this as a deep result, but it is really just the requirement of calibration written in a different notation — a forecaster whose degrees of belief match the true chances is calibrated, and one whose degrees of belief violate the Principal Principle is not."

   Claim 6: "Lewis did note one wrinkle. Some evidence is admissible and some is not, and inadmissible information can license you to depart from the chances, but he showed that information about the past is admissible, so in practice you may conditionalize on anything you've actually learned."

   Claim 7: "The upshot is uncomfortable for the Humean, and Lewis admitted as much. If chances are just a summary of what happens, then knowing what is going to happen would settle what the chances are, which is to say his own principle makes chance unknowable in exactly the cases that matter. He never found a way out."

   Now, we'll go through each claim.

   Note: We are auditing from the perspective of a Lewis scholar.

   Claim 1:
     Paraphrase: PP: if know chance is x and no evidence, belief should be x.
     Verdict: accurate (but note: the "no evidence" is a simplification because of admissible evidence, but the claim says "no evidence bearing on whether that event happens", which is a way to say no inadmissible evidence? But it's a bit vague. However, the standard initial statement of PP is exactly this. So we'll say accurate.)

   Claim 2:
     Paraphrase: Chance is fixed like mass, stays fixed as future unfolds.
     Verdict: fair_simplification. Lewis does think of chance as a physical feature, but note that for Lewis, chances are time-dependent and can change over time? Actually, Lewis's view (in "A Subjectivist's Guide to Objective Chance") is that chance at a time is a function of the history up to that time and the laws. So chance at time t is fixed by the state of the world up to t and the laws. But the passage says "stays fixed however much of the future unfolds" — that might be misleading because if we are at time t, we are talking about chance at t, and it doesn't change as the future after t unfolds? Actually, the chance at t is fixed and does not change. But note: the chance of an event that happens at time t' > t might change as time passes? So the chance of the event at a later time is different? The claim says "chance ... stays fixed however much of the future unfolds" — that is true for the chance at a given time. So it's okay? But note: the chance at a time is fixed, but as time moves, the chance at the new time might be different. So the claim is a bit ambiguous. But we'll say fair_simplification because it's generally accepted that chance is time-dependent and fixed at a time.

   Claim 3:
     Paraphrase: Violating PP leads to incoherence and Dutch-book vulnerability.
     Verdict: contested_among_defenders. Lewis did assert that violating PP leaves one vulnerable to a Dutch book, but note that the Dutch book argument for PP is not universally accepted. Some philosophers (like Howson and Urbach) have challenged that Dutch-book arguments can justify such principles. Moreover, Lewis himself did not use Dutch-book arguments to justify PP. He presented it as a rationality constraint. So the claim that it can be Dutch-booked is not without controversy. Also, note that incoherence in the technical sense (Dutch book) is one way to put it, but Lewis didn't emphasize that.

   Claim 4:
     Paraphrase: PP defines chance by conceptual analysis, settling which chances exist.
     Verdict: fair_simplification. This captures Lewis's view that the Principal Principle is a constraint that any adequate notion of chance must satisfy. But note: Lewis did not think that the PP alone defines chance. He also required that chances be probabilities and that they are governed by the laws of nature. So the PP is a key part but not the whole definition. The claim that "which chances the world actually has is settled by the same stroke" is a bit too strong because the PP doesn't tell us which chances are instantiated; it tells us what chance is. The actual chances are determined by the best system (for Lewis, the Humean best system) and then the PP tells us how to set our credences. So the PP is a constraint on what can count as chance, but it doesn't by itself settle what the chances are.

   Claim 5:
     Paraphrase: PP is just calibration in different notation.
     Verdict: misleading. Calibration is about long-run frequencies matching the probabilities. The Principal Principle is about what to believe when you know the chance. They are related but not the same. A calibrated forecaster might not be following the PP (if they don't condition on known chances). Also, the PP is a synchronic constraint on credences at a time, while calibration is a diachronic property. Moreover, Lewis did not present the PP as equivalent to calibration. So this is a simplification that might mislead.

   Claim 6:
     Paraphrase: Past information is admissible, so in practice you condition on what you've learned.
     Verdict: misleading. Lewis did say that historical information (up to the time of the chance) is admissible, but he didn't show that all past information is admissible. In fact, he left open the possibility that some past information might be inadmissible (like information about the future). Also, note that Lewis's admissibility is relative to a time and an event. The claim says "information about the past is admissible" — but that's not exactly what Lewis said. He said that information about events up to time t (the time of the chance) is admissible, but information about the future is not. Moreover, even some past information might be inadmissible if it includes "inadmissible" information about the future? Actually, for Lewis, any information about events before t is admissible? Not exactly: he says that the complete history of the world up to time t is admissible. But if you have incomplete information, it might be that some past information is not the complete history and might be inadmissible? No, Lewis's point is that if you have information that is entirely about the past (relative to t), then it is admissible. But note: the passage says "so in practice you may conditionalize on anything you've actually learned" — that is too quick because some of what you've learned might be about the future? Lewis is talking about conditionalizing on the total evidence, but the admissibility clause is meant to be part of the PP. The PP says: conditional on the chance at t being x and on any admissible evidence, your credence should be x. So if your evidence includes inadmissible evidence (like the future outcome), then you don't set your credence to x. The passage's simplification might lead one to think that in practice we can ignore the admissibility clause because we only learn about the past, but that's not true: we sometimes have information about the future (e.g., from time travel, oracles, etc.). Lewis introduced admissibility precisely to handle such cases.

   Claim 7:
     Paraphrase: For Humeans, knowing the future would settle chances, making chance unknowable when it matters. Lewis never solved this.
     Verdict: accurate. This is the "undermining" problem that Lewis acknowledged and tried to solve. He did propose a solution (the "New Principle") but then retracted it? Actually, he proposed a modified principle but wasn't entirely satisfied. The passage says "He never found a way out" — that is a fair representation because Lewis himself said he was not entirely satisfied and the problem remained open.

   Now, let's write the audit for each claim.

   Claim 1:
     claim: "PP: if know chance is x and no evidence, belief should be x."
     verdict: accurate
     what_holds_up: This is the standard formulation of the Principal Principle without admissibility qualifications, which Lewis used initially.
     where_it_goes_wrong: null
     specialist_reaction: "This is the core of the Principal Principle, though Lewis later refined it with the concept of admissibility."
     minimal_rewrite: "David Lewis's Principal Principle says that if you know that the objective chance of an event is x and you have no inadmissible evidence, then your degree of belief in that event should be x."

   Claim 2:
     claim: "Chance is fixed like mass, stays fixed as future unfolds."
     verdict: fair_simplification
     what_holds_up: Lewis did think of chance as a physical feature and that the chance at a given time is fixed.
     where_it_goes_wrong: It doesn't mention that chance is time-dependent and that the chance at a later time might be different.
     specialist_reaction: "While chance at time t is fixed and doesn't change as the future after t unfolds, chances at different times may differ."
     minimal_rewrite: "Chance at a given time is a fixed property of the physical set-up at that time, and remains fixed regardless of how the future unfolds."

   Claim 3:
     claim: "Violating PP leads to Dutch-book incoherence."
     verdict: contested_among_defenders
     what_holds_up: Lewis did think that violating the Principal Principle is irrational, and some have argued it leads to Dutch books.
     where_it_goes_wrong: Lewis did not justify the PP by Dutch-book arguments, and the connection is debated.
     specialist_reaction: "While Lewis held that violating PP is irrational, he did not rely on Dutch-book arguments, which are controversial for this principle."
     minimal_rewrite: "Lewis argued that a credence function that violates the Principal Principle is irrational, and some have claimed it can be Dutch-booked."

   Claim 4:
     claim: "PP defines chance by conceptual analysis, settling which chances exist."
     verdict: fair_simplification
     what_holds_up: Lewis presented the Principal Principle as a key constraint that any adequate notion of chance must satisfy, and that it helps fix the concept.
     where_it_goes_wrong: The PP alone doesn't define chance; it must also be a probability and fit into the best system of laws.
     specialist_reaction: "The Principal Principle is a central part of Lewis's analysis of chance, but it is not the whole story; chances must also be probabilities and fit into the best system of laws."
     minimal_rewrite: "Lewis argued that chance is defined as whatever quantity satisfies the Principal Principle, so the principle is conceptual analysis, and the actual chances are those that fit into the best system of laws."

   Claim 5:
     claim: "PP is just the calibration requirement."
     verdict: misleading
     what_holds_up: There is a connection: if the chances are calibrated, then following PP will lead to calibrated beliefs in the long run.
     where_it_goes_wrong: Calibration is a frequentist property over many events, while PP is a constraint on a single credence.
     specialist_reaction: "The Principal Principle is not equivalent to calibration; it is a synchronic constraint on credences given knowledge of chance, while calibration is a diachronic property."
     minimal_rewrite: "The Principal Principle ensures that, in the long run, an agent's credences will be calibrated if the chances are true, but the principle itself is about immediate deference to known chances."

   Claim 6:
     claim: "Past info is admissible, so in practice you condition on what you learned."
     verdict: misleading
     what_holds_up: Lewis did say that historical information (up to the time of the chance) is admissible.
     where_it_goes_wrong: The passage implies that all past information is admissible and that we can ignore admissibility in practice, but sometimes we have future information.
     specialist_reaction: "While Lewis held that information about events up to the time of the chance is admissible, he did not claim that all information we have is admissible, especially if it includes information about the future."
     minimal_rewrite: "Lewis argued that information solely about the past up to the time of the chance is admissible, so in typical cases where we lack information about the future, we can conditionalize on our evidence."

   Claim 7:
     claim: "Humeanism makes chance unknowable when it matters; Lewis never solved it."
     verdict: accurate
     what_holds_up: Lewis acknowledged the problem of undermining for Humean accounts and struggled to solve it.
     where_it_goes_wrong: null
     specialist_reaction: "This correctly describes the undermining problem and Lewis's unsuccessful attempts to resolve it."
     minimal_rewrite: "The upshot is a problem for Humeanism: if chances are summaries of the entire history, then knowing the future would undermine the chances, and Lewis never found a fully satisfactory solution."

   Now, the conclusions array:

   We have three big inferences:

   a. The Principal Principle is just calibration in different notation.
      survives_correction: no
      why: The PP is a synchronic constraint on credence given knowledge of chance, while calibration is a diachronic property of long-run frequency agreement. They are conceptually distinct.

   b. The Principle is conceptual analysis and settles which chances there are.
      survives_correction: partly
      why: The PP is a key part of Lewis's conceptual analysis of chance, but it does not by itself settle which chances exist; that is determined by the best system analysis.

   c. Humeanism makes chance unknowable and Lewis never escaped it.
      survives_correction: yes
      why: This is an accurate summary of the undermining problem for Humean accounts of chance, which Lewis acknowledged and failed to resolve to his own satisfaction.

   Omissions:
   - The passage omits the distinction between chance at a time and how it changes over time.
   - It omits the fact that Lewis refined the Principal Principle to the New Principle to address undermining, but then was not fully satisfied.
   - It does not mention that admissibility is defined relative to a time and an event, and that it's not just about past information but about the complete state of the world up to that time.
   - It omits that the Dutch book argument for the PP is controversial and not Lewis's own justification.

   Safe to lean on (for arguing that deferring to a model's probability is statistically respectable):
   - The core idea of the Principal Principle: that if you know the chance (or a model's probability) and have no reason to doubt it (no inadmissible evidence), then you should set your credence to that probability. So the first claim (Claim 1) is safe.
   - The point that violating the Principal Principle is seen as irrational (Claim 3, but without the Dutch-book part? Or with caution?).

   We'll list specific claims by their paraphrase that are safe:

   - "PP: if know chance is x and no evidence, belief should be x." (Claim 1)
   - "Chance is fixed like mass, stays fixed as future unfolds." (Claim 2, but with the understanding that it's at a time)
   - "Humeanism makes chance unknowable when it matters; Lewis never solved it." (Claim 7) [if relevant to the argument? But the user wants to argue for deferring to a model, so maybe not directly]

   However, note: the user wants to argue for deferring to a model's probability. The Principal Principle is about deferring to objective chances. The analogy might be that the model is providing a kind of chance. But the passage doesn't make that analogy. So the safe claims are the ones about the Principal Principle itself, without the controversial interpretations.

   So safe to lean on:
     - The definition of the Principal Principle (as in Claim 1, rewritten minimally to be precise).

   We'll say:
     safe_to_lean_on: [
          "Principal Principle: if know chance is x and no inadmissible evidence, belief should be x.",
          "Violating the Principal Principle is irrational (though the Dutch-book argument is contested)."
       ]

   But note: the user might want to say that in the context of a model, we treat the model's output as chance? That's a leap. The passage doesn't support that. So we stick to the claims about the PP.

   Alternatively, the safe part is the core idea of deference.

   Biggest single problem: The worst thing is the conflation of the Principal Principle with calibration (Claim 5) because it misrepresents the nature of the principle and could mislead a statistical audience.

   So: "The conflation of the Principal Principle with the statistical concept of calibration."

