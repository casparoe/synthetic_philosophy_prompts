  Nose and Eiffel Tower clearly don't interact meaningfully, so no unity.

  Now, synthesizing these: functional unity seems central. An object exists when parts are arranged to perform a function that the parts alone can't. But the coins example contradicts—they function as a stash. So maybe add that the function must be an emergent property, not just aggregation. Coins in a pile don't have an emergent function; they're just stored. The pile doesn't do anything collectively beyond being a group. Whereas a bike transports, a sandcastle is a structure, etc.

  Also, cohesion: bonded parts (glue) or structural integrity (sandcastle) might be necessary. The solar system has gravitational cohesion. The flock has behavioral cohesion through collective motion.

