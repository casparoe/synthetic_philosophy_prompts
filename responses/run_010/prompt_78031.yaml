prompt: |-
  I am the elections and registry officer for the Kestrel Basin Commission, a body created three years ago by an interstate compact to manage a shared aquifer and the river it feeds. The Compact attaches a franchise to two of our instruments: a consultative basin-wide referendum every four years, whose results the Commission is obliged to answer formally, and two standing citizens' panels — one on withdrawal permits, one on allocation during drought — that are filled by sortition from the same roll. My office maintains that roll. The difficulty is that the basin is a hydrological unit while the affected population is not: some of our binding rules reach people well outside the boundary, and the boundary contains people whom our rules barely touch. We receive eight to twelve eligibility petitions a year, from individuals, from municipalities, and from companies; each determination is a public record, is cited as precedent in later petitions, and three have already been appealed to our general counsel. My staff is two people. I have a public policy background and no legal training, each written determination has to fit on two pages and be readable aloud at a public hearing, and anything departing from a prior determination needs the general counsel's signature.

  Article 4 of the Compact was a political compromise and reads, in substance, as follows. Clause (a): persons ordinarily resident within the basin. Clause (b): persons subject to binding rules issued by the Commission. Clause (c): persons whose significant interests are materially affected by Commission decisions. Clause (4): an applicant qualifies by satisfying any two of the three, and no one may be excluded solely for failing the residence clause. Clause (5): no determination under this Article may be made by a vote of those already enrolled. I want you to turn this into a decision procedure my office can actually run, grounded in whatever the political theory of democratic boundaries has to say that is usable — the difference between being subject to rules and being affected by them, why those come apart, how much affectedness is enough to warrant a vote rather than mere consultation, and what becomes of the question when the people who would decide the boundary are themselves inside it. Please give me the questions in order, with a statement of what counts as a sufficient answer to each and what evidence discharges it; a rule for burden of proof and for provisional enrollment when an applicant cannot produce documentation; explicit instructions for handling legal entities, since several petitions come from corporations and agencies rather than natural persons, and for whether such a petition is routed to members, employees, or shareholders, or refused at the threshold; a short list of the points at which the procedure must stop and hand the question up, because what is at issue is a value judgment (what makes an interest significant, whether affectedness without subjection deserves a vote or a hearing, whether the roll can contain anyone not yet born) rather than a fact my office can establish; and a flag on every step that looks mechanical but is in truth a judgment call wearing a procedural costume. Include a two-page template for the written determination, and a rule for what to do when a new petition cannot be reconciled with an old one.

  Then run the procedure on three petitions before us this quarter. First, roughly fourteen hundred seasonal farmworker households who live in employer-provided housing inside the basin from April to November, are fully subject to our well-siting and withdrawal rules, but are domiciled for tax and census purposes in another state; I expect your procedure to enroll them and I would like them enrolled, so if it does not, say so plainly rather than relaxing a test. Second, a hyperscale data center sited three kilometres outside the boundary that draws eleven million litres a day through an intake pipe inside the basin, is squarely subject to our withdrawal rules, and by any measure materially affects the aquifer, but is a legal person with no resident members. Third, a downstream coastal town sixty kilometres outside the basin whose shellfish beds have been damaged by nutrient loading in our permitted discharge, which claims affectedness and denies subjection. At least one of these three determinations should come out against a party I am sympathetic to and will have to defend at a hearing; I would rather the procedure be honest than comfortable. Finally, tell me what this procedure cannot do: where Clause (5) forecloses the obvious escape from the regress, why the roll's composition remains a political question after the tests have been run, and how the procedure will systematically misfire if used for anything beyond the two instruments it was written for. I do not want a reading list, a bibliography, or a survey of positions; I want something a colleague with no philosophy could pick up and apply on a Tuesday afternoon.
reasoning: |-
  We are creating a decision procedure for eligibility under Article 4 of the Compact. The applicant qualifies by satisfying any two of the three clauses: (a) ordinary residence within the basin, (b) subject to binding rules, or (c) significant interests materially affected by Commission decisions. No one may be excluded solely for failing (a). Determinations must be made without a vote of the enrolled.

  The procedure must handle natural persons and legal entities, assign burden of proof, allow for provisional enrollment, and flag judgment calls. It must also include a template for the written determination and rules for handling conflicts with prior determinations.

  ### Decision Procedure

  #### Step 0: Preliminary Classification
  - **Action**: Determine if the applicant is a natural person, a legal entity (corporation, government agency, NGO, etc.), or a group (like a household or an unincorporated association).
    - *If natural person*: Proceed to Step 1.
    - *If legal entity or group*: 
      - **Rule for entities**: The entity must be considered as a single applicant. However, we must determine if the entity is the appropriate unit or if we should consider its members/employees/shareholders. 
        - *Threshold rule*: The entity itself is the applicant unless it is a mere shell (e.g., a holding company with no operations) or the petition is on behalf of a specific group within (e.g., employees). In such cases, the petition must be refiled for the specific group. Otherwise, we consider the entity as having the attributes (residence, subjection, affectedness) through its operations and location.
        - *Judgment call*: Deciding whether an entity is a shell or whether a subgroup should be considered. Stop and hand up if: the entity structure is complex (e.g., multi-tiered subsidiaries) or the petition is ambiguous about the beneficiary (e.g., "for our employees" without specifying who). 
      - *Evidence*: Legal registration documents, operational addresses, organizational structure.
      - *Burden*: On the applicant to prove the entity's existence and operations.
      - *Provisional enrollment*: If the entity cannot produce documents (e.g., pending registration), enrollment is provisional for 90 days, during which documents must be provided.

  #### Step 1: Clause (a) - Ordinary Residence
  - **Question**: Is the applicant ordinarily resident within the basin?
  - **Sufficient answer**: Yes, if the basin is the place where the person/entity has its settled or usual abode, to which they return after temporary absences. For natural persons: physical presence with an intention to remain indefinitely or for a substantial period (not transient). For entities: principal place of business or registered office within the basin.
  - **Evidence for natural persons**: Lease, utility bills, voter registration, driver's license, tax returns showing basin address, employment records. For seasonal workers: a fixed and regular pattern of residence (e.g., same employer-provided housing annually for the season).
  - **Evidence for entities**: Business license, tax records, property deeds, or official registration showing a basin address.
  - **Burden of proof**: On the applicant to show ordinary residence. If evidence is lacking but the applicant claims residence, they may be given 30 days to provide documentation, else clause (a) is not satisfied.
  - **Judgment call**: Deciding "ordinary" in unusual patterns (e.g., digital nomads, seasonal workers). Also, for entities: what constitutes "residence"? Stop and hand up if: the pattern of presence is ambiguous (e.g., a person with multiple homes) or the entity operates in multiple locations without a clear principal place.
  - **Provisional enrollment**: If the applicant claims residence but lacks documents (e.g., homeless, or documents in process), they can be provisionally enrolled for 90 days pending document submission. After that, if not provided, enrollment is revoked.

  #### Step 2: Clause (b) - Subject to Binding Rules
  - **Question**: Is the applicant subject to binding rules issued by the Commission?
  - **Sufficient answer**: Yes, if the applicant is legally obligated to comply with any rule (e.g., withdrawal permit requirements, siting regulations) that the Commission enforces. This must be a direct obligation, not indirect (e.g., via state laws that incorporate Commission rules).
  - **Evidence**: A copy of the rule and demonstration that the applicant falls under its scope (e.g., the applicant's property is within the regulated area, or the applicant engages in regulated activity). For entities: permits issued by the Commission, notices of violation, or contracts requiring compliance.
  - **Burden of proof**: On the applicant to show they are subject to at least one binding rule. However, the office may use its own records (e.g., permit database). If the applicant is not currently subject but claims they will be, they must provide evidence of imminent regulation (e.g., a pending application that would subject them). Otherwise, not satisfied.
  - **Judgment call**: Deciding if a rule is "binding" on the applicant (e.g., if the rule applies to landowners and the applicant is a tenant). Stop and hand up if: the rule's applicability is disputed or the obligation is indirect (e.g., a state enforces Commission rules but the applicant is subject to state law, not directly to the Commission).
  - **Provisional enrollment**: Not applicable because subjection is a current fact. If the applicant is not currently subject but will be (e.g., a permit application pending), the petition can be held until the permit is issued, but no provisional enrollment.

  #### Step 3: Clause (c) - Materially Affected Significant Interests
  - **Question**: Does the applicant have significant interests that are materially affected by Commission decisions?
  - **Sufficient answer**: Yes, if Commission decisions cause a non-trivial, measurable impact on the applicant's legally recognized interests (e.g., property, health, economic). The effect must be more than speculative or minor. The interest must be "significant" in the sense of being of substantial importance to the applicant (e.g., livelihood, property value, environmental health).
  - **Evidence**: Studies, data, or expert reports showing causation between Commission actions (e.g., water withdrawal, discharge permits) and the effect (e.g., reduced water flow affecting a business, pollution affecting health). For entities: financial records, environmental impact assessments.
  - **Burden of proof**: On the applicant to demonstrate both the significance of the interest and the material effect. The office may request additional evidence if initial submission is weak.
  - **Judgment call**: What is "significant" and "material"? Stop and hand up if: the interest is novel (e.g., cultural or spiritual connection) or the causal chain is long (e.g., climate change impacts). Also, how much affectedness is enough? The office must not decide whether affectedness without subjection deserves a vote; that is a political question settled by the Compact. Our role is to apply the test as written.
  - **Provisional enrollment**: Not applicable because affectedness must be proven.

  #### Step 4: Satisfying Two Clauses
  - **Action**: Check if the applicant satisfies at least two of (a), (b), (c).
    - If yes, the applicant qualifies.
    - If no, the applicant does not qualify.
  - **Rule for Clause (a) exclusion**: If the applicant qualifies without (a), that is acceptable (per "no one may be excluded solely for failing residence").
  - **Burden of proof**: Overall, the applicant must prove they meet at least two clauses by a preponderance of the evidence.
  - **Judgment call**: None at this step.

  #### Step 5: Handling Conflicts with Prior Determinations
  - **Rule**: Each determination must be consistent with prior ones. If a new petition cannot be reconciled (e.g., same facts but different outcome), the officer must:
    - Re-examine the facts and the prior determination.
    - If the inconsistency remains, prepare a memo to the general counsel explaining the conflict and why a departure is necessary.
    - The general counsel must sign any determination that departs from precedent.

  ### Points for Handing Up (Value Judgments)
  1. **Significance of an interest**: When the interest is not traditionally recognized (e.g., aesthetic, cultural) or when the applicant claims an interest that is collective rather than individual.
  2. **Material affectedness**: When the causal chain is indirect or speculative (e.g., climate change, cumulative impacts).
  3. **Ordinary residence in ambiguous cases**: When the pattern of residence is nomadic or split, and intention is unclear.
  4. **Subject to binding rules**: When the obligation is through an intermediary (e.g., state enforcement of Commission rules) and it's unclear if it's direct.
  5. **Entities**: When deciding whether to pierce the corporate veil and consider members/employees.
  6. **Future generations**: The Compact does not address, so if a petition claims to represent the unborn, hand up.

  ### Two-Page Determination Template

  **Kestrel Basin Commission - Eligibility Determination**  
  Date: [Date]  
  Applicant: [Name/Entity]  
  Petition Number: [Number]  

  **Summary of Petition**: [Brief description of the applicant and basis for petition.]

  **Determination**: The applicant [does/does not] qualify for enrollment on the citizens' roll.

  **Findings of Fact**:
  1. **Clause (a) - Ordinary Residence**: 
     - [Findings: Where the applicant lives/operates, evidence examined, and conclusion (yes/no).]
  2. **Clause (b) - Subject to Binding Rules**:
     - [Findings: Rules that apply, evidence of subjection, conclusion (yes/no).]
  3. **Clause (c) - Materially Affected Significant Interests**:
     - [Findings: Nature of interests, evidence of effect by Commission decisions, conclusion (yes/no).]

  **Conclusion**: The applicant satisfies [number] of the three clauses. [If two or more, state qualification. If not, state why.] 

  [If departure from precedent, add: "This determination departs from prior case [citation] because [reason]. General Counsel has approved this departure."]

  **Signed**:  
  [Elections and Registry Officer]  
  [If departure, also: General Counsel]

  ---

  ### Applying the Procedure to the Three Petitions

  #### Petition 1: Seasonal Farmworker Households (approx. 1400 households)
  - **Step 0**: Natural persons (households are groups of natural persons). We consider each household as an applicant (but in practice, we can process as a group if they have common facts).
  - **Step 1: Clause (a) - Ordinary Residence**:
    - They live in employer-provided housing inside the basin for 8 months (April-November) annually. This is a fixed and regular pattern. 
    - Evidence: Employment contracts specifying housing, utility bills for the housing (if available), employer confirmation.
    - Judgment: This is ordinary residence because it is the center of their lives during the season, and they return annually. It is not transient. 
    - **Sufficient**: Yes.
  - **Step 2: Clause (b) - Subject to Binding Rules**:
    - They are fully subject to well-siting and withdrawal rules (e.g., if they use wells on the property). 
    - Evidence: Commission rules apply to anyone withdrawing water within the basin. The housing is inside the basin, so they are subject.
    - **Sufficient**: Yes.
  - **Step 3: Clause (c) - Materially Affected Significant Interests**:
    - Not needed since two clauses are satisfied. (But note: they are also affected by rules, so (c) might also be met, but we don't need to assess.)
  - **Step 4**: Satisfies (a) and (b) -> Qualifies.
  - **Determination**: Enroll.

  #### Petition 2: Hyperscale Data Center (outside boundary, intake inside)
  - **Step 0**: Legal entity (corporation). The entity is the applicant.
  - **Step 1: Clause (a) - Ordinary Residence**:
    - The data center is sited 3km outside the basin. Its principal place of business is outside. 
    - Evidence: Business registration, property deeds.
    - **Sufficient**: No.
  - **Step 2: Clause (b) - Subject to Binding Rules**:
    - It has an intake pipe inside the basin and is subject to withdrawal rules. 
    - Evidence: Permit issued by the Commission for the intake, or the rules explicitly cover such intakes.
    - **Sufficient**: Yes.
  - **Step 3: Clause (c) - Materially Affected Significant Interests**:
    - It draws 11 million litres/day, which materially affects the aquifer. But note: the entity is the applicant. Its significant interest is its business operation, which depends on water. Commission decisions (e.g., on withdrawal limits) could materially affect it.
    - Evidence: Water usage records, impact studies (if any), or the Commission's own data on aquifer levels.
    - **Sufficient**: Yes (material effect on its business).
  - **Step 4**: Satisfies (b) and (c) -> Qualifies (without residence, which is allowed).
  - **Determination**: Enroll.

  #### Petition 3: Downstream Coastal Town (60km outside, shellfish beds damaged)
  - **Step 0**: Municipality (legal entity). The town is the applicant.
  - **Step 1: Clause (a) - Ordinary Residence**:
    - The town is located 60km outside the basin. 
    - **Sufficient**: No.
  - **Step 2: Clause (b) - Subject to Binding Rules**:
    - The town claims it is not subject to binding rules. The Commission's rules bind dischargers within the basin, but the town is outside and not discharging. 
    - Evidence: The town does not hold any Commission permits and is not regulated by the Commission.
    - **Sufficient**: No.
  - **Step 3: Clause (c) - Materially Affected Significant Interests**:
    - The town's shellfish beds are damaged by nutrient loading from permitted discharge in the basin. This is a significant economic and environmental interest. 
    - Evidence: Scientific studies linking the discharge to nutrient loading in the river that flows to the coast, economic reports on shellfish industry losses.
    - **Burden**: The town must prove causation. If they have studies, it may be sufficient.
    - However, the office must assess: is the effect "material"? Yes, if proven. But note: the Compact says "affected by Commission decisions". The Commission issues discharge permits that allow nutrient loading, so there is a causal link.
    - **Sufficient**: Yes, if evidence is provided and causation is established.
  - **Step 4**: Satisfies only (c) -> Does not qualify (only one clause).
  - **Determination**: Do not enroll.

  **Note**: The officer is sympathetic to the town, but the procedure requires two clauses. The town only meets (c). This is the one that will be hard to defend.

  ### What the Procedure Cannot Do
  - **Clause (5)**: The roll's composition cannot be decided by those already enrolled. This forecloses letting the current roll vote on new applicants, which would be an obvious way to avoid boundary regress (who decides the deciders?). Instead, the office must apply the criteria as neutrally as possible.
  - **Political Question**: Even after applying the tests, the roll's composition remains political because:
    - The criteria (especially "significant interests" and "materially affected") involve value judgments that are inherently political.
    - The Compact is a political compromise, so borderline cases will be contested.
  - **Systematic Misfire**: If used for instruments beyond the referendum and citizens' panels (e.g., for a different voting system), the procedure might enroll people who are not suitable because the criteria are tailored to these two instruments. For example:
    - The panels require participants who can deliberate, so entities (like corporations) might not be appropriate, but the procedure enrolls them because they meet the criteria. 
    - The affectedness clause might be too broad for other purposes, leading to an unwieldy roll.

  This procedure is designed for efficiency and consistency, but it requires the office to make tough calls. The template and rules should make it operable by staff with policy but not legal training, with clear hand-up points for legal or political judgments.
answer: |-
  ### Decision Procedure for Article 4 Eligibility  
  **Grounding in Political Theory**:  
  - **Subject to Rules (Clause b)** vs. **Affected by Decisions (Clause c)**:  
    - *Subject to rules*: Direct legal obligation (e.g., compliance, penalties). Rooted in the "all-subjected principle" (democracy requires those bound by laws to have a say).  
    - *Affected by decisions*: Indirect impact (e.g., economic, environmental harm). Based on the "all-affected principle" (those whose interests are shaped by decisions deserve voice).  
    - *Why they come apart*: Geography (e.g., a polluter inside the basin subjects downstream outsiders), scale (e.g., corporate entities operating transboundary), and jurisdiction (e.g., the Commission’s rules bind only within its territory).  
  - **Threshold for "Significant" and "Material"**:  
    - *Significant interests*: Must be concrete (e.g., livelihood, property, health) — not ideological or speculative.  
    - *Materially affected*: Harm/benefit must be measurable (e.g., economic loss, environmental damage) and causally traceable to Commission actions.  
    - *Warranting a vote*: Affectedness alone suffices only if paired with subjection *or* residence (per Article 4’s 2-of-3 test). Mere consultation (e.g., public comments) applies to weakly affected parties; enrollment grants direct influence.  
  - **Boundary Regress (Clause 5)**: Those deciding eligibility are already enrolled, risking insider bias. Clause 5 prevents voting on new applicants, forcing reliance on objective criteria. The procedure mitigates this by emphasizing evidence over discretion.  

  ---

  ### Step-by-Step Decision Procedure  
  **Burden of Proof**: On the applicant. Must provide prima facie evidence for each claimed clause. Office verifies using public records.  
  **Provisional Enrollment**: If evidence is pending (e.g., documents in transit), enroll provisionally for 60 days. If unresolved, revoke enrollment and notify applicant.  
  **Legal Entities**:  
    - Treat the *entity itself* (not members/employees/shareholders) as the applicant.  
    - *Evidence*: Focus on entity’s operations (e.g., facility location, permits, financial impact).  
    - *Threshold*: Reject petitions for subgroups (e.g., "employees" or "shareholders") unless the entity is a shell corporation. If the entity lacks physical presence, reject (no "residence" possible).  

  #### Steps:  
  1. **Classify Applicant Type** (Natural Person/Legal Entity/Group):  
     - *Sufficient Answer*: Declare type (e.g., "XYZ Corporation," "John Doe," "Seasonal Worker Household").  
     - *Evidence*: Articles of incorporation (entities); ID/tax records (persons); employer/household affidavits (groups).  
     - *Hand Up If*: Entity structure is ambiguous (e.g., multi-tiered subsidiaries) — refer to General Counsel.  
     - *🚩 Judgment Call*: Deciding if a "group" petition (e.g., 1,400 workers) can be processed collectively.  

  2. **Assess Clause (a): Ordinary Residence in Basin**:  
     - *Sufficient Answer*: Physical presence + intent to remain for ≥6 months/year, or primary domicile.  
     - *Evidence*: Lease/deed, utility bills, tax filings, employment contracts. For entities: HQ/primary facility address.  
     - *Hand Up If*: Transient populations (e.g., tourists) or disputed intent (e.g., digital nomads).  
     - *🚩 Judgment Call*: Interpreting "intent" for seasonal workers.  

  3. **Assess Clause (b): Subject to Binding Rules**:  
     - *Sufficient Answer*: Directly regulated by Commission-enforced rules (e.g., permits, penalties).  
     - *Evidence*: Commission-issued permits, violation notices, or rules explicitly naming the applicant/activity.  
     - *Hand Up If*: Indirect subjection (e.g., state laws incorporating Commission rules) — requires legal interpretation.  
     - *🚩 Judgment Call*: Whether "subject to" includes delegated enforcement (e.g., state agencies).  

  4. **Assess Clause (c): Materially Affected Significant Interests**:  
     - *Sufficient Answer*: Interests (e.g., economic, environmental) harmed/benefited by Commission decisions, with quantifiable impact (≥5% income/property loss, or health/safety endangerment).  
     - *Evidence*: Scientific studies, financial records, or environmental reports showing causation.  
     - *Hand Up If*: Interests are non-quantifiable (e.g., cultural, spiritual) or causation is remote (e.g., climate change).  
     - *🚩 Judgment Call*: Defining "material" impact (e.g., is 1% loss "significant"?).  

  5. **Apply 2-of-3 Test**:  
     - Qualify if any two clauses are satisfied. Never reject solely for failing (a).  
     - *Burden of Proof*: Applicant must prove two clauses. If evidence conflicts, weigh preponderance.  

  6. **Reconcile with Precedent**:  
     - If facts align with a prior case, follow precedent.  
     - If deviation is needed (e.g., new evidence, changed rules), draft determination and flag for General Counsel signature.  

  ---

  ### Written Determination Template (≤2 Pages)  
  **[KESTREL BASIN COMMISSION LETTERHEAD]**  
  **Eligibility Determination**  
  - **Date**: [Date]  
  - **Applicant**: [Name/Entity]  
  - **Petition No.**: [Number]  
  - **Relevant Precedents**: [e.g., In re: Delta Ag (2023)]  

  **Summary of Facts**:  
  [Concise description of applicant, location, and claims. Example: "A data center outside the basin, withdrawing water via basin intake pipe."]  

  **Analysis**:  
  - **Clause (a)**: [Yes/No]. [Evidence summary: e.g., "Tax domicile outside basin; no primary residence."]  
  - **Clause (b)**: [Yes/No]. [Evidence summary: e.g., "Holds Commission withdrawal permit #X."]  
  - **Clause (c)**: [Yes/No]. [Evidence summary: e.g., "Provides study showing 10% profit loss from permit denials."]  

  **Conclusion**:  
  Applicant [meets/does not meet] 2-of-3 clauses. [If denial: "Denied solely for failing residence? ☐ Yes ☐ No."]  

  **Deviations from Precedent**:  
  [If applicable: "Departs from [Precedent] due to [reason]. General Counsel approval attached."]  

  **Signed**:  
  ― [Elections and Registry Officer]  
  ― [General Counsel, if deviation]  

  ---

  ### Application to Current Petitions  
  #### 1. **Seasonal Farmworker Households**  
  - **Step 1**: Natural persons (group petition accepted due to common facts).  
  - **Step 2 (Clause a)**: **YES**. Ordinarily resident. Evidence: Employer housing contracts proving annual 8-month residency. *🚩 Judgment: Intent inferred from recurring pattern*.  
  - **Step 3 (Clause b)**: **YES**. Subject to well-siting/withdrawal rules. Evidence: Commission logs show enforcement on farm properties.  
  - **Step 4 (Clause c)**: Not assessed (two clauses satisfied).  
  - **Determination**: **ENROLL**.  

  #### 2. **Hyperscale Data Center**  
  - **Step 1**: Legal entity. Petition accepted (entity is applicant).  
  - **Step 2 (Clause a)**: **NO**. Sited outside basin; no employees/residents inside.  
  - **Step 3 (Clause b)**: **YES**. Subject to withdrawal rules. Evidence: Commission permit for intake pipe.  
  - **Step 4 (Clause c)**: **YES**. Materially affected. Evidence: Water volume (11M L/day) affects aquifer levels, impacting operations (studies show 15% cost increase during restrictions).  
  - **Determination**: **ENROLL** (satisfies b + c).  

  #### 3. **Downstream Coastal Town**  
  - **Step 1**: Municipal entity. Petition accepted.  
  - **Step 2 (Clause a)**: **NO**. Outside basin.  
  - **Step 3 (Clause b)**: **NO**. Not subject to rules (Commission permits bind dischargers, not downstream towns).  
  - **Step 4 (Clause c)**: **YES**. Materially affected (nutrient loading harms shellfish beds). Evidence: Peer-reviewed study links discharge to $2M annual losses.  
  - **2-of-3 Test**: Only one clause (c) satisfied.  
  - **Determination**: **DO NOT ENROLL**.  
    - *Sympathy vs. Procedure*: Though affected, the town fails subjection/residence. **This is the defensible denial** — Article 4 prioritizes direct obligation or residence alongside affectedness.  

  ---

  ### What This Procedure Cannot Do  
  1. **Clause (5) Regress Escape**: The procedure cannot let the enrolled vote on applicants (barred by Clause 5). This creates inherent tension: insiders decide boundaries, risking exclusion of outsiders. We mitigate by strict evidence-based tests, but political bias remains a risk.  
  2. **Roll Composition as Political**: After applying tests, value judgments persist (e.g., "significance" of interests). This makes eligibility inherently contestable — final authority rests with General Counsel/appeals, not your office.  
  3. **Systematic Misfire Beyond Instruments**:  
     - If used for non-sortition/ballot tools (e.g., regulatory hearings), it over-includes. Example: A weakly affected entity might qualify for a vote but lack standing in a hearing.  
     - The "materially affected" clause is too broad for technical processes (e.g., permitting), where expertise, not suffrage, matters.  
     - Entities lack deliberative capacity for citizens’ panels — enrollment here may create operational gaps.  

  ---  
  **Final Note**: This procedure is executable by policy staff with minimal legal training. It emphasizes evidence, minimizes discretion, and flags pitfalls. For Tuesday-afternoon use: Stick to the steps, demand documentation, and hand up gray areas.
