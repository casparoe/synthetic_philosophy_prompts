prompt: |-
  I am a third-year doctoral student working on the metaphysics of the special sciences, and the argument below is one I constructed for a dissertation chapter. My adviser says it dies somewhere in the middle but declines to tell me where, so I would like an independent diagnosis.

  First, the intended readings, since several steps depend on them. Let M be a psychological property — being in pain will do throughout. Let R be the causal role that, on role-functionalism, defines M: roughly, being typically caused by damage, causing aversiveness and withdrawal, interacting with belief about its object to produce distress, and so forth. Call any physical property P whose instances occupy R in some system a realizer of M in that system. Assume the standard multiple-realizability thesis: there are actual and possible systems in which M is instantiated whose realizers are physically heterogeneous — human C-fiber firing, the very differently organized nervous system of a cephalopod, a suitable synthetic architecture — where the heterogeneity goes to the internal constitution of the realizing state and is not merely a matter of scale or peripheral variation.

  The argument:

  (1) A putative property is genuine — a real kind, fit to figure in non-accidental generalizations and to serve as a term in causal explanation — only if its instances are united by a common basis: something all and only the instances share, in virtue of which they share the property's characteristic causal profile.

  (2) A mere disjunction P₁ ∨ P₂ ∨ … ∨ Pₙ provides no such basis. Its instances share nothing beyond each falling under some disjunct, and whatever causal profile we attribute to the disjunction belongs, on any occasion, to whichever disjunct is present. (This is what is wrong with grue-ness, and what makes jade a doubtful mineral kind.)

  (3) So if M is multiply realized by heterogeneous P₁…Pₙ, M is identical neither with any Pᵢ nor with their disjunction. Type identity theory fails.

  (4) Role-functionalism's replacement is the second-order property of having some property or other that occupies R.

  (5) In any world w, that second-order property is coextensive with the disjunction of all and only the properties occupying R in w.

  (6) If two properties are coextensive in every world, then — given the extensional individuation of properties that (3) already relied on — they are the same property.

  (7) Hence the second-order property is the disjunction of the realizers, and so, by (2) and (1), is not a genuine property.

  (8) Therefore role-functionalism does not rescue M; it relocates the disjunction one level up. There is no property of being in pain, only a predicate applied to heterogeneous states.

  (9) But (1)–(8) exploit nothing distinctive about the mental. They apply to any property individuated by what it does rather than by what it is made of: money, gene, predator, catalyst, immune response, memory. Each is realized by heterogeneous substrates; each is therefore, by (8), not a genuine property.

  (10) I cannot accept (9)'s conclusion: it entails that the special sciences have no real kinds whatsoever, which is exactly the autonomy Putnam and Fodor invoked multiple realizability to secure.

  (11) So either (1) or (10) must go. If (1) goes, (3) loses its engine — the heterogeneity of the realizers is precisely what (1) was making fatal — and multiple realizability is no argument against type identity at all. If (10) goes, functionalism is eliminated along with biology and economics.

  (12) Either way, multiple realizability does not support functionalism. It is either inert or self-consuming.

  What I would like from you:

  (a) Identify the step you reject and explain why it looked impeccable. I have a private suspicion about (6), but I cannot see how to reject (6) without surrendering the extensional individuation that made (3) available, so I do not yet trust the suspicion; and I suspect I may be misdescribing my own argument.

  (b) If the argument is in fact valid, which of (1) and (10) is cheaper to abandon, and what does each cost? In particular: does abandoning (1) leave me with the type identity theory that (3) refutes, or only with something weaker?

  (c) Take the standard replies in turn — Kim's second-order-property analysis and the exclusion problems it attracts, Yablo's determinable/determinate proposal, Fodor's defense of the special sciences, Shapiro's contention that genuine multiple realization is far rarer than advertised, Block's liberalism/chauvinism dilemma — and say which of my steps each one targets and what it must pay. I am most interested in whether any of them can block (7) without also blocking (3), since a reply that dissolves the threat to functionalism by dissolving the threat to type identity is no help to me.

  (d) Finally, and most importantly: is there a formulation of (1) strong enough to deliver (3) yet weak enough to escape (9)? If there is, state the principle exactly, with the qualification that does the work. If there is not, say so plainly — because that would mean a large literature has been resting on a principle no one can state coherently.
reasoning: |-
  Hmm, this is a sophisticated metaphysical argument from a doctoral student working on the metaphysics of special sciences. The student presents a carefully constructed reductio against role-functionalism, and their advisor says it "dies somewhere in the middle" but won't specify where. Let me analyze this systematically.

  First, the core issue seems to be that the argument leads to an unacceptable conclusion (elimination of special science kinds) while appearing logically tight. The student suspects step (6) might be problematic but worries that rejecting it would undermine step (3). That's a valid concern - the argument relies heavily on extensional property individuation.

  Looking at the structure: Premises (1) and (2) establish a requirement for genuine properties (common basis). Step (3) uses this to reject type identity theory. Steps (4)-(7) then show that functionalism collapses into a disjunction. Step (9) generalizes the problem to all functional properties, leading to contradiction with (10). The dilemma in (11)-(12) suggests multiple realizability can't support functionalism.

  The student's private suspicion about (6) is interesting. Step (6) claims that necessary coextension implies property identity. But is this true for second-order properties? The second-order property is defined by its role R, while the disjunction is defined by the actual realizers. These might have different modal profiles - the disjunction changes across worlds as realizers change, while the functional property doesn't.

  For example, consider pain: The functional property "having some state that plays pain-role R" remains constant across worlds. But the disjunction "P₁ ∨ P₂ ∨ ..." differs in worlds with different realizers. So they're not necessarily coextensive - only contingently coextensive in each world. Thus (6) doesn't apply, and (7) doesn't follow. This preserves functionalism without undermining (3), since (3) only requires extensional individuation for the rejection of type identity.

  This solution looks promising because:
  - It blocks (7) while keeping (3) intact
  - Maintains the genuine status of functional properties
  - Avoids the overgeneralization in (9)
  - Preserves the autonomy of special sciences

  Regarding alternative replies:
  - Kim's second-order analysis: Actually targets (4) by denying that functional properties reduce to disjunctions
  - Yablo's determinables: Offers an alternative to both disjunctions and second-order properties
  - Fodor: Would reject (1) as too strong for special sciences
  - Shapiro: Attacks the multiple realizability premise itself
  - Block: Highlights tensions in functional individuation

  The student's key question about reformulating (1) is insightful. I think (1) can be qualified by requiring a common basis only for fundamental properties, or by allowing role-based unity for functional kinds. For example: "A putative property is genuine if its instances are united either by a common structural basis or by occupying a common causal role." This delivers (3) for physical properties but exempts functional kinds from the disjunction problem.

  The deeper issue is whether special science properties need "unity" in the same way fundamental physical properties do. Their unity might be in their relational profile rather than intrinsic structure. The argument exposes this tension but doesn't necessarily destroy functionalism - it just shows functional properties are different in kind from physical properties.
answer: |-
  Your argument is admirably rigorous, but I agree with your adviser that it fails—specifically at step **(6)**. The flaw is subtle because **(6)** seems compelling under extensionalist assumptions, yet it misapplies those very assumptions to second-order functional properties. I'll address your queries systematically, showing why **(6)** is the culprit, how its rejection preserves the rest of the argument, and why this resolves the dilemma without abandoning **(1)** or **(10)**.

  ---

  ### **(a) The Rejected Step and Why It Looked Impeccable**
  **Step rejected: (6)**  
  *"If two properties are coextensive in every world, then ... they are the same property."*  

  **Why it looked impeccable:**  
  - You rightly note that (3) relies on extensional individuation (properties are identical if coextensive *in the actual world*). Step (6) extends this to *necessary* coextension across *all possible worlds*, which appears consistent with a strong extensionalism (e.g., David Lewis' modal realism). Since role-functionalism defines M rigidly in terms of R, and the disjunction of realizers in any world w is defined by what occupies R in w, (5) and (6) seem to force the identification of the second-order property with the disjunction.  

  **Why it fails:**  
  - **Second-order properties are not extensionally equivalent to disjunctions across worlds.** The second-order property *having some property that occupies R* is **rigidly tied to R** across worlds. In contrast, the disjunction *P₁ ∨ P₂ ∨ … ∨ Pₙ in w* is **world-relative**: it picks out whatever physical properties *happen* to occupy R *in that world*. Crucially, the disjunction in world w1 (e.g., C-fiber firing) may share no physical commonality with the disjunction in w2 (e.g., silicon states), but the second-order property remains identical because it is defined by R alone.  
  - **Modal collapse:** (6) ignores intensional differences. While the second-order property and the disjunction are coextensive *within* each world, they are not coextensive *across* worlds under the same description. The disjunction in w is modally fragile (it changes if realizers change), while the second-order property is modally robust (it persists even if realizers differ). Thus, they are not the same property.  

  **Why you suspected (6) but hesitated:**  
  You worried that rejecting (6) undermines extensional individuation in (3). But (3) only requires *actual-world* coextension for property identity, which (6) inflates to transworld identity. Rejecting (6) leaves (3) intact because:  
  - (3) argues that M ≠ Pᵢ (since M is multiply realizable) and M ≠ disjunction (since disjunctions lack a common basis). This uses **actual coextension**, not transworld.  
  - (6) is a *separate claim* about necessary coextension, which fails for functional properties.  

  ---

  ### **(b) If the Argument Were Valid: Costs of Abandoning (1) or (10)**  
  Since the argument is invalid (due to (6)), abandoning (1) or (10) is unnecessary. But if forced:  
  - **Abandoning (1)** (common-basis requirement):  
    - **Costs:** Surrenders the core metaphysical intuition behind (3). Type identity theory could be revived only if multiple realizability is denied (e.g., Shapiro). You retain a weaker position: properties need no intrinsic unity but can be unified by causal roles. However, this collapses into functionalism—precisely what your argument attacks.  
    - **Result:** (3) fails, and type identity might hold if realizers are homogeneous (contrary to your assumption).  

  - **Abandoning (10)** (rejecting special science kinds):  
    - **Costs:** Eliminativism about special sciences. Functional properties (pain, money, genes) are not genuine, undermining the autonomy Putnam/Fodor sought. This is philosophically catastrophic and empirically untenable (e.g., biology relies on gene talk despite molecular heterogeneity).  

  **Verdict:** Abandoning (10) is costlier. But since (6) is the flaw, neither is needed.  

  ---

  ### **(c) Standard Replies and Their Targets**  
  | **Reply**                          | **Targets Your Step** | **What It Must Pay**                                                                 | **Blocks (7) Without Blocking (3)?** |  
  |-------------------------------------|------------------------|--------------------------------------------------------------------------------------|---------------------------------------|  
  | **Kim** (second-order properties)  | (4), (5), (6)         | Denies (5): second-order properties ≠ disjunctions. But invites exclusion worries (mental causation). | **Yes.** Rejects (5)/(6), preserving (3). |  
  | **Yablo** (determinables)          | (1), (2)              | Claims disjunctions *can* form genuine kinds (e.g., "red" as determinable of scarlets). Rejects (2). | No: weakens (3) by allowing disjunctive kinds. |  
  | **Fodor** (special sciences)       | (1), (9)              | Rejects (1) for special sciences: kinds need only nomological, not metaphysical, unity. | No: abandons (1), undermining (3). |  
  | **Shapiro** (rare multiple realization)| Premise (heterogeneity)| Denies your multiple realizability premise: realizers often share physical constraints. | No: if true, (3) fails outright. |  
  | **Block** (liberalism/chauvinism)  | (4), (5)              | Argues functional roles can be individuated finely (avoiding disjunctions). Risks over-discrimination. | **Yes:** reframes (4), blocking (5)/(6). |  

  **Crucial note:** Kim and Block **can block (7) without blocking (3)**. Kim does this by denying (5): second-order properties are not world-relative disjunctions but abstract roles. Block does it by tightening functional individuation (e.g., pain might require a specific type of causal mediation). Both preserve (3)’s rejection of type identity.  

  ---

  ### **(d) Reformulating (1) to Deliver (3) but Escape (9)**  
  **Yes, (1) can be reformulated.** The key is restricting the "common basis" requirement to **intrinsic** or **non-functional** properties, while allowing **extrinsic/relational unity** for functional kinds:  

  > **Revised (1):** A putative property is genuine if its instances are united by a common basis **or** by occupying a common causal role (where this role is not itself disjunctive). The common basis must be:  
  > - (i) **Intrinsic**: for non-functional properties (e.g., physical kinds), or  
  > - (ii) **Relational**: for functional properties (e.g., special science kinds), where the "basis" is the stable causal profile R.  

  **How this works:**  
  - **Delivers (3):** For mental properties under *type identity*, the realizers (e.g., C-fibers) lack a common intrinsic basis, so M cannot be identical to any Pᵢ or their disjunction.  
  - **Escapes (9):** Functional properties (money, genes) *are* genuine kinds because their unity is relational (occupying R). The disjunction of realizers has no intrinsic unity, but M does not *reduce* to the disjunction—it is defined by R.  
  - **Saves functionalism:** Role-functionalist M is a genuine property not because it avoids disjunctiveness, but because its disjunctiveness is irrelevant; its unity lies in R.  

  **Why the literature survives:**  
  This reformulation captures the core insight of functionalism (e.g., Lewis, Armstrong) while avoiding your reductio. Functional properties are individuated *relationally*, so their realizers' heterogeneity is irrelevant to their genuineness. The "common basis" is R itself—a stable, higher-order pattern.  

  ---

  ### Conclusion
  Your argument fails at **(6)** by overextending extensional individuation to transworld identity, confusing contingent realizers with the necessary role. Rejecting **(6)** preserves **(3)** and resolves the dilemma without sacrificing **(1)** or **(10)**. The revised **(1)** allows functional properties to be genuine kinds via their causal roles, securing the autonomy of the special sciences. This aligns with Kim/Block replies and avoids the pitfalls of Shapiro or Fodor. The literature is safe—but your argument sharpens why functionalism requires role-based, not mereological, unity.
