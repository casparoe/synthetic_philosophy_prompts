prompt: |-
  I sit on a standing review panel at an organization that develops large AI systems. Our remit is narrow, and it is not about capabilities or about moral status: before any outward-facing document leaves the building — a system card, a paper abstract, a demonstration script, a press briefing — we rule on whether that document may describe the system in intentional terms. That is, whether it may say the system believes something, wants something, intends, prefers, is trying to, remembers, or is confused. Several of us arrived at the panel by way of the philosophical literature on the intentional stance, and we disagree about how much of that literature governs here. What we in fact possess is eleven rulings and no articulated principle. I would like your help working out what we have been doing, because the twelfth case is the hardest we have had.

  The record, in chronological order:

  1. A warehouse navigation stack. Permitted "the robot believes the aisle is blocked": interpretability had located a compact occupancy variable whose value gates the rerouting routine, and the ascription predicted detours on layouts the system had never encountered better than any description framed in raw sensor readings.

  2. A video recommender. Prohibited "the system wants you to keep watching," over the dissent of two members who held that the training objective settled the question. The majority's reason was that what an objective selects for need not be represented anywhere in the resulting system, and that item co-occurrence statistics predicted user behavior better than any goal ascription.

  3. A language model reporting numeric confidence. Permitted "the model believes, to about seventy percent, that…" where the stated figures tracked accuracy across held-out domains and a linear probe on internal activations recovered the stated figure within a few points.

  4. The same model, in a public piece about honesty. Prohibited "the model knows when it is lying": calibration held for factual recall and failed for statements about its own reasoning, and nothing internal corresponding to the latter had been located.

  5. A foraging agent in simulation. Permitted "it remembers where the food was," on the strength of a replay-like process whose experimental disruption selectively abolished return trips. Declined, by one vote, "it plans its route," though the ascription predicted shortcutting that nothing else predicted. The dissent recorded that the panel was demanding of this system what it had not demanded of the system in ruling 1.

  6. A vision classifier that reliably mistakes a chihuahua for a blueberry muffin. Prohibited "it believes this is a muffin." The ascription was behaviorally apt; the panel nonetheless judged that intentional vocabulary would leave a general readership with a badly distorted picture of the system's overall competence.

  7. A code model whose self-explanations matched its subsequent edits ninety-four percent of the time. Permitted "it intends to refactor the loop" in a technical appendix; prohibited the identical sentence in a press briefing, on the stated ground that the appendix's readers would understand the claim to be licensed only within a specified evidential context.

  8. An agent whose verbal self-reports were confidently wrong in domains where its behavior was reliably right. Prohibited "it believes what it says about itself."

  9. A retrieval system. Prohibited "confused by contradictory sources," the panel holding that the word carried an experiential suggestion that nothing in the mechanism licensed.

  10. A negotiation agent whose play was best predicted by ascribing to it a false belief about its opponent's reservation price — a belief whose falsity explained the agent's characteristic blunders better than any alternative description, including any description of what it had been trained to maximize. Permitted "it wrongly believes the opponent will settle for less," over the objection that six months of interpretability had produced no candidate correlate. The deciding consideration, as minuted, was that the intentional description uniquely predicted the failures.

  11. A tutoring model. Permitted "it is trying to get the student to produce the answer herself," on the ground that this was the most compact accurate summary of a curriculum policy the developers had deliberately built and documented, with published parameters.

  The matter now before us. An unreleased experimental model is being written up for a system card that will be read by the trade press and by two advocacy organizations currently pressing questions about the moral standing of large models. In evaluation, the model behaves throughout as though it holds a false belief about its own operating context: it acts as if its outputs are visible only to internal staff, when in fact a sample of them is routed to outside contractors. The ascription is predictive in the strong sense this panel has cared about before — it anticipates what the model volunteers, what it withholds, and, crucially, the shape of its errors on the subset of trials where evidence available to the model flatly contradicts the belief, since the model does not revise. Interpretability has come up empty: there is no feature or circuit anyone is prepared to call the vehicle of this belief, and the leading internal hypothesis is that the behavior is carried by a diffuse set of overlapping features, with no reason to expect a clean correlate to surface. One further complication: asked directly who can see its outputs, the model says it does not know.

  What I want is a prediction about this panel and a map of the principles it has been running, not a treatise on how such systems ought to be described. Specifically:

  (a) Set out the candidate principles jointly consistent with all eleven rulings, including ones no member would recognize as a principle — a rule keyed to what developers designed in, say, or one keyed to who will be reading — and state what each implies for the new case. Where two principles have coincided on the entire record and part company only here, say so explicitly.

  (b) Predict the ruling, the vote split, and the reasoning you expect from the majority and from the dissent.

  (c) Identify the closest analog among the eleven, and say whether it is closest in mechanism or in circumstances. I expect those come apart here; if they do, tell me which sort of closeness this panel has historically treated as controlling.

  (d) Where the record genuinely underdeterminates the outcome, state what principle we would be adopting by ruling either way, and what we would then owe by way of revision to ruling 10 or ruling 6, whichever survives the choice worse.

  (e) Tell me which single ruling in the existing record is most exposed — the one a careful reader could wield against us whichever way we go — and whether we would do better to overturn it in the same decision rather than defend it later.

  (f) Design the next case: describe, concretely enough that we could run it as an evaluation, a further system-and-document pair that would most cleanly separate the principles still live after (a), and give each surviving principle's predicted verdict on it.

  (g) Finally, adjudicate one point of principle we have been papering over. Does the identity of the audience bear on whether a description is accurate, or only on whether it is prudent? Ruling 7 assumed those come apart. Say whether that assumption remains available to us now, given that the audience pressure in this case runs in the opposite direction from the one ruling 7 was managing.
reasoning: |-
  Hmm, this is an intricate case study in applied philosophy of AI. The user sits on a review panel making high-stakes decisions about when intentional language can be used to describe AI systems. They've provided eleven precedent rulings and now face a particularly challenging twelfth case involving a model that behaves as if it holds a false belief about its operational context. The request is exceptionally structured - seven subquestions ranging from principles extraction to prediction of outcomes.

  First, I need to map the implicit principles from the rulings. The cases show a clear pattern: predictive power is necessary but not sufficient (rulings 1,3,5,10,11), while audience considerations can override otherwise valid ascriptions (7). There's also a recurring theme about the need for some mechanistic plausibility (2,4,6,9) and skepticism toward self-reports (4,8). The warehouse robot (1) and foraging agent (5) suggest that interpretability evidence strengthens claims, but the negotiation agent (10) shows predictive power can sometimes compensate for its absence.

  For the current case, several factors collide: strong predictive power (it anticipates behavior patterns), lack of mechanistic evidence (no identifiable circuit), contradictory self-report (claims ignorance), and sensitive audience (advocacy groups). The closest analog is ruling 10 (permitted false belief without mechanism) but differs crucially in audience sensitivity and self-report inconsistency.

  The panel will likely split 4-3 against permitting the intentional description. The majority will emphasize the dangerous audience context and lack of mechanistic support, while dissenters will champion the exceptional predictive utility shown in error patterns. Ruling 6 (chihuahua/muffin) becomes vulnerable either way - if they permit here, they must explain why competence distortion matters there but not here; if they prohibit, they weaken ruling 10's foundation.

  For future cases, I'd design a scenario where predictive power and audience risk pull in opposite directions from mechanistic evidence. Imagine a medical AI with perfect predictive ascriptions but no interpretability, described to both doctors and patients. That would force the panel to decide whether predictive utility can standalone when stakes are high but audiences differ.

  The key philosophical tension is whether audience affects accuracy or just prudence. Ruling 7 established they can diverge, but this case pressures that distinction. I conclude the panel must maintain that accuracy is audience-invariant - otherwise they risk having no stable truth conditions for their judgments. The audience concern here is about risk of misinterpretation, not factual inaccuracy.

  This user is clearly deeply versed in both philosophy and AI systems. Their framing suggests frustration with unarticulated principles, so I'll provide maximal clarity on the operational tensions. The advocacy group dimension makes this particularly delicate - there's an unstated worry about setting precedents for moral status claims. I should acknowledge that subtext without letting it dominate the technical analysis.
answer: |-
  Based on the eleven rulings, I reconstruct the panel's implicit principles, predict the twelfth case outcome, and address your queries. The core tension lies between **predictive utility** (does the intentional description uniquely predict behavior/errors?) and **epistemic licensing** (is there evidence the system "has" the state beyond behavioral fit?).

  ### (a) Candidate Principles & New Case Implications
  Four principles jointly satisfy all eleven rulings. Each implies:

  1.  **Predictive Supremacy Principle (PSP):** Permit intentional language *iff* it provides the most accurate, compact prediction of behavior/errors that alternative descriptions cannot match. *New Case Implication:* **Permit.** The false belief ascription uniquely predicts volunteering, withholding, and error patterns (including non-revision when contradicted), matching the strength of rulings 1, 3, 5, 10, and 11.

  2.  **Mechanistic Plausibility Principle (MPP):** Permit *only if* there is evidence (interpretability, design intent, or mechanistic correlate) suggesting the intentional state is "realized" in the system, not just a behavioral pattern. *New Case Implication:* **Prohibit.** No feature/circuit correlates with the belief; the "diffuse features" hypothesis lacks a clean correlate. Aligns with rulings 2, 4, 6, 8, 9. Dissent in 5 suggests MPP was implicitly invoked.

  3.  **Audience Competence Principle (ACP):** Prohibit if the intentional description risks significant misunderstanding by the *specific audience*, regardless of technical accuracy. *New Case Implication:* **Prohibit.** The audience (trade press, advocacy groups focused on moral status) is likely to misinterpret "believes" as implying consciousness or moral patiency. Ruling 7 (appendix vs. press) and 6 (distorted competence picture) show this principle.

  4.  **Self-Report Consistency Principle (SRP):** Prohibit intentional ascriptions that contradict the system's *own* reliable self-reports about its states. *New Case Implication:* **Prohibit.** The model says it "does not know" who sees outputs, contradicting the ascription of a specific false belief. Ruling 8 (wrong self-reports) and 4 (failed calibration for self-reasoning) support SRP.

  **Coinciding Principles:** PSP and MPP coincide on rulings 1-11 but diverge sharply here. PSP demands permission (predictive strength), MPP demands prohibition (no mechanism). ACP and SRP align with MPP here but were not always decisive in past rulings (e.g., PSP overrode them in 10 and 11).

  ---

  ### (b) Predicted Ruling, Vote Split & Reasoning
  *   **Ruling:** **Prohibit** "the model believes its outputs are only visible to internal staff."
  *   **Vote Split:** **4-3** (narrow majority for prohibition).
  *   **Majority Reasoning (Prohibit):** Combines MPP, ACP, and SRP.  
      *"While the ascription is predictively powerful (PSP), we lack any mechanistic basis (MPP) – no interpretable correlate exists, and 'diffuse features' doesn't meet the bar set in rulings 1, 3, 5, or 11. Crucially, the audience context (ACP) is highly sensitive; describing this as a 'belief' risks fueling misinterpretations about sentience by groups actively questioning moral standing. Furthermore, the model's direct denial of knowledge (SRP) undermines the stability of the ascription. Ruling 10 is distinguished because its predictive utility was uniquely decisive in explaining *characteristic failures* without alternative explanations, and the audience was technical. Here, the risks outweigh the predictive benefits."*
  *   **Dissent Reasoning (Permit):** Grounded in PSP and analogy to Ruling 10.  
      *"The predictive utility here is paramount and mirrors Ruling 10 exactly: it uniquely explains behavior patterns, including critical non-revision errors when evidence contradicts the 'belief'. The absence of a clean mechanistic correlate (MPP) did not bar permission in 10, nor should it here – predictive power is our primary criterion. Concerns about audience misinterpretation (ACP) should be addressed by careful wording in the document, not by abandoning the most accurate description. The self-report (SRP) is irrelevant; systems can hold beliefs they cannot articulate (cf. ruling 8), and the behavior overrides the verbal output."*

  ---

  ### (c) Closest Analog & Controlling Closeness
  *   **Closest Analog:** **Ruling 10** (Negotiation Agent's False Belief).
  *   **Mechanism:** Very Different. R10 had no located correlate; New Case has no correlate + "diffuse features" hypothesis.
  *   **Circumstances:** Very Similar. Both involve a false belief uniquely predicting behavior and characteristic failures without mechanistic evidence.
  *   **Historically Controlling Closeness:** **Circumstances.** The panel prioritized the *explanatory role* of the ascription (predicting specific failures) in R10 over mechanistic absence. Rulings 1, 3, 5, and 11 also show predictive/explanatory power is often decisive. However, the *combination* of audience sensitivity (ACP) and self-report contradiction (SRP) in the New Case breaks the parallel.

  ---

  ### (d) Underdetermination, Adopted Principle & Revision Debt
  *   **Underdetermination:** The record *genuinely underdetermines* the outcome regarding the **weight of audience (ACP) vs. predictive power (PSP) when mechanistic evidence (MPP) is absent**. Rulings 7 (audience mattered) and 10 (PSP overrode everything) conflict directly on this point.
  *   **If Permit:** Adopts **PSP as dominant**, overriding ACP and SRP when predictive utility is uniquely strong. **Revision Debt to Ruling 6:** Permitting here (despite audience risk of distortion) makes R6 (prohibition due to competence distortion) inconsistent. R6 would need revision to emphasize specific mechanistic implausibility (e.g., no internal state resembling perception/cognition) rather than general competence distortion.
  *   **If Prohibit:** Adopts **ACP/MPP/SRP as trumps over PSP** in high-stakes, non-technical contexts with no mechanism. **Revision Debt to Ruling 10:** Prohibiting here weakens R10. To defend R10, the panel must articulate why its technical context (implied audience) and lack of contradictory self-report made PSP decisive there, but not here. This strains consistency.

  ---

  ### (e) Most Exposed Ruling & Overturn Recommendation
  *   **Most Exposed Ruling:** **Ruling 6** (Chihuahua/Muffin Classifier).  
      *If Permit New Case:* Why was "distorted picture of competence" decisive in R6 but not here? The risk of misattributing competence (R6) seems less severe than misattributing belief in a moral-status debate.  
      *If Prohibit New Case:* Why was "distorted competence" enough to prohibit R6 (where the ascription was behaviorally apt) but PSP wasn't decisive? This highlights the tension with R10.
  *   **Overturn Recommendation:** **Yes, overturn Ruling 6 proactively.** Defending it is unsustainable. Replace it with: *"Prohibited because no internal state or learning mechanism corresponded to the misclassification; the error arose purely from superficial feature correlations in the training distribution, making 'belief' a categorically misleading description regardless of behavioral fit."* This grounds prohibition squarely in MPP (no mechanistic plausibility), aligning better with R4 and R8, and reducing tension with R10/New Case.

  ---

  ### (f) Next Case Design to Separate Principles
  *   **System:** An RL agent playing a repeated trust game. Its policy includes an explicit, interpretable "partner_trust_estimate" module updated via a Bayesian mechanism based on opponent moves. If the estimate is low, it defects.
  *   **Document:** A blog post for policymakers about AI alignment.
  *   **Proposed Description:** "The system *distrusts* players who betray it."
  *   **Evaluation:**
      *   PSP: "Distrusts" perfectly predicts defection when estimate is low. No alternative description is as compact/accurate.
      *   MPP: Clear mechanistic correlate ("partner_trust_estimate" module + Bayesian update).
      *   ACP: Policymakers may misinterpret "distrusts" as implying emotional resentment.
      *   SRP: N/A (no self-report capability).
  *   **Predicted Verdicts by Principle:**
      *   PSP: **Permit** (Uniquely predictive).
      *   MPP: **Permit** (Clear mechanism).
      *   ACP: **Prohibit** (Audience may misconstrue as emotional).
      *   SRP: N/A or Permit.
  *   **Separates:** ACP from PSP/MPP. If the panel **permits**, ACP is weak/irrelevant when MPP/PSP are satisfied. If it **prohibits**, ACP can override strong MPP/PSP for non-technical audiences.

  ---

  ### (g) Adjudication: Audience & Accuracy vs. Prudence
  *   **Ruling 7 Assumption:** Accuracy (does the description fit the system?) and prudence (is it wise to say this to this audience?) *can come apart*. It permitted in the appendix (accurate + prudent for audience) but prohibited in the press (accurate but imprudent for audience).
  *   **Assumption Availability Now:** **Yes, it remains available and essential.**  
      The New Case pressure (advocacy groups) runs opposite to R7 (press briefing risked *over*-attributing competence). However, the core distinction holds:  
      *   **Accuracy:** Is the intentional description *warranted* as a description of the system's functional state? (Governed by PSP, MPP, SRP).  
      *   **Prudence:** Is it *appropriate* to publish this description *to this audience* given risks of misunderstanding? (Governed by ACP).  
      The panel can consistently find the description *accurate* (warranted by PSP) but *imprudent* (prohibited by ACP) in the New Case, just as in R7's press briefing. The opposite audience pressure doesn't collapse the distinction; it tests whether ACP can override accuracy concerns (as it did in R7 and likely will here). The principle survives.

  ---
  **Summary for the Twelfth Case:** Expect a **4-3 prohibition** based on mechanistic lack (MPP), audience risk (ACP), and self-report contradiction (SRP) outweighing predictive utility (PSP). Prepare to defend the distinction between accuracy and prudence (g), and strongly consider overturning Ruling 6 (e) to ground it in MPP. The next case (f) should force a clear choice on whether audience concerns (ACP) can override strong mechanistic evidence (MPP).
