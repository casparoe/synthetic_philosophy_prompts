answer: |-
  Below is a systematic audit of the map analogy in relation to your three categories of model idealization, its implications for Friedman's thesis, and alternative frameworks. I address your questions sequentially with explicit correspondences, disanalogies, and confidence assessments.

  ---

  ### **1. Correspondence Table: Maps vs. Scientific Models**
  | **Map Feature**                 | **Scientific Model Equivalent**          | **Your Categories** | **Analogy Fit** |
  |----------------------------------|------------------------------------------|---------------------|-----------------|
  | Omission of irrelevant details (e.g., trees on a highway map) | Neglecting bounded small terms (e.g., Coriolis acceleration) | (i) | ✓ **Strong** |
  | Simplification of complex terrain (e.g., smoothing coastlines) | Limit idealizations (e.g., infinite Reynolds number) | (ii) | △ **Partial** |
  | Symbolic conventions (e.g., "You Are Here" marker) | Closure relations (e.g., eddy viscosity) | (iii) | ✗ **Weak** |
  | Scale (e.g., 1:10,000 topo map) | Domain of applicability (e.g., specific flow regimes) | All | ✓ **Strong** |
  | Purpose-driven distortion (e.g., Mercator projection) | Purpose-driven idealization (e.g., assuming laminar flow) | All | △ **Partial** |
  | Cartographer's prior knowledge | Scientist's empirical/data constraints | — | ✗ **Key disanalogy** |

  ---

  ### **2. Disanalogies & Their Relevance**
  #### **Critical Disanalogies (Bearing on Your Correspondent's Argument):**
  - **Prior Access to Territory**:  
    Mapmakers *know* the territory before abstracting it; modelers *infer* reality through idealized constructs. Closure relations (iii) are conjectural, not simplifications of known entities.  
    → **Relevance**: Undermines the claim that "unrealistic assumptions are irrelevant." Closure terms are *ontologically distinct* from mapped terrain.  

  - **Localized Distortions**:  
    Map distortions (e.g., projections) follow *systematic rules*; closure terms (iii) lack physical counterparts and are recalibrated per context.  
    → **Relevance**: Weakens the analogy for (ii) and (iii). Singular limits (ii) and ad hoc closures (iii) violate the map's rule-based abstraction.  

  - **Epistemic Goals**:  
    Maps guide navigation *within* known reality; models predict *unknown* behavior. Success in (iii) doesn’t imply ontological fidelity.  
    → **Relevance**: Challenges "epistemic irrelevance" of assumptions. Closure terms may succeed predictively while being *false explanations*.  

  #### **Peripheral Disanalogies (Less Critical):**
  - Materiality (paper vs. equations).  
  - Static vs. dynamic representations.  

  ---

  ### **3. Impact on Friedman's Thesis**
  - **Case (iii) Strengthens Friedman (Counterintuitively)**:  
    If closure relations (invented entities) yield accurate predictions despite no physical referent, this aligns with Friedman’s **instrumentalism**: assumptions need not be "realistic," only predictively useful.  
    → *However*, this exposes a flaw: Predictive success ≠ epistemic justification. Closure terms may be *overfitting* (e.g., tuned constants masking structural errors).  

  - **Where Friedman Falters**:  
    - **Singular Limits (ii)**: When \(\lim_{\text{Re}\to\infty} \neq\) real high-Re flows, predictive failure reveals the idealization’s *structural inaccuracy*.  
    - **Neglected Terms (i)**: Realism of assumptions *is* relevant here, as dropping terms relies on empirical bounds.  

  **Conclusion**: Friedman’s thesis *survives minimally* for (iii) but *fails robustly* for (ii). The analogy’s collapse in (ii)/(iii) shows that "getting you where you want to go" is insufficient: it ignores whether the route is generalizable or ontologically grounded.  

  ---

  ### **4. Prosthesis Analogy: An Improvement?**
  **Framework**:  
  > *A model is a prosthetic device: it replaces an unknown/missing natural process (e.g., turbulence) with an artificial mechanism (e.g., closure scheme) judged solely by functional performance (prediction), not resemblance.*  

  **Pros**:  
  - Directly addresses (iii): Prostheses are *tools*, not descriptions (e.g., a prosthetic leg accomplishes walking without mimicking biology).  
  - Explains recalibration: Prostheses are customized per user (flow regime).  

  **Cons**:  
  - Fails for (i)/(ii): Neglecting small terms or taking limits isn’t "replacement" but simplification.  
  - Risks promoting *instrumentalism*: Like Friedman, it divorces function from truth.  

  **Verdict**: Better for (iii), worse elsewhere. **Hybrid view**: Models are *both* maps (for known terrain) and prostheses (for terra incognita).  

  ---

  ### **5. A Superior Alternative: Models as Scaffolding**
  **Framework**:  
  > *Models are epistemic scaffolds: temporary structures built to access regions of reality, later discarded or refined as knowledge grows.*  

  **Advantages**:  
  - Explains all three categories:  
    - (i) Scaffolds omit redundant beams.  
    - (ii) Singular limits are unstable scaffolding (e.g., a ladder that buckles if leaned too steeply).  
    - (iii) Closure terms are provisional supports (e.g., guy wires).  
  - **Rejects Friedman**: Scaffolds *must* engage with reality to function; idealized assumptions are *tactical*, not irrelevant.  
  - Aligns with scientific practice: Parameterizations evolve (e.g., from eddy viscosity to LES).  

  ---

  ### **6. Confidence Assessment**
  | **Claim**                                                                 | **Confidence** | **Weakest Point**                                  | **How to Settle**                                                                 |
  |---------------------------------------------------------------------------|----------------|---------------------------------------------------|-----------------------------------------------------------------------------------|
  | Map analogy fails for closure relations (iii) and singular limits (ii).   | 95%            | Whether (iii) truly has "no referent."            | Analyze if ML-based closures reveal latent physical structures.                  |
  | Prosthesis analogy improves on map for (iii) but is incomplete.           | 85%            | Overlaps with instrumentalism.                    | Case studies of discarded closure models (e.g., Prandtl’s mixing length).        |
  | Scaffolding best captures model evolution and practice.                   | 80%            | Needs integration with "robustness" literature.   | Examine if scaffolded models converge across scales (e.g., in renormalization).  |

  **Weakest Claim**: The scaffolding analogy’s capacity to unify all three idealization types.  
  - **Settling Evidence**: Track a model’s lifecycle (e.g., Reynolds-averaged Navier-Stokes) from heuristic closure (iii) to bounded neglect (i) via singular perturbation theory (ii). Convergence would validate scaffolding; divergence would favor contextual analogies.

  ---

  ### **Summary for Your Correspondent**
  - The map analogy holds only for **bounded omissions (i)**, not limit idealizations (ii) or closure relations (iii).  
  - **Disanalogies matter**: Prior mapmaker knowledge and rule-based distortions expose Friedman’s oversight of *how* idealizations function.  
  - **Case (iii) cuts both ways**: Predictive success without referents *appears* to support Friedman but reveals science’s progress through successive approximation (e.g., eddy viscosity → k-ε models).  
  - **Recommend scaffolding**: It explains why scientists *rightly* demand plausible assumptions—not for "aesthetics," but because scaffolds must bear the weight of new empirical layers.  

  Your intuition that models are *functional tools* is sound, but avoid divorcing function from ontology. As a turbulençtist, you know closure terms are *placeholders for ignorance*—and science aims to replace them, not revel in their predictive power alone.
