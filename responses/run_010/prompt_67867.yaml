answer: |-
  ## Proposal: Budget-Constrained Obfuscation as a Fundamental Limit for AI Debate

  **Project Title:** Quantifying the Cliff: Resource-Obfuscation Failure Modes in AI Debate

  **Core Research Question:** Under what conditions does the computational budget required for a judge to robustly verify *all constituent claims* in a debate argument exceed a practical threshold, leading to a qualitative degradation ("cliff-edge failure") in debate performance, even when individual claims are easily verifiable in isolation?

  ### The Gap: Beyond Existing Accounts of Debate's Limits
  Existing analyses of debate failure modes focus on distinct phenomena, leaving a critical gap:

  1.  **Honest Model Dominance:** Frameworks like Irving et al. (2018) ask if an honest strategy *exists* that can win against any opponent. This assumes the judge can *always* correctly evaluate the *presented* arguments given sufficient time. Our concern arises precisely when the judge *cannot* evaluate all relevant claims within budget, regardless of honesty.
  2.  **Judge Capability:** Work on judge weakness (e.g., weak supervision) often assumes the judge lacks the *fundamental ability* to understand concepts or detect specific deceptions. Our focus is on tasks where the judge possesses the *capability* to understand and verify *any single atomic claim* but is overwhelmed by the sheer *quantity* required for holistic verification.
  3.  **Faithfulness of Reasoning:** Research into whether a model's stated reasoning reflects its internal process (e.g., "faithfulness") addresses a different axis of deception. We assume models might strategically *omit* necessary verification steps or flood with *true-but-irrelevant* atoms, exploiting the judge's finite budget, regardless of the internal faithfulness of any *single* step they *do* present.
  4.  **Single Obfuscated Claims:** The canonical "obfuscated argument" is one where a *single complex step* is designed to be undecidable by the judge. We focus on arguments constructed from many *individually trivial* but *collectively overwhelming* claims.

  **The Precise Gap:** Current theory largely treats verification cost as negligible *per claim* or focuses on the cost/complexity of *individual steps*. **We posit that the critical failure mode occurs when the *aggregate verification cost* of the *minimal set of atomic claims needed to establish soundness* exceeds the judge's budget, even if each atom costs epsilon.** This transforms the problem into a resource allocation challenge for the judge, fundamentally changing the failure dynamics from smooth degradation to potential cliffs. This specific budget-driven, atom-count-dependent failure mode remains underexplored theoretically and lacks predictive metrics.

  ### Core Insight: Obfuscation as a Budget-Relative Relation
  Our central hypothesis reframes obfuscation: **"Argument A is obfuscated relative to Judge J and Budget B"** if J, with budget B, cannot reliably determine the soundness of A *because the computational cost required to verify the necessary atomic constituents of A exceeds B*.

  The critical consequence: **An argument composed entirely of individually trivial-to-verify claims (e.g., basic arithmetic, simple factual lookups) can be effectively obfuscated if it contains sufficiently many claims that *must* be verified to establish soundness.** A deceptive model doesn't need clever lies; it needs *volume*. It can win by forcing the judge to exhaust their budget verifying true-but-irrelevant minutiae (flooding) or by omitting critical intermediate claims that the honest proponent must then supply at high cost (starvation). The failure depends on the **"Claim Density"** of the task domain – the number of independently verifiable atomic claims inherently required per unit of argumentative progress towards the true answer.

  ### Methodology: Formalization, Modeling, Case Studies (Not Just Win Rates)
  Why not just run debates? Empirical win rates (e.g., Leike et al.) are crucial but expensive, task-specific, and don't isolate the *mechanism* or provide *predictive* metrics. Our approach focuses on building the theoretical lens to *interpret* those results and predict *new* failure modes:

  1.  **Formal Framework (Weeks 1-4):**
      *   Define a minimal formal debate model incorporating explicit computational budgets for Judge (J) and potentially debaters (optional).
      *   Define "Atomic Claims": Verifiable units with an associated cost `c_i` for J (initially assume `c_i` constant & small).
      *   Define "Argument Structure": How atomic claims combine logically to support the final answer. Introduce concepts like "necessary verification set" for an argument.
      *   Formalize "Budget-Obfuscation": Argument A is (J, B)-obfuscated if the minimal cost verification set for A under optimal play exceeds B.
      *   Define "Claim Density" (CD): A property of a *task domain* and argument structure. CD = Expected number of atomic claims in the necessary verification set for a typical valid argument of complexity `N` (e.g., answer precision, problem size). *Example:* Summarizing a document might have high CD (many facts); solving a single complex equation might have low CD (few key steps).

  2.  **Analytical Modeling (Weeks 5-8):**
      *   **Failure Mode Analysis:** Model debate dynamics under budget constraints. Analyze scenarios: Flooding (overwhelm with atoms), Starvation (force honest side to supply costly atoms), Mixed strategies.
      *   **Degradation vs. Cliff Prediction:** Derive conditions under which debate performance degrades smoothly as CD increases or budget decreases vs. conditions where it collapses abruptly (cliff-edge). Key parameters: CD, Budget (B), cost per atom (c), strategic flexibility of debaters.
      *   **Robustness Exploration:** Introduce heterogeneity in `c_i` (some claims harder), judge strategies (sampling claims), debater cost models. Does the core CD-driven failure persist?

  3.  **Illustrative Case Studies (Weeks 7-10):**
      *   Design simple, tractable synthetic tasks with *tunable Claim Density*.
          *   *Low CD:* Verifying a single complex logical deduction (few key premises).
          *   *Medium CD:* Fact-checking a short summary against a known source (moderate facts).
          *   *High CD:* Verifying every step in a long chain of trivial inferences or every fact in a dense summary.
      *   *Simulate* debate outcomes (e.g., via simplified game trees or probabilistic models) using the formal framework, predicting cliffs based on CD and B. Goal is proof-of-concept for the theoretical predictions, *not* full-scale LLM debates.

  4.  **Synthesis & Deliverable Definition (Weeks 11-12):**
      *   Synthesize findings into a **Diagnostic Framework for Debate Viability**.
      *   **Core Deliverable:** A formalized concept of **"Critical Claim Density" (CCD)** for a task domain relative to a judge budget. CCD is the density threshold beyond which we predict cliff-edge failure becomes likely under adversarial conditions. This provides a *predictive metric*: "For task X with estimated CD Y and judge budget Z, CCD is W. Since Y > W, debate is predicted to be vulnerable to resource-obfuscation attacks."
      *   Report outlining the framework, core theoretical results, case study insights, the CCD concept, and clear guidelines for applying it to real-world tasks.

  ### Why 12 Weeks? Feasibility and Scope
  This is ambitious but feasible for a focused summer project because:
  1.  **Phased Approach:** The first phase (formalization) is well-scoped conceptual work. The modeling phase builds directly on this foundation.
  2.  **Focus on Mechanism, Not Scale:** We avoid computationally intensive LLM experiments. Case studies are small-scale simulations validating the *mechanism*, not measuring absolute performance.
  3.  **Clear Milestones:** Weekly goals within each phase ensure progress is trackable.
  4.  **Defined Deliverable:** The CCD framework is a concrete, actionable output achievable within 12 weeks. Further empirical validation (beyond scope) would be the next step.

  **Realistic Shrinking:** If progress on modeling is slow, prioritize defining the formal framework and CCD concept, and conduct fewer/simpler case studies. The core deliverable remains achievable.

  ### Confronting the Failure Mode: Does This Buy Anything?
  **The Core Risk:** Does this framework collapse into the trivial observation that "the judge needs a big enough budget"? **No, and here's why:**

  1.  **Predicts *Qualitative* Failure Modes:** It doesn't just say "more budget helps." It predicts *when* adding a little more budget does nothing (cliff-edge) vs. when it yields smooth improvement. This is crucial for allocating resources and choosing techniques.
  2.  **Identifies Domain-Specific Vulnerability:** It provides a specific metric (CD) to *compare tasks*. Debate might be robust for theorem proving (low CD) but brittle for comprehensive fact verification (high CD), *even with the same judge capability*. This guides task selection for debate.
  3.  **Reveals Strategic Attack Vectors:** It formalizes *how* an adversary exploits budget constraints (flooding, starvation), informing defense design (e.g., judge sampling strategies, penalizing claim volume).
  4.  **Moves Beyond Capability:** Judge capability (understanding a *single* complex step) is distinct from budget (verifying *many* simple steps). A highly capable judge can still be budget-overwhelmed. This framework isolates the *resource* bottleneck.
  5.  **Quantifies the Threshold (CCD):** The key advance is predicting the *threshold* (CCD) where failure becomes catastrophic, not just stating that budgets matter.

  **What Would Count as Failure?**
  1.  **Collapse into Triviality:** If the CCD for all non-trivial tasks is so low that any realistic budget implies vulnerability (`CCD < 1`), or if CD cannot be meaningfully defined/measured for relevant tasks. (Mitigation: Focus on tasks where atomic claims *can* be defined - e.g., factual grounding, step-by-step reasoning).
  2.  **No Cliff Prediction:** If analysis shows performance *always* degrades smoothly with increasing CD or decreasing budget, eliminating the predicted qualitative distinction. (Mitigation: Our hypothesis strongly suggests cliffs exist; modeling should reveal the conditions).
  3.  **No Actionable Metric:** If the derived CCD is impossible to estimate for real tasks without running full-scale debates, negating its predictive value. (Mitigation: Develop heuristics for estimating CD for common task types).
  4.  **Superseded by Other Limits:** If budget-obfuscation is consistently dominated by other failure modes (e.g., single-step deception, judge capability limits) in real-world scenarios. (Mitigation: Case studies will test relative impact).

  ### Why This Matters: The Payoff for AI Safety
  Understanding and predicting the *resource-obfuscation cliff* is critical for safely deploying debate:

  1.  **Task Selection:** Provides a criterion (CD vs. CCD) to avoid using debate on tasks inherently vulnerable to this attack, preventing unexpected failures.
  2.  **Judge Design:** Guides investment in judge efficiency (lowering `c_i`), optimal claim sampling strategies, or budget allocation algorithms.
  3.  **Technique Combination:** Flags when debate alone is insufficient for high-CD tasks, necessitating hybrids with verification tools, formal methods, or trusted components.
  4.  **Risk Assessment:** Offers a concrete metric (CCD) to evaluate the robustness of proposed debate systems before deployment, moving beyond intuition.
  5.  **Theoretical Foundation:** Fills a specific, identified gap in the understanding of debate's failure modes, advancing the field's conceptual toolkit.

  This project moves beyond vague notions of "judge strength" or "obfuscation" to provide a rigorous, resource-oriented framework for predicting a specific, dangerous failure mode in AI debate systems. The deliverable, the Critical Claim Density (CCD) metric, offers a practical tool for AI safety practitioners to assess debate viability and design more robust oversight mechanisms.
