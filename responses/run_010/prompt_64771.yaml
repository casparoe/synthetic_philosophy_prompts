  **Restated criterion:** A damages contract is a "safe Pareto improvement" if:  
  - (i) It induces an equilibrium where both parties do at least as well as the baseline (G,G), with one strictly better.  
  - (ii) In every possible outcome (all four cells), no party receives less than their baseline payoff, regardless of their own or the other's action.  

  **Distinct questions contested:**  
  1. **Definitional:** What constitutes "safety"? Anil defends clause (ii) as essential for unforeseen defection; Beatriz argues it overreaches by including protection against one's own defection.  
  2. **Arithmetic:** What values of \(D\) satisfy both clauses? Disagreement centers on interval endpoints and counterexample feasibility.  
  3. **Institutional:** How reliable must enforcement be? Beatriz highlights probability \(q\) of damages collection; Anil proposes funded monitoring.  
  4. **Normative:** Does the mechanism solve trust? Beatriz claims it presupposes enforceable commitments; Anil argues damages are institutionally distinct from compelled performance.  

  Moves engage:  
  - Moves 1–2: Arithmetic + definitional (feasibility of \(D\), interpretation of safety).  
  - Moves 3–4: Institutional + definitional (enforcement reliability, critique of clause (ii)).  
  - Moves 5–7: Normative + institutional (monitoring costs, trust relocation, redundancy of mechanism).  

