  Here is the story and critical apparatus drafted to your specifications:

  **THE TRANSIT OF THE *EASTERN DAWN***

  Captain Moreau, the harbor pilot, felt the *Eastern Dawn*’s engines vibrate through the soles of her boots – a deep, reassuring thrum. Outside the bridge windows, the muddy expanse of the Karun River slid past, swollen and turbid after last night’s squall. The bulk carrier, laden deep with Australian coal, rode low, her squat pronounced in the narrow channel. Ahead, the leading marks – the red water tank on the bluff aligned precisely with the white church spire – glowed sharp and true in the hazy morning light. The chart, spread and weighted on the table behind her, showed the deep-water channel curving gently starboard just past Marker Buoy 7. But the river *felt* different this morning. The surface slicked over with a peculiar, oily sheen near the starboard bow, a texture Moreau associated with shallows shifting, sandbanks whispering secrets to the surface.

  "Helm, port ten," she ordered, her voice calm. The helmsman repeated the order, spinning the wheel. The massive ship answered slowly, ponderously. Moreau watched the water. The sheen persisted, stubbornly near the starboard bow where the chart promised deep water. She glanced at the leading marks – still dead true. Impossible. She’d taken ships up this channel for twenty-three years. She *knew* the Karun like the lines on her own palms. The feel of the helm under her, the specific refraction of light off the mudbanks, the taste of the air near the old refinery – they were her true charts. Yet... that sheen. And the chart, meticulously updated, showed no reported shift. "Belay that. Midships. Steady as she goes." The helmsman complied.

  She stepped to the radar, its screen a green mosaic of land and river. Buoy 7 blinked reassuringly on its designated position. The depth sounder ticked off fathoms: seventeen, seventeen, sixteen-point-five. Still safe, but the echo felt… weaker than usual? Or was it the silt stirred by the storm? She walked back to the window, ignoring the chart table. Her apprentice, young Chen, stood silently near the starboard wing door, observing, his knuckles white where he gripped the railing. He saw the sheen too. He also saw the Captain’s posture – rigid concentration, a slight tightening around her eyes.

  "Check the flood stream gauge, Chen," Moreau said, not taking her eyes off the water. "And confirm the tide table prediction for the next hour." Her voice was clipped, professional. Chen scurried to obey. The discrepancy gnawed at her. The marks said *straight*. The chart said *straight*. The buoy said *here*. But the river’s skin said *shoal*. And the *Dawn* drew sixteen meters fully laden. Squat in the shallow channel could steal another meter. Sixteen-point-five was tight. *Too* tight. Her procedure was clear: **Check again. Allow for squat and for the flood still making. Carry on.**

  Chen reported: "Flood stream gauge reading two-point-eight knots, Captain. Tide table prediction holds, flood making for another forty minutes." Exactly as expected. Still, that sheen. She raised her binoculars, scanning the near bank. The familiar pattern of debris snagged on mangrove roots – a blue drum, a tangle of fishing nets – was slightly offset downstream. Had the storm surge shifted everything? Or was it perspective?

  "Helm, port five," she ordered again, a subtle adjustment. The ship nudged left. The sheen seemed to lessen fractionally. The leading marks remained true. Depth sounder: sixteen-point-eight. Relief, cold and sudden, washed over her. **Check again. Allow for squat and for the flood still making. Carry on.** She hadn’t been wrong to trust the river’s feel. Just cautious. The chart was a record; the river was alive. "Steady as she goes," she confirmed.

  They passed Buoy 7. The channel curved. The leading marks shifted – now the radio mast aligned with the grain silo. Moreau’s eyes darted between the marks, the water, the depth sounder. Sixteen-point-five. Again. And there, just off the port bow now, a patch of that same slick, unnatural sheen. Impossible. The chart showed deep water here. The new marks were dead true. The buoy was astern, correct. But the sheen… it was back. Had she misjudged the first instance? Was it flotsam? Oil? Her certainty wavered for a fraction of a second. Depth sounder: sixteen-point-four. Her hand twitched towards the engine telegraph.

  Chen watched her hesitate, the micro-expression of doubt vanishing as quickly as it appeared, replaced by familiar resolve. He saw her glance dismissively at the chart table, her focus returning solely to the river and her instruments. He knew the procedure. He’d seen it twice already since entering the river’s mouth. He didn’t have the words, or the rank, to voice the pattern.

  **Check again. Allow for squat and for the flood still making. Carry on.** Moreau straightened. "Helm, starboard five. Gently." The ship eased right. The sheen slid towards the center of the bow, then dissipated. Depth sounder: seventeen-point-two. She exhaled. The river tested, the river confirmed. Her method held. The *Eastern Dawn* pressed forward, deeper into the narrowing channel, the city’s skyline hazy in the distance. Chen watched the next set of leading marks slide into alignment, knowing what the Captain would see, or refuse to see, when the water’s skin next betrayed the chart’s certainties. The flood still made. The squat remained. The procedure endured.

  ---

  **APPARATUS (302 words)**

  The fixed point resides at the level of the pilot’s *discrepancy-resolution protocol* itself: "Check again. Allow for squat and for the flood still making. Carry on." This sequence, triggered by sensory discord (water surface vs. chart/expectation), is never revised. While *how* she checks varies (visually, via instruments, through crew orders), the core decision-structure – investigate discrepancy, apply known corrections (squat, tide), then proceed – remains immutable. The story implies that *some* unrevisable procedural bedrock is necessary for action; without it, perpetual reassessment paralyzes. Here, the protocol *is* her expertise made operational.

  The pilot is *superficially* analogous to the wasp but crucially different in kind regarding the trigger. The wasp’s cycle is re-initiated *exogenously* (Fabre moving the prey), interrupting an otherwise completed sequence (haul, inspect, drag in). The pilot’s cycle is re-triggered *endogenously*: her own "Check again" step, intended to resolve the discrepancy, *is* the act that reliably encounters a new (or re-perceived) anomaly, restarting the protocol. The lever is not attached externally but built into the very checking mechanism meant to ensure competence. This transforms it from a simple behavioral loop into a cognitive trap inherent to her expert system.

  The piece suggests that freedom, contra simplistic "flexibility equals free will," requires not just the *ability* to revise procedures ("meta-flexibility"), but the *recognition of the need* to do so *in the moment*. The pilot possesses the skill to navigate complex changes (she adjusts course, reads subtle signs), yet remains blind to the rigidity of her overarching decision rule. The story points towards *awareness of one's own heuristic boundaries* as a necessary ingredient for escaping such traps, but it does *not* supply it; the pilot remains unaware, and the external intervention (Chen's observation, the river ending) lacks any diagnostic insight. Freedom requires seeing the frame, not just changing the picture within it.

  **Cheating Admission:** The depth sounder readings (16.5, 16.4) likely signal doom too transparently for some readers, bending the "no foreshadowed catastrophe" constraint through implication, even if locally justified. The prose leans on the technical dread of those numbers.
