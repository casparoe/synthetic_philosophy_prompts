answer: |-
  ### Pramāṇa Decision Tree  
  Input: A student says "I know that P" and describes how they came to know it. Answer the questions based *only* on the student's description.  

  1. **Did you directly sense or experience P right now with your eyes, ears, nose, tongue, skin, or mind (e.g., feeling, thought)?**  
     - Yes → **Perception (pratyakṣa)**  
       *Schools*: All accept as independent (Nyāya, Vaiśeṣika, Buddhists, Sāṃkhya, Jains, Mīmāṃsā, Advaita).  
       *Cost*: You must trust senses/mind to give truth, even if they sometimes deceive.  
     - No → Go to 2.  

  2. **Is P about something *not* existing or being absent (e.g., "no coffee in the pot")?**  
     - Yes → Go to 3.  
     - No → Go to 4.  

  3. **Did you learn the absence by *not* sensing it when it should be detectable (e.g., you looked for coffee in the pot and saw nothing)?**  
     - Yes → **Non-apprehension (anupalabdhi)**  
       *Schools*: Mīmāṃsā (Bhāṭṭa) and Advaita accept as independent. Nyāya reduces to perception; Buddhists reduce to inference.  
       *Cost*: You must accept that "not seeing" something can be a source of truth under clear conditions.  
     - No → Go to 4.  

  4. **Did you learn P from someone telling you, or from reading it?**  
     - Yes → Go to 5.  
     - No → Go to 7.  

  5. **Can you name or point to a specific person who communicated this (e.g., teacher, parent, author)?**  
     - Yes → **Testimony (śabda) - Personal**  
       *Schools*: Nyāya, Mīmāṃsā, Sāṃkhya, Jains, Advaita accept as independent. Buddhists reduce to inference; materialists reduce to perception.  
       *Cost*: You must trust that reliable people can give knowledge, even if you can't verify it yourself.  
     - No → Go to 6.  

  6. **Do you believe the source is divine, eternal, or authorless (e.g., Vedas, Bible, Quran)?**  
     - Yes → **Testimony (śabda) - Authorless**  
       *Schools*: Mīmāṃsā, Advaita accept as independent/infallible. Nyāya accepts only if verified; Buddhists reject.  
       *Cost*: You must accept sacred texts as self-validating, beyond human authority.  
     - No → **Testimony (śabda) - Impersonal**  
       *Schools*: Treated as testimony by Nyāya, Mīmāṃsā, but some schools debate if impersonal sources (e.g., textbooks, signs) need extra verification.  
       *Cost*: You must trust institutions or systems to convey truth, without knowing the author.  

  7. **Did you learn P by thinking step-by-step from other facts?**  
     - Yes → Go to 8.  
     - No → Go to 9.  

  8. **Was your reasoning based on a general rule (e.g., "smoke always means fire")?**  
     - Yes → **Inference (anumāna)**  
       *Schools*: All accept as independent. Materialists reduce to perception.  
       *Cost*: You must accept that logic can reveal hidden truths, even without direct sensing.  
     - No → Go to 10.  

  9. **Did you learn P by matching it to a similarity (e.g., "X looks like Y, so it must be Y")?**  
     - Yes → **Comparison (upamāna)**  
       *Schools*: Nyāya, Mīmāṃsā accept as independent. Buddhists reduce to perception + testimony; Jains reduce to perception.  
       *Cost*: You must accept that analogy can create new knowledge, not just memory.  
     - No → Go to 11.  

  10. **Did you learn P because it's the *only* way to explain a weird fact (e.g., "he must eat at night because he gains weight but never eats by day")?**  
      - Yes → **Postulation (arthāpatti)**  
        *Schools*: Mīmāṃsā, Advaita accept as independent. Nyāya reduces to inference; Buddhists reject.  
        *Cost*: You must accept that "forcing" an explanation from contradictions can yield truth.  
      - No → Go to 11.  

  11. **Did you learn P in a way not covered above?**  
      - Yes → **Not from a pramāṇa**  
        *What it is*: Memory, recognition, doubt, error, or imagination (e.g., "I remember P," "I guessed P").  
        *Schools*: No school treats these as independent knowledge sources—all reduce or reject them.  
      - No → Review answers; you may have an invalid claim (e.g., circular reasoning).  

  ---

  ### Routed Cases  
  1. **"There's no coffee in the pot" by looking at an empty pot.**  
     - Q1: Yes (saw with eyes) → **Perception**  
     *Path*: 1 (Yes) → Perception.  

  2. **Cousin gains weight but never eats by day → "He must eat at night."**  
     - Q1: No (not sensed).  
     - Q2: No (not about absence).  
     - Q4: No (not told/read).  
     - Q7: Yes (reasoning).  
     - Q8: No (no general rule; kid insists).  
     - Q10: Yes (only explanation for weight gain) → **Postulation**  
     *Path*: 1 (No) → 2 (No) → 4 (No) → 7 (Yes) → 8 (No) → 10 (Yes) → Postulation.  

  3. **Recognized a quince at the market after grandmother's description ("like a lumpy pear that smells like perfume").**  
     - Q1: No (didn't directly sense "quince-ness"; matched description to object).  
     - Q2: No (not about absence).  
     - Q4: No (not being told at the market).  
     - Q7: No (not step-by-step reasoning).  
     - Q9: Yes (matched similarity to grandmother's analogy) → **Comparison**  
     *Path*: 1 (No) → 2 (No) → 4 (No) → 7 (No) → 9 (Yes) → Comparison.  

  4. **Maya saw her cousin and "just knew" it was her after nine years.**  
     - Q1: Yes (directly saw with eyes) → **Perception**  
     *Path*: 1 (Yes) → Perception.  

  5. **Teacher says exam is Tuesday vs. textbook says earth is 4.5 billion years old.**  
     - *Teacher case*:  
       - Q1: No (not sensed).  
       - Q2: No (not absence).  
       - Q4: Yes (told).  
       - Q5: Yes (specific person: teacher) → **Testimony - Personal**  
       *Path*: 1 (No) → 2 (No) → 4 (Yes) → 5 (Yes) → Testimony-Personal.  
     - *Textbook case*:  
       - Q1: No (not sensed).  
       - Q2: No (not absence).  
       - Q4: Yes (read).  
       - Q5: No (no specific person; textbook author isn't "pointed to").  
       - Q6: No (not divine) → **Testimony - Impersonal**  
       *Path*: 1 (No) → 2 (No) → 4 (Yes) → 5 (No) → 6 (No) → Testimony-Impersonal.  

  ---

  ### Flags  
  - **Perception and Non-apprehension**: The tree *can* separate these (Q1 for perception, Q2→Q3 for non-apprehension). But if a student describes "not sensing" ambiguously (e.g., "I knew no elephant was in the room because I didn't see it"), it could be misclassified. *To separate*: Ask, "Did you *actively check* for the thing under good conditions?" If yes, non-apprehension; if no, it may be memory or doubt.  
  - **Testimony-Personal and Testimony-Impersonal**: The tree separates these (Q5). But if a student cites a "specific person" vaguely (e.g., "scientists say"), it could overlap. *To separate*: Ask, "Do you know this person *directly* (e.g., face/name)?" If yes, personal; if no, impersonal.  

  ### Empty Corners (Unoccupied Combinations)  
  1. **Accepts testimony but rejects perception**:  
     - *Diagnosis*: Incoherent (you need perception to receive testimony).  
  2. **Reduces comparison to testimony but accepts authorless testimony as independent**:  
     - *Diagnosis*: Unattractive (comparison relies on similarity, not authority; no school combines these).  
  3. **Accepts non-apprehension but rejects absence as a valid category**:  
     - *Diagnosis*: Incoherent (non-apprehension *requires* absence).  

  ---

  `Verdict: Perception`
