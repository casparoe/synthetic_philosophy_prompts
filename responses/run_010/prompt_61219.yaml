prompt: |-
  I'm drafting a paper for a workshop on institutional responsibility, and the question I actually have to answer is when a loose, unorganized group — members who share no communication channel and may not know of one another individually — can be treated as a single agent that acted. Before I go any further into the literature on joint action, I want the specification: what must any account of acting together deliver to be usable for that purpose? Give me the requirements — the phenomena it has to explain, the cases it has to classify correctly, the distinctions it may not collapse (acting together versus acting in parallel toward the same end; participating versus merely enabling; the group's intention versus each member's intention about the group), and the developmental and comparative findings it must not contradict — with the motivating case or consideration behind each. Then mark which requirements are non-negotiable and which are really the doctrinal commitments of particular camps: I especially want to know whether mutual belief and meshing subplans are debts every adequate theory owes or the signature theses of shared-intention accounts, and whether a joint commitment that gives co-participants standing to rebuke is a genuine requirement or a claim internal to one view. The case driving this: a dispatch app notifies eleven independent couriers that an oxygen cylinder has to be carried four flights up to a clinic whose lift has failed; each accepts separately, with no way to message the others; they arrive over the course of twenty minutes, each taking a grip wherever there is room and falling into step with whoever is nearest; three leave early, and the cylinder is dropped when the rest can no longer hold it. Did the eleven act together, and is an early departure a breach owed to the others or simply a change of mind? Say whether your list forces a verdict here and which requirement does the work. Finally, flag any pair of requirements you think cannot be jointly satisfied, and name the single requirement that eliminates the most candidates among shared-intention accounts, joint-commitment accounts, accounts that treat we-intentions as primitive individual attitudes, and the deflationary view that there is no distinct phenomenon to explain. Skip the scorecard; that is the next section.
reasoning: |-
  Hmm, the user is working on a paper about institutional responsibility and needs to clarify when a loose, unorganized group can be treated as a single agent. They're specifically asking for the requirements that any account of "acting together" must satisfy to be useful for this purpose. They want phenomena to explain, cases to classify correctly, distinctions to maintain, and constraints from developmental/comparative findings. They also want to know which requirements are essential versus tied to specific theoretical camps, and how these apply to their courier case study.

  I need to unpack their core concerns. The courier scenario describes eleven independent workers responding to an app notification about carrying an oxygen cylinder up stairs. They coordinate spontaneously without communication, but some leave early causing failure. The key questions are: did they act together as a group, and were early departures breaches of obligation or just personal choices? The user wants to know if my requirements force a verdict here.

  For the requirements, I should structure them clearly. Essential elements include collective goal pursuit, minimal coordination, mutual responsiveness, and shared goal awareness - without which we couldn't even describe basic joint action. The distinctions they mention (acting together vs parallel action, participating vs enabling, group vs individual intentions) seem non-negotiable because collapsing these would make the concept useless for responsibility attribution. 

  Theoretical sticking points need special attention. Mutual belief and meshing subplans are signature requirements of shared-intention accounts (Bratman-style), not universal debts. Joint commitments with standing to rebuke are core to Gilbert-style accounts. The user specifically asked about these, so I'll flag them as camp-specific. 

  Developmental constraints are tricky - evidence shows children coordinate before understanding complex mental states, which challenges intellectualized accounts. Comparative findings about non-human animals suggest minimal joint action may exist without robust theory of mind, constraining over-intellectualization.

  Applying this to the courier case: the requirements collectively suggest this wasn't full joint action because no shared intention or commitment existed, but it had elements of emergent coordination. The key distinctions (especially acting together vs parallel action) and the participation/enabling divide drive this verdict. Early departures likely weren't breaches since no mutual obligations were formed.

  I should note tensions: the mutual responsiveness requirement (essential) seems hard to square with developmental evidence showing coordination precedes mutual awareness. Also, non-negotiable distinctions might conflict with deflationary approaches that deny any special phenomenon exists.

  The user's framing suggests they're deep in the literature but want to step back before committing to a framework. Their focus on responsibility contexts means requirements related to obligation-generation will be crucial. The courier case seems designed to test boundaries of minimal joint agency - perfect for stress-testing these requirements.
answer: |-
  Here's a breakdown of requirements for an account of "acting together" to be usable for attributing agency/responsibility to loose, unorganized groups, structured as you requested:

  **Core Requirements (Non-Negotiable Phenomena & Distinctions):**

  1.  **Collective Goal Pursuit:**
      *   **Must Explain:** How individuals can be oriented towards a *shared goal* (e.g., getting the cylinder upstairs), distinct from merely having identical individual goals (e.g., each wanting the cylinder upstairs for their own reasons).
      *   **Motivating Case:** The couriers aren't just each trying to move the cylinder independently; they are *contributing to moving it together*. Without a shared goal, it's just parallel action.
      *   **Non-Negotiable:** Yes. Collapsing this distinction renders "acting together" meaningless. Essential for distinguishing *coordinated contribution* from *simultaneous individual action*.

  2.  **Minimal Coordination & Mutual Responsiveness:**
      *   **Must Explain:** How individuals adjust their actions *in light of* the actions (or anticipated actions) of others, even without explicit communication or planning.
      *   **Motivating Case:** Couriers "fall into step," adjust grips based on where space is available, implicitly timing efforts based on others nearby. Their actions are interdependent and responsive.
      *   **Non-Negotiable:** Yes. Without responsiveness, it's merely parallel action converging on a point, not joint action. Essential for distinguishing *coordinated effort* from *coincidental convergence*.

  3.  **Awareness of Others' Contribution (Minimal Mutual Awareness):**
      *   **Must Explain:** How individuals perceive (or can reasonably assume) that others are also contributing to the shared goal. This need not be belief about *specific* individuals or their *intentions*, but awareness that the task requires/attracts multiple contributors.
      *   **Motivating Case:** Each courier sees others arriving and gripping the cylinder, understands the task requires multiple people, and infers others are there for the same purpose. They don't need to know names or chat.
      *   **Non-Negotiable:** Yes. Without awareness that others are involved *in the task*, coordination and shared goal pursuit become impossible. Collapses distinction with acting *alone* in a crowd.

  4.  **Distinction: Acting Together vs. Acting in Parallel Towards the Same End:**
      *   **Must Explain:** Why the couriers are *jointly moving* the cylinder (acting together) rather than eleven individuals each *independently trying to move it* (acting in parallel).
      *   **Motivating Case:** This distinction is crucial for responsibility. If parallel, failure is just cumulative individual failure; if joint, the group *as such* failed, and individual actions (like leaving) have a different normative character relative to the group effort.
      *   **Non-Negotiable:** Yes. This *is* the core distinction the account must deliver for your purpose. Failure here makes group agency attribution incoherent.

  5.  **Distinction: Participating vs. Merely Enabling:**
      *   **Must Explain:** Why someone actively gripping the cylinder and heaving *is participating* in the joint action, while someone who merely held the door open downstairs (even helpfully) is *merely enabling* it, not part of the acting group.
      *   **Motivating Case:** For responsibility attribution, we need to identify the *primary agents* whose coordinated actions *constitute* the group action. Did the early leaver *participate* (and potentially breach) or just stop *enabling*? Requires a criterion for core contribution.
      *   **Non-Negotiable:** Yes. Essential for delimiting the boundaries of the group whose agency is in question and assigning responsibility appropriately.

  **Contested Requirements & Theoretical Signatures:**

  6.  **Shared Intention vs. Individual Intentions about the Group:**
      *   **Must Explain:** Whether the "we intend to lift the cylinder" is irreducible (a group-level attitude) or reducible to a complex of individual intentions (e.g., "I intend to lift it *as part of our lifting it*" + beliefs about others).
      *   **Motivating Case:** Did each courier just intend *their own lifting contribution* (individual intention), or did they somehow grasp *the group's action* as the object of their intention? Impacts the "glue" holding the action together normatively.
      *   **Non-Negotiable?** **NO.** This is a central *theoretical battleground*. Shared-intention accounts (Bratman, Searle) insist on irreducible "we-intentions" or joint commitments constituting the shared intention. Deflationary/individualistic accounts (Tuomela, Miller) reduce it to interconnected individual attitudes. The account must *address* the distinction, but its stance *defines* its camp.

  7.  **Mutual Belief / Common Knowledge:**
      *   **Signature Thesis:** Primarily of **Shared-Intention Accounts** (especially Bratman). Requires that participants mutually believe (and believe that others believe, etc.) key facts: that they share the goal, are coordinating, and have relevant intentions/beliefs.
      *   **Is it a Debt?** **NO.** While some level of mutual *awareness* is non-negotiable (#3), *iterated mutual belief/knowledge* is a demanding requirement specific to sophisticated shared-intention accounts. Developmental evidence (see below) challenges its necessity for minimal joint action.

  8.  **Meshing Subplans:**
      *   **Signature Thesis:** Core requirement of **Michael Bratman's Shared-Intention Account**. Requires that participants' individual plans for contributing to the joint activity are compatible and interlock ("mesh") to achieve the shared goal.
      *   **Is it a Debt?** **NO.** This is a specific, cognitively demanding feature of Bratman's influential theory. Other accounts (e.g., Gilbert's commitment, basic we-intention) don't require detailed subplan meshing, focusing on commitment or intention instead. Essential for Bratman, not universally required.

  9.  **Joint Commitment & Standing to Rebuke:**
      *   **Signature Thesis:** Core requirement of **Margaret Gilbert's Joint Commitment Account**. A joint commitment creates mutual obligations and gives participants the *standing to rebuke* each other for failures to play their part.
      *   **Is it a Genuine Requirement?** **NO, but...** This is the defining feature of Gilbert's view. While the *phenomenon* of normative expectations/demands often arising in joint action needs explaining (#10), the specific mechanism of a normative *joint commitment* generating *mutual rebuke rights* is internal to her theory. Other accounts explain normative force differently (e.g., reliance, conventions, promises) or might see it as emergent, not foundational.

  10. **Normative Dimension / Obligations:**
      *   **Must Explain (Phenomenon):** Why participants often feel (and others judge) that abandoning the joint action without reason, or failing to do one's part, is a *wrong* to the other participants, not just a personal choice.
      *   **Motivating Case:** Is the early leaver in the courier scenario blameworthy *to the others* for leaving? Or did they just change their mind? The account must explain if/how such obligations arise in loose groups.
      *   **Non-Negotiable?** **ARGUABLY YES (to explain the phenomenon), but the mechanism is contested.** Any account usable for *responsibility* must address the potential for obligations *within* the group. How it explains them defines the camp (e.g., commitment, reliance, convention, constitutive rules).

  **Developmental & Comparative Constraints:**

  11. **Developmental Plausibility:**
      *   **Must Not Contradict:** Evidence that very young children (18-24 months) engage in simple joint actions (e.g., collaborative games, carrying objects together) before they possess a robust theory of mind capable of complex mutual belief or sophisticated shared intentions.
      *   **Motivating Case:** Accounts requiring high cognitive load (complex mutual belief, detailed meshing subplans) struggle with this. The courier scenario involves adults, but the *minimal core* of joint action should be achievable with simpler cognitive resources.
      *   **Non-Negotiable Constraint:** Yes. An account defining joint action in ways demonstrably impossible for young children who clearly engage in it is empirically inadequate.

  12. **Comparative Plausibility:**
      *   **Must Not Contradict:** Evidence of cooperative/joint action in non-human animals (e.g., chimpanzees hunting, wolves flanking prey) which lack human-like capacities for shared intention or normative commitment.
      *   **Motivating Case:** Suggests minimal forms of coordination towards a shared goal might exist without complex mental state attributions or normative structures. Pushes towards less cognitively and normatively demanding accounts for the minimal case.
      *   **Non-Negotiable Constraint:** Yes. An account that makes minimal joint action uniquely human requires strong justification against this evidence.

  **Application to the Courier Case & Verdict:**

  *   **Does the list force a verdict?** **Yes, leaning towards *not* full joint agency, but exhibiting core coordination.**
  *   **Which requirements do the work?**
      *   **Collective Goal Pursuit (#1):** PRESENT. All are acting to move the cylinder *upstairs together*.
      *   **Minimal Coordination & Mutual Responsiveness (#2):** PRESENT. Falling into step, adjusting grips shows responsiveness.
      *   **Awareness of Others' Contribution (#3):** PRESENT. They see others gripping and understand the task needs multiple people.
      *   **Distinction: Acting Together vs. Parallel (#4):** This is the crux. Requirements #1, #2, and #3 suggest it goes beyond parallel action. It's *emergent coordination* towards a shared goal.
      *   **Distinction: Participating vs. Enabling (#5):** Those gripping/heaving are PARTICIPATING. Someone holding the door would be ENABLING.
      *   **Shared Intention? (#6):** **UNLIKELY.** No communication, no formation of a "we". Likely individual intentions ("I'll help lift this now with whoever is here").
      *   **Mutual Belief? (#7):** **UNLIKELY.** No basis for iterated beliefs.
      *   **Meshing Subplans? (#8):** **ABSENT.** No plans formed, just reactive coordination.
      *   **Joint Commitment & Rebuke (#9):** **ABSENT.** No commitment formed. Acceptance via app is individual, not mutual.
      *   **Normative Dimension? (#10):** **WEAK/EMERGENT?** Norms of *reliance* might emerge *during* the coordinated lift (if someone suddenly lets go *mid-lift* it feels wrong), but no pre-existing obligation *to the group* was created by the app acceptance or arrival. Leaving early might frustrate expectations but isn't clearly a *breach of obligation owed to specific others*.
  *   **Verdict:** The eleven engaged in **emergent, minimally coordinated joint action** *during the periods they were actively gripping and moving the cylinder together in a responsive way*. However, it lacked the **normative structure** (shared intention, commitment) typically grounding strong mutual obligations and rebuke rights. The early departures are likely **changes of mind** that frustrated the *de facto* coordination and reliance, but not **breaches of obligation owed to the other specific couriers** as co-participants in a committed joint endeavor. The group acted weakly as an agent *during the coordination*, but the normative ties needed for responsibility for abandonment are absent. Requirement #9 (specifically its absence) and the contested nature of #10 are key here. Requirement #4 (distinguishing joint vs parallel) pulls towards seeing *some* joint action, but #9/#10 pull against seeing strong mutual obligations.

  **Tensions Between Requirements:**

  1.  **Minimal Mutual Awareness (#3) & Developmental Plausibility (#11) vs. Mutual Belief (#7):** Requiring robust mutual belief (#7) conflicts with evidence that minimal joint action occurs in toddlers who likely lack this capacity (#11). Awareness (#3) is necessary, but mutual belief may be too strong for the minimal case. Accounts emphasizing #7 struggle with #11.
  2.  **Normative Dimension (#10) & Deflationary Views:** The deflationary view (no distinct phenomenon) struggles to explain the *distinctive normative expectations and potential obligations* (#10) that arise in coordinated joint action compared to purely parallel action or individual action, even in loose groups where formal commitment is absent. The *phenomenon* of felt obligations needs explanation.
  3.  **Shared Intention (#6) vs. Individualistic Reduction:** This is the core tension. Can the interconnectedness of individual intentions/beliefs/responsiveness fully explain the sense of "we" and potential normative force, or is something irreducible needed? This defines the major camps.

  **The Requirement that Eliminates the Most Candidates:**

  *   **Developmental Plausibility (#11)** is arguably the most potent eliminator across camps.
      *   **Shared-Intention Accounts (Bratman-style):** Often struggle due to demands of mutual belief (#7) and meshing subplans (#8).
      *   **Joint-Commitment Accounts (Gilbert):** Struggle with the cognitive demands of forming a normative joint commitment.
      *   **Primitive We-Intention Accounts (Searle):** Face challenges explaining how irreducible "we-intentions" arise in cognitively immature agents.
      *   **Deflationary Views:** Avoid this problem by reducing joint action to individual actions + mutual responsiveness, which aligns better with developmental evidence. However, they then face challenges explaining the normative dimension (#10) distinctively.
      *   **Minimalist/Individualist Accounts (e.g., some Tuomela, Pacherie, Tollefsen):** Focusing on #1, #2, #3, and perhaps weak forms of #10 (like reliance) without demanding mutual belief or commitment, fare best against #11.

  This list provides the necessary framework for evaluating theories of joint action for your specific institutional responsibility context, highlighting the core phenomena, crucial distinctions, empirical constraints, and key theoretical fault lines.
