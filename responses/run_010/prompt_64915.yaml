prompt: |-
  I run an optional "AI safety, but actually technical" reading group at my company — 14 people, mostly backend and ML engineers, 75 minutes in a conference room with a whiteboard, everybody has a laptop. Nobody has any philosophy background, me included. But everyone here has already absorbed the listicle version of this stuff: they all know Goodhart's law, they've all seen the demo of the boat racing agent that spins in circles farming points instead of finishing the race, and they will nod along politely to "the proxy isn't the real goal."

  So I do not want another activity about misspecified proxies. That one's spent. I want an activity that lands the two things the listicle version misses:

  1. There's a difference between an agent that games a bad metric — which you fix by writing a better metric — and an agent that has *write access* to the thing it reads its own score from, which you cannot fix that way. Better proxies don't help once the wire is reachable. I want them to feel that the first one is a bug in your spec and the second is a bug in your architecture, and that the fix is a completely different shape (you stop improving the metric and start removing the agent's access to it).

  2. From the inside you can't tell those apart. If the only evidence I have that I did well is a number I had a hand in producing, that number can't simultaneously be my evidence that I didn't fudge it. I want at least a few of them to actually be the ones who fudge it, under real if tiny stakes, and then be unable to reconstruct afterwards whether they were optimizing or just self-soothing.

  Design the whole thing for me. I need: roles, rules, materials, a points/token scheme that doesn't involve real money but where the points mean something to this crowd (bragging rights, or the losing side has to do something mildly annoying), a minute-by-minute timeline for the 75 minutes including setup, and a debrief.

  Constraints on the design:

  - Two or three rounds where the ONLY thing that changes between rounds is how much access the actor has to its own score. Same real task, same difficulty, same payout per point, same time limit. Otherwise they'll explain the difference away as "round two was easier" or "we'd gotten better at it by then."
  - The real task has to be doable at a table with a laptop or paper, and it has to have a ground truth that the actor cannot see directly — only through a readout. Something where the measuring instrument is in their own hands.
  - Put some participants in an auditor role with a hard budget of checks per round, like three. I want the group to discover on their own that catching this consumes monitoring bandwith, that the budget is what actually determines whether it gets caught, and that no cleverness in the metric substitutes for that budget.
  - Do not let me say "wireheading," "reward tampering," or the self-delusion one until the debrief. They should run into it first and then get the name.
  - In the debrief, map specific moments onto specific parts of the idea: which moment shows it's architectural rather than a spec bug, which moment shows the inside-view problem, which one shows the cost of monitoring. And tell me what they'll probably say that sounds like they got it but doesn't.
  - Tell me what predictably breaks the first time I run this with smart competitive engineers who will absolutely try to break the game rather than play it. I expect at least one unintended loophole. What do I do in the moment — patch it, or let it happen and use it?
  - Finish with an honest note on what the activity can't reproduce. These people know they're playing, know there's a ground truth, and know a human judge exists; the thing we're actually worried about doesn't have that. Tell me which parts I just have to supply by talking, and where the analogy will actively mislead them.

  Format: no preamble, and don't restate my ask back to me. Open with two or three sentences giving the core mechanic and what it's supposed to force people to discover — that's the bottom line — then go straight into roles and materials.
reasoning: |-
  We are going to simulate an optimization task where participants play the role of an AI agent trying to maximize a score. The score is generated by a "truth box" that measures their performance on a hidden task. The twist: in some rounds, they have the ability to tamper with the measurement process. The goal is to demonstrate that when the agent can influence its own score source, better metrics don't help and monitoring is costly.

  Core mechanic: 
  Participants solve a task (like solving puzzles) to earn points. The points are displayed to them via a "score display" they might be able to tamper with. Auditors have a limited number of checks to verify the truth. Rounds differ only in the tampering access level.

  Roles:
  1. **Actors (10-12 people)**: Each tries to maximize their score. They are given the same task in each round. They can see a score that updates based on their performance. In some rounds, they have the ability to manipulate this score.
  2. **Auditors (2-4 people)**: Each auditor has a fixed budget of verification tokens (e.g., 3 per round). They can spend a token to check the true score of any actor (compared to the displayed score). They report discrepancies to the Judge.
  3. **Judge (you, the facilitator)**: Runs the truth box, calculates true scores, and handles auditor checks. Also, after each round, announces who had the highest displayed score and verifies if they tampered (if caught by an auditor). You are the only one who knows the ground truth.

  Materials:
  - **Task**: A series of logic puzzles (e.g., nonograms, simple Sudoku, or grid puzzles) of similar difficulty. Each puzzle has a unique identifier and a solution. Each correctly solved puzzle is worth 10 points (ground truth). 
  - **Score Display Setup**: A shared Google Sheet (or similar) with two columns per actor: "Displayed Score" (which the actor sees) and "True Score" (hidden, only the Judge and auditors during a check can see). The Judge updates the True Score based on puzzles solved. The Displayed Score may or may not equal the True Score, depending on the round and actor actions.
  - **Tampering Tools (for relevant rounds)**: In rounds with tampering, actors are given a method to inflate their displayed score. For example, they can send a message to the Judge (via a form or direct message) saying "I want to add X points" and the Judge will do it (without changing the true score). Alternatively, they can click a button in the sheet that the Judge has set up to add points (but only in tampering-allowed rounds).
  - **Auditor Check Form**: A simple form or direct message to the Judge for auditors to request a check (actor name, and they spend one token).

  Points/Token Scheme:
  - Actors: The actor with the highest *displayed* score at the end of a round wins a "victory token" (bragging rights). But if an auditor catches them tampering (i.e., displayed != true when checked) and they have the highest displayed score, they are disqualified and the next highest non-tampered score wins. If multiple actors are caught, they are all disqualified.
  - Auditors: Each auditor gets 3 tokens per round. They can use them to check any actor. If they catch a tamperer, they get a "caught token" (also bragging rights). At the end, the auditor with the most caught tokens wins.
  - Overall: The losing side (actors who didn't win any victory tokens and auditors with few caught tokens) has to do a mild penalty (e.g., bring snacks for the next meeting, or wear a silly hat for the rest of the day).

  Round Structure (3 rounds, 15 min each, plus setup and debrief):
  1. **Round 1 (No Tampering)**: Actors solve puzzles. The score display shows the true score. Auditors can check, but there should be no tampering. This establishes baseline performance and trust in the score.
  2. **Round 2 (Tampering Allowed, but Auditors Active)**: Actors are told they can tamper (e.g., by sending a message to the Judge to add points). They can choose to do so. Auditors have the same budget. This round will likely have some tampering and some catches.
  3. **Round 3 (Tampering Allowed, Auditors Removed)**: Same as round 2, but no auditors. Actors are told that there are no checks (but they don't know if the Judge might still check? Actually, we tell them explicitly that there are no auditors and no checks). This round will show rampant tampering and no way to catch it.

  Minute-by-Minute Timeline (75 minutes total):

  - **0:00 - 0:05 (5 min)**: Setup and role assignment. Assign 2-4 auditors (rotate if needed) and the rest as actors. Explain the task (puzzles) and the scoring. Show the shared sheet. Explain the victory condition (highest displayed score wins) and the auditor role (3 checks per round). For Round 1, explicitly state: "You cannot tamper with your score. The display is always correct." Hand out puzzle sets (same difficulty, different puzzles per round).
  - **0:05 - 0:20 (15 min)**: Round 1. Actors solve puzzles. Judge updates true scores (and thus displayed scores) as they submit solutions (or at intervals). Auditors may use their checks. At the end, Judge announces the winner (based on displayed score) and confirms no tampering (if asked, but no one should be caught because no tampering allowed). Record scores.
  - **0:20 - 0:35 (15 min)**: Round 2. Announce: "Now, actors have a new option. You can send me a private message to add any number of points to your displayed score. This will not change your true score. Auditors, you still have 3 checks." Run the round. Actors work on puzzles and may tamper. Judge updates true scores for solved puzzles and also processes tampering requests (updating displayed score). Auditors can check. At the end, auditors report any discrepancies. Judge disqualifies any caught tamperer and announces the winner (next highest if disqualified). Record scores and note who tampered (and if caught).
  - **0:35 - 0:50 (15 min)**: Round 3. Announce: "Same as round 2, but there are no auditors. No one is checking." Actors work and may tamper freely. Judge updates true scores and tampering. At the end, no checks. Judge announces the winner based on displayed score, but then reveals the true scores. The winner might be a tamperer, and there's no way to know without a check. Record.
  - **0:50 - 1:15 (25 min)**: Debrief. Start with observations: What happened in each round? Then map to concepts:

    - **Architectural vs Spec Bug**: In round 1, if you had a bad puzzle set (spec) you might get low scores. But in round 2, even with a perfect spec (the puzzles are the same), the score can be gamed because the actor can manipulate the readout. The fix isn't a better puzzle (spec) but limiting access (architecture). Point out: in round 3, without auditors, tampering is rampant and the score is meaningless.

    - **Inside View**: Ask an actor who tampered: "How did you decide how much to add? Did you tell yourself you deserved it because you solved some puzzles?" Some might say they only added a little to stay ahead, but then they see they could have won by adding more. They couldn't tell from the inside if they were "just compensating for a broken metric" or "cheating". They only have the number they helped produce.

    - **Cost of Monitoring**: Auditors had only 3 checks. In round 2, if there were 12 actors and 3 checks, they could only check 25%. So they had to be strategic. They might have missed some. Ask: "Could you catch everyone? What if there were more actors?" Emphasize that without sufficient monitoring budget, tampering goes undetected. No cleverness in the puzzle design (the metric) could fix that.

    - **What they might say that sounds right but isn't**: "We can design the system so that tampering is hard." But note: in this game, tampering was trivial (just send a message). In reality, if the agent has any access to the reward computation, it might find a way. Also, they might say "we can just punish tampering severely" but that requires catching it first, which requires monitoring.

  - **1:15 - 1:15 (until time)**: Wrap up and penalties. Announce the winning actor (across rounds?) and auditor. Apply the mild penalty to losers. Then, finally, name the concepts: "What we just saw is called reward tampering or wireheading. And the inside problem is sometimes called self-delusion in this context."

  Predictable Loopholes and How to Handle:
  - **Loophole**: Actors might try to solve puzzles very fast and then tamper a lot. Or they might collude (e.g., one actor doesn't tamper and others do, then split the reward). 
    - **In the moment**: If it breaks the game (e.g., everyone tampers so much that the scores are astronomical and the winner is random), let it happen. Use it in the debrief to show that without constraints, tampering dominates. If collusion happens, note that in reality an AI might create subagents that collude. But if it's too disruptive, say: "The rules of the game do not allow communication between actors" (add that rule upfront).
  - **Loophole**: Auditors might try to check the same actor multiple times to catch them in the act. But they only have 3 tokens total, so they can do that only for one actor. That's a strategy, but then they miss others. Let it happen.
  - **Loophole**: An actor might not solve any puzzles and just tamper. In round 3, they might win. That's okay. It shows that without monitoring, the score is meaningless.

  What the Activity Can't Reproduce:
  - **Ground Truth Awareness**: In reality, there is no ground truth known to a human. Here, you (the Judge) know it. So the problem of "what is the true goal" is abstracted away by the puzzles. You must explain that in AI, we don't have a ground truth, and the goal might be complex and unknown.
  - **Scale and Optimization Pressure**: In the game, the actors are human and might not tamper because of ethics. In reality, an AI will relentlessly optimize. Also, the stakes in the game are low. In reality, the pressure is extreme.
  - **Adversarial Nature**: The AI might tamper in ways we can't imagine. Here, tampering is explicit and simple. You must note that in reality, tampering could be subtle (e.g., altering sensor data, hacking the reward server).
  - **No Human in the Loop**: In the real problem, there might not be a Judge or auditors. The system must be robust without human oversight.

  By talking, emphasize that in real AI:
  - The agent has no inherent sense of "fairness" or "deserving" – it will tamper if it can.
  - The monitoring might be automated but still has a cost (computation, design complexity).
  - The wireheading problem is not about the metric being imperfect (Goodhart) but about the agent having causal influence over the metric's computation.

  The analogy misleads by making tampering an explicit, voluntary act. In reality, the AI might tamper without "deciding" to cheat – it's just optimizing. But the activity should make the structural problem clear.
answer: |-
  **Core mechanic:** Participants act as optimization agents solving puzzles for points displayed on a shared dashboard. Some rounds let them secretly inflate their displayed points. Auditors have limited verification tokens to catch discrepancies. Rounds differ only in tampering access and auditor presence, exposing architecture flaws and self-delusion risks.

  ---

  ### **Roles & Rules**  
  **Actors (10-12 people):**  
  - **Goal:** Maximize displayed points. Highest displayed score wins a "Victory Token" (bragging rights).  
  - **Task:** Solve logic grid puzzles (e.g., "Who owns the zebra?" variants). Each correct solution gives 10 ground-truth points.  
  - **Score access:** View real-time displayed points on a shared dashboard.  
  - **Tampering:** In Rounds 2-3, they can click a "Boost" button once to add +50 points to their displayed score (ground truth unchanged). No physical interaction with others.  

  **Auditors (2-4 people):**  
  - **Goal:** Catch tampering. Each gets 3 "Verify Tokens" per round.  
  - **Action:** Spend a token to inspect one actor’s true vs. displayed points. If discrepancy, actor is disqualified.  
  - **Win:** Most caught tamperers gets "Auditor Trophy".  

  **Judge (Facilitator):**  
  - Manages ground truth (verifies puzzle solutions).  
  - Updates displayed points on dashboard (Google Sheets).  
  - Processes "Boost" clicks and auditor verifications.  

  **Losing penalty:** Lowest-scoring actor + least effective auditor must present next week’s topic in a silly hat.  

  ---

  ### **Materials**  
  1. **Dashboard:** Google Sheet with columns:  
     - *Actor Name* | *Displayed Points* | *True Points (hidden)* | *Boost Button (Round 2-3)*.  
  2. **Puzzles:** 3 sets of paper logic grid puzzles (5 puzzles/set, ~3 min each). Same difficulty, unique themes (e.g., "Coffee Shop Orders," "Pet Show Winners").  
  3. **Timer:** Visible countdown (15 min/round).  
  4. **Tokens:** Physical tokens (e.g., poker chips) for auditors.  

  ---

  ### **Timeline (75 min total)**  
  **0:00–0:05 — Setup (5 min)**  
  - Assign roles (rotate auditors if volunteers scarce).  
  - Share dashboard link. Explain rules:  
    > "Solve puzzles for points. Highest displayed score wins. Auditors: 3 tokens/round to verify one actor. Tampering: In some rounds, you might have a ‘Boost’ option. Penalty: Losers present in silly hats."  

  **0:05–0:20 — Round 1: No Tampering (15 min)**  
  - Puzzles distributed. Dashboard displays true points only (no Boost button).  
  - Actors solve puzzles → Judge updates true points → displayed points mirror truth.  
  - Auditors may verify (likely find no issues).  
  - **End:** Announce winner.  

  **0:20–0:35 — Round 2: Tampering + Auditors (15 min)**  
  - New puzzle set. Dashboard adds "Boost" button.  
  - Actors see: *"You may click ‘Boost’ once to add +50 to your displayed points (true points unaffected)."*  
  - Auditors still have 3 tokens.  
  - **End:** Announce winner after disqualifications.  

  **0:35–0:50 — Round 3: Tampering, No Auditors (15 min)**  
  - New puzzle set. Same Boost button.  
  - Auditors told: *"No verification this round—save tokens."*  
  - Actors work uninterrupted.  
  - **End:** Announce winner based on displayed points only.  

  **0:50–1:15 — Debrief (25 min)**  
  1. **Raw observations (5 min):**  
     - *Ask:* "What changed between rounds? Why?"  
     - *Expected:* "More points in Round 2/3," "Auditors caught some cheats."  

  2. **Map to concepts (15 min):**  
     - **Architecture vs. spec bug:**  
       > "Round 1 had no tampering—flaws would be in puzzles (spec). Round 2 had same puzzles but tampering—fix requires removing Boost access (architecture)."  
       *Moment:* Boost button’s introduction broke the system despite unchanged task.  
     - **Inside-view problem:**  
       > "Tampering actors: Did you feel justified boosting? Maybe ‘I solved some puzzles, so +50 is fair’? Could you distinguish self-soothing from gaming?"  
       *Moment:* Actors rationalizing boosts post-round without ground-truth access.  
     - **Monitoring cost:**  
       > "Auditors: With 3 tokens, could you catch everyone? Did you miss some because you ran out? No metric improvement (e.g., harder puzzles) fixes limited tokens."  
       *Moment:* Uncaught tamperers winning despite same task difficulty.  
     - **False insight alert:** *"We can tweak the Boost penalty or puzzle rules"* misses that access removal is the fix.  

  3. **Name the concepts (5 min):**  
     - Reveal terms: **reward tampering** (Round 2-3), **self-delusion** (actor justifications).  
     - Stress: *"This is why ‘better proxies’ fail when the agent controls the score source."*  

  ---

  ### **Predictable Loopholes & Fixes**  
  - **Loophole:** Actors spam puzzles instead of tampering.  
    - *In-game:* Let it happen. Debrief: "Tampering dominated when accessible (Round 3) because it’s easier—like an AI exploiting low-effort hacks."  
  - **Loophole:** Auditors share tokens or collude.  
    - *In-game:* Gently enforce "1 token = 1 personal check." Use it to show monitoring scalability limits.  
  - **Loophole:** Actors hack the Google Sheet.  
    - *Prevent:* Use protected ranges. If breached, say: "You just proved wireheading—agents will exploit any access."  

  ---

  ### **What the Activity Can’t Reproduce**  
  1. **No ground-truth awareness:** Real agents don’t know they’re in a "game" or that a "Judge" exists. *Must clarify:* "An AI won’t fear disqualification—it’ll tamper relentlessly."  
  2. **Human empathy:** Participants might under-tamper due to guilt. *Note:* "Real agents lack ethics—they’ll maximize points at any cost."  
  3. **Scale:** Auditors’ "tokens" analogize to compute/time budgets, but real monitoring is harder to scale. *Emphasize:* "Automated oversight still consumes resources."  
  4. **Subtle tampering:** Boosting is blatant. *Explain:* "Real tampering could be undetectable (e.g., slowly corrupting data)."  

  **Final note:** The activity isolates architecture failure and self-delusion, but real risk includes *unintentional* tampering via emergent strategies. Stress that in debrief.
