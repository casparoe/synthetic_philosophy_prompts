prompt: |-
  I spent most of last night arguing with a friend of mine — a clinical psychologist who reads a fair amount of evolutionary theory — about whether Gould and Lewontin's spandrels paper undermines the adaptationist explanations he was defending. Toward the end he typed out his position in a message, and I would like to know how much of it I should concede. Here it is:

  'Gould and Lewontin showed that natural selection cannot explain most traits, and that genuine adaptation is the exception rather than the rule. Their example is the spandrels of St Mark's in Venice: the tapering triangular spaces between the arches that carry the dome. Those spaces are there only because you cannot set a dome on rounded arches without them — pure byproduct — and then the mosaicists filled them in, so the decoration ends up looking like the whole point of the structure. A spandrel in biology is the same kind of thing: any trait that is not an adaptation, whether it is a vestige, a holdover from an ancestor, or a fluke of genetic drift. What they proposed was a change in the burden of proof — non-adaptation becomes the null hypothesis, and the adaptationist has to demonstrate that selection actually built the trait. The Pangloss comparison makes the same point: adaptationists assume every trait is optimally designed for whatever it does now. They called these spandrels exaptations, and Gould went on to argue that the human brain and language are exaptations rather than adaptations. The upshot is that the debate is basically over: biology now treats byproducts as the default, which is exactly why the adaptive stories in evolutionary psychology are just-so stories and need not be taken seriously.'

  Several things strike me as off, but I could not pin them down at one in the morning, and he is the one with the science degree. Please audit the passage sentence by sentence: which claims a philosopher of biology or a working evolutionist would accept as a fair reading of the 1979 paper, which are defensible simplifications, and which are misrepresentations. In particular, I would like to know whether the paper really makes a claim about how many traits are adaptations; whether the term spandrel really covers vestiges and drift-produced features, or something narrower; whether exaptation is the paper's own term and whether it means the same thing as spandrel; and whether the null-hypothesis framing is Gould and Lewontin's proposal or a reconstruction supplied by their critics and by later methodology. Finally, tell me whether his conclusion survives the corrections — does anything that is true in the summary support dismissing adaptationist accounts of human psychology wholesale?

  Lead with a single sentence giving your overall verdict on the summary, close with the one correction you think matters most if I want to reopen the argument, and keep the whole thing under 500 words, in American English.
reasoning: |-
  Hmm, the user wants me to analyze a summary of Gould and Lewontin's spandrels paper that their psychologist friend provided. They're specifically asking for a sentence-by-sentence audit of this passage to identify what's accurate, simplified, or misrepresented.

  Looking at the friend's summary, I notice several significant inaccuracies right away. The friend claims Gould and Lewontin argued that natural selection can't explain most traits and that adaptation is the exception rather than the rule - but the paper actually criticized methodological adaptationism, not adaptation itself. They were warning against assuming every trait must be adaptive without considering alternatives.

  The spandrel analogy is also misrepresented. While the paper did use the architectural spandrel analogy for non-adaptive byproducts, it didn't extend this to include vestiges or drift features as the friend claims. And the friend conflates exaptation (a later Gould concept) with spandrels - these are distinct ideas.

  The null hypothesis framing is problematic too. Gould and Lewontin didn't propose making non-adaptation the null hypothesis; they argued for pluralism in evolutionary explanations. The claim that "biology now treats byproducts as the default" is an overstatement - adaptation remains central to evolutionary biology.

  The Panglossian comparison is fair, as is the critique of some evolutionary psychology stories as "just-so" stories. But the blanket dismissal of adaptive explanations in evolutionary psychology goes beyond what the paper argued. The paper called for more rigor and consideration of alternatives, not outright rejection.

  For my response, I'll provide a clear verdict upfront that this summary misrepresents key arguments. I'll audit each claim systematically, noting what's accurate, simplified, or incorrect. I'll specifically address the user's questions about the prevalence claim, spandrel definition, exaptation terminology, and null hypothesis framing. I'll conclude by noting that while the paper's call for methodological caution is valid, it doesn't support dismissing adaptationist accounts wholesale. My most important correction will be that the paper advocates pluralism rather than reversing the burden of proof.
answer: |-
  ### Overall Verdict
  Your friend's summary significantly misrepresents Gould and Lewontin (1979), overstates its claims, and confuses later concepts with the paper's core arguments.

  ### Sentence-by-Sentence Audit
  1.  **"Gould and Lewontin showed that natural selection cannot explain most traits, and that genuine adaptation is the exception rather than the rule."**
      *   **Misrepresentation.** G&L argued against *methodological adaptationism* (assuming every trait *must* be an adaptation) and for considering alternatives. They did **not** claim most traits are non-adaptive or that adaptation is rare. They criticized the *default assumption*, not the prevalence of adaptation.

  2.  **"Their example is the spandrels... pure byproduct... then the mosaicists filled them in..."**
      *   **Accurate Simplification.** This captures the architectural analogy's core: spandrels are necessary structural byproducts later co-opted for decoration.

  3.  **"A spandrel in biology is the same kind of thing: any trait that is not an adaptation, whether it is a vestige, a holdover... or a fluke of genetic drift."**
      *   **Misrepresentation.** G&L defined spandrels narrowly as *architectural byproducts* (features arising as necessary consequences of other selected structures), **not** a catch-all for *all* non-adaptations. Vestiges (reduced function) and drift-produced features are distinct categories outside their spandrel definition.

  4.  **"What they proposed was a change in the burden of proof... non-adaptation becomes the null hypothesis..."**
      *   **Misrepresentation/Simplification.** G&L argued against adaptationism as the *only* approach and advocated pluralism (considering constraints, alternatives). They did **not** propose reversing the null hypothesis. The "burden of proof" framing is often a *reconstruction* by critics or later methodology discussions, not G&L's explicit proposal.

  5.  **"The Pangloss comparison makes the same point..."**
      *   **Defensible Simplification.** Comparing extreme adaptationism to Dr. Pangloss's optimism is accurate and central to their critique.

  6.  **"They called these spandrels exaptations..."**
      *   **Inaccurate.** "Exaptation" was coined by **Gould & Vrba (1982)**. G&L (1979) only used "spandrel". Exaptation is broader, covering traits co-opted for new functions *regardless* of their original origin (could be adaptive or non-adaptive like a spandrel).

  7.  **"...Gould went on to argue that the human brain and language are exaptations..."**
      *   **Accurate (Later Work).** True of Gould's *later* writings, but **not** part of the 1979 paper itself.

  8.  **"The upshot is that the debate is basically over: biology now treats byproducts as the default..."**
      *   **Overstatement/Misrepresentation.** While G&L were highly influential, adaptationism remains a powerful and central tool in evolutionary biology. Byproducts are *considered seriously*, but adaptation is **not** treated as a rare exception nor displaced as the "default" explanation in mainstream evolutionary theory. The debate shifted towards methodological caution and pluralism, not a decisive victory for non-adaptation.

  9.  **"...exactly why the adaptive stories in evolutionary psychology are just-so stories and need not be taken seriously."**
      *   **Defensible Simplification (with Overreach).** G&L's critique directly targeted the uncritical generation of adaptive "just-so stories" lacking evidence, a significant problem in *some* evo psych. However, their paper does **not** support dismissing *all* adaptationist accounts in evo psych wholesale, only demanding rigorous evidence and considering alternatives. Good evo psych seeks such evidence.

  ### Answers to Specific Queries
  *   **Prevalence Claim:** No, the paper makes **no claim** about *how many* traits are adaptations; it criticizes the *method* of assuming adaptation without testing alternatives.
  *   **Spandrel Definition:** It is **narrower** (architectural byproduct), *not* a synonym for all non-adaptations like vestiges or drift products.
  *   **Exaptation:** **Not** in the 1979 paper; coined later (1982) by Gould & Vrba. It means a trait co-opted for a new function, which *could* originate as an adaptation, a spandrel, or something else.
  *   **Null Hypothesis:** This is largely a **later reconstruction/critique**; G&L advocated pluralism, not formally reversing the null.
  *   **Conclusion Survival:** **No.** While G&L's call for methodological rigor and considering non-adaptive explanations is valid and influential, it does **not** support dismissing *all* adaptationist accounts of human psychology wholesale. It demands better evidence and alternative hypotheses, not rejection based on origin alone.

  ### Most Important Correction to Reopen the Argument
  **Gould and Lewontin argued for methodological pluralism and against assuming adaptation *must* be the explanation for every trait; they did not claim adaptation is rare, propose non-adaptation as the new null hypothesis, or define "spandrel" as broadly as "any non-adaptation".**
