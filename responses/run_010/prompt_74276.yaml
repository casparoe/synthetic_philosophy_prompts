  ### Specialist Analysis: Expected Answer and Grading

  A fully correct answer must first describe the Szilard engine: a single-molecule system where measurement of the molecule's position (left/right) allows insertion of a piston, enabling isothermal expansion that extracts \( kT \ln 2 \) work from one heat bath, apparently violating Kelvin's second law (full heat-to-work conversion). Landauer's principle resolves this by stipulating that erasing one bit of information dissipates at least \( kT \ln 2 \) heat, restoring entropy balance. Crucially, the thermodynamic cost falls on **erasure**, not acquisition: measurement can be reversible and thermodynamically free, while erasure is logically irreversible and incurs the cost. Standard positions diverge here—Brillouin argued measurement requires energy (e.g., via light), but Bennett's consensus holds that only erasure is costly. Unbounded memory could avoid erasure costs, but finite systems necessitate erasure, preserving the second law.

