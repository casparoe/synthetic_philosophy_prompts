  - "errors": array of objects, each with "sentence" (quote the student's own words, or a few words of them, so I can locate it), "kind" (one of "conflation", "misattribution", "non_sequitur", "overstatement", "other"), "explanation" (what's wrong and what the correct position is), "severity" ("minor", "moderate" or "serious"), and "what_good_would_look_like"
