prompt: |-
  ok so I'm a junior and for the last year I've been training really tiny transformers on made-up tasks and poking at their internals with linear probes, mostly bc I want to do an interpretability project for a research competition. I've hit a wall and it's not a coding wall.

  here's the situation. I trained a little model to say whether a sentence has a negation in it. I pull the activations at layer 3, train a probe on them, and it separates negation from no-negation at like 99%. so I tell my friend the network represents whether there's a negation, and he says no — all you showed is that the information is sitting in there, that's not the same thing as the network representing it. then I zero out that direction and accuracy barely moves, which he says proves his point. but I also trained a probe on a model that only ever saw French sentences and it decoded this-is-French perfectly, and obviously something is different about that case too, even though the info is decodable in exactly the same way and neither one is doing much work.

  so before I run a single other probe I want to know what I should even be demanding of an answer. write me the spec: what does an account of what it is for a neural network to represent something have to deliver before it counts as adequate? I mean the cases it has to get right (my two probes should come out differently, presumably — show me why), the distinctions it's not allowed to collapse (decodable vs actually used, I guess, but there has to be more and I don't know what), the facts about why interpretability methods work at all that it should explain rather than just be consistent with, and anything it flatly can't contradict. for each requirement give me the case or the consideration behind it, not just the requirement by itself.

  then tell me which of them are actually non-negotiable and which are just what one camp happens to want. I keep seeing people assert that features are just directions in activation space like it's a definition, when it might be an empirical claim that could turn out wrong, and I can't tell which parts of this whole debate are like that — smuggled in as obvious when they're really contestable.

  and the part I want most: is there a subset of these requirements that can't all be satisfied at once? like does insisting that what a representation is about gets fixed by what it causally does downstream conflict with insisting that there's a determinate fact about what it's about regardless of what I happen to be probing for? if the list itself turns out to be the result — i.e. you can show the debate is stuck for a structural reason — say that loudly.

  also: which single requirement knocks out the most candidate accounts? and if you want, one or two sentences at the end on how the obvious answers do against your list, but the list is the point, dont turn it into a scorecard.

  purpose, since I figure adequacy depends on it: I want an account good enough that a claim like "this model represents the user's goal as X" could be literally true and could license a prediction about what the model will do next — not just be a convenient fiction for writing up my project. if the requirements change depending on whether that's the purpose versus just describing the computation, tell me which ones change.

  no citations or reading lists please, I can't look anything up and I don't want to be chasing papers. and at the end say how confident you are in the requirements you've listed, and single out the one point in the whole thing you're least sure about.
reasoning: |-
  We are trying to specify what it means for a neural network to represent something, with a focus on interpretability and the ability to make predictions about the model's behavior.

   The problem: 
     - We have two probes: 
          1. On a model trained for negation detection, we can decode negation from layer 3 activations with 99% accuracy, but zeroing that direction doesn't hurt performance. 
          2. On a model trained only on French, we can decode "this is French" from activations, but that's obviously not used by the model (since it only ever sees French).

   We want an account of representation that:
     - Distinguishes these two cases (the negation probe should be about a representation that the model uses, while the French probe is just decodable information that isn't used).
     - Captures the difference between decodable information and actual use in the computation.
     - Explains why interpretability methods (like linear probes) work at all, rather than just being consistent with their success.
     - Doesn't contradict established facts about neural networks.

   We also want to know:
     - Which requirements are non-negotiable and which are contentious?
     - Are there conflicts in the requirements?
     - Which requirement is the most challenging for candidate accounts?

   Purpose: We want to be able to say "the model represents X" and have that license predictions about what the model will do next (not just be a convenient fiction).

   Let's build the spec.

   Requirements for an adequate account of representation:

   1. **Causal Role Requirement**: The representation must play a causal role in the model's behavior. 
      - *Case*: In the negation task, if the representation for negation is actually used, then perturbing it should affect the output (especially for negation-related decisions). But we found that zeroing the direction didn't hurt performance. This suggests that either the representation isn't used (and the information is redundantly encoded) or the probe direction isn't the actual feature used by the model. 
      - *Why non-negotiable?* If we want to use the representation to predict behavior, then it must be causally involved in producing that behavior.

   2. **Robustness/Invariance Requirement**: The representation should be robust to irrelevant variations and invariant to the exact way the information is encoded (e.g., it should be a stable feature across inputs).
      - *Case*: The French probe: the information is present but not used. However, note that the model only ever sees French, so the representation of "Frenchness" might be degenerate. The account must explain why this representation isn't robust (it might not be a feature that the model uses for anything, so it might not be invariant under distribution shifts). 
      - *Why non-negotiable?* If we want to make predictions about new inputs, the representation must be stable and not an artifact of the training set.

   3. **Downstream Determinacy Requirement**: What the representation is about must be fixed by how it is used downstream in the network, not by how we happen to probe it.
      - *Case*: The negation probe: if we train a probe for negation and it works, but the network doesn't use that direction for negation, then the probe might be reading out a byproduct. The account must explain why the probe might be reading something that isn't the actual feature the model uses. 
      - *Why non-negotiable?* Without this, we cannot say that the representation is about negation (it might be about something else that correlates with negation).

   4. **Non-Circularity/Explanatory Requirement**: The account should explain why linear probes often work (i.e., why information is linearly decodable in activation spaces) without assuming that every linearly decodable pattern is a representation.
      - *Case*: Both probes work linearly. The account must explain why linear decodability is common, but also why it doesn't always indicate a representation that is used by the model.
      - *Why non-negotiable?* Because we need to understand the success of interpretability methods, not just take it as a given.

   5. **Specificity Requirement**: The representation should be specific to the content it is supposed to represent. That is, the representation for negation should be about negation and not about a million other things that co-occur with negation.
      - *Case*: In the negation task, if the probe direction also encodes other features (like sentence length, which might correlate with negation), then it might not be specific. The account must provide a way to distinguish the specific content.
      - *Why non-negotiable?* For making predictions, we need to know what the representation is about, not just that it correlates with many things.

   6. **Implementation Independence Requirement**: The account should not be tied to a specific implementation (like a particular direction in activation space) because the same function can be implemented in different ways (e.g., by different models, or even by the same model in different regions).
      - *Case*: The fact that zeroing out one direction doesn't hurt performance might mean that the model uses a different direction for the same information. The account must allow for multiple realizations of the same representation.
      - *Why non-negotiable?* Because neural networks are known for their distributed representations and redundancy.

   7. **Counterfactual Requirement**: The representation should support counterfactuals: if the represented state of affairs were different, the representation would change accordingly, and this change would lead to appropriate changes in behavior.
      - *Case*: For the negation representation, if we take a sentence without negation and change it to have negation, the representation should change and the model's output should change appropriately. For the French probe, if we fed the model a non-French sentence (which we didn't train on), it might not change in a way that reflects "not French" because the model wasn't trained on that.
      - *Why non-negotiable?* This is at the heart of using the representation to predict behavior in new situations.

   Now, let's address the questions:

   *Non-negotiable vs. contentious*:
     - The Causal Role, Downstream Determinacy, and Counterfactual requirements are non-negotiable for the purpose of using the representation to predict behavior. Without these, we cannot make reliable predictions.
     - The Robustness and Specificity requirements are also non-negotiable for scientific rigor, but there might be degrees (e.g., how robust? how specific?).
     - The Implementation Independence requirement is non-negotiable given the nature of neural networks.
     - The Non-Circularity requirement is non-negotiable because we need to explain why interpretability works.

     However, some might argue that for a weaker notion of representation (e.g., for descriptive purposes without predictive power) some of these could be relaxed. But for the stated purpose, they are non-negotiable.

   *Conflicts*:
     - There is a potential conflict between the Downstream Determinacy Requirement and the Implementation Independence Requirement: 
          - Downstream Determinacy says that what the representation is about is fixed by how it is used downstream. 
          - Implementation Independence says that the same representation can be implemented in multiple ways (so the same downstream effect can be achieved by different activation patterns). 
          - How do we reconcile? We need an account that allows for multiple realizations of the same representation that all have the same downstream effect. This is possible (e.g., in terms of equivalence classes of activation patterns that are treated the same by downstream layers). But it requires that the account abstract over implementation details.

     - Another tension: The Causal Role Requirement and the fact that zeroing out one direction doesn't hurt performance. This might be because of redundancy (multiple directions can play the same causal role). So the account must allow for a representation to be implemented in a distributed, redundant way. This is where the Implementation Independence Requirement helps.

   *Which requirement knocks out the most candidates?*
     - The Causal Role Requirement combined with the Downstream Determinacy Requirement is very challenging. Many accounts (e.g., simple linear decodability) fail because they don't require that the feature is actually used by the model. The French probe example is a classic counterexample to pure decodability accounts.

   *How the obvious accounts fare*:
     - **Decodability (linear probes)**: Fails the Causal Role and Downstream Determinacy requirements (as per the negation probe and French probe).
     - **Causal mediation accounts** (e.g., the representation is a node or pattern that causes the output): This might satisfy Causal Role and Counterfactual, but may struggle with Implementation Independence (if it requires a specific direction) and Robustness (if the representation is not stable across inputs).
     - **Mechanistic accounts** (e.g., the representation is whatever is computed by a particular circuit): This might satisfy many, but may have trouble with Implementation Independence (if the circuit is fixed) and might not explain linear decodability.

   *Confidence*:
     - I am confident in the requirements listed because they are motivated by the stated purpose and the cases. However, the exact formulation of the requirements (especially how to balance them) is an open research question.

   *Least sure point*:
     - I am least sure about the exact boundaries of the Implementation Independence Requirement. How abstract can we get before we lose the ability to make specific predictions? If the representation can be implemented in too many ways, then it becomes hard to pin down.

   *Final note on purpose*:
     - If the purpose were just to describe the computation (without predictive power), then we might relax the Causal Role and Counterfactual requirements. But for your purpose (making predictions about behavior), they are essential.

   So the spec is:

     A representation in a neural network must:
        (1) Play a causal role in the model's behavior (so that perturbing it affects the output in a way that aligns with the content of the representation).
        (2) Be robust to irrelevant variations and invariant under expected distribution shifts.
        (3) Have its content fixed by how it is used downstream, not by the probe.
        (4) Explain why linear decodability is often possible without equating it with representation.
        (5) Be specific to the content it represents (so that it is not just a correlate of many things).
        (6) Be implementation independent (allowing for multiple realizations in the activation space).
        (7) Support counterfactuals about the represented state.

     And the most challenging requirement for candidate accounts is the combination of (1) and (3) (causal role and downstream determinacy) because they require that the representation is both used and that use fixes the content.

     The two probes should come out differently because:
        - In the negation case: we expect that if the representation is used, then perturbing it should affect the output (but it didn't in your experiment, so maybe it's not the actual representation the model uses? or there's redundancy). So we must look for a representation that satisfies (1) and (3). If we can't find one that satisfies (1), then the model might not represent negation in a way that we can isolate? 
        - In the French case: the representation of "Frenchness" is not used downstream (since the model doesn't need to do anything with that information) and it wouldn't support counterfactuals (if we give it a non-French input, it breaks). So it fails (1), (3), and (7).

     Therefore, the negation probe might be reading out a real representation if we can show that the model uses that information in a causal way (maybe by finding a different direction that when perturbed does affect the output) and that the representation is specific and robust. Otherwise, it might be like the French probe.

     This suggests that we need more than just a probe: we need to show that the representation is causally involved and that the model's behavior depends on it in the right way.

     How to proceed? 
        - For the negation model: try to find a direction that when perturbed actually affects the output for negation. Or, test counterfactuals: if we flip the representation (from negation to no negation) without changing the rest, does the output change appropriately? (This is like causal intervention.)

     The account of representation must then be one that passes these tests.

     But note: even if an account satisfies all these, it might be hard to find in practice. However, for the purpose of making claims that license predictions, we must demand these.

     Confidence level: 85% in the requirements as a set. The least sure point is the exact degree of implementation independence (requirement 6) and how to operationalize it without losing predictive power.

     And the structural reason for the debate: the tension between the need for a representation to be abstract (to allow for multiple implementations) and concrete enough to be causally manipulated and observed. This is a classic tension in philosophy of mind (multiple realizability vs. causal efficacy) and it resurfaces here.
answer: |-
  ### Spec for an Account of Neural Network Representation

  #### Core Requirements (Non-Negotiable for Predictive Validity)
  1. **Causal Efficacy**  
     - **What**: The representation must *do work* in the computation. Information must be causally necessary for the model's output.  
     - **Case**: Your negation probe failed—zeroing it didn't hurt accuracy. The French probe is causally inert—it doesn't affect output.  
     - **Why non-negotiable**: Without causal power, you can't predict behavior.  

  2. **Downstream Invariance**  
     - **What**: What the representation is *about* must be fixed by how later layers *use* it, not by correlations.  
     - **Case**: In the negation task, the probe direction might correlate with negation but not be used by layer 4. The French probe has no downstream use at all.  
     - **Why non-negotiable**: Determines whether the feature is a "real" representation or an artifact.  

  3. **Counterfactual Sensitivity**  
     - **What**: Altering the represented property (e.g., removing negation from a sentence) must change the activation *and* the output *if the model relies on it*.  
     - **Case**: Your negation probe should show this sensitivity; the French probe shouldn’t (since "Frenchness" never changes in training).  
     - **Why non-negotiable**: Predictions require knowing how the model responds to changes.  

  4. **Implementation Independence**  
     - **What**: The account must allow the *same* representation to be implemented in different ways (e.g., via different directions or circuits).  
     - **Case**: Zeroing one negation-suggestive direction didn’t break the model—redundant encodings exist.  
     - **Why non-negotiable**: Neural nets are massively parallel; representations are distributed.  

  #### Explanatory Requirements (Must Explain Observed Phenomena)
  5. **Probe Success Explainability**  
     - **What**: Explain why linear probes *often* work (e.g., geometry of activation spaces).  
     - **Case**: Both your probes decode well. The account must clarify why this happens even for unused info (like French).  
     - **Why non-negotiable**: Interpretability tools must be grounded, not magical.  

  6. **False Positive Rejection**  
     - **What**: Explain why decodability ≠ representation (e.g., French probe).  
     - **Case**: Your French probe decodes perfectly but is irrelevant to the model’s function.  
     - **Why non-negotiable**: Otherwise, all information becomes "representation," collapsing the concept.  

  #### Boundary Conditions (What the Account Cannot Do)
  - **Cannot contradict**:  
    - The existence of **redundant encodings** (your zero-out test).  
    - **Superposition** (multiple features in one direction).  
    - **Probe reliability** for *accessible* information.  

  ---

  ### Tensions and Conflicts
  - **Critical conflict**: **Causal Efficacy** vs. **Implementation Independence**.  
    - If a representation *must* cause behavior, but can be implemented redundantly, how do you isolate "the" representation? Zeroing one direction fails, but the model still uses negation *somewhere*.  
    - **Result**: Accounts that demand a single "ground truth" direction (e.g., "features are directions") fail—they can’t handle redundancy.  

  - **Downstream Invariance** vs. **Probe-Dependent Claims**:  
    - If what a representation is "about" is fixed by downstream use, but probes can read unused info (French), then probes alone can’t validate representation claims.  

  ---

  ### Which Requirement Knocks Out Most Accounts?
  **Causal Efficacy**.  
  - Knocks out:  
    - Pure "decodability" accounts (French probe).  
    - "Activation direction = feature" claims (fails your zero-out test).  
    - Information-theoretic views (info can be present but unused).  

  ---

  ### How Obvious Answers Fare
  - **"Features are directions in activation space"**:  
    Fails **Causal Efficacy** (zero-out test) and **Implementation Independence** (redundancy).  
  - **"Representation is whatever a probe reads"**:  
    Fails **False Positive Rejection** (French probe) and **Downstream Invariance**.  

  ---

  ### Confidence and Uncertainty
  - **Overall confidence**: 90% in the requirements. They resolve your cases and align with predictive goals.  
  - **Least sure point**: **Downstream Invariance**.  
    - *Why*: When exactly does downstream use "fix" what a representation is about? If multiple layers use the same activation differently (e.g., for negation and sentiment), is it "about" both? This edges into philosophy.  

  ### Purpose-Driven Note
  For **predicting behavior** (not just describing computations):  
  - **Causal Efficacy**, **Counterfactual Sensitivity**, and **Downstream Invariance** become **strictly necessary**.  
  - **Probe Success Explainability** becomes slightly less critical (you might tolerate probe failures if causal tests pass).  

  This spec forces you to move beyond probes:  
  1. Test counterfactuals (edit sentences to add/remove negation; see if behavior changes).  
  2. Ablate *downstream* connections to see if the representation’s effect breaks.  
  3. Check if the model’s outputs rely on the feature *across contexts*.  

  ---  
  **Structural Conclusion**: The debate is stuck because **redundancy** (a computational fact) conflicts with **localist interpretations** of representation. If you demand a single "aboutness" direction, you’ll fail—but if you embrace distributed causality, your account must reflect that.
