answer: |-
  ### Units-of-Selection Debate: Decision Tree  
  *For students encountering the debate for the first time*  
  **Starting Point**: We agree that adaptations exist (e.g., sterile worker castes in ants), and individual-level selection alone can't explain them all. What *unit* is being selected? Answer the questions below honestly to find your position.  

  ---

  #### **Node 1: To explain adaptations like sterile workers, must groups have heritable variation (not just fitness differences)?**  
  - **Yes** → Groups need "inheritance" (like genetic transmission). Go to Node 2.  
  - **No** → Group-level fitness differences alone suffice. Go to Node 3.  
  *Example*: Sterility evolves only if colony traits are passed to new colonies (e.g., via fission).  

  #### **Node 2: Must groups physically reproduce (fission, budding) to be selected?**  
  - **Yes** → Groups must replicate like organisms. Go to Node 4.  
  - **No** → Trait-groups with migration suffice (no reproduction needed). → **Sober & Wilson’s MLS2 (Trait-Group Selection)**  
    - *Why?* Groups are temporary "interactors" (e.g., Dictyostelium slugs—altruism in chimeras with migration).  
    - *Leaves*: Sterility in trait-structured populations.  

  #### **Node 3: Is "the gene" a replicator (hereditary unit), an interactor (environment-engaging unit), or incoherent?**  
  - **Replicator** → Genes are the sole units of inheritance. → **Strict Gene’s-Eye View (Dawkins)**  
    - *Why?* All selection reduces to gene replication (e.g., meiotic drive as "selfish genes" overriding individuals).  
  - **Interactor** → Genes aren’t the only selectable units. Go to Node 5.  
  - **Bad category** → "Gene" is ambiguous; focus on processes. → **Contextual Analysis (Heisler & Damuth)**  
    - *Why?* Variance partitioning (e.g., group effects on individual fitness in tumor lineages) is sufficient; no causal commitment.  

  #### **Node 4: Can group selection operate at levels above species (clades)?**  
  - **Yes** → Macroevolution matters. → **Species/Clade-Level Selection (Gould, Vrba)**  
    - *Why?* Species traits (e.g., geographic range) drive differential speciation/extinction (e.g., coral reef clades).  
  - **No** → Only sub-specific groups. → **Sober & Wilson’s MLS1 (Group Reproduction)**  
    - *Why?* Groups must reproduce (e.g., ant colony budding) to be units.  

  #### **Node 5: Can group selection explain human cultural traits?**  
  - **Yes** → Groups are interactors with causal power. → **Sober & Wilson’s Multilevel Selection (MLS1/2 Hybrid)**  
    - *Why?* Cultural group selection (e.g., cooperative norms) requires group-level interactors, even without reproduction.  
  - **No** → Individual selection suffices. → **Williams-Style Individualism**  
    - *Why?* Group effects reduce to individual costs/benefits (e.g., mitochondria in cells as "selfish" symbionts).  

  ---

  ### Positions (Leaves)  
  1. **Strict Gene’s-Eye View**: Genes are the only replicators (Node 3: Replicator).  
  2. **Williams-Style Individualism**: Groups aren’t units; individual selection explains all (Node 5: No).  
  3. **Sober & Wilson’s MLS1**: Group selection requires group reproduction (Node 4: No).  
  4. **Sober & Wilson’s MLS2**: Trait-groups + migration suffice (Node 2: No).  
  5. **Sober & Wilson’s Multilevel Selection**: Hybrid MLS1/2 for cultural traits (Node 5: Yes).  
  6. **Contextual Analysis**: Bookkeeping (variance partitioning), not causal forces (Node 3: Bad category).  
  7. **Species/Clade-Level Selection**: Macroevolutionary sorting (Node 4: Yes).  
  *Total leaves*: 7 (within 10-target).  

  ---

  ### Unoccupied Paths & Limitations  
  - **Unoccupied Path**:  
    - *Path*: Node 1 (No) → Node 3 (Interactor) → Node 5 (No).  
      - *Position implied*: Groups are interactors, but cultural traits reduce to individuals.  
      - *Why unoccupied?* **Unexplored/unattractive**: Denying cultural group selection while accepting interactors is rare; most interactor-advocates apply it broadly (e.g., Sober & Wilson).  
  - **Tree Limitations**:  
    - **Cannot separate** "Sober & Wilson’s Multilevel Selection" (Node 5: Yes) from **Contextual Analysis** in practice.  
      - *Why?* Sober & Wilson use causal language for interactors, but their models often align with Contextual Analysis’ statistical partitioning. The tree forces a causal/bookkeeping split (Node 1), but real-world work blends them.  
    - **Other notes**:  
      - Kin selection is *not* a leaf—it’s a gene/individual-level explanation (covered in Gene’s-Eye/Williams).  
      - "Unnamed" positions are absorbed (e.g., "genic selection" falls under Gene’s-Eye View).  

  This tree simplifies debate fault lines. Use examples to test your answers—e.g., Dictyostelium (Node 2), meiotic drive (Node 3), or human culture (Node 5)!  

  *Handout design tip: Format this as a flowchart with boxes/arrows. Include examples at each node.*
