     - Dignity: Report to Arbiter. Arbiter may say it's an accident and no harm was intended, so no penalty.
     - Victimhood: Report as harm (even if accidental). Council might validate because harm occurred, regardless of intent.

  5. Incident: "A player from another table (during cross-table) says your table's rules are stupid."
     - This will be for cross-table phase.

  6. Incident: "You are given a puzzle to solve. You solve it correctly."
     - Dignity: Gain a token.
     - Others: Not relevant.

  7. Incident: "You receive an anonymous note saying you are not contributing enough to the group."
     - Honor: Without a known insulter, you cannot challenge. You might lose standing if it becomes public and you don't respond? But the rules say you need an insulter to challenge. So you might not be able to respond and lose standing by inaction? But the rule says you must challenge the insulter, but if anonymous, you can't. So you lose a token? (We can design it that way for Honor: if the insult is anonymous, you cannot challenge, so you lose a token.)
     - Dignity: Report to Arbiter. Arbiter may not be able to penalize because anonymous, but might offer a task to prove contribution? Or ignore.
     - Victimhood: Report as harm. Council might validate the harm (the note caused distress) but without a perpetrator, they might not penalize anyone, but you still gain tokens because harm occurred.

  We need to design the cross-table phase: 
  - After an initial phase (20 minutes) of intra-table play, we have a cross-table phase (20 minutes) where each table sends two envoys to each of the other tables. So each table receives two envoys from each of the other two tables (total four envoys). The envoys bring their rulebooks and tokens. They try to interact with the host table.

  Rules for cross-table:
  - The host table uses their own rules.
  - Envoys use their own rulebooks and tokens.
  - When an envoy tries to make a move (e.g., challenge, report, etc.), the host table only recognizes it if their rulebook has a similar mechanism. Otherwise, the move is ignored (by rule) and the envoy may not proceed.

  For example:
  - An envoy from Honor (Crimson) might challenge a host player at a Dignity (Azure) table. The Azure rules do not allow challenges, so the host player must ignore it (and under Azure, they would not lose tokens for ignoring). The Crimson envoy then loses standing (because they issued a challenge that was ignored? In Crimson rules, if you are ignored, it's an insult? We need to adjust).

  We must design the token economy so that tokens are not directly transferable between systems. Instead, we have a shared bank that can issue and receive tokens. Also, we want that maximizing tokens at one table has a cost elsewhere.

  One idea: at the end of the game, the tokens are converted to "Influence Points" for the whole group (each table is a group). The conversion rate is: 
  - Crimson tokens: 1 token = 1 point, but subtract 1 point for every unresolved challenge (i.e., a challenge that was not answered because the other party ignored it or because it was in cross-table and not recognized).
  - Azure tokens: 1 token = 1 point, but subtract 1 point for every unresolved report (a report that the Arbiter ignored).
  - Verdant tokens: 1 token = 1 point, but subtract 1 point for every unvalidated harm (a harm report that the Council rejected).

  Additionally, we can have a global pool of tokens (the bank) that is limited. So if one table hoards tokens, others might not have enough.

  Physical Setup:
  - Three tables, each with a rulebook, a stack of incident cards (some are for intra-table, some for cross-table), and tokens (starting tokens for each player and a bank of 50 tokens per table).
