  We are designing an activity for a class of 22 students (or 9 in a small class) to explore three moral cultures: honor, dignity, and victimhood. The goal is to have students experience the rule systems without being told the labels, and to have the mechanics of the game reveal the strengths and weaknesses of each system. We want to avoid the students ranking the systems and instead have them see that each system has blind spots.

  Key elements:
  1. Three rulebooks (with neutral names: e.g., "Rubric Alpha", "Rubric Beta", "Rubric Gamma") that encode the following without explicitly stating the dimensions:
     - How standing is acquired.
     - How standing can be lost or forfeited.
     - What counts as a correct response to a slight.
     - The role of third parties in settling disputes.

  2. A set of incident cards (about a dozen) that present scenarios that are:
     - Trivially resolvable under one rulebook and structurally insoluble under another.
     - The same event is a serious injury in one system and not an event in another.

  3. A cross-table phase: players from different rule systems interact, and the rules enforce non-recognition of moves from other systems.

  4. Token economy: no real money. Each table has its own currency (e.g., Alpha Tokens, Beta Tokens, Gamma Tokens). The payoffs should be arranged such that maximizing one's own currency comes at a cost elsewhere, so that no system is clearly superior.

  5. Physical setup: one room with movable tables, index cards (for incidents), a whiteboard for scores, and a projector (but not trusted). Group sizes: for 22 students, we can have three groups of 7 (with one group of 8 if necessary, but let's aim for 7,7,8). For 9 students, three groups of 3.

  6. Timeline: 80 minutes, minute-by-minute.

  7. Debrief: map moments in the game to the three conceptions, and handle two deflections:
     - The student who says the second table (dignity) won because it was not exhausting.
     - The student who says it's a sham trichotomy and just a single dial.

  8. Acknowledge limitations: players were not raised in the system, didn't choose it, and can't leave it.

  Design of the rulebooks:

  We'll create three rulebooks: let's call them:
  - Rulebook A (Honor): Standing is acquired through public recognition and can be lost by insults. Response to slight: must challenge or lose standing. Third parties may act as witnesses but do not settle disputes unless called as arbiters in a duel.
  - Rulebook B (Dignity): Standing is inherent and cannot be lost by external events. Response to slight: ignore or report to authority. Third parties (authorities) settle disputes.
  - Rulebook C (Victimhood): Standing is acquired by demonstrating harm. Response to slight: report and seek validation from third parties. Third parties (the community) must acknowledge and validate the harm.

  We must encode these without using the terms honor, dignity, victimhood, and without explicitly stating the four dimensions.

  Rulebook A (Honor) - Let's call it "Rubric Crimson":
  - Your standing is represented by your Crimson Tokens.
  - You start with 3 tokens.
  - To gain tokens: 
     - You may challenge another player at your table to a contest (e.g., rock-paper-scissors) for one of their tokens. If you win, you take one token from them. If you lose, you give one to them. You can only challenge if you have at least one token.
     - If you successfully defend your token in a challenge (i.e., win), you gain one additional token from the bank (max 5 tokens).
     - If you are publicly praised by two other players at your table (by them giving you a "Praise Card" that they write), you gain one token (max 5).
  - Losing tokens:
     - If you are challenged and refuse, you lose one token to the challenger and one to the bank.
     - If you are insulted (by another player giving you an "Insult Card") and do not challenge the insulter within 1 minute, you lose one token to the bank.
  - Responding to slights (Insult Cards):
     - If you receive an Insult Card, you must either challenge the insulter (as above) or lose a token (as above).
     - You may also challenge without an Insult Card (as a way to gain tokens).
  - Third parties: 
     - Other players can be called as witnesses to a challenge. They must observe and confirm the outcome. If a player refuses to witness, they lose one token to the bank.

  Rulebook B (Dignity) - "Rubric Azure":
  - Your standing is represented by Azure Tokens.
  - You start with 5 tokens and cannot go below 3 or above 7.
  - Gaining tokens:
     - You gain tokens by completing tasks (e.g., solving a puzzle or answering a question on an incident card) correctly. Each task gives 1 token (max 7).
     - You may also gain tokens by reporting an insult to the Arbiter (the instructor or a designated student at the table). The Arbiter may award you 1 token if they deem the insult valid.
  - Losing tokens:
     - You cannot lose tokens by insult or challenge. You can only lose tokens if you fail a task (lose 1 token) or if the Arbiter penalizes you for breaking the rules (e.g., insulting another player, which is against the rules).
  - Responding to slights:
     - If you receive an Insult Card, you must report it to the Arbiter. The Arbiter may:
          - Ignore it (if deemed trivial) or 
          - Penalize the insulter (they lose 1 token) and award you 1 token.
     - You are not allowed to directly respond to the insulter (if you do, you lose 1 token).
  - Third parties: 
     - The Arbiter (one player at the table is the Arbiter, rotating every 10 minutes) settles all disputes. The Arbiter can also assign tasks.

  Rulebook C (Victimhood) - "Rubric Verdant":
  - Your standing is represented by Verdant Tokens.
  - You start with 2 tokens.
  - Gaining tokens:
     - You gain tokens by reporting harms (using an "Incident Card" that describes a harm done to you) to the Community Council (the rest of the table). 
     - The Council votes (by secret ballot) on whether to validate the harm. If validated, you gain 2 tokens and the accused (if internal) loses 2 tokens (if they have them). If the harm is from an external table, the table as a whole gains 2 tokens from the bank (and the external table loses 2 tokens? But we have cross-table interaction later). Alternatively, we can have the external table not lose tokens until the cross-table phase.
     - You may also gain tokens by validating others' harms (if you are on the Council and vote to validate, you get 1 token for each validation you participate in, up to 3 per session).
  - Losing tokens:
     - If you are found to have caused harm (by the Council's vote) you lose 2 tokens.
     - If you fail to report a harm done to you within 1 minute of it occurring (if it comes from an incident card), you lose 1 token.
  - Responding to slights:
     - You must report any slight (Insult Card or harm from an incident) to the Council. You cannot respond directly.
  - Third parties:
     - The Community Council (everyone at the table except the involved parties) must hear the report and vote. The Council also assigns a "Support Token" to the victim if validated (which is the token gain above).

  Incident Cards:
  We need about 12 incidents. Some examples:

  1. Insult Card: "Player X called you a liar in front of two others."
     - Under Honor: Must challenge or lose standing.
     - Under Dignity: Report to Arbiter, who may penalize X and reward you.
     - Under Victimhood: Report to Council to validate the harm and gain tokens.

  2. Incident: "You overhear Player Y saying that people from your hometown are untrustworthy. You are from that town."
