  Below is a fully designed activity for your 80-minute seminar, addressing your core goals: students experience the three moral cultures as rule systems (without labels), encounter mechanical failures that reveal each system's blind spots, and confront the impossibility of ranking them due to trade-offs in the token economy. The design uses your constraints (movable tables, index cards, whiteboard, no projector reliance) and includes contingency plans for 9 students.

  ---

  ### **Activity Design: "The Standing Game"**
  **Objective:** Experience how different rule systems render some injuries visible/resolvable and others invisible/insoluble, without ranking the systems morally.

  **Group Sizes & Physical Setup:**
  - **22 students:** Three tables (7-8 players each). Label tables **Circle**, **Square**, and **Triangle** (neutral names).
  - **9 students:** Three tables (3 players each). Adjustments: Fewer incident cards, shorter phases (see timeline).
  - **Materials per Table:**
    - Rulebook (1 copy + player cheat sheets).
    - 20 tokens (clay chips, cardboard, etc.) in the table's unique currency (Circle Coins, Square Script, Triangle Tokens).
    - Deck of 12 **Incident Cards** (see below).
    - Blank index cards (for writing slights/praises).
    - Timer (phone or physical).
  - **Room Setup:** Tables arranged in a triangle. Whiteboard at front for scoring. Instructor circulates.

  ---

  ### **Rulebooks (Neutral Names)**
  *No explicit mention of standing acquisition/loss, slight responses, or third-party roles. Rules enforce non-recognition during cross-table phase.*

  #### **1. Circle Rulebook** (Honor)
  - **Acquire Standing:** Start with 2 tokens. Gain 1 token by winning a contest (rock-paper-scissors) against another player who *accepts* your challenge. Gain 1 token if two players publicly praise you (write praise on index cards).
  - **Lose Standing:** Lose 1 token if you refuse a challenge. Lose 1 token if you receive an insult (written index card) and do not challenge the insulter within 1 minute.
  - **Respond to Slights:** If insulted, you MUST challenge the insulter to a contest or lose a token. Challenges must be issued publicly.
  - **Third Parties:** Players can witness contests. If a player refuses to witness when asked, they lose 1 token.
  - **Cross-Table Rule:** Challenges/praises issued to other tables are ignored unless met with a contest. No token transfers.

  #### **2. Square Rulebook** (Dignity)
  - **Acquire Standing:** Start with 5 tokens. Gain 1 token by solving a task card (e.g., trivia). Gain 1 token if the Arbiter (rotating role) confirms an insult against you.
  - **Lose Standing:** Lose 1 token if you insult another player (Arbiter verifies). Lose 1 token if you fail a task.
  - **Respond to Slights:** Insults MUST be reported to the Arbiter. Direct responses (e.g., challenges) are penalized (lose 1 token). The Arbiter can dismiss "trivial" insults with no penalty.
  - **Third Parties:** Arbiter (rotates every 5 mins) settles all disputes. Tasks/insults require Arbiter validation.
  - **Cross-Table Rule:** Only the Arbiter interacts with envoys. External challenges/praises are ignored. Reports about envoys to Arbiter are dismissed.

  #### **3. Triangle Rulebook** (Victimhood)
  - **Acquire Standing:** Start with 1 token. Gain 2 tokens by reporting harm (Incident Card or insult) to the Council (all non-involved players). Gain 1 token if the Council validates another player's harm report.
  - **Lose Standing:** Lose 2 tokens if the Council validates a harm report *against* you. Lose 1 token if you witness harm and do not report it within 1 minute.
  - **Respond to Slights:** Harm MUST be reported to the Council. Direct responses (e.g., challenges) lose 2 tokens.
  - **Third Parties:** Council votes by secret ballot to validate harms (majority wins). Validated harms grant tokens; dismissed reports grant nothing.
  - **Cross-Table Rule:** External harms can be reported to the Council. Council may validate, but tokens come from the bank (not the external table).

  ---

  ### **Incident Cards (12 Total)**
  *Each card is a concrete scenario. Shuffle and distribute 4 cards per table for intra-table phase; 4 reserved for cross-table. Cards are trivially resolvable under one system and insoluble under others.*

  | Card | Scenario                                                                 | Trivial Resolution          | Structural Insolubility                        |
  |------|--------------------------------------------------------------------------|-----------------------------|------------------------------------------------|
  | 1    | Player A says to you: "Your idea is stupid."                             | **Circle:** Challenge A.    | **Square:** Arbiter may dismiss as "trivial."  |
  | 2    | Player B accidentally bumps you; your tokens spill. B says "Sorry."      | **Square:** No event (accident). | **Triangle:** Council may validate harm (loss of tokens). |
  | 3    | Anonymous note: "You don’t belong here."                                | **Triangle:** Report harm (Council validates anonymity as injury). | **Circle:** No insulter to challenge. **Square:** Arbiter dismisses (no source). |
  | 4    | Task: Solve "What is 17x3?" (Answer: 51).                               | **Square:** Solve, gain token. | **Circle/Triangle:** Not a slight/harm; no mechanism to gain tokens. |
  | 5    | Overhear Player C: "Group [your table] is lazy."                         | **Triangle:** Report harm (group injury). | **Circle:** Not directed at you; no challenge possible. **Square:** Arbiter dismisses (not personal). |
  | 6    | Player D praises you publicly: "You’re brilliant!"                      | **Circle:** Gain token (if second praise). | **Square/Triangle:** No token gain mechanism. |
  | 7    | Player E takes a token from your pile. Claims it was a "loan."           | **Circle:** Challenge E.    | **Square:** Arbiter may penalize E, but no token return. **Triangle:** Council may validate harm, but tokens from bank, not E. |
  | 8    | Task: Recite a poem. You forget a line.                                 | **Square:** Fail, lose token. | **Circle/Triangle:** Not a slight/harm; no consequence. |
  | 9    | Player F excludes you from a subgroup discussion.                        | **Triangle:** Report harm (exclusion). | **Circle:** Not a public insult; no challenge. **Square:** Arbiter dismisses ("subjective"). |
  | 10   | **Cross-Table:** Envoy says: "Your table’s rules are childish."          | **Circle:** Challenge envoy (ignored; lose token). | **Square:** Arbiter dismisses (external). **Triangle:** Council validates (tokens from bank). |
  | 11   | **Cross-Table:** Envoy "borrows" a token without asking.                 | **Triangle:** Report harm (theft; Council validates). | **Circle:** Challenge ignored. **Square:** Arbiter dismisses (external). |
  | 12   | **Cross-Table:** Envoy completes a task for you (e.g., solves a riddle). | **Square:** Arbiter grants token. | **Circle:** No challenge/praise. **Triangle:** Not harm; no gain. |

  ---

  ### **Token Economy & Payoffs**
  - **Intra-Table:** Tokens gained/lost via rulebook mechanics. Bank = 20 tokens/table.
  - **Cross-Table:** No inter-table token transfers. Validated harms (Triangle) pull from bank.
  - **Scoring Penalties (Revealed at End):**  
    - **Circle:** Lose 1 token per *unanswered challenge* (intra or cross-table).  
    - **Square:** Lose 1 token per *dismissed report* by Arbiter.  
    - **Triangle:** Lose 1 token per *unvalidated harm report*.  
  - **Trade-offs:**  
    - Circle may "win" tokens but lose to unanswered challenges.  
    - Square may have high tokens but lose to dismissed reports.  
    - Triangle may gain from harms but lose to unvalidated reports.  
    *No system dominates; penalties expose blind spots.*

  ---

  ### **Timeline (80 Minutes)**
  | Time  | Phase               | Activity                                                                                              |
  |-------|---------------------|-------------------------------------------------------------------------------------------------------|
  | 0-5   | Setup               | Assign tables (Circle, Square, Triangle). Distribute rulebooks, tokens, incident cards. Brief: "Maximize your table’s tokens. Follow your rules strictly." |
  | 5-25  | Intra-Table (20 min)| Players resolve 4 incident cards using rulebooks. Instructor circulates, enforces rules (no explanations). |
  | 25-30 | Cross-Table Prep    | Tables choose 2 envoys each. Envoys move to other tables (Circle→Square, Square→Triangle, etc.). Distribute 4 cross-table incident cards to each host table. |
  | 30-50 | Cross-Table (20 min)| Envoys interact with host table using their rulebooks. Host table uses its rules. *Rules enforce non-recognition:* E.g., Circle challenges ignored by Square. |
  | 50-55 | Return & Finalize   | Envoys return. Tables resolve remaining incidents. Tally tokens.                                      |
  | 55-65 | Scoring             | Apply penalties (announced now). Write scores on whiteboard: **Tokens - Penalties = Final Score**.   |
  | 65-80 | Debrief             | Guided discussion (see below).                                                                        |

  **9-Student Adjustment:** 
  - Reduce intra-table to 15 min (2 incidents), cross-table to 15 min (2 incidents). 
  - Each table sends 1 envoy to one table (rotate: Circle→Square→Triangle→Circle). 
  - Scoring/debrief unchanged.

  ---

  ### **Debrief Script (15 Minutes)**
  **Goal:** Students map game failures to moral cultures without ranking.  
  **Instructor:** "Let’s connect the game to our framework. What happened?"  

  1. **Surface Tensions:**  
     - *Circle (Honor):* "When Circle issued challenges, what happened at Square/Triangle? [They were ignored]. In the game, this cost Circle tokens. In real honor cultures, what happens if a slight goes unanswered?"  
     - *Square (Dignity):* "Square dismissed reports like Card 3 (anonymous note). Why? [No 'actionable' insult]. But Triangle validated it. How does dignity render certain injuries invisible?"  
     - *Triangle (Victimhood):* "Triangle gained tokens from Card 2 (accidental bump). Why couldn’t Circle or Square 'see' this harm? What does victimhood make hyper-visible?"  

  2. **Map to Framework:**  
     - **Honor:** Standing = socially conferred; must be defended (challenges, witnesses).  
       *Game link:* Unanswered challenges → standing loss.  
     - **Dignity:** Standing = inherent; slights irrelevant unless "valid" (Arbiter as authority).  
       *Game link:* Dismissed reports → penalties show dismissal as systemic.  
     - **Victimhood:** Standing = from harm recognition (Council as community).  
       *Game link:* Unvalidated harms → penalties expose validation dependency.  

  3. **Defuse Deflections:**  
     - *"Square won because it was less exhausting":* "Square’s score likely dropped from dismissed reports (e.g., Card 1,5). Dignity avoids exhaustion by ignoring 'trivial' harms—but what did it miss? Is exhaustion the only cost?"  
     - *"Sham trichotomy—just a dial of social vs. intrinsic worth":* "In the game, Square ignored Circle’s challenges and Triangle’s harms. These aren’t just 'settings'—they’re mutually unintelligible rule systems. Could Square’s Arbiter process Circle’s challenge? [No]."  

  4. **End State Question:**  
     - "Look at the scores. No system 'won.' Circle’s strength (resolve direct slights) failed at Square. Triangle’s strength (validate hidden injuries) couldn’t 'fix' Square’s dismissed reports. If you had to live in one system, which blind spots could you tolerate? Which could you not?"  

  ---

  ### **Predicted Failures & Fixes**
  - **Failure:** Cross-table descends into chaos (envoys break rules, host tables don’t enforce).  
    **Fix:** Pause game. Remind: "Host tables, use your rules to respond—or not. Envoys, you cannot force recognition." Restart with 5-minute time loss.  
  - **Failure:** One table "tanks" (e.g., Square refuses to engage).  
    **Fix:** In debrief, use this: "Square’s disengagement mirrors dignity’s 'above it all' stance. But check their penalties—dismissed reports cost them."  

  ---

  ### **Limitations & Verbal Bridge**
  **What the Game Cannot Reproduce:**  
  - Players weren’t *raised* in the system, didn’t *choose* it, and can’t *leave* it. Real moral cultures are non-optional, identity-shaping, and emotionally charged.  

  **Verbal Coverage in Debrief:**  
  - "In the game, you followed rules mechanically. But in life, these systems feel 'true.' Honor isn’t just strategy—it’s your identity. Dignity isn’t apathy—it’s conviction. Victimhood isn’t calculation—it’s lived pain. The game shows structural limits; real life adds existential weight."  
  - **Concession:** "Yes, this is an unfixable hole. We simulate mechanics to expose logic, not lived experience. That’s why we study sociology *and* philosophy."  

  ---

  ### **Why This Works**
  - **Failures Self-Explain:** Cross-table non-recognition and scoring penalties force students to see why systems "fail" when worlds collide.  
  - **No Ranking Possible:** Trade-offs in scoring (e.g., Circle’s challenges boost tokens but trigger penalties if ignored) make moral evaluation emergent.  
  - **Blind Spots Revealed:** Incidents like Card 2 (accidental bump) or Card 3 (anonymous note) are injuries in one system and non-events in others.  

  Run this as-is, and your students won’t just recite the taxonomy—they’ll feel its fractures.
