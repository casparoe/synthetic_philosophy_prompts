     - Dignity: Report to Arbiter. Arbiter may see it as a general comment and not an insult to you specifically, so might ignore.
     - Victimhood: Report as harm to the community. Council may validate because it affects your group.

  3. Incident: "You are assigned a task (e.g., solve a simple riddle) and you fail."
     - Honor: Not a slight, so no response needed. But if someone mocks you for failing, then it becomes a slight.
     - Dignity: You lose a token for failing the task. No slight, so no report.
