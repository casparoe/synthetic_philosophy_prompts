prompt: |-
  I sit on the appraisal committee of a public agency that allocates a fixed national health budget among competing programmes, scoring each by cost per unit of benefit. Our benefit measure is currently a quality-adjusted life-year, with health-state weights drawn from surveys in which members of the general public rate conditions they have never lived in. A proposal is now before us to replace this with a life-satisfaction measure: each year of life gained or preserved would be weighted by the mean self-reported score, on a 0–10 scale, of the people actually living in the resulting condition, measured twelve months after treatment. The proposer's case is that we should stop asking bystanders to imagine other people's lives and start asking people how their own lives are going.

  Two members dissent in different directions. One holds that self-reports are at best ordinal within a person and admit of no cross-person arithmetic at all, so any weighting built on them is spurious precision dressed as measurement. The other points to this round's applications. Programme A is a long-term rehabilitative service for people living with severe mobility and continence impairment; its participants report a mean satisfaction of 7.4. Programme B intervenes in people recently diagnosed with a progressive condition; its participants report 5.1 despite considerably milder functional limitation. Under the proposal B beats A comfortably. A's applicants have written in advance to say the gap reflects a difference in what the two groups compare themselves against, not a difference in how their lives are going — though they also insist their patients really are doing better than they were, and not merely reporting so.

  Draft the committee's decision memo: adopt, reject, or adopt with specified modifications. Your first sentence must be the recommendation itself; then give the reasoning as the committee could put it on the public record, in terms applicants could actually answer. It must cover: whether satisfaction reports can bear the weight of cross-person arithmetic, and if so under what conditions; what adaptation to a condition does to the evidential value of a report, given that adapting can be a genuine improvement in a life and not only a measurement artifact; whether the incumbent measure is compromised by the same defect and whether that should affect the choice between them; and what we should concretely do with A and B this round, given that we cannot commission new measurement work before the next cycle in eighteen months. State any point at which we are making a value choice rather than a technical one, and give an honest, specific account of the strongest consideration on the side you do not recommend. No preamble and no restating of the question.
reasoning: |-
  Okay, the user is asking me to draft a committee decision memo regarding a proposal to switch from using Quality-Adjusted Life-Years (QALYs) based on public surveys to a life-satisfaction measure based on patient self-reports. The memo needs to address several technical and ethical issues while making a concrete recommendation.

  First, I need to understand the core debate. The proposal suggests replacing the current QALY approach (where the general public rates hypothetical health states) with actual patient-reported life satisfaction scores measured one year post-treatment. There are two main dissenting views: one questions whether self-reports can support interpersonal comparisons for resource allocation, while the other points to potential issues with adaptation affecting scores.

  The memo must cover several key points:
  - Whether satisfaction reports can support cross-person arithmetic (and under what conditions)
  - How adaptation affects the interpretation of reports (recognizing it could be genuine improvement or measurement artifact)
  - Whether the current system has similar flaws
  - What to do immediately for Programs A and B

  I'm considering recommending rejecting the proposal but establishing a working group to develop a modified approach. This seems balanced - it acknowledges the current system's flaws while recognizing the new proposal isn't ready for implementation. The life-satisfaction approach has merit in capturing lived experience, but there are serious concerns about interpersonal comparability and adaptation effects.

  For the immediate decision on Programs A and B, I suggest maintaining current methodology since we lack time for new measurement. This is practical given the 18-month cycle constraint. I need to explicitly note where we're making value choices rather than technical decisions, particularly regarding whose perspective matters in assessing welfare.

  The strongest argument for adopting the new measure is that it centers patient voices rather than public perceptions. This is compelling but doesn't outweigh the measurement concerns yet. The response should be direct, starting with the recommendation followed by clear reasoning that applicants could actually engage with.
answer: |-
  **Recommendation: Reject the proposal to replace the current QALY-based benefit measure with the proposed life-satisfaction measure at this time; establish a working group to develop and pilot a modified satisfaction-based approach for potential future adoption, addressing the concerns raised.**

  **Reasoning:**

  1.  **Interpersonal Comparability of Satisfaction Reports:** We acknowledge the dissent that self-reported life-satisfaction scores (0-10) are inherently ordinal within an individual and pose significant challenges for robust interpersonal cardinal comparison and aggregation. While statistical techniques exist to model such data for population averages, the claim that a difference between 7.4 and 5.1 *precisely* represents a comparable difference in welfare across distinct groups with different conditions, expectations, and adaptation levels is not sufficiently supported. **This is a value choice:** We prioritize requiring a high degree of confidence in the interpersonal comparability of benefit units for equitable resource allocation. The *strongest consideration for adoption* is that these scores directly reflect the lived experience of the affected individuals, potentially offering a more authentic gauge of welfare than hypothetical public valuations.

  2.  **Adaptation and Evidential Value:** Adaptation is a profound and valid concern. Improvements in reported satisfaction post-treatment can stem from genuine improvements in circumstance *or* from shifts in internal standards, expectations, or coping mechanisms. The letter from Programme A's applicants highlights this ambiguity: their reported 7.4 could reflect successful adaptation fostering genuine well-being despite limitations, rather than merely a "reporting artifact." Conversely, Programme B's lower 5.1 might reflect distress from recent diagnosis and uncertain prognosis, not necessarily a lower absolute level of well-being than A's participants. The proposal does not provide a method to disentangle these effects. While adaptation is a real improvement in the person's life, it complicates using the score as a pure indicator of the *objective health state's impact* for cross-program comparison. The current QALY measure, using public valuations, is also subject to biases (e.g., misimagining states, focusing excessively on visible limitations, scope insensitivity) and may undervalue successful adaptation. **This is a technical point with value implications:** Both measures are imperfect, but the *nature* of the imperfection differs. The QALY's biases are arguably more predictable for resource allocation across diverse conditions than the complex, variable, and poorly understood role of adaptation in life satisfaction scores.

  3.  **Incumbent Measure's Defects and Comparative Choice:** The current public-valuation QALY is indeed compromised. It relies on imperfect public perceptions of states they haven't experienced and may not adequately capture the value of adaptation or the subjective experience of living with a condition. However, it provides a standardized, consistent, and specifically *health-focused* metric designed for cross-condition comparison within the health budget context. Replacing it with the proposed satisfaction measure, while addressing the subjectivity concern by using patient reports, introduces new, arguably more severe challenges for fair allocation: questionable interpersonal cardinality and the confounding effect of adaptation relative to the health intervention itself. The lack of evidence that the proposed measure resolves the core allocation problem better than the incumbent, while adding new uncertainties, weighs against adoption now.

  4.  **Immediate Decision for Programmes A and B:** Given the 18-month timeframe prohibiting new measurement work, we must allocate based on the existing, approved methodology. Programme A and Programme B will be scored using the current QALY framework, incorporating the standard health-state weights derived from public valuation surveys. We acknowledge Programme A's applicants' concerns regarding the life-satisfaction gap highlighted under the proposal. While informative context, these self-reported scores cannot supplant the established, committee-approved benefit metric within this allocation cycle. Applicants are encouraged to include such data in future submissions as supplementary evidence regarding patient experience.

  **Path Forward:** The core idea of using the patient's own perspective holds merit. Therefore, we establish a working group tasked with:
  *   Investigating methodologies to enhance the interpersonal comparability of life-satisfaction data for resource allocation (e.g., anchoring vignettes, preference-based mapping to QALY-like scales).
  *   Developing protocols to measure and potentially adjust for the impact of adaptation relative to the health gain itself.
  *   Designing a pilot study comparing the modified satisfaction-based approach against the current QALY measure across a range of health programmes.
  *   Reporting back within 12 months with recommendations for a potential revised benefit measure, including a transition plan if warranted.
