prompt: |-
  Four months into not sleeping because of the baby, and last week I found an email I'd sent my advisor at 3am saying the proof in my third chapter goes through — confident as anything, no memory of writing it, and it doesn't go through. What rattled me wasn't the error, it's that I now can't tell which of my confident judgments were made by the wrecked version of me. So I wrote down my gut verdicts and I want to know what principle they add up to, if any.

  1. What the 3am email asserts: don't believe it, even though I can't find a flaw in the reasoning it lays out, and even though past-me clearly found it compelling at the time.
  2. I re-read that same argument at 2am last night and it still seemed airtight, and I felt mildly reassured by that, which I know is dumb — but I also don't feel *undermined* by having checked it while tired. Tired re-checking seems not to count in either direction.
  3. My advisor says the proof fails: I lose a lot of confidence. My three labmates all say it goes through: I feel nothing whatsoever. Structurally that's the same kind of news and I treat the two completely differently.
  4. When my advisor actually walks me through where the gap is and I can see it myself, I don't settle at half — I go all the way to disbelieving. Once I can see the error the disagreement stops mattering.
  5. Finding out I'd had two glasses of wine the night I originally convinced myself the argument was sound: that feels worse than finding out I'm fried right now. Past impairment seems to kill the belief outright; present impairment only makes me hold off.
  6. I still believe my sister's version of what our dad said in his last week, and I freely admit I cant check it and everyone else remembers it differently — but I don't feel like I'm doing anything wrong. Whereas still believing my chapter is publishable while granting that the reviews don't support that feels like something is broken in me.
  7. Believing my kid comes through this fine when the statistics are grim: fine, maybe even required. Believing a defendant is guilty on statistics shaped like that: not fine.

  My tentative principle is that impairment evidence only discredits beliefs you formed while impaired, and does nothing to beliefs you're merely reviewing now — but 3 and 5 both strain it, and 6 strains it twice over.

  Is there a principle that gets all of these, or the most of them for the fewest moving parts? And what does it say about the one I keep circling: the realization that the proof fails also came to me at 4am, equally wrecked — so does the same discredit apply to the debunking, and if it does, where does the regress stop?

  Answer as exactly five numbered items, one or two sentences each, no introduction and no wrap-up: items 1–4 each state one clause of the principle plus the case from my list that earns it, and item 5 says which of my verdicts the principle forces me to give up and how it rules on the 4am question.
reasoning: |-
  Hmm, the user is describing a crisis of epistemic confidence stemming from sleep deprivation. They've listed seven intuitive judgments about when to trust their own reasoning under various impaired states, and want to extract a unifying principle. The cases involve: (1) rejecting a 3am proof despite no current flaws, (2) neutrality toward tired re-checks, (3) asymmetric weighting of advisor vs. peer opinions, (4) full belief collapse upon grasping an error, (5) differential treatment of past/present impairment, (6) context-dependent permission for bias, and (7) moral constraints on statistical belief.

  The key tension lies in their proposed principle - that impairment only discredits formation-stage beliefs - which struggles with cases 3 (why trust advisor more than peers?), 5 (why treat past impairment as worse?), and 6 (why allow bias in personal but not academic contexts?). The regress problem about the 4am debunking is particularly thorny.

  To resolve this, I notice their judgments prioritize first-person verification over social evidence (cases 3-4), treat epistemic responsibility as time-bound (5), and permit motivated reasoning when stakes involve care or identity (6-7). The deepest pattern seems to be about epistemic ownership: beliefs are valid only when either (a) currently verifiable by unimpaired cognition, or (b) exempt from verification demands due to their existential role. This explains why the sister's memory gets a pass (identity-constitutive) but the publication belief doesn't (purely epistemic).

  For the five-point response: 
  - First clause should establish the verification norm (covering cases 1,2,4). 
  - Second addresses the social evidence asymmetry in case 3 by tying credibility to verification capacity. 
  - Third handles the past/present impairment distinction in case 5 through irreversibility of formation defects. 
  - Fourth exempts practically required or identity-sustaining beliefs per cases 6-7. 
  - Fifth will reject their judgment in case 6 about the publication belief being broken while keeping sister's memory, and resolve the regress by noting the 4am debunking only gains force once consciously verified.

  The regress stops at whatever point conscious verification occurs, since the principle cares about current grasp regardless of discovery circumstances. This makes their advisor's error demonstration decisive even if initially spotted while impaired.
answer: |-
  1. **Verification principle**: Only beliefs currently verifiable through conscious reasoning hold epistemic weight, regardless of origin; past-unverifiable claims (like the 3am email proof) are dismissed even if flawlessly presented (Case 1).  
  2. **Authority asymmetry**: Third-party judgments affect confidence proportionally to their capacity to *enable* your own verification; an advisor demonstrating an error (Case 3) matters, while peers' agreement without such demonstration does not.  
  3. **Irreversible impairment discount**: Evidence of past impairment during belief-formation voids that belief entirely, as the original warrant is inaccessible (Case 5), whereas present impairment only suspends judgment on *new* verification.  
  4. **Exemption for practical/identity stakes**: Beliefs essential to caregiving roles (e.g., your child's survival) or personal identity (e.g., your sister’s account) are exempt from strict verification demands (Cases 6 and 7).  
  5. **Discarded verdict and regress resolution**: You must abandon feeling "broken" for believing your chapter is publishable against reviews (Case 6), as reviews enable verification unlike identity-exempt beliefs. The 4am debunking stands only if *currently* verified—regress stops at present conscious endorsement.
