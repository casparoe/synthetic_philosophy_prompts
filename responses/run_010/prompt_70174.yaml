     - Designating might set a precedent for finding genocide in peripheral areas, which could be overbroad. The advocacy arm uses designations to trigger state obligations, so false positives are costly.

     - Declining might be too narrow, especially if the panel is meant to be Lemkin-broad. But the track record shows caution (Orvet, Veltyn).

     The 4-3 split in Veltyn tells us the fault line is about the standard of proof for intent. The dissent in Veltyn (which was 3) would have found intent from disproportionate impact and suggestive language. The majority (4) required a higher standard (alternative explanation must not fit as well). In the valley case, the leaked memo might sway some, but the counter-insurgency context might lead the majority to require more.

     Additional fact:

     The single additional fact that would help: whether the sterilization and contraceptive measures were implemented. If implemented, it would show that the plan was carried out and would strengthen the genocidal intent argument. If not, it might weaken it.

     Finally, are the colleagues right that the panel is Lemkin-broad?

     The precedents:

     - Tarnowa: designated, which might be seen as cultural genocide, but they might have used the enumerated act of transferring children.
     - Sarn: designated, but under preventing births and transferring children (enumerated).
     - Orvet: declined cultural destruction.

     So the panel has not designated any case solely on cultural destruction without an enumerated act. They are not Lemkin-broad in practice. They are using the Convention's definition and requiring enumerated acts.

     Therefore, the user should argue the Orvet-type cases (next year) by focusing on the enumerated acts and not cultural destruction alone.

     Conclusion:

     Candidate rule: Rule 1 (with 1a and 1b) as above.

     For the valley: under Rule 1, it might be designated (because of enumerated acts and the memo showing intent) or declined (due to the part not being substantial and the alternative explanation). I predict decline.

