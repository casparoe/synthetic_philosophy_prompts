  ### Analysis of the Panel's Precedents and the Verdan Valley Case

  #### Candidate Rules Consistent with All Six Precedents
  The panel's decisions reveal a structured framework that balances the 1948 Genocide Convention's core elements with limited, express departures. The following candidate rules are jointly consistent with all six precedents. Each rule explicitly notes where it relies on specific features of a precedent to avoid contradiction.

  1. **Rule A: Protected Group + Enumerated or Expressly Expanded Acts + Specific Intent + Substantial "Part"**  
     - **Protected Group**: Only national, ethnic, racial, or religious groups qualify (from Marchfeld, which declined due to lack of protected identity).  
     - **Acts**: Must be one or more Convention-enumerated acts (killing, serious harm, conditions of life, prevention of births, forcible child transfer) OR a non-enumerated act expressly identified as genocidal under an expanded element (e.g., cultural destruction), per the charter's flexibility.  
     - **Intent**: Specific intent to destroy the group in whole or in part must be established, with heightened scrutiny for ambiguity (from Veltyn, where class-based intent was an equally plausible alternative).  
     - **Substantial Part**: The targeted "part" must be substantial—numerically significant or critical to the group's survival (from Sarn, designated because the province was the demographic/religious center; Orvet declined partly because the valley was not central).  
     - **Survival Reliance**:  
       - Tarnowa survives because the forcible child transfer is an enumerated act (not solely cultural destruction), and the group's demographic persistence does not negate intent.  
       - Orvet survives because no enumerated act was present (cultural destruction was treated as intent evidence only), and the panel did not expressly expand the acts.  

  2. **Rule B: Strict Causality for Physical Destruction**  
     - **Physical Destruction Focus**: Conditions of life, prevention of births, or cultural measures must be causally linked to physical destruction (not just cultural erasure).  
     - **Intent Threshold**: Specific intent must target physical destruction; cultural/political destruction alone is insufficient without this link.  
     - **Expansion Limitation**: Express departures (e.g., cultural acts) are permitted only if they directly enable physical destruction.  
     - **Survival Reliance**:  
       - Tarnowa survives because high mortality (though unintended) and child transfer created conditions that could lead to physical destruction over time.  
       - Orvet survives because cultural destruction and expulsion lacked a proven causal link to physical destruction (group survived and returned).  
       - Sarn survives because sterilization and child separation directly targeted physical/demographic destruction.  

  3. **Rule C: Intent-Driven Disproportionality**  
     - **Disproportionality as Intent Proxy**: Disproportionate impact on a protected group can indicate intent, but only if no non-genocidal explanation fits equally well (from Veltyn, where class-based intent was as plausible as group-based).  
     - **Acts Expansion**: Non-enumerated acts (e.g., cultural destruction) may be expressly used, but only if paired with disproportionate impact and clear intent.  
     - **Part Substantiality**: The "part" must be substantial, with non-substantial parts (e.g., peripheral areas) requiring stronger evidence of intent.  
     - **Survival Reliance**:  
       - Marchfeld survives because no protected group existed to show disproportionality.  
       - Orvet survives because the impact (expulsion) was not disproportionate in a genocidal context (group reconstituted), and no express expansion was invoked.  
       - Kessler survives because disproportionate impact (expulsion/killing of majority population) and statements proved intent.  

  #### Application to the Verdan Valley Case
  - **Rule A**:  
    - **Designation?** Leans **no**.  
      - *Protected group*: Yes (religious minority).  
      - *Acts*: Conditions of life (subsistence-denying rations) and planned prevention of births (sterilization annex) are enumerated; conscription (9% mortality) could be serious harm.  
      - *Intent*: Leaked memo shows intent to reduce population ("manageable residual"), but counter-insurgency justification is equally plausible (independent insurgency confirmed).  
      - *Substantial part*: Valley is peripheral (no holy sites, institutions, or demographic significance; only 4.5% of group). Precedents (Sarn, Kessler) require centrality.  
    - **Verdict**: Decline—intent ambiguous and part not substantial.  

  - **Rule B**:  
    - **Designation?** Leans **no**.  
      - *Physical destruction focus*: Conditions of life (14-month subsistence denial) and conscription mortality could be calculated to cause physical destruction, but most residents resettled safely, weakening causality. Sterilization plan is preventive but not implemented.  
      - *Intent*: Counter-insurgency explains restrictions; memo's "manageable residual" could mean security control, not physical destruction.  
    - **Verdict**: Decline—physical destruction not causally established; counter-insurgency fits acts.  

  - **Rule C**:  
    - **Designation?** **Toss-up** (leaning no).  
      - *Disproportionality*: Measures target valley residents disproportionately, but insurgency justification fits equally well (per Veltyn).  
      - *Intent*: Memo annex (sterilization) suggests group-specific harm, but national population growth undermines disproportionality impact.  
      - *Part substantiality*: Peripheral location weakens case (cf. Sarn).  
    - **Verdict**: Decline—alternative explanation (counter-insurgency) fits evidence.  

  **Where Rules Part Company**:  
  - **Substantiality of Part**: Rule A strictly requires centrality (e.g., Sarn); Rules B/C are more flexible if physical destruction or disproportionality is clear.  
  - **Treatment of Intent Ambiguity**: Rule C is strictest (Veltyn standard); Rule A/B allow more inference from acts.  
  - **Expanded Acts**: Rule A allows express cultural destruction; B/C require physical linkage. In Valley, no cultural acts are alleged, so expansion is irrelevant.  

  #### Prediction for Verdan Valley Vote and Reasoning
  - **Predicted Vote**: **5–2 to decline designation**.  
    - Majority: 5 votes (including user's description of cautious colleagues).  
    - Minority: 2 votes (likely dissenters from Tarnowa/Sarn, favoring broader interpretation).  
  - **Published Opinion Reasoning**:  
    - **Core Logic**: No designation due to (a) unproven specific intent (counter-insurgency fits equally well per Veltyn), and (b) valley is not a substantial part of the group (peripheral, non-central, small population share). Acts (conditions of life, conscription) are severe but explained by security context. Sterilization plan is noted but unimplemented and not decisive.  
    - **Key Distinction from Precedents**:  
      - **Sarn (distinguished)**: Majority will stress Sarn's "demographic/religious center" status vs. valley's peripherality. Move: Substantiality requires qualitative importance (holy sites, institutions) or numerical dominance, absent here.  
      - **Veltyn (aligned)**: Applied directly—alternative intent explanation (counter-insurgency) fits evidence, so intent not established.  
      - **Orvet (aligned)**: Like Orvet, cultural/historical significance is irrelevant without substantial part or enumerated acts.  
    - **Express Expansion?**: Unlikely; opinion will avoid invoking cultural destruction, focusing on Convention acts.  

  - **Closest Analog**: **Veltyn famine (4–3 decline)**.  
    - **Similarities**:  
      - Disproportionate impact on protected group (here valley residents; there peasants).  
      - Alternative explanation fits (counter-insurgency here; class-based there).  
      - Group survival nationally (growth here; birth rate recovery there).  
      - Documented intent ambiguity (leaked memo vs. quota framing).  
    - **Disanalogies**:  
      - Veltyn had mass deaths (800,000) vs. Valley's lower conscription mortality and resettlement.  
      - Valley has direct genocidal language in memo ("manageable residual"); Veltyn had only "suggestive remarks."  
      - Valley's sterilization plan is an enumerated act (prevention of births); Veltyn's quotas were not inherently genocidal.  

  #### Underdetermination and Principles  
  - **Precedents Underdetermine Valley**: Rules A–C all lean decline but for different reasons. No precedent perfectly matches (Sarn has centrality; Veltyn lacks Valley's enumerated acts).  
  - **Principle if Designated**: "Peripheral targeting + security context can still constitute genocide if enumerated acts and group-destructive intent are clear." This could overextend designations to ambiguous conflicts, increasing false positives (costly for advocacy).  
  - **Principle if Declined**: "Substantiality of part and unambiguous intent are necessary in security contexts, with equal weight to non-genocidal explanations." This risks false negatives in "slow burn" genocides but aligns with panel's caution (Orvet, Veltyn).  
  - **Consistency Across Docket**: Decline principle is sustainable—it reinforces Veltyn's intent standard and Sarn's substantiality, avoiding overreach in future cases (e.g., counter-insurgency with civilian impact). Designation principle would require redesignating Orvet-like cases, creating inconsistency.  
  - **4–3 Split in Veltyn Reveals Fault Line**:  
    - **Majority (4)**: Emphasizes high intent threshold (no designation if alternative explanation fits). Prioritizes false positives.  
    - **Dissent (3)**: Favors inferring intent from impact and language (would designate in disproportionate-impact cases). Prioritizes false negatives.  
    - **Valley Fault Line**: Same divide. Majority will hold that counter-insurgency explains acts; dissent will cite memo as smoking-gun intent.  

  #### Single Additional Fact  
  - **Fact to Gather**: **Extent of sterilization/contraceptive measure implementation**.  
    - **Why Discriminatory**:  
      - If implemented, it strengthens Rule A/B (enumerated act) and Rule C (disproportionality/intent), making designation more likely under all rules.  
      - If not implemented, it weakens intent (memo as aspirational) and physical destruction linkage, solidifying decline.  
    - **Plausibility**: Field verification via NGOs or refugee interviews is feasible.  

  #### Are the Panel Lemkin-Broad?  
  **No.** The precedents show a **narrower, structured approach**:  
  - **Cultural Acts**: Only designated when tied to enumerated acts (Tarnowa’s child transfer; Sarn’s prevention of births). Orvet declined cultural destruction alone.  
  - **No Express Expansion**: In all designations (Kessler, Tarnowa, Sarn), the panel used Convention-enumerated acts without invoking Lemkin’s cultural destruction. The charter’s expansion option remains theoretical.  
  - **Physical Focus**: Rules emphasize physical/demographic destruction (e.g., Sarn’s "reproductive capacity"; Orvet’s "physical destruction" requirement).  
  - **Implication for Orvet-Type Cases**: Argue against Lemkin-broad claims. Stress that cultural destruction requires either an enumerated act (e.g., child transfer in Tarnowa) or express expansion (which panel has avoided). Next year’s cases should be evaluated under the Convention floor, not Lemkin’s ceiling.  

  **Conclusion**: The panel operates under a structured, intent-focused framework that hews closely to the Convention, with limited expansion. For Verdan Valley, decline is likely (5–2) due to substantiality and intent ambiguity. The key additional fact is sterilization implementation. Your colleagues are incorrect about Lemkin-broad practice; this should shape your argument in upcoming cases.
