prompt: |-
  I'm prepping a talk that stress-tests Strawson's reactive-attitudes framework, and the move I want to make is to feed his own taxonomy a case it was never built for. Help me figure out what he'd say.

  Here's the track record I've been working from, my own summary of how he rules on the standard cases in the essay (paraphrased, don't try to match his wording):

  - The guy who hurt you but didn't mean to — accident, or he was deceived about the relevant facts. Resentment is out of place, but he hasn't left the moral community at all; he's still a normal participant and still acknowledges the demand for reasonable goodwill.
  - Coercion, "I couldn't help it in that situation." Same bucket as above.
  - The very young child, the severely psychotic patient, the person under extraordinary strain. Different bucket: here we don't just excuse the act, we stop regarding him as a normally apt target of the reactive attitudes at all, and we slide toward treating him as something to be handled, cured, trained, managed.
  - Someone who does wrong and feels genuine guilt and makes amends. Guilt and remorse are appropriate in him even though resentment in me would be misplaced in the accident case.
  - Determinism being true, if it is, does not license the objective attitude across the board — we couldn't take it up toward everyone even if we chose to, and the choice isn't the kind of thing a metaphysical thesis can settle.
  - The colleague I've deliberately decided to stop engaging with and just manage. That's the objective attitude, adopted locally and on purpose, and Strawson seems fine with it.

  Now the new case. Call him Ray. Ray is a perfectly ordinary, competent adult — not a child, not psychotic, not under unusual strain, and he'd fail none of the tests for normal agency. At work he is flatly unresponsive to moral appeal: he has no indignation on anyone's behalf, feels nothing like guilt when he exploits a coworker, and would keep doing it if the incentives changed. At home it's completely different. He has real, vivid resentment when his daughter is treated badly by someone else, he's genuinely and specifically grateful to his wife, he feels shame and apologizes and does the work of repair. And for distant strangers he reports nothing at all — no more pull than for characters in a novel.

  So: what's Strawson's verdict on Ray? Specifically —

  1. Is Ray a proper target of resentment from the coworker he used? From his wife? From his daughter? From someone in another country he's never met and who's never met him? I want the answers separately, because I suspect they won't line up.
  2. What rule is he actually running that generates his verdicts on the cases above? I want at least three or four candidate rules that all fit that track record, then the divergence: show me where they come apart on Ray. Obvious candidates I can think of are something like "capacity for reactive attitudes in general" versus "capacity indexed to the relationship in question," plus something keyed to whether the person recognizes the demand for goodwill at all, plus something keyed to abnormality as Strawson uses it. There are probably others I'm missing — tell me about them.
  3. Give me your best guess, with reasons, and be honest about which of the candidate rules is actually supported by what he says versus which one I'd be smuggling in to make the framework look tidier than it is.
  4. Separate two things I've been conflating: whether resentment toward Ray is *appropriate*, versus whether it's *non-optional* for us. Does Strawson's own insistence that we can't just switch off the reactive attitudes change the answer here, and does it change it differently for the coworker than for the stranger abroad?
  5. Tell me one further case — a variant on Ray, small change — that would discriminate between your top two candidate rules better than anything in my list does.

  No citations and no bibliography, I'll add those myself; I just need the reasoning. Don't strain to make Strawson come out consistent, and if his framework genuinely runs out of road on this case, say so and say exactly where. Write it in American English, and aim for maybe 1200 words — I'd rather have a tight argument than a survey.
reasoning: |-
  Okay, the user is preparing a talk that challenges Strawson's reactive attitudes framework by introducing a character named Ray. Ray seems to have compartmentalized moral responses: he's morally responsive at home but completely unresponsive at work and indifferent to strangers. The user wants to know how Strawson would categorize Ray across different relationships and what rules Strawson might apply.

  First, I need to recall Strawson's framework. He distinguishes between reactive attitudes (like resentment, gratitude) and the objective attitude (treating someone as an object to be managed). The standard cases involve excuses (accident, coercion) or exemptions (children, mentally ill). The key is whether the person is a participant in the moral community, which hinges on their capacity for reciprocal reactive attitudes.

  Now, applying this to Ray. At home, Ray displays appropriate reactive attitudes—resentment when his daughter is wronged, gratitude towards his wife. This suggests he's capable of being a moral participant in those relationships. At work, however, he shows no guilt or indignation, acting purely based on incentives. Towards strangers, he's indifferent. So, is Ray exempt or just excused? 

  Strawson's exemption category is for those who aren't capable at all (like children or the psychotic). But Ray is capable in some contexts. So he doesn't fit the exemption. That means resentment from coworkers might still be appropriate because he's capable in general, even if not towards them. But Strawson emphasizes reciprocity within relationships. If Ray doesn't reciprocate in a specific relationship, does that mean coworkers shouldn't hold resentment? That's tricky.

  Looking at Strawson's examples, he mentions adopting the objective attitude locally, like with a difficult colleague. But in that case, it's a choice, not because the colleague lacks capacity. For Ray, his lack of response at work is inherent. So maybe the coworker could appropriately resent Ray, but Strawson might say the objective attitude is also permissible here. 

  For the wife and daughter, clearly resentment is appropriate because Ray participates reciprocally. Strangers are different. Ray's indifference to them might make resentment from a stranger inappropriate, similar to how we don't resent someone in another country. But Strawson might argue that the general capacity is what matters, so even strangers could rightly resent Ray. However, that seems inconsistent with his emphasis on community participation.

  The user wants candidate rules. Rule 1: General Capacity. If someone has the capacity for reactive attitudes anywhere, they're a participant everywhere. Rule 2: Relationship-Specific Capacity. Participation depends on mutual recognition in each relationship. Rule 3: Recognition of General Demand. If the person acknowledges the demand for goodwill at all, they're a participant. Rule 4: Abnormality. If their incapacity is abnormal, they're exempt.

  Ray exposes tensions between these rules. Rule 1 says coworkers and strangers can resent Ray. Rule 2 says only family can. Rule 3 is ambiguous—does Ray recognize the demand generally? He does at home, but not elsewhere. Rule 4 might not apply since Ray isn't abnormal in a clinical sense. 

  Strawson's text seems to support Rule 3, focusing on whether the person recognizes the demand for goodwill. But Ray recognizes it at home, so maybe he's a participant everywhere. However, that feels counterintuitive for the coworker. Alternatively, Rule 2 might be more plausible, but Strawson doesn't explicitly say that. 

  On appropriateness vs. non-optionality: Strawson argues reactive attitudes are natural, but we can choose the objective attitude in specific cases. For the coworker, resentment is appropriate but they might adopt the objective attitude for practicality. For strangers, resentment might not even arise because there's no relationship, making it optional. 

  A variant case: Ray is responsive to strangers but not family. This would test if Rule 2 (relationship-specific) holds. If Strawson still considers him a participant with family, that weakens Rule 2. If not, Rule 1 is challenged. This helps differentiate the rules.
answer: |-
  Here’s a strict stress-test of Strawson’s framework using your Ray case, breaking down his likely verdicts, candidate rules, tensions, and implications:

  ---

  ### 1. **Strawson’s Verdicts on Ray Across Relationships**  
  - **Coworker:** Ray is **not** a proper target of resentment.  
    *Why?* Ray’s total lack of reciprocal reactive attitudes *in that relationship* (no guilt for exploiting coworkers, no indignation at their mistreatment) means he does not participate in the mutual demand for goodwill *with them*. He’s functionally a "managed" entity in this sphere, akin to Strawson’s "deliberately disengaged colleague" case.  
  - **Wife/Daughter:** Ray **is** a proper target of resentment.  
    *Why?* Here, he displays full reciprocity: resentment when his daughter is wronged, gratitude to his wife, shame when he fails. He’s a full participant in these relationships, satisfying Strawson’s conditions for moral community membership.  
  - **Stranger Abroad:** Ray is **not** a proper target of resentment.  
    *Why?* Strawson ties reactive attitudes to *actual interpersonal relationships*. Ray’s indifference to strangers mirrors our typical non-reactivity toward distant others (e.g., we don’t resent a thief in a foreign news story). Resentment presupposes an expectation of mutual regard within a shared community, which is absent here.

  ---

  ### 2. **Candidate Rules & Where Ray Breaks Them**  
  All rules fit Strawson’s standard cases but diverge sharply on Ray:

  - **Rule 1: General Capacity Criterion**  
    *Rule:* Someone is a participant if they possess *general* capacity for reactive attitudes *anywhere* (e.g., a usually kind person under strain is still "in").  
    *Verdict on Ray:* **Participant everywhere** (capacity at home suffices).  
    *Problem:* Contradicts the coworker’s experience—Ray shows *zero* moral recognition at work.  

  - **Rule 2: Relationship-Specific Capacity Criterion**  
    *Rule:* Participation depends on mutual recognition *within each relationship*.  
    *Verdict on Ray:* **Participant at home, exempt at work/with strangers**.  
    *Problem:* Strawson never explicitly segments personhood by relationship. His exemptions (children, psychotic) are global.  

  - **Rule 3: Recognition of the General Demand**  
    *Rule:* Someone is in if they acknowledge *any* demand for goodwill (e.g., the coerced person still "gets it").  
    *Verdict on Ray:* **Participant everywhere** (he recognizes demands at home).  
    *Problem:* Ray explicitly rejects the demand’s universality—he sees no claim from coworkers/strangers.  

  - **Rule 4: Abnormality Criterion**  
    *Rule:* Exemption requires *incapacity* due to abnormality (e.g., psychosis).  
    *Verdict on Ray:* **Participant everywhere** (he’s clinically normal).  
    *Problem:* Ignores Ray’s localized moral blindness. Strawson’s "abnormality" is vague—is compartmentalization abnormal?  

  **Divergence:** Rules 1/3/4 demand global inclusion; Rule 2 permits fragmentation. Ray forces a choice: *either* moral status is relationship-bound (un-Strawsonian) *or* Ray’s work-self is inexplicably exempt despite general capacity.

  ---

  ### 3. **Best Guess & Honest Assessment**  
  - **Strawson’s Likely Verdict:** Ray is a **participant globally**, but resentment is **inappropriate in contexts where he opts out** (work/strangers).  
    *Reasons:*  
    - Strawson treats exemptions as holistic ("*types* of agent," e.g., children). Ray isn’t a "type"; he’s selectively disengaged.  
    - He endorses local objectivity (e.g., managing a colleague), implying *relationships* can be suspended without global exemption.  
    - Ray’s home-responsiveness proves general capacity, so coworkers *could* resent him—but Strawson would likely say they *shouldn’t*, as Ray rejects reciprocity with them.  
  - **What’s Supported vs. Smuggled:**  
    - **Supported:** Rule 3 (recognition of *any* demand) aligns best with Strawson’s focus on *general* capacity.  
    - **Smuggled:** Rule 2 (relationship-specificity) makes Ray tidier but lacks textual backing. Strawson never discusses moral partiality this way.  

  **Verdict:** Strawson’s framework **runs out of road**. Ray exposes an unaddressed tension: if moral community depends on *actual reciprocity*, not just capacity, then participation *is* relational—but Strawson assumes capacity implies universal eligibility.

  ---

  ### 4. **Appropriateness vs. Non-Optionality**  
  - **Appropriateness:** Resentment toward Ray is only fitting where he participates reciprocally (home). At work, it’s *inappropriate* (he opts out); with strangers, it’s *unintelligible* (no relationship exists).  
  - **Non-Optionality:**  
    - **Coworker:** They *could* feel resentment (Ray *can* reciprocate generally) but *should* adopt objectivity (he *won’t* reciprocate locally). Strawson’s "can’t switch off" applies to *general* attitudes but not specific relationships—we routinely withhold resentment where reciprocity is hopeless.  
    - **Stranger:** Resentment *is* optional. No relationship means no natural reactive impulse—like feeling grateful to a random passerby.  
    **Key Insight:** Non-optionality binds us to *humanity in general*, but appropriateness is context-bound. For the coworker, objectivity is *pragmatic*; for the stranger, it’s *default*.

  ---

  ### 5. **Discriminating Variant Case**  
  **Ray 2.0:** Identical to Ray, but at home he *only* feels reactive attitudes *for his daughter*—not his wife. He exploits his wife coldly but rages if his daughter is slighted.  

  - **Test Between Rules:**  
    - **Rule 2 (Relationship-Specific):** Wife appropriately resents Ray (he’s exempt *only* toward her).  
    - **Rule 3 (General Demand):** Wife *cannot* appropriately resent Ray (he recognizes *some* demand, just not toward her).  
  - **Why It Discriminates:** Rule 2 permits micro-exemptions within relationships; Rule 3 demands all-or-nothing inclusion based on general capacity. Strawson’s silence on this suggests his framework can’t handle moral fragmentation.

  ---

  **Conclusion:** Strawson’s system **cracks under Ray’s weight**. His taxonomy assumes moral capacity is unified—either you’re "in" the community (with excuses for lapses) or "out" (exempt). Ray’s compartmentalization proves moral participation can be *relationship-contingent*, a possibility Strawson ignores. Your talk should spotlight this: reactive attitudes presuppose reciprocity, but nothing guarantees reciprocity is universal. The framework needs either radical relationship-specificity (undermining its generality) or ad hoc exemptions (undermining its coherence).
