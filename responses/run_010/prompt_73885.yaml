prompt: |-
  My sister has been on the editorial board of a small human rights org for six years and she's basically the one who decides whether their annual report gets to use the word genocide. Her track record, as best I can reconstruct it:

  - Rwanda in the 90s: yes, no argument.
  - Srebrenica: yes — even though it was one town and the victims were mostly men and boys who were separated out and shot, while the rest of the same war never got that label.
  - Cambodia under the Khmer Rouge: no, for the roughly quarter of the country that died, on the grounds that the victims were mostly Cambodians and the motive was political. But yes, separately, for the Cham and the Vietnamese killed in those same years.
  - A decades-long program of taking indigenous children and boarding them out with majority-culture families: yes, even though almost nobody was killed and the government swore it was all for the kids' benefit.
  - A place where the minority language is banned in schools and the old shrines are getting bulldozed: no. She said the people are still there in their own villages, marrying each other and farming their land, so its cultural destruction, not genocide.
  - A city starved out under siege: yes, because the starvation was aimed at the population and not at the fighters.

  Now a new file landed and the board has been deadlocked 3-3 for weeks. A country is building a dam and a big mining operation on the ancestral land of a herding people of maybe 40,000. Nobody is being killed or rounded up. But the wells and the winter pasture go under water, the fish they depend on are gone, and the government won't let them resettle together — the compensation is individual plots scattered across three provinces, and the schools out there teach only in the national language. Demographers the board hired say that within two generations there won't be a distinct community left to speak of. Every state document is about development, jobs, and relocation packages; nobody in the government has ever said a word about the group as a group.

  Which way should they vote if they want to be consistent with their own past calls, and which of the old cases is the closest analog? I'd also like you to lay out the candidate rules her precedents are compatible with — strict treaty definition, or tracking whether a group can go on existing as a group, or something else — and say what each rule predicts about the dam case, since I suspect they don't all point the same direction. And if the precedents genuinely don't settle it, tell me what principle the board would be committing to by voting each way, plus what one extra detail about any of the old cases would have told us which rule she's really running.
reasoning: |-
  Okay, the user's sister is part of an editorial board for a human rights organization that decides whether to use the term "genocide" in their annual reports. The user provided several past cases where she voted yes or no, and now there's a deadlock on a new case involving a dam and mining project affecting a herding community. The user wants to know how to vote consistently based on precedent, what underlying rules the precedents suggest, and what principles are at stake.

  First, I need to analyze each past case to identify patterns. Starting with Rwanda: unanimous yes, which aligns with the UN Genocide Convention—clear intent to destroy a group. Srebrenica: yes, despite being localized. Here, the targeting of men and boys was seen as destroying the group's future, which fits the convention's "in part" clause. Cambodia under the Khmer Rouge: no for Cambodians but yes for Cham and Vietnamese. The distinction here is based on the victims' groups; political killings vs. ethnic targeting. The forced assimilation of indigenous children: yes, even without killings. This suggests that preventing births or transferring children to another group is considered genocide under Article II(e). The banned language and bulldozed shrines: no, because the group still exists physically. So cultural destruction alone isn't genocide. The siege: yes, as starvation targeted the population, not just combatants, indicating intent to destroy.

  Now, the new case: a dam/mining project displaces a herding group, leading to cultural disintegration. No killings, forced transfer, or explicit intent. Compensation is individual, not group-based. The key point is the outcome—demographers predict the group's disappearance in two generations.

  Looking for the closest analog. The forced assimilation case (indigenous children) seems similar because both involve destruction of group identity without mass killings. However, in that case, children were forcibly transferred, which is a specific act under the convention. Here, the mechanism is environmental destruction and forced dispersal. The cultural destruction case (language/shrines) was a no, but here the group's physical existence is threatened by displacement. The siege case involved direct targeting, whereas here the government's intent is framed as development.

  The precedents suggest two possible rules: (1) strict treaty definition requiring intent to destroy and specific acts, or (2) outcome-focused, considering group survival. The treaty definition might not fit here because there's no evidence of intent. The outcome-focused approach, based on the indigenous children case, might lean towards yes, but that case had explicit forced transfers. The demographers' prediction shows the group will cease to exist, similar to the preventing births aspect.

  The user might be concerned about consistency versus legal precision. The sister's board seems to stretch the definition in some cases (like Srebrenica as partial destruction) but not others (cultural only). The new case sits in a gray area. Voting yes would commit to an outcome-based interpretation, potentially expanding genocide to include environmental destruction leading to group disappearance. Voting no maintains a stricter intent-based approach.

  The missing detail could be the government's awareness. If in the indigenous children case, the government knew it would destroy the group, that supports intent. Here, if the government ignores warnings about the group's demise, it might imply constructive intent. Without that, no might be consistent with the cultural destruction case. So the tiebreaker could be evidence of the government's knowledge of the consequences.
answer: |-
  Based on your sister's precedents, her board prioritizes **group survival and the specific mechanisms of destruction over strict body counts or direct killings**. Consistency points toward **voting YES (genocide)** for the dam/mining case, with the **forced assimilation of indigenous children** being the closest analog. Here's the breakdown:

  ### Key Precedents & Their Implications
  1.  **Rwanda (YES):** Sets the baseline - classic genocide meeting the strict UN definition (intent to destroy, killings).
  2.  **Srebrenica (YES):** Crucial precedent. Shows the board:
      *   Applies the "in part" clause of the Genocide Convention rigorously (targeting a *part* of the group with the *intent* to destroy it can be genocide).
      *   Recognizes destruction of the group's *future* (killing men/boys) as genocidal, even if geographically limited.
  3.  **Cambodia (Mixed):** Establishes distinctions:
      *   **Khmer (NO):** Political/ideological mass killings targeting a group defined by politics/nationality *within the same ethnicity* = Not genocide.
      *   **Cham/Vietnamese (YES):** Mass killings targeting groups defined by *ethnicity/religion* = Genocide.
      *   **Rule:** Motive *and* the nature of the targeted group matter. "Destroying" a group requires targeting its *inherent identity* (ethnic, religious), not just suppressing political opposition.
  4.  **Forced Assimilation of Indigenous Children (YES):** **The Key Analog.**
      *   **Mechanism:** Forcibly transferring children to another group (Art. II(e) of Genocide Convention).
      *   **Intent:** Government claimed "benefit," but the *effect* was deliberate group destruction.
      *   **Outcome:** Destruction of group identity/continuity *without* mass killings. The board explicitly recognized this non-lethal method as genocidal.
  5.  **Cultural Destruction Only (NO):** Establishes a limit. Suppressing language/culture, *while the group remains physically intact and biologically continuous* in its territory = Not genocide (though severe cultural rights violation). Physical group survival is key.
  6.  **Siege/Starvation (YES):** Reinforces that methods beyond direct killing (starvation - Art. II(c)) count *if* the *intent* is to destroy the group. Intent is inferred from targeting the civilian population.

  ### Candidate Rules from Precedents
  Your sister's board isn't using *one* single rule, but a hybrid approach prioritizing the Genocide Convention's core elements while applying them contextually to group survival. Two primary candidate rules emerge:

  1.  **"Strict Treaty + Group Survival Focus":**
      *   Requires acts listed in the Genocide Convention (Art. II: Killing, SIHB, conditions of life, preventing births, transferring children).
      *   Requires intent to destroy, *in whole or in part*, a protected group (national, ethnic, racial, religious).
      *   **Focus:** The *mechanism* of destruction must be one of the listed acts, *and* the act must demonstrably threaten the group's *continued existence as a distinct entity*.
      *   **Dam Case Prediction:** **YES.** The forced dispersal (preventing group continuity) and destruction of life-sustaining conditions (flooding pasture/wells) map onto Art. II(c) "Deliberately inflicting conditions of life calculated to bring about its physical destruction in whole or in part" and potentially Art. II(e) "Forcibly transferring children" (if children are forced into assimilationist schools/lost community). The demographers' prediction shows the outcome aligns with group destruction.

  2.  **"Irreversible Group Destruction (Outcome Focused)":**
      *   Focuses on whether the state actions, regardless of *explicit* motive or *exact* mechanism, are predictably leading to the *irreversible disappearance of the group as a distinct entity*.
      *   **Precedent Support:** Srebrenica (destroying future), Forced Assimilation (non-lethal destruction), Cambodia distinctions (targeting identity groups). The Cultural Destruction case (NO) is the counterpoint where survival persists.
      *   **Dam Case Prediction:** **YES.** The demographers' conclusion that the distinct community will disappear within two generations due to state actions (dispersal, resource destruction, forced assimilation via schools) directly points to irreversible group destruction. The government's framing ("development") is irrelevant to the predictable outcome.

  ### Analysis of the Dam Case & Consistency

  *   **Closest Analog:** **Forced Assimilation of Indigenous Children.**
      *   **Similarities:** No mass killings. Government uses benign language ("benefit," "development"). Core mechanism is forced separation/dispersal and cultural assimilation leading to group dissolution. Outcome is the disappearance of the distinct group identity.
      *   **Difference:** The assimilation case involved *direct* transfer of *children* (Art. II(e)). The dam case uses *indirect* methods (destroying life-sustaining environment, forced individual relocation, assimilationist education) leading to the *same outcome*. Srebrenica shows the board accepts indirect methods (killing men to destroy the group's future). The Siege case shows "conditions of life" counts.

  *   **Why YES is Consistent:**
      1.  **Mechanism:** Destroying wells/pasture = "Deliberately inflicting conditions of life calculated to bring about physical destruction" (Art. II(c)). Forced individual dispersal preventing group reconstitution = Functionally analogous to "Forcibly transferring children" (Art. II(e)) in its *effect* on group continuity.
      2.  **Intent:** The government's actions, *despite the "development" framing*, show deliberate disregard for the group's survival. Insisting on individual dispersal *knowing* it destroys the community, combined with assimilationist education, demonstrates intent to eliminate the group *as a group*. This mirrors the assimilation case where "benefit" masked destructive intent.
      3.  **Outcome:** The demographers confirm the predictable result is the group's disappearance – the core element recognized in the Assimilation case and Srebrenica.
      4.  **Distinction from Cultural Destruction Case:** Here, the group is *not* staying physically intact on their land. They are being forcibly dispersed *and* their physical means of survival *as a herding community* are being destroyed, leading to biological/cultural dissolution. It's more than just losing shrines/language; it's losing the foundation of their existence.

  *   **Why it's Not a Clear NO (like Cultural Destruction):** The group *isn't* staying in their villages. They are being scattered. Their *physical* survival as a distinct community is being directly undermined by the destruction of their environmental base and forced dispersal, not just their cultural practices.

  ### If Precedents Don't Fully Settle It (The Deadlock Explained)
  The precedents create tension between **mechanism specificity** (Strict Treaty rule) and **outcome focus** (Group Destruction rule). The dam case sits in the grey area:

  *   **Voting YES commits to:** An expansive but precedented view where the *predictable destruction of the group* through state actions meeting *broad interpretations* of Genocide Convention articles (especially II(c) & II(e)) constitutes genocide, *even without explicit "destroy the group" rhetoric* and where the mechanism is environmental destruction and forced assimilation through dispersal/schools. It prioritizes the outcome and the state's deliberate actions causing it.
  *   **Voting NO commits to:** A stricter interpretation requiring either 1) More *direct* genocidal acts (like killings, systematic rape, explicit child transfers) or 2) *Explicit, documented intent* by the state to physically destroy the group, beyond the foreseeable consequences of "development" policies. It demands a closer textual match to the Convention's listed acts and clearer proof of specific genocidal intent.

  ### The Crucial Missing Detail
  One extra detail could definitively show which rule dominates:

  *   **In the Forced Assimilation case, what was the *primary stated justification* the board used for "YES"?**
      *   **If it heavily emphasized "forcibly transferring children" (Art. II(e)):** This leans towards **Strict Treaty + Group Survival**. A NO vote in the dam case becomes more consistent unless forced child transfers are also happening here.
      *   **If it emphasized the *inevitable destruction of the group as a distinct entity* as the core reason, with Art. II(e) being *one way* it was achieved:** This strongly supports the **Irreversible Group Destruction** rule. A YES vote in the dam case is essential for consistency, as the *outcome* (group disappearance) is identical, even if the *primary mechanism* differs (dispersal/destruction of conditions of life vs. direct child transfer).

  **Conclusion:** Based on the precedents provided, particularly the **Forced Assimilation case (YES)** and the **Srebrenica case (YES)**, the most consistent vote for the dam/mining case is **YES**. The board has established that genocide does not require mass killings or explicit "destroy" rhetoric, but can occur through acts leading to the irreversible destruction of a group, including forced transfer/assimilation and the deliberate infliction of destructive conditions of life. The demographers' prediction of the group's disappearance within generations due to state actions aligns perfectly with the outcome-focused logic applied in the Forced Assimilation precedent. Voting NO would require stepping back from the logic that justified labeling that assimilation program as genocide.
